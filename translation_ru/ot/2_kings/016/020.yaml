base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: ru
  text: И почил Ахаз со своими предками, и был похоронен со своими предками в Городе Давида[a]. Вместо него воцарился его сын Езекия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «почил со своими предками» — традиционная формула царских летописей, означающая, что Ахаз умер и присоединился к своим предкам.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил со своими предками
  rationale: Устойчивая царская формула сообщает о смерти Ахаза. «Почил» сохраняет образ и торжественно-летописный характер оригинала, а «предки» естественно передаёт אבות в современном русском языке.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Форма нифаль естественно передаётся русской страдательной конструкцией.
- source_word: בְּעִיר דָּוִד
  choice: в Городе Давида
  rationale: Передано как традиционное географическое наименование с прописной буквы.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол обозначает вступление на царство; «воцарился» кратко и точно передаёт этот смысл.
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בְנוֹ
  choice: его сын
  rationale: Родственное обозначение сохранено явно, как в еврейском тексте.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте престолонаследия выражение указывает на занятие места предшественника; русское «вместо него» сохраняет значение замещения.
