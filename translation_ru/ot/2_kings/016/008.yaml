base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: ru
  text: Ахаз взял серебро и золото, находившиеся в доме Яхве и в сокровищницах царского дворца, и послал их царю Ассирии в качестве подкупа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «как дань» или «как дар»; еврейское слово обычно имеет значение «подкуп» или «взятка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычная повествовательная форма глагола לקח; нейтральное «взял» точно передаёт действие без добавочного оттенка насильственного изъятия.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: серебро и золото
  rationale: Сохранены конкретные названия драгоценных металлов как имущества и ценностей.
- source_word: הַנִּמְצָא
  choice: какое нашлось
  rationale: Передаёт пассивное причастие מצא и смысл всего имевшегося там в наличии; согласование в единственном числе отражает еврейскую форму, относящуюся к совокупности серебра и золота.
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет буквальный образ «дома» и передаёт тетраграмматон личным именем «Яхве».
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: и в сокровищницах царского дворца
  rationale: אֹצְרוֹת — помещения или хранилища для ценностей; «царский дворец» естественно передаёт идиому «дом царя» в современном русском языке.
- source_word: וַיִּשְׁלַח לְמֶלֶךְ אַשּׁוּר
  choice: и послал это царю Ассирии
  rationale: Местоимение «это» естественно обозначает собранные серебро и золото как единый платёж; косвенное дополнение точно передаёт направление отправки.
- source_word: שֹׁחַד
  choice: как подкуп
  rationale: Слово обычно обозначает подкуп или взятку. «Подкуп» здесь естественнее применительно к межгосударственному платежу и сохраняет отрицательную оценочную окраску.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Характер платежа שֹׁחַד
  choice: подкуп
  alternative: дань или дар
  rationale: Основное лексическое значение имеет отрицательную окраску; при этом примечание сохраняет возможные контекстуальные варианты и не устраняет политическую неоднозначность платежа.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Дом Яхве» сохраняет исходную метафору, а «царский дворец» избегает неестественного русского выражения «дом царя». Маркер [a] поставлен непосредственно после спорного слова.
