base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: ru
  text: 'Кроме того, Манассия пролил очень много невинной крови — так что наполнил ею Иерусалим от края до края[a], — не считая его греха: он ввёл Иудею в грех, так что она делала зло в глазах Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из уст в уста»; еврейская идиома означает весь город, от одного края до другого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Кроме того
  rationale: Передаёт добавочное и усилительное значение оборота, вводящего ещё одно обвинение против Манассии.
- source_word: דָּם נָקִי שָׁפַךְ
  choice: пролил невинную кровь
  rationale: Сохраняет обычное библейское выражение о кровопролитии людей, не заслуживающих смерти, и его правовой и нравственный смысл.
- source_word: הַרְבֵּה מְאֹד
  choice: столько ... что
  rationale: В сочетании с последующим עַד אֲשֶׁר естественно передаёт чрезвычайный масштаб кровопролития и связь с его результатом.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: что наполнил ею Иерусалим от края до края
  rationale: Местоимение «ею» ясно указывает на кровь, а русский оборот «от края до края» передаёт значение еврейской идиомы буквально «от устья до устья».
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: не считая того греха
  rationale: Показывает, что кровопролитие было дополнительным преступлением наряду с грехом, описанным далее; единственное число сохранено.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: что он ввёл Иудею в грех
  rationale: Передаёт каузативную форму глагола חטא и активную ответственность Манассии, сохраняя при этом естественный русский синтаксис.
- source_word: לַעֲשׂוֹת הָרַע
  choice: заставив её делать зло
  rationale: Передаёт инфинитив как содержание и результат того, что Манассия ввёл Иудею в грех; местоимение устраняет возможную неясность субъекта в русском языке.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет прозрачную еврейскую оценочную метафору и передаёт тетраграмматон личным именем.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; «Яхве» передаёт его транслитерацией, не заменяя титулом.
- issue: Степень ответственности Манассии в הֶחֱטִיא
  choice: ввёл Иудею в грех, заставив её делать зло
  alternative: склонил Иудею ко греху; побудил Иудею грешить
  rationale: Каузативная порода глагола прямо приписывает Манассии деятельную роль. Выбранная формулировка сохраняет эту силу, не добавляя утверждений сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «столько… что» естественно передаёт усиление и следствие; образ «в глазах Яхве» сохранён как понятная исходная метафора.
