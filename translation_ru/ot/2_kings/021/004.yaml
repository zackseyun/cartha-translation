  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: ru
  text: 'Он построил жертвенники в доме Яхве[a], о котором Яхве сказал: «В Иерусалиме Я положу Своё имя»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме Яхве». Буквально: «в доме Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «положу Своё имя» — язык храмового завета: оно говорит о месте, которое Яхве избрал, чтобы связать с ним Своё имя и присутствие.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָה
  choice: Он построил
  rationale: Форма wayyiqtol продолжает повествовательную последовательность. В современном русском начальный союз не обязателен, поэтому перевод передаёт действие естественно и без излишней буквальности.
- source_word: מִזְבְּחֹת
  choice: жертвенники
  rationale: Множественное число от מִזְבֵּחַ, обычного обозначения жертвенника; прямой и естественный русский эквивалент.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Буквально «в доме Яхве». Такая передача сохраняет образ исходного текста; в данном контексте речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: о котором Яхве сказал
  rationale: Относительное местоимение естественно соотносится с «домом Яхве». Прошедшее «сказал» обозначает ранее произнесённые слова без необходимости добавлять отсутствующие в еврейском тексте элементы.
- source_word: בִּירוּשָׁלִַם
  choice: В Иерусалиме
  rationale: Предлог בְּ выражает место, а начальная позиция внутри цитаты сохраняет смысловое выделение Иерусалима.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: Я помещу Своё имя
  rationale: Сохранена храмово-заветная формула с глаголом שׂים и словом «имя» без истолковывающей замены на «присутствие». Возвратное «Своё» естественно для русского при совпадении обладателя с подлежащим.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как собственное имя. «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Храмовое богословие выражения «помещу Своё имя»
  choice: Сохранить исходную идиому без поясняющего расширения
  alternative: «утвержу там Своё присутствие»; «поселю там Своё имя»
  rationale: Формула указывает на избранное Богом место, связанное с Его именем и присутствием, однако сам стих выражает это сдержанно. Близкая передача сохраняет богословскую насыщенность и не снимает заложенную в образе напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся ясным для широкого читателя; буквальный образ «дом Яхве» сохранён и пояснён в сноске.
