id: 2KI.21.8
reference: 2 Kings 21:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: ru
  text: И Я больше не заставлю ногу Израиля скитаться вдали от земли, которую Я дал их отцам[a], — если только они будут тщательно исполнять всё, что Я повелел им, и весь Закон[b], который заповедал им Мой слуга Моисей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их предкам». «Отцы» — традиционное заветное обозначение праотцов Израиля.'
    reason: lexical_alternative
  - marker: b
    text: «Закон» можно также перевести как «наставление»; здесь имеется в виду Тора, данная Израилю через Моисея.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: больше не заставлю
  rationale: 'Сочетание לֹא с יסף передаёт прекращение повторного действия: «больше не» или «вновь не». Такая передача естественна по-русски и сохраняет временной оттенок.'
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: заставлю ногу Израиля скитаться
  rationale: Сохранены единственное число רֶגֶל и конкретный образ вынужденного скитания или перемещения народа; более прямое «изгоню Израиль» устранило бы метафору.
- source_word: מִן הָאֲדָמָה
  choice: вдали от земли
  rationale: Предлог מִן обозначает удаление от данной Израилю земли. «Вдали от земли» позволяет сохранить связь с образом скитающейся ноги и избежать неестественного русского «скитаться от земли».
- source_word: לַאֲבוֹתָם
  choice: их отцам
  rationale: Буквально передано заветное обозначение праотцов Израиля; возможное современное пояснение «предкам» вынесено в сноску.
- source_word: רַק אִם
  choice: если только
  rationale: Передаёт реальное условие с ограничительной силой, не смягчая и не усиливая его.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: будут тщательно исполнять
  rationale: Идиома выражает внимательное соблюдение с целью исполнения; «тщательно исполнять» естественно объединяет оба оттенка.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִים
  choice: всё, что Я повелел им
  rationale: Русское «исполнять всё, что» естественно передаёт соответствие всей совокупности повелений, выраженное כְּכֹל.
- source_word: וּלְכָל הַתּוֹרָה
  choice: и весь Закон
  rationale: В контексте Моисеева завета תּוֹרָה обозначает данный через Моисея Закон, хотя исходно слово может значить также «наставление».
- source_word: עַבְדִּי מֹשֶׁה
  choice: Мой слуга Моисей
  rationale: Сохраняется почётное обозначение Моисея как Божьего служителя; «слуга» ясно и современно, не добавляя церковно-конфессиональной окраски.
theological_decisions:
- issue: Условность пребывания Израиля в земле
  choice: 'Сохранено прямое условие: народ не будет вновь вытеснен, если будет тщательно исполнять Божьи повеления и Закон Моисея.'
  alternative: Смягчить условие как риторическое либо истолковать его через безусловность иных обетований.
  rationale: רַק אִם явно вводит ограничительное условие. Перевод сохраняет напряжение между дарованием земли и требованием послушания, не разрешая его за пределами данного стиха.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Необычный образ «нога Израиля» намеренно сохранён из еврейского текста; прописные местоимения при обращении Бога о Себе соответствуют принятой русской библейской орфографической традиции.
