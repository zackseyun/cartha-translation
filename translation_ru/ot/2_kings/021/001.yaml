  text: בֶּן שְׁתֵּ֨ים עֶשְׂרֵ֤ה שָׁנָה֙ מְנַשֶּׁ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֥ם אִמּ֖/וֹ חֶפְצִי בָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: ru
  text: Манассии было двенадцать лет, когда он стал царём, и он царствовал в Иерусалиме пятьдесят пять лет. Его мать звали Хефциба[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имя Хефциба означает примерно: «Моя отрада — в ней».'
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: было двенадцать лет
  rationale: Стандартная древнееврейская формула указания возраста передана естественным современным русским выражением.
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция указывает на возраст Манассии при вступлении на престол; выбран естественный русский эквивалент царской хронологической формулы.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Использована укоренившаяся русская библейская форма личного имени.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: пятьдесят пять лет
  rationale: Сочетание числительных передано по нормам современного русского языка.
- source_word: מָלַךְ
  choice: царствовал
  rationale: В сообщении о продолжительности правления глагол מלך точно и естественно передаётся словом «царствовал».
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог ב имеет здесь обычное значение места.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Еврейская именная формула передана естественным современным русским синтаксисом без потери смысла.
- source_word: חֶפְצִי בָהּ
  choice: Хефциба
  rationale: Имя транслитерировано в соответствии с укоренившейся русской библейской традицией; его значение пояснено в сноске.
