  text: וַ/יַּךְ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: ru
  text: Но народ страны перебил всех, кто составил заговор против царя Амона, и поставил царём вместо него его сына Иосию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: перебил
  rationale: В данном контексте נכה обозначает смертельную расправу над всей группой заговорщиков. «Перебил» естественно передаёт и насильственное действие, и множественность жертв.
- source_word: עַם הָאָרֶץ
  choice: народ страны
  rationale: Сохранено устойчивое еврейское выражение, которое здесь может обозначать население страны либо влиятельную общественно-политическую группу; более конкретное толкование в перевод не вносится.
- source_word: כָּל הַקֹּשְׁרִים
  choice: всех, кто составил заговор
  rationale: Причастие от קשר обозначает участников заговора. Глагольная конструкция по-русски ясна и сохраняет связь с уже совершённым заговором.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: против царя Амона
  rationale: При קשר предлог עַל выражает направленность враждебного заговора против царя.
- source_word: וַיַּמְלִיכוּ
  choice: поставил царём
  rationale: Каузативная форма מלך означает сделать кого-либо царём. Этот вариант точен и не добавляет отсутствующего в тексте обряда коронации.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: его сына Иосию
  rationale: Естественный русский порядок слов ясно указывает, что Иосия был сыном Амона.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: 'Выражение обозначает царское преемство: Иосия занял место Амона.'
- source_word: וַ
  choice: Но
  rationale: 'Начальный союз передаёт контраст с предыдущим стихом: после убийства Амона заговорщиками народ страны расправился с ними и возвёл на престол его сына.'
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Повтор подлежащего во второй части еврейского текста не воспроизведён: в русском однородные сказуемые «перебил» и «поставил» однозначно относятся к «народу страны», а буквальный повтор звучал бы тяжеловесно. Социально-политическая неоднозначность выражения «народ страны» сохранена.'
