lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: говорил
  rationale: Пиэль глагола דבר означает «говорить». Форма «говорил» естественно вводит последующее пророческое возвещение и сохраняет повествовательную связь с контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: בְּיַד
  choice: через
  rationale: Буквально «рукою»; здесь это устойчивое обозначение посредничества. Русское «через» ясно и естественно передаёт смысл.
- source_word: עֲבָדָיו
  choice: Своих слуг
  rationale: В контексте пророческого служения עבד обозначает тех, кто исполняет Божье поручение; «слуг» здесь точнее и естественнее, чем «рабов».
- source_word: הַנְּבִיאִים
  choice: пророков
  rationale: Определённое существительное во множественном числе поясняет, кто именно назван слугами.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Еврейская формула вводит прямую речь. В современном русском её функцию естественно выполняет двоеточие, без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Тире показывает пояснительное отношение: слуги здесь — пророки. Формула לֵאמֹר передана двоеточием как естественным русским способом ввести речь, продолжающуюся в следующем стихе.'
