  naturalness: 'Фраза «И говорил Яхве через Своих слуг — пророков» понятна, но прошедшее несовершенного вида здесь стилистически слабее. Строчная буква в местоимении «своих» соответствует современной нейтральной литературной норме: прописная не требуется и может выглядеть конфессионально-редакторской. Двоеточие естественно вводит речь, продолжающуюся в следующем стихе.'
