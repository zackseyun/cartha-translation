  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: ru
  text: Слуги Амона составили против него заговор и умертвили царя в его доме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: составили заговор
  rationale: В политическом контексте קשר обозначает организацию заговора; это естественная и точная русская передача.
- source_word: עַבְדֵי אָמוֹן
  choice: слуги Амона
  rationale: Сохраняет конструкцию принадлежности и не сужает значение до «чиновников» или «придворных».
- source_word: עָלָיו
  choice: против него
  rationale: При глаголе со значением заговора предлог על указывает, против кого он направлен.
- source_word: וַיָּמִיתוּ
  choice: умертвили
  rationale: Передаёт каузативную форму глагола מות и соответствует сдержанному повествовательному регистру; вариант «предали смерти» мог бы ошибочно подразумевать официальную казнь.
- source_word: אֶת־הַמֶּלֶךְ
  choice: царя
  rationale: Еврейский текст употребляет титул, а не повторяет имя Амона.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: Буквально передаёт существительное בית с местоименным суффиксом; усилительное «собственном» отсутствует в исходном тексте.
