base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: ru
  text: Амону было двадцать два года, когда он стал царём, и два года он царствовал в Иерусалиме. Его мать звали Мешуллемет; она была дочерью Харуца из Йотвы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: Амону было двадцать два года
  rationale: Стандартная древнееврейская формула возраста передана естественным современным русским языком.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Инфинитивная конструкция с בְּ обозначает время вступления на царство; такой перевод ясен и естественен по-русски.
- source_word: מָלַךְ
  choice: он царствовал
  rationale: Глагол обозначает осуществление царской власти, а не только обладание титулом.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое и нормативное обозначение места.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная русская передача генеалогической формулы без утраты содержания.
- source_word: מְשֻׁלֶּמֶת
  choice: Мешуллемет
  rationale: Имя транслитерировано с учётом древнееврейской формы.
- source_word: בַּת חָרוּץ
  choice: дочерью Харуца
  rationale: Стандартная передача древнееврейского указания на отца.
- source_word: מִן יָטְבָה
  choice: из Йотвы
  rationale: Предлог מִן указывает на происхождение; «из Йотвы» естественно передаёт это значение.
