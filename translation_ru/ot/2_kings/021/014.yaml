base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: ru
  text: И Я покину остаток Моего наследия[a] и отдам их в руки их врагов; они станут добычей и предметом разграбления для всех своих врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моего удела»; также возможно: «Моего достояния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: И Я оставлю
  rationale: Глагол נטשׁ выражает оставление или покидание. «Оставлю» естественно звучит по-русски и сохраняет судебно-заветную силу контекста; более резкое «покину» возможно, но менее соответствует достоинству регистра.
- source_word: שְׁאֵרִית
  choice: остаток
  rationale: «Остаток» передаёт то, что сохранилось после суда или бедствия, и сохраняет устойчивую библейскую лексику.
- source_word: נַחֲלָתִי
  choice: Моего наследия
  rationale: נחלה обозначает наследие, удел или принадлежащую кому-либо долю. «Моего наследия» сохраняет язык принадлежности Богу и не уточняет без необходимости, идёт ли речь исключительно о народе или земле.
- source_word: וּנְתַתִּים בְּיַד
  choice: и отдам их в руки
  rationale: Буквальный образ передачи «в руку» означает отдачу под власть врагов. Русское множественное «в руки» является естественным эквивалентом этой идиомы.
- source_word: אֹיְבֵיהֶם
  choice: их врагов / своих врагов
  rationale: В обоих случаях сохранено значение «враги». Во втором употреблении возвратное «своих» требуется нормами русского языка при соотнесении с подлежащим «они».
- source_word: וְהָיוּ
  choice: они станут
  rationale: В данном контексте היה описывает последующий результат передачи врагам, поэтому динамическое «станут» точнее простого «будут».
- source_word: לְבַז וְלִמְשִׁסָּה
  choice: добычей и трофеем
  rationale: Сохранена риторическая пара близких по смыслу слов, обозначающих захваченное и разграбляемое. «Добыча и трофей» понятно современному читателю и не сливает два еврейских существительных в одно.
- source_word: לְכָל אֹיְבֵיהֶם
  choice: для всех своих врагов
  rationale: 'Предлог לְ передаёт отношение или результат: остаток станет предметом захвата для всех врагов.'
theological_decisions:
- issue: Заветный оттенок выражения נַחֲלָתִי
  choice: «Моего наследия» — принадлежащего Богу удела, без дальнейшего сужения смысла
  alternative: «Моего удела» или «Моего достояния»
  rationale: Еврейское слово допускает значения наследия, удела и владения. Формулировка сохраняет представление о принадлежности Богу, но не добавляет утверждений сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся близким к еврейскому, но идиома בְּיַד естественно передана как «в руки». Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
