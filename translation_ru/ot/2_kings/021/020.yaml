  text: Он делал зло в глазах Яхве, как делал Манассия, его отец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Устойчивое древнееврейское выражение עשה הרע означает «делать зло»; начальный וַ־ продолжает повествование и не требует отдельного перевода союзом «и» в современном русском тексте.
- source_word: בְּעֵינֵי יְהוָה
  choice: перед Яхве
  rationale: Естественная русская передача древнееврейского оценочного оборота «в глазах Яхве»; буквальный образ сохранён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: как и
  rationale: В данном контексте краткая русская сравнительная конструкция естественно выражает уподобление поступков Амона поступкам его отца; повтор глагола по-русски не обязателен.
- source_word: מְנַשֶּׁה אָבִיו
  choice: его отец Манассия
  rationale: Сохраняет имя и родственное отношение, выраженное существительным с местоименным суффиксом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Характер нравственной оценки הָרַע
  choice: зло
  alternative: неугодное
  rationale: Слово הָרַע прямо обозначает зло. Вариант «неугодное» ослабил бы нравственную оценку текста и свёл бы её лишь к неодобрению.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Выражение «делал зло» сохраняет библейскую нравственную определённость, а «перед Яхве» звучит естественнее буквального «в глазах Яхве».
