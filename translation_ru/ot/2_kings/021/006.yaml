  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: ru
  text: Он провёл своего сына через огонь[a], занимался прорицанием и гаданием[b], имел дело с медиумами и вызывателями духов[c]. Он совершал много зла в глазах Яхве, вызывая Его гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явной передачей смысла: «принёс своего сына в жертву в огне». Буквально по-еврейски: «провёл своего сына через огонь».'
    reason: alternative_reading
  - marker: b
    text: «Гаданием» можно также перевести как «толкованием знамений».
    reason: lexical_alternative
  - marker: c
    text: Еврейское выражение неясно; оно может шире обозначать использование услуг медиумов и вызывателей духов или иное участие в их деятельности.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: провёл своего сына через огонь
  rationale: Сохраняет образную форму еврейской идиомы, связанной с обрядом детского жертвоприношения, не уточняя в основном тексте характер действия сверх сказанного в источнике.
- source_word: וְעוֹנֵן
  choice: занимался прорицанием
  rationale: Передаёт запрещённое оккультное предсказание будущего естественным современным русским выражением.
- source_word: וְנִחֵשׁ
  choice: гаданием
  rationale: Обозначает дивинацию, в том числе истолкование знамений, и сохраняет различие с предшествующим термином настолько, насколько это возможно в ясном русском тексте.
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: обращался к вызывающим духов и знахарям
  rationale: Трудная идиома буквально говорит о том, что царь «делал» ов и йиддеоним. Русское «обращался к» естественно передаёт вовлечённость в деятельность таких практиков, не утверждая, что он их назначал; названия переданы функционально.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: Он много делал зла
  rationale: Естественно передаёт усилительное значение רבה с инфинитивом и субстантивированное «зло», избегая неестественной кальки «умножал делать».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет прозрачную еврейскую оценочную метафору и передаёт тетраграмматон согласно принятой политике проекта.
- source_word: לְהַכְעִיס
  choice: вызывая Его гнев
  rationale: Передаёт каузативное значение и допускаемую контекстом оттенённость цели или результата.
theological_decisions:
- issue: Степень явности выражения, относящегося к жертвоприношению ребёнка
  choice: Сохранить в основном тексте «провёл своего сына через огонь»
  alternative: «принёс своего сына в жертву, сжёгши его в огне»
  rationale: Контекст обряда убедительно указывает на детское жертвоприношение, однако сама еврейская формула остаётся идиоматической; примечание сообщает вероятный смысл, не подменяя им формулировку источника.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя и соответствует политике проекта в отношении тетраграмматона.
- issue: Характер связи לְהַכְעִיס с предшествующим действием
  choice: «вызывая Его гнев»
  alternative: «чтобы вызвать Его гнев»
  rationale: Форма может выражать цель или результат; деепричастный оборот не вынуждает однозначно выбрать только намеренную цель.
translation_notes:
  register: Современный литературный русский язык; достоинство библейского повествования сочетается с ясным синтаксисом. Термины оккультных практик переданы доступно, без архаической перегруженности. Местоимение «Его» написано с прописной буквы согласно распространённой русской религиозной издательской норме.
