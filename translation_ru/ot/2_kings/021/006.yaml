  verdict: revise
  source_fidelity: Основной текст верно сохраняет идиому «провёл своего сына через огонь» и не превращает её безоговорочно в описание конкретного обряда. «Прорицание и гадание» приемлемо передаёт два различных термина divinatory-практик. Однако «знахари» означает прежде всего народных целителей и не передаёт יִדְּעֹנִים; также «обращался к» несколько уже, чем трудная идиома עָשָׂה ... , для которой предпочтительнее широкое «имел дело с». Сноска a чрезмерно конкретизирует предполагаемое жертвоприношение словом «сжёгши», которого в еврейской формуле нет.
  naturalness: «Он много делал зла» понятно, но для современного литературного русского естественнее «Он совершал много зла». «Медиумы и вызыватели духов» — ясные и функционально точные обозначения практиков; они лучше, чем «знахари».
  terminology: Яхве передано последовательно. Термины «медиумы» и «вызыватели духов» сохраняют различие между אוב и יִדְּעֹנִים, не вводя ложной ассоциации с лечением. Деепричастие «вызывая Его гнев» адекватно не разрешает окончательно оттенок цели либо результата.
