  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: ru
  text: И протяну над Иерусалимом мерный шнур Самарии и отвес дома Ахава[a], и вытру Иерусалим, как вытирают блюдо[b], вытирая его и переворачивая вверх дном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мерный шнур и отвес — строительные инструменты. Здесь этот образ означает, что Иерусалим будет измерен для суда той же мерой, что Самария и дом Ахава.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чашу». Еврейское слово может обозначать блюдо, тарелку или неглубокую чашу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: И протяну над
  rationale: Глагол נָטָה означает «протягивать, простирать»; вместе с קָו и предлогом עַל передаёт конкретный образ мерной верви, протянутой над Иерусалимом.
- source_word: קָו
  choice: мерная вервь
  rationale: Кָו обозначает шнур или линию для измерения. «Мерная вервь» сохраняет древний строительный образ и звучит достойно, оставаясь понятной из контекста и примечания.
- source_word: מִשְׁקֹלֶת
  choice: отвес
  rationale: Слово обозначает утяжелённый измерительный инструмент; «отвес» — точный и общеупотребительный русский эквивалент.
- source_word: בֵּית אַחְאָב
  choice: дом Ахава
  rationale: Обычное династическое выражение, обозначающее царский род Ахава; буквальная форма естественна для библейского русского регистра.
- source_word: וּמָחִיתִי
  choice: и вытру
  rationale: Следующее сравнение с вытиранием блюда определяет конкретное значение глагола и позволяет сохранить намеренное повторение корня.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: как вытирают блюдо
  rationale: Неопределённая форма 3-го лица выражает общее действие; русское безлично-обобщённое «как вытирают» не добавляет конкретного действующего лица.
- source_word: מָחָה
  choice: вытрут его
  rationale: Повтор глагола сохранён как усиление и конкретизация действия. Будущая форма естественно продолжает русское сравнение «как вытирают».
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: и перевернут вверх дном
  rationale: Буквально «перевернут на её лицо»; применительно к блюду естественный русский эквивалент — «перевернут вверх дном».
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Традиционная русская форма географического названия.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Традиционная русская форма географического названия.
theological_decisions:
- issue: Смысл мерной верви Самарии и отвеса дома Ахава
  choice: Иерусалим будет подвергнут суду по той же мере, что Самария и дом Ахава.
  alternative: В других контекстах измерительные инструменты могут символизировать восстановление и строительство.
  rationale: Непосредственный контекст осуждения и последующий образ вытертого и перевёрнутого блюда указывают здесь на суд и опустошение, однако перевод сохраняет сам образ, не заменяя его толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Конкретные образы оригинала сохранены; «мерная вервь» поддерживает древнюю строительную метафору, а примечание разъясняет её. Род существительного «блюдо» потребовал формы среднего рода в продолжении сравнения.
