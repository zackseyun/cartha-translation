  text: וַ/יַּעֲזֹ֕ב אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑י/ו וְ/לֹ֥א הָלַ֖ךְ בְּ/דֶ֥רֶךְ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: ru
  text: Он оставил Яхве, Бога своих отцов, и не ходил путём Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: оставил
  rationale: Глагол עזב означает «оставлять, покидать, отвергать». «Оставил» естественно звучит по-русски и в данном контексте передаёт отказ от верности Богу, не усиливая значение сверх выраженного в исходном тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет различие между Божьим именем и титулом «Господь».
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Бога своих отцов
  rationale: Формально близкая передача еврейского сочетания сохраняет мужское множественное אֲבֹתָיו и его родовой, заветный оттенок.
- source_word: וְלֹא הָלַךְ
  choice: и не ходил
  rationale: Сохранена понятная в русском библейская метафора поведения и образа жизни, выраженная глаголом הלך.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: путём Яхве
  rationale: Творительный падеж естественно передаёт еврейское בְּדֶרֶךְ и сохраняет метафору пути как угодного Яхве образа жизни.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Родовое обозначение אֲבֹתָיו
  choice: своих отцов
  alternative: своих предков
  rationale: «Отцов» непосредственно отражает мужскую форму исходного текста и сохраняет традиционное заветно-родовое выражение.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и параллельной структуры еврейского стиха. Библейская метафора «ходить путём» оставлена как ясная и содержательно значимая.
