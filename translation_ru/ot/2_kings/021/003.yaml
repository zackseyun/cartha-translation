base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: ru
  text: Он вновь построил святилища на высотах, которые уничтожил его отец Езекия, воздвиг жертвенники Ваалу и сделал Ашеру, как некогда Ахав, царь Израиля. Он поклонялся всему небесному воинству и служил ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּבֶן
  choice: вновь построил
  rationale: Сочетание буквально означает «вернулся и построил», но здесь естественно передаёт возобновление разрушенных сооружений.
- source_word: הַבָּמוֹת
  choice: святилища на высотах
  rationale: Передаёт культовый характер бамот и сохраняет их связь с возвышенными культовыми местами; просто «высоты» в современном русском недостаточно ясно.
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: жертвенники Ваалу
  rationale: Дательный падеж естественно передаёт посвящение жертвенников Ваалу.
- source_word: אֲשֵׁרָה
  choice: Ашеру
  rationale: Транслитерация сохраняет возможную отсылку как к богине, так и к связанному с её культом предмету, не разрешая лексическую неоднозначность.
- source_word: כָל־צְבָא הַשָּׁמַיִם
  choice: всему небесному воинству
  rationale: 'Традиционно понятное и близкое к форме оригинала выражение сохраняет широкий смысл: небесные светила или почитаемые небесные силы.'
- source_word: וַיַּעֲבֹד אֹתָם
  choice: служил ему
  rationale: В русском собирательное «воинство» требует единственного числа; смысл культового служения сохраняется.
theological_decisions:
- issue: Значение слова אֲשֵׁרָה
  choice: Сохранено имя «Ашера» без пояснения в основном тексте.
  alternative: «священный столб» или «изваяние Ашеры»
  rationale: Само еврейское слово может обозначать богиню либо её культовый объект; конкретизация сняла бы подлинную неоднозначность.
- issue: Природа «небесного воинства»
  choice: Сохранено широкое выражение «небесное воинство».
  alternative: «небесные светила»
  rationale: Оригинал не ограничивает выражение исключительно астрономическими телами, поэтому перевод не должен заранее определять объект культа.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён до двух предложений ради ясности; «как некогда» естественно связывает поступок Манассии с примером Ахава.
