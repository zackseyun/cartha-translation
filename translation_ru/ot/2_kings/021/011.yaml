base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: ru
  text: «За то, что Манассия, царь Иудеи, совершил эти мерзости, сделал больше зла, чем совершили все аморреи, жившие до него, и своими идолами[a] также ввёл Иудею в грех,»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово גִּלּוּלִים — презрительное обозначение идолов; возможно также: «мерзкие идолы», а более буквально и резко — «навозные идолы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: За то, что
  rationale: Сохраняет причинное значение оборота и естественно вводит основание грядущего приговора в следующем стихе.
- source_word: עָשָׂה
  choice: совершил
  rationale: В сочетании с «мерзости» литературное «совершил» естественно передаёт завершённое действие обвиняемого.
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: Манассия, царь Иудеи
  rationale: Передаёт имя и приложение с царским титулом в обычной русской форме.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: эти мерзости
  rationale: Слово «мерзости» сохраняет сильную нравственно-религиозную оценку תּוֹעֵבוֹת и привычно для возвышенной библейской речи.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: сделал больше зла, чем все ...
  rationale: Явно передаёт сравнительную конструкцию и значение действия во зло, не ослабляя обвинения.
- source_word: הָאֱמֹרִי
  choice: аморреи
  rationale: Формально единственное этническое наименование употреблено собирательно; русское множественное число ясно передаёт народ как группу.
- source_word: אֲשֶׁר לְפָנָיו
  choice: жившие до него
  rationale: Естественно передаёт предшествование аморреев Манассии, не добавляя отсутствующего в тексте уточнения «в этой земле».
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: также ввёл Иудею в грех
  rationale: 'Сохраняет каузативное значение породы Hiphil: Манассия не просто грешил вместе с народом, а побудил Иудею грешить.'
- source_word: בְּגִלּוּלָיו
  choice: своими идолами
  rationale: Инструментальный творительный естественно передаёт בְּ; «идолы» ясно выражает предмет поклонения, а презрительный оттенок еврейского слова пояснён в сноске.
theological_decisions:
- issue: Презрительная окраска גִּלּוּלִים
  choice: идолами
  alternative: мерзкими идолами; навозными идолами
  rationale: Основной текст остаётся ясным и достойным по регистру, тогда как сильная презрительная образность исходного слова сохраняется в примечании без её неоправданного сглаживания.
- issue: Каузативное значение וַיַּחֲטִא
  choice: ввёл Иудею в грех
  alternative: склонил Иудею ко греху; заставил Иудею грешить
  rationale: Формулировка сохраняет ответственность Манассии за вовлечение народа в грех, но не усиливает текст до безусловного принуждения.
translation_notes:
  register: 'Современный литературный русский с достоинством пророческого обвинения. Сохранена незавершённость синтаксической конструкции: стих начинается причинным оборотом и оканчивается запятой, поскольку главное высказывание следует в стихе 12. Маркер сноски поставлен непосредственно после слова «идолами», к которому относится пояснение.'
