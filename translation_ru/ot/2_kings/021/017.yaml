  text: וְ/יֶ֨תֶר דִּבְרֵ֤י מְנַשֶּׁה֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וְ/חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Прочие деяния Манассии, всё, что он сделал, и его грех, который он совершил, — разве не записаны они в «Книге летописей царей Иудеи»?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в летописи царей Иудеи». Еврейское выражение обозначает царский письменный источник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Прочие деяния Манассии
  rationale: В итоговой формуле о царствовании דִּבְרֵי означает не только «слова», а дела и события правления; «прочие деяния» естественно передаёт этот смысл.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: всё, что он сделал
  rationale: Прямой и естественный перевод относительной конструкции, сохраняющий охват слова כָל.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: и грех, который он совершил
  rationale: Существительное с местоименным суффиксом и однокоренной глагол подчёркивают грех Манассии. По-русски «грех, который он совершил» передаёт это без неестественного повтора «грех, которым он согрешил».
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: Сохранён риторический вопрос, предполагающий утвердительный ответ; «записаны» естественно для архивного контекста и точно передаёт כְּתוּבִים.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: в «Книге летописей царей Иудеи»
  rationale: Предлог עַל в сочетании с письменным источником идиоматически передан как «в». Выражение דִּבְרֵי הַיָּמִים обозначает хронику или летопись; заглавное оформление показывает название упомянутого источника.
