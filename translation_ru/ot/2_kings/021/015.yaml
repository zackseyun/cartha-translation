  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: ru
  text: за то, что они делали то, что зло в Моих глазах, и гневили Меня с того дня, как их отцы вышли из Египта, до сего дня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их предки вышли из Египта». В древнееврейском тексте: «их отцы» — мужской термин родства, обозначающий здесь прежние поколения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Оборот вводит основание суда, объявленного в предыдущем стихе. В продолжении русского предложения «за то, что» естественно передаёт причинную связь.
- source_word: עָשׂוּ אֶת־הָרַע
  choice: они делали зло
  rationale: Устойчивое выражение означает «делать зло». Русский несовершенный вид уместно передаёт повторяющийся исторический образ действий, уточняемый следующей длительной конструкцией.
- source_word: בְּעֵינַי
  choice: в Моих глазах
  rationale: Сохранена ясная и привычная для библейской русской речи древнееврейская оценочная метафора.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: и гневили Меня
  rationale: Сочетание היה с причастием выражает продолжительное или привычное действие. Несовершенный вид «гневили» передаёт длительность и значение каузативной формы — они вызывали Божий гнев.
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: с того дня, когда
  rationale: Естественно обозначает исходную точку непрерывного периода.
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: их отцы вышли из Египта
  rationale: «Вышли из Египта» сохраняет стандартный глагол исхода, а «отцы» формально передаёт мужской термин родства, относящийся к прежним поколениям.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: и до этого дня
  rationale: Сохранены обе границы временного оборота «с… и до…» и продолжающаяся вплоть до указанного момента сила выражения.
theological_decisions:
- issue: Корпоративно-историческая непрерывность вины Израиля со времени исхода
  choice: Сохранить утверждение о продолжающемся из поколения в поколение неповиновении, не сводя его лишь к грехам недавних царей.
  alternative: Понять слова только как риторическое обобщение грехов последних поколений.
  rationale: Стих прямо отсчитывает гневящие Бога поступки от дня выхода отцов из Египта до настоящего момента; перевод не смягчает эту историко-богословскую напряжённость.
- issue: Передача אֲבוֹתָם
  choice: их отцы
  alternative: их предки
  rationale: В древнееврейском употреблён мужской термин родства, который в данном контексте охватывает прежние поколения народа. Основной текст сохраняет форму источника, а более широкое значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Заглавные буквы в местоимениях «Моих», «Меня» ясно указывают на речь Бога и соответствуют распространённой русской издательской традиции. Формулировка рассчитана на синтаксическое продолжение предыдущего стиха.
