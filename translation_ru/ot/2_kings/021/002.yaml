  source_fidelity: 'Основной смысл передан верно: Манассия совершал зло по образцу мерзостей народов, которых Яхве лишил земли ради сынов Израиля. Однако «изгнал перед сынами Израиля» в современном русском может означать, что изгнание происходило у них на глазах, тогда как מִפְּנֵי означает удаление народов от/из-перед Израиля. «От сынов Израиля» ясно передаёт требуемое направление.'
