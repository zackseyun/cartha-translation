  terminology: «Яхве» последовательно передаёт тетраграмматон. «Мерзостные обычаи» удачно выражает оценочное תּוֹעֵבוֹת, не сужая его только до одного вида практик. «Сыны Израиля» сохраняет исходное выражение; в сноске уместен идиоматический вариант.
