  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, следуя мерзостным обычаям народов, которых Яхве изгнал от сынов Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от израильтян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Устойчивая древнееврейская оценочная формула естественно передаётся по-русски как «делать зло»; форма продолжает повествование и описывает образ действий Манассии.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образ древнееврейской идиомы, обозначающей Божью оценку поступков.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: כְּתוֹעֲבֹת הַגּוֹיִם
  choice: следуя мерзостным обычаям народов
  rationale: כְ выражает соответствие или уподобление, а תּוֹעֵבוֹת в контексте обозначает отвратительные, в том числе культовые, обычаи и поступки; такая передача яснее буквального «по мерзостям».
- source_word: הוֹרִישׁ
  choice: изгнал
  rationale: Порода hifil глагола ירש здесь означает лишить владения, вытеснить или изгнать.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: перед сынами Израиля
  rationale: Передача сохраняет пространственный образ מִפְּנֵי и явное филиальное выражение בְּנֵי יִשְׂרָאֵל; более идиоматичный вариант указан в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Смысл כְּתוֹעֲבֹת
  choice: следуя мерзостным обычаям
  alternative: подобно мерзостям
  rationale: Формулировка сохраняет резкую нравственно-религиозную оценку תועבות, но не ограничивает её без достаточного основания только идолопоклонством.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет буквальный родственный образ исходного выражения, а сноска предлагает естественный русский эквивалент.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаических глагольных форм. Выражение «в глазах Яхве» намеренно сохраняет исходную метафору; «мерзостные обычаи» передаёт как нравственную оценку, так и практический смысл множественного תּוֹעֵבוֹת.
