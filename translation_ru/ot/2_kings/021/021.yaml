    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: Он во всём шёл путём, которым шёл его отец
  rationale: Сохраняет еврейскую метафору пути как образа жизни и полноту выражения בְּכָל, оставаясь естественным для современного русского языка.
- source_word: וַיַּעֲבֹד
  choice: служил
  rationale: Передаёт основное значение עבד и сохраняет отличие от последующего глагола поклонения.
- source_word: הַגִּלֻּלִים
  choice: идолам
  rationale: Ясно обозначает предмет ложного поклонения; презрительный оттенок еврейского слова поясняется в сноске, поскольку буквальная передача в основном тексте звучала бы неестественно.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: и поклонялся им
  rationale: Передаёт почтительное склонение или простирание перед идолами и не смешивает этот глагол с предшествующим «служил».
theological_decisions:
- issue: Передача презрительного обозначения идолов גִּלֻּלִים
  choice: идолам
  alternative: мерзким идолам; навозным идолам
  rationale: Нейтральное по форме слово «идолы» ясно передаёт референт, тогда как заложенная в еврейском слове презрительность сохраняется в сноске без стилистической перегрузки основного текста.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры пути. Повтор слова «отец» оставлен в соответствии с еврейским текстом; «служил» и «поклонялся» передают два разных исходных глагола.
