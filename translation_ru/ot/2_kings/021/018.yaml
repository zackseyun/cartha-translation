base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: ru
  text: И почил Манассия с отцами своими[a], и был похоронен в саду при своём доме, в саду Уззы. И вместо него воцарился его сын Амон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лёг с отцами своими»; это обычная еврейская формула, сообщающая о смерти царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: Глагол שׁכב буквально означает «лёг», но в царской формуле сообщает о смерти. «Почил» сохраняет образ и при этом естественно передаёт его смысл в литературном русском языке.
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Сохранена устойчивая для книг Царств генеалогическая формула; вариант «с предками» яснее, но менее точно воспроизводит исходное выражение.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Прямо и естественно передаёт страдательную форму глагола קבר.
- source_word: בְּגַן בֵּיתוֹ
  choice: в саду при своём доме
  rationale: Передаёт связь сада с домом, не вводя отсутствующего в еврейском тексте уточнения «дворец».
- source_word: בְּגַן עֻזָּא
  choice: в саду Уззы
  rationale: Повтор предложной конструкции сохранён как пояснение места погребения; имя עֻזָּא передано традиционной русской формой «Узза».
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол מלך обозначает вступление на царство, что точно и кратко передаёт «воцарился».
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт занятие сыном места предшественника в династической последовательности.
theological_decisions:
- issue: Еврейская формула смерти וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил с отцами своими
  alternative: умер; лёг с отцами своими
  rationale: Выбранная формулировка не сводит образное выражение к одному лишь пояснению «умер» и не делает русский текст неестественным чрезмерно буквальным «лёг»; она сохраняет традиционный образ без дополнительных утверждений о состоянии умерших.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным звучанием. Слова «почил» и «воцарился» уместны в царской хронике и остаются понятными современному читателю; синтаксический повтор исходного текста сохранён.
