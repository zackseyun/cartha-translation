  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: ru
  text: Он построил жертвенники всему небесному воинству[a] в обоих дворах дома Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всему воинству небес». Еврейское выражение «небесное воинство» обозначает совокупность небесных сил или светил; в данном контексте, вероятно, имеются в виду небесные тела или силы, почитавшиеся в астральном культе.'
    reason: Лексическая альтернатива и пояснение сохраняющего неоднозначность еврейского выражения.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Он построил
  rationale: Форма wayyiqtol породы qal от בנה передаёт последовательное действие в повествовании; союз ו в русском естественно не выражать отдельно.
- source_word: מִזְבְּחוֹת
  choice: жертвенники
  rationale: Обычное множественное число существительного со значением «жертвенники».
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: всему небесному воинству
  rationale: Сохраняет устойчивый еврейский образ צבא השמים и не сужает его значение до одних звёзд; в данном контексте речь связана с почитанием небесных светил или сил.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: в обоих дворах
  rationale: Передаёт явное указание на два двора и звучит естественно по-русски.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохраняет образ «дома» как обозначение храма и передаёт личное Божье имя יְהוָה транслитерацией.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» ясно передаёт личное имя и согласуется с предоставленным решением английского POB.
- issue: Значение выражения צְבָא הַשָּׁמָיִם
  choice: небесное воинство
  alternative: небесные светила; звёзды небесные
  rationale: 'Буквально-идиоматическая передача сохраняет смысловую широту выражения: в контексте оно, вероятно, указывает на объекты или силы астрального поклонения, но сам стих не конкретизирует их полностью.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «В обоих дворах» естественнее буквального «в двух дворах», а «дом Яхве» сохраняет храмовый образ оригинала.
