  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Прочие деяния[a] Амона — всё, что он сделал, — разве не записаны в Книге хроник царей Иудеи[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дела». Буквально еврейское слово может означать «слова» или «события», но в этой формуле, завершающей рассказ о царствовании, оно относится к деяниям царя.'
    reason: lexical_alternative
  - marker: b
    text: 'Речь идёт о древнем письменном своде, вероятно о свитке. Всё название можно также передать: «Книга летописей царей Иудеи».'
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие деяния
  rationale: יֶתֶר означает «остаток, прочее», а דִּבְרֵי в формуле царского заключения обозначает дела или деяния царя, а не буквально его «слова».
- source_word: אָמ֖וֹן
  choice: Амона
  rationale: Имя передано в традиционной русской библейской форме; родительный падеж обусловлен синтаксисом.
- source_word: אֲשֶׁר עָשָׂה
  choice: и всё, что он совершил
  rationale: Относительная конструкция конкретизирует совокупность поступков Амона; добавление «всё» естественно передаёт обобщающий смысл без изменения содержания.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: описаны … не так ли?
  rationale: Сохранён риторический вопрос, предполагающий утвердительный ответ. «Описаны» естественно для ссылки на письменную летопись, хотя буквально כְּתוּבִים — «написаны».
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: в Летописи
  rationale: В данном историографическом заглавии סֵפֶר — письменный свод, а דִּבְרֵי הַיָּמִים — хроника или летопись; русское «в» идиоматично передаёт ссылку на содержание документа.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: Префикс לְ здесь выражает отношение летописи к царям Иудеи; родительная конструкция естественна по-русски.
