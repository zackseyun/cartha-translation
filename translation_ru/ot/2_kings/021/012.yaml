  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве, Бог Израиля: «Вот, Я наведу бедствие[a] на Иерусалим и Иудею, так что у каждого, кто услышит об этом, зазвенит в обоих ушах[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастье», «катастрофу». Еврейское רָעָה здесь означает гибельное бедствие как суд, а не нравственное зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «оба его уха зазвенят». Это еврейское выражение передаёт потрясение и ужас от услышанной вести.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Естественная для русского библейского стиля передача пророческой формулы вестника.
- source_word: הִנְנִי מֵבִיא
  choice: Вот, Я наведу
  rationale: «Вот» сохраняет указательно-эмфатическую силу הִנְנִי, а совершенный вид будущего времени естественно выражает объявленное и близкое действие.
- source_word: רָעָה
  choice: бедствие
  rationale: В контексте суда слово означает гибельное несчастье, а не нравственное зло.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: на Иерусалим и Иудею
  rationale: Глагольное сочетание «навести бедствие на» естественно передаёт направленность суда.
- source_word: כָּל שֹׁמְעָיו
  choice: у каждого, кто услышит об этом
  rationale: Местоименный суффикс отнесён к вести о грядущем бедствии; формулировка естественна по-русски.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: зазвенит в обоих ушах
  rationale: Сохраняет телесный образ еврейской идиомы и её смысл — потрясение и ужас от услышанного.
theological_decisions:
- issue: Значение רָעָה в высказывании о Божьем суде
  choice: бедствие
  alternative: зло
  rationale: Здесь говорится о посылаемой каре и катастрофе, а не о нравственном зле; перевод не приписывает Богу морального злодеяния, но сохраняет суровый смысл суда.
- issue: Причинно-результативная связь אֲשֶׁר
  choice: и у каждого, кто услышит об этом
  alternative: так что у каждого, кто услышит об этом
  rationale: Сочинительная конструкция по-русски естественно выражает последующий результат, не превращая его в указание на цель Божьего действия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формула «так говорит» и частица «вот» сохраняют торжественность оригинала без излишней архаизации; образ звона в обоих ушах сохранён и пояснён в сноске.
