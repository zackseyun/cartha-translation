  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הָ/אֲשֵׁרָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה בַּ/בַּ֗יִת אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ אֶל דָּוִד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: ru
  text: 'И он поставил в доме резное изображение Ашеры[a], которое он сделал, — в том доме, о котором Яхве сказал Давиду и его сыну Соломону: «В этом доме и в Иерусалиме, который Я избрал из всех колен Израиля, Я навеки помещу Моё имя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изваяние Ашеры». Еврейское выражение сочетает слова «резное изображение» и «Ашера»; оно обозначает изготовленное изображение, связанное с Ашерой, а не обязательно так называемый столб Ашеры.'
    reason: Лексическая неоднозначность культового термина и формы предмета.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: И он поставил
  rationale: Глагол שׂים обозначает помещение предмета в определённое место; «поставил» естественно передаёт повествовательное прошедшее время и не уточняет способ установки сверх текста.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: изваяние Ашеры
  rationale: פֶּסֶל — высеченное или резное изображение, а הָאֲשֵׁרָה связывает его с Ашерой. «Изваяние» сохраняет конкретный характер предмета и не сводит его к менее точному «столбу Ашеры».
- source_word: בַּבַּיִת / בַּבַּיִת הַזֶּה
  choice: в Храме / в этом Храме
  rationale: Хотя בַּיִת буквально значит «дом», контекст однозначно указывает на Иерусалимский храм. «Храм» в современном русском языке ясно и естественно передаёт референт; повтор сохранён.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: וְאֶל שְׁלֹמֹה בְנוֹ
  choice: и его сыну Соломону
  rationale: Суффикс «его» грамматически отсылает к Давиду; русский порядок слов делает эту связь ясной.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: который Я избрал из всех колен Израиля
  rationale: Форма мужского рода אֲשֶׁר соотносится с Иерусалимом; מן при בחר передаёт выбор из совокупности.
- source_word: אָשִׂים אֶת שְׁמִי לְעוֹלָם
  choice: Я навеки помещу Моё имя
  rationale: Сохранена буквальная храмово-заветная формула «поместить имя». «Навеки» кратко и точно передаёт לְעוֹלָם.
theological_decisions:
- issue: Характер культового предмета, обозначенного פֶּסֶל הָאֲשֵׁרָה
  choice: изваяние Ашеры
  alternative: столб Ашеры; резное изображение Ашеры
  rationale: Наличие פֶּסֶל требует явно обозначить изготовленное изображение, однако генитивная связь допускает понимание как изображения самой Ашеры, так и предмета, связанного с её культом. Основной текст остаётся естественным, а неоднозначность отмечена в сноске.
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано транслитерацией без замены титулом, что соответствует исходному еврейскому тексту и не добавляет конфессионального толкования.
- issue: Формула помещения Божьего имени
  choice: помещу Моё имя
  alternative: утвержу пребывание Моего имени
  rationale: Более буквальная формулировка сохраняет богословское напряжение метонимии «имя» и не разворачивает её в утверждение о способе Божьего присутствия.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаичным звучанием. «Храм» написан с прописной буквы как контекстуальное обозначение конкретного Иерусалимского храма; местоимения в прямой Божьей речи также даны с прописной буквы по устойчивой русской библейской традиции. Тире разграничивает длинное определение и последующее пояснение, не меняя синтаксической связи оригинала.
