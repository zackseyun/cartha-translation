base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: ru
  text: Но они не послушали, и Манассия сбил их с пути, так что они совершали больше зла, чем народы, которых Яхве истребил перед сынами Израиля.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так что они творили зло больше, чем народы». Еврейский предлог выражает сравнение; оно может быть передано как сравнение количества зла или непосредственно как сравнение действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед израильтянами». Еврейский текст буквально говорит: «перед сынами Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: не послушали
  rationale: В данном контексте глагол выражает не просто восприятие на слух, а отказ внять предостережению; «не послушали» сохраняет и смысл слушания, и оттенок неповиновения.
- source_word: וַיַּתְעֵם
  choice: сбил их с пути
  rationale: Каузативная форма от תעה означает, что Манассия заставил народ уклониться. Русское выражение естественно передаёт образ блуждания и нравственно-духовное заблуждение.
- source_word: לַעֲשׂוֹת אֶת הָרָע
  choice: так что они стали творить зло
  rationale: Конструкция обозначает результат воздействия Манассии — совершение зла. «Творить зло» соответствует возвышенному историческому регистру, а оборот «так что они стали» естественно выражает каузативную связь.
- source_word: מִן הַגּוֹיִם
  choice: большее, чем творили народы
  rationale: Предлог מִן имеет сравнительное значение. Добавление повторного «творили» делает сравнение ясным и грамматически естественным по-русски, не меняя его смысла.
- source_word: הִשְׁמִיד
  choice: истребил
  rationale: Глагол обозначает уничтожение; «истребил» сохраняет его силу и уместен в повествовании о вытеснении и уничтожении народов Ханаана.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מִפְּנֵי
  choice: перед
  rationale: В контексте завоевания выражение указывает на устранение народов перед Израилем; буквальное «перед» понятно и сохраняет образ исходного текста.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Основной текст сохраняет буквальную образность и грамматически мужскую форму еврейского выражения; более идиоматичный вариант указан в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача выражения בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Буквальная форма сохраняет образ родовой и заветной общности, не исключая того, что выражение обозначает весь народ.
- issue: Сфера сравнения מִן הַגּוֹיִם
  choice: они творили большее зло, чем народы
  alternative: они поступали хуже народов
  rationale: Выбранный вариант сохраняет прямое упоминание совершения зла и сравнительный смысл, не ослабляя нравственной оценки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сделан естественным для русского читателя, при этом сохранены сравнительная конструкция, образ уклонения с пути и личное имя Яхве.
