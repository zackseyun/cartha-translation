  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: ru
  text: Его похоронили[a] в его гробнице в саду Уззы, а вместо него царём стал его сын Иосия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и он похоронил его». В еврейском тексте глагол стоит в единственном числе, хотя субъект не назван; по-русски в данном контексте естественна неопределённо-личная форма «похоронили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: Его похоронили
  rationale: Формально глагол стоит в 3-м лице единственного числа («он похоронил»), однако субъект не назван. Русская неопределённо-личная конструкция естественно передаёт подразумеваемых участников погребения, не вводя конкретного человека.
- source_word: קְבֻרָתוֹ
  choice: в его гробнице
  rationale: Существительное обозначает место погребения; «гробница» кратко и естественно передаёт конкретное место захоронения в данном повествовательном контексте.
- source_word: גַן עֻזָּא
  choice: в саду Уззы
  rationale: Сохраняется конструкция принадлежности и традиционная русская форма имени עֻזָּא — «Узза».
- source_word: וַיִּמְלֹךְ
  choice: царём стал
  rationale: В формуле престолонаследия глагол обозначает вступление на царство, а не весь период правления.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Выражение указывает на преемство и занятие места предшественника; по-русски «вместо него» точно и естественно передаёт этот смысл.
