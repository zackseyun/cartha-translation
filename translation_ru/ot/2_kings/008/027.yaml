base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: ru
  text: Он шёл путём дома Ахава и делал зло в глазах Яхве, как поступал дом Ахава, потому что был связан брачными узами с домом Ахава[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был зятем дома Ахава». Еврейское слово может обозначать как зятя, так и, шире, человека, связанного с семьёй через брак.'
    reason: Лексическая неоднозначность слова חָתָן.
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: шёл путём
  rationale: Сохраняет еврейскую метафору пути как образа поведения и образа жизни; в данном контексте речь не о физическом перемещении.
- source_word: בֵּית אַחְאָב
  choice: дом Ахава
  rationale: Сохраняет библейский оборот, охватывающий семью, окружение и династическую линию Ахава.
- source_word: וַיַּעַשׂ הָרַע
  choice: делал зло
  rationale: Передаёт устойчивую оценочную формулу книг Царей кратко и естественно для современного русского языка.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет образ исходного текста и выражает Божью нравственную оценку поступков.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: כְּבֵית אַחְאָב
  choice: как и дом Ахава
  rationale: 'Передаёт сравнение; частица «и» делает русский синтаксис ясным, подразумевая: «как делал дом Ахава».'
- source_word: כִּי
  choice: потому что
  rationale: Явно передаёт причинную связь с предшествующей нравственной оценкой.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: был связан брачными узами с домом Ахава
  rationale: Термин חָתָן может обозначать зятя, но также шире — человека, состоящего в родстве через брак. Более широкая формулировка сохраняет лексическую неоднозначность и лучше согласуется с династическим контекстом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе стоит Тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер родства с домом Ахава
  choice: связан брачными узами с домом Ахава
  alternative: был зятем дома Ахава
  rationale: Еврейское חָתָן допускает более узкое значение «зять», однако может указывать на брачное родство шире. Основной текст не разрешает эту неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской метафоры «идти путём» и династического выражения «дом Ахава». Формулировка звучит торжественно, но остаётся понятной обычному читателю.
