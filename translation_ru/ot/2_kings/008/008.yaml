base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: ru
  text: 'И царь сказал Азаилу: «Возьми с собой дар, пойди навстречу человеку Божьему и через него спроси у Яхве: „Выздоровею ли я от этой болезни?“»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Останусь ли я жив после этой болезни?» Еврейский глагол буквально означает «жить» и здесь может подразумевать как выздоровление, так и выживание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: дар
  rationale: В данном повествовательном контексте это подарок, приносимый пророку при обращении за ответом, а не культовое приношение или дань.
- source_word: בְּיָדְךָ
  choice: с собой
  rationale: Буквально «в руке твоей»; современное русское «возьми с собой» естественно передаёт указание лично принести дар, не создавая неуклюжей буквальности.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Инфинитив после «пойди» выражает цель движения — встретиться с человеком Божьим; «пойди навстречу» сохраняет форму и смысл еврейского оборота.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранено устойчивое древнееврейское обозначение пророка и его повествовательно-богословское звучание, без замены толкующим словом «пророк».
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: через него спроси у Яхве
  rationale: Глагол означает обращение за Божьим ответом, а מֵאֹתוֹ указывает на посредничество человека Божьего. Формулировка ясна по-русски и сохраняет обе смысловые стороны.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте, а не замещающий его титул.
- source_word: הַאֶחְיֶה
  choice: выздоровею ли я
  rationale: Буквально глагол означает «буду ли я жить», но в вопросе о болезни он идиоматически выражает надежду пережить её и поправиться; буквальная возможность отмечена в сноске.
- source_word: מֵחֳלִי זֶה
  choice: от этой болезни
  rationale: Естественное современное русское обозначение нынешней болезни царя, хорошо сочетающееся с глаголом «выздороветь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Посредничество человека Божьего при вопрошании
  choice: через него спроси у Яхве
  alternative: спроси его о воле Яхве
  rationale: Еврейская конструкция представляет Яхве источником ответа, а человека Божьего — посредником. Перевод не смешивает адресата вопроса с передающим ответ пророком.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранён традиционный титул «человек Божий»; тяжеловесные кальки вроде «возьми в руку твою» устранены. Маркер сноски поставлен после вопроса, к которому относится лексическое пояснение.
