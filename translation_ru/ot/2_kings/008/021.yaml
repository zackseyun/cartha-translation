  text: וַ/יַּעֲבֹ֤ר יוֹרָם֙ צָעִ֔ירָ/ה וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַֽ/יְהִי ה֞וּא קָ֣ם לַ֗יְלָה וַ/יַּכֶּ֨ה אֶת אֱד֜וֹם הַ/סֹּבֵ֤יב אֵלָי/ו֙ וְ/אֵת֙ שָׂרֵ֣י הָ/רֶ֔כֶב וַ/יָּ֥נָס הָ/עָ֖ם לְ/אֹהָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: ru
  text: Иорам перешёл в Цаир[a] со всеми своими колесницами. Ночью он поднялся и поразил окруживших его эдомитян и начальников колесниц, а народ разбежался по своим шатрам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «в Сеир». Еврейское название צָעִירָה трудно для истолкования; некоторые связывают его с Сеиром, то есть землёй Эдома, а не считают отдельным названием Цаир.'
    reason: alternative_reading
  - marker: b
    text: «Разбежался по своим шатрам» — еврейское выражение, означающее, что люди разошлись и вернулись по домам.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: перешёл
  rationale: Глагол עבר обозначает переход или переправу. «Перешёл» сохраняет пространственный смысл, не предполагая без достаточных оснований конкретной водной преграды.
- source_word: צָעִירָה
  choice: в Цаир
  rationale: 'Масоретская огласовка позволяет понимать форму как название места с направительным окончанием: «в Цаир». Трудность чтения и возможная связь с Сеиром отмечены в сноске.'
- source_word: וְכָל הָרֶכֶב עִמּוֹ
  choice: со всеми своими колесницами
  rationale: רכב здесь естественно понимать собирательно как колесничное войско; конкретное «колесницы» близко к еврейскому образу, а «своими» по-русски ясно передаёт עִמּוֹ — «с ним».
- source_word: קָם לַיְלָה
  choice: ночью он поднялся
  rationale: Перевод сохраняет последовательность и широкий смысл קום, не уточняя без необходимости, поднялся ли царь для выступления, прорыва или внезапного нападения.
- source_word: וַיַּכֶּה
  choice: поразил
  rationale: נכה — широкий глагол нанесения удара. «Поразил» сохраняет военный смысл, но не утверждает полного разгрома.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: окруживших его эдомитян
  rationale: Собирательное «Эдом» в данном военном контексте естественно передано как люди Эдома; причастие сохраняет образ окружения.
- source_word: שָׂרֵי הָרֶכֶב
  choice: начальников колесниц
  rationale: שׂרים означает начальников или военачальников, а конструкция с רכב указывает на командиров колесничного войска. Формулировка не уточняет сверх текста их точный ранг.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: народ разбежался по своим шатрам
  rationale: Сохранены широкое העם («народ») и буквальный образ шатров. «Разбежался» естественно выражает бегство и рассеяние, не снимая возможной неоднозначности того, о каком народе идёт речь.
