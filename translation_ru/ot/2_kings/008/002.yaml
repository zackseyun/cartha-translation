base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: ru
  text: И женщина встала и поступила по слову человека Божьего. Она отправилась вместе со своими домашними и семь лет жила как чужеземка[a] в земле филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более традиционно: «жила как пришелица».'
    reason: 'Лексическая альтернатива: еврейский глагол גור указывает не просто на проживание, а на пребывание в чужой земле в положении пришлого жителя.'
lexical_decisions:
- source_word: וַתָּקָם
  choice: встала
  rationale: Передаёт форму от קום и последовательное ответное действие женщины, сохраняя умеренно торжественный повествовательный тон.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: поступила по слову
  rationale: Естественно передаёт действие в соответствии с данным устно наставлением и сохраняет образ «слова» из еврейского выражения.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устоявшийся библейский титул пророка или посланника Бога; точнее и прозрачнее, чем пояснительная замена «пророк».
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: она отправилась вместе со своими домашними
  rationale: בַּיִת с местоименным суффиксом здесь обозначает домочадцев, а не строение; формулировка также сохраняет личное действие женщины.
- source_word: וַתָּגָר
  choice: жила как чужеземка
  rationale: Глагол גור обозначает проживание вне своей земли в положении пришлого жителя. «Как чужеземка» передаёт этот социальный оттенок яснее, чем просто «жила», не прибегая к архаичному «странствовала».
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: в земле филистимлян
  rationale: Прямо передаёт этногеографическую конструкцию оригинала и сохраняет библейский, но понятный современному читателю оборот.
- source_word: שֶׁבַע שָׁנִים
  choice: семь лет
  rationale: Естественное русское обозначение продолжительности проживания.
