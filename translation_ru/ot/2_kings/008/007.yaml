base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: ru
  text: 'Елисей пришёл в Дамаск. А Бен-Хадад, царь Арама[a], был болен. Ему сообщили: «Человек Божий пришёл сюда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сирии». В еврейском тексте: «Арама».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Форма с последовательным וַ продвигает повествование; русский совершенный вид естественно передаёт завершённое прибытие.
- source_word: אֱלִישָׁע
  choice: Елисей
  rationale: Устоявшаяся русская форма имени пророка.
- source_word: דַּמֶּשֶׂק
  choice: Дамаск
  rationale: Устоявшееся русское название города.
- source_word: וּבֶן־הֲדַד
  choice: В то время Бен-Хадад
  rationale: Союз вводит фоновое обстоятельство, а не очередное действие; «в то время» естественно обозначает этот переход. Форма «Бен-Хадад» ближе к еврейскому имени, чем традиционное «Венадад».
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Сохранено еврейское этногеографическое название «Арам», без подмены его интерпретирующим традиционным названием «Сирия».
- source_word: חֹלֶה
  choice: был болен
  rationale: Предикативное причастие описывает состояние царя; эта формулировка точна и естественна по-русски.
- source_word: וַיֻּגַּד לוֹ
  choice: Ему сообщили
  rationale: Неопределённо-личная русская конструкция естественно передаёт безличный пассив еврейского текста, не называя сообщивших.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейская формула введения речи передана нормативным русским синтаксисом без тяжеловесного буквального «говоря».
- source_word: בָּא
  choice: пришёл
  rationale: Перфект обозначает состоявшееся прибытие с актуальным результатом; в русском контексте это естественно выражает совершенный вид.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Человек Божий
  rationale: Сохранён буквальный и устойчивый библейский титул, а не внесено толкование «пророк Божий».
- source_word: עַד הֵנָּה
  choice: сюда
  rationale: Русское наречие направления точно передаёт прибытие к месту, где находятся говорящие.
