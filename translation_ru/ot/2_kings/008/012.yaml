source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: ru
  text: 'Азаил спросил: «Почему мой господин плачет?» Елисей[a] ответил: «Потому что я знаю, какое зло ты сделаешь сынам Израиля: их укрепления предашь огню[b], их юношей убьёшь мечом, их малых детей разобьёшь и рассечёшь беременных женщин».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он сказал». По контексту отвечает Елисей.'
    reason: clarity
  - marker: b
    text: 'Буквально: «отправишь их укрепления в огонь»; то есть сожжёшь их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: Уважительное обращение Азаила к Елисею; это не божественный титул. «Мой господин» сохраняет почтительность и звучит естественно в торжественном повествовании.
- source_word: בֹכֶה
  choice: плачет
  rationale: Причастие обозначает продолжающееся действие; современное русское «плачет» естественно передаёт его в вопросе.
- source_word: כִּי יָדַעְתִּי
  choice: Потому что я знаю
  rationale: כִּי вводит объяснение, а перфект יָדַעְתִּי здесь выражает наличное знание.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: какое зло ты причинишь
  rationale: Рָעָה осмысляется как вынесенный после относительной конструкции объект действия. Формулировка сохраняет нравственную тяжесть слова и остаётся естественной по-русски.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняется традиционная и прозрачная форма еврейского выражения, корпоративно обозначающего народ Израиля.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: их укрепления предашь огню
  rationale: Буквально говорится об отправлении укреплений в огонь. «Предашь огню» сохраняет образ и естественно обозначает сожжение.
- source_word: וּבַחֻרֵיהֶם
  choice: их юношей
  rationale: Слово обозначает молодых мужчин в расцвете сил, в данном военном контексте способных сражаться; «юношей» не сужает значение до профессиональных воинов.
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: убьёшь мечом
  rationale: Прямая современная передача глагола и инструментального оборота без смягчения насилия.
- source_word: עֹלְלֵיהֶם
  choice: их малых детей
  rationale: Термин относится к маленьким детям; эта передача сохраняет указание на возраст и уязвимость, не ограничивая значение новорождёнными.
- source_word: תְּרַטֵּשׁ
  choice: разобьёшь
  rationale: Глагол описывает жестокое разбивание или сокрушение. «Разобьёшь» кратко и прямо передаёт образ, не добавляя отсутствующего в тексте наречия.
- source_word: וְהָרֹתֵיהֶם תְּבַקֵּעַ
  choice: и рассечёшь беременных женщин
  rationale: Прямо передаёт беременных женщин и насильственное рассечение; намеренная графичность исходного текста не смягчается.
theological_decisions:
- issue: Корпоративное значение לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: народу Израиля; израильтянам
  rationale: Формальная конструкция сохранена, но понимается как обозначение всего народа, а не исключительно мужчин.
- issue: Графическое описание предсказанных зверств
  choice: Сохранить прямые наименования убийства детей и рассечения беременных женщин
  alternative: Смягчить описание общими словами о насилии или бедствии
  rationale: Пророческая речь намеренно конкретна и тяжела; смягчение скрыло бы нравственный ужас предсказываемых действий.
- issue: Субъект второй реплики
  choice: Елисей
  alternative: он
  rationale: В еврейском тексте стоит лишь «он сказал», однако явное имя в русском устраняет возможную путаницу между двумя мужчинами, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-пророческого повествования. Синтаксис ясен для широкого читателя; описание насилия передано прямо, без архаизации и эвфемизмов. Все маркеры сносок помещены в основной текст.
