base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: ru
  text: И упокоился Йорам[b] с отцами своими[a], и был похоронен с отцами своими в Городе Давида. А вместо него воцарился его сын Ахазьяху[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лёг с отцами своими». Это обычная древнееврейская формула, сообщающая о смерти царя.'
    reason: lexical_alternative
  - marker: b
    text: Традиционная русская форма имени — Иорам.
    reason: alternative_reading
  - marker: c
    text: Традиционная русская форма имени — Охозия.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: упокоился
  rationale: Глагол буквально означает «лёг», но в царской формуле сообщает о смерти. «Упокоился» естественно передаёт эту формулу по-русски, не сводя её к прямому «умер» и не создавая неестественного выражения «лёг с отцами».
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Сохранена традиционная династическая формула и образность еврейского текста; «с предками» было бы яснее, но несколько более истолковывающим переводом.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Форма нифаль здесь имеет страдательное значение и естественно передаётся русской пассивной конструкцией.
- source_word: בְּעִיר דָּוִד
  choice: в Городе Давида
  rationale: Передано как устойчивое название определённого места, а не как общее описательное выражение.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол обозначает вступление на царство; «воцарился» кратко и естественно выражает смену правителя.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Буквально и естественно передаёт значение замещения в контексте престолонаследия.
- source_word: יוֹרָם
  choice: Йорам
  rationale: Передаёт данную в еврейском тексте краткую форму имени ближе к её звучанию, не заменяя её традиционной русской формой.
- source_word: אֲחַזְיָהוּ
  choice: Ахазьяху
  rationale: Транслитерация сохраняет полную еврейскую форму имени; традиционный русский эквивалент указан в примечании.
theological_decisions:
- issue: Смысл царской формулы וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: Сохранить образную формулу как «упокоился с отцами своими».
  alternative: 'Передать непосредственно: «умер» или «почил».'
  rationale: Выбранная формулировка сообщает о смерти, но сохраняет династический образ исходного текста и не приписывает ему более определённого учения о посмертном состоянии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, повествовательным регистром. Повтор «с отцами своими» сохранён вслед за еврейским текстом; порядок последней части слегка перестроен ради естественного русского синтаксиса.
