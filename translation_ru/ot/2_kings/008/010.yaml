base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: ru
  text: 'И Елисей сказал ему: «Пойди, скажи ему: „Ты непременно выздоровеешь“[a]. Но Яхве показал мне, что он непременно умрёт».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «Ты непременно не будешь жить». Текст этого места труден; многие понимают его смысл как «Ты непременно выздоровеешь» — в противопоставлении последующему откровению о том, что он всё же умрёт.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: И Елисей сказал ему
  rationale: Имя Елисея прямо названо как подлежащее; такой порядок слов естественен для современного русского повествования и сохраняет связь с предшествующим контекстом.
- source_word: לֵךְ אֱמָר
  choice: Пойди, скажи ему
  rationale: Сохранены два последовательных повелительных глагола. Дополнение «ему» ясно из контекста и соответствует смыслу поручения.
- source_word: לא חָיֹה תִחְיֶה
  choice: Ты непременно выздоровеешь
  rationale: Сочетание инфинитива абсолютного с личной формой חיה выражает усиленную уверенность. В контексте болезни естественное русское «выздоровеешь» точнее передаёт смысл, чем буквальное «будешь жить». Трудное отрицательное написание לא отражено в сноске.
- source_word: וְהִרְאַנִי יְהוָה
  choice: Но Яхве показал мне
  rationale: Союз передан как противительный «но», поскольку откровение о смерти противопоставлено сообщению о выздоровлении. Личное имя Бога передано как «Яхве».
- source_word: כִּי מוֹת יָמוּת
  choice: что он непременно умрёт
  rationale: Инфинитив абсолютный при личной форме מות усиливает категоричность; наречие «непременно» естественно передаёт это значение по-русски.
theological_decisions:
- issue: Передача трудного выражения לא חיה תחיה
  choice: 'В основном тексте: «Ты непременно выздоровеешь», с буквальным отрицательным чтением в сноске.'
  alternative: «Ты непременно не будешь жить» — если принимать לא как отрицательную частицу.
  rationale: 'Отрицательное чтение масоретского написания вступает в напряжение с последующим противопоставлением и ходом рассказа: болезнь сама по себе не должна привести царя к смерти, однако он всё же умрёт. Контекстуальный смысл дан в тексте, а подлинная текстовая неоднозначность сохранена в сноске без её замалчивания.'
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передача личного имени как «Яхве» отличает его от титула «Господь» и следует исходной форме текста, не добавляя конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанно торжественная. Повторы «непременно» сохраняют параллельное усиление двух еврейских конструкций. Маркер сноски помещён непосредственно после спорного выражения.
