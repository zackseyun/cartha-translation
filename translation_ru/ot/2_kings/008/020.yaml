  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: ru
  text: В его дни эдомитяне восстали против власти Иудеи и поставили над собой царя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Эдом восстал из-под руки Иудеи».'
    reason: Сноска сохраняет конкретный еврейский образ политического господства, который в основном тексте передан естественным русским выражением.
lexical_decisions:
- source_word: בְּיָמָיו
  choice: В его дни
  rationale: Сохраняет еврейский временной оборот и естественно указывает на время правления упомянутого царя.
- source_word: פָּשַׁע
  choice: восстал
  rationale: В данном политическом контексте глагол означает мятеж или отпадение от власти, а не нравственное преступление.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Принятая русская библейская форма названия народа и страны.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: против власти Иудеи
  rationale: Еврейский образ «из-под руки Иудеи» обозначает освобождение от политического господства; по-русски смысл ясно и естественно передаётся словом «власть».
- source_word: יְהוּדָה
  choice: Иудеи
  rationale: Здесь имеется в виду Иудейское царство; форма родительного падежа обусловлена русским синтаксисом.
- source_word: וַיַּמְלִכוּ
  choice: поставил ... царя
  rationale: Каузативная форма глагола מלך означает поставить кого-либо царём; согласование в единственном числе соответствует собирательному названию «Эдом».
- source_word: עֲלֵיהֶם
  choice: над собой
  rationale: Местоимение относится к эдомитянам; возвратная форма естественно показывает, что они установили собственного правителя.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Неопределённое название правителя без указания имени; русская форма соответствует управлению глагола «поставил».
