base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: ru
  text: На следующий день он взял покрывало[a], обмакнул его в воду и накрыл им лицо тому, и тот умер[b]. И воцарился Азаил вместо него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрывало для постели», «стёганое покрывало», «тканое полотно» или «сетчатое полотно». Еврейское слово встречается редко, поэтому точный вид ткани неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте прямо не сказано, кто совершил эти действия. Из контекста многие заключают, что это был Азаил, однако по имени он назван только в заключительной части стиха.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: На следующий день
  rationale: Точно и естественно передаёт указание на день, последовавший за описанными ранее событиями.
- source_word: הַמַּכְבֵּר
  choice: покрывало
  rationale: Редкое существительное обозначает покрывающую ткань, возможно тканое или сетчатое покрывало; общий термин не создаёт ложной точности.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: намочил его водой
  rationale: Глагол означает погружение или обмакивание; в данном контексте естественная русская формулировка передаёт, что ткань стала мокрой.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: расстелил у него на лице
  rationale: Передаёт действие разворачивания и наложения ткани поверх лица; оборот «у него» помогает не смешивать действующее лицо с обладателем лица.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Сохраняет простую повествовательную последовательность еврейского текста, не добавляя явно не выраженной целевой или причинной связи; указательное местоимение естественно различает участника действия и умершего.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: И воцарился Азаил вместо него
  rationale: Традиционная и ясная формула престолонаследия точно передаёт значение «стал царствовать на его месте».
theological_decisions:
- issue: Не назван субъект глаголов «взял», «намочил» и «расстелил»
  choice: Сохранить в основном тексте местоимение «он», не называя действующего Азаилом
  alternative: Прямо назвать Азаила субъектом действий
  rationale: Еврейские глагольные формы указывают на мужской род единственного числа, но имя субъекта появляется лишь в последней части стиха. Контекст позволяет понимать его как Азаила, однако перевод не должен превращать контекстуальный вывод в прямое утверждение текста.
- issue: Связь между наложением мокрой ткани и смертью
  choice: Передать последовательностью «и тот умер»
  alternative: «так что он умер» или «отчего он умер»
  rationale: וַיָּמֹת формально продолжает повествование и не выражает отдельным средством причинную либо целевую связь. Последовательность событий остаётся очевидной без её усиления переводом.
translation_notes:
  register: Современный литературный русский язык с лаконичным библейским повествовательным ритмом. Имя חֲזָהאֵל передано в принятой русской библейской форме «Азаил». Формулировка сохраняет неопределённость субъекта и не усиливает причинность смерти.
