  source_fidelity: 'В основном смысл передан верно: возвращение по окончании семилетнего срока, земля филистимлян и имущественная пара «дом и поле» сохранены. Однако «просить царя вернуть ей» вводит глагол «вернуть», которого в еврейском тексте нет: предметом вопля/прошения названы её дом и поле, а восстановление имущества лишь выводится из контекста. Кроме того, «пошла» несколько сглаживает וַתֵּצֵא («вышла/отправилась»).'
  naturalness: «Отправилась взывать к царю о своём доме и о своём поле» — литературная и понятная формулировка для исторического повествования. Глагол «взывать» передаёт настойчивый характер צעק, не требуя искусственно добавлять юридически конкретное «вернуть».
  terminology: «Земля филистимлян», «дом» и «поле» точно соответствуют исходным имущественным обозначениям. «Взывать» сохраняет значение צעק; сноска отмечает естественные контекстные варианты без навязывания одного толкования.
