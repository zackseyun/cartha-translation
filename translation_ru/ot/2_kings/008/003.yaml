  text: וַ/יְהִ֗י מִ/קְצֵה֙ שֶׁ֣בַע שָׁנִ֔ים וַ/תָּ֥שָׁב הָ/אִשָּׁ֖ה מֵ/אֶ֣רֶץ פְּלִשְׁתִּ֑ים וַ/תֵּצֵא֙ לִ/צְעֹ֣ק אֶל הַ/מֶּ֔לֶךְ אֶל בֵּיתָ֖/הּ וְ/אֶל שָׂדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: ru
  text: По прошествии семи лет женщина возвратилась из земли филистимлян и отправилась взывать к царю о своём доме и о своём поле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «обратиться к царю с просьбой (или жалобой) о своём доме и о своём поле».'
    reason: Еврейский глагол צעק буквально означает «взывать, кричать», а в контексте обращения к правителю может обозначать настойчивую просьбу или жалобу.
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: По прошествии семи лет
  rationale: Естественно передаёт временную конструкцию со значением завершения семилетнего периода.
- source_word: וַתָּשָׁב
  choice: возвратилась
  rationale: В данном повествовательном контексте שׁוּב означает возвращение из места временного проживания.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: земли филистимлян
  rationale: Сохраняет явную структуру еврейского выражения «земля филистимлян», не заменяя её географическим названием «Филистия».
- source_word: וַתֵּצֵא
  choice: пошла
  rationale: В русском повествовании естественно выражает направленное действие женщины после возвращения; буквальное «вышла» здесь могло бы неоправданно акцентировать исход из конкретного помещения.
- source_word: לִצְעֹק אֶל הַמֶּלֶךְ
  choice: просить царя вернуть
  rationale: В контексте обращения к царю за восстановлением имущественных прав צעק обозначает настойчивую просьбу или призыв о защите; дополнение «вернуть» ясно передаёт подразумеваемую цель обращения, а буквальный образ сохранён в сноске.
- source_word: בֵּיתָהּ
  choice: дом
  rationale: В сочетании с полем речь, вероятнее всего, идёт о недвижимом имуществе, поэтому конкретное «дом» предпочтительнее значений «семья» или «домочадцы».
- source_word: שָׂדָהּ
  choice: поле
  rationale: Сохраняет конкретное значение שָׂדֶה и имущественную пару «дом и поле».
