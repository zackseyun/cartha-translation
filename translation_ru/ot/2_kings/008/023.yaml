  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Прочие деяния Иорама[b] и всё, что он совершил, разве не записаны в книге летописей царей Иудеи?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книге хроник царей Иудеи»; также возможно: «в книге анналов царей Иудеи».'
    reason: lexical_alternative
  - marker: b
    text: Евр. Йорам; традиционная русская форма — Иорам.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие деяния
  rationale: יֶתֶר обозначает остаток или остальное, а דִּבְרֵי в устойчивой формуле царского итога относится к делам и деяниям правителя. «Прочие деяния» естественно передаёт эту историографическую формулу.
- source_word: יוֹרָם
  choice: Иорам
  rationale: Передаёт еврейскую форму имени יוֹרָם в соответствии с укоренившейся русской библейской традицией.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он совершил
  rationale: Сохраняет объём относительной конструкции; «совершил» в данном летописном контексте звучит естественнее повторения слова «сделал».
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записаны
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ. «Записаны» точно передаёт смысл письменной фиксации.
- source_word: עַל סֵפֶר
  choice: в книге
  rationale: Хотя עַל буквально означает «на», применительно к письменному источнику по-русски естественно «в книге»; סֵפֶר мог обозначать книгу или свиток.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: книга летописей царей Иудеи
  rationale: דִּבְרֵי הַיָּמִים здесь обозначает царские хроники или анналы, а לְ вводит отношение принадлежности или тематической отнесённости к царям Иудеи.
