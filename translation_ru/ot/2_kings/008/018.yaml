source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: ru
  text: Он шёл путём царей Израиля, как поступал дом Ахава, потому что дочь Ахава была его женой, и делал зло в глазах Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Он шёл путём
  rationale: Сохраняет прозрачную древнееврейскую метафору образа жизни и поведения; по-русски выражение звучит естественно и торжественно.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Прямая передача сочетания, обозначающего правителей северного царства как нравственный образец, которому он следовал.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: как поступал дом Ахава
  rationale: Глагол во множественном числе согласуется по смыслу с членами царского дома, однако в русском собирательное подлежащее «дом» естественно требует единственного числа; «поступал» передаёт характер поведения.
- source_word: בֵּית אַחְאָב
  choice: дом Ахава
  rationale: Сохраняет библейское выражение, которое в царском контексте означает семью и династию Ахава.
- source_word: כִּי
  choice: потому что
  rationale: Вводит явно выраженную причину его следования образу дома Ахава.
- source_word: בַּת אַחְאָב
  choice: дочь Ахава
  rationale: Естественная и точная передача древнееврейского сопряжённого сочетания.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: была его женой
  rationale: Передаёт существующее брачное положение, выраженное древнееврейской конструкцией «была ему в жёны».
- source_word: וַיַּעַשׂ הָרַע
  choice: и делал зло
  rationale: Кратко и естественно передаёт устойчивую формулу нравственной оценки; определённость הָרַע в русском контексте не требует отдельного указательного оборота.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет образ исходного текста и обозначает Божью оценку поступков.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Связь брака с нравственным уподоблением дому Ахава
  choice: Сохранена причинная связь «потому что» без дополнительных пояснений
  alternative: Ослабить связь словом «ведь» или прямо приписать жене личное воздействие
  rationale: כִּי представляет брак как причину в повествовательной оценке, но текст не раскрывает точный механизм влияния; перевод не должен добавлять его.
translation_notes:
  register: Современный литературный русский язык с сохранением понятных библейских образов «шёл путём», «дом Ахава» и «в глазах Яхве». Синтаксис выдержан в повествовательном, достойном регистре без архаизмов.
