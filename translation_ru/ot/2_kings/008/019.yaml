  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: ru
  text: Однако Яхве не пожелал погубить Иудею ради Давида, Своего слуги, как Он сказал ему[a], что даст ему светильник[b] для его сыновей на все времена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Он обещал ему».'
    reason: lexical_alternative
  - marker: b
    text: «Светильник» — царский образ, обозначающий продолжение рода или династии Давида.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: Однако ... не пожелал
  rationale: Сочетание союза с отрицанием передаёт контраст с предшествующим повествованием, а глагол אָבָה обозначает желание или согласие, а не просто отказ совершить действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и отличает имя Бога от титула «Господь».
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: погубить Иудею
  rationale: Глагол в породе хифиль означает причинить гибель или разрушение; «погубить» естественно передаёт здесь угрозу суда над царством Иуды.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: ради Давида, Своего слуги
  rationale: Предлог выражает основание благоволения к Давиду, а «слуга» сохраняет его обозначение как состоящего на служении у Бога.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: как Он сказал ему
  rationale: Основной текст сохраняет буквальное значение אָמַר «сказал», не устраняя того, что в данном контексте эти слова являются обещанием.
- source_word: נִיר
  choice: светильник
  rationale: Сохранён конкретный образ непрерывности царской линии Давида; русское «светильник» подходит для библейского образа горящего огня и не заменяет метафору толкованием.
- source_word: לְבָנָיו
  choice: для его сыновей
  rationale: Так прямо передано значение предлога לְ без внесения более интерпретирующего «через сыновей»; в контексте престолонаследия «сыновья» точнее общего «потомки».
- source_word: כָּל־הַיָּמִים
  choice: на все времена
  rationale: Это естественный современный русский эквивалент идиомы «все дни», передающий непрерывную длительность и не требующий неестественной кальки.
theological_decisions:
- issue: Образ נִיר в обещании династии Давида
  choice: светильник
  alternative: свет / династия
  rationale: Конкретная метафора сохранена, чтобы не подменять исходный образ готовым богословским истолкованием; сноска поясняет его царско-династический смысл.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Транслитерация сохраняет личное имя, представленное в еврейском тексте, не заменяя его титулом.
- issue: Характер слов Бога Давиду
  choice: как Он сказал ему
  alternative: как Он обещал ему
  rationale: Формулировка основного текста сохраняет лексическое значение אָמַר, а вариант «обещал» вынесен в сноску как контекстуально оправданное понимание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейскому тексту, но избегает тяжёлой кальки; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской религиозной норме.
