  source_fidelity: 'Смысл в целом передан точно: וְלֹא אָבָה отражено как «не пожелал», לְמַעַן — «ради», а נִיר сохранён конкретным образом «светильник». Однако конструкция после «как Он сказал ему» с двоеточием и инфинитивом («дать ему») в русском скорее звучит как прямая инструкция, чем как содержание Божьего обещания. Конечное придаточное «что даст ему» точно передаёт инфинитив לָתֵת при сохранении субъектом Яхве.'
