  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: ru
  text: Он пошёл с Иорамом, сыном Ахава, на войну против Хазаила, царя Арама, в Рамоте-Галаадском, и арамеи ранили[a] Иорама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поразили». Еврейский глагол имеет более широкое значение; перевод «ранили» соответствует военному контексту и параллельному повествованию, где говорится о ранах Иорама.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אֶת יוֹרָם
  choice: Он пошёл с Иорамом
  rationale: После глагола הלך частица אֵת выражает совместность; русский предлог «с» естественно передаёт сопровождение.
- source_word: לַמִּלְחָמָה עִם חֲזָהאֵל
  choice: на войну против Хазаила
  rationale: В военном контексте עִם обозначает противоборство; «против» ясно передаёт отношения между сторонами.
- source_word: מֶלֶךְ אֲרָם / אֲרַמִּים
  choice: царь Арама / арамеи
  rationale: Сохранены еврейские этногеографические названия «Арам» и «арамеи», а не традиционные, но менее точные «Сирия» и «сирийцы».
- source_word: בְּרָמֹת גִּלְעָד
  choice: к Рамоту Галаадскому
  rationale: Предлог בְּ здесь указывает на место военного похода; в сочетании с «пошёл на войну» русское «к» естественно передаёт движение к укреплённому городу.
- source_word: וַיַּכּוּ
  choice: ранили
  rationale: Глагол נכה может означать «поразить, ударить»; контекст и продолжение повествования показывают, что Иорам получил раны, но не погиб.
- source_word: יוֹרָם
  choice: Иорам
  rationale: Передана краткая форма имени, непосредственно представленная в масоретском тексте данного стиха.
