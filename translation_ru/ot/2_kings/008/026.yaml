  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: ru
  text: Охозии было двадцать два года, когда он стал царём, и один год он царствовал в Иерусалиме. Его мать звали Гофолией; она была дочерью[a] Амврия, царя Израиля.
  philosophy: optimal-equivalence
  footnotes:
