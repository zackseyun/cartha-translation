base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: ru
  text: 'Азаил пошёл навстречу ему, взяв с собой дар — всё лучшее, что было в Дамаске, поклажу для сорока верблюдов. Он пришёл, встал перед ним и сказал: «Твой сын[a] Венадад, царь Арама, послал меня к тебе сказать: „Выздоровею ли я от этой болезни?“[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Твой сын» — почтительное выражение смирения перед уважаемым старшим; оно не обязательно означает буквальное родство.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «Буду ли я жить от этой болезни?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: навстречу ему
  rationale: Оборот обозначает движение навстречу человеку; русский вариант естественно сохраняет направленность действия.
- source_word: מִנְחָה
  choice: дар
  rationale: В дипломатическом контексте речь идёт о почтительном подношении, а не о культовой жертве или обязательной дани.
- source_word: בְיָדוֹ
  choice: взяв с собой
  rationale: Буквально «в его руке»; русский идиоматический оборот передаёт, что Азаил принёс дар, не создавая впечатления, будто весь огромный груз он держал лично.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: всё лучшее, что было в Дамаске
  rationale: טוּב обозначает лучшие продукты или ценные блага города; формулировка сохраняет обобщённость исходного текста.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: груз на сорок верблюдов
  rationale: Русский оборот ясно выражает количество груза, для перевозки которого требовалось сорок верблюдов.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: встал перед ним
  rationale: Сохранена формула официального предстояния перед пророком без добавочного толкования.
- source_word: בִּנְךָ
  choice: твой сын
  rationale: Сохранена буквальная родственная метафора как почтительное обращение к уважаемому старшему; её культурный смысл пояснён в сноске.
- source_word: אֲרָם
  choice: Арам
  rationale: Передано древнее историческое название, а не более позднее географическое наименование «Сирия».
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: Выздоровею ли я после этой болезни?
  rationale: В контексте болезни глагол «жить» идиоматически выражает вопрос о выздоровлении; буквальная возможность передана в сноске.
