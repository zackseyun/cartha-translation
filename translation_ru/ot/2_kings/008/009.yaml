translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Использованы традиционные русские формы имён «Азаил» и «Венадад», а историческое название «Арам» сохранено. Длинное перечисление разделено тире, чтобы ясно показать, что лучшие дары Дамаска составляли груз на сорок верблюдов.
