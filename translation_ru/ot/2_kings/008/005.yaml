  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: ru
  text: 'И когда он рассказывал царю, как Елисей возвратил умершего к жизни[a], как раз та женщина, сына которой Елисей возвратил к жизни, взывала к царю о своём доме и поле. И Гиезий сказал: «Мой господин, царь! Вот эта женщина[b], и вот её сын, которого Елисей возвратил к жизни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оживил умершего», «вернул умершего к жизни». В еврейском употреблена каузативная форма глагола «жить» (החיה).'
    reason: lexical_alternative
  - marker: b
    text: 'Слово, переданное выше как «как раз», подчёркивает поразительное совпадение: женщина пришла именно в тот момент, когда Гиезий рассказывал о возвращении её сына к жизни.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: И когда он рассказывал царю
  rationale: Конструкция с וַיְהִי и причастием задаёт сопутствующее продолжающееся действие. Русское «И когда он рассказывал» естественно передаёт временной фон, не воспроизводя буквально тяжеловесное «и было».
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: как Елисей возвратил умершего к жизни
  rationale: Каузатив הֶחֱיָה означает «сделать живым, возвратить к жизни». «Умершего» сохраняет единственное число определённой формы הַמֵּת; имя «Елисей» восстановлено по ясному контексту и заключительной части стиха, чтобы в русском не возникло ошибочного впечатления, будто речь о Гиезии.
- source_word: וְהִנֵּה
  choice: как раз
  rationale: 'Частица отмечает внезапное и поразительное совпадение: женщина появляется именно во время рассказа. «Как раз» естественно передаёт этот повествовательный эффект в современном русском.'
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: та женщина, сына которой он возвратил к жизни
  rationale: Еврейская конструкция буквально соотносит женщину с оживлённым сыном; русское придаточное с «сына которой» ясно и идиоматично сохраняет эту связь.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: взывала к царю
  rationale: צעק обозначает настойчивый крик о помощи или справедливости. «Взывала» сохраняет срочность и судебно-просительный оттенок, оставаясь уместным для достоинного библейского регистра.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: о своём доме и поле
  rationale: עַל указывает на предмет её обращения, а שָׂדֶה конкретно означает поле. Повтор предлога в русском не требуется.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Господин мой царь!
  rationale: Сохранена почтительная придворная формула обращения без усиления до «владыка» или «повелитель».
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: Вот эта женщина, и вот её сын
  rationale: Указательные формы идентифицируют присутствующих лиц. «Вот» естественно передаёт непосредственное указание в русской прямой речи.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: которого Елисей возвратил к жизни
  rationale: Повторена одна и та же передача הֶחֱיָה для лексической связности внутри стиха.
