  source_fidelity: 'Смысл и структура стиха в целом переданы точно: продолжающийся рассказ Гиезия царю, неожиданное появление женщины, её настойчивая просьба о доме и поле и опознание её и сына сохранены. Каузатив הֶחֱיָה последовательно передан как «возвратил к жизни». Явное называние Елисея в первом сообщении оправдано непосредственным контекстом, где рассказчиком является Гиезий.'
