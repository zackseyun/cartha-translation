  text: בִּ/שְׁנַת֙ שְׁתֵּים עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/יוֹרָ֥ם בֶּן אַחְאָ֖ב מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: ru
  text: В двенадцатый год правления Иорама, сына Ахава, царя Израиля, воцарился Охозия, сын Иорама, царь Иудеи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте имя израильского царя дано в форме Йорам (יוֹרָם), а имя иудейского царя — в родственной форме Йехорам (יְהוֹרָם); в русской библейской традиции оба имени обычно передаются как «Иорам».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: В двенадцатый год правления
  rationale: Естественная русская передача древнееврейской формулы датировки по годам царствования; слово «правления» добавлено для ясности подразумеваемого смысла.
- source_word: לְ/יוֹרָם
  choice: Иорама
  rationale: Предлог לְ в формуле датировки указывает, чьи годы правления отсчитываются; в русском это выражается родительным падежом.
- source_word: בֶּן אַחְאָב
  choice: сына Ахава
  rationale: Стандартная передача патронимической конструкции с сохранением формы имени в русском библейском употреблении.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Прямая и естественная передача царского титула.
- source_word: מָלַךְ
  choice: воцарился
  rationale: В сообщениях о вступлении на престол форма глагола מלך обозначает начало царствования; «воцарился» кратко и точно передаёт этот смысл.
- source_word: אֲחַזְיָהוּ
  choice: Охозия
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: בֶן יְהוֹרָם
  choice: сын Иорама
  rationale: Имя יְהוֹרָם передано традиционной русской формой «Иорам»; различие еврейских форм יוֹרָם и יְהוֹרָם пояснено в сноске.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Прямая и естественная передача царского титула; приложение относится к Охозии.
