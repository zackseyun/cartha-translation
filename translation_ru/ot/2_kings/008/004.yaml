  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: ru
  text: 'Царь разговаривал с Гиезием[a], слугой человека Божьего, и сказал: «Расскажи мне, пожалуйста, обо всех великих делах, которые совершил Елисей».'
  philosophy: optimal-equivalence
  footnotes:
