  yaml_path: translation/ot/2_kings/008/022.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: ru
  text: Эдом восстал против Иудеи и до сего дня не подчиняется ей.[a] Тогда же восстала и Ливна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отпал от Иудеи», «взбунтовался против Иудеи». Еврейский глагол обозначает политическое восстание или выход из-под власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע
  choice: освободился от власти / восстала
  rationale: В политическом контексте פשע означает мятеж или выход из подчинения. Для Эдома контекст подчёркивает достигнутую независимость, поэтому естественно «освободился от власти»; применительно к Ливне, где результат не уточняется, сохранено более прямое «восстала».
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: от власти Иудеи
  rationale: Буквально «из-под руки Иудеи»; еврейская идиома обозначает подчинение и власть. В современном русском буквальная калька звучит неестественно, поэтому передан её смысл.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и остаётся свободным до сего дня
  rationale: Формула указывает, что возникшее положение сохранялось до времени повествователя. Добавление «остаётся свободным» делает временную связь ясной по-русски, не меняя смысла.
- source_word: אָז / בָּעֵת הַהִיא
  choice: Тогда же
  rationale: Оба указателя соотносят выступление Ливны с тем же историческим временем; компактное «тогда же» естественно передаёт их совместную функцию.
- source_word: לִבְנָה
  choice: Ливна
  rationale: Традиционная и понятная русская передача библейского географического названия.
theological_decisions: []
translation_notes:
