  text: He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: ru
  text: Ему было тридцать два года, когда он стал царём, и восемь лет он царствовал в Иерусалиме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: Ему было тридцать два года
  rationale: Возрастная формула בֶּן + числительное + שָׁנָה естественно передаётся по-русски конструкцией «ему было … лет», а не буквально «сын … лет».
- source_word: הָיָה בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Оборот указывает на возраст при восшествии на престол; эта формулировка ясна и естественна в современном русском языке.
- source_word: וּשְׁמֹנֶה שנה
  choice: восемь лет
  rationale: Точно передаёт указанную в еврейском тексте продолжительность царствования.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти, а не только обладание титулом.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог בְּ имеет здесь локативное значение и указывает на место царствования.
