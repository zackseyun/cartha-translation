  text: וַ/יֹּ֣אמֶר חֲזָהאֵ֔ל כִּ֣י מָ֤ה עַבְדְּ/ךָ֙ הַ/כֶּ֔לֶב כִּ֣י יַעֲשֶׂ֔ה הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע הִרְאַ֧/נִי יְהוָ֛ה אֹתְ/ךָ֖ מֶ֥לֶךְ עַל אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: ru
  text: 'Азаил сказал: «Но кто такой твой слуга — этот пёс, — чтобы совершить такое великое дело?» Елисей ответил: «Яхве показал мне, что ты будешь царём над Арамом[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царём Арама».'
    reason: Предлог עַל буквально означает «над», но всё выражение можно естественно понимать как обозначение царя страны.
lexical_decisions:
- source_word: כִּי מָה
  choice: Но что собой представляет
  rationale: Оборот вводит недоверчивое возражение Азаила. Частица «но» передаёт противопоставление контексту, а выражение «что собой представляет» естественно обозначает вопрос о его положении или способности.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: Это обычная формула почтительного самоуничижения; «слуга» сохраняет её придворный оттенок и не приписывает Азаилу юридический статус раба.
- source_word: הַכֶּלֶב
  choice: этот пёс
  rationale: Определённое существительное употреблено как уничижительная характеристика самого говорящего. Указательное «этот» естественно передаёт приложение и сохраняет резкий образ.
- source_word: כִּי יַעֲשֶׂה
  choice: чтобы совершить
  rationale: Конструкция выражает недоверие к тому, что говорящий способен или окажется в положении сделать названное; русский инфинитив после «чтобы» сохраняет эту риторическую открытость.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: такое великое дело
  rationale: דבר допускает значения «дело», «поступок», «событие». «Дело» сохраняет широкое значение, а «великое» не устраняет напряжение между масштабом и нравственно ужасным характером предсказанных действий.
- source_word: הִרְאַנִי
  choice: показал мне
  rationale: Каузативная форма глагола «видеть» обозначает данное Богом откровение. Совершенный вид естественно передаёт уже полученное видение, значимое для настоящего высказывания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, прямо стоящее в еврейском тексте, а не заменено титулом.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: царём над Арамом
  rationale: Предлог עַל буквально означает «над» и подчёркивает царскую власть над страной; «Арам» непосредственно передаёт еврейское географическое название.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон, поэтому сохранено личное имя Бога без замены титулом.
- issue: Характер «великого дела»
  choice: Сохранено нейтрально-масштабное выражение «великое дело»
  alternative: ужасное злодеяние
  rationale: Контекст придаёт будущим действиям нравственно ужасный смысл, однако сам стих использует широкий термин דבר и прилагательное «великий». Перевод не должен явно добавлять оценку, которую здесь исходная формулировка оставляет контексту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика Азаила передана естественно, но сохранены её самоуничижительный образ «этот пёс» и неоднозначность вопроса о способности или положении совершить предсказанное.
