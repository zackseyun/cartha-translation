base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: ru
  text: 'Елисей прежде сказал женщине, сына которой он вернул к жизни: «Встань, иди ты и твои домашние и поживи[a] там, где бы ты ни поселилась, потому что Яхве призвал голод, и он придёт на землю на семь лет[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать временно жить на чужой земле, находясь там в положении пришельца.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально еврейская форма глагола — «пришёл». В контексте предупреждения она может представлять предстоящее событие как уже решённое и несомненное; возможно также: «уже наступает».'
    reason: source_ambiguity
lexical_decisions:
- source_word: וֶאֱלִישָׁע דִּבֶּר
  choice: Елисей прежде сказал
  rationale: Форма с вынесенным подлежащим вводит справочную информацию о более раннем разговоре. «Прежде» естественно передаёт плюсквамперфектное отношение к последующим событиям, не превращая начальный וְ в самостоятельное временное слово.
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: сына которой он вернул к жизни
  rationale: Каузатив от חיה обозначает возвращение умершего сына к жизни; русское выражение точно и естественно.
- source_word: קוּמִי וּלְכִי אַתִּי וּבֵיתֵךְ
  choice: Встань и уйди — ты и твои домашние
  rationale: Императивы обращены к женщине; «домашние» передаёт социальное значение בַּיִת как домочадцев, а тире естественно присоединяет уточнение субъекта.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: Поживи как пришелица там, где сможешь
  rationale: Повторяющийся корень גור обозначает временное проживание вне постоянного места и нередко положение пришельца. Формулировка сохраняет эту существенную смысловую окраску без архаического «странствуй».
- source_word: קָרָא יְהוָה לָרָעָב
  choice: Яхве призвал голод
  rationale: קרא с ל изображает голод как бедствие, вызванное или созванное Богом; «призвал» сохраняет олицетворённую образность оригинала.
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: и тот придёт на эту землю на семь лет
  rationale: Хотя בָּא имеет форму перфекта, внутри предваряющей речи он описывает несомненно предстоящее бедствие. Будущее время ясно передаёт временную перспективу контекста; формальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» отличает личное заветное имя от титула и не привносит конфессионального толкования.
- issue: Божественная власть над голодом в выражении קָרָא ... לָרָעָב
  choice: Яхве призвал голод
  alternative: Яхве возвестил голод; Яхве навёл голод
  rationale: Буквальная метафора «призвал» сохраняет утверждение об инициативе Бога, не уточняя сверх текста механизм бедствия.
- issue: Временное значение перфекта בָּא в пророческом предупреждении
  choice: придёт
  alternative: пришёл; уже наступает
  rationale: Контекст представляет слова Елисея как предупреждение до переселения женщины, поэтому русское будущее наиболее естественно. Сноска сохраняет формальную напряжённость еврейского перфекта и возможность оттенка уже решённого или начинающегося события.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Домашние» понятно передаёт домочадцев; «пришелица» несколько возвышенно, но сохраняет важную социально-правовую окраску גור. Прямая речь сделана естественной, без избыточного повторения одного русского глагола.
