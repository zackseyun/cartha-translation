  text: וַ/יֵּ֣לֶךְ מֵ/אֵ֣ת אֱלִישָׁ֗ע וַ/יָּבֹא֙ אֶל אֲדֹנָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָֽה אָמַ֥ר לְ/ךָ֖ אֱלִישָׁ֑ע וַ/יֹּ֕אמֶר אָ֥מַר לִ֖/י חָיֹ֥ה תִחְיֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: ru
  text: 'Он ушёл от Елисея и пришёл к своему господину. Тот спросил его: «Что сказал тебе Елисей?» Он ответил: «Он сказал мне: „Ты непременно выздоровеешь“».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты непременно будешь жить». В еврейском тексте глагол «жить» повторён для усиления: буквально «живя, будешь жить»; в данном контексте речь идёт о выздоровлении.'
    reason: Сохраняет буквальную лексическую альтернативу и объясняет еврейскую усилительную конструкцию.
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: Он ушёл от Елисея
  rationale: Глагол הלך с предлогом מֵאֵת описывает уход от Елисея и последовательно развивает повествование. «Ушёл от» естественно передаёт и движение, и удаление.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: и пришёл к своему господину
  rationale: בוא אֶל естественно передаётся как «пришёл к». אֲדֹנָיו здесь обозначает земного владыку и начальника Азаила — царя Венадада, а не Бога.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: Что сказал тебе Елисей?
  rationale: Прямой и естественный русский эквивалент вопроса в данном повествовательном контексте.
- source_word: אָמַר לִי
  choice: Он сказал мне
  rationale: Формально близкая и естественная вводная формула прямой речи, не добавляющая оттенков, которых нет в еврейском тексте.
- source_word: חָיֹה תִחְיֶה
  choice: Ты непременно выздоровеешь
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает утверждение. В контексте болезни «выздоровеешь» ясно передаёт смысл, тогда как буквальное «будешь жить» сохранено в сноске.
theological_decisions:
- issue: Значение אֲדֹנָיו в недивineственном придворном контексте
  choice: своему господину
  alternative: своему владыке / своему хозяину
  rationale: Слово обозначает царя как вышестоящего по отношению к посланнику. «Господину» сохраняет социально-придворный оттенок, но строчная буква не позволяет принять его за божественный титул.
- issue: Передача חָיֹה תִחְיֶה как обещания жизни или выздоровления
  choice: Ты непременно выздоровеешь
  alternative: Ты непременно будешь жить
  rationale: Контекст непосредственно касается исхода болезни, поэтому «выздоровеешь» передаёт прагматический смысл. При этом буквальная образность и усилительная конструкция отмечены в сноске, без снятия напряжения с последующим пророчеством о смерти царя.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным синтаксисом. Реплики звучат естественно и достойно; архаизмы избегаются. Местоимение «Тот» устраняет тяжеловесное повторение и ясно указывает на господина Азаила.
