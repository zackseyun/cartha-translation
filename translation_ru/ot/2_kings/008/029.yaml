base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: ru
  text: И царь Иорам вернулся в Изреель, чтобы оправиться от ран, которые нанесли ему арамеи в Раме, когда он сражался с Азаилом, царём Арама. А Охозия, сын Иорама, царь Иудеи, спустился в Изреель навестить Иорама, сына Ахава, потому что тот был болен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: В повествовательной последовательности שוב естественно обозначает возвращение Иорама в Изреель после сражения.
- source_word: לְהִתְרַפֵּא
  choice: чтобы оправиться
  rationale: Порода хитпаэль глагола רפא здесь описывает восстановление после ран; современное русское «оправиться» естественно передаёт смысл, не создавая впечатления, будто Иорам исцелял себя сам.
- source_word: מִן הַמַּכִּים
  choice: от ран
  rationale: Буквально речь идёт об ударах, но в военно-медицинском контексте имеются в виду полученные от них раны.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: которые нанесли ему арамеи
  rationale: Формулировка по-русски естественно связывает раны с нанесшими их арамеями и сохраняет древнее этническое название.
- source_word: בָּרָמָה
  choice: в Раме
  rationale: Предлог ב обозначает место; русская форма «в Раме» соответствует обычному употреблению с названием города.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: когда он сражался с Азаилом
  rationale: Инфинитивная конструкция задаёт временное обстоятельство, а русское «сражаться с» естественно выражает противостояние.
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: А Охозия... отправился
  rationale: ירד буквально значит «спустился», однако в русском описании пути из Иудеи в Изреель буквальная направленность без географического пояснения звучит менее естественно; «отправился» ясно передаёт движение, не добавляя спорной детали.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: навестить Иорама
  rationale: Буквально «увидеть Иорама», но в контексте болезни выражение имеет обычный смысл посещения больного; «навестить» естественно передаёт эту прагматику.
- source_word: כִּי חֹלֶה הוּא
  choice: потому что тот был болен
  rationale: חֹלֶה обозначает болезненное состояние; указательное «тот» однозначно относит состояние к Иораму, а не к Охозии.
