base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: ru
  text: На пятый год царствования Иорама, сына Ахава и царя Израиля[a], когда Иосафат был царём Иудеи, Иегорам[b], сын Иосафата, стал царём Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и Иосафат, царь Иудеи». Еврейская фраза сжата; некоторые понимают её как указание на период соправительства.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте имена различаются: Иорам (царь Израиля) и Иегорам (сын Иосафата, царь Иудеи), хотя это близкие формы одного имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: На пятый год
  rationale: Естественная русская форма хронологического указания; еврейское количественное числительное в формуле года передано порядковым.
- source_word: לְ/יוֹרָם
  choice: Иорама
  rationale: Предлог לְ обозначает царствование, по которому отсчитывается год; родительный падеж естественно выражает это по-русски.
- source_word: בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: сына Ахава, царя Израиля
  rationale: Сохранены родословное обозначение и царский титул; пунктуация ясно относит титул к Иораму.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: когда Иосафат был царём Иудеи
  rationale: Глагольная связка отсутствует, а сжатая конструкция допускает временное понимание. Такой перевод естественен по-русски и не превращает возможное соправительство в прямо высказанный факт.
- source_word: מָלַךְ
  choice: стал царём
  rationale: В формуле восшествия на престол глагол указывает на начало царствования, а не на весь период правления.
- source_word: יְהוֹרָם
  choice: Иегорам
  rationale: Форма отличена от יוֹרָם («Иорам») в той же строке, чтобы читатель не смешивал двух царей.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: сын Иосафата, стал царём Иудеи
  rationale: Русский порядок слов ясно относит заключительный титул к Иегораму и сохраняет все элементы еврейского текста.
theological_decisions:
- issue: Сжатое хронологическое указание об Иосафате и восшествии Иегорама
  choice: Передать как «когда Иосафат был царём Иудеи», не уточняя форму их одновременного правления.
  alternative: 'Буквально: «и Иосафат, царь Иудеи»; либо прямо указать на соправительство.'
  rationale: Еврейский текст допускает временное понимание, но прямо не называет соправительство. Перевод сохраняет хронологическое напряжение и не разрешает его посредством привнесённого толкования.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими именами и сдержанным повествовательным тоном. Хронологическая формула передана ясно и естественно; повтор «царь/царём» сохранён ради точности и идентификации двух правителей.
