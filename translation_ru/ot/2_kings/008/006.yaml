- from: 'Царь расспросил женщину, и она всё ему рассказала. Тогда царь приставил к ней одного придворного[a] и приказал: «Верни ей всё, что ей принадлежит, а также весь урожай с её поля со дня, когда она покинула эту землю, и доныне».'
  to: 'Царь спросил женщину, и она рассказала ему. Затем царь назначил для неё одного придворного чиновника[a] и приказал ему: «Верни ей всё, что ей принадлежит, а также все доходы с поля со дня, когда она покинула землю, и доныне».'
  rationale: Правка устраняет неестественное «приставил к ней», избегает неоправданного усиления глаголов начала стиха и точнее передаёт множественное תְּבוּאֹת как совокупные доходы поля. Сноска и её якорь сохранены и уточнены; спорная семантика סָרִיס не разрешается в основном тексте догматически.
