base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: ru
  text: 'Царь спросил женщину, и она рассказала ему. Затем царь назначил для неё одного придворного чиновника[a] и приказал ему: «Верни ей всё, что ей принадлежит, а также все доходы с поля со дня, когда она покинула землю, и доныне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнуха». Царский титул мог обозначать как евнуха в буквальном смысле, так и придворного чиновника вообще.'
    reason: Сохраняется лексическая неоднозначность еврейского סָרִיס.
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: Царь расспросил женщину
  rationale: Глагол שאל с косвенным дополнением здесь означает, что царь задал женщине вопросы о её деле; «расспросил» естественно передаёт это в русском повествовании. אִשָּׁה обозначает уже упомянутую женщину, а не подчёркивает её семейное положение.
- source_word: וַתְּסַפֶּר לוֹ
  choice: и она всё ему рассказала
  rationale: Пиэль ספר означает «рассказывать, излагать». Добавленное «всё» естественно выражает подразумеваемое содержание её рассказа, не вводя нового факта.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: Тогда царь приставил к ней одного придворного[a]
  rationale: Конструкция означает назначение человека для содействия женщине и исполнения царского распоряжения. «Приставил к ней» передаёт административное поручение; אֶחָד сохранено как «одного». Термин סָרִיס допускает значения «евнух» и «придворный», поэтому неоднозначность отмечена в сноске.
- source_word: לֵאמֹר
  choice: и приказал
  rationale: Формально слово вводит прямую речь («говоря»), но содержание является царским повелением, поэтому «и приказал» естественно передаёт функцию оборота.
- source_word: הָשֵׁיב
  choice: Верни
  rationale: Каузативный императив от שוב требует возвратить женщине имущество и доход от поля. Русское «верни» ясно и естественно относится ко всему перечисленному.
- source_word: אֵת כָּל אֲשֶׁר לָהּ
  choice: всё, что ей принадлежит
  rationale: Передаёт всеохватный характер царского распоряжения без неоправданного уточнения вида имущества.
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: весь урожай с её поля
  rationale: תְּבוּאָה обозначает урожай или плоды земли. Притяжательное «её» ясно из контекста и естественно связывает поле с возвращаемой собственностью.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: со дня, когда она покинула эту землю, и доныне
  rationale: Формулировка сохраняет исходную временную границу и не сужает אֶרֶץ до конкретного политического значения «страна».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для широкого читателя; административная роль придворного выражена ясно, а подлинная неоднозначность титула вынесена в сноску.
