  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: ru
  text: И он устремил взгляд и не отводил его, пока не стало стыдно[a]. И человек Божий заплакал.
  philosophy: optimal-equivalence
  footnotes:
