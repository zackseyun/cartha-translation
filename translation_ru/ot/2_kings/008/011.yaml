    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: устремил на него взгляд
  rationale: Хифиль глагола עמד с «лицом» как дополнением передаёт удерживание лица или взгляда в неподвижном положении. По-русски сочетание «устремил взгляд» естественно выражает этот образ; местоимение «на него» восстанавливает подразумеваемый контекстом объект взгляда.
- source_word: וַיָּשֶׂם
  choice: пристально смотрел
  rationale: Буквально «положил, установил»; вместе с предыдущим оборотом описывает продолжительный неподвижный взгляд. Буквальное «поставил» по-русски здесь неясно, поэтому выбран естественный контекстуальный эквивалент.
- source_word: עַד־בֹּשׁ
  choice: пока тот не смутился
  rationale: בוש обозначает стыд или смущение. Указательное местоимение делает русскую фразу естественной, но не называет участника прямо; неоднозначность отнесения поясняется в сноске.
- source_word: וַיֵּבְךְּ
  choice: заплакал
  rationale: Глагол בכה означает «плакать». Совершенный вид естественно передаёт начало действия в повествовательной последовательности.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён обычный библейский титул пророка, а не подставлено поясняющее «пророк».
theological_decisions:
- issue: Кто смутился в выражении עַד־בֹּשׁ
  choice: Не называть участника по имени в основном тексте и отметить неоднозначность сноской
  alternative: «пока Азаил не смутился» или «пока он сам не смутился»
  rationale: Еврейская конструкция не называет субъект явно, а контекст допускает различное синтаксическое отнесение. Перевод не должен без необходимости решать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Выражения «устремил взгляд» и «пристально смотрел» передают необычный еврейский оборот естественно, а короткое заключительное предложение сохраняет его эмоциональную силу.
