    issue: Утрата синтаксической неоднозначности в выражении «пока тот не смутился».
    rationale: Указательное местоимение «тот» в нормальном русском употреблении отсылает к тому, на кого был устремлён взгляд; это определяет субъект как Азаила, хотя сноска утверждает сохранение неоднозначности.
  - severity: low
    issue: «Смутился» не вполне передаёт семантический центр בוש.
    rationale: Глагол בוש прежде всего относится к стыду/посрамлению; безличное «пока не стало стыдно» передаёт это значение и не называет испытывающего стыд.
  - severity: low
    issue: «На него» излишне конкретизирует направление взгляда.
    rationale: Контекст делает адресата вероятным, но еврейский текст здесь говорит о его лице, не вводя отдельного объекта с предлогом «на»; нейтральная формулировка позволяет не добавлять эту конкретизацию.
