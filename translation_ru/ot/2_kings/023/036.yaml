base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: ru
  text: Иоаким был двадцати пяти лет, когда стал царём, и царствовал в Иерусалиме одиннадцать лет. Имя его матери — Зевида[a], дочь Федаии, из Румы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В масоретской традиции это имя читается: «Зевуда»; в написании текста: «Зевида».'
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: был двадцати пяти лет
  rationale: Стандартный древнееврейский оборот для обозначения возраста передан естественным и достойным русским выражением.
- source_word: בְּמָלְכוֹ
  choice: когда стал царём
  rationale: Предлог בְּ с формой от מלך указывает на время вступления на царство; такой перевод естественен в русской формуле о правлении.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти, то есть царствование.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предложное сочетание обозначает место, откуда осуществлялось правление.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Генеалогическая формула передана современным литературным русским языком без потери смысла.
- source_word: זבידה
  choice: Зевудда
  rationale: Кетив זבידה сопровождается масоретским чтением זְבוּדָה; выбранная русская форма передаёт традиционное чтение, а письменная форма отмечена в сноске.
- source_word: בַת פְּדָיָה
  choice: дочерью Федаии
  rationale: Прямое обозначение родства; имена переданы в принятой русской библейской форме.
- source_word: מִן רוּמָה
  choice: из Румы
  rationale: Предлог מִן здесь естественно указывает на происхождение или родной город.
