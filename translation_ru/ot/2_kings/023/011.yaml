base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: ru
  text: Он убрал коней, которых цари Иудеи посвятили солнцу и которые находились от входа в дом Яхве до расположенной в пределах храмового комплекса[b] комнаты Нетан-Мелеха, придворного служителя[a]; а колесницы солнца он сжёг в огне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнуха». Еврейское слово может обозначать как евнуха, так и царского или придворного служителя.'
    reason: lexical_alternative
  - marker: b
    text: Употреблённое здесь редкое еврейское слово, вероятно, обозначает внешнюю или периферийную часть храмовой территории; возможны также переводы «в предместьях» или «в галереях».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: убрал
  rationale: Порода hифиль глагола שׁבת означает «прекратить, устранить, вывести из употребления». В рассказе о реформе Иосии «убрал» естественно передаёт прекращение культового использования коней.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: которых цари Иудеи посвятили солнцу
  rationale: נתן буквально означает «дать», но в данном культовом контексте речь идёт о передаче коней для почитания солнца; «посвятили» ясно передаёт функцию, не называя солнце собственным именем божества.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: от входа в дом Яхве к помещению
  rationale: Перевод сохраняет направительные предлоги מִן («от») и אֶל («к»), не сглаживая сжатое и допускающее разные пространственные истолкования еврейское выражение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
- source_word: נְתַן מֶלֶךְ
  choice: Нетан-Мелех
  rationale: Имя транслитерировано в соответствии с масоретской огласовкой; дефис помогает русскому читателю воспринимать его как единое составное имя.
- source_word: הַסָּרִיס
  choice: придворный служитель
  rationale: סָרִיס может обозначать как евнуха, так и царского или придворного должностного лица. Основной текст передаёт служебное положение, а более узкое значение сохранено в примечании.
- source_word: בַּפַּרְוָרִים
  choice: во внешней части храмового комплекса
  rationale: Редкое слово, вероятно, обозначает периферийную или внешнюю зону храмовой территории. Формулировка остаётся понятной и не утверждает конкретную архитектурную деталь.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: колесницы солнца
  rationale: Буквальное словосочетание сохраняет необычный культовый образ исходного текста.
- source_word: שָׂרַף בָּאֵשׁ
  choice: сжёг в огне
  rationale: Сохранено явное упоминание огня, хотя по-русски оно несколько избыточно, поскольку так передаётся эмфаза еврейской формулы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и соответствует наиболее распространённой научной реконструкции его произношения.
- issue: Характер посвящения коней и колесниц солнцу
  choice: солнце со строчной буквы, без уточняющего имени божества
  alternative: бог солнца; Солнце
  rationale: Еврейский текст употребляет обычное существительное שֶׁמֶשׁ и не называет конкретного бога. Контекст показывает культовое назначение, но перевод не должен конкретизировать его сверх источника.
- issue: Значение הַסָּרִיס
  choice: придворный служитель с примечанием «евнух»
  alternative: евнух
  rationale: Термин допускает оба значения, а контекст не позволяет надёжно установить физический статус Нетан-Мелеха. Основной текст передаёт несомненную придворную функцию, сохраняя альтернативу в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сохраняет сжатую пространственную конструкцию оригинала и её неоднозначность; редкие термины разъяснены в примечаниях.
