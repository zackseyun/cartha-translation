base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: ru
  text: Он вынес Ашеру[a] из дома Яхве за пределы Иерусалима, к долине Кедрон, сжёг её в долине Кедрон, растёр в прах и бросил её прах на кладбище простого народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столб Ашеры»; «изображение Ашеры». Еврейское слово может обозначать хананейскую богиню Ашеру или связанный с её почитанием культовый предмет; здесь речь идёт о предмете, который вынесли и уничтожили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: Ашеру
  rationale: Транслитерация сохраняет конкретное культовое наименование и не уточняет без достаточных оснований, был ли это столб или иное изображение; по контексту речь идёт об уничтожаемом культовом предмете.
- source_word: מִבֵּית יְהוָה
  choice: из дома Яхве
  rationale: Формально передаёт еврейское выражение «дом Яхве», оставаясь понятным обозначением храма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: נַחַל קִדְרוֹן
  choice: долина Кедрон
  rationale: נחל может обозначать долину или русло сезонного потока; «долина Кедрон» естественно передаёт географический смысл без излишнего уточнения гидрологии.
- source_word: וַיָּדֶק לְעָפָר
  choice: растёр в прах
  rationale: Передаёт доведение сожжённого предмета до мелких частиц и сохраняет библейскую выразительность при современном русском синтаксисе.
- source_word: עֲפָרָהּ
  choice: её прах
  rationale: עפר означает пыль или прах, а не обязательно пепел; «прах» согласуется с предшествующим уничтожением и не сужает смысл до остатка от горения.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: на кладбище простого народа
  rationale: Единственное קבר в собирательном или локативном употреблении естественно передаётся как «кладбище»; «простой народ» выражает вероятный социальный оттенок בני העם в противопоставлении знати.
theological_decisions:
- issue: Обозначение культового предмета אֲשֵׁרָה
  choice: Ашеру
  alternative: столб Ашеры; изображение Ашеры
  rationale: Контекст однозначно указывает на вещественный культовый объект, но его точная форма не названа; транслитерация сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Цепочка действий передана энергично, без избыточного повторения союзов; повтор «в долине Кедрон» сохранён как значимая черта исходного текста. Женские местоимения обусловлены грамматическим родом имени «Ашера» и не предназначены для разрешения вопроса о точной форме предмета.
