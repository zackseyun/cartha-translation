base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: ru
  text: Иосия обернулся и увидел гробницы[a], находившиеся там, на горе. Он послал взять из гробниц кости, сжёг их на жертвеннике и осквернил его — по слову Яхве, которое провозгласил человек Божий[b], возвестивший об этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «могилы», «места погребения». Еврейское слово может обозначать место погребения вообще, а не только сооружённую гробницу.
    reason: lexical_alternative
  - marker: b
    text: Или «громко возвестил», «возгласил». Еврейский глагол может подчёркивать громкое публичное провозглашение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: обернулся
  rationale: Глагол פנה обозначает поворот; «обернулся» естественно передаёт физическое движение Иосии перед тем, как он увидел гробницы.
- source_word: הַקְּבָרִים
  choice: гробницы
  rationale: קבר может означать могилу, гробницу или место погребения. В данном повествовательном контексте речь идёт о заметных местах погребения на горе; возможный более широкий смысл отмечен в сноске.
- source_word: בָּהָר
  choice: на горе
  rationale: הַר может обозначать гору или холм. Прямой вариант «на горе» сохраняет топографическую деталь, не уточняя высоту местности.
- source_word: הָעֲצָמוֹת
  choice: кости
  rationale: Буквальное конкретное значение עצמות важно для описанного осквернения жертвенника.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: сжёг их на жертвеннике
  rationale: Прямое дополнение — кости, а על при слове «жертвенник» естественно передаётся как «на»; формулировка сохраняет характер совершённого осквернения.
- source_word: וַיְטַמְּאֵהוּ
  choice: осквернил его
  rationale: В ритуальном контексте טמא означает сделать нечистым, осквернить; местоименный суффикс естественнее всего относится к жертвеннику.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Устойчивая формула указывает на исполнение ранее данного Божьего слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Это буквальный и традиционно понятный пророческий титул без поясняющей подмены словом «пророк».
- source_word: קָרָא
  choice: провозгласил / возвестивший
  rationale: קרא здесь обозначает публичное авторитетное возвещение. Два русских глагола избегают неестественного стилистического повтора, сохраняя оба употребления еврейского глагола.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: обо всём этом
  rationale: דברים может означать слова, дела, события или обстоятельства. Здесь выражение отсылает к предсказанному и ныне исполнившемуся, поэтому широкий русский оборот передаёт контекст без чрезмерного уточнения.
theological_decisions:
- issue: Связь действий Иосии с прежним пророчеством
  choice: «по слову Яхве, которое провозгласил человек Божий»
  alternative: «согласно слову Яхве, которое возгласил человек Божий»
  rationale: Формулировка ясно представляет действия Иосии как исполнение слова Яхве, переданного через человека Божьего, не добавляя отсутствующих в тексте подробностей.
- issue: Повтор относительных конструкций с קרא
  choice: «которое провозгласил человек Божий, возвестивший обо всём этом»
  alternative: «которое провозгласил человек Божий, который провозгласил эти слова»
  rationale: Сохранены обе части еврейской фразы и её связь с человеком Божьим, но второй глагол передан синонимом ради естественного русского стиля. Неоднозначность דברים сохранена широким выражением «обо всём этом».
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет в переводе личное имя Бога, представленное тетраграмматоном.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; добавление «людей» после «послал» эксплицирует подразумеваемых исполнителей поручения и не меняет деятеля последующих действий. Конкретные культовые термины «кости», «жертвенник», «осквернил» сохранены.
