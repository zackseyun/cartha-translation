base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: А остальные деяния Иосии и всё, что он сделал, не записаны ли[a] в «Книге летописей царей Иудеи»[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не написаны ли». Еврейская форма буквально означает «написаны», но в контексте летописной записи естественно также значение «записаны».'
    reason: lexical_alternative
  - marker: b
    text: «Книга летописей царей Иудеи» — царский письменный источник, на который ссылаются Книги Царств; это название не обязательно относится к каноническим книгам Паралипоменон в их окончательном виде.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: А остальные деяния
  rationale: יֶתֶר обозначает оставшуюся часть, а דִּבְרֵי в формуле царского итога — деяния или дела царя. «А» естественно передаёт начальное וְ как связь с предыдущим повествованием, не привнося временного значения «теперь».
- source_word: יֹאשִׁיָּהוּ
  choice: Иосии
  rationale: Использована традиционная русская форма библейского имени Иосия в требуемом родительном падеже.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он совершил
  rationale: Фраза в широком смысле охватывает все поступки и достижения царя; «совершил» естественно и достойно передаёт עָשָׂה в историографическом контексте.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: не записаны ли
  rationale: Сохранён риторический вопрос, предполагающий утвердительный ответ. «Записаны» естественно передаёт письменную фиксацию в архивном источнике.
- source_word: עַל סֵפֶר
  choice: в «Книге»
  rationale: Хотя עַל буквально может означать «на», в русском языке о тексте говорят, что он записан «в книге». Кавычки обозначают название источника.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: «Книга летописи царей Иудеи»
  rationale: Название передано как обозначение хронологической царской записи. «Царей Иудеи» ясно выражает отношение источника к иудейским царям и звучит современно.
theological_decisions:
- issue: Идентификация «Книги летописи царей Иудеи»
  choice: Не отождествлять её в основном тексте с каноническими книгами Паралипоменон
  alternative: Передать название как прямую ссылку на библейские 1–2 Паралипоменон
  rationale: В Книгах Царств это название цитируемого царского летописного источника; текст не требует считать его каноническими книгами Паралипоменон в их окончательном виде.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историографическим звучанием. Риторическая форма оригинала сохранена; синтаксис остаётся понятным обычному читателю.
