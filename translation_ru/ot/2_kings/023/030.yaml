  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: ru
  text: Его слуги привезли его мёртвым из Мегиддо в Иерусалим[a] и похоронили в его гробнице. Затем народ земли[b] взял Иоахаза, сына Иосии, помазал его и поставил царём вместо его отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повезли его». Первый глагол буквально означает «дали ему ехать» или «посадили его ехать»; здесь речь о перевозке тела Иосии.'
    reason: lexical_alternative
  - marker: b
    text: «Народ земли» — устойчивое древнееврейское обозначение местного населения, выступающего здесь как политическая сила.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: повезли его
  rationale: Порода хифиль глагола רכב буквально означает «дали ехать / посадили и повезли». В сочетании с מֵת речь идёт о перевозке тела Иосии; «повезли» сохраняет образ транспортировки, не создавая впечатления, будто он ехал сам.
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: עבד может обозначать как слуг, так и царских служителей или придворных. «Слуги» прямо передаёт слово, а контекст указывает на царское окружение.
- source_word: מֵת
  choice: мёртвым
  rationale: Слово обозначает состояние Иосии во время перевозки и естественно передаётся русским творительным предикативным «мёртвым».
- source_word: וַיְבִאֻהוּ יְרוּשָׁלַם
  choice: доставили в Иерусалим
  rationale: Глагол בוא в каузативном употреблении означает «принести/привести». После «повезли» глагол «доставили» естественно выражает завершение перевозки тела.
- source_word: בִּקְבֻרָתוֹ
  choice: в его гробнице
  rationale: קְבֻרָה здесь обозначает место погребения. «Гробница» уместна в контексте царского погребения и точнее, чем возможное «могила», передаёт устроенное место захоронения.
- source_word: עַם הָאָרֶץ
  choice: народ земли
  rationale: Сохранено устойчивое древнееврейское общественно-политическое выражение без сведения его значения к «простому народу» или населению всей страны.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Сохранено прямое значение לקח. В данном контексте оно относится к избранию Иоахаза для возведения на престол, но перевод не добавляет отсутствующего в тексте уточнения.
- source_word: יְהוֹאָחָז
  choice: Иоахаз
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: сына Иосии
  rationale: Естественная русская передача родственного определения с сохранением явного указания на происхождение.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: помазал его
  rationale: משׁח прямо обозначает обряд помазания при возведении на царство; политико-ритуальный смысл сохранён.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: поставил царём вместо его отца
  rationale: Форма המליך означает «сделать/поставить царём», а תַּחַת אָבִיו — преемство на месте отца.
theological_decisions:
- issue: Царское помазание Иоахаза
  choice: помазал его
  alternative: назначил его
  rationale: Еврейский текст прямо называет обряд помазания, а не только назначение; сохранена его церемониальная и монархическая значимость.
- issue: Социально-политическая идентичность עַם הָאָרֶץ
  choice: народ земли
  alternative: простой народ
  rationale: Выражение может обозначать политически действующую часть местного населения. Буквально-устойчивая передача не ограничивает его одним социальным слоем.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским регистром. Синтаксический ряд повествовательных действий сохранён, но лексика сделана естественной для современного читателя. Все сноски имеют маркеры в основном тексте.
