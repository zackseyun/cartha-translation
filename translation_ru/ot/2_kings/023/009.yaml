base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: ru
  text: Однако священники высот[a] не восходили к жертвеннику Яхве[b] в Иерусалиме, а ели пресный хлеб среди своих братьев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Высоты» — библейское обозначение местных культовых мест.
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит имя יהוה (ЙХВХ), традиционно передаваемое словом «Господь».
    reason: alternative_reading
  - marker: c
    text: Вероятно, речь идёт об их собратьях-священниках или родственниках из священнических родов.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Однако
  rationale: 'Передаёт ограничительно-противительный смысл частицы: реформа была проведена, однако эти священники не служили у иерусалимского жертвенника.'
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: священники святилищ на возвышенностях
  rationale: Передаёт культовый смысл בָּמוֹת понятным современному читателю выражением; речь идёт о местных культовых местах, нередко располагавшихся на возвышенностях.
- source_word: יַעֲלוּ
  choice: не восходили
  rationale: Сохраняет обычное значение עלה и традиционный пространственно-паломнический образ восхождения в Иерусалим, не добавляя прямо не выраженной идеи запрета.
- source_word: מִזְבַּח יְהוָה
  choice: жертвеннику Яхве
  rationale: Естественно передаёт конструкцию принадлежности и сохраняет личное Божье имя.
- source_word: כִּי אִם
  choice: а
  rationale: 'В данном отрицательно-противительном построении вводит контраст: они не восходили к жертвеннику, а ели пресный хлеб.'
- source_word: אָכְלוּ מַצּוֹת
  choice: ели пресный хлеб
  rationale: Ясно и естественно передаёт מַצּוֹת как хлеб без закваски; русское собирательное единственное число здесь идиоматично.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: среди своих братьев
  rationale: Сохраняет буквальный мужской термин родства и не вводит в основной текст контекстуальное уточнение «священников».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя, тогда как традиционное «Господь» передаёт его титулом; традиционный вариант отмечен в сноске.
- issue: Кем являются «их братья»
  choice: свои братья
  alternative: другие священники / собратья-священники
  rationale: Контекст, вероятно, указывает на других священников или членов священнических родов, но само еврейское выражение этого уточнения не содержит, поэтому неоднозначность сохранена.
- issue: Характер недопущения к жертвеннику
  choice: не восходили
  alternative: не допускались служить
  rationale: Контекст может подразумевать, что им не позволяли совершать служение, однако еврейский глагол прямо сообщает лишь, что они не восходили к жертвеннику. Перевод не превращает подразумеваемое ограничение в явное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Восходили» сохраняет иерусалимскую пространственно-культовую идиому, а «святилища на возвышенностях» делает специальный термин понятным без чрезмерного упрощения.
