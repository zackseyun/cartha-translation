  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: ru
  text: И делал он зло в глазах Яхве, во всём поступая так же, как его отцы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его отцы»; то есть его предки или предшественники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И делал он
  rationale: Форма с повествовательным וַ продолжает рассказ; несовершенный вид естественно передаёт устойчивый образ действий царя.
- source_word: הָרַע
  choice: зло
  rationale: Сочетание עשה הרע — устойчивая формула со значением «делать зло»; перевод сохраняет её смысл без неестественного «делать это зло».
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранена прозрачная древнееврейская метафора оценки, понятная и в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: כְּכֹל אֲשֶׁר
  choice: во всём поступая так же, как
  rationale: Формулировка естественно передаёт всеохватность כֹּל и сравнение с прежним образом действий.
- source_word: עָשׂוּ
  choice: поступая так же
  rationale: В русском контексте глагол «поступать» естественно передаёт сопоставление поведения, избегая тяжеловесного повтора «делал… делали».
- source_word: אֲבֹתָיו
  choice: его отцы
  rationale: Сохранено буквальное значение; в данной царской формуле речь может идти о предках или предшественниках, что пояснено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Кого обозначает אֲבֹתָיו в царской формуле
  choice: отцы
  alternative: предки; предшественники
  rationale: Буквальное «отцы» сохраняет широту древнееврейского выражения и не вынуждает выбирать только кровных предков или только прежних правителей.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемой библейской формулы «делать зло в глазах Яхве». Порядок слов слегка возвышенный, но понятный; сноска сохраняет смысловую широту слова «отцы».
