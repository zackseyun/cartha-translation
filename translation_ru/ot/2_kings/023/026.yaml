  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: ru
  text: Но Яхве не отвратился от пыла Своего великого гнева[a], который воспылал против Иуды[b], за все поступки, которыми Манассия прогневал Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Своего великого пылающего гнева». В еврейском тексте употреблён образ сильного, разгоревшегося гнева.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Иуде». Еврейский предлог буквально может означать «в», но в русском при гневе обычно употребляется «против» кого-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Передаёт резкое противопоставление предшествующему рассказу о реформах Иосии; в современном русском здесь естественнее «но», чем «однако».
- source_word: שָׁב
  choice: не отвратился
  rationale: Сохраняет пространственную метафору еврейского глагола «повернуть(ся), отступить», не заменяя её толкованием «не смилостивился».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не титулом.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: от пыла Своего великого гнева
  rationale: «Пыл гнева» естественно по-русски сохраняет образ горящего, разгоревшегося гнева; הַגָּדוֹל отнесено к гневу без тяжеловесного оборота «величие пыла».
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: которым Он воспылал
  rationale: Сохраняет повтор образа жара и гнева, но избегает ненормативного русского «Его гнев горел» в относительной конструкции.
- source_word: בִּיהוּדָה
  choice: на Иуду
  rationale: В контексте гнева русское управление «воспылать гневом на» ясно передаёт направленность, тогда как буквальное «в Иуде» допускает иной оттенок и отмечено в сноске.
- source_word: עַל כָּל הַכְּעָסִים
  choice: за все те дела
  rationale: Множественное существительное обозначает вызывающие гнев поступки или провокации; «дела» звучит естественно, а их характер раскрывает следующий глагол.
- source_word: הִכְעִיסוֹ
  choice: прогневал Его
  rationale: Передаёт каузативное значение «вызвал Его гнев» и сохраняет связь с лексикой гнева.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Традиционная и узнаваемая русская форма имени.
theological_decisions:
- issue: Антропопатический образ Божьего гнева
  choice: Сохранить образы пыла и воспламенившегося гнева.
  alternative: «Яхве не отказался от Своего великого негодования»
  rationale: Еврейский текст дважды использует телесно-тепловую образность гнева; перевод не смягчает и не систематизирует её.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя исходного текста и соответствует заданному консультационному слою.
- issue: Направленность гнева в בִּיהוּדָה
  choice: на Иуду
  alternative: в Иуде
  rationale: Русская идиома требует «воспылать гневом на кого-либо», однако буквальное значение предлога допускает локативное прочтение, которое сохранено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Синтаксис умеренно формальный; сохранены повтор и жаровая образность гнева без искусственного буквализма.
