base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: ru
  text: Он заколол[a] на жертвенниках всех бывших там жрецов высотных святилищ и сжёг на этих жертвенниках человеческие кости. Затем он возвратился в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принёс в жертву». Еврейский глагол может обозначать жертвенное заклание; здесь он описывает насильственное умерщвление служителей местного культа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: заколол
  rationale: Глагол זבח может обозначать как заклание, так и принесение жертвы. «Заколол» передаёт насильственное умерщвление и сохраняет культовый оттенок, не утверждая прямо, что это было законным жертвоприношением.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: жрецов святилищ на высотах
  rationale: Так переданы служители местных культовых мест, называемых בָּמוֹת. Слово «жрецы» естественно для служителей осуждаемого культа, а поясняющее «святилищ на высотах» понятнее современному читателю, чем буквальное «высот».
- source_word: אֲשֶׁר שָׁם
  choice: которые там находились
  rationale: Сохраняет относительное и местное значение еврейского оборота и естественно звучит по-русски.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: на жертвенниках
  rationale: Прямо передаёт пространственное значение עַל; контекст описывает убийство жрецов непосредственно на жертвенниках.
- source_word: עַצְמוֹת אָדָם
  choice: человеческие кости
  rationale: אָדָם употреблено обобщённо о человеке, а не специально о мужчине; выбранный оборот точен и идиоматичен.
- source_word: עֲלֵיהֶם
  choice: на этих жертвенниках
  rationale: Явное повторение существительного устраняет возможную неясность русского местоимения и передаёт наиболее естественный антецедент — жертвенники.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: Затем он возвратился в Иерусалим
  rationale: «Затем» естественно передаёт последовательность повествования, а «возвратился» — значение שׁוב.
theological_decisions:
- issue: Возможный жертвенный оттенок וַיִּזְבַּח при умерщвлении жрецов
  choice: заколол
  alternative: принёс в жертву
  rationale: Перевод «заколол» сохраняет суровость действия и культовую окраску глагола, но не представляет убийство как прямо названное в тексте законное жертвоприношение. Альтернатива вынесена в примечание, чтобы не устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Конструкция упрощена для ясности, при этом сохранены жестокость сцены, культовая лексика и неоднозначность ключевого глагола.
