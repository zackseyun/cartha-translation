  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: ru
  text: Ибо такой Пасхи[a] не совершали ни со времён судей, судивших Израиль, ни во все дни царей Израиля и царей Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как эта Пасха»; смысл: «Пасхи, подобной этой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим утверждением о Пасхе Иосии.
- source_word: לֹא נַעֲשָׂה
  choice: не совершали
  rationale: Буквально пассивная конструкция означает «не была сделана»; применительно к Пасхе естественное русское выражение «не совершали» передаёт соблюдение праздника.
- source_word: כַּפֶּסַח הַזֶּה
  choice: такой Пасхи
  rationale: Сравнительная частица כְּ при указательном выражении означает Пасху, подобную этой, а не полное отсутствие празднования Пасхи.
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: со времён судей
  rationale: Естественно передаёт исходную временную точку сравнения.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: которые судили Израиль
  rationale: Сохраняет корневой повтор «судьи — судили» и не сужает их роль до современного судебного значения.
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: и во все дни царей Израиля и царей Иудеи
  rationale: Сохраняет параллельную структуру еврейского текста и различение двух царств; продолжение отрицания ясно из русской конструкции.
theological_decisions:
- issue: Объём исторического сопоставления
  choice: Не совершали Пасхи, подобной Пасхе Иосии, на протяжении эпохи судей и царей обоих царств.
  alternative: Во весь этот период Пасху вообще не совершали.
  rationale: Сравнительное כַּפֶּסַח הַזֶּה указывает не на полное отсутствие пасхальных празднований, а на отсутствие празднования, подобного этому; перевод не решает дополнительно, следует ли понимать историческое обобщение строго или риторически.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Совершали Пасху» выбрано как естественное культовое выражение; синтаксис сохраняет исторический размах и параллелизм исходного текста.
