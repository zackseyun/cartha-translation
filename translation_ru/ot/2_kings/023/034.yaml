  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: ru
  text: Фараон Нехо поставил Елиакима, сына Иосии, царём вместо его отца Иосии и изменил его имя на Иоаким[a]. Иоахаза же он взял, и тот пришёл в Египет[b] и там умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть фараон Нехо переименовал Елиакима в Иоакима.
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «и тот отправился в Египет». Буквально в еврейском тексте: «пришёл в Египет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: поставил ... царём
  rationale: Каузативная форма глагола מלך означает, что фараон возвёл Елиакима на престол; «поставил царём» естественно передаёт это значение.
- source_word: תַּחַת יֹאשִׁיָּהוּ אָבִיו
  choice: вместо его отца Иосии
  rationale: תַּחַת в контексте престолонаследия означает замещение; местоимение относится к Елиакиму.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: изменил его имя
  rationale: Сохраняет образность еврейского выражения и ясно сообщает о переименовании.
- source_word: יְהוֹיָקִים
  choice: Иоаким
  rationale: Употреблена укоренившаяся русская библейская форма имени.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: Иоахаза же он взял
  rationale: Глагол לקח передан без уточнения, было ли это пленением, арестом или иным принудительным уведением; частица «же» отмечает смену объекта повествования.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: и тот пришёл в Египет
  rationale: Сохранено буквальное направление глагола בוא — «прийти»; «тот» естественно указывает на Иоахаза и устраняет ненужную русскую местоименную неясность.
- source_word: וַיָּמָת שָׁם
  choice: и там умер
  rationale: Кратко и прямо воспроизводит лаконичный итог еврейского повествования.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства исторического повествования. Использованы традиционные русские формы библейских имён. Неоднозначная простота глагола לקח сохранена, а непривычное для русского повествовательного ракурса «пришёл в Египет» пояснено в сноске.
