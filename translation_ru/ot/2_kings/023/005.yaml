  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: ru
  text: Он отстранил жрецов[a], которых цари Иудеи поставили воскурять благовония на высотах в городах Иудеи и в окрестностях Иерусалима, а также тех, кто воскурял благовония Ваалу, солнцу, луне, созвездиям[b] и всему небесному воинству[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служителей языческого культа». Еврейское слово обозначает жрецов, связанных с незаконным или идолопоклонническим поклонением, а не законных священников Господа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знакам зодиака». Еврейское слово, вероятно, обозначает созвездия или иные группы небесных светил.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «всему воинству небес». Здесь имеются в виду небесные светила, которым поклонялись в астральных культах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: Он отстранил
  rationale: Каузативная форма от שׁבת означает «заставил прекратить, положил конец». В отношении назначенных культовых служителей «отстранил» естественно передаёт прекращение их деятельности, не утверждая, что они были убиты.
- source_word: הַכְּמָרִים
  choice: жрецов
  rationale: כְּמָרִים обозначает служителей незаконного или идолопоклоннического культа, а не законных священников Господа. Русское «жрецы» выражает это различие без добавления определения, которого нет непосредственно в тексте.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: которых цари Иудеи поставили
  rationale: נתן в данной конструкции имеет значение назначения или поставления на служение; форма прошедшего времени естественно показывает, что это произошло до реформы Иосии.
- source_word: וַיְקַטֵּר
  choice: воскурять благовония
  rationale: קטר может обозначать воскурение благовоний или дымное приношение. Здесь традиционное и понятное выражение «воскурять благовония» сохраняет культовый смысл.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: במות — устойчивое обозначение местных культовых мест, часто располагавшихся на возвышенностях; «высоты» сохраняет библейский термин.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: в городах Иудеи и в окрестностях Иерусалима
  rationale: מְסִבֵּי указывает на окружающую местность; «в окрестностях» точно и естественно передаёт пространственный смысл.
- source_word: וְאֶת הַמְקַטְּרִים
  choice: а также тех, кто воскурял благовония
  rationale: Причастие характеризует ещё одну группу людей по совершаемому ими культу. Такая формулировка ясно передаёт координацию с первым прямым дополнением.
- source_word: לַבַּעַל
  choice: Ваалу
  rationale: Имя божества передано в принятой русской форме; дательный падеж выражает направленность поклонения.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: солнцу, луне
  rationale: Перечень отдельных объектов астрального поклонения передан кратко и естественно; русские падежные формы делают повтор предлога ненужным.
- source_word: וְלַמַּזָּלוֹת
  choice: созвездиям
  rationale: מַזָּלוֹת, вероятно, обозначает созвездия или зодиакальные группы; «созвездия» сохраняет необходимую неопределённость и не сужает значение до знаков зодиака.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: и всему небесному воинству
  rationale: Устойчивое выражение צְבָא הַשָּׁמַיִם здесь обозначает совокупность небесных светил как объектов поклонения. «Небесное воинство» формально сохраняет образ исходного текста.
theological_decisions:
- issue: Следует ли передавать כְּמָרִים нейтральным словом «священники» или обозначить их как служителей незаконного культа
  choice: жрецы
  alternative: священники; идолопоклоннические жрецы
  rationale: Контекст реформы Иосии и употребление כְּמָרִים в еврейской Библии указывают на служителей незаконного или чужого культа. «Жрецы» отличает их от законных священников Господа, но не добавляет прямо отсутствующего определения «идолопоклоннические».
- issue: Кого обозначает выражение «небесное воинство» в данном контексте
  choice: сохранён исходный образ с пояснением, что речь идёт о небесных светилах
  alternative: все небесные светила
  rationale: Контекст солнца, луны и созвездий указывает на астральный культ, однако буквальный образ «воинства» важен и не должен без необходимости исчезать из основного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Термины «воскурять благовония», «высоты» и «небесное воинство» сохраняют культовую и образную лексику оригинала; синтаксис упрощён настолько, чтобы стих оставался понятным при чтении вслух.
