source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: ru
  text: И царь повелел первосвященнику Хелкии, священникам второго чина и стражам порога вынести из храма Яхве все предметы, сделанные для Ваала, для Ашеры[a] и для всего небесного воинства. Он сжёг их за пределами Иерусалима, на полях Кедрона, и отнёс их прах в Вефиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для столба Ашеры». Еврейское слово אֲשֵׁרָה может обозначать как богиню Ашеру, так и связанный с ней культовый предмет.'
    reason: Сохраняет лексическую и референциальную неоднозначность исходного текста.
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: И царь повелел
  rationale: Передаёт властный характер צוה и сохраняет последовательное повествование, выраженное формой с waw.
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: первосвященнику Хелкии
  rationale: הַכֹּהֵן הַגָּדוֹל — принятое обозначение высшей священнической должности; русская форма имени «Хелкия» соответствует библейской традиции.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: священникам второго чина
  rationale: Сохраняет указание на второй ранг, не уточняя сверх текста конкретное устройство священнической иерархии.
- source_word: שֹׁמְרֵי הַסַּף
  choice: стражам порога
  rationale: Близко передаёт буквальный образ и официальную храмовую функцию; «привратники» было бы более интерпретирующим.
- source_word: מֵהֵיכַל יְהוָה
  choice: из храма Яхве
  rationale: В данном культовом контексте הֵיכָל означает храм, а тетраграмматон передан личным именем «Яхве».
- source_word: כָּל הַכֵּלִים
  choice: все предметы
  rationale: Русское «предметы» естественно охватывает культовые сосуды, принадлежности и орудия, не сужая значение כְּלִי.
- source_word: לַבַּעַל וְלָאֲשֵׁרָה וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: для Ваала, для Ашеры и для всего небесного воинства
  rationale: Сохраняет параллельную конструкцию с לְ и не устраняет неоднозначность אֲשֵׁרָה.
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: на полях у Кедрона
  rationale: שַׁדְמוֹת обозначает поля или земельные участки; «у Кедрона» естественно выражает локальную связь, не уточняя, идёт ли речь о долине или потоке.
- source_word: וְנָשָׂא אֶת עֲפָרָם בֵּית אֵל
  choice: а прах их отвёз в Вефиль
  rationale: עָפָר буквально означает пыль или прах, а не просто пепел; נָשָׂא здесь контекстуально передано как транспортировка останков.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передача «Яхве» сохраняет личное заветное имя, непосредственно присутствующее в еврейском тексте.
- issue: Референт אֲשֵׁרָה
  choice: Ашера
  alternative: столб Ашеры; культовый предмет, связанный с Ашерой
  rationale: Синтаксический ряд с Ваалом и небесным воинством позволяет читать слово как имя адресата культа, однако лексема может также обозначать связанный с богиней культовый объект; эта неоднозначность отмечена в сноске.
- issue: Подлежащее единственного числа וַיִּשְׂרְפֵם и וְנָשָׂא
  choice: Он
  alternative: их сожгли и отвезли
  rationale: Еврейские глаголы стоят в единственном числе и формально продолжают действие царя; русский текст сохраняет это, не объясняя, исполнял ли он приказ лично или через подчинённых.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для широкого читателя, при этом сохранены храмовая терминология, ранговое обозначение священников и неоднозначность слова אֲשֵׁרָה.
