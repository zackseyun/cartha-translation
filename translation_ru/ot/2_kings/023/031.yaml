base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: ru
  text: Иоахазу было двадцать три года, когда он стал царём, и царствовал он в Иерусалиме три месяца. Его мать звали Хамуталь; она была дочерью Иеремии из Ливны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: Иоахазу было двадцать три года
  rationale: Стандартный древнееврейский оборот для обозначения возраста передан естественной современной русской конструкцией.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция с ב указывает на время восшествия на престол; выбранный вариант ясно и естественно передаёт это значение.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: и царствовал он ... три месяца
  rationale: Временной винительный обозначает продолжительность царствования; русский порядок слов сохраняет достоинство летописной формулы.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места царствования.
- source_word: וְשֵׁם אִמּוֹ חֲמוּטַל
  choice: Его мать звали Хамуталь
  rationale: Формула имени матери передана естественно по-русски; форму имени Хамуталь выбрали как близкую древнееврейскому произношению.
- source_word: בַּת יִרְמְיָהוּ
  choice: она была дочерью Иеремии
  rationale: Слово בַּת прямо обозначает родство; добавленное местоимение устраняет возможную синтаксическую неясность в русском тексте.
- source_word: מִלִּבְנָה
  choice: из Ливны
  rationale: Предлог מן обозначает происхождение; «из Ливны» точнее сохраняет его пространственное значение и естественно определяет Иеремию.
