base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: ru
  text: До него не было царя, подобного ему, который обратился бы к Яхве всем своим сердцем, всей своей душой и всеми своими силами[a], во всём следуя Закону Моисея; и после него не появилось царя, подобного ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти слова перекликаются с Второзаконием 6:5. Последнее выражение можно также передать: «всей своей мощью» или «всей своей силой».'
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: До него не было царя, подобного ему
  rationale: Передаёт вынесенное вперёд сравнение и временное значение לְפָנָיו естественным современным русским синтаксисом.
- source_word: שָׁב אֶל יְהוָה
  choice: обратился к Яхве
  rationale: Глагол שׁוּב с אֶל выражает обращение или возвращение к Богу в покаянии и верности завету; «обратился» сохраняет этот смысл без излишнего уточнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: всем своим сердцем, всей своей душой и всеми своими силами
  rationale: Сохраняет трёхчастную формулу и отзвук Второзакония 6:5; множественное «силами» естественно по-русски передаёт совокупность способностей и возможностей.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: во всём следуя Закону Моисея
  rationale: Динамически и ясно выражает соответствие всей Торе Моисея; «Закон» уместен в данном контексте оценки царя.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: и после него не появилось подобного ему
  rationale: Контекстуально передаёт קָם как появление последующего сопоставимого царя, не подразумевая буквального вставания.
theological_decisions:
- issue: Отзвук Второзакония 6:5
  choice: Сохранена формула «всем своим сердцем, всей своей душой и всеми своими силами»
  alternative: «всем сердцем, всей жизнью и всем достоянием»
  rationale: Традиционно узнаваемая трёхчастная формула позволяет услышать межтекстовую связь и не сводит נֶפֶשׁ или מְאֹד к одному узкому значению.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет это различие.
- issue: Характер обращения Иосии к Яхве
  choice: «обратился к Яхве»
  alternative: «вернулся к Яхве»
  rationale: «Обратился» естественно выражает направленность к Богу и допускает заложенные в שׁוּב оттенки покаяния, возвращения и верности, не выбирая насильно только один из них.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным, но сохранены абсолютное сравнение Иосии, заветная направленность глагола שׁוּב и формула из Второзакония.
