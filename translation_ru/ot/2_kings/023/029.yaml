base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: ru
  text: В его дни фараон Нехо, царь Египта, выступил против царя Ассирии к реке Евфрат. Царь Иосия вышел ему навстречу[a], и он умертвил его в Мегиддо, когда увидел его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: См. также параллельное повествование о смерти Иосии во 2 Пар. 35:20–24.
    reason: cross_reference
  - marker: b
    text: 'В древнееврейском тексте местоимения в заключительной части стиха формально неоднозначны: «и он умертвил его в Мегиддо, когда увидел его». Эксплицитное отнесение действия к фараону Нехо и Иосии является интерпретацией.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: В его дни
  rationale: Сохраняет обычную древнееврейскую временную формулу, относящуюся ко времени правления Иосии, и естественно звучит в литературном русском.
- source_word: עָלָה ... עַל מֶלֶךְ אַשּׁוּר
  choice: выступил против царя Ассирии
  rationale: В военном контексте עלה с עַל естественно передаёт движение войска против кого-либо; перевод сохраняет прямой смысл масоретского текста, не корректируя его на основании исторической реконструкции.
- source_word: פַרְעֹה נְכֹה
  choice: фараон Нехо
  rationale: «Нехо» — укоренившаяся в современном русском библейском и историческом употреблении передача имени.
- source_word: עַל נְהַר פְּרָת
  choice: к реке Евфрат
  rationale: Здесь сочетание указывает на направление или место назначения похода; русский предлог «к» ясно передаёт эту функцию.
- source_word: לִקְרָאתוֹ
  choice: вышел ему навстречу
  rationale: 'Сохраняет широту выражения: оно может обозначать встречу или противостояние, не уточняя мотив Иосии сверх сказанного в тексте.'
- source_word: וַיְמִיתֵהוּ
  choice: и тот умертвил его
  rationale: Глагол в породе хифиль означает «причинить смерть, умертвить». Указательное «тот» в русском позволяет отнести действие к ближайшему участнику, фараону Нехо, но примечание отмечает формальную местоименную сжатость оригинала.
- source_word: בִּמְגִדּוֹ
  choice: в Мегиддо
  rationale: Для названия города современный русский естественно употребляет предлог «в».
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: когда увидел его
  rationale: Буквально передаёт конструкцию с двумя местоимениями третьего лица; субъект последнего действия в древнееврейском выражен неявно.
theological_decisions:
- issue: Неясность местоименных референтов в заключительной части стиха
  choice: 'Основной текст передаёт наиболее естественную последовательность: фараон Нехо умертвил Иосию, но не называет заново субъекта последней придаточной части.'
  alternative: '«И он умертвил его в Мегиддо, когда он увидел его» — формально ближе, но по-русски чрезмерно неясно; либо полностью эксплицировать: «и фараон Нехо убил Иосию…».'
  rationale: Древнееврейский текст использует грамматически сжатую цепочку местоимений мужского рода единственного числа. Русский требует некоторого прояснения для связности, однако примечание сохраняет прозрачность исходной неоднозначности и не скрывает интерпретационный характер передачи.
- issue: Направленность похода Нехо
  choice: против царя Ассирии
  alternative: «к царю Ассирии» или «на помощь царю Ассирии»
  rationale: Предлог עַל после военного עלה прежде всего допускает значение «против». Исторически мотивированный смысл «на помощь» не выражен непосредственно и потому не внесён в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Синтаксис сделан ясным для обычного читателя; сохранены военный оттенок глагола движения и отмеченная в примечании местоименная неоднозначность древнееврейского текста. Имя передано в традиционной русской форме «Нехо».
