  source_fidelity: 'Смысл в целом передан верно: Иоаким передаёт фараону серебро и золото, производит налоговое обложение земли ради выплаты серебра по приказу фараона и принудительно взимает серебро и золото с населения по индивидуальной оценке. «Подать» допустима, но несколько архаична для заявленного современного литературного регистра. Формулировка «народ земли» чрезмерно буквальна и в современном русском может быть неверно понята; «народ страны» сохраняет территориально-политический референт עַם הָאָרֶץ без необоснованного социального уточнения.'
