base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: ru
  text: Иоаким отдал фараону серебро и золото, но обложил землю налогом[a], чтобы отдать серебро по повелению фараона[b]. Он взыскал с народа страны серебро и золото, с каждого — по установленной для него сумме[c], чтобы отдать фараону Нехо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оценил землю для взимания налога»; еврейский глагол может обозначать установление суммы платежа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по слову фараона», то есть согласно его приказу.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «с каждого по его оценке»; возможный смысл: соразмерно средствам каждого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: обложил землю податью
  rationale: В породе хифиль и при дополнении «земля» глагол обозначает установление денежной оценки или сбора. Русское выражение передаёт фискальный смысл, не сводя действие к нейтральной оценке стоимости.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Сохраняет территориально-политическое значение еврейского слова и его связь с последующим выражением «народ земли».
- source_word: עַל־פִּי פַרְעֹה
  choice: по повелению фараона
  rationale: Еврейская идиома буквально означает «по устам фараона», то есть согласно его слову или приказу; естественный русский эквивалент — «по повелению».
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: с каждого по установленной ему сумме
  rationale: Фраза указывает на индивидуально определённую оценку или ставку. Перевод сохраняет эту мысль, не уточняя без достаточных оснований, зависела ли сумма от имущества или дохода.
- source_word: נָגַשׂ
  choice: взыскал
  rationale: Глагол имеет оттенок принудительного требования платежа; «взыскал» передаёт его точнее, чем нейтральное «собрал».
- source_word: עַם הָאָרֶץ
  choice: народ земли
  rationale: Буквальный перевод сохраняет возможное общественно-политическое значение устойчивого выражения и не сужает его до «простого народа».
- source_word: פַרְעֹה נְכֹה
  choice: фараон Нехо
  rationale: Использована укоренившаяся в русской библейской традиции передача имени, соответствующая еврейскому נְכֹה.
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: серебро и золото
  rationale: Сохраняются прямо названные драгоценные металлы и их параллелизм; хотя серебро могло служить деньгами, текст не употребляет отдельного слова «деньги».
- source_word: נָתַן
  choice: отдал
  rationale: Передаёт основное значение «дать» с естественным для контекста оттенком передачи дани, не заменяя его более толковательным «уплатил».
