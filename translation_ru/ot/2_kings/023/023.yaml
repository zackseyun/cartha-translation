source:
  edition: WLC
  text: כִּ֗י אִם בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹֽאשִׁיָּ֑הוּ נַעֲשָׂ֞ה הַ/פֶּ֧סַח הַ/זֶּ֛ה לַ/יהוָ֖ה בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/023.yaml
  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: ru
  text: Но лишь в восемнадцатый год царствования Иосии эта Пасха была отпразднована[a] в честь Яхве в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «была сделана»; то есть «была совершена» или «была отпразднована».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: но лишь
  rationale: 'Сочетание имеет противительно-ограничительное значение и связывает стих с предшествующим утверждением: подобной Пасхи прежде не праздновали.'
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: в восемнадцатый год царствования Иосии
  rationale: Ламед при обозначении царя указывает на отсчёт года его правления; добавление «царствования» естественно и точно передаёт смысл по-русски.
- source_word: נַעֲשָׂה
  choice: была отпразднована
  rationale: Буквально глагол означает «была сделана/совершена», но при слове «Пасха» обозначает соблюдение и празднование; пассивная конструкция оригинала сохранена.
- source_word: הַפֶּסַח הַזֶּה
  choice: эта Пасха
  rationale: Прямо передаёт определённое существительное с указательным местоимением без пояснительного добавления «праздник».
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Ламед выражает направленность и посвящение празднования Богу; «в честь» звучит естественно по-русски, а имя Яхве передаёт тетраграмматон как личное имя.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места с общепринятой русской формой названия города.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение празднования Пасхи «для Яхве»
  choice: в честь Яхве
  alternative: для Яхве; Яхве
  rationale: Такая формулировка передаёт посвящённость праздника Богу, не уточняя сверх текста характер жертвы или обряда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «Но лишь» сохраняет связь и контраст с предыдущим стихом; порядок слов остаётся естественным для русского языка.
