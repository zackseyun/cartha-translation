  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: ru
  text: И царь осквернил высоты, которые Соломон, царь Израиля, построил для Астарты — мерзости сидонян, для Хамоса — мерзости Моава и для Милкома[c] — мерзости аммонитян; эти высоты находились напротив Иерусалима[a], справа от горы Разрушения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к востоку от Иерусалима». Буквально: «перед Иерусалимом»; точное направление этим выражением не задано однозначно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «гора Разрушения»; возможно также: «гора Развращения». Вероятно, речь идёт о холме, позднее отождествлённом с Елеонской горой. Выражение «справа» при ориентировании на восток может означать «к югу».'
    reason: cross_reference
  - marker: c
    text: 'В еврейском тексте: «Милком»; это имя иногда связывают с Молохом, но основной текст их не отождествляет.'
    reason: alternative_reading
