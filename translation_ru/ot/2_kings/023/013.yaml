  choice: мерзость
  rationale: Сохраняет резкую культово-полемическую оценку обоих еврейских слов и обеспечивает стилистическую последовательность.
- source_word: לִכְמוֹשׁ
  choice: для Хамоса
  rationale: Традиционная русская передача имени моавитского божества.
- source_word: לְמִלְכֹּם
  choice: для Милкома
  rationale: Масоретский текст называет Милкома; имя не отождествляется безоговорочно с Молохом.
- source_word: טִמֵּא
  choice: осквернил
  rationale: Точно передаёт намеренное культовое лишение святости и пригодности для богослужения.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохраняет обозначение субъекта в стихе; из контекста ясно, что речь идёт об Иосии.
