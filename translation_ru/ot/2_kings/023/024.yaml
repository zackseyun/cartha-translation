  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: ru
  text: Кроме того, Иосия устранил медиумов, прорицателей, домашних божков, идолов и все мерзости, которые находились в земле Иуды и в Иерусалиме, чтобы привести в исполнение слова Закона, записанные в книге[a], которую священник Хилкия нашёл в доме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в свитке». Еврейское слово обозначает письменный документ, который в ту эпоху обычно имел форму свитка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Кроме того
  rationale: Передаёт добавочное значение оборота и естественно связывает этот стих с предшествующим перечнем преобразований Иосии.
- source_word: הָאֹבוֹת
  choice: вызывающих мёртвых
  rationale: В данном контексте слово обозначает людей, обращавшихся к умершим или духам умерших. Описательный перевод понятнее современному читателю и не сужает значение до какого-либо конкретного ритуала.
- source_word: הַיִּדְּעֹנִים
  choice: ведунов
  rationale: Парный с אֹבוֹת термин для практиков запретного тайного знания. «Ведуны» сохраняет связь со знанием и звучит естественнее, чем архаическое «волшебники» или узкое «спириты».
- source_word: הַתְּרָפִים
  choice: домашних божков
  rationale: Терафимы были домашними культовыми образами или божествами. Смысловой перевод делает их функцию ясной без малопонятной транслитерации.
- source_word: הַגִּלֻּלִים
  choice: идолов
  rationale: Это презрительное обозначение идолов. Нейтральное существительное «идолы» ясно передаёт предмет значения, тогда как буквальное воспроизведение уничижительного оттенка по-русски было бы неестественным.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: все прочие мерзости
  rationale: Слово охватывает ритуально и нравственно отвратительные предметы и обычаи; «прочие» показывает, что выражение обобщает и расширяет предшествующий перечень.
- source_word: נִרְאוּ
  choice: встречались
  rationale: Естественно передаёт пассивную форму «были видимы / обнаруживались», то есть присутствовали в Иудее и Иерусалиме.
- source_word: בִּעֵר
  choice: удалил
  rationale: Глагол означает устранить, вымести или истребить. Поскольку дополнения включают и людей, и предметы, «удалил» передаёт итог действия, не навязывая единый способ уничтожения.
- source_word: לְמַעַן הָקִים
  choice: чтобы утвердить
  rationale: Сохраняет целевое значение לְמַעַן и образ «поставить, сделать действенными» слова Закона, не вводя возможный оттенок исполнения пророчества.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: слова Закона
  rationale: В контексте найденного священного документа תּוֹרָה обозначает обязательное заветное наставление; «Закон» является ясным и устоявшимся соответствием.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: записанные в свитке[a]
  rationale: סֵפֶר означает письменный документ, в данном историческом контексте, вероятно, свиток. Предлог עַל буквально значит «на», но по-русски о содержании естественно сказать «в свитке».
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет буквальный образ «дома Яхве», хотя по контексту речь идёт о храме.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация передаёт личное имя в исходном тексте и отличает его от титула «Господь», не привнося конфессионального толкования.
- issue: Значение הָאֹבוֹת и הַיִּדְּעֹנִים
  choice: вызывающих мёртвых, ведунов
  alternative: духов умерших и духов-прорицателей
  rationale: Синтаксис допускает связь терминов как с оккультными практиками, так и с относящимися к ним сущностями, но в законодательных параллелях эти слова обычно обозначают практиков. Выбран человеческий референт без уточнения конкретной техники.
- issue: Цель реформы в выражении לְמַעַן הָקִים
  choice: чтобы утвердить слова Закона
  alternative: чтобы исполнить слова Закона
  rationale: «Утвердить» сохраняет смысл введения записанного Закона в силу и избегает возможного ошибочного прочтения как исполнения предсказания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Предложения разделены для ясности; второе сохраняет прямую целевую связь реформ Иосии с найденным Законом. Архаизмы сведены к минимуму, при этом «земля Иуды», «слова Закона» и «дом Яхве» удерживают ключевые образы исходного текста.
