  terminology: «Яхве», «Закон», «домашние божки» и «дом Яхве» приемлемы. «Медиумы и прорицатели» точнее и нейтральнее передают пару אֹבוֹת / יִּדְּעֹנִים, не задавая спорную конкретную технику. «Привести в исполнение слова Закона» передаёт целевое לְמַעַן הָקִים без ложного оттенка пророческого исполнения.
