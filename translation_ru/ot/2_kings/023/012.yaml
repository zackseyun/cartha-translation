- from: А жертвенники на крыше верхней комнаты Ахаза[a], которые воздвигли цари Иудеи, и жертвенники, которые Манассия соорудил в двух дворах дома Яхве, царь разрушил, разбил их там[b] и бросил оставшийся от них прах в долину Кедрон[c].
  to: А жертвенники на крыше верхней комнаты Ахаза[a], которые соорудили цари Иудеи, и жертвенники, которые Манассия соорудил в двух дворах дома Яхве, царь разрушил, разбил их[b] и оттуда бросил их прах в долину Кедрон[c].
  rationale: Исправлено «там» на «оттуда» для передачи מִשָּׁם, устранено невыраженное в оригинале слово «оставшийся», а формулировка сноски о необычной форме сделана более осторожной. Сохранены архитектурная неопределённость עֲלִיָּה, дворы дома Яхве, имя Яхве и лексическая вариативность נַחַל.
