  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: ru
  text: А жертвенники на крыше верхней комнаты Ахаза[a], которые соорудили цари Иудеи, и жертвенники, которые Манассия соорудил в двух дворах дома Яхве, царь разрушил, разбил их[b] и оттуда бросил их прах в долину Кедрон[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горницы Ахаза». Еврейское עֲלִיָּה может обозначать верхнюю комнату или помещение верхнего этажа.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма необычна. В контексте её обычно понимают как указание на раздробление жертвенников; при ином разборе возможно понимание: «убежал оттуда».'
    reason: textual_ambiguity
  - marker: c
    text: 'Или: «в поток Кедрон» либо «в русло Кедрона». Еврейское נַחַל может обозначать поток, его русло, овраг или долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: жертвенники
  rationale: Обычное значение מִזְבֵּחַ — «жертвенник»; множественное число сохранено в обоих случаях.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: на крыше верхней комнаты Ахаза
  rationale: Передаёт архитектурный смысл עֲלִיָּה как помещения верхнего этажа, не уточняя сверх текста его назначение.
- source_word: אֲשֶׁר עָשׂוּ מַלְכֵי יְהוּדָה
  choice: которые воздвигли цари Иудеи
  rationale: Глагол «воздвигли» естественно сочетается с жертвенниками и обозначает их сооружение до действий царя.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: в двух дворах дома Яхве
  rationale: Сохраняется еврейское выражение «дом Яхве», а חָצֵר передано обычным архитектурным словом «двор».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, представленное тетраграмматоном, передано принятой русской транслитерацией, а не заменено титулом.
- source_word: נָתַץ
  choice: разрушил
  rationale: Глагол обозначает разрушение или снос сооружения; «разрушил» естественно применительно к жертвенникам.
- source_word: וַיָּרָץ מִשָּׁם
  choice: разбил их там
  rationale: В контексте последующего упоминания праха фраза понимается как дальнейшее раздробление разрушенных жертвенников; необычная форма и буквальная альтернатива отмечены в сноске.
- source_word: עֲפָרָם
  choice: оставшийся от них прах
  rationale: עָפָר буквально означает пыль или прах; добавление «оставшийся от них» ясно передаёт местоименный суффикс и связь с раздробленными жертвенниками.
- source_word: נַחַל קִדְרוֹן
  choice: долину Кедрон
  rationale: נַחַל может обозначать русло, овраг или долину сезонного потока; «долина Кедрон» понятно современному читателю и подходит географическому контексту.
- source_word: וְאֶת ... וְאֶת
  choice: А жертвенники ... и жертвенники ...
  rationale: Фронтированные прямые дополнения сохранены перед главным сказуемым, при этом русское предложение остаётся читаемым.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» сохраняет его как имя и представляет собой распространённую современную русскую транслитерацию.
- issue: Степень уничтожения культовых сооружений
  choice: разрушил, разбил ... и бросил ... прах
  alternative: разрушил и удалил обломки
  rationale: Последовательность глаголов и слово עָפָר подчёркивают полное уничтожение жертвенников; образ праха сохранён без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет вынесенные вперёд дополнения еврейского текста, но избегает архаизмов. «Дом Яхве» удерживает исходную метафору, а не заменяет её словом «храм».
