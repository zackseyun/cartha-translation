base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: ru
  text: 'Тогда он спросил: «Что это за памятник[a], который я вижу?» Жители города ответили ему: «Это могила человека Божьего, который пришёл из Иудеи и возвестил[b] обо всём том, что ты сделал против жертвенника в Вефиле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знак», «памятный камень» или «надгробный знак».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «провозгласил» или «возгласил»; речь идёт о пророческом объявлении человека Божьего против жертвенника (см. 3 Цар. 13:1–2).'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: памятник
  rationale: Слово обозначает заметный знак или памятный столб; в данном погребальном контексте «памятник» естественно передаёт видимое обозначение могилы, не уточняя без необходимости его форму.
- source_word: הַלָּז
  choice: это
  rationale: Указательное слово относится к видимому объекту; русская конструкция «что это за…» естественно передаёт дейктический смысл.
- source_word: אֲנִי רֹאֶה
  choice: я вижу
  rationale: Настоящее время естественно передаёт еврейскую причастную конструкцию в прямом вопросе.
- source_word: הַקֶּבֶר
  choice: могила
  rationale: В контексте обозначенного места погребения это ясное и обычное русское соответствие.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён традиционный и прозрачный еврейский титул без его сужающего истолкования как «пророк».
- source_word: מִיהוּדָה
  choice: из Иудеи
  rationale: Естественное русское обозначение происхождения или направления прибытия.
- source_word: וַיִּקְרָא
  choice: возвестил
  rationale: Глагол описывает публичное пророческое провозглашение; «возвестил» передаёт эту силу, не добавляя отсутствующих в тексте подробностей.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: обо всём том
  rationale: Формулировка охватывает как произнесённые слова, так и предсказанные события, к которым они относились.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: что ты сделал
  rationale: Прошедшее время прямо связывает пророчество с уже совершёнными Иосией действиями.
- source_word: עַל הַמִּזְבֵּחַ
  choice: с жертвенником
  rationale: В данном контексте предлог имеет направленный против объекта смысл, однако по-русски «сделал с жертвенником» естественно обозначает действия Иосии против него и избегает неясного «сделал над жертвенником».
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Устоявшаяся русская библейская передача географического названия.
theological_decisions:
- issue: Характер речи человека Божьего
  choice: Передать וַיִּקְרָא словом «возвестил», сохраняя пророческий характер публичного объявления.
  alternative: «возгласил», «провозгласил», «предсказал»
  rationale: Контекст отсылает к пророчеству о жертвеннике в 3 Цар 13:1–2. «Возвестил» передаёт пророческое объявление, но не вводит более узкое понятие предсказания прямо в основной текст.
- issue: Связь пророчества с действиями Иосии
  choice: Сохранить формулировку, связывающую возвещённое с тем, что Иосия уже сделал с жертвенником.
  alternative: Явно написать «предсказал то, что ты сделаешь»
  rationale: Так сохраняется напряжение еврейского текста между прежним пророческим словом и его уже состоявшимся исполнением без добавления будущего времени, которого в данном стихе нет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Жители города» естественно передаёт коллективное אַנְשֵׁי הָעִיר; реплики сформулированы ясно и без архаической инверсии. Все сноски поставлены непосредственно после слов, к которым относятся.
