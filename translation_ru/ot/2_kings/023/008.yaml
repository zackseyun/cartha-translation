  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: ru
  text: Он привёл всех священников из городов Иудеи и осквернил высоты, на которых священники воскуряли благовония, — от Гевы до Вирсавии. Он также разрушил высоты у ворот[a], находившиеся у входа в ворота Иисуса, начальника города, слева от человека у городских ворот[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «высоты ворот»; возможно, имеются в виду святилища у ворот.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза не вполне ясна; буквально: «слева от человека у городских ворот». Вероятно, имеется в виду левая сторона при входе в ворота.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Он привёл
  rationale: Порода hифиль глагола בוא означает «привести» или «велеть прийти»; прямое «привёл» естественно передаёт действие Иосии.
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Обычное значение כֹּהֵן; контекст не требует более узкого обозначения.
- source_word: מֵעָרֵי יְהוּדָה
  choice: из городов Иудеи
  rationale: עָרִים обозначает населённые пункты, города; традиционное «города» уместно и понятно.
- source_word: וַיְטַמֵּא
  choice: осквернил
  rationale: Пиэль от טמא означает сделать ритуально нечистым, осквернить; здесь речь о намеренной культовой десакрализации.
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Устоявшийся русский библейский эквивалент для мест местного культа; он сохраняет историко-культовый характер термина.
- source_word: קִטְּרוּ שָׁמָּה
  choice: на которых священники воскуряли благовония
  rationale: קטר в данном контексте означает возжигать благовония или дымные приношения. Несовершенный вид естественно описывает повторявшуюся культовую практику; שָׁמָּה передано конструкцией «на которых».
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: от Гевы до Вирсавии
  rationale: Географическая формула обозначает всю протяжённость Иудеи с севера на юг; использованы традиционные русские формы топонимов.
- source_word: וְנָתַץ
  choice: Он также разрушил
  rationale: נתץ означает разрушить, снести; «также» естественно выражает присоединительную силу союза.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: высоты у ворот
  rationale: Буквально «высоты ворот»; пространственное «у ворот» естественно раскрывает сжатую конструкцию, не уточняя устройство святилищ сверх текста.
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: при входе в ворота Иисуса
  rationale: פֶּתַח означает вход или проём; «при входе в» сохраняет пространственную связь. Имя יְהוֹשֻׁעַ передано традиционной русской библейской формой «Иисус».
- source_word: שַׂר הָעִיר
  choice: начальника города
  rationale: שַׂר здесь обозначает городского сановника или управляющего; «начальник города» не приписывает ему царского достоинства и сохраняет широту титула.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: слева от входящего в городские ворота
  rationale: Еврейская фраза буквально и эллиптически говорит о левой стороне человека у городских ворот. Русская формулировка передаёт наиболее вероятную ориентацию — слева для входящего — с указанием неопределённости в сноске.
