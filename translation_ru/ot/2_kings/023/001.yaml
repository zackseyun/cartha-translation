  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: ru
  text: Тогда царь послал[a], и все старейшины Иудеи и Иерусалима собрались к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте не указано, кого или что царь послал. По контексту возможно: «царь послал за всеми старейшинами Иудеи и Иерусалима».'
    reason: 'Лексическая неоднозначность: у глагола «послал» нет выраженного дополнения; контекст допускает смысл созыва старейшин.'
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал [за ними]
  rationale: Глагол буквально означает «послал», но в данном повествовательном контексте подразумевает вызов старейшин. Слова «за ними» добавлены для естественности русского языка и отмечены сноской как смысловое уточнение.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Сохранён определённый титул исходного текста; из контекста речь идёт об Иосии, однако имя в стихе не названо.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: собрались к нему
  rationale: Еврейская форма активная и множественного числа — буквально «они собрались к нему». Русский перевод сохраняет активную конструкцию и направление, выраженное אֶל.
- source_word: כָּל זִקְנֵי
  choice: все старейшины
  rationale: זִקְנֵי обозначает признанных общественных руководителей, а не просто пожилых мужчин; כָּל подчёркивает полноту собрания.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Иудеи и Иерусалима
  rationale: Переданы общепринятыми русскими формами географических названий; сочетание указывает на старейшин всей страны и столицы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. «Старейшины» сохраняет традиционный общественно-политический термин; активное «собрались» точнее отражает еврейскую форму.
