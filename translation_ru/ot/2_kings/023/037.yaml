base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, во всём поступая так, как поступали его отцы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его предки» или «его праотцы». Буквально по-еврейски: «его отцы».'
    reason: Лексическая альтернатива поясняет, что в данном контексте слово может обозначать не только непосредственных отцов, но и предков или царственных предшественников.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И делал он
  rationale: Союз «и» передаёт последовательное развитие еврейского повествования, а несовершенный вид естественно выражает устойчивый характер поведения царя в итоговой оценке его правления.
- source_word: הָרַע
  choice: зло
  rationale: В формуле עשה הרע сочетание «делать зло» естественно звучит по-русски и сохраняет нравственную оценку исходного текста.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранён образный еврейский оборот, обозначающий оценку с точки зрения Яхве; он понятен и укоренён в русском библейском стиле.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: כְּכֹל אֲשֶׁר
  choice: во всём поступая так, как
  rationale: Формулировка передаёт полное соответствие поведения царя поступкам его предшественников и при этом звучит естественно по-русски.
- source_word: עָשׂוּ
  choice: поступали
  rationale: В контексте речь идёт не об одном действии, а об образе поведения; несовершенный вид естественно передаёт это значение.
- source_word: אֲבֹתָיו
  choice: его отцы
  rationale: Сохранено буквальное и традиционно понятное обозначение предков; более явное значение приведено в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Форма «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повествовательное «и», образ «в глазах» и буквальное «отцы», при этом синтаксис сделан естественным для современного читателя.
