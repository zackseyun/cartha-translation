    issue: Неоднозначный относительный оборот при имени Иеровоама.
    rationale: В сочетании «Иеровоамом, сыном Навата, который ввёл Израиль в грех» придаточное формально может быть прочитано как относящееся к Навату. В еврейском тексте אֲשֶׁר הֶחֱטִיא относится к Иеровоаму.
  - severity: low
    issue: Неполное повторение термина בָּמָה во втором предложении.
    rationale: После «святилище на возвышенности» употреблено просто «святилище». Полное повторение лучше отражает повтор הַבָּמָה и сохраняет прозрачность термина.
