  text: וְ/גַ֨ם אֶת הַ/מִּזְבֵּ֜חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֗ל הַ/בָּמָה֙ אֲשֶׁ֨ר עָשָׂ֜ה יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל גַּ֣ם אֶת הַ/מִּזְבֵּ֧חַ הַ/ה֛וּא וְ/אֶת הַ/בָּמָ֖ה נָתָ֑ץ וַ/יִּשְׂרֹ֧ף אֶת הַ/בָּמָ֛ה הֵדַ֥ק לְ/עָפָ֖ר וְ/שָׂרַ֥ף אֲשֵׁרָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: ru
  text: 'Также жертвенник, который был в Вефиле, — святилище на возвышенности, которое устроил Иеровоам, сын Навата, — тот, кто ввёл Израиль в грех, — он разрушил: и тот жертвенник, и это святилище на возвышенности. Он сжёг святилище на возвышенности, растёр его в прах и сжёг Ашеру[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священный столб Ашеры»; еврейское слово может обозначать культовый предмет, связанный с почитанием Ашеры.'
    reason: Лексическая неоднозначность термина אֲשֵׁרָה.
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычный и точный русский эквивалент для культового сооружения; уточнение «для жертвоприношений» излишне.
- source_word: בְּבֵית אֵל
  choice: в Вефиле
  rationale: Естественное обозначение местонахождения при сохранении традиционной русской формы топонима.
- source_word: הַבָּמָה
  choice: святилище на возвышенности
  rationale: Передаёт культовый характер בָּמָה и его связь с возвышенным местом понятнее для современного русского читателя, чем буквальное «высота».
- source_word: עָשָׂה
  choice: устроенное
  rationale: Глагол имеет общее значение «сделать»; в отношении культового места «устроить» звучит естественно и не сужает смысл до одного лишь строительства.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ввёл Израиль в грех
  rationale: Сохраняет каузативное значение породы hifil и ясно выражает ответственность Иеровоама.
- source_word: נָתָץ
  choice: разрушил
  rationale: Точно и естественно обозначает уничтожение сооружений.
- source_word: הֵדַק לְעָפָר
  choice: растёр его в прах
  rationale: Передаёт доведение разрушенного объекта до состояния пыли; местоимение восполняет подразумеваемое в еврейском объектное дополнение.
- source_word: אֲשֵׁרָה
  choice: Ашеру
  rationale: Транслитерация сохраняет неоднозначность между именем богини и связанным с её почитанием культовым предметом; вероятный предметный смысл поясняется в сноске.
theological_decisions:
- issue: Значение אֲשֵׁרָה
  choice: Ашеру
  alternative: священный столб Ашеры
  rationale: В контексте сожжения, вероятнее всего, имеется в виду деревянный культовый предмет, но само еврейское слово может обозначать как Ашеру, так и связанный с её культом объект. Основной текст не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксическое повторение «и этот жертвенник, и святилище» сохранено как отражение подчёркнутой конструкции оригинала; традиционные имена переданы как Вефиль, Иеровоам и Нават.
