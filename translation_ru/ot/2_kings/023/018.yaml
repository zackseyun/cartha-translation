  text: וַ/יֹּ֨אמֶר֙ הַנִּ֣יחוּ ל֔/וֹ אִ֖ישׁ אַל יָנַ֣ע עַצְמֹתָ֑י/ו וַֽ/יְמַלְּטוּ֙ עַצְמֹתָ֔י/ו אֵ֚ת עַצְמ֣וֹת הַ/נָּבִ֔יא אֲשֶׁר בָּ֖א מִ/שֹּׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: ru
  text: 'Он сказал: «Оставьте его в покое; пусть никто не тревожит его костей». И они сохранили его кости вместе с костями пророка, который пришёл из Самарии.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И они не тронули его костей, как и костей пророка, пришедшего из Самарии».'
    reason: Лексическое значение וַיְמַלְּטוּ допускает передачу как сохранения от вреда; в данном контексте это также можно выразить как оставление костей нетронутыми.
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: Оставьте его в покое
  rationale: Естественно передаёт повеление прекратить любые действия против останков умершего.
- source_word: אִישׁ אַל יָנַע עַצְמֹתָיו
  choice: пусть никто не тревожит его костей
  rationale: אִישׁ в запрете имеет обобщённое значение «никто», а נוע здесь обозначает перемещение или нарушение покоя костей; родительный падеж после отрицания естественен для литературного русского.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: И они сохранили его кости
  rationale: Пиэль מלט означает уберечь или сохранить от уничтожения либо осквернения; этот вариант передаёт результат, не повторяя дословно предшествующее повеление.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: вместе с костями пророка
  rationale: 'Дополнительный прямой объект по смыслу присоединён к первому: были сохранены кости обоих.'
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: который пришёл из Самарии
  rationale: Простое прошедшее время естественно в русском повествовании и точно передаёт завершённое действие; Самария — традиционная форма топонима.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены конкретное слово «кости», повтор исходного текста и сдержанный повествовательный тон. Местоимение «его» сохраняет референциальную неоднозначность контекста, не добавляя имени.
