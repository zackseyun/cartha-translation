source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: ru
  text: 'И сказал Яхве: «И Иуду Я удалю от лица Моего, как удалил Израиль; и отвергну[a] этот город, который Я избрал, — Иерусалим, — и дом[b], о котором Я сказал: „Там будет имя Моё“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и отверг этот город, который Я избрал, — Иерусалим». Еврейскую форму глагола можно понимать как обозначающую уже совершившееся действие, хотя здесь она переведена будущим временем в соответствии с объявлением суда.'
    reason: alternative_reading
  - marker: b
    text: 'То есть храм. Буквально: «дом»; имеется в виду храм в Иерусалиме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его заветный смысл и отличие от титула «Господь».
- source_word: אָסִיר / הֲסִרֹתִי (סור, Hiphil)
  choice: удалю / удалил
  rationale: Сохраняет причинительное значение породы Hiphil и явный параллелизм между будущей участью Иуды и прежней участью Израиля.
- source_word: מֵעַל פָּנַי
  choice: от лица Моего
  rationale: Близко передаёт еврейский образ и его смысл — удаление от Божьего присутствия, не сводя выражение только к географическому изгнанию.
- source_word: גַּם
  choice: и
  rationale: 'В сочетании «И Иуду» естественно выражает присоединительное значение: Иуда постигнет та же участь, что и Израиль.'
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Прямо обозначает сопоставление суда над Иудой с уже совершившимся судом над Израилем.
- source_word: וּמָאַסְתִּי
  choice: и отвергну
  rationale: В контексте объявления грядущего суда форма понимается как продолжающая будущее высказывание «удалю»; «отвергну» передаёт מאס как решительный отказ, не усиливая его до эмоционального «возненавижу».
- source_word: הָעִיר הַזֹּאת אֲשֶׁר בָּחַרְתִּי אֶת יְרוּשָׁלִַם
  choice: этот город, который Я избрал, — Иерусалим
  rationale: Сохраняет указательное выражение, предшествующее избрание города и пояснительное наименование Иерусалима.
- source_word: הַבַּיִת
  choice: дом
  rationale: Буквально передаёт еврейское слово и сохраняет библейскую образность; в данном контексте речь идёт об Иерусалимском храме, что пояснено в сноске.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: Там будет имя Моё
  rationale: Сохраняет порядок смысловых акцентов и богословски значимую формулу пребывания Божьего имени в избранном святилище.
theological_decisions:
- issue: Временное значение וּמָאַסְתִּי в пророческом объявлении суда
  choice: 'Будущее: «и отвергну»'
  alternative: 'Прошедшее/результативное: «и отверг» или «и уже отверг»'
  rationale: Хотя морфологически это qatal, ближайшая речь начинается будущим «удалю» и объявляет грядущий суд над Иудой. Будущее время сохраняет ход высказывания, а возможность прочитать действие как уже совершившееся отмечена в сноске.
- issue: Передача הַבַּיִת
  choice: Сохранить в основном тексте «дом»
  alternative: «храм»
  rationale: «Дом» непосредственно соответствует исходному слову и сохраняет его межтекстовые и богословские связи. Референт — храм — дан как ясная лексическая альтернатива, без подмены образа в основном тексте.
- issue: Формула Божьего имени יִהְיֶה שְׁמִי שָׁם
  choice: «Там будет имя Моё»
  alternative: Интерпретирующее «там буду пребывать Я»
  rationale: Исходный текст говорит именно об имени Бога. Буквальная формула сохраняет присущую ей богословскую напряжённость и не отождествляет её без пояснения с какой-либо одной концепцией присутствия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «И Иуду Я удалю» подчёркивает присоединительное «также», а форма «от лица Моего» сохраняет исходный образ. Пунктуация разделяет длинный ряд дополнений и ясно оформляет приложение «Иерусалим».
