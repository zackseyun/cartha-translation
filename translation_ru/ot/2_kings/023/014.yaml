  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: ru
  text: Он разбил столбы, срубил ашеры[a] и заполнил места, где они стояли, человеческими костями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столбы Ашеры». Еврейское слово может обозначать культовые предметы, связанные с богиней Ашерой; само по себе оно не уточняет их форму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: разбил
  rationale: Глагол означает разрушение посредством разбивания; «разбил» естественно и точно передаёт совершённое действие.
- source_word: הַמַּצֵּבוֹת
  choice: столбы
  rationale: מַצֵּבָה обозначает поставленный культовый камень или столб. Краткое «столбы» сохраняет предметный смысл, не добавляя отсутствующего в тексте пояснения.
- source_word: וַיִּכְרֹת
  choice: срубил
  rationale: כרת в отношении деревянных культовых объектов естественно передаётся глаголом «срубил».
- source_word: הָאֲשֵׁרִים
  choice: ашеры
  rationale: 'Транслитерированное название сохраняет неоднозначность еврейского термина: речь идёт о культовых объектах, связанных с Ашерой, но их точная форма самим словом не определяется.'
- source_word: וַיְמַלֵּא
  choice: заполнил
  rationale: Передаёт основное значение глагола «наполнять» и сохраняет образ осквернения этих мест костями.
- source_word: מְקוֹמָם
  choice: места, где они стояли
  rationale: Естественная русская передача буквального «их места»; местоименная отсылка к уничтоженным культовым объектам раскрыта без изменения смысла.
- source_word: עַצְמוֹת אָדָם
  choice: человеческими костями
  rationale: אָדָם употреблено в родовом значении «человек», а не специально о мужчине; творительный падеж требуется русским управлением глагола «заполнил».
theological_decisions:
- issue: Передача אָדָם
  choice: человеческими в выражении «человеческими костями»
  alternative: костями человека
  rationale: В данном контексте существительное обозначает человека вообще, без указания на пол; выбранный вариант точен и естественен по-русски.
- issue: Точная форма הָאֲשֵׁרִים
  choice: ашеры с поясняющей сноской
  alternative: столбы Ашеры / священные шесты
  rationale: Исходный термин обозначает культовые объекты, связанные с Ашерой, но сам по себе не устанавливает их точную форму; перевод не должен устранять эту неопределённость.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и энергичная, как в еврейском повествовании. Редкий культовый термин сохранён в транслитерации и разъяснён в сноске.
