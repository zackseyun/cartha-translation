  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: ru
  text: 'Тогда царь повелел всему народу: «Отпразднуйте Пасху[a] в честь Яхве, вашего Бога, как написано в этой книге завета».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «совершите (или сделайте) Пасху»; то есть соблюдите пасхальный праздник со всеми предписанными обрядами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Глагол צוה обозначает властное распоряжение; «повелел» точно передаёт его смысл и соответствует достойному повествовательному стилю.
- source_word: כָּל הָעָם
  choice: всему народу
  rationale: עם здесь означает народ как совокупность людей; дательный падеж естественно обусловлен русским управлением глагола «повелел».
- source_word: עֲשׂוּ פֶסַח
  choice: отпразднуйте Пасху
  rationale: Буквально выражение означает «сделайте/совершите Пасху», но является идиомой, предписывающей соблюдение пасхального праздника; «отпразднуйте Пасху» ясно и естественно передаёт этот смысл.
- source_word: לַיהוָה
  choice: в честь Яхве
  rationale: Предлог ל выражает направленность или посвящение; оборот «в честь Яхве» естественно передаёт, кому посвящено празднование, не сводя значение к простому адресату.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Сохранено обращение во втором лице множественного числа, подчёркивающее заветные отношения народа с Богом.
- source_word: כַּכָּתוּב
  choice: как написано
  rationale: Краткая русская формула точно соответствует еврейскому обороту, указывающему на согласие с письменным предписанием.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: в этой книге завета
  rationale: При глаголе «написано» еврейский предлог עַל естественно передаётся русским «в»; сохранены определённость документа и указательное местоимение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблено четырёхбуквенное личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Характер предписанного действия עֲשׂוּ פֶסַח
  choice: отпразднуйте Пасху
  alternative: совершите Пасху
  rationale: Контекст допускает как празднование, так и совершение предписанных пасхальных обрядов. Основной текст использует понятное современному читателю выражение, а примечание сохраняет более буквальную культовую формулировку.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным стилем. Синтаксис сделан естественным для обычного читателя; заветная и культовая терминология сохранена без конфессиональных уточнений.
