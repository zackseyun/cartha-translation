base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: ru
  text: 'И фараон Нехо заключил его под стражу[a] в Ривле, в земле Хамата, чтобы тот не царствовал в Иерусалиме[b], и наложил на страну дань[c] — сто талантов серебра и талант золота.


    [a] Или: «связал его»; возможно также: «держал его под стражей».


    [b] Еврейское выражение можно перевести также: «когда он царствовал в Иерусалиме».


    [c] Или: «взыскание» либо «штраф».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связал его»; возможно также: «держал его под стражей».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение можно перевести также: «когда он царствовал в Иерусалиме».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «взыскание» либо «штраф».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: заключил его под стражу
  rationale: Глагол אסר означает «связывать, заключать, удерживать». В данном политическом контексте выражение «заключил под стражу» естественно передаёт фактический смысл, а буквальная возможность отмечена в сноске.
- source_word: פַרְעֹה נְכֹה
  choice: фараон Нехо
  rationale: Сохранены титул и принятая в современном русском библейском употреблении передача имени.
- source_word: בְרִבְלָה
  choice: в Ривле
  rationale: Название места передано транслитерацией и поставлено в русском предложном падеже.
- source_word: בְּאֶרֶץ חֲמָת
  choice: в земле Хамат
  rationale: אֶרֶץ обозначает здесь область или территорию; формулировка сохраняет географическую структуру оригинала.
- source_word: במלך בִּירוּשָׁלָם
  choice: чтобы тот не царствовал в Иерусалиме
  rationale: Контекст требует значения воспрепятствования царствованию Иоахаза; конструктивно близкая передача через «отстранив от царствования» сохранена в сноске.
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: наложил ... дань
  rationale: עֹנֶשׁ может означать взыскание, штраф или принудительно назначенную выплату. В международно-политическом контексте «дань» ясно передаёт характер платежа, а более буквальные варианты приведены в сноске.
- source_word: עַל הָאָרֶץ
  choice: на страну
  rationale: Здесь הָאָרֶץ означает Иудею как страну, обложенную принудительным платежом; «страна» естественнее по-русски, чем буквальное «земля».
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: сто талантов серебра
  rationale: Древняя мера веса כִּכָּר традиционно и прозрачно передана словом «талант» без приблизительного пересчёта в современные единицы.
- source_word: וְכִכַּר זָהָב
  choice: и талант золота
  rationale: Сохранены единственное число и та же древняя мера веса, что и в первой сумме.
