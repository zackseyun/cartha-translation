base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: ru
  text: Он разрушил помещения храмовых блудников[a], находившиеся в доме Яхве, где женщины ткали покрывала для Ашеры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужчин, занимавшихся культовой проституцией». Древнееврейское слово стоит в мужском роде множественного числа и обозначает людей, связанных с недозволенной культовой сексуальной практикой.'
    reason: lexical_alternative
  - marker: b
    text: «Ашера» может означать как богиню Ашеру, так и связанный с ней культовый предмет. Слово, переведённое как «покрывала», буквально означает «дома»; вероятно, имеются в виду тканые завесы, покрытия или подобия святилищ.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: Он разрушил
  rationale: Глагол נתץ обозначает разрушение или снос сооружений; «разрушил» естественно передаёт завершённое действие в повествовании.
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: помещения храмовых блудников
  rationale: בָּתֵּי буквально значит «дома», но внутри храмового комплекса речь, вероятнее всего, о помещениях или покоях. Мужское множественное הַקְּדֵשִׁים обозначает мужчин, связанных с недозволенной культовой сексуальной практикой.
- source_word: בְּבֵית יְהוָה
  choice: при доме Яхве
  rationale: «Дом Яхве» прозрачно воспроизводит древнееврейское выражение, а предлог «при» естественно указывает на помещения в составе храмового комплекса, не утверждая точнее, чем позволяет контекст, что они находились в самом святилище.
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: где женщины ткали
  rationale: Причастие передаёт продолжающееся или обычное занятие. Значение שָׁם естественно включено в относительное наречие «где», что позволяет избежать тяжеловесного «там».
- source_word: בָּתִּים
  choice: покрывала
  rationale: Буквально слово означает «дома», однако в связи с глаголом «ткать» оно, вероятно, обозначает тканые культовые покрытия, завесы либо шатрообразные изделия. «Покрывала» передаёт вероятный смысл, а буквальная неоднозначность отмечена в сноске.
- source_word: לָאֲשֵׁרָה
  choice: для Ашеры
  rationale: אֲשֵׁרָה может обозначать богиню Ашеру либо связанный с ней культовый предмет. Транслитерация не сводит значение к одному из этих вариантов.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» непосредственно передаёт личное имя в исходном тексте и не заменяет его титулом.
- issue: Значение אֲשֵׁרָה
  choice: Ашера
  alternative: культовый столб Ашеры; священный столб
  rationale: Исходное слово допускает отнесение как к богине, так и к культовому предмету; основной текст сохраняет эту неоднозначность, а сноска поясняет её.
- issue: Характер הַקְּדֵשִׁים
  choice: храмовые блудники
  alternative: посвящённые; мужчины, занимавшиеся культовой проституцией
  rationale: Контекст реформ Иосии требует негативного культового смысла. Мужской род формы сохранён, однако вопрос о точной функции этих людей не следует определять сверх имеющихся данных.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. «Храмовые блудники» понятно обычному читателю и сохраняет мужской род исходного слова; «помещения» и «покрывала» служат естественной контекстуальной передачей без устранения отмеченной в сносках лексической неопределённости.
