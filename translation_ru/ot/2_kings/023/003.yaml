  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: ru
  text: 'Царь встал у столба и заключил завет перед Яхве: следовать за Яхве, соблюдать Его заповеди, свидетельства и постановления всем сердцем и всей душой и исполнить слова этого завета, записанные в этой книге[a]. И весь народ присоединился к завету[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «записанные в этом свитке (документе)». Еврейское слово может обозначать книгу, свиток или письменный документ.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «встал в завете». Выражение означает, что народ принял завет и связанные с ним обязательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל הָעַמּוּד
  choice: Царь встал у столба
  rationale: Предлог עַל допускает пространственное значение «у, при»; в царском церемониальном контексте речь, вероятнее всего, о месте возле столба, а не на его вершине.
- source_word: וַיִּכְרֹת אֶת הַבְּרִית
  choice: заключил завет
  rationale: כרת ברית — устойчивое древнееврейское выражение, буквально «рассекать завет»; современный естественный русский эквивалент — «заключить завет».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי означает «перед, в присутствии»; краткая формулировка сохраняет торжественный характер сцены.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: следовать за Яхве
  rationale: Передаёт образ движения вслед за кем-либо, но звучит естественнее современного буквального «ходить за Яхве».
- source_word: מִצְוֺתָיו וְאֶת עֵדְוֺתָיו וְאֶת חֻקֹּתָיו
  choice: Его заповеди, свидетельства и постановления
  rationale: 'Сохранены три отдельные категории заветного закона: מִצְוֹת — заповеди, עֵדוֹת — свидетельства, חֻקּוֹת — установленные постановления.'
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: всем сердцем и всей душой
  rationale: Естественная русская форма традиционной заветной формулы, сохраняющая различие между לֵב и נֶפֶשׁ.
- source_word: לְהָקִים אֶת דִּבְרֵי הַבְּרִית
  choice: исполнить слова этого завета
  rationale: В данном контексте הֵקִים указывает на практическое осуществление записанного; «исполнить» ясно передаёт этот смысл и сохраняет буквальное «слова» для דִּבְרֵי.
- source_word: הַסֵּפֶר
  choice: книга
  rationale: סֵפֶר может обозначать книгу, свиток или письменный документ; «книга» естественно в основном тексте, а материальная неопределённость отмечена в сноске.
- source_word: וַיַּעֲמֹד כָּל הָעָם בַּבְּרִית
  choice: И весь народ присоединился к завету
  rationale: Буквально народ «встал в завете»; русская формулировка передаёт публичное принятие народом заветных обязательств, не создавая впечатления физического положения внутри чего-либо.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Формула участия народа в завете וַיַּעֲמֹד כָּל הָעָם בַּבְּרִית
  choice: весь народ присоединился к завету
  alternative: весь народ встал в завете; весь народ твёрдо стал за завет
  rationale: Динамическая передача выражает коллективное принятие завета. Буквальный образ сохранён в сноске, поскольку он может также подразумевать твёрдую приверженность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным регистром. Сохранена заветно-правовая терминология и трёхчастный ряд «заповеди, свидетельства и постановления»; неестественные для русского языка древнееврейские идиомы переданы функционально, а существенные буквальные образы отмечены в сносках.
