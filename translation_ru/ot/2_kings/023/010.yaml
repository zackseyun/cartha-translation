  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: ru
  text: И он осквернил Тофет, находившийся в долине сыновей Хиннома[a], чтобы никто не проводил своего сына или дочь через огонь[b] Молоху[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в долине Бен-Хинном»; буквально: «в долине сыновей Хиннома».'
    reason: Альтернативная передача топонима.
  - marker: b
    text: «Проводить сына или дочь через огонь» — культовое выражение, обозначающее посвящение детей в обряде, связанном с Молохом; вероятно, речь идёт о детском жертвоприношении.
    reason: Пояснение древнего культового выражения без превращения вероятного толкования в прямую формулировку основного текста.
  - marker: c
    text: 'Или: «для Молоха»; менее вероятное прочтение: «царю».'
    reason: Сохранение возможных вариантов понимания предлога и еврейского консонантного текста.
lexical_decisions:
- source_word: וְטִמֵּא
  choice: И он осквернил
  rationale: Порода пиэль глагола טמא означает «сделать нечистым, осквернить». В контексте Иосия сделал культовое место непригодным для дальнейшего использования; «осквернил» точно передаёт действие, не добавляя более узкого толкования.
- source_word: הַתֹּפֶת
  choice: Тофет
  rationale: Название места передано принятой русской транслитерацией; определённый артикль перед именем собственным отдельно не воспроизводится.
- source_word: בְּגֵי בני הִנֹּם
  choice: в долине сыновей Хиннома
  rationale: 'Передаёт компоненты еврейского топонима: גֵי — «долина», בני — «сыновья», הִנֹּם — «Хинном». Альтернативная топонимическая форма указана в сноске.'
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: чтобы никто не проводил
  rationale: לְבִלְתִּי выражает цель предотвращения, а каузативная форма עבר — побуждение или принуждение пройти. Русская конструкция естественно передаёт цель, а не отсутствие физической возможности.
- source_word: אִישׁ
  choice: никто
  rationale: Хотя буквально это существительное мужского рода «мужчина, человек», здесь оно имеет обобщающее значение. После отрицательной целевой конструкции «никто» естественно и точно передаёт охват запрета.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: своего сына или дочь
  rationale: В отрицательном контексте русский союз «или» естественно передаёт запрет совершать обряд с любым из детей, тогда как буквальное «и» могло бы ошибочно подразумевать только совместное действие.
- source_word: בָּאֵשׁ
  choice: через огонь
  rationale: Сочетание с каузативом עבר образует культовую формулу «проводить через огонь». Основной текст сохраняет образность и неполную эксплицитность еврейского выражения.
- source_word: לַמֹּלֶךְ
  choice: Молоху
  rationale: Предлог ל перед именем божества естественно передаётся русским дательным падежом. Контекст поддерживает традиционное понимание מֹלֶךְ как имени Молоха; менее вероятный вариант отражён в сноске.
theological_decisions:
- issue: Передача обряда, связанного с детьми и огнём
  choice: Сохранить формулу «проводил своего сына или дочь через огонь»
  alternative: «приносил своего сына или дочь в огненную жертву»
  rationale: Контекст указывает на культовый обряд, вероятно детское жертвоприношение, однако еврейский текст выражается устойчивой, но не полностью явной формулой. Основной текст сохраняет эту смысловую напряжённость, а сноска поясняет вероятный смысл.
- issue: Обобщающее אִישׁ
  choice: «никто»
  alternative: «ни один мужчина»
  rationale: В данном запрете форма единственного числа мужского рода употреблена обобщённо. «Никто» передаёт функцию выражения без необоснованного ограничения запрета мужчинами.
- issue: Понимание לַמֹּלֶךְ
  choice: «Молоху»
  alternative: «царю»
  rationale: Культовый контекст и традиционная огласовка поддерживают понимание слова как имени божества, но консонантный текст допускает менее вероятное прочтение «царю»; оно не устранено, а отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис сделан ясным для обычного читателя; культовая формула сохранена близко к еврейскому тексту и пояснена в сноске.
