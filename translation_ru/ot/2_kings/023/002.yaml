  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: ru
  text: Затем царь поднялся в дом Яхве[a], а с ним — все мужчины Иудеи[b], все жители Иерусалима, священники и пророки, весь народ — от малого до великого[c]. Он прочитал перед ними все слова книги завета, найденной в доме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храм Яхве». Буквально: «в дом Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всякий мужчина Иудеи»; это выражение могло представительно обозначать жителей Иудеи.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Или: «от наименьшего до наибольшего».'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Сохраняет направительное значение глагола עלה — движение вверх, к храму, — и естественно звучит по-русски.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Передаёт буквальное значение «дом Яхве»; более контекстуальное «храм Яхве» вынесено в сноску.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: כָל אִישׁ יְהוּדָה
  choice: все мужчины Иудеи
  rationale: Сохраняет мужскую форму אִישׁ и её собирательно-представительный характер, не подменяя её нейтральным словом «народ».
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: все жители Иерусалима
  rationale: Естественно передаёт причастное выражение «все живущие в Иерусалиме».
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Стандартное соответствие в культовом контексте.
- source_word: הַנְּבִיאִים
  choice: пророки
  rationale: Стандартное соответствие еврейскому נְבִיאִים.
- source_word: כָל הָעָם
  choice: весь народ
  rationale: Естественная передача собирательного выражения; приложение обобщает перечисленных участников собрания.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: от малого до великого
  rationale: Сохраняет образность и широту еврейской идиомы, охватывающей все общественные слои, без сужения до возраста.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: прочитал перед ними
  rationale: По контексту речь идёт о публичном чтении письменного текста; выражение передаёт слуховое восприятие без буквального русизма «в их уши».
- source_word: סֵפֶר הַבְּרִית
  choice: книга завета
  rationale: Прямо и традиционно передаёт сочетание «книга договора/завета», сохраняя его богословскую ёмкость.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вносит конфессиональной замены.
- issue: Собирательное выражение כָל אִישׁ יְהוּדָה
  choice: все мужчины Иудеи
  alternative: весь народ Иудеи; все иудеи
  rationale: Мужская лексическая форма сохранена, при этом сноска отмечает возможность её представительного употребления, не решая молча вопрос о составе обозначенной группы.
- issue: Значение סֵפֶר הַבְּרִית
  choice: книга завета
  alternative: книга договора
  rationale: «Завет» сохраняет устойчивое библейское значение בְּרִית и связь документа с отношениями Бога и народа, не уточняя сверх текста содержание найденной книги.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Синтаксис первого предложения слегка упорядочен для ясного публичного перечисления; повтор «дом Яхве» сохранён. Строчная форма «книга завета» не превращает описательное наименование в позднейшее официальное название.
