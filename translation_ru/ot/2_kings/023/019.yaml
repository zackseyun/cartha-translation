  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: ru
  text: Иосия также устранил все святилища на высотах в городах Самарии — те, что цари Израиля устроили, чтобы вызвать гнев[a]. И с ними он поступил во всём так, как поступил в Вефиле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, как ясно из более широкого контекста, «чтобы вызвать гнев Господа».
    reason: Пояснение подразумеваемого, но не названного в еврейском тексте объекта гнева.
lexical_decisions:
- source_word: וְגַם
  choice: также
  rationale: Передаёт присоединение этого действия к описанным ранее реформам Иосии и естественно звучит по-русски.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: святилища на высотах
  rationale: Буквально выражение означает «дома высот», но в данном контексте речь идёт о культовых сооружениях. «Святилища на высотах» ясно передаёт смысл, не уточняя их устройство сверх сказанного в тексте.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: в городах Самарии
  rationale: Самария здесь понимается как область бывшего Северного царства; конструкция прямо и естественно передаёт еврейское сочетание.
- source_word: לְהַכְעִיס
  choice: чтобы вызвать гнев
  rationale: Сохраняет целевое значение инфинитива и оставляет объект гнева невыраженным, как в еврейском тексте.
- source_word: הֵסִיר
  choice: устранил
  rationale: Передаёт каузативное значение глагола סור — убрать, удалить, упразднить — без добавления более конкретного способа уничтожения.
- source_word: וַיַּעַשׂ לָהֶם כְּכָל הַמַּעֲשִׂים
  choice: Он поступил с ними так же
  rationale: Естественная русская передача еврейского оборота «сделал им согласно всем действиям», сохраняющая сопоставление с поступками Иосии в Вефиле.
- source_word: בְּבֵית אֵל
  choice: в Вефиле
  rationale: Обычная русская форма названия и естественное предложное управление для действия, совершённого в этом месте.
theological_decisions:
- issue: Не названный прямо объект гнева в לְהַכְעִיס
  choice: 'В основном тексте оставить объект невыраженным: «чтобы вызвать гнев».'
  alternative: «чтобы вызвать гнев Господа»
  rationale: Из контекста ясно, что имеется в виду гнев Господа, однако в самом еврейском предложении объект не назван. Сноска поясняет подразумеваемое, не вводя его непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, а местоимение «Он» во втором предложении сохраняет Иосию как очевидный субъект.
