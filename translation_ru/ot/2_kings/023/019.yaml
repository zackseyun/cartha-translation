revisions:
- from: Иосия также устранил все святилища на высотах, находившиеся в городах Самарии, которые цари Израиля устроили, чтобы вызвать гнев[a]. Он поступил с ними так же, как поступил в Вефиле.
  to: Иосия также устранил все святилища на высотах в городах Самарии — те, что цари Израиля устроили, чтобы вызвать гнев[a]. И с ними он поступил во всём так, как поступил в Вефиле.
  rationale: Уточнена синтаксическая связь придаточного, чтобы «те, что» безусловно относилось к святилищам, а не к городам. В заключительной части добавлено «во всём», передающее כְּכָל («согласно всем»), без конкретизации того, какие именно действия подразумеваются. Сноска и намеренно невыраженный в основном тексте объект гнева сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:50:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт содержание стиха: Иосия устраняет культовые сооружения в городах Самарии, устроенные царями Израиля с целью вызвать гнев, и обращается с ними по образцу своих действий в Вефиле. Однако «так же, как поступил в Вефиле» не передаёт усилительное כְּכָל («согласно всем действиям / во всём так, как»). Кроме того, относительное «которые» после «городах Самарии» формально может быть отнесено к городам, а не к святилищам.'
  naturalness: «Святилища на высотах» и «вызвать гнев» естественны для современного литературного русского в библейском регистре. Перестройка первой части предложения снимает нежелательную синтаксическую двусмысленность, а оборот «во всём так, как» естественно передаёт заключительное сопоставление.
  terminology: «Иосия», «Самария» и «Вефиль» переданы нормативно. «Святилища на высотах» является допустимой смысловой передачей еврейского «дома высот» и не навязывает конкретный тип сооружения. Объект гнева в основном тексте обоснованно не добавляется; сноска корректно указывает контекстуально подразумеваемого Господа.
  issues:
  - severity: medium
    issue: Не вполне передано כְּכָל הַמַּעֲשִׂים.
    rationale: Фраза «так же, как поступил в Вефиле» передаёт общее сравнение, но опускает значение «согласно всем действиям / во всём так, как». Безопасно добавить «во всём».
  - severity: low
    issue: Возможная синтаксическая неоднозначность относительного придаточного.
    rationale: В конструкции «в городах Самарии, которые цари Израиля устроили» местоимение «которые» по формальной близости может быть понято как относящееся к «городам». Следует вынести определение к «святилищам».
  revised_text: Иосия также устранил все святилища на высотах в городах Самарии — те, что цари Израиля устроили, чтобы вызвать гнев[a]. И с ними он поступил во всём так, как поступил в Вефиле.
  revised_footnotes:
