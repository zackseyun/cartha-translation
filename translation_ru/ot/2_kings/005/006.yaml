  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: ru
  text: 'Он принёс письмо царю Израиля. В письме говорилось: «Итак, когда это письмо придёт к тебе, знай: я послал к тебе моего слугу Неемана, чтобы ты избавил его от кожной болезни[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исцелил его от проказы». Еврейский текст буквально использует необычное выражение «собрал (или принял) его от его кожной болезни».'
    reason: Сохранены традиционное название болезни и необычный образ еврейского глагола אסף.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Он принёс
  rationale: Порода гифиль от בוא с прямым дополнением «письмо» означает, что Нееман принёс его; русский перевод сохраняет причинно-переходное значение и естественное повествование.
- source_word: הַסֵּפֶר
  choice: письмо
  rationale: В контексте послания одного царя другому слово סֵפֶר обозначает письменное сообщение, поэтому современное «письмо» точнее и естественнее, чем «свиток» или «документ».
- source_word: לֵאמֹר
  choice: В письме говорилось
  rationale: Формула вводит содержание письма. Такой оборот по-русски яснее, чем буквальное «говоря», которое могло бы ошибочно представить Неемана произносящим эти слова.
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к сути официального послания без неестественного для современного русского удвоения «И теперь, когда…».
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: когда это письмо придёт к тебе
  rationale: כ с инфинитивом выражает время; формулировка близка к еврейскому тексту и естественна по-русски.
- source_word: הִנֵּה
  choice: знай
  rationale: В письме частица привлекает особое внимание адресата. «Знай» сохраняет эту функцию в современном литературном русском, тогда как «вот» здесь звучало бы менее естественно.
- source_word: שָׁלַחְתִּי
  choice: я послал
  rationale: Русское прошедшее время естественно передаёт завершённую отправку, результатом которой становится прибытие Неемана с письмом.
- source_word: נַעֲמָן
  choice: Неемана
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: עַבְדִּי
  choice: моего слугу
  rationale: עֶבֶד в царской переписке может обозначать подчинённого или придворного служителя; «слуга» сохраняет широту значения, не уточняя его статус без основания.
- source_word: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: чтобы ты избавил его от кожной болезни
  rationale: Употребление אסף («собирать, принимать») с מן и названием болезни необычно и здесь идиоматически указывает на устранение недуга. «Избавил» естественно передаёт смысл, а буквальный образ и возможный перевод «исцелил» отмечены в сноске.
- source_word: צָרַעַת
  choice: кожная болезнь
  rationale: Библейское צָרַעַת шире современной болезни Хансена; выражение избегает ложной медицинской точности, а традиционное «проказа» сохранено в сноске.
theological_decisions:
- issue: Передача צָרַעַת
  choice: кожная болезнь
  alternative: проказа
  rationale: Еврейский термин охватывает более широкий круг кожных поражений, чем современная проказа. Основной текст не отождествляет их без достаточного основания, но традиционный вариант указан в сноске.
- issue: Необычное выражение אסף מן применительно к болезни
  choice: избавил его от
  alternative: исцелил его от; буквально «собрал/принял его от»
  rationale: 'Контекст требует устранения болезни, однако необычность исходного выражения не скрывается: она отмечена в сноске без превращения буквальной, неясной по-русски кальки в основной текст.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном царской переписки. Синтаксис проясняет, что цитируется письмо, а не устная речь Неемана. Архаизмы и медицински неточное отождествление צָרַעַת с современной проказой исключены из основного текста.
