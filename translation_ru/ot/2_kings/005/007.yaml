  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: ru
  text: 'Когда царь Израиля прочитал письмо, он разорвал на себе одежды и сказал: «Разве я Бог, чтобы умерщвлять и оживлять, что он посылает ко мне человека, чтобы я исцелил его от проказы[a]? Только обратите внимание и посмотрите, как он ищет повода для ссоры со мной[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское слово может обозначать различные тяжёлые кожные заболевания, а не только проказу в современном медицинском смысле (болезнь Хансена).
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ищет предлога выступить против меня».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: письмо
  rationale: В данном повествовательном контексте סֵפֶר обозначает письменное послание царя Арама, поэтому «письмо» точнее и естественнее общего «документ» или буквального «свиток».
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: разорвал на себе одежды
  rationale: Сохранён древний жест крайнего потрясения и скорби; добавление «на себе» естественно передаёт русский фразеологический оборот, не меняя смысла.
- source_word: הַאֱלֹהִים אָנִי
  choice: Разве я Бог
  rationale: Риторический вопрос противопоставляет царя Богу, Которому принадлежит власть над жизнью и смертью. В контексте Израиля определённое и личное «Бог» предпочтительнее неопределённого «бог».
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: умерщвлять и оживлять
  rationale: Пара глаголов передана симметрично и торжественно, с сохранением формулировки о божественной власти над смертью и жизнью.
- source_word: כִּי זֶה שֹׁלֵחַ אֵלַי
  choice: Почему этот царь посылает ко мне человека
  rationale: Вопросительное «почему» естественно продолжает русский риторический вопрос, а подразумеваемый деятель уточнён как царь из непосредственного контекста письма; человек назван объектом отправки согласно следующему выражению.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: чтобы я исцелил его от проказы
  rationale: Конструкция אָסַף с מִן здесь идиоматически означает избавить человека от болезни. «Исцелил» ясно передаёт требуемое действие, тогда как буквальное «собрал» по-русски непонятно.
- source_word: צָּרַעַת
  choice: проказа
  rationale: Сохранён традиционный и узнаваемый термин повествования о Неемане; более широкий диапазон значения древнееврейского слова указан в сноске.
- source_word: אַךְ דְּעוּ נָא וּרְאוּ
  choice: Обратите же внимание и посмотрите
  rationale: Фраза передаёт побуждение внимательно распознать скрытый замысел; частица «же» отражает усиление אַךְ и вежливо-настойчивую частицу נָא без неестественного буквального «знайте, пожалуйста».
- source_word: מִתְאַנֶּה הוּא לִי
  choice: он ищет повода для ссоры со мной
  rationale: Формулировка естественно передаёт намеренное отыскание повода для враждебного столкновения, сохраняя образ ссоры и не уточняя сверх текста её конкретную форму.
theological_decisions:
- issue: Значение הָאֱלֹהִים в риторическом вопросе царя
  choice: Разве я Бог
  alternative: Разве я бог
  rationale: Контекст израильского повествования указывает на единого Бога, обладающего властью умерщвлять и оживлять. Написание с прописной буквы сохраняет эту силу, не добавляя отдельного богословского утверждения сверх реплики царя.
- issue: Медицинская определённость термина צָרַעַת
  choice: проказа
  alternative: тяжёлая кожная болезнь
  rationale: Традиционный термин обеспечивает узнаваемость и связность повествования, но сноска не позволяет ошибочно отождествить древнееврейское понятие исключительно с современной болезнью Хансена.
- issue: Характер предполагаемой враждебности в מִתְאַנֶּה הוּא לִי
  choice: ищет повода для ссоры со мной
  alternative: ищет предлога выступить против меня
  rationale: Основной текст сохраняет образ назревающего конфликта, а сноска отражает возможный оттенок намеренного поиска предлога для враждебных действий, не определяя их точнее оригинала.
translation_notes:
  register: Современный литературный русский с dignified повествовательным тоном. Синтаксис риторической речи сделан естественным для широкого читателя; древний жест разрывания одежд и напряжение между человеческой беспомощностью и Божьей властью сохранены. Маркеры сносок поставлены непосредственно при словах и выражениях, к которым относятся.
