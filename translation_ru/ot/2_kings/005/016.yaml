  text: וַ/יֹּ֕אמֶר חַי יְהוָ֛ה אֲשֶׁר עָמַ֥דְתִּי לְ/פָנָ֖י/ו אִם אֶקָּ֑ח וַ/יִּפְצַר בּ֥/וֹ לָ/קַ֖חַת וַ/יְמָאֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: ru
  text: 'Но он сказал: «Жив Яхве, перед Которым я стою, — не возьму!» Тот настойчиво уговаривал его взять, но он отказался.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Традиционная еврейская формула клятвы; по-русски кратко и торжественно передаёт буквальную форму и силу заверения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: пред Которым я стою
  rationale: Сохраняет образ служителя, стоящего перед Богом, не сводя выражение только к значению «Которому я служу».
- source_word: אִם אֶקָּח
  choice: не приму
  rationale: В формуле клятвы אִם вводит эллиптическое сильное отрицание. «Приму» естественно обозначает отказ от предложенного дара.
- source_word: וַיִּפְצַר בּוֹ
  choice: его настойчиво уговаривали
  rationale: Порода глагола передаёт сильное понуждение или настойчивую просьбу; безличная русская конструкция сохраняет неоднозначность местоименных референтов исходной фразы.
- source_word: לָקַחַת
  choice: принять дар
  rationale: Объект восстанавливается из контекста; «дар» делает русский текст ясным и передаёт смысл принятия предложенного вознаграждения.
- source_word: וַיְמָאֵן
  choice: он отказался
  rationale: Прямое и естественное соответствие решительному отказу Елисея.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное Божье имя; транслитерация «Яхве» сохраняет это различие и не заменяет имя титулом.
- issue: Смысл выражения «пред Которым я стою»
  choice: Сохранить образ стояния перед Яхве
  alternative: «Которому я служу»
  rationale: Выражение подразумевает пророческое служение, но буквальный образ также указывает на присутствие Бога; перевод не устраняет эту смысловую насыщенность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием клятвы. Синтаксис ясен для широкого читателя; образ «стоять пред» сохранён как уместный библейский оборот. Местоименная неоднозначность второй половины еврейского текста не устранена посредством явного называния Наамана.
