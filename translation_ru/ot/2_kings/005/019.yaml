  language: ru
  text: 'И он сказал ему: «Иди с миром». И тот отошёл от него на некоторое расстояние.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на отрезок земли»; еврейское выражение обозначает некоторую протяжённость пути без точной меры.'
