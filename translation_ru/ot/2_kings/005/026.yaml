  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: ru
  text: 'Но он сказал ему: «Разве моё сердце не было там[a], когда тот человек сошёл с колесницы тебе навстречу[b]? Разве сейчас время брать серебро и одежду, масличные рощи и виноградники, мелкий и крупный скот, слуг и служанок[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Разве моё сердце не шло?»; также возможно: «Разве я не был там духом?»'
    reason: Сохраняет еврейскую идиому и отмечает более истолковательное понимание внутреннего присутствия, не определяя его механизм.
  - marker: b
    text: 'Или: «когда тот человек повернулся от своей колесницы, чтобы встретить тебя».'
    reason: Глагол הָפַךְ буквально означает «повернуться, обернуться»; в данном контексте возможен смысл схода с колесницы.
  - marker: c
    text: 'Или: «рабов и рабынь».'
    reason: Еврейские слова могут обозначать людей, находящихся в рабской зависимости.
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: моё сердце не было с тобой
  rationale: Еврейская идиома буквально говорит, что сердце Елисея «шло». Русское «сердце было с тобой» сохраняет образ внутреннего присутствия и при этом звучит естественно; буквальная форма и более истолковательное понимание вынесены в примечание.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: когда тот человек сошёл с колесницы тебе навстречу
  rationale: В данном контексте оборот естественно описывает движение Неемана от колесницы навстречу Гиезию. Значение глагола «повернулся» сохраняется как лексическая альтернатива в примечании.
- source_word: הָעֵת
  choice: Разве сейчас время
  rationale: 'Вопросительная форма передаёт подразумеваемый риторический упрёк: момент для приобретения богатства неподходящий.'
- source_word: לָקַחַת אֶת הַכֶּסֶף
  choice: брать серебро
  rationale: «Серебро» сохраняет конкретный образ исходного текста, хотя здесь оно также означает деньги.
- source_word: בְּגָדִים
  choice: одежду
  rationale: Собирательное единственное число естественно для современного русского языка и передаёт множественное בְּגָדִים без архаичного оборота.
- source_word: זֵיתִים וּכְרָמִים
  choice: масличные рощи и виноградники
  rationale: В перечне имущества речь, вероятнее всего, идёт о плодоносящих земельных владениях, а не только о плодах или отдельных деревьях.
- source_word: צֹאן וּבָקָר
  choice: мелкий и крупный скот
  rationale: צֹאן охватывает стада овец и коз, а בָּקָר — крупный рогатый скот; русская парная формула точно и естественно передаёт эти категории.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: слуг и служанок
  rationale: Сохранено явное различение мужского и женского рода. Поскольку слова могут обозначать как домашних слуг, так и людей в рабской зависимости, более жёсткая социальная трактовка дана в примечании.
theological_decisions:
- issue: Характер внутреннего присутствия Елисея в выражении לִבִּי הָלַךְ
  choice: 'сохранить образ сердца: «моё сердце не было с тобой»'
  alternative: «разве я не был там духом»
  rationale: Текст утверждает необычную осведомлённость пророка, но не объясняет её механизм. Перевод не определяет это как конкретный вид сверхъестественного видения и сохраняет образную неопределённость.
- issue: Социальный статус עֲבָדִים וּשְׁפָחוֹת
  choice: слуг и служанок
  alternative: рабов и рабынь
  rationale: Семантический диапазон допускает оба варианта. Основной текст использует более широкие термины, а примечание сохраняет возможность рабского статуса, не сглаживая историческую реальность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Риторические вопросы и накопительный перечень сохранены; синтаксис упрощён лишь настолько, чтобы стих был понятен при чтении вслух.
