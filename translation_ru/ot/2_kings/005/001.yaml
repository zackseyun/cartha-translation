reference: 2 Kings 5:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: ru
  text: Нееман, военачальник царя Арама, был человеком влиятельным при своём господине и пользовался большим уважением, потому что через него Яхве даровал Араму победу[a]. Он был могучим воином, но страдал проказой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавление», «спасение». Здесь еврейское слово употреблено в контексте военного успеха.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает тяжёлое кожное заболевание в древнем понимании и не обязательно соответствует современной болезни Хансена (лепре).
    reason: cultural_note
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: Нееман
  rationale: Союз ו вводит новый эпизод и не требует отдельного русского временного маркера; имя передано в принятой русской библейской форме.
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: военачальник царя Арама
  rationale: Передаёт военную должность естественно и сохраняет историческое название Арам вместо традиционного, но менее точного «Сирия».
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו
  choice: был человеком влиятельным при своём господине
  rationale: אִישׁ גָּדוֹל здесь обозначает высокий общественный статус, а לִפְנֵי указывает на положение при царском дворе.
- source_word: וּנְשֻׂא פָנִים
  choice: пользовался большим уважением
  rationale: Естественно передаёт идиому о почёте и высоком положении.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: потому что через него Яхве даровал Араму победу
  rationale: בוֹ передано инструментально — «через него»; תְּשׁוּעָה в военном контексте означает победу или избавление; личное имя יְהוָה транслитерировано как «Яхве».
- source_word: גִּבּוֹר חַיִל
  choice: могучий воин
  rationale: Передаёт военную доблесть и силу без архаичного оборота «муж доблести».
- source_word: מְצֹרָע
  choice: страдал проказой
  rationale: Читаемая русская формулировка сохраняет традиционное обозначение, а примечание уточняет более широкий древний смысл термина.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Яхве дарует победу чужеземному Араму
  choice: сохранено прямое утверждение исходного текста
  alternative: смягчить причинную связь или не называть действующим лицом Яхве
  rationale: Еврейский текст недвусмысленно приписывает военный успех Арама Яхве; богословское напряжение не следует устранять.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без утраты придворного, военного и богословского смысла; сохранены название «Арам» и имя «Яхве».
