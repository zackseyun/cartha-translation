source:
  edition: WLC
  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: ru
  text: 'В этом деле[a] пусть Яхве простит твоего слугу: когда мой господин войдёт в дом Риммона, чтобы поклониться там, и будет опираться на мою руку, и я поклонюсь в доме Риммона, — когда я поклонюсь в доме Риммона[b], пусть же Яхве простит твоего слугу за это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Относительно этого дела».'
    reason: 'Лексическая альтернатива: לַדָּבָר הַזֶּה может вводить предмет просьбы как «в этом деле» или «относительно этого дела».'
  - marker: b
    text: «Дом Риммона» — храм или святилище сирийского бога Риммона. Глагол «поклониться» может означать как телесный поклон, так и религиозное почитание.
    reason: Культурная справка и существенная лексическая двусмысленность сохраняют смысловую напряжённость оригинала.
lexical_decisions:
- source_word: יִסְלַח
  choice: пусть простит
  rationale: Форма выражает просьбу-пожелание о прощении; «пусть простит» естественно передаёт её в современном русском.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционное русское представление тетраграмматона, понятное широкому читателю; прописное начертание отличает личное имя Бога от обычного титула.
- source_word: לְעַבְדֶּךָ
  choice: твоего слугу
  rationale: Это вежливое самообозначение Неемана; «слуга» здесь уместнее социально маркированного «раб».
- source_word: בְּבוֹא אֲדֹנִי
  choice: когда мой господин войдёт
  rationale: Предлог с инфинитивом задаёт временное обстоятельство; «господин» обозначает царя, которому служит Нееман.
- source_word: בֵית רִמּוֹן
  choice: дом Риммона
  rationale: Сохраняет буквальный образ еврейского выражения; из контекста и примечания ясно, что речь о святилище.
- source_word: לְהִשְׁתַּחֲוֺת / וְהִשְׁתַּחֲוֵיתִי
  choice: поклониться / поклонюсь
  rationale: «Поклониться» сохраняет двусмысленность между телесным поклоном и религиозным почитанием, не определяя внутреннего отношения Неемана.
- source_word: נִשְׁעָן עַל יָדִי
  choice: обопрётся на мою руку
  rationale: Близко передаёт телесную опору царя на сопровождающего его Неемана.
- source_word: נָא
  choice: пусть
  rationale: Просительный оттенок частицы естественно выражен всей конструкцией «пусть ... простит»; отдельное «прошу» сделало бы повтор тяжеловесным.
theological_decisions:
- issue: Обозначает ли השתחוה поклонение божеству или телесный поклон
  choice: поклониться
  alternative: совершить поклонение; пасть ниц
  rationale: Еврейский глагол допускает как культовое, так и телесное значение. Русское «поклониться» сохраняет напряжение между внешним действием Неемана по долгу службы и вопросом о религиозном почитании.
- issue: Форма передачи יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Выбрана укоренённая русская библейская передача, при этом графическое выделение указывает на особое еврейское имя; решение не добавляет к стиху конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Повтор «в доме Риммона» сохранён как намеренное усиление оригинала. Синтаксис слегка упорядочен для ясности длинной условно-временной конструкции.
