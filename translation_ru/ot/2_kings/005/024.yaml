  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: ru
  text: Когда он пришёл к холму[a], он взял у них всё это и убрал в доме. Затем он отпустил людей, и они ушли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к возвышенности», «к насыпи» или «к укреплённому холму»; евр. «к Офелу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: к холму
  rationale: Слово עֹפֶל обозначает возвышенность, насыпь или укреплённый холм. В данном повествовании естественнее всего топографическое значение; определённость передана контекстом, без превращения слова в имя собственное.
- source_word: מִיָּדָם
  choice: у них
  rationale: Буквально выражение означает «из их руки», но в этом контексте это обычный способ указать на непосредственное получение вещей от людей. Русское «взял у них» естественно передаёт смысл.
- source_word: וַיִּפְקֹד
  choice: спрятал
  rationale: У פקד широкий диапазон значений, включая помещение на хранение. Контекст тайного присвоения дара Гиези позволяет естественно передать действие глаголом «спрятал», не уточняя способ хранения.
- source_word: בַּבָּיִת
  choice: в доме
  rationale: בית здесь наиболее естественно понимается как физическое помещение, куда были убраны полученные вещи.
- source_word: הָאֲנָשִׁים
  choice: этих людей
  rationale: В еврейском тексте стоит общее слово «люди», а не специальное обозначение слуг. Указательное «этих» обеспечивает естественную русскую связность и отсылает к сопровождавшим Неемана.
