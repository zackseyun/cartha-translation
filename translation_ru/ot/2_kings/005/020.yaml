base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: ru
  text: 'Но Гиезий, слуга Елисея, человека Божьего, сказал: «Вот, мой господин пощадил Неемана, этого арамея, не взяв из его рук того, что тот привёз. Как жив Яхве, побегу за ним и возьму у него что-нибудь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעַר
  choice: слуга
  rationale: В данном контексте обозначает служебное положение Гиезия при Елисее; возраст не находится в центре внимания.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устойчивый и прозрачный пророческий титул, естественный для русского библейского стиля.
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт эмфатическую вводную частицу естественно и без архаической тяжеловесности.
- source_word: חָשַׂךְ ... מִקַּחַת
  choice: пощадил ... и не взял
  rationale: Передаёт как отношение Гиезия к отказу Елисея, так и поясняющее действие — воздержание от принятия дара.
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: Обозначает человеческого хозяина и начальника Гиезия — Елисея.
- source_word: הָאֲרַמִּי
  choice: арамей
  rationale: Точно отражает этническое обозначение в еврейском тексте и не заменяет его более поздним географическим названием.
- source_word: מִיָּדוֹ
  choice: из его рук
  rationale: Сохраняет телесную метафору еврейского выражения; по-русски она понятна как указание на принятие предложенного.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Кратко и близко к форме еврейской клятвенной формулы, сохраняя личное имя Бога.
- source_word: רַצְתִּי אַחֲרָיו
  choice: побегу за ним
  rationale: Передаёт непосредственное намерение и буквальный образ поспешной погони.
- source_word: מְאוּמָה
  choice: что-нибудь
  rationale: В контексте означает некий дар или имущество, которое Гиезий намерен получить.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие, не подменяя имя титулом.
- issue: Клятвенная формула חַי יְהוָה
  choice: Жив Яхве
  alternative: Как жив Яхве; клянусь живым Яхве
  rationale: Сохранена лаконичная исходная формула без добавления отсутствующего в тексте глагола «клянусь».
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Синтаксис сделан понятным для обычного читателя; сохранены титул «человек Божий», этноним «арамей» и клятвенная формула с именем Яхве.
