  to: 'Но Гиезий, слуга Елисея, человека Божьего, сказал: «Вот, мой господин пощадил Неемана, этого арамея, не взяв из его рук того, что тот привёз. Как жив Яхве, побегу за ним и возьму у него что-нибудь».'
  rationale: Исправлена синтаксическая связь, показывающая, что отказ Елисея принять принесённое и составляет то, в чём Гиезий усматривает «пощаду» Неемана. Приложение переставлено в естественный русский порядок, а клятвенная формула приведена к идиоматичной современной литературной передаче.
