base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: ru
  text: 'И послал Елисей к нему вестника с таким поручением: «Пойди, омойся семь раз в Иордане — и тело твоё снова станет здоровым[a], и ты будешь чист[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и возвратится к тебе твоя плоть»; это выражение означает восстановление прежнего здорового состояния.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и ты очистишься». Глагол может обозначать обретение чистоты и иметь как физический, так и обрядовый оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שלח; естественная и точная русская передача.
- source_word: אֵלָיו
  choice: к нему
  rationale: Указывает направление к Нееману, упомянутому в контексте.
- source_word: מַלְאָךְ
  choice: вестника
  rationale: В данном повествовании речь идёт о человеке-посланце, а не о небесном существе.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Естественно передаёт древнееврейскую формулу введения прямой речи.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: Пойди, омойся
  rationale: Передаёт побудительную силу конструкции и последовательность действий; возвратная форма уместна для омовения человека.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямая передача числового выражения.
- source_word: בַּיַּרְדֵּן
  choice: в Иордане
  rationale: Сохраняет краткую форму названия реки, употребительную и понятную по-русски.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: тело твоё станет снова здоровым
  rationale: Буквально плоть должна «вернуться к тебе»; по смыслу это восстановление прежнего здорового состояния. Формулировка передаёт идиому естественным современным русским языком.
- source_word: וּטְהָר
  choice: и ты будешь чист
  rationale: Сохраняет результативное значение и не ограничивает слово только физическим исцелением или только обрядовой чистотой.
theological_decisions:
- issue: Передача בָּשָׂר в контексте исцеления
  choice: тело
  alternative: плоть
  rationale: Русское «тело» здесь естественно обозначает телесное состояние Неемана; буквальная образность и идиома отмечены в сноске.
- issue: Физический или обрядовый оттенок טהר
  choice: ты будешь чист
  alternative: ты очистишься / будешь очищен
  rationale: Формулировка сохраняет как физический, так и связанный с чистотой оттенок, не разрешая неоднозначность в пользу одного из них.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок речи сохранён без тяжеловесного буквализма; формы «тело твоё» и «ты будешь чист» поддерживают достоинство и ясность текста.
