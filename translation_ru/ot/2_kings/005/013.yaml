base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: ru
  text: 'Тогда слуги его подошли, заговорили с ним и сказали: «Отец мой! Если бы пророк велел тебе сделать что-то великое, разве ты не сделал бы? Тем более, когда он сказал тебе: „Омойся — и станешь чистым“[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и очистишься». Еврейское слово может означать, что человек становится чистым или очищается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: подошли
  rationale: Передаёт приближение слуг к Нееману естественным для современного русского повествования глаголом.
- source_word: עֲבָדָיו
  choice: слуги его
  rationale: В контексте речь о подчинённых Неемана; «слуги» сохраняет социальное отношение, не уточняя без достаточных оснований их правовой статус.
- source_word: אָבִי
  choice: Отец мой
  rationale: Сохраняет уважительное метафорическое обращение младших к старшему или подчинённых к начальнику, не превращая его в буквальное указание на родство.
- source_word: דָּבָר גָּדוֹל
  choice: что-то великое
  rationale: 'Сохраняет широкое значение выражения: нечто значительное, трудное или впечатляющее; контраст с простым омовением остаётся ясным.'
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: разве ты не сделал бы?
  rationale: Риторический вопрос естественно передаёт ожидаемый утвердительный ответ.
- source_word: וְאַף כִּי
  choice: Тем более теперь
  rationale: Выражает довод от большего к меньшему и естественно связывает его с уже данным простым повелением.
- source_word: רְחַץ
  choice: Омойся
  rationale: Точный и достойный по регистру императив; в данном контексте естественнее простого «вымойся» и не сужает действие до конкретной части тела.
- source_word: וּטְהָר
  choice: и станешь чист
  rationale: Русская конструкция ясно передаёт наступление состояния чистоты после омовения, сохраняя одновременно телесный и связанный с чистотой оттенок.
theological_decisions:
- issue: Оттенок טהר при исцелении Неемана
  choice: и станешь чист
  alternative: и очистишься
  rationale: Основной вариант сохраняет результативное значение и не ограничивает чистоту только обрядовой или только физической сферой. Альтернатива также возможна, поскольку еврейская форма допускает значение становления чистым или очищения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Порядок «слуги его» слегка возвышен, но понятен; обращение «Отец мой» сохранено как уважительная метафора. Реплика построена естественно, без устранения смысловой широты слов דָּבָר גָּדוֹל и טהר.
