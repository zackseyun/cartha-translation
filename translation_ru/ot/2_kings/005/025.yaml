base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: ru
  text: 'Он же вошёл и предстал перед своим господином. Елисей спросил его: «Откуда ты, Гиезий?»[a] Тот ответил: «Твой слуга никуда не ходил».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Откуда, Гиезий?»'
    reason: lexical_alternative
  - marker: b
    text: 'Древнееврейская идиома: «Твой слуга не ходил ни туда ни сюда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Он же
  rationale: Частица «же» естественно передаёт переход с оттенком противопоставления после тайных действий Гиезия, не усиливая его до явного «но».
- source_word: בָא
  choice: вошёл
  rationale: Глагол буквально означает «пришёл», однако в данном контексте речь идёт о возвращении Гиезия к Елисею и входе в его присутствие; «вошёл» естественно выражает это движение.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: предстал перед своим господином
  rationale: Оборот описывает положение слуги перед тем, кому он служит. «Предстал перед» сохраняет сцену личного присутствия и звучит естественно в повествовании.
- source_word: אֲדֹנָיו
  choice: своим господином
  rationale: Здесь это обозначение человеческого начальника, Елисея, а не божественный титул. «Господин» сохраняет социальное отношение слуги к хозяину.
- source_word: מֵאָן
  choice: Откуда ты
  rationale: Сохраняется буквальная форма древнееврейского вопроса «откуда?», которая в русском языке понятна как вопрос о недавнем местонахождении или возвращении.
- source_word: גֵּחֲזִי
  choice: Гиезий
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: Твой слуга никуда не ходил
  rationale: Самообозначение «твой слуга» сохранено как существенная черта почтительной, но в данном случае лживой речи Гиезия.
- source_word: אָנֶה וָאָנָה
  choice: никуда
  rationale: Идиома буквально означает «сюда или туда» и выражает полное отрицание того, что говорящий куда-либо уходил; «никуда» естественно передаёт её смысл.
