base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: ru
  text: 'Но Нееман разгневался и ушёл. Он сказал: «Я-то думал: “Он непременно выйдет ко мне, встанет, призовёт имя Яхве, своего Бога, взмахнёт рукой над тем местом и исцелит прокажённого[a]”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устранит поражение проказой». Буквально: «поражённого проказой»; в данном контексте глагол может подразумевать устранение самого поражения. Библейское обозначение «проказа» охватывает различные кожные поражения и не обязательно означает современную болезнь Хансена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: разгневался
  rationale: Передаёт значение קצף — сильный гнев — в естественном для современного русского повествования регистре.
- source_word: וַיֵּלַךְ
  choice: ушёл
  rationale: В контексте обозначает раздражённый уход Неемана от дома Елисея.
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: Я-то думал
  rationale: Естественно передаёт внутреннюю речь и разочарованное противопоставление ожидания действительности; частица «-то» сохраняет эмфатическую силу הִנֵּה.
- source_word: יֵצֵא יָצוֹא
  choice: непременно выйдет
  rationale: Инфинитив абсолютный при личной форме усиливает уверенность ожидаемого действия.
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: призовёт имя Яхве, своего Бога
  rationale: Сохраняет библейскую формулу обращения к Богу и прямо передаёт тетраграмматон личным именем «Яхве».
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: проведёт рукой над поражённым местом
  rationale: Передаёт ожидаемый Нееманом ритуальный взмах руки и делает понятным, что הַמָּקוֹם — место поражения на теле.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: исцелит прокажённого
  rationale: В данном контексте אסף имеет результативное значение устранения поражения, а субстантивированная форма הַמְּצֹרָע естественно допускает понимание поражённого человека; русский оборот ясен и не воспроизводит неестественно буквальное «соберёт».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Передача הַמְּצֹרָע и связанной с ним болезни
  choice: прокажённого
  alternative: поражение проказой / проказу
  rationale: Форма допускает отнесение к поражённому человеку, однако древнееврейская категория не обязательно совпадает с современной болезнью Хансена; это уточняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Внутренняя речь оформлена естественно, без архаизмов; усиление ожидания передано словами «я-то» и «непременно».
