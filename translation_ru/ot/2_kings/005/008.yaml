source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: ru
  text: 'Когда Елисей, человек Божий, услышал, что царь Израиля разорвал на себе одежду[a], он послал царю сказать: «Зачем ты разорвал на себе одежду? Пусть же он придёт ко мне[b] и узнает, что в Израиле есть пророк».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Разрывать на себе одежду было принято в знак сильного горя, потрясения или скорби.
    reason: Пояснение культурного значения поступка.
  - marker: b
    text: «Он» — Нееман, а не царь Израиля.
    reason: Уточнение референта местоимения, которое в русском тексте может быть понято неоднозначно.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда … услышал
  rationale: Естественно передаёт временной переход еврейского повествования, не добавляя отсутствующего в оригинале наречия «теперь».
- source_word: אֱלִישָׁע
  choice: Елисей
  rationale: Традиционная и общепринятая русская форма библейского имени.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохраняет устойчивое библейское обозначение пророка как Божьего представителя, не сводя его к общей характеристике благочестия.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: разорвал на себе одежду
  rationale: Передаёт обычай разрывать свою одежду в знак сильного горя или потрясения; выражение современно и понятно по-русски.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: он послал к царю сказать
  rationale: Не добавляет прямо не названного в еврейском тексте посланника и естественно вводит прямую речь.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: Зачем ты разорвал на себе одежду?
  rationale: В данном контексте «зачем» естественно выражает вопрос о причине и смысле поступка, сохраняя повтор ключевого выражения.
- source_word: יָבֹא נָא אֵלַי
  choice: Пусть же он придёт ко мне
  rationale: Форма третьего лица сохранена, а частица «же» мягко передаёт побудительно-просительный оттенок נָא без тяжеловесного «прошу».
- source_word: וְיֵדַע
  choice: и узнает
  rationale: Передаёт ожидаемый результат прихода; вид «узнает» естественен в русском контексте.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: что есть пророк в Израиле
  rationale: Сохраняет экзистенциальное значение יֵשׁ и акцент на действительном присутствии пророка в Израиле.
theological_decisions:
- issue: Значение титула אִישׁ הָאֱלֹהִים
  choice: человек Божий
  alternative: благочестивый человек; человек, принадлежащий Богу
  rationale: Выражение функционирует как признанное пророческое обозначение, а не только как оценка личного благочестия Елисея.
- issue: К кому относится местоимение в יָבֹא ... וְיֵדַע
  choice: В основном тексте сохранено «он», а в сноске указан Нееман.
  alternative: Пусть Нееман придёт ко мне и узнает
  rationale: Еврейский текст использует местоименную глагольную форму без повторения имени. Сноска устраняет возможное русское недоразумение, не подменяя форму оригинала явным именем.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого круга читателей; сохранены повтор выражения об одежде, пророческий титул и местоименная отсылка оригинала.
