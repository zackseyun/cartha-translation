base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: ru
  text: Арамейские набеговые отряды вышли и увели в плен из земли Израиля маленькую девочку[a]. Она была при жене Неемана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юную девушку». Древнееврейское выражение подчёркивает её юный возраст и малость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и была перед женой Неемана», то есть находилась при ней и прислуживала ей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: Арамейские отряды
  rationale: При множественном сказуемом название Арама обозначает здесь людей или силы Арама; גְדוּדִים — военные, в данном контексте набеговые отряды.
- source_word: יָצְאוּ
  choice: вышли в набег
  rationale: Глагол означает «вышли», а цель выхода определяется существительным «отряды» и последующим захватом пленницы; явное указание на набег естественно передаёт ситуацию.
- source_word: וַיִּשְׁבּוּ
  choice: увели в плен
  rationale: Глагол שׁבה обозначает взятие человека в плен; «увели в плен» также передаёт перемещение из земли Израиля.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: из земли Израиля
  rationale: Сохранено явное географическое обозначение אֶרֶץ יִשְׂרָאֵל.
- source_word: נַעֲרָה קְטַנָּה
  choice: маленькую девочку
  rationale: Сочетание подчёркивает юный возраст и малость; современное русское «маленькая девочка» передаёт оба элемента без добавления служебного статуса.
- source_word: וַתְּהִי לִפְנֵי
  choice: стала прислуживать
  rationale: Буквально «стала/была перед»; в данном контексте это идиома личного услужения или пребывания при госпоже.
- source_word: אֵשֶׁת נַעֲמָן
  choice: жене Неемана
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции.
