    issue: Добавленное значение в «Она стала прислуживать».
    rationale: Ва-йиктоль וַתְּהִי означает «и она была»; он описывает её положение при жене Неемана, но не сообщает о моменте, когда она начала служить.
  - severity: medium
    issue: Неточная буквальная формулировка в примечании b.
    rationale: В примечании сказано «стала перед женой Неемана», тогда как в еврейском тексте нет глагола «стала»; буквальное соответствие — «была перед женой Неемана».
  - severity: low
    issue: «Вышли в набег» несколько менее прямо отражает синтаксис оригинала.
    rationale: Набеговый характер естественно связан с гְּדוּדִים; лучше выразить его определением при «отрядах», сохранив глагол «вышли» без добавленного целевого оборота.
