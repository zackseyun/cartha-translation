  to: Арамейские набеговые отряды вышли и увели в плен из земли Израиля маленькую девочку[a]. Она была при жене Неемана[b].
  rationale: Правка устраняет невыраженный в оригинале оттенок начала действия, исправляет буквальное примечание и более непосредственно передаёт набеговый смысл слова «отряды». Значение пленения, географическое указание и служебное положение девочки сохранены.
