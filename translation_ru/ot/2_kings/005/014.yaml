base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: ru
  text: И он спустился и семь раз окунулся[a] в Иордане, по слову человека Божьего. Его плоть стала как плоть маленького мальчика, и он очистился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погрузился». Еврейский глагол может обозначать окунание или погружение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: И он спустился
  rationale: Последовательная форма с וַ продвигает повествование; «спустился» сохраняет конкретное значение ירד. Связь с предыдущим повелением ясна из контекста без добавления причинного «поэтому».
- source_word: וַיִּטְבֹּל
  choice: окунулся
  rationale: טבל обозначает погружение или окунание. Возвратная русская форма естественно передаёт действие Неемана над самим собой, не уточняя степень погружения сверх еврейского текста.
- source_word: בַּיַּרְדֵּן
  choice: в Иордане
  rationale: Сохраняется традиционная русская форма названия реки; добавлять слово «река» не требуется.
- source_word: שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Прямое и естественное обозначение повторности действия.
- source_word: כִּדְבַר
  choice: по слову
  rationale: Передаёт דבר близко к форме оригинала и одновременно указывает, что Нееман поступил согласно сказанному наставлению.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человека Божьего
  rationale: Устойчивое библейское пророческое наименование, сохраняющее образ и богословский вес еврейского выражения.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: восстановилась его плоть
  rationale: שׁוב буквально выражает возвращение, а здесь — восстановление прежнего здорового состояния. «Плоть» сохраняет конкретный телесный образ בשר.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: как плоть малого ребёнка
  rationale: נער קטן указывает на юного или малого ребёнка. Формулировка сохраняет повтор בשר и не сужает обозначение до конкретного возраста.
- source_word: וַיִּטְהָר
  choice: он очистился
  rationale: 'Форма передаёт наступивший результат: он стал чист. «Очистился» сохраняет возможные телесные и ритуальные оттенки, не сводя выражение только к медицинскому исцелению.'
theological_decisions:
- issue: Характер восстановления Неемана
  choice: Передать и телесное восстановление, и наступившую чистоту
  alternative: Свести итог либо к медицинскому «исцелился», либо исключительно к ритуальному «стал чист»
  rationale: Стих сочетает образ восстановившейся плоти с глаголом טהר. Перевод сохраняет обе стороны и не вводит сакраментального или типологического толкования.
- issue: Значение טהר в заключении
  choice: «очистился»
  alternative: «стал чист» или «был очищен»
  rationale: Еврейская форма допускает результативное понимание. Русское «очистился» естественно выражает переход в состояние чистоты, не определяя явно внешнего деятеля.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранены конкретные образы «слово человека Божьего» и «плоть»; синтаксис слегка упрощён для ясного чтения. Маркер сноски помещён непосредственно после слова, к которому относится.
