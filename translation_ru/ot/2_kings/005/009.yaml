    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: В повествовательной последовательности בוא обозначает прибытие Неемана к дому Елисея; простое «пришёл» сохраняет движение и не добавляет толкования.
- source_word: נַעֲמָן
  choice: Нееман
  rationale: Использована традиционная русская библейская форма личного имени.
- source_word: בְּסוּסוֹ
  choice: со своими конями
  rationale: Форма буквально стоит в единственном числе («со своим конём»), но в сочетании с רֶכֶב и с учётом свиты военачальника естественно допускает собирательное понимание.
- source_word: וּבְרִכְבּוֹ
  choice: и колесницами
  rationale: רֶכֶב может обозначать как отдельную колесницу, так и колесницы собирательно; здесь множественное число естественно передаёт сопровождавший Неемана выезд.
- source_word: וַיַּעֲמֹד
  choice: остановился
  rationale: עמד буквально связано со стоянием, а в данном контексте описывает, как прибывший Нееман остановился перед домом; русское «остановился» звучит естественно и сохраняет зримость сцены.
- source_word: פֶּתַח הַבַּיִת
  choice: у входа в дом
  rationale: פֶּתַח означает отверстие или вход; «у входа в дом» — точная и естественная современная русская формулировка.
- source_word: לֶאֱלִישָׁע
  choice: Елисея
  rationale: 'Предлог ל здесь выражает принадлежность или связь: речь идёт о доме Елисея.'
