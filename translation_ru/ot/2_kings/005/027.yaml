    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: кожная болезнь
  rationale: Обозначает широкий круг тяжёлых кожных поражений или состояний, а не обязательно современную болезнь Хансена; перевод избегает неоправданно точного диагноза.
- source_word: נַעֲמָן
  choice: Нееман
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: תִּדְבַּק
  choice: пристанет
  rationale: Передаёт образ прочного прилипания и естественно сочетается в русском языке с болезнью и предлогом «к».
- source_word: וּבְזַרְעֲךָ
  choice: и к твоим потомкам
  rationale: Зֶרַע здесь означает последующие поколения; «потомки» яснее и естественнее буквального «семя».
- source_word: לְעוֹלָם
  choice: навеки
  rationale: В формуле суда выражает неограниченную продолжительность; слово сохраняет возвышенный, но современно понятный регистр.
- source_word: וַיֵּצֵא מִלְּפָנָיו
  choice: и вышел он от него
  rationale: Сохраняет конкретное движение и естественно передаёт уход от Елисея; местоименная неоднозначность оригинала не устраняется добавлением имени.
- source_word: מְצֹרָע
  choice: поражённый этой болезнью
  rationale: Связывает состояние Гиезия с названной ранее болезнью Неемана и не отождествляет её с болезнью Хансена.
- source_word: כַּשָּׁלֶג
  choice: белый как снег
  rationale: Явно передаёт подразумеваемый признак сравнения — белизну поражённой кожи — согласно обычной библейской идиоме.
theological_decisions:
- issue: Значение צָרַעַת / מְצֹרָע
  choice: кожная болезнь / поражённый этой болезнью
  alternative: проказа / прокажённый
  rationale: Еврейские слова обозначают более широкую категорию тяжёлых кожных поражений и ритуальных состояний и не требуют диагноза современной болезни Хансена. Традиционный вариант сохранён в примечании.
- issue: Продолжительность суда לְעוֹלָם
  choice: навеки
  alternative: навсегда / во все времена
  rationale: Перевод сохраняет категоричность формулы суда, не пытаясь богословски ограничить или дополнительно истолковать её.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественности пророческого приговора. «Пусть же» естественно передаёт контекстуальную силу формы будущего времени как объявления суда; местоимения оригинала сохранены без поясняющих имён.
