base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: ru
  text: 'И погнался Гиезий за Нееманом. Увидев, что Гиезий бежит за ним, Нееман сошёл с колесницы ему навстречу и спросил: «Всё ли благополучно?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мир ли?» Слово «шалом» здесь служит вопросом о том, всё ли хорошо и благополучно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: погнался
  rationale: Глагол רדף обозначает преследование или целенаправленное движение вслед за кем-либо. «Погнался» естественно передаёт энергичность действия, не приписывая ему враждебности.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: увидев, что Гиезий бежит за ним
  rationale: Так сохраняются зрительное восприятие и продолжающееся действие. Повтор имени устраняет неясность, возникающую в русском при нескольких местоимениях мужского рода.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: сошёл с колесницы
  rationale: Хотя נפל обычно значит «падать», здесь сочетание идиоматически описывает быстрое оставление колесницы. «Сошёл» не создаёт ошибочного впечатления случайного падения; скорость уже подразумевается контекстом.
- source_word: לִקְרָאתוֹ
  choice: ему навстречу
  rationale: לקראת обозначает движение навстречу кому-либо; выбран естественный русский порядок слов.
- source_word: הֲשָׁלוֹם
  choice: Всё ли благополучно?
  rationale: שלום здесь употреблено как краткий вопрос о том, всё ли в порядке. «Благополучно» сохраняет связь со значениями мира, целости и благополучия, оставаясь понятным современному читателю.
- source_word: וַ
  choice: И
  rationale: Начальный повествовательный waw продолжает последовательность событий; русское «И» передаёт эту связь без добавления причинного оттенка.
