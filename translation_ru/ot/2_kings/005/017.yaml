  text: וַ/יֹּאמֶר֮ נַעֲמָן֒ וָ/לֹ֕א יֻתַּן נָ֣א לְ/עַבְדְּ/ךָ֔ מַשָּׂ֥א צֶֽמֶד פְּרָדִ֖ים אֲדָמָ֑ה כִּ֡י לֽוֹא יַעֲשֶׂה֩ ע֨וֹד עַבְדְּ/ךָ֜ עֹלָ֤ה וָ/זֶ֨בַח֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים כִּ֖י אִם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: ru
  text: 'Тогда Нееман сказал: «Если же нет, то пусть, пожалуйста, дадут рабу твоему столько земли, сколько может увезти пара мулов[a][b], потому что впредь раб твой не будет приносить всесожжения и жертвы другим богам, а только Яхве[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «груз пары мулов»; то есть столько земли, сколько могла нести пара мулов.'
    reason: lexical_alternative
  - marker: b
    text: Просьба об израильской земле может отражать древнее представление о связи божества с определённой страной или желание поклоняться Яхве на земле Израиля. Сам текст причины не объясняет.
    reason: cultural_note
  - marker: c
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога; его также передают как «Господь» или «Иегова».
    reason: alternative_reading
lexical_decisions:
- source_word: וָלֹא
  choice: Если же нет
  rationale: В контексте это вежливый условный ответ Неемана на отказ Елисея принять дар. Такой перевод передаёт смысл эллиптической еврейской фразы, не сводя её к буквальному «и нет».
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: пусть дадут рабу твоему
  rationale: Конструкция сохраняет побудительно-пассивный смысл формы и почтительное самоназвание Неемана; частица נָא выражена смягчённой просьбой, естественной в русском контексте.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים
  choice: столько, сколько может увезти пара мулов
  rationale: Это ясно и естественно передаёт меру груза, который несёт пара мулов, избегая неясного буквального оборота «груз пары мулов».
- source_word: אֲדָמָה
  choice: земли
  rationale: Речь идёт о почве, которую можно погрузить и увезти; «земля» здесь литературно и понятно по-русски.
- source_word: כִּי לֹא יַעֲשֶׂה עוֹד עַבְדְּךָ
  choice: потому что впредь раб твой не будет приносить
  rationale: С глаголом עשה и названиями жертв смысл естественно передаётся глаголом «приносить»; עוֹד выражено словом «впредь».
- source_word: עֹלָה וָזֶבַח
  choice: всесожжения и жертвы
  rationale: «Всесожжение» — точный традиционный русский эквивалент עֹלָה, тогда как זֶבַח здесь обозначает жертву в более общем смысле.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Предлог и получатели жертв переданы прямо и естественно.
- source_word: כִּי אִם לַיהוָה
  choice: а только Яхве
  rationale: 'Оборот כִּי אִם выражает сильное исключение: жертвы будут предназначаться исключительно Яхве.'
- source_word: יהוה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, сохраняя его отличие от титула «Господь».
theological_decisions:
- issue: Значение просьбы об израильской земле
  choice: Мотив не истолковывается в основном тексте
  alternative: Прямо объяснить землю как основание для жертвенника или как необходимую территорию для поклонения Яхве
  rationale: Стих связывает просьбу с будущим исключительным поклонением Яхве, но не объясняет убеждений Неемана. Возможные историко-религиозные объяснения вынесены в примечание.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передача личного имени сохраняет прямое употребление Тетраграмматона в исходном тексте и не заменяет его титулом.
- issue: Исключительность будущего поклонения Неемана
  choice: а только Яхве
  alternative: кроме Яхве
  rationale: Формулировка ясно сохраняет заявленный отказ от жертв другим богам, не добавляя вывода о полном понимании Нееманом израильской веры.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Почтительное самоназвание «раб твой» сохранено как важная черта речи Неемана; громоздкая буквальная мера груза раскрыта естественным сравнительным оборотом.
