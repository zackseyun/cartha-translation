base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: ru
  text: 'Царь Арама[c] сказал: «Отправляйся[a], а я пошлю письмо царю Израиля». И он отправился, взяв с собой десять талантов серебра, шесть тысяч единиц золота[b] и десять комплектов одежды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «иди, приди»; два повелительных глагола, вероятно, выражают настойчивое позволение или побуждение отправиться без промедления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «шесть тысяч золота»; конкретная единица счёта или веса в еврейском тексте не названа.'
    reason: lexical_alternative
  - marker: c
    text: Арам — название в еврейском тексте; традиционно эту страну также называют Сирией.
    reason: alternative_reading
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: Отправляйся
  rationale: Два повелительных глагола буквально означают «иди, приди», но вместе, вероятно, выражают решительное позволение или побуждение без указания на два отдельных действия. Естественная русская передача вынесена в текст, а форма оригинала сохранена в примечании.
- source_word: סֵפֶר
  choice: письмо
  rationale: В дипломатическом контексте речь идёт о письменном послании одного царя другому.
- source_word: בְּיָדוֹ
  choice: с собой
  rationale: Буквально «в своей руке»; здесь это обычное обозначение того, что человек несёт или имеет при себе. Русское «с собой» передаёт смысл естественно.
- source_word: כִּכְּרֵי כֶסֶף
  choice: талантов серебра
  rationale: כִּכָּר — крупная древняя мера веса. Сохранение традиционного термина «талант» избегает неточного пересчёта в современные единицы.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: шесть тысяч мер золота
  rationale: В еврейском тексте после числа стоит только «золото», без названия единицы. Обобщающее «мер» делает фразу понятной по-русски и не уточняет единицу вопреки оригиналу; неоднозначность отмечена в сноске.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: перемен одежды
  rationale: Выражение обозначает сменные комплекты одежды, которые могли служить ценным даром. «Перемены одежды» сохраняет образ и соответствует возвышенному повествовательному регистру.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Передано собственное географическое имя оригинала, а не более позднее соответствие «Сирия».
