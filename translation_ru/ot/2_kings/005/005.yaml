  register: Современный литературный русский с достоинством исторического повествования. Синтаксис сделан естественным для русского языка; древняя мера «талант» сохранена, а не пересчитана. Необычная конструкция с двумя повелительными глаголами и отсутствие единицы при золоте раскрыты в примечаниях, чтобы не сглаживать особенности оригинала.
