  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: ru
  text: 'Она сказала своей госпоже: «Вот если бы мой господин оказался у пророка, который в Самарии! Тогда тот исцелил бы его[a] от проказы[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол буквально связан со значениями «собирать, убирать»; в данном контексте он означает избавить от болезни, то есть исцелить.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово צָרַעַת, традиционно переводимое как «проказа», могло обозначать и другие тяжёлые кожные заболевания, а не только болезнь Хансена.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: своей госпоже
  rationale: Слово обозначает хозяйку или женщину, занимающую более высокое положение в доме; «госпожа» естественно передаёт эти отношения в данном контексте.
- source_word: אַחֲלֵי
  choice: О, если бы
  rationale: Частица выражает сильное пожелание; эта формулировка сохраняет желательное значение и звучит естественно по-русски.
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: Девочка почтительно говорит о Неемане; «господин» сохраняет уважительный характер обозначения.
- source_word: לִפְנֵי
  choice: пришёл к
  rationale: Буквально — «был перед лицом»; в данном контексте речь идёт о том, чтобы оказаться в присутствии пророка. Русское «пришёл к» естественно передаёт смысл ситуации.
- source_word: הַנָּבִיא
  choice: пророку
  rationale: Сохранён титул с определённым значением; еврейский текст не называет здесь Елисея по имени.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Стандартная передача географического названия.
- source_word: אָז
  choice: Тогда
  rationale: Слово вводит ожидаемое следствие исполнения пожелания.
- source_word: יֶאֱסֹף
  choice: исцелил бы его
  rationale: Основное значение глагола — «собирать, убирать»; в сочетании с обозначением болезни он идиоматически выражает избавление от неё. Естественное русское соответствие — «исцелил бы», а буквальный образ отмечен в сноске.
- source_word: מִצָּרַעְתּוֹ
  choice: от проказы
  rationale: «Проказа» — традиционное и узнаваемое соответствие термину צָרַעַת, однако сноска предупреждает, что он не обязательно обозначает именно современную болезнь Хансена.
