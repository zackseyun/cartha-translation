  source_fidelity: 'Основной смысл передан верно: девочка обращается к своей госпоже, выражает пожелание относительно своего господина и говорит, что пророк в Самарии исцелил бы его от צָרַעַת. «Исцелил бы» естественно передаёт контекстуальное значение יֶאֱסֹף. Однако «который живёт в Самарии» излишне конкретизирует предлог בְּ («в, в Самарии»): текст говорит о пророке, находящемся в Самарии, но не утверждает его постоянного проживания там.'
