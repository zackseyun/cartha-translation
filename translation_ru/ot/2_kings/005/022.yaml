base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: ru
  text: 'Он ответил: «Всё в порядке.[a] Мой господин послал меня сказать: „Вот, только что ко мне из горной области Ефрема пришли двое молодых людей из числа сыновей пророков.[b] Прошу, дай им талант серебра[c] и два комплекта одежды“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «Мир» или «Всё хорошо». Здесь еврейское шалом служит заверением, что всё в порядке.'
    reason: lexical_alternative
  - marker: b
    text: «Сыны пророков» — устойчивое обозначение членов пророческого сообщества.
    reason: cultural_note
  - marker: c
    text: Талант — крупная древняя мера веса, которой, в частности, отмеряли серебро.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Всё в порядке
  rationale: В данном диалоге слово служит идиоматическим заверением, что ничего плохого не случилось; такой перевод естественен по-русски и точнее передаёт функцию реплики, чем буквальное «мир».
- source_word: אֲדֹנִי
  choice: мой господин
  rationale: Гиезий говорит о Елисее как о своём господине; слово сохраняет отношение подчинённого к старшему, не придавая выражению божественного смысла.
- source_word: שְׁלָחַנִי
  choice: послал меня
  rationale: Еврейский перфект обозначает уже совершённое действие; в русском повествовании естественна форма прошедшего времени.
- source_word: הִנֵּה עַתָּה זֶה
  choice: Вот, только что
  rationale: «Вот» передаёт указательно-привлекающую функцию הִנֵּה, а «только что» — непосредственную временную близость עַתָּה זֶה.
- source_word: שְׁנֵי נְעָרִים
  choice: двое молодых людей
  rationale: נְעָרִים может означать юношей, слуг или молодых людей; поскольку далее они отнесены к пророческому сообществу, нейтральное «молодых людей» не вносит лишнего толкования.
- source_word: מֵהַר אֶפְרַיִם
  choice: с Ефремовой нагорной области
  rationale: Выражение обычно обозначает гористую область Ефрема, а не одну отдельную гору.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: из числа сыновей пророков
  rationale: Сохранён устойчивый древнееврейский термин для членов пророческого сообщества; пояснение вынесено в сноску.
- source_word: תְּנָה נָּא
  choice: Прошу, дай
  rationale: Частица נָא смягчает повеление и делает его вежливой просьбой.
- source_word: כִּכַּר כֶּסֶף
  choice: один талант серебра
  rationale: כִּכָּר — мера веса; традиционный термин «талант» сохраняет метрологическую точность, а пояснение дано в сноске.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: две перемены одежды
  rationale: Выражение означает два сменных комплекта одежды; «перемены одежды» остаётся ясным и близким к форме оригинала.
