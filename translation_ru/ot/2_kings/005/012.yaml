base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: ru
  text: «Разве Авана и Фарпар[a], реки Дамаска, не лучше всех вод Израиля? Разве я не могу омыться в них и стать чистым?[b]» И он повернулся и ушёл в ярости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Авана» в некоторых традициях передаётся как «Амана».
    reason: alternative_reading
  - marker: b
    text: 'Или: «и очиститься» либо «и быть очищенным»; еврейское выражение может обозначать как физическое очищение, так и чистоту в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: разве... не
  rationale: В обоих случаях передаёт риторический вопрос, предполагающий утвердительный ответ, естественным русским оборотом.
- source_word: טוֹב ... מִכֹּל
  choice: лучше всех
  rationale: Сравнительная конструкция требует формы «лучше»; «всех» сохраняет обобщающее значение מִכֹּל.
- source_word: אבנה
  choice: Авана
  rationale: Передаёт масоретскую форму географического названия; вариант «Амана» отмечен в сноске.
- source_word: וּפַרְפַּר
  choice: и Фарпар
  rationale: Традиционная и узнаваемая русская передача названия реки.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: реки Дамаска
  rationale: Естественно передаёт еврейскую сопряжённую конструкцию.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: всех вод Израиля
  rationale: Сохраняет более широкое «воды», не сужая значение до рек.
- source_word: אֶרְחַץ בָּהֶם
  choice: омыться в них
  rationale: «Омыться» естественно относится к погружению или мытью в реке и сохраняет связь с данным ранее повелением.
- source_word: וְטָהָרְתִּי
  choice: и очиститься
  rationale: Инфинитив после «мог бы» естественен по-русски и сохраняет возможность как физического очищения, так и более широкого значения чистоты.
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: повернулся и ушёл
  rationale: Прямо передаёт последовательность двух еврейских глаголов и естественно звучит по-русски.
- source_word: בְּחֵמָה
  choice: в ярости
  rationale: Передаёт сильную степень гнева, выраженную существительным חֵמָה.
theological_decisions:
- issue: Характер очищения
  choice: очиститься
  alternative: стать чистым / быть очищенным
  rationale: Контекст относится к кожной болезни Неемана, но корень טהר допускает также представление о чистоте в более широком, в том числе ритуальном, смысле. «Очиститься» не ограничивает значение одной сферой.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Риторические вопросы переданы естественной конструкцией «разве... не»; интенсивность гнева сохранена словом «ярость».
