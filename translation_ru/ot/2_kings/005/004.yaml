base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/004.yaml
  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: ru
  text: 'И пришёл он к своему господину и доложил: «Вот что сказала девушка из земли Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл к
  rationale: בוא может означать «приходить», «идти» или «входить» в зависимости от точки отсчёта. В данном контексте естественно передать приближение к господину без добавления отсутствующего в тексте помещения.
- source_word: וַיַּגֵּד
  choice: доложил
  rationale: Порода hифиль глагола נגד означает «сообщить, рассказать, известить»; «доложил» естественно выражает сообщение вышестоящему лицу.
- source_word: לַאדֹנָיו
  choice: своему господину
  rationale: אָדוֹן означает «господин, владыка, хозяин». «Господин» сохраняет придворно-служебный характер отношений и не уточняет личность референта сверх еврейского текста.
- source_word: לֵאמֹר
  choice: 'доложил:'
  rationale: Формула вводит прямую речь. В русском двоеточие после глагола речи естественно передаёт её функцию без тяжеловесного «говоря».
- source_word: כָּזֹאת וְכָזֹאת
  choice: вот что
  rationale: Идиома дословно имеет вид «так и так» и кратко отсылает к уже изложенным словам. Русское «вот что» естественно вводит их обобщённую передачу.
- source_word: דִּבְּרָה
  choice: сказала
  rationale: דבר здесь обозначает речевое действие; «сказала» является точным и естественным соответствием.
- source_word: הַנַּעֲרָה
  choice: девушка
  rationale: נַעֲרָה означает девушку или молодую женщину. Хотя из контекста известно её служебное положение, в самом стихе слово его прямо не обозначает.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: из земли Израиля
  rationale: Относительная конструкция указывает на происхождение девушки. Сжатая русская форма естественна и сохраняет явное אֶרֶץ — «земля».
