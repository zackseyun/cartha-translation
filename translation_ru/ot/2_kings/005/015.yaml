source:
  edition: WLC
  text: וַ/יָּשָׁב֩ אֶל אִ֨ישׁ הָ/אֱלֹהִ֜ים ה֣וּא וְ/כָֽל מַחֲנֵ֗/הוּ וַ/יָּבֹא֮ וַ/יַּעֲמֹ֣ד לְ/פָנָי/ו֒ וַ/יֹּ֗אמֶר הִנֵּה נָ֤א יָדַ֨עְתִּי֙ כִּ֣י אֵ֤ין אֱלֹהִים֙ בְּ/כָל הָ/אָ֔רֶץ כִּ֖י אִם בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּ֛ה קַח נָ֥א בְרָכָ֖ה מֵ/אֵ֥ת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: ru
  text: 'И он вернулся к человеку Божьему вместе со всей своей свитой, пришёл, встал перед ним и сказал: «Вот, теперь я знаю, что на всей земле нет Бога, кроме как в Израиле. А теперь прошу, прими дар[a] от твоего слуги».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «благословение». Здесь это слово означает дар или подношение.'
    reason: Сохраняет буквальное значение еврейского בְרָכָה наряду с его контекстуальным смыслом.
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохраняет устойчивый древнееврейский титул пророка или Божьего посланника и его литературное звучание, не заменяя его пояснительным словом «пророк».
- source_word: מַחֲנֵהוּ
  choice: вся его свита
  rationale: Буквально слово может означать «его стан» или «его отряд», но здесь обозначает сопровождавших Неемана людей; «свита» естественно передаёт это коллективное значение в данном повествовательном контексте.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: встал перед ним
  rationale: Прямо и естественно передаёт обычное выражение, означающее появиться и стоять в чьём-либо присутствии.
- source_word: הִנֵּה נָא
  choice: вот, теперь
  rationale: Передаёт привлечение внимания и подчёркивает наступившее осознание, избегая архаичного «се».
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект выражает достигнутое знание как нынешнее состояние; контекст показывает, что Нееман только что пришёл к этому убеждению.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: на всей земле нет Бога, кроме как в Израиле
  rationale: Сохраняет сильное исповедание единственности Бога и широкий смысл הָאָרֶץ («земля», весь мир), не дополняя фразу словами «Бог Израиля».
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Следует формулировке еврейского текста и сохраняет её напряжённую пространственную форму, не разрешая её посредством пояснительного перефразирования.
- source_word: קַח נָא
  choice: прошу, прими
  rationale: Буквально «возьми, пожалуйста»; при предложении дара глагол естественно передаётся как просьба принять его.
- source_word: בְרָכָה
  choice: дар
  rationale: Буквально «благословение», но в контексте подношения это слово обозначает подарок или дар; буквальный вариант сохранён в сноске.
- source_word: עַבְדֶּךָ
  choice: твой слуга
  rationale: Здесь это почтительное самообозначение говорящего, а не указание на его правовой статус раба.
theological_decisions:
- issue: 'Исповедание Неемана: Бога нет нигде, кроме Израиля'
  choice: Передать как прямое и сильное исповедание единственности истинного Бога, сохранив слова «в Израиле».
  alternative: 'Сказать «нет иного бога» или разъяснить: «нет Бога, кроме Бога Израиля».'
  rationale: Еврейский текст утверждает исключительность Бога без смягчения, но формально говорит «в Израиле». Перевод не должен ни ослаблять это исповедание, ни систематизировать его добавленными словами.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан плавным, но последовательность действий и повторное «теперь» сохранены. Формула «человек Божий» намеренно оставлена как библейский титул; местоимения, относящиеся к человеку, пишутся со строчной буквы.
