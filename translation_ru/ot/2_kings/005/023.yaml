  text: וַ/יֹּ֣אמֶר נַעֲמָ֔ן הוֹאֵ֖ל קַ֣ח כִּכָּרָ֑יִם וַ/יִּפְרָץ בּ֗/וֹ וַ/יָּצַר֩ כִּכְּרַ֨יִם כֶּ֜סֶף בִּ/שְׁנֵ֣י חֲרִטִ֗ים וּ/שְׁתֵּי֙ חֲלִפ֣וֹת בְּגָדִ֔ים וַ/יִּתֵּן֙ אֶל שְׁנֵ֣י נְעָרָ֔י/ו וַ/יִּשְׂא֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: ru
  text: 'Нееман сказал: «Прошу, возьми два таланта[a]». Он настойчиво уговаривал его, затем упаковал два таланта серебра в два мешка вместе с двумя сменами одежды и отдал всё двум своим слугам. Они понесли это впереди него[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Талант — древняя мера веса; её точная величина различалась, но обычно составляла около 30–35 килограммов.
    reason: cultural_note
  - marker: b
    text: То есть впереди Гиезия.
    reason: referent_clarification
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: Прошу, возьми
  rationale: הוֹאֵל перед повелительным קַח выражает вежливое, но настойчивое побуждение. «Прошу, возьми» естественно передаёт это в современном русском и сохраняет прямое значение глагола «взять».
- source_word: כִּכָּרָיִם
  choice: два таланта
  rationale: כִּכָּר — древняя мера веса. Традиционный термин «талант» уместен в библейском тексте; пояснение вынесено в сноску.
- source_word: וַיִּפְרָץ בּוֹ
  choice: Он настойчиво уговаривал его
  rationale: Оборот обозначает сильное давление или настойчивое убеждение. Такой перевод ясен по-русски и не утверждает прямо, было ли согласие достигнуто именно в этот момент.
- source_word: וַיָּצַר ... בִּשְׁנֵי חֲרִטִים
  choice: уложил ... в два мешка
  rationale: וַיָּצַר указывает на связывание или надёжную упаковку, а חֲרִטִים — на вместилища для серебра или ценностей. «Уложил ... в два мешка» естественно описывает действие без излишней конкретизации формы тары.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: две смены одежды
  rationale: Устойчивое выражение означает два комплекта одежды; «две смены одежды» точно и понятно современному читателю.
- source_word: שְׁנֵי נְעָרָיו
  choice: двум своим слугам
  rationale: נַעַר может означать юношу, слугу или сопровождающего. Здесь функция этих людей — служить Нееману и нести груз, поэтому «слуги» лучше всего передаёт контекст.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: Они понесли это впереди него
  rationale: לְפָנָיו буквально означает «перед ним» и здесь описывает слуг, несущих дары впереди Гиезия. «Впереди него» естественно передаёт пространственный смысл; местоименное соотнесение пояснено в сноске.
