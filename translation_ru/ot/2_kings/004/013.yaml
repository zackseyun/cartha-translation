base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: ru
  text: 'И сказал он ему: «Скажи ей, пожалуйста: „Вот, ты так много хлопотала о нас[a]. Что можно сделать для тебя? Не замолвить ли за тебя слово перед царём или военачальником?[b]“» Она ответила: «Я живу среди своего народа».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ты тревожилась о нас всей этой тревогой»; здесь это выражение означает, что она проявила большую заботу и много потрудилась ради них.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также можно передать: «Не нужно ли поговорить ради тебя с царём или военачальником?»'
    reason: lexical_alternative
  - marker: c
    text: Вероятно, ответ означает, что она прочно и безопасно живёт среди своей общины и не нуждается в особом покровительстве царской или военной власти.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: ты так много хлопотала о нас
  rationale: Однокоренные глагол и существительное буквально связаны с трепетом, тревогой и беспокойством, но в контексте гостеприимства описывают усердную заботу и значительные хлопоты женщины. Русское выражение передаёт идиоматический смысл, не сводя его к внутреннему страху.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественное современное средство привлечь внимание к последующему высказыванию; сохраняет функцию еврейской частицы без архаизации.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: Что можно сделать для тебя?
  rationale: Инфинитивная конструкция оставляет исполнителя действия невыраженным и спрашивает, что может быть сделано в её пользу. Такая формулировка естественна по-русски и сохраняет неопределённость субъекта.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: Не замолвить ли за тебя слово
  rationale: Буквально речь идёт о том, чтобы говорить ради неё или в её пользу. Русская идиома ясно передаёт предложение ходатайствовать, не добавляя конкретной просьбы.
- source_word: שַׂר הַצָּבָא
  choice: военачальник
  rationale: Краткое и современное обозначение начальника или командующего войском, соответствующее сочетанию שַׂר с הַצָּבָא.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: Я живу среди своего народа
  rationale: Передаёт буквальный образ укоренённой жизни внутри собственной общины. Возможный прагматический смысл — отсутствие нужды в высоком покровительстве — оставлен для примечания, а не внесён в основной текст.
- source_word: נָא
  choice: пожалуйста
  rationale: Частица смягчает повеление; «пожалуйста» является естественным современным соответствием.
