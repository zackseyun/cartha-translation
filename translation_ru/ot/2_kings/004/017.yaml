  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: ru
  text: И женщина зачала и родила сына в этот назначенный срок[a], в это самое время через год, как и сказал ей Елисей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в этот назначенный срок, во время жизни»; смысл последнего древнееврейского выражения не вполне ясен, но, вероятно, оно указывает на тот же период следующего года.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: зачала
  rationale: Глагол הרה в повествовательной форме означает наступление беременности; «зачала» кратко и естественно передаёт смысл в контексте исполнения обещания.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Слово אִשָּׁה может означать «женщина» или «жена»; здесь речь продолжается о ранее названной сунамитянке, поэтому нейтральное «женщина» точнее сохраняет повествовательную отсылку.
- source_word: וַתֵּלֶד בֵּן
  choice: родила сына
  rationale: Обычное древнееврейское выражение о рождении ребёнка естественно передаётся по-русски как «родила сына».
- source_word: לַמּוֹעֵד הַזֶּה
  choice: в назначенный срок
  rationale: מוֹעֵד обозначает установленное, назначенное время. Русское «в назначенный срок» передаёт как определённость времени, так и связь с прежним обещанием.
- source_word: כָּעֵת חַיָּה
  choice: в это самое время через год
  rationale: Устойчивое выражение в контексте обещанного рождения указывает приблизительно на тот же период следующего года. Ясный идиоматический перевод помещён в текст, а необычная буквальная форма отмечена в сноске.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  choice: как и сказал ей
  rationale: Относительное придаточное подчёркивает соответствие события прежним словам Елисея. Частица «и» естественно выражает это исполнение, не усиливая его сверх смысла оригинала.
- source_word: אֱלִישָׁע
  choice: Елисей
  rationale: Использована устоявшаяся русская библейская форма имени.
