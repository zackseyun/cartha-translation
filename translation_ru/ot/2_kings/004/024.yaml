    text: 'Еврейская фраза содержит буквально: «не задерживай мне ехать верхом». Вероятный смысл: не замедляйся и не останавливайся из-за меня, пока я еду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: Она оседлала ослицу
  rationale: Глагол חבש в данном контексте означает подготовить животное для верховой езды, то есть «оседлать». Существительное אָתוֹן обозначает именно ослицу; по-русски это звучит естественно и сохраняет точность оригинала.
- source_word: נַעֲרָהּ
  choice: своему слуге
  rationale: נַעַר может обозначать юношу, слугу или сопровождающего; здесь контекст указывает на молодого мужчину, исполняющего обязанности слуги. Форма «своему слуге» естественно передаёт его роль.
- source_word: נְהַג וָלֵךְ
  choice: Погоняй и иди вперёд
  rationale: נהג означает гнать или вести животное, а сочетание с הלך выражает настойчивое продолжение движения. «Погоняй и иди вперёд» передаёт и роль слуги, и срочность пути.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: не замедляй ради меня
  rationale: עצר может означать удерживать, задерживать или останавливать. Вместе с לִי לִרְכֹּב фраза означает, что слуга не должен замедлять или прерывать движение из-за всадницы. Краткая формулировка естественна по-русски, а буквальная конструкция отмечена в сноске.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: если только я не скажу тебе
  rationale: 'После запрета כִּי אִם вводит исключение: «если только не», «разве что». Перевод сохраняет условный характер исключения и не уточняет сверх текста, что именно она должна сказать.'
