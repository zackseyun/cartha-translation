  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: ru
  text: 'Она оседлала ослицу и сказала своему слуге: «Гони вперёд; не замедляй хода ради меня[a], если только я не скажу тебе».'
  philosophy: optimal-equivalence
  footnotes:
