  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: ru
  text: 'Теперь скорее беги ей навстречу и скажи ей[a]: «Всё ли хорошо у тебя? Всё ли хорошо у твоего мужа? Всё ли хорошо с ребёнком[b]?» Она ответила: «Всё хорошо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово «шалом», четырежды употреблённое в этом стихе, может означать мир, целостность или благополучие. Здесь речь идёт о благополучии: «Всё ли хорошо?..» — «Всё хорошо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с мальчиком». Еврейское слово «йелед» может означать «ребёнок» или «мальчик».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Передаёт временное наречие, вводящее срочное поручение; в данном контексте естественно звучит по-русски.
- source_word: רוּץ נָא
  choice: беги
  rationale: Императив сохраняет настоятельность поручения. Частица נָא здесь смягчает или усиливает побуждение, но отдельное «пожалуйста» в речи к слуге звучало бы по-русски неестественно.
- source_word: לִקְרָאתָהּ
  choice: ей навстречу
  rationale: Точно и идиоматично передаёт движение навстречу женщине.
- source_word: וֶאֱמָר לָהּ
  choice: и спроси её
  rationale: Буквально «и скажи ей», однако далее следуют прямые вопросы; «спроси её» естественно передаёт речевое действие без изменения содержания.
- source_word: הֲשָׁלוֹם לָךְ / לְאִישֵׁךְ / לַיָּלֶד
  choice: Всё ли хорошо у тебя / у твоего мужа / с ребёнком?
  rationale: שָׁלוֹם в этих вопросах обозначает благополучие. Повтор «Всё ли хорошо» сохраняет риторическую структуру оригинала, а управление слегка варьируется ради естественного русского языка.
- source_word: יֶלֶד
  choice: ребёнок
  rationale: Слово может означать «ребёнок» или «мальчик»; нейтральное «ребёнок» сохраняет лексическую широту, хотя из контекста известно, что это сын.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: 'Она ответила: «Всё хорошо»'
  rationale: Краткое שָׁלוֹם в ответе означает «всё хорошо / всё благополучно». «Ответила» естественнее русского буквального «сказала» после серии вопросов.
