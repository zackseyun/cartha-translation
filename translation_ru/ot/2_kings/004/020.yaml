  yaml_path: translation/ot/2_kings/004/020.yaml
  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: ru
  text: Слуга поднял мальчика и отнёс его к матери. Мальчик сидел у неё на коленях[a] до полудня, а потом умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на руках у матери»; буквально: «на её коленях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: поднял мальчика
  rationale: Глагол נשׂא может означать «поднять, нести». В сочетании со следующим глаголом движения естественно передать начальное действие как «поднял»; местоимение раскрыто словом «мальчика» для ясности по-русски.
- source_word: וַיְבִיאֵהוּ
  choice: отнёс его
  rationale: Порода Hiphil глагола בוא означает «принести, привести». Поскольку слуга несёт больного ребёнка, русское «отнёс» естественно выражает направленное перемещение к матери.
- source_word: אֶל אִמּוֹ
  choice: к матери
  rationale: Прямое и стилистически нейтральное обозначение направления и родственной связи.
- source_word: וַיֵּשֶׁב
  choice: сидел
  rationale: ישׁב здесь обозначает положение ребёнка; несовершенный вид естественно передаёт состояние, продолжавшееся до полудня.
- source_word: עַל בִּרְכֶּיהָ
  choice: у неё на коленях
  rationale: Буквально בִּרְכֶּיהָ — «её колени». Русское выражение «у неё на коленях» сохраняет образ и звучит естественно; возможный смысл «на руках» отмечен в сноске.
- source_word: עַד הַצָּהֳרַיִם
  choice: до полудня
  rationale: צָהֳרַיִם означает полдень; «до полудня» — точная и естественная временная формулировка.
- source_word: וַיָּמֹת
  choice: а потом умер
  rationale: Последовательная форма продвигает повествование. «А потом» ясно передаёт наступление смерти после указанного периода, не вводя дополнительной причинности.
