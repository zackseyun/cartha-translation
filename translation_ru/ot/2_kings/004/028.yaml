  text: וַ/תֹּ֕אמֶר הֲ/שָׁאַ֥לְתִּי בֵ֖ן מֵ/אֵ֣ת אֲדֹנִ֑/י הֲ/לֹ֣א אָמַ֔רְתִּי לֹ֥א תַשְׁלֶ֖ה אֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/028.yaml
  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: ru
  text: 'Она сказала: «Разве я просила у господина моего сына? Разве я не говорила: „Не обманывай меня“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Она сказала
  rationale: Последовательная форма с וַ вводит её реплику; в современном русском начальное «и» здесь необязательно.
- source_word: הֲשָׁאַלְתִּי בֵן
  choice: Разве я просила… сына?
  rationale: Вопросительная частица вводит риторический вопрос; בֵן точно обозначает сына, а не ребёнка вообще.
- source_word: מֵאֵת אֲדֹנִי
  choice: у господина моего
  rationale: Предлог передаёт источник просьбы; «господин мой» — почтительное обращение к Елисею, а не божественный титул. Постпозиция местоимения поддерживает достоинство библейской речи без архаической непонятности.
- source_word: הֲלֹא אָמַרְתִּי
  choice: Разве я не говорила
  rationale: Сохраняется второй риторический вопрос и близкое значение глагола אמר; адресат понятен из контекста.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: Не давай мне ложной надежды
  rationale: В данном контексте Hiphil глагола שלה означает ввести в заблуждение обещанием или ожиданием, которое окажется напрасным. Русская формулировка естественно выражает контекстуальный смысл.
theological_decisions:
- issue: Характер упрёка женщины Елисею
  choice: Не давай мне ложной надежды
  alternative: Не обманывай меня
  rationale: Выбор передаёт не обвинение в намеренной лжи как таковой, а боль от надежды на сына, которая теперь кажется обманутой; при этом богословское напряжение повествования не снимается.
translation_notes:
  register: Современный литературный русский с dignified-библейским оттенком. Два риторических вопроса сохранены; обращение «господина моего» не капитализировано, поскольку относится к Елисею.
