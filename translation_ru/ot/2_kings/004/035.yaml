base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: ru
  text: Потом он вернулся и ходил по дому туда и сюда[a]. Затем он поднялся наверх, наклонился над мальчиком[b], и мальчик чихнул семь раз и открыл глаза.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один раз сюда и один раз сюда»; это выражение описывает движение туда и обратно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «простёрся над ним». Еврейский глагол может обозначать наклон или простирание над кем-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Потом он вернулся
  rationale: Форма от שׁוּב продолжает последовательное повествование и обозначает возвращение Елисея после того, как он отошёл от ребёнка.
- source_word: וַיֵּלֶךְ בַּבַּיִת אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: прошёлся по дому — раз туда и раз сюда
  rationale: Сохраняет движение внутри дома и близко передаёт необычную еврейскую формулу, не усиливая её до эмоционально окрашенного «метался».
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Сохраняет пространственное значение עלה; из контекста ясно, что Елисей возвратился наверх к ребёнку.
- source_word: וַיִּגְהַר עָלָיו
  choice: склонился над мальчиком
  rationale: Глагол גהר означает наклониться или простереться над кем-либо. «Склонился» естественно звучит по-русски и не добавляет отсутствующего в стихе описания механизма чуда.
- source_word: וַיְזוֹרֵר
  choice: чихнул
  rationale: Редкий глагол традиционно и лексически понимается как «чихнуть»; число повторений выражено последующей фразой.
- source_word: הַנַּעַר
  choice: мальчик
  rationale: В данном контексте נַעַר обозначает сына сонамитянки; «мальчик» конкретно и естественно.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: семь раз
  rationale: Хотя עַד буквально может значить «до», при подсчёте повторений сочетание обозначает итоговое число — семь.
- source_word: וַיִּפְקַח הַנַּעַר אֶת עֵינָיו
  choice: и открыл глаза
  rationale: פקח עיניים — обычное сочетание со значением «открыть глаза»; повтор подлежащего в русском необязателен и заменён местоименной связью «тот» ранее в предложении.
theological_decisions:
- issue: Характер действия Елисея над ребёнком
  choice: 'Передать телесное действие описательно: «склонился над мальчиком»'
  alternative: «простёрся над ним» или «лёг на него»
  rationale: Еврейский текст сообщает о позе Елисея, но не объясняет, каким образом произошло чудо. Формулировка не приписывает действию магического или сакраментального механизма.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Необычный образ направления движения сохранён в основном тексте и пояснён сноской; действие Елисея передано без конфессиональной или механистической интерпретации.
