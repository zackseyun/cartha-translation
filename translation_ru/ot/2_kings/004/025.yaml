base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: ru
  text: 'И пошла она, и пришла к человеку Божьему на гору Кармил. Когда человек Божий увидел её издали[a], он сказал своему слуге Гиезию: «Смотри, вон та сунамитянка».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с некоторого расстояния». Еврейское выражение означает, что он увидел её, пока она была ещё поодаль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: И пошла она, и пришла
  rationale: Два последовательных wayyiqtol передают развитие повествования; повтор союзной связи сохраняет еврейскую последовательность и звучит естественно в возвышенной русской прозе.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Прямой перевод устойчивого древнееврейского титула без истолковывающей замены на «пророк».
- source_word: אֶל הַר הַכַּרְמֶל
  choice: на гору Кармил
  rationale: Предлог אֶל выражает направление движения; русское «пришла ... на гору Кармил» ясно и естественно передаёт цель пути.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Когда ... увидел
  rationale: Конструкция вводит временное придаточное; буквальное «и было» в современном русском здесь избыточно.
- source_word: מִנֶּגֶד
  choice: издали
  rationale: В контексте слово указывает, что женщина была замечена на некотором расстоянии; краткое русское наречие точно передаёт этот смысл.
- source_word: נַעֲרוֹ
  choice: своему слуге
  rationale: Хотя буквальное значение связано с «юношей», здесь слово обозначает личного служителя или помощника Елисея.
- source_word: הִנֵּה
  choice: Смотри, вон
  rationale: Сочетание естественно передаёт указательную и привлекающую внимание функцию частицы.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: вон та сунамитянка
  rationale: Сохраняются указание на находящуюся поодаль конкретную женщину и её географическое наименование; форма «сунамитянка» понятна и традиционна в русском библейском регистре.
