base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: ru
  text: Затем он поднялся, лёг на мальчика и приложил свои уста к его устам, свои глаза — к его глазам и свои ладони — к его ладоням. Он простёрся над ним[a], и тело мальчика согрелось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склонился над ним». Еврейский глагол редок и может описывать как наклон, так и положение вытянувшегося над ребёнком человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Затем он поднялся
  rationale: Глагол עלה означает «подниматься». Направление — в верхнюю комнату — ясно из контекста, но в самом стихе не названо, поэтому оно не добавлено.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: лёг на мальчика
  rationale: Передаёт конкретное физическое действие прямо и без архаической тяжеловесности.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: приложил свои уста к его устам
  rationale: Местоимения «свои» и «его» устраняют неизбежную для русского языка неясность принадлежности, сохраняя телесную конкретность и симметрию исходного текста.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: свои глаза — к его глазам
  rationale: Эллиптическая конструкция зависит от глагола «приложил»; тире естественно передаёт пропуск повторяющегося глагола.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: свои ладони — к его ладоням
  rationale: כַּף обозначает ладонь точнее, чем руку вообще; конкретное значение сохранено.
- source_word: וַיִּגְהַר עָלָיו
  choice: Он простёрся над ним
  rationale: Редкий глагол описывает наклонённое или вытянутое над ребёнком положение тела. «Простёрся» хорошо согласуется с предшествующим сопоставлением частей тела, а неоднозначность отмечена в сноске.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: тело мальчика согрелось
  rationale: בָּשָׂר буквально означает «плоть», но в данном телесном описании естественное русское «тело» ясно передаёт смысл; חם обозначает наступление тепла.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: мальчик
  rationale: יֶלֶד может означать ребёнка или мальчика; из повествования известно, что речь идёт о сыне женщины.
theological_decisions:
- issue: Характер действий Елисея над умершим мальчиком
  choice: Конкретно описать положение тела пророка, не объясняя механизм возвращения ребёнка к жизни.
  alternative: Истолковать действие как искусственное дыхание либо смягчить телесные подробности.
  rationale: Еврейский текст подробно сообщает о физических действиях пророка, но не даёт им медицинского или сакраментального объяснения. Перевод сохраняет это напряжение и не вносит позднейших понятий.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Уста» выбрано ради достоинства и ритмической симметрии, тогда как синтаксис и остальные слова остаются понятными современному читателю.
