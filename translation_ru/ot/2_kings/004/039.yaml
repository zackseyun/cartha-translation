base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: ru
  text: Один человек вышел в поле собирать съедобную зелень[a]. Он нашёл дикую лозу[b], набрал с неё диких тыкв — столько, что наполнил ими свой плащ. Вернувшись, он нарезал их прямо в котёл с похлёбкой, ведь они не знали, что это за плоды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «съедобные травы». Еврейское слово имеет широкое значение и обозначает растения, собиравшиеся в поле для еды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лозу поля»; далее — «тыквы поля». Имеются в виду дикорастущая лоза и её плоды, возможно колоквинты.'
    reason: lexical_alternative
  - marker: c
    text: 'Союз можно также перевести: «потому что они не знали» или «так как они не знали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: один из них
  rationale: Числительное употреблено самостоятельно и обозначает одного человека из находившейся там группы; контекстуальное «из них» естественно по-русски.
- source_word: לְלַקֵּט אֹרֹת
  choice: собирать съедобную зелень
  rationale: אֹרֹת — общее обозначение собираемых в поле растений, предназначенных в пищу. «Съедобная зелень» ясно передаёт смысл, не отождествляя растение с конкретным видом.
- source_word: גֶּפֶן שָׂדֶה
  choice: дикую лозу
  rationale: Буквально «лоза поля»; определение указывает на дикорастущую, не возделываемую лозу. «Дикая лоза» естественно передаёт это по-русски.
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: диких тыкв
  rationale: Речь идёт о тыквовидных плодах дикого растения, вероятно колоквинтах. Общее выражение избегает чрезмерно уверенного ботанического отождествления.
- source_word: מְלֹא בִגְדוֹ
  choice: наполнил ими свою одежду
  rationale: 'Сохранён конкретный древнееврейский образ: верхнюю одежду использовали как вместилище для собранных плодов. Перевод не добавляет отсутствующего в тексте упоминания подола.'
- source_word: וַיְפַלַּח
  choice: нарезал их
  rationale: Глагол означает рассекать или разрезать. Местоимение естественно восполняет подразумеваемое дополнение — ранее собранные плоды.
- source_word: סִיר הַנָּזִיד
  choice: котёл с похлёбкой
  rationale: נָזִיד обозначает варёное густое кушанье; «похлёбка» понятно современному читателю и подходит к повествовательному контексту.
- source_word: כִּי לֹא יָדָעוּ
  choice: ведь они не знали, что это за плоды
  rationale: 'כִּי здесь естественно понимать как пояснительное «ведь»: плоды положили в котёл по незнанию. Множественное «они» сохраняет смену единственного числа на множественное в еврейском тексте, а подразумеваемый предмет незнания выражен явно.'
