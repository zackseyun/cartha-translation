- from: Один из них вышел в поле собирать съедобную зелень[a]. Он нашёл дикую лозу[b], набрал с неё диких тыкв и наполнил ими свою одежду. Вернувшись, он нарезал их в котёл с похлёбкой — ведь они не знали, что это за плоды[c].
  to: Один человек вышел в поле собирать съедобную зелень[a]. Он нашёл дикую лозу[b], набрал с неё диких тыкв — столько, что наполнил ими свой плащ. Вернувшись, он нарезал их прямо в котёл с похлёбкой, ведь они не знали, что это за плоды[c].
  rationale: Правка устраняет добавленное «из них» и делает образ наполненного верхнего одеяния естественным для современного русского читателя. «Свой плащ» конкретизирует функцию בֶּגֶד как верхней одежды, которую могли использовать для переноски собранного, не требуя спорного уточнения о поле одежды. Союз «ведь» и примечание сохраняют пояснительную, но не догматически единственную, интерпретацию כִּי.
