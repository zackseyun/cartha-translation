  - severity: medium
    issue: «наполнил ими свою одежду»
    rationale: Хотя выражение сохраняет буквальный образ מְלֹא בִגְדוֹ, в современном русском оно воспринимается как наполнение надетой одежды и звучит неестественно. Упоминание плаща ясно передаёт функцию верхней одежды как переноски и не меняет смысла.
