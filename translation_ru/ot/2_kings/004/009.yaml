base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: ru
  text: 'И сказала она своему мужу: «Вот, я знаю, что это святой человек Божий, который постоянно[a] проходит мимо нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «регулярно».'
    reason: Лексема תָּמִיד в данном контексте может подчёркивать привычную повторяемость, а не непрерывное действие.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: И сказала она
  rationale: Форма wayyiqtol продвигает повествование; русский союз «и» естественно сохраняет последовательность событий.
- source_word: אֶל אִישָׁהּ
  choice: своему мужу
  rationale: В данном семейном контексте אִישׁ с суффиксом 3-го лица женского рода означает именно мужа; возвратное «своему» естественно по-русски при подлежащем «она».
- source_word: הִנֵּה נָא
  choice: Вот
  rationale: Сочетание привлекает внимание собеседника и смягчает обращение. «Вот» передаёт эту дискурсивную функцию без неестественного буквального «вот, пожалуйста».
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект выражает сложившееся, уверенное знание, основанное на повторных наблюдениях.
- source_word: אִישׁ אֱלֹהִים
  choice: человек Божий
  rationale: Устойчивое библейское обозначение пророка или посланника Бога сохранено без пояснительного истолкования.
- source_word: קָדוֹשׁ הוּא
  choice: свят
  rationale: 'Именная конструкция передана как сказуемое, что сохраняет акцент исходного текста: этот человек Божий — свят.'
- source_word: עֹבֵר עָלֵינוּ
  choice: проходит мимо нас
  rationale: В контексте путешествия оборот означает проходить рядом с чьим-либо домом или местом проживания.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Слово обозначает устойчиво повторяющееся действие. Русское «постоянно» допускает здесь привычную повторяемость, а не обязательно непрерывность.
theological_decisions:
- issue: Передача титула אִישׁ אֱלֹהִים
  choice: человек Божий
  alternative: благочестивый человек; человек, принадлежащий Богу
  rationale: «Человек Божий» сохраняет признанный в книгах Царств титул и его литературно-богословскую силу, не сводя его к общей характеристике благочестия.
- issue: Синтаксическая связь קָדוֹשׁ
  choice: предикативное «свят»
  alternative: атрибутивное «святой человек Божий»
  rationale: Еврейская последовательность естественно допускает утверждение «он свят». Предикативная русская конструкция сохраняет этот акцент, не исключая общего смысла «святой человек Божий».
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Порядок слов и краткая форма «свят» сохраняют смысловой акцент оригинала; «Вот» употреблено как естественный знак привлечения внимания.
