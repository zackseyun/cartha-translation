  text: נַֽעֲשֶׂה נָּ֤א עֲלִיַּת קִיר֙ קְטַנָּ֔ה וְ/נָשִׂ֨ים ל֥/וֹ שָׁ֛ם מִטָּ֥ה וְ/שֻׁלְחָ֖ן וְ/כִסֵּ֣א וּ/מְנוֹרָ֑ה וְ/הָיָ֛ה בְּ/בֹא֥/וֹ אֵלֵ֖י/נוּ יָס֥וּר שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: ru
  text: Давай сделаем небольшую верхнюю комнату у стены[a] и поставим там для него кровать, стол, стул и светильник. Когда он будет приходить к нам, пусть останавливается там[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «небольшую верхнюю комнату на стене», «небольшую верхнюю комнату со стеной» или просто «небольшую верхнюю комнату». Еврейское выражение кратко и допускает разные толкования связи комнаты со стеной.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть сворачивает туда». Еврейский глагол означает «свернуть в сторону»; в данном контексте — зайти и остановиться там на ночлег.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: Давай устроим
  rationale: Когортатив первого лица множественного числа с נָא выражает вежливое предложение. В обращении жены к мужу естественное современное соответствие — «давай устроим».
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: небольшую верхнюю комнату у стены
  rationale: עֲלִיָּה — верхняя комната или помещение над нижним этажом; קִיר буквально означает «стена». Формулировка сохраняет конкретный образ и не скрывает компактность и неоднозначность еврейского сочетания.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: и поставим там для него
  rationale: שׂים означает «поставить, поместить». Будущая форма продолжает предложение устроить помещение; «там для него» передаёт и наречие, и косвенное дополнение.
- source_word: מִטָּה
  choice: кровать
  rationale: В контексте предоставления ночлега обычное значение — место для сна, кровать.
- source_word: שֻׁלְחָן
  choice: стол
  rationale: Прямое и естественное соответствие названию предмета обстановки.
- source_word: כִסֵּא
  choice: стул
  rationale: В домашней обстановке «стул» конкретнее и естественнее более общего «сиденье».
- source_word: מְנוֹרָה
  choice: светильник
  rationale: Слово обозначает приспособление для освещения, нередко подставку для лампы. «Светильник» естественно в русском и сохраняет отличие от самой лампы без неуместной ассоциации с храмовой менорой.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: Тогда, когда он будет приходить к нам
  rationale: Оборот вводит ожидаемое последующее обстоятельство. Несовершенный вид «будет приходить» передаёт повторяемость посещений.
- source_word: יָסוּר שָׁמָּה
  choice: он сможет заходить туда
  rationale: סוּר буквально значит «сворачивать, отходить в сторону», а применительно к путнику — зайти или остановиться. «Сможет заходить туда» естественно передаёт возможность пользоваться комнатой, не утверждая длительность пребывания.
