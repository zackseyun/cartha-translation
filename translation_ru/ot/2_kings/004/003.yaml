  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: ru
  text: 'Тогда он сказал: «Пойди, обойди всех соседей и попроси у них для себя пустых сосудов[a]. Не бери слишком мало[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возьми взаймы сосуды». Еврейский глагол может означать более общее «просить», но в данном контексте может подразумевать получение сосудов у соседей во временное пользование.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не уменьши» или «не сделай малым»; то есть не ограничивайся небольшим количеством сосудов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: Пойди
  rationale: Повелительная форма женского рода единственного числа посылает женщину исполнить поручение; «пойди» естественно для современного русского повествования.
- source_word: שַׁאֲלִי
  choice: попроси
  rationale: Глагол может означать как просьбу, так и получение взаймы. «Попроси» сохраняет его смысловую широту, а контекст допускает временное пользование сосудами.
- source_word: לָךְ
  choice: себе
  rationale: Передаёт значение личной заинтересованности и пользы для женщины.
- source_word: כֵּלִים
  choice: сосудов
  rationale: Широкое обозначение предметов или ёмкостей; здесь речь о ёмкостях для масла. «Сосуды» сохраняет широту исходного слова и уместно в литературном библейском повествовании.
- source_word: מִן הַחוּץ
  choice: у всех соседей
  rationale: Буквально «снаружи» указывает на получение сосудов не в собственном доме, а у живущих рядом; в русском отдельное «снаружи» было бы неестественным и избыточным рядом с упоминанием соседей.
- source_word: מֵאֵת כָּל שכנכי
  choice: у всех соседей
  rationale: Естественная русская передача источника, у которого просят предметы; форма обращения к женщине ясна из контекста.
- source_word: כֵּלִים רֵקִים
  choice: пустых сосудов
  rationale: Повтор слова «сосуды» воспроизводит акцент еврейского текста, а прилагательное уточняет, что ёмкости должны быть пустыми.
- source_word: אַל תַּמְעִיטִי
  choice: Бери не мало
  rationale: Кратко и естественно передаёт запрет ограничиваться малым количеством, сохраняя необычную отрицательную формулировку оригинала.
