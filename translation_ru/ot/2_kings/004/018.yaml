  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: ru
  text: Мальчик подрос[a], и однажды[b] он вышел к своему отцу, к жнецам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ребёнок вырос».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и был день»; еврейский повествовательный оборот со значением «однажды» или «в один из дней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: подрос
  rationale: Форма от גדל описывает рост ребёнка. «Подрос» естественно передаёт наступивший этап взросления, не утверждая, что он уже полностью вырос.
- source_word: הַיָּלֶד
  choice: мальчик
  rationale: יֶלֶד может означать как ребёнка вообще, так и мальчика. В данном повествовательном контексте «мальчик» естественно и соответствует мужскому полу персонажа; более нейтральный вариант отмечен в сноске.
- source_word: וַיְהִי הַיּוֹם
  choice: однажды
  rationale: Еврейский повествовательный оборот вводит конкретный день или случай. «Однажды» ясно и естественно передаёт его функцию в современном русском языке.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: יצא обозначает выход или движение наружу; «вышел» сохраняет эту пространственную направленность.
- source_word: אֶל אָבִיו
  choice: к своему отцу
  rationale: 'אֶל указывает направление движения, а суффикс — принадлежность: «к своему отцу».'
- source_word: אֶל הַקֹּצְרִים
  choice: к жнецам
  rationale: קֹצְרִים — люди, срезающие созревший хлеб. «Жнецы» — точный и краткий русский эквивалент; повтор предлога «к» сохраняет структуру исходного текста и показывает, что отец находился среди жнецов.
