base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: ru
  text: 'Когда она пришла к Божьему человеку на гору, то ухватилась за его ноги. Гиезий подошёл, чтобы оттолкнуть её, но Божий человек сказал: «Оставь её, ведь душа её горько страдает[a], а Яхве скрыл это от меня и не сказал мне».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа её горька ей»; еврейское выражение глубокой внутренней скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: Божий человек
  rationale: Буквально передаёт устойчивое еврейское наименование пророка, не заменяя его истолковывающим словом «пророк».
- source_word: אֶל הָהָר
  choice: на гору
  rationale: Предлог אֶל обычно обозначает направление движения; здесь женщина приходит туда, где на горе находится Елисей.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: ухватилась за его ноги
  rationale: חזק с ב обозначает крепко взяться; «ухватилась» естественно передаёт решительность и физический характер действия.
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Краткий и естественный русский эквивалент глагола приближения в повествовательном контексте.
- source_word: לְהָדְפָהּ
  choice: чтобы оттолкнуть её
  rationale: Передаёт целевое значение инфинитива и силовое удаление женщины.
- source_word: הַרְפֵּה לָהּ
  choice: Оставь её
  rationale: Контекстуально означает прекратить вмешательство и не отталкивать женщину.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: душа её исполнена горечи
  rationale: Сохраняет слово נֶפֶשׁ и образ горечи, но выражает глубокое внутреннее страдание естественным литературным русским языком.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הֶעְלִים מִמֶּנִּי
  choice: скрыл это от меня
  rationale: Прямо передаёт каузативную форму עלם; местоимение «это» обозначает не раскрытую пророку причину её горя.
- source_word: וְלֹא הִגִּיד לִי
  choice: и не сказал мне
  rationale: 'Сохраняет параллельное уточнение: Бог не сообщил пророку скрытого обстоятельства.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Антропологический термин נֶפֶשׁ в идиоме страдания
  choice: душа её исполнена горечи
  alternative: ей очень горько
  rationale: Выбранный вариант сохраняет и термин «душа», и метафору горечи, не сводя выражение к нейтральному описанию эмоционального состояния.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; сохранены титул «Божий человек», имя «Яхве» и образ горечи души.
