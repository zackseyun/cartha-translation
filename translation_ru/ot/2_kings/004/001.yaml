source:
  edition: WLC
  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: ru
  text: 'Одна из жён пророческих учеников[a] воззвала к Елисею: «Твой слуга, мой муж, умер. Ты знаешь, что твой слуга боялся Яхве. А заимодавец пришёл, чтобы забрать обоих моих детей[b] себе в рабы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дословно: «из жён сыновей пророков» — так называли членов пророческой общины.'
    reason: Поясняет древнееврейское общественное обозначение и сохраняет его полную буквальную форму без вводящего в заблуждение русского оборота.
  - marker: b
    text: 'Или: «обоих моих сыновей». В еврейском тексте стоит слово «детей».'
    reason: Отмечает допустимое более узкое контекстуальное понимание, не подменяя им более широкое значение исходного слова.
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: Одна женщина
  rationale: Естественно вводит новую участницу повествования и сохраняет неопределённость еврейского выражения, не добавляя отсутствующего в оригинале временного «теперь».
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: из числа жён пророческих учеников
  rationale: Передаёт принадлежность женщины к жёнам членов пророческой общины. Буквальное «жён сыновей пророков» в современном русском может быть ошибочно понято как указание на биологических сыновей; буквальная форма отмечена в сноске.
- source_word: צָעֲקָה
  choice: воззвала
  rationale: Передаёт громкое, настойчивое обращение женщины в бедственном положении и сохраняет достоинство повествовательного стиля.
- source_word: עַבְדְּךָ אִישִׁי
  choice: Твой слуга, мой муж
  rationale: 'Сохраняет порядок и оба отношения, обозначенные в оригинале: умерший был связан с Елисеем как слуга и с говорящей как муж.'
- source_word: מֵת
  choice: умер
  rationale: Прямо и естественно передаёт завершившееся событие, последствия которого определяют нынешнее положение вдовы.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: боялся Яхве
  rationale: Сохраняет устойчивый библейский оборот о благоговейном страхе перед Богом, не сводя его только к почтению.
- source_word: הַנֹּשֶׁה
  choice: заимодавец
  rationale: Точно обозначает человека, которому причитается долг; слово уместно в правовом и долговом контексте.
- source_word: בָּא לָקַחַת
  choice: пришёл, чтобы забрать
  rationale: Сохраняет совершенный вид еврейского глагола и целевое значение инфинитива, подчёркивая непосредственность угрозы.
- source_word: שְׁנֵי יְלָדַי
  choice: обоих моих детей
  rationale: Не сужает значение יְלָדִים до «сыновей», хотя контекст допускает такое понимание; альтернатива дана в сноске.
- source_word: לוֹ לַעֲבָדִים
  choice: себе в рабы
  rationale: Передаёт как присвоение детей заимодавцем, так и их предполагаемый статус долговых рабов, не смягчая עֲבָדִים до домашних работников.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное заветное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Значение выражения «боялся Яхве»
  choice: боялся Яхве
  alternative: почитал Яхве; благоговел перед Яхве
  rationale: 'Буквально и традиционно сохраняет многозначность יָרֵא: страх, благоговение и верность Богу, не сводя выражение к одному оттенку.'
- issue: Статус детей у заимодавца
  choice: рабы
  alternative: слуги
  rationale: Контекст взыскания долга предполагает долговое рабство; «рабы» яснее передаёт серьёзность угрозы, не утверждая сверх текста её продолжительность или конкретные правовые условия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Воззвала» поддерживает эмоциональную силу обращения; остальной синтаксис сделан ясным и естественным. Архаичные или потенциально непонятные буквальные обороты вынесены в сноски.
