base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: ru
  text: 'Когда сосуды наполнились, она сказала сыну: «Подай мне ещё один сосуд». Но он ответил ей: «Других сосудов нет». Тогда масло перестало течь.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «масло остановилось» или «встало»; то есть перестало течь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: когда ... наполнились
  rationale: Инфинитивная конструкция с כִּ выражает время; по-русски естественно передать её придаточным «когда сосуды наполнились».
- source_word: הַכֵּלִים / כֶּלִי
  choice: сосуды / сосуд
  rationale: כְּלִי — широкое обозначение предмета или ёмкости. «Сосуд» сохраняет эту неспецифичность и уместен в контексте масла; «кувшин» было бы излишне конкретно.
- source_word: הַגִּישָׁה
  choice: подай
  rationale: Побудительная форма глагола נגשׁ означает «приблизь, поднеси». Здесь сын передаёт матери очередной сосуд, поэтому естественно «подай».
- source_word: עוֹד
  choice: ещё один / больше
  rationale: При существительном в единственном числе עוֹד обозначает дополнительный сосуд; в ответной реплике та же мысль естественно выражена словами «больше сосудов нет».
- source_word: אֵין עוֹד כֶּלִי
  choice: больше сосудов нет
  rationale: אֵין выражает отсутствие, а עוֹד — отсутствие какого-либо дополнительного сосуда. Русская формулировка кратка и естественна.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: масло перестало течь
  rationale: Буквально עמד означает «стоять, остановиться». В контексте прекратился чудесный поток масла; явное «перестало течь» передаёт подразумеваемый смысл без двусмысленности.
