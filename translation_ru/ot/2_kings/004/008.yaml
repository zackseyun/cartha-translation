base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: ru
  text: Однажды Елисей проходил через Сонам. Там жила знатная женщина[a]. Она настойчиво уговаривала его поесть. И каждый раз, проходя мимо, он заходил туда поесть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «великая женщина»; вероятно, имеется в виду её высокое общественное положение, влияние или достаток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Однажды
  rationale: Естественная русская передача еврейского повествовательного и временного зачина без буквального, но неестественного «и было в тот день».
- source_word: וַיַּעֲבֹר אֶל שׁוּנֵם
  choice: проходил через Сонам
  rationale: В контексте странствия עבר обозначает прохождение через это селение; формулировка также подготавливает упоминание последующих регулярных посещений.
- source_word: שׁוּנֵם
  choice: Сонам
  rationale: Традиционная русская библейская форма данного географического названия.
- source_word: אִשָּׁה גְדוֹלָה
  choice: знатная женщина
  rationale: Здесь גְדוֹלָה, вероятно, указывает на общественное положение и влияние, возможно также на достаток, а не на физический рост или нравственное величие.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: настойчиво пригласила его
  rationale: Буквальный образ «ухватилась/настояла» в контексте выражает настойчивое гостеприимное приглашение; выбранная передача сохраняет силу действия и звучит естественно по-русски.
- source_word: לֶאֱכָל לָחֶם
  choice: поесть
  rationale: Буквально «есть хлеб»; здесь хлеб метонимически обозначает пищу или трапезу вообще. Русское «поесть» естественно передаёт смысл, не сужая его до употребления именно хлеба.
- source_word: מִדֵּי עָבְרוֹ
  choice: когда бы он ни проходил мимо
  rationale: Конструкция обозначает повторяющееся обстоятельство — каждый раз, когда Елисей оказывался поблизости.
- source_word: יָסֻר שָׁמָּה
  choice: он заходил к ней
  rationale: סור выражает отклонение от пути или остановку по дороге; в русском контексте «заходил к ней» ясно передаёт направленность и повторяемость действия.
