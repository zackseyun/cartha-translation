revisions:
- from: Однажды Елисей проходил через Сонам. Там жила знатная женщина[a]. Она настойчиво пригласила его поесть. С тех пор, когда бы он ни проходил мимо, он заходил к ней поесть.
  to: Однажды Елисей проходил через Сонам. Там жила знатная женщина[a]. Она настойчиво уговаривала его поесть. И каждый раз, проходя мимо, он заходил туда поесть.
  rationale: Устранено добавленное значение «с тех пор» и уточнена повторяемость действий. «Туда» воспроизводит пространственную отсылку оригинала, а «настойчиво уговаривала» естественно передаёт силу гостеприимного настояния.
