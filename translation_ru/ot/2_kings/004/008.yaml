    text: 'Буквально: «великая женщина»; вероятно, имеется в виду её высокое общественное положение, влияние или достаток.'
    reason: lexical_alternative
  revision_rationale: Устранено добавленное значение «с тех пор» и уточнена повторяемость действий. «Туда» воспроизводит пространственную отсылку оригинала, а «настойчиво уговаривала» естественно передаёт силу гостеприимного настояния.
