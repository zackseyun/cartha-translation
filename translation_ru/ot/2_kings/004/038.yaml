base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: ru
  text: 'Елисей возвратился в Гилгал, а в стране был голод. Сыны пророков[a] сидели перед ним. Он сказал своему слуге: «Поставь на огонь большой котёл и свари похлёбку для сынов пророков».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ученики пророков»; речь идёт о членах пророческой общины.'
    reason: Лексическая альтернатива поясняет древнееврейское идиоматическое выражение, которое при буквальной передаче может быть непонятно современному читателю.
lexical_decisions:
- source_word: שָׁב
  choice: возвратился
  rationale: Форма глагола שׁוב обозначает возвращение в прежнее место; «возвратился» естественно и точно передаёт это значение.
- source_word: הַגִּלְגָּלָה
  choice: в Галгал
  rationale: Направительный суффикс -ה указывает на движение к названному месту; по-русски это естественно передаётся конструкцией «в Галгал».
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: а в стране был голод
  rationale: Безглагольное предложение задаёт обстоятельственный фон. Союз «а» естественно вводит сопутствующую обстановку, не превращая её в отдельное последующее событие.
- source_word: בְנֵי הַנְּבִיאִים
  choice: сыны пророков
  rationale: Буквально выражение означает «сыны пророков» и обозначает членов пророческой общины, вероятно учеников. Основной текст сохраняет древнееврейский образ, а сноска поясняет его смысл.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: сидели перед ним
  rationale: Причастие описывает продолжающуюся сцену; выражение לְפָנָיו указывает на нахождение перед Елисеем, вероятно в положении учеников перед наставником.
- source_word: לְנַעֲרוֹ
  choice: своему слуге
  rationale: נַעַר может означать юношу, слугу или помощника. В данном контексте человек исполняет поручение, поэтому «слуга» подходит лучше всего.
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  choice: поставь большой котёл
  rationale: Глагол שפת применительно к котлу означает поставить его для приготовления пищи, подразумевая огонь; русская формулировка передаёт это естественно и без лишнего уточнения.
- source_word: וּבַשֵּׁל נָזִיד
  choice: и свари похлёбку
  rationale: בשל означает варить или готовить, а נָזִיד — сваренное жидкое или густое кушанье. «Свари похлёбку» ясно передаёт кулинарное действие и вид блюда.
theological_decisions:
- issue: Передача выражения בְנֵי הַנְּבִיאִים
  choice: сыны пророков
  alternative: ученики пророков; члены пророческой общины
  rationale: Буквальный образ не следует без необходимости сводить к одному институциональному толкованию. Он сохранён в тексте, а вероятный смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Синтаксис сделан ясным для обычного читателя; архаизмы сведены к осмысленно сохранённому выражению «сыны пророков», которое пояснено сноской.
