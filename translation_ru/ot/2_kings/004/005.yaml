  text: וַ/תֵּ֨לֶךְ֙ מֵֽ/אִתּ֔/וֹ וַ/תִּסְגֹּ֣ר הַ/דֶּ֔לֶת בַּעֲדָ֖/הּ וּ/בְעַ֣ד בָּנֶ֑י/הָ הֵ֛ם מַגִּשִׁ֥ים אֵלֶ֖י/הָ וְ/הִ֥יא מיצקת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/005.yaml
  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: ru
  text: Она ушла от него и закрыла дверь за собой и за своими сыновьями. Они подносили ей сосуды[a], а она наливала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они подносили ей»; слово «сосуды» добавлено по контексту предыдущих стихов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Она ушла от него
  rationale: Последовательная форма продвигает повествование, а מֵאִתּוֹ означает физическое удаление от Елисея. «Ушла от него» естественно передаёт оба элемента.
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: и закрыла дверь за собой и за своими сыновьями
  rationale: При глаголе סגר сочетание בְּעַד указывает, что дверь была закрыта за находившимися внутри людьми. Повтор «за собой и за своими сыновьями» сохраняет структуру еврейского текста и звучит естественно по-русски.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: Они подносили ей сосуды
  rationale: Причастие выражает продолжающееся или повторяющееся действие. Прямое дополнение в еврейском тексте не названо, но из ближайшего контекста ясно, что сыновья подносили сосуды; оно добавлено для ясности и отмечено сноской.
- source_word: וְהִיא מיצקת
  choice: а она наливала
  rationale: Причастная форма изображает действие как продолжающееся одновременно с тем, как сыновья подносили сосуды. «Наливала» естественно описывает наполнение сосудов маслом; союз «а» ясно сопоставляет одновременные действия.
