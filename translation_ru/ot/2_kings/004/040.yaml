base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: ru
  text: 'И налили мужчинам, чтобы они ели. Но когда они ели похлёбку, то закричали: «Смерть в котле[a], человек Божий!» И не могли есть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смерть в котле». Вероятно, имеется в виду, что похлёбка была смертельно опасной или ядовитой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: налили
  rationale: Глагол יצק буквально обозначает наливание; выбор сохраняет конкретное действие, не заменяя его более общим «подали».
- source_word: לַאֲנָשִׁים
  choice: мужчинам
  rationale: Существительное אֲנָשִׁים здесь обозначает собравшихся мужчин; перевод сохраняет выраженное в источнике указание на пол.
- source_word: לֶאֱכֹל
  choice: чтобы они ели
  rationale: Инфинитив передаёт цель действия; придаточная конструкция естественна для современного русского языка.
- source_word: כְּאָכְלָם מֵהַנָּזִיד
  choice: когда они стали есть похлёбку
  rationale: Конструкция указывает на происходившее во время еды, а נָזִיד означает варёное блюдо, похлёбку или густой суп. «Стали есть» естественно передаёт момент обнаружения опасности.
- source_word: צָעָקוּ
  choice: закричали
  rationale: Глагол выражает громкий, тревожный крик.
- source_word: מָוֶת בַּסִּיר
  choice: Смерть в котле
  rationale: Сохранён яркий буквальный образ еврейского текста, вероятно означающий, что пища смертельно опасна или ядовита.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устойчивое и понятное русское обозначение пророка; в данном контексте это прямое обращение к Елисею.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: И не могли есть
  rationale: Перевод следует краткой формулировке источника и не добавляет отсутствующее прямое дополнение.
