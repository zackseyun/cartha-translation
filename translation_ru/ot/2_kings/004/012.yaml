  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: ru
  text: 'Тогда он сказал своему слуге Гиезию: «Позови эту сунамитянку». Гиезий позвал её, и она встала перед Елисеем.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда он сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: גֵּחֲזִי
  choice: Гиезию
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени.
- source_word: נַעֲרוֹ
  choice: своему слуге
  rationale: Слово נַעַר может обозначать юношу, слугу или помощника; здесь контекст подчёркивает служебное положение Гиезия при Елисее.
- source_word: קְרָא
  choice: Позови
  rationale: В данном контексте קרא означает позвать человека к себе; «позови» звучит естественно и не придаёт приказу излишней официальности.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: эту сунамитянку
  rationale: Форма «сунамитянка» естественно обозначает женщину из Сунама и прямо передаёт указательное הַזֹּאת — «эту».
- source_word: וַיִּקְרָא לָהּ
  choice: Тот позвал её
  rationale: Повтор корня קרא сохранён. Местоимение «тот» ясно показывает, что приказ исполнил Гиезий, не утяжеляя фразу повтором имени.
- source_word: וַתַּעֲמֹד
  choice: и она встала
  rationale: Глагол עמד прямо означает «стоять, встать»; перевод не добавляет не выраженного в еврейском тексте движения.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Буквально и естественно передаёт пространственное значение выражения, сохраняя местоименную форму исходного текста.
