lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: И он сказал своему отцу
  rationale: Глагол אמר обычно означает «сказать»; повторённое восклицание само передаёт остроту страдания, поэтому добавлять «закричал» не требуется.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: Голова моя! Голова моя!
  rationale: Буквальное повторение сохраняет краткость и эмоциональную силу еврейской речи, не добавляя отсутствующего в тексте глагола «болит».
- source_word: וַיֹּאמֶר
  choice: Тогда отец сказал
  rationale: Последовательная глагольная форма продвигает повествование. Явное «отец» естественно устраняет возможную для русского местоимения неясность и соответствует ближайшему названному деятелю.
- source_word: אֶל הַנַּעַר
  choice: слуге
  rationale: נַעַר может обозначать юношу, мальчика или слугу. В данном контексте это сопровождающий подчинённый, способный нести ребёнка, поэтому «слуга» звучит естественно; возрастная альтернатива отмечена в сноске.
- source_word: שָׂאֵהוּ
  choice: Отнеси его
  rationale: Императив נשׂא с местоименным дополнением здесь означает физически понести ребёнка; «отнеси» также естественно передаёт указанное направление.
- source_word: אֶל אִמּוֹ
  choice: к матери
  rationale: Естественная передача простого термина родства в современном литературном русском языке.
