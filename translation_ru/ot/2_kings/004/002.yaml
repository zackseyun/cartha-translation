  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: ru
  text: 'И Елисей сказал ей: «Что мне сделать для тебя? Скажи мне, что есть у тебя в доме?» Она ответила: «У твоей служанки нет в доме ничего, кроме небольшого сосуда с маслом[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кувшин с маслом» или «небольшой флакон масла»; еврейское слово אָסוּךְ обозначает небольшой сосуд для масла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: Что мне сделать для тебя?
  rationale: Передаёт вопрос о том, какое действие Елисей должен предпринять ради неё, сохраняя совещательный оттенок формы глагола и естественное русское выражение.
- source_word: הַגִּידִי לִי
  choice: Скажи мне
  rationale: Прямо передаёт повелительную форму без добавления отсутствующего в еврейском тексте слова «пожалуйста».
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: что есть у тебя в доме?
  rationale: Сохраняет экзистенциальную конструкцию и конкретную домашнюю обстановку; по-русски звучит естественно.
- source_word: לְשִׁפְחָתְךָ
  choice: у твоей служанки
  rationale: Передаёт женский род שִׁפְחָה и почтительное самообозначение женщины при обращении к Елисею, не прибегая к архаичному «раба твоя».
- source_word: אֵין ... כֹל
  choice: нет ... ничего
  rationale: Естественная русская отрицательная конструкция полностью передаёт абсолютное отсутствие; дополнительный усилитель «совсем» не требуется.
- source_word: כִּי אִם
  choice: кроме
  rationale: Ясно вводит единственное исключение из предшествующего отрицания.
- source_word: אָסוּךְ שָׁמֶן
  choice: небольшой сосуд с маслом
  rationale: Редкое слово אָסוּךְ обозначает сосуд для масла, вероятно небольшой; «сосуд» не навязывает неизвестную точную форму, а примечание сохраняет допустимые варианты.
