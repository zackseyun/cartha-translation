  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: ru
  text: 'Тогда Елисей позвал Гиезия и сказал: «Позови эту сонамитянку[a]». Гиезий позвал её, и она подошла к Елисею. Тогда Елисей сказал: «Возьми своего сына».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эту женщину из Сунема». В еврейском тексте употреблено название жительницы Сунема в женском роде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: Тогда Елисей позвал Гиезия
  rationale: Последовательная глагольная форма продолжает повествование; «тогда» естественно передаёт ход событий. Имя Елисея, подразумеваемое контекстом, названо для ясности смены действующих лиц.
- source_word: קְרָא
  choice: позови
  rationale: Императив קרא здесь означает позвать женщину к пророку; «позови» звучит естественно и не добавляет официального оттенка слова «призови».
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: эту сонамитянку
  rationale: Сохранены указательное местоимение и женская форма названия жительницы Сунема. Традиционная русская форма «сонамитянка» кратка и точна.
- source_word: וַיִּקְרָאֶהָ
  choice: Гиезий позвал её
  rationale: Повтор глагола קרא сохранён, поскольку текст прямо сообщает об исполнении приказа. Имя названо вместо неоднозначного русского местоимения.
- source_word: וַתָּבֹא אֵלָיו
  choice: она подошла к Елисею
  rationale: Сочетание בוא с אֶל обозначает приближение к человеку. «Подошла» естественно передаёт движение к Елисею без неподтверждённого предположения о входе в помещение.
- source_word: שְׂאִי בְנֵךְ
  choice: Возьми своего сына
  rationale: Женская форма императива נשׂא обращена к матери и в данном контексте означает взять поднятого из мёртвых сына. «Сына» сохраняет конкретное значение בֵּן.
