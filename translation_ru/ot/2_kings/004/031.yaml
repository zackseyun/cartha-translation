  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: ru
  text: 'Гиезий пошёл впереди них и положил посох на лицо мальчика, но не было ни звука, ни отклика.[a] Тогда он вернулся навстречу Елисею и сообщил ему: «Мальчик не проснулся».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не было ни голоса, ни внимания (или слышания)».'
    reason: Лексическое примечание сохраняет более буквальные значения קוֹל и редкого קָשֶׁב, тогда как основной текст естественно передаёт их смысл в данном контексте.
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: пошёл вперёд, опередив их
  rationale: Передаёт движение Гиезия впереди Елисея и женщины естественным современным русским языком.
- source_word: הַמִּשְׁעֶנֶת
  choice: посох
  rationale: В данном повествовании это наиболее ясное и традиционно понятное обозначение принадлежавшего пророку посоха.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: на лицо мальчика
  rationale: Сохраняет конкретное значение פָּנִים и передаёт נַעַר подходящим по контексту словом «мальчик».
- source_word: וְאֵין קוֹל וְאֵין קָשֶׁב
  choice: не было ни звука, ни отклика
  rationale: «Звук» прямо передаёт קוֹל, а «отклик» естественно выражает контекстуальный смысл редкого קָשֶׁב — отсутствие слышимой или воспринимаемой реакции, не превращая фразу в более широкое «не было признаков жизни».
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: вернулся навстречу Елисею
  rationale: Передаёт обратное движение Гиезия для встречи; имя заменяет ясное из контекста местоимение и устраняет неестественную для русского языка референциальную неясность.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: сообщил ему
  rationale: Естественно передаёт еврейскую формулу введения прямой речи; отдельное «сказав» в современном русском было бы избыточно.
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: Мальчик не проснулся
  rationale: Прямо и естественно передаёт глагол הֵקִיץ «проснуться, пробудиться», не вводя более интерпретирующее «не ожил».
theological_decisions:
- issue: Характер состояния мальчика в заключительных словах Гиезия
  choice: «Мальчик не проснулся»
  alternative: «Мальчик не ожил» / «Мальчик не очнулся»
  rationale: Исходный глагол буквально говорит о пробуждении. Перевод сохраняет образ сна и не разрешает богословское и повествовательное напряжение более прямым утверждением об оживлении.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное, без архаизмов. Формула прямой речи передана естественно, а конкретные детали исходного текста сохранены.
