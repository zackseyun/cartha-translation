  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: ru
  text: 'Он спросил: «Зачем ты идёшь к нему сегодня? Ведь не новомесячье и не суббота». Она ответила: «Всё хорошо»[a].'
