lexical_decisions:
- source_word: מַדּוּעַ
  choice: Зачем
  rationale: В данном вопросе речь идёт о цели или причине поездки; «зачем» естественно передаёт смысл в современном русском контексте.
- source_word: אתי הלכתי
  choice: ты едешь
  rationale: Нерегулярная форма по контексту обращена к женщине в единственном числе и описывает намеченную немедленную поездку.
- source_word: אֵלָיו
  choice: к нему
  rationale: Местоимение относится к Елисею, но перевод сохраняет местоименную форму оригинала, не вводя имя явно.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Естественный современный русский эквивалент обстоятельства времени.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: сегодня не новомесячье и не суббота
  rationale: 'Конструкция объясняет недоумение мужа: день не относится к обычным священным случаям посещения пророка. Добавленное по-русски «сегодня» ясно связывает фразу с предыдущим вопросом.'
- source_word: חֹדֶשׁ
  choice: новомесячье
  rationale: В календарно-культовом контексте слово обозначает праздник нового месяца, а не просто месяц.
- source_word: שַׁבָּת
  choice: суббота
  rationale: Общепринятое библейское обозначение израильского священного дня покоя.
- source_word: שָׁלוֹם
  choice: Всё хорошо
  rationale: Буквально существительное означает «мир», но в кратком ответе идиоматически выражает заверение, что всё благополучно. Буквальная форма сохранена в примечании.
