  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: ru
  text: 'Тогда мать мальчика сказала: «Клянусь жизнью Яхве и твоей жизнью[a]: я не оставлю тебя!» Он встал и пошёл за ней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская формула клятвы буквально: «Жив Яхве и жива жизнь твоя». Здесь «жизнь» означает самого человека: «Как несомненно жив Яхве и жив ты». Следующее еврейское «если оставлю тебя» — сокращённая формула самопроклятия, то есть решительное обещание не оставить.'
    reason: Разъясняет значение еврейской клятвенной формулы, включая идиоматическое употребление «жизни» и подразумеваемое отрицание после «если».
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: мать мальчика
  rationale: Естественно передаёт конструкцию принадлежности «мать мальчика», сохраняя конкретное обозначение женщины в данном контексте.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Жив Яхве и жива душа твоя
  rationale: Сохранена традиционная семитская формула клятвы и буквальный образ נֶפֶשׁ — «душа, жизнь». В современном русском выражение звучит возвышенно, но остаётся понятным; примечание разъясняет его смысл.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: не оставлю тебя
  rationale: После клятвенной формулы אִם вводит подразумеваемое самопроклятие и по смыслу выражает решительное отрицание. Буквальное «если оставлю тебя» без восполнения было бы в русском неясным.
- source_word: וַיָּקָם
  choice: он встал
  rationale: Прямо и естественно передаёт последовательное повествовательное действие; местоимение относится к Елисею, названному в предшествующем контексте.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: пошёл за ней
  rationale: Сохраняет пространственный образ еврейского выражения и естественно означает, что он последовал за женщиной.
theological_decisions:
- issue: Передача личного имени יהוה в формуле клятвы
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога, а не титул. Транслитерация «Яхве» сохраняет это различие и не добавляет конфессионального толкования.
- issue: Смысл оборота אִם אֶעֶזְבֶךָּ после клятвы
  choice: не оставлю тебя
  alternative: если оставлю тебя
  rationale: Формально условное выражение представляет собой сокращённую клятвенную формулу с подразумеваемым наказанием. Прямое отрицание передаёт её действительный смысл, не уточняя намеренно опущенное последствие.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным звучанием. Формула «жива душа твоя» намеренно сохранена как образное и богословски ненагруженное отражение оригинала; её идиоматический смысл раскрыт в примечании.
