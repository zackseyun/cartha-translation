source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לְ/גֵיחֲזִ֜י חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ/קַ֨ח מִשְׁעַנְתִּ֣/י בְ/יָדְ/ךָ֮ וָ/לֵךְ֒ כִּֽי תִמְצָ֥א אִישׁ֙ לֹ֣א תְבָרְכֶ֔/נּוּ וְ/כִֽי יְבָרֶכְ/ךָ֥ אִ֖ישׁ לֹ֣א תַעֲנֶ/נּ֑וּ וְ/שַׂמְתָּ֥ מִשְׁעַנְתִּ֖/י עַל פְּנֵ֥י הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: ru
  text: 'И сказал он Гиези: «Подбери одежду за пояс[a], возьми в руку мой посох и иди. Если встретишь кого-нибудь[c], не приветствуй его; и если кто-нибудь приветствует тебя, не отвечай ему[b]. Положи мой посох на лицо мальчика».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «опояшь свои бёдра» — выражение, означающее приготовиться и без промедления приступить к делу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не благословляй его» / «если кто-нибудь благословит тебя». Здесь глагол, вероятно, означает обмен приветствиями в дороге.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «человека»; в данном контексте слово имеет обобщённое значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Подбери одежду за пояс
  rationale: Буквально «опояшь свои бёдра». В контексте это повеление подобрать и закрепить длинную одежду, чтобы без промедления отправиться в путь; выбранная формулировка передаёт конкретное действие и срочность без архаизма.
- source_word: מִשְׁעַנְתִּי
  choice: мой посох
  rationale: Существительное обозначает посох или предмет, на который опираются. «Посох» естественно звучит в повествовании и соответствует предмету, который затем кладут на ребёнка.
- source_word: וָלֵךְ
  choice: и иди
  rationale: Прямое повеление двигаться в путь; союз сохраняет последовательность кратких приказаний.
- source_word: כִּי תִמְצָא אִישׁ
  choice: Если встретишь кого-нибудь
  rationale: 'אִישׁ буквально означает «мужчина, человек», но здесь имеет обобщённое значение: любой встреченный в дороге человек.'
- source_word: לֹא תְבָרְכֶנּוּ
  choice: не приветствуй его
  rationale: ברך буквально связано с благословением, однако при встрече может обозначать приветствие. Дорожный контекст и параллельная ответная реплика указывают на обмен приветствиями.
- source_word: וְכִי יְבָרֶכְךָ אִישׁ
  choice: и если кто-нибудь приветствует тебя
  rationale: Тот же глагол передан последовательно как «приветствует»; אִישׁ вновь употреблено обобщённо.
- source_word: לֹא תַעֲנֶנּוּ
  choice: не отвечай ему
  rationale: ענה здесь означает ответить или откликнуться. Краткая формулировка сохраняет настойчивость приказа.
- source_word: וְשַׂמְתָּ ... עַל פְּנֵי הַנָּעַר
  choice: Положи мой посох на лицо мальчика
  rationale: שׂים означает «положить, поместить», а עַל־פְּנֵי буквально — «на лицо». Начало нового русского предложения естественно передаёт очередное повеление без добавления отсутствующего в еврейском тексте временного наречия.
- source_word: הַנָּעַר
  choice: мальчика
  rationale: נַעַר может обозначать мальчика, юношу или слугу; в данном контексте речь идёт о сыне сонамитянки, поэтому «мальчик» ясно и уместно.
