  source_fidelity: 'В целом структура стиха передана верно: обращение к мужу, вежливая просьба, один из слуг/юношей, одна ослица, цель поездки к человеку Божьему и возвращение. Однако «пришли ко мне» означает скорее «направь ко мне», тогда как לִי здесь естественнее передать русским дательным «пришли мне» в значении «предоставь/пошли мне». «Поскорее отправилась» допустимо по смыслу, но ослабляет конкретный глагол רוץ («бежать») сильнее, чем необходимо; «поспешила» естественно и сохраняет срочность.'
