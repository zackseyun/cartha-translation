    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: Тогда она позвала своего мужа
  rationale: Последовательная повествовательная форма передана естественным русским «тогда»; אִישׁ с суффиксом в семейном контексте означает мужа.
- source_word: שִׁלְחָה נָא לִי
  choice: Пожалуйста, пришли ко мне
  rationale: Императив с נָא выражает вежливую просьбу; «ко мне» естественно передаёт значение заинтересованного лица.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: одного из слуг
  rationale: נַעַר может означать юношу, слугу или помощника; в контексте поездки речь, вероятнее всего, о домашнем слуге, который будет сопровождать женщину.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: и одну из ослиц
  rationale: אָתוֹן — существительное, специально обозначающее ослицу; форма «одну из» сохраняет партитивную конструкцию.
- source_word: וְאָרוּצָה
  choice: чтобы я поскорее отправилась
  rationale: Когортатив после просьбы передаёт цель и намерение; буквальное «побежала» применительно к поездке на ослице неестественно по-русски, тогда как «поскорее отправилась» сохраняет оттенок срочности.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: к человеку Божьему
  rationale: При глаголе движения עַד обозначает конечный пункт; традиционный титул אִישׁ הָאֱלֹהִים сохранён буквально.
- source_word: וְאָשׁוּבָה
  choice: и вернулась
  rationale: Когортатив продолжает выражать намеченное действие; совершенный вид естественно обозначает завершение предполагаемой поездки.
