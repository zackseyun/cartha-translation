  terminology: «Человек Божий» точно сохраняет исходный титул אִישׁ הָאֱלֹהִים. «Ослица» передаёт специально женский род אָתוֹן. «Слуг» является контекстуально возможным переводом נְעָרִים; термин не требует изменения.
