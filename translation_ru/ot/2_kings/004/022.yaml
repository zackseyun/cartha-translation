  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: ru
  text: 'Тогда она позвала своего мужа и сказала: «Пожалуйста, пришли мне одного из слуг и одну из ослиц, чтобы я поспешила[a] к человеку Божьему и вернулась».'
  philosophy: optimal-equivalence
  footnotes:
