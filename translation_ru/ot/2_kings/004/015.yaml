lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда он сказал
  rationale: Последовательная форма глагола אמר продолжает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: קְרָא לָהּ
  choice: Позови её
  rationale: Императив קרא в данном контексте означает простой приказ позвать женщину; «позови» естественнее и нейтральнее, чем более официальное «призови».
- source_word: וַיִּקְרָא לָהּ
  choice: Тот позвал её
  rationale: Форма продолжает последовательность действий. Указательное местоимение «тот» помогает различить говорящего и исполнителя приказа, не добавляя имени, отсутствующего в стихе.
- source_word: וַתַּעֲמֹד
  choice: и она встала
  rationale: עמד означает «стоять, встать, занять место». Перевод не добавляет отсутствующего в еврейском тексте глагола движения «подошла».
- source_word: בַּפָּתַח
  choice: в дверях
  rationale: פתח обозначает дверной проём или вход. «В дверях» — естественное современное русское выражение, передающее положение женщины у порога; возможная передача «у входа» отмечена в сноске.
