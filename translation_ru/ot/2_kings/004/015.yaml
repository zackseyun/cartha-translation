  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: ru
  text: 'Тогда он сказал: «Позови её». Он позвал её, и она встала в дверях[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у входа». Еврейское слово может обозначать дверной проём или место у входа.'
