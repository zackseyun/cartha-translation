  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: ru
  text: Затем она поднялась, положила его на постель человека Божьего, закрыла дверь, оставив его внутри[a], и вышла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
