    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: поднялась
  rationale: Глагол עלה обозначает движение вверх; по контексту женщина поднялась в верхнюю комнату.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: положила его
  rationale: Каузативная форма от שׁכב означает, что она уложила мальчика; «положила» естественно передаёт физическое действие в данном контексте.
- source_word: מִטַּת
  choice: постель
  rationale: מִטָּה означает кровать или место для сна; «постель» звучит естественно и достойно в русском повествовании.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человека Божьего
  rationale: Сохранён буквальный и устойчивый древнееврейский титул без истолковывающей замены на «пророка».
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: закрыла дверь, оставив его внутри
  rationale: Сочетание סגר с בְּעַד указывает на закрывание входа так, что названное лицо остаётся внутри. Такой перевод ясно выражает смысл и избегает русского оборота «закрыла за ним дверь», который обычно предполагает, что человек сам прошёл через дверь.
- source_word: וַתֵּצֵא
  choice: и вышла
  rationale: יצא прямо обозначает выход; краткая форма сохраняет последовательность действий.
