lexical_decisions:
- source_word: וַיָּבֹא אֱלִישָׁע הַבָּיְתָה
  choice: Елисей вошёл в дом
  rationale: Глагол בוא с направительным ה у существительного הַבָּיְתָה обозначает движение внутрь дома. «Вошёл в дом» естественно и точно передаёт это значение по-русски.
- source_word: וְהִנֵּה
  choice: '— и вот:'
  rationale: Оборот הִנֵּה ярко представляет увиденную Елисеем картину и привлекает к ней внимание. «И вот» сохраняет эту повествовательную функцию без излишней архаизации.
- source_word: הַנַּעַר
  choice: мальчик
  rationale: В данном контексте נַעַר обозначает сына сонамитянки; «мальчик» — наиболее ясное и естественное контекстуальное соответствие.
- source_word: מֵת
  choice: мёртв
  rationale: Форма описывает состояние мальчика в момент прихода Елисея, а не просто предшествующее событие его смерти.
- source_word: מֻשְׁכָּב
  choice: положен
  rationale: 'Пассивное причастие передаёт результирующее состояние: мальчика положили на постель, и он находится там. «Положен» сохраняет пассивный оттенок формы.'
- source_word: עַל מִטָּתוֹ
  choice: на его постели
  rationale: Прямое и естественное соответствие предложной группе; местоименный суффикс мужского рода передан словом «его».
