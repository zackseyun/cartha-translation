  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: ru
  text: 'Она пришла и рассказала человеку Божьему. Он сказал: «Пойди, продай масло, уплати свои долги[a], а ты и твои сыновья будете жить на то, что останется[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уплати своему кредитору», если эта форма относится к тому, кому она должна, а не к самим долгам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а ты и твои сыновья будешь жить оставшимся». В еврейском тексте глагол стоит в женском роде единственного числа и обращён прежде всего к женщине.'
    reason: literal_rendering
lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: Она пришла и рассказала
  rationale: Последовательные формы wayyiqtol продвигают повествование. В русском связь действий естественно передаётся без обязательного повторения союза «и» перед первым сказуемым.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: человеку Божьему
  rationale: Сохранён буквальный и устойчивый библейский титул, а не подставлено толкование «пророку».
- source_word: לְכִי מִכְרִי אֶת־הַשֶּׁמֶן
  choice: Пойди продай масло
  rationale: Два повелительных глагола женского рода переданы естественной русской конструкцией; вид масла не уточняется, поскольку в еврейском тексте этого нет.
- source_word: וְשַׁלְּמִי אֶת־נִשְׁיֵךְ
  choice: расплатись со своими долгами
  rationale: В финансовом контексте שלם означает уплатить или погасить задолженность. Множественное «долгами» отражает форму источника; возможное отнесение слова к кредитору отмечено в сноске.
- source_word: וְאַתְּ וּבָנַיִךְ
  choice: ты и твои сыновья
  rationale: Сохранено прямое указание на сыновей, без обобщения до «детей».
- source_word: תִּחְיִי בַּנּוֹתָר
  choice: будете жить на то, что останется
  rationale: Русское выражение «жить на что-либо» естественно передаёт содержание жизни за счёт остатка; будущее время сохраняет незавершённую глагольную форму в данном контексте.
