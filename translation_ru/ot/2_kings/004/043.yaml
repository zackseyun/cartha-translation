  source_fidelity: 'Основной смысл передан верно: слуга выражает сомнение в возможности подать имеющуюся пищу ста людям, а Елисей велит отдать её народу, основываясь на слове Яхве о том, что пищи хватит с остатком. «Яхве» точно передаёт тетраграмматон. Однако сноска a называет буквальным неудачно сконструированное русское предложение и добавляет характеристику «столь малое количество еды», которая не выражена в самом стихе.'
