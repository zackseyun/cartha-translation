  terminology: «Слуга», «люди», «Яхве» и пророческая формула «ибо так говорит Яхве» соответствуют контексту и регистру. «Будут есть, и останется» естественно передаёт уверенное обещание, не добавляя к тексту лишнего слова «ещё».
