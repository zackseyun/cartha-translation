source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מְשָׁ֣רְת֔/וֹ מָ֚ה אֶתֵּ֣ן זֶ֔ה לִ/פְנֵ֖י מֵ֣אָה אִ֑ישׁ וַ/יֹּ֗אמֶר תֵּ֤ן לָ/עָם֙ וְ/יֹאכֵ֔לוּ כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָכֹ֥ל וְ/הוֹתֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: ru
  text: 'Но его слуга сказал[a]: «Как мне поставить это перед ста людьми?» Елисей ответил: «Дай это людям, пусть едят[b], ибо так говорит Яхве: „Будут есть, и останется“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально передаёт необычный оборот: «Что мне дать (поставить) перед ста людьми?» То есть: «Как мне подать это ста людям?»'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение буквально: «есть и оставлять»; смысл в том, что после еды часть пищи останется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: слуга его
  rationale: מְשָׁרֵת обозначает человека, состоящего при ком-либо и служащего ему. «Слуга» естественно передаёт подчинённое положение персонажа при Елисее; постпозиция местоимения поддерживает возвышенный повествовательный регистр.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: Как мне поставить это перед сотней человек?
  rationale: 'Буквальная конструкция необычна: «Что [же] я дам/поставлю это перед сотней человек?» В контексте речь о подаче еды. «Поставить это перед» сохраняет конкретный образ לִפְנֵי и передаёт недоумение слуги, не усиливая его до прямого утверждения невозможности.'
- source_word: מֵאָה אִישׁ
  choice: сотней человек
  rationale: После числительного אִישׁ употреблено дистрибутивно. Русское «сто человек» — нормативное и точное обозначение группы; после предлога «перед» естественна форма «сотней человек».
- source_word: תֵּן לָעָם
  choice: Дай людям
  rationale: עָם обозначает собравшийся народ или группу как целое. «Людям» естественно в данном контексте и отражает переход исходного текста от אִישׁ к коллективному עָם.
- source_word: וְיֹאכֵלוּ
  choice: пусть едят
  rationale: Префиксальная форма после повеления выражает желаемое или последующее действие. «Пусть едят» сохраняет побудительную силу и звучит естественно по-русски.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: ибо так говорит Яхве
  rationale: Сохранена узнаваемая пророческая формула. Прошедшая форма אָמַר в формуле естественно передаётся русским настоящим «говорит», подчёркивающим актуальность провозглашаемого слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, стоящее непосредственно в еврейском тексте, без замены титулом.
- source_word: אָכֹל וְהוֹתֵר
  choice: Будут есть, и ещё останется
  rationale: 'Сочетание инфинитивных форм выражает уверенный результат: люди поедят, но пища не исчерпается. Безличное «ещё останется» естественно подразумевает оставшуюся пищу и не вводит отсутствующего в еврейском тексте существительного.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблён тетраграмматон как личное имя. «Яхве» сохраняет это различие, тогда как «Господь» передаёт традиционную замену имени титулом.
- issue: Характер обещания אָכֹל וְהוֹתֵר
  choice: Будут есть, и ещё останется
  alternative: Пусть едят и оставляют
  rationale: В контексте это не второе повеление людям беречь остаток, а пророческое заверение о достатке пищи. При этом перевод не уточняет способ совершения чуда сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для широкого читателя; пророческая формула передана торжественно, но без архаизмов. Все сноски отмечены в основном тексте.
