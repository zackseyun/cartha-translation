base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: ru
  text: 'И пришёл человек из Баал-Шалиши и принёс человеку Божьему хлеб из первых плодов — двадцать ячменных хлебов, а также свежее зерно[a] в своей суме[b]. Он сказал: «Раздай это людям, пусть едят».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «поджаренное зерно». Еврейское слово может обозначать зерно, подготовленное для еды, а не просто свежее зерно.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово встречается редко, и его точное значение неясно; оно может обозначать мешок, обёртку или, возможно, зерно в шелухе.
    reason: lexical_alternative
