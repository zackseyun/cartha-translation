  rationale: Редкое слово, вероятно, обозначает суму, мешок или иную упаковку; в основном тексте выбран ясный контекстуальный эквивалент, а неопределённость отмечена в сноске.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: Раздай это людям, пусть едят
  rationale: Императив и последующая глагольная форма переданы естественной русской конструкцией, сохраняющей значение повеления и предполагаемого результата.
