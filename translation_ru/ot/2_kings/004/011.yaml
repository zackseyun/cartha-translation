  yaml_path: translation/ot/2_kings/004/011.yaml
  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: ru
  text: Однажды он пришёл туда, зашёл в верхнюю комнату и лёг там.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Однажды
  rationale: Еврейская повествовательная формула вводит конкретный случай; «однажды» естественно передаёт её временной смысл в современном русском языке.
- source_word: וַיָּבֹא שָׁמָּה
  choice: он пришёл туда
  rationale: בוא обычно означает «приходить, входить», а שָׁמָּה — «туда, там»; перевод сохраняет направление движения и повтор пространственного указания.
- source_word: וַיָּסַר אֶל הָעֲלִיָּה
  choice: зашёл в верхнюю комнату
  rationale: סור здесь обозначает отклонение от пути с заходом в приготовленное помещение, а עֲלִיָּה — комнату верхнего этажа. «Зашёл» естественно выражает это действие по-русски без излишней буквальности.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: и лёг там
  rationale: שׁכב может означать «лечь», «лежать» или в контексте «спать». Нейтральное «лёг» сохраняет непосредственное значение и не уточняет, что он заснул.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткое повествовательное предложение с сохранением повторного «там», соответствующего двукратному שָׁמָּה. Лексическая неоднозначность שׁכב сохранена в основном тексте нейтральным глаголом «лёг», поэтому сноска не требуется.
