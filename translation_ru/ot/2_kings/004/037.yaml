  yaml_path: translation/ot/2_kings/004/037.yaml
  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: ru
  text: Она вошла, пала к его ногам и поклонилась до земли[a]. Затем она подняла сына и вышла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрлась ниц»; еврейский глагол в некоторых контекстах может означать поклонение, но здесь, вероятнее всего, описывает глубокое почтение к Елисею.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Она вошла
  rationale: Глагол בוא в данном контексте обозначает вход в помещение; последовательность повествования естественно передана без отдельного союза «и».
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: пала к его ногам
  rationale: Русское выражение естественно передаёт жест смирения и глубокой благодарности, не воспроизводя буквально неидиоматичное «на его ноги».
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: поклонилась до земли
  rationale: Передаёт физический жест глубокого почтения и сохраняет контекстуальную возможность поклонения, не утверждая прямо, что речь идёт о богопоклонении.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: подняла сына
  rationale: נשא означает «поднять, понести, взять»; здесь «подняла» прямо и естественно описывает действие матери.
- source_word: וַתֵּצֵא
  choice: вышла
  rationale: Прямое и естественное соответствие глаголу יצא, обозначающему выход из помещения.
theological_decisions:
- issue: Значение וַתִּשְׁתַּחוּ по отношению к Елисею
  choice: Передано как «поклонилась до земли» — жест глубокого почтения и благодарности.
  alternative: «Простёрлась ниц» или, в иных контекстах, «поклонилась» в значении поклонения.
  rationale: Глагол שׁחה может обозначать как почтительный земной поклон, так и религиозное поклонение. Контекст указывает на почтение к Елисею после возвращения сына к жизни; нейтральное описание жеста не навязывает богословского вывода.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным ритмом. Сохранена последовательность кратких еврейских глагольных форм без тяжеловесного повторения союза «и».
