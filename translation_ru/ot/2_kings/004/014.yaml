  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: ru
  text: 'Тогда он сказал[a]: «Что же сделать для неё?» Гиезий сказал: «Но у неё нет сына[b], а муж её стар».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И он сказал».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сына нет у неё».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда он сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующей реплике.
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  choice: Что же сделать для неё?
  rationale: Инфинитивная конструкция допускает смысл вопроса о том, что следует сделать для женщины; активная неопределённо-личная формулировка по-русски естественна и не добавляет названного исполнителя.
- source_word: גֵּיחֲזִי
  choice: Гиезий
  rationale: Имя передано в принятой русской библейской форме.
- source_word: אֲבָל
  choice: Но ведь
  rationale: Частица вводит существенное обстоятельство, ранее не учтённое в разговоре; «но ведь» передаёт оттенок возражения или привлечения внимания.
- source_word: בֵּן אֵין לָהּ
  choice: у неё нет сына
  rationale: Идиоматично передаёт еврейскую конструкцию существования; בֵּן означает именно «сын», а не обобщённо «ребёнок».
- source_word: וְאִישָׁהּ זָקֵן
  choice: а муж её стар
  rationale: אִישׁ с суффиксом здесь означает мужа; «стар» прямо и сжато передаёт זָקֵן, а союз «а» естественно связывает два обстоятельства.
