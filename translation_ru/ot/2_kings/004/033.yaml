base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/033.yaml
  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: ru
  text: Он вошёл, закрыл дверь за ними обоими[a] и помолился Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закрыл дверь, оставив их обоих внутри», то есть в комнате остались только он и ребёнок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Он вошёл
  rationale: Глагол בוא в последовательном повествовании обозначает вход в комнату; «вошёл» естественно и точно передаёт действие.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: закрыл дверь
  rationale: סגר с существительным דלת прямо означает закрыть дверь.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: за ними обоими
  rationale: При глаголе закрывания בְּעַד указывает, что дверь закрыта за находящимися внутри; двойственное по смыслу שְׁנֵיהֶם относится к Елисею и ребёнку.
- source_word: וַיִּתְפַּלֵּל אֶל
  choice: и помолился
  rationale: Форма хитпаэль глагола פלל означает молиться, а אֶל обозначает адресата молитвы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господу
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Кого обозначает שְׁנֵיהֶם («их обоих»)
  choice: Елисея и ребёнка, оставшихся в комнате
  alternative: Не уточнять референтов за пределами буквального «за ними обоими»
  rationale: Контекст ясно указывает на пророка и ребёнка, однако основной текст сохраняет местоименную формулировку оригинала, не добавляя имён.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный синтаксис оригинала сохранён. Выражение «за ними обоими» оставляет в основном тексте компактность и некоторую пространственную неоднозначность еврейского בְּעַד, а сноска поясняет смысл.
