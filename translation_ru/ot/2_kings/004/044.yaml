base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: ru
  text: Он поставил еду перед ними, они поели, и у них ещё осталось[a], по слову Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они оставили часть».'
    reason: Еврейский глагол может быть передан как указание на оставшийся излишек либо как действие людей, оставивших часть пищи.
lexical_decisions:
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: Он поставил еду перед ними
  rationale: Глагол נתן в сочетании с לִפְנֵיהֶם означает, что пищу подали или поставили перед людьми. Слово «еду» восстановлено из ближайшего контекста и делает фразу естественной по-русски.
- source_word: וַיֹּאכְלוּ
  choice: они ели
  rationale: Прямой перевод повествовательной формы глагола אכל; несовершенный вид естественно передаёт действие в последовательности событий.
- source_word: וַיּוֹתִרוּ
  choice: оставили часть
  rationale: Форма породы хифиль от יתר выражает оставление некоторого остатка. Перевод сохраняет грамматический субъект «они» и смысл того, что после еды пища осталась.
- source_word: כִּדְבַר
  choice: по слову
  rationale: Сжатое выражение сохраняет существительное «слово» и подчёркивает исполнение ранее произнесённого Божьего слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, поэтому сохранено личное имя Бога без замены его традиционным титулом.
- issue: Связь чуда с пророческим словом
  choice: по слову Яхве
  alternative: как сказал Яхве
  rationale: Выбранный вариант сохраняет формальный образ «слова» и не сводит выражение к свободному пересказу, одновременно ясно указывая на исполнение Божьего обещания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формула «по слову Яхве» намеренно сохранена как краткая и значимая связь с пророческой речью.
