base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: ru
  text: 'И сказал он: «В это же время через год[a] ты будешь держать на руках сына». Она же сказала: «Нет, господин мой, человек Божий, не обманывай свою служанку».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейское выражение буквально содержит слова «как (в)ремя живое»; в данном контексте это идиома: «в это же время в следующем году».'
    reason: Передаёт идиоматический смысл כָּעֵת חַיָּה и поясняет буквальную форму без создания ложного значения «время жизни».
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: в это же время
  rationale: Существительное מוֹעֵד указывает на определённое, установленное время; в сочетании с последующей идиомой естественный русский эквивалент — «в это же время».
- source_word: כָּעֵת חַיָּה
  choice: через год
  rationale: В данном контексте идиома обозначает соответствующее время в следующем году. Смысл передан естественно, а буквальный образ сохранён в сноске.
- source_word: אתי
  choice: ты
  rationale: Независимое местоимение подчёркивает адресата предсказания; русское «ты» прямо и естественно передаёт это значение.
- source_word: חֹבֶקֶת
  choice: будешь держать на руках
  rationale: Причастие означает обнимать или прижимать к себе. В отношении младенца выражение «держать на руках» звучит естественно и сохраняет конкретный образ.
- source_word: בֵּן
  choice: сына
  rationale: Еврейский текст прямо называет ребёнка сыном, поэтому родовое обозначение сохранено.
- source_word: אַל
  choice: О нет
  rationale: Первое אַל выражает эмоциональный протест или мольбу, а не самостоятельный запрет; «О нет» передаёт её потрясение и страх поверить обещанию.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это почтительное обращение к Елисею, не обозначающее здесь Бога.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устоявшееся и точное обозначение пророка в повествовании книг Царств.
- source_word: תְּכַזֵּב
  choice: не обманывай
  rationale: Глагол может означать лгать, обманывать или оказаться ложным; просьба не давать ложной надежды естественно выражена словами «не обманывай».
- source_word: בְּשִׁפְחָתֶךָ
  choice: свою служанку
  rationale: Форма женского рода выражает смиренное самообозначение женщины. «Служанку» сохраняет род и социальный оттенок, оставаясь понятным современному читателю.
theological_decisions:
- issue: Значение почтительного обращения אֲדֹנִי
  choice: господин мой
  alternative: владыка мой; господин
  rationale: Обращение направлено к Елисею и выражает уважение к человеку; написание со строчной буквы и контекст не придают ему божественного значения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Реплика женщины сохраняет почтительность, эмоциональную напряжённость и женский род её самообозначения; архаизмы по возможности избегаются.
