  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: ru
  text: Затем войди, закрой дверь за собой и за своими сыновьями и наливай во все эти сосуды; а полный сосуд[a] отставляй в сторону[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «полный [сосуд]»; в контексте это указание повторяется по мере наполнения сосудов.'
    reason: лексико-грамматическая альтернатива
  - marker: b
    text: 'Или: «убирай».'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: וּבָאת
  choice: Затем войди
  rationale: Глагол בוא здесь обозначает вход в дом, а последовательность действий, выраженную союзом waw, естественно передаёт «затем».
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  choice: затвори дверь
  rationale: סגר означает «закрыть, затворить». «Затвори» сохраняет достоинство повествовательного стиля и остаётся понятным современному читателю.
- source_word: בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: за собой и за своими сыновьями
  rationale: При глаголе закрывания בעד указывает, что дверь должна быть закрыта за вошедшими, не допуская посторонних; повтор предлога отражён в переводе.
- source_word: וְיָצַקְתְּ עַל
  choice: и наливай во
  rationale: יצק означает «лить, наливать», а עַל при названиях сосудов в данном контексте естественно передаётся по-русски предлогом «в».
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: все эти сосуды
  rationale: כְּלִים — широкое обозначение предметов и ёмкостей; в контексте пустых ёмкостей для масла русское «сосуды» точно и стилистически уместно.
- source_word: וְהַמָּלֵא
  choice: наполненные сосуды
  rationale: Форма в еврейском тексте буквально стоит в единственном числе — «полный [сосуд]», но имеет обобщённый смысл; множественное число естественно выражает повторяющееся действие.
- source_word: תַּסִּיעִי
  choice: отставляй в сторону
  rationale: Каузативная форма נסע здесь означает убирать наполненный сосуд с места наливания; выбранная формулировка ясно передаёт практическое действие.
