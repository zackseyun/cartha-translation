base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: ru
  text: И её схватили[a], и она пошла по дороге к входу для лошадей в царский дворец[b]. Там её предали смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возложили на неё руки». Здесь это выражение можно понимать как «схватили её»; возможен также перевод: «дали ей пройти» или «уступили ей дорогу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по пути входа лошадей [в] дом царя». Вероятно, имеется в виду вход или подъездной путь во дворцовый комплекс, которым пользовались для лошадей.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: её схватили
  rationale: Еврейское выражение буквально говорит о возложении рук, но в данном контексте означает задержание; современное русское «схватили» ясно передаёт действие, не добавляя отсутствующей в форме глагола пассивности.
- source_word: וַתָּבֹא
  choice: она пошла
  rationale: Глагол בוא может означать движение «идти/приходить» в зависимости от точки зрения. Здесь повествование описывает её движение от храмовой территории к дворцу, поэтому естественно «пошла»; форма не требует перевода «её отвели».
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: по дороге через конный вход
  rationale: דֶּרֶךְ обозначает путь или дорогу, а מְבוֹא הַסּוּסִים — вход, предназначенный для лошадей. Формулировка сохраняет оба элемента и естественно звучит по-русски.
- source_word: בֵּית הַמֶּלֶךְ
  choice: во дворец
  rationale: Буквально «дом царя», но в контексте речь идёт о царском дворцовом комплексе. «Дворец» точно и понятно передаёт референт.
- source_word: וַתּוּמַת
  choice: её предали смерти
  rationale: 'Хофаль глагола מות выражает причинённую смерть: её не просто постигла смерть, а умертвили. «Предали смерти» сохраняет пассивную форму и оттенок официальной казни.'
- source_word: שָׁם
  choice: там
  rationale: Прямое соответствие наречию места, указывающему, где совершилась казнь.
