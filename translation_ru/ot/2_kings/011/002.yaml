  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: ru
  text: Но Иехошева, дочь царя Иорама и сестра Ахазии, взяла Иоаса, сына Ахазии, и тайно увела его из числа царских сыновей, которых предавали смерти, вместе с его кормилицей в спальню[a]. И они скрыли его[b] от Гофолии, так что он не был предан смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в комнате постелей»; возможно также: «в спальне».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол стоит во множественном числе: «они скрыли его».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: взяла
  rationale: Обычное повествовательное значение глагола לקח; нейтрально передаёт действие, не добавляя не выраженных в тексте подробностей.
- source_word: יְהוֹשֶׁבַע
  choice: Иехошева
  rationale: Передача еврейской формы имени в соответствии с её звучанием в книге Царств; отличная форма в Паралипоменоне здесь не подменяет исходный текст.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: дочь царя Иорама
  rationale: Естественно передаёт сопряжённую конструкцию и сохраняет царский титул.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: сестра Ахазии
  rationale: אחות обычно обозначает сестру; перевод не ослабляет прямое значение ради согласования с иными генеалогическими сведениями.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: тайно унесла его
  rationale: Глагол גנב буквально связан с кражей, но в данном контексте означает скрытное изъятие ребёнка из числа обречённых. Русская формулировка сохраняет тайный характер действия без неуместного оттенка корыстного похищения.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: из числа царских сыновей
  rationale: Сохраняет буквальное значение בני המלך — «сыновья царя», не заменяя его более толковательным словом «царевичи».
- source_word: הַמּוּמָתִים
  choice: которых предавали смерти
  rationale: Страдательное причастие породы хофаль от מות описывает тех, кого умерщвляли; несовершенный вид передаёт происходившую расправу.
- source_word: מֵינִקְתּוֹ
  choice: кормилицей
  rationale: Кормилица — женщина, вскармливающая младенца грудью; это точный и естественный русский эквивалент.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: в спальной комнате
  rationale: Буквально «в комнате лож/постелей»; выбран ясный современный эквивалент, а конкретная форма выражения отмечена в сноске.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: они спрятали его
  rationale: Сохранено множественное число масоретской глагольной формы, вероятно включающее Иехошеву и кормилицу либо других помощников.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: от Гофолии
  rationale: В данном контексте מִפְּנֵי означает сокрытие от её взора и угрозы; краткая русская конструкция передаёт это естественно.
- source_word: וְלֹא הוּמָת
  choice: так что он не был предан смерти
  rationale: Страдательная форма от מות сохранена, а «так что» естественно выражает итог предпринятого укрытия.
theological_decisions:
- issue: Возможное согласование степени родства с параллельными генеалогическими сведениями
  choice: Сохранить «сестра Ахазии»
  alternative: 'Передать шире: «родственница Ахазии»'
  rationale: В стихе употреблено обычное слово «сестра»; перевод не должен вводить гармонизирующее толкование, которого не требует сам еврейский текст.
- issue: Подлежащее при действии сокрытия
  choice: 'Сохранить множественное число: «они спрятали его»'
  alternative: 'Сгладить по контексту до единственного числа: «она спрятала его»'
  rationale: Масоретский текст содержит глагол во множественном числе. Неопределённость состава действующих лиц следует сохранить, а не устранять.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на два предложения для ясности, при этом последовательность действий и повтор местоимения сохранены. Имена переданы последовательно: Иехошева как форма данного текста; для Ахазии, Иорама, Иоаса и Гофолии использованы укоренившиеся русские библейские формы.'
