  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: ru
  text: И радовался весь народ земли, и город успокоился. А Гофолию предали смерти мечом у царского дворца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у дома царя». Возможны также переводы: «в царском доме» или «при царской резиденции»; древнееврейская конструкция кратко выражает место действия.'
    reason: Передаёт буквальную форму בֵּית מֶלֶךְ и сохраняет допустимую неоднозначность локативного оттенка, не оставляя в основном тексте двусмысленного для современного русского выражения «царский дом».
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: радовался
  rationale: Глагол שׂמח выражает радость; форма единственного числа согласуется с собирательным עַם и естественно передаётся по-русски как «радовался».
- source_word: כָּל עַם הָאָרֶץ
  choice: весь народ земли
  rationale: Сохраняет устойчивое древнееврейское обозначение населения страны и возможный общественно-политический оттенок, не сводя выражение просто к «народу».
- source_word: וְהָעִיר שָׁקָטָה
  choice: и город успокоился
  rationale: שׁקט означает наступление покоя и прекращение смуты; «успокоился» в данном повествовательном контексте естественнее буквального «был тих».
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: А Гофолию
  rationale: Вынесенное вперёд дополнение получает лёгкое тематическое выделение; частица «а» передаёт смену фокуса без тяжеловесной конструкции «что же до».
- source_word: הֵמִיתוּ
  choice: предали смерти
  rationale: Порода hифиль глагола מות означает «умертвить, предать смерти»; формулировка сохраняет причинное значение и повествовательную серьёзность, не уточняя сверх текста юридический характер казни.
- source_word: בַחֶרֶב
  choice: мечом
  rationale: Предлог בְּ имеет инструментальное значение; русский творительный падеж точно и естественно передаёт «посредством меча».
- source_word: בֵּית מלך
  choice: у царского дома
  rationale: Буквально «дом царя»; предлог «у» естественно выражает местонахождение и не вносит более истолковывающее «дворец».
