  to: 'Она посмотрела — и вот, царь стоит у колонны[a], как было принято; рядом с царём — начальники и трубы, а весь народ страны радуется и трубит в трубы. Тогда Гофолия разорвала на себе одежды и закричала: «Заговор! Заговор!»[b]'
