  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עֹמֵ֨ד עַֽל הָ/עַמּ֜וּד כַּ/מִּשְׁפָּ֗ט וְ/הַ/שָּׂרִ֤ים וְ/הַ/חֲצֹֽצְרוֹת֙ אֶל הַ/מֶּ֔לֶךְ וְ/כָל עַ֤ם הָ/אָ֨רֶץ֙ שָׂמֵ֔חַ וְ/תֹקֵ֖עַ בַּ/חֲצֹֽצְר֑וֹת וַ/תִּקְרַ֤ע עֲתַלְיָה֙ אֶת בְּגָדֶ֔י/הָ וַ/תִּקְרָ֖א קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: ru
  text: 'Она посмотрела — и вот, царь стоит у колонны[a], как было принято; рядом с царём — начальники и трубы, а весь народ страны радуется и трубит в трубы. Тогда Гофолия разорвала на себе одежды и закричала: «Заговор! Заговор!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при колонне». Еврейский предлог здесь допускает несколько близких локативных значений.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Измена! Измена!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Она посмотрела — и вот
  rationale: Сочетание передаёт внезапное зрительное обнаружение; тире естественно оформляет резкий переход к увиденной сцене.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: царь стоит
  rationale: Причастие изображает разворачивающуюся перед глазами сцену; настоящее время оживляет повествовательный ракурс.
- source_word: עַל הָעַמּוּד
  choice: у колонны
  rationale: עַל здесь допускает локативное значение нахождения возле известной церемониальной колонны или установленного места; буквальное «на колонне» в русском вводило бы в заблуждение.
- source_word: כַּמִּשְׁפָּט
  choice: как было принято
  rationale: מִשְׁפָּט обозначает здесь установленный обычай или церемониальный порядок, а не судебное решение.
- source_word: וְהַשָּׂרִים
  choice: начальники
  rationale: שָׂרִים — широкое обозначение высокопоставленных руководителей; вариант не уточняет без достаточных оснований ни воинское звание, ни княжеский статус.
- source_word: וְהַחֲצֹצְרוֹת
  choice: трубачи
  rationale: Хотя форма буквально называет трубы, в ряду с начальниками и при последующем упоминании игры на трубах естественно понимать метонимическое обозначение трубачей; это делает русскую сцену ясной.
- source_word: אֶל הַמֶּלֶךְ
  choice: рядом с царём
  rationale: В данном контексте אֶל выражает близкое расположение при царе, а не движение к нему.
- source_word: כָל עַם הָאָרֶץ
  choice: весь народ земли
  rationale: Сохранено характерное библейское обозначение населения страны, не суженное до присутствующей толпы.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: радуется и трубит в трубы
  rationale: Согласование единственного числа отражает собирательное עַם; выражение передаёт одновременно ликование и церемониальное трубление.
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: разорвала на себе одежды
  rationale: Русская формула ясно передаёт жест крайнего потрясения и сохраняет возвышенный повествовательный регистр.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Заговор! Заговор!
  rationale: קֶשֶׁר прежде всего означает заговор или политический мятеж; повтор сохранён как крик тревоги.
theological_decisions:
- issue: Политико-правовой оттенок крика קֶשֶׁר
  choice: Заговор! Заговор!
  alternative: Измена! Измена!
  rationale: «Заговор» точнее сохраняет обвинение в организованном захвате власти, тогда как «измена» сильнее подчёркивает нарушение верности и потому дана как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет драматическую последовательность сцены, но избегает тяжеловесной кальки. Имя עֲתַלְיָה передано традиционной русской библейской формой «Гофолия».
