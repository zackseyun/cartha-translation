    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: услышав
  rationale: Форма שׁמע обозначает здесь простое слуховое восприятие в последовательности повествования. Русское деепричастие естественно связывает это действие с последующим приходом Гофолии.
- source_word: עֲתַלְיָה
  choice: Гофолия
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: קוֹל
  choice: шум
  rationale: קוֹל может означать голос, звук или шум. В сцене многолюдного провозглашения слово «шум» естественно передаёт совокупность слышимых голосов и движения.
- source_word: הָרָצִין
  choice: стража
  rationale: Буквально слово связано с «бегущими», однако в царском контексте обозначает особый отряд царской охраны. Собирательное «стража» ясно передаёт функцию этой группы.
- source_word: הָעָם
  choice: народ
  rationale: Обычное соответствие עָם; здесь имеется в виду собравшийся народ, но перевод не сужает значение до «толпы».
- source_word: וַתָּבֹא אֶל
  choice: пришла к
  rationale: בוא с אֶל означает движение к кому-либо или чему-либо. «Пришла к» сохраняет простую повествовательную формулировку без добавления значения торжественного входа.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранён образный строй еврейского выражения «дом Яхве», обозначающего храм, и непосредственно передано личное имя יְהוָה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога — тетраграмматон. Форма «Яхве» передаёт его как имя, не заменяя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан естественным для повествования; традиционная русская форма имени «Гофолия» сохранена, а неясности слов קוֹל и הָרָצִין отмечены в сносках.
