  text: Когда Гофолия услышала шум[a] стражи[b] и народа, она пришла к народу в доме Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звук» или «голос».'
    reason: lexical_alternative
  - marker: b
