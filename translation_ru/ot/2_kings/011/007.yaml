base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: ru
  text: А два отряда среди вас[a] — все, кто в субботу заканчивает дежурство[b], — пусть охраняют дом Яхве ради царя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «две руки среди вас»; вероятный смысл — «два отряда» или «две группы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все, кто выходит в субботу». По контексту, вероятно, имеются в виду те, кто в субботу заканчивает дежурство.'
    reason: alternative_reading
  - marker: c
    text: 'Еврейский предлог допускает также понимание: «по направлению к царю». По контексту охрана дома Яхве была связана с защитой царя.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת בָּכֶם
  choice: два отряда из вас
  rationale: Буквально «две руки среди/из вас». В данном военно-организационном контексте יָד обозначает часть или подразделение; «два отряда» передаёт смысл естественно, а בָּכֶם указывает, что они принадлежат к числу обращённых.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: все, кто сменяется с караула в субботу
  rationale: Буквально «все выходящие в субботу». В контексте смены храмовой стражи речь, вероятнее всего, о тех, чьё дежурство заканчивается в субботу; формулировка делает служебный контекст понятным, а буквальная возможность сохранена в примечании.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: пусть несут стражу
  rationale: Сочетание глагола שׁמר с однокоренным существительным מִשְׁמֶרֶת означает исполнение караульной обязанности. Русское «нести стражу» сохраняет побудительную силу и избегает тяжёлого однокоренного повтора.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется буквальный образ «дома», а не вводится более конкретное «храм»; личное имя יְהוָה передано как «Яхве».
- source_word: אֶל הַמֶּלֶךְ
  choice: ради царя
  rationale: Предлог אֶל здесь труден. По контексту охрана дома Яхве служит защите царя; «ради царя» естественно выражает направленность или цель, не скрывая неоднозначность, отмеченную в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Связь храмовой стражи с царём в выражении אֶל הַמֶּלֶךְ
  choice: ради царя
  alternative: по направлению к царю; при царе
  rationale: Контекст указывает на охрану дома Яхве с целью защитить царя, однако необычное употребление предлога допускает несколько синтаксических оттенков; поэтому неоднозначность отражена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Военная лексика понятна широкому читателю; синтаксические тире помогают ясно выделить пояснение к двум отрядам. Подлинные лексическая и предложная неоднозначности сохранены в примечаниях.
