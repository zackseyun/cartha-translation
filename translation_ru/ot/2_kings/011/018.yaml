source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: ru
  text: Тогда весь народ страны пришёл в дом Ваала[a] и разрушил его. Его жертвенники и изваяния[b] они разбили вдребезги, а Маттана, жреца Ваала, убили перед жертвенниками. Затем священник назначил надзирателей[c] над домом Яхве[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в храм Ваала; буквально: «в дом Ваала».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «статуи», «изображения»; речь идёт о культовых изображениях Ваала.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможны также понимания: «установил порядок служения» или «распределил обязанности». Еврейское слово может обозначать как надзор, так и порученные обязанности.'
    reason: ambiguity
  - marker: d
    text: Яхве — передача еврейского имени יהוה, традиционно переводимого как «Господь».
    reason: divine_name
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: весь народ страны
  rationale: Передаёт устойчивое общественно-политическое выражение, не сужая его смысла до «простонародья».
- source_word: בֵּית הַבַּעַל
  choice: дом Ваала
  rationale: Сохраняет буквальный образ еврейского בַּיִת и параллель с «домом Яхве» в конце стиха; по контексту речь идёт о храме.
- source_word: וַיִּתְּצֻהוּ
  choice: разрушил его
  rationale: Глагол обозначает снос или разрушение строения; русское выражение ясно и естественно.
- source_word: מזבחתיו / מִזְבְּחֹתָיו
  choice: его жертвенники
  rationale: Множественное число согласуется с дальнейшим הַמִּזְבְּחוֹת «жертвенниками», а местоименное окончание отсылает к Ваалу или его храмовому комплексу.
- source_word: צְלָמָיו
  choice: его изваяния
  rationale: Слово обозначает культовые изображения или статуи; «изваяния» сохраняет предметный смысл, не заменяя его более оценочным словом «идолы».
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: разбили вдребезги
  rationale: Наречие הֵיטֵב усиливает глагол и указывает на основательность разрушения; русская идиома естественно передаёт этот усиленный смысл.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: Маттана, жреца Ваала
  rationale: Для служителя Ваала выбрано «жрец», чтобы естественно обозначить языческий культ и отличить его от священника Яхве далее в стихе.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: перед жертвенниками
  rationale: Сохраняет прямой пространственный смысл предлога לִפְנֵי без дополнительного толкования.
- source_word: פְּקֻדּוֹת
  choice: надзирателей
  rationale: В данном административном контексте слово может обозначать лиц, поставленных для надзора; это наиболее ясное чтение, хотя возможен и абстрактный смысл «порядок служения» или «обязанности».
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет лексику оригинала и намеренный контраст с домом Ваала; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит личное Божье имя, а не титул; транслитерация сохраняет это различие.
- issue: Обозначение служителей Ваала и Яхве одним словом כֹּהֵן
  choice: жрец Ваала; священник
  alternative: священник Ваала; священник
  rationale: Русское разграничение естественно для культового контекста и не меняет функций названных лиц; при этом исходное еврейское слово в обоих случаях одинаково.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис сделан ясным для широкого читателя; сохранены повтор «жертвенники» и контраст между домом Ваала и домом Яхве. Термины «жрец» и «священник» различают языческое и израильское служение в соответствии с естественной русской нормой.
