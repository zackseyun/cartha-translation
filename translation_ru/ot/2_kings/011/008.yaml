base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: ru
  text: Окружите царя со всех сторон, каждый с оружием в руке. Всякий, кто войдёт в ряды, должен быть предан смерти.[a] Будьте с царём, когда он выходит и когда входит.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто войдёт в линии построения». Значение еврейского слова не вполне определённо; вероятно, речь идёт о выстроенных рядах стражи.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «при его выходе и при его входе» — устойчивое выражение, подразумевающее сопровождение и охрану царя при всех его передвижениях.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל־הַמֶּלֶךְ סָבִיב
  choice: Окружите царя со всех сторон
  rationale: Повелительная последовательность передана естественным русским императивом; сочетание с סָבִיב обозначает полное защитное окружение царя.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: каждый с оружием в руке
  rationale: אִישׁ употреблено дистрибутивно — каждый из стражников; כְּלִי в военном контексте означает оружие или вооружение. Единственное число «в руке» сохраняет образ еврейского текста и естественно звучит по-русски.
- source_word: וְהַבָּא אֶל־הַשְּׂדֵרוֹת
  choice: Всякий, кто войдёт в ряды
  rationale: Причастие с артиклем имеет обобщающее значение. שְׂדֵרוֹת, вероятно, обозначает выстроенные ряды или линии стражи; формулировка сохраняет военный смысл, не уточняя сверх текста точную форму построения.
- source_word: יוּמָת
  choice: должен быть предан смерти
  rationale: Пассивная форма хофаль выражает приказ умертвить нарушителя. Эта формулировка передаёт официальный характер распоряжения, не добавляя способа казни.
- source_word: וִהְיוּ אֶת־הַמֶּלֶךְ
  choice: Будьте с царём
  rationale: В данном контексте форма продолжает цепь повелений, а היה с אֶת выражает пребывание и сопровождение рядом с царём.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: когда он выходит и когда входит
  rationale: Инфинитивные конструкции буквально говорят о его выходе и входе; придаточные времени естественны в современном русском и сохраняют парную формулу исходного текста.
