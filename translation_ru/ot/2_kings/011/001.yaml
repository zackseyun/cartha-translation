  text: וַֽ/עֲתַלְיָה֙ אֵ֣ם אֲחַזְיָ֔הוּ ו/ראתה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֨קָם֙ וַ/תְּאַבֵּ֔ד אֵ֖ת כָּל זֶ֥רַע הַ/מַּמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: ru
  text: Гофолия, мать Охозии, увидела, что её сын умер; тогда она встала и истребила всё царское потомство[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё семя царства», то есть царский род, царские потомки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה
  choice: Гофолия
  rationale: Использована устоявшаяся русская библейская форма имени; начальный ו передан связью повествования без добавления отдельного временного наречия.
- source_word: אֵם אֲחַזְיָהוּ
  choice: мать Охозии
  rationale: Конструктивное сочетание прямо определяет Гофолию через её родство с Охозией; имя передано в принятой русской библейской форме.
- source_word: וַתָּרְאֶה כִּי מֵת בְּנָהּ
  choice: увидела, что её сын умер
  rationale: Конструкция с ראה и כִּי обозначает восприятие факта; «умер» естественно и точно передаёт результативное состояние מֵת в русском повествовании.
- source_word: וַתָּקָם
  choice: тогда она встала
  rationale: Сохранён самостоятельный глагол קום, выражающий переход к решительному действию; «тогда» естественно передаёт последовательность и следствие в цепи повествовательных форм.
- source_word: וַתְּאַבֵּד
  choice: истребила
  rationale: Пиэль глагола אבד означает причинить гибель или уничтожение; в контексте устранения династии «истребила» передаёт смертоносный и целенаправленный характер действия.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: всё царское потомство
  rationale: זֶרַע буквально означает «семя», но здесь обозначает потомков, принадлежащих к царской династии; выбран естественный русский династический оборот.
