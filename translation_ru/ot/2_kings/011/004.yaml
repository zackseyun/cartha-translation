  to: В седьмой год Иодай послал за сотниками, карийцами[a] и бегунами[b] и привёл их к себе в дом Яхве. Там, в доме Яхве, он заключил с ними завет, взял с них клятву и показал им царского сына.
  rationale: Исправление устраняет добавленные в драфте смысловые уточнения о «начальниках карийцев» и телохранителях, сохраняя неясность древнееврейских названий в основном тексте. Каузативное «заставил поклясться» передано естественным русским оборотом «взял с них клятву». Маркеры сносок стоят непосредственно после соответствующих терминов.
