  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: ru
  text: В седьмой год Иодай послал за сотниками, карийцами[a] и бегунами[b] и привёл их к себе в дом Яхве. Там, в доме Яхве, он заключил с ними завет, взял с них клятву и показал им царского сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Карийцы — название особого подразделения царской стражи; точное значение и происхождение этого названия неясны. Возможно отождествление с керефеями.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «бегуны». Это могли быть царские стражники или придворные посыльные.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: На седьмой год
  rationale: Естественно передаёт временную формулу; начальный союз не требуется в русском повествовании.
- source_word: שָׁלַח וַיִּקַּח
  choice: послал за
  rationale: В данном контексте сочетание «послал и взял» означает, что Иодай послал вызвать или привести названных людей; русский оборот передаёт это без неестественного буквализма.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: сотниками
  rationale: Краткое традиционное русское обозначение военачальников над подразделениями в сто человек; не вносит специфически римского контекста.
- source_word: לַכָּרִי
  choice: начальниками карийцев
  rationale: 'Предлог ל связывает «сотников» с подразделением карийцев: речь, вероятнее всего, о начальниках этой дворцовой стражи. Само групповое название сохранено без жёсткой идентификации.'
- source_word: וְלָרָצִים
  choice: и телохранителей
  rationale: Буквально «бегунов»; в царском контексте это устойчивое обозначение придворной стражи, поэтому функциональный эквивалент яснее современному читателю.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет образное выражение «дом» и передаёт личное имя יהוה как «Яхве».
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: заключил с ними завет
  rationale: Нормальный русский эквивалент устойчивого древнееврейского выражения «срезал завет», сохраняющий его торжественный политико-религиозный смысл.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: связал их клятвой
  rationale: 'Передаёт каузативное значение: Иодай обязал их клятвой, а не сам поклялся им.'
- source_word: בֶּן הַמֶּלֶךְ
  choice: царского сына
  rationale: Естественная русская передача определительного сочетания «сын царя» с сохранением династического смысла.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; форма «Яхве» передаёт его как имя и соответствует исходному чтению, не заменяя титулом.
- issue: Значение בְּרִית в заговоре против Гофолии
  choice: завет
  alternative: договор; соглашение
  rationale: «Завет» сохраняет торжественный и клятвенный характер обязательства, не сводя его к обычной договорённости.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным регистром. Синтаксис упрощён для ясности, но последовательность действий и повтор «в доме Яхве» сохранены. Неясные названия придворных подразделений пояснены сносками.
