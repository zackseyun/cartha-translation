  text: וַֽ/יַּעֲשׂ֞וּ שָׂרֵ֣י ה/מאיות כְּ/כֹ֣ל אֲשֶׁר צִוָּה֮ יְהוֹיָדָ֣ע הַ/כֹּהֵן֒ וַ/יִּקְחוּ֙ אִ֣ישׁ אֶת אֲנָשָׁ֔י/ו בָּאֵ֣י הַ/שַּׁבָּ֔ת עִ֖ם יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וַ/יָּבֹ֖אוּ אֶל יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: ru
  text: Начальники сотен во всём поступили так, как повелел священник Иодай. Каждый взял своих людей — заступавших на службу в субботу вместе с уходившими со службы в субботу[a], — и они пришли к священнику Иодаю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «входивших в субботу вместе с выходившими в субботу». В данном контексте, вероятно, имеются в виду заступавшая и уходившая смены.'
    reason: Сохраняет буквальную лексическую возможность еврейских причастий и одновременно поясняет их вероятный служебный смысл.
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: начальники сотен
  rationale: Передаёт военное руководство подразделениями по сто человек и при этом сохраняет выраженную в еврейском тексте структуру звания.
- source_word: כְּכֹל אֲשֶׁר
  choice: во всём поступили так, как
  rationale: Естественно по-русски выражает полное соответствие повелению, сохраняя всеохватный смысл כֹּל.
- source_word: צִוָּה
  choice: повелел
  rationale: Отражает властный характер распоряжения и соответствует достоинству исторического повествования.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: каждый взял своих людей
  rationale: Дистрибутивное אִישׁ относится к каждому начальнику, а אֲנָשָׁיו — к находившимся под его началом людям.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: заступавших на службу в субботу
  rationale: В контексте организации храмовой стражи приход в субботу обозначает заступающую смену; формулировка ясна современному читателю.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: уходившими со службы в субботу
  rationale: Сохраняет противопоставление входящей и выходящей групп и передаёт вероятный смысл смены караула, не устраняя буквальную возможность, отмеченную в сноске.
- source_word: עִם
  choice: вместе с
  rationale: Ясно показывает, что обе группы были собраны совместно.
- source_word: וַיָּבֹאוּ אֶל
  choice: и они пришли к
  rationale: Прямо и естественно передаёт обычную повествовательную конструкцию движения к Иодаю.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Стандартное обозначение должности Иодая без добавления конфессионально обусловленных оттенков.
