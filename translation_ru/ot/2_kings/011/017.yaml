base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: ru
  text: Иодай заключил завет[a] между Яхве, царём и народом, чтобы они были народом Яхве[b]; также он заключил завет между царём и народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разрезал завет»; это устойчивый древнееврейский оборот со значением «заключил завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы быть народом для Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: заключил
  rationale: Сочетание כרת ברית — устойчивый древнееврейский оборот, буквально «разрезал завет», но по-русски естественно передаётся как «заключил завет».
- source_word: הַבְּרִית
  choice: завет
  rationale: Слово «завет» сохраняет официальный и богословский вес ברית; «договор» здесь звучал бы слишком узко и светски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в тексте как имени Бога Израиля, а не заменяет его титулом.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: между Яхве, царём и народом
  rationale: Формулировка естественна по-русски и сохраняет названные в еврейском тексте стороны завета без добавочного истолкования их взаимных ролей.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: чтобы они были народом Яхве
  rationale: Так естественно передаётся цель завета и принадлежность народа Яхве. Более буквальная конструкция «были народом для Яхве» сохранена в примечании.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: а также между царём и народом
  rationale: «А также» ясно обозначает дополнительное отношение завета между царём и народом, выраженное повторной конструкцией בֵּין... וּבֵין.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя в основном тексте сохраняет заветный характер высказывания и не подменяет имя титулом.
- issue: Смысл формулы לִהְיוֹת לְעָם לַיהוָה
  choice: чтобы они были народом Яхве
  alternative: чтобы они были народом для Яхве
  rationale: Основной вариант естественно выражает принадлежность в заветных отношениях, а примечание сохраняет более буквальную и несколько открытую формулировку оригинала.
- issue: Соотношение сторон завета
  choice: между Яхве, царём и народом
  alternative: между Яхве — с одной стороны, и царём и народом — с другой
  rationale: Еврейская повторная конструкция называет три стороны, но не требует жёстко вводить схему «одна сторона — другая сторона»; поэтому перевод не разрешает синтаксическую неоднозначность сверх необходимого.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексемой «завет». Синтаксис сделан ясным, но повторная структура и богословская напряжённость отношений между Яхве, царём и народом не переистолкованы.
