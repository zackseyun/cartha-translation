- source_word: וַיְצַוֵּם
  choice: И он приказал им
  rationale: Порода пиэль глагола צוה выражает властное распоряжение; «приказал» естественно передаёт это значение в современном русском повествовании.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Типичная древнееврейская формула введения речи в современном русском естественно передаётся пунктуационно, без тяжеловесного «сказав».
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: Вот что вы должны сделать
  rationale: Передаёт указательное выражение и обязательную силу наставления ясно и без излишнего буквализма.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: треть из вас
  rationale: Точная и естественная русская передача дробного выражения.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: заступающая на службу в субботу
  rationale: Причастие буквально обозначает приходящих в субботу; в контексте смены караула речь идёт о заступлении на службу, что выражено естественным русским оборотом.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: будет нести стражу
  rationale: Сочетание со значением исполнения караульной обязанности передано устойчивым русским выражением; будущее время сохраняет предписывающую силу фразы.
- source_word: בֵּית הַמֶּלֶךְ
  choice: у царского дома
  rationale: Сохраняет буквальный образ «дома царя», тогда как контекст допускает понимание царского дворца.
