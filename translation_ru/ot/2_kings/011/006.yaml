  yaml_path: translation/ot/2_kings/011/006.yaml
  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: ru
  text: А третья часть пусть стоит у ворот Сур, и третья часть — у ворот позади скороходов[a]. Охраняйте дом, не допуская проникновения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бегущих»; возможно, имеются в виду царские гонцы или телохранители.'
    reason: lexical_alternative
  - marker: b
    text: 'Значение редкого еврейского слова неясно; возможны также переводы: «как заграждение» или «для защиты».'
    reason: textual_uncertainty
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: а третья часть
  rationale: Определённое порядковое числительное женского рода в данном контексте обозначает одну из трёх частей стражи. «Третья часть» естественно передаёт распределительный смысл.
- source_word: בְּשַׁעַר סוּר
  choice: у ворот Сур
  rationale: Сוּר, вероятнее всего, является названием ворот или места; оно передано транслитерацией, без предположительной этимологизации.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: у ворот позади скороходов
  rationale: אַחַר сохраняет пространственное значение «позади», а конструкция не уточняется предположительным архитектурным толкованием.
- source_word: הָרָצִים
  choice: скороходов
  rationale: Буквально причастное существительное означает «бегущие». В царском окружении оно могло обозначать корпус гонцов или телохранителей; «скороходы» сохраняет образ движения и допускает функциональную неоднозначность.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: охраняйте
  rationale: Однокоренная конструкция «стерегите стражу/охрану» усиливает обязанность охранять. Русский глагол «охраняйте» естественно выражает её смысл без неуклюжего повтора.
- source_word: הַבַּיִת
  choice: дом
  rationale: Слово буквально означает «дом». Хотя в контексте возможен дворец или храмовый комплекс, исходный текст здесь этого прямо не уточняет.
- source_word: מַסָּח
  choice: не допуская проникновения
  rationale: Редкое и не вполне ясное слово, по контексту, указывает на заграждение, защиту либо предотвращение входа. Формулировка передаёт вероятную цель охраны, а неопределённость отмечена в сноске.
