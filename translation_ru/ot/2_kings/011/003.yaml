lexical_decisions:
- source_word: בֵּית יְהוָה
  choice: в доме ГОСПОДА
  rationale: Традиционная и ясная передача тетраграмматона через титул «ГОСПОДЬ»; выражение обозначает храм.
- source_word: מִתְחַבֵּא
  choice: скрываясь там
  rationale: 'Причастная форма передаёт продолжающееся действие: он находился в храме, оставаясь в укрытии, а не только был однажды спрятан.'
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: царствовала над страной
  rationale: Сохраняет значение активного правления; «страна» естественно передаёт הָאָרֶץ в данном контексте Иудеи.
theological_decisions:
- issue: Передача личного имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Использована укоренённая русская библейская передача титулом без введения конфессионально маркированной практики произношения имени.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Союз «пока» естественно выражает одновременность укрывания Иоаса и царствования Гофолии.
