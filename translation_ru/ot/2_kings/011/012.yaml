  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: ru
  text: 'Тогда он вывел сына царя, возложил на него венец и вручил ему свидетельство[a]. Его провозгласили царём и помазали; затем захлопали в ладоши и восклицали: «Да живёт царь!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «документ завета»; возможно также: «установление». В еврейском тексте — «свидетельство»; вероятно, имеется в виду письменный документ, связанный с царской властью.'
    reason: lexical_alternative
