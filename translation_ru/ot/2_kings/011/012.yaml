- source_word: הָעֵדוּת
  choice: свидетельство
  rationale: 'Буквальная и сдержанная передача, сохраняющая неоднозначность еврейского слова: оно может обозначать связанный с царской властью письменный документ, но текст не уточняет его содержание.'
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: его провозгласили царём
  rationale: Передаёт установление его царём и естественно звучит по-русски; не повторяет действие возложения венца.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: помазали
  rationale: Обычная точная передача משׁח в контексте царского посвящения.
- source_word: וַיַּכּוּ כָף
  choice: стали хлопать в ладоши
  rationale: Естественная русская передача идиомы «ударять ладонью», обозначающей публичное одобрение.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Да живёт царь!
  rationale: Традиционная и естественная русская формула царского приветствия, сохраняющая пожелательно-побудительную силу еврейского выражения.
theological_decisions:
- issue: Значение הָעֵדוּת в сцене восшествия на престол
  choice: 'В основном тексте: «свидетельство»'
  alternative: «документ завета»; «установление»
  rationale: Слово может обозначать письменное свидетельство о заветных обязанностях царя, возможно предписание закона, однако еврейский текст этого прямо не уточняет. Более широкая передача сохраняет смысловую открытость, а варианты вынесены в примечание.
