base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: ru
  text: Затем он взял с собой начальников сотен, карийцев[a], скороходов[b] и весь народ страны. Они свели царя из дома Яхве и через ворота скороходов пришли в царский дворец. И царь сел на престол царей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «керетян» или «телохранителей». Значение еврейского слова не вполне ясно.'
    reason: alternative_reading
  - marker: b
    text: Буквально «бегущих»; вероятно, имеются в виду царские стражники или гонцы. То же слово употреблено в названии ворот.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Затем он взял с собой
  rationale: Единственное число указывает на первосвященника Иодая как действующее лицо; «взял с собой» естественно передаёт собирание и сопровождение перечисленных групп.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: начальников сотен
  rationale: Сохраняет военную структуру оригинала и не вводит римский термин «центурионы».
- source_word: הַכָּרִי
  choice: кариев[a]
  rationale: Транслитерационное наименование сохраняет неясность еврейского термина и не навязывает ни этнического, ни функционального толкования.
- source_word: הָרָצִים
  choice: скороходов[b]
  rationale: Передаёт буквальный образ «бегущих»; в царском контексте слово, вероятно, обозначает особый разряд стражников или гонцов.
- source_word: כָּל עַם הָאָרֶץ
  choice: весь народ страны
  rationale: Современная и понятная передача устойчивого выражения без неоправданного сужения до простолюдинов или расширения до всего народа без исключения.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: Они вывели царя
  rationale: Множественное число переводит фокус на собравшуюся группу; глагол обозначает движение вниз от храмового комплекса, но по-русски «вывели» в данном контексте звучит естественнее буквального «спустили».
- source_word: מִבֵּית יְהוָה
  choice: из дома Яхве
  rationale: Сохраняет образ «дома» и передаёт тетраграмматон личным именем «Яхве».
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: через ворота скороходов
  rationale: Близко следует синтаксису и лексике оригинала; функциональное значение названия поясняется в сноске.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дворец
  rationale: В современном русском ясно обозначает резиденцию царя; буквальное «дом царя» могло бы восприниматься как династия или семья.
- source_word: וַיֵּשֶׁב
  choice: И царь сел
  rationale: Явное повторение подлежащего устраняет возможную русскую двусмысленность после группы во множественном числе, не изменяя смысла.
- source_word: עַל כִּסֵּא הַמְּלָכִים
  choice: на престол царей
  rationale: Сохраняет необычное множественное число оригинала и династический мотив преемства.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация передаёт личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; «Яхве» сохраняет личное заветное имя и наиболее вероятную научную реконструкцию его произношения.
- issue: Династический смысл выражения כִּסֵּא הַמְּלָכִים
  choice: престол царей
  alternative: царский престол
  rationale: Буквальное множественное число сохраняет связь с престолом предшествующих царей и не сглаживает формулировку оригинала.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены «дом Яхве» и «престол царей» как значимые особенности еврейского текста; «царский дворец» выбран ради ясности. Маркеры сносок поставлены непосредственно после тех слов, которые они поясняют.
