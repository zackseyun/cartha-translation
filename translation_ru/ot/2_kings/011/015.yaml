base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: ru
  text: 'Тогда священник Иодай приказал начальникам сотен, поставленным над войском: «Выведите её между рядами[a], а всякого, кто последует за ней, убейте мечом». Ибо священник сказал: «Пусть её не убивают в доме Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение не вполне ясно. Возможны также переводы: «за ряды» или «через ряды»; вероятно, речь идёт о том, чтобы вывести её из храмового пространства через выстроенные ряды стражи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: начальникам сотен
  rationale: Сохранено древнее военное наименование без привнесения римского термина «центурионы».
- source_word: פְּקֻדֵי הַחַיִל
  choice: поставленным над войском
  rationale: Страдательное причастие от פקד передаёт назначение этих начальников ответственными за военную силу.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: Выведите её
  rationale: Каузативная форма יצא означает вывести или доставить наружу; «выведите» естественно передаёт приказ в данном контексте.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: за ряды
  rationale: Еврейское выражение синтаксически трудно и, вероятно, указывает на вывод Гофолии из храмового пространства за выстроенные ряды стражи; неопределённость отмечена в сноске.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: а всякого, кто последует за ней
  rationale: Причастие с артиклем в единственном числе имеет обобщающее значение и относится к любому, кто пойдёт вслед за ней или выступит на её стороне.
- source_word: הָמֵת בֶּחָרֶב
  choice: умертвите мечом
  rationale: Инфинитив абсолютный употреблён с силой повеления; формальное «умертвите» сохраняет характер официального приказа.
- source_word: אַל תּוּמַת
  choice: Пусть её не убивают
  rationale: Отрицательная форма со страдательным значением выражает запрет на её умерщвление в указанном месте.
- source_word: בֵּית יְהוָה
  choice: доме Яхве
  rationale: Буквальное «дом» сохраняет еврейское обозначение храма, а имя יְהוָה передано личным именем «Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан распространённой русской транслитерацией личного имени, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл следования за Гофолией
  choice: кто последует за ней
  alternative: кто войдёт вслед за ней
  rationale: Фраза может обозначать как физическое движение вслед за ней, так и поддержку её стороны; перевод не уточняет мотив и сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Военные и храмовые реалии переданы ясно, без анахроничной римской терминологии; трудное пространственное выражение не истолковано как однозначное.
