    rationale: Эта формулировка утверждает вывод за пределы рядов, хотя еврейская конструкция трудна и, по контексту, скорее допускает движение между или через ряды стражи. Основной текст следует сделать менее интерпретативным, оставив варианты в сноске.
  - severity: low
    issue: «Умертвите мечом» стилистически тяжеловесно.
    rationale: Русское «убейте мечом» естественнее для прямого приказа и не меняет ни юридически-насильственного характера, ни образа меча в оригинале.
