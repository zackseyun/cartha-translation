  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: ru
  text: Стражники[a] стояли, каждый со своим оружием в руке, от правой стороны храма до левой[b], у жертвенника и у храма[c], вокруг царя.
  philosophy: optimal-equivalence
  footnotes:
