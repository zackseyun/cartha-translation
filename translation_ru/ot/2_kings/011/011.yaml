    text: 'Буквально: «бегуны»; так называлась царская стража.'
    reason: lexical_alternative
  - marker: b
    text: Правую и левую стороны при храмовой ориентации можно понимать соответственно как южную и северную.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «дом»; здесь имеется в виду храмовое здание или храмовая территория.'
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: стражники
  rationale: Причастие буквально связано с бегом («бегуны»), но в данном царском и военном контексте обозначает вооружённую царскую стражу.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: каждый со своим оружием в руке
  rationale: אִישׁ имеет распределительное значение «каждый», а כְּלִי в контексте вооружённой охраны естественно передаётся как «оружие»; образ готовности сохранён.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: от правой стороны ... до левой
  rationale: כֶּתֶף буквально означает «плечо», но при описании здания указывает на его сторону или фланг.
- source_word: הַבַּיִת
  choice: храм
  rationale: Хотя буквально это «дом», в данном контексте несомненно имеется в виду храм; слово «храм» ясно и естественно для современного русского читателя.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: правой ... левой
  rationale: Основные пространственные значения слов — «правая» и «левая»; возможная храмовая ориентация «южная ... северная» сохранена в примечании.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: у жертвенника и у храма
  rationale: Предлог ל в сжатом пространственном описании допускает значение положения или направления; русское «у» естественно передаёт расположение, не задавая чрезмерной точности.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: окружив царя
  rationale: Выражение обозначает защитное расположение вокруг царя; деепричастная конструкция естественно связывает его с расстановкой стражи.
