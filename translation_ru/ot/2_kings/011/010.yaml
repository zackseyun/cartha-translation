base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: ru
  text: Тогда священник передал сотникам копья[a] и щиты, принадлежавшие царю Давиду и находившиеся в доме Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «копьё»; единственное число здесь может иметь собирательное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в храме Яхве»; буквально: «в доме Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Тогда ... передал
  rationale: Вав с последовательным значением продолжает повествование; «тогда» естественно передаёт ход событий, а «передал» подходит контексту выдачи оружия.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Прямое соответствие существительному в единственном числе с артиклем.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: сотникам
  rationale: Краткий и понятный русский военный термин для начальников подразделений по сто человек; сохраняет древнюю организационную реалиию.
- source_word: הַחֲנִית
  choice: копья
  rationale: 'Грамматически слово стоит в единственном числе, однако в данном контексте оно, вероятно, имеет собирательное значение: оружие передают нескольким начальникам наряду со щитами.'
- source_word: הַשְּׁלָטִים
  choice: щиты
  rationale: Наиболее вероятное значение термина в контексте царского вооружения, хранившегося при храме.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: принадлежавшие царю Давиду
  rationale: Естественно передаёт еврейскую конструкцию принадлежности, не уточняя сверх текста, были ли эти предметы личным оружием Давида или частью его царского арсенала.
- source_word: אֲשֶׁר בְּבֵית יְהוָה
  choice: и хранившиеся в доме Яхве
  rationale: Вторая относительная конструкция сообщает местонахождение предметов. «Хранившиеся» естественно выражает подразумеваемое постоянное нахождение, а «дом» сохраняет образность בַּיִת.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в исходном тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон; транслитерация «Яхве» позволяет читателю видеть личное Божье имя, не подменяя его титулом.
- issue: Единственное или собирательное значение הַחֲנִית
  choice: копья
  alternative: копьё
  rationale: Хотя форма единственного числа подлинно неоднозначна, распределение вооружения между несколькими сотниками и соседнее множественное «щиты» поддерживают собирательное прочтение; буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Сотники» передаёт военную должность кратко и без тяжеловесной кальки. Основной текст остаётся естественным, а морфологическая неоднозначность слова «копьё» и возможный перевод «дом» как «храм» сохранены в сносках.
