  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: ru
  text: И пошли священник Хелкия, Ахикам, Ахбор, Шафан и Асаия к пророчице Хулде, жене Шаллума, сына Тиквы, сына Хархаса, хранителя одежд. Она жила в Иерусалиме, во втором квартале[a], и они говорили с ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во втором районе»; вероятно, имеется в виду определённая часть Иерусалима.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: И пошли
  rationale: Форма с последовательным וַ передвигает повествование вперёд. Единственное число сказуемого перед рядом подлежащих естественно передаётся по-русски множественным числом.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: В стихе стоит обычное обозначение священника без слова «первосвященник», поэтому более высокий титул из контекста не добавляется.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: пророчица Хулда
  rationale: Существительное имеет явно выраженную форму женского рода; «пророчица» точно и естественно передаёт её.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: жена Шаллума
  rationale: Сопряжённая конструкция прямо обозначает брачные отношения.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: сына Тиквы, сына Хархаса
  rationale: Родословная цепочка сохранена без превращения второго בֶּן в пояснительное «внука», которого в еврейском тексте нет.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: хранитель одежд
  rationale: Буквальная и понятная передача официальной обязанности; контекст не требует уточнять, были ли это царские или храмовые одежды.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: Она жила
  rationale: Глагол יָשַׁב в сообщении о месте проживания означает «жить, обитать», а не буквально «сидеть».
- source_word: בַּמִּשְׁנֶה
  choice: во Втором квартале
  rationale: Вероятнее всего, это название определённой части Иерусалима. Заглавная буква обозначает топонимическое употребление, а лексическая неопределённость отмечена в сноске.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: и они говорили с ней
  rationale: Передаёт обращённую к Хулде речь и допускаемый контекстом оттенок беседы; более буквальное «говорили ей» по-русски здесь менее естественно.
theological_decisions:
- issue: Следует ли называть Хелкию первосвященником
  choice: священник
  alternative: первосвященник
  rationale: Сам стих содержит только הַכֹּהֵן, поэтому перевод не усиливает титул на основании других мест.
- issue: Передача женского пророческого звания
  choice: пророчица
  alternative: пророк
  rationale: Еврейское הַנְּבִיאָה морфологически и по референту имеет женский род; его сохранение не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис родословной цепочки намеренно близок к еврейскому тексту; имена переданы последовательной транслитерацией. Не добавлен отсутствующий в стихе титул «первосвященник».
