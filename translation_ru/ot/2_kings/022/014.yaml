  source_fidelity: В целом перевод точно передаёт состав участников, титул Хелкии без добавления «первосвященник», женский пророческий титул, родословную, должность Шаллума и место жительства. Однако בַּמִּשְׁנֶה — определённое название/обозначение квартала; в русском тексте уместнее не создавать впечатление официально закреплённого современного топонима заглавной буквой, сохранив неопределённость через строчное «втором квартале» и сноску.
