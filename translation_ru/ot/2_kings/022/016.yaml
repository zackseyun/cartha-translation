    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет торжественную пророческую формулу посланника и передаёт личное имя יהוה как «Яхве».
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» передаёт торжественную непосредственность и подчёркивает близость объявленного действия.
- source_word: מֵבִיא
  choice: навожу
  rationale: Причастная форма обозначает действие, представленное как уже приближающееся или неизбежное; настоящее время естественно передаёт этот оттенок по-русски.
- source_word: רָעָה
  choice: бедствие
  rationale: В данном контексте слово обозначает губительное последствие суда, а не нравственное зло.
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: на это место и на его жителей
  rationale: Естественная русская конструкция при глаголе «навести», точно сохраняющая оба объекта суда.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: всё то, о чём говорится в книге
  rationale: Передаёт смысл «всех слов книги» естественным современным русским языком и сохраняет их связь с объявленным бедствием; тире отражает appositional/уточняющую связь, не выраженную отдельным глаголом в еврейском тексте.
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: которую прочитал царь Иудеи
  rationale: Форма קרא сама по себе не требует уточнения «вслух», поэтому перевод сохраняет эту неоднозначность.
theological_decisions:
- issue: Значение רָעָה в речи о Божьем суде
  choice: бедствие
  alternative: зло
  rationale: Контекст указывает на карающее бедствие, которое постигнет место и его жителей. «Зло» могло бы ошибочно создать впечатление нравственного зла со стороны Бога.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное заветное имя; транслитерация сохраняет это различие.
- issue: Связь выражения «все слова книги» с объявленным бедствием
  choice: 'уточнение после тире: «всё то, о чём говорится в книге»'
  alternative: добавить глагол «исполню»
  rationale: В еврейском тексте отдельного глагола «исполню» нет. Уточняющая конструкция делает фразу понятной, не внося явно отсутствующего действия и сохраняя сжатость оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан ясным для обычного читателя, но сохранены образ «всех слов книги», аспект близкого действия и неопределённость относительно того, читал ли царь книгу вслух.
