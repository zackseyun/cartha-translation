  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Вот, Я наведу бедствие[a] на это место и на его жителей — всё, сказанное в книге, которую прочитал царь Иудеи».'
  philosophy: optimal-equivalence
  footnotes:
