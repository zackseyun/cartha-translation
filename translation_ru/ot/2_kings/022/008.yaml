  source_fidelity: 'Основной перевод точно передаёт еврейский текст: Хилкия назван первосвященником, Шафан — писцом; סֵפֶר הַתּוֹרָה передано как «книга Закона», а בְּבֵית יְהוָה — как «в доме Яхве». Однако «тот прочитал её» однозначно назначает Шафана субъектом последнего глагола, тогда как еврейское וַיִּקְרָאֵהוּ формально оставляет субъект невыраженным, хотя Шафан является наиболее естественным пониманием.'
