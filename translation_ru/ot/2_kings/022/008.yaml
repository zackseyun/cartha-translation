source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חִלְקִיָּ֜הוּ הַ/כֹּהֵ֤ן הַ/גָּדוֹל֙ עַל שָׁפָ֣ן הַ/סֹּפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֨ן חִלְקִיָּ֧ה אֶת הַ/סֵּ֛פֶר אֶל שָׁפָ֖ן וַ/יִּקְרָאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: ru
  text: 'Тогда первосвященник Хилкия сказал писцу Шафану: «Я нашёл книгу Закона[a] в доме Яхве[b]». И Хилкия передал книгу Шафану, и он прочитал её[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свиток Закона». Еврейское סֵפֶר может обозначать книгу или свиток.'
    reason: lexical_alternative
  - marker: b
    text: То есть в храме Яхве.
    reason: cultural_note
  - marker: c
    text: 'Или, менее вероятно: «прочитал из неё».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященник
  rationale: Устойчивое русское обозначение высшей священнической должности; буквальное «великий священник» здесь неестественно.
- source_word: הַסֹּפֵר
  choice: писец
  rationale: Сохраняет историческое обозначение грамотного царского или административного служащего, не сужая его роль до современного «секретаря».
- source_word: סֵפֶר הַתּוֹרָה
  choice: книга Закона
  rationale: В данном заветно-правовом контексте תּוֹרָה уместно передать как «Закон», а סֵפֶר может обозначать как книгу-документ, так и свиток.
- source_word: מָצָאתִי
  choice: я нашёл
  rationale: Русское прошедшее совершенного вида естественно выражает совершившееся обнаружение, результат которого важен в момент речи.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет образное и буквальное выражение «дом Яхве»; по контексту речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: וַיִּתֵּן ... אֶת הַסֵּפֶר
  choice: передал книгу
  rationale: В ситуации вручения документа русское «передал» естественнее буквального «дал» и точно передаёт действие.
- source_word: וַיִּקְרָאֵהוּ
  choice: и тот прочитал её
  rationale: Местоименный суффикс естественно относится к книге, а ближайшим вероятным субъектом является Шафан. Конструкция «и тот» устраняет неуместную для русского неясность между двумя мужчинами, не скрывая менее вероятный вариант чтения глагола в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
- issue: Значение תּוֹרָה в названии найденного текста
  choice: Закон
  alternative: Учение; наставление
  rationale: Хотя תּוֹרָה имеет более широкий смысл «наставление», в данном повествовании речь идёт о заветном нормативном тексте; «Закон» сохраняет это значение без уточнения состава книги.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Имена переданы близко к еврейской форме: «Хилкия», «Шафан». Синтаксис простой и ясный; термин «писец» сохраняет исторический колорит.'
