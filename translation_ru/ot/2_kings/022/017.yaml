  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: ru
  text: за то, что они оставили Меня и совершали воскурения другим богам[a], чтобы разгневать Меня всем, что сделали их руки. Поэтому Мой гнев воспылает в этом месте и не угаснет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, конкретнее: «кадили другим богам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: за то, что
  rationale: Оборот вводит причину суда; «за то, что» естественно связывает проступок с последующим воздаянием и сохраняет зависимость от контекста.
- source_word: עֲזָבוּנִי
  choice: они оставили Меня
  rationale: Глагол עזב передаёт оставление и отступничество; «оставили» звучит естественно и сохраняет relational, covenantal weight without adding interpretation.
- source_word: וַיְקַטְּרוּ
  choice: сжигали приношения
  rationale: Пиэль קטר обозначает культовое возжигание приношений и нередко, но не исключительно, каждение. Основной текст сохраняет более широкий смысл, а конкретный вариант вынесен в сноску.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Прямой и обычный эквивалент, обозначающий иных божеств, которым совершалось служение.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: чтобы разгневать Меня
  rationale: Сохраняет целевую или результативную силу לְמַעַן и явное указание на вызванный Божий гнев.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: всеми делами своих рук
  rationale: Сохранён образный еврейский оборот, который в контексте указывает на созданное и совершённое ими, особенно на идолопоклонство.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: Поэтому Мой гнев воспылал
  rationale: «Воспылал» сохраняет огненную метафору יצת, а «гнев» естественно передаёт חמה в торжественном контексте суда. «Поэтому» ясно выражает следствие, заданное начальным причинным оборотом.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: против этого места
  rationale: Хотя предлог буквально может означать «в», здесь место выступает объектом суда; «против» естественно выражает направленность гнева.
- source_word: וְלֹא תִכְבֶּה
  choice: и не угаснет
  rationale: Передаёт образ огня, который невозможно погасить, и сохраняет категоричность грядущего суда.
theological_decisions:
- issue: Антропопатический язык о Божьем гневе
  choice: Сохранить прямое указание на то, что люди разгневали Бога и что Его гнев воспылал
  alternative: Ослабить формулировку до безличного утверждения о наступлении суда
  rationale: Еврейский текст намеренно использует личностный и эмоционально насыщенный язык; перевод не должен превращать его в отвлечённое описание последствий.
- issue: Огненный образ Божьего суда
  choice: Сохранить метафорическую связь между «воспылал» и «не угаснет»
  alternative: Передать лишь неизбежность наказания без образа огня
  rationale: Образ негасимого огня внутренне связывает обе части высказывания и несёт существенную риторическую и богословскую нагрузку без необходимости уточнять её позднейшими доктринальными категориями.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимения, относящиеся к Богу, даны с прописной буквы по принятой русской издательской традиции; архаизмы вроде «сие» и «дела рук своих» не используются.
