review_pass:
  verdict: revise
  source_fidelity: Начальное «за то, что» верно передаёт תַּחַת אֲשֶׁר. Однако בַּמָּקוֹם הַזֶּה означает «в этом месте», а не «против этого места»; направленность суда может подразумеваться контекстом, но не должна подменять предлог в переводе. Согласованные формы «воспылает ... не угаснет» естественно передают пророческое возвещение и сохраняют образ огня.
  naturalness: «Сжигали приношения» понятно, но несколько неуклюже и может создавать впечатление, что речь обязательно о сожжении жертв. «Совершали воскурения» — естественный литературно-библейский оборот, сохраняющий культово-огненный характер без излишнего сужения до одного вида приношения. «Всем, что сделали их руки» современнее, чем «всеми делами своих рук», и сохраняет смысл идиомы.
  terminology: «Другим богам», «разгневать Меня», «Мой гнев», «воспылает» и «не угаснет» уместны. Сноска с вариантом «кадили» должна остаться, поскольку קטר нередко конкретно обозначает воскурение благовоний.
  issues:
  - severity: medium
    issue: «против этого места» вместо «в этом месте»
    rationale: В еврейском тексте стоит בַּמָּקוֹם הַזֶּה, буквально «в этом месте». Перевод «против» следует английской адаптации, но изменяет выраженное предлогом пространственное отношение.
  - severity: low
    issue: «сжигали приношения»
    rationale: Формулировка менее естественна по-русски и способна чрезмерно конкретизировать культовое действие. «Совершали воскурения» точнее передаёт קטר как ритуальное возжигание.
  revised_text: за то, что они оставили Меня и совершали воскурения другим богам[a], чтобы разгневать Меня всем, что сделали их руки. Поэтому Мой гнев воспылает в этом месте и не угаснет.
