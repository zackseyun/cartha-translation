  source_fidelity: 'Русский текст точно передаёт все основные элементы древнееврейского оригинала: нравственную оценку поступков Иосии, идиому «в глазах Яхве», полное следование пути Давида и отсутствие уклонения «ни вправо, ни влево». «Во всём следовал путём» — естественная и достаточно близкая передача בְּכָל דֶּרֶךְ. Передача אָבִיו как «предка» корректно отражает династическое значение слова в данном контексте, а сноска сохраняет буквальную форму оригинала.'
