  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: ru
  text: Он делал то, что было правильно в глазах Яхве, во всём следовал путём своего предка Давида[a] и не уклонялся ни вправо, ни влево.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Давида, своего отца». Здесь слово «отец» употреблено в более широком смысле — «предок» или «династический праотец».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Он делал то, что было правильно
  rationale: Субстантивированное прилагательное הַיָּשָׁר передано естественным русским оборотом; глагол несовершенного вида уместен как характеристика поведения Иосии.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образный древнееврейский оборот оценки, понятный современному русскому читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: во всём следовал путём
  rationale: Передана метафора пути и полнота соответствия образцу; буквальное «ходил по всему пути» по-русски звучало бы неестественно.
- source_word: דָּוִד אָבִיו
  choice: своего предка Давида
  rationale: אָב может обозначать не только непосредственного отца, но и предка; здесь Давид — династический праотец Иосии. Выбор устраняет фактическое недоразумение, а исходный широкий смысл отмечен сноской.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: и не уклонялся ни вправо, ни влево
  rationale: Сохранена пространственная метафора неотступного следования верному пути и парная отрицательная конструкция.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение אָבִיו по отношению к Давиду
  choice: своего предка Давида
  alternative: Давида, своего отца
  rationale: Давид не был непосредственным отцом Иосии; древнееврейское אָב допускает значение «предок, праотец». Такой перевод передаёт историко-династический смысл без внесения особого богословского толкования.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской образностью. Формулировка ясная и dignified: сохранены образы «в глазах» и пути, но устранены неестественные для русского синтаксические кальки.'
