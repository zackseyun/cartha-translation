  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: ru
  text: 'И пришёл царский писец Шафан к царю и доложил царю, сказав: «Твои слуги высыпали серебро, найденное в доме[a], и передали его в руки работникам, поставленным над домом Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в храме; буквально: «в доме».'
    reason: cultural_note
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: писец
  rationale: Сохраняет основное значение слова и уместно для придворного должностного лица, хотя в данном контексте возможно также «секретарь».
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: передал ... ответ
  rationale: Естественно передаёт еврейскую идиому возвращения с сообщением, не утяжеляя русский синтаксис.
- source_word: הִתִּיכוּ
  choice: высыпали
  rationale: В контексте храмовых сборов речь идёт не о плавке, а об опорожнении вместилища и извлечении собранного серебра; «высыпали» сохраняет конкретный образ.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: Сохраняет прямое лексическое значение, при этом в контексте серебро служит денежными средствами.
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: найденное в доме
  rationale: Сохраняет буквальное «дом»; из контекста ясно, что имеется в виду храм.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: передали его в распоряжение
  rationale: Передаёт смысл еврейской идиомы «дали на руку» — вверили или передали под ответственность — естественным современным русским выражением.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: исполнителей работ
  rationale: Обозначает людей, непосредственно ведущих храмовые работы, и сочетается с их надзорной ответственностью.
- source_word: הַמֻּפְקָדִים
  choice: поставленных над
  rationale: Сохраняет пассивное значение назначения и указание на ответственность за работы при храме.
- source_word: בֵּית יְהוָה
  choice: домом Яхве
  rationale: Сохраняет образ «дома» как обозначение храма и прямо передаёт личное имя в тетраграмматоне.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя; транслитерация сохраняет отличие имени от титула.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное «И» сохраняет повествовательную связь; административные выражения переданы понятно и без архаизации.
