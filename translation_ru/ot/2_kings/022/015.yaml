  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: ru
  text: 'И сказала она им: «Так говорит Яхве, Бог Израиля: скажите человеку, который послал вас ко мне:»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: И сказала она им
  rationale: Передаёт последовательное повествовательное действие и женский род глагола, относящийся к пророчице Олдаме; местоимение «она» делает род явным и естественно звучит по-русски.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчиво и точно передаёт древнееврейскую пророческую формулу в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт сопряжённую конструкцию и приложение к имени Яхве.
- source_word: אִמְרוּ לָאִישׁ
  choice: скажите человеку
  rationale: Императив множественного числа обращён ко всей делегации. «Человеку» — естественное русское соответствие определённому אִישׁ; контекст однозначно указывает на мужчину, пославшего делегацию.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: который послал вас ко мне
  rationale: Точно и естественно передаёт относительное придаточное, включая множественное «вас» и направление «ко мне».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его и не подменяет титулом.
- issue: Обозначение пославшего делегацию словом אִישׁ
  choice: человеку
  alternative: мужчине
  rationale: 'Русское «человеку» здесь естественно обозначает конкретного мужчину и сохраняет примечательную особенность текста: Олдама пока не называет его царём. «Мужчине» звучало бы неестественно и вносило бы ненужное противопоставление по полу.'
translation_notes:
  register: Современный литературный русский с сохранением достоинства пророческой речи. Формула «Так говорит» оставлена краткой и торжественной. Двоеточие в конце показывает, что порученная речь продолжается в следующем стихе.
