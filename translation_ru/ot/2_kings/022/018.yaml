  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: ru
  text: 'А царю Иудеи, который послал вас вопросить Яхве, скажите так: «Так говорит Яхве, Бог Израиля: что касается слов, которые ты услышал…[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза здесь остаётся синтаксически незавершённой и получает продолжение в следующем стихе. Возможна также передача: «О словах, которые ты услышал…»'
    reason: Сохранение синтаксической незавершённости и указание лексической альтернативы.
lexical_decisions:
- source_word: וְאֶל
  choice: А царю
  rationale: Сочетание союза и предлога обозначает переход от предыдущего адресата к царю; «А царю» естественно передаёт этот поворот речи.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царю Иудеи
  rationale: Прямая и общепринятая передача еврейского сопряжённого сочетания.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: который послал вас
  rationale: Причастие употреблено атрибутивно и естественно передаётся определительным придаточным; прошедшее время соответствует уже совершённому поручению.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: вопросить Яхве
  rationale: В данном контексте דרשׁ означает обратиться к Богу за ответом через пророческое вопрошание; «вопросить» сохраняет этот смысл и достойный библейский регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: скажите так
  rationale: Краткая естественная формула сохраняет указательное значение כֹּה и повелительную силу обращения во множественном числе.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся русская передача пророческой посланнической формулы, сохраняющая формальный характер оригинала.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача еврейского сопряжённого сочетания.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: что же до слов, которые ты услышал…
  rationale: Тематическая конструкция в еврейском тексте остаётся незавершённой до следующего стиха; оборот «что же до» и многоточие сохраняют это синтаксическое ожидание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст употребляет тетраграмматон как личное имя; транслитерация сохраняет различие между именем Бога и титулом.
- issue: Синтаксическая незавершённость заключительной фразы
  choice: Сохранить подвешенную тематическую конструкцию
  alternative: Синтаксически завершить мысль внутри стиха
  rationale: Фраза получает продолжение в следующем стихе; преждевременное завершение устранило бы подлинную неоднозначность и риторическое напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим регистром. Формула «Так говорит» сохранена как узнаваемая и точная; архаизация сведена к контекстуально уместному глаголу «вопросить».
