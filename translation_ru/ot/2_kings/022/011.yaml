  yaml_path: translation/ot/2_kings/022/011.yaml
  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: ru
  text: Когда царь услышал слова книги Закона[a], он разорвал на себе одежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свитка Закона». Еврейское слово סֵפֶר может обозначать письменный документ — свиток или книгу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда ... услышал
  rationale: Сочетание повествовательной формы וַיְהִי с временной конструкцией כִּשְׁמֹעַ естественно передаётся по-русски придаточным времени; отдельное «и было» утяжелило бы фразу.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Прямой современный эквивалент определённого существительного; определённость в русском контексте передаётся без артикля.
- source_word: דִּבְרֵי
  choice: слова
  rationale: Сохраняет конкретную связь с услышанным чтением текста, не сводя выражение лишь к общему содержанию.
- source_word: סֵפֶר הַתּוֹרָה
  choice: книга Закона
  rationale: Сֵפֶר обозначает письменный документ, в данном случае, вероятно, свиток; «книга» остаётся естественным и традиционно понятным обозначением. תּוֹרָה в контексте относится к нормативному заветному тексту и передана как «Закон».
- source_word: וַיִּקְרַע
  choice: он разорвал на себе
  rationale: Глагол קרע означает «разрывать». Добавление «на себе» естественно для русского описания жеста скорби и ясно показывает, что царь разорвал собственную одежду, не меняя смысла.
- source_word: בְּגָדָיו
  choice: одежды
  rationale: Форма множественного числа сохранена. «Одежды» звучит достойно и уместно для древнего повествования, не предполагая именно царских одеяний.
