revisions:
- from: 'Поэтому вот: Я приобщу тебя к твоим отцам, и ты будешь погребён в своих гробницах с миром[a]. Твои глаза не увидят всего бедствия, которое Я наведу на это место». И они передали царю ответ.'
  to: 'Итак, вот: Я соединю тебя с твоими отцами, и ты будешь погребён в родовых гробницах с миром[a]. Твои глаза не увидят всего бедствия, которое Я обрушу на это место». И они принесли царю ответ.'
  rationale: Исправлены неестественные или семантически окрашенные русские формулировки. «Соединю ... с отцами» передаёт идиому смерти без таинственной коннотации «приобщу». «Родовые гробницы» сохраняет множественное число исходного текста и делает погребальную формулу понятной по-русски. Буквальное «с миром» и поясняющая сноска оставляют историко-текстуальное напряжение неразрешённым.
