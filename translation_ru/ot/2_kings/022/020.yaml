  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: ru
  text: 'Итак, вот: Я соединю тебя с твоими отцами, и ты будешь погребён в родовых гробницах с миром[a]. Твои глаза не увидят всего бедствия, которое Я обрушу на это место». И они принесли царю ответ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в мире». Буквально: «с миром». Возможно, имеется в виду, что Иосия умрёт прежде, чем увидит грядущее бедствие, а не то, что здесь точно указываются обстоятельства его смерти.'
    reason: Сохраняет лексическую неоднозначность בְּשָׁלוֹם и не устраняет напряжения с рассказом о смерти Иосии в сражении.
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего Божьего ответа на смирение Иосии.
- source_word: הִנְנִי
  choice: вот
  rationale: Сохраняет торжественное указание на последующее Божье действие и естественно звучит в современной русской пророческой речи.
- source_word: אֹסִפְךָ עַל אֲבֹתֶיךָ
  choice: Я приобщу тебя к твоим отцам
  rationale: Передаёт идиому смерти и присоединения к умершим предкам; «приобщу» в русском естественнее буквального «соберу», сохраняя возвышенный регистр.
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: ты будешь погребён в своих гробницах
  rationale: Передаёт смысл пассивной идиомы естественным русским выражением и сохраняет необычное множественное число קִבְרֹתֶיךָ.
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: Буквально сохраняет существительное שָׁלוֹם и не сводит выражение однозначно к спокойному способу смерти.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Твои глаза не увидят
  rationale: Сохраняет явно названный в еврейском тексте субъект «твои глаза» и образность выражения.
- source_word: הָרָעָה
  choice: бедствие
  rationale: В контексте речь идёт о грядущем губительном суде, а не о нравственном зле.
- source_word: מֵבִיא עַל
  choice: наведу на
  rationale: Естественное русское сочетание для наступающего бедствия; будущее время ясно передаёт предстоящее действие.
- source_word: הַמָּקוֹם הַזֶּה
  choice: это место
  rationale: Сохраняет широкое обозначение места, не сужая его толкованием до города, храма или всей земли.
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: И они передали царю ответ
  rationale: Естественно передаёт еврейскую формулу возвращения к царю с полученным сообщением.
theological_decisions:
- issue: Значение выражения «с миром» в свете гибели Иосии в сражении (4 Царств 23:29)
  choice: Сохранить буквальное «с миром» и пояснить возможный контекстуальный смысл в сноске.
  alternative: Перевести «спокойно», однозначно описав способ смерти.
  rationale: Еврейская формулировка сохраняет напряжение с последующим повествованием. Следующая часть стиха связывает обещание прежде всего с тем, что Иосия не увидит бедствия, которое постигнет это место; перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром пророческой речи. Синтаксис сделан ясным для обычного читателя; образ «твои глаза не увидят» и формула «с миром» сохранены.
