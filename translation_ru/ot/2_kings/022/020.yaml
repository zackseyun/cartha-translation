    issue: «Приобщу тебя к твоим отцам»
    rationale: «Приобщить» в современном литературном русском преимущественно означает допустить к чему-либо или причастить; это добавляет нежелательную церковную окраску и слабее передаёт идиому собирания к предкам.
  - severity: medium
    issue: «Ты будешь погребён в своих гробницах»
    rationale: Фраза неестественна и буквально предполагает несколько гробниц для одного человека. Еврейское множественное число можно естественно сохранить как «родовые гробницы».
  - severity: low
    issue: «Поэтому вот» и «наведу бедствие»
    rationale: Оба оборота понятны, но «Итак, вот» и «обрушу ... бедствие» звучат в современном литературном русском более плавно при сохранении возвышенного регистра.
