revisions:
- from: Пойдите и вопросите Яхве[a] от моего имени, от имени народа и всей Иудеи о словах этой найденной книги. Ведь велик гнев Яхве, возгоревшийся на нас, потому что наши отцы[b] не слушались слов этой книги и не поступали согласно всему, что написано о нас.
  to: Пойдите, обратитесь к Яхве[a] с вопросом за меня, за народ и за всю Иудею о словах этой найденной книги. Ибо велик гнев Яхве, возгоревшийся на нас, потому что наши отцы[b] не слушали слов этой книги, чтобы поступать согласно всему написанному о нас.
