source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: ru
  text: Пойдите, обратитесь к Яхве[a] с вопросом за меня, за народ и за всю Иудею о словах этой найденной книги. Ибо велик гнев Яхве, возгоревшийся на нас, потому что наши отцы[b] не слушали слов этой книги, чтобы поступать согласно всему написанному о нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взыщите Яхве» или «вопросите Яхве». Еврейский глагол может означать как стремление к Богу вообще, так и обращение к Нему за ответом или указанием; здесь контекст указывает на официальное вопрошание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наши предки». Буквально: «наши отцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: вопросите Яхве
  rationale: Глагол דרשׁ с Богом в качестве объекта здесь обозначает обращение за божественным ответом или указанием. «Вопросите» передаёт официальный характер обращения, оставаясь понятным в возвышенном повествовательном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в исходном тексте.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: от моего имени, от имени народа и всей Иудеи
  rationale: Предлог בְּעַד выражает действие в интересах или от лица названных лиц. Такая формулировка естественна по-русски и не создаёт ложного смысла вопроса непосредственно «о» царе.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: о словах этой найденной книги
  rationale: Сохраняется внимание к словам книги, а причастие הַנִּמְצָא передано естественным русским определением.
- source_word: חֲמַת יְהוָה
  choice: гнев Яхве
  rationale: חֵמָה обозначает сильный, пылающий гнев; «гнев» сохраняет судебный и заветный контекст без стилистического преувеличения.
- source_word: נִצְּתָה בָנוּ
  choice: возгоревшийся на нас
  rationale: Сохраняется образ воспламенившегося гнева и его направленность против общины.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: наши отцы не слушались
  rationale: «Не слушались» сочетает буквальный оттенок слышания с подразумеваемым неповиновением, которое далее раскрывает оборот с לַעֲשׂוֹת.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: не поступали согласно всему, что написано
  rationale: Переданы практическое исполнение, сравнительный предлог כְּ и всеобъемлющая сила כָּל. Союзное оформление делает причинно-следственную связь естественной по-русски.
- source_word: עָלֵינוּ
  choice: о нас
  rationale: 'Предлог оставлен семантически широким: написанное относится к общине, но перевод не сужает смысл заранее до постановлений «для нас» или приговора «против нас».'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя. «Яхве» прямо сохраняет имя и не заменяет его титулом.
- issue: Гендерно маркированное אֲבֹתֵינוּ
  choice: наши отцы
  alternative: наши предки
  rationale: Еврейское существительное имеет мужскую форму и в данном контексте указывает на отцов народа; буквальная передача уместна и понятна.
- issue: Связь слышания и исполнения
  choice: не слушались ... и не поступали
  alternative: не внимали ... чтобы поступать
  rationale: Такая формулировка сохраняет как мотив непослушания, так и явно названное отсутствие исполнения, не сводя שׁמע исключительно ни к физическому слышанию, ни к абстрактному повиновению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Вопросите» сохраняет торжественный характер официального обращения, а остальной синтаксис сделан ясным для современного читателя.
