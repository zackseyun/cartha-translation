translation:
  language: ru
  text: ремесленникам, строителям и каменщикам[c], и на покупку древесины и камня из каменоломни[b], чтобы укрепить дом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм, дом Господа, как видно из контекста.
    reason: cross_reference
  - marker: b
    text: 'Или: «тёсаного камня»; «обработанного камня».'
    reason: lexical_alternative
  - marker: c
    text: Слово, переведённое как «каменщики», буквально обозначает тех, кто возводит или ремонтирует стены и ограды.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: ремесленникам
  rationale: Слово обозначает квалифицированных мастеров вообще, а не только плотников; «ремесленникам» сохраняет широкий смысл в строительном контексте.
- source_word: וְלַבֹּנִים
  choice: строителям
  rationale: Причастная форма от בנה прямо обозначает тех, кто занимается строительством.
- source_word: וְלַגֹּדְרִים
  choice: каменщикам
  rationale: Буквально речь идёт о тех, кто возводит или чинит стены и ограды; в контексте ремонта храма естественный русский профессиональный термин — «каменщики», а буквальный образ пояснён в сноске.
- source_word: וְלִקְנוֹת
  choice: а также на покупку
  rationale: Инфинитив с ל продолжает перечисление назначений средств; эта формулировка естественно передаёт целевое значение по-русски.
- source_word: עֵצִים
  choice: древесины
  rationale: В перечне строительных материалов имеется в виду обработанная или предназначенная для строительства древесина, а не живые деревья.
- source_word: וְאַבְנֵי מַחְצֵב
  choice: и камня из каменоломни
  rationale: Фраза указывает на добытый в каменоломне строительный камень; такой перевод прозрачен современному читателю и не уточняет без необходимости степень его обработки.
- source_word: לְחַזֵּק
  choice: чтобы укрепить
  rationale: Сохраняется основное значение חזק — сделать крепким, укрепить; в данном контексте это часть храмового ремонта.
- source_word: אֶת־הַבָּיִת
  choice: дом
  rationale: В еврейском тексте буквально стоит «дом»; из контекста это дом Господа, то есть храм, что поясняется в сноске без замены исходного образа в основном тексте.
