base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: ru
  text: 'И повелел царь священнику Хилкии, Ахикаму, сыну Шафана, Ахбору, сыну Михеи, писцу Шафану[a] и Асаии, царскому слуге[b], сказав:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «секретарю Шафану». Еврейское слово может обозначать писца или царского административного секретаря.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Асаии, царскому служащему». Буквально: «слуге царя»; при царском дворе так могли называть должностное лицо, состоявшее на царской службе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: повелел
  rationale: Передаёт властный характер царского распоряжения и повествовательную форму прошедшего времени.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: священнику Хилкии
  rationale: Еврейский текст называет Хилкию «священником», не добавляя в этом стихе титула «первосвященник».
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ахикаму, сыну Шафана
  rationale: Естественная русская передача родового обозначения בֶּן.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: Ахбору, сыну Михаи
  rationale: Имена переданы в формах, близких к еврейскому звучанию и принятых в русской библейской традиции.
- source_word: שָׁפָן הַסֹּפֵר
  choice: писцу Шафану
  rationale: סֹפֵר обозначает писца, а при царском дворе также могло означать секретаря; основной текст сохраняет прямое лексическое значение.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Асаии, царскому слуге
  rationale: Буквально עֶבֶד — «слуга»; в придворном контексте слово может обозначать царского служащего или сановника.
- source_word: לֵאמֹר
  choice: 'сказав:'
  rationale: Сохраняет формулу введения прямой речи и связь с повелением, содержание которого следует в следующем стихе.
theological_decisions:
- issue: Статус Хилкии
  choice: священник
  alternative: первосвященник
  rationale: Хотя контекст может указывать на высокий священнический статус Хилкии, в данном стихе стоит только הַכֹּהֵן — «священник».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Порядок перечисления сохранён; падежные формы делают длинную конструкцию естественной по-русски. Начальное «И» передаёт повествовательную связь וַ־ с предыдущим стихом.
