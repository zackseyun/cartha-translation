base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: ru
  text: 'За то, что сердце твоё было мягким и ты смирился перед Яхве, услышав, что Я сказал об этом месте и его жителях: что они станут запустением[a] и проклятием, — и за то, что ты разорвал одежды и плакал передо Мною, Я также услышал тебя, — возвещает Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предметом ужаса»; возможен также смысл «предметом изумления». Еврейское слово שַׁמָּה в контексте суда может обозначать запустение, ужас или зрелище, вызывающее изумление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: за то, что
  rationale: Передаёт причинное основание Божьего ответа и естественно связывается с повторным וְ перед второй причиной.
- source_word: רַךְ לְבָבְךָ
  choice: твоё сердце смягчилось
  rationale: Сохраняет образ сердца, ставшего мягким и восприимчивым, и в современном русском выражает сокрушённую отзывчивость, а не слабость.
- source_word: וַתִּכָּנַע
  choice: ты смирился
  rationale: Передаёт добровольное смирение перед Богом без добавления более узкого значения покаяния.
- source_word: מִפְּנֵי יְהוָה
  choice: перед Яхве
  rationale: Естественно передаёт устойчивое выражение со значением пребывания перед Божьим лицом; имя יהוה транслитерировано как «Яхве».
- source_word: בְּשָׁמְעֲךָ
  choice: услышав
  rationale: Деепричастие кратко и естественно передаёт временно-обстоятельственное значение еврейской конструкции.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: что Я сказал
  rationale: Указывает на содержание Божьего речения и звучит естественно в современном русском.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: об этом месте и его жителях
  rationale: Предлог עַל при глаголе речи допускает нейтральное «об»; последующее содержание ясно выражает враждебный судебный приговор без необходимости усиливать предлог словом «против».
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: они станут предметом ужаса и проклятия
  rationale: שַׁמָּה в формулах суда часто обозначает вызывающее ужас зрелище или предмет ужаса; место и жители совместно понимаются как объект объявленного суда. Смысловой вариант отмечен в сноске.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: ты разорвал на себе одежды
  rationale: Передаёт установленный жест скорби; «на себе» естественно поясняет русскую идиому, не меняя смысла.
- source_word: וַתִּבְכֶּה לְפָנָי
  choice: плакал предо Мной
  rationale: Сохраняет личное Божье обращение и возвышенный, но понятный регистр.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: Я тоже услышал тебя
  rationale: «Тоже» воспроизводит соответствие между откликом Иосии и Божьим ответом; объект «тебя» подразумевается контекстом и необходим для естественного русского.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Сохраняет торжественность пророческой формулы и отличает её от обычного глагола речи.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Характер внутреннего отклика Иосии
  choice: сердце смягчилось
  alternative: сердце было мягким; сердце стало отзывчивым
  rationale: Перевод сохраняет телесную метафору רַךְ לֵבָב и не сводит её исключительно к одной систематической категории, хотя контекст указывает на сокрушение и смирение.
- issue: Значение שַׁמָּה в судебном речении
  choice: предмет ужаса
  alternative: опустошение; предмет изумления
  rationale: Слово допускает состояние опустошения и реакцию ужаса или изумления. В основном тексте выбран естественный для формулы суда смысл, а подлинная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Формы «предо Мной» и «возвещает» поддерживают торжественность прямой Божьей речи, оставаясь понятными; синтаксис причинного периода сохранён, но расчленён двоеточием и тире для ясности.
