  text: בֶּן שְׁמֹנֶ֤ה שָׁנָה֙ יֹאשִׁיָּ֣הוּ בְ/מָלְכ֔/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְדִידָ֥ה בַת עֲדָ֖יָה מִ/בָּצְקַֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: ru
  text: Иосии было восемь лет, когда он стал царём, и тридцать один год он царствовал в Иерусалиме. Его мать звали Иедида; она была дочерью Адаии из Боцката.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: Иосии было восемь лет
  rationale: Стандартное древнееврейское выражение возраста буквально означает «сын восьми лет»; по-русски естественно передать его конструкцией «было восемь лет».
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Форма указывает на возраст Иосии при вступлении на престол. Эта формулировка ясна и естественна в современном русском языке.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти и в данном контексте входит в обычную формулу сообщения о продолжительности правления.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: тридцать один год
  rationale: Естественная русская форма числительного с надлежащим согласованием существительного.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места царствования.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Современная и естественная русская передача древнееврейской именной формулы «имя его матери».
- source_word: יְדִידָה
  choice: Иедида
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: בַת עֲדָיָה
  choice: дочерью Адаии
  rationale: Стандартная передача родственной связи; имя транслитерировано в принятой русской библейской форме.
- source_word: מִבָּצְקַת
  choice: из Боцката
  rationale: Предлог מִן указывает на происхождение; «из» прямо и естественно передаёт это значение.
theological_decisions: []
