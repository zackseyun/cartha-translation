source:
  edition: WLC
  text: עֲלֵ֗ה אֶל חִלְקִיָּ֨הוּ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְ/יַתֵּ֣ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה אֲשֶׁ֥ר אָסְפ֛וּ שֹׁמְרֵ֥י הַ/סַּ֖ף מֵ/אֵ֥ת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: ru
  text: Поднимись к первосвященнику Хилкии, и пусть он подсчитает серебро, принесённое в дом Яхве, которое стражи порога[a] собрали у народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привратники»; буквально: «стражи порога».'
    reason: Лексическое выражение обозначает храмовых служителей, охранявших вход; сноска даёт естественный функциональный эквивалент.
lexical_decisions:
- source_word: עֲלֵה
  choice: Поднимись
  rationale: Повелительная форма глагола עלה выражает движение вверх. Перевод сохраняет направительный оттенок, уместный при походе к храму.
- source_word: חִלְקִיָּהוּ
  choice: Хилкия
  rationale: 'Имя передано русской транслитерацией с древнееврейского; после предлога употреблён родительный падеж: «к Хилкии».'
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященник
  rationale: Это общепринятое и естественное русское обозначение высшей священнической должности.
- source_word: וְיַתֵּם
  choice: и пусть он подсчитает
  rationale: В контексте храмовых средств форма от תמם означает завершить их исчисление, то есть установить итоговую сумму. «Подсчитает» естественно передаёт административный смысл.
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: Сохранено буквальное значение существительного; в данном контексте серебро служит денежными средствами.
- source_word: הַמּוּבָא
  choice: принесённое
  rationale: Страдательное причастие передаёт серебро как уже доставленное в храм.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранён образ «дома» как обозначение храма и личное имя יהוה.
- source_word: אָסְפוּ
  choice: собрали
  rationale: Глагол означает «собирать»; совершенный вид естественно передаёт завершённый сбор средств.
- source_word: שֹׁמְרֵי הַסַּף
  choice: стражи порога
  rationale: Основной текст сохраняет буквальный образ должности; функциональный эквивалент «привратники» дан в сноске.
- source_word: מֵאֵת הָעָם
  choice: у народа
  rationale: В финансовом контексте естественно передаёт источник собранных средств без сужения значения «народ».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога, а не титул; транслитерация «Яхве» сохраняет его как личное имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис остаётся близким к древнееврейскому, но не звучит архаично; храмовая и финансовая терминология понятна широкому читателю.
