base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: ru
  text: и пусть он передаст это в распоряжение исполнителей работ, назначенных в доме Яхве,[a] а те пусть передадут это исполнителям работ, находящимся в доме Яхве, чтобы исправить повреждения дома.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть даст это на руку исполнителей работ». Это выражение означает передать под их ответственность или в их распоряжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы укрепить повреждение дома», то есть отремонтировать повреждённые места.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנָה עַל יַד
  choice: и пусть он передаст это в руки
  rationale: נתן буквально означает «дать», а в сочетании с עַל יַד выражает передачу под чьё-либо распоряжение. Побудительная форма передана конструкцией «пусть… передаст»; местоимение «это» естественно указывает на упомянутые ранее деньги, не навязывая им несвойственного русскому языку рода.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: тех, кто ведёт работы / работникам
  rationale: Буквально — «исполняющие работу». В первом употреблении контекст и последующее הַמֻּפְקָדִים указывают на ответственных за ведение работ; во втором естественно краткое «работникам». Различие формулировок не превращает их непременно в разные профессиональные категории.
- source_word: הַמֻּפְקָדִים
  choice: назначен
  rationale: Пассивная форма от פקד означает тех, кто назначен или поставлен ответственным. Перевод сохраняет пассивный оттенок, не уточняя должность сверх текста.
- source_word: בְּבֵית יְהוָה
  choice: при доме Яхве / в доме Яхве
  rationale: בית передано буквально как «дом». При первом упоминании «при доме» естественно обозначает сферу назначения ответственных, а во втором «в доме» сохраняет явное указание места.
- source_word: וְיִתְּנוּ אֹתוֹ
  choice: а они пусть отдадут это
  rationale: Сохранены множественное число субъекта и распорядительная сила глагольной формы. «Отдадут» ясно передаёт следующий этап передачи средств.
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: чтобы устранить повреждения дома
  rationale: חזק буквально значит «укреплять», но в строительном контексте сочетание относится к ремонту повреждённых мест. Русское «устранить повреждения» естественно передаёт цель расходования средств; буквальный образ отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное заветное имя יהוה. Форма «Яхве» передаёт его как имя и не заменяет титулом; огласовка исходного написания не позволяет установить древнее произношение с полной уверенностью.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского повествования звучанием. Повтор «дом Яхве» сохранён ради связи с еврейским текстом; управленческие должности не конкретизированы сверх сказанного в источнике.
