  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: ru
  text: 'В восемнадцатый год царствования Иосии царь послал писца Шафана, сына Ацалии, сына Мешуллама, в дом Яхве[a] со словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в храм Яхве; буквально: «в дом Яхве».'
    reason: Поясняет контекстуальное значение буквального выражения «дом Яхве».
lexical_decisions:
- source_word: וַיְהִי
  choice: В
  rationale: Повествовательная форма вводит новый эпизод; в современном русском её связующая функция естественно передаётся временной конструкцией без буквального «и было».
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: В восемнадцатый год царствования Иосии
  rationale: Это стандартная формула датировки по годам правления; добавление «царствования» ясно передаёт смысл русского читателю.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: царь послал
  rationale: Сохранено явное повторное упоминание царя после датировки, как в еврейском тексте.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: Шафана, сына Ацалии, сына Мешуллама
  rationale: Имена переданы транслитерацией, а цепочка родства сохранена без сокращения.
- source_word: הַסֹּפֵר
  choice: писца
  rationale: «Писец» — прозрачное широкое соответствие; в данном контексте слово может обозначать также царского секретаря, но такая конкретизация не обязательна.
- source_word: בֵּית יְהוָה
  choice: в дом Яхве
  rationale: Сохранён буквальный образ «дома»; по контексту речь идёт о храме, что пояснено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: לֵאמֹר
  choice: 'со словами:'
  rationale: Естественная русская формула введения прямой речи, содержание которой следует в следующем стихе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; «Яхве» сохраняет его как имя, тогда как «Господь» является традиционной заменой титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён до естественной русской формы, при этом повтор слова «царь», родословная цепочка и буквальное «дом Яхве» сохранены.
