  text: אַ֚ךְ לֹא יֵחָשֵׁ֣ב אִתָּ֔/ם הַ/כֶּ֖סֶף הַ/נִּתָּ֣ן עַל יָדָ֑/ם כִּ֥י בֶ/אֱמוּנָ֖ה הֵ֥ם עֹשִֽׂים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: ru
  text: Но не следует требовать от них отчёта за серебро, переданное им в руки, потому что они поступают добросовестно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Союз вводит исключение или ограничение к предыдущему распоряжению; «но» естественно передаёт здесь противительный оттенок.
- source_word: יֵחָשֵׁב אִתָּם
  choice: не следует у них учитывать
  rationale: 'Форма от חשׁב в финансовом контексте относится к учёту и расчёту. Русская формулировка сохраняет связь с подсчётом средств, а сноска поясняет вероятный практический смысл: от распорядителей не требовали отчёта.'
- source_word: הַכֶּסֶף
  choice: серебро
  rationale: כסף буквально означает «серебро» и часто обозначает деньги; буквальный выбор сохраняет исторический колорит, при этом финансовый смысл ясен из контекста.
- source_word: הַנִּתָּן עַל יָדָם
  choice: переданное им в руки
  rationale: Передаёт пассивное причастие и сохраняет еврейский образ вручения средств без неестественной буквальности.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание, по которому отчёт не требовался.
- source_word: בֶאֱמוּנָה
  choice: добросовестно
  rationale: В данном контексте אֱמוּנָה обозначает надёжность и честность в исполнении порученного, а не веру как вероучительное понятие.
- source_word: הֵם עֹשִׂים
  choice: они поступают
  rationale: Глагол עשׂה буквально значит «делать», но здесь характеризует образ действий распорядителей; «поступают» естественно передаёт этот смысл.
