  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: ru
  text: 'И писец Шафан сообщил царю: «Священник Хилкия дал мне книгу[a]». И Шафан прочитал её перед царём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свиток». Еврейское слово может обозначать письменный документ вообще и само по себе не уточняет его материальную форму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: сообщил
  rationale: Глагол נגד в породе хифиль означает «сообщить, дать знать». «Сообщил» естественно передаёт официальный придворный контекст, не усиливая торжественность речи.
- source_word: הַסֹּפֵר
  choice: писец
  rationale: Слово סֹפֵר может обозначать писца или царского секретаря. «Писец» сохраняет историческое наименование должности и понятно современному читателю.
- source_word: סֵפֶר
  choice: книгу
  rationale: Слово סֵפֶר обозначает письменный документ или книгу и само по себе не определяет материальную форму. Неопределённость существительного передана естественным для русского языка винительным падежом без указательного уточнения.
- source_word: נָתַן לִי
  choice: дал мне
  rationale: Еврейский перфект обозначает завершённое действие. В русском контексте простое прошедшее время естественно передаёт и завершённость, и актуальность сообщаемого результата.
- source_word: וַיִּקְרָאֵהוּ
  choice: прочитал её
  rationale: קרא с письменным объектом означает чтение, здесь — вслух перед царём. Русское «прочитал её» естественно передаёт действие; публичный характер ясен из последующего оборота.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: перед царём
  rationale: Стандартный идиоматический эквивалент действия в присутствии царя.
- source_word: חִלְקִיָּה
  choice: Хилкия
  rationale: Имя передано в традиционной русской библейской форме, соответствующей еврейскому חִלְקִיָּה.
- source_word: שָׁפָן
  choice: Шафан
  rationale: Имя передано в традиционной русской библейской форме, близкой к еврейскому שָׁפָן.
