base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Прочие деяния Охозии — всё, что он совершил, — не записаны ли[a] в Книге летописей царей Израиля[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «написаны». Здесь употреблена обычная формула ссылки на письменный царский источник.'
    reason: lexical_alternative
  - marker: b
    text: «Книга летописей царей Израиля» — упоминаемый в книгах Царств анналистический источник; это название не обязательно относится к библейским книгам Паралипоменон.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие деяния
  rationale: В заключительной царской формуле выражение означает остальные дела царя; «деяния» естественно передаёт здесь דִּבְרֵי как события и поступки, а не только слова.
- source_word: אֲחַזְיָהוּ
  choice: Охозии
  rationale: Использована традиционная русская библейская форма имени; родительный падеж обусловлен синтаксисом.
- source_word: אֲשֶׁר עָשָׂה
  choice: то, что он совершил
  rationale: Относительная конструкция уточняет содержание «деяний»; «совершил» сохраняет смысл עָשָׂה и соответствует достоинству исторического повествования.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: не записаны ли
  rationale: Сохранён риторический вопрос, предполагающий утвердительный ответ. «Записаны» естественно по-русски передаёт буквальное «написаны» в архивной формуле.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: в Летописи
  rationale: В данной формуле סֵפֶר обозначает письменный источник, а דִּבְרֵי הַיָּמִים — анналы или летопись. Предлог «в» идиоматичен для ссылки на запись в книге.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: 'Передано как часть названия архивного источника: «Летопись царей Израиля».'
theological_decisions:
- issue: Идентификация упомянутой летописи
  choice: Не отождествлять её в основном тексте с каноническими книгами Паралипоменон
  alternative: Оформить название так, будто речь идёт о библейской книге Паралипоменон
  rationale: Еврейская формула обозначает царский анналистический источник, цитируемый в книгах Царств; сам текст не устанавливает его тождество с каноническими Паралипоменон.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и формульного характера царского заключения. Риторический вопрос и уточняющая относительная конструкция сохранены; начальный וְ не передан искусственным временным маркером вроде «теперь».
