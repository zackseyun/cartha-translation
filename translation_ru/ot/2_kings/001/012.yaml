base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: ru
  text: 'Илия ответил им: «Если я человек Божий[a], пусть с неба сойдёт огонь и поглотит тебя и твоих пятьдесят[b]». И с неба сошёл огонь Божий[c] и поглотил его и его пятьдесят.


    [a] Или: «Если я — тот человек Божий».


    [b] Буквально: «твоих пятьдесят»; имеются в виду пятьдесят воинов под началом командира.


    [c] Или: «огонь от Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если я — тот человек Божий».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоих пятьдесят»; имеются в виду пятьдесят воинов под началом командира.'
    reason: cultural_note
  - marker: c
    text: 'Или: «огонь от Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: Илия ответил им
  rationale: Передаёт обычную древнееврейскую формулу введения ответа естественным современным русским языком; удвоение «ответил и сказал» здесь не требуется для сохранения смысла.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: Если я человек Божий
  rationale: Сохраняет признанное пророческое наименование и условную форму исходного текста. В именной части русского сказуемого естественно отсутствие артиклеподобного уточнения.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: пусть с неба сойдёт огонь
  rationale: Форма «пусть… сойдёт» передаёт волеизъявительное, призывное значение, а не превращает слова Илии в простое предсказание.
- source_word: וְתֹאכַל
  choice: и поглотит
  rationale: Глагол אכל применительно к огню означает полное уничтожение; «поглотит» сохраняет образ исходного текста и звучит литературно.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: твоих пятьдесят / его пятьдесят
  rationale: Сохраняет лаконичную субстантивированную числительную конструкцию еврейского текста; пояснение о воинах вынесено в сноску.
- source_word: אֵשׁ אֱלֹהִים
  choice: огонь Божий
  rationale: Формально отражает сочетание существительных и прямо связывает огонь с Богом, не уточняя сверх текста способ его происхождения.
theological_decisions:
- issue: Пророческое обозначение אִישׁ הָאֱלֹהִים
  choice: человек Божий
  alternative: тот самый человек Божий
  rationale: Основной вариант естественно передаёт титул пророка, не добавляя конфессионального содержания. Возможная определённость отмечена в сноске.
- issue: Связь огня с Богом в אֵשׁ אֱלֹהִים
  choice: огонь Божий
  alternative: огонь от Бога
  rationale: Основной вариант сохраняет тесную грамматическую связь с Богом и оставляет открытым её точный оттенок; вариант происхождения указан в сноске.
- issue: Характер слов Илии о нисхождении огня
  choice: пусть с неба сойдёт огонь
  alternative: с неба сойдёт огонь
  rationale: Волеизъявительная передача сохраняет напряжение между призывом пророка и последующим Божьим действием, не сводя речь к нейтральному прогнозу.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без утраты содержания: древнееврейское «ответил и сказал» передано как «ответил». Лаконичное «пятьдесят» сохранено в основном тексте и разъяснено в сноске.'
