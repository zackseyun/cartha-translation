  text: וַ/יַּעֲנֶ֣ה אֵלִיָּ֗הוּ וַ/יְדַבֵּר֮ אֶל שַׂ֣ר הַ/חֲמִשִּׁים֒ וְ/אִם אִ֤ישׁ אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: ru
  text: 'Илия ответил начальнику над пятьюдесятью: «Но если я человек Божий, пусть с неба сойдёт огонь и поглотит тебя и твоих пятьдесят воинов». И сошёл с неба огонь и поглотил его и его пятьдесят воинов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: начальнику над пятьюдесятью
  rationale: Передаёт воинское должностное обозначение буквально и понятно, не подменяя его современным конкретным званием.
- source_word: וְאִם
  choice: Но если
  rationale: Союз וְ здесь естественно выражает противопоставленный ответ на требование начальника в предыдущем стихе; «но» сохраняет отмеченный в источнике связующий элемент.
- source_word: תֵּרֶד
  choice: пусть ... сойдёт
  rationale: Форма выражает волю или пожелание; русская конструкция с «пусть» естественно передаёт этот оттенок.
- source_word: וְתֹאכַל
  choice: и поглотит
  rationale: В отношении огня глагол אכל означает уничтожить, пожрать; «поглотит» сохраняет образность без излишней архаики.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: твоих / его пятьдесят воинов
  rationale: Буквально «твои/его пятьдесят»; добавление «воинов» естественно раскрывает подразумеваемую группу из пятидесяти человек.
theological_decisions:
- issue: Условность слов «если я человек Божий»
  choice: Сохранено прямое условное выражение без пояснения мотива Илии
  alternative: 'Передать как риторическое утверждение: «Раз я человек Божий...»'
  rationale: Еврейский текст формально содержит אִם («если»), поэтому богословское значение испытания или подтверждения статуса не следует разрешать внутри перевода.
- issue: Происхождение огня
  choice: «с неба»
  alternative: «от Бога»
  rationale: Текст прямо говорит מִן־הַשָּׁמַיִם («с неба»); указание на Бога как непосредственного деятеля было бы интерпретационным добавлением.
translation_notes:
  register: 'Современный литературный русский язык с dignified библейским звучанием. Синтаксис немного упрощён: парное «ответил и сказал» передано одним естественным глаголом «ответил». Военное обозначение сохранено описательно; подразумеваемое «воины» добавлено ради ясности.'
