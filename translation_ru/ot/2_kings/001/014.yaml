base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: ru
  text: Вот, огонь сошёл с небес и поглотил двух первых начальников отрядов по пятьдесят человек вместе с их отрядами. Но теперь пусть моя жизнь будет драгоценна в твоих глазах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть моя душа будет драгоценна в твоих глазах»; здесь «душа» означает жизнь человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую силу еврейского слова и естественно звучит в современном литературном русском.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: огонь сошёл с небес
  rationale: Прямо и идиоматично передаёт движение сверху и исходную точку; множественное «небеса» соответствует библейскому контексту и русской норме.
- source_word: וַתֹּאכַל
  choice: поглотил
  rationale: При огне этот глагол естественно выражает уничтожение, сохраняя образность буквального «съел» без неуместной буквальности.
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: первых двух пятидесятников
  rationale: «Пятидесятник» — понятное в историко-библейском русском обозначение начальника отряда из пятидесяти человек; «первых двух» указывает на ранее посланных начальников.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: вместе с их отрядами по пятьдесят человек
  rationale: Раскрывает буквальное «их пятидесятки» естественным современным русским выражением и сохраняет военную структуру.
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Передаёт переход и контраст между участью прежних отрядов и нынешней просьбой говорящего.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: пусть моя жизнь будет драгоценна в твоих глазах
  rationale: Сохраняет еврейскую образность «в твоих глазах», а נֶפֶשׁ в просьбе о спасении передаёт как конкретную «жизнь».
theological_decisions:
- issue: Значение נֶפֶשׁ в просьбе избежать смерти
  choice: жизнь
  alternative: душа
  rationale: По контексту говорящий просит сохранить ему жизнь после гибели предыдущих отрядов. «Душа» формально возможна, но способна вызвать не требуемое здесь противопоставление души и тела.
translation_notes:
  register: Современный литературный русский с сохранением библейской торжественности. Военный термин «пятидесятник» оставлен как краткое историческое обозначение начальника пятидесяти; значение следующего выражения раскрыто как «отряды по пятьдесят человек». Единственная сноска фиксирует буквальное значение נֶפֶשׁ и контекстуальный перевод «жизнь».
