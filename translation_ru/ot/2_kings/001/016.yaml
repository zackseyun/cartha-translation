  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: ru
  text: 'И он сказал ему: «Так говорит Яхве: за то, что ты послал вестников вопросить Ваал-Зевува[a], бога Экрона, — неужели потому, что в Израиле нет Бога, чтобы вопросить о его слове?[b] — поэтому с постели, на которую ты взошёл[c], ты не сойдёшь, ибо непременно умрёшь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте имя написано «Ваал-Зевув»; в позднейшей традиции встречается родственная форма «Веельзевул».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «вопросить о его слове»; вероятно, то есть обратиться к Богу за словом, ответом или прорицанием.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «постель, на которую ты взошёл там, — не сойдёшь с неё».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: И он сказал ему
  rationale: דבר буквально означает «говорить»; в русском повествовании перед прямой речью естественно «сказал», при этом адресат сохранён.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена стандартная пророческая формула и личное имя, представленное тетраграмматоном.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: ты послал вестников
  rationale: Речь идёт о людях-посланцах, а не об ангелах; «вестники» соответствует контексту и достоинству стиля.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: вопросить Ваал-Зевува
  rationale: דרש здесь означает обращение к божеству за ответом или прорицанием; «вопросить» передаёт религиозно-консультативный оттенок.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: бога Аккарона
  rationale: Конструкция прямо называет Ваал-Зевува божеством города Экрон; традиционная русская библейская форма топонима — «Аккарон».
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: неужели в Израиле нет Бога
  rationale: Передан укоризненный риторический вопрос; אֱלֹהִים здесь обозначает Бога Израиля.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: чтобы вопросить о его слове
  rationale: Сохранено явно присутствующее דָבָר «слово» и неоднозначность оборота, вероятно обозначающего поиск Божьего ответа.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: с постели, на которую ты лёг, ты уже не встанешь
  rationale: Буквальная пара «взошёл/не сойдёшь» по-русски применительно к постели звучит неестественно; выражение передаёт, что царь не покинет постели.
- source_word: כִּי מוֹת תָּמוּת
  choice: но непременно умрёшь
  rationale: Инфинитив абсолютный с личной формой усиливает категоричность смертного приговора.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя; форма «Яхве» сохраняет это различие.
- issue: Значение לִדְרֹשׁ בִּדְבָרוֹ
  choice: вопросить о его слове
  alternative: вопросить Его / искать у Него ответа
  rationale: Выбранный вариант не устраняет слово דָבָר и сохраняет возможность понимать выражение как обращение за Божьим словом или откровением.
translation_notes:
  register: Современный литературный русский с торжественным пророческим тоном. Архаизирующее «вопросить» сохранено как точный и понятный термин для обращения за божественным ответом; синтаксис упорядочен ради естественного русского звучания.
