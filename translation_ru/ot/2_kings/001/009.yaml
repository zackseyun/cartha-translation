base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: ru
  text: 'Тогда царь послал к нему пятидесятника со своими пятьюдесятью воинами. Пятидесятник поднялся к нему — и вот, Илия сидел на вершине горы[a]. Он сказал ему: «Человек Божий, царь говорит: „Сойди“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на вершине холма». Еврейское הַר может означать гору или холм — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Тогда царь послал
  rationale: Ваййиктольная форма продолжает повествование; «тогда» естественно передаёт последовательность событий. Подлежащее «царь» восстановлено из ближайшего контекста для ясности русского текста.
- source_word: שַׂר חֲמִשִּׁים
  choice: пятидесятника
  rationale: Традиционное и точное русское обозначение военного начальника подразделения из пятидесяти человек.
- source_word: וַחֲמִשָּׁיו
  choice: с его пятьюдесятью воинами
  rationale: Местоименный суффикс обозначает пятьдесят человек, подчинённых начальнику; слово «воинами» делает военный смысл явным и естественным по-русски.
- source_word: וַיַּעַל אֵלָיו
  choice: Пятидесятник поднялся к нему
  rationale: Глагол עלה указывает на движение вверх к сидящему на возвышенности Илии; повтор подлежащего устраняет возможную двусмысленность русского местоимения.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет изобразительную, привлекающую внимание функцию еврейской частицы в естественной современной русской форме.
- source_word: יֹשֵׁב
  choice: сидел
  rationale: Передаёт обозначенное причастием состояние Илии в момент приближения посланника.
- source_word: עַל רֹאשׁ הָהָר
  choice: на вершине горы
  rationale: רֹאשׁ означает верх или вершину, а הַר допускает значения «гора» и «холм»; основным выбран привычный русский библейский оборот, а неоднозначность отмечена в сноске.
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Он сказал ему
  rationale: Вводит прямую речь естественно по-русски, не меняя смысла глагола «говорить».
- source_word: אִישׁ הָאֱלֹהִים
  choice: Человек Божий
  rationale: Устойчивое русское наименование пророка, сохраняющее буквальный состав еврейского выражения.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: Царь говорит
  rationale: Идиоматично передаёт формулу посланника; буквальное прошедшее совершённое «царь сказал/изрёк» отмечено в сноске без усиления до «приказывает».
- source_word: רֵדָה
  choice: Сойди
  rationale: Императив ירד требует движения вниз; «сойди» сохраняет направление и звучит достойно и естественно в обращении к человеку на вершине.
