source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: ru
  text: 'Но ангел Яхве сказал Илии Фесвитянину: «Встань, поднимись навстречу посланцам царя Самарии и скажи им: „Неужели вы идёте вопрошать Ваал-Зевува, бога Аккарона, потому что в Израиле нет Бога?[a]“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели вы идёте вопрошать Ваал-Зевува, бога Аккарона, из-за отсутствия Бога в Израиле?»'
    reason: Лексико-синтаксический оборот הֲמִבְּלִי אֵין допускает передачу через отсутствие либо недостаток; вариант сохраняет риторический упрёк, не добавляя толкования.
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Но ангел Яхве
  rationale: Союз ו передаёт противопоставление поступку царя в предыдущем стихе; מַלְאַךְ в сочетании с именем Яхве здесь естественно понимать как «ангел», не уточняя его природу.
- source_word: דִּבֶּר אֶל
  choice: сказал
  rationale: Перед прямой речью современное русское «сказал» звучит естественнее буквального «говорил к», сохраняя смысл обращения.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Илии Фесвитянину
  rationale: Использованы укоренившиеся в русской библейской традиции формы имени и обозначения происхождения.
- source_word: קוּם עֲלֵה
  choice: Встань, пойди
  rationale: Оба повеления сохранены отдельно; русское «пойди» естественно передаёт движение, тогда как буквальное «поднимись» без явного топографического контекста могло бы звучать неясно.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Передаёт целенаправленное движение для встречи без усиления до «перехвати» или «воспрепятствуй».
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: посланцам царя Самарии
  rationale: В данном случае מַלְאָךְ обозначает людей-посланцев; «царь Самарии» сохранено как в еврейском тексте.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: потому что в Израиле нет Бога?
  rationale: Оборот передан как риторический вопрос с упрёком; возможный оттенок «неужели в Израиле недостаёт Бога» отмечен в сноске.
- source_word: אַתֶּם הֹלְכִים לִדְרֹשׁ
  choice: вы идёте вопрошать
  rationale: Причастная конструкция указывает на предпринимаемое намерение, а דרש в оракульном контексте означает обращение к божеству за ответом.
- source_word: בַּעַל זְבוּב
  choice: Ваал-Зевува
  rationale: Имя передано принятой русской библейской транслитерацией; падежное окончание обусловлено управлением глагола «вопрошать».
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: бога Аккарона
  rationale: Сочетание определяет Ваал-Зевува как божество, связанное с филистимским городом Аккароном; использована традиционная русская форма топонима.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Собственное заветное имя передано транслитерацией «Яхве», а не заменено титулом; это сохраняет различие между именем Яхве и словом «Бог» далее в стихе.
- issue: Кем является מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Выбрано наиболее естественное для данного небесного посланника значение, но перевод не уточняет его онтологическую природу и не вводит конфессионального толкования.
- issue: Сила риторического вопроса
  choice: Неужели вы идёте… потому что в Израиле нет Бога?
  alternative: Разве в Израиле недостаёт Бога, что вы идёте…?
  rationale: Сохранены упрёк и богословское противопоставление Бога Израиля чужому божеству, без превращения вопроса в прямое утверждение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены риторический вопрос, различие между небесным ангелом и человеческими посланцами и собственное имя Яхве; традиционные формы «Илия Фесвитянин», «Ваал-Зевув» и «Аккарон» помогают узнаваемости.
