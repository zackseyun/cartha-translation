  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: ru
  text: 'Они ответили ему: «К нам подошёл человек и сказал: „Ступайте, возвратитесь к царю, который послал вас, и скажите ему: ‘Так говорит Яхве: неужели ты посылаешь вопрошать Ваал-Зевува, бога Экрона, потому что в Израиле нет Бога?[a] Поэтому с постели, на которую ты лёг,[b] ты не встанешь, но непременно умрёшь’“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве в Израиле нет Бога, что ты посылаешь вопрошать Ваал-Зевува…?»'
    reason: Возможна иная естественная передача синтаксиса риторического вопроса.
  - marker: b
    text: 'Буквально: «на которую ты поднялся туда». Речь идёт о постели, на которую лёг больной царь.'
    reason: Еврейская конструкция сохраняет глагол движения вверх и наречие «там»; в основном тексте она передана естественной русской идиомой.
lexical_decisions:
- source_word: אִישׁ עָלָה לִקְרָאתֵנוּ
  choice: навстречу нам вышел человек
  rationale: Сохраняет неопределённое обозначение мужчины и передаёт движение навстречу говорящим; буквальный компонент «поднялся» по-русски здесь звучал бы неестественно и мог бы создать ложное пространственное уточнение.
- source_word: לְכוּ שׁוּבוּ
  choice: ступайте, возвратитесь
  rationale: Сохранены оба повелительных глагола, а формулировка остаётся естественной и достойной в современном русском языке.
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: и скажите ему
  rationale: В данном контексте דבר вводит передаваемую дословно весть; «скажите» естественнее русского «говорите ему» и не меняет смысла.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Сохранена традиционная пророческая формула и личное имя, непосредственно представленное тетраграмматоном.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: неужели ты посылаешь… потому что в Израиле нет Бога?
  rationale: Передаёт риторический укор и причинную конструкцию; порядок слов перестроен ради ясного современного русского синтаксиса.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: посылаешь вопрошать
  rationale: «Вопрошать» сохраняет смысл обращения за божественным прорицанием и уместно в возвышенном библейском регистре.
- source_word: בַּעַל זְבוּב
  choice: Ваал-Зевув
  rationale: Имя филистимского божества транслитерировано в форме, близкой к еврейскому звучанию и узнаваемой русскому читателю.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: бога Экрона
  rationale: Точно передаёт принадлежность божества городу Экрону.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: с постели, на которую ты лёг, ты уже не встанешь
  rationale: Передаёт образ восхождения на постель и последующего невосхождения с неё естественной русской идиомой; буквальные «взошёл» и «не сойдёшь» звучали бы неясно.
- source_word: מוֹת תָּמוּת
  choice: непременно умрёшь
  rationale: Инфинитив абсолютный с личной формой глагола выражает усиленную уверенность, естественно переданную наречием «непременно».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его отличие от титула и соответствует предоставленному проектному решению.
- issue: Смысл риторического вопроса об отсутствии Бога в Израиле
  choice: неужели ты посылаешь… потому что в Израиле нет Бога?
  alternative: разве в Израиле нет Бога, что ты посылаешь…?
  rationale: Обе конструкции выражают укор, а выбранная яснее связывает обращение к Ваал-Зевуву с подразумеваемым отрицанием Бога Израиля, не превращая вопрос в буквальное богословское утверждение.
