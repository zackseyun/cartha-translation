source:
  edition: WLC
  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: ru
  text: 'Охозия выпал через решётку своей верхней комнаты, находившейся в Самарии, и занемог. Он послал вестников и сказал им: «Пойдите, вопросите Ваал-Зевува[a], бога Аккарона, выздоровею ли я от этой болезни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ваал-Зевув — форма имени в еврейском тексте; более поздняя форма, известная по греческой традиции, — Вельзевул.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: через решётку
  rationale: Предлог בְּעַד при существительном שְׂבָכָה здесь указывает на движение через решётчатое ограждение или проём; буквальный образ сохранён без добавления отсутствующего в тексте слова «окно».
- source_word: עֲלִיָּתוֹ
  choice: в своей верхней комнате
  rationale: עֲלִיָּה обозначает верхнее помещение дома; «верхняя комната» понятно современному читателю и сохраняет предметность исходного выражения.
- source_word: וַיָּחַל
  choice: занемог
  rationale: Глагол означает, что после падения Охозия стал болен или немощен. «Занемог» сохраняет связь с последующим חֳלִי «болезнь», не уточняя сверх текста характер травмы.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В данном повествовательном контексте речь идёт о людях, посланных царём, а не об ангелах.
- source_word: דִרְשׁוּ
  choice: вопросите
  rationale: דרשׁ здесь означает обратиться к божеству за прорицательным ответом. «Вопросите» передаёт культово-консультативный смысл и соответствует достоинству библейского повествования.
- source_word: בַּעַל זְבוּב
  choice: Ваал-Зевува
  rationale: Имя транслитерировано непосредственно с еврейской формы; падежное окончание добавлено по нормам русского синтаксиса.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: бога Аккарона
  rationale: Сочетание прямо называет Ваал-Зевува божеством города Экрон; «Аккарон» — укоренившаяся русская библейская форма топонима.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: выздоровею ли я от этой болезни
  rationale: Буквально выражение говорит «буду ли я жить после/от этой болезни»; по-русски вопрос о том, переживёт ли он болезнь, естественно и точно передаётся глаголом «выздоровею».
- source_word: וַיִּפֹּל
  choice: выпал
  rationale: «Выпал» естественно описывает падение из верхнего помещения через решётчатый проём и не добавляет лишних обстоятельств.
- source_word: שֹׁמְרוֹן
  choice: Самарии
  rationale: Стандартная русская форма названия города שֹׁמְרוֹן.
theological_decisions:
- issue: Передача имени филистимского божества
  choice: Ваал-Зевув
  alternative: Вельзевул
  rationale: Основной текст следует непосредственно еврейскому בַּעַל זְבוּב. Более поздняя форма «Вельзевул», знакомая по греческой традиции Нового Завета и русским переводам, отмечена в сноске, но не подменяет форму масоретского текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Союзы вау переданы в соответствии с русским повествовательным строем, без искусственного начального «И». Сохранены конкретный образ решётки и неопределённость того, было ли состояние Охозии именно травмой или болезнью вследствие падения.
