  rationale: Предлог ב при פשע указывает на того, против чьей власти восстают; буквальное пространственное значение здесь неуместно.
- source_word: אַחֲרֵי מוֹת
  choice: После смерти
  rationale: Естественная русская передача временной конструкции с инфинитивом-конструктом מוֹת.
- source_word: אַחְאָב
