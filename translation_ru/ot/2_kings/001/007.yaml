source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם מֶ֚ה מִשְׁפַּ֣ט הָ/אִ֔ישׁ אֲשֶׁ֥ר עָלָ֖ה לִ/קְרַאתְ/כֶ֑ם וַ/יְדַבֵּ֣ר אֲלֵי/כֶ֔ם אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: ru
  text: 'Тогда он спросил их[a]: «Как выглядел тот человек, который вышел вам навстречу и сказал вам эти слова?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что это был за человек?» Буквально: «Каков был мишпат того человека…?» Еврейское слово מִשְׁפַּט может здесь обозначать облик, характерные признаки или манеру поведения; последующий ответ описывает внешний вид и одежду человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט
  choice: Как выглядел
  rationale: В данном контексте сочетание вводит вопрос об отличительных внешних признаках человека, что подтверждается описанием в следующем стихе. Русская формулировка естественна и не придаёт מִשְׁפַּט обычного здесь неуместного значения «суд».
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Определённая форма указывает на конкретного человека, которого встретили посланники; «тот человек» ясно передаёт эту отсылку по-русски.
- source_word: עָלָה לִקְרַאתְכֶם
  choice: вышел вам навстречу
  rationale: Идиоматично передаёт движение навстречу собеседникам. Отдельный оттенок движения вверх у עָלָה в данном контексте по-русски звучал бы неестественно и, вероятно, не является смысловым центром.
- source_word: וַיְדַבֵּר אֲלֵיכֶם אֶת הַדְּבָרִים הָאֵלֶּה
  choice: и сказал вам эти слова
  rationale: Естественно и близко передаёт сообщение речи и сохраняет конкретное выражение «эти слова».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная. «Как выглядел» согласуется с ответом в ст. 8, а сноска сохраняет более широкую смысловую возможность еврейского מִשְׁפַּט.
