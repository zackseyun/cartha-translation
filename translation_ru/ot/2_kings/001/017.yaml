revisions:
- from: И он умер по слову Яхве, которое изрёк Илия. И вместо него воцарился[a] Иорам — во второй год Иорама, сына Иосафата, царя Иудеи, — потому что у него не было сына.
  to: И он умер по слову Яхве, которое изрёк Илия. Иорам воцарился вместо него во второй год правления Иорама, сына Иосафата, царя Иудеи, ибо у прежнего царя не было сына.
  rationale: 'Устранена русская двусмысленность в последней причинной фразе: отсутствие сына относится к прежнему, умершему царю. Формула датировки слегка развёрнута как «во второй год правления», что естественно для современного русского и передаёт регнальный характер еврейской конструкции. Сноска уточнена, чтобы альтернатива непосредственно соответствовала значению вступления на престол.'
