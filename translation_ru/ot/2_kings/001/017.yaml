  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: ru
  text: И он умер по слову Яхве, которое изрёк Илия. Иорам воцарился вместо него во второй год правления Иорама, сына Иосафата, царя Иудеи, ибо у прежнего царя не было сына.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: И он умер
  rationale: Последовательная форма wayyiqtol продолжает повествование; простой глагол «умер» точно передаёт значение без добавления причинного оттенка.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Предлог כְּ выражает соответствие ранее сказанному; «по слову» естественно и точно передаёт эту связь.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: которое изрёк Илия
  rationale: Относительное местоимение относится к слову Яхве, а подлежащим глагола прямо назван Илия. «Изрёк» сохраняет достоинство пророческой речи, не истолковывая синтаксис как «через Илию».
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: И вместо него воцарился Иорам
  rationale: В данном контексте מלך обозначает вступление на престол; «воцарился» передаёт это естественно, а תַּחְתָּיו — как «вместо него».
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: во второй год Иорама
  rationale: Это обычная формула датировки по годам царствования.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: сына Иосафата, царя Иудеи
  rationale: Приложение отличает иудейского Иорама, сына Иосафата, от северного царя с тем же именем.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: потому что у него не было сына
  rationale: כִּי имеет здесь причинное значение и объясняет, почему престол перешёл не к сыну умершего царя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, тетраграмматон; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Тире обособляют хронологическую формулу и помогают ясно различить двух царей по имени Иорам.
