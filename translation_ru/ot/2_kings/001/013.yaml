  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: ru
  text: 'И снова он послал третьего командира пятидесяти воинов с его пятьюдесятью воинами. Третий командир поднялся, подошёл к Илии, преклонил перед ним колени и стал умолять его, сказав: «Человек Божий! Прошу, пусть будут дороги в твоих глазах моя жизнь[a] и жизнь этих пятидесяти твоих слуг».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа». Еврейское נֶפֶשׁ может означать жизнь, самого человека или душу; здесь речь идёт о спасении от смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: И снова
  rationale: В повествовательной последовательности глагол указывает на повторное действие царя; русское «снова» естественно передаёт эту функцию.
- source_word: שַׂר חֲמִשִּׁים
  choice: командир пятидесяти воинов
  rationale: Передаёт военную должность понятным современному читателю языком. Слово «воинов» подразумевается контекстом и устраняет неясность буквального «начальник пятидесяти».
- source_word: וַיַּעַל וַיָּבֹא
  choice: поднялся, подошёл к Илии
  rationale: Сохранены оба глагола движения; подразумеваемое направление второго глагола ясно из контекста.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  choice: преклонил перед ним колени
  rationale: Естественное и достойное русское выражение, точно передающее позу смирения и мольбы.
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: стал умолять его
  rationale: Возвратная порода глагола выражает настойчивую, смиренную просьбу.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Человек Божий
  rationale: Сохранён устойчивый библейский титул пророка без добавления толкования.
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: пусть ... будет дорога в твоих глазах
  rationale: Сохранена исходная метафора ценности, а частица просьбы נָא передана словом «прошу».
- source_word: נַפְשִׁי
  choice: моя жизнь
  rationale: В непосредственном контексте смертельной опасности נֶפֶשׁ обозначает жизнь человека, а не отдельно мыслимую нематериальную душу.
- source_word: עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  choice: этих пятидесяти твоих слуг
  rationale: Сохранены обращение к Илии как к господину и точное число людей; «слуг» следует исходному עֲבָדֶיךָ, а не заменяет его толковательным «воинов» в прямой речи.
theological_decisions:
- issue: Значение נֶפֶשׁ в рассказе об угрозе смерти
  choice: жизнь
  alternative: душа
  rationale: Проситель говорит о сохранении от гибели себя и своих людей. «Жизнь» передаёт контекстуальное значение и не вносит в стих более позднюю антропологическую схему.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор военного звания частично сохранён, а синтаксис сделан естественным для русского повествования. Ошибочно переставленные маркеры консультационного английского слоя не воспроизведены; примечание поставлено при слове, к которому оно относится.
