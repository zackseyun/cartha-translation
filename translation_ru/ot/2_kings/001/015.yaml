base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: ru
  text: 'Тогда ангел Яхве сказал Илии: «Сойди с ним и не бойся его[a]». Илия встал и сошёл с ним к царю.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не бойся от лица его», то есть не бойся из-за его присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «посланник» или «ангел», но в данном повествовательном контексте сверхъестественного Божьего повеления естественнее «ангел»; личное имя יְהוָה передано как «Яхве».
- source_word: רֵד אֹתוֹ
  choice: сойди вместе с ним
  rationale: Императив ירד обозначает движение вниз, а אֹתוֹ при этом глаголе в данном контексте выражает сопровождение.
- source_word: אַל תִּירָא מִפָּנָיו
  choice: не бойся его
  rationale: Это естественная русская передача запрета и еврейского оборота с מִפָּנָיו; его буквальный пространственный образ отмечен в сноске.
- source_word: וַיָּקָם
  choice: Илия встал
  rationale: Глагол описывает немедленное ответное действие. Имя «Илия» повторено вместо местоимения для ясности русского текста.
- source_word: וַיֵּרֶד אֹתוֹ אֶל־הַמֶּלֶךְ
  choice: сошёл вместе с ним к царю
  rationale: Сохраняются направление движения, сопровождение и пункт назначения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Значение מַלְאַךְ в выражении מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Слово допускает оба значения, однако повествовательный контекст Божьего откровения и повеления поддерживает традиционное и естественное здесь «ангел», без дальнейшего уточнения его природы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Союз «и» внутри прямой речи естественно связывает два последовательных повеления; повтор имени «Илия» устраняет возможную неясность местоимения.
