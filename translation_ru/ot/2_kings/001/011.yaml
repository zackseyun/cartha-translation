  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: ru
  text: 'И снова царь послал к нему другого пятидесятника с его отрядом из пятидесяти человек. Тот обратился к нему и сказал: «Человек Божий, так говорит царь: „Немедленно спускайся!“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: И снова царь послал
  rationale: Конструкция וַיָּשָׁב с последующим глаголом обозначает повтор действия. Подлежащее «царь» восстановлено из контекста, чтобы избежать неясного местоимения в русском тексте.
- source_word: שַׂר חֲמִשִּׁים
  choice: пятидесятник
  rationale: Традиционный и точный русский военный термин для начальника подразделения из пятидесяти человек; уместен в библейском повествовании и не требует громоздкой описательной конструкции.
- source_word: וַחֲמִשָּׁיו
  choice: с его отрядом из пятидесяти человек
  rationale: Буквально «и его пятьюдесятью»; сопровождение передано естественно по-русски, а слово «отряд» проясняет, что речь идёт о подчинённых воинах.
- source_word: וַיַּעַן וַיְדַבֵּר אֵלָיו
  choice: Тот обратился к нему и сказал
  rationale: Еврейская парная формула буквально означает «ответил и сказал», но здесь речь не обязательно идёт об ответе на реплику. «Обратился… и сказал» естественно передаёт введение торжественной речи без ложного намёка на предшествующий вопрос.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Человек Божий
  rationale: Устоявшееся обозначение пророка и форма прямого обращения; прописная буква в «Божий» соответствует современному религиозному русскому употреблению.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Так говорит царь
  rationale: Сохраняет формальную посланническую формулу и властный тон приказа.
- source_word: מְהֵרָה
  choice: немедленно
  rationale: Передаёт срочность царского требования более естественно и властно, чем буквальное «быстро».
- source_word: רֵדָה
  choice: спускайся
  rationale: Нейтрально передаёт значение «сойди/спустись», не добавляя направления относительно говорящего, которое в еврейском глаголе не выражено.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Термин «пятидесятник» сохранён как точное воинское звание; его значение сразу раскрывается через выражение «отряд из пятидесяти человек». Прямая речь передаёт усилившийся повелительный тон второго посланника.
