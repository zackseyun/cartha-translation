  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: ru
  text: 'Посланцы вернулись к нему, и он сказал им: «Почему вы вернулись?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: вернулись
  rationale: Глагол שוב в повествовательной последовательности означает возвращение к пославшему их; «вернулись» естественно и точно передаёт это направление.
- source_word: הַמַּלְאָכִים
  choice: посланцы
  rationale: В данном контексте מַלְאָכִים обозначает людей, посланных царём, а не небесных существ; «посланцы» ясно передаёт их роль.
- source_word: אֵלָיו
  choice: к нему
  rationale: Предлог указывает движение к царю; местоименная отсылка сохраняет связность данного стиха с контекстом.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: и он сказал им
  rationale: Сохранён обычный повествовательный глагол אמר («сказал»), хотя далее следует вопрос.
- source_word: מַה זֶּה
  choice: Почему
  rationale: Буквально «что это», но в данном вопросе оборот идиоматически выясняет причину неожиданного возвращения; «почему» естественно передаёт его функцию.
- source_word: שַׁבְתֶּם
  choice: вы вернулись
  rationale: Форма второго лица мужского рода множественного числа согласована с группой посланцев; русский прошедший вид совершенного вида уместен для только что завершившегося действия.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет достоинство и прямоту древнееврейского текста. Буквальная конструкция מַה זֶּה не вынесена в сноску, поскольку её идиоматическое значение уверенно передаётся словом «почему» и не создаёт существенной смысловой неоднозначности.
