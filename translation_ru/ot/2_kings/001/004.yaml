lexical_decisions:
- source_word: וְלָכֵן
  choice: И потому
  rationale: Передаёт вывод и следствие из предшествующего обличения, сохраняя также повествовательную связь, выраженную союзом וְ.
- source_word: כֹּה אָמַר יְהוָה
  choice: так говорит Яхве
  rationale: Естественно и достаточно формально передаёт устойчивую пророческую формулу вестника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, не заменяя его титулом.
- source_word: הַמִּטָּה
  choice: постель
  rationale: В данном контексте речь идёт о ложе раненого царя; «постель» звучит естественно и не добавляет отсутствующего в тексте уточнения «больничная».
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: на которую поднялся
  rationale: Сохраняет образ восхождения и его намеренное противопоставление последующему «не сойдёшь», но устраняет неестественный для русского языка возвратный наречный элемент שׁם.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: не сойдёшь с постели
  rationale: Глагол «сойти» сохраняет пространственный контраст с «поднялся» и категоричность предсказания.
- source_word: כִּי מוֹת תָּמוּת
  choice: потому что непременно умрёшь
  rationale: Наречие «непременно» передаёт усиление, выраженное сочетанием абсолютного инфинитива с личной формой того же глагола.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: И Илия пошёл
  rationale: Прямо передаёт развитие повествования и обычное значение глагола הלך, не уточняя направление или цель, которых эта фраза не называет.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация сохраняет различие между именем Бога и титулом «Господь».
- issue: Сила смертного приговора в מוֹת תָּמוּת
  choice: непременно умрёшь
  alternative: умрёшь
  rationale: Усилительная еврейская конструкция подчёркивает несомненность смерти; её нельзя без потери смысла сводить к нейтральному будущему времени.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным для русского читателя, при этом сохранены формула вестника, имя Яхве, усиленный смертный приговор и образный контраст между «поднялся» и «не сойдёшь».
