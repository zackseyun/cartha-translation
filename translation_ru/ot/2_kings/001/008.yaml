  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: ru
  text: 'Они ответили ему: «Это был волосатый человек[a], опоясанный кожаным поясом». Царь сказал: «Это Илия Фесвитянин».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек, одетый в одежду из волоса». Еврейское выражение буквально означает «обладатель волос» и может описывать либо волосатого человека, либо человека в одежде из волоса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: человек
  rationale: В данном описании существительное обозначает взрослого мужчину; русское «человек» естественно вводит опознавательные признаки и не меняет референта.
- source_word: בַּעַל שֵׂעָר
  choice: волосатый человек
  rationale: Буквально выражение означает «обладатель волос». Основной текст передаёт наиболее прямое понимание как описание внешности, а возможное указание на одежду из волоса сохранено в сноске.
- source_word: וְאֵזוֹר עוֹר
  choice: кожаным поясом
  rationale: אֵזוֹר обозначает пояс, а עוֹר указывает на материал — кожу. Такая формулировка ясна и естественна в современном русском языке.
- source_word: אָזוּר בְּמָתְנָיו
  choice: опоясанный ... поясом
  rationale: Причастие описывает пояс, закреплённый вокруг поясницы. «Опоясанный» сохраняет образ исходного текста без архаичного «на чреслах».
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Илия Фесвитянин
  rationale: Использована укоренившаяся в русской библейской традиции форма имени и обозначения происхождения, понятная современному читателю.
- source_word: הוּא
  choice: Это
  rationale: При узнавании человека по описанию русская конструкция «Это Илия...» звучит естественнее буквального «Он — Илия...».
