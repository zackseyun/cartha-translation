base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: ru
  text: 'Елисей заболел той болезнью, от которой ему предстояло умереть. Иоас, царь Израиля, спустился к нему, плакал над ним[a] и сказал: «Отец мой[b], отец мой! Колесница Израиля и его всадники!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плакал над его лицом».'
    reason: lexical_alternative
  - marker: b
    text: Этот возглас повторяет слова Елисея, обращённые к Илии в 4 Царств 2:12.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: заболел той болезнью
  rationale: Сохраняет заметный в еврейском тексте повтор однокоренных слов, но звучит понятно и естественно по-русски.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: от которой ему предстояло умереть
  rationale: Передаёт смертельный исход болезни как ещё предстоящий с точки зрения повествования.
- source_word: וַיֵּרֶד אֵלָיו
  choice: спустился к нему
  rationale: Сохраняет выраженное глаголом ירד направление движения, не добавляя географических пояснений.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: плакал над ним
  rationale: Естественно передаёт смысл действия; буквальное «над его лицом» в современном русском может быть понято неверно, поэтому оно отмечено в сноске.
- source_word: אָבִי אָבִי
  choice: Отец мой, отец мой!
  rationale: Сохраняет притяжательный суффикс, повтор и эмоциональную силу почтительного скорбного обращения.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Колесница Израиля и его всадники!
  rationale: Сохраняет единственное число רֶכֶב, множественное число «всадники» и метафорическую форму восклицания, не раскрывая её толкованием.
theological_decisions:
- issue: Метафорический смысл слов «Колесница Израиля и его всадники»
  choice: Оставлено прямым восклицанием, обращённым к Елисею.
  alternative: Разъяснить, что Елисей является истинной защитой Израиля, либо истолковать слова как видение небесного войска.
  rationale: Текст перекликается с 4 Царств 2:12 и подчёркивает значение пророка, однако сам не разъясняет метафору; перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; метафора и повтор исходного текста сохранены без конфессионального истолкования.
