base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: ru
  text: Иехоаш, сын Иехоахаза, вернул себе города, отняв их у Бен-Хадада, сына Хазаэла; Бен-Хадад захватил их в войне у его отца, Иехоахаза. Трижды Иоаш[a] поразил его[b] и вернул города Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте одно и то же царское имя в этом стихе дано в двух формах: сначала «Иехоаш», затем «Иоаш».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «победил его». Еврейский глагол может обозначать нанесение удара, а в военном контексте — поражение противника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיִּקַּח
  choice: снова отнял
  rationale: Последовательность «вернулся/снова стал и взял» здесь естественно выражает повторное завоевание ранее утраченных городов. Русское «снова отнял» передаёт оба глагола без тяжеловесного повтора.
- source_word: הֶעָרִים
  choice: города
  rationale: Обычное и уместное обозначение населённых, вероятно укреплённых центров.
- source_word: מִיַּד
  choice: у
  rationale: Еврейская идиома буквально означает «из руки», то есть из-под власти или владения. В данном контексте русское «отнял у» естественно передаёт этот смысл.
- source_word: בֶּן־הֲדַד
  choice: Бен-Хадад
  rationale: Транслитерация составного личного имени с сохранением узнаваемой формы.
- source_word: אֲשֶׁר לָקַח
  choice: которые тот захватил
  rationale: «Тот» ясно указывает на Бен-Хадада как действующее лицо, а «захватил» естественно выражает военное овладение городами.
- source_word: בַּמִּלְחָמָה
  choice: в войне
  rationale: Близко передаёт форму и общий военный контекст исходного текста, не ограничивая событие одной битвой.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: трижды
  rationale: Краткое и естественное современное соответствие числовому обороту.
- source_word: הִכָּהוּ
  choice: поразил его
  rationale: Сохраняет основной образ глагола נכה и допускает контекстуальный смысл военного поражения, не утверждая, что Бен-Хадад был убит.
- source_word: וַיָּשֶׁב אֶת עָרֵי יִשְׂרָאֵל
  choice: вернул города Израиля
  rationale: Передаёт восстановление утраченных израильских городов без добавления отсутствующего в тексте дополнения «Израилю».
