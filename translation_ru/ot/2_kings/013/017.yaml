  text: וַ/יֹּ֗אמֶר פְּתַ֧ח הַ/חַלּ֛וֹן קֵ֖דְמָ/ה וַ/יִּפְתָּ֑ח וַ/יֹּ֤אמֶר אֱלִישָׁ֤ע יְרֵה֙ וַ/יּ֔וֹר וַ/יֹּ֗אמֶר חֵץ תְּשׁוּעָ֤ה לַֽ/יהוָה֙ וְ/חֵ֣ץ תְּשׁוּעָ֣ה בַֽ/אֲרָ֔ם וְ/הִכִּיתָ֧ אֶת אֲרָ֛ם בַּ/אֲפֵ֖ק עַד כַּלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: ru
  text: 'Он сказал: «Открой окно, выходящее на восток». Царь открыл его. Тогда Елисей сказал: «Стреляй!» Царь выстрелил. Елисей сказал: «Стрела победы от Яхве, стрела победы над Арамом![a] Ты будешь поражать Арам при Афеке, пока не уничтожишь его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово, переведённое как «победа», может также означать «спасение» или «избавление». Возможен перевод: «Стрела спасения от Яхве, стрела спасения против Арама».'
    reason: Сохраняет лексическую широту תְּשׁוּעָה и отмечает возможный альтернативный перевод образа без ослабления военного контекста.
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: Открой окно на восток
  rationale: Кֵדְמָה имеет направительное значение «к востоку»; русское «на восток» естественно передаёт направление, не превращая оборот в название «восточного окна».
- source_word: יְרֵה
  choice: Стреляй
  rationale: Краткий повелительный глагол в контексте стрельбы из лука. Объект в еврейском тексте не выражен, поэтому он не добавлен и в переводе.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: Стрела победы от Яхве
  rationale: В военном контексте תְּשׁוּעָה конкретно обозначает победу или избавление. «От Яхве» естественно выражает источник даруемой победы, при этом иной возможный разбор отмечен в сноске.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: стрела победы над Арамом
  rationale: Вторая фраза поясняет первую, а предлог בְּ в данном военном контексте имеет направленно-враждебный смысл. Повтор сохранён как часть торжественного пророческого возгласа.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено древнееврейское историческое название, а не позднейшее геополитическое соответствие «Сирия».
- source_word: וְהִכִּיתָ אֶת אֲרָם בַאֲפֵק
  choice: Ты разобьёшь Арам при Афеке
  rationale: נכה буквально означает «поразить», но в описании военного столкновения русское «разбить» ясно и естественно передаёт обещанную победу; «при Афеке» — обычное обозначение места битвы.
- source_word: עַד כַּלֵּה
  choice: и покончишь с ним
  rationale: Оборот означает доведение поражения до конца. Местоимение относится к Араму как вражеской державе или войску; перевод сохраняет лаконичность исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Значение תְּשׁוּעָה в пророческом военном знаке
  choice: победа
  alternative: спасение; избавление
  rationale: Непосредственный контекст обещает военный успех над Арамом, поэтому «победа» наиболее ясно передаёт конкретный смысл. Более широкий смысл слова сохранён в сноске.
- issue: Отношение לַיהוָה к «стреле победы»
  choice: победа исходит от Яхве
  alternative: стрела победы Яхве; стрела спасения для Яхве
  rationale: Предлог לְ допускает оттенки принадлежности и отношения; в контексте пророческого знака естественно понимать Яхве как источник даруемой победы, не утверждая, будто магическая сила заключена в самой стреле.
- issue: Степень окончательности עַד כַּלֵּה
  choice: покончишь с ним
  alternative: будешь поражать до полного разгрома
  rationale: Сохранена сила выражения о полном завершении разгрома без добавления богословского утверждения о безусловном истреблении всего народа.
translation_notes:
  register: Современный литературный русский язык с краткими, энергичными репликами, соответствующими повествованию о символическом действии. Для ясности вместо повторяющихся местоимений в двух местах названы «царь» и «Елисей»; эти референты однозначно заданы ближайшим контекстом. Пророческий возглас сохранён торжественным, но без архаизмов.
