  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: ru
  text: Но они не отступили от грехов дома Иеровоама, которыми тот ввёл Израиль в грех; и он ходил этим путём. Даже Ашера[a] оставалась стоять в Самарии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «столб Ашеры». Еврейское слово может обозначать хананейскую богиню Ашеру либо, как, вероятно, здесь, культовый предмет, связанный с её почитанием.
    reason: Лексическая неоднозначность термина הָאֲשֵׁרָה.
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: 'Передаёт уступительно-противительный переход: несмотря на только что упомянутое избавление, народ не оставил прежних грехов.'
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: не отступили от грехов
  rationale: Сочетание סור с מִן означает удалиться, отойти от чего-либо; здесь речь о неоставленных греховных обычаях.
- source_word: בֵּית יָרָבְעָם
  choice: дома Иеровоама
  rationale: Сохранён библейский образ «дома», который здесь включает культовое и династическое наследие Иеровоама.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: которыми тот ввёл Израиль в грех
  rationale: Каузативная форма חטא выражает побуждение или вовлечение Израиля в грех; «тот» естественно указывает на Иеровоама и не перегружает фразу повтором имени.
- source_word: בָּהּ הָלָךְ
  choice: он продолжал идти тем же путём
  rationale: Буквально выражение говорит, что он «ходил в ней/этом». Передача через образ пути сохраняет обычную для הלך метафору образа жизни и позволяет отразить собирательную отсылку женского единственного суффикса без неестественного русского согласования с множественным «грехами».
- source_word: וְגַם
  choice: Даже
  rationale: Передаёт усилительное добавление последнего сообщения.
- source_word: הָאֲשֵׁרָה
  choice: Ашера
  rationale: Еврейское слово может обозначать как хананейскую богиню, так и связанный с её почитанием культовый предмет; транслитерация не снимает эту неоднозначность.
- source_word: עָמְדָה
  choice: оставалась стоять
  rationale: Сохраняет буквальный образ стояния и контекстуальный смысл продолжавшегося присутствия.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Естественная русская передача местонахождения в столице Северного царства.
theological_decisions:
- issue: Кто является подлежащим в выражении בָּהּ הָלָךְ
  choice: Сохранено местоимение единственного числа «он» без явного называния лица.
  alternative: «Они продолжали следовать этим грехам» или «Иоахаз продолжал идти этим путём».
  rationale: Масоретский текст переходит от множественного «они не отступили» к единственному «он ходил». Называть Иоахаза или исправлять число означало бы молча разрешить грамматическое и референциальное напряжение текста.
- issue: Значение הָאֲשֵׁרָה
  choice: В основном тексте оставлено «Ашера», а возможный культовый предмет пояснён в сноске.
  alternative: «столб Ашеры», «священный столб» или богиня Ашера.
  rationale: То, что Ашера «оставалась стоять», вероятнее всего указывает на культовый предмет, однако само еврейское слово не содержит отдельного обозначения столба и допускает связь с именем богини.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан доступным для обычного читателя; сохранены образ «дома Иеровоама», метафора пути и неоднозначность слова «Ашера».
