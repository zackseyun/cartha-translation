source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: ru
  text: Он делал зло в глазах Яхве. Он не отступал ни от одного из грехов Иеровоама, сына Навата, который ввёл Израиль в грех; он шёл этим путём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он ходил в нём». В еврейском тексте местоимение стоит в женском роде единственного числа и, вероятно, собирательно относится к греховному пути Иеровоама.'
    reason: Передаёт формальное единственное число בָּהּ и сохраняет образ «хождения», не добавляя к тексту значение продолжения.
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Он делал зло
  rationale: Передаёт устойчивую оценочную формулу Книг Царей естественным современным русским языком; несовершенный вид уместен для общей характеристики царствования.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет еврейский образ божественной оценки и передаёт личное имя יְהוָה как «Яхве».
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: не отступал ни от одного из грехов
  rationale: В отрицательной конструкции מִכָּל означает, что он не оставил ни одного из перечисляемых грехов; формулировка ясна и естественна по-русски.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, при этом патроним передан явно.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: которыми тот ввёл Израиль в грех
  rationale: Множественное «которыми» связывает придаточное с грехами, а «тот» недвусмысленно обозначает Иеровоама; каузатив породы hифиль передан выражением «ввёл в грех».
- source_word: בָּהּ הָלָךְ
  choice: он продолжал идти этим путём
  rationale: Сохраняется метафора хождения, а формально единственное местоимение понимается собирательно как греховный путь Иеровоама; «продолжал» естественно выражает устойчивость поведения в данном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет это различие без замены титулом.
- issue: Референт אֲשֶׁר в выражении о введении Израиля в грех
  choice: 'Придаточное относится к грехам Иеровоама: «которыми тот ввёл Израиль в грех»'
  alternative: 'Придаточное относится непосредственно к Иеровоаму: «который ввёл Израиль в грех»'
  rationale: Ближайший грамматический антецедент — «грехи»; выбранный вариант сохраняет инструментальный оттенок и одновременно не меняет богословского смысла личной ответственности Иеровоама.
- issue: Формально единственное בָּהּ после множественного «грехи»
  choice: этим путём
  alternative: в них
  rationale: Единственное число может собирательно обозначать весь греховный образ действий Иеровоама. В основном тексте сохранена эта особенность, а возможность буквально соотнести местоимение с совокупностью грехов отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранена традиционная метафора нравственного пути, но устранены неестественные для русского кальки; имена даны в привычных русских библейских формах.
