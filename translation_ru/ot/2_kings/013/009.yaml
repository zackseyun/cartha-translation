  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: ru
  text: И почил Иоахаз со своими предками, и похоронили его в Самарии. Его сын Иоас[a] стал царём вместо него.
  philosophy: optimal-equivalence
  footnotes:
