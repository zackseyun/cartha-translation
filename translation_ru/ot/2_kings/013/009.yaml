lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: почил ... со своими предками
  rationale: Устойчивая царская формула сообщает о смерти Иоахаза. «Почил» сохраняет образ еврейского выражения и звучит dignified, а «предки» естественнее и точнее передаёт собирательный смысл אָבוֹת в современном русском, чем буквальное «отцы».
- source_word: וַיִּקְבְּרֻהוּ
  choice: похоронили его
  rationale: Сохранена активная форма 3-го лица множественного числа с неопределённым субъектом, а не заменена русским пассивом.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог בְּ обозначает место погребения; «в Самарии» — естественная русская передача.
- source_word: וַיִּמְלֹךְ
  choice: стал царём
  rationale: В сообщении о престолонаследии глагол обозначает вступление на царство; «стал царём» ясно передаёт начальную точку правления.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Выражение указывает на замещение предшественника на престоле и непосредственно соответствует смыслу еврейской формулы.
- source_word: יְהוֹאָחָז
  choice: Иоахаз
  rationale: Традиционная и узнаваемая русская передача имени.
- source_word: יוֹאָשׁ
  choice: Иоас
  rationale: Традиционная русская форма имени; текст WLC здесь содержит краткую еврейскую форму יוֹאָשׁ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением достоинства царской хроники. Союз «и» оставлен в первых двух звеньях повествования, а последнее предложение перестроено в естественный русский порядок слов. Архаическое «с отцами своими» заменено понятным «со своими предками».
