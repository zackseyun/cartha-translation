  source_fidelity: 'Начальное «стал молить» неоправданно добавляет значение начала действия, которого в форме wayyiqtol нет. Вторая фраза также должна яснее воспроизводить причинную структуру: Яхве услышал Иоахаза, ибо увидел угнетение Израиля, причиняемое царём Арама. «Их» уместно передаёт множественное местоимение исходного текста, относящееся к народу Израиля.'
