  terminology: '«Яхве», «Иоахаз», «Израиль» и «Арам» переданы последовательно. «Угнетение» и «притеснял» хорошо передают связь существительного и глагола от корня לחץ. Сноска к a исправлена: «умягчал лицо» не является надёжным буквальным переводом формы ויחל.'
