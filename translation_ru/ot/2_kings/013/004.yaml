  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: ru
  text: 'Иоахаз умолял Яхве, ища Его благоволения[a]. Яхве услышал его, ибо увидел угнетение Израиля: царь Арама притеснял их[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейская идиома: «умолял Яхве, ища Его благоволения»; буквально упоминается «лицо» Яхве.'
    reason: lexical_alternative
  - marker: b
    text: Арам — древнееврейское название страны, которую в старых переводах часто называют Сирией.
    reason: historical_name
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: стал молить Яхве о благоволении
  rationale: Идиома חלה את־פני означает умолять или искать благоволения; русский перевод передаёт и настойчивую просьбу, и образ благосклонности, не калькируя слово «лицо».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: услышал его
  rationale: В данном контексте שׁמע с אֶל обозначает благосклонно выслушать мольбу; «услышал» естественно по-русски и не уточняет сверх текста, каким именно был ответ.
- source_word: לַחַץ / לָחַץ
  choice: угнетают / притесняет
  rationale: Однокоренные существительное и глагол описывают давление вражеской власти. Разные естественные русские формы избегают тяжёлого повтора, сохраняя смысловую связь двух частей.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Сохранено еврейское историко-географическое имя Арам, а не позднейшее обозначение «Сирия».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Смысл идиомы ויחל את פני יהוה
  choice: молить Яхве о благоволении
  alternative: умолять Яхве; искать лица Яхве
  rationale: Формулировка передаёт просьбу о милости, но не утверждает, будто человек самостоятельно умилостивил Бога; буквальное «искать/смягчать лицо» в современном русском неясно.
- issue: Характер ответа в וַיִּשְׁמַע אֵלָיו
  choice: услышал его
  alternative: внял ему
  rationale: '«Услышал» сохраняет библейскую сдержанность: Бог благосклонно принял обращение, тогда как конкретный результат раскрывается контекстом.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «И стал» передаёт переход к действию в повествовании; настоящее время в придаточных («угнетают», «притесняет») подчёркивает продолжающееся бедствие, увиденное Яхве. Все сноски отмечены в основном тексте.
