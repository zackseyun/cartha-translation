base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: ru
  text: Он делал зло в глазах Яхве и следовал грехам Иеровоама, сына Навата, который ввёл Израиль в грех; он не отступал от неё.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отступал от неё». Местоимение в еврейском тексте стоит в женском роде единственного числа и, вероятно, относится ко всей совокупности греховных дел Иеровоама.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: Он делал зло в глазах Яхве
  rationale: Сохраняет устойчивую оценочную формулу Книг Царей и естественно звучит по-русски; личное имя יהוה передано как «Яхве».
- source_word: וַיֵּלֶךְ אַחַר
  choice: следовал
  rationale: Передаёт значение еврейской идиомы «идти за» применительно к следованию образцу поведения без неестественной для современного русского буквальности.
- source_word: חַטֹּאת יָרָבְעָם בֶּן נְבָט
  choice: грехам Иеровоама, сына Навата
  rationale: Множественное число חטאות сохранено; традиционные русские формы имён употреблены для узнаваемости, а патроним передан явно.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: который ввёл Израиль в грех
  rationale: Передаёт каузативную форму глагола חטא естественным русским выражением, сохраняя ответственность Иеровоама за грех Израиля.
- source_word: לֹא סָר מִמֶּנָּה
  choice: он не отступал от этого
  rationale: Сохраняет единственное число местоименного суффикса и не устраняет неоднозначность его собирательного референта.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Референт суффикса женского рода единственного числа в מִמֶּנָּה
  choice: от этого
  alternative: от них; от него
  rationale: Нейтральное «от этого» сохраняет грамматическое единственное число и позволяет понимать референт как совокупный греховный образ действий Иеровоама, не превращая его без пояснения во множественное число.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «в глазах Яхве» сохраняет образность оригинала; «следовал» предпочтено буквальному «шёл вслед» ради естественности.
