source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה לְ/יוֹאָ֖שׁ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֤ז עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: ru
  text: На тридцать седьмом году правления Иоаса, царя Иудеи[a], Иегоас, сын Иоахаза, стал царём над Израилем в Самарии и царствовал шестнадцать лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте имена иудейского и израильского царей различаются: יוֹאָשׁ (Иоас) и יְהוֹאָשׁ (Иегоас). В русской библейской традиции обоих иногда называют Иоасом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֶׁבַע שָׁנָה
  choice: На тридцать седьмом году правления
  rationale: Еврейская формула с בְּ + שְׁנַת и числительным обозначает год царствования. Добавление «правления» естественно для русского языка и ясно передаёт точку отсчёта.
- source_word: לְיוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: Иоаса, царя Иудеи
  rationale: Предлог לְ указывает, к чьему царствованию относится названный год; приложение «царя Иудеи» отождествляет правителя. Для יוֹאָשׁ сохранена традиционная русская форма «Иоас».
- source_word: מָלַךְ
  choice: стал царём
  rationale: В хронологических формулах Qal perfect глагола מלך может обозначать вступление на престол, а не весь период царствования; длительность затем сообщается отдельно.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: Иегоас, сын Иоахаза
  rationale: Форма «Иегоас» передаёт более полное написание יְהוֹאָשׁ и позволяет отличить израильского царя от иудейского יוֹאָשׁ — Иоаса.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при מלך выражает власть над народом или страной; буквальное русское соответствие здесь понятно и естественно.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог בְּ обозначает место; Самария здесь выступает столицей, где правил северный царь.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: царствовал шестнадцать лет
  rationale: Числительное обозначает продолжительность правления; повтор глагола «царствовал» создаёт ясную и естественную русскую формулу.
