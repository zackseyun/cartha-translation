  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: ru
  text: 'Затем он сказал: «Возьми стрелы». Царь взял их. И он сказал царю Израиля: «Ударь по земле». Царь ударил по земле три раза и остановился.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и встал». В этом контексте глагол, вероятно, означает, что царь перестал бить после трёх ударов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: Возьми стрелы
  rationale: Повелительная форма передана прямо и естественно; определённость стрел ясна из контекста и не требует отдельного выражения в русском языке.
- source_word: וַיִּקָּח
  choice: Тот взял их
  rationale: Местоимение «их» естественно восполняет подразумеваемое дополнение — стрелы, а «тот» помогает различить участников диалога.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: царю Израиля
  rationale: Формально точная и естественная для русского библейского повествования передача.
- source_word: הַךְ אַרְצָה
  choice: Бей по земле
  rationale: נכה выражает энергичное действие, а направительная форма אַרְצָה указывает на землю. «Бей по земле» сохраняет повторный характер ожидаемого действия и не вводит интерпретацию «стреляй».
- source_word: וַיַּךְ שָׁלֹשׁ פְּעָמִים
  choice: Тот ударил три раза
  rationale: Передаёт действие тем же корнем, насколько позволяет естественный русский язык; «три раза» — обычный эквивалент еврейского оборота.
- source_word: וַיַּעֲמֹד
  choice: остановился
  rationale: Буквально глагол означает «встал/стоял», но здесь контекстуально указывает на прекращение повторных ударов. Основной текст передаёт идиоматический смысл, а буквальная возможность отмечена в сноске.
