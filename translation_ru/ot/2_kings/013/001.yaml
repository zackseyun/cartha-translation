  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: ru
  text: В двадцать третий год царствования Иоаса, сына Охозии, царя Иудеи, Иоахаз, сын Ииуя, начал царствовать над Израилем в Самарии и царствовал семнадцать лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: В двадцать третий год царствования
  rationale: Естественная русская формула датировки; добавление «царствования» явно передаёт подразумеваемый в еврейском тексте отсчёт лет правления Иоаса.
- source_word: מָלַךְ
  choice: начал царствовать … и царствовал
  rationale: Первое употребление вводит начало правления, а указание длительности передаётся вторым глаголом; так сохраняются структура и смысл исходной формулы.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Точно передаёт объект царской власти и соответствует литературной русской библейской речи.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Сохраняет указание на столицу и место правления без поясняющего расширения.
