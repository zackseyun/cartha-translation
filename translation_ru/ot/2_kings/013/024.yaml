  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: ru
  text: И умер Азаил, царь Арама, а вместо него воцарился его сын Бен-Хадад.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер
  rationale: Форма Qal wayyiqtol от מות передаёт последовательное событие повествования; русское «И умер» естественно сохраняет связь с предшествующим контекстом.
- source_word: חֲזָאֵל
  choice: Азаил
  rationale: Традиционная русская библейская передача имени, остающаяся понятной современному читателю.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: אֲרָם — собственное название исторического царства; «Арам» точнее отражает еврейский текст, чем традиционное «Сирия».
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол מלך обозначает вступление на царство; «воцарился» кратко и точно передаёт это значение.
- source_word: בֶּן־הֲדַד
  choice: Бен-Хадад
  rationale: Транслитерация составного личного или династического имени с дефисом сохраняет его еврейскую форму.
- source_word: בְּנוֹ
  choice: его сын
  rationale: Суффикс относится к Азаилу; родственная связь выражена явно.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте царской преемственности выражение обозначает занятие места предшественника.
