lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: Азаил
  rationale: Личное имя передано в привычной русской библейской форме; начальный וַ־ служит связью с продолжающимся повествованием и не требует отдельного союза в естественном русском изложении.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Сочетание передано прямо; «Арам» отражает еврейское собственное имя אֲרָם точнее, чем традиционное географическое соответствие «Сирия».
- source_word: לָחַץ
  choice: притеснял
  rationale: Глагол обозначает длительное давление и угнетение; несовершенный вид естественно выражает продолжавшееся военно-политическое притеснение.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Название народа и царства передано без добавлений; в контексте имеется в виду северное царство Израиля.
- source_word: כֹּל יְמֵי
  choice: во все дни
  rationale: 'Сохранён исходный временной оборот и его некоторая широта: речь может идти обо всём соответствующем периоде жизни или царствования Иоахаза.'
- source_word: יְהוֹאָחָז
  choice: Иоахаза
  rationale: Использована устоявшаяся русская форма имени с требуемым контекстом родительным падежом.
