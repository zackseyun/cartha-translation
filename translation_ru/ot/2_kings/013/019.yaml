source:
  edition: WLC
  text: וַ/יִּקְצֹ֨ף עָלָ֜י/ו אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּ֨אמֶר֙ לְ/הַכּ֨וֹת חָמֵ֤שׁ אוֹ שֵׁשׁ֙ פְּעָמִ֔ים אָ֛ז הִכִּ֥יתָ אֶת אֲרָ֖ם עַד כַּלֵּ֑ה וְ/עַתָּ֕ה שָׁלֹ֥שׁ פְּעָמִ֖ים תַּכֶּ֥ה אֶת אֲרָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: ru
  text: 'Тогда человек Божий разгневался на него и сказал: «Тебе следовало ударить по земле пять или шесть раз[a] — тогда ты наносил бы Араму поражения, пока не покончил бы с ним[b]. А теперь ты нанесёшь Араму поражение лишь трижды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ударить пять или шесть раз»; слова «по земле» восполнены из непосредственно предшествующего действия в стихе 18.'
    reason: cross_reference
  - marker: b
    text: 'Или: «до полного разгрома Арама».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: разгневался
  rationale: Глагол קצף обозначает сильный гнев; «разгневался» естественно и достойно звучит в современном русском повествовании, не усиливая значение до ярости.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранено устойчивое древнееврейское обозначение, а не более узкое толкование «пророк».
- source_word: לְהַכּוֹת
  choice: надо было ударить по земле
  rationale: Сам текст стиха буквально говорит «ударить», но подразумеваемый предмет действия ясен из непосредственно предшествующего стиха 18; он восполнен ради понятности.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: пять или шесть раз
  rationale: Прямой перевод числового выражения.
- source_word: אָז
  choice: тогда
  rationale: Передаёт следствие нереализованного условия.
- source_word: הִכִּיתָ אֶת אֲרָם
  choice: ты разбил бы Арам
  rationale: В военном контексте נכה означает нанести поражение. Русское «разбить» естественно передаёт этот смысл; связь с символическими ударами сохраняется общей корневой образностью контекста, хотя буквальное «ударить Арам» по-русски неестественно.
- source_word: עַד כַּלֵּה
  choice: до полного уничтожения
  rationale: Инфинитив כלה выражает доведение действия до конца. Эта формулировка ясно передаёт полную военную ликвидацию Арама как противника, не утверждая непременно истребление каждого человека.
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт контраст между упущенной возможностью и предстоящим ограниченным результатом.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: ты разобьёшь Арам лишь три раза
  rationale: Имперфект имеет предсказательное значение. «Лишь» выражает ограничение, подразумеваемое противопоставлением пяти или шести ударам.
theological_decisions:
- issue: Связь между символическими ударами по земле и победами над Арамом
  choice: В первом случае употреблено «ударить по земле», во втором — «разбить Арам».
  alternative: 'Сохранить один и тот же глагол: «ударить» в обоих случаях.'
  rationale: Символическая связь сохраняется последовательностью высказывания и числом ударов, тогда как буквальное «ударить Арам» звучало бы в современном русском искусственно и затемняло военный смысл.
- issue: Степень силы выражения עַד כַּלֵּה
  choice: до полного уничтожения
  alternative: пока не покончишь с ним; до конца
  rationale: Еврейское выражение указывает на доведение поражения Арама до полного конца. Сноска сохраняет менее категоричную лексическую возможность и поясняет военный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ясный; сохранено традиционное выражение «человек Божий». Все сноски отмечены в основном тексте.
