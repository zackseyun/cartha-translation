  to: 'Тогда человек Божий разгневался на него и сказал: «Тебе следовало ударить по земле пять или шесть раз[a] — тогда ты наносил бы Араму поражения, пока не покончил бы с ним[b]. А теперь ты нанесёшь Араму поражение лишь трижды».'
