  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: ru
  text: И воспылал гнев Яхве на Израиль, и Он отдал их во власть[a] Азаила, царя Арама,[b] и во власть Бен-Хадада, сына Азаила, на всё то время.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку»; это еврейский оборот со значением «под власть, под контроль».'
    reason: lexical_alternative
  - marker: b
    text: Арам — еврейское название страны, которую в более старых переводах часто называют Сирией.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «во все те дни», то есть на протяжении всего того периода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Передаёт образный еврейский оборот о разгоревшемся гневе и при этом естественно звучит в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: При обозначении гнева предлог выражает направленность гнева против Израиля; русское «гнев на Израиль» идиоматично.
- source_word: וַיִּתְּנֵם
  choice: Он отдал их
  rationale: В данном контексте форма глагола נתן означает передачу народа под власть противника. Местоимение во множественном числе сохраняет согласование по смыслу с собирательным «Израиль».
- source_word: בְּיַד
  choice: во власть
  rationale: Еврейское «в руку» является устойчивой идиомой, означающей передачу под власть или контроль. Смысловая передача по-русски яснее буквального «в руку».
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Азаила, царя Арама
  rationale: Имена и название страны переданы непосредственно с еврейского; «Арам» точнее отражает исходный топоним, чем традиционное «Сирия».
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: Бен-Хадада, сына Азаила
  rationale: Сохранены составное собственное имя и явно выраженное в еврейском тексте указание на происхождение.
- source_word: כָּל הַיָּמִים
  choice: на всё то время
  rationale: Контекстуально фраза обозначает весь упомянутый период господства; формулировка естественна по-русски и сохраняет временную протяжённость.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит тетраграмматон — личное имя Бога. Передача «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Действующее лицо суда над Израилем
  choice: Яхве отдал Израиль под власть вражеских царей
  alternative: Обезличенная формулировка о попадании Израиля под их власть
  rationale: Еврейский текст прямо называет Яхве субъектом глагола וַיִּתְּנֵם; активная конструкция сохраняет выраженную в тексте богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Яркий образ «воспылал гнев» сохранён, тогда как непрозрачная для обычного русского читателя идиома «в руку» передана по смыслу как «во власть» и пояснена в сноске. Прописное «Он» употреблено для ясного указания на Яхве без добавления нового содержания.
