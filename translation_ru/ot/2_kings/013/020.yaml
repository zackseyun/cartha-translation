base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: ru
  text: Елисей умер, и его похоронили. А моавитские отряды обычно вторгались в страну с наступлением года.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весной». Буквально: «с наступлением года»; это выражение может обозначать начало нового годового цикла — время, с которым нередко был связан сезон военных походов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Последовательная форма с waw продолжает повествование; в русском естественная последовательность передаётся простым прошедшим временем.
- source_word: אֱלִישָׁע
  choice: Елисей
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: וַיִּקְבְּרֻהוּ
  choice: и его похоронили
  rationale: Сохранена активная форма неопределённо-личного предложения, соответствующая еврейскому глаголу во множественном числе с местоименным суффиксом.
- source_word: גְדוּדֵי מוֹאָב
  choice: моавитские отряды
  rationale: גְּדוּד обозначает вооружённый, нередко набеговый отряд; естественное русское сочетание сохраняет военный смысл без представления о регулярной армии.
- source_word: יָבֹאוּ
  choice: обычно вторгались
  rationale: Имперфект в данном контексте выражает повторяющееся действие; «обычно» делает узуальный смысл явным, а «вторгались» естественно передаёт движение вооружённых отрядов в чужую землю.
- source_word: בָאָרֶץ
  choice: в страну
  rationale: При глаголе движения предлог ב обозначает направленность внутрь; «в страну» по-русски естественно передаёт вступление на её территорию.
- source_word: בָּא שָׁנָה
  choice: с наступлением года
  rationale: Буквально выражение означает «при наступлении года». Основной текст сохраняет образ и неоднозначность идиомы, а вероятное сезонное значение поясняется в сноске.
