base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: ru
  text: Однажды, когда хоронили человека, люди вдруг увидели отряд налётчиков и бросили тело умершего в гробницу Елисея. Когда тело коснулось костей Елисея, человек ожил и встал на ноги.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדוּד
  choice: отряд грабителей
  rationale: В данном контексте слово обозначает вооружённый отряд, совершавший набеги; такой перевод естественен по-русски и передаёт угрозу, заставившую людей прервать погребение.
- source_word: וַיֵּלֶךְ וַיִּגַּע
  choice: упав туда, ... коснулся
  rationale: Буквально сочетание допускает передачу «пошёл/оказался и коснулся», однако по контексту речь идёт о движении брошенного тела внутрь гробницы до соприкосновения с костями. «Упав туда» естественно выражает это движение без предположения, что мёртвый человек шёл сам.
- source_word: וַיְחִי
  choice: ожил
  rationale: Глагол חיה здесь означает возвращение умершего к жизни.
- source_word: וַיָּקָם עַל־רַגְלָיו
  choice: встал на ноги
  rationale: Прямой и естественный русский эквивалент еврейского выражения.
theological_decisions:
- issue: Причина оживления человека
  choice: 'Сохранена повествовательная последовательность: прикосновение к костям Елисея, затем оживление; действующая сила прямо не названа.'
  alternative: Добавить, что человека воскресил Бог или что сила исходила от останков Елисея.
  rationale: Еврейский текст не называет действующего лица и не объясняет механизм чуда; перевод не должен вводить отсутствующее богословское толкование.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. «Покойника» употреблено как естественное обозначение тела умершего в контексте погребения, а «гробница» точнее русского «могила» передаёт קֶבֶר как место, куда можно бросить тело и где находились кости Елисея.
