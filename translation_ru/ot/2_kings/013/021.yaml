revisions:
- from: Однажды, когда хоронили человека, люди вдруг увидели отряд грабителей и бросили покойника в гробницу Елисея. Упав туда, человек коснулся костей Елисея, ожил и встал на ноги.
  to: Однажды, когда хоронили человека, люди вдруг увидели отряд налётчиков и бросили тело умершего в гробницу Елисея. Когда тело коснулось костей Елисея, человек ожил и встал на ноги.
  rationale: 'Устранено добавленное указание на падение; причинно-временная связь передана нейтральным «Когда тело коснулось». Сохранены имя Елисей, гробница, кости и повествовательная неопределённость относительно причины чуда. Сноски не требуются: в переводе нет спорного варианта или необходимого пояснения.'
