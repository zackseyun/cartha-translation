review_pass:
  verdict: revise
  source_fidelity: 'Основная последовательность событий передана верно: во время погребения люди увидели вооружённый отряд, бросили тело в гробницу Елисея; оно коснулось костей Елисея, ожило и встало на ноги. Однако «упав туда» прямо добавляет способ перемещения, которого еврейский текст не уточняет. Сочетание וַיֵּלֶךְ וַיִּגַּע буквально содержит «пошёл/попал и коснулся» и в данном контексте относится к телу, но не требует утверждать именно падение.'
  naturalness: Текст в целом современный и понятный. «Покойник» возможно в нейтральном повествовании, но «тело умершего» точнее соотносится с повторяемым אִישׁ («человек») и несколько сдержаннее по регистру. «Отряд налётчиков» естественно передаёт гְּדוּד как отряд, совершающий набег.
  terminology: '«Гробница Елисея», «кости Елисея», «ожил» и «встал на ноги» удачны. Не следует пояснять, чьей силой произошло оживление: текст сообщает последовательность событий, но не называет механизма.'
  issues:
  - severity: medium
    issue: Добавлено обстоятельство «упав туда».
    rationale: Еврейский текст сообщает, что тело «пошло/попало и коснулось» костей, но не называет падения. Перевод должен сохранять эту недоговорённость.
  - severity: low
    issue: «Отряд грабителей» слишком узко характеризует гְּדוּד.
    rationale: В контексте это набеговый вооружённый отряд; «налётчики» передаёт угрозу и действие набега, не сводя участников к обычным грабителям.
  revised_text: Однажды, когда хоронили человека, люди вдруг увидели отряд налётчиков и бросили тело умершего в гробницу Елисея. Когда тело коснулось костей Елисея, человек ожил и встал на ноги.
