base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: ru
  text: И почил Иоас со своими отцами[a], а Иеровоам воссел на его престоле. И был погребён Иоас в Самарии с царями Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лёг со своими отцами»; это устойчивое древнееврейское выражение, сообщающее о смерти царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: Глагол входит в устойчивую царскую формулу смерти. «Почил» сохраняет образ покоя и при этом естественно обозначает смерть в современном литературном русском.
- source_word: עִם אֲבֹתָיו
  choice: со своими отцами
  rationale: Буквально и прозрачно передаёт династическую формулу; «предками» было бы яснее, но менее точно сохраняло бы исходный образ.
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: воссел на его престоле
  rationale: Сохраняет образ сидения на престоле и естественно выражает вступление преемника на царство, не подменяя метафору пояснением.
- source_word: וַיִּקָּבֵר
  choice: был погребён
  rationale: Передаёт пассивную форму, не вводя отсутствующего в тексте действующего лица.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Естественная локативная передача предлога ב и места погребения.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: с царями Израиля
  rationale: Близко следует еврейскому тексту и указывает на погребение рядом с прежними израильскими царями.
