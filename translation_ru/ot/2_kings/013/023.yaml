revisions:
- from: Но Яхве был милостив к ним, сжалился над ними и обратился к ним ради Своего завета с Авраамом, Исааком и Иаковом. Он не пожелал погубить их и доныне не изгнал их от Своего лица.
  to: Но Яхве был милостив к ним, сжалился над ними и обратил к ним Свой взор ради Своего завета с Авраамом, Исааком и Иаковом. До сих пор Он не пожелал уничтожить их и не отверг их из Своего присутствия.
  rationale: Исправлена область действия «до сих пор», чтобы она охватывала оба отрицательных действия, как в исходном тексте. «Обратил к ним Свой взор» передаёт образ וַיִּפֶן אֲלֵיהֶם без русской двусмысленности, а «не отверг их из Своего присутствия» сохраняет смысл удаления от Божьего лица без чрезмерной конкретизации. Смысл, имена и ключевые термины сохранены.
