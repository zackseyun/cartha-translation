  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: ru
  text: Но Яхве был милостив к ним, сжалился над ними и обратил к ним Свой взор ради Своего завета с Авраамом, Исааком и Иаковом. До сих пор Он не пожелал уничтожить их и не отверг их из Своего присутствия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּחָן
  choice: был милостив к ним
  rationale: Глагол חנן выражает благосклонность и милость; эта формулировка естественна по-русски и сохраняет богословский оттенок незаслуженной милости.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: וַיְרַחֲמֵם
  choice: сжалился над ними
  rationale: Глагол רחם обозначает глубокое сострадание; «сжалился» ясно и естественно передаёт это значение в данном повествовательном контексте.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: обратился к ним
  rationale: Сохраняет образ поворота к кому-либо и подразумеваемое благосклонное внимание, не разъясняя его сверх сказанного в тексте.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: ради Своего завета
  rationale: למען указывает здесь на основание или побуждение Божьего действия; «ради» кратко и точно сохраняет эту связь.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: с Авраамом, Исааком и Иаковом
  rationale: Компактная еврейская конструкция относится к завету, заключённому с патриархами; предлог «с» естественно выражает это по-русски.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: Он не пожелал погубить их
  rationale: אָבָה передаёт волю или согласие; «не пожелал» сохраняет волевой оттенок, а «погубить» соответствует причинному значению שׁחת.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: не изгнал их от Своего лица
  rationale: Формулировка сохраняет сильный глагол удаления и образ нахождения перед Божьим лицом, то есть в Его присутствии.
- source_word: עַד עָתָּה
  choice: доныне
  rationale: Кратко обозначает продолжение положения до времени повествователя и соответствует литературному регистру стиха.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет его и не подменяет титулом.
- issue: Связь милости Бога с заветом патриархов
  choice: ради Своего завета с Авраамом, Исааком и Иаковом
  alternative: из-за Своего завета с Авраамом, Исааком и Иаковом
  rationale: «Ради» передаёт основание Божьей милости и удерживает связь с верностью завету, не добавляя позднейших богословских формулировок.
- issue: Образ удаления от Божьего лица
  choice: не изгнал их от Своего лица
  alternative: не удалил их из Своего присутствия
  rationale: Выбранная формулировка сохраняет конкретный образ исходного текста, тогда как альтернатива яснее раскрывает идиоматический смысл, но менее формально соответствует еврейскому выражению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для широкого читателя; образ «от Своего лица» сохранён как значимый и понятный библейский оборот.
