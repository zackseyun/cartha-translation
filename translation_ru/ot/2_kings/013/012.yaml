base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Прочие деяния Иоаса, всё, что он совершил, и его воинская доблесть в войне с Амасией, царём Иудеи, — разве не записаны они в Летописи царей Израиля?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «Летописью царей Израиля» здесь подразумевается царский анналистический источник, на который ссылается автор книг Царств, а не библейские книги Паралипоменон.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Прочие деяния Иоаса
  rationale: В формуле, завершающей рассказ о царствовании, דִּבְרֵי означает не только «слова», но дела и события; «прочие деяния» естественно передаёт историографический смысл יֶתֶר דִּבְרֵי.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: всё, что он совершил
  rationale: Переданы всеобъемлющее значение כָל и широкий смысл עשה; «совершил» соответствует достоинству летописного регистра.
- source_word: וּגְבוּרָתוֹ
  choice: и проявленная им доблесть
  rationale: גְּבוּרָה может обозначать силу, доблесть или могучие деяния. Уточнение «проявленная им» позволяет естественно связать существительное с последующим описанием войны, не сводя его смысл только к физической силе.
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: когда он воевал с
  rationale: Относительная конструкция поясняет, в чём проявилась доблесть Иоаса. Русское «воевал с» естественно обозначает враждебное военное столкновение и сохраняет близость к предлогу עִם («с»).
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: Амасией, царём Иудеи
  rationale: Имя передано в традиционной русской библейской форме; приложение обособлено по нормам современного русского языка.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: Сохранены риторический вопрос и пассивная конструкция исходного текста.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: в Летописи царей Израиля
  rationale: «Летопись» естественно передаёт название анналистического источника. Предлог עַל при указании письменного источника идиоматически переводится русским «в».
theological_decisions:
- issue: Отождествление упомянутого источника с каноническими книгами Паралипоменон
  choice: Название переведено как «Летопись царей Израиля» и снабжено примечанием о царском анналистическом источнике.
  alternative: «Книга Паралипоменон царей Израиля»
  rationale: Контекст формулы в книгах Царств указывает на цитируемый царский источник; перевод не должен создавать впечатления, что речь непременно идёт о канонических книгах Паралипоменон.
translation_notes:
  register: Современный литературный русский язык с достоинством историографической формулы. Синтаксис несколько упрощён ради ясности, но риторический вопрос, перечисление и связь доблести с войной сохранены. Единственный маркер [a] поставлен непосредственно после названия источника, к которому относится примечание.
