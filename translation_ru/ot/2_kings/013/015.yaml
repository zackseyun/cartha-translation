lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: לּוֹ
  choice: ему
  rationale: Предлог ל с суффиксом 3-го лица мужского рода единственного числа обозначает адресата слов Елисея.
- source_word: אֱלִישָׁע
  choice: Елисей
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: קַח
  choice: Возьми
  rationale: Прямое и естественное соответствие повелительной форме глагола לקח.
- source_word: קֶשֶׁת וְחִצִּים
  choice: лук и стрелы
  rationale: Сохранены оба названия оружия и их повтор во второй части стиха, как в еврейском тексте.
- source_word: וַיִּקַּח
  choice: И тот принёс
  rationale: Форма продолжает последовательность действий. В сочетании с направительным אֵלָיו русское «принёс» естественно выражает взятие предметов и доставку их к Елисею; «тот» устраняет неясность между двумя мужчинами.
- source_word: אֵלָיו
  choice: ему
  rationale: Предлог אֶל с местоименным суффиксом обычно имеет направительное значение «к нему» и здесь естественнее всего относится к Елисею.
