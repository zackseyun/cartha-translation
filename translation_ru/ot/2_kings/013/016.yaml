  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: ru
  text: 'Затем он сказал царю Израиля: «Положи руку на лук». Царь положил руку на лук, а Елисей положил руки на руки царя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְכֵּב יָדְךָ עַל הַקֶּשֶׁת
  choice: Положи руку на лук
  rationale: Редкое в данном значении употребление каузативной формы רכב описывает помещение руки на лук. «Положи» естественно передаёт действие по-русски, не привнося буквальный, но здесь неуместный образ езды верхом.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: Царь положил руку на лук
  rationale: В еврейском тексте объект повторно не назван, однако по-русски его уместно восстановить из непосредственного контекста. Слово «царь» устраняет возможную неясность местоимения при двух мужских участниках сцены.
- source_word: וַיָּשֶׂם
  choice: положил
  rationale: Нейтрально и точно описывает физическое действие, не наделяя жест заранее истолкованным ритуальным смыслом.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: свои руки на руки царя
  rationale: Сохранено множественное число с обеих сторон и пространственное отношение עַל, благодаря чему физическая картина передана без добавленного толкования.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: Затем он сказал царю Израиля
  rationale: «Затем» естественно передаёт продвижение последовательного повествования, выраженное формой с וַ.
theological_decisions:
- issue: Значение того, что Елисей положил руки на руки царя
  choice: Передать действие буквально и без поясняющей символики в основном тексте.
  alternative: Истолковать жест как пророческое наделение силой или как знак Божьего руководства в битве.
  rationale: Сам стих описывает жест, но не объясняет его значения; перевод не должен встраивать в повествование одно из возможных богословских толкований.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Повтор слова «рука» сохранён ради точности и наглядности действия, хотя по-русски он слегка заметен стилистически.
