  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: ru
  text: Ибо он не оставил Иоахазу войска, кроме пятидесяти всадников, десяти колесниц и десяти тысяч пеших воинов, потому что царь Арама истребил их и сделал подобными праху, который топчут при молотьбе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал их подобными праху для молотьбы». Еврейский глагол обозначает молотьбу посредством топтания и может подчёркивать образ попрания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: не оставил
  rationale: Каузативная форма означает «оставить в живых/в наличии»; в контексте уцелевших сил естественно русское «не оставил».
- source_word: עָם
  choice: войска
  rationale: Хотя слово обычно означает «народ», последующее перечисление всадников, колесниц и пеших воинов задаёт военный смысл. «Войска» сохраняет собирательность и ясно передаёт контекст.
- source_word: כִּי אִם
  choice: кроме
  rationale: После отрицания оборот вводит единственное исключение, то есть оставшийся минимум.
- source_word: פָּרָשִׁים
  choice: всадников
  rationale: Слово обозначает конных воинов; «всадники» — ясный и традиционный русский эквивалент.
- source_word: רֶכֶב
  choice: колесниц
  rationale: Собирательное существительное при числительном обозначает десять боевых колесниц.
- source_word: רַגְלִי
  choice: пеших воинов
  rationale: Обозначает воинов, сражающихся пешими; формулировка прозрачнее для современного читателя, чем «пехотинцев» в древнем контексте.
- source_word: אִבְּדָם
  choice: истребил их
  rationale: Интенсивная форма выражает уничтожение; местоименный суффикс относится к военным силам Иоахаза.
- source_word: וַיְשִׂמֵם
  choice: сделал
  rationale: В сочетании со сравнительным оборотом глагол означает «сделал, привёл в состояние».
- source_word: כֶּעָפָר
  choice: подобными праху
  rationale: Сохраняет сравнение и библейский образ полного сокрушения, оставаясь понятным в современном русском.
- source_word: לָדוּשׁ
  choice: при молотьбе
  rationale: Инфинитив от דושׁ вызывает образ молотьбы посредством попирания; основной текст передаёт сельскохозяйственный образ, а примечание сохраняет возможный оттенок попирания.
