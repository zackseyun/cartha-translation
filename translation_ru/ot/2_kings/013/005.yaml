  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: ru
  text: И дал Яхве Израилю избавителя[a], и они вышли из-под власти Арама[b]. И сыны Израиля жили в своих шатрах, как прежде[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасителя». Еврейское слово означает того, кто приносит спасение или избавление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-под руки Арама» — еврейское выражение, означающее освобождение от власти Арама.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «как вчера и позавчера» — еврейское выражение со значением «как прежде», «как в прежние времена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, сохраняя его отличие от титула «Господь».
- source_word: מוֹשִׁיעַ
  choice: избавителя
  rationale: Обозначает того, через кого приходит спасение от угнетения; в данном историко-политическом контексте «избавитель» естественнее и не навязывает мессианского отождествления.
- source_word: מִתַּחַת יַד אֲרָם
  choice: из-под власти Арама
  rationale: Еврейская идиома буквально говорит о выходе «из-под руки» и означает освобождение от господства; смысл передан естественным современным русским выражением.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено историческое библейское название государства, а не использовано более позднее географическое название «Сирия».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет семейно-заветную формулу оригинала; форма «сыны» уместна в возвышенном повествовательном регистре и понятна современному читателю.
- source_word: בְּאָהֳלֵיהֶם
  choice: в своих шатрах
  rationale: Сохраняет конкретный образ оригинала; «шатры» звучит литературно и естественно в библейском историческом повествовании.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: как прежде
  rationale: Передаёт смысл устойчивой еврейской идиомы о прежних временах, избегая непонятного буквального воспроизведения.
- source_word: וַיֵּצְאוּ
  choice: они вышли
  rationale: Прямо передаёт глагол יצא; последующая фраза уточняет, что речь идёт об освобождении от власти.
- source_word: וַיֵּשְׁבוּ
  choice: стали ... жить
  rationale: В контексте возвращения к нормальной жизни это естественная русская передача значения «жили/обитали»; «стали» отражает повествовательную последовательность.
theological_decisions:
- issue: Передача מוֹשִׁיעַ как «избавитель» или «спаситель»
  choice: избавитель
  alternative: спаситель
  rationale: Контекст говорит о земном освобождении от арамейского господства. «Избавитель» сохраняет идею спасения, но не приписывает названному лицу мессианский смысл, которого стих прямо не выражает.
- issue: Сохранение семейного выражения בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / народ Израиля
  rationale: Выбор сохраняет явную семейно-заветную образность и грамматическую форму еврейского текста, не сводя её к нейтральному этнониму.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис разбит на два предложения ради ясности. Конкретные образы сохранены там, где они понятны («шатры»), а непрозрачные идиомы переданы по смыслу и пояснены в сносках.
