base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Прочие деяния Иоахаза, всё, что он совершил, и его сила[b] — разве не записаны они в Книге летописей[a] царей Израиля?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Книге хроник царей Израиля»; речь идёт о царских анналах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его могущество», «его доблесть» или «его подвиги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: Прочие деяния Иоахаза
  rationale: В формуле, завершающей рассказ о царствовании, דִּבְרֵי обозначает не только слова, но дела и события; «деяния» естественно передаёт этот широкий исторический смысл.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: всё, что он совершил
  rationale: Сохраняет широкий охват еврейского относительного оборота и звучит естественно в литературном русском языке.
- source_word: וּגְבוּרָתוֹ
  choice: и его могущество
  rationale: גְּבוּרָה может обозначать силу, доблесть либо проявления силы. «Могущество» сохраняет обобщённость и не сводит выражение исключительно к воинской храбрости или отдельным подвигам.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: Передаёт стандартный риторический вопрос царских итоговых формул; множественное число согласуется с перечисленными деяниями, совершённым и могуществом.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Хотя עַל буквально может означать «на», применительно к письменному источнику русский язык требует «в книге».
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: летописей царей Израиля
  rationale: Устойчиво и понятно передаёт название анналистического царского источника; לְ здесь выражает отношение к царям Израиля.
