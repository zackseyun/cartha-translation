  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי הַ/יַּרְדֵּ֔נָ/ה וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּלְכ֖וּ שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: ru
  text: 'Тогда Илия сказал ему: «Останься, пожалуйста, здесь, потому что Яхве послал меня к Иордану[a]». Но тот ответил: «Жив Яхве, и жив ты сам[b]: я не оставлю тебя!» И пошли они вдвоём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к реке Иордан».'
    reason: lexical_alternative
  - marker: b
    text: 'Древнееврейская формула клятвы буквально звучит: «Жив Яхве, и жива твоя жизнь, если я оставлю тебя…» Подразумеваемый смысл: «Я ни за что не оставлю тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: Останься, пожалуйста
  rationale: Глагол ישׁב здесь означает остаться на месте, а частица נָא придаёт просьбе вежливый, настоятельный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: שְׁלָחַנִי
  choice: послал меня
  rationale: Перфект обозначает уже данное поручение, сохраняющее силу в данный момент; по-русски естественно простое прошедшее время.
- source_word: הַיַּרְדֵּנָה
  choice: к Иордану
  rationale: Направительный суффикс -ה указывает на движение к Иордану; название может обозначать реку без добавления слова «река».
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Жив Яхве, и жив ты сам
  rationale: Сохранена древнееврейская формула клятвы. נֶפֶשׁ в этом обороте означает жизнь или самого человека, поэтому «ты сам» естественнее и точнее, чем «твоя душа».
- source_word: אִם אֶעֶזְבֶךָּ
  choice: я не оставлю тебя
  rationale: אִם вводит усечённую клятвенную формулу с подразумеваемым проклятием; её смысл — решительное отрицание, а не условие.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: И пошли они вдвоём
  rationale: Переданы как продолжение повествования, так и подчёркнутое указание на совместный путь обоих.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Усечённая клятва אִם אֶעֶזְבֶךָּ
  choice: я не оставлю тебя
  alternative: если я оставлю тебя…
  rationale: Буквальная условная форма в русском без подразумеваемого самопроклятия могла бы исказить смысл. Прямое отрицание передаёт несомненную силу клятвы, а её форму поясняет сноска.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формула клятвы намеренно сохраняет лёгкую архаическую торжественность, а сноска разъясняет её буквальное строение и смысл.
