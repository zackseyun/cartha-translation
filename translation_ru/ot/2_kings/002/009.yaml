base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: ru
  text: 'Когда они перешли, Илия сказал Елисею: «Проси, что мне сделать для тебя, прежде чем я буду взят от тебя». Елисей ответил: «Пусть же мне достанется двойная доля[a] твоего духа[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «две доли». Еврейское выражение означает двойную долю и, вероятно, отсылает к наследственной доле первенца.'
    reason: lexical_alternative
  - marker: b
    text: «Твой дух» — дух, связанный с пророческим служением Илии. Некоторые понимают просьбу как желание получить вдвое больше пророческой силы, чем было у Илии.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: когда они перешли
  rationale: Форма от עבר с суффиксом 3-го лица множественного числа относится к Илии и Елисею. Совершенный вид передаёт переход как завершившееся действие, предшествующее разговору; объект перехода в самом стихе не назван и потому не добавлен.
- source_word: שְׁאַל
  choice: проси
  rationale: Прямое повеление; «проси» естественно передаёт предложение Илии высказать просьбу.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: что мне сделать для тебя
  rationale: Сохраняет вопросительно-делиберативный оттенок и естественно выражает готовность Илии исполнить просьбу, не превращая её в заранее данное обещание.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: прежде чем я буду взят от тебя
  rationale: Страдательная форма לקח сохранена без указания действующего лица; «от тебя» передаёт предстоящее разлучение.
- source_word: וִיהִי נָא
  choice: пусть же
  rationale: Просительная форма с נָא выражает почтительную просьбу; частица «же» естественно передаёт смягчённый, настойчиво-просительный тон.
- source_word: פִּי שְׁנַיִם
  choice: двойная доля
  rationale: Еврейское выражение буквально связано с двумя долями и обычно обозначает двойную наследственную долю. Такой перевод сохраняет вероятный отзвук права первенца и не сводит просьбу к арифметически удвоенной силе.
- source_word: בְּרוּחֲךָ
  choice: твоего духа
  rationale: 'Строчная буква и притяжательное местоимение сохраняют непосредственную формулировку: речь о духе, связанном с Илиёй и его пророческим служением, без навязывания более узкой догматической идентификации.'
- source_word: אֵלָי
  choice: мне достанется
  rationale: Буквально «ко мне». В сочетании с «долей» глагол «достанется» естественно передаёт направленность просьбы и поддерживает наследственный оттенок выражения, не исключая смысла нисхождения или перехода пророческого дара.
theological_decisions:
- issue: Смысл просьбы о פִּי שְׁנַיִם בְּרוּחֲךָ
  choice: Елисей просит двойную долю духа Илии, с вероятным отзвуком наследственной доли первенца.
  alternative: Елисей просит вдвое больше пророческой силы, чем было у Илии.
  rationale: «Двойная доля» точнее сохраняет еврейскую идиому и её возможный наследственный смысл, не разрешая заложенную в выражении неоднозначность в пользу простого сравнения силы.
- issue: К чему относится выражение «твой дух»
  choice: Сохранено «твоего духа» как указание на дух или пророческое дарование, связанное с Илиёй.
  alternative: Понимать выражение как прямое техническое наименование Святого Духа.
  rationale: Притяжательный суффикс непосредственно связывает дух с Илиёй. Перевод не исключает Божьего источника пророческого дара, но и не вводит в текст более определённую тринитарную формулировку, которой в еврейском выражении нет.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Синтаксис остаётся близким к еврейскому, но не архаичным. Формула «я буду взят от тебя» намеренно сохраняет страдательность и не называет действующего лица; «мне достанется» делает просьбу естественной по-русски и поддерживает наследственный образ.
