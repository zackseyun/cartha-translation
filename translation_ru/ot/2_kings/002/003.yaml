  to: 'Тогда сыны пророков, бывшие в Вефиле, вышли к Елисею и сказали ему: «Знаешь ли ты, что сегодня Яхве заберёт твоего господина, стоящего над тобой?»[a] Он ответил: «Я тоже знаю. Молчите».'
  rationale: 'Исправлены три места: локативное определение пророческой группы передано без указания на постоянное проживание; «наставник» заменён на более точное «господин»; образ «сверху твоей головы» отражён через «стоящего над тобой» и точно раскрыт в сноске. Будущее «заберёт» допустимо для ожидаемого в этот день действия.'
