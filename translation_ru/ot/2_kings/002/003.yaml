  text: וַ/יֵּצְא֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בֵּֽית אֵל֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: ru
  text: 'Тогда сыны пророков, бывшие в Вефиле, вышли к Елисею и сказали ему: «Знаешь ли ты, что сегодня Яхве заберёт твоего господина, стоящего над тобой?»[a] Он ответил: «Я тоже знаю. Молчите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «забирает твоего господина сверху твоей головы». Это древнееврейский образ удаления того, кто занимает положение власти или старшинства над человеком.'
    reason: Поясняет буквальный пространственный образ и его идиоматическое значение, не сужая «господина» до роли наставника.
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: сыны пророков
  rationale: Сохраняет устойчивое древнееврейское обозначение членов пророческого сообщества, не уточняя без достаточных оснований, были ли они учениками или членами гильдии.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: жившие в Вефиле
  rationale: В данном контексте оборот определяет группу по месту её пребывания; такой перевод естественен по-русски.
- source_word: הֲיָדַעְתָּ
  choice: Знаешь ли ты
  rationale: Естественно передаёт вопросительную конструкцию с перфектом в контексте уже известного факта.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לֹקֵחַ
  choice: возьмёт
  rationale: Причастие описывает предстоящее в тот же день действие; русский глагол будущего времени естественно выражает эту непосредственную перспективу.
- source_word: אֲדֹנֶיךָ
  choice: твоего наставника
  rationale: В контексте речь об Илии как старшем пророке и учителе Елисея; «наставник» ясно передаёт человеческое отношение и не создаёт путаницы с обращением к Богу.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: который стоит над тобой
  rationale: Передаёт метафору положения над головой и её идиоматический смысл — власть и руководство, избегая неестественного русского выражения «сверху твоей головы».
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Я тоже знаю
  rationale: Явно сохраняет значение גַּם אֲנִי — «я также / я тоже».
- source_word: הֶחֱשׁוּ
  choice: Молчите
  rationale: Кратко и с должной силой передаёт повелительное обращение к группе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл מֵעַל רֹאשֶׁךָ
  choice: который стоит над тобой
  alternative: из положения над тобой / от твоей головы
  rationale: Оборот может одновременно сохранять пространственный образ и указывать на удаление наставника, обладающего властью. Основной текст передаёт отношение власти, а примечание фиксирует буквальную форму и смысл удаления.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Выражение «сыны пророков» намеренно сохранено как традиционный и значимый древнееврейский оборот; реплики сделаны краткими и напряжёнными.
