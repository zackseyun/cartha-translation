    issue: «Наставника» вместо אֲדֹנֶיךָ
    rationale: Еврейское слово означает «господин, владыка» в отношении к человеку. В контексте Илия действительно учитель Елисея, но этот вывод не следует подставлять вместо более широкого исходного обозначения.
  - severity: medium
    issue: Ослаблен образ מֵעַל רֹאשֶׁךָ
    rationale: Формулировка «который стоит над тобой» передаёт иерархию, но не вполне выражает, что Яхве забирает господина «сверху твоей головы». Следует сохранить образ в основном тексте настолько, насколько это естественно, и точно пояснить его в примечании.
  - severity: low
    issue: «Жившие в Вефиле»
    rationale: Конструкция אֲשֶׁר בֵּית־אֵל определяет группу по местонахождению; она не утверждает непременно постоянное проживание.
