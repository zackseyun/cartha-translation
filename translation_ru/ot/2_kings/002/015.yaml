base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: ru
  text: 'Сыны пророков, находившиеся в Иерихоне, увидели его издали[a] и сказали: «Дух Илии почил на Елисее».[b] Они пошли ему навстречу и поклонились ему до земли.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение может также означать: «с противоположной стороны» или «на расстоянии, напротив».'
    reason: lexical_alternative
  - marker: b
    text: В данном контексте «дух Илии» может обозначать пророческий дух или дарование, которое сыны пророков теперь признают в Елисее; сама формулировка текста сохраняет выражение «дух Илии».
    reason: cross_reference
  - marker: c
    text: 'Буквально: «простёрлись перед ним до земли». Это жест глубокого почтения и подчинения, не обязательно богопоклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: сыны пророков
  rationale: Сохраняет устойчивый древнееврейский социальный термин и библейскую образность; речь идёт о членах пророческого сообщества, а не обязательно о биологических сыновьях.
- source_word: מִנֶּגֶד
  choice: издали
  rationale: Естественно передаёт пространственный смысл наблюдения с противоположной стороны или на некотором расстоянии, не вводя в русский текст неуказанный объект сравнения.
- source_word: נָחָה רוּחַ אֵלִיָּהוּ עַל אֱלִישָׁע
  choice: Дух Илии почил на Елисее
  rationale: Форма перфекта указывает на наступившее и распознанное состояние; «почил на» точно и достойно передаёт נוח ... על, сохраняя формулировку о духе Илии без сведения её к личной душе.
- source_word: לִקְרָאתוֹ
  choice: вышли ему навстречу
  rationale: Ясно передаёт идиому движения навстречу человеку и естественно продолжает повествование.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: поклонились ему до земли
  rationale: Передаёт глубокий земной поклон как жест почтения и признания власти, не обозначая его непременно как богопоклонение.
theological_decisions:
- issue: Значение выражения «дух Илии»
  choice: Сохранить буквальное выражение, понимаемое в контексте как пророческий дух или дарование Илии, явленное теперь в Елисее.
  alternative: Истолковать как переселение личной души Илии в Елисея.
  rationale: Контекст 4 Цар 2:9, 15 говорит о пророческом преемстве и даровании; буквальная формулировка сохраняет напряжение текста, не утверждая переселения личности.
- issue: Характер поклона Елисею
  choice: Передать как глубокий поклон в знак почтения и признания его пророческого авторитета.
  alternative: Передать как религиозное поклонение Елисею.
  rationale: Глагол שׁחה может обозначать поклон и людям, и Богу; здесь контекст указывает на признание Елисея преемником Илии.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемых библейских выражений «сыны пророков», «дух Илии» и «почил на». Синтаксис упрощён для ясности, но образность и смысловые неоднозначности исходного текста сохранены.
