  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: ru
  text: Он поднял плащ Илии[a], упавший с него, вернулся и встал на берегу Иордана.
  philosophy: optimal-equivalence
  footnotes:
