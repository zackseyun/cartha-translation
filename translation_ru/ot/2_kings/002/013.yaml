lexical_decisions:
- source_word: וַיָּרֶם
  choice: поднял
  rationale: Глагол רום обозначает поднятие; в данном контексте естественное русское «поднял» ясно передаёт действие с упавшей одеждой.
- source_word: אַדֶּרֶת
  choice: плащ
  rationale: Слово обозначает характерную верхнюю одежду. «Плащ» — понятный современный эквивалент; традиционное «милоть» менее понятно современному читателю и указано в сноске.
- source_word: אֵלִיָּהוּ
  choice: Илии
  rationale: Использована закрепившаяся в русской библейской традиции форма имени Илия в родительном падеже.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: упавший с него
  rationale: Причастный оборот естественно передаёт относительное предложение и сохраняет прямой смысл מֵעָלָיו — «с него».
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: שׁוב в данном повествовательном контексте означает возвращение к Иордану.
- source_word: וַיַּעֲמֹד
  choice: остановился
  rationale: Форма עמד буквально связана со стоянием, но в последовательности движения русское «остановился» естественно выражает, что Елисей пришёл и встал у берега.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: на берегу Иордана
  rationale: שׂפה применительно к реке означает край или берег; «на берегу Иордана» — естественная современная русская формулировка.
