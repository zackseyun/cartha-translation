id: 2KI.2.1
reference: 2 Kings 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: ru
  text: Когда Яхве собирался вознести Илию в вихре[a] на небо[b], Илия и Елисей отправились из Галгала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в буре», «в бурном ветре» или «вихрем».'
    reason: Слово סְעָרָה и предлог ב допускают несколько близких по смыслу передач.
  - marker: b
    text: 'Буквально: «на небеса».'
    reason: Еврейское הַשָּׁמָיִם имеет форму множественного числа.
lexical_decisions:
- source_word: וַיְהִי
  choice: Когда
  rationale: Повествовательная форма וַיְהִי вводит новый эпизод и вместе со следующей временной конструкцией естественно передаётся по-русски придаточным с «когда», без архаичного «и было».
- source_word: בְּהַעֲלוֹת
  choice: собирался вознести
  rationale: Инфинитивная конструкция с ב задаёт временной фон; по контексту речь идёт о предстоящем событии. «Собирался вознести» сохраняет перспективный смысл и выраженное глаголом עלה движение вверх.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет употреблённое в еврейском тексте имя Бога, не заменяя его титулом.
- source_word: אֶת אֵלִיָּהוּ
  choice: Илию
  rationale: Имя собственного прямого дополнения передано в принятой русской библейской форме и нужном падеже.
- source_word: בַּסְעָרָה
  choice: в вихре
  rationale: סְעָרָה может означать бурю, вихрь или бурный ветер; «в вихре» естественно в данном контексте и сохраняет возможное пространственно-сопроводительное значение предлога ב.
- source_word: הַשָּׁמָיִם
  choice: на небо
  rationale: Формально слово имеет форму множественного числа, но в русском повествовании о восхождении естественно единственное число «небо»; предлог «на» выражает направленное движение вверх.
- source_word: וַיֵּלֶךְ
  choice: отправились
  rationale: Глагол הלך обозначает движение от указанного места; «отправились» естественно передаёт начало или продолжение пути, не добавляя способа передвижения.
- source_word: וֶאֱלִישָׁע
  choice: и Елисей
  rationale: Имя передано в принятой русской библейской форме.
- source_word: מִן הַגִּלְגָּל
  choice: из Галгала
  rationale: Предлог מן обозначает исходную точку движения; название места поставлено в родительном падеже после «из».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача הַשָּׁמָיִם как единственного или множественного числа
  choice: на небо
  alternative: на небеса
  rationale: Еврейская форма морфологически множественная, однако русское «на небо» здесь звучит естественно и не должно пониматься как решение вопроса о космологии.
- issue: Значение ב в בַּסְעָרָה
  choice: в вихре
  alternative: вихрем; посредством вихря
  rationale: Предлог допускает пространственно-сопроводительное и инструментальное понимание. Основной текст сохраняет более открытую формулировку «в вихре», не утверждая однозначно, что вихрь был орудием действия.
translation_notes:
  register: 'Современный литературный русский язык с привычными русскими формами библейских имён. Синтаксис упрощён ради естественности: повествовательное וַיְהִי включено во временную конструкцию, а не передано архаичным оборотом «и было». Формулировка сохраняет различие между неоднозначным образом вихря и направлением восхождения.'
