lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Обычная повествовательная форма wayyiqtol от אמר; в современном русском последовательность естественно передаётся без начального союза.
- source_word: קְחוּ לִי
  choice: Принесите мне
  rationale: Буквально לקח означает «взять», но сочетание с לִי в данном поручении по смыслу означает доставить предмет говорящему; «принесите мне» естественно передаёт контекст.
- source_word: צְלֹחִית חֲדָשָׁה
  choice: новую чашу
  rationale: צְלֹחִית обозначает небольшой сосуд без однозначного указания на его точную форму; «чаша» — ясное и уместное обозначение сосуда для соли. חֲדָשָׁה прямо передано как «новую».
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: и положите в неё соли
  rationale: שׂים означает «класть, помещать», а שָׁם буквально «там» отсылает к названному сосуду. Русское «в неё» ясно выражает этот смысл; родительный «соли» естественен при неопределённом количестве вещества.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: И они принесли её ему
  rationale: Хотя לקח буквально означает «взять», здесь действие состоит в доставке запрошенного сосуда Елисею. Местоимение «её» восстанавливает подразумеваемый объект и согласуется со словом «чаша».
