translation_notes:
  register: Современный литературный русский язык; речь краткая, ясная и достойная. Сохранена повествовательная последовательность и повелительный характер просьбы. Лексическая неопределённость формы сосуда не перегружена примечанием, поскольку «чаша» не вводит существенного богословского или сюжетного уточнения.
