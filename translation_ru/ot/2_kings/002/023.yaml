base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: ru
  text: 'Оттуда он поднялся в Вефиль. Когда он поднимался по дороге, из города вышли мальчики[a], стали насмехаться над ним и говорили ему: «Поднимайся, лысый! Поднимайся[b], лысый!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юноши», «молодые люди». Еврейское выражение может обозначать молодых лиц мужского пола в более широком возрастном диапазоне, а не только маленьких детей.'
    reason: lexical_alternative
  - marker: b
    text: Повторённое «Поднимайся» может быть просто издёвкой, но, возможно, содержит намёк на то, что Илия был взят на небо.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: он поднялся
  rationale: Форма глагола עלה продолжает повествование и буквально обозначает движение вверх; русский глагол «поднялся» сохраняет также связь с последующими повторами корня.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Употреблена традиционная русская библейская форма географического названия.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: Когда он поднимался по дороге
  rationale: Конструкция с причастием передаёт продолжающееся действие; «поднимался» сохраняет повтор глагола עלה и звучит естественно по-русски.
- source_word: נְעָרִים קְטַנִּים
  choice: мальчики
  rationale: Сочетание указывает на молодых лиц мужского пола, однако נער может охватывать более широкий возрастной диапазон. Естественное основное соответствие сопровождается примечанием о возможных вариантах.
- source_word: יָצְאוּ מִן הָעִיר
  choice: из города вышли
  rationale: Точно и естественно передаёт выход из города, не добавляя сведений о направлении дальнейшего движения.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: стали насмехаться над ним
  rationale: Глагол выражает насмешку и издевательство; конструкция «стали насмехаться» естественно вводит последовавшие выкрики.
- source_word: עֲלֵה
  choice: Поднимайся
  rationale: Императив от עלה передан тем же русским корнем, что и предшествующее описание движения Елисея. Это сохраняет словесный повтор и возможный намёк, не закрепляя конкретного толкования.
- source_word: קֵרֵחַ
  choice: лысый
  rationale: Субстантивированное прилагательное употреблено как оскорбительное обращение; русское «лысый» кратко и естественно передаёт насмешливую реплику.
theological_decisions:
- issue: Возможный намёк в повторённом повелении עֲלֵה
  choice: Сохранить буквальное «Поднимайся» и не объяснять намёк в основном тексте
  alternative: Передать как «Убирайся отсюда» либо развернуть как «Поднимись, как Илия»
  rationale: Сам еврейский текст говорит «поднимайся», но точный смысл издёвки остаётся спорным. Буквальная передача сохраняет как непосредственную насмешку, так и возможную отсылку к вознесению Илии.
- issue: Возраст и подразумеваемая ответственность נְעָרִים קְטַנִּים
  choice: Перевести в основном тексте как «мальчики», указав в примечании более широкий диапазон значения
  alternative: «юноши», «молодые люди», «малые отроки»
  rationale: Сочетание обозначает молодых лиц мужского пола, но не позволяет уверенно определить их точный возраст. Примечание предотвращает чрезмерно узкое прочтение и не решает вопрос об их ответственности средствами перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «поднялся — поднимался — поднимайся» намеренно сохраняет ключевую игру корня עלה. Реплика передана резко и кратко, как в источнике; возраст говорящих не конкретизирован сверх возможностей еврейского выражения.
