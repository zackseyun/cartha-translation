source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֵלִיָּ֨הוּ אֶת אַדַּרְתּ֤/וֹ וַ/יִּגְלֹם֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֵּחָצ֖וּ הֵ֣נָּה וָ/הֵ֑נָּה וַ/יַּעַבְר֥וּ שְׁנֵי/הֶ֖ם בֶּ/חָרָבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: ru
  text: Тогда Илия взял свой плащ[a], скрутил его и ударил по воде. Воды разделились по обе стороны[b], и они оба перешли по суше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мантию». Еврейское слово обозначает верхнюю одежду Илии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «разделились сюда и сюда», то есть в противоположные стороны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: свой плащ
  rationale: אַדֶּרֶת обозначает верхнюю одежду, в данном случае характерный плащ Илии. «Плащ» понятно современному читателю и естественно сочетается с последующим действием.
- source_word: וַיִּגְלֹם
  choice: скрутил его
  rationale: Глагол описывает сворачивание или скручивание одежды так, чтобы ею можно было ударить; «скрутил» ясно передаёт физическое действие.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: ударил по воде
  rationale: נכה имеет обычное значение «ударить». Русская конструкция «ударить по воде» естественна и не добавляет толкования.
- source_word: וַיֵּחָצוּ
  choice: воды разделились
  rationale: Сохранены множественное число еврейского глагола и результативное описание события. Формулировка прямо передаёт чудесное разделение воды.
- source_word: הֵנָּה וָהֵנָּה
  choice: по обе стороны
  rationale: Идиома указывает на расхождение вод в противоположные стороны; буквальное «сюда и сюда» по-русски неясно и неестественно.
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: они оба перешли
  rationale: «Оба» сохраняет явное указание שְׁנֵיהֶם на двух участников и звучит естественно по-русски.
- source_word: בֶּחָרָבָה
  choice: по суше
  rationale: חָרָבָה обозначает сухую землю, открывшуюся среди воды. «По суше» — краткая и традиционно понятная формулировка для перехода.
- source_word: וַיִּקַּח
  choice: Тогда Илия взял
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно обозначает следующий шаг рассказа.
theological_decisions:
- issue: Чудесное разделение воды
  choice: 'Событие передано прямо: после удара воды разделились, и Илия с Елисеем перешли по суше.'
  alternative: Передать более образно как «вода расступилась» или попытаться объяснить событие естественными причинами.
  rationale: Еврейский текст недвусмысленно повествует о разделении вод и переходе по сухому месту. Перевод не ослабляет чудесный характер события и не дополняет его богословским объяснением.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным ритмом. Сохранены достоинство библейского рассказа, явное указание на обоих участников и необычное множественное «воды», отражающее форму еврейского текста.
