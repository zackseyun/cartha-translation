  terminology: «Проклял их именем ГОСПОДА» адекватно передаёт בְּשֵׁם יְהוָה и соответствует традиционному русскому библейскому обозначению тетраграмматона. «Медведицы» верно отражает женский род еврейского слова. «Растерзали» удачно передаёт тяжёлый характер פקע, не утверждая прямо смерть пострадавших.
