  source_fidelity: 'В целом перевод точно передаёт последовательность действий, проклятие «именем ГОСПОДА», двух медведиц и число пострадавших. Однако יְלָדִים в данном контексте лучше передать словом «мальчики», а не «дети»: последнее в современном русском сильнее предполагает малолетний возраст. Частица מֵהֶם требует сохранения партитивного смысла «из них».'
