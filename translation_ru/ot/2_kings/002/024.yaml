base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: ru
  text: Он обернулся, увидел их и проклял их именем ГОСПОДА. Тогда из леса вышли две медведицы и растерзали сорок двух из этих мальчиков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: проклял их
  rationale: Прямо передаёт значение глагола קלל в данном контексте, не смягчая совершённого пророком действия.
- source_word: בְּשֵׁם יְהוָה
  choice: именем ГОСПОДА
  rationale: Предлог ב передан естественным русским оборотом «именем», а тетраграмматон — традиционным издательским обозначением «ГОСПОДЬ» прописными буквами.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: две медведицы
  rationale: Числительное женского рода показывает, что речь идёт о двух самках медведя.
- source_word: וַתְּבַקַּעְנָה
  choice: растерзали
  rationale: Буквальный образ глагола בקע — «разрывать, рассекать»; «растерзали» естественно описывает нападение зверей и сохраняет тяжесть события, не утверждая, что все пострадавшие погибли.
- source_word: אַרְבָּעִים וּשְׁנֵי יְלָדִים
  choice: сорок двух из этих детей
  rationale: יְלָדִים может обозначать детей или юных людей; «детей» сохраняет обычное значение слова. «Из этих» передаёт מֵהֶם и указывает, что пострадали сорок два человека из названной ранее группы.
theological_decisions:
- issue: Характер проклятия Елисея
  choice: «проклял их именем ГОСПОДА»
  alternative: «призвал на них проклятие во имя ГОСПОДА»
  rationale: Выбрана более прямая передача еврейского текста без добавочного объяснения механизма или содержания проклятия.
- issue: Исход нападения медведиц
  choice: «растерзали» без утверждения о смерти
  alternative: «убили»
  rationale: Текст сообщает тяжёлое телесное поражение через глагол «разрывать», но прямо не говорит, что все сорок два умерли; богословски значимая неопределённость сохранена.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и суровое, в соответствии с еврейским оригиналом. Синтаксис сделан естественным для русского без устранения напряжённости эпизода.
