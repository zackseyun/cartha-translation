base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: ru
  text: И когда они шли дальше и разговаривали, вот, огненная колесница и огненные кони разлучили их[a], и Илия поднялся в вихре[b] на небо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В тексте сказано, что огненная колесница и огненные кони разлучили Илию и Елисея, а Илия поднялся в вихре; прямо не говорится, что он ехал в колеснице.
    reason: alternative_reading
  - marker: b
    text: 'Или: «посредством вихря» или «с вихрем». Еврейский предлог может обозначать местонахождение, сопровождение или средство действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  choice: И когда они шли дальше и разговаривали
  rationale: Конструкция описывает продолжающиеся одновременные действия и вводит следующий момент повествования. Русское «когда» естественно передаёт временную связь, а «шли дальше» отражает длительный характер הֹלְכִים הָלוֹךְ без архаичного оборота.
- source_word: וְהִנֵּה
  choice: вот
  rationale: «Вот» сохраняет присущую הִנֵּה функцию привлечения внимания и драматическую непосредственность, не добавляя прямо не выраженного значения «внезапно».
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: огненная колесница и огненные кони
  rationale: Так естественно и образно передаются обе параллельные конструкции со словом «огонь»; повторение определения сохраняет симметрию еврейского текста.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: разделили их обоих
  rationale: Множественное число глагола согласуется с колесницей и конями как совокупным подлежащим. «Их обоих» явно передаёт שְׁנֵיהֶם и сохраняет указание на Илию и Елисея.
- source_word: וַיַּעַל אֵלִיָּהוּ
  choice: Илия поднялся
  rationale: «Поднялся» прямо передаёт עלה и избегает более богословски нагруженного «вознёсся», которого сам еврейский глагол здесь не требует.
- source_word: בַּסְעָרָה
  choice: в вихре
  rationale: «В вихре» — естественная русская передача, сохраняющая возможность понимать ב как местонахождение или сопровождение; возможное значение средства указано в сноске.
- source_word: הַשָּׁמָיִם
  choice: на небо
  rationale: При глаголе направленного движения это обычная русская передача; она соответствует контексту и не сводит смысл лишь к видимому небу как атмосферному пространству.
theological_decisions:
- issue: Была ли огненная колесница средством, на котором Илия поднялся
  choice: Основной текст говорит, что колесница и кони разделили Илию и Елисея, а подъём Илии связывает с вихрем.
  alternative: Илия поднялся на огненной колеснице.
  rationale: 'Еврейский текст не утверждает прямо, что Илия ехал в колеснице: колесница и кони выполняют выраженную функцию разделения двух людей, тогда как בַּסְעָרָה непосредственно относится к его подъёму. Перевод не вводит распространённую, но не высказанную в стихе деталь.'
- issue: Значение предлога ב в בַּסְעָרָה
  choice: в вихре
  alternative: посредством вихря / с вихрем
  rationale: Предлог допускает локативное, сопроводительное или инструментальное понимание. Основной текст сохраняет образ, а сноска открыто отмечает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным звучанием. «Вот» сохраняет библейскую драматичность без устарелого «се»; «поднялся» точнее и нейтральнее конфессионально закреплённого «вознёсся».
