  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: ru
  text: 'Он взял плащ Илии, который упал с Илии, ударил плащом по воде и сказал: «Где Яхве, Бог Илии, — Он Сам[a]?» Затем он ударил по воде, и она расступилась в обе стороны, и Елисей перешёл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейское выражение, переданное словами «Он Сам», предельно кратко и неоднозначно. Его также понимают как продолжение вопроса: «Где Яхве, Бог Илии?», как «Он также» или связывают с последующим действием. Вероятно, оно подчёркивает, что Бог, действовавший через Илию, по-прежнему присутствует и действует.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: плащ
  rationale: Обозначает характерную верхнюю одежду Илии; «плащ» конкретно, естественно и понятно современному русскому читателю.
- source_word: נָפְלָה מֵעָלָיו
  choice: упавший с него
  rationale: Причастный оборот естественно передаёт предшествующее действие относительного придаточного и сохраняет связь одежды с вознесённым Илиёй.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: ударил им по воде
  rationale: Глагол נכה означает удар; добавленное «им» однозначно указывает на плащ как орудие действия и естественно по-русски воспроизводит контекст.
- source_word: אַיֵּה
  choice: Где
  rationale: Сохраняет прямой вопрос о местонахождении или присутствии без истолковывающей перифразы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: Бог Илии
  rationale: Прямо и естественно передаёт древнееврейскую сопряжённую конструкцию.
- source_word: אַף הוּא
  choice: И он сам
  rationale: Сохраняет выраженное местоимение и усилительную частицу в их масоретском положении после вопроса, не вкладывая их внутрь реплики; референт остаётся допускающим пояснение.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: она расступилась в обе стороны
  rationale: Русское единственное число согласовано со словом «вода»; выражение ясно передаёт разделение воды по двум направлениям.
- source_word: וַיַּעֲבֹר
  choice: перешёл реку
  rationale: В контексте перехода через Иордан объект естественно восполняется словом «реку», не меняя смысла глагола עבר.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Синтаксис и смысл אַף הוּא
  choice: 'Отнести выражение к последующему действию: «И он сам ударил…», с примечанием'
  alternative: 'Включить в вопрос: «Где Яхве, Бог Илии, — Он Сам?»; понимать как «Он также»; не передавать ввиду эллиптичности'
  rationale: Масоретская акцентуация допускает связь выражения с последующим повествованием, тогда как сама краткая фраза трудна и толкуется по-разному. Основной текст остаётся читаемым, а примечание сохраняет реальную неоднозначность и возможный акцент на продолжающемся присутствии Бога Илии.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повествование сделано плавным, но трудное אַף הוּא не устранено: его неоднозначность отмечена сноской. Маркер [a] помещён непосредственно после соответствующей фразы.'
