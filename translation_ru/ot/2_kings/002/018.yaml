  text: וַ/יָּשֻׁ֣בוּ אֵלָ֔י/ו וְ/ה֖וּא יֹשֵׁ֣ב בִּ/ירִיח֑וֹ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם הֲ/לֽוֹא אָמַ֥רְתִּי אֲלֵי/כֶ֖ם אַל תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: ru
  text: 'Когда они вернулись к нему, он оставался в Иерихоне. Он сказал им: «Разве я не говорил вам: „Не ходите“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: Когда они вернулись к нему
  rationale: Возвратная повествовательная форма продвигает рассказ, а конструкция с «когда» естественно передаёт временную связь со следующим обстоятельственным сообщением.
- source_word: וְהוּא יֹשֵׁב בִּירִיחוֹ
  choice: он оставался в Иерихоне
  rationale: Причастие от ישב может обозначать сидение, пребывание или проживание; здесь контекст подчёркивает, что Елисей всё это время оставался в Иерихоне.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Он сказал им
  rationale: Прямое и естественное соответствие обычной формуле речи.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: Разве я не говорил вам
  rationale: הֲלוֹא вводит риторический вопрос, предполагающий утвердительный ответ и передающий мягкий укор.
- source_word: אַל תֵּלֵכוּ
  choice: Не ходите
  rationale: אַל с имперфектом выражает запрет. Русское «не ходите» естественно и сохраняет связь с предпринятыми ими поисками.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткое, повествовательно ясное изложение. «Оставался» выбрано вместо буквального «сидел», поскольку в контексте речь идёт о пребывании Елисея в Иерихоне во время поисков.
