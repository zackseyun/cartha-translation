base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: ru
  text: 'Тогда он вышел к источнику воды[a], бросил туда соль и сказал: «Так говорит Яхве: „Я исцелил эту воду. От этой воды больше не будет ни смерти, ни выкидышей[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к роднику».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни бесплодия». Еврейское слово может обозначать потерю потомства или отсутствие плодовитости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: источник воды
  rationale: Существительное מוֹצָא обозначает место, откуда выходит вода; «источник воды» естественно передаёт смысл, не сужая его непременно до родника.
- source_word: מֶלַח
  choice: соль
  rationale: Прямой и контекстуально точный эквивалент.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена обычная формула пророческой речи, а личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: Я исцелил эту воду
  rationale: Глагол רפא буквально означает «исцелять»; образное применение к воде сохранено, а собирательное «вода» естественно для русского языка.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: От неё больше не будет
  rationale: Формулировка передаёт исходящий от воды вред и сохраняет направленность выражения מִשָּׁם — «оттуда, из неё».
- source_word: מָוֶת
  choice: смерть
  rationale: Прямой эквивалент без неоправданного уточнения причины смерти.
- source_word: מְשַׁכָּלֶת
  choice: выкидыши
  rationale: Слово от корня שׁכל указывает на утрату потомства или плода; в данном контексте «выкидыши» ясно передаёт конкретный вред, а более широкая возможность значения отмечена в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено личное имя Бога, поэтому оно сохранено в распространённой научной транслитерации, а не заменено титулом.
- issue: Характер исцеления воды
  choice: исцелил эту воду
  alternative: сделал эту воду пригодной; очистил эту воду
  rationale: Буквальный образ «исцеления» сохраняет формулировку исходного текста и не сводит действие только к очищению или улучшению питьевых качеств.
- issue: Значение מְשַׁכָּלֶת
  choice: выкидыши
  alternative: бесплодие; утрата потомства
  rationale: Контекст связывает плохую воду с потерей плода или потомства, однако диапазон еврейского слова шире одного медицинского явления; неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык; пророческая формула передана торжественно, но понятно. Синтаксис остаётся близким к еврейскому тексту, без архаизмов и конфессионально окрашенных добавлений.
