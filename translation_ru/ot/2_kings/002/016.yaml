source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: ru
  text: 'Тогда они сказали ему: «Вот, среди твоих слуг есть пятьдесят способных мужчин. Позволь им пойти и поискать твоего господина. Может быть, Дух Яхве[a] унёс его и бросил на одну из гор или в одну из долин». Но он сказал: «Не посылайте их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер Яхве унёс его». Еврейское слово, переведённое как «Дух», может также означать «ветер».'
    reason: Сохранена лексическая неоднозначность слова רוּחַ.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Вот
  rationale: Вводит предложение и привлекает внимание; оттенок вежливой просьбы далее передан конструкцией «Позволь им».
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: среди твоих слуг есть
  rationale: Естественно передаёт еврейскую конструкцию наличия, обозначающую людей, находящихся среди слуг Елисея.
- source_word: חֲמִשִּׁים אֲנָשִׁים בְּנֵי חַיִל
  choice: пятьдесят способных мужчин
  rationale: בְּנֵי חַיִל здесь обозначает крепких, деятельных и пригодных для поисков людей, не обязательно воинов.
- source_word: יֵלְכוּ נָא
  choice: Позволь им пойти
  rationale: Юссив с נָא выражает вежливую просьбу, обращённую к Елисею; по-русски естественно передаётся просьбой о разрешении.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: и поискать твоего господина
  rationale: בקשׁ означает искать, а אֲדֹנֶיךָ обозначает Илию как господина Елисея.
- source_word: פֶּן
  choice: Может быть
  rationale: В данном контексте частица вводит предположительное объяснение исчезновения Илии, а не предупреждение о нежелательном исходе.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: Дух Яхве унёс его
  rationale: Контекст необычайного перемещения пророка допускает действие Божьего Духа; возможность значения «ветер» сохранена в сноске.
- source_word: וַיַּשְׁלִכֵהוּ
  choice: и бросил
  rationale: Передаёт конкретное значение глагола «бросить, повергнуть» без архаизации.
- source_word: בְּאַחַד הֶהָרִים ... בְּאַחַת הַגֵּאָיוֹת
  choice: на одну из гор или в одну из долин
  rationale: Русские предлоги естественно выражают предполагаемое направление перемещения; גיא доступно передано словом «долина».
- source_word: לֹא תִשְׁלָחוּן
  choice: Не посылайте их
  rationale: Краткий запрет сохранён; местоимение «их» естественно уточняет подразумеваемую поисковую группу.
theological_decisions:
- issue: Значение רוּחַ יְהוָה
  choice: Дух Яхве
  alternative: ветер Яхве
  rationale: Повествование предполагает личное божественное действие, однако многозначность רוּחַ не позволяет исключить значение «ветер», поэтому оно указано в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинным повествовательным регистром. Избегаются как архаизмы, так и разговорность; синтаксис просьбы сделан естественным для русского языка.
