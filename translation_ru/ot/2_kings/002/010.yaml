  text: וַ/יֹּ֖אמֶר הִקְשִׁ֣יתָ לִ/שְׁא֑וֹל אִם תִּרְאֶ֨ה אֹתִ֜/י לֻקָּ֤ח מֵֽ/אִתָּ/ךְ֙ יְהִֽי לְ/ךָ֣ כֵ֔ן וְ/אִם אַ֖יִן לֹ֥א יִהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: ru
  text: 'Он сказал: «Ты попросил о трудном. Если увидишь, как меня заберут от тебя[a], то получишь просимое; а если не увидишь, не получишь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если увидишь меня, когда меня будут забирать от тебя».'
    reason: Возможен временной оттенок конструкции с пассивной формой לֻקָּח; основной текст естественно передаёт наблюдение самого события.
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: Ты просишь о трудном
  rationale: Сочетание каузативной формы от קשׁה с инфинитивом שׁאל идиоматически характеризует просьбу как трудную для исполнения. Эта формулировка естественна по-русски и не превращает трудность просьбы в упрёк.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: Если увидишь, как меня заберут от тебя
  rationale: Пассивная форма לֻקָּח описывает взятие Илии, а условие связано с тем, увидит ли это Елисей. Оборот «как меня заберут» передаёт наблюдаемое действие, не называя действующее лицо.
- source_word: יְהִי לְךָ כֵן
  choice: то получишь просимое
  rationale: Буквальное «пусть будет тебе так» в контексте означает, что просьба Елисея исполнится. Контекстуальное дополнение «просимое» делает смысл ясным современному читателю.
- source_word: וְאִם אַיִן לֹא יִהְיֶה
  choice: а если не увидишь, не получишь
  rationale: אַיִן эллиптически отрицает предыдущее условие, а לֹא יִהְיֶה — исполнение просьбы. В русском повтор подразумеваемых глаголов устраняет неясность, сохраняя условное противопоставление.
theological_decisions:
- issue: Кто забирает Илию
  choice: 'Действующее лицо не названо: «меня заберут»'
  alternative: «Господь заберёт меня»
  rationale: В еврейском тексте употреблена пассивная форма без прямого обозначения действующего лица; перевод не добавляет его, хотя контекст допускает понимание Божьего действия.
translation_notes:
  register: Современный литературный русский язык с ясной, достойной речью. Эллиптические еврейские выражения раскрыты по контексту, однако пассивность и неназванный исполнитель действия сохранены.
