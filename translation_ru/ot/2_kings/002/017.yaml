base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: ru
  text: 'Но они настойчиво уговаривали его, пока ему не стало стыдно[a], и он сказал: «Пошлите их». Тогда они послали пятьдесят человек; те искали три дня, но не нашли его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока ему не стало стыдно». Это может указывать на смущение или неловкость, вызванные их настойчивыми уговорами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: они упрашивали его
  rationale: Глагол פצר выражает настойчивые, неоднократные уговоры или давление. «Упрашивали» естественно передаёт продолжительность и настойчивость действия.
- source_word: עַד בֹּשׁ
  choice: до тех пор, пока ему не стало неловко
  rationale: בוש обозначает стыд или смущение; в данном контексте речь, вероятно, о неловкости, вызванной настойчивым социальным давлением. Перевод сохраняет этот оттенок, а более буквальное значение отмечено в сноске.
- source_word: שְׁלָחוּ
  choice: Пошлите
  rationale: Форма представляет собой повеление во втором лице множественного числа. Объект понятен из контекста, поэтому по-русски его можно не повторять.
- source_word: חֲמִשִּׁים אִישׁ
  choice: пятьдесят человек
  rationale: Перевод следует непосредственному тексту стиха и не добавляет из контекста уточнение о принадлежности этих людей к пророческому сообществу.
- source_word: וַיְבַקְשׁוּ
  choice: искали
  rationale: בקש здесь означает поиски человека. Русское «искали» кратко и естественно передаёт повествовательное действие.
- source_word: שְׁלֹשָׁה יָמִים
  choice: три дня
  rationale: В русском языке длительность действия естественно выражается винительным падежом без предлога.
- source_word: וְלֹא מְצָאֻהוּ
  choice: но не нашли его
  rationale: 'Союз ו в данном контексте имеет естественный противительный оттенок: поиски продолжались три дня, однако оказались безуспешными.'
