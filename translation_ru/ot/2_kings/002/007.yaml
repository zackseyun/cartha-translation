  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: ru
  text: И пятьдесят человек из сынов пророков пошли и встали поодаль напротив них, а те двое стояли у Иордана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны пророков» — устойчивое обозначение сообщества людей, связанных с пророческим служением.
    reason: cultural_note
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: И пятьдесят человек
  rationale: Числительное с אִישׁ обозначает пятьдесят мужчин; в русском сочетание «пятьдесят человек» естественно и в данном контексте не устраняет указание на мужскую группу.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: из сынов пророков
  rationale: Сохранено буквальное и принятое в библейском повествовании обозначение сообщества людей, связанных с пророческим служением; толковательная замена на «учеников» была бы уже́ исходного выражения.
- source_word: הָלְכוּ וַיַּעַמְדוּ
  choice: пошли и встали
  rationale: Простые повествовательные глаголы точно передают последовательность действий без добавочного оттенка торжественности или намеренного построения.
- source_word: מִנֶּגֶד מֵרָחוֹק
  choice: поодаль напротив них
  rationale: «Напротив» передаёт пространственное отношение, а «поодаль» — удалённость; порядок сделан естественным для современного русского языка.
- source_word: וּשְׁנֵיהֶם
  choice: а те двое
  rationale: Форма прямо указывает на двух ранее названных участников — Илию и Елисея; союз «а» естественно выражает сопоставление с группой наблюдателей.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: стояли у Иордана
  rationale: В сочетании с рекой עַל здесь естественно означает положение у берега, а не буквально «на» реке.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного библейского выражения «сыны пророков». «Поодаль» кратко и естественно передаёт מֵרָחוֹק; синтаксис остаётся ясным для широкого читателя.
