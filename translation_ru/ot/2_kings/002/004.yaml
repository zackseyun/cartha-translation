revisions:
- from: 'И сказал ему Илия: «Елисей, останься, прошу, здесь, потому что Яхве послал меня в Иерихон». Но тот сказал: «Жив Яхве и жива душа твоя — не оставлю тебя!» И пришли они в Иерихон.'
  to: 'Илия сказал ему: «Елисей, останься здесь, прошу, потому что Яхве послал меня в Иерихон». А он сказал: «Жив Яхве, и жив ты — не оставлю тебя!» И они пришли в Иерихон.'
  rationale: 'Исправлена русская передача второй части клятвенной формулы: «жив ты» естественно выражает её смысл («как ты жив») и сохраняет параллелизм с «Жив Яхве». Убрано не обусловленное исходным текстом «тот»; прочие решения сохранены.'
