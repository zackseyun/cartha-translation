  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: ru
  text: 'Илия сказал ему: «Елисей, останься здесь, прошу, потому что Яхве послал меня в Иерихон». А он сказал: «Жив Яхве, и жив ты — не оставлю тебя!» И они пришли в Иерихон.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: останься, прошу
  rationale: Императив שֵׁב от ישׁב в данном контексте означает не просто «сиди», а «останься, не иди дальше»; частица נָא придаёт просьбе вежливый, увещательный оттенок.
- source_word: פֹה
  choice: здесь
  rationale: Прямое и естественное соответствие локативному наречию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, представленное тетраграмматоном, а не заменяется титулом.
- source_word: שְׁלָחַנִי
  choice: послал меня
  rationale: Перфект обозначает уже данное поручение, которое определяет нынешнее действие Илии; в русском естественно простое прошедшее время.
- source_word: יְרִיחוֹ
  choice: Иерихон
  rationale: Устоявшаяся русская форма географического названия.
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Сохранена традиционная и понятная по-русски формула торжественной клятвы, буквально отражающая еврейское выражение.
- source_word: וְחֵי נַפְשְׁךָ
  choice: и жива душа твоя
  rationale: Сохранены параллелизм клятвенной формулы и лексема נֶפֶשׁ. Здесь «душа» означает живую личность и жизнь адресата, а не специально нематериальную часть человека.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: не оставлю тебя
  rationale: В клятвенной конструкции אִם вводит подразумеваемое проклятие и по смыслу выражает решительное отрицание; в русском отрицание необходимо сделать явным.
- source_word: וַיָּבֹאוּ
  choice: И пришли они
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; сохранён простой библейский, но понятный современному читателю синтаксис.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога. Форма «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
- issue: Значение נֶפֶשׁ в клятвенной формуле
  choice: душа твоя
  alternative: ты сам; жизнь твоя
  rationale: 'Буквальная форма сохраняет образность и параллелизм оригинала, но не должна пониматься как утверждение о составе человека: в данном обороте речь идёт о жизни и личности Илии.'
translation_notes:
  register: 'Современный литературный русский с умеренно библейской торжественностью. Порядок слов «И пришли они» слегка возвышен, но естественен для повествования. Имена переданы в устоявшихся русских формах: Илия, Елисей, Иерихон.'
