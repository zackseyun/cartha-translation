  terminology: «Яхве», «Елисей», «господин» и «сыны пророков» передают соответственно имя Бога, имя лица и ключевые социальные обозначения без конфессионального истолкования. Сноска должна отличать буквальный образ от осторожного смыслового разъяснения.
