  source_fidelity: 'Фраза «с места над твоей головой» не соответствует непосредственно древнееврейскому מֵעַל רֹאשֶׁךָ: слово «место» в источнике отсутствует и меняет образ. Следует сохранить образ «над твоей головой» без этого добавления. «Жившие в Иерихоне» несколько сильнее, чем указание источника на группу, находившуюся в Иерихоне; «находившиеся в Иерихоне» точнее.'
