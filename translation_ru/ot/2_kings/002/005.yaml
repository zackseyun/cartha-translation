source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: ru
  text: 'Тогда сыны пророков, находившиеся в Иерихоне, подошли к Елисею и сказали ему: «Знаешь ли ты, что сегодня Яхве забирает твоего господина, который над твоей головой?[a]» Он ответил: «И я знаю. Молчите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отнимает у тебя того, кто над тобой». Буквально: «забирает твоего господина, который над твоей головой»; вероятно, это образ удаления человека, имевшего над Елисеем власть.'
    reason: Лексическая альтернатива и пояснение древнееврейского образного выражения.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: подошли
  rationale: Глагол נגשׁ обозначает приближение; «подошли» естественно передаёт направленное движение к Елисею.
- source_word: בְנֵי הַנְּבִיאִים
  choice: сыны пророков
  rationale: Сохранён прозрачный древнееврейский оборот, вероятно обозначающий учеников или членов пророческого сообщества; вариант не сужает его значение.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: жившие в Иерихоне
  rationale: Относительная конструкция указывает на группу, находившуюся в Иерихоне; «жившие» звучит естественно по-русски и не предполагает движения из города.
- source_word: אֱלִישָׁע
  choice: Елисей
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: הֲיָדַעְתָּ
  choice: Знаешь ли ты
  rationale: Вопрос касается нынешней осведомлённости Елисея; настоящее время точно и естественно передаёт значение формы в контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לֹקֵחַ
  choice: забирает
  rationale: Причастие передаёт предстоящее как непосредственное и уже решённое событие; русское настоящее время сохраняет эту живость.
- source_word: אֲדֹנֶיךָ
  choice: твоего господина
  rationale: В человеческих отношениях אֲדֹנִים обозначает того, кому подчиняются; «господин» сохраняет вертикаль отношений Елисея и Илии без богословского переосмысления.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: с места над твоей головой
  rationale: Сохранён конкретный пространственный образ еврейского текста и одновременно создана грамматически связная русская фраза; возможный смысл удаления наставника или начальствующего пояснён в сноске.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: И я знаю
  rationale: «И» передаёт добавочную частицу גַּם, а явное «я» сохраняет эмфатическое местоимение.
- source_word: הֶחֱשׁוּ
  choice: Молчите
  rationale: Краткое повеление во множественном числе обращено ко всей группе и передаёт резкость еврейской реплики.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Толкование выражения מֵעַל רֹאשֶׁךָ
  choice: сохранить в основном тексте образ места над головой
  alternative: «отнимает у тебя того, кто поставлен над тобой»; «забирает твоего наставника»
  rationale: Оборот, вероятно, указывает на удаление человека, имеющего власть над Елисеем, но буквальный образ допускает смысловую напряжённость, которую не следует безоговорочно устранять.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Оборот «сыны пророков» намеренно сохранён как понятное традиционное обозначение группы, тогда как синтаксис реплик и повествования сделан современным и прямым.
