  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: ru
  text: Так вода стала здоровой[a] и остаётся такой по сей день, по слову, которое произнёс Елисей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стала пригодной для употребления», «была восстановлена». В еврейском тексте употреблён обычный глагол со значением «исцелять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: исцелилась
  rationale: Форма от רפא, обычного глагола со значением «исцелять». Выбор сохраняет образность еврейского текста; женский род и единственное число согласованы с естественным русским обозначением воды как вещества.
- source_word: הַמַּיִם
  choice: вода
  rationale: Хотя еврейское מַיִם имеет форму множественного числа, в современном русском при обозначении источника или запаса воды естественно употребить собирательное единственное число «вода».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и остаётся такой по сей день
  rationale: Оборот указывает, что достигнутое состояние продолжалось до времени повествователя. Русская формулировка ясно передаёт эту длительность, не создавая впечатления, будто исцеление было растянутым процессом.
- source_word: כִּדְבַר
  choice: по слову
  rationale: Сохраняет конкретную связь между пророческим словом Елисея в предыдущем стихе и его исполнением.
- source_word: אֱלִישָׁע
  choice: Елисей
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: אֲשֶׁר דִּבֵּר
  choice: которое произнёс Елисей
  rationale: Естественно по-русски определяет сказанное пророком слово и сохраняет прямую отсылку к его речи.
theological_decisions:
- issue: Образ исцеления применительно к воде
  choice: 'Сохранить в основном тексте метафору: «вода исцелилась».'
  alternative: «вода стала пригодной» или «вода стала чистой»
  rationale: Еврейский текст употребляет обычный глагол «исцелять». Сохранение образа передаёт связь пророческого слова с восстановлением воды, не добавляя толкования о точном характере изменения.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной, но понятной библейской образности. Единственное число «вода» выбрано как естественное для русского языка; выражение «остаётся такой» раскрывает подразумеваемую продолжительность состояния в обороте «по сей день».
