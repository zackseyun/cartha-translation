base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: ru
  text: 'Илия сказал Елисею: «Останься, пожалуйста, здесь, потому что Яхве послал меня до Вефиля[a]». Но Елисей ответил: «Жив Яхве, и жив ты[b]: я не оставлю тебя». И они спустились в Вефиль.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «послал меня до Вефиля»; по смыслу также возможно: «послал меня в Вефиль».'
    reason: lexical_alternative
  - marker: b
    text: 'Древнееврейская формула клятвы буквально звучит: «Жив Яхве, и жива твоя жизнь: если я оставлю тебя…» — то есть: «Я не оставлю тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: Останься, пожалуйста, здесь
  rationale: ישׁב в данном контексте означает не просто «сесть», а остаться на месте; נָא передаёт вежливую просьбу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя имя титулом.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: послал меня до Вефиля
  rationale: עַד обозначает предел движения — «до, вплоть до»; русское «до Вефиля» естественно сохраняет этот оттенок.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Жив Яхве, и жив ты
  rationale: Сохранена торжественная древнееврейская формула клятвы; נֶפֶשׁ здесь обозначает самого человека, поэтому буквальное «жива твоя душа» могло бы привнести неуместный антропологический оттенок.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: я не оставлю тебя
  rationale: 'После клятвенной формулы אִם вводит эллиптическое самообязательство: буквально «если я оставлю тебя…», по смыслу — решительное отрицание.'
- source_word: וַיֵּרְדוּ בֵּית אֵל
  choice: они пошли в Вефиль
  rationale: ירד буквально указывает на движение вниз, однако в современном русском «спустились в Вефиль» может неоправданно акцентировать рельеф; нейтральное «пошли» естественно передаёт развитие пути.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Эллиптическая клятва אִם אֶעֶזְבֶךָּ
  choice: я не оставлю тебя
  alternative: если я оставлю тебя
  rationale: Буквальная незавершённая условная конструкция в древнееврейской клятве выражает отрицательное обязательство. В основном тексте смысл раскрыт, а исходная форма отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным звучанием. Сохранена формула клятвы, но устранены неестественные для русского буквальные конструкции. Имена переданы в традиционных русских формах: Илия, Елисей, Вефиль.'
