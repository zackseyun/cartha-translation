base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: ru
  text: 'Елисей смотрел[a] и восклицал: «Отец мой, отец мой! Колесница Израиля и его всадники!» И больше он его не видел. Тогда Елисей схватился за свои одежды и разорвал их надвое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возглас Елисея может означать, что Илия был истинной силой и защитой Израиля, либо относиться к небесной колеснице и коням, которые Елисей видел.
    reason: Сохранение неоднозначности связи между тем, что видел Елисей, и последующим возгласом.
lexical_decisions:
- source_word: רֹאֶה
  choice: смотрел
  rationale: 'Причастие передаёт продолжающееся действие: Елисей наблюдал за происходящим. Несовершенный вид естественно выражает эту длительность по-русски.'
- source_word: מְצַעֵק
  choice: восклицал
  rationale: Причастие указывает на действие, сопровождавшее видение; несовершенный вид сохраняет его длительность, а «восклицал» передаёт эмоциональную силу без излишнего акцента на громкости.
- source_word: אָבִי אָבִי
  choice: Отец мой, отец мой!
  rationale: Сохранены притяжательный суффикс первого лица и повтор, выражающий близость ученика к пророку и сильное потрясение.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Колесница Израиля и его всадники!
  rationale: Прямой перевод сохраняет единственное число «колесница», множественное «всадники» и местоименный суффикс, не устраняя неоднозначность возгласа.
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: И больше он его не видел
  rationale: Естественная русская передача прекращения видения, выраженного עוֹד с отрицанием.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: схватился за свои одежды
  rationale: Глагол передаёт решительное движение, а возвратная конструкция естественно показывает, что Елисей взялся за одежду на себе.
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: разорвал их надвое
  rationale: Ясная и естественная русская передача результата — одежды были разорваны на две части.
theological_decisions:
- issue: Смысл возгласа «Отец мой, отец мой! Колесница Израиля и его всадники!»
  choice: Метафорический возглас сохранён без истолкования в основном тексте.
  alternative: Слова могут называть Илию истинной силой и защитой Израиля либо относиться к небесной колеснице и коням, которые видит Елисей.
  rationale: Еврейский текст допускает оба понимания; прямой перевод сохраняет богословское и образное напряжение, не разрешая его искусственно.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно-торжественное. Видовые формы сохраняют длительность причастий, а прямой возглас — эмоциональную напряжённость и неоднозначность оригинала.
