  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: ru
  text: 'Тогда жители города сказали Елисею: «Посмотри, господин мой: город хорошо расположен, как ты видишь; но вода плохая, и земля лишает потомства[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и земля бесплодна». Еврейское выражение указывает на причинение утраты потомства и в данном контексте может также относиться к неплодородию земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי הָעִיר
  choice: Тогда жители города сказали
  rationale: Вав-последовательный продвигает повествование, поэтому естественно передан словом «тогда». Сочетание אַנְשֵׁי הָעִיר буквально означает «мужи города», но в данном контексте обозначает жителей, выступающих от имени города; «жители города» естественно и точно по-русски.
- source_word: הִנֵּה נָא
  choice: Посмотри
  rationale: הִנֵּה привлекает внимание, а נָא смягчает обращение. Русское «посмотри» в контексте уважительного обращения передаёт приглашение обратить внимание без архаичного «вот, прошу».
- source_word: מוֹשַׁב הָעִיר טוֹב
  choice: город расположен хорошо
  rationale: מוֹשַׁב здесь относится к местоположению или расположению города. Предикативная русская конструкция звучит естественнее буквального «местоположение города хорошее».
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: как ты и сам видишь, господин наш
  rationale: אֲדֹנִי — уважительное обращение к Елисею, а не божественный титул. «Как ты и сам видишь» естественно передаёт очевидность, выраженную причастием רֹאֶה; порядок слов перестроен ради ясного русского обращения.
- source_word: וְהַמַּיִם רָעִים
  choice: но вода плохая
  rationale: Союз וְ имеет здесь противительное значение из-за контраста с хорошим расположением города. Множественное по форме הַמַּיִם в русском идиоматично передаётся собирательным единственным «вода».
- source_word: וְהָאָרֶץ מְשַׁכָּלֶת
  choice: и земля приводит к потере плода
  rationale: Причастие породы пиэль от שׁכל обозначает причинение утраты потомства или плода. Формулировка сохраняет каузативность и намеренно не ограничивает смысл только человеческими выкидышами либо только сельскохозяйственным бесплодием.
theological_decisions:
- issue: Значение מְשַׁכָּלֶת в связи с плохой водой
  choice: приводит к потере плода
  alternative: бесплодна; вызывает выкидыши
  rationale: Еврейское слово конкретно связано с утратой потомства или плода, но контекст допускает воздействие как на людей и животных, так и на плодородие земли. Перевод сохраняет эту смысловую напряжённость, не сводя её к одной сфере.
- issue: Передача אֲדֹנִי при обращении к Елисею
  choice: господин наш
  alternative: мой господин; господин
  rationale: Это уважительный общественный титул, а не указание на божественность. Поскольку говорит группа жителей, русское «господин наш» естественнее буквального единственного «мой господин».
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Избегаются как церковнославянизмы, так и излишне разговорные обороты. Неоднозначность заключительной фразы сохранена в основном тексте и пояснена сноской.
