  terminology: Имя «Елисей» передано нормативно. «Господин мой» — социальное уважительное обращение к пророку, не божественный титул. Сноска сохраняет допустимую контекстуальную возможность сельскохозяйственного бесплодия, не подменяя основной смысл.
