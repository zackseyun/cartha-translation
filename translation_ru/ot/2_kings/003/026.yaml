  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: ru
  text: Когда царь Моава увидел, что битва стала для него непосильной, он взял с собой семьсот воинов с обнажёнными мечами, чтобы прорваться к царю Эдома[a], но они не смогли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прорваться против царя Эдома». Еврейский предлог здесь может указывать как направление («к, по направлению к»), так и враждебную направленность действия («против»).'
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: битва стала для него непосильной
  rationale: Еврейская конструкция с חזק и מן указывает, что ход битвы оказался сильнее царя Моава, то есть он не мог с ним справиться. Русская формулировка естественно передаёт военное превосходство противника.
- source_word: אֹתוֹ
  choice: с собой
  rationale: 'После וַיִּקַּח местоименная форма в данном контексте имеет сопроводительный смысл: царь взял отряд с собой.'
- source_word: שְׁבַע מֵאוֹת אִישׁ שֹׁלֵף חֶרֶב
  choice: семьсот воинов с обнажёнными мечами
  rationale: Буквально сказано о семистах мужчинах, «обнажающих меч». В военном контексте это устойчивое обозначение бойцов; «воины с обнажёнными мечами» сохраняет образ и звучит естественно по-русски.
- source_word: לְהַבְקִיעַ
  choice: чтобы прорваться
  rationale: Hифиль глагола בקע здесь означает пробить проход через боевые порядки; «прорваться» кратко и естественно передаёт эту попытку.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: к царю Эдома
  rationale: Основное направительное значение אֶל передано предлогом «к», а возможный в военном контексте враждебный смысл сохранён в сноске.
- source_word: וְלֹא יָכֹלוּ
  choice: но они не смогли
  rationale: Форма множественного числа относится к царю и его отряду; русский перевод сохраняет краткость и не добавляет прямо не названного дополнения.
theological_decisions:
- issue: Направление или враждебная цель прорыва к царю Эдома
  choice: к царю Эдома
  alternative: против царя Эдома
  rationale: Предлог אֶל допускает как направительное, так и враждебное понимание в военном контексте. Основной текст сохраняет более прямое значение, а альтернативное чтение отмечено, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Военная образность исходного текста сохранена без архаической синтаксической тяжеловесности.
