    rationale: В русском ближайшие явные референты — «стан» (м. р.), «Израиль/израильтяне» и «моавитяне»; местоимение женского рода остаётся без синтаксической опоры. Еврейский суффикс 3 ж. р. действительно труден и, вероятно, относится к подразумеваемой земле/территории, но русское «туда» лучше сохраняет неуточнённость, не создавая грамматической неясности.
  - severity: low
