base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: ru
  text: Когда они подошли к стану Израиля, израильтяне поднялись и поразили моавитян, и те побежали от них. Тогда израильтяне вошли туда[a] и продолжали поражать моавитян.
  philosophy: optimal-equivalence
  footnotes:
