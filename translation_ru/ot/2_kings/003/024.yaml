    text: 'В еврейском тексте буквально: «вошли в неё». Местоимение женского рода не имеет явно названного референта; вероятно, оно относится к земле или территории Моава.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲנֵה
  choice: стан
  rationale: В данном военном контексте слово обозначает лагерь. «Стан» естественно звучит в русском библейском повествовании и остаётся понятным современному читателю.
- source_word: וַיָּקֻמוּ
  choice: поднялись
  rationale: Передаёт буквальный образ глагола קום и начало решительного действия, не сводя его значение непосредственно к нападению.
- source_word: וַיַּכּוּ / וְהַכּוֹת
  choice: поразили / продолжали поражать
  rationale: Корень נכה обозначает нанесение ударов или поражение противника. Первое выражение передаёт отдельное действие, а второе — продолженное действие инфинитивной конструкции.
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: те побежали от них
  rationale: Естественно передаёт бегство моавитян перед израильтянами; указательное «те» проясняет смену субъекта без добавления нового содержания.
- source_word: וַיָּבֹאוּ בָהּ
  choice: вошли в неё
  rationale: Сохраняет сжатость и неопределённость еврейского местоименного суффикса женского рода; вероятный смысл пояснён в сноске.
- source_word: יִשְׂרָאֵל / מוֹאָב
  choice: израильтяне / моавитяне
  rationale: В контексте битвы названия народов употреблены собирательно. Русские обозначения участников устраняют неестественное олицетворение стран, не меняя референтов.
