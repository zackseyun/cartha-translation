  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: ru
  text: И вы поразите каждый укреплённый город и каждый отборный город[a], повалите все хорошие деревья, перекроете все источники воды и завалите камнями все хорошие участки земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избранный город»; возможно: «лучший город».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «причините вред камнями». Имеется в виду, что землю сделают непригодной для обработки, забросав её камнями.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: вы разгромите
  rationale: Глагол נכה в военном контексте означает нанести удар или поразить; с городами естественное русское «разгромите» передаёт военное действие, не добавляя идеи обязательного завоевания.
- source_word: עִיר מִבְצָר
  choice: укреплённые города
  rationale: מִבְצָר обозначает укрепление или укреплённое место; это точное и естественное русское соответствие.
- source_word: עִיר מִבְחוֹר
  choice: отборные города
  rationale: מִבְחוֹר означает избранное, отборное или лучшее. Буквальное «отборные» сохраняет необычность и смысловую широту выражения; варианты пояснены в сноске.
- source_word: תַּפִּילוּ
  choice: повалите
  rationale: Каузативная форма נפל буквально выражает действие, заставляющее деревья упасть. «Повалите» точно передаёт результат, не уточняя способ.
- source_word: כָּל עֵץ טוֹב
  choice: все хорошие деревья
  rationale: טוֹב имеет широкое значение «хороший»; перевод не сужает его до плодовых или ценных деревьев.
- source_word: מַעְיְנֵי מַיִם
  choice: источники воды
  rationale: Выражение обозначает природные водные источники; эта формулировка ясна и близка к еврейскому тексту.
- source_word: תִּסְתֹּמוּ
  choice: засыплете
  rationale: סתם означает закрыть или заградить. Для намеренного выведения источников из строя русское «засыплете» естественно в данном контексте.
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: хорошие участки земли
  rationale: חֶלְקָה — участок или надел земли, не обязательно поле в узком смысле; «участки земли» сохраняет эту широту.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: завалите камнями
  rationale: Буквально глагол связан с причинением боли или вреда; в контексте речь о порче пригодной земли камнями. Перевод естественно передаёт конкретное действие, а буквальная образность отмечена в сноске.
