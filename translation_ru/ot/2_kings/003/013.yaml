  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: ru
  text: 'И сказал Елисей царю Израиля: «Что мне до тебя?[a] Ступай к пророкам твоего отца и к пророкам твоей матери». Но царь Израиля сказал ему: «Нет,[b] ведь Яхве созвал этих трёх царей, чтобы отдать их в руки Моава».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что мне и тебе?» — еврейское выражение дистанцирования или отказа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Не надо, ведь Яхве созвал этих трёх царей…» Еврейское выражение трудно для истолкования и может быть понято как просьба, а не как прямое возражение.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Что мне до тебя?
  rationale: Еврейская идиома буквально говорит «что мне и тебе?» и выражает дистанцирование или отвержение. Русское «Что мне до тебя?» естественно передаёт резкий отказ, не превращая образное выражение в буквальную кальку.
- source_word: לֵךְ
  choice: Ступай
  rationale: Прямой повелительный глагол. «Ступай» сохраняет краткость и в данном контексте звучит как решительное отослание, не будучи архаичным.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: к пророкам твоего отца и к пророкам твоей матери
  rationale: Формально близкий перевод сохраняет подчёркнутое указание на религиозное окружение обоих родителей царя.
- source_word: אַל כִּי
  choice: Нет, ведь
  rationale: Трудное и сжатое сочетание понято как возражение царя. «Нет, ведь» естественно вводит его протест, но примечание сохраняет возможность прочесть выражение как просьбу.
- source_word: קָרָא
  choice: созвал
  rationale: В контексте речь идёт о том, что Яхве свёл трёх царей вместе. «Созвал» точнее передаёт это контекстуальное значение, чем более широкое «призвал».
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: этих трёх царей
  rationale: Естественный русский порядок слов сохраняет число, указательное местоимение и титул.
- source_word: לָתֵת אוֹתָם
  choice: чтобы отдать их
  rationale: Инфинитив передаёт цель или предполагаемый результат созыва. «Чтобы отдать их» сохраняет обе смысловые возможности настолько, насколько позволяет русский синтаксис.
- source_word: בְּיַד מוֹאָב
  choice: в руки Моава
  rationale: Русская библейская и общеупотребительная идиома «отдать в руки» сохраняет образ руки и означает передачу под власть противника. «Моав» здесь может обозначать народ или государство.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Смысл ответа царя אַל כִּי
  choice: 'Возражение: «Нет, ведь Яхве созвал…»'
  alternative: 'Просьба: «Не надо, ведь Яхве созвал…»; скорбное восклицание: «Увы, ведь…»'
  rationale: Фраза грамматически трудна и эллиптична. Контекст поддерживает протест против резкого отстранения Елисея, однако альтернативная просительная трактовка отмечена в сноске.
- issue: Цель или результат в לָתֵת אוֹתָם
  choice: чтобы отдать их
  alternative: так что Он отдаст их; для того чтобы предать их
  rationale: Инфинитив допускает оттенок цели или результата. Нейтральная конструкция не уточняет сверх текста, намеренно ли Яхве созвал царей ради поражения или это представленный царём итог.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис остаётся близким к еврейскому, но идиомы переданы естественно. «Ступай» выражает резкость реплики без устарелой торжественности; «Яхве» сохраняет личное имя.
