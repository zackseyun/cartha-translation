base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: ru
  text: 'Он пошёл и послал весть Иосафату, царю Иудеи: «Царь Моава восстал против меня[a]. Пойдёшь ли ты со мной в Моав на войну?» Тот ответил: «Пойду. Я — как ты, мой народ — как твой народ, мои кони — как твои кони[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отложился от меня». Еврейский глагол может обозначать политический мятеж или разрыв вассальной верности; здесь речь идёт об отказе Моава подчиняться Израилю.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднимусь». Этот глагол нередко употребляется о выступлении в поход или движении на возвышенность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: И пошёл он
  rationale: Последовательная форма с וַ продвигает повествование; русское «И пошёл он» сохраняет связь с предыдущим контекстом и естественный библейский повествовательный ритм.
- source_word: וַיִּשְׁלַח אֶל ... לֵאמֹר
  choice: и послал сказать
  rationale: В сочетании с адресатом и прямой речью глагол обозначает передачу сообщения; «послал сказать» точно и естественно передаёт еврейскую конструкцию.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Иосафату, царю Иудеи
  rationale: Использована закрепившаяся русская форма имени; приложение отделено запятой согласно нормам современного русского языка.
- source_word: פָּשַׁע בִּי
  choice: восстал против меня
  rationale: В политическом контексте פשע обозначает мятеж или отказ вассала от подчинения. «Восстал против меня» передаёт этот смысл без излишней конкретизации.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Пойдёшь ли ты со мной
  rationale: Сохранено вопросительное значение частицы הֲ и основное значение הלך — «идти».
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: воевать против Моава
  rationale: Буквальная пространственно-целевая конструкция «к Моаву на войну» в современном русском звучит неестественно; выбранная формулировка ясно передаёт направленность военного похода.
- source_word: אֶעֱלֶה
  choice: Пойду
  rationale: עלה буквально означает «поднимусь / пойду вверх», но здесь обозначает выступление в военный поход. «Пойду» естественно передаёт согласие, а буквальный оттенок отмечен в сноске.
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: Я — как ты, мой народ — как твой народ, мои кони — как твои кони
  rationale: Сохранена лаконичная трёхчастная формула полной солидарности; тире естественно восполняет отсутствующую в еврейском связку.
