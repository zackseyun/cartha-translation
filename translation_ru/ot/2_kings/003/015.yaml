source:
  edition: WLC
  text: וְ/עַתָּ֖ה קְחוּ לִ֣/י מְנַגֵּ֑ן וְ/הָיָה֙ כְּ/נַגֵּ֣ן הַֽ/מְנַגֵּ֔ן וַ/תְּהִ֥י עָלָ֖י/ו יַד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: ru
  text: А теперь приведите ко мне музыканта[a]. И когда музыкант заиграл, рука Яхве сошла на Елисея[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «играющего». Имеется в виду исполнитель на музыкальном инструменте; какой именно инструмент, еврейский текст не уточняет.'
    reason: lexical_alternative
  - marker: b
    text: «Рука Яхве» — еврейский образ, выражающий действие Божьей силы или пророческое воздействие.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт непосредственный переход от предыдущей речи к новому распоряжению; союз допускает и простое «И теперь», однако по-русски «А теперь» естественно обозначает поворот в речи.
- source_word: קְחוּ לִי
  choice: приведите ко мне
  rationale: В контексте требуется доставить к говорящему человека; «приведите ко мне» точнее и естественнее русского «возьмите для меня».
- source_word: מְנַגֵּן
  choice: музыканта
  rationale: Причастие от נגן обозначает играющего на музыкальном инструменте, но сам инструмент не назван; общее «музыкант» сохраняет эту неопределённость.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: И когда музыкант заиграл
  rationale: Конструкция задаёт временное обстоятельство последующего события. «Заиграл» естественно передаёт начало исполнения, не добавляя конкретного инструмента.
- source_word: וַתְּהִי עָלָיו
  choice: сошла на Елисея
  rationale: Событийная форма указывает на наступление состояния или воздействия. Имя «Елисей» проясняет референт местоимения в русском переводе, где соседнее упоминание музыканта иначе может создать двусмысленность.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохранён образный еврейский оборот, обозначающий божественную силу или пророческое воздействие, без сведения его к одному толкованию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, представленное тетраграмматоном, передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; форма «Яхве» непосредственно передаёт тетраграмматон и отличает имя от титула.
- issue: Смысл выражения יַד יְהוָה
  choice: рука Яхве сошла на Елисея
  alternative: сила Яхве охватила Елисея; дух пророчества сошёл на Елисея
  rationale: Образ «руки» сохранён, поскольку оборот может указывать на божественную силу, воздействие или пророческое вдохновение; более разъясняющие варианты неоправданно сужают смысл.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Синтаксис сделан естественным, а древнееврейский образ «рука Яхве» сохранён. Имя Елисея введено вместо местоимения, чтобы по-русски не возникло ошибочного впечатления, будто рука Яхве сошла на музыканта.
