  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: ru
  text: 'И сказал Елисей: «Жив Яхве Воинств, пред Которым я стою: если бы я не уважал Иосафата, царя Иудеи[b], я не взглянул бы на тебя и не увидел бы тебя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пред лицом Которого я стою»; этот оборот может также подразумевать пророческое служение: «Которому я служу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднимаю лицо Иосафата». Этот оборот означает проявлять к кому-либо расположение, уважение или особое внимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: Жив Яхве Воинств
  rationale: Сохранена древнееврейская формула клятвы и личное имя Бога; צְבָאוֹת передано широким по смыслу словом «Воинств», без уточнения, о каких именно силах идёт речь.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: пред Которым я стою
  rationale: Буквальный образ сохраняет и значение пребывания перед Богом, и возможный оттенок пророческого служения.
- source_word: לוּלֵי פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: Если бы я не считался с Иосафатом, царём Иудеи
  rationale: Естественно передаёт условие и идиому «поднимать лицо», то есть проявлять расположение или принимать человека во внимание, не воспроизводя неясный для русского читателя буквальный оборот.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: я не взглянул бы на тебя и не увидел бы тебя
  rationale: Сохранены оба древнееврейских глагола и их усилительный параллелизм; подразумеваемое в формуле клятвы отрицание выражено явно.
- source_word: יְהוֹשָׁפָט / יְהוּדָה
  choice: Иосафат / Иудея
  rationale: Использованы устоявшиеся русские библейские формы личного имени и названия царства.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя передано транслитерацией, а не заменено титулом.
- issue: Положение пророка перед Богом
  choice: пред Которым я стою
  alternative: Которому я служу
  rationale: Сохранён буквальный образ; возможный смысл пророческого служения отмечен в сноске, а не закреплён как единственное толкование.
- issue: Отношение Елисея к Иосафату
  choice: считался с Иосафатом
  alternative: оказывал почтение Иосафату; благоволил к Иосафату
  rationale: Формулировка передаёт внимание и особое отношение, но не уточняет сверх текста, идёт ли речь преимущественно о почтении, благоволении или принятии во внимание.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Формула «Жив Яхве Воинств» намеренно сохраняет сжатость и древний характер клятвы; речь Елисея остаётся резкой, а два заключительных глагола не сведены к одному.
