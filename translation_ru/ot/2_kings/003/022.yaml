  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: ru
  text: Они встали рано утром. Солнце светило на воду, и моавитяне увидели перед собой воду, красную, как кровь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моав увидел воду напротив себя». В еврейском тексте название «Моав» употреблено собирательно для обозначения моавитян; пространственное выражение может также означать «по ту сторону от себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Они встали рано утром
  rationale: Глагол שׁכם в породе хифиль передаёт раннее вставание или раннее начало действия; русское выражение естественно передаёт временной акцент.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: Солнце засияло над водой
  rationale: זרח может обозначать восход или сияние. Здесь последующее зрительное впечатление подчёркивает свет солнца над поверхностью воды; «засияло» сохраняет это значение, не исключая восхода.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: и моавитяне увидели
  rationale: Название «Моав» употреблено собирательно о народе; по-русски «моавитяне» ясно и естественно передаёт реальных действующих лиц.
- source_word: מִנֶּגֶד
  choice: напротив себя
  rationale: Наречие указывает на положение напротив или перед наблюдателями; выбранный вариант естественно выражает пространственное отношение.
- source_word: אֶת הַמַּיִם אֲדֻמִּים כַּדָּם
  choice: воду, красную, как кровь
  rationale: Сохранены прямой объект, признак красного цвета и явное сравнение с кровью.
