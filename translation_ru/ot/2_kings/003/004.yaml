base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: ru
  text: 'Меша, царь Моава, разводил овец и платил царю Израиля дань: сто тысяч ягнят и шерсть со ста тысяч баранов[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «сто тысяч баранов, шерсть». Это сокращённое выражение может означать «сто тысяч баранов с шерстью» или, что в данном контексте вероятнее, «шерсть со ста тысяч баранов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: разводил овец
  rationale: Слово обозначает человека, занимающегося разведением мелкого скота, особенно овец. Глагольное выражение естественно и понятно передаёт род занятий Меши без архаичного титула.
- source_word: וְהֵשִׁיב
  choice: платил … дань
  rationale: В данном контексте форма глагола שוב означает регулярную выплату или поставку подвластным царём. Несовершенный вид «платил» передаёт обычное, повторявшееся действие; слово «дань» ясно выражает политико-экономический характер платежа.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: сто тысяч ягнят
  rationale: כָּרִים обозначает ягнят или молодых баранов. «Ягнят» — естественный русский эквивалент в перечне скота, отдаваемого в дань.
- source_word: מֵאָה אֶלֶף אֵילִים צָמֶר
  choice: шерсть со ста тысяч баранов
  rationale: 'Еврейская конструкция эллиптична: после «ста тысяч баранов» следует «шерсть». Передача «шерсть со ста тысяч баранов» даёт наиболее вероятный по контексту смысл, не скрывая иной возможности, отмеченной в сноске.'
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: царь Моава / царь Израиля
  rationale: Обычная русская передача сочетаний со статусным наименованием и географическим именем.
