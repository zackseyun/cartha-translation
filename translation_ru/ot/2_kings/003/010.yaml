base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: ru
  text: 'Тогда царь Израиля сказал: «Увы! Яхве созвал[a] этих трёх царей, чтобы предать их в руки Моава[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позвал»; еврейский глагол буквально означает «позвал, призвал».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в руку Моава» — еврейский оборот со значением «во власть Моава».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Точное и естественное обозначение правителя; поскольку в стихе он не назван по имени, титул сохранён.
- source_word: אֲהָהּ
  choice: О горе!
  rationale: Междометие выражает испуг и скорбь; этот вариант сохраняет серьёзный тон и звучит понятно в современной литературной речи.
- source_word: כִּי
  choice: не передано отдельным словом
  rationale: Здесь частица вводит объяснение возгласа или содержание тревоги. В русском непосредственное продолжение после «О горе!» естественно передаёт эту связь без тяжеловесного «ибо».
- source_word: קָרָא
  choice: созвал
  rationale: Глагол значит «звать, призывать, созывать». В данном контексте речь идёт о трёх царях, собранных для совместного похода; «созвал» естественно передаёт это значение, не превращая его в более широкое «собрал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: этих трёх царей
  rationale: Сохраняются число и указательное значение оборота; русская форма соответствует управлению глагола «созвал».
- source_word: לָתֵת אֹתָם
  choice: чтобы предать их
  rationale: Инфинитив с לְ выражает цель. В сочетании с оборотом «в руку» глагол נָתַן имеет смысл передачи во власть противника; «предать» ясно и естественно передаёт этот враждебный исход.
- source_word: בְּיַד מוֹאָב
  choice: в руки Моава
  rationale: Русский устойчивый оборот «предать в руки» естественно соответствует еврейской идиоме «дать в руку», то есть отдать под власть. Множественное «руки» требуется русской идиоматикой.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл קָרָא применительно к трём царям
  choice: созвал
  alternative: позвал; собрал
  rationale: «Созвал» остаётся в пределах значения «звать» и подходит совместному выступлению царей. «Собрал» сильнее подчёркивало бы провиденциальное действие, которого сам глагол прямо не выражает.
- issue: Характер утверждения о намерении Яхве
  choice: сохранено как слова встревоженного царя, без поясняющего смягчения
  alternative: добавить указание, что так лишь казалось царю
  rationale: Стих прямо передаёт оценку царя Израиля. Перевод не должен ни подтверждать её как авторское богословское заключение, ни заранее опровергать её.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «О горе!» передаёт сильную тревогу без разговорности; «созвал» и «предать в руки» понятны широкому кругу читателей. Все примечания отмечены в основном тексте.
