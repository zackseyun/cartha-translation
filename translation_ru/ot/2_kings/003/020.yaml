revisions:
- from: И вот утром, во время возношения хлебного приношения[a], вода потекла со стороны Эдома[b], и земля наполнилась водой.
  to: 'И было утром, во время принесения хлебного приношения: вот, вода текла со стороны Эдома[b], и земля наполнилась водой.'
  rationale: Переставлена частица «вот», чтобы она вводила воду, как וְהִנֵּה в исходном тексте; «возношение» заменено на более естественное «принесение». Сноска a более не требуется, поскольку выражение в переводе не претендует на буквальное воспроизведение; вариант для מִדֶּרֶךְ אֱדוֹם сохранён в сноске b. Смысл и намеренная географическая неоднозначность не изменены.
