base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: ru
  text: 'И было утром, во время принесения хлебного приношения: вот, вода текла со стороны Эдома[b], и земля наполнилась водой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «по пути из Эдома»; буквально: «от пути Эдома».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: И вот утром
  rationale: Последовательная повествовательная форма вводит очередное событие; «и вот» естественно связывает его с контекстом и одновременно подготавливает внимание к неожиданному появлению воды.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: во время возношения хлебного приношения
  rationale: Конструкция буквально означает «при восхождении приношения» и употребляет жертвенный язык. «Возношение» сохраняет образ движения приношения вверх, а «хлебное приношение» ясно передаёт культовое значение מִנְחָה.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Указательная частица привлекает внимание к неожиданному событию. В русском повествовании её выразительная сила естественно передана частицей «вот» в начале фразы.
- source_word: מַיִם בָּאִים
  choice: вода потекла
  rationale: Причастие описывает наблюдаемое движение воды. Русское «потекла» естественно передаёт её поступление от указанного направления, не превращая фразу в статическое «появилась».
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: со стороны Эдома
  rationale: דֶּרֶךְ буквально значит «путь, дорога», но в этой конструкции обозначает направление или маршрут, откуда шла вода. «Со стороны Эдома» точно и естественно передаёт географический смысл.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: и земля наполнилась водой
  rationale: הָאָרֶץ здесь означает землю или местность, а не весь мир. Творительный падеж после «наполнилась» идиоматично передаёт воду, уже упомянутую в предыдущей части стиха.
