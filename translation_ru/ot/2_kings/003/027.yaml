  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: ru
  text: Тогда он взял своего сына-первенца, которому предстояло царствовать после него, и принёс его во всесожжение на стене. И возник великий гнев против Израиля[a]; они отступили от него и возвратились в страну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое негодование» или «великая ярость против Израиля». В еврейском тексте не сказано, чей это был гнев; толкователи по-разному понимают его как Божий гнев, ярость Моава или смятение израильтян после жертвоприношения.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: своего первенца
  rationale: Слово בְּכוֹר обозначает именно первенца и в данном контексте несёт также смысл престолонаследия. В русском слово «первенец» естественно подразумевает сына благодаря последующему мужскому относительному предложению.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: который должен был царствовать вместо него
  rationale: Передаёт назначенное престолонаследие и буквально сохраняет значение תַּחְתָּיו — «вместо него».
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: принёс его во всесожжение
  rationale: Устойчивая русская жертвенная формула точно передаёт каузативный глагол עלה в сочетании с עֹלָה, не смягчая ужас человеческой жертвы.
- source_word: עַל הַחֹמָה
  choice: на стене
  rationale: Кратко и точно передаёт еврейское выражение; городская стена ясна из контекста, поэтому добавление «городской» не обязательно.
- source_word: קֶצֶף גָּדוֹל
  choice: великий гнев
  rationale: Прямой и стилистически достойный эквивалент, сохраняющий силу выражения и неопределённость относительно источника гнева.
- source_word: עַל יִשְׂרָאֵל
  choice: против Израиля
  rationale: В сочетании с «гневом» предлог עַל естественно обозначает направленность враждебного действия.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: израильтяне отступили от него
  rationale: В военном контексте נסע означает сняться с места и прекратить наступление. Явное «израильтяне» устраняет неестественную для русского неясность подлежащего после упоминания гнева, не меняя референта коалиционных сил.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: возвратились в свою землю
  rationale: Естественно передаёт возвращение войска на родину; притяжательное значение выводится из контекста, хотя в еврейском буквально стоит «в землю/в страну».
theological_decisions:
- issue: Источник «великого гнева против Израиля»
  choice: Сохранить выражение «великий гнев против Израиля», не называя источник гнева.
  alternative: Уточнить как Божий гнев, ярость моавитян или смятение самого Израиля.
  rationale: Еврейский текст не указывает, чей это был гнев. Конкретизация разрешила бы значимую экзегетическую неоднозначность, которой нет в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Всесожжение» сохранено как точный и широко понятный культовый термин. Маркер сноски поставлен после неоднозначного выражения «против Израиля», к которому относится примечание.
