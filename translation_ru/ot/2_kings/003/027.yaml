revisions:
- from: Тогда он взял своего первенца, который должен был царствовать вместо него, и принёс его во всесожжение на стене. И поднялся великий гнев против Израиля[a]; поэтому израильтяне отступили от него и возвратились в свою землю.
  to: Тогда он взял своего сына-первенца, которому предстояло царствовать после него, и принёс его во всесожжение на стене. И возник великий гнев против Израиля[a]; они отступили от него и возвратились в страну.
  rationale: Убрана невыраженная причинная связка, устранено притяжательное уточнение при «в страну» и явно назван сын. Формулировка о гневе и сноска сохраняют существенную неопределённость еврейского текста относительно источника и природы этого гнева.
