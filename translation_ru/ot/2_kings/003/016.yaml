lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Форма wayyiqtol продолжает повествование и вводит прямую речь. Русское «Он сказал» естественно передаёт эту функцию без излишнего уточнения времени.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена торжественная формула пророческого посланника и личное имя Бога.
- source_word: עָשֹׂה
  choice: устройте
  rationale: Широкое значение עשה — «делать, устраивать». В контексте требуется создать ямы; «устройте» звучит по-русски естественнее буквального «сделайте» и менее конкретно, чем «выкопайте».
- source_word: הַנַּחַל הַזֶּה
  choice: по всему этому руслу
  rationale: נחל здесь обозначает русло сезонного водотока. Предлог и слово «всему» естественно выражают распределительное значение следующего повтора, не превращая русло в постоянно текущую реку.
- source_word: גֵּבִים גֵּבִים
  choice: ямы — одну за другой
  rationale: Повтор существительного передаёт множество или распределённость ям. Формулировка сохраняет выразительность повтора в понятном современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом; традиционный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский с сохранением торжественной пророческой формулы. Географический термин передан общеупотребительным словом «русло», а непривычное для многих читателей «вади» раскрыто по смыслу в сноске. Повтор оригинала отражён идиоматическим оборотом «одну за другой».
