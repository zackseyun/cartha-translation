revisions:
- from: 'Ибо так говорит Яхве: «Вы не увидите ни ветра, ни дождя, но это русло[a] наполнится водой, и будете пить вы, ваши стада и ваш скот».'
  to: 'Ибо так говорит Яхве: «Вы не увидите ни ветра, ни дождя, но то русло[a] наполнится водой, и будете пить вы, ваш скот и ваши животные».'
  rationale: 'Внесены только безопасные точечные поправки: «то» точнее передаёт הַהוּא, а «ваш скот и ваши животные» сохраняет порядок и различение еврейских терминов. Из примечания удалено уточнение «после дождей»: хотя оно обычно верно для сезонного водотока, в данном стихе особо подчёркнуто, что дождя не будет, поэтому более нейтральная формулировка лучше избегает ненужного смыслового напряжения.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:03:58Z'
