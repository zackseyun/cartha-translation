  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: ru
  text: 'Ибо так говорит Яхве: «Вы не увидите ни ветра, ни дождя, но то русло[a] наполнится водой, и будете пить вы, ваш скот и ваши животные».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «та долина», «то пересохшее русло». Еврейское נַחַל часто обозначает сезонный водоток.'
    reason: Лексема допускает значения от долины до русла временного потока; примечание сохраняет географическую неоднозначность.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: כִּי כֹה אָמַר
  choice: Ибо так говорит
  rationale: Сохраняет пояснительное значение כִּי и формулу введения божественного речения, естественную для литературного русского языка.
- source_word: לֹא תִרְאוּ רוּחַ וְלֹא תִרְאוּ גֶשֶׁם
  choice: Вы не увидите ни ветра, ни дождя
  rationale: Будущее время соответствует контексту обещания; конструкция «ни… ни…» естественно передаёт параллельное отрицание, а רוּחַ здесь имеет метеорологическое значение.
- source_word: הַנַּחַל הַהוּא
  choice: это русло
  rationale: נחל в данном засушливом окружении обозначает русло сезонного водотока; «русло» понятно современному русскому читателю и не создаёт впечатления постоянной реки.
- source_word: יִמָּלֵא מָיִם
  choice: наполнится водой
  rationale: Передаёт результативно-пассивное значение нифаля и звучит естественно по-русски.
- source_word: וּשְׁתִיתֶם
  choice: будете пить
  rationale: Сохраняет будущее значение обещанного результата.
- source_word: מִקְנֵיכֶם וּבְהֶמְתְּכֶם
  choice: ваши стада и ваш скот
  rationale: Сохраняет два еврейских обозначения животных, не сливая их полностью; «стада» указывает на принадлежащих людям стадных животных, а «скот» шире обозначает домашних животных.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя יהוה. Транслитерация «Яхве» сохраняет его как личное имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной пророческой формулой. Прямая речь оформлена кавычками; синтаксис остаётся ясным для широкого круга читателей.
