base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: ru
  text: И отправился царь Израиля вместе с царём Иудеи и царём Эдома. Они семь дней шли окружным путём, но воды не было ни для лагеря, ни для скота, который шёл за ними[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который был у их ног» — образное выражение о животных, сопровождавших их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: отправился
  rationale: Обычная повествовательная форма глагола הלך вводит начало похода. «Отправился» естественно передаёт выступление в путь, не добавляя к самому глаголу излишней военной окраски.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: царь Израиля вместе с царём Иудеи и царём Эдома
  rationale: Сохранены титулы всех трёх правителей и координация участников похода; «вместе с» естественно передаёт присоединение двух царей к первому подлежащему.
- source_word: וַיָּסֹבּוּ דֶּרֶךְ שִׁבְעַת יָמִים
  choice: они семь дней шли окружным путём
  rationale: סבב указывает на движение в обход или по непрямому маршруту, а דֶּרֶךְ שִׁבְעַת יָמִים — на путь протяжённостью в семь дней. Формулировка сохраняет оба элемента и звучит естественно по-русски.
- source_word: וְלֹא הָיָה מַיִם
  choice: воды не было
  rationale: Прямое и естественное воспроизведение экзистенциальной конструкции с היה.
- source_word: לַמַּחֲנֶה
  choice: для лагеря
  rationale: מַחֲנֶה может обозначать лагерь либо расположившееся в нём войско. «Лагерь» сохраняет конкретный образ исходного текста и не усиливает военное значение без необходимости.
- source_word: וְלַבְּהֵמָה
  choice: для скота
  rationale: Собирательное בְּהֵמָה обозначает сопровождавших людей домашних и тягловых животных. Русское собирательное «скот» подходит контексту.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: который шёл за ними
  rationale: Буквально «который был у их ног»; в данном контексте это идиоматическое указание на сопровождавших войско животных. Смысл передан в тексте, а буквальный образ сохранён в сноске.
