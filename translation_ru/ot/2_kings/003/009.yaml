  source_fidelity: 'Текст точно передаёт последовательность еврейского повествования: царь Израиля выступает вместе с царями Иудеи и Эдома; затем союзники идут в обход в течение семи дней; воды нет ни для лагеря, ни для сопровождающего их скота. «Окружным путём» удачно отражает וַיָּסֹבּוּ, а «семь дней шли» естественно передаёт меру пути в דֶּרֶךְ שִׁבְעַת יָמִים без неоправданного уточнения маршрута.'
