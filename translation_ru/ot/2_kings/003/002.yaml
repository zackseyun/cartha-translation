base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: ru
  text: 'Он делал зло в глазах Яхве, однако не так, как его отец и мать: он убрал столб Ваала[a], который сделал его отец.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священный столб Ваала»; возможно также: «стоячий камень Ваала». Еврейское слово обозначает вертикально установленный камень или столб, здесь связанный с поклонением Ваалу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Он делал зло
  rationale: Устойчивое сочетание עשה + הרע означает поступать дурно, делать зло. Несовершенный вид естественно передаёт характеристику поведения царя.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образный древнееврейский оборот, обозначающий оценку со стороны Яхве; он понятен в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  choice: однако не так, как его отец и мать
  rationale: 'רַק ограничивает предшествующую отрицательную оценку: он делал зло, но не в той же мере или не тем же образом, что родители. Формулировка сохраняет возможную неоднозначность сравнения.'
- source_word: וַיָּסַר
  choice: он убрал
  rationale: Глагол означает удалить, устранить. Двоеточие передаёт вероятную пояснительную связь, не превращая её в явно причинную формулу.
- source_word: מַצְּבַת הַבַּעַל
  choice: столб Ваала
  rationale: מַצֵּבָה — установленный вертикально камень или культовый столб. Краткое «столб» сохраняет предметность термина, а культовый смысл ясен из связи с Ваалом и пояснён в сноске.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: который поставил его отец
  rationale: В отношении каменного столба עשה естественно понимать как изготовление или установку. «Поставил» по-русски точнее описывает возведение стоячего культового объекта, не утверждая, что отец собственноручно его изготовил.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не заменяет имя титулом.
- issue: Степень сравнения с отцом и матерью
  choice: не так, как его отец и мать
  alternative: не до такой степени, как его отец и мать
  rationale: Исходный текст не уточняет, идёт ли речь именно о степени зла или также о характере поступков. Основной текст сохраняет эту смысловую напряжённость и не сужает сравнение.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского повествования звучанием. Синтаксис краткий и ясный; сохранён древнееврейский образ «в глазах Яхве». Формулировка не уточняет сверх текста, отличался ли царь от родителей степенью зла или его проявлением.
