  source_fidelity: 'Текст точно передаёт древнееврейскую структуру: Иорам, сын Ахава, вступает на царство над Израилем в Самарии в восемнадцатый год Иосафата, царя Иудеи; затем отдельно указана продолжительность его царствования — двенадцать лет. Различие между сообщением о воцарении (מָלַךְ) и длительности правления (וַיִּמְלֹךְ) удачно сохранено.'
