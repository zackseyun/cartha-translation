  text: וִ/יהוֹרָ֣ם בֶּן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: ru
  text: Иорам[a], сын Ахава, воцарился над Израилем в Самарии в восемнадцатый год правления Иосафата, царя Иудеи, и царствовал двенадцать лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «И Иорам». Начальный древнееврейский союз связывает это сообщение с предшествующим повествованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹרָם
  choice: Иорам[a]
  rationale: Имя передано в традиционной русской форме. Начальный союз ו продолжает повествование, но в современном русском его естественно не выражать отдельным союзом; формальный вариант отмечен в сноске.
- source_word: בֶּן אַחְאָב
  choice: сын Ахава
  rationale: Прямое и естественное обозначение родства; имя אַחְאָב передано в традиционной русской форме «Ахав».
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: воцарился над Израилем
  rationale: В данном синхронистическом сообщении форма מָלַךְ обозначает вступление на престол. «Воцарился» отличает начало царствования от последующего указания его продолжительности.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог ב имеет местное значение; Самария здесь — столица, где находилась царская резиденция.
- source_word: בִּשְׁנַת שְׁמֹנֶה עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: в восемнадцатый год правления Иосафата
  rationale: Так естественно передаётся древнееврейская формула синхронизации царствований; слово «правления» эксплицирует подразумеваемое значение года царствования.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Титул и территория переданы обычной русской историко-библейской формулой.
- source_word: וַיִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: и царствовал двенадцать лет
  rationale: Здесь тот же корень מלך относится уже к продолжительности царствования; русский глагол «царствовал» точно и естественно передаёт это значение.
theological_decisions: []
