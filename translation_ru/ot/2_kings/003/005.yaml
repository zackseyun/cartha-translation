  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: ru
  text: После смерти Ахава царь Моава восстал против царя Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда Ахав умер, царь Моава восстал против царя Израиля». Еврейский временной оборот допускает оба варианта перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמוֹת
  choice: После смерти
  rationale: Сочетание повествовательного וַיְהִי с כְּמוֹת вводит временное обстоятельство. По-русски «после смерти» естественно передаёт переход к событию, последовавшему за смертью Ахава, без тяжеловесного буквального оборота.
- source_word: אַחְאָב
  choice: Ахава
  rationale: Имя передано в принятой русской библейской форме «Ахав» и поставлено в родительный падеж по синтаксису предложения.
- source_word: וַיִּפְשַׁע
  choice: восстал
  rationale: В политическом контексте פשע означает мятеж или отказ от подчинения сюзерену. «Восстал против» — ясное и естественное русское соответствие.
- source_word: מֶלֶךְ מוֹאָב
  choice: царь Моава
  rationale: Конструктивная цепь прямо и естественно передана русским сочетанием с родительным падежом.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: против царя Израиля
  rationale: При глаголе פשע предлог בְּ обозначает того, против кого направлен мятеж; русское управление требует предлога «против».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование изложено кратко и достойно. Формула «после смерти Ахава» естественнее буквального «и было, когда умер Ахав», а допустимая временная альтернатива сохранена в сноске.
