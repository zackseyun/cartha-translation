  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: ru
  text: Однако он держался грехов Иеровоама, сына Навата, которыми тот ввёл Израиль в грех[a], и не отступал от них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при ином отнесении относительного предложения: «грехов Иеровоама, сына Навата; Иеровоам ввёл Израиль в грех». Еврейский каузативный глагол указывает, что Иеровоам своими действиями привёл Израиль ко греху.'
    reason: Сноска сохраняет возможное отнесение относительного предложения к Иеровоаму и устраняет формальную русскую двусмысленность, при которой «который» могло бы относиться к Навату.
lexical_decisions:
- source_word: רַק
  choice: Но
  rationale: Частица вводит ограничение к предшествующей положительной оценке царя; в современном русском повествовании противительное «но» естественно передаёт эту оговорку.
- source_word: בְּחַטֹּאות ... דָּבֵק
  choice: держался грехов
  rationale: Сочетание דבק с предлогом ב выражает стойкую приверженность. «Держался грехов» сохраняет смысл упорного следования и звучит естественно по-русски.
- source_word: חַטֹּאות
  choice: грехов
  rationale: Сохраняет прямую нравственно-религиозную оценку еврейского текста, не сужая значение до отдельных обрядовых практик.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён и естественная русская передача патронима.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: которыми тот ввёл Израиль в грех
  rationale: Каузативная форма глагола חטא означает, что действия Иеровоама привели Израиль ко греху. Указательное «тот» устраняет возможную неясность относительно деятеля, а множественное «которыми» связывает придаточное с «грехами».
- source_word: לֹא סָר מִמֶּנָּה
  choice: не отступал от них
  rationale: Русское «не отступал от них» естественно передаёт устойчивое продолжение прежнего пути; множественное число согласует местоимение со смысловым антецедентом «грехи», хотя еврейский суффикс формально женского рода единственного числа.
theological_decisions:
- issue: Формула оценки царского отступничества
  choice: Сохранить прямые слова «грехов» и «ввёл Израиль в грех».
  alternative: 'Передать нейтральнее: «обычаев», «заблуждений» или «дурных дел».'
  rationale: Еврейский текст даёт явную богословско-нравственную оценку модели Иеровоама; смягчение до нейтральных обозначений ослабило бы авторское суждение.
- issue: Отнесение придаточного אֲשֶׁר הֶחֱטִיא
  choice: Связать его с «грехами» как средством, которыми Иеровоам ввёл Израиль в грех.
  alternative: 'Передать как отдельную характеристику Иеровоама: «который ввёл Израиль в грех».'
  rationale: Обе синтаксические связи возможны по смыслу, однако ближайший антецедент — «грехи»; выбранный вариант сохраняет эту связь, а сноска отмечает допустимую альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю, сохраняет лаконичность оценочной формулы и не вводит конфессионально специфической терминологии.
