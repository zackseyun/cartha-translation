  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: ru
  text: Они разрушили города, и на каждый хороший участок земли каждый бросил свой камень и засыпали его[a]. Они завалили все источники воды и повалили все хорошие деревья[b], так что в Кир-Харесете[c] остались лишь камни города; тогда пращники окружили его и нападали на него[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждое хорошее поле». Еврейское слово может обозначать участок, надел или поле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все хорошие деревья»; возможно, имеются в виду ценные или плодоносящие деревья.'
    reason: lexical_alternative
  - marker: c
    text: Кир-Харесет — название города в Моаве; в этом повествовании он, по-видимому, остаётся последним неразрушенным городом.
    reason: cultural_note
  - marker: d
    text: 'Буквально: «поражали его» или «наносили ему удары»; здесь глагол обозначает военное нападение на город.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: Они разрушили города
  rationale: הרס обозначает разрушение, снос построек; «разрушили» естественно передаёт завершённое действие в русском повествовании.
- source_word: חֶלְקָה טוֹבָה
  choice: хороший участок земли
  rationale: חֶלְקָה — выделенный участок или надел. Буквальное «хороший» сохраняет широту выражения и не ограничивает его исключительно полем.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: бросали камни — каждый по камню, — пока не засыпали его
  rationale: Сохранена распределительная конструкция «каждый — свой камень» и выражен результат многократного бросания; дополнение «камнями» ясно из ближайшего контекста.
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: завалили все источники воды
  rationale: סתם означает перекрыть или закупорить. «Завалили» естественно сочетается с намеренным выведением источников из строя в военном контексте.
- source_word: עֵץ טוֹב יַפִּילוּ
  choice: повалили все хорошие деревья
  rationale: Сохранено буквальное «хорошие деревья», поскольку текст прямо не уточняет, были ли они плодовыми; Hiphil נפל передан как «повалили».
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: В конце концов лишь в Кир-Харесете остались его камни
  rationale: Передан итог разрушения при сохранении не вполне прозрачной связи местоименного суффикса «его/её» с местом. «Лишь» отражает ограничительное значение контекста, а не устраняет синтаксическую трудность оригинала.
- source_word: וַיָּסֹבּוּ הַקַּלָּעִים וַיַּכּוּהָ
  choice: тогда пращники окружили город и стали поражать его
  rationale: סבב передаёт окружение или обход кругом, а נכה буквально означает наносить удары, поражать. Добавленное «город» проясняет референт женского суффикса без изменения смысла.
