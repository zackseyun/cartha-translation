  source_fidelity: 'В целом переданы основные действия: разрушение городов, забрасывание участков камнями, перекрытие источников, валка деревьев и нападение пращников. Однако «В конце концов» не передаёт ограничительно-результативного עַד («до тех пор, пока / пока не»), а фраза «лишь в Кир-Харесете остались его камни» оставляет неестественную и неясную русскую связь местоимения «его». «Стали поражать» добавляет начинательность, отсутствующую в וַיַּכּוּהָ.'
  naturalness: Текст в основном современный и понятный. «Каждый по камню» удачно выражает распределительность, но лучше согласовать его с последующим коллективным действием. «Хорошие деревья» допустимо как буквальное чтение, хотя несколько необычно; примечание своевременно поясняет смысл. Переработка заключительной фразы делает её естественной, не снимая синтаксической трудности еврейского текста.
  terminology: '«Кир-Харесет» и «пращники» удачны. «Источники воды» и «завалили» приемлемо передают מַעְיַן מַיִם и סתם в данном военном контексте. Примечание c не должно утверждать как установленный факт, что это именно укреплённый город и главная крепость: это историческое объяснение вероятностно и может быть выражено осторожнее.'
