revisions:
- from: Они разрушили города и на каждый хороший участок земли бросали камни — каждый по камню, — пока не засыпали его[a]. Они завалили все источники воды и повалили все хорошие деревья[b]. В конце концов лишь в Кир-Харесете[c] остались его камни; тогда пращники окружили город и стали поражать его[d].
