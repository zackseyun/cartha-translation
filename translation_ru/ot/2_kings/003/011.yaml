  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: ru
  text: 'Иосафат сказал: «Нет ли здесь пророка Яхве, чтобы нам через него вопросить Яхве[a]?» Тогда один из слуг царя Израиля ответил: «Здесь Елисей, сын Сафата, который лил воду на руки Илии[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и взыщем Яхве от него». Смысл выражения — обратиться к Яхве за ответом через пророка.'
    reason: lexical_alternative
  - marker: b
    text: 'Вероятно, речь идёт о личном служении Елисея Илии: он подавал воду для омовения рук. В переводе сохранён образ исходного текста.'
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: Нет ли
  rationale: Естественная русская форма вопроса с отрицанием, сохраняющая побудительный оттенок поиска пророка.
- source_word: נָבִיא לַיהוָה
  choice: пророк Яхве
  rationale: Передаёт принадлежность пророка Яхве и его служение от имени Яхве без добавочного толкования.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: чтобы нам через него вопросить Яхве
  rationale: Глагол דרש передан как обращение за ответом, а מֵאֹתוֹ — как указание на пророка-посредника; несколько возвышенное «вопросить» уместно в литературном библейском повествовании.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: один из слуг царя Израиля
  rationale: В придворном контексте עֶבֶד означает царского слугу или приближённого; «слуг» сохраняет широту исходного слова.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: который лил воду на руки Илии
  rationale: Сохранён конкретный еврейский образ личного служения, без замены его общим толкованием «был помощником».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как собственное имя; «Яхве» сохраняет различие между именем Бога и титулом.
- issue: Роль пророка в обращении к Яхве
  choice: через него вопросить Яхве
  alternative: спросить у него о Яхве
  rationale: Формулировка сохраняет Яхве как Того, к Кому обращаются, а пророка — как посредника при вопрошании, не представляя пророка самостоятельным источником ответа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «вопросить Яхве». Традиционные русские формы имён сохранены. Еврейская формула «ответил и сказал» естественно сокращена до «ответил», а образ служения Елисея передан буквально.
