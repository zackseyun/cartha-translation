base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: ru
  text: 'И сказали: «Это кровь! Цари наверняка перебили друг друга[a]; каждый поразил своего товарища. А теперь, Моав[b], — за добычей!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Цари совершенно уничтожены». Еврейская конструкция усиливает значение глагола «быть разорённым, уничтоженным»; однако из следующей фразы и контекста следует, что моавитяне решили, будто союзные цари перебили друг друга.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Моавитяне, за добычей!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: Это кровь!
  rationale: Безглагольное восклицание передано естественно по-русски с сохранением указательного значения זֶה.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: совершенно разгромлены
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня выражает усиление. Пассивная формулировка сохраняет форму и некоторую неоднозначность еврейского текста, а дальнейшая фраза поясняет взаимное поражение.
- source_word: הַמְּלָכִים
  choice: цари
  rationale: Определённое множественное число относится к ранее упомянутым правителям союзных царств; в русском контексте дополнительное указательное слово не требуется.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: они поразили друг друга
  rationale: Идиома אִישׁ אֶת־רֵעֵהוּ обозначает взаимное действие; «поразили друг друга» естественно передаёт её в военном контексте.
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт резкий переход от вывода моавитян к призыву действовать.
- source_word: לַשָּׁלָל
  choice: за добычей
  rationale: Краткий боевой призыв, естественно выражающий направленность движения к захвату добычи.
- source_word: מוֹאָב
  choice: Моав
  rationale: Название народа и страны сохранено как прямое собирательное обращение, как в еврейском тексте.
