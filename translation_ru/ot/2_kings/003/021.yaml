base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: ru
  text: Весь Моав услышал, что цари выступили, чтобы сразиться с ними, и были созваны все — начиная с тех, кто мог опоясаться поясом[a]. Они стали на границе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от всякого, опоясывающегося поясом, и выше». Вероятно, это идиома о мужчинах, достигших возраста, пригодного для военного сбора, и старше.'
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: Весь Моав
  rationale: Сохраняет собирательное употребление названия народа; начальный ו передан естественным продолжением повествования без добавления отдельного временного маркера.
- source_word: שָׁמְעוּ
  choice: услышал
  rationale: Согласование по форме с собирательным названием «Моав»; глагол прямо передаёт получение вести.
- source_word: כִּי עָלוּ הַמְּלָכִים לְהִלָּחֶם בָּם
  choice: что цари выступили, чтобы сразиться с ним
  rationale: Военное «выступили» естественно передаёт контекстуальный смысл עלה; местоимение относится к собирательному «Моав».
- source_word: וַיִּצָּעֲקוּ
  choice: были созваны
  rationale: В контексте вторжения глагол обозначает сбор или мобилизацию, а не просто крик; пассивная формулировка сохраняет вероятную направленность действия.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: все — от способного опоясаться поясом и старше
  rationale: Сохраняет конкретный образ древнееврейской идиомы и выраженную ею нижнюю возрастную границу, не заменяя её истолкованием «способные носить оружие».
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: Они заняли позиции на границе
  rationale: Передаёт военный оттенок עמד על естественным современным русским выражением.
