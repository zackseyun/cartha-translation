    rationale: Еврейское בָּם имеет множественное число и в контексте обозначает народ Моава. Русское «с ними» точнее сохраняет эту референцию.
  - severity: medium
    issue: Неестественное оформление возрастной идиомы
    rationale: «От способного опоясаться поясом и старше» грамматически тяжеловесно и создаёт неясную конструкцию. «Начиная с тех, кто мог опоясаться поясом» сохраняет образ и смысл нижнего порога.
