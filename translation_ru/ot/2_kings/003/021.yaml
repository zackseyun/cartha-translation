review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Моав получает известие о выступлении царей, проводится общий сбор, после чего собравшиеся занимают место у границы. Однако местоимение «с ним» сглаживает множественное בָּם, относящееся к моавитянам, а формула «от способного опоясаться поясом и старше» недостаточно естественна по-русски. Выражение «начиная с тех, кто мог опоясаться поясом» передаёт нижнюю границу идиомы без неоправданного уточнения «призывного возраста».'
  naturalness: «Весь Моав» уместно как собирательное название народа. «Были созваны все» естественно передаёт пассивную форму в данном контексте. Переработка идиомы делает фразу читабельной в современном литературном русском; «стали на границе» ближе к прямому значению еврейского глагола, чем «заняли позиции».
  terminology: 'Топоним «Моав» сохранён. Военная окраска «выступили, чтобы сразиться» оправданна контекстом и не усиливает исходный текст. Пояснение к идиоме следует формулировать осторожно: её обычно связывают с возрастом, пригодным для военного сбора, но это вывод из контекста, а не буквальное значение слов.'
