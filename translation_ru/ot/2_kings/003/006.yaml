  text: וַ/יֵּצֵ֞א הַ/מֶּ֧לֶךְ יְהוֹרָ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא מִ/שֹּׁמְר֑וֹן וַ/יִּפְקֹ֖ד אֶת כָּל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/006.yaml
  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: ru
  text: В тот день царь Иорам вышел из Самарии и собрал всё израильское войско[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь Израиль». Еврейский глагол может означать подсчёт, смотр или сбор войска; здесь военный контекст указывает на сбор израильских сил.'
    reason: лексическая альтернатива и пояснение буквального выражения
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Обычное повествовательное значение יצא — «выйти, отправиться». «Вышел» сохраняет прямой смысл и не добавляет военного оттенка сверх контекста.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: царь Иорам
  rationale: Естественная русская передача сочетания титула и личного имени.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Точно и естественно передаёт временное указание.
- source_word: מִשֹּׁמְרוֹן
  choice: из Самарии
  rationale: Предлог מן обозначает исходную точку движения; по-русски здесь естественно «из Самарии».
- source_word: וַיִּפְקֹד
  choice: собрал
  rationale: В данном военном контексте פקד означает провести смотр, учёт или сбор сил. «Собрал» понятно современному читателю и вместе с дополнением «войско» передаёт военную мобилизацию, не утверждая, что речь шла только о подсчёте.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: всё израильское войско
  rationale: Буквально — «весь Израиль», но в контексте похода выражение относится к силам северного царства. Передача через «израильское войско» устраняет возможное ошибочное представление, будто были собраны все жители, а слово «всё» сохраняет всеохватность исходного выражения.
