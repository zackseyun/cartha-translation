  text: וְ/נָקַ֥ל זֹ֖את בְּ/עֵינֵ֣י יְהוָ֑ה וְ/נָתַ֥ן אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: ru
  text: И для Яхве это легко; Он также предаст Моав в ваши руки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И это — малое дело для Яхве».'
    reason: Лексема וְנָקַל может выражать как лёгкость исполнения, так и незначительность чего-либо.
lexical_decisions:
- source_word: וְנָקַל
  choice: И это — малое
  rationale: Стативное значение передаёт оценку как чего-то незначительного или лёгкого. Формулировка «это — малое» сохраняет образ малого веса и звучит достойно по-русски; союз וְ передан как «И».
- source_word: זֹאת
  choice: это
  rationale: Указательное местоимение отсылает к только что обещанному дарованию воды.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: 'Сохранён понятный в русском языке древнееврейский образ оценки: нечто является малым «в глазах» кого-либо.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: וְנָתַן
  choice: Он также предаст
  rationale: Перфект в пророческой речи имеет здесь будущее значение. «Также» выражает присоединение ещё одного Божьего действия к обещанному чуду с водой, а «предаст» естественно сочетается с библейской идиомой передачи врага в чью-либо власть.
- source_word: אֶת מוֹאָב
  choice: Моав
  rationale: Сохранено название страны и народа как собирательного объекта действия, без замены на «моавитян».
- source_word: בְּיֶדְכֶם
  choice: в ваши руки
  rationale: Русская библейская идиома «предать в руки» ясно передаёт смысл передачи под власть адресатов; множественное «руки» естественно при обращении к нескольким людям.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Соотношение обещания воды и победы над Моавом
  choice: «также предаст» как дополнительное обещание
  alternative: «и предаст» без явного указания на добавочность
  rationale: Контекст и присоединительное וְ позволяют выразить второе деяние как добавочное, не утверждая иной причинной или временной связи.
translation_notes:
  register: Современный литературный русский язык с умеренно сохранённой библейской образностью. Конструкция «малое в глазах» удерживает метафору оригинала, а «предаст … в ваши руки» передаёт традиционную семитскую идиому естественным русским выражением.
