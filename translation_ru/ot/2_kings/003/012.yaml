base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: ru
  text: 'Иосафат сказал[a]: «У него есть слово от Яхве». И царь Израиля, Иосафат и царь Эдома спустились к нему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «У него есть слово Яхве».'
    reason: Сохраняет формальную связь «слово Яхве» в еврейском выражении דְּבַר־יְהוָה, тогда как основной текст естественно выражает его пророческий смысл по-русски.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычный повествовательный глагол אמר в форме wayyiqtol; вводит прямую речь.
- source_word: יֵשׁ אוֹתוֹ דְּבַר יְהוָה
  choice: с ним слово Яхве
  rationale: Экзистенциальная конструкция יֵשׁ с אֹתוֹ может выражать наличие или обладание. Формулировка сохраняет образ присутствующего у пророка Божьего слова и естественную для русского библейского стиля двусмысленность между «с ним» и «у него есть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена титулом.
- source_word: וַיֵּרְדוּ
  choice: спустились
  rationale: Сохраняет направительное и, возможно, топографическое значение корня ירד.
- source_word: אֵלָיו
  choice: к нему
  rationale: Естественно передаёт направление движения к Елисею.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямая и привычная передача титула и географического имени.
- source_word: וִיהוֹשָׁפָט
  choice: Иосафат
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: и царь Эдома
  rationale: Сохраняет координацию и формальный титул оригинала.
theological_decisions:
- issue: Связь выражения דְּבַר יְהוָה с Елисеем
  choice: «С ним слово Яхве» — у Елисея доступно подлинное пророческое откровение Яхве.
  alternative: «У него есть слово от Яхве».
  rationale: Еврейская конструкция допускает как оттенок присутствия слова при пророке, так и обладание полученным от Бога посланием; основной текст и сноска сохраняют оба оттенка, не устраняя напряжения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис перечисления сохранён близко к еврейскому; двусмысленность конструкции о слове Яхве вынесена в сноску.
