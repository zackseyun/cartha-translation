source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֵי זֶ֥ה הַ/דֶּ֖רֶךְ נַעֲלֶ֑ה וַ/יֹּ֕אמֶר דֶּ֖רֶךְ מִדְבַּ֥ר אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: ru
  text: 'Он спросил: «Какой дорогой нам идти?» Тот ответил: «Дорогой через пустыню Эдома[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Путём по пустыне Эдома».'
    reason: Слово דֶּרֶךְ допускает значения «дорога», «путь» и обозначение маршрута; связь с «пустыней Эдома» можно передать как движение через неё или по ней.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он спросил / Тот ответил
  rationale: Форма глагола אמר буквально означает «сказал», но в данном диалоге вопрос и последующий ответ естественно передаются по-русски как «спросил» и «ответил». Местоимения сохраняют неназванность участников в самом стихе, а «тот» ясно показывает смену говорящего.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Какой дорогой
  rationale: Сочетание אֵי זֶה с существительным דֶּרֶךְ идиоматически обозначает выбор пути; «какой дорогой» точно и естественно передаёт вопрос.
- source_word: נַעֲלֶה
  choice: нам идти
  rationale: Глагол עלה буквально может означать «подниматься» или «идти вверх», а в контексте похода — «выступать, идти». Нейтральное «идти» не создаёт в русском тексте неуместного акцента на физическом подъёме и не добавляет прямо не выраженной военной характеристики.
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: Дорогой через пустыню Эдома
  rationale: Безглагольный ответ называет маршрут. «Дорогой через» естественно передаёт דֶּרֶךְ и подразумеваемое движение через область, а «пустыня Эдома» сохраняет конструкцию принадлежности исходного текста.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Устоявшаяся русская передача географического названия.
theological_decisions: []
