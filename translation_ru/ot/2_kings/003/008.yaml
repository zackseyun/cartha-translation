  source_fidelity: 'Текст точно передаёт вопрос о выборе маршрута и ответ: идти следует через/по пустыне Эдома. «Нам идти» естественно передаёт cohortative נַעֲלֶה в походном контексте, не навязывая буквального значения физического подъёма. Передача двух форм «сказал» как «спросил» и «ответил» оправдана непосредственной структурой диалога.'
