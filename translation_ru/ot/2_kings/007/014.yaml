lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Тогда взяли
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; «тогда» естественно передаёт переход к следующему действию.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: две колесницы с конями
  rationale: Еврейское выражение сжато и несколько эллиптично; перевод сохраняет конкретный образ двух колесниц, запряжённых конями, не превращая вероятное значение в развёрнутый пересказ.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: и царь послал их
  rationale: Местоимение «их» естественно восполняет подразумеваемый объект — людей на только что выбранных колесницах — и обеспечивает ясность по-русски.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: вслед за станом Арама
  rationale: אַחֲרֵי передаёт направление следования, а מַחֲנֶה — военный стан; «стан» сохраняет военный и повествовательный колорит.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено древнее название царства; «Сирия» могло бы привнести более поздние географические ассоциации.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Стандартно вводит прямую речь и сохраняет структуру еврейской фразы.
- source_word: לְכוּ וּרְאוּ
  choice: Поезжайте и посмотрите
  rationale: В контексте отправки колесниц русское «поезжайте» естественнее общего «идите»; «посмотрите» сохраняет простоту и краткость приказа.
