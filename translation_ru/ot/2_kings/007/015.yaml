  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: ru
  text: И пошли они вслед за ними до самого Иордана. И вот, вся дорога была усеяна одеждой и снаряжением[a], которые арамеи побросали в спешке. Посланцы[b] возвратились и доложили царю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вещами», «принадлежностями». Еврейское слово имеет широкое значение и может обозначать различные предметы, утварь или снаряжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вестники» или «посланники»; здесь — люди, отправленные проверить, что произошло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: И пошли они вслед за ними
  rationale: Сохраняет последовательность повествования и прямое значение следования за бегущими, не усиливая его до явной погони.
- source_word: עַד הַיַּרְדֵּן
  choice: до самого Иордана
  rationale: Передаёт предел движения, обозначенный עַד; частица «самого» естественно подчёркивает достигнутую границу.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Естественный русский повествовательный маркер, передающий внезапное предъявление увиденного.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: вся дорога была усеяна
  rationale: Контекстуально и образно передаёт дорогу, повсюду покрытую брошенными предметами; буквальное «полна» по-русски звучало бы менее естественно.
- source_word: בְגָדִים
  choice: одеждой
  rationale: Современное и широкое обозначение оставленных предметов одежды без излишне высокого оттенка.
- source_word: וְכֵלִים
  choice: и снаряжением
  rationale: Широкое כֵּלִים в контексте бегущего войска естественно обозначает снаряжение, хотя может охватывать также вещи и принадлежности.
- source_word: אֲרָם
  choice: арамеи
  rationale: Название народа употреблено в еврейском как собирательный субъект при глаголе во множественном числе; русское «арамеи» ясно и естественно выражает этот смысл.
- source_word: בְחָפְזָם
  choice: в спешке
  rationale: Прямо передаёт поспешность, не добавляя более сильного смысла паники.
- source_word: הַמַּלְאָכִים
  choice: Посланные
  rationale: Передаёт людей, которых царь отправил проверить обстановку; не отождествляет их однозначно с разведчиками и избегает возможной в русском двусмысленности слова «посланники».
- source_word: וַיַּגִּדוּ לַמֶּלֶךְ
  choice: и доложили царю
  rationale: В данном официальном контексте «доложили» естественно передаёт сообщение царю о результатах поручения.
