  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: ru
  text: 'И встал царь ночью и сказал своим слугам: «Позвольте мне сказать вам, что сделали с нами арамеи[a]. Они знают, что мы голодны, и потому вышли из стана, чтобы спрятаться в поле, говоря: „Когда те выйдут из города, мы захватим их живыми и войдём в город“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Арам». Название страны или народа здесь обозначает арамеев либо их войско.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Обычное повествовательное употребление קום; ночью контекст естественно подразумевает, что царь поднялся с постели или отдыха.
- source_word: לַיְלָה
  choice: ночью
  rationale: Естественная русская передача обстоятельства времени без утраты ночной обстановки.
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: Широкое и прозрачное обозначение царских слуг или придворных; контекст не требует более узкого «сановникам».
- source_word: אַגִּידָה נָּא לָכֶם
  choice: Позвольте, я скажу вам
  rationale: Передаёт побудительно-волевое значение когортатива и смягчающую частицу נָא естественной современной русской формой.
- source_word: אֵת אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: что сделали с нами арамеи
  rationale: Название אֲרָם метонимически обозначает арамейский народ или войско; во множественном числе по-русски ясно выражен действующий субъект.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: Они знают, что мы голодны
  rationale: В прямой речи царь описывает актуальное знание противника; настоящее время звучит естественно.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: вышли из стана
  rationale: Совершенный вид передаёт завершённое, по предположению царя, действие; «стан» сохраняет военный и библейский регистр, оставаясь понятным.
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: чтобы спрятаться в поле
  rationale: Передаёт цель и возвратный смысл формы חבא; «в поле» близко к форме исходного текста и подходит сцене засады.
- source_word: לֵאמֹר
  choice: Они рассуждают так
  rationale: В данном контексте вводит приписываемый противнику замысел, а не обязательно произнесённые вслух слова; формулировка делает переход к цитате естественным.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: Когда те выйдут из города
  rationale: כִּי здесь естественно понимать как ожидаемое условие или время исполнения засады; «те» ясно указывает на жителей города, не добавляя конкретизации.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: мы захватим их живыми
  rationale: Точно передаёт внезапный захват и предикативное חַיִּים — «живыми».
- source_word: וְאֶל הָעִיר נָבֹא
  choice: и войдём в город
  rationale: Сохраняет координацию и направление действия; повтор местоимения «мы» в русском не требуется.
