  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: ru
  text: 'И случилось с ним именно так[a]: народ затоптал его в воротах[b], и он умер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И было ему так»; то есть всё произошло с ним именно так, как было предсказано.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «у ворот» или «в воротном проходе». Еврейское слово может обозначать как городские ворота, так и весь воротный комплекс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: И случилось с ним именно так
  rationale: Еврейский оборот указывает, что с ним произошло именно то, что было предсказано. Эта формулировка естественна по-русски и не добавляет явного богословского пояснения.
- source_word: וַיִּרְמְסוּ
  choice: затоптал
  rationale: Глагол רמס означает попирать, топтать ногами. В данном контексте совершенный вид «затоптал» прямо передаёт приведшее к смерти действие множества людей.
- source_word: הָעָם
  choice: народ
  rationale: Обычное значение עַם — «народ». Хотя по контексту речь идёт о людской толпе, перевод «народ» точнее сохраняет лексику исходного текста.
- source_word: בַּשַּׁעַר
  choice: в воротах
  rationale: שַׁעַר может обозначать городские ворота либо весь воротный проход и прилегающий комплекс. «В воротах» сохраняет пространственную неоднозначность и естественно звучит в повествовании.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Простая последовательная глагольная форма передана прямо; причинная связь с тем, что его затоптали, ясна из контекста и не требует добавления «от этого».
theological_decisions:
- issue: Исполнение предсказанного суда
  choice: Повествовательная формулировка показывает, что судьба сановника в точности соответствовала ранее сказанному.
  alternative: «Так совершился над ним суд» — более истолковательный вариант, явно называющий событие судом.
  rationale: Контекст связывает смерть сановника с пророческим словом Елисея, однако сам стих лишь сообщает о случившемся. Перевод сохраняет эту повествовательную форму и не вносит дополнительного богословского объяснения.
translation_notes:
  register: Современный литературный русский язык; изложение краткое, повествовательное и торжественно-сдержанное. «Затоптал» согласовано с собирательным существительным «народ».
