  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: ru
  text: И они поднялись и бежали в сумерках[a], оставив свои шатры, коней и ослов — стан, как он был[b], — и бежали, спасая свою жизнь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать вечерние или предрассветные сумерки.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стан, как он был», то есть они оставили его в прежнем состоянии.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «бежали к своей жизни» — оборот со значением бегства ради спасения жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקוּמוּ
  choice: они поднялись
  rationale: Передаёт начало поспешного действия и сохраняет повествовательную последовательность еврейского текста.
- source_word: וַיָּנֻסוּ ... וַיָּנֻסוּ
  choice: бежали ... бежали
  rationale: Повтор одного и того же глагола сохранён ради присущего оригиналу напряжения и настойчивости.
- source_word: בַנֶּשֶׁף
  choice: в сумерках
  rationale: Слово נֶשֶׁף обозначает сумеречное время; русский вариант естественен и не уточняет без необходимости, были ли это вечерние или предрассветные сумерки.
- source_word: וַיַּעַזְבוּ
  choice: оставив
  rationale: В контексте поспешного бегства глагол означает, что имущество было брошено; нейтральное «оставив» точно передаёт действие без усиления.
- source_word: אָהֳלֵיהֶם
  choice: свои шатры
  rationale: Обычное обозначение жилищ в военном стане; возвратное местоимение естественно передаёт принадлежность при русском подлежащем.
- source_word: סוּסֵיהֶם
  choice: коней
  rationale: Прямой современный русский эквивалент; форма «коней» естественна в данном повествовательном контексте.
- source_word: חֲמֹרֵיהֶם
  choice: ослов
  rationale: Прямой и понятный современному читателю эквивалент названия вьючных животных.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: стан остался таким, как был
  rationale: Передаёт мысль о том, что стан был оставлен в прежнем состоянии. Отдельная русская клауза делает сжатую еврейскую конструкцию ясной, не добавляя идеи сохранности сверх текста.
- source_word: וַיָּנֻסוּ אֶל־נַפְשָׁם
  choice: бежали, спасая свою жизнь
  rationale: Естественно передаёт еврейский оборот о бегстве ради сохранения жизни, сохраняя единственное число распределительного выражения.
