lexical_decisions:
- source_word: וַיִּקְרָא
  choice: крикнули
  rationale: Форма единственного числа стоит перед собирательным подлежащим «привратники»; по-русски естественно согласование во множественном числе. Глагол передаёт громкий возглас, которым сообщают новость.
- source_word: הַשֹּׁעֲרִים
  choice: привратники
  rationale: Прямое и понятное обозначение людей, находившихся при воротах; слово не уточняется до «стражников», поскольку исходный термин прежде всего называет их по службе у ворот.
- source_word: וַיַּגִּידוּ
  choice: передали весть
  rationale: Глагол означает «сообщить, дать знать». Дополнение подразумевается контекстом; выражение «передали весть» естественно описывает дальнейшую передачу обнаруженной информации.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царского дома
  rationale: Сохраняет буквальное выражение «дом царя», не сводя его однозначно ни к зданию дворца, ни к царскому двору или домочадцам.
- source_word: פְּנִימָה
  choice: внутрь
  rationale: Наречие выражает направленность внутрь; русский вариант сохраняет это пространственное или организационное движение сообщения.
