base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: ru
  text: Тогда народ вышел и разграбил лагерь Арама. Одна сеа[a] тонкой муки стоила один шекель[b], а две сеа ячменя — один шекель, по слову Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сеа — древняя мера объёма сыпучих тел.
    reason: cultural_note
  - marker: b
    text: Шекель — древняя мера веса, использовавшаяся также при расчётах как денежная единица.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: Тогда народ вышел
  rationale: Последовательная форма глагола продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: וַיָּבֹזּוּ
  choice: разграбил
  rationale: Глагол обозначает захват добычи во вражеском лагере; «разграбил» ясно передаёт военный контекст.
- source_word: מַחֲנֵה אֲרָם
  choice: лагерь Арама
  rationale: Сохранена конструкция «лагерь Арама» и древнее название Арам, без подмены его более поздним географическим названием «Сирия».
- source_word: וַיְהִי
  choice: стала продаваться
  rationale: В формуле цены глагол описывает установившуюся рыночную стоимость; добавление «продаваться» делает смысл естественным по-русски.
- source_word: סְאָה / סָאתַיִם
  choice: сеа / две сеа
  rationale: Сохранено название конкретной древней меры сыпучих тел; двойственное число передано как «две сеа».
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Слово обозначает высококачественную тонкую муку, а не муку вообще.
- source_word: בְּשֶׁקֶל
  choice: за один шекель
  rationale: Русская конструкция с «за» естественно выражает цену; древняя денежно-весовая единица сохранена.
- source_word: שְׂעֹרִים
  choice: ячмень
  rationale: В контексте торговли форма множественного числа называет товар и естественно передаётся русским собирательным единственным числом.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Формулировка близко передаёт исполнение ранее возвещённого слова и сохраняет личное имя Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер исполнения пророческого слова
  choice: по слову Яхве
  alternative: как сказал Яхве
  rationale: Более буквальная формулировка сохраняет существительное דְבַר («слово») и подчёркивает соответствие события ранее данному слову, не сужая его до одной речевой формулы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис следует последовательности еврейского повествования, но формула цены передана естественно для русского читателя. Все древние реалии сохранены и кратко пояснены в сносках.
