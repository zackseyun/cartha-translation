revisions:
- from: Тогда народ вышел и разграбил лагерь Арама. И сеа[a] лучшей муки стала продаваться за один шекель[b], а две сеа ячменя — за один шекель, по слову Яхве.
  to: Тогда народ вышел и разграбил лагерь Арама. Одна сеа[a] тонкой муки стоила один шекель[b], а две сеа ячменя — один шекель, по слову Яхве.
  rationale: Заменено «лучшей муки» на «тонкой муки» для более точной передачи סֹלֶת. Ценовая формула переработана в естественную русскую конструкцию «стоила один шекель», при этом сохранены количество, единицы измерения, параллельная структура и связь события со словом Яхве.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:05:42Z'
