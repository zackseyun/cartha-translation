id: 2KI.7.1
reference: 2 Kings 7:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: ru
  text: 'Тогда Елисей сказал: «Слушайте слово Яхве! Так говорит Яхве: завтра примерно в это же время у ворот Самарии сеа[a] тонкой муки будет стоить один шекель[b], а две сеа ячменя — один шекель».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сеа — древняя мера сыпучих тел, приблизительно 7–8 литров.
    reason: cultural_note
  - marker: b
    text: Шекель здесь — весовая денежная единица, приблизительно 11 граммов серебра.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Повелительная форма множественного числа; современное русское «слушайте» сохраняет торжественный призыв и звучит естественнее буквального «услышьте».
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт личное имя יהוה транслитерацией.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Устойчивая формула посланнической речи, сохранённая в ясном и торжественном русском выражении.
- source_word: כָּעֵת מָחָר
  choice: завтра примерно в это же время
  rationale: Передаёт приблизительность, выраженную כ, и естественный смысл временного оборота.
- source_word: סְאָה / סָאתַיִם
  choice: сеа / две сеа
  rationale: Сохранена конкретная древняя мера сыпучих тел, а двойственное число передано как «две сеа».
- source_word: סֹלֶת
  choice: тонкая мука
  rationale: Термин обозначает муку тонкого помола, а не муку вообще.
- source_word: בְּשֶׁקֶל
  choice: будет стоить один шекель / один шекель
  rationale: В контексте рыночных цен предлог указывает стоимость; добавление «будет стоить» делает русский синтаксис ясным, а во второй части используется естественный эллипсис.
- source_word: שְׂעֹרִים
  choice: ячмень
  rationale: Обычное точное соответствие названию зерновой культуры.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: у ворот Самарии
  rationale: Городские ворота были местом торговли и общественной жизни; «у ворот» естественно обозначает это место по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; «Яхве» прямо сохраняет его в транслитерации, не заменяя титулом.
translation_notes:
  register: Современный литературный русский с торжественной интонацией пророческой речи. Конкретные древние меры сохранены и пояснены; синтаксис сделан естественным без устранения приблизительности временного выражения.
