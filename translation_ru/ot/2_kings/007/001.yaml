  source_fidelity: 'Перевод точно передаёт последовательное повествовательное «тогда сказал», множественный призыв «слушайте», обе пророческие формулы с именем יהוה, приблизительное временное указание כָּעֵת מָחָר, цены и количества: одна сеа тонкой муки за шекель и две сеа ячменя за шекель. «У ворот Самарии» корректно передаёт место рыночной сделки.'
  naturalness: Текст звучит естественно на современном литературном русском и сохраняет уместную торжественность пророческого возвещения. Эллипсис во второй части («две сеа ячменя — один шекель») ясен и стилистически удачен.
