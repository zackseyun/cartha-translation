  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: ru
  text: И в сумерках они поднялись, чтобы пойти к арамейскому стану. Они пришли к краю арамейского стана — и вот, там никого не было.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: И … они поднялись
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; «поднялись» естественно передаёт קום в данном контексте.
- source_word: בַנֶּ֔שֶׁף
  choice: в сумерках
  rationale: נֶשֶׁף здесь обозначает сумеречное время; по контексту вероятен вечер, но слово само по себе допускает сумерки вообще, поэтому двусмысленность сохранена.
- source_word: לָב֖וֹא אֶל
  choice: чтобы пойти к
  rationale: Инфинитив выражает цель. Русское «пойти к» естественно передаёт направленное движение к стану.
- source_word: מַחֲנֵ֣ה אֲרָם
  choice: арамейский стан
  rationale: Конструкция «стан Арама» означает стан арамеев; прилагательное «арамейский» является ясным и привычным русским соответствием без изменения референта.
- source_word: וַיָּבֹ֗אוּ עַד קְצֵה֙
  choice: Подойдя к краю
  rationale: Оборот естественно выражает достижение внешней границы стана и сохраняет последовательность действий.
- source_word: וְהִנֵּ֥ה
  choice: 'они увидели:'
  rationale: הִנֵּה вводит внезапно обнаружившуюся картину. В современном русском повествовании конструкция «они увидели:» передаёт этот эффект естественнее буквального «вот».
- source_word: אֵֽין שָׁ֖ם אִֽישׁ
  choice: там никого нет
  rationale: Хотя אִישׁ имеет форму мужского рода и буквально значит «человек/мужчина», в отрицательной конструкции выражение идиоматически означает отсутствие какого-либо человека; «никого нет» точно и естественно передаёт смысл.
theological_decisions:
- issue: Мужской род единственного числа אִישׁ при общем значении отсутствия людей
  choice: там никого нет
  alternative: там нет ни одного человека / там нет ни одного мужчины
  rationale: В этой отрицательной экзистенциальной конструкции אִישׁ употреблено обобщённо. Перевод «никого» не вводит гендерного утверждения, которого контекст не требует, и точно сохраняет смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком в слове «стан». Синтаксис сделан плавным и доступным; эффект внезапного обнаружения, выраженный וְהִנֵּה, сохранён посредством «они увидели:».
