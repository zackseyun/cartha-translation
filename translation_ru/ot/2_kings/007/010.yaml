base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: ru
  text: 'Они пришли, позвали городских привратников и сообщили им: «Мы пришли в стан арамеев, и вот: там никого нет и не слышно человеческого голоса[a]; только кони привязаны, и ослы привязаны, а шатры — как были».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не слышно ни звука, издаваемого человеком». Еврейское слово может означать и голос, и звук вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: городских привратников
  rationale: Хотя существительное в еврейском тексте стоит в единственном числе, последующие формы множественного числа указывают на собирательное значение — людей, несущих охрану у городских ворот.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: Те сообщили им
  rationale: Глагол נגד в породе хифиль означает «сообщить, рассказать». Русская конструкция естественно передаёт формулу введения прямой речи без ненужного буквального «сказав».
- source_word: מַחֲנֵה אֲרָם
  choice: стан арамеев
  rationale: Сохраняется древнее название Арам, а не позднейшая географическая замена «Сирия»; «стан» уместен для военного лагеря и соответствует библейскому регистру.
- source_word: וְהִנֵּה
  choice: и увидели
  rationale: Частица вводит внезапно открывшуюся картину. В составе прямой речи «увидели» естественно передаёт её дейктическую и зрительную силу, не прибегая к архаичному «вот».
- source_word: אֵין שָׁם אִישׁ
  choice: там никого нет
  rationale: אִישׁ здесь обозначает любого человека, а не специально мужчину; «никого» точно и естественно передаёт смысл.
- source_word: וְקוֹל אָדָם
  choice: не слышно человеческого голоса
  rationale: קוֹל может означать как голос, так и звук. Основной текст выбирает естественное русское «голоса», а более широкое значение отмечается в сноске.
- source_word: כִּי אִם
  choice: Только
  rationale: Оборот вводит единственное исключение из описанного отсутствия людей и человеческих звуков.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: кони и ослы стоят привязанные
  rationale: Названия животных в единственном числе имеют собирательное значение. אָסוּר означает «связанный, привязанный»; добавленное «стоят» делает русскую фразу естественной, не меняя картины.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: шатры оставлены как были
  rationale: Фраза подчёркивает, что шатры остались в прежнем состоянии. «Оставлены» ясно выражает подразумеваемый результат поспешного бегства, а «как были» сохраняет форму исходного выражения.
