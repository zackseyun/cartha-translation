  text: וַ/יְהִ֗י כְּ/דַבֵּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר סָאתַ֨יִם שְׂעֹרִ֜ים בְּ/שֶׁ֗קֶל וּֽ/סְאָה סֹ֨לֶת֙ בְּ/שֶׁ֔קֶל יִהְיֶה֙ כָּ/עֵ֣ת מָחָ֔ר בְּ/שַׁ֖עַר שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: ru
  text: 'И произошло именно так, как человек Божий сказал царю: «Завтра примерно в это же время у ворот Самарии[b] две саты[a] ячменя будут стоить один шекель, а одна сата тонкой муки — один шекель».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сата — древняя мера объёма сыпучих продуктов. В еврейском тексте прямо названы две саты ячменя и одна сата тонкой муки.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «в воротах Самарии». У городских ворот заключали сделки и вершили суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: И произошло именно так, как … сказал
  rationale: 'Передаёт повествовательное наступление события и значение соответствия, выраженное предлогом כְּ: всё произошло согласно ранее сказанному.'
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохраняет устойчивое древнееврейское наименование, не заменяя его толкованием «пророк».
- source_word: סָאתַיִם שְׂעֹרִים
  choice: две саты ячменя
  rationale: Двойственное число меры סאה и название зерна переданы прямо; древняя единица сохранена ради экономической конкретности высказывания.
- source_word: בְּשֶׁקֶל
  choice: за один шекель
  rationale: Предлог בְּ в формуле цены естественно передаётся русским «за»; слово «один» ясно выражает стоимость каждой указанной меры.
- source_word: וּסְאָה סֹלֶת
  choice: и одну сату муки тонкого помола
  rationale: Единственное число противопоставлено двум сатам ячменя, а סֹלֶת обозначает высококачественную мелкую муку, а не муку вообще.
- source_word: יִהְיֶה
  choice: будут продавать
  rationale: Глагол существования относится к названным рыночным ценам. По-русски такое эллиптическое ценовое высказывание естественно раскрывается через «будут продавать», без изменения смысла.
- source_word: כָּעֵת מָחָר
  choice: завтра примерно в это же время
  rationale: Сохраняет временную отнесённость к следующему дню и оттенок приблизительности сравнительной частицы כְּ.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: у ворот Самарии
  rationale: Естественное русское обозначение городских ворот как места торговли; буквальное «в воротах» пояснено в примечании.
