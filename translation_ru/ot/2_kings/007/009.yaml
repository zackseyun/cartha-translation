source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: ru
  text: 'Тогда они сказали друг другу: «Мы поступаем неправильно. Сегодня день доброй вести, а мы молчим. Если будем ждать до рассвета, нас постигнет наказание[a]. Пойдём же сейчас, сообщим об этом царскому дому[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нас найдёт вина (или беззаконие)»; возможно также: «мы окажемся виновны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царскому дворцу» либо «царскому двору».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: Мы поступаем неправильно
  rationale: Естественно передаёт идиоматическое нравственное суждение «не так мы поступаем», сохраняя его прямоту.
- source_word: יוֹם בְּשֹׂרָה
  choice: день доброй вести
  rationale: בְּשֹׂרָה в данном контексте означает благую новость об избавлении; единственное число «весть» соответствует еврейской форме и звучит по-русски естественно.
- source_word: מַחְשִׁים
  choice: мы молчим
  rationale: Причастная форма указывает на продолжающееся молчание; краткая русская формулировка естественно передаёт намеренное сокрытие новости в контексте.
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: Если будем ждать до рассвета
  rationale: Условное значение союза и глагольной формы ясно из контекста; «до рассвета» естественно передаёт буквальное «до света утра».
- source_word: וּמְצָאנוּ עָוֹן
  choice: нас постигнет наказание
  rationale: Буквально выражение допускает смысл «вина/беззаконие найдёт нас»; в контексте вероятна угроза кары за промедление. Неоднозначность отмечена в сноске.
- source_word: לְכוּ וְנָבֹאָה
  choice: Пойдём же сейчас
  rationale: Передаёт настойчивый призыв к немедленному совместному действию без неестественного буквального удвоения «идите, и пойдём».
- source_word: וְנַגִּידָה בֵּית הַמֶּלֶךְ
  choice: сообщим об этом царскому дому
  rationale: Глагол נגד в породе hифиль означает сообщить или объявить; בֵּית הַמֶּלֶךְ может обозначать царский дом как двор или дворцовое окружение, что сохранено в тексте и пояснено сноской.
theological_decisions:
- issue: Значение עָוֹן в выражении וּמְצָאנוּ עָוֹן
  choice: нас постигнет наказание
  alternative: нас настигнет вина / мы окажемся виновны
  rationale: Слово может обозначать как вину/беззаконие, так и последствие проступка — наказание. Контекст ожидания кары поддерживает основной вариант, но нравственно-юридическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified повествовательной речью. Сохранена срочность прямой речи и смысловая неоднозначность עָוֹן; архаизмы и конфессионально окрашенные формулы не использованы.
