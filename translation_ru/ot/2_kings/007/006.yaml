    rationale: «Ведь» вносит разговорно-объяснительный оттенок, не выраженный начальным וַ־; «дал услышать» может пониматься как разрешение, тогда как хифиль הִשְׁמִיעַ обозначает действенное причинение слышания.
  - severity: low
    issue: «Тогда они сказали»
    rationale: Вав-последовательность передаёт дальнейшее повествовательное действие, но «тогда» добавляет явный временной вывод, который не требуется оригиналом.
  - severity: low
