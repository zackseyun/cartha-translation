  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: ru
  text: 'Господь сделал так, что арамейский стан услышал шум колесниц, шум коней и шум большого войска. И они сказали друг другу[a]: «Вот, царь Израиля нанял против нас царей хеттов и царей Египта[b], чтобы они пошли на нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый сказал своему брату».'
    reason: Сохраняется буквальная форма еврейского взаимного оборота.
  - marker: b
    text: В еврейском тексте слово «цари» стоит во множественном числе и перед «хеттами», и перед «Египтом».
    reason: Отмечает необычное, но подлинное множественное число исходного текста.
lexical_decisions:
- source_word: וַאדֹנָי
  choice: Господь
  rationale: Божественный титул אֲדֹנָי в данном повествовании обозначает Бога Израиля; традиционное и естественное русское соответствие — «Господь».
- source_word: הִשְׁמִיעַ
  choice: дал ... услышать
  rationale: Каузативная форма глагола שׁמע указывает, что Господь не просто допустил слышание, а сделал так, что арамеи услышали этот шум.
- source_word: מַחֲנֵה אֲרָם
  choice: арамейскому стану
  rationale: Передаёт собирательное обозначение находившихся в стане арамеев и сохраняет древнее название Арам без анахроничной замены на современную Сирию.
- source_word: קוֹל רֶכֶב קוֹל סוּס קוֹל חַיִל גָּדוֹל
  choice: шум колесниц, шум коней и шум огромного войска
  rationale: Троекратное «шум» сохраняет риторическое повторение קוֹל; «войско» соответствует военному значению חַיִל в контексте.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: они сказали друг другу
  rationale: Естественно передаёт взаимное действие еврейского оборота, буквально означающего «каждый сказал своему брату».
- source_word: הִנֵּה
  choice: Смотрите!
  rationale: Передаёт привлечение внимания и внезапный вывод говорящих современным, но достойным русским выражением.
- source_word: שָׂכַר עָלֵינוּ
  choice: нанял против нас
  rationale: Сохраняет значение найма и враждебное значение предлога עַל, не добавляя отсутствующего в тексте слова «наёмники».
- source_word: מַלְכֵי הַחִתִּים וְאֶת מַלְכֵי מִצְרַיִם
  choice: царей хеттов и царей Египта
  rationale: Сохраняет множественное число обеих групп правителей, включая необычное, но ясное множественное «цари Египта».
- source_word: לָבוֹא עָלֵינוּ
  choice: чтобы они пошли на нас
  rationale: Передаёт целевое значение инфинитива и враждебное движение, выраженное сочетанием בוא с עַל.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Владыка
  rationale: Контекст ясно указывает на Бога Израиля. «Господь» является общепонятной передачей божественного титула и не подменяет его тетраграмматоном.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно торжественным библейским регистром. Повтор «шум» намеренно сохранён ради ритма и образности оригинала.
