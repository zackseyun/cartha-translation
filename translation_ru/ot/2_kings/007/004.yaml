translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Короткие параллельные фразы передают отчаянную логику говорящих. Добавленное «тоже» эксплицирует очевидное сопоставление двух равно смертельных вариантов, не меняя содержания. Все сноски имеют маркеры в основном тексте.
