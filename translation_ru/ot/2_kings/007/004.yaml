base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: ru
  text: 'Если мы скажем: «Пойдём в город», — в городе голод, и там мы умрём. Если же останемся здесь, то тоже умрём. А теперь пойдём к стану арамеев и сдадимся им[a]. Если они оставят нас в живых — будем жить, а если убьют нас — умрём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «падём к стану арамеев»; в военном контексте этот еврейский оборот может означать переход к противнику или сдачу ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹא הָעִיר
  choice: пойдём в город
  rationale: В прямой речи после «если мы скажем» форма передаёт предложение действовать. Русское «пойдём» естественно выражает совместное побуждение; отсутствие предлога перед «город» в еврейском является обычным обозначением направления.
- source_word: הָרָעָב בָּעִיר
  choice: в городе голод
  rationale: רָעָב в контексте осады означает массовый голод, а не только чувство голода. Краткий порядок слов сохраняет настойчивость рассуждения.
- source_word: יָשַׁבְנוּ פֹה
  choice: останемся здесь
  rationale: ישב может означать «сидеть, жить, оставаться». Здесь речь идёт не о позе, а о выборе не уходить, поэтому «останемся» точнее по контексту.
- source_word: וְנִפְּלָה אֶל
  choice: сдадимся
  rationale: Военный идиоматический оборот נפל אל означает перейти на сторону противника или отдаться в его руки. Буквальное «падём к» по-русски не передаёт смысла; «сдадимся» ясно выражает намерение, а альтернативный оттенок отмечен в сноске.
- source_word: מַחֲנֵה אֲרָם
  choice: стан арамеев
  rationale: מַחֲנֶה — военный лагерь или стан. אֲרָם здесь обозначает арамеев как осаждающую сторону; «стан арамеев» естественно и сохраняет древнее этническое название.
- source_word: יְחַיֻּנוּ נִחְיֶה
  choice: оставят нас в живых — будем жить
  rationale: Сохранён смысл каузативной формы «сохранят нам жизнь» и намеренный повтор корня חיה.
- source_word: יְמִיתֻנוּ
  choice: убьют нас
  rationale: Каузатив от מות означает «предать смерти, убить». В современном русском «убьют» прямо и естественно передаёт значение без стилистической тяжеловесности.
- source_word: וָמַתְנוּ / וָמָתְנוּ
  choice: умрём
  rationale: В условных рассуждениях формы обозначают ожидаемый итог; русское будущее время передаёт эту функцию.
