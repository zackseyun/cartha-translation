base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: ru
  text: 'Тогда сановник ответил человеку Божьему: «Если бы Яхве сделал окна в небесах[a], разве могло бы такое случиться?» Человек Божий сказал: «Вот, ты увидишь это собственными глазами, но есть этого не будешь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шлюзы в небе». Буквально в еврейском тексте — «окна в небесах»: образ отверстий в небесах, через которые могут изливаться дары или суд.'
    reason: лексическая альтернатива и пояснение древнего образа
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: сановник
  rationale: Слово обозначает высокопоставленного военного или придворного служащего. «Сановник» естественно звучит в русском повествовании и не уточняет чин сверх того, что выражено еврейским словом.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён устойчивый библейский титул пророка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: сделал окна в небесах
  rationale: 'Сохранён конкретный образ еврейского текста: אֲרֻבּוֹת — «окна», «шлюзы». Русское условное наклонение естественно передаёт скептическое предположение сановника; образ не заменён истолкованием.'
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: разве могло бы такое случиться?
  rationale: Риторический вопрос и выраженное им сомнение переданы естественной современной русской конструкцией.
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: Вот, ты увидишь это собственными глазами
  rationale: הִנְּךָ вводит подчёркнутое предсказание, а причастие в данном контексте имеет значение близкого будущего. «Собственными глазами» сохраняет эмфазу.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: но есть этого не будешь
  rationale: Буквальное «оттуда» в русском было бы неясным; местоименное «этого» естественно указывает на обещанное продовольствие, не добавляя нового смысла.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер вопроса сановника
  choice: Сохранено скептическое условное высказывание без добавочного усилителя «даже»
  alternative: «Даже если бы Яхве…»
  rationale: Условность и сомнение ясны из конструкции и риторического вопроса; отдельного слова со значением «даже» в еврейском тексте нет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упрощён за счёт устранения избыточной для русского речи пары «ответил… и сказал». Прямая речь и повтор титула помогают ясно различить говорящих.
