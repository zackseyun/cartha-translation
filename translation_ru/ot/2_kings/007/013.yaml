base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: ru
  text: 'Один из его слуг ответил: «Пусть возьмут пять коней из тех, что ещё остались в ней[a]. Вот, они — как всё множество Израиля, оставшееся в ней; вот, они — как всё множество Израиля, которое погибло[b]. Пошлём и посмотрим».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «в ней», вероятно, относится к Самарии, то есть к городу, хотя само название в этом стихе не повторяется.
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте стоит трудное и повторяющееся сравнение: «они — как всё множество Израиля, оставшееся в ней… как всё множество Израиля, которое погибло». Перевод сохраняет это повторение, не сглаживая его.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: Один из его слуг ответил
  rationale: Глагол ענה в повествовании вводит ответную реплику; сочетание «ответил и сказал» по-русски избыточно, поэтому смысл естественно передан глаголом «ответил». עֶבֶד при царском дворе достаточно широко и нейтрально передаётся словом «слуга».
- source_word: וְיִקְחוּ נָא
  choice: Пусть возьмут
  rationale: Юссив с נָא выражает вежливое побуждение или предложение. Русское «пусть возьмут» сохраняет волитивный смысл; отдельное «пожалуйста» в данном контексте звучало бы менее естественно.
- source_word: חֲמִשָּׁה מִן הַסּוּסִים
  choice: пять коней из тех
  rationale: Предлог מן имеет партитивное значение. «Пять коней из тех» естественно передаёт выбор части из оставшихся лошадей.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: из тех, что ещё остались в ней
  rationale: В еврейском дважды употреблён корень שׁאר. Дословное повторение «оставшихся, которые остались» по-русски тяжеловесно; частица «ещё» передаёт усиленный смысл остатка. Женский суффикс сохранён как «в ней», без подстановки существительного «Самария» или «город».
- source_word: הִנָּם
  choice: Вот, они
  rationale: Повторённая указательная частица הִנָּם привлекает внимание к обоим сопоставлениям. «Вот» сохраняет её функцию и подходит современному литературному регистру.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: как всё множество израильтян
  rationale: הָמוֹן обозначает множество или массу людей. Формулировка сохраняет собирательный образ и не заменяет его более интерпретирующим словом «народ».
- source_word: אֲשֶׁר תָּמּוּ
  choice: которые погибли
  rationale: В контексте осады תָּמּוּ указывает на тех, кто пришёл к концу, погиб. «Погибли» ясно и естественно передаёт этот смысл, не уточняя причину смерти.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: Пошлём их и посмотрим
  rationale: Два когортатива выражают предложение совместного действия. Местоимение «их» восстанавливает подразумеваемый объект отправки, необходимый для естественного русского синтаксиса; «посмотрим» сохраняет буквальный образ глагола ראה и значение проверки.
theological_decisions:
- issue: Необычное двойное сравнение оставшихся коней со множеством оставшихся и погибших израильтян
  choice: Сохранено повторное сравнение без поясняющего истолкования
  alternative: Сгладить фразу до мысли, что участники разведки в любом случае разделят судьбу остальных
  rationale: Еврейский текст синтаксически труден и намеренно повторителен. Сглаживание устранило бы подлинную неоднозначность и внесло бы объяснение, отсутствующее в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Архаизмы избегаются; повтор «вот» и необычная структура сопоставления сохранены ради формы и напряжённости исходного текста.
