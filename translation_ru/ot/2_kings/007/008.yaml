source:
  edition: WLC
  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: ru
  text: Когда эти прокажённые[a] дошли до края стана, они вошли в один шатёр, поели и попили, вынесли оттуда серебро, золото и одежду, пошли и спрятали всё это. Потом они вернулись, вошли в другой шатёр, вынесли оттуда вещи, пошли и спрятали их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «прокажённые», обозначает людей, страдавших кожным заболеванием, которое традиционно называют проказой; древний термин мог охватывать более широкий круг состояний, чем современное медицинское понятие проказы.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: прокажённые
  rationale: Традиционный и краткий повествовательный эквивалент для людей, поражённых צָרַעַת; примечание уточняет, что древний термин шире современного медицинского понятия проказы.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: края стана
  rationale: Передаёт пространственное значение «край, оконечность»; «стан» соответствует древнему военному лагерю и сохраняет достоинство библейского повествования.
- source_word: אֹהֶל אֶחָד
  choice: один шатёр
  rationale: Сохраняет численно выраженное אֶחָד и конкретную последовательность повествования.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: поели и попили
  rationale: Естественно передаёт завершённые действия в последовательном повествовании без добавления отсутствующей в еврейском тексте аспектуальной характеристики.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: вынесли оттуда
  rationale: В данном контексте נשא означает унести имущество; «вынесли» естественно связано с шатром и не усиливает значение до явно выраженного грабежа.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: серебро, золото и одежду
  rationale: Современная и точная передача перечня; «одежда» естественнее для современного русского читателя, чем «одеяния».
- source_word: וַיַּטְמִנוּ
  choice: спрятали
  rationale: Сохраняет общее значение сокрытия, не конкретизируя его как закапывание, чего сам глагол здесь не требует.
- source_word: וַיָּשֻׁבוּ
  choice: Потом они вернулись
  rationale: Передаёт продолжение последовательности событий естественным русским повествованием.
- source_word: אֹהֶל אַחֵר
  choice: другой шатёр
  rationale: Прямой и естественный эквивалент со значением «ещё один, другой».
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: вынесли оттуда вещи
  rationale: Во втором употреблении объект не назван; слово «вещи» делает русскую фразу понятной, не уточняя состав имущества сверх текста.
