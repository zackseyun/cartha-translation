  text: וַ/יַּ֣עַן הַ/שָּׁלִ֡ישׁ אֲשֶׁר לַ/מֶּלֶךְ֩ נִשְׁעָ֨ן עַל יָד֜/וֹ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/כָ֤ה רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: ru
  text: 'Тогда царский сановник, на руку которого опирался царь, ответил человеку Божьему: «Вот, даже если бы Яхве сделал окна[a] на небесах, разве могло бы такое случиться?» Человек Божий сказал: «Вот, ты увидишь это своими глазами, но есть из этого не будешь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отворил небесные шлюзы». Буквально: «сделал окна на небесах» — образ чрезвычайного изобилия, ниспосылаемого свыше.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «но оттуда не будешь есть». По контексту имеется в виду обещанная пища.'
    reason: source_clarity
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: царский сановник
  rationale: Слово обозначает высокопоставленного военного или придворного служащего, но точный чин здесь неясен. «Царский сановник» естественно передаёт его положение при дворе, не приписывая ему более конкретного звания.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: на руку которого опирался царь
  rationale: Сохранён яркий образ близкого доверенного служителя. Русское «рука» естественно охватывает значение еврейского יָד и не требует искусственного выбора между кистью и всей рукой.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён устойчивый библейский титул пророка без поясняющей замены словом «пророк».
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт указательно-эмфатическую частицу в обеих репликах и сохраняет резкий, непосредственный тон разговора.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: сделал окна на небесах
  rationale: Сохранена буквальная и намеренно гиперболическая метафора небесных отверстий; более истолковывающее «отворил небесные шлюзы» дано в примечании.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: разве могло бы такое случиться?
  rationale: Вопросительная конструкция выражает насмешливое неверие в возможность обещанного события.
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: увидишь это своими глазами
  rationale: Естественный русский оборот сохраняет эмфатический смысл еврейской конструкции.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: но есть из этого не будешь
  rationale: По контексту речь идёт об обещанной пище. Формулировка остаётся естественной по-русски, а буквальное пространственное «оттуда» отмечено в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер слов сановника
  choice: сохранён риторический вопрос, выражающий сомнение
  alternative: утвердительное толкование как прямое отрицание Божьей силы
  rationale: Грамматика передаёт насмешливое неверие, но не требует добавлять явное богословское утверждение, которого в тексте нет.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис диалога упрощён без потери содержания: парное «ответил и сказал» передано естественным русским «ответил». Архаизмы и искусственно церковнославянские формы не использованы.'
