base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: ru
  text: Царь назначил того сановника, на руку которого опирался, ответственным за ворота. Но народ затоптал его в воротах, и он умер — как и сказал человек Божий, когда царь сошёл к нему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִפְקִיד ... עַל הַשַּׁעַר
  choice: поставил у ворот
  rationale: Hiphil глагола פקד с עַל выражает назначение и возложение ответственности. В русском «поставил у ворот» естественно передаёт назначение для надзора за проходом, не сводя фразу лишь к местонахождению.
- source_word: הַשָּׁלִישׁ
  choice: сановника
  rationale: Термин обозначает высокопоставленного военного или придворного служащего, близкого к царю. «Сановник» сохраняет высокий статус, не приписывая ему неопределённого в тексте точного воинского звания.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: на руку которого опирался
  rationale: Сохранён образ еврейского текста и связь с ранее упомянутым приближённым царя; подлежащее «царь» понятно из главной части предложения.
- source_word: וַיִּרְמְסֻהוּ הָעָם
  choice: народ затоптал его
  rationale: רמס прямо обозначает попрание ногами; «затоптал» точно и естественно передаёт смертельную давку.
- source_word: בַּשַּׁעַר
  choice: в воротах
  rationale: В древнем городе ворота представляли собой протяжённый проход или комплекс помещений, поэтому русское «в воротах» передаёт внутреннее пространство ворот.
- source_word: כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים
  choice: как и сказал человек Божий
  rationale: Формула ясно связывает событие с прежде произнесённым пророческим словом; «человек Божий» сохраняет устойчивый титул оригинала.
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: когда царь сошёл к нему
  rationale: Инфинитивная конструкция с בְּ имеет временное значение. «Сошёл» сохраняет пространственную направленность глагола ירד.
theological_decisions:
- issue: Исполнение пророческого слова
  choice: Смерть сановника прямо представлена как исполнение слов человека Божьего.
  alternative: Передать событие как простое совпадение с ранее сказанным или ослабить формулу исполнения.
  rationale: Конструкция כַּאֲשֶׁר דִּבֶּר и повтор דִּבֶּר явно подчёркивают исполнение ранее произнесённого слова; перевод не добавляет объяснения причин или механизма исполнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным, еврейский образ опоры на руку сохранён. Единственная сноска отмечена в основном тексте.
