base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: ru
  text: 'У входа в ворота находились четыре человека с кожным заболеванием[a]. Они сказали друг другу: «Зачем нам сидеть здесь, пока мы не умрём?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, по традиционному переводу, «прокажённые». Еврейское слово относится к состоянию, связанному с צָרַעַת; оно не обязательно тождественно современной проказе (болезни Хансена).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: находились четыре человека
  rationale: Еврейская конструкция вводит в повествование новую группу участников. Русское «находились четыре человека» естественно передаёт их наличие и местоположение; начальный ו не требует отдельного временного наречия.
- source_word: מְצֹרָעִים
  choice: поражённые кожной болезнью
  rationale: Термин обозначает людей с состоянием, связанным с צָרַעַת, которое нельзя без оговорки отождествлять с современной болезнью Хансена. Выбор сохраняет телесный и болезненный характер состояния, не внося ложной медицинской точности.
- source_word: פֶּתַח הַשָּׁעַר
  choice: у входа в ворота
  rationale: Сочетание буквально указывает на вход или проём ворот; данная формулировка естественна в современном русском языке.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: Они сказали друг другу
  rationale: Распределительное выражение в единственном числе имеет взаимное значение и обозначает разговор внутри группы.
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: Зачем нам сидеть здесь
  rationale: В риторическом вопросе מָה передаёт значение «зачем/почему»; «зачем» естественно выражает бессмысленность дальнейшего бездействия. Причастие יֹשְׁבִים сохраняется как продолжающееся «сидеть».
- source_word: עַד מָתְנוּ
  choice: пока мы не умрём
  rationale: 'В русском после «пока» нормативно употребляется отрицание, не меняющее смысла: оставаться здесь до наступления смерти.'
