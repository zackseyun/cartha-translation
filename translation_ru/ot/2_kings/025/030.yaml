source:
  edition: WLC
  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַ֨ת תָּמִ֧יד נִתְּנָה לּ֛/וֹ מֵ/אֵ֥ת הַ/מֶּ֖לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽ/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: ru
  text: И содержание его[a] — постоянное содержание — выдавалось ему от царя, положенное на каждый день, изо дня в день[b], во все дни его жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «паёк», «доля» или «обеспечение». Еврейское слово обозначает назначенное ему содержание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дело дня в его день» — выражение о том, что положенное на каждый день выдавалось ежедневно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: содержание
  rationale: В контексте речь идёт о назначенном царём регулярном обеспечении Иехонии. «Содержание» естественно по-русски передаёт предоставляемые средства или припасы и не сужает смысл до военного пайка.
- source_word: תָּמִיד
  choice: постоянное
  rationale: Определяет содержание как непрерывно предоставляемое на протяжении указанного срока.
- source_word: נִתְּנָה
  choice: выдавалось
  rationale: Передаёт пассивную форму נתן и вместе с контекстом ежедневного обеспечения естественнее звучит по-русски, чем буквальное «давалось».
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: от царя
  rationale: 'Сохраняет выраженное предлогом значение источника: содержание исходило от царя.'
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: положенное на каждый день, изо дня в день
  rationale: Передаёт как назначенную долю каждого дня, так и распределительный характер еврейской идиомы, не воспроизводя неестественное по-русски буквальное «дело дня в его день».
- source_word: כֹּל יְמֵי חַיָּו
  choice: во все дни его жизни
  rationale: Точно и достойно передаёт обычную еврейскую формулу пожизненной продолжительности.
