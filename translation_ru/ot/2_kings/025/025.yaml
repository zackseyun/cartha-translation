  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: ru
  text: В седьмой месяц Исмаил, сын Нефании, сына Елисамы, потомок царского рода[a], пришёл с десятью людьми. Они поразили Годолию, и он умер; они также поразили иудеев и халдеев[b], находившихся с ним в Массифе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из царского семени», то есть потомок царского дома.'
    reason: lexical_alternative
  - marker: b
    text: 'В данном контексте также можно передать: «вавилонян»; в еврейском тексте — «халдеев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: В седьмой месяц
  rationale: Еврейская повествовательная формула вводит новое событие; в современном русском её функцию естественно передать началом временного оборота без буквального «и случилось».
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: в седьмой месяц
  rationale: Прямое и естественное обозначение времени; источник не уточняет год.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: из царского рода
  rationale: Передаёт династическое происхождение, подразумеваемое буквальным выражением «из царского семени», без неестественной русской кальки.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: с десятью людьми
  rationale: Естественно присоединяет сопровождавших Исмаила людей к глаголу движения.
- source_word: וַיַּכּוּ
  choice: они поразили
  rationale: Сохраняет отдельное обозначение насильственного удара и не сливает его с последующим сообщением о смерти Годолии.
- source_word: וַיָּמֹת
  choice: и тот умер
  rationale: Сингулярный глагол естественнее всего относится к Годолии; «тот» устраняет возможную русскую двусмысленность местоимения.
- source_word: הַיְּהוּדִים
  choice: иудеев
  rationale: В историческом контексте Иудеи и вавилонского завоевания этногеографическое «иудеи» точнее.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Непосредственно передаёт еврейский этноним, который в данном контексте обозначает представителей Вавилона.
- source_word: בַּמִּצְפָּה
  choice: в Массифе
  rationale: Использована укоренившаяся русская библейская форма географического имени; предлог «в» естественен для поселения.
