base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: ru
  text: В девятый год его царствования, в десятый месяц, в десятый день месяца Навуходоносор[b], царь Вавилона, со всем своим войском выступил против Иерусалима. Он расположился лагерем против него, и его войско возвело вокруг него осадный вал[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осадные сооружения» или «осадную насыпь». Еврейское слово דָּיֵק обозначает военные сооружения, возводимые против города во время осады.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское имя נְבֻכַדְנֶאצַּר можно также передать ближе к его звучанию как «Невухаднецар».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: В девятый год…
  rationale: Еврейская повествовательная формула вводит датированное событие. В современном русском естественнее начать непосредственно с обстоятельства времени, не используя архаичное «и было».
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: в девятый год его царствования
  rationale: Точно и естественно передаёт принятую формулу отсчёта по годам правления царя; местоимение сохраняет отсылку к Седекии из контекста.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: в десятый месяц, в десятый день месяца
  rationale: Сохраняет данную в тексте календарную систему и не подставляет современное название месяца.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Навуходоносор
  rationale: Устоявшаяся и легко узнаваемая русская форма имени; более буквальная транслитерация отмечена в сноске.
- source_word: הוּא וְכָל חֵילוֹ
  choice: со всем своим войском
  rationale: Естественно передаёт включённость самого царя и всей его военной силы, не создавая тяжеловесной русской конструкции «он и всё его войско».
- source_word: עַל יְרוּשָׁלַםִ
  choice: против Иерусалима
  rationale: В контексте военного похода предлог עַל имеет враждебную направленность, а не просто обозначает прибытие к месту.
- source_word: וַיִּחַן עָלֶיהָ
  choice: расположился лагерем под городом
  rationale: Передаёт военную стоянку у осаждаемого города; «под городом» естественно в русском описании осады.
- source_word: דָּיֵק
  choice: осадный вал
  rationale: Конкретное и понятное обозначение сооружения, возведённого против города при осаде; возможная более широкая семантика сохранена в сноске.
