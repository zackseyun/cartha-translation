translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историко-повествовательным звучанием. Длинная еврейская фраза разделена на два предложения ради ясности. Повторы «месяц» и «город» сохранены там, где они поддерживают точность и устраняют неясность местоименных отсылок.
