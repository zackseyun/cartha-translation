  text: וְ/אֶת הַ/מַּחְתּוֹת֙ וְ/אֶת הַ/מִּזְרָק֗וֹת אֲשֶׁ֤ר זָהָב֙ זָהָ֔ב וַ/אֲשֶׁר כֶּ֖סֶף כָּ֑סֶף לָקַ֖ח רַב טַבָּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/015.yaml
  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: ru
  text: И совки для углей[a], и чаши[b] — всё золотое и всё серебряное[c] — забрал начальник стражи[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кадильницы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тазы».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально в еврейском: «что золотое — золото, и что серебряное — серебро»; повтор подчёркивает распределение предметов по материалу.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «начальник телохранителей»; буквально титул можно понять как «начальник палачей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: совки для углей
  rationale: Слово обозначает храмовые принадлежности для переноса горящих углей и, возможно, благовоний. Этот перевод ясно передаёт основное назначение предмета, не сводя его только к курению благовоний.
- source_word: הַמִּזְרָקוֹת
  choice: чаши
  rationale: Слово обозначает культовые сосуды, в частности для крови или другой жертвенной жидкости. «Чаши» — естественное и достаточно широкое соответствие.
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: всё золотое и всё серебряное
  rationale: Фраза естественно передаёт распределение предметов по материалу. Повтор названий материалов в еврейском отмечен в сноске, поскольку буквальное воспроизведение по-русски было бы неясным.
- source_word: לָקַח
  choice: забрал
  rationale: Глагол значит «взял»; в контексте разграбления «забрал» естественно передаёт действие, не добавляя излишних подробностей.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: В данном контексте выражение служит официальным титулом высокопоставленного вавилонского военачальника. «Начальник стражи» понятно современному читателю; буквальная основа титула и другое возможное понимание указаны в сноске.
