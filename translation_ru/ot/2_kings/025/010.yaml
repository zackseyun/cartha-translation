lexical_decisions:
- source_word: חוֹמֹת
  choice: стены
  rationale: Форма множественного числа обозначает городские стены, то есть укрепления Иерусалима; «стены» естественно и точно передаёт смысл.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалима
  rationale: Общепринятая русская форма названия; родительный падеж обусловлен сочетанием «стены Иерусалима».
- source_word: סָבִיב
  choice: вокруг
  rationale: Наречие указывает на стены, окружавшие город. Русское «вокруг» сохраняет пространственный смысл без ненужного усиления.
- source_word: נָתְצוּ
  choice: разрушило
  rationale: Глагол נתץ означает разрушать или сносить сооружение; «разрушило» уместно для уничтожения городских стен и согласуется с собирательным «войско».
- source_word: כָּל חֵיל
  choice: всё войско
  rationale: כָּל охватывает всю названную военную силу, а חֵיל в данном контексте означает войско.
- source_word: כַּשְׂדִּים
  choice: халдеев
  rationale: Прямо передаёт еврейский этноним, не заменяя его контекстуальным «вавилонян».
- source_word: אֲשֶׁר
  choice: бывшее при
  rationale: Относительная конструкция эллиптически связывает войско с должностным лицом; «бывшее при» естественно выражает эту связь, не уточняя сверх текста структуру подчинения.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: В придворно-военном контексте это титул высокопоставленного начальника царской стражи, чьи обязанности могли включать казни. Более буквальные варианты сохранены в примечании.
