  - marker: b
    text: Слово «престол» может также означать «сиденье»; речь идёт о том, что Иехонии отвели место и положение выше других царей в Вавилоне.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: говорил с ним благосклонно
  rationale: Буквально «говорил с ним доброе»; это идиома, обозначающая благожелательную, милостивую речь. Русское «говорил с ним благосклонно» естественно передаёт как манеру обращения, так и благоприятное отношение.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: поставил его престол
  rationale: Глагол נתן с существительным «престол» здесь указывает на определение почётного места и положения Иехонии, а не на передачу ему престола как предмета.
- source_word: כִּסְאוֹ
  choice: его престол
  rationale: כִּסֵּא может обозначать как сиденье, так и престол. «Престол» сохраняет царскую образность и смысл высокого статуса, не исключая конкретного почётного места за столом или при дворе.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: выше престолов царей
  rationale: מֵעַל выражает превосходство по месту или рангу. В русском множественное «престолов» естественно согласуется с несколькими царями и ясно передаёт первенство Иехонии.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: царей, находившихся с ним
  rationale: Относительное придаточное передано прямо, без уточнения не выраженных в еврейском тексте обстоятельств их плена или придворного положения.
- source_word: בְּבָבֶל
  choice: в Вавилоне
  rationale: Стандартная передача указания места.
