  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: ru
  text: Он доброжелательно поговорил с ним и поставил его престол выше престолов царей, находившихся с ним в Вавилоне[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорил с ним доброе» — идиома, означающая благожелательное или благосклонное обращение.'
