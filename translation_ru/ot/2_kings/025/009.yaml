    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Он сжёг
  rationale: Форма Qal wayyiqtol продолжает повествование; в естественном русском начальный союз можно не передавать отдельно.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» и параллелизм с последующими домами; храмовое значение пояснено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дворец
  rationale: Контекстуально естественная русская передача буквального «дома царя», обозначающего царскую резиденцию.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: все дома Иерусалима
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции.
- source_word: כָּל בֵּית גָּדוֹל
  choice: все знатные дома
  rationale: В данном контексте גָּדוֹל вероятно указывает на выдающиеся или влиятельные дома, однако возможное значение размера сохранено в сноске.
- source_word: שָׂרַף בָּאֵשׁ
  choice: всё предал огню
  rationale: Передаёт повторный глагол שׂרף и инструментальное בָּאֵשׁ без тяжеловесного русского повтора «сжёг огнём».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Основной текст сохраняет личное имя, представленное тетраграмматоном, не заменяя его титулом.
- issue: Значение בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Буквальная формулировка сохраняет образ и синтаксический параллелизм; контекстуальный смысл «храм» указан как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. Повтор исходного глагола передан конструкцией «всё предал огню». Неоднозначность גָּדוֹל раскрыта в сноске.
