base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: ru
  text: А над народом, оставшимся в земле Иуды[a], то есть над теми, кого оставил Навуходоносор, царь Вавилона, он поставил Гедалию, сына Ахикама, сына Шафана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставленным в земле Иуды»; еврейское причастие может обозначать как тех, кто остался, так и тех, кто был оставлен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם הַנִּשְׁאָר
  choice: народом, оставшимся
  rationale: Причастие нифаля от שׁאר описывает людей, которые остались или были оставлены после переселений. Формулировка «оставшимся» естественна по-русски и не вводит богословски окрашенного существительного «остаток».
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иуды
  rationale: Сохраняет территориальное значение אֶרֶץ и обычное библейское обозначение области Иуды.
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: кого оставил
  rationale: 'Порода хифиль глагола שׁאר выражает причинное действие: Навуходоносор оставил этих людей в стране.'
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Навуходоносор, царь Вавилона
  rationale: Использована традиционная русская форма имени и прямо сохранён царский титул.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: он поставил ... над
  rationale: В административном контексте פקד с עַל означает назначить кого-либо руководить другими; «поставил над» точно и естественно передаёт конструкцию.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: Гедалию, сына Ахикама, сына Шафана
  rationale: Сохранена полная патронимическая цепочка и употреблены традиционные русские формы имён.
- source_word: וְ
  choice: А
  rationale: Начальный союз обозначает переход к новой теме — судьбе оставшегося населения; русское «А» естественно передаёт этот тематический поворот.
theological_decisions:
- issue: Значение הַנִּשְׁאָר
  choice: оставшимся
  alternative: оставленным
  rationale: Еврейское причастие допускает акцент как на состоянии оставшихся, так и на том, что они были оставлены. Основной текст выбирает естественную русскую формулировку, а неоднозначность сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Инверсия «над народом ... он поставил» отражает тематическое выдвижение населения в начале еврейского предложения; тире разграничивают вложенное определение и облегчают чтение.
