  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: ru
  text: И сменил он свою тюремную одежду, и постоянно ел хлеб перед ним[a] до конца своих дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в его присутствии»; выражение может также подразумевать, что он ел за царским столом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: И сменил он
  rationale: Пиэль глагола שׁנה означает «менять, сменять». Инверсия естественно продолжает повествование и не вводит причинного значения, которого нет в форме глагола.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: свою тюремную одежду
  rationale: Буквально — «одежду своего заключения». Современное русское выражение передаёт, что это была одежда, которую Иехония носил в заключении.
- source_word: וְאָכַל לֶחֶם
  choice: и постоянно ел хлеб
  rationale: Сохранён конкретный образ «есть хлеб», хотя в данном контексте выражение означает регулярные трапезы.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Передаёт длительную регулярность, усиленную следующим указанием на продолжительность жизни.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Формально сохраняет широкое значение еврейского выражения и местоименную отсылку; более явное понимание как присутствия царя или трапезы за его столом дано в сноске.
- source_word: כָּל יְמֵי חַיָּיו
  choice: до конца своих дней
  rationale: Естественный современный русский эквивалент устойчивого еврейского выражения «все дни его жизни»; в контексте оно означает оставшуюся часть жизни Иехонии.
