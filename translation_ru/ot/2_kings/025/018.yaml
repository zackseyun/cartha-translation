source:
  edition: WLC
  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖הוּ כֹּהֵ֣ן מִשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: ru
  text: Начальник царской стражи взял Сераию, главного священника[a], Софонию, второго священника, и трёх стражей порога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первосвященника». Буквально: «священника, главу (главного)».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «привратников», «стражей храмового входа». Буквально: «стражей порога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: начальник царской стражи
  rationale: Это вавилонский придворно-военный титул. Такой перевод естественно передаёт должность начальника царской охраны, не воспроизводя буквально компоненты со значением «главный» и «палачи/убойщики».
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное значение глагола — «брать». Контекст подразумевает принудительное задержание, однако нейтральное «взял» сохраняет лаконичность и смысловую широту еврейского текста.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: главного священника
  rationale: 'Буквально: «священника, главу/главного». Перевод близко передаёт структуру и обозначает ведущего священнослужителя, не устраняя возможность традиционного понимания «первосвященник».'
- source_word: כֹּהֵן מִשְׁנֶה
  choice: второго священника
  rationale: מִשְׁנֶה указывает на второе место по рангу или заместительство. Буквальный вариант сохраняет иерархический оттенок без лишнего уточнения обязанностей.
- source_word: שֹׁמְרֵי הַסַּף
  choice: стражей порога
  rationale: 'Буквально: «хранители/стражи порога». Выражение, вероятно, обозначает служителей, охранявших вход в храм; конкретный образ исходного текста сохранён.'
- source_word: שְׁלֹשֶׁת
  choice: трёх
  rationale: Числительное относится к определённой группе служителей; русская форма естественно включается в управление глагола «взял».
- source_word: שְׂרָיָה
  choice: Сераию
  rationale: Имя передано в принятой русской библейской форме «Сераия», здесь в винительном падеже.
- source_word: צְפַנְיָהוּ
  choice: Софонию
  rationale: Имя передано в принятой русской библейской форме «Софония», здесь в винительном падеже.
theological_decisions:
- issue: Статус כֹּהֵן הָרֹאשׁ
  choice: главный священник
  alternative: первосвященник
  rationale: Еврейское выражение буквально означает «священник, глава/главный». Основной текст сохраняет эту формулировку, а традиционный должностной эквивалент приведён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся лаконичным и близким к еврейскому оригиналу; неоднозначность глагола «взял» и названий священнических должностей не снимается без необходимости. Маркеры сносок размещены при тех выражениях, к которым относятся.
