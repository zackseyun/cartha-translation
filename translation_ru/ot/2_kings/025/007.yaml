base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: ru
  text: Сыновей Седекии зарезали у него на глазах, а самому Седекии он выколол глаза[a], заковал его в бронзовые оковы и отвёл в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ослепил Седекию». В еврейском тексте прямо упомянуты глаза Седекии; в данном контексте, вероятно, речь идёт об их физическом повреждении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: зарезали
  rationale: Глагол обозначает убой или насильственное заклание. «Зарезали» естественно по-русски передаёт жестокость действия точнее, чем нейтральное «убили».
- source_word: לְעֵינָיו
  choice: у него на глазах
  rationale: Русский идиоматический эквивалент со значением действия, совершённого непосредственно перед человеком и виденного им.
- source_word: עִוֵּר
  choice: выколол глаза
  rationale: Глагол буквально означает «сделал слепым, ослепил»; при прямом дополнении «глаза Седекии» и в данном насильственном контексте естественный русский оборот «выколол глаза» передаёт подразумеваемое физическое действие.
- source_word: וַיַּאַסְרֵהוּ
  choice: заковал его
  rationale: Глагол означает «связал, заключил»; вместе с упоминанием оков «заковал» является точным и естественным контекстуальным соответствием.
- source_word: בַנְחֻשְׁתַּיִם
  choice: в медные оковы
  rationale: Форма обозначает металлические путы или оковы. Традиционное и понятное русское «медные оковы» сохраняет конкретный материал и назначение предмета.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: отвёл в Вавилон
  rationale: Обычный глагол «привести/доставить». В повествовании об узнике «отвёл в Вавилон» звучит естественно и сохраняет направление движения.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: сыновей Седекии
  rationale: Естественная русская передача древнееврейского сопряжённого сочетания без потери смысла.
theological_decisions:
- issue: Смена грамматического субъекта
  choice: Сохранён переход от множественного «зарезали» к единственному «он выколол… заковал… отвёл».
  alternative: Передать все действия неопределённо-личными формами множественного числа.
  rationale: В еврейском тексте после שָׁחֲטוּ, формы множественного числа, следуют три глагола в единственном числе. Сохранение этой смены не устраняет повествовательную особенность текста; местоимение «он» по контексту относится к вавилонскому царю.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Формулировка «зарезали у него на глазах» сохраняет жестокую наглядность оригинала; «медные оковы» остаётся понятным библейско-историческим выражением. Синтаксис намеренно сохраняет смену множественного субъекта на единственный.
