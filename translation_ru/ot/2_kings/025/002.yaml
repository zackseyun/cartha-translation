base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/002.yaml
  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: ru
  text: И город оставался в осаде до одиннадцатого года царствования Седекии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «город вошёл в осаду» — древнееврейское выражение, означающее, что город находился в осаде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: оставался
  rationale: Буквально глагол בוא означает «пришёл» или «вошёл», но в сочетании с בַּמָּצוֹר выражает продолжающееся состояние города; «оставался» естественно передаёт этот результативно-стативный смысл.
- source_word: הָעִיר
  choice: город
  rationale: Прямое соответствие существительному עִיר с определённым артиклем; определённость в русском контексте передаётся без артикля.
- source_word: בַּמָּצוֹר
  choice: в осаде
  rationale: מָצוֹר обозначает осаду или осадное положение; русское устойчивое выражение «оставаться в осаде» точно и естественно передаёт смысл.
- source_word: עַד
  choice: до
  rationale: Предлог отмечает временной предел продолжающейся осады.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: до одиннадцатого года
  rationale: Количественная конструкция в древнееврейской формуле датировки по царствованию естественно передаётся по-русски порядковым числительным.
- source_word: לַמֶּלֶךְ
  choice: царствования
  rationale: В формуле датировки предлог ל указывает на год правления царя. Слово «царствования» делает это отношение ясным и естественным по-русски.
- source_word: צִדְקִיָּהוּ
  choice: Седекии
  rationale: Использована традиционная русская библейская форма имени, поставленная в родительном падеже согласно синтаксису перевода.
