  text: וַ/יָּקֻ֨מוּ כָל הָ/עָ֜ם מִ/קָּטֹ֤ן וְ/עַד גָּדוֹל֙ וְ/שָׂרֵ֣י הַ/חֲיָלִ֔ים וַ/יָּבֹ֖אוּ מִצְרָ֑יִם כִּ֥י יָרְא֖וּ מִ/פְּנֵ֥י כַשְׂדִּֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: ru
  text: Тогда весь народ, от малого до великого, и военачальники[a] поднялись и ушли в Египет, потому что боялись халдеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальники войска»; возможно также: «командиры отрядов».'
    reason: Лексическое сочетание שָׂרֵי הַחֲיָלִים допускает несколько близких по смыслу обозначений военных руководителей.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: поднялись
  rationale: Форма глагола קום обозначает решительное начало действия в повествовательной последовательности; «поднялись» сохраняет образ исходного текста, не сводя его лишь к физическому вставанию.
- source_word: כָל הָעָם
  choice: весь народ
  rationale: Естественно передаёт собирательное выражение и его всеохватность.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: от малого до великого
  rationale: Устойчивое выражение охватывает людей любого положения или значимости и не ограничивает смысл возрастом.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: и военачальники
  rationale: שָׂרֵי указывает на начальников, а הַחֲיָלִים в данном контексте — на военные силы; краткое русское соответствие ясно передаёт сочетание.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: и ушли в Египет
  rationale: Хотя בוא может означать «приходить», в данном повествовательном ракурсе естественно русское «ушли в Египет», подчёркивающее удаление из страны без добавления отсутствующих деталей.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину их ухода; это прямое и современное русское соответствие.
- source_word: יָרְאוּ מִפְּנֵי כַשְׂדִּים
  choice: боялись халдеев
  rationale: Сочетание ירא с מִפְּנֵי естественно выражает страх перед кем-либо; «боялись халдеев» звучит ясно и сохраняет исторический этноним.
