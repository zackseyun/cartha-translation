base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: ru
  text: Котлы, лопатки, щипцы для светильников[a], чаши и всю бронзовую утварь, которой пользовались при служении, они унесли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ножи» или «ножи для обрезки». Еврейское слово может обозначать режущее орудие, но в данном перечне храмовой утвари его обычно понимают как приспособление для подрезания фитилей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: котлы
  rationale: סִירוֹת обозначает котлы или иные ёмкости; «котлы» — естественный и устоявшийся вариант в перечне храмовой утвари.
- source_word: הַיָּעִים
  choice: лопатки
  rationale: יָעִים — орудия для удаления золы или обращения с углями; «лопатки» точно передаёт назначение и подходит к храмовому контексту.
- source_word: הַמְזַמְּרוֹת
  choice: щипцы для светильников
  rationale: Слово связано с режущими орудиями, но в перечне храмовой утвари обычно понимается как приспособление для подрезания фитилей. Перевод передаёт вероятную контекстуальную функцию, а неоднозначность отмечена в сноске.
- source_word: הַכַּפּוֹת
  choice: чаши
  rationale: כַּף может обозначать небольшой сосуд, чашу или ложкообразную ёмкость; «чаши» естественно звучит в перечне храмовой утвари, не задавая чрезмерно узкой формы.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: всю бронзовую утварь
  rationale: כְּלִים — широкое обозначение сосудов, орудий и предметов; собирательное «утварь» уместно для храмового инвентаря, а נְחֹשֶׁת здесь передано как «бронзовая».
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: которой совершали служение
  rationale: שרת в культовом контексте обозначает храмовое служение. Безлично-неопределённая конструкция сохраняет невыраженный в тексте субъект и звучит естественно по-русски.
- source_word: לָקָחוּ
  choice: они унесли
  rationale: В контексте разграбления храма «унесли» естественно передаёт не просто взятие, но удаление предметов.
