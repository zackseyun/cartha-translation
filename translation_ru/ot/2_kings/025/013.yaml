  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: ru
  text: Бронзовые столбы, находившиеся в доме Яхве, подставки[a] и бронзовое море, находившееся в доме Яхве, халдеи[b] разбили на куски и унесли их бронзу в Вавилон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «основания» — опорные конструкции для храмовых умывальниц.
    reason: lexical_alternative
  - marker: b
    text: Здесь «халдеи» — вавилонские войска.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: медные столбы
  rationale: עַמּוּדִים обозначает столбы или колонны; «столбы» естественно для храмового контекста. נְחֹשֶׁת передано как «медь» в соответствии с устойчивой русской библейской терминологией для храмовой утвари, хотя слово может обозначать медь или бронзу.
- source_word: אֲשֶׁר בֵּית יְהוָה / אֲשֶׁר בְּבֵית יְהוָה
  choice: находившиеся в доме Яхве
  rationale: В первой относительной конструкции предлог отсутствует, но контекст и параллельная вторая конструкция с בְּ указывают на местонахождение предметов; глагол «находились» восполняет безглагольную еврейскую фразу естественным русским оборотом.
- source_word: הַמְּכֹנוֹת
  choice: подставы
  rationale: מְכֹנוֹת — опорные конструкции храмовых умывальниц. «Подставы» конкретно и достаточно ясно передаёт назначение; вариант «основания» отмечен в сноске.
- source_word: יָם הַנְּחֹשֶׁת
  choice: медное Море
  rationale: Сохранено буквальное наименование большого храмового бассейна — «Море»; прописная буква показывает, что это название определённого предмета храмовой утвари.
- source_word: שִׁבְּרוּ
  choice: разбили на куски
  rationale: Форма от שׁבר описывает разламывание крупных металлических предметов, очевидно для последующей перевозки; «разбили на куски» передаёт эту практическую направленность.
- source_word: כַשְׂדִּים
  choice: халдеи
  rationale: Прямо сохраняет этноним исходного текста; в данном историческом контексте речь идёт о вавилонских войсках, что пояснено в сноске.
- source_word: וַיִּשְׂאוּ
  choice: и унесли
  rationale: נשא с указанием пункта назначения означает перенос или вывоз добычи; «унесли» естественно выражает удаление предметов с места.
- source_word: נְחֻשְׁתָּם
  choice: их медь
  rationale: Местоименный суффикс множественного числа отсылает к перечисленным и разбитым предметам; буквальная связь сохранена без уточняющего толкования.
- source_word: בָּבֶלָה
  choice: в Вавилон
  rationale: Направительный суффикс ה передаёт движение к Вавилону; по-русски нормативно «в Вавилон».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, обозначенное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» сохраняет имя и является современной научно обоснованной русской передачей, тогда как «Господь» заменяет его титулом, а «Иегова» отражает позднюю смешанную вокализацию.
- issue: Идентификация халдеев
  choice: халдеи в основном тексте с пояснением о вавилонских войсках
  alternative: вавилоняне
  rationale: Сохраняется конкретный этноним כַשְׂדִּים без сведения его к более общему историческому обозначению; необходимая читателю идентификация дана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Прямой порядок еврейской фразы слегка упорядочен для ясности, но вынесенный перечень предметов и последующее действие халдеев сохранены. Термины «Море» и «Яхве» сохраняют предметную и именословную специфику оригинала.
