  terminology: «Яхве» последовательно передаёт тетраграмматон. «Халдеи» сохраняет этноним כַשְׂדִּים; сноска корректно поясняет его историческую референцию. «Подставки» — естественный эквивалент מְכֹנוֹת, с вариантом «основания» в сноске.
