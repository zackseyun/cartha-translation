  source_fidelity: 'Смысловой состав и синтаксические связи переданы верно: названы бронзовые храмовые предметы, их разрушение халдеями и вывоз металла в Вавилон. Однако «подставы» в современном русском имеет заметный разговорный оттенок («подстава») и хуже передаёт нейтральное название храмовой утвари. Нехошет в данном описании храмового металла уместнее передать как «бронза»; это также согласуется с английской аудиторской основой.'
