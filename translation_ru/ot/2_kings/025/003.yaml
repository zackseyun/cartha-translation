  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: ru
  text: В девятый день месяца голод в городе усилился, и у народа страны[b] не было хлеба[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не было пищи»: слово «хлеб» может обозначать пищу вообще.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «народ страны» (буквально «народ земли») в некоторых контекстах может означать простой народ или местное население.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: В девятый день месяца
  rationale: 'В еврейском тексте буквально: «в девятый [день] месяца». Слово «день» естественно восполняет подразумеваемое существительное и ясно передаёт дату.'
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: голод ... усилился
  rationale: Глагол חזק означает «стать сильным, усилиться»; при существительном «голод» современное русское «усилился» точно и естественно передаёт ухудшение положения.
- source_word: בָּעִיר
  choice: в городе
  rationale: Прямой и естественный перевод предложного сочетания.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: не было хлеба
  rationale: Сохранён конкретный образ исходного слова לֶחֶם «хлеб», которое также может обозначать пищу вообще.
- source_word: לְעַם הָאָרֶץ
  choice: у народа земли
  rationale: Буквально сохраняет неоднозначное выражение עַם הָאָרֶץ, не сужая его без необходимости до «простого народа» или иной социальной группы.
