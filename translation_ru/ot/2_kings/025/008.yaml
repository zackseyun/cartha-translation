source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֞א נְבוּזַרְאֲדָ֧ן רַב טַבָּחִ֛ים עֶ֥בֶד מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: ru
  text: В пятый месяц, в седьмой день месяца, — это был девятнадцатый год царствования Навуходоносора, царя Вавилона, — в Иерусалим пришёл Навузардан, начальник стражи[a], слуга вавилонского царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начальник убивающих»; вероятно, титул начальника царской стражи или исполнителей казней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: В пятый месяц
  rationale: Русская повествовательная связь понятна из контекста и не требует буквального начального «И»; порядковое обозначение месяца сохранено без попытки назвать его.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: в седьмой день месяца
  rationale: Слово «день» естественно восполняется в русской формуле даты и точно передаёт смысл еврейского выражения.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: это был девятнадцатый год царствования Навуходоносора
  rationale: Местоименная конструкция передана как пояснение к дате, а ל выражает отсчёт по годам правления; «год царствования» естественно передаёт эту регнальную формулу.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона / вавилонский царь
  rationale: Обе русские формы естественно передают одну и ту же еврейскую конструкцию; во втором случае прилагательное помогает избежать тяжёлого повтора.
- source_word: בָּא
  choice: пришёл
  rationale: Обычный повествовательный смысл глагола בוא сохранён без усиления до «прибыл».
- source_word: נְבוּזַרְאֲדָן
  choice: Навузардан
  rationale: Использована укоренившаяся русская библейская передача имени, близкая к еврейской форме.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: В придворном контексте это устойчивое должностное обозначение начальника царской охраны или исполнителей казней; буквальная образность разъяснена в сноске.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: слуга вавилонского царя
  rationale: «Слуга» сохраняет широкий диапазон עֶבֶד — подчинённый, служитель или должностное лицо — и не сужает значение до раба либо чиновника.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Принята стандартная русская форма названия города.
