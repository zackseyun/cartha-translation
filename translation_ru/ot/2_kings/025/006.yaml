base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: ru
  text: Тогда царя схватили и отвели в Ривлу к царю Вавилона, и там ему вынесли приговор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорили с ним суд» — еврейское выражение, означающее объявление судебного решения.'
    reason: Сноска сохраняет необычную форму исходной идиомы, тогда как основной текст передаёт её естественным современным русским выражением.
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: схватили
  rationale: В данном контексте תפשׂ означает задержать бегущего царя; «схватили» ясно передаёт насильственное пленение и звучит естественно по-русски.
- source_word: הַמֶּלֶךְ
  choice: царя
  rationale: Определённая форма указывает на уже упомянутого царя Седекию; имя не добавлено, чтобы сохранить способ обозначения в еврейском тексте.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: отвели
  rationale: Форма от עלה буквально содержит идею движения вверх, но в русском «отвели в Ривлу к царю» естественно передаёт доставление пленника; «повели вверх» здесь было бы неясным и неидиоматичным.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: к царю Вавилона
  rationale: Прямо передаёт אֶל как направление движения и сохраняет еврейскую конструкцию титула без пояснительного «на суд к».
- source_word: רִבְלָתָה
  choice: в Ривлу
  rationale: Направительное окончание у названия места выражает движение к Ривле; русский винительный падеж естественно сохраняет этот смысл.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: ему вынесли приговор
  rationale: Это судебная идиома, а не обычная беседа. Выражение «вынесли приговор» ясно передаёт юридический смысл, тогда как буквальная калька была бы неестественной.
