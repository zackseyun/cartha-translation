  source_fidelity: «Царя схватили» точно передаёт וַיִּתְפְּשׂוּ. «Отвели в Ривлу к царю Вавилона» естественно выражает доставление пленного к вавилонскому царю и сохраняет направительное значение רִבְלָתָה; не переданная отдельно пространственная оттеночность עלה («вверх») в современном русском здесь не требует неестественной кальки. «Ему вынесли приговор» верно передаёт судебный смысл идиомы וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט.
