  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: ru
  text: 'И случилось: в тридцать седьмом году изгнания Иехонии, царя Иудеи, в двенадцатом месяце, в двадцать седьмой день месяца, Евил-Меродах, царь Вавилона[b], в год своего царствования[c] поднял голову Иехонии, царя Иудеи[a], освободив его из тюрьмы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднял голову Иехонии». Это еврейское выражение означает, что царь возвысил его положение или оказал ему милость; в данном случае это включает освобождение из тюрьмы.'
    reason: lexical_alternative
  - marker: b
    text: Евил-Меродах известен в исторических источниках также под именем Амель-Мардук.
    reason: cultural_note
  - marker: c
    text: Выражение «в год своего царствования» может означать «в первый год своего царствования».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Краткая повествовательная формула сохраняет функцию еврейского wayyiqtol и звучит в современном русском тексте торжественно, но не чрезмерно архаично.
- source_word: לְגָלוּת
  choice: изгнания
  rationale: גָּלוּת обозначает изгнание или состояние после насильственного переселения; «изгнание» естественно в данном хронологическом обороте.
- source_word: יְהוֹיָכִין
  choice: Иехония
  rationale: Устоявшаяся русская библейская форма имени царя.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: в двенадцатый месяц
  rationale: Естественная русская передача еврейской формулы даты.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: в двадцать седьмой день месяца
  rationale: Ясно и близко к формальной структуре исходного выражения.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Евил-Меродах
  rationale: Сохранена традиционная библейская форма имени; историческая аккадская форма приведена в примечании.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: в год своего воцарения
  rationale: Передаёт буквальное «в год его царствования/воцарения», не добавляя прямо отсутствующее в масоретском тексте числительное «первый».
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: поднял голову
  rationale: Сохранён выразительный еврейский образ; его значение в контексте разъяснено в примечании.
- source_word: מִבֵּית כֶּלֶא
  choice: освободив его из тюрьмы
  rationale: Контекстуально естественно передаёт исход из места заключения и присоединяет этот смысл к идиоме, не превращая русскую фразу в неясное «поднял голову из тюрьмы».
