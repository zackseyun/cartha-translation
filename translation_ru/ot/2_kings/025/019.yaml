    rationale: В обоих случаях исходный текст говорит о людях, которые «были найдены» в городе. «Находились» передаёт лишь местонахождение и не сохраняет пассивно-повествовательный смысл.
  - severity: low
    issue: Конструкция о пяти людях допускает ошибочное согласование.
    rationale: В варианте «пятерых из тех, кто видел лицо царя и находился в городе» единственное число после «кто» формально возможно, но при названных пяти людях звучит неясно. Причастный оборот во множественном числе однозначно относится к пятерым.
