  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: ru
  text: Из города он взял одного сановника[a], поставленного над воинами, пятерых из числа видевших лицо царя[b], обнаруженных в городе, писца — начальника войска, набиравшего народ страны[c], — и шестьдесят человек из народа страны, обнаруженных в городе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнуха»; еврейское слово может обозначать как евнуха в буквальном смысле, так и высокопоставленного должностного лица.'
    reason: lexical_alternative
  - marker: b
    text: «Видеть лицо царя» — еврейское выражение о людях, имевших непосредственный доступ к царю, вероятно о придворных или царских приближённых.
    reason: cultural_note
  - marker: c
    text: 'Или: «вносившего в списки» либо «призывавшего на военную службу народ страны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: сановник
  rationale: Слово может обозначать как евнуха, так и высокопоставленного должностного лица. «Сановник» естественно передаёт официальный статус, не утверждая физического состояния человека.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: поставленный над воинами
  rationale: Сохраняет значение назначенного начальника и военный характер выражения, оставаясь понятным современному читателю.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: из тех, кто видел лицо царя
  rationale: Буквально сохраняет придворную идиому, обозначающую людей, имевших непосредственный доступ к царю; значение пояснено в сноске.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: писца — начальника войска
  rationale: Передаёт сжатое еврейское приложение, сохраняя оба обозначения одного упомянутого лица и не превращая писца без достаточных оснований в секретаря другого начальника.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: набиравшего народ страны
  rationale: Причастие породы hифиль указывает на набор или созыв людей для военной службы. «Набиравшего» сохраняет военно-административный смысл, не утверждая однозначно принудительный призыв.
- source_word: עַם הָאָרֶץ
  choice: народ страны
  rationale: Буквальная передача сохраняет возможный широкий смысл населения страны и его социальный оттенок, не сужая выражение до простонародья.
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: находился / находившихся
  rationale: 'В контексте падения города русское «находился» естественно передаёт результативное значение еврейской пассивной формы: эти люди были обнаружены или оставались в городе.'
- source_word: לָקַח
  choice: взял
  rationale: Соответствует обычному значению глагола и позволяет контексту показать, что речь идёт о взятии людей под стражу, не усиливая глагол до «схватил».
