revisions:
- from: Из города он взял одного сановника[a], поставленного над воинами, пятерых из тех, кто видел лицо царя[b] и находился в городе, писца — начальника войска, набиравшего народ страны[c], — и шестьдесят человек из народа страны, находившихся в городе.
  to: Из города он взял одного сановника[a], поставленного над воинами, пятерых из числа видевших лицо царя[b], обнаруженных в городе, писца — начальника войска, набиравшего народ страны[c], — и шестьдесят человек из народа страны, обнаруженных в городе.
  rationale: Заменены «находился / находившихся» на «обнаруженных», чтобы точно передать пассивную форму מצא и устранить неясное согласование в первой группе. Сноска о «набиравшем» уточнена в соответствии со значением «enrolled». Смысл перечисления, идиома о доступе к царю, повтор «народ страны» и исходная неоднозначность титула писца сохранены.
