  text: וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ הִשְׁאִ֖יר רַב טַבָּחִ֑ים לְ/כֹֽרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: ru
  text: Но некоторых из беднейших жителей страны начальник стражи[a] оставил виноградарями и земледельцами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главный над забойщиками (или палачами)»; здесь это вавилонский воинский титул.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «работниками на полях»; возможен более узкий перевод: «пахарями». Редкое еврейское слово, вероятно, обозначает тех, кто обрабатывает землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלַּת הָאָרֶץ
  choice: Но некоторых из беднейших жителей страны
  rationale: 'Сочетание с מִן имеет разделительное значение: из бедного, неимущего населения страны были оставлены некоторые. «Но» передаёт противопоставление предшествующему рассказу о переселении, а «жителей» естественно выражает подразумеваемых людей.'
- source_word: הִשְׁאִיר
  choice: оставил
  rationale: Порода хифиль глагола שׁאר означает «оставить, позволить остаться». Краткое «оставил» точно и естественно в данном повествовании.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Это придворно-воинский титул Навузардана. Контекстуальный перевод передаёт должность, не создавая ложного впечатления, будто речь идёт об обычных мясниках или забойщиках.
- source_word: לְכֹרְמִים
  choice: виноградарями
  rationale: Слово обозначает людей, занятых выращиванием винограда и уходом за виноградниками.
- source_word: וּלְיֹגְבִים
  choice: и земледельцами
  rationale: Редкое слово обозначает работников, обрабатывающих землю. «Земледельцы» сохраняет широкий сельскохозяйственный смысл и не сводит занятие только к пахоте.
