base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: ru
  text: А остальных людей, оставшихся в городе, перебежчиков, перешедших на сторону царя Вавилона, и прочий народ Невузарадан, начальник стражи,[a] увёл в изгнание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начальник убивающих»; вероятно, официальный титул начальника царской стражи.'
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: остальных людей, остававшихся в городе
  rationale: Передаёт остаток населения после осады и прежних бедствий; причастие נִשְׁאָרִים естественно выражено как «остававшихся».
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: перебежчиков, перешедших на сторону царя Вавилона
  rationale: Военно-политическая идиома נפל על означает переход на сторону другого правителя; сочетание сохраняет повтор исходного текста, но ясно передаёт смысл по-русски.
- source_word: יֶתֶר הֶהָמוֹן
  choice: прочий народ
  rationale: הָמוֹן обозначает массу или множество людей. «Прочий народ» звучит естественно и не уточняет социальную группу, не названную в еврейском тексте.
- source_word: הֶגְלָה
  choice: увёл в изгнание
  rationale: Hiphil от גלה означает принудительно переселить, отправить в изгнание; формулировка сохраняет идею насильственного перемещения.
- source_word: נְבוּזַרְאֲדָן
  choice: Невузарадан
  rationale: Традиционная и узнаваемая русская передача имени.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Функциональная передача вавилонского придворно-военного титула; буквальное «начальник убивающих» могло бы ввести современного читателя в заблуждение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сохраняет вынесенный вперёд ряд объектов еврейского предложения, а должность и подлежащее располагаются перед сказуемым. Идиома о переходе к вавилонскому царю передана ясно, без буквального и вводящего в заблуждение образа падения.
