base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: ru
  text: И царь Вавилона поразил их и предал смерти в Ривле, в земле Хамата.[a] Так Иудея была уведена в изгнание со своей земли.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст употребляет подряд два глагола: «поразил их» и «предал смерти»; всё выражение можно также передать: «убил их».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Так Иудея ушла в изгнание со своей земли». В данном контексте еврейский глагол допускает активную или пассивную передачу; пассивная форма подчёркивает насильственную депортацию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: поразил их
  rationale: Сохраняет самостоятельное значение נכה («ударить, поразить») перед следующим глаголом, прямо обозначающим причинение смерти.
- source_word: וַיְמִיתֵם
  choice: предал смерти
  rationale: Передаёт каузативное значение формы Hiphil от מות — «умертвить, предать смерти» — и не сводит два последовательных еврейских глагола к одному.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Естественная русская передача сопряжённой конструкции.
- source_word: בְּרִבְלָה
  choice: в Ривле
  rationale: Обычная русская конструкция для обозначения места события; форма топонима согласована с принятой библейской традицией.
- source_word: בְּאֶרֶץ חֲמָת
  choice: в земле Хамата
  rationale: Близко передаёт географическое выражение, сохраняя слово «земля» и название Хамат.
- source_word: וַיִּגֶל
  choice: была уведена в изгнание
  rationale: Передаёт изгнание как насильственное переселение, при этом сохраняет Иудею грамматическим субъектом и метонимическую ёмкость оригинала.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: Сохраняет компактность названия страны и его метонимическое указание на народ, не добавляя пояснение непосредственно в текст.
- source_word: מֵעַל אַדְמָתוֹ
  choice: со своей земли
  rationale: В контексте национального изгнания אדמה естественно означает родную землю; возвратное местоимение ясно соотносит её с Иудеей.
theological_decisions:
- issue: Грамматическая перспектива изгнания Иудеи в וַיִּגֶל
  choice: была уведена в изгнание
  alternative: ушла в изгнание
  rationale: Форма допускает буквальную активную передачу, однако контекст насильственной депортации поддерживает русскую пассивную конструкцию. В сноске сохранена возможная альтернативная перспектива.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксический повтор «поразил… и предал смерти» намеренно сохранён как особенность исходного текста; архаизмы вроде «умертвил» и «пленён» не использованы.
