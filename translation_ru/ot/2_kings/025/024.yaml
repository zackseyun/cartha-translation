base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: ru
  text: 'Гедалия поклялся им и их людям[a] и сказал: «Не бойтесь слуг халдеев[b]. Живите в стране, служите царю Вавилона — и вам будет хорошо».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и их воинам». Еврейское выражение буквально означает «их людям» и не уточняет их положение.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «слуги халдеев» может здесь означать представителей или чиновников вавилонской власти. Халдеи в данном контексте — вавилоняне.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: поклялся
  rationale: Нифаль глагола שׁבע обычно означает «клясться, давать клятву». «Поклялся» точно и естественно передаёт форму исходного текста.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: и их людям
  rationale: Буквально — «и их мужам/людям». В контексте речь идёт о людях, состоявших при военачальниках, но исходный текст не уточняет, были ли это исключительно воины.
- source_word: אַל תִּירְאוּ
  choice: не бойтесь
  rationale: Естественная русская передача отрицательного повеления с глаголом ירא.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: слуг халдеев
  rationale: עֲבָדִים буквально значит «слуги», хотя здесь слово может обозначать представителей или чиновников вавилонской власти. Предлог מִן после глагола страха передан русским родительным падежом.
- source_word: הַכַּשְׂדִּים
  choice: халдеев
  rationale: Сохранён еврейский этноним «халдеи»; в данном историческом контексте он относится к вавилонянам.
- source_word: שְׁבוּ בָאָרֶץ
  choice: живите в этой земле
  rationale: ישׁב может означать «сидеть», «жить», «оставаться». Здесь речь о продолжении жизни в стране; указательное «этой» естественно передаёт определённость בָאָרֶץ в данном контексте.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: служите царю Вавилона
  rationale: עבד с личным прямым дополнением означает «служить» и в политическом контексте подразумевает подчинение царской власти, не сводясь к одному лишь «работать».
- source_word: וְיִטַב לָכֶם
  choice: и вам будет хорошо
  rationale: Еврейский безличный оборот обещает благоприятный исход. Русская формулировка проста и сохраняет широту смысла.
