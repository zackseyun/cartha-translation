base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: ru
  text: 'Два столба, одно Море и подставки, которые Соломон сделал для дома Яхве: вес меди всех этих предметов не был определён.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не было веса меди всех этих предметов». Это может означать, что медь не взвешивали из-за её огромного количества.'
    reason: Сохраняет лексическую неоднозначность מִשְׁקָל («вес»; в данном контексте также «взвешивание») и поясняет вероятный контекстуальный смысл, не выдавая его за единственно возможный.
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: два столба
  rationale: עַמּוּדִים обозначает архитектурные столбы или колонны; «столбы» — привычное обозначение этих храмовых сооружений.
- source_word: הַיָּם הָאֶחָד
  choice: одно Море
  rationale: יָם здесь — особое название большого бронзового храмового резервуара; прописная буква сохраняет значение названия и буквальный образ еврейского текста.
- source_word: וְהַמְּכֹנוֹת
  choice: подставки
  rationale: מְכֹנוֹת — основания или подставки для храмовых умывальниц; «подставки» ясно передаёт их назначение.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: которые Соломон сделал
  rationale: Простая форма прошедшего времени естественно передаёт относительное придаточное и не добавляет отсутствующего в еврейском тексте временного оттенка.
- source_word: לְבֵית יְהוָה
  choice: для дома Яхве
  rationale: Сохранены буквальный храмовый образ «дом» и личное имя Яхве, стоящее в исходном тексте.
- source_word: לֹא הָיָה מִשְׁקָל
  choice: весу … не было меры
  rationale: Оборот передаёт идиоматический смысл неисчислимого количества, сохраняя образ веса и не утверждая прямо, было ли взвешивание невозможным или просто не производилось.
- source_word: לִנְחֹשֶׁת
  choice: меди
  rationale: נְחֹשֶׁת обозначает медь или медный сплав; традиционное русское «медь» здесь естественно и не навязывает более точный состав сплава, которого текст не указывает.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: всех этих изделий
  rationale: כֵּלִים — широкое обозначение предметов и утвари; «изделия» охватывает и столбы, и Море, и подставки лучше, чем более узкое «сосуды».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Название «Море» выделено прописной буквой как наименование храмового предмета; архаизирующий оборот «весу … не было меры» сохраняет библейскую образность и остаётся прозрачным для современного читателя.
