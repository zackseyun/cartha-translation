  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: ru
  text: 'Когда все военачальники — они и их люди — услышали, что царь Вавилона поставил Гедалию во главе[a], они пришли к Гедалии в Мицпу: Измаил, сын Нефании, Иоханан, сын Карея, Сераия, сын нетофатянина Танхумефа, и Яазания, сын маахатянина, — они и их люди.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначил Гедалию»; еврейский глагол может означать назначение на должность либо поручение надзора и управления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: военачальники
  rationale: Сочетание обозначает начальников военных отрядов; «военачальники» естественно и без излишнего уточнения передаёт их руководящую военную роль.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: они и их люди
  rationale: Сохранён усилительно-уточняющий оборот, отличающий начальников от состоявших при них людей; притяжательное «их» естественно следует из контекста.
- source_word: הִפְקִיד
  choice: поставил во главе
  rationale: Глагол означает назначить или поручить надзор и управление. Формулировка не вводит прямо не названный в стихе титул правителя.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: к Гедалии в Мицпу
  rationale: Название места указывает, куда именно пришли к Гедалии; русская конструкция с направительным винительным естественно передаёт движение.
- source_word: הַנְּטֹפָתִי
  choice: нетофатянин
  rationale: Передано как географическое или этническое обозначение в естественной русской форме.
- source_word: הַמַּעֲכָתִי
  choice: маахатянин
  rationale: Сохранено географическое или этническое обозначение; форма родительного падежа относится к отцу Яазании, как в еврейском тексте.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן
  choice: 'они пришли ...: Измаил ... Иоханан ... Сераия ... и Яазания'
  rationale: Имена раскрывают, кто именно были упомянутые военачальники; двоеточие естественно сохраняет аппозиционную структуру исходного текста.
- source_word: וְאַנְשֵׁיהֶם
  choice: они и их люди
  rationale: Заключительный оборот сохранён, несмотря на повтор, поскольку он обрамляет перечень и подчёркивает присутствие людей при названных начальниках.
