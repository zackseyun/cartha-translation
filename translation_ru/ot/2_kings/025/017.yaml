base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: ru
  text: Высота одной колонны составляла восемнадцать локтей[a]. На ней была бронзовая капитель высотой в три локтя; вокруг неё находилось сетчатое украшение с гранатами — всё из бронзы. На второй колонне было такое же сетчатое украшение с гранатами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Локоть — древняя мера длины, приблизительно 45 сантиметров; восемнадцать локтей — около 8 метров.
    reason: historical_measurement
  - marker: b
    text: 'Заключительная фраза на еврейском эллиптична; буквально: «и подобное этому — у второй колонны, на сетчатом украшении». По смыслу вторая колонна имела такое же убранство.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: высота; высотой
  rationale: Существительное обозначает высоту или вертикальный размер; обе русские формы естественно передают конструкцию исходного текста.
- source_word: עַמּוּד
  choice: колонна
  rationale: В данном описании храмовой архитектуры точный и понятный современный термин «колонна» предпочтительнее более общего «столп».
- source_word: כֹתֶרֶת
  choice: капитель
  rationale: Речь идёт об архитектурно оформленной верхней части колонны; «капитель» — точный современный термин.
- source_word: נְחֹשֶׁת
  choice: бронза; бронзовая
  rationale: В контексте храмовых изделий слово обычно обозначает бронзу или медный сплав; перевод «бронза» соответствует древней материальной культуре и русской библейской традиции.
- source_word: שְׂבָכָה
  choice: сетчатое украшение
  rationale: Слово обозначает декоративную конструкцию наподобие сети; выбранное выражение понятно неспециалисту и сохраняет как форму, так и назначение предмета.
- source_word: רִמֹּנִים
  choice: гранаты
  rationale: Слово буквально означает плоды граната, здесь — украшения в их форме; контекст ясно указывает на декоративные изображения.
- source_word: סָבִיב
  choice: со всех сторон окружали
  rationale: Передаёт круговое расположение украшений вокруг капители естественным русским оборотом.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: всё из бронзы
  rationale: Кратко и непосредственно передаёт, что перечисленные декоративные элементы были бронзовыми.
- source_word: וְכָאֵלֶּה ... עַל הַשְּׂבָכָה
  choice: Такой же была и вторая колонна, включая сетчатое украшение
  rationale: Еврейская заключительная фраза эллиптична. Перевод делает подразумеваемую связь с описанными деталями явной, не добавляя новых предметов.
