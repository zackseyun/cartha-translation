- from: Высота одной колонны была восемнадцать локтей[a]. На ней находилась бронзовая капитель высотой в три локтя; капитель со всех сторон окружали сетчатое украшение и гранаты — всё из бронзы. Такой же была и вторая колонна, включая сетчатое украшение[b].
  to: Высота одной колонны составляла восемнадцать локтей[a]. На ней была бронзовая капитель высотой в три локтя; вокруг неё находилось сетчатое украшение с гранатами — всё из бронзы. На второй колонне было такое же сетчатое украшение с гранатами[b].
  rationale: Исправление ограничивает заключительное утверждение теми декоративными элементами, к которым отсылает эллиптический еврейский текст, и не утверждает без необходимости, что вторая колонна целиком была такой же. Сноска сохраняет буквальную неоднозначность исходной конструкции.
