  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֨י הַ/מִּלְחָמָ֤ה הַ/לַּ֨יְלָה֙ דֶּ֜רֶךְ שַׁ֣עַר בֵּ֣ין הַ/חֹמֹתַ֗יִם אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּ֖לֶךְ דֶּ֥רֶךְ הָ/עֲרָבָֽה־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: ru
  text: Тогда в городе была пробита брешь, и все воины ночью бежали[a] через ворота между двумя стенами, что у царского сада. Халдеи[b] окружали город со всех сторон, а царь[c] пошёл по дороге к Араве[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте после слов «все воины ночью» сказуемое не выражено; «бежали» восполнено по контексту.
    reason: textual_ellipsis
  - marker: b
    text: 'То есть вавилоняне; в еврейском тексте буквально: «халдеи».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «он пошёл». Подлежащее не названо; из контекста следует, что речь идёт о царе.'
    reason: implicit_subject
  - marker: d
    text: Арава — область Иорданской впадины, простирающаяся к югу от Иорданской долины; традиционно название также передают как «равнина».
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: в городе была пробита брешь
  rationale: Форма нифаль глагола בקע в контексте осады означает, что оборона города была прорвана. Русское выражение передаёт военный смысл естественно, не создавая впечатления, будто раскололся сам город.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: воины
  rationale: Краткое современное соответствие буквальному «люди войны», сохраняющее военное значение.
- source_word: הַלַּיְלָה
  choice: ночью
  rationale: Слово употреблено наречно; «ночью» естественно и точно передаёт обстоятельство времени.
- source_word: דֶּרֶךְ שַׁעַר
  choice: через ворота
  rationale: Здесь דֶּרֶךְ обозначает путь выхода; по-русски маршрут через ворота естественнее всего выражается предлогом «через».
- source_word: בֵּין הַחֹמֹתַיִם
  choice: между двумя стенами
  rationale: Двойственное число חֹמֹתַיִם прямо указывает на две стены.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: что у царского сада
  rationale: עַל в данном топографическом описании выражает близость; «у» звучит естественно и не уточняет дистанцию сверх текста.
- source_word: וְכַשְׂדִּים
  choice: халдеи
  rationale: Сохранено конкретное этническое наименование еврейского текста, а не исторически поясняющее «вавилоняне».
- source_word: עַל הָעִיר סָבִיב
  choice: окружали город со всех сторон
  rationale: Передаёт не просто нахождение рядом, а полное окружение, выраженное словом סָבִיב.
- source_word: וַיֵּלֶךְ
  choice: царь пошёл
  rationale: Подлежащее в еврейском не названо, но ближайший контекст повествования указывает на царя; это уточнение отмечено сноской.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: по дороге к Араве
  rationale: Арава сохранена как географическое название; выражение передаёт направление движения, не заменяя топоним общим словом «равнина».
theological_decisions:
- issue: Неявные элементы повествования
  choice: Глагол «бежали» и подлежащее «царь» даны в основном тексте, но отмечены сносками.
  alternative: Оставить эллипсис буквально или написать неопределённое «он пошёл».
  rationale: Русскому предложению необходим сказуемый, а неуточнённое «он» создаёт искусственную двусмысленность. Сноски сохраняют прозрачность относительно краткости и неоднозначности еврейской формы, не превращая контекстуальное восполнение в явно написанное в источнике.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан ясным для обычного читателя, при этом двойственное число «две стены», топоним «Арава» и источникозначимое «халдеи» сохранены. Контекстуально восполненные элементы открыто отмечены сносками.
