base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: ru
  text: Но войско халдеев[a] преследовало царя и настигло его на равнинах Иерихона[b], а всё его войско рассеялось от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вавилонян». В еврейском тексте: «халдеев» — обозначение вавилонских сил в этом контексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в степях Иерихона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: войско халдеев
  rationale: חֵיל в военном повествовании означает войско или военные силы, а כַּשְׂדִּים прямо обозначает халдеев; в данном контексте это вавилонские силы.
- source_word: וַיִּרְדְּפוּ ... אַחַר הַמֶּלֶךְ
  choice: погналось за царём
  rationale: Русское «погналось за» естественно передаёт активное военное преследование и сохраняет конструкцию с אַחַר.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: настигло его
  rationale: נשׂג здесь означает догнать, настичь преследуемого; «настигло» соответствует повествовательному регистру.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: на равнинах Иерихона
  rationale: עֲרָבוֹת обозначает равнинную степную местность; «равнины» понятно современному читателю, а более точная географическая характеристика дана в сноске.
- source_word: וְכָל חֵילוֹ נָפֹצוּ
  choice: а всё его войско разбежалось
  rationale: Множественная форма נָפֹצוּ при собирательном חֵיל представляет воинов как рассеявшихся; «войско разбежалось» естественно передаёт это в русском языке.
- source_word: מֵעָלָיו
  choice: от него
  rationale: Фраза обозначает удаление и разъединение с царём; краткое «от него» сохраняет формальную близость к источнику.
