base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: ru
  text: Навузардан, начальник стражи[b], взял их и привёл к царю Вавилона в Ривле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привёл их пред царя Вавилона в Ривле». Еврейский предлог может подчёркивать, что пленников доставили в присутствие царя.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский титул буквально означает «главный над убивающими (или мясниками)»; вероятно, это название придворной военной или охранной должности, традиционно передаваемое как «начальник стражи».
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное значение לקח точно передаёт действие, не добавляя прямо не выраженного оттенка насильственного захвата; из контекста уже ясно, что эти люди находились во власти вавилонян.
- source_word: נְבוּזַרְאֲדָן
  choice: Навузардан
  rationale: Имя передано в принятой русской библейской форме.
- source_word: רַב טַבָּחִים
  choice: начальник стражи
  rationale: Буквально титул связан с «главой убивающих/палачей», однако в нововавилонском придворном контексте обозначает высокую военную или охранную должность. «Начальник стражи» естественно и понятно передаёт эту функцию; буквальное значение отмечено в сноске.
- source_word: וַיֹּלֶךְ
  choice: привёл
  rationale: Каузативная форма глагола הלך здесь означает, что Навузардан доставил этих людей к месту пребывания царя; русское «привёл» сохраняет образ ведения людей и естественно звучит в контексте.
- source_word: עַל
  choice: к
  rationale: При глаголе движения предлог указывает на доставление к царю, то есть в его присутствие. Возможный более конкретный смысл «пред царём» сохранён в сноске.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямое и естественное соответствие еврейской сопряжённой конструкции.
- source_word: רִבְלָתָה
  choice: в Ривлу
  rationale: Направительный суффикс -ה указывает на движение к Ривле. В русском вся конструкция естественно понимается как приведение к царю, находившемуся в Ривле.
