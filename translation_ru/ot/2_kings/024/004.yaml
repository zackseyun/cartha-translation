source:
  edition: WLC
  text: וְ/גַ֤ם דַּֽם הַ/נָּקִי֙ אֲשֶׁ֣ר שָׁפָ֔ךְ וַ/יְמַלֵּ֥א אֶת יְרוּשָׁלִַ֖ם דָּ֣ם נָקִ֑י וְ/לֹֽא אָבָ֥ה יְהוָ֖ה לִ/סְלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: ru
  text: 'а также за невинную кровь, которую он пролил: он наполнил Иерусалим невинной кровью, и Яхве не пожелал простить.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: а также
  rationale: Сохраняет связь с предыдущим стихом и добавочное значение еврейского сочетания.
- source_word: דַּם הַנָּקִי
  choice: невинную кровь
  rationale: Передаёт устойчивое библейское обозначение крови невинно убитых и связанную с этим вину за кровопролитие.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: которую он пролил
  rationale: Глагол שׁפך в сочетании со словом «кровь» естественно переводится русским выражением «пролить кровь».
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: он наполнил Иерусалим невинной кровью
  rationale: Близко передаёт образ и синтаксический смысл оригинала; двоеточие показывает, что эта фраза поясняет масштаб упомянутого кровопролития, не превращая союз в явно причинный.
- source_word: וְלֹא אָבָה
  choice: и ... не пожелал
  rationale: Сохраняет значение нежелания или отказа, выраженное глаголом אָבָה, не ослабляя категоричности высказывания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לִסְלֹחַ
  choice: простить
  rationale: Ясный и естественный русский эквивалент глагола סלח в контексте Божьего прощения.
theological_decisions:
- issue: Отказ Бога простить вследствие пролития невинной крови
  choice: «Яхве не пожелал простить»
  alternative: «Яхве не простил» или «Яхве не хотел прощать»
  rationale: Формулировка прямо сохраняет трудное богословское утверждение оригинала о нежелании простить, не объясняя его как окончательный отказ вообще и не смягчая его.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «невинную кровь» сохранён как значимый риторический повтор оригинала.
