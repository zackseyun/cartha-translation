base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: ru
  text: Он вынес оттуда[a] все сокровища дома Яхве и сокровища царского дворца и разрубил на части все золотые сосуды, которые Соломон, царь Израиля, изготовил в храме Яхве[b], — как и сказал Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «забрал оттуда» или «увёз оттуда». Здесь речь идёт об удалении сокровищ из храма и дворца.'
    reason: lexical_alternative
  - marker: b
    text: В начале стиха еврейский текст буквально говорит «дом Яхве», а здесь употребляет другое слово, более конкретно обозначающее храмовое здание или святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: Он вынес оттуда
  rationale: Каузативная форма глагола יצא обозначает удаление предметов из места; «вынес» конкретно и естественно передаёт это действие, не исключая последующего увоза как добычи.
- source_word: אוֹצְרוֹת
  choice: сокровища
  rationale: В данном контексте речь идёт прежде всего о ценных предметах, которые были изъяты, а не о помещениях для их хранения.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквально и прозрачно передаёт בֵּית и сохраняет отличие от הֵיכַל далее в стихе.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дворец
  rationale: В этом контексте «дом царя» означает царскую резиденцию; «царский дворец» ясно передаёт смысл по-русски и не создаёт ненужной двусмысленности с династией или царским родом.
- source_word: וַיְקַצֵּץ
  choice: разрубил на части
  rationale: Порода пиэль глагола קצץ выражает физическое рассечение или разрубание; перевод сохраняет конкретность и силу действия.
- source_word: כְּלֵי הַזָּהָב
  choice: золотые сосуды
  rationale: כְּלִי — широкое обозначение предмета или утвари; в храмовом контексте «сосуды» является естественным и традиционно понятным эквивалентом.
- source_word: עָשָׂה
  choice: изготовил
  rationale: Глагол указывает на создание храмовых сосудов; «изготовил» звучит естественнее применительно к предметам утвари, чем общее «сделал».
- source_word: בְּהֵיכַל יְהוָה
  choice: в храме Яхве
  rationale: הֵיכַל здесь обозначает храмовое здание или святилище; «храм» сохраняет его отличие от более общего בֵּית в начале стиха.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: как и сказал Яхве
  rationale: Формула указывает на исполнение ранее произнесённого слова; частица «и» естественно подчёркивает соответствие события сказанному, не уточняя сверх текста, через кого оно было возвещено.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблено личное имя Бога, поэтому транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Связь разграбления с ранее сказанным словом Яхве
  choice: как и сказал Яхве
  alternative: как и предсказал Яхве
  rationale: Перевод сохраняет утверждение об исполнении Божьего слова, но не вводит отсутствующий в данном стихе глагол «предсказать» и не определяет явно способ его возвещения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся близким к последовательности еврейского текста, но «царский дворец» выбран вместо потенциально двусмысленного «дом царя». Личное имя передано как «Яхве».
