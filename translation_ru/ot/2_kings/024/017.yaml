  text: וַ/יַּמְלֵ֧ךְ מֶֽלֶךְ בָּבֶ֛ל אֶת מַתַּנְיָ֥ה דֹד֖/וֹ תַּחְתָּ֑י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ צִדְקִיָּֽהוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: ru
  text: И царь Вавилона поставил царём[a] вместо Иехонии его дядю Матфанию и изменил его имя на Седекию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воцарил». Форма древнееврейского глагола указывает, что царь Вавилона возвёл Матфанию на престол.'
    reason: Передаёт каузативное значение глагола וַיַּמְלֵךְ и поясняет характер назначения.
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: поставил царём
  rationale: Каузативная порода глагола מלך означает, что вавилонский царь возвёл Матфанию на престол; выбранная формулировка естественно и точно передаёт это значение по-русски.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямой и привычный перевод древнееврейского сочетания в сопряжённой форме.
- source_word: מַתַּנְיָה
  choice: Матфания
  rationale: Использована традиционная русская библейская форма личного имени.
- source_word: דֹדוֹ
  choice: его дядю
  rationale: В данном историческом контексте דּוֹד обозначает дядю Иехонии. Порядок слов по-русски ясно связывает местоимение с Иехонией, а не с царём Вавилона.
- source_word: תַּחְתָּיו
  choice: вместо Иехонии
  rationale: Выражение обозначает замещение на престоле. Имя Иехонии повторено вместо местоимения, чтобы устранить возможную для русского читателя неясность референта.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: изменил его имя
  rationale: Сочетание глагола סבב со словом «имя» идиоматически означает перемену имени; перевод сохраняет явно названный в древнееврейском тексте объект.
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Использована традиционная русская библейская форма имени.
