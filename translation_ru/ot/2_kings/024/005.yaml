base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Остальные дела Иоакима и всё, что он сделал, разве не записаны в книге летописей царей Иудеи[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в анналах царей Иудеи». Еврейское название обозначает царский письменный источник, неоднократно упоминаемый в книгах Царств, а не обязательно канонические книги Паралипоменон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: остальные дела
  rationale: В итоговой царской формуле сочетание обозначает прочие сведения о деяниях царя; «остальные дела» естественно передаёт этот смысл по-русски.
- source_word: יְהוֹיָקִים
  choice: Иоаким
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он сделал
  rationale: Прямо передаёт широкое значение исходного выражения, не уточняя характер поступков.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны
  rationale: Сохраняет форму риторического вопроса; «записаны» естественно для ссылки на письменный источник.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: в Книге летописей царей Иудеи
  rationale: Передаёт название царского письменного источника современным и понятным русским выражением; предлог «в» идиоматичен при указании места записи.
theological_decisions:
- issue: Отождествление упомянутого источника с канонической книгой
  choice: Не отождествлять; пояснить в сноске, что речь идёт о царском источнике
  alternative: Понимать название как прямую ссылку на канонические книги Паралипоменон
  rationale: Формула в книгах Царств указывает на отдельный царский письменный источник; сам еврейский текст не требует его отождествления с канонической книгой.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной библейской прозы. Риторический вопрос и архивная формула оригинала сохранены; лишний временной или дискурсивный маркер в начале не добавлен.
