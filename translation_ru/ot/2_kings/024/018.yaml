    issue: Неоднозначная связь оборота «из Ливны».
    rationale: Фраза «она была дочерью Иеремии из Ливны» формально допускает прочтение, при котором происхождение из Ливны приписывается Хамуталь. В оригинале определение следует за «Иеремии» и обозначает Иеремию как человека из Ливны. Явная русская формулировка устраняет эту неоднозначность.
  revised_text: Седекии был двадцать один год, когда он стал царём, и он царствовал в Иерусалиме одиннадцать лет. Его мать звали Хамуталь; она была дочерью Иеремии, который был из Ливны.
