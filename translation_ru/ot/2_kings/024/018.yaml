base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: ru
  text: Седекии был двадцать один год, когда он стал царём, и он царствовал в Иерусалиме одиннадцать лет. Его мать звали Хамуталь; она была дочерью Иеремии, который был из Ливны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: был двадцать один год
  rationale: Естественная русская передача еврейского возрастного оборота, буквально означающего «сын двадцати одного года».
- source_word: בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Инфинитивная конструкция с предлогом בְ обозначает время восшествия на престол.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает правление в качестве царя; выбран прямой и традиционный русский эквивалент.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места с предлогом בְ.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная современная русская передача стандартной царской формулы «имя его матери».
- source_word: חמיטל
  choice: Хамуталь
  rationale: Имя транслитерировано с учётом масоретской огласовки חֲמוּטַל, отражённой в параллельных местах; написание в данном стихе в WLC дано без огласовки.
- source_word: בַּת יִרְמְיָהוּ
  choice: она была дочерью Иеремии
  rationale: Генеалогическое выражение передано явно и естественно по-русски; местоимение устраняет возможную синтаксическую неясность.
- source_word: מִלִּבְנָה
  choice: из Ливны
  rationale: Предлог מִן указывает на происхождение; «из Ливны» естественно связывается с Иеремией, как в еврейской конструкции.
