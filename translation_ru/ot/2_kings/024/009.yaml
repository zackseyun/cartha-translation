source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/009.yaml
  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: ru
  text: И он делал зло в глазах Яхве, во всём поступая так же, как поступал его отец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: И он делал
  rationale: Форма Qal wayyiqtol продолжает повествовательную последовательность. Русское несовершенное «делал» естественно описывает общую оценку поведения царя в период его правления.
- source_word: הָרַע
  choice: зло
  rationale: Субстантивированное прилагательное в устойчивой формуле книг Царей естественно передаётся по-русски существительным «зло».
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранён прозрачный еврейский образ, обозначающий оценку с точки зрения Яхве; выражение понятно и приемлемо в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: כְּכֹל אֲשֶׁר
  choice: во всём … так же, как
  rationale: Такая конструкция естественно выражает и сравнение, и полноту соответствия поступкам отца, заключённые в כְּכֹל אֲשֶׁר.
- source_word: עָשָׂה
  choice: поступал
  rationale: В данном контексте עשה относится к образу действий отца; «поступал» избегает тяжёлого повтора «делал … делал» и сохраняет смысл.
- source_word: אָבִיו
  choice: его отец
  rationale: Прямая и естественная передача существительного с суффиксом третьего лица мужского рода.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
- issue: Характер сходства с поступками отца
  choice: во всём поступая так же
  alternative: согласно всему, что сделал его отец
  rationale: כְּכֹל выражает полноту сравнения. Формулировка не уточняет, будто речь идёт о каждом отдельном действии, а сохраняет данную текстом общую оценку образа правления.
translation_notes:
  register: Современный литературный русский с сохранением торжественной библейской формулы «в глазах Яхве». Синтаксис сделан естественным для русского языка без устранения категоричности нравственной оценки.
