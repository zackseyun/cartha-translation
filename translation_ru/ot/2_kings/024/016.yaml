base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: ru
  text: Царь Вавилона увёл в Вавилон, в изгнание, всех доблестных воинов — семь тысяч, а также ремесленников и кузнецов[a] — тысячу; все они были могучими людьми, способными сражаться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мастеров и работников по металлу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делающих войну», то есть способных нести военную службу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: доблестных воинов
  rationale: Сочетание обозначает сильных, способных и пригодных к военной службе мужчин; этот перевод сохраняет военный оттенок и звучит естественно по-русски.
- source_word: שִׁבְעַת אֲלָפִים
  choice: семь тысяч
  rationale: Прямой перевод числительного.
- source_word: הֶחָרָשׁ
  choice: ремесленников
  rationale: Слово обозначает искусных мастеров разных ремёсел и не требует уточнения конкретного материала.
- source_word: הַמַּסְגֵּר
  choice: кузнецов
  rationale: Вероятнее всего, речь идёт о мастерах, работавших с металлом; более широкая возможность «работники по металлу» отмечена в сноске.
- source_word: אֶלֶף
  choice: тысячу
  rationale: Число относится к группе ремесленников и кузнецов.
- source_word: הַכֹּל
  choice: всех этих
  rationale: Слово подводит итог перечисленным группам; указательное местоимение ясно связывает обобщение с ними.
- source_word: גִּבּוֹרִים
  choice: сильных мужчин
  rationale: Передаёт основное значение физической силы и военной пригодности, не сливая его полностью со следующим выражением.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: способных воевать
  rationale: Естественная русская передача идиомы, буквально означающей «делающие войну» и указывающей на способность нести военную службу.
- source_word: וַיְבִיאֵם
  choice: увёл их
  rationale: В контексте насильственного переселения «увёл» естественно передаёт действие царя над пленниками.
- source_word: גּוֹלָה
  choice: в изгнание
  rationale: Существительное употреблено обстоятельственно и обозначает состояние насильственно переселённых людей.
- source_word: בָּבֶלָה
  choice: в Вавилон
  rationale: Направительный суффикс указывает на движение к Вавилону.
