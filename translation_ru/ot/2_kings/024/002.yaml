source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: ru
  text: И послал Яхве против него отряды[a] халдеев, отряды Арама[b], отряды Моава и отряды аммонитян. Он послал их против Иудеи, чтобы уничтожить её[c], — по слову Яхве, которое Он изрёк через Своих рабов пророков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разбойничьи отряды», «отряды, совершавшие набеги».'
    reason: lexical_alternative
  - marker: b
    text: Евр. «Арам»; традиционное название — «Сирия».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «уничтожить его», то есть Иоакима, а не Иудею.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: послал
  rationale: Обычное повествовательное значение глагола שלח; передаёт целенаправленное действие Яхве без дополнительного истолкования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: בּוֹ
  choice: против него
  rationale: В сочетании с глаголом «послал» и в военном контексте предлог выражает враждебную направленность против Иоакима.
- source_word: גְּדוּדֵי
  choice: отряды
  rationale: Обозначает отдельные вооружённые формирования, вероятно совершавшие набеги; «отряды» естественно по-русски и не создаёт впечатления полноценных национальных армий.
- source_word: כַשְׂדִּים
  choice: халдеев
  rationale: Сохраняет конкретный этноним исходного текста, не заменяя его более общим обозначением «вавилоняне».
- source_word: אֲרָם
  choice: Арама
  rationale: Следует еврейскому географическому и этническому названию; традиционное «Сирия» дано как пояснительная альтернатива в сноске.
- source_word: בְנֵי עַמּוֹן
  choice: аммонитян
  rationale: Естественный русский этноним для буквального выражения «сыновья Аммона».
- source_word: וַיְשַׁלְּחֵם
  choice: Он послал их
  rationale: Сохраняет повтор глагола в исходном тексте, подчёркивающий переход от перечисления отрядов к цели их посылания.
- source_word: בִּיהוּדָה
  choice: против Иудеи
  rationale: Хотя предлог допускает пространственное «в Иудею», контекст враждебного военного действия естественно передаётся выражением «против Иудеи».
- source_word: לְהַאֲבִידוֹ
  choice: чтобы уничтожить её
  rationale: Женский род русского местоимения соотнесён с Иудеей как царством и землёй. Возможное отнесение еврейского суффикса к Иоакиму сохранено в сноске.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Кратко и естественно сохраняет формулу исполнения ранее возвещённого слова Яхве.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: через Своих рабов пророков
  rationale: Еврейское «рукой» здесь является устойчивым обозначением посредничества; по-русски оно естественно передаётся предлогом «через».
theological_decisions:
- issue: К кому относится местоименный суффикс в לְהַאֲבִידוֹ
  choice: 'Основной текст понимает объектом уничтожения Иудею: «уничтожить её».'
  alternative: 'Суффикс может относиться к Иоакиму: «уничтожить его».'
  rationale: Непосредственно перед инфинитивом названа Иудея, а контекст говорит о суде над ней; при этом форма мужского рода в еврейском допускает отнесение к Иоакиму, поэтому подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксический повтор «послал» и четырёхкратное «отряды» сохранён ради ритма и смыслового акцента исходного текста; архаизмы сведены к минимуму.
