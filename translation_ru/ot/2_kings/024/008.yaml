- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: Иехонии было восемнадцать лет
  rationale: Стандартная древнееврейская формула указания возраста передана естественной современной русской конструкцией.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
