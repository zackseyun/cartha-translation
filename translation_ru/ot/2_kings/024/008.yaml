- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места царствования.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная современная русская передача древнееврейской именной формулы.
- source_word: נְחֻשְׁתָּא
  choice: Нехушта
  rationale: Транслитерация личного имени, близкая к древнееврейскому звучанию и понятная в русской библейской традиции.
- source_word: בַת אֶלְנָתָן
  choice: дочерью Елнафана
  rationale: Конструкция сопряжённого состояния прямо выражает родство.
- source_word: מִירוּשָׁלִָם
  choice: из Иерусалима
  rationale: Предлог מִן передаёт происхождение; буквальное значение сохранено, а возможная синтаксическая неоднозначность отмечена в сноске.
