    rationale: Финальное מִירוּשָׁלָם в генеалогической формуле допускает более широкое отнесение; английский аудиторский след также отмечает альтернативное понимание «из/от Иерусалима». Нужна нейтральная формулировка и сноска, не утверждающая один разбор.
