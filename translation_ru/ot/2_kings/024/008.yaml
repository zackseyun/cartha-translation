    rationale: В WLC стоит יהויכין (Йехояхин). «Иехония» — допустимое традиционное/вариантное обозначение этого царя, но для оптимально-эквивалентного перевода безопаснее передать форму, представленную здесь в оригинале.
  - severity: medium
