source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: ru
  text: В то время слуги Навуходоносора, царя Вавилона, выступили против Иерусалима[a], и город оказался в осаде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялись к Иерусалиму». Еврейский глагол может указывать и на подъём к городу, и на военное наступление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и город был осаждён». Более буквально: «и город вошёл в осаду», что может подчёркивать начало осады.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Естественно передаёт указание на исторический период и сохраняет дейктическую силу еврейского выражения.
- source_word: עָלָה
  choice: выступили против
  rationale: Глагол буквально означает «подняться, взойти», а здесь описывает военное продвижение к расположенному на возвышенности Иерусалиму. Выбранная формулировка ясно передаёт враждебный контекст, а буквальный пространственный оттенок отмечен в сноске.
- source_word: עַבְדֵי
  choice: слуги
  rationale: Сохраняет прямое значение слова и не уточняет сверх текста, были ли это военачальники, чиновники или войска царя.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Навуходоносор
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямо передаёт еврейское сочетание титула и названия страны.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма географического названия.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: и город оказался в осаде
  rationale: Естественная русская формулировка, сохраняющая залогово-ингрессивный оттенок буквального «город вошёл в осаду / пришёл в состояние осады».
- source_word: מָצוֹר
  choice: осада
  rationale: Стандартный и ясный русский эквивалент военного термина.
