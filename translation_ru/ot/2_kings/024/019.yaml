base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, во всём поступая так же, как Иоаким.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Устойчивое древнееврейское сочетание означает совершать то, что нравственно дурно. Русское «делал зло» естественно передаёт действие и его оценку; несовершенный вид уместен как характеристика правления.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранена исходная метафора оценки с чьей-либо точки зрения; выражение понятно в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное Божье имя, представленное в исходном тексте тетраграмматоном, без замены титулом.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: во всём поступая так же, как
  rationale: Передана полнота соответствия, выраженная כֹּל, и сравнение с поведением Иоакима. Такая конструкция естественнее буквального «согласно всему, что сделал».
- source_word: יְהוֹיָקִים
  choice: Иоаким
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога. Форма «Яхве» передаёт общепринятую научную реконструкцию произношения и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский, сдержанный повествовательный стиль. Сохранена библейская метафора «в глазах Яхве», при этом заключительное сравнение сформулировано естественно и с явной передачей значения полноты כֹּל.
