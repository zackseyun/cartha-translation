  text: בְּ/יָמָ֣י/ו עָלָ֔ה נְבֻכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יְהִי ל֨/וֹ יְהוֹיָקִ֥ים עֶ֨בֶד֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יָּ֖שָׁב וַ/יִּמְרָד בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: ru
  text: В его дни Навуходоносор, царь Вавилона, выступил в поход, и Иоаким на три года стал его слугой[a]. Затем он отвернулся[b] и восстал против него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал его вассалом на три года». Буквально: «стал ему слугой» — политическое выражение, обозначающее подчинение более могущественному правителю.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вернулся» или «повернул назад». Вероятно, глагол указывает на перемену верности, после которой Иоаким восстал против Навуходоносора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: В его дни
  rationale: Сохранён еврейский временной оборот, указывающий на время правления упомянутого царя и не устраняющий местоименную связь, выраженную в исходном тексте.
- source_word: עָלָה
  choice: выступил в поход
  rationale: В данном военно-политическом контексте глагол обозначает движение войска против другой страны; такой перевод звучит естественно по-русски, не уточняя направление или конечную цель похода.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Навуходоносор
  rationale: Традиционная и общеупотребительная русская передача имени вавилонского царя.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Естественная русская передача еврейского сопряжённого сочетания.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: Иоаким ... стал его слугой
  rationale: Повествовательная форма выражает переход в состояние подчинения, поэтому выбрано «стал», а не статичное «был».
- source_word: עֶבֶד
  choice: слугой
  rationale: Слово буквально означает слугу или раба, но здесь обозначает политическое подчинение царя более могущественному правителю. Основной текст сохраняет образ исходного языка, а историческое значение поясняется в сноске.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: на три года
  rationale: Естественное русское выражение продолжительности установившегося подчинения.
- source_word: וַיָּשָׁב
  choice: Затем он отвернулся
  rationale: Глагол буквально означает «повернуться, вернуться» и здесь, вероятно, передаёт перемену политической верности. «Отвернулся» сохраняет образ поворота и естественно вводит последующее восстание.
- source_word: וַיִּמְרָד בּוֹ
  choice: восстал против него
  rationale: Глагол с предлогом обозначает мятеж или отказ подчиняться верховному правителю; «восстал против» ясно и естественно передаёт этот смысл.
