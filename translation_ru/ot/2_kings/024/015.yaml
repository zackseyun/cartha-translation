  text: וַ/יֶּ֥גֶל אֶת יְהוֹיָכִ֖ין בָּבֶ֑לָ/ה וְ/אֶת אֵ֣ם הַ֠/מֶּלֶךְ וְ/אֶת נְשֵׁ֨י הַ/מֶּ֜לֶךְ וְ/אֶת סָרִיסָ֗י/ו וְ/אֵת֙ אולי הָ/אָ֔רֶץ הוֹלִ֛יךְ גּוֹלָ֥ה מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: ru
  text: Он переселил Иехонию в Вавилон, а вместе с ним — мать царя[a], жён царя, его придворных[b] и влиятельных людей страны[c]. Он увёл их из Иерусалима в Вавилон, в изгнание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царицу-мать». Еврейский текст буквально говорит: «мать царя»; эти слова могут также пониматься как обозначение её положения при дворе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его евнухов». Еврейское слово может обозначать как евнухов в собственном смысле, так и царских придворных или сановников.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «могущественных людей страны» или «знатных людей страны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Он переселил
  rationale: Порода hифиль глагола גלה означает принудительное удаление в изгнание. «Переселил» передаёт действие правителя и не дублирует буквально последующее выражение об изгнании.
- source_word: בָּבֶלָה
  choice: в Вавилон
  rationale: Направительный ה указывает на движение к Вавилону; русский винительный с предлогом «в» естественно выражает направление.
- source_word: אֵם הַמֶּלֶךְ
  choice: мать царя
  rationale: Сохранена буквальная родственная формулировка еврейского текста без превращения её в однозначный придворный титул.
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: жён царя
  rationale: Переданы множественное число и повтор слова «царь», присутствующий в еврейском тексте.
- source_word: סָרִיסָיו
  choice: его придворных
  rationale: סָרִיס может обозначать как евнуха, так и царского служащего. В основном тексте передана придворная функция, а более узкое значение отмечено в сноске.
- source_word: אֵילֵי הָאָרֶץ
  choice: влиятельных людей страны
  rationale: Выражение обозначает могущественных или видных представителей страны. Такой перевод естественен по-русски и передаёт их общественное положение, не уточняя его сверх текста.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: Он увёл их … в изгнание
  rationale: Сочетание каузативной формы הלך с גּוֹלָה выражает принудительное отправление людей в изгнание; перевод сохраняет явное упоминание изгнания.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: из Иерусалима в Вавилон
  rationale: Предлоги и направительная форма ясно обозначают исходный пункт и место назначения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Двухчастное построение сохраняет повторное описание переселения в исходном тексте; тире делает длинное перечисление ясным. Лексическая неоднозначность придворного термина и обозначения влиятельной части общества вынесена в сноски.
