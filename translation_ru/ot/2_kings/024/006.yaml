base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: ru
  text: И почил Иоаким с предками своими[a], и вместо него воцарился сын его Иехония.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, передавая смысл прямо: «умер». Буквально еврейская формула означает, что он «лёг с предками своими»; это обычное выражение, сообщающее о смерти царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: В сочетании с «с предками своими» глагол образует устойчивую формулу сообщения о смерти царя. «Почил» сохраняет образ исходного текста и при этом естественно звучит в возвышенном повествовательном русском.
- source_word: עִם אֲבֹתָיו
  choice: с предками своими
  rationale: В данном контексте אבות обозначает умерших предков. Такой перевод точнее передаёт смысл по-русски, чем буквальное «с отцами своими», не добавляя указания на погребение.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: Форма описывает вступление на престол; «воцарился» передаёт именно начало царствования, а не его продолжительность.
- source_word: בְּנוֹ
  choice: сын его
  rationale: Прямое обозначение родства, переданное без смыслового изменения.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте престолонаследия выражает смену царя и занятие его места.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: Иоаким / Иехония
  rationale: Использованы устоявшиеся в русской библейской традиции формы этих имён, различимые и понятные русскоязычному читателю.
theological_decisions:
- issue: Передача царской формулы смерти без добавления сведений о погребении
  choice: Сохранить образную формулу «почил с предками своими» в основном тексте.
  alternative: Передать истолковательно как «умер» либо расширить до «умер и был погребён с предками».
  rationale: Еврейский текст сообщает о смерти посредством устойчивой формулы, но прямо не говорит о погребении. Выбранный перевод сохраняет образ и не вносит отсутствующих в стихе подробностей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок слов слегка торжественный, но остаётся ясным; архаизм «почил» сохранён как понятный элемент устойчивой формулы.
