base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: ru
  text: Он увёл в изгнание весь Иерусалим — всех сановников и всех доблестных воинов, всего десять тысяч изгнанников, а также всех ремесленников и кузнецов[a]. Не осталось никого, кроме беднейших жителей страны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мастеров по металлу»; точное значение еврейского слова, традиционно переводимого как «кузнецы», не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: увёл в изгнание
  rationale: Порода hифиль глагола גלה означает принудительно отправить в изгнание. Этот вариант передаёт и действие, и его насильственный характер без современного административного оттенка слова «депортировал».
- source_word: כָּל יְרוּשָׁלִַם
  choice: весь Иерусалим
  rationale: 'Сохранена еврейская метонимия: имеется в виду население и руководство города, а не сами здания. Последующее перечисление поясняет её смысл.'
- source_word: הַשָּׂרִים
  choice: начальников
  rationale: שׂרים обозначает представителей правящей верхушки и должностных лиц; «начальники» не сужает значение до царских сыновей или военачальников.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: доблестных воинов
  rationale: Устойчивое сочетание обозначает сильных, способных и испытанных в бою людей. Формулировка сохраняет возвышенный повествовательный тон и ясна современному читателю.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: всего десять тысяч изгнанников
  rationale: גולה — собирательное обозначение уведённых в изгнание. «Всего» показывает, что число подводит итог названным группам, как естественнее всего понимать синтаксис фразы, не превращая изгнанников в отдельную категорию.
- source_word: הֶחָרָשׁ
  choice: ремесленников
  rationale: חָרָשׁ широко обозначает искусного мастера или ремесленника, поэтому общее русское наименование уместнее более узкой специализации.
- source_word: הַמַּסְגֵּר
  choice: кузнецов
  rationale: Сохранено традиционное понимание термина как обозначения мастеров по металлу; поскольку точная специализация неясна, более широкое значение приведено в сноске.
- source_word: לֹא נִשְׁאַר
  choice: не осталось никого
  rationale: 'Естественно передаёт результативное значение нифаля: никто из подразумеваемых групп не был оставлен.'
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: кроме беднейших из народа страны
  rationale: דלת указывает на беднейшую и социально слабую часть населения. Партитивная конструкция «из народа страны» сохраняет структуру и общественный смысл оригинала.
