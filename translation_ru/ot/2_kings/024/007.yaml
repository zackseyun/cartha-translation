base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: ru
  text: И царь Египта больше не выходил из своей страны, потому что царь Вавилона отнял всё, что принадлежало царю Египта, — от потока Египта[a] до реки Евфрат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от вади Египта». Еврейское слово может обозначать сезонный водоток или его русло; перевод «река» здесь менее вероятен и может быть ошибочно понят как указание на Нил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד
  choice: больше не выходил
  rationale: Сочетание הוסיף с инфинитивом и עוד при отрицании выражает прекращение действия; русский оборот «больше не выходил» естественно передаёт этот смысл.
- source_word: לָצֵאת מֵאַרְצוֹ
  choice: выходил из своей страны
  rationale: יצא буквально означает «выходить»; военный смысл возможен в контексте действий царя, но не внесён в текст явно, чтобы не сужать значение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой египетский царь больше не выходил из своей страны.
- source_word: לָקַח
  choice: захватил
  rationale: לקח имеет общее значение «взял», но в контексте перехода владений между царствами «захватил» естественно передаёт насильственное установление контроля.
- source_word: מִנַּחַל מִצְרַיִם
  choice: от Египетского потока[a]
  rationale: נחל обозначает поток, русло или вади, часто сезонный водоток; «Египетский поток» сохраняет географическое название и не создаёт прямого отождествления с Нилом.
- source_word: עַד נְהַר פְּרָת
  choice: до реки Евфрат
  rationale: נהר означает «река», а פרת — Евфрат; порядок слов естественен для современного русского языка.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: всё, что принадлежало царю Египта
  rationale: Конструкция с היה ל־ выражает принадлежность или владение. Широкая формулировка сохраняет возможность понимать это прежде всего как территории и подвластные владения в заданных географических пределах.
