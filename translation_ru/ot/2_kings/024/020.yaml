  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: ru
  text: Ибо из-за гнева Яхве с Иерусалимом и Иудеей дошло до того, что Он изгнал их из Своего присутствия[a]. И Седекия восстал против царя Вавилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо гнев Яхве был в Иерусалиме и Иудее, пока Он не изгнал их из Своего присутствия». Первая часть еврейского текста синтаксически сжата и допускает такой более буквальный перевод.'
    reason: 'Альтернативный синтаксический разбор: глагол «был» может соотноситься с «гневом Яхве»; сохранены локативность предлога и образ изгнания из присутствия Бога.'
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующих событий; «ибо» естественно передаёт связь с контекстом, тогда как причинное значение далее выражено оборотом «из-за гнева».
- source_word: עַל אַף יְהוָה
  choice: из-за гнева Яхве
  rationale: Устойчивое выражение указывает на причину происходящего — гнев Бога; личное имя יהוה передано как «Яхве».
- source_word: הָיְתָה
  choice: это происходило
  rationale: Глагол женского рода употреблён без явно названного подлежащего. Нейтральное «это происходило» сохраняет сжатость и не уточняет сверх текста, что именно имеется в виду.
- source_word: בִירוּשָׁלִַם וּבִיהוּדָה
  choice: в Иерусалиме и Иудее
  rationale: Предлог ב передан в его прямом локативном значении; допустимое понимание всей фразы как направленной против Иерусалима и Иудеи отмечено в сноске.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: пока Он не изгнал их
  rationale: עַד с инфинитивом обозначает конечный предел происходящего. «Изгнал» передаёт решительное удаление и естественно сочетается с последующим «от Себя».
- source_word: מֵעַל פָּנָיו
  choice: от Себя
  rationale: Еврейская идиома буквально означает удаление «от Его лица», то есть из Его присутствия. Возвратное местоимение естественно передаёт этот смысл по-русски.
- source_word: וַיִּמְרֹד
  choice: И ... восстал против
  rationale: מרד означает мятеж или отказ подчиняться правителю; «восстал против» — ясное и естественное русское соответствие.
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Традиционная и узнаваемая русская форма библейского имени.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: против царя Вавилона
  rationale: При глаголе מרד предлог ב обозначает того, против кого направлен мятеж; «царь Вавилона» сохраняет форму исходного текста.
theological_decisions:
- issue: Причинно-временная связь в первой части стиха
  choice: Гнев Яхве назван причиной происходившего в Иерусалиме и Иудее вплоть до их изгнания.
  alternative: «Гнев Яхве был на Иерусалиме и Иудее, пока Он не отверг их от Своего лица».
  rationale: Еврейская конструкция с הָיְתָה синтаксически сжата и допускает как безличное понимание, так и более формальное связывание глагола с гневом. Основной текст сохраняет безличность, а сноска — альтернативный синтаксический разбор.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Образ удаления от Божьего лица
  choice: изгнал их от Себя
  alternative: отверг их от Своего лица
  rationale: Основной вариант ясно передаёт изгнание из Божьего присутствия, а более буквальный образ лица сохранён в альтернативном переводе сноски.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан понятным без устранения неоднозначности исходной первой части; альтернативный разбор вынесен в сноску.
