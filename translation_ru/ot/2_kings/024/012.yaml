  source_fidelity: 'Существенная поправка требуется в передаче имени: יְהוֹיָכִין (Jehoiachin) следует передавать как «Иоахин», а не «Иехония». «Иехония» соответствует другой, хотя и связанной, форме имени (Иехония/Иехониях) и не является точной передачей данного еврейского имени. Остальные смысловые соответствия сохранены: «вышел к» не навязывает значение сдачи; группы спутников переданы полностью; «взял его» не усиливает לקח; датировка отнесена к царю Вавилона.'
