  terminology: «Сановники» удачно передаёт שָׂרָיו. «Евнухи» допустимо сохраняет конкретное значение סָרִיסָיו, а сноска корректно отмечает более широкое значение «придворные служащие». Маркер сноски привязан к надлежащему слову. «Иоахин» необходим как точная русская передача יְהוֹיָכִין.
