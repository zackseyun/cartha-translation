base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: ru
  text: Тогда Иоахин, царь Иудеи, вышел к царю Вавилона вместе со своей матерью, слугами, сановниками и евнухами[a]. Царь Вавилона взял его на восьмом году своего царствования.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придворные служащие»; еврейское слово может обозначать как евнухов в буквальном смысле, так и служащих царского двора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא буквально означает «выйти». В условиях осады это подразумевает, что Иехония явился к вавилонскому царю, вероятно сдаваясь ему, но перевод «вышел» сохраняет формулировку еврейского текста и не делает подразумеваемое значение явным.
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: к царю Вавилона
  rationale: В сочетании с יצא предлог עַל указывает здесь на направленность движения к человеку. По-русски это естественно передаётся сочетанием «вышел к».
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: עֶבֶד может обозначать как слугу, так и служащего или приближённого. «Слуги» сохраняет широкое значение слова и не вводит излишне узкого придворного смысла.
- source_word: שָׂרָיו
  choice: его сановники
  rationale: שַׂר обозначает высокопоставленного руководителя или должностное лицо. «Сановники» естественно соответствует контексту царского двора и отличает эту группу от слуг.
- source_word: סָרִיסָיו
  choice: его евнухи
  rationale: סָרִיס может означать буквального евнуха либо придворного служащего. Основной текст сохраняет более конкретное традиционное значение, а сноска отмечает более широкую возможность.
- source_word: וַיִּקַּח אֹתוֹ
  choice: взял его
  rationale: לקח — обычный глагол со значением «брать». Контекст указывает на переход Иехонии под власть вавилонского царя, однако «взял его» не усиливает текст словами «пленил» или «схватил».
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: на восьмом году своего царствования
  rationale: Оборот естественно передаёт датировку по году правления. Возвратное местоимение связывает царствование с ближайшим действующим лицом — царём Вавилона.
theological_decisions:
- issue: К кому относится «его/своего царствования» в заключительной датировке
  choice: к царю Вавилона
  alternative: к Иехонии
  rationale: Ближайший субъект в еврейском предложении — царь Вавилона; хронология главы также соответствует восьмому году правления Навуходоносора. Русское «своего царствования» естественно указывает на него, не добавляя имени, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным строем. Тире делает присоединённое перечисление естественным и сохраняет явное еврейское «он». Маркер сноски помещён непосредственно после слова «евнухи», к которому относится пояснение.
