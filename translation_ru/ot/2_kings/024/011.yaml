lexical_decisions:
- source_word: וַיָּבֹא
  choice: подошёл
  rationale: Глагол בוא обозначает прибытие; в сочетании с עַל и в военном контексте «подошёл к» естественно передаёт враждебное приближение, не добавляя отдельного действия нападения.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Навуходоносор
  rationale: Принятая в русской библейской традиции форма имени вавилонского царя.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Прямая передача конструкции, называющей сан и царство Навуходоносора.
- source_word: עַל הָעִיר
  choice: к городу
  rationale: После «подошёл» русский язык требует предлога «к»; враждебный характер прибытия ясно задаётся контекстом осады.
- source_word: וַעֲבָדָיו
  choice: его слуги
  rationale: Сохраняет широкое значение עֲבָדִים — царские слуги, служащие или подчинённые силы — без неоправданного уточнения их должности или рода войск.
- source_word: צָרִים עָלֶיהָ
  choice: держали город в осаде
  rationale: Причастие צור выражает продолжающуюся осаду. Повтор «город» вместо местоимения звучит по-русски ясно и естественно.
