  naturalness: «В то время как» ясно выражает одновременность, заложенную в сочетании повествовательного глагола с причастием, и избегает возможного оттенка временного предела у «пока». «Осаждали его» естественно и не создаёт ненужного повтора слова «город».
  terminology: «Навуходоносор» и «царь Вавилона» соответствуют принятому русскому библейскому употреблению. «Слуги» сохраняет широкое значение עֲבָדָיו; поясняющая сноска уместно отмечает возможное значение царских должностных лиц или сил.
