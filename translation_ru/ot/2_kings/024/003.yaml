source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: ru
  text: Несомненно, это постигло Иудею по повелению Яхве, чтобы удалить её от лица Его за грехи Манассии, согласно всему, что он совершил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Его присутствия».'
    reason: Лексико-стилистическая альтернатива к буквальному образу מֵעַל פָּנָיו («от лица Его»).
lexical_decisions:
- source_word: אַךְ
  choice: Именно
  rationale: В данном контексте частица подчёркивает достоверность и определяющую причину суда; «именно» естественно передаёт эмфатическую силу, не придавая фразе ограничительного смысла.
- source_word: עַל־פִּי יְהוָה
  choice: по повелению Яхве
  rationale: Идиома עַל־פִּי буквально связана с «устами», но обычно означает действие по чьему-либо слову или повелению. Передача сохраняет личное действие Бога и употребляет имя Яхве для тетраграмматона.
- source_word: הָיְתָה בִּיהוּדָה
  choice: это постигло Иудею
  rationale: 'Еврейская конструкция эллиптична: подразумевается ранее описанный суд. Местоимение «это» указывает на него, а «постигло Иудею» естественно выражает наступление бедствия.'
- source_word: לְהָסִיר
  choice: чтобы удалить
  rationale: Инфинитив породы hифиль от סור выражает причинение удаления; целевая конструкция передана союзом «чтобы».
- source_word: מֵעַל פָּנָיו
  choice: от лица Своего
  rationale: Сохранён конкретный древнееврейский образ изгнания от Божьего лица; прописная буква ясно указывает на Яхве. Более гладкий смысловой вариант дан в сноске.
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: за грехи Манассии
  rationale: Предлог выражает причину, а существительное допускает собирательное понимание всей совокупности проступков Манассии. Русское множественное число естественно передаёт этот смысл.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: за всё, что он сделал
  rationale: Фраза уточняет объём и основание вины Манассии. В русском повтор «за» ясно связывает все его дела с названными грехами, не перегружая стих буквальной конструкцией «сообразно всему».
theological_decisions:
- issue: Не выраженный прямо объект удаления
  choice: Местоимение «её» относится к Иудее и в контексте охватывает страну и её народ.
  alternative: 'Оставить объект невыраженным: «чтобы удалить от лица Своего».'
  rationale: В еврейском тексте объект инфинитива подразумевается, но по-русски его отсутствие создаёт неясную и неполную конструкцию. Женский род «её» согласуется с Иудеей и не уточняет сверх контекста, идёт ли речь преимущественно о земле или о народе.
- issue: Образ Божьего лица и присутствия
  choice: В основном тексте сохранено «от лица Своего».
  alternative: «от Своего присутствия».
  rationale: Конкретная библейская образность передаёт не только перемещение, но и изгнание из сферы благоволения и присутствия Яхве; смысловая альтернатива приведена в сноске без устранения образа из текста.
- issue: Связь суда с грехами Манассии
  choice: 'Причинная связь выражена прямо: суд пришёл «за грехи Манассии».'
  alternative: «из-за греха Манассии».
  rationale: Форма может восприниматься собирательно, а продолжение «за всё, что он сделал» указывает на совокупность поступков. Множественное число не вводит дополнительного догматического вывода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным при сохранении эллиптического характера исходника настолько, насколько это допускает естественная русская речь; антропоморфный образ «лица» сохранён.
