revisions:
- from: Именно по повелению Яхве это постигло Иудею, чтобы удалить её от лица Своего[a] за грехи Манассии — за всё, что он сделал.
  to: Несомненно, это постигло Иудею по повелению Яхве, чтобы удалить её от лица Его за грехи Манассии, согласно всему, что он совершил[a].
  rationale: Исправлен порядок слов для естественного русского синтаксиса, эмфатическая частица אַךְ передана без ложного оттенка противопоставления, а כְּכֹל сохранено как указание на соответствие всему содеянному Манассией. Объект удаления («её», то есть Иудею) оставлен как необходимое для русского контекстуальное восполнение без дополнительной интерпретации.
