  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: ru
  text: Яхве сильно разгневался на Израиль и удалил их от лица Своего[a]. Никого не осталось, кроме одного лишь колена Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Своего присутствия». Буквально: «из-перед Своего лица».'
    reason: Лексическая альтернатива и пояснение конкретного еврейского оборота.
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: сильно разгневался
  rationale: Передаёт усиленное значение глагола אנף с наречием מְאֹד естественным и достойным современным русским языком.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, транслитерацией, а не заменяет его титулом.
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: При глаголе гнева предлог ב указывает на объект гнева; сочетание «разгневаться на» нормативно для русского языка.
- source_word: וַיְסִרֵם
  choice: удалил их
  rationale: Каузативная форма סור означает устранение или удаление. Выбор не добавляет прямо не названного в глаголе понятия изгнания, хотя контекст подразумевает его.
- source_word: מֵעַל פָּנָיו
  choice: от лица Своего
  rationale: Сохраняет конкретный антропоморфный образ еврейского выражения «из-перед Его лица», оставаясь понятным в русском библейском регистре.
- source_word: לֹא נִשְׁאַר
  choice: не осталось никого
  rationale: Передаёт значение нифаля שׁאר и коллективный человеческий референт в естественной русской форме.
- source_word: רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: кроме одного лишь колена Иуды
  rationale: «Кроме» выражает исключение после отрицания, а «одного лишь» сохраняет усиление לְבַדּוֹ, не создавая тяжеловесного повтора.
theological_decisions:
- issue: Антропоморфное описание Божьего присутствия в מֵעַל פָּנָיו
  choice: от лица Своего
  alternative: из Своего присутствия
  rationale: Основной текст сохраняет телесно-конкретный образ оригинала и его богословскую напряжённость; более отвлечённый смысловой вариант отмечен в сноске.
- issue: Референт слова «Израиль»
  choice: название оставлено без поясняющей вставки; в контексте речь идёт о северном царстве и его народе
  alternative: весь народ завета в более широком смысле
  rationale: Ближайший контекст повествует о падении и выселении северного царства. Перевод не сужает и не расширяет референт пояснением, которого нет в стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «от лица Своего» сохраняет ясный референт местоимения и соответствует образности оригинала; архаизмы по возможности исключены.
