base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: ru
  text: Но каждый народ продолжал изготовлять своих богов и ставить их в святилища на высотах, построенные жителями Самарии[a], — каждый народ в тех городах, где он жил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самарянами».'
    reason: Возможен более прямой перевод הַשֹּׁמְרֹנִים, однако в современном употреблении слово «самаряне» может восприниматься как название позднейшей религиозной общины.
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: продолжал изготовлять
  rationale: Конструкция היה с причастием передаёт продолжающееся или повторяющееся действие в прошлом; выбранная формулировка сохраняет этот оттенок и естественно звучит по-русски.
- source_word: גּוֹי גּוֹי
  choice: каждый народ
  rationale: 'Повтор существительного имеет распределительное значение: речь идёт о каждом народе по отдельности.'
- source_word: אֱלֹהָיו
  choice: своих богов
  rationale: Множественное «богов» передаёт языческие божества, а возвратное «своих» соотносит их с каждым отдельно взятым народом.
- source_word: וַיַּנִּיחוּ
  choice: ставить
  rationale: В данном культовом контексте глагол обозначает помещение или установление изготовленных изображений в святилищах.
- source_word: בְּבֵית הַבָּמוֹת
  choice: в святилищах на высотах
  rationale: Буквально выражение означает «в доме высот» и обозначает культовые сооружения при местах поклонения; «святилища на высотах» ясно и без излишней буквальности передаёт смысл.
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: устроенных жителями Самарии
  rationale: «Жители Самарии» непосредственно передаёт географическую принадлежность и не навязывает более поздний конфессиональный смысл слова «самаряне».
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: в тех городах, где он жил
  rationale: Единственное число «он» согласовано с распределительным «каждый народ»; оборот естественно передаёт города их расселения.
theological_decisions:
- issue: Значение הַשֹּׁמְרֹנִים
  choice: жители Самарии
  alternative: самаряне
  rationale: Контекст говорит о населении Самарии и созданных там культовых местах. Основной вариант избегает возможной анахронической отсылки к позднейшей религиозной общине, а альтернативное прямое обозначение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Распределительная структура еврейского текста сохранена повтором «каждый народ», а культовая терминология передана понятно для обычного читателя.
