    rationale: '«Ставить их в святилищах» означает нахождение в месте и не соответствует управлению глагола при обозначении помещения куда-либо. Требуется: «ставить их в святилища».'
  - severity: low
    issue: Неясная соотнесённость «устроенных жителями Самарии».
    rationale: Форма предложного падежа может грамматически относиться к «высотах», тогда как אֲשֶׁר עָשׂוּ относится к בֵּית הַבָּמוֹת, то есть к культовым сооружениям. «Построенные» в винительном падеже ясно относится к «святилища».
  revised_text: Но каждый народ продолжал изготовлять своих богов и ставить их в святилища на высотах, построенные жителями Самарии[a], — каждый народ в тех городах, где он жил.
