  - severity: medium
    issue: Заключительная часть передана чрезмерно отвлечённо.
    rationale: Еврейский текст эллиптичен, но после «следовали обычаям» подразумеваемый объект во второй части — установления или практики царей. «Тому, что делали» способно включать любые поступки царей и ослабляет синтаксический параллелизм. «Установлениям, которые делали цари Израиля» сохраняет намеренную неопределённость глагола עשה, не подменяя его «ввели».
  revised_text: Они следовали обычаям народов, которых Яхве изгнал перед ними, и установлениям, которые делали цари Израиля[a].
