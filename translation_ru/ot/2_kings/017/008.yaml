  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: ru
  text: Они следовали обычаям народов, которых Яхве изгнал перед ними, и установлениям, которые делали цари Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст в заключительной части эллиптичен; буквально: «и царей Израиля, которые делали». Возможен также перевод: «и тому, что делали цари Израиля».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ בְּחֻקּוֹת
  choice: следовали обычаям
  rationale: Глагол הלך с предлогом ב в этическом контексте означает образ поведения; по-русски «следовали обычаям» естественно передаёт метафорическое «ходили по установлениям». חֻקּוֹת здесь обозначает установившиеся нормы и обычаи языческих народов.
- source_word: הַגּוֹיִם
  choice: народов
  rationale: В данном историческом контексте речь идёт о неIsraelитских народах земли; «народы» нейтрально и точно передаёт גּוֹיִם.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: которых Яхве изгнал перед
  rationale: Порода Hiphil глагола ירש здесь допускает значения «лишить владения» и «изгнать»; «изгнал» ясно передаёт устранение народов с земли, а «перед» сохраняет образ מִפְּנֵי.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтянами
  rationale: Это устойчивое этническое обозначение всего народа; «израильтяне» в современном русском естественнее буквального «сыны Израиля» и не сужает референт до мужчин.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: и тому, что делали цари Израиля
  rationale: Еврейская конструкция эллиптична и синтаксически трудна. Такой перевод минимально восполняет подразумеваемую связь с «следовали», не уточняя без достаточного основания, что цари именно «ввели» эти обычаи.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и отличает его от титула אֲדֹנָי.
- issue: Смысл заключительной эллиптической конструкции
  choice: тому, что делали цари Израиля
  alternative: обычаям, которые ввели цари Израиля
  rationale: Исходное עָשׂוּ означает «делали/сделали» и прямо не выражает введение практик. Выбранный вариант сохраняет смысловую напряжённость и не вносит отсутствующего в тексте уточнения.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Сохранено имя «Яхве»; буквальная еврейская метафора «ходили по установлениям» передана естественным русским оборотом. Все сноски отмечены в основном тексте.
