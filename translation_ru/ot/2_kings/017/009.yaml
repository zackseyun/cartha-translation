  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: ru
  text: Сыны Израиля тайно делали то, что было неверно по отношению к Яхве, их Богу[a]. Во всех своих городах они строили себе святилища на высотах[b] — от сторожевой башни до укреплённого города[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Сыны Израиля скрывали то, что было неверно по отношению к Яхве, их Богу». Еврейский глагол редок и может означать как тайные действия, так и сокрытие чего-либо.'
    reason: lexical_alternative
  - marker: b
    text: «Святилища на высотах» — местные места поклонения, часто связанные с богослужением, не разрешённым Яхве.
    reason: cultural_note
  - marker: c
    text: Выражение «от сторожевой башни до укреплённого города» означает всю страну — от небольших сторожевых пунктов до хорошо защищённых городов.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: тайно делали
  rationale: Редкий глагол חפא, по-видимому, выражает действие тайком или сокрытие. В сочетании с дополнением «то» и последующим описанием культовых нарушений перевод «тайно делали» естественно передаёт основной смысл, не исключая оттенка сокрытия.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: то, что было неправильно
  rationale: Буквальное «то, что было не так» по-русски двусмысленно и может звучать как отрицание факта. Выбранная формулировка сохраняет нравственную оценку, не уточняя характер поступков сверх сказанного в еврейском тексте.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: против Яхве, их Бога
  rationale: 'В контексте отступничества предлог עַל имеет враждебный оттенок «против». Имя יהוה передано как «Яхве», а притяжательное местоимение сохранено отдельно: «их Бога».'
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: они строили себе святилища на высотах
  rationale: בָּמוֹת обозначает местные культовые места, нередко связанные с неодобряемым поклонением. Выражение «святилища на высотах» понятнее современному читателю, чем одно слово «высоты», и сохраняет традиционный пространственно-культовый образ. «Себе» отражает לָהֶם.
- source_word: בְּכָל עָרֵיהֶם
  choice: во всех своих городах
  rationale: Прямое и естественное соответствие локативной фразе; עָרִים в данном контексте передано как «города».
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: от сторожевой башни
  rationale: נוֹצְרִים обозначает сторожей или наблюдающих; сочетание естественно передаётся как «сторожевая башня».
- source_word: עַד עִיר מִבְצָר
  choice: до укреплённого города
  rationale: עִיר מִבְצָר — город с оборонительными укреплениями. Формулировка завершает меризм, охватывающий поселения всей страны.
theological_decisions:
- issue: Характер скрытых действий Израиля
  choice: Конкретные неправильные поступки совершались тайно и были направлены против Яхве.
  alternative: Израильтяне скрывали или измышляли нечто неверное о Яхве.
  rationale: Редкий глагол допускает оттенок сокрытия, однако ближайший контекст, включая строительство культовых высот, указывает на реальные действия. Перевод сохраняет и тайный характер, и противление Богу, не конкретизируя поступки сверх текста.
- issue: Значение предлога עַל
  choice: против Яхве
  alternative: о Яхве; в отношении Яхве
  rationale: Контекст осуждения отступничества поддерживает враждебное значение «против», хотя грамматически возможна более нейтральная связь «относительно».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Сыны Израиля» сохраняет историко-корпоративное обозначение народа; синтаксис упрощён до двух ясных предложений. Термин «святилища на высотах» выбран ради понятности без устранения его древнего культового характера.
