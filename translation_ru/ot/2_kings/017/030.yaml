  source_fidelity: 'Текст точно передаёт трёхчастную конструкцию еврейского оригинала: «люди [места] сделали [имя]». Глагол עָשׂוּ обоснованно передан как «сделали», без добавления невыраженных слов «идол» или «бог». Собственные имена сохранены транслитерацией; винительные формы «Нергала» и «Ашиму» грамматически необходимы в русском и не меняют их идентификации.'
