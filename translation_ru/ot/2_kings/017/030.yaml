  terminology: «Суккот-Бенот», «Нергал» и «Ашима» корректно оставлены именами без догматически или исторически чрезмерного уточнения. Примечание к Суккот-Бенот надлежащим образом сохраняет неясность референта и этимологии. Альтернативное примечание к «люди» верно отражает коллективно-местное употребление אַנְשֵׁי и его грамматический мужской род.
