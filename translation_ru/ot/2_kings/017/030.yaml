  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: ru
  text: Люди[b] Вавилона сделали Суккот-Бенот[a], люди Кута сделали Нергала, а люди Хамата сделали Ашиму.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Суккот-Бенот — вероятно, имя иноземного божества или культового предмета. Значение этого имени неясно, поэтому оно передано транслитерацией, а не переведено.
    reason: cultural_note
  - marker: b
    text: 'Или: «жители Вавилона… жители Кута… жители Хамата». В еврейском тексте во всех трёх случаях буквально стоит выражение «люди» (форма мужского рода).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: люди
  rationale: Конструктивное множественное число от אִישׁ буквально указывает на людей, связанных с названным местом. «Люди Вавилона / Кута / Хамата» сохраняет повторяющуюся еврейскую формулу и при этом звучит естественнее, чем буквальное «мужи».
- source_word: עָשׂוּ
  choice: сделали
  rationale: Обычное значение глагола עשה — «делать, создавать». Контекст относится к предметам иноземного культа или божествам, однако более конкретное «поставили» не выражено самим глаголом.
- source_word: סֻכּוֹת בְּנוֹת
  choice: Суккот-Бенот
  rationale: Вероятно, это собственное имя иноземного божества или культового предмета. Неясная этимология не позволяет уверенно переводить составные части имени, поэтому оно передано транслитерацией.
- source_word: כּוּת
  choice: Кут
  rationale: Название местности передано принятой русской транслитерацией и поставлено в родительный падеж после слова «люди».
- source_word: נֵרְגַל
  choice: Нергал
  rationale: Собственное имя месопотамского божества передано транслитерацией; в предложении употреблена форма винительного падежа «Нергала».
- source_word: חֲמָת
  choice: Хамат
  rationale: Географическое название передано традиционной русской формой; после слова «люди» употреблён родительный падеж «Хамата».
- source_word: אֲשִׁימָא
  choice: Ашима
  rationale: Собственное имя иноземного божества передано транслитерацией; в предложении употреблена форма винительного падежа «Ашиму».
theological_decisions:
- issue: Следует ли пояснить объекты глагола עָשׂוּ словами «идол» или «бог»
  choice: Сохранить собственные имена без добавления «идол», «изваяние» или «бог».
  alternative: «Сделали идола Суккот-Бенот…» или «сделали Суккот-Бенот своим богом…»
  rationale: В еврейском тексте стоит только глагол «сделали» с прямыми дополнениями. Контекст указывает на иноземные божества или культовые предметы, но добавление их точного определения устранило бы сохраняющуюся в исходном тексте неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским регистром. Повтор «люди… сделали» сохранён как стилистически значимая особенность исходного текста; перед последней частью добавлен естественный русский союз «а».
