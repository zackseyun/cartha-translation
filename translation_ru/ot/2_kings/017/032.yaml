  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: ru
  text: Они боялись Яхве и назначили себе из своей среды священников высот[a], и те служили им в святилищах на высотах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Высоты» — местные культовые места со святилищами и жертвенниками, в отличие от центрального святилища.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: боялись Яхве
  rationale: Сохраняет обычное значение оборота — благоговейный страх перед Яхве — и не снимает напряжения между таким страхом и последующим незаконным культом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: מִקְצוֹתָם
  choice: из своей среды
  rationale: Естественно передаёт идиоматическое избрание людей из состава самой общины, не навязывая спорного значения «из низших слоёв».
- source_word: כֹּהֲנֵי בָמוֹת
  choice: священников высот
  rationale: Сохраняет культовую должность и традиционный библейский термин «высоты» для местных культовых мест.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: назначали себе
  rationale: В сочетании с обозначением должностных лиц עשה имеет смысл назначения; имперфективный русский вид хорошо согласуется с описанием установившейся практики.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: которые служили для них
  rationale: Передаёт продолжающееся исполнение назначенными священниками культовых обязанностей от имени этих людей, не уточняя не названные в тексте обряды.
- source_word: בְּבֵית הַבָּמוֹת
  choice: в святилищах на высотах
  rationale: Передаёт собирательный смысл конструкции и естественно обозначает культовые сооружения при высотах; буквальное «в доме высот» по-русски неясно.
theological_decisions:
- issue: Напряжение между страхом перед Яхве и незаконной культовой практикой
  choice: Сохранить простое соединение союзом «и» без поясняющего противопоставления
  alternative: «Они боялись Яхве, но назначали…» или «делали вид, что боятся Яхве»
  rationale: Еврейский текст ставит действия рядом с помощью обычного ו, позволяя контексту выявить их противоречивость. Перевод не превращает страх в притворство и не усиливает союз до явно противительного.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского термина «высоты». Формулировка достоинственная и понятная; придаточное ясно указывает, что служили именно назначенные священники.
