  to: Они боялись Яхве и назначили себе из своей среды священников высот[a], и те служили им в святилищах на высотах.
  rationale: 'Исправлен вид «назначали» на повествовательное «назначили» в соответствии с еврейской формой wayyiqtol. Финальная клауза переформулирована как «и те служили им», чтобы естественно по-русски обозначить священников как субъект служения, сохранив продолжающийся характер их функции. Противопоставительный союз не добавлен: простое «и» сохраняет синтаксис и не снимает контекстуального напряжения.'
