  source_fidelity: В целом переданы страх/почитание Яхве, избрание священников из собственной среды, технический термин «высоты» и их служение в культовых сооружениях. Однако два еврейских глагола с וַ־ имеют повествовательное, завершённое значение; «назначали» неоправданно превращает конкретное действие в длительную или повторяющуюся практику.
  naturalness: «Назначили себе» естественно для современного литературного русского. В финальной части «служили им» естественнее, чем «служили для них»; указательное «те» ясно соотносится с только что названными священниками.
  terminology: «Яхве», «священники высот» и «высоты» удачны и сохраняют терминологическую связь с оригиналом. Сноска у слова «высоты» уместна; «святилища на высотах» допустимо передаёт בית הבמות как культовые строения, не называя их храмами.
