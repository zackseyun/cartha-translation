    issue: «которых Яхве изгнал перед ними»
    rationale: Русское «перед ними» означает прежде всего «в их присутствии» и потому не передаёт מִפְּנֵיהֶם («от лица их», «с их пути/из их пределов»). «Изгнал от них» естественнее и точнее сохраняет смысл устранения прежних жителей.
  - severity: low
    issue: 'Сноска: «переселил от них»'
    rationale: Формулировка может создать впечатление переселения народов к Израилю или от Израиля без ясного пространственного смысла. «Удалил от них» яснее отражает допустимый широкий смысл глагола при сохранении основного контекстуального перевода.
