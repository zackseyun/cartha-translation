  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: ru
  text: Там они воскуряли благовония на всех священных высотах, подобно народам, которых Яхве изгнал[a] от них, и делали зло, чтобы прогневать Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удалил от них». Еврейский глагол может означать изгнание или удаление, а также принудительное переселение; здесь речь идёт о народах, лишённых своей земли перед Израилем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: они воскуряли благовония
  rationale: Пиэль глагола קטר обозначает возжигание благовоний или жертвенного курения. В данном культовом контексте «воскуряли благовония» естественно и точно передаёт действие, не расширяя его до жертвоприношений вообще.
- source_word: שָׁם
  choice: там
  rationale: Прямо передаёт еврейское наречие и отсылает к упомянутым в контексте местам поклонения.
- source_word: בְּכָל בָּמוֹת
  choice: на всех священных высотах
  rationale: במות — культовые возвышенности или места поклонения. Добавление «священных» делает специальное культовое значение понятным современному читателю и не позволяет принять «высоты» лишь за географические возвышенности.
- source_word: כַּגּוֹיִם
  choice: подобно народам
  rationale: גוים здесь обозначает прежние народы земли, а не «язычников» как позднейшую конфессиональную категорию.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: которых Яхве изгнал перед ними
  rationale: Глагол גלה в породе хифиль может означать переселение, удаление или изгнание. В контексте овладения землёй «изгнал перед ними» передаёт лишение прежних народов их территории и сохраняет образ מִפְּנֵיהֶם.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: и делали зло
  rationale: Краткая и естественная русская формулировка сохраняет широкий характер нравственного осуждения в еврейском выражении.
- source_word: לְהַכְעִיס
  choice: чтобы прогневать
  rationale: Инфинитив хифиля от כעס выражает причинение гнева; «чтобы прогневать» естественно передаёт целевую конструкцию לְ и явно называет подразумеваемую реакцию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יְהוָה. Транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Значение הֶגְלָה в контексте овладения землёй
  choice: изгнал
  alternative: переселил; удалил
  rationale: Контекст говорит о народах, лишённых земли перед Израилем. При этом возможное значение принудительного переселения не устраняется молча, а отмечается в сноске.
- issue: Целевая сила לְהַכְעִיס
  choice: чтобы прогневать Яхве
  alternative: прогневляя Яхве; вызывая гнев Яхве
  rationale: Формулировка сохраняет грамматически возможный оттенок намеренного действия, не смягчая богословскую напряжённость утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Термин «священные высоты» выбран для понятной передачи культового смысла במות; синтаксис оставлен компактным и близким к последовательности еврейского текста.
