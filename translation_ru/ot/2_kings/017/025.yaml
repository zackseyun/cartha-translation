- from: В первое время после того, как они поселились там, они не боялись Яхве[a]. Поэтому Яхве послал на них львов, и те убивали некоторых из них.
  to: Когда они только поселились там, они не боялись Яхве[a]. Тогда Яхве послал на них львов, и львы убивали некоторых из них.
  rationale: Начальная временная конструкция передана более компактным современным оборотом «Когда они только поселились там». «Тогда» вместо «Поэтому» не делает выводную связь более явной, чем в оригинале. Повтор слова «львы» улучшает ясность, а форма «убивали» сохраняет оттенок продолжающегося или повторяющегося действия конструкции היה с причастием.
