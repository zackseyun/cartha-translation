base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: ru
  text: Когда они только поселились там, они не боялись Яхве[a]. Тогда Яхве послал на них львов, и львы убивали некоторых из них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не почитали Яхве». Еврейское «бояться» здесь включает благоговение и должное отношение к Яхве, а не только страх перед опасностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: В первое время после того, как они поселились там
  rationale: Передаёт начальный период их проживания в этой земле и естественно звучит по-русски, не теряя временного значения конструкции.
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: не боялись Яхве
  rationale: Сохраняет ключевой библейский оборот с ירא; в данном контексте страх включает благоговение и признание Бога, а не только испуг.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַיְשַׁלַּח יְהוָה בָּהֶם אֶת הָאֲרָיוֹת
  choice: Поэтому Яхве послал на них львов
  rationale: Связка «поэтому» ясно передаёт следствие в повествовании; «послал на них» естественно выражает направленное против них действие.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: и те убивали некоторых из них
  rationale: Конструкция היה с причастием указывает на продолжавшееся или повторявшееся действие; «некоторых из них» передаёт частичное значение בָּהֶם и не предполагает всеобщего истребления.
theological_decisions:
- issue: Значение выражения יָרְאוּ אֶת־יְהוָה
  choice: не боялись Яхве
  alternative: не почитали Яхве
  rationale: 'Буквальное «боялись» сохраняет богословски насыщенную и намеренно широкую формулировку: речь может идти одновременно о благоговении, признании власти Яхве и должном отношении к Нему. «Не почитали» было бы яснее, но уже по смыслу.'
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Формула «бояться Яхве» сохранена ради текстовой прозрачности, а её смысл пояснён в сноске.
