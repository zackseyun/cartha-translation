  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: ru
  text: Они поставили себе священные столбы и ашеры[a] на каждом высоком холме и под каждым зелёным деревом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ашеры — культовые предметы, связанные с богиней Ашерой; их точный вид неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: поставили
  rationale: Форма породы hифиль от נצב здесь означает установку культовых предметов; «поставили» естественно и точно передаёт действие.
- source_word: לָהֶם
  choice: себе
  rationale: 'Дательный суффикс в данном контексте имеет возвратное значение: предметы были установлены ими для собственного почитания.'
- source_word: מַצֵּבוֹת
  choice: священные столбы
  rationale: Существительное обозначает вертикально установленные камни культового назначения. Определение «священные» ясно передаёт их функцию и не смешивает их с обычными архитектурными столбами.
- source_word: וַאֲשֵׁרִים
  choice: ашеры
  rationale: Транслитерация сохраняет связь с Ашéрой и не уточняет без достаточных оснований точный вид культовых предметов, который остаётся спорным.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: на каждом высоком холме
  rationale: Прямо и естественно передаёт устойчивый образ мест незаконного культа.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: и под каждым раскидистым деревом
  rationale: רַעֲנָן описывает дерево со свежей, пышной листвой; «раскидистым» звучит естественно по-русски и передаёт образ густой зелени.
theological_decisions:
- issue: Передача אֲשֵׁרִים
  choice: ашеры
  alternative: столбы Ашеры; деревянные изображения Ашеры
  rationale: Форма множественного числа, вероятно, обозначает культовые предметы, связанные с богиней Ашерой, но их точная форма неясна. Транслитерация сохраняет эту неоднозначность и сопровождается пояснением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка доступна обычному читателю; специальный термин «ашеры» пояснён в сноске. Синтаксический параллелизм исходного текста сохранён.
