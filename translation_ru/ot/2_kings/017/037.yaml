base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: ru
  text: И постановления, и судебные решения, и закон, и заповедь[a], которые он написал для вас, соблюдайте и исполняйте во все дни[b] и не бойтесь[c] других богов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предписания, установления, наставление и повеление». В еврейском тексте употреблены четыре близких, но не вполне тождественных термина заветного права.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «соблюдайте, чтобы исполнять, во все дни». Оборот соединяет соблюдение с практическим исполнением.'
    reason: lexical_alternative
  - marker: c
    text: Здесь «бояться» включает благоговейное почитание и религиозную верность, которые нельзя отдавать другим богам.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Передаёт предписанный, нормативный характер חֻקִּים и сохраняет юридический регистр.
- source_word: הַמִּשְׁפָּטִים
  choice: судебные решения
  rationale: Отражает правовой и судебный оттенок מִשְׁפָּטִים, не сливая это слово с более общим обозначением закона.
- source_word: הַתּוֹרָה
  choice: закон
  rationale: В данном перечне заветных требований «закон» естественно передаёт нормативную силу תּוֹרָה; возможный оттенок наставления отмечен в сноске.
- source_word: הַמִּצְוָה
  choice: заповедь
  rationale: Сохраняет единственное число еврейского слова и возвышенный библейско-правовой стиль.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: которые он записал для вас
  rationale: Сохраняет не названный прямо субъект мужского рода, не подставляя в текст имя Господа; «записал» здесь естественнее по-русски, чем буквальное «написал».
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: неизменно соблюдайте и исполняйте
  rationale: Передаёт соединение хранения/соблюдения с практическим исполнением. «Неизменно» выражает настойчивую обязательность оборота, не превращая его в простое знание предписаний.
- source_word: כָּל הַיָּמִים
  choice: во все дни
  rationale: Сохраняет буквальный временной идиом и его значение постоянства, не добавляя отсутствующего в еврейском притяжательного местоимения.
- source_word: תִירְאוּ
  choice: бойтесь
  rationale: Сохраняет основное значение ירא и намеренную связь страха с почитанием и религиозной верностью в контексте иных богов.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: других богов
  rationale: Прямой и общепонятный эквивалент стандартного еврейского обозначения божеств помимо Господа.
theological_decisions:
- issue: Различение четырёх заветно-правовых терминов
  choice: 'Сохранены четыре обозначения: «постановления», «судебные решения», «закон», «заповедь».'
  alternative: Обобщить как «законы и заповеди».
  rationale: Накопление близких, но не тождественных терминов создаёт риторическую весомость и подчёркивает полноту обязательств; их сведение к общей формуле обеднило бы исходный текст.
- issue: Субъект выражения «записал для вас»
  choice: Оставлено местоимение «он».
  alternative: 'Уточнить в основном тексте: «Господь записал для вас».'
  rationale: Контекст указывает на Господа, однако в самом стихе имя не повторено. Местоимение сохраняет способ выражения исходного текста и не вносит явного существительного.
- issue: Значение запрета бояться других богов
  choice: Сохранено «не бойтесь» с пояснением религиозного оттенка в сноске.
  alternative: 'Перевести толковательно: «не почитайте» или «не поклоняйтесь».'
  rationale: Буквальный страх и благоговейное почитание здесь намеренно соприкасаются. Сохранение слова «бояться» не устраняет эту богословски значимую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством правового и заветного наставления. Повтор союза «и» сохраняет торжественное накопление четырёх терминов. Тире и обобщение «всё это» обеспечивают ясную русскую синтаксическую связь между длинным перечнем и повелением.
