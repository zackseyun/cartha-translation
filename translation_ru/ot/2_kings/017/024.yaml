base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: ru
  text: Затем царь Ассирии переселил людей из Вавилона, Куты, Аввы, Хамата и Сефарваима и поселил их в городах Самарии вместо израильтян[a]. Они овладели Самарией и жили в её городах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «сынов Израиля».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: переселил людей
  rationale: В породе хифиль глагол בוא означает «привести, доставить». Объект прямо не назван, но из контекста ясно, что речь идёт о переселяемых людях; «переселил людей» естественно передаёт это по-русски.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Естественная русская передача сопряжённого сочетания.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: из Вавилона, Куты, Аввы, Хамата и Сефарваима
  rationale: Географические названия переданы традиционными и понятными русскими формами с сохранением исходного перечня.
- source_word: וַיֹּשֶׁב
  choice: поселил их
  rationale: 'Хифиль от ישׁב имеет каузативное значение: царь сделал так, чтобы переселенцы жили там. Русское «поселил» точно и естественно передаёт этот смысл.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: в городах Самарии
  rationale: Сохранено множественное число «города»; Самария здесь обозначает область, включавшую несколько городов.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: вместо израильтян
  rationale: תַּחַת означает «вместо, на месте», а выражение «сыны Израиля» здесь служит общим этническим обозначением. «Израильтяне» передаёт его функцию современным русским языком; буквальная форма отмечена в сноске.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: Они овладели Самарией
  rationale: В контексте заселения ירשׁ означает вступить во владение, завладеть территорией; «овладели» передаёт этот смысл без неуместного оттенка наследования.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: и стали жить в её городах
  rationale: Форма qal глагола ישׁב означает «жить, обитать». Местоимение «её» относится к Самарии; «стали жить» отражает начало постоянного проживания.
theological_decisions:
- issue: Родовая форма этнического выражения בְּנֵי יִשְׂרָאֵל
  choice: израильтян
  alternative: сынов Израиля
  rationale: Буквально выражение имеет форму мужского рода «сыны Израиля», но в данном месте обозначает весь народ, а не только мужчин. Основной текст передаёт этническое значение, а буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён ясным и повествовательным; архаизмы вроде «обитал» и двусмысленное здесь «унаследовали» не используются.
