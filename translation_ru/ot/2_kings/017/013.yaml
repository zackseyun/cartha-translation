source:
  edition: WLC
  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: ru
  text: 'Но Яхве предостерегал[a] Израиль и Иудею через каждого Своего пророка и каждого провидца, говоря: «Отвратитесь от своих злых путей и соблюдайте Мои заповеди и Мои установления согласно всему закону, который Я заповедал вашим отцам[b] и который послал вам через[c] Моих слуг — пророков».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствовал против Израиля и Иудеи». Еврейский глагол может означать как торжественное предостережение, так и свидетельство против кого-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Слово «отцы» может также пониматься в более широком смысле: «предки».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «посредством Моих слуг — пророков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: предостерегал
  rationale: Глагол עוּד в породе хифиль здесь передаёт торжественное, настойчивое предостережение, близкое к свидетельству против виновных. «Предостерегал» естественно вводит последующий прямой призыв и не устраняет судебного оттенка, отмеченного в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: בְּיִשְׂרָאֵל וּבִיהוּדָה
  choice: Израиль и Иудею
  rationale: При глаголе עוּד предлог ב обозначает тех, кому адресовано предостережение, и может также иметь оттенок свидетельства против них. Русское прямое дополнение звучит естественно, не перегружая формулировку.
- source_word: בְּיַד כָּל נְבִיאוֹ כָּל חֹזֶה
  choice: через каждого Своего пророка и каждого провидца
  rationale: Оборот בְּיַד имеет инструментальное значение «посредством, через». Повтор «каждого» сохраняет распределительную силу כָּל … כָּל, а «провидец» передаёт отдельное обозначение пророческого служителя, связанное с видением.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: Отвратитесь от своих злых путей
  rationale: שׁוּב буквально означает поворот или возвращение; с предлогом מִן здесь требуется значение удаления от прежнего нравственного образа жизни. «Отвратитесь от» точно и естественно передаёт направленность действия, а «пути» сохраняет исходную метафору.
- source_word: וְשִׁמְרוּ מִצְוֺתַי חֻקּוֹתַי
  choice: и соблюдайте Мои заповеди и Мои установления
  rationale: В заветно-правовом контексте שׁמר означает соблюдать. Раздельная передача מִצְוֹת и חֻקּוֹת словами «заповеди» и «установления» сохраняет различие двух правовых терминов.
- source_word: כְּכָל הַתּוֹרָה
  choice: согласно всему закону
  rationale: תּוֹרָה может означать наставление или закон; сочетание с заповедями и установлениями поддерживает здесь «закон». «Всему» сохраняет כָּל.
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבֹתֵיכֶם
  choice: который Я заповедал вашим отцам
  rationale: «Отцам» буквально передаёт мужскую форму אָבוֹת и сохраняет заветно-историческую лексику; возможное более широкое понимание «предки» отмечено в сноске.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: и который послал вам через Моих слуг — пророков
  rationale: Формулировка сохраняет грамматическую связь относительного оборота с законом и передаёт בְּיַד как посредничество. Тире ясно оформляет приложение «пророков» к «слуг».
theological_decisions:
- issue: К чему относится выражение «который послал вам»
  choice: В основном тексте относительное местоимение грамматически соотнесено с «законом».
  alternative: Оборот может шире указывать на возвещённые пророками требования или возобновлять весь призыв отвратиться от зла и соблюдать Божьи повеления.
  rationale: Ближайший грамматический антецедент — «закон», однако исходный синтаксис допускает более широкую смысловую связь. Перевод сохраняет необычный образ посланного закона и не заменяет его поясняющим толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-пророческого повествования. Сохранены личное имя «Яхве», два различных правовых термина и отдельное обозначение «провидец». Библейские метафоры «злые пути» и «послал закон» оставлены без пояснительного сглаживания; прямой призыв сформулирован ясно для современного читателя.
