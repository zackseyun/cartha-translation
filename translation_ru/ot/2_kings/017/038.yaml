  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: ru
  text: Не забывайте завета, который Я заключил с вами[a], и не бойтесь других богов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «завет, который Я „отрезал“ с вами». Это древнееврейская идиома заключения завета; «заключил» передаёт её естественным русским выражением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не забудете завета… и не будете бояться других богов». Еврейские формы здесь можно передать как запрет или как наставление.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: завет
  rationale: В данном контексте слово обозначает установленное Богом обязательное отношение; «завет» сохраняет его формальный и богословский смысл лучше, чем более общее «соглашение».
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: который Я заключил с вами
  rationale: Буквально еврейская идиома означает «рассёк завет», но по-русски естественно говорить «заключить завет».
- source_word: לֹא תִשְׁכָּחוּ
  choice: не забывайте
  rationale: Форма с לֹא здесь выражает запрет или наставление; русский императив естественно передаёт эту функцию.
- source_word: וְלֹא תִירְאוּ
  choice: и не бойтесь
  rationale: יָרֵא может означать страх или благоговейное почитание. «Не бойтесь» сохраняет прямую лексику исходного текста и не сводит смысл исключительно к поклонению.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: других богов
  rationale: Это прямой и привычный перевод обозначения богов помимо Бога Израиля; он сохраняет формулу исключительной верности завету.
theological_decisions:
- issue: Заветный характер запрета
  choice: 'Сохранить «завет» и передать оба запрета русскими повелительными формами: «не забывайте» и «не бойтесь».'
  alternative: 'Передать формами будущего времени: «не забудете» и «не будете бояться», либо перевести ירא как «не почитайте».'
  rationale: В данном контексте еврейский имперфект с отрицанием имеет запретительную силу. Русский императив яснее передаёт наставление, а «бойтесь» сохраняет смысловую широту ירא, включая религиозное благоговение и верность, не устраняя присущую слову неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Начальное «А» передаёт соединительное וְ и связь с предыдущим наставлением; инверсия «завета… не забывайте» сохраняет вынесение объекта в начало и его смысловое ударение.
