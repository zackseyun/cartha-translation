  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: ru
  text: Они оставили все заповеди Яхве, своего Бога, и отлили себе литое изваяние — двух тельцов[a]; сделали Ашеру[b], поклонялись всему небесному воинству и служили Ваалу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь стоит единственное число: «литое изваяние», хотя далее названы «два тельца».'
    reason: Сохранение формальной особенности исходного текста без её интерпретационного устранения.
  - marker: b
    text: Еврейское слово «Ашера» может обозначать ханаанскую богиню или посвящённый ей культовый предмет.
    reason: Лексическая неоднозначность исходного термина.
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: оставили
  rationale: В данном контексте глагол означает отступление от заповедей и отказ следовать им; «оставили» естественно по-русски и сохраняет связь с прямым дополнением.
- source_word: כָּל מִצְוֺת
  choice: все заповеди
  rationale: Сохранены и значение מִצְוֺת в контексте завета, и явно выраженная полнота כָּל.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: Возвратное местоимение естественно связывает Бога с подлежащим и сохраняет значение еврейского суффикса «их».
- source_word: וַיַּעֲשׂוּ לָהֶם מַסֵּכָה שנים עֲגָלִים
  choice: отлили себе изображения — двух тельцов
  rationale: «Отлили» передаёт конкретный смысл מַסֵּכָה как литого изделия; «себе» сохраняет дательный компонент. Два тельца представлены как пояснение к изображениям, без общего слова «идолы», которого в тексте нет.
- source_word: אֲשֵׁירָה
  choice: Ашеру
  rationale: Транслитерация сохраняет неоднозначность между именем ханаанской богини и обозначением связанного с ней культового предмета.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: поклонялись
  rationale: Глагол обозначает поклон с религиозным значением; русский глагол передаёт и действие, и культовый контекст.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: всему небесному воинству
  rationale: Традиционное и точное обозначение совокупности небесных светил; כָּל передано словом «всему».
- source_word: וַיַּעַבְדוּ
  choice: служили
  rationale: Сохраняет отдельное от поклонения понятие культового служения.
- source_word: הַבָּעַל
  choice: Ваалу
  rationale: Имя божества передано в принятой русской форме; еврейский артикль отдельно не воспроизводится, поскольку это было бы неестественно по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; «Яхве» непосредственно передаёт тетраграмматон и не заменяет имя титулом.
- issue: Неоднозначность אֲשֵׁירָה
  choice: Ашеру
  alternative: столб Ашеры; богиню Ашеру
  rationale: Фраза «сделали Ашеру» позволяет предполагать культовый предмет, однако само слово может относиться и к богине. Транслитерация и сноска не устраняют эту неоднозначность.
- issue: Соотношение מַסֵּכָה и שנים עֲגָלִים
  choice: изображения — двух тельцов
  alternative: литое изображение — двух тельцов; двух литых тельцов
  rationale: В еврейском מַסֵּכָה имеет форму единственного числа, тогда как далее названы два тельца. Русский текст передаёт понятный предметный смысл и сохраняет пояснительное соотношение, не утверждая сверх текста, что речь о каком-то третьем изображении.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Синтаксический ряд действий сохранён, а повторяющийся еврейский союз передан естественным русским перечислением.
