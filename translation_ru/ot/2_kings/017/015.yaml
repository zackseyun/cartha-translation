base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: ru
  text: Они отвергли Его постановления, и Его завет, который Он заключил с их отцами, и Его свидетельства, которыми Он предостерегал их. Они последовали за пустотой[a] — и сами опустели[b], — и за народами, окружавшими их, которым Яхве повелел им не уподобляться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Пустота» может также означать нечто тщетное или ничтожное, а в этом контексте — подразумевать идолов.
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте игра однокоренных слов: они последовали за «пустотой» и сами «опустели», то есть уподобились тому ничтожному, за чем пошли.'
    reason: wordplay
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: они отвергли
  rationale: Глагол מָאַס означает отвергать, отказываться признавать; «отвергли» точно передаёт сознательное неприятие без лишнего эмоционального оттенка.
- source_word: חֻקָּיו
  choice: Его постановления
  rationale: «Постановления» естественно передаёт юридико-заветный смысл חֻקִּים в современном русском языке.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: Его завет, который Он заключил
  rationale: Русское «заключить завет» естественно передаёт древнееврейскую идиому «рассечь завет».
- source_word: אֲבוֹתָם
  choice: их отцами
  rationale: Сохранено буквальное «отцы», характерное для формулы завета, без обобщения до «предков».
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: Его свидетельства, которыми Он предостерегал их
  rationale: «Свидетельства» сохраняет заветно-юридическую лексику עֵדוֹת, а «предостерегал» передаёт функцию Hiphil הֵעִיד в данном контексте.
- source_word: הַהֶבֶל וַיֶּהְבָּלוּ
  choice: за пустотой — и сами опустели
  rationale: 'Эта формулировка сохраняет намеренную игру однокоренных слов: они пошли за пустым и сами стали пустыми. «Пустота» также не устраняет возможный контекстуальный намёк на идолов.'
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: за народами, окружавшими их
  rationale: «Народы» точно соответствует историческому значению גּוֹיִם; причастный оборот естественно передаёт סְבִיבֹתָם.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, непосредственно стоящее в древнееврейском тексте.
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: не поступать, как они
  rationale: Сохранена краткость древнееврейского выражения без добавления подразумеваемого «поступали».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Значение הֶבֶל в контексте идолопоклонства
  choice: пустота
  alternative: идолы / ничтожество
  rationale: «Пустота» сохраняет образную многозначность слова и игру с однокоренным глаголом, не сводя смысл исключительно к идолам.
- issue: Функция עֵדוֹת и הֵעִיד
  choice: свидетельства, которыми Он предостерегал их
  alternative: предостережения, которыми Он предупреждал их / свидетельства, которыми Он свидетельствовал против них
  rationale: Основной текст сохраняет существительное «свидетельства» и одновременно выражает предупредительную силу глагола; возможный судебный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис умеренно формальный, но понятный; заглавные местоимения в отношении Бога применены последовательно. Игра слов הֶבֶל—וַיֶּהְבָּלוּ сохранена естественной русской парой «пустота—опустели».
