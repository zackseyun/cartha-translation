  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: ru
  text: Но они не стали слушать и ожесточили свою шею, как шея их отцов, которые не верили[a] Яхве, своему Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не доверяли Яхве, своему Богу». Еврейский глагол может обозначать веру или доверие в рамках отношений завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  choice: Но они не слушали
  rationale: Сочетание союза с отрицанием противопоставляет их поведение предшествующим Божьим предостережениям. «Не слушали» сохраняет основное значение שׁמע и в контексте подразумевает отказ повиноваться.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: сделали свою шею… несгибаемой
  rationale: Передан конкретный еврейский образ упрямо напряжённой шеи; «несгибаемой» звучит по-русски понятнее и естественнее, чем буквальное «ожесточили шею», не сводя метафору к отвлечённому «упрямились».
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: такой же… как шея их отцов
  rationale: Сравнение в еврейском тексте относится непосредственно к шее, поэтому образ и повтор существительного сохранены.
- source_word: הֶאֱמִינוּ בַּיהוָה
  choice: не верили Яхве
  rationale: Глагол אמן в породе hифиль с предлогом ב может обозначать веру и доверие. Русское «верить Яхве» сохраняет личностно-доверительный смысл и не сводит высказывание к отрицанию существования Бога.
- source_word: אֱלֹהֵיהֶם
  choice: своему Богу
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит Бога с подлежащим придаточного предложения и сохраняет заветную характеристику.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное заветное имя, прямо присутствующее в еврейском тексте, без замены титулом.
- issue: 'Значение הֶאֱמִינוּ: вера или доверие'
  choice: не верили Яхве
  alternative: не доверяли Яхве
  rationale: Основной текст сохраняет широкий смысл глагола — веру, включающую доверие, — а допустимый более узкий вариант указан в сноске, чтобы не устранять лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением выразительной телесной метафоры оригинала. Формулировка «сделали свою шею… несгибаемой» намеренно избегает как архаичного «ожесточили выю», так и утраты образа при отвлечённом «упрямились».
