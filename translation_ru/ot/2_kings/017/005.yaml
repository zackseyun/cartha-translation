  text: וַ/יַּ֥עַל מֶֽלֶךְ אַשּׁ֖וּר בְּ/כָל הָ/אָ֑רֶץ וַ/יַּ֨עַל֙ שֹׁמְר֔וֹן וַ/יָּ֥צַר עָלֶ֖י/הָ שָׁלֹ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: ru
  text: Царь Ассирии прошёл по всей стране, затем выступил против Самарии[a] и осаждал её три года.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднялся к Самарии». Еврейский глагол может обозначать как движение вверх или приближение, так и военное наступление; последующее упоминание осады поддерживает здесь враждебный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: прошёл / выступил против
  rationale: Глагол עלה буквально означает «подниматься, идти вверх», а в повествовании о войне часто обозначает военное продвижение. В первом случае «прошёл» естественно передаёт движение по всей стране; во втором «выступил против» ясно выражает враждебное наступление, подтверждаемое последующей осадой.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Естественная передача еврейской сопряжённой конструкции; речь идёт об определённом, известном из контекста правителе.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей стране
  rationale: Предлог ב здесь указывает на движение по территории; «по всей стране» передаёт широкий охват, не конкретизируя сверх текста характер военных действий.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: выступил против Самарии
  rationale: В военном контексте עלה с названием города может означать наступление на него. Выбор звучит естественно по-русски и согласуется со следующим сообщением об осаде, а буквальная пространственная окраска отмечена в сноске.
- source_word: וַיָּצַר עָלֶיהָ
  choice: осаждал её
  rationale: Глагол צור в данной форме обозначает осаду города. Несовершенный вид естественно сочетается с указанием длительности «три года».
- source_word: שָׁלֹשׁ שָׁנִים
  choice: три года
  rationale: В русском языке продолжительность после глагола «осаждал» естественно выражается винительным падежом без предлога.
