  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: ru
  text: 'И они сказали царю Ассирии: «Народы, которых ты депортировал и поселил в городах Самарии, не знают установленного порядка почитания бога этой земли[b]. Поэтому он наслал на них львов, и вот, львы убивают их, потому что они не знают установленного порядка почитания бога этой земли[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бога этой земли». В контексте повествования речь идёт о Боге Израиля, однако написание со строчной буквы сохраняет взгляд говорящих, считавших его божеством определённой земли.'
    reason: alternative_reading
  - marker: b
    text: 'Евр. «мишпат»; также: «закон», «установление», «обычай». Здесь речь идёт о требуемом порядке почитания божества земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: народы
  rationale: В контексте ассирийского переселения речь идёт о нескольких этнических группах; «народы» естественно передаёт собирательно-политический смысл.
- source_word: הִגְלִיתָ
  choice: переселил
  rationale: Hiphil глагола גלה обозначает принудительное удаление с родной земли. «Переселил» ясно передаёт действие ассирийского царя и хорошо сочетается с последующим «поселил»; оттенок депортации очевиден из контекста.
- source_word: וַתּוֹשֶׁב
  choice: и поселил
  rationale: 'Сохранено каузативное значение: царь распорядился поселить переселённые народы в самарийских городах.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: в городах Самарии
  rationale: Формально и естественно передаёт конструкцию и сохраняет региональное значение Самарии.
- source_word: מִשְׁפַּט
  choice: установления
  rationale: Здесь слово обозначает предписанный порядок или требования почитания местного божества. «Установления» сохраняет нормативный смысл, не сводя его ни к судебному решению, ни только к обычаю.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: бога этой земли
  rationale: Строчная буква сохраняет языческое представление говорящих о территориальном божестве; указательное «этой» естественно выражает определённость контекстуально известной земли.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: Поэтому он наслал на них львов
  rationale: «Поэтому» передаёт причинно-следственную связь в речи посланников, а «наслал» естественно выражает направленное бедствие, оставаясь близким к «послал».
- source_word: וְהִנָּם מְמִיתִים אוֹתָם
  choice: и вот, львы убивают их
  rationale: «И вот» сохраняет функцию привлечения внимания, причастие передано настоящим временем продолжающегося действия; явное «львы» устраняет неестественную для русского двусмысленность местоимения.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: потому что они не знают
  rationale: В данном контексте כַּאֲשֶׁר имеет причинное значение, которое ясно передаётся союзом «потому что».
theological_decisions:
- issue: Прописная или строчная буква в выражении אֱלֹהֵי הָאָרֶץ
  choice: «бога этой земли» со строчной буквы
  alternative: «Бога этой земли» с прописной буквы
  rationale: Прямая речь передаёт взгляд переселённых языческих народов, воспринимавших божество как связанное с определённой территорией. Строчная буква сохраняет их перспективу, не отрицая, что в повествовательном контексте речь идёт о Боге Израиля.
- issue: Смысл מִשְׁפַּט применительно к богу земли
  choice: «установления»
  alternative: «закон», «обычай», «порядок почитания»
  rationale: «Установления» сохраняет нормативную широту еврейского слова и не уточняет без необходимости, идёт ли речь о законе вообще или конкретно о культовом порядке.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для прямой речи; архаизм «се» не используется. Повтор исходного выражения сохранён.
