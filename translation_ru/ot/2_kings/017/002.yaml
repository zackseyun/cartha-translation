  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, однако[a] не так, как цари Израиля, предшествовавшие ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «только». Еврейская частица вводит ограничение к предшествующей отрицательной оценке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он делал
  rationale: Нарративная форма глагола עשה сообщает о характерном для царя поведении; русское несовершенное «делал» естественно передаёт формулу оценки его царствования.
- source_word: הָרַע
  choice: зло
  rationale: Субстантивированное прилагательное буквально означает «злое»; в современном русском формула «делал зло» звучит естественно и точно.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранён еврейский образ оценки с чьей-либо точки зрения; выражение понятно в современном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: רַק
  choice: однако
  rationale: Здесь частица вводит ограничение или смягчающее сопоставление после отрицательной оценки; «однако» естественно выражает этот оттенок, тогда как буквальное «только» отмечено в сноске.
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: не так, как цари Израиля
  rationale: Сравнительная конструкция с отрицанием передана ясно и близко к еврейскому тексту.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: бывшие до него
  rationale: Оборот указывает на предшествовавших ему царей; такая формулировка сохраняет структуру оригинала и остаётся естественной по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога и не заменяет его титулом.
- issue: Степень смягчения отрицательной оценки царя
  choice: однако не так, как цари Израиля
  alternative: только не как цари Израиля
  rationale: Частица רַק ограничивает предшествующую оценку, не отменяя её. Перевод не уточняет, в чём именно его зло отличалось от зла прежних царей.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского оценочного образа «в глазах Яхве». Формулировка краткая и достоинственная; синтаксическая неоднозначность частицы רַק отмечена в сноске.
