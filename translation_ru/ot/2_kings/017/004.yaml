base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: ru
  text: 'Но царь Ассирии обнаружил, что Осия замышляет заговор[a]: тот посылал вестников к Со[b], царю Египта, и не доставлял ежегодной дани[c] царю Ассирии. Тогда царь Ассирии задержал Осию и заковал его в темнице[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нашёл в Осии заговор»; то есть обнаружил его заговорщические замыслы.'
    reason: lexical_alternative
  - marker: b
    text: «Со» — передача еврейского имени. Точно установить, какой египетский правитель имеется в виду, невозможно.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «не доставлял дани… из года в год»; по смыслу: не вносил ежегодной дани.'
    reason: lexical_alternative
  - marker: d
    text: 'В еврейском тексте различены последовательные действия: ассирийский царь сначала задержал Осию, а затем заковал его в темнице.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... בְּהוֹשֵׁעַ קֶשֶׁר
  choice: обнаружил, что Осия замышляет заговор
  rationale: Еврейское выражение буквально говорит, что царь «нашёл в Осии заговор»; по-русски естественно передать его как обнаружение заговорщических замыслов Осии, не меняя политического смысла קֶשֶׁר.
- source_word: שָׁלַח מַלְאָכִים
  choice: посылал вестников
  rationale: מַלְאָכִים обозначает посланцев или вестников; «вестники» сохраняет широкое значение, а дипломатический характер поручения понятен из контекста.
- source_word: סוֹא
  choice: Со
  rationale: Сохранена транслитерация еврейской формы имени, поскольку историческая идентификация этого египетского правителя остаётся спорной.
- source_word: מִנְחָה
  choice: дань
  rationale: В отношениях вассального царя с Ассирией слово означает политическую дань, а не общее подношение или дар.
- source_word: לֹא הֶעֱלָה ... כְּשָׁנָה בְשָׁנָה
  choice: не доставлял ежегодной дани
  rationale: הֶעֱלָה буквально означает «поднимал, доставлял наверх», а оборот כְּשָׁנָה בְשָׁנָה указывает на ежегодную регулярность. Русская формулировка естественна и сохраняет оба компонента.
- source_word: וַיַּעְצְרֵהוּ
  choice: задержал Осию
  rationale: Глагол может означать удержать, задержать или заключить. «Задержал» отличает первоначальное взятие под стражу от последующего связывания и помещения в темницу.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: заковав, заключил его в темницу
  rationale: וַיַּאַסְרֵהוּ буквально передаёт связывание или наложение оков, а בֵּית כֶּלֶא — место заключения. Формулировка сохраняет оба элемента без неестественного русского повтора.
