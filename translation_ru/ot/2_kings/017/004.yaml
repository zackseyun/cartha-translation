translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для широкого читателя; имя Осия повторено вместо местоимения там, где это предотвращает двусмысленность. Союзы «но» и «тогда» естественно связывают стих с предшествующим контекстом и его внутренним следствием.
