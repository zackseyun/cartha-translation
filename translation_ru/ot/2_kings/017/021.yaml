  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: ru
  text: Ибо Он отторг Израиль от дома Давида, и они поставили царём Иеровоама, сына Навата. Иеровоам отвратил Израиль от следования за Яхве[a] и побудил его совершить тяжкий грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать также «увёл» или «заставил отступить».
    reason: Сохранение лексического диапазона глагола וַיַּדַּח.
lexical_decisions:
- source_word: קָרַע יִשְׂרָאֵל מֵעַל בֵּית דָּוִד
  choice: Он отторг Израиль от дома Давида
  rationale: Форма קָרַע — активный глагол в 3-м лице единственного числа, а יִשְׂרָאֵל естественно понимать как прямое дополнение; подразумеваемый субъект из контекста — Яхве. «Отторг» сохраняет яркий образ разрыва и передаёт политическое отделение от династии Давида. В сноске отмечено иное возможное понимание синтаксиса.
- source_word: וַיַּמְלִיכוּ אֶת יָרָבְעָם בֶּן נְבָט
  choice: израильтяне поставили над собой царём Иеровоама, сына Навата
  rationale: Множественное число глагола указывает на людей Израиля как действующих лиц. «Поставили над собой царём» естественно передаёт каузативное значение породы hифиль и политический смысл воцарения.
- source_word: וַיַּדַּח
  choice: отвратил
  rationale: Глагол נדח может означать как насильственное удаление, так и совращение с верного пути. «Отвратил … от следования» сохраняет направительный образ и роль Иеровоама как виновника отступничества; семантическая широта отмечена в сноске.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: от следования за Яхве
  rationale: Буквально-пространственный оборот «из-за/вслед за Яхве» в данном контексте означает перестать следовать за Ним. Русская формулировка сохраняет образ следования и его заветный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: וְהֶחֱטֵיאָם חֲטָאָה גְדוֹלָה
  choice: ввёл его в великий грех
  rationale: Каузативная форма חטא означает, что Иеровоам сделал Израиль причастным греху. Единственное число «его» согласуется с собирательным существительным «Израиль», а «великий грех» прямо передаёт חֲטָאָה גְדוֹלָה.
theological_decisions:
- issue: Кто отторг Израиль от дома Давида
  choice: 'Подразумеваемый субъект — Бог: «Он отторг Израиль»'
  alternative: «Израиль отторгся от дома Давида»
  rationale: Масоретский текст содержит активную форму 3-го лица единственного числа קָרַע, после которой יִשְׂרָאֵל естественно выступает дополнением. Однако из-за отсутствия явно названного субъекта и иной традиции понимания альтернативу следует сохранить в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Степень принуждения в וַיַּדַּח
  choice: «отвратил»
  alternative: «увёл» или «заставил отступить»
  rationale: Глагол допускает оттенки изгнания, уведения и совращения. Основной текст не усиливает принуждение сверх того, что однозначно выражено, а сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Отторг» сохраняет библейскую образность, не становясь архаизмом; имена переданы в привычной русской библейской форме, а имя Яхве — транслитерацией. Местоимение «Он» написано с прописной буквы, поскольку по принятому чтению относится к Богу и одновременно помогает связать стих с предшествующим контекстом.
