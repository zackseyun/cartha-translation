lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: ходили
  rationale: 'Сохраняет еврейскую метафору нравственного образа жизни: הלך с предлогом ב обозначает следование определённому пути или образу поведения.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт заветно-национальное выражение оригинала и звучит понятно в современном литературном библейском регистре.
- source_word: בְּכָל חַטֹּאות
  choice: во всех грехах
  rationale: Прямо передаёт предлог ב, всеохватность כָּל и множественное число חַטֹּאות, относящееся к греховным поступкам и практике.
- source_word: יָרָבְעָם
  choice: Иеровоама
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אֲשֶׁר עָשָׂה
  choice: которые он совершил
  rationale: В сочетании с существительным «грехи» глагол עשה естественно передаётся как «совершил», без изменения нравственного смысла.
- source_word: לֹא סָרוּ
  choice: не отступали
  rationale: סור означает уклоняться, отходить или отступать; несовершенный вид по-русски выражает продолжающееся упорство.
- source_word: מִמֶּנָּה
  choice: от этого
  rationale: Сохраняет единственное число еврейского местоименного суффикса и позволяет понимать его как указание на весь только что названный греховный образ жизни.
theological_decisions:
- issue: Референт местоименного суффикса женского рода единственного числа в מִמֶּנָּה после существительного «грехи» во множественном числе
  choice: «от этого» — собирательное указание на описанный греховный путь или образ поведения
  alternative: «от них» — непосредственная отсылка к множественному «грехам»
  rationale: Единственное число оригинала представляет греховную практику Иеровоама как единый путь. Нейтральное «от этого» сохраняет грамматическое напряжение и не вынуждает выбрать подразумеваемое существительное.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Метафора «ходили во грехах» сохранена как значимая черта оригинала; архаизмы сведены к узнаваемой формуле «сыны Израиля».
