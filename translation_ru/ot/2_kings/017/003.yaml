  text: עָלָ֣י/ו עָלָ֔ה שַׁלְמַנְאֶ֖סֶר מֶ֣לֶךְ אַשּׁ֑וּר וַֽ/יְהִי ל֤/וֹ הוֹשֵׁ֨עַ֙ עֶ֔בֶד וַ/יָּ֥שֶׁב ל֖/וֹ מִנְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: ru
  text: Салманасар, царь Ассирии, выступил против него, и Осия стал его подданным[a] и платил ему дань.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стал ему слугой»; это выражение означает политическое подчинение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: выступил против него
  rationale: Военный оборот обозначает движение войска против правителя; «выступил против» естественно по-русски и не уточняет сверх текста, дошло ли дело до непосредственного нападения.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Салманасар
  rationale: Традиционная русская передача имени ассирийского царя.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Аппозитивный титул и название державы переданы в обычной русской библейской форме.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: стал его подданным
  rationale: Конструкция указывает на изменение политического статуса Осии. «Подданный» ясно передаёт зависимость царя от иноземного владыки, не создавая ошибочного впечатления личного рабства.
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: платил ему дань
  rationale: В международно-политическом контексте сочетание означает регулярную выплату дани зависимым правителем; несовершенный вид естественно выражает продолжающуюся обязанность.
- source_word: מִנְחָה
  choice: дань
  rationale: Здесь слово обозначает не дар и не культовое приношение, а платёж, свидетельствующий о политической зависимости.
theological_decisions: []
