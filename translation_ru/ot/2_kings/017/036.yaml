  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: ru
  text: А только Яхве[a], Который вывел вас из земли Египта великой силой и простёртой рукой, — Его бойтесь[b], Ему поклоняйтесь и Ему приносите жертвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Напротив, Яхве… Его бойтесь». Начальные слова в древнееврейском тексте противопоставляют Яхве другим богам.'
    reason: alternative_reading
  - marker: b
    text: Здесь «бояться» означает не только испытывать страх, но и благоговейно чтить Бога и хранить Ему верность.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Но только
  rationale: 'Сочетание имеет противопоставительный смысл: не иных богов, а только Яхве. «Но только» естественно передаёт и контраст, и исключительность.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: הֶעֱלָה
  choice: вывел
  rationale: В контексте исхода каузатив глагола עלה идиоматически означает «вывел»; буквальное «поднял» по-русски было бы неестественным.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохранена полная традиционная формула исхода в современном, но возвышенном русском регистре.
- source_word: בְּכֹחַ גָּדוֹל
  choice: великой силой
  rationale: Творительный падеж естественно передаёт инструментальное значение предлога בְּ.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: и простёртой рукой
  rationale: Сохранён устойчивый библейский образ явленной спасительной силы Бога.
- source_word: אֹתוֹ תִירָאוּ
  choice: Его бойтесь
  rationale: Начальная позиция дополнения в древнееврейском подчёркивает исключительный объект страха и почитания; инверсия естественно сохраняет это ударение.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: Ему поклоняйтесь
  rationale: Глагол обозначает склонение или простирание ниц как акт почитания. «Поклоняйтесь» естественно передаёт и действие, и его культовый смысл.
- source_word: וְלוֹ תִזְבָּחוּ
  choice: Ему приносите жертвы
  rationale: Так передаётся жертвенный смысл זבח и повторённое в оригинале «Ему», подчёркивающее исключительную направленность служения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл глагола ירא в контексте заветного служения
  choice: бойтесь
  alternative: почитайте
  rationale: «Бойтесь» сохраняет прямой смысл и богословскую напряжённость слова, которое здесь включает благоговение и верность, но не сводится без остатка к одному из этих понятий.
- issue: Передача תשתחוו
  choice: поклоняйтесь
  alternative: падайте ниц
  rationale: Контекст явно культовый. «Поклоняйтесь» естественно для современного русского языка, хотя исходный глагол сохраняет телесный образ склонения или простирания ниц.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм «Его… Ему… Ему…» сохраняет ритм и исключительный акцент оригинала.
