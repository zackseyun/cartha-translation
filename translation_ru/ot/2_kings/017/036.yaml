revisions:
- from: Но только Яхве[a], Которого вывел вас из земли Египетской великой силой и простёртой рукой, — Его бойтесь[b], Ему поклоняйтесь и Ему приносите жертвы.
  to: А только Яхве[a], Который вывел вас из земли Египта великой силой и простёртой рукой, — Его бойтесь[b], Ему поклоняйтесь и Ему приносите жертвы.
  rationale: 'Исправлен обязательный синтаксический дефект: «Которого» заменено на «Который», поскольку Яхве в оригинале — тот, кто вывел народ из Египта. Для современного литературного регистра «Но только» заменено на «А только», а «из земли Египетской» — на «из земли Египта». Смысл, акцент на исключительном почитании Яхве и все действующие примечания сохранены.'
