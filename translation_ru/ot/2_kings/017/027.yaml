base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: ru
  text: 'Тогда царь Ассирии приказал: «Отправьте[a] туда одного из священников, которых вы увели оттуда в изгнание. Пусть он пойдёт, поселится там[b] и научит их обычаю служения[c] богу этой земли[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Приведите туда» или «пошлите туда».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь стоят глаголы множественного числа: «пусть они пойдут и поселятся». Однако по смыслу речь идёт об одном священнике, а следующий глагол — в единственном числе.'
    reason: textual_or_grammatical_irregularity
  - marker: c
    text: 'Возможно также: «закону», «установлению» или «обычаю» бога этой земли.'
    reason: lexical_alternative
  - marker: d
    text: 'Возможно также написание с прописной буквы: «Бога этой земли». Строчная буква в основном тексте отражает представление ассирийского царя о территориальном божестве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: приказал
  rationale: Глагол צוה выражает властное распоряжение; «приказал» естественно передаёт царский приказ в современном русском повествовании.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: отправьте туда
  rationale: Hiphil от הלך означает побудить кого-либо идти; «отправьте» ясно передаёт перемещение по царскому приказу, не перегружая фразу.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: одного из священников
  rationale: Естественная передача партитивной конструкции без смыслового расширения.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: которых вы увели в изгнание оттуда
  rationale: Hiphil глагола גלה обозначает насильственное переселение или изгнание. Формулировка сохраняет как действие, так и положение изгнанников.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: пусть он пойдёт и поселится там
  rationale: Хотя в масоретском тексте оба глагола стоят во множественном числе, ближайший смысловой субъект — «один из священников», а следующий глагол וְיֹרֵם имеет единственное число. Основной текст передаёт очевидный сингулярный смысл, а формальная особенность отмечена в сноске.
- source_word: וְיֹרֵם
  choice: и научит их
  rationale: Hiphil от ירה означает учить или наставлять; местоименный суффикс множественного числа передан словом «их».
- source_word: מִשְׁפַּט
  choice: порядку почитания
  rationale: В контексте מִשְׁפַּט обозначает должный религиозный порядок или предписанный способ обращения с местным божеством. Формулировка звучит естественно по-русски и не сужает значение до писаного закона.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: бога этой земли
  rationale: Строчная буква передаёт точку зрения ассирийского царя, мыслящего в категориях территориального божества; указательное «этой» естественно связывает выражение с упомянутой землёй.
theological_decisions:
- issue: Прописная или строчная буква в אֱלֹהֵי הָאָרֶץ
  choice: бога этой земли
  alternative: Бога этой земли
  rationale: Речь царя отражает языческое представление о местном территориальном божестве. Строчная буква сохраняет перспективу говорящего, не отрицая того, что в контексте речь идёт о Боге Израиля.
- issue: Несогласование числа в וְיֵלְכוּ / וְיֵשְׁבוּ с единственным אֶחָד и וְיֹרֵם
  choice: 'передать по смыслу в единственном числе: «пусть он пойдёт и поселится»'
  alternative: 'формально сохранить множественное число: «пусть они пойдут и поселятся»'
  rationale: Единственное число соответствует непосредственному субъекту «один из священников» и последующему глаголу единственного числа. Необычное множественное число исходного текста документировано, а не скрыто.
- issue: Смысл מִשְׁפַּט в религиозном контексте
  choice: порядок почитания
  alternative: закон или требование бога этой земли
  rationale: Выражение может указывать как на обычай, так и на обязательное установление. Основной вариант сохраняет практическую религиозную направленность, а более юридические оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Царская речь передана без архаического «сказав». Формулировка «увели в изгнание» сохраняет исторический характер депортации; «порядок почитания» делает религиозно-практический смысл понятным обычному читателю.
