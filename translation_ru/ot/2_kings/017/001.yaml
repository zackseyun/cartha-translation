  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: ru
  text: В двенадцатый год правления Ахаза, царя Иудеи, Осия, сын Илы, воцарился в Самарии над Израилем и царствовал девять лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: воцарился… и царствовал
  rationale: Первое употребление естественно передаёт вступление на царство, а второе — продолжительность царствования; это сохраняет повтор еврейского глагола без неестественной русской конструкции.
- source_word: הוֹשֵׁעַ
  choice: Осия
  rationale: Традиционная русская библейская форма имени израильского царя Осии.
- source_word: אֵלָה
  choice: Ила
  rationale: Традиционная русская библейская передача имени отца Осии.
- source_word: בְ/שֹׁמְרוֹן עַל יִשְׂרָאֵל
  choice: над Израилем в Самарии
  rationale: Передаёт Израиль как область царствования, а Самарию как место царского правления.
