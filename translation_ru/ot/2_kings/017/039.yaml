  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: ru
  text: Но бойтесь Яхве, вашего Бога, и Он избавит вас из руки всех ваших врагов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из руки всех ваших врагов»; «рука» здесь означает власть или контроль.'
    reason: Пояснение еврейской идиомы при сохранении её образа в основном тексте.
lexical_decisions:
- source_word: כִּי אִם
  choice: Но
  rationale: Сочетание выражает противопоставление предыдущему запрету бояться иных богов; «но» естественно передаёт этот переход, не исключая присущего контексту оттенка «только».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» общепринята в современной русской библеистике.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: 'По отношению к Яхве грамматически возможная множественность формы אֱלֹהִים не определяет число значения: здесь несомненно имеется в виду один Бог.'
- source_word: תִּירָאוּ
  choice: бойтесь
  rationale: Императивная по функции форма ירא обозначает благоговейный страх перед Богом. «Бойтесь» сохраняет и повелительную силу, и более широкий смысл слова, тогда как «почитайте» устранило бы компонент страха.
- source_word: וְהוּא
  choice: и Он
  rationale: Явное местоимение сохранено; заглавная буква служит обычным русским способом обозначить отнесённость местоимения к Богу, не добавляя нового смысла.
- source_word: יַצִּיל
  choice: избавит
  rationale: Каузативная форма נצל означает избавление или спасение от опасности и власти врага; «избавит» естественно сочетается с последующим оборотом.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён еврейский образ руки как власти или контроля; значение пояснено в сноске.
- source_word: כָּל אֹיְבֵיכֶם
  choice: всех ваших врагов
  rationale: Прямой и естественный перевод сочетания квантификатора со множественным существительным и суффиксом второго лица.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом; «Иегова» отражает более позднее смешение согласных имени с огласовками замещающего чтения.
- issue: Смысл ירא в обращении к Богу
  choice: бойтесь
  alternative: почитайте; благоговейте
  rationale: Контекст требует верности и благоговейного страха, однако исходный глагол не сводится лишь к почтению. Выбор сохраняет богословское напряжение между страхом и благоговением.
- issue: Характер обещания избавления
  choice: избавит
  alternative: может избавить; да избавит
  rationale: Имперфект יַצִּיל после предписания естественно выражает обещанное будущее действие Бога, а не только возможность или пожелание.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Сохранены прямое повеление, личное имя Бога и понятный по контексту библейский образ «руки»; сноска поставлена непосредственно при поясняемом обороте.
