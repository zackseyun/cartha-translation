base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: ru
  text: И произошло это потому, что сыны Израиля согрешили против Яхве, своего Бога, который вывел их из земли Египта, из-под руки фараона, царя Египта[a], и боялись других богов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-под власти фараона». В еврейском тексте буквально: «из-под руки фараона».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поклонялись другим богам». Употреблённый здесь глагол «бояться» может также обозначать благоговейное почитание и преданность, выражаемые в поклонении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: И произошло это потому, что
  rationale: Передаёт объяснительно-причинную функцию оборота в повествовании без архаичного «и было».
- source_word: חָטְאוּ ... לַיהוָה
  choice: согрешили против Яхве
  rationale: Сочетание חטא с ל обозначает грех против кого-либо; имя יהוה передано как «Яхве».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет национально-заветную формулу исходного текста и остаётся узнаваемым в достойном литературном регистре.
- source_word: הַמַּעֲלֶה אֹתָם
  choice: Который вывел их
  rationale: Причастие характеризует Яхве Его совершённым избавительным деянием; русское «вывел» естественно передаёт исход из Египта, тогда как буквальное «поднял» здесь неидиоматично.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Точная и устойчивая русская передача географического выражения, соответствующая возвышенному повествовательному регистру.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: из-под руки фараона
  rationale: Сохраняет еврейский образ руки как власти и господства; смысл пояснён в сноске.
- source_word: וַיִּירְאוּ
  choice: стали бояться
  rationale: 'Сохраняет основное значение ירא и его намеренную широту: в отношении богов страх может включать почитание и культовую преданность.'
- source_word: אֱלֹהִים אֲחֵרִים
  choice: других богов
  rationale: Прямо передаёт обычное значение словосочетания, не заменяя «других» более узким «чужеземных».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст непосредственно употребляет личное заветное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Значение ירא применительно к другим богам
  choice: стали бояться других богов
  alternative: стали поклоняться другим богам; стали чтить других богов
  rationale: Глагол буквально обозначает страх, но в данном религиозном контексте может включать благоговейное почитание и поклонение. Основной текст сохраняет эту смысловую широту, а сноска указывает возможную контекстуальную передачу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены заветная формула «сыны Израиля», образ «из-под руки» и смысловая неоднозначность глагола «бояться»; потенциально неясные места пояснены сносками.
