  source_fidelity: 'Основной смысл передан точно: ישראל согрешили против Яхве, их Бога, выведшего их из Египта и из-под власти фараона; заключительное ירא в отношении иных богов сохранено без неоправданного сужения до одного лишь поклонения. Однако «стали бояться» вносит не выраженное в еврейском тексте начинательное значение («начали»). Простое прошедшее время лучше сохраняет видовую нейтральность формы וַיִּירְאוּ.'
