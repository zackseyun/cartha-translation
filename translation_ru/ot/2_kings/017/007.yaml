  terminology: «Яхве» верно передаёт тетраграмматон. «Сыны Израиля» допустимо в умеренно возвышенном библейском регистре. «Из-под руки фараона» удачно сохраняет образ оригинала; сноска корректно разъясняет идиому. Сноска к «боялись» обоснованно отмечает возможность культового оттенка, не подменяя им основной текст.
