source:
  edition: WLC
  text: וַֽ֠/יַּעֲבִירוּ אֶת בְּנֵי/הֶ֤ם וְ/אֶת בְּנֽוֹתֵי/הֶם֙ בָּ/אֵ֔שׁ וַ/יִּקְסְמ֥וּ קְסָמִ֖ים וַ/יְנַחֵ֑שׁוּ וַ/יִּֽתְמַכְּר֗וּ לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: ru
  text: Они проводили своих сыновей и дочерей через огонь[a], занимались гаданием и толковали знамения. Они продали себя, чтобы делать зло в глазах Яхве, вызывая Его гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным указанием на смысл обряда: «приносили своих сыновей и дочерей в жертву в огне». Буквально по-еврейски: «проводили… через огонь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: проводили ... через огонь
  rationale: Сохраняет буквальный образ еврейского выражения и его межтекстовые связи, не уточняя в основном тексте точную форму огненного обряда.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: своих сыновей и дочерей
  rationale: Еврейский текст отдельно называет сыновей и дочерей; это усиливает выразительность и ужас описанного действия.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: занимались гаданием
  rationale: Естественно передаёт однокоренную глагольно-именную конструкцию и обозначаемую ею практику прорицания.
- source_word: וַיְנַחֵשׁוּ
  choice: толковали знамения
  rationale: Передаёт распознавание и истолкование предзнаменований, сохраняя отличие от предшествующего общего обозначения гадания.
- source_word: וַיִּתְמַכְּרוּ
  choice: продали себя
  rationale: Сохраняет яркую метафору добровольного порабощения злу и нравственной самоотдачи.
- source_word: לַעֲשׂוֹת הָרַע
  choice: чтобы делать зло
  rationale: Естественная русская передача инфинитивной конструкции с субстантивированным понятием зла.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет распространённую еврейскую метафору божественной оценки и остаётся понятной современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לְהַכְעִיסוֹ
  choice: вызывая Его гнев
  rationale: 'Передаёт каузативное значение: своими действиями они навлекали или вызывали гнев Яхве.'
theological_decisions:
- issue: Характер обряда с огнём
  choice: Сохранить в основном тексте идиому «проводили ... через огонь».
  alternative: «сжигали ... в огне» или «приносили ... в жертву в огне»
  rationale: Контекст указывает на осуждаемый обряд, вероятнее всего связанный с принесением детей в жертву, однако сама еврейская формула не описывает его точный механизм. Буквальный образ сохраняет подлинную степень определённости текста.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя, представленное в исходном тексте.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и торжественное без архаизации. Сохранены конкретное называние сыновей и дочерей, метафора «продали себя» и буквальный образ прохождения через огонь.
