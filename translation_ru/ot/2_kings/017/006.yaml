base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: ru
  text: На девятом году царствования Осии царь Ассирии захватил Самарию, увёл Израиль в изгнание — в Ассирию[a] — и поселил их в Халахе, на Хаворе, реке Гозана[b], и в городах Мидии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изгнал Израиль в Ассирию»; возможна также передача: «насильно переселил Израиль в Ассирию». Еврейский глагол обозначает принудительное удаление в изгнание.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «у реки Хавор, в области Гозан». Еврейское выражение может указывать на поселение вдоль реки Хавор в Гозане.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: На девятом году царствования Осии
  rationale: Конструкция обозначает девятый год правления Осии. Добавление «царствования» естественно для современного русского исторического повествования и устраняет возможную неясность функции לְ.
- source_word: לָכַד
  choice: захватил
  rationale: В контексте города глагол обозначает военный захват; это точный и естественный русский эквивалент.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Прямая передача еврейской сопряжённой конструкции в естественной русской форме.
- source_word: שֹׁמְרוֹן
  choice: Самарию
  rationale: Общепринятая русская форма названия города.
- source_word: וַיֶּגֶל אֶת־יִשְׂרָאֵל אַשּׁוּרָה
  choice: увёл Израиль в изгнание в Ассирию
  rationale: Каузативная форма גלה выражает насильственное удаление в изгнание. Формулировка сохраняет коллективное название «Израиль» и направление движения, не создавая нейтрального впечатления добровольного переселения.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: и поселил их
  rationale: Каузатив от ישׁב означает, что царь распорядился поселить изгнанников в названных местах. Русское «поселил» передаёт это без излишней административной конкретизации.
- source_word: בַּחְלַח
  choice: в Халахе
  rationale: Передаёт топоним и предлог места; форма согласована с русским склонением географического названия.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: у Хавора, реки Гозана
  rationale: Хавор представлен как река, связанная с Гозаном. «У» естественно обозначает поселение возле реки, а приложение сохраняет структуру и некоторую неоднозначность еврейского выражения.
- source_word: וְעָרֵי מָדָי
  choice: и в городах Мидии
  rationale: Современная и понятная русская передача названия области и местного значения конструкции.
