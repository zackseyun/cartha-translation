base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: ru
  text: По сей день они поступают по прежним обычаям[a]. Они не боятся Яхве[b] и не поступают ни по их уставам и постановлениям, ни по закону и заповеди, которые Яхве заповедал сынам Иакова[c], которого Он назвал Израилем[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по прежним установлениям»; возможен также смысл «по прежним порядкам».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «бояться Яхве» может означать также «благоговеть перед Яхве»; еврейская формула соединяет страх, почтение и верность Богу.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сынам Иакова»; имеется в виду народ, происходящий от Иакова.'
    reason: lexical_alternative
  - marker: d
    text: То есть Иакова; ср. Бытие 32:28; 35:10.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: по прежним обычаям
  rationale: מִשְׁפָּט может обозначать судебное решение, установление, обычай или принятую практику. Здесь речь идёт о ранее описанных религиозных обычаях, поэтому «прежние обычаи» естественно передаёт контекстуальный смысл.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: боятся Яхве
  rationale: Сохраняет весомую библейскую формулу, включающую как страх, так и благоговейную верность Богу; возможный смысл пояснён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: по их установлениям и правилам
  rationale: Сохраняет местоименный суффикс третьего лица множественного числа и юридико-нормативную пару, не устраняя возможную неоднозначность того, к кому относится «их».
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: ни по закону и заповеди
  rationale: תּוֹרָה здесь имеет заветно-правовой смысл, а единственное число מִצְוָה сохранено. Союз «ни» естественно продолжает отрицание в русском предложении.
- source_word: בְּנֵי יַעֲקֹב
  choice: сынам Иакова
  rationale: Формально передаёт мужское множественное число исходного текста; выражение относится ко всему народу, происходящему от Иакова.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: которому Он дал имя Израиль
  rationale: Естественно по-русски передаёт наречение Иакова именем Израиль и сохраняет отсылку к рассказу Бытия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: К кому относится «их» в выражении «их установлениям и правилам»
  choice: сохранить местоимение «их» без явного уточнения референта
  alternative: истолковать как нормы описываемых народов; истолковать как установления Израиля
  rationale: Еврейские суффиксы имеют форму третьего лица множественного числа, но связь с конкретным предшествующим референтом допускает разборы. Русское «их» сохраняет эту неоднозначность вместо того, чтобы молча решить её.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но правовая лексика и повтор имени Яхве сохранены. Местоимение «их» намеренно не конкретизировано, чтобы не устранять неоднозначность исходного текста.
