base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: ru
  text: Они боялись Яхве[a], но служили своим богам по обычаю тех народов, из которых были переселены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Они боялись Яхве и служили своим богам»; в еврейском тексте стоит обычный союз «и», однако контекст допускает противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: הָיוּ יְרֵאִים
  choice: боялись
  rationale: Конструкция היה с причастием обозначает продолжительное или обычное действие; «боялись» естественно передаёт благоговейный страх.
- source_word: אֱלֹהֵיהֶם
  choice: своим богам
  rationale: Возвратное притяжательное местоимение естественно передаёт суффикс 3-го лица множественного числа и подчёркивает принадлежность этих богов переселенцам.
- source_word: הָיוּ עֹבְדִים
  choice: служили
  rationale: В сочетании с обозначением божества עבד означает религиозное служение; выбор сохраняет лексическую параллель исходного текста.
- source_word: כְּמִשְׁפַּט
  choice: по обычаю
  rationale: В данном контексте מִשְׁפָּט обозначает установленный обычай или практику, а не судебное решение.
- source_word: הַגּוֹיִם
  choice: тех народов
  rationale: «Народы» соответствует историческому контексту разных этнических групп; указательное «тех» естественно связано с последующим определительным оборотом.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: из которых были переселены
  rationale: Неопределённый деятель еврейского каузативного глагола естественно передаётся русской пассивной конструкцией; «переселены» выражает насильственное перемещение без неуместной двусмысленности русского «изгнаны».
theological_decisions:
- issue: Смысл союза וְ между страхом перед Яхве и служением другим богам
  choice: Передать как «но», отметив буквальную альтернативу в сноске.
  alternative: Передать простым соединительным «и».
  rationale: Формально союз означает «и», однако контекст выявляет внутреннее противоречие синкретизма. «Но» делает это отношение ясным, а сноска сохраняет грамматическую неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем. Сохранено имя «Яхве» и ключевая параллель «боялись — служили»; синтаксис сделан естественным для широкого круга читателей.
