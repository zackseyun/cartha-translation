  terminology: «Яхве» последовательно передаёт יהוה. «Резные изображения» хорошо отражает פְּסִילִים и не преждевременно сводит термин к «идолам»; вариант «идолам» уместно сохранён в примечании. «Служили» точно передаёт культовое עבד, не навязывая дополнительной интерпретации.
