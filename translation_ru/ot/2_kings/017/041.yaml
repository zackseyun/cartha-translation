base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: ru
  text: Так эти народы боялись Яхве, но служили своим резным изображениям[a]. И дети их, и дети их детей доныне поступают так же, как поступали их отцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своим идолам». В еврейском тексте имеются в виду изображения, изготовленные резьбой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הַגּוֹיִם הָאֵלֶּה
  choice: Итак, эти народы
  rationale: «Итак» передаёт итоговый характер повествовательной связки в заключении раздела; גּוֹיִם обозначает переселённые в Самарию народы.
- source_word: יְרֵאִים אֶת יְהוָה
  choice: боялись Яхве
  rationale: Сохранена обычная библейская формула религиозного страха и почитания; личное имя יהוה передано как «Яхве».
- source_word: וְאֶת פְּסִילֵיהֶם הָיוּ עֹבְדִים
  choice: но в то же время служили своим резным изображениям
  rationale: Противительная связь явно передаёт смысловое напряжение сопоставленных действий, а «в то же время» подчёркивает их сосуществование. פְּסִילִים — культовые изображения, изготовленные резьбой; конструкция הָיוּ עֹבְדִים обозначает постоянную практику.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: И дети их, и дети их детей
  rationale: Формулировка сохраняет древнееврейское обозначение последовательных поколений и при этом естественно звучит по-русски.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם הֵם עֹשִׂים
  choice: поступают так же, как поступали их отцы
  rationale: «Поступают» естественно передаёт обобщённое עשה, а настоящее время отражает продолжающуюся практику.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: доныне
  rationale: Краткий современный литературный эквивалент устойчивой временной формулы «до этого дня».
theological_decisions:
- issue: Сосуществование страха перед Яхве и служения изображениям
  choice: «боялись Яхве, но в то же время служили своим резным изображениям»
  alternative: «поклонялись Яхве и служили своим идолам» или «делали вид, что боялись Яхве»
  rationale: Древнееврейский текст утверждает оба действия, не определяя прямо, был ли этот страх искренним, внешним или синкретическим. Перевод сохраняет это напряжение и не выносит дополнительного богословского суждения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан естественным для обычного читателя; повтор поколений и контраст между страхом перед Яхве и служением изображениям сохранены.
