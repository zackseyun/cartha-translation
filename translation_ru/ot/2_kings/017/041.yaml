  source_fidelity: 'Смысл передан точно: речь о переселённых народах, которые одновременно «боялись» (то есть религиозно почитали) Яхве и служили своим резным изображениям; далее сохранены преемственность поколений и формула «до сего дня». Однако «в то же время» несколько избыточно эксплицирует временную одновременность, тогда как еврейское соположение уже передаёт напряжение без такого уточнения.'
