  text: Но они не слушали, а продолжали поступать по своему прежнему обычаю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжали поступать по своему прежнему установлению (обычному порядку)». Еврейское מִשְׁפָּט может означать установление, правило или обычный порядок действий; в данном контексте речь идёт об их прежнем укладе поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Но ... не
  rationale: Союз с отрицанием продолжает повествование, выражая лёгкое противопоставление предшествующему повелению; «но» естественно передаёт этот оттенок.
- source_word: שָׁמֵעוּ
  choice: не слушали
  rationale: Глагол שׁמע может означать «слышать», «слушать» или «повиноваться». В данном контексте «не слушали» сохраняет как восприятие сказанного, так и отказ ему последовать, не сужая значение до одного лишь неповиновения.
- source_word: כִּי אִם
  choice: и продолжали
  rationale: Оборот противопоставляет отказ слушать сохранявшемуся прежнему поведению. В русском предложении это противопоставление естественно выражено сочетанием начального «но» и продолжением «и продолжали».
- source_word: כְּמִשְׁפָּטָם
  choice: по своему ... обычаю
  rationale: מִשְׁפָּט может обозначать установление, правило или обычай. Здесь речь идёт об укоренившемся образе религиозного поведения, поэтому «обычай» наиболее ясно и естественно передаёт смысл.
- source_word: הָרִאשׁוֹן
  choice: прежнему
  rationale: При מִשְׁפָּט это прилагательное указывает на прежний, ранее сложившийся образ действий.
- source_word: הֵם עֹשִׂים
  choice: продолжали поступать
  rationale: Причастная конструкция выражает продолжающееся или привычное действие; «продолжали поступать» передаёт его длительный характер и подходит к контексту поведения.
