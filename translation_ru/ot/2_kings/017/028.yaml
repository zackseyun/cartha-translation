base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: ru
  text: Тогда пришёл один из священников, которых они увели в изгнание из Самарии, и поселился в Вефиле. Он учил их, как следует бояться Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH — личное имя Бога; традиционно передаётся как «ГОСПОДЬ».'
    reason: Пояснение передачи тетраграмматона и традиционного варианта.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Тогда пришёл
  rationale: Последовательный вав продвигает повествование; «тогда» естественно передаёт смену события в современном русском языке.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: один из священников
  rationale: Обычная конструкция выделения одного человека из названной группы.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: которых они переселили из Самарии
  rationale: Порода hифиль глагола גלה означает насильственное переселение или отправку в изгнание. Местоимение «они» сохраняет выраженный глагольной формой, но не названный в этом стихе субъект.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: В данном контексте ישב обозначает устройство на жительство; «поселился» точнее передаёт начало проживания, чем просто «жил».
- source_word: בְּבֵית אֵל
  choice: в Вефиле
  rationale: Передаётся традиционная русская форма географического названия Бейт-Эль с естественным предложным управлением.
- source_word: וַיְהִי מוֹרֶה
  choice: Он учил
  rationale: Сочетание היה с причастием выражает продолжительное или характерное действие. Русское несовершенное «учил» сохраняет эту длительность без тяжеловесной кальки.
- source_word: אֵיךְ יִירְאוּ
  choice: как им бояться
  rationale: Сохраняется прямое значение ירא и наставительный характер придаточного; формулировка не уточняет сверх текста, идёт ли речь преимущественно о страхе, благоговении или почитании.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, при этом читателю дано пояснение в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Исходный текст употребляет тетраграмматон как личное Божье имя. Форма «Яхве» непосредственно отражает имя; традиционный титульный вариант указан в сноске.
- issue: Значение ירא применительно к Богу
  choice: бояться
  alternative: почитать / благоговеть перед
  rationale: Буквальное «бояться» сохраняет смысловую напряжённость еврейского слова, способного в религиозном контексте включать страх, благоговение и почитание, не сводя его заранее лишь к одному оттенку.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены неопределённый субъект «они» и прямое, богословски ёмкое выражение «бояться Яхве».
