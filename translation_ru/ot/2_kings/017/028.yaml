  - severity: low
    issue: «как им бояться Яхве»
    rationale: Фраза понятна, но слегка разговорна и не вполне выявляет наставительный характер конструкции. «Как следует бояться Яхве» естественно для современного литературного повествования и не снимает смысловую широту «бояться».
