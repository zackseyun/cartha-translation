revisions:
- from: Тогда пришёл один из священников, которых они переселили из Самарии, и поселился в Вефиле. Он учил их, как им бояться Яхве[a].
  to: Тогда пришёл один из священников, которых они увели в изгнание из Самарии, и поселился в Вефиле. Он учил их, как следует бояться Яхве[a].
  rationale: Заменено семантически более широкое «переселили» на «увели в изгнание», чтобы передать депортацию, выраженную הִגְלוּ. Формулировка наставления слегка выправлена для современного литературного русского; имя Яхве, географическое название и смысловой диапазон «бояться» сохранены.
