base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: ru
  text: до тех пор, пока Яхве не удалил Израиль от Своего лица[a], как и говорил через[b] всех Своих слуг, пророков. Так Израиль был изгнан со своей земли в Ассирию — до нынешнего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Своего присутствия». Буквально: «от Своего лица» — древнееврейская идиома удаления от Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукою», то есть через посредство всех Своих слуг, пророков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: удалил
  rationale: Каузативная форма глагола סור означает «заставить уйти, удалить»; русский глагол сохраняет причинное значение, не уточняя сверх текста характер изгнания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога как имя, а не заменяет его титулом.
- source_word: מֵעַל פָּנָיו
  choice: от Своего лица
  rationale: Сохраняет конкретный древнееврейский образ и его судебно-заветный оттенок; смысл идиомы пояснён в сноске.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: как и говорил
  rationale: Передаёт соответствие свершившегося ранее возвещённому через пророков.
- source_word: בְּיַד
  choice: через
  rationale: Естественно передаёт древнееврейскую идиому посредничества; буквальный образ отмечен в сноске.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: всех Своих рабов-пророков
  rationale: Сохраняет определение пророков как служителей Яхве и связь двух существительных без тяжеловесной конструкции.
- source_word: וַיִּגֶל
  choice: был изгнан
  rationale: В данном историческом контексте גלה обозначает насильственное переселение в изгнание; страдательная форма соответствует собирательному субъекту «Израиль».
- source_word: מֵעַל אַדְמָתוֹ
  choice: со своей земли
  rationale: Передаёт территориальный смысл אַדָמָה и согласуется с собирательным названием народа.
- source_word: אַשּׁוּרָה
  choice: в Ассирию
  rationale: Направительный суффикс выражает движение в сторону Ассирии.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивая и понятная русская формула, сохраняющая временную перспективу повествователя.
theological_decisions:
- issue: Значение מֵעַל פָּנָיו в описании Божьего суда
  choice: от Своего лица
  alternative: из Своего присутствия / прочь от Себя
  rationale: Более образный вариант сохраняет личный и судебный характер удаления Израиля, не превращая выражение в утверждение о возможности находиться вне Божьего вездеприсутствия.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формула «от Своего лица» намеренно сохраняет исходный образ, а «до сего дня» — традиционную временную формулу. Местоимения, относящиеся к Яхве, написаны с прописной буквы для ясности референции.
