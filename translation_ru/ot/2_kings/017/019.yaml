  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: ru
  text: Даже Иуда[a] не соблюдал заповедей Яхве, своего Бога, а следовал установлениям Израиля, которые они ввели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Также Иуда». Начальная частица подчёркивает, что Иуда, подобно Израилю, тоже был виновен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а жил по установлениям Израиля» или «а следовал обычаям, установленным Израилем».'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Даже
  rationale: 'Поставленная в начале частица подчёркивает, что виновен был не только Израиль: Иудея также поступала так. «Даже» естественно передаёт это усиление по-русски.'
- source_word: יְהוּדָה
  choice: Иудея
  rationale: В контексте названо южное царство, поэтому современное русское географико-политическое название «Иудея» яснее, чем двусмысленное «Иуда».
- source_word: שָׁמַר
  choice: соблюдала
  rationale: В сочетании с заповедями глагол означает исполнять, соблюдать; это естественное русское выражение для заветно-правового контекста.
- source_word: מִצְוֺת
  choice: заповедей
  rationale: Сохраняет религиозно-правовой смысл множественного числа и привычно сочетается с глаголом «соблюдать».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: Еврейский суффикс множественного числа относится к жителям Иудеи как коллективу. При русском подлежащем «Иудея» естественно употребить возвратное «своего», не меняя отношения принадлежности.
- source_word: וַיֵּלְכוּ
  choice: а жила
  rationale: Буквальный образ хождения здесь обозначает образ поведения. «Жила по» естественно передаёт метафору, а союз «а» выражает контраст с несоблюдением заповедей.
- source_word: בְּחֻקּוֹת
  choice: по установлениям
  rationale: Предлог ב обозначает следование норме или образцу, а חֻקּוֹת здесь может указывать на установленные религиозные нормы или обычаи.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: В данном контексте это северное царство, противопоставленное Иудее.
- source_word: אֲשֶׁר עָשׂוּ
  choice: которые ввёл Израиль
  rationale: Глагол עשה при установлениях допускает смысл учреждения или введения. Коллективный Израиль назван явно для ясности; возможный смысл практического соблюдения отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Субъект и значение אֲשֶׁר עָשׂוּ
  choice: которые ввёл Израиль
  alternative: которых держались израильтяне; которые они установили
  rationale: Форма глагола множественного числа может согласовываться с Израилем как собирательным обозначением народа. Сам глагол может означать как учреждение установлений, так и их исполнение; основной текст выбирает контекстуально вероятное «ввёл», а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для обычного читателя; буквальная метафора хождения передана естественным выражением «жила по». Названия царств различены как «Иудея» и «Израиль».
