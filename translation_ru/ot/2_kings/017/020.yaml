source:
  edition: WLC
  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: ru
  text: И отверг Яхве всё потомство Израиля[a], подверг их страданиям и предал их в руки грабителей[b], пока не отбросил их от лица Своего[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё семя Израиля»; также возможно: «все потомки Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отдал их во власть грабителей».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «от лица Его»; то есть из Его присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: отверг
  rationale: Глагол מָאַס выражает решительный отказ или отвержение; «отверг» передаёт судебно-заветный контекст, не добавляя оттенка эмоционального презрения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: всех потомков Израиля
  rationale: זֶרַע — собирательное «семя, потомство»; выбранная формулировка естественна по-русски и сохраняет полноту, выраженную словом כָּל, не сужая её объём толкованием.
- source_word: וַיְעַנֵּם
  choice: подвергал их бедствиям
  rationale: Пиэль от ענה может означать причинение страданий, угнетение или унижение. Формулировка передаёт общий смысл бедствий и не ограничивает его только социальным угнетением.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: предал их в руки
  rationale: Идиома נתן ביד означает отдать кого-либо во власть другого. Русское «предал в руки» естественно сохраняет образ и смысл передачи во власть.
- source_word: שֹׁסִים
  choice: грабителей
  rationale: Причастная форма от שסס обозначает тех, кто разоряет и захватывает добычу; «грабители» ясно передаёт хищнический характер их действий.
- source_word: עַד אֲשֶׁר
  choice: пока не
  rationale: Сочетание указывает на предел продолжающегося действия; «пока не» естественно связывает последовательность событий в русском повествовании.
- source_word: הִשְׁלִיכָם
  choice: отбросил их
  rationale: השליך буквально означает «бросить, отбросить». Выбор сохраняет сильный образ отвержения и удаления, не превращая его лишь в нейтральное «изгнал».
- source_word: מִפָּנָיו
  choice: от Себя
  rationale: Буквально «от лица Его», то есть из Его присутствия. «От Себя» естественно передаёт удаление из присутствия Яхве; буквальный образ отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя, не подменяя его титулом.
- issue: Объём выражения «всех потомков Израиля»
  choice: сохранить всеобъемлющую формулировку без уточняющего толкования
  alternative: явно ограничить выражение северным царством; понимать как безусловно каждого этнического потомка Иакова
  rationale: Исходный текст говорит обо всём «семени Израиля». Исторический контекст помогает читателю, но сам перевод не должен устранять возможное напряжение или сужать объём выражения.
- issue: Характер действий, выраженных וַיְעַנֵּם
  choice: подвергал их бедствиям
  alternative: смирял их; угнетал их
  rationale: Еврейский глагол допускает оттенки причинения страдания, унижения и угнетения. Выбранная формулировка сохраняет широту смысла, не утверждая более узкую богословскую интерпретацию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность еврейских глаголов, но избегает тяжеловесной буквальности; местоимение «Себя» написано с прописной буквы как уважительное обозначение Бога.
