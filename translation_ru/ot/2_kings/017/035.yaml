  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: ru
  text: 'И заключил Яхве с ними завет и повелел им: «Не бойтесь других богов, не поклоняйтесь им, не служите им и не приносите им жертв».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: заключил ... завет
  rationale: Еврейская идиома буквально означает «срезал/заключил завет»; по-русски её естественно и точно передаёт устойчивое выражение «заключил завет».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: וַיְצַוֵּם
  choice: повелел им
  rationale: Глагол צוה обозначает властное повеление; «повелел» сохраняет торжественный заветный регистр.
- source_word: לֹא תִירְאוּ
  choice: не бойтесь
  rationale: «Бояться» сохраняет отдельное значение глагола ירא и не смешивает его с последующими конкретными действиями поклонения. Русская форма запрета естественна и достаточно категорична в данном контексте.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: других богов
  rationale: Прямое и контекстуально точное соответствие выражению «другие боги».
- source_word: תִשְׁתַּחֲווּ
  choice: поклоняйтесь
  rationale: Глагол обозначает поклон или простирание перед кем-либо; «поклоняться» естественно передаёт культовое действие, не поглощая значения следующих глаголов.
- source_word: תַעַבְדוּם
  choice: служите им
  rationale: Сохраняет основное значение עבד и различие между поклонением, служением и принесением жертв.
- source_word: תִזְבְּחוּ לָהֶם
  choice: приносите им жертв
  rationale: Естественная русская формулировка точно выражает совершение жертвоприношений в честь адресата.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя; транслитерация «Яхве» сохраняет это отличие от титула и соответствует наиболее принятой научной реконструкции произношения.
- issue: Сила заветных запретов
  choice: «Не бойтесь... не поклоняйтесь... не служите... не приносите...»
  alternative: «Не должны вы...»
  rationale: Русский отрицательный императив ясно и торжественно передаёт обязательный запрет, не добавляя модального оттенка, отсутствующего в еврейском тексте.
- issue: Значение ירא применительно к другим богам
  choice: бояться
  alternative: почитать; поклоняться
  rationale: Сохранено буквальное и самостоятельное значение «бояться», поскольку далее текст отдельно перечисляет поклонение, служение и жертвоприношение; возможная культовая окраска страха не устранена.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-заветной речи. Перечень запретов сохранён без смыслового объединения; вводное לֵאמֹר естественно передано двоеточием.
