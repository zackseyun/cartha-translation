  text: וַ/יַּֽעַבְד֖וּ הַ/גִּלֻּלִ֑ים אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לָ/הֶ֔ם לֹ֥א תַעֲשׂ֖וּ אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: ru
  text: 'Они служили идолам[a], о которых Яхве сказал им: «Не делайте этого».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово גִּלֻּלִים — презрительное обозначение идолов; оно может передавать смысл «мерзкие идолы» или даже «навозные идолы».
    reason: Сохранение сильного уничижительного оттенка исходного слова, который невозможно естественно передать нейтральным русским словом «идолы».
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: служили
  rationale: Глагол עבד означает «служить» и в данном контексте подразумевает религиозное поклонение; «служили» сохраняет связь с языком заветного служения.
- source_word: הַגִּלֻּלִים
  choice: идолам
  rationale: גִּלּוּלִים — резко уничижительное обозначение идолов. В основном тексте естественно звучит «идолам», а презрительный оттенок поясняется в сноске.
- source_word: אֲשֶׁר
  choice: о которых
  rationale: Относительное слово связывает идолов с ранее данным Божьим запретом. Формулировка сохраняет естественный русский синтаксис, не уточняя сверх исходного текста характер этой связи.
- source_word: אָמַר יְהוָה לָהֶם
  choice: Яхве сказал им
  rationale: Форма אָמַר обозначает высказывание, предшествовавшее описанному служению; в русском языке временная последовательность ясна из контекста без отдельной формы плюсквамперфекта.
- source_word: לֹא תַעֲשׂוּ אֶת־הַדָּבָר הַזֶּה
  choice: Не делайте этого
  rationale: Так естественно и с надлежащей силой запрета передаётся буквальное «не делайте этого дела/этой вещи», без тяжеловесного калькирования.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; «Яхве» передаёт личное имя Бога, не заменяя его титулом.
- issue: Характер служения идолам
  choice: служили идолам
  alternative: поклонялись идолам
  rationale: «Служили» сохраняет основное значение עבד и его богословски значимую связь со служением, тогда как контекст ясно указывает на культовое служение.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified повествовательной формой. Формулировка прямой речи передаёт ясный запрет без архаизмов; маркер сноски помещён непосредственно после слова, к которому относится.
