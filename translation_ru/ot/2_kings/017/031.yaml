  text: וְ/הָ/עַוִּ֛ים עָשׂ֥וּ נִבְחַ֖ז וְ/אֶת תַּרְתָּ֑ק וְ/הַ/סְפַרְוִ֗ים שֹׂרְפִ֤ים אֶת בְּנֵי/הֶם֙ בָּ/אֵ֔שׁ לְ/אַדְרַמֶּ֥לֶךְ וַֽ/עֲנַמֶּ֖לֶךְ אלה ספרים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: ru
  text: Аввиты[a] сделали Нивхаза и Тартака, а сефарваимцы сжигали своих сыновей в огне в жертву Адраммелеху и Анаммелеху — богам Сефарваима.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аввимы».'
    reason: Возможная альтернативная передача этнического названия הָעַוִּים.
  - marker: b
    text: То есть они приносили сыновей в жертву этим богам, сжигая их.
    reason: Культурно-историческое пояснение описанного обряда.
lexical_decisions:
- source_word: הָעַוִּים
  choice: ввиты
  rationale: Этническое название передано русской транслитерацией; форма с начальным «А» в тексте обусловлена союзом וְ, а не входит в название.
- source_word: עָשׂוּ
  choice: сделали
  rationale: Сохранён прямой смысл глагола; контекст подразумевает изготовление культовых изображений, но слово «идолы» в еврейском тексте отсутствует.
- source_word: נִבְחַז וְאֶת־תַּרְתָּק
  choice: Нивхаза и Тартака
  rationale: Имена божеств транслитерированы; винительный падеж естественно передаёт их роль как прямых дополнений.
- source_word: הַסְפַרְוִים
  choice: сефарваимцы
  rationale: Гентилий обозначает жителей Сефарваима; русское образование от географического названия ясно и лаконично.
- source_word: שֹׂרְפִים
  choice: сжигали
  rationale: Причастная форма выражает обычное или повторявшееся культовое действие; несовершенный вид естественно сохраняет этот оттенок.
- source_word: אֶת־בְּנֵיהֶם בָּאֵשׁ
  choice: своих сыновей в огне
  rationale: Сохранено конкретное значение «сыновей», а выражение «в огне» передано буквально.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: в жертву Адраммелеху и Анаммелеху
  rationale: Предлог לְ обозначает адресатов культового сожжения; добавление «в жертву» естественно проясняет функцию, явно заданную контекстом.
- source_word: אֱלֹהֵי סְפַרְוָיִם
  choice: богам Сефарваима
  rationale: Конструктивное сочетание определяет Адраммелеха и Анаммелеха как божеств, связанных с городом Сефарваимом.
theological_decisions:
- issue: Следует ли прямо назвать Нивхаза и Тартака идолами или изображениями
  choice: Сохранить буквальное «сделали Нивхаза и Тартака»
  alternative: «сделали идолов Нивхаза и Тартака» / «сделали изображения Нивхаза и Тартака»
  rationale: Еврейский текст не содержит существительного «идолы» или «изображения»; культовый смысл понятен из контекста, поэтому он не внесён в основной текст.
- issue: Передача בְּנֵיהֶם
  choice: сыновей
  alternative: детей
  rationale: Исходное слово имеет конкретную мужскую форму; оснований обобщать её до «детей» нет.
- issue: Передача культовой направленности предлога לְ
  choice: в жертву Адраммелеху и Анаммелеху
  alternative: Адраммелеху и Анаммелеху
  rationale: 'Русская формулировка делает синтаксическую связь ясной, не меняя характера описанного действия: сыновей сжигали как приношение этим богам.'
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Несовершенный вид «сжигали» передаёт обычный характер практики. Имена собственные даны в формах, близких к еврейскому звучанию; двоеточие заменено тире для естественного русского приложения.
