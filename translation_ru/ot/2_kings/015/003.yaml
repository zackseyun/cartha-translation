source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: ru
  text: Он делал то, что было правильным в глазах Яхве, во всём поступая так же, как его отец Амасия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он делал
  rationale: Ваййиктоль продолжает повествование и описывает образ правления царя. В русском начальное «и» для связи здесь необязательно; несовершенный вид естественно передаёт устойчивую характеристику его поступков.
- source_word: הַיָּשָׁר
  choice: то, что было правильным
  rationale: Субстантивированное прилагательное означает «правильное, прямое». Такая передача сохраняет нравственно-оценочный смысл царской формулы и не добавляет идеи «угождения», которой в слове прямо нет.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён понятный по-русски древнееврейский образ оценки с точки зрения Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: во всём поступая так же, как
  rationale: Оборот выражает полное соответствие примеру отца. Русская конструкция передаёт сравнительную силу выражения без тяжеловесного буквального повтора глагола «делать».
- source_word: אֲמַצְיָהוּ
  choice: Амасия
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: אָבִיו
  choice: его отец
  rationale: В непосредственном родословном контексте речь идёт о родном отце, а не о более отдалённом предке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога. Транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Характер положительной оценки царя
  choice: то, что было правильным в глазах Яхве
  alternative: угодное Яхве
  rationale: Формулировка сохраняет точку зрения самого текста и не усиливает её словом «угодное»; последующий контекст может уточнять пределы этой положительной оценки.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и образности древнееврейской царской формулы. Синтаксис сделан естественным для русского читателя, без конфессионально окрашенных добавлений.
