  to: 'Таково было слово Яхве, которое Он сказал Ииую: «Твои потомки в четырёх поколениях будут восседать на престоле Израиля». Так и произошло.'
  rationale: 'Исправлена только передача династического выражения בְּנֵי רְבִיעִים: вместо неестественного и двусмысленного «сыновья до четвёртого поколения» употреблено ясное «потомки в четырёх поколениях». Это сохраняет смысл обещания о четырёх поколениях династии, не навязывая спорной схемы их подсчёта. «Восседать на престоле» естественно сохраняет престольный образ оригинала.'
