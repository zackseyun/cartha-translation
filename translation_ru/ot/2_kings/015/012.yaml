  source_fidelity: 'Смысл в целом передан верно: стих связывает предшествующее событие с исполнением слова Яхве, воспроизводит адресата, царский престол Израиля и формулу исполнения. Однако «сыновья до четвёртого поколения» в современном русском неточно и неестественно: сыновья не образуют последующие поколения сами по себе. Еврейский оборот בְּנֵי רְבִיעִים обозначает продолжение династии Ииуя на четыре поколения.'
