  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: ru
  text: 'Таково было слово Яхве, которое Он сказал Ииую: «Твои потомки в четырёх поколениях будут восседать на престоле Израиля». Так и произошло.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  choice: Таково было слово Яхве
  rationale: Указательное הוּא отсылает к предшествующему событию как к исполнению данного прежде слова. Формула «Таково было слово» естественна по-русски и сохраняет библейское דְבַר יְהוָה как «слово Яхве», не сужая его до «обещания».
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: которое Он сказал Ииую
  rationale: Русское «сказал» естественно вводит последующую прямую речь; отдельная передача לֵאמֹר словом «говоря» была бы тяжеловесной. Местоимение «Он» относится к Яхве.
- source_word: בְּנֵי רְבִיעִים
  choice: Твои сыновья до четвёртого поколения
  rationale: Сохранено конкретное родственное обозначение «сыновья» и выражена глубина династической линии — четыре поколения после Ииуя; более общее «потомки» было бы менее формальным соответствием.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: будут сидеть на престоле Израиля
  rationale: Сохранён образ сидения на престоле как обозначение царствования. Дательный לְךָ в русском естественно отражён притяжательным «твои» при «сыновья», без искусственного «для тебя».
- source_word: וַיְהִי כֵן
  choice: Так и произошло
  rationale: Краткая современная формула ясно отмечает точное исполнение ранее сказанного слова.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон. Транслитерация «Яхве» сохраняет имя, а не заменяет его титулом; «Иегова» отражает более позднюю гибридную форму.
- issue: Характер Божьего высказывания
  choice: слово Яхве
  alternative: обещание Яхве; пророчество Яхве
  rationale: «Слово» сохраняет широту דָּבָר и не навязывает более узкую классификацию, хотя контекст показывает, что это слово имело характер обещания и исполнилось.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис упрощён там, где буквальное воспроизведение еврейского вводного оборота звучало бы неестественно; престольная метафора и формула исполнения сохранены.
