  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: ru
  text: Он делал зло в глазах Яхве. Он не отступал от грехов Иеровоама, сына Навата. Иеровоам ввёл Израиль в грех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Стандартная формула оценки царствования; несовершенный вид естественно передаёт устойчивый образ действий, а не единичный поступок.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет прозрачную древнееврейскую метафору божественной оценки и передаёт имя יהוה как «Яхве».
- source_word: לֹא סָר מִן חַטֹּאות
  choice: не отступал от грехов
  rationale: Глагол סור с מן обозначает уклонение или отход от прежнего пути; «не отступал» естественно звучит в данном нравственном контексте.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Употреблены традиционные русские библейские формы имён и явно передано отчество.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: который ввёл Израиль в грех
  rationale: Каузативная форма חטא возлагает на Иеровоама ответственность за то, что Израиль стал грешить; русская формулировка передаёт это естественно и ясно.
theological_decisions:
- issue: Передача заветного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Причинная роль Иеровоама в грехе Израиля
  choice: ввёл Израиль в грех
  alternative: заставил Израиль грешить
  rationale: Сохраняется каузативность הֶחֱטִיא, но не добавляется представление о принуждении, которого сама форма необязательно требует.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный повествовательный стиль. Сохранена библейская метафора «в глазах Яхве»; традиционные формы собственных имён обеспечивают узнаваемость текста.
