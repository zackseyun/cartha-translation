  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ru
  text: Остальные дела Факея и всё, что он совершил, — вот, они записаны в Книге летописей царей Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Книге анналов царей Израиля».'
    reason: 'Лексическая альтернатива для דִּבְרֵי הַיָּמִים: выражение может быть передано как «летописи» или «анналы».'
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Остальные дела
  rationale: יֶתֶר означает «остаток, остальное», а דִּבְרֵי в устойчивой формуле царских итогов обозначает дела или события правления. Такое сочетание естественно передаёт смысл по-русски.
- source_word: פֶקַח
  choice: Факей
  rationale: Традиционная русская библейская форма имени израильского царя.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он совершил
  rationale: Сохраняет всеохватность כָל и прямо передаёт относительную конструкцию; «совершил» соответствует возвышенному историографическому регистру.
- source_word: הִנָּם
  choice: вот, они
  rationale: Сохраняет указательно-представительное значение еврейской формы и её формульное подчёркивание, не сводя выражение к одной связке.
- source_word: כְּתוּבִים
  choice: записаны
  rationale: Передаёт пассивное значение причастия и естественно звучит применительно к документальному источнику; буквальное «написаны» здесь менее идиоматично.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Буквальное «на книге/свитке» в русском документальном контексте идиоматически передаётся как «в книге».
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: летописей царей Израиля
  rationale: Выражение обозначает царские хроникальные записи; «летописи» понятно современному читателю и сохраняет характер названия источника.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством формульного царского итога. Частица «вот» сохранена ради выраженного в еврейском тексте указательного акцента. Маркер сноски помещён при названии источника, к которому относится лексическая альтернатива.
