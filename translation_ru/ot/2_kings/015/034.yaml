  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: ru
  text: Он поступал правильно в глазах Яхве, во всём так же, как поступал его отец Озия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Озия». В других местах этот царь также назван Азарией.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он делал
  rationale: Форма продвигает повествование и описывает общую оценку поведения царя; русское несовершенное «делал» естественно передаёт характер его правления.
- source_word: הַיָּשָׁר
  choice: то, что было правильным
  rationale: Передаёт устойчивое выражение «делать правильное» современным и понятным русским языком, сохраняя нравственную оценку.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет еврейскую метафору Божьей оценки и передаёт личное имя יהוה как «Яхве».
- source_word: כְּכֹל אֲשֶׁר
  choice: во всём так, как
  rationale: Естественно по-русски выражает полное соответствие примеру отца и сохраняет значение כֹּל «всё».
- source_word: עֻזִיָּהוּ
  choice: Озия
  rationale: Следует чтению масоретского текста и принятой русской библейской форме имени, не заменяя его встречающимся в других местах именем «Азария».
- source_word: אָבִיו
  choice: его отец
  rationale: Здесь имеется в виду непосредственный отец царя, поэтому буквальное родственное обозначение уместно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Оценка царя как поступавшего правильно
  choice: то, что было правильным в глазах Яхве
  alternative: то, что было угодно Яхве
  rationale: Сохранена исходная метафора «в глазах» и критерий Божьей оценки без усиления до утверждения о безусловной нравственной праведности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор глагола עשה передан естественной русской конструкцией; тире поясняет отношение второй части к первой. Маркер сноски поставлен после имени «Озия», к которому относится примечание.
