  text: בִּ/שְׁנַ֨ת עֶשְׂרִ֤ים וָ/שֶׁ֨בַע֙ שָׁנָ֔ה לְ/יָרָבְעָ֖ם מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ עֲזַרְיָ֥ה בֶן אֲמַצְיָ֖ה מֶ֥לֶךְ יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: ru
  text: В двадцать седьмой год правления Иеровоама, царя Израиля, воцарился Азария, сын Амасии, царь Иудеи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: В двадцать седьмой год правления
  rationale: Еврейская формула датировки по годам царствования естественно передаётся по-русски порядковым числительным; слово «правления» ясно выражает функцию конструкции.
- source_word: לְיָרָבְעָם
  choice: Иеровоама
  rationale: Предлог לְ указывает, по чьему царствованию отсчитывается год; в русской формуле это выражается родительным падежом.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Стандартный царский титул, согласованный с именем в родительном падеже.
- source_word: מָלַךְ
  choice: воцарился
  rationale: В сообщении о вступлении на престол глагол обозначает начало царствования; «воцарился» кратко и естественно передаёт это значение.
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Традиционная русская передача библейского личного имени.
- source_word: בֶן אֲמַצְיָה
  choice: сын Амасии
  rationale: Прямо передаёт родственную связь; имя поставлено в нормативной форме родительного падежа.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Аппозитивный царский титул относится к Азарии и сохраняется после указания его происхождения.
