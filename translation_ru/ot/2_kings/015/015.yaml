base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ru
  text: Остальные дела Шаллума и его заговор, который он составил[a], — всё это записано в Книге летописей царей Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте существительное «заговор» и глагол «составил заговор» однокоренные; этот повтор усиливает выражение.
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду царский летописный свод, на который неоднократно ссылаются книги Царей, а не библейская книга Паралипоменон.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Остальные дела
  rationale: В царской итоговой формуле יֶתֶר означает «остальное», а דִּבְרֵי — не только слова, но дела и события правления.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Имя передано в принятой русской библейской форме.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: и заговор, который он составил
  rationale: Сохранены существительное и однокоренной по смыслу глагол исходного текста; по-русски «составить заговор» звучит естественно и передаёт политический контекст.
- source_word: הִנָּם כְּתֻבִים
  choice: записаны
  rationale: Указательная частица הִנָּם входит в устойчивую отсылочную формулу. Отдельное «вот» в современном русском здесь тяжеловесно, а значение формулы естественно выражается сказуемым «записаны».
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: в Летописи царей Израиля
  rationale: Это название цитируемого царского свода; «Летопись» ясно и кратко передаёт ספר דברי הימים, а предлог «в» соответствует русскому обозначению записи в книге.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства царской летописной формулы. Архаическое «вот, они записаны» не вынесено в основной текст, поскольку в русском оно звучит неестественно; отсылочная функция формулы сохранена.
