  yaml_path: translation/ot/2_kings/015/022.yaml
  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: ru
  text: Менахем почил со своими отцами[a], и вместо него воцарился его сын Пекахия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уснул со своими отцами»; это устойчивое еврейское выражение, сообщающее о смерти царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: В составе устойчивой царской формулы глагол означает смерть. «Почил» сохраняет образ сна и при этом естественно передаёт эвфемистический смысл на литературном русском языке, не сводя выражение к прямому «умер».
- source_word: עִם אֲבֹתָיו
  choice: со своими отцами
  rationale: Формулировка сохраняет конкретный образ еврейского текста и его династический оттенок; более пояснительное «с предками» указано в сноске.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В сообщении о престолонаследии форма обозначает вступление на царство; «воцарился» естественно передаёт именно начало правления.
- source_word: פְּקַחְיָה
  choice: Пекахия
  rationale: Имя передано транслитерацией с еврейского, с сохранением согласного כ как «к».
- source_word: בְּנוֹ
  choice: его сын
  rationale: Прямо передаёт обозначение родства и сохраняет его явное присутствие в сообщении о престолонаследии.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Естественно и точно выражает смену царя на престоле.
