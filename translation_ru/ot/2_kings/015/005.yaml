  source_fidelity: 'Основной смысл передан точно: Яхве поражает царя, его состояние длится до смерти, он живёт обособленно, а Иофам исполняет дворцовые и судебно-правительственные обязанности. Однако формулировка «оставался поражённым проказой» избыточно повторяет «поразил» и несколько неестественно передаёт еврейское сказуемое «был прокажённым».'
