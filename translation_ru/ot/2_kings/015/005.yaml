  terminology: ГОСПОДЬ, Иофам, «прокажённый», «народ страны» и сноски в целом согласованы с источником и английской аудиторской фиксацией. Сноска к «прокажённым» необходима, поскольку מְצֹרָע не позволяет уверенно назвать современный диагноз. Значение בְּבֵית הַחָפְשִׁית остаётся спорным; «отдельный дом» с осторожной сноской уместно.
