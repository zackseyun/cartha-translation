  text: וַ/יְנַגַּ֨ע יְהוָ֜ה אֶת הַ/מֶּ֗לֶךְ וַ/יְהִ֤י מְצֹרָע֙ עַד י֣וֹם מֹת֔/וֹ וַ/יֵּ֖שֶׁב בְּ/בֵ֣ית הַ/חָפְשִׁ֑ית וְ/יוֹתָ֤ם בֶּן הַ/מֶּ֨לֶךְ֙ עַל הַ/בַּ֔יִת שֹׁפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: ru
  text: И поразил ГОСПОДЬ царя[a], и он был прокажённым до дня своей смерти и жил в отдельном доме[b]. А Иофам, сын царя, ведал дворцом и судил народ страны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более широком смысле: «поражён тяжёлой кожной болезнью». Древнееврейское обозначение не обязательно означает проказу в современном медицинском смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «в доме изоляции». Древнееврейское выражение не вполне ясно и, вероятно, означает обособленное жилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции заменой; прописные буквы отличают Божье имя от обычного титула.
- source_word: וַיְנַגַּע
  choice: поразил
  rationale: В данном контексте глагол обозначает ниспосланное Богом поражение, а не простое прикосновение; сохраняется явная божественная причинность.
- source_word: מְצֹרָע
  choice: поражённым проказой
  rationale: Сохраняет узнаваемый традиционный термин, не отождествляя древнееврейское обозначение без оговорки с современной болезнью Хансена; более широкий смысл отмечен в сноске.
- source_word: עַד יוֹם מֹתוֹ
  choice: до дня своей смерти
  rationale: Сохраняет еврейскую идиому и её торжественно-мрачный ритм.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: в отдельном доме
  rationale: Трудное выражение по контексту указывает на обособленное проживание царя; перевод передаёт функцию помещения, не навязывая буквальное, но здесь неясное значение «свободный».
- source_word: עַל הַבַּיִת
  choice: управлял дворцом
  rationale: В царском контексте выражение обозначает заведование царским домом или дворцом; естественная русская формулировка передаёт административную ответственность Иофама.
- source_word: שֹׁפֵט
  choice: судил
  rationale: Прямо передаёт продолжающееся исполнение судебной, а вместе с тем и правительственной функции.
- source_word: עַם הָאָרֶץ
  choice: народ страны
  rationale: Сохраняет устойчивое древнееврейское выражение без преждевременного уточнения, обозначает ли оно всё население или определённую общественную группу.
theological_decisions:
- issue: Характер состояния царя, обозначенного מְצֹרָע
  choice: В основном тексте сохранено традиционное «поражённым проказой», а широта древнееврейского термина пояснена в сноске.
  alternative: «поражённым тяжёлой кожной болезнью»
  rationale: Текст не позволяет уверенно поставить современный медицинский диагноз. Традиционный термин узнаваем, а сноска предотвращает необоснованное отождествление с болезнью Хансена.
- issue: Смысл בְּבֵית הַחָפְשִׁית
  choice: «в отдельном доме»
  alternative: «в доме изоляции» / буквальное «в доме свободы»
  rationale: Фраза лексически трудна. Контекст поддерживает обособленную резиденцию, но степень и официальный характер изоляции не следует уточнять сверх источника.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка формальный, но понятный; трудные медицинский и жилищный термины не конкретизированы сверх данных древнееврейского текста.
