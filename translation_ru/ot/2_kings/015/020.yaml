  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: ru
  text: 'И взыскал Менахем эти деньги с Израиля — со всех состоятельных людей[a], — чтобы отдать царю Ассирии: по пятьдесят сиклей серебра с каждого. Тогда царь Ассирии повернул назад и не остался там, в стране.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со всех сильных воинов»; возможно также: «со всех влиятельных людей». Еврейское выражение может указывать на военную силу, общественное положение или материальный достаток; контекст денежного сбора говорит в пользу значения «состоятельные люди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: взыскал
  rationale: Каузативная форма глагола буквально означает «вывел», но в сочетании с «деньгами» и предлогом עַל выражает принудительный сбор; «взыскал» естественно передаёт фискальный и обязательный характер действия.
- source_word: הַכֶּסֶף
  choice: эти деньги
  rationale: Первое כֶּסֶף обозначает собираемую денежную сумму; указательное «эти» связывает её с выплатой, названной в предыдущем стихе, а «деньги» здесь естественнее буквального «серебро».
- source_word: עַל יִשְׂרָאֵל
  choice: с Израиля
  rationale: После глагола взыскания עַל указывает, на кого возложен сбор; русский предлог «с» идиоматично обозначает источник взысканной суммы.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: со всех состоятельных людей
  rationale: Оборот может обозначать сильных воинов, влиятельных или имущественно обеспеченных людей. Подушный денежный сбор в данном контексте делает значение «состоятельные люди» наиболее вероятным, при этом неоднозначность отмечена в сноске.
- source_word: לָתֵת לְמֶלֶךְ אַשּׁוּר
  choice: чтобы отдать царю Ассирии
  rationale: Инфинитив выражает цель сбора. «Отдать» близко к простому значению נתן и естественно для передачи денег правителю.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף
  choice: по пятьдесят сиклей серебра
  rationale: Сохранены древняя мера веса и указание на металл; «по» вместе с последующим «с каждого» ясно передаёт индивидуальный размер сбора.
- source_word: לְאִישׁ אֶחָד
  choice: с каждого
  rationale: В контексте налогообложения выражение обозначает сумму, взятую с каждого облагаемого человека.
- source_word: וַיָּשָׁב
  choice: повернул назад
  rationale: Глагол означает возвращение или отход; «повернул назад» передаёт уход ассирийского царя после получения выплаты.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: не остался там, в стране
  rationale: עמד буквально значит «стоять», но здесь идиоматически означает продолжать находиться или оставаться. Формулировка сохраняет наречие «там» и упоминание страны.
