  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/פֶ֥קַח בֶּן רְמַלְיָ֖הוּ מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ יוֹתָ֥ם בֶּן עֻזִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: ru
  text: Во второй год правления Факея, сына Ремалии, царя Израиля, воцарился[a] Иоафам, сын Озии[b], царь Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начал царствовать». Еврейский глагол может обозначать вступление на престол или начало царствования.'
    reason: lexical_alternative
  - marker: b
    text: В других местах Озия также назван Азарией.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/פֶקַח
  choice: Во второй год правления Факея
  rationale: Это древнееврейская формула датировки по годам царствования. Сочетание с количественным числительным «два» здесь имеет порядковое значение — «второй»; слово «правления» добавлено для ясности по нормам современного русского языка.
- source_word: בֶּן רְמַלְיָהוּ
  choice: сына Ремалии
  rationale: Сохранена стандартная патронимическая конструкция и традиционная русская передача имён.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Титул и название царства переданы прямо и без сокращения.
- source_word: מָלַךְ
  choice: воцарился
  rationale: 'В сообщении о вступлении на престол глагол имеет начинательное значение: Иоафам стал царём, то есть начал царствовать. «Воцарился» естественно и кратко передаёт это значение.'
- source_word: יוֹתָם
  choice: Иоафам
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: בֶּן עֻזִיָּהוּ
  choice: сын Озии
  rationale: В данном стихе еврейский текст прямо называет עֻזִּיָּהוּ, поэтому сохранено имя «Озия»; другое имя этого царя отмечено в сноске.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Приложение отнесено непосредственно к Иоафаму, что сохраняет смысл оригинала и звучит естественно по-русски.
