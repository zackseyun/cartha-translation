base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: ru
  text: В пятидесятый год правления Азарии, царя Иудеи, Факия, сын Менахема, стал царём Израиля в Самарии и царствовал два года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים שָׁנָה לַעֲזַרְיָה
  choice: В пятидесятый год правления Азарии
  rationale: Еврейская формула датирует событие по году царствования Азарии; слово «правления» естественно проясняет функцию ל, не меняя смысла.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Конструкция прямо обозначает титул Азарии и царство, которым он правил.
- source_word: מָלַךְ
  choice: воцарился
  rationale: В царских хронологических формулах глагол здесь обозначает вступление на престол; продолжительность царствования указана отдельно.
- source_word: פְּקַחְיָה
  choice: Факия
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, остающаяся понятной современному читателю.
- source_word: בֶן מְנַחֵם
  choice: сын Менахема
  rationale: Прямая передача родственного обозначения и личного имени.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при глаголе царствования обозначает народ или государство, над которым осуществляется власть.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог ב имеет местное значение и указывает на столицу как место царствования.
- source_word: שְׁנָתָיִם
  choice: два года
  rationale: Двойственное число прямо обозначает продолжительность царствования в два года.
