base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: ru
  text: Пул, царь Ассирии, выступил против страны[a]. Менахем передал Пулу тысячу талантов серебра, чтобы заручиться его поддержкой и утвердить царскую власть в своих руках[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «страной», вероятно, подразумевается земля Израиля.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «чтобы его рука была с ним, чтобы укрепить царство в его руке». «Его рука» относится к Пулу, а «в его руке» — к Менахему; речь идёт о поддержке Пула, позволявшей Менахему упрочить свою власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא ... עַל הָאָרֶץ
  choice: выступил против страны
  rationale: Сочетание глагола движения с עַל в военном контексте обозначает враждебное выступление. Такой перевод естественнее буквального «пришёл против страны» и не усиливает смысл до непременно состоявшегося вторжения.
- source_word: פ֤וּל
  choice: Пул
  rationale: Личное имя передано принятой русской транслитерацией.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Прямая и привычная передача еврейской сопряжённой конструкции.
- source_word: וַיִּתֵּן
  choice: передал
  rationale: נתן означает «дать»; «передал» естественно звучит применительно к большой сумме серебра, не вводя прямо отсутствующего в тексте термина «дань».
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: тысячу талантов серебра
  rationale: כִּכָּר — древняя мера веса; традиционный русский эквивалент «талант» сохраняет историческую форму выражения.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: чтобы заручиться его поддержкой
  rationale: Оборот «чтобы его рука была с ним» идиоматически означает поддержку и содействие. В основном тексте смысл передан естественно, а буквальный образ сохранён в примечании.
- source_word: לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ
  choice: утвердить царскую власть в своих руках
  rationale: В данном политическом контексте מַמְלָכָה может обозначать царство или царскую власть, а חזק в породе хифиль — укрепление или упрочение. Формулировка передаёт консолидацию власти Менахема и сохраняет образ «в руках».
