base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: ru
  text: Тогда Менаим напал на Типсах, на всё, что было в нём[a], и на его область от Фирцы[d], потому что город не открыл ему ворот[b]; он поразил его и вспорол[c] животы всем его беременным женщинам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно перевести также: «на всех, кто был в нём». Оно может охватывать всё находившееся в городе, а в данном контексте — прежде всего жителей.'
    reason: lexical_alternative
  - marker: b
    text: То есть город отказался открыть Менаиму ворота, впустить его и сдаться.
    reason: cultural_note
  - marker: c
    text: Еврейский глагол означает насильственно рассечь, разорвать или вспороть.
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «от Фирцы». В еврейском тексте этот оборот следует за словами «его областью/пределами»; его точная синтаксическая связь не вполне ясна.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Естественная для современного русского повествования передача временного наречия, вводящего следующее событие.
- source_word: יַכֶּה / וַיַּךְ
  choice: напал / разгромил
  rationale: 'Глагол נכה обозначает нанесение удара или военное поражение. В русском контексте разные формы переданы естественно по смыслу: сначала нападение на город и область, затем его жестокий разгром.'
- source_word: תִּפְסַח
  choice: Типсах
  rationale: Собственное географическое название передано принятой русской транслитерацией.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: всё, что было в городе
  rationale: Формально сохраняет широту еврейского выражения, которое может охватывать как жителей, так и всё находившееся в городе, не сужая его без необходимости.
- source_word: גְּבוּלֶיהָ
  choice: всю его область
  rationale: В данном военном контексте גְּבוּל обозначает подвластную городу территорию, а не только линию границы.
- source_word: מִתִּרְצָה
  choice: выйдя из Фирцы
  rationale: Предлог מִן буквально означает «из/от». Контекстуально оборот естественно указывает исходный пункт похода Менаима, при сохранении некоторой синтаксической неоднозначности исходного текста.
- source_word: כִּי לֹא פָתַח
  choice: за то, что город не открыл ему ворот
  rationale: Буквально сказано «не открыл», но в контексте осады подразумевается отказ открыть городские ворота и впустить Менаима. «За то, что» ясно связывает отказ с последующей расправой.
- source_word: הֶהָרוֹתֶיהָ
  choice: всем находившимся там беременным женщинам
  rationale: Прямо и без эвфемизма передаёт субстантивированное прилагательное «беременные» и его связь с городом.
- source_word: בִּקֵּעַ
  choice: вспорол животы
  rationale: Пиэль глагола בקע выражает насильственное рассечение. Русская формулировка ясно передаёт конкретную жестокость действия; слово «животы» добавлено как необходимое для естественного русского выражения дополнение.
