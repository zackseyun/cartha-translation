revisions:
- from: Тогда Менаим, выйдя из Фирцы, напал на Типсах, на всё, что было в городе[a], и на всю его область. За то, что город не открыл ему ворот[b], Менаим разгромил его и вспорол[c] животы всем находившимся там беременным женщинам.
  to: Тогда Менаим напал на Типсах, на всё, что было в нём[a], и на его область от Фирцы[d], потому что город не открыл ему ворот[b]; он поразил его и вспорол[c] животы всем его беременным женщинам.
  rationale: Убрано неподтверждённое указание, что Менаим выступил из Фирцы, и сохранена не вполне ясная связь «от Фирцы» с предшествующим выражением. Второе נכה передано нейтральным «поразил», без добавления смысла полного разгрома. Сноска d отмечает синтаксическую неопределённость, не навязывая конкретной исторической реконструкции.
