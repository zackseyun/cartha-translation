  text: וְ/יֶ֖תֶר דִּבְרֵ֣י זְכַרְיָ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/011.yaml
  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ru
  text: Прочие деяния Захарии — вот, они записаны в книге летописей царей Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книге анналов царей Израиля».'
    reason: Лексический вариант для דִּבְרֵי הַיָּמִים и всей формулы названия источника.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие деяния
  rationale: В устойчивой формуле книг Царей сочетание обозначает остальные дела или события царствования, а не только слова. «Прочие деяния» сохраняет историографический характер формулы; начальный союз отдельно не передан, поскольку в русском он здесь не требуется.
- source_word: זְכַרְיָה
  choice: Захарии
  rationale: Использована традиционная русская форма библейского имени.
- source_word: הִנָּם
  choice: вот, они
  rationale: Указательная частица привлекает внимание к наличию письменной записи. «Вот» сохраняет выраженное в еврейском тексте формульное усиление, не сводя его к простому утверждению.
- source_word: כְּתוּבִים
  choice: записаны
  rationale: В контексте письменного исторического источника «записаны» естественно передаёт пассивное значение «написаны» и подчёркивает внесение сведений в документ.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Хотя предлог עַל буквально может означать «на», в формуле ссылки на источник естественное русское соответствие — «в книге».
- source_word: דִּבְרֵי הַיָּמִים
  choice: летописи
  rationale: Сочетание служит обозначением исторических записей о царствованиях. «Летопись» понятно современному читателю и уместно в названии источника; возможное «анналы» вынесено в примечание.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Так естественно передаётся принадлежность или соотнесённость летописи с царями Израиля в названии документа.
