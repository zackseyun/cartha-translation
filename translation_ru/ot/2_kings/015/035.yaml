  text: רַ֤ק הַ/בָּמוֹת֙ לֹ֣א סָ֔רוּ ע֗וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמ֑וֹת ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: ru
  text: 'Однако святилища на возвышенностях не были упразднены: народ по-прежнему приносил жертвы и воскурял благовония в святилищах на возвышенностях[a]. Он построил верхние ворота храма Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сжигал в этих святилищах приношения». Еврейский глагол может обозначать как воскурение благовоний, так и более широко — сжигание приношения, дым которого поднимается вверх.'
    reason: Лексическая неоднозначность глагола מְקַטְּרִים.
lexical_decisions:
- source_word: רַק
  choice: Однако
  rationale: Вводит оговорку к положительной оценке царя; русское «однако» естественно передаёт противопоставление в данном контексте.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: святилища на возвышенностях / там
  rationale: במות обозначает местные культовые места, а не просто географические высоты. Полное выражение дано при первом упоминании, а «там» позволяет избежать тяжеловесного повтора без потери смысла.
- source_word: לֹא סָרוּ
  choice: не были упразднены
  rationale: Хотя форма буквально означает «не удалились», в контексте речь о том, что местные святилища не были устранены; «упразднены» ясно передаёт институционально-культовый смысл.
- source_word: עוֹד
  choice: по-прежнему
  rationale: Передаёт продолжение обычной практики вопреки оговорке о деятельности царя.
- source_word: הָעָם מְזַבְּחִים
  choice: народ … приносил жертвы
  rationale: Причастная конструкция описывает продолжавшуюся обычную практику; по-русски это естественно выражается несовершенным видом.
- source_word: וּמְקַטְּרִים
  choice: воскурял … благовония
  rationale: Это естественное русское обозначение культового воскурения; более широкая возможность значения глагола קטר отмечена в сноске.
- source_word: הוּא בָּנָה
  choice: Он построил
  rationale: Самостоятельное местоимение сохраняется, но не получает излишнего усиления; בנה передано в основном значении без неподтверждённого уточнения «перестроил».
- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: верхние ворота храма Яхве
  rationale: «Храм Яхве» естественно и точно передаёт контекстуальное значение «дома Яхве», а «верхние ворота» обозначает их положение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит личное имя Бога; «Яхве» передаёт тетраграмматон, не заменяя его титулом.
- issue: Характер святилищ на возвышенностях
  choice: Не добавлять прямую оценку «языческие» или «незаконные»
  alternative: языческие капища; незаконные святилища
  rationale: Сам стих сообщает, что эти культовые места сохранились и народ продолжал там служение, но не уточняет их принадлежность такими определениями; перевод не должен вносить лишнее богословское заключение.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Термин «святилища на возвышенностях» понятнее буквального «высоты» и сохраняет культовое значение. Синтаксис краток и соответствует двухчастной структуре стиха.
