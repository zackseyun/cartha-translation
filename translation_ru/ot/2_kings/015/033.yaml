base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: ru
  text: Ему было двадцать пять лет, когда он стал царём, и шестнадцать лет он царствовал в Иерусалиме. Его мать звали Иеруша, дочь Садока.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Ему было двадцать пять лет
  rationale: Стандартная древнееврейская формула указания возраста передана естественным современным русским выражением; буквальное «сын двадцати пяти лет» было бы неестественно.
- source_word: הָיָה בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция в составе царской формулы указывает на возраст при вступлении на престол. Этот вариант естественен по-русски и не добавляет обстоятельств, отсутствующих в источнике.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: и шестнадцать лет он царствовал
  rationale: Смысл и акцент исходной формулы сохранены в естественном русском порядке слов.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Общепринятая русская форма топонима с соответствующим значением предлога.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Идиоматичная современная русская передача древнееврейской именной формулы без потери смысла.
- source_word: יְרוּשָׁא
  choice: Иеруша
  rationale: Форма имени передаёт еврейское יְרוּשָׁא и соответствует принятому русскому библейскому написанию.
- source_word: בַּת צָדוֹק
  choice: она была дочерью Цадока
  rationale: Родственная связь передана прямо; отдельное предложение устраняет возможную синтаксическую тяжеловесность и ясно связывает обозначение с Иерушей.
