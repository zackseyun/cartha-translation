base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Прочие деяния Иофама, которые он совершил, не записаны ли они[a] в книге летописей царей Иудеи[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «написаны». В данном контексте речь идёт о внесении деяний царя в письменную летопись.'
    reason: lexical_alternative
  - marker: b
    text: «Книга летописей» здесь означает царский анналистический источник и не обязательно является библейской книгой Паралипоменон.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие деяния
  rationale: יֶתֶר обозначает остаток или прочее, а דִּבְרֵי в устойчивой формуле о царствовании относится к делам царя. «Прочие деяния» естественно передаёт смысл и сохраняет торжественный летописный регистр.
- source_word: יוֹתָם
  choice: Иофам
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: אֲשֶׁר עָשָׂה
  choice: которые он совершил
  rationale: Сохранено относительное придаточное исходного текста; глагол «совершил» естественно сочетается с «деяниями».
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: не записаны ли они
  rationale: Сохранён риторический вопрос, предполагающий утвердительный ответ. «Записаны» в данном архивном контексте естественнее буквального «написаны».
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Буквальное «на книге/свитке» идиоматически передано как включение сведений в письменный источник.
- source_word: דִּבְרֵי הַיָּמִים
  choice: летописи
  rationale: В ссылочной формуле выражение обозначает хронологические царские записи, то есть летопись.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: 'Предлог לְ в названии источника передан естественной русской родительной конструкцией: летопись, относящаяся к царям Иудеи.'
theological_decisions:
- issue: Отождествление названного источника с каноническими книгами Паралипоменон
  choice: Не отождествлять; пояснить, что речь идёт о царском летописном источнике
  alternative: Понимать название как прямую ссылку на библейские книги Паралипоменон
  rationale: Контекст формулы в книгах Царств указывает на использованный царский анналистический источник; сам еврейский текст не утверждает, что это канонические книги Паралипоменон.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным летописным оттенком. Синтаксис риторического вопроса и повторное местоимение «они» сохраняют формулу еврейского текста, оставаясь понятными современному читателю.
