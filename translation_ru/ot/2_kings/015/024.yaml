source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: ru
  text: Он делал зло в глазах Яхве. Он не отступал от грехов Иеровоама, сына Навата, который ввёл Израиль в грех.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который побудил Израиль грешить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Так естественно и близко к форме еврейского устойчивого выражения передаётся нравственная оценка царствования; несовершенный вид уместен для характеристики постоянного образа действий.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет прозрачный еврейский образ божественной оценки, а личное имя יהוה передано как «Яхве».
- source_word: לֹא סָר מֵחַטֹּאות
  choice: Он не отступал от грехов
  rationale: Глагол סור здесь означает отказ от сложившегося греховного пути; «не отступал» естественно передаёт продолжительное следование ему.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён при сохранении патронимической конструкции.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: который ввёл Израиль в грех
  rationale: Каузативная форма глагола חטא указывает, что Иеровоам побудил народ грешить; выражение «ввёл в грех» ясно и естественно по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Степень каузативности הֶחֱטִיא
  choice: ввёл Израиль в грех
  alternative: заставил Израиль грешить; склонил Израиль ко греху
  rationale: Выбранный вариант сохраняет причинное значение породы hифиль, но не уточняет сверх текста степень принуждения или способ воздействия.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранён библейский образ «в глазах Яхве»; синтаксис сделан ясным для обычного читателя.
