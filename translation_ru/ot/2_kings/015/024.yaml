  source_fidelity: Текст точно передаёт формулу וַיַּעַשׂ הָרַע («делал зло»), оценочное выражение «в глазах Яхве», отрицание отказа от грехов Иеровоама и каузативное значение הֶחֱטִיא — «ввёл Израиль в грех». Множественное «грехов Иеровоама» сохранено; единственное «в грех» в последней части — естественная русская конструкция и не меняет смысла.
