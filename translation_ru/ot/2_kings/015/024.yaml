  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. Формы «Иеровоам, сын Навата» соответствуют укоренённой русской библейской ономастике. Сноска [a] поставлена непосредственно после относящегося к ней утверждения и предлагает допустимый лексический вариант каузатива.
