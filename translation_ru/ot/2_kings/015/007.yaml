base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: ru
  text: Азария почил со своими отцами[a], и его похоронили вместе с отцами в Городе Давида. Вместо него стал царствовать его сын Иофам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со своими предками». Выражение «почил со своими отцами» — древнееврейская устойчивая формула, сообщающая о смерти человека и его приобщении к ушедшим поколениям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: Глагол входит в устойчивую древнееврейскую формулу о смерти царя. «Почил» сохраняет эвфемистический образ сна, но звучит по-русски естественнее буквального «уснул» в сообщении о смерти.
- source_word: עִם אֲבֹתָיו
  choice: со своими отцами / вместе с отцами
  rationale: Сохранена традиционная родовая формула; «отцы» здесь означает предшествующие поколения, а не только непосредственного отца. Местоимение во втором употреблении опущено как необязательное по-русски.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: его похоронили
  rationale: Неопределённо-личная конструкция естественно передаёт древнееврейский глагол во множественном числе с неуказанным субъектом.
- source_word: בְּעִיר דָּוִד
  choice: в Городе Давида
  rationale: Передано как устоявшееся название места царских погребений.
- source_word: וַיִּמְלֹךְ
  choice: стал царствовать
  rationale: В формуле престолонаследия сочетание передаёт начало царствования и сохраняет значение глагола «царствовать».
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Выражает занятие Иофамом царского положения Азарии; в данном контексте не несёт оттенка враждебного замещения.
