base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: ru
  text: Тогда Шаллум, сын Иавеша, составил против него заговор, поразил его перед народом[a] и умертвил его, а вместо него стал царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «публично»; возможно: «перед собранием». Еврейское выражение трудно для истолкования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: составил против него заговор
  rationale: В контексте смены царской власти קשר обозначает политический заговор; этот перевод естественен для современного русского языка и сохраняет направленность действия против царя.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: Шаллум, сын Иавеша
  rationale: Имена переданы в принятой русской библейской форме; בן выражено обычной родословной конструкцией «сын».
- source_word: וַיַּכֵּהוּ
  choice: поразил его
  rationale: Глагол נכה означает нанесение удара или поражение. Поскольку следующий глагол отдельно сообщает о смерти, здесь не следует переводить «убил» и тем самым сливать два действия.
- source_word: קָבָל־עָם
  choice: перед народом
  rationale: Трудное и редкое выражение, вероятнее всего, указывает на совершение действия в присутствии народа. Буквально близкая передача сохраняет неоднозначность.
- source_word: וַיְמִיתֵהוּ
  choice: умертвил его
  rationale: Каузативная форма глагола מות означает «предать смерти, умертвить». Выбор сохраняет отдельное указание на причинение смерти после нанесённого удара.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: вместо него стал царём
  rationale: מלך с תחתיו обозначает вступление на престол на место прежнего царя. По-русски эта формулировка естественнее буквального «царствовал вместо него».
