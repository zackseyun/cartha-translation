  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: ru
  text: Во дни Пекаха, царя Израиля, пришёл Тиглатпаласар, царь Ассирии, и захватил Ийон, Авел-Бет-Мааху, Яноах, Кедеш, Хацор, Галаад и Галилею — всю землю Нафтали — и переселил жителей в Ассирию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увёл жителей в изгнание, в Ассирию»; «депортировал жителей в Ассирию».'
    reason: 'Лексическая альтернатива: וַיַּגְלֵם обозначает насильственное удаление населения в изгнание; «переселил» передаёт это значение современным нейтральным русским языком.'
lexical_decisions:
- source_word: בִּימֵי
  choice: Во дни
  rationale: Сохраняет обычную древнееврейскую временную формулу и звучит достоинственно и понятно в русском повествовании.
- source_word: בָּא
  choice: пришёл
  rationale: Передаёт буквальное значение глагола, не подменяя его более истолковывающим «вторгся»; военный характер прихода раскрывается следующим глаголом.
- source_word: וַיִּקַּח
  choice: захватил
  rationale: В контексте перечисления городов и областей глагол «взял» означает военный захват; выбран естественный современный русский эквивалент.
- source_word: עִיּוֹן
  choice: Ийон
  rationale: Транслитерация еврейского топонима, сохраняющая согласный йод.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Авел-Бет-Мааха
  rationale: 'Передаёт составной топоним как единое название; в винительном падеже в тексте: «Авел-Бет-Мааху».'
- source_word: יָנוֹחַ
  choice: Яноах
  rationale: Прямая и понятная русская транслитерация топонима.
- source_word: קֶדֶשׁ
  choice: Кедеш
  rationale: Транслитерация еврейского названия без замены традиционным грецизированным вариантом.
- source_word: חָצוֹר
  choice: Хацор
  rationale: Передаёт начальную еврейскую согласную ח и форму исходного топонима.
- source_word: הַגִּלְעָד
  choice: Галаад
  rationale: Устоявшаяся и узнаваемая русская форма названия области.
- source_word: הַגָּלִילָה
  choice: Галилею
  rationale: Естественная русская форма названия области в винительном падеже.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: всю землю Нафтали
  rationale: Сохраняет обобщающее приложение к предшествующему перечню и непосредственно передаёт אֶרֶץ как «землю».
- source_word: וַיַּגְלֵם
  choice: жителей увёл в плен
  rationale: Порода hифиль глагола גלה обозначает насильственное удаление в изгнание. Слово «жителей» делает понятным подразумеваемый человеческий объект местоименного суффикса, поскольку города и земли сами по себе нельзя увести.
