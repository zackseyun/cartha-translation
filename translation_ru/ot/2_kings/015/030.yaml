base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: ru
  text: Осия, сын Илы, составил заговор против Факея, сына Ремалии,[a] поразил его и убил его, а затем воцарился вместо него в двадцатый год правления Иоафама, сына Озии.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте употреблены однокоренные глагол и существительное: буквально, по форме выражения, «заговорил заговор»; это усиливает мысль о заговоре.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст гласит: «в двадцатый год Иоафама, сына Озии». Эта датировка создаёт хронологическую трудность, поскольку в другом месте Иоафаму приписывается шестнадцать лет царствования (4 Цар. 15:33). Иногда её пытаются согласовать с царствованием Ахаза, однако здесь перевод следует еврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: составил заговор
  rationale: Однокоренная еврейская конструкция усиливает идею заговора, но буквальное русское «заговорил заговор» неестественно. Устойчивое «составил заговор» ясно и достойно передаёт смысл; особенность оригинала отмечена в сноске.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: Осия, сын Илы
  rationale: Имена переданы в укоренившейся русской библейской форме; приложение обособлено по нормам современного русского языка.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: против Факея, сына Ремалии
  rationale: В контексте заговора עַל обозначает направленность враждебного действия; патроним сохранён.
- source_word: וַיַּכֵּהוּ וַיְמִיתֵהוּ
  choice: поразил его и предал смерти
  rationale: 'Сохранена последовательность двух глаголов: нанесение удара и последующее явное причинение смерти. Это не сводит оба действия к одному слову «убил».'
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: а затем воцарился вместо него
  rationale: Фраза естественно передаёт царское преемство; «затем» отражает повествовательную последовательность, а не добавляет новое содержание.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: в двадцатый год правления Иоафама, сына Озии
  rationale: Царская датировочная формула передана ясно и без попытки устранить хронологическую трудность масоретского текста.
theological_decisions:
- issue: Хронологическое напряжение в формуле датировки
  choice: 'Сохранить чтение масоретского текста: «в двадцатый год правления Иоафама, сына Озии»'
  alternative: Неявно отнести дату к царствованию Ахаза либо исправить число или имя
  rationale: В других местах Иоафаму приписывается более короткое самостоятельное царствование. Перевод не должен без текстового основания гармонизировать или исправлять источник; трудность следует обозначить в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Синтаксис повествовательный и сдержанный; лексическая особенность и хронологическое напряжение сохранены посредством сносок.
