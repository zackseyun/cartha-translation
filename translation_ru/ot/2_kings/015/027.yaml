  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: ru
  text: В пятьдесят второй год правления Азарии, царя Иудеи, Факей, сын Ремалии, стал царём над Израилем в Самарии и царствовал двадцать лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: В пятьдесят второй год правления
  rationale: Передаёт стандартную формулу датировки по году царствования естественным современным русским языком; слово «правления» добавлено для ясности подразумеваемого отношения.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: Азарии, царя Иудеи
  rationale: Сохраняет имя и явный царский титул; обособление приложения соответствует нормам современного русского языка.
- source_word: מָלַךְ
  choice: стал царём
  rationale: В формуле воцарения форма глагола отмечает вступление на престол; такой перевод также отличает начало царствования от последующего указания его продолжительности.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: Факей, сын Ремалии
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён; патроним передан прямо.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при מלך обозначает власть над народом или царством; «над Израилем» сохраняет эту конструкцию.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Передаёт местонахождение царской резиденции без добавления отсутствующего в тексте пояснения.
- source_word: עֶשְׂרִים שָׁנָה
  choice: двадцать лет
  rationale: Прямая и естественная передача продолжительности царствования.
