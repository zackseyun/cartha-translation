base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: ru
  text: Он делал зло в глазах Яхве. Во все свои дни он не отступал от грехов Иеровоама, сына Навата[a], посредством которых он ввёл Израиль в грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грехов Иеровоама, сына Навата, который ввёл Израиль в грех». Древнееврейский относительный оборот может относиться к Иеровоаму, а не к грехам.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Естественно передаёт устойчивую оценочную формулу Книг Царей; несовершенный вид уместен для характеристики всего царствования.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет прозрачный древнееврейский образ божественной оценки и передаёт тетраграмматон личным именем.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: не отступал от грехов
  rationale: Передаёт метафору удаления в סור и устойчивую формулу о неоставлении греховного пути.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён при современном синтаксисе.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: которыми тот ввёл Израиль в грех
  rationale: Сохраняет каузативное значение породы hифиль глагола חטא; местоимение «тот» ясно указывает на Иеровоама при выбранной связи относительного оборота с «грехами».
- source_word: כָּל יָמָיו
  choice: Во все свои дни
  rationale: Передаёт временной охват всего периода его жизни или правления и естественно относится к главному подлежащему.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация «Яхве» не заменяет его титулом.
- issue: Антецедент оборота אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Оборот связан с «грехами»: «которыми тот ввёл Израиль в грех»'
  alternative: 'Оборот связан с Иеровоамом: «Иеровоама, сына Навата, который ввёл Израиль в грех»'
  rationale: Древнееврейский синтаксис допускает обе связи. В основном тексте выбрана семантически естественная связь с грехами, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка проста и понятна; традиционные формы собственных имён сохранены. Маркер сноски помещён непосредственно после имени, к которому относится альтернативный синтаксический разбор.
