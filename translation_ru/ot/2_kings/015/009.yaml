base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: ru
  text: Он делал зло в глазах Яхве, как поступали его отцы. Он не отступал от грехов Иеровоама, сына Навата, которыми[a] тот ввёл Израиль в грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «…от грехов Иеровоама, сына Навата, который ввёл Израиль в грех». Древнееврейское относительное предложение можно связать либо непосредственно с Иеровоамом, либо с названными грехами как средством, посредством которого он вовлёк Израиль в грех.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он делал
  rationale: Форма wayyiqtol продолжает повествование; несовершенный вид естественно передаёт устойчивый образ действий царя в данной оценочной формуле.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: зло в глазах Яхве
  rationale: Сохранена характерная древнееврейская формула и её оценочная сила; выражение понятно в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: как делали его отцы
  rationale: Сохранено мужское множественное אֲבֹתָיו и династический контекст; повтор глагола отражает структуру оригинала.
- source_word: לֹא סָר
  choice: не отступал
  rationale: В нравственно-религиозном контексте סור обозначает отказ оставить избранный путь; «не отступал» звучит естественно и сохраняет образ движения.
- source_word: מֵחַטֹּאות
  choice: от грехов
  rationale: Сохранено множественное число, указывающее на совокупность связанных с Иеровоамом греховных установлений и поступков.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Использованы традиционные русские библейские формы имён с ясным приложением.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: которыми тот ввёл Израиль в грех
  rationale: Относительное местоимение соотнесено с ближайшим множественным «грехов», а «тот» ясно обозначает Иеровоама как деятеля; каузативная форма הֶחֱטִיא передана выражением «ввёл в грех».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Сохраняется личное имя Бога, непосредственно присутствующее в древнееврейском тексте.
- issue: Референт относительного אֲשֶׁר
  choice: «которыми» относится к грехам, а «тот» — к Иеровоаму
  alternative: «который ввёл Израиль в грех» с прямым отнесением всей придаточной части к Иеровоаму
  rationale: Грамматическое число допускает соотнесение אֲשֶׁר с «грехами», тогда как мужская единственная каузативная форма указывает на Иеровоама как субъекта. Сноска сохраняет реальную синтаксическую неоднозначность.
- issue: Передача אֲבֹתָיו
  choice: его отцы
  alternative: его предки
  rationale: В царском контексте буквальное мужское обозначение уместно и может относиться к предшественникам династической или царской традиции.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены формульное выражение «в глазах Яхве», традиционные русские формы имён и неоднозначность заключительного относительного предложения.
