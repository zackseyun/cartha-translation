  text: וְ/יֶ֛תֶר דִּבְרֵ֥י פְקַחְיָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: ru
  text: Остальные деяния Пекахии и всё, что он совершил, — вот, они записаны в книге летописей царей Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Остальные деяния
  rationale: В итоговой формуле о царствовании сочетание означает прочие дела или деяния царя, а не его слова. Начальный союз естественно не выражен отдельно в русском предложении.
- source_word: פְקַחְיָה
  choice: Пекахия
  rationale: Имя передано транслитерацией непосредственно с древнееврейского, с сохранением его отличия от имени Пеках.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он совершил
  rationale: Передана полнота относительного оборота; глагол «совершил» естественен в сочетании с рассказом о деяниях царя и не сужает значения עשה.
- source_word: הִנָּם
  choice: вот, они
  rationale: Сохранена указательно-презентативная сила частицы הִנֵּה с местоименным суффиксом, хотя в современном русском её можно было бы опустить ради большей гладкости.
- source_word: כְּתוּבִים
  choice: записаны
  rationale: В контексте письменной летописи «записаны» естественно передаёт пассивное причастие и яснее, чем буквальное «написаны», указывает на документальную фиксацию.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: в Книге летописи
  rationale: Предлог עַל в этой документальной формуле по-русски идиоматично передаётся как «в»; דִּבְרֵי הַיָּמִים обозначает летописную запись.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Ламед в названии архивного источника естественно выражен русским родительным падежом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формульностью. Тире помогает естественно ввести сохранённое указательное «вот»; название утраченного царского источника оформлено как заглавие.
