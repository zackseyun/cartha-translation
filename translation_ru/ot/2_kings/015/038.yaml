    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Давида, отца своего». Здесь «отец» означает предка и родоначальника царской династии, а не непосредственного отца Иофама.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: Глагол שׁכב в сочетании «с отцами» входит в устойчивую царскую формулу смерти. «Почил» естественно и достойно передаёт этот эвфемизм по-русски, не сводя его к буквальному «лёг».
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Сохранена традиционная и формально близкая к еврейскому тексту родовая формула; здесь «отцы» означает предков.
- source_word: וַיִּקָּבֵר
  choice: был погребён
  rationale: Страдательная форма точно передаёт еврейский пассив и сохраняет последовательность повествования.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: в городе Давида, отца своего
  rationale: Формулировка следует еврейскому тексту и сохраняет широкое родовое значение слова «отец»; пояснение устраняет возможность понять Давида как непосредственного отца Иофама.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: Краткий и уместный для царской хроники русский эквивалент, обозначающий вступление на престол.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт значение преемства и замещения, выраженное еврейским оборотом.
theological_decisions:
- issue: Значение выражения «Давида, отца своего»
  choice: Давид назван отцом в смысле праотца и основателя династии
  alternative: Давид как непосредственный биологический отец
  rationale: Непосредственным отцом Иофама был Озия (Азария), поэтому אָבִיו здесь употреблено в широком родовом и династическом смысле. Основной текст сохраняет формулировку источника, а сноска поясняет её.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, уместной для краткой царской хроники. Слова «почил», «погребён» и «воцарился» понятны современному читателю и сохраняют достоинство и формульность оригинала; инверсия сведена к устойчивым библейским оборотам.
