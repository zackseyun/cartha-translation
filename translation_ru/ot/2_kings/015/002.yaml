  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: ru
  text: Когда он стал царём, ему было шестнадцать лет, и он царствовал в Иерусалиме пятьдесят два года. Его мать звали Иехолия; она была из Иерусалима.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иерусалимлянка».'
    reason: Лаконичное מִירוּשָׁלָם допускает передачу как указание на происхождение либо принадлежность к Иерусалиму.
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: ему было шестнадцать лет
  rationale: Естественная русская передача древнееврейской возрастной формулы, буквально означающей «сын шестнадцати лет».
- source_word: הָיָה בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Конструкция указывает на возраст при вступлении на престол; выбранная формулировка ясна и естественна для современного русского языка.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ
  choice: царствовал … пятьдесят два года
  rationale: Сохраняет точную продолжительность правления и обычное для царской формулы значение глагола מלך.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Предлог בְ имеет здесь локативное значение и обозначает место царствования.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Современная и естественная русская передача устойчивой формулы «имя его матери было».
- source_word: יְכָלְיָהוּ
  choice: Иехолия
  rationale: Традиционная и узнаваемая русская форма древнееврейского личного имени.
- source_word: מִירוּשָׁלָם
  choice: она была из Иерусалима
  rationale: Передаёт исходное значение предлога מִן и указывает на происхождение или место жительства матери, не подразумевая буквального движения.
