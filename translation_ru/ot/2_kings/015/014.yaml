base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: ru
  text: Тогда Менахем, сын Гади, поднялся из Тирцы, пришёл в Самарию, поразил в Самарии Шаллума, сына Иавеша, предал его смерти и воцарился вместо него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Обычное значение עלה — «подниматься, идти вверх». Выбор сохраняет пространственный оттенок и не уточняет без достаточных оснований, что это был военный поход.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Менахем, сын Гади
  rationale: Имена переданы транслитерацией, а родственная формула сохранена в естественном русском синтаксисе.
- source_word: מִתִּרְצָה
  choice: из Тирцы
  rationale: Предлог מִן обозначает исходную точку движения; «из Тирцы» естественно передаёт это значение.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: пришёл в Самарию
  rationale: בוא с названием места означает прибытие или вхождение; «пришёл в Самарию» ясно и естественно по-русски.
- source_word: וַיַּךְ אֶת
  choice: поразил
  rationale: נכה обозначает нанесение удара или поражение. Последующее וַיְמִיתֵהוּ отдельно сообщает о смерти, поэтому перевод не сливает оба действия в одно.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: Шаллума, сына Иавеша
  rationale: Сохранена форма имени Шаллум, близкая к еврейскому звучанию; Иавеш передан в укоренившейся русской библейской форме.
- source_word: בְּשֹׁמְרוֹן
  choice: там
  rationale: Наречие «там» естественно отсылает к только что названной Самарии. Оно передаёт место действия без тяжеловесного повтора, не добавляя новой информации.
- source_word: וַיְמִיתֵהוּ
  choice: предал его смерти
  rationale: Каузативная форма глагола מות буквально выражает причинение смерти. «Предал его смерти» сохраняет этот оттенок и отличается от предшествующего «поразил».
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: воцарился вместо него
  rationale: מלך обозначает царствование или вступление на престол, а תַּחְתָּיו — замещение предшественника. Русское «воцарился вместо него» точно и естественно передаёт смену власти.
theological_decisions: []
