  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ מְנַחֵ֨ם בֶּן גָּדִ֧י עַל יִשְׂרָאֵ֛ל עֶ֥שֶׂר שָׁנִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: ru
  text: В тридцать девятый год правления Азарии, царя Иудеи, Менахем, сын Гади, стал царём над Израилем и правил десять лет в Самарии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: В тридцать девятый год правления
  rationale: В формуле синхронизации בִּשְׁנַת с числительным обозначает год царствования; добавление «правления» естественно для современного русского языка и ясно передаёт подразумеваемый смысл.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: Азарии, царя Иудеи
  rationale: Предлог ל связывает датировку с царствованием Азарии, а сочетание מֶלֶךְ יְהוּדָה передано обычным русским царским титулом.
- source_word: מָלַךְ מְנַחֵם בֶּן גָּדִי עַל יִשְׂרָאֵל
  choice: Менахем, сын Гади, стал царём над Израилем
  rationale: В данном контексте מָלַךְ обозначает вступление на престол, поскольку далее отдельно указана продолжительность царствования; עַל сохраняет смысл власти над Израилем.
- source_word: עֶשֶׂר שָׁנִים
  choice: десять лет
  rationale: Прямое обозначение продолжительности царствования.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Локативное ב обозначает Самарию как место и столицу царствования.
