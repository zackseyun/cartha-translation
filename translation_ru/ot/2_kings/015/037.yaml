base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: ru
  text: В те дни Яхве начал посылать против Иудеи[b] Рецина, царя Арама[a], и Факея, сына Ремалии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Арам»; традиционное название — «Сирия».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Иудею»; в данном контексте посылание носит враждебный характер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественно передаёт обычную древнееврейскую временную формулу, обозначающую исторический период.
- source_word: הֵחֵל
  choice: начал
  rationale: Точно передаёт начало продолжающегося действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: насылать на Иудею
  rationale: Глагол «насылать» естественно выражает посылание враждебных сил, а предлог «на» передаёт направленность действия против Иудеи; несовершенный вид уместен после «начал».
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Рецина, царя Арама
  rationale: Сохраняет имена и этногеографическое название исходного текста; винительный падеж обусловлен русским синтаксисом.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: и Факея, сына Ремалии
  rationale: Передаёт второго прямого объекта и традиционно узнаваемые русские формы библейских имён.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; форма «Яхве» непосредственно передаёт тетраграмматон, не подменяя его титулом.
- issue: Роль Яхве в начале вражеского давления
  choice: начал насылать
  alternative: допустил нападения
  rationale: Перевод сохраняет прямую причинную формулировку еврейского текста и не смягчает богословское напряжение посредством истолковательного «допустил».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Насылать» ясно выражает враждебный контекст, не добавляя способа нападения. Маркеры сносок помещены в основном тексте; сноска о географическом названии стоит после «Арама», а замечание об идиоме — в конце соответствующего высказывания.
