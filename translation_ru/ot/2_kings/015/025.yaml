source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: ru
  text: И составил против него заговор Факей, сын Ремалии, его военачальник[a]. Он поразил его в Самарии, в крепости царского дворца[b], вместе с Арговом и Арье[c]; с Факеем было пятьдесят человек из галаадитян. Он умертвил его и воцарился вместо него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «его высокопоставленный военный». Еврейское слово שָׁלִישׁ обозначает военного или придворного высокого ранга, но точное название должности неизвестно.
    reason: lexical_alternative
  - marker: b
    text: Или «во дворце царского дома». Еврейское אַרְמוֹן может обозначать дворец, цитадель или укреплённую царскую резиденцию.
    reason: lexical_alternative
  - marker: c
    text: Арье — личное имя; само еврейское слово также означает «лев». Повтор показателя прямого дополнения אֶת может указывать, что Факей поразил также Аргова и Арье, хотя возможно и понимание их как лиц, участвовавших в этих событиях.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: составил против него заговор
  rationale: В политическом контексте книг Царств קשר обозначает заговор против правителя; русский оборот передаёт не частный умысел, а попытку переворота.
- source_word: שָׁלִישׁוֹ
  choice: его военачальник
  rationale: Слово обозначает высокопоставленного военного или придворного служащего, однако точный чин неясен; «военачальник» естественно передаёт высокий военный статус без излишней конкретизации.
- source_word: וַיַּכֵּהוּ
  choice: поразил его
  rationale: נכה означает нанести удар или поразить. Более общее «поразил» сохраняет отличие от последующего וַיְמִיתֵהוּ — «умертвил».
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: в крепости царского дворца
  rationale: אַרְמוֹן может обозначать дворец, цитадель или укреплённую часть резиденции. «Крепость царского дворца» передаёт укреплённый характер места и избегает повтора «дворец дворца».
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: вместе с Арговом и Арье
  rationale: Оба слова в данном повествовании лучше понимать как личные имена. Формулировка сохраняет некоторую синтаксическую неоднозначность относительно роли этих людей.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: с Факеем было пятьдесят человек из галаадитян
  rationale: Безглагольная сопутствующая конструкция указывает на отряд, находившийся с Факеем; явное имя вместо местоимения устраняет возможную неясность длинной русской фразы, а «из галаадитян» сохраняет значение מן.
- source_word: וַיְמִיתֵהוּ
  choice: умертвил его
  rationale: Порода хифиль глагола מות имеет каузативное значение «предать смерти, умертвить» и остаётся отличимой от предшествующего «поразил».
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: воцарился вместо него
  rationale: Естественная русская передача стандартной формулы царского преемства.
theological_decisions:
- issue: Роль Аргова и Арье в убийстве
  choice: Сохранена формулировка «вместе с Арговом и Арье» с пояснением в сноске.
  alternative: «А также поразил Аргова и Арье» либо понимание их как сообщников Факея.
  rationale: Повтор частицы אֶת допускает понимание Аргова и Арье как дополнительных объектов удара, тогда как традиционная передача оставляет возможность видеть в них участников или сопутствующих лиц. Контекст не позволяет уверенно устранить эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на несколько предложений ради ясности; сохранена последовательность «поразил — умертвил — воцарился» и подлинная неоднозначность упоминания Аргова и Арье.
