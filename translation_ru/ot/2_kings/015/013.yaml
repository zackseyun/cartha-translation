base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: ru
  text: Шаллум, сын Явеша, стал царём в тридцать девятый год правления Уззии, царя Иудеи, и царствовал в Самарии один месяц[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «месяц дней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלַךְ
  choice: стал царём
  rationale: Форма описывает восшествие Шаллума на престол в указанный год, а не продолжительность его царствования.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: в тридцать девятый год правления
  rationale: Это обычная формула синхронизации царствований; слово «правления» естественно передаёт подразумеваемый смысл по-русски.
- source_word: לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: Уззии, царя Иудеи
  rationale: Предлог לְ в хронологической формуле указывает, что год отсчитывается по царствованию Уззии.
- source_word: וַיִּמְלֹךְ
  choice: и царствовал
  rationale: Глагол продолжает повествование, переходя от восшествия на престол к продолжительности царствования.
- source_word: יֶרַח יָמִים
  choice: один месяц[a]
  rationale: Буквально выражение означает «месяц дней». В основном тексте выбран естественный современный русский эквивалент, а форма оригинала сохранена в сноске.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог בְּ имеет обычное местное значение; Самария названа местом царствования.
