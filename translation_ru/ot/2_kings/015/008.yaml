  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ זְכַרְיָ֨הוּ בֶן יָרָבְעָ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שִׁשָּׁ֥ה חֳדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: ru
  text: В тридцать восьмой год правления Азарии, царя Иудеи, Захария, сын Иеровоама, стал царём над Израилем в Самарии и царствовал шесть месяцев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה לַעֲזַרְיָהוּ
  choice: В тридцать восьмой год правления Азарии
  rationale: Стандартная древнееврейская формула датировки по году царствования; добавление «правления» естественно и ясно передаёт функцию конструкции с ל.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Естественная русская передача сочетания, обозначающего титул и царство Азарии.
- source_word: מָלַךְ זְכַרְיָהוּ
  choice: Захария ... стал царём
  rationale: В данном хронологическом контексте форма глагола מלך указывает на вступление на престол, а не просто на продолжительность царствования.
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: Захария, сын Иеровоама
  rationale: Использованы традиционные и узнаваемые русские формы библейских имён и прямая передача родства.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при глаголе царствования обозначает власть над народом или царством.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Локативная конструкция указывает на место и столицу царствования.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: и царствовал шесть месяцев
  rationale: В еврейском тексте это обстоятельство продолжительности при מָלַךְ. Повтор значения глагола по-русски устраняет возможное ошибочное прочтение, будто вступление на престол длилось шесть месяцев.
