  text: וְ/יֶ֛תֶר דִּבְרֵ֥י עֲזַרְיָ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Остальные деяния Азарии и всё, что он совершил, разве не записаны[a] в Книге летописей царей Иудеи?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «написаны»; это более буквальная передача כְּתוּבִים.'
    reason: lexical_alternative
  - marker: b
    text: «Книга летописей царей Иудеи» — царская хроника, или свод записей, на который неоднократно ссылаются книги Царей.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: остальные деяния
  rationale: В итоговой формуле книг Царей речь идёт об остальных событиях и поступках царя, не изложенных в данном повествовании. «Остальные деяния» естественно передаёт этот смысл, не сводя דִּבְרֵי к словам или речам.
- source_word: עֲזַרְיָהוּ
  choice: Азария
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он совершил
  rationale: Сохраняет широкий смысл относительного оборота и соответствует достоинству исторического повествования.
- source_word: הֲלֹא
  choice: разве не
  rationale: Сохраняет форму риторического вопроса, не превращая её в утвердительное высказывание.
- source_word: הֵם כְּתוּבִים
  choice: не записаны
  rationale: «Записаны» естественно по-русски выражает результат письменной фиксации в архивном источнике; более буквальное «написаны» здесь звучало бы менее идиоматично.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Хотя предлог עַל буквально означает «на», применительно к письменному источнику по-русски естественно сказать «записаны в книге».
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Книга летописей царей Иудеи
  rationale: Передаёт название цитируемого царского летописного источника и сохраняет традиционное архивное значение выражения דִּבְרֵי הַיָּמִים.
