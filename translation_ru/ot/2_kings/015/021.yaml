base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Прочие дела Менахема и всё, что он совершил, разве не записаны в книге летописей[a] царей Израиля?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книге хроник царей Израиля».'
    reason: 'Лексическое уточнение: דִּבְרֵי הַיָּמִים может обозначать летописи, хроники или анналы.'
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Остальные деяния
  rationale: В царской итоговой формуле דִּבְרֵי обозначает не только слова, но дела и события правления; «деяния» точно и естественно передаёт этот смысл. Начальное וְ не требует добавления временного «теперь».
- source_word: מְנַחֵם
  choice: Менахема
  rationale: Имя передано принятой русской библейской транслитерацией и поставлено в родительном падеже по синтаксису предложения.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он совершил
  rationale: Передаёт полноту относительной конструкции; «совершил» сохраняет достоинство повествовательного регистра и избегает близкого повтора со словом «деяния».
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записаны
  rationale: הֲלוֹא вводит риторический вопрос, предполагающий утвердительный ответ; «записаны» естественно передаёт письменную фиксацию в историческом источнике.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Хотя עַל буквально может означать «на», в формуле ссылки на письменный источник по-русски естественно «в книге».
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Книге летописей царей Израиля
  rationale: דִּבְרֵי הַיָּמִים обозначает хроники или анналы; «летописи» сохраняет традиционную историческую окраску, а לְ передаёт отношение этого свода к царям Израиля.
