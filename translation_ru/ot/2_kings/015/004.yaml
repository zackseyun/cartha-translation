base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/004.yaml
  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: ru
  text: 'Только высоты не были устранены: народ по-прежнему приносил жертвы и сжигал приношения[a] на высотах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскурял благовония». Еврейский глагол может обозначать как воскурение благовоний, так и более широко — сжигание приношения, от которого поднимается дым.'
    reason: Лексическая неоднозначность глагола מְקַטְּרִים.
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Обозначает исключение из положительной оценки царя и сохраняет краткую формулу, характерную для книг Царей.
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Устоявшееся библейское обозначение мест отправления культа, часто располагавшихся на возвышенностях; оно сохраняет историко-религиозный смысл термина.
- source_word: לֹא סָרוּ
  choice: не были упразднены
  rationale: При подлежащем «высоты» выражение означает, что эти культовые места не устранили; выбран естественный современный русский оборот.
- source_word: עוֹד
  choice: по-прежнему
  rationale: Передаёт продолжение прежней практики.
- source_word: הָעָם
  choice: народ
  rationale: Прямо передаёт собирательное обозначение населения.
- source_word: מְזַבְּחִים
  choice: приносил жертвы
  rationale: Естественно передаёт культовое значение глагола זבח и согласуется с собирательным существительным «народ».
- source_word: וּמְקַטְּרִים
  choice: и сжигал приношения
  rationale: Сохраняет связь действия с дымом и не ограничивает значение исключительно воскурением благовоний; более узкая возможность приведена в сноске.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: Передаёт место совершения культовых действий и сохраняет традиционное сочетание с термином «высоты».
theological_decisions:
- issue: Характер богослужения на высотах
  choice: Стих сообщает о продолжавшемся совершении жертвоприношений в местных культовых местах, не уточняя, кому они предназначались.
  alternative: Прямо назвать происходившее идолопоклонством либо, напротив, поклонением Господу в недозволенных местах.
  rationale: Сам еврейский текст этого стиха не называет божество, которому приносились жертвы, поэтому перевод не должен устранять содержащуюся в тексте неопределённость.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного библейского термина «высоты». Синтаксис краткий и формульный, соответствующий повествовательному стилю книг Царей.
