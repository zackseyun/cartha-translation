  text: הֽוּא הִכָּ֧ה אֶת פְּלִשְׁתִּ֛ים עַד עַזָּ֖ה וְ/אֶת גְּבוּלֶ֑י/הָ מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/008.yaml
  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: ru
  text: Он поразил филистимлян вплоть до Газы и её пределов[a] — от сторожевой башни до укреплённого города[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и подвластной ей области». Еврейское слово может обозначать как границы, так и принадлежащую городу территорию.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «от сторожевой башни до укреплённого города» охватывает всё пространство — от малого сторожевого пункта до крупного защищённого поселения.
    reason: cultural_note
lexical_decisions:
- source_word: הוּא
  choice: Он
  rationale: Явное местоимение сохранено, поскольку в еврейском повествовании оно выделяет действующее лицо.
- source_word: הִכָּה
  choice: поразил
  rationale: Глагол נכה буквально обозначает нанесение удара и в военном контексте может подразумевать разгром; «поразил» сохраняет образность, не сводя смысл только к окончательной победе.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Общепринятое современное русское обозначение этого народа.
- source_word: עַד עַזָּה
  choice: вплоть до Газы
  rationale: Предлог עַד указывает на предел распространения военных действий; «вплоть до» естественно передаёт пространственный охват.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: и её пределов
  rationale: Слово גְּבוּל может обозначать как границы, так и ограниченную ими область. «Пределы» сохраняет эту смысловую широту; возможное территориальное значение пояснено в сноске.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: от сторожевой башни
  rationale: Сочетание буквально описывает башню стражей или наблюдателей; «сторожевая башня» звучит естественно и сохраняет конкретный образ.
- source_word: עַד עִיר מִבְצָר
  choice: до укреплённого города
  rationale: Прямой и привычный русский эквивалент; вместе с предыдущим оборотом выражает весь диапазон поселений и оборонительных пунктов.
