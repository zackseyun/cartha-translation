  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: ru
  text: 'Ты говоришь: «У меня есть совет и сила для войны», — но это только слова. На кого же ты надеялся, что восстал против меня?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: пустые слова
  rationale: Буквально «слово уст»; в данном контексте выражение пренебрежительно обозначает одни лишь речи, не подкреплённые реальной военной способностью. Русское «пустые слова» естественно передаёт эту идиому.
- source_word: עֵצָה וּגְבוּרָה
  choice: совет и сила
  rationale: 'Сохранены два отдельных понятия: разумная стратегия и военная мощь, без сведения их к одному общему выражению.'
- source_word: בָטַחְתָּ
  choice: понадеялся
  rationale: Глагол выражает доверие или опору на кого-либо; «понадеялся» естественно сочетается с вопросом «на кого».
- source_word: מָרַדְתָּ
  choice: восстал
  rationale: Передаёт политический смысл неповиновения и мятежа вассала против сюзерена.
theological_decisions:
- issue: Риторическая оценка слов Езекии посланником ассирийского царя
  choice: Сохранить реплику как обвинение в пустословии, не подтверждая её истинность голосом повествователя
  alternative: Передать слова как объективное утверждение автора
  rationale: В стихе говорит противник Езекии; перевод не должен превращать его риторику в богословскую оценку повествователя.
translation_notes:
  register: Современный литературный русский язык; речь властная и насмешливая, но без архаизмов. Союз «но» эксплицирует контраст, заложенный в бессоюзном еврейском построении.
