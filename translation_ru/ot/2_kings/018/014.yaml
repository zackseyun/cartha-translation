base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: ru
  text: 'И послал Езекия, царь Иудеи, в Лахис к царю Ассирии[a] с такими словами: «Я согрешил. Отступи от меня. Всё, что ты возложишь на меня[b], я понесу». И наложил царь Ассирии на Езекию, царя Иудеи, триста талантов серебра и тридцать талантов золота.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к царю Ассирии, находившемуся в Лахисе». Еврейская форма обычно обозначает движение к Лахису, но в данном контексте может также указывать на местонахождение царя Ассирии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Всё, что ты наложишь на меня, я выплачу». В еврейском тексте говорится о бремени, которое Езекия готов нести; в данном контексте имеется в виду установленная выплата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал … сказать
  rationale: Глагол означает «послал»; дополнение «сказать» уже дано в еврейском לֵאמֹר и естественно передаёт отправку сообщения или посланников.
- source_word: לָכִישָׁה
  choice: в Лахис
  rationale: Направительное окончание обычно указывает движение к Лахису; по контексту там находился царь Ассирии. Русское «в Лахис» сохраняет возможный оттенок направления и естественно читается как указание места.
- source_word: חָטָאתִי
  choice: Я согрешил
  rationale: Сохранено обычное значение глагола חטא и его нравственная сила, хотя в дипломатическом контексте фраза также выражает признание вины или проступка.
- source_word: שׁוּב מֵעָלַי
  choice: Отступи от меня
  rationale: Сочетание выражает просьбу прекратить военное давление и отойти; «отступи» естественно для данного военно-политического контекста.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: Всё, что ты возложишь на меня
  rationale: Сохранён образ возлагаемого бремени без преждевременного сужения смысла до дани или штрафа.
- source_word: אֶשָּׂא
  choice: я понесу
  rationale: Буквальное «нести» здесь означает принять и исполнить возложенное обязательство, вероятнее всего выплатить установленную дань.
- source_word: וַיָּשֶׂם ... עַל
  choice: наложил … на
  rationale: Передаёт установление обязательной выплаты и сохраняет смысловую связь с предшествующим «возложишь на меня».
- source_word: כִּכַּר
  choice: талант
  rationale: Традиционное название древней весовой единицы; в тексте употреблено с русскими счётными формами «триста талантов» и «тридцать талантов».
- source_word: כֶּסֶף / זָהָב
  choice: серебро / золото
  rationale: Названы конкретные металлы, измеряемые по весу, поэтому их не следует обобщать словом «деньги».
theological_decisions:
- issue: Нравственная сила признания Езекии
  choice: «Я согрешил»
  alternative: «Я виноват» / «Я поступил неправильно»
  rationale: Еврейский текст использует обычный глагол «грешить». Политический контекст допускает смысл признания проступка, но не требует устранять нравственный оттенок.
- issue: Степень конкретизации возложенного бремени
  choice: «Всё, что ты возложишь на меня, я понесу»
  alternative: «Какую дань ты ни назначишь, я заплачу»
  rationale: Основной текст сохраняет более широкий образ оригинала; следующая фраза сама показывает, что речь идёт о денежной выплате.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным строем. «И послал» и «И наложил» сохраняют последовательность еврейского рассказа; синтаксис при этом остаётся понятным обычному читателю.
