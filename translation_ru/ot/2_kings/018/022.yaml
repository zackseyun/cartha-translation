  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: ru
  text: 'Но если вы скажете мне: «Мы полагаемся на ГОСПОДА, нашего Бога», — разве не Он тот, чьи высоты[a] и жертвенники убрал Езекия, сказав Иуде и Иерусалиму: «Поклоняйтесь перед этим жертвенником в Иерусалиме»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Высоты — местные культовые места, нередко располагавшиеся на возвышенностях.
    reason: Поясняет технический термин בָּמוֹת без подмены его интерпретативным переводом и без одобрения предпосылки речи посланника.
lexical_decisions:
- source_word: בָּטָחְנוּ
  choice: мы полагаемся
  rationale: Передаёт значение уверенного доверия; в данном контексте естественнее и точнее, чем отвлечённое «верим».
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона, позволяющая отличить имя Бога от обычного титула типографически.
- source_word: בָּמֹתָיו
  choice: Его святилища на высотах
  rationale: במות — культовые места, обычно расположенные на возвышенностях; добавление «святилища» предотвращает ошибочное понимание как просто географических высот.
- source_word: הֵסִיר
  choice: уничтожил
  rationale: В контексте реформы Езекии глагол означает устранение культовых объектов; «уничтожил» естественно передаёт практический результат, хотя буквально возможно «удалил».
- source_word: תִּשְׁתַּחֲווּ
  choice: поклоняйтесь
  rationale: Имперфект в цитируемом распоряжении передан естественным русским повелительным наклонением.
theological_decisions:
- issue: Чья точка зрения выражена в вопросе о высотах и жертвенниках
  choice: Сохранён провокационный вопрос Рабсака без поясняющей коррекции
  alternative: Уточнить, что Рабсак ошибочно считает упразднённые высоты законными святилищами ГОСПОДА
  rationale: Текст передаёт аргумент ассирийского посланника и намеренно не вставляет авторского опровержения внутрь его речи.
- issue: Отнесение местоимений в «Его святилища… и жертвенники»
  choice: Местоимение отнесено к ГОСПОДУ, как в синтаксисе исходного текста
  alternative: 'Передать нейтрально: «те святилища… и жертвенники»'
  rationale: Это сохраняет риторическую силу и богословское напряжение речи Рабсака, не подтверждая истинность его предпосылки.
translation_notes:
  register: Современный литературный русский язык; речь официальная и насмешливо-полемическая. Синтаксис вопроса сохранён, но упорядочен для естественного русского звучания.
