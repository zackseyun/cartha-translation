  terminology: «ГОСПОДЬ» и «Езекия» приемлемы. «Высоты» — точный библейско-культурный термин для בָּמוֹת; сноска кратко поясняет его, не утверждая правомерность этих культовых мест. «Поклоняйтесь» адекватно передаёт תִּשְׁתַּחֲווּ.
