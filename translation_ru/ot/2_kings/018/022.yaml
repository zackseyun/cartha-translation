  source_fidelity: 'Смысл передан верно: это условное возражение ассирийского посланника, а не утверждение повествователя. Однако הֵסִיר буквально означает «убрал/устранил», поэтому «уничтожил» излишне сужает смысл. בָּמוֹת следует передать как устоявшийся термин «высоты», не разворачивая его в «святилища на высотах».'
