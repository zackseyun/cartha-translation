  text: מִ֚י בְּ/כָל אֱלֹהֵ֣י הָֽ/אֲרָצ֔וֹת אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: ru
  text: Кто из всех богов стран избавил свою страну от моей руки, чтобы Яхве избавил Иерусалим от моей руки?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: Кто из всех богов этих стран
  rationale: מִי с בְּכָל передаёт выделение из множества; «этих стран» естественно указывает на упомянутые народы и не расширяет значение до всей земли.
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: избавил свою страну
  rationale: Глагол נצל в военном контексте означает «избавить, спасти». Хотя в еврейском стоят множественные формы, вопросительное מִי выделяет одного возможного деятеля; по-русски согласование в единственном числе и распределительное «свою страну» звучат естественно и передают смысл.
- source_word: מִיָּדִי
  choice: от моей руки
  rationale: Сохранена прозрачная библейская метафора руки как власти и силы; выражение повторено в соответствии с оригиналом.
- source_word: כִּי יַצִּיל
  choice: чтобы … избавил
  rationale: 'В риторическом вызове כִּי вводит оспариваемое следствие: если ни один бог не спас своей страны, на каком основании Яхве спасёт Иерусалим. Конструкция «чтобы» передаёт эту насмешливую логику без добавочного толкования.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Употреблена общепринятая русская форма названия города.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом, особенно значимое здесь, где Рабсак сравнивает Яхве с богами других стран.
- issue: Смысл риторического вопроса
  choice: Сохранён как насмешливый вызов без утверждения бессилия Яхве от лица повествователя
  alternative: 'Передать как прямое предсказание: «разве Яхве избавит…?»'
  rationale: Высказывание принадлежит ассирийскому посланнику. Формулировка сохраняет его дерзкое рассуждение, не превращая его слова в авторскую богословскую оценку.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повтор «от моей руки» сохранён ради риторического нажима оригинала; архаизмы и конфессионально маркированные замены имени избегаются.
