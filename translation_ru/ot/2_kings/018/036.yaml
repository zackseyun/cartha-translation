lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: хранил молчание
  rationale: Форма глагола חרשׁ здесь обозначает намеренное продолжение молчания. Выражение передаёт сдержанность народа и естественно звучит по-русски.
- source_word: הָעָם
  choice: народ
  rationale: Обычное значение עַם; в контексте речь идёт об иудеях, слушавших речь, но источник не требует дополнительного уточнения.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: не отвечал ему ни слова
  rationale: Сохранена выразительная еврейская конструкция с דָבָר, означающая полное отсутствие ответа; в русском она также естественна.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину молчания народа. «Потому что» ясно передаёт причинную связь.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: царь приказал
  rationale: 'Именная конструкция «повеление царя» естественно преобразована в русскую глагольную: смысл царского приказа и его властный характер полностью сохранены.'
- source_word: הִיא לֵאמֹר
  choice: передано двоеточием перед прямой речью
  rationale: Буквальная конструкция «она была, говоря» служит введением содержания приказа; в современном русском эту функцию естественно выполняет двоеточие.
- source_word: לֹא תַעֲנֻהוּ
  choice: Не отвечайте ему
  rationale: Отрицательная форма второго лица множественного числа выражает обращённый ко всей группе запрет; перевод сохраняет повтор глагола ענה.
