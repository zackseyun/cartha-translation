base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: ru
  text: Где боги Хамата и Арпада? Где боги Сефарваима, Хены и Иввы?[a] Разве они спасли Самарию от моей руки?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия этих мест передаются по-разному; Ивва также передаётся как Авва.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Где
  rationale: Вопросительное наречие места; русская форма естественно сочетается с подразумеваемым множественным подлежащим «боги» и сохраняет насмешливый риторический тон.
- source_word: אֱלֹהֵי
  choice: боги
  rationale: Сопряжённая форма множественного числа; в контексте обозначает божеств названных городов и народов.
- source_word: חֲמָת וְאַרְפָּד
  choice: Хамата и Арпада
  rationale: Географические названия переданы в формах, принятых в русской библейской традиции.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: Сефарваима, Эны и Иввы
  rationale: Топонимы транслитерированы в привычной для русского библейского текста форме; вариантность последнего имени отмечена в сноске.
- source_word: כִּי
  choice: Разве
  rationale: Здесь частица вводит риторический вопрос. «Разве» естественно передаёт насмешливый вызов, не превращая כִּי в причинный союз.
- source_word: הִצִּילוּ
  choice: спасли
  rationale: Hiphil глагола נצל означает «избавить, спасти»; «спасли» ясно и естественно передаёт военный контекст.
- source_word: שֹׁמְרוֹן
  choice: Самарию
  rationale: Стандартная русская форма названия города; винительный падеж соответствует синтаксической роли прямого дополнения.
- source_word: מִיָּדִי
  choice: от моей руки
  rationale: Сохранён конкретный древнееврейский образ руки как власти и силы; выражение понятно в современном русском и поддерживает торжественно-библейский регистр.
theological_decisions:
- issue: Смысл вызова говорящего относительно языческих божеств
  choice: Сохранить хвастливый риторический вопрос о неспособности богов покорённых городов спасти Самарию от власти ассирийского царя.
  alternative: Передать последнюю фразу как более обобщённую насмешку над всеми национальными богами.
  rationale: Еврейский текст прямо называет богов нескольких мест, а затем спрашивает, спасли ли они Самарию «от моей руки». Перевод сохраняет риторику, не утверждая и не отрицая реальность или силу этих божеств сверх того, что выражает сам говорящий.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены риторический повтор «Где боги…?» и конкретная метафора «от моей руки». Все топонимы оформлены в естественных русских падежных формах.
