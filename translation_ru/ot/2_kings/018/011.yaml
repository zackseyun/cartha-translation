    issue: Неудачная конструкция «при Хаворе, реке Гозана».
    rationale: В современном русском «при Хаворе» может восприниматься как местность или учреждение, а дальнейшее «реке Гозана» присоединено шероховато. В исходном тексте Хавор связан с выражением «река Гозана»; переводу нужна более ясная конструкция без снятия возможной неоднозначности.
  - severity: low
