  register: Современный литературный русский язык с достоинством исторического повествования. Сохранено собирательное «Израиль» и согласование по смыслу во множественном числе («их»). Формулировка о Хаворе и Гозане не устраняет географико-синтаксическую неоднозначность еврейского текста.
