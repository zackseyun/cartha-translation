  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: ru
  text: Царь Ассирии увёл Израиль[a] в изгнание в Ассирию и поселил их в Халахе, у реки Хавор, реки Гозана[b], и в городах мидян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «Израиль» — северное царство и его народ, уведённый в изгнание.
    reason: cultural_note
  - marker: b
    text: Еврейское выражение может также пониматься как «Хавор, река у Гозана» или «Хавор, река в Гозане».
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: увёл … в изгнание
  rationale: Каузативная форма глагола גלה обозначает насильственное удаление в изгнание. Выражение передаёт принудительный характер события естественнее, чем нейтральное «переселил», и менее канцелярски, чем «депортировал».
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Прямое и привычное соответствие еврейской сопряжённой конструкции.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено собирательное политико-национальное обозначение северного царства; последующее «их» отражает подразумеваемое множество людей.
- source_word: אַשּׁוּרָה
  choice: в Ассирию
  rationale: Направительный суффикс передаёт движение к месту назначения.
- source_word: וַיַּנְחֵם
  choice: поселил их
  rationale: В данном контексте каузативная форма означает размещение изгнанников для проживания в назначенных местах.
- source_word: בַּחְלַח
  choice: в Халахе
  rationale: Топоним передан русской транслитерацией с требуемым предложным падежом.
- source_word: וּבְחָבוֹר
  choice: при Хаворе
  rationale: Поскольку далее Хавор определяется как река, «при» естественно выражает размещение у реки и сохраняет значение еврейского предлога בְּ.
- source_word: נְהַר גּוֹזָן
  choice: реке Гозана
  rationale: Сопряжённая конструкция передана буквально и допускает понимание Хавора как реки, связанной с Гозаном.
- source_word: וְעָרֵי מָדָי
  choice: и в городах мидян
  rationale: Прямо передаёт сопряжённую конструкцию и этноним מָדַי, не заменяя его географическим названием «Мидия».
