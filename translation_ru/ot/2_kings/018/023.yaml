base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: ru
  text: 'Ну же, заключи пари[a] с моим господином, царём Ассирии: я дам тебе две тысячи коней, если ты сможешь выставить для них всадников.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступи в соглашение с моим господином»; возможно также: «прими на себя обязательство перед моим господином». Еврейский глагол может обозначать соглашение или принятие обязательства, но в этом насмешливом контексте, вероятно, означает пари или вызов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: заключи сделку
  rationale: Глагол в данном насмешливом дипломатическом контексте означает вступить в условное соглашение, пари или состязание; «заключи сделку» естественно по-русски и сохраняет основную неоднозначность, уточнённую в сноске. Частица נָא передана побудительной формой без отдельного «пожалуйста», которое в русской насмешливой речи могло бы звучать излишне учтиво.
- source_word: אֶת אֲדֹנִי אֶת מֶלֶךְ אַשּׁוּר
  choice: с моим господином, царём Ассирии
  rationale: אֶת при данном глаголе имеет значение совместности — «с». «Господин» обозначает земного владыку говорящего; приложение прямо определяет его как царя Ассирии.
- source_word: וְאֶתְּנָה לְךָ
  choice: я дам тебе
  rationale: Когортативная форма выражает предложение или обещание в рамках насмешливого вызова; русское будущее время передаёт это естественно.
- source_word: אַלְפַּיִם סוּסִים
  choice: две тысячи коней
  rationale: Прямое соответствие числительному и существительному; «кони» уместно в военном контексте и современно понятно.
- source_word: אִם תּוּכַל
  choice: если ты сможешь
  rationale: Условие подчёркивает сомнение говорящего в способности адресата выполнить вызов.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: найти для них всадников
  rationale: Буквально — «дать себе всадников на них». «Найти для них всадников» естественно передаёт подразумеваемую неспособность Иудеи выставить достаточно людей для езды на предложенных конях.
