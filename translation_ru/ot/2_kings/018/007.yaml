base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: ru
  text: 'И Яхве был с ним: что бы он ни предпринимал, он преуспевал[a]. Он восстал против царя Ассирии и не служил ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально содержит образ «выхода»: «во всём, во что он выходил». Этот оборот может означать «во всём, что он предпринимал» или «везде, куда он отправлялся». Также возможно: «во всём, что он делал, он поступал благоразумно». Еврейский глагол соединяет оттенки благоразумного действия и успеха.'
    reason: Уточняет идиоматический характер выражений בְּכֹל אֲשֶׁר יֵצֵא и יַשְׂכִּיל, сохраняя их образность и смысловую неоднозначность без неестественной русской локативной конструкции.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וְהָיָה ... עִמּוֹ
  choice: был с ним
  rationale: Естественно передаёт еврейский оборот, обозначающий постоянное Божье присутствие и благоволение.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: что бы он ни предпринимал
  rationale: В данном царском повествовании буквальный образ выхода охватывает действия, начинания и, возможно, военные походы; выбранный вариант естественен по-русски и сохраняет широкий смысл.
- source_word: יַשְׂכִּיל
  choice: он преуспевал
  rationale: В породе hифиль глагол может означать как благоразумное действие, так и достигаемый благодаря ему успех; контекст подчёркивает благополучный исход, а неоднозначность отмечена в сноске.
- source_word: וַיִּמְרֹד
  choice: Он восстал
  rationale: Передаёт политический мятеж или отказ от подчинения имперскому владыке без излишне современного оттенка.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: против царя Ассирии
  rationale: Прямое и естественное соответствие еврейской конструкции.
- source_word: וְלֹא עֲבָדוֹ
  choice: и не служил ему
  rationale: Сохраняет основное значение глагола עבד; в политическом контексте речь идёт о прекращении вассальной службы и подчинения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; транслитерация «Яхве» сохраняет это отличие и соответствует наиболее принятой современной научной реконструкции произношения.
- issue: Связь Божьего присутствия с успехом царя
  choice: Сохранена последовательность утверждений без явного причинного союза
  alternative: «поэтому он преуспевал»
  rationale: Еврейский текст располагает эти мысли рядом, но не выражает причинность отдельным словом; перевод не должен усиливать её сверх оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис прост и понятен; политический смысл «служить» оставлен контексту, без внесения пояснения о дани в основной текст.
