base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: ru
  text: 'И пусть Езекия не побуждает вас полагаться на Яхве, говоря: «Яхве непременно спасёт нас, и этот город не будет отдан в руки царя Ассирии».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: И пусть ... не внушает вам надежду
  rationale: Каузативная форма глагола בטח означает, что Езекия побуждает народ полагаться на Яхве. Русское «внушает вам надежду» естественно передаёт это воздействие, не сводя фразу к простому «не надейтесь».
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: אֶל יְהוָה
  choice: на Яхве
  rationale: При глаголе בטח предлог אֶל выражает направленность доверия; по-русски это естественно передаётся конструкцией «надежда на».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לֵאמֹר
  choice: говоря
  rationale: Обычная формула введения прямой или цитируемой речи.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: непременно спасёт нас
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола выражает усиление; «непременно» ясно и естественно передаёт уверенное заверение.
- source_word: וְלֹא תִנָּתֵן
  choice: и ... не будет отдан
  rationale: Пассивная форма נתן в военном контексте означает передачу города под власть неприятеля.
- source_word: הָעִיר הַזֹּאת
  choice: этот город
  rationale: Прямая и естественная передача существительного с указательным местоимением.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохранена конкретная древнееврейская идиома власти и контроля, также понятная по-русски.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царя Ассирии
  rationale: Устоявшееся русское историко-библейское наименование.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Характер слов Езекии внутри речи рабсака
  choice: непременно спасёт нас
  alternative: точно избавит нас
  rationale: 'Сохранена эмфатическая уверенность исходной конструкции без оценки истинности слов: весь призыв передан как цитата в речи ассирийского посланника.'
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Тон сохраняет достоинство исторического повествования; синтаксис прямой, а военная идиома «отдан в руки» оставлена как естественная для русского библейского регистра.
