  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: ru
  text: Как же ты сможешь дать отпор[a] хотя бы одному из младших военачальников[b] моего господина, если полагаешься на Египет, ожидая от него колесниц и всадников?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отвратить лицо»; это еврейская идиома со значением «отразить» или «устоять перед кем-либо».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наместников», «правителей». Еврейское слово может обозначать областного правителя или военного начальника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: дать отпор
  rationale: Сочетание буквально означает «отвратить лицо», но в данном военном контексте это идиома со значением «отразить, дать отпор». Выбран естественный современный русский эквивалент, а буквальный образ сохранён в примечании.
- source_word: פַחַת
  choice: военачальников
  rationale: Слово может обозначать наместника, правителя или военного начальника. В контексте ассирийской военной угрозы «военачальник» ясно передаёт функцию лица, не сводя термин к конкретному воинскому званию.
- source_word: אַחַד
  choice: хотя бы одному
  rationale: В риторическом вопросе речь о неспособности противостоять даже одному такому начальнику; «хотя бы одному» естественно выражает эту усилительную силу.
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: из младших военачальников моего господина
  rationale: Прилагательное указывает на низший ранг или малую значимость, а не на физический размер. «Младших» сохраняет иерархический смысл. «Моего господина» относится к земному повелителю говорящего.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: если полагаешься на Египет
  rationale: Глагол בטח с предлогом על означает доверять кому-либо или рассчитывать на чью-либо поддержку. Условная связь естественно передаёт ход насмешливого риторического вопроса.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: ожидая от него колесниц и всадников
  rationale: Предложное сочетание обозначает военные средства, ради которых Иудея рассчитывает на Египет. Добавление «ожидая от него» делает эту связь ясной по-русски, не меняя содержания.
