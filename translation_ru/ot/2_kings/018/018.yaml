  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: ru
  text: Они позвали царя[a]. К ним вышел Элиаким, сын Хилкии, начальник царского дома[b]; с ним были Шевна, писец[c], и Иоах, сын Асафа, хранитель записей[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окликнули царя»; буквально: «к царю».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тот, кто над домом» — титул сановника, управлявшего царским домом или дворцом.'
    reason: cultural_note
  - marker: c
    text: 'Или: «секретарь».'
    reason: lexical_alternative
  - marker: d
    text: 'То есть царский чиновник, ведавший официальными записями и памятными делами; возможный перевод: «летописец».'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: Они позвали царя
  rationale: קרא с אֶל может означать обращение к кому-либо или требование его выхода. «Позвали царя» естественно передаёт дипломатический контекст, не усиливая действие до официального приказа.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: К ним вышли
  rationale: יצא означает «выйти»; русское «вышли к ним» не требует выбирать между английскими «came out» и «went out». Множественное число естественно охватывает перечисленных далее трёх сановников, хотя еврейский глагол стоит в единственном числе и формально согласован с первым названным лицом.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Элиаким, сын Хилкии
  rationale: Имена переданы в принятой русской библейской форме, патронимическая конструкция сохранена.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: начальник царского дома
  rationale: Это административный титул буквально «тот, кто над домом». «Царский дом» сохраняет образ בַּיִת и в данном контексте указывает на дворцовое управление, не сводя должность только к ведению домашнего хозяйства.
- source_word: הַסֹּפֵר
  choice: писец
  rationale: סֹפֵר обозначает официального писца или секретаря. «Писец» близко к форме оригинала и остаётся понятным названием придворной должности.
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: Иоах, сын Асафа
  rationale: Сохранены традиционная русская передача имён и патронимическая конструкция.
- source_word: הַמַּזְכִּיר
  choice: хранитель записей
  rationale: Название царского чиновника, связанного с официальными записями и напоминанием о государственных делах. Выражение передаёт функцию яснее архаичного «дееписатель» и не отождествляет должность с писцом.
