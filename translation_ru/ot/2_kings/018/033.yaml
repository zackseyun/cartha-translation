  text: הַ/הַצֵּ֥ל הִצִּ֛ילוּ אֱלֹהֵ֥י הַ/גּוֹיִ֖ם אִ֣ישׁ אֶת אַרְצ֑/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: ru
  text: Разве боги народов хоть когда-нибудь спасли[a] — каждый свою землю — из руки царя Ассирии?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь усилительная конструкция; буквально: «спасая, спасли ли…?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: хоть когда-нибудь спасли
  rationale: Сочетание абсолютного инфинитива с личной формой глагола נצל усиливает глагольную мысль. В риторическом вопросе оборот «хоть когда-нибудь спасли» естественно передаёт вызывающее отрицание и эмфазу.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: боги народов
  rationale: Форма אֱלֹהֵי — множественное число в сопряжённом состоянии, а הַגּוֹיִם означает народы. Прямой перевод сохраняет противопоставление местных божеств могуществу Ассирии.
- source_word: אִישׁ
  choice: каждый
  rationale: Здесь אִישׁ употреблено дистрибутивно и относится к богам народов, а не обозначает мужчину. Обособление тире делает эту связь ясной по-русски.
- source_word: אֶת אַרְצוֹ
  choice: свою землю
  rationale: Суффикс единственного числа после дистрибутивного אִישׁ указывает на землю, соответствующую каждому богу. Русское возвратное местоимение «свою» естественно выражает эту соотнесённость.
- source_word: מִיַּד
  choice: из руки
  rationale: Сохранён исходный образ руки как власти и господства; выражение понятно в высоком библейском контексте, хотя более динамический вариант — «из-под власти».
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царя Ассирии
  rationale: Прямой и традиционно понятный перевод еврейского сопряжённого сочетания.
