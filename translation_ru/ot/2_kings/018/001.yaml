base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: ru
  text: В третий год Осии, сына Илы, царя Израиля, Езекия, сын Ахаза, воцарился[a] в Иудее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «начал царствовать». В этой формуле еврейский глагол указывает на вступление Езекии на престол.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: не выражено отдельным словом
  rationale: Здесь форма служит повествовательным переходом. В современном русском отдельное «и было» звучало бы архаично и не добавляло бы смысла.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: в третий год
  rationale: Естественная русская передача стандартной формулы датировки по годам правления.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: Осии, сына Илы
  rationale: Предлог לְ указывает, чьё царствование служит точкой отсчёта; имена переданы в традиционной русской библейской форме.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Сохраняет должность и царство Осии, естественно присоединяясь как приложение.
- source_word: מָלַךְ
  choice: воцарился
  rationale: В данной царской формуле глагол обозначает вступление на престол, а не продолжительность правления. «Воцарился» точно и кратко передаёт это значение.
- source_word: חִזְקִיָּה בֶן אָחָז
  choice: Езекия, сын Ахаза
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён; синтаксис родства сохранён.
- source_word: מֶלֶךְ יְהוּדָה
  choice: воцарился в Иудее
  rationale: В контексте формулы вступления на престол еврейское сочетание естественно передаётся по-русски как указание на царство, где Езекия стал править.
