  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: ru
  text: Ему было двадцать пять лет, когда он стал царём, и двадцать девять лет он царствовал в Иерусалиме. Его мать звали Ави; она была дочерью Захарии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: Ему было двадцать пять лет
  rationale: Стандартный древнееврейский оборот для обозначения возраста передан естественным современным русским выражением.
- source_word: הָיָה בְמָלְכוֹ
  choice: когда он стал царём
  rationale: Формула указывает на возраст при вступлении на престол; этот вариант естественен по-русски и точно передаёт временной смысл.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол обозначает осуществление царской власти; «царствовал» точно и уместно для исторического повествования.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Прямое обозначение места царствования.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная современная русская передача древнееврейской именной формулы.
- source_word: אֲבִי
  choice: Ави
  rationale: Имя транслитерировано непосредственно с древнееврейского; буква ב без дагеша передаёт согласный «в».
- source_word: בַּת זְכַרְיָה
  choice: она была дочерью Захарии
  rationale: Конструкция прямо обозначает родство; отдельная клауза устраняет возможную для русского языка двусмысленность приложения.
