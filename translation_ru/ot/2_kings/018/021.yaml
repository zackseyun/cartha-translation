  text: עַתָּ֡ה הִנֵּ֣ה בָטַ֣חְתָּ לְּ/ךָ֡ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: ru
  text: 'Вот, ты полагаешься на Египет — на этот посох из надломленной трости[a]: если человек обопрётся на него[b], тот вонзится ему в ладонь и пронзит её. Таков фараон, царь Египта, для всех, кто полагается на него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этот посох из раздавленной трости». Еврейское слово может означать нечто раздавленное, повреждённое или сломанное; здесь речь идёт об опоре, которая расщепляется и ранит руку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на которого обопрётся человек». Единственное число имеет здесь обобщающий смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ
  choice: ты полагаешься
  rationale: Глагол בטח обозначает доверие и опору на кого-либо. Перфект в контексте насмешливого обвинения естественно передаётся русским настоящим временем.
- source_word: מִשְׁעֶנֶת
  choice: вместо посоха
  rationale: Существительное обозначает предмет, на который опираются. Оборот передаёт образ трости, используемой как посох, и не создаёт неестественного сочетания «трость посоха».
- source_word: הַקָּנֶה הָרָצוּץ
  choice: эту надломленную трость
  rationale: רצוץ может значить раздавленный, повреждённый или сломанный. «Надломленная» сохраняет образ ненадёжной опоры, способной расщепиться и поранить руку; альтернативное значение отмечено в сноске.
- source_word: עַל מִצְרַיִם
  choice: на Египет
  rationale: После «полагаться» русский предлог «на» естественно передаёт объект доверия и сохраняет повтор предлога в метафорическом пояснении.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: если человек обопрётся на неё
  rationale: Нифаль סמך означает опереться ради поддержки. Условный смысл относительной конструкции выражен явно; אִישׁ передан обобщённым единственным числом.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: она вонзится ему в ладонь и пронзит её
  rationale: כף здесь конкретно обозначает ладонь, а נקב — проколоть или пронзить. Добавленное подлежащее «она» естественно проясняет в русском образ трости, проникающей в ладонь.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Таков фараон, царь Египта
  rationale: כֵּן вводит применение сравнения. «Таков» кратко и естественно связывает образ ненадёжной трости с фараоном.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: для всех, кто полагается на него
  rationale: 'Предлог ל выражает отношение: именно таким фараон оказывается для доверяющих ему. Причастие передано обобщающим придаточным.'
