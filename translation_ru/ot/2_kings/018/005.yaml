  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: ru
  text: Он уповал на Яхве, Бога Израиля. После него среди всех царей Иудеи не было равного ему, как и среди тех, кто был до него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: Предлог ב при глаголе בטח обозначает того, на кого полагаются; по-русски естественно «уповать на». Имя יהוה передано как «Яхве».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Сопряжённая конструкция прямо определяет Яхве как Бога Израиля; в русском это приложение.
- source_word: בָּטָח
  choice: уповал
  rationale: Qal perfect от בטח означает «доверять, полагаться». «Уповал» сохраняет религиозный контекст, оставаясь понятным в современном литературном русском.
- source_word: וְאַחֲרָיו לֹא הָיָה כָמֹהוּ
  choice: Не было подобного ему… после него
  rationale: Сохраняется временное значение «после него» и идиоматическое утверждение об отсутствии равного.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: среди всех царей Иудеи
  rationale: Предлог ב обозначает сравнение внутри группы и естественно передаётся словом «среди».
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: ни прежде него
  rationale: Относительная конструкция буквально относится к тем, кто был перед ним; сжатое «ни прежде него» естественно продолжает сравнение и сохраняет охват предшествующих царей.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие и соответствует предоставленному решению консультационного слоя.
- issue: Объём сравнения Езекии с царями Иудеи
  choice: ни после него, ни прежде него
  alternative: после него не было подобного ему… и среди бывших прежде него
  rationale: Формулировка сохраняет обе временные стороны сравнения, не превращая утверждение в абсолютное сравнение со всеми людьми или с царями Израильского царства.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским глаголом «уповал». Порядок второй фразы слегка перестроен ради ясности и естественного параллелизма; смысл и напряжение еврейского утверждения сохранены.
