  source_fidelity: 'Первая фраза точно передаёт בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל בָּטָח: доверие направлено к Яхве, названному Богом Израиля. Во второй фразе черновик в целом охватывает как последующих, так и предшествующих царей, но «ни после него, ни прежде него» превращает исходное сопоставление с царями в чисто временную формулу. Уточнённая редакция сохраняет относительное «тех, кто был до него» и порядок аргумента: после него не было равного среди царей Иудеи, как и среди предшественников.'
