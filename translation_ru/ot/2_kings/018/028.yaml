base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: ru
  text: 'Тогда рабсак встал и громко воззвал по-иудейски[a]: «Слушайте слово великого царя, царя Ассирии!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по-еврейски». Еврейское слово точнее обозначает язык Иудеи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Обычное повествовательное значение עמד; естественно передаёт переход к публичному выступлению без дополнительного толкования.
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Исторический ассирийский титул передан традиционной русской транслитерацией; это не превращает спорное точное содержание должности в часть основного текста.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: громко воззвал
  rationale: Передаёт публичный громкий призыв и сохраняет возвышенный, официальный оттенок речи.
- source_word: יְהוּדִית
  choice: по-иудейски
  rationale: Термин обозначает именно язык Иудеи; вариант точнее исторически, чем более широкое привычное «по-еврейски».
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: Он обратился к народу и сказал
  rationale: Сохраняет оба глагола речи, но по-русски устраняет тяжеловесное буквальное «говорил и сказал»; адресат естественно подразумевается сценой публичного обращения.
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Прямое повеление во множественном числе; в современном русском естественнее формального буквального «услышьте».
- source_word: דְּבַר
  choice: слово
  rationale: Сохраняет официальный и библейский характер царского провозглашения, не сводя его лишь к информации или сообщению.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: великого царя
  rationale: Прямая передача ассирийского царского титула без ослабления или усиления.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царя Ассирии
  rationale: Естественная русская передача еврейской сопряжённой конструкции.
