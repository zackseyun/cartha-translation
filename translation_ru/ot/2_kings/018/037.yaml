base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: ru
  text: Тогда к Езекии пришли Елиаким, сын Хелкии, управляющий дворцом, Шевна, писец, и Иоах, сын Асафа, летописец, в разорванных одеждах и передали ему слова рабсака[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рабсак — ассирийский должностной титул; возможно, он обозначал высокопоставленного чиновника, например главного виночерпия или представителя царя.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Тогда ... пришли
  rationale: Повествовательный союз передан словом «тогда». Хотя еврейский глагол стоит в единственном числе перед составным подлежащим, по нормам русского языка при перечислении трёх лиц употреблено множественное число.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: управляющий дворцом
  rationale: Оборот обозначает придворную должность главы царского дома или дворцового управления; этот вариант естественно передаёт административный смысл.
- source_word: הַסֹּפֵר
  choice: писец
  rationale: Слово обозначает придворного писца или секретаря. «Писец» сохраняет конкретный исторический титул и понятно в данном контексте.
- source_word: הַמַּזְכִּיר
  choice: летописец
  rationale: Это титул придворного должностного лица, отвечавшего за записи или памятные дела; «летописец» передаёт его официальную функцию, не прибегая к архаичному «дееписатель».
- source_word: קְרוּעֵי בְגָדִים
  choice: в разодранных одеждах
  rationale: Сохранён конкретный образ разорванной одежды как знака скорби, потрясения или унижения.
- source_word: וַיַּגִּדוּ לוֹ
  choice: и передали ему
  rationale: В контексте официального возвращения посланников глагол естественно означает сообщение или передачу услышанного.
- source_word: דִּבְרֵי
  choice: слова
  rationale: Буквальное и естественное обозначение речи, которую посланники пересказывают царю.
- source_word: רַב שָׁקֵה
  choice: рабсака
  rationale: Сохранено традиционное русское обозначение ассирийского должностного титула; его точное содержание не сужается в основном тексте и поясняется в сноске.
