base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: ru
  text: потому что они не слушали голоса Яхве, своего Бога[a], а преступили Его завет[b] — всё, что заповедал Моисей, слуга Яхве; они не слушали[c] и не исполняли этого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повиновались Яхве, своему Богу». Древнееврейское выражение «слушать голос» часто подразумевает послушание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нарушили Его завет».'
    reason: lexical_alternative
  - marker: c
    text: Повтор слов «не слушали» подчёркивает упорный отказ повиноваться, а не единичный проступок.
    reason: literary_note
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: потому что
  rationale: Оборот вводит причину падения и изгнания, описанных в предыдущем стихе; русский причинный союз естественно передаёт эту связь.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: слушали голоса
  rationale: Сохранён конкретный древнееврейский оборот, который включает не только слушание, но и послушание; этот оттенок пояснён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены его титулом.
- source_word: וַיַּעַבְרוּ אֶת־בְּרִיתוֹ
  choice: преступили Его завет
  rationale: В контексте завета глагол עבר означает нарушение установленных границ или обязательств; «преступили» сохраняет образ и нравственно-правовой смысл.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: всё, что заповедал
  rationale: Передан полный объём заповеданного; тире показывает пояснительное отношение к предшествующему упоминанию завета, не превращая его в отдельное предложение.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Моисей, слуга Яхве
  rationale: «Слуга» передаёт почётное служебное обозначение עֶבֶד в данном контексте и звучит понятно в современном русском языке.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: Они не слушали и не исполняли
  rationale: Повтор «не слушали» сохранён, а עשׂה передано как исполнение заповеданного, что естественно по-русски в данном контексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение שׁמע в обороте שׁמע בקול
  choice: слушать голоса
  alternative: повиноваться
  rationale: Буквальный образ сохранён вместе с заложенным в нём смыслом послушания; перевод не сводит многозначный оборот только к одному отвлечённому понятию.
- issue: Связь «завета» со «всем, что заповедал Моисей»
  choice: пояснительная конструкция с тире
  alternative: нарушили завет и всё, что заповедал Моисей
  rationale: Конструкция допускает понимание заповеданного Моисеем как содержания или обязательств завета. Тире сохраняет эту связь, не добавляя отсутствующий в тексте союз.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены личное имя «Яхве», конкретный образ «слушать голоса» и риторический повтор; синтаксис слегка упорядочен для ясности без устранения смысловой напряжённости оригинала.
