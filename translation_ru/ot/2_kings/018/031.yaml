  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר מֶ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵֽנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵֽי בוֹרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: ru
  text: 'Не слушайте Езекию, ибо так говорит царь Ассирии: «Заключите со мной мир[a] и выйдите ко мне; пусть каждый ест плоды со своей виноградной лозы и со своей смоковницы и пьёт воду из своей цистерны,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделайте со мной благословение» — необычное выражение, означающее заключение мира или принятие предложенных условий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: слушайте
  rationale: Сочетание שׁמע с אֶל означает «слушать, внимать». В контексте также подразумевается повиновение, но перевод «слушайте» не устраняет эту смысловую напряжённость.
- source_word: חִזְקִיָּהוּ
  choice: Езекию
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: כִּי כֹה אָמַר
  choice: потому что так говорит
  rationale: Естественная русская передача формулы введения прямой речи, близкая к форме еврейского текста.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Прямая передача еврейского сопряжённого сочетания.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Заключите со мной мир
  rationale: Контекстуальная передача необычного политического выражения, буквально содержащего слово «благословение». Буквальная форма отмечена в сноске.
- source_word: וּצְאוּ אֵלַי
  choice: и выйдите ко мне
  rationale: Сохранено конкретное значение глагола «выйти»; в условиях осады эти слова подразумевают сдачу, но перевод не делает этот вывод явным.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: Тогда каждый будет есть плоды своей виноградной лозы и своей смоковницы
  rationale: Дистрибутивное אִישׁ передано словом «каждый». Добавление «плоды» естественно выражает подразумеваемый объект русского глагола «есть» при названиях деревьев и лозы; будущее время передаёт обещанный результат выхода.
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: и пить воду из своей цистерны
  rationale: בּוֹר здесь обозначает сооружение для сбора и хранения воды, поэтому «цистерна» точнее, чем «колодец».
theological_decisions:
- issue: Дистрибутивное употребление אִישׁ
  choice: каждый
  alternative: каждый мужчина; всякий
  rationale: В данном перечислении אִישׁ имеет обобщённо-дистрибутивную функцию. «Каждый» естественно передаёт её по-русски, не добавляя утверждения, будто обещание относится исключительно к взрослым мужчинам.
- issue: Политическое выражение עֲשׂוּ אִתִּי בְרָכָה
  choice: Заключите со мной мир
  alternative: Сделайте со мной благословение; договоритесь со мной
  rationale: В речи ассирийского посланника выражение обозначает принятие предложенных условий или мирное соглашение. Основной текст передаёт смысл по контексту, а необычная буквальная форма сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной царской речи. Сохранена пропагандистская форма обещания и конкретное «выйдите ко мне», не заменённое истолковывающим «сдайтесь». Кавычки открывают прямую речь, которая продолжается в следующем стихе; конечная запятая отражает незавершённость предложения.
