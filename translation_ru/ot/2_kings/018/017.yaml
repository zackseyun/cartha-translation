  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: ru
  text: Царь Ассирии послал из Лахиша к царю Езекии в Иерусалим тартана, рабсариса и рабсака[a] с большим войском[b]. Они поднялись и пришли к Иерусалиму; поднялись, пришли и остановились у водовода верхнего пруда, что у дороги поля мойщика тканей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Тартан», «рабсарис» и «рабсак», вероятно, не личные имена, а ассирийские должностные титулы. Возможные значения: «главнокомандующий», «главный придворный (или евнух)» и «главный виночерпий» либо иной высокопоставленный чиновник.'
    reason: cultural_note
  - marker: b
    text: 'Или: «с крупными военными силами».'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «поле сукновала». Речь идёт о человеке, который стирал, отбеливал и обрабатывал ткань.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן וְאֶת רַב סָרִיס וְאֶת רַב שָׁקֵה
  choice: тартана, рабсариса и рабсака
  rationale: 'Сохранены традиционные транслитерации ассирийских должностных титулов: их точные служебные функции не вполне ясны, поэтому функциональный перевод в основном тексте был бы чрезмерно определённым.'
- source_word: בְּחֵיל כָּבֵד
  choice: с большим войском
  rationale: חַיִל в данном контексте означает военную силу или войско, а כָּבֵד указывает на его значительность. Это естественнее по-русски, чем буквальное «с тяжёлой силой».
- source_word: וַיַּעֲלוּ וַיָּבֹאוּ ... וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: Они поднялись и пришли...; поднялись, пришли и остановились
  rationale: Сохранены повтор и последовательность повествовательных глаголов оригинала; «поднялись» также передаёт обычное обозначение восхождения к Иерусалиму.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: водовода верхнего пруда
  rationale: תְעָלָה обозначает канал или водовод, а בְּרֵכָה — пруд либо водоём. Выбран ясный современный топографический оборот.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: дороги к полю мойщика тканей
  rationale: מְסִלָּה — устроенная дорога, а כּוֹבֵס — человек, стиравший и отбеливавший ткань. Формулировка понятна современному читателю и не использует малоизвестное слово «сукновал» в основном тексте.
