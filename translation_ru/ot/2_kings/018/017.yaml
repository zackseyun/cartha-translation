  - severity: low
    issue: Сноска чрезмерно конкретизирует альтернативную функцию рабсака
    rationale: Фраза «иной высокопоставленный военачальник» сужает неопределённый титул до военной должности. «Высокопоставленный чиновник» точнее сохраняет осторожность примечания.
  - severity: low
