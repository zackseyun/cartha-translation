base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: ru
  text: В четырнадцатый год царствования Езекии Сеннахирим, царь Ассирии, выступил против всех укреплённых городов Иудеи и захватил их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: В четырнадцатый год
  rationale: Начальное ו продолжает повествование, но в современном русском не требует отдельного «и»; временная формула передана естественно и без добавления слова «теперь».
- source_word: לַמֶּלֶךְ חִזְקִיָּה
  choice: царствования Езекии
  rationale: В контексте датировки по годам правления русская формула «год царствования» ясно и естественно передаёт регнальную конструкцию.
- source_word: עָלָה ... עַל
  choice: выступил против
  rationale: В военном контексте сочетание означает поход или наступление против кого-либо; «выступил против» сохраняет военный смысл без неестественного буквального «поднялся».
- source_word: סַנְחֵרִיב
  choice: Сеннахирим
  rationale: Устоявшаяся русская библейская форма имени ассирийского царя.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Точно передаёт титул и государство; приложение выделено запятыми по нормам русского языка.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: против всех укреплённых городов Иудеи
  rationale: «Укреплённые города» — ясный и общепринятый русский эквивалент для городов с оборонительными сооружениями.
- source_word: וַיִּתְפְּשֵׂם
  choice: и захватил их
  rationale: Глагол обозначает овладение городами в ходе военной кампании; местоимение «их» сохраняет прямую отсылку к городам.
