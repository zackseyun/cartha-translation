base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: ru
  text: 'Так говорит царь: «Не позволяйте Езекии обманывать вас[a], потому что он не сможет избавить вас от его руки[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вводить вас в заблуждение».'
    reason: lexical_alternative
  - marker: b
    text: «От его руки» — выражение, означающее «из-под его власти». В еврейском тексте здесь стоит «его руки»; в параллельном месте, Ис 36:14, — «моей руки».
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная для современного русского языка формула официального провозглашения, сохраняющая торжественный характер еврейского оборота.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Передаёт определённое существительное без добавления имени; в контексте имеется в виду ассирийский царь.
- source_word: אַל יַשִּׁיא לָכֶם
  choice: Пусть … не обманывает вас
  rationale: Глагол נשׁא в данной форме означает вводить в заблуждение, обманывать; конструкция с «пусть не» естественно передаёт отрицательное волеизъявление третьего лица.
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит основание предшествующего предостережения.
- source_word: לֹא יוּכַל
  choice: не сможет
  rationale: Передаёт выраженную имперфектом неспособность в перспективе ожидаемого противостояния.
- source_word: לְהַצִּיל
  choice: избавить
  rationale: Соответствует значению спасения или освобождения от вражеской власти и естественно звучит в военно-политическом контексте.
- source_word: מִיָּדוֹ
  choice: от его руки
  rationale: Сохраняет буквальный и понятный библейский образ власти; местоименный суффикс в WLC имеет третье лицо единственного числа.
theological_decisions:
- issue: К кому относится «его» в מִיָּדוֹ
  choice: Сохранено «от его руки», по чтению WLC; ближайший названный носитель власти — царь.
  alternative: «От моей руки», как в параллельном месте Ис 36:14; либо смысловая передача «из-под его власти».
  rationale: Перевод следует предоставленному еврейскому тексту и не согласует его молча с параллельным местом. Сноска сообщает о варианте и поясняет идиому.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием царского провозглашения. Кавычки обозначают прямую речь; идиома «рука» сохранена, но разъяснена в сноске.
