base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: ru
  text: По истечении трёх лет они захватили её. В шестой год царствования Езекии, то есть в девятый год царствования Осии, царя Израиля, Самария была захвачена.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: они захватили её
  rationale: Форма qal, 3-е лицо множественного числа, с суффиксом женского рода передана активной конструкцией; местоимение относится к Самарии из предыдущего контекста.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: через три года
  rationale: Еврейское временное выражение указывает на завершение трёхлетнего срока; естественное современное русское соответствие — «через три года», а буквальный оттенок отмечен в сноске.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: в шестой год царствования Езекии
  rationale: Стандартная формула датировки по году правления; добавление «царствования» делает смысл естественным и ясным по-русски.
- source_word: הִיא
  choice: то есть
  rationale: Местоимение связывает две синхронные датировки; «то есть» ясно передаёт пояснительно-отождествляющую функцию.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: в девятый год царствования Осии, царя Израиля
  rationale: Сохранена вторая датировка по году правления и явно передан титул царя Израиля.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: Самария была захвачена
  rationale: Пассивная форма nifal передана русской пассивной конструкцией; повтор корня לכד сохранён повтором глагола «захватить».
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Традиционная русская форма названия города; грамматически соответствует женскому роду обеих глагольных форм.
