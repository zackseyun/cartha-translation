  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּתֵּן֙ חִזְקִיָּ֔ה אֶת כָּל הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בֵית יְהוָ֑ה וּ/בְ/אֹצְר֖וֹת בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: ru
  text: И отдал Езекия всё серебро[a], какое нашлось в доме Яхве[b] и в сокровищницах царского дома[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все деньги»; буквально: «всё серебро».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в храме Яхве»; буквально: «в доме Яхве».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в царском дворце»; буквально: «в доме царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Глагол נתן означает «дать, передать». В контексте выплаты дани «отдал» естественно передаёт передачу ценностей, не уточняя сверх текста форму сделки.
- source_word: חִזְקִיָּה
  choice: Езекия
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: כָּל הַכֶּסֶף
  choice: всё серебро
  rationale: Сохраняет всеохватность כָּל и прямое значение כֶּסֶף — «серебро», не исключая его употребления как платёжного средства.
- source_word: הַנִּמְצָא
  choice: какое нашлось
  rationale: Передаёт пассивно-результативное значение нифаля от מצא — то, что было найдено или имелось налицо.
- source_word: בֵית יְהוָה
  choice: доме Яхве
  rationale: Буквально передаёт выражение «дом Яхве»; по контексту речь идёт о храме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: וּבְאֹצְרוֹת
  choice: и в сокровищницах
  rationale: Во множественном числе אֹצָרוֹת обозначает места хранения ценностей; «сокровищницы» соответствует финансовому контексту.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царского дома
  rationale: Сохраняет буквальный образ «дома царя» и параллелизм с «домом Яхве»; контекстуально имеется в виду дворец.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; форма «Яхве» сохраняет его как имя, тогда как «Господь» представляет традиционную замену титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Буквенные маркеры сносок поставлены непосредственно после соответствующих выражений. Синтаксический параллелизм «дом Яхве — царский дом» сохранён.
