  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: ru
  text: 'пока я не приду и не заберу вас в страну, подобную вашей: страну зерна и молодого вина[a], страну хлеба и виноградников, страну оливкового масла и мёда[b], чтобы вы жили, а не умирали. Не слушайте Езекию, ведь он вводит вас в заблуждение, говоря: «Яхве избавит нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вина». Еврейское תִּירוֹשׁ обычно обозначает молодое, свежее вино.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение сжато; буквально оно включает слова «маслина» и «масло». Возможно также: «оливковых деревьев, масла и мёда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: пока я не приду
  rationale: Передаёт будущий момент, до которого слушатели должны следовать призыву; «приду» естественно и прямо соответствует בוא.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: и не заберу вас
  rationale: לקח означает «взять»; в контексте насильственного переселения «заберу вас» ясно передаёт удаление с родины, не добавляя излишних деталей.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: в страну, подобную вашей
  rationale: Предлог כְּ выражает сравнение. Формулировка сохраняет пропагандистское обещание земли, похожей на Иудею.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: страну зерна и молодого вина
  rationale: דָּגָן обозначает зерновые вообще, а תִּירוֹשׁ — свежее, молодое вино; конкретный оттенок второго слова сохранён.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: страну хлеба и виноградников
  rationale: Сохраняются прямые значения לֶחֶם и כְּרָמִים и риторический образ сельскохозяйственного изобилия.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: страну оливкового масла и мёда
  rationale: Сжатое еврейское сочетание זֵית יִצְהָר связано с плодами маслины и производимым из них маслом. Естественная русская формулировка передаёт вероятный смысл, а неоднозначность отмечена в сноске.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: Тогда вы будете жить, а не умрёте
  rationale: Последовательность выражает обещанный результат принятия предложения. Русская фраза сохраняет резкое противопоставление жизни и смерти.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: Не слушайте Езекию
  rationale: שׁמע אל здесь значит прислушиваться, внимать; «не слушайте» — прямой и естественный эквивалент.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: ведь он вводит вас в заблуждение
  rationale: Каузативная форма סות может означать склонять, подстрекать или вводить в заблуждение. Выбранная формулировка подходит обвинительной риторике и не усиливает её до прямого утверждения о сознательном обмане.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: יַצִּילֵנוּ
  choice: избавит нас
  rationale: Каузативная форма נצל означает спасти или избавить от опасности; «избавит» уместно в военном контексте осады.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и является принятой современной научной транслитерацией, не подменяя его титулом.
- issue: Характер обвинения Езекии в כִּי יַסִּית אֶתְכֶם
  choice: вводит вас в заблуждение
  alternative: обманывает вас; склоняет вас
  rationale: Глагол допускает несколько оттенков — побуждение, совращение, введение в заблуждение. Выбор сохраняет обвинительный смысл речи Рабсака, не утверждая от лица повествователя, что Езекия действительно обманывает народ.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой политико-военной речи. Повтор «страну» сохранён как элемент убеждающей риторики. Имя חִזְקִיָּהוּ передано традиционной русской библейской формой «Езекия».
