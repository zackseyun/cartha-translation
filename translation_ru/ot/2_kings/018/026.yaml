base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: ru
  text: 'Тогда Елиаким, сын Хелкии, Севна и Иоах сказали рабсаку: «Пожалуйста, обращайся к твоим слугам по-арамейски, потому что мы его понимаем. Не говори с нами по-иудейски[a] так, чтобы слышал народ, который на стене».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по-еврейски». Еврейское слово יְהוּדִית буквально означает «по-иудейски» и обозначает язык Иудеи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: рабсаку
  rationale: Сохранён традиционный титул «рабсак», поскольку точное содержание ассирийской должности остаётся не вполне ясным; перевод вроде «главный виночерпий» мог бы создать ложную определённость.
- source_word: דַּבֶּר נָא
  choice: Говори, пожалуйста
  rationale: Частица נָא при повелительной форме передаёт вежливую просьбу; русский порядок слов сохраняет и просьбу, и dignified дипломатический тон.
- source_word: עֲבָדֶיךָ
  choice: с твоими слугами
  rationale: В дипломатической речи это формула почтительного самоуничижения говорящих, а не указание на рабский статус в узком смысле.
- source_word: אֲרָמִית
  choice: по-арамейски
  rationale: Форма обозначает язык речи; наречное выражение естественно для современного русского языка.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: потому что мы его понимаем
  rationale: В контексте выбора языка שׁמע означает способность понимать сказанное, а местоимение «его» ясно отсылает к арамейскому языку.
- source_word: יְהוּדִית
  choice: по-иудейски
  rationale: Передано буквальное обозначение языка Иудеи без его безоговорочного отождествления с более широким техническим термином «древнееврейский».
- source_word: בְּאָזְנֵי
  choice: так, чтобы слышал
  rationale: Естественная русская передача идиомы «в ушах», сохраняющая её смысловой акцент на слышимости речи.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: народ, который находится на стене
  rationale: Сохранено общее «народ», без неоправданного сужения до воинов или стражи, и явно передано местонахождение слушателей.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Тогда ... сказали
  rationale: Последовательная повествовательная форма естественно передана словом «тогда»; множественное сказуемое согласовано с составным подлежащим.
