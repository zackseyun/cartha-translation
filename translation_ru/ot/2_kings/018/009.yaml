  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: ru
  text: И случилось, что в четвёртый год царя Езекии — это был седьмой год Осии, сына Илы, царя Израиля, — Салманасар, царь Ассирии, выступил против Самарии и осадил её.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Обычная древнееврейская повествовательная формула, вводящая историческое событие. «И было» сохраняет её функцию и библейское достоинство, оставаясь понятным современному читателю.
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: в четвёртый год царя Езекии
  rationale: Естественная русская передача формулы датировки по году царствования.
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ בֶּן־אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: это был седьмой год Осии, сына Илы, царя Израиля
  rationale: Местоимение הִיא связывает две синхронные датировки. Тире ясно выделяет пояснение, не меняя его смысла.
- source_word: עָלָה ... עַל־שֹׁמְרוֹן
  choice: выступил против Самарии
  rationale: В военном контексте עָלָה обозначает поход или выступление против цели; этот вариант естественно передаёт направленное враждебное действие без излишнего уточнения способа передвижения.
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: Салманасар, царь Ассирии
  rationale: Использована устоявшаяся русская форма имени и буквально передан титул с владением.
- source_word: וַיָּצַר עָלֶיהָ
  choice: и осадил её
  rationale: Глагол צור в данном контексте означает осаду укреплённого города; краткая формулировка точна и естественна по-русски.
