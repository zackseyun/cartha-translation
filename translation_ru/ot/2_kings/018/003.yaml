  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: ru
  text: Он поступал правильно в глазах Яхве, как и во всём, что делал Давид, его отец.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Давид, его отец». Здесь «отец» означает предка в династии Давида, а не непосредственного родителя Езекии.'
    reason: Культурно-языковое пояснение древнееврейского употребления слова «отец» в династической формуле.
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Он делал то, что было правильным
  rationale: Глагольная форма вводит повествовательную оценку царствования, а субстантивированное הַיָּשָׁר означает «правильное, угодное». Несовершенный вид «делал» естественно передаёт общую характеристику поведения.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён прозрачный древнееврейский образ оценки с точки зрения Бога; личное имя יהוה передано как «Яхве».
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: во всём следуя примеру
  rationale: Оборот выражает полное соответствие образцу. Такая русская формулировка естественно передаёт смысл сравнения, не предполагая буквального тождества каждого поступка.
- source_word: דָּוִד אָבִיו
  choice: своего предка Давида
  rationale: Здесь אָב обозначает династического предка, поскольку непосредственным отцом Езекии был Ахаз. «Предок» устраняет фактическую двусмысленность, сохраняя указание на линию Давида.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Давид как «отец» царя
  choice: предок Давид
  alternative: отец Давид
  rationale: Древнееврейское אָב может обозначать предка. Здесь речь о династической связи и нравственном образце, а не о непосредственном отцовстве.
- issue: Степень соответствия примеру Давида
  choice: во всём следуя примеру
  alternative: сделал всё, что сделал Давид
  rationale: כְּכֹל אֲשֶׁר описывает соответствие Давиду как установленному образцу царя. Формулировка сохраняет всеохватность оценки, не превращая её в утверждение о буквальном повторении каждого действия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён образ «в глазах Яхве»; более буквальная династическая формула вынесена в примечание. Маркер примечания расположен в основном тексте.
