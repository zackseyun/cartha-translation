  text: וַ/יִּדְבַּק֙ בַּֽ/יהוָ֔ה לֹא סָ֖ר מֵ/אַֽחֲרָ֑י/ו וַ/יִּשְׁמֹר֙ מִצְוֺתָ֔י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: ru
  text: Он крепко держался Яхве и не отступал от Него[a]; он соблюдал Его заповеди, которые Яхве заповедал Моисею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отступал от следования за Ним».'
    reason: Сноска сохраняет конкретный древнееврейский образ следования, тогда как основной текст использует более естественную русскую формулировку.
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: крепко держался
  rationale: Глагол דבק выражает тесную приверженность и верность; сочетание «крепко держался» естественно по-русски и сохраняет силу образа.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог ב при דבק обозначает того, к кому человек остаётся привержен; тетраграмматон передан как личное имя «Яхве».
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: не отступал от Него
  rationale: Оборот буквально описывает неуклонное следование за Богом; «не отступал от Него» кратко и естественно передаёт верность, не устраняя образ следования, пояснённый в сноске.
- source_word: וַיִּשְׁמֹר
  choice: соблюдал
  rationale: В сочетании с заповедями שׁמר означает исполнять и соблюдать их.
- source_word: מִצְוֺתָיו
  choice: Его заповеди
  rationale: מִצְוֹת обозначает данные Богом повеления и уместно передаётся традиционным, понятным словом «заповеди».
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: которые Яхве дал Моисею
  rationale: Русское «дал заповеди Моисею» естественно выражает смысл глагола צוה в данном контексте и ясно указывает на их источник и посредника.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное заветное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Характер приверженности Езекии
  choice: крепко держался Яхве
  alternative: прилепился к Яхве
  rationale: Перевод сохраняет выраженную глаголом דבק сильную личную и заветную верность, не сводя её ни к физическому действию, ни к отвлечённому послушанию.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис прост и понятен; ключевые заветные термины сохранены без конфессиональных добавлений.
