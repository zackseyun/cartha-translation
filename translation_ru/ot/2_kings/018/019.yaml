  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: ru
  text: 'И рабсак сказал им: «Передайте, пожалуйста, Езекии: „Так говорит великий царь, царь Ассирии: что это за уверенность, на которую ты полагаешься?“»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Передача традиционного титула ассирийского сановника; имя собственное здесь менее вероятно.
- source_word: אִמְרוּ נָא
  choice: передайте, пожалуйста
  rationale: Сохраняет вежливую частицу נָא и естественно передаёт поручение сообщить слова Езекии.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: великий царь
  rationale: Формально и естественно передаёт царский титул.
- source_word: מָה הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: что это за уверенность, на которую ты полагаешься?
  rationale: Сохраняет риторический вопрос и общий корень существительного и глагола настолько, насколько это естественно по-русски; перфект допускает актуально-результативное понимание.
