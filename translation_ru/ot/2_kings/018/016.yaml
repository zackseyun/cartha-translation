revisions:
- from: В то время Езекия срезал двери храма Яхве и дверные косяки[a], которые сам Езекия, царь Иудеи, покрыл металлом, и отдал их царю Ассирии.
  to: В то время Езекия срезал двери храма Яхве, а также дверные косяки[a], которые Езекия, царь Иудеи, покрыл, и отдал их царю Ассирии.
  rationale: Правка ограничивает относительное предложение «которые Езекия… покрыл» дверными косяками, как в синтаксисе оригинала, и убирает невыраженное в стихе указание на металл. Сноска сохранена без изменений, поскольку она корректно отмечает спорность значения редкого архитектурного термина.
  reviewer_model: gpt-5.6-terra
