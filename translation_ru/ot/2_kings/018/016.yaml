  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: ru
  text: В то время Езекия срезал двери храма Яхве, а также дверные косяки[a], которые Езекия, царь Иудеи, покрыл, и отдал их царю Ассирии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дверные рамы» либо «опоры». Древнееврейское слово встречается редко и может шире обозначать несущие элементы при храмовых дверях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Естественная для современного русского языка передача обычного древнееврейского временного оборота.
- source_word: קִצַּץ
  choice: срезал
  rationale: Глагол обозначает отсечение или срезание; перевод сохраняет конкретность действия и не сводит его лишь к снятию покрытия.
- source_word: דַּלְתוֹת הֵיכַל יְהוָה
  choice: двери храма Яхве
  rationale: הֵיכָל здесь по контексту означает Иерусалимский храм, а יְהוָה передано личным именем «Яхве».
- source_word: הָאֹמְנוֹת
  choice: дверные косяки
  rationale: Редкое слово обозначает связанные с дверями архитектурные элементы; «дверные косяки» уместно по ближайшему контексту, но неопределённость отмечена в сноске.
- source_word: צִפָּה
  choice: покрыл металлом
  rationale: Глагол означает покрытие или облицовку поверхности, обычно металлом. Материал не назван в самом стихе, поэтому не уточняется как золото.
- source_word: וַיִּתְּנֵם לְמֶלֶךְ אַשּׁוּר
  choice: и отдал их царю Ассирии
  rationale: Прямая и естественная передача повествовательной формы; местоимение относится к снятым элементам или их металлическому покрытию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; личное имя передано транслитерацией «Яхве», без замены титулом.
- issue: Предмет, переданный царю Ассирии
  choice: сохранено местоимение «их»
  alternative: 'уточнить: снятый с них металл'
  rationale: Грамматически местоимение соотносится с дверями и косяками, хотя контекст допускает понимание снятого покрытия как дани. Перевод не устраняет эту напряжённость пояснением, отсутствующим в стихе.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Повтор имени Езекии сохранён как значимый элемент исходного текста.
