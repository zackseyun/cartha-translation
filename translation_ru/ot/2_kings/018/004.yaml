  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: ru
  text: Он упразднил святилища на высотах, разбил священные камни, срубил ашеру[a] и раздробил медного змея, которого сделал Моисей, потому что до тех дней сыны Израиля воскуряли ему благовония. Его называли Нехуштаном[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столб Ашеры»; или: «священный столб».'
    reason: lexical_alternative
  - marker: b
    text: Имя «Нехуштан», вероятно, созвучно еврейскому слову «медь» и может иметь смысл «всего лишь кусок меди».
    reason: cultural_note
  - marker: c
    text: 'Или: «Он назвал его Нехуштаном». В еврейском тексте субъект здесь прямо не указан.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵסִיר אֶת הַבָּמוֹת
  choice: упразднил святилища на высотах
  rationale: הַבָּמוֹת обозначает местные культовые места, не обязательно расположенные только на возвышенностях. Сочетание сохраняет традиционный образ высот и ясно передаёт культовый смысл.
- source_word: שִׁבַּר אֶת הַמַּצֵּבֹת
  choice: разбил священные камни
  rationale: מַצֵּבוֹת — установленные культовые камни или стелы. «Священные камни» понятно современному читателю и не создаёт ложного образа архитектурных колонн.
- source_word: כָרַת אֶת הָאֲשֵׁרָה
  choice: срубил ашеру
  rationale: Форма с определённым артиклем обозначает связанный с Ашéрой культовый предмет, который можно срубить. Транслитерация сохраняет древний религиозный термин, а примечание поясняет предметный смысл.
- source_word: כִתַּת
  choice: раздробил
  rationale: Глагол выражает полное разрушение на куски; «раздробил» передаёт интенсивность естественно и кратко.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: медного змея
  rationale: נְחֹשֶׁת может обозначать медь или бронзу. «Медный змей» — точное и узнаваемое русское выражение, сохраняющее словесное созвучие с Нехуштаном.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Близко передаёт родственное обозначение народа; выражение понятно и сохраняет приподнятый библейский регистр без архаической грамматики.
- source_word: מְקַטְּרִים לוֹ
  choice: воскуряли ему благовония
  rationale: Передаёт культовое сожжение благовоний и сохраняет направленность поклонения змею.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: Его называли Нехуштаном
  rationale: Неопределённо-личная русская конструкция естественно сохраняет невыраженность субъекта еврейского глагола и не решает без необходимости, кто дал это название.
theological_decisions:
- issue: Значение הָאֲשֵׁרָה
  choice: ашеру
  alternative: столб Ашеры; священный столб
  rationale: В данном контексте речь идёт о физическом культовом предмете, однако транслитерация не сводит многозначный древний термин к одной реконструкции.
- issue: Субъект וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: неопределённо-личное «Его называли Нехуштаном»
  alternative: «Он назвал его Нехуштаном», где субъект — Езекия
  rationale: В еврейском тексте подлежащее явно не названо. Русская неопределённо-личная форма сохраняет эту неоднозначность.
- issue: Оттенок имени נְחֻשְׁתָּן
  choice: Нехуштан с пояснением игры слов в примечании
  alternative: переводное «кусок меди»
  rationale: Имя лучше сохранить, поскольку точный оттенок словообразования спорен; примечание передаёт вероятный уничижительный каламбур без превращения его в бесспорный перевод.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Культовые реалии переданы понятно, но без устранения исторической и лексической неоднозначности. Все маркеры примечаний включены в основной текст.
