  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: ru
  text: 'Тогда рабсак сказал им: «Неужели мой господин послал меня сказать эти слова только твоему господину и тебе? Разве он послал меня не также к людям, сидящим на стене, которым вместе с вами придётся есть собственные испражнения и пить собственную мочу[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском написании здесь употреблены грубые выражения: «есть свои испражнения и пить свою мочу». Масоретская традиция чтения заменяет их более мягкими словами, в том числе выражением «пить воду своих ног».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Сохранён традиционный русский титул ассирийского сановника; точное содержание должности не вполне определённо, поэтому более конкретные варианты вроде «главный виночерпий» или «военачальник» могли бы чрезмерно сузить смысл.
- source_word: הַעַל ... שְׁלָחַנִי אֲדֹנִי
  choice: Неужели мой господин послал меня
  rationale: Вопросительная конструкция передаёт риторический вызов; «неужели» естественно выражает его в современном русском языке.
- source_word: אֲדֹנֶיךָ
  choice: твоему господину
  rationale: Речь идёт о земном властителе, царе Иудеи; строчная буква и притяжательная форма исключают понимание как божественного титула.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: сказать эти слова
  rationale: Формулировка близка к еврейскому тексту и при этом звучит естественно по-русски.
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: Разве он послал меня не также к людям, сидящим на стене
  rationale: הֲלֹא вводит риторический вопрос, предполагающий утвердительный ответ; «также» раскрывает подразумеваемое противопоставление адресатам первой части.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: которым ... придётся есть ... и пить
  rationale: Инфинитивы описывают ожидаемое тяжёлое последствие осады; конструкция «придётся» естественно передаёт вынужденность, не вводя идеи предопределения.
- source_word: חרי/הם
  choice: собственные испражнения
  rationale: Передан прямой и намеренно унизительный смысл грубого осадного образа; «испражнения» ясно и достойно для литературного текста, не скрывая содержания.
- source_word: שיני/הם
  choice: собственную мочу
  rationale: Прямо передан смысл грубого написания; масоретская традиция чтения сохраняет эвфемистический вариант, отмеченный в сноске.
- source_word: עִמָּכֶם
  choice: вместе с вами
  rationale: Сохранено указание на совместную участь сидящих на стене и собеседников рабсака.
