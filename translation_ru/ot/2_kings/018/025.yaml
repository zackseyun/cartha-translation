source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: ru
  text: 'И теперь, разве без Яхве я выступил против этого места, чтобы разрушить его? Яхве сказал мне: «Выступи против этой земли и разрушь её».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разве независимо от Яхве»; «разве помимо Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: разве без
  rationale: Сочетание вопросительной частицы הֲ с מִבַּלְעֲדֵי вводит риторический вопрос. «Разве без» естественно по-русски и сохраняет утверждение говорящего, что он действует не независимо от Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: עָלִיתִי
  choice: я выступил против
  rationale: עלה буквально означает движение вверх, но в военном контексте с עַל обозначает поход или наступление против цели. «Выступил против» естественно передаёт этот смысл без излишней конкретизации.
- source_word: הַמָּקוֹם הַזֶּה
  choice: этого места
  rationale: Сохраняет широкое значение מָקוֹם и не подменяет его более узкими «город», «Иерусалим».
- source_word: לְהַשְׁחִיתוֹ
  choice: чтобы разрушить его
  rationale: Hiphil от שׁחת обозначает причинение разрушения; мужское местоимение согласуется по смыслу с русским «место».
- source_word: אָמַר אֵלַי
  choice: сказал мне
  rationale: Прямой и естественный эквивалент обычной формулы речи, сохраняющий заявление о полученном повелении.
- source_word: עֲלֵה
  choice: выступи против
  rationale: Военный контекст и конструкция с עַל позволяют естественно передать императив как приказ начать поход против страны.
- source_word: הָאָרֶץ הַזֹּאת
  choice: этой земли
  rationale: אֶרֶץ здесь означает землю или страну. «Земля» сохраняет широту исходного обозначения и отличие от предшествующего «места».
- source_word: וְהַשְׁחִיתָהּ
  choice: и разори её
  rationale: Передаёт повторный Hiphil от שׁחת применительно к земле. «Разори» идиоматично для опустошения территории; женское местоимение отсылает к «земле».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; форма «Яхве» сохраняет личное имя, а не заменяет его титулом.
- issue: Статус заявления о повелении Яхве
  choice: Сохранить как прямое утверждение говорящего без подтверждения или опровержения его истинности
  alternative: Пояснить, что это лишь хвастовство или что Яхве действительно поручил поход
  rationale: Стих сообщает заявление рабсака, но сам по себе не разрешает вопрос о том, каким образом он узнал волю Яхве. Перевод не должен устранять эту богословскую напряжённость.
- issue: Референты выражений «это место» и «эта земля»
  choice: Сохранить разные общие обозначения
  alternative: Иерусалим и Иудея
  rationale: Еврейский текст использует מָקוֹם и אֶרֶץ. Явная подстановка географических названий сузила бы формулировку исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой царской речи. Риторический вопрос сохранён; военное значение עלה передано глаголом «выступить». Различие между «местом» и «землёй» удержано. В основном тексте стоит маркер [a].
