base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: ru
  text: Когда царство прочно утвердилось в его руке[a], он поразил[b] своих слуг, поразивших царя, его отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «царство укрепилось в его руке». Это еврейский образ прочно утвердившейся царской власти.'
    reason: idiom_explanation
  - marker: b
    text: 'Здесь «поразил» означает «убил» или «предал смерти». В еврейском тексте один и тот же глагол употреблён и о поступке царя, и о поступке его слуг: он «поразил» тех, кто «поразил» его отца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Сочетание вводит следующее событие повествования и указывает на время его совершения. В русском языке простое «когда» естественно передаёт эту функцию, не добавляя спорного оттенка немедленности.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: царство прочно утвердилось в его руке
  rationale: Глагол חזק здесь означает укрепление и упрочение царской власти. Сохранён прозрачный еврейский образ «в его руке», а наречие «прочно» поясняет смысл надёжно закрепившегося правления.
- source_word: וַיַּךְ
  choice: он поразил
  rationale: Глагол נכה в данном контексте подразумевает убийство или казнь. «Поразил» сохраняет повтор того же корня в следующем причастии и остаётся понятным в возвышенном повествовательном регистре.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: עבד буквально означает слугу или человека на службе. Контекст допускает придворных или царских чиновников, но более общее «слуг» не уточняет их должность без достаточных оснований.
- source_word: הַמַּכִּים
  choice: поразивших
  rationale: Причастие образовано от того же глагола נכה, что и действие Амасии. Повтор «поразил… поразивших» сохраняет намеренную лексическую связь исходного текста.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: царя, его отца
  rationale: 'Пунктуация ясно передаёт еврейское приложение: убитый царь был отцом Амасии, при этом сохраняется порядок понятий исходного текста.'
