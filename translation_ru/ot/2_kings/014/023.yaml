base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: ru
  text: В пятнадцатый год правления Амасии, сына Иоаса, царя Иудеи, Иеровоам, сын Иоаса, царь Израиля, воцарился в Самарии и царствовал сорок один год.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה לַאֲמַצְיָהוּ
  choice: В пятнадцатый год правления Амасии
  rationale: Царская датировочная формула обозначает пятнадцатый год царствования Амасии. Слово «правления» естественно и ясно передаёт подразумеваемый смысл конструкции с ל.
- source_word: בֶן יוֹאָשׁ
  choice: сына Иоаса
  rationale: Стандартная патронимическая конструкция; форма родительного падежа естественна в русском приложении.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Сопряжённая конструкция прямо указывает на титул Амасии и царство, которым он правил.
- source_word: מָלַךְ
  choice: воцарился
  rationale: В сообщениях о вступлении на престол глагол מלך обозначает начало царствования. «Воцарился» отличает момент вступления на престол от последующего указания продолжительности правления.
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Сопряжённая конструкция указывает на титул Иеровоама и его царство.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог ב имеет местное значение; Самария здесь названа местом царствования и столицей.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: сорок один год
  rationale: Обычное количественное выражение продолжительности царствования, переданное современным русским оборотом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением лаконичной летописной формы. Традиционные русские формы библейских имён сочетаются с ясным синтаксисом; добавление «правления» эксплицирует смысл древнееврейской формулы датировки, не меняя содержания.
