base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: ru
  text: Но Господь не говорил, что сотрёт[a] имя Израиля из-под небес, и спас их рукою[b] Иеровоама, сына Иоаса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уничтожит» или «изгладит имя Израиля».'
    reason: lexical_alternative
  - marker: b
    text: «Рукою» — то есть через Иеровоама, посредством него.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Передаёт тетраграмматон традиционным и общеупотребительным в русском библейском стиле именованием, не вводя спорной реконструкции произношения.
- source_word: דִבֶּר
  choice: не говорил
  rationale: Формально близко передаёт значение глагола «говорить»; контекст показывает, что речь идёт о ранее не высказанном Божьем решении.
- source_word: לִמְחוֹת
  choice: что сотрёт
  rationale: Глагол означает стирание или уничтожение; с существительным «имя» русский глагол «стереть» сохраняет образ исходного текста.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: имя Израиля
  rationale: Сохраняет еврейскую метонимию, в которой имя обозначает существование и идентичность народа.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: из-под небес
  rationale: Сохраняет пространственный образ и множественное число исходного выражения, не заменяя его толкованием «с земли».
- source_word: וַיּוֹשִׁיעֵם
  choice: и спас их
  rationale: Передаёт значение каузативной формы ישע без уточнения способа избавления; союз «и» сохраняет формальную координацию и не делает причинную связь более явной, чем в еврейском тексте.
- source_word: בְּיַד
  choice: рукой
  rationale: Сохраняет еврейский образ руки как обозначения посредничества или орудия действия; смысл пояснён в сноске.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: Иеровоама, сына Иоаса
  rationale: Использованы укоренившиеся русские библейские формы имён и естественная русская конструкция родства.
theological_decisions:
- issue: Божье намерение и спасение Израиля
  choice: 'Сохранена последовательность: Господь не говорил об уничтожении имени Израиля и затем спас народ через Иеровоама.'
  alternative: 'Явно выразить причинность: «поэтому Он спас их».'
  rationale: Еврейский текст соединяет высказывания союзом ו; причинно-следственная связь вероятна из контекста, но формально не маркирована. Союз «и» сохраняет эту смысловую открытость и напряжение спасения через несовершенного царя.
- issue: Формулировка «не говорил»
  choice: Не преобразовывать её в более сильное «не постановил» или «не решил».
  alternative: «Господь не постановил стереть имя Израиля».
  rationale: Так сохраняется собственная речевая формулировка текста и не отождествляются без пояснения Божья речь, решение и предвечное намерение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены образные выражения «имя Израиля», «из-под небес» и «рукой», при этом значение последнего пояснено в сноске.
