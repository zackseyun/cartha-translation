base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: ru
  text: Против него составили заговор в Иерусалиме, и он бежал в Лахис. За ним послали[a] в Лахис и там убили его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «послали в погоню за ним». Буквально: «послали за ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: против него составили заговор
  rationale: Сочетание глагола קשׁר с однокоренным существительным קֶשֶׁר обозначает политический заговор. Русское «составили заговор» естественно передаёт идиому без ненужного однокоренного повтора.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямое обозначение места с предлогом ב.
- source_word: וַיָּנָס
  choice: он бежал
  rationale: Глагол נוס в данном повествовательном контексте означает бегство от опасности; «бежал» — точный и естественный русский эквивалент.
- source_word: לָכִישָׁה
  choice: в Лахис
  rationale: Направительный суффикс указывает на движение к городу. При глаголах движения русское «в Лахис» естественно передаёт это направление.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: за ним послали
  rationale: Еврейский текст буквально не называет тех, кого отправили. Безличная русская конструкция сохраняет эту лаконичность и не добавляет подразумеваемое слово «людей».
- source_word: וַיְמִתֻהוּ
  choice: умертвили его
  rationale: Каузативная форма מות означает «причинить смерть, убить». «Умертвили» сохраняет намеренный характер действия и возвышенный повествовательный регистр, не утверждая формальной судебной казни.
- source_word: שָׁם
  choice: там
  rationale: Наречие места отсылает к Лахису.
