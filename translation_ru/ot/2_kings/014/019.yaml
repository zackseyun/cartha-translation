translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified повествовательным строем. Повтор названия «Лахис» сохранён вслед за еврейским текстом. Союзная последовательность передана нейтрально, без внесения противопоставления, которого в оригинале нет.
