  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: ru
  text: Его повезли на конях[a], и он был похоронен в Иерусалиме вместе со своими отцами[b] в городе Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «понесли его на конях». Возможно, речь идёт о перевозке тела с помощью лошадей.'
    reason: lexical_alternative
  - marker: b
    text: «Вместе со своими отцами» — традиционная погребальная формула, указывающая на погребение с его предками из царского рода.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: Его привезли
  rationale: Глагол נשׂא означает «нести, переносить». В сочетании с «на конях» русское «привезли» естественно передаёт доставку тела к месту погребения, не уточняя вид конного средства.
- source_word: עַל הַסּוּסִים
  choice: на конях
  rationale: Буквально передаёт предлог עַל и сохраняет неясность относительно того, перевозили ли тело непосредственно на лошадях или на конном средстве.
- source_word: וַיִּקָּבֵר
  choice: и он был похоронен
  rationale: Сохраняет страдательный залог еврейской формы нифаль.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Обычная русская форма названия места с показателем местонахождения.
- source_word: עִם אֲבֹתָיו
  choice: вместе со своими отцами
  rationale: Сохраняет традиционную погребальную формулу и её династический оттенок; значение пояснено в сноске.
- source_word: בְּעִיר דָּוִד
  choice: в городе Давида
  rationale: Традиционная и ясная передача названия места; оборот уточняет место погребения в Иерусалиме.
