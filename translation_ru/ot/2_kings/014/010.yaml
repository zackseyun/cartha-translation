base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: ru
  text: Ты и вправду поразил Эдом, и твоё сердце вознесло тебя.[a] Довольствуйся славой[b] и оставайся дома. Зачем тебе навлекать беду? Ведь падёшь ты — и Иудея вместе с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и ты возгордился». Буквально: «твоё сердце вознесло тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пользуйся почётом»; «гордись этим». Еврейское выражение, вероятно, призывает довольствоваться славой, приобретённой уже одержанной победой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: Ты и вправду поразил
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагол. «И вправду поразил» передаёт эмфазу, не уточняя сверх текста степень военной победы.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: твоё сердце вознесло тебя
  rationale: Сохранён еврейский образ, в котором сердце выступает субъектом; по смыслу выражение указывает на гордость и самовозвышение.
- source_word: הִכָּבֵד
  choice: Наслаждайся своей славой
  rationale: Императив нифаля от כבד в данном контексте, вероятно, призывает удовлетвориться уже приобретённой славой. Формулировка естественна по-русски и согласуется с последующим требованием оставаться дома.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: и оставайся дома
  rationale: Передан идиоматический призыв не предпринимать нового военного похода; буквальное «сиди в своём доме» по-русски звучало бы неестественно.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: навлекать беду
  rationale: В контексте речь идёт о безрассудном вступлении в конфликт, которое приведёт к несчастью. «Беда» передаёт רָעָה как пагубное последствие, а не нравственное зло.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: и пасть — тебе и Иудее вместе с тобой
  rationale: Сохранены образ падения и акцент на том, что поражение царя повлечёт за собой падение Иудеи.
