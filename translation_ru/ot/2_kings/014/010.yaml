  to: Ты и вправду поразил Эдом, и твоё сердце вознесло тебя.[a] Довольствуйся славой[b] и оставайся дома. Зачем тебе навлекать беду? Ведь падёшь ты — и Иудея вместе с тобой.
  rationale: 'Исправлено только то, что необходимо для ясного современного русского синтаксиса и более точной передачи контекста. «Довольствуйся славой» сохраняет призыв удовлетвориться достигнутой честью; последняя фраза теперь ясно передаёт предупреждённое следствие: падение царя и Иудеи вместе с ним. Сноски сохранены у тех же смысловых узлов и уточнены без устранения лексической неоднозначности.'
