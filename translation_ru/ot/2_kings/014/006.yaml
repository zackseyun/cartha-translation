source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: ru
  text: 'Но сыновей убийц он не предал смерти[a], как написано в книге Закона Моисея, которую Яхве заповедал, сказав: «Отцы не должны быть преданы смерти за сыновей, и сыновья не должны быть преданы смерти за отцов; а каждый должен умереть за свой грех»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей убийц».'
    reason: lexical_alternative
  - marker: b
    text: См. Второзаконие 24:16.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: сыновей убийц
  rationale: בְּנֵי буквально означает «сыновья», а причастие הַמַּכִּים в данном повествовательном и судебном контексте обозначает тех, кто убил царя; «убийц» передаёт это кратко и естественно.
- source_word: לֹא הֵמִית
  choice: не предал смерти
  rationale: Каузативная форма глагола מות означает «умертвить, предать смерти»; выбранная формулировка сохраняет судебный оттенок и отличается от простого «не убил».
- source_word: כַּכָּתוּב
  choice: как написано
  rationale: Устойчивая формула ссылки на авторитетный письменный текст; по-русски звучит ясно и естественно.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: в Книге Закона Моисея
  rationale: Передаёт как סֵפֶר («книга, свиток»), так и תּוֹרָה в значении данного через Моисея Закона; заглавные буквы уместны как обозначение известного священного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: לֹא יוּמְתוּ
  choice: не должны быть преданы смерти
  rationale: Пассивно-каузативная форма в юридическом предписании запрещает подвергать человека смертной казни; «не должны» естественно выражает запрет в современном русском.
- source_word: אָבוֹת ... בָּנִים
  choice: отцы ... сыновья
  rationale: Сохранены конкретные мужские формы исходного текста без необязательного обобщения до «родителей» и «детей».
- source_word: עַל
  choice: за
  rationale: В этой правовой формуле предлог указывает, за кого или по чьей вине назначается наказание; русский предлог «за» передаёт это непосредственно.
- source_word: כִּי אִם אִישׁ
  choice: каждый
  rationale: 'Конструкция вводит противопоставленный распределительный принцип: не один за другого, а каждый за собственный грех. В русском «каждый» естественно передаёт אִישׁ в таком употреблении без тяжеловесного «каждый мужчина».'
- source_word: בְּחֶטְאוֹ
  choice: за свой грех
  rationale: Предлог выражает основание смерти, а притяжательный суффикс — принадлежность греха самому человеку; «свой» ясно сохраняет контраст.
- source_word: יָמוּת
  choice: должен умереть
  rationale: Сохранён переход от пассивно-каузативного «быть преданным смерти» к простому Qal «умереть», при этом модальность соответствует правовому изречению.
theological_decisions:
- issue: Личная и семейная ответственность перед законом
  choice: Стих запрещает предавать смерти отцов за сыновей и сыновей за отцов и утверждает ответственность каждого за собственный грех.
  alternative: Понимать эти слова как отрицание любых общественных или межпоколенческих последствий греха.
  rationale: Контекст и глагольные формы относятся к судебному лишению жизни и личной виновности. Перевод не расширяет это постановление до отрицания иных последствий чужого греха, о которых могут говорить другие библейские тексты.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным и правовым регистром. Формула «предать смерти» сохраняет юридический характер контекста; в цитате использовано естественное современное «не должны», а пара «отцы — сыновья» следует конкретной лексике еврейского текста.
