  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/יוֹאָ֥שׁ בֶּן יוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲמַצְיָ֥הוּ בֶן יוֹאָ֖שׁ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: ru
  text: Во второй год правления Иоаса, сына Иоахаза, царя Израиля, Амасия, сын Иоаса, стал царём Иудеи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: Во второй год правления
  rationale: Еврейская формула датировки буквально строится с существительным «год» и числительным «два», но в контексте лет царствования имеет порядковое значение. Добавление «правления» естественно проясняет по-русски, чей год отсчитывается.
- source_word: לְ/יוֹאָשׁ
  choice: Иоаса
  rationale: Предлог לְ в формуле царской хронологии обозначает правителя, по годам которого ведётся отсчёт; в русском это передаётся родительным падежом после «год правления».
- source_word: בֶּן יוֹאָחָז
  choice: сына Иоахаза
  rationale: Обычное обозначение происхождения; имена переданы в традиционной русской библейской форме.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Сопряжённая конструкция обозначает царский титул и подвластную страну.
- source_word: מָלַךְ
  choice: стал царём
  rationale: В данной хронологической формуле глагол обозначает вступление на престол, а не всю продолжительность царствования.
- source_word: אֲמַצְיָהוּ
  choice: Амасия
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בֶן יוֹאָשׁ
  choice: сын Иоаса
  rationale: Прямо передано отчество-патроним, идентифицирующее Амасию.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царём Иудеи
  rationale: Титул и царство естественно включены в русскую конструкцию «стал царём Иудеи».
