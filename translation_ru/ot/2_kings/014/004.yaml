base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: ru
  text: 'Однако высоты[a] не были упразднены: народ всё ещё приносил жертвы и совершал воскурения[b] на высотах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Высоты» — местные культовые места или святилища, часто располагавшиеся на возвышенностях.
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может означать возжигание благовоний или других приношений.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רַק
  choice: Однако
  rationale: Частица вводит ограничение к предшествующей положительной оценке царя; «однако» естественно передаёт её противительный оттенок.
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Традиционный и ёмкий термин для местных культовых мест, нередко находившихся на возвышенностях; пояснение дано в сноске.
- source_word: לֹא סָרוּ
  choice: не были упразднены
  rationale: При подлежащем «высоты» глагол означает, что культовые места не устранили и не отменили; формулировка передаёт контекстуальный смысл без указания не названного исполнителя.
- source_word: עוֹד
  choice: всё ещё
  rationale: Передаёт продолжение привычной практики вопреки только что отмеченному ограничению.
- source_word: הָעָם
  choice: народ
  rationale: Прямой и естественный эквивалент собирательного существительного.
- source_word: מְזַבְּחִים
  choice: приносил жертвы
  rationale: Причастие обозначает продолжающееся или обычное действие; сочетание «всё ещё приносил» естественно выражает это по-русски.
- source_word: וּמְקַטְּרִים
  choice: и воскурял
  rationale: В культовом контексте глагол обозначает возжигание благовоний либо превращение приношения в дым; «воскурял» сохраняет культовый смысл и допускает пояснение неоднозначности.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: Предлог имеет местное значение; повтор термина сохранён вслед за еврейским текстом.
theological_decisions:
- issue: Оценка богослужения на высотах
  choice: Сохранить историко-культовый термин «высоты», не называя их в основном тексте незаконными или идолопоклонническими.
  alternative: «местные святилища» или «незаконные места поклонения»
  rationale: Стих сообщает, что эти места оставались и народ продолжал там культовые действия. Более широкая повествовательная среда подразумевает неодобрение, но сам термин не следует заменять истолкованием.
- issue: Предмет воскурения
  choice: Передать глагол словом «воскурял» и отметить широту значения в сноске.
  alternative: «сжигал благовония» или «сжигал приношения»
  rationale: Еврейский глагол в культовой речи может относиться к благовониям или к дымному возжиганию приношений; контекст не требует безоговорочно сужать значение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской лексикой. Слово «высоты» сохранено как устоявшийся историко-культовый термин и снабжено пояснением; синтаксис остаётся ясным для современного читателя.
