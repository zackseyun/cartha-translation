  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: ru
  text: Иоас, царь Израиля, захватил Амасию, царя Иудеи, сына Иоаса, сына Охозии, в Бет-Шемеше. Затем он пришёл[a] в Иерусалим и пробил в иерусалимской стене пролом от Ефремовых ворот до Угловых ворот протяжённостью в четыреста локтей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском согласном тексте стоит форма «и они пришли в Иерусалим», но масоретское чтение, контекст и следующий глагол в единственном числе поддерживают перевод «он пришёл», то есть Иоас.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: захватил
  rationale: В военном контексте глагол означает взятие противника в плен; «захватил» точно и естественно передаёт смысл.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: в Бет-Шемеше
  rationale: Предлог בְּ с географическим названием обозначает место захвата; русское «в» здесь естественно.
- source_word: ו/יבאו
  choice: Затем он пришёл[a]
  rationale: Согласный текст допускает чтение «и они пришли», тогда как масоретская традиция чтения, контекст и следующий глагол в единственном числе поддерживают «он пришёл»; «затем» ясно передаёт последовательность событий.
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלַם
  choice: разрушил участок иерусалимской стены
  rationale: Глагол выражает пробитие или разрушение стены. Добавление «участок» естественно сочетается с указанными далее границами пролома и не подразумевает разрушения всей стены.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: от Ефремовых ворот до Угловых ворот
  rationale: Конструкция обозначает протяжённость разрушенного участка; оборот «от… до…» передаёт её наиболее ясно.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: на четыреста локтей
  rationale: Сохранена древняя мера длины без приблизительного пересчёта; предлог «на» естественно обозначает протяжённость участка.
- source_word: בֶּן ... בֶּן ...
  choice: сына Иоаса, сына Охозии
  rationale: Повтор «сына» сохраняет форму еврейской родословной и не заменяет её пояснительным «внука».
