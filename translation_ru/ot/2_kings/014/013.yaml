translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Имена переданы в привычной русской библейской форме; топоним Бет-Шемеш оставлен близким к еврейскому звучанию. Подлинное текстологическое расхождение отмечено сноской.
