base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Прочие деяния Иеровоама, всё, что он совершил, его могущество, то, как он воевал и как возвратил Дамаск и Емаф Иудее в Израиле[a], — разве не записаны в Книге летописей царей Израиля?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «Иудее в Израиле». Выражение неясно. Возможно, речь идёт о землях, возвращённых Израилю, но некогда принадлежавших Иудее; возможно также, что здесь сохранилось более древнее геополитическое обозначение. Основной текст следует еврейской формулировке, не устраняя её неоднозначности.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие деяния
  rationale: Обычная формула заключительных царских сводок в книгах Царей. Буквальное «прочие слова/дела» по-русски не передаёт историографического смысла столь естественно; «деяния» сохраняет возвышенный, но понятный регистр.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: всё, что он совершил
  rationale: Передаёт широкий смысл עשה и естественно сочетается с «деяниями» без ненужного смыслового сужения.
- source_word: וּגְבוּרָתוֹ
  choice: и его могущество
  rationale: גְּבוּרָה может означать силу, доблесть или могучие свершения. Следующее выражение о войне уточняет здесь военную сторону царского могущества.
- source_word: אֲשֶׁר נִלְחָם
  choice: как он воевал
  rationale: Передаёт пояснительную функцию אֲשֶׁר после упоминания могущества и звучит естественно по-русски.
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: и как возвратил
  rationale: В политико-территориальном контексте каузатив הֵשִׁיב означает возвращение или восстановление владения; «возвратил» не уточняет сверх текста, кому именно прежде принадлежали города.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: Дамаск и Емаф
  rationale: Использованы укоренившиеся русские формы библейских географических названий.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: Иудее в Израиле
  rationale: Еврейское выражение сжато и трудно для однозначного истолкования. Формально близкий перевод сохраняет его неоднозначность, не внося историко-географической гармонизации.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны
  rationale: Сохраняет риторический вопрос стандартной заключительной формулы и естественно передаёт значение письменной фиксации.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: в Книге летописей царей Израиля
  rationale: Естественное русское название упоминаемого архивного источника; «летописи» передаёт דִּבְרֵי הַיָּמִים, а форма «царей Израиля» ясно обозначает принадлежность документа.
