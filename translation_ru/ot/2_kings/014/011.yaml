base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: ru
  text: Но Амасия не послушал[a], и Иоас, царь Израиля, выступил; Иоас и Амасия, царь Иудеи, встретились лицом к лицу[b] у Бет-Шемеша, принадлежавшего Иудее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не внял»; возможен также смысл «не послушался». Еврейский глагол может обозначать слушание, за которым следует соответствующее действие, а не просто восприятие слов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «увидели лица» — еврейское выражение, обозначающее непосредственную встречу или столкновение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: не послушал
  rationale: В данном контексте глагол означает не просто услышать, а внять предостережению и соответственно поступить. «Не послушал» естественно передаёт отказ Амасии принять сказанное, не усиливая смысл до прямого неповиновения приказу.
- source_word: וַיַּעַל
  choice: выступил
  rationale: Буквально глагол означает «поднялся, пошёл вверх», но в данном военном контексте русское «выступил» естественно передаёт начало похода, не добавляя деталей, которых нет в тексте.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: сошлись лицом к лицу
  rationale: Еврейское выражение буквально связано с тем, что стороны «увидели лица» друг друга; здесь оно обозначает непосредственную встречу-противостояние двух царей.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Бет-Шемеш
  rationale: Название места передано транслитерацией, а не переведено как «Дом солнца».
- source_word: אֲשֶׁר לִיהוּדָה
  choice: принадлежавшего Иудее
  rationale: Оборот указывает на территориальную принадлежность города Иудее, а не только на его географическое положение.
- source_word: וְלֹא
  choice: Но
  rationale: Союз выражает контраст с предшествующим предостережением, которое Амасия отверг.
