  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: ru
  text: Он поразил десять тысяч эдомитян в Соляной долине, в сражении захватил Селу[a] и назвал её Иокфеилом — так она называется доныне.
