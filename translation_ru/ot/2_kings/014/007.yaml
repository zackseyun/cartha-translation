lexical_decisions:
- source_word: הִכָּה
  choice: поразил
  rationale: В военном контексте глагол נכה означает нанесение сокрушительного, нередко смертельного удара; «поразил» сохраняет эту смысловую широту, не уточняя без необходимости «убил».
- source_word: אֱדוֹם
  choice: эдомитян
  rationale: Буквально назван «Эдом», однако при числительном речь естественно понимается как о десяти тысячах людей из Эдома.
- source_word: בְּגֵיא הַמֶּלַח
  choice: в Соляной долине
  rationale: Естественная русская передача географического сочетания «долина соли» как собственного названия.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: десять тысяч
  rationale: Прямая передача количественного числительного.
- source_word: וְתָפַשׂ
  choice: захватил
  rationale: В военном контексте глагол обозначает овладение местом.
- source_word: הַסֶּלַע
  choice: Селу
  rationale: Контекст указывает, вероятнее всего, на топоним Села; нарицательное значение слова сохранено в сноске.
- source_word: בַּמִּלְחָמָה
  choice: в сражении
  rationale: Передаёт обстоятельство военного захвата естественнее, чем буквальное «в войне».
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: дал ей имя
  rationale: Естественная современная русская передача еврейской формулы наречения имени с сохранением женского рода, относящегося к Селе.
- source_word: יָקְתְאֵל
  choice: Иокфеил
  rationale: Традиционная русская библейская форма топонима, достаточно близкая к еврейскому יָקְתְאֵל.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: которое сохраняется доныне
  rationale: 'Контекстуально ясная передача формулы «до этого дня»: речь идёт о сохранении данного месту имени.'
