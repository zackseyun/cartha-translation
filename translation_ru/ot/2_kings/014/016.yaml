translation_notes:
  register: Современный литературный русский с умеренно возвышенной лексикой, соответствующей формульному царскому некрологу. Имя יְהוֹאָשׁ передано традиционной русской библейской формой «Иоас», а יָרָבְעָם — «Иеровоам». Синтаксис слегка расчленён на два предложения для ясности, без изменения логической связи.
