  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: ru
  text: И почил Иоас вместе со своими предками, и был похоронен в Самарии вместе с царями Израиля. Вместо него воцарился его сын Иеровоам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: В царской некрологической формуле глагол означает смерть. «Почил» сохраняет образ сна и торжественно-формульный характер еврейского выражения, оставаясь понятным в современном литературном русском.
- source_word: עִם אֲבֹתָיו
  choice: вместе со своими предками
  rationale: В данном контексте אָבוֹת обозначает умерших предков. «Предки» естественнее по-русски и не создаёт ошибочного впечатления, будто речь идёт только об отцах.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Страдательная конструкция точно передаёт породу нифаль и естественно звучит по-русски.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог בְּ имеет здесь обычное местное значение; речь идёт о месте погребения.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: вместе с царями Израиля
  rationale: «Вместе с» близко передаёт עִם и указывает на погребение рядом с прежними израильскими царями.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В сообщении о престолонаследии «воцарился» естественно выражает вступление на царство, а не описание продолжительности правления.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Оборот обозначает занятие прежнего положения и династическую смену; «вместо него» передаёт это точнее, чем чисто временное «после него».
