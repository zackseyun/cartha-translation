reference: 2 Kings 14:25
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: ru
  text: Он восстановил границу Израиля от Лево-Хамата[a] до моря Аравы[b], согласно слову Яхве, Бога Израиля, которое Он изрёк через Своего слугу Иону, сына Амафии, пророка из Гат-Хефера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «от входа в Хамат».'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеется в виду Мёртвое море.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵשִׁיב
  choice: восстановил
  rationale: Порода хифиль глагола שוב здесь указывает на восстановление прежней территориальной границы Израиля; «восстановил» естественно передаёт политико-географический смысл.
- source_word: גְּבוּל
  choice: границу
  rationale: Существительное обозначает территориальный рубеж; единственное число соответствует еврейскому тексту.
- source_word: מִלְּבוֹא חֲמָת
  choice: от Лево-Хамата
  rationale: Выражение может функционировать как закрепившееся географическое название. Транслитерация сохраняет эту возможность, а буквальное понимание дано в сноске.
- source_word: יָם הָעֲרָבָה
  choice: море Аравы
  rationale: Основной текст прямо передаёт еврейское географическое обозначение, не подменяя его вероятной идентификацией с Мёртвым морем.
- source_word: כִּדְבַר
  choice: согласно слову
  rationale: Оборот выражает соответствие ранее данному Божьему слову и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בְּיַד
  choice: через
  rationale: Еврейская идиома обозначает посредничество или орудие действия; русское «через» ясно и естественно передаёт её смысл без неуместного буквализма.
- source_word: עַבְדּוֹ
  choice: Своего слугу
  rationale: В контексте пророческого служения עבד указывает на принадлежащего Богу и исполняющего Его поручение служителя; «слуга» сохраняет смысл отношений и остаётся понятным современному читателю.
- source_word: הַנָּבִיא
  choice: пророка
  rationale: Приложение прямо обозначает служение Ионы.
- source_word: מִגַּת הַחֵפֶר
  choice: из Гат-Хефера
  rationale: Предлог מן обозначает происхождение; «из» естественно передаёт его в русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, и не заменяет его титулом.
- issue: Идентификация יָם הָעֲרָבָה
  choice: море Аравы
  alternative: Мёртвое море
  rationale: Основной текст сохраняет буквальное географическое выражение и не превращает вероятную идентификацию в однозначный перевод; она вынесена в сноску.
- issue: Понимание לְבוֹא חֲמָת
  choice: Лево-Хамат как географическое название
  alternative: вход в Хамат
  rationale: Еврейское выражение допускает восприятие как топонима или как описательного обозначения. Основной текст сохраняет топонимическое чтение, а буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет последовательность исходного текста, но избегает тяжёлого буквализма. Местоимения, относящиеся к Богу, написаны с прописной буквы для ясности референции; имя царя подразумевается контекстом предыдущих стихов. Маркеры сносок исправно соотнесены с теми выражениями, которые они поясняют.
