- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет буквальный образ «дома» и передаёт личное имя יהוה как «Яхве».
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: и в сокровищницах царского дома
  rationale: «Сокровищницы» соответствует контексту хранилищ ценностей; «царский дом» сохраняет еврейскую формулировку и остаётся понятным.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: заложников
  rationale: Трудное буквальное выражение, вероятно, обозначает людей, удерживаемых как обеспечение; контекстуальное значение вынесено в основной текст, а буквальная форма отмечена в сноске.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: и вернулся в Самарию
  rationale: Точно передаёт повествовательную форму שׁוב и направительный суффикс в названии города.
