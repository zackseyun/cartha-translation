  rationale: Перестроена возрастная формула ради естественного современного русского звучания без изменения содержания. Сноска исправлена так, чтобы традиционный вариант имени соответствовал английскому аудиту и не содержал лишнего гласного элемента. «Она была родом из Иерусалима» ясно связывает определение с матерью и передаёт מִן («из», «родом из»).
