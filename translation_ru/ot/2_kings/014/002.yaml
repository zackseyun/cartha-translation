base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: ru
  text: Ему было двадцать пять лет, когда он стал царём, и он царствовал в Иерусалиме двадцать девять лет. Его мать звали Иегоаддин[a]; она была родом из Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
