lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: двадцати пяти лет был он
  rationale: Естественная для русского языка передача древнееврейского возрастного оборота «сын двадцати пяти лет»; сохраняет несколько торжественный стиль царской хроники.
- source_word: הָיָה בְמָלְכוֹ
  choice: когда воцарился
  rationale: Идиоматическая передача формулы вступления на престол; точнее и естественнее буквального «при его царствовании».
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: двадцать девять лет царствовал
  rationale: Прямо передаёт продолжительность правления в обычной русской формуле.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Прямая передача местного значения предлога בְ.
- source_word: וְשֵׁם אִמּוֹ
  choice: Имя его матери —
  rationale: Сохраняет характерную для Книг Царств формулу, оставаясь ясной в современном литературном русском.
- source_word: יהועדין
  choice: Иегоаддин
  rationale: Транслитерация следует огласованной форме масоретского текста WLC; традиционный русский вариант отмечен в сноске.
- source_word: מִן יְרוּשָׁלָם
  choice: она была родом из Иерусалима
  rationale: Предлог מִן указывает на происхождение; добавленное местоимение делает связь с матерью однозначной и естественной по-русски, не добавляя нового содержания.
