base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: ru
  text: Амасия, сын Иоаса, царь Иудеи, после смерти Иоаса[a], сына Иоахаза, царя Израиля, прожил ещё пятнадцать лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте имена отца Амасии и израильского царя написаны немного по-разному: יוֹאָשׁ и יְהוֹאָשׁ. В русской библейской традиции оба обычно передаются как «Иоас»; здесь это разные люди.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: прожил
  rationale: Глагол חיה с указанием срока сообщает, сколько Амасия жил после смерти другого царя. «Прожил» естественно передаёт эту хронологическую формулу, не усиливая её до более интерпретирующего «пережил».
- source_word: אֲמַצְיָהוּ
  choice: Амасия
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: בֶן יוֹאָשׁ
  choice: сын Иоаса
  rationale: Сопряжённая конструкция прямо обозначает сыновнее отношение; יוֹאָשׁ передано традиционной русской формой «Иоас».
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Естественная русская передача конструкции, обозначающей царский титул и владение Амасии.
- source_word: אַחֲרֵי מוֹת
  choice: после смерти
  rationale: Сохраняет именное выражение оригинала и точно передаёт временное отношение.
- source_word: יְהוֹאָשׁ
  choice: Иоас
  rationale: Традиционная русская библейская форма имени; в русском употреблении различие между написаниями יוֹאָשׁ и יְהוֹאָשׁ обычно не отражается разными формами, поэтому носители имени различены с помощью родословных и царств.
- source_word: בֶן יְהוֹאָחָז
  choice: сына Иоахаза
  rationale: Точно передаёт родственную формулу и использует устоявшуюся русскую форму имени.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Прямая и естественная передача титула правителя северного царства.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: пятнадцать лет
  rationale: Стандартная русская передача обозначения продолжительности.
