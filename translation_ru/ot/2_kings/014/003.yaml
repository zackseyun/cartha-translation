id: 2KI.14.3
reference: 2 Kings 14:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: ru
  text: 'Он делал то, что было праведно в глазах Яхве, однако[b] не так, как его отец Давид[a]: он во всём поступал так, как поступал его отец Иоас[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Здесь «отец» означает династического предка: Давид не был непосредственным отцом Амасии.'
    reason: cultural_note
  - marker: b
    text: 'Или: «только не так, как его отец Давид». Еврейское רַק может буквально передаваться словом «только», вводящим ограничение.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское имя יוֹאָשׁ можно также передать как «Йоаш». В русской библейской традиции употребляется форма «Иоас».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Он делал то, что было праведно
  rationale: Передаёт принятую в книгах Царств формулу оценки царя; несовершенный вид «делал» естественно описывает характер его правления.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет еврейскую метафору божественной оценки и передаёт личное имя יהוה как «Яхве».
- source_word: רַק
  choice: однако
  rationale: В данном контексте частица вводит ограничение к положительной оценке; «однако» естественно выражает противопоставление, не устраняя возможного более буквального значения «только».
- source_word: לֹא כְּדָוִד אָבִיו
  choice: не так, как его отец Давид
  rationale: Сохраняет сравнение и слово «отец» в его династическом, предковом смысле.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה יוֹאָשׁ אָבִיו עָשָׂה
  choice: он во всём поступал так, как поступал его отец Иоас
  rationale: «Во всём» передаёт כְּכֹל, а повтор глагола сохраняет полноту сопоставления с поведением Иоаса; «поступал» звучит естественнее русского повтора «делал… делал».
theological_decisions:
- issue: Положительная оценка царя и её ограничение
  choice: 'Сохранена реальная положительная оценка Амасии, за которой следует явное ограничение: он не достиг образца Давида, а следовал примеру Иоаса.'
  alternative: Ослабить противопоставление с Давидом либо истолковать начальную похвалу как чисто формальную.
  rationale: Еврейский текст сначала утверждает, что царь поступал праведно в глазах Яхве, а затем ограничивает эту похвалу частицей רַק и двумя сопоставлениями.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены образ «в глазах Яхве», династическое употребление слова «отец» и напряжение между похвалой царю и её ограничением.
