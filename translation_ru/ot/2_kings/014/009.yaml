base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: ru
  text: 'И послал Иоас, царь Израиля, к Амасии, царю Иудеи, сказать: «Терновник[a], что на Ливане, послал к кедру, что на Ливане, сказать: „Отдай свою дочь в жёны моему сыну“. И прошёл дикий зверь[b], что на Ливане, и растоптал терновник».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чертополох» либо «колючий куст»; еврейское слово обозначает колючее растение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «зверь поля», то есть дикий зверь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Последовательная форма с וַ продвигает повествование; традиционно-литературное «И послал» естественно для русского библейского рассказа и не добавляет временного оттенка сверх текста.
- source_word: הַחוֹחַ
  choice: терновник
  rationale: Слово обозначает колючее растение без точного указания вида. «Терновник» сохраняет образ низкого колючего растения и контраст с величественным кедром.
- source_word: הָאֶרֶז
  choice: кедр
  rationale: Прямое соответствие אֶרֶז; важно сохранить контраст между терновником и кедром.
- source_word: בַּלְּבָנוֹן
  choice: на Ливане
  rationale: В русском литературном и библейском употреблении применительно к горной области естественно «на Ливане»; повтор сохранён ради риторической структуры оригинала.
- source_word: תְּנָה
  choice: Отдай
  rationale: В контексте брачного предложения «отдай свою дочь в жёны» естественно передаёт повелительное נתן, не подразумевая купли или принуждения сверх древней формулы.
- source_word: בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: свою дочь в жёны моему сыну
  rationale: Ясная современная русская формула, сохраняющая родственные отношения и цель передачи дочери.
- source_word: חַיַּת הַשָּׂדֶה
  choice: полевой зверь
  rationale: Более формально сохраняет буквальный образ «зверя поля» и притчевый тон; значение дикого животного поясняется в сноске.
- source_word: וַתַּעֲבֹר
  choice: прошёл мимо
  rationale: Передаёт движение зверя мимо растения и случайный, унизительный характер его гибели.
- source_word: וַתִּרְמֹס
  choice: растоптал
  rationale: Точно и выразительно передаёт действие רמס — попрание ногами.
