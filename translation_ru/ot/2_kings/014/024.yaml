base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: ru
  text: Он делал зло в глазах Яхве и не отступал ни от одного из грехов Иеровоама, сына Навата[a], который ввёл Израиль в грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное понимание: «грехов Иеровоама, сына Навата, которыми он ввёл Израиль в грех». Еврейское относительное слово может связывать заключительный оборот либо непосредственно с Иеровоамом, либо с названными грехами как средством воздействия.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Он делал зло
  rationale: Устойчивое древнееврейское выражение передаёт нравственную оценку поступков; несовершенный вид естественно описывает постоянный образ правления.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена прозрачная библейская идиома божественной оценки и личное имя יהוה, переданное как «Яхве».
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: не отступал ни от одного из грехов
  rationale: При отрицании сочетание מִכָּל естественно передаётся по-русски конструкцией «ни от одного», сохраняя всеохватность утверждения.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, а отношение родства выражено литературно и ясно.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: который ввёл Израиль в грех
  rationale: Каузативная форма חטא означает «побудить/привести к греху». «Ввёл Израиль в грех» передаёт это естественно и указывает на Иеровоама как наиболее прямого деятеля.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Отнесение אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Относительное предложение отнесено непосредственно к Иеровоаму: «который ввёл Израиль в грех».'
  alternative: Отнести оборот к грехам как средствам, которыми Иеровоам вовлёк Израиль в грех.
  rationale: Мужской род подразумеваемого деятеля каузативного глагола и обычная формула книг Царств поддерживают прямое отнесение к Иеровоаму; однако неизменяемое אֲשֶׁר допускает в контексте инструментальное понимание, отмеченное в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировки понятны широкому читателю; сохранены образ «в глазах» и личное имя Яхве.
