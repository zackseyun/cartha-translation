base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: ru
  text: Тогда весь народ Иудеи взял Азарию — ему было шестнадцать лет — и поставил его царём вместо его отца Амасии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В других местах Азария также называется Озией; здесь в еврейском тексте стоит имя «Азария».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взял
  rationale: Глагол לקח буквально означает «брать». В контексте возведения на престол «взял» прямо передаёт действие народа, не добавляя идеи избрания или особой церемонии.
- source_word: כָּל עַם יְהוּדָה
  choice: весь народ Иудеи
  rationale: Сохраняется прямое указание на весь народ Иудеи как на совокупного участника политического действия.
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Перевод следует форме имени, стоящей в еврейском тексте данного стиха; другое имя этого царя отмечено в сноске.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: ему было шестнадцать лет
  rationale: Естественное современное русское выражение возраста, сохраняющее пояснительный, вставной характер фразы.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: поставил его царём
  rationale: Каузативная форма מלך означает «сделать царём, поставить царём». Этот вариант не добавляет не упомянутого в тексте обряда коронации или одного лишь провозглашения.
- source_word: תַּחַת אָבִיו
  choice: вместо его отца
  rationale: В контексте престолонаследия תחת указывает на занятие места предшественника; «вместо» передаёт это точнее, чем чисто временное «после».
- source_word: אֲמַצְיָהוּ
  choice: Амасия
  rationale: Традиционная и узнаваемая русская передача имени אֲמַצְיָהוּ.
