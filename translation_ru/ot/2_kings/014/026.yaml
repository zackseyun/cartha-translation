  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: ru
  text: 'Ибо Яхве увидел, что бедствие Израиля было крайне тяжким[a]: не осталось ни связанного, ни свободного[b], и некому было помочь Израилю.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весьма горьким», «крайне мучительным». Еврейское выражение трудно для однозначного толкования, но явно подчёркивает крайнюю тяжесть страданий Израиля.'
    reason: lexical_alternative
  - marker: b
    text: Буквально — трудное парное выражение «ни связанного, ни оставленного (или свободного)». Вероятно, это идиома, означающая, что не осталось никого, кто мог бы помочь, либо что были обессилены все слои народа.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога принятой в современной русской библеистике формой, не заменяя его титулом.
- source_word: עֳנִי
  choice: бедствие
  rationale: Обозначает тяжёлое положение и страдание всего Израиля; «бедствие» естественно передаёт широкий национальный контекст, не сужая смысл до материальной бедности.
- source_word: מֹרֶה מְאֹד
  choice: крайне тяжким
  rationale: В контексте выражение усиливает тяжесть бедствия. Еврейская форма трудна для однозначного толкования, поэтому возможные оттенки отмечены в сноске.
- source_word: אֶפֶס
  choice: не осталось ни… ни…
  rationale: Передаёт усиленное отрицание и полное отсутствие названных далее людей естественным русским оборотом.
- source_word: עָצוּר
  choice: связанного
  rationale: Сохраняет конкретный образ человека, находящегося под ограничением, в составе трудного парного выражения.
- source_word: עָזוּב
  choice: свободного
  rationale: Передаёт предполагаемую противоположность слову עָצוּר в устойчивой паре, не скрывая спорность её точного смысла; она пояснена в сноске.
- source_word: עֹזֵר
  choice: некому было помочь
  rationale: Естественно по-русски передаёт отсутствие любого помогающего Израилю, сохраняя значение причастия.
theological_decisions:
- issue: Передача трудного выражения עָצוּר וְעָזוּב
  choice: ни связанного, ни свободного
  alternative: ни заключённого, ни отпущенного; никого не осталось
  rationale: Буквально-образная парная формула сохраняет неоднозначность еврейского текста. Сноска сообщает вероятный общий смысл — полное отсутствие тех, кто мог бы оказать помощь, — не превращая его в единственно возможное толкование.
- issue: Передача выражения מֹרֶה מְאֹד
  choice: крайне тяжким
  alternative: весьма горьким; крайне мучительным
  rationale: Выбранная формулировка ясно выражает крайнюю степень страдания и естественна в современном русском языке, а лексическая неуверенность исходного выражения сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и естественным; двоеточие раскрывает увиденное Яхве бедственное положение. Неясные еврейские выражения не догматизированы и сопровождаются краткими сносками.
