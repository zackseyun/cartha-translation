base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: ru
  text: 'Тогда Амасия отправил посланников к Иоасу, сыну Иоахаза, сына Ииуя, царю Израиля, с такими словами: «Приходи, встретимся лицом к лицу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «давай посмотрим друг другу в лицо». В данном контексте это вызов на прямое противостояние, по-видимому военное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Естественный повествовательный маркер последовательности событий.
- source_word: שָׁלַח ... מַלְאָכִים
  choice: отправил посланников
  rationale: Речь о людях, передающих царское послание; сочетание естественно для современного русского повествования.
- source_word: יְהוֹאָשׁ
  choice: Иоас
  rationale: Устоявшаяся русская библейская передача имени северного царя; его отличает от одноимённого царя Иудеи контекст и родословие.
- source_word: בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: сыну Иоахаза, сына Ииуя
  rationale: Родословная цепочка сохранена без добавлений; падежи согласованы с обращением посланников к Иоасу.
- source_word: לֵאמֹר
  choice: с такими словами
  rationale: Естественная русская передача стандартной древнееврейской формулы введения прямой речи.
- source_word: לְכָה
  choice: Выходи
  rationale: В контексте вызова передаёт побуждение явиться на встречу лучше, чем нейтральное и потенциально неясное «иди» или «приходи».
- source_word: נִתְרָאֶה פָנִים
  choice: встретимся лицом к лицу
  rationale: Сохраняет образ «лица» и намеренную краткость вызова, не вставляя прямо в основной текст истолкование «в бою».
theological_decisions:
- issue: Характер предложенной встречи
  choice: Не уточнять в основном тексте словами «в бою»
  alternative: «сразимся лицом к лицу» / «встретимся в бою»
  rationale: Контекст предполагает военное противостояние, однако сама еврейская идиома выражена менее явно. Буквенный образ и контекстуальный смысл сохранены соответственно в тексте и примечании.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Формулировка прямой речи краткая и вызывающая; образ исходного выражения сохранён, а его военный смысл пояснён в примечании.
