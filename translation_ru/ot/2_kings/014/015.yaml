source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהוֹאָ֜שׁ אֲשֶׁ֤ר עָשָׂה֙ וּ/גְב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Остальные деяния Иоаса, всё, что он совершил, его доблесть[a] и то, как он воевал с Амасией, царём Иудеи, — разве не записаны они в Книге летописей[b] царей Израиля?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его могущество»; возможно также: «его подвиги».'
    reason: Существительное גְּבוּרָה может обозначать силу, доблесть либо великие деяния.
  - marker: b
    text: 'Или: «в книге анналов».'
    reason: Выражение דִּבְרֵי הַיָּמִים обозначает летописную, анналистическую запись.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Остальные деяния
  rationale: Устойчивая формула заключительной царской хроники. «Деяния» передаёт здесь не слова, а поступки и события правления; начальный союз естественно не выражать отдельно по-русски.
- source_word: יְהוֹאָשׁ
  choice: Иоас
  rationale: Традиционная и узнаваемая русская передача еврейского имени יְהוֹאָשׁ.
- source_word: אֲשֶׁר עָשָׂה
  choice: всё, что он совершил
  rationale: Отдельно отражает относительное придаточное оригинала и не допускает утраты этой части текста.
- source_word: וּגְבוּרָתוֹ
  choice: его доблесть
  rationale: Слово גְּבוּרָה обозначает силу, доблесть или проявления могущества; в военном контексте «доблесть» звучит естественно и сохраняет широкий смысл.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: и то, как он воевал с
  rationale: Предлог עִם буквально означает «с»; русское «воевал с» естественно обозначает противоборство и сохраняет форму оригинала без лишнего уточнения.
- source_word: אֲמַצְיָהוּ מֶלֶךְ יְהוּדָה
  choice: Амасией, царём Иудеи
  rationale: Естественная русская передача имени и приложения с царским титулом.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве не записаны они
  rationale: Сохраняет риторический вопрос и стандартную формулу Книг Царей.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: в Книге летописей царей Израиля
  rationale: Ясная и литературная передача названия царского анналистического источника.
