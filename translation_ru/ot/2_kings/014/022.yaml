base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/022.yaml
  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: ru
  text: Он отстроил Эйлат и вернул его Иудее после того, как царь почил со своими предками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: отстроил
  rationale: В данном контексте речь, вероятно, идёт о восстановлении города; «отстроил» естественно передаёт строительство или восстановление без излишнего уточнения.
- source_word: אֵילַת
  choice: Эйлат
  rationale: Современная русская передача древнееврейского топонима; форма сохраняется единообразно.
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: и вернул его Иудее
  rationale: Глагол שׁוב в каузативной форме означает «вернуть»; местоименный суффикс женского рода относится к городу Эйлату, но по нормам русского согласуется с родовым словом «город» в мужском роде.
- source_word: שְׁכַב הַמֶּלֶךְ עִם אֲבֹתָיו
  choice: царь почил со своими предками
  rationale: Сохранён традиционный библейский эвфемизм смерти и образ совместного упокоения с предками.
theological_decisions:
- issue: Неуказанная личность царя
  choice: сохранить обозначение «царь» без подстановки имени
  alternative: уточнить имя царя по контексту
  rationale: Еврейский текст оставляет царя неназванным; перевод не должен молча устранять эту референциальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «почил со своими предками»; синтаксис краткий и ясный.
