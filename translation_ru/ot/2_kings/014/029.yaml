lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: Глагол שׁכב в сочетании «с отцами своими» входит в устойчивую царскую формулу смерти. «Почил» естественно передаёт этот эвфемизм по-русски, не сводя образное выражение к пояснительному «умер».
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Сохранена традиционная формула, соответствующая буквальному значению אבות и стилю царских итоговых сообщений; в данном контексте речь идёт о предках.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: с царями Израиля
  rationale: Повтор предлога עִם передан буквально, чтобы сохранить синтаксический параллелизм и не устранять возможный оттенок принадлежности Иеровоама к ряду умерших израильских царей.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В сообщении о престолонаследии «воцарился» кратко и естественно передаёт начало царствования, выраженное формой מלך.
- source_word: זְכַרְיָה
  choice: Захария
  rationale: Употреблена закрепившаяся в русской библейской традиции форма имени.
- source_word: בְנוֹ
  choice: его сын
  rationale: Прямое и естественное соответствие обозначению родства.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Точно передаёт смену правителя и семантику занятия его места.
