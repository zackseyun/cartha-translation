  yaml_path: translation/ot/2_kings/014/012.yaml
  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: ru
  text: Иудея была разбита Израилем, и каждый побежал к своему шатру.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каждый — к себе домой». Буквально: «каждый — к своему шатру»; это устойчивое выражение означает, что люди разошлись по своим жилищам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: была разбита
  rationale: Нифаль глагола נָגַף в военном контексте означает поражение в сражении; «была разбита» ясно передаёт результат боя.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: В данном контексте название южного царства; традиционная русская форма — «Иудея».
- source_word: לִפְנֵי
  choice: Израилем
  rationale: В формуле поражения перед противником русское творительное естественно передаёт значение «потерпеть поражение от»; буквальное «перед Израилем» здесь звучало бы неестественно.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Название северного царства в традиционной русской форме.
- source_word: וַיָּנֻסוּ
  choice: побежал
  rationale: Глагол נוּס означает «бежать, спасаться бегством»; форма единственного числа по-русски согласована с распределительным «каждый».
- source_word: אִישׁ
  choice: каждый
  rationale: Распределительное употребление אִישׁ указывает, что воины разбежались по отдельности; «каждый» естественно и точно передаёт эту функцию.
- source_word: לְאָהֳלוֹ
  choice: к своему шатру
  rationale: Сохранён буквальный образ «шатра», который в этой устойчивой формуле может также обозначать жилище или дом.
