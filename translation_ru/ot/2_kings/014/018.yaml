source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י אֲמַצְיָ֑הוּ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Остальные деяния Амасии — разве они не записаны в книге хроник царей Иудеи[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в летописи царей Иудеи».'
    reason: 'Лексическая альтернатива: דִּבְרֵי הַיָּמִים может обозначать хроники или летопись (анналы).'
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Остальные деяния
  rationale: יֶתֶר означает «остаток, остальное», а דִּבְרֵי в формуле о царствовании охватывает дела и события, а не только слова. Союз וְ имеет связующую функцию, которую в русском естественно передаёт сам переход к итоговой формуле без обязательного начального «и».
- source_word: אֲמַצְיָהוּ
  choice: Амасии
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: разве они не записаны
  rationale: Сохранён риторический вопрос, предполагающий утвердительный ответ; пассивное причастие передано естественной русской конструкцией настоящего времени.
- source_word: עַל סֵפֶר
  choice: в книге
  rationale: В формуле ссылки на письменный источник предлог עַל идиоматически передаётся русским «в», а סֵפֶר — словом «книга».
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: хроник царей Иудеи
  rationale: Сочетание обозначает царский анналистический источник. «Хроники» близко передаёт דִּבְרֵי הַיָּמִים, а оборот «царей Иудеи» естественно выражает отношение, заданное לְ.
