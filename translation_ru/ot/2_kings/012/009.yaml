  text: וַ/יֵּאֹ֖תוּ הַ/כֹּֽהֲנִ֑ים לְ/בִלְתִּ֤י קְחַת כֶּ֨סֶף֙ מֵ/אֵ֣ת הָ/עָ֔ם וּ/לְ/בִלְתִּ֥י חַזֵּ֖ק אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: ru
  text: Но священники согласились не брать у народа деньги и не устранять повреждения дома[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не укреплять повреждение дома»; это выражение означает ремонтировать повреждённые части здания.'
    reason: lexical_alternative
  - marker: b
    text: Под «домом» здесь подразумевается дом ГОСПОДА, то есть храм.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: согласились
  rationale: Глагол от אָבָה выражает согласие или готовность; в сочетании с последующими инфинитивными оборотами естественно передаётся как «согласились».
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное и контекстуально точное обозначение храмовых служителей.
- source_word: לְבִלְתִּי קְחַת
  choice: не брать
  rationale: Конструкция לְבִלְתִּי с инфинитивом выражает отказ или обязательство не совершать действие.
- source_word: כֶּסֶף
  choice: деньги
  rationale: Хотя буквальное значение — «серебро», в контексте храмовых сборов слово обозначает деньги.
- source_word: מֵאֵת הָעָם
  choice: у народа
  rationale: Естественная русская передача источника получения денег; по смыслу соответствует «от народа».
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: и не устранять
  rationale: חזק буквально означает «укреплять», но в сочетании с בֶּדֶק הַבַּיִת описывает ремонт, то есть устранение повреждений.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: повреждения дома
  rationale: בֶּדֶק обозначает трещину, пролом или иной ущерб, требующий ремонта; «дом» сохраняет древнееврейское обозначение храма, разъяснённое в примечании.
