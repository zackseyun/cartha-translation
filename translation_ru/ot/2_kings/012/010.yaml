  terminology: «Иодай», «Яхве», «жертвенник», «порог» и «серебро» уместны и последовательны. Передача יהוה как «Яхве» соответствует исходному тексту и заявленной политике. Сноски привязаны к соответствующим словам и не содержат структурных ошибок.
