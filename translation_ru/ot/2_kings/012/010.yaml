id: 2KI.12.10
reference: 2 Kings 12:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: ru
  text: Тогда священник Иодай взял сундук, проделал отверстие в его крышке[a] и поставил его возле жертвенника, справа от входящего в дом Яхве. Священники, охранявшие порог, клали туда всё серебро[b], приносимое в дом Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его дверце». В данном контексте, вероятно, имеется в виду крышка сундука.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все деньги». Еврейское слово «серебро» может также обозначать деньги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: сундук
  rationale: В контексте сбора пожертвований имеется в виду вместилище для серебра; «сундук» естественно по-русски и не вызывает ассоциации с ковчегом завета.
- source_word: וַיִּקֹּב חֹר
  choice: проделал отверстие
  rationale: Сочетание обозначает создание отверстия; эта формулировка точно передаёт действие без излишней конкретизации способа.
- source_word: בְּדַלְתּוֹ
  choice: в его крышке
  rationale: Буквально דלת — «дверца, дверь», но применительно к сундуку, вероятнее всего, имеется в виду подвижная крышка; неоднозначность отмечена в сноске.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: возле жертвенника
  rationale: אצל выражает непосредственную близость; «возле» естественно и пространственно ясно.
- source_word: בימין בְּבוֹא אִישׁ
  choice: справа от входящего
  rationale: Фраза задаёт правую сторону с точки зрения человека, входящего в храм; русский субстантивированный оборот сохраняет эту перспективу и мужской род единственного числа.
- source_word: שֹׁמְרֵי הַסַּף
  choice: охранявшие порог
  rationale: Передаёт буквальный образ и храмовую обязанность привратников без архаичной лексики.
- source_word: כָּל הַכֶּסֶף
  choice: всё серебро
  rationale: כסף буквально означает «серебро», а также может обозначать деньги; конкретное значение сохранено в тексте, расширительное отмечено в сноске.
- source_word: הַמּוּבָא
  choice: приносимое
  rationale: Пассивное причастие Hophal указывает на то, что серебро вносили в храм; настоящее причастие естественно описывает регулярный сбор.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» и прямую передачу божественного имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как собственное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет его как личное имя.
- issue: Мужской род единственного числа אִישׁ в пространственном ориентире
  choice: справа от входящего
  alternative: справа при входе; справа от любого входящего
  rationale: Выбранный оборот сохраняет представленную в источнике точку зрения отдельного входящего человека, не превращая выражение в безличное.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского повествования звучанием. Синтаксис упрощён для ясности, но пространственная перспектива и повтор «дом Яхве» сохранены.
