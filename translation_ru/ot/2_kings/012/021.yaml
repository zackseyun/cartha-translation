lexical_decisions:
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: В царском контексте слово обозначает подчинённых царя; «слуги» сохраняет широту еврейского выражения, не сужая его до чиновников или телохранителей.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: составили заговор
  rationale: Сочетание глагола и однокоренного существительного является еврейским идиоматическим выражением. По-русски естественно передать его как «составили заговор», не воспроизводя тяжеловесный этимологический повтор.
- source_word: וַיַּכּוּ
  choice: убили
  rationale: Глагол буквально означает «поразили», однако в данном повествовательном контексте удар смертелен, что подтверждается продолжением рассказа. «Убили» ясно передаёт фактический смысл действия.
- source_word: בֵּית מִלֹּא
  choice: Бет-Милло
  rationale: Сочетание понято как название места и передано транслитерацией, а не истолковано как «дом Милло».
- source_word: הַיּוֹרֵד סִלָּא
  choice: на спуске к Силле
  rationale: Фраза описывает нисходящий участок или подход в направлении Силлы; выбранная формулировка естественна по-русски и сохраняет топографический смысл.
- source_word: סִלָּא
  choice: Силла
  rationale: Название места передано принятой русской библейской транслитерацией.
