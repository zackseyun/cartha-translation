  text: כִּֽי לְ/עֹשֵׂ֥י הַ/מְּלָאכָ֖ה יִתְּנֻ֑/הוּ וְ/חִזְּקוּ ב֖/וֹ אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/015.yaml
  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: ru
  text: потому что они отдавали его тем, кто выполнял работы, а те на эти средства ремонтировали дом Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храм Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение сказанного в предыдущем стихе; причинное «потому что» естественно передаёт связь с контекстом.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: исполнителям работ
  rationale: Передаёт буквальное «делающим работу» современно и без ненужного уточнения ремесла или пола работников.
- source_word: יִתְּנֻהוּ
  choice: они отдавали его
  rationale: Имперфект в повествовательном контексте обозначает обычное, повторявшееся действие; объектный суффикс мужского рода передан местоимением «его» с опорой на предыдущий контекст.
- source_word: וְחִזְּקוּ
  choice: ремонтировали
  rationale: Буквальное значение — «укрепляли», но применительно к зданию глагол означает восстановление его исправности и прочности; «ремонтировали» ясно передаёт этот смысл.
- source_word: בּוֹ
  choice: на эти средства
  rationale: Местоимение относится к ранее упомянутым деньгам. Контекстуальное выражение устраняет неестественную для русского языка цепочку местоимений, не добавляя нового содержания.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет еврейский образ «дом» и передаёт личное имя יהוה как «Яхве»; в данном контексте речь идёт о храме.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Определение референта выражения בֵּית יְהוָה
  choice: дом Яхве с пояснением в сноске
  alternative: храм Яхве
  rationale: Основной текст сохраняет конкретный еврейский образ, а сноска сообщает его однозначное контекстуальное значение без подмены формулировки оригинала.
translation_notes:
  register: Современный литературный русский язык; причинная связь с предыдущим стихом сохранена. Конструкция «и те» естественно указывает на исполнителей работ как на ближайший субъект ремонта, а «на эти средства» ясно передаёт денежный референт בּוֹ.
