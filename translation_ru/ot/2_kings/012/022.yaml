base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: ru
  text: Иозавад, сын Шимеафы, и Иехозавад, сын Шомера, оба его слуги[a], поразили его, и он умер. Его похоронили с его предками в городе Давида, а его сын Амасия воцарился вместо него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его придворные». Еврейское עֲבָדָיו может обозначать слуг или царских служащих — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד
  choice: И Иозавад
  rationale: Союз сохраняет связь с предшествующим повествованием; имя передано в традиционной русской библейской форме.
- source_word: בֶּן שִׁמְעָת
  choice: сын Шимеафы
  rationale: Родословная конструкция передана естественно по-русски; женское имя Шимеафа согласуется с параллелью во 2 Пар 24:26.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: и Иехозавад, сын Шомера
  rationale: Личные имена переданы в традиционной русской транслитерации, а конструкция בֶּן — словом «сын».
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: עֶבֶד может обозначать слугу, раба или придворного служителя; контекст заговора допускает значение придворных, но «слуги» сохраняет более широкую лексику оригинала.
- source_word: הִכֻּהוּ
  choice: поразили его
  rationale: Форма от נכה означает нанесение удара; перевод не поглощает следующую отдельную фразу «и он умер».
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Сохранена простая последовательность повествовательных форм и отдельное указание на смерть.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Его похоронили
  rationale: Естественный русский порядок слов передаёт множественное неопределённо-личное действие без необходимости повторно называть заговорщиков.
- source_word: עִם אֲבֹתָיו
  choice: с его предками
  rationale: «Предки» ясно передаёт идиому о погребении среди династических праотцов и звучит естественнее в современном русском языке, чем буквальное «с отцами».
- source_word: בְּעִיר דָּוִד
  choice: в Городе Давида
  rationale: Устойчивое географическое название передано с прописной буквы.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: а вместо него воцарился его сын Амасия
  rationale: «Воцарился» естественно передаёт вступление на престол в формуле царского преемства; порядок компонентов адаптирован к русскому синтаксису.
