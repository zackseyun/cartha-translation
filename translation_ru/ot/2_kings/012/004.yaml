  source_fidelity: 'Основной смысл передан точно: רַק вводит оговорку, הַבָּמוֹת сохранено как историко-культовый термин, а עוֹד и причастия передают продолжающуюся практику народа. Однако «упразднены» обычно говорится о законах, учреждениях или порядках; для סָרוּ применительно к культовым местам точнее и естественнее «не были устранены».'
