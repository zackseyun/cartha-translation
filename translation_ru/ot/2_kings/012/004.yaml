base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: ru
  text: 'Однако высоты[a] не были устранены: народ по-прежнему приносил жертвы и воскурял благовония на высотах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилища». Буквально: «высоты»; так назывались местные культовые места.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Однако
  rationale: Передаёт ограничение предшествующей положительной оценки и естественно вводит исключение.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: высоты / на высотах
  rationale: Сохраняет историко-культовый термин для мест поклонения, обычно расположенных на возвышенностях; пояснение дано в сноске.
- source_word: לֹא סָרוּ
  choice: не были упразднены
  rationale: При подлежащем «высоты» выражает то, что эти культовые места не устранили и они продолжали действовать.
- source_word: עוֹד
  choice: по-прежнему
  rationale: Передаёт продолжавшееся обычное действие.
- source_word: הָעָם
  choice: народ
  rationale: Естественная передача собирательного обозначения населения.
- source_word: מְזַבְּחִים
  choice: приносил жертвы
  rationale: Передаёт длительное или обычное культовое действие причастия; по-русски звучит естественнее буквального «жертвовал».
- source_word: וּמְקַטְּרִים
  choice: и воскурял благовония
  rationale: В культовом контексте это наиболее вероятное и традиционно понятное значение; более широкая возможность сжигания приношений отмечена в сноске.
theological_decisions:
- issue: Оценка поклонения на высотах
  choice: Сохранить исторически описательный термин «высоты», не добавляя в основной текст прямой богословской оценки.
  alternative: Передать как «местные святилища» и тем самым сделать культовый характер явным.
  rationale: Контекст подразумевает неодобрение таких мест поклонения, но сам стих лишь сообщает, что они не были устранены и народ продолжал совершать там обряды.
- issue: Значение וּמְקַטְּרִים
  choice: «воскурял благовония» с указанием более широкого варианта в сноске.
  alternative: «сжигал приношения»
  rationale: Глагол может относиться как к воскурению благовоний, так и шире к превращению приношения в дым; основной вариант наиболее вероятен в данном сочетании, но смысловую широту не следует скрывать.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Термин «высоты» сохранён ради историко-религиозной точности и пояснён; синтаксис сделан ясным и естественным.
