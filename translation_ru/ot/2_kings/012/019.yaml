  source_fidelity: 'Основной смысл передан точно: Иоас берёт посвящённые ценности, включая ценности предшествующих царей и свои собственные, а также золото из храмовых и царских сокровищниц, и посылает их Азаилу; результатом становится прекращение его похода на Иерусалим. Однако «приношения» сужает הַקֳּדָשִׁים / קֳדָשָׁיו до культовых даров, хотя слово может охватывать посвящённые предметы и ценности вообще. Перевод «отступил» контекстуально оправдан, но последовательный союз лучше передать простым «и», а подразумеваемого субъекта назвать прямо.'
