  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: ru
  text: Иоас, царь Иудеи, взял все посвящённые предметы, которые посвятили Иосафат, Иорам и Охозия, его предки[a], цари Иудеи, а также свои посвящённые предметы и всё золото, находившееся в сокровищницах дома Яхве и царского дома, и послал всё это Азаилу, царю Арама. И Азаил отошёл от Иерусалима[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть его царственные предки или предшественники, а не непосредственные отцы.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «поднялся прочь от Иерусалима». В данном контексте это означает, что Азаил прекратил наступление на город и отошёл от него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Прямое значение לקח в данном повествовательном контексте; «захватил» неоправданно подразумевало бы насилие.
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  choice: священные приношения / свои священные приношения
  rationale: Передаёт предметы, посвящённые для священного употребления, и сохраняет лексическую связь между двумя формами; «приношения» естественнее по-русски, чем отвлечённое «святыни» в перечне храмовых ценностей.
- source_word: הִקְדִּישׁוּ
  choice: посвятили
  rationale: Хифиль קדש означает посвящение предметов для священного употребления.
- source_word: אֲבֹתָיו
  choice: его предки
  rationale: В царском генеалогическом контексте אָבוֹת означает не только непосредственных отцов, но царственных предшественников-предков; буквальное «отцы» в современном русском здесь может ввести в заблуждение.
- source_word: הַנִּמְצָא
  choice: находившееся
  rationale: Естественно передаёт причастие מצא со значением того, что имелось в сокровищницах, не добавляя идеи доступности.
- source_word: בְּאֹצְרוֹת
  choice: в сокровищницах
  rationale: Контекстуальное обозначение помещений или хранилищ храмовых и дворцовых ценностей.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохраняет буквальный образ «дома» и передаёт тетраграмматон как личное имя Яхве.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царского дома
  rationale: Сохраняет параллелизм с «домом Яхве»; по контексту речь идёт о дворце.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: послал всё это Азаилу
  rationale: «Всё это» ясно и естественно обобщает перечисленные приношения и золото.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: тогда тот отступил от Иерусалима
  rationale: Сочетание עלה с מעל в военном контексте указывает на прекращение наступления и удаление от города. Местоимение «тот» ясно относит действие к Азаилу, а «тогда» передаёт повествовательную последовательность без усиленного причинного вывода.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и согласуется с предоставленным аудированным слоем.
- issue: Характер передачи храмовых ценностей Азаилу
  choice: нейтральное «послал всё это»
  alternative: «отдал как дань» или «подкупил»
  rationale: Контекст допускает понимание платежа ради прекращения похода, но сам стих не называет его ни данью, ни подкупом; перевод не должен добавлять эту оценку.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка упрощён для ясности, но последовательность исходного перечня сохранена. Имена переданы в привычных русских библейских формах: Иоас, Иосафат, Иорам, Охозия, Азаил; אֲרָם передано как «Арам», чтобы не подменять древнее географическое название более интерпретирующим «Сирия».'
