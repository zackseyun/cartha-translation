source:
  edition: WLC
  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: ru
  text: И они передали взвешенное серебро[a] в распоряжение[b] работников, поставленных над домом Яхве[c], а те выплатили его плотникам и строителям, работавшим над домом Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отмеренное серебро» или «подсчитанные деньги».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на руку»; то есть под ответственность работников.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте стоит יהוה (ЙХВХ) — личное имя Бога, здесь переданное как «Яхве».
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: взвешенное серебро
  rationale: В храмовом финансовом контексте מְתֻכָּן обозначает серебро, количество которого было определено взвешиванием или иной мерой. «Взвешенное серебро» конкретно передаёт наиболее вероятный смысл, сохраняя предметное значение כֶּסֶף.
- source_word: עַל יַד
  choice: в распоряжение
  rationale: Буквально выражение связано с «рукой», но здесь обозначает передачу средств под чью-либо ответственность. «В распоряжение» естественно передаёт этот смысл по-русски; буквальный образ отмечен в сноске.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: работников
  rationale: Выражение обозначает людей, выполнявших храмовые работы. Нейтральное «работники» понятно современному читателю и не сужает их роль до одного ремесла.
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  choice: назначенных над домом Яхве
  rationale: Пассивное причастие указывает на людей, которым была поручена ответственность за работы при храме. Предлог «над» сохраняет возможный оттенок надзора, не превращая их явно в должностных «надзирателей».
- source_word: וַיּוֹצִיאֻהוּ
  choice: а те выдавали его
  rationale: Буквально глагол означает вынос или расходование, а в данном финансовом контексте — выдачу средств исполнителям. Местоименное «те» естественно связывает действие с назначенными работниками, ближайшей названной группой.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: плотникам
  rationale: Буквально это мастера по дереву; в строительном контексте естественный русский эквивалент — «плотники».
- source_word: וְלַבֹּנִים
  choice: и строителям
  rationale: בֹּנִים имеет широкое значение «строители». Текст не требует более узкого «каменщики».
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: работавшим над домом Яхве
  rationale: Причастный оборот описывает работу, производившуюся над храмом. Формулировка не добавляет прямо не выраженного здесь глагола «ремонтировать», хотя ремонт подразумевается контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» прямо передаёт это имя и не подменяет его титулом; русская форма «Иегова» отражает иную традицию произношения.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. «Дом Яхве» сохранён как традиционный и понятный образ храма; финансовые действия переданы естественной современной лексикой без излишне канцелярского «ассигновали» или «дисбурсировали».
