base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: ru
  text: и каменщикам[a], и каменотёсам, и на покупку древесины и камня из каменоломен[b], чтобы отремонтировать повреждённые места[c] в доме Яхве, и на всё, что расходовалось на дом, для его ремонта[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «строителям стен». Еврейское слово может обозначать шире работников, возводивших или ремонтировавших стены и каменную кладку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тёсаного камня». Буквально — «камней каменоломни».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «чтобы укрепить повреждение (или пролом) дома Яхве».'
    reason: literal_rendering
  - marker: d
    text: 'Буквально: «и на всё, что выходило на дом, чтобы укрепить его»; речь идёт обо всех расходах на ремонт здания.'
    reason: idiom_clarification
lexical_decisions:
- source_word: גֹּדְרִים
  choice: каменщикам
  rationale: Причастие от גדר обозначает работников, возводящих или ремонтирующих стены и каменную кладку. «Каменщикам» естественно в данном строительном контексте, хотя слово может иметь более широкое значение.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: каменотёсам
  rationale: Выражение обозначает работников, вырубающих или обрабатывающих камень; «каменотёсы» кратко и точно передаёт профессиональное наименование.
- source_word: לִקְנוֹת עֵצִים
  choice: на покупку древесины
  rationale: В контексте ремонта עֵצִים означает строительный лес или древесину, а не дрова.
- source_word: אַבְנֵי מַחְצֵב
  choice: камня из каменоломен
  rationale: Сочетание буквально указывает на камень, добытый в каменоломне; такой перевод сохраняет источник материала, не уточняя сверх текста степень его обработки.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: чтобы отремонтировать повреждённые места
  rationale: Буквально сочетание говорит об «укреплении повреждения/пролома», но по-русски естественно передать обозначенное действие как ремонт повреждённых мест, сохранив объект ремонта.
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: «Дом» сохраняет образное и буквальное обозначение храма, а личное имя יהוה передано как «Яхве».
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: и на всё, что расходовалось на этот дом
  rationale: Выражение «что выходит на дом» является финансовой идиомой и означает средства или расходы, шедшие на здание.
- source_word: לְחָזְקָה
  choice: чтобы восстановить его
  rationale: Повторный глагол חזק выражает цель затрат — привести здание в прочное, исправное состояние. «Восстановить» звучит естественно и сохраняет связь с ремонтными работами.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» передаёт личное имя в еврейском тексте, не заменяя его титулом и не привнося конфессионального предпочтения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет характер перечисления и связь с предшествующим контекстом, поэтому стих начинается со строчной буквы и союза «и». Профессиональные и строительные термины выбраны понятными современному читателю; неестественные буквальные сочетания разъяснены в сносках.
