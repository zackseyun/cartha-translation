revisions:
- from: И когда они видели, что в сундуке набралось много серебра, царский писец и первосвященник приходили, связывали в мешки и пересчитывали серебро, найденное в доме ГОСПОДА.
  to: И когда они видели, что в сундуке много серебра, царский писец и первосвященник поднимались, связывали серебро в связки и пересчитывали серебро, найденное в доме ГОСПОДА.
  rationale: Сохранены повторяемость процедуры и порядок действий оригинала. «Поднимались» точнее передаёт וַיַּעַל, а «связывали серебро в связки» отражает וַיָּצֻרוּ без добавления «мешков».
