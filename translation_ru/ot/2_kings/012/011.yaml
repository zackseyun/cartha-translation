  - severity: medium
    issue: Необоснованная конкретизация в «связывали в мешки»
    rationale: Еврейский текст говорит о связывании/увязывании, но не называет мешки. «В связки» передаёт результат действия без добавления тары.
  revised_text: И когда они видели, что в сундуке много серебра, царский писец и первосвященник поднимались, связывали серебро в связки и пересчитывали серебро, найденное в доме ГОСПОДА.
