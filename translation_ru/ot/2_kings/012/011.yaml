  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: ru
  text: И когда они видели, что в сундуке много серебра, царский писец и первосвященник поднимались, связывали серебро в связки и пересчитывали серебро, найденное в доме ГОСПОДА.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִרְאוֹתָם כִּי רַב הַכֶּסֶף
  choice: когда они видели, что в сундуке набралось много серебра
  rationale: Оборот передаёт повторяющуюся ситуацию; «набралось» естественно выражает накопление серебра в сундуке.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: царский писец
  rationale: Обычное и точное обозначение придворного должностного лица, ведавшего письменными и финансовыми делами.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященник
  rationale: Устоявшийся русский эквивалент буквального «великий священник».
- source_word: וַיָּצֻרוּ
  choice: связывали в мешки
  rationale: По контексту деньги упаковывали и завязывали; добавление «в мешки» делает подразумеваемое действие понятным, не меняя его смысла.
- source_word: בֵית יְהוָה
  choice: дом ГОСПОДА
  rationale: «Дом» сохраняет храмовую метафору оригинала; тетраграмматон передан традиционным титулом прописными буквами.
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДА
  alternative: Яхве
  rationale: Традиционная русская передача сохраняет различимость тетраграмматона посредством прописных букв и соответствует консультационному тексту, не вводя конфессионально маркированного произношения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Несовершенный вид «приходили, связывали, пересчитывали» передаёт повторяемость процедуры, заложенную контекстом и английским consultation layer.
