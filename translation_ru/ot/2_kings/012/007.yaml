  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: ru
  text: На двадцать третьем году царствования царя Иоаса священники не устранили повреждения в храме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повреждения дома»; речь идёт о храме. Возможный перевод: «проломы в храме».'
    reason: Сохраняет буквальное значение הַבָּיִת и более узкую лексическую возможность для בֶּדֶק.
lexical_decisions:
- source_word: וַיְהִי
  choice: На … году …
  rationale: Нарративная форма вводит новый этап повествования. В естественном русском языке её связующая функция передаётся самой временной конструкцией без отдельного «и было».
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: на двадцать третьем году царствования царя Иоаса
  rationale: Стандартная формула датировки по годам правления; добавление «царствования» естественно раскрывает функцию לַמֶּלֶךְ по-русски.
- source_word: לֹא חִזְּקוּ
  choice: всё ещё не устранили
  rationale: В сочетании с בֶּדֶק הַבָּיִת глагол חזק означает проведение необходимых строительных работ. «Всё ещё не» передаёт достигнутый к двадцать третьему году отрицательный результат, не превращая выражение в буквальное «не укрепили».
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямой современный русский эквивалент.
- source_word: בֶּדֶק הַבָּיִת
  choice: повреждения в храме
  rationale: בֶּדֶק обозначает трещины, проломы или иные повреждённые места, требующие ремонта. הַבָּיִת буквально значит «дом», но в данном контексте однозначно относится к храму; явное «храм» предотвращает непонимание у современного читателя.
