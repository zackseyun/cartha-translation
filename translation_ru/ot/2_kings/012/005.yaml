  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: ru
  text: 'И сказал Иоас священникам: «Всё серебро, посвящённое Богу, которое приносят в дом Яхве, — серебро от каждого, кто проходит перепись[a], серебро за оценку людей[b] и всё серебро, которое человек пожелает принести в дом Яхве[c], —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро каждого проходящего»; вероятно, имеется в виду платёж тех, кто проходил перепись (ср. Исх. 30:13–16).'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеются в виду выплаты, связанные с установленной оценкой людей (ср. Лев. 27:2–8).
    reason: cross_reference
  - marker: c
    text: 'Буквально: «которое взойдёт на сердце человека» — то есть которое человек добровольно пожелает принести.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: всё серебро, посвящённое Богу
  rationale: 'Краткая естественная передача конструктивного сочетания «всё серебро святынь»: речь идёт о серебре, имеющем священный, посвящённый статус, а не о материале самих святынь.'
- source_word: יוּבָא בֵית יְהוָה
  choice: которое приносят в дом Яхве
  rationale: Русская неопределённо-личная конструкция естественно передаёт каузативно-пассивную форму יוּבָא; «дом Яхве» обозначает храм.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, а не заменено титулом.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: серебро от каждого, кто проходит исчисление
  rationale: Сохранён образ «проходящего», но добавлено подразумеваемое исчисление, вероятно связанное с податью при переписи; примечание отмечает буквальную форму и контекстуальную неопределённость.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: серебро за людей согласно их оценке
  rationale: Сжатая еврейская формула относится к денежной оценке людей; русский текст сохраняет юридико-культовый смысл, не вводя слово «обет» непосредственно в основной текст.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: всё серебро, которое кто-либо по велению сердца решит принести
  rationale: Передан смысл еврейской идиомы о добровольном внутреннем побуждении; её буквальный образ указан в примечании.
- source_word: לְהָבִיא בֵּית יְהוָה
  choice: принести в дом Яхве
  rationale: Инфинитив выражает намерение, а направление передано предлогом «в» в соответствии с контекстом внесения серебра в храм.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер платежа в выражении כֶּסֶף עוֹבֵר אִישׁ
  choice: платёж проходящих исчисление
  alternative: 'буквально: «серебро каждого проходящего»'
  rationale: Контекст Исх. 30:13–16 поддерживает связь с переписью, но примечание сохраняет буквальную форму и не представляет контекстуальное толкование как бесспорное.
- issue: Оценка людей в כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: серебро за людей согласно их оценке
  alternative: серебро за оценку людей
  rationale: Формулировка сохраняет вероятную связь с установленными выплатами за оценённых людей, не уточняя сверх текста, обязательно ли здесь имеются в виду именно обетные выплаты.
translation_notes:
  register: 'Современный литературный русский язык с достоинством храмово-правового контекста. Термин «серебро» сохранён вместо общего «деньги», поскольку כֶּסֶף здесь может обозначать и денежное серебро, и платёж. Незавершённость высказывания в стихе сохранена конечным тире: синтаксическое продолжение следует в следующем стихе.'
