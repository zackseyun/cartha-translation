base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: ru
  text: 'И царь Иоас призвал священника Иодая и священников и сказал им: «Почему вы не устраняете повреждения в доме[a][b]? А теперь не берите денег у своих знакомых[c], а отдавайте их на ремонт дома».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «домом» здесь подразумевается храм Господа.
    reason: cultural_note
  - marker: b
    text: 'Или: «не заделываете проломы в доме»; еврейское выражение может обозначать повреждения, проломы или места, требующие ремонта.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское слово имеет не вполне ясный смысл в этом контексте; возможны переводы: «у тех, кого вы знаете», «у жертвователей» или «у вкладчиков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: В данном повествовательном контексте קרא с предлогом ל означает позвать или призвать кого-либо; «призвал» естественно передаёт официальный вызов царём.
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: царь Иоас
  rationale: Использована закрепившаяся в русской библейской традиции форма имени Иоас; титул поставлен перед именем согласно естественному русскому порядку слов.
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: священника Иодая и священников
  rationale: Сохранены оба элемента еврейского текста без добавления слова «остальных», которого в оригинале нет.
- source_word: אֵינְכֶם מְחַזְּקִים אֶת בֶּדֶק הַבָּיִת
  choice: вы не устраняете повреждения в доме
  rationale: חזק буквально связано с укреплением, но в сочетании с בדק הבית обозначает проведение необходимых восстановительных работ. Формулировка передаёт действие над повреждёнными местами, сохраняя образ «дома».
- source_word: בֶּדֶק הַבָּיִת
  choice: повреждения в доме / ремонт дома
  rationale: בדק может обозначать повреждение, пролом или требующий ремонта участок. При первом употреблении передан объект работ, при повторном — их назначение; такое варьирование естественно по-русски и сохраняет смысловую связь.
- source_word: וְעַתָּה
  choice: Отныне
  rationale: В контексте царского распоряжения выражение вводит изменение прежнего порядка; «Отныне» ясно и естественно передаёт эту переходную функцию.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: не берите денег
  rationale: כֶּסֶף здесь обозначает не материал «серебро», а денежные средства, собираемые на храм.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: у своих знакомых
  rationale: מַכָּר обычно означает знакомого или того, с кем человек состоит в отношениях. Контекст допускает понимание этих людей как жертвователей, однако более буквальное «знакомых» сохраняет лексическую трудность и не выдаёт контекстуальное толкование за несомненное.
- source_word: כִּי
  choice: а
  rationale: Здесь частица вводит противопоставленное предписание после запрета; русское «а» естественно передаёт корректирующий переход.
- source_word: לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: отдавайте их на ремонт дома
  rationale: Предлог ל выражает назначение средств, а местоименный суффикс отсылает к деньгам. Множественное «их» согласовано с естественным русским осмыслением слова «деньги».
