id: 2KI.12.14
reference: 2 Kings 12:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: ru
  text: Однако из денег, приносимых в дом Яхве, не делали для дома Яхве серебряных чаш[a], щипцов для светильников[b], чаш для окропления[c], труб и вообще никаких золотых или серебряных сосудов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряных сосудов». Точное обозначение формы этих ёмкостей неясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово, вероятно, обозначает принадлежности для ухода за фитилями; возможно: «ножниц для фитилей».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «чаш». Уточнение указывает на их вероятное применение при храмовых обрядах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Однако
  rationale: Передаёт противопоставление предыдущему стиху естественным для современного русского языка союзом.
- source_word: יֵעָשֶׂה
  choice: не делали
  rationale: Еврейская форма — нифаль, но русская неопределённо-личная конструкция естественно передаёт безлично-пассивный смысл и обычную практику.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет формальное обозначение святилища и повтор исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: סִפּוֹת כֶּסֶף
  choice: серебряные чаши
  rationale: סִפּוֹת обозначает ёмкости или чаши; выбран общий храмовый термин, отличимый от последующего מִזְרָקוֹת благодаря функциональному уточнению последнего.
- source_word: מְזַמְּרוֹת
  choice: щипцы для светильников
  rationale: В храмовом контексте слово, вероятно, обозначает принадлежность для ухода за фитилями; функциональный перевод понятнее современному читателю, при этом не скрывает неопределённость в сноске.
- source_word: מִזְרָקוֹת
  choice: чаши для окропления
  rationale: Передаёт не только форму предмета, но и вероятную ритуальную функцию таких чаш.
- source_word: חֲצֹצְרוֹת
  choice: трубы
  rationale: Обычное русское обозначение культовых металлических труб.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: вообще никаких золотых или серебряных сосудов
  rationale: Передаёт обобщающее כָּל и широкое значение כְּלִי в контексте храмовой утвари; «вообще» естественно вводит итог после перечня.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: из денег, приносимых
  rationale: В административном контексте כֶּסֶף обозначает денежные пожертвования, а причастие הַמּוּבָא — поступавшие в храм средства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя Бога и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор «дом Яхве» сохранён вслед за еврейским текстом; перечень передан ритмично, а заключительное обобщение — естественной русской конструкцией.
