lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: делал то, что было правильно
  rationale: Сохраняет смысл обычной формулы нравственной оценки в книгах Царств и естественно передаёт субстантивированное הַיָּשָׁר без конфессиональной конкретизации.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Передаёт прозрачный древнееврейский образ оценки с точки зрения Бога и сохраняет личное имя יהוה.
- source_word: כָּל יָמָיו אֲשֶׁר
  choice: всё то время, пока
  rationale: В контексте относительное предложение естественно ограничивает период правильного поведения днями наставничества Иодая; более буквальная и альтернативная синтаксическая трактовка отмечена в сноске.
- source_word: הוֹרָהוּ
  choice: наставлял его
  rationale: Форма породы хифиль от ירה означает учить, наставлять или направлять; «наставлял» естественно описывает длительное духовное руководство.
- source_word: יְהוֹאָשׁ
  choice: Иоас
  rationale: Традиционная русская библейская форма имени, понятная читателю.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: священник Иодай
  rationale: Традиционная русская форма имени и естественный для русского языка порядок приложения.
theological_decisions:
- issue: Временные рамки праведного поведения Иоаса
  choice: Основной текст связывает правильное поведение Иоаса с периодом, когда Иодай наставлял его.
  alternative: 'Возможна трактовка: Иоас поступал правильно всю жизнь, потому что священник Иодай наставлял его.'
  rationale: Последовательность כָּל יָמָיו אֲשֶׁר הוֹרָהוּ допускает присоединение относительного предложения к «его дням», что создаёт временное ограничение. При этом синтаксис допускает более широкое понимание, поэтому альтернативу следует сохранить в сноске, не снимая повествовательного напряжения.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства повествования. Использованы традиционные русские формы имён Иоас и Иодай; тетраграмматон передан как личное имя «Яхве». Формулировка понятна широкому читателю и не вводит конфессионально обусловленных толкований.
