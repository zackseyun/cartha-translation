lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: было семь лет
  rationale: Еврейская конструкция «сын семи лет» является обычной формулой указания возраста; современный русский естественно передаёт её как «ему было семь лет».
- source_word: יְהוֹאָשׁ
  choice: Иоас
  rationale: Традиционная русская библейская передача имени; сноска сохраняет более полное звучание еврейской формы.
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Предлог ב с инфинитивом מלך и местоименным суффиксом образует временную конструкцию. В данном контексте речь идёт о вступлении на царство, что естественно выражается по-русски словами «когда он стал царём».
