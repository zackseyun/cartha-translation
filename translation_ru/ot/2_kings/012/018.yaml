base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: ru
  text: Тогда Хазаил, царь Арама[a], выступил против Гефа, сражался с ним и захватил его; затем он намеревался выступить против Иерусалима[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Арам — древнее название страны, которую в традиционных переводах часто называют Сирией.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «обратил лицо своё, чтобы пойти против Иерусалима»; то есть твёрдо намеревался выступить против него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной повествовательный переход и естественно связывает событие с предыдущим контекстом.
- source_word: יַעֲלֶה
  choice: пошёл войной
  rationale: В данном военном контексте עלה обозначает выступление против города; перевод передаёт движение и враждебную цель без излишней буквальности.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Хазаил, царь Арама
  rationale: Имена переданы в принятой русской библейской форме; «Арам» непосредственно отражает еврейское этногеографическое название.
- source_word: וַיִּלָּחֶם עַל
  choice: пошёл войной на
  rationale: Сочетание означает ведение войны против кого-либо или чего-либо; по-русски эта формулировка естественна в историческом повествовании.
- source_word: גַּת
  choice: Геф
  rationale: Использована устоявшаяся русская библейская форма названия города.
- source_word: וַיִּלְכְּדָהּ
  choice: захватил его
  rationale: Глагол לכד в контексте завоевания города означает «захватить»; местоимение согласовано с русским названием «Геф».
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: решил выступить
  rationale: Еврейская идиома буквально говорит, что Хазаил «обратил своё лицо»; здесь она выражает целенаправленное намерение, естественно передаваемое глаголом «решил».
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: выступить против Иерусалима
  rationale: Сохраняет военное направление движения против города, не утверждая, что нападение уже состоялось.
