  - severity: low
    issue: «Решил выступить» несколько сильнее, чем указание на направленное намерение.
    rationale: Идиома שׂוּם פָּנִים обозначает решительную направленность/намерение. «Намереваясь выступить» передаёт это без излишнего акцента на уже принятом решении.
