  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Прочие деяния Иоаса и всё, что он совершил, разве не записаны в книге летописей царей Иудеи[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в книге анналов царей Иудеи». Еврейское выражение может обозначать официальные царские записи или летопись.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Прочие деяния
  rationale: יֶתֶר означает оставшуюся часть, а דִּבְרֵי в устойчивой формуле о царствовании обозначает дела или события. «Прочие деяния» естественно передаёт эту формулу по-русски.
- source_word: יוֹאָשׁ
  choice: Иоас
  rationale: Традиционная и узнаваемая русская форма имени этого иудейского царя.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: и всё, что он совершил
  rationale: Сохраняет всеохватность כָל и относительную конструкцию; «совершил» позволяет избежать неуклюжего повтора слова «дела».
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записаны
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит применительно к письменному источнику.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: Хотя עַל буквально может означать «на», в русском языке о содержании письменного источника естественно говорить «записаны в книге».
- source_word: דִּבְרֵי הַיָּמִים
  choice: летописи
  rationale: В названии царского источника выражение обозначает хронологические записи или анналы; «летопись» является точным и привычным русским соответствием.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: Предлог לְ в формуле названия выражает отношение записей к иудейским царям; русский родительный падеж передаёт его естественно.
