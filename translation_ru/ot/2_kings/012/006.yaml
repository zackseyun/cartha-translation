  text: יִקְח֤וּ לָ/הֶם֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ מֵ/אֵ֣ת מַכָּר֑/וֹ וְ/הֵ֗ם יְחַזְּקוּ֙ אֶת בֶּ֣דֶק הַ/בַּ֔יִת לְ/כֹ֛ל אֲשֶׁר יִמָּצֵ֥א שָׁ֖ם בָּֽדֶק־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: ru
  text: Пусть священники берут себе — каждый от своего знакомого[a], — а сами пусть устраняют повреждения дома[b] всюду, где обнаружится повреждение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от человека, с которым он знаком» или «от человека, с которым он имеет дело». В данном контексте это, вероятно, человек, от которого священник получал пожертвования.'
    reason: lexical_alternative
  - marker: b
    text: «Дом» здесь — храм Господа.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם
  choice: пусть ... берут себе деньги
  rationale: Форма глагола передаёт предписание; לָהֶם указывает на получение священниками. Слово «деньги» восполнено из непосредственного контекста храмовых сборов и делает по-русски ясным подразумеваемый объект.
- source_word: הַכֹּהֲנִים אִישׁ
  choice: священники ... каждый
  rationale: 'אִישׁ употреблено дистрибутивно: речь идёт о каждом священнике в отдельности.'
- source_word: מֵאֵת מַכָּרוֹ
  choice: от своего знакомого
  rationale: מַכָּר буквально обозначает знакомого или человека, с которым имеются отношения. Основной текст сохраняет эту лексическую неопределённость, не заменяя её более узким «жертвователь».
- source_word: וְהֵם יְחַזְּקוּ
  choice: и сами устраняют
  rationale: Самостоятельное местоимение וְהֵם подчёркивает ответственность именно священников; в контексте здания חזק означает восстановление или ремонт.
- source_word: בֶּדֶק הַבַּיִת
  choice: повреждения дома
  rationale: בֶּדֶק — повреждение, трещина или пролом, требующие ремонта; הַבַּיִת буквально означает «дом» и здесь обозначает храм.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: везде, где обнаружится повреждение
  rationale: Передаёт полный охват всех обнаруженных в здании повреждений и сохраняет повтор ключевого существительного בֶּדֶק.
