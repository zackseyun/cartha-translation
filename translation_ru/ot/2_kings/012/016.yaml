  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: ru
  text: Но у людей, которым передавали деньги, чтобы они выдавали их работникам, не требовали отчёта[a], потому что они поступали добросовестно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не производили с людьми расчёта»; то есть не проверяли их отчётность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «честно»; «с верностью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: не сводили счётов
  rationale: Пиэль глагола חשׁב в данном контексте означает рассчитываться или проверять отчётность. Выражение «не сводили счётов» сохраняет финансово-учётный оттенок и естественно звучит по-русски.
- source_word: הָאֲנָשִׁים
  choice: с людьми
  rationale: Множественное число אישׁ обозначает здесь конкретных мужчин, распоряжавшихся средствами; русское «люди» в данном контексте естественно обозначает этих ответственных лиц без изменения референта.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: которым вверяли
  rationale: Буквально «давали в их руку» — идиома передачи денег в чьё-либо распоряжение. «Вверяли» естественно передаёт ответственность и доверие, заключённые в обороте.
- source_word: הַכֶּסֶף
  choice: деньги
  rationale: כֶּסֶף может означать серебро или деньги; в контексте финансирования храмовых работ речь идёт о денежных средствах.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: тем, кто выполнял работу
  rationale: Причастный оборот буквально обозначает выполняющих работу. Такой перевод сохраняет конструкцию и остаётся понятным современному читателю.
- source_word: בֶאֱמֻנָה
  choice: добросовестно
  rationale: В контексте распоряжения средствами אֱמוּנָה указывает на надёжность, честность и верность порученному делу. «Добросовестно» естественно охватывает эти оттенки.
- source_word: הֵם עֹשִׂים
  choice: они поступали
  rationale: Буквально «они делали»; в сочетании с обстоятельством образа действия речь идёт об их поведении при исполнении поручения, что по-русски естественно передаётся как «поступали».
