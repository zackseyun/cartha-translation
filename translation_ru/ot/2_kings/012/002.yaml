base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: ru
  text: В седьмой год правления Ииуя Иоас стал царём и царствовал в Иерусалиме сорок лет. Его мать звали Цивья; она была из Вирсавии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: В седьмой год правления Ииуя
  rationale: Стандартная формула датировки по годам царствования; добавление «правления» естественно для современного русского языка и ясно выражает хронологический смысл.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: Иоас стал царём
  rationale: В формуле вступления на престол глагол имеет начинательное значение; перевод отличает начало царствования от следующего сообщения о его продолжительности.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ בִּירוּשָׁלִָם
  choice: и царствовал в Иерусалиме сорок лет
  rationale: Здесь מָלַךְ обозначает продолжительность правления; русский порядок слов звучит естественно и сохраняет место и срок царствования.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественный современный русский эквивалент еврейской именной формулы без потери содержания.
- source_word: צִבְיָה
  choice: Цивья
  rationale: Транслитерация еврейского личного имени צִבְיָה, сохраняющая согласный вав; форма помогает отличить это имя от названия животного «серна».
- source_word: מִבְּאֵר שָׁבַע
  choice: она была из Вирсавии
  rationale: Предлог מִן указывает на происхождение. Отдельное предложение устраняет возможную для русского языка двусмысленность и ясно связывает Вирсавию с матерью царя.
