  source_fidelity: 'Текст точно передаёт еврейский оригинал: כֶּסֶף уместно передано как «деньги» с указанной альтернативой «серебро»; אָשָׁם — «жертва повинности»; חַטָּאוֹת в жертвенном значении — «жертвы за грех». Отрицательная пассивная форма «не вносились» естественно выражает установленный порядок, а заключительное «они принадлежали священникам» верно передаёт לַכֹּהֲנִים יִהְיוּ. Имя יהוה последовательно передано как «Яхве».'
