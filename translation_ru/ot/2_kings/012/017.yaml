id: 2KI.12.17
reference: 2 Kings 12:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: ru
  text: Деньги[a] за жертву повинности и деньги за жертвы за грех не вносились в дом Яхве[b]; они принадлежали священникам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебро».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть в храм Яхве. Буквально: «в дом Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: деньги
  rationale: Хотя слово буквально означает «серебро», в контексте храмовых поступлений речь идёт о денежных средствах; буквальный вариант сохранён в сноске.
- source_word: אָשָׁם
  choice: жертва повинности
  rationale: В жертвенном контексте термин обозначает установленную жертву, связанную с виной и возмещением; «жертва повинности» — ясное и устойчивое русское соответствие.
- source_word: חַטָּאוֹת
  choice: жертвы за грех
  rationale: Здесь множественное число обозначает вид жертвоприношений, а не сами грехи. Вариант «очистительные жертвы» возможен, но менее непосредственно передаёт традиционное название этой категории.
- source_word: לֹא יוּבָא
  choice: не вносились
  rationale: Отрицательная пассивная форма в данном административном контексте выражает установленный порядок обращения с этими деньгами; несовершенный вид передаёт обычную практику без излишне жёсткой модализации.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется буквальный образ «дома» и личное имя Бога; из контекста речь идёт о храме, что пояснено в сноске.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: они принадлежали священникам
  rationale: Конструкция указывает на принадлежность или назначение средств священникам; русское множественное число согласуется со словом «деньги».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя יהוה. «Яхве» прямо передаёт личное имя, не заменяя его титулом и не утверждая менее вероятную вокализацию.
- issue: Характер средств от жертв
  choice: деньги принадлежали священникам и не поступали в храмовый фонд
  alternative: серебро физически не приносили в здание храма
  rationale: Контекст храмовых финансов и заключительная оговорка о принадлежности священникам указывают прежде всего на порядок распределения средств, однако формулировка «не вносились в дом» сохраняет конкретный образ исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной жертвенной терминологией. Синтаксис остаётся близким к еврейскому, но естественным для обычного читателя; сохранены различие между единственной жертвой повинности и множественным обозначением жертв за грех, а также образ «дома Яхве».
