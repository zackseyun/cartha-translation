source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: ru
  text: И сделаю дом Ахава подобным дому Иеровоама, сына Навата, и дому Ваасы, сына Ахии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «династию Ахава — подобной династии Иеровоама… и династии Ваасы». Еврейское слово «дом» здесь означает царский род, или династию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתִּי
  choice: И сделаю
  rationale: 'Глагол נתן буквально означает «дать, положить, поставить», но здесь вместе с прямым дополнением и сравнительными оборотами выражает результат: Бог сделает дом Ахава подобным ранее уничтоженным царским домам.'
- source_word: בֵּית אַחְאָב
  choice: дом Ахава
  rationale: Слово בַּיִת в данном контексте обозначает царский дом, то есть династию; буквальный образ «дом» сохраняет библейскую формулу и её межтекстовые связи.
- source_word: כְ/בֵית ... וּ/כְ/בֵית
  choice: подобным дому ... и дому
  rationale: Предлог כ выражает сравнение. В русском достаточно один раз употребить «подобным», распространив его на оба однородных сравнительных дополнения.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Имена переданы в принятой русской библейской форме; конструкция родства ясно выражена приложением.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Ваасы, сына Ахии
  rationale: Имена переданы в принятой русской библейской форме; упоминание предка сохраняет историческую отсылку исходного текста.
theological_decisions:
- issue: Формула суда над царским домом
  choice: дом Ахава ... дому Иеровоама ... дому Ваасы
  alternative: династию Ахава ... династии Иеровоама ... династии Ваасы
  rationale: «Дом» сохраняет метафору еврейского текста и связь с библейскими повествованиями о суде над прежними царскими родами. Значение «династия» поясняется в сноске, а не подставляется в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной библейской метафоры «дом» и принятых русских форм имён. Синтаксис слегка уплотнён по нормам русского языка без устранения параллелизма исходного текста.
