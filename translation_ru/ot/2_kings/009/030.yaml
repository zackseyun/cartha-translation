base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: ru
  text: Когда Ииуй прибыл в Изреель, Иезавель услышала об этом. Она подвела глаза сурьмой[a], украсила голову[b] и посмотрела из окна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «наложила сурьму на глаза».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «привела в порядок волосы»; буквально по-древнееврейски: «сделала свою голову хорошей (красивой)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: прибыл
  rationale: В данном повествовательном контексте глагол обозначает прибытие Ииуя; «прибыл» естественно передаёт завершённое движение к городу.
- source_word: יִזְרְעֶאלָה
  choice: в Изреель
  rationale: Направительный суффикс -ה указывает на движение к Изреелю; по-русски это естественно передаётся сочетанием «прибыл в Изреель».
- source_word: שָׁמְעָה
  choice: услышала об этом
  rationale: Объект глагола подразумевается из контекста — речь идёт о прибытии Ииуя. Его экспликация делает русский текст ясным, не добавляя новой информации.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: подвела глаза сурьмой
  rationale: פּוּךְ обозначает тёмное косметическое средство для глаз. Выражение «подвела глаза сурьмой» конкретно и естественно передаёт описанное действие.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: украсила голову
  rationale: Буквально выражение означает «сделала голову хорошей/красивой». Выбор сохраняет широту древнееврейской формулировки и не сводит её без достаточных оснований только к укладке волос.
- source_word: וַתַּשְׁקֵף
  choice: посмотрела
  rationale: Глагол описывает взгляд наружу, нередко сверху или из проёма; нейтральное «посмотрела» естественно сочетается с уточнением «из окна».
- source_word: בְּעַד הַחַלּוֹן
  choice: из окна
  rationale: Хотя предлог может буквально обозначать взгляд «через» проём, русское «посмотрела из окна» естественно передаёт ту же пространственную ситуацию.
