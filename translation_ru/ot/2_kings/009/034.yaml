base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: ru
  text: 'Затем он вошёл, поел и выпил, а потом сказал: «Позаботьтесь, пожалуйста, об этой проклятой женщине[a] и похороните её, ведь она — царская дочь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «об этой проклятой».'
    reason: В еврейском тексте употреблена субстантивированная форма женского рода без существительного «женщина».
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Затем он вошёл
  rationale: בוא в данном повествовательном контексте означает, что Ииуй вошёл внутрь, вероятно во дворец; «вошёл» естественно и точно передаёт движение внутрь.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: поел и выпил
  rationale: В еврейском тексте объекты не названы. Совершенный вид естественно передаёт последовательность завершённых повествовательных действий, не добавляя упоминания вина.
- source_word: פִּקְדוּ נָא
  choice: Позаботьтесь, пожалуйста
  rationale: פקד здесь означает обратить внимание на кого-либо или распорядиться о нём; частица נָא смягчает повеление и передана словом «пожалуйста». Формулировка остаётся понятной и не вводит значения «разыщите», которого сам глагол здесь не требует.
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: об этой проклятой женщине[a]
  rationale: Форма женского рода относится к Иезавели и употреблена субстантивно. Слово «женщине» добавлено для естественности русского языка, а буквальная форма отмечена в сноске.
- source_word: וְקִבְרֻהָ
  choice: и похороните её
  rationale: Прямое повеление с местоименным суффиксом женского рода; «похороните её» — ясная и современная передача.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: ведь она — царская дочь
  rationale: כִּי вводит основание для погребения. Выражение בַת מֶלֶךְ указывает на царское происхождение; «царская дочь» естественно передаёт это без необходимости называть конкретного царя.
