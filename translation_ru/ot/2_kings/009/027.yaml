base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: ru
  text: 'Когда Охозия, царь Иудеи, увидел это, он бежал по дороге к Бет-Гану[a]. Ииуй погнался за ним и приказал: «И его поразите в колеснице[b] — на подъёме у Гура, близ Ивлеама!» Охозия бежал в Мегиддо и там умер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Бет-Ган» может буквально означать «дом сада», но здесь, вероятнее всего, это название места.
    reason: cultural_note
  - marker: b
    text: 'Или: «поразите его у колесницы» либо «поразите его, направив удар в колесницу»; еврейский предлог допускает указание как на место, так и на направление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: увидел это
  rationale: В еврейском тексте объект не выражен, но по контексту подразумевается увиденное Охозией поражение Иорама; местоимение «это» естественно передаёт подразумеваемый объект, не уточняя его сверх текста.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: по дороге к Бет-Гану
  rationale: דֶּרֶךְ означает «дорога, путь», а בֵּית הַגָּן здесь, вероятнее всего, является географическим названием. Русская формулировка естественно выражает направление бегства.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: погнался за ним
  rationale: Сочетание רדף с אַחַר обозначает преследование кого-либо; «погнался за ним» точно и естественно передаёт эту динамику.
- source_word: גַּם אֹתוֹ
  choice: и его
  rationale: 'Частица גַּם имеет присоединительное значение: Охозию надлежит поразить наряду с Иорамом.'
- source_word: הַכֻּהוּ
  choice: поразите
  rationale: Императив от נכה означает «ударить, поразить». «Поразите» сохраняет широту значения и не усиливает приказ до прямого «убейте».
- source_word: אֶל הַמֶּרְכָּבָה
  choice: в колеснице
  rationale: Хотя אֶל обычно указывает направление «к, в», здесь выражение, вероятно, относится к Охозии как находящемуся в колеснице. Неоднозначность предлога отмечена в сноске.
- source_word: בְּמַעֲלֵה גוּר
  choice: на подъёме к Гуру
  rationale: מַעֲלֶה обозначает подъём или ведущую вверх дорогу; выбранная формулировка ясно передаёт топографический смысл.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: близ Ивлеама
  rationale: Оборот определяет местонахождение подъёма к Гуру относительно Ивлеама; «близ» не навязывает чрезмерно точного пространственного отношения.
- source_word: וַיָּנָס מְגִדּוֹ וַיָּמָת שָׁם
  choice: Охозия бежал в Мегиддо и там умер
  rationale: Последовательность бегства и смерти передана прямо. Имя повторено вместо двусмысленного местоимения после прямой речи для ясности русского текста.
