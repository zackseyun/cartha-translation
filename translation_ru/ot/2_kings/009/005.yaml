  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: ru
  text: 'Он пришёл, и вот военачальники сидели. Он сказал: «У меня есть для тебя сообщение, военачальник».[a] Ииуй спросил: «К кому из нас?» Тот ответил: «К тебе, военачальник».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У меня есть для тебя слово, военачальник». Буквально: «Слово у меня к тебе, военачальник».'
    reason: 'Лексическая альтернатива: דָּבָר означает «слово», а в данном контексте — обращённое к адресату сообщение.'
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Он пришёл
  rationale: Повествовательная форма продвигает последовательность событий; простое прошедшее время естественно для современного русского рассказа.
- source_word: וְהִנֵּה
  choice: и увидел, что
  rationale: В данном контексте הִנֵּה живо вводит открывшуюся пришедшему картину. Русское «и увидел, что» передаёт эту дейктическую функцию естественнее буквального и стилистически архаичного «вот».
- source_word: שָׂרֵי הַחַיִל
  choice: военачальники
  rationale: Сочетание обозначает руководителей войска; «военачальники» ясно передаёт военный контекст без приписывания им конкретного звания.
- source_word: יֹשְׁבִים
  choice: сидят
  rationale: Причастие описывает продолжающееся состояние, которое в русском придаточном естественно передаётся настоящим временем относительно момента восприятия.
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: У меня к тебе слово
  rationale: Сохраняет сжатую еврейскую формулу и её буквальный образ; идиоматическое значение «сообщение» отмечено в сноске.
- source_word: הַשַּׂר
  choice: военачальник
  rationale: Форма обращения к военному руководителю; выбор не задаёт более узкого ранга, чем исходное שַׂר.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: К кому из нас?
  rationale: Естественно передаёт направленность אֶל и разделительное значение מִכֻּלָּנוּ.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: К тебе, военачальник
  rationale: Сохраняет направленность речи и повтор обращения из предыдущей реплики.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Буквальная формула «у меня к тебе слово» сохранена в основном тексте, а более разговорно-понятное значение вынесено в сноску. Маркер [a] поставлен непосредственно после реплики, к которой относится примечание.
