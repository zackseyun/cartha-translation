base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: ru
  text: 'Тогда они поспешили: каждый взял свою верхнюю одежду и постелил её под ним на голых ступенях[a]. Затем они протрубили в рог[b] и провозгласили: «Ииуй воцарился!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на верхней ступени», «на верху лестницы» или «на лестничной площадке». Еврейское выражение встречается редко, и его точный смысл неясен.'
    reason: lexical_alternative
  - marker: b
    text: Евр. шофар — рог, в который трубили, подавая сигнал; традиционный перевод — «труба».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: тогда они поспешили
  rationale: Глагол מהר передаёт поспешность и немедленность реакции, а повествовательная форма продолжает последовательность событий.
- source_word: אִישׁ בִּגְדוֹ
  choice: каждый взял свою верхнюю одежду
  rationale: אִישׁ употреблено распределительно — «каждый», а בֶּגֶד здесь естественно понимать как предмет верхней одежды, который можно снять и постелить.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: постелил её под ним
  rationale: Местоимение, вероятнее всего, относится к Ииую. «Постелил» естественно описывает действие с одеждой, не уточняя сверх текста способ её размещения.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: на голых ступенях
  rationale: Редкое выражение допускает несколько толкований; основной текст передаёт вероятный смысл, а сноска сохраняет неопределённость.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: протрубили в рог
  rationale: שׁוֹפָר обозначает сигнальный рог. «Рог» конкретнее общего «труба» и понятнее без заимствования «шофар».
- source_word: מָלַךְ יֵהוּא
  choice: Ииуй воцарился
  rationale: Совершенная форма глагола מציינת свершившееся вступление на царство; «воцарился» кратко и естественно передаёт силу возгласа.
