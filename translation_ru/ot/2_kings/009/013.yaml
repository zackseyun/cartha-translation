  source_fidelity: 'Перевод точно передаёт последовательность действий: поспешность людей, индивидуальное снятие одежды, её расстилание под Ииуем, трубный сигнал и публичное провозглашение его царём. «Ииуй воцарился!» удачно воспроизводит совершенную форму מָלַךְ в значении состоявшегося вступления на царство, не добавляя богословских или политических уточнений. Неопределённое редкое выражение אֶל־גֶּרֶם הַמַּעֲלוֹת передано осмотрительно и снабжено сноской с существенными альтернативами.'
  naturalness: Текст звучит как современный литературный русский с уместным торжественным ритмом. «Верхняя одежда», «постелил её», «протрубили в рог» и «провозгласили» естественны в данном повествовательном контексте. Сочетание «голые ступени» несколько образно, но приемлемо как основной вариант при наличии поясняющей сноски о спорности редкого еврейского выражения.
