  register: 'Современный литературный русский язык с достоинством исторического повествования. Имена переданы в привычной русской библейской форме: Иорам, Ииуй, Изреель, Азаил; אֲרָם сохранено как «Арам», а не заменено позднейшим географическим названием.'
