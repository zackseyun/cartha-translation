  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: ru
  text: 'Царь Иорам вернулся в Изреель, чтобы оправиться от ран, которые нанесли ему арамеи, когда он сражался с Азаилом, царём Арама. Ииуй сказал: «Если вы этого хотите, пусть никто не уйдёт из города, чтобы сообщить об этом в Изрееле».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Глагол שׁוב означает возвращение; русское повествование не требует добавочного «тогда» или «теперь».
- source_word: לְהִתְרַפֵּא
  choice: чтобы оправиться
  rationale: Форма хитпаэль здесь описывает выздоровление после ран; «оправиться» естественно по-русски и не создаёт впечатления, будто царь исцелял себя сам.
- source_word: מִן הַמַּכִּים
  choice: от ран
  rationale: Буквально речь идёт об ударах, но в данном контексте — о полученных в бою ранах, от которых Иорам восстанавливался.
- source_word: אֲרַמִּים
  choice: арамеи
  rationale: Исторический этноним передан непосредственно, без анахроничного «сирийцы».
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: когда он сражался с Азаилом
  rationale: Инфинитивная конструкция обозначает обстоятельство времени; русский оборот передаёт военное противостояние естественно и ясно.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: Если вы этого хотите
  rationale: Идиома выражает желание или согласие собравшихся; буквальное упоминание «души» в современном русском здесь было бы непонятно.
- source_word: פָלִיט
  choice: пусть никто не уйдёт
  rationale: В запрете слово обозначает человека, которому удастся выбраться; контекстуальный перевод не превращает его в представителя особой категории «беглецов».
- source_word: לָלֶכֶת לְהַגִּיד
  choice: чтобы сообщить об этом
  rationale: Последовательность инфинитивов указывает на цель ухода — доставить весть; по-русски цель естественно выражается одним придаточным оборотом.
