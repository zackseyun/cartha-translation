lexical_decisions:
- source_word: וַיַּהֲפֹךְ יָדָיו
  choice: повернул назад
  rationale: Буквально выражение означает «повернул свои руки». В данном контексте оно, вероятно, описывает разворот колесницы посредством рук, однако ни колесница, ни поводья здесь прямо не названы. Перевод «повернул назад» естественно передаёт действие, не добавляя в основной текст отсутствующий объект.
- source_word: וַיָּנֹס
  choice: бежал
  rationale: Глагол נוס обычно обозначает поспешное бегство от опасности. «Бежал» кратко и точно передаёт динамику повествования.
- source_word: מִרְמָה
  choice: измена
  rationale: Существительное может означать обман, коварство или вероломство. В устах царя, осознавшего враждебные намерения Ииуя, «измена» передаёт резкий тревожный возглас, не сужая смысл до юридически определённой государственной измены.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: Охозия
  rationale: Использована традиционная и узнаваемая русская форма библейского имени. Повтор имени в прямой речи сохранён как звательное обращение, передающее срочность предупреждения.
- source_word: וַיֹּאמֶר אֶל אֲחַזְיָהוּ
  choice: Он сказал Охозии
  rationale: Синтаксис прямо вводит речь, обращённую к Охозии. Нейтральное «сказал» не добавляет эмоциональной характеристики, хотя содержание возгласа само передаёт тревогу.
