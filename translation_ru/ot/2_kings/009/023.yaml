  text: 'Тогда Иорам повернул назад и обратился в бегство[a]. Он сказал Охозии: «Измена[b], Охозия!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернул свои руки». Вероятно, речь идёт о том, что Иорам руками развернул колесницу, но поводья и колесница в еврейском тексте прямо не упомянуты.'
