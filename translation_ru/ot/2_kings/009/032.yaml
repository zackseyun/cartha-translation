base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: ru
  text: 'Он поднял лицо к окну и сказал: «Кто со мной? Кто?» Тогда из окна на него взглянули два или три евнуха[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придворных служащих». Еврейское слово может обозначать как евнухов, так и придворных служащих; в обстановке царского дворца значение «евнухи» наиболее вероятно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: Он поднял лицо
  rationale: Сохраняет еврейский образ «поднял своё лицо» и естественно передаёт направленный вверх взгляд; более идиоматично можно было бы сказать «Он посмотрел вверх».
- source_word: הַחַלּוֹן
  choice: к окну
  rationale: Обычное обозначение окна; предлог передаёт направление поднятого взгляда.
- source_word: מִי אִתִּי מִי
  choice: Кто со мной? Кто?
  rationale: Прямо сохраняет אִתִּי «со мной» и подчёркнутый повтор вопросительного слова, не заменяя его толкованием «кто на моей стороне».
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: к нему выглянули сверху
  rationale: Глагол обозначает взгляд наружу, часто с высоты; «сверху» ясно передаёт пространственное положение придворных у окна относительно Ииуя.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: два или три
  rationale: Естественно передаёт еврейское сочетание числительных, обозначающее небольшое неопределённое количество.
- source_word: סָרִיסִים
  choice: евнуха
  rationale: В обстановке царского дворца наиболее вероятно конкретное значение «евнухи», хотя слово может обозначать и придворных служащих.
