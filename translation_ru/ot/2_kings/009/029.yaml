  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: ru
  text: В одиннадцатый год правления Иорама, сына Ахава[a], Охозия стал царём Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Хронологические указания, связанные с царствованиями Иорама и Охозии, трудно согласовать между книгами Царств и Паралипоменон. Здесь еврейский текст передан как он написан, без попытки устранить хронологическое расхождение в основном тексте.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַת עֶשְׂרֵה שָׁנָה
  choice: В одиннадцатый год правления
  rationale: Естественная русская передача древнееврейской формулы датировки по году царствования; слово «правления» добавлено для ясности смысла конструкции с לְיוֹרָם.
- source_word: לְיוֹרָם
  choice: Иорама
  rationale: В царских хронологических формулах предлог לְ указывает, по чьему царствованию ведётся отсчёт.
- source_word: בֶּן אַחְאָב
  choice: сына Ахава
  rationale: Прямая передача патронима, уточняющего, о каком Иораме идёт речь.
- source_word: מָלַךְ
  choice: стал царём
  rationale: В данной формуле глагол обозначает вступление на престол, а не продолжительность царствования.
- source_word: אֲחַזְיָה
  choice: Охозия
  rationale: Традиционная и узнаваемая русская библейская форма имени.
- source_word: עַל יְהוּדָה
  choice: Иудеи
  rationale: Сочетание מָלַךְ עַל означает царствовать над страной или народом; по-русски естественно «стал царём Иудеи».
theological_decisions:
- issue: Расхождения в хронологических указаниях о царствованиях Иорама и Охозии
  choice: Сохранить датировку масоретского текста без согласования
  alternative: Исправить или переформулировать датировку для согласования с другими местами книг Царств и Паралипоменон
  rationale: Перевод должен передавать древнееврейский текст как он есть и не устранять текстовую и хронологическую трудность внутри основного текста.
translation_notes:
  register: Современный литературный русский язык; краткая и достойная летописная формулировка. Союз וּ в начале не передан отдельно, поскольку по-русски хронологическое сообщение естественно начинается с обстоятельства времени.
