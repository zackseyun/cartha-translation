base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/033.yaml
  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: ru
  text: 'И он сказал: «Сбросьте её!» Они сбросили её, и кровь её брызнула на стену и на коней[a], а он растоптал её.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и брызги её крови попали на стену и на коней». Буквально: «и брызнуло от её крови на стену и на коней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו / וישמטוה
  choice: «Сбросьте её!» / «Они сбросили её»
  rationale: Повтор одного и того же русского корня сохраняет связь между приказом и его немедленным исполнением; «сбросить» естественно передаёт насильственное падение Иезавели из окна.
- source_word: ויז מדמה
  choice: «кровь её брызнула»
  rationale: Глагол יז передаёт разбрызгивание, а конструкция с מן допускает партитивный смысл. Русская формулировка звучит естественно, не ослабляя жестокости сцены; буквальная структура отражена в сноске.
- source_word: אל הקיר ואל הסוסים
  choice: «на стену и на коней»
  rationale: Предлог אל здесь обозначает направленность брызг; «на» является естественным русским соответствием. Существительные переданы прямо.
- source_word: וירמסנה
  choice: «а он растоптал её»
  rationale: Единственное число глагола указывает на мужской субъект, по контексту — Ииуя. Местоимение сохраняет лаконичность и синтаксическую форму еврейского текста, не уточняя явно, каким образом он её растоптал.
