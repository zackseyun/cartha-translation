source:
  edition: WLC
  text: וְ/אֶת אִיזֶ֜בֶל יֹאכְל֧וּ הַ/כְּלָבִ֛ים בְּ/חֵ֥לֶק יִזְרְעֶ֖אל וְ/אֵ֣ין קֹבֵ֑ר וַ/יִּפְתַּ֥ח הַ/דֶּ֖לֶת וַ/יָּנֹֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: ru
  text: «Иезавель съедят псы на участке земли в Изрееле[a], и некому будет её похоронить». Затем он открыл дверь и убежал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на земельном наделе Изрееля». Еврейское חֵלֶק означает долю, участок или земельный надел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: съедят
  rationale: Прямо передаёт простое будущее значение אכל в пророчестве о суде, не усиливая глагол до «растерзают» или «пожрут».
- source_word: הַכְּלָבִים
  choice: псы
  rationale: Определённость еврейской формы естественно передаётся контекстом; «псы» сохраняет краткость, выразительность и достойный литературный регистр.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: на участке земли в Изрееле
  rationale: חֵלֶק обозначает долю, участок или земельный надел. Такой перевод сохраняет конкретный земельный смысл и не превращает выражение в более широкое «на территории».
- source_word: וְאֵין קֹבֵר
  choice: и некому будет её похоронить
  rationale: Еврейское именное выражение буквально означает отсутствие того, кто хоронит; объект «её» ясно восстанавливается из контекста, а будущее время соответствует пророчеству.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: Затем он открыл дверь
  rationale: Последовательная глагольная форма продвигает повествование; «затем» естественно отмечает переход от речи к действию.
- source_word: וַיָּנֹס
  choice: и убежал
  rationale: נוס означает бежать, спасаясь или удаляясь. «Убежал» звучит естественно по-русски и сохраняет стремительность действия.
- source_word: אִיזֶבֶל
  choice: Иезавель
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени.
