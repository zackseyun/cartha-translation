  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: ru
  text: Когда придёшь туда, найди Ииуя, сына Иосафата, сына Нимши. Подойди к нему, подними его из среды его братьев и отведи во внутреннюю комнату[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в комнату внутри комнаты», то есть в отдельное внутреннее помещение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: Когда придёшь туда
  rationale: בוא может означать «приходить», «идти» или «прибывать» в зависимости от точки зрения; здесь естественное русское выражение передаёт завершение пути до исполнения следующего повеления.
- source_word: וּרְאֵה שָׁם
  choice: найди
  rationale: Буквально ראה — «увидь»; в повелении, после которого назван человек, глагол по смыслу означает разыскать и опознать его. Наречие שָׁם уже естественно отражено в предшествующем «туда».
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: Ииуя, сына Иосафата, сына Намессия
  rationale: Сохранена последовательность родословного обозначения с традиционными русскими формами библейских имён.
- source_word: וּבָאתָ
  choice: Подойди
  rationale: Повторное בוא обозначает приближение к найденному Ииую перед последующими действиями; «подойди» естественно передаёт движение, не добавляя явно не названного собрания или помещения.
- source_word: וַהֲקֵמֹתוֹ
  choice: подними его
  rationale: Каузативная форма קום означает заставить встать или поднять; буквальная формулировка сохраняет конкретное действие и допускает естественный контекстуальный смысл «вызови его».
- source_word: מִתּוֹךְ אֶחָיו
  choice: из среды его братьев
  rationale: אחים буквально означает «братья», хотя в военном окружении может обозначать товарищей или соратников. Буквальное значение сохранено, поскольку контекст не требует однозначно заменить его толкованием.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: и отведи
  rationale: Каузатив בוא может означать «привести» или «отвести». При движении говорящего вместе с человеком в отдельное помещение русское «отведи» звучит естественно.
- source_word: חֶדֶר בְּחָדֶר
  choice: во внутреннюю комнату
  rationale: Идиоматическое сочетание буквально означает «комнату в комнате» и указывает на внутреннее, уединённое помещение; буквальная форма дана в сноске.
