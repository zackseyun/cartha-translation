base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: ru
  text: 'Возьми сосуд с маслом, вылей масло ему на голову и скажи: «Так говорит Яхве: Я помазал тебя царём над Израилем[a]». Затем открой дверь и беги, не задерживайся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к Израилю»; в формуле поставления царя смысл — «над Израилем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: сосуд с маслом
  rationale: פַךְ — небольшой сосуд для жидкости; нейтральное «сосуд» естественно в современном русском и не уточняет форму, не обозначенную в еврейском тексте. הַשֶּׁמֶן означает «масло» без явного уточнения «оливковое».
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: вылей масло ему на голову
  rationale: Передаёт действие יצק с עַל буквально и естественно; повтор «масло» устраняет неясность местоимения в русском.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет торжественную формулу речи пророческого посланника и передаёт личное имя יְהוָה транслитерацией.
- source_word: מְשַׁחְתִּיךָ
  choice: Я помазал тебя
  rationale: Перфект передан формой совершенного вида прошедшего времени; в контексте это также действенная формула поставления.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: царём над Израилем
  rationale: לְמֶלֶךְ обозначает поставление на царское служение, а אֶל יִשְׂרָאֵל в данной формуле естественно выражает власть по отношению к Израилю.
- source_word: וְנַסְתָּה וְלֹא תְחַכֶּה
  choice: и беги, не задерживайся
  rationale: «Беги» передаёт срочность נוס, а «не задерживайся» — запрет оставаться или медлить, выраженный חכה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Отношение царя к Израилю в אֶל יִשְׂרָאֵל
  choice: над Израилем
  alternative: к Израилю
  rationale: В формуле царского поставления выражается царствование над народом; буквальная передача предлога «к» по-русски затемнила бы смысл. Подстрочная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой формулы. Повеления переданы кратко и энергично; архаизмы исключены.
