base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: ru
  text: Ииуй изо всей силы натянул лук и поразил Иорама между плечами[a]. Стрела прошла сквозь его сердце, и он рухнул в своей колеснице.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «между руками»; возможно, имеется в виду область между плечами или лопатками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: изо всей силы натянул лук
  rationale: Буквально «наполнил руку луком»; еврейская идиома описывает полное натяжение лука. Русская формулировка естественно передаёт силу и завершённость движения.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה имеет широкое значение «ударить, поразить». «Поразил» сохраняет силу выражения, не добавляя к глаголу указания на способ действия, уже понятный из контекста.
- source_word: בֵּין זְרֹעָיו
  choice: между плечами
  rationale: Буквально זְרֹעַ означает «рука», однако в данном анатомическом контексте выражение, вероятно, указывает на область верхней части спины между плечами. Буквальная форма сохранена в сноске.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: стрела прошла сквозь его сердце
  rationale: Буквально стрела «вышла из его сердца»; контекст указывает на сквозное смертельное ранение. Перевод ясно передаёт траекторию, не устраняя упоминания сердца.
- source_word: וַיִּכְרַע
  choice: рухнул
  rationale: כרע означает «согнуться, опуститься, преклониться»; здесь речь о теле смертельно раненного царя, обмякшем или упавшем в колеснице. «Рухнул» естественно и выразительно передаёт событие.
- source_word: בְּרִכְבּוֹ
  choice: в своей колеснице
  rationale: Местоименный суффикс указывает на колесницу Иорама; «в своей колеснице» точно передаёт эту связь.
