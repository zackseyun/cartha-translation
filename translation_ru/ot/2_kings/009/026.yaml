  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: ru
  text: «Несомненно,[a] Я видел вчера кровь Навота и кровь его сыновей, — возвещает Яхве, — и Я воздам тебе на этом участке, — возвещает Яхве. А теперь подними его и брось его на этот участок, согласно слову Яхве».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воистину». Начальная еврейская формула представляет собой торжественное, подобное клятве утвердительное заявление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Разве не…?
  rationale: Клятвенно-утвердительная формула, буквально имеющая вид отрицательного условия. Риторический вопрос по-русски сохраняет и форму, и эмфатическую силу; смысл — несомненное утверждение.
- source_word: דְּמֵי
  choice: кровь
  rationale: Форма множественного числа «крови» обозначает пролитую кровь и связанную с ней вину; русское единственное число естественно передаёт этот смысл.
- source_word: נָבוֹת
  choice: Навот
  rationale: Традиционная русская библейская передача личного имени.
- source_word: בָנָיו
  choice: его сыновей
  rationale: Еврейский текст прямо говорит о сыновьях, поэтому родовая конкретность сохранена.
- source_word: אֶמֶשׁ
  choice: вчера
  rationale: Наименее интерпретирующая передача указания на предшествующий день или ночь.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная и понятная передача пророческой формулы с сохранением личного имени Бога.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: Я воздам тебе
  rationale: Передаёт судебно-карательный смысл воздаяния и сохраняет высокий регистр.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: на этом самом участке
  rationale: חֶלְקָה — отдельный земельный участок; частица «самом» естественно подчёркивает указательное «этом» в контексте возмездия на месте преступления.
- source_word: שָׂא הַשְׁלִכֵהוּ
  choice: подними его и брось
  rationale: Прямая, естественная передача двух повелительных форм; местоимение относится к телу Иорама.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Сохраняет формулу исполнения ранее произнесённого божественного слова.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст трижды употребляет Тетраграмматон; транслитерация сохраняет личное заветное имя и соответствует предоставленному консультационному слою.
- issue: Упоминание крови сыновей Навота
  choice: кровь его сыновей
  alternative: кровь его детей; кровь его потомков
  rationale: Сохранена явная лексическая конкретность בָנָיו без обобщения и без попытки согласовать стих с более кратким рассказом в 3 Царств 21.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческо-судебным звучанием. «Возвещает» отличает формулу נְאֻם от обычного «говорит», а «воздам» сохраняет достоинство речи без архаизма «взыщу».
