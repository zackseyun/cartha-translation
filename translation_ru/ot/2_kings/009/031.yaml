  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: ru
  text: 'Когда Ииуй вошёл в ворота, она сказала: «С миром ли ты пришёл, Замврий, убийца своего господина?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё ли благополучно, Замврий, убийца своего господина?» Буквально начало вопроса: «Мир ли?» Иезавель насмешливо называет Ииуя Замврием, сравнивая его с Замврием, который убил своего господина и захватил царский престол (см. 3 Цар. 16:9–20).'
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: въезжал в ворота
  rationale: Глагол בוא обозначает прибытие или вхождение, а שׁער — ворота. По контексту Ииуй приближается на колеснице; «въезжал в ворота» естественно передаёт движение внутрь через городские ворота.
- source_word: וַתֹּאמֶר
  choice: она сказала
  rationale: Форма женского рода указывает на Иезавель, названную в предшествующем контексте.
- source_word: הֲשָׁלוֹם
  choice: С миром ли ты пришёл
  rationale: Буквально выражение означает «мир ли?», но здесь это острый вопрос о мирных намерениях или благополучном исходе. Добавление «ты пришёл» естественно в русском и сохраняет связь с прибытием Ииуя, не снимая иронической напряжённости.
- source_word: זִמְרִי
  choice: Замврий
  rationale: Использована традиционная русская библейская форма имени. Иезавель называет Ииуя Замврием не буквально, а как насмешливое сравнение с цареубийцей и узурпатором из 3 Царств 16:9–20.
- source_word: הֹרֵג
  choice: убийца
  rationale: Причастие означает «убивающий» или «тот, кто убил». Существительное «убийца» передаёт обвинительный характер насмешки.
- source_word: אֲדֹנָיו
  choice: своего господина
  rationale: Слово אדון здесь обозначает человеческого владыку, царя. Возвратное «своего» естественно связывает господина с убийцей и сохраняет возможную отсылку как к Замврию, так и к уподобленному ему Ииую.
theological_decisions:
- issue: Обращение «Замврий, убийца своего господина»
  choice: Передать как насмешливое именование Ииуя с пояснением в сноске.
  alternative: 'Оставить обращение без пояснения либо встроить сравнение в текст: «новый Замврий».'
  rationale: Еврейский текст прямо употребляет имя זמרי, сохраняя историческую аллюзию. Пояснение в сноске раскрывает насмешку, не добавляя слова «новый» или «подобный» в основной текст.
- issue: Смысл вопроса הֲשָׁלוֹם
  choice: «С миром ли ты пришёл?»
  alternative: «Всё ли благополучно?» или более буквально «Мир ли?»
  rationale: Формула допускает вопрос и о мире, и о благополучии. В данном столкновении вариант о мирном приходе звучит естественно и уместно, а лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и резкости прямой речи. Традиционные русские формы имён «Ииуй», «Иезавель» и «Замврий» поддерживают узнаваемость библейского повествования. Синтаксис вопроса сделан естественным для современного читателя, а буквальная краткость и смысловая вариативность вынесены в сноску.
