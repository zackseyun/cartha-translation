base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: ru
  text: 'Они сказали: «Неправда! Скажи нам, пожалуйста». Он ответил: «Он сказал мне то-то и то-то[a], а именно: „Так говорит Яхве: Я помазал тебя царём над Израилем“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «так и так»; устойчивое выражение, передающее неопределённый или сокращённый пересказ. Возможно также: «то и это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Неправда!
  rationale: Краткое именное восклицание передаёт резкое обвинение в том, что Ииуй скрывает правду; по-русски естественнее, чем буквальное «ложь».
- source_word: הַגֶּד נָא לָנוּ
  choice: Расскажи нам
  rationale: Императив породы hифиль от נגד означает «сообщить, рассказать»; частица נָא смягчает или усиливает просьбу, что в данном живом диалоге передаётся общим тоном фразы без отдельного «пожалуйста».
- source_word: כָּזֹאת וְכָזֹאת
  choice: то-то и то-то
  rationale: Устойчивое выражение обозначает неопределённое или сокращённое изложение сказанного, а не дословную цитату.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена торжественная формула речи посланника или пророка и настоящее время еврейской формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: מְשַׁחְתִּיךָ
  choice: Я помазал тебя
  rationale: Перфект глагола משׁח обозначает совершённое помазание и сохраняет царское и богословское содержание исходного слова.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: царём над Израилем
  rationale: לְ указывает на назначение на должность, а אֶל в контексте царской власти естественно передаётся русским «над».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно стоит тетраграмматон; передача личного имени сохраняет отличие имени от титула.
- issue: Значение царского помазания
  choice: помазал тебя царём
  alternative: поставил тебя царём
  rationale: Буквальный образ помазания существенен для описания данного Богом царского полномочия и не должен заменяться общим обозначением назначения.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым диалогом и сохранением торжественного звучания пророческой формулы. Союз לֵאמֹר перед прямой речью передан пояснительным «а именно», чтобы избежать тяжеловесного «сказав».
