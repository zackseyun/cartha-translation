  text: ו/הית נִבְלַ֣ת אִיזֶ֗בֶל כְּ/דֹ֛מֶן עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה בְּ/חֵ֣לֶק יִזְרְעֶ֑אל אֲשֶׁ֥ר לֹֽא יֹאמְר֖וּ זֹ֥את אִיזָֽבֶל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: ru
  text: 'И труп Иезавели будет как навоз на поверхности поля, на участке Изрееля[a], так что никто не скажет: «Это Иезавель».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пределах Изрееля». Еврейское חֵלֶק может означать отдельный участок земли, надел или часть территории.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: И ... будет
  rationale: Перфект с союзом в контексте пророчества имеет значение будущего и продолжает предшествующее предсказание.
- source_word: נִבְלַת אִיזֶבֶל
  choice: труп Иезавели
  rationale: נְבֵלָה обозначает мёртвое тело; «труп» прямо и естественно передаёт суровый образ оригинала.
- source_word: כְּדֹמֶן
  choice: как навоз
  rationale: דֹּמֶן означает навоз или помёт; выбран прямой современный эквивалент, сохраняющий резкость сравнения.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: на поверхности поля
  rationale: Передаёт пространственный смысл буквального выражения «на лице поля» естественным современным русским языком.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: на участке Изрееля
  rationale: חֵלֶק здесь может обозначать отведённый участок или земельный надел; «участок» сохраняет конкретность слова без чрезмерного уточнения.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: так что никто не скажет
  rationale: Относительная конструкция выражает результат; безлично-обобщённое «никто» естественно передаёт неопределённое множественное число.
- source_word: זֹאת אִיזָבֶל
  choice: Это Иезавель
  rationale: Простая формула указания и опознания передана непосредственно.
