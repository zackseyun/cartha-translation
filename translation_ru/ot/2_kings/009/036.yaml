base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: ru
  text: 'Они вернулись и доложили ему. Он сказал: «Это слово Яхве, которое Он изрёк через Своего слугу Илию Фесвитянина: „На земле Изрееля[a] собаки съедят плоть Иезавели“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на участке (наделе) Изрееля»; еврейское слово может обозначать как часть или участок земли, так и более широкую территорию.'
    reason: Лексическая широта слова חֵלֶק.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: Они вернулись и доложили ему
  rationale: Последовательные повествовательные формы переданы естественной русской конструкцией; נגד в породе hiphil означает сообщить или доложить.
- source_word: דְּבַר יְהוָה הוּא
  choice: Это слово Яхве
  rationale: Сохраняет акцент именного предложения и передаёт יהוה личным именем «Яхве», а не заменяет его титулом.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: которое Он изрёк через Своего слугу
  rationale: Идиома בְּיַד обозначает посредничество; по-русски «через» естественно выражает пророческую передачу, а «изрёк» поддерживает достойный библейский регистр.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: Илию Фесвитянина
  rationale: Использованы укоренившиеся в русской библейской традиции формы имени и обозначения происхождения.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: На земле Изрееля[a]
  rationale: חֵלֶק может обозначать часть земли, участок, надел или территорию. Основной текст передаёт географический смысл без неоправданного сужения, а примечание сохраняет более конкретные варианты.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: собаки съедят
  rationale: Прямо передаёт значение глагола אכל и сохраняет резкую простоту пророчества.
- source_word: בְּשַׂר אִיזָבֶל
  choice: плоть Иезавели
  rationale: בָּשָׂר означает именно плоть; этот выбор сохраняет конкретность и суровость пророческого суда.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Посредничество пророка в выражении בְּיַד עַבְדּוֹ
  choice: через Своего слугу
  alternative: рукою Своего слуги
  rationale: Оба варианта отражают еврейскую идиому, но «через» яснее для современного читателя и не создаёт впечатления физического действия рукой, сохраняя мысль о пророческом посредничестве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «изрёк», «слуга», «плоть» сохраняют достоинство и конкретность исходного текста, не делая синтаксис архаичным.
