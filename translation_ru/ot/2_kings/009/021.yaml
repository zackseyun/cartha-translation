  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: ru
  text: 'Иорам сказал: «Запрягай!» И его колесницу запрягли[a]. Иорам, царь Израиля, и Охозия, царь Иудеи, выехали — каждый на своей колеснице — навстречу Ииую и встретили его на участке Навуфея из Изрееля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «и он запряг свою колесницу»; глагол стоит в 3-м лице единственного числа. Возможно, приказ исполнили слуги, что здесь передано неопределённо-личной формой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: Запрягай!
  rationale: Повелительная форма глагола אסר в контексте колесницы означает запрячь упряжку; краткая команда передаёт срочность происходящего.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: И колесницу его запрягли
  rationale: 'Формально глагол стоит в 3-м лице единственного числа: «и он запряг его колесницу». По контексту приказ исполняет слуга; неопределённо-личная конструкция естественна по-русски и не создаёт впечатления, будто царь запрягал колесницу сам.'
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: каждый на своей колеснице
  rationale: אִישׁ употреблено распределительно и указывает, что каждый из двух царей ехал в отдельной колеснице.
- source_word: לִקְרַאת יֵהוּא
  choice: навстречу Ииую
  rationale: Конструкция לִקְרַאת обычно обозначает движение навстречу кому-либо.
- source_word: וַיִּמְצָאֻהוּ
  choice: встретили его
  rationale: מצא в повествовательном контексте может означать как «найти», так и «встретить, застать»; здесь «встретили» естественно описывает итог их движения навстречу Ииую.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: на участке Навуфея
  rationale: חֶלְקָה — отдельный земельный надел или участок; перевод сохраняет имущественный оттенок, важный для истории Навуфея.
- source_word: הַיִּזְרְעֵאלִי
  choice: из Изрееля
  rationale: Еврейское обозначение жителя или уроженца Изрееля естественно передаётся по-русски сочетанием «из Изрееля».
