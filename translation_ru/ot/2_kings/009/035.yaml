base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: ru
  text: И они пошли похоронить её, но ничего от неё не нашли[a], кроме черепа, ступней и ладоней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не нашли в ней ничего». В данном контексте это означает, что от её тела почти ничего не осталось.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: И они пошли
  rationale: Форма wayyiqtol продолжает последовательное повествование; союз «и» сохраняет связь с предшествующим контекстом.
- source_word: לְקָבְרָהּ
  choice: похоронить её
  rationale: Инфинитив קבר с суффиксом 3-го лица женского рода относится к Иезавели; это естественная русская передача цели действия.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: но ничего от неё не нашли
  rationale: Союз передан противительно по контексту. Буквальное «в ней» здесь неестественно по-русски; «от неё» ясно указывает на оставшиеся части тела, не устраняя исходный образ полностью.
- source_word: כִּי אִם
  choice: кроме
  rationale: Сочетание частиц образует исключительный оборот.
- source_word: הַגֻּלְגֹּלֶת
  choice: черепа
  rationale: Существительное обозначает именно череп, а не голову в целом; сохранена резкость описания.
- source_word: הָרַגְלַיִם
  choice: ступней
  rationale: В перечне сохранившихся частей тела конкретное «ступни» точнее передаёт анатомическое значение, чем более широкое «ноги».
- source_word: כַפּוֹת הַיָּדָיִם
  choice: ладоней
  rationale: כַּף применительно к руке означает ладонь; русское «ладони» естественно передаёт значение полного еврейского выражения без избыточного «ладони рук».
