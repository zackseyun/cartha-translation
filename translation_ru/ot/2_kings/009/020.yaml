  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: ru
  text: 'И дозорный доложил: «Он подъехал к ним, но не вернулся; манера его езды — как у Ииуя, сына Нимши, ибо он ведёт колесницу как безумный».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо он ведёт колесницу безумно»; возможен также перевод: «ибо он ведёт её в исступлении». Еврейское выражение характеризует неистовую, безрассудную манеру езды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: доложил
  rationale: Глагол נגד вводит сообщение дозорного; «доложил» естественно передаёт официальный характер сообщения в военном и царском контексте.
- source_word: הַצֹּפֶה
  choice: дозорный
  rationale: צֹפֶה обозначает человека, поставленного наблюдать за приближением людей; «дозорный» уместен в данном военно-царском контексте.
- source_word: בָּא עַד אֲלֵיהֶם
  choice: Он подъехал к ним
  rationale: В контексте посланник передвигается верхом; перевод передаёт достижение им приближающейся группы без неестественной буквальности.
- source_word: וְלֹא שָׁב
  choice: но не возвращается
  rationale: 'Форма выражает наблюдаемый в настоящий момент результат: посланник достиг группы и обратно не едет.'
- source_word: הַמִּנְהָג כְּמִנְהַג
  choice: По манере езды это, должно быть
  rationale: מִנְהָג здесь означает характер или манеру управления колесницей. Русская конструкция естественно выражает сделанный дозорным вывод, не повторяя тяжеловесно слово «езда».
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Ииуй, сын Нимши
  rationale: Использованы традиционные русские формы библейских имён и ясно передан патроним.
- source_word: בְשִׁגָּעוֹן יִנְהָג
  choice: он гонит как безумный
  rationale: Предложно-именное выражение בְשִׁגָּעוֹן характеризует езду как безумную, неистовую и безрассудную; «гонит как безумный» естественно и образно передаёт это по-русски.
