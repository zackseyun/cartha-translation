source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: ru
  text: 'Когда Иорам увидел Ииуя, он спросил: «С миром ли ты, Ииуй?» Тот ответил: «Какой может быть мир[b], пока продолжаются блудодеяния[a] Иезавели, твоей матери, и её многочисленные колдовства?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «распутства Иезавели, твоей матери». Еврейское слово может иметь как буквальный, так и образный смысл, включая нравственную и культовую неверность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Какой мир?» В еврейском тексте повторяется слово «мир» из вопроса Иорама, что усиливает риторический эффект.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Когда … увидел
  rationale: В русском повествовании оборот естественно передаёт еврейскую конструкцию וַיְהִי с инфинитивом; буквальное «и случилось, когда» здесь было бы тяжеловесно и не добавляло бы смысла.
- source_word: הֲשָׁלוֹם
  choice: С миром ли ты
  rationale: Так сохраняется существительное «мир» и одновременно естественно выражается вопрос о мирных намерениях Ииуя; это также подготавливает повтор слова в ответе.
- source_word: מָה הַשָּׁלוֹם
  choice: Какой может быть мир
  rationale: Риторический вопрос отрицает возможность мира в сложившихся обстоятельствах. Формулировка сохраняет повтор ключевого слова שָׁלוֹם.
- source_word: עַד
  choice: пока продолжаются
  rationale: 'Предлог имеет здесь длительное значение: названные деяния всё ещё совершаются и исключают мир. Добавленный по смыслу глагол делает неполную еврейскую конструкцию ясной по-русски.'
- source_word: זְנוּנֵי
  choice: блудодеяния
  rationale: Слово сохраняет резкость исходной метафоры и допускает как прямой нравственный, так и образный религиозно-культовый смысл, не сводя выражение только к идолопоклонству.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: Иезавели, твоей матери
  rationale: Передаёт имя с поясняющим приложением и сохраняет прямой обвинительный тон обращения к Иораму.
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: и её многочисленные колдовства
  rationale: «Колдовства» передаёт множественное число и обозначает магические практики, а «многочисленные» сохраняет усиление הָרַבִּים.
theological_decisions:
- issue: Следует ли понимать זְנוּנֵי буквально или как обозначение исключительно идолопоклонства
  choice: «блудодеяния» — образ сохранён без сужения значения
  alternative: «идолопоклонство», «разврат»
  rationale: В историко-богословском контексте слово может одновременно указывать на нравственную распущенность и культовую неверность. Более узкий перевод преждевременно разрешил бы эту неоднозначность.
- issue: Следует ли варьировать перевод שָׁלוֹם в вопросе Иорама и ответе Ииуя
  choice: В обоих случаях сохранено слово «мир»
  alternative: «Всё ли хорошо?» / «Какое может быть благополучие?»
  rationale: Лексический повтор создаёт риторическое столкновение между вопросом Иорама и ответом Ииуя; его важно сохранить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Имена переданы в традиционной русской форме. Синтаксис сделан естественным, но повтор «мир» и резкая метафора исходного текста сохранены.
