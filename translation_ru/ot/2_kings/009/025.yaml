base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: ru
  text: 'Тогда он сказал Бидкару, своему офицеру[a]: «Подними его и брось на участок поля Навота, изреелитянина. Вспомни: мы с тобой ехали бок о бок[b] вслед за Ахавом — отцом Иорама, — когда Яхве изрёк против него это пророческое изречение[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своему третьему воину». Возможно, это особое обозначение воинской должности или положения Бидкара.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ехали парами». Вероятно, Ииуй и Бидкар ехали вместе вслед за Ахавом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «это пророчество»; «это бремя». Еврейское слово обозначает весомое, нередко грозное пророческое изречение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: Бидкар
  rationale: Личное имя передано принятой русской транслитерацией.
- source_word: שלשה
  choice: своему офицеру
  rationale: Слово, вероятно, обозначает должность или положение Бидкара при Ииуе. «Офицер» понятно современному читателю и не приписывает ему чрезмерно конкретного звания.
- source_word: שָׂא
  choice: подними его
  rationale: Императив נשׂא в контексте означает поднять или взять тело, чтобы убрать его с колесницы.
- source_word: הַשְׁלִכֵהוּ
  choice: брось
  rationale: Передаёт прямоту и силу повеления, не смягчая действие.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: на участок поля
  rationale: Сохраняет значение земельного надела или отдельного участка; русский предлог «на» естественен при помещении тела на землю.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Навота-изреелитянина
  rationale: Имя и обозначение происхождения переданы в традиционной и понятной русской форме.
- source_word: זְכֹר
  choice: вспомни
  rationale: Прямо передаёт повелительную форму и вводит основание приказа.
- source_word: רֹכְבִים צְמָדִים
  choice: ехали бок о бок
  rationale: Буквально выражение связано с ездой «парами»; выбранная формулировка естественно описывает совместное следование Ииуя и Бидкара, а буквальная неоднозначность отмечена в сноске.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: вслед за Ахавом, его отцом
  rationale: «Его отцом» относится к отцу убитого Иорама, Ахаву; местоименная связь сохранена без поясняющей вставки в основной текст.
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога יהוה.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: изрёк против него это грозное слово
  rationale: Формулировка сохраняет направленность пророческого изречения против Ахава и весомый, зловещий оттенок מַשָּׂא, не сводя его однозначно к судебному приговору.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер מַשָּׂא, обращённого против Ахава
  choice: грозное слово
  alternative: пророчество; изречение; бремя; приговор
  rationale: Выбор передаёт тяжесть и неблагоприятную направленность пророческой речи, сохраняя смысловую широту термина и не превращая его исключительно в юридический приговор.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Приказ передан кратко и резко; техническое воинское обозначение и неоднозначные выражения вынесены в сноски. Синтаксис остаётся доступным обычному читателю без конфессионально окрашенных уточнений.
