  to: 'Тогда он сказал Бидкару, своему офицеру[a]: «Подними его и брось на участок поля Навота, изреелитянина. Вспомни: мы с тобой ехали бок о бок[b] вслед за Ахавом — отцом Иорама, — когда Яхве изрёк против него это пророческое изречение[c]».'
