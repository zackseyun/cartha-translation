  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: ru
  text: Ииуй сел и отправился в Изреель[a], потому что Иорам лежал там, а Охозия, царь Иудеи, спустился навестить Иорама[b].
