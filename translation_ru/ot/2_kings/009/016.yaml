lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: сел в колесницу
  rationale: Глагол רכב обозначает посадку верхом или в колесницу и езду. Контекст царского военного отряда указывает на колесницу; отдельный перевод сохраняет отличие от следующего וַיֵּלֶךְ — «отправился».
- source_word: וַיֵּלֶךְ
  choice: отправился
  rationale: Обычный глагол движения הלך здесь естественно передаётся как начало пути к названному месту.
- source_word: יִזְרְעֶאלָה
  choice: в Изреель
  rationale: Направительный суффикс -ה выражает движение к Изреелю; по-русски направление естественно передаётся предлогом «в».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину поездки Ииуя.
- source_word: שֹׁכֵב שָׁמָּה
  choice: лежал там
  rationale: Сохранено буквальное значение причастия שֹׁכֵב без уточнения состояния Иорама, хотя из контекста известно, что он оправлялся от ран.
- source_word: יָרַד
  choice: спустился
  rationale: Сохранён пространственный оттенок ירד — движения вниз; завершённый вид передаёт действие, предшествующее отправлению Ииуя.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: навестить Иорама
  rationale: Буквально «увидеть Иорама», но в данном контексте инфинитив выражает посещение больного или раненого человека; современное русское «навестить» точно передаёт смысл.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: Ииуй / Иорам / Охозия / Изреель / Иудея
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён и географических названий, остающиеся понятными современному читателю.
