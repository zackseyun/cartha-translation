  text: וַ/יֵּ֧לֶךְ הַ/נַּ֛עַר הַ/נַּ֥עַר הַ/נָּבִ֖יא רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/004.yaml
  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: ru
  text: И отправился юноша — юноша-пророк[a] — в Рамот-Гилад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте повторено слово «юноша»: «юноша, юноша-пророк».'
    reason: Повтор необычен и, вероятно, служит для выделения или уточнения; примечание показывает форму оригинала.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: И отправился
  rationale: Форма с последовательным וַ продвигает повествование; «отправился» естественно передаёт начало пути к названному месту.
- source_word: הַנַּעַר
  choice: юноша
  rationale: נַעַר здесь обозначает молодого мужчину, посланного Елисеем; «юноша» сохраняет указание на возраст, не добавляя прямо не выраженного значения «слуга».
- source_word: הַנַּעַר הַנָּבִיא
  choice: юноша-пророк
  rationale: 'Сочетание с повтором הַנַּעַר допускает аппозиционное прочтение: молодой человек характеризуется как пророк. Дефисное сочетание по-русски кратко и ясно передаёт эту связь, а повтор сохранён перед ним.'
- source_word: רָמֹת גִּלְעָד
  choice: Рамот-Гилад
  rationale: Составной топоним передан современной транслитерацией с дефисом, отражающей единство названия.
theological_decisions:
- issue: Статус юноши в выражении הַנַּעַר הַנָּבִיא
  choice: юноша-пророк
  alternative: слуга пророка
  rationale: В еврейском тексте оба существительных стоят с артиклем и не образуют обычную конструкцию принадлежности; поэтому перевод «слуга пророка» добавлял бы отношение, грамматически не выраженное непосредственно. Аппозиционное прочтение сохраняет форму и неоднозначность контекста, не выводя статус персонажа из заранее принятого толкования.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Тире выделяют пояснительное повторение, не устраняя характерную конструкцию еврейского текста.
