source:
  edition: WLC
  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: ru
  text: 'И пророк Елисей позвал одного из сыновей пророков[a] и сказал ему: «Подпояшься[b], возьми в руку этот сосуд с маслом и отправляйся в Рамот Галаадский».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сыны пророков» — члены пророческой группы или общины, не обязательно родные сыновья пророков.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «опояшь свои бёдра» — то есть подбери и закрепи одежду, готовясь действовать или отправиться в путь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: И пророк Елисей
  rationale: Союз ו продолжает повествование; русское «И» сохраняет эту связь без навязывания более точной временной последовательности. Приложение естественно передано как «пророк Елисей».
- source_word: קָרָא לְאַחַד
  choice: позвал одного
  rationale: Передаёт обычное значение «позвал» и конструкцию «одного из», не усиливая её до «призвал» или «вызвал».
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: из сыновей пророков
  rationale: Сохранён конкретный древнееврейский оборот; сноска поясняет, что речь идёт о членах пророческой группы, а не обязательно о родных сыновьях.
- source_word: וַיֹּאמֶר לוֹ
  choice: и сказал ему
  rationale: Прямое и естественное соответствие стандартной формуле введения речи.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Подпояшься
  rationale: Русский глагол сохраняет образ действия с одеждой и одновременно естественно выражает готовность немедленно отправиться в путь; буквальная анатомическая формулировка была бы тяжеловесной.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: этот сосуд с маслом
  rationale: פַּךְ обозначает небольшой сосуд, часто для масла. Нейтральное «сосуд» не уточняет материал или форму, не названные в тексте.
- source_word: בְּיָדֶךָ
  choice: в руку
  rationale: Сохранён конкретный образ еврейского текста; в русском после «возьми» естественно употребить винительный падеж с направлением действия.
- source_word: וְלֵךְ
  choice: и отправляйся
  rationale: Императив передан естественным русским глаголом движения, уместным для названного места назначения.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот Галаадский
  rationale: Устоявшаяся русская библейская форма географического названия, обозначающая Рамот в Галааде.
theological_decisions: []
