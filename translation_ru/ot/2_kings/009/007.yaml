  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: ru
  text: Ты поразишь дом Ахава, своего господина, а Я отомщу за кровь Моих рабов-пророков и за кровь всех рабов Яхве — за кровь, пролитую по вине Иезавели[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из руки Иезавели»; еврейское выражение указывает на её причастность к кровопролитию и ответственность за него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: Ты поразишь
  rationale: Глагол נכה в контексте суда над царским домом означает решительное поражение, вероятно ведущее к гибели. «Поразишь» сохраняет силу выражения, не сужая его до одного лишь «убьёшь».
- source_word: בֵּית אַחְאָב
  choice: дом Ахава
  rationale: «Дом» естественно передаёт династическое и родовое значение בַּיִת и сохраняет библейский образ царского рода.
- source_word: אֲדֹנֶיךָ
  choice: своего господина
  rationale: Речь идёт о земном владыке Ииуя. Возвратное «своего» естественно по-русски связывает принадлежность с подлежащим «ты».
- source_word: וְנִקַּמְתִּי
  choice: а Я отомщу
  rationale: נקם обозначает воздаяние за причинённое зло. «Отомщу» кратко и прямо сохраняет язык Божьего возмездия; союз «а» естественно передаёт переход от поручения Ииую к Божьей цели.
- source_word: דְּמֵי
  choice: за кровь
  rationale: Форма множественного числа «крови» в еврейском служит идиомой кровопролития и вины за убийство. Русское «отомщу за кровь» сохраняет образ и звучит естественно.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: Моих рабов-пророков
  rationale: Дефисное приложение ясно показывает, что пророки названы Божьими рабами, и избегает тяжеловесности.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: всех рабов Яхве
  rationale: Сохраняется конструкция принадлежности и личное имя יהוה передаётся как «Яхве», а не заменяется титулом.
- source_word: מִיַּד אִיזָבֶל
  choice: пролитую рукой Иезавели
  rationale: Буквальное «из руки Иезавели» в данном контексте выражает виновную причастность или ответственность. Добавленное по смыслу «пролитую» делает эту идиому ясной на современном русском, не утверждая, что каждое убийство она совершила лично.
theological_decisions:
- issue: Язык Божьего возмездия
  choice: а Я отомщу за кровь
  alternative: а Я взыщу за кровь
  rationale: Текст прямо приписывает Богу воздаяние за кровь Его служителей. Формулировка не смягчает этого утверждения и не развивает его сверх сказанного.
- issue: Степень личного участия Иезавели
  choice: пролитую рукой Иезавели
  alternative: за которую ответственна Иезавель
  rationale: Образ «руки» сохраняет исходную метафору агентности и ответственности, но не разрешает без основания вопрос, совершала ли Иезавель каждое убийство собственноручно.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Личное имя יהוה передано как «Яхве». Местоимения Бога написаны с прописной буквы в соответствии с принятым благоговейным русским оформлением прямой Божьей речи.
