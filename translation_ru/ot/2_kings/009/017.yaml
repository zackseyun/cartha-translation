  text: וְ/הַ/צֹּפֶה֩ עֹמֵ֨ד עַֽל הַ/מִּגְדָּ֜ל בְּ/יִזְרְעֶ֗אל וַ/יַּ֞רְא אֶת שִׁפְעַ֤ת יֵהוּא֙ בְּ/בֹא֔/וֹ וַ/יֹּ֕אמֶר שִׁפְעַ֖ת אֲנִ֣י רֹאֶ֑ה וַ/יֹּ֣אמֶר יְהוֹרָ֗ם קַ֥ח רַכָּ֛ב וּֽ/שְׁלַ֥ח לִ/קְרָאתָ֖/ם וְ/יֹאמַ֥ר הֲ/שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: ru
  text: 'Страж стоял на башне в Изрееле и увидел отряд Ииуя, когда тот приближался, и сказал: «Я вижу отряд». Иорам приказал: «Возьми всадника и пошли навстречу им. Пусть он скажет: „С миром ли?“»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «Всё ли в порядке?»'
    reason: Лаконичное הֲשָׁלוֹם может быть вопросом как о мирных намерениях, так и о благополучии; основной текст сохраняет буквальную краткость, а примечание даёт идиоматический вариант.
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: страж
  rationale: Обозначает человека, который несёт дозор; «страж» естественно и кратко передаёт роль в повествовании.
- source_word: עֹמֵד
  choice: стоял
  rationale: Причастие задаёт фоновое, продолженное состояние; русское прошедшее несовершенного вида сохраняет этот оттенок.
- source_word: הַמִּגְדָּל
  choice: башня
  rationale: Передаёт основное значение слова без добавления контекстуального уточнения «сторожевая».
- source_word: בְּיִזְרְעֶאל
  choice: в Изрееле
  rationale: Традиционная русская форма географического названия.
- source_word: שִׁפְעַת
  choice: отряд
  rationale: В данном военном контексте слово обозначает заметную группу людей; «отряд» естественно передаёт смысл, не преувеличивая её численность.
- source_word: יֵהוּא
  choice: Ииуй
  rationale: Традиционная русская библейская форма личного имени.
- source_word: בְּבֹאוֹ
  choice: приближавшийся
  rationale: Передаёт происходящее приближение Ииуя и естественно соединяется по-русски с глаголом восприятия.
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: Я вижу отряд
  rationale: Сохраняет повтор ключевого существительного и прямую, краткую форму доклада.
- source_word: קַח רַכָּב
  choice: Возьми всадника
  rationale: Единственное число и дальнейшие формы указывают на одного конного посланника.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: и пошли навстречу им
  rationale: Сохраняет множественное число масоретского суффикса, относящееся к видимой группе.
- source_word: וְיֹאמַר
  choice: Пусть он спросит
  rationale: После повеления форма выражает косвенное распоряжение; «спросит» естественно передаёт функцию последующей вопросительной реплики.
- source_word: הֲשָׁלוֹם
  choice: С миром ли?
  rationale: Сохраняет предельную краткость еврейского вопроса и повторяющийся в эпизоде мотив мира, не уточняя однозначно, идёт ли речь о благополучии или о мирных намерениях.
