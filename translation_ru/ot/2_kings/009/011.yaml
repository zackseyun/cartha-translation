base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: ru
  text: 'Ииуй вышел к слугам своего господина, и один из них спросил его: «Всё ли в порядке?[a] Зачем приходил к тебе этот безумец?[b]» Ииуй ответил им: «Вы знаете этого человека и его речи[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Мир ли?» — то есть всё ли благополучно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «этот сумасшедший». В еврейском тексте это презрительное обозначение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «его разговоры»; возможно также: «его манеру говорить». Еврейское слово имеет широкое значение и может относиться к речи или высказываниям человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: слугам своего господина
  rationale: Сохраняет обычные значения עֶבֶד и אָדוֹן, не уточняя вопреки данной фразе, что господин — царь, и не вводя здесь значение рабской зависимости.
- source_word: וַיֹּאמֶר לוֹ
  choice: и один из них спросил его
  rationale: При множественном предшествующем «слуги» глагол стоит в единственном числе; «один из них» естественно передаёт, что от лица группы заговорил один человек. Вопросительное содержание позволяет по-русски употребить «спросил».
- source_word: הֲשָׁלוֹם
  choice: Всё ли в порядке?
  rationale: Естественно передаёт еврейский идиоматический вопрос о мире, благополучии и отсутствии беды.
- source_word: מַדּוּעַ בָּא
  choice: Зачем приходил
  rationale: В данном диалоге вопрос касается цели уже состоявшегося прихода; русское «зачем приходил» звучит естественно и не добавляет результата визита.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: этот безумец
  rationale: Сохраняет мужской род и презрительно-оскорбительный характер обозначения, не смягчая его до нейтрального описания.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: Вы знаете этого человека
  rationale: Передаёт уклончивый ответ Ииуя и определённость существительного; «этого человека» в современном русском естественнее буквального «человека» в данной реплике.
- source_word: שִׂיחוֹ
  choice: его речи
  rationale: Слово может обозначать речь, разговор или высказывания. «Его речи» сохраняет широту значения и допускает пренебрежительный оттенок из контекста, не усиливая его до «бреда» или «болтовни».
