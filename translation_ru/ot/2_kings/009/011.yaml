  register: Современный литературный русский язык с достоинством библейского повествования. Диалог передан естественно; оскорбительный тон слова «безумец» и уклончивость ответа Ииуя сохранены. Повтор имени «Ииуй» во второй реплике устраняет возможную русскую местоименную неясность.
