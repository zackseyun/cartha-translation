  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: ru
  text: Ииуй, сын Иосафата, сына Нимши, вступил в заговор против Иорама. В то время Иорам вместе со всем Израилем[b] стоял на страже[a] в Рамот-Галааде из-за Хазаэля, царя Арама[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать несение стражи, охрану или оборону в военной обстановке.
    reason: lexical_alternative
  - marker: b
    text: 'То есть Израильское царство или его войско; буквально: «весь Израиль».'
    reason: cultural_note
  - marker: c
    text: 'Традиционно: «Сирия»; по-еврейски: «Арам».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: составил заговор против
  rationale: Возвратная порода глагола קשר в политическом контексте означает участие в заговоре или мятеже; сочетание с אֶל указывает на Иорама как на цель заговора.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: сын Иосафата, сына Нимши
  rationale: Сохранена повторяющаяся генеалогическая формула «сын… сын…», не заменённая более толковательным «внук».
- source_word: הָיָה שֹׁמֵר
  choice: держал оборону
  rationale: Конструкция с הָיָה и причастием описывает продолжавшееся фоновое действие; в военной обстановке שמר может обозначать охрану, несение стражи или оборону. Выбран естественный русский оборот, а неоднозначность отмечена в сноске.
- source_word: בְּרָמֹת גִּלְעָד
  choice: в Рамот-Галааде
  rationale: Топоним передан транслитерацией, а предлог ב — местным значением «в».
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: Иорам вместе со всем Израилем
  rationale: Сохранено буквальное национальное обозначение «весь Израиль»; военный смысл контекста пояснён в сноске без сужения основного текста до «войска».
- source_word: מִפְּנֵי
  choice: от
  rationale: В данном военном контексте предлог выражает направленность обороны против угрозы со стороны Хазаэля; русское «от» кратко и естественно передаёт это отношение.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Еврейское אֲרָם передано историческим названием «Арам», а не традиционным, но более поздним обозначением «Сирия».
