base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/028.yaml
  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: ru
  text: Слуги отвезли его в Иерусалим и похоронили в его гробнице вместе с его отцами[a] в городе Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Вместе с его отцами» — древнееврейский погребальный оборот: среди его царственных предков.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: отвезли
  rationale: Порода hифиль глагола רכב буквально выражает побуждение ехать или перевозку. В контексте перенесения тела Ахозии «отвезли» естественно передаёт транспортировку и не создаёт впечатления, будто он ехал сам.
- source_word: עֲבָדָיו
  choice: слуги
  rationale: עבד обычно означает слугу, а при царском дворе также человека на царской службе. «Слуги» — прямой и понятный эквивалент.
- source_word: יְרוּשָׁלָמָה
  choice: в Иерусалим
  rationale: Направительный суффикс указывает на движение к Иерусалиму; по-русски это естественно выражается сочетанием «в Иерусалим».
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: и похоронили
  rationale: Прямо передаёт последовательное действие тех же слуг; повторять подлежащее в русском не требуется.
- source_word: בִקְבֻרָתוֹ
  choice: в его гробнице
  rationale: Существительное обозначает место погребения; «гробница» уместно в царском контексте и сохраняет притяжательное значение.
- source_word: עִם אֲבֹתָיו
  choice: вместе с его отцами
  rationale: Сохранён древнееврейский погребальный оборот и его династический оттенок; пояснение дано в сноске.
- source_word: בְּעִיר דָּוִד
  choice: в городе Давида
  rationale: Прямая и традиционно понятная передача географического наименования.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и повествовательный. «Отвезли» выбрано вместо буквального «посадили верхом / заставили ехать», поскольку речь идёт о перевозке тела. Библейский оборот «с его отцами» сохранён ради династического оттенка и пояснён сноской.
