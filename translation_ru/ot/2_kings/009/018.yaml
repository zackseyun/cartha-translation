base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: ru
  text: 'И всадник поехал ему навстречу и сказал: «Так говорит царь: „Мир ли?“»[a] Ииуй ответил: «Какое тебе дело до мира? Поверни и стань за мной».[b] Дозорный доложил: «Посланец добрался до них, но не вернулся».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё ли благополучно?» Еврейское слово шалом может означать мир, благополучие или то, что всё в порядке; оно повторяется в ответе Ииуя.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Повернись позади меня»; по смыслу возможно: «Пристройся за мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: всадник
  rationale: Естественный русский эквивалент буквального «едущий на коне»; соответствует военному контексту.
- source_word: לִקְרָאתוֹ
  choice: ему навстречу
  rationale: Передаёт направленное движение к человеку с целью встретить его.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Так говорит царь
  rationale: Сохраняет стандартную формулу передачи царского послания и уместную для библейского повествования торжественность.
- source_word: הֲשָׁלוֹם
  choice: Мир ли?
  rationale: Сохраняет краткость вопроса, его контекстуальную неоднозначность и повтор ключевого слова שָׁלוֹם в ответе Ииуя.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Какое тебе дело до мира?
  rationale: Естественно передаёт отстраняющий риторический вопрос, не устраняя повтор слова «мир».
- source_word: סֹב אֶל אַחֲרָי
  choice: Поверни и стань за мной
  rationale: Передаёт приказ развернуться и занять место позади Ииуя; буквальная форма и возможный военный смысл отмечены в сноске.
- source_word: הַצֹּפֶה
  choice: дозорный
  rationale: Современное и понятное обозначение человека, наблюдающего с возвышенного поста.
- source_word: הַמַּלְאָךְ
  choice: посланец
  rationale: В данном историческом контексте речь идёт о человеке, посланном царём, а не об ангеле.
- source_word: בָּא ... עַד הֵם
  choice: добрался до них
  rationale: Естественно передаёт достижение посланцем места, где находились Ииуй и его люди.
- source_word: וְלֹא שָׁב
  choice: но не вернулся
  rationale: Точно и естественно передаёт наблюдаемый дозорным результат.
