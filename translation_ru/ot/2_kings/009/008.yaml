  source_fidelity: 'Начало стиха передано верно: וְאָבַד в пророческом контексте естественно передано будущим «погибнет», а «весь дом Ахава» сохраняет династический образ. «Истреблю» адекватно передаёт וְהִכְרַתִּי. Однако «находящегося под стражей, и оставленного на свободе» придаёт עָצוּר וְעָזוּב слишком конкретное и не подтверждённое значение; особенно «оставленный на свободе» не следует непосредственно из עָזוּב. Более устойчивое и соответствующее английскому контрольному следу «раба и свободного» допустимо в основном тексте при сноске, отмечающей спорность точного оттенка формулы.'
