base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: ru
  text: И погибнет весь дом Ахава, и Я истреблю в доме Ахава всякого мужчину[a] — и раба, и свободного — в Израиле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мочащегося к стене» — грубоватая древнееврейская идиома, обозначающая мужчину.'
    reason: lexical_alternative
  - marker: b
    text: 'Смысл древнееврейской парной формулы «раба и свободного» не вполне ясен; возможны также переводы: «зависимого и свободного» или «удерживаемого и оставленного». Вероятно, она обозначает всех без исключения.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: И погибнет
  rationale: Перфект с союзом в пророческой речи передаёт будущее событие. «Погибнет» сохраняет значение суда, не уточняя сверх текста непосредственный способ действия.
- source_word: כָּל בֵּית אַחְאָב
  choice: весь дом Ахава
  rationale: «Дом» сохраняет библейское обозначение царской династии и семейства.
- source_word: וְהִכְרַתִּי
  choice: Я истреблю
  rationale: Каузативная форма от כרת означает устранить, отсечь, истребить. Буквальное «отсеку» здесь неестественно по-русски, тогда как «истреблю» ясно передаёт формулу династического суда.
- source_word: לְאַחְאָב
  choice: у Ахава
  rationale: 'Предлог выражает принадлежность: речь идёт о мужчинах из дома или рода Ахава.'
- source_word: מַשְׁתִּין בְּקִיר
  choice: всякого мужчину
  rationale: Грубоватая древнееврейская идиома буквально описывает мочащегося у стены и обозначает мужчину. Смысл дан в основном тексте, буквальная форма — в сноске.
- source_word: וְעָצוּר וְעָזֻב
  choice: и находящегося под стражей, и оставленного на свободе
  rationale: Переданы конкретные образы «удерживаемого» и «оставленного/отпущенного», вероятно образующие всеохватную пару. Поскольку точный социальный смысл формулы неясен, неопределённость отмечена в сноске.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: 'Предлог передан как указание места: суд относится к дому Ахава в Израиле.'
theological_decisions:
- issue: Передача формулы суда над династией
  choice: Сохранить выражение «дом Ахава» и всеохватный характер уничтожения мужской линии, не заменяя его общим пересказом о семье.
  alternative: «Я полностью уничтожу семью Ахава».
  rationale: Выбранный вариант сохраняет царско-династическую лексику и напряжённость пророческого суда.
- issue: Неясная парная формула וְעָצוּר וְעָזֻב
  choice: Передать образы как «находящегося под стражей» и «оставленного на свободе», снабдив пояснением о неясности идиомы.
  alternative: «Раба и свободного», «зависимого и свободного» или «защищённого и покинутого».
  rationale: Еврейская формула допускает разные толкования. Перевод не должен безоговорочно превращать её в точную юридическую классификацию.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Династическое «дом Ахава» оставлено как значимый библейский образ; грубая идиома вынесена в сноску. Неясная всеохватная формула передана формально и сопровождается пояснением, чтобы не скрывать текстовую неоднозначность.
