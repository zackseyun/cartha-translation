  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: ru
  text: 'И послал он второго всадника. Тот подъехал к ним и сказал: «Так говорит царь: мир ли?»[a] Но Ииуй ответил: «Что тебе до мира? Поверни и следуй за мной!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё ли благополучно?» Еврейское שָׁלוֹם может означать «мир», «благополучие» или состояние, при котором всё в порядке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: второго всадника
  rationale: Буквально — «второго едущего на коне»; «второй всадник» естественно передаёт последовательность посланцев и конный характер поручения.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Так говорит царь
  rationale: Сохранена стандартная формула передачи царского сообщения, звучащая ясно и достойно в современном русском языке.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Слово может означать мир, благополучие или то, что всё в порядке. «Мир» сохраняет намеренную лексическую связь между вопросом посланца и ответом Ииуя.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Что тебе до мира?
  rationale: Русский оборот естественно передаёт резкое отстранение посланца от вопроса о мире и сохраняет повтор שָׁלוֹם.
- source_word: סֹב אֶל אַחֲרָי
  choice: Поворачивай за мной!
  rationale: Передаёт буквальное направление «поверни за/позади меня», не разворачивая его однозначно в пояснительное «следуй за мной»; по контексту это приказ занять место позади Ииуя.
