base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: ru
  text: 'Он встал, вошёл в дом, вылил ему на голову масло и сказал ему: «Так говорит Яхве, Бог Израиля: „Я помазал тебя царём над народом Яхве, над Израилем“[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я помазываю тебя царём над народом Яхве, над Израилем». Еврейский перфект в этой формуле помазания может иметь перформативное значение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם וַיָּבֹא הַבַּיְתָה
  choice: Он встал и вошёл в дом
  rationale: Последовательные формы повествования передают два следующих друг за другом действия; направительный суффикс в הַבַּיְתָה указывает на движение внутрь дома.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: тот вылил ему на голову масло
  rationale: 'Глагол יצק означает «лить, выливать»; местоименное «тот» снимает возможную для русского текста неясность субъекта: масло вылил молодой пророк на голову Ииуя.'
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная и узнаваемая русская передача стандартной пророческой формулы посланника.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача сопряжённого сочетания, сохраняющая указание на особые отношения Бога с Израилем.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: Я помазал тебя царём
  rationale: Еврейский перфект естественно соотносится с только что совершённым действием, а творительный «царём» ясно выражает назначение на царство.
- source_word: אֶל עַם יְהוָה אֶל יִשְׂרָאֵל
  choice: над народом Яхве, над Израилем
  rationale: В контексте поставления царя אֶל указывает на область его власти; повтор «над» сохраняет параллелизм и поясняющее соотношение двух выражений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Временная и перформативная сила מְשַׁחְתִּיךָ
  choice: Я помазал тебя
  alternative: Я помазываю тебя
  rationale: Перфект допускает понимание как завершённого действия, только что совершённого излитием масла, однако в формуле помазания он может также иметь перформативную силу; альтернативу следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией пророческой речи. Синтаксис сделан естественным для русского повествования; двусмысленность формы помазания сохранена в сноске.
