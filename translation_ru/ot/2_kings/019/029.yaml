base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: ru
  text: 'И вот тебе знак: в этом году ешьте то, что выросло само собой[a], и во второй год — то, что взойдёт из него[b]; и в третий год сейте и жните, сажайте виноградники и ешьте их плоды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть урожай, который взошёл без посева.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово встречается редко; вероятно, оно означает самосев второго года — урожай, взошедший из семян предыдущего непосеянного урожая.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: знак
  rationale: Обычное значение אוֹת в контексте пророческого подтверждения; «знак» естественно и точно передаёт смысл.
- source_word: אָכוֹל
  choice: ешьте
  rationale: Инфинитив абсолютный здесь имеет побудительно-предсказательную силу. Множественное число согласовано с последующими явными формами множественного числа и показывает, что речь идёт не только о царе, но и о народе.
- source_word: סָפִיחַ
  choice: то, что выросло само собой
  rationale: Существительное обозначает урожай, взошедший без посева; описательный перевод понятнее современному читателю, чем специальный земледельческий термин.
- source_word: סָחִישׁ
  choice: то, что взойдёт после него
  rationale: Редкое слово, вероятно, обозначает самосев второго года, происходящий от урожая предыдущего года. Формулировка сохраняет последовательность и не создаёт ложной определённости.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: сейте и жните
  rationale: Прямой перевод форм повелительного наклонения; традиционная земледельческая пара остаётся ясной в современном русском языке.
- source_word: וְנִטְעוּ כְרָמִים
  choice: сажайте виноградники
  rationale: Естественная русская передача обычного древнееврейского выражения.
- source_word: וְאִכְלוּ פִרְיָם
  choice: ешьте их плоды
  rationale: Местоименный суффикс множественного числа естественно относится к виноградникам; перевод сохраняет буквальный образ употребления плодов в пищу.
