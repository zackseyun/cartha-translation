  terminology: «Знак», «выросло само собой», «сейте и жните», «сажайте виноградники» и «их плоды» точны и стилистически удачны. Сноски корректно поясняют самосев и редкость סָחִישׁ, не выдавая вероятное толкование за несомненное.
