base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: ru
  text: Они бросили их богов в огонь[a], потому что это были не боги, а изделия человеческих рук, из дерева и камня; поэтому они уничтожили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поместили их богов в огонь». Еврейский глагол буквально означает «дали, поместили» и здесь употреблён в смысле бросания или помещения чего-либо в огонь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: и бросили
  rationale: Глагол נתן буквально означает «дать, поместить», но в сочетании с «в огонь» естественно передаёт действие бросания или помещения в огонь; «бросили» ясно выражает разрушительный контекст.
- source_word: אֱלֹהֵיהֶם
  choice: их богов
  rationale: Сохранено буквальное обозначение «боги», а не заменено словом «идолы», поскольку следующий оборот прямо отрицает их божественность и тем самым создаёт намеренный риторический контраст.
- source_word: בָּאֵשׁ
  choice: в огонь
  rationale: При глаголе движения русский винительный падеж естественно выражает направленность действия внутрь огня.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: потому что те были не богами
  rationale: Оборот сообщает причину их уничтожимости и отрицает подлинную божественность этих предметов; «те» помогает ясно соотнести сказуемое с ранее упомянутыми богами.
- source_word: כִּי אִם
  choice: а
  rationale: В конструкции «не богами, а изделиями» союз естественно передаёт сильное противопоставление כִּי אִם.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: изделиями человеческих рук
  rationale: Фраза подчёркивает рукотворность предметов. Множественное число согласовано с «те», а «человеческих» точно передаёт обобщённое значение אָדָם.
- source_word: עֵץ וָאֶבֶן
  choice: деревом и камнем
  rationale: Материалы названы прямо; творительный падеж служит приложением к «изделиями» и естественно звучит по-русски.
- source_word: וַיְאַבְּדוּם
  choice: и потому уничтожили их
  rationale: 'Форма понята переходно: завоеватели уничтожили этих богов. «Потому» обозначает итоговую связь с пояснением, что они были лишь рукотворными предметами.'
theological_decisions:
- issue: Передача אָדָם в обобщённом высказывании о человеческом изготовлении
  choice: человеческих
  alternative: мужских / человека
  rationale: Здесь אָדָם обозначает людей вообще, а не отдельного мужчину; выражение «человеческих рук» естественно сохраняет общий смысл и противопоставление живому Богу.
- issue: Сохранение названия אֱלֹהִים применительно к языческим изображениям
  choice: богов
  alternative: идолов
  rationale: 'Текст сначала передаёт их заявленный статус, а затем отрицает его: «не богами, а изделиями». Замена на «идолов» заранее разрешила бы заложенное в стихе богословское противопоставление.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет причинно-противительную структуру оригинала, не вводя архаизмов и не заменяя «богов» истолковывающим словом «идолы».
