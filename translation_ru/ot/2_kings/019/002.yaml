  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: ru
  text: И послал он Елиакима, управляющего дворцом[a], писца Шевну и старейшин священников, одетых во вретища[b], к пророку Исаии, сыну Амоса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который над домом». Так назывался высокий царский чиновник, ведавший дворцом или царским домом.'
    reason: cultural_note
  - marker: b
    text: 'Или: «облекавшихся во вретища». Еврейское причастие может подчёркивать как действие, так и наступившее состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал он
  rationale: Форма wayyiqtol продолжает повествование; союз «и» сохраняет последовательность еврейского рассказа, не добавляя более узкого временного оттенка.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: управляющего дворцом
  rationale: Выражение обозначает высокопоставленного царского чиновника, ведавшего дворцом или царским домом. Такой перевод естественен по-русски и передаёт должностной смысл идиомы.
- source_word: הַסֹּפֵר
  choice: писца
  rationale: Прямое соответствие слову, которое может обозначать писца или царского секретаря; «писец» не сужает значение до конкретной современной должности.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: старейшин священников
  rationale: Сохранена конструкция исходного текста, где речь именно о старейшинах среди священников, без сведения её к более общему понятию «главные священники».
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: одетых во вретища
  rationale: Причастие описывает делегацию в состоянии траура и уничижения. «Вретище» сохраняет устойчивый библейский образ грубой траурной одежды.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: к пророку Исаии
  rationale: Титул передан прямо, а порядок слов приспособлен к естественному русскому управлению предлога «к».
- source_word: בֶּן אָמוֹץ
  choice: сыну Амоса
  rationale: Родственная идентификация передана непосредственно и согласована с дательным падежом имени Исаии.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Слово «вретища» сохранено ради традиционного образа траура, а его смысл поддержан контекстом и сноской. Имена переданы в привычной русской библейской форме; Шевна следует еврейскому שֶׁבְנָא.
