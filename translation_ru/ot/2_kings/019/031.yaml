lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание и заверение предшествующего обетования; «ибо» естественно сохраняет причинно-пояснительную связь.
- source_word: מִירוּשָׁלִַם
  choice: из Иерусалима
  rationale: Предлог מִן обозначает исходную точку; русское «из» соответствует движению из города.
- source_word: תֵּצֵא שְׁאֵרִית
  choice: выйдет остаток
  rationale: Форма глагола согласована с существительным женского рода שְׁאֵרִית; «остаток» сохраняет пророческий и богословский смысл тех, кто уцелел после бедствия.
- source_word: וּפְלֵיטָה
  choice: и ... уцелевшие
  rationale: Существительное обозначает спасшихся или избежавших гибели; субстантивированное «уцелевшие» естественно по-русски и сохраняет параллелизм с «остатком».
- source_word: מֵהַר צִיּוֹן
  choice: с горы Сион
  rationale: Предлог указывает на исходную точку; по-русски движение с горы передаётся предлогом «с».
- source_word: קִנְאַת
  choice: ревность
  rationale: קִנְאָה охватывает значения горячей ревности, рвения и собственнической ревности. «Ревность» сохраняет многозначность и хорошо выражает пламенную решимость Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: совершит это
  rationale: Оборот означает, что названный результат будет осуществлён; «совершит это» звучит достойно и естественно, не добавляя причинности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя, а не титул; транслитерация «Яхве» сохраняет это различие.
- issue: Смысл קִנְאַת יְהוָה
  choice: Ревность Яхве
  alternative: рвение Яхве
  rationale: «Ревность» сохраняет присущую еврейскому слову смысловую напряжённость между пламенным рвением и ревностной исключительной приверженностью, не сводя выражение лишь к усердию.
