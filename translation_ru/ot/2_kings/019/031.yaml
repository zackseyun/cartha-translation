  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: ru
  text: Ибо из Иерусалима выйдет остаток, и с горы Сион — уцелевшие. Рвение Яхве совершит это.[a]
