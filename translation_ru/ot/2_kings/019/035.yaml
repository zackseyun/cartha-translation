  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: ru
  text: И в ту ночь ангел Яхве вышел и поразил в ассирийском лагере сто восемьдесят пять тысяч человек. А утром, когда встали[a], оказалось, что все они — мёртвые тела[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и они встали рано утром». В еврейском тексте не уточняется, кто именно встал.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «трупы мёртвые» — усиленное обозначение погибших.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: И в ту ночь
  rationale: Повествовательная формула וַיְהִי буквально означает «и было / и случилось», но в современном русском её естественно передать временной связкой без архаизации.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ допускает значения «посланник» и «ангел»; здесь речь идёт о сверхъестественном исполнителе Божьего суда, поэтому выбрано «ангел». Личное имя יהוה передано как «Яхве».
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Прямое и естественное соответствие глаголу יצא, сохраняющее движение в повествовании.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה означает «ударить, поразить» и в данном контексте подразумевает смертельный исход, подтверждённый концом стиха.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: в ассирийском лагере
  rationale: Естественная русская передача буквального «в лагере Ассирии»; Ассирия метонимически обозначает ассирийское войско.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: сто восемьдесят пять тысяч человек
  rationale: Число передано прямо; слово «человек» естественно в русском после обозначения числа погибших и не меняет смысла.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: когда утром встали
  rationale: Еврейская форма третьего лица множественного числа не называет субъект. Безлично-неопределённая русская конструкция сохраняет эту неопределённость и не вводит конкретных действующих лиц.
- source_word: וְהִנֵּה
  choice: 'то увидели:'
  rationale: הִנֵּה привлекает внимание к внезапно открывшейся картине. В современном русском повествовании «то увидели» естественно передаёт эту функцию, не прибегая к архаическому «вот» в середине конструкции.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: все они — мёртвые тела
  rationale: Сохранены и обобщающее «все они», и эмфатическое сочетание существительного «тела/трупы» с определением «мёртвые».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное заветное имя יהוה. Транслитерация «Яхве» прямо обозначает имя и не заменяет его титулом.
- issue: Кто встал утром
  choice: субъект оставлен неопределённым
  alternative: ассирийцы; жители Иерусалима; люди
  rationale: Еврейский текст использует третье лицо множественного числа без явно названного субъекта. Перевод не отождествляет его с какой-либо группой.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования, без устаревших формул. Неопределённость субъекта во второй части сохранена; внезапность зрительной картины выражена естественным русским оборотом.
