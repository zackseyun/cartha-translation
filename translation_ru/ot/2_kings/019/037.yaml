revisions:
- from: И вот, когда он поклонялся в храме[a] Нисроха, своего бога, Адраммелех и Шарецер поразили его мечом, а сами бежали в землю Арарат. И вместо него воцарился его сын Асархаддон.
  to: И вот, когда он поклонялся в храме[a] Нисроха, своего бога, Адраммелех и Шарецер поразили его мечом, а сами спаслись бегством в землю Арарат. И вместо него воцарился его сын Асархаддон.
  rationale: 'Внесена единственная смысловая правка: «бежали» заменено на «спаслись бегством», чтобы передать результативное значение נִמְלְטוּ. Остальные решения сохраняются: «храм» с буквальной сноской для בֵּית, культовое «поклонялся», инструментальное «мечом» и формула престолонаследия «вместо него воцарился».'
