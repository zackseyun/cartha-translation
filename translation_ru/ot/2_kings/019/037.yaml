  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: ru
  text: И вот, когда он поклонялся в храме[a] Нисроха, своего бога, Адраммелех и Шарецер поразили его мечом, а сами спаслись бегством в землю Арарат. И вместо него воцарился его сын Асархаддон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «в доме». Здесь имеется в виду святилище Нисроха.
    reason: Сноска сохраняет буквальный образ еврейского בֵּית, тогда как основной текст ясно передаёт его значение в культовом контексте.
lexical_decisions:
- source_word: וַיְהִי הוּא מִשְׁתַּחֲוֶה
  choice: И вот, когда он поклонялся
  rationale: Сочетание повествовательного וַיְהִי с местоимением и причастием вводит событие, происходившее в момент нападения. Оборот передаёт эту фоновую длительность естественным современным русским языком.
- source_word: בֵּית
  choice: в храме
  rationale: Буквально «в доме», но при имени божества речь идёт о его святилище; «в храме» ясно передаёт смысл контекста. Буквальная форма отмечена в сноске.
- source_word: נִסְרֹךְ
  choice: Нисроха
  rationale: Имя божества передано русской транслитерацией еврейской формы; падежное окончание обусловлено русским синтаксисом.
- source_word: מִשְׁתַּחֲוֶה
  choice: поклонялся
  rationale: В культовом контексте глагол означает религиозное поклонение, хотя буквально может описывать земной поклон.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: поразили его мечом
  rationale: Сохранён образ исходного глагола «поразить, ударить» и инструментальное значение предлога; контекст ясно указывает на смертельный удар.
- source_word: נִמְלְטוּ
  choice: бежали
  rationale: Нифаль глагола מלט обозначает успешное спасение бегством. Здесь «бежали» естественно описывает уход убийц, не добавляя деталей направления или способа.
- source_word: אֶרֶץ אֲרָרָט
  choice: в землю Арарат
  rationale: Сохранена конструкция с географическим названием Арарат без архаического прилагательного «Араратская».
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: вместо него воцарился
  rationale: Глагол מלך в повествовании о престолонаследии передан как «воцарился», а תַּחְתָּיו — как указание на занятие его места.
- source_word: אֵסַר חַדֹּן
  choice: Асархаддон
  rationale: Использована устоявшаяся русская форма имени ассирийского царя.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз «И вот» сохраняет повествовательный переход без архаичного «и было». Имена переданы в формах, понятных русскому читателю; синтаксис избегает двусмысленности относительно того, кто бежал и кто наследовал престол.
