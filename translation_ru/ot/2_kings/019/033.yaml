  source_fidelity: 'Основная мысль передана верно: пришедший тем же путём возвратится и не придёт к городу. Однако «не войдёт» конкретизирует еврейское לֹא יָבֹא («не придёт / не подойдёт к») как собственно вступление в город, чего формулировка с אֶל прямо не утверждает.'
  naturalness: Предлагаемая правка сохраняет современный литературный русский и торжественный пророческий регистр. Порядок слов «в этот город он не придёт» естественен и отчётливо передаёт выделение города в еврейском тексте.
  terminology: «Яхве» последовательно и корректно передаёт יהוה. «Возвещает» уместно для נְאֻם, хотя «говорит» или «изрекает» также были бы возможны.
