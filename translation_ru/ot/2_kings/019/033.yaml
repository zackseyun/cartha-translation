  text: בַּ/דֶּ֥רֶךְ אֲשֶׁר יָבֹ֖א בָּ֣/הּ יָשׁ֑וּב וְ/אֶל הָ/עִ֥יר הַ/זֹּ֛את לֹ֥א יָבֹ֖א נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: ru
  text: Той же дорогой, по которой он пришёл, он и вернётся; в этот город он не придёт, — возвещает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: Той же дорогой, по которой он пришёл
  rationale: Оборот буквально говорит о дороге, которой он пришёл и которой вернётся. «Той же дорогой» естественно передаёт анафорическое בָּהּ и смысл возвращения тем же путём.
- source_word: יָשׁוּב
  choice: он и вернётся
  rationale: שׁוּב обозначает возвращение назад; частица «и» подчёркивает соответствие между путём прихода и путём возвращения, не добавляя нового содержания.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: а в этот город не войдёт
  rationale: С предлогом אֶל глагол בוא означает движение к городу и по контексту допускает естественное русское «войти в город». Противительный союз «а» ясно передаёт сопоставление частей высказывания.
- source_word: נְאֻם
  choice: возвещает
  rationale: Пророческая формула указывает на торжественное и властное изречение; «возвещает» сохраняет возвышенный регистр и остаётся понятным современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте и не заменяет имя титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет это различие и не превращает имя в титул.
- issue: Степень категоричности пророчества
  choice: будущие формы «вернётся» и «не войдёт»
  alternative: модальные формулировки вроде «должен вернуться»
  rationale: Еврейские имперфекты в данном пророческом контексте выражают уверенно предсказанное будущее, а не обязанность или вероятность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим звучанием. Инверсия сведена к минимуму; формула «возвещает Яхве» сохраняет достоинство и категоричность оригинала.
