source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: ru
  text: 'Они сказали ему: «Так говорит Езекия: этот день — день бедствия, обличения и поругания[a]. Дети дошли до самого рождения[b][c], но нет сил родить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «поношения», «презрения».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дети дошли до места (или момента) рождения». Еврейское слово מַשְׁבֵּר имеет не вполне ясное значение и может указывать на место либо на решающий момент родов.'
    reason: lexical_alternative
  - marker: c
    text: Образ описывает роды, дошедшие до появления ребёнка на свет, когда у роженицы уже не осталось сил завершить их.
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая формула передачи царского или пророческого послания; настоящее время естественно передаёт её функцию в русском языке.
- source_word: יוֹם צָרָה
  choice: день бедствия
  rationale: צָרָה обозначает тяжёлое положение, беду или стеснение; «бедствие» сохраняет серьёзность и возвышенный тон.
- source_word: וְתוֹכֵחָה
  choice: обличения
  rationale: Слово может означать обличение, укор или наказание. «Обличение» сохраняет возможность того, что происходящее воспринимается как суровый укор, не уточняя его источник.
- source_word: וּנְאָצָה
  choice: поругания
  rationale: Слово выражает презрение, поношение или оскорбительное пренебрежение. «Поругание» естественно передаёт как унижение, так и враждебный вызов, не сужая смысл до одного лишь богохульства.
- source_word: הַיּוֹם הַזֶּה
  choice: этот день
  rationale: Сохраняет указательное усиление еврейского выражения и звучит естественно в торжественной речи.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: Дети дошли до самого рождения
  rationale: 'Передаёт образ родов, достигших решающего момента. Значение מַשְׁבֵּר трудно определить совершенно точно: речь может идти о моменте или месте появления ребёнка на свет.'
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: но нет сил родить
  rationale: 'Противительный союз по смыслу ясно выражает кульминацию метафоры: роды достигли решающего момента, однако сил для их завершения нет.'
- source_word: בָנִים
  choice: дети
  rationale: Хотя форма грамматически мужского рода, в образе родов имеются в виду дети как потомство вообще, а не непременно сыновья.
theological_decisions:
- issue: К кому относится обличение и от кого исходит поругание
  choice: Не уточнять субъект и направленность
  alternative: Передать как «день Божьего наказания и хулы на Бога»
  rationale: Еврейская цепочка существительных не называет прямо ни того, кто обличает, ни объекта поругания. Уточнение внесло бы богословское толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном царского послания. Краткая трёхчастная формула сохранена, а трудный образ родов передан понятно, без устранения лексической неопределённости.
