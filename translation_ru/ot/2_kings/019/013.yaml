base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: ru
  text: Где царь Хамата, царь Арпада и царь города Сефарваима, Ены и Иввы?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Древнееврейская конструкция кратка: после «Сефарваима» названы также Ена и Ивва. Не вполне ясно, относятся ли все три названия к слову «город» или это перечень мест, с которыми связано подразумеваемое «царь».'
    reason: Сохраняет синтаксическую неоднозначность перечня топонимов, не выдавая один из возможных разборов за однозначный смысл текста.
lexical_decisions:
- source_word: אַיּוֹ
  choice: Где
  rationale: 'Вопросительное наречие с местоименным суффиксом в данном насмешливом вопросе означает: «где он теперь, что с ним стало?» Краткое «где» естественно передаёт этот смысл по-русски.'
- source_word: מֶלֶךְ
  choice: царь
  rationale: Обычный русский эквивалент древнееврейского слова; повтор сохранён там, где он явно выражен в исходном тексте.
- source_word: חֲמָת
  choice: Хамат
  rationale: Передача топонима по его древнееврейской форме в современной русской транслитерации.
- source_word: אַרְפָּד
  choice: Арпад
  rationale: Устоявшаяся и близкая к древнееврейской форме русская передача топонима.
- source_word: לָעִיר סְפַרְוָיִם
  choice: города Сефарваима
  rationale: Сохраняет выраженное в древнееврейском тексте слово «город» и передаёт зависимость от слова «царь» естественной русской родительной конструкцией.
- source_word: הֵנַע
  choice: Ены
  rationale: Топоним передан формой «Ена» и поставлен в родительный падеж как продолжение перечня владений царя.
- source_word: וְעִוָּה
  choice: и Иввы
  rationale: Топоним «Ивва» включён в тот же зависимый от слова «царь» перечень; союз ו передан как «и».
theological_decisions:
- issue: Синтаксическая связь названий Ена и Ивва
  choice: 'Понимать их как продолжение перечня мест, зависимого от последнего слова «царь»: «царь… Сефарваима, Ены и Иввы»'
  alternative: Понимать их как названия, относящиеся к слову «город», либо оставить их как бессоюзные именительные формы
  rationale: Древнееврейская краткая конструкция допускает некоторую синтаксическую неопределённость. Родительный перечень наиболее ясно и естественно передаёт подразумеваемую зависимость от «царь», не добавляя отдельных царей, которых исходный текст прямо не называет.
translation_notes:
  register: Современный литературный русский язык; сохранены краткость насмешливого вопроса и риторическое повторение слова «царь». Топонимы переданы близко к древнееврейской форме, без архаизации.
