  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: ru
  text: 'И помолился Езекия перед Яхве, сказав: «Яхве, Бог Израиля, восседающий над херувимами[a]! Ты один — Бог над всеми царствами земли. Ты создал небеса и землю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сидящий на престоле над херувимами». Еврейское причастие означает «сидящий, восседающий»; пространственная связь с херувимами здесь не выражена предлогом. Это царственно-культовый образ Яхве на престоле.'
    reason: Лексическая и пространственная неоднозначность причастия יֹשֵׁב и его связи с הַכְּרֻבִים.
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: помолился
  rationale: Прямое и естественное соответствие основному значению глагола; в данном контексте речь идёт о молитве, а не специально о ходатайстве.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Сохраняет пространственно-реляционный смысл «перед, в присутствии» и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача сопряжённой конструкции в форме молитвенного обращения.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: восседающий над херувимами
  rationale: «Восседающий» передаёт царственно-культовый образ, а «над» соответствует образу престола над ковчегом, не вводя отсутствующего в еврейском тексте слова «между».
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: Ты один — Бог
  rationale: Естественно и выразительно передаёт усиленное утверждение исключительности Бога.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: над всеми царствами земли
  rationale: Передаёт подразумеваемое отношение всеобщего владычества, хотя еврейский предлог сам по себе имеет более широкую семантику.
- source_word: עָשִׂיתָ
  choice: сотворил
  rationale: В контексте создания небес и земли русское «сотворил» естественно передаёт עשה, сохраняя его результативный смысл; это не требует подмены исходного глагола техническим термином.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: небеса и землю
  rationale: Сохраняет множественную форму «небеса» и традиционную формулу всеобъемлющего творения.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; транслитерация «Яхве» сохраняет это отличие от титула.
- issue: Исключительность Бога и Его отношение ко всем земным царствам
  choice: Ты один — Бог над всеми царствами земли
  alternative: Ты — Бог, Ты один, для всех царств земли
  rationale: Формулировка ясно сохраняет исключительное Божество Яхве и универсальный масштаб Его власти, не разворачивая утверждение в более позднюю догматическую формулу.
- issue: Образ присутствия над херувимами
  choice: восседающий над херувимами
  alternative: обитающий среди херувимов; сидящий на херувимах
  rationale: Выбор сохраняет царственный образ престола и оставляет его образность, не сводя выражение лишь к пространственному местонахождению.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Синтаксис слегка упорядочен ради естественности; тире подчёркивает исключительное утверждение «Ты один — Бог». Все элементы исходного текста и маркер сноски сохранены.
