  source_fidelity: Основной текст в целом точно передаёт молитву, божественное имя и утверждение об исключительном владычестве Яхве. Однако «сотворил» заметно сильнее, чем עָשִׂיתָ («сделал, создал»), тогда как английский аудиторский след специально сохраняет нетехническое «made». Сноска также называет «обитание» буквальным значением и предлагает пространственные отношения «среди / над», хотя в данной еврейской конструкции отношение к херувимам не выражено предлогом и не должно выдаваться за буквальную формулировку.
