  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: ru
  text: 'Исаия сказал им: «Так скажите вашему господину: “Так говорит Яхве: не бойся слов, которые ты услышал и которыми хулили Меня слуги[a] царя Ассирии”».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юноши царя Ассирии». Еврейское слово может обозначать молодых людей, но здесь, вероятно, речь идёт о царских служителях или должностных лицах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר; простое прошедшее время естественно для русского рассказа.
- source_word: אֲדֹנֵיכֶם
  choice: вашему господину
  rationale: Слово обозначает Езекию как повелителя посланников; «господину» передаёт отношение подчинения и не смешивает это употребление с именем Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אַל תִּירָא
  choice: не бойся
  rationale: Естественно и точно передаёт отрицательное побуждение и заверение Бога.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: слов
  rationale: В данном контексте предлог выражает причину страха, а דְּבָרִים относится к услышанным речам; русская конструкция «не бойся слов» передаёт смысл без тяжеловесности.
- source_word: שָׁמַעְתָּ
  choice: ты услышал
  rationale: Совершенный вид передаёт завершённое действие, сохраняющее непосредственную значимость.
- source_word: גִּדְּפוּ
  choice: хулили
  rationale: Глагол обозначает оскорбительную, святотатственную речь против Бога; «хулили» сохраняет религиозную весомость и звучит естественно по-русски.
- source_word: נַעֲרֵי מֶלֶךְ אַשׁוּר
  choice: слуги царя Ассирии
  rationale: Хотя נַעַר может обозначать юношу, в придворном контексте множественное число указывает на служителей или должностных представителей царя.
- source_word: אֹתִי
  choice: Меня
  rationale: Прямое дополнение относится к Яхве и явно сохраняет личную направленность оскорбления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и отличает его от титула.
- issue: Сила глагола גִּדְּפוּ, направленного против Бога
  choice: хулили Меня
  alternative: поносили Меня; оскорбляли Меня
  rationale: «Хулили» передаёт не просто насмешку или человеческое оскорбление, а святотатственное поношение Бога, не добавляя отсутствующих в тексте подробностей.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой пророческой речи. Синтаксис сохраняет повтор формулы «Так… Так говорит», характерный для древнееврейского текста. Заглавная буква в «Меня» указывает на Бога как говорящего и соответствует принятой русской издательской традиции.
