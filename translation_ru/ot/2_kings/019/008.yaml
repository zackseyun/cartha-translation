lexical_decisions:
- source_word: וַיָּשָׁב
  choice: вернулся
  rationale: Глагол שׁוּב в последовательном повествовании обозначает возвращение; «вернулся» естественно и точно передаёт движение назад.
- source_word: רַב שָׁקֵה
  choice: Рабсак
  rationale: Ассирийский титул употреблён как устойчивое обозначение лица; традиционная русская форма «Рабсак» сохраняет связь с библейским повествованием и не навязывает спорного функционального перевода.
- source_word: וַיִּמְצָא אֶת
  choice: нашёл
  rationale: Прямое соответствие מָצָא с показателем прямого дополнения; здесь смысл в том, что Рабсак обнаружил царя в другом месте.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царя Ассирии
  rationale: Естественная русская передача еврейской сопряжённой конструкции.
- source_word: נִלְחָם עַל
  choice: сражающимся против
  rationale: Причастная форма выражает продолжающееся действие, а עַל при названии города указывает на направленные против него военные действия.
- source_word: לִבְנָה
  choice: Ливны
  rationale: Устоявшаяся русская форма библейского топонима Ливна в родительном падеже после «против».
- source_word: כִּי שָׁמַע
  choice: он услышал
  rationale: כִּי вводит поясняющую причинную связь. Русское двоеточие естественно показывает, что услышанное объясняет возвращение Рабсака.
- source_word: כִּי נָסַע
  choice: что тот ушёл
  rationale: נָסַע обозначает снятие с места, выступление или уход, особенно в военном контексте. Местоимение «тот» ясно относит действие к царю Ассирии, не добавляя имени.
- source_word: מִלָּכִישׁ
  choice: из Лахиса
  rationale: Стандартная русская форма топонима с прямой передачей предлога מִן.
