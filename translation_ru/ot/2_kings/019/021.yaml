base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: ru
  text: 'Вот слово, которое Яхве изрёк о нём: «Презирает тебя дева, дочь Сиона, насмехается над тобой; тебе вслед качает головой[a] дочь Иерусалима».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Качать головой» здесь — жест презрения и насмешки.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: слово
  rationale: В формуле введения пророчества דָּבָר обозначает слово, то есть божественное изречение; «слово» сохраняет формальную связь с исходным текстом и естественно звучит по-русски.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: Яхве изрёк о нём
  rationale: Предлог עַל здесь указывает на того, о ком говорится в пророчестве, не устраняя враждебного контекста. «Изрёк» соответствует возвышенному пророческому регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: בָּזָה לְךָ
  choice: презирает тебя
  rationale: Глагол выражает презрение и пренебрежение; настоящее время естественно передаёт живую поэтическую насмешку.
- source_word: לָעֲגָה לְךָ
  choice: насмехается над тобой
  rationale: Глагол означает осмеивать, глумиться; выбран нейтральный современный литературный эквивалент.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: дева, дочь Сиона
  rationale: Сохранены оба образных элемента еврейского выражения и поэтическое олицетворение Сиона; пунктуация позволяет не превращать сочетание в неестественный русский титул.
- source_word: אַחֲרֶיךָ
  choice: вслед тебе
  rationale: В данном контексте выражение рисует насмешливый жест вслед уходящему или отступающему врагу.
- source_word: רֹאשׁ הֵנִיעָה
  choice: качает головой
  rationale: Буквальный жест сохранён в основном тексте; его насмешливое значение разъяснено в примечании.
- source_word: בַּת יְרוּשָׁלִָם
  choice: дочь Иерусалима
  rationale: Сохранено поэтическое олицетворение города и параллелизм с дочерью Сиона.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Значение עָלָיו при דִּבֶּר
  choice: о нём
  alternative: против него
  rationale: Предлог может в контексте сопровождать враждебное пророчество, однако непосредственно обозначает предмет речи; перевод «о нём» сохраняет эту неоднозначность, тогда как содержание самой речи явно осуждающее.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим регистром. Поэтический параллелизм и олицетворение Сиона и Иерусалима сохранены; порядок слов слегка адаптирован для естественного русского звучания.
