  naturalness: Текст в целом естественен для современного литературного русского. Формулировка «обличит за слова» сохраняет невыраженный в еврейском прямой объект и звучит более идиоматично, чем «взыщет за слова». «Остаток, который ещё уцелел» ясен и не создаёт тяжеловесного сочетания прилагательного с существительным.
  terminology: «Яхве», «рабсак», «живой Бог», «поносить» и «вознеси молитву» уместны и соответствуют исходному тексту. Примечание к «рабсаку» корректно сообщает спорность титула, не выдавая одно толкование за несомненное.
