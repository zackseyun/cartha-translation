  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: ru
  text: Может быть, Яхве, твой Бог, услышит все слова рабсака[a], которого его господин, царь Ассирии, послал поносить живого Бога, и обличит за слова, которые услышал Яхве, твой Бог. Поэтому вознеси молитву за остаток, который ещё уцелел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рабсак — вероятно, титул высокопоставленного ассирийского чиновника; иногда его понимают как «главный виночерпий».
    reason: cultural_note
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Может быть, … услышит
  rationale: Сохраняет выраженную в еврейском тексте надежду без уверенности и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: רַב שָׁקֵה
  choice: рабсак
  rationale: Транслитерация ассирийского придворного титула не навязывает спорного точного определения должности.
- source_word: לְחָרֵף
  choice: поносить
  rationale: Передаёт дерзкое оскорбление и хулу, направленные против живого Бога.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: и взыщет за слова
  rationale: Глагол может обозначать обличение, порицание или судебное взыскание; сочетание сохраняет направленность Божьего ответа на услышанные слова и не добавляет отсутствующее прямое дополнение.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: Поэтому вознеси молитву
  rationale: Сохраняет образ еврейской идиомы «поднять молитву» в естественной русской форме; связь с предыдущей просьбой передана словом «поэтому».
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: уцелевший остаток
  rationale: Передаёт и ключевое понятие «остаток», и уточнение о тех, кто ещё остаётся в живых.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды содержит личное имя Бога; транслитерация сохраняет это отличие от титула.
- issue: Значение הַשְּׁאֵרִית
  choice: остаток
  alternative: уцелевшие; оставшиеся
  rationale: «Остаток» сохраняет устойчивое библейское понятие, а определение «уцелевший» ясно выражает непосредственный исторический смысл.
- issue: Объект וְהוֹכִיחַ
  choice: взыщет за слова
  alternative: обличит его за слова; осудит эти слова
  rationale: В еврейском тексте прямой объект не назван. Выбранная формулировка не решает без необходимости, относится ли действие непосредственно к посланнику, его речам или стоящей за ними дерзости.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формы «поносить», «вознеси молитву» и «остаток» понятны в контексте и сохраняют важные образы и лексику оригинала; синтаксис упрощён ровно настолько, чтобы стих естественно читался вслух.
