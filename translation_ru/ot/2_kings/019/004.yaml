revisions:
- from: Может быть, Яхве, твой Бог, услышит все слова рабсака[a], которого его господин, царь Ассирии, послал поносить живого Бога, и взыщет за слова, которые услышал Яхве, твой Бог. Поэтому вознеси молитву за уцелевший остаток.
  to: Может быть, Яхве, твой Бог, услышит все слова рабсака[a], которого его господин, царь Ассирии, послал поносить живого Бога, и обличит за слова, которые услышал Яхве, твой Бог. Поэтому вознеси молитву за остаток, который ещё уцелел.
