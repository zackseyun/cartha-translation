  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: ru
  text: И уцелевший остаток дома Иуды[a] снова пустит корни внизу и принесёт плод наверху.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаток дома Иуды, который остался».'
    reason: 'Лексическая альтернатива: передаёт причастное уточнение הַנִּשְׁאָרָה («оставшийся») без неудачного заявления о буквальности.'
lexical_decisions:
- source_word: וְיָסְפָה
  choice: снова
  rationale: Глагол יסף в сочетании с последующим образом выражает возобновление действия; «снова» естественно передаёт восстановление после бедствия.
- source_word: פְּלֵיטַת
  choice: уцелевший остаток
  rationale: Слово обозначает тех, кто избежал гибели и сохранился; перевод удерживает как конкретную идею выживших, так и библейский образ остатка.
- source_word: בֵּית יְהוּדָה
  choice: дома Иуды
  rationale: Сохранено полное историко-общинное обозначение, а не упрощённое «Иуды».
- source_word: הַנִּשְׁאָרָה
  choice: уцелевший
  rationale: Причастие уточняет, что остаток сохранился после бедствия. В основном тексте значение объединено с פְּלֵיטַת ради естественного русского языка, а буквальная избыточность отмечена в сноске.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: пустит корни внизу
  rationale: Существительное «корень» входит в образ укоренения; русское сочетание «пустить корни» естественно передаёт смысл и сохраняет направление вниз.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: и принесёт плод наверху
  rationale: Сочетание עשה с «плодом» означает плодоношение. Единственное число «плод» и пространственный контраст «внизу — наверху» сохранены.
theological_decisions:
- issue: Образ остатка в обетовании восстановления
  choice: уцелевший остаток
  alternative: оставшиеся в живых / остаток, который остался
  rationale: Формулировка сохраняет богословски значимый образ народа, пережившего суд, но не привносит в него более поздних доктринальных выводов.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Сохранены параллелизм и вертикальный контраст образов: корни внизу, плод наверху.'
