base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: ru
  text: 'Исаия, сын Амоса, послал Езекии весть: «Так говорит Господь, Бог Израиля: Я услышал то, о чём ты молился Мне относительно Сеннахирима, царя Ассирии».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Формально передаёт повествовательную последовательность и действие отправки вестника или послания; объект посылания в еврейском тексте не назван, поэтому в переводе он не добавлен.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Естественная русская формула введения передаваемой речи после глагола «послал».
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, соответствующая принятому в исходном английском слою LORD.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי
  choice: твою молитву ко Мне
  rationale: Синтаксически естественно связывает начальную относительную конструкцию с завершающим «Я услышал», не добавляя причинного союза, которого в еврейском тексте нет.
- source_word: אֶל סַנְחֵרִב
  choice: о Сеннахириме
  rationale: Предлог אֶל здесь обозначает предмет молитвы; русское «о» передаёт этот смысл естественно.
- source_word: שָׁמָעְתִּי
  choice: Я услышал
  rationale: Сохраняет прямое значение глагола и лаконичность божественного ответа.
theological_decisions:
- issue: Связь молитвы Езекии с ответом Бога
  choice: «Я услышал твою молитву ко Мне…»
  alternative: «Поскольку ты молился Мне… Я услышал»
  rationale: 'Еврейская конструкция אֲשֶׁר допускает понимание объекта: «то, о чём ты молился… Я услышал». Выбранная русская формулировка сохраняет смысл услышанной молитвы и не усиливает текст явной причинностью.'
- issue: Передача имени יהוה
  choice: «Господь»
  alternative: «Яхве»
  rationale: Выбрана общеупотребительная и достойная русская библейская традиция без привнесения конфессиональной специфики.
translation_notes:
  register: Современный литературный русский язык с традиционно-библейской торжественностью. Кавычки разграничивают речь Исаии и вложенные в неё слова Господа; местоимение «Мне» написано с прописной буквы согласно распространённой русской религиозной норме.
