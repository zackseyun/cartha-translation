  text: יַ֚עַן הִתְרַגֶּזְ/ךָ֣ אֵלַ֔/י וְ/שַׁאֲנַנְ/ךָ֖ עָלָ֣ה בְ/אָזְנָ֑/י וְ/שַׂמְתִּ֨י חַחִ֜/י בְּ/אַפֶּ֗/ךָ וּ/מִתְגִּ/י֙ בִּ/שְׂפָתֶ֔י/ךָ וַ/הֲשִׁ֣בֹתִ֔י/ךָ בַּ/דֶּ֖רֶךְ אֲשֶׁר בָּ֥אתָ בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: ru
  text: За то, что твоя ярость против Меня и твоя самоуверенность[a] дошли до Моих ушей, Я вложу Мой крюк в твой нос и Мои удила в твои губы и поверну тебя назад по той дороге, по которой ты пришёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беспечность» или «надменность». Еврейское слово означает спокойствие и уверенность в безопасности, здесь — в контексте враждебной самонадеянности.'
    reason: Лексическая неоднозначность слова שַׁאֲנַנְךָ.
lexical_decisions:
- source_word: יַעַן
  choice: За то, что
  rationale: Передаёт причинное основание последующего суда и естественно вводит русское сложное предложение.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: твоя ярость против Меня
  rationale: Сохраняет значение враждебного возбуждения и неистовства, направленного против Бога; именная конструкция соответствует еврейскому выражению с суффиксом второго лица.
- source_word: שַׁאֲנַנְךָ
  choice: твоя самоуверенность
  rationale: Передаёт спокойную уверенность в собственной безопасности, которая в данном враждебном контексте приобретает оттенок надменности; иные возможные оттенки отмечены в сноске.
- source_word: עָלָה בְאָזְנָי
  choice: дошли до Моих ушей
  rationale: Сохраняет телесный образ еврейской идиомы, оставаясь понятным и естественным по-русски; множественное число согласовано с двумя однородными подлежащими.
- source_word: חַחִי בְּאַפֶּךָ
  choice: Свой крюк тебе в нос
  rationale: Сохраняет конкретный образ крюка, которым усмиряют животное или пленника, и подчёркивает унижение ассирийского царя.
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: Свои удила — тебе в губы
  rationale: Русское «удила» точно обозначает приспособление для управления животным; «в губы» сохраняет необычную конкретность еврейского текста, а тире делает параллельную конструкцию естественнее.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: поверну тебя назад
  rationale: 'Передаёт каузативное значение породы hifil: Бог заставит противника отступить.'
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: по той дороге, по которой ты пришёл
  rationale: 'Сохраняет формальную симметрию приговора: захватчик будет отправлен назад тем же путём, которым явился.'
theological_decisions:
- issue: Антропоморфные образы Бога, слышащего и обуздывающего ассирийского царя
  choice: Сохранить выражения «до Моих ушей», «Свой крюк» и «Свои удила»
  alternative: 'Передать отвлечённо: «Я услышал» и «Я усмирю тебя»'
  rationale: Конкретные образы выражают осведомлённость и верховную власть Бога и составляют существенную часть силы пророческого приговора; перевод не должен устранять их или давать им спекулятивное истолкование.
- issue: Смысл שַׁאֲנַנְךָ
  choice: «твоя самоуверенность» в основном тексте
  alternative: «твоя беспечность» или «твоя надменность»
  rationale: Слово обозначает состояние покоя и уверенности в безопасности, но здесь эта уверенность враждебна и предосудительна. «Самоуверенность» удерживает оба аспекта, а лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Образы крюка, удил, носа и губ сохранены без смягчения.
