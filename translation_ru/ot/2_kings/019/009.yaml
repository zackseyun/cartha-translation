base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: ru
  text: 'Услышав о Тиргаке, царе Куша[a]: «Вот, он выступил, чтобы сразиться с тобой», — он вернулся и послал к Езекии вестников сказать:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Эфиопии». В еврейском тексте — «Куш», древняя область к югу от Египта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: Услышав о
  rationale: Сочетание שמע с אֶל вводит содержание полученного известия; деепричастная конструкция естественно передаёт временную связь с последующим действием.
- source_word: תִּרְהָקָה
  choice: Тиргака
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מֶלֶךְ כּוּשׁ
  choice: царь Куша
  rationale: Сохранено древнееврейское географическое название כּוּשׁ без его потенциально анахроничного отождествления с современной Эфиопией.
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к сообщению; «вот» сохраняет эту функцию в современном литературном русском.
- source_word: יָצָא
  choice: выступил
  rationale: В военном контексте глагол выхода естественно передаётся как «выступил», без уточнения направления, которого нет в исходном тексте.
- source_word: לְהִלָּחֵם אִתָּךְ
  choice: чтобы сразиться с тобой
  rationale: Передаёт цель движения и враждебный смысл אִתָּךְ в контексте битвы.
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: он снова послал
  rationale: Последовательность «вернулся и послал» здесь идиоматически выражает повторное действие; русский вариант «снова послал» точен и не создаёт лишнего указания на физическое возвращение.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В данном военно-дипломатическом контексте речь идёт о людях, передающих сообщение.
- source_word: אֶל חִזְקִיָּהוּ
  choice: к Езекии
  rationale: Имя передано в традиционной русской форме, а направление — естественным русским предлогом.
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив вводит последующую прямую речь, продолжающуюся в следующем стихе.
