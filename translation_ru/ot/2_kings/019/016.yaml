source:
  edition: WLC
  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: ru
  text: Приклони, Яхве, ухо Твоё и услышь; открой, Яхве, глаза Твои и посмотри; услышь слова Сеннахирима, которые он послал, чтобы поносить Бога живого[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросать вызов Богу живому»; еврейский глагол может означать поношение, оскорбительную насмешку или дерзкий вызов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Приклони ... ухо Твоё
  rationale: Еврейская идиома выражает просьбу внимательно выслушать. «Приклони ухо» сохраняет образ и возвышенный молитвенный тон, оставаясь понятным по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וּשֲׁמָע
  choice: и услышь / услышь
  rationale: Повтор глагола сохранён, поскольку он подчёркивает настойчивость молитвы и связывает начало стиха с просьбой услышать слова Сеннахирима.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: открой ... глаза Твои и посмотри
  rationale: «Открой глаза» прямо передаёт идиому, а «посмотри» естественно выражает императив ראה в современном русском языке.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: слова Сеннахирима
  rationale: Сохраняется множественное число דבר и традиционно узнаваемая русская форма имени ассирийского царя.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: которые он послал
  rationale: Относительное предложение отнесено к «словам». Такая формулировка естественна по-русски и следует смыслу контекста, не перегружая текст неоднозначным местоименным суффиксом.
- source_word: לְחָרֵף
  choice: чтобы поносить
  rationale: Глагол означает оскорблять, поносить или дерзко бросать вызов. «Поносить» сохраняет акцент на презрительной хуле, не сужая значение до военного противостояния.
- source_word: אֱלֹהִים חָי
  choice: Бога живого
  rationale: Сохраняется библейское определение, противопоставляющее живого Бога безжизненным идолам; постпозиция прилагательного поддерживает торжественный молитвенный регистр.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл לְחָרֵף применительно к Богу
  choice: поносить Бога живого
  alternative: бросать вызов Богу живому; хулить Бога живого
  rationale: «Поносить» передаёт оскорбление и презрительное осмеяние; возможный оттенок дерзкого вызова сохранён в примечании, а не превращён в единственное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Синтаксический параллелизм просьб и повтор «услышь» сохранены. Местоимения при обращении к Богу написаны с прописной буквы в соответствии с традиционным русским благоговейным употреблением.
