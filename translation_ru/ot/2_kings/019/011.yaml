source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: ru
  text: Вот, ты слышал, что сделали цари Ассирии со всеми странами, предав их полному уничтожению[a]. И ты спасёшься?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предав их заклятию», то есть обрекши на полное уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт эмфатический призыв обратить внимание; естественно звучит в современном литературном русском и сохраняет торжественную окраску.
- source_word: שָׁמַעְתָּ
  choice: ты слышал
  rationale: Форма перфекта, обращённая к одному мужчине; в данном контексте обозначает уже известные адресату события.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: что сделали
  rationale: Естественно передаёт объектную конструкцию с относительным предложением.
- source_word: מַלְכֵי אַשּׁוּר
  choice: цари Ассирии
  rationale: Точное и обычное русское соответствие еврейской сопряжённой конструкции.
- source_word: לְכָל הָאֲרָצוֹת
  choice: со всеми странами
  rationale: В контексте אֲרָצוֹת означает политические территории или страны, а предлог при עָשׂוּ естественно передаётся русской конструкцией «сделали со».
- source_word: לְהַחֲרִימָם
  choice: предав их полному уничтожению
  rationale: Передаёт каузативную форму חרם и особый смысл обречения на уничтожение, не сводя выражение к нейтральному «разрушили»; менее архаично и прозрачнее, чем одно лишь «предав заклятию».
- source_word: וְאַתָּה תִּנָּצֵל
  choice: И ты спасёшься?
  rationale: Сохраняет подчёркнутое противопоставление, создаваемое самостоятельным местоимением, и риторический, насмешливый характер вопроса. Пассивно-возвратное значение нифаля естественно выражено глаголом «спастись».
theological_decisions:
- issue: Передача חרם в контексте военного уничтожения
  choice: предав их полному уничтожению
  alternative: предав их заклятию; полностью истребив их
  rationale: Основной текст сохраняет идею целенаправленного и полного обречения на уничтожение, а примечание указывает на специальное значение еврейского понятия, не навязывая дополнительного конфессионального толкования.
- issue: Утверждение или риторический вопрос в וְאַתָּה תִּנָּצֵל
  choice: И ты спасёшься?
  alternative: А ты спасёшься! / и ты будешь избавлен
  rationale: Контекст речи Рабсака требует насмешливого риторического вопроса, хотя сама еврейская глагольная форма формально допускает передачу будущим временем без вопросительного показателя.
translation_notes:
  register: Современный литературный русский с кратким, торжественным и угрожающим звучанием. Синтаксис сохраняет резкий переход к риторическому вопросу; специальный термин חרם разъяснён в сноске.
