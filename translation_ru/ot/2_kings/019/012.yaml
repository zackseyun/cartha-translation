  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: ru
  text: Разве боги народов, которых уничтожили мои предки, спасли жителей Гозана, Харана, Рецефа и жителей Эдена[a], находившихся в Телассаре?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновей Эдена». Это еврейское выражение может обозначать людей или жителей Эдена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Разве ... спасли
  rationale: Форма הִצִּילוּ — хифиль, перфект, 3-е лицо множественного числа; в контексте это риторический вопрос. «Разве ... спасли» естественно передаёт ожидаемый отрицательный ответ и значение избавления от гибели.
- source_word: אֹתָם
  choice: их
  rationale: Местоимение прямого дополнения относится к далее перечисленным народам или местностям; сохранено перед поясняющим перечнем.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: боги народов
  rationale: 'Прямая передача сопряжённой конструкции: речь о божествах, которым поклонялись эти народы.'
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: которых уничтожили мои предки
  rationale: В военном контексте שׁחת в пиэле означает «уничтожить, разорить». «Предки» современно и ясно передаёт אֲבוֹתַי, подразумевающее прежних ассирийских царей, не навязывая узко биологического смысла.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Гозан, Харан, Рецеф
  rationale: Собственные имена переданы принятой русской библейской транслитерацией с опорой на еврейские формы.
- source_word: וּבְנֵי עֶדֶן
  choice: жителей Эдена
  rationale: Буквально «сыновья Эдена»; в данном географическом перечне выражение, вероятнее всего, обозначает население или людей Эдена. Буквальная возможность сохранена в примечании.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: находившихся в Тел-Ассаре
  rationale: Относительное придаточное связывает жителей Эдена с местом Тел-Ассар; причастная конструкция звучит естественно и сохраняет эту связь.
