    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: И жители их
  rationale: Суффикс указывает на упомянутые ранее города; «жители» естественно и точно передаёт людей, обитавших в них. Начальное וְ передано союзом «и», без добавления более сильной причинной связи.
- source_word: קִצְרֵי יָד
  choice: были бессильны
  rationale: Буквально «коротки рукой» — идиома, означающая недостаток силы или возможности действовать. Русское «бессильны» ясно передаёт её смысл.
- source_word: חַתּוּ
  choice: были сломлены
  rationale: Глагол выражает состояние сокрушённости, подавленности или ужаса. «Были сломлены» сохраняет силу образа и хорошо сочетается с последующим «посрамлены».
- source_word: וַיֵּבֹשׁוּ
  choice: и посрамлены
  rationale: Форма обозначает постигший людей стыд и позор; «посрамлены» передаёт результат поражения, а не только внутреннее чувство стыда.
- source_word: הָיוּ
  choice: Они стали словно
  rationale: В данном контексте глагол вводит итоговое уподобление жителей хрупкой растительности; «стали словно» естественно выражает наступившее состояние.
- source_word: עֵשֶׂב שָׂדֶה
  choice: полевая трава
  rationale: Прямое и естественное по-русски обозначение полевой растительности.
- source_word: וִירַק דֶּשֶׁא
  choice: молодая зелень
  rationale: Сочетание обозначает свежую зелёную поросль; «молодая зелень» сохраняет образ нежной, непрочной растительности.
- source_word: חֲצִיר גַּגּוֹת
  choice: трава на крышах
  rationale: Сохраняется конкретный образ травы, растущей в неглубоком слое земли на плоских крышах и потому быстро засыхающей.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: и посев, опалённый прежде, чем успел подняться
  rationale: Еврейское выражение предельно сжато и описывает поражённую зноем или болезнью растительность до того, как она стала поднявшимся посевом. В русском добавлено «посев» для ясности сельскохозяйственного образа, а примечание сохраняет буквальную компактность и возможные оттенки.
