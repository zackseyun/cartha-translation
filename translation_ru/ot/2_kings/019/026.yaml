    text: 'Буквально: «коротки рукой» — то есть лишены силы или возможности действовать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пали духом»; еврейский глагол может обозначать сокрушённость, смятение или ужас.'
