  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: ru
  text: И буду защищать этот город, чтобы спасти его[a], ради Себя Самого и ради Давида, Моего слуги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы избавить его». Еврейский глагол может означать «спасти» или «избавить» от опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: И Я буду защищать
  rationale: Глагол גנן передаёт образ ограждения и защиты; «защищать» естественно звучит в контексте военной угрозы Иерусалиму.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: этот город
  rationale: При גנן предлог אֶל обозначает объект, на который направлено защитное действие; по-русски это естественно передаётся прямым дополнением.
- source_word: לְהוֹשִׁיעָהּ
  choice: чтобы спасти его
  rationale: Инфинитив от ישׁע выражает цель — спасение или избавление города от опасности. Местоимение согласовано с русским словом «город».
- source_word: לְמַעֲנִי
  choice: ради Себя
  rationale: Передаёт основание Божьего действия, заключённое в Нём Самом, без поясняющего богословского расширения.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: и ради Давида, Моего слуги
  rationale: Сохраняет второе основание, введённое לְמַעַן, и приложение «Моего слуги» в ясном современном русском порядке слов.
theological_decisions:
- issue: Основания для избавления Иерусалима
  choice: 'Сохранены два прямо названных основания: «ради Себя» и «ради Давида, Моего слуги».'
  alternative: Истолковать упоминание Давида как развёрнутую ссылку на заветные обещания.
  rationale: Еврейский текст называет оба основания параллельными оборотами с לְמַעַן, но не раскрывает здесь их богословское содержание; перевод не должен добавлять это толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные местоимения при обращении Бога к Себе выбраны как редакционная норма; синтаксис краток и сохраняет параллель двух оборотов «ради».
