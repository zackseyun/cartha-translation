  to: 'Через своих посланников ты поносил Владыку и говорил: «Со множеством своих колесниц я поднялся на горные вершины, в самые отдалённые места Ливана. Я срублю его высокие кедры, лучшие его кипарисы[a] и войду в его самый дальний приют, в его роскошный лес».'
