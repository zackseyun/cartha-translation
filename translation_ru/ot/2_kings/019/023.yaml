  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: ru
  text: 'Через своих посланников ты поносил Владыку и говорил: «Со множеством своих колесниц я поднялся на горные вершины, в самые отдалённые места Ливана. Я срублю его высокие кедры, лучшие его кипарисы[a] и войду в его самый дальний приют, в его роскошный лес».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лучшие его пихты»; точное значение еврейского названия этой породы дерева неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: Через своих посланников
  rationale: Еврейская идиома בְּיַד выражает посредство или действующее лицо. По-русски «через своих посланников» естественно передаёт смысл, а מַלְאָכֶיךָ в военно-политическом контексте означает людей-посланников, не ангелов.
- source_word: חֵרַפְתָּ
  choice: ты поносил
  rationale: Глагол выражает оскорбительное поругание и вызывающее презрение. «Поносил» сохраняет силу выражения и соответствует dignified modern Russian.
- source_word: אֲדֹנָי
  choice: Владыку
  rationale: В источнике стоит אֲדֹנָי, а не тетраграмматон. «Владыку» передаёт титул и отличает его от принятой передачи имени יהוה.
- source_word: בְּרֹב רִכְבִּי
  choice: На множестве своих колесниц
  rationale: רֹב указывает на многочисленность колесниц; оборот сохраняет хвастливый акцент на военной мощи.
- source_word: אֲנִי עָלִיתִי
  choice: я поднялся
  rationale: Личное местоимение уже явно выражено русским «я»; порядок слов и контекст передают самоуверенное подчёркивание говорящего без тяжеловесного «я сам».
- source_word: מְרוֹם הָרִים
  choice: на горные вершины
  rationale: מְרוֹם обозначает высоту или возвышенное место. Выражение естественно и сохраняет конкретный горный образ.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: в самые отдалённые места Ливана
  rationale: יַרְכְּתֵי обозначает крайние, удалённые или глубинные части; перевод сохраняет идею проникновения до дальних пределов.
- source_word: קוֹמַת אֲרָזָיו
  choice: его высокие кедры
  rationale: קוֹמָה означает высоту или статность и здесь характеризует возвышающиеся ливанские кедры.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: лучшие его кипарисы
  rationale: מִבְחוֹר означает отборное, лучшее; точная порода дерева בְּרוֹשׁ не установлена, поэтому основной традиционно понятный вариант сопровождается примечанием.
- source_word: מְלוֹן קִצֹּה
  choice: самый дальний его приют
  rationale: מָלוֹן — место ночлега, стоянки или пристанище, а קִצֹּה указывает на крайний предел. «Приют» сохраняет образ укрытого места и звучит естественнее буквального «места ночлега» применительно к Ливану.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: его лес, подобный саду
  rationale: יַעַר означает лес, а כַּרְמִל может обозначать садовую, плодородную или роскошно поросшую местность. Перевод сохраняет образ, не отождествляя слово с собственным именем Кармил.
theological_decisions:
- issue: Различение אֲדֹנָי и יהוה
  choice: Владыку
  alternative: Господа
  rationale: Исходный текст содержит титул אֲדֹנָי, а не божественное имя יהוה. «Владыку» ясно передаёт титул и позволяет сохранить лексическое различие.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной речью. Прямая речь сохраняет хвастливый военно-поэтический характер. Синтаксис умеренно близок к еврейскому оригиналу, но избегает неестественных русских кальк.
