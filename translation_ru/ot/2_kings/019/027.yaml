  text: וְ/שִׁבְתְּ/ךָ֛ וְ/צֵאתְ/ךָ֥ וּ/בֹאֲ/ךָ֖ יָדָ֑עְתִּי וְ/אֵ֖ת הִֽתְרַגֶּזְ/ךָ֥ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/027.yaml
  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: ru
  text: Но Я знаю, когда ты садишься, когда выходишь и когда входишь[a], и как ты неистовствуешь против Меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоё сидение, твой выход и твой вход». Это еврейское выражение охватывает все передвижения и дела человека.'
    reason: cultural_note
  - marker: b
    text: 'Или: «как ты бушуешь»; возможный смысл: «твоё возбуждение» или «твоя ярость против Меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: когда ты садишься
  rationale: Форма от ישׁב с суффиксом 2-го лица мужского рода ед. числа буквально обозначает «твоё сидение». В сочетании с выходом и входом конкретный образ сохранён, но передан естественной русской придаточной конструкцией.
- source_word: וְצֵאתְךָ
  choice: когда выходишь
  rationale: Форма от יצא составляет устойчивую смысловую пару с «входишь» и естественно передаётся обычным современным русским глаголом.
- source_word: וּבֹאֲךָ
  choice: когда входишь
  rationale: Форма от בוא завершает меризм «выходить и входить», охватывающий все передвижения и дела человека.
- source_word: יָדָעְתִּי
  choice: Я знаю
  rationale: Перфект Qal 1-го лица ед. числа здесь выражает твёрдое и полное знание Бога; настоящее время по-русски естественно передаёт эту контекстуальную силу.
- source_word: הִתְרַגֶּזְךָ
  choice: как ты неистовствуешь
  rationale: Форма породы Hitpael от רגז обозначает сильное возбуждение, ярость или неистовство. Глагольная конструкция сохраняет динамичность еврейского выражения и его враждебную направленность, не добавляя идеи дерзости или непокорности, прямо не выраженной словом.
- source_word: אֵלָי
  choice: против Меня
  rationale: Предлог אל обычно значит «к, по направлению к», но при обозначении враждебной ярости в русском языке естественно и точно передаётся как «против».
- source_word: וְאֵת
  choice: и
  rationale: Союз с показателем прямого дополнения вводит ещё один объект глагола «знаю»; непереводимый показатель дополнения опущен, а связь передана союзом «и».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством прямой божественной речи. Повтор «когда» делает еврейский ряд естественным и ясным, а местоимения Бога оформлены с прописной буквы в соответствии с распространённой русской библейской традицией.
