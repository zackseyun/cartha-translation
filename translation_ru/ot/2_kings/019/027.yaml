  source_fidelity: Текст точно передаёт еврейский ряд «сидение/пребывание — выход — вход», глагол ידע в значении всеобъемлющего знания и הִתְרַגֶּזְךָ как враждебную ярость, направленную против Бога. Передача «когда ты садишься, когда выходишь и когда входишь» — естественная русская развёртка именной конструкции и не сужает её смысла.
  naturalness: Современный литературный русский звучит ясно и достойно для прямой божественной речи. Повтор «когда» делает меризм понятным, а «как ты неистовствуешь против Меня» естественно передаёт последнюю именную форму в глагольной русской конструкции.
  terminology: Местоимения Бога с прописной буквы последовательны в рамках распространённой русской библейской редакционной традиции. «Неистовствуешь против Меня» не вносит доктринальных интерпретаций и адекватно передаёт враждебную направленность выражения.
