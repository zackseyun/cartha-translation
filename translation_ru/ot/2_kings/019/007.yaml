source:
  edition: WLC
  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: ru
  text: Вот, Я вложу в него дух[a], и он услышит весть[b] и возвратится в свою землю, а Я сделаю так, что он падёт от меча в своей земле».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутреннее побуждение»; еврейское слово может также означать «ветер» или «дыхание».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «известие» или «слух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот, Я
  rationale: «Вот» естественно передаёт формулу привлечения внимания и подчёркивает последующее Божье объявление.
- source_word: נֹתֵן
  choice: вложу
  rationale: Причастие после הִנְנִי указывает на предстоящее или близкое действие. Будущее время естественно для русского пророческого контекста, а «вложу в него» передаёт направленность действия.
- source_word: רוּחַ
  choice: дух
  rationale: 'Сохраняет смысловую широту еврейского слова: речь может идти о духе, внутреннем побуждении или настрое; перевод не уточняет механизм Божьего воздействия.'
- source_word: וְשָׁמַע
  choice: и он услышит
  rationale: Передаёт последовательность предсказанных событий после Божьего действия.
- source_word: שְׁמוּעָה
  choice: весть
  rationale: Нейтральное современное слово, охватывающее сообщение, известие или слух и не утверждающее его достоверность.
- source_word: וְשָׁב
  choice: и возвратится
  rationale: Точно передаёт значение возвращения в прежнее место и соответствует возвышенному, но современному регистру.
- source_word: לְאַרְצוֹ
  choice: в свою землю
  rationale: Возвратное местоимение естественно передаёт принадлежность, а «земля» сохраняет библейскую географическую лексику.
- source_word: וְהִפַּלְתִּיו
  choice: а Я сделаю так, что он падёт
  rationale: Сохраняет каузативное значение породы hifil глагола נפל и не заменяет образ падения более толковательным выражением «поражу».
- source_word: בַּחֶרֶב
  choice: от меча
  rationale: Естественная русская библейская идиома для насильственной смерти от оружия; передаёт инструментальный смысл.
- source_word: בְּאַרְצוֹ
  choice: в своей земле
  rationale: Повторяет указание на его землю и сохраняет иронию гибели царя у себя на родине.
theological_decisions:
- issue: Значение רוּחַ в пророчестве о Божьем суде
  choice: дух
  alternative: внутреннее побуждение / настрой / ветер
  rationale: «Дух» сохраняет многозначность исходного слова и утверждение о Божьем воздействии на ассирийского царя, не определяя точнее природу и способ этого воздействия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность еврейского пророчества. Прямая речь завершается закрывающей кавычкой по контексту стиха.
