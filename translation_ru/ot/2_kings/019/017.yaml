lexical_decisions:
- source_word: אָמְנָם
  choice: Это правда
  rationale: Начальное слово подтверждает истинность только что высказанного утверждения. «Это правда» естественно звучит по-русски и сохраняет утвердительный, отчасти уступительный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: הֶחֱרִיבוּ
  choice: разорили
  rationale: Порода hифиль от חרב обозначает приведение в состояние запустения; «разорили» точно и естественно передаёт военное опустошение.
- source_word: מַלְכֵי אַשּׁוּר
  choice: цари Ассирии
  rationale: Прямое и естественное соответствие еврейской сопряжённой конструкции.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: В данном геополитическом контексте речь идёт о народах, покорённых Ассирией.
- source_word: אַרְצָם
  choice: их земли
  rationale: Форма существительного стоит в единственном числе, однако при множественном референте допускает собирательно-распределительное понимание; множественное число естественно выражает его по-русски.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Двоеточие естественно связывает подтверждение «Это правда, Яхве» с последующим утверждением; исходная синтаксическая краткость сохранена.
