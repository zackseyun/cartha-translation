base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: ru
  text: А теперь, Яхве, Боже наш, спаси нас, молим Тебя, от его руки[a], чтобы все царства земли[b] узнали, что только Ты, Яхве, — Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из его руки»; это образ избавления из-под его власти.'
    reason: cultural_note
  - marker: b
    text: 'Возможно также: «все царства страны», но международный контекст указывает на более широкое значение — «земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и связующую силу וְ, и временно-дискурсивный переход к кульминационной просьбе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: Бог наш
  rationale: Точно передаёт форму с суффиксом первого лица множественного числа и естественно звучит в русском обращении.
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: спаси нас, молим Тебя
  rationale: Императив передан прямо, а частица вежливой и настойчивой просьбы נָא — естественным для возвышенной современной речи оборотом.
- source_word: מִיָּדוֹ
  choice: от его руки
  rationale: Сохраняет древнееврейский образ руки как власти и контроля; значение поясняется в сноске.
- source_word: וְיֵדְעוּ
  choice: чтобы ... узнали
  rationale: В данном контексте форма выражает цель или ожидаемый результат просьбы.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: все царства земли
  rationale: Международный контекст поддерживает широкое значение «земля, мир», хотя лексема допускает и «страна».
- source_word: כִּי
  choice: что
  rationale: Вводит содержание знания народов.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: Ты один, Яхве, — Бог
  rationale: Сохраняет отдельное личное имя יְהוָה и предикативное אֱלֹהִים, а также исключительный акцент לְבַדֶּךָ, не превращая выражение в составной титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Синтаксис заключительного исповедания
  choice: Ты один, Яхве, — Бог
  alternative: Ты, Яхве, один Бог; только Ты — Яхве Бог
  rationale: Выбранный порядок естественен по-русски, подчёркивает исключительность и отражает еврейское «ты — Яхве, Бог, ты один», не сливая имя и обозначение Бога в титул.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Обращение «молим Тебя» передаёт נָא без архаического «о»; прописная буква в местоимении сохраняет традиционный русский почтительный регистр. Все сноски отмечены в основном тексте.
