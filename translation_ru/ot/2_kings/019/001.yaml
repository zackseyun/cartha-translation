  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: ru
  text: Когда царь Езекия услышал это, он разорвал на себе одежды, облачился во вретище и вошёл в дом Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда… услышал
  rationale: Еврейская повествовательная формула вводит следующее событие; в современном русском временное придаточное естественно передаёт последовательность без буквального «и было».
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: царь Езекия
  rationale: Такой порядок титула и имени естественен для русского библейского повествования.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: разорвал на себе одежды
  rationale: Формулировка ясно передаёт жест скорби и унижения; «на себе» естественно раскрывает подразумеваемое действие со своей одеждой.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: облачился во вретище
  rationale: Возвратная форма передаёт, что Езекия покрыл себя грубой тканью скорби; «вретище» — точный и узнаваемый русский библейский термин.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: вошёл в дом Яхве
  rationale: Глагол בוא с обозначением места здесь указывает на движение внутрь; «дом» сохраняет храмовый образ исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между Божьим именем и титулом «Господь».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; форма «Яхве» непосредственно передаёт личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Термин «вретище» несколько традиционен, но остаётся кратким, точным и узнаваемым обозначением грубой ткани, надеваемой в знак скорби.
