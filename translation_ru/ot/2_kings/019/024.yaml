base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: ru
  text: Я сам копал и пил чужеземные воды, и подошвами моих ног иссушаю все потоки Египта[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все каналы (рукава Нила) Египта». Еврейское слово может особо обозначать водные пути Нила.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְתִּי
  choice: копал
  rationale: Глагол обозначает выкапывание источников воды, вероятнее всего колодцев. Перевод «копал» сохраняет краткость еврейского текста и не добавляет прямо не названный объект.
- source_word: מַיִם זָרִים
  choice: чужеземные воды
  rationale: Прилагательное זָרִים означает «чужие, чужеземные». В контексте царского хвастовства речь идёт о воде в покорённых чужих землях; «чужеземные» передаёт это без устранения образности.
- source_word: וְאַחְרִב
  choice: иссушу
  rationale: Порода hифиль от חרב здесь означает «сделать сухим, иссушить». Форма допускает направленность в будущее, поэтому сохранено различие между совершёнными действиями «копал и пил» и заявлением «иссушу».
- source_word: בְּכַף פְּעָמַי
  choice: ступнями моих ног
  rationale: כַּף применительно к ноге обозначает ступню или подошву. Формулировка сохраняет конкретный образ того, как царь будто бы одним попранием иссушает водные пути.
- source_word: יְאֹרֵי
  choice: потоки
  rationale: יְאֹר может обозначать реку, канал или проток, особенно связанный с Нилом. «Потоки» естественно звучит в основном тексте, а более узкое значение отмечено в сноске.
- source_word: מָצוֹר
  choice: Египта
  rationale: В сочетании с יְאֹרֵי слово מָצוֹר лучше понимать как поэтическое наименование Египта, а не как «осада» или «крепость».
- source_word: אֲנִי
  choice: Я сам
  rationale: Отдельно выраженное местоимение усиливает самоуверенное царское «я»; «Я сам» передаёт этот акцент.
theological_decisions:
- issue: Кто говорит и какова риторическая сила высказывания
  choice: Сохранить речь как высокомерное царское хвастовство без поясняющего добавления о говорящем.
  alternative: Прямо уточнить в тексте, что это говорит ассирийский царь, либо ослабить слова как обычную военную гиперболу.
  rationale: Контекст устанавливает говорящего, а сам стих передаёт его хвастливое заявление. Добавление богословского или исторического пояснения в основной текст нарушило бы форму прямой речи.
- issue: Временная соотнесённость וְאַחְרִב
  choice: 'Передать будущим временем: «иссушу».'
  alternative: Передать настоящим временем «иссушаю» или прошедшим «иссушил».
  rationale: Еврейская форма отличается от предшествующих перфектов «копал» и «пил» и естественно допускает будущую или заявленную как достижимую угрозу. Перевод сохраняет это напряжение, не выравнивая все глаголы по одному времени.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной образностью. Синтаксис сохраняет лаконичность и самоуверенный тон древнееврейской царской похвальбы; сноска поставлена после выражения, к которому относится лексическая альтернатива.
