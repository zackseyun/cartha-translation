  rationale: Перевод исправляет неудачное «совершил», сохраняет различие между давним Божьим действием и его нынешним осуществлением, а также более точно и осторожно отражает трудность заключительного еврейского выражения. Сноска a сохраняется как значимая лексическая альтернатива, хотя в основном тексте предпочтительно временное «издавна».
