base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: ru
  text: Разве ты не слышал? Я издавна сделал это, в древние дни образовал; теперь Я привёл это в исполнение, чтобы ты опустошал укреплённые города, обращая их в груды развалин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Еврейское выражение буквально говорит о «грудах»; значение второго слова не вполне ясно. Возможен также перевод: «стоящие груды».'
    reason: textual_difficulty
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: Разве ты не слышал?
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественным современным русским оборотом.
- source_word: לְמֵרָחוֹק
  choice: издавна
  rationale: Хотя выражение допускает пространственное понимание «издалека», параллель с «древними днями» указывает здесь прежде всего на отдалённое время.
- source_word: אֹתָהּ עָשִׂיתִי
  choice: Я совершил это
  rationale: Женский суффикс указывает на подразумеваемое дело или событие. «Совершил» сохраняет широкое значение עשה и не требует вводить в основной текст отсутствующее существительное.
- source_word: לְמִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: замыслил в древние дни
  rationale: יצר буквально связано с формированием, но применительно к будущему событию естественно выражает его замысел; перевод сохраняет параллель древнего установления и нынешнего исполнения.
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: Теперь Я привёл это в исполнение
  rationale: Идиоматически передаёт осуществление ранее замысленного, а не простое перемещение.
- source_word: לַהְשׁוֹת
  choice: чтобы ты превращал
  rationale: Передаёт каузативный смысл опустошения и естественно связывается с итоговым состоянием городов.
- source_word: גַּלִּים נִצִּים עָרִים בְּצֻרוֹת
  choice: укреплённые города в груды развалин
  rationale: Ясно передаёт образ городов, обращённых разрушением в груды; трудное נִצִּים не получает искусственно точного толкования.
theological_decisions:
- issue: Божье владычество над завоеваниями Ассирии
  choice: Текст показывает, что военные успехи ассирийского царя осуществляют давний Божий замысел.
  alternative: Ослабить высказывание до одного лишь Божьего предвидения либо усилить его философским утверждением исчерпывающего детерминизма.
  rationale: Глаголы «совершил/замыслил» и «привёл в исполнение» прямо утверждают Божье предварительное намерение и нынешнее осуществление, но стих не даёт оснований добавлять философские выводы или моральное одобрение жестокости Ассирии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет риторический вопрос, временной контраст «издавна — теперь» и обращение Бога к ассирийскому царю; заглавная «Я» употреблена по русской библейской издательской традиции.
