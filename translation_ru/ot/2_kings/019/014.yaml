base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: ru
  text: Езекия взял письма из рук посланников и прочитал их[a]. Затем он поднялся в Дом Яхве и разложил перед Яхве это послание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать также «документы», «свитки» или вообще письменные материалы.
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте буквально: «разложил его» — с местоимением единственного числа, хотя ранее сказано «письма». Вероятно, письменные материалы рассматриваются как одно послание; точный референт местоимения не назван.'
    reason: textual_grammar_and_ambiguity
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: письма
  rationale: Слово обозначает письменные материалы — книги, свитки или документы; в данном повествовательном контексте речь идёт о доставленном посланниками письменном сообщении, поэтому «письма» звучит естественно и точно.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: из рук посланников
  rationale: Сохранён конкретный образ еврейского оборота «из руки посланников»; русское множественное «из рук» естественно при нескольких посланниках.
- source_word: הַמַּלְאָכִים
  choice: посланников
  rationale: В историческом контексте это люди, доставившие сообщение, а не небесные существа.
- source_word: וַיִּקְרָאֵם
  choice: и прочитал их
  rationale: Местоименный суффикс имеет форму множественного числа и соотносится с הַסְּפָרִים.
- source_word: וַיַּעַל
  choice: Затем он поднялся
  rationale: Глагол עלה передаёт восхождение; «поднялся» сохраняет пространственный оттенок и естественно описывает путь в храм.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Буквально «дом Яхве»; этот вариант сохраняет образ источника, тогда как «храм» был бы контекстуальным уточнением.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: разложил их
  rationale: Глагол обозначает разворачивание или раскладывание письменного материала. Хотя суффикс в масоретском тексте формально единственного числа, контекст допускает восприятие писем как совокупного письменного сообщения; по-русски множественное число согласуется с ближайшим референтом «письма».
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Прямой и естественный русский эквивалент идиомы, указывающей на действие в присутствии Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды употребляет личное имя YHWH. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вносит конфессиональной замены.
- issue: Число объекта при וַיִּפְרְשֵׂהוּ
  choice: разложил их
  alternative: разложил его
  rationale: Единственное число еврейского суффикса создаёт формальное напряжение с предшествующим множественным הַסְּפָרִים. В связном русском тексте «их» ясно отсылает к письмам, тогда как «его» потребовало бы добавить не выраженное существительное «письмо/послание». Неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным без нагромождения союзов; сохранены конкретные образы «из рук», «поднялся» и «дом Яхве». Единственная сноска отмечена в основном тексте и поясняет как широту значения הַסְּפָרִים, так и смену грамматического числа в последнем глаголе.
