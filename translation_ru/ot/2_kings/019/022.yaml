base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: ru
  text: Кого ты поносил и хулил[a]? Против кого ты возвысил голос и поднял глаза ввысь[b]? Против Святого Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оскорблял и злословил». Оба еврейских глагола близки по значению и обозначают презрительную, оскорбительную речь; второй может особо указывать на хулу против Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднял глаза ввысь» — образ надменности и высокомерного самоутверждения.'
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: поносил
  rationale: Глагол обозначает оскорбительную, презрительную речь; «поносил» сохраняет силу обвинения и естественно сочетается с последующим «хулил».
- source_word: גִדַּפְתָּ
  choice: хулил
  rationale: В контексте речи, направленной против Бога, глагол имеет смысл богохульного оскорбления; «хулил» передаёт это без добавления чуждых тексту уточнений.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: возвышал голос
  rationale: Это близкая и естественная передача еврейской идиомы «поднимать голос», здесь выражающей дерзкий вызов.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: надменно поднимал глаза
  rationale: Буквальный образ связан с поднятием глаз «ввысь» и выражает высокомерие; наречие делает значение идиомы ясным современному читателю.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: Святого Израилева
  rationale: Устоявшаяся, лаконичная русская форма божественного титула «Святой Израилев», сохраняющая его связь с Израилем.
- source_word: עַל
  choice: против
  rationale: В обоих случаях предлог указывает на враждебную направленность действий.
- source_word: מִי
  choice: кого
  rationale: Нормальная современная русская форма вопросительного местоимения при переходных глаголах и предлоге.
theological_decisions:
- issue: Передача тяжести речи, направленной против Бога
  choice: Перевести גִדַּפְתָּ как «хулил» и сохранить кульминацию «Против Святого Израилева».
  alternative: 'Передать менее специфично: «оскорблял» или «злословил».'
  rationale: Контекст выявляет не только политическую дерзость, но и кощунственное оскорбление Бога Израиля; «хулил» сохраняет эту богословскую серьёзность, не расширяя смысл текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Параллелизм вопросов сохранён; архаизирующая форма оставлена только в традиционном и узнаваемом божественном титуле «Святой Израилев».
