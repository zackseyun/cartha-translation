  variant: modern literary Russian
source:
  edition: WLC
  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: ru
  text: 'Так скажите Езекии, царю Иудеи: «Пусть Бог твой[a], на Которого ты уповаешь, не обманывает тебя, говоря: „Иерусалим не будет отдан в руку царя Ассирии“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бог твой». В древнееврейском тексте прописные и строчные буквы не различаются; ассирийский царь насмехается над упованием Езекии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: Так
  rationale: Естественно передаёт формулу введения послания и сохраняет её краткость.
- source_word: תֹאמְרוּן
  choice: скажите
  rationale: Форма второго лица множественного числа имеет предписывающую силу; русский повелительный императив передаёт её естественно.
- source_word: חִזְקִיָּהוּ
  choice: Езекии
  rationale: Традиционная и общепонятная русская форма имени в требуемом дательном падеже.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царю Иудеи
  rationale: Сохраняет приложенный царский титул и естественный русский порядок слов.
- source_word: אַל יַשִּׁאֲךָ
  choice: Пусть ... не обманывает тебя
  rationale: Прямо передаёт отрицательное волеизъявление с глаголом в значении «обманывать, вводить в заблуждение» и звучит естественно при подлежащем «Бог».
- source_word: אֱלֹהֶיךָ
  choice: Бог твой
  rationale: Сохраняет единственное число и притяжательное отношение; постпозиция местоимения поддерживает достоинство и риторическую окраску послания.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: на Которого ты уповаешь
  rationale: בָּטַח с предлогом ב выражает доверие и опору; «уповать на» точно и естественно в возвышенном современном русском регистре.
- source_word: לֵאמֹר
  choice: говоря
  rationale: 'Сохраняет формально неоднозначную связь причастного оборота: он вводит содержание предполагаемого обмана, не добавляя причинного или инструментального уточнения.'
- source_word: לֹא תִנָּתֵן
  choice: не будет отдан
  rationale: Передаёт страдательное значение нифаля от נתן без более интерпретативного «не будет предан».
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Стандартная русская форма географического названия.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: в руку царя Ассирии
  rationale: Сохраняет древнееврейскую метафору власти и подчинения, понятную в библейском русском языке.
theological_decisions:
- issue: Написание אֱלֹהֶיךָ в речи ассирийского царя
  choice: Бог твой
  alternative: бог твой
  rationale: Речь идёт о Боге Езекии и Иудеи, поэтому в основном тексте употреблена прописная буква. Древнееврейское письмо такого различия не отмечает, а враждебный говорящий может вкладывать пренебрежительный смысл; это отражено в сноске.
- issue: К чему синтаксически относится «говоря»
  choice: Сохранено без явного уточнения
  alternative: «обманывает тебя тем, что говорит»
  rationale: Второе לֵאמֹר вводит содержание предполагаемого обмана, но не требует добавления инструментального «тем, что». Перевод сохраняет компактность и некоторую синтаксическую открытость оригинала.
translation_notes:
  register: Современный литературный русский с достоинством царского послания. Формулы «уповаешь» и «в руку» сохраняют узнаваемую библейскую образность, оставаясь понятными современному читателю.
