  text: Тогда Сеннахирим, царь Ассирии, отправился, ушёл и возвратился; он жил в Ниневии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: снялся с места, ушёл и возвратился
  rationale: Сохранена трёхчленная последовательность еврейских глаголов. «Снялся с места» передаёт значение נסע — отправиться в путь, покинув стоянку; «ушёл» и «возвратился» отражают הלך и שוב.
- source_word: וַיֵּשֶׁב
  choice: где и остался
  rationale: ישב здесь может означать «поселиться», «жить» или «оставаться». В контексте возвращения в столицу естественное русское выражение «где и остался» сохраняет смысл пребывания, не утверждая, что он впервые там поселился.
- source_word: בְּנִינְוֵה
  choice: в Ниневию, где
  rationale: Направление «в Ниневию» выводится из глагола «возвратился», а последующее «где» передаёт локативный предлог ב при וַיֵּשֶׁב.
