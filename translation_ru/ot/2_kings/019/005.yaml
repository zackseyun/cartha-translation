  text: И пришли слуги царя Езекии к Исаии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И пришли
  rationale: Форма wayyiqtol от בוא продолжает последовательное повествование. Русское «и пришли» естественно передаёт переход к следующему событию, не добавляя явной причинной связи.
- source_word: עַבְדֵי
  choice: слуги
  rationale: Слово עבד во множественном числе может обозначать слуг, приближённых или царских служащих. «Слуги» сохраняет широту исходного выражения; «сановники» было бы более узким толкованием.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: царя Езекии
  rationale: Сочетание титула с личным именем естественно передаётся по-русски родительным оборотом после слова «слуги».
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает направленное движение к человеку; в данном контексте нормативный русский эквивалент — «к».
- source_word: יְשַׁעְיָהוּ
  choice: Исаии
  rationale: Использована традиционная русская форма имени пророка Исаия в дательном падеже после предлога «к».
