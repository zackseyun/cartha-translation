  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: ru
  text: 'Поэтому так говорит Яхве об ассирийском царе: «Не войдёт он в этот город, не пустит туда ни одной стрелы, не подступит к нему со щитом[a] и не возведёт против него осадной насыпи[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не выступит против него со щитом». Еврейское выражение может обозначать приближение к городу под прикрытием щита во время осады.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «осадной рампы». Речь идёт о земляном сооружении, которое возводили при осаде города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт выводный смысл частицы и естественно связывает изречение с предшествующим контекстом.
- source_word: כֹּה אָמַר
  choice: так говорит
  rationale: Сохраняет устойчивую пророческую формулу в естественной для современного русского языка форме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: об ассирийском царе
  rationale: В данном пророческом контексте אֶל вводит того, о ком говорится; русское «об» соответствует содержанию изречения.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: Не войдёт он в этот город
  rationale: Выражает предсказательное отрицание и направленное движение в город; инверсия придаёт фразе достоинство без архаизации.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: не пустит туда стрелы
  rationale: Естественное русское обозначение выстрела стрелой, сохраняющее единственное число оригинала и пространственное שָׁם.
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: не подступит к нему со щитом
  rationale: Передаёт приближение к городу в осадном контексте, не превращая щит в явно наступательное оружие; неоднозначность образа отмечена в сноске.
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: не возведёт против него осадной насыпи
  rationale: Контекстуально передаёт сооружение земляной осадной конструкции; буквальное «выльет» по-русски было бы непонятно.
- source_word: סֹלְלָה
  choice: осадная насыпь
  rationale: Понятный современному читателю общий термин для земляного осадного сооружения, не исключающий значения рампы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер обещания о действиях ассирийского царя
  choice: Категорическое будущее отрицание
  alternative: Модальное «не сможет» или повелительное «пусть не входит»
  rationale: Формы לֹא с имперфектом в контексте божественного изречения предсказывают, чего царь не совершит; текст прямо не говорит о неспособности и не формулирует приказ.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаической интонацией. Параллельные отрицания сохранены; местоимение «нему» относится к городу. Все сноски имеют маркеры в основном тексте.
