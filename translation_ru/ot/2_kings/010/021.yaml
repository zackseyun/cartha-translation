base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: ru
  text: Ииуй разослал весть по всему Израилю, и пришли все поклонники Ваала; не осталось ни одного человека, который не пришёл. Они вошли в дом Ваала, и дом Ваала наполнился от края до края.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рот к рту»; это еврейская идиома, означающая, что помещение было заполнено полностью.'
    reason: Передаёт буквальный образ выражения פֶּה לָפֶה и поясняет его идиоматический смысл.
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: И послал Ииуй по всему Израилю
  rationale: Глагол שׁלח означает «посылать», а сочетание с בְּכָל יִשְׂרָאֵל передаёт распространение призыва по всей стране. Русское «послал по всему Израилю» сохраняет намеренную неполноту объекта посылания и естественно подразумевает рассылку вестников или известия.
- source_word: כָּל עֹבְדֵי הַבַּעַל
  choice: все поклонники Ваала
  rationale: В культовом контексте причастие от עבד обозначает тех, кто служит божеству, то есть его почитателей; «поклонники» ясно передаёт религиозный смысл.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: не осталось ни одного человека, который не пришёл
  rationale: Формулировка сохраняет усиленное утверждение о всеобщей явке и передаёт אִישׁ как «человек», не сужая смысл до взрослых мужчин там, где слово употреблено обобщённо.
- source_word: וַיָּבֹאוּ בֵּית הַבַּעַל
  choice: Они вошли в дом Ваала
  rationale: Глагол בוא при названии здания естественно переводится «войти». «Дом Ваала» формально сохраняет בֵּית הַבַּעַל и остаётся понятным обозначением святилища.
- source_word: וַיִּמָּלֵא בֵית הַבַּעַל
  choice: дом Ваала наполнился
  rationale: Нифаль глагола מלא здесь естественно передаётся русской возвратной формой «наполнился».
- source_word: פֶּה לָפֶה
  choice: от края до края
  rationale: Буквально выражение означает «от устья до устья» или «от края до края» и описывает полностью заполненное пространство. Идиоматический перевод понятен современному читателю, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Обобщающее значение אִישׁ
  choice: ни одного человека
  alternative: ни одного мужчины
  rationale: В отрицательной конструкции אִישׁ имеет обобщающее значение «никто, ни один человек». Выбор не вносит предположения о составе поклонников Ваала и точно передаёт функцию слова в данном контексте.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксический повтор «и» сохраняет последовательность еврейского рассказа, но текст остаётся естественным и ясным.
