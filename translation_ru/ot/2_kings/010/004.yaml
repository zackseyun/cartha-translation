  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: ru
  text: 'Но они очень, очень испугались и сказали: «Вот, два царя не устояли перед ним — как же устоим мы?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: они испугались
  rationale: Глагол ירא в повествовательной форме обозначает наступившую реакцию страха; совершенный вид естественно передаёт её в современном русском повествовании.
- source_word: מְאֹד מְאֹד
  choice: очень, очень
  rationale: Повтор наречия сохранён, чтобы передать усиление и риторическую выразительность еврейского текста.
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» естественно для современного русского языка и сохраняет функцию привлечения внимания без архаического оттенка.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: два царя
  rationale: Речь идёт о двух ранее упомянутых царях; в русском языке определённость достаточно ясна из контекста и не требует добавления.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: не устояли перед ним
  rationale: Оборот עמד לפני здесь означает неспособность выдержать противостояние. «Не устояли перед ним» сохраняет образ стояния и естественно выражает смысл в контексте.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: как же устоим мы?
  rationale: «Как же» передаёт вывод из предыдущего утверждения, а повтор «устоять» сохраняет риторический параллелизм одного и того же еврейского глагола עמד.
