base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: ru
  text: «Итак, созовите ко мне всех пророков Ваала, всех его почитателей и всех его священников. Пусть никто не отсутствует[a], потому что у меня будет великое жертвоприношение Ваалу. Всякий, кто не явится, не останется в живых». Но Ииуй поступил так хитростью[b], чтобы погубить почитателей Ваала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть не отсутствует ни один человек»; в еврейском тексте употреблена форма мужского рода единственного числа, обозначающая каждого участника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обманом», «коварно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Сочетание וְעַתָּה вводит следующий призыв в речи. «Итак» естественно передаёт переход и побуждение, не сводя выражение только к указанию времени.
- source_word: נְבִיאֵי הַבַּעַל
  choice: пророков Ваала
  rationale: Конструкция принадлежности передана обычным русским родительным падежом; имя Ваала сохраняет культовую отнесённость.
- source_word: עֹבְדָיו
  choice: его почитателей
  rationale: В культовом контексте עבד обозначает служение божеству. «Почитатели» ясно выражает религиозную преданность и естественно звучит по-русски.
- source_word: כֹּהֲנָיו
  choice: его священников
  rationale: Стандартное обозначение культовых служителей; местоимение относится к Ваалу.
- source_word: קִרְאוּ אֵלַי
  choice: созовите ко мне
  rationale: Форма повелительного наклонения требует призвать людей собраться у говорящего; «созовите» передаёт этот административный оттенок.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: пусть никто не отсутствует
  rationale: Nifal глагола פקד здесь означает отсутствие при сборе или перекличке. Естественная русская формулировка передаёт требование полной явки; буквальная форма отмечена в сноске.
- source_word: זֶבַח גָּדוֹל
  choice: великое жертвоприношение
  rationale: זבח обозначает жертву или жертвенное действие. «Жертвоприношение» здесь естественно передаёт намеченное большое культовое событие.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: всякий, кто не явится, не останется в живых
  rationale: Повторный פקד передан как неявка на созываемое собрание, а לֹא יִחְיֶה — прямой угрозой лишения жизни без смягчения.
- source_word: בְעָקְבָּה
  choice: с обманным замыслом
  rationale: Слово допускает оттенки обмана, коварства и хитрости. Выбранная формулировка ясно показывает, что объявленная цель Ииуя не была настоящей, не оправдывая его действия.
- source_word: לְמַעַן הַאֲבִיד
  choice: чтобы погубить
  rationale: Целевая конструкция с Hifil от אבד прямо выражает намерение уничтожить людей; «погубить» сохраняет силу выражения и литературный регистр.
theological_decisions:
- issue: Оценка обмана Ииуя повествователем
  choice: Но Ииуй поступил так с обманным замыслом
  alternative: Но Ииуй поступил так хитростью
  rationale: Перевод сохраняет явное указание повествователя на ложную уловку Ииуя и не превращает его действие ни в нейтральную стратегию, ни в однозначно одобряемый поступок.
- issue: Обобщающее мужское אִישׁ
  choice: пусть никто не отсутствует
  alternative: пусть ни один мужчина не отсутствует
  rationale: В данном запрете единственное число אִישׁ обозначает каждого участника по отдельности. Основной текст использует естественное русское обобщение, а грамматическая форма оригинала сохраняется в сноске.
- issue: Характер «великой жертвы»
  choice: у меня будет великое жертвоприношение Ваалу
  alternative: я принесу великую жертву Ваалу
  rationale: Фраза сохраняет двусмысленное для участников речи заявление Ииуя как о масштабном культовом действии, тогда как последующий комментарий раскрывает его подлинный замысел.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Прямая речь звучит властно и ясно; синтаксис упрощён без утраты повторов и угрозы оригинала. Имя יהוא передано в принятой русской библейской форме «Ииуй».
