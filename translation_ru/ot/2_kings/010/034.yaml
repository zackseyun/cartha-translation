source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Остальные деяния Ииуя, всё, что он совершил, и все его подвиги[a] — разве не записаны в Книге летописей царей Израиля[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё его могущество».'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду царская летопись, которая не обязательно тождественна каноническим книгам Паралипоменон.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: Остальные деяния Ииуя
  rationale: В устойчивой формуле, завершающей рассказ о царствовании, יֶתֶר означает «остальное», а דִּבְרֵי — не только слова, но дела и события, связанные с царём. «Деяния» естественно передаёт историографический смысл.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: всё, что он совершил
  rationale: Сохраняет всеохватность כָל и относительную конструкцию; «совершил» соответствует приподнятому, но современному повествовательному регистру.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: и все его подвиги
  rationale: גְּבוּרָה может обозначать могущество, доблесть или проявления силы. В контексте царских анналов множественное «подвиги» естественно выражает засвидетельствованные проявления мощи, не исключая более абстрактного понимания.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записаны
  rationale: Сохранён риторический вопрос, предполагающий утвердительный ответ. «Записаны» естественно для ссылки на архивный источник.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: в Книге летописей царей Израиля
  rationale: Предлог עַל в данной формуле идиоматически передан как «в». Название отражает царский летописный источник; לְ выражает его отношение к царям Израиля.
