  yaml_path: translation/ot/2_kings/010/020.yaml
  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: ru
  text: 'Тогда Иегу сказал: «Посвятите Ваалу торжественное собрание»[a]. И они провозгласили это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Объявите священное собрание в честь Ваала».'
    reason: 'Лексико-синтаксическая альтернатива: сочетание קַדְּשׁוּ עֲצָרָה может пониматься буквально как повеление посвятить собрание или идиоматически как повеление объявить священное собрание.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт очередность событий в современном русском языке.
- source_word: יֵהוּא
  choice: Ииуй
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: קַדְּשׁוּ
  choice: освятите
  rationale: Повелительная форма от קדשׁ означает ритуально освятить, отделить для священного употребления. «Освятите» сохраняет культовый оттенок исходного текста; возможное контекстуальное значение «объявите священным / назначьте» отражено в сноске.
- source_word: עֲצָרָה
  choice: торжественное собрание
  rationale: Слово обозначает официальное религиозное собрание, нередко праздничного или особо торжественного характера.
- source_word: לַבַּעַל
  choice: в честь Ваала
  rationale: Предлог ל здесь выражает предназначение собрания для почитания Ваала; «в честь Ваала» звучит естественно и ясно передаёт культовую направленность.
- source_word: וַיִּקְרָאוּ
  choice: И об этом объявили
  rationale: קרא в данном контексте означает публично провозгласить или объявить. Безлично-неопределённая русская конструкция естественно передаёт еврейскую форму 3-го лица множественного числа с подразумеваемым объектом.
