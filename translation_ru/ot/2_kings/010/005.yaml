  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: ru
  text: 'И тот, кто начальствовал над дворцом, и тот, кто начальствовал над городом, вместе со старейшинами и попечителями[a] царских сыновей послали к Ииую сказать: «Мы твои слуги и сделаем всё, что ты нам скажешь. Мы никого не поставим царём. Делай то, что угодно тебе».'
  philosophy: optimal-equivalence
