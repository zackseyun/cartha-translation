- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: сделаем всё, что ты нам скажешь
  rationale: Естественно по-русски передаёт безусловное обещание исполнить распоряжения Ииуя.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: мы никого не поставим царём
  rationale: 'Глагол в породе хифиль выражает причинное значение: сделать или поставить кого-либо царём.'
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: то, что угодно тебе
  rationale: Естественный современный русский эквивалент еврейской идиомы «доброе в твоих глазах»; речь идёт о решении Ииуя, а не о независимой нравственной оценке.
- source_word: עֲשֵׂה
