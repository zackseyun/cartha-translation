- source_word: הָאֹמְנִים
  choice: воспитатели царских сыновей
  rationale: Причастие обозначает людей, которым были вверены царские сыновья; добавление «царских сыновей» ясно передаёт подразумеваемый объект заботы из ближайшего контекста.
- source_word: עֲבָדֶיךָ
  choice: твои слуги
