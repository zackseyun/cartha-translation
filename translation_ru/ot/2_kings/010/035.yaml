  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: ru
  text: Ииуй умер и отошёл к своим предкам, и похоронили его в Самарии. Иоахаз, его сын, стал царём вместо него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: почил с предками своими
  rationale: Устойчивая формула царских хроник сообщает о смерти и приобщении к умершим предкам. Русское «почил» естественно передаёт погребальный эвфемизм, а «с предками своими» сохраняет родовой смысл, не создавая неестественного буквального образа «лёг».
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: и похоронили его
  rationale: Сохранена активная форма третьего лица множественного числа с неуказанным деятелем, без добавления отсутствующих в источнике участников.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог בְּ имеет здесь местное значение; «в Самарии» — естественная русская форма для обозначения места погребения.
- source_word: וַיִּמְלֹךְ
  choice: стал царём
  rationale: В формуле престолонаследия глагол обозначает вступление на царство, а не всё последующее правление.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт замещение прежнего царя преемником и соответствует значению выражения в сообщении о престолонаследии.
- source_word: יֵהוּא
  choice: Ииуй
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, узнаваемая современным читателем.
- source_word: יְהוֹאָחָז
  choice: Иоахаз
  rationale: Использована закрепившаяся русская библейская форма имени.
