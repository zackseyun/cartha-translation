  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: ru
  text: 'Итак, знайте: ни одно слово из того, что Яхве сказал против дома Ахава, не упадёт на землю[a]. Яхве исполнил то, что изрёк через[b] Своего слугу Илию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не упадёт на землю» — древнееврейское выражение со значением «не останется неисполненным».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Своего слуги Илии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: Итак, знайте
  rationale: Форма множественного числа повелительного наклонения призывает слушателей признать установленный факт; частица אֵפוֹא придаёт выводу следственный оттенок.
- source_word: לֹא יִפֹּל ... אַרְצָה
  choice: не упадёт на землю
  rationale: Сохранён яркий древнееврейский образ, означающий, что сказанное не останется неисполненным.
- source_word: מִדְּבַר יְהוָה
  choice: ни одно слово Яхве
  rationale: 'Частичное מִן передаёт смысл «ничто из слова Яхве»; по-русски естественно и точно: «ни одно слово Яхве».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: עַל בֵּית אַחְאָב
  choice: против дома Ахава
  rationale: В контексте пророчества о суде עַל имеет направленно-враждебный смысл; «дом» сохраняет библейское обозначение рода и династии.
- source_word: וַיהוָה עָשָׂה
  choice: Яхве исполнил
  rationale: Глагол עשה буквально значит «сделал», но применительно к ранее сказанному естественное русское «исполнил» ясно передаёт осуществление пророчества.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: то, что изрёк
  rationale: «Изрёк» сохраняет связь с торжественной пророческой речью, не изменяя содержания.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: через Своего слугу Илию
  rationale: Идиома «рукой» обозначает посредничество или орудие действия; в современном русском её смысл естественно передаётся предлогом «через».
- source_word: עַבְדּוֹ
  choice: Своего слугу
  rationale: В контексте пророческого поручения עבד обозначает служителя Бога, а не подчёркивает рабский статус.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Образ полноты исполнения пророчества
  choice: не упадёт на землю
  alternative: не останется неисполненным
  rationale: Сохранение исходной метафоры передаёт текстуру еврейского текста; значение пояснено в сноске.
- issue: Посредничество Илии в пророческой речи
  choice: через Своего слугу Илию
  alternative: рукой Своего слуги Илии
  rationale: Оба варианта передают агентное בְּיַד; основной текст выбирает ясную современную формулировку, не утверждая ничего сверх посреднической роли пророка.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены личное имя Яхве, образ «упасть на землю» и выражение «дом Ахава»; менее естественная для современного русского идиома בְּיַד раскрыта в основном тексте и отмечена буквально в сноске.
