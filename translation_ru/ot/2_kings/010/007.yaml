  - severity: medium
    issue: Сноска к «корзинам» неточно формулирует альтернативы.
    rationale: דּוּד обычно относится к котлу, горшку или иной ёмкости. Формула «в котлы» грамматически возможна, но «котлы или горшки» яснее и ближе к лексическому диапазону; «сосуды» слишком расплывчато как заявленная альтернатива.
