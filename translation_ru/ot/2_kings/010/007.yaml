lexical_decisions:
- source_word: הַסֵּפֶר
  choice: письмо
  rationale: В данном повествовательном контексте речь идёт о письменном послании Ииуя; «письмо» — наиболее естественное и точное русское соответствие.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: сыновей царя
  rationale: Выражение непосредственно обозначает мужских потомков царя и сохраняет семейно-династический смысл.
- source_word: וַיִּשְׁחֲטוּ
  choice: зарезали
  rationale: Глагол שׁחט обозначает заклание или перерезание горла; «зарезали» передаёт конкретность и жестокость действия лучше нейтрального «убили».
- source_word: שִׁבְעִים אִישׁ
  choice: всех семидесятерых
  rationale: Форма естественно связывает число с уже названными сыновьями царя и ясно показывает, что были убиты все семьдесят.
- source_word: רָאשֵׁיהֶם
  choice: их головы
  rationale: Буквальный смысл ясен из контекста и не требует эвфемизма.
- source_word: בַּדּוּדִים
  choice: в корзины
  rationale: В контексте перевозки голов «корзины» — традиционное и правдоподобное обозначение переносных вместилищ, однако еврейское слово допускает и сосуды иного типа, что отражено в сноске.
- source_word: אֵלָיו
  choice: к нему
  rationale: Сохранено местоимение оригинала; из ближайшего контекста ясно, что оно относится к Ииую.
- source_word: יִזְרְעֶאלָה
  choice: в Изреель
  rationale: Направительный суффикс указывает на движение к Изреелю; русское «в Изреель» естественно передаёт пункт назначения.
