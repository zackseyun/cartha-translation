  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: ru
  text: Когда письмо пришло к ним, они взяли сыновей царя, зарезали семьдесят человек, положили их головы в корзины[a] и отправили к нему в Изреель.
