  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: ru
  text: 'У Ахава было семьдесят сыновей в Самарии. Ииуй написал письма и послал их в Самарию — начальникам Изрееля[a], старейшинам и опекунам сыновей Ахава[b] — со словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «начальникам Изрееля». Поскольку письма были посланы в Самарию, некоторые понимают это как указание на связанных с Изреелем начальников, находившихся там; ряд древних переводов и толкователей отдает предпочтение чтению «начальникам Самарии». В основном тексте сохранено масоретское чтение.'
    reason: textual_variant
  - marker: b
    text: 'Или: «воспитателям» либо «попечителям». Еврейское слово обозначает тех, кому было поручено растить сыновей Ахава или надзирать за ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: У Ахава было
  rationale: 'Конструкция с לְ выражает принадлежность: «у Ахава было». Начальный ו здесь вводит обстоятельство или новую тему; отдельное «и» в русском не требуется.'
- source_word: שִׁבְעִים בָּנִים
  choice: семьдесят сыновей
  rationale: בָּנִים буквально означает «сыновья»; в контексте царского дома и престолонаследия мужской пол существенен.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог בְּ обозначает место нахождения; речь идет о городе Самарии.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: написал письма
  rationale: סְפָרִים в данном повествовательном контексте означает письменные послания.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: послал их в Самарию
  rationale: Местоимение «их» естественно восполняет подразумеваемое дополнение «письма» из предыдущей части фразы.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: начальникам Изрееля
  rationale: שָׂרֵי обозначает руководителей или должностных лиц. «Начальники» передает их властное положение, не уточняя титул; масоретское чтение «Изрееля» сохранено, несмотря на текстовую трудность.
- source_word: הַזְּקֵנִים
  choice: старейшинам
  rationale: В общественно-политическом контексте זְקֵנִים — признанные руководители общины, а не просто пожилые люди.
- source_word: הָאֹמְנִים אַחְאָב
  choice: опекунам сыновей Ахава
  rationale: Причастие от אמן обозначает людей, которым поручено воспитание или попечение. Уточнение «сыновей» естественно выражает подразумеваемую контекстом связь с Ахавом.
- source_word: לֵאמֹר
  choice: 'со словами:'
  rationale: Оборот вводит содержание писем, продолжающееся в следующем стихе; двоеточие естественно оформляет этот переход по-русски.
