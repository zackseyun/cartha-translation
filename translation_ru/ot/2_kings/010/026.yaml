translation:
  language: ru
  text: Тогда они вынесли священные столбы из дома Ваала и сожгли их[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском: «сожгли её», хотя слово «столбы» стоит во множественном числе; вероятно, дополнение имеет собирательный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из храма Ваала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: Тогда они вынесли
  rationale: Порода хифиль глагола יצא означает «вывести, вынести». «Тогда» естественно передаёт последовательное развитие повествования, выраженное вау-последовательным.
- source_word: מַצְּבוֹת
  choice: священные столбы
  rationale: מַצֵּבָה обозначает поставленный вертикально камень или культовый столб. В контексте поклонения Ваалу определение «священные» ясно передаёт культовую функцию, не сводя предметы к неопределённым «изображениям».
- source_word: בֵּית הַבַּעַל
  choice: из дома Ваала
  rationale: Буквально בַּיִת — «дом»; в данном культовом контексте это храм. Основной текст сохраняет близкое к еврейскому выражение, а контекстуальный вариант указан в сноске.
- source_word: וַיִּשְׂרְפוּהָ
  choice: и сожгли их
  rationale: В еврейском у глагола стоит суффикс дополнения 3-го лица женского рода единственного числа, хотя предшествующее מַצְּבוֹת имеет множественное число. Русское «их» согласуется с явным антецедентом и передаёт коллективный смысл; формальная особенность оригинала отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. «Священные столбы» понятно обозначает культовые стоячие камни; «дом Ваала» сохраняет образ оригинала, а более явное «храм» вынесено в сноску.
