base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: ru
  text: 'Он сказал: «Возьмите их живыми». Их взяли живыми и зарезали у ямы Бет-Экеда[a][b] — сорок два человека. Он не оставил в живых ни одного из них.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы «к яме» или «в яму»: еврейский предлог здесь допускает несколько пространственных толкований.'
    reason: lexical_alternative
  - marker: b
    text: Бет-Экед — название места. Возможно, первоначально оно означало «дом связывания» или «дом сбора».
    reason: cultural_note
  - marker: c
    text: 'Буквально: «не оставил из них ни одного человека»; подчёркивается, что никто не уцелел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: возьмите их
  rationale: Глагол תפשׂ означает «схватить, захватить». В данном приказе «возьмите их» естественно передаёт задержание людей, которых велено сохранить живыми до последующей расправы.
- source_word: חַיִּים
  choice: живыми
  rationale: 'Здесь слово употреблено обстоятельственно: людей следовало взять живыми, а не убить на месте.'
- source_word: וַיִּשְׁחָטוּם
  choice: зарезали
  rationale: שׁחט обозначает заклание или перерезание горла и сильнее общего «убили». «Зарезали» сохраняет конкретность и жестокость действия без добавления отсутствующих деталей.
- source_word: אֶל־בּוֹר
  choice: у ямы
  rationale: Предлог אֶל обычно указывает направление, но в данной конструкции может обозначать место действия. «У ямы» естественно по-русски, при этом другие пространственные толкования отмечены в сноске.
- source_word: בֵּית עֵקֶד
  choice: Бет-Экед
  rationale: Сочетание функционирует как географическое название, поэтому передано транслитерацией, а возможное значение названия вынесено в примечание.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: сорок два человека
  rationale: אִישׁ в счётной конструкции обозначает людей мужского пола; современное русское «сорок два человека» звучит естественно и не меняет состава названной группы.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: Он не оставил в живых ни одного из них
  rationale: Единственное число глагола указывает на Ииуя как ответственного субъекта, тогда как русская идиома «не оставил в живых ни одного» ясно передаёт полное отсутствие выживших.
theological_decisions:
- issue: Ответственность за уничтожение группы
  choice: 'В заключительной фразе сохранён субъект в единственном числе: «Он не оставил…»'
  alternative: «Они не оставили…» по ближайшему множественному субъекту предыдущего предложения
  rationale: Масоретский текст употребляет הִשְׁאִיר в единственном числе, возвращая ответственность к Ииую, хотя непосредственное убийство ранее описано глаголом во множественном числе.
translation_notes:
  register: Современный литературный русский язык с кратким, суровым повествовательным ритмом. Повтор «живыми» сохранён вслед за еврейским текстом. Глагол «зарезали» передаёт силу שׁחט точнее нейтрального «убили».
