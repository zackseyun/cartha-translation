lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: истребил
  rationale: Порода хифиль глагола שׁמד выражает причинение уничтожения или устранения. «Истребил» передаёт силу действия и не добавляет к тексту пояснений о способе уничтожения.
- source_word: יֵהוּא
  choice: Ииуй
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: הַבַּעַל
  choice: Ваала
  rationale: Сохранено имя божества без пояснительного расширения «поклонение Ваалу»; культовый смысл определяется контекстом.
- source_word: מִיִּשְׂרָאֵל
  choice: из Израиля
  rationale: Предлог מִן обозначает удаление или отделение; «из Израиля» непосредственно сохраняет исходный пространственно-смысловой образ.
- source_word: וַ
  choice: Так
  rationale: Союзная форма продолжает повествование и в контексте подводит итог описанным действиям Ииуя; «так» естественно передаёт этот итоговый оттенок.
theological_decisions:
- issue: Значение объекта «Ваал»
  choice: Имя Ваала оставлено без развёртывания в «поклонение Ваалу».
  alternative: Ииуй искоренил поклонение Ваалу в Израиле.
  rationale: В еврейском тексте прямым дополнением стоит הַבַּעַל, а не выражение «поклонение Ваалу». Ближайший контекст показывает уничтожение культа, но перевод не должен подменять исходную формулировку толкованием.
translation_notes:
  register: Современный литературный русский с краткой, торжественно-повествовательной формулировкой. Традиционные формы имён «Ииуй» и «Ваал» сохранены ради узнаваемости; синтаксис следует еврейскому тексту, не заменяя Ваала толкованием о его культе.
