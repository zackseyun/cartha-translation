base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: ru
  text: Однако Ииуй не отступил от грехов Иеровоама, сына Навата, к которым тот склонил Израиль, — золотых тельцов, что были в Вефиле и Дане.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Однако
  rationale: В данном контексте частица вводит ограничение и противопоставляет этому стиху предшествующие положительные действия Ииуя; «однако» естественно передаёт этот поворот по-русски.
- source_word: חֲטָאֵי
  choice: грехов
  rationale: Прямое и прозрачное обозначение конкретных культовых грехов, связанных с политикой Иеровоама.
- source_word: הֶחֱטִיא
  choice: ввёл … в грех
  rationale: Каузативная форма указывает, что Иеровоам побудил Израиль грешить; эта формулировка сохраняет причинительный смысл и звучит естественно по-русски.
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: не отступил от
  rationale: Передаёт еврейскую идиому прекращения следования определённому пути, не воспроизводя её неестественно буквально.
- source_word: עֶגְלֵי הַזָּהָב
  choice: золотых тельцов
  rationale: Конкретизирует названные ранее грехи Иеровоама и сохраняет традиционно понятное обозначение культовых изображений.
- source_word: בֵּית אֵל
  choice: Вефиле
  rationale: Устоявшаяся русская библейская форма географического названия с требуемым предложным падежом.
- source_word: דָּן
  choice: Дане
  rationale: Устоявшаяся русская форма географического названия с требуемым предложным падежом.
theological_decisions:
- issue: Отношение выражения «золотые тельцы» к «грехам Иеровоама»
  choice: Передать его как поясняющее приложение после тире, повторив предлог «от».
  alternative: Понять выражение как синтаксически обособленное возобновляющее уточнение без повторения предлога.
  rationale: Еврейский текст переходит от общего обозначения грехов к их конкретному культовому проявлению. Тире сохраняет пояснительную связь, а повтор предлога делает русскую конструкцию ясной, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный регистр. Имена переданы в устоявшейся русской библейской форме; синтаксис сделан ясным без устранения пояснительной структуры оригинала.
