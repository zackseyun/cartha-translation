  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: ru
  text: 'Вестник пришёл и доложил ему: «Принесли головы царских сыновей». И он сказал: «Сложите их в две груды у входа в ворота и оставьте до утра».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: вестник
  rationale: В данном повествовательном контексте речь идёт о человеке, принёсшем известие, а не о сверхъестественном посланнике.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: доложил ему
  rationale: Русское «доложил» естественно передаёт сообщение новости лицу, наделённому властью; отдельное «говоря» в современном русском избыточно.
- source_word: הֵבִיאוּ
  choice: принесли
  rationale: Совершенный вид передаёт завершённое действие, результат которого налицо в момент сообщения.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: головы царских сыновей
  rationale: 'Сохраняет буквальный и контекстуально однозначный смысл сочетания: речь идёт об отсечённых головах сыновей царя.'
- source_word: שִׂימוּ אֹתָם שְׁנֵי צִבֻּרִים
  choice: сложите их двумя грудами
  rationale: Глагол и существительное описывают размещение голов в две отдельные груды; формулировка ясна и естественна по-русски.
- source_word: פֶּתַח הַשַּׁעַר
  choice: у входа в ворота
  rationale: Передаёт конкретное место у входа в городские ворота без ненужной архаизации.
- source_word: עַד הַבֹּקֶר
  choice: до утра
  rationale: Точно передаёт предел времени, до которого головы должны оставаться на месте.
