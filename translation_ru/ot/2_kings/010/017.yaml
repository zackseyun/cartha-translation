base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: ru
  text: Придя в Самарию, он перебил там всех, кто ещё оставался из людей Ахава, пока не уничтожил их[a], — по слову Яхве, которое Он сказал Илии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока не уничтожил его». Единственное число может собирательно указывать на дом Ахава как единое целое.'
    reason: Сохраняет грамматическую неоднозначность единственного местоименного суффикса в הִשְׁמִידוֹ.
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: Придя в Самарию
  rationale: 'Деепричастный оборот естественно передаёт последовательность повествовательных форм: прибытие предшествует следующему действию.'
- source_word: וַיַּךְ
  choice: перебил
  rationale: В данном контексте נכה обозначает нанесение смертельного поражения множеству людей; «перебил» ясно и естественно передаёт результат.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: всех, кто ещё оставался из людей Ахава
  rationale: Формулировка сохраняет широкое отношение к Ахаву, выраженное предлогом ל, не сужая группу исключительно до кровных родственников или рода.
- source_word: בְּשֹׁמְרוֹן
  choice: там
  rationale: Место действия сохранено, а местоименное наречие избегает тяжеловесного повторения «в Самарии» в одном русском предложении.
- source_word: עַד הִשְׁמִידוֹ
  choice: и истребил их всех[a]
  rationale: Глагол שׁמד выражает полное уничтожение. В основном тексте единственное число суффикса передано по смыслу как относящееся ко всей названной группе; формальная неоднозначность отмечена в сноске.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Сохраняется формула исполнения пророческого слова и личное имя Бога, представленное тетраграмматоном.
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: которое Он возвестил Илии
  rationale: «Возвестил» естественно для пророческой речи, обращённой к Илии; прописная буква в местоимении соответствует принятому русскому благоговейному употреблению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому оно передано распространённой русской транслитерацией «Яхве», а не заменено титулом.
- issue: Референт единственного суффикса в הִשְׁמִידוֹ
  choice: В основном тексте — вся группа оставшихся людей Ахава
  alternative: Ахав как собирательное обозначение его дома
  rationale: Ближайший смысловой референт — упомянутые во множественном числе оставшиеся люди; однако еврейский суффикс стоит в единственном числе и может представлять дом Ахава как единое целое, что сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-пророческого повествования. Формулировка «люди Ахава» намеренно шире, чем «род Ахава», поскольку контекст может включать не только родственников. Повтор топонима сглажен словом «там» без потери содержания.
