source:
  edition: WLC
  text: וְ/עַתָּ֗ה כְּ/בֹ֨א הַ/סֵּ֤פֶר הַ/זֶּה֙ אֲלֵי/כֶ֔ם וְ/אִתְּ/כֶ֖ם בְּנֵ֣י אֲדֹנֵי/כֶ֑ם וְ/אִתְּ/כֶם֙ הָ/רֶ֣כֶב וְ/הַ/סּוּסִ֔ים וְ/עִ֥יר מִבְצָ֖ר וְ/הַ/נָּֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: ru
  text: Теперь, когда это письмо[a] придёт к вам, поскольку с вами сыновья вашего господина[b] и в вашем распоряжении колесницы, кони, укреплённый город[c] и оружие,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этот документ».'
    reason: lexical_alternative
  - marker: b
    text: То есть сыновья царя Ахава, которому прежде служили адресаты письма.
    reason: cultural_note
  - marker: c
    text: 'Или: «город-крепость»; имеется в виду доступный адресатам город, способный выдержать оборону.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Теперь
  rationale: Передаёт переход к следующему пункту послания; начальный союз естественно опускается в современном русском.
- source_word: כְּבֹא
  choice: когда … придёт
  rationale: Инфинитив с כְּ имеет временное значение; применительно к письму по-русски естественно сказать «когда придёт».
- source_word: הַסֵּפֶר הַזֶּה
  choice: это письмо
  rationale: В контексте царской переписки סֵפֶר обозначает письменное послание, а не книгу.
- source_word: וְאִתְּכֶם בְּנֵי אֲדֹנֵיכֶם
  choice: поскольку с вами сыновья вашего господина
  rationale: Сохраняется обстоятельственная конструкция и политический, а не божественный смысл אֲדֹנֵיכֶם.
- source_word: הָרֶכֶב וְהַסּוּסִים
  choice: колесницы, кони
  rationale: Прямое и естественное обозначение военных ресурсов; единственное число רֶכֶב имеет здесь собирательное значение.
- source_word: וְעִיר מִבְצָר
  choice: укреплённый город
  rationale: Точно передаёт город, пригодный для обороны, без излишнего уточнения его роли.
- source_word: וְהַנָּשֶׁק
  choice: оружие
  rationale: Современное обобщающее соответствие для вооружения; «доспехи» было бы неоправданно узким.
- source_word: וְאִתְּכֶם
  choice: в вашем распоряжении
  rationale: 'Повторное «с вами» перед перечнем военных средств передано функционально и естественно: эти ресурсы доступны адресатам.'
