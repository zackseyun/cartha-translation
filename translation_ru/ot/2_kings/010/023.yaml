    rationale: В еврейском тексте стоит יהוה, личное имя. «Яхве» непосредственно передаёт исходное обозначение и согласуется с указанным английским лексическим решением; титул «ГОСПОДЬ» является интерпретирующей заменой.
  - severity: low
