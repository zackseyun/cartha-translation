  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: ru
  text: 'Ииуй и Ионадав, сын Рехава, вошли в дом Ваала[a]. Ииуй сказал поклонникам Ваала: «Обыщите и проверьте, нет ли здесь среди вас кого-нибудь из служителей Яхве, а только поклонники Ваала».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храм Ваала». Буквально: «в дом Ваала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошли
  rationale: Глагол בוא при указании места назначения естественно передаёт вход внутрь здания. Хотя форма глагола единственного числа, составное подлежащее на русском требует множественного числа.
- source_word: בֵּית הַבָּעַל
  choice: дом Ваала
  rationale: Буквально сохраняет еврейское выражение; по контексту речь идёт о храме, что пояснено в сноске.
- source_word: עֹבְדֵי הַבַּעַל
  choice: поклонники Ваала
  rationale: В культовом контексте причастие от עבד обозначает почитателей божества; «поклонники» яснее для современного читателя, чем буквальное «служители».
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: поищите и удостоверьтесь
  rationale: 'Передаёт два повеления: провести поиск и проверить результат; буквальное «поищите и посмотрите» по-русски менее ясно.'
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: что среди вас здесь нет
  rationale: Конструкция с פן выражает предостережение и необходимость исключить чьё-либо присутствие; по-русски это естественно передаётся после «удостоверьтесь» отрицательной придаточной конструкцией.
- source_word: מֵעַבְדֵי יְהוָה
  choice: никого из служителей ГОСПОДА
  rationale: Сохраняет партитивное множественное число с מן и различает устойчивое обозначение служителей YHWH от культового «поклонники Ваала».
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона титулом в прописном начертании; она отличает Божье имя от обычного слова «Господь».
- source_word: כִּי אִם ... לְבַדָּם
  choice: а только
  rationale: 'Естественно выражает резкое исключительное противопоставление: никаких служителей ГОСПОДА, исключительно поклонники Ваала.'
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Основной текст следует принятой русской библейской конвенции передачи тетраграмматона словом «ГОСПОДЬ»; это не устраняет личностную референцию имени и не вносит конфессионального толкования.
- issue: Значение עבד применительно к Ваалу и ГОСПОДУ
  choice: «поклонники» для Ваала и «служители» для ГОСПОДА
  alternative: Единообразное «служители» в обоих случаях
  rationale: Один корень допускает оба значения. Контекст собрания в храме подчёркивает культовое поклонение Ваалу, тогда как выражение «служители ГОСПОДА» естественно сохраняет более широкую принадлежность и служение; смысловой контраст остаётся явным.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Имена переданы в привычной русской форме: Ииуй, Ионадав, Рехав, Ваал. Местоименное еврейское «он сказал» уточнено как «Ииуй сказал», чтобы избежать двусмысленности после составного подлежащего.'
