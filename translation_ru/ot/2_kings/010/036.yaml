  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ יֵהוּא֙ עַל יִשְׂרָאֵ֔ל עֶשְׂרִ֥ים וּ/שְׁמֹנֶֽה שָׁנָ֖ה בְּ/שֹׁמְרֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/036.yaml
  text: The time that Jehu reigned over Israel was twenty-eight years in Samaria.
translation:
  language: ru
  text: Иу́й царствовал над Израилем в Самарии двадцать восемь лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר
  choice: царствовал… двадцать восемь лет
  rationale: Еврейское выражение буквально говорит о «днях, в которые» царствовал Иуй, но в формуле итогов царствования естественно обозначает его продолжительность. По-русски это ясно и непосредственно передаётся конструкцией со сказуемым и указанием числа лет.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Глагол точно передаёт монархический смысл и соответствует традиционной русской формуле описания продолжительности правления царя.
- source_word: יֵהוּא
  choice: Иу́й
  rationale: Использована устоявшаяся русская библейская форма имени; ударение помогает обычному читателю правильно его произнести.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при מָלַךְ обозначает народ или царство, над которым осуществляется царская власть.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: двадцать восемь лет
  rationale: Прямое и естественное современное русское обозначение продолжительности царствования.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Оборот указывает на место царствования, то есть царскую столицу; в русском языке естественно поставить его рядом с глаголом «царствовал».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, краткая и достойная формула царского итога. Буквальное «дни, в которые» не воспроизведено механически, поскольку по-русски оно звучало бы неестественно; временной смысл полностью сохранён. Союз וְ в начале стиха не передан отдельным «и», так как здесь он служит повествовательной связкой, а русский итоговый стих естественно начинается без неё.
