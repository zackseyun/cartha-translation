translation_notes:
  register: Современный литературный русский язык; повествование передано ясно и сдержанно. Необычная цепочка еврейских глаголов движения естественно сжата, а неясный топоним сохранён в транслитерации. Маркер сноски поставлен непосредственно после названия, которое он поясняет.
