  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: ru
  text: Затем он отправился в Самарию. По пути он оказался у Бет-Экеда Пастухов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Бет-Экед» — название места. Возможно, оно означает «дом сбора»; в других толкованиях названия оно связывается со стрижкой овец или их связыванием.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיָּבֹא וַיֵּלֶךְ
  choice: Затем он отправился
  rationale: Последовательность повествовательных форм описывает начало и продолжение пути. Естественное русское «отправился» передаёт движение, не создавая тяжеловесного повтора трёх близких по смыслу глаголов.
- source_word: שֹׁמְרוֹן
  choice: в Самарию
  rationale: Название обозначает цель движения; в русском употреблена традиционная форма топонима с винительным падежом после глагола движения.
- source_word: הוּא
  choice: он был
  rationale: Самостоятельное местоимение вводит обстоятельство местонахождения Ииуя на пути; буквальное значение сохранено без уточнения, которого нет в еврейском тексте.
- source_word: בֵּית עֵקֶד
  choice: Бет-Экеда
  rationale: Сочетание лучше понимать как название места и транслитерировать, поскольку точное значение עֵקֶד в данном топониме не вполне ясно.
- source_word: הָרֹעִים
  choice: пастухов
  rationale: Прямое значение существительного — «пастухи»; родительный падеж сохраняет структуру полного названия или описательного уточнения.
- source_word: בַּדָּרֶךְ
  choice: По дороге
  rationale: Оборот указывает, что названное место находилось на маршруте в Самарию. Вынесение в начало второго предложения естественно для русского повествования.
