  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: ru
  text: Но Ииуй не заботился о том, чтобы следовать закону Яхве[a], Бога Израиля, всем своим сердцем. Он не отступил от грехов Иеровоама[b], которыми он ввёл Израиль в грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не заботился о том, чтобы ходить по закону Яхве». Еврейский глагол подчёркивает тщательное соблюдение.'
    reason: lexical_alternative
  - marker: b
    text: То есть от грехов, связанных с учреждённым Иеровоамом культом; это повторяющаяся формула в книгах Царств.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: не старался следовать
  rationale: Сочетание глагола שׁמר с инфинитивом передаёт заботу о тщательном исполнении. «Не старался следовать» естественно выражает отсутствие усердного послушания, не сводя смысл к простому несоблюдению.
- source_word: תּוֹרַת
  choice: закону
  rationale: В заветном контексте תּוֹרָה обозначает данное Богом наставление, имеющее обязательную силу; «закон» сохраняет этот смысл и привычно для русского библейского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּכָל לְבָבוֹ
  choice: всем своим сердцем
  rationale: Устойчивое выражение означает полную внутреннюю преданность и естественно звучит по-русски.
- source_word: לֹא סָר מֵעַל
  choice: не отступил от
  rationale: Глагол סור означает удалиться, отвернуться или отступить; выбранная формулировка ясна в нравственно-религиозном контексте.
- source_word: חַטֹּאות
  choice: грехов
  rationale: Прямо передаёт форму множественного числа и оценку культовых нарушений Иеровоама.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: которыми тот ввёл Израиль в грех
  rationale: Каузативная форма הֶחֱטִיא означает побудить или привести ко греху. Местоимение «тот» ясно указывает на Иеровоама и устраняет возможную русскую двусмысленность субъекта, не меняя смысла текста.
- source_word: וְיֵהוּא
  choice: Но Ииуй
  rationale: 'Союз имеет здесь противительное значение: прежняя борьба Ииуя с Ваалом противопоставлена его неполному послушанию Яхве.'
theological_decisions:
- issue: Оценка верности Ииуя завету
  choice: Сохранено напряжение между прежней ревностью Ииуя и отсутствием всецелого послушания Богу.
  alternative: Понимать стих лишь как критику незавершённой политической реформы.
  rationale: Выражения «всем своим сердцем» и «не отступил от грехов Иеровоама» дают личную и заветную оценку, однако перевод не делает выводов сверх сказанного в тексте.
- issue: Характер грехов Иеровоама
  choice: В основном тексте сохранено общее слово «грехи», а культовый контекст пояснён в сноске.
  alternative: Вставить в основной текст уточнение «идолопоклоннические грехи».
  rationale: Еврейский текст использует общее חַטֹּאות; конкретизация в основном тексте сузила бы его формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Метафора «ходить по закону» в основном тексте заменена естественным «следовать закону», а буквальный вариант сохранён в сноске. Имена переданы в традиционной русской библейской форме; тетраграмматон транслитерирован как «Яхве».
