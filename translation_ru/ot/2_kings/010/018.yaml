base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: ru
  text: 'И собрал Ииуй весь народ и сказал им[a]: «Ахав мало служил Ваалу[b], а Ииуй будет служить ему много».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В контексте эти слова Ииуя ироничны: он говорит, что будет много служить Ваалу, однако далее выясняется, что это была уловка, чтобы собрать почитателей Ваала.'
    reason: cross_reference
  - marker: b
    text: 'Или: «поклонялся Ваалу»; далее — «будет много поклоняться ему». Еврейский глагол «служить» употребляется также в значении религиозного служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Глагол קבץ в повествовательной форме означает собрать людей вместе; «собрал» естественно и точно передаёт действие.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Буквальное и естественное соответствие широкому обозначению всех собравшихся людей без неоправданного сужения смысла.
- source_word: עָבַד אֶת הַבַּעַל
  choice: служил Ваалу
  rationale: עבד при названии божества обозначает культовое служение. «Служил» сохраняет исходную лексику и допускает религиозный смысл, тогда как «поклонялся» было бы более явным толкованием.
- source_word: מְעָט
  choice: мало
  rationale: Наречие степени; краткое «мало» сохраняет контраст и параллелизм с הַרְבֵּה.
- source_word: יַעַבְדֶנּוּ
  choice: будет служить ему
  rationale: Местоименный суффикс относится к Ваалу; будущее время естественно передаёт значение имперфекта в прямой речи.
- source_word: הַרְבֵּה
  choice: много
  rationale: Наречное «много» точно и лаконично противопоставлено слову «мало», без добавления более явного сравнительного значения «больше».
- source_word: יֵהוּא
  choice: Ииуй
  rationale: Использована устоявшаяся русская библейская форма имени, понятная читателю и соответствующая русской традиции передачи библейских имён.
- source_word: הַבַּעַל
  choice: Ваал
  rationale: В русском языке имя божества обычно употребляется без артикля; форма «Ваал» является устоявшейся.
theological_decisions:
- issue: Заявление Ииуя о служении Ваалу
  choice: Передать слова Ииуя прямо, не обозначая обман или иронию в основном тексте.
  alternative: Добавить поясняющие слова вроде «сделал вид, что будет служить» или «заявил, будто будет служить».
  rationale: Еврейский текст прямо приводит речь Ииуя. Последующий контекст раскрывает её как уловку, но в сам перевод стиха этого толкования добавлять не следует.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет последовательность древнееврейского рассказа. Формулировка «мало… много» передаёт краткий риторический параллелизм оригинала.
