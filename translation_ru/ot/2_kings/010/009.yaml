base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: ru
  text: 'Утром Ииуй вышел, встал и сказал всему народу: «Вы невиновны[a]. Вот, я составил заговор против своего господина и убил его. Но кто же убил всех этих?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы правы»; букв. «Вы праведны». Здесь еврейское слово, по-видимому, означает, что народ невиновен и непричастен к случившемуся.'
    reason: Сохраняет более широкое значение צַדִּקִים и объясняет выбранный контекстуальный перевод.
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Утром
  rationale: Естественно передаёт временную рамку и повествовательную формулу; отдельное «и было» в современном русском здесь избыточно.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: вышел, встал перед всем народом
  rationale: Сохраняет последовательность действий; «перед всем народом» естественно выражает публичное положение говорящего, не меняя адресата.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Стандартное и достойное обозначение собравшихся людей в данном повествовательном контексте.
- source_word: צַדִּקִים אַתֶּם
  choice: Вы невиновны
  rationale: Множественное צַדִּקִים в этой публично-судебной реплике указывает прежде всего на непричастность и отсутствие вины, а не на общее нравственное качество.
- source_word: הִנֵּה
  choice: Да
  rationale: Передаёт эмфатическое признание и привлечение внимания в естественной русской речи; буквальное «вот» здесь звучало бы менее плавно.
- source_word: קָשַׁרְתִּי עַל
  choice: я составил заговор против
  rationale: Точно передаёт политический смысл глагола קשר с предлогом עַל.
- source_word: אֲדֹנִי
  choice: моего господина
  rationale: Обозначает царя как властителя Ииуя; строчная буква исключает понимание как божественного титула.
- source_word: וָאֶהְרְגֵהוּ
  choice: и убил его
  rationale: Прямой и современный эквивалент глагола הרג с местоименным суффиксом.
- source_word: וּמִי הִכָּה
  choice: Но кто же убил
  rationale: Контекст придаёт союзу противительное значение; частица «же» подчёркивает риторическое противопоставление. נכה здесь означает нанесение смертельного удара.
- source_word: כָּל אֵלֶּה
  choice: всех этих
  rationale: Сохраняет намеренно краткое указание еврейского текста; из контекста ясно, что речь идёт об убитых людях.
theological_decisions:
- issue: Смысл צַדִּקִים в обращении Ииуя
  choice: Вы невиновны
  alternative: Вы праведны / Вы правы
  rationale: Контекст публичного оправдания народа в противопоставлении виновникам убийства поддерживает судебно-правовой смысл, однако лексическая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Избегаются архаизмы вроде «се» и чрезмерно буквальная начальная формула. Риторический контраст речи Ииуя сохранён.
