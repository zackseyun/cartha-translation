  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: ru
  text: 'И пошёл он оттуда дальше и встретил Ионадава, сына Рехава, который шёл ему навстречу. Он приветствовал его[a] и спросил: «Верно ли твоё сердце мне, как моё — тебе?»[b] Ионадав ответил: «Да, да».[c] Ииуй сказал: «Дай мне руку». Ионадав подал ему руку, и Ииуй поднял его к себе в колесницу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благословил его». Древнееврейский глагол может означать «благословлять», но в сцене встречи, вероятно, обозначает приветствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Прямо ли твоё сердце, как моё сердце с твоим сердцем?» Эта формула выражает взаимную верность, расположенность или согласие намерений.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «Есть и есть» — усиленное утверждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: И пошёл он оттуда дальше
  rationale: Передаёт продолжение движения в повествовании; «дальше» естественно выражает последовательность действий.
- source_word: וַיִּמְצָא אֶת־יְהוֹנָדָב בֶּן־רֵכָב
  choice: и встретил Ионадава, сына Рехава
  rationale: Хотя מצא буквально означает «нашёл», в дорожной сцене русское «встретил» естественно передаёт состоявшуюся встречу без идеи предварительного поиска.
- source_word: לִקְרָאתוֹ
  choice: который шёл ему навстречу
  rationale: Ясно показывает, что Ионадав приближался для встречи с Ииуем.
- source_word: וַיְבָרְכֵהוּ
  choice: Он приветствовал его
  rationale: ברך может означать «благословить», но в сцене встречи вероятнее обозначает приветствие; буквальная возможность отмечена в сноске.
- source_word: הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ
  choice: Искренне ли твоё сердце со мной, как моё сердце — с твоим?
  rationale: «Сердце» сохраняет древнееврейскую метафору внутренней расположенности, а «искренне» передаёт יָשָׁר в контексте взаимной верности и единства намерений. Необычная конструкция дополнительно отражена в сноске.
- source_word: יֵשׁ וָיֵשׁ
  choice: Да, да
  rationale: Повтор передаёт усиленное утвердительное заверение и звучит естественно по-русски.
- source_word: תְּנָה אֶת־יָדֶךָ
  choice: дай мне руку
  rationale: Сохраняет образ жеста, одновременно служащего подтверждением согласия и помощью при подъёме.
- source_word: וַיִּתֵּן יָדוֹ
  choice: Тот подал ему руку
  rationale: «Подал руку» естественно описывает ответное действие по-русски; указательное местоимение устраняет двусмысленность участников.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה
  choice: и он поднял его к себе на колесницу
  rationale: Каузативная форма עלה передаётся как «поднял», אֵלָיו — «к себе», а движение на транспортное средство естественно выражено предлогом «на».
theological_decisions:
- issue: Значение образа прямого сердца
  choice: 'Передать как искреннюю расположенность и согласие: «Искренне ли твоё сердце со мной»'
  alternative: «Право ли твоё сердце» или «предано ли твоё сердце»
  rationale: Формулировка сохраняет нравственно-реляционную многозначность יָשָׁר и не сводит вопрос исключительно к моральной безупречности либо политической лояльности.
