  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан понятным для обычного читателя, при этом сохранены образ сердца, повтор в ответе Ионадава и направленность движения на колесницу. Имена переданы в традиционной русской библейской форме: Ионадав, Рехав.'
