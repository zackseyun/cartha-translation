  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: ru
  text: от Иордана к востоку — всю землю Галаада, земли гадитян, рувимлян и манассян, от Ароера, что у долины Арнона[a], и Галаад, и Васан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что у потока Арнона»; еврейское слово נַחַל может обозначать речное русло, сезонный поток или долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: от Иордана к востоку
  rationale: מִן обозначает исходную границу территории, а буквальное «к восходу солнца» в географическом контексте естественно передаётся как «к востоку».
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: всю землю Галаадскую
  rationale: Сохраняется прямое дополнение к глаголу предыдущего стиха и традиционная, понятная по-русски форма географического названия.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: землю гадитян, рувимлян и манассян
  rationale: Еврейские прилагательные обозначают племенные группы, населявшие эту территорию; добавление слова «землю» делает приложение ясным в русском синтаксисе.
- source_word: מֵעֲרֹעֵר
  choice: от Ароера
  rationale: Предлог отмечает южную границу, а название места передано принятой русской транслитерацией.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: что у долины Арнона
  rationale: עַל здесь имеет местное значение «у, возле», а נַחַל может обозначать долину, русло сезонного потока или сам поток; основной текст использует географически ясное «долина».
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: включая Галаад и Васан
  rationale: Повторный союз присоединяет уточнение охвата территории; «включая» естественно передаёт добавочный смысл, не превращая названия в новую самостоятельную фразу.
