source:
  edition: WLC
  text: וַ/יַּ֣ךְ יֵה֗וּא אֵ֣ת כָּל הַ/נִּשְׁאָרִ֤ים לְ/בֵית אַחְאָב֙ בְּ/יִזְרְעֶ֔אל וְ/כָל גְּדֹלָ֖י/ו וּ/מְיֻדָּעָ֣י/ו וְ/כֹהֲנָ֑י/ו עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: ru
  text: И убил Ииуй всех, кто ещё оставался из дома Ахава в Изрееле, а также всех его вельмож[a], приближённых[b] и священников, так что не оставил ему ни одного уцелевшего[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «великих людей»; возможно также: «знатных людей» или «руководителей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «близких знакомых», «доверенных людей»; буквально — «тех, кого он знал».'
    reason: lexical_alternative
  - marker: c
    text: «Ему» — то есть Ахаву или дому Ахава.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: убил
  rationale: В данном повествовательном контексте глагол נכה обозначает смертельное поражение. «Убил» ясно и естественно передаёт результат действия, не прибегая к архаичному «поразил».
- source_word: הַנִּשְׁאָרִים לְבֵית אַחְאָב
  choice: всех, кто ещё оставался из дома Ахава
  rationale: Оборот передаёт оставшихся в живых представителей или сторонников династического дома Ахава; относительное придаточное естественно звучит по-русски и сохраняет смысл остатка.
- source_word: בְּיִזְרְעֶאל
  choice: в Изрееле
  rationale: Предлог ב здесь имеет обычное местное значение и указывает на город.
- source_word: גְּדֹלָיו
  choice: его вельмож
  rationale: Слово обозначает влиятельных, высокопоставленных людей, связанных с Ахавом. «Вельможи» кратко и ясно передаёт их общественное положение.
- source_word: מְיֻדָּעָיו
  choice: приближённых
  rationale: Форма от ידע буквально указывает на людей, известных ему или близко с ним связанных; в политическом контексте «приближённые» лучше, чем нейтральное «знакомые», передаёт вероятную близость к царскому дому.
- source_word: כֹהֲנָיו
  choice: его священников
  rationale: Сохранено прямое значение существительного без уточнения их конкретной культовой или административной роли, которой сам стих не называет.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: так что не оставил ему ни одного уцелевшего
  rationale: Оборот выражает полное уничтожение остатка. «Ни одного уцелевшего» естественно передаёт שָׂרִיד, а местоимение «ему» сохраняет сжатость и некоторую неоднозначность еврейского текста.
theological_decisions:
- issue: К кому относится местоимение לוֹ в заключительной части стиха
  choice: Сохранено местоимение «ему»; по контексту оно относится к Ахаву или к его дому
  alternative: Раскрыть как «дому Ахава» либо «Ахаву»
  rationale: Еврейский текст использует местоимение мужского рода единственного числа и не называет референта повторно. Его сохранение не устраняет допустимую неоднозначность между самим Ахавом как главой рода и домом Ахава как династией.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Дом Ахава» сохранён как понятное библейское обозначение династии; архаичные глаголы вроде «поразил» и чрезмерно разговорные формулировки избегаются.
