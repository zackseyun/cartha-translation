base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: ru
  text: 'И сказал он заведовавшему гардеробом: «Вынеси одежду для всех служителей Ваала[a]». И тот вынес им одежду.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонников Ваала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: хранилище одежд
  rationale: Существительное обозначает помещение или хранилище, связанное с одеждой. Этот вариант ясен современному читателю и не привносит более поздних церковных ассоциаций слова «ризница».
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: тому, кто заведовал хранилищем одежд
  rationale: Оборот буквально указывает на человека, поставленного над хранилищем; «заведовал» естественно передаёт административную ответственность.
- source_word: הוֹצֵא
  choice: Вынеси
  rationale: Каузативный императив от יצא в данном контексте означает вынести одежду из хранилища.
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: одеяния
  rationale: Оба существительных употреблены собирательно и обозначают выдаваемую одежду; «одеяния» сохраняет достоинство регистра и уместно для особой одежды участников культа.
- source_word: עֹבְדֵי הַבָּעַל
  choice: служителей Ваала
  rationale: עבד буквально связано со служением; в контексте культа речь идёт о людях, преданных служению Ваалу. «Служители» сохраняет смысловую связь со служением и религиозный оттенок.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: И тот вынес им одеяния
  rationale: 'Смена на «тот» устраняет возможную двусмысленность русского местоимения: действие совершил заведующий хранилищем, а не Ииуй. Собирательное существительное передано множественным числом естественно для русского языка.'
theological_decisions:
- issue: Значение עֹבְדֵי הַבָּעַל
  choice: служителей Ваала
  alternative: поклонников Ваала
  rationale: «Служителей» ближе к лексическому значению עבד и одновременно естественно обозначает культовое служение; примечание сохраняет возможный перевод по функции как «поклонники».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Избегнуто слово «ризница», способное вызвать анахроничные церковные ассоциации; «одеяния» передаёт особую, вероятно отличительную одежду без излишнего уточнения её назначения.
