base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: ru
  text: 'Тогда он сказал: «Иди со мной и посмотри на моё рвение ради Яхве». И его посадили в его колесницу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: Поезжай со мной
  rationale: Императив הלך в сочетании с «со мной» служит приглашением следовать вместе; в контексте поездки на колеснице естественный русский эквивалент — «поезжай со мной».
- source_word: וּרְאֵה
  choice: и увидишь
  rationale: Буквально стоит повелительное «и посмотри/увидь», однако по-русски после приглашения естественнее будущее «и увидишь», сохраняющее смысл обещанного наглядного свидетельства.
- source_word: בְּקִנְאָתִי
  choice: моё рвение
  rationale: קִנְאָה обозначает горячую ревность или рвение. В данном контексте речь идёт о заявленной преданности Яхве; «рвение» ясно передаёт основной смысл, а возможное значение «ревность» отмечено в сноске.
- source_word: לַיהוָה
  choice: о Яхве
  rationale: Предлог ל обозначает объект рвения; по-русски устойчиво и достойно звучит «рвение о Яхве». Имя יהוה передано как «Яхве».
- source_word: וַיַּרְכִּבוּ אֹתוֹ בְּרִכְבּוֹ
  choice: И его посадили к нему в колесницу
  rationale: Каузативная форма רכב означает, что неназванные лица помогли ему сесть или посадили его в колесницу. Оборот «к нему» сохраняет местоименную форму оригинала и показывает, что он ехал вместе с говорившим.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблено личное заветное имя יהוה; транслитерация «Яхве» сохраняет его как имя.
- issue: Оценка заявленного усердия говорящего
  choice: рвение
  alternative: ревность
  rationale: Перевод не выносит богословской оценки искренности или нравственного качества действий говорящего. «Рвение» передаёт его собственное заявление, а семантическая напряжённость слова קִנְאָה сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с прямой, понятной речью и умеренно торжественным библейским звучанием. Неопределённое множественное число в последней части сохранено без добавления отсутствующих в стихе действующих лиц.
