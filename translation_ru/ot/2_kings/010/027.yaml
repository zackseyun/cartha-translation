base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: ru
  text: Они разрушили столб Ваала и разрушили храм Ваала[a], превратив его в отхожее место, каковым он остаётся и по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом Ваала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: разрушили
  rationale: Глагол נתץ обозначает насильственное разрушение сооружения или культового предмета. «Разрушили» естественно сочетается и со столбом, и с храмом, а повтор сохраняет синтаксический акцент еврейского текста.
- source_word: מַצְּבַת
  choice: священный столб
  rationale: מַצֵּבָה здесь означает культовый стоячий камень или столб. Определение «священный» ясно передаёт культовую функцию предмета, не приписывая ему одобрительной оценки.
- source_word: הַבָּעַל
  choice: Ваала
  rationale: בַּעַל в данном контексте — имя или титул ханаанского божества; традиционная русская форма — «Ваал».
- source_word: בֵּית הַבַּעַל
  choice: храм Ваала
  rationale: Хотя בַּיִת буквально значит «дом», в культовом контексте сочетание обозначает святилище или храм. «Храм Ваала» понятно современному читателю; буквальный образ сохранён в сноске.
- source_word: וַיְשִׂמֻהוּ לְמַחֲרָאוֹת
  choice: превратив его в отхожее место
  rationale: Конструкция שׂוּם с ל выражает превращение или назначение, а מַחֲרָאוֹת обозначает место для испражнений. Формулировка прямо передаёт намеренное осквернение бывшего святилища.
- source_word: עַד הַיּוֹם
  choice: и по сей день
  rationale: Устойчивое еврейское выражение указывает, что описанное состояние сохранялось до времени повествователя; «по сей день» — естественный русский эквивалент.
theological_decisions:
- issue: Передача названия святилища Ваала
  choice: храм Ваала
  alternative: дом Ваала
  rationale: Контекст ясно указывает на культовое здание. «Храм» передаёт функцию без конфессионального уточнения, а сноска сохраняет буквальное значение еврейского выражения.
- issue: Передача осквернения святилища
  choice: отхожее место
  alternative: место для нечистот
  rationale: Еврейское слово прямо обозначает место для испражнений. Выбранная передача сохраняет резкость повествования и смысл полного осквернения, не прибегая к архаизму или эвфемизму.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Повтор «разрушили» сохранён ради соответствия еврейской структуре; выражение «отхожее место» прямое, но не вульгарное.
