  to: Они разрушили столб Ваала и разрушили храм Ваала[a], превратив его в отхожее место, каковым он остаётся и по сей день.
  rationale: Убраны добавочное «там» и невыраженное определение «священный». Финал уточнён так, чтобы «по сей день» относилось к продолжающемуся состоянию разрушенного храма, как в еврейском тексте.
