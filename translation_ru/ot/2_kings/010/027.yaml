  terminology: «Ваал» — нормативная передача имени. «Храм Ваала» оправдан в культовом контексте; сноска надлежащим образом отмечает буквальное «дом Ваала». «Отхожее место» передаёт намеренно резкое значение למחראות без вульгаризации.
