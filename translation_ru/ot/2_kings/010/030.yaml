    rationale: Русский глагол «сделать с кем-либо» без уточнения звучит разговорно и неопределённо. Оригинальное עָשִׂיתָ לְבֵית можно точно и нейтрально передать как исполнение замысла «над домом Ахава».
  - severity: low
