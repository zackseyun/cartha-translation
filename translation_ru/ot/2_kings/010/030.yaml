  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: ru
  text: 'И сказал Яхве Ииую: «За то, что ты хорошо поступил, сделав то, что правильно в Моих глазах, и исполнив над домом Ахава всё, что было у Меня на сердце, твои сыновья до четвёртого поколения[a] будут сидеть на престоле Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья четвёртых [поколений]»; еврейский оборот означает династию продолжительностью в четыре поколения.'
    reason: Пояснение эллиптической еврейской идиомы בְּנֵי רְבִעִים и её династического смысла.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога как имя, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: יַעַן אֲשֶׁר
  choice: За то, что
  rationale: Естественно вводит основание последующего обещания и сохраняет причинное значение еврейского оборота.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: ты хорошо поступил, сделав то, что правильно в Моих глазах
  rationale: Сохраняет как похвалу действию Ииуя, так и характерную еврейскую оценочную формулу «в Моих глазах», не расширяя её до безусловного одобрения всего его царствования.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: всё, что было у Меня на сердце
  rationale: Сохраняет образ сердца как воли и внутреннего замысла Бога, не сводя выражение лишь к эмоциональному переживанию.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: сделал с домом Ахава
  rationale: Близко передаёт неопределённо широкую конструкцию оригинала и не добавляет отсутствующее в ней толкование, хотя контекст говорит об исполнении суда.
- source_word: בְּנֵי רְבִעִים
  choice: твои сыновья до четвёртого поколения
  rationale: Сохраняет слово «сыновья» и одновременно понятно передаёт идиоматический смысл четырёх поколений династических наследников.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: будут сидеть на престоле Израиля
  rationale: Сохраняет царский образ сидения на престоле; значение дательного לְךָ естественно выражено принадлежностью наследников Ииую.
theological_decisions:
- issue: Божественное одобрение действий Ииуя
  choice: Передать прямую похвалу Ииую за исполнение Божьего замысла в отношении дома Ахава, ограничив её рамками самого высказывания.
  alternative: Смягчить похвалу из-за последующей критики Ииуя либо истолковать её как полное одобрение всего его правления.
  rationale: Еврейский текст прямо называет правильными в Божьих глазах действия Ииуя с домом Ахава, но не распространяет эту оценку на все его поступки. Перевод сохраняет данное богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сделан понятным для обычного читателя; сохранены образы «в Моих глазах», «на сердце» и «сидеть на престоле». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской издательской традицией.
