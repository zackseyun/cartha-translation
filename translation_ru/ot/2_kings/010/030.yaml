- from: 'И сказал Яхве Ииую: «За то, что ты хорошо поступил, сделав то, что правильно в Моих глазах, и сделал с домом Ахава всё, что было у Меня на сердце, твои сыновья до четвёртого поколения[a] будут сидеть на престоле Израиля».'
  to: 'И сказал Яхве Ииую: «За то, что ты хорошо поступил, сделав то, что правильно в Моих глазах, и исполнив над домом Ахава всё, что было у Меня на сердце, твои сыновья до четвёртого поколения[a] будут сидеть на престоле Израиля».'
