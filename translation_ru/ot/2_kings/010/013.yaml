  text: וְ/יֵה֗וּא מָצָא֙ אֶת אֲחֵי֙ אֲחַזְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּ֖אמֶר מִ֣י אַתֶּ֑ם וַ/יֹּאמְר֗וּ אֲחֵ֤י אֲחַזְיָ֨הוּ֙ אֲנַ֔חְנוּ וַ/נֵּ֛רֶד לִ/שְׁל֥וֹם בְּנֵֽי הַ/מֶּ֖לֶךְ וּ/בְנֵ֥י הַ/גְּבִירָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: ru
  text: 'Ииуй встретил братьев Охозии, царя Иудеи,[a] и спросил: «Кто вы?» Они ответили: «Мы братья Охозии. Мы спустились узнать, всё ли благополучно у сыновей царя и сыновей царицы-матери».[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «братья Охозии», в царском повествовании может обозначать также его близких родственников или родичей, а не только родных братьев.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справиться о благополучии сыновей царя и сыновей царицы-матери».'
    reason: lexical_alternative
  - marker: c
    text: «Царица-мать» — передача еврейского слова гевира, придворного титула матери царя.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: встретил
  rationale: В данном повествовательном контексте глагол обозначает встречу или обнаружение людей; «встретил» естественно звучит по-русски и не предполагает, что Ииуй прежде их разыскивал.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: братьев Охозии
  rationale: Сохранено прямое значение «братья», хотя в царском повествовании слово может обозначать и более широкий круг близких родственников; эта неоднозначность отмечена в сноске.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Естественная русская передача царского титула, относящегося к Охозии.
- source_word: מִי אַתֶּם
  choice: Кто вы?
  rationale: Краткая и прямая передача еврейского вопроса.
- source_word: וַנֵּרֶד
  choice: Мы спустились
  rationale: Сохранено выраженное в оригинале движение вниз, вероятно обусловленное географией пути.
- source_word: לִשְׁלוֹם
  choice: узнать, всё ли благополучно у
  rationale: Контекстуально выражение означает осведомиться о благополучии, а не просто поприветствовать; выбран современный и естественный русский оборот.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: сыновей царя
  rationale: Сохранено конкретное значение «сыновья», без обобщения до «детей».
- source_word: הַגְּבִירָה
  choice: царицы-матери
  rationale: В контексте иудейского царского двора слово обозначает официальный статус матери царя; дефисное написание ясно передаёт единый придворный титул.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: и сыновей царицы-матери
  rationale: Сохранены параллелизм с «сыновьями царя» и отдельная формулировка оригинала, даже если обозначенные группы могли пересекаться.
