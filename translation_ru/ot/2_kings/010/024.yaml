base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: ru
  text: 'Они вошли, чтобы принести жертвы и всесожжения. А Ииуй поставил снаружи восемьдесят человек и сказал: «Кто допустит, чтобы у него ускользнул кто-либо из людей, которых я отдаю вам в руки, тот заплатит своей жизнью за жизнь беглеца».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его жизнь вместо его жизни»; то есть стражник, допустивший побег, лишится жизни вместо беглеца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Они вошли
  rationale: Глагол בוא здесь обозначает вход в место совершения культа; «вошли» естественно передаёт движение внутрь.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: чтобы принести жертвы и всесожжения
  rationale: עשה с названиями жертв означает их совершение или принесение; זְבָחִים передано общим «жертвы», а עֹלוֹת — традиционным и точным «всесожжения».
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: поставил снаружи восемьдесят человек
  rationale: 'שׂים в данном контексте означает разместить или поставить людей в качестве стражи. Местоименное לוֹ не требует отдельного выражения по-русски: действие самого Ииуя уже ясно; «человек» не уточняется до «воинов», поскольку еврейский текст этого прямо не говорит.'
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: Если кто-нибудь упустит хотя бы одного из людей
  rationale: Форма יִמָּלֵט буквально говорит о том, что человек спасётся или ускользнёт, однако конструкция и угроза обращены к стражникам и подразумевают их ответственность. «Упустит» кратко и естественно выражает этот смысл; «хотя бы одного» передаёт применимость угрозы к любому из группы.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: которых я отдаю вам в руки
  rationale: Оборот с «рукой» означает передачу под власть или ответственность; русский идиом «отдаю вам в руки» сохраняет образ исходного текста.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: поплатится своей жизнью за его жизнь
  rationale: נפש здесь означает жизнь. Формула выражает заменяющую смертную ответственность стражника; местоимения разграничены естественным русским синтаксисом.
theological_decisions:
- issue: Характер угрозы Ииуя
  choice: Сохранена прямая формула наказания жизнью за жизнь без нравственной оценки рассказчика.
  alternative: Смягчить её до общего указания на суровое наказание.
  rationale: Исходный текст недвусмысленно говорит о жизни стражника вместо жизни беглеца; перевод не должен ни смягчать угрозу, ни добавлять богословскую оценку действий Ииуя.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Культовые термины переданы привычными словами «жертвы» и «всесожжения»; угроза сформулирована ясно, без излишней архаизации.
