base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: ru
  text: В те дни Яхве стал сокращать владения Израиля[a], и Азаил поразил израильтян по всей территории Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стал отсекать (части) Израиля» или «стал уменьшать Израиль». Слово «владения» в еврейском тексте не названо, но контекст указывает на постепенную утрату областей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вдоль всей границы Израиля». Еврейское слово может означать как границу, так и ограниченную ею территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественно передаёт устойчивое еврейское временное выражение и сохраняет форму множественного числа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הֵחֵל
  choice: начал
  rationale: Форма глагола указывает на начало действия.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: отторгать части Израиля
  rationale: Редкий глагол выражает отсечение или уменьшение по частям; в контексте последующего перечисления земель речь, вероятно, идёт о постепенной утрате территории, а не о полном уничтожении Израиля.
- source_word: וַיַּכֵּם
  choice: поражал израильтян
  rationale: Глагол נכה имеет сильное военное значение «поражать, наносить поражение»; местоименный суффикс относится к народу Израиля, поэтому референт назван явно для ясности по-русски.
- source_word: חֲזָאֵל
  choice: Азаил
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: по всей территории Израиля
  rationale: גְּבוּל может обозначать как границу, так и ограниченную ею территорию; военный контекст лучше согласуется со значением всей области израильских владений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер начавшегося суда над Израилем
  choice: отторгать части Израиля
  alternative: истреблять Израиль
  rationale: Контекст говорит о постепенном сокращении израильских владений. Перевод не представляет это как немедленное полное уничтожение, но сохраняет прямое указание текста на действие Яхве.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. Формулировка «отторгать части» сохраняет образ отсечения и при этом ясно указывает на постепенные территориальные потери; «поражал» передаёт военную силу глагола без архаического «избивал».
