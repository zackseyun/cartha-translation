base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: ru
  text: 'Когда он закончил совершать всесожжение, Ииуй сказал телохранителям и военачальникам: «Войдите и поразите их! Пусть никто не выйдет». Телохранители и военачальники поразили их остриём меча, выбросили тела и прошли во внутреннюю часть храма Ваала.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до города дома Ваала»; слово, переведённое как «город», может также обозначать укреплённое место. Возможно, имеется в виду внутренняя укреплённая или священная часть храмового комплекса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: Когда он закончил приносить всесожжение
  rationale: Конструкция с כְּ и инфинитивом задаёт время следующего действия; «приносить всесожжение» естественно передаёт жертвенный оборот עשה העולה.
- source_word: לָרָצִים
  choice: телохранителям
  rationale: Буквально «бегунам»; при царе этим словом часто обозначалась дворцовая стража. Функциональный русский эквивалент яснее буквального «бегунам».
- source_word: לַשָּׁלִשִׁים
  choice: военачальникам
  rationale: שָׁלִישׁ обозначает военного должностного лица, возможно колесничного офицера; широкий эквивалент не навязывает спорную точную должность.
- source_word: בֹּאוּ הַכּוּם
  choice: Войдите и поразите их
  rationale: Повеления велят отряду войти в храмовое пространство и нанести смертельный удар; «поразите» сохраняет образ глагола נכה.
- source_word: אִישׁ אַל יֵצֵא
  choice: Пусть никто не выйдет
  rationale: Единственное אִישׁ имеет распределительное значение; современное «никто» точно и естественно передаёт полный запрет.
- source_word: לְפִי חָרֶב
  choice: остриём меча
  rationale: Устойчивый образ буквально означает «устами меча»; «остриём меча» сохраняет образность в понятной русской форме.
- source_word: וַיַּשְׁלִכוּ
  choice: выбросили тела
  rationale: Объект в еврейском тексте подразумевается; контекст после избиения указывает на тела. Явное дополнение необходимо для естественности русского и не меняет смысл сцены.
- source_word: עַד עִיר בֵּית הַבָּעַל
  choice: прошли во внутреннюю часть храма Ваала
  rationale: Буквальное עִיר — «город» или «укреплённое место», но в данном архитектурном контексте, перед дальнейшим проникновением в святилище, вероятна внутренняя часть храмового комплекса. Неопределённость сохранена в сноске.
