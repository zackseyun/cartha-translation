translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Архаичное «бегуны» заменено контекстуальным «телохранители»; культовый термин עֹלָה передан традиционным «всесожжение». Синтаксис остаётся энергичным и последовательным, как в еврейском рассказе.
