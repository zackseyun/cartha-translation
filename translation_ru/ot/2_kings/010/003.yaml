  text: וּ/רְאִיתֶ֞ם הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ מִ/בְּנֵ֣י אֲדֹנֵי/כֶ֔ם וְ/שַׂמְתֶּ֖ם עַל כִּסֵּ֣א אָבִ֑י/ו וְ/הִֽלָּחֲמ֖וּ עַל בֵּ֥ית אֲדֹנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: ru
  text: Тогда выберите среди сыновей вашего господина лучшего и наиболее достойного, посадите его на престол его отца и сражайтесь за дом вашего господина[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Дом» здесь означает царский род или династию, а не только жилище.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: выберите
  rationale: Буквально глагол означает «увидите», но в данном побудительном контексте речь идёт о том, чтобы рассмотреть кандидатов и выбрать одного из них.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: лучшего и самого достойного
  rationale: Сочетание прилагательных указывает на наиболее подходящего кандидата среди сыновей; «достойного» естественно передаёт здесь нравственную и практическую пригодность, не сводя יָשָׁר лишь к физической или формальной «прямоте».
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: из сыновей вашего господина
  rationale: Предлог מִן выражает выбор из числа сыновей. אֲדֹנֵיכֶם относится к земному владыке, поэтому строчное «господина» отличает его от божественного титула.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: посадите его на престол его отца
  rationale: Русское выражение «посадить на престол» естественно передаёт установление избранного сына царём и сохраняет образ исходного текста.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: и сражайтесь за дом вашего господина
  rationale: Предлог עַל здесь обозначает действие в защиту или в пользу кого-либо. «Дом» сохраняет библейский династический образ, разъяснённый в сноске.
theological_decisions:
- issue: Значение אֲדֹנֵיכֶם
  choice: вашего господина
  alternative: вашего владыки
  rationale: В контексте имеется в виду человеческий царственный господин, а не Яхве; строчная буква предотвращает смешение с божественным титулом.
- issue: Значение בֵּית в выражении «дом вашего господина»
  choice: сохранить образ «дом» с пояснением
  alternative: династия вашего господина
  rationale: «Дом» может означать царский род и династию. Сохранение исходного образа не устраняет его смысловую многослойность, а сноска предупреждает буквальное понимание как здания.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Императивная сила контекста передана прямыми побудительными формами. Термин «дом» сохранён как традиционный и содержательно ёмкий династический образ.
