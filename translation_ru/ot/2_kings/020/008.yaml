base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: ru
  text: 'И сказал Езекия Исаии: «Какое знамение того, что Яхве исцелит меня и что на третий день я поднимусь в дом Яхве[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм Яхве». Буквально: «дом Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Передаёт обычную последовательность древнееврейского повествования, не усиливая временной оттенок.
- source_word: חִזְקִיָּהוּ אֶל יְשַׁעְיָהוּ
  choice: Езекия Исаии
  rationale: Использованы общепринятые русские формы библейских имён и естественное для русского языка управление глагола «сказать».
- source_word: מָה אוֹת
  choice: Какое знамение подтвердит
  rationale: אוֹת обозначает подтверждающий знак. Такая формулировка естественна по-русски и ясно связывает знамение с последующим придаточным, не уточняя, каким именно оно будет.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание, которое должно быть подтверждено знамением.
- source_word: יִרְפָּא יְהוָה לִי
  choice: Яхве исцелит меня
  rationale: Будущее время соответствует значению имперфекта в данном обещании; предложная конструкция לִי естественно передана прямым дополнением.
- source_word: וְעָלִיתִי
  choice: и что ... я поднимусь
  rationale: Повторение «что» ясно показывает координацию двух частей содержания знамения; «поднимусь» сохраняет образ восхождения к святилищу.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Нормальное современное русское соответствие древнееврейскому временному выражению.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома» как обозначения святилища; более пояснительный вариант дан в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Связь двух будущих событий со знамением
  choice: знамение подтверждает и исцеление, и восхождение в дом Яхве
  alternative: считать восхождение лишь последствием исцеления, не входящим в содержание знамения
  rationale: Повторённая сочинительная конструкция позволяет естественно понимать оба события как содержание требуемого знамения, не устраняя их тесной смысловой связи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Знамение» сохраняет религиозный контекст אות, а синтаксис упрощён ровно настолько, чтобы вопрос звучал естественно и ясно.
