source:
  edition: WLC
  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: ru
  text: '«Вернись и скажи Езекии, правителю Моего народа: „Так говорит Яхве, Бог Давида, отца твоего: Я услышал твою молитву и увидел твои слёзы. Вот, Я исцеляю тебя[a]. На третий день ты взойдёшь в дом Яхве“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я исцелю тебя». В еврейском тексте буквально: «Вот, Я исцеляю тебя»; причастная форма может обозначать близкое, предстоящее действие.'
    reason: Сохраняет допустимое будущее прочтение причастия רֹפֶא и поясняет более буквальную передачу в основном тексте.
lexical_decisions:
- source_word: שׁוּב
  choice: Вернись
  rationale: Повеление Исайе возвратиться к Езекии; передаёт направленность действия естественным современным русским языком.
- source_word: נְגִיד עַמִּי
  choice: вождю Моего народа
  rationale: נָגִיד обозначает поставленного над народом правителя или предводителя. «Вождь» сохраняет особый титульный оттенок, не сводя слово к наследственному «князю».
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет традиционную формулу пророческой вести и передаёт тетраграмматон личным именем.
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: Бог Давида, отца твоего
  rationale: Следует порядку и синтаксической связи еврейского текста; «отец» здесь употреблён в значении предка.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ
  choice: Я услышал твою молитву
  rationale: Русский совершенный вид естественно выражает завершённое действие, значимое для последующего ответа Бога.
- source_word: רָאִיתִי אֶת דִּמְעָתֶךָ
  choice: увидел твои слёзы
  rationale: Сохраняет параллелизм с предшествующим глаголом и образность оригинала.
- source_word: הִנְנִי רֹפֶא לָךְ
  choice: Вот, Я исцеляю тебя
  rationale: «Вот» передаёт эмфатическое הִנְנִי, а настоящее время «исцеляю» отражает причастную форму רֹפֶא и её оттенок начинающегося или близкого действия.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: На третий день
  rationale: Прямое и естественное соответствие временному выражению без добавления отсутствующего в тексте «отныне».
- source_word: תַּעֲלֶה
  choice: ты взойдёшь
  rationale: Передаёт движение вверх и устойчивый библейский оттенок восхождения к храму, оставаясь понятным современному читателю.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет буквальный образ «дома», а не заменяет его контекстуально верным, но более толковательным словом «храм».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя Бога; транслитерация сохраняет различие между тетраграмматоном и титулом אֲדֹנָי.
- issue: Временной и аспектуальный оттенок רֹפֶא
  choice: Я исцеляю тебя
  alternative: Я исцелю тебя
  rationale: Причастие с הִנְנִי буквально представляет исцеление как непосредственно наступающее действие. Контекст допускает обещание будущего исцеления, поэтому этот вариант отмечен в сноске, а неоднозначность не устраняется.
- issue: Значение אָבִיךָ применительно к Давиду
  choice: отца твоего
  alternative: предка твоего
  rationale: Формальный родственный термин сохранён; в данном контексте он обозначает царственного предка Езекии, а не непосредственного отца.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Прямая речь оформлена русскими кавычками; местоимения, относящиеся к Богу, написаны с прописной буквы. Слово «слёзы» дано во множественном числе по естественной русской норме, хотя еврейская форма морфологически единственного числа может иметь собирательный смысл.
