  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: ru
  text: 'И он спросил: «Что они видели в твоём доме[a]?» Езекия ответил: «Они видели всё, что есть в моём доме. Не было ничего в моих сокровищницах[b], чего я им не показал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во дворце». Еврейское слово буквально означает «дом», но применительно к царю может обозначать дворец.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хранилищах». Еврейское слово обозначает места, где хранят ценности или запасы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: что
  rationale: Прямое вопросительное местоимение; естественно передаёт вопрос Исайи.
- source_word: רָאוּ
  choice: видели
  rationale: Обычное значение глагола ראה; прошедшее время соответствует повествовательному контексту.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: в твоём доме / в моём доме
  rationale: בַּיִת буквально означает «дом»; в царском контексте возможно значение «дворец», отмеченное в сноске без подмены основного образа.
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: всё, что есть в моём доме
  rationale: Сохраняет всеохватность כָּל и структуру относительного оборота; «есть» естественно выражает подразумеваемое наличие.
- source_word: לֹא הָיָה דָבָר
  choice: не было ничего
  rationale: Естественная русская передача еврейской отрицательной бытийной конструкции.
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: чего бы я им не показал
  rationale: Порода hифиль глагола ראה означает «показать»; местоимение «им» передаёт суффикс третьего лица множественного числа.
- source_word: בְּאֹצְרֹתָי
  choice: в моих сокровищницах
  rationale: אֹצָר может обозначать сокровищницу или хранилище; «сокровищницы» хорошо соответствует царскому контексту и показанным богатствам.
- source_word: וַיֹּאמֶר
  choice: спросил / ответил
  rationale: Хотя буквально это «сказал», русские глаголы речи естественно и точно выражают функцию вопроса и ответа в данном диалоге.
