  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: ru
  text: 'И сказал Езекия: «Тени нетрудно продвинуться на десять ступеней[a]. Нет, пусть тень отступит назад на десять ступеней».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на десять градусов». Еврейское слово означает «ступени» или «подъёмы» и может относиться к ступеням либо к делениям устройства Ахаза, связанного с тенью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: легко
  rationale: Прилагательное выражает лёгкость совершения действия; краткая безличная конструкция естественна для современного русского языка.
- source_word: הַצֵּל / לַצֵּל
  choice: тень / тени
  rationale: Стандартное значение слова צֵל; дательный падеж обусловлен русской конструкцией «тени легко пройти».
- source_word: לִנְטוֹת
  choice: пройти вперёд
  rationale: Глагол может означать «простираться, склоняться, поворачиваться». В контексте движения тени выражение «пройти вперёд» естественно передаёт её обычное продвижение и сохраняет контраст с движением назад.
- source_word: מַעֲלוֹת
  choice: ступени
  rationale: Слово буквально обозначает ступени или подъёмы. Такой перевод не навязывает конкретную реконструкцию устройства Ахаза; вариант «градусы» отмечен в сноске.
- source_word: לֹא כִּי
  choice: Нет, пусть
  rationale: Сочетание отвергает первый вариант и вводит предпочтительную альтернативу; по-русски это ясно и естественно выражается словом «нет» с последующим пожеланием.
- source_word: יָשׁוּב
  choice: пусть … отступит
  rationale: Глагол означает возвращение или движение обратно. Конструкция с «пусть» передаёт желательное значение формы в данном контексте.
- source_word: אֲחֹרַנִּית
  choice: назад
  rationale: Наречие прямо обозначает обратное направление движения.
