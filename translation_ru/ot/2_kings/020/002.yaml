lexical_decisions:
- source_word: וַיַּסֵּב
  choice: Тогда он повернулся
  rationale: Каузативная порода глагола סבב в последовательной повествовательной форме обозначает завершённое действие; «тогда» естественно передаёт развитие повествования.
- source_word: פָּנָיו אֶל הַקִּיר
  choice: лицом к стене
  rationale: Сохраняется конкретный образ оригинала; сочетание אֶל с קִיר указывает направление движения — «к стене».
- source_word: וַיִּתְפַּלֵּל
  choice: и помолился
  rationale: Форма хитпаэль глагола פלל здесь имеет обычное значение «молиться».
- source_word: אֶל יְהוָה
  choice: Яхве
  rationale: Предлог אֶל обозначает адресата молитвы, а тетраграмматон передан транслитерацией личного Божьего имени.
- source_word: לֵאמֹר
  choice: 'говоря:'
  rationale: Инфинитив אמר вводит содержание молитвы, которое следует в следующем стихе; двоеточие естественно оформляет это по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДУ
  rationale: Оригинал прямо употребляет тетраграмматон; «Яхве» сохраняет личное имя, не заменяя его титулом. Сноска указывает традиционный вариант.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом; сохранены конкретная образность и незавершённый переход к словам молитвы в следующем стихе.
