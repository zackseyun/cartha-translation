  text: בָּ/עֵ֣ת הַ/הִ֡יא שָׁלַ֡ח בְּרֹאדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ כִּ֣י שָׁמַ֔ע כִּ֥י חָלָ֖ה חִזְקִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: ru
  text: В то время Беродах-Баладан, сын Баладана, царь Вавилона, послал Езекии письма и подарок, потому что услышал, что Езекия был болен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Естественная русская передача обычного повествовательного указания времени без излишнего уточнения.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: Беродах-Баладан
  rationale: Передаёт согласный текст WLC непосредственно; вариант «Меродах-Баладан» из параллельного места здесь не подменяет основной текст.
- source_word: בֶּן בַּלְאֲדָן
  choice: сын Баладана
  rationale: Прямая и естественная передача патронимической конструкции.
- source_word: מֶלֶךְ בָּבֶל
  choice: царь Вавилона
  rationale: Стандартная передача титула и названия царства.
- source_word: סְפָרִים
  choice: письма
  rationale: В контексте дипломатического посольства речь, вероятнее всего, идёт о письменных посланиях.
- source_word: וּמִנְחָה
  choice: и подарок
  rationale: Нейтрально передаёт מִנְחָה как дар, не навязывая более узкого смысла дани или культового приношения.
- source_word: כִּי שָׁמַע
  choice: потому что услышал
  rationale: Первое כִּי вводит причину отправки писем и подарка.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: что Езекия был болен
  rationale: Второе כִּי вводит содержание услышанного; формулировка естественна по-русски и сохраняет указание на болезнь как предшествующее состояние.
