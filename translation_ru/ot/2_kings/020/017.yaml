  source_fidelity: 'Текст точно передаёт еврейское пророческое возвещение: הִנֵּה — «Вот», грядущие дни, все имущество дома и накопленное предками, его унесение в Вавилон и абсолютное утверждение, что ничего не останется. Пассив «будет унесено» уместно не называет деятеля, которого оригинал также не называет.'
