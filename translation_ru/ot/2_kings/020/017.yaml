source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: ru
  text: Вот, наступают дни, когда всё, что в твоём доме, и всё, что отцы твои накопили до этого дня, будет унесено в Вавилон. Ничего не останется, — говорит ГОСПОДЬ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую функцию частицы и естественно вводит торжественное пророческое возвещение.
- source_word: וְנִשָּׂא
  choice: будет унесено
  rationale: Передаёт пассивную форму и насильственное перемещение имущества, не добавляя прямо не названного деятеля.
- source_word: אָצְרוּ
  choice: накопили
  rationale: Естественно передаёт значение собирания и сохранения ценностей или запасов.
- source_word: דָּבָר
  choice: ничего
  rationale: В отрицательной конструкции לֹא יִוָּתֵר דָּבָר означает «не останется ни одной вещи / ничего».
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона капителью; она отличает имя Бога от обычного титула «Господь».
theological_decisions:
- issue: Неизбежность объявленного суда
  choice: «будет унесено» и «ничего не останется» переданы как прямое пророческое утверждение
  alternative: Смягчить высказывание модальностью («может быть унесено»)
  rationale: В еврейском тексте нет модального смягчения; формы выражают грядущее событие как определённое.
- issue: Передача божественного имени
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционная форма остаётся понятной широкому русскому читателю и при капительном написании обозначает тетраграмматон без привнесения конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский с торжественным пророческим тоном. Синтаксический параллелизм исходного текста сохранён, но фраза оформлена естественно для русского языка.
