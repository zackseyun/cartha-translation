  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: ru
  text: 'И сказал Исаия: «Возьмите лепёшку из инжира[a]». Они взяли её, наложили на нарыв[b], и он выздоровел[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спрессованную массу инжира».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воспалённую язву» или «фурункул».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и он жил»; здесь: выздоровел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продолжает повествование; «И сказал» естественно передаёт ход рассказа, не усиливая временной оттенок.
- source_word: יְשַׁעְיָהוּ
  choice: Исаия
  rationale: Традиционная и общеупотребительная русская форма имени пророка.
- source_word: קְחוּ
  choice: Возьмите
  rationale: Прямое соответствие повелительной форме множественного числа; варианты «принесите» и «достаньте» добавляли бы не выраженное явно направление действия.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: лепёшку из инжира
  rationale: דְּבֶלֶת обозначает спрессованную массу или лепёшку, а תְּאֵנִים уточняет, что она изготовлена из плодов инжира. Формулировка конкретна и понятна современному читателю.
- source_word: וַיִּקְחוּ
  choice: Они взяли её
  rationale: Множественное число сохранено; местоимение «её» естественно восполняет подразумеваемое дополнение.
- source_word: וַיָּשִׂימוּ עַל
  choice: приложили к
  rationale: В данном лечебном контексте сочетание естественно передаёт помещение инжирной массы на поражённое место, не превращая её прямо в названное текстом лекарственное средство.
- source_word: הַשְּׁחִין
  choice: нарыву
  rationale: שְׁחִין обозначает воспалённое поражение кожи — нарыв, язву или фурункул. «Нарыв» является кратким и понятным соответствием, при сохранении альтернатив в примечании.
- source_word: וַיֶּחִי
  choice: и он выздоровел
  rationale: Буквально глагол означает «жил/ожил», но в контексте болезни выражает восстановление здоровья; «выздоровел» естественно передаёт контекстуальный смысл.
theological_decisions:
- issue: Характер результата, выраженного וַיֶּחִי
  choice: физическое выздоровление
  alternative: «он ожил» или буквально «он жил»
  rationale: Контекст рассказывает о болезни Езекии и лечебном приложении к поражённому месту. Перевод «выздоровел» передаёт здесь обычный контекстуальный смысл חיה, не создавая намёка на воскресение; буквальный образ отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с простым повествовательным синтаксисом. Сохранён конкретный образ инжирной лепёшки; медицинская терминология не сделана излишне специальной. Все лексические альтернативы, необходимые для сохранения смыслового диапазона еврейского текста, вынесены в сноски.
