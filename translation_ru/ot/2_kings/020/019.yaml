base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: ru
  text: 'Тогда Езекия сказал Исайе: «Хорошо слово Яхве, которое ты произнёс». И сказал: «Разве не так, если в мои дни будут мир и стабильность[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мир и истина». Еврейское אֱמֶת может означать «истина», «верность», «надёжность» или, в данном контексте, устойчивую стабильность.'
    reason: Сохраняет традиционный вариант «истина» и указывает на контекстуально возможный смысл выбранного перевода.
lexical_decisions:
- source_word: טוֹב
  choice: благо
  rationale: Передаёт прямую положительную оценку пророческого слова, сохраняя краткость и нравственную неоднозначность ответа Езекии; «благоприятно» чрезмерно истолковывало бы его мотив.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет обычную для пророческого контекста связь между Божьим откровением и речью пророка; личное имя יהוה передано как «Яхве».
- source_word: דִּבַּרְתָּ
  choice: ты произнёс
  rationale: Естественно обозначает уже высказанное Исайей пророчество и сохраняет обращение непосредственно к пророку.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Широкий и обычный эквивалент, включающий отсутствие бедствия, общественное спокойствие и благополучие.
- source_word: אֱמֶת
  choice: устойчивость
  rationale: В данном царском и общественном контексте слово, вероятно, указывает на надёжность и прочность установленного порядка, а не только на отвлечённую истину; буквальная и традиционная альтернатива отмечена в сноске.
- source_word: בְיָמָי
  choice: в мои дни
  rationale: Сохраняет образное временное выражение оригинала и подчёркивает личную перспективу Езекии.
theological_decisions:
- issue: 'Заключительная реплика Езекии синтаксически эллиптична: הֲלוֹא אִם допускает как более буквальное «Не так ли, если…», так и риторический вопрос о мире в его дни.'
  choice: '«И добавил: „Разве не будет мира и устойчивости в мои дни?“»'
  alternative: '«И сказал: „Разве не благо, если в мои дни будут мир и истина?“»'
  rationale: Форма прямой речи сохраняет явное וַיֹּאמֶר («и сказал»), а риторический вопрос естественно передаёт эллипсис по-русски. Перевод не называет эти слова внутренней мыслью и не устраняет нравственное напряжение, связанное с заботой Езекии о собственном времени.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор еврейского «сказал» слегка сглажен словом «добавил», не меняющим того, что вторая фраза произнесена вслух. Имя יהוה передано как «Яхве».
