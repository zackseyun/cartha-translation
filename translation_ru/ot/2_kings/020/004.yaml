base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: ru
  text: 'Исаия ещё не успел выйти из среднего двора[a], как к нему пришло слово Яхве:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среднего города». Здесь выражение традиционно понимают как указание на часть дворцового комплекса — средний двор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: как
  rationale: Повествовательная форма вводит новое событие и вместе с последующей отрицательной формой создаёт временную конструкцию. В современном русском её естественно передаёт оборот «ещё не успел… как…», без архаичного «и было».
- source_word: יְשַׁעְיָהוּ
  choice: Исаия
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: לֹא יָצָא
  choice: ещё не успел выйти
  rationale: 'Передаёт отрицание и временную последовательность: новое откровение пришло прежде, чем Исаия завершил уход.'
- source_word: הָעִיר הַתִּיכֹנָה
  choice: среднего двора
  rationale: Буквально масоретский текст означает «среднего города», однако в дворцовом контексте выражение традиционно понимается как обозначение средней части дворцового двора. Необычное буквальное чтение сохранено в сноске.
- source_word: וּדְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт личное имя Бога, стоящее в еврейском тексте.
- source_word: הָיָה אֵלָיו
  choice: к нему было
  rationale: Традиционная, ясная русская передача формулы получения пророческого откровения; она сохраняет отличие «слова Яхве» от обычной прямой речи.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Двоеточие естественно вводит следующую прямую речь и в современном русском выполняет функцию еврейского «говоря» без тяжеловесности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте употреблено личное имя Бога; форма «Яхве» сохраняет его как имя, не заменяя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной пророческой формулой «к нему было слово Яхве». Конструкция «ещё не успел… как…» естественно передаёт последовательность событий; двоеточие вводит речь следующего стиха.
