base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Прочие дела Езекии, всё его могущество и то, как он устроил водоём[a] и водовод[b] и провёл воду в город[c], — не записано ли это в книге летописей царей Иудеи?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «резервуар»; еврейское слово может обозначать сооружённый бассейн для хранения воды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «канал»; еврейское слово обозначает водоток или сооружённый канал для воды.'
    reason: lexical_alternative
  - marker: c
    text: Вероятно, речь идёт об известных водных сооружениях Езекии в Иерусалиме; ср. 2 Пар. 32:30.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: прочие дела
  rationale: Устойчивая историографическая формула Книг Царей; «дела» естественно обозначает поступки и свершения царя, не сужая значение до отдельных подвигов.
- source_word: גְּבוּרָתוֹ
  choice: его могущество
  rationale: Передаёт абстрактное значение силы и мощи; последующие инженерные сооружения могут пониматься как проявление этого могущества.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: и то, как он устроил
  rationale: Связывает общее упоминание царских свершений с конкретными водными сооружениями; «устроил» естественно для сооружения водоёма и водовода.
- source_word: הַבְּרֵכָה
  choice: водоём
  rationale: Термин обозначает устроенный бассейн или резервуар для воды; «водоём» понятно современному читателю и не уточняет конструкцию сверх текста.
- source_word: הַתְּעָלָה
  choice: водовод
  rationale: Слово обозначает канал для воды; «водовод» ясно передаёт назначение инженерного сооружения.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: и провёл воду в город
  rationale: Направительный суффикс указывает движение внутрь города; глагол «провёл» естественно описывает доставку воды посредством сооружённого канала.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: не записано ли это
  rationale: Сохраняет риторический вопрос заключительной формулы; русское единственное число согласуется с обобщающим местоимением «это».
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Книга летописей царей Иудеи
  rationale: Передаёт название царского письменного источника и не отождествляет его без основания с каноническими книгами Паралипоменон.
