  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: ru
  text: Я прибавлю к твоей жизни пятнадцать лет и избавлю тебя и этот город от власти царя Ассирии[a]. Я защищу этот город[b] ради Меня и ради Давида, Моего слуги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из руки царя Ассирии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я буду охранять этот город».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: Я прибавлю к твоей жизни пятнадцать лет
  rationale: Еврейское выражение буквально означает «прибавлю к твоим дням». По-русски «к твоей жизни» естественно передаёт смысл идиомы, не меняя обещанного срока.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: от власти царя Ассирии
  rationale: Слово כַּף («ладонь, рука») здесь метонимически обозначает власть или контроль. Смысловая передача звучит естественно в современном русском; буквальный образ отмечен в сноске.
- source_word: אַצִּילְךָ
  choice: избавлю тебя
  rationale: Каузативная форма נצל означает вырвать из опасности, спасти или избавить; «избавлю» хорошо сочетается с оборотом «от власти».
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: Я буду защищать этот город
  rationale: Глагол גנן означает защищать, ограждать, укрывать. «Защищать» соответствует военно-политическому контексту и сохраняет оттенок деятельной обороны.
- source_word: לְמַעֲנִי
  choice: ради Себя Самого
  rationale: Оборот прямо указывает на собственное основание Божьего действия; возвратное усиление естественно передаёт этот акцент по-русски.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: и ради Давида, Моего слуги
  rationale: Передаёт названное в тексте основание защиты города, не развивая подразумеваемые заветные связи сверх сказанного.
theological_decisions:
- issue: Основание Божьей защиты Иерусалима
  choice: ради Себя Самого и ради Давида, Моего слуги
  alternative: ради Меня и ради Моего раба Давида
  rationale: Перевод сохраняет два прямо названных основания Божьего действия и не сводит их к одному богословскому объяснению. «Слуга» в современном русском яснее и менее двусмысленно, чем «раб», при этом сохраняет отношение служения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис разделён на два предложения для ясности. Местоимения, относящиеся к Богу, написаны с прописной буквы; архаизмы и конфессионально маркированная терминология не используются.
