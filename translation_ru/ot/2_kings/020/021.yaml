  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: ru
  text: И почил Езекия со своими отцами[a], и вместо него воцарился его сын Манассия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уснул со своими отцами». Это устойчивое древнееврейское выражение, сообщающее о смерти царя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: Глагол שׁכב буквально означает «лечь», но в сочетании «со своими отцами» входит в устойчивую царскую формулу смерти. «Почил» сохраняет образ покоя и естественно звучит в русском библейском повествовании, не сводя выражение к пояснительному «умер».
- source_word: עִם אֲבֹתָיו
  choice: со своими отцами
  rationale: Формально передаёт устойчивое древнееврейское выражение и сохраняет его патриархальную образность. Более прозрачное для современного читателя значение пояснено в сноске.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия מלך обозначает вступление на престол. «Воцарился» точно и кратко передаёт начало царствования.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: בְנוֹ
  choice: его сын
  rationale: Прямо передаёт указание на родство и сохраняет его явное присутствие в формуле престолонаследия.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте царского престолонаследия תַּחְתָּיו означает занятие положения предшественника. «Вместо него» естественно выражает эту смену власти.
