base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: ru
  text: 'Исаия сказал: «Вот знак для тебя от Яхве, что Яхве исполнит то, что сказал: пойдёт ли тень вперёд на десять ступеней[a] или вернётся на десять ступеней?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на десять делений». Еврейское слово буквально означает «ступени» или «подъёмы»; в этом контексте его традиционно также понимают как деления устройства, связанного с Ахазом, по которому двигалась тень.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: знамение
  rationale: В данном контексте אוֹת обозначает чудесный подтверждающий знак; «знамение» естественно для библейского повествования и сохраняет религиозный оттенок слова.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Предлог указывает на источник знамения, а личное имя יְהוָה передано как «Яхве».
- source_word: כִּי
  choice: что
  rationale: 'Здесь союз вводит содержание знамения: оно подтверждает, что Яхве исполнит сказанное.'
- source_word: יַעֲשֶׂה יְהוָה אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: Яхве исполнит сказанное им
  rationale: Глагол «исполнит» естественно передаёт осуществление обещанного, а «сказанное им» сохраняет отсылку к предшествующим словам Яхве без тяжеловесного буквального оборота.
- source_word: הָלַךְ הַצֵּל
  choice: пройти ли тени вперёд
  rationale: Хотя הָלַךְ формально имеет форму перфекта, в вопросе о выборе знамения он описывает возможное движение тени; инфинитивная вопросительная конструкция естественна по-русски.
- source_word: מַעֲלוֹת
  choice: ступеней
  rationale: Слово буквально означает «ступени» или «подъёмы» и, вероятно, относится к устройству или ступеням Ахаза; перевод не навязывает позднейшее понимание как угловых градусов.
- source_word: אִם
  choice: или
  rationale: В разделительном вопросе אִם вводит вторую из двух возможностей.
- source_word: יָשׁוּב
  choice: вернуться
  rationale: שׁוּב означает возвращение или обратное движение и здесь противопоставлено движению тени вперёд.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте дважды употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Отношение знамения к обещанию Яхве
  choice: «что Яхве исполнит сказанное им» как содержание и подтверждение знамения
  alternative: «потому что Яхве исполнит сказанное им» как причинное придаточное
  rationale: כִּי допускает причинный оттенок, но в контексте наиболее естественно вводит то, что должно быть подтверждено знамением; формулировка не уточняет сверх текста механизм этого подтверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Сохранена краткая прямая речь и разделительный вопрос; маркер сноски поставлен непосредственно после спорного слова «ступеней».
