base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: ru
  text: «Яхве, прошу Тебя, вспомни, как я ходил перед Тобой в верности[a] и от всего сердца[b] и делал то, что было угодно Тебе». И Езекия горько заплакал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в истине». Еврейское слово может означать как истинность, так и верность; здесь оно характеризует поведение Езекии перед Богом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с цельным», «полным» сердцем; также возможно: «с неразделённым сердцем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה
  choice: О
  rationale: Частица выражает настойчивую, взволнованную мольбу; русское «О» естественно вводит молитвенное обращение, а просительный оттенок дополнительно передан словом «прошу» при נָא.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: זְכָר נָא
  choice: вспомни, прошу
  rationale: Императив с частицей просьбы передан естественной русской формой настойчивого прошения.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: я ходил пред Тобою
  rationale: Сохранена библейская метафора образа жизни в Божьем присутствии; «пред Тобою» соответствует возвышенному молитвенному регистру.
- source_word: בֶּאֱמֶת
  choice: верно
  rationale: В данном контексте слово описывает верность и честность поведения; наречие естественно связано с выражением «ходил пред Тобою», при этом альтернативный оттенок истины отмечен в сноске.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: с преданным сердцем
  rationale: Передаёт целостность и неразделённость верности без намёка на безгрешное совершенство.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: и делал угодное Тебе
  rationale: Естественный русский эквивалент буквального «делал доброе в Твоих глазах», сохраняющий Бога как мерило оценки.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: И Езекия горько заплакал
  rationale: Сочетание глагола с усилительным существительным означает сильный плач; «горько заплакал» естественно передаёт интенсивность по-русски.
- source_word: חִזְקִיָּהוּ
  choice: Езекия
  rationale: Традиционная и общепонятная русская форма имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Сохраняется личное имя Бога, прямо употреблённое в еврейском тексте, без замены титулом.
- issue: Смысл שָׁלֵם в самоописании Езекии
  choice: с преданным сердцем
  alternative: со всем сердцем; с неразделённым сердцем; с совершенным сердцем
  rationale: Формулировка выражает цельность и неразделённую преданность, не превращая слова Езекии в утверждение о безгрешном совершенстве.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Метафора «ходил пред Тобою» сохранена как понятный библейский образ; архаические формы и тяжеловесный буквализм избегаются.
