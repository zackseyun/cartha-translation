  source_fidelity: 'Основной смысл передан верно: молитвенная просьба, хождение перед Богом, верность, цельность сердца, угодное Богу поведение и усиленное описание плача сохранены. Однако «с преданным сердцем» сужает שָׁלֵם до преданности и не вполне передаёт полноту/неразделённость сердца; «от всего сердца» точнее передаёт эту характеристику без смысла безгрешного совершенства. «Горько заплакал» — естественный русский способ передать интенсивный плач; хотя גָּדוֹל буквально указывает на величину/силу, в данном контексте это безопасный идиоматический эквивалент.'
