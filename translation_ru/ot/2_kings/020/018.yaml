  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: ru
  text: И некоторых из твоих сыновей, которые произойдут от тебя, которых ты породишь, заберут, и они станут евнухами[a] во дворце вавилонского царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придворными», «дворцовыми служащими». Еврейское слово может обозначать как евнухов в буквальном смысле, так и царских чиновников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: И некоторых из твоих сыновей
  rationale: 'Предлог מִן имеет здесь разделительное значение: речь идёт о некоторых из сыновей Езекии. Слово «сыновей» сохраняет конкретность בָּנִים, не заменяя её более широким «потомков».'
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: которые произойдут от тебя
  rationale: Оборот буквально указывает на физическое происхождение от Езекии; «произойдут от тебя» естественно передаёт родословный смысл и сохраняет образ исхода от него.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: которых ты породишь
  rationale: Каузативная форма ילד при обращении к мужчине выражает отцовство. «Породишь» сохраняет этот смысл и намеренный повтор, присутствующий в еврейском тексте.
- source_word: יקח
  choice: заберут
  rationale: Формально глагол стоит в единственном числе, но субъект не назван и имеет неопределённо-личное значение. Русская неопределённо-личная форма естественно передаёт действие без добавления отсутствующего субъекта.
- source_word: וְהָיוּ
  choice: и они станут
  rationale: С именной частью сказуемого היה может означать как состояние, так и переход в новое состояние. В контексте увода во дворец «станут» передаёт результирующий статус.
- source_word: סָרִיסִים
  choice: евнухами
  rationale: Основное значение слова — «евнухи»; в контексте пленённых царских сыновей буквальное понимание правдоподобно. Возможное значение придворных чиновников сохранено в сноске.
- source_word: בְּהֵיכַל
  choice: во дворце
  rationale: הֵיכָל может обозначать храм или дворец, но упоминание вавилонского царя однозначно указывает здесь на царский дворец.
- source_word: מֶלֶךְ בָּבֶל
  choice: вавилонского царя
  rationale: Естественная русская передача еврейской сопряжённой конструкции со значением «царь Вавилона».
theological_decisions:
- issue: Значение סָרִיסִים при царском дворе
  choice: буквальное «евнухи» в основном тексте
  alternative: «придворные» или «дворцовые служащие»
  rationale: Слово может обозначать как евнухов в буквальном смысле, так и царских чиновников. Буквальный смысл лексически первичен и соответствует суровости пророчества, однако контекст не устраняет полностью должностное значение, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксический повтор двух определительных оборотов сохранён, поскольку он присутствует в еврейском тексте и подчёркивает происхождение царских сыновей. Маркер сноски поставлен непосредственно после спорного слова «евнухами».
