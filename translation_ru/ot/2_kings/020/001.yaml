base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: ru
  text: 'В те дни Езекия тяжело заболел и был при смерти. Пророк Исаия, сын Амоса, пришёл к нему и сказал: «Так говорит Яхве: распорядись о своём доме, потому что ты умираешь[a] и не будешь жить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «потому что ты мёртв». В данном обороте еврейская форма возвещает несомненную и близкую смерть; возможные переводы: «ты умираешь» или «ты умрёшь».'
    reason: Сохраняет необычную форму и смысловой диапазон еврейского выражения כִּי מֵת אַתָּה.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественная и близкая к форме исходного текста передача стандартного временного оборота.
- source_word: חָלָה ... לָמוּת
  choice: тяжело заболел и был при смерти
  rationale: Передаёт как наступление болезни, так и её смертельную тяжесть; по-русски звучит ясно и естественно.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: Пророк Исаия, сын Амоса
  rationale: Сохраняет имя, отчество и титул, располагая их в естественном для современного русского языка порядке.
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохраняет традиционную пророческую формулу и передаёт тетраграмматон личным именем.
- source_word: צַו לְבֵיתֶךָ
  choice: распорядись о своём доме
  rationale: 'Сохраняет широкое значение повеления: дать необходимые указания домашним и устроить семейные дела перед смертью.'
- source_word: כִּי מֵת אַתָּה
  choice: потому что ты умираешь
  rationale: Передаёт предикативную форму מֵת как объявление несомненной и близкой смерти, не изображая смерть уже совершившимся фактом.
- source_word: וְלֹא תִחְיֶה
  choice: и не будешь жить
  rationale: Прямая передача отрицания дальнейшей жизни без сужения смысла до одного лишь выздоровления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Соотношение объявления смерти и последующего исцеления Езекии
  choice: ты умираешь
  alternative: ты умрёшь
  rationale: 'Такая передача сохраняет напряжение повествования: пророческое слово объявляет реальную, неминуемую при текущем положении смерть, не превращая стих в отвлечённое утверждение о далёком будущем.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз в начале второго еврейского предложения не воспроизведён механически, чтобы избежать неестественного русского синтаксиса. Формула «распорядись о своём доме» намеренно сохраняет образ дома и допускает как распоряжения семье, так и устройство домашних дел.
