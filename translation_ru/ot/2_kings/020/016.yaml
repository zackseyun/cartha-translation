  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/016.yaml
  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: ru
  text: 'Тогда Исаия сказал Езекии: «Выслушай слово Яхве[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: Указывает написание Божественного имени в еврейском тексте и традиционный вариант его передачи.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему речевому действию.
- source_word: יְשַׁעְיָהוּ
  choice: Исаия
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: אֶל חִזְקִיָּהוּ
  choice: Езекии
  rationale: Предлог אֶל обозначает адресата речи; дательный падеж естественно передаёт эту функцию по-русски. «Езекия» — устоявшаяся русская форма имени.
- source_word: שְׁמַע
  choice: Выслушай
  rationale: Императив שמע здесь вводит пророческое возвещение. «Выслушай» ясно выражает призыв внимательно принять последующее слово и звучит естественнее, чем буквальное «услышь».
- source_word: דְּבַר
  choice: слово
  rationale: В пророческой формуле דָּבָר означает возвещённое Богом слово или послание; «слово» сохраняет устойчивый библейский образ и вес откровения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон. «Яхве» передаёт личное имя, не заменяя его титулом; традиционный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства пророческой речи. Двоеточие естественно вводит прямую речь, а точка внутри кавычек отражает завершённость повелительного предложения.
