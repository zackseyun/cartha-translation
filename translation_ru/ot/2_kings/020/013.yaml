base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: ru
  text: 'Езекия выслушал их[a] и показал им всю свою сокровищницу[b]: серебро, золото, благовония, отборное масло, оружейную палату[c] и всё, что находилось в его хранилищах. Не было ничего ни в его доме, ни во всей его державе[d], чего Езекия не показал бы им.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «услышал их» или «благосклонно принял их». Еврейский оборот может означать, что Езекия дал им аудиенцию и отнёсся к их словам благосклонно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хранилище своих драгоценностей».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «хранилище снаряжения»; буквально: «дом своих принадлежностей (орудий)». В данном царском контексте речь, вероятно, идёт об оружии и военном снаряжении.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «во всей области своей власти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: выслушал их
  rationale: Оборот שׁמע על здесь обозначает не просто физическое восприятие речи, а то, что Езекия дал посланникам аудиенцию и отнёсся к их словам со вниманием. «Выслушал их» естественно передаёт основной смысл, а возможный благожелательный оттенок отмечен в сноске.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: показал им
  rationale: Порода хифиль глагола ראה обычно имеет каузативное значение «показать»; одинаковый перевод сохраняет повтор глагола в стихе.
- source_word: בֵּית נְכֹתֹה
  choice: всю свою сокровищницу
  rationale: Сочетание обозначает помещение, где хранились драгоценности и ценные товары. «Сокровищница» кратко и естественно вводит последующее перечисление.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: серебро, золото
  rationale: В данном перечне речь идёт о драгоценных металлах, а не о деньгах в узком современном смысле.
- source_word: הַבְּשָׂמִים
  choice: благовония
  rationale: Слово обозначает ценные ароматические вещества; «благовония» шире и уместнее в контексте царской сокровищницы, чем более узкое «пряности».
- source_word: שֶׁמֶן הַטּוֹב
  choice: драгоценное масло
  rationale: Буквально «хорошее масло»; в перечне царских ценностей прилагательное указывает на высокое качество и ценность, не уточняя назначение масла.
- source_word: בֵּית כֵּלָיו
  choice: оружейную палату
  rationale: В царском контексте כֵּלִים может обозначать оружие и военное снаряжение. Традиционно-контекстуальное понимание передано в тексте, а более буквальная широта выражения сохранена в сноске.
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: всё, что находилось в его хранилищах
  rationale: אֹצָר допускает значения «сокровищница» и «хранилище». Здесь «хранилища» избегает неясного повтора после בֵּית נְכֹתֹה и охватывает все накопленные запасы.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Не было ничего ... чего Езекия не показал бы им
  rationale: Русская конструкция с двойным отрицанием естественно сохраняет эмфатическую всеохватность еврейского выражения.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: Сохранено буквальное «дом»; в контексте царя оно может включать дворец и его хозяйство, но перевод не сужает значение до одного дворцового здания.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: во всех его владениях
  rationale: מֶמְשָׁלָה обозначает область власти или управления. «Владения» естественно выражает территориальную широту, не подменяя слово более узким «царство».
