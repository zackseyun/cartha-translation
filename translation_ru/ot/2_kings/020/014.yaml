source:
  edition: WLC
  text: וַ/יָּבֹא֙ יְשַֽׁעְיָ֣הוּ הַ/נָּבִ֔יא אֶל הַ/מֶּ֖לֶךְ חִזְקִיָּ֑הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו מָ֥ה אָמְר֣וּ הָ/אֲנָשִׁ֣ים הָ/אֵ֗לֶּה וּ/מֵ/אַ֨יִן֙ יָבֹ֣אוּ אֵלֶ֔י/ךָ וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ מֵ/אֶ֧רֶץ רְחוֹקָ֛ה בָּ֖אוּ מִ/בָּבֶֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: ru
  text: 'Тогда пророк Исаия пришёл к царю Езекии и спросил его: «Что говорили эти люди и откуда они пришли[a] к тебе?» Езекия ответил: «Они пришли из далёкой страны[b] — из Вавилона».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и откуда они приходят к тебе?» В еврейском тексте употреблена форма имперфекта, допускающая такую передачу, однако прошедшее время лучше соответствует контексту повествования.'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «из далёкой страны» далее уточняются: «из Вавилона». Так сохраняется акцент Езекии на отдалённости места, откуда прибыли посетители, прежде чем он называет его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Тогда ... пришёл
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт смену и последовательность событий.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: пророк Исаия
  rationale: Принятая русская форма имени и естественный для русского языка порядок определения и имени.
- source_word: אֶל הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: к царю Езекии
  rationale: Естественная русская передача титула и имени с требуемым предложным управлением.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: и спросил его
  rationale: Буквально «и сказал ему», но последующая прямая речь является вопросом; «спросил» точно и естественно передаёт речевое действие.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: Что говорили эти люди
  rationale: Прошедшее время соответствует контексту завершившейся беседы; «люди» в современном русском естественно передаёт אֲנָשִׁים без ненужного изменения смысла.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: и откуда они пришли к тебе
  rationale: В повествовательном контексте имперфект имеет прошедшее значение; явное אֵלֶיךָ сохранено как «к тебе».
- source_word: וַיֹּאמֶר חִזְקִיָּהוּ
  choice: Езекия ответил
  rationale: Буквально «Езекия сказал»; поскольку реплика отвечает на вопрос, «ответил» является естественным контекстуальным эквивалентом.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: из далёкой страны
  rationale: Сохраняет значение географической отдалённости и звучит естественно в современном литературном русском.
- source_word: בָּאוּ מִבָּבֶל
  choice: Они пришли ... из Вавилона
  rationale: Сначала сохранено общее указание на далёкую страну, а затем названо конкретное место происхождения.
