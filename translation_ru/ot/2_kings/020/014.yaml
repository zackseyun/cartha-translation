  register: Современный литературный русский язык; изложение ясное и сдержанно-достоинственное. Синтаксис прямой речи естественен для обычного читателя, при этом сохранены последовательность вопроса и ответа, явное «к тебе» и переход от общего обозначения далёкой страны к конкретному названию Вавилона.
