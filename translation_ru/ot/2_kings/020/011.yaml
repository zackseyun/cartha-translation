  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: ru
  text: И воззвал пророк Исаия к Яхве, и Он вернул тень на десять ступеней назад — по ступеням Ахаза, по которым она спустилась.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на десять делений». Еврейское слово означает «ступени, подъёмы»; возможно, речь идёт о лестнице или ступенчатом устройстве для измерения движения тени, однако точный вид «ступеней Ахаза» неизвестен.'
    reason: Сохраняет лексическую и историческую неоднозначность מַעֲלוֹת и отмечает традиционное понимание, не внося его в основной текст.
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: воззвал
  rationale: Глагол קרא с предлогом אֶל при обращении к Богу обозначает громкий призыв или молитвенное взывание. «Воззвал» сохраняет выразительность исходного глагола, не заменяя его пояснительным «помолился».
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: пророк Исаия
  rationale: Естественный для современного русского порядок слов при сохранении традиционной русской формы имени и титула.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: וַיָּשֶׁב
  choice: Он возвратил ... назад
  rationale: 'Порода хифиль от שוב выражает причинное действие: Бог заставил тень вернуться. Заглавная буква у местоимения проясняет ближайшего подразумеваемого деятеля без добавления имени в текст.'
- source_word: אֶת הַצֵּל
  choice: тень
  rationale: Прямое дополнение при каузативном глаголе; именно движение тени служит знамением.
- source_word: בַּמַּעֲלוֹת ... עֶשֶׂר מַעֲלוֹת
  choice: на десять ступеней ... на ступенях
  rationale: מַעֲלוֹת буквально означает «ступени» или «подъёмы». Перевод сохраняет повтор исходного слова и не вводит предположительную реконструкцию солнечных часов.
- source_word: אֲשֶׁר יָרְדָה
  choice: по которым она спустилась
  rationale: Относительное предложение описывает предшествующее нисходящее движение тени по ступеням; женское местоимение естественно соотносится с русским словом «тень».
- source_word: בְּמַעֲלוֹת אָחָז
  choice: на ступенях Ахаза
  rationale: Буквально передаёт связь сооружения с Ахазом, не уточняя, была ли это лестница или устройство для измерения тени.
- source_word: אֲחֹרַנִּית
  choice: назад
  rationale: Естественно передаёт обратное направление движения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя. «Яхве» сохраняет это различие и является принятой научной передачей наиболее вероятного произношения.
- issue: Характер «ступеней Ахаза»
  choice: ступени Ахаза
  alternative: лестница Ахаза; солнечные часы Ахаза; циферблат Ахаза
  rationale: Еврейский текст называет ступени или подъёмы, но не определяет устройство точнее. Основной текст сохраняет эту историческую неоднозначность.
- issue: Субъект глагола וַיָּשֶׁב
  choice: Он, то есть Яхве
  alternative: безличная или неопределённая конструкция
  rationale: После обращения Исаии к Яхве естественным подразумеваемым субъектом каузативного глагола является Яхве; перевод не добавляет сверх текста описания механизма чуда.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Воззвал» уместно для молитвенного обращения и остаётся понятным; синтаксис следует еврейской последовательности событий. Повтор слова «ступени» намеренно сохранён, хотя по-русски он несколько заметен, поскольку тот же термин повторяется в оригинале.
