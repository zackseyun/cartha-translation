lexical_decisions:
- source_word: וַיֵּלֶךְ אִתָּם
  choice: И он пошёл с ними
  rationale: Последовательная форма глагола продвигает повествование; простая конструкция естественна для русского рассказа и точно передаёт сопровождение.
- source_word: וַיָּבֹאוּ הַיַּרְדֵּנָה
  choice: Они пришли к Иордану
  rationale: Направительный суффикс передаёт движение к Иордану; название без добавления «река» соответствует краткости еврейского текста.
- source_word: וַיִּגְזְרוּ
  choice: стали рубить
  rationale: В контексте заготовки брёвен глагол обозначает рубку; «стали рубить» естественно передаёт переход к следующему действию, не утверждая его завершённости.
- source_word: הָעֵצִים
  choice: деревья
  rationale: Множественное число עֵץ может означать деревья или древесину; здесь речь идёт о рубке растущих деревьев, поэтому «деревья» точнее по контексту.
