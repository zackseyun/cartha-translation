  terminology: «Яхве» последовательно передаёт יהוה. «Слуге» оправдано ближайшим контекстом, а сноска сохраняет лексическую альтернативу «юноше». «Огненные колесницы» точнее отражает еврейскую конструкцию, не уточняя природу видения.
