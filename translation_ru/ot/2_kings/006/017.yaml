base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: ru
  text: 'И помолился Елисей и сказал: «Яхве[a], прошу, открой ему глаза, чтобы он увидел». И Яхве открыл глаза слуге[b], и тот увидел: вот, гора была полна коней и огненных колесниц, окружавших Елисея.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — передача еврейского божественного имени יהוה (ЙХВХ), которое также традиционно передают словом «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «юноше». Еврейское נַעַר может обозначать как юношу, так и слугу или помощника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: помолился
  rationale: Форма хитпаэль от פלל здесь обозначает обращённую к Богу молитву; «помолился» естественно и точно передаёт повествовательный контекст.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: פְּקַח נָא
  choice: прошу, открой
  rationale: פקח означает «открыть» применительно к глазам, а частица נא выражает просьбу; такая формулировка звучит естественно по-русски.
- source_word: וְיִרְאֶה
  choice: чтобы он увидел
  rationale: Передаёт цель просьбы, выраженную префиксальной глагольной формой после повеления.
- source_word: הַנַּעַר
  choice: слуге
  rationale: נער может означать юношу или слугу/помощника; в данном контексте речь идёт о слуге Елисея, уже названном так в ближайшем повествовании.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохраняет указательный и привлекающий внимание характер הנה, подчёркивая внезапность открывшегося зрелища.
- source_word: הָהָר
  choice: гора
  rationale: Стандартное соответствие הר; определённость естественно передаётся контекстом и конструкцией «вся гора».
- source_word: מָלֵא
  choice: была полна
  rationale: Прямо передаёт предикативное прилагательное «полный» и согласуется с русским существительным женского рода.
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: огненных коней и колесниц
  rationale: Естественная русская формулировка образа. Еврейская конструкция буквально говорит о «конях и колесницах огня»; определение «огненных» в русском может восприниматься как относящееся к обоим однородным существительным.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: вокруг Елисея
  rationale: Точно передаёт окружение Елисея небесным воинством без добавочного толкования.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Природа увиденных коней и колесниц
  choice: Описать увиденное без онтологического уточнения
  alternative: Явно назвать их буквальным ангельским войском или чисто символическим видением
  rationale: Текст сообщает, что Бог открыл слуге глаза и тот увидел огненных коней и колесницы, но не объясняет точную природу явления.
- issue: Значение הַנַּעַר
  choice: слуга
  alternative: юноша
  rationale: Контекст указывает на служителя Елисея, однако многозначность еврейского слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; частица «вот» сохраняет живость повествования. Формулировка не уточняет природу видения сверх сказанного в еврейском тексте.
