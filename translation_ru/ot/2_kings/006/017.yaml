  source_fidelity: Нужна небольшая правка. В исходном тексте «вокруг Елисея» относится к коням и колесницам, а не к горе; кроме того, «огонь» грамматически непосредственно определяет колесницы, поэтому не следует без необходимости распространять определение на коней. Добавлено явно выраженное «сказал», соответствующее וַיֹּאמַר.
