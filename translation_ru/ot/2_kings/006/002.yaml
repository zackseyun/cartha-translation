source:
  edition: WLC
  text: נֵֽלְכָה נָּ֣א עַד הַ/יַּרְדֵּ֗ן וְ/נִקְחָ֤ה מִ/שָּׁם֙ אִ֚ישׁ קוֹרָ֣ה אֶחָ֔ת וְ/נַעֲשֶׂה לָּ֥/נוּ שָׁ֛ם מָק֖וֹם לָ/שֶׁ֣בֶת שָׁ֑ם וַ/יֹּ֖אמֶר לֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: ru
  text: '«Позволь нам пойти к Иордану[a]. Пусть каждый возьмёт оттуда по одному бревну, и мы устроим себе там место, где будем жить». Он сказал: «Идите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пойдём же к Иордану».'
    reason: Еврейская форма может пониматься как вежливое побуждение к совместному действию либо, в данном контексте, как просьба разрешить группе пойти.
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: Позволь нам пойти
  rationale: Когортатив первого лица множественного числа с частицей נָא выражает вежливое побуждение или просьбу. В контексте обращения учеников к Елисею эта формулировка естественно передаёт просьбу о согласии, а возможный призыв «Пойдём же» сохранён в сноске.
- source_word: עַד הַיַּרְדֵּן
  choice: к Иордану
  rationale: Предлог עַד здесь обозначает движение до реки. В русском библейском и литературном употреблении название «Иордан» само по себе ясно обозначает реку.
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: Пусть каждый возьмёт оттуда по одному бревну
  rationale: 'Сочетание אִישׁ ... אֶחָת имеет распределительное значение: каждый участник берёт один строительный элемент. «По одному» естественно передаёт эту конструкцию, а «бревно» подходит к заготовке древесины для строительства.'
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: и мы устроим себе там место
  rationale: Глагол עשה имеет широкое значение «делать, устраивать». «Устроим себе место» сохраняет эту широту и не уточняет вид постройки сверх исходного текста.
- source_word: לָשֶׁבֶת שָׁם
  choice: где будем жить
  rationale: В данном контексте ישב означает проживание, а не буквальное сидение. Относительная конструкция звучит по-русски естественно и ясно выражает назначение места.
- source_word: וַיֹּאמֶר לֵכוּ
  choice: 'Он сказал: «Идите»'
  rationale: Краткий императив передаёт прямое разрешение Елисея без добавочного толкования.
theological_decisions: []
