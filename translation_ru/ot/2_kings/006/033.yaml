  terminology: «Яхве» последовательно передаёт тетраграмматон. «Бедствие» соответствует רָעָה в контексте осады, не навязывая значения нравственного зла. «Ждать Яхве» сохраняет возможный буквальный оттенок יחל; альтернативное значение «надеяться на Яхве» корректно и ясно вынесено в сноску.
