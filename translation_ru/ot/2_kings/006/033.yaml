source:
  edition: WLC
  text: עוֹדֶ֨/נּוּ֙ מְדַבֵּ֣ר עִמָּ֔/ם וְ/הִנֵּ֥ה הַ/מַּלְאָ֖ךְ יֹרֵ֣ד אֵלָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּֽה זֹ֤את הָֽ/רָעָה֙ מֵ/אֵ֣ת יְהוָ֔ה מָֽה אוֹחִ֥יל לַ/יהוָ֖ה עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: ru
  text: 'Он ещё говорил с ними, как вдруг к нему спустился посланник и сказал: «Вот, это бедствие — от Яхве. Зачем мне и дальше ждать Яхве?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Зачем мне и дальше надеяться на Яхве?» Еврейский глагол может означать как «ждать», так и «надеяться».'
    reason: Лексическая многозначность глагола יחל.
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Он ещё говорил с ними
  rationale: 'Конструкция с עוֹדֶנּוּ и причастием передаёт продолжающееся действие: речь ещё не была окончена.'
- source_word: וְהִנֵּה
  choice: как вдруг
  rationale: В повествовании הִנֵּה вводит неожиданное событие; русское «как вдруг» естественно передаёт этот эффект.
- source_word: הַמַּלְאָךְ
  choice: посланник
  rationale: По ближайшему контексту речь идёт о царском посланце, а не о небесном ангеле.
- source_word: יֹרֵד אֵלָיו
  choice: к нему спустился
  rationale: Сохраняется значение движения вниз, выраженное глаголом ירד, в естественной русской повествовательной форме.
- source_word: הִנֵּה זֹאת הָרָעָה
  choice: Вот, это бедствие
  rationale: В прямой речи הִנֵּה сохраняет указательно-восклицательную силу, а רָעָה в данном контексте обозначает постигшее город бедствие, а не нравственное зло.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Предлог указывает на источник бедствия; личное имя יְהוָה передано как «Яхве».
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: Зачем мне и дальше ждать Яхве?
  rationale: יחל допускает значения ожидания и надежды. Основной текст сохраняет конкретный оттенок ожидания, а עוֹד передано естественным русским выражением «и дальше»; оттенок надежды отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя.
- issue: Смысл глагола יחל в жалобе говорящего
  choice: ждать Яхве
  alternative: надеяться на Яхве
  rationale: Глагол может обозначать как ожидание, так и надежду. Выбор «ждать» не снимает напряжения жалобы, а возможное значение «надеяться» сохранено в сноске.
- issue: Характер רָעָה, приписываемой Яхве
  choice: бедствие
  alternative: зло
  rationale: Контекст осады и голода указывает на пагубное бедствие. «Бедствие» не создаёт лишнего утверждения о нравственном зле, сохраняя при этом прямое приписывание происходящего Яхве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Повествовательное וְהִנֵּה передано идиоматически («как вдруг»), тогда как הִנֵּה в прямой речи сохранено как «вот» ради риторического акцента.
