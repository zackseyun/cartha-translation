base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: ru
  text: 'Елисей сидел у себя дома, и старейшины сидели с ним. Царь послал впереди себя человека, но прежде чем посланник[a] пришёл к Елисею, тот сказал старейшинам: «Видите, этот сын убийцы послал человека отрубить мне голову? Смотрите: когда посланник придёт, закройте дверь и прижмите его дверью[b]. Разве не слышны за ним шаги его господина?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «посланник» — человек, посланный царём, а не ангел.
    reason: cultural_note
  - marker: b
    text: Еврейское выражение буквально означает «прижмите его дверью»; вероятно, смысл в том, чтобы не дать посланнику войти.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: сидел / сидели
  rationale: Причастия изображают продолжающуюся сцену; русское прошедшее несовершенного вида естественно передаёт этот фон.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: Царь послал человека вперёд
  rationale: Субъект восстанавливается из ближайшего контекста как царь Израиля; «вперёд» передаёт отправку человека перед собственным приходом царя, подтверждаемым концом стиха.
- source_word: הַמַּלְאָךְ
  choice: посланник
  rationale: В повествовании речь идёт о человеке, посланном царём, а не об ангеле; «посланник» сохраняет обычное значение еврейского слова.
- source_word: הֲרְאִיתֶם
  choice: Видите
  rationale: Риторическое обращение к непосредственному восприятию естественно звучит по-русски и сохраняет срочность предупреждения.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: этот сын убийцы
  rationale: Сохранено резкое, презрительное обозначение царя без уточнения подразумеваемой исторической вины.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: отрубить мне голову
  rationale: Буквально выражение означает «удалить мою голову», но в данном контексте это идиома казни через обезглавливание; выбран ясный современный русский эквивалент.
- source_word: רְאוּ
  choice: Смотрите
  rationale: Императив срочно привлекает внимание к последующим действиям.
- source_word: סִגְרוּ הַדֶּלֶת
  choice: закройте дверь
  rationale: Естественная русская формулировка срочного защитного действия.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: удерживайте его у двери
  rationale: Передаёт цель действия — не дать посланнику войти, — не создавая сомнительного образа намеренного раздавливания дверью.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: Разве не слышны за ним шаги его господина?
  rationale: Русская конструкция естественно передаёт риторический вопрос и звук приближающихся шагов; «господин» сохраняет отношение посланника к царю.
theological_decisions:
- issue: Неявный субъект וַיִּשְׁלַח
  choice: Царь послал человека
  alternative: Он послал человека
  rationale: Предыдущий контекст указывает на царя Израиля; явное называние субъекта устраняет неестественную русскую двусмысленность, не добавляя нового участника.
- issue: Характер обозначения «сын убийцы»
  choice: Сохранить буквальное оскорбительное обозначение
  alternative: Передать как «сын того убийцы» или истолковать как прямое обвинение самого царя
  rationale: Текст допускает историческую отсылку к отцу царя и его кровопролитию, но не разъясняет её; перевод не должен молча закреплять одно толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис сделан ясным для обычного читателя; резкость слов Елисея и напряжённость сцены сохранены. Местоименное «тот» однозначно возвращает речь к Елисею, не повторяя имя тяжеловесно.
