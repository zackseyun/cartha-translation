  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: ru
  text: 'И человек Божий послал сказать царю Израиля: «Берегись проходить через это место, потому что там спускаются арамеи[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «там арамеи идут вниз».'
    reason: Причастие נְחִתִּים обозначает движение вниз; возможна передача глагольным выражением «идут вниз».
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал сказать
  rationale: Глагол буквально означает «послал»; из контекста ясно, что человек Божий передал царю предупреждение. Формулировка естественна по-русски и не уточняет способ передачи.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Сохранён устойчивый древнееврейский титул, а не подставлено толкование «пророк».
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: берегись проходить
  rationale: Возвратный императив выражает предостережение, а сочетание с מִן предупреждает против прохождения через указанное место.
- source_word: הַמָּקוֹם הַזֶּה
  choice: это место
  rationale: Прямая и естественная передача указательного словосочетания.
- source_word: אֲרָם
  choice: арамеи
  rationale: Название Арам в военном контексте обозначает арамеев или их войско; этноним точнее традиционного, но анахроничного «сирийцы».
- source_word: נְחִתִּים
  choice: спускаются
  rationale: Причастие передаёт продолжающееся или намечающееся движение вниз; «спускаются» сохраняет пространственное значение исходного слова.
