  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: ru
  text: 'Когда они спустились к нему, Елисей помолился Яхве и сказал: «Прошу, порази этот народ слепотой[a]». И Он поразил их слепотой, по слову Елисея.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ослепляющим замешательством». Еврейское слово может обозначать ниспосланное Богом нарушение зрения и способности верно воспринимать происходящее, не обязательно полную или постоянную слепоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: Когда они спустились к нему
  rationale: Глагол ירד означает «спускаться», а אֶלָיו — «к нему». Контекст допускает враждебное приближение, однако само сочетание не требует добавлять «против него»; русский текст сохраняет пространственное значение и контекстуальную неоднозначность.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: Елисей помолился Яхве
  rationale: התפלל — обычный глагол «молиться»; имя יהוה передано как «Яхве», то есть как личное имя, а не как титул.
- source_word: הַךְ נָא
  choice: Прошу, порази
  rationale: Императив от נכה передан глаголом «порази», а частица נָא — вежливой формой просьбы «прошу».
- source_word: הַגּוֹי הַזֶּה
  choice: этот народ
  rationale: גוי может обозначать как народ или нацию, так и конкретную этническую общность; здесь речь идёт об арамейском войске как представителях народа, поэтому «народ» естественнее русского «нация».
- source_word: בַּסַּנְוֵרִים
  choice: слепотой
  rationale: Редкое слово סַנְוֵרִים обозначает ниспосланное Богом нарушение зрения или восприятия. «Слепотой» — ясный традиционный эквивалент; возможная широта значения отмечена в сноске.
- source_word: וַיַּכֵּם
  choice: И Он поразил их
  rationale: Подразумеваемый субъект — Яхве, ответивший на молитву Елисея. Прописная буква помогает читателю распознать референта местоимения, не добавляя имени повторно.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: по слову Елисея
  rationale: Формулировка сохраняет еврейскую конструкцию и связь между просьбой пророка и последовавшим действием Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» непосредственно передаёт имя и соответствует предоставленному решению, не заменяя его титулом.
- issue: Характер поражения סַנְוֵרִים
  choice: слепота с поясняющей сноской
  alternative: ослепляющее замешательство
  rationale: Контекст последующих действий воинов позволяет понимать состояние не обязательно как полную или постоянную физическую слепоту. Основной текст сохраняет устойчивый эквивалент, а сноска — смысловую напряжённость.
- issue: Фраза «по слову Елисея»
  choice: сохранить буквальную связь
  alternative: как просил Елисей
  rationale: כִּדְבַר может указывать на соответствие слову или просьбе Елисея. Формальный оборот не уточняет сверх исходника механизм пророческого слова и Божьего ответа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным, при этом сохранены повтор «порази — поразил» и выражение «по слову Елисея».
