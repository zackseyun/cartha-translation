base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: ru
  text: 'Тогда царь Израиля, увидев их, сказал Елисею: «Убить мне их? Убить[a], отец мой[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте две формы одного и того же глагола стоят рядом, усиливая вопрос.
    reason: lexical_alternative
  - marker: b
    text: «Отец мой» — почтительное обращение царя к Елисею, а не указание на родство.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямое соответствие еврейскому сопряжённому сочетанию; определённость ясна из контекста.
- source_word: אֶל אֱלִישָׁע
  choice: сказал Елисею
  rationale: Предлог אֶל обозначает адресата речи. Слово «пророк» не добавлено, поскольку его нет в исходном тексте.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: увидев их
  rationale: Инфинитивная конструкция выражает время сопутствующего действия; её субъектом по контексту является царь. Деепричастный оборот кратко и естественно передаёт смысл «когда он увидел их».
- source_word: הַאַכֶּה אַכֶּה
  choice: Мне убить их? Убить?
  rationale: Сочетание инфинитива абсолютного с личной формой того же глагола усиливает вопрос. Повтор в русском сохраняет эмфатическую форму оригинала, а «убить» передаёт подразумеваемый в военном контексте смертельный удар.
- source_word: אָבִי
  choice: отец мой
  rationale: Буквально сохранено почтительное обращение к Елисею; перестановка слов соответствует естественному и достойному русскому обращению.
theological_decisions:
- issue: Почтительное обращение к Елисею
  choice: Передать אָבִי буквально как «отец мой», понимая это как выражение почтения к пророческому наставнику.
  alternative: Передать толковательно как «господин мой» или «учитель».
  rationale: Исходный текст использует семейное обозначение, хотя речь не о биологическом родстве. Буквальный перевод сохраняет образность и характер отношений, не сводя их к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Краткое повторение «убить» намеренно сохраняет напряжённую настойчивость еврейской конструкции; обращение «отец мой» оставлено без конфессионального истолкования.
