  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: ru
  text: 'Тогда человек Божий спросил: «Где он упал?» Тот показал ему место. Затем человек Божий срезал кусок дерева, бросил его туда — и железо всплыло.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «железо». По контексту речь идёт о железном наконечнике топора, упомянутом в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Прямо передаёт устойчивый древнееврейский титул пророка, не заменяя его пояснительным «пророк Божий».
- source_word: אָנָה נָפָל
  choice: Куда он упал?
  rationale: אָנָה обозначает направление («куда»), а форма мужского рода נָפָל допускает естественное русское местоимение «он», соотносимое в контексте с железным наконечником топора.
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: Тот показал ему место
  rationale: Каузативная форма ראה означает «показал». «Тот» ясно обозначает человека, потерявшего топор, и устраняет двусмысленность двух местоимений мужского рода в русском.
- source_word: וַיִּקְצָב עֵץ
  choice: отрубил ветку
  rationale: קצב означает отсечь или отрубить, а עֵץ здесь обозначает отдельный кусок дерева; «ветка» конкретна и естественна по-русски, хотя буквально возможно более широкое «кусок дерева».
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: бросил её туда
  rationale: Сохраняет действие и указание на место; местоимение согласовано с «веткой».
- source_word: וַיָּצֶף הַבַּרְזֶל
  choice: железо всплыло
  rationale: Сохраняет буквальное «железо» и передаёт צוף как выход/удержание на поверхности без натуралистического объяснения чуда.
theological_decisions:
- issue: Чудесный характер события
  choice: «железо всплыло»
  alternative: «железный наконечник поднялся на поверхность»
  rationale: Текст прямо сообщает необычное событие. Перевод не объясняет его естественными причинами и не добавляет деталей, которых нет в еврейском тексте.
- issue: Обозначение утраченного предмета
  choice: В основном тексте сохранено буквальное «железо», а контекст разъяснён в сноске
  alternative: «железный наконечник топора» в основном тексте
  rationale: Так сохраняется лаконичная формулировка оригинала и одновременно обеспечивается понятность для современного читателя.
translation_notes:
  register: Современный литературный русский язык, простой и достойный повествовательный стиль. Последовательность еврейских глаголов сохранена отдельными предложениями и ясной сменой действующего лица; тире перед последним событием естественно подчёркивает результат, не добавляя его истолкования.
