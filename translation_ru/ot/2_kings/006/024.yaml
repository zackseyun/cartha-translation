  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יִּקְבֹּ֛ץ בֶּן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם אֶת כָּל מַחֲנֵ֑/הוּ וַ/יַּ֕עַל וַ/יָּ֖צַר עַל שֹׁמְרֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: ru
  text: После этого Бен-Хадад, царь Арама[a], собрал всё своё войско[b], выступил и осадил Самарию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Сирии»; в еврейском тексте — «Арама».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «все свои силы»; еврейское слово может означать «стан», «лагерь» или «войско».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт последовательность повествования; буквальное «и было после этого» в современном русском звучит неоправданно архаично.
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Прямо передаёт значение глагола «собирать, созывать» и не добавляет специального военного оттенка, хотя контекст является военным.
- source_word: בֶּן הֲדַד
  choice: Бен-Хадад
  rationale: Транслитерация еврейского имени сохраняет его форму и соответствует современному принципу передачи древних имён.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Передаёт непосредственно еврейское географическое название אֲרָם, не заменяя его традиционным, но менее точным обозначением «Сирия».
- source_word: כָּל מַחֲנֵהוּ
  choice: всё своё войско
  rationale: В военном контексте מַחֲנֶה обозначает не только стан или лагерь, но и расположенное в нём войско; «войско» ясно и естественно по-русски.
- source_word: וַיַּעַל
  choice: выступил
  rationale: В данном военном контексте естественно передаёт движение царя с войском к Самарии, не навязывая буквальное «поднялся», которое по-русски может быть понято неверно.
- source_word: וַיָּצַר עַל
  choice: осадил
  rationale: Точно и кратко передаёт устойчивое значение глагола с предлогом עַל — «осаждать, держать в осаде».
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Устоявшаяся русская форма названия города.
