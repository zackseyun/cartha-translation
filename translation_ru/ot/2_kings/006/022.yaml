base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: ru
  text: 'Но он сказал: «Не убивай их. Разве ты стал бы убивать тех, кого взял в плен своим мечом и своим луком?[a] Поставь перед ними хлеб и воду[b], чтобы они поели, попили и пошли к своим господам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве ты убиваешь тех, кого взял в плен своим мечом и своим луком?» Еврейская фраза — риторический вопрос, усиливающий запрет убивать их.'
    reason: alternative_reading
  - marker: b
    text: «Хлеб и вода» могут означать необходимые припасы вообще, однако в еврейском тексте прямо названы хлеб и вода.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: убивай / убиваешь
  rationale: 'В данном контексте נכה обозначает нанесение смертельного удара: царь спрашивает, следует ли умертвить окружённых арамеев. «Убивать» ясно передаёт вероятный смысл без архаизма.'
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: тех, кого взял в плен
  rationale: Глагол שבה имеет конкретный военный смысл «брать в плен», существенный для логики риторического вопроса.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: своим мечом и своим луком
  rationale: 'Сохранены оба названных оружия: вопрос подчёркивает, что царь не захватил этих людей обычной военной силой.'
- source_word: לֶחֶם וָמַיִם
  choice: хлеб и воду
  rationale: Перевод сохраняет конкретные слова еврейского текста, хотя сочетание может шире обозначать необходимые припасы.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: пусть они едят и пьют, а потом идут
  rationale: Разрешительно-целевой оттенок последовательности естественно передан конструкцией с «пусть»; «а потом» ясно выражает порядок действий.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: к своему господину
  rationale: Форма אֲדֹנֵיהֶם допускает морфологически множественную форму основания, однако в контексте войска арамеев естественен собирательно-сингулярный референт — их верховный правитель; русский единственный родительный после «своему» сохраняет это чтение.
theological_decisions:
- issue: Сила риторического вопроса Елисея
  choice: Вопрос усиливает запрет убивать пленных, которых царь не захватил собственным оружием.
  alternative: Понимать фразу как прямое утверждение либо как вопрос только об обычной практике обращения с военнопленными.
  rationale: Вопросительная частица הֲ и непосредственный запрет естественно образуют риторический вопрос. Перевод не превращает его в универсальное правовое положение, выходящее за пределы повествования.
translation_notes:
  register: Современный литературный русский язык с краткой, властной речью Елисея. «Не убивай» передаёт смертельный смысл контекстуальнее, чем буквальное, но двусмысленное «не поражай». Местоимение «своему» соотносится со всей группой пленных и не означает, что у каждого отдельный господин.
