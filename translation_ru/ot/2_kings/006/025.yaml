base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: ru
  text: И был в Самарии сильный голод; и вот, её осаждали, так что ослиная голова стоила восемьдесят единиц серебра, а четверть кава голубиного помёта[a] стоила пять единиц серебра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые понимают это выражение буквально, как голубиный помёт; другие считают, что это название дешёвого пищевого продукта или растения, продававшегося во время голода.
    reason: Сохраняет буквальное значение חרי יונים и отмечает спорное предметное толкование без выдачи стилистического синонима за отдельный перевод.
lexical_decisions:
- source_word: וַיְהִי
  choice: И был
  rationale: Передаёт повествовательное введение нового обстоятельства кратко и естественно для библейского повествования на русском языке.
- source_word: רָעָב גָּדוֹל
  choice: сильный голод
  rationale: В данном сочетании גָּדוֹל указывает на тяжесть голода; «сильный голод» звучит естественнее современного русского «великий голод».
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог ב обозначает место; Самария здесь — осаждённый город.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательно-эмфатическую функцию הִנֵּה без архаичного «се».
- source_word: צָרִים עָלֶיהָ
  choice: её осаждали
  rationale: Причастная форма выражает продолжавшуюся осаду; неопределённое множественное число исходного текста сохранено без добавления названия осаждавших.
- source_word: עַד הֱיוֹת
  choice: так что … стоила
  rationale: Передаёт достигнутую вследствие осады крайнюю степень дороговизны естественной русской результативной конструкцией.
- source_word: רֹאשׁ חֲמוֹר
  choice: ослиная голова
  rationale: Точно и естественно сохраняет шокирующий образ крайне скудной пищи во время голода.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: восемьдесят серебряников
  rationale: Исходный текст буквально называет число и серебро, не указывая явно единицу; «серебряники» передают отдельные денежные единицы, не добавляя прямо «шекели».
- source_word: רֹבַע הַקַּב
  choice: четверть кава
  rationale: Сохраняет древнюю меру объёма и точно передаёт רֹבַע как одну четверть.
- source_word: חרי יונים
  choice: голубиного помёта
  rationale: Это прямое лексическое значение спорного выражения; иные толкования вынесены в примечание, чтобы не устранять подлинную неопределённость.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: пять серебряников
  rationale: Параллельно первой цене передаёт сумму без явного добавления отсутствующей в тексте единицы измерения.
