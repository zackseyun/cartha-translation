  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: ru
  text: 'Он сказал: «Не бойся, потому что тех, кто с нами, больше, чем тех, кто с ними».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Последовательная форма с וַ продвигает повествование; в современном русском начальное «и» можно опустить без утраты связи.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Сочетание אַל с глагольной формой выражает запрет; это естественная и точная русская передача обращения к одному мужчине.
- source_word: כִּי
  choice: потому что
  rationale: Частица вводит основание призыва не бояться; «потому что» ясно передаёт причинную связь.
- source_word: רַבִּים אֲשֶׁר אִתָּנוּ
  choice: тех, кто с нами, больше
  rationale: Рַבִּים в конструкции сравнения имеет значение «больше»; относительный оборот передан естественно по-русски.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: чем тех, кто с ними
  rationale: מִן вводит второй член сравнения. Хотя в заключительной части предлог «с» выражен эллиптически, его восстановление сохраняет очевидный параллелизм с «кто с нами».
theological_decisions:
- issue: Кто именно находится «с нами»
  choice: Оставлено без уточнения, как в еврейском тексте.
  alternative: Назвать их небесным воинством или ангелами на основании следующего стиха.
  rationale: Сам стих не определяет их прямо; контекст раскрывает это далее. Перевод сохраняет сдержанность и напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и сохраняет торжественную простоту повествования. Сравнительная конструкция передана явно, без излишне буквального «много тех… более тех».
