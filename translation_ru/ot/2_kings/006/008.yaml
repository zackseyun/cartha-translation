  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: ru
  text: 'Царь Арама вёл войну против Израиля и посоветовался со своими слугами, сказав: «В таком-то месте будет мой лагерь».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «В таком-то месте — мой лагерь». В еврейском тексте употреблена идиома, обозначающая намеренно не названное место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Царь Арама
  rationale: אֲרָם передано как историческое название «Арам», без замены на традиционное «Сирия». Начальный ו не требует отдельного союза в русском начале эпизода.
- source_word: הָיָה נִלְחָם
  choice: вёл войну
  rationale: Сочетание היה с причастием обозначает продолжавшееся или повторявшееся действие в прошлом; «вёл войну» естественно передаёт этот длительный характер.
- source_word: בְּיִשְׂרָאֵל
  choice: против Израиля
  rationale: При נלחם предлог ב обозначает противника; «против» недвусмысленно выражает враждебное действие.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: Он советовался со своими слугами
  rationale: Глагол означает совещаться или советоваться. «Слуги» сохраняет широкое значение עֲבָדִים, не сужая его до военачальников или придворных.
- source_word: לֵאמֹר
  choice: и говорил
  rationale: Обычная формула введения прямой речи передана естественной русской конструкцией; несовершенный вид согласуется с контекстом военных совещаний.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: в таком-то месте
  rationale: Парное выражение פלני אלמני — идиома, обозначающая намеренно не названное место; русский оборот «в таком-то месте» передаёт ту же неопределённость.
- source_word: תַּחֲנֹתִי
  choice: Мой лагерь будет
  rationale: Форма понимается как существительное «мой лагерь, моя стоянка». Будущее «будет» естественно выражает планируемое расположение войска, подразумеваемое краткой еврейской именной фразой.
