base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: ru
  text: 'И сказал он: «Пойдите и узнайте, где он, чтобы я послал за ним и схватил его».[a] Ему донесли: «Вот, он в Дофане».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и я пошлю, и возьму его». В еврейском тексте при «пошлю» не названо, кого именно пошлют; в данном контексте эта последовательность, вероятно, выражает цель: «чтобы я послал за ним и схватил его».'
    reason: lexical_alternative
  - marker: b
    text: Дофан — город к северу от Самарии; он также упоминается в повествовании об Иосифе (Быт. 37:17).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Стандартная повествовательная форма wayyiqtol; сохраняет последовательность еврейского рассказа без добавления временного оттенка.
- source_word: לְכוּ וּרְאוּ
  choice: Пойдите и узнайте
  rationale: Буквально «пойдите и посмотрите»; в данном контексте ראה обозначает выяснение местонахождения, поэтому «узнайте» естественно передаёт прагматический смысл.
- source_word: אֵיכֹה הוּא
  choice: где он
  rationale: Прямое и естественное соответствие вопросительному наречию места с местоимением.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: чтобы мне послать людей и схватить его
  rationale: Последовательность после повелений вероятнее всего выражает цель. Дополнение «людей» подразумевается глаголом «послать» в контексте и необходимо для ясного русского синтаксиса; לקח здесь означает насильственное задержание.
- source_word: וַיֻּגַּד לוֹ
  choice: Ему донесли
  rationale: Кратко и естественно передаёт пассивную форму Hophal и официальный характер сообщения.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Еврейский вводный инфинитив «говоря» в современном русском естественно передаётся пунктуационным введением прямой речи.
- source_word: הִנֵּה
  choice: не выражено отдельным словом
  rationale: Частица привлекает внимание к сообщаемому факту; в кратком русском донесении её функция достаточно передаётся самой прямой речью. Буквальное «вот» здесь звучало бы менее естественно.
- source_word: בְדֹתָן
  choice: в Дофане
  rationale: Традиционная русская библейская форма топонима с локативным предлогом.
