base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: ru
  text: 'И мы сварили моего сына и съели его[a]. На другой день я сказала ей: «Отдай своего сына, чтобы мы съели его[b]», но она спрятала своего сына.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приготовили моего сына и съели его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и мы съедим его»; еврейскую форму можно понимать как простое будущее время, хотя после повеления «отдай своего сына» контекст допускает значение цели или результата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: мы сварили
  rationale: В данном контексте בשׁל обозначает варку или приготовление пищи; «сварили» конкретно и прямо передаёт ужас описываемого события.
- source_word: בְּנִי
  choice: моего сына
  rationale: Существительное בן буквально означает «сын», а суффикс первого лица выражает принадлежность говорящей.
- source_word: וַנֹּאכְלֵהוּ
  choice: и съели его
  rationale: אכל имеет обычное значение «есть»; местоименный объект «его» явно выражен в еврейском тексте.
- source_word: וָאֹמַר אֵלֶיהָ
  choice: я сказала ей
  rationale: Форма продвигает повествование; женский род в русском определяется тем, что говорит женщина.
- source_word: בַּיּוֹם הָאַחֵר
  choice: на другой день
  rationale: Устойчивое современное русское выражение для следующего дня, сохраняющее временную последовательность.
- source_word: תְּנִי
  choice: отдай
  rationale: Императив נתן буквально значит «дай»; в этой ситуации «отдай» естественно передаёт требование передать сына, не смягчая его прямоты.
- source_word: בְּנֵךְ
  choice: своего сына
  rationale: בן означает именно «сын»; возвратное «своего» естественно в русском при обращении к матери.
- source_word: וְנֹאכְלֶנּוּ
  choice: чтобы мы съели его
  rationale: Имперфект с союзом после повеления может выражать цель или предполагаемый результат; конструкция «чтобы мы съели» естественно передаёт это значение.
- source_word: וַתַּחְבִּא
  choice: но она спрятала
  rationale: Хотя waw буквально может передаваться союзом «и», контекст ясно задаёт противопоставление ожидаемому исполнению требования.
- source_word: בְּנָהּ
  choice: своего сына
  rationale: בן с суффиксом третьего лица женского рода означает «её сын»; после подлежащего «она» русское «своего» устраняет стилистическую тяжеловесность.
