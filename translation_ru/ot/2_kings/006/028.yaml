base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: ru
  text: 'И царь спросил её: «Что с тобой?» Она ответила: «Вот эта женщина сказала мне: „Отдай своего сына: сегодня мы съедим его, а завтра съедим моего сына“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָּךְ
  choice: Что с тобой?
  rationale: Естественная современная передача краткого вопроса о причине обращения или беды; сохраняет широту еврейского выражения и не уточняет её без основания.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: Отдай своего сына
  rationale: Императив נתן здесь означает предоставить ребёнка для названной далее цели; «отдай» естественно звучит по-русски и передаёт притяжательное «своего».
- source_word: וְנֹאכְלֶנּוּ ... נֹאכַל
  choice: сегодня мы съедим его, а завтра съедим моего сына
  rationale: Прямо сохраняет ужасающее содержание и последовательность действий, не смягчая исходный текст.
theological_decisions:
- issue: Описание людоедства во время осады
  choice: Сохранить прямую формулировку «съедим» без эвфемизма
  alternative: Смягчить выражением вроде «употребим в пищу»
  rationale: Стих сообщает о крайнем бедствии; исходный текст намеренно прям и не даёт оснований смягчать его.
translation_notes:
  register: Современный литературный русский язык; диалог передан ясно и сдержанно. Указательное הָאִשָּׁה הַזֹּאת выражено разговорно естественным «вот эта женщина». Формула «Что с тобой?» сохраняет лаконичность оригинала.
