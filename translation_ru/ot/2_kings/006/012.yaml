  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: ru
  text: 'Но один из его слуг сказал: «Нет, господин мой царь. Напротив, Елисей, пророк, который в Израиле, сообщает царю Израиля слова, которые ты говоришь в своей спальне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: «Это»
  rationale: После отрицания частица вводит противопоставленное объяснение; по-русски конструкция «Это Елисей…» естественно передаёт смысл «нет… но/напротив, Елисей…».
- source_word: יַגִּיד
  choice: «передаёт»
  rationale: Форма обозначает регулярное сообщение сведений; «передаёт» звучит естественно в контексте раскрытия царю чужих слов.
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: «в своей спальне»
  rationale: Буквально «в комнате твоего ложа»; современный русский эквивалент — «в своей спальне», сохраняющий смысл самого закрытого, личного помещения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с уважительным придворным обращением «господин мой царь». Добавлено «даже» как естественное средство выразить подразумеваемый акцент на тайных словах, произнесённых в спальне; содержание не расширено.
