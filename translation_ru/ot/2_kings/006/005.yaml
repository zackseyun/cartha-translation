    text: 'Буквально: «железо»; имеется в виду железная часть орудия — головка топора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל
  choice: валил
  rationale: Причастие породы hифиль от נפל в данном контексте означает «заставлять упасть», то есть рубить и валить древесину.
- source_word: הַקּוֹרָה
  choice: бревно
  rationale: קוֹרָה может обозначать балку или бревно. Здесь речь идёт о рубке древесины для строительства, поэтому «бревно» естественно называет обрабатываемый кусок дерева, не предрешая, стал ли он уже готовой балкой.
- source_word: הַבַּרְזֶל
  choice: железо
  rationale: 'Сохранена буквальная метонимия древнееврейского текста: «железо» означает железную часть орудия, то есть лезвие топора. Пояснение вынесено в сноску.'
- source_word: וַיִּצְעַק
  choice: вскрикнул
  rationale: Передаёт внезапный возглас тревоги из-за утраты чужой вещи.
- source_word: אֲהָהּ
  choice: увы
  rationale: Междометие выражает сильную досаду и тревогу; «увы» сохраняет серьёзный, но понятный современному читателю тон.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Уважительное обращение к Елисею как к наставнику и старшему, без придания обращению божественного смысла.
- source_word: שָׁאוּל
  choice: взято взаймы
  rationale: Контекстуальное значение формы от שאל указывает, что орудие было одолжено говорившему и не принадлежало ему.
