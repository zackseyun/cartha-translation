base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: ru
  text: 'Когда один из них валил дерево, железо[a] упало в воду. Он вскрикнул: «Увы, господин мой! Ведь оно взято взаймы!»'
  philosophy: optimal-equivalence
  footnotes:
