base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: ru
  text: И он устроил для них большой пир[a]. Они ели и пили; затем он отпустил их, и они пошли к своему господину[b]. И набеговые отряды Арама больше не приходили в землю Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально здесь употреблено сочетание однокоренных слов со значением приготовления обильной трапезы; возможно также: «большое угощение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к своим господам». Вероятнее всего, имеется в виду царь Арама.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: устроил для них большой пир
  rationale: Глагол כרה с однокоренным существительным כֵּרָה образует идиому приготовления обильной трапезы; «устроил большой пир» естественно передаёт её смысл и подчёркивает גְדוֹלָה.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: они ели и пили
  rationale: Прямой и естественный перевод парных повествовательных глаголов.
- source_word: וַיְשַׁלְּחֵם
  choice: он отпустил их
  rationale: В контексте захваченных, а затем освобождённых арамеев «отпустил» точнее передаёт не только отправление, но и освобождение.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: к своему господину
  rationale: Форма אֲדֹנֵי с местоименным суффиксом здесь, вероятнее всего, обозначает одного властителя — царя Арама; «господин» сохраняет отношение подчинения, не вставляя слово «царь» непосредственно в текст.
- source_word: וְלֹא יָסְפוּ עוֹד ... לָבוֹא
  choice: с тех пор ... больше не вторгались
  rationale: Сочетание יסף, עוד и инфинитива выражает прекращение повторных действий; в связи с גְּדוּדֵי естественное русское «больше не вторгались» передаёт приход вооружённых отрядов на чужую землю.
- source_word: גְּדוּדֵי אֲרָם
  choice: отряды арамеев
  rationale: גְּדוּדֵי обозначает военные или набеговые отряды; родительный оборот «Арама» по-русски мог бы быть неясен, поэтому этноним «арамеи» обеспечивает понятность без анахроничного «сирийцы».
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: в землю Израиля
  rationale: При глаголе движения предлог ב указывает на движение внутрь территории; русская конструкция «вторгались в землю» сохраняет эту направленность.
theological_decisions:
- issue: Число и референт אֲדֹנֵיהֶם
  choice: к своему господину
  alternative: к своим господам; к своему царю
  rationale: Морфологическая форма допускает формальную множественность, однако контекст указывает на единственного верховного властителя. Перевод «господину» следует вероятному синтаксическому употреблению, а сноска сохраняет возможную буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык, ясный и повествовательно сдержанный. «Пир» передаёт масштаб угощения без архаической тяжеловесности; «арамеи» сохраняет историческое название народа. Пунктуация и связка «после чего» делают последовательность действий естественной для русского читателя.
