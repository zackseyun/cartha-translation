  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: ru
  text: И царь Израиля посылал к тому месту, о котором человек Божий говорил ему и предостерегал его, и был там настороже. Так бывало не раз и не два.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и принимал там меры предосторожности». Еврейское выражение может обозначать как личную бдительность царя, так и предпринятые им меры.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: посылал
  rationale: Глагол буквально означает «послал». Объект действия в еврейском тексте не назван, поэтому перевод не уточняет, посылал ли царь людей или сообщение; повторность происходившего передана несовершенным видом по контексту заключительной идиомы.
- source_word: אֶל הַמָּקוֹם
  choice: к тому месту
  rationale: Сохраняется пространственное направление אֶל и определённость места, уже указанного человеком Божьим.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Традиционное и буквальное обозначение пророка сохраняет форму исходного титула без сужающего истолкования.
- source_word: וְהִזְהִירֹה
  choice: предостерегая его
  rationale: Форма от זהר в породе хифиль выражает предупреждение или предостережение; местоименный суффикс естественно относится к царю. Деепричастие ясно связывает предостережение с речью человека Божьего.
- source_word: וְנִשְׁמַר שָׁם
  choice: и был там настороже
  rationale: Нифаль глагола שמר допускает значение осторожности, бдительности или принятия мер. Формулировка сохраняет эту широту и не вводит конкретных военных действий.
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: Так бывало не раз и не два
  rationale: Еврейская идиома указывает на неоднократность; естественная русская формула сохраняет и образ исходного выражения, и его смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением библейского титула «человек Божий». Неявный объект глагола «посылал» намеренно не восполнен, чтобы не уточнять сверх исходного текста, кого или что именно отправлял царь.
