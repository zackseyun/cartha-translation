  source_fidelity: 'Основной условный перевод («Если Яхве не спасёт тебя...») допустимо передаёт наиболее распространённое понимание трудной конструкции אַל יוֹשִׁעֵךְ יְהוָה и сохраняет повтор корня ישׁע. Однако альтернативная формулировка в сноске неточна: простое изъявительное «Яхве не спасает тебя» не отражает обычной побудительно-запретительной силы частицы אַל. Её следует передать как «Да не спасёт тебя Яхве!» (либо аналогичной формой) и обозначить именно как более буквальное прочтение.'
