  text: וַ/יֹּ֨אמֶר֙ אַל יוֹשִׁעֵ֣/ךְ יְהוָ֔ה מֵ/אַ֖יִן אֽוֹשִׁיעֵ֑/ךְ הֲ/מִן הַ/גֹּ֖רֶן א֥וֹ מִן הַ/יָּֽקֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: ru
  text: 'И он сказал[a]: «Если Яхве не спасёт тебя, то откуда мне тебя спасти? С гумна или из виноградного точила?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейскую фразу можно также более буквально понять так: «Да не спасёт тебя Яхве! Откуда мне тебя спасти?» Конструкция с отрицательной частицей необычна в данном контексте; глагол ישׁע в обоих случаях может означать «спасти», «избавить» или «помочь».'
    reason: Сохраняет спорность синтаксиса אַל יוֹשִׁעֵךְ יְהוָה и передаёт побудительно-запретительный оттенок частицы אַל, не устраняя принятого в основном тексте условного прочтения.
lexical_decisions:
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: Если Яхве не спасёт тебя
  rationale: Частица אַל обычно выражает отрицание, однако здесь перед формой ישׁע и последующим риторическим вопросом естественно передаётся условной конструкцией. Имя יהוה транслитерировано как «Яхве».
- source_word: יוֹשִׁעֵךְ / אוֹשִׁיעֵךְ
  choice: спасёт тебя / спасу тебя
  rationale: Повтор одного корня ישׁע сохранён одинаковым русским глаголом. В контексте осады «спасти» означает избавить от бедствия и снабдить необходимым, не обязательно имея узко религиозный смысл.
- source_word: מֵאַיִן
  choice: откуда
  rationale: Передаёт вопрос об источнике помощи и сохраняет образ последующего упоминания гумна и точила.
- source_word: הַגֹּרֶן
  choice: гумна
  rationale: Гумно — место обмолота и обработки зерна; краткий традиционный русский эквивалент, уместный в достоинстве библейского повествования.
- source_word: הַיָּקֶב
  choice: виноградного точила
  rationale: Существительное обозначает давильню или ёмкость для выжимания винограда. Уточнение «виноградного» делает древнюю реалию прозрачной современному читателю.
- source_word: וַיֹּאמֶר
  choice: И он сказал
  rationale: Сохраняет последовательное движение еврейского повествования и связь с предыдущим стихом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное Божье имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Значение ישׁע в обоих полустишиях
  choice: спасти
  alternative: помочь, избавить
  rationale: «Спасти» сохраняет лексический параллелизм оригинала и в данном контексте естественно обозначает избавление от смертельной нужды. Возможный более широкий смысл отмечен в сноске.
- issue: Синтаксис אַל יוֹשִׁעֵךְ יְהוָה
  choice: 'условное: «Если Яхве не спасёт тебя»'
  alternative: 'прямое отрицание или отрицательное пожелание: «Яхве не спасёт тебя» / «Да не спасёт тебя Яхве»'
  rationale: Условное прочтение лучше связывает первую фразу с вопросом «откуда я спасу тебя?» и соответствует отчаянному признанию царём отсутствия у него собственных средств. Необычность еврейской конструкции отмечена сноской.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Слово «гумно» сохраняет точность древней реалии, а сочетание «виноградное точило» делает второй образ понятным. Повтор «спасёт/спасу» намеренно воспроизводит параллелизм оригинала.
