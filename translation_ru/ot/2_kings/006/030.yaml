translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан естественным для чтения вслух; архаичное «и вот» не используется, но неожиданность обнаружения сохранена конструкцией «увидел, что». Термин «власяница» сохранён как общепринятое библейское обозначение траурной одежды.
