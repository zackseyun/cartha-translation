  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: ru
  text: 'Когда царь услышал слова женщины, он разорвал на себе одежды, проходя по стене. И народ увидел: на его теле под одеждой была власяница[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изнутри»; то есть власяница была надета под верхнюю одежду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: когда ... услышал
  rationale: Конструкция с כ и инфинитивом вводит временное придаточное; этот перевод естественно передаёт последовательность событий.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: слова женщины
  rationale: Речь идёт о сказанном женщиной; прямое значение «слова» здесь ясно и уместно.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: он разорвал на себе одежды
  rationale: Устойчивое библейское действие, выражающее скорбь или потрясение; «на себе» естественно по-русски уточняет действие.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: проходя по стене
  rationale: Причастная конструкция передаёт сопутствующее действие и движение по верху городской стены.
- source_word: וַיַּרְא הָעָם וְהִנֵּה
  choice: народ увидел, что
  rationale: Русская конструкция естественно объединяет глагол зрения и הִנֵּה, сохраняя момент неожиданного обнаружения без архаичного «вот».
- source_word: הַשַּׂק
  choice: власяница
  rationale: Традиционное и точное русское обозначение грубой покаянно-траурной одежды; оно лучше передаёт предмет, чем буквальное «мешковина».
- source_word: עַל־בְּשָׂרוֹ
  choice: на теле царя
  rationale: בשר здесь обозначает тело или кожу; повтор «царя» устраняет возможную неясность местоимения в русском предложении.
- source_word: מִבָּיִת
  choice: под одеждой
  rationale: Буквально «изнутри»; в контексте указывает, что власяница была скрыта под верхними одеждами и стала видна после их разрывания.
