  text: וַ/יְהִי֮ כְּ/בֹאָ֣/ם שֹׁמְרוֹן֒ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע יְהוָ֕ה פְּקַ֥ח אֶת עֵינֵֽי אֵ֖לֶּה וְ/יִרְא֑וּ וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵ֣ינֵי/הֶ֔ם וַ/יִּרְא֕וּ וְ/הִנֵּ֖ה בְּ/ת֥וֹךְ שֹׁמְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: ru
  text: 'Когда они вошли в Самарию, Елисей сказал: «Яхве, открой глаза этим людям[a], чтобы они увидели». Яхве открыл им глаза, и они увидели: вот, они посреди Самарии.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «этим»; слово «людям» добавлено для ясности. Имеются в виду арамейские воины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: Когда они вошли
  rationale: В повествовательной последовательности конструкция вводит обстоятельство времени. Русское «когда они вошли» естественно передаёт прибытие внутрь города без избыточного буквального «и было».
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Принятая русская форма топонима; в данном контексте имеется в виду город Самария.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменено титулом.
- source_word: פְּקַח אֶת־עֵינֵי
  choice: открой глаза
  rationale: 'Сохранён образ еврейского выражения: речь идёт о прекращении сверхъестественной слепоты или неспособности воспринимать.'
- source_word: אֵלֶּה
  choice: этим людям
  rationale: Указательное местоимение буквально означает «этим»; слово «людям» добавлено для естественности русского текста и относится к арамейским воинам.
- source_word: וְיִרְאוּ
  choice: чтобы они увидели
  rationale: После повеления форма глагола выражает цель или ожидаемый результат просьбы.
- source_word: וַיִּפְקַח יְהוָה אֶת־עֵינֵיהֶם
  choice: Яхве открыл им глаза
  rationale: Естественная русская конструкция сохраняет прямое исполнение просьбы Елисея.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: 'и они увидели: вот'
  rationale: Сохранены и глагол зрительного восприятия, и הִנֵּה как указатель внезапного осознания; двоеточие естественно связывает увиденное с последующим сообщением.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: посреди Самарии
  rationale: Передаёт положение внутри города и драматический смысл обнаружения себя в самом его центре.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Характер открывания глаз
  choice: Сохранена буквальная формулировка «открой глаза»
  alternative: дай им прозреть; верни им зрение
  rationale: Контекст допускает как физическую слепоту, так и сверхъестественно ограниченное восприятие; буквальный образ не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для повествования; указательное «вот» сохранено ради драматического эффекта исходного текста.
