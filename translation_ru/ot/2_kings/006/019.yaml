base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: ru
  text: 'И сказал им Елисей: «Это не та дорога, и это не тот город. Идите за мной[a], и я отведу вас к человеку, которого вы ищете». И он отвёл их в Самарию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «идите вслед за мной».'
    reason: Лексический вариант, отражающий пространственное значение אַחֲרַי.
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: та дорога
  rationale: דֶּרֶךְ обозначает дорогу, путь или направление. В конструкции «это не та дорога» русский указательный оборот естественно передаёт определённость и ситуативное противопоставление еврейского текста.
- source_word: הָעִיר
  choice: тот город
  rationale: עִיר — обычное слово со значением «город». Формулировка «это не тот город» сохраняет определённость и параллелизм с предыдущей частью фразы.
- source_word: לְכוּ אַחֲרַי
  choice: Идите за мной
  rationale: 'Буквально: «идите вслед за мной». Выбранный вариант естественно передаёт повеление двигаться за Елисеем, не добавляя оттенков, отсутствующих в исходном тексте.'
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: и я отведу вас
  rationale: Каузативная форма глагола הלך означает «повести, отвести». «Отведу» естественно сочетается с указанным местом назначения и сохраняет ведущую роль Елисея.
- source_word: הָאִישׁ
  choice: к человеку
  rationale: אִישׁ здесь обозначает конкретного мужчину, которого ищут воины. Русское «человек» в данном обороте естественно, сохраняет единственное число и косвенное самообозначение Елисея.
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: которого вы ищете
  rationale: בקשׁ означает «искать». Настоящее время передаёт продолжающиеся поиски и звучит естественно в современном русском языке.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: И он отвёл их
  rationale: Повтор той же каузативной основы הלך передан глаголом «отвёл», что поддерживает лексическую связь с обещанием Елисея.
- source_word: שֹׁמְרוֹנָה
  choice: в Самарию
  rationale: Направительный суффикс выражает движение к Самарии; по-русски это естественно передаётся конструкцией «в Самарию».
theological_decisions:
- issue: Обманный характер слов Елисея арамейцам
  choice: 'Передать его слова прямо: «Это не та дорога, и это не тот город»'
  alternative: Смягчить формулировку или пояснить в тексте, в каком смысле слова могли быть истинными либо обманными
  rationale: Еврейский текст не даёт нравственной оценки словам Елисея в самом стихе. Прямой перевод сохраняет повествовательное и богословское напряжение, не навязывая читателю истолкования.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным стилем. Сохранены параллелизм реплики Елисея, её неоднозначность и косвенное указание на самого себя.
