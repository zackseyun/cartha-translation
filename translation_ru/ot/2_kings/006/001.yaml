  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: ru
  text: 'Сыновья пророков[a] сказали Елисею: «Посмотри, пожалуйста: место, где мы живём при тебе[b], слишком тесно для нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ученики пророков», «пророческая община». Древнееврейская идиома «сыновья пророков», вероятно, обозначает членов пророческого сообщества, находившихся под наставлением или руководством.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в твоём присутствии». Выражение может означать, что они жили при Елисее и под его руководством, а не просто находились перед ним в пространственном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: сыновья пророков
  rationale: Формально прозрачный перевод сохраняет древнееврейскую идиому; по контексту речь, вероятно, идёт о членах пророческой общины, связанных с Елисеем.
- source_word: הִנֵּה נָא
  choice: посмотри, пожалуйста
  rationale: «Посмотри» передаёт привлечение внимания, а «пожалуйста» — смягчающую, просительную силу נָא.
- source_word: הַמָּקוֹם
  choice: место
  rationale: Общее обозначение не уточняет без достаточных оснований, было ли это жилище, помещение для собраний или целый комплекс.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: где мы живём при тебе
  rationale: יֹשְׁבִים здесь естественно понимать как проживание, а «при тебе» сохраняет возможный смысл нахождения в присутствии Елисея или под его руководством; שָׁם естественно выражено относительным «где».
- source_word: צַר מִמֶּנּוּ
  choice: слишком тесно для нас
  rationale: צַר буквально указывает на тесноту или недостаток пространства; русская конструкция естественно передаёт сравнительный смысл מִמֶּנּוּ.
- source_word: וַיֹּאמְרוּ
  choice: сказали
  rationale: Нарративная форма продвигает повествование; отдельное «и» в начале русского стиха необязательно и без контекста звучало бы механически.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, повествовательным звучанием. Идиома «сыновья пророков» сохранена в основном тексте, а её вероятный смысл разъяснён в сноске. Формулировка «при тебе» оставляет открытыми оттенки присутствия и руководства.
