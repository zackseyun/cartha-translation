  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: ru
  text: 'Сердце царя Арама сильно встревожилось из-за этого, и он призвал своих слуг и сказал им: «Неужели вы не скажете мне, кто из наших — за царя Израиля?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на стороне царя Израиля». Краткое древнееврейское выражение подразумевает преданность ему или сговор с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר
  choice: сильно встревожилось
  rationale: Глагол описывает бурное внутреннее смятение или сильное возбуждение. Такой перевод естественно передаёт состояние царя, не сводя его лишь к гневу.
- source_word: לֵב
  choice: сердце
  rationale: Сохранён древнееврейский образ внутреннего мира человека, охватывающего мысли и чувства; в русском библейском повествовании он понятен и уместен.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: из-за этого
  rationale: По контексту речь идёт о причине тревоги — повторяющемся раскрытии замыслов царя. Краткая формулировка естественна по-русски.
- source_word: עֲבָדָיו
  choice: своих слуг
  rationale: В царском контексте слово может обозначать придворных служителей или должностных лиц. «Слуги» сохраняет широкое лексическое значение, не вводя более узкого толкования.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: Неужели вы не скажете мне
  rationale: Отрицательный вопрос передаёт настойчивость и раздражение царя, сохраняя вопросительную форму оригинала.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: кто из наших
  rationale: Естественно передаёт вопрос о человеке внутри арамейского окружения царя.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: за царя Израиля
  rationale: Краткая древнееврейская конструкция в данном контексте подразумевает сторону, преданность или сговор. Русское «за царя» сохраняет лаконичность и некоторую смысловую открытость.
