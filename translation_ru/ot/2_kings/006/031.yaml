  text: וַ/יֹּ֕אמֶר כֹּֽה יַעֲשֶׂה לִּ֥/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑ף אִֽם יַעֲמֹ֞ד רֹ֣אשׁ אֱלִישָׁ֧ע בֶּן שָׁפָ֛ט עָלָ֖י/ו הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: ru
  text: 'И он сказал: «Пусть Бог сделает со мной то и ещё больше, если голова Елисея, сына Сафата, останется сегодня на его плечах[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если голова Елисея, сына Сафата, устоит на нём сегодня», то есть останется на его теле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: Пусть Бог сделает со мной то и ещё больше
  rationale: Устойчивая древнееврейская формула клятвы с самообличающим проклятием. Русская формулировка сохраняет её намеренную недосказанность и силу, не уточняя подразумеваемое наказание.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, здесь слово относится к единому Богу и сочетается с глаголами в единственном числе.
- source_word: אִם
  choice: если
  rationale: В клятвенной формуле союз вводит условие, при неисполнении которого говорящий призывает на себя кару. Сохранение «если» передаёт еврейскую синтаксическую форму и не устраняет её эллиптичность.
- source_word: יַעֲמֹד
  choice: останется
  rationale: Буквально глагол означает «стоять», но в данном контексте речь идёт о том, останется ли голова на теле; «останется» естественно передаёт смысл угрозы.
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: голова Елисея, сына Сафата
  rationale: Сохраняет резкую предметность еврейской конструкции и точно передаёт имя и отчество-прозвание.
- source_word: עָלָיו
  choice: на его плечах
  rationale: Буквально «на нём». Русский фразеологизм ясно передаёт угрозу обезглавливания, тогда как буквальное «на нём» звучало бы неясно; буквальная форма отмечена в сноске.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Современное и точное соответствие, сохраняющее непосредственность угрозы.
theological_decisions:
- issue: Смысл и референт клятвенной формулы
  choice: 'Самопроклятие с призыванием Бога: говорящий призывает на себя Божью кару, если Елисей не будет обезглавлен в тот же день.'
  alternative: Просто гневное восклицание без полной силы клятвы.
  rationale: Формула «пусть Бог сделает со мной то и ещё больше» неоднократно употребляется в еврейской Библии как торжественная клятва с условным самопроклятием; ослаблять её до эмоционального возгласа нет оснований.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой клятвы. Угроза передана ясно и резко; архаизмы и излишне буквальный, неестественный оборот исключены.
