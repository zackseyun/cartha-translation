- source_word: וַיְהִי
  choice: И когда
  rationale: Конструкция вводит сопутствующее обстоятельство повествования; вместе с причастием עֹבֵר естественно передаётся временным оборотом без архаичного «и было».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Обычная конструкция сопряжённого состояния, обозначающая правителя Израиля.
- source_word: עֹבֵר עַל הַחֹמָה
  choice: проходил по стене
  rationale: Причастие выражает продолжавшееся в прошлом действие; עַל указывает, что царь находился и двигался по городской стене.
- source_word: וְאִשָּׁה צָעֲקָה אֵלָיו
  choice: одна женщина закричала ему
  rationale: «Одна женщина» естественно вводит нового, ранее не названного участника, а «закричала» передаёт громкий и настойчивый возглас צָעֲקָה.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартный еврейский показатель цитаты естественно выражается в русском языке пунктуационным введением прямой речи, без избыточного «говоря».
- source_word: הוֹשִׁיעָה
  choice: Помоги
  rationale: Императив буквально связан со спасением или избавлением, но в обращении к царю служит настойчивой просьбой вмешаться и оказать помощь.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохранено почтительное царское обращение и его формальная структура; такой порядок слов звучит возвышенно, но остаётся понятным современному читателю.
