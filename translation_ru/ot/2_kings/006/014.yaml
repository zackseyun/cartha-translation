  yaml_path: translation/ot/2_kings/006/014.yaml
  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: ru
  text: И послал он туда коней, колесницы и большое войско[a]. Они пришли ночью и окружили город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «значительные военные силы». Буквально еврейское выражение означает «тяжёлое войско (силу)» — это идиома, обозначающая крупный военный отряд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал он
  rationale: Последовательная повествовательная форма глагола שׁלח передаёт очередное действие царя; «послал» — прямой и естественный русский эквивалент.
- source_word: שָׁמָּה
  choice: туда
  rationale: Наречие направления указывает на названное в предыдущем стихе место; «туда» кратко и ясно сохраняет эту связь.
- source_word: סוּסִים
  choice: коней
  rationale: Существительное буквально обозначает коней. Военный контекст может подразумевать конницу, однако конкретный образ исходного текста сохранён.
- source_word: וְרֶכֶב
  choice: колесницы
  rationale: רֶכֶב может обозначать колесницы либо колесничное войско; конкретное «колесницы» естественно сочетается с конями и не делает текст излишне техническим.
- source_word: וְחַיִל כָּבֵד
  choice: и большое войско
  rationale: В военном контексте חַיִל означает войско или военную силу, а כָּבֵד («тяжёлый») идиоматически указывает на значительность или многочисленность. «Большое войско» ясно передаёт смысл.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: Они пришли ночью
  rationale: Сочетание обозначает прибытие в ночное время; «пришли ночью» — прямое и естественное русское выражение.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: и окружили город
  rationale: Глагол выражает действие окружения или охвата со всех сторон; в данном военном контексте «окружили город» передаёт его ясно и точно.
