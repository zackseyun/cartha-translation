base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: ru
  text: 'Слуга человека Божьего встал рано утром и вышел. И вот, войско с конями и колесницами окружало город. Тогда слуга сказал ему: «Увы, господин мой! Что же нам делать?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: встал рано утром
  rationale: Сочетание выражает раннее начало действия; такая передача естественна по-русски и сохраняет временной оттенок еврейского текста.
- source_word: מְשָׁרֵת
  choice: слуга
  rationale: Слово обозначает человека, состоящего при другом и служащего ему; в данном повествовании «слуга» звучит ясно и естественно.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Устойчивый пророческий титул передан традиционно и близко к форме оригинала.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Точно передаёт движение из помещения наружу и естественно продолжает повествование.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет внезапность открывшейся слуге картины и соответствует живому русскому повествованию.
- source_word: חַיִל
  choice: войско
  rationale: В военном контексте слово обозначает вооружённые силы; «войско» стилистически уместно в историческом повествовании.
- source_word: סוֹבֵב
  choice: окружало
  rationale: Причастная форма изображает продолжающееся состояние, обнаруженное слугой; несовершенный вид сохраняет этот оттенок.
- source_word: וְסוּס וָרָכֶב
  choice: с конями и колесницами
  rationale: Оборот уточняет состав и оснащение войска; предлог «с» естественно выражает эту связь по-русски.
- source_word: נַעֲרוֹ
  choice: слуга
  rationale: נַעַר может обозначать юношу или слугу. Контекст и предыдущее מְשָׁרֵת ясно указывают на служебное положение, тогда как возраст персонажа не обязательно подчёркнут.
- source_word: אֲהָהּ
  choice: о горе
  rationale: Междометие выражает испуг и отчаяние; «о горе» сохраняет серьёзный тон без излишней разговорности.
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Это уважительное обращение слуги к своему хозяину, а не божественный титул.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: что же нам делать?
  rationale: Идиоматически передаёт тревожный вопрос о том, как поступить в сложившейся ситуации; частица «же» отражает эмоциональную напряжённость.
