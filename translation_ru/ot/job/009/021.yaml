  text: תָּֽם אָ֭נִי לֹֽא אֵדַ֥ע נַפְשִׁ֗/י אֶמְאַ֥ס חַיָּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/021.yaml
  text: I am blameless[a]; I do not know myself; I despise my life.
translation:
  language: ru
  text: Непорочен я; не знаю самого себя[a]; презираю жизнь мою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не знаю души моей»; еврейское слово может означать душу, самого человека или его жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּם
  choice: непорочен
  rationale: Передаёт цельность и безупречность Иова, не подразумевая абсолютной безгрешности; краткая именная конструкция сохраняет подчёркнутое «я».
- source_word: לֹא אֵדַע נַפְשִׁי
  choice: не знаю самого себя
  rationale: Сохраняет основное значение ידע «знать» и резкую, неоднозначную формулировку; возвратное «самого себя» естественно передаёт здесь широкий смысл נפש.
- source_word: אֶמְאַס
  choice: презираю
  rationale: Соответствует значению מאס «отвергать, презирать» и сохраняет сильную эмоциональную окраску без усиления до «ненавижу».
- source_word: חַיָּי
  choice: жизнь мою
  rationale: Естественно передаёт форму «моя жизнь»; постпозиция местоимения поддерживает краткий, возвышенный библейский ритм, оставаясь понятной современному читателю.
theological_decisions:
- issue: Характер утверждения Иова о собственной непорочности
  choice: «Непорочен я» — заявление о цельности и безупречности
  alternative: «Я невиновен» или формулировка, предполагающая абсолютную безгрешность
  rationale: תָּם в книге Иова обозначает цельность и нравственную безупречность, но само по себе не утверждает метафизической безгрешности; перевод сохраняет напряжение речи Иова, не разрешая его богословски.
translation_notes:
  register: Современный литературный русский с лаконичным, dignified библейским ритмом. Порядок слов слегка возвышенный, но понятный; исходная неоднозначность средней фразы сохранена и пояснена в сноске.
