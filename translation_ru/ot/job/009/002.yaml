lexical_decisions:
- source_word: אָמְנָם
  choice: Воистину
  rationale: Передаёт усиленное подтверждение, которым Иов признаёт справедливость сказанного ранее; слово сохраняет торжественный тон, не превращая его в простое разговорное «да».
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект выражает устойчивое знание или признание; настоящее время естественно передаёт это состояние по-русски.
- source_word: כִי כֵן
  choice: что это так
  rationale: Сочетание подтверждает истинность предшествующего утверждения и естественно звучит в современном русском языке.
- source_word: וּמַה
  choice: но как
  rationale: Союз с вопросительным словом обозначает здесь переход от признания к возражению или затруднению; «но» ясно передаёт этот смысловой поворот.
- source_word: יִצְדַּק
  choice: быть правым
  rationale: Глагол צדק в породе каль означает «быть правым, праведным». Выражение «быть правым» сохраняет возможный судебный оттенок и не вводит более позднюю разработанную терминологию оправдания.
- source_word: אֱנוֹשׁ
  choice: человеку
  rationale: Существительное обозначает человека как смертное, немощное существо; единственное число имеет обобщающий смысл. Русское «человеку» естественно охватывает человечество в целом.
- source_word: עִם אֵל
  choice: перед Богом
  rationale: Буквально «с Богом», но в данном вопросе оборот описывает положение человека в сопоставлении или разбирательстве с Богом. «Перед Богом» естественно передаёт этот реляционно-судебный смысл.
theological_decisions:
- issue: Судебный оттенок праведности человека по отношению к Богу
  choice: как человеку быть правым перед Богом?
  alternative: как человек может оправдаться перед Богом?
  rationale: Еврейский глагол допускает судебный смысл, однако стих не объясняет механизм оправдания. Формулировка «быть правым перед Богом» сохраняет вопрос и его богословское напряжение, не вкладывая в него позднейшую доктринальную систему.
