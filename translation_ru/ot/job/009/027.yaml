lexical_decisions:
- source_word: אִם אָמְרִי
  choice: Если я скажу
  rationale: Условная конструкция представляет предполагаемое решение Иова; по-русски естественно передаётся будущим временем.
- source_word: אֶשְׁכְּחָה
  choice: Забуду
  rationale: Форма первого лица выражает намерение, которое Иов мысленно предлагает себе осуществить.
- source_word: שִׂיחִי
  choice: свою жалобу
  rationale: Слово может обозначать размышление или внутреннюю речь, однако в контексте плача Иова прежде всего подразумевает жалобу.
- source_word: אֶעֶזְבָה פָנַי
  choice: перестану ходить с мрачным лицом
  rationale: Буквально говорится об оставлении своего лица; естественная русская передача раскрывает идиоматический смысл — оставить скорбный вид.
- source_word: וְאַבְלִיגָה
  choice: и ободрюсь
  rationale: Редкий глагол здесь указывает на ослабление скорби и попытку обрести более бодрое состояние; «ободрюсь» сохраняет волевой и эмоциональный оттенки.
