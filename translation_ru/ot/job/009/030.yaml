lexical_decisions:
- source_word: אִם
  choice: Если бы
  rationale: В контексте рассуждения Иова вводит гипотетическое условие; русская конструкция «если бы» естественно передаёт его нереальный характер.
- source_word: הִתְרָחַצְתִּי
  choice: я омылся
  rationale: Возвратная форма глагола רחץ означает омовение себя; «омылся» сохраняет образ очищения и соответствует возвышенному поэтическому регистру.
- source_word: במו שָׁלֶג
  choice: снегом
  rationale: Предлог указывает на средство омовения. Перевод не добавляет отсутствующую в еврейском тексте «снежную воду».
- source_word: וַהֲזִכּוֹתִי
  choice: и очистил
  rationale: Каузативная форма זכה означает «сделать чистым»; выбор сохраняет параллелизм с омовением без излишнего уточнения ритуального или нравственного смысла.
- source_word: בְּבֹר
  choice: щёлоком
  rationale: בֹּר обозначает щелочное моющее средство; «щёлок» исторически и предметно точнее современного «мыла» и понятен с пояснением.
- source_word: כַּפָּי
  choice: свои руки
  rationale: Буквально «мои ладони», но в контексте мытья по-русски естественно сказать «руки»; возвратное «свои» ясно связывает их с говорящим.
