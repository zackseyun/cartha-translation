  text: If it is a matter of strength[a], behold, he is mighty; and if of justice[b], who can summon him?
translation:
  language: ru
  text: Если дело в силе — вот, Он могуч; если же дело в суде[a] — кто назначит мне срок[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о правосудии», «о судебной тяжбе».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма содержит «меня» как объект. Глагол может означать «назначить мне срок» или «вызвать меня [на суд]». По контексту некоторые понимают: «кто вызовет Его [на суд]?»'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לְכֹחַ
  choice: Если речь о силе
  rationale: 'Предлог לְ задаёт область сопоставления: «если дело касается силы». Русское выражение естественно передаёт краткую еврейскую конструкцию.'
- source_word: אַמִּיץ
  choice: могуч
  rationale: Слово обозначает исключительную силу; «могуч» сохраняет возвышенный тон и не повторяет существительное «сила».
- source_word: הִנֵּה
  choice: вот
  rationale: Сохранена указательно-усилительная частица, придающая словам Иова риторическую резкость.
- source_word: וְאִם לְמִשְׁפָּט
  choice: а если о суде
  rationale: מִשְׁפָּט в данном контексте несёт судебно-правовой смысл. Союз «а» естественно противопоставляет вторую область первой, не меняя логики еврейского текста.
- source_word: מִי יוֹעִידֵנִי
  choice: кто вызовет меня
  rationale: Форма יוֹעִידֵנִי содержит суффикс первого лица единственного числа, поэтому масоретский текст непосредственно означает «вызовет/назначит меня». Судебный оттенок глагола יעד передан словом «вызовет»; трудность конструкции и контекстуальная альтернатива отмечены в сноске.
theological_decisions:
- issue: Судебный образ и объект вызова
  choice: 'Передать масоретскую форму буквально: «кто вызовет меня?»'
  alternative: «Кто вызовет Его [на суд]?» или «кто назначит мне слушание?»
  rationale: Суффикс еврейской формы грамматически указывает на Иова, хотя общий ход главы побуждает некоторых понимать вопрос как невозможность вызвать Бога в суд. Основной текст следует WLC, а сноска сохраняет контекстуальную и синтаксическую неоднозначность, не устраняя напряжения.
translation_notes:
  register: Современный литературный русский с кратким, торжественным ритмом. Заглавное «Он» указывает на Бога, названного в ближайшем контексте; тире сохраняют резкую параллельную структуру еврейского высказывания.
