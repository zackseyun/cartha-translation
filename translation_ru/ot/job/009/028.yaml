  text: יָגֹ֥רְתִּי כָל עַצְּבֹתָ֑/י יָ֝דַ֗עְתִּי כִּי לֹ֥א תְנַקֵּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/028.yaml
  text: I am afraid of all my pains[b][a]; I know that you will not acquit me.
translation:
  language: ru
  text: Я страшусь всех моих страданий; я знаю, что Ты не оправдаешь меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты не признаешь меня невиновным»; или: «Ты не оставишь меня без наказания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: я страшусь
  rationale: Форма Qal perfect 1-го лица ед. числа от גור выражает состояние страха; настоящее время естественно передаёт это значение по-русски, а «страшусь» сохраняет оттенок сильного опасения.
- source_word: כָל
  choice: всех
  rationale: Прямо передаёт всеохватный квантор и согласуется с родительным падежом после глагола «страшиться».
- source_word: עַצְּבֹתָי
  choice: моих страданий
  rationale: Слово может обозначать боли, скорби или беды. «Страдания» естественно охватывает телесные и душевные муки Иова, не сужая значение до одного вида боли.
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Qal perfect 1-го лица ед. числа от ידע здесь имеет стативное значение, которое естественно передаётся настоящим временем.
- source_word: כִּי
  choice: что
  rationale: Вводит содержание знания Иова.
- source_word: לֹא
  choice: не
  rationale: Стандартное отрицание.
- source_word: תְנַקֵּנִי
  choice: Ты не оправдаешь меня
  rationale: 'Piel от נקה имеет судебный оттенок: признать невиновным, оправдать, освободить от вины или наказания. «Оправдаешь» кратко и естественно сохраняет этот юридический смысл.'
theological_decisions:
- issue: Судебный оттенок נקה в обращении Иова к Богу
  choice: Ты не оправдаешь меня
  alternative: Ты не признаешь меня невиновным; Ты не оставишь меня без наказания
  rationale: Основной вариант сохраняет юридическую напряжённость спора Иова с Богом, не разрешая её посредством позднейших богословских категорий. Смысл освобождения от наказания остаётся допустимой лексической альтернативой и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, но понятным регистром. «Страшусь» передаёт интенсивность без архаической тяжеловесности; «страдания» сохраняет широту исходного слова. Местоимение «Ты» написано с прописной буквы как уважительное обращение к Богу.
