  text: הַ/מַּעְתִּ֣יק הָ֭רִים וְ/לֹ֣א יָדָ֑עוּ אֲשֶׁ֖ר הֲפָכָ֣/ם בְּ/אַפּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/005.yaml
  text: He removes mountains[a], and they do not know it[c][b], when he overturns them in his anger.
translation:
  language: ru
  text: Он сдвигает горы[a], и они не знают об этом[b], когда Он опрокидывает их в Своём гневе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перемещает горы». Еврейский глагол может означать, что нечто заставляют сдвинуться со своего места.'
    reason: lexical_alternative
  - marker: b
    text: 'В этой поэтической строке горы олицетворены: они не знают, когда Бог их опрокидывает.'
    reason: cultural_note
  - marker: c
    text: 'Или: «в Своей ярости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְתִּיק
  choice: сдвигает
  rationale: Причастие породы hифиль от עתק означает «заставлять переместиться со своего места». «Сдвигает» естественно передаёт эту мысль применительно к горам и сохраняет образ Божьей космической силы.
- source_word: הָרִים
  choice: горы
  rationale: Прямое соответствие еврейскому существительному во множественном числе.
- source_word: וְלֹא יָדָעוּ
  choice: и они не знают об этом
  rationale: Форма множественного числа согласуется с «горами» и тем самым сохраняет поэтическое олицетворение. «Об этом» добавлено по смыслу для естественности русского выражения.
- source_word: אֲשֶׁר
  choice: когда
  rationale: 'В данном контексте союз вводит обстоятельство, при котором горы «не знают»: когда Бог их опрокидывает. Временное «когда» естественнее буквального «что».'
- source_word: הֲפָכָם
  choice: Он опрокидывает их
  rationale: Глагол הפך выражает переворачивание или опрокидывание; местоименный суффикс множественного числа передан словом «их».
- source_word: בְּאַפּוֹ
  choice: в Своём гневе
  rationale: אַף буквально связано с «носом», но в этой идиоме означает гнев или ярость. «В Своём гневе» ясно и достойно передаёт обстоятельственный оттенок еврейского выражения.
