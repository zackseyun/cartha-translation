  text: נֹטֶ֣ה שָׁמַ֣יִם לְ/בַדּ֑/וֹ וְ֝/דוֹרֵ֗ךְ עַל בָּ֥מֳתֵי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/008.yaml
  text: who alone stretches out the heavens and treads on the heights of the sea[a].
translation:
  language: ru
  text: 'Он один простирает небеса

    и ступает по высотам моря[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идёт по волнам моря».'
    reason: 'Лексически возможная и более истолковательная передача выражения בָּמֳתֵי יָם: буквальные «высоты моря» могут обозначать его волны.'
lexical_decisions:
- source_word: נֹטֶה
  choice: простирает
  rationale: Причастие породы qal от נטה передаёт продолжающееся или характерное действие «простирать, раскидывать»; «простирает» естественно звучит в возвышенной поэтической речи.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: В поэтическом космологическом контексте слово обозначает небесный свод или небесную сферу; «небеса» сохраняет традиционную множественную форму и остаётся понятным современному читателю.
- source_word: לְבַדּוֹ
  choice: один
  rationale: Форма подчёркивает, что Бог совершает действие единолично, без чьей-либо помощи. «Он один» ясно и естественно передаёт это исключительное положение.
- source_word: וְדוֹרֵךְ
  choice: и ступает
  rationale: Глагол דרך в породе qal означает «ступать, идти по, попирать». «Ступает» сохраняет яркий образ движения и не привносит разрушительного оттенка слова «попирает».
- source_word: עַל
  choice: по
  rationale: При глаголе движения русское «по» естественно передаёт движение по поверхности, соответствуя значению еврейского предлога.
- source_word: בָּמֳתֵי
  choice: высотам
  rationale: במה обычно означает «высота, возвышение». Сочетание «высоты моря» поэтически обозначает возвышающуюся поверхность моря, вероятно волны; основной текст сохраняет исходную метафору.
- source_word: יָם
  choice: моря
  rationale: Единственное число соответствует еврейскому тексту и космической поэтической образности стиха.
theological_decisions:
- issue: Космический образ Божьего владычества над творением
  choice: Сохранить поэтическое изображение Бога, который один простирает небеса и ступает по высотам моря.
  alternative: 'Передать выражение более истолковательно: «идёт по волнам моря».'
  rationale: Стих возвышенным поэтическим языком говорит об исключительной власти Бога над мирозданием. Перевод сохраняет образность, не сводя её к отвлечённой метафоре и не добавляя позднейших богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия не используется; параллелизм и образность древнееврейской строки сохранены. Местоимение «Он» добавлено для естественности русского отдельного стиха и явно отсылает к Богу из контекста.
