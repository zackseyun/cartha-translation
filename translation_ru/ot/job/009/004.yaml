lexical_decisions:
- source_word: חֲכַם לֵבָב
  choice: мудр сердцем
  rationale: Сохраняет еврейский образ сердца как средоточия разума и воли и естественно звучит в возвышенной русской речи.
- source_word: וְאַמִּיץ כֹּחַ
  choice: и могуч силой
  rationale: Передаёт усилительное сочетание понятий могущества и силы, не сглаживая поэтическую выразительность оригинала.
- source_word: מִי
  choice: кто
  rationale: Прямо и естественно вводит риторический вопрос.
- source_word: הִקְשָׁה
  choice: ожесточался
  rationale: В контексте конструкции с אֵלָיו обозначает упорное, непреклонное противление; русское возвратное слово передаёт направленность действия самого человека.
- source_word: אֵלָיו
  choice: против Него
  rationale: При данном глаголе предлог выражает враждебное противостояние, а не простое направление к кому-либо.
- source_word: וַיִּשְׁלָם
  choice: и оставался невредимым
  rationale: Глагол от שלם здесь выражает исход, при котором человек остаётся целым и невредимым; формулировка сохраняет телесно-экзистенциальный оттенок и подходит риторическому вопросу.
theological_decisions:
- issue: Неявный субъект начальных определений
  choice: Местоимение «Он» относится к Богу; в «Него» использована прописная буква.
  alternative: Оставить субъект подразумеваемым или написать местоимения со строчной буквы.
  rationale: В русском языке для завершённости предложения субъект необходимо выразить, а ближайший контекст речи Иова однозначно указывает на Бога. Прописная буква соответствует принятому благоговейному русскому оформлению, не добавляя отдельного толкования.
- issue: Характер противления Богу
  choice: «ожесточался против Него»
  alternative: «упрямо противился Ему» или «делал себя жёстким против Него»
  rationale: Выбранное выражение сохраняет нравственную напряжённость и возвратный оттенок формы, не уточняя сверх текста мотив или конкретный вид сопротивления.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Сохранены образ «мудр сердцем», усилительное сочетание о могуществе и риторическая форма вопроса; архаизмы сведены к минимуму.
