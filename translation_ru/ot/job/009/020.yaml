  text: אִם אֶ֭צְדָּק פִּ֣/י יַרְשִׁיעֵ֑/נִי תָּֽם אָ֝֗נִי וַֽ/יַּעְקְשֵֽׁ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/020.yaml
  text: If I am in the right[a], my own mouth would condemn me; though I am blameless, it would prove me crooked.
translation:
  language: ru
  text: Если я прав, мои же уста осудят меня; даже если я непорочен, они выставят меня превратным.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Даже если я непорочен, Он выставит меня превратным», — если подразумеваемым субъектом во второй части считать Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Частица вводит условное высказывание; повтор «если» естественно передаёт параллельное построение еврейского стиха.
- source_word: אֶצְדָּק
  choice: я прав
  rationale: 'Qal глагола צדק здесь имеет статическое, судебное значение: «быть правым», а не «оправдывать себя».'
- source_word: פִּי
  choice: мои же уста
  rationale: 'Буквально «мои уста»; частица «же» подчёркивает иронию: собственная речь Иова обернётся против него.'
- source_word: יַרְשִׁיעֵנִי
  choice: осудят меня
  rationale: Hiphil от רשע в судебном контексте означает «признать виновным, осудить».
- source_word: תָּם
  choice: я непорочен
  rationale: תָּם обозначает цельность и безупречность, но не обязательно абсолютную безгрешность; «непорочен» сохраняет этот оттенок в контексте книги Иова.
- source_word: וַיַּעְקְשֵׁנִי
  choice: они представят меня лукавым
  rationale: Глагол от עקשׁ передаёт представление кого-либо кривым, превратным или лукавым. Множественное «они» согласуется в русском с «уста» и сохраняет уста как вероятный субъект обеих частей.
theological_decisions:
- issue: Субъект וַיַּעְקְשֵׁנִי
  choice: 'Субъект продолжается из первой части: «мои уста… они представят меня лукавым».'
  alternative: 'Подразумеваемый субъект — Бог: «Он представит меня лукавым».'
  rationale: Параллелизм допускает и, вероятно, поддерживает сохранение того же субъекта — уст Иова. Однако еврейская форма не называет субъект явно, поэтому альтернативное понимание с Богом сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Судебная образность передана словами «прав» и «осудят»; синтаксический параллелизм оригинала сохранён. «Лукавым» передаёт нравственную кривизну עקשׁ без неестественного буквального выражения «кривым».
