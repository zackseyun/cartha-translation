base_translation:
  language: en
  yaml_path: translation/ot/job/009/011.yaml
  text: Look[a], he passes by me, and I do not see him; he moves on[c][b], and I do not perceive him.
translation:
  language: ru
  text: Вот, Он проходит мимо меня — и я не вижу Его; проходит дальше — и я Его не различаю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и я Его не понимаю»; еврейский глагол может означать как различение и распознавание, так и понимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатическое указание и непосредственность наблюдения естественным для современного литературного русского языком.
- source_word: יַעֲבֹר עָלַי
  choice: проходит мимо меня
  rationale: Сочетание עבר с על здесь описывает движение Бога мимо Иова; перевод сохраняет пространственный образ, не усиливая его до значения «надо мной» или «по мне».
- source_word: וְלֹא אֶרְאֶה
  choice: и я не вижу Его
  rationale: Прямо передаёт отрицательную форму глагола ראה, не добавляя модального значения невозможности.
- source_word: וְיַחֲלֹף
  choice: проносится
  rationale: Передаёт חלף как быстрое прохождение мимо или исчезновение из поля восприятия и одновременно избегает дословного повтора первого глагола.
- source_word: וְלֹא אָבִין לוֹ
  choice: и я Его не различаю
  rationale: בין может обозначать понимание, распознавание или различение. В контексте невидимого прохождения «не различаю» сохраняет смысл воспринимающего распознания, не сводя фразу только к интеллектуальному непониманию.
theological_decisions:
- issue: К кому относятся подлежащее и местоименные формы
  choice: К Богу; в русском тексте употреблены «Он» и «Его» без добавления имени или титула.
  alternative: 'Неопределённое лицо: «кто-то проходит».'
  rationale: Ближайший контекст Иов 9:10–12 говорит о непостижимых действиях Бога. Местоименный перевод сохраняет эту отсылку, не вводя отсутствующего в стихе божественного наименования.
- issue: Значение אָבִין לוֹ
  choice: «Его не различаю» — неспособность распознать или воспринять проходящего Бога.
  alternative: «Его не понимаю» — интеллектуальная непостижимость Бога.
  rationale: Оба оттенка допускаются глаголом בין. Контекст параллелизма с «не вижу» поддерживает восприятие и распознавание, однако смысл понимания остаётся подлинной альтернативой и отмечен в сноске.
translation_notes:
  register: Современный литературный русский с краткой поэтической параллельностью. Заглавные буквы в местоимениях указывают на Бога согласно ближайшему контексту, не добавляя в основной текст отсутствующего титула. Тире передаёт две последовательные, параллельные картины движения.
