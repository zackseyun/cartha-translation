  text: who shakes the earth from its place[a], and its pillars tremble.
translation:
  language: ru
  text: 'Он сотрясает землю, сдвигая её с места,

    и её столпы содрогаются.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дрожат»; возможный смысл — «приходят в ужас».'
    reason: Лексическое значение יִתְפַלָּצוּן допускает как физическое содрогание, так и образ сильного ужаса.
lexical_decisions:
- source_word: הַמַּרְגִּיז
  choice: Он сотрясает
  rationale: Причастие породы хифиль от רגז имеет каузативный смысл и продолжает описание Бога. «Сотрясает» естественно передаёт сильное движение и возвышенный поэтический регистр.
- source_word: אֶרֶץ
  choice: землю
  rationale: Космический контекст — земля сдвигается со своего места и имеет столпы — указывает на землю как целое, а не на отдельную страну.
- source_word: מִמְּקוֹמָהּ
  choice: сдвигая её с места
  rationale: Оборот передаёт исходное значение предлога מן — удаление от места — и по-русски ясно связывает его с каузативным действием Бога.
- source_word: וְעַמּוּדֶיהָ
  choice: и её столпы
  rationale: «Столпы» сохраняет конкретный древний поэтический образ עמוד и не заменяет его толкованием «основания».
- source_word: יִתְפַלָּצוּן
  choice: содрогаются
  rationale: Редкий глагол выражает сильную дрожь или содрогание. «Содрогаются» подходит неодушевлённым столпам и сохраняет интенсивность образа.
theological_decisions:
- issue: Космологический образ столпов земли
  choice: Сохранить буквально-поэтическое «её столпы»
  alternative: Передать как «её основания», приспосабливая образ к современному восприятию
  rationale: Древний космологический образ является частью поэзии текста; перевод не должен модернизировать или демифологизировать его и тем самым подменять исходную метафору толкованием.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной поэтической лексикой. Две строки сохраняют параллелизм и космическую образность еврейского текста.
