lexical_decisions:
- source_word: יִתְּנֵנִי
  choice: не даёт мне
  rationale: Форма от נתן с последующим инфинитивом имеет идиоматическое значение дозволения; «не даёт мне» естественно передаёт этот смысл по-русски.
- source_word: הָשֵׁב רוּחִי
  choice: перевести дух
  rationale: Буквально сочетание означает «возвратить мой дух/дыхание», но в контексте непрерывных страданий речь о возможности отдышаться, получить передышку. Русская идиома «перевести дух» передаёт это естественно.
- source_word: כִּי
  choice: но
  rationale: Союз כִּי допускает причинное или противительное прочтение. Здесь противопоставление между невозможностью перевести дух и насыщением горечью естественно передаётся союзом «но»; причинное понимание отмечено сохранением смысловой связи контекста.
- source_word: יַשְׂבִּיעַנִי
  choice: насыщает меня
  rationale: Hiphil от שבע означает «насыщать, наполнять досыта». «Насыщает» сохраняет выразительную метафору чрезмерной полноты и её горькую иронию.
- source_word: מַמְּרֹרִים
  choice: горечью
  rationale: Форма множественного числа может означать «горькие вещи» или совокупность горьких переживаний. Абстрактное «горечью» звучит естественно и сохраняет образ страдания.
theological_decisions:
- issue: Референт подлежащего в глаголах
  choice: Сохранено местоимение «Он» без поясняющего имени
  alternative: Назвать Бога прямо
  rationale: Контекст указывает на Бога, однако сам стих выражает субъект местоименно; перевод не добавляет отсутствующего в строке имени.
- issue: Связь, выраженная כִּי
  choice: Противительное «но»
  alternative: Причинное «ведь/потому что»
  rationale: В данном поэтическом контексте כִּי может пониматься как вводящее причину или как усиливающее контраст. «Но» ясно передаёт контраст, не изменяя сути жалобы Иова.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической выразительности. «Перевести дух» — общеупотребительная идиома; «насыщает меня горечью» сохраняет образ исходного текста и его горькую иронию.
