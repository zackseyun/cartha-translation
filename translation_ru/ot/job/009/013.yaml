  yaml_path: translation/ot/job/009/013.yaml
  text: God does not turn back his anger; beneath him the helpers of Rahab crouch.
translation:
  language: ru
  text: 'Бог не отводит Своего гнева;

    под Ним согнулись помощники Рахава[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рахав — поэтическое имя враждебной Богу силы; его точное значение в этом образе не вполне ясно.
    reason: Сохраняет имя и поясняет его поэтическую функцию, не закрепляя спорное отождествление с единственной мифологической фигурой.
lexical_decisions:
- source_word: לֹא יָשִׁיב אַפּוֹ
  choice: не отвращает свой гнев
  rationale: Передаёт устойчивое сочетание со значением «не отводит / не обращает назад свой гнев», сохраняя категоричность высказывания.
- source_word: תַּחְתָּיו
  choice: под ним
  rationale: Сохранён конкретный пространственный образ исходного текста, а не более отвлечённое «перед ним».
- source_word: שָׁחֲחוּ
  choice: пригнулись
  rationale: Глагол обозначает поникшее, согбенное положение; «пригнулись» передаёт телесный образ покорения, не сводя его только к почтительному поклону.
- source_word: עֹזְרֵי רָהַב
  choice: помощники Рахава
  rationale: רָהַב понят как имя олицетворённой силы хаоса, что соответствует форме определённого персонажа и сохраняет загадочный образ текста.
theological_decisions:
- issue: Значение имени רָהַב
  choice: Рахав как олицетворённая сила хаоса
  alternative: «гордыня» или «гордецы»
  rationale: Сочетание «помощники Рахава» естественно указывает на именованную космическую силу и сохраняет древний поэтический образ, не превращая его в абстрактное нравственное понятие.
- issue: Характер покорения помощников Рахава
  choice: пригнулись
  alternative: поклонились
  rationale: Выбрано слово, выражающее вынужденное униженное положение под Божьей властью, без добавления идеи добровольного поклонения.
translation_notes:
  register: Современный литературный русский язык с кратким, весомым поэтическим синтаксисом. Строчный перенос сохраняет параллелизм двух частей стиха; местоимения, относящиеся к Богу, даны со строчной буквы по современной издательской норме.
