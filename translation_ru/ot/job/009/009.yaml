lexical_decisions:
- source_word: עֹשֶׂה
  choice: создал
  rationale: Причастие qal описывает Бога как Творца и продолжает характеристику Бога из предыдущих стихов. Прошедшее время естественно передаёт здесь Его творческое деяние, однако еврейская форма допускает и значение продолжающегося или характерного действия, что отмечено в сноске.
- source_word: עָשׁ
  choice: Медведицу
  rationale: Еврейское слово обозначает созвездие, обычно отождествляемое с Медведицей. Современное русское название понятнее транслитерации «Аш» и не смешивает созвездие с отдельной звездой Арктуром; некоторая неопределённость отождествления сохранена в сноске.
- source_word: כְּסִיל
  choice: Орион
  rationale: В астрономическом контексте это название обычно отождествляется с созвездием Ориона; употреблено его общепринятое русское название.
- source_word: כִימָה
  choice: Плеяды
  rationale: Название традиционно и обоснованно отождествляется со звёздным скоплением Плеяды; общепринятое русское название ясно для современного читателя.
- source_word: חַדְרֵי תֵמָן
  choice: чертоги юга
  rationale: Буквально — «внутренние покои/чертоги юга». «Чертоги» сохраняют возвышенный поэтический образ, а «юг» передаёт направительное значение תֵמָן, не превращая его без необходимости в географическое имя Теман.
