  yaml_path: translation/ot/job/009/017.yaml
  text: who crushes me in a storm and multiplies my wounds without cause[a][b][c].
translation:
  language: ru
  text: который сокрушает меня в буре[a][b] и умножает мои раны без причины[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бурей»; предлог может указывать на обстоятельство или орудие действия.'
    reason: lexical_alternative
  - marker: b
    text: Глагол можно также перевести как «поражает» или «наносит мне ушибы»; значение «набрасывается на меня» здесь менее вероятно.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ни за что», «без всякого основания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение продолжает описание Бога из предыдущего контекста; «который» естественно связывает этот стих с предшествующим.
- source_word: בִּשְׂעָרָה
  choice: в буре
  rationale: שְׂעָרָה означает бурю, ураган или вихрь. Предлог ב допускает значение сферы или образа действия («в буре»), а также орудия («бурей»); основной вариант сохраняет яркий образ и не устраняет неоднозначность полностью благодаря сноске.
- source_word: יְשׁוּפֵנִי
  choice: сокрушает меня
  rationale: Редкий глагол שׁוף здесь обозначает сильное повреждение; «сокрушает» соответствует параллели с умножением ран и передаёт тяжесть страдания.
- source_word: וְהִרְבָּה
  choice: и умножает
  rationale: Порода hифиль глагола רבה означает «делать многочисленным, увеличивать»; «умножает» кратко и выразительно сочетается со словом «раны».
- source_word: פְצָעַי
  choice: мои раны
  rationale: פצע прямо обозначает рану или телесное повреждение; «раны» естественно для поэтического контекста.
- source_word: חִנָּם
  choice: без причины
  rationale: חִנָּם может означать «даром, без причины, ни за что». «Без причины» сохраняет нравственную и судебную остроту жалобы Иова.
theological_decisions:
- issue: Означает ли חִנָּם утверждение абсолютной безгрешности Иова или выражает его протест против незаслуженного страдания
  choice: Передать прямо как «без причины», не смягчая жалобу Иова и не разрешая заложенное в ней богословское напряжение.
  alternative: «ни за что»; «без того, чтобы я это заслужил»
  rationale: Стих передаёт речь самого Иова. Перевод должен сохранять силу его протеста, не добавляя отсутствующего в тексте вывода о Божьей справедливости или абсолютной нравственной невиновности Иова.
translation_notes:
  register: Современный литературный русский язык с поэтической выразительностью. Синтаксическая незавершённость начального «который» намеренно сохраняет связь с предыдущим стихом; лексика ясна обычному читателю и не устраняет неоднозначность еврейского текста.
