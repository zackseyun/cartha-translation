source:
  edition: WLC
  text: כִּי לֹא אִ֣ישׁ כָּמֹ֣/נִי אֶֽעֱנֶ֑/נּוּ נָב֥וֹא יַ֝חְדָּ֗ו בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/032.yaml
  text: For he is not a man like me[a], that I should answer him, that we should come together in court.
translation:
  language: ru
  text: Ведь Он не человек, подобный мне, чтобы я мог ответить Ему и чтобы мы вместе предстали перед судом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит объяснение предыдущей жалобы Иова; «ведь» естественно передаёт обосновывающую связь в современном русском языке.
- source_word: לֹא אִישׁ
  choice: Он не человек
  rationale: אִישׁ здесь обозначает человека в противопоставлении Богу; русское «человек» естественно сохраняет смысл, не превращая грамматический мужской род в утверждение о поле.
- source_word: כָּמֹנִי
  choice: подобный мне
  rationale: Точно передаёт личное сравнение и поддерживает достоинство поэтической речи.
- source_word: אֶעֱנֶנּוּ
  choice: чтобы я мог ответить Ему
  rationale: Глагол ענה означает «ответить»; в контексте судебного спора выражение также подразумевает ответ другой стороне, но русский перевод сохраняет исходную многозначность.
- source_word: נָבוֹא יַחְדָּו
  choice: чтобы мы вместе предстали
  rationale: Первое лицо множественного числа включает Иова и Бога, а יַחְדָּו подчёркивает их совместное участие. «Предстали» естественно выражает явку в судебную обстановку.
- source_word: בַּמִּשְׁפָּט
  choice: перед судом
  rationale: מִשְׁפָּט может означать суд, судебное разбирательство или правосудие. Здесь судебная образность ясна; «перед судом» передаёт её конкретно и естественно.
theological_decisions:
- issue: Судебная образность спора Иова с Богом
  choice: Передать невозможность для Иова и Бога предстать перед судом как равным сторонам.
  alternative: «чтобы мы вместе пришли на суд» или «чтобы мы вместе вступили в тяжбу»
  rationale: Стих использует юридический язык, но не формулирует отдельного догматического положения; перевод сохраняет напряжение между желанием Иова ответить Богу и невозможностью судиться с Ним как с человеческим оппонентом.
- issue: Передача אִישׁ
  choice: «человек»
  alternative: «мужчина» или «муж»
  rationale: В данном противопоставлении существенно, что Бог не человек, подобный Иову, а не мужской пол как таковой. «Человек» точно и естественно передаёт смысл русского контекста.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской практике. Союзная конструкция сохраняет параллелизм двух еврейских глагольных форм.
