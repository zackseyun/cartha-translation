  text: אֲשֶׁ֣ר אִם צָ֭דַקְתִּי לֹ֣א אֶעֱנֶ֑ה לִ֝/מְשֹׁפְטִ֗/י אֶתְחַנָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/015.yaml
  text: Even if I were in the right, I would not answer; I would plead for mercy from my judge.
translation:
  language: ru
  text: Даже если бы я был прав, я не стал бы отвечать; я молил бы моего судью о милости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדַקְתִּי
  choice: я был прав
  rationale: Передаёт судебный контекст глагола צדק — быть правым, невиновным в тяжбе — естественным современным русским выражением.
- source_word: לֹא אֶעֱנֶה
  choice: я не стал бы отвечать
  rationale: Сохраняет значение судебного ответа или возражения, не уточняя сверх текста, кому именно направлен ответ.
- source_word: לִמְשֹׁפְטִי
  choice: моего судью
  rationale: Буквально обозначает того, кто судит говорящего; местоименная форма естественно передана притяжательной конструкцией.
- source_word: אֶתְחַנָּן
  choice: я молил бы … о милости
  rationale: Порода хитпаэль выражает настойчивую мольбу о благосклонности или милости; русский оборот сохраняет смиренный характер просьбы.
theological_decisions:
- issue: Отношение Иова к своей правоте перед судьёй
  choice: Сохранено условное «даже если бы я был прав» и противопоставление правоты мольбе о милости.
  alternative: «Хотя я невиновен» или пояснение, что судьёй является Бог.
  rationale: Еврейский текст формулирует гипотетическое условие и не называет Бога непосредственно в этом стихе; перевод не должен превращать условие в утверждение или добавлять отсутствующее именование.
translation_notes:
  register: Современный литературный русский язык; судебная образность и торжественно-сдержанный тон сохранены без архаизмов.
