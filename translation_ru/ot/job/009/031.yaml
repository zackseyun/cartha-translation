translation:
  language: ru
  text: тогда Ты погрузил бы меня в яму[a], и одежды мои возгнушались бы мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в канаву». Еврейское слово שַׁחַת может означать «яма», «канава», а в некоторых контекстах — «погибель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: тогда
  rationale: 'Временное наречие продолжает условное рассуждение предыдущего стиха: даже если Иов очистит себя, тогда последует это.'
- source_word: בַּשַּׁחַת
  choice: в яму
  rationale: שַׁחַת может обозначать яму, канаву или погибель. Здесь конкретный образ ямы хорошо сочетается с глаголом погружения и предшествующим образом омовения, не сужая смысл до абстрактной погибели.
- source_word: תִּטְבְּלֵנִי
  choice: Ты погрузил бы меня
  rationale: Глагол טבל означает «окунать, погружать». Условная форма естественно продолжает мысль предыдущего стиха, а местоимение «Ты» ясно передаёт обращение к Богу и мужской род второго лица единственного числа.
- source_word: וְתִעֲבוּנִי
  choice: возгнушались бы мной
  rationale: תעב выражает сильное отвращение. Форма множественного числа согласуется с последующим множественным «одежды»; «возгнушались» сохраняет интенсивность и достоинство поэтической речи.
- source_word: שַׂלְמוֹתָי
  choice: даже одежды мои
  rationale: 'Слово обозначает одежды, одеяния. Частица «даже» естественно выявляет заложенную в образе иронию: от Иова отшатнулось бы то, что непосредственно ему принадлежит; порядок «одежды мои» поддерживает возвышенный поэтический регистр.'
theological_decisions:
- issue: Кто совершает погружение
  choice: 'Слова обращены непосредственно к Богу: «Ты погрузил бы меня».'
  alternative: Безличное прочтение, при котором Иов просто оказался бы в яме.
  rationale: Глагол стоит во втором лице мужского рода единственного числа и продолжает прямое обращение Иова к Богу. Перевод сохраняет остроту жалобы и не смягчает обозначенную в тексте божественную субъектность.
- issue: Олицетворение одежд
  choice: Одежды представлены как испытывающие отвращение к Иову.
  alternative: 'Ослабленное объяснительное прочтение: Иов стал бы настолько нечист, что его одежды оказались бы отвратительными.'
  rationale: Множественный глагол «возгнушались» имеет прямым подлежащим «одежды мои». Сохранение олицетворения передаёт поэтическую силу и намеренную гиперболу оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавное «Ты» принято как редакционный знак почтительного обращения к Богу. Инверсия «одежды мои» сохраняет достоинство и ритм, оставаясь понятной современному читателю.
