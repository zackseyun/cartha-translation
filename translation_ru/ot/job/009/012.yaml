  yaml_path: translation/ot/job/009/012.yaml
  text: Look[a], if he snatches away, who can turn him back? Who can say to him[b], ‘What are you doing?’
translation:
  language: ru
  text: 'Вот, если Он схватит — кто сможет Его остановить?[a] Кто скажет Ему: «Что Ты делаешь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто обратит Его вспять?» Еврейский глагол означает внезапно, силой схватить или унести. Форма следующего глагола буквально означает «заставит его вернуться»; в контексте «его» обычно понимается как Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатический призыв обратить внимание и естественно звучит в современном литературном русском.
- source_word: יַחְתֹּף
  choice: схватит добычу
  rationale: Глагол חטף обозначает внезапный, силовой захват; добавление «добычу» естественно передаёт подразумеваемый объект, не отождествляя суффикс следующего глагола с захваченным предметом.
- source_word: יְשִׁיבֶנּוּ
  choice: заставит Его вернуть её
  rationale: Порода hифиль у שוב означает «заставить возвратить / вернуть». Масоретское написание допускает понимание суффикса как относящегося к Богу; по-русски для ясности подразумеваемый объект возврата выражен местоимением «её».
- source_word: מִי
  choice: кто
  rationale: Риторическая невозможность ясно следует из контекста; добавлять «может» необязательно.
- source_word: יֹאמַר אֵלָיו
  choice: скажет Ему
  rationale: Прямой и естественный перевод без добавления толкования о протесте.
- source_word: מַה תַּעֲשֶׂה
  choice: Что Ты делаешь?
  rationale: Имперфект в формуле вызова естественно передаётся русским настоящим временем.
theological_decisions:
- issue: Референт местоименного суффикса 3-го лица мужского рода в יְשִׁיבֶנּוּ
  choice: 'Понимать суффикс лично, как относящийся к Богу: «заставит Его вернуть её».'
  alternative: 'Понимать суффикс как захваченное: «кто вернёт это?» либо передать «кто отвратит Его?»'
  rationale: Консонантный текст и масоретское разделение формы поддерживают личный референт, а следующая строка непосредственно говорит Богу «Ему». При этом каузативное значение שוב сохранено, и подразумеваемое возвращение захваченного выражено явно.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаичной интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Риторическая краткость оригинала сохранена; неоднозначность יְשִׁיבֶנּוּ отмечена в сноске.
