lexical_decisions:
- source_word: אֳנִיּוֹת אֵבֶה
  choice: тростниковые лодки
  rationale: Редкое сочетание обозначает лёгкие лодки, вероятно сделанные из тростника или папируса; «тростниковые лодки» естественно по-русски и соответствует принятому в консультационном слое решению.
- source_word: חָלְפוּ
  choice: проносятся
  rationale: Глагол выражает быстрое прохождение мимо; настоящее время сохраняет образ стремительно уходящих дней из ближайшего контекста.
- source_word: נֶשֶׁר
  choice: орёл
  rationale: Обычное контекстуальное соответствие для крупной хищной птицы; сохраняет традиционный и ясный образ.
- source_word: יָטוּשׂ עֲלֵי אֹכֶל
  choice: устремляющийся на добычу
  rationale: Передаёт стремительное движение хищной птицы к пище; «добыча» естественнее буквального «пища» в данном образе.
