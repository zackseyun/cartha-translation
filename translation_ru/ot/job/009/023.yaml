base_translation:
  language: en
  yaml_path: translation/ot/job/009/023.yaml
  text: If a scourge kills suddenly[a], he mocks the calamity of the innocent.
translation:
  language: ru
  text: Если бич внезапно убивает, он смеётся над испытанием невинных[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он смеётся над крушением невинных»; возможно также: «над тем, как невинные угасают». Еврейское слово может означать испытание, таяние, упадок или крушение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет прямое условное значение частицы, не превращая его в более определённое «когда».
- source_word: שׁוֹט
  choice: бич
  rationale: Передаёт как конкретный образ орудия наказания, так и переносное значение сокрушительного бедствия.
- source_word: יָמִית
  choice: убивает
  rationale: 'Точно и естественно передаёт каузативную форму глагола מות: «причиняет смерть».'
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Краткое и обычное соответствие еврейскому наречию.
- source_word: לְמַסַּת
  choice: над испытанием
  rationale: Слово допускает значения испытания, таяния, упадка или крушения; «испытание» сохраняет объективную направленность выражения и не сводит его к внутреннему чувству отчаяния.
- source_word: נְקִיִּם
  choice: невинных
  rationale: Естественно обозначает людей, свободных от вины, и соответствует спору Иова о незаслуженном страдании.
- source_word: יִלְעָג
  choice: смеётся над
  rationale: Передаёт насмешливый, издевательский оттенок глагола и звучит естественно в современном русском языке.
theological_decisions:
- issue: Субъект глагола «смеётся»
  choice: Местоимение «Он» контекстуально указывает на Бога, но имя Бога в текст не добавлено.
  alternative: 'Олицетворённый бич выступает субъектом: «он смеётся»; либо подразумевается неопределённый субъект.'
  rationale: В контексте Иов говорит о Божьем управлении миром и высказывает острое обвинение. Местоимение сохраняет напряжение и не вставляет в стих отсутствующее в еврейском тексте имя.
- issue: Значение לְמַסַּת
  choice: «над испытанием невинных»
  alternative: «над крушением невинных», «над отчаянием невинных» или «над тем, как невинные угасают»
  rationale: Еврейское существительное неоднозначно и может обозначать испытание либо таяние, упадок и крушение. Основной текст выбирает традиционно возможное «испытание», а примечание сохраняет существенные альтернативы.
translation_notes:
  register: Современный литературный русский язык; краткая, резкая по интонации фраза сохраняет обвинительную силу слов Иова. Заглавное «Он» помогает обозначить наиболее вероятного контекстуального референта, не добавляя имени Бога в сам текст.
