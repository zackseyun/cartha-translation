  text: אִם קָרָ֥אתִי וַֽ/יַּעֲנֵ֑/נִי לֹֽא אַ֝אֲמִ֗ין כִּֽי יַאֲזִ֥ין קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/016.yaml
  text: If I called and he answered me[a], I would not believe that he was listening to my voice.
translation:
  language: ru
  text: Если бы я воззвал и Он ответил мне, я бы не поверил, что Он внимает моему голосу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Если бы
  rationale: Передаёт условно-гипотетический характер высказывания в современном русском языке, не превращая его во временное «когда».
- source_word: קָרָאתִי
  choice: я воззвал
  rationale: В контексте обращения к Богу «воззвал» естественно передаёт «позвал, обратился с мольбой», сохраняя возвышенный, но понятный регистр.
- source_word: וַיַּעֲנֵנִי
  choice: Он ответил мне
  rationale: Прямо и идиоматично передаёт значение глагола ענה «ответить».
- source_word: לֹא אַאֲמִין
  choice: я бы не поверил
  rationale: Условное наклонение в русском ясно выражает модальное значение имперфекта внутри гипотетической конструкции.
- source_word: כִּי
  choice: что
  rationale: Вводит содержание того, чему Иов не поверил бы, а не причинное придаточное.
- source_word: יַאֲזִין
  choice: внял
  rationale: Передаёт не просто слышание, а внимательное прислушивание; совершенный вид естественно согласуется с гипотетическим ответом Бога.
- source_word: קוֹלִי
  choice: моему голосу
  rationale: Сохраняет буквальный образ еврейского קוֹלִי и не подменяет его истолковывающим «моей мольбе».
theological_decisions:
- issue: Характер сомнения Иова в Божьем ответе
  choice: Передать личную невозможность Иова поверить, что Бог действительно внял ему, даже если бы получил ответ.
  alternative: Сформулировать как безусловное отрицание того, что Бог вообще слышит молитвы, либо ослабить до простого удивления.
  rationale: Условная конструкция выражает субъективное недоверие Иова в воображаемой ситуации, а не отвлечённое учение о том, слышит ли Бог молитвы. Перевод сохраняет напряжение текста, не разрешая его богословски.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Воззвал» и «внял» уместны в молитвенно-судебном контексте и при этом остаются понятными широкому читателю. Местоимение «Он» написано с прописной буквы как принятое в русском религиозном письме обозначение Бога.
