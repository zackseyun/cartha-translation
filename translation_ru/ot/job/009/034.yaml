  text: יָסֵ֣ר מֵ/עָלַ֣/י שִׁבְט֑/וֹ וְ֝/אֵמָת֗/וֹ אַֽל תְּבַעֲתַֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/034.yaml
  text: Let him remove his rod from upon me[a], and let not his terror frighten me.
translation:
  language: ru
  text: Пусть он уберёт с меня свой жезл[a], и пусть его ужас не приводит меня в смятение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть он отведёт от меня свой жезл».'
    reason: 'Лексическая альтернатива: יָסֵר может означать как удаление, так и отведение в сторону; מֵעָלַי допускает более идиоматичное «от меня».'
lexical_decisions:
- source_word: יָסֵר
  choice: пусть он уберёт
  rationale: Хифиль от סור в данном контексте имеет побудительно-желательное значение. Оборот «пусть он уберёт» естественно передаёт просьбу или пожелание Иова.
- source_word: מֵעָלַי
  choice: с меня
  rationale: Предлог буквально передаёт движение «с того, что находится на мне». «С меня» сохраняет образ тяжести, лежащей на Иове, и звучит естественно по-русски.
- source_word: שִׁבְטוֹ
  choice: свой жезл
  rationale: שֵׁבֶט может означать жезл, посох или орудие наказания. В контексте страданий Иова «жезл» сохраняет конкретный образ карающей власти, не сужая его до буквальной розги.
- source_word: וְאֵמָתוֹ
  choice: и его ужас
  rationale: אֵימָה обозначает ужас, трепет или страх, внушаемый чьим-либо присутствием и могуществом. Буквальное «его ужас» сохраняет сжатость и напряжённость еврейской поэзии.
- source_word: אַל
  choice: и пусть ... не
  rationale: Отрицательная частица при следующем глаголе выражает запрет или пожелание. Конструкция «пусть ... не» соответствует параллельной побудительной форме первой строки.
- source_word: תְּבַעֲתַנִּי
  choice: не устрашает меня
  rationale: Глагол בעת означает «ужасать, пугать, приводить в смятение». «Устрашает» соответствует возвышенному поэтическому регистру и избегает разговорного оттенка.
theological_decisions:
- issue: К кому относятся местоимения третьего лица
  choice: 'Бог упомянут косвенно: «он», «свой», «его», а не прямо: «ты», «твой».'
  alternative: 'Прямое обращение: «Убери от меня Твой жезл, и пусть Твой ужас не устрашает меня».'
  rationale: В еврейском тексте стоят формы третьего лица единственного числа и местоименный суффикс третьего лица. Перевод сохраняет грамматику речи Иова о Боге и не превращает её в прямое обращение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с обычной современной орфографической практикой и без внесения конфессиональной стилизации.
