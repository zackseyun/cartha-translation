lexical_decisions:
- source_word: הָאֹמֵר
  choice: Он говорит
  rationale: Причастие продолжает описание Бога из предыдущего контекста. Личная форма естественна по-русски и сохраняет последовательность поэтического описания.
- source_word: לַחֶרֶס
  choice: солнцу
  rationale: В сочетании с глаголом «восходить» и упоминанием звёзд редкое поэтическое חֶרֶס обозначает солнце, а не глину или черепок.
- source_word: וְלֹא יִזְרָח
  choice: «Не восходи»
  rationale: Имперфект после «говорит солнцу» можно понять как содержание властного повеления; это сохраняет яркое олицетворение. Возможное результативное прочтение отмечено в сноске.
- source_word: וּבְעַד
  choice: и
  rationale: Предлог בְּעַד вместе с חתם создаёт образ закрывания или преграждения. В русском выражение «запечатывает звёзды» передаёт образ без неестественного буквального воспроизведения предлога.
- source_word: כּוֹכָבִים
  choice: звёзды
  rationale: Обычное значение существительного во множественном числе; определённость естественно следует из космического контекста.
- source_word: יַחְתֹּם
  choice: запечатывает
  rationale: Глагол חתם означает наложение печати и здесь образно передаёт Божью власть скрыть звёзды или не дать им сиять.
theological_decisions:
- issue: Повеление или результат Божьего слова
  choice: 'Прямая речь: «Не восходи»'
  alternative: «и оно не восходит»
  rationale: Синтаксис допускает оба понимания. Основной текст выбирает живое повелительное прочтение, не устраняя альтернативу, которая приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим звучанием. Сохранены олицетворение солнца и образ запечатывания звёзд; подлинная синтаксическая неоднозначность вынесена в сноску.
