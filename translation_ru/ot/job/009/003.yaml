  yaml_path: translation/ot/job/009/003.yaml
  text: If one wished to contend with him[b][a], he could not answer him one time out of a thousand.
translation:
  language: ru
  text: Если бы кто захотел вступить с Ним в спор[a], то не смог бы ответить Ему ни разу из тысячи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол «спорить» может здесь подразумевать судебную тяжбу: «судиться с Ним» или «вести с Ним тяжбу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не ответил бы Ему один из тысячи»; по смыслу — не смог бы ответить даже ни разу из тысячи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יַחְפֹּץ
  choice: Если бы кто захотел
  rationale: Условная конструкция передаёт гипотетическое желание или намерение; неопределённое «кто» естественно выражает подразумеваемого человека.
- source_word: לָרִיב עִמּוֹ
  choice: вступить с Ним в спор
  rationale: ריב обозначает спор и может иметь оттенок судебной тяжбы. Эта формулировка сохраняет как общий состязательный, так и возможный юридический смысл.
- source_word: לֹא יַעֲנֶנּוּ
  choice: не смог бы ответить Ему
  rationale: Форма буквально допускает «не ответил бы», но контекст Божьей мудрости и силы указывает прежде всего на неспособность человека дать ответ.
- source_word: אַחַת מִנִּי אָלֶף
  choice: и разу из тысячи
  rationale: 'Естественная русская идиома передаёт гиперболический смысл: человек не смог бы дать даже одного ответа на тысячу.'
theological_decisions:
- issue: К кому относятся местоимения
  choice: Прописные «Ним» и «Ему» контекстуально указывают на Бога, не вставляя Его имя в текст.
  alternative: Сохранить строчные местоимения и оставить референт полностью неуточнённым.
  rationale: В Иов 9:2–4 речь явно идёт о споре человека с Богом. Русская традиция прописных местоимений делает референт понятным, тогда как существительное «Бог» в еврейском стихе прямо не повторяется.
- issue: Модальность לֹא יַעֲנֶנּוּ
  choice: «не смог бы ответить» — неспособность человека.
  alternative: «не ответил бы» — простое отрицание будущего или условного действия.
  rationale: Ближайший контекст подчёркивает Божью мудрость и могущество, поэтому речь идёт не о нежелании, а о невозможности успешно отвечать Ему; примечание отмечает более буквальную форму.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Формулировка сохраняет условность, юридический оттенок спора и гиперболу оригинала; «и разу» естественно выражает усиленное отрицание.
