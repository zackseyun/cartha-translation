  text: Then I would speak and not fear him[a], for I am not so in myself.
translation:
  language: ru
  text: Тогда я говорил бы и не боялся Его, ведь сам по себе я не таков.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь со мной дело обстоит не так»; более буквально: «ведь не так я с самим собой». Заключительная фраза на еврейском эллиптична.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַבְּרָה
  choice: Тогда я говорил бы
  rationale: Форма 1-го лица выражает намерение или возможность, зависящую от условия, описанного в предыдущем стихе; «тогда» естественно передаёт эту контекстуальную связь.
- source_word: וְלֹא אִירָאֶנּוּ
  choice: и не боялся Его
  rationale: Глагол ירא с местоименным суффиксом 3-го лица мужского рода прямо означает «бояться его». Условное значение передано общей конструкцией «говорил бы… и не боялся».
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего утверждения; «ведь» звучит естественно в современной русской речи и сохраняет пояснительную связь.
- source_word: לֹא כֵן אָנֹכִי עִמָּדִי
  choice: сам по себе я не таков
  rationale: Заключительная фраза эллиптична. Этот перевод сохраняет отрицание, указательное значение כֵן и самореферентный оттенок עִמָּדִי, не уточняя сверх текста, в каком именно смысле Иов «не таков».
theological_decisions:
- issue: Смысл эллиптической заключительной фразы
  choice: «ведь сам по себе я не таков»
  alternative: «ведь со мной дело обстоит не так»
  rationale: Еврейская фраза допускает более одного понимания и не называет явно, к чему относится «не так». Основной перевод сохраняет эту напряжённость и не превращает слова Иова в определённое психологическое или богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и контекстуально связанным синтаксисом. Заглавное «Его» обозначает Бога согласно принятой русской издательской норме, не изменяя референцию местоимения.
