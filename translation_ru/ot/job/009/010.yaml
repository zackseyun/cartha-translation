lexical_decisions:
- source_word: עֹשֶׂה
  choice: Он совершает
  rationale: Причастие qal описывает продолжающуюся деятельность Бога и по смыслу связано с предшествующим контекстом. В современном русском личная форма с явно выраженным местоимением звучит естественно.
- source_word: גְדֹלוֹת
  choice: великое
  rationale: Субстантивированное прилагательное обозначает великие дела или деяния в широком смысле; «великое» не сужает значение до какого-либо одного рода действий.
- source_word: עַד אֵין חֵקֶר
  choice: что невозможно исследовать
  rationale: Еврейский оборот указывает на недоступность полного исследования и постижения Божьих великих дел. Формулировка передаёт идиому ясно и без архаизма.
- source_word: וְנִפְלָאוֹת
  choice: и чудеса
  rationale: Слово обозначает необычайные, вызывающие изумление деяния; «чудеса» кратко и естественно передаёт этот смысл.
- source_word: עַד אֵין מִסְפָּר
  choice: которым нет числа
  rationale: Оборот означает неисчислимое множество и сохраняет образ счёта, а также поэтический параллелизм второй строки.
