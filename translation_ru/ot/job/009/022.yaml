lexical_decisions:
- source_word: אַחַת הִיא
  choice: Всё одно
  rationale: Идиома выражает одинаковость результата и практическое отсутствие различия, а не буквально числительное «одно».
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Ясно передаёт вывод, который Иов делает из предшествующего утверждения.
- source_word: אָמַרְתִּי
  choice: я говорю
  rationale: Хотя еврейская форма — перфект, в данном контексте она может вводить высказанный Иовом вывод как актуальное утверждение; возможное прошедшее значение сохранено в сноске.
- source_word: תָּם
  choice: непорочный
  rationale: Обозначает человека цельного и безупречного в своём поведении, не утверждая абсолютной безгрешности.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Традиционное и точное обозначение нравственно виновного человека, образующее естественную смысловую пару с «непорочным».
- source_word: הוּא מְכַלֶּה
  choice: Он губит
  rationale: Мужское местоимение и причастие в контексте естественнее всего указывают на Бога; «губит» передаёт доведение до гибели или конца без излишнего усиления.
theological_decisions:
- issue: Подразумеваемый субъект выражения הוּא מְכַלֶּה
  choice: Личное «Он», относящееся к Богу в речи Иова
  alternative: 'Безличное понимание: «это губит»'
  rationale: В Иов 9 речь идёт о Божьем владычестве и непреодолимой силе. Формулировка сохраняет резкую богословскую жалобу Иова, не смягчая её; менее личное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, резкая формулировка сохраняет мрачный вывод Иова и параллель «непорочного — нечестивого».
