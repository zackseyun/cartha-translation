  text: לֹ֣א יֵשׁ בֵּינֵ֣י/נוּ מוֹכִ֑יחַ יָשֵׁ֖ת יָד֣/וֹ עַל שְׁנֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/033.yaml
  text: There is no arbiter between us[a], who might lay his hand on us both.
translation:
  language: ru
  text: Нет между нами третейского судьи[a], который возложил бы свою руку на нас обоих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредника». Еврейское слово может обозначать того, кто разрешает спор между двумя сторонами или вмешивается в него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֵשׁ
  choice: Нет
  rationale: Естественная русская передача еврейской конструкции существования с отрицанием.
- source_word: בֵּינֵינוּ
  choice: между нами
  rationale: Предлог с суффиксом первого лица множественного числа обозначает положение между двумя сторонами спора.
- source_word: מוֹכִיחַ
  choice: третейского судьи
  rationale: В судебном контексте причастие от יכח обозначает третью сторону, способную рассудить спорящих. Выражение «третейский судья» передаёт этот смысл и не вносит в текст более позднее богословское толкование.
- source_word: יָשֵׁת
  choice: возложил бы
  rationale: Форма выражает предполагаемое действие отсутствующего судьи; условное наклонение естественно передаёт этот оттенок по-русски.
- source_word: יָדוֹ
  choice: свою руку
  rationale: Сохранён конкретный еврейский образ руки, который в контексте может также подразумевать власть над обеими сторонами.
- source_word: עַל שְׁנֵינוּ
  choice: на нас обоих
  rationale: Передаёт одинаковое отношение судьи к обеим сторонам и сохраняет пространственный образ оригинала.
theological_decisions:
- issue: Следует ли передавать מוֹכִיחַ словом «посредник», способным вызвать христологические ассоциации
  choice: третейский судья
  alternative: посредник
  rationale: Непосредственный контекст — жалоба Иова на отсутствие того, кто мог бы рассудить его спор с Богом. Основной вариант сохраняет судебный смысл, не устраняя возможного более широкого оттенка, который отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной судебной образностью. Оборот «возложил бы свою руку» сохраняет конкретную и торжественную метафору оригинала, не истолковывая её как власть или принуждение непосредственно в основном тексте.
