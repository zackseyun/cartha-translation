    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: земля
  rationale: Слово может обозначать как всю землю, так и отдельную страну. В речи Иова о всеобщем порядке и несправедливости «земля» лучше передаёт широкий смысл, а более узкое значение отмечено в сноске.
- source_word: נִתְּנָה
  choice: отдана
  rationale: 'Страдательная форма глагола נתן выражает совершившееся действие и возникшее состояние: земля оказалась переданной во власть другого.'
- source_word: בְיַד
  choice: в руки
  rationale: Еврейское выражение буквально говорит о передаче «в руку», то есть во власть. Русское «отдана в руки» сохраняет образ и звучит естественно.
- source_word: רָשָׁע
  choice: нечестивца
  rationale: Форма стоит в единственном числе и может обозначать конкретного нечестивого человека либо нечестивого как обобщённый образ. «Нечестивец» сохраняет личный и нравственный смысл слова, не уточняя, кто именно имеется в виду.
- source_word: פְּנֵי שֹׁפְטֶיהָ
  choice: лица её судей
  rationale: Сохранены конкретные значения «лица» и «судьи», а местоимение «её» отнесено к земле.
- source_word: יְכַסֶּה
  choice: он закрывает
  rationale: Глагол имеет форму третьего лица мужского рода единственного числа и буквально означает «закрывает, покрывает». Местоимение требуется для естественной русской фразы, однако его референт намеренно не назван и пояснён в сноске.
- source_word: אִם לֹא אֵפוֹא מִי הוּא
  choice: Если не он, то кто же?
  rationale: Краткий риторический вопрос сохраняет условную конструкцию, усилительную частицу «же» и не вводит имени действующего лица.
theological_decisions:
- issue: Кто закрывает лица судей и подразумевается в вопросе «кто же?»
  choice: Личность действующего лица прямо не названа; употреблено только местоимение «он».
  alternative: Назвать действующим лицом Бога, нечестивого правителя либо передать предложение безлично или страдательно.
  rationale: Контекст может побуждать видеть здесь Бога как окончательного распорядителя происходящего или нечестивца как непосредственного виновника, но еврейский текст не называет подлежащего при יְכַסֶּה. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным поэтическим строем. Сохранены конкретные образы руки и закрытых лиц; риторическая концовка передана без разъясняющей вставки.
