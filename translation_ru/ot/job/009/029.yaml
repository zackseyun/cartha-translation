  text: אָנֹכִ֥י אֶרְשָׁ֑ע לָ/מָּה זֶּ֝֗ה הֶ֣בֶל אִיגָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/009/029.yaml
  text: I will be condemned[a]; why then should I labor in vain?
translation:
  language: ru
  text: Я буду признан виновным[a] — зачем же мне напрасно трудиться?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я буду нечестивым». Еврейский глагол может означать как «быть нечестивым», так и «быть признанным виновным».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָנֹכִי
  choice: Я
  rationale: Самостоятельное местоимение первого лица имеет эмфатический оттенок; явное «я» естественно сохраняет его в русском.
- source_word: אֶרְשָׁע
  choice: буду признан виновным
  rationale: Форма Qal глагола רשע допускает как нравственный смысл «быть нечестивым», так и судебный «быть признанным виновным». В контексте спора Иова о невозможности доказать свою правоту перед Богом предпочтителен судебный смысл; форма будущего времени передаёт модально-временную направленность высказывания.
- source_word: לָמָה זֶּה
  choice: зачем же
  rationale: Сочетание буквально включает «почему это», но функционирует идиоматически как усиленный вопрос о смысле дальнейшего действия; «зачем же» естественно выражает вывод из предыдущего утверждения.
- source_word: הֶבֶל
  choice: напрасно
  rationale: הבל обозначает пустоту, тщетность, бесполезность; здесь наречное «напрасно» ясно характеризует усилия Иова как не имеющие результата.
- source_word: אִיגָע
  choice: мне трудиться
  rationale: Глагол יגע означает трудиться, изнурять себя, утомляться. Инфинитивная конструкция после «зачем» естественно передаёт риторический вопрос по-русски.
theological_decisions:
- issue: Судебный или нравственный смысл רשע
  choice: «буду признан виновным» — судебный смысл
  alternative: «буду нечестивым» — нравственно-описательный смысл
  rationale: Ближайший контекст посвящён невозможности Иова утвердить свою невиновность перед Богом и перспективе оказаться виновным несмотря на попытки очиститься (9:28–31). Судебная формулировка поддерживает ход аргумента, а сноска сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, напряжённая риторическая фраза. «Признан виновным» сохраняет судебный контекст, а сноска — нравственную альтернативу. Тире передаёт резкий вывод без добавления нового содержания.
