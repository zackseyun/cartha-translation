  language: ru
  text: Вот, ты наставлял[a] многих и укреплял слабые руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вразумлял» или «исправлял»; еврейский глагол может обозначать наставление посредством исправления или обличения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к последующему утверждению; «вот» сохраняет выразительность поэтической речи и естественно звучит по-русски.
- source_word: יִסַּרְתָּ
  choice: наставлял
  rationale: Глагол יסר охватывает наставление, вразумление и исправление, в том числе посредством обличения. В контексте Елифаз говорит о том, как Иов прежде помогал другим, поэтому «наставлял» передаёт основной положительный смысл, не сводя его к наказанию.
- source_word: רַבִּים
  choice: многих
  rationale: Прямое и естественное соответствие количественному обозначению «многие».
- source_word: יָדַיִם רָפוֹת
  choice: ослабевшие руки
  rationale: Сохранён телесный образ рук, утративших силу; причастие «ослабевшие» также передаёт подразумеваемые бессилие и уныние.
- source_word: תְּחַזֵּק
  choice: укреплял
  rationale: Порода piel глагола חזק означает «делать сильным, укреплять». Русское прошедшее несовершенного вида согласуется с описанием привычной деятельности Иова и образует естественный параллелизм с «наставлял».
