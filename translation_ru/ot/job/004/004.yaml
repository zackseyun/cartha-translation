    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹשֵׁל
  choice: споткнувшегося
  rationale: Причастие от כשל обозначает того, кто спотыкается, шатается или теряет опору. Субстантивированное «споткнувшегося» сохраняет конкретный образ и естественно сочетается с «поднимали».
- source_word: יְקִימוּן
  choice: поднимали
  rationale: 'Порода hифиль глагола קום имеет каузативное значение: поставить на ноги, поднять, поддержать. Несовершенный вид в русском естественно передаёт прежнюю, характерную для Иова помощь людям и согласуется с единственным числом «споткнувшегося».'
- source_word: מִלֶּיךָ
  choice: твои слова
  rationale: Прямой и естественный перевод множественного числа מִלָּה; сохраняет указание на словесное ободрение.
- source_word: בִרְכַּיִם
  choice: колени
  rationale: Буквальный образ понятен по-русски и сохраняет поэтический параллелизм.
- source_word: כֹּרְעוֹת
  choice: готовые подогнуться
  rationale: Причастие от כרע описывает колени, которые сгибаются или оседают от слабости. Такой перевод естественно выражает угрожающее падение, не устраняя телесный образ.
- source_word: תְּאַמֵּץ
  choice: ты укреплял
  rationale: Пиэль от אמץ означает делать крепким, укреплять. Несовершенный вид передаёт обычное прежнее действие и поддерживает параллелизм с «поднимали».
