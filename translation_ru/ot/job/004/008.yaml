lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Как
  rationale: В сочетании «как я видел» вводит основанное на опыте наблюдение Елифаза и сохраняет сравнительно-обобщающий характер еврейского оборота.
- source_word: רָאִיתִי
  choice: я видел
  rationale: Перфект первого лица передаёт личное наблюдение говорящего; в русском контексте прошедшее время естественно выражает приобретённый опыт.
- source_word: חֹרְשֵׁי
  choice: те, кто пашет
  rationale: Субстантивированное причастие передано естественной русской конструкцией с сохранением земледельческой метафоры.
- source_word: אָוֶן
  choice: беззаконие
  rationale: В данном нравственно окрашенном контексте слово обозначает зло или неправедность; «беззаконие» ясно передаёт этический смысл, не смешивая его с последующей «бедой».
- source_word: וְזֹרְעֵי
  choice: и сеет
  rationale: Однородная конструкция продолжает земледельческую метафору; повторение «те, кто» по-русски не требуется.
- source_word: עָמָל
  choice: беду
  rationale: Слово может обозначать бедствие, страдание или причиняемый вред. «Беда» естественно сочетается с глаголом «сеять» и сохраняет смысл причиняемого и последующего несчастья.
- source_word: יִקְצְרֻהוּ
  choice: то и пожинают
  rationale: Формула «то и пожинают» естественно связывает жатву с ранее названными беззаконием и бедой, передаёт возвратный смысл местоименного суффикса и сохраняет образ сева и жатвы.
theological_decisions:
- issue: Нравственная причинность в речи Елифаза
  choice: Высказывание передано прямо как наблюдаемый Елифазом принцип соответствующего воздаяния.
  alternative: Представить его либо как безусловный богословский закон, либо лишь как неопределённую общую тенденцию.
  rationale: Стих является частью довода Елифаза. Перевод сохраняет силу его утверждения, но не добавляет оговорок и не выдаёт его слова за окончательный богословский вывод всей книги.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм «пашет… сеет… пожинают» сохранён; формула «то и» подчёркивает соответствие поступка и результата, не усиливая слова Елифаза до авторского абсолютного тезиса.
