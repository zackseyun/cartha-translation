  text: 'Please remember: who that was innocent ever perished? Or where were the upright cut off?[a][b]'
translation:
  language: ru
  text: 'Вспомни же: разве невинный когда-нибудь погибал?[a] И где были уничтожены праведные?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безвинный» вместо «невинный».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были искоренены» / «были истреблены» вместо «были уничтожены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Вспомни же
  rationale: Императив זְכָר призывает вспомнить или задуматься, а частица נָא смягчает либо подчёркивает побуждение. «Вспомни же» естественно передаёт обе функции без архаичного «прошу тебя».
- source_word: מִי הוּא
  choice: разве … когда-нибудь
  rationale: Сочетание вопросительного местоимения с הוּא придаёт вопросу эмфатический риторический характер. В русском он естественно выражается конструкцией «разве … когда-нибудь».
- source_word: נָקִי
  choice: невинный
  rationale: Слово обозначает невиновного, свободного от вины человека; «невинный» ясно и непосредственно передаёт смысл в контексте нравственного утверждения Елифаза.
- source_word: אָבָד
  choice: погибал
  rationale: Форма от אבד означает погибнуть, пропасть или прийти к гибели. Несовершенный вид «погибал» уместен в обобщающем риторическом вопросе.
- source_word: וְאֵיפֹה
  choice: И где
  rationale: Союз וְ соединяет параллельные риторические вопросы; буквальное и естественное русское соответствие — «И где».
- source_word: יְשָׁרִים
  choice: праведные
  rationale: Субстантивированное множественное прилагательное обозначает нравственно прямых, честных людей. «Праведные» естественно в данном библейском контексте, хотя «честные» или «прямодушные» также возможны.
- source_word: נִכְחָדוּ
  choice: были истреблены
  rationale: Нифаль от כחד здесь передаёт устранение или уничтожение и сохраняет страдательный результативный оттенок. «Были истреблены» ясно выражает тяжесть глагола и параллель с «погибал».
theological_decisions:
- issue: Риторическое утверждение Елифаза о судьбе невинных и праведных
  choice: Передать вопрос прямо как безоговорочное риторическое утверждение самого Елифаза.
  alternative: Смягчить формулировку или обозначить в тексте, что дальнейшее развитие книги оспаривает его взгляд.
  rationale: 'Перевод должен сохранять богословское напряжение книги: не одобрять тезис Елифаза от лица повествователя, но и не вводить в его слова последующую критику.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллелизм двух риторических вопросов сохранён; формулировка остаётся понятной обычному читателю и не сглаживает спорность тезиса Елифаза.
