  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִ/נִּשְׁמַ֣ת אֱל֣וֹהַ יֹאבֵ֑דוּ וּ/מֵ/ר֖וּחַ אַפּ֣/וֹ יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/009.yaml
  text: By the breath of God they perish[c][b][a], and by the blast of his anger they come to an end.
translation:
  language: ru
  text: От дыхания Бога они погибают[a], и от дуновения[b] Его гнева им приходит конец[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыханием Бога они погибают». Еврейский предлог может указывать как на источник, так и на средство или причину.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово также может означать «ветер», «дыхание» или «дух»; здесь оно обозначает губительное дуновение, связанное с Божьим гневом.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «они истребляются».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: от дыхания
  rationale: נְשָׁמָה означает «дыхание», а предлог מִן здесь допускает значение источника или причины/средства. Русское «от дыхания» естественно передаёт причинность и при этом не устраняет исходную неоднозначность.
- source_word: אֱלוֹהַ
  choice: Бога
  rationale: אֱלוֹהַ — поэтическая форма единственного числа со значением «Бог», особенно характерная для книги Иова. Добавочные определения в исходном тексте отсутствуют.
- source_word: יֹאבֵדוּ
  choice: они погибают
  rationale: Глагол אבד выражает значение гибели или уничтожения. «Погибают» сохраняет непереходную форму и подходит к поэтическому параллелизму.
- source_word: וּמֵרוּחַ
  choice: и от дуновения
  rationale: רוּחַ может означать ветер, дыхание, дуновение или дух. В параллели с «дыханием» и в сочетании с гневом речь идёт о губительном выдохе или порыве; «дуновение» сохраняет образ и не вызывает здесь неуместного представления о Духе.
- source_word: אַפּוֹ
  choice: Его гнева
  rationale: אַף буквально означает «нос, ноздри», а переносно — «гнев». В данном сочетании идиоматическое значение — гнев; телесный образ отчасти сохраняется словом «дуновение».
- source_word: יִכְלוּ
  choice: им приходит конец
  rationale: כלה в породе qal может означать «заканчиваться, иссякать, быть истреблённым». Выражение «им приходит конец» передаёт результативность и не уточняет способ гибели сверх сказанного в еврейском тексте.
theological_decisions:
- issue: Антропоморфный образ Божьего гнева
  choice: Идиоматически передать אַפּוֹ как «Его гнева», сохранив образ дуновения.
  alternative: «дуновение Его ноздрей» или «дуновение Его ярости»
  rationale: Буквальные «ноздри» затруднили бы понимание устойчивой еврейской метафоры, тогда как «гнев» ясно передаёт её смысл. При этом «дуновение» сохраняет конкретный поэтический образ и не добавляет богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. Синтаксический параллелизм оригинала сохранён; неоднозначность предлога и широкий смысловой диапазон רוּחַ отмечены в сносках.
