  text: The lion perishes for lack of prey[a], and the cubs of the lion are scattered.
translation:
  language: ru
  text: Лев гибнет без добычи, и львята[a] рассеиваются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья льва/львицы». Еврейское לָבִיא может обозначать льва или львицу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: лев
  rationale: Слово обозначает льва, возможно с оттенком силы или зрелости; простое «лев» естественно и не вносит излишней конкретизации.
- source_word: אֹבֵד
  choice: гибнет
  rationale: Причастная форма выражает гибель или приход к погибели; настоящее время сохраняет афористичность и поэтическую наглядность.
- source_word: מִבְּלִי
  choice: без
  rationale: Сочетание указывает на отсутствие или лишённость; по-русски «без добычи» кратко и естественно передаёт смысл, при этом причинная связь ясна из контекста.
- source_word: טָרֶף
  choice: добыча
  rationale: Речь идёт о добыче хищника, а не просто о пище; «добыча» сохраняет образ льва.
- source_word: בְנֵי לָבִיא
  choice: львята
  rationale: Буквально «сыновья/детёныши лави»; в русском обозначение детёнышей льва естественно передаётся словом «львята», не определяя без необходимости пол взрослого животного.
- source_word: יִתְפָּרָדוּ
  choice: рассеиваются
  rationale: Глагол означает разделяться, расходиться или рассеиваться; «рассеиваются» передаёт распад группы и сохраняет поэтический параллелизм.
