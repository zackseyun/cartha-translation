  text: Вот, Своим слугам Он не доверяет, и в Своих вестниках[a] усматривает недостаток[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «ангелах». Еврейское слово может обозначать как человеческих, так и небесных вестников; здесь контекст, вероятно, указывает на небесных существ.
    reason: alternative_reading
  - marker: b
