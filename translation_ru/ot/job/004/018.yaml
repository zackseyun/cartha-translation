lexical_decisions:
- source_word: הֵן
  choice: вот
  rationale: Передаёт вводное усиление и привлекает внимание к последующему утверждению, оставаясь естественным для современной русской речи.
- source_word: בַּעֲבָדָיו
  choice: Своим слугам
  rationale: Предлог ב при глаголе אמן обозначает объект доверия. «Слуги» естественно передаёт подчинённое положение, не привнося прежде всего социально-правового смысла рабства.
- source_word: לֹא יַאֲמִין
  choice: не доверяет
  rationale: Порода hifil глагола אמן здесь выражает доверие или уверенность, а не интеллектуальное согласие с утверждением.
- source_word: וּבְמַלְאָכָיו
  choice: и Своим вестникам
  rationale: מַלְאָך буквально обозначает посланца или вестника и может относиться как к человеку, так и к небесному существу. В контексте, вероятно, имеются в виду ангелы, но основной текст сохраняет широту еврейского слова.
- source_word: יָשִׂים
  choice: вменяет
  rationale: В сочетании с отвлечённым существительным глагол выражает приписывание кому-либо свойства или вины. «Вменяет» сохраняет эту направленность и торжественный поэтический регистр.
- source_word: תָּהֳלָה
  choice: погрешность
  rationale: Редкое существительное допускает значения ошибки, изъяна, неразумия или несовершенства. «Погрешность» сохраняет смысл отклонения или недостатка, не уточняя сверх меры его природу.
theological_decisions:
- issue: Следует ли понимать מַלְאָכָיו конкретно как ангелов или шире как вестников
  choice: вестникам
  alternative: ангелам
  rationale: Контекст сопоставления со «слугами» с большой вероятностью указывает на небесных существ, однако лексически слово означает «вестники». Более широкое чтение оставлено в основном тексте, а вероятное контекстуальное уточнение вынесено в сноску.
- issue: Насколько определённо передавать редкое תָּהֳלָה
  choice: погрешность
  alternative: неразумие, вина или несовершенство
  rationale: Значение редкого слова не вполне определённо. Выбран нейтральный вариант, а основные лексические возможности сохранены в сноске без догматического уточнения природы недостатка небесных существ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия и повтор «Своим» поддерживают параллелизм еврейской строки; местоимение, относящееся к Богу, оформлено с прописной буквы согласно распространённой русской библейской традиции.
