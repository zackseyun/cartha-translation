lexical_decisions:
- source_word: פַּחַד
  choice: страх
  rationale: Широкое и естественное соответствие существительному со значением страха или ужаса; контекст передаёт силу переживания без обязательного усиления до «ужаса».
- source_word: קְרָאַנִי
  choice: охватил меня
  rationale: Здесь глагол имеет значение встречи или внезапно постигшего переживания. По-русски «страх охватил меня» естественно передаёт внезапное наступление страха и подходит к поэтическому контексту.
- source_word: וּרְעָדָה
  choice: и дрожь
  rationale: Сохраняет именную поэтическую конструкцию и обозначает телесную реакцию, сопутствующую страху.
- source_word: וְרֹב עַצְמוֹתַי
  choice: все мои кости
  rationale: Буквально выражение говорит о «множестве моих костей». В русском «все мои кости» естественно передаёт интенсивную реакцию всего тела; буквальный образ и возможные оттенки указаны в сноске.
- source_word: הִפְחִיד
  choice: заставил содрогнуться
  rationale: Каузативная форма означает «испугал, привёл в страх». При объекте «кости» это выражено естественным русским оборотом, сохраняющим причинное воздействие и телесный результат.
