lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В контексте союз вводит противопоставление между прежней поддержкой, которую Иов оказывал другим, и его нынешней реакцией на собственное бедствие. Значение «ибо» возможно и отмечено в сноске.
- source_word: עַתָּה
  choice: теперь
  rationale: Указывает на нынешнее положение Иова в противопоставлении его прежнему поведению.
- source_word: תָּבוֹא
  choice: беда пришла
  rationale: Глагол стоит в женском роде, единственном числе, при подразумеваемом субъекте. Слово «беда» естественно восстанавливает его из контекста, однако эта имплицитность пояснена в сноске.
- source_word: אֵלֶיךָ
  choice: к тебе
  rationale: Передаёт направленность бедствия, которое теперь достигло самого Иова.
- source_word: וַתֵּלֶא
  choice: и ты изнемог
  rationale: Корень לאה обозначает усталость, изнеможение, утрату сил. «Изнемог» сохраняет физико-эмоциональный смысл, не сводя его к нетерпению.
- source_word: תִּגַּע
  choice: коснулась
  rationale: Сохраняет образ прикосновения и параллель с предшествующим «пришла»; согласование с восстановленным словом «беда» отражает женский род еврейского глагола.
- source_word: עָדֶיךָ
  choice: тебя
  rationale: Естественное русское управление после глагола «коснуться» передаёт значение «достичь тебя».
- source_word: וַתִּבָּהֵל
  choice: и ты в смятении
  rationale: Передаёт состояние тревоги, потрясения и растерянности, не усиливая смысл до безусловного ужаса.
