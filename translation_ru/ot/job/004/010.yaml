lexical_decisions:
- source_word: שַׁאֲגַת
  choice: рык
  rationale: Отглагольное существительное в сопряжённой форме обозначает рычащий крик льва; «рык» естественно и поэтично передаёт образ.
- source_word: אַרְיֵה
  choice: лев
  rationale: Обычное древнееврейское обозначение льва; контекст не требует уточнения.
- source_word: קוֹל
  choice: голос
  rationale: Сохраняет параллелизм с «рыком» и не сводит оба выражения к одному слову.
- source_word: שָׁחַל
  choice: свирепый лев
  rationale: Поэтическое название льва, вероятно подчёркивающее его силу и грозность; определение отличает его от אַרְיֵה без чрезмерно конкретного толкования.
- source_word: שִׁנֵּי
  choice: зубы
  rationale: Прямое соответствие форме множественного числа в сопряжённом сочетании.
- source_word: כְפִירִים
  choice: молодые львы
  rationale: Слово обозначает молодых, уже сильных львов, а не беспомощных детёнышей.
- source_word: נִתָּעוּ
  choice: выбиты
  rationale: В отношении зубов русский глагол естественно передаёт насильственное разрушение или удаление. Совершенный вид отражает древнееврейский перфект; пассивная форма — нифаль.
