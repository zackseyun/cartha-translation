  text: Is not their tent-cord pulled up within them? They die[b][a], and not in wisdom.
translation:
  language: ru
  text: Разве не выдернута из них верёвка их шатра?[a] Они умирают — и не в мудрости.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оторвана ли от них их верёвка»; традиционно: «не удалено ли их превосходство». Вероятно, еврейский текст продолжает образ шатра: верёвку, от которой зависит его устойчивость, выдёргивают при сворачивании.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «без мудрости»; возможно также: «не успев обрести мудрость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Не … ли
  rationale: Сохраняет форму риторического вопроса, предполагающего утвердительный ответ.
- source_word: נִסַּע
  choice: выдернута
  rationale: Глагол נסע может обозначать снятие с места или выдёргивание, в том числе при сворачивании шатра; пассивная форма отражена кратким страдательным причастием.
- source_word: יִתְרָם
  choice: их шатровая верёвка
  rationale: יתר может обозначать верёвку, особенно растяжку шатра. Такое понимание продолжает образ хрупкого человеческого жилища из предыдущего стиха, однако альтернативное значение отмечено в сноске.
- source_word: בָּם
  choice: у них
  rationale: Еврейское בם буквально допускает «в них», но по-русски «у них» естественнее передаёт связь верёвки с теми, о ком говорится, не навязывая конкретной анатомической трактовки образа.
- source_word: יָמוּתוּ
  choice: Они умирают
  rationale: Прямо передаёт обычное значение глагола מות без усиления до «погибают».
- source_word: וְלֹא בְחָכְמָה
  choice: и не в мудрости
  rationale: 'Намеренно сохраняет краткую и неоднозначную конструкцию оригинала: речь может идти о смерти без мудрости, неразумной смерти или смерти прежде обретения мудрости.'
