lexical_decisions:
- source_word: וְרוּחַ
  choice: И дух
  rationale: רוּחַ может означать «дух», «ветер» или «дыхание». В контексте таинственного видения и охватившего говорящего ужаса наиболее вероятно значение «дух»; неопределённость еврейской формы по-русски естественно сохраняется отсутствием уточняющего определения.
- source_word: עַל פָּנַי
  choice: перед моим лицом
  rationale: Буквально выражение связано с лицом говорящего; в сочетании с יַחֲלֹף оно передаёт движение непосредственно перед ним. Формулировка сохраняет конкретный образ оригинала.
- source_word: יַחֲלֹף
  choice: прошёл
  rationale: Глагол חלף означает «проходить, миновать». Совершенный вид естественно передаёт последовательное повествование о пережитом событии.
- source_word: תְּסַמֵּר
  choice: встали дыбом
  rationale: Форма глагола выражает становление жёстким или поднятым. Русская идиома «волосы встали дыбом» точно и ярко передаёт телесную реакцию страха.
- source_word: שַׂעֲרַת בְּשָׂרִי
  choice: волосы на теле моём
  rationale: Буквально — «волосы моей плоти». «Волосы на теле моём» сохраняет телесный образ и возвышенный строй, не прибегая к неестественному буквальному выражению «волосы моей плоти».
