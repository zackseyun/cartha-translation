base_translation:
  language: en
  yaml_path: translation/ot/job/004/006.yaml
  text: Is not your fear of God your confidence[c][b][a], and the integrity of your ways your hope?
translation:
  language: ru
  text: Разве не страх перед Богом[a] — твоя уверенность[b], и не непорочность твоих путей[c] — твоя надежда?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твой страх»; объект страха в еврейском тексте прямо не назван, хотя в литературе мудрости обычно подразумевается Бог.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твоё упование».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «цельность твоих путей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит в современном литературном русском языке.
- source_word: יִרְאָתְךָ
  choice: страх перед Богом
  rationale: Буквально сказано «твой страх», без названного объекта; в контексте литературы мудрости наиболее вероятен страх перед Богом. Уточнение вынесено также в сноску, чтобы сохранить осведомлённость читателя о неоднозначности.
- source_word: כִּסְלָתֶךָ
  choice: твоя уверенность
  rationale: В данном контексте существительное обозначает уверенность или упование, а не «глупость»; «уверенность» хорошо соответствует параллельному слову «надежда».
- source_word: תִּקְוָתְךָ
  choice: твоя надежда
  rationale: Обычное и естественное соответствие, выражающее положительное ожидание.
- source_word: וְתֹם
  choice: и непорочность
  rationale: Слово обозначает цельность, безупречность или нравственную непорочность. «Непорочность» сохраняет характерную лексику книги Иова и этический смысл.
- source_word: דְּרָכֶיךָ
  choice: твоих путей
  rationale: Сохраняет еврейскую метафору пути как образа образа жизни и поведения.
theological_decisions:
- issue: Неуказанный объект страха
  choice: 'В основном тексте: «страх перед Богом»'
  alternative: «твой страх» или «твоё благоговение»
  rationale: Хотя объект в еврейском тексте прямо не назван, в литературе мудрости под таким страхом обычно подразумевается страх перед Богом. Сноска сохраняет формальную неоднозначность исходного текста.
- issue: Синтаксическое соотношение именных частей
  choice: 'Два параллельных утверждения: страх — уверенность; непорочность путей — надежда'
  alternative: Понять вторую половину как «твоя надежда — непорочность твоих путей»
  rationale: Еврейская поэтическая последовательность допускает обращённый порядок подлежащего и сказуемого. Выбранный порядок естественен по-русски и подчёркивает смысловой параллелизм, не меняя основного утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Повтор «не» во второй части делает параллелизм и охват риторического вопроса ясными для русского читателя; тире передают подразумеваемую связку.
