  text: בִּ֭/שְׂעִפִּים מֵ/חֶזְיֹנ֣וֹת לָ֑יְלָה בִּ/נְפֹ֥ל תַּ֝רְדֵּמָ֗ה עַל אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/004/013.yaml
  text: Amid disquieting thoughts from visions of the night[a], when deep sleep falls on men[b],
translation:
  language: ru
  text: Среди тревожных мыслей, связанных с ночными видениями[a], когда глубокий сон нисходит на людей,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди беспокойных размышлений о ночных видениях».'
    reason: Слово שְׂעִפִּים может означать мысли или размышления с оттенком внутреннего беспокойства; связь с ночными видениями, выраженная предлогом מִן, может пониматься как источник, повод или тема этих мыслей.
lexical_decisions:
- source_word: בְּשְׂעִפִּים
  choice: Среди тревожных мыслей
  rationale: Существительное שְׂעִפִּים обозначает мысли или размышления, а в данном контексте — беспокойные, тревожащие мысли. «Среди тревожных мыслей» естественно передаёт как внутреннее смятение, так и обстоятельственное значение предлога בְּ.
- source_word: מֵחֶזְיֹנוֹת לָיְלָה
  choice: вызванных ночными видениями
  rationale: חֶזְיֹנוֹת — «видения», לָיְלָה — «ночи, ночные», а מִן указывает на источник или причину. Причастный оборот позволяет естественно выразить эту связь по-русски, не превращая её в однозначно причинное утверждение.
- source_word: בִּנְפֹל
  choice: когда ... нисходит
  rationale: Инфинитивная конструкция с בְּ имеет временное значение. «Когда… нисходит» сохраняет образ сна, опускающегося на человека, и соответствует возвышенному повествовательному регистру.
- source_word: תַּרְדֵּמָה
  choice: глубокий сон
  rationale: תַּרְדֵּמָה означает тяжёлый, глубокий сон, а не обычный сон или лёгкую дремоту.
- source_word: עַל אֲנָשִׁים
  choice: на людей
  rationale: אֲנָשִׁים здесь имеет обобщённое значение «люди». Русское «людей» точно и естественно передаёт это значение без ненужного сужения до лиц мужского пола.
theological_decisions:
- issue: Обобщённое значение אֲנָשִׁים
  choice: людей
  alternative: мужчин
  rationale: Хотя форма грамматически мужского рода, в данном изречении она относится к людям вообще. Перевод «мужчин» создал бы отсутствующее в источнике смысловое ограничение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
