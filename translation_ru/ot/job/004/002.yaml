  text: If one tries a word with you[a], will you be weary? But who can hold back words?
translation:
  language: ru
  text: Если кто-нибудь попробует сказать тебе слово[a], не утомишься ли ты? Но кто может удержаться от слов?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если кто-нибудь решится заговорить с тобой».'
    reason: 'Передаёт возможное идиоматическое понимание сочетания הֲנִסָּה דָבָר אֵלֶיךָ: осторожную попытку или решимость обратиться к Иову.'
lexical_decisions:
- source_word: הֲנִסָּה
  choice: если попытаться
  rationale: Форма от נסה здесь выражает осторожную попытку или решимость заговорить, а не испытание собеседника; условная конструкция естественно передаёт вопросительное еврейское начало.
- source_word: דָבָר
  choice: слово
  rationale: דבר допускает значения «слово», «дело», «нечто». В контексте начала речи и последующего מִלִּין на первом плане значение произнесённого слова.
- source_word: אֵלֶיךָ
  choice: тебе
  rationale: Прямо передаёт направление речи к Иову и естественно сочетается с русским «сказать».
- source_word: תִּלְאֶה
  choice: не утомишься ли ты
  rationale: Глагол לאה означает утомляться, изнемогать. Перевод сохраняет образ усталости, не сводя его без необходимости к раздражению или нетерпению.
- source_word: וַעְצֹר
  choice: удержаться
  rationale: עצר означает сдерживать, удерживать. Возвратное «удержаться» естественно выражает подразумеваемую невозможность воздержаться от речи.
- source_word: בְּמִלִּין
  choice: от слов
  rationale: Арамеизированная форма множественного числа означает «слова»; русский оборот «удержаться от слов» передаёт смысл воздержания от высказывания.
- source_word: מִי יוּכָל
  choice: кто может
  rationale: Сохраняет краткую риторическую формулу способности без усиления или истолкования.
