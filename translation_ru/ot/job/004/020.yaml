base_translation:
  language: en
  yaml_path: translation/ot/job/004/020.yaml
  text: From morning to evening they are crushed; without anyone taking notice[a], they perish forever.
translation:
  language: ru
  text: С утра до вечера их сокрушают; никто не обращает на это внимания — они погибают навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֹּקֶר לָעֶרֶב
  choice: С утра до вечера
  rationale: Передаёт временной промежуток в пределах одного дня и подчёркивает краткость и хрупкость человеческой жизни, сохраняя образ еврейского текста.
- source_word: יֻכַּתּוּ
  choice: их сокрушают
  rationale: 'Форма хофаль выражает пассивное действие: их разбивают, повергают или сокрушают. Такая формулировка сохраняет пассивный смысл и не уточняет способ разрушения.'
- source_word: מִבְּלִי מֵשִׂים
  choice: никем не замеченные
  rationale: Эллиптическое выражение буквально связано с отсутствием того, кто «полагает» это в уме или сердце. По-русски естественно передаёт мысль, что никто не обращает внимания на их гибель.
- source_word: לָנֶצַח
  choice: навеки
  rationale: Сохраняет значение необратимости и окончательности гибели, не добавляя эсхатологического толкования.
- source_word: יֹאבֵדוּ
  choice: они погибают
  rationale: Глагол אבד здесь обозначает гибель или исчезновение. «Погибают» передаёт широкий смысл, не сужая его до особого богословского значения.
theological_decisions:
- issue: Окончательность человеческой смертности в речи Елифаза
  choice: Слова переданы как утверждение о хрупкости человека и необратимости его незамеченной смерти.
  alternative: Понимать «навеки» как прямое указание на окончательное эсхатологическое осуждение.
  rationale: В контексте Елифаз говорит о бренности смертных перед Богом. Перевод сохраняет напряжённую формулировку «навеки», но не расширяет её до разработанного учения о последнем суде.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Порядок частей и параллелизм близки к еврейскому тексту; архаизмы сведены к минимуму, при этом «навеки» сохраняет краткость и возвышенный тон.
