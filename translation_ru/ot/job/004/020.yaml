review_pass:
  verdict: revise
  source_fidelity: 'Первая половина передана точно: «С утра до вечера их сокрушают» сохраняет временной оборот и пассивный смысл יֻכַּתּוּ. Во второй половине «никем не замеченные» грамматически возможно, но сдвигает מִבְּלִי מֵשִׂים к характеристике самих гибнущих («не замеченные»), тогда как еврейский эллиптический оборот говорит об отсутствии того, кто принимает это к сердцу/обращает внимание на их гибель. Следует сохранить субъект восприятия и не превращать оборот в причастное определение.'
  naturalness: «С утра до вечера» и «навеки» естественны в современном литературном, слегка поэтическом русском. Формулировка «и никто не обращает на это внимания» яснее и естественнее, чем обособленное «никем не замеченные», а также точнее отражает синтаксическую неопределённость исходного выражения.
  terminology: «Сокрушают» удачно передаёт пассивное יֻכַּתּוּ без излишней конкретизации. «Погибают навеки» сохраняет לָנֶצַח и יֹאבֵדוּ; это не должно истолковываться как специально разработанное утверждение об эсхатологическом осуждении. Имя Елифаз в сопроводительных материалах дано нормативно.
  issues:
