    issue: Смысловой сдвиг в передаче מִבְּלִי מֵשִׂים
    rationale: «Никем не замеченные» описывает людей как не замеченных кем-либо. Еврейский оборот буквально означает «без того, кто полагает/принимает к сердцу» и, вероятно, относится к отсутствию внимания к их гибели. Личное предложение «и никто не обращает на это внимания» передаёт данный смысл без неоправданного синтаксического сужения.
  revised_text: С утра до вечера их сокрушают; никто не обращает на это внимания — они погибают навеки.
