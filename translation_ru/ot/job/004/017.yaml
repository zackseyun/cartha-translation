base_translation:
  language: en
  yaml_path: translation/ot/job/004/017.yaml
  text: Can mortal man be in the right before God? Can a man be pure before his Maker?[a]
translation:
  language: ru
  text: Может ли смертный быть прав перед Богом? Может ли человек быть чист перед своим Создателем?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Может ли смертный быть праведнее Бога? Может ли человек быть чище своего Создателя?»'
    reason: Альтернативное сравнительное понимание предлога מִן в обеих строках.
lexical_decisions:
- source_word: הַאֱנוֹשׁ
  choice: смертный
  rationale: אֱנוֹשׁ обозначает человека с оттенком слабости и смертности; «смертный» естественно передаёт контраст человека с Богом.
- source_word: מֵאֱלוֹהַ
  choice: перед Богом
  rationale: Предлог מן при צדק допускает сравнительное прочтение, но здесь может идиоматически выражать отношение человека к Богу; сравнительный вариант сохранён в сноске.
- source_word: יִצְדָּק
  choice: быть прав
  rationale: Глагол צדק здесь говорит о правоте или праведности человека по отношению к Богу; «быть прав» сохраняет судебно-реляционный оттенок и звучит естественно.
- source_word: אִם
  choice: Может ли
  rationale: В поэтическом параллелизме אִם вводит второй вопрос; повтор вопросительной конструкции ясно и естественно передаёт его функцию по-русски.
- source_word: מֵעֹשֵׂהוּ
  choice: перед своим Создателем
  rationale: Форма означает «его создатель»; прописная буква обозначает Бога, а «своим» естественно соотносит Создателя с человеком. Сравнительное прочтение отражено в сноске.
- source_word: יִטְהַר
  choice: быть чист
  rationale: טהר означает чистоту; в параллели с צדק выражение «быть чист» сохраняет нравственно-религиозный смысл без излишнего истолкования.
- source_word: גָּבֶר
  choice: человек
  rationale: Здесь גָּבֶר стоит в поэтическом параллелизме с אֱנוֹשׁ и обозначает мужчину или человека; нейтральное «человек» не привносит несущественного оттенка силы или воинственности.
theological_decisions:
- issue: Положение человека по отношению к Богу
  choice: Стих передан как риторический вопрос о том, может ли смертный быть прав или чист перед Богом.
  alternative: «Может ли смертный быть праведнее Бога? Может ли человек быть чище своего Создателя?»
  rationale: Предлог מן допускает как сравнительное («праведнее Бога»), так и реляционное («прав перед Богом») понимание. Основной текст избирает естественное в данном контексте реляционное прочтение, не превращая его в развёрнутую догматическую формулу; подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная вопросительная форма сохраняет поэтический параллелизм. «Создатель» употреблено как ясное и достойное соответствие עֹשֵׂהוּ.
