  text: 'Тем более — живущие в домах из глины[a], чьё основание — в прахе: их сокрушают скорее, чем моль.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Дома из глины» могут быть образом человеческой хрупкости; возможно также буквальное понимание: жилища из глины.'
    reason: metaphorical_ambiguity
  - marker: b
    text: 'Букв.: «перед молью». Оборот может означать «скорее, чем моль» или «легче, чем моль»; его точный оттенок не вполне ясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: тем более
  rationale: 'В связи со ст. 18 частица усиливает вывод: если Бог не вполне доверяет Своим небесным служителям, то тем более это относится к смертным людям.'
- source_word: שֹׁכְנֵי בָתֵּי חֹמֶר
  choice: живущие в домах из глины
  rationale: Причастие передаёт постоянное обитание, а образ глиняных домов сохраняет метафору хрупкой телесной жизни человека.
- source_word: אֲשֶׁר בֶּעָפָר יְסוֹדָם
  choice: чьё основание — в прахе
  rationale: Формулировка сохраняет строительный образ и смысловые ассоциации праха с происхождением и смертностью человека.
- source_word: יְדַכְּאוּם
  choice: их сокрушают
  rationale: Форма означает «сокрушать, раздавливать»; неопределённо-личная конструкция не вводит отсутствующего в еврейском тексте действующего лица.
- source_word: לִפְנֵי עָשׁ
  choice: легче, чем моль
  rationale: Буквальное «перед молью» в данном образном сравнении, вероятно, указывает на необычайную лёгкость уничтожения; примечание сохраняет неоднозначность оборота.
theological_decisions:
- issue: Смысл образа «дома из глины»
  choice: Сохранён образ, вероятнее всего обозначающий хрупкие человеческие тела и смертное земное существование.
  alternative: Буквальные жилища из сырцового кирпича как образ уязвимости людей.
  rationale: Контекст противопоставляет небесных служителей смертным людям, однако перевод не заменяет поэтическую метафору её истолкованием.
- issue: Сравнение с молью
  choice: Люди сокрушаются легче, чем моль.
  alternative: Их сокрушают «перед молью» либо быстрее моли.
  rationale: Еврейский оборот допускает буквальное пространственное прочтение и сравнительное понимание лёгкости или быстроты; основной текст выбирает естественное контекстуальное значение, а примечание отмечает другие возможности.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. «Прах» и «сокрушают» выбраны как понятные библейско-поэтические слова; синтаксис сделан ясным без устранения смыслового напряжения оригинала.
