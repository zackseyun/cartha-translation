base_translation:
  language: en
  yaml_path: translation/ot/job/039/021.yaml
  text: It paws in the valley and rejoices in its strength[b][a]; it goes out to meet the weapons.
translation:
  language: ru
  text: Он роет копытом землю в долине[a] и радуется своей силе; выходит навстречу оружию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разгребает копытом землю в долине». Еврейский глагол буквально означает «рыть» и здесь описывает движение копыта коня.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выходит навстречу битве». Еврейское слово может обозначать оружие или вооружение в целом, а по смысловому расширению — вооружённое сражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפְּרוּ
  choice: роет копытом землю
  rationale: Глагол חפר буквально означает «рыть». В описании боевого коня он передаёт движение копыта, разгребающего землю. В еврейском тексте глагол стоит во множественном числе, вероятно соотнесённом с копытами, тогда как следующий глагол — в единственном; по-русски естественнее согласовать действие с конём и передать его в единственном числе.
- source_word: בָעֵמֶק
  choice: в долине
  rationale: עֵמֶק обозначает долину или низменность; «в долине» прямо передаёт форму и пространственный образ исходного текста.
- source_word: וְיָשִׂישׂ
  choice: и радуется
  rationale: שׂושׂ выражает сильную радость или ликование. «Радуется» естественно сочетается с дополнением «своей силе» и не добавляет отсутствующего в тексте оттенка гордости.
- source_word: בְּכֹחַ
  choice: своей силе
  rationale: Предлог בְּ допускает оттенки «в», «с» или указание на причину. Русская конструкция «радуется своей силе» естественно передаёт радость коня от обладаемой им силы, не устраняя полностью смысловую широту оборота.
- source_word: יֵצֵא
  choice: выходит
  rationale: יָצָא — обычный глагол «выходить». Вариант «устремляется» был бы выразительнее, но добавлял бы значение стремительного движения, прямо не выраженное глаголом.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: לִקְרַאת указывает на движение навстречу кому-либо или чему-либо; русский предлог «навстречу» кратко и точно передаёт эту направленность.
- source_word: נָשֶׁק
  choice: оружию
  rationale: נֶשֶׁק обозначает оружие или вооружение собирательно; единственное число «оружие» в русском сохраняет этот конкретный военный образ, хотя в контексте возможно более широкое понимание — «битва».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык; образность исходного текста сохранена без архаизмов. Местоимение «он» восстанавливает подразумеваемого из контекста боевого коня. Полуточие сохраняет двучастное движение стиха: сначала сила и поведение коня, затем его выход навстречу опасности.'
