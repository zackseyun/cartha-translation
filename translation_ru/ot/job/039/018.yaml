  text: כָּ֭/עֵת בַּ/מָּר֣וֹם תַּמְרִ֑יא תִּֽשְׂחַ֥ק לַ֝/סּ֗וּס וּ/לְ/רֹֽכְבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/018.yaml
  text: When she lifts herself up on high[b][a], she laughs at the horse and its rider.
translation:
  language: ru
  text: Когда она поднимается ввысь[a], то смеётся[b] над конём и его всадником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «расправляет крылья ввысь» или «взмахивает крыльями, устремляясь вверх». Вероятно, еврейский глагол описывает движение вверх, но его точный оттенок остаётся спорным.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «насмехается» либо «глумится».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת
  choice: Когда
  rationale: Сочетание вводит обстоятельство времени; «когда» естественно передаёт его функцию в современном русском языке.
- source_word: בַּמָּרוֹם
  choice: ввысь
  rationale: Слово обозначает высоту или возвышенное пространство; «ввысь» сохраняет поэтический образ движения вверх.
- source_word: תַּמְרִיא
  choice: поднимается
  rationale: Форма глагола указывает на движение или поднятие вверх, но его точный оттенок здесь спорен. Нейтральное «поднимается» не утверждает однозначно, что страус взлетает.
- source_word: תִּשְׂחַק
  choice: смеётся над
  rationale: Глагол может означать как смех, так и насмешку; конструкция с предлогом ל здесь выражает направленный на кого-либо насмешливый смех.
- source_word: לַסּוּס
  choice: над конём
  rationale: Определённая форма единственного числа представляет коня как типичного участника сравнения.
- source_word: וּלְרֹכְבוֹ
  choice: и его всадником
  rationale: Местоименный суффикс естественно относится к коню и связывает его с сидящим на нём всадником.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим синтаксисом. Частица «то» делает временную конструкцию естественной и подчёркивает последующее превосходство страуса в скорости, не снимая лексической неоднозначности глагола движения.
