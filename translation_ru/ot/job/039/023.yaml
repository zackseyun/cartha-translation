lexical_decisions:
- source_word: עָלָיו
  choice: над ним
  rationale: Предлог עַל с местоименным суффиксом обозначает положение оружия относительно коня. «Над ним» сохраняет пространственный образ, не усиливая без необходимости значение враждебной направленности.
- source_word: תִּרְנֶה
  choice: звенит
  rationale: В этом поэтическом контексте глагол передаёт резкий звук оружия или снаряжения. «Звенит» естественно сочетается с «колчаном» и сохраняет слуховой образ.
- source_word: אַשְׁפָּה
  choice: колчан
  rationale: Обычное обозначение вместилища для стрел; «колчан» — точный и общеупотребительный русский эквивалент.
- source_word: לַהַב
  choice: сверкают
  rationale: Существительное буквально означает «пламя» или «лезвие», но в сочетании с оружием образно передаёт его яркий блеск. Глагольная передача делает строку естественной по-русски, сохраняя поэтический образ.
- source_word: חֲנִית
  choice: копьё
  rationale: Широкое и стандартное русское соответствие обычному древнееврейскому названию копья.
- source_word: כִידוֹן
  choice: дротик
  rationale: Обозначает метательное древковое оружие, отличное от חֲנִית; «дротик» сохраняет различие между двумя видами оружия.
