  text: Знаешь ли ты время, когда рожают горные козы[a]? Наблюдаешь[c] ли ты, как рожают оленихи[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дикие козы среди скал»; еврейское выражение обозначает живущих в горах диких коз, возможно козерогов.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово обозначает самок оленей; возможный перевод: «лани».'
    reason: lexical_alternative
  - marker: c
    text: Глагол может также означать «следить», «стеречь» или «присматривать».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Знаешь ли ты
  rationale: Вопросительная частица с формой глагола ידע образует риторический вопрос; настоящее время естественно передаёт его смысл по-русски.
- source_word: עֵת לֶדֶת
  choice: время, когда рожают
  rationale: Сочетание существительного «время» с инфинитивом ילד естественно передано временным придаточным, без излишнего уточнения сезона или момента.
- source_word: יַעֲלֵי סָלַע
  choice: горные козы
  rationale: Буквально «козы скалы»; речь идёт о диких козах, живущих в горах, вероятно о козерогах. Выбран понятный современный родовой термин.
- source_word: חֹלֵל
  choice: роды
  rationale: Форма от חול обозначает родовые муки или процесс рождения; русское «роды» ясно передаёт значение в данном параллельном вопросе.
- source_word: אַיָּלוֹת
  choice: лани
  rationale: Слово обозначает самок оленей; «лани» точно, естественно и сохраняет указание на пол животных.
- source_word: תִּשְׁמֹר
  choice: Наблюдаешь ли ты
  rationale: В данном контексте שׁמר может означать внимательно следить или наблюдать. Такой перевод не навязывает значение заботы или охраны, но альтернативный оттенок отмечен в сноске.
theological_decisions:
- issue: Характер Божьего отношения к рождению диких животных в глаголе שׁמר
  choice: наблюдаешь
  alternative: хранишь / присматриваешь
  rationale: Основной текст сохраняет непосредственный смысл внимательного наблюдения в риторическом вопросе и не усиливает его до явного утверждения об охране; более широкий оттенок глагола указан в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной риторической формы «Знаешь ли ты». Параллелизм двух вопросов сохранён; зоологическая терминология не конкретизирована сверх данных еврейского текста.
