  text: הֲֽ֭/מִ/בִּינָ֣תְ/ךָ יַֽאֲבֶר נֵ֑ץ יִפְרֹ֖שׂ כנפ/ו לְ/תֵימָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/026.yaml
  text: Is it by your understanding that the hawk soars[a], spreading its wings toward the south?
translation:
  language: ru
  text: Твоим ли разумением взмывает ястреб[a], расправляя крылья к югу?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокол»; еврейское נֵץ может обозначать хищную птицу этого типа в более общем смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבִּינָתְךָ
  choice: Твоим ли разумением
  rationale: Вопросительная частица הֲ и конструкция מִן с בִּינָה указывают на средство или основание действия. «Разумением» прямо передаёт смысл рассудительности и сохраняет риторический вопрос, обращённый к Иову.
- source_word: יַאֲבֶר
  choice: взмывает
  rationale: Форма глагола אבר в породе хифиль описывает движение птицы в полёте, вероятно поднятие или парение. «Взмывает» естественно передаёт направленное вверх движение, не перегружая текст.
- source_word: נֵץ
  choice: ястреб
  rationale: Слово обозначает хищную птицу типа ястреба или сокола; точный вид не установлен. «Ястреб» — обычный широкий русский эквивалент, а допустимая альтернатива вынесена в примечание.
- source_word: יִפְרֹשׂ כְּנָפוֹ
  choice: расправляя крылья
  rationale: פרשׂ значит «расправлять, простирать», а единственное כְּנָפוֹ может иметь собирательное значение. Русское множественное «крылья» естественно для изображения летящей птицы; деепричастие передаёт сопутствующее действие.
- source_word: לְתֵימָן
  choice: к югу
  rationale: Предлог לְ выражает направление, а תֵימָן здесь означает юг. «К югу» кратко и точно передаёт южное направление полёта.
