  text: יִשְׂחַ֣ק לְ֭/פַחַד וְ/לֹ֣א יֵחָ֑ת וְ/לֹֽא יָ֝שׁ֗וּב מִ/פְּנֵי חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/022.yaml
  text: He laughs at fear and is not dismayed[b][a], and he does not turn back from the sword.
translation:
  language: ru
  text: Он смеётся над страхом[a] и не робеет; не отступает перед мечом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он насмехается над страхом». Еврейский глагол может обозначать не только смех, но и насмешку.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «не поворачивает назад от меча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: смеётся
  rationale: Прямо передаёт яркий образ формы Qal от שׂחק; в данном контексте смех выражает бесстрашие и может иметь оттенок насмешки.
- source_word: לְפַחַד
  choice: над страхом
  rationale: פחד означает «страх, ужас». Сочетание «смеётся над страхом» естественно по-русски и сохраняет краткость и образность еврейского выражения.
- source_word: יֵחָת
  choice: не робеет
  rationale: Nifal от חתת может означать быть сокрушённым, устрашённым или приведённым в смятение. «Не робеет» кратко и естественно передаёт отсутствие страха в бою.
- source_word: יָשׁוּב
  choice: не отступает
  rationale: שׁוב буквально означает «поворачиваться назад, возвращаться»; в военном контексте «не отступает» ясно передаёт требуемый смысл.
- source_word: מִפְּנֵי
  choice: перед
  rationale: В сочетании с угрозой מִפְּנֵי обозначает движение прочь от того, что находится перед кем-либо; русское «отступать перед» естественно выражает этот смысл.
- source_word: חָרֶב
  choice: мечом
  rationale: חרב — «меч»; единственное число сохранено как собирательный образ боевого оружия и угрозы сражения.
theological_decisions: []
