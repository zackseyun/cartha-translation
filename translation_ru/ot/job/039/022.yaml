  source_fidelity: 'Текст точно передаёт три еврейских утверждения о боевом коне: יִשְׂחַק לְפַחַד («смеётся над страхом»), וְלֹא יֵחָת («и не робеет / не приходит в смятение») и в военном контексте וְלֹא יָשׁוּב מִפְּנֵי חָרֶב («не отступает перед мечом»). Образность, отрицания и обобщённое единственное число «меч» сохранены.'
