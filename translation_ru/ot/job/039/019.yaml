lexical_decisions:
- source_word: הֲתִתֵּן
  choice: Ты ли дал
  rationale: Вопросительная частица с имперфектом 2-го лица вводит риторический вопрос, обращённый к Иову. Прошедшее время естественно по-русски передаёт вопрос о том, кто наделил коня силой.
- source_word: לַסּוּס
  choice: коню
  rationale: Существительное с определённым артиклем употреблено обобщённо; русское «коню» естественно обозначает представителя вида и сохраняет образ боевого коня.
- source_word: גְּבוּרָה
  choice: силу
  rationale: Слово означает силу, мощь или доблесть; в данном описании физической мощи коня наиболее ясно и естественно «силу».
- source_word: הֲתַלְבִּישׁ
  choice: Ты ли облёк
  rationale: Каузативная форма глагола לבש означает «одеть, облечь». «Облёк» сохраняет яркую метафору и соответствует возвышенному поэтическому регистру.
- source_word: צַוָּארוֹ
  choice: его шею
  rationale: Местоименный суффикс мужского рода относится к слову «конь»; русское «его» грамматически и стилистически естественно.
- source_word: רַעְמָה
  choice: гривой
  rationale: В непосредственном образе шеи, которую чем-то «облекают», значение «грива» наиболее вероятно. При этом древняя традиция понимания как «гром» отражена в примечании.
