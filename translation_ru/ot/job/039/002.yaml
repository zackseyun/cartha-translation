  rationale: Нейтрально передаёт עת без добавочного толкования «назначенное время».
- source_word: לִדְתָּנָה
  choice: когда им рожать
  rationale: Инфинитив construct от ילד с суффиксом 3 ж. мн. ч.; временная конструкция естественна по-русски и сохраняет отнесённость к самкам.
