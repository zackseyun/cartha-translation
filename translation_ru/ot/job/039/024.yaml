    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרַעַשׁ
  choice: В неистовстве
  rationale: Слово обозначает сотрясение, бурное движение или смятение. В описании боевого коня «в неистовстве» естественно передаёт неудержимую силу и возбуждение, не превращая образ в буквальное землетрясение.
- source_word: וְרֹגֶז
  choice: и ярости
  rationale: Существительное может означать волнение, дрожь или ярость; в паре с רַעַשׁ усиливает образ возбуждённого, рвущегося в бой коня.
- source_word: יְגַמֶּא אָרֶץ
  choice: он пожирает землю
  rationale: Глагол גמא буквально значит «глотать, проглатывать». Сочетание с «землёй» образно описывает стремительный бег; «пожирает землю» сохраняет яркую метафору.
- source_word: וְלֹא יַאֲמִין
  choice: и не может стоять на месте
  rationale: Хотя форма глагола אמן обычно связана со значением «верить», здесь её нередко понимают идиоматически как неспособность оставаться неподвижным или сдерживаться. Такой перевод связно передаёт поведение боевого коня, но неоднозначность отмечена в сноске.
- source_word: כִּי קוֹל שׁוֹפָר
  choice: при звуке трубы
  rationale: שׁוֹפָר — сигнальный рог, в данном контексте боевой. «При звуке трубы» естественно выражает обстоятельство, вызывающее реакцию коня, и не добавляет лишнего события.
