source:
  edition: WLC
  text: יַחְלְמ֣וּ בְ֭נֵי/הֶם יִרְבּ֣וּ בַ/בָּ֑ר יָ֝צְא֗וּ וְ/לֹא שָׁ֥בוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/004.yaml
  text: Their young ones become strong[a]; they grow up in the open field; they go out and do not return to them.
translation:
  language: ru
  text: Их детёныши крепнут, вырастают на воле[a]; уходят и к ним не возвращаются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в открытой местности»; возможно также: «в дикой степи».'
    reason: Лексема בָּר допускает обозначение открытой, невозделанной или дикой местности.
lexical_decisions:
- source_word: יַחְלְמוּ
  choice: крепнут
  rationale: В данном контексте глагол חָלַם описывает физическое укрепление и благополучное развитие детёнышей. «Крепнут» естественно передаёт этот смысл по-русски, не внося идеи выздоровления после болезни.
- source_word: בְנֵיהֶם
  choice: их детёныши
  rationale: Буквально слово означает «их дети/сыновья», но речь идёт о животных; «детёныши» точно и естественно обозначает потомство без указания на мужской пол.
- source_word: יִרְבּוּ
  choice: вырастают
  rationale: Хотя רבה часто означает «умножаться, становиться многочисленными», в параллели с физическим укреплением детёнышей здесь уместен смысл роста и созревания. «Вырастают» сохраняет контекстуальную связь, не утверждая численного увеличения.
- source_word: בַבָּר
  choice: на воле
  rationale: בָּר обозначает открытую, невозделанную местность, где животные живут вне человеческого присмотра. «На воле» звучит естественно в русском описании диких животных; более пространственные варианты сохранены в сноске.
- source_word: יָצְאוּ
  choice: уходят
  rationale: В контексте отделения выросших детёнышей от родителей «уходят» естественно передаёт движение прочь, выраженное глаголом יצא.
- source_word: וְלֹא שָׁבוּ לָמוֹ
  choice: и к ним не возвращаются
  rationale: Перевод прямо сохраняет отрицание и направление возвращения к родительским животным. Не добавлено «никогда», поскольку в еврейском тексте это усиление явно не выражено.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим ритмом. «Детёныши» устраняет неуместное для данного контекста указание на мужской пол, а местоименное «к ним» сохраняет формальную неоднозначность референта.
