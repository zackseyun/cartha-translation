  text: He laughs at the tumult of the city[b][a]; he does not hear the shouts of the driver.
translation:
  language: ru
  text: Он смеётся над городским шумом[a] и не слышит криков погонщика[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над городским гулом»; возможно также: «над городской суетой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надсмотрщика» или «того, кто понуждает к труду». Еврейское слово шире и может обозначать того, кто погоняет, принуждает или требует выполнения работы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂחַק
  choice: смеётся над
  rationale: Прямо передаёт Qal глагола שׂחק и выражает пренебрежительную реакцию дикого осла, не усиливая её до «насмехается».
- source_word: לַהֲמוֹן
  choice: над шумом
  rationale: הָמוֹן здесь обозначает городской шум и гул; «шум» естественно и ясно по-русски, а оттенок суеты остаётся возможным по контексту.
- source_word: קִרְיָה
  choice: городским
  rationale: קִרְיָה означает «город»; сочетание «городской шум» естественно передаёт еврейскую конструкцию и общий контраст города с вольной жизнью дикого животного.
- source_word: תְּשֻׁאוֹת
  choice: криков
  rationale: Форма множественного числа обозначает громкие крики; родительный падеж естественно связан с последующим обозначением действующего лица.
- source_word: נֹגֵשׂ
  choice: погонщика
  rationale: נֹגֵשׂ может означать того, кто понуждает, надзирает или взыскивает труд. В контексте животного «погонщик» лучше всего сохраняет конкретный образ, не привнося излишне узкого смысла трудового надсмотрщика.
- source_word: לֹא יִשְׁמָע
  choice: не слышит
  rationale: Формально и естественно передаёт еврейское выражение, сохраняя возможное напряжение между буквальным отсутствием слышимого и подразумеваемым неподчинением.
