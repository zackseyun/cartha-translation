  yaml_path: translation/ot/job/039/011.yaml
  text: Will you trust him because his strength is great[a], and leave your labor to him?
translation:
  language: ru
  text: Понадеешься ли ты на него потому, что сила его велика, и поручишь ли ему свой труд?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плод своего труда». Еврейское слово может обозначать как сам труд, так и то, что им произведено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִבְטַח בּוֹ
  choice: Понадеешься ли ты на него
  rationale: Вопросительная форма и Qal imperfect 2ms передают риторический вопрос. «Понадеешься» естественно выражает упование или уверенность в надёжности животного.
- source_word: כִּי רַב כֹּחוֹ
  choice: потому, что сила его велика
  rationale: כִּי понято причинно, а רַב כֹּחוֹ — как утверждение о большой физической силе дикого быка; формулировка сохраняет структуру и достоинство оригинала.
- source_word: וְתַעֲזֹב אֵלָיו
  choice: и поручишь ли ему
  rationale: Буквально עזב означает «оставить», однако сочетание с אֵלָיו в данном контексте подразумевает передачу работы или её результата животному. «Поручишь» естественно передаёт это значение по-русски, не утверждая больше, чем позволяет контекст.
- source_word: יְגִיעֶךָ
  choice: свой труд
  rationale: Существительное может обозначать тяжёлый труд, усилия либо плод труда. В контексте сельскохозяйственной работы «труд» даёт основной смысл, а возможное значение результата труда отмечено в сноске.
