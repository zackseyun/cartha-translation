    reason: lexical_alternative
lexical_decisions:
- source_word: סֶלַע
  choice: утёс / скала
  rationale: 'Слово обозначает высокую, крутую скальную поверхность, подходящую для обитания орла. В первом полустишии выбрано «утёс», а во втором — «скала»: это сохраняет образ и избегает тяжеловесного повтора.'
- source_word: יִשְׁכֹּן
  choice: обитает
  rationale: Глагол שׁכן передаёт продолжительное пребывание или проживание. «Обитает» естественно применительно к птице и соответствует возвышенному поэтическому регистру.
- source_word: וְיִתְלֹנָן
  choice: и ночует
  rationale: Форма от לון/לין указывает на пребывание на ночлег. «Ночует» кратко и ясно сохраняет временной оттенок глагола.
- source_word: שֶׁן סֶלַע
  choice: зубец скалы
  rationale: Буквальный образ «зуб скалы» обозначает острый скальный выступ или вершину. «Зубец скалы» сохраняет метафору, оставаясь понятным по-русски.
- source_word: וּמְצוּדָה
  choice: в твердыне
  rationale: מְצוּדָה может означать крепость или укреплённое, безопасное место. В описании орла это метафора неприступного скального убежища; «твердыня» сохраняет поэтический образ защищённости.
