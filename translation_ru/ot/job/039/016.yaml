lexical_decisions:
- source_word: הִקְשִׁיחַ
  choice: сурова к
  rationale: Форма хифиль от קשׁח выражает ожесточение или суровое обращение. В данном контексте естественное русское соответствие — «сурова к», без неясной буквальности «ожесточает».
- source_word: בָּנֶיהָ
  choice: своим птенцам
  rationale: Буквально «своим детям/сыновьям»; применительно к птице современное русское «птенцам» точно передаёт зоологический контекст.
- source_word: לְלֹא לָהּ
  choice: словно они не её
  rationale: Передаёт эллиптическое еврейское выражение «как не её / не принадлежащие ей» естественно и без добавления лишнего толкования.
- source_word: לְרִיק
  choice: напрасными
  rationale: Обычное русское соответствие со значением тщетности; в сочетании с «труды» требует творительного падежа.
- source_word: יְגִיעָהּ
  choice: труды её
  rationale: Сохраняет смысл затраченных усилий и возвышенно-нейтральный поэтический регистр.
- source_word: בְּלִי פָחַד
  choice: не боится
  rationale: Буквально «без страха». В связи с предшествующим «труды её напрасны» глагольная передача естественно выражает отсутствие опасения, сохраняя семантику страха.
