  text: הְֽ֭/תַרְעִישֶׁ/נּוּ כָּ/אַרְבֶּ֑ה ה֖וֹד נַחְר֣/וֹ אֵימָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/020.yaml
  text: Can you make him leap like the locust? The majesty of his snorting is terrifying[a].
translation:
  language: ru
  text: Ты ли заставляешь его скакать, как саранча? Величие его фырканья внушает ужас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты ли заставляешь его грохотать, как саранча?» Еврейский глагол может означать «сотрясать», «заставлять дрожать» или «приводить в бурное движение»; возможно, образ передаёт не только движение, но и звук.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַרְעִישֶׁנּוּ
  choice: Ты ли заставляешь его скакать
  rationale: В породе hифиль глагол רעשׁ означает побуждать дрожать, сотрясаться или бурно двигаться. В сравнении боевого коня с саранчой естественнее всего передать стремительное пружинистое движение; вопросительная форма сохраняет обращение Бога к Иову.
- source_word: כָּאַרְבֶּה
  choice: как саранча
  rationale: Единственное число имеет собирательный оттенок; русское «саранча» естественно передаёт образ резкого скачкообразного движения.
- source_word: הוֹד
  choice: величественный
  rationale: Существительное означает величие, великолепие, внушительность. В русском предложении оно естественно преобразовано в определение к «храп», сохраняя возвышенный поэтический регистр.
- source_word: נַחְרוֹ
  choice: храп его
  rationale: Слово связано с шумным выдыханием через ноздри, то есть с фырканьем или храпом коня. «Храп» здесь краток, поэтичен и точнее, чем «ржание».
- source_word: אֵימָה
  choice: наводит ужас
  rationale: Еврейское существительное выражает ужас или страх. Предикативное русское выражение естественно передаёт силу именного предложения.
