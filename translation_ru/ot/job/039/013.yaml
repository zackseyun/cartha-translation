lexical_decisions:
- source_word: כְּנַף
  choice: крылья
  rationale: Единственное число имеет собирательное значение; по-русски применительно к парному органу естественно множественное число.
- source_word: רְנָנִים
  choice: страуса
  rationale: В контексте речи о животных слово обозначает страуса; последующие стихи описывают именно эту птицу.
- source_word: נֶעֱלָסָה
  choice: радостно хлопают
  rationale: Форма передаёт ликование или оживлённое движение; сочетание выражает и взмахи крыльев, и оттенок радостного возбуждения.
- source_word: אִם
  choice: разве это
  rationale: Частица вводит эллиптический риторический вопрос; такой перевод сохраняет вопросительность и сравнение, не устраняя трудность текста.
- source_word: אֶבְרָה
  choice: маховые перья
  rationale: Слово обозначает крупные перья крыла, а не крыло вообще; «маховые перья» — точный и понятный современный русский термин.
- source_word: חֲסִידָה
  choice: аиста
  rationale: Здесь это название птицы «аист», что соответствует зоологическому контексту и сочетанию с оперением.
- source_word: וְנֹצָה
  choice: и оперение
  rationale: Слово означает перья или оперение; «оперение» сохраняет поэтическую собирательность и хорошо сочетается с «маховыми перьями».
theological_decisions:
- issue: Связь второй половины стиха с первой
  choice: 'риторический вопрос: «разве это…?»'
  alternative: 'противительное сопоставление: «но разве это…?» или утверждение о крыле аиста'
  rationale: Еврейская строка синтаксически трудна, а אִם допускает несколько способов понимания. Основной текст сохраняет вопросительную силу, а примечание сообщает о другой возможной связи частей стиха.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим звучанием. Термины «маховые перья» и «оперение» точны, понятны и передают различие между אֶבְרָה и נֹצָה; подлинная синтаксическая неоднозначность отмечена в сноске.
