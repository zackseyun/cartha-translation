  text: כִּֽי הִשָּׁ֣/הּ אֱל֣וֹהַּ חָכְמָ֑ה וְ/לֹא חָ֥לַק לָ֝֗/הּ בַּ/בִּינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/017.yaml
  text: because God has deprived her of wisdom and has not given her a share in understanding[a][b].
translation:
  language: ru
  text: Потому что Бог лишил её мудрости[a] и не наделил её разумением[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что Бог заставил её забыть мудрость»; возможно также: «сделал так, что ей недостаёт мудрости».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не выделил ей доли в разумении», то есть не дал ей разумения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину поведения страусихи, описанного в контексте; причинное значение передано прямо и естественно.
- source_word: הִשָּׁהּ
  choice: лишил её
  rationale: Каузативная форма глагола נשה указывает, что Бог сделал мудрость недоступной для неё. «Лишил её» естественно передаёт этот смысл, а возможные значения «заставил забыть» и «сделал так, что ей недостаёт» сохранены в сноске.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Обычная передача единственного божественного наименования אֱלוֹהַּ в книге Иова; контекст не требует расширенного перевода.
- source_word: חָכְמָה
  choice: мудрости
  rationale: Слово обозначает мудрость, включая здравое суждение и присущую существу способность поступать разумно.
- source_word: וְלֹא
  choice: и не
  rationale: Сохраняет сочинительную связь и отрицание второй части стиха.
- source_word: חָלַק לָהּ
  choice: не наделил её
  rationale: Глагол חָלַק буквально связан с разделением и выделением доли. В русском «наделил» естественно выражает предоставление удела или способности; буквальный распределительный оттенок отмечен в сноске.
- source_word: בַּבִּינָה
  choice: разумением
  rationale: «Разумение» передаёт способность понимать и различать, сохраняя смысловое отличие от «мудрости» и соответствуя возвышенному, но понятному регистру книги Иова.
theological_decisions:
- issue: Прямое действие Бога в отсутствии у страусихи мудрости
  choice: Бог прямо назван тем, кто лишил её мудрости и не наделил разумением.
  alternative: 'Смягчённая формулировка без прямого указания на действие Бога, например: «ей недостаёт мудрости».'
  rationale: В еврейском тексте אֱלוֹהַּ — явно выраженное подлежащее обоих глаголов. Перевод сохраняет прямое приписывание действия Богу и не снимает возникающего богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Формулировка ясна обычному читателю; пара «мудрость — разумение» сохраняет различие двух еврейских существительных. Местоимение женского рода соотносится со страусихой из ближайшего контекста.
