base_translation:
  language: en
  yaml_path: translation/ot/job/039/025.yaml
  text: At the blast of the trumpet he says[a], ‘Aha!’ From far away he smells the battle[c][b], the thunder of commanders and the war cry.
translation:
  language: ru
  text: 'При звуке рога он восклицает: «Ага!»[a] Издалека он чует битву, гром военачальников и боевой клич.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ага!» — возглас возбуждения и нетерпеливой готовности коня устремиться в бой.
    reason: cultural_note
  - marker: b
    text: 'Или: «рёв военачальников и трубный сигнал». Слово, переведённое как «гром», буквально означает гром и здесь образно описывает оглушительный шум; слово, переведённое как «боевой клич», может также обозначать сигнальный звук трубы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֵי שֹׁפָר
  choice: При звуке рога
  rationale: Оборот указывает на момент, когда звучит шофар. «При звуке рога» естественно передаёт временное значение и сохраняет конкретный образ сигнального рога.
- source_word: יֹאמַר
  choice: он восклицает
  rationale: Буквально глагол означает «говорит», однако при междометии и олицетворении боевого коня «восклицает» естественно выражает энергичную реакцию, не меняя её содержания.
- source_word: הֶאָח
  choice: Ага!
  rationale: Междометие передаёт возбуждение и нетерпеливую готовность коня к бою; «Ага!» кратко и выразительно сохраняет олицетворение.
- source_word: וּמֵרָחוֹק
  choice: Издалека
  rationale: Краткое поэтическое соответствие, ясно обозначающее расстояние.
- source_word: יָרִיחַ מִלְחָמָה
  choice: он чует битву
  rationale: Глагол относится к восприятию запаха. Русское «чуять» сохраняет конкретный образ обоняния и одновременно естественно сочетается с предчувствием близкой битвы.
- source_word: רַעַם שָׂרִים
  choice: гром военачальников
  rationale: «Гром» сохраняет метафору רַעַם, а «военачальники» передаёт военное значение שָׂרִים в данном контексте.
- source_word: וּתְרוּעָה
  choice: и боевой клич
  rationale: Слово может обозначать громкий крик либо сигнальный трубный звук; в параллели с шумом военачальников «боевой клич» наиболее естественен, при этом альтернатива отмечена в сноске.
