  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: временной оборот בְּדֵי שׁוֹפָר («при звуке рога»), эмоциональную реплику коня, восприятие битвы издали и заключительные образы громкого военного шума. «Чует» удачно сохраняет конкретный образ обоняния в יָרִיחַ, а «гром военачальников» воспроизводит метафорическую силу רַעַם, не превращая её в однозначно истолкованный «крик».'
  naturalness: Перевод звучит естественно на современном литературном русском и сохраняет сжатую, энергичную поэтическую структуру. «При звуке рога», «издалека он чует битву» и «боевой клич» ясны и стилистически уместны. «Ага!» передаёт возбуждённое междометие הֶאָח; сноска предотвращает неверное понимание его как иронии или обнаружения чего-либо.
