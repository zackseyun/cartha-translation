  text: תִּ֭כְרַעְנָה יַלְדֵי/הֶ֣ן תְּפַלַּ֑חְנָה חֶבְלֵי/הֶ֥ם תְּשַׁלַּֽחְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/039/003.yaml
  text: They crouch down[a], they bring forth their young[b]; they cast off their labor pains.
translation:
  language: ru
  text: Они приседают[a], рождают своих детёнышей и сбрасывают с себя родовые муки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «опускаются на колени».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отсылают свои родовые муки».'
    reason: literal_rendering
lexical_decisions:
- source_word: תִּכְרַעְנָה
  choice: приседают
  rationale: Глагол כרע обозначает опускание тела, преклонение или приседание. В контексте родов у животных «приседают» естественно передаёт соответствующую позу, не привнося религиозного оттенка слова «преклоняются».
- source_word: יַלְדֵיהֶן
  choice: своих детёнышей
  rationale: Субстантивированная форма от ילד означает рождённых; применительно к диким животным современное русское «детёнышей» точно и естественно.
- source_word: תְּפַלַּחְנָה
  choice: рождают
  rationale: В данном родовом контексте форма передаёт появление детёнышей на свет. «Рождают» ясно выражает смысл, тогда как более буквальный образ рассечения или исторжения по-русски звучал бы неестественно и чрезмерно резко.
- source_word: חֶבְלֵיהֶם
  choice: родовые муки
  rationale: חבלים может обозначать боли или муки, особенно схватки при родах. Контекст исключает обычное значение «верёвки, узы».
- source_word: תְּשַׁלַּחְנָה
  choice: сбрасывают с себя
  rationale: שלח буквально означает «отсылать, отпускать». Образное «сбрасывают с себя» сохраняет активность и поэтическую выразительность исходного оборота применительно к прекращающимся родовым мукам.
