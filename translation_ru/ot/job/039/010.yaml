  text: Will you bind the wild ox in the furrow with its rope[b][a], or will it harrow the valleys behind you?
translation:
  language: ru
  text: Привяжешь ли ты дикого быка[a] в борозде его верёвкой, или станет он боронить[b] долины позади тебя?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тура» или «дикого вола». Еврейское רֵים обозначает сильное дикое полорогое животное, а не мифического «единорога», упоминаемого в некоторых старых переводах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обрабатывать» или «разравнивать». Еврейский глагол обозначает работу с почвой и, вероятно, относится к боронованию или разравниванию, а не к первоначальной вспашке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִקְשָׁר
  choice: Привяжешь ли ты
  rationale: Глагол קשׁר означает «связывать, привязывать». Вопросительная форма сохраняет риторический характер Божьего вопроса.
- source_word: רֵים
  choice: дикого быка
  rationale: Слово обозначает крупное и сильное дикое полорогoe животное, вероятно тура; понятное выражение «дикий бык» передаёт образ необузданной силы, не отсылая к мифическому единорогу.
- source_word: בְּתֶלֶם
  choice: к борозде
  rationale: תלם — борозда, проведённая плугом. Предлог передан естественным для русского земледельческого образа сочетанием, хотя возможен пространственный смысл «в борозде».
- source_word: עֲבֹתוֹ
  choice: верёвкой
  rationale: עבות означает толстый шнур или верёвку для связывания. Притяжательный суффикс в русском не выражен отдельно, поскольку «его верёвкой» могло бы ошибочно подразумевать принадлежность верёвки животному.
- source_word: אִם
  choice: или
  rationale: Здесь אִם вводит вторую часть параллельного риторического вопроса, а не условие.
- source_word: יְשַׂדֵּד
  choice: станет он боронить
  rationale: В данном земледельческом контексте глагол, вероятно, означает обработку, разрыхление или выравнивание почвы после вспашки; «боронить» точно и кратко передаёт этот смысл.
- source_word: עֲמָקִים
  choice: долины
  rationale: Обычное значение существительного — «долины, низины». Перевод сохраняет конкретный ландшафтный образ, не заменяя его толкованием «поля» или «пашни».
- source_word: אַחֲרֶיךָ
  choice: позади тебя
  rationale: Выражение буквально указывает на следование животного за человеком; перевод сохраняет пространственный образ.
