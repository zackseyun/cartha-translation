base_translation:
  language: en
  yaml_path: translation/ot/job/039/014.yaml
  text: For she leaves her eggs to the earth and warms them on the dust,[a]
translation:
  language: ru
  text: Ведь она оставляет свои яйца на земле и согревает их в пыли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросает свои яйца на землю». Еврейский глагол может выражать более сильное значение, чем «оставляет», однако следующая строка скорее рисует яйца лежащими открыто на земле, а не говорит о полном отказе от них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт объяснительно-причинную связь с предыдущим описанием страуса и естественно звучит в русском поэтическом повествовании.
- source_word: תַעֲזֹב
  choice: оставляет
  rationale: Глагол может означать также «покидает» или «бросает», однако нейтральное «оставляет» не усиливает без необходимости представление о полном отказе от яиц.
- source_word: לָאָרֶץ
  choice: на земле
  rationale: Русское «на земле» естественно передаёт положение яиц на поверхности земли и сохраняет параллелизм с последующим «в пыли».
- source_word: בֵּצֶיהָ
  choice: свои яйца
  rationale: Возвратное притяжательное местоимение естественно в русском языке и ясно соотносит яйца с самкой страуса.
- source_word: וְעַל עָפָר
  choice: в пыли
  rationale: Хотя предлог עַל буквально означает «на», сочетание «в пыли» естественнее по-русски для яиц, лежащих на пыльной земле, и сохраняет конкретный поэтический образ עָפָר.
- source_word: תְּחַמֵּם
  choice: согревает их
  rationale: Прямо передаёт каузативное значение породы пиэль — «делать тёплым»; дополнение «их» ясно восстанавливается из упомянутых яиц, без более специального толкования «высиживает».
