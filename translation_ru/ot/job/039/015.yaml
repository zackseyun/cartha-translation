  text: и забывает, что какая-нибудь нога может раздавить их[a], а дикое животное может растоптать их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «раздавит её… растопчет её». Суффикс женского рода единственного числа, вероятно, собирательно относится к оставленным яйцам (или птенцам). «Дикое животное» буквально: «зверь поля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: и забывает
  rationale: Форма wayyiqtol 3-го лица женского рода продолжает поэтическое описание страусихи; настоящее время естественно передаёт живую картину контекста.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, о чём она забывает, а не причинное придаточное.
- source_word: רֶגֶל
  choice: нога
  rationale: 'Единственное число имеет обобщённо-неопределённое значение: любая наступившая нога.'
- source_word: תְּזוּרֶהָ
  choice: может раздавить их
  rationale: В сочетании с ногой глагол обозначает повреждение от наступания; местоимение передано множественным числом по смыслу, поскольку речь идёт о яйцах из предыдущего стиха.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: а полевой зверь
  rationale: Так сохраняется конкретный образ еврейского выражения «зверь поля» при естественном русском словоупотреблении.
- source_word: תְּדוּשֶׁהָ
  choice: растоптать
  rationale: Глагол דושׁ здесь означает топтать ногами; выбор сохраняет параллелизм с «раздавить».
