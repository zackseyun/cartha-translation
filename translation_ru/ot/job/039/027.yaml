    reason: translation_clarity
lexical_decisions:
- source_word: אִם
  choice: разве
  rationale: В данном контексте вводит риторический вопрос, а не условие; «разве» естественно передаёт ожидаемый отрицательный ответ.
- source_word: עַל־פִּיךָ
  choice: по твоему повелению
  rationale: Буквально «по твоим устам»; это идиома, обозначающая действие по чьему-либо слову или приказу.
- source_word: יַגְבִּיהַּ
  choice: взмывает ввысь
  rationale: Каузативная форма от גבה выражает подъём на высоту; применительно к птице «взмывает ввысь» естественно и сохраняет образ высоты.
- source_word: נָשֶׁר
  choice: орёл
  rationale: Традиционное и контекстуально уместное соответствие; еврейское слово может обозначать крупную хищную птицу шире, включая в некоторых контекстах грифа.
- source_word: וְכִי
  choice: и
  rationale: Связывает вторую часть с первой в рамках одного риторического вопроса; в русском отдельная передача частицы כִּי не требуется.
- source_word: יָרִים קִנּוֹ
  choice: устраивает своё гнездо высоко
  rationale: Буквально сочетание говорит о «поднятии» гнезда, но по смыслу описывает устройство гнезда на высоте; выбранная формулировка естественна по-русски и сохраняет пространственный образ.
