lexical_decisions:
- source_word: אֲשֶׁר
  choice: которому
  rationale: Относительное слово относится к дикому ослу из предыдущего стиха; дательный оттенок естественно передаётся формой «которому».
- source_word: שַׂמְתִּי
  choice: Я дал
  rationale: Буквально глагол означает «положил, поместил, назначил», но в сочетании с образом дома выражает предоставление места обитания.
- source_word: עֲרָבָה
  choice: пустыню
  rationale: Слово обозначает сухую пустынную или степную местность; «пустыня» ясно и естественно передаёт образ.
- source_word: בֵיתוֹ
  choice: под дом
  rationale: Буквально «его дом»; конструкция «дал ... под дом» сохраняет метафору и естественна в современном русском языке.
- source_word: מִשְׁכְּנוֹתָיו
  choice: жилища
  rationale: Сохранено грамматическое множественное число еврейского текста, которое может быть поэтическим обозначением места обитания.
- source_word: מְלֵחָה
  choice: солончак
  rationale: Обозначает засолённую бесплодную землю; «солончак» точно, кратко и понятно передаёт природный образ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. Местоимение «Я», относящееся к Богу, написано с прописной буквы согласно принятой русской библейской традиции. Тире во второй половине восполняет подразумеваемое «дал» без тяжеловесного повтора.
