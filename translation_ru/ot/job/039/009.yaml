  text: Will the wild ox be willing to serve you? Will he spend the night at your feeding trough?[a][b]
translation:
  language: ru
  text: Захочет ли дикий бык служить тебе? Станет ли он ночевать у твоей кормушки?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у твоих яслей». Еврейское слово обозначает место, куда кладут корм животным.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дикий вол»; возможно, имеется в виду тур. Точно определить животное, названное здесь еврейским словом, невозможно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֹאבֶה
  choice: Захочет ли
  rationale: Глагол אָבָה выражает желание или согласие, а не способность; «захочет ли» естественно передаёт волевой оттенок риторического вопроса.
- source_word: רֵּים
  choice: дикий бык
  rationale: Точный вид животного не установлен. «Дикий бык» понятно современному читателю и сохраняет образ крупного, неукрощённого животного, не утверждая более точной зоологической идентификации.
- source_word: עָבְדֶךָ
  choice: служить тебе
  rationale: Форма от עבד здесь означает служение или работу на хозяина; этот перевод краток и сохраняет противопоставление домашнего рабочего животного дикому.
- source_word: אִם
  choice: Станет ли
  rationale: Частица вводит второй параллельный риторический вопрос. Отдельный вопрос с повторной вопросительной конструкцией звучит естественно по-русски.
- source_word: יָלִין
  choice: ночевать
  rationale: Глагол לין обозначает пребывание на ночь; «ночевать» точно и естественно передаёт этот смысл.
- source_word: עַל
  choice: у
  rationale: При обозначении кормушки предлог «у» естественно выражает нахождение возле места кормления, соответствуя контекстуальному значению еврейского עַל.
- source_word: אֲבוּסֶךָ
  choice: у твоей кормушки
  rationale: אֵבוּס обозначает кормушку или место кормления животных. «Кормушка» — современное, конкретное и понятное соответствие.
