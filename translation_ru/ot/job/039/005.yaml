lexical_decisions:
- source_word: מִי
  choice: кто
  rationale: Вопросительное местоимение вводит два параллельных риторических вопроса Бога.
- source_word: שִׁלַּח
  choice: отпустил
  rationale: В сочетании с חָפְשִׁי глагол означает освобождение; «отпустил на свободу» естественно звучит по-русски.
- source_word: פֶּרֶא
  choice: дикий осёл
  rationale: Общепонятное современное обозначение дикого осла.
- source_word: חָפְשִׁי
  choice: на свободу
  rationale: Передаёт свободное состояние животного как результат действия שִׁלַּח.
- source_word: וּמֹסְרוֹת
  choice: путы
  rationale: Конкретное и литературное обозначение уз или привязей, удерживающих животное.
- source_word: עָרוֹד
  choice: онагр
  rationale: Точный русский зоологический термин для дикого осла; сохраняет различие между двумя еврейскими названиями, не добавляя неподтверждённого значения «быстрый».
- source_word: פִתֵּחַ
  choice: развязал
  rationale: При слове «путы» означает освобождение от удерживающих уз и естественно передаётся глаголом «развязал».
