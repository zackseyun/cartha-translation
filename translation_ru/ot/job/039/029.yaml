lexical_decisions:
- source_word: מִשָּׁם
  choice: Оттуда
  rationale: Точно и естественно передаёт исходную точку наблюдения — место, где находится орёл.
- source_word: חָפַר
  choice: высматривает
  rationale: Обычное значение глагола связано с копанием или разыскиванием, но применительно к орлу и пище контекст требует смысла настойчивого зрительного поиска. «Высматривает» естественно передаёт этот образ.
- source_word: אֹכֶל
  choice: пищу
  rationale: Сохраняет широкое значение еврейского существительного; в данном контексте пищей орла является добыча.
- source_word: לְמֵרָחוֹק
  choice: вдаль
  rationale: Передаёт направленность взгляда на большое расстояние и хорошо сочетается по-русски с глаголом «смотрят».
- source_word: עֵינָיו יַבִּיטוּ
  choice: глаза его смотрят
  rationale: Сохраняет конкретный образ и множественное число еврейской конструкции, не заменяя её более отвлечённым описанием острого зрения.
