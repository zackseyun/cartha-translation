  source_fidelity: 'Текст точно передаёт еврейскую строку: אֶפְרֹחָיו — «его птенцы», יְעַלְעוּ דָם — «жадно глотают кровь», חֲלָלִים — «убитые», а שָׁם הוּא — «там и он». Образ крови и насильственной смерти не смягчён. Добавленное «жадно» обоснованно передаёт интенсивный, выразительный характер редкого глагола.'
