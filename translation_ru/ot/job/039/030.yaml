  text: ו/אפרח/ו יְעַלְעוּ דָ֑ם וּ/בַ/אֲשֶׁ֥ר חֲ֝לָלִ֗ים שָׁ֣ם הֽוּא־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/039/030.yaml
  text: Its young ones suck up blood[a], and where the slain are[b], there it is.
translation:
  language: ru
  text: Его птенцы жадно глотают кровь[a], и где убитые[b], там и он.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высасывают кровь»; еврейский глагол выразителен и может означать всасывание, жадное заглатывание или лакание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «где павшие»; еврейское слово указывает на тех, кто погиб насильственной смертью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרֹחָיו
  choice: его птенцы
  rationale: Существительное обозначает птенцов хищной птицы в данном контексте; русское «птенцы» естественно и не уточняет без необходимости стадию их развития.
- source_word: יְעַלְעוּ
  choice: жадно глотают
  rationale: Редкий выразительный глагол передаёт энергичное всасывание или заглатывание. «Жадно глотают» сохраняет живой и резкий образ, не связывая действие исключительно с лаканием.
- source_word: דָם
  choice: кровь
  rationale: Прямое соответствие еврейскому слову; смягчать образ контекст не требует.
- source_word: וּבַאֲשֶׁר
  choice: и где
  rationale: Относительная конструкция вводит обстоятельство места; это прямой и естественный русский оборот.
- source_word: חֲלָלִים
  choice: убитые
  rationale: Слово обозначает павших от насильственной смерти. «Убитые» сохраняет этот смысл и не сводит образ просто к телам.
- source_word: שָׁם הוּא
  choice: там и он
  rationale: Местоимение мужского рода отсылает к птице из ближайшего контекста. Русский язык естественно сохраняет мужской род, а частица «и» передаёт идиоматическую связь «где..., там...».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением краткости и выразительности поэтической строки. Графический образ не смягчён; синтаксис «где..., там...» звучит естественно и достойно.
