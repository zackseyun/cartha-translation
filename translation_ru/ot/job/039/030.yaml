  terminology: «Птенцы» не чрезмерно конкретизирует вид птицы; «убитые» верно сохраняет смысл людей, погибших насильственной смертью, в отличие от нейтрального «мёртвые». Мужской род «он» уместен, поскольку речь идёт о птице, названной в предшествующем контексте мужским существительным.
