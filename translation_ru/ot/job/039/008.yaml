  yaml_path: translation/ot/job/039/008.yaml
  text: He explores the mountains for his pasture[b][a], and he searches after every green thing.
translation:
  language: ru
  text: 'Он обходит горы, своё пастбище,

    и ищет всякую зелень[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Зелень» — свежая зелёная растительность, служащая кормом.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתוּר
  choice: рыщет
  rationale: Глагол תור в породе qal передаёт исследование местности, разведку или свободное перемещение в поисках чего-либо. «Рыщет» естественно описывает передвижение дикого осла в поисках корма, не сводя значение к статичному «ищет».
- source_word: הָרִים
  choice: по горам
  rationale: Существительное означает «горы»; русский предлог «по» естественно передаёт пространство, которое животное обходит и исследует.
- source_word: מִרְעֵהוּ
  choice: себе пастбище
  rationale: מִרְעֶה означает пастбище, место выпаса или корм. Возвратное «себе» естественно передаёт суффикс 3-го лица мужского рода и связь пастбища с животным.
- source_word: וְאַחַר
  choice: и разыскивает
  rationale: Сочетание אַחַר с דרשׁ выражает направленный поиск. В русском это значение естественно заключено в глаголе «разыскивает», поэтому буквальное «вслед за» не требуется.
- source_word: כָּל
  choice: всякую
  rationale: כָּל употреблено распределительно и указывает на всю доступную зелёную растительность; «всякую» сохраняет эту широту.
- source_word: יָרוֹק
  choice: зелень
  rationale: Слово обозначает нечто зелёное, прежде всего свежую растительность. «Зелень» в данном контексте звучит естественно и сохраняет широкое, нетехническое значение.
- source_word: יִדְרֹשׁ
  choice: разыскивает
  rationale: דרשׁ в qal означает искать, разыскивать. «Разыскивает» передаёт активный поиск корма и направленность, усиленную сочетанием с אַחַר.
