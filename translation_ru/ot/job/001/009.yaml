  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר הַֽ/חִנָּ֔ם יָרֵ֥א אִיּ֖וֹב אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/009.yaml
  text: Then the Accuser answered Yahweh and said[b][a], “Does Job fear God for nothing?"
translation:
  language: ru
  text: 'Тогда обвинитель[a] ответил Яхве и сказал: «Разве Иов даром[b] боится Бога?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обвиняющий»; возможно также: «противник» или «сатана». В еврейском тексте слово употреблено с артиклем и здесь обозначает роль или титул.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «без причины», «без всякой выгоды». Вопрос касается того, бескорыстен ли страх Иова перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: В повествовательной формуле глагол ענה обозначает ответ на предшествующую речь; «ответил» естественно передаёт диалогическую структуру.
- source_word: הַשָּׂטָן
  choice: обвинитель
  rationale: Артикль указывает здесь на роль или титул, а не обязательно на личное имя. «Обвинитель» передаёт судебно-обличительную функцию персонажа в данной сцене.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем יְהוָה и титулом אֱלֹהִים в той же фразе.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Сохранена обычная еврейская формула введения прямой речи «ответил… и сказал»; хотя по-русски она несколько повторна, здесь она понятна и воспроизводит ритм оригинала.
- source_word: הֲחִנָּם
  choice: даром
  rationale: '«Даром» сохраняет смысловую двойственность: без причины и без выгоды или вознаграждения; вопрос ставит под сомнение бескорыстие богобоязненности Иова.'
- source_word: יָרֵא
  choice: боится
  rationale: Глагол ירא по отношению к Богу включает благоговейный страх. «Боится» сохраняет основное лексическое значение, не сводя его только к почитанию.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном контексте אֱלֹהִים обозначает Бога, Которого боится Иов; русская форма обусловлена управлением глагола «боится».
theological_decisions:
- issue: Передача הַשָּׂטָן с определённым артиклем
  choice: обвинитель
  alternative: сатана; противник
  rationale: Выбранное обозначение сохраняет роль персонажа в небесном разбирательстве и не превращает титул без достаточных оснований в собственное имя. В сноске оставлены буквальная и иная контекстуальная возможности.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале употреблено личное имя Бога, поэтому транслитерация «Яхве» сохраняет его и одновременно отличает от אֱלֹהִים — «Бог».
- issue: Смысл הֲחִנָּם в вопросе об Иове
  choice: даром
  alternative: без причины; бескорыстно
  rationale: «Даром» не разрешает однозначно, спрашивает ли обвинитель об отсутствии причины или об отсутствии выгоды; тем самым сохраняется богословское напряжение вопроса о бескорыстии веры Иова.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Формула «ответил… и сказал» намеренно сохранена как заметная, но понятная особенность еврейского повествования; лексика остаётся доступной обычному читателю.
