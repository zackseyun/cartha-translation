review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: речь о регулярно происходивших пирах сыновей, проходивших у каждого в доме, и о приглашении трёх сестёр. Однако «по очереди» вносит в основной текст одно из возможных истолкований выражения «в свой день», тогда как еврейский текст сохраняет его неопределённость. Глагол «посылали за» допустим, но в связке с деепричастием «приглашая» несколько ослабляет два координированных глагола оригинала.'
  naturalness: Исправленный вариант сохраняет современный литературный русский и более ровно организует длинное предложение. «Обычно устраивали пиры» естественно выражает обычное действие в прошлом; распределительное «каждый — в своём доме, в свой день» ясно и не перегружено.
  terminology: «Пиры», «сыновья», «сёстры», «есть и пить» — точные и стилистически уместные соответствия. Сноска обоснованно сохраняет альтернативу «день рождения» и уточняет буквальное значение исходного выражения.
