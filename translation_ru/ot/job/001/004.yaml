base_translation:
  language: en
  yaml_path: translation/ot/job/001/004.yaml
  text: His sons would go and hold a feast[a], each in his own house on his day, and they would send and invite their three sisters to eat and drink with them.
translation:
  language: ru
  text: 'Его сыновья обычно устраивали пиры: каждый — в своём доме, в свой день[a]; они посылали за своими тремя сёстрами и приглашали их есть и пить вместе с ними.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «в день своего рождения». Буквально в еврейском тексте: «в свой день»; речь может идти либо о дне, отведённом каждому сыну, либо о его дне рождения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: по очереди устраивали
  rationale: Форма описывает повторявшийся обычай в прошлом; по-русски это естественно передаётся несовершенным видом. Идея движения не выделена отдельно, поскольку в сочетании с последующим глаголом контекст описывает регулярный круг пиров.
- source_word: בָנָיו
  choice: его сыновья
  rationale: Существительное имеет мужской род и множественное число; дочери далее упомянуты отдельно.
- source_word: וְעָשׂוּ מִשְׁתֶּה
  choice: устраивали пиры
  rationale: Еврейское выражение буквально означает «делали пир»; «устраивали пиры» точно и естественно передаёт праздничное застолье и повторяемость действия.
- source_word: בֵּית אִישׁ
  choice: каждый в своём доме
  rationale: 'אִישׁ имеет распределительное значение: каждый из сыновей принимал остальных у себя.'
- source_word: יוֹמוֹ
  choice: в свой день
  rationale: 'Сохранена буквальная и неоднозначная формулировка источника: это может быть назначенный каждому день или день рождения.'
- source_word: וְשָׁלְחוּ וְקָרְאוּ
  choice: посылали за… приглашая
  rationale: 'Переданы оба действия: отправляли за сёстрами и звали их участвовать в пире. Русская конструкция звучит естественно и сохраняет повторяемость.'
- source_word: לִשְׁלֹשֶׁת אֲחִיתֵיהֶם
  choice: за тремя своими сёстрами
  rationale: Числительное и родственное обозначение переданы прямо; возвратное притяжательное местоимение естественно указывает на сестёр сыновей.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: есть и пить
  rationale: Прямой эквивалент стандартной пары инфинитивов, обозначающей участие в пире.
- source_word: עִמָּהֶם
  choice: вместе с ними
  rationale: Передаёт совместное участие сестёр с братьями в трапезе.
