base_translation:
  language: en
  yaml_path: translation/ot/job/001/006.yaml
  text: There was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them.
translation:
  language: ru
  text: Однажды сыны Божьи[a] пришли предстать перед Яхве, и Противник[b] также пришёл в их среду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «сыны Божьи» может обозначать небесных существ, входящих в небесный совет.
    reason: cultural_note
  - marker: b
    text: Традиционно — «сатана». В еврейском тексте стоит слово «сатан» с определённым артиклем; здесь оно может быть титулом или обозначением роли — «противник», а не личным именем.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Настал день
  rationale: Естественно вводит новую сцену и сохраняет образ наступившего дня, не добавляя отсутствующего в еврейском тексте отдельного наречия «теперь».
- source_word: בְּנֵי הָאֱלֹהִים
  choice: сыны Божьи
  rationale: Формально близкая передача сохраняет образность и неоднозначность еврейского выражения; толкование как небесных существ вынесено в примечание.
- source_word: לְהִתְיַצֵּב
  choice: предстать
  rationale: В данном контексте глагол означает явиться и занять своё место перед вышестоящим; «предстать» передаёт это кратко и естественно.
- source_word: עַל יְהוָה
  choice: перед Яхве
  rationale: При глаголе предстояния предлог עַל выражает явление перед кем-либо; буквальное пространственное «над» здесь неуместно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: הַשָּׂטָן
  choice: Противник
  rationale: Нарицательное значение и наличие определённого артикля указывают здесь скорее на обозначение роли или титул, чем на однозначно закреплённое личное имя.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Естественная современная передача включённости в собравшуюся группу.
theological_decisions:
- issue: Следует ли понимать הַשָּׂטָן как личное имя или как обозначение роли
  choice: Противник
  alternative: сатана; обвинитель
  rationale: Определённый артикль в еврейском тексте позволяет понимать слово как титул или роль. Основной текст сохраняет его широкое лексическое значение, а традиционная передача приведена в примечании.
- issue: Следует ли истолковывать בְּנֵי הָאֱלֹהִים в основном тексте
  choice: сыны Божьи
  alternative: небесные существа; божественные существа
  rationale: Хотя в контексте выражение, вероятно, обозначает существ небесного совета, буквальный образ сохранён, чтобы не устранять присущую исходному тексту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Настал день» естественно открывает сцену; «предстать перед» сохраняет придворно-судебный оттенок без архаизации. Написание «Противник» с прописной буквы отмечает титульное употребление, не превращая его безоговорочно в личное имя.
