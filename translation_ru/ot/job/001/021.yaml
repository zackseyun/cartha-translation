base_translation:
  language: en
  yaml_path: translation/ot/job/001/021.yaml
  text: And he said[a], “Naked I came out from my mother’s womb, and naked I will return there. Yahweh gave, and Yahweh has taken away[b]. May the name of Yahweh be blessed.”
translation:
  language: ru
  text: 'Он сказал: «Нагим я вышел из утробы моей матери и нагим возвращусь туда[a]. Яхве дал, и Яхве взял; да будет благословенно имя Яхве»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст буквально говорит «туда», не называя места возвращения. Это может образно отсылать к материнской утробе, к земле или могиле либо к состоянию, в котором у человека ничего нет.
    reason: alternative_reading
  - marker: b
    text: Яхве — передача еврейского יהוה (YHWH), личного имени Бога; по традиции его часто переводят словом «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֹם
  choice: нагим
  rationale: Передаёт буквальную наготу и более широкий смысл полного отсутствия имущества; форма в начале обеих частей сохраняет смысловой акцент оригинала.
- source_word: יצתי
  choice: я вышел
  rationale: Обычное значение глагола יצא; в сочетании с утробой матери ясно обозначает рождение.
- source_word: מִבֶּטֶן אִמִּי
  choice: из утробы матери моей
  rationale: Прямо сохраняет телесную образность еврейского текста и его торжественно-поэтический строй.
- source_word: וְעָרֹם אָשׁוּב שָׁמָה
  choice: и нагим возвращусь туда
  rationale: Сохраняет שָׁמָה («туда») и не уточняет подразумеваемое место, оставляя исходную неоднозначность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: נָתַן
  choice: дал
  rationale: Простая завершённая форма естественно соответствует еврейскому перфекту и параллельной фразе.
- source_word: לָקָח
  choice: взял
  rationale: Максимально прямо передаёт значение לקח; контекст утраты делает добавление «обратно» или «отнял» необязательным.
- source_word: יְהִי
  choice: да будет
  rationale: Естественно передаёт юссив — пожелание или благословение.
- source_word: שֵׁם יְהוָה
  choice: имя Яхве
  rationale: Сохраняет конструкцию исходного текста и её благоговейный смысл.
- source_word: מְבֹרָךְ
  choice: благословенно
  rationale: Передаёт пассивное значение формы, не сужая его до «прославлено».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон; «Яхве» сохраняет личное имя Бога, не подменяя его титулом.
- issue: Значение שָׁמָה («туда»)
  choice: сохранить буквальное «туда»
  alternative: вернусь в землю; вернусь в могилу; вернусь в утробу матери
  rationale: Референт наречия в еврейском тексте прямо не назван. Перевод не должен устранять возможную связь с утробой, землёй/могилой или состоянием полной наготы и отсутствия имущества.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «из утробы матери моей» и формула «да будет благословенно» уместно сохраняют достоинство и ритм изречения, оставаясь понятными современному читателю.
