  text: וַ/יְהִ֣י מִ֠קְנֵ/הוּ שִֽׁבְעַ֨ת אַלְפֵי צֹ֜אן וּ/שְׁלֹ֧שֶׁת אַלְפֵ֣י גְמַלִּ֗ים וַ/חֲמֵ֨שׁ מֵא֤וֹת צֶֽמֶד בָּקָר֙ וַ/חֲמֵ֣שׁ מֵא֣וֹת אֲתוֹנ֔וֹת וַ/עֲבֻדָּ֖ה רַבָּ֣ה מְאֹ֑ד וַ/יְהִי֙ הָ/אִ֣ישׁ הַ/ה֔וּא גָּד֖וֹל מִ/כָּל בְּנֵי קֶֽדֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/003.yaml
  text: His livestock were seven thousand sheep[a], three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household; and that man was greater than all the sons of the east.
translation:
  language: ru
  text: У него было семь тысяч овец, три тысячи верблюдов, пятьсот пар волов, пятьсот ослиц и великое множество слуг[a]. Этот человек превосходил всех сынов Востока[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многочисленная прислуга»; возможно также: «очень большое хозяйство».'
    reason: Еврейское עֲבֻדָּה может обозначать службу, совокупность слуг и работников либо обслуживаемое ими хозяйство.
  - marker: b
    text: То есть всех людей, живших на Востоке.
    reason: Пояснение древнееврейской идиомы «сыны Востока».
lexical_decisions:
- source_word: מִקְנֵהוּ
  choice: у него было
  rationale: В контексте последующего перечня животных естественная русская конструкция передаёт наличие принадлежавшего Иову скота без тяжеловесного «его поголовье составляло».
- source_word: צֹאן
  choice: овец
  rationale: Слово может обозначать мелкий скот, включая овец и коз, но в данном исчислении традиционное и естественное соответствие «овцы» уместно.
- source_word: גְמַלִּים
  choice: верблюдов
  rationale: Прямое лексическое соответствие.
- source_word: צֶמֶד בָּקָר
  choice: пар волов
  rationale: צֶמֶד обозначает пару тягловых животных, работающих в одной упряжке; «пары волов» ясно передаёт и число, и хозяйственное назначение.
- source_word: אֲתוֹנוֹת
  choice: ослиц
  rationale: Форма в еврейском тексте прямо указывает на самок; русское «ослицы» кратко и естественно сохраняет эту деталь.
- source_word: עֲבֻדָּה רַבָּה מְאֹד
  choice: великое множество слуг
  rationale: В контексте богатого дома выражение, вероятно, обозначает многочисленную прислугу или обслуживающий хозяйство персонал. Сноска сохраняет возможное понимание как обширного хозяйства или службы.
- source_word: גָּדוֹל מִכָּל
  choice: превосходил всех
  rationale: Сравнительная конструкция указывает, что Иов превосходил остальных богатством, положением или значимостью; глагол не сужает смысл до одной характеристики.
- source_word: בְּנֵי קֶדֶם
  choice: сынов Востока
  rationale: Сохранён древнееврейский культурно-географический оборот; сноска разъясняет, что речь идёт о людях или жителях Востока.
theological_decisions:
- issue: Смысл превосходства Иова в выражении גָּדוֹל מִכָּל
  choice: превосходил всех
  alternative: был богаче всех / был самым знатным
  rationale: Контекст подчёркивает богатство, но прилагательное גָּדוֹל может охватывать также общественное положение и значимость. Перевод сохраняет эту смысловую широту.
- issue: Передача идиомы בְּנֵי קֶדֶם
  choice: сынов Востока
  alternative: жителей Востока / людей Востока
  rationale: Основной текст сохраняет форму древнееврейской идиомы, а сноска поясняет её собирательный географический смысл без привнесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Перечень передан ясно и ритмично; архаичные «челядь» и «ослицы женского пола» отвергнуты как соответственно устаревшее и неестественное выражения.
