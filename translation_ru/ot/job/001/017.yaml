  text: ע֣וֹד זֶ֣ה מְדַבֵּ֗ר וְ/זֶה֮ בָּ֣א וַ/יֹּאמַר֒ כַּשְׂדִּ֞ים שָׂ֣מוּ שְׁלֹשָׁ֣ה רָאשִׁ֗ים וַֽ/יִּפְשְׁט֤וּ עַל הַ/גְּמַלִּים֙ וַ/יִּקָּח֔וּ/ם וְ/אֶת הַ/נְּעָרִ֖ים הִכּ֣וּ לְ/פִי חָ֑רֶב וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/017.yaml
  text: While this one was still speaking[a], another came and said, “The Chaldeans formed three raiding parties, swept down on the camels and took them, and they struck down the young men with the edge of the sword[c][b]. And I alone have escaped to tell you.”
translation:
  language: ru
  text: 'Пока он ещё говорил, пришёл другой и сказал: «Халдеи разделились на три отряда[a], напали на верблюдов и угнали их, а слуг[b] сразили мечом[c]. Спастись удалось лишь мне одному, чтобы сообщить тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поставили три головы»; возможно также: «образовали три группы» или «выстроились тремя отрядами».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать молодых людей, слуг или домашних работников.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «поразили устами (остриём) меча» — еврейская идиома со значением «убили мечом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֣וֹד זֶ֣ה מְדַבֵּר
  choice: Пока он ещё говорил
  rationale: Передаёт продолжающееся действие и временное наложение событий; местоимение естественно отсылает к предыдущему вестнику.
- source_word: וְזֶה בָּא וַיֹּאמַר
  choice: пришёл другой и сказал
  rationale: В последовательности рассказов второе זֶה обозначает следующего вестника; по-русски естественно «другой».
- source_word: כַּשְׂדִּים
  choice: Халдеи
  rationale: Общепринятое русское обозначение народа, выступающего здесь как группа налётчиков.
- source_word: שָׂמוּ שְׁלֹשָׁה רָאשִׁים
  choice: разделились на три отряда
  rationale: Буквально «поставили три головы»; в контексте набега речь идёт о трёх подразделениях или группах.
- source_word: וַיִּפְשְׁטוּ עַל
  choice: напали на
  rationale: Передаёт внезапное вооружённое нападение без излишней конкретизации направления движения.
- source_word: וַיִּקָּחוּם
  choice: угнали их
  rationale: Суффикс указывает на верблюдов; «угнали» естественно описывает захват и увод животных.
- source_word: הַנְּעָרִים
  choice: слуг
  rationale: נְעָרִים может означать молодых людей, слуг или домашних работников; в хозяйственном контексте Иова «слуги» звучит естественно, при сохранении альтернативы в примечании.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: сразили мечом
  rationale: Естественно передаёт еврейскую идиому «по устам/острию меча», означающую убийство мечом.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Спастись удалось лишь мне одному
  rationale: Сохраняет усиленное указание на единственного спасшегося и хорошо звучит в срочном сообщении.
- source_word: לְהַגִּיד לָךְ
  choice: чтобы сообщить тебе
  rationale: Передаёт цель спасения в формуле вестника; «сообщить» соответствует характеру донесения.
