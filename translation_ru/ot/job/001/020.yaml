  text: וַ/יָּ֤קָם אִיּוֹב֙ וַ/יִּקְרַ֣ע אֶת מְעִל֔/וֹ וַ/יָּ֖גָז אֶת רֹאשׁ֑/וֹ וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/020.yaml
  text: Then Job rose[a], tore his robe, shaved his head, fell to the ground, and bowed down.
translation:
  language: ru
  text: Тогда Иов встал, разорвал на себе верхнюю одежду, обрил голову, пал на землю и поклонился[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрся ниц». Еврейский глагол обозначает склонение или простирание перед кем-либо, часто в знак почтения или поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Форма от קום обозначает следующее действие в повествовательной последовательности; «встал» кратко и естественно по-русски.
- source_word: וַיִּקְרַע אֶת מְעִילוֹ
  choice: разорвал на себе верхнюю одежду
  rationale: קרע означает разрывать одежду, здесь — в знак скорби; מְעִיל — значимая верхняя одежда. Оборот «на себе» естественно передаёт русский обычай описания этого жеста, не добавляя нового действия.
- source_word: וַיָּגָז אֶת רֹאשׁוֹ
  choice: обрил голову
  rationale: גזז буквально означает стричь или срезать волосы; в контексте траура «обрил голову» ясно и естественно передаёт этот жест.
- source_word: וַיִּפֹּל אַרְצָה
  choice: пал на землю
  rationale: Направительная форма אַרְצָה указывает на движение к земле; «пал на землю» сохраняет выразительность и достойный повествовательный регистр.
- source_word: וַיִּשְׁתָּחוּ
  choice: поклонился
  rationale: Глагол обозначает склонение или простирание перед кем-либо, часто как выражение почтения или поклонения. «Поклонился» сохраняет телесный жест и религиозный оттенок, не делая значение «поклонился Богу» явным сверх формулировки стиха.
theological_decisions:
- issue: Следует ли прямо назвать последнее действие Иова поклонением Богу или передать телесный жест с возможным религиозным смыслом
  choice: поклонился
  alternative: простёрся ниц; поклонился Богу
  rationale: Еврейский глагол допускает как описание телесного простирания, так и поклонение. Контекст следующего стиха поддерживает религиозный смысл, но в самом стихе объект не назван; поэтому перевод сохраняет эту смысловую напряжённость и не добавляет явно «Богу».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Цепочка последовательных действий сохранена; архаизмы избегаются, кроме стилистически уместного «пал».
