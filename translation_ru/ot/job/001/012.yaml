base_translation:
  language: en
  yaml_path: translation/ot/job/001/012.yaml
  text: And Yahweh said to the Accuser[a], “Look, all that he has is in your hand; only against him do not stretch out your hand.” Then the Accuser went out from the presence of Yahweh.
translation:
  language: ru
  text: 'И сказал Яхве Обвинителю[a]: «Вот, всё, что у него есть, — в твоей руке; только на него не простирай руки». И вышел Обвинитель от лица Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сатана» либо «противник». В еврейском тексте это слово стоит с определённым артиклем, что, вероятно, указывает на титул или роль.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הַשָּׂטָן
  choice: Обвинитель
  rationale: Артикль указывает здесь на обозначение роли; в контексте небесного совета слово выражает функцию обвиняющего противника.
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественный для современного литературного русского указательно-эмфатический маркер.
- source_word: כָל אֲשֶׁר לוֹ
  choice: всё, что у него есть
  rationale: Естественно передаёт совокупность всего принадлежащего Иову.
- source_word: בְּיָדֶךָ
  choice: в твоей руке
  rationale: Сохраняет образ руки как власти и намеренный повтор слова «рука» в следующем предписании.
- source_word: רַק
  choice: только
  rationale: Ясно вводит единственное ограничение данной власти.
- source_word: אֵלָיו
  choice: на него самого
  rationale: Передаёт направленность враждебного действия на самого Иова и подчёркивает противопоставление его имуществу.
- source_word: אַל תִּשְׁלַח יָדֶךָ
  choice: не простирай руки своей
  rationale: Сохраняет еврейский образ и лексический повтор «руки», оставаясь понятным в возвышенной современной прозе.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Прямо передаёт повествовательный глагол движения.
- source_word: מֵעִם פְּנֵי יְהוָה
  choice: от лица Яхве
  rationale: Сохраняет телесную образность еврейской идиомы и естественно обозначает уход из присутствия Яхве.
theological_decisions:
- issue: Передача הַשָּׂטָן в прологе книги Иова
  choice: Обвинитель
  alternative: Сатана; противник
  rationale: Наличие артикля позволяет понимать слово как титул или роль, а не обязательно как уже закрепившееся собственное имя. «Обвинитель» сохраняет судебный оттенок данного контекста, не устраняя возможной связи с образом противника.
- issue: Объём запрета в словах אֵלָיו אַל־תִּשְׁלַח יָדֶךָ
  choice: «только на него самого не простирай руки своей»
  alternative: «только не прикасайся к нему»
  rationale: Выбранная формулировка сохраняет повтор образа руки и показывает, что власть над имуществом Иова не распространяется на самого Иова.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным библейским ритмом. Синтаксис и образность оригинала сохранены там, где они остаются ясными: «в твоей руке» — «не простирай руки своей», «от лица Яхве».'
