source:
  edition: WLC
  text: אִ֛ישׁ הָיָ֥ה בְ/אֶֽרֶץ ע֖וּץ אִיּ֣וֹב שְׁמ֑/וֹ וְ/הָיָ֣ה הָ/אִ֣ישׁ הַ/ה֗וּא תָּ֧ם וְ/יָשָׁ֛ר וִ/ירֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/001.yaml
  text: There was a man in the land of Uz whose name was Job[a], and that man was blameless and upright, fearing God and turning away from evil.
translation:
  language: ru
  text: В земле Уц жил человек по имени Иов. Человек этот был непорочен и прям, боялся Бога и удалялся от зла.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сторонился зла». Еврейский глагол может означать удаляться от чего-либо, уклоняться или избегать его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָיָה
  choice: жил человек
  rationale: В русском повествовательном зачине «жил человек» естественно передаёт вводную конструкцию, не добавляя существенного смысла.
- source_word: בְאֶרֶץ עוּץ
  choice: в земле Уц
  rationale: «Земля» сохраняет обычное географическое значение אֶרֶץ; название עוּץ передано традиционной русской транслитерацией «Уц».
- source_word: אִיּוֹב שְׁמוֹ
  choice: по имени Иов
  rationale: Естественная русская передача именной конструкции; «Иов» соответствует укоренившейся русской форме имени.
- source_word: וְהָיָה הָאִישׁ הַהוּא
  choice: Человек этот был
  rationale: Инверсия «человек этот» передаёт указательное значение הַהוּא и возобновляет характеристику уже названного героя.
- source_word: תָּם
  choice: непорочен
  rationale: Слово обозначает цельность и нравственную безупречность, но само по себе не утверждает абсолютной безгрешности.
- source_word: יָשָׁר
  choice: прям
  rationale: «Прям» кратко и точно выражает нравственную правоту יָשָׁר и естественно сочетается с «непорочен».
- source_word: וִירֵא אֱלֹהִים
  choice: боялся Бога
  rationale: Традиционная и понятная формула передаёт благоговейное отношение к Богу; контекст требует единственного числа.
- source_word: וְסָר מֵרָע
  choice: удалялся от зла
  rationale: Передаёт активное отступление от зла и сохраняет пространственный образ еврейского глагола סוּר.
theological_decisions:
- issue: Смысл нравственной характеристики Иова
  choice: Иов представлен нравственно цельным и безупречным, но не назван абсолютно безгрешным.
  alternative: Понять תָּם как утверждение абсолютного нравственного совершенства или безгрешности.
  rationale: В литературе мудрости תָּם характеризует цельность и безупречность поведения; перевод «непорочен» сохраняет сильную похвалу, не устраняя богословское напряжение книги.
- issue: Референт אֱלֹהִים
  choice: Бог
  alternative: боги
  rationale: Хотя форма морфологически множественная, устойчивое выражение и контекст указывают на единственного Бога.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан естественным для русского языка; сохранены повтор «человек» и сильная, но не абсолютизированная нравственная характеристика Иова.
