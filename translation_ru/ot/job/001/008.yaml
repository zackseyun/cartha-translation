source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן הֲ/שַׂ֥מְתָּ לִבְּ/ךָ֖ עַל עַבְדִּ֣/י אִיּ֑וֹב כִּ֣י אֵ֤ין כָּמֹ֨/הוּ֙ בָּ/אָ֔רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֥ר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/008.yaml
  text: 'And Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is none like him on the earth: a blameless and upright man[b], one who fears God and turns away from evil.”'
translation:
  language: ru
  text: 'И сказал Яхве обвинителю[a]: «Обратил ли ты внимание на раба Моего Иова? Ведь нет подобного ему на земле: человек непорочный и праведный, боящийся Бога и удаляющийся от зла».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «противнику»; традиционно: «сатане». В древнееврейском тексте это слово употреблено с определённым артиклем и здесь, вероятнее всего, обозначает титул или роль, а не личное имя.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הַשָּׂטָן
  choice: обвинителю
  rationale: Артикль указывает здесь прежде всего на роль или титул; в контексте небесного совета слово имеет обвинительный и противостоящий оттенок.
- source_word: הֲשַׂמְתָּ לִבְּךָ עַל
  choice: Обратил ли ты внимание на
  rationale: Естественно передаёт смысл древнееврейской идиомы «положить/направить сердце на», то есть намеренно принять во внимание; буквальный образ отмечен в сноске.
- source_word: עַבְדִּי
  choice: раба Моего
  rationale: В данном контексте обозначает принадлежащего Богу и служащего Ему человека; традиционный порядок слов сохраняет достоинство речи.
- source_word: כִּי אֵין כָּמֹהוּ בָּאָרֶץ
  choice: Ведь нет подобного ему на земле
  rationale: Передаёт причинно-пояснительное כִּי и универсальный смысл בָּאָרֶץ без неоправданного географического сужения.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: человек непорочный и праведный
  rationale: תָּם обозначает цельность и безупречность характера, а יָשָׁר — нравственную прямоту; сочетание не утверждает абсолютной безгрешности.
- source_word: יְרֵא אֱלֹהִים
  choice: боящийся Бога
  rationale: Сохраняет библейскую формулу благоговейного страха перед Богом и её богословскую насыщенность.
- source_word: וְסָר מֵרָע
  choice: и удаляющийся от зла
  rationale: Причастная конструкция выражает устойчивое, привычное отвержение зла.
theological_decisions:
- issue: Следует ли понимать הַשָּׂטָן как личное имя или как обозначение роли
  choice: «обвинитель» как титул или роль
  alternative: «Сатана», «противник»
  rationale: Определённый артикль и повествовательный контекст поддерживают ролевое значение; перевод не привносит преждевременно более позднее употребление как личного имени.
- issue: Означает ли תָּם абсолютную безгрешность
  choice: «непорочный» в смысле нравственной цельности
  alternative: «совершенный», понятое как абсолютно безгрешный
  rationale: Контекст литературы мудрости и параллель с יָשָׁר говорят о цельности и безупречности поведения, а не о метафизическом совершенстве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис ясен для широкого читателя; формы «раба Моего» и «боящийся Бога» сохраняют достоинство и узнаваемость библейской речи. Идиома הֲשַׂמְתָּ לִבְּךָ עַל передана естественно, без неясного буквального русизма.
