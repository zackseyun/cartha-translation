  yaml_path: translation/ot/job/001/007.yaml
  text: Then Yahweh said to the Adversary[a], “Where have you come from?” And the Adversary answered Yahweh and said, “From roaming on the earth and from walking about on it.”
translation:
  language: ru
  text: 'И сказал Яхве Противнику[a]: «Откуда ты пришёл?» Противник ответил Яхве: «Я странствовал по земле и ходил по ней».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «ха-сатан» — «сатан» с определённым артиклем. Здесь это слово служит обозначением роли: «Противник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הַשָּׂטָן
  choice: Противник
  rationale: Определённый артикль указывает здесь прежде всего на обозначение роли или титул, а не на личное имя; «Противник» сохраняет широкий смысл корня שׂטן.
- source_word: מֵאַיִן תָּבֹא
  choice: Откуда ты пришёл?
  rationale: Естественный русский вопрос о месте, откуда собеседник прибыл; совершенный вид соответствует завершённому приходу.
- source_word: מִשּׁוּט בָּאָרֶץ
  choice: Я странствовал по земле
  rationale: Инфинитив שׁוט обозначает передвижение туда и сюда; «странствовал по земле» естественно передаёт это движение без излишней конкретизации.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: и ходил по ней
  rationale: Форма hitpael выражает продолжительное или повторяющееся передвижение; «ходил по ней» близко передаёт значение и сохраняет параллелизм.
theological_decisions:
- issue: Следует ли понимать הַשָּׂטָן как личное имя или как обозначение роли
  choice: 'Титул/роль: «Противник»'
  alternative: Личное имя «Сатана» или формально буквальное «сатан»
  rationale: Определённый артикль в еврейском тексте поддерживает титульное понимание. Перевод не переносит в данный контекст более позднее употребление слова как имени.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «ответил… и сказал» сокращена до естественного русского «ответил», поскольку второй глагол вводит содержание ответа и не добавляет отдельного смыслового действия.
