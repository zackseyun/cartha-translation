base_translation:
  language: en
  yaml_path: translation/ot/job/001/013.yaml
  text: There was a day when his sons and his daughters were eating and drinking wine in the house of their oldest brother[a].
translation:
  language: ru
  text: Однажды его сыновья и дочери ели и пили вино в доме своего самого старшего брата[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брата-первенца».'
    reason: Лексема הַבְּכוֹר буквально обозначает первенца; в контексте семейной очередности она также естественно понимается как «самый старший».
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Однажды
  rationale: Устойчивая древнееврейская повествовательная формула вводит новую сцену и идиоматически означает «в один из дней». «Однажды» естественно передаёт эту функцию в современном русском языке, не добавляя указания на конкретный заранее известный день.
- source_word: וּבָנָיו וּבְנֹתָיו
  choice: его сыновья и дочери
  rationale: В еврейском тексте отдельно названы сыновья и дочери; обобщение «дети» устранило бы эту явную детализацию.
- source_word: אֹכְלִים וְשֹׁתִים
  choice: ели и пили
  rationale: Причастия изображают продолжающееся действие в разворачивающейся сцене. Русский несовершенный вид передаёт эту длительность естественнее, чем громоздкая конструкция «были едящими и пьющими».
- source_word: יַיִן
  choice: вино
  rationale: Прямое лексическое соответствие; контекст не даёт оснований обобщать значение до «напитков».
- source_word: בְּבֵית
  choice: в доме
  rationale: Предлог и существительное в сопряжённой конструкции обозначают место действия; «в доме» точно и естественно по-русски.
- source_word: אֲחִיהֶם
  choice: своего ... брата
  rationale: Существительное прямо означает «брат». Возвратное местоимение «своего» естественно соотносит его с составным подлежащим «сыновья и дочери».
- source_word: הַבְּכוֹר
  choice: самого старшего
  rationale: В данном контексте слово указывает на старшинство по рождению. «Самого старшего» ясно обозначает старшего из всех братьев; более буквальный вариант «первенец» сохранён в сноске.
