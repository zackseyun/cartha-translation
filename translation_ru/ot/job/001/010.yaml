base_translation:
  language: en
  yaml_path: translation/ot/job/001/010.yaml
  text: Have you not put a hedge around him and around his house and around all that he has[a], on every side? You have blessed the work of his hands[b], and his livestock has spread throughout the land.
translation:
  language: ru
  text: Разве не Ты оградил его, его дом и всё, что у него, со всех сторон?[a] Дело рук его Ты благословил, и стада его разрослись по всей земле.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве не Ты окружил его оградой?» В еврейском тексте употреблён конкретный образ защитной ограды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «скот его весьма умножился на земле». Еврейский глагол буквально передаёт стремительное разрастание или прорыв за прежние пределы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂכְתָּ
  choice: оградил
  rationale: Глагол передаёт образ защитной ограды; «оградил» сохраняет и конкретную метафору, и смысл Божьей защиты.
- source_word: בַעֲדוֹ / וּבְעַד בֵּיתוֹ / וּבְעַד כָּל אֲשֶׁר לוֹ מִסָּבִיב
  choice: со всех сторон его, и дом его, и всё, что у него
  rationale: Формулировка сохраняет трёхчастное перечисление и подчёркнутую наречием מִסָּבִיב полноту окружающей защиты.
- source_word: מַעֲשֵׂה יָדָיו
  choice: дело рук его
  rationale: Это прозрачный и укоренённый в русском библейском стиле эквивалент еврейской идиомы, обозначающей труд и его результаты.
- source_word: בֵּרַכְתָּ
  choice: Ты благословил
  rationale: Прямой эквивалент сохраняет утверждение о Божьем благословении, не сводя его к одному лишь материальному успеху.
- source_word: מִקְנֵהוּ
  choice: стада его
  rationale: В контексте слово обозначает принадлежащий Иову домашний скот; множественное «стада» естественно по-русски и передаёт совокупность его животных.
- source_word: פָּרַץ בָּאָרֶץ
  choice: распространились по всей земле
  rationale: Глагол рисует стремительное разрастание, буквально прорыв за прежние пределы; выбранная формулировка сохраняет образ пространственного расширения и хорошо сочетается со «стадами».
- source_word: הֲלֹא
  choice: Не Ты ли
  rationale: Русская конструкция естественно передаёт риторический вопрос и обвинительный оттенок речи противника.
theological_decisions:
- issue: Благословение или нейтральное процветание
  choice: Дело рук его Ты благословил
  alternative: Труду его Ты даровал успех
  rationale: Текст прямо называет Бога источником благословения; буквальное богословски значимое слово не следует заменять описанием его результата.
- issue: Конкретный образ Божьей защиты
  choice: оградил
  alternative: защитил
  rationale: Сохранён образ ограды, которым противник объясняет верность и благополучие Иова, без сведения метафоры к абстрактному понятию защиты.
- issue: Характер роста стад
  choice: стада его распространились по всей земле
  alternative: скот его весьма умножился на земле
  rationale: Выбранный вариант сохраняет динамический образ פָּרַץ — выхода за границы и широкого распространения, не исключая подразумеваемого численного умножения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «дело рук его» сохраняет достоинство и узнаваемость идиомы; повтор союзов в первом предложении отражает настойчивое перечисление оригинала.
