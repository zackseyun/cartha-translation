  text: And a messenger came to Job and said[a], “The oxen were plowing, and the donkeys were grazing beside them,”
translation:
  language: ru
  text: 'И пришёл к Иову вестник и сказал: «Волы пахали, а ослицы паслись рядом с ними,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: И … вестник
  rationale: מַלְאָךְ может обозначать как небесного посланника, так и человека-вестника; здесь речь идёт о человеке, принёсшем Иову известие. Союз וּ передан словом «И».
- source_word: בָּא אֶל אִיּוֹב
  choice: пришёл к Иову
  rationale: 'Глагол בוא и предлог אֶל естественно передаются как движение к человеку: «пришёл к Иову».'
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Форма продолжает последовательность повествовательных действий; подлежащее ясно из контекста.
- source_word: הַבָּקָר
  choice: Волы
  rationale: בָּקָר может означать крупный рогатый скот вообще, но при пахоте речь идёт о тягловых животных; «волы» точно и естественно передаёт этот смысл.
- source_word: הָיוּ חֹרְשׁוֹת
  choice: пахали
  rationale: Сочетание описывает продолжавшееся в тот момент действие. В русском простое прошедшее время естественно передаёт фоновый процесс.
- source_word: וְהָאֲתֹנוֹת
  choice: а ослицы
  rationale: אֲתֹנוֹת прямо обозначает ослиц. Противительно-сопоставительное «а» естественно связывает два одновременных действия, не меняя смысла еврейского וְ.
- source_word: רֹעוֹת
  choice: паслись
  rationale: Глагол רעה здесь обозначает кормление животных на пастбище; возвратное «паслись» является обычным русским выражением.
- source_word: עַל יְדֵיהֶם
  choice: рядом с ними
  rationale: Идиома буквально связана с нахождением «у их стороны» и в данном контексте выражает пространственную близость.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным строем. Лексическая точность исходного «ослицы» сохранена непосредственно в тексте, поэтому отдельная сноска не требуется. Конечная запятая оставлена внутри незавершённой прямой речи, поскольку сообщение вестника продолжается в следующем стихе.
