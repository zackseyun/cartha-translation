  yaml_path: translation/ot/job/001/015.yaml
  text: And Sheba fell upon them and took them[a], and they struck down the young men with the edge of the sword[c][b]; and I alone have escaped to tell you.
translation:
  language: ru
  text: И напали савеяне, и угнали их[a], а слуг[b] поразили остриём меча[c]. Спасся я один, чтобы рассказать тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напала Сава и забрала их». В еврейском тексте стоит собственное имя «Сава», здесь, вероятно, обозначающее совершивших набег жителей Савы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «молодых людей». В данном контексте, вероятно, имеются в виду слуги Иова, присматривавшие за скотом.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «устами меча» — еврейское выражение, означающее поражение лезвием меча.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל שְׁבָא
  choice: напали савеяне
  rationale: В контексте вражеского набега נפל передаёт внезапное нападение. שְׁבָא формально является именем «Сава», но здесь обозначает людей из Савы; по-русски естественно передать это этнонимом «савеяне», сохранив альтернативу в примечании.
- source_word: וַתִּקָּחֵם
  choice: угнали их
  rationale: Местоименный суффикс относится к волам и ослицам из предыдущего стиха. В контексте набега «угнали» точнее и естественнее общего «взяли».
- source_word: הַנְּעָרִים
  choice: слуг
  rationale: נְעָרִים может означать молодых людей, слуг или работников. Здесь речь идёт о людях, присматривавших за скотом Иова; «слуг» ясно передаёт контекст, а буквальная альтернатива отмечена в сноске.
- source_word: הִכּוּ לְפִי חָרֶב
  choice: поразили остриём меча
  rationale: Сохраняется образ еврейской идиомы «устами меча» без неестественного для современного русского буквального выражения; глагол передаёт смертельное поражение в данном контексте.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Спасся я один
  rationale: Передаёт результат бегства и усиленную исключительность сочетания רַק אֲנִי לְבַדִּי.
- source_word: לְהַגִּיד לָךְ
  choice: чтобы рассказать тебе
  rationale: Естественная современная формула сообщения, точно соответствующая цели спасшегося вестника.
