base_translation:
  language: en
  yaml_path: translation/ot/job/001/016.yaml
  text: While this one was still speaking, another came and said, “Fire of God fell from heaven and burned among the sheep and the young men and consumed them, and I alone have escaped to tell you.”
translation:
  language: ru
  text: 'Пока он ещё говорил, пришёл другой и сказал: «Божий огонь[a] пал с неба, охватил овец и юношей и пожрал их. Я один спасся, чтобы рассказать тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «огонь Бога»; возможно, имеется в виду молния или иной нисшедший с неба огонь.'
    reason: Примечание сохраняет буквальный образ и одновременно отмечает природное прочтение, не объявляя его единственно возможным.
lexical_decisions:
- source_word: אֵשׁ אֱלֹהִים
  choice: Божий огонь
  rationale: Буквально передаёт еврейское сочетание, не сводя его безоговорочно ни к молнии, ни к прямому сверхъестественному действию Бога.
- source_word: וַתִּבְעַר בַּצֹּאן וּבַנְּעָרִים
  choice: охватил овец и юношей
  rationale: Передаёт действие огня естественным русским выражением; נְעָרִים буквально обозначает юношей или молодых людей, хотя по контексту они также являются слугами Иова.
- source_word: וַתֹּאכְלֵם
  choice: пожрал их
  rationale: Сохраняет яркую древнееврейскую метафору огня, который «ест» и полностью уничтожает.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Я один спасся
  rationale: 'Кратко и естественно передаёт усиленную мысль: уцелел только сам вестник.'
theological_decisions:
- issue: Выражение «огонь Божий» может обозначать огонь, посланный Богом, либо особо грозное небесное явление, вероятно молнию.
  choice: Сохранено буквальное «Божий огонь» с примечанием.
  alternative: Молния
  rationale: Контекст допускает понимание как молнии, но исходный текст прямо называет явление «огнём Божьим»; буквальная передача сохраняет повествовательную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым ритмом повествования. Слово «юноши» сохраняет буквальное значение исходного слова; по контексту речь идёт о молодых слугах Иова.
