  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/כָל זֹ֖את לֹא חָטָ֣א אִיּ֑וֹב וְ/לֹא נָתַ֥ן תִּפְלָ֖ה לֵ/אלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/022.yaml
  text: In all this[a], Job did not sin, nor did he charge God with wrongdoing.
translation:
  language: ru
  text: Во всём этом Иов не согрешил и не приписал Богу ничего предосудительного.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не приписал Богу безрассудства»; или: «не обвинил Бога в неправде».'
    reason: Лексема תִּפְלָה допускает оттенки безрассудства, неподобающего и предосудительного поступка; контекст не требует полностью устранять эту смысловую широту.
lexical_decisions:
- source_word: בְּכָל זֹאת
  choice: Во всём этом
  rationale: Устойчивое сочетание охватывает все описанные выше обстоятельства; формулировка естественна для современного русского языка и сохраняет всеобъемлющий смысл.
- source_word: לֹא חָטָא
  choice: не согрешил
  rationale: Глагол חטא прямо обозначает грех; более общее «не поступил дурно» неоправданно ослабило бы исходный смысл.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Использована традиционная и общеупотребительная русская форма библейского имени.
- source_word: וְלֹא נָתַן תִּפְלָה לֵאלֹהִים
  choice: и не приписал Богу ничего предосудительного
  rationale: נתן с תִּפְלָה и косвенным дополнением выражает приписывание Богу чего-либо неподобающего. Русская конструкция передаёт идиоматический смысл, не сводя תִּפְלָה только к интеллектуальной «глупости».
- source_word: תִּפְלָה
  choice: ничего предосудительного
  rationale: Слово обозначает нечто неподобающее, постыдное или безрассудное. Субстантивированная русская формулировка сохраняет широту значения и звучит естественно.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: Предлог ל отмечает адресата приписывания; אֱלֹהִים в данном контексте означает Бога.
theological_decisions:
- issue: Значение תִּפְלָה применительно к Богу
  choice: Иов не приписал Богу ничего предосудительного
  alternative: Иов не приписал Богу безрассудства / не обвинил Бога в неправде
  rationale: Основной текст сохраняет нравственно-религиозную широту слова и не утверждает сверх текста, какой именно из возможных оттенков — безрассудство, неподобающее поведение или неправда — является единственным. Альтернативы приведены в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный без архаизации. Частица «и» перед второй отрицательной конструкцией соответствует еврейскому וְלֹא; «ничего» добавлено как естественное русское оформление объекта, не меняющее содержания.
