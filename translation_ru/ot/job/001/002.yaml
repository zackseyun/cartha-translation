lexical_decisions:
- source_word: וַיִּוָּלְדוּ
  choice: И родились
  rationale: Форма вау-последовательного с нифалем глагола ילד передаёт событие рождения; русское «родились» естественно сохраняет пассивно-результативный смысл, а начальное «И» отражает повествовательную связь.
- source_word: לוֹ
  choice: у него
  rationale: 'В формуле рождения предлог ל с местоименным суффиксом выражает отношение родительства. По-русски естественно: «у него родились»; буквальное «ему родились» звучит архаично.'
- source_word: שִׁבְעָה בָנִים
  choice: семь сыновей
  rationale: Числительное и существительное точно указывают на семь детей мужского пола; форма «сыновей» обусловлена русским управлением после числительного.
- source_word: וְשָׁלוֹשׁ בָּנוֹת
  choice: и три дочери
  rationale: Сочетание обозначает трёх детей женского пола; «дочери» является точным и естественным соответствием, а союз сохраняет координацию двух групп.
