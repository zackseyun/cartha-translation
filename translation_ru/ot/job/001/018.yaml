  text: While this one was still speaking[a], another came and said, “Your sons and your daughters were eating and drinking wine in the house of their firstborn brother.”
translation:
  language: ru
  text: 'Пока он ещё говорил, пришёл другой и сказал: «Твои сыновья и дочери ели и пили вино в доме своего старшего брата».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד זֶה מְדַבֵּר
  choice: Пока он ещё говорил
  rationale: Передаёт продолжающееся действие и то, что следующий вестник появился прежде, чем предыдущий закончил говорить; по-русски местоимение «он» естественнее буквального «этот».
- source_word: וְזֶה בָּא
  choice: пришёл другой
  rationale: Буквально «и этот пришёл», но в череде вестников указательное местоимение вводит другого человека; выбран естественный русский эквивалент.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Стандартная повествовательная формула, вводящая прямую речь.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: Твои сыновья и дочери
  rationale: Сохраняет явно названные в еврейском тексте обе группы, не обобщая их словом «дети».
- source_word: אֹכְלִים וְשֹׁתִים יַיִן
  choice: ели и пили вино
  rationale: Близко передаёт буквальное содержание еврейских причастий. В русском контексте несовершенный вид естественно выражает действие, происходившее в тот момент.
- source_word: בְּבֵית אֲחִיהֶם הַבְּכוֹר
  choice: в доме своего старшего брата
  rationale: הַבְּכוֹר обозначает брата, первого по рождению. «Старший брат» — естественная современная русская формулировка; «первородный брат» здесь звучало бы неестественно и могло бы привнести лишние ассоциации.
