  text: וַ/יְהִ֡י כִּ֣י הִקִּיפֽוּ֩ יְמֵ֨י הַ/מִּשְׁתֶּ֜ה וַ/יִּשְׁלַ֧ח אִיּ֣וֹב וַֽ/יְקַדְּשֵׁ֗/ם וְ/הִשְׁכִּ֣ים בַּ/בֹּקֶר֮ וְ/הֶעֱלָ֣ה עֹלוֹת֮ מִסְפַּ֣ר כֻּלָּ/ם֒ כִּ֚י אָמַ֣ר אִיּ֔וֹב אוּלַי֙ חָטְא֣וּ בָנַ֔/י וּ/בֵרֲכ֥וּ אֱלֹהִ֖ים בִּ/לְבָבָ֑/ם כָּ֛כָה יַעֲשֶׂ֥ה אִיּ֖וֹב כָּל הַ/יָּמִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/001/005.yaml
  text: And when the days of the feasting had run their course, Job would send and consecrate them, and he would rise early in the morning and offer burnt offerings according to the number of them all. For Job said, “Perhaps my sons have sinned and cursed God in their hearts.” Thus Job would do all the time.
translation:
  language: ru
  text: 'Когда дни пиршества подходили к концу, Иов посылал за своими детьми и освящал их. Вставая рано утром, он приносил всесожжения по числу всех их, потому что говорил: «Может быть, мои сыновья согрешили и в сердце своём прокляли Бога».[a] Так Иов поступал постоянно.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально употреблён глагол «благословили», вероятно как почтительный эвфемизм вместо «прокляли».
    reason: Исходный текст намеренно использует בֵּרַךְ («благословлять») в контексте, где имеется в виду оскорбление или проклятие Бога; примечание сохраняет видимость этой значимой языковой особенности.
lexical_decisions:
- source_word: הִקִּיפוּ יְמֵי הַמִּשְׁתֶּה
  choice: завершался круг пиршественных дней
  rationale: Глагол הִקִּיפוּ выражает завершение установленного круга; перевод сохраняет образ повторяющегося цикла пиршеств и естественно звучит по-русски.
- source_word: וַיִּשְׁלַח אִיּוֹב וַיְקַדְּשֵׁם
  choice: Иов посылал за детьми и освящал их
  rationale: В контексте подразумевается, что Иов посылал за участниками пиршеств, чтобы совершить их обрядовое освящение. «Детьми» передан контекстуальный круг сыновей и дочерей, тогда как последующее בָנַי точно переведено как «мои сыновья».
- source_word: וְהֶעֱלָה עֹלוֹת
  choice: приносил всесожжения
  rationale: עֹלוֹת — жертвы, полностью сжигавшиеся на жертвеннике; традиционный русский термин «всесожжения» точен и понятен в библейском контексте.
- source_word: מִסְפַּר כֻּלָּם
  choice: по числу всех их
  rationale: 'Сохраняется распределительный смысл: по одному всесожжению на каждого из детей.'
- source_word: כָּכָה יַעֲשֶׂה אִיּוֹב כָּל הַיָּמִים
  choice: Так Иов поступал постоянно
  rationale: Имперфект יַעֲשֶׂה вместе с כָּל הַיָּמִים обозначает устойчивое, регулярно повторявшееся действие, а не единичный поступок.
theological_decisions:
- issue: Эвфемистическое употребление בֵּרַךְ по отношению к Богу
  choice: прокляли Бога
  alternative: благословили Бога
  rationale: Хотя обычное значение корня — «благословлять», здесь, как и в других местах книги Иова, это почтительный писцовый или речевой эвфемизм со значением «проклинать». Буквальное «благословили» противоречило бы опасению Иова о грехе; двусмысленность исходной формы отмечена в сноске.
- issue: Характер освящения детей Иовом
  choice: освящал их
  alternative: очищал их
  rationale: Перевод сохраняет широкий культовый смысл וַיְקַדְּשֵׁם и не уточняет не названный в тексте обряд или механизм очищения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повторяющиеся действия переданы формами несовершенного вида. Формулировки не уточняют ни обряд освящения, ни богословскую действенность жертв сверх сказанного в еврейском тексте.
