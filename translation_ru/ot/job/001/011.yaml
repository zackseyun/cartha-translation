lexical_decisions:
- source_word: וְאוּלָם
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущим словам Бога естественным современным русским союзом.
- source_word: שְׁלַח נָא יָדְךָ
  choice: протяни, прошу, Свою руку
  rationale: Сохраняет еврейский образ действия рукой и передаёт частицу נָא как настойчивую просьбу или вызов.
- source_word: וְגַע
  choice: и коснись
  rationale: Сохраняет основное значение глагола נגע; в данном контексте прикосновение подразумевает причинение вреда, но текст не делает это значение лексически явным.
- source_word: בְּכָל אֲשֶׁר לוֹ
  choice: всего, что у него есть
  rationale: Естественно и точно обозначает всё имущество и достояние Иова.
- source_word: אִם לֹא
  choice: и тогда он непременно
  rationale: Передаёт не простое условие, а эмфатическую, близкую к клятвенной, уверенность говорящего в результате действия.
- source_word: עַל פָּנֶיךָ
  choice: прямо в лицо
  rationale: Естественный русский эквивалент образного выражения, означающего открытое и прямое выступление против Бога.
- source_word: יְבָרֲכֶךָּ
  choice: проклянёт Тебя
  rationale: В контексте пролога Иова ברך, буквально «благословит», служит почтительным эвфемизмом со значением «проклянёт»; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Эвфемистическое употребление ברך в прологе книги Иова
  choice: В основном тексте перевести как «проклянёт Тебя»
  alternative: «благословит Тебя»
  rationale: 'Контекст обвинения требует отрицательного смысла: противник утверждает, что после утраты имущества Иов отвернётся от Бога. При этом необычная буквальная лексема сохраняется для читателя в сноске.'
translation_notes:
  register: Современный литературный русский язык; речь сохраняет достоинство и резкую вызывающую интонацию противника. Местоимения, обращённые к Богу, написаны с прописной буквы. Сочетание «прямо в лицо» передаёт открытый характер предполагаемого проклятия.
