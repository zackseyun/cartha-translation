  text: וְ/הִנֵּה֩ ר֨וּחַ גְּדוֹלָ֜ה בָּ֣אָה מֵ/עֵ֣בֶר הַ/מִּדְבָּ֗ר וַ/יִּגַּע֙ בְּ/אַרְבַּע֙ פִּנּ֣וֹת הַ/בַּ֔יִת וַ/יִּפֹּ֥ל עַל הַ/נְּעָרִ֖ים וַ/יָּמ֑וּתוּ וָ/אִמָּ֨לְטָ֧/ה רַק אֲנִ֛י לְ/בַדִּ֖/י לְ/הַגִּ֥יד לָֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/001/019.yaml
  text: And behold[a], a great wind came from across the wilderness and struck the four corners of the house, and it fell on the young men, and they died[b]; and I alone have escaped to tell you.
translation:
  language: ru
  text: И вот, сильный ветер[a] налетел из-за пустыни, ударил по четырём углам дома, и дом рухнул на молодых людей[b], так что они погибли. Спасся только я один, чтобы рассказать тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «могучий ветер» или «сильный бурный ветер».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать молодых людей, юношей, а в некоторых контекстах — слуг.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт живость и внезапность введения нового бедствия естественным для современного русского повествования выражением.
- source_word: רוּחַ גְּדוֹלָה
  choice: сильный ветер
  rationale: В данном контексте רוּחַ означает ветер; сочетание передаёт его необычайную мощь без добавления прямо не названной бури.
- source_word: בָּאָה מֵעֵבֶר הַמִּדְבָּר
  choice: налетел из-за пустыни
  rationale: «Из-за пустыни» сохраняет значение движения с другой стороны пустыни, а «налетел» естественно описывает внезапное приближение разрушительного ветра.
- source_word: וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת
  choice: ударил по четырём углам дома
  rationale: Хотя נגע буквально может означать «коснуться» или «достичь», разрушительный контекст оправдывает русское «ударил».
- source_word: וַיִּפֹּל עַל הַנְּעָרִים
  choice: и дом рухнул на молодых людей
  rationale: Подлежащее «дом» названо явно, чтобы в русском не возникло ошибочного впечатления, будто упал ветер. «Молодые люди» сохраняет основное значение הַנְּעָרִים, не подменяя его словом «слуги».
- source_word: וַיָּמֻתוּ
  choice: так что они погибли
  rationale: Передаёт смерть как непосредственный результат обрушения; «погибли» естественнее в русском описании катастрофы, не добавляя намеренного причинения смерти.
- source_word: וָאִמָּלְטָה רַק אֲנִי לְבַדִּי
  choice: Спасся только я один
  rationale: Сохраняет усиленное подчёркивание единственного уцелевшего, выраженное сочетанием רַק и לְבַדִּי.
- source_word: לְהַגִּיד לָךְ
  choice: чтобы рассказать тебе
  rationale: Простая и естественная передача формулы, повторяющейся в сообщениях вестников.
