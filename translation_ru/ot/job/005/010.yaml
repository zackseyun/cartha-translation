base_translation:
  language: en
  yaml_path: translation/ot/job/005/010.yaml
  text: who gives rain on the face of the earth and sends water on the face of the fields[b][a],
translation:
  language: ru
  text: Он даёт дождь на землю[a] и посылает воду на открытые просторы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на страну» либо «на сушу». Еврейское אֶרֶץ в зависимости от контекста может означать землю вообще, сушу или отдельную страну.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на улицы», «на поля» либо «на открытую местность». Еврейское חוּצוֹת может обозначать улицы и площади или широкие открытые пространства; здесь контекст благоприятствует последнему значению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: Он даёт
  rationale: Субстантивированное причастие породы qal продолжает описание Бога из предыдущего стиха. В русском связное личное предложение звучит естественнее буквального «дающий», не меняя смысла.
- source_word: מָטָר
  choice: дождь
  rationale: Обычное и точное соответствие слову со значением дождя, осадков.
- source_word: עַל־פְּנֵי אָרֶץ
  choice: на землю
  rationale: Оборот буквально означает «на поверхность земли/страны». Русское «на землю» естественно передаёт пространственное значение; возможное значение «страну, сушу» отмечено в сноске.
- source_word: וְשֹׁלֵחַ
  choice: и посылает
  rationale: Причастие qal параллельно הַנֹּתֵן; личная форма сохраняет синтаксический и смысловой параллелизм.
- source_word: מַיִם
  choice: воду
  rationale: Хотя еврейское слово имеет форму множественного числа, оно обычно обозначает воду как вещество; единственное число естественно по-русски.
- source_word: עַל־פְּנֵי חוּצוֹת
  choice: на открытые просторы
  rationale: חוּצוֹת может обозначать открытые места вне помещений или поселений, улицы и площади. В контексте дождя предпочтителен смысл широкого открытого пространства; «просторы» сохраняет широту образа без неоправданного сужения до возделанных полей.
theological_decisions:
- issue: Объём значения אָרֶץ
  choice: земля
  alternative: страна, суша
  rationale: Контекст говорит об общем промыслительном действии Бога, а не указывает на определённую территорию. При этом лексическая неоднозначность сохраняется в сноске.
- issue: Значение חוּצוֹת в природном контексте
  choice: открытые просторы
  alternative: улицы; поля; открытая местность
  rationale: Параллелизм с дождём на земле благоприятствует значению открытых пространств, однако более буквальное «улицы» лексически возможно и потому отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Опущено буквальное повторение «на поверхность», поскольку по-русски оно утяжеляет строку; пространственный параллелизм сохранён повтором предлога «на». Запятая в конце английского слоя относится к более широкому синтаксическому контексту и в самостоятельной подаче стиха заменена точкой.
