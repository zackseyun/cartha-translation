lexical_decisions:
- source_word: לָשׂוּם
  choice: чтобы поставить
  rationale: Инфинитив לָשׂוּם выражает цель или результат в связи с предшествующим контекстом; «чтобы поставить» сохраняет этот синтаксический оттенок.
- source_word: שְׁפָלִים
  choice: униженных
  rationale: Слово обозначает находящихся в низком, приниженном положении; перевод не сводит значение исключительно к нравственному смирению.
- source_word: לְמָרוֹם
  choice: на высоту
  rationale: Сохраняет пространственный образ возвышения и контраст с приниженным положением.
- source_word: וְקֹדְרִים
  choice: омрачённые скорбью
  rationale: Причастие от קדר сочетает образы мрака, уныния и скорби; формулировка сохраняет метафору и передаёт переживание горя.
- source_word: שָׂגְבוּ
  choice: вознеслись
  rationale: Глагол передаёт достижение возвышенного, недосягаемого или защищённого положения и поддерживает параллелизм первой строки.
- source_word: יֶשַׁע
  choice: к спасению
  rationale: «Спасение» сохраняет широкое значение избавления и безопасности, не ограничивая его позднейшим богословским смыслом.
theological_decisions:
- issue: Передача יֶשַׁע в контексте литературы мудрости
  choice: спасение
  alternative: избавление; безопасность
  rationale: «Спасение» сохраняет широту еврейского слова, которое в данном контексте может обозначать конкретное избавление и обретение безопасности, без навязывания более узкого догматического смысла.
translation_notes:
