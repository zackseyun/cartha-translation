  text: יִרְחֲק֣וּ בָנָ֣י/ו מִ/יֶּ֑שַׁע וְ/יִֽדַּכְּא֥וּ בַ֝/שַּׁ֗עַר וְ/אֵ֣ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/004.yaml
  text: His children are far from safety[a], and they are crushed in the gate[b], with no one to rescue them.
translation:
  language: ru
  text: Его дети далеки от спасения[a]; их сокрушают у городских ворот[b], и некому избавить их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «далеки от избавления» либо «далеки от безопасности».'
    reason: lexical_alternative
  - marker: b
    text: У городских ворот обычно проходил суд и принимались общественные решения.
    reason: cultural_note
lexical_decisions:
- source_word: יִרְחֲקוּ
  choice: далеки
  rationale: Глагол רחק выражает удалённость; краткая форма «далеки» естественно передаёт состояние детей по отношению к спасению.
- source_word: בָנָיו
  choice: его дети
  rationale: בנים может обозначать как сыновей, так и детей вообще; контекст не требует подчёркивать мужской пол потомков.
- source_word: מִיֶּשַׁע
  choice: от спасения
  rationale: יֶשַׁע охватывает значения спасения, избавления и безопасности. «Спасение» сохраняет широту и традиционную весомость слова, не сводя его непременно к духовно-богословскому смыслу; практический оттенок пояснён в сноске.
- source_word: וְיִדַּכְּאוּ
  choice: их сокрушают
  rationale: Форма от דכא передаёт сильное значение подавления или сокрушения. Неопределённо-личная конструкция по-русски естественно отражает пассивный смысл еврейской формы.
- source_word: בַשַּׁעַר
  choice: у городских ворот
  rationale: «Ворота» здесь обозначают место общественного суда и принятия решений. Предлог «у» и уточнение «городских» естественно передают подразумеваемую культурную реалию.
- source_word: וְאֵין מַצִּיל
  choice: и некому избавить их
  rationale: Конструкция אין с причастием буквально указывает на отсутствие избавителя; русская безличная формулировка сохраняет этот смысл и звучит естественно.
