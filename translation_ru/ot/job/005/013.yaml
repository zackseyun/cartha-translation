lexical_decisions:
- source_word: לֹכֵד
  choice: улавливает
  rationale: Причастие породы qal употреблено как личная глагольная форма. «Улавливает» сохраняет образ поимки и ловушки, не сужая его до физического захвата.
- source_word: חֲכָמִים
  choice: мудрых
  rationale: 'Субстантивированное прилагательное передаёт иронический контраст: считающие себя мудрыми сами оказываются пойманы.'
- source_word: בְּעָרְמָם
  choice: их же хитростью
  rationale: Предлог ב допускает оттенки средства и обстоятельства. Частица «же» естественно подчёркивает обращение их собственной хитрости против них; в данном параллелизме עָרְמָה имеет отрицательную окраску.
- source_word: וַעֲצַת
  choice: и замысел
  rationale: עֵצָה может означать совет, замысел или план. Здесь «замысел» естественно обозначает задуманную коварными людьми стратегию.
- source_word: נִפְתָּלִים
  choice: коварных
  rationale: Слово буквально связано с искривлённостью и обозначает людей изворотливых, лживых или коварных. «Коварных» ясно передаёт отрицательную нравственную характеристику в современном русском языке.
- source_word: נִמְהָרָה
  choice: поспешно срывается
  rationale: Форма niphal женского рода согласуется с עֲצַת и выражает стремительное, опрометчивое развитие дела. «Поспешно срывается» естественно передаёт в контексте как поспешность, так и неудачу замысла, а буквальная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Неявный субъект לֹכֵד
  choice: Местоимение «Он» отнесено к Богу согласно ближайшему контексту Иов 5:9–16.
  alternative: Безличное или неопределённо-личное «улавливают» либо «улавливающий».
  rationale: В еврейской строке субъект прямо не назван, но продолжается описание Божьих действий. Русское личное предложение требует явного подлежащего; заглавная буква обозначает контекстуальную отсылку, не добавляя имени в сам стих.
- issue: Нравственная окраска עָרְמָה и נִפְתָּלִים
  choice: Отрицательные обозначения «хитрость» и «коварные».
  alternative: Более нейтральные «проницательность» и «изворотливые».
  rationale: Параллелизм и контекст ниспровержения злых замыслов указывают здесь на отрицательный, а не нейтральный смысл.
- issue: Смысл נִמְהָרָה
  choice: Передано как поспешное крушение замысла.
  alternative: Формально более узкое «торопится», «ускоряется» или «оказывается поспешным».
  rationale: Форма сохраняет оттенок поспешности, но в контексте речь идёт о том, что замысел не достигает цели. Сноска сохраняет возможность менее интерпретирующего прочтения.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Синтаксис сохраняет краткость и параллелизм еврейской поэтической строки; «улавливает» и «замысел» поддерживают достоинство регистра без архаизации.
