base_translation:
  language: en
  yaml_path: translation/ot/job/005/015.yaml
  text: But he saves the needy from the sword of their mouth[a], and from the hand of the strong.
translation:
  language: ru
  text: Но Он спасает бедного от меча, от их уст и от руки сильного.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но Он спасает бедного от меча их уст и от руки сильного». Еврейская фраза сжата; слова «от их уст» можно понимать как отдельный оборот или как определение к слову «меч».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּשַׁע
  choice: Он спасает
  rationale: Глагол ישׁע означает спасение или избавление; подразумеваемый из контекста субъект — Бог. Настоящее время уместно для поэтического обобщения в речи Елифаза.
- source_word: מֵחֶרֶב
  choice: от меча
  rationale: Сохраняется конкретный образ меча, а предлог מִן передаёт избавление от угрозы.
- source_word: מִפִּיהֶם
  choice: их уст
  rationale: 'Буквально — «из/от их уст». Вместе с предшествующим «мечом» выражение естественно понимается как сжатая метафора губительной речи: «меч их уст».'
- source_word: וּמִיַּד
  choice: и от руки
  rationale: Сохраняется буквальный образ руки, который здесь также подразумевает власть или силу.
- source_word: חָזָק
  choice: сильного
  rationale: Прилагательное употреблено субстантивно и обозначает сильного или могущественного человека; единственное число сохраняет форму еврейского текста.
- source_word: אֶבְיוֹן
  choice: бедного
  rationale: Слово обозначает нуждающегося, малоимущего и социально уязвимого человека. «Бедного» естественно и ёмко передаёт этот смысл по-русски.
theological_decisions:
- issue: Образ «меча их уст»
  choice: 'Сохранить метафору губительной речи: «от меча их уст».'
  alternative: «От меча, от их уст» — раздельное понимание сжатой еврейской конструкции.
  rationale: Соположение «меча» и «уст» создаёт яркий поэтический образ. Его сохранение не сводит смысл только к клевете или оскорблениям и не устраняет подлинную синтаксическую неоднозначность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейской поэзии. Метафоры «меч уст» и «рука сильного» оставлены без поясняющей конкретизации; прописное «Он» обозначает подразумеваемого в контексте Бога.
