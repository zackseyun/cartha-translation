id: JOB.5.12
reference: Job 5:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מֵ֭פֵר מַחְשְׁב֣וֹת עֲרוּמִ֑ים וְֽ/לֹא תַעֲשֶׂ֥ינָה יְ֝דֵי/הֶ֗ם תּוּשִׁיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/012.yaml
  text: He frustrates the schemes of the crafty, so that their hands accomplish no success.
translation:
  language: ru
  text: Он срывает замыслы хитрых, так что их рукам не удаётся добиться успеха.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵפֵר
  choice: разрушает
  rationale: Причастная форма от פרר описывает того, кто срывает, расстраивает или обращает в ничто замыслы; «разрушает» естественно сочетается с «замыслами» и передаёт действенное противодействие.
- source_word: מַחְשְׁבוֹת
  choice: замыслы
  rationale: Слово обозначает мысли, планы или намерения; в контексте действий хитрых речь идёт о задуманных планах.
- source_word: עֲרוּמִים
  choice: хитрых
  rationale: В данном контексте עָרוּם имеет отрицательный оттенок изворотливости и коварной расчётливости, а не нейтральной благоразумности.
- source_word: יְדֵיהֶם
  choice: руки их
  rationale: Сохранён конкретный древнееврейский образ рук как средства осуществления задуманного; постпозиция местоимения поддерживает достоинство поэтического регистра.
- source_word: תּוּשִׁיָּה
  choice: успеха
  rationale: Многозначное слово может обозначать действенную мудрость, здравость, состоятельность или успешный результат. В конструкции с «руками» естественно указывает на практическое достижение задуманного.
theological_decisions:
- issue: Субъект действия
  choice: Сохранено местоимение «Он» без явного добавления имени Бога.
  alternative: «Бог разрушает…»
  rationale: Еврейский текст продолжает описание Бога из ближайшего контекста, но в самом стихе субъект выражен лишь глагольной формой; местоимение сохраняет связность и не вносит отсутствующего имени.
- issue: Значение תּוּשִׁיָּה
  choice: «не достигают успеха»
  alternative: «не совершают ничего здравого» / «не достигают осуществления»
  rationale: Выбран контекстуальный смысл результативности, не превращающий стих в утверждение о нравственной или интеллектуальной «здравости» их дел; присущая слову смысловая широта отмечена в лексическом решении.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и образа рук. Формулировка ясная и достойная, без архаизма «не соделывают» и без пояснительных добавлений.
