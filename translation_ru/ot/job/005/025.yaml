lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: И ты узнаешь
  rationale: Союз וְ сохранён, а форма Qal perfect 2 м. ед. ч. в контексте обещаемого результата передана естественным русским будущим временем.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что адресат узнает; повтор «что» во второй параллельной части делает русскую синтаксическую связь ясной.
- source_word: רַב
  choice: многочисленно
  rationale: При собирательном существительном זֶרַע прилагательное выражает многочисленность потомства; форма среднего рода согласуется с русским «потомство».
- source_word: זַרְעֶךָ
  choice: твоё потомство
  rationale: В семейном контексте זֶרַע обозначает потомство как собирательное целое. Русское «потомство» ясно и сохраняет отличие от следующего синонима.
- source_word: וְצֶאֱצָאֶיךָ
  choice: и твои потомки
  rationale: Передаёт множественное обозначение происходящих от человека и сохраняет синонимический параллелизм с «потомством».
- source_word: כְּעֵשֶׂב
  choice: как трава
  rationale: Сохраняет прямое сравнение с обильной растительностью и естественно звучит по-русски.
- source_word: הָאָרֶץ
  choice: земная
  rationale: Передаёт родительное отношение «трава земли» естественным поэтическим сочетанием; неоднозначность между «землёй» в широком смысле и «землёй/страной» отмечена в сноске.
