lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит поясняющее обобщение Елифаза и естественно связывает его с предыдущей мыслью.
- source_word: אָדָם
  choice: человек
  rationale: Единственное число имеет обобщающий смысл; «человек» сохраняет форму мудрого изречения и включает человечество в целом.
- source_word: לְעָמָל
  choice: для страдания
  rationale: עָמָל обозначает тяготу, бедствие, мучение или изнурительный труд. В контексте книги Иова «страдание» передаёт не просто работу, а тягостную участь человека.
- source_word: יוּלָּד
  choice: рождается
  rationale: В общем, вневременном утверждении пассивная форма естественно передаётся настоящим временем.
- source_word: וּבְנֵי רֶשֶׁף
  choice: искры
  rationale: Буквально выражение означает «сыны пламени/Решефа», но в данном сравнении обычно понимается как образ искр; этот вариант даёт ясное и естественное русское изречение, а буквальный образ сохранён в примечании.
- source_word: יַגְבִּיהוּ עוּף
  choice: взлетают вверх
  rationale: Сочетание глагола возвышения с עוּף («лететь») описывает движение ввысь; «взлетают вверх» естественно передаёт весь оборот.
theological_decisions:
- issue: Связь двух частей стиха
  choice: Сравнительная конструкция «как искры…»
  alternative: 'Сочинение: «и сыны пламени летят вверх»'
  rationale: Хотя формально стоит союз וְ («и»), параллельное мудрое изречение естественно выражает неизбежность человеческого страдания через столь же закономерное движение искр вверх. Примечание сохраняет буквальную форму спорного образа.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма. «Страдание» выбрано вместо более разговорной «беды», а непонятный без пояснения буквальный образ перенесён в сноску.
