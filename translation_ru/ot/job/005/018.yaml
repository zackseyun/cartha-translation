  text: Ибо Он причиняет боль, но перевязывает; Он сокрушает, но Его руки исцеляют.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском написании стоит «Его рука» (единственное число), тогда как глагол имеет форму женского рода множественного числа: «исцеляют». Поэтому возможно также буквальное по написанию: «Его рука исцеляет».'
    reason: textual_grammar
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт объяснительную связь с предыдущим высказыванием естественно для современного русского языка.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение сохраняется; дополнительное усиление «Сам» в русском здесь было бы избыточным.
- source_word: יַכְאִיב
  choice: причиняет боль
  rationale: Каузативная форма глагола כאב прямо означает причинение боли; перевод не подменяет её более конкретным образом ранения.
- source_word: וְיֶחְבָּשׁ
  choice: но и перевязывает
  rationale: חבש описывает перевязывание повреждения. Сочетание «но и» естественно выражает контраст и соотнесённость двух действий.
- source_word: יִמְחַץ
  choice: сокрушает
  rationale: מחץ обозначает сильный удар или сокрушение; «сокрушает» сохраняет суровую поэтическую образность.
- source_word: וְיָדוֹ
  choice: но Его рука
  rationale: Существительное в масоретском тексте имеет единственное число — «Его рука»; перевод сохраняет эту форму, не исправляя её по следующему глаголу.
- source_word: תִּרְפֶּינָה
  choice: исцеляет
  rationale: רפא означает «исцелять». Русское сказуемое согласовано с явно выраженным подлежащим «рука», а морфологическое рассогласование еврейского текста отмечено в сноске.
theological_decisions:
- issue: Божественное действие и в причинении боли, и в исцелении
  choice: Прямо отнести оба противоположных действия к Богу
  alternative: Смягчить первое действие формулировкой «допускает боль»
  rationale: Еврейский текст непосредственно представляет Бога субъектом как причинения боли и сокрушения, так и перевязывания и исцеления; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Заглавные местоимения, относящиеся к Богу, использованы в соответствии с распространённой русской библейской традицией; смысловая неоднозначность числа во второй строке вынесена в сноску.
