  yaml_path: translation/ot/job/005/002.yaml
  text: For vexation kills the fool[a], and jealousy puts the simple to death.
translation:
  language: ru
  text: Ведь глупца убивает досада, а легковерного губит ревность[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зависть». Еврейское слово может означать и ревность, и зависть; здесь оно называет разрушительную страсть.'
