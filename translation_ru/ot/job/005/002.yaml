lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит поясняющее утверждение Елифаза и естественно связывает его с предыдущим стихом.
- source_word: לֶאֱוִיל
  choice: глупца
  rationale: В литературе мудрости אֱוִיל обозначает не просто человека с недостатком ума, а нравственно и житейски неразумного; «глупец» сохраняет этот традиционный смысл.
- source_word: יַהֲרָג
  choice: убивает
  rationale: Имперфект выражает общеистинное, пословичное утверждение; настоящее время естественно передаёт эту функцию и сохраняет силу глагола הרג.
- source_word: כָּעַשׂ
  choice: досада
  rationale: Слово может обозначать гнев, раздражение, огорчение или мучительную досаду. Здесь речь идёт о внутренней разрушительной страсти, параллельной קִנְאָה; «досада» сохраняет широту смысла, не сводя его только к открытому гневу.
- source_word: וּפֹתֶה
  choice: а простодушного
  rationale: פֹּתֶה — неопытный, легко поддающийся влиянию человек. «Простодушный» передаёт эту уязвимость без оттенка интеллектуальной неполноценности; союз «а» естественно оформляет поэтический параллелизм.
- source_word: תָּמִית
  choice: губит
  rationale: Каузативная форма от מות означает «приводит к смерти». «Губит» естественно передаёт смертельный исход и позволяет избежать тяжеловесного «предаёт смерти».
- source_word: קִנְאָה
  choice: ревность
  rationale: В данном контексте слово обозначает разрушительную страсть и допускает значения ревности и зависти. Основной вариант «ревность» сохраняет непосредственное значение, а возможное «зависть» отмечено в сноске.
theological_decisions:
- issue: Олицетворённая причинность внутренних страстей
  choice: 'Сохранить прямое утверждение: досада «убивает», ревность «губит».'
  alternative: 'Ослабить причинность: «из-за досады погибает… из-за ревности умирает…»'
  rationale: Еврейский текст грамматически представляет сами страсти действующими причинами смерти. Прямое олицетворение сохраняет поэтическую силу и не вводит дополнительного толкования о механизме этой смерти.
translation_notes:
  register: Современный литературный русский язык с кратким пословичным ритмом. Параллелизм сохранён сочетаниями «глупца — простодушного» и «убивает — губит»; архаические и конфессионально окрашенные формулировки не использованы.
