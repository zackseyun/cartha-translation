base_translation:
  language: en
  yaml_path: translation/ot/job/005/017.yaml
  text: Behold[a], blessed is the man whom God reproves[e][d][c][b]; therefore do not despise the discipline of the Almighty.
translation:
  language: ru
  text: Вот, блажен человек, которого обличает Бог; наставлением Всемогущего не пренебрегай.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Всемогущий» — евр. Шаддай. Слово, переведённое как «наставление», может также означать «исправление», «вразумление» или «наказание».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет функцию указания и привлечения внимания, оставаясь естественным в возвышенной современной русской речи.
- source_word: אַשְׁרֵי
  choice: блажен
  rationale: Передаёт формулу блаженства и обозначает достойное зависти благополучное состояние, а не только субъективное чувство счастья.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Передаёт родовое обозначение человека, смертного, без ненужного ограничения только взрослыми мужчинами.
- source_word: יוֹכִחֶנּוּ
  choice: которого обличает
  rationale: Глагол обозначает исправляющее обличение или укор; «обличает» сохраняет серьёзность действия и его исправительную направленность.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Обычная русская передача данного наименования Бога в контексте книги Иова.
- source_word: וּמוּסַר
  choice: поэтому ... наставления
  rationale: Союз понимается как вводящий практическое следствие первой строки; «наставление» охватывает обучающую и исправляющую стороны מוסר.
- source_word: שַׁדַּי
  choice: Всемогущего
  rationale: Традиционная осмысленная русская передача божественного имени-титула Шаддай.
- source_word: אַל תִּמְאָס
  choice: не отвергай
  rationale: Передаёт отказ от чего-либо как недостойного или презренного; по-русски естественно сочетается с «наставлением».
theological_decisions:
- issue: Связь между обличением Бога и наставлением Всемогущего
  choice: «обличает ... поэтому не отвергай наставления»
  alternative: «исправляет ... и не пренебрегай наказанием»
  rationale: 'Формулировка сохраняет парадокс: болезненное божественное исправление представлено как признак блаженного состояния, но не усиливает смысл до исключительно карательного наказания.'
- issue: Передача שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: Перевод титула понятен читателю и следует устойчивой русской традиции; примечание сохраняет исходную форму имени-титула.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Вот, блажен человек» сохраняет афористическую форму изречения; «наставление» оставляет открытыми как педагогический, так и болезненно-исправительный оттенки.
