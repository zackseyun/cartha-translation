  yaml_path: translation/ot/job/005/005.yaml
  text: The hungry eat his harvest[a], and take it even from among the thorns, and the thirsty pant after their wealth.
translation:
  language: ru
  text: Его урожай съедает голодный и забирает его даже из колючих зарослей, а жаждущие жадно тянутся к их богатству.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а западня поглощает их богатство». Еврейский текст заключительной части стиха труден; основной перевод следует распространённому прочтению, при котором «жаждущие» образуют параллель с «голодным».'
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִירוֹ
  choice: его урожай
  rationale: Кָצִיר означает урожай или собранные плоды; перевод сохраняет местоименный суффикс единственного числа.
- source_word: רָעֵב
  choice: голодный
  rationale: Прилагательное употреблено субстантивно; форма единственного числа соответствует еврейскому тексту и естественна по-русски.
- source_word: וְאֶל מִצִּנִּים יִקָּחֵהוּ
  choice: и забирает даже из колючек
  rationale: Трудное сочетание передаёт мысль о том, что урожай уносят даже из колючего места или из-за терновой защиты; «даже» уместно выражает усилительный смысл.
- source_word: צִנִּים
  choice: колючки
  rationale: В земледельческом контексте наиболее прямое значение — колючие растения или тернии; «колючки» создаёт ясный и живой образ без уточнения вида растения.
- source_word: וְשָׁאַף
  choice: алчно тянутся к
  rationale: Глагол может обозначать жадное стремление, заглатывание или тяжёлое дыхание. Выбранная формулировка сохраняет образ ненасытного желания и хорошо сочетается с обозначением жаждущих.
- source_word: צַמִּים
  choice: жаждущие
  rationale: Такое понимание согласуется с масоретским текстом и образует параллель с «голодным». Возможное чтение, связанное с западнёй, вынесено в примечание.
- source_word: חֵילָם
  choice: их богатство
  rationale: חַיִל здесь естественно понимать как имущество, достаток или материальные средства. Множественный местоименный суффикс сохранён, несмотря на напряжение с единственным числом в начале стиха.
theological_decisions:
- issue: Неясность заключительной части еврейского текста
  choice: «а жаждущие алчно тянутся к их богатству»
  alternative: «а западня поглощает их богатство»
  rationale: Основной текст следует масоретской вокализации и сохраняет параллель «голодный — жаждущие», но не устраняет реально существующую текстово-лексическую неоднозначность; альтернативное понимание указано в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, образным синтаксисом. Сохранены смена числа («его» — «их») и неоднозначность последней части стиха; архаизмы и конфессионально окрашенные толкования не вводятся.
