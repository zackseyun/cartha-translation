  text: קְֽרָא נָ֭א הֲ/יֵ֣שׁ עוֹנֶ֑/ךָּ וְ/אֶל מִ֖י מִ/קְּדֹשִׁ֣ים תִּפְנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/001.yaml
  text: Call now—is there anyone who will answer you? And to which of the holy ones will you turn?[a]
translation:
  language: ru
  text: Позови же — найдётся ли тот, кто тебе ответит? И к кому из святых ты обратишься?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святых существ». Здесь, вероятно, имеются в виду небесные существа.'
    reason: Лексическая альтернатива и пояснение вероятного референта קְדֹשִׁים без его догматического уточнения.
lexical_decisions:
- source_word: קְרָא נָא
  choice: Позови же
  rationale: Императив קרא передан нейтральным «позови», а частица נָא — усилительной частицей «же», естественной для риторического вызова в русском языке. Это не усиливает глагол до «возопи». Русское совершенное будущее «ответит» делает направленность призыва ясной.
- source_word: הֲיֵשׁ עוֹנֶךָ
  choice: найдётся ли тот, кто тебе ответит?
  rationale: Риторическая конструкция с экзистенциальным יֵשׁ и субстантивированным причастием עוֹנֶךָ естественно передана как вопрос о том, найдётся ли отвечающий Иову.
- source_word: וְאֶל־מִי
  choice: И к кому
  rationale: Сохраняет направление, выраженное אֶל, и вводит второй риторический вопрос без излишней конкретизации.
- source_word: מִקְּדֹשִׁים
  choice: из святых
  rationale: Субстантивированное множественное קְדֹשִׁים передано буквально и без подстановки слова «ангелы». Вероятное указание на небесных существ пояснено в сноске.
- source_word: תִּפְנֶה
  choice: ты обратишься
  rationale: Глагол פנה буквально связан с поворотом к кому-либо, но в данном контексте естественное русское «обратишься» сохраняет идею обращения к кому-то, не уточняя прямо, идёт ли речь о просьбе о помощи или заступничестве.
theological_decisions:
- issue: Кого обозначают «святые» (מִקְּדֹשִׁים)
  choice: В основном тексте сохранено широкое обозначение «святые»; в сноске указано вероятное значение «небесные существа».
  alternative: «ангелы», «святые существа» или святые люди
  rationale: Контекст книги Иова позволяет видеть здесь небесных членов Божьего совета, однако сам стих не называет их ангелами. Буквальное обозначение сохраняет неоднозначность и не вносит позднейших представлений о почитании или призывании умерших святых.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Две риторические реплики сохранены; «же» передаёт настойчиво-вызывающий оттенок נָא. Формулировка понятна обычному читателю и не привносит конфессиональной терминологии.
