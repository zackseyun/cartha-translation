  text: בְּ/שׁ֣וֹט לָ֭שׁוֹן תֵּחָבֵ֑א וְֽ/לֹא תִירָ֥א מִ֝/שֹּׁ֗ד כִּ֣י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/021.yaml
  text: You will be hidden from the lash of the tongue[b][a], and you will not fear destruction when it comes.
translation:
  language: ru
  text: От бича языка[a] ты будешь укрыт и не будешь бояться разорения[b], когда оно придёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Бич языка» — образ оскорбительной или клеветнической речи.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «опустошения», «руины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוֹט לָשׁוֹן
  choice: от бича языка
  rationale: שׁוֹט буквально означает бич или плеть, а לָשׁוֹן — язык, здесь метонимически речь. Русское выражение сохраняет яркую еврейскую метафору словесного нападения; предлог «от» естественно передаёт защитный смысл сочетания с תֵּחָבֵא.
- source_word: תֵּחָבֵא
  choice: ты будешь укрыт
  rationale: Нифаль глагола חבא означает «быть скрытым, укрытым». «Будешь укрыт» сохраняет страдательное значение и одновременно естественно звучит по-русски в контексте защиты.
- source_word: וְלֹא תִירָא
  choice: и не убоишься
  rationale: Отрицательная форма имперфекта выражает уверенное обещание. «Не убоишься» соответствует возвышенному поэтическому регистру книги Иова, оставаясь понятным современному читателю.
- source_word: מִשֹּׁד
  choice: разорения
  rationale: שֹׁד обозначает насильственное опустошение, разорение или гибель. «Разорение» хорошо передаёт бедственный, разрушительный характер события, не сужая его до личной смерти.
- source_word: כִּי יָבֹוא
  choice: когда оно придёт
  rationale: כִּי здесь наиболее естественно понимать во временном значении. Местоимение «оно» соотнесено с «разорением» и делает русскую фразу ясной.
