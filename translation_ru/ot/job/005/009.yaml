  rationale: Причастие qal описывает Бога в связи с предыдущим стихом. Относительная конструкция естественна по-русски и сохраняет синтаксическую зависимость от контекста.
- source_word: גְדֹלוֹת
  choice: великое
  rationale: Субстантивированное прилагательное во множественном числе передано собирательным русским «великое», что сохраняет поэтическую сжатость и не добавляет слова «дела».
- source_word: וְאֵין חֵקֶר
  choice: неисследимое
