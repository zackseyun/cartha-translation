  rationale: Обозначает необычайные, вызывающие изумление деяния и естественно соответствует поэтическому параллелизму.
- source_word: עַד אֵין מִסְפָּר
  choice: без числа
  rationale: Устойчивое и ясное русское выражение неисчислимости, сохраняющее лаконичность еврейской поэзии.
