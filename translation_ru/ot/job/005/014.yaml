lexical_decisions:
- source_word: יוֹמָם
  choice: Днём
  rationale: Наречное употребление со значением «днём, в дневное время»; кратко и естественно передаёт противопоставление ночи и полудню.
- source_word: יְפַגְּשׁוּ
  choice: они встречают
  rationale: Глагол פגשׁ означает «встречать, сталкиваться с»; буквальный образ неожиданной встречи с тьмой сохранён.
- source_word: חֹשֶׁךְ
  choice: тьму
  rationale: Обычное соответствие для חֹשֶׁךְ, сохраняющее как зримый образ, так и возможный переносный смысл.
- source_word: וְכַלַּיְלָה
  choice: как ночью
  rationale: Префикс כ־ выражает сравнение; оборот естественно показывает, что в полдень они ведут себя так, словно наступила ночь.
- source_word: יְמַשְׁשׁוּ
  choice: ощупью бредут
  rationale: Глагол משׁשׁ обозначает ощупывание и поиск пути на ощупь. Русское сочетание ясно и образно передаёт движение в состоянии слепоты или растерянности.
- source_word: בַצָּהֳרָיִם
  choice: в полдень
  rationale: Точно обозначает полуденное время и сохраняет резкий контраст между самым светлым временем дня и блужданием, как ночью.
