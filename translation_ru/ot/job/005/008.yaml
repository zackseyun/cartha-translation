  text: אוּלָ֗ם אֲ֭נִי אֶדְרֹ֣שׁ אֶל אֵ֑ל וְ/אֶל אֱ֝לֹהִ֗ים אָשִׂ֥ים דִּבְרָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/008.yaml
  text: But as for me[a], I would seek God, and to God I would present my case.
translation:
  language: ru
  text: Но я обратился бы к Богу и Богу изложил бы своё дело.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלָם אֲנִי
  choice: Но я
  rationale: Сочетание противительного אוּלָם с самостоятельным местоимением אֲנִי обозначает контраст и подчёркивает позицию говорящего. В русском это естественно передаётся сочетанием «Но я»; дополнительное «что до меня» здесь было бы тяжеловесным.
- source_word: אֶדְרֹשׁ אֶל אֵל
  choice: обратился бы к Богу
  rationale: Глагол דרשׁ с направительным אֶל в данном контексте означает искать Бога, обращаться к Нему за ответом или помощью. «Обратился бы к Богу» ясно выражает советующий, условно-волевой оттенок формы и естественно звучит по-русски.
- source_word: אֵל
  choice: Богу
  rationale: Обычное обозначение Бога; контекст не требует расширенного перевода «Всемогущий» или транслитерации.
- source_word: וְאֶל אֱלֹהִים
  choice: и Богу
  rationale: Вторая строка синонимически параллельна первой. Повтор «Богу» сохраняет поэтическую структуру и не создаёт искусственного различия между двумя обозначениями одного Бога.
- source_word: אָשִׂים
  choice: изложил бы
  rationale: Буквально глагол означает «положить, поместить», но в сочетании с דִּבְרָתִי передаёт представление своего дела на рассмотрение. «Изложил бы» сохраняет образ обращения и подходит современному литературному русскому.
- source_word: דִּבְרָתִי
  choice: своё дело
  rationale: Существительное может означать слово, вопрос, дело или тяжбу. «Своё дело» сохраняет широту выражения и возможный судебно-просительный оттенок, не сужая смысл до «жалобы».
theological_decisions:
- issue: Передача параллельных божественных наименований אֵל и אֱלֹהִים
  choice: Оба переданы словом «Бог»
  alternative: «Бог» и «Всемогущий» либо «Эль» и «Бог»
  rationale: Обе части стиха относятся к одному Богу и образуют синонимический параллелизм. Разные русские наименования могли бы создать не требуемое еврейским текстом богословское различие.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Инверсия «и Богу изложил бы» сохраняет акцент на адресате и параллелизм исходного текста, оставаясь понятной обычному читателю.
