source:
  edition: WLC
  text: בְּ/שֵׁ֣שׁ צָ֭רוֹת יַצִּילֶ֑/ךָּ וּ/בְ/שֶׁ֓בַע לֹא יִגַּ֖ע בְּ/ךָ֣ רָֽע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/019.yaml
  text: In six troubles he will deliver you[a]; even in seven[b], no evil will touch you.
translation:
  language: ru
  text: В шести бедах Он избавит тебя[a], и в семи не коснётся тебя зло[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейский поэтический оборот «в шести… и в семи» выражает многократность или полноту избавления, а не обязательно предел ровно в семь бед.
    reason: cultural_note
  - marker: b
    text: 'Или: «не коснётся тебя бедствие»; также возможно: «не причинит тебе вреда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֵׁשׁ
  choice: В шести
  rationale: Предлог בְּ с числительным вводит обстоятельство и сохраняет форму древнееврейского числового изречения.
- source_word: צָרוֹת
  choice: бедах
  rationale: צָרוֹת обозначает бедствия, тяготы и стеснённые обстоятельства; «беды» естественно и достаточно широко передаёт смысл в поэтическом контексте.
- source_word: יַצִּילֶךָּ
  choice: Он избавит тебя
  rationale: Hiphil глагола נצל означает «избавлять, спасать, вырывать из опасности». «Избавит» соответствует возвышенному регистру и не сужает значение до физического спасения.
- source_word: וּבְשֶׁבַע
  choice: и в семи
  rationale: Сохранён возрастающий числовой параллелизм «в шести… и в семи» без его замены толкующим пересказом.
- source_word: לֹא יִגַּע בְּךָ
  choice: не коснётся тебя
  rationale: Глагол נגע с בְּ допускает значения «касаться, достигать, поражать»; буквальный образ естественно звучит по-русски.
- source_word: רָע
  choice: зло
  rationale: רָע может обозначать как зло, так и бедствие или вред. «Зло» сохраняет семантическую широту исходного слова, а контекст указывает на причиняемую беду.
theological_decisions:
- issue: Кто является подразумеваемым субъектом глагола «избавит»
  choice: Сохранено местоимение «Он», без подстановки имени «Бог».
  alternative: «Бог избавит тебя»
  rationale: Из ближайшего контекста ясно, что речь о Боге, однако в самом стихе подлежащее выражено только формой глагола. Местоимение сохраняет форму источника; прописная буква следует принятой русской библейской практике, не добавляя имени.
- issue: Значение формулы «шесть… семь»
  choice: Числа сохранены в основном тексте, а их идиоматическая функция объяснена в сноске.
  alternative: Понимать выражение как строгий предел ровно в семь бед либо заменить его пересказом «во всех бедах».
  rationale: Числовой параллелизм выражает нарастание и полноту, но его поэтическая форма и возможное буквальное восприятие не должны исчезать из перевода.
- issue: Смысл слова רָע
  choice: «зло» с указанием в сноске контекстуальных вариантов.
  alternative: «вред» или «бедствие»
  rationale: Контекст благоприятствует значению пагубного бедствия, однако более широкое «зло» сохраняет лексическую неоднозначность древнееврейского текста.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим звучанием. Синтаксический параллелизм оригинала сохранён; «беды» понятно широкому читателю, а «избавит» поддерживает библейский регистр без архаизации.
