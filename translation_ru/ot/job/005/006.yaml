  text: For trouble does not come from the dust[a], nor does toil sprout from the ground.
translation:
  language: ru
  text: Ведь не из праха выходит беда[a], и не из земли произрастает тягота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь не из праха выходит беззаконие, и не из земли произрастает страдание». Еврейские слова могут обозначать как нравственное зло, так и беду, тяжкий труд или мучение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью и естественно звучит в русском рассуждении.
- source_word: לֹא יֵצֵא מֵעָפָר
  choice: не из праха выходит
  rationale: Сохраняет образ возникновения и исхода из праха; поэтический порядок слов уместен в данном параллелизме.
- source_word: אָוֶן
  choice: беда
  rationale: В контексте книги Иова слово может обозначать несчастье или тяжкое бедствие, а не только нравственное зло.
- source_word: וּמֵאֲדָמָה
  choice: и не из земли
  rationale: «Земля» естественно передаёт почву, из которой появляется растительность, и поддерживает земледельческий образ.
- source_word: יִצְמַח
  choice: произрастает
  rationale: Сохраняет растительную метафору еврейского глагола и соответствует возвышенному поэтическому регистру.
- source_word: עָמָל
  choice: тягота
  rationale: Передаёт бремя, мучение и изнурительный труд, сохраняя смысловую широту слова и его параллель с «бедой».
theological_decisions:
- issue: Смысл אָוֶן и עָמָל в словах Елифаза
  choice: Стих говорит о беде и тяготе, которые не возникают сами собой из земли.
  alternative: Стих можно понимать как утверждение о беззаконии и страдании либо шире — о бедствии и мучении.
  rationale: Такой перевод сохраняет связь с темой человеческих страданий, но не превращает слова Елифаза в более определённое учение о нравственной причинности, чем позволяет сам стих.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим, достойным регистром. Параллелизм и образ произрастания из земли сохранены; неоднозначность ключевых существительных отмечена в сноске.
