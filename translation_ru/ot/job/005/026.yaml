  text: Ты сойдёшь в могилу в полной зрелости[a], как в свой срок убирают копну зерна[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в глубокой старости» либо «в полноте сил». Редкое еврейское слово כֶּלַח может указывать на зрелый возраст или на полноту жизненных сил.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный более буквальный перевод: «как в своё время поднимают копну». Еврейский образ говорит о сложенном зерне, которое убирают в надлежащую пору.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא
  choice: сойдёшь
  rationale: Qal imperfect 2-го лица мужского рода единственного числа от בוא выражает будущее действие. В сочетании с могилой русское «сойдёшь в могилу» естественно передаёт наступление смерти, хотя пространственный образ нисхождения в самом глаголе прямо не выражен.
- source_word: בְכֶלַח
  choice: в полной зрелости
  rationale: Редкое כֶּלַח допускает значения зрелого возраста, полноты жизненных сил или достигшей полноты жизни. «В полной зрелости» сохраняет эту широту и поддерживает образ созревшего урожая, не сводя смысл исключительно к глубокой старости.
- source_word: אֱלֵי קָבֶר
  choice: в могилу
  rationale: קֶבֶר обозначает могилу или место погребения; направительная конструкция אֱלֵי естественно передаётся по-русски винительным падежом с предлогом «в» в устойчивом выражении «сойти в могилу».
- source_word: כַּעֲלוֹת
  choice: как ... убирают
  rationale: כְּ вводит сравнение, а инфинитив עלה буквально связан с движением вверх или внесением. В земледельческом образе речь, вероятно, идёт о своевременном сборе или уносе сложенного зерна; «убирают» ясно передаёт подразумеваемое действие, а буквальная образность отмечена в сноске.
- source_word: גָּדִישׁ
  choice: копну зерна
  rationale: גָּדִישׁ — не отдельный сноп, а куча, копна или стог сжатого зерна. «Копна зерна» сохраняет сельскохозяйственный образ и точнее, чем «сноп», отражает собирательное значение слова.
- source_word: בְּעִתּוֹ
  choice: в свой срок
  rationale: Выражение означает «в его время», то есть в надлежащую пору. «В свой срок» естественно соединяет идею назначенного времени с образом своевременно убранного урожая.
theological_decisions:
- issue: Означает ли כֶּלַח именно глубокую старость или полноту зрелой жизни
  choice: в полной зрелости
  alternative: в глубокой старости
  rationale: Редкость слова не позволяет уверенно ограничить его хронологически преклонным возрастом. Выбранная формулировка сохраняет обещание смерти в надлежащей полноте жизни и связь с созревшим урожаем, не усиливая текст конфессиональным толкованием.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим ритмом. Формулировка сохраняет земледельческое сравнение и неопределённость редкого слова כֶּלַח; архаизмы и узкоконфессиональная терминология исключены.
