  yaml_path: translation/ot/job/005/027.yaml
  text: Look, this is what we have searched out; it is so. Hear it, and you, know it for yourself.
translation:
  language: ru
  text: Вот что мы исследовали — так оно и есть. Выслушай это и сам уясни это для себя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица привлекает внимание к выводу Елифаза; «вот» естественно и точно передаёт эту функцию.
- source_word: חֲקַרְנוּהָ
  choice: мы исследовали
  rationale: Глагол חקר обозначает тщательное исследование или разыскание; местоименное дополнение передано контекстным «что» в конструкции «вот что».
- source_word: כֶּן הִיא
  choice: так оно и есть
  rationale: Сохраняет уверенное утверждение говорящего о достоверности сделанного вывода.
- source_word: שְׁמָעֶנָּה
  choice: Выслушай это
  rationale: Императив שׁמע с местоименным суффиксом требует услышать и принять во внимание сказанное; «выслушай» естественно передаёт обращение к речи Елифаза.
- source_word: וְאַתָּה דַע לָךְ
  choice: и сам прими к сведению
  rationale: Эксплицитное אַתָּה создаёт акцент на адресате, переданный словом «сам»; идиома דע לך означает лично усвоить или принять сказанное к сведению.
theological_decisions:
- issue: Статус утверждения Елифаза
  choice: 'Сохранено как уверенное заявление персонажа: «так оно и есть»'
  alternative: Ослабить до «мы нашли, что это верно»
  rationale: Текст передаёт убеждённость Елифаза, но повествователь не подтверждает здесь истинность всех его богословских выводов; перевод не добавляет авторской оценки.
- issue: Личная ответственность Иова за восприятие слов
  choice: «и сам прими к сведению»
  alternative: «и знай это для себя»
  rationale: Выбран естественный русский эквивалент, сохраняющий эмфатическое «ты» и личное усвоение сказанного без внесения идеи независимой проверки, которой текст прямо не выражает.
translation_notes:
  register: Современный литературный русский язык; речь звучит достойно и афористично. Сохранены множественное число «мы», уверенный тон заключения и усиленное обращение к собеседнику.
