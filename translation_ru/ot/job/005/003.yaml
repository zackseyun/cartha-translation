  yaml_path: translation/ot/job/005/003.yaml
  text: I have seen a fool taking root[a], and suddenly I cursed his dwelling.
translation:
  language: ru
  text: Я видел, как глупец пускал корни, и внезапно проклял его жилище.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и внезапно объявил его жилище проклятым»; возможно также: «и внезапно признал его жилище обречённым». Еврейский глагол может обозначать как прямое проклятие, так и провозглашение грядущего суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Я
  rationale: Отдельное местоимение передаёт выраженное в еврейском тексте эмфатическое подлежащее первого лица.
- source_word: רָאִיתִי
  choice: видел
  rationale: Перфект сообщает о пережитом наблюдении говорящего; русское прошедшее время естественно передаёт это свидетельство.
- source_word: אֱוִיל
  choice: глупец
  rationale: Обычное обозначение нравственно и духовно неразумного человека в литературе мудрости, а не только человека с низким интеллектом.
- source_word: מַשְׁרִישׁ
  choice: пускал корни
  rationale: Причастие породы hифиль от שׁרשׁ описывает укоренение или приобретение устойчивого положения; образ корней сохранён.
- source_word: וָאֶקּוֹב
  choice: и … проклял
  rationale: Глагол נקב здесь наиболее прямо означает произнесение проклятия; союз ו передан нейтральным «и», без добавления противопоставления.
- source_word: נָוֵהוּ
  choice: его жилище
  rationale: נָוֶה обозначает место обитания, жилище или дом; «жилище» сохраняет широту и поэтический оттенок исходного слова.
- source_word: פִתְאֹם
  choice: внезапно
  rationale: Наречие прямо обозначает внезапность. Его связь с произнесением проклятия сохранена в соответствии с порядком еврейского текста.
theological_decisions:
- issue: Смысл реакции говорящего в וָאֶקּוֹב
  choice: Елифаз говорит, что сам проклял жилище глупца, увидев его укоренение.
  alternative: Елифаз распознал жилище как проклятое либо объявил, что оно обречено.
  rationale: Прямое лексическое значение глагола поддерживает формулировку «проклял», однако контекст допускает понимание этих слов как оценочного провозглашения суда, а не как действия с самостоятельной магической силой. Неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим звучанием. Метафора укоренения сохранена; синтаксис остаётся ясным и естественным. Маркер сноски поставлен после всего утверждения, к которому относится смысловая неоднозначность.
