base_translation:
  language: en
  yaml_path: translation/ot/job/005/022.yaml
  text: At destruction and famine you will laugh[a], and you will not fear the beasts of the earth.
translation:
  language: ru
  text: 'Ты будешь смеяться над разорением и голодом

    и не будешь бояться диких зверей.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не бойся диких зверей». Частица אַל с имперфектом обычно выражает запрет, но здесь, вероятно, служит уверением в безопасности.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁד
  choice: разорение
  rationale: Слово обозначает насильственное опустошение, разорение или гибель. «Разорение» естественно звучит в поэтическом контексте и образует параллель с голодом.
- source_word: כָּפָן
  choice: голод
  rationale: Существительное означает голод как бедствие; этот вариант краток, точен и соответствует параллелизму со שֹׁד.
- source_word: תִּשְׂחָק
  choice: ты будешь смеяться
  rationale: Глагол שׂחק означает смеяться и может подразумевать бесстрашие или торжество. Буквальный образ сохранён без добавления оттенка насмешки.
- source_word: מֵחַיַּת הָאָרֶץ
  choice: зверей земных
  rationale: חַיָּה здесь естественно понимать как диких зверей. Выражение «звери земные» сохраняет поэтический, возвышенный строй исходного сочетания.
- source_word: אַל תִּירָא
  choice: не убоишься
  rationale: Хотя אַל с имперфектом обычно выражает запрет, в последовательности обещанных благ эта форма может передавать уверение о будущем. «Не убоишься» поддерживает параллелизм с «будешь смеяться».
theological_decisions:
- issue: Смысл אַל תִּירָא в данном контексте
  choice: 'уверение-обещание: «не убоишься»'
  alternative: 'запрет или призыв: «не бойся»'
  rationale: Контекст речи Елифаза представляет череду обещаний защиты, поэтому значение уверения лучше соответствует ходу мысли и параллелизму. Подлинная грамматическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Инверсия «зверей земных» и форма «не убоишься» передают ритм и достоинство древнееврейской поэзии, оставаясь понятными современному читателю.
