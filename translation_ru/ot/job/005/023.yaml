base_translation:
  language: en
  yaml_path: translation/ot/job/005/023.yaml
  text: For you will have a covenant with the stones of the field[c][b][a], and the wild animals of the field will be at peace with you.
translation:
  language: ru
  text: Ибо с камнями поля[a] у тебя будет завет, и дикие звери поля[b] будут в мире с тобой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с полевыми камнями». Возможно, имеются в виду камни, мешающие обрабатывать землю, однако в основном тексте сохранён еврейский поэтический образ.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и зверь поля»; единственное число употреблено в собирательном значении.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «примирятся с тобой». Еврейская форма может быть передана также как «заключат мир с тобой» или «будут жить с тобой в мире»; будущее значение следует из контекста обещания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз כִּי здесь вводит основание предшествующего заверения; «ибо» сохраняет логическую связь и соответствует возвышенной поэтической речи.
- source_word: עִם אַבְנֵי הַשָּׂדֶה
  choice: с камнями поля
  rationale: Предлог עִם выражает совместность, а буквальный образ «камней поля» сохранён без сведения его только к сельскохозяйственным помехам.
- source_word: בְרִיתֶךָ
  choice: у тебя будет союз
  rationale: В еврейской именной конструкции глагол отсутствует. Будущее время восполнено по контексту обещания, а «союз» сохраняет сильное значение בְּרִית.
- source_word: וְחַיַּת הַשָּׂדֶה
  choice: и дикие звери поля
  rationale: חַיַּת — форма единственного числа с собирательным значением; русское множественное число естественно передаёт совокупность диких животных.
- source_word: הָשְׁלְמָה לָךְ
  choice: будут жить с тобой в мире
  rationale: Форма от שׁלם в породе хифиль описывает установленные мирные отношения. Контекстуальное будущее и русская идиома передают смысл, не предполагая буквального договора со зверями.
theological_decisions:
- issue: Характер обещанного согласия с природным миром
  choice: Сохранён поэтический образ союза с камнями и мира с дикими зверями.
  alternative: Истолковать камни только как помехи земледелию, а зверей — только как отсутствие нападений.
  rationale: Еврейский текст рисует более широкий и намеренно образный мир между человеком и окружающей природой; сужать его до одного практического применения не следует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис остаётся прозрачным, а параллелизм «союз — мир» и конкретные природные образы оригинала сохранены.
