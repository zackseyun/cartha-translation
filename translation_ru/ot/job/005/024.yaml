  yaml_path: translation/ot/job/005/024.yaml
  text: You will know that your tent is at peace[a], and when you inspect your dwelling, you will not miss anything.
translation:
  language: ru
  text: И узнаешь, что в шатре твоём мир; осмотришь своё жилище — и не обнаружишь в нём пропажи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не согрешишь». Еврейский глагол обычно означает «грешить», но может также значить «промахнуться»; в этом контексте, вероятно, имеется в виду, что при осмотре ничего не окажется пропавшим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: И узнаешь
  rationale: Форма перфекта с союзом в контексте обещаний имеет будущее значение; союз сохранён как часть поэтической последовательности.
- source_word: כִּי שָׁלוֹם אָהֳלֶךָ
  choice: что в шатре твоём мир
  rationale: כִּי вводит содержание знания, а שָׁלוֹם передаёт мир, благополучие и целостность. Формулировка сохраняет ёмкость образа и древнюю конкретность слова «шатёр».
- source_word: וּפָקַדְתָּ
  choice: осмотришь
  rationale: В данном контексте פקד означает посетить с целью проверки или учёта; «осмотришь» естественно связано с последующим утверждением об отсутствии пропажи.
- source_word: נָוְךָ
  choice: своё жилище
  rationale: נָוֶה может обозначать жилище, обиталище или пастбище; параллелизм с «шатром» поддерживает значение места обитания.
- source_word: וְלֹא תֶחֱטָא
  choice: и ничего не недосчитаешь
  rationale: חטא буквально связано с промахом и обычно означает «грешить», но здесь после осмотра жилища вероятно выражает отсутствие недостачи. Русское «не недосчитаешь» ясно передаёт результат проверки.
theological_decisions:
- issue: Значение וְלֹא תֶחֱטָא
  choice: 'неморальное значение: «ничего не недосчитаешь»'
  alternative: «не согрешишь»
  rationale: Непосредственный контекст говорит о мире в шатре и осмотре жилища, поэтому значение отсутствия недостачи лучше согласуется с развитием мысли. Однако обычное моральное значение глагола подлинно возможно и сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «в шатре твоём» сохраняет достоинство и ритм, оставаясь понятной; точка с запятой и тире передают две связанные ступени обещания.
