  text: וַ/תְּהִ֣י לַ/דַּ֣ל תִּקְוָ֑ה וְ֝/עֹלָ֗תָ/ה קָ֣פְצָה פִּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/005/016.yaml
  text: So there is hope for the poor[a], and injustice shuts its mouth.
translation:
  language: ru
  text: Так у бедного появляется надежда, а несправедливость закрывает свои уста.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злодеяние закрывает рот»; букв.: «её рот закрылся».'
    reason: У עַוְלָה возможны значения «несправедливость», «неправда», «злодеяние», а еврейское выражение допускает более буквальную передачу образа.
lexical_decisions:
- source_word: וַתְּהִי
  choice: появляется
  rationale: Форма вводит результат предшествующего описания. Настоящее время естественно передаёт здесь обобщающий, итоговый смысл, а «так» сохраняет связь с контекстом.
- source_word: לַדַּל
  choice: у бедного
  rationale: דַּל может обозначать бедного, слабого или социально беззащитного человека. «У бедного» ясно передаёт основное значение и естественно сочетается с «появляется надежда».
- source_word: תִּקְוָה
  choice: надежда
  rationale: Обычное и точное соответствие существительному со значением надежды или ожидания.
- source_word: וְעֹלָתָה
  choice: а несправедливость
  rationale: עַוְלָה обозначает несправедливость, неправду или злодеяние. «Несправедливость» сохраняет социальный оттенок контекста и контраст с надеждой бедного.
- source_word: קָפְצָה פִּיהָ
  choice: закрывает свои уста
  rationale: Сохранён выразительный еврейский образ персонифицированной несправедливости, которая больше не может говорить или обвинять. «Уста» поддерживает dignified literary register without obscuring the image.
