  yaml_path: translation/ot/job/005/020.yaml
  text: In famine he will redeem you from death[b][a], and in war from the power of the sword.
translation:
  language: ru
  text: Во время голода он избавит тебя от смерти[a], а на войне — от власти меча[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкупит тебя», «искупит тебя» или «вызволит тебя». Еврейский глагол означает освобождение, выкуп или спасение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из рук меча»; это образное выражение означает избавление от силы или власти меча.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָעָב
  choice: во время голода
  rationale: רָעָב здесь обозначает бедствие — голод; предлог בְּ задаёт обстоятельство времени или ситуации.
- source_word: פָּדְךָ
  choice: он вызволит тебя
  rationale: Глагол פדה выражает освобождение, выкуп или спасение. «Вызволит» естественно звучит по-русски и сохраняет образ освобождения, не вводя обязательного представления о плате.
- source_word: מִמָּוֶת
  choice: от смерти
  rationale: Предлог מִן обозначает удаление или избавление, а существительное מָוֶת прямо означает смерть.
- source_word: וּבְמִלְחָמָה
  choice: а на войне
  rationale: מִלְחָמָה может означать войну или сражение; параллелизм с голодом указывает на общее бедствие, поэтому выбрано «на войне». Союз «а» естественно передаёт смену параллельной ситуации.
- source_word: מִידֵי חָרֶב
  choice: из-под власти меча
  rationale: Буквально сочетание означает «из рук меча», но выражение «рука/руки» передаёт власть или силу. «Из-под власти меча» сохраняет олицетворение меча и ясно выражает смысл идиомы.
theological_decisions:
- issue: Смысл פדה в речи Елифаза
  choice: вызволит
  alternative: искупит; выкупит; избавит
  rationale: Речь идёт о спасении от земного бедствия. «Вызволит» сохраняет сильное значение освобождения, но не приписывает стиху более позднее или специально сотериологическое содержание.
- issue: Временное значение совершенной формы פָּדְךָ
  choice: будущее «вызволит»
  alternative: прошедшее «вызволил»; обобщённое настоящее «вызволяет»
  rationale: В контексте обещаний о Божьей защите совершенная форма выражает уверенно ожидаемое действие; русское будущее естественно передаёт эту направленность, не превращая высказывание в сообщение о прошлом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным звучанием. Строчный указатель на Бога («он») не добавляет отсутствующего в еврейском тексте конфессионального оформления. Тире восполняет опущенный во второй параллельной строке глагол.
