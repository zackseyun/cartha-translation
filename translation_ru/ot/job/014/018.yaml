  text: 'Но даже падающая гора осыпается[a],

    и скала сдвигается со своего места[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увядает», «блекнет». Еврейский глагол обычно описывает увядание или угасание; здесь он образно употреблён о горе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «удаляется со своего места».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Но даже
  rationale: Передаёт сильный противительный переход и подчёркивает, что даже кажущиеся незыблемыми гора и скала подвержены разрушению.
- source_word: הַר נוֹפֵל
  choice: падающая гора
  rationale: Сохраняет конкретный образ и значение причастия נוֹפֵל, не уточняя, идёт ли речь об обвале, падении или продолжающемся разрушении.
- source_word: יִבּוֹל
  choice: осыпается
  rationale: Обычное значение глагола связано с увяданием и угасанием; применительно к горе «осыпается» естественно передаёт постепенную утрату целости, сохраняя метафорический характер выражения.
- source_word: וְצוּר
  choice: и скала
  rationale: «Скала» естественно сочетается с образом горы и передаёт צוּר как массивную каменную породу или утёс.
- source_word: יֶעְתַּק
  choice: сдвигается
  rationale: Передаёт удаление или смещение с прежнего места без добавления явно названного деятеля.
- source_word: מִמְּקֹמוֹ
  choice: со своего места
  rationale: Прямой и естественный перевод предложного сочетания, подчёркивающий смещение того, что казалось неподвижным.
