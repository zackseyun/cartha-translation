  text: От запаха воды оно пустит почки и даст побеги, как посаженное растение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и принесёт урожай, как посаженное растение». Еврейское слово, переданное как «побеги», обычно означает «жатва, урожай», однако в данном контексте может относиться к новым побегам или ветвям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵיחַ
  choice: от запаха
  rationale: 'Буквально передаёт образ רֵיחַ («запах») с предлогом מִן: дерево оживает уже от близости воды. По-русски выражение «от запаха воды» сохраняет поэтическую гиперболу оригинала.'
- source_word: מַיִם
  choice: воды
  rationale: Хотя форма слова морфологически множественная, здесь это обычное обозначение воды как вещества; в русском естественно единственное число.
- source_word: יַפְרִחַ
  choice: пустит почки
  rationale: Форма породы hифиль от פרח может означать появление почек, ростков или цветов. «Пустит почки» соответствует образу возобновляющейся жизни срубленного дерева и не предполагает уже наступившего цветения.
- source_word: וְעָשָׂה קָצִיר
  choice: и даст побеги
  rationale: Глагол עשה имеет широкое значение «делать, производить», а необычное в данном контексте קָצִיר обычно означает «жатва, урожай», но здесь по смыслу может обозначать то, что вновь производит дерево, — побеги или ветви. В основном тексте выбран естественный для ботанического образа вариант, а буквальная лексическая возможность отмечена в сноске.
- source_word: כְּמוֹ נָטַע
  choice: как растение
  rationale: כְּמוֹ вводит сравнение, а נָטַע обозначает посаженное или насаждение. «Как растение» естественно по-русски и не добавляет отсутствующего в этой фразе слова «дерево».
