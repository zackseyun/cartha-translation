  rationale: Обычное и прямое соответствие еврейскому слову.
- source_word: יֶחֱרַב
  choice: мелеет
  rationale: В данном контексте передаёт утрату воды руслом естественнее буквального «иссыхает».
- source_word: וְיָבֵשׁ
  choice: и высыхает
  rationale: Сохраняет второй, усиливающий глагол и завершение процесса полного обезвоживания.
