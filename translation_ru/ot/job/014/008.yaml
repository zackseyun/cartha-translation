base_translation:
  language: en
  yaml_path: translation/ot/job/014/008.yaml
  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
translation:
  language: ru
  text: Хотя корень его стареет в земле[a] и пень его умирает в прахе[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если корень его стареет в земле». Еврейскую частицу можно понимать как условную, однако в развитии сравнения с деревом здесь вероятен уступительный смысл.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ствол». Еврейское слово может обозначать пень или нижнюю часть ствола дерева.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Хотя
  rationale: 'В контексте продолжающегося сравнения с деревом частица допускает условное прочтение «если», но уступительное «хотя» естественнее передаёт ход мысли: даже при кажущемся безнадёжным состоянии дерева оно может ожить.'
- source_word: יַזְקִין
  choice: стареет
  rationale: Передаёт процесс обветшания или старения прямо и естественно, без добавления отсутствующего в тексте образа увядания.
- source_word: בָּאָרֶץ
  choice: в земле
  rationale: В ботаническом контексте אָרֶץ обозначает землю или почву; «в земле» звучит естественно и сохраняет поэтический регистр.
- source_word: שָׁרְשׁוֹ
  choice: корень его
  rationale: Сохранено поэтическое единственное число с местоименным суффиксом; оно может собирательно обозначать корневую систему дерева.
- source_word: וּבֶעָפָר
  choice: и в прахе
  rationale: «Прах» сохраняет поэтическую окраску עָפָר и его характерные для библейского иврита ассоциации со смертностью.
- source_word: יָמוּת
  choice: умирает
  rationale: Прямо передаёт обычное значение глагола מות и не добавляет образа увядания.
- source_word: גִּזְעוֹ
  choice: пень его
  rationale: גֵּזַע здесь обозначает оставшуюся часть срубленного дерева; «пень» точно согласуется с контекстом и последующим образом нового роста.
