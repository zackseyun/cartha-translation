  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: ru
  text: Вода истирает камни; её потоки[a] смывают земную почву — так и Ты уничтожаешь надежду смертного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое еврейское слово, переведённое как «потоки», имеет неясное значение; возможны также варианты: «излияния», «смывы» или, вероятно, «то, что произрастает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שָׁחֲקוּ מַיִם
  choice: Вода истирает камни
  rationale: Передаёт сжатый поэтический образ постепенного разрушения камней водой; единственное число «вода» естественно для русского обобщающего высказывания.
- source_word: תִּשְׁטֹף
  choice: смывают
  rationale: Глагол обозначает смывание или унесение потоком и продолжает образ водной эрозии.
- source_word: סְפִיחֶיהָ
  choice: её потоки
  rationale: Редкое и неясное слово по контексту понято как излияния или потоки воды; неопределённость отмечена в сноске.
- source_word: עֲפַר אָרֶץ
  choice: земную почву
  rationale: Буквально «прах/пыль земли»; в контексте размывания «почва» ясно обозначает рыхлый слой земли.
- source_word: תִקְוַת אֱנוֹשׁ
  choice: надежду смертного
  rationale: אֱנוֹשׁ обозначает человека с оттенком слабости и смертности; «смертного» сохраняет этот оттенок и репрезентативное единственное число.
- source_word: הֶאֱבַדְתָּ
  choice: Ты уничтожаешь
  rationale: Каузативная форма глагола אבד означает «погубить, уничтожить»; форма второго лица сохраняет прямое обращение к Богу.
theological_decisions:
- issue: Прямое обращение к Богу в заключительной строке
  choice: так и Ты уничтожаешь надежду смертного
  alternative: и надежду смертного Ты уничтожаешь
  rationale: Глагол второго лица мужского рода указывает на обращение к Богу. «Так и» выражает подразумеваемое сопоставление с предшествующими образами, не снимая напряжённости слов Иова.
- issue: Значение אֱנוֹשׁ
  choice: смертного
  alternative: человека
  rationale: Выбор сохраняет характерный для слова оттенок человеческой хрупкости и смертности, не ограничивая смысл мужчинами.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified поэтическим строем. Заглавная буква в местоимении «Ты» указывает на обращение к Богу по русской библейской традиции. Маркер сноски поставлен непосредственно после слов, к которым относится лексическая неопределённость.
