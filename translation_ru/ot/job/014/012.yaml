source:
  edition: WLC
  text: וְ/אִ֥ישׁ שָׁכַ֗ב וְֽ/לֹא יָ֫ק֥וּם עַד בִּלְתִּ֣י שָׁ֭מַיִם לֹ֣א יָקִ֑יצוּ וְ/לֹֽא יֵ֝עֹ֗רוּ מִ/שְּׁנָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: ru
  text: Так и человек ложится и не встаёт; пока не исчезнут небеса,[a] они не пробудятся и не будут разбужены от своего сна.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока не станет небес». Это еврейское выражение обозначает практически недостижимый предел времени.'
    reason: lexical_alternative
  - marker: b
    text: 'Смерть здесь изображена как сон: умершие «не пробудятся» и «не будут разбужены».'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: Так и человек
  rationale: אִישׁ — существительное мужского рода в единственном числе, здесь представляющее человека как смертного. Связка וְ передаётся как «Так и», поскольку стих продолжает сравнение с предшествующим образом и подводит его итог.
- source_word: שָׁכַב
  choice: ложится
  rationale: Глагол שׁכב обычно означает «ложиться» и здесь служит эвфемистическим образом смерти. Перевод сохраняет метафору, не заменяя её прямым «умирает».
- source_word: וְלֹא יָקוּם
  choice: и не встаёт
  rationale: קום означает «вставать, подниматься». Настоящее время передаёт обобщённый характер поэтического высказывания и сохраняет возможный, но не навязанный оттенок темы воскресения.
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: пока не исчезнут небеса
  rationale: Буквально необычная конструкция означает «до [того, как] не станет небес». Русское «пока не исчезнут небеса» естественно передаёт практически недостижимый космический предел.
- source_word: לֹא יָקִיצוּ
  choice: они не пробудятся
  rationale: 'Глагол יקיץ означает «пробуждаться». Его множественное число отражено местоимением «они»: еврейский текст переходит от единичного собирательного образа человека к множественному числу, подразумевая умерших вообще.'
- source_word: וְלֹא יֵעֹרוּ
  choice: и не будут разбужены
  rationale: Форма от עור передаёт значение пробуждения или приведения в бодрствование. Пассивная конструкция сохраняет грамматический оттенок и усиливающий поэтический параллелизм.
- source_word: מִשְּׁנָתָם
  choice: от своего сна
  rationale: שֵׁנָה означает «сон»; притяжательная форма множественного числа согласована с предшествующими глаголами. Слово «сон» сохраняет образ смерти без богословского истолкования.
theological_decisions:
- issue: Следует ли истолковать образ смерти как отрицание воскресения или как учение об уничтожении
  choice: Сохранить образы сна, вставания и пробуждения без догматического расширения
  alternative: 'Передать прямо: «умирает и больше не оживёт» либо явно связать строку с будущим воскресением'
  rationale: Стих выражает взгляд Иова поэтическими образами и задаёт недостижимый временной предел. Перевод не превращает эту речь в систематическое утверждение ни об окончательном уничтожении, ни о воскресении.
- issue: Передача אִישׁ и последующего перехода к множественному числу
  choice: «человек» в единственном числе, затем «они»
  alternative: Сгладить переход формой «люди» во всём стихе или продолжить единственное число вопреки формам еврейских глаголов
  rationale: Так сохраняется заметный в оригинале переход от представительного единственного числа к множественному, относящему мысль ко всем умершим.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим звучанием. Сохранены эвфемистические образы смерти и резкий переход от единственного числа к множественному. Маркеры сносок размещены непосредственно при поясняемых выражениях.
