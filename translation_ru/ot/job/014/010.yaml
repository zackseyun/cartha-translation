source:
  edition: WLC
  text: וְ/גֶ֣בֶר יָ֭מוּת וַֽ/יֶּחֱלָ֑שׁ וַ/יִּגְוַ֖ע אָדָ֣ם וְ/אַיּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: ru
  text: Но мужчина умирает и лишается сил; человек испускает дух — и где он?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте в параллельных строках употреблены два слова: גבר — «мужчина» и אדם — «человек»; их сочетание подчёркивает смертность человека.'
    reason: cultural_note
lexical_decisions:
- source_word: גֶּבֶר
  choice: мужчина
  rationale: Передаёт мужской род и сохраняет отличие от более общего אָדָם во второй строке; оттенок силы не выражен явно, чтобы не перегружать перевод.
- source_word: יָמוּת
  choice: умирает
  rationale: Настоящее время естественно передаёт обобщённую, постоянно действующую истину поэтического высказывания.
- source_word: וַיֶּחֱלָשׁ
  choice: лишается сил
  rationale: Глагол חלש означает стать слабым, бессильным. Формулировка сохраняет лексический смысл и в контексте смерти звучит естественно, не добавляя идеи насильственного низложения.
- source_word: וַיִּגְוַע
  choice: испускает дух
  rationale: Устойчивое литературное выражение для смерти передаёт значение «скончаться, испустить последний вздох» и сохраняет отличие от простого «умирает» в первой строке.
- source_word: אָדָם
  choice: человек
  rationale: Передаёт общее обозначение человеческого существа и сохраняет параллельное чередование גבר и אדם.
- source_word: וְאַיּוֹ
  choice: и где он?
  rationale: Прямо сохраняет союз и риторический вопрос еврейского текста, не превращая его в утверждение о небытии.
theological_decisions:
- issue: Смысл вопроса «и где он?» после смерти
  choice: Сохранён открытый риторический вопрос
  alternative: «и нет его» / явное утверждение о посмертном небытии
  rationale: Еврейский текст задаёт вопрос и сам по себе не формулирует здесь систематического учения о состоянии человека после смерти; неоднозначность не следует устранять.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллелизм сохранён; «испускает дух» выбрано как понятное и умеренно возвышенное выражение. Маркер сноски поставлен после всего стиха, поскольку примечание относится к двум параллельным обозначениям человека.
