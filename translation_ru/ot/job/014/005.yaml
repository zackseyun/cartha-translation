  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: ru
  text: Поскольку дни его определены[a], число его месяцев — у Тебя; Ты установил ему предел[b], которого он не перейдёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если дни его определены». Еврейская частица может вводить условие, но в данном контексте, вероятно, указывает на основание просьбы Иова: «Поскольку дни его определены».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «границу»; возможно также: «установление». Еврейское слово может обозначать твёрдо установленную меру или границу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Поскольку
  rationale: Частица может вводить условие («если»), однако в контексте, вероятнее всего, указывает на основание последующей просьбы Иова. «Поскольку» естественно передаёт этот смысл, не скрывая альтернативу, отмеченную в сноске.
- source_word: חֲרוּצִים
  choice: определены
  rationale: Страдательное причастие обозначает дни как решённые, установленные или назначенные; «определены» точно и естественно передаёт эту мысль.
- source_word: יָמָיו
  choice: дни его
  rationale: Прямой перевод формы с местоименным суффиксом; в контексте речь идёт о продолжительности человеческой жизни.
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: число его месяцев
  rationale: Сохраняется именная конструкция оригинала без преобразования в глагольную перифразу.
- source_word: אִתָּךְ
  choice: у Тебя
  rationale: Естественный русский эквивалент буквального «с Тобой»; сохраняет возможные оттенки Божьего знания и распоряжения, не сводя выражение только к одному из них.
- source_word: חֻקּוֹ
  choice: предел
  rationale: Существительное может означать установленную меру, границу или предписание. «Предел» хорошо сочетается с последующим глаголом «перейдёт» и соответствует контексту срока жизни.
- source_word: עָשִׂיתָ
  choice: установил
  rationale: Хотя основной смысл глагола — «сделал», в сочетании с пределом естественно значение «установил».
- source_word: וְלֹא יַעֲבוֹר
  choice: которого он не перейдёт
  rationale: 'Глагол в единственном числе относится к человеку: он не перейдёт установленного предела. Формулировка сохраняет утверждение оригинала, не усиливая его добавлением модального «не может».'
theological_decisions:
- issue: Божественное определение продолжительности человеческой жизни
  choice: Стих говорит, что дни человека определены, число его месяцев находится у Бога и Бог установил ему непреодолимый предел.
  alternative: Выражение «число его месяцев — у Тебя» можно понимать преимущественно как указание на Божье знание срока жизни, а не на активное его определение.
  rationale: Сочетание слов «определены» и «Ты установил ему предел» выражает сильную мысль о Божьей власти над сроком жизни, тогда как «у Тебя» сохраняет оттенки и знания, и распоряжения. Перевод не развивает это утверждение в более широкую догматическую систему.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Обращение к Богу передано местоимением «Тебя» с прописной буквы. Синтаксис сохраняет параллелизм еврейского стиха, оставаясь понятным современному читателю.
