  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: ru
  text: Даже на такого Ты обращаешь Свой взгляд и меня приводишь на суд с Собой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пред Тобой»; в еврейском буквально: «с Тобой», что может подразумевать как явление на суд перед Богом, так и вступление с Ним в судебную тяжбу.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: Но и
  rationale: 'Сочетание передаёт одновременно присоединительно-усилительный и противительный оттенки частицы в жалобе Иова: несмотря на человеческую бренность, Бог обращает на человека пристальное внимание.'
- source_word: עַל זֶה
  choice: на такого
  rationale: Буквально «на это/этого»; в контексте указание относится к бренному человеку, описанному в стихах 1–2. «На такого» естественно сохраняет эту отсылку.
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: Ты открываешь глаза
  rationale: Сохранён буквальный образ направленного внимания или пристального наблюдения; настоящее время естественно звучит в поэтической жалобе.
- source_word: וְאֹתִי
  choice: и меня
  rationale: Вынесенное объектное местоимение подчёркивает самого Иова; русская конструкция сохраняет это личное выделение.
- source_word: תָבִיא
  choice: приводишь
  rationale: Порода хифиль глагола בוא имеет основное значение «приводить». Это сохраняет судебный образ, не усиливая его более толковательным «вызываешь».
- source_word: בְמִשְׁפָּט
  choice: на суд
  rationale: В данном контексте слово обозначает судебное разбирательство или суд. Русское «приводить на суд» естественно и сохраняет юридическую образность.
- source_word: עִמָּךְ
  choice: с Собой
  rationale: Предлог עם прежде всего означает «с». Формулировка намеренно сохраняет необычность и напряжение еврейского текста, не решая, идёт ли речь о суде перед Богом или о тяжбе с Ним.
theological_decisions:
- issue: Судебное отношение, выраженное עִמָּךְ в обращении Иова к Богу
  choice: с Собой
  alternative: пред Собой / против Себя
  rationale: 'Буквальное «с» сохраняет напряжение текста: Бог может мыслиться и как Судья, перед которым предстаёт Иов, и как сторона судебной тяжбы. Перевод не устраняет эту подлинную неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической жалобы. Прописные местоимения в обращении к Богу соответствуют принятой русской библейской стилистике; буквальный образ «открываешь глаза» и необычное «с Собой» сохранены ради близости к исходному тексту.
