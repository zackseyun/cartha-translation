  yaml_path: translation/ot/job/014/015.yaml
  text: You would call[a], and I would answer you[b]; you would long for the work of your hands.
translation:
  language: ru
  text: Ты призвал бы — и я ответил бы Тебе; Ты тосковал бы по созданию Твоих рук.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по делу Твоих рук». В контексте это выражение относится к человеку как к созданию Бога.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: Ты позовёшь
  rationale: Qal imperfect 2ms от קרא. В контексте желаемого будущего сценария форма передана будущим временем; по-русски его модально-гипотетический оттенок естественно раскрывается контекстом и параллельной конструкцией.
- source_word: וְאָנֹכִי אֶעֱנֶךָּ
  choice: и я отвечу Тебе
  rationale: Эмфатическое אָנֹכִי сохраняется посредством явного местоимения «я»; ענה прямо означает «отвечать», а суффикс 2ms передан местоимением «Тебе».
- source_word: לְמַעֲשֵׂה יָדֶיךָ
  choice: по творению Своих рук
  rationale: מַעֲשֶׂה здесь обозначает сделанное, произведение рук. «Творение Своих рук» естественно по-русски сохраняет образ Бога-Творца и отнесённость выражения к созданному Им человеку.
- source_word: תִכְסֹף
  choice: Ты будешь тосковать
  rationale: כסף выражает сильное стремление, тоску, жажду. «Будешь тосковать по» передаёт эмоциональную силу глагола, не ослабляя её до простого внимания или расположения.
theological_decisions:
- issue: Выражает ли стих лишь Божье внимание к человеку или Его сильное желание вновь обратиться к Своему творению
  choice: Ты будешь тосковать по творению Своих рук
  alternative: Ты пожелаешь творения Своих рук
  rationale: Глагол כסף естественнее обозначает сильную тоску или стремление, чем простое внимание. Такая передача сохраняет напряжение надежды Иова на то, что Бог вновь устремится к созданному Им человеку.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Заглавные местоимения при обращении к Богу использованы как традиционный русский знак почтительности. Тире передаёт тесную последовательность призыва и ответа.
