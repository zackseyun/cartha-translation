lexical_decisions:
- source_word: אַךְ
  choice: поистине
  rationale: Частица может выражать как усиление («поистине», «действительно»), так и ограничение («только»). В основном тексте выбран усилительный смысл, соответствующий заключительному характеру строки; ограничительное прочтение отмечено в сноске.
- source_word: בְּשָׂרוֹ
  choice: плоть его
  rationale: Конкретный образ еврейского בָּשָׂר сохранён; «тело» было бы более обобщающим и толковательным.
- source_word: עָלָיו יִכְאָב
  choice: причиняет ему боль
  rationale: Буквальное сочетание «болит на нём» неестественно для современного русского языка. Передача через «причиняет ему боль» сохраняет телесную боль и личную отнесённость местоименного оборота.
- source_word: נַפְשׁוֹ
  choice: душа его
  rationale: נֶפֶשׁ имеет значения «душа», «жизнь», «сам человек». «Душа» сохраняет поэтическое сопоставление с плотью, не превращая его в исчерпывающее антропологическое утверждение.
- source_word: עָלָיו תֶּאֱבָל
  choice: скорбит о нём самом
  rationale: 'Так естественно передана личная направленность повторного עָלָיו. Возвратное усиление «самом» отражает возможный смысл: умерший воспринимает лишь собственные страдания.'
- source_word: תֶּאֱבָל
  choice: скорбит
  rationale: Глагол אבל означает скорбеть, сетовать, оплакивать; «скорбит» кратко и сохраняет возвышенный поэтический регистр.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ рядом с «плотью»
  choice: «душа» — для сохранения поэтического противопоставления внешнего телесного страдания и внутренней скорби
  alternative: «жизнь», «сам человек», «внутреннее существо»
  rationale: Стих допускает образное сопоставление плоти и души, но сам по себе не устанавливает определённого учения о составе человека; сноска сохраняет широту еврейского слова.
- issue: Смысл повторённого עָלָיו
  choice: В первом полустишии — «ему», во втором — «о нём самом»
  alternative: Более буквальное «на нём» в обоих полустишиях либо «в нём» во втором
  rationale: Еврейская конструкция сжата и неоднозначна. Разная естественная русская передача обусловлена управлением глаголов и не должна скрывать повтор исходного оборота, поэтому он пояснён в сноске.
translation_notes:
  register: Современный литературный русский с сохранением сжатого, торжественно-поэтического строя. Неестественное буквальное «плоть на нём болит» раскрыто идиоматически, а неоднозначность еврейского оборота вынесена в сноску.
