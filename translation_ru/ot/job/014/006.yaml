lexical_decisions:
- source_word: שְׁעֵה
  choice: Отведи… взгляд
  rationale: Повелительная форма означает отвести взгляд или внимание. В контексте Иов просит Бога прекратить пристально следить за человеком; эта формулировка естественна по-русски и сохраняет образ взгляда.
- source_word: מֵעָלָיו
  choice: от него
  rationale: Сочетание предлогов с местоименным суффиксом выражает удаление направленного на человека внимания или давления; вместе с «отведи взгляд» передаётся естественно как «от него».
- source_word: וְיֶחְדָּל
  choice: чтобы он передохнул
  rationale: Глагол חדל буквально означает «перестать, прекратить». Здесь речь идёт о прекращении тяготы или Божьего пристального внимания, поэтому «передохнул» ясно передаёт контекстуальную идею краткой передышки, не подразумевая прекращения существования.
- source_word: עַד
  choice: пока не
  rationale: Вводит временной предел желаемой передышки; в данном русском синтаксисе «пока не» звучит естественнее буквального «до тех пор, пока».
- source_word: יִרְצֶה
  choice: окончит
  rationale: Глагол רצה может выражать удовольствие, удовлетворение или принятие. В сравнении с наёмным работником вероятна мысль о достижении конца отведённого рабочего дня; «окончит» передаёт эту сторону образа, а альтернативное понимание отражено в сноске.
- source_word: כְּשָׂכִיר
  choice: как наёмный работник
  rationale: שָׂכִיר — работник, нанятый за плату. «Наёмный работник» — ясное современное обозначение, сохраняющее социально-экономический образ.
- source_word: יוֹמוֹ
  choice: свой день
  rationale: Буквально «его день». Возвратное «свой» естественно по-русски при совпадении обладателя с подлежащим; контекст рабочего дня уже задан сравнением с наёмным работником.
theological_decisions:
- issue: Характер просимой передышки
  choice: Просьба истолкована как прекращение Божьего пристального внимания, позволяющее человеку передохнуть.
  alternative: 'Можно формально передать: «и пусть он перестанет», не уточняя, что именно прекращается.'
  rationale: Контекст поддерживает идею освобождения от давления, однако неоднозначность глагола חדל и связь с последующей фразой сохранены в сноске, без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Передохнул» выбрано как общеупотребительное и контекстуально точное слово для краткой передышки; образ наёмного работника и смысловая неоднозначность רצה сохранены.
