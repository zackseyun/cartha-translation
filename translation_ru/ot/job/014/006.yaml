  text: Отведи от него взгляд[a], чтобы он отдохнул, пока, подобно наёмному работнику, не завершит свой день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отведи от него взгляд и оставь его, пока он, подобно наёмному работнику, не насладится своим днём»; возможно также: «...не будет доволен своим днём». Еврейский текст допускает понимание либо как прекращение тяготы и отдых, либо как удовлетворение от завершения отведённого дня.'
