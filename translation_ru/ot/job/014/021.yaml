  verdict: revise
  source_fidelity: Первая половина в целом точно передаёт יִכְבְּדוּ как обретение/достижение почёта, а «сыновья» верно сохраняет мужской род בָנָיו. Во второй половине «оказываются унижены» грамматически дефектно и может придавать глаголу וְיִצְעֲרוּ неоправданно страдательно-каузативный смысл («их кто-то унизил»). Более нейтральное «становятся незначительными» передаёт значение умаления/потери значимости и сохраняет контраст с почётом. «Не понимает, что с ними» адекватно выражает בין с לָמוֹ, не вводя богословских выводов.
  naturalness: «Сыновья его» допустимо, но нейтральный порядок «Его сыновья» естественнее в современном литературном русском. «Оказываются унижены» требует замены; «становятся незначительными» грамматически и стилистически естественно в данном поэтическом контексте.
  terminology: «Почёт» удачно передаёт כבד. Для צער предпочтено «становятся незначительными», поскольку оно не предполагает конкретного внешнего унизителя и сохраняет семантическую связь с малостью/умалением. Сноска сохраняет допустимое статическое прочтение форм.
  issues:
