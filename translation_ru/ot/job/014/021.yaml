  text: יִכְבְּד֣וּ בָ֭נָי/ו וְ/לֹ֣א יֵדָ֑ע וְ֝/יִצְעֲר֗וּ וְֽ/לֹא יָבִ֥ין לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: ru
  text: Его сыновья достигают почёта[a], но он не знает этого; они становятся незначительными, но он не понимает, что с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его сыновья пользуются почётом, но он этого не знает; они унижены, но он не понимает, что с ними».'
    reason: 'Лексическая альтернатива: יִכְבְּדוּ может обозначать не процесс достижения, а состояние обладания почётом; сходным образом וְיִצְעֲרוּ допускает передачу состояния униженности.'
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: достигают почёта
  rationale: Форма Qal от כבד с подлежащим во множественном числе описывает обретение значимости или почёта. Выражение передаёт результативный оттенок и естественно звучит по-русски.
- source_word: בָנָיו
  choice: сыновья его
  rationale: Еврейское существительное имеет форму мужского рода множественного числа с притяжательным суффиксом 3-го лица единственного числа; конкретное значение «сыновья» сохранено.
- source_word: וְלֹא יֵדָע
  choice: а он об этом не знает
  rationale: ידע означает «знать». Местоименное выражение «об этом» естественно отсылает к почёту сыновей, а союз передан противительным «а» в соответствии со смысловым контрастом.
- source_word: וְיִצְעֲרוּ
  choice: они оказываются унижены
  rationale: Глагол צער здесь обозначает умаление, низкое положение или унижение и противопоставлен достижению почёта. Формулировка сохраняет состояние перемены к худшему, не уточняя её причину.
- source_word: וְלֹא יָבִין לָמוֹ
  choice: а он не понимает, что с ними
  rationale: בין передаёт понимание или различение, а לָמוֹ относится к сыновьям. Русское «что с ними» естественно выражает эту связь без чрезмерной буквальности.
theological_decisions:
- issue: Осведомлённость умершего о земной судьбе сыновей
  choice: Сохранено прямое утверждение, что он не знает и не понимает происходящего с ними.
  alternative: Истолковать слова как ограниченное знание либо отсутствие участия, а не полную неосведомлённость.
  rationale: Стих прямо описывает незнание и непонимание; перевод не должен добавлять систематическое учение о состоянии умерших или разрешать более широкий богословский вопрос за пределами контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи Иова. Синтаксический параллелизм двух частей сохранён; архаизмы и конфессионально окрашенные формулы не использованы.
