    rationale: После «оказываются» требуется творительный падеж («униженными»), однако и такая форма звучит тяжеловесно и сильнее предполагает действие внешнего унизителя, чем еврейский Qal וְיִצְעֲרוּ.
  revised_text: Его сыновья достигают почёта[a], но он не знает этого; они становятся незначительными, но он не понимает, что с ними.
