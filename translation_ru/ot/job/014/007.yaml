  text: 'Ведь у дерева есть надежда: если его срубят, оно снова даст побеги[a], и его поросль[b] не иссякнет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оно снова обновится». Еврейский глагол может обозначать обновление; применительно к срубленному дереву он может описывать возобновление роста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его молодой побег» или «его росток».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью и естественно звучит в русской поэтической речи.
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: и для дерева есть надежда
  rationale: 'Сохраняет экзистенциальную конструкцию и обобщённый смысл: речь идёт о дереве как таковом. Частица «и» естественно подчёркивает сопоставление с человеком в контексте.'
- source_word: אִם יִכָּרֵת
  choice: если его срубят
  rationale: Прямо передаёт условную частицу אִם и пассивное значение нифаля; безлично-личная русская конструкция здесь естественнее буквального «если оно будет срублено».
- source_word: וְעוֹד יַחֲלִיף
  choice: оно снова даст побеги
  rationale: В отношении срубленного дерева глагол обозначает возобновление роста; конкретный образ передан естественным ботаническим выражением, при этом альтернативный оттенок обновления отмечен в сноске.
- source_word: וְיֹנַקְתּוֹ
  choice: и молодая поросль его
  rationale: Существительное обозначает молодой, нежный побег или поросль. «Молодая поросль» сохраняет образ новой жизни и согласуется с формой женского рода следующего глагола.
- source_word: לֹא תֶחְדָּל
  choice: не исчезнет
  rationale: В данном образе выражает, что новая поросль не прекратится и не иссякнет. «Не исчезнет» звучит естественно и поэтично, не добавляя идеи гарантированного бессмертия.
theological_decisions:
- issue: Связь образа дерева с надеждой человека после смерти
  choice: Не переносить в сам стих вывод о воскресении человека
  alternative: Сформулировать возобновление роста дерева как прямое указание на воскресение
  rationale: В непосредственном контексте Иов противопоставляет способность дерева дать новую поросль человеческой смертности. Перевод сохраняет эту напряжённость и не разрешает её доктринальным добавлением.
