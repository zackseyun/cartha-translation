base_translation:
  language: en
  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: ru
  text: Ты навеки одолеваешь его — и он уходит[a]; изменяешь его лицо[b] и отсылаешь его прочь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и он удаляется». Еврейский глагол буквально означает «идёт, уходит»; здесь, вероятно, имеется в виду уход из жизни или из мира людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его облик». Еврейское слово «лицо» может обозначать внешний вид человека в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: одолеваешь его
  rationale: Глагол תקף здесь означает проявить силу против кого-либо, одолеть или взять верх. «Одолеваешь» естественно передаёт превосходящую силу Бога над смертным человеком.
- source_word: לָנֶצַח
  choice: навеки
  rationale: נֶצַח выражает длительность и окончательность. «Навеки» сохраняет поэтический регистр и подчёркивает необратимость поражения человека.
- source_word: וַיַּהֲלֹךְ
  choice: и он уходит
  rationale: הלך буквально значит «идти, уходить». Контекст допускает уход из жизни, однако сам глагол прямо не называет смерть, поэтому в основном тексте сохранена образная неопределённость.
- source_word: מְשַׁנֶּה
  choice: изменяешь
  rationale: Причастная форма от שנה продолжает прямое обращение к Богу и описывает совершаемое им изменение.
- source_word: פָנָיו
  choice: его лицо
  rationale: פנים буквально означает «лицо», хотя может обозначать и внешний облик. Конкретный еврейский образ сохранён в тексте.
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: и отсылаешь прочь
  rationale: Пиэль от שלח может означать «отослать, отпустить, удалить». «Отсылаешь прочь» передаёт удаление человека, не уточняя, идёт ли речь об изгнании или смерти.
theological_decisions:
- issue: Обозначает ли וַיַּהֲלֹךְ смерть прямо
  choice: «и он уходит»
  alternative: «и он умирает» / «и он отходит»
  rationale: В контексте главы подразумевается смертность человека, но הלך буквально говорит об уходе. Перевод не превращает контекстуальный намёк в прямое утверждение о смерти.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Тире передаёт резкий переход от Божьего превосходства к уходу человека. «Лицо» сохраняет конкретность оригинального образа, а «уходит» — его намеренную недосказанность.
