  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: ru
  text: 'Моё преступление запечатано в мешке,

    и Ты покрываешь моё беззаконие[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты замазываешь», «зашиваешь» или «закрепляешь поверх» моё беззаконие. Значение еврейского глагола в этом месте неясно, и точный образ остаётся предметом споров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: запечатано
  rationale: Страдательное причастие от חתם обозначает нечто закрытое и скреплённое печатью; перевод сохраняет результативное и пассивное значение.
- source_word: בִּצְרוֹר
  choice: в мешке
  rationale: צְרוֹר может означать связанный свёрток, мешок или суму. «В мешке» естественно по-русски и сохраняет конкретный образ того, что собрано и надёжно хранится.
- source_word: פִּשְׁעִי
  choice: моё преступление
  rationale: פֶּשַׁע обозначает преступление, нарушение или мятеж. «Преступление» передаёт нравственную тяжесть слова, не сужая его до открытого бунта.
- source_word: וַתִּטְפֹּל
  choice: Ты накладываешь покров
  rationale: 'Значение טפל в этом месте спорно: глагол может описывать прикрепление, замазывание, зашивание или наложение чего-либо поверх. Основной вариант сохраняет пространственный образ и не выдаёт одну из спорных конкретизаций за несомненную.'
- source_word: עַל
  choice: поверх
  rationale: В сочетании с טפל предлог указывает на наложение или прикрепление чего-либо сверху; «поверх» ясно сохраняет эту пространственную связь.
- source_word: עֲוֺנִי
  choice: моего беззакония
  rationale: עָוֹן может обозначать беззаконие, вину или последствие вины. «Беззаконие» сохраняет нравственную весомость и отличает слово от פֶּשַׁע в первой строке.
theological_decisions:
- issue: Смысл образов запечатанного мешка и наложенного покрова
  choice: Слова Иова изображают Бога сохраняющим его проступки для последующего взыскания, а не прощающим их.
  alternative: Образы можно понять как сокрытие или удаление греха, то есть как указание на прощение.
  rationale: В контексте жалобы Иова, особенно предыдущего стиха, речь идёт о тщательном учёте его греха. Перевод сохраняет образ, не вводя прямо ни прощение, ни дополнительное истолкование наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия во второй строке сохраняет акцент еврейского עַל и связь с образом наложения поверх; местоимение «Ты» написано с прописной буквы как традиционная форма обращения к Богу, без добавления конфессионального толкования.
