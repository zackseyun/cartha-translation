lexical_decisions:
- source_word: כְּצִיץ
  choice: Как цветок
  rationale: צִיץ обозначает цветок или цветение; «цветок» естественно передаёт образ хрупкости и краткости человеческой жизни.
- source_word: יָצָא
  choice: он появляется
  rationale: Буквально глагол значит «выходит»; в данном контексте «появляется» естественно выражает вступление человека в жизнь, не перегружая строку буквальной формой.
- source_word: וַיִּמָּל
  choice: и увядает
  rationale: В цветочном образе глагол можно понять как увядание, хотя возможно и значение отсечения; основное чтение передано в тексте, а альтернатива сохранена в сноске.
- source_word: וַיִּבְרַח
  choice: убегает
  rationale: ברח обычно означает «убегать, спасаться бегством»; буквальная динамика глагола сохраняет яркий образ быстротечности.
- source_word: כַּצֵּל
  choice: как тень
  rationale: Прямое и естественное соответствие образу непрочности и мимолётности.
- source_word: וְלֹא יַעֲמוֹד
  choice: и не остаётся
  rationale: עמד буквально означает «стоять», но здесь выражает продолжительность или устойчивость; «не остаётся» ясно передаёт смысл в современном русском языке.
