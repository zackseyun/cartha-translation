  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: ru
  text: Если человек умрёт, оживёт ли он снова? Все дни моей тяжкой службы я ждал бы, пока не настанет моя перемена.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё облегчение»; возможно также: «моё обновление». Еврейское слово может означать перемену, смену или обновление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָמוּת גֶּבֶר
  choice: Если человек умрёт
  rationale: Условная конструкция сохраняет риторический характер вопроса; «человек» естественно передаёт גֶּבֶר в данном размышлении о человеческой смертности.
- source_word: הֲיִחְיֶה
  choice: оживёт ли он снова?
  rationale: «Снова» прямо не выражено отдельным словом, но естественно следует из последовательности «умрёт — оживёт» и ясно передаёт вопрос о жизни после смерти.
- source_word: כָּל יְמֵי צְבָאִי
  choice: Все дни моей тяжкой службы
  rationale: צָבָא может обозначать военную или обязательную службу, а также назначенный тяжёлый срок; контекст плача Иова поддерживает образ тягостной службы без излишнего сужения до войны.
- source_word: אֲיַחֵל
  choice: я ждал бы
  rationale: Глагол יחל сочетает оттенки ожидания и надежды; условная форма по-русски сохраняет связь с предшествующим вопросом и не превращает надежду в категорическое утверждение.
- source_word: עַד בּוֹא חֲלִיפָתִי
  choice: пока не настанет моя перемена
  rationale: '«Перемена» сохраняет широкое значение חֲלִיפָה: изменение состояния, смену, облегчение или обновление, не определяя заранее точный характер ожидаемого события.'
theological_decisions:
- issue: Выражает ли стих однозначное учение о воскресении или напряжённую надежду на перемену после смерти?
  choice: Сохранён вопрос «оживёт ли он снова?» и широкое слово «перемена».
  alternative: Передать חֲלִיפָתִי как «воскресение», «обновление» или, напротив, только как «облегчение».
  rationale: Еврейский текст допускает надежду на новую жизнь, но не формулирует здесь однозначного догматического утверждения. Перевод сохраняет открытость и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи Иова. Условное «я ждал бы» передаёт гипотетический ход мысли; «тяжкая служба» сохраняет образ назначенного и трудного срока.
