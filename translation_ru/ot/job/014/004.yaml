  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: ru
  text: Кто может произвести чистое из нечистого? Никто.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто произведёт чистое из нечистого? Ни один».'
    reason: 'Лексико-синтаксический вариант: сохраняет немодальную форму еврейского глагола и более буквально передаёт לֹא אֶחָד — «не один».'
lexical_decisions:
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос; краткая форма сохраняет прямоту еврейского текста.
- source_word: יִתֵּן
  choice: произведёт
  rationale: Буквально глагол означает «даст», но здесь в сочетании с результатом и исходным материалом передаёт смысл «произведёт, получит». Русское «произведёт» естественно выражает появление чистого из нечистого, не добавляя явно отсутствующую модальность.
- source_word: טָהוֹר
  choice: чистое
  rationale: Прилагательное употреблено субстантивно. Средний род позволяет передать обобщённое «то, что чисто» и сохранить смысловую широту.
- source_word: מִטָּמֵא
  choice: из нечистого
  rationale: Предлог מִן обозначает происхождение или исходный источник, а прилагательное טָמֵא употреблено субстантивно. Формулировка сохраняет параллельный контраст «чистое — нечистое».
- source_word: לֹא אֶחָד
  choice: Никто
  rationale: Буквально «не один»; в ответе на риторический вопрос это абсолютное отрицание. «Никто» — наиболее естественный современный русский эквивалент.
theological_decisions:
- issue: Смысл чистоты и нечистоты
  choice: Сохранить обобщённое противопоставление чистого и нечистого без уточнения его природы.
  alternative: Уточнить, что речь идёт о рождении человека от нечистых родителей либо исключительно о нравственной или ритуальной нечистоте.
  rationale: Стих краток и афористичен; сами слова допускают нравственный, ритуальный и более широкий экзистенциальный смысл. Перевод не должен разрешать эту напряжённость вместо контекста.
- issue: Модальность риторического вопроса
  choice: Передать формой «Кто произведёт…?» без добавления «может».
  alternative: «Кто может произвести…?»
  rationale: Еврейский глагол формально не содержит отдельного показателя возможности, хотя невозможность ясно подразумевается риторическим вопросом и ответом. Основной текст сохраняет форму оригинала, а сноска даёт естественную модальную альтернативу.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и торжественная формулировка. Субстантивированные формы среднего рода сохраняют обобщённость и не сужают речь до человека, предмета или конкретного вида нечистоты.
