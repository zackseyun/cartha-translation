lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с контекстом естественным русским союзом, не усиливая высказывание без необходимости.
- source_word: עַתָּה
  choice: теперь
  rationale: Сохраняет временное противопоставление нынешнего положения Иова тому, на что он надеется.
- source_word: צְעָדַי
  choice: мои шаги
  rationale: Прямо и естественно передаёт конкретный образ каждого шага Иова.
- source_word: תִּסְפּוֹר
  choice: считаешь
  rationale: Основное значение Qal от ספר — «считать»; настоящее время уместно передаёт несовершенный вид в данном контексте.
- source_word: לֹא תִשְׁמוֹר עַל
  choice: не следишь за
  rationale: Естественно по-русски сохраняет значение пристального наблюдения; отрицание оставлено в основном тексте, без гармонизации с соседними стихами.
- source_word: חַטָּאתִי
  choice: моим грехом
  rationale: Сохраняет единственное число еврейского текста, которое здесь может иметь собирательный или отвлечённый смысл.
theological_decisions:
- issue: Смысл отрицательной фразы לֹא תִשְׁמוֹר עַל חַטָּאתִי
  choice: «не следишь за моим грехом» как утверждение о настоящем
  alternative: «не стал бы следить за моим грехом»; либо «не высматриваешь моего греха»
  rationale: Простая отрицательная форма имперфекта в самом стихе естественнее всего допускает настоящее значение. Контекстуальное напряжение с соседними стихами сохранено, а не устранено толкованием.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Местоимение «Ты» написано с прописной буквы как уважительное обращение к Богу; синтаксис остаётся ясным для обычного читателя. Союз «но» эксплицирует контраст между двумя частями, естественно подразумеваемый их соположением.
