lexical_decisions:
- source_word: אָדָם
  choice: Человек
  rationale: Родовое существительное в единственном числе выражает общее утверждение о человеческой участи; «человек» естественно сохраняет и обобщённость, и представительный единственный образ.
- source_word: יְלוּד אִשָּׁה
  choice: рождённый женщиной
  rationale: Передаёт пассивную конструкцию буквально и естественно, сохраняя конкретный образ человеческого рождения и смертности.
- source_word: קְצַר יָמִים
  choice: недолог днями
  rationale: Сохраняет еврейский образ краткости дней, оставаясь понятным в возвышенном литературном регистре; более гладкое «живёт недолго» утратило бы образную форму.
- source_word: וּשְׂבַע רֹגֶז
  choice: и полон тревог
  rationale: «Полон» естественно передаёт значение насыщенности, а «тревоги» охватывают как внутреннее беспокойство, так и тяготы жизни, не сводя многозначное רֹגֶז лишь к одному оттенку.
- source_word: רֹגֶז
  choice: тревог
  rationale: В контексте плача Иова слово обозначает тревожное, бедственное состояние; русский множественный вариант звучит естественно и сохраняет широту значения.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: Человек
  alternative: человечество; смертный
  rationale: Текст говорит о всеобщей человеческой участи посредством родового единственного числа. «Человек» сохраняет эту грамматическую и смысловую форму, не превращая её в отвлечённое коллективное понятие.
- issue: Широта значения רֹגֶז
  choice: тревог
  alternative: бед; смятения; беспокойства
  rationale: Контекст допускает и внешние невзгоды, и внутреннее волнение. Основной текст не должен догматически ограничивать слово одним из этих аспектов, поэтому выбран широкий естественный эквивалент, а варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Оборот «недолог днями» сохраняет образность оригинала, а «полон тревог» звучит естественно и не устраняет смысловую широту רֹגֶז.
