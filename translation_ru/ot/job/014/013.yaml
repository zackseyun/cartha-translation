source:
  edition: WLC
  text: מִ֤י יִתֵּ֨ן בִּ/שְׁא֬וֹל תַּצְפִּנֵ֗/נִי תַּ֭סְתִּירֵ/נִי עַד שׁ֣וּב אַפֶּ֑/ךָ תָּ֤שִׁ֥ית לִ֖/י חֹ֣ק וְ/תִזְכְּרֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: ru
  text: О, если бы Ты укрыл меня в шеоле[a], спрятал меня, пока не отвратится Твой гнев, назначил мне срок[b] и вспомнил обо мне!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могиле»; «в обители мёртвых». Еврейское слово — «шеол».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «установил мне предел». Еврейское существительное может обозначать нечто установленное, предписанное или ограниченное.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы Ты
  rationale: Еврейская идиома выражает страстное пожелание, а не буквальный вопрос «кто даст?». Русское «О, если бы Ты» естественно передаёт оптативную силу.
- source_word: בִּשְׁאוֹל
  choice: в шеоле
  rationale: Транслитерация сохраняет древнееврейское представление об обители мёртвых, не сужая значение до могилы и не привнося позднейшее понятие ада.
- source_word: תַּצְפִּנֵנִי
  choice: укрыл меня
  rationale: Глагол означает скрыть или убрать в потаённое место; «укрыл» естественно звучит в просьбе и сочетается с последующим параллельным глаголом.
- source_word: תַּסְתִּירֵנִי
  choice: спрятал меня
  rationale: Передаёт близкий по смыслу второй глагол, сохраняя синонимический поэтический параллелизм без полного лексического повтора.
- source_word: עַד שׁוּב אַפֶּךָ
  choice: пока не отвратится Твой гнев
  rationale: Сохраняет образ поворота или отступления гнева и при этом звучит естественно и достойно на современном русском языке.
- source_word: תָּשִׁית לִי חֹק
  choice: назначил мне срок
  rationale: חֹק обозначает нечто установленное, предписанное или ограниченное; в контексте ожидания наиболее естественно понимать его как назначенный срок, не уточняя сверх текста его точную природу.
- source_word: וְתִזְכְּרֵנִי
  choice: и вспомнил обо мне
  rationale: Прямо передаёт просьбу об обращённом к Иову Божьем памятовании, сохраняя её личный и богословски насыщенный характер.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; обитель мёртвых
  rationale: Транслитерация не отождествляет шеол ни с отдельной могилой, ни с позднейшим учением об аде и тем самым сохраняет понятийный мир еврейского текста.
- issue: Значение חֹק в просьбе Иова
  choice: назначил мне срок
  alternative: установил мне предел; определил для меня постановление
  rationale: Контекст указывает на установленный момент или период, после которого Бог вспомнит Иова, однако существительное шире простого обозначения времени. Основной текст передаёт вероятный контекстуальный смысл, а примечание сохраняет лексическую широту.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской практике. Синонимическая пара «укрыл — спрятал» сохраняет усилительный параллелизм оригинала.
