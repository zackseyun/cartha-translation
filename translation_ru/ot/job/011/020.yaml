  text: וְ/עֵינֵ֥י רְשָׁעִ֗ים תִּ֫כְלֶ֥ינָה וּ֭/מָנוֹס אָבַ֣ד מִנְ/הֶ֑ם וְ֝/תִקְוָתָ֗/ם מַֽפַּח נָֽפֶשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: ru
  text: 'Но глаза нечестивых угаснут,

    и не останется им пути к бегству,

    а надеждой их будет последний вздох[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выдыхание жизни»; еврейское выражение трудно для истолкования и, вероятно, означает угасающий, последний вздох.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים
  choice: глаза нечестивых
  rationale: Сохранён конкретный еврейский образ глаз, истощённых напрасным ожиданием; «нечестивые» — естественное для русской библейской речи обозначение нравственно злых людей.
- source_word: תִּכְלֶינָה
  choice: угаснут
  rationale: В сочетании с «глазами» глагол כלה означает истощиться, ослабеть, перестать видеть от долгого ожидания. «Угаснут» естественно передаёт этот образ, не сводя его только к утрате надежды.
- source_word: מָנוֹס
  choice: путь к бегству
  rationale: Слово может обозначать бегство, средство спасения или убежище. В данном параллелизме речь, вероятнее всего, о возможности ускользнуть; эта формулировка звучит естественно и сохраняет мотив бегства.
- source_word: אָבַד מִנְהֶם
  choice: не останется им
  rationale: Буквально возможность бегства «исчезнет от них». Русская конструкция передаёт полную утрату этой возможности без неестественного буквализма.
- source_word: תִקְוָתָם
  choice: надеждой их
  rationale: «Надежда» передаёт как ожидание, так и то последнее, на что они могут рассчитывать.
- source_word: מַפַּח נָפֶשׁ
  choice: последний вздох
  rationale: Трудное выражение связано с выдыханием жизни. «Последний вздох» кратко и ясно сохраняет образ смерти; буквальная конструкция вроде «выдыхание души» по-русски была бы неясной.
theological_decisions:
- issue: Смысл последней надежды нечестивых
  choice: Надеждой их будет последний вздох
  alternative: Их надежда — испустить дух / их надежда обратится в отчаяние
  rationale: Текст парадоксально связывает их надежду с угасанием жизни. Перевод сохраняет эту мрачную напряжённость и образ дыхания, не заменяя его богословски или психологически истолкованным «отчаянием».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм трёх строк сохранён; неестественные буквальные обороты заменены ясными русскими соответствиями без устранения образов глаз, бегства, надежды и последнего дыхания.
