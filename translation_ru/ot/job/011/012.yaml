  text: וְ/אִ֣ישׁ נָ֭בוּב יִלָּבֵ֑ב וְ/עַ֥יִר פֶּ֝֗רֶא אָדָ֥ם יִוָּלֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: ru
  text: Но пустой человек обретёт разум, когда жеребёнок дикого осла родится человеком[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «пустой человек приобретёт сердце». Здесь «сердце» означает разум и здравый смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Вероятно, это ирония: глупец станет разумным лишь тогда, когда жеребёнок дикого осла родится человеком.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ נָבוּב
  choice: пустой человек
  rationale: Сохраняет образ буквальной «пустоты» как обозначение внутренней бессодержательности и глупости, не сводя его к разговорному оскорблению.
- source_word: יִלָּבֵב
  choice: обретёт разум
  rationale: Нифаль от לבב буквально передаёт идею «получить сердце»; в данном контексте сердце означает разумение и здравый смысл.
- source_word: וְ
  choice: Но
  rationale: В контексте речи союз естественно передаёт противопоставление и вводит ироническое изречение.
- source_word: עַיִר פֶּרֶא
  choice: жеребёнок дикого осла
  rationale: Конструктивное сочетание обозначает детёныша дикого осла; «жеребёнок» является естественным русским названием.
- source_word: אָדָם
  choice: человеком
  rationale: Передаёт отличие человека от животного в абсурдном сопоставлении и соответствует предикативному употреблению существительного.
- source_word: יִוָּלֵד
  choice: родится
  rationale: Будущее совершенного вида естественно передаёт еврейский имперфект в условно-временной формулировке.
theological_decisions:
- issue: Ироническая сила трудного изречения
  choice: Пустой человек обретёт разум тогда, когда детёныш дикого осла родится человеком, то есть при невозможном условии.
  alternative: Понимать обе половины как прямое предсказание или надежду на то, что неразумный человек может стать мудрым.
  rationale: Краткий и трудный еврейский параллелизм, вероятнее всего, выражает саркастическое сравнение невозможностей. Основной текст сохраняет его форму, а примечание обозначает ироническую силу, не превращая толкование в бесспорную часть перевода.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранены мужские формы и необычный образ оригинала; идиома о «сердце» раскрыта в основном тексте как «обретёт разум».
