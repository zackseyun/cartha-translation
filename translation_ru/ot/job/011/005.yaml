  text: Но если бы Бог заговорил с тобой и открыл Свои уста![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по контексту: «против тебя» или «обращаясь к тебе». Еврейский предлог буквально означает «с».'
