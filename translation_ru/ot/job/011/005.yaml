lexical_decisions:
- source_word: וְאוּלָם
  choice: Но
  rationale: Передаёт сильный противительный переход к пожеланию Софара естественным современным русским союзом.
- source_word: מִי יִתֵּן
  choice: если бы
  rationale: Еврейский идиоматический оборот выражает горячее пожелание, а не буквальный вопрос «кто даст».
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Единственное число божественного наименования не требует расширения вроде «Бог Всемогущий».
- source_word: דַּבֵּר
  choice: заговорил
  rationale: Совершенный вид естественно передаёт желаемое начало Божьей речи после оборота «если бы».
- source_word: וְיִפְתַּח שְׂפָתָיו
  choice: и разомкнул Свои уста
  rationale: Сохраняет образное антропоморфное описание речи. «Разомкнул» передаёт раскрытие губ, а традиционное русское «уста» звучит естественнее буквального «Свои губы» в этом возвышенном контексте.
- source_word: עִמָּךְ
  choice: против тебя
  rationale: Предлог буквально означает «с тобой», однако в споре Софар желает, чтобы Бог выступил с речью, опровергающей Иова. Контекстуальный противительный оттенок отражён в тексте, а буквальная возможность сохранена в сноске.
theological_decisions:
- issue: Антропоморфный образ Бога, размыкающего уста
  choice: Образ сохранён непосредственно
  alternative: 'Передать описательно: «обратился к тебе»'
  rationale: Телесный образ служит обычным библейским обозначением речи; его не следует устранять или превращать в утверждение о телесности Бога.
- issue: Характер Божьей речи в выражении עִמָּךְ
  choice: «против тебя» с указанием альтернатив в сноске
  alternative: «с тобой» или «к тебе»
  rationale: Контекст речи Софара указывает на возражение Иову, но сам предлог допускает менее конфронтационное прочтение; сноска сохраняет эту подлинную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Восклицательный знак передаёт силу пожелания; архаическая конструкция «кто дал бы» не используется.
