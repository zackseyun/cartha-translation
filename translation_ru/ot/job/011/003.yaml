lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: твои пустые речи
  rationale: Слово может обозначать пустую, праздную, хвастливую или ложную речь. «Пустые речи» передаёт пренебрежительный тон Софара, не сужая значение до прямой лжи.
- source_word: מְתִים
  choice: людей
  rationale: Форма обозначает людей или смертных; в данном обобщённом риторическом вопросе современное русское «людей» звучит естественно.
- source_word: יַחֲרִישׁו
  choice: заставят ... молчать
  rationale: Каузативная форма глагола חרש передана конструкцией «заставят молчать».
- source_word: וַתִּלְעַג
  choice: Будешь насмехаться
  rationale: Глагол לעג означает насмехаться или глумиться. Самостоятельная вопросительная фраза естественно передаёт продолжение риторического упрёка.
- source_word: מַכְלִם
  choice: пристыдит
  rationale: Причастие каузативной породы от כלם означает того, кто заставляет испытать стыд или посрамляет; «пристыдит» сохраняет направленное на собеседника действие.
