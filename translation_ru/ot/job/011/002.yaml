  yaml_path: translation/ot/job/011/002.yaml
  text: Should a multitude of words go unanswered[a], and should a man of lips be proved right?
translation:
  language: ru
  text: Разве множество слов останется без ответа? И разве многословный человек[a] окажется прав?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек уст», то есть человек, которого отличает обилие речи, возможно чрезмерной или пустой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב דְּבָרִים
  choice: множество слов
  rationale: Сочетание רֹב с דְּבָרִים обозначает обилие речи и сохраняет оттенок чрезмерного многословия.
- source_word: לֹא יֵעָנֶה
  choice: останется без ответа
  rationale: Нифаль глагола ענה здесь имеет пассивное значение «получить ответ»; русское выражение естественно передаёт риторический вопрос.
- source_word: וְאִם
  choice: и разве
  rationale: В поэтическом параллелизме сочетание вводит второй риторический вопрос, а не обычное условие.
- source_word: אִישׁ שְׂפָתַיִם
  choice: многословный человек
  rationale: Буквальный образ «человек уст» идиоматически характеризует человека обилием речи; выбранное выражение понятно современному читателю и не добавляет оценки «лживый» или «красноречивый».
- source_word: יִצְדָּק
  choice: окажется прав
  rationale: Qal от צדק здесь выражает признание или подтверждение правоты; эта формулировка сохраняет судебно-оценочный оттенок без лишней богословской нагрузки слова «оправдан».
theological_decisions:
- issue: Значение יִצְדָּק
  choice: окажется прав
  alternative: будет оправдан
  rationale: Контекст касается того, доказывает ли многословие правоту Иова. Выбранный вариант передаёт оценочный смысл и не сводит выражение к специальному богословскому термину.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма двух риторических вопросов. Необычная древнееврейская идиома раскрыта естественным словом «многословный», а буквальный образ сохранён в сноске.
