lexical_decisions:
- source_word: כִּי אָז
  choice: Тогда
  rationale: Сочетание вводит следствие из предшествующего условия; в русском контексте «тогда» естественно передаёт и временную, и результативную связь.
- source_word: תִּשָּׂא פָנֶיךָ
  choice: ты поднимешь лицо
  rationale: Сохранён еврейский образ восстановленного достоинства и уверенности; более идиоматическое толкование вынесено в сноску.
- source_word: מִמּוּם
  choice: без порока
  rationale: מוּם буквально обозначает изъян или порок; здесь слово употреблено метафорически. Выбор сохраняет исходный образ, не сводя его только к чувству стыда.
- source_word: מֻצָק
  choice: будешь твёрд
  rationale: Страдательное причастие от יצק передаёт состояние прочности, устойчивости или утверждённости. Краткая формулировка естественна для русской поэтической речи.
- source_word: וְלֹא תִירָא
  choice: и не станешь бояться
  rationale: Прямо передаёт отрицание будущего состояния страха современным литературным русским языком.
