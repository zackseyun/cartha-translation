  text: גָּבְהֵ֣י שָׁ֭מַיִם מַה תִּפְעָ֑ל עֲמֻקָּ֥ה מִ֝/שְּׁא֗וֹל מַה תֵּדָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/008.yaml
  text: It is higher than the heavens—what can you do? Deeper than Sheol—what can you know?[a]
translation:
  language: ru
  text: Выше небес — что ты можешь сделать? Глубже шеола — что ты можешь узнать?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глубже могилы» или «глубже мира мёртвых». Еврейское слово — «шеол».'
    reason: 'Лексическая альтернатива: שְׁאוֹל обозначает мир мёртвых и не всегда равнозначен отдельной могиле.'
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: выше небес
  rationale: Сочетание буквально обозначает «высоты небес»; сравнительная формулировка естественно передаёт поэтическую мысль и образует параллель с «глубже шеола».
- source_word: מַה תִּפְעָל
  choice: что ты можешь сделать?
  rationale: В риторическом вопросе имперфект глагола פעל выражает способность или возможность; перевод сохраняет прямое «что» и обращение во втором лице единственного числа.
- source_word: עֲמֻקָּה מִשְּׁאוֹל
  choice: глубже шеола
  rationale: Прилагательное передано сравнительной степенью в соответствии с функцией предлога מִן и параллелизмом первой строки. Термин «шеол» сохраняет более широкий древнееврейский образ мира мёртвых, не сводя его только к могиле.
- source_word: מַה תֵּדָע
  choice: что ты можешь узнать?
  rationale: Глагол ידע здесь относится к доступному человеку познанию; «узнать» звучит естественно в русском риторическом вопросе и не усиливает исходный текст до «постичь».
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация сохраняет широту и неоднозначность древнееврейского понятия, не отождествляя его исключительно с местом погребения и не добавляя позднейших представлений; значение поясняется в сноске.
- issue: Неявный субъект сравнений
  choice: не восполнять существительным или местоимением
  alternative: «Она выше небес… она глубже шеола» либо явное указание на Божью мудрость
  rationale: В еврейском стихе субъект подразумевается из контекста. Эллиптическая русская форма сохраняет поэтическую связь с предыдущим стихом и не устраняет намеренную контекстуальную зависимость.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим параллелизмом. Строчная форма «шеол» выбрана как обозначение древнееврейского понятия, а не собственного имени.
