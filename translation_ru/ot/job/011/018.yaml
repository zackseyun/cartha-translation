    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: и ты будешь уверен
  rationale: Глагол בטח здесь выражает уверенность, возникающую благодаря надежде. «Будешь уверен» естественно передаёт это состояние и не смешивает его с безопасностью в конце стиха.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: потому что есть надежда
  rationale: תִּקְוָה обычно означает «надежда» или «ожидание», а כִּי в данном контексте естественно понимать как указание на причину уверенности.
- source_word: וְחָפַרְתָּ
  choice: осмотришься[a]
  rationale: Основное значение חפר связано с копанием, однако здесь глагол, вероятно, описывает осмотр или подготовку места перед тем, как лечь. «Осмотришься» естественно в контексте, а буквальная возможность сохранена в сноске.
- source_word: לָבֶטַח
  choice: спокойно
  rationale: Наречное выражение обозначает безопасное, безмятежное состояние. В сочетании с «ляжешь» русское «спокойно» передаёт возможность лечь без страха.
- source_word: תִּשְׁכָּב
  choice: ляжешь
  rationale: Сохранён конкретный образ глагола שׁכב — «лечь», без более толковательного «отдохнёшь».
