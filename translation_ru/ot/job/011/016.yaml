- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание или следствие обещания в предыдущем контексте; «потому что» естественно передаёт пояснительную связь.
- source_word: אַתָּה
  choice: ты
  rationale: Отдельное местоимение второго лица мужского рода сохраняет выраженное в еврейском тексте смысловое ударение.
- source_word: עָמָל
  choice: страдание
  rationale: Слово обозначает тяготу, бедствие или мучительное переживание; в контексте страданий Иова «страдание» передаёт смысл, не сужая его до тяжёлого труда.
- source_word: תִּשְׁכָּח
  choice: забудешь
  rationale: Имперфект Qal второго лица единственного числа имеет здесь будущее значение.
- source_word: כְמַיִם
  choice: как о воде
  rationale: Предлог כְּ вводит сравнение. В русском собирательное единственное число «вода» звучит естественнее еврейского множественного מַיִם и сохраняет образ.
- source_word: עָבְרוּ
  choice: что утекла
  rationale: Глагол עבר описывает уже миновавшую воду; «утекла» естественно выражает завершённость и движение воды, которая осталась позади.
- source_word: תִזְכֹּר
  choice: будешь вспоминать о нём
  rationale: Имперфект Qal второго лица единственного числа. Местоимение «о нём» восполняет подразумеваемый объект — страдание — и обеспечивает ясность по-русски.
