lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: ярче полудня
  rationale: 'Предлог מִן при слове «полдень» естественно понимать как показатель сравнения: будущая жизнь Иова представлена сияющей ярче полуденного света.'
- source_word: יָקוּם
  choice: взойдёт
  rationale: Глагол קום означает «вставать, подниматься». «Взойдёт» сохраняет поэтический образ появления света и сочетается с образом утра во второй строке.
- source_word: חָלֶד
  choice: жизнь
  rationale: Слово может обозначать срок жизни, земную жизнь или человеческое существование. В русском стихе «жизнь» звучит естественно и не сужает значение исключительно до продолжительности.
- source_word: תָּעֻפָה
  choice: даже мрак
  rationale: Редкое и не вполне ясное слово в данном контексте обычно связывают с мраком или тьмой. Частица «даже» передаёт подразумеваемый уступительный контраст с последующим образом утра, не выдавая его за явно выраженный союз в еврейском тексте.
- source_word: כַּבֹּקֶר
  choice: подобен утру
  rationale: Предлог כ выражает уподобление, а בֹּקֶר означает «утро». Перевод сохраняет прямое поэтическое сравнение.
- source_word: תִּהְיֶה
  choice: станет
  rationale: Хотя היה может означать просто «быть», здесь «станет» естественно передаёт переход от мрака к утреннему свету.
