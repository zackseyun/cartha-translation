  yaml_path: translation/ot/job/011/019.yaml
  text: You will lie down[a], and none will make you afraid; many will entreat your favor.
translation:
  language: ru
  text: Ты ляжешь, и никто тебя не устрашит; многие будут искать твоего расположения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут умолять твоё лицо» — еврейское выражение со значением «искать твоего расположения, благосклонности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבַצְתָּ
  choice: ты ляжешь
  rationale: Прямо передаёт образ лежащего в безопасности; контекст покоя сохраняется без замены образа толкованием «отдохнёшь».
- source_word: מַחֲרִיד
  choice: никто тебя не устрашит
  rationale: Причастие каузативного значения обозначает того, кто заставляет трепетать или бояться; русский оборот краток и естественен.
- source_word: חִלּוּ פָנֶיךָ
  choice: будут искать твоего расположения
  rationale: Еврейская идиома буквально связана с обращением к лицу человека и означает стремление снискать его благосклонность; выбранный вариант естественно передаёт смысл, не сужая его до одной конкретной формы просьбы.
- source_word: רַבִּים
  choice: многие
  rationale: Прямой и естественный эквивалент субстантивированного прилагательного, обозначающего множество людей.
- source_word: וְאֵין
  choice: и никто не
  rationale: Передаёт отрицательную экзистенциальную конструкцию кратким современным русским оборотом.
