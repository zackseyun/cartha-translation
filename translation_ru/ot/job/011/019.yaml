  verdict: approve
  source_fidelity: 'Текст точно передаёт три смысловых звена еврейского стиха: «ляжешь» (רָבַצְתָּ), отсутствие кого-либо, кто мог бы устрашить (וְאֵין מַחֲרִיד), и то, что многие будут искать благосклонности адресата (וְחִלּוּ פָנֶיךָ רַבִּים). Будущее значение естественно следует из контекста речи Цофара. Смысл идиомы не сужен и не доктринально истолкован.'
  naturalness: «Ты ляжешь, и никто тебя не устрашит; многие будут искать твоего расположения» — естественная, ясная и поэтически сжатая формулировка на современном литературном русском. «Устрашит» слегка возвышенно, но уместно в библейской поэзии и не архаично до степени непонятности.
  terminology: «Искать твоего расположения» удачно передаёт חלה פני как стремление снискать чью-либо благосклонность. Сноска корректно отмечает буквальный образ «лица» и объясняет его идиоматическое значение. Имена и специальные богословские термины в стихе отсутствуют.
