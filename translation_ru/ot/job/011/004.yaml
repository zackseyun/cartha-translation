  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: ru
  text: 'Ведь ты говоришь: «Моё учение[a] чисто, и я чист в твоих глазах».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление»; возможно также: «речь». Еврейское слово может обозначать то, что человек усвоил или излагает как учение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: ты говоришь
  rationale: Форма глагола может передаваться прошедшим временем, однако в поэтическом споре настоящее время естественно выражает приписываемое Иову нынешнее утверждение.
- source_word: זַךְ
  choice: чисто
  rationale: Прилагательное означает «чистый, незапятнанный»; краткая форма «чисто» естественно согласуется со словом «учение» и сохраняет отличие от следующего определения человека.
- source_word: לִקְחִי
  choice: моё учение
  rationale: Существительное может обозначать усвоенное или излагаемое учение, наставление либо содержание речи; «учение» хорошо передаёт заявляемую Иовом правильность изложенной им позиции.
- source_word: וּבַר
  choice: и я чист
  rationale: Прилагательное означает «чистый, непорочный». Повтор корня «чист-» по-русски передаёт смысловую параллель двух близких еврейских прилагательных, не превращая второе в более узкое утверждение о безгрешности.
- source_word: הָיִיתִי
  choice: я чист
  rationale: Хотя глагольная форма буквально может быть передана как «я был», в составе приписываемого Иову утверждения она естественно обозначает состояние, которое он якобы заявляет о себе сейчас.
- source_word: בְעֵינֶיךָ
  choice: в твоих глазах
  rationale: Сохранён еврейский образ оценки «в глазах» кого-либо; местоимение стоит в единственном числе.
theological_decisions:
- issue: К кому относится «в твоих глазах»
  choice: Оставить местоимение со строчной буквы без пояснения в основном тексте
  alternative: Понять слова как прямое обращение к Богу и написать «в Твоих глазах» либо перевести «пред Тобой»
  rationale: В контексте Софар, вероятнее всего, представляет Иова утверждающим свою чистоту перед Богом, однако в самой строке Бог прямо не назван. Строчная буква сохраняет формальную неоднозначность и не мешает контекстуальному прочтению.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественно-сдержанной поэтической фразой. «Ведь» передаёт обосновывающую связь с обвинением Софара; кавычки ясно выделяют приписываемые Иову слова.
