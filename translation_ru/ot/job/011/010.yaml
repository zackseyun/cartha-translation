  text: אִם יַחֲלֹ֥ף וְ/יַסְגִּ֑יר וְ֝/יַקְהִ֗יל וּ/מִ֣י יְשִׁיבֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/010.yaml
  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: ru
  text: Если Он пройдёт, заключит кого-либо под стражу и созовёт собрание[b], кто сможет обратить Его вспять[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто сможет отменить это?» Еврейский текст допускает как личное понимание — обратить вспять действующего, так и более общее — обратить вспять совершённое им.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «соберёт людей», «созовёт». Здесь возможен судебный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет условно-гипотетическую силу частицы и риторический характер высказывания.
- source_word: יַחֲלֹף
  choice: пройдёт
  rationale: Передаёт основное значение глагола חלף — «проходить, миновать» — без добавления идеи разрушительного движения.
- source_word: וְיַסְגִּיר
  choice: заключит кого-либо под стражу
  rationale: Каузативная форма от סגר может означать «запереть, заключить, выдать». В русском переводе неопределённое дополнение добавлено для естественности, при этом конкретный объект не назван.
- source_word: וְיַקְהִיל
  choice: созовёт собрание
  rationale: Каузативная форма от קהל означает «собирать, созывать». Формулировка допускает публичный или судебный оттенок, не делая его обязательным.
- source_word: וּמִי
  choice: кто
  rationale: Союз и вопросительное местоимение вводят риторический вопрос; русская конструкция естественно передаёт связь без отдельного «тогда».
- source_word: יְשִׁיבֶנּוּ
  choice: сможет обратить Его вспять
  rationale: Каузативная форма от שוב буквально выражает возвращение или поворот назад. Личное местоимение соответствует мужскому суффиксу, а «сможет» ясно передаёт риторическую мысль о невозможности воспрепятствовать действующему.
theological_decisions:
- issue: К кому относятся глаголы в мужском роде и конечный местоименный суффикс
  choice: 'Подразумеваемый субъект — Бог; конечный суффикс передан лично: «Его».'
  alternative: 'Конечный суффикс можно понимать шире: «кто сможет отменить это?», то есть обратить вспять совершённое Богом.'
  rationale: Контекст говорит о Божьем знании и действии, а мужской суффикс естественно соотносится с действующим субъектом. Возможность более отвлечённого понимания сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулировкой «обратить вспять». Заглавные местоимения обозначают Бога как подразумеваемого субъекта в данном контексте.
