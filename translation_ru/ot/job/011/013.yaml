base_translation:
  language: en
  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: ru
  text: Если ты приготовишь своё сердце и протянешь к нему руки,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распрострёшь к нему свою руку». В еврейском тексте слово «ладонь/рука» стоит в единственном числе, но всё выражение обычно обозначает молитвенный жест с протянутыми руками.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Передаёт условный характер обращения Софара к Иову без усиления, которого нет в еврейском тексте.
- source_word: הֲכִינוֹתָ לִבֶּךָ
  choice: приготовишь своё сердце
  rationale: Глагол כון в породе хифиль означает привести в готовность, утвердить или должным образом направить; сочетание «приготовить сердце» сохраняет еврейский образ внутреннего человека, включая мысли и волю.
- source_word: וּפָרַשְׂתָּ
  choice: и протянешь
  rationale: פרשׂ обозначает расправление или протягивание; здесь речь, вероятно, идёт о молитвенном жесте.
- source_word: אֵלָיו
  choice: к нему
  rationale: Сохраняет направленность действия и местоименную форму оригинала, не подставляя явно слово «Бог».
- source_word: כַּפֶּךָ
  choice: руки
  rationale: В еврейском стоит существительное единственного числа «ладонь/рука», однако выражение описывает обычный молитвенный жест; русское множественное число звучит естественно и точно передаёт действие.
theological_decisions:
- issue: К кому относится местоимение אֵלָיו
  choice: «к нему» — по контексту к Богу, без явной замены местоимения существительным
  alternative: «к Богу»
  rationale: Контекст ясно указывает на Бога, однако в оригинале употреблено местоимение. Его сохранение не добавляет отсутствующей в тексте конкретизации.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «приготовить сердце». «Протянешь руки» понятно современному читателю и передаёт молитвенный жест без излишней архаизации.
