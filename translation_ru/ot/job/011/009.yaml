source:
  edition: WLC
  text: אֲרֻכָּ֣ה מֵ/אֶ֣רֶץ מִדָּ֑/הּ וּ֝/רְחָבָ֗ה מִנִּי יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: ru
  text: Её мера длиннее земли и шире моря.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Её протяжённость длиннее земли и шире моря».'
    reason: 'Лексическая альтернатива для מִדָּהּ: «протяжённость» вместо более буквального «мера».'
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: длиннее
  rationale: Форма женского рода согласуется с מִדָּהּ («её мера»); при сравнительном מִן естественна русская сравнительная степень.
- source_word: מֵאֶרֶץ
  choice: земли
  rationale: Предлог מִן выражает сравнение («чем земля»); в русской сравнительной конструкции союз «чем» может быть естественно опущен, а родительный падеж сохраняет смысл. В параллели с морем אֶרֶץ передано как «земля».
- source_word: מִדָּהּ
  choice: её мера
  rationale: מִדָּה означает меру, размер или протяжённость. Буквальное «мера» сохраняет конкретный образ и женский род, связывающий сказуемые; местоимение отсылает к тому, о чём говорится в предыдущем стихе.
- source_word: וּרְחָבָה
  choice: и шире
  rationale: Прилагательное женского рода образует параллель с אֲרֻכָּה; сравнительная форма точно передаёт следующий сравнительный מִן.
- source_word: מִנִּי יָם
  choice: моря
  rationale: Поэтическая форма מִנִּי выражает сравнение; יָם прямо означает «море». Родительный падеж после сравнительной степени естественен по-русски.
theological_decisions:
- issue: Референт местоимения женского рода
  choice: Сохранено местоимение «её» без поясняющей вставки.
  alternative: Явно назвать «Божью мудрость» или «Божьи тайны».
  rationale: Еврейский текст использует суффикс женского рода, чей референт определяется контекстом предыдущего стиха. Уточняющая вставка разрешила бы сохраняемую текстом неоднозначность.
translation_notes:
  register: Современный литературный русский язык; сохранены краткость, пространственный образ и поэтический параллелизм еврейского текста. Формула «длиннее земли и шире моря» естественна и торжественна без архаизации.
