id: JOB.11.14
reference: Job 11:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם אָ֣וֶן בְּ֭/יָדְ/ךָ הַרְחִיקֵ֑/הוּ וְ/אַל תַּשְׁכֵּ֖ן בְּ/אֹהָלֶ֣י/ךָ עַוְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: ru
  text: Если в твоей руке беззаконие[a], удали его подальше и не позволяй неправде обитать в твоих шатрах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «в твоей руке» может означать зло, которое ты совершаешь или держишь под своим контролем.
    reason: lexical_alternative
  - marker: b
    text: «Шатры» здесь обозначают домашнюю сферу — жилище и жизнь семьи.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Передаёт условную частицу прямо и естественно, не добавляя отсутствующего в тексте усиления.
- source_word: אָוֶן
  choice: беззаконие
  rationale: В этом нравственном призыве слово обозначает зло или порочное деяние; «беззаконие» сохраняет этическую весомость и сочетается с параллельным עַוְלָה.
- source_word: בְּיָדְךָ
  choice: в твоей руке
  rationale: Сохранён еврейский образ того, что человек держит, совершает или имеет в своей власти; значение идиомы пояснено в сноске.
- source_word: הַרְחִיקֵהוּ
  choice: удали его подальше
  rationale: Передаёт повеление активно отстранить беззаконие и сохраняет значение удаления на расстояние.
- source_word: וְאַל
  choice: и не
  rationale: Естественно передаёт союз с частицей запрета.
- source_word: תַּשְׁכֵּן
  choice: не позволяй … обитать
  rationale: Каузативная форма от «обитать, селиться» здесь выражает запрет допускать постоянное присутствие неправды; образ обитания сохранён.
- source_word: בְּאֹהָלֶיךָ
  choice: в твоих шатрах
  rationale: Сохранены конкретный образ и множественное число еврейского текста; подразумеваемая домашняя сфера пояснена в сноске.
- source_word: עַוְלָה
  choice: неправда
  rationale: Слово обозначает несправедливость или неправедное деяние. «Неправда» естественно звучит в нравственном контексте и отличает этот термин от אָוֶן без введения жёсткого богословского разграничения.
theological_decisions:
- issue: Нравственная лексика в поэтическом параллелизме
  choice: 'Передать אָוֶן и עַוְלָה близкими, но разными словами: «беззаконие» и «неправда».'
  alternative: Передать оба слова одинаково либо обобщить их словом «зло».
  rationale: Так сохраняется разнообразие еврейской поэтической речи и общий нравственный смысл, но не создаётся искусственного технического различия между двумя близкими понятиями.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтических образов руки, обитания и шатров. Формулировка торжественная, но понятная; синтаксис не перегружен.
