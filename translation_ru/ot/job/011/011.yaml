  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: ru
  text: Ведь Он знает лживых людей; видя беззаконие, разве Он не замечает?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не замечает»; возможно также: «и не вникает». Последнюю часть еврейского текста можно понять как прямое отрицание, однако контекст скорее указывает на риторический вопрос: «разве Он не замечает?»'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для слов Софара и естественно передаёт аргументативную связь с контекстом.
- source_word: הוּא
  choice: Он
  rationale: В контексте местоимение относится к Богу; прописная буква соответствует принятому русскому библейскому стилю, не меняя смысла еврейского текста.
- source_word: יָדַע
  choice: знает
  rationale: Перфект выражает устойчивое, общеистинное знание Бога, поэтому настоящее время естественно в русском языке.
- source_word: מְתֵי שָׁוְא
  choice: людей лживых
  rationale: Сочетание обозначает людей лжи, пустоты или ничтожества. Такой перевод сохраняет нравственный оттенок שָׁוְא и звучит по-русски естественнее буквального «людей лжи».
- source_word: וַיַּרְא
  choice: видя
  rationale: 'Деепричастная конструкция естественно передаёт обстоятельственную, близкую к временной связь: когда Бог видит беззаконие.'
- source_word: אָוֶן
  choice: беззаконие
  rationale: В данном нравственном контексте слово обозначает зло или неправедность; «беззаконие» сохраняет весомый, но понятный современному читателю библейский регистр.
- source_word: וְלֹא יִתְבּוֹנָן
  choice: разве Он не замечает его?
  rationale: 'Финальная часть понята как риторический вопрос, что лучше соответствует ходу мысли: Бог знает лживых людей и видит зло, а значит, замечает его. Глагол передаёт внимательное восприятие или рассмотрение.'
theological_decisions:
- issue: Сила финальной части וְלֹא יִתְבּוֹנָן
  choice: 'Риторический вопрос: «разве Он не замечает его?»'
  alternative: 'Прямое отрицание: «и не замечает» или «и не вникает».'
  rationale: Грамматически возможно прямое отрицание, однако в контексте Софар утверждает полноту Божьего знания, поэтому риторический вопрос лучше связывает части стиха. Альтернативное прочтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Синтаксис сделан плавным, при этом смысловая неоднозначность последней части не устранена молча, а отражена в сноске.
