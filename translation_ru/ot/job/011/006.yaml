  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: ru
  text: 'и открыл бы тебе тайны мудрости[a], ибо у мудрости две стороны[b]. И знай: Бог не взыскивает с тебя за часть твоей вины[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровенное мудрости».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ибо она двойная (или: вдвое больше) для мудрости». Еврейская конструкция трудна; смысл, по-видимому, в том, что мудрость сложнее и многограннее, чем кажется.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский глагол труден для понимания. Возможны переводы: «Бог забыл часть твоей вины» или «Бог взыскивает с тебя меньше, чем ты заслуживаешь за свою вину».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד
  choice: и открыл бы
  rationale: Глагол в породе хифиль означает «сообщить, объявить, сделать известным»; условно-желательная форма продолжает пожелание Софара из предыдущего стиха.
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: сокровенное мудрости
  rationale: Сохраняет значение скрытых, недоступных человеку сторон мудрости и родительную связь исходного выражения; «тайны мудрости» возможно как более привычный вариант.
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: у здравой мудрости две стороны
  rationale: כִפְלַיִם буквально указывает на двойственность, а תּוּשִׁיָּה обозначает здравую, действенную мудрость. Формулировка передаёт образ двух сторон, не сводя его к простому количественному удвоению.
- source_word: וְדַע
  choice: Тогда знай
  rationale: Императив передан как прямое увещевание, а «тогда» выражает его выводной характер в контексте.
- source_word: יַשֶּׁה לְךָ ... מֵעֲוֺנֶךָ
  choice: Бог не взыскивает с тебя за часть твоей вины
  rationale: Трудный глагол связан со значением забвения или оставления без внимания; в контексте обвинения Софара выражение означает, что Бог не потребовал с Иова полной расплаты за его вину. Частичное значение предлога מִן сохранено словом «часть».
- source_word: אֱלוֹהַ
  choice: Бог
  rationale: Обычная передача поэтической формы единственного числа без неоправданного расширения титула.
- source_word: עֲוֺנֶךָ
  choice: твоей вины
  rationale: עָוֹן может обозначать беззаконие, вину или её последствие; «вина» сохраняет нравственно-юридическую многозначность контекста.
theological_decisions:
- issue: Смысл утверждения Софара о том, как Бог поступает с Иовом
  choice: Бог не взыскивает с Иова за часть его вины
  alternative: Бог предал забвению часть вины Иова; Бог взыскивает с него меньше, чем заслуживает его вина
  rationale: 'Контекст указывает на обвинение Софара: Иов, по его мнению, наказан не в полной мере. Перевод передаёт слова персонажа, не утверждая их как окончательную богословскую оценку книги.'
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис остаётся ясным для широкого читателя; условно-желательная связь с предыдущим стихом и трудность заключительного еврейского глагола сохранены. Формулировка передаёт обвинение Софара, не превращая его мнение в авторский богословский вывод.
