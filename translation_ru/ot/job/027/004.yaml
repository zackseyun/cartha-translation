translation:
  language: ru
  text: Мои уста не скажут ничего несправедливого[a], и язык мой не произнесёт обмана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте употреблена клятвенная конструкция с «если» (אִם): буквально «если мои уста скажут несправедливое…», то есть «мои уста ни за что не скажут ничего несправедливого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: не
  rationale: В клятвенной конструкции אִם выражает решительное отрицание, а не обычное условие; по-русски это естественно передаётся прямым «не».
- source_word: תְּדַבֵּרְנָה
  choice: произнесут
  rationale: Пиэль глагола דבר означает «говорить»; имперфект здесь имеет оттенок твёрдого решения. Форма множественного числа согласована с «устами».
- source_word: שְׂפָתַי
  choice: мои уста
  rationale: Сохранён образ органа речи и поэтический параллелизм с «моим языком». «Уста» уместны в dignified библейской поэзии и понятны современному читателю.
- source_word: עַוְלָה
  choice: неправды
  rationale: Слово обозначает неправедность, несправедливость или зло. В контексте речи «неправда» сохраняет нравственный смысл и не дублирует полностью последующий «обман».
- source_word: וּלְשׁוֹנִי
  choice: и мой язык
  rationale: Союз ו передан буквально как «и»; отрицание естественно распространяется на вторую параллельную строку.
- source_word: יֶהְגֶּה
  choice: изречёт
  rationale: הגה может означать тихо произносить, выговаривать или обдумывать; при подлежащем «язык» и дополнении «обман» речь идёт о произнесении. «Изречёт» сохраняет поэтический регистр.
- source_word: רְמִיָּה
  choice: обмана
  rationale: Слово означает обман, коварство или вероломство; «обман» ясно и естественно обозначает лживую речь.
