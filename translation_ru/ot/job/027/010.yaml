  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: ru
  text: Разве он находит радость во Всемогущем? Разве взывает к Богу во всякое время?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אִם буквально означает «если»; в данном контексте оно, вероятно, вводит риторические вопросы.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: разве ...?
  rationale: В данном контексте частица вводит риторический вопрос, а не условное придаточное; «разве» естественно передаёт ожидаемый отрицательный ответ.
- source_word: עַל
  choice: во
  rationale: При глаголе התענג предлог обозначает того, в ком находят радость; по-русски естественно «находить радость в ком-либо».
- source_word: שַׁדַּי
  choice: Всемогущем
  rationale: Божественный титул переведён, а не транслитерирован; это традиционный и понятный русский эквивалент.
- source_word: יִתְעַנָּג
  choice: находит радость
  rationale: Передаёт значение Hitpael «услаждаться, находить удовольствие» естественным современным русским выражением.
- source_word: יִקְרָא
  choice: взывает
  rationale: В сочетании с обозначением Бога глагол означает обращение к Нему с призывом или молитвой; «взывает» сохраняет широту значения.
- source_word: אֱלוֹהַּ
  choice: Богу
  rationale: Единственное число божественного наименования без добавочных смысловых компонентов передано обычным словом «Бог».
- source_word: בְּכָל עֵת
  choice: во всякое время
  rationale: Формулировка близко сохраняет всеохватность еврейского выражения и соответствует возвышенному поэтическому регистру.
theological_decisions:
- issue: Передача божественного титула שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: Титул переведён для ясности читателю; транслитерация скрыла бы его титульный характер.
- issue: Характер первого высказывания
  choice: риторический вопрос с «разве»
  alternative: условное придаточное «если он находит радость»
  rationale: Контекст речи о безбожнике и параллельный вопрос указывают на вопросительное употребление אִם, однако буквальная условная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Параллелизм двух риторических вопросов сохранён; «во всякое время» выбрано вместо более разговорного «всегда».
