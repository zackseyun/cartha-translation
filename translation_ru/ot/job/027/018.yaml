lexical_decisions:
- source_word: בָּנָה
  choice: строит
  rationale: Форма перфекта в поэтическом описании имеет обобщённо-характеризующее значение; настоящее время естественно передаёт обычное действие нечестивого.
- source_word: כָעָשׁ
  choice: как моль
  rationale: עָשׁ обычно означает «моль»; сравнительная частица כְ сохранена. Необычный и намеренно хрупкий образ не следует сглаживать добавлением отсутствующих в еврейском тексте слов.
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: В параллели с временным шалашом בַּיִת обозначает строение, а возвратное «свой» естественно передаёт принадлежность дома подлежащему.
- source_word: וּכְסֻכָּה
  choice: как шалаш
  rationale: סֻכָּה здесь обозначает лёгкое временное укрытие; «шалаш» конкретно и понятно передаёт полевой контекст.
- source_word: עָשָׂה
  choice: ставит
  rationale: Хотя буквально глагол означает «делает», по-русски шалаш естественно «ставят»; настоящее время согласуется с обобщённым характером строки.
- source_word: נֹצֵר
  choice: сторож
  rationale: Причастие от נצר означает того, кто сторожит или охраняет; в образе временного полевого укрытия уместно краткое «сторож».
