  - marker: b
    text: 'Еврейская фраза трудна для истолкования. Возможно также: «когда он наживается»; некоторые понимают: «когда Бог положит ему конец».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «извлечёт его душу/жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְוַת
  choice: на что надеяться
  rationale: Риторическая конструкция естественно передаёт существительное «надежда» в современном русском языке, сохраняя смысл вопроса об окончательном уповании человека.
- source_word: חָנֵף
  choice: безбожнику
  rationale: В Книге Иова слово обозначает нечестивого, непочтительного к Богу человека и не сводится к одной лишь неискренности; «безбожник» передаёт этот широкий религиозно-нравственный смысл.
- source_word: יִבְצָע
  choice: положит ему конец
  rationale: Краткая и трудная для истолкования форма допускает смысл отсечения или прекращения жизни; в параллели с последующей строкой этот перевод наиболее связен. Возможный смысл приобретения сохранён в сноске.
- source_word: יֵשֶׁל
  choice: отнимет
  rationale: Глагол выражает извлечение или удаление; сочетание «отнимет у него жизнь» ясно и естественно передаёт смертельное лишение жизни.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Это обычное для поэтической речи Книги Иова единственное обозначение Бога.
- source_word: נַפְשׁוֹ
  choice: у него жизнь
  rationale: Здесь נֶפֶשׁ означает жизнь человека, которую Бог отнимает при смерти, а не служит точным термином для описания нематериальной души.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: Передать как «жизнь»
  alternative: «душу»
  rationale: Стих говорит о смерти как лишении жизни и не формулирует отдельного учения о метафизической природе души.
- issue: Субъект и смысл כִּי יִבְצָע
  choice: «когда Бог положит ему конец»
  alternative: «когда он наживётся» или «хотя он и нажился»
  rationale: Параллелизм с выражением «когда отнимет у него жизнь» поддерживает понимание о прекращении жизни Богом, однако трудность еврейской фразы и возможный смысл приобретения прямо отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Риторический вопрос передан естественной конструкцией «на что надеяться»; параллелизм двух временных придаточных сохранён. Неоднозначность трудной еврейской фразы вынесена в сноску без догматического разрешения.
