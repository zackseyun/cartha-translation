base_translation:
  language: en
  yaml_path: translation/ot/job/027/015.yaml
  text: Those who survive him will be buried by death[a], and his widows will not weep.
translation:
  language: ru
  text: Его уцелевшие будут погребены смертью[a], и его вдовы не будут плакать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут погребены в смерти». Еврейское выражение сжато и может обозначать либо смерть как участь, сопровождающую их погребение, либо погребение среди смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרִידוֹ
  choice: оставшиеся после него
  rationale: Существительное обозначает того, кто остался или уцелел; форма единственного числа с суффиксом имеет здесь собирательное значение, на что указывает глагол во множественном числе.
- source_word: בַּמָּוֶת
  choice: смертью
  rationale: Предлог בְּ при מָוֶת допускает обстоятельственное или близкое к инструментальному понимание. Творительный падеж сохраняет сжатый и резкий образ еврейского текста, не устраняя возможности смысла «в смерти».
- source_word: יִקָּבֵרוּ
  choice: будут погребены
  rationale: Нифаль глагола קבר выражает пассивное значение «быть погребённым»; «погребены» соответствует возвышенному, но понятному регистру книги Иова.
- source_word: וְאַלְמְנֹתָיו
  choice: и вдовы их
  rationale: Буквально местоименный суффикс имеет мужской род единственного числа («его»), однако ближайший смысловой референт — собирательная группа оставшихся после нечестивца. По-русски «вдовы их» естественно передаёт женщин, овдовевших вследствие их смерти, и избегает ошибочного впечатления, будто все вдовы принадлежали одному человеку.
- source_word: לֹא תִבְכֶּינָה
  choice: не станут плакать
  rationale: Глагол בכה непосредственно означает «плакать»; будущее «не станут» естественно передаёт несовершенный вид в данном предсказательном контексте.
theological_decisions:
- issue: Принадлежность вдов в выражении וְאַלְמְנֹתָיו
  choice: вдовы их
  alternative: его вдовы
  rationale: Формально суффикс значит «его», но его антецедент שָׂרִידוֹ — собирательное обозначение уцелевших/оставшихся. Русское согласование по смыслу передаёт связь вдов с погибшими членами этой группы, не вводя предположения о многожёнстве одного лица.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранён резкий образ «погребены смертью» и отмечена его подлинная неоднозначность; синтаксис сделан понятным без сглаживания мрачной лаконичности оригинала.
