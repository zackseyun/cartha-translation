base_translation:
  language: en
  yaml_path: translation/ot/job/027/011.yaml
  text: I will teach you concerning the hand of God[b][a]; what is with the Almighty I will not hide.
translation:
  language: ru
  text: Я научу вас тому, что касается руки Бога[a]; того, что у Всемогущего[b], не скрою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о Божьей руке». Это выражение может указывать на силу Бога, Его действия или то, как Он поступает.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные значения: «того, что принадлежит Всемогущему», «совета Всемогущего» или «того, что исходит от Всемогущего». Еврейское выражение кратко и несколько эллиптично.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹרֶה
  choice: Я научу
  rationale: Гифиль, имперфект 1-го лица единственного числа от ירה в значении наставления; форма «научу» естественно передаёт заявленное Иовом намерение.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Прямое дополнение 2-го лица мужского рода множественного числа; по-русски естественно «вас».
- source_word: בְּיַד אֵל
  choice: о руке Бога
  rationale: Предлог ב здесь вероятнее обозначает предмет наставления, а не средство действия. Метафора «рука Бога» сохраняет указание на Божью силу, деятельность или деяния, не сужая смысла.
- source_word: אֵל
  choice: Бога
  rationale: אֵל употреблено как обозначение Бога; стандартный русский эквивалент в данном контексте — «Бог».
- source_word: אֲשֶׁר עִם שַׁדַּי
  choice: того, что у Всемогущего
  rationale: Краткое и эллиптическое еврейское выражение передано достаточно буквально; русский оборот сохраняет широту смысла и не уточняет его как «замысел», «совет» или «суд».
- source_word: שַׁדַּי
  choice: Всемогущего
  rationale: Традиционный и ясный русский эквивалент божественного титула שַׁדַּי, особенно характерного для книги Иова.
- source_word: לֹא אֲכַחֵד
  choice: не скрою
  rationale: Пиэль, имперфект от כחד означает «скрывать, утаивать»; «не скрою» кратко и естественно в контексте обещания изложить знание.
theological_decisions:
- issue: Божественная деятельность, выраженная образом «руки Бога»
  choice: Сохранить метафору «рука Бога».
  alternative: «сила Бога» или «то, что делает Бог»
  rationale: Образ богословски ёмок и распространён в Писании; его сохранение не сводит выражение только к силе, суду или иному отдельному аспекту Божьих действий.
- issue: Смысл выражения אֲשֶׁר עִם שַׁדַּי
  choice: Передать как «то, что у Всемогущего».
  alternative: «совет Всемогущего», «замысел Всемогущего» или «пути Всемогущего»
  rationale: Оригинал намеренно краток и допускает широкий смысл. Буквальный оборот сохраняет неоднозначность и не приписывает Иову более узкого утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены метафора «рука Бога» и смысловая незавершённость выражения «то, что у Всемогущего»; синтаксис слегка перестроен ради естественности русского порядка слов.
