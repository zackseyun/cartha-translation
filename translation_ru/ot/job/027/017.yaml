base_translation:
  language: en
  yaml_path: translation/ot/job/027/017.yaml
  text: He may prepare it[a], but the righteous will wear it[b], and the innocent will divide the silver.
translation:
  language: ru
  text: Он приготовит одежду[a], но наденет её праведник[b], а серебро разделит невиновный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть он приготовит одежду — всё же наденет её праведник». Еврейский имперфект допускает простое будущее; уступительный оттенок определяется контекстом предыдущего стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Дополнение «одежду» подразумевается из предыдущего стиха; в еврейском тексте здесь буквально: «он приготовит, но праведник наденет».'
    reason: cross_reference
lexical_decisions:
- source_word: יָכִין
  choice: приготовит
  rationale: Hiphil глагола כון означает «приготовить, устроить». Будущее время естественно передаёт еврейский имперфект; противительный смысл выявляется союзом «но» из контекста.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе; «праведник» естественно и точно передаёт нравственное противопоставление нечестивому.
- source_word: יִלְבָּשׁ
  choice: наденет её
  rationale: Глагол לבש означает «надевать, носить». Местоимение относится к подразумеваемой одежде из предыдущего стиха.
- source_word: כֶסֶף
  choice: серебро
  rationale: В данном контексте כסף обозначает накопленное серебро как богатство; конкретное «серебро» точнее общего «деньги».
- source_word: נָקִי
  choice: невиновный
  rationale: Субстантивированное прилагательное обозначает человека, свободного от вины; выбор сохраняет отличие от צַדִּיק — «праведник».
- source_word: יַחֲלֹק
  choice: разделит
  rationale: Qal глагола חלק прямо означает «делить, распределять».
theological_decisions:
- issue: Характер противопоставления между приготовлениями нечестивого и участью его имущества
  choice: «приготовит... но»
  alternative: «пусть приготовит... всё же»
  rationale: Еврейский имперфект сам по себе не требует уступительного перевода, однако контекст ясно противопоставляет труд нечестивого тому, кто воспользуется накопленным. Формулировка сохраняет и прямое значение формы, и контекстуальное напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем стиха. «Праведник» и «невиновный» сохраняют различие двух еврейских нравственных характеристик; «одежда» введена как подразумеваемое дополнение из Иов 27:16.
