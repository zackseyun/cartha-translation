base_translation:
  language: en
  yaml_path: translation/ot/job/027/022.yaml
  text: He hurls at him and does not spare[b][a]; he surely flees from his hand.
translation:
  language: ru
  text: Он мечет в него[a] и не щадит; тот стремительно бежит от его руки.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бросает/мечет на него». Предмет, который он бросает, в еврейском тексте не назван; возможен также перевод: «бросает в него».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «бегством бежит»; сочетание однокоренных форм в еврейском языке усиливает значение глагола: «непременно бежит» или «стремительно бежит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַשְׁלֵךְ עָלָיו
  choice: Он обрушивается на него
  rationale: Глагол שלך означает «бросать, повергать», а עַל при враждебно направленном движении — «на, против». В русском языке буквальное «бросает на него» требует не названного в еврейском тексте дополнения; «обрушивается на него» естественно передаёт образ яростного нападения, не вводя такого объекта. Возможная более буквальная трактовка отмечена в сноске.
- source_word: וְלֹא יַחְמֹל
  choice: и не щадит
  rationale: חמל сочетает значения жалости и удержания от губительного действия; в сцене суда краткое «не щадит» передаёт обе стороны смысла.
- source_word: מִיָדוֹ
  choice: от его руки
  rationale: Сохранён буквальный образ руки как силы или власти; по-русски это выражение понятно и не требует замены на толкование «от его власти».
- source_word: בָּרוֹחַ יִבְרָח
  choice: изо всех сил бежит
  rationale: Инфинитив абсолютный при личной форме того же глагола усиливает действие. Русское «изо всех сил бежит» естественно выражает усиление и срочность бегства; формальная конструкция разъяснена в сноске.
theological_decisions:
- issue: Не названный прямо субъект первого действия и смена участника перед глаголом «бежит»
  choice: Сохранено местоимение «Он», а бегущий обозначен словом «тот»
  alternative: Назвать первого действующего Бога либо бурю
  rationale: Еврейский стих прямо не называет субъекта וְיַשְׁלֵךְ. Контекст допускает соотнесение с Богом или с орудием суда; перевод не закрепляет одну из этих трактовок. «Тот» естественно показывает, что бежит подвергшийся нападению человек, не добавляя имени первого действующего.
translation_notes:
  register: 'Современный литературный русский язык, сдержанный и выразительный. Сохранены краткость стиха, образ «руки» и двусоставное движение: беспощадное нападение и отчаянное бегство. Не названный в оригинале субъект не отождествлён прямо ни с Богом, ни с бурей.'
