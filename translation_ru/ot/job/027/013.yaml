lexical_decisions:
- source_word: זֶה
  choice: Вот
  rationale: Указательное слово вводит последующее определение участи; «вот» естественно и выразительно передаёт такую конструкцию по-русски.
- source_word: חֵלֶק
  choice: доля
  rationale: Обозначает выпавшую человеку участь и сохраняет смысловое различие со следующим «наследие».
- source_word: אָדָם רָשָׁע
  choice: нечестивого человека
  rationale: Передаёт форму единственного числа и нравственную характеристику רָשָׁע в обычной лексике русской библейской речи.
- source_word: עִם אֵל
  choice: у Бога
  rationale: Буквально сочетание означает «с Богом», но в контексте доли естественное русское «у Бога» сохраняет отношение к Богу и не исключает подразумеваемого смысла «от Бога».
- source_word: נַחֲלַת
  choice: наследие
  rationale: Прямой и традиционный эквивалент понятия удела или достояния, получаемого в качестве наследства.
- source_word: עָרִיצִים
  choice: притеснители
  rationale: Слово обозначает жестоких, властных и насильственно угнетающих людей; «притеснители» ясно передаёт направленное против других угнетение.
- source_word: מִשַּׁדַּי
  choice: от Всемогущего
  rationale: Предлог מִן выражает источник, а божественный титул שַׁדַּי переводится по смыслу.
- source_word: יִקָּחוּ
  choice: получают
  rationale: Буквально «берут», однако при «наследии» глагол контекстуально означает получение назначенного удела.
theological_decisions:
- issue: Отношение доли нечестивого к Богу в עִם אֵל
  choice: у Бога
  alternative: от Бога
  rationale: 'Перевод сохраняет необычную конструкцию с עִם и её богословскую напряжённость: речь о доле нечестивого в отношении к Богу, при этом контекст допускает понимание Бога как дающего эту долю.'
- issue: Божественный титул שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: Это титул Бога, поэтому он переведён по принятому смысловому соответствию, а не транслитерирован.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Параллелизм «доля — наследие» сохранён; двусмысленность עִם אֵל не устранена молча, а отражена в примечании.
