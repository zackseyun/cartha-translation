  text: הַֽ֭/צַעֲקָת/וֹ יִשְׁמַ֥ע אֵ֑ל כִּֽי תָב֖וֹא עָלָ֣י/ו צָרָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/009.yaml
  text: Will God hear his cry when distress comes upon him?[a][b][c]
translation:
  language: ru
  text: Услышит ли Бог его вопль, когда постигнет его беда?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его крик» или «его мольбу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «если постигнет его беда»; еврейский союз может иметь условное значение, хотя здесь контексту хорошо соответствует временное «когда».'
    reason: alternative_reading
  - marker: c
    text: «Беда» может быть также переведена как «бедствие», «несчастье» или «скорбь».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצַּעֲקָתוֹ
  choice: его вопль
  rationale: Существительное צְעָקָה обозначает громкий, настойчивый крик, нередко зов о помощи в бедствии. «Вопль» кратко передаёт силу выражения и сохраняет возвышенный, но понятный регистр.
- source_word: יִשְׁמַע
  choice: услышит ли
  rationale: 'Форма yiqtol в данном риторическом вопросе естественно выражает будущее: услышит ли Бог крик такого человека, когда придёт беда.'
- source_word: אֵל
  choice: Бог
  rationale: Обычное и ясное соответствие слову אֵל в этом контексте; вариант «Сильный» был бы неестественным и мог бы неоправданно сместить акцент.
- source_word: כִּי
  choice: когда
  rationale: Союз допускает несколько значений, но здесь временное «когда» наиболее естественно связывает вопрос с наступлением беды. Условное значение сохранено в сноске.
- source_word: תָבוֹא עָלָיו
  choice: постигнет его
  rationale: Буквально речь идёт о беде, которая «приходит на него». Русское «постигнет его» естественно передаёт эту образность и значение внезапно наступающего несчастья.
- source_word: צָרָה
  choice: беда
  rationale: צָרָה означает бедствие, тяготу или несчастье. «Беда» — естественное и достаточно широкое русское слово, не сужающее смысл до внутреннего переживания или крупной катастрофы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторический вопрос сохранён; синтаксис краток и естественен. «Вопль» передаёт интенсивность обращения, а «постигнет его беда» идиоматично воспроизводит еврейскую конструкцию «беда придёт на него».
