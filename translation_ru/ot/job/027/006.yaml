  text: I hold fast to my righteousness and will not let it go[b][a]; my heart does not reproach me for any of my days.
translation:
  language: ru
  text: Я твёрдо держусь своей праведности[a] и не отступлюсь от неё; сердце моё не укоряет меня во все дни моей жизни.[b]
