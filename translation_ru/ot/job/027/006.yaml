    reason: ambiguity
lexical_decisions:
- source_word: בְּצִדְקָתִי
  choice: своей праведности
  rationale: צִדְקָה обычно означает «праведность», «правоту». В контексте Иова слово также сближается с понятием непорочности, однако «праведность» лучше сохраняет нравственно-судебный оттенок его заявления.
- source_word: הֶחֱזַקְתִּי
  choice: я твёрдо держусь
  rationale: Порода hifil глагола חזק передаёт крепкое удерживание. Настоящее время естественно выражает продолжающуюся решимость Иова, заключённую здесь в еврейском перфекте.
- source_word: וְלֹא אַרְפֶּהָ
  choice: и не отступлюсь от неё
  rationale: Глагол רפה в hifil означает ослабить хватку, отпустить или оставить; суффикс женского рода указывает на «праведность». Русское «не отступлюсь» естественно передаёт твёрдый отказ отказаться от своей правоты.
- source_word: לֹא יֶחֱרַף לְבָבִי
  choice: сердце моё не укоряет меня
  rationale: חרף может означать укорять, поносить или насмехаться. При подлежащем «сердце» выражение обозначает внутреннее самоосуждение; «сердце» сохранено вместо более толковательного «совесть».
- source_word: מִיָּמָי
  choice: ни за один из моих дней
  rationale: В сочетании с отрицанием מן + ימים допускает смысл «ни за один день моей жизни» или «во все мои дни». Выбранная формулировка связывает внутренний укор с прожитыми днями, не делая русский стих тяжеловесным.
theological_decisions:
- issue: Передавать ли צִדְקָה как «праведность» или как «непорочность».
  choice: праведность
  alternative: непорочность
  rationale: «Праведность» сохраняет обычный нравственно-судебный смысл еврейского существительного и силу заявления Иова. «Непорочность» возможна в данном контексте, но несколько смещает акцент к личной цельности.
- issue: Понимать ли последнюю строку как отсутствие укоров за отдельные прожитые дни или как отсутствие укоров на протяжении всей жизни.
  choice: не укоряет меня ни за один из моих дней
  alternative: не укоряет меня во все мои дни
  rationale: Еврейское מִיָּמָי кратко и допускает обе смысловые связи. Основной текст отражает чтение «ни за один из дней моей жизни», а примечание сохраняет временное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Сохранён образ сердца как средоточия внутренней оценки; избегнута интерпретирующая замена словом «совесть». Местоимение «своей» делает русскую конструкцию естественной, а «твёрдо держусь» воспроизводит образ крепкой хватки.
