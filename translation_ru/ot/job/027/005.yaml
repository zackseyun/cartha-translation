base_translation:
  language: en
  yaml_path: translation/ot/job/027/005.yaml
  text: Far be it from me to declare you right[a]; until I die[b], I will not remove my integrity from myself.
translation:
  language: ru
  text: Не бывать тому, чтобы я признал вас правыми[a]! Пока не умру, не откажусь от своей непорочности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оправдал вас», «объявил вас правыми». Еврейский глагол здесь означает признать или объявить кого-либо правым.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нравственной цельности». Буквально: «не удалю от себя моей непорочности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Не бывать тому
  rationale: Устойчиво и выразительно передаёт решительное отвержение мысли, не воспроизводя буквально лежащее в основе выражения представление об осквернении.
- source_word: אִם אַצְדִּיק אֶתְכֶם
  choice: чтобы я признал вас правыми
  rationale: 'Каузативная форма צדק здесь имеет судебно-оценочный смысл: признать или объявить кого-либо правым. Формулировка понятна современному читателю и не привносит специальной богословской терминологии.'
- source_word: עַד אֶגְוָע
  choice: Пока не умру
  rationale: Прямо и естественно передаёт значение глагола גוע — умереть, испустить дух.
- source_word: לֹא אָסִיר
  choice: не откажусь
  rationale: Идиоматично передаёт решимость Иова не удалить от себя и не оставить свою непорочность; буквальное «не удалю от себя» по-русски звучит неестественно.
- source_word: תֻּמָּתִי
  choice: своей непорочности
  rationale: Передаёт нравственную цельность и безупречность, на которой Иов настаивает в своей защите, не подменяя её более узким понятием невиновности.
- source_word: מִמֶּנִּי
  choice: не откажусь от своей
  rationale: Возвратный оттенок еврейского «от меня» естественно выражен русской конструкцией с субъектом первого лица и притяжательным местоимением «своей».
theological_decisions:
- issue: Характер утверждения Иова о своём нравственном состоянии
  choice: своей непорочности
  alternative: своей невиновности; своей праведности; своей нравственной цельности
  rationale: «Непорочность» сохраняет заявление Иова о безупречности и цельности его поведения в контексте спора, но не превращает его слова в отвлечённое утверждение об абсолютной безгрешности и не вносит позднейшие догматические категории.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для торжественной клятвенной речи. Первая фраза передаёт резкое неприятие, а вторая — непреклонную решимость; синтаксис остаётся ясным для широкого круга читателей.
