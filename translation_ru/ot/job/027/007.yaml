  text: יְהִ֣י כְ֭/רָשָׁע אֹ֣יְבִ֑/י וּ/מִתְקוֹמְמִ֥/י כְ/עַוָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/007.yaml
  text: May my enemy be like the wicked[a], and the one who rises against me like the unrighteous.
translation:
  language: ru
  text: Пусть мой враг будет как нечестивец, и тот, кто восстаёт против меня, — как неправедный.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: Пусть … окажется
  rationale: Юссив Qal от היה выражает пожелание, здесь с оттенком воздаяния. «Пусть … окажется» естественно передаёт волитивную силу и не уточняет сверх текста, идёт ли речь о признании, участи или положении врага.
- source_word: כְרָשָׁע
  choice: подобен нечестивцу
  rationale: Префикс כְּ обозначает сравнение, а רָשָׁע — человека, характеризуемого нечестием. Единственное число «нечестивцу» соответствует форме оригинала и звучит естественно в русском параллелизме.
- source_word: אֹיְבִי
  choice: мой враг
  rationale: Существительное אֹיֵב с суффиксом первого лица единственного числа прямо означает «мой враг».
- source_word: וּמִתְקוֹמְמִי
  choice: и восстающий против меня
  rationale: Причастная форма от קום обозначает того, кто поднимается или выступает против говорящего. Развёрнутый перевод сохраняет глагольный образ, в отличие от более общего «противник».
- source_word: כְעַוָּל
  choice: неправедному
  rationale: עַוָּל обозначает человека, совершающего неправду или характеризуемого неправедностью. «Неправедному» сохраняет нравственный смысл и параллель с «нечестивцу».
theological_decisions:
- issue: Характер высказывания о враге
  choice: Сохранено пожелание без пояснения конкретной участи врага
  alternative: Передать как прямое проклятие или как утверждение, что враг уже нечестив
  rationale: Юссив выражает пожелание, однако сам стих не уточняет форму последствий и не отождествляет врага с нечестивцем напрямую; сравнительные כְּ сохранены.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. Лексика достоинственная и понятная; причастный оборот передаёт образ еврейского глагола. Маркеры сносок отсутствуют, поскольку отдельная сноска для русского текста не требуется.
