  edition: WLC
  text: יִשָּׂאֵ֣/הוּ קָדִ֣ים וְ/יֵלַ֑ךְ וִֽ֝/ישָׂעֲרֵ֗/הוּ מִ/מְּקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/021.yaml
  text: The east wind carries him away[a], and he is gone; it sweeps him away from his place.
translation:
  language: ru
  text: 'Восточный ветер уносит его — и его уже нет;

    сметает его с места[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вихрем уносит его с его места».'
    reason: Лексема סער может подчёркивать действие бури или вихря; вариант сохраняет эту образность более явно.
lexical_decisions:
- source_word: יִשָּׂאֵהוּ
  choice: уносит его
  rationale: Глагол נשׂא означает «поднимать, нести»; в контексте разрушительного ветра «уносит» естественно передаёт насильственное удаление.
- source_word: קָדִים
  choice: восточный ветер
  rationale: קָדִים часто обозначает иссушающий и разрушительный ветер с востока, а не просто направление.
- source_word: וְיֵלַךְ
  choice: и его уже нет
  rationale: Буквально «и он уходит»; в данном параллелизме выражение передаёт результат действия ветра и естественно звучит по-русски.
- source_word: וִישָׂעֲרֵהוּ
  choice: сметает его
  rationale: Форма от סער передаёт бурное, стремительное увлечение прочь. «Сметает» сохраняет силу образа и хорошо сочетается с действием ветра; связь с вихрем отражена в сноске.
- source_word: מִמְּקֹמוֹ
  choice: с места
  rationale: Точно и кратко передаёт «с его места»; принадлежность и так ясна благодаря местоимению «его».
theological_decisions: []
