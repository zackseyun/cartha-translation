lexical_decisions:
- source_word: וַיֹּסֶף
  choice: снова продолжил
  rationale: Глагол יסף означает «добавить, продолжить»; в сочетании с последующим инфинитивом здесь передаёт возобновление или продолжение речи. Сочетание «снова продолжил» сохраняет оба оттенка, хотя по-русски имеет лёгкую избыточность, соответствующую конструкции оригинала.
- source_word: שְׂאֵת
  choice: продолжил
  rationale: Буквально — «поднять, понести»; в сочетании שׂאת משל это идиома введения торжественной речи. По-русски буквальное «поднял свою речь» неестественно, поэтому смысл передан глаголом «продолжил» вместе с וַיֹּסֶף.
- source_word: מְשָׁלוֹ
  choice: свою речь
  rationale: מָשָׁל может обозначать притчу, изречение, поэтическую речь или пророческое слово. Здесь начинается развёрнутая поэтическая речь Иова, поэтому контекстуально естественно «речь»; широта значения отражена в сноске.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Обычная повествовательная форма אמר, вводящая прямую речь; сохранена стандартной русской формулой.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Традиционная и общепринятая русская форма личного имени.
