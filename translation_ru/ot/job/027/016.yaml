  yaml_path: translation/ot/job/027/016.yaml
  text: Though he heaps up silver like dust and prepares clothing like clay[b][a],
translation:
  language: ru
  text: Пусть он накопит серебра, как пыли, и заготовит одежды — как глины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если он накопит серебра, как пыли, и заготовит одежды — как глины». Еврейская частица אִם может иметь условное («если») или уступительное («пусть», «хотя») значение; уступительное лучше соответствует ходу мысли.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Пусть
  rationale: 'В поэтическом контексте частица вводит уступительное допущение: даже если нечестивый накопит богатство, дальнейшие стихи показывают его непрочность. Русское «пусть» естественно передаёт это значение.'
- source_word: יִצְבֹּר
  choice: накопит
  rationale: Глагол означает собирать в кучу, накапливать; «накопит» ясно выражает большое скопление и подходит к образу пыли.
- source_word: כֶּעָפָר
  choice: как пыли
  rationale: Сравнение передаёт гиперболический образ неисчислимого множества.
- source_word: כָּסֶף
  choice: серебра
  rationale: Сохранено конкретное значение «серебро», которое здесь также представляет богатство и деньги.
- source_word: וְכַחֹמֶר
  choice: как глины
  rationale: חֹמֶר здесь вероятнее всего означает глину — обычный и имеющийся в изобилии материал.
- source_word: יָכִין
  choice: наготовит
  rationale: Порода гифиль выражает приготовление; «наготовит» естественно передаёт заготовление большого количества одежды.
- source_word: מַלְבּוּשׁ
  choice: одежды
  rationale: Собирательное существительное обозначает одежду или одеяния; «одежды» понятно современному читателю и сохраняет собирательный смысл.
theological_decisions:
- issue: Условное или уступительное значение אִם
  choice: 'Уступительное допущение: «Пусть…»'
  alternative: 'Условное: «Если он накопит…»'
  rationale: 'Оба прочтения грамматически возможны, но уступительное лучше связано со следующим утверждением: накопленное нечестивым в итоге достанется другим. Альтернатива отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого поэтического параллелизма. «Наготовит» передаёт масштаб накопления без архаической окраски; образ глины сохранён без поясняющего истолкования.
