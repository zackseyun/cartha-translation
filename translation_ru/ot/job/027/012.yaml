  yaml_path: translation/ot/job/027/012.yaml
  text: Look[a], all of you have seen it; why then do you become vain?
translation:
  language: ru
  text: Вот, все вы сами это видели — зачем же вы так предаётесь тщете?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зачем же вы так тщетно поступаете?» Еврейский текст соединяет существительное и однокоренной глагол от корня הבל («тщета, пустота»), создавая усиленную игру слов, которую трудно полностью передать по-русски.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Естественная для современного русского языка частица, привлекающая внимание и подчёркивающая последующее утверждение.
- source_word: אַתֶּם כֻּלְּכֶם
  choice: вы все сами
  rationale: Передаёт и всеохватность כֻּלְּכֶם, и эмфатическое самостоятельное местоимение אַתֶּם.
- source_word: חֲזִיתֶם
  choice: видели
  rationale: Сохраняет прямое значение глагола «видеть, наблюдать»; русский прошедший вид естественно выражает уже состоявшееся наблюдение.
- source_word: וְלָמָּה זֶּה
  choice: так зачем же
  rationale: Передаёт выводный переход от увиденного к упрёку, а частица «же» естественно отражает усиление вопроса.
- source_word: הֶבֶל תֶּהְבָּלוּ
  choice: говорите пустое
  rationale: Контекст спора поддерживает речевой смысл, а «пустое» передаёт идею пустоты и тщетности; точную внутреннюю игру однокоренных слов по-русски воспроизвести трудно.
theological_decisions:
- issue: Относится ли הבל к речи, поведению или состоянию собеседников
  choice: 'В основном тексте: «говорите пустое»'
  alternative: «предаётесь пустоте» / «поступаете так тщетно»
  rationale: Ближайший контекст — бесплодные речи друзей Иова, однако еврейская конструкция допускает более широкий смысл; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; речь прямая, обличительная и dignified без архаизмов. Тире подчёркивает логический переход от общего наблюдения к вопросу-упрёку.
