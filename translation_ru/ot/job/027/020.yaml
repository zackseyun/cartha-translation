  yaml_path: translation/ot/job/027/020.yaml
  text: Terrors overtake him like waters[b][a]; in the night a storm steals him away.
translation:
  language: ru
  text: Ужасы настигают его, словно воды[a]; ночью буря[b] похищает его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно потоки».'
