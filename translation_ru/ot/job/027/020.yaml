    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: настигают его
  rationale: Форма породы hифиль от נשׂג передаёт образ бедствий, которые догоняют человека; «настигают его» естественно звучит по-русски и сохраняет этот образ.
- source_word: כַמַּיִם
  choice: словно воды
  rationale: Множественное число «воды» отражает форму древнееврейского текста и образ неудержимой, затопляющей силы; более истолковывающее «словно потоки» вынесено в примечание.
- source_word: בַּלָּהוֹת
  choice: ужасы
  rationale: Слово обозначает ужасы, внезапно повергающие в страх бедствия; «ужасы» кратко и точно передаёт смысл в данном поэтическом контексте.
- source_word: לַיְלָה
  choice: ночью
  rationale: Существительное употреблено обстоятельственно; «ночью» — современная и точная русская передача.
- source_word: גְּנָבַתּוּ
  choice: похищает его
  rationale: Глагол גנב буквально связан с кражей; при буре как подлежащем «похищает его» сохраняет образ внезапного унесения, подобного действию вора, и звучит естественно по-русски.
- source_word: סוּפָה
  choice: буря
  rationale: Слово обозначает сильную бурю или tempest; «буря» ясно и без излишнего уточнения передаёт основное значение, тогда как «ураган» и «вихрь» конкретнее.
