  text: כִּֽי כָל ע֣וֹד נִשְׁמָתִ֣/י בִ֑/י וְ/ר֖וּחַ אֱל֣וֹהַּ בְּ/אַפִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/003.yaml
  text: For as long as my breath is still in me[a], and the spirit of God is in my nostrils,
translation:
  language: ru
  text: Ибо пока во мне ещё есть дыхание и в моих ноздрях — дыхание Бога[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух Бога — в моих ноздрях». Еврейское רוּחַ может означать «дыхание», «ветер» или «дух».'
    reason: Лексическая многозначность רוּחַ и связанная с ней богословская неоднозначность.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит торжественное утверждение Иова и связывает его с последующей клятвенной речью; «ибо» сохраняет эту смысловую связь, не сводя её к строго причинной.
- source_word: כָל עוֹד
  choice: всё то время, пока ... остаётся
  rationale: 'Сочетание выражает непрерывную длительность: «всё время, пока ещё». Такой оборот естественен по-русски и передаёт оба компонента еврейского выражения.'
- source_word: נִשְׁמָתִי
  choice: во мне остаётся дыхание
  rationale: נשמה здесь означает дыхание, поддерживающее жизнь. Перестройка фразы делает русский текст естественным, сохраняя образ пребывающего в человеке дыхания.
- source_word: בִי
  choice: во мне
  rationale: Предлог указывает на внутреннее пребывание дыхания.
- source_word: וְרוּחַ
  choice: и ... дыхание
  rationale: רוּחַ может означать дыхание, ветер или дух. Параллелизм с נשמה и упоминание ноздрей делают «дыхание» наиболее вероятным в данном контексте; вариант «Дух» сохранён в сноске.
- source_word: אֱלוֹהַּ
  choice: Бога
  rationale: Единственное число обозначения Божества, особенно характерное для книги Иова; обычное русское «Бог» точно передаёт смысл.
- source_word: בְּאַפִּי
  choice: в моих ноздрях
  rationale: Здесь אַף имеет прямое телесное значение — нос или ноздри; множественное «ноздри» естественно передаёт конкретный образ дыхания.
theological_decisions:
- issue: Значение רוּחַ אֱלוֹהַּ в параллелизме с נִשְׁמָתִי
  choice: дыхание Бога
  alternative: Дух Бога
  rationale: 'Контекст говорит о продолжающейся телесной жизни: дыхание находится в человеке и в его ноздрях. Поэтому основным выбран конкретный смысл «дыхание Бога», однако богословски значимая возможность «Дух Бога» не устранена и отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Конкретный образ дыхания и ноздрей сохранён; тире подчёркивает поэтический параллелизм. Конечная запятая показывает, что предложение продолжается в следующем стихе.
