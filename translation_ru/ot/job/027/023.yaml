lexical_decisions:
- source_word: יִשְׂפֹּק
  choice: хлопает
  rationale: Глагол שׂפק в сочетании с כפים обозначает удар ладонями, то есть хлопанье; перевод сохраняет конкретный жест, не уточняя его значение как насмешку, торжество или изумление.
- source_word: עָלֵימוֹ
  choice: над ним
  rationale: Предлог על допускает значения «над», «на» и «против». В сочетании с хлопаньем «над ним» естественно по-русски и не конкретизирует оттенок жеста сверх исходного текста.
- source_word: כַפֵּימוֹ
  choice: в ладоши
  rationale: כף буквально означает «ладонь», а форма с суффиксом указывает на руки действующего лица. Русское устойчивое выражение «хлопать в ладоши» естественно передаёт образ.
- source_word: וְיִשְׁרֹק
  choice: освистывает
  rationale: Глагол שרק может обозначать свист или шипение. «Освистывает» естественно передаёт направленный на человека враждебный свист, тогда как буквальная альтернатива отмечена в сноске.
- source_word: עָלָיו
  choice: его
  rationale: При русском глаголе «освистывать» направленность, выраженная על, естественно передаётся прямым дополнением.
- source_word: מִמְּקֹמוֹ
  choice: со своего места
  rationale: מקום имеет широкое значение «место». Возвратное «своего» связывает суффикс с невыраженным деятелем и не уточняет, идёт ли речь о местонахождении или жилище.
theological_decisions:
- issue: Кто является субъектом действий
  choice: Сохранён единичный субъект в форме третьего лица без его отождествления с Богом, людьми или какой-либо силой.
  alternative: Назвать субъектом Бога, людей, восточный ветер или безличную силу.
  rationale: В еврейском тексте стоят глаголы третьего лица мужского рода единственного числа, но явного подлежащего нет. Местоимение «он» в русском тексте отражает грамматическое число и род, не разрешая неоднозначность; она поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с конкретной и ясной образностью. Выражения «хлопает в ладоши» и «освистывает» естественны для обычного читателя; синтаксис сохраняет краткость и напряжённость еврейской строки.
