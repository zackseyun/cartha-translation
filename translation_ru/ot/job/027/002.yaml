    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אֵל
  choice: Жив Бог
  rationale: Еврейское сочетание חַי с обозначением Бога представляет собой формулу клятвы. «Жив Бог» естественно сохраняет в русском языке её торжественную силу, не превращая формулу в простое описание Бога как живого.
- source_word: אֵל
  choice: Бог
  rationale: Здесь אֵל — обычное обозначение Бога в составе клятвенной формулы; транслитерация не требуется.
- source_word: הֵסִיר
  choice: лишивший
  rationale: Порода hифиль глагола סור означает «удалить, отнять, лишить». Причастный оборот естественно связывает эту характеристику Бога с начальной формулой клятвы.
- source_word: מִשְׁפָּטִי
  choice: меня справедливости
  rationale: מִשְׁפָּטִי допускает значения «мой суд», «моё право», «моё правое дело». Конструкция «лишивший меня справедливости» передаёт жалобу Иова на отказ в справедливом разбирательстве и при этом не сводит слово только к одному узкому юридическому значению.
- source_word: וְשַׁדַּי
  choice: и Всемогущий
  rationale: Божественный титул שַׁדַּי переведён традиционным и понятным русским соответствием «Всемогущий», что сохраняет параллелизм с «Бог».
- source_word: הֵמַר
  choice: сделавший горькой
  rationale: Hифиль от מרר значит «сделать горьким, ожесточить, причинить горечь». Выбранная передача сохраняет конкретную метафору исходного текста.
- source_word: נַפְשִׁי
  choice: мою душу
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека. «Мою душу» соответствует поэтическому строю книги и сохраняет образность, не устраняя смысловую широту слова.
theological_decisions:
- issue: Передача божественных обозначений אֵל и שַׁדַּי
  choice: Бог ... Всемогущий
  alternative: Бог ... Шаддай
  rationale: אֵל и שַׁדַּי здесь выступают как обозначение и титул Бога. Их перевод сохраняет понятный смысл и торжественный параллелизм, не вводя транслитерацию там, где она не необходима.
- issue: Резкое утверждение Иова о Боге и справедливости
  choice: лишивший меня справедливости
  alternative: не оправдавший меня / лишивший меня права
  rationale: Текст прямо вкладывает в уста Иова обвинительно звучащую клятву. Перевод сохраняет эту богословскую напряжённость и не смягчает её пояснением, будто речь идёт лишь о субъективном ощущении Иова.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Сохранена формула клятвы и незавершённость синтаксиса стиха, продолжающегося в следующем стихе; поэтому в конце поставлена запятая.
