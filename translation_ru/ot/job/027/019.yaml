  text: He lies down rich[a], but he will not be gathered; he opens his eyes[b], and he is gone.
translation:
  language: ru
  text: Богатым он ложится, но не будет собран[a]; открывает глаза — и его нет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будет собран». Это краткое выражение может намекать на смерть, погребение или присоединение к предкам, но прямо этого не уточняет.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и нет его» — выражение, означающее, что он исчез или его больше нет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: богатым
  rationale: Прилагательное употреблено субстантивно или предикативно. Творительный «богатым» сохраняет сжатость еврейской строки и не добавляет существительного «человек».
- source_word: יִשְׁכַּב
  choice: ложится
  rationale: Основное значение שׁכב — «ложиться, лежать». Настоящее историческое передаёт живость поэтического описания и допускает контекстуальную направленность в будущее.
- source_word: וְלֹא יֵאָסֵף
  choice: но не будет погребён
  rationale: Нифаль от אסף буквально означает «быть собранным» и может эвфемистически относиться к смерти и погребению. В современном русском буквальное «не будет собран» здесь не передаёт смысла; «не будет погребён» естественно выражает вероятный контекстуальный оттенок, а неоднозначность отмечена в сноске.
- source_word: עֵינָיו פָּקַח
  choice: открывает глаза
  rationale: Естественный русский порядок слов сохраняет резкий переход и образность оригинала.
- source_word: וְאֵינֶנּוּ
  choice: и его уже нет
  rationale: Буквально «и нет его» — устойчивое выражение исчезновения или смерти. Частица «уже» естественно подчёркивает внезапность, не уточняя способ исчезновения.
theological_decisions:
- issue: Значение «не будет собран» в связи со смертью
  choice: В основном тексте передать как «не будет погребён», сохранив неопределённость в сноске.
  alternative: «не будет приобщён к предкам» или буквально «не будет собран»
  rationale: Еврейская формулировка кратка и может намекать на смерть, погребение либо приобщение к умершим предкам, не называя этого прямо. Перевод не должен превращать возможную аллюзию в определённое учение о посмертной участи.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Тире перед заключительной фразой передаёт внезапность исчезновения. Формулировка избегает архаического «почил» и чрезмерно буквального, неясного по-русски «не будет собран».
