  text: אִם יִרְבּ֣וּ בָנָ֣י/ו לְמוֹ חָ֑רֶב וְ֝/צֶאֱצָאָ֗י/ו לֹ֣א יִשְׂבְּעוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/027/014.yaml
  text: If his sons multiply[a], it is for the sword, and his descendants will not be satisfied with bread.
translation:
  language: ru
  text: Если его сыновья умножатся, их ждёт меч, а его потомки не насытятся хлебом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет условное значение и структуру «условие — следствие».
- source_word: יִרְבּוּ בָנָיו
  choice: умножатся его сыновья
  rationale: Передаёт значение увеличения числа и сохраняет явно мужское множественное число בָּנָיו.
- source_word: לְמוֹ חָרֶב
  choice: то для меча
  rationale: Кратко сохраняет образ меча и значение предназначенности или исхода, не раскрывая его однозначно как войну либо насильственную смерть.
- source_word: וְצֶאֱצָאָיו
  choice: и его потомки
  rationale: צֶאֱצָאִים обозначает потомство шире непосредственных сыновей; «потомки» естественно звучит по-русски.
- source_word: לֹא יִשְׂבְּעוּ לָחֶם
  choice: не насытятся хлебом
  rationale: Близко передаёт שבע «насыщаться» и сохраняет конкретный образ хлеба, подразумевающий недостаток пищи.
theological_decisions:
- issue: Характер участи сыновей, обозначенной выражением «для меча»
  choice: Сохранён буквальный и несколько сжатый образ «для меча»
  alternative: «обречены на меч» / «погибнут от меча»
  rationale: Еврейский текст выражает предназначенность или итог, но не формулирует явно глагол гибели; буквальный образ сохраняет напряжение и не усиливает утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи Иова. Синтаксическая сжатость второй части условной конструкции сохранена намеренно; архаизмы исключены.
