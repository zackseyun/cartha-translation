  text: וְֽ/אוּלָ֗ם כֻּלָּ֣/ם תָּ֭שֻׁבוּ וּ/בֹ֣אוּ נָ֑א וְ/לֹֽא אֶמְצָ֖א בָ/כֶ֣ם חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: ru
  text: Но вы все, вернитесь и придите же; не найду я среди вас мудрого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: Но
  rationale: Передаёт сильное противопоставление естественным для современного русского союзом.
- source_word: כֻּלָּם
  choice: вы все
  rationale: Формы второго лица множественного числа показывают, что Иов прямо обращается ко всем своим собеседникам.
- source_word: תָּשֻׁבוּ
  choice: вернитесь
  rationale: 'Форма от שוב в данном контексте звучит как побуждение: Иов призывает собеседников вновь выступить со своими доводами.'
- source_word: וּבֹאוּ נָא
  choice: и подойдите же
  rationale: בוא с частицей נָא выражает настойчивый призыв; «же» сохраняет его силу, не придавая словам излишне вежливого оттенка. «Подойдите» позволяет естественно передать повторное движение после «вернитесь».
- source_word: וְלֹא אֶמְצָא
  choice: не найду я
  rationale: Имперфект естественно передаёт ожидаемый результат после призыва; порядок слов подчёркивает категоричность вывода, не добавляя значения неспособности.
- source_word: בָכֶם
  choice: среди вас
  rationale: Предлог обозначает нахождение внутри группы адресатов; это наиболее естественная русская формулировка.
- source_word: חָכָם
  choice: мудрого
  rationale: Мужской род единственного числа употреблён субстантивно и относится к мужчинам — собеседникам Иова; в русском эллиптическая форма «мудрого» естественно означает «мудрого человека».
theological_decisions:
- issue: Род и субстантивное употребление חָכָם
  choice: мудрого
  alternative: кого-либо мудрого / мудрого человека
  rationale: Сохранён мужской род исходного текста и связь с конкретными собеседниками Иова; при этом естественная русская эллиптическая конструкция не вносит дополнительных смысловых уточнений.
- issue: Смысл последовательности תָּשֻׁבוּ וּבֹאוּ נָא
  choice: вернитесь и подойдите же
  alternative: снова приступайте / возвратитесь и придите
  rationale: Сохранены два еврейских глагола движения и настойчивость призыва, но не закреплено однозначно, идёт ли речь о физическом возвращении или о новом раунде спора.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Инверсия «не найду я» поддерживает выразительность и категоричность реплики, оставаясь понятной. Тире после «вы все» отмечает прямой настойчивый вызов; точка с запятой сохраняет тесную причинно-результативную связь частей.
