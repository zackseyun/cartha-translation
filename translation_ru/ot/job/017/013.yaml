lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет условную или гипотетическую силу еврейской частицы и не превращает её без необходимости во временное «когда».
- source_word: אֲקַוֶּה
  choice: я надеюсь
  rationale: 'Передаёт выжидательное ожидание, выраженное глаголом קוה, и сохраняет напряжённую многозначность: речь не обязательно о радостной надежде, а об ожидаемой перспективе.'
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет широкий древнееврейский образ области мёртвых и не сужает значение до физической могилы.
- source_word: בֵּיתִי
  choice: станет моим домом
  rationale: Естественно раскрывает безглагольное соотношение «шеол — мой дом» в рамках условной конструкции, не меняя её основного смысла.
- source_word: בַּחֹשֶׁךְ
  choice: во тьме
  rationale: Естественная русская передача образа тьмы, связанного в контексте со смертью и шеолом.
- source_word: רִפַּדְתִּי
  choice: расстилаю
  rationale: Сохраняет конкретный образ приготовления ложа; настоящее время по-русски естественно продолжает условное размышление, хотя еврейская форма формально перфектная.
- source_word: יְצוּעָי
  choice: себе постель
  rationale: «Постель» — понятное современное соответствие месту для лежания; возвратное «себе» естественно передаёт притяжательное значение «мою» при глаголе приготовления.
theological_decisions:
- issue: Интерпретационная передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: «Шеол» сохраняет смысловой диапазон еврейского понятия и не сводит его только к месту погребения и не отождествляет с позднейшими разработанными представлениями о загробном мире.
- issue: Эмоциональный оттенок אֲקַוֶּה
  choice: надеюсь
  alternative: жду; ожидаю
  rationale: Выбор сохраняет обычную силу קוה, но контекст не позволяет понимать надежду непременно как положительное чувство; мрачная напряжённость остаётся открытой.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. «Шеол» оставлен как библейский термин и пояснён в сноске. Запятая в конце отражает незавершённость синтаксиса и продолжение мысли в следующем стихе.
