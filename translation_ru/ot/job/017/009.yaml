  text: וְ/יֹאחֵ֣ז צַדִּ֣יק דַּרְכּ֑/וֹ וּֽ/טֳהָר יָ֝דַ֗יִם יֹסִ֥יף אֹֽמֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/009.yaml
  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: ru
  text: Но праведник твёрдо держится своего пути, и тот, чьи руки чисты, становится всё сильнее.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прибавляет силу»; возможны также переводы: «укрепляется» или, в более узком смысле, «набирается мужества».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: Но ... твёрдо держится
  rationale: Союз וְ допускает простое «и», однако после мрачного описания Иова имеет лёгкий противительный оттенок. Глагол אחז буквально означает «схватить, держать» и здесь передаёт стойкое следование избранному пути.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе обозначает праведного человека как тип; русское «праведник» естественно и не добавляет лишних уточнений.
- source_word: דַּרְכּוֹ
  choice: своего пути
  rationale: דֶּרֶךְ может означать путь, образ жизни или жизненный курс. «Своего пути» сохраняет как конкретный образ, так и переносный смысл; возвратное местоимение естественно при русском подлежащем.
- source_word: וּטֳהָר יָדַיִם
  choice: и тот, чьи руки чисты
  rationale: Фраза буквально сохраняет образ чистых рук как выражение невиновности и нравственной чистоты и при этом звучит естественно по-русски.
- source_word: יֹסִיף אֹמֶץ
  choice: становится всё сильнее
  rationale: Конструкция буквально означает «прибавляет силу». Выбранная формулировка естественно передаёт нарастание силы или стойкости, не сужая אֹמֶץ исключительно до мужества.
