  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: ru
  text: Ибо Ты сокрыл их сердца от разумения[a]; потому не возвысишь их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их сердце». В еврейской речи «сердце» — не только область чувств, но и средоточие мысли, воли и способности понимать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не поднимешь их», «не дашь им восторжествовать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание последующего вывода; «ибо» естественно сохраняет причинно-пояснительную связь и поэтический регистр.
- source_word: לִבָּם
  choice: их сердце
  rationale: Сохранён еврейский образ сердца как внутреннего средоточия мысли, воли и способности различать; единственное число соответствует форме оригинала.
- source_word: צָפַנְתָּ
  choice: Ты сокрыл
  rationale: Глагол означает «скрыть, утаить, держать сокрытым». «Сокрыл» сохраняет прямое действие Бога и возвышенный, но понятный поэтический регистр.
- source_word: מִשָּׂכֶל
  choice: от разумения
  rationale: Предлог מִן выражает удаление или отделение, а שׂכל здесь обозначает понимание, проницательность, способность здраво судить.
- source_word: עַל כֵּן
  choice: потому
  rationale: Передаёт вывод, прямо связывающий вторую строку с первой.
- source_word: לֹא תְרֹמֵם
  choice: не возвысишь их
  rationale: Форма от רום передаёт поднятие или возвышение. Перевод сохраняет образ и не уточняет без необходимости, означает ли он почёт, успех или торжество.
theological_decisions:
- issue: К кому относятся формы «их»
  choice: Сохранить местоименное обозначение без уточнения группы.
  alternative: Назвать их противниками Иова или их сторонниками.
  rationale: Глаголы второго лица обращены к Богу, а формы третьего лица множественного числа указывают на иную группу, однако сам стих её прямо не называет. Уточнение внесло бы толкование в основной текст.
- issue: Характер Божьего действия в первой строке
  choice: 'Передать прямо: «Ты сокрыл».'
  alternative: 'Смягчить до допущения: «Ты допустил, чтобы они не понимали».'
  rationale: Еврейский текст прямо приписывает действие Богу; перевод сохраняет эту богословскую напряжённость и не заменяет её объяснением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. «Сокрыл» и «разумение» выбраны для точной передачи краткой образности оригинала; синтаксис оставлен сжатым, а неоднозначность глагола רום вынесена в примечание.
