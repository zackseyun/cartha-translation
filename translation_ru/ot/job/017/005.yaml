  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: ru
  text: Кто выдаёт друзей ради доли[a], у того изнемогут глаза его детей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради части», «ради выгоды»; по другому толкованию: «льстит друзьям». Еврейский оборот труден для понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחֵלֶק
  choice: ради своей доли
  rationale: חֵלֶק обычно означает «доля, часть, удел». В этом трудном контексте оборот, вероятно, указывает на личную выгоду; «ради своей доли» сохраняет основное значение существительного, не добавляя прямо отсутствующего в еврейском тексте слова «добыча».
- source_word: יַגִּיד
  choice: предаёт
  rationale: Hифиль от נגד буквально означает «сообщает, объявляет». В сочетании с «друзьями» и мотивом личной выгоды здесь подразумевается донос или выдача друзей; «предаёт» естественно передаёт отрицательную силу контекста, не ограничивая смысл судебной процедурой.
- source_word: רֵעִים
  choice: друзей
  rationale: רֵעִים означает «друзья, товарищи»; «друзей» ясно передаёт личные отношения и остроту предательства.
- source_word: וְעֵינֵי בָנָיו
  choice: у того глаза детей
  rationale: בנים может обозначать как сыновей, так и детей вообще. «Детей» сохраняет возможную широту значения; конструкция «у того» естественно связывает местоименный суффикс с человеком из первой половины стиха.
- source_word: תִּכְלֶנָה
  choice: изнемогут
  rationale: כלה может означать «иссякнуть, истощиться, угаснуть». При подлежащем «глаза» слово «изнемогут» сохраняет образ истощения и напряжённого ожидания, не сводя его исключительно к потере зрения.
theological_decisions:
- issue: Связь между поступком человека и участью его детей
  choice: Сохранено прямое следование двух частей стиха без объяснения механизма воздаяния.
  alternative: Истолковать вторую часть как явное Божье наказание детям за поступок отца.
  rationale: Еврейский текст утверждает, что глаза его детей изнемогут, но не называет прямо действующее лицо и не разъясняет причинную связь; перевод не должен добавлять богословское объяснение.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранена суровость высказывания и отмечена лексическая неясность первой строки.
