lexical_decisions:
- source_word: בַּדֵּי
  choice: к засовам
  rationale: В сочетании с «шеолом» слово, вероятнее всего, обозначает засовы или запоры и создаёт поэтический образ замкнутого царства мёртвых; возможное значение «части» отмечено в сноске.
- source_word: שְׁאֹל
  choice: шеола
  rationale: Транслитерация сохраняет широкий древнееврейский смысл — царство мёртвых, — не сводя его только к отдельной могиле.
- source_word: תֵּרַדְנָה
  choice: Сойдут ли они
  rationale: Форма женского рода множественного числа, вероятно, отсылает к упомянутым ранее надежде и ожиданию Иова. Вопросительная передача соответствует риторическому контексту.
- source_word: אִם
  choice: ли
  rationale: Хотя обычно слово означает «если», здесь оно вводит вопросительную или условно-вопросительную вторую строку; русская частица «ли» естественно передаёт эту функцию.
- source_word: יַחַד
  choice: Вместе
  rationale: Сохранено прямое значение наречия и мысль о совместном нисхождении.
- source_word: עַל עָפָר
  choice: в прах
  rationale: Буквально предлог может означать «на, над», но при образе нисхождения к смерти русское «в прах» естественно передаёт направленность движения.
- source_word: נָחַת
  choice: низойдём
  rationale: Выбрано значение нисхождения, поддерживающее параллелизм с תֵּרַדְנָה. Возможное понимание как покоя сохранено в сноске.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; царство мёртвых
  rationale: Транслитерация не отождествляет шеол исключительно с физической могилой и не добавляет позднейших представлений о загробной участи.
- issue: Неясность заключительной строки
  choice: Вместе ли мы низойдём в прах?
  alternative: Вместе ли мы упокоимся во прахе?
  rationale: Основной текст сохраняет параллельный образ нисхождения, а сноска удерживает древнюю и распространённую альтернативу «покой», не разрешая неоднозначность молча.
translation_notes:
  register: Современный литературный русский язык с лаконичной поэтической формой. «Низойдём» выбрано как уместное для возвышенной поэзии, но понятное современному читателю; термин «шеол» сохранён без конфессионального истолкования.
