  text: Поистине, со мной насмешники[a], и взор мой неотступно обращён к их вызывающему поведению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обманщики»; еврейское слово может обозначать людей, которые насмехаются или обманывают.'
    reason: lexical_alternative
  - marker: b
