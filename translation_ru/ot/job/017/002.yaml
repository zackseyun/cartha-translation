    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Поистине
  rationale: Сочетание употреблено как усилительное заверение, а не как обычное условие; «поистине» естественно передаёт его утвердительную силу.
- source_word: הֲתֻלִים
  choice: насмешники
  rationale: Слово обозначает людей, которые глумятся или насмехаются; в контексте враждебных речей собеседников Иова это наиболее уместное значение.
- source_word: עִמָּדִי
  choice: со мной
  rationale: Предлог указывает на присутствие рядом с говорящим; буквальное и естественное русское соответствие — «со мной».
- source_word: וּבְהַמְּרוֹתָם
  choice: на их дерзости
  rationale: Форма может обозначать вызывающее, непокорное или ожесточённое поведение. «Дерзость» передаёт провокационный характер поведения, не сводя его непременно к богословскому понятию мятежа.
- source_word: תָּלַן עֵינִי
  choice: взгляд мой неотступно задерживается
  rationale: Буквальный образ — «мой глаз ночует/остаётся». Русская формулировка сохраняет идею длительного, прикованного внимания, избегая неестественного выражения «глаз ночует».
