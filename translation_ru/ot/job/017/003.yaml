  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: ru
  text: Поручись, прошу, за меня перед Собой[a]; кто ещё поручится за меня, ударив по рукам[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дай за меня залог у Тебя». В еврейском тексте употреблён юридический язык залога или поручительства.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кто он, кто ударит по моей руке?» Ударом по рукам подтверждали соглашение или поручительство.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה נָּא
  choice: Предоставь же
  rationale: Императив שׂים передаёт действие помещения или предоставления, а частица נָא смягчает просьбу; «же» естественно выражает здесь настойчивую мольбу, не перегружая фразу разговорным «пожалуйста».
- source_word: עָרְבֵנִי
  choice: за меня залог
  rationale: Форма от ערב относится к поручительству или обеспечению обязательства; суффикс первого лица указывает, что Иов просит предоставить обеспечение за него.
- source_word: עִמָּךְ
  choice: у Себя
  rationale: Буквально «с Тобой / при Тебе». В контексте обращения к Богу выражение указывает, что залог должен находиться у Него; «у Себя» естественно передаёт напряжённую мысль о Боге как стороне, к которой обращена просьба.
- source_word: מִי הוּא
  choice: кто же ещё
  rationale: Риторический вопрос подразумевает отсутствие иного поручителя. Частицы «же ещё» естественно выявляют этот контраст, не превращая подразумеваемое в отдельное утверждение.
- source_word: לְיָדִי יִתָּקֵעַ
  choice: ударит со мной по рукам
  rationale: Буквально говорится об ударе по руке — жесте, которым подтверждали поручительство или соглашение. Русский оборот «ударить по рукам» сохраняет образ и одновременно остаётся понятной идиомой.
theological_decisions:
- issue: Юридическая метафора в обращении к Богу
  choice: Иов просит Бога предоставить за него залог у Самого Себя, поскольку иного поручителя нет.
  alternative: Иов просит Бога лишь назначить или предоставить некоего отдельного поручителя.
  rationale: Сочетание עָרְבֵנִי с עִמָּךְ связывает обеспечение непосредственно с Богом, однако образ намеренно сохраняет парадоксальность и не объясняется через позднейшую богословскую систему.
translation_notes:
  register: Современный литературный русский язык с сохранением юридического образа и риторического напряжения. Местоимение «Себя» написано с прописной буквы как относящееся к Богу; архаичные «порука» и «поручительствоваться» не использованы.
