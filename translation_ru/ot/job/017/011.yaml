  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: ru
  text: Дни мои миновали; замыслы мои оборваны — заветные желания моего сердца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достояние моего сердца», «то, чем дорожит моё сердце» или «наследие моего сердца». Еврейское выражение редкое и трудное для понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: дни мои
  rationale: Буквально передаёт существительное с суффиксом первого лица и сохраняет естественный для поэзии образ отпущенного человеку времени.
- source_word: עָבְרוּ
  choice: миновали
  rationale: Глагол совершенного вида передаёт завершённость действия и естественно сочетается в русском языке со словом «дни».
- source_word: זִמֹּתַי
  choice: замыслы мои
  rationale: Слово обозначает замыслы, намерения или планы; «замыслы» сохраняет поэтический регистр и не придаёт выражению обязательно отрицательного нравственного оттенка.
- source_word: נִתְּקוּ
  choice: оборваны
  rationale: Нифаль от נתק выражает отсечение, разрыв или отрыв. «Оборваны» передаёт насильственную незавершённость надежд и при этом звучит естественно по-русски.
- source_word: מוֹרָשֵׁי
  choice: заветные желания
  rationale: Редкое и трудное в данном контексте слово связано с представлением о достоянии или владении. В сочетании с «сердцем» перевод передаёт то, что сердце хранит и чем дорожит, не скрывая иных возможностей в сноске.
- source_word: לְבָבִי
  choice: моего сердца
  rationale: Сохраняет обычный библейский образ сердца как средоточия мыслей, стремлений и желаний.
