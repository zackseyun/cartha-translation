lexical_decisions:
- source_word: רוּחִי
  choice: дух мой
  rationale: רוּחַ может означать «дух» или «дыхание». В контексте плача «дух мой» естественно передаёт сломленность внутренней жизни Иова, не исключая оттенка угасающего жизненного дыхания, отмеченного в сноске.
- source_word: חֻבָּלָה
  choice: сломлен
  rationale: Страдательная форма выражает причинённое разрушение или повреждение. «Сломлен» звучит естественно по-русски применительно к духу и не уточняет сверх текста характер разрушения.
- source_word: יָמַי
  choice: дни мои
  rationale: Сохранено прямое значение множественного числа с притяжательным суффиксом — оставшиеся дни жизни Иова.
- source_word: נִזְעָכוּ
  choice: угасли
  rationale: Глагол несёт образ тушения или угасания. «Угасли» сохраняет метафору прекращающейся жизни и соответствует завершённому действию.
- source_word: קְבָרִים
  choice: могилы
  rationale: Множественное число оригинала сохранено, чтобы не сглаживать необычный и усилительный образ.
- source_word: לִי
  choice: ждут меня
  rationale: Буквально предлог означает «для меня» или «мне». В контексте «ждут меня» естественно выражает мысль, что впереди Иова остаются могилы; буквальная конструкция приведена в сноске.
