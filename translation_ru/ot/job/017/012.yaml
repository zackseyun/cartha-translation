  text: לַ֭יְלָה לְ/י֣וֹם יָשִׂ֑ימוּ א֝֗וֹר קָר֥וֹב מִ/פְּנֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/012.yaml
  text: They make night into day; they say, ‘Light is near,’ in the face of darkness.
translation:
  language: ru
  text: 'Они превращают ночь в день; перед лицом тьмы говорят: «Свет близок».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально во второй части: «свет близок перед лицом тьмы»; слова «говорят» в еврейском тексте нет.'
    reason: Отмечает внесённый для ясности глагол речи и сохраняет подлинную синтаксическую неоднозначность трудной еврейской фразы.
lexical_decisions:
- source_word: לַיְלָה לְיוֹם יָשִׂימוּ
  choice: Они превращают ночь в день
  rationale: Конструкция буквально означает «ночь делают/полагают днём». «Превращают» естественно передаёт резкое переименование или обращение ночи в день, не уточняя, идёт ли речь о надеждах Иова или о его собеседниках.
- source_word: אוֹר קָרוֹב
  choice: «Свет близок»
  rationale: Сохранено прямое значение прилагательного קָרוֹב — «близок»; фраза оформлена как речь, хотя глагол речи в еврейском тексте подразумевается, а не выражен.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: перед лицом тьмы
  rationale: Передаёт пространственно-образную силу מִפְּנֵי и сохраняет напряжение между заявленной близостью света и наличной тьмой, не сводя оборот однозначно к причине или уступке.
theological_decisions:
- issue: Кто обозначен местоимением «они»
  choice: Сохранить неопределённое «они»
  alternative: Явно назвать надежды Иова либо его собеседников
  rationale: В самом стихе подлежащее выражено только формой глагола во множественном числе; ближайший контекст допускает разные способы соотнесения этого подлежащего.
- issue: Подразумеваемая прямая речь во второй половине стиха
  choice: 'Передать как «говорят: „Свет близок“»'
  alternative: 'Оставить бессоюзное утверждение: «свет близок перед лицом тьмы»'
  rationale: Так синтаксическая связь понятна современному читателю и соответствует вероятному смыслу, однако отсутствие глагола речи в оригинале отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, поэтически напряжённым синтаксисом. Образ «перед лицом тьмы» намеренно сохранён как возвышенный, но понятный оборот.
