  text: יָשֹׁ֣מּוּ יְשָׁרִ֣ים עַל זֹ֑את וְ֝/נָקִ֗י עַל חָנֵ֥ף יִתְעֹרָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: ru
  text: Праведные ужаснутся этому, и невиновный поднимется против нечестивца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицемера». Еврейское слово חָנֵף может обозначать нечестивого, непочтительного к Богу человека; традиционно его также переводят как «лицемер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: ужаснутся
  rationale: Форма от שׁמם передаёт потрясение и ужас. «Ужаснутся» естественно выражает сильную эмоциональную реакцию в данном контексте.
- source_word: יְשָׁרִים
  choice: праведные
  rationale: Субстантивированное прилагательное во множественном числе обозначает нравственно прямых людей. «Праведные» — ясное и устойчивое русское соответствие.
- source_word: עַל זֹאת
  choice: этому
  rationale: Сочетание указывает на причину или повод реакции; дательный падеж при «ужаснутся» естественно передаёт смысл «из-за этого, при виде этого».
- source_word: נָקִי
  choice: невиновный
  rationale: Слово обозначает человека, свободного от вины. «Невиновный» сохраняет нравственно-правовой оттенок и параллель с «праведными».
- source_word: חָנֵף
  choice: нечестивец
  rationale: Здесь слово обозначает безбожного, непочтительного к Богу человека. «Нечестивец» сохраняет широкий нравственно-религиозный смысл, не сужая его до одной лишь неискренности.
- source_word: יִתְעֹרָר
  choice: поднимется
  rationale: Возвратно-интенсивная форма от עור выражает побуждение себя к действию. В сочетании «поднимется против» русский текст естественно передаёт и активизацию, и противостояние.
- source_word: עַל חָנֵף
  choice: против нечестивца
  rationale: При глаголе пробуждения к действию עַל имеет значение направленного противостояния; «против» ясно выражает эту связь.
theological_decisions:
- issue: Передача חָנֵף
  choice: нечестивец
  alternative: лицемер
  rationale: 'В стихе противопоставлены нравственные категории: праведные и невиновный — нечестивцу. Основной вариант сохраняет широкий религиозно-нравственный смысл еврейского слова, тогда как «лицемер» может неоправданно сузить его до притворства.'
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Будущее время сохраняет форму и риторическую направленность еврейских имперфектов; единственное число «невиновный» и «нечестивец» воспроизводит собирательно-типологическое противопоставление оригинала.
