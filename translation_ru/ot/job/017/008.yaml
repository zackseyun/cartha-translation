  source_fidelity: 'Текст точно передаёт обе части еврейского стиха: יָשֹׁמּוּ — сильную потрясённую реакцию («ужаснутся»), עַל זֹאת — её повод («этому»), а יִתְעֹרָר — активное, возвратное побуждение к противостоянию («поднимется против»). Противопоставление «праведные / невиновный» и «нечестивец» сохранено. Будущие формы уместно отражают еврейские имперфекты, не устраняя их риторической перспективы.'
