  text: Он сделал меня притчей среди народов[a], и я стал тем, кому плюют в лицо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поговоркой среди народов». Еврейское слово обозначает притчу или поговорку; здесь, вероятно, имеется в виду предмет презрения, вошедший в поговорку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и плевком перед лицами я стал». Смысл, вероятно, в том, что Иов стал предметом открытого презрения и оплёвывания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: Он сделал меня
  rationale: Каузативная форма с суффиксом первого лица означает, что Бог поставил Иова в такое положение; «сделал меня» естественно вводит последующее сказуемое.
- source_word: לִמְשֹׁל
  choice: притчей
  rationale: Слово указывает на вошедший в поговорку пример, здесь — предмет всеобщего презрения. «Притчей» сохраняет связь с מָשָׁל и не устраняет образную неоднозначность.
- source_word: עַמִּים
  choice: среди народов
  rationale: Сохранено множественное число исходного текста; предлог передан естественным для русского языка оборотом.
- source_word: וְתֹפֶת
  choice: тем, кому плюют
  rationale: Редкое существительное, вероятно, обозначает плевок, оплёвывание либо предмет оплёвывания. Личная конструкция ясно передаёт образ публичного унижения, не заменяя его отвлечённым словом «позор».
- source_word: לְפָנִים
  choice: в лицо
  rationale: Буквально «перед лицами»; в контексте выражает открытое, направленное прямо на Иова презрение.
- source_word: אֶהְיֶה
  choice: я стал
  rationale: Имперфект в поэтическом контексте выражает наступившее и сохраняющееся состояние; прошедшее совершенного вида согласуется с параллельным «сделал меня».
