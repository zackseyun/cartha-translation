  rationale: כַּעַשׂ может обозначать гнев, досаду, раздражение или скорбь; в контексте страдания Иова естественно «горе», а неоднозначность сохранена в примечании.
- source_word: עֵינִי
  choice: мой глаз
  rationale: Сохранено единственное число еврейского текста; в поэтической речи «глаз» также может обозначать зрение.
- source_word: וִיצֻרַי
  choice: весь мой облик
  rationale: Редкая форма, вероятно, обозначает телесный вид, очертания или части тела Иова. «Весь мой облик» естественно согласуется с образом тени и сохраняет возможность собирательного понимания.
- source_word: כַּצֵּל
  choice: словно тень
  rationale: Сохраняет поэтическое сравнение, выражающее истощённость и бесплотность.
- source_word: כֻּלָּם
  choice: весь
  rationale: Еврейское «все они» относится к множественной или собирательной форме וִיצֻרַי; по-русски при выборе «облик» его значение естественно передаётся словом «весь».
