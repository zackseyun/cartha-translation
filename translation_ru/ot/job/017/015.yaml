  text: And where[a], then, is my hope? And my hope—who can see it?
translation:
  language: ru
  text: И где же надежда моя? И надежда моя — кто её увидит?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто может её увидеть?» Еврейский глагол означает «видеть», «взирать» или «созерцать», а форма может выражать как будущее действие, так и возможность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיֵּה אֵפוֹ
  choice: И где же
  rationale: «Где» передаёт вопрос о месте, союз «и» сохраняет связь с предшествующим плачем, а частица «же» естественно выражает усилительное или выводное значение אֵפוֹ.
- source_word: תִקְוָתִי
  choice: надежда моя
  rationale: תִּקְוָה здесь обозначает надежду или ожидание; «надежда» естественна в контексте плача Иова. Постпозиция местоимения придаёт строке поэтическую выразительность без архаизации.
- source_word: וְתִקְוָתִי
  choice: Надежда моя
  rationale: Повтор существительного сохранён ради смыслового нажима и поэтической структуры; начальный союз не воспроизведён отдельно, поскольку русское бессоюзное продолжение после вопроса естественно передаёт еврейский параллелизм.
- source_word: מִי
  choice: кто
  rationale: Прямое соответствие вопросительному местоимению.
- source_word: יְשׁוּרֶנָּה
  choice: её увидит
  rationale: Глагол שׁור значит «видеть, взирать, созерцать»; форма допускает простое будущее, а женский объектный суффикс относится к «надежде».
theological_decisions:
- issue: Значение имперфекта יְשׁוּרֶנָּה
  choice: 'будущее: «увидит»'
  alternative: 'модальное: «может увидеть»'
  rationale: Еврейская форма допускает как простой будущий, так и модальный смысл. Основной текст сохраняет прямую форму риторического вопроса, а альтернативное прочтение отмечено в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, повтора и риторической силы еврейской поэтической строки. Слово «созерцать» оставлено для сноски как более приподнятый лексический оттенок.
