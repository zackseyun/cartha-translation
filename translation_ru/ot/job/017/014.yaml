  text: I call to the pit, ‘You are my father,’ and to the worm, ‘My mother and my sister.’
translation:
  language: ru
  text: 'Я обращаюсь к могильной яме: «Ты мой отец», — а к червю: «Ты моя мать и сестра».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרָאתִי
  choice: Я взываю
  rationale: Форма от קרא означает обращение или призыв к кому-либо; «взываю» естественно передаёт прямое мрачное обращение Иова и сохраняет оттенок настойчивости.
- source_word: שַׁחַת
  choice: могиле
  rationale: В данном контексте слово обозначает место смерти и погребения; «могила» ясно и естественно по-русски, не вынуждая выбирать более узкое «яма» или толкование «тление».
- source_word: רִמָּה
  choice: червю
  rationale: Слово обозначает червя, связанного с разложением мёртвого тела; единственное число сохраняет форму и образ оригинала.
theological_decisions:
- issue: Обращение к могиле и червю как к ближайшим родственникам
  choice: Сохранена прямая персонификация без поясняющего истолкования
  alternative: 'Передать смысл описательно: «могила стала мне отцом, а черви — матерью и сестрой»'
  rationale: Еврейский текст сохраняет резкое прямое обращение, выражающее близость Иова к смерти; описательный перевод ослабил бы поэтическое напряжение.
- issue: Родственные наименования при слове «червь»
  choice: «моя мать и сестра»
  alternative: «мои мать и сестра» либо повторить обращение во множественном числе
  rationale: Оригинал обращён к единственному רִמָּה и приписывает ему оба отношения; русский текст сохраняет эту грамматическую и образную особенность.
translation_notes:
  register: Современный литературный русский язык с лаконичной поэтической интонацией. Синтаксический параллелизм и мрачная персонификация оригинала сохранены; пунктуация делает подразумеваемый во второй части глагол понятным без ненужного повтора.
