    rationale: קרא в этой конструкции обозначает обращение/называние; русское «взывать» обычно вызывает оттенок настойчивой мольбы.
  - severity: low
    issue: «Могила» сглаживает образ שַׁחַת.
    rationale: Слово может означать могилу, но его основной конкретный образ — яма; «могильная яма» сохраняет этот образ и подходит контексту.
  revised_text: 'Я обращаюсь к могильной яме: «Ты мой отец», — а к червю: «Ты моя мать и сестра».'
