  text: יֵֽ֭צְרוּ צַעֲדֵ֣י אוֹנ֑/וֹ וְֽ/תַשְׁלִיכֵ֥/הוּ עֲצָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/007.yaml
  text: His vigorous steps are constrained[b][a], and his own counsel casts him down.
translation:
  language: ru
  text: Его могучие шаги будут стеснены[a], и собственный замысел повергнет его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его сильные шаги сузятся». Слово אוֹן может означать «сила» или «мощь», а глагол — «сужаться», «быть ограниченным».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его собственный план свалит его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצְרוּ
  choice: будут стеснены
  rationale: Форма согласуется с множественным числом «шаги» и передаёт ограничение, сужение свободы движения; русское «будут стеснены» сохраняет поэтический образ без излишней конкретизации.
- source_word: צַעֲדֵי
  choice: шаги
  rationale: Прямое и естественное соответствие существительному в форме сопряжённого множественного числа; уместно в образе движения человека.
- source_word: אוֹנוֹ
  choice: его могучие
  rationale: אוֹן может обозначать силу, мощь или достаток. В сочетании с «шагами» наиболее уместно значение силы; прилагательное «могучие» естественно передаёт определительную функцию выражения.
- source_word: וְתַשְׁלִיכֵהוּ
  choice: повергнет его
  rationale: Каузативная форма глагола שלך с местоименным объектом описывает отбрасывание или падение. «Повергнет» передаёт гибельный результат, сохраняя возвышенный поэтический регистр.
- source_word: עֲצָתוֹ
  choice: собственный замысел
  rationale: עֵצָה охватывает значения совета, намерения и замысла. Здесь речь о задуманном самим нечестивым, которое оборачивается против него; «собственный» ясно передаёт эту иронию.
