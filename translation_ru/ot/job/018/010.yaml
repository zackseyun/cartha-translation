source:
  edition: WLC
  text: טָמ֣וּן בָּ/אָ֣רֶץ חַבְל֑/וֹ וּ֝/מַלְכֻּדְתּ֗/וֹ עֲלֵ֣י נָתִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/010.yaml
  text: His rope is hidden in the ground[a], and his trap on the path.
translation:
  language: ru
  text: Его верёвка скрыта в земле[a], и его ловушка — на тропе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его шнур спрятан в земле, и его западня — на тропе».'
    reason: Лексические варианты для חבל, טמן и מַלְכֹּדֶת сохраняют оттенки образа скрытого силка.
lexical_decisions:
- source_word: טָמוּן
  choice: скрыта
  rationale: Страдательное причастие от טמן выражает состояние чего-либо спрятанного или укрытого; «скрыта» естественно и сохраняет статично-страдательный смысл.
- source_word: בָּאָרֶץ
  choice: в земле
  rationale: В контексте устройства ловушки אֶרֶץ обозначает почву, в которой прячут верёвку; «в земле» передаёт конкретный образ, не расширяя его до значения «страна».
- source_word: חַבְלוֹ
  choice: его верёвка
  rationale: חבל может означать верёвку или шнур, здесь, вероятно, часть ловушки. «Верёвка» — ясный и конкретный современный эквивалент; местоименный суффикс сохранён без истолкования.
- source_word: וּמַלְכֻּדְתּוֹ
  choice: и его ловушка
  rationale: מַלְכֹּדֶת обозначает ловушку или западню. «Ловушка» — наиболее общепонятный вариант и сохраняет образ средства поимки.
- source_word: עֲלֵי נָתִיב
  choice: на тропе
  rationale: Сочетание предлога с נָתִיב указывает на расположение ловушки на пути движения; «на тропе» естественно передаёт этот образ.
theological_decisions:
- issue: Значение местоименных суффиксов в חַבְלוֹ и מַלְכֻּדְתּוֹ
  choice: «его верёвка» и «его ловушка»
  alternative: «верёвка для него» и «ловушка для него»
  rationale: Форма буквально допускает притяжательное прочтение, тогда как контекст может подразумевать ловушки, предназначенные для нечестивого. Перевод сохраняет грамматическую неоднозначность и не превращает суффиксы без необходимости в обозначение цели.
translation_notes:
  register: Современный литературный русский язык с краткой поэтической структурой. Тире во второй части естественно обозначает пропуск сказуемого «скрыта» без добавления нового содержания.
