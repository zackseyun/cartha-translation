  text: אַךְ אֵ֭לֶּה מִשְׁכְּנ֣וֹת עַוָּ֑ל וְ֝/זֶ֗ה מְק֣וֹם לֹא יָדַֽע אֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/018/021.yaml
  text: Surely these are the dwellings of the unjust[b][a], and this is the place of one who does not know God.
translation:
  language: ru
  text: Воистину, таковы жилища неправедного, и таково место того, кто не знает Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Воистину
  rationale: Частица имеет здесь усилительно-утвердительное значение и завершает речь Вилдада; «воистину» передаёт эту силу без ограничительного смысла «только».
- source_word: אֵלֶּה
  choice: таковы
  rationale: Указательное местоимение отсылает к только что описанной участи; в русском именная конструкция «таковы жилища» естественно выражает итоговое обобщение.
- source_word: מִשְׁכְּנוֹת
  choice: жилища
  rationale: Слово обозначает места обитания в широком смысле; «жилища» сохраняет множественное число и не сужает значение до шатров.
- source_word: עַוָּל
  choice: неправедного
  rationale: Слово характеризует человека как творящего неправду или несправедливость. «Неправедный» сохраняет нравственно-правовой оттенок и соответствует возвышенному контексту книги.
- source_word: וְזֶה
  choice: и таково
  rationale: Параллельная итоговая конструкция лучше всего передаётся по-русски повтором «таково», согласованным со словом «место».
- source_word: מְקוֹם
  choice: место
  rationale: Прямой эквивалент сохраняет параллелизм с «жилищами», не добавляя значения дома или постоянного обитания.
- source_word: לֹא יָדַע אֵל
  choice: того, кто не знает Бога
  rationale: Русская относительная конструкция ясно обозначает владельца или обитателя этого места, сохраняя буквально открытое выражение «не знает Бога» без богословского разъяснения внутри текста.
- source_word: אֵל
  choice: Бога
  rationale: В данном контексте אֵל обозначает Бога; русское написание с прописной буквы естественно передаёт референцию.
theological_decisions:
- issue: Смысл выражения «не знает Бога»
  choice: Сохранить формулировку «не знает Бога», допускающую нравственно-реляционный смысл
  alternative: Передать как простое отсутствие сведений о Боге или развернуть как «не признаёт Бога»
  rationale: В контексте литературы мудрости «знать Бога» может включать признание Бога и правильное отношение к Нему, однако сам стих не раскрывает выражение. Буквальный оборот сохраняет его богословскую насыщенность и возможную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, афористичным звучанием, подходящим для заключительной строки речи Вилдада. Синтаксический параллелизм сохранён повтором «таковы / таково».
