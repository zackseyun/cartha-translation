lexical_decisions:
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Прямо и естественно передаёт вопросительное наречие, вводящее риторический вопрос Вилдада.
- source_word: נֶחְשַׁבְנוּ
  choice: нас считают
  rationale: Пассивная форма глагола חשׁב говорит о том, кем собеседники Иова представляются в его оценке; русская безличная конструкция звучит естественно.
- source_word: כַבְּהֵמָה
  choice: скотом
  rationale: בְּהֵמָה — широкое обозначение животного, нередко домашнего скота; в данном сравнении слово выражает унизительную оценку, не обязательно подразумевая диких зверей.
- source_word: נִטְמִינוּ
  choice: неразумными
  rationale: Редкая и трудная форма в данном контексте, вероятно, описывает умственную тупость или отсутствие разумения. «Неразумными» сохраняет уничижительный смысл, не прибегая к излишне разговорному «тупыми».
- source_word: בְּעֵינֵיכֶם
  choice: в ваших глазах
  rationale: Сохраняет прозрачную древнееврейскую идиому оценки или восприятия; местоимение передано во множественном числе.
