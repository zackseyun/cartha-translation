  text: A trap seizes him by the heel[a]; a snare holds him fast.
translation:
  language: ru
  text: Ловушка схватит его за пяту[a], силок крепко удержит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ловушка поймает его за пятку, петля крепко стиснет его». Последнее еврейское слово встречается редко и, возможно, обозначает особый вид силка или петли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאחֵז
  choice: схватит
  rationale: Форма qal, 3-е лицо мужского рода единственного числа, передаёт энергичное действие — «схватить, ухватить»; будущее время естественно выражает незавершённый вид в данном поэтическом контексте.
- source_word: בְּעָקֵב
  choice: за пяту
  rationale: עָקֵב означает «пята, пятка»; предлог ב здесь указывает на место захвата. «За пяту» сохраняет конкретный образ и возвышенный поэтический регистр.
- source_word: פָּח
  choice: ловушка
  rationale: Слово обозначает ловушку или силок. «Ловушка» ясно передаёт общий смысл и позволяет отличить этот предмет от редкого названия западни во второй строке.
- source_word: יַחֲזֵק
  choice: крепко удержит
  rationale: Hiphil от חזק в данном контексте выражает крепкий, неослабевающий захват. Перевод сохраняет усилительное значение корня и параллелизм с «схватит».
- source_word: עָלָיו
  choice: его
  rationale: Предлог על с местоименным суффиксом обозначает направленность захватывающего действия на человека; в русском языке при глаголе «удержит» это естественно передаётся прямым дополнением.
- source_word: צַמִּים
  choice: силок
  rationale: Редкое слово, вероятно обозначающее особый вид ловушки, силка или петли. «Силок» сохраняет конкретный образ, не отождествляя его полностью с פָּח.
