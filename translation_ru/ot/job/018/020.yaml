  register: 'Современный литературный русский язык с достоинством поэтической речи. Синтаксис первой половины перестроен ради естественности: причинное отношение, выраженное עַל, передано конструкцией «его день повергает в ужас». Сохранены образ «его дня», временная неоднозначность пары «последующие / прежние» и телесный оттенок слова «содрогание».'
