  text: עַל י֭וֹמ/וֹ נָשַׁ֣מּוּ אַחֲרֹנִ֑ים וְ֝/קַדְמֹנִ֗ים אָ֣חֲזוּ שָֽׂעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/020.yaml
  text: Those who come after are appalled at his day[c][b][a], and those who went before are seized with horror.
translation:
  language: ru
  text: Его день[a] повергает в ужас тех, кто придёт после[b], а тех, кто был прежде, охватывает содрогание[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его день»; вероятно, имеется в виду день постигшего его бедствия или суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «последние… прежние». Некоторые понимают эту пару в географическом смысле: «живущие на западе… живущие на востоке».'
    reason: alternative_reading
  - marker: c
    text: Еврейское выражение буквально говорит о содрогании, которое овладевает людьми, то есть об ужасе, от которого их бросает в дрожь.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: из-за / при виде (передано конструкцией «его день повергает в ужас»)
  rationale: Предлог указывает на повод или причину потрясения. Перестройка фразы позволяет естественно передать это отношение по-русски, не придавая предлогу пространственного смысла.
- source_word: יוֹמוֹ
  choice: его день
  rationale: Сохранён конкретный и неоднозначный еврейский образ. В контексте речь, вероятно, идёт о дне постигшего нечестивого бедствия или суда, но это уточнение не внесено в основной текст.
- source_word: נָשַׁמּוּ
  choice: повергает в ужас
  rationale: Глагол выражает ошеломлённое, потрясённое состояние. Такая формулировка передаёт его сильнее, чем нейтральное «удивляет», и естественно сочетается с «его день».
- source_word: אַחֲרֹנִים
  choice: те, кто придёт после
  rationale: Основное здесь понимание — «последующие, позднейшие». Развёрнутая формулировка ясна современному читателю и не требует подразумевать именно родственных потомков.
- source_word: וְקַדְמֹנִים
  choice: те, кто был прежде
  rationale: Слово может обозначать прежних либо находящихся на востоке. В параллели с אַחֲרֹנִים выбран временной смысл, при этом географическое прочтение отмечено в сноске.
- source_word: אָחֲזוּ
  choice: охватывает
  rationale: Буквально глагол означает «схватили, овладели». В сочетании с обозначением сильного чувства по-русски естественно сказать, что человека «охватывает» содрогание.
- source_word: שָׂעַר
  choice: содрогание
  rationale: Существительное обозначает дрожь или ужас, возможно с оттенком телесной реакции, когда волосы встают дыбом. «Содрогание» сохраняет этот образ лучше, чем отвлечённое «страх».
theological_decisions: []
