- source_word: סָבִיב
  choice: со всех сторон
  rationale: Наречное употребление передаёт окружение отовсюду и естественно звучит в современном русском языке.
- source_word: בִּעֲתֻהוּ
  choice: пугают его
  rationale: Форма от בעת обозначает сильный испуг или внезапный ужас; сочетание «ужасы… пугают» сохраняет прямой смысл и поэтический параллелизм.
- source_word: בַלָּהוֹת
  choice: ужасы
  rationale: Множественное число обозначает страшные явления или внезапные угрозы; «ужасы» — прямой и уместный для поэзии Иова эквивалент.
- source_word: וֶהֱפִיצֻהוּ
  choice: гонят его
  rationale: Хотя глагол обычно связан с рассеянием, в данном контексте сочетание с «у ног его» естественно описывает угрозы, заставляющие человека бежать; буквальное «рассеивают его» по-русски неясно применительно к одному человеку.
- source_word: לְרַגְלָיו
  choice: по пятам
  rationale: Буквально «к/у ног его». Идиома «по пятам» естественно передаёт образ ужасов, преследующих человека и вынуждающих его двигаться, при сохранении буквального образа в сноске.
