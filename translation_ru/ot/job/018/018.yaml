lexical_decisions:
- source_word: יֶהְדְּפֻהוּ
  choice: Его вытесняют
  rationale: Глагол הדף передаёт принудительное удаление — его толкают или гонят прочь. Неопределённо-личная конструкция сохраняет выраженный в еврейском множественный субъект, который в контексте не назван.
- source_word: מֵאוֹר אֶל־חֹשֶׁךְ
  choice: из света во тьму
  rationale: Предлоги обозначают движение из одной области в другую; краткая формулировка сохраняет поэтическое противопоставление света и тьмы.
- source_word: וּמִתֵּבֵל
  choice: из мира
  rationale: תֵּבֵל обозначает мир, нередко с оттенком обитаемого мира. «Из мира» естественно и лаконично звучит по-русски, а более узкое значение отмечено в сноске.
- source_word: יְנִדֻּהוּ
  choice: изгоняют
  rationale: Форма передаёт причинённое удаление или исключение. «Изгоняют» выражает насильственное устранение и не повторяет глагол первой строки.
