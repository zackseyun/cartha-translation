  text: זִֽכְר/וֹ אָ֭בַד מִנִּי אָ֑רֶץ וְ/לֹא שֵׁ֥ם ל֝֗/וֹ עַל פְּנֵי חֽוּץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/017.yaml
  text: His memory perishes from the earth[a], and he has no name on the face of the street.
translation:
  language: ru
  text: Память о нём исчезнет с земли[a], и имени его не останется на улице.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Память о нём исчезнет из страны, и имени его не останется на площади».'
    reason: 'Лексическая неоднозначность: אֶרֶץ может означать «земля» или «страна», а חוּץ — «улица», открытое место либо общественную площадь.'
lexical_decisions:
- source_word: זִכְרוֹ
  choice: память о нём
  rationale: Существительное זֵכֶר обозначает память или воспоминание. Оборот «память о нём» естественен по-русски и ясно передаёт исчезновение человека из людской памяти.
- source_word: אָבַד
  choice: исчезнет
  rationale: Глагол אָבַד может означать «погибнуть», «пропасть», «исчезнуть». При подлежащем «память» вариант «исчезнет» звучит естественно и сохраняет образ полного забвения.
- source_word: מִנִּי אָרֶץ
  choice: с земли
  rationale: אֶרֶץ допускает значения «земля» и «страна». В контексте полного стирания памяти «с земли» передаёт широкий масштаб высказывания, не исключая более локального понимания, отмеченного в сноске.
- source_word: וְלֹא שֵׁם לוֹ
  choice: и имени его не останется
  rationale: Буквально выражение означает «и нет ему имени». Русская формулировка «имени его не останется» естественно выражает отсутствие сохраняющейся известности или памяти о человеке и соответствует будущей направленности параллельной строки.
- source_word: עַל־פְּנֵי חוּץ
  choice: на улице
  rationale: חוּץ обозначает внешнее, открытое или общественное пространство, в том числе улицу или площадь. «На улице» сохраняет конкретный образ публичной среды, где имя человека было бы известно.
