lexical_decisions:
- source_word: נִין
  choice: потомок
  rationale: Слово обозначает потомство или отпрыска; «потомок» естественно звучит по-русски и не сужает значение до сына.
- source_word: נֶכֶד
  choice: продолжение рода
  rationale: В паре с נִין указывает на последующие поколения и полное пресечение рода. Такой перевод передаёт смысл сочетания, сохраняя в сноске более буквальную возможность «внук».
- source_word: בְּעַמּוֹ
  choice: среди своего народа
  rationale: Предлог בְּ здесь обозначает среду или общину, к которой принадлежит человек; «среди своего народа» естественно передаёт этот смысл.
- source_word: שָׂרִיד
  choice: уцелевший
  rationale: Существительное обозначает того, кто остался или пережил бедствие. «Уцелевший» ясно передаёт индивидуальное значение и не вносит богословских ассоциаций слова «остаток».
- source_word: בִּמְגוּרָיו
  choice: в местах, где он жил
  rationale: מָגוּר может обозначать как жилище, так и место временного проживания. Нейтральная формулировка сохраняет естественность русского текста, а неоднозначность отмечена в сноске.
