  yaml_path: translation/ot/job/018/005.yaml
  text: Indeed[a], the light of the wicked is put out, and the flame of his fire does not shine.
translation:
  language: ru
  text: 'Да, свет нечестивых угаснет,

    и пламя его огня не засияет.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искра его огня». Еврейское слово שְׁבִיב может означать как «пламя», так и «искру».'
