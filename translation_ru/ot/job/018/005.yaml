lexical_decisions:
- source_word: גַּם
  choice: Да
  rationale: Здесь частица усиливает и подтверждает утверждение Вилдада; русское «Да» естественно передаёт этот оттенок в возвышенной поэтической речи.
- source_word: אוֹר
  choice: свет
  rationale: Сохранён исходный образ света, который в контексте может обозначать жизнь или благополучие нечестивых.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное множественное число обозначает нечестивых людей как общую категорию; родительный падеж обусловлен сочетанием «свет нечестивых».
- source_word: יִדְעָךְ
  choice: угаснет
  rationale: Глагол описывает угасание или прекращение света; «угаснет» естественно продолжает образ и сохраняет форму будущего времени.
- source_word: וְלֹא
  choice: и не
  rationale: Прямо передаёт сочинительную связь и отрицание второй параллельной строки.
- source_word: יִגַּהּ
  choice: воссияет
  rationale: Глагол означает излучать свет, сиять. «Воссияет» соответствует будущему времени и поэтическому регистру, не устраняя отрицания.
- source_word: שְׁבִיב
  choice: пламя
  rationale: Слово допускает значения «пламя» и «искра»; в основном тексте выбрано «пламя», хорошо сочетающееся с последующим «огня», а альтернатива отмечена в сноске.
- source_word: אִשּׁוֹ
  choice: их огня
  rationale: Буквально местоименный суффикс имеет форму 3-го лица единственного числа («его»), но относится к собирательно представленным нечестивым; по-русски множественное «их» естественно согласуется с «нечестивых» и сохраняет референцию.
theological_decisions:
- issue: Образ света нечестивых
  choice: Сохранить буквальные образы «свет», «пламя» и «огонь» без истолкования как жизни, благополучия или потомства.
  alternative: Передать метафору толкованием, например «благополучие нечестивых прекратится».
  rationale: Еврейский текст оставляет образ многозначным; перевод не должен сужать его богословское и поэтическое содержание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух строк и образная система еврейского текста сохранены; архаические слова и конфессионально окрашенные толкования не введены.
