  yaml_path: translation/ot/job/018/013.yaml
  text: It devours the limbs of his skin[a]; the firstborn of death devours his limbs.
translation:
  language: ru
  text: Он пожирает члены его кожи[a]; первенец смерти пожирает его члены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «члены его кожи». Выражение «первенец смерти», возможно, поэтически обозначает самое смертоносное бедствие или главное орудие смерти.'
    reason: Сноска поясняет необычное буквальное сочетание и отмечает возможные понимания спорной метафоры, не сводя её к одному толкованию.
lexical_decisions:
- source_word: יֹאכַל
  choice: пожирает
  rationale: Форма Qal, имперфект 3-го лица мужского рода единственного числа от אכל, метафорически описывает разрушительное поглощение. Настоящее время передаёт живость поэтической картины.
- source_word: בַּדֵּי / בַּדָּיו
  choice: члены / его члены
  rationale: В данном контексте слово обозначает части или члены тела. «Члены» сохраняет телесный смысл и повтор одного еврейского слова в обоих полустишиях.
- source_word: עוֹרוֹ
  choice: его тела
  rationale: Буквально «его кожи». В сочетании «члены его кожи» буквальный русский вариант неестественен; «члены его тела» передаёт телесную образность, а буквальное чтение отмечено в сноске.
- source_word: בְּכוֹר מָוֶת
  choice: первенец смерти
  rationale: Формальная передача сохраняет необычную метафору, олицетворение и неоднозначность еврейского выражения, не сводя его к конкретной болезни или виду смерти.
theological_decisions:
- issue: Толкование выражения בְּכוֹר מָוֶת
  choice: Сохранить в основном тексте образ «первенец смерти» как олицетворённую разрушительную силу.
  alternative: смертельная болезнь; самое страшное бедствие; главный посланник смерти
  rationale: Еврейский текст не устанавливает однозначно, что имеется в виду конкретная болезнь или определённый способ смерти. Сохранение метафоры не снимает присущего тексту напряжения.
- issue: Неявный субъект первого יֹאכַל
  choice: Передать местоимением «он», соотносимым в поэтическом параллелизме с «первенцем смерти» во втором полустишии.
  alternative: Безличное «пожираются» или неопределённое «нечто пожирает»
  rationale: Глагол имеет форму 3-го лица мужского рода единственного числа, а следующий полустих называет вероятный субъект. При этом структура стиха допускает катастрофическое отложенное называние субъекта.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Повтор «пожирает» и «члены» сохранён ради параллелизма оригинала; необычный образ «первенец смерти» намеренно не истолкован в основном тексте.
