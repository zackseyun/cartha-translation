  text: For he is sent into a net by his own feet, and he walks onto a mesh.
translation:
  language: ru
  text: 'Ибо он своими ногами загнан в сеть

    и ходит по плетёной сети.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁלַּח בְּרֶשֶׁת בְּרַגְלָיו
  choice: собственные ноги заводят его в сеть
  rationale: Пассив שֻׁלַּח буквально означает «послан/направлен», а בְּרַגְלָיו — «своими ногами». В поэтическом контексте естественная русская формулировка передаёт, что нечестивый сам своим движением оказывается в западне, не добавляя внешнего деятеля.
- source_word: שְׂבָכָה
  choice: плетёнка
  rationale: Слово обозначает сетчатое или переплетённое устройство; здесь параллельно «сети» и, вероятно, называет разновидность ловушки. «Плетёнка» сохраняет конкретный образ и не отождествляет оба термина.
- source_word: יִתְהַלָּךְ
  choice: ступает
  rationale: Форма выражает движение, хождение; в сочетании с ловушкой «ступает» по-русски ясно передаёт опасное попадание ногой на сетчатое приспособление.
theological_decisions:
- issue: Кто направляет нечестивого в сеть
  choice: Сформулировать через его собственные ноги без указания внешнего деятеля
  alternative: «Он послан в сеть своими ногами»
  rationale: Еврейский пассив не называет деятеля. Перевод сохраняет связь гибели с собственным путём человека и не уточняет, Бог ли, иной субъект или сама ситуация направляет его в ловушку.
translation_notes:
  register: Современный литературный русский с сохранением краткого поэтического параллелизма. «Плетёнка» употреблена как конкретное название переплетённой ловушки; лексика понятна из контекста и не звучит конфессионально.
