  source_fidelity: 'Первая строка еврейского текста построена как пассив: «он послан/загнан в сеть своими ногами». Черновик («собственные ноги заводят его») заменяет пассив активной персонификацией ног и несколько сильнее истолковывает образ. Во второй строке יִתְהַלָּךְ означает «ходит», а עַל — «по/на», не направительное «на».'
