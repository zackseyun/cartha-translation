  yaml_path: translation/ot/job/018/004.yaml
  text: You who tear yourself apart in your anger—shall the earth be abandoned for your sake[a], or a rock be moved from its place?
translation:
  language: ru
  text: Ты, терзающий себя в гневе, — неужели ради тебя земля будет оставлена или скала сдвинется со своего места?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально начало стиха можно передать: «Терзающий свою душу в своём гневе». В еврейском тексте сначала стоит выражение в третьем лице, после чего речь переходит к прямому обращению: «ради тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֹרֵף נַפְשׁוֹ
  choice: терзающий себя
  rationale: Причастие טֹרֵף буквально передаёт разрывание или растерзание; вместе с נַפְשׁוֹ оно изображает саморазрушительное действие. «Терзающий себя» естественно звучит по-русски и сохраняет яркость образа.
- source_word: בְּאַפּוֹ
  choice: в гневе
  rationale: אַף буквально означает «нос», но обычно обозначает гнев. Вслед за переходом к прямому обращению смысл передан применительно к адресату.
- source_word: הֲלְמַעַנְךָ
  choice: неужели ради тебя
  rationale: Сочетание вопросительной частицы с לְמַעַן создаёт риторический вопрос о том, должен ли ради Иова измениться установленный порядок.
- source_word: תֵּעָזַב אָרֶץ
  choice: опустеет земля
  rationale: Nifal от עזב допускает значение оставленности или запустения. «Опустеет земля» естественно передаёт результат того, что земля будет оставлена, и сохраняет широкий, космический смысл אָרֶץ.
- source_word: וְיֶעְתַּק צוּר
  choice: скала сдвинется
  rationale: עתק здесь означает перемещение с места, а צוּר — скалу или утёс. «Сдвинется» сохраняет параллельный образ нарушения устойчивого мирового порядка.
- source_word: מִמְּקֹמוֹ
  choice: со своего места
  rationale: Местоименный суффикс относится к скале; русское «со своего места» является естественным соответствием.
theological_decisions:
- issue: Лицо в начальной причастной конструкции и риторическая направленность
  choice: 'Передать весь стих как прямое обращение к Иову: «Ты, терзающий себя… ради тебя…»'
  alternative: 'Формально сохранить третье лицо в начале: «Терзающий свою душу в гневе, неужели ради тебя…» или «Он терзает свою душу…»'
  rationale: В еврейском начало оформлено причастием и суффиксами третьего лица, но затем следует явное обращение во втором лице לְמַעַנְךָ. Прямое обращение по-русски ясно передаёт риторический упрёк, а примечание сохраняет грамматическую неоднородность оригинала.
- issue: Масштаб образа אָרֶץ и צוּר
  choice: Понимать образы как риторическое указание на неизменность мирового порядка, не придавая скале специального богословского значения
  alternative: Понимать אָרֶץ как конкретную землю, а צוּר как особый символ или титул Бога
  rationale: Контекст и параллелизм поддерживают общеобразные значения «земля» и «скала»; текст не требует конфессионально обусловленной символизации.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Причастный оборот сохраняет резкость упрёка; риторический вопрос и параллелизм двух образов переданы без архаизации.
