  text: 'Его сила изнемогает от голода,

    и бедствие готово у его стороны.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «готово к его падению». Еврейское слово может означать «бок, сторона»; возможно также понимание, связанное с хромотой или спотыканием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי רָעֵב
  choice: истощена голодом
  rationale: Несовершенный вид היה с прилагательным רָעֵב в поэтическом описании передан как настоящее состояние. Выражение сохраняет образ голода и передаёт крайнюю степень ослабления естественнее, чем буквальное «голодна» применительно к силе.
- source_word: אֹנוֹ
  choice: его сила
  rationale: אוֹן может обозначать силу, мощь или достаток; в данном контексте наиболее связным остаётся образ иссякающей человеческой силы.
- source_word: וְאֵיד
  choice: и бедствие
  rationale: אֵיד обозначает гибельное несчастье или бедствие; выбранное слово соответствует возвышенному поэтическому регистру.
- source_word: נָכוֹן
  choice: уже готово
  rationale: נָכוֹן выражает состояние готовности или приготовленности. Частица «уже» естественно передаёт ощущение непосредственной угрозы, не меняя основного смысла.
- source_word: לְצַלְעוֹ
  choice: быть рядом с ним
  rationale: 'Основное понимание צלע здесь связано с боком, стороной: бедствие находится возле человека и готово настигнуть его. Конструкция с «быть» делает русскую строку естественной.'
