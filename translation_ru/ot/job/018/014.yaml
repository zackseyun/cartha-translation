base_translation:
  language: en
  yaml_path: translation/ot/job/018/014.yaml
  text: He is torn from the security of his tent[b][a], and he is marched off to the king of terrors.
translation:
  language: ru
  text: Из его шатра будет вырвана его опора[a], и его поведут к царю ужасов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его исторгнут из шатра, его опоры». Еврейская конструкция допускает также понимание, что шатёр был местом его безопасности или тем, на что он полагался.'
    reason: lexical_alternative
  - marker: b
    text: «Царь ужасов» — поэтический образ, часто понимаемый как олицетворённая смерть.
    reason: alternative_reading
lexical_decisions:
- source_word: יִנָּתֵק
  choice: его исторгнут
  rationale: Нифаль глагола נתק выражает насильственное отделение или вырывание. Неопределённо-личная конструкция по-русски естественно передаёт страдательный смысл.
- source_word: מֵאָהֳלוֹ
  choice: из … шатра
  rationale: אֹהֶל буквально означает «шатёр»; конкретный поэтический образ сохранён, хотя в контексте слово может обозначать жилище.
- source_word: מִבְטַחוֹ
  choice: из надёжного шатра
  rationale: מִבְטָח может означать безопасность, опору или предмет уверенности. Прилагательное «надёжного» естественно передаёт шатёр как место безопасности, а возможное приложение оговорено в сноске.
- source_word: וְתַצְעִדֵהוּ
  choice: и поведут
  rationale: Каузативная форма צעד означает «заставить идти, повести». Неопределённо-личное «поведут» не вводит в текст не названного прямо деятеля и сохраняет направленное движение.
- source_word: לְמֶלֶךְ
  choice: к царю
  rationale: Предлог לְ здесь передаёт движение к цели.
- source_word: בַּלָּהוֹת
  choice: ужасов
  rationale: Форма множественного числа обозначает ужасы или страшные бедствия; «царь ужасов» сохраняет ёмкий поэтический образ.
theological_decisions:
- issue: Кто такой «царь ужасов»
  choice: Сохранить образ без прямого отождествления.
  alternative: Смерть, олицетворённая как царь; могила или шеол.
  rationale: Еврейский текст не раскрывает референт однозначно. Перевод сохраняет метафору и не вносит определённого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого и грозного поэтического образа. «Исторгнут» выбрано как dignified, но понятное слово, передающее насильственный характер действия; «поведут» устраняет неясный грамматический субъект, не уточняя его.
