  text: In his tent dwells no longer his[b][a]; sulfur is scattered over his dwelling.
translation:
  language: ru
  text: В его шатре поселится то, что ему не принадлежит[a]; по его жилищу рассеют серу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст первой части стиха допускает разные толкования: «в его шатре поселится чужое», «его шатёр уже не будет принадлежать ему» или, если считать «серу» отложенным подлежащим, «в его шатре поселится сера».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁכּוֹן
  choice: поселится
  rationale: Глагол שכן означает «обитать, селиться». Форма 3-го лица женского рода синтаксически трудна, поскольку выраженное подлежащее перед ней отсутствует; русский перевод сохраняет неопределённость через оборот «то, что».
- source_word: בְּאָהֳלוֹ
  choice: в его шатре
  rationale: אֹהֶל буквально означает «шатёр». Конкретный образ сохранён, а не заменён более общим «домом».
- source_word: מִבְּלִי לוֹ
  choice: то, что ему не принадлежит
  rationale: Эллиптическое сочетание выражает отсутствие связи или принадлежности ему. Такой перевод передаёт утрату владения и возможное появление чуждого присутствия, не уточняя его природу.
- source_word: יְזֹרֶה
  choice: рассеют
  rationale: Пиэль глагола זרה означает «рассеивать, разбрасывать». Форма 3-го лица единственного числа может иметь безличное значение; русская неопределённо-личная конструкция не вводит названного деятеля.
- source_word: עַל נָוֵהוּ
  choice: по его жилищу
  rationale: נָוֶה может означать жилище, обитель или пастбище. Параллель с «шатром» указывает здесь на место обитания; предлог «по» естественно сочетается с разбрасыванием вещества по поверхности.
- source_word: גָפְרִית
  choice: сера
  rationale: Современное и точное русское обозначение вещества; оно сохраняет образ уничтожающего суда без архаизации.
theological_decisions:
- issue: Трудный синтаксис первой половины стиха и образ суда
  choice: В шатре нечестивого поселяется нечто, уже не принадлежащее ему или чуждое ему; его жилище покрывают серой.
  alternative: 'Сера — отложенное подлежащее женского рода: «В его шатре поселится сера»; либо шатёр уже не принадлежит прежнему владельцу.'
  rationale: Женская форма תִּשְׁכּוֹן и эллиптическое מִבְּלִי לוֹ допускают несколько связей слов. Основной текст передаёт отчуждение шатра, но не отождествляет безусловно подлежащее первого глагола с серой; примечание сохраняет основные грамматически возможные прочтения.
translation_notes:
  register: Современный литературный русский язык с сохранением конкретных образов «шатра», «жилища» и «серы». Неопределённо-личное «рассеют» естественно передаёт безличное действие еврейского текста. Трудная эллиптическая конструкция не догматизируется и поясняется в сноске.
