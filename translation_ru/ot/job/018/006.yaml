  text: The light in his tent grows dark[a], and his lamp above him is extinguished.
translation:
  language: ru
  text: 'Свет в его шатре померкнет[a],

    и светильник над ним угаснет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на нём». Еврейский предлог может обозначать положение «на» или «над»; вероятно, образ относится к светильнику, находящемуся над этим человеком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: свет
  rationale: Обычное конкретное значение слова сохраняет образ освещения жилища и естественно звучит по-русски.
- source_word: חָשַׁךְ
  choice: померкнет
  rationale: Глагол передаёт наступление темноты, а форма в контексте речи о судьбе нечестивого естественно выражается будущим временем. «Померкнет» сохраняет поэтический регистр и не смешивает этот образ с угасанием светильника во второй строке.
- source_word: בְּאָהֳלוֹ
  choice: в его шатре
  rationale: «Шатёр» сохраняет конкретный древнееврейский образ, который также может подразумевать жилище или дом человека.
- source_word: וְנֵרוֹ
  choice: и светильник
  rationale: נֵר обозначает светильник или его пламя; «светильник» сохраняет предметный образ и хорошо образует параллель со «светом» первой строки.
- source_word: עָלָיו
  choice: над ним
  rationale: 'Предлог עַל здесь естественно понимать пространственно: светильник находится над человеком. Русское «над ним» кратко и сохраняет эту картину.'
- source_word: יִדְעָךְ
  choice: угаснет
  rationale: Глагол означает погаснуть, угаснуть — прежде всего о пламени или светильнике. «Угаснет» естественно, выразительно и соответствует поэтическому параллелизму.
