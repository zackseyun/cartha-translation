lexical_decisions:
- source_word: עַד־אָנָה
  choice: Долго ли ... ещё
  rationale: 'Естественный русский способ передать временной вопрос с оттенком упрёка: «как долго?» / «до каких пор?».'
- source_word: תְּשִׂימוּן קִנְצֵי לְמִלִּין
  choice: будете расставлять ловушки словами
  rationale: Глагол שׂים передан как «расставлять», а трудное קִנְצֵי — как «ловушки». Творительный «словами» естественно выражает средство словесного нападения; иное понимание как «пределы словам» сохранено в сноске.
- source_word: תָּבִינוּ
  choice: Вникните
  rationale: Передаёт призыв понять и обдумать сказанное без добавочного объекта и без морализующего оттенка слова «образумьтесь».
- source_word: וְאַחַר נְדַבֵּר
  choice: а потом мы поговорим
  rationale: 'Сохраняет последовательность: сперва понимание, затем речь. Форма первого лица множественного числа передана как будущее; возможный побудительный оттенок отмечен в сноске.'
