  text: מִ֭/תַּחַת שָֽׁרָשָׁ֣י/ו יִבָ֑שׁוּ וּ֝/מִ/מַּ֗עַל יִמַּ֥ל קְצִירֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/018/016.yaml
  text: His roots dry up beneath[a], and above, his branch withers.
translation:
  language: ru
  text: 'Снизу засохнут его корни,

    а сверху будет срезана его ветвь.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его побег». Еврейское слово обычно означает жатву или то, что срезают; здесь, в параллели с корнями, речь идёт о верхней части растения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתַּחַת
  choice: снизу
  rationale: Передаёт пространственное противопоставление מִתַּחַת и מִמַּעַל — нижней и верхней частей растения — естественно и поэтично по-русски.
- source_word: שָׁרָשָׁיו
  choice: его корни
  rationale: Сохраняет множественное число существительного с местоименным суффиксом и образ растения.
- source_word: יִבָשׁוּ
  choice: засохнут
  rationale: Точно и естественно передаёт значение «высохнуть, засохнуть» применительно к корням.
- source_word: וּמִמַּעַל
  choice: а сверху
  rationale: Ясно воспроизводит поэтическую антитезу «снизу — сверху»; противительный союз естественно связывает параллельные строки.
- source_word: יִמַּל
  choice: будет срезана
  rationale: Передаёт значение отсечения или срезания растительности, не смешивая этот глагол с יבשׁ «засыхать» из первой строки.
- source_word: קְצִירוֹ
  choice: его ветвь
  rationale: Хотя слово обычно связано с жатвой или тем, что срезают, в параллели с корнями оно обозначает верхнюю часть растения; «ветвь» ясно сохраняет растительную метафору.
