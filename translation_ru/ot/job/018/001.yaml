  text: Тогда Вилдад Савхеянин ответил и сказал:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Вилдад Савхеянин ответил и сказал».'
    reason: Лексический вариант передачи начального וַ как соединительного «и», а не последовательного «тогда».
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Глагол ענה в формуле диалога означает «ответить, откликнуться»; «ответил» естественно передаёт, что Вилдад отвечает Иову.
- source_word: בִּלְדַּד
  choice: Вилдад
  rationale: Имя передано в принятой русской библейской форме.
- source_word: הַשֻּׁחִי
  choice: Савхеянин
  rationale: Обозначение происхождения или принадлежности к роду передано традиционной русской библейской формой.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Сохранены оба глагола древнееврейской формулы введения прямой речи, а не сведены к одному.
- source_word: וַ
  choice: Тогда
  rationale: Начальный союз указывает на последовательность повествования; «тогда» звучит естественно по-русски и передаёт переход к ответной речи.
