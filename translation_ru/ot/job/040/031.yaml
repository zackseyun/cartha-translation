base_translation:
  language: en
  yaml_path: translation/ot/job/040/031.yaml
  text: Can you fill his hide with harpoons[b][a], or his head with fishing spears?
translation:
  language: ru
  text: 'Сможешь ли ты усеять его шкуру гарпунами[a],

    а голову — рыболовными острогами[b]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зазубренными орудиями». Редкое еврейское слово может обозначать острые или снабжённые зазубринами орудия охоты и рыбной ловли вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рыболовными крючьями». Еврейское выражение может обозначать орудие для ловли рыбы более широко; в данном параллелизме вероятны остроги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְמַלֵּא
  choice: Сможешь ли ты усеять
  rationale: Вопросительная частица и форма Piel imperfect 2-го лица ед. числа образуют риторический вызов. «Сможешь ли ты» передаёт подразумеваемую невозможность, а «усеять» естественно выражает здесь образ буквального «наполнения» шкуры пронзающими орудиями.
- source_word: בְשֻׂכּוֹת
  choice: гарпунами
  rationale: Редкое существительное обозначает, по-видимому, острые или зазубренные орудия охоты либо рыбной ловли. «Гарпуны» сохраняют образ множества пронзающих орудий и соответствуют параллельной строке.
- source_word: עוֹרוֹ
  choice: его шкуру
  rationale: Для кожи огромного животного «шкура» звучит конкретно и естественно, сохраняя предметность образа.
- source_word: וּבְצִלְצַל דָּגִים
  choice: рыболовными острогами
  rationale: Сочетание буквально называет орудие, связанное с ловлей рыбы. «Рыболовные остроги» хорошо передают орудия для поражения рыбы и образуют ясный параллелизм с гарпунами; точный вид орудия остаётся не вполне определённым.
- source_word: רֹאשׁוֹ
  choice: голову
  rationale: Прямой анатомический смысл сохранён; он образует параллель к «шкуре».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой риторического вопроса. Глагол «усеять» выбран вместо неестественного буквального «наполнить шкуру», сохраняя образ многочисленных орудий, покрывающих и пронзающих тело. Лексическая неопределённость двух редких названий орудий вынесена в примечания.
