  yaml_path: translation/ot/job/040/007.yaml
  text: Gird up your loins like a man; I will question you[a], and you shall make it known to me.
translation:
  language: ru
  text: Подпояшься же, как мужчина[a]; Я буду спрашивать тебя, а ты дай Мне знать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приготовься, как воин». Буквально: «опояшь свои чресла, как мужчина».'
    reason: Сноска сохраняет конкретный древний образ подпоясывания чресл и отмечает возможный оттенок силы или воинской готовности в слове גֶּבֶר.
lexical_decisions:
- source_word: אֱזָר נָא ... חֲלָצֶיךָ
  choice: Подпояшься же
  rationale: Возвратный глагол естественно передаёт образ приготовления к действию посредством подпоясывания; частица «же» выражает настойчивость נָא в контексте вызова, не превращая её в излишне вежливое «пожалуйста».
- source_word: כְגֶבֶר
  choice: как мужчина
  rationale: גֶּבֶר обозначает мужчину, нередко с оттенком силы и мужества. Перевод сохраняет мужской род и не сводит возможный смысл к более узкому «воин».
- source_word: אֶשְׁאָלְךָ
  choice: Я буду спрашивать тебя
  rationale: Глагол שאל означает «спрашивать»; форма с местоименным суффиксом прямо указывает на Иова как адресата. Продолженное будущее уместно для предстоящего ряда вопросов.
- source_word: וְהוֹדִיעֵנִי
  choice: а ты объясняй Мне
  rationale: Побудительная форма породы hifil от ידע буквально означает «дай Мне знать, сообщи Мне». «Объясняй Мне» естественно по-русски передаёт требование дать разъяснение в ответ на вопросы, сохраняя риторическую силу вызова.
theological_decisions:
- issue: Мужской образ в גבר
  choice: как мужчина
  alternative: как воин / как сильный человек
  rationale: Текст обращён к Иову и использует существительное мужского рода со смыслом взрослого сильного мужчины. Формулировка сохраняет гендерно маркированный образ, не добавляя отсутствующего в тексте прямого указания на воинский статус.
- issue: Риторический характер Божьего требования
  choice: а ты объясняй Мне
  alternative: и дай Мне знать / и отвечай Мне
  rationale: 'Перевод сохраняет форму требования и его напряжение: Бог велит Иову дать объяснение, не сглаживая иронию и не превращая фразу лишь в нейтральное приглашение ответить.'
translation_notes:
  register: Современный литературный русский с торжественной, но понятной интонацией. «Подпояшься» сохраняет телесный образ без архаичного «чресла» в основном тексте; прописные «Я», «Мне» следуют принятой русской традиции при передаче прямой речи Бога.
