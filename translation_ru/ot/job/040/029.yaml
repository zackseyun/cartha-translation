lexical_decisions:
- source_word: הֲתְשַׂחֶק
  choice: Станешь ли ты играть
  rationale: Глагол שׂחק в породе каль означает «играть, забавляться». В риторическом вопросе это естественно передаёт образ обращения с левиафаном как с безобидной домашней забавой.
- source_word: בּוֹ
  choice: с ним
  rationale: Местоименный суффикс мужского рода единственного числа относится к левиафану; русский мужской род сохраняет грамматику и связность еврейского текста.
- source_word: כַּצִּפּוֹר
  choice: как с птичкой
  rationale: צִפּוֹר означает птицу, нередко небольшую. Уменьшительная форма естественно передаёт подразумеваемый образ ручной птицы или домашней забавы, не превращая сравнение в прямое утверждение о размере.
- source_word: וְתִקְשְׁרֶנּוּ
  choice: или привяжешь его
  rationale: קשר означает «связывать, привязывать». «Привяжешь» ясно передаёт удерживание животного; союз передан как «или», поскольку две части образуют параллельные варианты риторического вопроса.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: для своих девушек
  rationale: נַעֲרוֹת обозначает девушек или молодых женщин. «Девушки» — современный, нейтральный эквивалент; притяжательное местоимение «своих» передаёт суффикс второго лица.
