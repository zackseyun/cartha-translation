translation_notes:
  register: Современный литературный русский язык с живым риторическим вопросом. «Птичкой» поддерживает домашний, почти игрушечный образ оригинала; архаичные «девы» и «отроковицы» исключены. Маркер сноски поставлен непосредственно после неоднозначного выражения.
