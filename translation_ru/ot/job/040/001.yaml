  text: And Yahweh answered Job and said:[a]
translation:
  language: ru
  text: И ответил Яхве Иову и сказал:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; также передаётся как «Яхве» или «Иегова».'
    reason: Пояснение передачи тетраграмматона и традиционных вариантов его транслитерации.
lexical_decisions:
- source_word: וַיַּעַן
  choice: И ответил
  rationale: Глагол ענה в повествовательной формуле означает «ответить». Русское «ответил» сохраняет диалогическую структуру оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: אֶת
  choice: '[показатель прямого дополнения, отдельно не переводится]'
  rationale: Частица обозначает Иова как прямое дополнение и не имеет отдельного естественного соответствия в русском языке.
- source_word: אִיּוֹב
  choice: Иову
  rationale: Использована закрепившаяся русская форма имени «Иов» в дательном падеже, которого требует глагол «ответил».
- source_word: וַיֹּאמַר
  choice: сказав
  rationale: Причастная конструкция естественно передаёт второй речевой глагол אמר и сохраняет оба глагола исходной формулы без тяжеловесного «и сказал».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В тексте непосредственно употреблён тетраграмматон. Форма «Яхве» сохраняет личное имя и не подменяет его титулом; альтернативная традиционная транслитерация отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением торжественной библейской повествовательной формулы. Конструкция «ответил… сказав» формальна, но понятна и точно отражает два глагола оригинала.
