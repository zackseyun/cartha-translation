  text: שִׂים עָלָ֥י/ו כַּפֶּ֑/ךָ זְכֹ֥ר מִ֝לְחָמָ֗ה אַל תּוֹסַֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/032.yaml
  text: Lay your hand on him[a]; remember the battle—you will not do it again.
translation:
  language: ru
  text: Положи на него руку; вспомни о битве — и больше этого не повторяй![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не добавляй». Возможен также результирующий смысл: «больше ты этого не сделаешь».'
    reason: Сохраняет идиоматическое значение и неоднозначность между запретом и предсказанием результата.
lexical_decisions:
- source_word: שִׂים
  choice: Положи
  rationale: Императив передан прямым и естественным русским глаголом; в сочетании «положи руку на» сохраняется образ физического соприкосновения или попытки схватить.
- source_word: עָלָיו
  choice: на него
  rationale: Предлог עַל с местоименным суффиксом 3-го лица мужского рода естественно означает «на него» и относится к левиафану.
- source_word: כַּפֶּךָ
  choice: руку
  rationale: כַּף может обозначать ладонь или руку; русское «положить руку на кого-либо» звучит естественно и передаёт действие без ненужного анатомического уточнения.
- source_word: זְכֹר
  choice: вспомни
  rationale: Императив זכר сохранён как прямое повеление. Совершенный вид «вспомни» уместен как призыв представить последствия столкновения.
- source_word: מִלְחָמָה
  choice: о битве
  rationale: Слово обозначает битву или сражение; здесь речь о столкновении с левиафаном. Предложное сочетание естественно управляется русским «вспомни».
- source_word: אַל תּוֹסַף
  choice: больше этого не повторяй
  rationale: Буквально конструкция означает «не добавляй», а идиоматически — «не делай снова, не повторяй». Повелительная форма сохраняет грамматическую силу еврейского запрета, а подразумеваемое действие восстанавливается словом «этого».
theological_decisions:
- issue: Запрет или предсказание в אַל תּוֹסַף
  choice: 'Передано как запрет: «больше этого не повторяй»'
  alternative: «больше ты этого не сделаешь»
  rationale: Частица אַל с глагольной формой обычно выражает отрицательное повеление. Контекст допускает результирующий оттенок — после битвы человек не решится повторить попытку, — поэтому этот оттенок отмечен в сноске, а не превращён безоговорочно в предсказание.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Сохранены два повеления и резкий переход к заключительному предостережению; местоимение «этого» естественно отсылает к попытке наложить руку на левиафана.
