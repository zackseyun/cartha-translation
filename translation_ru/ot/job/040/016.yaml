  text: Look now[a], his strength is in his loins[b], and his power in the muscles of his belly.
translation:
  language: ru
  text: 'Взгляни: сила его — в бёдрах[a], а мощь его — в мышцах[c] живота.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в чреслах» или «в пояснице»; еврейское слово обозначает область чресел, бёдер или поясницы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в сухожилиях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Вот
  rationale: Сочетание привлекает внимание к наглядной детали и придаёт высказыванию живость; «вот» естественно передаёт это в современном русском без излишней архаики.
- source_word: כֹחוֹ
  choice: сила его
  rationale: כֹחַ обозначает физическую силу; выбран прямой и естественный эквивалент.
- source_word: בְמָתְנָיו
  choice: в пояснице
  rationale: מָתְנַיִם обозначает область чресел, поясницы или бёдер. «В пояснице» сохраняет анатомический смысл и звучит современнее, чем «в чреслах».
- source_word: וְאֹנוֹ
  choice: а мощь
  rationale: אוֹן означает силу, крепость или мощь. «Мощь» передаёт телесную силу и сохраняет лексическое варьирование параллельных строк.
- source_word: בִּשְׁרִירֵי
  choice: в мышцах
  rationale: שְׁרִירִים может обозначать мышцы, сухожилия или плотные части тела. «Мышцы» — наиболее ясный современный анатомический эквивалент.
- source_word: בִטְנוֹ
  choice: живота
  rationale: בֶּטֶן здесь обозначает живот как часть тела; выбран простой и точный русский эквивалент.
