  yaml_path: translation/ot/job/040/009.yaml
  text: Or do you have an arm like God’s[a], and can you thunder with a voice like his?
translation:
  language: ru
  text: Или есть у тебя рука, как у Бога[a], и можешь ли ты греметь голосом, подобным Его голосу?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, менее вероятно: «как у бога», если אֵל понимать в нарицательном значении; контекст явно указывает на Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Или у тебя
  rationale: В последовательности риторических вопросов оборот продолжает вызов, обращённый к Иову; «Или» естественно передаёт связующую и вызывающую силу конструкции.
- source_word: זְרוֹעַ
  choice: рука
  rationale: Сохранён конкретный образ руки как выражения силы; замена на абстрактные «сила» или «могущество» устранила бы образность оригинала.
- source_word: כָּאֵל
  choice: как у Бога
  rationale: 'Русская притяжательная конструкция естественно передаёт эллиптическое сравнение: «рука, как [рука] у Бога». Контекст речи Бога явно поддерживает значение «Бог».'
- source_word: לָךְ
  choice: у тебя
  rationale: Буквальное «тебе» в русском здесь неидиоматично; конструкция обладания «у тебя» точно передаёт смысл.
- source_word: וּבְקוֹל
  choice: и ... голосом
  rationale: Предлог ב передаёт средство действия; творительный падеж «голосом» является естественным русским соответствием.
- source_word: כָּמֹהוּ
  choice: как Он
  rationale: Местоименный суффикс отсылает к Богу. Сравнение можно естественно понимать как «греметь, как Он», при этом упоминание голоса остаётся явным в той же фразе.
- source_word: תַרְעֵם
  choice: можешь ли ты греметь
  rationale: Форма выражает громоподобное звучание и в риторическом вопросе подразумевает способность; «греметь» сохраняет связь с громом и возвышенный образ божественной речи.
theological_decisions:
- issue: К кому относится אֵל в сравнении
  choice: Бог
  alternative: бог
  rationale: Непосредственный контекст — речь Бога, сопоставляющего Свою силу с возможностями Иова; поэтому определённая ссылка на Бога наиболее вероятна. Менее вероятное родовое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа руки и громового голоса. Формулировка торжественная, но понятная; риторическая структура оригинала сохранена.
