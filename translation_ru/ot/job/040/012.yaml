  yaml_path: translation/ot/job/040/012.yaml
  text: Look on everyone who is proud[a], and humble him; and tread down the wicked where they stand.
translation:
  language: ru
  text: Взгляни на каждого гордеца и смири его; сокруши нечестивых там, где они находятся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на их месте».'
    reason: Еврейское תַּחְתָּם в этом контексте может обозначать место, где находятся нечестивые.
lexical_decisions:
- source_word: רְאֵה
  choice: Взгляни на
  rationale: Повелительная форма, обращённая к Иову; передаёт направленное внимание к тем, над кем должен совершиться суд.
- source_word: כָל גֵּאֶה
  choice: всякого гордеца
  rationale: Субстантивированное прилагательное с כָל обозначает каждого принадлежащего к категории гордых; формулировка естественна и сохраняет распределительный смысл.
- source_word: הַכְנִיעֵהוּ
  choice: смири его
  rationale: Побудительная форма с местоименным суффиксом означает «заставь его унизиться, приведи его к смирению» и сохраняет противопоставление гордости и унижения.
- source_word: וַהֲדֹךְ
  choice: сокруши
  rationale: Глагол выражает решительное низвержение или раздавливание; «сокруши» передаёт силу образа в достойном литературном регистре.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Устойчивое обозначение людей, виновных в нравственном зле, соответствующее судебному контексту.
- source_word: תַּחְתָּם
  choice: на месте их
  rationale: В контексте выражение может означать «там, где они находятся», то есть немедленное поражение нечестивых на их собственном месте; буквальная пространственная возможность отмечена в сноске.
theological_decisions:
- issue: Характер повелений, обращённых к Иову
  choice: Сохранить прямые повелительные формы как часть Божьего вызова Иову.
  alternative: Передать их как явно гипотетические действия или как буквальное наделение Иова властью совершать Божий суд.
  rationale: Контекст показывает вызов, выявляющий пределы возможностей Иова, однако сам еврейский текст использует повелительные формы. Перевод не должен ни ослаблять их, ни добавлять утверждение о реальном даровании Иову божественной власти.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной судебной образностью. Синтаксический параллелизм и резкая сила повелений сохранены.
