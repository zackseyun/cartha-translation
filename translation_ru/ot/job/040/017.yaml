  text: He makes his tail stiff like a cedar[a]; the sinews of his thighs are knit together.
translation:
  language: ru
  text: Он напрягает хвост, словно кедр; сухожилия его бёдер[a] переплетены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его чресл»; возможно, конкретнее: «его половых органов». Значение еврейского слова неясно и остаётся предметом споров.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: напрягает
  rationale: В данном телесном описании глагол передаёт физическое действие или состояние хвоста. «Напрягает» естественно выражает твёрдость и силу, подразумеваемые сравнением с кедром, не внося обычного для этого корня значения «желать, находить удовольствие».
- source_word: זְנָבוֹ
  choice: хвост
  rationale: Прямое соответствие существительному с притяжательным суффиксом; принадлежность ясно выражена русской конструкцией при названном субъекте.
- source_word: כְמוֹ אָרֶז
  choice: словно кедр
  rationale: Сохраняется прямой поэтический образ кедра как дерева, отличающегося мощью и крепостью.
- source_word: גִּידֵי
  choice: сухожилия
  rationale: Слово обозначает сухожилия или связки; «сухожилия» — точный и понятный современный анатомический термин.
- source_word: פחדו
  choice: его бёдер
  rationale: Значение редкого в таком употреблении слова неясно. «Бёдра» естественно вписываются в описание телосложения, тогда как варианты «чресла» и более конкретное обозначение половых органов сохранены в примечании.
- source_word: יְשֹׂרָגוּ
  choice: переплетены
  rationale: Глагол рисует сухожилия как сплетённые или перевитые; краткое страдательное «переплетены» сохраняет поэтическую силу без лишнего уточнения.
