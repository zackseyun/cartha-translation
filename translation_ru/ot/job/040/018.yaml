  text: His bones are tubes of bronze[b][a]; his limbs are like bars of iron.
translation:
  language: ru
  text: Кости его — бронзовые трубы[a], кости его — словно железный брус[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронзовые каналы». Еврейское слово может обозначать русла, каналы или желоба, поэтому точная форма образа не вполне ясна.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кости его — словно железная отливка». Слово, переведённое как «кости», может обозначать также костяк; еврейское слово для металлического предмета стоит в единственном числе и может означать литой или сформированный кусок металла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָמָיו
  choice: кости его
  rationale: Обычное анатомическое значение עֶצֶם — «кость»; оно ясно передаёт образ внутренней крепости животного.
- source_word: אֲפִיקֵי
  choice: трубы
  rationale: אֲפִיקִים может обозначать русла, каналы или подобные им протяжённые полые формы. В сочетании с костями «трубы» создаёт естественный по-русски анатомический образ, не сводя метафору лишь к указанию на прочность.
- source_word: נְחוּשָׁה
  choice: бронзовые
  rationale: В поэтическом образе прочности נְחוּשָׁה уместно передать как «бронза»; прилагательное делает русскую фразу естественной.
- source_word: גְּרָמָיו
  choice: члены его
  rationale: גֶּרֶם может означать кость или телесный остов. «Члены» сохраняет телесный образ и поэтическое варьирование второго полустишия, не повторяя слово «кости».
- source_word: כִּמְטִיל
  choice: словно прутья
  rationale: מָטִיל обозначает отлитый или сформированный кусок металла, вероятно брус, прут или отливку. «Прутья» естественно выражает жёсткость и массивную прочность, хотя еврейская форма стоит в единственном числе.
- source_word: בַּרְזֶל
  choice: железные
  rationale: Стандартное значение בַּרְזֶל — «железо»; прилагательное естественно сочетается с «прутья» и соответствует параллельному образу бронзы.
