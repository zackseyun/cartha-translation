  text: 'Взгляни же на Бегемота[a], которого Я создал вместе с тобой: он ест траву, как вол.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зверя». Многие толкователи понимают «Бегемот» как имя или обозначение особого великого существа; другие отождествляют его с гиппопотамом или иным крупным животным.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Взгляни же
  rationale: Сочетание указательной частицы הִנֵּה и частицы נָא привлекает внимание и придаёт призыву непосредственность. «Взгляни же» естественно звучит по-русски и передаёт оба оттенка без архаичного «вот, узри».
- source_word: בְהֵמוֹת
  choice: Бегемота
  rationale: В данном поэтическом описании слово выступает как обозначение особого великого существа. Транслитерация сохраняет литературную силу и не навязывает спорную зоологическую идентификацию.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: которого Я создал
  rationale: Глагол עשה здесь означает «сделать, создать». «Создал» естественно для речи Бога о творении и точно передаёт смысл контекста.
- source_word: עִמָּךְ
  choice: как и тебя
  rationale: Предлог עם указывает, что Бог создал это существо наряду с Иовом. Русское «как и тебя» ясно выражает сопоставление в рамках творения и не создаёт ложного впечатления физического соседства.
- source_word: חָצִיר
  choice: траву
  rationale: Слово обозначает траву или травянистую растительность; «траву» — наиболее прямой и общеупотребительный русский эквивалент.
- source_word: כַבָּקָר
  choice: словно бык
  rationale: בקר может обозначать крупный рогатый скот как собирательное понятие. В сравнении единственное «бык» даёт естественный и наглядный русский образ, не утверждая более узкой идентификации самого Бегемота.
- source_word: יֹאכֵל
  choice: он ест
  rationale: Форма глагола мужского рода единственного числа относится к Бегемоту. Местоимение «он» сохраняет грамматическую и поэтическую персонификацию оригинала.
theological_decisions:
- issue: Идентификация בְהֵמוֹת
  choice: Передать как особое обозначение «Бегемот», не отождествляя существо с конкретным известным животным.
  alternative: Перевести как «зверь» либо истолковать как «гиппопотам» или другое крупное животное.
  rationale: Еврейская форма и возвышенный поэтический контекст допускают понимание слова как обозначения особого существа, но не дают бесспорной зоологической идентификации. Транслитерация сохраняет неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Сохранены поэтическая непосредственность божественной речи и неопределённость относительно вида существа; избегаются как архаизация, так и разговорность.
