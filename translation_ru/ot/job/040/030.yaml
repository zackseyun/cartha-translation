  text: יִכְר֣וּ עָ֭לָי/ו חַבָּרִ֑ים יֶ֝חֱצ֗וּ/הוּ בֵּ֣ין כְּֽנַעֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/030.yaml
  text: Will traders bargain over him? Will they divide him among the merchants?[a][b]
translation:
  language: ru
  text: Станут ли торговцы торговаться о нём? Разделят ли его между купцами?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Станут ли товарищи пировать им?» Первая часть еврейского текста трудна; слово חַבָּרִים можно понимать не в торговом смысле.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «между хананеями»; в данном контексте это слово, вероятно, означает «купцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִכְרוּ
  choice: торговаться
  rationale: Хотя глагол כרה обычно означает «копать», здесь сочетание с людьми и торговой лексикой второй строки, вероятно, передаёт заключение сделки или торг.
- source_word: עָלָיו
  choice: о нём
  rationale: Предлог על в данном сочетании указывает на предмет переговоров; по-русски естественно «торговаться о нём».
- source_word: חַבָּרִים
  choice: торговцы
  rationale: Слово может означать «товарищи» или «сообщники», однако параллель с купцами во второй части поддерживает коммерческий смысл.
- source_word: יֶחֱצוּהוּ
  choice: разделят его
  rationale: Глагол חצה означает «делить, распределять». Перевод сохраняет открытым, идёт ли речь о распределении товара или о разделке добычи.
- source_word: בֵּין
  choice: между
  rationale: Русское «между» нормативно употребляется и при множественном числе участников.
- source_word: כְּנַעֲנִים
  choice: купцами
  rationale: Буквально это «хананеи», но в ряде контекстов слово метонимически обозначает торговцев; коммерческий параллелизм поддерживает «купцы».
