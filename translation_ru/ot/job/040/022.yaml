source:
  edition: WLC
  text: יְסֻכֻּ֣/הוּ צֶאֱלִ֣ים צִֽלֲל֑/וֹ יְ֝סֻבּ֗וּ/הוּ עַרְבֵי נָֽחַל־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/022.yaml
  text: The lotus trees cover him with their shade[b][a]; the willows of the brook surround him.
translation:
  language: ru
  text: Лотосовые деревья[a] укрывают его своей тенью; речные ивы[b] окружают его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тенистые деревья»; точный вид растения, обозначенного словом צֶאֱלִים, неизвестен, хотя перевод «лотосовые деревья» традиционен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тополя у вади».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסֻכֻּהוּ
  choice: укрывают его
  rationale: Глагол סכך передаёт значение покрытия или укрытия; «укрывают» естественно выражает здесь защиту тенью.
- source_word: צֶאֱלִים
  choice: лотосовые деревья
  rationale: Традиционное обозначение водного дерева или растения, хотя точная ботаническая идентификация неясна; неопределённость отмечена в сноске.
- source_word: צִלֲלוֹ
  choice: своей тенью
  rationale: צֵל означает «тень». Возвратное притяжательное местоимение естественно связывает тень с собирательно представленными деревьями и сохраняет образ еврейского текста.
- source_word: יְסֻבּוּהוּ
  choice: окружают его
  rationale: סבב прямо означает «окружать, обступать»; выбран естественный и точный русский эквивалент.
- source_word: עַרְבֵי נָחַל
  choice: речные ивы
  rationale: עַרְבֵי может обозначать ивы либо близкие к ним тополя, а נַחַל — поток, русло сезонной реки или вади. «Речные ивы» кратко и естественно передаёт прибрежный образ; возможный вариант отмечен в сноске.
