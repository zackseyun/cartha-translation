  text: תִּמְשֹׁ֣ךְ לִוְיָתָ֣ן בְּ/חַכָּ֑ה וּ֝/בְ/חֶ֗בֶל תַּשְׁקִ֥יעַ לְשֹׁנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/025.yaml
  text: Can you draw out Leviathan with a fishhook[b][a], or press down his tongue with a rope?
translation:
  language: ru
  text: Можешь ли ты вытащить Левиафана рыболовным крючком[a] и верёвкой прижать его язык[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подтянуть Левиафана крючком».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «опустить его язык шнуром» или «удержать его язык верёвкой». Еврейский образ не вполне ясен и, возможно, говорит об усмирении существа через пасть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשֹׁךְ
  choice: вытащить
  rationale: Глагол משׁך в данном контексте означает вытягивание пойманного существа; «вытащить» естественно передаёт образ ловли.
- source_word: לִוְיָתָן
  choice: Левиафана
  rationale: Обозначение передано традиционной русской транслитерацией как имя собственное, без добавления артикля.
- source_word: בְּחַכָּה
  choice: рыболовным крючком
  rationale: חכה обозначает крючок для рыбной ловли; уточнение «рыболовным» ясно передаёт конкретный образ.
- source_word: וּבְחֶבֶל
  choice: верёвкой
  rationale: חבל имеет общее значение верёвки или шнура; «верёвка» сохраняет более тяжёлый и широкий образ, не сводя его к леске.
- source_word: תַּשְׁקִיעַ
  choice: прижать
  rationale: Каузативная форма от שׁקע буквально выражает принуждение опуститься или погрузиться; в сочетании с языком и верёвкой «прижать» даёт понятный образ, не уточняя неясный способ усмирения.
- source_word: לְשֹׁנוֹ
  choice: его язык
  rationale: Еврейский текст прямо называет язык; буквальный образ сохранён, а не заменён более общим словом «пасть».
theological_decisions: []
