  text: כִּֽי ב֭וּל הָרִ֣ים יִשְׂאוּ ל֑/וֹ וְֽ/כָל חַיַּ֥ת הַ֝/שָּׂדֶ֗ה יְשַֽׂחֲקוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/020.yaml
  text: For the mountains bear food for him[b][a], and all the wild animals of the field play there.
translation:
  language: ru
  text: Ведь горы дают ему пищу[a], и там резвятся все полевые звери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «урожай».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит пояснение к предшествующему описанию того, как Бог обеспечивает бегемота пищей; «ведь» естественно передаёт пояснительную силу.
- source_word: בּוּל
  choice: пищу
  rationale: Слово обозначает растительный урожай или то, что произрастает. В данном контексте речь о пропитании животного, поэтому «пища» ясно передаёт смысл, а более буквальный вариант отмечен в сноске.
- source_word: הָרִים
  choice: горы
  rationale: Прямое соответствие еврейскому слову; горная местность представлена как источник пропитания.
- source_word: יִשְׂאוּ לוֹ
  choice: дают ему
  rationale: В сочетании с בּוּל глагол выражает то, что горы производят и предоставляют животному пропитание. «Дают» звучит естественно по-русски и сохраняет образ гор как подателя пищи.
- source_word: וְכָל חַיַּת הַשָּׂדֶה
  choice: и все полевые звери
  rationale: Устойчивое библейское сочетание обозначает диких наземных животных. «Полевые звери» сохраняет образ поля и остаётся понятным в современном литературном русском.
- source_word: יְשַׂחֲקוּ
  choice: резвятся
  rationale: Порода שׂחק здесь описывает свободное, игривое поведение животных. «Резвятся» естественнее применительно к зверям, чем буквальное «играют».
- source_word: שָׁם
  choice: там
  rationale: Прямое пространственное указание на описанную горную местность.
