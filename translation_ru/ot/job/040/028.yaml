  text: Заключит ли он с тобой договор[a], чтобы ты взял его в рабы навсегда[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отсечёт завет с тобой»; это устойчивое древнееврейское выражение означает «заключит договор».'
