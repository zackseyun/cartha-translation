lexical_decisions:
- source_word: טָמְנֵם
  choice: Скрой их
  rationale: Глагол טמן прежде всего означает «скрывать, прятать»; при упоминании праха он может подразумевать погребение, но основной перевод сохраняет исходную образность и не снимает неоднозначность.
- source_word: בֶּעָפָר
  choice: в прахе
  rationale: עָפָר — «пыль, прах, рыхлая земля»; «прах» естественно звучит в возвышенной поэзии и поддерживает контекст смертности.
- source_word: יָחַד
  choice: всех вместе
  rationale: Наречие выражает совместность действия; добавление «всех» естественно передаёт совокупный смысл при местоимении во множественном числе.
- source_word: פְּנֵיהֶם
  choice: их лица
  rationale: Сохранено конкретное буквальное значение «их лица», без замены возможным метонимическим толкованием.
- source_word: חֲבֹשׁ
  choice: свяжи
  rationale: חבשׁ имеет основное значение «связывать, обвязывать»; перевод сохраняет образ ограничения или заключения.
- source_word: בַּטָּמוּן
  choice: в сокрытом месте
  rationale: Вероятно, это субстантивированная форма от טמן — «сокрытое» или «сокрытое место». Такой перевод сохраняет перекличку с начальным глаголом и не вводит более узкое толкование вроде «во тьме».
