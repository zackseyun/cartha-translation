  language: ru
  text: Вот, река бушует — он не тревожится; он уверен, даже когда Иордан устремляется к его пасти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעֲשֹׁק נָהָר
  choice: река бушует
  rationale: Глагол עָשַׁק обычно связан с притеснением или насилием; применительно к реке передаёт её бурный, неистовый напор. «Бушует» естественно выражает этот образ по-русски.
- source_word: לֹא יַחְפּוֹז
  choice: он не тревожится
  rationale: חפז может обозначать поспешность, смятение или испуг. В данном контексте речь о том, что животное не приходит в тревогу перед бурной водой.
- source_word: יִבְטַח
  choice: он остаётся спокоен
  rationale: Буквально глагол выражает уверенность или чувство безопасности. Здесь «остаётся спокоен» естественнее применительно к животному и не привносит идеи сознательного доверия кому-либо.
- source_word: יָגִיחַ יַרְדֵּן אֶל־פִּיהוּ
  choice: Иордан хлынет к самой его пасти
  rationale: יגיח передаёт стремительное извержение или напор воды, а אֶל указывает движение к пасти. Формулировка сохраняет направленность, не утверждая однозначно, что вода входит внутрь пасти.
