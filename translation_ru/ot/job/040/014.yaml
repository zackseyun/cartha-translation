base_translation:
  language: en
  yaml_path: translation/ot/job/040/014.yaml
  text: Then even I will praise you[a], because your right hand can save you.
translation:
  language: ru
  text: И тогда Я восхвалю тебя, потому что твоя правая рука может спасти тебя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасти для тебя»; в еврейском тексте употреблён предлог со значением пользы: «для тебя, тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Тогда и
  rationale: Сочетание продолжает условный вызов из предыдущих стихов и усиливает последующее утверждение; «тогда и» естественно передаёт обе функции.
- source_word: אֲנִי
  choice: Я
  rationale: 'Явно выраженное местоимение сохранено ради эмфазы: говорит сам Бог.'
- source_word: אוֹדֶךָּ
  choice: восхвалю тебя
  rationale: Порода hифиль глагола ידה может обозначать хвалу или признание; при личном объекте и в контексте торжественной уступки уместно «восхвалю тебя», без ослабления до простого «признаю».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующего утверждения.
- source_word: תוֹשִׁיעַ
  choice: может спасти
  rationale: Hифиль от ישׁע означает «спасать, избавлять». В контексте условного испытания форма указывает на способность, которая должна быть доказана действием; модальная передача естественна по-русски.
- source_word: לְךָ
  choice: тебя
  rationale: Предлог לְ выражает пользу или направленность — буквально «для тебя». По-русски сочетание «спасти тебя» идиоматично передаёт смысл, а формальная особенность отмечена в сноске.
- source_word: יְמִינֶךָ
  choice: твоя правая рука
  rationale: Конкретный образ правой руки как силы сохранён, а не заменён толкованием «твоя собственная сила».
theological_decisions:
- issue: Антропоморфный образ силы
  choice: твоя правая рука может спасти тебя
  alternative: твоя собственная сила может спасти тебя
  rationale: Еврейский текст использует конкретный образ правой руки. Его сохранение не снимает напряжения Божьего вызова Иову и не подменяет образ интерпретацией.
- issue: Характер Божьего ответа Иову
  choice: восхвалю тебя
  alternative: признаю за тобой
  rationale: Глагол ידה допускает оттенок признания, но основное значение хвалы сохранено. Необычность мысли о том, что Бог похвалит Иова при выполнении невозможного условия, является частью риторической силы текста.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного тона Божьей речи. Написание «Я» подчёркивает явно выраженное и эмфатическое местоимение; образ «правой руки» оставлен без разъясняющей замены.
