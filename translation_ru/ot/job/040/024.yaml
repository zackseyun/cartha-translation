base_translation:
  language: en
  yaml_path: translation/ot/job/040/024.yaml
  text: Can one capture him before his eyes? Can one pierce his nose with snares?[a][b]
translation:
  language: ru
  text: Можно ли схватить его у него на глазах? Можно ли пронзить ему нос силками?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Схватит ли кто его у него на глазах? Пронзит ли ему нос ловушками?» Еврейская фраза кратка и трудна; формы глаголов можно понять и менее обобщённо.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «ловушками» или «силками». В традиционных переводах встречаются «крюки», что лучше согласуется с образом прокалывания, однако еврейское слово обычно обозначает ловушку, западню или силок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: у него на глазах
  rationale: 'Предлог ב при слове «глаза» здесь естественно понимать идиоматически: попытка схватить животное предпринимается открыто, когда оно всё видит. Русское выражение «у него на глазах» точно и естественно передаёт этот смысл.'
- source_word: יִקָּחֶנּוּ
  choice: можно ли схватить его
  rationale: לקח буквально означает «взять», но в контексте поимки могучего животного уместнее «схватить». Модальная риторическая формулировка соответствует окружающему Божьему вызову, хотя сама еврейская фраза синтаксически сжата.
- source_word: בְּמוֹקְשִׁים
  choice: силками
  rationale: מוֹקֵשׁ обычно обозначает ловушку, западню или силок, а не крюк. «Силками» сохраняет обычное лексическое значение и намеренно не сглаживает необычное сочетание с глаголом «пронзить».
- source_word: יִנְקָב
  choice: пронзить
  rationale: נקב означает проколоть, пробуравить или пронзить. «Пронзить» звучит ясно и достойно и передаёт насильственное прокалывание носа животного.
- source_word: אָף
  choice: нос
  rationale: Здесь אַף имеет конкретное анатомическое значение «нос», а не обычное переносное значение «гнев». «Нос» шире и точнее, чем возможное «ноздря».
theological_decisions:
- issue: Синтаксическая форма двух кратких еврейских клауз
  choice: Передать их как риторические вопросы о возможности поймать животное
  alternative: «Он схватит его у него на глазах; силками пронзит ему нос» или «Схватит ли он его…?»
  rationale: Контекст Божьего вызова поддерживает риторические вопросы, но в еврейском нет явного вопросительного показателя и субъект не назван; поэтому неоднозначность отмечена в сноске, а не превращена в богословски определённое утверждение.
translation_notes:
  register: Современный литературный русский язык, сжатый и риторичный. Повтор «Можно ли» делает подразумеваемый вопрос понятным обычному читателю; необычный образ «пронзить… силками» сохранён и пояснён, а не заменён более гладким, но лексически менее вероятным «крюками».
