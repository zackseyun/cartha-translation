  text: Он — первый среди творений Бога[a]; пусть Тот, кто создал его, поднесёт Свой меч[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он — главный среди путей Бога».'
    reason: lexical_alternative
