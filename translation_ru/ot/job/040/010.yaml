  text: עֲדֵ֥ה נָ֣א גָֽא֣וֹן וָ/גֹ֑בַהּ וְ/ה֖וֹד וְ/הָדָ֣ר תִּלְבָּֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/010.yaml
  text: Adorn yourself[a], please, with majesty and loftiness, and clothe yourself with splendor and honor.
translation:
  language: ru
  text: 'Укрась же себя величием и возвышенностью,

    облекись в великолепие и достоинство.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲדֵה
  choice: Укрась себя
  rationale: Повелительная форма передаёт образ возложения на себя украшения и естественно соотносится с последующим «облекись».
- source_word: נָא
  choice: же
  rationale: Частица здесь усиливает побуждение; русское «же» естественно передаёт настойчивый оттенок в контексте Божьего вызова Иову, тогда как «пожалуйста» звучало бы неуместно в возвышенной речи.
- source_word: גָאוֹן
  choice: величие
  rationale: В данном контексте слово обозначает возвышенное, царственное величие, а не нравственно отрицательную гордость.
- source_word: גֹּבַהּ
  choice: возвышенность
  rationale: Буквально «высота»; в параллели с גָאוֹן выражает возвышенное положение и грандиозность, сохраняя возможную смысловую напряжённость без явно отрицательного «высокомерия».
- source_word: הוֹד
  choice: великолепие
  rationale: Передаёт зримый блеск и царственную пышность, не дублируя «величие».
- source_word: הָדָר
  choice: достоинство
  rationale: Слово может обозначать величавость, почёт и красоту; «достоинство» сохраняет оттенок почётного, величавого облика рядом с «великолепием».
- source_word: תִּלְבָשׁ
  choice: облекись
  rationale: Сохраняет явную метафору одежды и продолжает побудительное значение первой императивной формы.
theological_decisions:
- issue: Следует ли передавать גָאוֹן и גֹּבַהּ как нравственно отрицательные «гордость» и «высокомерие» или как признаки царственного величия
  choice: Переданы как «величие и возвышенность» — атрибуты грандиозности и власти.
  alternative: «Гордость и высокомерие» либо «гордость и достоинство».
  rationale: В ближайшем контексте Бог предлагает Иову явить присущие верховному Владыке величие, власть и способность унизить гордых. Параллель с הוֹד и הָדָר и метафора облачения поддерживают значение царственного великолепия, хотя потенциальный оттенок превознесённости полностью не устраняется.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической Божьей речи. Сохранены две параллельные строки и метафоры украшения и облачения; избегнуты как архаическое «уберись», так и разговорное «нарядись».
