  text: הֲ/תָשִׂ֣ים אַגְמ֣וֹן בְּ/אַפּ֑/וֹ וּ֝/בְ/ח֗וֹחַ תִּקּ֥וֹב לֶֽחֱי/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/026.yaml
  text: Can you put a rope through his nose[b][a], or pierce his jaw with a hook?
translation:
  language: ru
  text: Проденешь ли ты верёвку ему в нос[a] или пронзишь крюком его челюсть[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камыш ему в нос». Еврейское слово буквально означает тростник или камыш, но здесь, вероятно, имеется в виду сделанная из камыша верёвка.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его щёку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָשִׂים
  choice: Проденешь ли ты
  rationale: Вопросительная частица הֲ и форма глагола שׂים образуют риторический вызов. «Проденешь ли ты» естественно передаёт действие помещения верёвки в нос и сохраняет вопросительную форму.
- source_word: אַגְמוֹן
  choice: верёвку
  rationale: Слово буквально обозначает тростник или камыш, но здесь, вероятнее всего, имеется в виду изготовленная из него верёвка, служащая для удержания животного.
- source_word: בְּאַפּוֹ
  choice: ему в нос
  rationale: אַף означает «нос» или «ноздря». В сочетании с глаголом и предметом естественный русский образ — продеть верёвку в нос.
- source_word: וּבְחוֹחַ
  choice: крюком
  rationale: חוֹחַ может означать «колючка» или «крюк». В контексте поимки и удержания крупного животного «крюк» лучше соответствует образу.
- source_word: תִּקּוֹב
  choice: пронзишь
  rationale: Глагол выражает прокалывание или пробуравливание; «пронзишь» кратко и выразительно передаёт это действие.
- source_word: לֶחֱיוֹ
  choice: его челюсть
  rationale: לְחִי может обозначать щёку или челюсть. При упоминании крюка «челюсть» наиболее ясно передаёт анатомический и функциональный смысл.
