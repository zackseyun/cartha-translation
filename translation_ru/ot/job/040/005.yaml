  text: I have spoken once[a], and I will not answer; twice, and I will add nothing more.
translation:
  language: ru
  text: Один раз я сказал[a] — и не стану отвечать; дважды — и ничего больше не добавлю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Один раз я сказал, но отвечать не стану; дважды — но дальше не пойду». Еврейский глагол, буквально означающий «добавлять», может также передавать смысл продолжения или повторения действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: однажды
  rationale: Женская форма числительного «один» употреблена наречно в параллели с «дважды»; «однажды» естественно передаёт значение «один раз».
- source_word: דִּבַּרְתִּי
  choice: я говорил
  rationale: Перфект указывает на уже совершившуюся речь Иова. Русское прошедшее время естественно передаёт это без излишнего уточнения вида.
- source_word: וְלֹא אֶעֱנֶה
  choice: и не стану отвечать
  rationale: Глагол ענה означает «отвечать». Форма с отрицанием выражает намерение Иова более не давать ответа; союз сохранён без навязывания явно противительного смысла.
- source_word: וּשְׁתַּיִם
  choice: дважды
  rationale: Числительное «два» употреблено наречно и образует параллель с אַחַת — «однажды».
- source_word: וְלֹא אוֹסִיף
  choice: и больше не продолжу
  rationale: Hифиль יסף может означать «добавлять», «продолжать» или «делать снова». В контексте подразумевается, что Иов не продолжит говорить; формулировка сохраняет недосказанность объекта.
