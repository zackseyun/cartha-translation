  yaml_path: translation/ot/job/040/004.yaml
  text: Look[a], I am insignificant; what can I answer you? I put my hand over my mouth.
translation:
  language: ru
  text: Вот, я незначителен[a]. Что мне отвечать Тебе? Я положил руку на уста свои.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я мал и незначителен»; традиционно: «я ничтожен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание и вводит внезапное признание Иова; «вот» сохраняет её силу в естественном литературном русском.
- source_word: קַלֹּתִי
  choice: я ничтожен
  rationale: Форма от קלל выражает малость, незначительность, малый вес или достоинство. В данном контексте «ничтожен» передаёт самоуничижение Иова, но сноска оговаривает смысл, чтобы не приписывать слову однозначное признание нравственной порочности.
- source_word: מָה אֲשִׁיבֶךָּ
  choice: Что мне отвечать Тебе?
  rationale: מָה вводит прямой риторический вопрос, а Hiphil שוב здесь означает «отвечать». Конструкция с «мне» естественно передаёт невозможность или неуместность ответа, не добавляя явного модального глагола.
- source_word: יָדִי שַׂמְתִּי לְמוֹ פִי
  choice: Я положил руку на уста свои
  rationale: Буквальный образ обозначает молчание и смирение. «Уста свои» сохраняет достоинство поэтической речи и естественный для русского библейского стиля порядок слов.
theological_decisions:
- issue: Следует ли понимать קַלֹּתִי как нравственно окрашенное самоосуждение
  choice: я ничтожен
  alternative: я порочен; я мал и незначителен
  rationale: Еврейское слово прежде всего указывает на малость, лёгкость или незначительность. Основной текст сохраняет сильное самоуничижение Иова, а сноска предотвращает чрезмерно узкое понимание как признания нравственной испорченности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Прописное «Тебе» обозначает обращение к Богу по принятой русской издательской традиции, не меняя смысла исходного текста.
