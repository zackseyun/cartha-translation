  text: הָ֭פֵץ עֶבְר֣וֹת אַפֶּ֑/ךָ וּ/רְאֵ֥ה כָל גֵּ֝אֶ֗ה וְ/הַשְׁפִּילֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/011.yaml
  text: Pour out the overflowings of your anger[c][b][a], and look on everyone who is proud and bring him low.
translation:
  language: ru
  text: Излей потоки Своего гнева[a] и взгляни на каждого гордеца — унизь его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Рассей вспышки Своей ярости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵץ
  choice: Излей
  rationale: Повелительная форма передаёт сильное высвобождение гнева. В сочетании с עֶבְרוֹת русское «излей» естественно выражает образ бурно изливающейся ярости, хотя возможен и пространственный оттенок «рассей».
- source_word: עֶבְרוֹת
  choice: потоки
  rationale: Множественное число обозначает бурные проявления или переливы ярости. «Потоки» сохраняет множественность и поддерживает образ, естественный с глаголом «излей».
- source_word: אַפֶּךָ
  choice: Своего гнева
  rationale: אַף буквально связано с «носом», но регулярно служит древнееврейской идиомой гнева; буквальный перевод затемнил бы смысл.
- source_word: וּרְאֵה
  choice: и взгляни
  rationale: Повеление означает направить взгляд на названных далее людей; «взгляни» звучит естественно и сохраняет активную направленность действия.
- source_word: כָל גֵּאֶה
  choice: на каждого гордеца
  rationale: 'Сочетание כָל с субстантивированным прилагательным в единственном числе имеет распределительный смысл: речь идёт о каждом гордом человеке.'
- source_word: וְהַשְׁפִּילֵהוּ
  choice: унизь его
  rationale: Hифиль от שׁפל означает сделать низким, низложить или унизить. Единственное число местоименного объекта сохраняет индивидуальное отношение к каждому гордецу.
