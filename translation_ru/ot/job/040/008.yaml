  yaml_path: translation/ot/job/040/008.yaml
  text: Would you even annul my justice? Would you condemn me so that you may be justified?[a]
translation:
  language: ru
  text: Неужели ты отменишь Моё правосудие[a], осудишь Меня, чтобы самому оказаться правым?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой суд». Еврейское слово мишпа́т может означать суд, судебное решение, правосудие или законное право.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאַף
  choice: неужели
  rationale: Сочетание вопросительной частицы с אַף придаёт вопросу усиленный, изумлённо-обличительный оттенок; «неужели» естественно передаёт его по-русски.
- source_word: תָּפֵר
  choice: отменишь
  rationale: Hiphil от פרר означает лишить силы, сделать недействительным. «Отменишь» сохраняет юридическую направленность и понятно современному читателю.
- source_word: מִשְׁפָּטִי
  choice: Моё правосудие
  rationale: מִשְׁפָּט может обозначать суд, судебное решение, правосудие или законное право. В контексте речь идёт о справедливости Божьего суда и управления; «правосудие» сохраняет одновременно нравственный и судебный смысл.
- source_word: תַּרְשִׁיעֵנִי
  choice: обвинишь Меня
  rationale: 'Hiphil от רשע имеет судебный смысл: признать виновным, осудить. «Обвинишь Меня» естественно сочетается с последующим стремлением Иова доказать собственную правоту, не утверждая непременно формального вынесения приговора.'
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт выраженное оборотом значение цели или предполагаемого результата.
- source_word: תִּצְדָּק
  choice: самому оказаться правым
  rationale: Qal от צדק в судебном контексте означает быть или оказаться правым, быть оправданным. Такая формулировка сохраняет противопоставление между обвинением Бога и самооправданием Иова.
theological_decisions:
- issue: Судебный или обобщённо-нравственный характер стиха
  choice: 'Сохранена судебная лексика: «правосудие… обвинишь… оказаться правым».'
  alternative: «Отвергнешь Мою справедливость… выставишь Меня неправым, чтобы доказать свою правоту».
  rationale: מִשְׁפָּט, רשע и צדק образуют судебно-правовой смысловой ряд. Его сохранение не смягчает напряжённость Божьего вопроса к Иову.
- issue: Значение מִשְׁפָּטִי
  choice: Моё правосудие
  alternative: Мой суд
  rationale: «Правосудие» указывает на справедливый характер Божьего суда и управления, тогда как не менее возможное «Мой суд» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой Божьей речи. Риторический вопрос передан одной фразой; прописные местоимения относятся к Богу согласно принятой русской библейской издательской традиции.
