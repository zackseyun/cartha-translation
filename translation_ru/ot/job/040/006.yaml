  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/040/006.yaml
  text: Then Yahweh answered Job out of the storm and said:[a]
translation:
  language: ru
  text: Тогда Яхве ответил Иову из бури и сказал:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из вихря».'
    reason: Лексема סְעָרָה допускает как широкое значение «буря», так и более конкретное «вихрь».
lexical_decisions:
- source_word: וַיַּעַן
  choice: Тогда ... ответил
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт переход к следующему речевому эпизоду, а ענה здесь означает «ответить».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, выраженное тетраграмматоном, без замены его титулом.
- source_word: אֶת אִיּוֹב
  choice: Иову
  rationale: 'Хотя אֵת формально маркирует прямое дополнение, современное русское управление требует дательного падежа: «ответил Иову».'
- source_word: מִן סְעָרָה
  choice: из бури
  rationale: סְעָרָה обозначает бурю, вихрь или ураган; «буря» сохраняет широкий смысл и естественно звучит по-русски. Более конкретное «вихрь» отмечено в сноске.
- source_word: וַיֹּאמַר
  choice: 'и сказал:'
  rationale: Стандартная древнееврейская формула введения прямой речи; двоеточие указывает на продолжение речи в следующем стихе.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык; повествовательная формула сохранена в dignified, ясной форме. Выражение «ответил Иову» соответствует нормам русского управления, а двоеточие вводит речь следующего стиха.
