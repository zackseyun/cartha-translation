  text: הֲ֭/רֹב עִם שַׁדַּ֣י יִסּ֑וֹר מוֹכִ֖יחַ אֱל֣וֹהַּ יַעֲנֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/040/002.yaml
  text: Will one who contends with the Almighty correct him? Let the one who argues with God answer it[a][b].
translation:
  language: ru
  text: Станет ли тот, кто спорит со Всемогущим, исправлять Его? Пусть обличающий Бога ответит на это[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели придирающийся ко Всемогущему станет наставлять или обличать Его?» Еврейские слова сочетают оттенки судебного спора и исправления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть ответит Ему» либо «пусть даст ответ». Еврейский суффикс может указывать на предмет спора, а не непосредственно на Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֹב
  choice: Станет ли тот, кто спорит
  rationale: Форма от ריב передаёт спор, тяжбу или оспаривание; личная конструкция естественна по-русски и сохраняет судебно-полемический оттенок.
- source_word: עִם
  choice: со
  rationale: Буквально «с/со»; при глаголе «спорить» контекстуально выражает противостояние, не усиливая его добавочным «против».
- source_word: שַׁדַּי
  choice: Всемогущим
  rationale: Устоявшаяся русская передача божественного титула שדי, уместная для возвышенного регистра книги Иова.
- source_word: יִסּוֹר
  choice: исправлять Его
  rationale: Глагол יסר может означать наставлять, вразумлять, исправлять или наказывать. Здесь субъектом по синтаксису и параллелизму выступает спорящий человек, дерзающий исправлять Бога.
- source_word: מוֹכִיחַ
  choice: обличающий
  rationale: Причастие от יכח совмещает значения обличения, упрёка и ведения спора. «Обличающий» сохраняет его корректирующую силу и связь с предыдущим «исправлять».
- source_word: אֱלוֹהַּ
  choice: Бога
  rationale: Обычная передача поэтической формы единственного числа для обозначения Бога в книге Иова.
- source_word: יַעֲנֶנָּה
  choice: ответит на это
  rationale: Глагол означает «отвечать»; суффикс женского рода, вероятнее всего, указывает на подразумеваемое дело, обвинение или сказанное, а не прямо на Бога. «На это» естественно сохраняет такую отсылку.
theological_decisions:
- issue: Кто кого исправляет в первом полустишии
  choice: Человек, спорящий со Всемогущим, представлен как дерзающий исправлять Его.
  alternative: Спорящий со Всемогущим должен принять вразумление.
  rationale: 'Синтаксис и параллелизм со вторым полустишием лучше поддерживают первое прочтение: тот же человеческий оппонент спорит, исправляет или обличает и затем призывается ответить.'
- issue: К кому или к чему относится суффикс в יַעֲנֶנָּה
  choice: 'К подразумеваемому предмету спора или только что высказанному требованию: «ответит на это».'
  alternative: 'Непосредственно к Богу: «ответит Ему».'
  rationale: Женский суффикс не согласуется непосредственно с мужским אֱלוֹהַּ, поэтому вероятнее отсылка к подразумеваемому высказыванию или делу; сжатость еврейского текста, однако, требует отметить альтернативы.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Риторическое «Станет ли» передаёт вызов без архаизации; прописное «Его» ясно обозначает референта. Оба маркера сносок присутствуют в основном тексте.
