  text: Then Job answered Yahweh and said:[a]
translation:
  language: ru
  text: Тогда Иов ответил Яхве и сказал:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ»; возможные передачи: «Яхве» или «Иегова».'
    reason: Указание формы Божьего имени в еврейском тексте и известных вариантов его передачи.
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Форма Qal wayyiqtol от ענה вводит ответ Иова; «ответил» естественно и точно передаёт повествовательную формулу.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, функция которого передаётся русским падежным оформлением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: 'Сохранены оба глагола обычной древнееврейской формулы введения прямой речи: «ответил… и сказал».'
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В исходном тексте стоит тетраграмматон как собственное имя. «Яхве» является современной научно обоснованной русской передачей; примечание отмечает варианты, не подменяя имя титулом.
translation_notes:
  register: Современный литературный русский язык; сохранена торжественная библейская формула «ответил… и сказал», хотя в обычной речи она может восприниматься как избыточная.
