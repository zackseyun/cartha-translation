lexical_decisions:
- source_word: עַל
  choice: о
  rationale: В сочетании с אֲכַזֵּב и מִשְׁפָּטִי предлог естественно передаёт значение «о, относительно», вводя предмет предполагаемой лжи.
- source_word: מִשְׁפָּטִי
  choice: о своей правоте
  rationale: מִשְׁפָּט может обозначать право, судебное дело или справедливое притязание. «Своя правота» естественно передаёт здесь утверждение Иова о справедливости его позиции, сохраняя юридический оттенок контекста.
- source_word: אֲכַזֵּב
  choice: неужели мне лгать
  rationale: Форма от כזב допускает значение «лгать, говорить ложь». По контексту реплики она передана как риторический вопрос; возможное утверждение «меня считают лжецом» сохранено в сноске.
- source_word: אָנ֖וּשׁ
  choice: неисцелима
  rationale: Прилагательное обозначает неизлечимое, безнадёжное состояние и выражает крайнюю тяжесть страдания.
- source_word: חִצִּי
  choice: моя рана
  rationale: Буквально «моя стрела», но здесь стрела метонимически или метафорически указывает на нанесённую ею рану либо постигшее Иова поражение. Образ исходного текста отмечен в сноске.
- source_word: בְלִי
  choice: хотя за мной нет
  rationale: Исходное выражение обозначает отсутствие чего-либо; союз «хотя» естественно выявляет подразумеваемое противопоставление между тяжестью страдания и отсутствием преступления.
- source_word: פָשַׁע
  choice: преступления
  rationale: Слово обозначает серьёзный проступок, преступление или мятеж. «Преступление» сохраняет его нравственно-правовой вес и не сводит утверждение к общему чувству невиновности.
theological_decisions:
- issue: Синтаксис первой части как цитируемого Елиуем заявления Иова
  choice: 'Риторический вопрос: «Неужели мне лгать о своей правоте?»'
  alternative: 'Утверждение: «Вопреки моей правоте меня считают лжецом».'
  rationale: 'Краткий еврейский оборот допускает оба понимания. Риторический вопрос согласуется с протестом Иова: отказаться от утверждения о собственной правоте значило бы солгать. Альтернативный синтаксический разбор сохранён в сноске, чтобы не устранять подлинную неоднозначность.'
- issue: Образ חִצִּי и незаслуженность страдания
  choice: Передать предполагаемый смысл образа как «моя рана», сохранив буквальную «стрелу» в сноске.
  alternative: 'Буквально: «моя стрела неисцелима».'
  rationale: В контексте речь идёт о тяжёлом поражении или страдании Иова, которое он связывает с отсутствием преступления. Перевод не утверждает окончательного богословского суждения о его безгрешности, а точно сохраняет содержание цитируемого протеста.
