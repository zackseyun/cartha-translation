  yaml_path: translation/ot/job/034/015.yaml
  text: all flesh would perish together[a], and man would return to dust.
translation:
  language: ru
  text: 'всякая плоть разом погибла бы,

    и человек[a] возвратился бы в прах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человечество». Еврейское слово אָדָם стоит в единственном числе, но может собирательно обозначать всё человечество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְוַע
  choice: погибла бы
  rationale: Глагол גוע обозначает смерть, угасание жизни. «Погибла бы» естественно передаёт это значение и условное следствие, продолжающее мысль предыдущего стиха.
- source_word: כָּל בָּשָׂר
  choice: всякая плоть
  rationale: Сохранён ёмкий древнееврейский образ, охватывающий смертных живых существ; в данном параллелизме особое внимание обращено на человечество.
- source_word: יָחַד
  choice: разом
  rationale: Наречие подчёркивает одновременность и всеобщность происходящего; «разом» кратко и естественно передаёт обе стороны смысла.
- source_word: אָדָם
  choice: человек
  rationale: Единственное число сохранено, при этом «человек» здесь имеет родовое, собирательное значение и обозначает человечество.
- source_word: עַל עָפָר
  choice: в прах
  rationale: Буквально предлог означает «на», однако в сочетании с «возвратиться» русская формула «возвратиться в прах» естественно передаёт образ возвращения человека к земному праху.
- source_word: יָשׁוּב
  choice: возвратился бы
  rationale: שוב обычно значит «возвращаться». Сослагательная форма передаёт условное следствие, зависящее от предыдущего стиха.
theological_decisions:
- issue: Родовое значение אָדָם
  choice: человек
  alternative: человечество
  rationale: «Человек» сохраняет грамматическое единственное число и связь с библейским образом возвращения в прах, не исключая собирательного смысла. Возможное явное выражение коллективного значения дано в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической речи и ключевого библейского образа «плоти» и «праха». Перенос строки отражает параллелизм древнееврейского стиха.
