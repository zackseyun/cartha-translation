  text: What I do not see[a], you teach me; if I have done wrong[b], I will not do it again.
translation:
  language: ru
  text: Научи меня тому, чего я не вижу[a]; если я совершил зло, больше не буду этого делать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Помимо того, что я вижу, научи меня». Еврейская фраза эллиптична; возможен также смысл: «Чего я не вижу, покажи мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не прибавлю», то есть «не стану продолжать» или «не повторю этого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּלְעֲדֵי אֶחֱזֶה
  choice: чего я не вижу
  rationale: 'Еврейское выражение эллиптично. Такой перевод сохраняет образ видения и естественно передаёт подразумеваемый смысл: то, чего говорящий сам не замечает или не понимает.'
- source_word: אַתָּה הֹרֵנִי
  choice: тому Ты научи меня
  rationale: Каузативная форма глагола ירה обычно означает «учить, наставлять». Добавленное «тому» делает связь с предыдущей фразой естественной по-русски, не меняя смысла.
- source_word: אִם
  choice: если
  rationale: Союз вводит условие и не требует более неопределённого «ли».
- source_word: עָוֶל פָּעַלְתִּי
  choice: я поступил неправедно
  rationale: עָוֶל обозначает неправду, зло или несправедливость, а פעל — совершение действия. Формулировка достаточно широка и не уточняет характер проступка сверх еврейского текста.
- source_word: לֹא אֹסִיף
  choice: больше так не поступлю
  rationale: Буквально «не прибавлю» здесь идиоматически означает, что говорящий не станет продолжать или повторять проступок. Русский перевод выражает эту решимость ясно и естественно.
theological_decisions:
- issue: Слова говорящего как выражение готовности принять Божье наставление и прекратить неправедные поступки
  choice: Передать просьбу о наставлении и обещание не повторять неправедного поступка без введения специальной богословской терминологии.
  alternative: 'Перевести буквально: «Помимо того, что я вижу, наставь меня; если я совершил неправду, не прибавлю».'
  rationale: Текст выражает смиренную готовность учиться и отказаться от неправедного поведения, но сам по себе не формулирует более широкого учения о покаянии или виновности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским звучанием. Инверсия «тому Ты научи меня» сохраняет поэтическую сжатость и подчёркивает обращение к Богу.
