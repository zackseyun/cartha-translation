  text: He shatters the mighty without investigation[a], and sets others in their place.
translation:
  language: ru
  text: Он сокрушает могущественных, не исследуя их[a], и ставит других на их место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «без исследования», «без разбирательства». Буквально по-еврейски: «не исследование (разыскание)». В контексте это может означать, что Богу не требуется длительное исследование, прежде чем Он низлагает могущественных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹעַ
  choice: сокрушает
  rationale: Глагол רעע в породе хифиль передаёт решительное разрушение или низвержение; «сокрушает» сохраняет силу образа.
- source_word: כַּבִּירִים
  choice: могущественных
  rationale: Слово обозначает влиятельных и сильных людей, вероятно правителей или представителей знати; этот вариант не сужает значение до конкретной должности.
- source_word: לֹא חֵקֶר
  choice: без расследования
  rationale: Буквально сочетает отрицание со значением «исследование, разыскание». Формулировка сохраняет краткость и неоднозначность еврейского выражения; пояснение о том, что Богу не требуется длительное разбирательство, вынесено в сноску.
- source_word: וַיַּעֲמֵד
  choice: ставит
  rationale: Хифиль от עמד означает «поставить, установить»; в сочетании с последующей фразой естественно передаёт назначение замены.
- source_word: אֲחֵרִים
  choice: других
  rationale: Неопределённое множественное число обозначает иных людей, заменяющих низложенных.
- source_word: תַּחְתָּם
  choice: на их место
  rationale: 'Хотя буквальное пространственное значение — «под ними», здесь оборот выражает замещение: другие занимают место низложенных.'
theological_decisions:
- issue: Подразумеваемое подлежащее глаголов
  choice: 'Подлежащее — Бог: «Он сокрушает… и ставит…»'
  alternative: Оставить подлежащее формально невыраженным либо понять оборот безлично.
  rationale: В контексте речи Елиуя речь идёт о Божьем суде над правителями; русское местоимение ясно передаёт подразумеваемого в еврейском тексте деятеля, не добавляя нового богословского утверждения.
- issue: Смысл выражения לֹא חֵקֶר
  choice: Сохранить формулировку «без расследования» и пояснить её в сноске.
  alternative: Истолковать прямо в тексте как «не нуждаясь в расследовании» или «без долгого разбирательства».
  rationale: 'Еврейский оборот краток и допускает напряжение: он может описывать отсутствие исследования либо отсутствие нужды в нём. Основной текст не устраняет эту неоднозначность, а контекстуальное понимание сообщается в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Могущественных» точнее социально-политического смысла, чем более общее «сильных»; синтаксис краток и сохраняет параллелизм двух действий.
