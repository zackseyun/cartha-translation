  yaml_path: translation/ot/job/034/035.yaml
  text: Job speaks without knowledge[a], and his words are without understanding.
translation:
  language: ru
  text: Иов говорит без знания, и слова его — без понимания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְדַעַת
  choice: не со знанием
  rationale: Сочетание ב с абстрактным существительным обозначает образ или качество речи. Формулировка сохраняет близость к еврейскому выражению и его параллелизм со второй строкой.
- source_word: יְדַבֵּר
  choice: говорит
  rationale: Имперфект здесь естественно понимать как настоящее время в оценочном высказывании Елиуя, а не как указание прежде всего на будущее.
- source_word: דְבָרָיו
  choice: слова его
  rationale: Прямой эквивалент множественного דְבָרִים; порядок слов поддерживает возвышенный поэтический регистр без архаизации.
- source_word: בְהַשְׂכֵּיל
  choice: без понимания
  rationale: Форма от שׂכל передаёт разумение, проницательность или осмысленность. «Без понимания» естественно по-русски и сохраняет смысловой параллелизм со «знанием».
- source_word: לֹא
  choice: не / без
  rationale: В первой строке отрицание передано формально как «не», во второй — идиоматически как «без»; оба варианта отражают отрицание способа речи в конструкциях с ב.
