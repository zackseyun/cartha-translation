  text: so that a godless man should not reign[a], nor be snares to the people.
translation:
  language: ru
  text: чтобы не царствовал нечестивец[a] и народ не попадал в сети.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы нечестивец не царствовал, чтобы народ не попадал в сети». Еврейский текст здесь предельно сжат и допускает несколько близких переводов, построенных вокруг слов «царствовать» и «сети».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִמְּלֹךְ
  choice: чтобы не царствовал
  rationale: Сочетание предлога מִן с инфинитивом מלך в данном контексте передаёт предотвращение или цель как продолжение мысли предыдущего стиха; по-русски это естественно выражается конструкцией «чтобы не царствовал».
- source_word: אָדָם
  choice: не выражено отдельно
  rationale: Слово אָדָם обозначает здесь отдельного человека-правителя, однако в русском существительное «нечестивец» уже включает это значение, поэтому добавление «человек» было бы избыточным.
- source_word: חָנֵף
  choice: нечестивец
  rationale: В литературе мудрости חָנֵף обозначает безбожного, нравственно порочного человека, а не просто лицемера; «нечестивец» сохраняет нравственно-религиозную окраску и соответствует возвышенному контексту.
- source_word: מִמֹּקְשֵׁי
  choice: и не было ловушек для
  rationale: Буквально выражение связано с «ловушками/силками», но синтаксис предельно сжат. Предложенная формулировка сохраняет множественное число и возможный превентивный смысл, не превращая образ без достаточного основания в глагол «порабощать» или «улавливать».
- source_word: עָם
  choice: народа
  rationale: עָם обозначает общество, находящееся под властью правителя; родительный падеж после «для» естественно передаёт народ как тех, кому угрожают ловушки.
theological_decisions:
- issue: Связь двух сжатых оборотов и цель Божьего действия
  choice: Бог действует так, чтобы нечестивец не царствовал и народу не грозили ловушки.
  alternative: «Чтобы нечестивец не царствовал, чтобы народ не попал в ловушку»; либо «из-за ловушек народа».
  rationale: В контексте стиха 29 наиболее связное прочтение видит здесь цель или результат Божьего судебного действия. Однако еврейский синтаксис допускает несколько близких толкований, поэтому текст не называет прямо ни устроителя ловушек, ни точную связь между двумя оборотами; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, поэтическим строем. «Нечестивец» сохраняет религиозно-нравственную силу חָנֵף, а конструкция «не было ловушек для народа» намеренно не уточняет того, чего не уточняет сжатый еврейский текст.
