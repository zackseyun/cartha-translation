source:
  edition: WLC
  text: לָ/כֵ֤ן אַ֥נֲשֵׁ֥י לֵבָ֗ב שִׁמְע֫וּ לִ֥/י חָלִ֖לָ/ה לָ/אֵ֥ל מֵ/רֶ֗שַׁע וְ/שַׁדַּ֥י מֵ/עָֽוֶל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/010.yaml
  text: 'Therefore[a], men of understanding, listen to me: far be it from God to do wickedness[b], and from the Almighty to do wrong.'
translation:
  language: ru
  text: 'Итак, мужи разумные[a], послушайте меня: немыслимо, чтобы Бог творил зло[b], и чтобы Всемогущий поступал несправедливо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужи сердца»; в древнееврейском языке сердце может обозначать разум и способность рассуждать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «далеко от Бога зло, и от Всемогущего — несправедливость». Древнееврейское выражение подчёркивает, что такое совершенно немыслимо применительно к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Итак
  rationale: Связывает призыв с предшествующим рассуждением и естественно передаёт выводный оттенок в современном русском.
- source_word: אַנֲשֵׁי לֵבָב
  choice: мужи разумные
  rationale: Буквально «мужи сердца»; в древнееврейском «сердце» здесь обозначает разумение и рассудительность. Сохранены мужской род и возвышенный поэтический регистр.
- source_word: שִׁמְעוּ לִי
  choice: послушайте меня
  rationale: Передаёт повеление внимательно выслушать говорящего; это естественная русская конструкция.
- source_word: חָלִילָה
  choice: немыслимо
  rationale: Выражает решительное отвержение самой возможности; русский эквивалент сохраняет силу идиомы без архаической буквальности.
- source_word: לָאֵל מֵרֶשַׁע
  choice: чтобы Бог творил зло
  rationale: Древнееврейская конструкция выражает полное исключение зла применительно к Богу; глагольное раскрытие делает подразумеваемое действие ясным.
- source_word: וְשַׁדַּי
  choice: и чтобы Всемогущий
  rationale: שַׁדַּי передано как значимый божественный титул, а не транслитерировано как имя.
- source_word: מֵעָוֶל
  choice: поступал несправедливо
  rationale: עָוֶל обозначает неправду и несправедливость; выбранная формулировка естественна и сохраняет параллелизм с первым полустишием.
theological_decisions:
- issue: Передача божественного титула שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: В данном контексте это божественный титул; перевод передаёт его смысл русскому читателю и соответствует употреблению в книге Иова.
- issue: Род выражения אַנֲשֵׁי לֵבָב
  choice: мужи разумные
  alternative: люди разумные / обладающие разумом
  rationale: Древнееврейское выражение грамматически стоит в мужском роде; перевод сохраняет это, одновременно раскрывая идиоматическое значение слова «сердце».
- issue: Синтаксис חָלִילָה לָאֵל מֵרֶשַׁע
  choice: немыслимо, чтобы Бог творил зло
  alternative: далеко от Бога зло
  rationale: Выбран ясный русский способ выразить решительное отрицание, не превращая высказывание в отвлечённое утверждение о пространственной или метафорической удалённости.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи книги Иова. «Мужи» сохраняет мужской род и торжественный характер обращения; остальная фраза избегает ненужной архаики.
