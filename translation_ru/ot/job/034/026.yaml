  yaml_path: translation/ot/job/034/026.yaml
  text: He strikes them as wicked people in full view[a].
translation:
  language: ru
  text: Как нечестивцев, Он поражает их у всех на виду[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он поражает их за нечестие у всех на виду». Трудное начальное выражение может указывать не на то, кем они являются при наказании, а на причину их наказания.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת
  choice: как
  rationale: 'В трудном сочетании תַּחַת רְשָׁעִים предлог передаёт положение, в котором эти люди подвергаются публичному наказанию: с ними поступают как с нечестивцами. Возможное причинное понимание сохранено в сноске.'
- source_word: רְשָׁעִים
  choice: нечестивцев
  rationale: Субстантивированное прилагательное во множественном числе обозначает нечестивых людей; форма «нечестивцев» естественно сочетается с «как» и не вводит лишнего уточнения.
- source_word: סְפָקָם
  choice: Он поражает их
  rationale: Глагол выражает нанесение удара; «поражает» сохраняет судебно-карательный оттенок, не добавляя прямо не выраженного результата вроде гибели.
- source_word: בִּמְקוֹם רֹאִים
  choice: у всех на виду
  rationale: Буквально сочетание связано с местом видящих; идиоматический русский оборот естественно передаёт смысл публичности наказания без создания второй самостоятельной локализации.
theological_decisions:
- issue: Основание или характеристика наказания в תַּחַת רְשָׁעִים
  choice: «Как нечестивцев» — они поражены в качестве нечестивых людей
  alternative: «За нечестие» — указание на причину наказания
  rationale: Синтаксис труден и допускает оба понимания. Основной текст следует вероятному статусному прочтению, а причинное прочтение сохраняется в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная. Оборот «у всех на виду» ясно передаёт публичность, а «нечестивцы» сохраняет библейский нравственно-судебный регистр.
