base_translation:
  language: en
  yaml_path: translation/ot/job/034/014.yaml
  text: If he should set his heart on himself[a], and gather to himself his spirit and his breath,
translation:
  language: ru
  text: Если Он обратит Своё сердце к Себе[a], соберёт к Себе Свой дух и Своё дыхание,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если Он направит к этому Своё сердце». Еврейское выражение «обратить (направить) сердце» может означать сосредоточить внимание или твёрдо вознамериться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условную часть высказывания без дополнительного усиления.
- source_word: יָשִׂים
  choice: обратит
  rationale: В сочетании с «сердце» естественно передаёт направленность внимания или намерения, сохраняя условный смысл формы.
- source_word: אֵלָיו לִבּוֹ
  choice: обратит Своё сердце к Себе
  rationale: Сохраняет образ сердца и вероятное возвратное направление действия, не сводя «сердце» только к уму или воле.
- source_word: רוּחוֹ
  choice: Свой дух
  rationale: В паре с נְשָׁמָה сохраняет различие двух еврейских обозначений жизненного начала.
- source_word: וְנִשְׁמָתוֹ
  choice: и Своё дыхание
  rationale: Передаёт נְשָׁמָה как дыхание жизни и не смешивает его с רוּחַ.
- source_word: אֵלָיו יֶאֱסֹף
  choice: соберёт к Себе
  rationale: Сохраняет буквальный образ собирания; контекст следующего стиха раскрывает смысл как изъятие данного Богом жизненного начала.
theological_decisions:
- issue: К кому относятся местоимения третьего лица единственного числа
  choice: К Богу; возвратность передана формами «Своё» и «к Себе».
  alternative: 'Первое אֵלָיו можно понимать менее явно возвратно: «если Он направит к этому Своё сердце».'
  rationale: Контекст речи Елиуя указывает на Бога как действующее лицо, однако смысл идиомы «обратить сердце» допускает оттенки внимания, намерения или решения; альтернативу следует сохранить в примечании.
- issue: Соотношение «духа» и «дыхания»
  choice: 'Сохранены два разных слова: «дух» и «дыхание».'
  alternative: Передать оба как близкие обозначения жизненного дыхания.
  rationale: Еврейский текст употребляет רוּחַ и נְשָׁמָה параллельно, но не тождественно; перевод не должен заранее превращать их в технические богословские категории или сливать в одно понятие.
translation_notes:
  register: Современный литературный русский язык с сохранением образности еврейского текста. Прописные буквы в местоимениях обозначают Бога согласно принятой русской библейской традиции и проясняют цепочку референции. Конечная запятая сохранена, поскольку условное предложение завершается в следующем стихе.
