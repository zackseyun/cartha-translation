  text: כִּ֤י פֹ֣עַל אָ֭דָם יְשַׁלֶּם ל֑/וֹ וּֽ/כְ/אֹ֥רַח אִ֝֗ישׁ יַמְצִאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/011.yaml
  text: For he repays a man according to his deed[a], and he makes him find according to a man's way.
translation:
  language: ru
  text: Ведь Он воздаёт человеку по его делам и даёт ему испытать то, что соответствует его пути.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и приводит на него то, что соответствует его пути»; еврейский глагол имеет каузативное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-обосновывающую функцию союза в контексте речи Елиуя и естественно звучит по-русски.
- source_word: פֹעַל אָדָם
  choice: по его делам
  rationale: פֹעַל обозначает сделанное человеком; множественное «делам» естественно выражает собирательный смысл и сохраняет нравственно-судебный контекст.
- source_word: יְשַׁלֶּם לוֹ
  choice: Он воздаёт человеку
  rationale: Порода piel глагола שלם здесь означает отплатить, воздать сообразно поступкам. «Воздаёт» сохраняет судебный оттенок и достоинство стиля.
- source_word: וּכְאֹרַח אִישׁ
  choice: то, что соответствует его пути
  rationale: אֹרַח буквально означает путь и метафорически — образ жизни. Формулировка сохраняет метафору пути и выражает соответствие последствий поведению человека.
- source_word: יַמְצִאֶנּוּ
  choice: даёт ему испытать
  rationale: Каузативная порода hiphil глагола מצא может означать «дать встретить, заставить испытать». Русское «даёт ему испытать» естественно передаёт переживание человеком соответствующих последствий, не уточняя их сверх текста.
theological_decisions:
- issue: Божественное воздаяние в соответствии с человеческими поступками
  choice: 'Стих утверждает общий принцип: Бог воздаёт человеку сообразно его делам и жизненному пути.'
  alternative: Понимать стих как утверждение, будто всякое страдание всегда является точным наказанием за личный грех.
  rationale: Непосредственный текст говорит о Божьей справедливости, но не требует превращать этот принцип в исчерпывающее объяснение всех страданий; напряжение всей книги Иова сохраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» указывает на Бога из контекста. Параллелизм сохранён без архаизмов; гендерно обобщающее «человек» естественно передаёт אָדָם и אִישׁ.
