  text: הַ/אַ֬ף שׂוֹנֵ֣א מִשְׁפָּ֣ט יַחֲב֑וֹשׁ וְ/אִם צַדִּ֖יק כַּבִּ֣יר תַּרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/017.yaml
  text: Can one who hates justice govern? And will you condemn the righteous Mighty One?[a][b]
translation:
  language: ru
  text: Разве может править тот, кто ненавидит правосудие?[a] И неужели ты осудишь Праведного и Могущественного?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «управлять», «удерживать»; буквально: «связывать». Здесь еврейский глагол, вероятно, означает осуществление власти или поддержание порядка.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «могущественного праведника» или «праведного великого». Вероятнее всего, это сочетание относится здесь к Богу.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַאַף
  choice: Разве может
  rationale: Сочетание вопросительной частицы с אַף придаёт вопросу усиленный риторический характер; «разве может» естественно передаёт его по-русски.
- source_word: שׂוֹנֵא
  choice: тот, кто ненавидит
  rationale: Субстантивированное причастие обозначает человека, для которого характерна ненависть; придаточная конструкция звучит естественно в современном русском языке.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В контексте речь идёт о справедливом суде и нравственном порядке управления; «правосудие» сохраняет судебно-управленческий оттенок.
- source_word: יַחֲבֹשׁ
  choice: править
  rationale: Основное значение глагола — «связывать», но здесь он, вероятно, образно указывает на осуществление власти или удержание порядка; «править» соответствует контексту.
- source_word: וְאִם
  choice: И неужели
  rationale: Союз вводит второй параллельный риторический вопрос. «И неужели» сохраняет связь и усиливает ожидаемый отрицательный ответ.
- source_word: צַדִּיק
  choice: Праведного
  rationale: Прилагательное выражает нравственную правоту. Прописная буква указывает на наиболее вероятного в контексте референта — Бога, не превращая слово в отдельный добавленный титул.
- source_word: כַּבִּיר
  choice: Могущественного
  rationale: Слово может означать «могучий», «могущественный» или «великий». Субстантивированная форма в сочетании с צַדִּיק, вероятнее всего, относится к Богу.
- source_word: תַּרְשִׁיעַ
  choice: ты осудишь
  rationale: Каузативная форма от רשע означает «объявить виновным, осудить»; русский глагол кратко и ясно передаёт судебный смысл.
theological_decisions:
- issue: К кому относится сочетание צַדִּיק כַּבִּיר
  choice: 'К Богу: «Праведного и Могущественного»'
  alternative: К могущественному праведнику или справедливому великому правителю вообще
  rationale: Ход рассуждения Елиуя строится на немыслимости того, чтобы обвинить Бога — праведного и могущественного Правителя. При этом сноска сохраняет грамматическую возможность более общего прочтения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной риторикой. Повтор усилительных частиц «разве» и «неужели» передаёт два связанных вопроса; прописные буквы отмечают вероятное указание на Бога. Союз «и» между однородными определениями добавлен ради естественного русского синтаксиса, не устраняя отмеченную в сноске неоднозначность.
