  text: מִשְׁפָּ֥ט נִבְחֲרָה לָּ֑/נוּ נֵדְעָ֖ה בֵינֵ֣י/נוּ מַה טּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/004.yaml
  text: Let us choose for ourselves what is just[a]; let us know among ourselves what is good.
translation:
  language: ru
  text: Изберём для себя справедливое[a] и вместе рассудим, что хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Изберём для себя справедливость и между собой определим, что хорошо».'
    reason: Лексически возможны абстрактное «справедливость» для מִשְׁפָּט и более буквальная передача בֵינֵינוּ; ידע здесь допускает значение «определить, распознать».
lexical_decisions:
- source_word: מִשְׁפָּט
  choice: справедливое
  rationale: Слово может означать справедливость, суд или справедливое решение. Субстантивированное прилагательное естественно по-русски передаёт предмет нравственно-судебной оценки, не сводя смысл к судебному приговору.
- source_word: נִבְחֲרָה
  choice: изберём
  rationale: 'Когортативное употребление формы 1-го лица множественного числа выражает совместное побуждение: «изберём».'
- source_word: לָּנוּ
  choice: для себя
  rationale: Предлог ל с местоименным суффиксом указывает на заинтересованность участников в собственном выборе; «для себя» сохраняет совещательный оттенок.
- source_word: נֵדְעָה
  choice: рассудим
  rationale: ידע буквально означает «знать», но в контексте совместной оценки добра имеет оттенок распознавания и определения; «рассудим» естественно передаёт этот смысл.
- source_word: בֵינֵינוּ
  choice: вместе
  rationale: Буквально «между нами»; здесь выражение описывает совместное обсуждение и по-русски естественно передаётся словом «вместе».
- source_word: מַה טּוֹב
  choice: что хорошо
  rationale: Формулировка сохраняет широкое значение טוֹב — доброе, правильное или полезное — и не сужает его до «лучшего».
