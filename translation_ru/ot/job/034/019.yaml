  yaml_path: translation/ot/job/034/019.yaml
  text: who shows no partiality to princes and does not regard the rich above the poor, for all of them are the work of his hands.
translation:
  language: ru
  text: который не оказывает предпочтения князьям и не ставит богатого выше бедного, потому что все они — дело его рук.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשָׂא פְּנֵי שָׂרִים
  choice: не лицеприятствует князьям
  rationale: Идиома буквально означает «не поднимает лица князей», то есть не оказывает им предпочтения из-за их положения. «Лицеприятствует» точно и уместно передаёт судебно-нравственный оттенок.
- source_word: וְלֹא נִכַּר שׁוֹעַ לִפְנֵי דָל
  choice: и не ставит богатого выше бедного
  rationale: Глагольная форма передаёт признание или предпочтение одного перед другим; конструкция לִפְנֵי сохраняется естественным русским сравнением «выше». שׁוֹעַ обозначает состоятельного, знатного человека, здесь — «богатого».
- source_word: מַעֲשֵׂה יָדָיו כֻּלָּם
  choice: все они — дело его рук
  rationale: Сохранён образ рук Творца и всеохватность כֻּלָּם; именная конструкция естественно передана через тире.
theological_decisions:
- issue: Основание Божьего беспристрастия
  choice: потому что все они — дело его рук
  alternative: ведь всех их создали его руки
  rationale: Выбран более близкий к форме оригинала вариант, сохраняющий богословскую связь равного отношения ко всем с тем, что все люди сотворены Богом, без добавления конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи Иова. Структура относительного придаточного сохранена, поскольку стих продолжает характеристику Бога из ближайшего контекста. Местоимение «его» написано со строчной буквы согласно обычной современной издательской практике и форме исходного текста.
