  language: ru
  text: Нет ни тьмы, ни глубокого мрака[a], где могли бы укрыться творящие беззаконие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертной тени»; еврейское слово в поэтической речи может также означать глубокую тьму или густой мрак.'
