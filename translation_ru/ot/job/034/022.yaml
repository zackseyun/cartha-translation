lexical_decisions:
- source_word: אֵין
  choice: нет ни… ни…
  rationale: Экзистенциальное отрицание естественно передаётся по-русски конструкцией «нет ни… ни…», охватывающей оба однородных существительных.
- source_word: חֹשֶׁךְ
  choice: тьма
  rationale: Обычное значение слова — «тьма»; здесь оно обозначает место или средство сокрытия и образует поэтическую пару с צַלְמָוֶת.
- source_word: צַלְמָוֶת
  choice: мрак
  rationale: В поэзии слово может обозначать глубокую тьму или густой мрак, не обязательно прямо указывая на смерть. «Мрак» естественно усиливает «тьму» и соответствует контексту сокрытия.
- source_word: לְהִסָּתֶר
  choice: могли бы укрыться
  rationale: Возвратный инфинитив с ל выражает возможность или цель укрытия при отрицании такого места; русская придаточная конструкция передаёт смысл естественно.
- source_word: שָׁם
  choice: где
  rationale: Буквальное «там» в русском контексте естественно преобразуется в относительное наречие «где», относящееся к названным тьме и мраку.
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящие беззаконие
  rationale: Причастная конструкция сохраняет деятельный образ еврейского выражения и его нравственный смысл, оставаясь понятной в современном литературном русском.
- source_word: אָוֶן
  choice: беззаконие
  rationale: В данном контексте слово обозначает нравственное зло; «беззаконие» передаёт эту окраску и устойчиво сочетается с «творящие».
theological_decisions:
- issue: Значение צַלְמָוֶת в поэтическом контексте
  choice: мрак
  alternative: смертная тень; глубокая тьма
  rationale: Речь идёт о невозможности укрыться от Божьего взора, а не непосредственно о смерти. Основной текст передаёт образ глубокой тьмы, а традиционный вариант сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Пара «тьма — мрак» звучит естественно и сохраняет поэтическое усиление; порядок фразы близок к еврейскому без синтаксической тяжеловесности.
