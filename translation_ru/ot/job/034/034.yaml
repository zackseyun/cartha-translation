  yaml_path: translation/ot/job/034/034.yaml
  text: Men of understanding will say to me[a], and a wise man who hears me,
translation:
  language: ru
  text: Люди разумные[a] скажут мне, и мудрый человек, слушающий меня,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «люди сердца» — то есть люди, способные понимать и рассуждать.'
