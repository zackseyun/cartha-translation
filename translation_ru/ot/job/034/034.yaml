lexical_decisions:
- source_word: אַנְשֵׁי לֵבָב
  choice: люди разумные
  rationale: Буквально «люди сердца». В библейском иврите сердце обозначает также способность мыслить и различать; «люди разумные» естественно передаёт смысл идиомы.
- source_word: יֹאמְרוּ לִי
  choice: скажут мне
  rationale: Форма yiqtol в данном контексте допускает будущее значение и выражает ожидаемую реакцию рассудительных слушателей.
- source_word: וְגֶבֶר חָכָם
  choice: и мудрый человек
  rationale: גֶּבֶר может подчёркивать взрослого мужчину или силу, однако параллелизм здесь поддерживает нейтральное «человек»; חָכָם передано как «мудрый».
- source_word: שֹׁמֵעַ לִי
  choice: слушающий меня
  rationale: Причастие характеризует мудрого человека. «Слушающий» сохраняет длительный характер действия и в контексте указывает на внимательное восприятие речи.
