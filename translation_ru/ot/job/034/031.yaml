  yaml_path: translation/ot/job/034/031.yaml
  text: For has anyone said to God[a], ‘I have borne punishment; I will not offend again’?
translation:
  language: ru
  text: 'Ведь говорил ли кто-нибудь Богу: «Я понёс наказание[a] и не буду поступать дурно»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Я понёс; не буду поступать порочно». В еврейском тексте не сказано прямо, что именно человек «понёс»; могут подразумеваться наказание, взыскание или вина.'
    reason: Сохранение лексической неоднозначности из-за отсутствующего дополнения при נָשָׂאתִי и указание более буквального значения חבל.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-аргументативную связь с предшествующими словами и естественно вводит риторический вопрос.
- source_word: אֶל אֵל
  choice: Богу
  rationale: אֵל здесь является обычным обозначением Бога; дательный падеж естественно передаёт сочетание с предлогом אֶל.
- source_word: הֶאָמַר
  choice: говорил ли кто-нибудь
  rationale: Формально это форма 3-го лица мужского рода единственного числа, однако в контексте она имеет обобщённо-риторический смысл. «Кто-нибудь» делает этот смысл ясным, не привязывая высказывание к определённому человеку.
- source_word: נָשָׂאתִי
  choice: Я понёс наказание
  rationale: Основное значение נשׂא — «нести». Дополнение в еврейском тексте не выражено; по контексту подразумевается переносимое наказание, взыскание или бремя вины. В основном тексте добавлено «наказание» ради ясности, а неоднозначность отмечена в сноске.
- source_word: לֹא אֶחְבֹּל
  choice: больше не буду поступать дурно
  rationale: 'В данном контексте חבל понимается этически: поступать дурно, неправедно или порочно. «Больше» естественно выражает подразумеваемое обещание прекратить прежнее дурное поведение, хотя отдельного соответствующего слова в еврейском нет.'
