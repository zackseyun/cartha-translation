source:
  edition: WLC
  text: כִּֽי אָ֭מַר אִיּ֣וֹב צָדַ֑קְתִּי וְ֝/אֵ֗ל הֵסִ֥יר מִשְׁפָּטִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/005.yaml
  text: For Job has said[a], ‘I am in the right, and God has taken away my justice.’
translation:
  language: ru
  text: 'Ведь Иов сказал: «Я прав, а Бог лишил меня правосудия[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отнял моё право»; возможно также: «лишил меня справедливого суда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для дальнейших слов Елиуя; «ведь» естественно передаёт пояснительно-аргументативную связь.
- source_word: אָמַר
  choice: сказал
  rationale: Перфект сообщает о ранее произнесённых словах Иова, значимых для настоящего рассуждения.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: צָדַקְתִּי
  choice: Я прав
  rationale: Передаёт судебно-полемический смысл корня צדק в данном контексте, не расширяя утверждение до абсолютной нравственной безгрешности.
- source_word: וְאֵל
  choice: а Бог
  rationale: Русское «а» естественно выражает смысловое сопоставление двух частей высказывания; существительное אֵל передано обычным словом «Бог» без необоснованного расширения титула.
- source_word: הֵסִיר
  choice: лишил
  rationale: Каузативная форма глагола סור означает устранение или отнятие; в сочетании с מִשְׁפָּטִי русское «лишил меня» ясно передаёт представление об отнятом праве или правосудии.
- source_word: מִשְׁפָּטִי
  choice: меня правосудия
  rationale: מִשְׁפָּטִי допускает значения «моё право», «правосудие для меня», «решение по моему делу». Конструкция «лишил меня правосудия» звучит по-русски естественнее буквального «отнял моё правосудие» и сохраняет юридико-нравственную широту слова.
theological_decisions:
- issue: Судебный оттенок самооценки Иова
  choice: «Я прав»
  alternative: «Я праведен»
  rationale: Выбранный вариант связывает слова Иова с его спором и притязанием на правоту в деле, не превращая их в безусловное заявление о полной нравственной безгрешности.
- issue: Значение מִשְׁפָּטִי
  choice: «лишил меня правосудия» с примечанием
  alternative: «отнял моё право»; «лишил меня справедливого суда»
  rationale: Основной текст сохраняет одновременно юридический и нравственный смысл, а примечание показывает возможные более конкретные прочтения, не снимая подлинной лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Реплика оформлена прямой речью. Противопоставительное «а» выбрано ради естественного русского синтаксиса, хотя еврейский союз формально может быть передан и как «и».
