  yaml_path: translation/ot/job/034/012.yaml
  text: Indeed[a], God does not act wickedly, and the Almighty does not pervert justice.
translation:
  language: ru
  text: Поистине[a], Бог не совершает зла, и Всемогущий не извращает правосудие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог не осуждает несправедливо»; возможно также: «Бог не объявляет виновным». Еврейский глагол в некоторых контекстах может иметь судебный смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף אָמְנָם
  choice: Воистину
  rationale: Сочетание усиливает и торжественно подтверждает утверждение; «воистину» передаёт эту выразительную силу в достойном литературном регистре.
- source_word: אֵל
  choice: Бог
  rationale: Здесь слово служит обозначением Бога Израиля; обычное «Бог» естественно и не создаёт ненужного повтора идеи могущества перед параллельным титулом «Всемогущий».
- source_word: יַרְשִׁיעַ
  choice: не поступает нечестиво
  rationale: Порода хифиль глагола רשע допускает судебный смысл «объявлять виновным», однако параллель с неизвращением правосудия и общий контекст утверждения Божьей праведности поддерживают более широкий смысл нечестивого поступка. Сноска сохраняет судебную возможность.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Традиционный и понятный русский эквивалент божественного титула שַׁדַּי, уместный в параллели со словом «Бог».
- source_word: יְעַוֵּת
  choice: не извращает
  rationale: Глагол выражает искривление или искажение; сочетание «извращать правосудие» точно сохраняет юридический образ и естественно звучит по-русски.
- source_word: מִשְׁפָּט
  choice: правосудия
  rationale: В данном контексте слово обозначает справедливый суд и осуществление справедливости. «Правосудие» сохраняет судебный оттенок и образует естественное сочетание с глаголом «извращать».
theological_decisions:
- issue: Смысл יַרְשִׁיעַ применительно к характеру Бога
  choice: Бог не поступает нечестиво
  alternative: Бог не осуждает несправедливо; Бог не объявляет виновным
  rationale: Основной текст передаёт широкое отрицание нечестивого действия со стороны Бога, соответствующее параллельной строке о правосудии. Возможный судебный смысл глагола не устраняется, а отмечается в сноске, чтобы сохранить смысловую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием поэтического утверждения. «Воистину» выбрано как несколько возвышенное, но понятное усиление; юридический оттенок второй строки сохранён словом «правосудие».
