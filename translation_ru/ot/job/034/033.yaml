source:
  edition: WLC
  text: הַֽ/מֵ/עִמְּ/ךָ֬ יְשַׁלְמֶ֨/נָּה כִּֽי מָאַ֗סְתָּ כִּי אַתָּ֣ה תִבְחַ֣ר וְ/לֹא אָ֑נִי וּֽ/מַה יָדַ֥עְתָּ דַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/033.yaml
  text: Should he repay according to your judgment because you have rejected it? For you must choose[a], and not I[b]; so declare what you know.
translation:
  language: ru
  text: Разве Он должен воздавать по-твоему[a], раз ты это отверг[b]? Ведь выбирать тебе, а не мне; скажи, что ты знаешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально начало фразы можно передать: «Разве от тебя (или: согласно тебе) Он должен воздавать?» Еврейское выражение идиоматично и трудно; смысл вопроса, по-видимому, в том, что Божье воздаяние не определяется предпочтением Иова.'
    reason: lexical_alternative
  - marker: b
    text: 'Не названо прямо, что именно Иов отверг: Божий суд, Божий образ правления или подразумеваемое здесь воздаяние.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמֵעִמְּךָ
  choice: по-твоему
  rationale: Буквальное сочетание «от/с тобой» здесь идиоматично и трудно для прямой передачи. «По-твоему» естественно выражает вопрос о том, должно ли Божье воздаяние определяться мнением или предпочтением Иова, не превращая фразу в подробное толкование.
- source_word: יְשַׁלְּמֶנָּה
  choice: должен воздавать
  rationale: Пиэль глагола שלם означает «воздать, отплатить, возместить». «Воздавать» сохраняет идею ответного возмещения и соответствует серьёзному контексту; модальная форма передаёт риторический характер вопроса. Неясный объект не назван явно в основном тексте.
- source_word: כִּי מָאַסְתָּ
  choice: раз ты это отверг
  rationale: מאס означает «отвергать, отказываться, презирать». «Отверг» передаёт перфект, а местоимение «это» позволяет сохранить подразумеваемый, но не названный предмет отвержения; его неоднозначность отмечена в сноске.
- source_word: כִּי אַתָּה תִבְחַר וְלֹא אָנִי
  choice: Ведь выбирать тебе, а не мне
  rationale: 'Инфинитивная русская конструкция естественно и выразительно передаёт противопоставление: свою позицию должен определить Иов, а не Елиуй. Она сохраняет значение בחר «выбирать», не уточняя предмет выбора сверх текста.'
- source_word: וּמַה יָדַעְתָּ דַבֵּר
  choice: скажи, что ты знаешь
  rationale: Прямой императив דבר передан как «скажи», а מַה יָדַעְתָּ — как «что ты знаешь». Такая формулировка ясна и близка к синтаксису оригинала.
theological_decisions:
- issue: Подразумеваемый субъект глагола יְשַׁלְּמֶנָּה
  choice: «Он» с прописной буквы как отсылка к Богу
  alternative: «он» либо явное «Бог»
  rationale: В контексте речи Елиуя субъектом воздаяния является Бог. Местоимение не добавляет имени, отсутствующего в стихе, а прописная буква соответствует принятому русскому благоговейному употреблению; при этом не вводится дополнительное богословское толкование.
- issue: Неясный предмет отвержения в כִּי מָאַסְתָּ
  choice: Сохранить неопределённое «это» и пояснить неоднозначность в сноске
  alternative: Уточнить как «Божий суд», «Его правление» или «предложенное воздаяние»
  rationale: Еврейский текст не называет предмет отвержения. Его конкретизация устранила бы подлинную смысловую напряжённость и могла бы навязать одно толкование.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой риторического вызова. «Воздавать» сохраняет библейскую серьёзность, оставаясь понятным; «по-твоему» и «выбирать тебе» звучат естественно и не перегружают трудный еврейский синтаксис.
