  text: וְ/ה֤וּא יַשְׁקִ֨ט וּ/מִ֥י יַרְשִׁ֗עַ וְ/יַסְתֵּ֣ר פָּ֭נִים וּ/מִ֣י יְשׁוּרֶ֑/נּוּ וְ/עַל גּ֖וֹי וְ/עַל אָדָ֣ם יָֽחַד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/029.yaml
  text: If he gives quietness[a], who can condemn? If he hides his face[c][b], who can behold him? This is so for a nation and for a man alike.
translation:
  language: ru
  text: Если Он дарует покой, кто может осудить?[a] Если Он скрывает Своё лицо, кто может увидеть Его?[b] Это относится как к народу, так и к человеку.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто может объявить Его виновным?» Еврейский глагол имеет судебный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто может созерцать Его?» Еврейский глагол означает «смотреть на, видеть».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и над народом, и над человеком вместе». Смысл последней части может состоять в том, что сказанное равно относится и к народу, и к отдельному человеку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשְׁקִט
  choice: дарует покой
  rationale: Каузативная порода глагола שׁקט означает, что Бог производит тишину, спокойствие или покой. «Дарует покой» естественно передаёт каузативный смысл, не сужая его до формального мира.
- source_word: יַרְשִׁעַ
  choice: осудить
  rationale: 'В породе hифиль רשע обычно имеет судебный смысл: признать виновным, объявить нечестивым, осудить. Краткое «осудить» сохраняет риторическую силу вопроса.'
- source_word: יַסְתֵּר פָּנִים
  choice: скрывает лицо
  rationale: 'Буквальный библейский образ сохраняет неоднозначность: речь может идти о недоступности Бога, Его отстранении или сокрытии благоволения; перевод не сводит выражение лишь к одному из этих смыслов.'
- source_word: יְשׁוּרֶנּוּ
  choice: увидеть Его
  rationale: Глагол שׁור означает смотреть на кого-либо, видеть или созерцать. «Увидеть Его» ясно и естественно по-русски; местоименный суффикс мужского рода относится к Богу.
- source_word: גּוֹי
  choice: народ
  rationale: Здесь גוי обозначает коллективное человеческое сообщество. Русское «народ» естественнее в противопоставлении отдельному человеку и не привносит значения «языческий».
- source_word: אָדָם
  choice: человек
  rationale: Единственное число противопоставляет отдельного человека народу. «Человек» точно и современно передаёт это значение.
- source_word: יָחַד
  choice: одинаково
  rationale: В данном контексте наречие указывает на равную применимость сказанного к обеим сторонам, а не обязательно на их совместное действие.
- source_word: וְעַל גּוֹי וְעַל אָדָם יָחַד
  choice: И для народа, и для человека — одинаково
  rationale: Гибкий предлог על здесь передаёт сферу применения сказанного. Такая формулировка сохраняет охват коллективного и индивидуального уровней без необоснованного уточнения, что действие направлено против них.
theological_decisions:
- issue: Образ сокрытого Божьего лица
  choice: Сохранить выражение «скрывает лицо».
  alternative: «Отворачивается» или «лишает благоволения».
  rationale: Буквальный антропоморфный образ богословски значим и оставляет открытыми оттенки Божьей недоступности, отстранения и сокрытия благоволения.
- issue: Смысл последней части стиха
  choice: Отнести предшествующие утверждения в равной мере к народу и отдельному человеку.
  alternative: 'Перевести направленно: «против народа и против человека».'
  rationale: Предлог על допускает несколько отношений. Контекст поддерживает обобщение сферы действия, тогда как «против» без необходимости придаёт фразе исключительно карательный смысл.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Риторические вопросы переданы кратко; местоимения, относящиеся к Богу, написаны с прописной буквы. Буквальный образ лица сохранён, а синтаксически сжатая заключительная фраза раскрыта минимально для ясности.
