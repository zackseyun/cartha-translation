lexical_decisions:
- source_word: אָבִי
  choice: О отец мой
  rationale: Форма буквально означает «мой отец» и естественнее всего понимается как обращение; частица «о» ясно передаёт звательный характер в современном литературном русском.
- source_word: יִבָּחֵן
  choice: пусть ... будет испытан
  rationale: Нифаль имперфекта בחן означает «быть испытанным, проверенным»; в данном контексте форма выражает пожелание.
- source_word: עַד נֶצַח
  choice: до конца
  rationale: Буквально выражение может означать «навсегда», но здесь, вероятно, подчёркивает предельную полноту или продолжительность испытания. «До конца» сохраняет интенсивность, не утверждая непременно бесконечность.
- source_word: עַל
  choice: за то, что
  rationale: Предлог вводит основание высказанного пожелания; русская конструкция естественно связывает испытание Иова с характером его ответов.
- source_word: תְּשֻׁבוֹת
  choice: отвечает
  rationale: Существительное означает «ответы, возражения»; глагольная конструкция по-русски плавно передаёт смысл в составе придаточного предложения.
- source_word: בְּאַנְשֵׁי אָוֶן
  choice: как нечестивые люди
  rationale: Предлог ב допускает сравнительное либо ассоциативное понимание. В основном тексте выбрано естественное сравнительное прочтение, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Смысл пожелания Елиуя об испытании Иова
  choice: Елиуй желает, чтобы Иов был испытан полностью из-за ответов, подобных ответам нечестивых.
  alternative: Иов должен быть испытан вместе с нечестивыми либо бесконечно долго.
  rationale: Синтаксис труден; перевод сохраняет обвинительный смысл слов Елиуя, но не превращает неоднозначные выражения в более сильное богословское утверждение.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «О отец мой» сохраняет необычное обращение исходного текста; «до конца» звучит естественно и оставляет буквальную временную формулировку для сноски.
