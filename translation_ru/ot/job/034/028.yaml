lexical_decisions:
- source_word: לְהָבִיא
  choice: чтобы донести
  rationale: Предлог לְ при инфинитиве породы хифиль от בוא выражает цель или результат по отношению к предыдущему контексту. Оборот «чтобы донести» естественно передаёт эту связь и образ доведения жалобы до сведения Бога.
- source_word: עָלָיו
  choice: до Него
  rationale: При глаголе движения предлог עַל здесь может указывать на того, до кого доходит крик. «До Него» естественно по-русски выражает достижение Божьего слуха, при этом другие возможные понимания отмечены в сноске.
- source_word: צַעֲקַת
  choice: крик
  rationale: צְעָקָה обозначает крик или вопль, особенно вызванный бедствием. «Крик» прямо и понятно передаёт значение без излишнего усиления.
- source_word: דָּל
  choice: бедняка
  rationale: דַּל может обозначать бедного, слабого или социально бесправного человека. «Бедняк» подходит контексту и сохраняет единственное число исходного текста.
- source_word: וְצַעֲקַת
  choice: и ... крик
  rationale: Повтор существительного сохранён ради поэтического параллелизма еврейского текста.
- source_word: עֲנִיִּים
  choice: угнетённых
  rationale: עָנִי охватывает значения бедности, страдания, унижения и угнетения. «Угнетённых» отличает это слово от דַּל, не отрицая частичного совпадения их значений.
- source_word: יִשְׁמָע
  choice: Он слышит
  rationale: Имперфект в поэтическом контексте может выражать характерное, постоянно верное действие. Настоящее время по-русски звучит естественно; прописная буква обозначает принятое в контексте отнесение подлежащего к Богу.
theological_decisions:
- issue: К кому относится местоимение в עָלָיו и кто является подлежащим יִשְׁמָע
  choice: Крик доносится до Бога, и Бог слышит крик угнетённых.
  alternative: Крик направлен против нечестивого, а слышит его Бог; либо крик обрушивается на притеснителя и слышит его он.
  rationale: В ближайшем контексте Елиуй говорит о притеснении со стороны нечестивых и о Божьем судебном ведении. Подразумеваемым подлежащим «слышит» естественнее всего считать Бога. Однако многозначность עַל не устранена и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены повтор слова «крик» и различие между двумя близкими обозначениями социально уязвимых людей. Местоимение, относимое к Богу, написано с прописной буквы для ясности принятого синтаксического прочтения.
