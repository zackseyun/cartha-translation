  yaml_path: translation/ot/job/034/023.yaml
  text: For he does not set a time for a man to go before God in judgment[a].
translation:
  language: ru
  text: Ведь Он не назначает человеку дополнительного срока, чтобы тот предстал перед Богом на суд[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь Он не назначает человеку времени, чтобы тот предстал перед Богом на суд». Еврейский текст здесь труден и предельно сжат; вероятный смысл состоит в том, что Богу не нужны ни дополнительное слушание, ни отсрочка, прежде чем судить.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит обоснование предыдущей мысли в рассуждении Елиуя; «ведь» естественно передаёт пояснительную связь.
- source_word: לֹא עַל אִישׁ יָשִׂים עוֹד
  choice: Он не назначает человеку дополнительного срока
  rationale: Еврейская фраза сжата и трудна. יָשִׂים означает «положит, установит, назначит», а עוֹד — «ещё, далее, дополнительно». Слово «срок» восполняет подразумеваемый объект и ясно передаёт вероятный судебный смысл, не скрывая альтернативы в примечании.
- source_word: אִישׁ
  choice: человеку
  rationale: Мужской род единственного числа употреблён обобщённо; русское «человеку» точно и естественно.
- source_word: לַהֲלֹךְ אֶל אֵל
  choice: чтобы тот предстал перед Богом
  rationale: 'Буквально: «идти к Богу». В судебном контексте «предстать перед Богом» естественно передаёт явку к Судье.'
- source_word: בַּמִּשְׁפָּט
  choice: на суд
  rationale: מִשְׁפָּט здесь обозначает суд или судебное разбирательство; «на суд» ясно выражает юридический контекст.
theological_decisions:
- issue: Толкование сжатой конструкции с עוֹד и отсутствующим прямым дополнением при יָשִׂים
  choice: Бог не назначает человеку дополнительного срока для явки на суд
  alternative: Бог не назначает человеку определённого времени, чтобы тот предстал перед Ним на суд; либо Бог не рассматривает человека повторно перед судом
  rationale: 'Контекст подчёркивает совершенное знание Бога: Ему не требуется отсрочка или дополнительное слушание. Однако еврейская конструкция допускает иные разборы, поэтому неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с достойным, ясным судебным словоупотреблением. Местоимение «Он» написано с прописной буквы по принятой русской библейской традиции; формулировка не вводит конфессионально специфического толкования.
