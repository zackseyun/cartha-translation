  text: For his eyes are on the ways of a man[a], and he sees all his steps.
translation:
  language: ru
  text: Ведь глаза Его устремлены на пути человека[a], и Он видит все его шаги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пути мужчины»; еврейское слово стоит в мужском роде и единственном числе, но здесь имеет обобщающее значение — пути любого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание или пояснение к предыдущей мысли; «ведь» естественно передаёт эту пояснительно-причинную связь.
- source_word: עֵינָיו עַל
  choice: глаза Его обращены на
  rationale: Именная конструкция буквально указывает, что Его глаза находятся «на» путях человека, то есть они являются предметом постоянного наблюдения. Формулировка сохраняет образ глаз и звучит естественно по-русски.
- source_word: דַּרְכֵי אִישׁ
  choice: пути человека
  rationale: דֶּרֶךְ обозначает путь и нередко образно — образ жизни или поведение; אִישׁ здесь стоит в мужском роде, единственном числе и имеет обобщающее значение. Русское «человек» сохраняет единственное число и обобщённый смысл.
- source_word: וְכָל צְעָדָיו
  choice: и все его шаги
  rationale: Сохранён конкретный образ шагов, который одновременно может обозначать поступки и ход жизни; כָּל передано как «все».
- source_word: יִרְאֶה
  choice: Он видит
  rationale: Имперфект Qal 3-го лица единственного числа от ראה в данном контексте выражает постоянное, общее действие; настоящее время естественно передаёт этот смысл.
theological_decisions:
- issue: Обобщающее значение אִישׁ
  choice: человека
  alternative: мужчины
  rationale: Хотя форма грамматически мужского рода и единственного числа, в контексте она имеет представительное, общечеловеческое значение. «Человек» не ограничивает смысл взрослыми мужчинами и при этом соответствует форме единственного числа.
- issue: Референт местоимения в עֵינָיו и יִרְאֶה
  choice: Его / Он без замены на имя «Бог»
  alternative: глаза Бога / Бог видит
  rationale: Из контекста речь идёт о Боге, однако сам стих использует местоименные формы. Перевод сохраняет эту форму и не добавляет существительное, отсутствующее в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов остаётся естественным; образ глаз, путей и шагов сохранён. Прописные буквы в «Его» и «Он» помогают различить относящиеся к Богу местоимения и местоимение «его», относящееся к человеку.
