source:
  edition: WLC
  text: כִּ֥י יֹ֘סִ֤יף עַֽל חַטָּאת֣/וֹ פֶ֭שַׁע בֵּינֵ֣י/נוּ יִסְפּ֑וֹק וְ/יֶ֖רֶב אֲמָרָ֣י/ו לָ/אֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/034/037.yaml
  text: For he adds rebellion to his sin[a]; among us he claps his hands[b], and he multiplies his words against God.
translation:
  language: ru
  text: Ведь к своему греху он прибавляет мятеж; среди нас он хлопает в ладоши[a] и умножает свои слова против Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ударяет ладонью о ладонь». Этот жест, вероятно, выражает насмешку, презрение или вызов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к Богу». Еврейский предлог может нейтрально указывать направление речи, однако контекст поддерживает смысл «против Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим суждением Елиуя естественно для современного русского языка.
- source_word: יֹסִיף עַל חַטָּאתוֹ
  choice: к своему греху он прибавляет
  rationale: Сохраняет образ добавления нового проступка к уже имеющемуся греху.
- source_word: פֶשַׁע
  choice: мятеж
  rationale: Слово обозначает не просто проступок, а вызывающее неповиновение, бунт; «мятеж» сохраняет усиление обвинения.
- source_word: בֵּינֵינוּ
  choice: среди нас
  rationale: Естественно передаёт буквальное «между нами» как действие в кругу присутствующих.
- source_word: יִסְפּוֹק
  choice: хлопает в ладоши
  rationale: Сохраняет конкретный жест, не внося его предполагаемый смысл непосредственно в основной текст; оттенок насмешки или вызова пояснён в сноске.
- source_word: וְיֶרֶב אֲמָרָיו
  choice: и умножает свои слова
  rationale: Передаёт выразительный образ множащейся речи и остаётся близким к форме еврейского текста.
- source_word: לָאֵל
  choice: против Бога
  rationale: Хотя предлог לְ обычно обозначает направление, в контексте обвинения речь представлена как направленная против Бога; более нейтральный вариант сохранён в сноске.
theological_decisions:
- issue: Следует ли понимать слова Иова как обращённые «к Богу» или направленные «против Бога».
  choice: против Бога
  alternative: к Богу
  rationale: Последовательность обвинений — грех, мятеж, вызывающий жест и множество слов — поддерживает противительный смысл. При этом грамматически возможное более нейтральное прочтение отмечено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет параллельное нарастание обвинения; конкретный жест оставлен в основном тексте, а его возможный смысл вынесен в сноску.
