  terminology: '«Грех», «мятеж» и «Бог» употреблены последовательно и без конфессионально обусловленного толкования. «Хлопает в ладоши» остаётся конкретным переводом жеста, тогда как вероятные оттенки насмешки, презрения или вызова корректно вынесены в сноску. Маркеры сносок в русском тексте согласованы с их содержанием: [a] относится к жесту, [b] — к лָאֵל.'
