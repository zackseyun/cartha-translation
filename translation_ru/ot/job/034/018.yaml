translation:
  language: ru
  text: '«Разве можно сказать царю: „Негодяй!“ — а вельможам: „Нечестивцы!“?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальное еврейское הַאֲמֹר допускает и относительное прочтение: «тот, кто говорит царю: „Негодяй!“ — и вельможам: „Нечестивцы!“». Бְּלִיָּעַל здесь означает негодного, низкого человека, а не обязательно позднейшее собственное имя «Велиал». Еврейское רָשָׁע имеет форму единственного числа, хотя относится к вельможам во множественном числе.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַאֲמֹר
  choice: тот, кто говорит
  rationale: Субстантивированная инфинитивная форма естественно передаётся как обозначение действующего лица и в контексте продолжает характеристику Бога; при этом возможное вопросительное понимание отмечено в сноске.
- source_word: לְמֶלֶךְ
  choice: царю
  rationale: Предлог לְ вводит адресата речи; существительное без артикля допускает обобщённое значение, которое русский дательный передаёт без обязательного слова «одному».
- source_word: בְּלִיָּעַל
  choice: Негодяй
  rationale: Здесь это бранное обозначение негодности и низости, а не позднейшее собственное имя «Велиал». «Негодяй» звучит естественно как прямое обращение к царю.
- source_word: רָשָׁע
  choice: Нечестивцы
  rationale: Форма в еврейском единственного числа, однако обращена к множественному נְדִיבִים; русский множественный вокативно-именительный смысл ясно согласует оскорбление с группой адресатов.
- source_word: אֶל
  choice: и вельможам
  rationale: אֶל вводит адресата речи параллельно לְמֶלֶךְ; союз «и» передаёт поэтический параллелизм, а дательный падеж — направленность речи.
- source_word: נְדִיבִים
  choice: вельможам
  rationale: В данном политико-социальном параллелизме с царём слово обозначает знатных и влиятельных людей; «вельможи» точнее сохраняет этот оттенок, чем общее «благородные».
theological_decisions:
- issue: Отнесение высказывания к Богу и синтаксическая функция הַאֲמֹר
  choice: тот, кто говорит
  alternative: разве можно сказать
  rationale: Контекст стихов 17–19 позволяет понимать выражение как характеристику Того, кто нелицеприятен к правителям. Однако начальное הַ допускает вопросительное прочтение; оно сохранено в сноске, а не устранено без оговорки.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической обличительной речи. Двоеточия и тире подчёркивают параллелизм. «Негодяй» и «нечестивцы» сохраняют резкость прямых обращений, не вводя позднейшего демонологического смысла.
