base_translation:
  language: en
  yaml_path: translation/ot/job/034/025.yaml
  text: Therefore he recognizes their deeds; he overturns them in the night[a], and they are crushed.
translation:
  language: ru
  text: Поэтому Он знает их дела, низвергает их ночью[a], и они сокрушаются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «низвергает их среди ночи». В еврейском тексте при глаголе «низвергает» объект прямо не назван, но контекст указывает на нечестивых властителей, подвергающихся суду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего рассуждения.
- source_word: יַכִּיר
  choice: знает
  rationale: В данной форме глагол выражает распознавание и осведомлённость о поступках; «знает» естественно по-русски и не добавляет идеи расследования, которой текст прямо не требует.
- source_word: מַעְבָּדֵיהֶם
  choice: их дела
  rationale: Кратко и естественно передаёт поступки людей, сохраняя нравственную весомость контекста.
- source_word: וְהָפַךְ
  choice: ниспровергает их
  rationale: Передаёт значение переворачивания или низвержения. Местоимение «их» восполняет не названный прямо объект из контекста — нечестивых властителей.
- source_word: לַיְלָה
  choice: ночью
  rationale: Естественно передаёт обстоятельственное временное значение и внезапность суда.
- source_word: וְיִדַּכָּאוּ
  choice: и они сокрушены
  rationale: Сохраняет пассивное значение и сильный образ полного поражения под судом.
theological_decisions:
- issue: Неявные субъект и объект в сцене суда
  choice: Субъект глаголов — Бог, а неявный объект «ниспровергает» — упомянутые в контексте нечестивые люди.
  alternative: Понять выражение как «переворачивает ночь» либо оставить объект совершенно невыраженным.
  rationale: Контекст Иов 34:24–26 описывает Божий суд над сильными людьми. В русском языке добавление «их» делает связь ясной, не устраняя отмеченной в сноске грамматической неявности оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавное «Он» употреблено как русская издательская конвенция для ясного указания на Бога, хотя еврейский текст графически этого не отмечает.
