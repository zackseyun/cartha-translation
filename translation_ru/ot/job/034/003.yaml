  text: Ведь ухо оценивает слова, как нёбо ощущает вкус пищи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт объяснительную и причинную связь с предшествующим призывом, естественно звуча по-русски.
- source_word: אֹזֶן
  choice: ухо
  rationale: Единственное число имеет обобщённо-пословичное значение; в русском языке форма без артикля естественно выражает общую истину.
- source_word: מִלִּין
  choice: слова
  rationale: Прямо передаёт значение арамеизирующей формы множественного числа и сохраняет речь как предмет оценки.
- source_word: תִּבְחָן
  choice: испытывает
  rationale: Глагол בחן означает проверять, подвергать испытанию; выбор сохраняет активную оценку услышанного.
- source_word: חֵךְ
  choice: нёбо
  rationale: Обозначает орган вкусового восприятия, а не рот вообще, и сохраняет телесный параллелизм с ухом.
- source_word: יִטְעַם
  choice: распознаёт вкус
  rationale: Передаёт действие вкусового восприятия естественнее, чем буквальное «пробует», которое по-русски может означать лишь попытку.
- source_word: לֶאֱכֹל
  choice: пищи
  rationale: Субстантивированная конструкция «для еды / то, что едят» естественно передаётся словом «пища».
