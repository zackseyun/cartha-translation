  terminology: '«Ухо», «слова», «нёбо» и «пища» удачно передают ключевые слова. Богословски нагруженной терминологии в стихе нет. Сноска не требуется: «пища» уже естественно передаёт субстантивированное לֶאֱכֹל; предложенный вариант с «то, что едят» не раскрывает существенной текстовой неопределённости.'
