  source_fidelity: 'Смысл параллелизма передан верно: ухо оценивает/проверяет слова так же, как вкусовой орган воспринимает пищу. Однако «распознаёт вкус пищи» несколько смещает прямое значение יִטְעַם («вкушает, ощущает вкус») к различению уже наличного вкуса. «Ощущает вкус пищи» сохраняет образ и не добавляет оттенка классификации.'
