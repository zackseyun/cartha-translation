  yaml_path: translation/ot/job/034/020.yaml
  text: In a moment they die; at midnight a people are shaken[a], and they pass away; the mighty are removed, not by hand.
translation:
  language: ru
  text: В одно мгновение они умирают; в полночь народ содрогается и исчезает; могучего убирают не рукой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не человеческой рукой»; еврейское выражение буквально означает «не рукой» и, вероятно, указывает на устранение без участия человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: в одно мгновение
  rationale: Передаёт краткость и внезапность события, не добавляя к тексту отдельного обстоятельства образа действия.
- source_word: יָמֻתוּ
  choice: они умирают
  rationale: Прямое соответствие обычному еврейскому глаголу со значением смерти; настоящее время сохраняет обобщённо-живое описание.
- source_word: וַחֲצוֹת לָיְלָה
  choice: в полночь
  rationale: Естественный русский эквивалент буквального выражения «в половине ночи».
- source_word: יְגֹעֲשׁוּ
  choice: содрогается
  rationale: Глагол געשׁ обозначает сотрясение, колебание или смятение; «содрогается» сохраняет образ потрясения и допускает как физический, так и общественный оттенок.
- source_word: עָם
  choice: народ
  rationale: Сохраняет собирательное единственное число еврейского существительного.
- source_word: וְיַעֲבֹרוּ
  choice: и исчезает
  rationale: В данном контексте עבר описывает уход или прекращение существования народа; «исчезает» естественно передаёт результат, не повторяя уже употреблённое «умирают».
- source_word: וְיָסִירוּ
  choice: устраняют
  rationale: Форма буквально активная, но действующее лицо не названо. Русская неопределённо-личная конструкция сохраняет эту неопределённость лучше, чем явно названный субъект.
- source_word: אַבִּיר
  choice: сильного
  rationale: Субстантивированное прилагательное стоит в единственном числе и обозначает сильного или могущественного человека; перевод сохраняет число исходного текста.
- source_word: לֹא בְיָד
  choice: не рукою
  rationale: Сохраняет краткую и намеренно нерасширенную еврейскую идиому; более явное указание на человеческое участие вынесено в примечание.
theological_decisions:
- issue: Кем устранён сильный в выражении «не рукою»
  choice: 'Действующее лицо не называется, а выражение сохранено буквально: «не рукою».'
  alternative: «не человеческой рукой» или явное указание на действие Бога
  rationale: Контекст допускает подразумеваемое Божье действие без человеческого посредничества, однако сам стих не называет действующее лицо прямо. Перевод сохраняет эту смысловую напряжённость и не превращает подразумеваемое в высказанное.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Формы «содрогается», «исчезает» и неопределённо-личное «устраняют» передают резкую последовательность событий. Форма «рукою» выбрана ради естественного возвышенного звучания устойчивого библейского выражения без архаизации всего стиха.
