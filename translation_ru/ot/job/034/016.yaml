  text: If you have understanding[a], hear this; listen to the sound of my words.
translation:
  language: ru
  text: Если у тебя есть разумение, выслушай это; вслушайся в мои слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к голосу (или звуку) моих слов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Если
  rationale: Сочетание союза с условной частицей вводит обращение, обусловленное наличием у слушателя разумения. В современном русском отдельная передача начального союза не требуется.
- source_word: בִּינָה
  choice: у тебя есть разумение
  rationale: Существительное обозначает разумение, способность понимать и рассуждать. Конструкция с «есть» передаёт подразумеваемое обладание этим качеством, не превращая существительное в прилагательное.
- source_word: שִׁמְעָה זֹּאת
  choice: выслушай это
  rationale: Императив שׁמע требует услышать сказанное; «выслушай» естественно передаёт направленное внимание и сохраняет указательное «это».
- source_word: הַאֲזִינָה
  choice: прислушайся
  rationale: Глагол выражает внимательное слушание. «Прислушайся» отличает его от предшествующего שׁמע и звучит естественно в современном литературном русском.
- source_word: לְקוֹל מִלָּי
  choice: к звучанию моих слов
  rationale: קוֹל может означать звук или голос. «Звучание моих слов» сохраняет конкретную еврейскую конструкцию и связь существительного со множественным «моих слов», не сводя выражение просто к «моим словам».
