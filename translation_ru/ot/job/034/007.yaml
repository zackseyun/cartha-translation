  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Кто из людей
  rationale: Сочетание вводит риторический вопрос со значением «какой человек / кто из людей». Такой перевод естественен по-русски и сохраняет мужской референт, не добавляя неявного оттенка силы.
- source_word: כְּאִיּוֹב
  choice: подобен Иову
  rationale: Предлог כ выражает сравнение; «подобен Иову» передаёт его ясно и в литературном русском регистре.
- source_word: יִשְׁתֶּה
  choice: пьёт
  rationale: Имперфект характеризует обычное или характерное действие в риторическом вопросе; настоящее время естественно передаёт этот смысл.
- source_word: לַּעַג
  choice: насмешки
  rationale: Существительное обозначает осмеяние, глумление или поношение. «Насмешки» понятно современному читателю и хорошо сочетается с метафорой питья.
- source_word: כַּמָּיִם
  choice: как воду
  rationale: Сохраняет прямое сравнение и яркий образ того, что поглощается легко и обильно.
