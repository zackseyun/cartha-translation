  yaml_path: translation/ot/job/034/008.yaml
  text: and keeps company with workers of wickedness[b][a], and walks with men of evil.
translation:
  language: ru
  text: и водится[a] с творящими беззаконие, и ходит с нечестивыми людьми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идёт вместе с ними» или «общается». Еврейское выражение может обозначать путь в чьём-либо обществе либо устойчивое общение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «со злодеями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָרַח לְ/חֶבְרָה
  choice: и водится
  rationale: Сочетание глагола ארח с לְחֶבְרָה здесь выражает пребывание в чьём-либо обществе, а не просто буквальное путешествие. «Водится» естественно передаёт устойчивое общение и нравственное сближение, сохраняя параллель с «ходит».
- source_word: עִם
  choice: с
  rationale: Обычный русский предлог совместности, уместный в обеих параллельных частях.
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящими беззаконие
  rationale: Причастная конструкция сохраняет буквальный смысл «делающие/творящие», а «беззаконие» передаёт здесь нравственную окраску אָוֶן, не сводя выражение к простому обозначению лиц.
- source_word: וְ/לָ/לֶכֶת
  choice: и ходит
  rationale: Сохраняет образ הלך, который в литературе мудрости может обозначать как совместное хождение, так и образ жизни.
- source_word: אַנְשֵׁי רֶשַׁע
  choice: с нечестивыми людьми
  rationale: «Нечестивые люди» естественно и точно передаёт אַנְשֵׁי רֶשַׁע; существительное «люди» сохраняет личное обозначение, а прилагательное избегает тяжеловесного «люди нечестия».
theological_decisions:
- issue: Нравственный характер описанного общения
  choice: «водится… и ходит» без уточнения степени согласия или соучастия
  alternative: «присоединяется» или «становится сообщником»
  rationale: Еврейский текст указывает на общение и совместное хождение, но сам по себе не требует более сильного утверждения о формальном соучастии; поэтому смысловая напряжённость сохранена.
- issue: Передача мужского множественного אַנְשֵׁי רֶשַׁע
  choice: «нечестивыми людьми»
  alternative: «нечестивыми мужчинами»
  rationale: В данном обобщённом контексте אַנְשֵׁי — обычное обозначение людей, а не акцент на биологическом поле. «Мужчинами» внесло бы ненужное смысловое выделение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Водится» понятно обычному читателю и выражает неодобряемое близкое общение; параллельное «ходит» сохраняет образ еврейского текста. Строчная начальная буква и союз «и» сохранены, поскольку стих синтаксически продолжает предыдущий контекст.
