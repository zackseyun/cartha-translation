lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Повелительная форма множественного числа передана прямым и естественным призывом; глагол сохраняет значение внимательного слушания.
- source_word: חֲכָמִים
  choice: мудрые
  rationale: Субстантивированное прилагательное в обращении передано без добавления существительного, что сохраняет форму и лаконизм еврейского текста.
- source_word: מִלָּי
  choice: мои слова
  rationale: Передаёт множественное число и притяжательный суффикс, сохраняя конкретное значение «слова, высказывания».
- source_word: וְיֹדְעִים
  choice: и вы, знающие
  rationale: Причастная форма, употреблённая субстантивно как обращение, сохранена без уточнения предмета знания, которого нет в исходном тексте.
- source_word: הַאֲזִינוּ
  choice: внимайте
  rationale: Глагол буквально связан с обращением слуха; «внимайте» отличает его от שׁמע и сохраняет поэтический параллелизм в достойном, понятном регистре.
- source_word: לִי
  choice: мне
  rationale: Предлог с местоименным суффиксом естественно передан дательным падежом при глаголе «внимать».
