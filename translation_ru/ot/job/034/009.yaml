  text: כִּֽי אָ֭מַר לֹ֣א יִסְכָּן גָּ֑בֶר בִּ֝/רְצֹת֗/וֹ עִם אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/034/009.yaml
  text: For he has said[a], ‘A man gains nothing by delighting himself with God.’
translation:
  language: ru
  text: 'Ведь он сказал[a]: «Человек ничего не приобретает, находя радость в Боге».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Человек ничего не приобретает, когда Бог благоволит к нему» или «Человек ничего не приобретает, ища Божьего благоволения». Еврейское выражение сжато и допускает несколько толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для обвинения Елиуя и естественно передаёт аргументативную связь с предыдущим контекстом.
- source_word: אָמַר
  choice: он сказал
  rationale: Перфект обозначает ранее высказанное, которое Елиуй приписывает Иову; русское прошедшее время естественно передаёт это значение.
- source_word: לֹא יִסְכָּן
  choice: ничего не приобретает
  rationale: Глагол выражает пользу, выгоду или приобретение; выбранная формулировка естественна по-русски и сохраняет представление о получаемой выгоде.
- source_word: גָּבֶר
  choice: человек
  rationale: Мужское существительное имеет здесь обобщающее значение; «человек» точно и естественно передаёт представителя человеческого рода без ненужного сужения до взрослого мужчины.
- source_word: בִּרְצֹתוֹ
  choice: находя радость
  rationale: 'Инфинитив от רצה с местоименным суффиксом допускает значение удовольствия или расположения. В основном тексте человек понимается как субъект: он находит радость в отношениях с Богом.'
- source_word: עִם אֱלֹהִים
  choice: в Боге
  rationale: Хотя עִם обычно означает «с», здесь оно обозначает отношение к Богу в составе компактной конструкции. «В Боге» естественно сочетается по-русски с выражением «находить радость», тогда как неоднозначность конструкции отмечена в сноске.
theological_decisions:
- issue: Толкование выражения בִּרְצֹתוֹ עִם אֱלֹהִים
  choice: человек ничего не приобретает, находя радость в Боге
  alternative: человек ничего не приобретает, когда Бог благоволит к нему; человек ничего не приобретает, ища Божьего благоволения
  rationale: Наиболее прямое прочтение считает человека субъектом инфинитива и передаёт обвинение, будто благочестие не приносит пользы. Однако сжатая еврейская конструкция допускает и другие синтаксико-смысловые связи, поэтому они сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, понятная и достойная по тону. Сохранена смысловая неоднозначность еврейской конструкции посредством сноски.
