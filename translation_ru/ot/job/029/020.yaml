  text: כְּ֭בוֹדִ/י חָדָ֣שׁ עִמָּדִ֑/י וְ֝/קַשְׁתִּ֗/י בְּ/יָדִ֥/י תַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/020.yaml
  text: My glory was ever fresh with me[b][a], and my bow was renewed in my hand.
translation:
  language: ru
  text: Слава моя оставалась со мной неувядающей[a], и лук мой обновлялся в руке моей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Слава моя была новой со мной». Здесь «новая» может означать постоянно свежую, неувядающую.'
    reason: lexical_alternative
  - marker: b
    text: Лук, вероятно, служит образом силы и жизненной мощи; в основном тексте сохранён конкретный древнееврейский образ.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: слава моя
  rationale: Сохраняет широкий смысл כָּבוֹד — славу, почёт и достоинство — без сведения его лишь к общественной репутации.
- source_word: חָדָשׁ
  choice: неувядающей
  rationale: Буквально прилагательное означает «новая», но в данном контексте выражает сохраняющуюся свежесть и силу; «неувядающей» естественно передаёт этот оттенок в сочетании со славой.
- source_word: עִמָּדִי
  choice: оставалась со мной
  rationale: Буквально «со мной»; добавленный по-русски глагол делает именную конструкцию естественной и передаёт мысль о том, что слава не покидала Иова.
- source_word: קַשְׁתִּי
  choice: лук мой
  rationale: Сохраняет конкретный древнееврейский образ; лук может образно указывать на силу и жизненную мощь.
- source_word: בְּיָדִי
  choice: в руке моей
  rationale: Прямо передаёт локативное выражение и сохраняет образ силы, готовой к действию.
- source_word: תַחֲלִיף
  choice: обновлялся
  rationale: Форма от חלף здесь выражает обновление или восстановление силы; русское несовершенное прошедшее соответствует описанию устойчивого состояния в воспоминании Иова.
