  terminology: «Праведность» и «правосудие» не смешивают два разных еврейских понятия. «Тюрбан» является прямой и понятной передачей צָנִיף; поясняющая сноска снимает возможные культурные недоразумения. Сноска к «праведности» корректно отмечает допустимый вариант «справедливость».
