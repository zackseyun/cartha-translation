  text: צֶ֣דֶק לָ֭בַשְׁתִּי וַ/יִּלְבָּשֵׁ֑/נִי כִּֽ/מְעִ֥יל וְ֝/צָנִ֗יף מִשְׁפָּטִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/014.yaml
  text: I put on righteousness[a], and it clothed me[b]; my justice was like a robe and a turban.
translation:
  language: ru
  text: Я облёкся в праведность[a], и она облекла меня; моё правосудие было как мантия и тюрбан[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я облёкся в справедливость». Еврейское צֶדֶק может означать и «праведность», и «справедливость».'
    reason: lexical_alternative
  - marker: b
    text: Тюрбан — обёрнутый вокруг головы убор; здесь он входит в образ почёта и общественного достоинства.
    reason: cultural_note
lexical_decisions:
- source_word: צֶדֶק
  choice: праведность
  rationale: Слово может обозначать как праведность, так и справедливость. «Праведность» сохраняет нравственный оттенок и позволяет отличить его от מִשְׁפָּטִי во второй строке.
- source_word: לָבַשְׁתִּי
  choice: я облёкся
  rationale: Глагол לבש означает надевать или носить одежду. «Облёкся» естественно передаёт образ праведности как одеяния и допускает поэтический повтор.
- source_word: וַיִּלְבָּשֵׁנִי
  choice: и она облекла меня
  rationale: 'Повтор того же корня создаёт намеренную взаимность образа: Иов облёкся в праведность, а праведность облекла его. Повтор «облёкся — облекла» сохраняет эту игру.'
- source_word: כִּמְעִיל
  choice: как мантия
  rationale: מְעִיל — верхняя одежда, одеяние или мантия. «Мантия» ясно передаёт торжественность и общественное достоинство образа.
- source_word: וְצָנִיף
  choice: и тюрбан
  rationale: צָנִיף обозначает обёрнутый вокруг головы убор. «Тюрбан» — прямой и понятный русский эквивалент; культурная сноска поясняет его функцию в образе.
- source_word: מִשְׁפָּטִי
  choice: моё правосудие
  rationale: מִשְׁפָּט может означать суд, судебное решение или справедливое отправление суда. В контексте общественной деятельности Иова «моё правосудие» передаёт его справедливое судейство и не сливает это слово с צֶדֶק.
theological_decisions: []
