  source_fidelity: 'Текст точно передаёт еврейскую конструкцию и её намеренно взаимный образ: Иов «облёкся» в праведность, а праведность «облекла» его. Различение צֶדֶק («праведность») и מִשְׁפָּטִי («моё правосудие») обоснованно и соответствует контексту публичной справедливости Иова. Образы верхней одежды и головного убора сохранены.'
