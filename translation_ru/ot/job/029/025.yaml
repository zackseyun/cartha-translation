  yaml_path: translation/ot/job/029/025.yaml
  text: I chose their way and sat as chief[a]; I dwelt like a king among the troops[c][b], like one who comforts mourners.
translation:
  language: ru
  text: Я выбирал для них путь и сидел во главе; я пребывал как царь среди воинов[a], как тот, кто утешает скорбящих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как царь в отряде». Еврейское слово может обозначать отряд, дружину или воинскую группу.'
