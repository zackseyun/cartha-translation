  - marker: b
    text: 'Последнее сравнение в еврейском тексте синтаксически трудно; возможно также понимание: «словно утешающий скорбящих».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֶבֲחַר דַּרְכָּם
  choice: Я выбирал для них путь
  rationale: Имперфект в ретроспективном контексте Иов 29 естественно передаёт повторявшееся в прошлом действие. Буквальное «выбирал их путь» по-русски может ошибочно означать, что Иов выбирал свойственный им образ жизни; «для них» ясно выражает вероятный смысл руководства, не устраняя полностью образ пути.
- source_word: וְאֵשֵׁב רֹאשׁ
  choice: и сидел во главе
  rationale: Сохраняется конкретный образ сидения и идиоматическое значение руководящего, почётного места.
- source_word: וְאֶשְׁכּוֹן
  choice: я пребывал
  rationale: Глагол שכן обозначает пребывание или обитание. «Пребывал» соответствует возвышенной поэтической речи и не сводит значение лишь к проживанию.
- source_word: כְּמֶלֶךְ בַּגְּדוּד
  choice: как царь среди воинов
  rationale: Предлог כ сохраняется как явное сравнение. גְּדוּד может обозначать отряд, дружину или воинскую группу; «среди воинов» естественно передаёт образ царя в окружении своего отряда.
- source_word: כַּאֲשֶׁר אֲבֵלִים יְנַחֵם
  choice: как тот, кто утешает скорбящих
  rationale: Трудная сравнительная конструкция передана без добавления явно названного субъекта. Единственное число глагола יְנַחֵם отражено оборотом «тот, кто», а אֲבֵלִים — современным и достойным «скорбящих».
theological_decisions:
- issue: Соотношение образа царственного предводителя и утешителя скорбящих
  choice: Сохранить оба сопоставления рядом, не объясняя, как именно они связаны.
  alternative: Понять последнюю строку как характеристику царя или переформулировать её так, чтобы она обозначала отдельную роль Иова.
  rationale: Еврейский синтаксис допускает трудность и напряжение между положением почёта и служением утешения; перевод не должен устранять их толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Сохранены параллелизм и образы пути, сидения во главе, царя среди воинов и утешения скорбящих; архаизмы и конфессионально окрашенные формулы не вводились.
