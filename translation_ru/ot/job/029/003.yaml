translation:
  language: ru
  text: когда Его светильник сиял над моей головой и при Его свете[a] я ходил во тьме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и при его свете я ходил во тьме», где «его» относится к светильнику. Еврейский местоименный суффикс может указывать либо на Бога в данном контексте, либо, во второй фразе, на непосредственно упомянутый светильник.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהִלּוֹ נֵרוֹ
  choice: когда Его светильник сиял
  rationale: Предлог בְּ с инфинитивом образует временной оборот. Конкретный образ נֵר передан словом «светильник», а действие выражено естественным для русского языка глаголом «сиял».
- source_word: עֲלֵי רֹאשִׁי
  choice: над моей головой
  rationale: Пространственное значение сохранено естественным современным русским оборотом.
- source_word: לְאוֹרוֹ
  choice: при Его свете
  rationale: Так передаётся свет, благодаря которому Иов мог идти. Местоимение отнесено к Богу в соответствии с контекстом, без устранения возможной связи со светильником.
- source_word: אֵלֶךְ
  choice: я ходил
  rationale: Имперфект в воспоминании о прошлом естественно обозначает обычное или повторявшееся действие; «ходил» сохраняет этот оттенок.
- source_word: חֹשֶׁךְ
  choice: во тьме
  rationale: В еврейском тексте нет отдельного показателя значения «через». Буквальное и естественное «во тьме» сохраняет образ движения среди тьмы.
theological_decisions:
- issue: К кому относится суффикс 3-го лица мужского рода в выражениях «Его светильник» и «при Его свете»
  choice: В основном тексте оба суффикса отнесены к Богу.
  alternative: 'Во втором выражении суффикс можно соотнести непосредственно со светильником: «при его свете».'
  rationale: Контекст главы говорит о Божьем благоволении и попечении, поэтому личное отнесение к Богу литературно уместно. Однако грамматическая близость слова «светильник» допускает иной референт во второй фразе, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены конкретный образ светильника, ретроспективный оттенок и неоднозначность местоименного суффикса.
