  yaml_path: translation/ot/job/029/022.yaml
  text: After my words they did not speak again[b][a], and my word dripped upon them.
translation:
  language: ru
  text: После моих слов они уже не говорили[a], и речь моя каплями падала на них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они больше не отвечали»; еврейский глагол может означать, что после слов Иова слушатели не повторяли сказанного и не отвечали вновь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «речь моя капала на них» — поэтический образ речи, подобной падающим каплям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי דְבָרִי
  choice: После моих слов
  rationale: Сохраняет временное значение אַחֲרֵי и конкретное множественное число דְבָרִי, естественно звуча по-русски.
- source_word: לֹא יִשְׁנוּ
  choice: они уже не говорили
  rationale: В контексте речевого обмена форма от שנה указывает, что после слов Иова слушатели не продолжали говорить или не отвечали вновь; «уже» естественно передаёт значение повторности.
- source_word: וְעָלֵימוֹ
  choice: на них
  rationale: Прямо передаёт предлог עַל с суффиксом третьего лица множественного числа и сочетается с образом падающих капель.
- source_word: תִּטֹּף
  choice: каплями падала
  rationale: Сохраняет поэтический образ глагола נטף — капать, падать каплями — без сведения метафоры к одному истолкованию.
- source_word: מִלָּתִי
  choice: речь моя
  rationale: Поэтическое единственное число обозначает произнесённое слово или речь; «речь моя» естественнее в русском контексте и отличается от предшествующего «моих слов».
