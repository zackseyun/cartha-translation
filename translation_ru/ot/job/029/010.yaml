  text: קוֹל נְגִידִ֥ים נֶחְבָּ֑אוּ וּ֝/לְשׁוֹנָ֗/ם לְ/חִכָּ֥/ם דָּבֵֽקָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/010.yaml
  text: The voice of nobles was hushed[b][a], and their tongue stuck to the roof of their mouth.
translation:
  language: ru
  text: Голос знатных умолкал[a], и язык их прилипал к нёбу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голос знатных скрывался»; то есть они переставали говорить.'
    reason: lexical_alternative
  - marker: b
    text: Образное выражение, означающее, что они не могли или не решались говорить.
    reason: idiom_explanation
lexical_decisions:
- source_word: קוֹל
  choice: голос
  rationale: Прямое и естественное соответствие; в контексте речь идёт о высказываниях высокопоставленных людей.
- source_word: נְגִידִים
  choice: знатных
  rationale: Слово обозначает предводителей, правителей или высокопоставленных людей. «Знатных» передаёт общественное положение, не сужая значение до монархических князей.
- source_word: נֶחְבָּאוּ
  choice: умолкал
  rationale: Основное значение глагола связано с сокрытием, но при подлежащем «голос» образ означает, что голос скрывался, исчезал из слышимости, то есть умолкал. Русское несовершенное прошедшее также естественно согласуется с описанием обычного почтительного поведения в контексте.
- source_word: וּלְשׁוֹנָם
  choice: и язык их
  rationale: Сохранён еврейский собирательный singular с местоименным суффиксом множественного числа; такая конструкция допустима и поэтична по-русски.
- source_word: לְחִכָּם
  choice: к нёбу
  rationale: חֵך означает нёбо. Краткое русское соответствие ясно передаёт телесный образ оригинала.
- source_word: דָּבֵקָה
  choice: прилипал
  rationale: Глагол означает «прилипать, прилепляться». «Прилипал» естественно передаёт образ неспособности или нежелания говорить и сохраняет аспектуальную согласованность с «умолкал».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного поэтического параллелизма. Формы «умолкал» и «прилипал» передают повторяющееся или обычное действие в воспоминании Иова; образ языка, прилипшего к нёбу, сохранён без сглаживания.
