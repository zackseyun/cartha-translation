- source_word: וְצוּר
  choice: и скала
  rationale: Прямое и образное соответствие צוּר; определённость естественна в параллельной поэтической картине.
- source_word: יָצוּק
  choice: изливала
  rationale: Передаёт יצק «лить, изливать» и сохраняет яркий образ обильного потока.
- source_word: עִמָּדִי
  choice: рядом со мной
  rationale: Сохраняет буквальный пространственный смысл «со мной, при мне», не устраняя возможный оттенок предназначенности Иову.
- source_word: פַּלְגֵי
  choice: потоки
  rationale: Естественно передаёт поэтическое значение русел или струящихся потоков.
- source_word: שָׁמֶן
  choice: масла
  rationale: Обычное соответствие שָׁמֶן; в древнеизраильском контексте обычно подразумевается оливковое масло.
