lexical_decisions:
- source_word: אֶשְׂחַק
  choice: Я улыбался
  rationale: Глагол שׂחק может означать смех или улыбку; в контексте благосклонного отношения Иова естественнее «улыбался», без оттенка насмешки.
- source_word: אֲלֵהֶם
  choice: им
  rationale: Предлог אֶל обозначает направленность действия; русское «улыбался им» естественно передаёт межличностную направленность.
- source_word: לֹא יַאֲמִינוּ
  choice: они не верили
  rationale: Сохранено прямое значение еврейской формы без добавления модального оттенка «едва могли поверить»; объект веры понятен из предшествующего действия.
- source_word: וְאוֹר פָּנַי
  choice: света моего лица
  rationale: Сохранён исходный образ светлого, благосклонного выражения лица.
- source_word: לֹא יַפִּילוּן
  choice: не омрачали
  rationale: 'Буквально форма означает «не заставляли падать», но в сочетании со «светом лица» русское «не омрачали» естественно сохраняет метафору и передаёт смысл: они не заставляли благосклонное выражение Иова исчезнуть.'
