lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание почёта Иова, описанного в контексте; «ведь» естественно передаёт пояснительно-причинный оттенок.
- source_word: אֲמַלֵּט
  choice: я спасал
  rationale: Пиэль глагола מלט обозначает активное избавление или спасение. Несовершенный вид по-русски уместно передаёт повторявшиеся поступки Иова в описываемый период.
- source_word: עָנִי
  choice: бедняка
  rationale: В данном контексте слово обозначает социально уязвимого бедного человека; «бедняк» ясно и естественно выражает этот смысл.
- source_word: מְשַׁוֵּעַ
  choice: взывавшего о помощи
  rationale: Причастие изображает человека в момент настойчивого призыва о помощи; причастный оборот сохраняет эту связь с существительным.
- source_word: יָתוֹם
  choice: сироту
  rationale: Русское «сирота» является естественным обозначением ребёнка, лишённого родительской опоры, хотя еврейское слово особенно связано с отсутствием отца; это уточняется в сноске.
- source_word: וְלֹא עֹזֵר לוֹ
  choice: у которого не было помощника
  rationale: Придаточное естественно связывает отсутствие поддержки с сиротой и сохраняет буквальный образ помощника.
