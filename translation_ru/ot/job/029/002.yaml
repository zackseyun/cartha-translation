lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: О, если бы я был
  rationale: Буквальное «кто даст меня?» представляет собой древнееврейский оборот, выражающий сильное желание. Русское «о, если бы я был» естественно передаёт его функцию, не превращая пожелание в прямой вопрос.
- source_word: כְיַרְחֵי קֶדֶם
  choice: как в прежние месяцы
  rationale: כְּ выражает сравнение, יֶרַח означает «месяц», а קֶדֶם здесь указывает на минувшее время. Формулировка сохраняет необычный образ месяцев и ретроспективный смысл.
- source_word: כִּימֵי
  choice: как в те дни
  rationale: Сохраняется поэтический параллелизм с предыдущим упоминанием месяцев; указательное «те» естественно обозначает вспоминаемое прошлое.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Это характерная для книги Иова поэтическая форма единственного числа со значением «Бог»; оснований добавлять «Всемогущий» в данном стихе нет.
- source_word: יִשְׁמְרֵנִי
  choice: хранил меня
  rationale: Глагол שׁמר охватывает значения «хранить», «оберегать», «стеречь». «Хранил меня» кратко и достойно передаёт здесь Божью защиту и заботу.
theological_decisions:
- issue: Характер вспоминаемого действия Бога
  choice: Бог хранил меня
  alternative: Бог оберегал меня / присматривал за мной
  rationale: Перевод передаёт воспоминание Иова о Божьей защитной заботе, не уточняя её механизм и не вводя дополнительных богословских положений.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической интонации. Необычное выражение «как в прежние месяцы» оставлено ради образности и параллелизма еврейского текста; смысл идиомы в начале разъяснён в сноске.
