  yaml_path: translation/ot/job/029/023.yaml
  text: They waited for me as for the rain[a], and they opened their mouths wide for the spring rain.
translation:
  language: ru
  text: 'Они ждали меня, как дождя,

    и широко раскрывали рты в ожидании позднего дождя[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весеннего дождя». Еврейское מַלְקוֹשׁ означает поздний сезонный дождь, выпадающий весной, ближе к концу дождливого периода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִחֲלוּ
  choice: ждали
  rationale: Глагол יחל обозначает ожидание, связанное с надеждой. «Ждали» естественно передаёт этот смысл в сравнении с долгожданным дождём, не усиливая эмоциональную окраску.
- source_word: כַמָּטָר
  choice: как дождя
  rationale: Предлог כ выражает сравнение. Русская конструкция «ждать кого-либо, как дождя» естественна и точно передаёт образ.
- source_word: לִי
  choice: меня
  rationale: В еврейском тексте стоит прямое местоименное выражение «для меня / меня». Контекст подразумевает ожидание слов Иова, но это уточнение не внесено в основной текст.
- source_word: וּפִיהֶם פָּעֲרוּ
  choice: и широко раскрывали рты
  rationale: פער означает широко раскрывать, особенно рот. Формулировка сохраняет яркий образ исходного текста и множественное число.
- source_word: לְמַלְקוֹשׁ
  choice: в ожидании позднего дождя
  rationale: מַלְקוֹשׁ — поздний сезонный дождь, выпадающий ближе к концу дождливого периода. Оборот «в ожидании» естественно передаёт направленность ל и связь со всей первой половиной стиха; «поздний дождь» сохраняет сельскохозяйственное значение термина.
