  rationale: 'Текст исправлен для передачи объяснительной функции כִּי и прямого отношения глаголов «слышать» и «видеть» к Иову. Сохранены поэтический параллелизм, обобщённые единичные образы и смысл благоприятного свидетельства. Дополнительная сноска не требуется: существенной текстологической или лексической неопределённости, которую нужно отражать в этом стихе, нет.'
