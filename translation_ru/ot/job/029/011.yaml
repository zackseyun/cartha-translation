  yaml_path: translation/ot/job/029/011.yaml
  text: For when an ear heard[a], it called me blessed, and when an eye saw, it testified for me.
translation:
  language: ru
  text: Ибо всякое ухо, слышавшее меня, называло меня блаженным, и всякий глаз, видевший меня, свидетельствовал в мою пользу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном воспоминании частица вводит повторяющуюся ситуацию прошлого; по-русски естественнее передать её вместе с временной конструкцией, сохранив связь с предыдущим контекстом.
- source_word: אֹזֶן שָׁמְעָה
  choice: ухо слышало обо мне
  rationale: Сохранён образ единственного числа, обобщённо обозначающий всякого слышавшего; дополнение «обо мне» естественно следует из контекста, хотя в еврейском оно подразумевается.
- source_word: וַתְּאַשְּׁרֵנִי
  choice: оно называло меня блаженным
  rationale: Форма от אשר означает признать или провозгласить кого-либо блаженным, достойным одобрения; «называло блаженным» сохраняет оценочный смысл.
- source_word: וְעַיִן רָאֲתָה
  choice: и когда глаз видел меня
  rationale: Сохранены параллелизм «ухо — глаз» и обобщённое единственное число; «меня» выражает объект зрения, подразумеваемый суффиксом следующего глагола и контекстом.
- source_word: וַתְּעִידֵנִי
  choice: он свидетельствовал в мою пользу
  rationale: Глагол означает свидетельствовать; контекст указывает на благоприятное свидетельство о Иове, что естественно передаётся оборотом «в мою пользу».
