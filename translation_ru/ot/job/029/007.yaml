lexical_decisions:
- source_word: בְּצֵאתִי
  choice: Когда я выходил
  rationale: Предлог ב с инфинитивом сопряжённой формы и суффиксом 1-го лица имеет временное значение; формулировка естественно передаёт воспоминание Иова о повторявшейся или обычной ситуации.
- source_word: שַׁעַר
  choice: к воротам
  rationale: Ворота древнего города служили местом общественных и судебных собраний. Предлог «к» естественно сочетается с глаголом движения, не подменяя отдельное упоминание города составным выражением «городские ворота».
- source_word: עֲלֵי קָרֶת
  choice: у города
  rationale: Не вполне однозначная идиоматическая фраза соотносит ворота с городом. Перевод сохраняет раздельность понятий «ворота» и «город» и передаёт вероятное пространственное значение.
- source_word: בָּרְחוֹב
  choice: на площади
  rationale: רְחוֹב обозначает широкое открытое общественное пространство, а не обязательно улицу в современном узком смысле.
- source_word: אָכִין
  choice: готовил
  rationale: Хифиль глагола כון здесь означает «готовить, устраивать». Несовершенный вид согласуется с воспоминанием о привычном действии.
- source_word: מוֹשָׁבִי
  choice: себе место
  rationale: В данном общественном контексте מוֹשָׁב — место для сидения или занимаемое место, а не жилище. Русское «готовил себе место» звучит естественнее буквального «готовил моё сиденье» и не уточняет без основания, было ли это особое кресло.
