  text: My roots were spread out to the waters[a], and dew stayed overnight on my branches.
translation:
  language: ru
  text: 'Мой корень простирался к водам,

    и роса ночевала на моих ветвях[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на моей жатве». Еврейское слово здесь необычно для данного контекста; перевод «на моих ветвях» лучше согласуется с образом корня и росы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְשִׁי
  choice: Мой корень
  rationale: Форма стоит в единственном числе с суффиксом первого лица. Русское единственное число естественно передаёт образ корня как всей корневой системы и сохраняет форму еврейского текста.
- source_word: פָתוּחַ
  choice: простирался
  rationale: Буквально причастие обозначает состояние «открыт, распростёрт». В сочетании с корнем глагол «простирался» естественно выражает направленный рост, не устраняя образности.
- source_word: אֱלֵי מָיִם
  choice: к водам
  rationale: Предлог выражает направленность или отношение, а форма מָיִם сохраняет поэтический образ вод во множественном числе.
- source_word: וְטַל
  choice: и роса
  rationale: Прямое и естественное соответствие еврейскому существительному טַל.
- source_word: יָלִין
  choice: ночевала
  rationale: Глагол לון означает оставаться или проводить ночь. «Ночевала» кратко и образно сохраняет временной оттенок и олицетворение росы.
- source_word: בִּקְצִירִי
  choice: на моих ветвях
  rationale: Обычное значение קָצִיר — «жатва, урожай», однако здесь оно трудно сочетается с образом корня и ночующей росы. Контекст допускает редкое значение, связанное с ветвями или молодой порослью; «на моих ветвях» сохраняет цельную растительную метафору. Более буквальная возможность отмечена в сноске.
