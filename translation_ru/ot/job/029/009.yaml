  text: שָׂ֭רִים עָצְר֣וּ בְ/מִלִּ֑ים וְ֝/כַ֗ף יָשִׂ֥ימוּ לְ/פִי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/009.yaml
  text: Princes held back their words[a], and put their hand over their mouth.
translation:
  language: ru
  text: Князья сдерживали речь[a] и прикрывали рот рукой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знатные воздерживались от речи».'
    reason: Лексически возможны «знатные» вместо «князья»; оборот также передаёт значение сдерживания речи.
lexical_decisions:
- source_word: שָׂרִים
  choice: князья
  rationale: Слово обозначает высокопоставленных людей или правителей; «князья» сохраняет высокий общественный статус и соответствует контексту почтения к Иову.
- source_word: עָצְרוּ
  choice: удерживали
  rationale: Глагол здесь передаёт сдерживание речи; «удерживали» естественно сочетается со словом «слова» и не усиливает значение до полного прекращения.
- source_word: בְמִלִּים
  choice: слова
  rationale: Буквально оборот означает «в/со словами», но при данном глаголе речь идёт о сдерживании слов, то есть речи; предлог передан идиоматически.
- source_word: וְכַף
  choice: рукой
  rationale: כַּף может обозначать ладонь или руку; в русском описании жеста молчания естественно употребить «рукой».
- source_word: יָשִׂימוּ
  choice: прикрывали
  rationale: Буквально «клали/помещали»; вместе с указанием на рот естественный русский эквивалент — «прикрывали», передающий жест самоумолчания.
- source_word: לְפִיהֶם
  choice: рот
  rationale: Буквально «к их рту/на их рот». Русское единственное число в конструкции «прикрывали рот рукой» естественно распределяется по каждому участнику, как и еврейский оборот.
