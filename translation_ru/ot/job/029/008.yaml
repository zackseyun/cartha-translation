  yaml_path: translation/ot/job/029/008.yaml
  text: The young men saw me and withdrew[a], and the aged rose and stood.
translation:
  language: ru
  text: Юноши, увидев меня, прятались[a], а старики вставали и стояли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отступали». Еврейский глагол буквально может означать «прятаться, скрываться»; здесь, вероятно, речь о том, что юноши почтительно удалялись при появлении Иова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּנִי
  choice: увидев меня
  rationale: Форма от ראה прямо обозначает зрительное восприятие; русское деепричастие естественно передаёт связь с последующим действием.
- source_word: נְעָרִים
  choice: юноши
  rationale: Слово обозначает молодых мужчин; «юноши» точно и естественно для поэтического контекста.
- source_word: וְנֶחְבָּאוּ
  choice: прятались
  rationale: Нифаль глагола חבא буквально означает «прятаться, скрываться». Основной текст сохраняет этот образ, а возможный социальный смысл почтительного отступления поясняется в сноске.
- source_word: וִישִׁישִׁים
  choice: старики
  rationale: ישישים обозначает людей преклонного возраста, здесь мужчин; «старики» передаёт возраст, не привнося значения должности, возможного у слова «старейшины».
- source_word: קָמוּ
  choice: вставали
  rationale: קום обозначает первоначальное действие — подняться, встать; несовершенный вид уместен в воспоминании Иова о повторявшемся поведении.
- source_word: עָמָדוּ
  choice: стояли
  rationale: 'עמד после קום сохраняет два последовательных элемента еврейской картины: старики вставали и оставались стоять.'
