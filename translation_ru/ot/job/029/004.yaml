lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Сохраняет сравнительно-воспоминательную связь с желанием Иова вновь пережить прежние дни.
- source_word: הָיִיתִי
  choice: было
  rationale: В сочетании «как было» естественно передаёт ретроспективное «как я был/когда я жил», не перегружая русский текст местоимением.
- source_word: בִּימֵי
  choice: в дни
  rationale: Сохраняет прозрачный древнееврейский временной оборот, естественный и в литературном русском языке.
- source_word: חָרְפִּי
  choice: моей зрелости
  rationale: Передаёт пору полноты сил и благополучного расцвета; буквальный сезонный образ осени вынесен в сноску.
- source_word: בְּסוֹד
  choice: сокровенная близость
  rationale: Передаёт одновременно доверительность, близкое общение и сокрытый от посторонних характер סוֹד, не сводя его только к сообщению тайны или формальному совету.
- source_word: אֱלוֹהַּ
  choice: с Богом
  rationale: Естественно выражает по-русски личную соотнесённость этой сокровенной близости с Богом.
- source_word: עֲלֵי
  choice: пребывала над
  rationale: Сохраняет пространственный образ присутствия над шатром и не объясняет его однозначно как защиту или благословение.
- source_word: אָהֳלִי
  choice: моим шатром
  rationale: Сохраняет конкретный древнееврейский образ шатра, который по контексту также охватывает дом и семью Иова.
theological_decisions:
- issue: Характер прежних отношений Иова с Богом в выражении בְּסוֹד אֱלוֹהַּ
  choice: «сокровенная близость с Богом» — доверительное общение и Божье благоволение без утверждения о специальном мистическом откровении
  alternative: «тайный совет Бога» или «тайна Бога» над шатром Иова
  rationale: Слово סוֹד допускает значения доверительного круга, совета, тайны и близкого общения. Основной текст передаёт личностную сторону выражения, а сноска сохраняет более буквальное и совещательное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Сохранены образ шатра, пространственное «над» и неоднозначность סוֹד; знаки препинания показывают, что стих продолжает предыдущее высказывание.
