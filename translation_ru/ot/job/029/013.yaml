lexical_decisions:
- source_word: בִּרְכַּת
  choice: благословение
  rationale: Форма сопряжённого состояния בְּרָכָה образует сочетание «благословение погибавшего»; по-русски родительный падеж естественно сохраняет возможный оттенок как произнесённого им благословения, так и связанного с ним благословения.
- source_word: אֹבֵד
  choice: погибавшего
  rationale: Причастие qal от אבד может обозначать человека, который гибнет, терпит крах или находится на грани смерти. Субстантивированная форма «погибавшего» сохраняет процессуальность и не сужает значение до одной лишь физической смерти.
- source_word: עָלַי תָּבֹא
  choice: приходило на меня
  rationale: Поэтический образ благословения, приходящего на Иова, сохранён; несовершенный вид «приходило» естественно передаёт ретроспективное, возможно повторявшееся действие в контексте Иов 29.
- source_word: לֵב אַלְמָנָה
  choice: сердце вдовы
  rationale: Буквальное и прозрачное соответствие, где «сердце» обозначает внутреннего человека и его чувства.
- source_word: אַרְנִן
  choice: я побуждал ликовать
  rationale: 'Hiphil 1-го лица ед. числа от רנן имеет каузативный смысл: Иов вызывал у сердца вдовы радостное ликование. «Побуждал ликовать» сохраняет каузативность и возвышенный поэтический регистр.'
