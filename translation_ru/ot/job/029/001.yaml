lexical_decisions:
- source_word: וַיֹּסֶף
  choice: продолжил
  rationale: Глагол יסף буквально означает «добавить» и в сочетании с последующим инфинитивом передаёт продолжение действия; «продолжил» естественно выражает этот повествовательный оборот.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: שְׂאֵת
  choice: начав
  rationale: Инфинитив от נשׂא буквально означает «поднять, взять»; в выражении נשׂא משל речь идёт о том, чтобы выступить с речью. «Начав свою речь» естественно передаёт идиому, не создавая в русском неясного образа физического поднятия.
- source_word: מְשָׁלוֹ
  choice: свою речь
  rationale: 'מָשָׁל имеет широкий диапазон значений: «притча», «изречение», «образная речь», «речь». Здесь слово вводит пространное поэтическое выступление Иова, поэтому контекстуально уместно «речь»; иные значения отмечены в сноске.'
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Прямой и естественный перевод стандартной повествовательной формы, вводящей последующую прямую речь.
