  text: אָ֣ב אָ֭נֹכִֽי לָֽ/אֶבְיוֹנִ֑ים וְ/רִ֖ב לֹא יָדַ֣עְתִּי אֶחְקְרֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/029/016.yaml
  text: I was a father to the poor[a], and I investigated the case of one I did not know.
translation:
  language: ru
  text: Я был отцом для нуждающихся; дело, которого я не знал, я тщательно исследовал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я тщательно разбирал дело незнакомого мне человека».'
    reason: Выражение «я не знал» иногда понимают как относящееся к человеку, чьё дело разбирал Иов; наиболее прямое прочтение относит его к самому делу (тяжбе).
lexical_decisions:
- source_word: אָב
  choice: отцом
  rationale: Сохранён буквальный образ отца, который в контексте выражает заботу, защиту и заступничество.
- source_word: אָנֹכִי
  choice: Я был
  rationale: Самостоятельное местоимение подчёркивает субъект; прошедшее время обусловлено воспоминанием Иова о прежней жизни в главе 29.
- source_word: לָאֶבְיוֹנִים
  choice: для нуждающихся
  rationale: אֶבְיוֹן обозначает бедного, нуждающегося человека; «для нуждающихся» естественно сочетается с метафорой отцовской заботы и не сводит нужду исключительно к бедности.
- source_word: וְרִיב
  choice: и ... дело
  rationale: רִיב может обозначать спор, тяжбу или судебное дело. В данном контексте «дело» передаёт правовой оттенок без излишней конкретизации.
- source_word: לֹא יָדַעְתִּי
  choice: незнакомого мне человека
  rationale: В основном тексте выражение понято как указание на человека, которого Иов прежде не знал; синтаксическая возможность отнести его к самому делу сохранена в примечании.
- source_word: אֶחְקְרֵהוּ
  choice: тщательно разбирал
  rationale: חקר означает старательно исследовать или выяснять. В контексте разбирательства «тщательно разбирал» звучит естественно и передаёт повторявшееся действие в прошлом.
theological_decisions:
- issue: К кому относится выражение לֹא יָדַעְתִּי — к человеку или к делу
  choice: К незнакомому Иову человеку, чьё дело он разбирал
  alternative: К неизвестному Иову делу или спору
  rationale: Контекст подчёркивает беспристрастную защиту уязвимых, включая незнакомых людей, однако еврейский синтаксис допускает отнесение выражения непосредственно к רִיב («дело»), поэтому альтернативное понимание вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык; сохранён достоинственный образ «отца», а юридическая лексика передана понятно и без канцелярской тяжеловесности.
