  terminology: «Отец» сохраняет исходный образ заботливого защитника. «Дело» адекватно передаёт רִיב в данном контексте, не сужая его до формального судебного процесса. Альтернативное отнесение «не знал» к человеку следует оставить в сноске, поскольку оно отражено в английском аудиторском следе и возможно как интерпретация, но не является наиболее прямым синтаксическим прочтением.
