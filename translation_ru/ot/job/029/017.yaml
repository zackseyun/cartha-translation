  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֲשַׁבְּרָה
  choice: Я сокрушал
  rationale: Усиленная форма от שׁבר передаёт решительное разрушение; в контексте воспоминаний Иова естествен русский несовершенный вид, обозначающий обычное действие в прошлом.
- source_word: מְתַלְּעוֹת
  choice: клыки
  rationale: Слово обозначает челюсти или зубы хищника; «клыки» естественно сохраняет образ опасного зверя.
- source_word: עַוָּל
  choice: неправедного
  rationale: Передаёт нравственно виновного, поступающего несправедливо человека, не сужая значение до конкретного вида преступления.
- source_word: אַשְׁלִיךְ
  choice: выбрасывал
  rationale: Буквально глагол означает «бросать, отбрасывать»; выбор сохраняет исходный образ и не заменяет его более интерпретирующим «вырвал».
- source_word: טָרֶף
  choice: добычу
  rationale: Обычное значение — добыча хищника; оно согласуется с образами клыков и зубов.
theological_decisions:
- issue: Образ суда над неправедным
  choice: Сохранена метафора хищника без уточнения личности пострадавшего или характера правонарушения.
  alternative: 'Передать смысл разъяснительно: «спасал его жертву».'
  rationale: Еврейский текст говорит о добыче и зубах, оставляя применение образа широким; перевод не должен добавлять отсутствующую конкретизацию.
