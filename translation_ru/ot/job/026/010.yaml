  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
translation:
  language: ru
  text: Он провёл круговую черту по поверхности вод[a] — до предела, где свет соприкасается с тьмой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он установил границу на поверхности вод — до предела света и тьмы».'
    reason: Лексически חֹק может означать установленную границу, а חָג — проведение круговой черты; еврейская конструкция допускает как образ очерченного круга, так и акцент на установленном пределе.
lexical_decisions:
- source_word: חֹק חָג
  choice: очертил круг
  rationale: Сочетание חֹק и חָג передаёт образ проведения установленной круговой черты. «Очертил круг» естественно звучит по-русски и сохраняет конкретную поэтическую картину, не сводя её к отвлечённому постановлению.
- source_word: עַל פְּנֵי מָיִם
  choice: по поверхности вод
  rationale: Передаёт буквальный пространственный образ «на лице/поверхности вод» современным литературным русским языком.
- source_word: עַד תַּכְלִית
  choice: до границы
  rationale: עַד обозначает предел протяжённости, а תַּכְלִית — край или конечную границу. Такое сочетание сохраняет значение предела и естественно связывает две части строки.
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: где свет встречается с тьмой
  rationale: 'Буквально: «свет с тьмой». Формулировка сохраняет образ их соприкосновения и не уточняет сверх текста, является ли эта черта пространственной границей или поэтическим пределом.'
