  text: He covers the face of his throne[b][a], spreading his cloud over it.
translation:
  language: ru
  text: Он скрывает лик Своего престола[a], простирая над ним Своё облако.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «держит лик Своего престола». Еврейский глагол буквально может означать «схватывать» или «держать», но здесь, судя по следующей строке об облаке, вероятно, говорится о сокрытии престола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: скрывает
  rationale: Форма от אחז обычно означает «держать, схватывать», однако в сочетании с образом облака, простёртого над престолом, здесь передаёт действие, скрывающее его из виду. Выбор сохраняет смысл поэтического параллелизма, а буквальная возможность отмечена в сноске.
- source_word: פְּנֵי
  choice: лик
  rationale: Буквально «лицо»; в данном сочетании может обозначать видимую сторону или поверхность. «Лик престола» сохраняет яркий древнееврейский образ и соответствует возвышенному поэтическому регистру.
- source_word: כִסֵּה
  choice: Своего престола
  rationale: Существительное означает «престол». Притяжательное местоимение в русском естественно выражает принадлежность престола Богу — подразумеваемому субъекту строки; написание с прописной буквы соответствует принятому русскому библейскому стилю.
- source_word: פַּרְשֵׁז
  choice: простирая
  rationale: Редкая поэтическая форма передаёт распространение или простирание. Деепричастие естественно связывает действие с первой частью строки.
- source_word: עָלָיו
  choice: над ним
  rationale: Местоименный суффикс мужского рода естественно соотносится с «престолом»; предлог «над» ясно передаёт пространственное отношение.
- source_word: עֲנָנוֹ
  choice: Своё облако
  rationale: Единственное число с притяжательным суффиксом означает «его облако». Возвратное «Своё» недвусмысленно связывает облако с подразумеваемым субъектом — Богом.
theological_decisions:
- issue: Подразумеваемый субъект и принадлежность престола
  choice: Бог скрывает Свой престол Своим облаком.
  alternative: 'Можно перевести без выраженного притяжательного отношения: «лик престола».'
  rationale: Контекст описывает Божье владычество над мирозданием, а местоименный суффикс при «облаке» подтверждает, что Бог — подразумеваемый субъект. Русское «Своего» делает естественной эту контекстуальную связь, не добавляя отдельного догматического утверждения.
- issue: Значение מְאַחֵז
  choice: скрывает
  alternative: держит / схватывает
  rationale: Основное лексическое значение связано с удерживанием, но следующая строка об облаке указывает на сокрытие престола. Чтобы не устранить подлинную лексическую напряжённость, буквальная альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической окраской. «Лик» выбран ради сохранения древнееврейского образа; синтаксис остаётся ясным для современного читателя. Местоимения, относящиеся к Богу, даны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
