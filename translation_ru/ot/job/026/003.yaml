  text: How you have counseled one without wisdom[a], and made sound wisdom known abundantly!
translation:
  language: ru
  text: Какой совет ты дал не имеющему мудрости, и как обильно разъяснил здравое суждение!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: Как хорошо
  rationale: В контексте иронического упрёка מַה вводит восклицание. Добавление «хорошо» делает русскую конструкцию естественной и ясно передаёт сарказм, не превращая её в прямой вопрос.
- source_word: יָּעַצְתָּ
  choice: ты посоветовал
  rationale: Глагол יעץ означает «советовать, давать совет»; простой современный глагол сохраняет прямоту обращения.
- source_word: לְלֹא חָכְמָה
  choice: тому, у кого нет мудрости
  rationale: Передаёт лицо, которому даётся совет, не уточняя его сверх того, что выражено еврейским текстом.
- source_word: חָכְמָה
  choice: мудрости
  rationale: Обычный и контекстуально точный эквивалент в литературе мудрости.
- source_word: וְתוּשִׁיָּה
  choice: здравую мудрость
  rationale: תּוּשִׁיָּה здесь обозначает основательную, действенную мудрость или здравое суждение; сочетание сохраняет связь с тематикой мудрости и отличие от חָכְמָה.
- source_word: לָרֹב
  choice: во множестве
  rationale: Передаёт идею большой меры или изобилия и поддерживает ироническое усиление.
- source_word: הוֹדָעְתָּ
  choice: раскрыл
  rationale: Каузатив от ידע буквально значит «сделал известным». «Раскрыл» естественно по-русски передаёт сообщение или объяснение мудрости без оттенка особого откровения.
