revisions:
- from: Как хорошо ты посоветовал тому, у кого нет мудрости[a], и во множестве раскрыл здравую мудрость!
  to: Какой совет ты дал не имеющему мудрости, и как обильно разъяснил здравое суждение!
  rationale: Убрано не выраженное в исходном тексте «хорошо». Начальное מַה передано естественной для русского иронической реплики формой «Какой совет ты дал», а альтернативное «Как ты советовал» сохранено в сноске. «Во множестве» заменено на «обильно», а «раскрыл» — на «разъяснил» для естественного современного звучания при сохранении смысла «сделал известным».
