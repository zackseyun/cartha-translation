translation:
  language: ru
  text: Столпы небес дрожат и изумляются от Его окрика.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колеблются» / «трепещут» вместо «дрожат».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поражаются» / «приходят в ужас» вместо «изумляются».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «от Его окрика»; предлог может обозначать также причину: «из-за Его окрика».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: столпы небес
  rationale: Сохраняет поэтический космический образ и конструкцию сопряжённого сочетания, не превращая образ ни в буквальное описание мироздания, ни в толкование о горах или основаниях.
- source_word: יְרוֹפָפוּ
  choice: дрожат
  rationale: Глагол רפף передаёт дрожь, колебание или трепет. «Дрожат» естественно по-русски и сохраняет как движение, так и оттенок потрясения.
- source_word: וְיִתְמְהוּ
  choice: и цепенеют
  rationale: Форма от תמהּ обозначает ошеломлённую, поражённую реакцию. «Цепенеют» выразительно сочетается с «дрожат», не сводя смысл исключительно к удивлению или нравственному ужасу.
- source_word: מִגַּעֲרָתוֹ
  choice: от Его грозного окрика
  rationale: Предлог מִן допускает значение источника или причины, поэтому «от» сохраняет исходную неоднозначность. גְּעָרָה означает властный, угрожающий окрик или порицание; «грозный окрик» здесь естественнее и конкретнее отвлечённого «укор».
theological_decisions:
- issue: Космический образ «столпов небес»
  choice: Сохранить образ без демифологизации и без буквального космологического пояснения.
  alternative: Истолковать столпы как горы, основания небес или буквальные элементы древней модели мира.
  rationale: Поэтический текст сам использует этот космический образ; перевод должен передать его, а не подменять толкованием.
- issue: Характер Божьей גְּעָרָה
  choice: Передать как «грозный окрик», сохранив властную и устрашающую силу слова.
  alternative: «Укор», «обличение» или «запрещение».
  rationale: Эти варианты возможны, однако способны сузить смысл до нравственного порицания или специального богословского термина; контекст подчёркивает потрясающую космос властную речь.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической окраской. «Столпы» уместны для величественного космического образа; синтаксис краток и ритмичен. Прописная буква в «Его» служит русской издательской норме для однозначного местоименного указания на Бога, не добавляя имени в основной текст.
