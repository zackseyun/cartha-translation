  text: How you have helped the powerless! How you have saved the arm without strength![a]
translation:
  language: ru
  text: Как же ты помог бессильному! Как же спас руку, лишённую силы![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Что ты сделал для того, у кого нет силы? Как спас руку, в которой нет мощи?» Еврейский текст звучит резко иронично.'
    reason: Сохраняет возможное вопросительное прочтение מֶה, не создавая ложного значения средства помощи, и поясняет ироническую силу стиха.
lexical_decisions:
- source_word: מֶה
  choice: Как же
  rationale: В риторическом контексте מֶה передаёт ироническое восклицание; «как же» естественно выражает эту силу по-русски, не превращая похвалу в искреннюю.
- source_word: עָזַרְתָּ
  choice: ты помог
  rationale: Глагол עזר означает «помогать»; форма совершенного вида уместно передаёт завершённое действие в прямом ироническом обращении.
- source_word: לְלֹא כֹחַ
  choice: бессильному
  rationale: Выражение буквально указывает на того, у кого нет силы. Субстантивированное прилагательное сохраняет единственное число и звучит естественно в русском стихе.
- source_word: הוֹשַׁעְתָּ
  choice: спас
  rationale: ישׁע имеет значение «спасать, избавлять». «Спас» сохраняет основной смысл и параллель с «помог».
- source_word: זְרוֹעַ
  choice: руку
  rationale: Сохранён буквальный поэтический образ руки как носителя силы, а не заменён отвлечённым словом «сила».
- source_word: לֹא עֹז
  choice: лишённую силы
  rationale: עֹז означает силу или мощь. Такой оборот естественен по-русски и сохраняет параллелизм с «бессильному».
