  text: Мёртвые трепещут под водами[a], и те, кто обитает в них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мёртвые корчатся под водами». Еврейское רְפָאִים может означать умерших или тени умерших, а יְחוֹלָלוּ — «корчатся», «содрогаются».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְפָאִים
  choice: мёртвые
  rationale: В поэтическом контексте речь идёт об умерших, пребывающих в подземном мире, а не о древнем народе рефаимов. «Мёртвые» естественно и ясно передаёт смысл, не превращая образ в собственное имя.
- source_word: יְחוֹלָלוּ
  choice: трепещут
  rationale: Глагол может обозначать дрожь, содрогание или мучительное корчение. «Трепещут» соответствует картине страха перед Божьим владычеством и сохраняет возвышенный поэтический регистр.
- source_word: מִתַּחַת מַיִם
  choice: под водами
  rationale: Передаёт пространственный образ местонахождения ниже вод кратко и естественно по-русски.
- source_word: וְשֹׁכְנֵיהֶם
  choice: и те, кто обитает в них
  rationale: Местоименный суффикс естественнее всего отнести к водам. Формулировка сохраняет референциальную неоднозначность образа, не уточняя природу обитателей.
theological_decisions:
- issue: Значение רְפָאִים
  choice: мёртвые в подземном мире
  alternative: рефаимы как древний народ; тени умерших
  rationale: Контекст описывает Божью власть над подземной и космической областями, поэтому слово употреблено в поэтическом значении умерших, а не как этноним.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим звучанием. Сохранены образ подземных вод и синтаксический параллелизм еврейского текста.
