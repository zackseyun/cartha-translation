  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: ru
  text: Своим дыханием Он украсил небеса[a]; Его рука создала ускользающего змея[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своим Духом» или «Своим ветром». Еврейское слово может означать дыхание, ветер или дух.'
