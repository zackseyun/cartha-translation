    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: От Его дыхания
  rationale: רוּחַ может означать «дыхание», «ветер» или «дух». «Дыхание» сохраняет конкретный поэтический образ Божьего творческого действия, не делая однозначным возможное личностное понимание «Духа»; בְּ передаёт средство или действующую силу.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Возвышенное и естественное русское соответствие для космологического контекста поэзии Иова.
- source_word: שִׁפְרָה
  choice: сияют красотой
  rationale: Форма от שׁפר выражает красоту, великолепие или ясность. Выражение передаёт результирующее состояние небес и соединяет оттенки красоты и сияния, не сводя слово только к яркости.
- source_word: חֹלֲלָה
  choice: пронзила
  rationale: В данном сочетании с «Его рука» и образом змея глагол естественно выражает враждебное действие и поддерживает мотив космической борьбы. Иные разборы, включая «образовала», отмечены в сноске.
- source_word: יָדוֹ
  choice: Его рука
  rationale: Сохранён конкретный поэтический образ руки как проявления Божьей деятельной силы.
- source_word: נָחָשׁ בָּרִיחַ
  choice: ускользающего змея
  rationale: בָּרִיחַ допускает значения «убегающий», «скользящий» и близкие оттенки. «Ускользающий» естественно по-русски передаёт движение и сохраняет неопределённость мифопоэтического образа.
theological_decisions:
- issue: Следует ли переводить רוּחַ как «Дух», тем самым предполагая отдельную личностную или тринитарную отсылку
  choice: В основном тексте — «дыхание»
  alternative: «Дух» или «ветер»
  rationale: Еврейское слово допускает все три смысла, но само по себе не требует здесь явной личностной отсылки. Основной вариант сохраняет поэтический образ, а альтернативы вынесены в сноску.
- issue: Следует ли прямо отождествить נָחָשׁ בָּרִיחַ с сатаной или Левиафаном
  choice: Сохранён образ «ускользающего змея»
  alternative: «Левиафан», «змей хаоса» или богословское отождествление с сатаной
  rationale: Стих содержит образ космической борьбы, но прямо не называет ни сатану, ни Левиафана. Перевод не уточняет референт сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конкретные образы «дыхания», «небес», «руки» и «змея» сохранены; неоднозначность רוּחַ и спорное значение חֹלֲלָה не устранены, а отражены в сносках. Маркеры стоят непосредственно при соответствующих выражениях.
