  text: צֹרֵֽר מַ֥יִם בְּ/עָבָ֑י/ו וְ/לֹא נִבְקַ֖ע עָנָ֣ן תַּחְתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/008.yaml
  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: ru
  text: Он заключает воды в своих облаках[a], но облако под ними не разрывается[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своих густых облаках»; древнееврейское слово может подчёркивать плотность облачной массы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не лопается»; древнееврейский глагол буквально означает «не разрывается», «не раскалывается».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרֵר
  choice: заключает
  rationale: Причастие от צרר передаёт связывание, обёртывание или удерживание внутри. «Заключает» естественно по-русски выражает образ вод, удерживаемых в облаках, не превращая его в простое «собирает».
- source_word: מַיִם
  choice: воды
  rationale: Сохранено множественное число древнееврейского слова и возвышенный поэтический образ.
- source_word: בְּעָבָיו
  choice: в своих облаках
  rationale: עָב обозначает облако, нередко густое, плотное. Основной вариант остаётся ясным и естественным; оттенок плотности указан в сноске. Суффикс принадлежности передан словом «своих».
- source_word: וְלֹא
  choice: но ... не
  rationale: 'Союз передан противительным «но»: несмотря на удерживаемые воды, облако не разрывается.'
- source_word: נִבְקַע
  choice: не разрывается
  rationale: Нифаль глагола בקע означает быть расколотым, рассечённым или разорванным. Возвратная форма сохраняет непереходность и наглядный образ исходного текста.
- source_word: עָנָן
  choice: облако
  rationale: Сохранено единственное число древнееврейского текста; существительное может иметь собирательное или обобщающее значение.
- source_word: תַּחְתָּם
  choice: под ними
  rationale: Суффикс имеет форму третьего лица мужского рода множественного числа. «Под ними» сохраняет грамматическое число и не устраняет возможную неоднозначность того, к чему относится местоимение.
