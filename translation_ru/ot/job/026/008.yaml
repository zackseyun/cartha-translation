  source_fidelity: 'Текст точно передаёт основные элементы еврейского стиха: צֹרֵר — «заключает/удерживает», «воды», «в своих облаках», отрицание разрыва облака и намеренно сохранённое неоднозначное «под ними» для תַּחְתָּם. Переход от множественного «облаках» к единственному «облако» сохранён, как в оригинале. Противительное «но» уместно передаёт контраст, хотя формально стоит וְ.'
