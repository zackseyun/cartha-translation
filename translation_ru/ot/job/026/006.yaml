source:
  edition: WLC
  text: עָר֣וֹם שְׁא֣וֹל נֶגְדּ֑/וֹ וְ/אֵ֥ין כְּ֝ס֗וּת לָֽ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: ru
  text: Шеол обнажён перед Ним[a], и у Аваддона нет покрова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Шеол открыт перед Ним».'
    reason: lexical_alternative
  - marker: b
    text: «Аваддон» можно также перевести как «гибель» или «место погибели».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: обнажён
  rationale: Прилагательное означает «наг, обнажён». Краткое «обнажён» сохраняет яркий поэтический образ и параллель с отсутствием покрова во второй строке.
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет особое обозначение мира мёртвых в древнееврейской поэзии и не сужает его значение до могилы.
- source_word: נֶגְדּוֹ
  choice: перед Ним
  rationale: Прямо передаёт значение «перед ним, в его присутствии»; из контекста местоимение относится к Богу, но имя Бога в текст не добавляется.
- source_word: אֵין
  choice: нет
  rationale: Русская безличная конструкция «у Аваддона нет» естественно и близко передаёт древнееврейское выражение отсутствия.
- source_word: כְּסוּת
  choice: покрова
  rationale: «Покров» сохраняет образ того, что скрывает или покрывает, и образно соответствует слову «обнажён».
- source_word: אֲבַדּוֹן
  choice: Аваддон
  rationale: Транслитерация сохраняет параллель с Шеолом, поэтическую персонификацию или топонимическую окраску и межтекстовые связи; буквальное значение отмечено в сноске.
theological_decisions:
- issue: К кому относится суффикс 3-го лица мужского рода в נֶגְדּוֹ
  choice: 'Местоимение относится к Богу: «перед Ним».'
  alternative: Перед неуточнённым наблюдателем в непосредственном контексте.
  rationale: Контекст описывает Божью власть и открытость перед Ним сокрытых областей. Перевод сохраняет местоимение исходного текста, не добавляя имени Бога.
- issue: Статус אֲבַדּוֹן
  choice: Передать как «Аваддон», сохранив имяподобную форму.
  alternative: 'Передать нарицательно: «гибель» или «место погибели».'
  rationale: Параллелизм с Шеолом поддерживает обозначение области смерти, однако лексическая связь с гибелью остаётся существенной и отмечается в сноске.
translation_notes:
  register: Современный литературный русский с лаконичным, возвышенно-поэтическим строем. Заглавная буква в «Ним» помогает контекстуально обозначить Бога, не заменяя местоимение поясняющим именем. Термины «Шеол» и «Аваддон» сохранены транслитерацией, а менее знакомое значение пояснено в сноске.
