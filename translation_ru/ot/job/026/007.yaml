  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: ru
  text: 'Он простирает север над пустотой[a][b],

    подвешивает землю без всякой опоры.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «северное небо». В еврейском тексте буквально: «север»; в этом поэтическом контексте может подразумеваться северная часть небес.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бесформенная пустота». Еврейское слово может обозначать пустоту, бесформенность или пустынность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: простирает
  rationale: Причастие породы qal от נטה передаёт продолжающееся действие — «простирать, растягивать». «Простирает» естественно сохраняет возвышенный поэтический образ.
- source_word: צָפוֹן
  choice: север
  rationale: Обычное значение существительного — «север». В данном космологическом контексте оно может обозначать северную часть неба, но буквальное «север» сохраняет смысловую открытость оригинала.
- source_word: תֹּהוּ
  choice: пустота
  rationale: Слово может означать пустоту, безвидность или необитаемое пространство. «Пустота» ясно и кратко передаёт образ, не сужая его до одного специального значения.
- source_word: תֹּלֶה
  choice: подвешивает
  rationale: Причастие породы qal от תלה означает «вешать, подвешивать». «Подвешивает» в русском языке точнее выражает образ земли, не имеющей видимой опоры.
- source_word: אֶרֶץ
  choice: землю
  rationale: В космическом контексте אֶרֶץ обозначает землю как мир, а не отдельную страну или территорию.
- source_word: בְּלִי מָה
  choice: ни на чём
  rationale: Сочетание буквально выражает отсутствие чего-либо; вместе с עַל естественный русский эквивалент — «ни на чём».
- source_word: עַל
  choice: над / на
  rationale: 'Один и тот же предлог в двух параллельных строках передан по нормам русского управления: «над пустотой» и «ни на чём», при сохранении пространственного образа.'
theological_decisions:
- issue: Космологическая образность
  choice: Сохранить поэтическое описание Божьей власти над мирозданием без добавления современных научных утверждений.
  alternative: Понимать строку как точное научное описание положения Земли в космосе либо прямо вводить мифологическое толкование «севера».
  rationale: Стих относится к поэтической литературе мудрости и изображает власть Бога над космосом. Перевод передаёт заявленные еврейским текстом образы, не превращая их ни в чистую метафору, ни в современную научную формулу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух строк сохранён; двусмысленность слова «север» не устранена толкованием.
