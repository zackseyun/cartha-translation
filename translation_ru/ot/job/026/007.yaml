  source_fidelity: 'Основные соответствия еврейскому тексту сохранены: נֹטֶה — «простирает», צָפוֹן — «север», תֹהוּ — «пустота», תֹּלֶה — «подвешивает», אֶרֶץ — «землю». Однако «подвешивает землю ни на чём» синтаксически неестественно в современном русском: оборот «ни на чём» нормально сочетается с «висит», но не с переходным «подвешивает».'
