  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֶן אֵ֤לֶּה קְצ֬וֹת דרכ/ו וּ/מַה שֵּׁ֣מֶץ דָּ֭בָר נִשְׁמַע בּ֑/וֹ וְ/רַ֥עַם גבורת/ו מִ֣י יִתְבּוֹנָֽן־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: ru
  text: Вот, это лишь края Его путей[a], и лишь слабый шёпот о Нём мы слышим! Но гром Его могущества — кто может постичь его?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пределы Его путей»; еврейское слово обозначает края, оконечности — лишь внешнюю границу того, что делает Бог.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто способен уразуметь его?» Местоимение относится к «грому Его могущества».'
    reason: clarity
lexical_decisions:
- source_word: הֶן
  choice: Вот
  rationale: Современное и достойное указательное междометие, привлекающее внимание без архаического оттенка.
- source_word: קְצוֹת דְּרָכָיו
  choice: лишь края Его путей
  rationale: «Края» передаёт мысль о видимых человеку внешних пределах Божьих действий; «пути» сохраняют исходную метафору. «Лишь» ясно выражает ограничительный смысл контекста.
- source_word: שֵׁמֶץ דָּבָר
  choice: лишь слабый шёпот
  rationale: Редкое сочетание обозначает ничтожную долю или едва слышный отзвук. «Слабый шёпот» естественно сочетается с глаголом «слышим» и сохраняет поэтический контраст с громом.
- source_word: נִשְׁמַע בּוֹ
  choice: о Нём мы слышим
  rationale: Передаёт коллективное человеческое восприятие и не сужает смысл до прямой речи, исходящей от Бога.
- source_word: רַעַם גְּבוּרָתוֹ
  choice: гром Его могущества
  rationale: Сохраняет слуховой образ и резкий контраст между едва слышным шёпотом и необъятной Божьей силой.
- source_word: יִתְבּוֹנָן
  choice: может постичь
  rationale: Глагол указывает на вдумчивое понимание; «постичь» естественно выражает невозможность полного человеческого охвата.
theological_decisions:
- issue: Предел человеческого познания Божьих путей и могущества
  choice: Стих утверждает, что перечисленные деяния представляют лишь доступные человеку края Божьих путей, тогда как полнота Его могущества остаётся непостижимой.
  alternative: Можно понимать слова уже — только как указание на ограниченное восприятие перечисленных в контексте космических деяний.
  rationale: Перевод сохраняет масштаб поэтического утверждения, но не превращает его в отвлечённое догматическое высказывание обо всём возможном познании Бога.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Сохранены метафоры «пути», «шёпот» и «гром», а также риторический вопрос. Прописные местоимения о Боге употреблены последовательно в рамках данного стиха.
