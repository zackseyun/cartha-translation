  text: בְּ֭/כֹח/וֹ רָגַ֣ע הַ/יָּ֑ם ו/ב/תובנת/ו מָ֣חַץ רָֽהַב׃
base_translation:
  language: en
  yaml_path: translation/ot/job/026/012.yaml
  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: ru
  text: 'Своей силой он усмирил море[a],

    и своим разумением сокрушил Рахава[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол можно также понять как «взволновал» или «привёл в движение» море.
    reason: Лексическое значение глагола רָגַע допускает противоположные по направленности толкования; основной текст следует контекстуальному пониманию «усмирил».
  - marker: b
    text: 'Рахав — поэтическое имя силы хаоса или морского чудовища, противостоящего Богу; возможен смысловой перевод: «морское чудовище». Здесь речь не о женщине Раав из книги Иисуса Навина.'
    reason: Сноска поясняет малоизвестное имя и сохраняет лексическую альтернативу, не подменяя образ толкованием.
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: Силой Своей
  rationale: Предлог בְּ имеет здесь инструментальное значение, а כֹּחַ обозначает силу или могущество. Такая формулировка естественна в русской поэзии и сохраняет космический размах строки.
- source_word: רָגַע
  choice: усмирил
  rationale: В сочетании с морем глагол вероятнее всего описывает приведение бурной, хаотической стихии к покою. «Усмирил» передаёт не только прекращение движения, но и подчинение силы; возможное значение «взволновал» отмечено в сноске.
- source_word: הַיָּם
  choice: море
  rationale: Прямой перевод, сохраняющий и буквальный образ моря, и его поэтическую связь с хаосом.
- source_word: וּבִתְבוּנָתוֹ
  choice: и разумением Своим
  rationale: תְּבוּנָה означает разумение, понимание, проницательность. «Разумением» сохраняет возвышенный поэтический регистр и тему Божьей мудрости.
- source_word: מָחַץ
  choice: сокрушил
  rationale: Глагол выражает сильный удар, раздавливание или решительное поражение. «Сокрушил» естественно звучит в данном поэтическом контексте.
- source_word: רָהַב
  choice: Рахава
  rationale: Здесь слово вероятнее всего выступает как поэтическое имя олицетворённой силы хаоса или морского чудовища. Транслитерация не сводит многозначный образ к одному толкованию; винительный падеж оформлен по нормам русского языка.
theological_decisions:
- issue: Передавать ли רָהַב собственным именем или истолковывать как нарицательное обозначение
  choice: Собственное имя «Рахав», относящееся к поэтически олицетворённой силе хаоса
  alternative: «морское чудовище» или, менее вероятно здесь, «гордыня»
  rationale: Космологический параллелизм с морем поддерживает понимание Рахава как враждебной хаотической силы. Собственное имя сохраняет образность и богословское напряжение текста, а сноска разъясняет основные варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия и повтор «Своей» поддерживают параллелизм еврейской строки; архаические глагольные формы и конфессионально окрашенная терминология не используются.
