  text: דַּלְתֵ֣י פָ֭נָי/ו מִ֣י פִתֵּ֑חַ סְבִיב֖וֹת שִׁנָּ֣י/ו אֵימָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/006.yaml
  text: Who has opened the doors of his face? Around his teeth is terror[a][b].
translation:
  language: ru
  text: Кто отворил двери его лица[a]? Вокруг его зубов — ужас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто может раскрыть створки его пасти?» Буквально с еврейского: «двери его лица» — поэтический образ пасти или челюстей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Вокруг его зубов — страх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי
  choice: двери
  rationale: Сохраняет буквальный образ множественного числа «двери, створки». Передача «челюсти» была бы более истолковательной и потому вынесена в примечание.
- source_word: פָנָיו
  choice: его лица
  rationale: Обычное значение — «лицо, передняя сторона». В контексте подразумевается область пасти или челюстей, однако буквальный образ намеренно сохранён в основном тексте.
- source_word: מִי
  choice: кто
  rationale: Стандартное вопросительное местоимение; вводит риторический вопрос.
- source_word: פִתֵּחַ
  choice: отворил
  rationale: Совершенный вид передаёт завершённое действие еврейской формы; «отворил» естественно сочетается с поэтическим образом дверей. Значение возможности («может открыть») контекстуально, но не выражено глаголом прямо.
- source_word: סְבִיבוֹת
  choice: вокруг
  rationale: Кратко и естественно передаёт пространственное значение «кругом, со всех сторон».
- source_word: שִׁנָּיו
  choice: его зубов
  rationale: Передаёт основное лексическое значение без усиления до «клыков».
- source_word: אֵימָה
  choice: ужас
  rationale: Сильное и лаконичное соответствие значению «ужас, страх»; сохраняет резкость именного предложения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением необычного поэтического образа оригинала. «Отворил» придаёт строке умеренно возвышенное звучание, не делая её архаичной; тире естественно оформляет краткое именное предложение.
