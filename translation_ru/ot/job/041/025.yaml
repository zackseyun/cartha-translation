lexical_decisions:
- source_word: אֵין
  choice: нет
  rationale: Экзистенциальное отрицание естественно передаётся русским «нет» и сохраняет категоричность утверждения.
- source_word: עַל עָפָר
  choice: на земле
  rationale: Буквально «на прахе/земле»; в данном контексте выражение охватывает земной мир, поэтому «на земле» звучит ясно и естественно.
- source_word: מָשְׁלוֹ
  choice: подобного ему
  rationale: В контексте слово выражает подобие или равенство, а не власть; вариант «подобного ему» сохраняет сравнительный смысл и допускает отмеченную в сноске альтернативу.
- source_word: הֶעָשׂוּ
  choice: созданному
  rationale: Пассивная форма от עשה указывает на то, каким это существо было сделано; причастие сохраняет связь с предшествующим «ему».
- source_word: לִבְלִי חָת
  choice: бесстрашным
  rationale: Выражение буквально обозначает отсутствие страха или ужаса. «Бесстрашным» кратко и естественно передаёт характеристику созданного существа, не устраняя возможный оттенок цели или результата.
theological_decisions:
- issue: Относится ли отсутствие страха к врождённому качеству или к цели/результату сотворения
  choice: созданному бесстрашным
  alternative: созданному не знать страха
  rationale: Основной текст сохраняет тесную связь между сотворением и бесстрашием, а сноска отмечает возможный целевой или результативный оттенок конструкции, не превращая его в догматическое утверждение.
