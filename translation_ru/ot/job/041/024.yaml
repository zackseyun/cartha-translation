  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: ru
  text: За ним сверкает след[a]; можно подумать, что бездна поседела[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «После него сверкает след». Еврейское выражение может иметь пространственный («за ним») или временной («после него») смысл; контекст движения по воде говорит в пользу первого.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «глубокие воды принимают за седину» или «считают седыми». Это образ моря, побелевшего от пены, словно покрытого седыми волосами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: За ним
  rationale: Форма допускает пространственное «за ним» и временное «после него»; описание следа левиафана на воде делает пространственный смысл наиболее вероятным, при этом альтернатива отмечена в сноске.
- source_word: יָאִיר
  choice: сверкает
  rationale: Глагол означает «светить, сиять»; «сверкает» естественно передаёт яркую белизну водяного следа.
- source_word: נָתִיב
  choice: след
  rationale: Существительное обозначает путь или тропу; здесь речь об оставляемой в воде кильватерной полосе, поэтому «след» ясно и поэтично передаёт образ.
- source_word: יַחְשֹׁב
  choice: кажется
  rationale: 'Форма третьего лица единственного числа может употребляться безлично: наблюдателю представляется, что бездна поседела. Русское «кажется» сохраняет впечатление, а не утверждение факта.'
- source_word: תְּהוֹם
  choice: бездна
  rationale: Слово обозначает глубокие воды, водную бездну; «бездна» сохраняет краткость и поэтическую силу еврейского текста.
- source_word: לְשֵׂיבָה
  choice: седой
  rationale: Буквально — «седина, седые волосы»; прилагательное «седой» сохраняет олицетворённый образ глубин, побелевших от пены.
