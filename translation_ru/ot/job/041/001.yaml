lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Сохраняет эмфатическую, привлекающую внимание функцию частицы и естественно звучит в возвышенной современной русской речи.
- source_word: תֹּחַלְתּוֹ
  choice: надежда на него
  rationale: Существительное обозначает надежду или ожидание; контекстуальное «на него» передаёт направленность надежды, не устраняя возможного оттенка ожидания.
- source_word: נִכְזָבָה
  choice: обманчива
  rationale: 'Форма от כזב выражает ложность, несостоятельность или разочарование: надежда оказывается обманчивой и не оправдывается.'
- source_word: הֲגַם
  choice: не … ли … уже
  rationale: Сочетание вопросительной и усилительной частиц передано риторическим вопросом с усилением «уже».
- source_word: אֶל מַרְאָיו
  choice: при одном виде его
  rationale: Идиоматично передаёт реакцию на его вид; «одном» выражает подразумеваемое усиление, отмеченное также частицей הֲגַם.
- source_word: יֻטָל
  choice: падает … духом
  rationale: Пассивная форма глагола טול передаёт низвержение или состояние поверженности; русское выражение естественно обозначает внутреннее поражение при виде Левиафана, хотя буквальный образ допускает «повержен».
