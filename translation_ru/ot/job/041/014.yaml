  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: ru
  text: 'На шее его обитает сила,

    и перед ним скачет ужас.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и перед ним скачет смятение». Редкое еврейское слово דְּאָבָה в этом поэтическом контексте может означать ужас, смятение, подавленность или уныние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: На шее его
  rationale: Предлог ב здесь имеет местное значение; русский оборот «на шее» естественнее, чем «в шее», и сохраняет образ сосредоточенной там силы.
- source_word: יָלִין
  choice: обитает
  rationale: Глагол לין буквально связан с ночлегом или пребыванием; в поэтической персонификации «обитает» передаёт устойчивое присутствие, не сводя выражение к простому «есть».
- source_word: עֹז
  choice: сила
  rationale: Прямой и естественный эквивалент существительного со значением силы или мощи.
- source_word: וּלְפָנָיו
  choice: и перед ним
  rationale: Обычное пространственное значение идиомы с פָּנִים; формулировка кратка и естественна по-русски.
- source_word: תָּדוּץ
  choice: скачет
  rationale: Редкий глагол דוץ обозначает резкое движение — прыжок или скакание; форма «скачет» сохраняет яркую поэтическую персонификацию.
- source_word: דְּאָבָה
  choice: ужас
  rationale: Редкое существительное может выражать ужас, смятение, подавленность или уныние. В контексте грозного существа «ужас» естественно передаёт воздействие его приближения, но более широкая неоднозначность отмечена в сноске.
