  source_fidelity: 'Текст точно передаёт структуру и образы еврейского оригинала: сила «обитает» на/в его шее, а персонифицированный ужас движется перед ним. «На шее его» — допустимая русская передача местного בְּ; «обитает» удачно сохраняет образ устойчиво пребывающей силы, заложенный в יָלִין. «Скачет» передаёт энергичное образное движение תָּדוּץ, не превращая его в отвлечённое утверждение.'
