lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: не обратит его в бегство
  rationale: 'Порода hифиль глагола ברח с местоименным дополнением 3-го лица мужского рода передаёт причинное значение: заставить его бежать, обратить в бегство.'
- source_word: בֶן קָשֶׁת
  choice: лучник
  rationale: Буквально «сын лука» — еврейское идиоматическое обозначение человека, вооружённого луком. В основном тексте выбран естественный русский эквивалент, а буквальный образ сохранён в сноске.
- source_word: לְקַשׁ
  choice: соломой
  rationale: קַשׁ обозначает сухие стебли, солому или жнивьё; здесь образ выражает лёгкость и ничтожность метательных камней для левиафана. «Солома» естественна и понятна современному русскому читателю.
- source_word: נֶהְפְּכוּ לוֹ
  choice: становятся для него
  rationale: Нифаль глагола הפך указывает на превращение или изменение восприятия/состояния; формулировка сохраняет и изменение, и отношение к нему, не уточняя сверх текста.
- source_word: אַבְנֵי קָלַע
  choice: камни из пращи
  rationale: Сопряжённое сочетание означает камни, используемые для метания пращой. Такая формулировка естественна по-русски и ясно сохраняет образ оружия.
