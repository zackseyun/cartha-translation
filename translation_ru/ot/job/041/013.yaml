translation:
  language: ru
  text: Его дыхание разжигает угли[a], и из его пасти выходит пламя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его душа разжигает угли» или «Его горло разжигает угли». Еврейское слово נֶפֶשׁ может означать «душа», «жизнь», «горло», а в данном контексте — также «дыхание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: его дыхание
  rationale: Хотя נֶפֶשׁ обычно означает «душа» или «жизнь» и может обозначать «горло», параллель с «из его пасти» и образ огненного выдоха указывают здесь на дыхание. Сноска сохраняет лексическую неоднозначность.
- source_word: גֶּחָלִים
  choice: угли
  rationale: Слово обозначает угли или горячие головни; краткое «угли» естественно сочетается с причинным значением глагола.
- source_word: תְּלַהֵט
  choice: разжигает
  rationale: Порода пиэль передаёт причинное действие — заставлять пылать; «разжигает» сохраняет эту силу и звучит естественно.
- source_word: וְלַהַב
  choice: и … пламя
  rationale: Существительное в единственном числе означает «пламя»; русский язык не требует неопределённого артикля.
- source_word: מִפִּיו
  choice: из его пасти
  rationale: Буквально возможно «из его рта», но в описании огромного животного «пасть» естественнее и сохраняет телесный образ без изменения смысла.
- source_word: יֵצֵא
  choice: выходит
  rationale: Прямо передаёт обычное значение глагола יצא и естественно сочетается с оборотом «из его пасти».
