  text: תַּ֭חְתָּי/ו חַדּ֣וּדֵי חָ֑רֶשׂ יִרְפַּ֖ד חָר֣וּץ עֲלֵי טִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/022.yaml
  text: Under him are sharp shards of pottery[b][a]; he spreads himself like a threshing sledge over the mud.
translation:
  language: ru
  text: Под ним — острые черепки[a]; он расстилается по грязи, словно молотильные сани.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острые осколки глиняной посуды».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он делает грязь подобной молотильным саням».'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחְתָּיו
  choice: Под ним
  rationale: Передаёт пространственное значение предлога с суффиксом 3-го лица мужского рода и естественно звучит по-русски.
- source_word: חַדּוּדֵי חָרֶשׂ
  choice: острые черепки
  rationale: Сочетание обозначает острые обломки глиняной посуды; «черепки» — точное и понятное современному читателю слово.
- source_word: יִרְפַּד
  choice: расстилается
  rationale: Глагол выражает идею расстилания или устройства ложа; возвратная форма естественно описывает движение самого левиафана и сохраняет образность.
- source_word: חָרוּץ
  choice: молотильные сани
  rationale: В данном контексте слово, вероятнее всего, означает снабжённое острыми частями сельскохозяйственное орудие для молотьбы; это принятое русское наименование предмета.
- source_word: עֲלֵי טִיט
  choice: по грязи
  rationale: Передаёт движение или положение на поверхности грязи и хорошо сочетается с русским глаголом «расстилается».
theological_decisions:
- issue: Синтаксическая связь יִרְפַּד חָרוּץ
  choice: Левиафан расстилается по грязи, словно молотильные сани
  alternative: Он делает грязь подобной молотильным саням
  rationale: Еврейская строка допускает разные способы понимания краткой образной конструкции. Основной текст следует контекстуальному сравнению тела левиафана с острым молотильным орудием, а альтернативу сохраняет примечание.
translation_notes:
  register: Современный литературный русский язык; краткая поэтическая строка сохраняет конкретный и грозный образ оригинала. Термин «молотильные сани» точен, хотя может быть менее знаком широкому читателю; контекст проясняет его функцию как острого орудия.
