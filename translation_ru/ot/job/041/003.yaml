base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: ru
  text: Кто первым дал Мне, чтобы Я воздал ему?[a] Всё, что под небесами, — Моё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «Кто предварил Меня, чтобы Я воздал ему?» Еврейский глагол может означать «предварить», «опередить»; здесь, вероятно, имеется в виду первым дать или оказать благодеяние, поставив другого в положение должника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос; простое «Кто» сохраняет его силу без добавочного усиления.
- source_word: הִקְדִּימַנִי
  choice: дал Мне прежде
  rationale: Глагол קדם в породе хифиль с суффиксом первого лица буквально может обозначать действие, совершённое прежде или навстречу кому-либо. В сочетании с «воздавать» речь, вероятнее всего, о предварительном даре или благодеянии, которое могло бы поставить Бога в положение должника.
- source_word: וַאֲשַׁלֵּם
  choice: чтобы Мне воздавать ему
  rationale: В риторическом контексте форма выражает следствие предполагаемого первого действия. «Ему» передаёт подразумеваемый объект, а «воздавать» сохраняет смысл ответного возмещения, не превращая фразу в обещание будущей награды.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: под всеми небесами
  rationale: Формально передаёт еврейское множественное число и обозначает весь сотворённый мир под небесами; оборот естественен для возвышенной современной русской речи.
- source_word: לִי הוּא
  choice: Моё
  rationale: Краткая именная конструкция передаёт подчёркнутое еврейское «Мне оно принадлежит». Местоимение «Всё» в начале русского предложения выражает подразумеваемую совокупность находящегося под небесами.
theological_decisions:
- issue: Божественная неподотчётность и право собственности
  choice: Риторический вопрос отрицает, что кто-либо первым дал Богу нечто, тем самым обязав Его к воздаянию; затем утверждается, что всё под небесами принадлежит Ему.
  alternative: Буквально перевести первый глагол как «предварил Меня» или «опередил Меня», оставив характер предшествующего действия неуточнённым.
  rationale: Связь с последующим «воздавать» указывает на предварительное благодеяние, создающее обязательство. При этом сноска сохраняет буквальную лексическую возможность и не устраняет подлинную неоднозначность глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством божественной речи. Прописные формы «Мне», «Моё» применены к Богу по принятой русской библейской издательской традиции. Конструкция остаётся краткой и риторически выразительной; тире во втором предложении подчёркивает всеобъемлющее притязание.
