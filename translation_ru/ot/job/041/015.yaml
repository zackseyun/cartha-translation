  text: Складки его плоти плотно прилегают друг к другу; они отлиты на нём[a] — их не сдвинуть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они прочно закреплены на нём». Еврейское слово рисует образ чего-то вылитого или отлитого и застывшего неподвижно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפְּלֵי
  choice: складки
  rationale: Слово обозначает свисающие или сложенные части тела; «складки» естественно передаёт конкретный телесный образ.
- source_word: בְשָׂרוֹ
  choice: его плоти
  rationale: Сохраняет прямое значение בשר — «плоть», не заменяя его более толковательными «кожа» или «тело».
- source_word: דָבֵקוּ
  choice: плотно прилегают друг к другу
  rationale: Глагол דבק выражает тесное сцепление; формулировка ясно передаёт взаимную соединённость складок и естественно звучит по-русски.
- source_word: יָצוּק
  choice: словно отлиты
  rationale: Передаёт образ чего-то вылитого или отлитого и потому прочно застывшего, не сводя метафору лишь к отвлечённому «закреплены».
- source_word: עָלָיו
  choice: на нём
  rationale: Прямой и естественный русский эквивалент предлога с местоименным суффиксом.
- source_word: בַּל
  choice: не
  rationale: Поэтическое отрицание передано без необоснованного усиления до «никогда».
- source_word: יִמּוֹט
  choice: сдвинутся
  rationale: Nifal от מוט означает быть сдвинутым, поколебаться или пошатнуться; «не сдвинутся» сохраняет образ неподвижности и хорошо согласуется с множественным подлежащим.
