  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: ru
  text: Каждая прилеплена к другой[a]; они сцеплены и не разъединяются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый прилеплен к своему брату». «Брат» здесь образно обозначает соседнюю чешую.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: одна
  rationale: Слово употреблено распределительно — «каждая из них». Женский род естественно отсылает к чешуям левиафана, описываемым в контексте, и не создаёт ложного впечатления, будто речь идёт о мужчинах.
- source_word: בְּאָחִיהוּ
  choice: к другой
  rationale: Буквально — «со своим братом». В описании соседних чешуй естественное русское соответствие «к другой» передаёт взаимное прилегание; буквальный образ сохранён в сноске.
- source_word: יְדֻבָּקוּ
  choice: прилегает
  rationale: Корень דבק обозначает тесное соединение или прилипание. В сочетании с распределительным «одна… к другой» единственное число по-русски естественно передаёт плотное прилегание каждой чешуи.
- source_word: יִתְלַכְּדוּ
  choice: сцеплены
  rationale: Глагол выражает захваченность, скреплённость или тесное соединение. «Сцеплены» ясно передаёт образ взаимно закреплённых чешуй и сохраняет поэтический параллелизм.
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: и не разъединяются
  rationale: 'Отрицательная форма описывает устойчивое состояние: соединённые чешуи не расходятся. Формулировка не усиливает исходный текст модальным «невозможно разъединить».'
