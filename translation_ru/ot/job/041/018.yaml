    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: достигший его
  rationale: Причастная форма от השׂיג означает «достигать, настигать». По отношению к мечу «достигший его» сохраняет смысл успешного приближения оружия, не добавляя идеи ранения.
- source_word: חֶרֶב
  choice: меч
  rationale: Обычное обозначение меча; в русском поэтическом перечислении оружия естественно употребление без артиклевого уточнения.
- source_word: בְּלִי תָקוּם
  choice: не устоит
  rationale: Буквальный образ выражения — оружие «не встанет, не устоит», то есть окажется бессильным. Формулировка сохраняет конкретность еврейского текста и допускает значение «не одолеет».
- source_word: חֲנִית
  choice: копьё
  rationale: Стандартное и понятное современному читателю обозначение колющего древкового оружия.
- source_word: מַסָּע
  choice: дротик
  rationale: Редкое и не вполне ясное слово в данном контексте, вероятно обозначающее метательное оружие или древко. «Дротик» естественно вписывается в перечень оружия; неопределённость отмечена в сноске.
- source_word: וְשִׁרְיָה
  choice: и метательное копьё
  rationale: Редкий термин допускает понимание как оружия, вероятно заострённого метательного, хотя возможны значения «кольчуга» или «доспех». Контекст перечисления наступательного оружия поддерживает выбранный вариант.
