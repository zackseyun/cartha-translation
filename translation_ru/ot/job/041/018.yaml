  text: Меч, настигший его, не устоит[a]; не устоят и копьё, и дротик[b], и метательное копьё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Меч, настигший его, не одолеет». Буквально еврейский текст говорит, что меч «не устоит».'
