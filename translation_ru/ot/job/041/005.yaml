lexical_decisions:
- source_word: גִלָּה
  choice: раскрывал
  rationale: Глагол означает «открывать, обнажать». Вопрос выражает невозможность или дерзость такого действия; «раскрывал» естественно сочетается с образом одеяния и не добавляет отсутствующей в еврейском тексте идеи полного снятия.
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: верх его одеяния
  rationale: Буквально сочетание указывает на «лицо/наружную сторону его одежды». «Верх его одеяния» сохраняет конкретную метафору наружного покрова, не отождествляя его однозначно с кожей или чешуёй.
- source_word: בְּכֶפֶל
  choice: к его двойной
  rationale: כפל обозначает двойную часть, сложение или сгиб. Формулировка намеренно сохраняет трудный образ и не сводит его без достаточных оснований к челюстям либо рядам зубов.
- source_word: רִסְנוֹ
  choice: узде
  rationale: רסן обычно означает узду или средство, удерживающее пасть. «Узда» — прямой и поэтически уместный русский эквивалент, здесь метафорически относящийся к области пасти левиафана.
- source_word: מִי יָבוֹא
  choice: Кто подступит
  rationale: В риторическом вопросе форма выражает вызов и фактическую невозможность приблизиться или войти. «Подступит» естественно передаёт опасное приближение, не устраняя пространственной неоднозначности предлога.
