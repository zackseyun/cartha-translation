  text: From his mouth torches go out[a]; sparks of fire leap forth.
translation:
  language: ru
  text: Из пасти его выходят факелы, искры огня вырываются[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огненные головни»; возможно также: «горящие стрелы». Значение редкого еврейского выражения не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפִּיו
  choice: Из пасти его
  rationale: Предлог מִן указывает на исходное место. В отношении левиафана русское «пасть» естественнее анатомически нейтрального «рот», а местоимение мужского рода соответствует еврейской форме и контексту.
- source_word: לַפִּידִים
  choice: факелы
  rationale: Слово обычно обозначает факелы или горящие головни. «Факелы» сохраняет конкретный и выразительный образ параллельно следующему огненному образу.
- source_word: יַהֲלֹכוּ
  choice: выходят
  rationale: Буквально глагол означает «идут», но при указании «из пасти» описывает появление наружу; «выходят» сохраняет направленность и звучит естественно.
- source_word: כִּידוֹדֵי אֵשׁ
  choice: искры огня
  rationale: Редкое и спорное выражение в поэтическом параллелизме может обозначать огненные искры, головни либо горящие метательные предметы. «Искры огня» хорошо сочетается с динамическим глаголом, не придавая образу неоправданно узкого военного смысла.
- source_word: יִתְמַלָּטוּ
  choice: вырываются
  rationale: Основное значение связано с бегством или высвобождением; здесь возвратная форма живописно передаёт внезапный выход огня. «Вырываются» сохраняет эту энергию и естественно звучит по-русски.
