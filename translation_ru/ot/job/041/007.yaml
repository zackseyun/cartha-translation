  yaml_path: translation/ot/job/041/007.yaml
  text: Its proud rows of shields are shut up, sealed tightly.
translation:
  language: ru
  text: Его гордость — ряды щитов, плотно сомкнутые, словно запечатанные крепкой печатью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его гордые ряды щитов плотно сомкнуты, словно запечатаны крепкой печатью».'
    reason: Существительное גַּאֲוָה («гордость, величие») в поэтической конструкции может пониматься как самостоятельное сказуемое («его гордость — …») либо как характеристика рядов щитов. Образ חוֹתָם צָר передаёт исключительно плотное, как бы запечатанное соединение.
lexical_decisions:
- source_word: גַּאֲוָה
  choice: гордость
  rationale: Сохраняет прямое значение существительного и допускает образ величественной, внушительной брони, не превращая его без необходимости в прилагательное.
- source_word: אֲפִיקֵי מָגִנִּים
  choice: ряды щитов
  rationale: В данном контексте אֲפִיקִים естественно обозначает протяжённые ряды или желобчатые линии; «ряды щитов» передаёт метафору чешуи как щитов.
- source_word: סָגוּר
  choice: плотно сомкнутых
  rationale: Передаёт состояние закрытости и недоступность промежутков между щитами-чешуями.
- source_word: חוֹתָם צָר
  choice: скреплённых тесной печатью
  rationale: Сохраняет образ печати и необычное сочетание «тесная/плотная печать»; причастие «скреплённых» выражает функцию запечатывания в естественном русском синтаксисе.
theological_decisions:
- issue: Отнесение «гордости» к существу или к его щитам
  choice: Его гордость — ряды щитов
  alternative: Его гордые ряды щитов
  rationale: Масоретский текст начинает строку существительным גַּאֲוָה, поэтому именная конструкция лучше сохраняет грамматическую и поэтическую напряжённость, не разрешая её однозначно как характеристику рядов.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной поэтической метафоры. «Щиты» понимаются как образ чешуй; пояснение не внесено в основной текст, чтобы не устранять образность оригинала.
