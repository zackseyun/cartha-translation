lexical_decisions:
- source_word: יַחְשֹׁב
  choice: считает
  rationale: 'Глагол חשׁב здесь выражает оценку: левиафан считает прочные материалы ничтожными и слабыми.'
- source_word: לְתֶבֶן
  choice: соломой
  rationale: תבן обычно обозначает солому; предлог לְ вводит сравнение. Творительный падеж естественно передаёт эту конструкцию по-русски.
- source_word: בַּרְזֶל
  choice: железо
  rationale: Прямое и общепринятое обозначение металла.
- source_word: לְעֵץ רִקָּבוֹן
  choice: гнилым деревом
  rationale: Буквально выражение означает «деревом гниения»; русский вариант сохраняет образ непрочного, истлевшего материала.
- source_word: נְחוּשָׁה
  choice: бронзу
  rationale: Слово может обозначать медь или бронзу. В контексте прочных материалов и оружия выбрано традиционное «бронза», а подлинная лексическая неоднозначность отмечена в сноске.
