  yaml_path: translation/ot/job/041/019.yaml
  text: He regards iron as straw[a], and bronze as rotten wood.
translation:
  language: ru
  text: Железо он считает соломой, а бронзу — гнилым деревом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
