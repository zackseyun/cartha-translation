  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: ru
  text: При его подъёме могучие страшатся; от грохота они теряют самообладание.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за сокрушительных ударов (или бурунов) они теряют самообладание»; значение еврейских слов в этой строке не вполне ясно.'
    reason: מִשְּׁבָרִים может обозначать ломание, сокрушительные удары или буруны, а редкая форма יִתְחַטָּאוּ допускает несколько близких по контексту толкований. Сноска сохраняет эту неопределённость, не навязывая ритуального значения.
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: Когда он поднимается
  rationale: Форма допускает понимание «при его поднятии / когда он поднимается». В контексте описания левиафана естественно передаёт его появление или движение вверх, не уточняя сверх сказанного, встаёт ли он или всплывает.
- source_word: יָגוּרוּ
  choice: трепещут
  rationale: Передаёт страх и содрогание; современнее и выразительнее буквального «боятся», сохраняя высокий поэтический регистр.
- source_word: אֵלִים
  choice: могучие
  rationale: Здесь слово может обозначать сильных или могучих существ; выбор не вводит более определённого «боги» и соответствует контексту устрашающей силы левиафана.
- source_word: מִשְּׁבָרִים
  choice: от смятения
  rationale: Неогласованная основа допускает связь с сокрушением, ударами или волнами; в данном сочетании возможен также смысл испуга или потрясения. Перевод сохраняет причинный оттенок, а неоднозначность отмечена в сноске.
- source_word: יִתְחַטָּאוּ
  choice: они теряются
  rationale: Редкое употребление формы допускает значения, связанные с растерянностью, промахом или попыткой очиститься. В контексте страха перед левиафаном «теряются» естественно передаёт утрату самообладания без искусственного внесения ритуального смысла.
theological_decisions:
- issue: Кого обозначает אֵלִים
  choice: могучие
  alternative: боги
  rationale: Контекст не требует однозначно понимать слово как обозначение божеств. «Могучие» сохраняет возможность сверхчеловеческих сил или просто сильных существ и не вносит ненужного богословского уточнения.
- issue: Смысл יִתְחַטָּאוּ
  choice: они теряются
  alternative: они очищаются / уклоняются
  rationale: Редкая форма не должна переводиться так, чтобы стих утверждал определённое ритуальное действие. Контекст поддерживает состояние смятения и утраты самообладания.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные уточнения исключены.
