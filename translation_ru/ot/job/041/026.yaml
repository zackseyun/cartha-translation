  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: ru
  text: Он видит всё высокое; он — царь над всеми сынами гордыни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над всеми гордецами»; буквально: «над всеми сынами гордыни».'
    reason: Лексическая альтернатива поясняет еврейское образное обозначение, не сужая его до конкретного разряда существ.
lexical_decisions:
- source_word: אֵת כָּל גָּבֹהַּ
  choice: на всё высокое
  rationale: Объектный показатель אֵת отдельно не передаётся; сочетание כָּל с прилагательным в единственном числе естественно выражается по-русски как «всё высокое». Такой перевод сохраняет как прямое значение высоты, так и возможный оттенок надменности или возвышенности.
- source_word: יִרְאֶה
  choice: смотрит
  rationale: Глагол ראה означает «видеть, смотреть». Настоящее время соответствует обобщённой поэтической характеристике и звучит естественно по-русски.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение подчёркивает подлежащее; в русском это передано явным «он» в обеих параллельных частях.
- source_word: מֶלֶךְ עַל
  choice: царь над
  rationale: Сохраняется царственная метафора господства; предлог «над» естественно передаёт значение власти.
- source_word: כָּל בְּנֵי שָׁחַץ
  choice: всеми сынами гордости
  rationale: Буквальный образ «сынов гордости» сохранён ради поэтической силы и смысловой открытости выражения; форма творительного падежа обусловлена русским управлением «царь над».
theological_decisions:
- issue: Кого обозначают «все сыны гордости»
  choice: Оставлено широкое поэтическое обозначение существ или сил, отличающихся гордостью и надменностью.
  alternative: Конкретизировать как свирепых зверей, гордецов или мифопоэтические космические силы.
  rationale: Еврейский текст не ограничивает выражение определённым классом существ. Буквенный образ сохраняет богословскую и поэтическую неоднозначность, не навязывая зоологического либо мифологического толкования.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим оттенком. Тире подчёркивает параллелизм и царственное утверждение; необычный, но понятный образ «сыны гордости» сознательно сохранён.
