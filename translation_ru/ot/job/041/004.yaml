  text: לא אַחֲרִ֥ישׁ בַּדָּ֑י/ו וּ/דְבַר גְּ֝בוּר֗וֹת וְ/חִ֣ין עֶרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/004.yaml
  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: ru
  text: Не умолчу о его членах[a], о его могучей силе и красоте его сложения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о его частях»; вся вторая половина стиха также может быть понята так: «о мощи и красоте его устройства».'
    reason: Лексическое значение בַּדָּיו допускает «члены» и более общее «части»; синтаксис и значения גְּבוּרוֹת, חִין и עֶרְכּוֹ допускают несколько близких способов передачи.
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: не умолчу
  rationale: Краткое и естественное по-русски выражение решимости не обходить предмет молчанием; сохраняет первое лицо и отрицание.
- source_word: בַּדָּיו
  choice: его членах
  rationale: В данном описании тела слово обозначает отдельные части, или члены, существа. «Члены» сохраняет конкретность и несколько возвышенный поэтический регистр.
- source_word: דְבַר
  choice: о
  rationale: В сочетании с последующими существительными вводит предмет речи; отдельное «описание» в русском сделало бы строку тяжелее и могло бы чрезмерно конкретизировать значение.
- source_word: גְּבוּרוֹת
  choice: его могучей силе
  rationale: Множественная форма может обозначать проявления мощи или мощь; в контексте телесного описания естественно передать собирательно как «могучая сила».
- source_word: חִין
  choice: красоте
  rationale: Здесь слово передаёт привлекательность, изящество или благообразие внешнего устройства. «Красота» ясно выражает эстетический смысл без чуждых богословских оттенков слова «благодать».
- source_word: עֶרְכּוֹ
  choice: его сложения
  rationale: Слово связано с расположением и упорядоченностью частей; «сложение» естественно относится к строению тела и не сводит смысл только к математическим пропорциям.
