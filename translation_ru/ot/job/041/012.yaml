  text: מִ֭/נְּחִירָי/ו יֵצֵ֣א עָשָׁ֑ן כְּ/ד֖וּד נָפ֣וּחַ וְ/אַגְמֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/012.yaml
  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: ru
  text: Из его ноздрей выходит дым, словно от раздуваемого котла[a] и камыша[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. דּוּד — горшок для варки или более крупный котёл; נָפוּחַ — «раздуваемый», то есть разжигаемый или разогреваемый дутьём.
    reason: lexical_alternative
  - marker: b
    text: Евр. אַגְמוֹן — камыш или тростник. Его связь с предыдущими словами в кратком поэтическом сравнении не вполне ясна; возможно, подразумевается камыш, употребляемый как топливо.
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: из его ноздрей
  rationale: Существительное נְחִירַיִם обозначает ноздри; предлог מִן и суффикс 3-го лица мужского рода единственного числа переданы прямо и сохраняют яркий телесный образ.
- source_word: יֵצֵא
  choice: выходит
  rationale: Имперфект יצא здесь описывает характерное действие; настоящее время естественно для поэтического описания.
- source_word: עָשָׁן
  choice: дым
  rationale: Прямое и обычное соответствие еврейскому עָשָׁן.
- source_word: כְּדוּד נָפוּחַ
  choice: словно от кипящего котла
  rationale: דּוּד — сосуд для варки, котёл; נָפוּחַ буквально указывает на раздувание, то есть на сильный жар от раздуваемого огня. «Кипящий котёл» естественно передаёт наблюдаемый образ, а подразумеваемый огонь поясняется в сноске.
- source_word: וְאַגְמֹן
  choice: и горящего камыша
  rationale: אַגְמוֹן обозначает камыш или тростник. В контексте дыма он, вероятно, представлен как топливо; слово «горящего» делает эллиптический поэтический образ понятным по-русски, не меняя его предмета.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным, но сохраняющим поэтическую образность синтаксисом. «Выходит дым» предпочтено более экспрессивному «валит дым», чтобы не усиливать исходный текст; «словно от» естественно раскрывает эллиптическое еврейское сравнение.
