    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: сердце у него
  rationale: לֵב обозначает сердце как внутренний центр существа; в образном описании левиафана прямое «сердце» естественно и сохраняет конкретность еврейского текста.
- source_word: יָצוּק
  choice: твёрдо
  rationale: Форма от יצק буквально связана с выливанием или отливкой; здесь результативный смысл указывает на литую твёрдость, прочность и неподатливость. «Твёрдо» естественно сочетается с образом камня.
- source_word: כְּמוֹ אָבֶן
  choice: как камень
  rationale: Прямо передаёт конкретное поэтическое сравнение без добавочного толкования.
- source_word: וְיָצוּק
  choice: твёрдо
  rationale: Повтор того же слова сохранён для поэтического параллелизма и усиления.
- source_word: כְּפֶלַח תַּחְתִּית
  choice: как нижний жернов
  rationale: В данном сочетании פֶלַח с תַּחְתִּית обозначает нижний камень ручной мельницы; «нижний жернов» — ясное и традиционно понятное русское соответствие.
