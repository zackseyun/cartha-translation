  text: Его чихания излучают свет[a], и глаза его — как веки зари[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «От его чиханий исходит свет». Древнееврейский глагол имеет причинное значение — «заставлять свет сиять»; выражение носит ярко поэтический характер.'
    reason: lexical_alternative
