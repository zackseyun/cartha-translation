lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: от его чихания
  rationale: Существительное от עטש непосредственно обозначает чихание. Русское единственное число естественно передаёт явление собирательно, не ослабляя конкретности образа.
- source_word: תָּהֶל אוֹר
  choice: вспыхивает свет
  rationale: Причинная форма глагола выражает появление или испускание света. «Вспыхивает свет» сохраняет яркость поэтического образа и звучит естественно по-русски; буквальная причинность пояснена в сноске.
- source_word: וְעֵינָיו
  choice: и глаза его
  rationale: Прямой перевод сочетания союза, существительного и местоименного суффикса; постпозиция местоимения поддерживает возвышенный поэтический регистр.
- source_word: כְעַפְעַפֵּי שָׁחַר
  choice: как веки зари
  rationale: Сохранён буквальный древнееврейский образ «век» зари, обозначающий первый раскрывающийся свет дня, без замены толкующим выражением вроде «первые лучи».
