translation:
  language: ru
  text: Они тесно прилегают друг к другу, и воздух[a] не проникает между ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер не проникает между ними». Еврейское слово רוּחַ может означать «воздух», «ветер» или «дыхание»; здесь речь идёт о воздухе в физико-пространственном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד בְּאֶחָד
  choice: друг к другу
  rationale: Сочетание выражает взаимную, попарную смежность чешуй; современная русская формулировка естественно передаёт этот смысл.
- source_word: יִגַּשׁוּ
  choice: плотно прилегают
  rationale: В контексте описания чешуй речь не просто о приближении, а о тесном соприкосновении; «прилегают» точно передаёт физическую картину.
- source_word: וְרוּחַ
  choice: даже воздух
  rationale: רוּחַ может означать «ветер», «дыхание» или «воздух». Здесь пространственно-физический контекст указывает на воздух, который не проникает в отсутствие зазора; «даже» естественно подчёркивает плотность, подразумеваемую конструкцией.
- source_word: לֹא יָבוֹא
  choice: не проходит
  rationale: Отрицательная форма описывает отсутствие проникновения воздуха между плотно прилегающими чешуями; настоящее время уместно для общего описания.
- source_word: בֵינֵיהֶם
  choice: между ними
  rationale: Прямо передаёт пространственное значение предлога בין с местоименным суффиксом множественного числа.
