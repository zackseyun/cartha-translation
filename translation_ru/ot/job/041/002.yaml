  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: ru
  text: Никто не настолько свиреп, чтобы осмелиться разбудить его[a]. Кто же тогда устоит передо Мной?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никто не настолько жесток, чтобы пробудить его». Еврейский глагол означает «будить, пробуждать»; здесь — потревожить и спровоцировать левиафана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: Нет такого свирепого
  rationale: Отрицание вместе с прилагательным естественно передано русской конструкцией «нет такого…». «Свирепый» выражает устрашающую отвагу и жестокость в контексте левиафана, не сводя слово лишь к нравственной оценке.
- source_word: כִּי יְעוּרֶנּוּ
  choice: кто осмелился бы разбудить его
  rationale: Глагол עור означает «будить, пробуждать». В данном контексте речь идёт о том, чтобы потревожить и тем самым спровоцировать левиафана; «осмелился бы» передаёт подразумеваемую риторическим вопросом дерзость поступка, не выдавая её за отдельное значение глагола.
- source_word: וּמִי הוּא
  choice: Кто же тогда
  rationale: 'Сочетание союза, вопросительного слова и местоимения подчёркивает вывод: если никто не решается потревожить левиафана, тем более никто не способен противостоять говорящему Богу.'
- source_word: לְפָנַי יִתְיַצָּב
  choice: устоит передо Мной
  rationale: Форма глагола יצב означает «встать, занять место, предстать». В риторическом контексте «устоит» естественно передаёт способность выдержать противостояние, а «передо Мной» сохраняет образ присутствия перед лицом Бога.
theological_decisions:
- issue: Переход от левиафана в первой части стиха к Богу во второй
  choice: 'Вторая часть относится к Богу: если никто не смеет будить левиафана, то кто сможет устоять перед Богом?'
  alternative: Обе части относятся только к левиафану.
  rationale: Суффикс первого лица в לְפָנַי («передо Мной») указывает на говорящего Бога. Сохраняется аргумент от меньшего к большему — от творения к Творцу — без дополнительного догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Конструкция «передо Мной» выбрана ради естественного звучания; прописная буква обозначает Бога как говорящего. Подлинная лексическая вариативность אַכְזָר и עור сохранена в сноске.
