source:
  edition: WLC
  text: אִם שָׁכַ֗בְתִּי וְ/אָמַ֗רְתִּי מָתַ֣י אָ֭קוּם וּ/מִדַּד עָ֑רֶב וְ/שָׂבַ֖עְתִּי נְדֻדִ֣ים עֲדֵי נָֽשֶׁף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/004.yaml
  text: When I lie down[a], I say, ‘When will I arise?’ But the evening drags on[c][b], and I am full of tossing until dawn.
translation:
  language: ru
  text: 'Когда я ложусь[a], то говорю: «Когда же я встану?» Но вечер всё тянется[b], и до рассвета[c] я без конца мечусь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если я ложусь». Еврейская частица обычно означает «если», но здесь, вероятно, указывает на повторяющееся обстоятельство: «когда я ложусь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и вечер отмеряется». Смысл, вероятно, в том, что вечер мучительно медленно тянется.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может означать «сумерки» и здесь, вероятно, относится к утренним сумеркам, то есть к рассвету.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: когда
  rationale: Хотя частица אִם обычно имеет условное значение «если», здесь она естественно вводит повторяющееся обстоятельство в рассказе Иова о каждой мучительной ночи.
- source_word: שָׁכַבְתִּי וְאָמַרְתִּי
  choice: я ложусь… говорю
  rationale: Формы qatal в данном контексте передают привычное, многократно повторяющееся действие; настоящее время естественно выражает это по-русски.
- source_word: מָתַי אָקוּם
  choice: Когда же я встану?
  rationale: Глагол קום здесь означает вставание с постели, а частица «же» естественно передаёт нетерпеливое ожидание конца ночи.
- source_word: וּמִדַּד עָרֶב
  choice: Но вечер всё тянется
  rationale: מדד буквально связан с измерением; в контексте выражение рисует мучительно медленное течение времени. Слово עֶרֶב сохранено как «вечер», без замены на более широкое «ночь».
- source_word: וְשָׂבַעְתִּי נְדֻדִים
  choice: я без конца мечусь
  rationale: Буквально שבע означает насыщение или пресыщение, а נְדֻדִים — беспокойные движения, метания. Естественная русская формулировка передаёт изнуряющую полноту непрерывного ночного беспокойства.
- source_word: עֲדֵי נָשֶׁף
  choice: до рассвета
  rationale: נֶשֶׁף может обозначать сумерки как вечером, так и утром; здесь речь идёт о конце мучительной ночи, поэтому имеется в виду утренняя заря.
