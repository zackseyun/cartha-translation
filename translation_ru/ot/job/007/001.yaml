base_translation:
  language: en
  yaml_path: translation/ot/job/007/001.yaml
  text: Is not man consigned to hard service on earth[a], and are not his days like those of a hired worker?
translation:
  language: ru
  text: Разве не назначена человеку на земле тяжёлая служба[a], и разве дни его не подобны дням наёмного работника?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве не воинская служба (или война) назначена человеку на земле?» Еврейское слово צָבָא может означать войну, военную службу, а также тягостный срок обязательной службы. Параллель с «наёмным работником» указывает здесь, вероятно, на тяжёлую, подневольную службу в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Не ... ли?
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: צָבָא
  choice: тяжёлая служба
  rationale: Слово может обозначать войну, военную службу или обязательную тягостную службу. Параллель с наёмным работником указывает здесь на обременительный труд и срок службы, но военный оттенок не устраняется полностью и отмечен в сноске.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Передаёт обобщённое обозначение смертного, слабого человека без ненужного уточнения пола.
- source_word: עַל־אָרֶץ
  choice: на земле
  rationale: Естественное русское соответствие широкому месту человеческой жизни, а не конкретному участку земли.
- source_word: וְכִימֵי
  choice: и не подобны ли ... дням
  rationale: Слегка развёрнутая русская конструкция сохраняет сравнение и общий риторический вопрос.
- source_word: שָׂכִיר
  choice: наёмный работник
  rationale: Современное и нейтральное обозначение человека, работающего за плату; оно не несёт архаического или уничижительного оттенка.
- source_word: יָמָיו
  choice: дни его
  rationale: Сохраняет буквальный временной образ дней человеческой жизни и придаёт строке достойное поэтическое звучание.
