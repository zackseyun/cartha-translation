    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְקְדֶנּוּ
  choice: Ты вспоминаешь о нём
  rationale: 'Глагол פקד имеет широкий диапазон значений: «посещать», «обращать внимание», «принимать во внимание». В контексте жалобы Иова речь идёт о постоянном, тягостном внимании Бога к человеку; «вспоминаешь о нём» естественно передаёт активное обращение внимания, не придавая ему исключительно благожелательного оттенка.'
- source_word: לִבְקָרִים
  choice: каждое утро
  rationale: Множественное число обозначает регулярно повторяющееся время; этот смысл ясно и естественно выражен по-русски сочетанием «каждое утро».
- source_word: לִרְגָעִים
  choice: каждое мгновение
  rationale: רגעים обозначает краткие мгновения; форма передаёт непрерывно повторяющееся действие.
- source_word: תִּבְחָנֶנּוּ
  choice: испытываешь его
  rationale: בחן означает испытывать или исследовать с целью проверки. «Испытываешь» сохраняет оттенок тягостной проверки в жалобе Иова.
- source_word: ־נּוּ
  choice: его / о нём
  rationale: Местоименный суффикс мужского рода единственного числа отсылает к человеку в предыдущем стихе; в русском переводе эта связь сохранена.
theological_decisions:
- issue: Характер Божьего внимания
  choice: Передать постоянное Божье внимание как тягостное наблюдение и испытание, не смягчая жалобу Иова.
  alternative: Истолковать действие как исключительно благожелательное посещение или заботу.
  rationale: Контекст риторической жалобы придаёт этим словам напряжённый, а не утешительный тон; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; риторическое продолжение вопроса из предыдущего стиха. Заглавная буква в местоимении «Ты» следует принятой русской библейской традиции обращения к Богу. Синтаксис сохраняет поэтический параллелизм двух повторяющихся действий.
