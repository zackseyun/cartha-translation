  text: что Ты обращаешь на него внимание каждое утро[a] и испытываешь его каждое мгновение?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посещаешь его каждое утро». Еврейский глагол может означать «посещать», «обращать внимание» или «принимать во внимание».'
    reason: lexical_alternative
