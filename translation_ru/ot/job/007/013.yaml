lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В контексте частица вводит обстоятельство мысли Иова и естественно связывает этот стих со следующим; при этом другие возможные значения отмечены в сноске.
- source_word: אָמַרְתִּי
  choice: я говорю
  rationale: Формально стоит перфект «я сказал», но здесь речь может идти о повторяющейся или вновь возникающей внутренней мысли; русское настоящее время естественно передаёт это в данном контексте.
- source_word: תְּנַחֲמֵנִי
  choice: утешит меня
  rationale: Порода пиэль глагола נחם выражает утешение; выбран прямой и понятный русский эквивалент.
- source_word: עַרְשִׂי
  choice: постель моя
  rationale: Слово обозначает постель или ложе; «постель» позволяет сохранить смысл и различить два поэтических синонима.
- source_word: יִשָּׂא
  choice: понесёт
  rationale: Глагол נשא буквально означает «нести, поднимать»; перевод сохраняет образ ложа, принимающего на себя скорбную речь Иова.
- source_word: בְשִׂיחִי
  choice: жалобу мою
  rationale: שִׂיחַ может обозначать размышление, излияние или жалобу; контекст страдания Иова делает значение «жалоба» наиболее вероятным, но неоднозначность отражена в сноске.
- source_word: מִשְׁכָּבִי
  choice: ложе моё
  rationale: Слово означает место, где лежат, постель или ложе; «ложе» сохраняет поэтический параллелизм без полного повтора.
