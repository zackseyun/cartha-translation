  variant: modern literary Russian
source:
  edition: WLC
  text: מָֽה אֱ֭נוֹשׁ כִּ֣י תְגַדְּלֶ֑/נּוּ וְ/כִי תָשִׁ֖ית אֵלָ֣י/ו לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/017.yaml
  text: What is man[a], that you make so much of him[b], and that you set your heart on him?
translation:
  language: ru
  text: Что такое человек[a], что Ты так возвеличиваешь его[b] и устремляешь к нему Своё сердце?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально здесь употреблено еврейское слово אֱנוֹשׁ — «смертный человек», подчёркивающее человеческую хрупкость; ср. Псалом 8:5.
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: 'Или: «делаешь его великим»; по смыслу также возможно: «придаёшь ему такое значение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Что такое
  rationale: Передаёт начало риторического вопроса естественным современным русским оборотом, не превращая его в вопрос о причине.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: 'Сохраняет единственное число и собирательно-представительное значение: отдельный смертный человек представляет человечество в его хрупкости.'
- source_word: כִּי
  choice: что
  rationale: Вводит содержание риторического вопроса и естественно связывает его с последующим глаголом.
- source_word: תְגַדְּלֶנּוּ
  choice: Ты так возвеличиваешь его
  rationale: Передаёт каузативно-интенсивное значение породы пиэль от גדל — делать великим, возвеличивать, придавать большое значение. Наречие «так» выражает степень, подразумеваемую контекстом вопроса.
- source_word: וְכִי
  choice: и
  rationale: Соединяет две параллельные части одного риторического вопроса; повтор «что» по-русски не обязателен и утяжелил бы строку.
- source_word: תָשִׁית אֵלָיו לִבֶּךָ
  choice: устремляешь к нему Своё сердце
  rationale: Сохраняет образ сердца как средоточия мысли, намерения и внимания, а также направленность, выраженную אֵלָיו; формулировка остаётся поэтичной и понятной.
theological_decisions:
- issue: Представительное единственное число и смысл אֱנוֹשׁ
  choice: человек
  alternative: смертный; смертный человек; человечество
  rationale: «Человек» сохраняет единственное число и литературную перекличку с Псалом 8, не сводя значение только к физической смертности; оттенок человеческой хрупкости отмечен в сноске.
- issue: Антропоморфный образ Божьего сердца
  choice: устремляешь к нему Своё сердце
  alternative: обращаешь на него внимание; занимаешься им
  rationale: 'Образ сердца сохранён, поскольку еврейский текст не абстрагирует Божье отношение до одного лишь «внимания». Это также удерживает напряжение контекста: пристальное Божье участие может восприниматься не только как милость, но и как тягостный надзор.'
- issue: Тон глагола תְגַדְּלֶנּוּ
  choice: так возвеличиваешь его
  alternative: придаёшь ему такое значение; делаешь его великим
  rationale: «Возвеличиваешь» сохраняет прямой смысл גדל и допускает как возвышение человека, так и оказание ему чрезвычайного внимания, не разрешая контекстуальную двусмысленность однозначно.
translation_notes:
  register: 'Современный литературный русский с сохранением поэтической возвышенности и риторического строя. Местоимения, относящиеся к Богу, даны с прописной буквы в соответствии с принятой русской библейской традицией. Сноски поставлены у тех слов, к которым фактически относятся: [a] поясняет אֱנוֹשׁ, [b] — תְגַדְּלֶנּוּ.'
