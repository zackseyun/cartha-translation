- source_word: אֲדַבְּרָה
  choice: буду говорить
  rationale: Форма выражает намерение или решимость говорящего; русский будущий вид естественно передаёт это значение.
- source_word: בְּצַר רוּחִי
  choice: в муке моего духа
  rationale: צַר обозначает стеснение, бедствие или мучительную тесноту. «В муке» звучит естественно и сохраняет внутреннюю остроту переживания, а «дух» прямо передаёт רוּחַ.
- source_word: אָשִׂיחָה
  choice: буду сетовать
  rationale: В данном контексте многозначный глагол שׂיח обозначает речь-размышление с оттенком жалобы и плача. «Сетовать» передаёт этот оттенок достойно и без разговорной приземлённости.
- source_word: בְּמַר נַפְשִׁי
  choice: в горечи моей души
  rationale: Передаёт поэтическое сочетание буквально и естественно; «душа» сохраняет отличие נֶפֶשׁ от רוּחַ в предыдущей строке.
theological_decisions:
- issue: Различение רוּחַ и נֶפֶשׁ в поэтическом параллелизме
  choice: Передать раздельно как «дух» и «душа»
  alternative: Свести оба слова к «внутреннему миру», «сердцу» или одному и тому же русскому термину
  rationale: Еврейский текст употребляет два разных антропологических слова. Их различение сохраняет поэтическую фактуру, но не утверждает само по себе какой-либо технической доктрины о составе человека.
- issue: Характер речи, обозначенной אָשִׂיחָה
  choice: «буду сетовать»
  alternative: «буду размышлять», «буду говорить» или «буду жаловаться»
  rationale: Контекст горечи и страдания поддерживает значение жалобного излияния, однако примечание сохраняет более широкий смысловой диапазон глагола.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. «Уста» и «сетовать» соответствуют жанру древней жалобы, оставаясь понятными обычному читателю. Синтаксический параллелизм и различие между «духом» и «душой» сохранены.
