lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Я тоже
  rationale: Передаёт добавочное значение גַּם и явное אֲנִי естественным современным русским оборотом, не превращая связку в причинное «поэтому».
- source_word: לֹא אֶחֱשָׂךְ פִּי
  choice: не стану сдерживать своих уст
