id: JOB.7.21
reference: Job 7:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מֶ֤ה לֹא תִשָּׂ֣א פִשְׁעִ/י֮ וְ/תַעֲבִ֪יר אֶת עֲוֺ֫נִ֥/י כִּֽי עַ֭תָּה לֶ/עָפָ֣ר אֶשְׁכָּ֑ב וְ/שִׁ֖חֲרְתַּ֣/נִי וְ/אֵינֶֽ/נִּי׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/007/021.yaml
  text: Why do you not pardon my transgression and take away my iniquity? For now I will lie down in the dust[a]; you will seek me diligently[b], but I will be gone.
translation:
  language: ru
  text: Почему же Ты не простишь моего преступления и не удалишь моего беззакония?[a] Ведь теперь я лягу в прах; Ты будешь усердно искать меня[b], а меня уже не будет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально глаголы означают «поднять/понести моё преступление» и «заставить пройти моё беззаконие»; это выражения прощения и удаления вины.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «станешь искать меня с раннего утра». Глагол может содержать оттенок раннего поиска, но часто означает ревностный, усердный поиск.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: простишь
  rationale: Глагол נשׂא буквально означает «нести, поднимать», но с проступком в качестве дополнения идиоматически выражает прощение или снятие вины.
- source_word: פִשְׁעִי
  choice: моего преступления
  rationale: פשע обозначает преступление, проступок или мятежное нарушение; «преступление» сохраняет серьёзность и отличается от следующего עון.
- source_word: וְתַעֲבִיר
  choice: и не удалишь
  rationale: Порода hифиль глагола עבר здесь передаёт устранение, букв. «заставить пройти, увести прочь»; «удалишь» естественно сочетается с беззаконием и сохраняет отличие от «простишь».
- source_word: עֲוֺנִי
  choice: моего беззакония
  rationale: עון может обозначать беззаконие, вину либо последствие вины. В параллели с פשע выбран нравственный смысл «беззаконие», без сведения двух терминов к одному.
- source_word: כִּי עַתָּה
  choice: ведь теперь
  rationale: Передаёт причинное כי и временное עתה без замены слова «теперь» более толковательным «скоро».
- source_word: לֶעָפָר אֶשְׁכָּב
  choice: я лягу в прах
  rationale: Сохранён конкретный поэтический образ смерти и погребения, а не подставлено прямое «умру».
- source_word: וְשִׁחֲרְתַּנִי
  choice: Ты будешь усердно искать меня
  rationale: В piel שׁחר означает настойчиво, ревностно искать и может сохранять оттенок раннего утра; «усердно искать» ясно передаёт основную идиому.
- source_word: וְאֵינֶנִּי
  choice: а меня уже не будет
  rationale: Буквально «и меня нет»; в контексте предстоящей смерти русская будущая форма естественно передаёт временную перспективу, а «а» раскрывает контраст.
theological_decisions:
- issue: Различение двух обозначений греха
  choice: «преступление» для פשע и «беззаконие» для עון
  alternative: Передать оба слова общим «грех» либо второе перевести как «вина»
  rationale: Различение сохраняет еврейский параллелизм и широту нравственной лексики; при этом перевод не решает однозначно, означает ли עון поступок или возникшую из него вину.
- issue: Образ смерти в לֶעָפָר אֶשְׁכָּב
  choice: «лягу в прах»
  alternative: «умру»
  rationale: Конкретный образ праха сохраняет мотив смертности и погребения, не устраняя поэтическую напряжённость прямым толкованием.
- issue: Поиск Богом человека после его смерти
  choice: Сохранить прямое «Ты будешь усердно искать меня»
  alternative: Ослабить до «если Ты станешь искать меня» или пояснить цель поиска
  rationale: В еврейском тексте утверждение дано без условия и без объяснения причины Божьего поиска; перевод не должен разрешать эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической лексикой («прах», «беззаконие»). Прямая речь к Богу оформлена с прописным «Ты». Синтаксис сохраняет вопрос, причинное обоснование и заключительный контраст еврейского текста.
