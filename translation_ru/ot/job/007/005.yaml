  yaml_path: translation/ot/job/007/005.yaml
  text: My flesh is clothed with worms and clods of dust; my skin hardens[a], then breaks out again.
translation:
  language: ru
  text: 'Плоть моя покрыта червями и комьями праха;

    кожа моя затвердевает[a], а потом вновь прорывается.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кожа моя затягивается, а потом вновь гноится». Значение двух последних еврейских глаголов неясно; вероятно, речь идёт о коже, которая ненадолго затягивается, а затем снова вскрывается.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָבַשׁ
  choice: покрыта
  rationale: Глагол буквально выражает образ облачения, однако применительно к плоти естественное русское «покрыта» ясно передаёт плотный, всеохватывающий покров, не создавая неуместно возвышенного звучания.
- source_word: בְּשָׂרִי
  choice: плоть моя
  rationale: «Плоть» непосредственно передаёт телесность страдания и точнее соответствует исходному слову, чем более общее «тело».
- source_word: רִמָּה
  choice: червями
  rationale: Существительное обозначает червей или личинок, связанных с разложением; «черви» сохраняет более широкий смысл без излишнего уточнения «личинки».
- source_word: גיש עפר
  choice: комьями праха
  rationale: Редкое первое слово, вероятно, означает комья, сгустки или корку; «комья праха» сохраняет конкретный образ налипшей земли и лексическое значение עפר.
- source_word: עוֹרִי
  choice: кожа моя
  rationale: Обычное и точное обозначение человеческой кожи в современном русском языке.
- source_word: רָגַע
  choice: затвердевает
  rationale: В контексте поражённой кожи слово, вероятно, описывает её краткое затвердевание или стягивание; выбранный вариант конкретен, но трудность еврейского текста отмечена в сноске.
- source_word: וַיִּמָּאֵס
  choice: а потом вновь прорывается
  rationale: В данном телесном контексте трудный глагол, вероятно, описывает новое вскрытие или изъязвление кожи. Перевод передаёт последовательность состояний, не используя более узкое медицинское толкование в основном тексте.
