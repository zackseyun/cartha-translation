  text: Remember that my life is a breath[b][a]; my eye will not return to see good.
translation:
  language: ru
  text: 'Вспомни: жизнь моя — дыхание[a]; мой глаз уже не увидит добра[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дуновение» или «ветер». Еврейское רוּחַ может означать «дыхание», «ветер» или «дух»; здесь слово подчёркивает быстротечность жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мой глаз не возвратится, чтобы увидеть добро»; то есть я уже не испытаю добра, счастья или благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Вспомни
  rationale: Прямой повелительный глагол мужского рода в единственном числе, обращённый в контексте к Богу; сохраняет краткость и силу мольбы.
- source_word: כִּי
  choice: ':'
  rationale: כִּי вводит содержание того, о чём следует вспомнить. В русском двоеточие естественно передаёт эту связь без добавления причинного оттенка.
- source_word: רוּחַ
  choice: дыхание
  rationale: В контексте плача слово обозначает мимолётность и непрочность жизни. «Дыхание» естественно передаёт этот образ, сохраняя возможность значения «дуновение/ветер» в сноске.
- source_word: חַיָּי
  choice: жизнь моя
  rationale: Форма с суффиксом первого лица означает «моя жизнь»; постпозиция местоимения поддерживает достоинство и поэтичность речи.
- source_word: לֹא תָשׁוּב
  choice: уже не увидит
  rationale: Буквально конструкция говорит, что глаз «не возвратится, чтобы увидеть». В современном русском буквальное сочетание было бы неясным; «уже не увидит» естественно выражает невозможность вновь пережить добро, а буквальный образ отмечен в сноске.
- source_word: עֵינִי
  choice: мой глаз
  rationale: Сохранено единственное число еврейского текста и его поэтическая метонимия.
- source_word: לִרְאוֹת
  choice: увидит
  rationale: Основное значение ראה — «видеть»; в сочетании с טוֹב оно также допускает смысл «испытать благополучие».
- source_word: טוֹב
  choice: добра
  rationale: Широкое «добро» сохраняет смысловую ёмкость еврейского слова, которое может обозначать также счастье и благополучие.
