  text: How long will you not look away from me[a], nor leave me alone until I swallow my spit?
translation:
  language: ru
  text: Как долго Ты не отведёшь от меня взгляда, не отпустишь меня хотя бы на то время, пока я не проглочу слюну?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дословный образ: «пока я не проглочу свою слюну». Это идиоматическое выражение означает: «хотя бы на самый краткий миг».'
    reason: idiom
lexical_decisions:
- source_word: כַּמָּה
  choice: Долго ли ещё
  rationale: В контексте жалобы слово вводит вопрос о продолжительности; такая передача естественно выражает нетерпеливую мольбу Иова.
- source_word: תִשְׁעֶה מִמֶּנִּי
  choice: Ты не отведёшь от меня взгляда
  rationale: Глагол обозначает обращение или направление взгляда; в контексте Иов просит Бога прекратить пристальное наблюдение за ним.
- source_word: תַרְפֵּנִי
  choice: не оставишь меня
  rationale: Каузативная форма от רפה передаёт прекращение воздействия, отпускание; в данном параллелизме естественно звучит как просьба оставить Иова в покое.
- source_word: עַד
  choice: хотя бы до тех пор, пока
  rationale: Предлог задаёт предел желанной передышки; «хотя бы» ясно передаёт подразумеваемую краткость этой передышки, не меняя временного отношения.
- source_word: בִּלְעִי רֻקִּי
  choice: я сглотну слюну
  rationale: Буквальный, но естественный по-русски образ обозначает самый краткий миг; «сглотну» здесь идиоматичнее, чем «проглочу».
theological_decisions:
- issue: Направленность упрёка к Богу
  choice: Сохранено прямое обращение «Ты» и просьба отвести взгляд
  alternative: Смягчить как безличную просьбу о передышке
  rationale: Еврейский текст прямо обращён к Богу и сохраняет напряжение между Божьим вниманием и переживанием Иова как мучительного надзора.
translation_notes:
  register: Современный литературный русский язык с сохранением резкого, телесно конкретного образа еврейского текста. Заглавное «Ты» соответствует принятому почтительному оформлению обращения к Богу, не смягчая жалобы Иова.
