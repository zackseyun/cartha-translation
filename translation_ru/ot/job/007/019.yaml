  to: Как долго Ты не отведёшь от меня взгляда, не отпустишь меня хотя бы на то время, пока я не проглочу слюну?[a]
  rationale: Исправлена передача глагола רפה на «не отпустишь», что лучше сохраняет образ прекращения удерживания или давления. Временной оборот уточнён, чтобы передать просьбу о передышке хотя бы на мгновение; «проглочу» заменяет разговорное «сглотну». Сноска уточняет статус буквального образа и сохраняет объяснение идиомы.
