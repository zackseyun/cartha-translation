lexical_decisions:
- source_word: וְ
  choice: тогда
  rationale: 'Союз связывает стих с предшествующей жалобой Иова и в данном контексте выражает последовательность: когда он надеется найти облегчение во сне, тогда Бог устрашает его.'
- source_word: חִתַּתַּנִי
  choice: Ты устрашаешь меня
  rationale: Пиэль от חתת с суффиксом первого лица передаёт сильный страх и смятение; «устрашаешь» сохраняет интенсивность и возвышенный, но понятный регистр.
- source_word: בַחֲלֹמוֹת
  choice: снами
  rationale: 'Предлог ב допускает инструментальное понимание: сны выступают средством устрашения. Русский творительный падеж естественно передаёт это значение.'
- source_word: וּמֵחֶזְיֹנוֹת
  choice: и ... видениями
  rationale: Хотя מן буквально может обозначать источник («от видений»), в параллелизме со «снами» вероятно значение средства; творительный падеж даёт естественную русскую строку, а альтернатива отмечена в сноске.
- source_word: תְּבַעֲתַנִּי
  choice: пугаешь
  rationale: Пиэль от בעת означает приводить в ужас или внезапный страх. «Пугаешь» образует естественную параллель с более сильным «устрашаешь», не создавая ненужного повтора.
