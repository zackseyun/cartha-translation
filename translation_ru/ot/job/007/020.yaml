  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: חָטָ֡אתִי מָ֤ה אֶפְעַ֨ל לָ/ךְ֮ נֹצֵ֪ר הָ/אָ֫דָ֥ם לָ֤/מָה שַׂמְתַּ֣/נִי לְ/מִפְגָּ֣ע לָ֑/ךְ וָ/אֶהְיֶ֖ה עָלַ֣/י לְ/מַשָּֽׂא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/020.yaml
  text: If I have sinned[a], what can I do to you, watcher of mankind? Why have you made me your target[c][b], so that I have become a burden to myself?
translation:
  language: ru
  text: Если я согрешил[a], что я могу сделать Тебе, Страж людей? Зачем Ты сделал меня Своей мишенью[b], так что я стал в тягость самому себе?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я согрешил». По смыслу это может быть риторическим допущением: «Если я согрешил».'
    reason: лексическая и синтаксическая неоднозначность
  - marker: b
    text: 'Буквально возможно: «мишенью для Тебя».'
    reason: лексическая альтернатива
  - marker: c
    text: 'Масоретский текст: «в тягость самому себе»; некоторые древние переводы отражают чтение «в тягость Тебе».'
    reason: вариант древнего чтения
lexical_decisions:
- source_word: חָטָאתִי
  choice: Если я согрешил
  rationale: 'Формально это перфект первого лица: «я согрешил». В ходе риторической жалобы Иова условная формулировка естественно передаёт уступительный смысл, не превращая слова в безоговорочное признание; буквальная форма отмечена в сноске.'
- source_word: מָה אֶפְעַל לָךְ
  choice: что я могу сделать Тебе
  rationale: Вопрос выражает не только будущее действие, но и неспособность человека причинить Богу ущерб или повлиять на Него; «могу» естественно передаёт эту риторическую силу.
- source_word: נֹצֵר הָאָדָם
  choice: Страж людей
  rationale: נֹצֵר допускает значения наблюдения, охраны и бдительного надзора. «Страж» сохраняет напряжение между заботливой охраной и пристальным наблюдением, а «людей» естественно передаёт родовое значение единственного הָאָדָם.
- source_word: לָמָה שַׂמְתַּנִי לְמִפְגָּע לָךְ
  choice: Зачем Ты сделал меня Своей мишенью
  rationale: מִפְגָּע обозначает объект столкновения или удара. «Мишень» ясно и естественно передаёт образ направленного против Иова действия; לָךְ идиоматически выражено притяжательным «Своей».
- source_word: וָאֶהְיֶה עָלַי לְמַשָּׂא
  choice: так что я стал в тягость самому себе
  rationale: Масоретское עָלַי означает «на мне / для меня» и естественно понимается как «самому себе». Связь результата передана словами «так что»; древнее разночтение «Тебе» вынесено в сноску.
theological_decisions:
- issue: Является ли חָטָאתִי прямым признанием греха или риторическим допущением
  choice: Если я согрешил
  alternative: Я согрешил
  rationale: 'Контекст жалобы допускает уступительный вопрос: даже если Иов согрешил, чем это затрагивает Бога? Условный перевод не снимает возможности признания, а буквальная форма сохранена в сноске.'
- issue: Родовое значение הָאָדָם
  choice: людей
  alternative: человека / человечества
  rationale: Еврейское единственное число употреблено обобщённо. Русское «людей» передаёт всё человечество без ненужного ограничения мужским полом и остаётся естественным в обращении «Страж людей».
- issue: Адресат, которому Иов стал в тягость
  choice: самому себе
  alternative: Тебе
  rationale: Масоретский текст однозначно содержит עָלַי, «для меня / на мне». Вариант «Тебе» известен по некоторым древним свидетельствам, но не должен заменять основное чтение.
translation_notes:
  register: Современный литературный русский с достоинством поэтической жалобы. Обращение к Богу оформлено прописными местоимениями по принятой русской библейской традиции. «Страж» намеренно сохраняет двоякий оттенок охраны и пристального надзора.
