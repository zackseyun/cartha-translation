  text: כֵּ֤ן הָנְחַ֣לְתִּי לִ֭/י יַרְחֵי שָׁ֑וְא וְ/לֵיל֥וֹת עָ֝מָ֗ל מִנּוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/003.yaml
  text: So I have been allotted months of emptiness[b][a], and nights of misery have been assigned to me.
translation:
  language: ru
  text: Так и мне достались в удел месяцы тщеты[a], и ночи мучений[b] были назначены мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «месяцы пустоты», «месяцы бесплодности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ночи тяжкого труда», «ночи бедствия» или «ночи страдания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Так и
  rationale: Связывает слова Иова с образом наёмника и раба в предыдущих стихах, передавая сравнительно-следственный оттенок.
- source_word: הָנְחַלְתִּי לִי
  choice: мне достались в удел
  rationale: Форма глагола представляет Иова получателем назначенной ему доли; выражение «достались в удел» естественно передаёт этот пассивный смысл.
- source_word: יַרְחֵי שָׁוְא
  choice: месяцы тщеты
  rationale: שָׁוְא обозначает пустоту, тщетность или бесплодность; «тщета» сохраняет ёмкость и поэтическую силу исходного слова.
- source_word: לֵילוֹת עָמָל
  choice: ночи мучений
  rationale: עָמָל может означать тяжкий труд, бедствие, страдание или мучение; в контексте мучительных бессонных ночей наиболее естественно «мучения».
- source_word: מִנּוּ לִי
  choice: были назначены мне
  rationale: Пассивная форма передаёт ночи как определённую Иову долю, не называя того, кто их назначил.
theological_decisions:
- issue: Кто назначил Иову его страдания
  choice: Действующее лицо не названо
  alternative: Явно указать Бога как назначившего страдания
  rationale: В еврейском тексте употреблены пассивные формы без названного деятеля; перевод не должен добавлять прямое указание на Бога.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма. Выражение «достались в удел» звучит достойно и понятно, а повторение «мне» отражает личную направленность обеих частей еврейского стиха.
