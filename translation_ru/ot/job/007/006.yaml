  text: יָמַ֣/י קַ֭לּוּ מִנִּי אָ֑רֶג וַ֝/יִּכְל֗וּ בְּ/אֶ֣פֶס תִּקְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/006.yaml
  text: My days are swifter than a weaver’s shuttle[b][a]; they come to an end without hope.
translation:
  language: ru
  text: Дни мои бегут быстрее ткацкого челнока[a] и кончаются без надежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать ткацкое орудие вообще; здесь по образу быстрого движения обычно понимается челнок.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Дни мои
  rationale: 'Сохранено конкретное значение формы с суффиксом первого лица: Иов говорит о своих днях, а не отвлечённо о жизни или времени.'
- source_word: קַלּוּ
  choice: бегут быстрее
  rationale: Глагол выражает быстроту, а предлог מִן — сравнение. Русское «бегут быстрее» естественно передаёт стремительное течение дней и образ движения.
- source_word: מִנִּי אָרֶג
  choice: ткацкого челнока
  rationale: Слово אָרֶג связано с ткачеством и допускает более общее понимание ткацкого орудия, однако в данном сравнении челнок лучше всего передаёт образ быстрого движения.
- source_word: וַיִּכְלוּ
  choice: и кончаются
  rationale: Форма от כלה означает достижение конца, исчерпание. Настоящее время соответствует обобщённому описанию переживания Иова.
- source_word: בְּאֶפֶס תִּקְוָה
  choice: без надежды
  rationale: Кратко и естественно передаёт отсутствие надежды, не уточняя её предмет и не снимая напряжённости высказывания.
