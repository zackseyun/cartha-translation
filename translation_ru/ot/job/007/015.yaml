translation:
  language: ru
  text: Так что душа моя выбирает удушение[a], смерть — вместо моих костей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа моя предпочла бы удушье»; возможно также: «жизнь моя предпочла бы удушение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «смерть — нежели (чем) мои кости». Оборот труден; вероятно, Иов предпочитает смерть дальнейшему существованию в своём измученном теле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְחַר
  choice: выбирает
  rationale: Глагол בחר означает «выбирать». Настоящее время естественно передаёт действие в ходе поэтической речи; контекстуально возможно также «предпочла бы».
- source_word: מַחֲנָק
  choice: удушение
  rationale: Существительное обозначает удушение, удушье. «Удушение» сохраняет конкретный и резкий образ еврейского текста.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נֶפֶשׁ может означать душу, жизнь, самого человека. Буквальное выражение здесь понятно по-русски и сохраняет поэтическую интенсивность.
- source_word: מָוֶת
  choice: смерть
  rationale: Прямое соответствие обычному значению מָוֶת.
- source_word: מֵעַצְמוֹתָי
  choice: лишь бы не эти кости
  rationale: 'Буквально: «от моих костей». Предлог מִן допускает сравнительное понимание («предпочитает смерть костям»), но оборот труден; формулировка сохраняет «кости» и передаёт предпочтение смерти нынешнему телесному существованию.'
