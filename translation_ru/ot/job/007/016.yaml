lexical_decisions:
- source_word: מָאַסְתִּי
  choice: Мне опротивела жизнь
  rationale: Глагол מָאַס выражает сильное неприятие, отвращение или отвержение. В еврейском тексте дополнение не названо; «жизнь» естественно восстанавливается из контекста плача Иова, а неопределённость отмечена в сноске.
- source_word: לֹא לְעֹלָם אֶחְיֶה
  choice: я не буду жить вечно
  rationale: Прямо передаёт отрицание, לְעֹלָם («вечно») и форму אֶחְיֶה («буду жить»), не превращая утверждение о смертности в выражение желания.
- source_word: חֲדַל מִמֶּנִּי
  choice: Оставь меня
  rationale: Императив חֲדַל означает «перестань, прекрати», а сочетание с מִמֶּנִּי буквально имеет смысл «перестань по отношению ко мне / отступись от меня». «Оставь меня» — естественная современная русская передача этой просьбы.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание просьбы; «ведь» кратко и естественно выражает причинно-пояснительную связь.
- source_word: הֶבֶל
  choice: лишь дыхание
  rationale: הֶבֶל обозначает дыхание, пар, нечто мимолётное и непрочное. «Лишь дыхание» сохраняет конкретный образ и подчёркивает краткость человеческих дней, не сводя слово к отвлечённой «суете».
- source_word: יָמָי
  choice: дни мои
  rationale: Формальная и естественная передача притяжательной формы; в контексте «дни» обозначают оставшийся срок жизни Иова.
theological_decisions:
- issue: Неназванный объект глагола מָאַסְתִּי
  choice: В основном тексте восстановлено «жизнь», а отсутствие объекта в еврейском отмечено сноской.
  alternative: «Я отвергаю это» или абсолютное «Я отвергаю».
  rationale: Контекст предыдущего стиха и продолжение о смертности делают жизнь наиболее вероятным подразумеваемым объектом, однако сноска сохраняет подлинную грамматическую неоднозначность и не выдаёт восстановление за явно названное слово.
translation_notes:
  register: Современный литературный русский язык с достоинством плача Иова. Инверсия «дни мои» сохраняет поэтическую выразительность без архаизации. Сноска [b] поставлена при слове «дыхание», к которому она относится.
