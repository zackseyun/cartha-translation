translation:
  language: ru
  text: Мне опротивела жизнь[a]; я не буду жить вечно. Оставь меня, ведь дни мои — лишь дыхание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте дополнение не названо: буквально «Я отвергаю» или «Я презираю». По контексту подразумевается жизнь.'
    reason: lexical_alternative
  - marker: b
