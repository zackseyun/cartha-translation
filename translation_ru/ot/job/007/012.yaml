  text: Разве я — море или морское чудовище[a], что Ты ставишь надо мной стражу[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дракон» или «змей». Еврейское таннин обозначает огромное грозное существо и нередко связано с образами моря и хаоса.'
