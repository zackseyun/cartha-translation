lexical_decisions:
- source_word: הֲיָם
  choice: Разве я море
  rationale: Вопросительная частица הֲ вводит риторический вопрос; «море» прямо передаёт יָם и сохраняет образ грозной, неукротимой стихии.
- source_word: אִם
  choice: или
  rationale: 'Здесь אִם разделяет два сопоставленных варианта в одном риторическом вопросе: «море или морское чудовище».'
- source_word: תַּנִּין
  choice: морское чудовище
  rationale: Слово может обозначать крупное грозное существо, дракона или змея. В параллели с морем перевод «морское чудовище» ясно передаёт образ, не приписывая ему более определённой мифологической природы, чем позволяет текст.
- source_word: כִּי
  choice: что
  rationale: 'כִּי вводит поясняющую часть риторического вопроса: Иов спрашивает, почему с ним обращаются как с угрозой, требующей охраны.'
- source_word: תָשִׂים
  choice: ты поставил
  rationale: Глагол שׂים означает «ставить, помещать, назначать». Прошедшее время естественно передаёт уже испытываемый Иовом надзор, хотя древнееврейская форма сама по себе допускает аспектуальную широту.
- source_word: עָלַי
  choice: надо мной
  rationale: Предлог עַל здесь выражает направленный на Иова надзор; «надо мной» сохраняет пространственную метафору оригинала.
- source_word: מִשְׁמָר
  choice: стражу
  rationale: מִשְׁמָר может означать стражу, охрану или наблюдение. «Поставить стражу» передаёт как надзор, так и ограничение свободы.
theological_decisions:
- issue: Образ תַּנִּין в поэтической образности моря и хаоса
  choice: морское чудовище без дальнейшей мифологизации
  alternative: дракон; змей
  rationale: Иов представляет себя как будто космической угрозой, которую нужно удерживать под надзором. Перевод сохраняет силу и напряжение образа, но не вводит развитую мифологическую систему, которой стих прямо не описывает.
- issue: Направленность жалобы Иова к Богу
  choice: сохранено прямое обращение на «ты»
  alternative: заменить обращение безличной конструкцией
  rationale: Форма второго лица תָשִׂים делает жалобу непосредственной. Перевод не смягчает дерзновенный вопрос Иова и не объясняет его богословски внутри самого стиха.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и резкости риторического вопроса. Местоимение «ты» дано со строчной буквы согласно общим нормам современного русского текста; это не снижает достоинства обращения и не меняет того, что адресатом в контексте является Бог.
