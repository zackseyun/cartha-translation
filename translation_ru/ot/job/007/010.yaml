  text: He does not return again to his house[a], and his place does not know him anymore.
translation:
  language: ru
  text: Он больше не вернётся в свой дом, и его место больше не узнает[a] его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «больше не признает его». Еврейский глагол может означать «узнать, распознать» или «признать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: вернётся
  rationale: Глагол שׁוב означает «возвращаться»; форма будущего времени естественно передаёт по-русски категорическое отрицание возвращения.
- source_word: עוֹד (первое употребление)
  choice: уже не
  rationale: В сочетании с отрицанием выражает прекращение возможности в будущем; «уже не вернётся» звучит естественно и передаёт необратимость.
- source_word: לְבֵיתוֹ
  choice: в свой дом
  rationale: Сохраняет конкретный образ дома; возвратное «свой» естественно при подлежащем третьего лица.
- source_word: יַכִּירֶנּוּ
  choice: не узнает его
  rationale: Hифиль נכר здесь означает «узнать, распознать». Такая передача сохраняет поэтическое олицетворение места и точнее, чем общее «знать».
- source_word: עוֹד (второе употребление)
  choice: больше не
  rationale: С отрицанием естественно передаётся как «больше не», подчёркивая окончательность отсутствия.
- source_word: מְקֹמוֹ
  choice: место его
  rationale: Буквально «его место». Постпозиция местоимения придаёт строке достоинство и сохраняет связь с поэтическим олицетворением оригинала.
