  yaml_path: translation/ot/job/007/002.yaml
  text: Like a servant who longs for shade[a], and like a hired worker who waits for his wages[c][b],
translation:
  language: ru
  text: Как раб жаждет тени[a] и как наёмный работник ждёт своей платы[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прохлады». Буквально: «тени»; имеется в виду облегчение от зноя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своего заработка»; возможен также перевод «награды за свой труд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/עֶבֶד
  choice: как раб
  rationale: עֶבֶד может означать раба или слугу; в образе изнурительного, несвободного труда «раб» точнее передаёт социальную уязвимость и силу сравнения.
- source_word: יִשְׁאַף
  choice: жаждет
  rationale: Глагол выражает сильное, почти физическое стремление; «жаждет» естественно передаёт напряжённость желания и уместно сочетается с тенью как избавлением от зноя.
- source_word: צֵל
  choice: тени
  rationale: Буквально слово означает «тень», а в контексте тяжёлого труда подразумевает прохладу и облегчение от жары.
- source_word: וּ/כְ/שָׂכִיר
  choice: и как наёмный работник
  rationale: שָׂכִיר обозначает человека, нанятого за плату; этот вариант сохраняет экономический смысл и звучит понятно в современном русском языке.
- source_word: יְקַוֶּה
  choice: ждёт
  rationale: קוה допускает значения ожидания и надежды; при ожидаемой оплате за труд естественнее всего русское «ждёт».
- source_word: פָעֳל/וֹ
  choice: своей платы
  rationale: Хотя существительное связано с трудом и его результатом, рядом с наёмным работником оно обозначает причитающееся ему вознаграждение; «плата» точно и естественно передаёт смысл.
theological_decisions: []
