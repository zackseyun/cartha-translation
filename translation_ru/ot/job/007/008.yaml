base_translation:
  language: en
  yaml_path: translation/ot/job/007/008.yaml
  text: The eye of the one who sees me will no longer behold me[a]; your eyes will be on me[b], but I will be gone.
translation:
  language: ru
  text: Глаз того, кто видит меня, больше меня не увидит[a]; ты взглянешь на меня — а меня уже не будет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Глаз, который видит меня, не увидит меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твои глаза — на мне, а меня нет»; то есть, когда ты взглянешь на меня, меня уже не будет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְשׁוּרֵנִי
  choice: больше меня не увидит
  rationale: Глагол שׁור означает «смотреть, видеть, созерцать». Современное «увидит» естественно передаёт зрительный образ; при отрицании и в данном контексте имперфект выражает будущее, а «больше» обозначает предстоящее исчезновение Иова из виду.
- source_word: עֵין רֹאִי
  choice: глаз того, кто видит меня
  rationale: Сохранён конкретный еврейский образ «глаза» и конструкция со значением «того, кто меня видит», без сведения её к отвлечённому «наблюдателю».
- source_word: עֵינֶיךָ בִּי
  choice: твои глаза обратятся ко мне
  rationale: 'Еврейское выражение буквально говорит: «твои глаза — на мне». Глагол «обратятся» делает безглагольную фразу естественной по-русски и передаёт направленный взгляд, не добавляя прямо значения «искать».'
- source_word: וְאֵינֶנִּי
  choice: но меня уже не будет
  rationale: 'Буквально: «и меня нет». В контексте ожидаемой смерти и будущего Божьего взгляда русская фраза передаёт отсутствие Иова в будущем; противительный союз естественно выражает напряжение между взглядом и его исчезновением.'
theological_decisions:
- issue: К кому относится «твои глаза»
  choice: Прямое обращение к Богу сохранено без добавления имени
  alternative: Обобщённое обращение к любому наблюдателю
  rationale: В ближайшем контексте Иов обращается к Богу. Перевод сохраняет второе лицо, но не вставляет отсутствующее в еврейском тексте слово «Бог».
- issue: Смысл отсутствия Иова
  choice: «меня уже не будет» сохраняет образ предстоящего отсутствия
  alternative: Явно перевести как «я умру»
  rationale: Фраза может подразумевать смерть, но исходный текст выражает это через отсутствие. Прямое упоминание смерти устранило бы поэтическую недосказанность.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и конкретного образа глаз. Архаичное «узрит» не используется. Местоимение «твои» дано со строчной буквы как часть текста, хотя по контексту обращение направлено к Богу.
