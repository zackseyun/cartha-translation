id: JOB.7.9
reference: Job 7:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כָּלָ֣ה עָ֭נָן וַ/יֵּלַ֑ךְ כֵּ֥ן יוֹרֵ֥ד שְׁ֝א֗וֹל לֹ֣א יַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/007/009.yaml
  text: As a cloud fades away and vanishes[a], so the one who goes down to Sheol does not come up.
translation:
  language: ru
  text: Как облако тает и исчезает, так тот, кто сходит в Шеол[a], не поднимется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу»; или: «в мир мёртвых».'
    reason: Лексическая альтернатива для древнееврейского слова שְׁאוֹל.
lexical_decisions:
- source_word: כָּלָה
  choice: тает
  rationale: Глагол означает «заканчиваться, иссякать». Применительно к облаку русское «тает» естественно передаёт его постепенное рассеивание, не превращая образ в буквальное уничтожение.
- source_word: עָנָן
  choice: облако
  rationale: Прямое значение существительного; сохраняет простой и наглядный образ сравнения.
- source_word: וַיֵּלַךְ
  choice: и исчезает
  rationale: Буквально «и уходит», но в сочетании с образом тающего облака речь идёт о его исчезновении. Выбранное выражение естественно по-русски и сохраняет параллелизм.
- source_word: כֵּן
  choice: так
  rationale: Кратко и естественно вводит вторую часть сравнения.
- source_word: יוֹרֵד
  choice: тот, кто сходит
  rationale: Причастие употреблено субстантивно и обобщённо. Оборот сохраняет представление о движении вниз и не сводит высказывание к одному конкретному человеку.
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Сохранён древнееврейский термин, чтобы не сужать его значение до физической могилы и не конкретизировать сверх текста природу мира мёртвых.
- source_word: לֹא יַעֲלֶה
  choice: не поднимется
  rationale: Сохраняет вертикальную противоположность глаголу «сходит». Будущее время естественно выражает по-русски необратимость смерти в рамках сетования Иова.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация сохраняет смысловую широту древнееврейского понятия и не решает однозначно, имеется ли в виду могила, область умерших или смерть как удел человека. В контексте это слова Иова о видимой необратимости смерти, а не исчерпывающее учение о воскресении.
- issue: Смысл выражения לֹא יַעֲלֶה
  choice: не поднимется
  alternative: не поднимается
  rationale: Форма допускает обобщённое высказывание, однако русское будущее время лучше передаёт перспективу человека, сходящего в Шеол, и сохраняет напряжение текста без добавления слова «никогда».
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным, но понятным синтаксисом. Образ облака передан естественно; направление «сходит — поднимется» сохранено. Термин «Шеол» пояснён сноской без навязывания узкого богословского толкования.
