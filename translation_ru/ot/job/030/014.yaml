  source_fidelity: 'Первая строка в целом верно сохраняет сравнительную конструкцию כְּ־ и образ широкого пролома. Однако «грохот обвала» чрезмерно конкретизирует שֹׁאָה: слово обозначает разрушение, разорение, бедствие/опустошение, но не требует ни звукового «грохота», ни именно обвала. «Среди разорения» передаёт поэтическое обстоятельственное понимание תַּחַת, не добавляя деталей. Альтернативная сноска сохраняет возможное более пространственное «через» и основное значение תַּחַת «под».'
  naturalness: «Словно широкий пролом, они наступают» — намеренно резкий, но понятный поэтический образ и естественный современный литературный русский. «Катятся вперёд» удачно сохраняет динамику хитпаэля без искусственной возвратной конструкции.
  terminology: «Пролом» точно передаёт פֶּרֶץ в образе разрушенной стены; «широкий» — רָחָב. «Наступают» допустимо в контексте враждебного напора, хотя глагол в оригинале шире. «Разорение» для שֹׁאָה точнее и нейтральнее, чем «грохот обвала».
