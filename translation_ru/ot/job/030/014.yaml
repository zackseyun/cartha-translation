  yaml_path: translation/ot/job/030/014.yaml
  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: ru
  text: Словно широкий пролом, они наступают[a]; среди разорения катятся вперёд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как через широкий пролом они наступают; под разрушением катятся вперёд».'
    reason: Еврейская поэтическая строка допускает понимание כְּ как образа движения через пролом, а תַּחַת — в более буквальном пространственном значении «под».
lexical_decisions:
- source_word: כְּ/פֶרֶץ
  choice: подобно… пролому
  rationale: פֶרֶץ обозначает пролом или брешь, особенно в стене; приставка כְּ обычно вводит сравнение. «Пролом» сохраняет конкретный образ разрушенной стены и наступления.
- source_word: רָחָב
  choice: широкому
  rationale: Прилагательное характеризует пролом как обширный; «широкий» — точное и естественное соответствие.
- source_word: יֶאֱתָיוּ
  choice: они наступают
  rationale: Глагол передаёт приближение или продвижение. В военном образе «наступают» звучит естественно, не устраняя значения движения вперёд.
- source_word: תַּחַת
  choice: среди
  rationale: Основное пространственное значение — «под», однако здесь слово может обозначать обстоятельства, среди которых происходит движение. «Среди» даёт понятный русский текст; буквальная возможность отмечена в сноске.
- source_word: שֹׁאָה
  choice: грохота обвала
  rationale: שֹׁאָה может обозначать разрушение, бедствие или сокрушительный обвал. В сочетании с образом пролома перевод передаёт как разрушительное событие, так и слышимый грохот, подразумеваемый английским consultation layer.
- source_word: הִתְגַּלְגָּלוּ
  choice: катятся вперёд
  rationale: Форма хитпаэль от גלל выражает катящееся или валящееся движение. «Катятся вперёд» сохраняет стремительность и неудержимость образа без неестественного буквального «катят себя».
