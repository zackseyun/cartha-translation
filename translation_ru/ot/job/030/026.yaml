  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: ru
  text: Ибо я надеялся на добро, но пришло бедствие[a]; я ждал света, но пришла тьма.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «зло»; здесь еврейское слово, вероятно, означает несчастье или бедствие, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: опущено как связка
  rationale: В данном контексте частица вводит пояснение к плачу Иова. В отдельном русском стихе начальное «ибо» звучало бы тяжеловесно; пояснительная связь естественно передаётся без явного союза.
- source_word: טוֹב
  choice: добро
  rationale: Субстантивированное прилагательное обозначает нечто благоприятное — благо или благополучие. «Добро» сохраняет широту значения и контраст с רָע.
- source_word: קִוִּיתִי
  choice: я надеялся
  rationale: Глагол выражает исполненное надежды ожидание; такой перевод естественен по-русски и сохраняет эмоциональный оттенок.
- source_word: וַיָּבֹא
  choice: пришло / пришла
  rationale: Повтор одного глагола сохранён в обеих половинах стиха, чтобы передать резкий параллелизм оригинала.
- source_word: רָע
  choice: бедствие
  rationale: Здесь слово обозначает пережитое несчастье или беду, а не нравственное зло. «Бедствие» ясно передаёт контекстуальный смысл, не внося моральной оценки.
- source_word: וַאֲיַחֲלָה
  choice: ждал
  rationale: Глагол означает ожидание, связанное с надеждой. «Ждал» позволяет избежать неестественного повтора и сохраняет параллелизм.
- source_word: לְאוֹר
  choice: света
  rationale: Сохранён образ света без истолкования как облегчения или спасения, чтобы не сужать метафорическую многозначность.
- source_word: אֹפֶל
  choice: тьма
  rationale: Сильное обозначение мрака. «Тьма» образует прямой и выразительный контраст со «светом».
theological_decisions:
- issue: 'Значение רָע: нравственное зло или пережитое несчастье'
  choice: бедствие
  alternative: зло
  rationale: Контекст плача Иова говорит о постигшей его беде, а не о приходе нравственного зла. Сноска сохраняет прямую лексическую альтернативу и напряжение противопоставления טוֹב / רָע.
translation_notes:
  register: Современный литературный русский язык; краткий, ритмичный параллелизм оригинала сохранён. Образы света и тьмы оставлены без поясняющей интерпретации.
