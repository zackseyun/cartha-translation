    text: 'Или: «ватага». Еврейское פִּרְחַח — редкое слово, обозначающее презираемую или необузданную группу людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «они отсылают прочь мои ноги». Возможно, имеется в виду, что они вытесняют Иова, сбивают его с пути или лишают опоры.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «насыпают против меня дороги их бедствия». Еврейский текст сохраняет образ сооружения дорог для враждебного наступления; выражение может также означать дороги бедствия или разрушения, которое они несут.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: Справа от меня
  rationale: Пространственное выражение передано естественно по-русски; контекст показывает, что речь идёт о правой стороне Иова.
- source_word: פִּרְחַח
  choice: сброд
  rationale: Редкое собирательное существительное обозначает презираемую, необузданную группу. «Сброд» сохраняет пренебрежительный оттенок и собирательность.
- source_word: יָקוּמוּ
  choice: поднимается
  rationale: Глагол קום здесь описывает враждебное выступление; единственное число согласовано с собирательным словом «сброд».
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: они гонят прочь мои ноги
  rationale: Трудное выражение буквально говорит об удалении ног Иова. Формулировка сохраняет телесный образ и допускает смысл вытеснения, лишения опоры или сбивания с пути.
- source_word: וַיָּסֹלּוּ
  choice: насыпают
  rationale: Глагол סלל часто обозначает сооружение дороги путём насыпания; выбор сохраняет дорожную метафору враждебного наступления.
- source_word: עָלַי
  choice: против меня
  rationale: В контексте нападения предлог имеет направленно-враждебный смысл.
- source_word: אָרְחוֹת אֵידָם
  choice: свои гибельные дороги
  rationale: Передача сохраняет образ принадлежащих нападающим дорог, несущих бедствие или гибель, не уточняя сверх текста, кого именно постигнет бедствие.
