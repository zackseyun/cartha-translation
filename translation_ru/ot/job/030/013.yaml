  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: ru
  text: Они разрушают мою тропу, содействуют моей гибели[a] — у них нет помощника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «извлекают из этого пользу». Еврейский глагол может означать «быть полезным, приносить пользу» либо «содействовать, продвигать»; здесь подразумевается гибель Иова.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «без помощника» или «без чьей-либо помощи». Заключительные слова кратки и могут означать как то, что они действуют без посторонней помощи, так и то, что у них нет помощника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: разрушают
  rationale: Глагол обозначает разрушение или разламывание; в сочетании с тропой «разрушают» звучит естественно и сохраняет конкретный образ.
- source_word: נְתִיבָתִי
  choice: мою тропу
  rationale: Существительное означает тропу или путь; «тропа» сохраняет образ конкретной дороги и возможную метафору жизненного пути.
- source_word: לְהַוָּתִי
  choice: мою гибель
  rationale: הַוָּה может означать бедствие, погибель или разрушение. «Гибель» кратко и естественно передаёт направленность враждебных действий против Иова.
- source_word: יֹעִילוּ
  choice: приближают
  rationale: Hiphil от יעל может обозначать содействие или продвижение чего-либо. По контексту подразумевается, что противники способствуют гибели Иова; «приближают» естественно выражает это, не вводя идею их личной выгоды как единственно возможную.
- source_word: לֹא עֹזֵר לָמוֹ
  choice: и никто им не помогает
  rationale: Краткая еврейская именная конструкция допускает понимание «нет у них помощника» либо обстоятельственное «без чьей-либо помощи». Выбранная формулировка естественна по-русски и сохраняет основную синтаксическую связь.
