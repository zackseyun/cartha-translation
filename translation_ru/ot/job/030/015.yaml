lexical_decisions:
- source_word: הָהְפַּךְ
  choice: обратились против
  rationale: Хофаль от הפך выражает поворот или обращение на Иова; русское сочетание передаёт результирующее направленное против него действие и согласуется по смыслу с собирательным множественным «ужасы».
- source_word: בַּלָּהוֹת
  choice: ужасы
  rationale: Существительное обозначает внезапные страшные явления или переживания; «ужасы» кратко и естественно сохраняет эмоциональную силу.
- source_word: תִּרְדֹּף
  choice: они гонят прочь
  rationale: רדף означает преследовать или гнаться. Женское единственное число глагола допускает собирательное согласование с предшествующим множественным существительным; по-русски естественно употреблено множественное число с явным местоимением.
- source_word: כָּרוּחַ
  choice: словно ветер
  rationale: רוּחַ здесь естественно понимать как «ветер»; образ передаёт стремительное унесение и образует параллель с исчезающим облаком.
- source_word: נְדִבָתִי
  choice: моё достоинство
  rationale: Слово связано с благородством, знатностью и почётным положением. В жалобе Иова «достоинство» естественно обозначает утраченное почётное состояние, не сужая смысл до происхождения.
- source_word: וּכְעָב
  choice: и, как облако
  rationale: עָב обозначает облако, иногда густое облако; общий образ «облака» достаточен и поэтически естественен.
- source_word: עָבְרָה
  choice: исчезает
  rationale: עבר здесь означает пройти, миновать или уйти; «исчезает» ясно передаёт утрату в образе проходящего облака, а настоящее время сохраняет живость плача.
- source_word: יְשֻׁעָתִי
  choice: моё спасение
  rationale: ישועה может обозначать спасение, избавление или благополучие. «Спасение» сохраняет прямую лексическую связь, а более контекстуальные значения указаны в примечании.
theological_decisions:
- issue: Возможное доктринальное переосмысление יְשֻׁעָתִי
  choice: моё спасение
  alternative: моё избавление; моё благополучие
  rationale: В данном плаче слово может относиться к личному избавлению или благополучию, а не обязательно к спасению в позднейшем богословском смысле. Основной текст сохраняет ёмкое «спасение», а примечание удерживает контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого поэтического параллелизма. «Гонят прочь» делает направленность образа ясной, а перестановка сравнительных оборотов звучит естественно по-русски. Маркеры примечаний помещены непосредственно после неоднозначных слов.
