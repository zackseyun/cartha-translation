lexical_decisions:
- source_word: בֵּין
  choice: среди
  rationale: С множественным числом שִׂיחִים предлог естественно передаётся как «среди», а не буквально «между».
- source_word: שִׂיחִים
  choice: кустов
  rationale: Слово обозначает низкий кустарник; «кусты» — ясный современный эквивалент без излишнего уточнения.
- source_word: יִנְהָקוּ
  choice: ревут
  rationale: Глагол נהק обозначает прежде всего крик осла. Русское «ревут» сохраняет резкий, уподобляющий животным образ и звучит естественнее, чем узкое «кричат по-ослиному».
- source_word: תַּחַת
  choice: под
  rationale: Прямое пространственное значение предлога естественно передаётся словом «под».
- source_word: חָרוּל
  choice: колючками
  rationale: Точная идентификация растения неясна; обобщённое «колючки» передаёт дикое и неприятное растение, не создавая ложной ботанической точности.
- source_word: יְסֻפָּחוּ
  choice: сбиваются в кучу
  rationale: Форма выражает соединение или скопление; этот перевод естественно передаёт тесноту и жалкое положение людей в контексте.
