  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: ru
  text: Они гнушаются мною, сторонятся меня и не удерживаются от того, чтобы плевать мне в лицо[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не удерживают плевка от моего лица». Речь идёт об открытом выражении презрения, направленном лично против Иова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: гнушаются мною
  rationale: Глагол תעב выражает сильное отвращение и презрение; «гнушаются» сохраняет интенсивность и соответствует возвышенному, но понятному регистру книги Иова.
- source_word: רָחֲקוּ מֶנִּי
  choice: сторонятся меня
  rationale: רחק означает удаляться или держаться вдали. «Сторонятся меня» естественно передаёт как физическое, так и общественное отчуждение.
- source_word: לֹא חָשְׂכוּ
  choice: не удерживаются от того, чтобы
  rationale: חשׂך означает удерживать, сдерживать или воздерживаться. Выбранная конструкция ясно передаёт отсутствие всякого сдерживания перед оскорбительным поступком.
- source_word: וּמִפָּנַי ... רֹק
  choice: плевать мне в лицо
  rationale: Буквально сочетание говорит о плевке или слюне, не удерживаемых «от моего лица/присутствия». Русское выражение «плевать мне в лицо» естественно передаёт открытое личное унижение, однако буквальная форма отмечена в сноске.
