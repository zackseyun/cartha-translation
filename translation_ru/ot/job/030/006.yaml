    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: в промоинах
  rationale: עָרוּץ обозначает размытый водой канал, углубление или овраг. «Промоины» естественно передают образ эрозионных углублений и не сливаются по смыслу с последующим נְחָלִים.
- source_word: נְחָלִים
  choice: пересохших русел
  rationale: נַחַל может обозначать долину временного потока, вади или само его русло. «Пересохшие русла» понятно современному русскому читателю и передаёт ближневосточную реалию без заимствования «вади».
- source_word: לִשְׁכֹּן
  choice: они живут
  rationale: Инфинитив לִשְׁכֹּן в данной конструкции выражает пребывание или обитание. Личная форма «они живут» естественно связывает стих с описываемыми людьми.
- source_word: חֹרֵי
  choice: в ямах
  rationale: חֹרֵי — множественное сопряжённое от חוֹר, «отверстие, углубление, нора». «Ямы» сохраняют суровый образ примитивного убежища; более конкретное «пещеры» могло бы чрезмерно уточнить смысл.
- source_word: עָפָר
  choice: среди праха
  rationale: עָפָר означает рыхлую землю, пыль или прах. «Прах» соответствует возвышенному поэтическому регистру Иова и сохраняет оттенок унижения и бренности.
- source_word: וְכֵפִים
  choice: и скал
  rationale: 'כֵפִים обозначает скалы или утёсы. Предлог «среди» естественно распространяется на оба однородных элемента: среди праха и скал.'
