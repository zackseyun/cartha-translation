  yaml_path: translation/ot/job/030/006.yaml
  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: ru
  text: Они живут в оврагах русел временных потоков[a], в норах земли и среди скал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в оврагах речных долин»; еврейское נְחָלִים может означать долины, русла временных потоков или сами потоки.'
    reason: lexical_alternative
  - marker: b
