lexical_decisions:
- source_word: אָח
  choice: братом
  rationale: Сохраняет прямую метафору родства и тесного единения с обитателями запустения.
- source_word: הָיִיתִי
  choice: стал
  rationale: Перфект глагола היה здесь естественно передаёт наступившее состояние Иова; русское «стал» ясно выражает перемену.
- source_word: לְתַנִּים
  choice: шакалам
  rationale: В поэтических описаниях запустения תַנִּים, вероятнее всего, обозначает шакалов; устаревшее «драконам» зоологически менее обоснованно.
- source_word: וְרֵעַ
  choice: и товарищем
  rationale: רֵעַ означает друга, спутника или товарища. «Товарищем» поддерживает параллелизм с «братом», не усиливая оттенок личной дружбы.
- source_word: לִבְנוֹת יַעֲנָה
  choice: страусам
  rationale: Буквально «дочерям страуса» — еврейское обозначение страусов. В основном тексте употреблено естественное русское название, а буквальная форма сохранена в примечании.
