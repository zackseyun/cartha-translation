  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: ru
  text: Внутри у меня всё кипит и не утихает[a]; дни бедствия предстали передо мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Внутренности мои кипят и не знают покоя; дни страдания вышли мне навстречу».'
    reason: Лексика допускает более буквальную передачу מֵעַי как «внутренности», דמם как отсутствие покоя, а קדם — как выход навстречу.
lexical_decisions:
- source_word: מֵעַי
  choice: внутри у меня всё
  rationale: Передаёт внутренности как место телесного и душевного страдания, сохраняя телесный образ без архаичного или чрезмерно анатомического звучания.
- source_word: רֻתְּחוּ
  choice: кипит
  rationale: Глагол רתח обозначает кипение или бурление; «кипит» сохраняет яркую телесную метафору.
- source_word: וְלֹא דָמּוּ
  choice: и не утихает
  rationale: דמם допускает значения «быть неподвижным», «умолкать», «прекращаться»; «не утихает» естественно выражает непрерывность внутреннего мучения, не устраняя многозначность полностью.
- source_word: קִדְּמֻנִי
  choice: встают передо мной
  rationale: Форма от קדם изображает дни бедствия как выходящие навстречу Иову. Выбор сохраняет олицетворение и ощущение противостояния, не усиливая его до прямого нападения.
- source_word: יְמֵי עֹנִי
  choice: дни бедствия
  rationale: В контексте плача עֹנִי обозначает тяжёлое страдание и бедственное состояние, а не только материальную бедность.
