base_translation:
  language: en
  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: ru
  text: Я взываю к тебе, но ты мне не отвечаешь; я стою, а ты лишь пристально смотришь на меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я стоял, а ты пристально смотрел на меня». Еврейские глагольные формы допускают здесь значение прошедшего времени; глагол также может означать внимательное наблюдение или рассмотрение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: я взываю
  rationale: Пиэль глагола שׁוע выражает настойчивый крик о помощи. «Взываю» сохраняет силу отчаянного обращения и уместно в возвышенной, но понятной современной речи.
- source_word: אֵלֶיךָ
  choice: к тебе
  rationale: 'Предлог אֶל с местоименным суффиксом естественно передаёт направленность обращения: «к тебе».'
- source_word: וְלֹא תַעֲנֵנִי
  choice: но ты мне не отвечаешь
  rationale: Глагол ענה в породе каль означает «отвечать, откликаться». Союз «но» естественно передаёт контраст между взыванием Иова и отсутствием ответа.
- source_word: עָמַדְתִּי
  choice: я стою
  rationale: Хотя форма морфологически перфектная, в поэтической жалобе она может описывать нынешнее положение Иова. Настоящее время согласуется с предшествующими глаголами и сохраняет живость речи; прошедшее время отмечено в сноске как возможное прочтение.
- source_word: וַתִּתְבֹּנֶן
  choice: а ты лишь пристально смотришь
  rationale: התבונן может обозначать внимательное разглядывание или рассмотрение. «Пристально смотришь» передаёт оттенок внимательного наблюдения, а «лишь» выявляет контраст с отсутствием ответа, не приписывая Богу прямо ни безразличия, ни отказа помочь.
- source_word: בִּי
  choice: на меня
  rationale: При глаголе зрительного восприятия предлог בְּ здесь естественно передаётся по-русски сочетанием «смотреть на меня».
theological_decisions:
- issue: Следует ли усиливать жалобу Иова, представляя молчание Бога как отказ спасти или намеренное пренебрежение
  choice: Сохранить прямую жалобу на отсутствие ответа и на то, что Бог смотрит на Иова, не добавляя утверждений о Божьих намерениях
  alternative: «Я взываю к тебе о помощи, но ты не спасаешь» или «ты не обращаешь на меня внимания»
  rationale: В еврейском тексте говорится, что Бог не отвечает и смотрит на Иова; причины молчания и смысл этого взгляда не объясняются. Перевод сохраняет напряжение текста, не разрешая его богословски.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная орфографическая практика; обращение при этом остаётся ясным из контекста. Ритм двух противопоставленных частей сохраняет форму личной жалобы.
