lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт временной переход к нынешнему состоянию Иова и сохраняет соединительную силу וְ, не усиливая её до явно противительного «но».
- source_word: עָלַי
  choice: во мне
  rationale: Буквально предлог означает «на мне/на меня», однако в сочетании с «душа изливается» выражение описывает внутреннее истощение. В русском «во мне» естественнее передаёт этот смысл; буквальная пространственная формулировка указана в сноске.
- source_word: תִּשְׁתַּפֵּךְ
  choice: изливается
  rationale: Сохраняет метафору излияния и продолжающийся характер состояния, не заменяя образ более толковательным «изнемогает» или «тает».
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Поэтически передаёт внутреннее «я» и жизненную силу Иова, не сужая значение до одной лишь физической жизни.
- source_word: יֹאחֲזוּנִי
  choice: охватили меня
  rationale: Передаёт силу глагола «схватить, овладеть» и при этом естественно сочетается в русском с олицетворёнными «днями страдания».
- source_word: יְמֵי עֹנִי
  choice: дни страдания
  rationale: עֹנִי здесь обозначает бедствие и мучение в широком смысле, а не только бедность; «страдание» сохраняет широту контекста.
