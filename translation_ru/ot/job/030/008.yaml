  text: בְּֽנֵי נָ֭בָל גַּם בְּנֵ֣י בְלִי שֵׁ֑ם נִ֝כְּא֗וּ מִן הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/008.yaml
  text: Sons of fools[a], indeed sons without a name[c][b], they were scourged from the land.
translation:
  language: ru
  text: Сыновья негодяев, да, сыновья без имени[a], были изгнаны из страны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья без имени». Это еврейское выражение обозначает людей без положения, доброго имени и общественного уважения.'
    reason: cultural_note
  - marker: b
    text: 'Редкий еврейский глагол может также означать: «были избиты» или «были выбиты из страны». В данном контексте наиболее вероятен смысл насильственного изгнания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נָבָל
  choice: сыновья глупцов
  rationale: Сохраняет образную конструкцию оригинала. Слово נָבָל обозначает не просто недостаток ума, а нравственно презренного, безрассудного человека; в данном контексте «глупцов» передаёт эту оценочную силу без излишнего усиления.
- source_word: גַּם
  choice: присоединение приложения без отдельного слова
  rationale: Частица усиливает и присоединяет вторую характеристику. В русском её функция естественно передаётся приложением после запятой; буквальное «также» сделало бы фразу тяжеловесной.
- source_word: בְּנֵי בְלִי שֵׁם
  choice: люди без имени и чести
  rationale: 'Буквально: «сыновья без имени». Это идиома о людях без положения, доброго имени и общественного уважения. «Люди без имени и чести» ясно передаёт её смысл и избегает ошибочного понимания как простой анонимности.'
- source_word: נִכְּאוּ
  choice: были изгнаны
  rationale: Редкий глагол допускает значения насильственного поражения и удаления. Сочетание с מִן и ближайший контекст общественного отвержения поддерживают значение насильственного изгнания.
- source_word: מִן הָאָרֶץ
  choice: из страны
  rationale: אֶרֶץ может означать землю или страну. Здесь речь идёт не о всей земле как мире, а об удалении из обитаемой земли и общества; «из страны» естественно выражает этот смысл.
theological_decisions:
- issue: Характер удаления, выраженный редким глаголом נִכְּאוּ
  choice: были изгнаны
  alternative: были избиты / выбиты
  rationale: Контекст склоняет к изгнанию, но лексическая неопределённость не устраняется молча и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической речи. Еврейская родовая формула сохранена в первой части, а повторная идиома передана понятным русским приложением. Подлинная неопределённость редкого глагола вынесена в сноску.
