  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: ru
  text: 'Ибо я знаю: Ты приведёшь меня к смерти[a] и в дом, назначенный для всякого живущего[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты возвратишь меня к смерти». Глагол буквально может означать «заставить вернуться».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение можно также понять как «в дом, назначенный для всех живущих»; вероятно, это поэтическое обозначение могилы или шеола — места, к которому приходит каждый человек.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующей жалобой Иова естественно для современного русского языка.
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект глагола состояния выражает устойчивое знание и уверенность; настоящее время по-русски звучит естественно.
- source_word: מָוֶת
  choice: смерть
  rationale: Слово прямо обозначает смерть; перевод не конкретизирует её как шеол или могилу.
- source_word: תְּשִׁיבֵנִי
  choice: Ты приведёшь меня
  rationale: Порода hifil глагола שוב буквально допускает смысл «заставишь вернуться», однако в сочетании со смертью русское «приведёшь меня к смерти» ясно передаёт причинно-направительное значение без спорного предположения о предшествующем пребывании в смерти.
- source_word: וּבֵית מוֹעֵד
  choice: в дом, предназначенный
  rationale: Союз связывает вторую формулировку с тем же направлением движения; тире показывает поэтическое пояснение. מוֹעֵד здесь понимается как назначенное место, но его смысловая широта отмечена в сноске.
- source_word: לְכָל חָי
  choice: для всякого живущего
  rationale: Сохраняет еврейскую конструкцию с собирательным единственным числом и универсальный охват.
theological_decisions:
- issue: Образ смерти и назначенного дома
  choice: Смерть представлена как всеобщая участь людей, а «дом» — как поэтическое обозначение предназначенного им места.
  alternative: «Дом» может конкретнее обозначать могилу или шеол либо пониматься как место собрания всех живущих.
  rationale: В еврейском тексте названо מָוֶת («смерть»), но шеол прямо не упомянут; поэтому основной текст сохраняет образ и не вводит более определённое учение о посмертном состоянии.
- issue: Значение причинной формы שוב
  choice: «Ты приведёшь меня к смерти».
  alternative: «Ты возвратишь меня к смерти».
  rationale: Альтернатива точнее отражает обычное причинное значение «заставить вернуться», но основной вариант естественнее по-русски и не создаёт лишнего впечатления, будто Иов уже прежде находился в смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавное «Ты» принято как уважительное обращение к Богу. Двоеточие и тире делают синтаксическую связь ясной, не устраняя образную неоднозначность оригинала.
