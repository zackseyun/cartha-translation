  text: By great force my garment is disfigured[b][a]; like the collar of my tunic it binds me.
translation:
  language: ru
  text: Под действием великой силы моя одежда изменилась[a]; она стягивает меня, словно горловина хитона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моя одежда искажена (обезображена)». Еврейский глагол труден для понимания; возможен также разбор: «он хватает (сминает) мою одежду».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как уста (отверстие) моего хитона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב כֹּחַ
  choice: От великой силы
  rationale: Предлог בְּ с сочетанием «великая сила» передаёт причину или действующую силу. Формулировка естественна по-русски и сохраняет неясность относительно того, чья именно это сила.
- source_word: יִתְחַפֵּשׂ
  choice: обезображена
  rationale: Редкая и трудная форма допускает значения изменения, искажения или переодевания. В контексте телесного страдания и образа тесной одежды «обезображена» передаёт вероятный результат, не скрывая альтернатив в примечании.
- source_word: לְבוּשִׁי
  choice: одежда моя
  rationale: Существительное обозначает одежду или одеяние вообще; единственное число сохранено, а инверсия поддерживает возвышенный поэтический строй.
- source_word: כְּפִי
  choice: словно ворот
  rationale: Буквально «как уста/отверстие». Применительно к хитону речь, вероятнее всего, о горловине или вороте; «ворот» краток, понятен и сохраняет образ детали одежды.
- source_word: כֻתָּנְתִּי
  choice: хитона
  rationale: כֻּתֹּנֶת — нательная или длинная рубаха туникообразного покроя. «Хитон» является привычным библейским соответствием и уместен в литературном русском.
- source_word: יַאַזְרֵנִי
  choice: она стягивает меня
  rationale: Глагол אזר означает опоясывать, охватывать. В данном образе «стягивает» ясно выражает тесное, мучительное охватывание и согласуется с «одежда».
theological_decisions:
- issue: Кому принадлежит «великая сила» и каков подразумеваемый субъект действия
  choice: 'Субъект прямо не назван: «От великой силы одежда моя обезображена»'
  alternative: «С великой силой Он хватает мою одежду»
  rationale: Масоретский текст допускает разбор с одеждой как субъектом глагола, тогда как контекст иногда побуждает видеть подразумеваемое действие Бога или болезни. Перевод не вводит прямо названного деятеля и сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим порядком слов. «Ворот хитона» делает образ понятным без архаичного «опоясывает»; трудность первой строки и возможная смена синтаксического разбора отмечены в сноске.
