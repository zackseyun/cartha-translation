  text: הֹרָ֥/נִי לַ/חֹ֑מֶר וָ֝/אֶתְמַשֵּׁ֗ל כֶּ/עָפָ֥ר וָ/אֵֽפֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: ru
  text: Он бросил меня в грязь, и я стал подобен праху и пеплу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меня уподобили праху и пеплу»; еврейская форма допускает пассивный оттенок.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: Он бросил меня
  rationale: 'Форма глагола с суффиксом 1-го лица передаёт резкое действие: «бросил/поверг меня». Подлежащее мужского рода единственного числа восстановлено как «Он»; в контексте речи Иова имеется в виду Бог.'
- source_word: לַחֹמֶר
  choice: в грязь
  rationale: חֹמֶר может означать глину, грязь или топь. Здесь «грязь» естественно по-русски передаёт образ унижения, не сужая значение до материала горшечника.
- source_word: וָאֶתְמַשֵּׁל
  choice: я стал подобен
  rationale: Глагольная форма допускает оттенки «стал подобен» и «был уподоблен». Выбранное выражение естественно передаёт наступившее состояние, а примечание сохраняет пассивную возможность.
- source_word: כֶּעָפָר וָאֵפֶר
  choice: праху и пеплу
  rationale: Устойчивая и понятная русская пара сохраняет сравнение, образ смертности и унижения, а также библейские переклички.
theological_decisions:
- issue: Неявное подлежащее глагола הֹרָנִי
  choice: «Он», то есть Бог по контексту
  alternative: Безличная конструкция или опущенное подлежащее
  rationale: Форма имеет подлежащее 3-го лица мужского рода единственного числа, а ближайший контекст указывает на Бога; местоимение не добавляет отдельного вероучительного утверждения.
- issue: Залог и оттенок וָאֶתְמַשֵּׁל
  choice: «я стал подобен»
  alternative: «меня уподобили» / «я был уподоблен»
  rationale: Еврейская форма позволяет результативно-рефлексивное либо пассивное понимание. Основной текст выбран ради естественности, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи Иова. «Прах и пепел» сохраняет традиционную библейскую образность; «грязь» остаётся понятной и конкретной без архаизации.
