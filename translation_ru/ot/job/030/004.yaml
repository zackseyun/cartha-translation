lexical_decisions:
- source_word: הַקֹּטְפִים
  choice: которые срывают
  rationale: Причастие от קטף обозначает срывание или ощипывание растений; относительная конструкция естественно продолжает описание из предыдущего стиха.
- source_word: מַלּוּחַ
  choice: солянку
  rationale: Редкое название растения, вероятно солеустойчивой дикорастущей травы. «Солянка» передаёт наиболее вероятный ботанический смысл, а неопределённость отмечена в сноске.
- source_word: עֲלֵי שִׂיחַ
  choice: среди кустов
  rationale: Предлог על здесь, вероятно, выражает местонахождение возле или среди кустарниковой растительности; выбран естественный русский оборот.
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: и корень дрока
  rationale: רתמים обозначает пустынный кустарник из группы дроковых (ретаму). Краткое «дрок» понятно по-русски и сохраняет образ корня пустынного кустарника.
- source_word: לַחְמָם
  choice: служит им пищей
  rationale: לחם буквально означает «хлеб», но также употребляется в широком значении пропитания или пищи; в данном контексте речь идёт о средстве выживания.
