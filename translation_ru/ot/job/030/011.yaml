source:
  edition: WLC
  text: כִּֽי יתר/ו פִ֭תַּח וַ/יְעַנֵּ֑/נִי וְ֝/רֶ֗סֶן מִ/פָּנַ֥/י שִׁלֵּֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/011.yaml
  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: ru
  text: Потому что он ослабил свою тетиву[a] и подверг меня страданию, они отбросили всякую сдержанность передо мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свой шнур». По иному масоретскому чтению: «мою тетиву» (или «мой шнур»).'
    reason: Лексема может обозначать тетиву или шнур; кроме того, традиция чтения содержит вариант местоименного суффикса.
  - marker: b
    text: 'Буквально: «они отослали узду от моего лица», то есть перестали сдерживаться в моём присутствии.'
    reason: Сноска сохраняет исходный образ узды, тогда как основной текст передаёт смысл еврейской идиомы.
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит причину враждебного и бесстыдного поведения, описанного в контексте.
- source_word: יתר/ו
  choice: свою тетиву
  rationale: Основной текст передаёт образ тетивы и местоименный суффикс третьего лица; возвратное «свою» естественно по-русски при том же подразумеваемом деятеле. Более общее значение «шнур» и вариант чтения с первым лицом отмечены в сноске.
- source_word: פִתַּח
  choice: ослабил
  rationale: С тетивой глагол означает ослабить или отпустить её; буквальное «открыл» здесь неестественно.
- source_word: וַיְעַנֵּנִי
  choice: и подверг меня страданию
  rationale: Форма относится к ענה II — «мучить, причинять страдание, унижать», а не к омониму со значением «отвечать». Формулировка сохраняет широту между физическим страданием и унижением.
- source_word: וְרֶסֶן
  choice: всякую сдержанность
  rationale: Буквально это «узда»; в сочетании с глаголом выражение образно означает отказ от сдержанности. Сам образ сохранён в сноске.
- source_word: מִפָּנַי
  choice: передо мной
  rationale: Передаёт значение «в моём присутствии» и направленность бесстыдного поведения против Иова.
- source_word: שִׁלֵּחוּ
  choice: отбросили
  rationale: В сочетании с образом узды глагол означает отпустить или сбросить ограничение; «отбросили всякую сдержанность» естественно передаёт идиому.
theological_decisions:
- issue: Личность деятеля в первой части стиха
  choice: Местоимение «он» оставлено со строчной буквы без явного наименования деятеля.
  alternative: «Бог ослабил…» или «Он ослабил…» с подразумеваемым Богом.
  rationale: В еврейском тексте подлежащее при глаголе прямо не названо. Контекст допускает отнесение действия к Богу, но перевод не должен устранять эту формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической образности. Синтаксический переход от единственного числа «он» к множественному «они» сохранён. Неуказанный деятель не отождествлён с Богом прямо; архаизмы и конфессионально окрашенные формулы исключены.
