  terminology: «Тетива» — допустимое конкретное значение יֶתֶר в данном контексте, а «шнур» разумно сохранён как альтернатива. «Сдержанность» удачно передаёт образное значение רֶסֶן, при этом «узда» приведена в сноске. Суффикс и смена числа («он» / «они») сохранены.
