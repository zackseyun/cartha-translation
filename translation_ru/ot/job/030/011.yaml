  source_fidelity: Текст точно передаёт причинный союз כִּי, образ ослабленной тетивы/шнура, значение וַיְעַנֵּנִי как причинения страдания и переход к множественному субъекту во второй части. Неопределённый деятель «он» не отождествлён с Богом без прямого основания в самом стихе. Сноска a корректно отражает лексическую альтернативу и различие кетив/кере в местоименном суффиксе; сноска b сохраняет буквальный образ узды.
