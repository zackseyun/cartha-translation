lexical_decisions:
- source_word: אִם לֹא
  choice: Разве я не…?
  rationale: В данном контексте оборот вводит риторический вопрос, подчёркивающий самооправдание Иова, а не обычное условие.
- source_word: בָכִיתִי
  choice: плакал
  rationale: Глагол прямо обозначает плач; выбранное слово естественно для современного русского языка и сохраняет эмоциональную силу стиха.
- source_word: לִקְשֵׁה יוֹם
  choice: о том, у кого настал тяжёлый день
  rationale: Фраза буквально говорит о «тяжёлом днём» и, вероятно, обозначает человека, переживающего бедствие. Перевод сохраняет образ тяжёлого дня, оставаясь понятным по-русски.
- source_word: עָגְמָה
  choice: скорбела
  rationale: Форма передаёт печаль и внутреннюю боль; «скорбела» соответствует поэтическому регистру и параллели с плачем.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохраняет древнееврейское поэтическое обозначение внутреннего «я», не сводя его к техническому антропологическому термину.
- source_word: לָאֶבְיוֹן
  choice: о бедном
  rationale: אֶבְיוֹן обозначает бедного или нуждающегося; «бедный» кратко и естественно передаёт собирательный смысл единственного числа.
theological_decisions:
- issue: Антропологический смысл נַפְשִׁי
  choice: «душа моя» как поэтическое обозначение внутреннего существа Иова
  alternative: «я скорбел» / «всё моё существо скорбело»
  rationale: Буквальная поэтическая формулировка сохраняет образность источника, но сама по себе не утверждает специального учения о составе человека.
- issue: Направленность сострадания в לִקְשֵׁה יוֹם
  choice: сострадание человеку, переживающему тяжёлый день
  alternative: «о человеке в день бедствия» / «о том, кому было тяжело»
  rationale: Еврейская конструкция необычна и допускает несколько близких истолкований; основной текст сохраняет образ «тяжёлого дня», а сноска отмечает варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Параллелизм двух риторических вопросов сохранён; инверсия «душа моя» поддерживает библейскую поэтичность без архаизации.
