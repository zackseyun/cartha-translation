  text: You have turned cruel to me[b][a]; with the might of your hand you oppose me.
translation:
  language: ru
  text: Ты стал жесток ко мне[a]; силой руки Твоей Ты преследуешь меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты стал безжалостен ко мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты враждуешь со мной»; или: «Ты нападаешь на меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: стал
  rationale: Нифаль глагола הפך выражает перемену состояния. «Стал» естественно передаёт эту перемену, не добавляя излишней возвратности.
- source_word: לְאַכְזָר
  choice: жесток
  rationale: אַכְזָר обозначает жестокость, безжалостность. Предикативное «жесток» точно и естественно сочетается с «стал».
- source_word: לִי
  choice: ко мне
  rationale: Предлог לְ указывает здесь на направленность отношения к Иову; «ко мне» сохраняет конструкцию и не усиливает её до «против меня».
- source_word: בְּעֹצֶם
  choice: силой
  rationale: עֹצֶם передаёт силу или мощь, а בְּ имеет инструментальное значение. «Силой» кратко и ясно сохраняет смысл.
- source_word: יָדְךָ
  choice: руки Твоей
  rationale: Сохранён конкретный образ руки, а не заменён отвлечённым словом «власть» или «могущество».
- source_word: תִשְׂטְמֵנִי
  choice: Ты преследуешь меня
  rationale: Глагол שׂטם выражает враждебность и может обозначать преследование или нападение. «Преследуешь» передаёт активное враждебное действие, сохраняя возможные альтернативы в примечании.
theological_decisions:
- issue: Антропоморфное описание Божьего действия
  choice: Сохранено прямое обращение к Богу и конкретный образ «руки Твоей».
  alternative: 'Смягчить обвинение, например: «Твоя сила обратилась против меня».'
  rationale: Речь Иова намеренно резка и сохраняет напряжение его жалобы Богу; перевод не должен ослаблять это обвинение или устранять антропоморфный образ.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической жалобы. Прямое обвинение и параллелизм двух частей сохранены; местоимения, обращённые к Богу, оформлены с прописной буквы в соответствии с принятой русской библейской традицией.
