lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт резкий переход от прежнего почёта Иова к нынешнему унижению; в русском контексте союз «а» естественно выражает контраст.
- source_word: שָׂחֲקוּ עָלַי
  choice: смеются надо мной
  rationale: Сохраняет конкретный образ смеха, направленного против Иова, и естественно выражает насмешку.
- source_word: צְעִירִים מִמֶּנִּי לְיָמִים
  choice: те, кто моложе меня
  rationale: Естественно передаёт еврейское выражение о меньшем возрасте; буквальное «моложе днями» по-русски звучало бы неестественно.
- source_word: אֲשֶׁר מָאַסְתִּי
  choice: те, чьих отцов я погнушался бы
  rationale: 'Глагол מָאַס выражает презрение или решительное отвержение. Условная форма по-русски естественно передаёт смысл: Иов считал их недостойными даже такого назначения.'
- source_word: לָשִׁית
  choice: поставить
  rationale: Прямо передаёт значение «поместить, поставить, назначить» и сочетается с последующим «рядом с».
- source_word: עִם כַּלְבֵי צֹאנִי
  choice: рядом с псами моего стада
  rationale: Сохраняет более широкую и резкую буквальную формулировку оригинала, не сводя её безусловно к специальному термину «овчарки».
