  source_fidelity: 'Смысл в целом передан точно: резкий контраст «а теперь», насмешки более молодых людей и уничижительное сопоставление их отцов с собаками при стаде сохранены. Однако «погнушался бы» усиливает эмоциональную окраску и не столь прямо передаёт конструкцию «отказался/не захотел поставить»; более нейтральное «не захотел бы поставить» ближе к исходному смыслу и сохраняет естественную для русского риторическую условность.'
