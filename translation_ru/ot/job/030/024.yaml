  yaml_path: translation/ot/job/030/024.yaml
  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: ru
  text: Но никто не простирает руки против развалин[a], если в его бедствии раздаётся крик о помощи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но никто не простирает руки к груде развалин, если при гибели раздаётся крик о помощи». Еврейский текст этого стиха труден, особенно слово, переданное как «развалины», и форма, которая может означать «им», «для них» или «от них».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Но разве
  rationale: Частица вводит напряжённое возражение Иова; в сочетании с отрицанием естественный русский риторический вопрос передаёт утверждение, не превращая אַךְ в ограничительное «только».
- source_word: בְּעִי
  choice: против развалин
  rationale: Редкое и трудное слово, вероятно обозначающее развалины или груду развалин. Предлог בְּ при выражении «протягивать руку» допускает направленность враждебного действия; множественное «развалины» естественно по-русски и сохраняет образ.
- source_word: יִשְׁלַח יָד
  choice: протягивают руку
  rationale: Сохранён телесный образ еврейской идиомы без уточняющего «нападают», поскольку характер действия остаётся контекстуальным.
- source_word: אִם
  choice: если
  rationale: Условное значение частицы сохраняет трудную связь между двумя частями стиха и не устраняет неоднозначность синтаксиса.
- source_word: בְּפִידוֹ
  choice: среди бедствия
  rationale: פיד означает бедствие, гибель или катастрофу; «среди бедствия» передаёт обстоятельство, не фиксируя спорного носителя местоименного суффикса в русском тексте.
- source_word: לָהֶן
  choice: не выражено отдельно
  rationale: Форма синтаксически неясна и может пониматься как «им/для них», «от них» либо соотноситься с ситуацией бедствия. В основном тексте её не следует конкретизировать без достаточной опоры; трудность отмечена в сноске.
- source_word: שׁוּעַ
  choice: крик о помощи
  rationale: Слово обозначает вопль или зов бедствующего, обращённый за помощью; явное «о помощи» естественно передаёт эту семантику.
theological_decisions:
- issue: Связь двух частей стиха и предмет рассуждения Иова
  choice: Сохранён общий риторический вопрос о руке, направленной против уже разрушенного, когда звучит зов о помощи.
  alternative: Понять первую часть как протягивание руки к груде развалин, а вторую — как отдельное утверждение о крике при гибели.
  rationale: Еврейский стих чрезвычайно труден; выбранное чтение соответствует вероятному ходу мысли, но альтернативная конструкция вынесена в сноску, чтобы не создавать ложной определённости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторическая форма делает фразу естественной, а сноска сохраняет существенную текстовую и синтаксическую неопределённость.
