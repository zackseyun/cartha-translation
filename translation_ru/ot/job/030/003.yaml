  yaml_path: translation/ot/job/030/003.yaml
  text: Through want and hunger they are gaunt[b][a], gnawing the dry ground in the night of desolation and waste.
translation:
  language: ru
  text: Изнурены нуждой и голодом[a], скребут сухую землю ночью[b], среди разорения и запустения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В нужде и голоде, изнурённые, они скребут сухую землю…» Несколько слов в этом стихе редки и трудны для понимания. В частности, слово, переведённое как «скребут», также понимают как «бегущие к» или «ищущие убежища в» сухой земле.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово אֶמֶשׁ обычно означает «вчера» или «прошлой ночью»; здесь поэтический контекст позволяет понять его шире — как указание на ночное время.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחֶסֶר וּבְכָפָן
  choice: От нужды и голода
  rationale: Предлог בְ обозначает здесь состояние или причину бедствия; «нужда» и «голод» естественно передают личные лишения, сохраняя парность еврейского выражения.
- source_word: גַּלְמוּד
  choice: иссохли
  rationale: Редкое слово допускает значения, связанные с иссушенностью, бесплодием или одиночеством. В данном контексте «иссохли» естественно описывает истощение от нужды и голода, не делая смысл чрезмерно конкретным.
- source_word: הָעֹרְקִים
  choice: скребут
  rationale: Форма и значение слова в этом месте неясны. Поэтический контекст поиска пищи в пустынной местности поддерживает образ людей, скребущих сухую землю; этот вариант осторожнее, чем более выразительное «гложут».
- source_word: צִיָּה
  choice: сухую землю
  rationale: Слово обозначает сухую, выжженную землю или засушливую местность. Конкретное «сухую землю» хорошо сочетается с глаголом «скребут».
- source_word: אֶמֶשׁ
  choice: ночью
  rationale: Обычно слово означает «вчера» или «прошлой ночью», но в данном трудном поэтическом контексте может указывать на ночное время; неоднозначность отмечена в сноске.
- source_word: שׁוֹאָה וּמְשֹׁאָה
  choice: среди разорения и запустения
  rationale: Созвучная пара усиливает картину опустошённого места. Русская пара сохраняет смысловое нарастание и мрачный поэтический тон.
