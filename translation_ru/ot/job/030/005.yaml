    reason: lexical_alternative
lexical_decisions:
- source_word: מִן־גֵּו
  choice: из ущелья
  rationale: Гֵּו может обозначать углубление, теснину или ущелье; в контексте Иов 30 географическое значение естественнее отвлечённого «из среды».
- source_word: יְגֹרָשׁוּ
  choice: их изгоняют
  rationale: Форма передаёт насильственное удаление; русская неопределённо-личная конструкция естественно сохраняет неуказанного деятеля.
- source_word: יָרִיעוּ
  choice: кричат
  rationale: Глагол означает поднимать крик; субъект в еврейском тексте прямо не назван, что сохраняется русской неопределённо-личной формой.
- source_word: עָלֵימוֹ
  choice: вслед им
  rationale: Предлог при глаголе крика выражает направленность враждебного возгласа; «вслед им» согласуется с образом изгнания и погони.
- source_word: כַּגַּנָּב
  choice: как вслед вору
  rationale: Сравнение подразумевает крик, поднимаемый вслед вору; добавление повторного «вслед» делает эллипсис понятным по-русски, не меняя образа.
