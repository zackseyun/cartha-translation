lexical_decisions:
- source_word: לַיְלָה
  choice: Ночью
  rationale: Наречное обозначение времени; естественно и точно передаёт «в ночное время».
- source_word: עֲצָמַי
  choice: мои кости
  rationale: Сохраняет конкретный телесный образ еврейского текста.
- source_word: נִקַּר מֵעָלָי
  choice: пронзает боль
  rationale: Глагол נקר означает «пронзать, просверливать». Еврейское сочетание с מֵעָלָי трудно для истолкования; добавление «боль» позволяет естественно передать внутреннее мучение, не устраняя образ пронзания.
- source_word: וְעֹרְקַי
  choice: и жилы мои
  rationale: Редкое слово עֹרֶק, вероятно, обозначает телесные жилы, сосуды или сухожилия. Конкретное «жилы» предпочтительнее контекстуальной замены на «боли», а неопределённость отмечена в сноске.
- source_word: לֹא יִשְׁכָּבוּן
  choice: не знают покоя
  rationale: Буквально «не ложатся». Русское выражение сохраняет олицетворение и передаёт непрекращающееся страдание естественнее, чем буквальное «не ложатся».
