  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
translation:
  language: ru
  text: Кожа моя почернела и сходит с меня[a], кости мои горят от жара[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кожа моя почернела на мне». Еврейское выражение может описывать как почерневшую, отслаивающуюся кожу, так и почерневшую кожу, остающуюся на теле.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «кости мои горят от лихорадки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: кожа моя
  rationale: עוֹר в отношении человека естественно передаётся как «кожа»; порядок слов сохраняет возвышенный поэтический тон.
- source_word: שָׁחַר
  choice: почернела
  rationale: Глагол здесь обозначает потемнение или почернение кожи; совершенный вид естественно выражает наступившее состояние.
- source_word: מֵעָלָי
  choice: сходит с меня
  rationale: Буквально «с меня / с поверхности меня». В контексте поражённой кожи выражение, вероятно, описывает её отслаивание, однако неоднозначность отмечена в сноске.
- source_word: וְעַצְמִי
  choice: кости мои
  rationale: Форма единственного числа может иметь собирательное значение; русское множественное число естественно в описании всего тела.
- source_word: חָרָה
  choice: горят
  rationale: Сохраняется яркий образ горения или пылания, не сводимый однозначно к медицинскому диагнозу.
- source_word: מִנִּי חֹרֶב
  choice: от жара
  rationale: Предлог указывает на причину, а חֹרֶב — на жар или иссушающий зной; «от жара» кратко и естественно передаёт сочетание.
