  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: ru
  text: Ты поднимаешь меня на ветер[a], заставляешь нестись на нём и растворяешь меня в буре[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты уносишь меня ветром».'
    reason: lexical_alternative
  - marker: b
    text: 'Последнее еврейское слово трудно для истолкования. Его связывают с бурей, грохочущим разгулом стихии или гибелью; всю концовку можно также передать: «и растворяешь меня в гибели».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: Ты поднимаешь меня
  rationale: Форма от נשׂא допускает значения «поднимать» и «уносить»; «поднимаешь» сохраняет конкретный образ и прямое обращение Иова к Богу.
- source_word: אֶל רוּחַ
  choice: на ветер
  rationale: רוּחַ может означать «ветер», «дыхание» или «дух», но здесь образ движения и разрушения указывает на ветер. Предлог אֶל буквально задаёт направление; по-русски «поднимать на ветер» естественно связывается со следующим образом несущего ветра.
- source_word: תַּרְכִּיבֵנִי
  choice: заставляешь нестись на нём
  rationale: Каузативная форма от רכב означает «заставить ехать/нестись верхом». Местоимение «на нём» явно отсылает к ветру и восполняет подразумеваемую в еврейском образе опору.
- source_word: וּתְמֹגְגֵנִי
  choice: развеиваешь меня
  rationale: Глагол מוג обычно выражает таяние, растворение или утрату устойчивости. В сочетании с ветром и бурей «развеиваешь» естественно передаёт образ распада, не сводя его просто к физическому бросанию из стороны в сторону.
- source_word: תשוה
  choice: бурей
  rationale: Конечное слово текстологически и лексически трудно. Контекст допускает бурю, грохочущий разгул стихии либо гибель; инструментальное «бурей» создаёт связную русскую строку, а неопределённость отмечена в сноске.
theological_decisions:
- issue: Божественное действие как причина страдания Иова
  choice: 'Сохранено прямое обращение во втором лице: «Ты…»'
  alternative: Безличная передача происходящего как действия стихии
  rationale: Еврейский текст прямо приписывает действия адресату, то есть Богу в контексте речи Иова; смягчать это богословское напряжение не следует.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой поэтической фразой. Сохранены прямое обращение на «Ты», образ езды на ветре и намеренная неопределённость трудной концовки.
