lexical_decisions:
- source_word: וַיְהִי
  choice: И стала
  rationale: Форма от היה с последовательным ו описывает наступившую перемену состояния; «стала» естественно передаёт её в русском повествовании.
- source_word: לְאֵבֶל
  choice: плачем
  rationale: אֵבֶל обозначает скорбь, траур и их внешнее выражение. В данном поэтическом контексте «плачем» сохраняет образ превращения музыки в выражение горя.
- source_word: כִּנֹּרִי
  choice: моя лира
  rationale: כִּנּוֹר — древний струнный щипковый инструмент. «Лира» достаточно конкретна и не вызывает образа современной большой арфы, хотя точное устройство инструмента неизвестно.
- source_word: וְעֻגָבִי
  choice: а свирель моя
  rationale: עוּגָב обозначает духовой инструмент не вполне установленного вида. «Свирель» сохраняет общий древний поэтический образ, не отождествляя инструмент с современной поперечной флейтой.
- source_word: לְקוֹל
  choice: голосом
  rationale: קוֹל может означать как «голос», так и «звук». При личном причастии «плачущих» слово «голосом» естественно передаёт человеческое звучание, не устраняя связи с музыкальным инструментом.
- source_word: בֹּכִים
  choice: плачущих
  rationale: Причастие множественного числа обозначает людей, которые плачут; субстантивированное «плачущих» кратко и точно сохраняет личную отнесённость.
