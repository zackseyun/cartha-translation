  yaml_path: translation/ot/job/030/031.yaml
  text: So my lyre has become mourning[b][a], and my pipe the sound of those who weep.
translation:
  language: ru
  text: И стала моя лира[a] скорбью, а моя свирель[b] — голосом плачущих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «арфа». Еврейское כִּנּוֹר обозначает древний струнный инструмент, похожий на лиру или арфу.'
