  yaml_path: translation/ot/job/030/028.yaml
  text: I go about darkened[a], but not by the sun[b]; I stand up in the assembly and cry for help.
translation:
  language: ru
  text: Я хожу почерневший[a] — но не от солнца[b]; в собрании встаю и взываю о помощи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скорбящий», «помрачневший». Еврейское слово может указывать и на скорбь, и на потемневший или почерневший облик.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не от солнца». То есть почерневший вид Иова вызван не воздействием солнца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֵר
  choice: почерневший
  rationale: Причастие от קדר может обозначать потемневший или почерневший вид, а также состояние скорби. «Почерневший» сохраняет телесно-зрительный образ и допускает связь с горем, не сводя слово только к эмоции.
- source_word: הִלַּכְתִּי
  choice: хожу я
  rationale: В поэтической жалобе перфект описывает продолжающееся состояние и образ жизни Иова; настоящее время естественно передаёт живость его речи.
- source_word: בְּלֹא חַמָּה
  choice: но не от солнца
  rationale: Буквально сочетание означает «не от солнца» или «без солнца». В контексте оно противопоставляет почерневшее состояние Иова обычному потемнению от солнца, не уточняя сверх текста, идёт ли речь о свете или жаре.
- source_word: קַמְתִּי
  choice: встаю
  rationale: Глагол קום обозначает вставание перед собранием для публичного возгласа; настоящее время согласуется с живым стилем жалобы.
- source_word: בַקָּהָל
  choice: среди собравшихся
  rationale: קהל — собравшаяся община или собрание. Формулировка «среди собравшихся» естественна по-русски и не привносит позднейших церковных ассоциаций.
- source_word: אֲשַׁוֵּעַ
  choice: взываю о помощи
  rationale: שוע в интенсивной породе выражает отчаянный зов о помощи. «Взываю о помощи» передаёт и громкость, и направленность призыва.
