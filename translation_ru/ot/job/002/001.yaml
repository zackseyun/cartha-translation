  yaml_path: translation/ot/job/002/001.yaml
  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: ru
  text: И снова настал день, когда сыны Божьи[a] пришли предстать перед Яхве, и противник[b] тоже пришёл вместе с ними, чтобы предстать перед Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Бога». Возможно, речь идёт о небесных существах или членах небесного совета.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Сатана»; еврейское слово употреблено с определённым артиклем — «противник» — и, вероятно, обозначает здесь роль: противника или обвинителя.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: И снова настал день
  rationale: Формула повторяет сцену из Иов 1:6. «Снова» естественно передаёт повествовательное возвращение к той же ситуации, а «настал день» сохраняет еврейский временной оборот без излишне буквального «и был день».
- source_word: בְּנֵי הָאֱלֹהִים
  choice: сыны Божьи
  rationale: Формально прозрачный перевод сохраняет еврейский образ и не подменяет его толкованием вроде «небесные существа» или «члены небесного совета».
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: предстать перед Яхве
  rationale: Форма глагола יצב в этой обстановке обозначает явку и занятие места перед высшим лицом. «Предстать перед» естественно по-русски передаёт официальный, придворный оттенок выражения; одинаковый перевод обоих вхождений сохраняет параллелизм стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул «Господь».
- source_word: הַשָּׂטָן
  choice: противник
  rationale: Наличие определённого артикля указывает здесь прежде всего на роль или титул. «Противник» передаёт основное значение שׂטן и не превращает обозначение роли в однозначное собственное имя.
- source_word: בְּתוֹכָם
  choice: среди них
  rationale: Естественный современный русский эквивалент, сохраняющий смысл присутствия внутри собравшейся группы.
theological_decisions:
- issue: Следует ли понимать הַשָּׂטָן как собственное имя или как обозначение роли
  choice: противник
  alternative: Сатана; обвинитель
  rationale: Еврейское слово употреблено с определённым артиклем, поэтому в данном контексте естественнее видеть в нём обозначение роли — «противник». В сноске сохранена возможность традиционного понимания «Сатана» и контекстуального значения «обвинитель».
- issue: Кого обозначает выражение בְּנֵי הָאֱלֹהִים
  choice: сыны Божьи
  alternative: небесные существа; члены небесного совета
  rationale: Сам текст использует образное родственное выражение и не разъясняет его прямо. Буквально прозрачный перевод сохраняет эту неоднозначность, а основные варианты понимания вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Оборот «сыны Божьи» намеренно сохраняет образность оригинала; «предстать перед» передаёт официальный характер небесного собрания. Строчная буква в слове «противник» подчёркивает обозначение роли, а не бесспорное собственное имя.
