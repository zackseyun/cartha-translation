source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל הַ/שָּׂטָ֗ן הֲ/שַׂ֣מְתָּ לִבְּ/ךָ֮ אֶל עַבְדִּ֣/י אִיּוֹב֒ כִּי֩ אֵ֨ין כָּמֹ֜/הוּ בָּ/אָ֗רֶץ אִ֣ישׁ תָּ֧ם וְ/יָשָׁ֛ר יְרֵ֥א אֱלֹהִ֖ים וְ/סָ֣ר מֵ/רָ֑ע וְ/עֹדֶ֨/נּוּ֙ מַחֲזִ֣יק בְּ/תֻמָּת֔/וֹ וַ/תְּסִיתֵ֥/נִי ב֖/וֹ לְ/בַלְּע֥/וֹ חִנָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: ru
  text: 'И сказал Яхве обвинителю[a]: «Обратил ли ты внимание на раба Моего Иова? Нет подобного ему на земле: он человек непорочный и праведный, боящийся Бога и удаляющийся от зла. Он и теперь твёрдо держится своей непорочности, хотя ты подстрекал Меня против него, чтобы погубить его без причины[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. הַשָּׂטָן — «обвинитель» или «противник»; традиционно: «Сатана».'
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение можно также перевести «даром» или «ни за что». Здесь оно перекликается с Иов 1:9, где обвинитель спрашивает, даром ли Иов боится Бога. Глагол «погубить» буквально означает «поглотить».
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הַשָּׂטָן
  choice: обвинитель
  rationale: Артикль указывает здесь прежде всего на роль или титул; русское «обвинитель» сохраняет судебно-противоборствующий оттенок, не превращая обозначение безоговорочно в имя собственное.
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: обратил ли ты внимание на
  rationale: Естественно передаёт смысл буквального оборота «положил ли ты сердце к», не создавая в русском ложного оттенка желания обладать кем-либо.
- source_word: עַבְדִּי
  choice: раба Моего
  rationale: Традиционно-достоинная русская формула ясно выражает принадлежность и служение Богу; порядок слов согласуется с возвышенным повествовательным регистром.
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: нет подобного ему на земле
  rationale: Сохраняет широкую, вероятно всеземную перспективу сцены и звучит естественно по-русски.
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: человек непорочный и праведный
  rationale: «Непорочный» обозначает цельность и безупречность, не обязательно абсолютную безгрешность; «праведный» здесь естественно передаёт нравственную прямоту יָשָׁר.
- source_word: יְרֵא אֱלֹהִים
  choice: боящийся Бога
  rationale: Сохраняет словесную форму и богословски значимый смысл благоговейного страха перед Богом.
- source_word: וְסָר מֵרָע
  choice: удаляющийся от зла
  rationale: Передаёт устойчивое отвращение от зла и образ движения прочь от него.
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: он и теперь твёрдо держится своей непорочности
  rationale: «И теперь» выражает продолжающееся состояние, а «твёрдо держится» — усиленное значение מחזיק; «непорочность» сохраняет связь с תָּם.
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: хотя ты подстрекал Меня против него
  rationale: Контекстуальное «хотя» делает явной уступительную связь, а «подстрекал Меня против него» сохраняет прямую и напряжённую формулировку еврейского текста.
- source_word: לְבַלְּעוֹ
  choice: чтобы погубить его
  rationale: В данном контексте метафорическое «поглотить» означает разорить или погубить; основной текст передаёт результат естественным современным русским выражением.
- source_word: חִנָּם
  choice: без причины
  rationale: Передаёт значение незаслуженности и отсутствия основания; сохраняет смысловую связь с вопросом обвинителя в Иов 1:9, где слово допускает иной контекстуальный оттенок.
theological_decisions:
- issue: Участие Яхве в страдании Иова
  choice: «ты подстрекал Меня против него, чтобы погубить его»
  alternative: «ты побудил Меня допустить причинение ему вреда»
  rationale: Прямое выражение божественного участия не смягчается добавлением идеи простого дозволения; тем самым сохраняется напряжение самого повествования.
- issue: Идентификация הַשָּׂטָן
  choice: «обвинитель» как обозначение роли
  alternative: «Сатана» как имя собственное
  rationale: Определённый артикль и контекст небесного совета поддерживают функциональный титул; перевод не навязывает тексту более позднюю идентификацию.
- issue: Характеристика Иова как תָּם
  choice: «непорочный»
  alternative: «безгрешный»
  rationale: Текст утверждает нравственную цельность и безупречность Иова, но не требует истолковывать это как метафизическую или абсолютную безгрешность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятую русскую религиозно-литературную норму.
