  rationale: Дательный компонент выражен явно и естественно по-русски, подчёркивая, что Иов взял черепок для собственного употребления.
- source_word: חֶרֶשׂ
  choice: черепок
  rationale: Слово обозначает обломок глиняного сосуда; «черепок» — точный, краткий и понятный русский эквивалент.
- source_word: לְהִתְגָּרֵד
  choice: чтобы скрести себя
