source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: ru
  text: 'Тогда Противник[a] ответил Яхве: «Кожа за кожу![b] Человек отдаст всё, что у него есть, за свою жизнь[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «Сатана», «обвинитель». В еврейском тексте слово употреблено с определённым артиклем и имеет характер обозначения роли: «противник».'
    reason: alternative_reading
  - marker: b
    text: «Кожа за кожу» — краткое пословичное выражение с не вполне ясным точным смыслом; вероятно, речь о готовности пожертвовать одним ради сохранения собственной жизни.
    reason: cultural_note
  - marker: c
    text: Или «за самого себя»; еврейское слово может означать также «душу», но здесь по контексту имеется в виду жизнь.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: Противник
  rationale: Определённый артикль указывает здесь прежде всего на обозначение роли, а не на бесспорное употребление личного имени. «Противник» сохраняет эту особенность еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, стоящее в еврейском тексте, не заменяя его титулом «Господь».
- source_word: עוֹר בְּעַד עוֹר
  choice: Кожа за кожу
  rationale: Сохраняет краткую, пословичную и намеренно неоднозначную форму еврейского выражения; пояснение вероятного смысла вынесено в сноску.
- source_word: בְּעַד
  choice: за
  rationale: В обоих случаях предлог выражает обмен или отдачу одного ради сохранения другого; русское «за» кратко передаёт этот смысл.
- source_word: אִישׁ
  choice: человек
  rationale: В пословичном обобщении существительное обозначает любого человека; русский родовой термин звучит естественно и точно.
- source_word: נַפְשׁוֹ
  choice: свою жизнь
  rationale: В данном контексте נֶפֶשׁ означает жизнь, которую человек стремится сохранить, а не отдельно мыслимую нематериальную душу.
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: всё, что у него есть
  rationale: Естественно передаёт еврейскую конструкцию принадлежности, не добавляя к ней нового смысла.
- source_word: יִתֵּן
  choice: отдаст
  rationale: Форма выражает общее, характерное действие в пословичном утверждении; будущее время по-русски хорошо передаёт такую готовность поступить определённым образом.
theological_decisions:
- issue: Передача הַשָּׂטָן в прологе книги Иова
  choice: Противник
  alternative: Сатана; обвинитель
  rationale: Форма с артиклем представляет персонажа через его роль. Такой перевод не отрицает возможной последующей канонической идентификации, но и не навязывает её данному стиху.
- issue: Передача личного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет различие между личным именем Бога и титулом, присутствующее в исходном тексте.
- issue: Смысл נֶפֶשׁ в утверждении Противника
  choice: жизнь
  alternative: душа; самого себя
  rationale: Контекст говорит о телесном благополучии и готовности пожертвовать всем ради сохранения собственной жизни; перевод не утверждает особой антропологической схемы.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и резкости реплики. Синтаксически избыточная для русского формула «ответил и сказал» естественно сведена к «ответил». Неясная пословица оставлена без разъясняющей вставки в основном тексте; её вероятный смысл указан в сноске.
