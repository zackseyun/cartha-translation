lexical_decisions:
- source_word: אוּלָם
  choice: Но
  rationale: Противительный союз естественно вводит возражение обвинителя и его новое предложение.
- source_word: שְׁלַח נָא יָדְךָ
  choice: простри руку Твою
  rationale: Еврейская идиома буквально говорит о протягивании руки для непосредственного воздействия. Частица נָא здесь придаёт побуждению оттенок настойчивого предложения; отдельное «прошу» по-русски звучало бы неестественно в этой вызывающей речи.
- source_word: וְגַע
  choice: и коснись
  rationale: Сохраняется прямое значение глагола «касаться», тогда как вредоносный характер прикосновения ясен из контекста испытания.
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: его костей и плоти
  rationale: Конкретный телесный образ сохранён. Собирательное עֶצֶם естественнее передаётся по-русски множественным числом «кости».
- source_word: אִם לֹא
  choice: и тогда он непременно
  rationale: В данной клятвенно-эмфатической конструкции выражение передаёт уверенное утверждение, а не обычное условие. «Тогда» естественно обозначает предполагаемый результат.
- source_word: אֶל פָּנֶיךָ
  choice: прямо в лицо
  rationale: Русская идиома передаёт открытое и дерзкое действие непосредственно перед Богом.
- source_word: יְבָרֲכֶךָּ
  choice: проклянёт Тебя
  rationale: Хотя форма глагола буквально означает «благословит», в этом контексте она служит благоговейным эвфемизмом со значением «проклянёт»; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Эвфемистическое употребление ברך в сцене испытания Иова
  choice: 'В основном тексте: «проклянёт»'
  alternative: 'Буквально: «благословит»'
  rationale: Контекст требует враждебного отречения от Бога, а буквальное «благословит» ввело бы современного читателя в заблуждение. Особенность еврейского текста сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с библейским достоинством без излишней архаизации. Местоимения, относящиеся к Богу, написаны с прописной буквы. Конкретное выражение «кости и плоть» сохраняет телесную образность оригинала.
