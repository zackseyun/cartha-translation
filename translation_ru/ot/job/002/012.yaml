  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: ru
  text: Они подняли глаза и издали не узнали его. Тогда они возвысили голос и заплакали; каждый разорвал свою верхнюю одежду, и они бросили пыль над своими головами, к небу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «к небу» указывает на движение вверх. Бросание пыли было жестом скорби.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת־עֵינֵיהֶם מֵרָחוֹק
  choice: Они подняли глаза и, увидев его издали
  rationale: Сохраняется еврейский образ «поднять глаза», но синтаксис передан естественно для современного русского языка. «Издали» ясно выражает пространственное значение מֵרָחוֹק; глагол «увидев» эксплицирует подразумеваемое зрительное восприятие, необходимое для последующего «не узнали».
- source_word: וְלֹא הִכִּירֻהוּ
  choice: не узнали
  rationale: В контексте речь идёт о том, что друзья не узнали Иова из-за его изменившегося облика; русское «не узнали» точно передаёт это значение.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: громко заплакали
  rationale: Еврейская идиома буквально означает «подняли свой голос и заплакали». Естественное русское выражение «громко заплакали» сохраняет значение открытого, звучного плача.
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: каждый разорвал свою верхнюю одежду
  rationale: אִישׁ имеет распределительное значение «каждый», а מְעִיל обозначает верхнюю одежду или одеяние. Такой перевод конкретен, понятен и не вносит излишне узкого представления о покрое одежды.
- source_word: וַיִּזְרְקוּ עָפָר עַל־רָאשֵׁיהֶם הַשָּׁמָיְמָה
  choice: они стали бросать пыль вверх, над своими головами
  rationale: Передаётся движение пыли вверх и её положение над головами. «Вверх» естественно выражает направительное הַשָּׁמָיְמָה, буквально «к небу», а примечание сохраняет буквальный образ и объясняет жест.
