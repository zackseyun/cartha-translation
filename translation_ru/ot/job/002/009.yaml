  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: ru
  text: 'Тогда его жена сказала ему: «Ты всё ещё держишься своей непорочности? Благослови[a] Бога и умри».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «Благослови Бога и умри»; многие понимают слово «благослови» здесь как эвфемизм, употреблённый из благоговения, со значением «прокляни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда … сказала
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: אִשְׁתּוֹ
  choice: жена
  rationale: Суффикс указывает на жену Иова; в русском контексте принадлежность ясна из местоимения «ему», поэтому повторное «его» не требуется.
- source_word: עֹדְךָ
  choice: ты всё ещё
  rationale: Наречие עֹד с суффиксом второго лица выражает продолжающееся состояние и естественно передаётся сочетанием «всё ещё».
- source_word: מַחֲזִיק
  choice: держишься
  rationale: Причастие от חזק обозначает упорное сохранение или твёрдую приверженность; «держишься» сохраняет образ и укоризненный тон.
- source_word: בְּתֻמָּתֶךָ
  choice: своей непорочности
  rationale: תֻּמָּה означает нравственную цельность, безупречность или непорочность. «Непорочность» соответствует контексту книги Иова, не утверждая абсолютной безгрешности; предлог ב при חזק естественно передан русским управлением «держаться чего».
- source_word: בָּרֵךְ
  choice: Благослови
  rationale: Еврейский текст буквально употребляет глагол «благословлять». Это значение сохранено в основном тексте, а вероятное эвфемистическое значение указано в сноске.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: אֱלֹהִים здесь обозначает Бога и не является личным именем יהוה.
- source_word: וָמֻת
  choice: и умри
  rationale: Сочинение двух повелительных форм передано кратко и буквально, с сохранением резкости высказывания.
theological_decisions:
- issue: Эвфемистическое употребление «благословлять» по отношению к Богу
  choice: В основном тексте сохранено буквальное «Благослови Бога», а вероятный противоположный смысл разъяснён в сноске.
  alternative: «Прокляни Бога и умри»
  rationale: В еврейском стоит ברך — «благословлять», но в этом контексте его часто понимают как благоговейный эвфемизм со значением «проклинать». Буквальная форма и смысловое напряжение исходного текста сохранены без молчаливого разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и резкая, как в еврейском оригинале. Формулировка «держишься своей непорочности» сохраняет ключевую лексику и связь с темой нравственной цельности Иова.
