  text: וַֽ/יִּשְׁמְע֞וּ שְׁלֹ֣שֶׁת רֵעֵ֣י אִיּ֗וֹב אֵ֣ת כָּל הָ/רָעָ֣ה הַ/זֹּאת֮ הַ/בָּ֣אָה עָלָי/ו֒ וַ/יָּבֹ֨אוּ֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ אֱלִיפַ֤ז הַ/תֵּימָנִי֙ וּ/בִלְדַּ֣ד הַ/שּׁוּחִ֔י וְ/צוֹפַ֖ר הַ/נַּֽעֲמָתִ֑י וַ/יִּוָּעֲד֣וּ יַחְדָּ֔ו לָ/ב֥וֹא לָ/נֽוּד ל֖/וֹ וּֽ/לְ/נַחֲמֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: ru
  text: 'Трое друзей Иова услышали обо всём этом бедствии, постигшем его[a], и пришли, каждый из своей местности: Елифаз Феманитянин, Вилдад Савхеянин и Софар Наамитянин. Они договорились прийти вместе, чтобы выразить ему сочувствие[b] и утешить его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обо всём этом несчастье, обрушившемся на него». Еврейское слово здесь обозначает бедствие или невзгоды, а не нравственное зло, совершённое Иовом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы поскорбеть вместе с ним». Еврейский глагол может означать проявление сочувствия и соболезнования, в том числе посредством траура.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: услышали
  rationale: Последовательная форма с waw продолжает повествование; в русском естественно передать её простым прошедшим временем без добавления временного наречия.
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: трое друзей Иова
  rationale: Естественная русская передача сочетания с числительным и конструктивной цепи; רֵעַ здесь означает «друг».
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: обо всём этом бедствии
  rationale: В данном контексте רָעָה обозначает постигшее Иова несчастье, а не совершённое им нравственное зло. «Бедствие» сохраняет серьёзность и собирательный характер выражения.
- source_word: הַבָּאָה עָלָיו
  choice: постигшем его
  rationale: Идиоматическая русская передача буквального образа бедствия, «пришедшего на него», без изменения смысла.
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: и каждый отправился из своей местности
  rationale: אִישׁ употреблено распределительно — «каждый». «Отправился» ясно передаёт начало пути из разных мест и не создаёт ложного впечатления, будто друзья уже прибыли к Иову.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: Феманитянин / Савхеянин / Наамитянин
  rationale: Употреблены традиционные русские библейские формы этнонимов, понятные в литературном библейском регистре.
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: Они условились вместе
  rationale: Nifal глагола יעד указывает на согласование или договорённость; перевод сохраняет намеренную координацию их действий.
- source_word: לָבוֹא
  choice: прийти
  rationale: Прямая передача инфинитива цели בוא; точка отсчёта — место Иова, к которому они направляются.
- source_word: לָנוּד לוֹ
  choice: выразить ему сочувствие
  rationale: נוּד здесь означает проявить участие и соболезнование, возможно в формах траура. Формулировка отличает это действие от следующего «утешить».
- source_word: וּלְנַחֲמוֹ
  choice: и утешить его
  rationale: Обычное значение נחם в данном употреблении — утешать, ободрять скорбящего.
theological_decisions:
- issue: Смысл רָעָה применительно к страданиям Иова
  choice: бедствие
  alternative: зло
  rationale: Контекст говорит о несчастье, постигшем Иова, а не приписывает ему нравственное зло; при этом перевод не объясняет причин бедствия и не снимает богословского напряжения книги.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя; собственные имена и этнонимы даны в традиционных русских библейских формах. Различие между сочувствием и утешением сохранено.
