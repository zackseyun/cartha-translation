  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן הִנּ֣/וֹ בְ/יָדֶ֑/ךָ אַ֖ךְ אֶת נַפְשׁ֥/וֹ שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: ru
  text: 'И сказал Господь обвинителю: «Вот, он в твоей руке; только сохрани ему жизнь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; написание с прописной буквы обозначает божественное имя.
- source_word: הַשָּׂטָן
  choice: обвинителю
  rationale: Артикль указывает здесь на роль или титул — «обвинитель, противник», а не обязательно на личное имя.
- source_word: הִנּוֹ
  choice: Вот, он
  rationale: Сохраняет указательно-эмфатическую силу еврейского выражения и естественно вводит разрешение.
- source_word: בְיָדֶךָ
  choice: в твоей руке
  rationale: Сохраняет исходную метафору власти и распоряжения, привычную для библейского русского языка.
- source_word: נַפְשׁוֹ
  choice: ему жизнь
  rationale: В данном контексте נֶפֶשׁ означает жизнь Иова, а не отвлечённую «душу».
- source_word: שְׁמֹר
  choice: сохрани
  rationale: Императив буквально требует беречь или сохранять жизнь; по-русски сочетание «сохрани ему жизнь» ясно передаёт ограничение.
theological_decisions:
- issue: Статус הַשָּׂטָן
  choice: обвинитель как обозначение роли
  alternative: Сатана как личное имя
  rationale: Наличие определённого артикля и контекст небесного совета поддерживают функциональное обозначение; перевод не должен преждевременно отождествлять фигуру с позднейшим употреблением имени.
- issue: Предел дозволенного Иову вреда
  choice: сохранить ему жизнь
  alternative: сохранить его душу
  rationale: Контекст противопоставляет телесное поражение смерти; речь идёт о запрете лишать Иова жизни, без внесения учения о составе человека.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены краткость, параллелизм и метафора «в руке»; местоимение «он» оставлено со строчной буквы, поскольку относится к Иову.
