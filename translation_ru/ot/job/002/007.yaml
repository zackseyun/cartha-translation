base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: ru
  text: И вышел Противник от лица Яхве и поразил Иова тяжёлыми язвами от подошвы его ноги до самого темени[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «противник» с определённым артиклем; традиционная передача — «Сатана». Здесь это слово может обозначать титул или роль.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «тяжёлыми нарывами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: Противник
  rationale: Слово употреблено с определённым артиклем и в прологе Иова обозначает роль или титул. «Противник» передаёт основное значение, не превращая термин без пояснения в собственное имя.
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: от лица Яхве
  rationale: Оборот с פָּנִים означает удаление от непосредственного присутствия Яхве; традиционный русский оборот «от лица» сохраняет образ исходного текста и остаётся понятным.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה означает «ударить, поразить». «Поразил» естественно сочетается с тяжёлой болезнью и сохраняет прямоту действия.
- source_word: בִּשְׁחִין רָע
  choice: мучительными язвами
  rationale: שְׁחִין обозначает воспалительное поражение кожи, язвы или нарывы, а רָע здесь выражает тяжесть бедствия. «Мучительные язвы» звучит естественно и не приписывает заболеванию излишне точный диагноз.
- source_word: מִכַּף רַגְלוֹ
  choice: от подошвы его ноги
  rationale: כַּף применительно к ноге означает подошву. Сохранено единственное число исходного текста.
- source_word: עַד קָדְקֳדוֹ
  choice: до самого темени
  rationale: קָדְקֹד означает темя, верхнюю часть головы; частица «самого» естественно подчёркивает полную протяжённость поражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменено титулом.
theological_decisions:
- issue: Передача הַשָּׂטָן в прологе книги Иова
  choice: Противник
  alternative: Сатана
  rationale: Наличие артикля указывает здесь прежде всего на обозначение роли. Основной текст сохраняет эту особенность, а традиционная передача дана в сноске, чтобы не устранять возможную связь с позднейшим употреблением имени.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; его прямая передача сохраняет различие между именем и титулом.
- issue: Характер кожного поражения בִּשְׁחִין רָע
  choice: мучительными язвами
  alternative: тяжёлыми нарывами
  rationale: Исходный термин допускает несколько близких обозначений воспалительного кожного поражения и не позволяет уверенно устанавливать современный медицинский диагноз.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Оборот «от лица Яхве» сохраняет древнееврейский образ; лексика болезни понятна без навязывания конкретного диагноза.
