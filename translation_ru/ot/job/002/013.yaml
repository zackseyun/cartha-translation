base_translation:
  language: en
  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: ru
  text: И сидели они с ним на земле семь дней и семь ночей, и никто не говорил ему ни слова, потому что видели, как велика была его боль.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как велики были его страдания» или «как велико было его горе». Еврейское слово может обозначать боль в широком смысле, включая телесные страдания и душевную муку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ אִתּוֹ לָאָרֶץ
  choice: И сидели они с ним на земле
  rationale: Сохраняется конкретная поза скорбящих и значение совместного присутствия; «на земле» естественно передаёт место действия в данном контексте.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: семь дней и семь ночей
  rationale: Буквальная временная формула ясна и естественна по-русски.
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: и никто не говорил ему ни слова
  rationale: Отрицательная конструкция «ни слова» передаёт подчёркнуто полное молчание.
- source_word: כִּי רָאוּ
  choice: потому что видели
  rationale: Первое כִּי указывает причину молчания; подлежащее ясно из предыдущей части и по-русски может не повторяться.
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: как велика была его боль
  rationale: Второе כִּי после глагола восприятия естественно передано союзом «как». Конструкция с «велика» сохраняет образ большой, чрезвычайной боли; притяжательное «его» ясно обозначает Иова как носителя боли.
