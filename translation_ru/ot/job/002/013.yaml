translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Начальное «И» сохраняет повествовательную связь; архаизмы устранены. Сноска сохраняет смысловую широту הַכְּאֵב, не сводя её исключительно к телесной боли.
