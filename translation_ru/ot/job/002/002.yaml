source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן אֵ֥י מִ/זֶּ֖ה תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שֻּׁ֣ט בָּ/אָ֔רֶץ וּ/מֵ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: ru
  text: 'И сказал Яхве обвинителю[a]: «Откуда ты пришёл?» Обвинитель ответил Яхве: «Я бродил по земле и ходил по ней».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «ха-сатан» — «обвинитель» или «противник»; здесь это, вероятно, обозначение роли, а не обязательно собственное имя.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: הַשָּׂטָן
  choice: обвинитель
  rationale: Слово употреблено с определённым артиклем и в данном контексте, вероятнее всего, обозначает роль или титул. «Обвинитель» ясно передаёт обвинительную функцию, не превращая обозначение роли в собственное имя.
- source_word: אֵי מִזֶּה תָּבֹא
  choice: Откуда ты пришёл?
  rationale: Естественно передаёт вопрос об исходной точке движения и сохраняет направительное значение предлога מִן.
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ответил
  rationale: В русском сочетание «ответил и сказал» здесь звучит избыточно; один глагол естественно передаёт формулу ответа, не меняя содержания.
- source_word: מִשֻּׁט
  choice: Я бродил
  rationale: Передаёт движение по разным местам без архаичного оборота; личная глагольная форма естественно восполняет подразумеваемый смысл ответа «пришёл после того, как…».
- source_word: בָּאָרֶץ
  choice: по земле
  rationale: В контексте речь идёт о земле как мире человеческого обитания, а предлог «по» естественно сочетается с глаголами движения.
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: и ходил по ней
  rationale: Сохраняет повторное описание продолжительного перемещения, не добавляя более узкого смысла «патрулировал».
theological_decisions:
- issue: Следует ли понимать הַשָּׂטָן как собственное имя или как обозначение роли
  choice: обвинитель
  alternative: Сатана; противник
  rationale: Определённый артикль и сцена небесного совета поддерживают понимание слова как титула или функции. Перевод не исключает связи этого персонажа с позднейшим образом Сатаны, но и не вносит её в текст как уже выраженное собственное имя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок «И сказал Яхве» сохраняет повествовательный ритм оригинала, а ответ передан естественной русской конструкцией.
