base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: ru
  text: 'Но он сказал ей: «Ты говоришь, как одна из безумных женщин. Неужели добро мы будем принимать от Бога, а беду[a] принимать не будем?» При всём этом Иов не согрешил своими устами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зло». Еврейское слово может обозначать зло, беду, несчастье или иное неблагоприятное обстоятельство; здесь оно противопоставлено добру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: Ты говоришь, как одна из безумных женщин
  rationale: Слово נְבָלוֹת обозначает не просто недостаток ума, а нравственно и религиозно порочную глупость. «Безумных» сохраняет эту более сильную оценку и естественно звучит в возвышенной повествовательной речи.
- source_word: גַּם אֶת־הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: Неужели добро мы будем принимать от Бога
  rationale: Имперфект в паре со следующим отрицательным предложением передан как единый риторический вопрос. «Добро» сохраняет широкое категориальное значение благоприятного дара или обстоятельства.
- source_word: וְאֶת־הָרָע לֹא נְקַבֵּל
  choice: а беду принимать не будем
  rationale: В данном контексте רָע противопоставлено добру и обозначает постигшее человека несчастье или неблагоприятное обстоятельство. «Беда» естественна по-русски и не приписывает Богу совершение нравственного зла; более широкое традиционное соответствие сохранено в сноске.
- source_word: בְּכָל־זֹאת
  choice: При всём этом
  rationale: Естественная русская формула, вводящая итоговую оценку повествователя и не добавляющая причинного толкования.
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: Иов не согрешил своими устами
  rationale: Сохранён телесный образ еврейского текста и его уточнение, что оценка непосредственно относится к речи Иова.
theological_decisions:
- issue: Значение הָרָע в связи с тем, что оно принимается от Бога
  choice: «беду» — как несчастье или неблагоприятное обстоятельство
  alternative: «зло»
  rationale: Контекст говорит о переживаемом Иовом бедствии и противопоставляет благоприятное неблагоприятному. Основной перевод избегает ненужного утверждения, будто речь обязательно идёт о нравственном зле, а сноска сохраняет более широкую лексическую и традиционную возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Риторический вопрос передан естественно, а выражение «своими устами» сохранено ради образности и смысловой точности оригинала.
