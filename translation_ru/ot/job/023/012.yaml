base_translation:
  language: en
  yaml_path: translation/ot/job/023/012.yaml
  text: I have not turned aside from the command of his lips[a]; I have treasured the words of his mouth more than my allotted portion.
translation:
  language: ru
  text: От повеления его уст я не отступал; словами из его уст я дорожил больше, чем назначенной мне долей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному толкованию трудной еврейской фразы: «словами из его уст я дорожил больше, чем необходимой мне пищей».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִצְוַת
  choice: повеления
  rationale: Единственное число в сопряжённой конструкции; «повеление» естественно передаёт конкретное Божье предписание и сохраняет число исходного текста.
- source_word: שְׂפָתָיו
  choice: его уст
  rationale: Поэтическое «уста» уместно в современном литературном регистре и сохраняет телесный образ Божьей речи; суффикс 3-го лица мужского рода по контексту относится к Богу.
- source_word: לֹא אָמִישׁ
  choice: я не отступал
  rationale: Форма породы hifil от מוש здесь означает не отходить, не уклоняться; выбранная формулировка естественна по-русски и выражает постоянную верность Иова.
- source_word: מֵחֻקִּי
  choice: дороже назначенной мне доли
  rationale: Трудная форма с суффиксом 1-го лица допускает понимание חֹק как установленной или назначенной доли. Сравнительная передача создаёт связный смысл, не уточняя без достаточных оснований, что именно составляло эту долю.
- source_word: צָפַנְתִּי
  choice: я хранил
  rationale: Глагол означает прятать или запасать и в контексте мудрости — бережно хранить как ценность. «Хранил дороже» передаёт и сохранение, и высокую оценку без избыточного пояснения.
- source_word: אִמְרֵי
  choice: слова
  rationale: Прямой и естественный русский эквивалент множественного числа в сопряжённой форме.
- source_word: פִיו
  choice: из его уст
  rationale: Формулировка естественно передаёт слова, исходящие из Божьих уст, и поддерживает поэтический образ речи, хотя русский язык не позволяет без стилистической неловкости буквально противопоставить здесь «губы» и «рот».
theological_decisions:
- issue: К кому относятся суффиксы «его»
  choice: К Богу
  alternative: К неопределённому говорящему
  rationale: В контексте Иов говорит о своей верности перед Богом и Божьей речи; перевод не добавляет имени Бога, но сохраняет естественный для контекста референт местоимения.
- issue: Толкование מֵחֻקִּי
  choice: 'Сравнительный смысл: «дороже назначенной мне доли»'
  alternative: «от моего установления»; традиционное «больше необходимой мне пищи»
  rationale: Еврейская фраза трудна. Основной текст сохраняет связь с засвидетельствованной формой и не сужает «долю» до пищи; известное традиционное толкование вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической лексикой. «Уста» сохраняют достоинство и образность оригинала; синтаксис остаётся ясным для обычного читателя. Неоднозначность трудной заключительной фразы отмечена в сноске.
