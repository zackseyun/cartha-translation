lexical_decisions:
- source_word: שְׂמֹאול
  choice: слева
  rationale: Основное значение — «левая сторона»; в паре с יָמִין лучше сохранить поэтическое противопоставление «слева — справа», не заменяя его сторонами света.
- source_word: בַּעֲשֹׂתוֹ
  choice: когда Он действует
  rationale: Предлог ב с инфинитивом עשה и суффиксом 3 м. ед. естественно передаёт временное значение «когда Он действует».
- source_word: אָחַז
  choice: я не могу постичь Его
  rationale: Глагол буквально означает «схватить, удержать», но в контексте безуспешных поисков Бога выражает невозможность Его обнаружить или постичь; русский оборот сохраняет оттенок недостижимости.
- source_word: יַעְטֹף
  choice: Он скрывается
  rationale: Глагол связан со значениями «окутывать, покрывать»; возвратное «скрывается» естественно передаёт образ Бога, остающегося невидимым, не сводя трудную форму к простому «поворачивает».
- source_word: יָמִין
  choice: справа
  rationale: Сохраняет прямую пространственную пару со словом «слева» и еврейский поэтический параллелизм.
- source_word: אֶרְאֶה
  choice: я не вижу Его
  rationale: Прямое значение ראה — «видеть»; дополнение «Его» ясно восстанавливается из ближайшего контекста.
theological_decisions:
- issue: К кому относятся местоименные формы третьего лица
  choice: К Богу; в русском тексте употреблено «Он/Его».
  alternative: Оставить неопределённое «он/его» со строчной буквы.
  rationale: В самом стихе Бог не назван, однако ближайший контекст Иов 23:8–10 недвусмысленно говорит о поисках Бога. Прописная буква соответствует норме русского библейского стиля, не добавляя нового богословского утверждения.
- issue: Образ в יַעְטֹף יָמִין
  choice: «справа — Он скрывается»
  alternative: «Он покрывает Себя справа» или «Он поворачивает направо»
  rationale: Еврейская строка трудна. Выбранный вариант сохраняет идею сокрытости и параллель с невозможностью увидеть Бога, а более буквальное значение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Инверсия «Слева… справа…» сохраняет структуру и пространственный параллелизм еврейского стиха; тире делает фразу ясной для современного читателя.
