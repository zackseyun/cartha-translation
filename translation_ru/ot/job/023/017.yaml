  yaml_path: translation/ot/job/023/017.yaml
  text: For I was not silenced because of the darkness[a], nor because deep gloom covered my face.
translation:
  language: ru
  text: Ведь не из-за тьмы я умолк[a] и не из-за того, что густой мрак покрыл моё лицо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь я не был уничтожен из-за тьмы и из-за того, что густой мрак покрыл моё лицо». Еврейский текст этого стиха труден: соответствующий глагол может означать «умолкнуть», «быть отсечённым» или «быть уничтоженным», а вторую часть можно также понять как «густой мрак покрыл всё предо мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит пояснение к предыдущей мысли; «ведь» естественно передаёт эту связь, не придавая ей чрезмерно строгого причинного смысла.
- source_word: לֹא נִצְמַתִּי
  choice: не… я умолк
  rationale: Нифаль глагола צמת допускает значения «быть заставленным умолкнуть», «быть отсечённым», «быть уничтоженным». В контексте продолжающейся речи Иова выбран смысл прекращения речи; русская конструкция естественна, хотя формально пассивный оттенок передан менее явно.
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: из-за тьмы
  rationale: 'Сочетание предлога с פָּנִים здесь наиболее естественно понимать как указание на причину: тьма не заставила Иова умолкнуть.'
- source_word: וּמִפָּנַי
  choice: моё лицо
  rationale: Суффикс первого лица при פָּנִים позволяет понимать выражение буквально как «моё лицо», хотя возможен и пространственный смысл «предо мной»; неоднозначность отмечена в сноске.
- source_word: כִּסָּה
  choice: покрыл
  rationale: Прямое значение глагола — «покрывать, скрывать»; мужской род согласован с существительным «мрак».
- source_word: אֹפֶל
  choice: густой мрак
  rationale: Слово обозначает особенно плотную, глубокую тьму. «Густой мрак» отличает его от חֹשֶׁךְ, переданного как «тьма».
theological_decisions:
- issue: Связь второй части стиха с отрицанием и причиной молчания
  choice: «и не из-за того, что…»
  alternative: 'Более буквальное, но синтаксически неясное: «и от лица моего покрыл мрак»'
  rationale: Еврейский текст труден и допускает несколько синтаксических разборов. Основной текст следует наиболее связному пониманию, при котором обе части называют то, что не заставило Иова умолкнуть, а альтернативы сохранены в сноске без богословского сглаживания.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической образности. «Ведь» связывает стих с предшествующим контекстом; различие между חֹשֶׁךְ и אֹפֶל передано словами «тьма» и «густой мрак». Синтаксис основного текста сделан понятным, а существенная неопределённость еврейского оригинала вынесена в сноску.
