base_translation:
  language: en
  yaml_path: translation/ot/job/023/003.yaml
  text: Oh[a], that I knew where I might find him, that I might come to his dwelling place.
translation:
  language: ru
  text: О, если бы я знал, где найти Его, — пришёл бы к месту Его пребывания[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Его месту». Еврейское слово означает установленное, постоянное место — место, где Его можно найти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы
  rationale: Устойчивое древнееврейское выражение передаёт сильное желание, а не буквальный вопрос «кто даст?». Русское «О, если бы» естественно сохраняет эмоциональную и желательную силу.
- source_word: יָדַעְתִּי
  choice: я знал, где
  rationale: Формально это перфект 1-го лица единственного числа, но в оптативной конструкции он обозначает желаемое знание. Слово «где» прямо не выражено отдельной лексемой, однако подразумевается последующим «найти Его» и необходимо для естественного русского синтаксиса.
- source_word: וְאֶמְצָאֵהוּ
  choice: найти Его
  rationale: Имперфект с союзом продолжает выражение желания. Инфинитив после «знал, где» естественно передаёт эту связь по-русски; местоименный суффикс относится в контексте к Богу.
- source_word: אָבוֹא
  choice: пришёл бы
  rationale: Имперфект 1-го лица продолжает желательную последовательность; русское условное наклонение передаёт предполагаемое действие Иова, если бы он знал, где найти Бога.
- source_word: עַד
  choice: к
  rationale: Предлог обозначает движение вплоть до места назначения; в современном русском при глаголе «прийти» естествен предлог «к».
- source_word: תְּכוּנָתוֹ
  choice: месту Его пребывания
  rationale: Существительное обозначает установленное, постоянное место. Такой перевод сохраняет локальный смысл, не вводя более узких судебных образов «престола» или «судейского места».
theological_decisions:
- issue: К кому относятся суффиксы 3-го лица мужского рода («Его»)
  choice: Подразумеваемый референт — Бог; местоимение написано с прописной буквы по принятой русской библейской традиции.
  alternative: Писать местоимения со строчной буквы.
  rationale: Ближайший контекст говорит о желании Иова предстать перед Богом и изложить Ему своё дело. Сам стих Бога прямо не называет, поэтому имя не добавлено в основной текст.
- issue: Характер «места» в תְּכוּנָתוֹ
  choice: Нейтральное «место Его пребывания».
  alternative: «Престол», «судейское место» или просто «место».
  rationale: Контекст допускает судебный оттенок, однако само слово прежде всего обозначает установленное место. Перевод не закрепляет неоднозначный образ за одной богословской или судебной интерпретацией.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Начальное «О, если бы» сохраняет напряжённую тоску Иова; тире передаёт переход от желания найти Бога к намерению прийти к Нему. Прописное «Его» соответствует распространённой русской библейской орфографии.
