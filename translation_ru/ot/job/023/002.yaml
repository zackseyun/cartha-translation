  text: И сегодня моя жалоба — непокорность[a]; моя рука тяжела над моим стоном[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моя жалоба горька». Однако еврейское слово обычно означает неповиновение, мятежность или непокорность.'
