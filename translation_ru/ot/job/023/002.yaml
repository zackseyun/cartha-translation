    reason: alternative_reading
lexical_decisions:
- source_word: גַּם הַיּוֹם
  choice: И сегодня
  rationale: Сочетание подчёркивает, что состояние Иова продолжается и в настоящий день; «И сегодня» естественно передаёт временной акцент.
- source_word: מְרִי
  choice: непокорность
  rationale: Существительное обычно означает неповиновение, мятежность или непокорность. Выбор сохраняет резкость еврейского слова и не смягчает его до одной лишь горечи.
- source_word: שִׂיחִי
  choice: моя жалоба
  rationale: В контексте речи Иова слово может обозначать размышление, речь или жалобу; параллель со стоном поддерживает значение «жалоба».
- source_word: יָדִי
  choice: моя рука
  rationale: Масоретский текст прямо содержит суффикс первого лица единственного числа. Неясный образ сохранён, а возможное исправление «его рука» вынесено в примечание.
- source_word: כָּבְדָה
  choice: тяжела
  rationale: Передаёт состояние тяжести без добавочного толкования того, что именно означает этот образ.
- source_word: עַל
  choice: над
  rationale: Более буквально сохраняет широкое пространственно-реляционное значение предлога и не навязывает причинное толкование неясной фразы.
- source_word: אַנְחָתִי
  choice: моим стоном
  rationale: Слово обозначает стон или тяжёлый вздох; «стон» соответствует напряжённости контекста.
theological_decisions:
- issue: Следует ли смягчать характеристику жалобы Иова, чтобы она не звучала как неповиновение
  choice: Сохранить сильное значение «непокорность»
  alternative: «моя жалоба горька»
  rationale: Еврейское מְרִי обычно связано с неповиновением или мятежностью. Такая передача сохраняет напряжение между страданием Иова и дерзновенным характером его речи, не вынося заранее нравственного приговора.
- issue: Кому принадлежит тяжёлая «рука»
  choice: Следовать масоретскому чтению «моя рука»
  alternative: Исправить текст на «его рука» и отнести образ к Божьей руке
  rationale: Засвидетельствованный текст имеет форму первого лица. Хотя смысл фразы остаётся трудным, перевод не должен молча принимать conjectural emendation.
translation_notes:
  register: Современный литературный русский язык с намеренно сохранённой резкостью первой строки и неясностью образа во второй. Именная конструкция с тире передаёт еврейскую краткость; буквальное «над моим стоном» оставлено в основном тексте, поскольку более гладкая причинная формулировка уже истолковала бы спорную связь.
