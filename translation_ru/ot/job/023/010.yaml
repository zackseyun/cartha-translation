  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Необычное «путь со мною» намеренно сохраняет неоднозначность исходной формулировки; строчные местоимения не добавляют отсутствующего в еврейском тексте конфессионального оформления.
