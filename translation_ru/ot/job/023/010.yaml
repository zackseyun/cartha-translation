lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В контексте Иов противопоставляет своей неспособности найти Бога то, что Богу его путь известен; «но» естественно передаёт этот смысловой поворот, хотя союз может также означать «ибо».
- source_word: יָדַע
  choice: знает
  rationale: Простое настоящее время естественно выражает полное знание Бога об Иове.
- source_word: דֶּרֶךְ עִמָּדִי
  choice: путь со мною
  rationale: Формулировка сохраняет необычное и допускающее разные толкования еврейское сочетание буквально ближе, чем однозначное «мой путь»; более гладкий вариант вынесен в сноску.
- source_word: בְּחָנַנִי
  choice: когда испытает меня
  rationale: Глагол означает испытание или проверку; образ золота поддерживает значение «испытать». Временной оттенок конструкции сохранён как основной, а другие возможные оттенки отмечены в сноске.
- source_word: כַּזָּהָב
  choice: как золото
  rationale: Сохраняется прямое сравнение и образ проверки золота.
- source_word: אֵצֵא
  choice: я выйду
  rationale: Передаёт основной смысл глагола «выходить» и естественно описывает результат испытания, не уточняя, идёт ли речь преимущественно об оправдании или очищении.
theological_decisions:
- issue: Связь Божьего испытания с оправданием или очищением Иова
  choice: Сохранить образ испытания и выхода подобно золоту без уточнения его богословского характера.
  alternative: Истолковать слова исключительно как судебное оправдание Иова либо исключительно как его нравственное очищение.
  rationale: Еврейский текст допускает в образе золота как подтверждение подлинности, так и очищение; перевод не должен устранять это напряжение.
