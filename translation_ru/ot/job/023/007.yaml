  yaml_path: translation/ot/job/023/007.yaml
  text: There an upright man could reason with him[b][a], and I would be delivered forever from my judge.
translation:
  language: ru
  text: Там праведный человек мог бы вести с ним спор[a], и я навсегда избавился бы от своего судьи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мог бы спорить с ним»; «мог бы изложить перед ним своё дело».'
