  - marker: b
    text: 'Или: «и я навсегда ушёл бы от своего судьи»; выражение можно также понять как «от того, кто меня судит».'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Наречие указывает на воображаемое место встречи и разбирательства с Богом; краткое «там» естественно продолжает контекст.
- source_word: יָשָׁר
  choice: правый
  rationale: Субстантивированное прилагательное обозначает человека честного, непорочного или стоящего на правой стороне дела. «Правый» сохраняет и нравственный, и судебный оттенок.
- source_word: נוֹכָח
  choice: мог бы судиться
  rationale: В данном контексте слово передаёт судебное прение или изложение своей правоты, а не просто рассуждение. Условная форма соответствует воображаемой ситуации речи Иова.
- source_word: עִמּוֹ
  choice: с ним
  rationale: Буквально передаёт предлог и местоимение, не заменяя его поясняющим именованием Бога.
- source_word: וַאֲפַלְּטָה
  choice: и я избавился бы
  rationale: Глагол פלט выражает избавление или уход от опасности. Формулировка сохраняет образ освобождения, не усиливая его до строго юридического оправдания.
- source_word: לָנֶצַח
  choice: навсегда
  rationale: Передаёт длительный, окончательный характер предполагаемого избавления естественным современным русским словом.
- source_word: מִשֹּׁפְטִי
  choice: от моего судьи
  rationale: Передаёт судебный образ и личный суффикс, сохраняя возможность понимать выражение как «мой судья» либо «тот, кто меня судит».
theological_decisions:
- issue: Кого обозначает выражение «мой судья» и какова его роль
  choice: Сохранено «от моего судьи» без прямого отождествления с Богом и без замены на «обвинителя».
  alternative: «от того, кто меня судит»; «от моего обвинителя»
  rationale: Контекст указывает на Бога как участника воображаемого судебного разбирательства, однако еврейская формулировка называет роль, не разъясняя её богословски. Буквальная судебная формула сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением судебной образности. «Правый» здесь означает человека, чья правота и честность позволяют ему выступить в разбирательстве. Строчная буква в местоимении «ним» не навязывает конфессиональную типографскую традицию и соответствует форме исходного текста.
