  yaml_path: translation/ot/job/023/013.yaml
  text: But he is one[a], and who can turn him back? What his soul desires[b], that he does.
translation:
  language: ru
  text: Но Он непреклонен[a], и кто повернёт Его назад? Чего желает Его душа[b], то Он и делает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Он — в одном»; также возможно: «Он — один». Трудное еврейское выражение, вероятно, означает, что Он твёрд в Своём решении и не меняет намерения.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Чего Он желает». «Душа» здесь — обычный еврейский способ обозначить собственную волю или желание человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Но Он
  rationale: Союз в данном контексте имеет противительное значение, а самостоятельное местоимение подчёркивает Бога как действующее лицо.
- source_word: בְאֶחָד
  choice: один
  rationale: Сохранена краткая и неоднозначная форма еврейского выражения «в одном / один»; контекст допускает смысл неизменности или единства намерения, пояснённый в сноске.
- source_word: וּמִי יְשִׁיבֶנּוּ
  choice: и кто заставит Его отступить?
  rationale: Побудительная форма глагола שוב здесь передаёт поворот назад или изменение принятого направления; формулировка сохраняет образ, не сводя его только к абстрактной перемене решения.
- source_word: וְנַפְשׁוֹ אִוְּתָה
  choice: Чего желает душа Его
  rationale: Сохранён образ נֶפֶשׁ — «душа, сам человек» — и волевое значение глагола «желать»; инверсия придаёт фразе библейское достоинство, оставаясь понятной.
- source_word: וַיָּעַשׂ
  choice: то Он и делает
  rationale: Передан обычный смысл глагола עשה без усиления до «непременно осуществляет»; соотносительное «чего… то» естественно воспроизводит структуру высказывания.
theological_decisions:
- issue: Смысл утверждения בְאֶחָד о Боге
  choice: Он — один
  alternative: Он неизменен / Он остаётся при одном решении
  rationale: 'Буквальная формулировка сохраняет подлинную неоднозначность: речь может идти об единственности, постоянстве или неизменности Божьего намерения. Контекстуальный смысл поясняется в сноске, а не вносится непосредственно в текст.'
- issue: Антропоморфное выражение «душа Его»
  choice: Сохранить образ в основном тексте
  alternative: Чего Он желает
  rationale: Еврейский текст прямо говорит о Божьей «душе» как о Его собственном желании или воле. Сохранение образа не устраняет антропоморфную напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные местоимения в отношении Бога применены последовательно. Тире помогает сохранить лаконичность и выразительность неоднозначного בְאֶחָד.
