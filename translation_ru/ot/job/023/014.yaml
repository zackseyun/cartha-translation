  text: כִּ֭י יַשְׁלִ֣ים חֻקִּ֑/י וְ/כָ/הֵ֖נָּה רַבּ֣וֹת עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/014.yaml
  text: For he will complete what is appointed for me[a], and many such things are with him.
translation:
  language: ru
  text: Ведь Он доведёт до конца то, что назначено мне[a], и много подобного у Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой удел», «определённое мне»; буквальнее также возможно: «мой указ» или «мой устав». Еврейское слово может обозначать то, что предписано, установлено или определено для Иова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предыдущей мысли; «ведь» естественно передаёт объяснительно-причинную связь в русском контексте.
- source_word: יַשְׁלִים
  choice: доведёт до конца
  rationale: Каузативная форма от שׁלם обозначает завершение или полное осуществление; выражение сохраняет динамику действия и звучит естественно.
- source_word: חֻקִּי
  choice: то, что назначено мне
  rationale: В данном контексте חֹק указывает на нечто установленное, предписанное или определённое для Иова Богом, а не обязательно на юридический закон.
- source_word: וְכָהֵנָּה רַבּוֹת
  choice: и много подобного
  rationale: Сочетание обозначает множество других дел того же рода; краткая русская формулировка передаёт и указательное значение, и множественность.
- source_word: עִמּוֹ
  choice: у Него
  rationale: 'Русское «у Него» идиоматично передаёт буквальное «с Ним», сохраняя широкий смысл: подобные замыслы или решения находятся у Бога, в Его распоряжении.'
theological_decisions:
- issue: Понимать ли חֻקִּי как юридический «указ/устав» или как назначенную Иову участь
  choice: то, что назначено мне
  alternative: мой указ; мой устав; назначенная мне участь
  rationale: Контекст говорит о Божьем решении относительно пути и судьбы Иова. Выбранный вариант сохраняет Божью определяющую роль, но не сужает многозначное еврейское слово до строго юридического термина.
translation_notes:
  register: 'Современный литературный русский язык с достоинством поэтической речи. Заглавные местоимения «Он», «Него» ясно указывают на Бога в пределах стиха. Формулировка сохраняет неопределённость относительно того, что именно ещё находится у Бога: подобные решения, назначения или действия.'
