  text: בַּ֭/אֲשֻׁר/וֹ אָחֲזָ֣ה רַגְלִ֑/י דַּרְכּ֖/וֹ שָׁמַ֣רְתִּי וְ/לֹא אָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/011.yaml
  text: My foot has held fast to his steps[a]; I have kept his way and have not turned aside.
translation:
  language: ru
  text: Моя нога твёрдо держалась его следа[a]; я хранил его путь и не уклонялся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моя нога крепко держалась его шага». В еврейском тексте дан образ неотступного следования по Божьим стопам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֻׁרוֹ
  choice: его следа
  rationale: אֲשׁוּר обозначает шаг или след ноги. Единственное число сохранено, а сочетание с глаголом «держалась» передаёт образ неотступного следования.
- source_word: אָחֲזָה
  choice: твёрдо держалась
  rationale: Глагол אחז означает «схватить, держать». В сочетании с «моя нога» он выражает стойкую приверженность, а не насильственное действие.
- source_word: רַגְלִי
  choice: Моя нога
  rationale: Сохранено единственное число и конкретный образ ноги, идущей по чужому следу.
- source_word: דַּרְכּוֹ
  choice: его путь
  rationale: דֶּרֶךְ означает путь и может образно указывать на образ действий или жизни. Прямой перевод сохраняет как пространственный, так и нравственный смысл.
- source_word: שָׁמַרְתִּי
  choice: я хранил
  rationale: שׁמר передаёт значение бережного соблюдения и верности. «Хранил» сохраняет эту смысловую полноту и возвышенный поэтический регистр.
- source_word: וְלֹא אָט
  choice: и не уклонялся
  rationale: Форма от נטה в данном контексте означает отклонение от пути. Перевод сохраняет дорожный образ и выражает продолжительную верность, естественно звучащую по-русски.
theological_decisions:
- issue: К кому относятся суффиксы 3-го лица мужского рода («его след», «его путь»)?
  choice: Они относятся к Богу, но в тексте переданы обычным местоимением «его».
  alternative: Они могут пониматься как отсылка к не названному прямо праведному пути.
  rationale: В ближайшем контексте Иов говорит о Боге и о собственной верности перед Ним (Иов 23:10–12). Местоименная передача сохраняет личную отсылку, не добавляя имени и не устраняя формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим звучанием, уместным для речи Иова. Конкретные образы ноги, следа и пути сохранены; местоимение «его» не капитализировано, чтобы не добавлять отсутствующего в еврейском тексте графического толкования.
