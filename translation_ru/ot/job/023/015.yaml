    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод из сказанного в предыдущих стихах ясно и естественно.
- source_word: מִפָּנָיו
  choice: перед Ним
  rationale: Сохраняет пространственно-личный образ еврейского выражения «от Его лица/присутствия», не сводя его лишь к причинному «из-за Него».
- source_word: אֶבָּהֵל
  choice: я трепещу
  rationale: Передаёт сильную тревогу и ужас, выраженные формой нифаль глагола בהל, в естественном и достойном русском регистре.
- source_word: אֶתְבּוֹנֵן
  choice: размышляя об этом
  rationale: Передаёт значение вдумчивого осмысления; «об этом» естественно связывает мысль Иова с тем, что он только что сказал о Божьем замысле и могуществе.
- source_word: וְאֶפְחַד
  choice: я страшусь
  rationale: Точно передаёт פחד и образует выразительный параллелизм с «трепещу».
- source_word: מִמֶּנּוּ
  choice: Его
  rationale: При русском глаголе «страшиться» родительный падеж непосредственно и естественно передаёт значение «бояться Его».
theological_decisions:
- issue: К кому относятся местоименные суффиксы мужского рода
  choice: Сохранены местоимения «Ним/Его», относящиеся к Богу по контексту.
  alternative: Явно вставить слово «Бог».
  rationale: В еврейском тексте употреблены местоименные суффиксы; сохранение местоимений не добавляет отсутствующего в стихе титула.
- issue: Сила переживаемого Иовом страха
  choice: Использованы сильные слова «трепещу» и «страшусь».
  alternative: Смягчить до «смущаюсь» или «испытываю благоговение».
  rationale: בהל и פחד выражают подлинный страх; текст не следует богословски сглаживать, превращая ужас Иова лишь в почтительность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Богу, следуют принятой русской издательской традиции, не заменяя местоимения божественным титулом.
