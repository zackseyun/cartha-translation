  text: אֶעֶרְכָ֣ה לְ/פָנָ֣י/ו מִשְׁפָּ֑ט וּ֝/פִ֗/י אֲמַלֵּ֥א תוֹכָחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/004.yaml
  text: I would lay out my case before him[b][a], and fill my mouth with arguments.
translation:
  language: ru
  text: Я изложил бы перед Ним своё дело[a] и наполнил бы уста доводами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изложил бы перед Ним судебное дело». Еврейское слово מִשְׁפָּט здесь имеет судебно-правовой смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доказательствами», «возражениями» или «обличениями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֶרְכָה
  choice: изложил бы
  rationale: Глагол ערך передаёт упорядоченное представление материала; в данном судебном контексте «изложил бы» звучит естественно и сохраняет смысл последовательной подачи дела.
- source_word: לְפָנָיו
  choice: перед Ним
  rationale: Буквально — «перед Его лицом», то есть в Его присутствии; «перед Ним» естественно передаёт и личный, и судебный оттенок.
- source_word: מִשְׁפָּט
  choice: своё дело
  rationale: Здесь מִשְׁפָּט имеет судебно-правовой смысл. Притяжательное «своё» прямо не выражено, но ясно подразумевается речью Иова о деле, которое он намерен представить.
- source_word: וּפִי
  choice: уста
  rationale: Сохранён телесный образ еврейского выражения; «уста» соответствует достоинству поэтической речи и естественно сочетается с глаголом «наполнить».
- source_word: אֲמַלֵּא
  choice: наполнил бы
  rationale: Имперфект продолжает гипотетическую направленность первой части стиха; условное наклонение явно передано по-русски.
- source_word: תוֹכָחוֹת
  choice: доводами
  rationale: תוֹכָחוֹת может означать обличения, доказательства или прения. В судебном контексте «доводы» ясно выражают аргументированную речь, не сводя её к нравственному обличению.
theological_decisions:
- issue: Судебный образ в обращённой к Богу речи Иова
  choice: Сохранить язык представления дела и доводов, не смягчая смелости Иова.
  alternative: 'Передать более общо: «высказал бы жалобы» или «рассказал бы о своей тяжбе».'
  rationale: Сочетание ערך, משפט и תוכחות создаёт образ упорядоченного выступления в суде. Перевод сохраняет напряжённость желания Иова представить Богу своё дело, не объявляя его речь ни правомерной, ни дерзкой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим словом «уста». Судебная метафора сохранена ясно, но без излишне специальной юридической терминологии. Заглавная буква в местоимении «Ним» соответствует принятому русскому библейскому регистру.
