  yaml_path: translation/ot/job/023/008.yaml
  text: Look[a], I go east, but he is not there; and west, but I do not perceive him.
translation:
  language: ru
  text: Вот, иду на восток — но Его там нет; на запад — но не могу различить Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иду вперёд… и назад». Еврейские слова могут обозначать как направления «восток… запад», так и «вперёд… назад».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Современное русское «вот» естественно передаёт привлекающую внимание силу еврейской частицы, сохраняя возвышенный поэтический регистр без архаичного «се».
- source_word: קֶדֶם
  choice: на восток
  rationale: В паре с אָחוֹר слово здесь наиболее естественно обозначает одно из противоположных пространственных направлений; при этом возможное значение «вперёд» сохранено в примечании.
- source_word: אֶהֱלֹךְ
  choice: иду
  rationale: Форма глагола הלך описывает движение Иова в поисках Бога; «иду» точно и естественно передаёт действие, не уточняя способ движения.
- source_word: וְאֵינֶנּוּ
  choice: но Его там нет
  rationale: «Но» выражает подразумеваемое противопоставление между поиском и его безрезультатностью, а «там» естественно для русского языка в контексте указанного направления.
- source_word: אָחוֹר
  choice: на запад
  rationale: Как противоположность קֶדֶם, слово может обозначать запад; вариант «назад» отмечен в сноске, чтобы сохранить подлинную пространственную неоднозначность.
- source_word: לֹא אָבִין לוֹ
  choice: не нахожу Его
  rationale: Глагол בין буквально связан с различением и распознаванием; в контексте пространственного поиска «не нахожу» естественно передаёт невозможность обнаружить Бога, хотя несколько конкретизирует образ. Более буквальное «не различаю Его» возможно, но менее естественно после «иду на запад».
theological_decisions:
- issue: К кому относятся местоименные формы третьего лица
  choice: Они относятся к Богу; в переводе употреблено «Его».
  alternative: Оставить референта менее явным или передать местоимение со строчной буквы.
  rationale: В ближайшем контексте Иов говорит о поиске Бога. Явное местоимение оправдано синтаксисом и контекстом; прописная буква соответствует принятой русской библейской издательской практике и не добавляет отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Синтаксический параллелизм оригинала сохранён; архаизмы исключены. Прописное «Его» использовано согласно русской библейской традиции.
