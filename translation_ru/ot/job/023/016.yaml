  text: וְ֭/אֵל הֵרַ֣ךְ לִבִּ֑/י וְ֝/שַׁדַּ֗י הִבְהִילָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/023/016.yaml
  text: But God has made my heart faint[a], and the Almighty has terrified me.
translation:
  language: ru
  text: Но Бог лишил моё сердце мужества[a], и Всемогущий привёл меня в ужас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог сделал моё сердце слабым». Буквально: «сделал моё сердце мягким»; здесь, вероятно, имеется в виду, что Иов утратил мужество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵל
  choice: Но Бог
  rationale: אֵל передано обычным обозначением «Бог». Союз וְ допускает «и», однако здесь речь объясняет страх Иова, поэтому русское «но» естественно передаёт контекстуальный поворот, не меняя смысла.
- source_word: הֵרַךְ
  choice: лишил ... мужества
  rationale: Глагол буквально означает «сделал мягким/слабым». В сочетании с «сердцем» он выражает утрату внутренней твёрдости и отваги; выбранная формулировка ясно передаёт идиоматический смысл.
- source_word: לִבִּי
  choice: моё сердце
  rationale: Сохранён древнееврейский образ сердца как средоточия внутренней силы, воли и мужества.
- source_word: וְשַׁדַּי
  choice: и Всемогущий
  rationale: שַׁדַּי — божественный титул; перевод «Всемогущий» сохраняет его значение и привычен для русской библейской речи.
- source_word: הִבְהִילָנִי
  choice: привёл меня в ужас
  rationale: Порода хифиль глагола בהל означает причинить сильный страх, смятение или ужас. Формулировка сохраняет интенсивность высказывания.
theological_decisions:
- issue: Передача божественных обозначений אֵל и שַׁדַּי
  choice: Бог ... Всемогущий
  alternative: Бог ... Шаддай
  rationale: Первое обозначение передано общим словом «Бог», а второе — смысловым переводом титула. Так сохраняется параллелизм без превращения титула в собственное имя.
- issue: Смысл образа смягчённого сердца
  choice: утрата мужества
  alternative: Бог смягчил моё сердце
  rationale: Контекст говорит о страхе и ужасе Иова, поэтому «смягчение» относится к ослаблению внутренней твёрдости, а не к нравственной восприимчивости. Буквальная возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образ «сердца» сохранён, а непрозрачная буквальная идиома раскрыта естественным выражением; альтернативный буквальный смысл вынесен в сноску.
