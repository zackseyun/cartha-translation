  yaml_path: translation/ot/job/023/006.yaml
  text: Would he contend with me in the greatness of his power? No[a]; surely he would pay attention to me.
translation:
  language: ru
  text: Разве стал бы Он вести со мной тяжбу, опираясь на Свою великую силу? Нет, Он лишь внял бы мне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он обратил бы на меня внимание». Буквально: «Он положил бы во мне»; возможно также: «Он вложил бы в меня силу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְּ/רָב כֹּחַ
  choice: опираясь на Свою великую силу
  rationale: Предлог בְּ с сочетанием רָב כֹּחַ описывает возможность вести тяжбу, пользуясь превосходящей силой. Такой перевод сохраняет компоненты «великая» и «сила» и естественно звучит по-русски.
- source_word: יָרִיב עִמָּדִי
  choice: стал бы Он судиться со мной
  rationale: 'Глагол ריב в контексте Иов 23 имеет судебный оттенок: Иов хочет изложить перед Богом своё дело. «Судиться со мной» передаёт юридическую образность без излишне специальной терминологии.'
- source_word: לֹא אַךְ
  choice: Нет; ... непременно
  rationale: Сочетание выражает решительное отрицание поставленной возможности и последующий усилительный поворот к тому, что, по убеждению Иова, произошло бы на самом деле.
- source_word: יָשִׂם בִּי
  choice: Он ... выслушал бы меня
  rationale: Оборот שׂים ב может означать направить на кого-либо внимание, принять его слова во внимание. В судебном контексте «выслушал бы меня» ясно выражает надежду Иова на то, что Бог даст ему возможность представить своё дело; иные возможные значения отмечены в сноске.
theological_decisions:
- issue: Смысл действия Бога во второй части стиха
  choice: Иов уверен, что Бог не подавил бы его силой, а выслушал бы его дело.
  alternative: Бог вложил бы в Иова силу; либо Бог обратил бы на Иова внимание в более общем смысле.
  rationale: 'Непосредственный контекст носит судебный характер: Иов стремится предстать перед Богом и изложить своё дело (23:3–7). Поэтому значение «выслушал бы меня» наиболее уместно, но лексическая неоднозначность не устраняется и отражена в сноске. Так сохраняется напряжение между могуществом Бога и уверенностью Иова в справедливом разбирательстве.'
translation_notes:
  register: Современный литературный русский язык; тон достоинственный и понятный. Заглавные местоимения при обращении к Богу употреблены в соответствии с распространённой русской библейской традицией. Судебная образность контекста сохранена.
