lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: которые … радуются
  rationale: Артикль с причастием образует субстантивированную конструкцию и продолжает описание людей из предыдущего стиха. Относительное предложение естественно передаёт эту связь по-русски.
- source_word: אֱלֵי גִיל
  choice: безмерно
  rationale: Буквально «до/к ликованию»; идиоматическое сочетание усиливает степень радости. «Безмерно» звучит естественно и сохраняет интенсивность.
- source_word: יָשִׂישׂוּ
  choice: ликуют
  rationale: Глагол обозначает бурную радость. «Ликуют» сохраняет поэтическое нарастание и не повторяет предыдущее «радуются».
- source_word: כִּי
  choice: когда
  rationale: Союз вводит обстоятельство, при котором люди ликуют. В данном контексте временное прочтение естественно, хотя возможен и причинный смысл.
- source_word: יִמְצְאוּ
  choice: находят
  rationale: Прямой и лаконичный эквивалент, сохраняющий резкость еврейского выражения.
- source_word: קָבֶר
  choice: могилу
  rationale: Существительное употреблено без артикля и может пониматься неопределённо или обобщённо. В русском винительный падеж без уточнения естественно допускает оба оттенка.
theological_decisions:
- issue: Временное или причинное значение כִּי
  choice: когда
  alternative: потому что
  rationale: Контекст позволяет оба прочтения; основным выбрано естественное временное значение, а причинное сохранено в сноске.
