translation_notes:
  register: Современный литературный русский язык с поэтической выразительностью. Буквальная метафора «копают её» заменена естественным «ищут её», поскольку следующий образ скрытых сокровищ сохраняет подразумеваемое копание. Строка заканчивается запятой, так как синтаксически продолжается в следующем стихе.
