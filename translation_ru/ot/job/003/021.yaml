  text: who wait for death[a], but it does not come, and dig for it more than for hidden treasures,
translation:
  language: ru
  text: которые ждут смерти[a], а она не приходит, и копают в поисках её усерднее, чем в поисках скрытых сокровищ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а её нет»; буквально в еврейском тексте: «и её нет», то есть смерть не является, не наступает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְחַכִּים
  choice: которые ждут
  rationale: Причастие от חכה обозначает ожидание, нередко напряжённое; «ждут» прямо передаёт основное значение, тогда как страстность ожидания раскрывается контекстом.
- source_word: לַמָּוֶת
  choice: смерти
  rationale: Предлог ל с существительным указывает на объект ожидания; по-русски это естественно передаётся беспредложным родительным падежом после «ждать».
- source_word: וְאֵינֶנּוּ
  choice: а она не приходит
  rationale: 'Буквально: «и её нет»; местоименный суффикс относится к смерти. В контексте выражение означает, что ожидаемая смерть не наступает. Союз «а» естественно передаёт противопоставление.'
- source_word: וַיַּחְפְּרֻהוּ
  choice: и ищут её
  rationale: Глагол חפר буквально значит «копать», но с прямым объектом «её» здесь метафорически обозначает настойчивые поиски. Русское «копают её» неестественно и может ошибочно означать рытьё самой смерти; образ копания поддерживается упоминанием скрытых сокровищ.
- source_word: מִמַּטְמוֹנִים
  choice: усерднее, чем скрытые сокровища
  rationale: מַטְמוֹן — спрятанное или хранимое сокровище, а מן имеет сравнительную силу. «Усерднее, чем» ясно выражает интенсивность поисков и сохраняет связь со скрытым кладом.
