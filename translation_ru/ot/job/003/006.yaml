  text: הַ/לַּ֥יְלָה הַ/הוּא֮ יִקָּחֵ֪/ה֫וּ אֹ֥פֶל אַל יִ֭חַדְּ בִּ/ימֵ֣י שָׁנָ֑ה בְּ/מִסְפַּ֥ר יְ֝רָחִ֗ים אַל יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/006.yaml
  text: As for that night[a], let darkness seize it; let it not rejoice among the days of the year; let it not enter into the number of the months.
translation:
  language: ru
  text: А ту ночь пусть заберёт мрак; пусть не радуется она среди дней года[a] и не войдёт в число месяцев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть она не будет причислена к дням года». Еврейский глагол здесь редок; его можно понимать либо как указание на радость, либо как указание на включение в годовой круг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלַּיְלָה הַהוּא
  choice: А ту ночь
  rationale: Вынесение дополнения в начало сохраняет подчёркнутое тематическое положение еврейской фразы; частица «а» естественно связывает её с проклятием дня в предыдущем стихе.
- source_word: יִקָּחֵהוּ
  choice: пусть заберёт её
  rationale: Глагол לקח буквально означает «взять, забрать». Такой перевод сохраняет олицетворение мрака и враждебный оттенок, не усиливая его до «поглотит».
- source_word: אֹפֶל
  choice: мрак
  rationale: Слово обозначает густую тьму, мрак; «мрак» передаёт поэтическую силу контекста естественнее, чем нейтральная «темнота».
- source_word: אַל יִחַדְּ
  choice: пусть не радуется
  rationale: Редкая форма допускает понимание радостного участия в годовом круге. Этот смысл оставлен в тексте, а возможное значение присоединения или причисления указано в сноске.
- source_word: בִּימֵי שָׁנָה
  choice: среди дней года
  rationale: Предлог ב передаёт включённость в совокупность; «среди дней года» естественно выражает принадлежность годовому кругу.
- source_word: בְּמִסְפַּר יְרָחִים
  choice: в число месяцев
  rationale: Перевод сохраняет образ счёта и включения в исчисляемую совокупность месяцев.
- source_word: אַל יָבֹא
  choice: не войдёт
  rationale: Буквальное значение בוא — «войти, прийти»; с выражением «в число» глагол «войти» звучит по-русски естественно и сохраняет исходный образ.
theological_decisions:
- issue: Смысл редкого глагола יִחַדְּ
  choice: В основном тексте сохранено значение «радоваться».
  alternative: «быть присоединённой / причисленной» к дням года
  rationale: Контекст допускает как образ радостного участия, так и календарного включения. Поскольку лексическая неоднозначность подлинна и влияет на образ стиха, альтернативу следует сохранить в сноске, не выдавая одну трактовку за бесспорную.
translation_notes:
  register: Современный литературный русский с поэтической сдержанностью. Сохранены олицетворение мрака, параллельные пожелания-проклятия и образ календарного счёта; редкая лексическая неоднозначность не устранена.
