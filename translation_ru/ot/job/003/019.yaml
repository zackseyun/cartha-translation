  text: קָטֹ֣ן וְ֭/גָדוֹל שָׁ֣ם ה֑וּא וְ֝/עֶ֗בֶד חָפְשִׁ֥י מֵ/אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/019.yaml
  text: The small and the great are there[a], and the servant is free from his master.
translation:
  language: ru
  text: Там — и малый, и великий, и раб свободен от своего господина.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָטֹן
  choice: малый
  rationale: В противопоставлении с גָדוֹל обозначает человека невысокого положения или малой значимости; краткая субстантивированная форма сохраняет ёмкость еврейского выражения.
- source_word: גָדוֹל
  choice: великий
  rationale: В паре с קָטֹן указывает на человека высокого положения или большой значимости; традиционная и понятная антитеза «малый и великий» естественна по-русски.
- source_word: שָׁם
  choice: там
  rationale: Отсылает к месту смерти, описанному в ближайшем контексте, и прямо передаёт указательное значение.
- source_word: הוּא
  choice: — там
  rationale: Формально единственное местоимение входит в именную конструкцию после парного подлежащего. В русском естественно передать её эллиптически с тире, не добавляя отсутствующего в еврейском слова «равны» или «одинаковы».
- source_word: עֶבֶד
  choice: раб
  rationale: Контраст со свободой от господина подчёркивает несвободный, зависимый статус; «раб» передаёт его яснее, чем более широкое «слуга».
- source_word: חָפְשִׁי
  choice: свободен
  rationale: Прилагательное прямо обозначает свободу в противоположность рабскому состоянию.
- source_word: מֵאֲדֹנָיו
  choice: от своего господина
  rationale: Предлог выражает освобождение от власти, а אֲדֹנָיו обозначает господина данного раба; «своего» естественно передаёт притяжательный суффикс третьего лица.
theological_decisions:
- issue: Равенство людей перед смертью
  choice: Не добавлять «равны» или «одинаковы»
  alternative: «Малый и великий там равны»
  rationale: Контекст предполагает общее положение малого и великого в смерти, однако еврейский текст прямо не выражает равенство отдельным словом. Эллиптическая конструкция сохраняет смысловую напряжённость и не усиливает утверждение.
translation_notes:
  register: Современный литературный русский с краткой, торжественной синтаксической формой. Антитеза «малый и великий» сохранена; тире перед «там» делает именную конструкцию естественной без смыслового добавления.
