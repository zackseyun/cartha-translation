base_translation:
  language: en
  yaml_path: translation/ot/job/003/009.yaml
  text: May the stars of its twilight be dark[a]; may it wait for light, but there be none[b], and may it not see the eyelids of dawn.
translation:
  language: ru
  text: Да померкнут звёзды его сумерек[a]; пусть оно ждёт света — но света не будет, и да не увидит оно век зари[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звёзды его вечерних сумерек». Еврейское слово обозначает сумерки, особенно вечерние.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «веки зари» — еврейский поэтический образ первых проблесков утреннего света.'
    reason: cultural_note
lexical_decisions:
- source_word: יֶחְשְׁכוּ
  choice: да померкнут
  rationale: Форма глагола в контексте проклятия выражает пожелание. «Да померкнут» естественно передаёт оптативную силу и поэтический регистр.
- source_word: כּוֹכְבֵי נִשְׁפּוֹ
  choice: звёзды его сумерек
  rationale: Сопряжённая конструкция буквально означает «звёзды его сумерек»; местоименный суффикс относится к олицетворённой ночи.
- source_word: נִשְׁפּוֹ
  choice: его сумерек
  rationale: Существительное обозначает сумерки, особенно вечерние; вариант «вечерней мглы» возможен, но менее точно сохраняет образ.
- source_word: יְקַו לְאוֹר
  choice: пусть оно ждёт света
  rationale: קוה допускает значения «ждать» и «надеяться». Здесь ожидание света лучше соответствует параллельной строке и не усиливает психологизацию олицетворённой ночи.
- source_word: וָאַיִן
  choice: но света не будет
  rationale: Эллиптическое «и нет» передаёт тщетность ожидания. Повтор слова «свет» делает русскую фразу ясной, сохраняя смысл.
- source_word: וְאַל יִרְאֶה
  choice: и да не увидит оно
  rationale: Сочетание אַל с имперфектом выражает отрицательное пожелание в продолжающемся проклятии.
- source_word: בְּעַפְעַפֵּי שָׁחַר
  choice: ресниц зари
  rationale: Буквальный поэтический образ «веки/ресницы зари» обозначает первые проблески рассвета. «Ресницы зари» звучит естественно и образно по-русски, не устраняя метафору.
