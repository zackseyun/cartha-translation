lexical_decisions:
- source_word: מַדּוּעַ
  choice: Зачем
  rationale: Вопросительное наречие вводит скорбный вопрос Иова о цели или причине; в данном контексте естественное русское «зачем» точнее передаёт направленность вопроса, чем более нейтральное «почему».
- source_word: קִדְּמוּנִי
  choice: приняли меня
  rationale: Форма от קדם здесь означает выйти навстречу, встретить или принять. В сочетании с «коленями» речь идёт о принятии новорождённого при рождении; «приняли меня» сохраняет образ и понятно по-русски.
- source_word: בִרְכָּיִם
  choice: колени
  rationale: Сохранено конкретное значение множественного числа. Вероятно, имеется в виду принятие младенца на колени, однако это толкование не подменяет образ в основном тексте.
- source_word: וּמַה
  choice: и зачем
  rationale: Буквально «и что», но в вопросительном параллелизме выражение продолжает первый вопрос и естественно передаётся как «и зачем».
- source_word: שָׁדַיִם
  choice: груди
  rationale: Сохранён прямой анатомический образ без добавления отсутствующего в еврейском тексте определения «материнские».
- source_word: כִּי
  choice: чтобы
  rationale: Союз вводит целевое или результирующее продолжение второго вопроса; «чтобы» естественно связывает груди с кормлением младенца.
- source_word: אִינָק
  choice: мне сосать
  rationale: Глагол обозначает действие младенца, сосущего молоко. Формулировка недвусмысленно сохраняет активность младенца и точнее оригинала, чем русское «кормиться грудью».
