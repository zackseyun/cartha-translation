  text: כִּ֤י פַ֣חַד פָּ֭חַדְתִּי וַ/יֶּאֱתָיֵ֑/נִי וַ/אֲשֶׁ֥ר יָ֝גֹ֗רְתִּי יָ֣בֹא לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/025.yaml
  text: For the dread I dreaded has come upon me[b][a], and what I feared has come to me.
translation:
  language: ru
  text: Ибо страх, которого я страшился, настиг меня[a][b], и то, чего я боялся, пришло ко мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, чего я страшился, настигло меня». В еврейском тексте существительное и однокоренной глагол (буквально: «страх, которого я страшился») служат для усиления.'
    reason: lexical_alternative
  - marker: b
    text: Глагол в первой части, вероятно, означает «настиг меня» или «обрушился на меня», тогда как во второй части более буквально сказано «пришло ко мне»; так сохраняется небольшое различие внутри еврейского параллелизма.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит объяснение предшествующей жалобы Иова; «ибо» естественно передаёт причинно-пояснительную связь и соответствует достоинству поэтической речи.
- source_word: פַחַד / פָּחַדְתִּי
  choice: страх, которого я страшился
  rationale: Сочетание существительного с однокоренным глаголом намеренно сохраняет усилительный повтор еврейского текста, хотя по-русски он звучит необычно.
- source_word: וַיֶּאֱתָיֵנִי
  choice: настиг меня
  rationale: Глагол обозначает наступление или приход бедствия; «настиг меня» передаёт угрожающий характер случившегося и сохраняет отличие от более буквального «пришло ко мне» во второй строке.
- source_word: וַאֲשֶׁר
  choice: и то, чего
  rationale: Так естественно вводится относительная конструкция второй параллельной строки.
- source_word: יָגֹרְתִּי
  choice: я боялся
  rationale: Глагол означает испытывать страх или ужас; нейтральное «боялся» сохраняет параллелизм, не повторяя усилительную однокоренную конструкцию первой строки.
- source_word: יָבֹא לִי
  choice: пришло ко мне
  rationale: Сохраняется простой образ движения и небольшое лексическое различие между двумя параллельными строками; совершенный вид передаёт уже осуществившееся бедствие.
