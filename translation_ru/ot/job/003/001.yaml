  text: אַחֲרֵי כֵ֗ן פָּתַ֤ח אִיּוֹב֙ אֶת פִּ֔י/הוּ וַ/יְקַלֵּ֖ל אֶת יוֹמֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/003/001.yaml
  text: After this[a], Job opened his mouth and cursed his day.
translation:
  language: ru
  text: После этого Иов открыл уста и проклял свой день[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «день своего рождения». В еврейском тексте буквально: «его день».'
    reason: лексическое пояснение выражения אֶת יוֹמוֹ
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: После этого
  rationale: Обычный временной переход со значением «после этого/того»; формулировка естественна для современного русского языка и сохраняет последовательность повествования.
- source_word: פָּתַח ... אֶת פִּיהוּ
  choice: открыл уста
  rationale: Сохранён еврейский речевой оборот, вводящий последующую речь. «Уста» придаёт фразе уместную торжественность и звучит естественнее в этом устойчивом сочетании, чем буквальное «открыл свой рот».
- source_word: אִיּוֹב
  choice: Иов
  rationale: Традиционная и общеупотребительная русская передача имени.
- source_word: וַיְקַלֵּל
  choice: проклял
  rationale: Порода пиэль глагола קלל здесь означает «проклинать». Выбор не смягчает резкость исходного текста.
- source_word: אֶת יוֹמוֹ
  choice: свой день
  rationale: Буквально — «его/свой день». Возвратное притяжательное местоимение естественно по-русски при подлежащем «Иов» и сохраняет краткость оригинала; из последующего контекста становится ясно, что имеется в виду день его рождения.
theological_decisions:
- issue: Следует ли прямо уточнить, что «свой день» означает день рождения Иова
  choice: Сохранить в основном тексте краткое выражение «свой день»
  alternative: «день своего рождения»; «свой день рождения»
  rationale: В данном стихе еврейский текст прямо не упоминает рождение, хотя последующие стихи проясняют смысл. Сохранение буквальной краткости позволяет разворачиваться мысли самого текста и не вносит пояснение раньше оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «открыл уста». Конструкция ясна обычному читателю; архаические формы и конфессионально окрашенные толкования не используются.
