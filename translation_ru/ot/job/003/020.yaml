  yaml_path: translation/ot/job/003/020.yaml
  text: Why is light given to the troubled[b][a], and life to the bitter in soul?
translation:
  language: ru
  text: Почему страдальцу даётся[a] свет[b], и жизнь — тем, чья душа горька?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему он даёт свет страдальцу…?» В еврейском тексте стоит форма «он даёт», но сам дающий не назван; по контексту, вероятно, подразумевается Бог.'
    reason: alternative_reading
  - marker: b
    text: «Свет» — поэтический образ продолжающегося существования; еврейский текст сохраняет эту метафору, не заменяя её словом «жизнь» в первой части стиха.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Зачем
  rationale: Вопросительное наречие вводит скорбный вопрос Иова о цели продолжающейся жизни; «зачем» естественно передаёт направленность вопроса, не ослабляя его остроты.
- source_word: יִתֵּן
  choice: даётся
  rationale: Еврейская форма буквально означает «он даёт», но подлежащее не названо. Возвратно-пассивная конструкция позволяет по-русски не называть дающего и сохраняет напряжение исходного текста.
- source_word: לְעָמֵל
  choice: страдальцу
  rationale: В данном контексте עָמֵל обозначает человека, изнурённого бедствием и горем, а не просто занятого тяжёлым трудом. «Страдалец» кратко и поэтично передаёт это значение.
- source_word: אוֹר
  choice: свет
  rationale: Сохранён буквальный поэтический образ исходного текста; здесь свет подразумевает продолжающееся земное существование, но метафора не раскрывается в основном тексте.
- source_word: וְחַיִּים
  choice: жизнь
  rationale: Форма חַיִּים морфологически множественная, но обычно означает жизнь как единое понятие; русский эквивалент естественно употребляется в единственном числе.
- source_word: לְמָרֵי נָפֶשׁ
  choice: тем, чья душа полна горечи
  rationale: Выражение буквально описывает «горьких душой». Выбранная формулировка сохраняет образ внутренней горечи и слово «душа», оставаясь ясной и естественной для современного читателя.
theological_decisions:
- issue: Неявное подлежащее при יִתֵּן
  choice: Не называть дающего, употребив «даётся».
  alternative: '«Зачем он даёт…» или более явно: «Зачем Бог даёт…»'
  rationale: По контексту подразумеваемым дающим, вероятно, является Бог, однако в самом стихе он прямо не назван. Неявность сохранена, чтобы не делать жалобу Иова более прямым обвинением, чем в еврейском тексте.
translation_notes:
  register: Современный литературный русский с лаконичным, скорбно-поэтическим звучанием. Синтаксический параллелизм двух частей сохранён; тире во второй части естественно восполняет сказуемое. Формулировка избегает как архаического «горьким душою», так и разговорного «у кого горько на душе».
