    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְאָלֻהוּ
  choice: вернут его себе
  rationale: Глагол גאל обозначает возвращение или истребование принадлежащего своему роду. В контексте проклятия дня выражение передаёт образ того, как тьма забирает день обратно, не привнося положительных богословских ассоциаций слова «искупить».
- source_word: חֹשֶׁךְ
  choice: тьма
  rationale: Прямое и поэтически уместное соответствие образу отсутствия света.
- source_word: צַלְמָוֶת
  choice: глубокий мрак
  rationale: Передаёт интенсивную тьму, не разрешая спорную этимологию слова в пользу обязательного упоминания смерти; традиционное понимание отмечено в сноске.
- source_word: תִּשְׁכָּן עָלָיו
  choice: да поселится над ним
  rationale: Сохраняет основное значение שׁכן — «обитать, поселяться» — и пространственное отношение, выраженное עַל.
- source_word: עֲנָנָה
  choice: облако
  rationale: Сохраняет конкретный метеорологический образ и единственное число.
- source_word: יְבַעֲתֻהוּ
  choice: да устрашат его
  rationale: Порода пиэль глагола בעת выражает причинение сильного страха или ужаса; форма пожелания соответствует ряду проклятий.
- source_word: כִּמְרִירֵי יוֹם
  choice: помрачения дня
  rationale: Трудное выражение передано словом, сохраняющим образ наступающей среди дня тьмы и необычность еврейского множественного числа; возможные иные толкования вынесены в сноску.
