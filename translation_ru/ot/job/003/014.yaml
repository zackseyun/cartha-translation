  text: עִם מְ֭לָכִים וְ/יֹ֣עֲצֵי אָ֑רֶץ הַ/בֹּנִ֖ים חֳרָב֣וֹת לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/014.yaml
  text: with kings and counselors of the earth, who built ruins for themselves,
translation:
  language: ru
  text: 'с царями и советниками земли,

    строившими себе развалины[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пустынные места»; возможно также, речь идёт о восстановлении развалин.'
    reason: Слово חֳרָבוֹת обозначает развалины или опустошённые места, а сочетание с глаголом «строить» остаётся неоднозначным.
lexical_decisions:
- source_word: מְלָכִים
  choice: царями
  rationale: Прямой и естественный эквивалент множественного числа «цари».
- source_word: יֹעֲצֵי אָרֶץ
  choice: советниками земли
  rationale: Сохраняет широкое обозначение влиятельных правителей и советников мира, не сужая אָרֶץ до одной конкретной страны.
- source_word: הַבֹּנִים חֳרָבוֹת לָמוֹ
  choice: строившими себе развалины
  rationale: Передаёт намеренно необычное сочетание «строить» и «развалины», не добавляя отсутствующей в тексте идеи восстановления или дворцов.
theological_decisions:
- issue: Назначение построек и смысл «развалин»
  choice: Не уточнять, что речь идёт о гробницах, дворцах или восстановленных городах.
  alternative: «восстанавливавшими для себя разрушенные города» или «строившими себе гробницы»
  rationale: Древнееврейский текст допускает разные объяснения необычного выражения, но прямо не называет ни гробниц, ни городов и не употребляет глагол «восстанавливать».
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и смысловой необычности исходного выражения. Причастный оборот связывает строку с контекстом предыдущего стиха.
