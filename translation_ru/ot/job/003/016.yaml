  text: א֤וֹ כְ/נֵ֣פֶל טָ֭מוּן לֹ֣א אֶהְיֶ֑ה כְּ֝/עֹלְלִ֗ים לֹא רָ֥אוּ אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/016.yaml
  text: Or like a hidden miscarriage[a], I would not be[b], like infants who never saw light.
translation:
  language: ru
  text: Или я не существовал бы — как сокрытый выкидыш[a], как младенцы, не увидевшие света[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «как сокрытый мертворождённый ребёнок». Еврейское слово может обозначать плод, погибший при выкидыше, или мертворождённого ребёнка.'
    reason: lexical_alternative
  - marker: b
    text: «Не увидеть света» — образное выражение, означающее не войти в земную жизнь и не испытать её.
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: Или
  rationale: Вводит ещё один образ в ряду размышлений Иова о том, что лучше было бы не родиться; простой союз естественно передаёт связь с предыдущим стихом.
- source_word: כְ/נֵ֣פֶל
  choice: как сокрытый выкидыш
  rationale: Существительное נֵפֶל обозначает плод, погибший при выкидыше, либо мертворождённого ребёнка. «Выкидыш» прямо передаёт образ не начавшейся земной жизни, а «сокрытый» сохраняет значение причастия טָמוּן без уточнения, идёт ли речь именно о погребении.
- source_word: לֹ֣א אֶהְיֶ֑ה
  choice: я не существовал бы
  rationale: Буквально «я не был бы». В современном русском «не существовал бы» ясно выражает желаемое Иовом отсутствие земного бытия и звучит естественнее, чем «не был бы» без дополнения.
- source_word: כְ֝/עֹלְלִ֗ים
  choice: как младенцы
  rationale: עֹלְלִים обозначает совсем маленьких детей; «младенцы» точно и достойно соответствует контексту.
- source_word: לֹא רָ֥אוּ אֽוֹר
  choice: не увидевшие света
  rationale: Сохранён еврейский образ «увидеть свет», который в данном контексте означает войти в земную жизнь или испытать её.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением краткого, мрачного параллелизма еврейской поэзии. Перестановка сказуемого в начало делает фразу естественной по-русски, не устраняя напряжение между единственным числом («я») и собирательным сравнением во множественном числе («младенцы»).
