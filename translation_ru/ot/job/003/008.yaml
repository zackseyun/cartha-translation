  text: יִקְּבֻ֥/הוּ אֹרְרֵי י֑וֹם הָ֝/עֲתִידִ֗ים עֹרֵ֥ר לִוְיָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/008.yaml
  text: Let those who curse days curse it, those ready to rouse Leviathan.
translation:
  language: ru
  text: Пусть проклинающие дни проклянут его — те, кто готов разбудить Левиафана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто умеет пробудить Левиафана». Еврейское הָעֲתִידִים может обозначать готовность, а в данном контексте — также способность или искусность.'
    reason: Передаёт возможный оттенок значения הָעֲתִידִים, не заменяя основной перевод толковательным.
lexical_decisions:
- source_word: אֹרְרֵי יוֹם
  choice: проклинающие дни
  rationale: Формально сохраняет множественное по смыслу обозначение людей, «проклинающих дни», не сужая его до проклинающих именно этот день.
- source_word: הָעֲתִידִים
  choice: способные
  rationale: В данном контексте означает готовность или умение совершить названное действие; «способные» естественно передаёт подразумеваемую искусность заклинателей.
- source_word: עֹרֵר
  choice: разбудить
  rationale: Передаёт каузативное значение «пробудить, поднять» и сохраняет образ спящего или покоящегося существа.
- source_word: לִוְיָתָן
  choice: Левиафана
  rationale: Транслитерация традиционного имени мифопоэтического морского существа сохраняет образ исходного текста без рационализации.
theological_decisions:
- issue: Статус Левиафана
  choice: Сохранено имя «Левиафан» без поясняющей идентификации
  alternative: «морское чудовище» или отождествление с конкретным животным
  rationale: Стих использует поэтический образ и не требует ни буквального зоологического, ни догматического уточнения.
- issue: Отнесение местоимения в «יִקְּבֻהוּ»
  choice: «её» — к ночи из стиха 6
  alternative: «его» — к дню из стиха 3 или ближайшему «дню» в этой строке
  rationale: Женский род местоименного суффикса естественно отсылает к לַיְלָה «ночь» в предыдущем стихе; русский женский род делает эту связь явной.
translation_notes:
  register: Современный литературный русский язык с сохранением высокого поэтического регистра проклятия Иова. Инверсия сведена к минимуму, а образ Левиафана сохранён без демифологизации.
