lexical_decisions:
- source_word: שָׁם
  choice: там
  rationale: Простое указательное наречие сохраняет отсылку к месту, о котором говорится в плаче Иова, и поддерживает поэтический параллелизм.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Традиционное и понятное субстантивированное обозначение нравственно порочных людей; оно не сводит значение лишь к юридической виновности.
- source_word: חָדְלוּ
  choice: перестают
  rationale: Настоящее время естественно передаёт обобщённое описание этого места; глагол сохраняет значение прекращения действия или состояния.
- source_word: רֹגֶז
  choice: буйствовать
  rationale: В сочетании с חָדְלוּ передаёт прекращение беспокойного, яростного поведения нечестивых. Поскольку существительное допускает значения волнения, ярости и смуты, неоднозначность отмечена в сноске.
- source_word: וְשָׁם
  choice: и там
  rationale: Повтор наречия вместе с союзом сохраняет структуру и акцент второй половины поэтической строки.
- source_word: יָנוּחוּ
  choice: обретают покой
  rationale: Естественно по-русски выражает переход к покою, заложенный в глаголе נוח, и соответствует контексту речи о месте упокоения.
- source_word: יְגִיעֵי כֹחַ
  choice: обессиленные
  rationale: Кратко и естественно передаёт людей, изнурённых до утраты сил; буквальный образ «утомлённые силой» в русском неясен, поэтому он пояснён в сноске.
