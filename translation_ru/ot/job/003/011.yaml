  text: Why did I not die from the womb[b][a], and come out from the belly and expire?
translation:
  language: ru
  text: Почему я не умер при выходе из утробы[a], не испустил дух, выйдя из чрева?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из утробы». Еврейский текст употребляет здесь два близких, но разных слова: «утроба» и «чрево».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не умер». Глагол, переданный словами «испустил дух», отличается от первого глагола «умереть» и может обозначать кончину, последний вздох.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Естественно передаёт вопрос о причине и сохраняет тон скорбного вопрошания Иова.
- source_word: מֵרֶחֶם
  choice: выходя из утробы
  rationale: רֶחֶם означает материнскую утробу; деепричастный оборот естественно передаёт в русском образ смерти при появлении на свет, не сводя выражение к более отвлечённому «при рождении».
- source_word: אָמוּת
  choice: я не умер
  rationale: Форма 1-го лица в контексте сетования выражает вопрос о неосуществившемся событии в прошлом; прошедшее время естественно для русского языка.
- source_word: מִבֶּטֶן
  choice: из чрева
  rationale: בֶּטֶן может обозначать живот или материнское чрево. «Чрево» сохраняет родильный образ и позволяет отразить отличие этого слова от רֶחֶם.
- source_word: יָצָאתִי
  choice: выйдя
  rationale: Передаёт буквальный образ выхода из материнского чрева, а не заменяет его толкованием «родившись».
- source_word: וְאֶגְוָע
  choice: и не испустил дух
  rationale: גוע обозначает угасание жизни, кончину; выражение «испустить дух» сохраняет отличие от מות «умереть» и звучит понятно и достойно.
theological_decisions:
- issue: Связь двух частей вопроса и область действия отрицания
  choice: 'Во второй части отрицание повторено: «и не испустил дух»'
  alternative: «вышел из чрева — и испустил дух»
  rationale: В еврейском отрицание выражено один раз, однако по смыслу скорбного вопроса оно распространяется на параллельную вторую часть. Повтор в русском устраняет ложное впечатление, будто Иов утверждает, что действительно испустил дух, и не снимает напряжения его желания умереть при рождении.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма. «Чрево» и «испустить дух» несколько возвышенны, но понятны современному читателю и уместны в поэтической речи; синтаксис остаётся естественным.
