  source_fidelity: Текст точно передаёт юссивно-проклинательную силу יֹאבַד («Да погибнет»), оба параллельных объекта проклятия и пассивный смысл אִוָּלֶד בּוֹ («в который я родился»). «Зачат» удачно воспроизводит совершившееся зачатие в הֹרָה, не делая ночь действующим субъектом. «Мальчик» является контекстуально естественным русским выражением для גָבֶר в формуле возвещения о зачатии; сноска надлежащим образом сохраняет более буквальное значение «мужчина» и уточняет контекстуальный смысл.
