  text: May the day perish on which I was born[a], and the night that said, ‘A man is conceived.’
translation:
  language: ru
  text: 'Да погибнет день, в который я родился, и ночь, сказавшая: «Зачат мальчик!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «мужчина»; здесь — ребёнок мужского пола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאבַד
  choice: Да погибнет
  rationale: Юссивно-проклинательная сила передана формулой пожелания «да погибнет», а не простым будущим временем.
- source_word: יוֹם
  choice: день
  rationale: По контексту имеется в виду определённый день — день рождения Иова; определённость естественно выражается придаточным предложением.
- source_word: אִוָּלֶד בּוֹ
  choice: в который я родился
  rationale: Нифаль глагола ילד передаёт значение «я родился»; предлог ב сохранён естественным русским оборотом «в который».
- source_word: וְהַלַּיְלָה
  choice: и ночь
  rationale: Вторая часть присоединяет ночь как параллельный объект проклятия.
- source_word: אָמַר
  choice: сказавшая
  rationale: Причастный оборот естественно сохраняет олицетворение ночи, возвещающей зачатие.
- source_word: הֹרָה
  choice: зачат
  rationale: Краткая страдательная форма по-русски ясно выражает совершившееся зачатие, не представляя ночь субъектом зачатия.
- source_word: גָבֶר
  choice: мальчик
  rationale: גבר обозначает лицо мужского пола; в контексте возвещения о зачатии естественное русское соответствие — «мальчик», тогда как буквальное «мужчина» звучит неестественно применительно к зачатому ребёнку.
