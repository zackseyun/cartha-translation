  text: א֣וֹ עִם שָׂ֭רִים זָהָ֣ב לָ/הֶ֑ם הַֽ/מְמַלְאִ֖ים בָּתֵּי/הֶ֣ם כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/015.yaml
  text: or with princes who had gold[b][a], who filled their houses with silver—
translation:
  language: ru
  text: или с правителями[a], у которых было золото, которые наполняли свои дома[b] серебром, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князьями», «вельможами» (שָׂרִים).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дома»; по контексту возможно «дворцы», но это значение конкретнее исходного текста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: или
  rationale: Продолжает ряд нереализованных возможностей в стихах 13–16; простой союз естественно сохраняет поэтическую последовательность.
- source_word: עִם
  choice: с
  rationale: Предлог обозначает пребывание вместе с умершими правителями; «с» прямо и естественно передаёт эту связь.
- source_word: שָׂרִים
  choice: правителями
  rationale: Слово обозначает людей высокого положения и власти. «Правители» понятно современному читателю и не предполагает наследственного титула, которого еврейский текст не уточняет.
- source_word: זָהָב לָהֶם
  choice: у которых было золото
  rationale: Идиоматическая конструкция выражает обладание; такой перевод естественен по-русски и сохраняет образ золота.
- source_word: הַמְמַלְאִים
  choice: которые наполняли
  rationale: Причастие дополнительно характеризует правителей; относительное придаточное естественно передаёт его функцию в русском языке.
- source_word: בָּתֵּיהֶם
  choice: свои дома
  rationale: Исходное существительное буквально означает «дома». Возвратное «свои» устраняет неестественную для русского языка двусмысленность принадлежности, не меняя смысла.
- source_word: כָּסֶף
  choice: серебром
  rationale: В контексте образов богатства речь идёт о драгоценном металле; «деньгами» ослабило бы конкретную поэтическую картину.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис сохраняет зависимость от предыдущего стиха, поэтому в конце оставлено тире. Повтор «у которых… которые» отражает две последовательные характеристики одной группы и не устраняет структуру оригинала.
