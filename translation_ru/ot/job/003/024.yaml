- source_word: וַיִּתְּכוּ
  choice: льются
  rationale: Естественно сочетается в русском языке со сравнением «как вода» и передаёт образ неудержимого излияния.
- source_word: כַמַּיִם
  choice: как вода
  rationale: Сохраняет прямое сравнение исходного текста.
- source_word: שַׁאֲגֹתָי
  choice: вопли мои
  rationale: Слово связано с громким рёвом или криком. «Вопли» естественно выражает силу человеческого страдания, а буквальный животный оттенок указан в сноске.
