  text: For now I would have lain down and been quiet[b][a]; I would have slept—then I would have been at rest.
translation:
  language: ru
  text: Ведь теперь я лёг бы и был бы спокоен; уснул бы — и тогда был бы мне покой.[a]
  philosophy: optimal-equivalence
  footnotes:
