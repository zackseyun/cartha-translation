lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-пояснительную связь с предшествующим желанием Иова и естественно звучит в русском поэтическом рассуждении.
- source_word: עַתָּה
  choice: теперь
  rationale: Сохраняет временное значение наречия; контекст и сослагательное наклонение передают подразумеваемый результат несбывшегося условия.
- source_word: שָׁכַבְתִּי
  choice: я лежал бы
  rationale: Передаёт телесный образ лежания, не заменяя его прямым указанием на смерть.
- source_word: וְאֶשְׁקֹט
  choice: спокойно
  rationale: Наречие при «лежал бы» естественно передаёт состояние тишины и невозмутимости, выраженное שׁקט, без усиленного толкования как примирения или благополучия.
- source_word: יָשַׁנְתִּי
  choice: спал бы
  rationale: Сохраняет обычный глагол «спать» и его поэтическую метафоричность, не раскрывая её как прямое утверждение о смерти.
- source_word: אָז
  choice: тогда
  rationale: 'Передаёт следующий этап поэтической последовательности: лежать спокойно, спать, обрести покой.'
- source_word: יָנוּחַ לִי
  choice: был бы мне покой
  rationale: Близко сохраняет конструкцию с לִי и её несколько безличный оттенок; русский оборот естественен и отличает заключительный «покой» от предыдущего спокойного лежания.
theological_decisions:
- issue: Образ смерти через лежание, сон и покой
  choice: Сохранить буквальные образы лежания, сна и покоя, не превращая их в прямое догматическое утверждение о состоянии умерших.
  alternative: Перевести «умер бы» или добавить «покой смерти».
  rationale: Еврейский текст описывает желанную смерть поэтическими обычными глаголами. Их сохранение удерживает образность и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным поэтическим ритмом. «Ведь» связывает стих с предыдущим контекстом; инверсия «был бы мне покой» сохраняет близость к еврейской конструкции без архаизации.
