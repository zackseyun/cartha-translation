lexical_decisions:
- source_word: כִּי
  choice: за то, что
  rationale: Оборот естественно выражает причину проклятия, произнесённого Иовом в предыдущих стихах.
- source_word: סָגַר
  choice: не затворила
  rationale: Глагол означает «закрыть, затворить»; «затворить двери» сохраняет конкретный поэтический образ.
- source_word: דַּלְתֵי
  choice: дверей
  rationale: Прямое соответствие образу дверей, преграждающих выход из чрева.
- source_word: בִטְנִי
  choice: чрева, носившего меня
  rationale: Существительное может обозначать живот или чрево. Контекст рождения требует значения «чрево»; уточнение «носившего меня» передаёт смысл необычного еврейского выражения, не приписывая мужчине собственную матку.
- source_word: וַיַּסְתֵּר
  choice: и не скрыла
  rationale: Отрицание первой части по смыслу распространяется и на второй глагол; русский оборот сохраняет параллелизм.
- source_word: עָמָל
  choice: страдания
  rationale: Слово охватывает бедствие, тяготу, мучение и скорбь; в плаче Иова «страдания» естественно обозначают пережитое им горе, не сужая смысл до труда.
- source_word: מֵעֵינָי
  choice: от моих глаз
  rationale: 'Сохранена еврейская телесная метафора: страдание не было сокрыто от зрения и, шире, от опыта Иова.'
theological_decisions:
- issue: Кто не затворил двери чрева
  choice: та ночь
  alternative: тот день; безличная конструкция
  rationale: Ближайший предмет проклятия в стихах 6–9 — ночь рождения. В еврейском «ночь» мужского рода, поэтому мужская форма глагола не противоречит этому; в русском согласование закономерно становится женским.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой. «Затворила» и «чрево» сохраняют достоинство и образность древнееврейского плача, оставаясь понятными по контексту.
