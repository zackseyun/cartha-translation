  text: to a man whose way is hidden[b][a], and whom God has hedged in?
translation:
  language: ru
  text: мужчине, чей путь скрыт[a] и которого Бог оградил[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чья дорога сокрыта».'
