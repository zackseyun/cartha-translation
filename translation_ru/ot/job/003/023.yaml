lexical_decisions:
- source_word: לְגֶבֶר
  choice: мужу
  rationale: 'Предлог לְ продолжает риторический вопрос стиха 20: «для чего дан свет… мужу?» Существительное גֶּבֶר обозначает мужчину; дательный падеж естественно связывает фразу с предшествующим контекстом.'
- source_word: דַּרְכּוֹ
  choice: чей путь
  rationale: דֶּרֶךְ может обозначать как дорогу, так и жизненный путь. «Путь» сохраняет исходную метафору и не сужает смысл.
- source_word: נִסְתָּרָה
  choice: скрыт
  rationale: 'Нифаль передаёт состояние или пассивное действие. «Скрыт» сохраняет неоднозначность: не уточняется, от кого именно скрыт путь.'
- source_word: וַיָּסֶךְ
  choice: оградил со всех сторон
  rationale: Глагол выражает окружение преградой, перекрытие выхода. Эта формулировка естественна по-русски и передаёт образ человека, оказавшегося в замкнутом пространстве.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Поэтическое единственное наименование Бога, особенно характерное для книги Иова; добавление «Всемогущий» не оправдано исходным словом.
- source_word: בַּעֲדוֹ
  choice: которого… со всех сторон
  rationale: В сочетании с данным глаголом предлог указывает на ограждение вокруг человека. Русская относительная конструкция ясно передаёт его как объект Божьего действия.
theological_decisions:
- issue: Божья роль в ограждении человека
  choice: Бог прямо назван тем, кто оградил человека со всех сторон.
  alternative: Безличная формулировка, ослабляющая указание на Божье действие.
  rationale: В еврейском тексте אֱלוֹהַּ является явным подлежащим. Жалобу Иова нельзя смягчать устранением прямой Божьей роли.
translation_notes:
  register: Современный литературный русский язык с поэтически приподнятым, но понятным словом «муж». Фрагмент намеренно сохраняет синтаксическую связь с вопросом, начатым в стихе 20, и не превращается в самостоятельное предложение.
