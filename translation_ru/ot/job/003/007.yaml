  text: הִנֵּ֤ה הַ/לַּ֣יְלָה הַ֭/הוּא יְהִ֣י גַלְמ֑וּד אַל תָּבֹ֖א רְנָנָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/007.yaml
  text: Look, may that night be barren; let no joyful cry enter it.
translation:
  language: ru
  text: Вот, пусть та ночь будет бесплодна; пусть не войдёт в неё ликование.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую силу частицы и соответствует возвышенной поэтической речи без архаического «се».
- source_word: גַלְמוּד
  choice: бесплодна
  rationale: В контексте проклятия ночи передаёт лишённость рождения и потомства; слово допускает оттенки пустынности и одиночества, но «бесплодна» естественно связывается с темой главы.
- source_word: רְנָנָה
  choice: ликование
  rationale: Передаёт громкое радостное восклицание собирательно и не уточняет его источник, которого еврейский текст не называет.
- source_word: תָּבֹא ... בֽוֹ
  choice: войдёт в неё
  rationale: Буквально воспроизводит пространственный образ глагола «входить/приходить» с предлогом ב; женский род местоимения согласован с русским «ночь».
theological_decisions:
- issue: Смысл радостного возгласа
  choice: Не уточнять, чьё именно это ликование
  alternative: Передать как крик радости при рождении ребёнка
  rationale: Контекст допускает связь с рождением, однако сам стих говорит лишь о радостном крике; конкретизация устранила бы сохранённую в источнике широту.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического проклятия. Параллельные пожелания переданы конструкцией «пусть…; пусть…». Архаизм «се» и разговорное «смотри» исключены.
