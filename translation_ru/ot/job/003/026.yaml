lexical_decisions:
- source_word: שָׁלַוְתִּי
  choice: не было мне покоя
  rationale: Глагол выражает состояние покоя, безмятежности или ненарушенной безопасности. Безличная русская конструкция естественно передаёт переживание Иова, не сводя его только к внешней защищённости.
- source_word: שָׁקַטְתִּי
  choice: не было тишины
  rationale: Глагол обозначает тишину, спокойствие и отсутствие тревожащего воздействия. «Тишина» сохраняет отличие от соседних понятий, хотя в контексте подразумевается не только отсутствие звуков, но и отсутствие тревоги.
- source_word: נָחְתִּי
  choice: не было отдыха
  rationale: Глагол נוח означает отдыхать, пребывать в покое, получить передышку. «Отдых» завершает нарастающий ряд близких по смыслу выражений.
- source_word: רֹגֶז
  choice: смятение
  rationale: Существительное может обозначать волнение, тревогу, потрясение или беспокойство. «Смятение» передаёт охватившее Иова внутреннее и внешнее потрясение, не сужая значение до гнева или общей беды.
- source_word: וַיָּבֹא
  choice: и пришло
  rationale: Буквально передаёт приход или наступление смятения; дополнение «на меня» не вводится, поскольку в еврейском тексте оно прямо не выражено.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: не было мне ... не было ... не было
  rationale: Трёхкратное повторение отрицания сохраняет ритм, усиление и настойчивость жалобы Иова.
