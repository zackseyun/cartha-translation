  yaml_path: translation/ot/job/003/004.yaml
  text: May that day be darkness[a]; may God above not seek it[b], and may no light shine upon it.
translation:
  language: ru
  text: Да будет тот день тьмой; пусть Бог свыше не ищет его[a], и пусть свет не озаряет его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть Бог свыше не обратит на него внимания» или «не позаботится о нём»; еврейский глагол может означать искать, обращать внимание или заботиться.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сияние» или «яркий свет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַהוּא
  choice: тот день
  rationale: Указательное словосочетание отсылает к дню рождения Иова; «тот день» естественно и точно передаёт эту отсылку.
- source_word: יְהִי חֹשֶׁךְ
  choice: да будет… тьмой
  rationale: Юссив выражает пожелание-проклятие, а существительное חֹשֶׁךְ обозначает тьму как состояние. Конструкция сохраняет поэтическую силу оригинала.
- source_word: יִדְרְשֵׁהוּ
  choice: не ищет его
  rationale: Глагол דרש прежде всего означает «искать», но здесь может также подразумевать внимание или заботу. Буквальный образ сохранён, а более контекстуальные значения указаны в сноске.
- source_word: אֱלוֹהַּ מִמָּעַל
  choice: Бог свыше
  rationale: אֱלוֹהַּ — поэтическое обозначение Бога в книге Иова; מִמָּעַל сохраняет пространственный образ «свыше» без добавления отсутствующих в тексте титулов.
- source_word: תּוֹפַע
  choice: сияет
  rationale: Глагол передаёт появление или излучение света; «сияет» естественно входит в поэтический параллелизм.
- source_word: נְהָרָה
  choice: свет
  rationale: Слово может означать свет, сияние или яркость. «Свет» ясно и естественно противопоставлен тьме в первой строке.
- source_word: עָלָיו
  choice: над ним
  rationale: Местоименный суффикс относится к «тому дню»; предлог «над» естественно передаёт образ света, сияющего над ним.
theological_decisions:
- issue: Прямое упоминание Бога в пожелании, подобном проклятию
  choice: Сохранено прямое выражение «Бог свыше»
  alternative: «небеса свыше» или смягчённое «Бог на небесах»
  rationale: Еврейский текст прямо называет Бога. Смягчение ослабило бы дерзновенную напряжённость плача Иова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Формула «да будет» сохраняет силу проклятия-пожелания, тогда как повтор «пусть» делает продолжение естественным и понятным современному читателю.
