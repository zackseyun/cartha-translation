  text: יַ֭חַד אֲסִירִ֣ים שַׁאֲנָ֑נוּ לֹ֥א שָׁ֝מְע֗וּ ק֣וֹל נֹגֵֽשׂ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/003/018.yaml
  text: There the prisoners are at ease together[a]; they do not hear the voice of the taskmaster.
translation:
  language: ru
  text: 'Там узники все вместе спокойны;

    они не слышат голоса надсмотрщика[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угнетателя»; возможно также: «взыскателя повинностей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: все вместе
  rationale: Наречие относится к общему состоянию узников. «Все вместе» естественно передаёт совместность, не привнося идеи особого единства.
- source_word: אֲסִירִים
  choice: узники
  rationale: Слово обозначает находящихся в заключении или связанных людей. «Узники» ясно и уместно для возвышенного поэтического контекста.
- source_word: שַׁאֲנָנוּ
  choice: спокойны
  rationale: Передаёт состояние покоя и отсутствия тревоги, не усиливая значение до полной безопасности или окончательного упокоения.
- source_word: לֹא שָׁמְעוּ
  choice: не слышат
  rationale: Хотя употреблена форма qatal, в данном поэтическом описании она выражает продолжающееся состояние; настоящее время естественно согласуется с первой строкой.
- source_word: קוֹל
  choice: голоса
  rationale: «Голос» передаёт слышимые приказы или требования человека, принуждающего других.
- source_word: נֹגֵשׂ
  choice: надсмотрщика
  rationale: Причастная форма обозначает того, кто понуждает к труду либо взыскивает повинность. «Надсмотрщик» конкретно передаёт принуждение, тогда как более широкое «угнетатель» и фискальное «взыскатель» сохранены в примечании.
theological_decisions:
- issue: Характер покоя узников после смерти
  choice: Сохранено сдержанное «спокойны»
  alternative: «обрели покой» или «упокоены»
  rationale: Еврейский текст описывает отсутствие земного принуждения, но не формулирует учение о посмертном блаженстве; перевод не должен усиливать этот смысл.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Перенос строки сохраняет параллелизм еврейского стиха; «узники» и «надсмотрщик» поддерживают конкретный образ принудительного подчинения.
