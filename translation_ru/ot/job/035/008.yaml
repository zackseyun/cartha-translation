  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: ru
  text: Твоё нечестие отражается на человеке, подобном тебе, а твоя праведность — на смертном человеке[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «сын человеческий» здесь — обычное поэтическое обозначение смертного человека, а не мессианский титул.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: отражается на человеке
  rationale: Предлог לְ указывает на человека, которого касается действие; в эллиптической поэтической конструкции по-русски требуется подразумеваемый глагол. «Отражается на» передаёт воздействие, не уточняя его характера сверх контекста стихов 6–7.
- source_word: כָּמוֹךָ
  choice: подобном тебе
  rationale: 'Сохраняет явное сравнение: речь идёт о другом человеке, таком же смертном, как Иов.'
- source_word: רִשְׁעֶךָ
  choice: твоё нечестие
  rationale: «Нечестие» передаёт нравственный смысл רֶשַׁע и соответствует возвышенному поэтическому регистру книги.
- source_word: וּלְבֶן אָדָם
  choice: а ... на сыне человеческом
  rationale: Сохранён еврейский поэтический образ בֶּן־אָדָם, параллельный слову «человек». Строчная буква и сноска помогают не принять выражение за мессианский титул.
- source_word: צִדְקָתֶךָ
  choice: твоя праведность
  rationale: Прямо передаёт нравственно-религиозный смысл существительного и сохраняет противопоставление нечестию.
theological_decisions:
- issue: Значение בֶּן־אָדָם в данном контексте
  choice: обычный смертный человек, с сохранением образа «сын человеческий»
  alternative: человек; Сын Человеческий как мессианский титул
  rationale: В параллелизме с אִישׁ выражение обозначает человека вообще, а не мессианскую фигуру. Формальный образ сохранён, но его контекстуальное значение пояснено в сноске.
- issue: Характер воздействия человеческих поступков
  choice: нейтральное «отражается на»
  alternative: «вредит» для нечестия и «приносит пользу» для праведности
  rationale: В еврейском тексте глаголы отсутствуют; контекст подразумевает воздействие на людей. Нейтральный общий глагол сохраняет эллиптичность и не вводит двух более конкретных следствий.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Эллипсис второй части сохранён посредством тире; синтаксически общий глагол относится к обеим параллельным строкам.
