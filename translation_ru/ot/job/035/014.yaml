  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: ru
  text: 'Тем более когда ты говоришь: «Ты не видишь Его». Дело — перед Ним, так жди Его[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, буквальнее: «и корчись перед Ним». Еврейский глагол здесь труден для понимания; многие понимают его как «ожидай Его с надеждой».'
    reason: Лексическая неоднозначность редкой еврейской формы וּתְחוֹלֵל.
lexical_decisions:
- source_word: אַף כִּי
  choice: Тем более когда
  rationale: Сочетание продолжает довод Элиуя из предыдущего стиха и имеет усилительно-умозаключительный смысл, а не просто уступительный.
- source_word: תֹאמַר
  choice: ты говоришь
  rationale: Простая форма глагола речи во 2-м лице единственного числа; Элиуй обращается к Иову.
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: Ты не видишь Его
  rationale: Глагол שׁור означает «видеть, созерцать, воспринимать»; по контексту речь идёт о том, что Иов не видит Бога, а не о том, что Бог не видит его дела.
- source_word: דִּין
  choice: дело
  rationale: Здесь слово обозначает дело, подлежащее судебному разбирательству, а не отвлечённое понятие справедливости.
- source_word: לְפָנָיו
  choice: перед Ним
  rationale: Обычное выражение, указывающее, что дело находится перед Богом как Судьёй.
- source_word: וּתְחוֹלֵל לוֹ
  choice: так жди Его
  rationale: Трудная форма в данном контексте обычно понимается как призыв с ожиданием положиться на Божье решение. Частица «так» естественно передаёт связь с предыдущей частью, а альтернативное буквальное понимание сохранено в сноске.
theological_decisions:
- issue: Скрытость Бога и находящееся перед Ним дело Иова
  choice: Иов не видит Бога, но его дело находится перед Богом, поэтому ему следует ждать Божьего решения.
  alternative: Бог не видит дела Иова.
  rationale: Синтаксис и ход речи лучше поддерживают понимание «ты не видишь Его»; утверждение о том, что Бог не видит дела, противоречило бы непосредственному аргументу Элиуя.
- issue: Значение заключительного глагола וּתְחוֹלֵל
  choice: жди Его
  alternative: корчись перед Ним
  rationale: Контекст судебного ожидания поддерживает значение терпеливого, напряжённого ожидания, однако редкость и лексическая неоднозначность формы требуют сохранить более буквальную альтернативу в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой судебной образностью. Заглавные местоимения по отношению к Богу применены последовательно в пределах стиха. Тире в выражении «Дело — перед Ним» сохраняет сжатость и акцент еврейской фразы.
