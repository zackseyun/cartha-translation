base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: ru
  text: Поистине, Бог не слышит пустого вопля[a], и Всемогущий не обращает на него внимания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тщетного», «суетного» или «ложного». Еврейское слово может обозначать нечто пустое, бесполезное либо обманчивое; здесь оно относится к воплю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: В данном контексте частица может иметь противительный оттенок и вводит решительный вывод Елиуя; русское «но» естественно связывает стих с предыдущей мыслью, не добавляя ограничительного значения.
- source_word: שָׁוְא
  choice: пустого
  rationale: Слово обозначает пустое, тщетное, суетное или ложное. Субстантивированное «пустого» сохраняет абстрактность и не сужает смысл до одной лишь лжи или до явно названной молитвы.
- source_word: יִשְׁמַע
  choice: не слышит
  rationale: Имперфект здесь выражает общее положение; «не слышит» прямо передаёт глагол и сохраняет риторическое напряжение высказывания.
- source_word: אֵל
  choice: Бог
  rationale: Обычный и естественный русский эквивалент божественного наименования אֵל без избыточного смыслового расширения.
- source_word: וְשַׁדַּי
  choice: и Всемогущий
  rationale: Устоявшаяся передача божественного титула שַׁדַּי в книге Иова.
- source_word: יְשׁוּרֶנָּה
  choice: не обращает на него внимания
  rationale: Глагол שׁור означает смотреть, видеть, принимать во внимание. Эта формулировка естественно передаёт внимательное рассмотрение и соответствует параллели с «не слышит»; местоимение отсылает к субстантивированному «пустому».
theological_decisions:
- issue: Что обозначает שָׁוְא в утверждении Елиуя
  choice: Пустое, тщетное или неискреннее не получает Божьего внимания
  alternative: Бог не слышит «ложь» как абстрактное явление либо «суетные речи»
  rationale: Перевод сохраняет широту еврейского слова и не превращает стих в утверждение об ограниченности Божьего знания. При этом он не вставляет в основной текст слово «молитва» или «вопль», которого в еврейском тексте нет.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранён параллелизм двух полустиший и различие между «слышит» и «обращает внимание».
