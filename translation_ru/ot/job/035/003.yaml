  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: ru
  text: 'Ведь ты говоришь[a]: «Что пользы тебе? Что выгоды мне от моего греха?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Какое у тебя преимущество? Какую выгоду я получу по сравнению с тем, что даёт мне мой грех?» Еврейский текст предельно краток и может подразумевать сравнение пользы от праведности с пользой от греха.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит обоснование слов Елиуя и естественно связывает стих с предшествующим обвинением.
- source_word: תֹאמַר
  choice: ты говоришь
  rationale: Форма qal, 2-е лицо единственного числа; настоящее время уместно для передачи приписываемого Иову утверждения.
- source_word: יִסְכָּן לָךְ
  choice: что пользы тебе?
  rationale: Глагол סכן выражает пользу или выгоду. Краткая русская формулировка сохраняет лаконичность и не уточняет неясный референт местоимения.
- source_word: אֹעִיל
  choice: что выгоды мне
  rationale: Hiphil от יעל означает получать пользу или выгоду; конструкция передана естественным русским оборотом, параллельным первой части.
- source_word: מֵחַטָּאתִי
  choice: от моего греха
  rationale: Предлог מן может указывать на источник либо сравнение. Основной текст сохраняет прямое значение источника, а возможный сравнительный смысл отмечен в сноске.
theological_decisions:
- issue: К кому или к чему относится «тебе» и имеет ли מן сравнительное значение
  choice: Сохранить буквальное «тебе» и передать מֵחַטָּאתִי как «от моего греха», не называя явно подразумеваемый предмет сравнения.
  alternative: Понять слова как вопрос Иова о том, какую выгоду даёт праведность по сравнению с грехом; либо как вопрос о выгоде для Бога.
  rationale: Еврейская фраза предельно сжата, а форма לָךְ допускает связь с подразумеваемой праведностью из контекста. Явное указание на Бога или развёрнутое противопоставление праведности греху сняло бы сохраняющуюся в тексте неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткие риторические вопросы передают сжатость еврейского текста. Слово «выгода» сохраняет смысловой параллелизм с «пользой», не делая обе строки дословно одинаковыми.
