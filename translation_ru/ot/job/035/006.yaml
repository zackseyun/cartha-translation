base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: ru
  text: Если ты грешишь, что ты этим совершишь против Него? И если многочисленны твои преступления, что ты сделаешь Ему?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: Если ты грешишь
  rationale: Условное «если» сохраняет гипотетический характер довода; настоящее время естественно выражает общее условие в русском языке.
- source_word: מַה תִּפְעָל בּוֹ
  choice: что ты можешь сделать Ему?
  rationale: פעל обозначает действие или производимый эффект, а בּוֹ — направленность действия на Бога. «Можешь» передаёт подразумеваемую риторическую мысль, не уточняя её как «навредить».
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: И если многочисленны твои преступления
  rationale: Во второй параллельной строке условность эллиптически продолжает первое אִם. «Преступления» передаёт פשׁע как серьёзные, сознательные нарушения, не сужая значение до одного лишь открытого мятежа.
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: что ты можешь причинить Ему?
  rationale: Глагол עשה с ל обозначает то, что делают кому-либо. «Причинить» естественно передаёт направленное воздействие и сохраняет открытым вопрос о его результате; «можешь» выявляет риторическую силу вопроса.
theological_decisions:
- issue: Означают ли вопросы, что человеческий грех вообще не имеет отношения к Богу, или лишь что он не способен повредить Богу и умалить Его?
  choice: Сформулировать риторические вопросы как вопросы о том, что человек способен сделать или причинить Богу.
  alternative: 'Передать прямо: «какой вред ты Ему нанесёшь?» либо буквально и менее ясно: «что ты сделаешь Ему?»'
  rationale: Так сохраняется мысль о Божьей независимости и недосягаемости для ущерба со стороны человека, но не утверждается, будто грех нравственно безразличен Богу.
translation_notes:
  register: Современный литературный русский язык; сдержанный, возвышенный регистр. Параллелизм двух риторических вопросов сохранён. Местоимение «Ему» написано с прописной буквы по принятой русской библейской традиции.
