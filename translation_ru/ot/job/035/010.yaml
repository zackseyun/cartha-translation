- source_word: זְמִרוֹת
  choice: песни
  rationale: Слово обозначает песни; возможный оттенок хвалы не выражен явно и потому не добавлен в перевод.
- source_word: בַּלָּיְלָה
  choice: в ночи
  rationale: Передаёт временное значение и сохраняет поэтическую образность еврейской строки.
