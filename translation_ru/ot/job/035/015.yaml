lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Передаёт соединительно-временной переход, не уточняя сверх текста, является ли связь следственной или противительной.
- source_word: כִּי
  choice: поскольку
  rationale: Естественно вводит основание или содержание высказывания Елиуя; сохраняет причинное прочтение.
- source_word: אַיִן פָּקַד אַפּוֹ
  choice: гнев Его не покарал
  rationale: Сохраняет «гнев Его» в роли грамматического субъекта и передаёт вероятное карательное значение многозначного פקד. Необычность сочетания отражает трудность еврейской фразы.
- source_word: וְלֹא יָדַע
  choice: и Он не обращает … внимания
  rationale: В данном контексте ידע, вероятно, означает не отсутствие знания, а непризнание или отсутствие пристального внимания.
- source_word: בַּפַּשׁ
  choice: на дерзость
  rationale: Редкое и неясное слово, вероятно, обозначает дерзкое нарушение, мятежность или тяжкий проступок. «Дерзость» сохраняет оттенок вызывающего поведения без чрезмерной конкретизации.
- source_word: מְאֹד
  choice: особого
  rationale: Передаёт усилительное значение наречия при выражении «обращать внимание» естественным современным русским оборотом.
theological_decisions:
- issue: Высказывание о том, что Бог не карает и не обращает внимания на проступок
  choice: Формулировка сохранена как часть рассуждения Елиуя, без догматического смягчения или усиления.
  alternative: Можно было явно добавить «как кажется Иову» или передать мысль как обвинение Иова, но таких слов в самом стихе нет.
  rationale: Контекст показывает, что это реплика Елиуя в споре, однако перевод не должен вставлять отсутствующую в еврейском тексте рамку и тем самым устранять богословское напряжение.
- issue: Кто является субъектом פקד
  choice: «гнев Его не покарал» — субъектом оставлен «гнев».
  alternative: «Он не покарал в гневе Своём».
  rationale: Выбранный вариант ближе к наиболее прямому синтаксическому прочтению масоретского текста; более идиоматичное альтернативное прочтение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Необычный образ «гнев … покарал» сохранён ради близости к трудной еврейской конструкции; более гладкое прочтение дано в сноске. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
