translation:
  language: ru
  text: Который учит нас больше, чем учит земных животных, и делает нас мудрее небесных птиц[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Который учит нас через земных животных и делает нас мудрыми через небесных птиц». Еврейский предлог может указывать не на сравнение, а на источник обучения.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַ֭לְּפֵנוּ
  choice: учит нас
  rationale: Причастие породы пиэль от למד с суффиксом 1-го лица множественного числа обозначает деятельное наставление. «Учит нас» — естественная современная передача, сохраняющая параллелизм со второй частью строки.
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: больше, чем земных животных
  rationale: Предлог מִן наиболее вероятно имеет здесь сравнительное значение. По-русски при глаголе «учит» сравнительный смысл требует добавления «больше». «Земные животные» естественно передаёт בַּהֲמוֹת אָרֶץ, не сужая значение до диких зверей.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: небесных птиц
  rationale: מֵ продолжает сравнительную конструкцию, выраженную формой «мудрее». «Небесные птицы» сохраняет поэтическую образность буквального выражения «птицы небес» и звучит естественно в русском стихе.
- source_word: יְחַכְּמֵנוּ
  choice: делает нас мудрее
  rationale: Форма пиэль от חכם с суффиксом 1-го лица множественного числа имеет каузативный смысл. Сравнительная степень «мудрее» ясно выражает наиболее вероятную функцию следующего מִן.
theological_decisions:
- issue: Значение предлога מִן в обеих частях стиха
  choice: 'Сравнительное: Бог учит людей больше, чем животных, и делает их мудрее птиц.'
  alternative: 'Указание на источник: Бог учит людей через земных животных и вразумляет через небесных птиц.'
  rationale: Поэтический параллелизм и ближайший контекст лучше поддерживают сопоставление человеческой способности к учению и мудрости со способностями животных. Однако грамматика допускает значение источника, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Относительное «Который» сохраняет синтаксическую связь с предыдущим стихом. Подлинная неоднозначность предлога מִן отмечена в сноске.
