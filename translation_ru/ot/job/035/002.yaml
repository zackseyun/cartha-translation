  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: ru
  text: 'Неужели ты считаешь это справедливым, говоря[a]: «Моя праведность больше Божьей»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я прав перед Богом», или: «Моё право — от Бога». Еврейская фраза предельно кратка, и связь слов «моя праведность» со словом «Бог» понимают по-разному.'
