lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: Неужели ты считаешь это
  rationale: Вопросительная частица с указательным местоимением и глаголом חשב образует риторический вопрос; «неужели» естественно передаёт его полемическую силу.
- source_word: לְמִשְׁפָּט
  choice: справедливым
  rationale: מִשְׁפָּט здесь имеет оценочный смысл справедливости или правоты; творительный после «считать» даёт естественную русскую конструкцию.
- source_word: אָמַרְתָּ
  choice: ты говоришь
  rationale: Формально перфект обозначает произнесённое утверждение, которое Елиуй приводит как сохраняющее актуальность; настоящее время естественно в прямом обращении.
- source_word: צִדְקִי
  choice: моя праведность
  rationale: Существительное от צדק обозначает праведность, правоту или справедливое притязание; «праведность» сохраняет нравственно-судебный диапазон исходного слова.
- source_word: מֵאֵל
  choice: больше Божьей
  rationale: מִן допускает сравнительное значение. Добавленное «Божьей» ясно выражает подразумеваемый предмет сравнения и соответствует роду слова «праведность».
theological_decisions:
- issue: Смысл приписываемого Иову утверждения
  choice: 'Сравнительное прочтение: «Моя праведность больше Божьей»'
  alternative: «Я прав перед Богом» или «Моё право — от Бога»
  rationale: Краткое сочетание צִדְקִי מֵאֵל допускает разные синтаксические толкования. В обвинительной речи Елиуя сравнительный смысл хорошо соответствует контексту, однако богословски значимые альтернативы сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» соответствует единственному числу в еврейском тексте. Два коротких вопроса сохраняют резкость прямого обличения и не перегружают фразу искусственной связкой.
