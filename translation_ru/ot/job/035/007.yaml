  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: ru
  text: Если ты праведен, что дашь ему[a]? Или что он возьмёт[b] из твоей руки?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть Богу: мысль Елиуя в контексте состоит в том, что человеческая праведность ничего не прибавляет Богу.'
    reason: cross_reference
  - marker: b
    text: 'Или: «получит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Прямо передаёт условный союз и естественно вводит риторический вопрос.
- source_word: צָדַקְתָּ
  choice: ты праведен
  rationale: Передаёт состояние нравственной правоты в условной конструкции; настоящее время по-русски естественнее буквального «стал праведен» или «был праведен».
- source_word: תִּתֶּן
  choice: дашь
  rationale: Будущая форма естественно звучит в русском условном риторическом вопросе и не добавляет модального значения «можешь».
- source_word: לוֹ
  choice: ему
  rationale: Сохраняет местоимение и отношение косвенного объекта, не подставляя в основной текст имя Бога.
- source_word: מִיָּדְךָ
  choice: из твоей руки
  rationale: Сохраняет конкретный еврейский образ, понятный по-русски как указание на то, что человек способен предоставить.
- source_word: יִקָּח
  choice: возьмёт
  rationale: Прямое соответствие глаголу לקח; в данном параллелизме означает получение чего-либо от человека без добавления идеи принуждения.
theological_decisions:
- issue: К кому относятся местоимения לוֹ и подразумеваемое подлежащее יִקָּח
  choice: В основном тексте сохранены местоимения «ему» и «он»; сноска указывает, что в контексте речь идёт о Боге.
  alternative: Прямо написать в основном тексте «Богу» и «Бог».
  rationale: Контекст Иов 35:6–8 указывает на Бога, однако еврейский текст этого стиха использует местоимения. Такой перевод сохраняет формулировку и не устраняет её явным уточнением.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой поэтической параллельности. Местоимения, относящиеся к Богу, даны со строчной буквы, чтобы не вносить в основной текст уточнение, отсутствующее в еврейской форме стиха.
