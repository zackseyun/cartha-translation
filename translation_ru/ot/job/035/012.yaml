id: JOB.35.12
reference: Job 35:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שָׁ֣ם יִ֭צְעֲקוּ וְ/לֹ֣א יַעֲנֶ֑ה מִ֝/פְּנֵ֗י גְּא֣וֹן רָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: ru
  text: Там они взывают, но он не отвечает[a] из-за гордости злодеев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте подлежащее глагола «не отвечает» прямо не названо; из контекста следует, что речь идёт о Боге.
    reason: alternative_reading
  - marker: b
    text: 'Или: «из-за высокомерия злодеев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Наречие прежде всего имеет пространственное значение и указывает на описанную выше ситуацию; «там» сохраняет эту конкретность.
- source_word: יִצְעֲקוּ
  choice: они взывают
  rationale: Глагол обозначает громкий зов о помощи в бедствии. «Взывают» передаёт настойчивость и уместно в современном литературном библейском стиле.
- source_word: וְלֹא יַעֲנֶה
  choice: но он не отвечает
  rationale: Союз передан противительным «но», поскольку отсутствие ответа противопоставлено зову. Настоящее время естественно выражает общее утверждение; подлежащее, как и в еврейском тексте, прямо не названо.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: В данном обороте предлог выражает причину; «из-за» ясно и естественно передаёт причинную связь.
- source_word: גְּאוֹן
  choice: гордости
  rationale: В сочетании с обозначением злых людей слово имеет отрицательный смысл — гордость или высокомерие. «Гордость» сохраняет некоторую широту значения.
- source_word: רָעִים
  choice: злодеев
  rationale: Субстантивированное прилагательное мужского рода во множественном числе обозначает людей, творящих зло. «Злодеи» передаёт это значение естественнее, чем буквальное и стилистически тяжёлое «злые мужчины».
theological_decisions:
- issue: Неявное подлежащее глагола «не отвечает»
  choice: Сохранено местоимение «он» без прямой вставки имени Бога.
  alternative: «Бог не отвечает»
  rationale: Контекст указывает на Бога как на того, от кого ожидают ответа, однако в самом еврейском предложении Он прямо не назван. Строчная буква и сноска сохраняют сдержанность исходного текста.
- issue: Причина отсутствия ответа
  choice: «из-за гордости злодеев» непосредственно относится к отсутствию ответа.
  alternative: Понимать оборот лишь как характеристику обстановки, в которой раздаётся вопль.
  rationale: Синтаксически причинный оборот естественнее всего связан с ближайшим сказуемым «не отвечает», хотя краткость еврейской фразы не раскрывает причинную логику подробнее.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным глаголом «взывать». Структура краткой еврейской фразы сохранена; неявное подлежащее не заменено явным именем Бога. Все сноски отмечены в основном тексте.
