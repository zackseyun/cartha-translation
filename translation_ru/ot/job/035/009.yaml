  text: מֵ֭/רֹב עֲשׁוּקִ֣ים יַזְעִ֑יקוּ יְשַׁוְּע֖וּ מִ/זְּר֣וֹעַ רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: ru
  text: Из-за множества притеснений они кричат; из-за руки могущественных взывают о помощи[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «взывают о помощи от руки могущественных». Еврейский предлог можно передать и как «от», хотя здесь он, вероятнее всего, указывает на причину вопля.'
    reason: lexical_alternative
  - marker: b
    text: «Рука» — еврейский образ силы или власти.
    reason: cultural_note
lexical_decisions:
- source_word: מֵרֹב
  choice: из-за множества
  rationale: Предлог מִן при רֹב выражает причину или источник вопля; оборот «из-за множества» естественен по-русски и сохраняет количественный оттенок.
- source_word: עֲשׁוּקִים
  choice: притеснений
  rationale: В данном сочетании форма обозначает многочисленные случаи или действия притеснения, а не обязательно самих притесняемых.
- source_word: יַזְעִיקוּ
  choice: вопиют
  rationale: Форма глагола זעק передаёт громкий крик бедствия. «Вопиют» звучит достойно, понятно и уместно в поэтической речи.
- source_word: יְשַׁוְּעוּ
  choice: взывают о помощи
  rationale: Глагол שוע обозначает обращённую к кому-либо мольбу о помощи; перевод отличает его от предшествующего общего вопля и сохраняет параллелизм.
- source_word: מִזְּרֹעַ
  choice: из-за руки
  rationale: זְרוֹעַ буквально означает «рука» и образно указывает на силу или власть. Буквенный образ сохранён, а מִן передан причинным оборотом; более буквальная возможность отмечена в сноске.
- source_word: רַבִּים
  choice: сильных
  rationale: Здесь слово обозначает влиятельных и могущественных людей, а не просто многочисленную группу.
theological_decisions:
- issue: Значение предлога מִן в выражении מִזְּרֹעַ רַבִּים
  choice: 'Причина вопля: «из-за руки сильных»'
  alternative: 'Направление избавления: «от руки сильных»'
  rationale: Контекст притеснения и параллель с מֵרֹב поддерживают причинное понимание, но грамматика допускает более буквальное «от», поэтому неоднозначность отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим глаголом «вопиют». Неопределённое множественное число исходного текста сохранено без добавления явного подлежащего «люди» или «угнетённые».
