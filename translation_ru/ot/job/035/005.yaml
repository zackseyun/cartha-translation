  yaml_path: translation/ot/job/035/005.yaml
  text: Look at the heavens and see; gaze at the clouds—they are higher than you.
translation:
  language: ru
  text: Взгляни на небеса и посмотри; всмотрись в облака — они выше тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֵּט ... וּרְאֵה
  choice: Взгляни ... и посмотри
  rationale: Передаёт два последовательных повелительных глагола зрения, сохраняя их риторическое усиление без неестественной буквальности.
- source_word: וְשׁוּר
  choice: всмотрись
  rationale: Глагол призывает направить пристальный взгляд; «всмотрись» естественно передаёт более сосредоточенное наблюдение после общего «взгляни».
- source_word: שְׁחָקִים
  choice: облака
  rationale: В данном параллелизме слово обозначает высокие облака или облачные выси; «облака» понятно современному читателю и соответствует образу.
- source_word: גָּבְהוּ מִמֶּךָּ
  choice: они выше тебя
  rationale: Сохраняет прямое пространственное сравнение оригинала и согласуется с ближайшим множественным существительным «облака».
theological_decisions:
- issue: Риторический акцент на высоте небесных облаков по отношению к человеку
  choice: Сохранено буквальное «они выше тебя» без поясняющего богословского вывода
  alternative: «насколько они выше тебя» или добавление мысли о Божьем превосходстве
  rationale: Оригинал оставляет читателю вывести значение наблюдения из контекста речи Елиуя; перевод не должен заранее разрешать этот риторический ход.
translation_notes:
  register: 'Современный литературный русский язык с достоинством поэтической речи. Три глагола зрения сохранены как нарастающий призыв: «взгляни», «посмотри», «всмотрись».'
