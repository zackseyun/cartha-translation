  text: So Job opens his mouth in vain[a]; without knowledge he multiplies words.
translation:
  language: ru
  text: Так Иов попусту[a] открывает уста и без знания множит слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «с пустотой», «тщетно» или «суетно».
