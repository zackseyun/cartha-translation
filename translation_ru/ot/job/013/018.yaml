  choice: буду признан правым
  alternative: буду оправдан
  rationale: 'Контекст изображает спор и судебное разбирательство: Иов уверен в признании своей правоты. Такой перевод сохраняет судебный смысл и не навязывает более позднюю богословскую терминологию оправдания.'
