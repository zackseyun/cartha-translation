  text: Will it be good when he examines you? Or will you mock him as one mocks a man?[a][b]
translation:
  language: ru
  text: Хорошо ли будет, когда Он исследует вас? Или вы станете насмехаться над Ним[a], как насмехаются над человеком[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обманывать Его» либо «играть с Ним»; еврейский глагол может означать насмешку, обман или обращение с кем-либо как с игрушкой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «над человеком»; еврейское слово может подчёркивать слабость и смертность человека в противопоставлении Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב
  choice: Хорошо ли вам будет
  rationale: Вопросительная частица с прилагательным образует риторический вопрос; будущее время передаёт направленное вперёд предостережение. Местоимение «вам» естественно выражает по-русски подразумеваемое отношение результата к собеседникам.
- source_word: כִּי
  choice: когда
  rationale: Союз вводит обстоятельство, при котором выяснится, будет ли собеседникам хорошо; временное «когда» соответствует контексту лучше, чем причинное «потому что».
- source_word: יַחְקֹר
  choice: испытáет
  rationale: Глагол חקר обозначает тщательное исследование и проверку. «Испытает» естественно передаёт здесь Божье пристальное исследование людей, не сводя смысл к простому вопросу или наблюдению.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Передано прямое дополнение во втором лице множественного числа.
- source_word: אִם
  choice: или
  rationale: В параллельном риторическом вопросе слово вводит вторую возможность; по-русски противопоставление естественно выражается союзом «или».
- source_word: כְּהָתֵל ... תְּהָתֵלּוּ
  choice: как насмехаются ... станете насмехаться
  rationale: Повтор одного русского глагола сохраняет словесный повтор оригинала. Значение «насмехаться» хорошо передаёт дерзость обращения с Богом, а другие возможные оттенки указаны в сноске.
- source_word: בֶּאֱנוֹשׁ
  choice: над человеком
  rationale: אֱנוֹשׁ обозначает человека и нередко подчёркивает его слабость и смертность. Основной текст остаётся естественным, а оттенок смертности поясняется в сноске.
- source_word: בּוֹ
  choice: над Ним
  rationale: Предлог с местоименным суффиксом передан в соответствии с управлением русского глагола «насмехаться». Заглавная буква отражает контекстуальную отнесённость местоимения к Богу.
theological_decisions:
- issue: К кому относятся местоимения третьего лица единственного числа
  choice: К Богу; в русском тексте это обозначено формами «Он» и «Ним».
  alternative: К неуточнённому исследователю или судье.
  rationale: В Иов 13:7–11 Иов обличает друзей за неправду, сказанную ради Бога, и предупреждает их о Божьем исследовании. Такое прочтение следует непосредственному контексту, не называя Бога там, где в еврейском стоят местоимения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной риторикой. Сохранены два параллельных вопроса и повтор глагола. Местоимения, относящиеся к Богу, написаны с заглавной буквы по принятой русской библейской традиции.
