  text: Разве Его величие[a] не устрашит вас, и страх перед Ним[b] не падёт на вас?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его возвышенность». Еврейское слово может обозначать возвышенность, достоинство или величие.'
