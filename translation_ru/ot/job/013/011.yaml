lexical_decisions:
- source_word: הֲלֹא
  choice: разве ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: שְׂאֵתוֹ
  choice: Его величие
  rationale: Существительное обозначает возвышенность, достоинство или величие; в контексте речь идёт о подавляющем величии Бога.
- source_word: תְּבַעֵת
  choice: не устрашит
  rationale: Порода пиэль выражает причинение сильного страха; «устрашит» сохраняет интенсивность и возвышенный тон.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Прямое дополнение, местоимение второго лица мужского рода множественного числа.
- source_word: וּפַחְדּוֹ
  choice: Его ужас
  rationale: 'Сохраняет притяжательную конструкцию и не устраняет полностью неоднозначность: это может быть ужас, исходящий от Него или вызываемый Им.'
- source_word: יִפֹּל עֲלֵיכֶם
  choice: не падёт на вас
  rationale: Сохраняет образ чего-то подавляющего, нисходящего на человека, и близко следует еврейской идиоме.
