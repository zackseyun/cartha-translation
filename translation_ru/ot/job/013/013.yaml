  text: Замолчите передо мной[a], а я буду говорить; пусть постигнет меня что угодно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Замолчите от меня»; то есть: «молчите передо мной» или «не перебивайте меня».'
