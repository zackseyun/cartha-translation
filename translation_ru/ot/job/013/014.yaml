translation:
  language: ru
  text: Зачем мне брать свою плоть в зубы и класть свою жизнь на ладонь?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Зачем мне брать свою плоть зубами?» Еврейское выражение образно и трудно для однозначного понимания; оно может выражать безрассудное подвергание себя опасности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свою душу». Еврейское слово нефеш может означать «жизнь», «душу» или самого человека; здесь «жизнь» лучше соответствует мысли о смертельном риске.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: Зачем мне
  rationale: Оборот вводит риторический вопрос о цели или причине. «Зачем мне» естественно передаёт эту силу в русском языке, не превращая вопрос в утверждение.
- source_word: אֶשָּׂא
  choice: нести
  rationale: Глагол נשׂא означает «поднимать, нести, брать». Здесь «нести» сохраняет конкретный и необычный образ еврейского текста.
- source_word: בְשָׂרִי
  choice: свою плоть
  rationale: Буквальное «плоть» сохраняет яркую телесную метафору; «тело» было бы понятнее, но несколько сгладило бы исходный образ.
- source_word: בְשִׁנָּי
  choice: в зубах
  rationale: Предлог ב естественно передаётся как «в»; выражение намеренно оставлено образным и трудным, поскольку точный смысл еврейской идиомы не вполне ясен.
- source_word: וְנַפְשִׁי
  choice: свою жизнь
  rationale: נפש может обозначать «душу», «жизнь» или самого человека. В контексте опасности «жизнь» яснее всего передаёт смысл, не отрицая более широкого диапазона слова.
- source_word: אָשִׂים
  choice: держать
  rationale: Буквально глагол означает «класть, помещать». В русском выражение «держать жизнь в руке» естественно передаёт состояние сознательного риска и сохраняет образ результата помещения в руку.
- source_word: בְכַפִּי
  choice: в руке
  rationale: כף буквально означает «ладонь», а шире — «рука». «В руке» звучит естественно по-русски и сохраняет метафору подвергнутой опасности жизни.
