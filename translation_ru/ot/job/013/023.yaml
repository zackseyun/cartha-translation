  text: How many are my iniquities and sins? Make my transgression and my sin known to me[a][b].
translation:
  language: ru
  text: Сколько у меня беззаконий и грехов?[a] Открой мне моё преступление[b] и мой грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как велики мои беззакония и грехи?» Еврейское вопросительное слово может относиться не только к числу, но и к степени или мере; основной текст сохраняет более прямой количественный смысл.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «преступление», может также означать «мятеж» или «бунт».
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה לִי
  choice: Сколько у меня
  rationale: Вопросительное כַּמָּה с לִי естественно выражает количество или меру. Сочетание «Сколько у меня» прямо и ясно передаёт основной количественный смысл перед двумя существительными во множественном числе.
- source_word: עֲוֺנוֹת
  choice: беззаконий
  rationale: עָוֹן обозначает нравственную неправду, беззаконие, а в некоторых контекстах также вину. «Беззакония» сохраняет нравственную весомость слова и отличает его от следующего חַטָּאוֹת.
- source_word: וְחַטָּאוֹת
  choice: и грехов
  rationale: Обычное и понятное соответствие множественному числу חַטָּאת; оно сохраняет отличие от עֲוֺנוֹת без излишнего истолкования.
- source_word: פִּשְׁעִי
  choice: моё преступление
  rationale: פֶּשַׁע означает сознательное нарушение, преступление и может иметь оттенок мятежа. «Преступление» передаёт серьёзность слова, не делая оттенок открытого бунта обязательным.
- source_word: וְחַטָּאתִי
  choice: и мой грех
  rationale: Форма единственного числа חַטָּאת с суффиксом первого лица прямо передана как «мой грех», с сохранением параллели с «моё преступление».
- source_word: הֹדִיעֵנִי
  choice: Дай мне узнать
  rationale: Побудительная форма породы hифиль от ידע означает «сделай известным, дай узнать». Русское «Дай мне узнать» естественно передаёт каузативный смысл и просьбу Иова.
