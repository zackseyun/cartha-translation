  text: Но я намерен говорить со Всемогущим и желаю спорить[a] с Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассуждать с Богом»; или: «представить дело Богу». Еврейский глагол может означать вести спор, доказывать свою правоту или представлять дело на рассмотрение.'
    reason: Лексическая неоднозначность глагола יכח и его судебно-дискуссионный оттенок.
lexical_decisions:
- source_word: אוּלָם
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущим словам Иова о его друзьях и естественно звучит в современном русском языке.
- source_word: אֲנִי
  choice: я
  rationale: Сохраняет выраженное в еврейском тексте личное подлежащее и его смысловое ударение.
- source_word: אֶל שַׁדַּי אֲדַבֵּר
  choice: я намерен говорить со Всемогущим
  rationale: Форма глагола в контексте выражает намерение Иова; «намерен» передаёт волевую направленность без неуместного оттенка вежливой условности, который могло бы создать «хотел бы».
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Переводит божественный титул общепринятым русским смысловым соответствием, а не транслитерацией.
- source_word: וְהוֹכֵחַ
  choice: и желаю спорить
  rationale: 'Глагол יכח в породе хифиль здесь имеет судебно-дискуссионный оттенок: доказывать, вести спор, представлять доводы. «Спорить» кратко сохраняет напряжённость и неоднозначность высказывания.'
- source_word: אֶל אֵל
  choice: с Богом
  rationale: Русское управление «спорить с» естественно передаёт отношение, выраженное предлогом אֶל; אֵל в данном параллелизме ясно обозначает Бога.
- source_word: אֶחְפָּץ
  choice: желаю
  rationale: Передаёт сильное осознанное стремление и соответствует возвышенному, но современному регистру.
theological_decisions:
- issue: Передача божественных обозначений שַׁדַּי и אֵל
  choice: «Всемогущий» и «Бог»
  alternative: «Шаддай» и «Бог»; либо «Всемогущий» и «Сильный»
  rationale: Разные обозначения Бога сохранены как разные русские слова; титул שַׁדַּי переведён, а אֵל передан обычным словом «Бог», без искусственного согласования или привнесения дополнительных богословских выводов.
- issue: Судебный оттенок וְהוֹכֵחַ
  choice: «спорить с Богом» с примечанием об альтернативных оттенках
  alternative: «рассуждать с Богом»; «представить своё дело Богу»
  rationale: Основной текст сохраняет прямоту и напряжение слов Иова, а примечание показывает судебно-доказательный диапазон глагола, не сводя его к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим поэтической речи Иова. Синтаксис прямой и понятный; «намерен» выражает решимость, а «спорить» сохраняет вызывающую напряжённость оригинала.
