  terminology: «Лицеприятствовать» точно передаёт еврейскую идиому и её нравственно-судебный оттенок. «Спорить за Бога» сохраняет значение ריב; вариант «выступать в защиту Бога» допустимо оставить в сноске как более развёрнутый перевод. Местоимение «Ему» относится к Богу и пишется с прописной буквы в соответствии с обычной русской библейской практикой.
