  source_fidelity: 'Первый член в черновике передан слишком свободно: «угождать» означает стараться понравиться и не выражает ключевого судебно-этического смысла идиомы נָשָׂא פָּנִים — проявлять пристрастие в чью-либо пользу. Второй член («защищать Бога») возможен контекстуально, но «спорить за Бога» ближе к ריב и сохраняет полемико-судебную образность без излишнего уточнения характера защиты.'
