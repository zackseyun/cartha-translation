  text: Will you show partiality for him? Will you contend for God?[a][b]
translation:
  language: ru
  text: Неужели вы будете лицеприятствовать Ему[a]? Неужели будете спорить за Бога[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимать Его лицо» — еврейское выражение со значением «проявлять пристрастие, оказывать предпочтение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будете выступать в защиту Бога?»'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲפָנָיו תִּשָּׂאוּן
  choice: Неужели вы будете ему угождать
  rationale: Еврейское выражение буквально означает «поднимать его лицо», а в судебном и спорном контексте — проявлять пристрастие, благоволить одной стороне. «Угождать» естественно передаёт здесь пристрастную поддержку, хотя оттенок лицеприятия поясняется в сноске.
- source_word: אִם
  choice: Неужели
  rationale: Частица вводит второй параллельный риторический вопрос. В русском её функцию естественно передать повтором вопросительной конструкции, не переводя буквально как «если».
- source_word: לָאֵל
  choice: Бога
  rationale: אֵל обозначает здесь Бога, а предлог ל־ указывает, в чью пользу или от чьего имени ведётся спор. Эта связь выражена русским глаголом «защищать».
- source_word: תְּרִיבוּן
  choice: станете защищать
  rationale: Глагол ריב означает вести спор, препираться или отстаивать чью-либо сторону. «Защищать» ясно передаёт роль пристрастного заступника в данном контексте, а более буквальная возможность отмечена в сноске.
theological_decisions:
- issue: Обвиняет ли Иов друзей в пристрастной защите Бога
  choice: Два риторических вопроса обличают друзей за угождение Богу и выступление в Его защиту.
  alternative: «Разве вы будете лицеприятствовать Ему? Разве будете спорить за Бога?»
  rationale: 'Контекст упрёка друзьям поддерживает судебно-полемический смысл: они отстаивают сторону Бога не беспристрастно. При этом перевод не предполагает, что Богу действительно нужна защита, а передаёт обвинение Иова.'
translation_notes:
  register: Современный литературный русский язык; риторическая резкость сохранена повтором «Неужели». Прописная буква в «Его» вынесена только в буквальную формулировку сноски, тогда как основной текст избегает местоименной проблемы.
