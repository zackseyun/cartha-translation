  text: Though he slay me[a], I will not hope; yet I will argue my ways before him.
translation:
  language: ru
  text: Даже если Он убьёт меня, я не стану надеяться[a]; но я буду отстаивать перед Ним свои пути.
  philosophy: optimal-equivalence
  footnotes:
