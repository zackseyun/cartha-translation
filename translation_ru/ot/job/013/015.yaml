    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Пусть даже
  rationale: В данном сочетании вводит уступительное предположение; по-русски «пусть даже» естественно передаёт смысл «даже если» и сохраняет напряжённость речи.
- source_word: יִקְטְלֵנִי
  choice: Он убьёт меня
  rationale: Глагол קטל означает «убить». Простое «убьёт» звучит в современном русском серьёзно и достойно без искусственной архаизации.
- source_word: לֹא אֲיַחֵל
  choice: я не стану надеяться
  rationale: Следуем написанному масоретскому тексту с отрицанием לֹא. יחל допускает значения ожидания и надежды; «не стану надеяться» здесь передаёт его смысл прямо, не добавляя отсутствующего дополнения «на Него».
- source_word: אַךְ
  choice: но
  rationale: 'Передаёт противительный поворот: несмотря на возможную смерть и отсутствие надежды, Иов намерен изложить своё дело.'
- source_word: דְּרָכַי
  choice: свои пути
  rationale: Сохраняет буквальный образ «моих путей», который охватывает образ жизни и поведение Иова.
- source_word: אֶל־פָּנָיו
  choice: перед Ним
  rationale: Естественный русский эквивалент буквального «к Его лицу», выражающий непосредственное предстояние перед Богом.
- source_word: אוֹכִיחַ
  choice: буду отстаивать
  rationale: В судебно-полемическом контексте форма от יכח означает изложение и защиту своей позиции; «отстаивать» естественно сочетается с «свои пути» и сохраняет решимость Иова.
theological_decisions:
- issue: Следовать ли написанию לֹא («не») или традиционному чтению לוֹ («на Него»).
  choice: 'Основной текст следует масоретскому написанию לֹא: «я не стану надеяться».'
  alternative: «Пусть Он даже убьёт меня, всё же я буду надеяться на Него».
  rationale: Предоставленный еврейский текст содержит לֹא, то есть отрицание, а не לוֹ («Ему/на Него»). Традиционное чтение важно для истории толкования, поэтому оно отмечено в сноске, но не подменяет основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи Иова. Прописные местоимения «Он», «Ним» ясно указывают на Бога. Сохранены юридический оттенок глагола и образ «путей»; спорное чтение не сглажено.
