  text: Кто станет спорить со мной? Ведь тогда я умолкну и умру[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь теперь я умолкну и умру». Еврейское наречие обычно означает «теперь», но здесь многие понимают его как «тогда» — в соответствии с ходом рассуждения Иова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הוּא
  choice: Кто
  rationale: Сочетание вопросительного слова с местоимением придаёт вопросу эмфатическую силу; в современном русском она естественно передаётся кратким риторическим «Кто».
- source_word: יָרִיב
  choice: станет спорить
  rationale: Глагол ריב обозначает спор или тяжбу и здесь имеет состязательный, возможно судебный оттенок. «Станет спорить» сохраняет этот смысл, не вводя излишне узкой юридической терминологии.
- source_word: עִמָּדִי
  choice: со мной
  rationale: Предлог прямо передаёт участие в противоборстве; враждебный характер взаимодействия уже выражен глаголом «спорить».
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит обоснование риторического вызова Иова; «ведь» естественно передаёт аргументативную связь в русском языке.
- source_word: עַתָּה
  choice: тогда
  rationale: 'Обычно наречие означает «теперь», однако в ходе условно-следственного рассуждения Иова оно может указывать на результат: «тогда». Подлинная лексическая неоднозначность отмечена в сноске.'
- source_word: אַחֲרִישׁ
  choice: я умолкну
  rationale: Форма глагола חרש означает молчать или перестать говорить. «Умолкну» кратко и естественно передаёт предполагаемый результат вызова.
- source_word: וְאֶגְוָע
  choice: и умру
  rationale: Глагол גוע означает умереть, испустить дух. Простое «умру» сохраняет резкость и ясность высказывания.
