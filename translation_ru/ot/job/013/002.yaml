  yaml_path: translation/ot/job/013/002.yaml
  text: What you know[a], I also know; I am not inferior to you.
translation:
  language: ru
  text: То, что знаете вы, знаю и я; я не уступаю вам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я не ниже вас».'
    reason: Буквальнее сохраняет пространственный образ сравнительного оборота לֹא נֹפֵל אָנֹכִי מִכֶּם («не быть ниже, не отставать от»).
lexical_decisions:
- source_word: כְּדַעְתְּכֶם
  choice: что знаете вы
  rationale: Сочетание כְּ с דַּעַת и суффиксом 2-го лица множественного числа вводит сопоставление знания Иова со знанием его друзей. По-русски «что знаете вы» естественно соотносится с последующим «знаю и я».
- source_word: יָדַעְתִּי
  choice: знаю
  rationale: 'Перфект 1-го лица единственного числа здесь имеет статическое настоящее значение: Иов утверждает, что обладает тем же знанием.'
- source_word: גַם אָנִי
  choice: и я
  rationale: Частица גַם вместе с самостоятельным местоимением подчёркивает, что Иов также обладает этим знанием; «и я» естественно передаёт это в современном русском языке.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: я не ниже вас
  rationale: 'Причастие נֹפֵל с מִן выражает сравнительное значение: Иов отрицает, что стоит ниже собеседников или уступает им. «Не ниже вас» сохраняет образ и сравнительную силу еврейского выражения.'
