  text: Why do you hide your face and count me as your enemy?[a]
translation:
  language: ru
  text: Почему Ты скрываешь Своё лицо и считаешь меня Своим врагом?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «считаешь меня врагом по отношению к Тебе».'
    reason: לָךְ буквально обозначает отношение «Тебе/по отношению к Тебе»; основной текст естественно передаёт его выражением «Своим врагом».
lexical_decisions:
- source_word: לָמָה
  choice: Почему
  rationale: Прямой вопрос о причине; это естественный современный русский эквивалент.
- source_word: פָנֶיךָ
  choice: Своё лицо
  rationale: Сохранён конкретный библейский образ лица, который может подразумевать присутствие или благоволение Бога, без раскрытия метафоры в основном тексте.
- source_word: תַסְתִּיר
  choice: скрываешь
  rationale: Глагол означает «скрывать, прятать»; «скрываешь Своё лицо» естественно передаёт устойчивый библейский образ.
- source_word: וְתַחְשְׁבֵנִי
  choice: и считаешь меня
  rationale: חשב здесь означает «считать, расценивать, полагать»; выбранная формулировка сохраняет предикативную конструкцию и звучит естественно по-русски.
- source_word: לְאוֹיֵב
  choice: врагом
  rationale: 'Предлог לְ вводит предикативное дополнение после глагола «считать»: «считать врагом».'
- source_word: לָךְ
  choice: Своим
  rationale: 'Формально «Тебе/для Тебя»; в данной конструкции естественно выражает отношение к адресату: «Своим врагом».'
theological_decisions:
- issue: Антропоморфный образ Бога, скрывающего лицо
  choice: Сохранить выражение «скрываешь Своё лицо» в основном тексте.
  alternative: «удаляешь Своё присутствие» или «отворачиваешься от меня»
  rationale: Еврейский текст использует конкретный и богословски насыщенный образ Божьего лица. Его сохранение не сужает смысл до одного истолкования.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и поэтической прямоты речи Иова. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
