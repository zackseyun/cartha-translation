  source_fidelity: 'Союз и местоимение переданы верно как возобновление референта: «А он». Основной образ сохранён: субъект постепенно разрушается, уподобляясь רָקָב, и, параллельно, одежде, повреждённой молью. Однако сочетание «истлевает, как гниль» по-русски семантически и образно неудачно: «гниль» обычно обозначает состояние или процесс разложения, а не сопоставимый предмет. Более конкретное «нечто сгнившее» передаёт допустимое предметное понимание כְּרָקָב и делает сравнение ясным, не устраняя отмеченную в сноске лексическую альтернативу.'
