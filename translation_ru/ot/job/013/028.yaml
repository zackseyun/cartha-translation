  text: וְ֭/הוּא כְּ/רָקָ֣ב יִבְלֶ֑ה כְּ֝/בֶ֗גֶד אֲכָ֣ל/וֹ עָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/028.yaml
  text: while he wastes away like something rotten[a], like a garment eaten by moths.
translation:
  language: ru
  text: А он разрушается, словно нечто сгнившее[a], словно одежда, изъеденная молью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно гниль»; глагол может передаваться также: «истлевает», «ветшает».'
    reason: Лексема רָקָב допускает как отвлечённое значение «гниль, разложение», так и конкретное «нечто сгнившее»; יִבְלֶה означает постепенное изнашивание или разрушение.
lexical_decisions:
- source_word: וְהוּא
  choice: А он
  rationale: Сочетание союза с независимым местоимением возвращает внимание к страдальцу. «А он» естественно передаёт тематическое возобновление, не навязывая временного значения «пока».
- source_word: כְּרָקָב
  choice: как гниль
  rationale: רָקָב обозначает гниль, тление, разложение. «Как гниль» сохраняет краткий и несколько резкий образ оригинала; возможное предметное понимание отмечено в сноске.
- source_word: יִבְלֶה
  choice: истлевает
  rationale: בלה выражает постепенное изнашивание или разрушение. «Истлевает» подходит и к телесному распаду, и к параллельному образу ветшающей одежды.
- source_word: כְּבֶגֶד
  choice: как одежда
  rationale: בֶּגֶד — общее обозначение предмета одежды. Единственное число и поэтическое сравнение сохранены.
- source_word: אֲכָלוֹ
  choice: изъеденная
  rationale: Форма от אכל с местоименным суффиксом описывает одежду как съеденную молью. «Изъеденная» — естественное русское выражение для повреждения ткани молью.
- source_word: עָשׁ
  choice: молью
  rationale: Еврейское существительное стоит в единственном числе. Русское собирательное употребление «молью» естественно и сохраняет число оригинала.
theological_decisions:
- issue: Референт местоимения הוּא
  choice: Сохранено мужское местоимение «он» без пояснения, относится ли оно непосредственно к Иову или к человеку в более общем смысле.
  alternative: Передать «человек» или «я», явно определив референта.
  rationale: Оригинал употребляет местоимение третьего лица, а контекст допускает риторический сдвиг. Уточнение сняло бы присущую тексту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, образным и достойным поэтическим строем. Синтаксический параллелизм двух сравнений сохранён; архаизмы и конфессионально окрашенные формулы не использованы.
