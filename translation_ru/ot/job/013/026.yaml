lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование слов Иова и естественно передаёт причинно-пояснительную связь с предшествующим контекстом.
- source_word: תִכְתֹּב עָלַי
  choice: Ты записываешь против меня
  rationale: Сохраняется прямое значение כתב — «писать, записывать», а עַל в данном контексте передано в направленном против Иова смысле; юридический оттенок не превращён в однозначное «выносишь приговор».
- source_word: מְרֹרוֹת
  choice: горькое
  rationale: Субстантивированное прилагательное передаёт неопределённое «горькие вещи» и не сужает смысл до обвинений, решений или страданий.
- source_word: וְתוֹרִישֵׁנִי
  choice: и даёшь мне в наследство
  rationale: Естественная русская формулировка сохраняет каузативное значение формы глагола ירשׁ и образ наследования.
- source_word: עֲוֺנוֹת
  choice: беззакония
  rationale: Слово עָוֹן может обозначать проступок, вину либо последствие проступка; «беззакония» сохраняет основное нравственное значение, не устраняя контекстуальный оттенок вины и воздаяния.
- source_word: נְעוּרָי
  choice: моей юности
  rationale: 'Прямо передаёт конструкцию с суффиксом первого лица: беззакония, относящиеся к юным годам Иова.'
theological_decisions:
- issue: Значение עֲוֺנוֹת в контексте
  choice: Беззакония юности с подразумеваемым бременем вины или её последствий
  alternative: Вина юности; наказание за грехи юности
  rationale: Еврейское слово допускает значения проступка, вины и последствия проступка. Основной текст не сужает его до одного из этих смыслов, а примечание обозначает реальную многозначность.
- issue: Характер записываемого Богом
  choice: Неопределённое «горькое»
  alternative: Горькие обвинения; суровые решения или приговоры
  rationale: Контекст допускает судебный оттенок, однако существительное מְרֹרוֹת само по себе не уточняет, идёт ли речь об обвинениях, решениях либо тяжких обстоятельствах; эта напряжённость сохранена.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтических образов записи и наследства. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Необычное субстантивированное «горькое» намеренно сохраняет неопределённость еврейского множественного существительного.
