base_translation:
  language: en
  yaml_path: translation/ot/job/013/021.yaml
  text: Withdraw your hand far from me[b][a], and do not let your dread terrify me.
translation:
  language: ru
  text: Удали от меня Свою руку[a], и пусть Твой ужас[b] не приводит меня в трепет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отведи Свою руку прочь от меня»; буквально: «удали Свою руку с меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твой страх»; возможно также: «страх перед Тобой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְּךָ
  choice: Свою руку
  rationale: כַּף буквально обозначает ладонь или руку. В данном образе естественно русское «руку», сохраняющее конкретную метафору Божьего воздействия.
- source_word: מֵעָלַי הַרְחַק
  choice: Отведи от меня
  rationale: Побудительная форма רחק означает «удалить, отдалить», а מֵעָלַי — «от меня, прочь с меня». «Отведи от меня» естественно передаёт повеление и образ руки, тяготеющей над Иовом.
- source_word: אֵמָתְךָ
  choice: Твой ужас
  rationale: אֵימָה означает ужас, страх, трепет. Притяжательный суффикс сохранён буквально, без сведения выражения только к субъективному страху Иова или к одному определённому виду Божьего действия.
- source_word: אַל תְּבַעֲתַנִּי
  choice: пусть … не устрашает меня
  rationale: אַל с соответствующей глагольной формой выражает запрет или отрицательное пожелание; בעת означает устрашать, приводить в смятение. Конструкция сохраняет женский род подлежащего אֵמָתְךָ и естественна по-русски.
theological_decisions:
- issue: Антропоморфный образ Божьей руки
  choice: Сохранить буквальное «Свою руку».
  alternative: Свою силу; Свой удар; Своё наказание
  rationale: В еврейском тексте употреблён конкретный телесный образ. Его сохранение не предрешает, означает ли рука здесь силу, поражение, наказание или общее давление Божьего присутствия.
- issue: Значение выражения «Твой ужас»
  choice: Сохранить притяжательную конструкцию и неоднозначность.
  alternative: страх перед Тобой; ужас, внушаемый Тобой
  rationale: Суффикс второго лица допускает понимание ужаса как исходящего от Бога или связанного с Его присутствием. Основной текст не сужает эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной интонацией прямого обращения. Заглавные местоимения в обращении к Богу соответствуют принятой русской библейской стилистике; синтаксис остаётся кратким и поэтическим.
