  text: וּ֭/קְרָא וְ/אָנֹכִ֣י אֶֽעֱנֶ֑ה אֽוֹ אֲ֝דַבֵּ֗ר וַ/הֲשִׁיבֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/022.yaml
  text: Then call[a], and I will answer; or let me speak, and you reply to me.
translation:
  language: ru
  text: Тогда позови[a] — и я отвечу; или я буду говорить, а Ты ответь мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Позови — и я отвечу; или я буду говорить, а Ты ответь мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָא
  choice: Тогда позови
  rationale: Императив Qal 2 м. ед. от קרא. Союз ו передан как «тогда», чтобы естественно выразить первую из двух предлагаемых последовательностей диалога; более формально возможно просто «позови».
- source_word: וְאָנֹכִי
  choice: и я
  rationale: Самостоятельное местоимение 1-го лица придаёт субъекту некоторое ударение; русское явное «я» сохраняет его без неестественного усиления вроде «я сам».
- source_word: אֶעֱנֶה
  choice: отвечу
  rationale: 'Имперфект Qal 1 ед. от ענה означает ответ в предполагаемой ситуации: если Бог позовёт, Иов ответит.'
- source_word: אוֹ
  choice: или
  rationale: Разделительная частица вводит второй возможный порядок разговора.
- source_word: אֲדַבֵּר
  choice: я буду говорить
  rationale: Имперфект Piel 1 ед. от דבר. Будущее время естественно передаёт предложенную Иовом альтернативу и сохраняет формальную неоднозначность между намерением и волеизъявлением.
- source_word: וַהֲשִׁיבֵנִי
  choice: а Ты ответь мне
  rationale: Императив Hiphil 2 м. ед. с суффиксом 1 ед. от שוב здесь означает «ответить». Противительный союз «а» естественно обозначает смену ролей; прописное «Ты» соответствует прямому обращению Иова к Богу.
theological_decisions:
- issue: Характер обращения Иова к Богу
  choice: Сохранён прямой обмен повелительной и ответной формами без смягчения дерзновения Иова.
  alternative: 'Передать просьбу более почтительно: «позволь мне говорить» или «прошу, ответь мне».'
  rationale: Еврейский текст формулирует два прямых варианта разговора и не содержит частицы просьбы; смягчение устранило бы напряжённость судебно-диспутационного контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Тире подчёркивает последовательность реплик. «Позови» выбрано вместо более книжного «воззови»; обращение к Богу оформлено традиционным прописным «Ты».
