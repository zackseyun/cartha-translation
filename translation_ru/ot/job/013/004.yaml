  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «размазываете ложь»; возможно также: «сочиняете ложь». Еврейский глагол может обозначать нанесение или размазывание покрытия; основной перевод сохраняет этот образ.'
