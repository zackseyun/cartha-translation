  yaml_path: translation/ot/job/013/007.yaml
  text: Will you speak injustice for God[a], and deceit for him?
translation:
  language: ru
  text: Неужели вы будете говорить неправду в защиту Бога[a] и произносить ложь в Его защиту?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради Бога» / «Богу»; соответственно во второй части: «ради него» / «ему». Еврейский предлог допускает разные значения, хотя контекст скорее указывает на речь в защиту Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלְאֵל
  choice: в защиту Бога
  rationale: Предлог ל допускает значения направленности, пользы или представительства. В контексте Иов упрекает друзей за попытку защищать Бога неправедными доводами; перевод передаёт этот смысл, а возможная неоднозначность отмечена в сноске.
- source_word: תְּדַבְּרוּ
  choice: неужели вы станете говорить
  rationale: Вопросительная частица הֲ и имперфект образуют риторический укор. «Неужели вы станете» естественно передаёт вызов и нравственное негодование.
- source_word: עַוְלָה
  choice: несправедливое
  rationale: Слово обозначает неправду, несправедливость или неправедность. Субстантивированное «несправедливое» сохраняет нравственно-судебный оттенок и естественно сочетается с глаголом «говорить».
- source_word: וְלוֹ
  choice: в Его защиту
  rationale: Местоимение относится к Богу, а предлог ל употреблён параллельно первой части стиха. Повтор формулировки сохраняет смысловой параллелизм.
- source_word: רְמִיָּה
  choice: обман
  rationale: Существительное означает обман, коварство или лукавство. «Обман» сохраняет абстрактный характер слова и не сводит его только к отдельным высказываниям-лжи.
theological_decisions:
- issue: Говорят ли друзья в защиту Бога или обращаются к Богу
  choice: Иов упрекает друзей в том, что они говорят несправедливое, защищая Бога
  alternative: Иов упрекает их в том, что они говорят несправедливое Богу
  rationale: Контекст Иов 13:4, 8 изображает друзей как пристрастных защитников Божьей стороны. Поэтому значение представительства или защиты наиболее вероятно, однако грамматически возможное понимание направления речи сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Риторическое «неужели» передаёт обличительный тон; тире во второй части подчёркивает поэтический параллелизм и восполняет подразумеваемый глагол без ненужного повтора.
