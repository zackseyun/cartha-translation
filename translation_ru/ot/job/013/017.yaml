  text: Listen carefully to my word[a], and let my declaration be in your ears.
translation:
  language: ru
  text: Внимательно выслушайте моё слово, и пусть моё изложение[a] прозвучит в ваших ушах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё заявление»; возможно также: «моё объяснение».'
