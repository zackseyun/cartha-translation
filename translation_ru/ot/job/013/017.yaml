lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Внимательно выслушайте
  rationale: Сочетание личной формы глагола с абсолютным инфинитивом усиливает повеление. Наречие «внимательно» естественно передаёт эту эмфазу по-русски, а совершенный вид «выслушайте» подчёркивает призыв принять всю речь Иова.
- source_word: מִלָּתִי
  choice: моё слово
  rationale: Существительное מִלָּה означает «слово» или «речь». Единственное число «моё слово» сохраняет форму и торжественную сжатость древнееврейского выражения.
- source_word: וְאַחֲוָתִי
  choice: моё объяснение
  rationale: Редкое существительное, связанное с חוה, обозначает изложение, объяснение или заявление. «Объяснение» уместно в контексте развёрнутой защиты Иова, но лексическая неоднозначность отмечена в сноске.
- source_word: בְּאָזְנֵיכֶם
  choice: прозвучит в ваших ушах
  rationale: Оборот сохраняет конкретный образ «в ваших ушах», а добавленный по-русски глагол «прозвучит» естественно восполняет эллипсис древнееврейской строки и не превращает слушание в более отвлечённое «понимание».
