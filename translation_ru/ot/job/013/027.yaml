    reason: lexical_alternative
lexical_decisions:
- source_word: בַּסַּד
  choice: в колодки
  rationale: Сַד обозначает приспособление, сковывающее ноги. «Колодки» — ясный и естественный русский эквивалент, сохраняющий образ заключения и ограничения движения.
- source_word: וְתָשֵׂם
  choice: заключаешь
  rationale: Буквально глагол означает «кладёшь, помещаешь», но по-русски сочетание «заключаешь ноги в колодки» естественно передаёт действие без изменения смысла.
- source_word: וְתִשְׁמוֹר
  choice: следишь
  rationale: В данном контексте שׁמר выражает не защиту, а пристальное наблюдение за передвижениями Иова.
- source_word: כָּל אָרְחוֹתָי
  choice: всеми моими путями
  rationale: «Пути» сохраняет конкретный образ передвижения и возможный более широкий смысл жизненного поведения.
- source_word: עַל שָׁרְשֵׁי רַגְלַי
  choice: подошвы моих ног
  rationale: Буквально «корни моих ног»; в контексте это образное обозначение нижней части стоп. Дословное «корни ног» в современном русском было бы неясно.
- source_word: תִּתְחַקֶּה
  choice: очерчиваешь
  rationale: Форма от חקה передаёт нанесение черты, начертание или обозначение границы. «Очерчиваешь» сохраняет образ пристального контроля и ограничения, не сводя его к одному однозначному толкованию.
