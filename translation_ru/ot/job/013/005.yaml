  text: מִֽי יִ֭תֵּן הַחֲרֵ֣שׁ תַּחֲרִישׁ֑וּ/ן וּ/תְהִ֖י לָ/כֶ֣ם לְ/חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/005.yaml
  text: If only you would keep completely silent[a], and it would count as wisdom for you.
translation:
  language: ru
  text: О, если бы вы совсем замолчали — это было бы для вас мудростью!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы
  rationale: Устойчивая оптативная конструкция выражает сильное пожелание, а не буквальный вопрос «кто даст». Русское «О, если бы» естественно передаёт эмоциональную силу речи Иова.
- source_word: הַחֲרֵשׁ תַּחֲרִישׁוּן
  choice: вы совсем замолчали
  rationale: Инфинитив абсолютный при личной форме того же корня усиливает действие. «Совсем замолчали» передаёт как идею молчания, так и эмфазу конструкции.
- source_word: וּתְהִי
  choice: это было бы
  rationale: Форма женского рода может соотноситься с подразумеваемым молчанием или всей предшествующей ситуацией. Указательное «это» сохраняет такую референциальную широту без излишнего истолкования.
- source_word: לָכֶם
  choice: для вас
  rationale: Предлог ל обозначает отношение или пользу; «для вас» естественно звучит в русском оценочном высказывании.
- source_word: לְחָכְמָה
  choice: мудростью
  rationale: Предикативный творительный в конструкции «было бы мудростью» точно и естественно передаёт חָכְמָה с ל, не добавляя идеи внешней оценки вроде «считалось бы».
