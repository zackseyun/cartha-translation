base_translation:
  language: en
  yaml_path: translation/ot/job/013/012.yaml
  text: Your maxims are proverbs of ashes[a]; your defenses are defenses of clay.
translation:
  language: ru
  text: Ваши памятные изречения — пословицы из пепла[a], ваши укрепления — укрепления из глины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ваши напоминания — притчи из пепла, ваши возвышения — возвышения из глины». Еврейская строка предельно сжата, а её заключительная часть трудна для понимания; перевод «укрепления» следует контекстуальному толкованию дважды повторённого существительного.'
    reason: alternative_reading
lexical_decisions:
- source_word: זִכְרֹנֵיכֶם
  choice: ваши памятные изречения
  rationale: Существительное связано с памятью и памятованием, но в контексте обозначает изречения, которые друзья Иова выдают за весомую, достойную запоминания мудрость. Перевод сохраняет исходную связь с памятью и остаётся понятным по-русски.
- source_word: מִשְׁלֵי
  choice: пословицы
  rationale: מָשָׁל может означать пословицу, изречение или образное сравнение. «Пословицы» сохраняет именную конструкцию и оттенок литературы мудрости.
- source_word: אֵפֶר
  choice: пепел
  rationale: Это прямое и обычное значение слова; образ передаёт непрочность и ничтожность высказываний собеседников.
- source_word: לְגַבֵּי
  choice: —
  rationale: Трудная сжатая конструкция передана именным сказуемым с тире, естественным для русского языка, без добавления лишнего смыслового материала.
- source_word: חֹמֶר
  choice: глина
  rationale: Слово обозначает глину, грязь либо строительный раствор. «Глина» естественно сочетается с образом непрочных укреплений.
- source_word: גַּבֵּיכֶם
  choice: ваши укрепления
  rationale: Буквальное значение связано со спиной или возвышенной поверхностью, однако повтор существительного и контекст упрёка допускают метафорическое понимание как защитных сооружений или оборонительных позиций. «Укрепления» сохраняет конкретность образа лучше, чем отвлечённое «защита».
