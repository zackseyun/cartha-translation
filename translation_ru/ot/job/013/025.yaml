  language: ru
  text: Разве Ты станешь устрашать[a] лист, гонимый ветром, и преследовать сухую солому[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пугать»; еврейский глагол может означать наведение страха или ужаса, а в этом контексте также допускает оттенок сурового обращения.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «стерню» или «солому»; образ подчёркивает слабость и ничтожность того, кого преследуют.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָלֶה
  choice: лист
  rationale: Существительное עָלֶה в данном поэтическом образе означает отдельный лист; единственное число сохранено.
- source_word: נִדָּף
  choice: гонимый ветром
  rationale: Причастие от נדף описывает то, что уносится или гонится; указание на ветер естественно раскрывает образ по-русски, не меняя смысла.
- source_word: תַּעֲרוֹץ
  choice: будешь устрашать
  rationale: Глагол ערץ выражает наведение страха или ужаса. «Устрашать» сохраняет силу глагола и возвышенный тон риторического вопроса.
- source_word: וְאֶת
  choice: и
  rationale: Союз вводит второй параллельный образ; показатель прямого дополнения отдельно по-русски не передаётся.
- source_word: קַשׁ
  choice: солому
  rationale: קַשׁ обозначает сухие растительные остатки — солому или стерню. «Солома» естественно сочетается с определением «сухая» и передаёт образ крайней слабости.
- source_word: יָבֵשׁ
  choice: сухую
  rationale: Прилагательное прямо указывает на сухость растительного остатка, подчёркивая его хрупкость.
- source_word: תִּרְדֹּף
  choice: преследовать
  rationale: רדף обычно означает «преследовать, гнаться за». «Преследовать» соответствует поэтическому регистру и сохраняет параллелизм агрессивных действий.
theological_decisions:
- issue: Обращение Иова к Богу во втором лице
  choice: Ты — с прописной буквы
  alternative: ты — со строчной буквы
  rationale: Прописная буква соответствует принятому русскому библейскому издательскому употреблению и ясно обозначает обращение к Богу, не добавляя отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Частица «неужели» естественно передаёт возмущённый риторический вопрос. Формы будущего времени отражают модально-риторическое употребление еврейского имперфекта; параллелизм двух частей сохранён.
