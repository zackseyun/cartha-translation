  yaml_path: translation/ot/job/013/010.yaml
  text: He will surely rebuke you if in secret you show partiality[a].
translation:
  language: ru
  text: Он непременно обличит вас, если вы тайно проявляете пристрастие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возносить лица» — еврейское выражение со значением «проявлять пристрастие, лицеприятствовать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹכֵחַ יוֹכִיחַ
  choice: непременно обличит
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает утверждение. «Непременно» передаёт эмфазу, а «обличит» сохраняет смысл порицания и выявления неправоты в данном споре.
- source_word: אֶתְכֶם
  choice: вас
  rationale: Местоимение относится ко всем друзьям Иова; русская форма винительного падежа естественно передаёт объект во множественном числе.
- source_word: אִם
  choice: если
  rationale: Союз сохраняет условный характер предупреждения и не представляет поступок собеседников как бесспорно совершившийся.
- source_word: בַּסֵּתֶר
  choice: тайно
  rationale: Наречное употребление передаёт действие скрытно, не добавляя отсутствующих в тексте мотивов.
- source_word: פָּנִים תִּשָּׂאוּן
  choice: станете проявлять пристрастие
  rationale: Еврейская идиома буквально говорит о «поднятии лиц» и означает лицеприятное, предвзятое отношение. «Проявлять пристрастие» ясно и естественно передаёт её этико-судебный смысл; «станете» уместно выражает условное действие после «если».
theological_decisions:
- issue: Смысл идиомы נָשָׂא פָנִים в речи Иова
  choice: проявлять пристрастие
  alternative: лицеприятствовать; оказывать предпочтение
  rationale: 'Фраза указывает на предвзятое отношение, здесь — на необъективную защиту Божьей стороны друзьями Иова. Перевод не приписывает Богу неправоту и не снимает напряжения речи Иова: он предупреждает друзей, что пристрастная защита Бога сама навлечёт Божье обличение.'
translation_notes:
  register: Современный литературный русский язык с достоинством прямой полемической речи. «Обличит» сохраняет серьёзный, но понятный библейский регистр; «проявлять пристрастие» естественно передаёт идиому без конфессионального истолкования.
