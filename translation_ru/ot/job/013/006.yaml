lexical_decisions:
- source_word: שִׁמְעוּ נָא
  choice: выслушайте же
  rationale: Множественное повелительное שִׁמְעוּ призывает собеседников внимательно услышать Иова; частица просьбы נָא передана мягким, но настойчивым «же». «Выслушайте» естественно по-русски обозначает внимание к развёрнутой речи.
- source_word: תוֹכַחְתִּי
  choice: мои доводы
  rationale: תּוֹכַחַת может означать обличение, возражение, доказательство или аргументацию. Во внесудебно-полемическом контексте речи Иова «доводы» сохраняют смысл обоснованной позиции, не сводя слово только к нравственному обличению.
- source_word: וְרִבוֹת
  choice: и пререкания
  rationale: Форма от ריב обозначает споры, препирательства, тяжбу или словесные притязания. «Пререкания» сохраняет напряжённый спорный оттенок и допускает судебно-полемическое прочтение.
- source_word: שְׂפָתַי
  choice: моих уст
  rationale: Сохранён телесный поэтический образ буквального «моих губ»; в современном литературном русском сочетание «моих уст» естественнее с отвлечённым существительным и соответствует возвышенному регистру поэзии.
- source_word: הַקְשִׁיבוּ
  choice: вникните
  rationale: Глагол קשׁב выражает сосредоточенное внимание. «Вникните» усиливает простой призыв слушать и передаёт смысл внимательного восприятия, поддерживая ступенчатый параллелизм со словом «выслушайте».
