base_translation:
  language: en
  yaml_path: translation/ot/job/013/016.yaml
  text: This also will be my salvation[b][a], for no godless man may come before him.
translation:
  language: ru
  text: И это тоже[a] будет мне спасением[b], ибо нечестивец[c] не предстанет перед Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Он будет мне спасением». Еврейское местоимение допускает как указание на предшествующее («это»), так и личное прочтение («Он»).'
    reason: textual_ambiguity
  - marker: b
    text: 'Или: «избавлением», «оправданием».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «безбожник», «непочтительный к Богу человек». Здесь имеется в виду не просто лицемерный, а нечестивый человек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: И
  rationale: В данном контексте частица продолжает и усиливает предыдущую мысль; русское «и» естественно передаёт присоединительное значение, не перегружая фразу.
- source_word: הוּא
  choice: это
  rationale: Формально местоимение имеет значение «он», однако здесь оно может указывать на предшествующую ситуацию или утверждение. «Это» естественно связывает стих с предыдущей речью Иова; личное прочтение сохранено в сноске.
- source_word: לִי
  choice: мне
  rationale: 'Предложное сочетание выражает отношение пользы или результата: происходящее будет «мне спасением».'
- source_word: לִישׁוּעָה
  choice: спасением
  rationale: Существительное обозначает спасение или избавление и в контексте суда может включать оттенок оправдания. «Спасением» сохраняет широту и торжественность исходного слова.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предыдущего утверждения; причинная связь в русском выражена ясно и естественно.
- source_word: לְפָנָיו
  choice: перед Ним
  rationale: Обычное еврейское выражение присутствия перед кем-либо. В контексте местоимение относится к Богу; прописная буква помогает читателю распознать этот референт без вставки имени в текст.
- source_word: חָנֵף
  choice: нечестивец
  rationale: Слово обозначает безбожного, нечестивого или непочтительного к Богу человека, а не просто лицемера. «Нечестивец» кратко и точно передаёт религиозно-нравственный смысл.
- source_word: יָבֹוא
  choice: не предстанет
  rationale: Буквально глагол значит «придёт», но в сочетании «прийти перед кем-либо» речь идёт о явлении в его присутствии. «Предстанет перед Ним» естественно передаёт судебный оттенок контекста, не добавляя прямого утверждения о способности или дозволении.
theological_decisions:
- issue: Референт הוּא
  choice: «это» — предшествующая ситуация или утверждение Иова
  alternative: «Он» — Бог
  rationale: Грамматическая форма допускает личное прочтение «Он», однако контекст позволяет указательное употребление со значением «это». Основной текст следует контекстуальному прочтению, а подлинная неоднозначность сохранена в сноске.
- issue: Смысл יְשׁוּעָה в утверждении Иова
  choice: «спасение» с возможным оттенком избавления или оправдания
  alternative: «избавление» или «оправдание»
  rationale: Контекст тяжбы Иова с Богом придаёт слову судебный оттенок, но исходная лексема шире. Поэтому основной текст не сужает значение до одного лишь оправдания.
- issue: Референт местоимения в לְפָנָיו
  choice: Бог
  alternative: тот, перед кем Иов предстаёт
  rationale: В ближайшем контексте Иов говорит о своём обращении к Богу и о предстоянии перед Ним. Перевод сохраняет местоимение, не подставляя прямо слово «Бог».
- issue: Характер утверждения יָבֹוא
  choice: нечестивец «не предстанет» перед Богом
  alternative: не может или не смеет предстать перед Богом
  rationale: Еврейская форма сама по себе является формой несовершенного вида и не выражает явно модальность способности или дозволения. Будущее утверждение сохраняет формальную открытость текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конструкция «предстанет перед Ним» понятна современному читателю и сохраняет оттенок явления на суд; архаизмы вроде «пред лице Его» устранены.
