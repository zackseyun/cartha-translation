  text: אַךְ שְׁ֭תַּיִם אַל תַּ֣עַשׂ עִמָּדִ֑/י אָ֥ז מִ֝/פָּנֶ֗י/ךָ לֹ֣א אֶסָּתֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/013/020.yaml
  text: 'Only do not do two things to me[a]; then I will not hide myself from your face:'
translation:
  language: ru
  text: 'Только двух вещей не делай со мной — тогда я не стану скрываться от Твоего лица[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Твоего присутствия».'
    reason: 'Лексическая альтернатива: еврейское выражение מִפָּנֶיךָ буквально означает «от Твоего лица», но идиоматически может обозначать присутствие.'
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: 'Передаёт ограничительное значение частицы: Иов предваряет свою речь единственным условием, состоящим из двух просьб.'
- source_word: שְׁתַּיִם
  choice: двух вещей
  rationale: В еврейском тексте стоит субстантивированное числительное женского рода «две» без названного существительного; по-русски естественно восполнить «вещей».
- source_word: אַל תַּעַשׂ עִמָּדִי
  choice: не делай со мной
  rationale: Сохраняет конструкцию עשה с עִם и в данном контексте естественно вводит два действия, от которых Иов просит Бога воздержаться.
- source_word: אָז
  choice: тогда
  rationale: Передаёт следствие исполнения просьбы Иова.
- source_word: מִפָּנֶיךָ
  choice: от Твоего лица
  rationale: Сохраняет конкретный образ еврейского выражения «от твоего лица», которое также может обозначать присутствие адресата.
- source_word: לֹא אֶסָּתֵר
  choice: я не стану скрываться
  rationale: 'Нифаль глагола סתר здесь естественно понимать возвратно или непереходно: Иов не будет прятаться либо уклоняться от встречи с Богом.'
theological_decisions:
- issue: Смысл выражения מִפָּנֶיךָ
  choice: Сохранён образ «от Твоего лица»
  alternative: «от Твоего присутствия»
  rationale: Буквальный образ понятен по-русски и сохраняет поэтическую напряжённость обращения Иова к Богу; идиоматическое значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной поэтической образности. Заглавная буква в местоимении «Твоего» отражает прямое обращение к Богу. Двоеточие сохраняет связь со следующими стихами, где названы две просьбы.
