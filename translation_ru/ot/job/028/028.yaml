  register: 'Современный литературный русский с достоинством афористического изречения. «Вот» сохраняет отмеченность הֵן без архаического «се»; синтаксический параллелизм обеих частей сохранён. Конечный символ масоретской разметки WLC не переводится. Удалить техническую звёздочку после кавычек: она не является частью текста; единственный требуемый маркер сноски — [a].'
