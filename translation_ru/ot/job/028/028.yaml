lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Сохраняет повествовательную связь заключительного изречения, не уточняя сверх текста временную последовательность.
- source_word: לָאָדָם
  choice: человеку
  rationale: Единственное число соответствует еврейской форме, а русское «человек» естественно допускает собирательно-родовое значение.
- source_word: הֵן
  choice: вот
  rationale: Передаёт указательно-эмфатическую частицу и её торжественное привлечение внимания естественным современным русским словом.
- source_word: יִרְאַת אֲדֹנָי
  choice: страх перед Господом
  rationale: Сохраняет полный смысл יִרְאָה как благоговейного, трепетного страха, не ослабляя его до одного лишь «почтения»; «перед» идиоматично обозначает направленность чувства.
- source_word: הִיא חָכְמָה
  choice: это мудрость
  rationale: Явно передаёт усиленное отождествление посредством самостоятельного местоимения הִיא.
- source_word: וְסוּר מֵרָע
  choice: и удаляться от зла
  rationale: Инфинитивная конструкция сохраняет параллелизм и выражает сознательный отказ от нравственного зла.
- source_word: בִּינָה
  choice: разум
  rationale: В данном параллелизме естественно обозначает нравственное понимание и способность верно различать; «понимание» также возможно, но здесь менее афористично.
theological_decisions:
- issue: Родовое значение אָדָם
  choice: человеку
  alternative: людям / роду человеческому
  rationale: Еврейское слово стоит в единственном числе и представляет человечество в целом. Русское «человеку» сохраняет и форму, и родовое значение; сноска предотвращает ошибочное понимание как указания на отдельного мужчину.
- issue: Значение יִרְאַת אֲדֹנָי
  choice: страх перед Господом
  alternative: благоговение перед Господом
  rationale: «Страх» сохраняет богословское напряжение и широту исходного слова, включающего трепет и благоговение, тогда как одна лишь передача «благоговение» могла бы неоправданно смягчить его.
