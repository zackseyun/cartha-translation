  yaml_path: translation/ot/job/028/023.yaml
  text: God understands its way[a], and he knows its place.
translation:
  language: ru
  text: Бог понимает её путь и знает её место.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму, слово сочетается здесь с глаголами в единственном числе и обозначает единого Бога.
- source_word: הֵבִין
  choice: понимает
  rationale: Порода хифиль глагола בין выражает понимание или постижение; настоящее время передаёт вневременное утверждение о Божьем знании.
- source_word: דַּרְכָּהּ
  choice: путь к ней
  rationale: Буквально возможно «её путь», но в контексте поисков мудрости сочетание естественно обозначает путь к ней. В сноске сохранена более буквальная и неоднозначная альтернатива.
- source_word: וְהוּא
  choice: и Он
  rationale: Самостоятельное местоимение подчёркивает субъект; прописная буква помогает ясно отнести местоимение к Богу и соответствует распространённой русской библейской норме.
- source_word: יָדַע
  choice: знает
  rationale: Настоящее время естественно передаёт общее, непреходящее утверждение.
- source_word: אֶת מְקוֹמָהּ
  choice: место её
  rationale: מקום означает «место»; постпозиция местоимения сохраняет достоинство поэтической речи и женскую соотнесённость с мудростью.
theological_decisions:
- issue: К чему относятся женские местоименные суффиксы в «её путь» и «место её»
  choice: Они относятся к мудрости; в основном тексте её женский образ сохранён.
  alternative: 'Передать отвлечённо: «её путь» либо «путь мудрости… её место», без усиления олицетворения.'
  rationale: В контексте Иов 28 речь идёт о мудрости, а еврейские суффиксы женского рода согласуются с חָכְמָה. Русский язык также естественно обозначает «мудрость» местоимением женского рода, поэтому нет оснований обезличивать её.
- issue: Значение выражения דַּרְכָּהּ
  choice: «путь к ней»
  alternative: «её путь»
  rationale: Контекст вопроса о том, где найти мудрость, поддерживает направительное понимание «путь к ней», однако грамматически возможное буквальное «её путь» сохранено в примечании, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с лаконичным поэтическим ритмом. Женский род референта сохранён естественно для русского слова «мудрость»; архаизация сведена к умеренной постпозиции в выражении «место её».
