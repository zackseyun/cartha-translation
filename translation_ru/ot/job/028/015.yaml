  yaml_path: translation/ot/job/028/015.yaml
  text: Fine gold cannot be given in exchange for it[c][b][a], nor can silver be weighed as its price.
translation:
  language: ru
  text: Нельзя отдать за неё чистое золото[a], и серебра не отвесить в уплату за неё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отборное золото».'
    reason: lexical_alternative
  - marker: b
    text: Серебро в древности отвешивали при плате; смысл строки в том, что никакого количества серебра не хватит, чтобы заплатить за мудрость.
    reason: cultural_note
lexical_decisions:
- source_word: יֻתַּן
  choice: нельзя отдать
  rationale: Пассивная форма נתן с отрицанием выражает невозможность предложить золото в обмен; безличная русская конструкция естественна и сохраняет смысл.
- source_word: סְגוֹר
  choice: чистое золото
  rationale: В поэтическом контексте слово обозначает очищенное, отборное золото, а не золото вообще.
- source_word: תַּחְתֶּיהָ
  choice: за неё
  rationale: תחת с местоименным суффиксом здесь обозначает замену или обмен; женский суффикс отсылает к мудрости из ближайшего контекста.
- source_word: יִשָּׁקֵל
  choice: не отвесить
  rationale: שקל описывает отвешивание серебра при расчёте; инфинитивная безличная конструкция передаёт невозможность и естественно звучит по-русски.
- source_word: כֶּסֶף
  choice: серебра
  rationale: Сохранён конкретный образ серебра, служившего средством платежа, а не обобщённое «деньги».
- source_word: מְחִירָהּ
  choice: в уплату за неё
  rationale: מְחִיר обозначает цену или плату; такой оборот ясно передаёт коммерческий образ и естественнее буквального «как её цену».
theological_decisions:
- issue: Что является предметом передачи в первой строке
  choice: золото отдают за мудрость
  alternative: мудрость отдают в обмен на золото
  rationale: Грамматика еврейского текста делает סְגוֹר («чистое золото») подлежащим пассивного יֻתַּן, а תַּחְתֶּיהָ означает «за неё», то есть за мудрость.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Женское местоимение «неё» сохраняет связь с мудростью из контекста. Архаическое, но понятное «отвесить» уместно для древнего способа расчёта серебром.
