  yaml_path: translation/ot/job/028/022.yaml
  text: Abaddon and Death say[a], ‘With our ears we have heard a report of it.’
translation:
  language: ru
  text: 'Аваддон и Смерть говорят:


    «Своими ушами мы слышали весть о ней».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Погибель и смерть сказали: „Своими ушами мы услышали весть о ней“».'
    reason: 'Лексическая и временная альтернатива: אֲבַדּוֹן может означать «погибель», אָמְרוּ — «сказали», а שִׁמְעָהּ — «весть», «молву» или «слух» о ней.'
lexical_decisions:
- source_word: אֲבַדּוֹן
  choice: Аваддон
  rationale: Транслитерация сохраняет поэтическую персонификацию погибели как говорящей области или силы в параллели со Смертью; значение пояснено в сноске.
- source_word: וָמָוֶת
  choice: и Смерть
  rationale: Прописная буква передаёт явную поэтическую персонификацию, не утверждая при этом отдельного онтологического статуса.
- source_word: אָמְרוּ
  choice: говорят
  rationale: Хотя форма является перфектом, в поэтическом контексте она допускает живое настоящее или обобщённое высказывание.
- source_word: בְּאָזְנֵינוּ
  choice: до наших ушей
  rationale: Естественный русский оборот сохраняет упоминание ушей и подчёркивает косвенность полученного знания.
- source_word: שָׁמַעְנוּ
  choice: дошёл
  rationale: В сочетании со словом «слух» идиоматично передаёт факт услышанного сообщения, имеющего значение в настоящем контексте.
- source_word: שִׁמְעָהּ
  choice: слух о ней
  rationale: Существительное может означать слух, молву или весть; местоимение женского рода соотнесено с мудростью из контекста.
theological_decisions:
- issue: Персонификация Аваддона и Смерти
  choice: Оба представлены как говорящие персонифицированные силы или области.
  alternative: Передать אֲבַדּוֹן нарицательным «погибель», а «смерть» написать со строчной буквы.
  rationale: Глаголы речи и слуха создают персонификацию; транслитерация и прописная буква сохраняют образ, не превращая его в догматическое утверждение.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической краткостью. «Лишь» естественно подчёркивает, что Аваддон и Смерть знают мудрость только по слуху; это подразумевается контекстом и образом услышанной вести.
