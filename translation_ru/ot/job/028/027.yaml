lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временную последовательность в поэтическом описании отношения Бога к мудрости.
- source_word: רָאָהּ
  choice: увидел её
  rationale: Сохраняет конкретное значение ראה; местоимение женского рода естественно отсылает к мудрости.
- source_word: וַיְסַפְּרָהּ
  choice: исчислил её
  rationale: Сохраняет базовую семантику ספר — считать, исчислять — и не снимает неоднозначности глагола; возможные значения «возвестил» и «изложил» отмечены в сноске.
- source_word: הֱכִינָהּ
  choice: утвердил её
  rationale: 'Передаёт каузативное значение כון: сделать твёрдым, установить, привести в устойчивое состояние.'
- source_word: וְגַם
  choice: и
  rationale: В последовательности однородных действий русское «и» естественно передаёт добавочное значение сочетания; усилительное «также» здесь звучало бы тяжеловесно.
- source_word: חֲקָרָהּ
  choice: исследовал её
  rationale: Передаёт значение тщательного поиска и глубокого рассмотрения, выраженное חקר.
theological_decisions:
- issue: К чему относятся местоименные суффиксы женского рода
  choice: Все четыре местоимения относятся к мудрости из ближайшего контекста.
  alternative: Они могут пониматься более отвлечённо — как относящиеся к мере или устройству мудрости.
  rationale: Грамматический женский род и ближайший контекст прямо поддерживают отнесение к «мудрости», при этом перевод не усиливает олицетворение сверх того, что выражено в еврейском тексте.
- issue: Смысл действия וַיְסַפְּרָהּ
  choice: «исчислил её» сохраняет образ полного определения и учёта мудрости Богом.
  alternative: «возвестил её», «изложил её» или «перечислил её».
  rationale: Еврейский ספר допускает значения счёта и повествования/возвещения. Основной текст сохраняет конкретный счётный оттенок, а сноска открыто отмечает лексическую неоднозначность, не превращая стих в однозначное утверждение об откровении мудрости.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Повтор «её» сохранён ради соответствия четырём еврейским местоименным суффиксам и ритмической последовательности действий.
