  source_fidelity: Первое предложение верно передаёт אֱנוֹשׁ как обобщающее «человек», יָדַע как констатацию «не знает» и עֶרְכָּהּ как ценность/стоимость. Однако «не найти её» в русском языке обычно имеет оттенок невозможности или побуждения и тем самым менее точно передаёт простой пассив תִּמָּצֵא («она не находится / её не находят»).
