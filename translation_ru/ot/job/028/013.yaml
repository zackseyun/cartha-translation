  text: לֹא יָדַ֣ע אֱנ֣וֹשׁ עֶרְכָּ֑/הּ וְ/לֹ֥א תִ֝מָּצֵ֗א בְּ/אֶ֣רֶץ הַֽ/חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/013.yaml
  text: Man does not know its worth[b][a], and it is not found in the land of the living.
translation:
  language: ru
  text: Человек не знает её ценности, и её не находят в стране живых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её стоимости» или «её цены». Еврейское слово обозначает оценку, ценность или цену.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Еврейское существительное в единственном числе обозначает смертного человека как представителя человеческого рода; «человек» естественно сохраняет эту обобщающую форму.
- source_word: יָדַע
  choice: не знает
  rationale: Форма qatal в данном контексте выражает общее положение; настоящее время передаёт это без добавления отсутствующей в тексте модальности невозможности.
- source_word: עֶרְכָּהּ
  choice: ей цены
  rationale: Существительное от ערך означает оценку, ценность или цену. Русское выражение «не знает ей цены» естественно передаёт смысл неизвестной человеку ценности мудрости и сохраняет её неизмеримость в контексте.
- source_word: תִמָּצֵא
  choice: не найти её
  rationale: Безличная русская конструкция естественно передаёт еврейский пассив и не вносит усиленного значения «невозможно найти».
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: в стране живых
  rationale: Сохраняется традиционный поэтический образ земного мира, где обитают живые люди, без сведения его к более толковательному «среди живых».
theological_decisions:
- issue: Относится ли утверждение к незнанию или к принципиальной неспособности человека узнать ценность мудрости
  choice: не знает
  alternative: не может узнать
  rationale: Глагол ידע прямо выражает знание, но сам по себе не обозначает невозможность; поэтому богословски более сильная модальность не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим строем. «Страна живых» сохраняет библейский образ, а «не знает ей цены» звучит естественно и достойно; местоимение «её» соотносится с мудростью из контекста.
