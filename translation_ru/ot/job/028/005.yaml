lexical_decisions:
- source_word: אֶרֶץ
  choice: земля
  rationale: Слово обозначает землю/почву; здесь поверхность, дающая пищу, противопоставлена разрабатываемым недрам, а не конкретной территории.
- source_word: מִמֶּנָּה
  choice: из неё
  rationale: Женский суффикс отсылает к слову «земля»; русский перевод сохраняет это согласование.
- source_word: יֵצֵא
  choice: выходит
  rationale: Передаёт конкретный образ выхода произведённого землёй хлеба без добавления отсутствующей в тексте каузативности.
- source_word: לָחֶם
  choice: хлеб
  rationale: Сохранён конкретный и традиционный образ древнееврейского текста, хотя в контексте слово может шире подразумевать пищу.
- source_word: וְתַחְתֶּיהָ
  choice: а внизу
  rationale: Союз «а» естественно выражает контраст между плодородной поверхностью земли и потревоженными недрами; «внизу» кратко и ясно передаёт пространственный смысл.
- source_word: נֶהְפַּךְ
  choice: она перевёрнута
  rationale: Страдательная форма сохраняет значение переворачивания/опрокидывания земли в контексте разработки недр, не уточняя явно действующее лицо.
- source_word: כְּמוֹ אֵשׁ
  choice: словно огнём
  rationale: Инструментальная формулировка естественна по-русски и передаёт возможный смысл преобразования как бы воздействием огня; подлинная неоднозначность сравнения отмечена в сноске.
