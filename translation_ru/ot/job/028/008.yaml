  yaml_path: translation/ot/job/028/008.yaml
  text: The proud beasts have not trodden it[a]; the lion has not passed over it.
translation:
  language: ru
  text: Не ступали по ней гордые звери[a], не проходил по ней лев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны гордости». Вероятно, имеются в виду величавые дикие звери, особенно хищники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדְרִיכֻהוּ
  choice: не ступали по ней
  rationale: В породе хифиль глагол דרך здесь описывает движение по скрытой стезе. Русское «ступали по ней» естественно передаёт прохождение пути и сохраняет образ следов зверя.
- source_word: בְנֵי שָׁחַץ
  choice: гордые звери
  rationale: Буквально «сыны гордости». В параллели со שׁחל («лев») выражение, вероятнее всего, обозначает величавых или свирепых диких зверей; перевод сохраняет образ, а буквальная форма вынесена в сноску.
- source_word: עָדָה עָלָיו
  choice: не проходил по ней
  rationale: Сочетание глагола с על обозначает движение по чему-либо или через него. «Проходил по ней» естественно согласуется со словом «стезя», подразумеваемым контекстом.
- source_word: שָׁחַל
  choice: лев
  rationale: Поэтическое обозначение льва, возможно с оттенком силы или свирепости. Простое «лев» ясно и не перегружает строку толкованием.
