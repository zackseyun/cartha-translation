  text: מִ֭/בְּכִי נְהָר֣וֹת חִבֵּ֑שׁ וְ֝/תַעֲלֻמָ֗הּ יֹ֣צִא אֽוֹר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/028/011.yaml
  text: He dams up the sources of the rivers[a], and brings what is hidden out to the light.
translation:
  language: ru
  text: Он преграждает просачивание речных вод[a] и выводит сокрытое на свет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перекрывает капли речных потоков». Редкое еврейское слово связано с образом «плача» и может обозначать капающую или сочащуюся воду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּכִי
  choice: просачивание
  rationale: Редкое и трудное слово буквально связано с «плачем»; в контексте горных работ оно, вероятнее всего, обозначает сочащуюся или капающую воду. «Просачивание» сохраняет этот образ и естественно сочетается с перекрытием воды.
- source_word: נְהָרוֹת
  choice: речных вод
  rationale: Форма означает «реки» или «потоки». В сочетании с редким מִבְּכִי по-русски естественнее передать воду, просачивающуюся из речных или подземных потоков, не сводя смысл только к крупным рекам.
- source_word: חִבֵּשׁ
  choice: преграждает
  rationale: Глагол имеет значение «связывать, сдерживать, перекрывать». «Преграждает» ясно передаёт практическое прекращение притока воды при горных работах и не требует добавлять отсутствующий в тексте предмет вроде плотины.
- source_word: תַּעֲלֻמָהּ
  choice: сокрытое
  rationale: Существительное обозначает нечто скрытое или утаённое. Нейтральное «сокрытое» сохраняет широту значения и не уточняет без достаточных оснований, идёт ли речь именно о руде, сокровище или иной скрытой вещи.
- source_word: יֹצִא
  choice: выводит
  rationale: Порода hифиль от יצא означает «заставляет выйти, выводит». Русское «выводит ... на свет» точно и естественно передаёт каузативный смысл.
- source_word: אוֹר
  choice: на свет
  rationale: Устойчивое русское выражение «выводить на свет» сохраняет противопоставление сокрытого и явленного.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, образным параллелизмом. Субъект оставлен как обобщённое «он», соответствующее мужскому единственному числу еврейского текста и ближайшему контексту описания рудокопа. Лексическая неясность первой строки вынесена в сноску; в основном тексте выбран контекстуально вероятный смысл, связанный с отводом воды при добыче.
