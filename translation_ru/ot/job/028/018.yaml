  text: Coral and crystal are not worth mentioning, and the price of wisdom is above pearls.
translation:
  language: ru
  text: Кораллы и хрусталь не стоят упоминания, а обретение мудрости ценнее жемчуга.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские слова, переданные как «обретение» и «жемчуг», допускают иные толкования: первое может пониматься как «цена» или «стоимость», а второе — как иной драгоценный материал.'
    reason: מֶשֶׁךְ — редкое слово с оспариваемым значением; точная идентификация פְּנִינִים также не вполне установлена. Примечание сохраняет неоднозначность оригинала.
lexical_decisions:
- source_word: רָאמוֹת
  choice: кораллы
  rationale: Редкое слово, по контексту обозначающее ценный материал; традиционное и вероятное соответствие — кораллы.
- source_word: גָבִישׁ
  choice: хрусталь
  rationale: Обозначает кристалл или горный хрусталь; «хрусталь» естественно звучит в перечне драгоценностей.
- source_word: לֹא יִזָּכֵר
  choice: не стоят упоминания
  rationale: Буквально «не будут упомянуты»; в сравнительном контексте выражает ничтожность их ценности рядом с мудростью.
- source_word: מֶשֶׁךְ חָכְמָה
  choice: цена мудрости
  rationale: מֶשֶׁךְ — редкое и спорное слово, которое здесь вероятнее всего связано со стоимостью или приобретением; «цена» сохраняет экономический образ контекста и соответствует консультационному слою.
- source_word: פְּנִינִים
  choice: жемчуга
  rationale: Точное значение спорно (жемчуг, кораллы или иные драгоценности); «жемчуг» — традиционное контекстуально уместное соответствие.
theological_decisions:
- issue: Сравнительная ценность мудрости
  choice: цена мудрости выше жемчуга
  alternative: приобретение мудрости ценнее жемчуга
  rationale: Формулировка сохраняет поэтическое сопоставление мудрости с дорогостоящими материалами, не добавляя учения о способе ее получения.
translation_notes:
  register: Современный литературный русский язык; краткий, возвышенный поэтический параллелизм. Редкие названия материалов переданы понятными традиционными эквивалентами без перегрузки текста примечаниями.
