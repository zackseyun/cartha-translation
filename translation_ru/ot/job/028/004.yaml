lexical_decisions:
- source_word: פָּרַץ
  choice: пробивает
  rationale: Глагол означает «прорывать, пробивать». В контексте добычи руды он передаёт усилие, с которым в земле прокладывают выработку.
- source_word: נַחַל
  choice: шахту
  rationale: Обычно слово обозначает поток, русло или долину потока, однако в горнорудном контексте главы вероятнее всего имеется в виду прорубленная в земле выработка. «Шахта» ясно передаёт предполагаемый образ, а обычное значение отмечено в сноске.
- source_word: מֵעִם
  choice: вдали от
  rationale: Предлог выражает удаление от близости; по-русски это естественно передаётся сочетанием «вдали от».
- source_word: גָּר
  choice: жилья
  rationale: Слово может означать пришельца или временно живущего человека. В трудной конструкции строки оно, вероятно, указывает на обитаемое место; «жильё» сохраняет пространственный смысл без излишней конкретизации.
- source_word: הַנִּשְׁכָּחִים מִנִּי־רָגֶל
  choice: там, куда не ступает нога
  rationale: Буквально выражение говорит о «забытых ногой». Русская формулировка сохраняет образ человеческой ноги и естественно передаёт недоступность или незаметность этого места для ходящих по поверхности.
- source_word: דַּלּוּ
  choice: висят
  rationale: Глагол может описывать свисание, подвешенность или спуск вниз. В шахтном контексте вероятен образ работников, висящих или спускаемых на верёвках.
- source_word: מֵאֱנוֹשׁ
  choice: вдали от других людей
  rationale: אֱנוֹשׁ обозначает смертного человека или человечество. Добавление «других» по-русски проясняет, что сами висящие также являются людьми, но находятся в удалении от человеческого общества.
- source_word: נָעוּ
  choice: раскачиваются
  rationale: Глагол означает двигаться из стороны в сторону, шататься или колебаться; применительно к подвешенным шахтёрам естественно «раскачиваются».
