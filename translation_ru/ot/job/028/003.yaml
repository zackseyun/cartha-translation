  yaml_path: translation/ot/job/028/003.yaml
  text: He sets an end to darkness[a], and he searches out every limit, the stones of gloom and deep darkness.
translation:
  language: ru
  text: Он кладёт конец тьме и исследует до самых дальних пределов камень мрака и глубокой тьмы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более традиционно: «камень мрака и смертной тени».'
    reason: Сохраняет традиционное прочтение צַלְמָוֶת и отражает генитивную связь אֶבֶן с последующими существительными.
lexical_decisions:
- source_word: קֵץ שָׂם לַחֹשֶׁךְ
  choice: кладёт конец тьме
  rationale: Сочетание קֵץ с שָׂם буквально выражает установление конца или предела; русское «кладёт конец» естественно и сохраняет образ устранения тьмы в ходе разработки недр.
- source_word: וּלְכָל תַּכְלִית
  choice: до самых дальних пределов
  rationale: תַּכְלִית здесь означает край, предел или крайнюю точку, а не нравственное совершенство. Множественное число в русском естественно передаёт всеохватность כָל и масштаб поисков.
- source_word: הוּא חוֹקֵר
  choice: исследует
  rationale: חקר обозначает тщательное разыскивание или исследование. «Исследует» подходит к контексту проникновения человека в глубины земли.
- source_word: אֶבֶן
  choice: камень
  rationale: Сохранено формально единственное число еврейского текста. В контексте оно может иметь собирательный смысл — каменная порода или камни, — но перевод не устраняет эту неоднозначность.
- source_word: אֹפֶל
  choice: мрак
  rationale: אֹפֶל означает густой мрак; «мрак» отличает это слово от חֹשֶׁךְ («тьма») в первой части стиха.
- source_word: צַלְמָוֶת
  choice: глубокая тьма
  rationale: В контексте подземных работ слово естественно обозначает непроглядную, глубокую тьму. Традиционное понимание «смертная тень» сохранено в сноске.
theological_decisions:
- issue: Значение צַלְמָוֶת
  choice: глубокая тьма
  alternative: смертная тень
  rationale: Шахтный контекст указывает прежде всего на непроглядную подземную тьму, однако состав слова и традиция перевода допускают образ смертной тени; альтернативное чтение не исключено и вынесено в сноску.
- issue: Референт местоимения הוּא
  choice: Он
  alternative: человек / рудокоп
  rationale: Еврейский текст употребляет местоимение без явного существительного в этом стихе. Перевод «Он» сохраняет грамматическую форму и не добавляет прямо названного деятеля, хотя контекст говорит о человеке, занимающемся добычей.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис оставлен сжатым, как в еврейском оригинале; повтор «тьме… тьме» отражает разные еврейские слова и нарастание образа мрака.
