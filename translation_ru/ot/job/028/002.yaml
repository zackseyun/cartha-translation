  yaml_path: translation/ot/job/028/002.yaml
  text: Iron is taken from the dust[a], and copper is smelted from stone.
translation:
  language: ru
  text: 'Железо добывают из праха,

    а из камня выплавляют медь[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бронзу». Древнееврейское слово может обозначать медь или бронзу; здесь предпочтено слово «медь», поскольку речь идёт о добыче металла из руды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: железо
  rationale: Обычное значение этого древнееврейского существительного — металл железо.
- source_word: מֵעָפָר
  choice: из праха
  rationale: עָפָר обозначает прах, пыль или рыхлую землю. «Из праха» сохраняет конкретный поэтический образ исходного текста и остаётся понятным в контексте добычи металла.
- source_word: יֻקָּח
  choice: добывают
  rationale: Пассивная форма глагола לקח буквально означает «берётся». В контексте горных работ русское «добывают» естественно передаёт смысл, не меняя того, что железо получают из земли.
- source_word: וְאֶבֶן
  choice: а из камня
  rationale: אֶבֶן значит «камень». Предлог «из» выражен по смыслу второй части параллельной конструкции; союз «а» естественно связывает две сопоставленные строки.
- source_word: יָצוּק
  choice: выплавляют
  rationale: יצק может означать «лить», «отливать» или, в соответствующем контексте, «выплавлять». Здесь речь идёт о получении металла из рудного камня, поэтому выбрано «выплавляют».
- source_word: נְחוּשָׁה
  choice: медь
  rationale: Термин может обозначать медь или бронзу. В контексте добычи металла из камня «медь» точнее, поскольку медь получают из руды, тогда как бронза является сплавом.
