  text: נָ֭תִיב לֹֽא יְדָ֣ע/וֹ עָ֑יִט וְ/לֹ֥א שְׁ֝זָפַ֗תּ/וּ עֵ֣ין אַיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/007.yaml
  text: A path no bird of prey knows[a], and the eye of the falcon has not seen it.
translation:
  language: ru
  text: Тропы этой не знает хищная птица, и глаз сокола[a] её не видел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «коршуна». Еврейское слово обозначает хищную птицу, но точный вид определить трудно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתִיב
  choice: тропа
  rationale: Слово обозначает путь или тропу; «тропа» естественно передаёт поэтический образ скрытого пути.
- source_word: לֹא יְדָעוֹ
  choice: этой не знает
  rationale: Глагол ידע с местоименным суффиксом означает «не знает её»; указательное «этой» ясно соотносится с тропой и сохраняет русскую поэтическую инверсию.
- source_word: עָיִט
  choice: хищная птица
  rationale: Это общее обозначение птицы, питающейся добычей, а не надёжно установленный вид.
- source_word: וְלֹא שְׁזָפַתּוּ
  choice: её не видел
  rationale: שׁזף здесь означает увидеть или заметить; простой глагол «видел» сохраняет ясность и параллелизм.
- source_word: עֵין
  choice: глаз
  rationale: Буквальное «глаз» сохраняет конкретный поэтический образ еврейского текста.
- source_word: אַיָּה
  choice: сокол
  rationale: Слово обозначает хищную птицу неопределённого точного вида; «сокол» понятно современному читателю, а неопределённость отмечена в сноске.
theological_decisions: []
