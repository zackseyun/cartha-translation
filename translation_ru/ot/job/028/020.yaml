  yaml_path: translation/ot/job/028/020.yaml
  text: But wisdom—from where does it come? And where is the place of understanding?[a]
translation:
  language: ru
  text: Но мудрость — откуда она приходит? И где место разумения?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «И мудрость — откуда приходит, и где место разумения?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Но мудрость
  rationale: Союз וְ может означать «и», однако здесь он возвращает читателя к главному вопросу поэмы и имеет оттенок противопоставления; «но» естественно передаёт этот риторический поворот.
- source_word: מֵאַיִן
  choice: откуда
  rationale: Вопросительное слово с предлогом מִן указывает на источник или происхождение. Русское «откуда» точно и естественно сохраняет этот смысл.
- source_word: תָּבוֹא
  choice: она приходит
  rationale: Имперфект qal, 3-е лицо женского рода, согласуется с «мудростью» и в данном общем риторическом вопросе уместно передаётся настоящим временем.
- source_word: וְאֵי זֶה
  choice: И где
  rationale: Сочетание имеет местное вопросительное значение «где?». Частица זֶה может добавлять оттенок «же», но его не обязательно выражать отдельно.
- source_word: מְקוֹם
  choice: место
  rationale: Прямое соответствие еврейскому слову; сохраняет пространственный образ оригинала и поэтическую параллельность.
- source_word: בִּינָה
  choice: разумение
  rationale: «Разумение» передаёт способность глубоко понимать и различать, сохраняет связь с традиционной лексикой литературы мудрости и звучит dignified, не будучи непонятным современному читателю.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим оттенком. Тире перед «откуда» сохраняет риторическое выдвижение слова «мудрость», а местоимение «она» делает синтаксис естественным по-русски. «Разумение» выбрано вместо более обыденного «понимания» ради смысловой пары с «мудростью» и регистра книги Иова.
