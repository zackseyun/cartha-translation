  yaml_path: translation/ot/job/028/016.yaml
  text: It cannot be valued with the gold of Ophir[b][a], with precious onyx or sapphire.
translation:
  language: ru
  text: Её не оценить золотом Офира, драгоценным ониксом[a] и сапфиром[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «бериллом»; точное соответствие древнееврейского названия этого камня неизвестно.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно, «лазуритом»: древняя классификация минералов отличалась от современной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְסֻלֶּה
  choice: не оценить
  rationale: Пуаль от סלל в контексте сопоставления мудрости с драгоценностями передаёт оценку или определение стоимости. Русское «не оценить» естественно выражает невозможность измерить её ценность этими сокровищами, не сводя смысл только к буквальному взвешиванию.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: золотом Офира
  rationale: כֶּתֶם обозначает высококачественное, очищенное золото, а Офир — прославленный источник золота. Творительный падеж естественно передаёт בְּ как средство или меру оценки.
- source_word: שֹׁהַם
  choice: оникс
  rationale: Точное определение древнееврейского названия камня остаётся неясным. «Оникс» сохраняет традиционное и узнаваемое соответствие, а возможный вариант указан в сноске.
- source_word: יָקָר
  choice: драгоценным
  rationale: Прилагательное подчёркивает высокую ценность камня; «драгоценный» естественно для современного русского языка и сохраняет поэтический регистр.
- source_word: סַפִּיר
  choice: сапфир
  rationale: «Сапфир» — традиционное соответствие, хотя древнее название, возможно, относилось к лазуриту. Эта минералогическая неопределённость сохранена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Местоимение «её» сохраняет подразумеваемое в древнееврейском тексте указание на мудрость из ближайшего контекста. Неопределённость в названиях камней вынесена в сноски.
