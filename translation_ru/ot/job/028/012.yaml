lexical_decisions:
- source_word: וְהַחָכְמָה
  choice: Но мудрость
  rationale: Союз וְ передаёт риторический поворот от описания добычи земных сокровищ к вопросу о мудрости; русское «но» естественно обозначает это противопоставление.
- source_word: מֵאַיִן
  choice: где
  rationale: Буквально выражение означает «откуда», то есть спрашивает об источнике. В сочетании с «найти» современное русское «где» звучит естественно, а буквальный оттенок сохранён в сноске.
- source_word: תִּמָּצֵא
  choice: найти
  rationale: Нифаль имперфекта מצא означает «быть найденной». В риторическом вопросе неопределённо-личная конструкция «где найти» естественно передаёт возможность обнаружения, не превращая форму в предсказание о будущем.
- source_word: וְאֵי זֶה מְקוֹם
  choice: и где место
  rationale: אֵי — вопросительное «где», а זֶה в данном обороте не требует отдельного буквального «это». Слово «место» сохранено, чтобы не устранять пространственный образ оригинала.
- source_word: בִּינָה
  choice: разумения
  rationale: «Разумение» передаёт способность понимать и различать, сохраняет связь с традиционной лексикой литературы мудрости и поэтический параллелизм с «мудростью».
