  yaml_path: translation/ot/job/028/021.yaml
  text: It is hidden from the eyes of every living thing[a], and concealed from the birds of the heavens.
translation:
  language: ru
  text: Она сокрыта от глаз всего живого и сокрыта от птиц небесных.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶעֶלְמָה
  choice: Она сокрыта
  rationale: Нифаль перфекта 3-го лица женского рода от עלם; местоимение «она» естественно отсылает к мудрости из ближайшего контекста. «Сокрыта» передаёт пассивно-результативный смысл и поддерживает возвышенный поэтический регистр.
- source_word: מֵעֵינֵי
  choice: от глаз
  rationale: Сохраняет конкретный древнееврейский образ מן + עיניים и звучит естественно по-русски.
- source_word: כָל חָי
  choice: всего живого
  rationale: Передаёт универсальный охват выражения и не ограничивает его людьми; субстантивированное «живое» уместно в поэтическом контексте.
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: и от птиц небесных
  rationale: עוֹף здесь естественно передаётся как «птицы», а «небесных» сохраняет образ שָׁמַיִם и традиционно-поэтическое звучание без архаической неясности.
- source_word: נִסְתָּרָה
  choice: утаена
  rationale: Нифаль перфекта 3-го лица женского рода от סתר. «Утаена» сохраняет параллелизм со «сокрыта», избегая механического повтора одного корня.
