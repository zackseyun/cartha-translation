  text: תְּה֣וֹם אָ֭מַר לֹ֣א בִ/י הִ֑יא וְ/יָ֥ם אָ֝מַ֗ר אֵ֣ין עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/028/014.yaml
  text: The deep says[a], ‘It is not in me,’ and the sea says, ‘It is not with me.’
translation:
  language: ru
  text: 'Бездна говорит: «Её нет во мне»,

    и море говорит: «Её нет со мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהוֹם
  choice: бездна
  rationale: Слово обозначает великую водную глубину. «Бездна» кратко и поэтично передаёт образ и образует естественный параллелизм с «морем».
- source_word: אָמַר
  choice: говорит
  rationale: Хотя в еврейском употреблена форма qatal, в поэтическом контексте она выражает живое, актуальное высказывание; настоящее время сохраняет олицетворение.
- source_word: לֹא בִי הִיא
  choice: Её нет во мне
  rationale: Местоимение женского рода отсылает к мудрости (חָכְמָה), также женского рода в русском языке. Такая передача сохраняет и грамматику, и олицетворение; «во мне» прямо соответствует בִי.
- source_word: יָם
  choice: море
  rationale: Обычное значение יָם; оно сохраняет древнееврейский образ и параллель с бездной.
- source_word: אֵין עִמָּדִי
  choice: Её нет со мной
  rationale: Оборот обозначает отсутствие рядом или во владении. «Её нет со мной» сохраняет пространственно-личный образ, не сводя его лишь к обладанию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного поэтического параллелизма. Женское местоимение естественно отсылает к «мудрости», поэтому пояснительная сноска не требуется.
