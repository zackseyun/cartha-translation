translation:
  language: ru
  text: 'Её камни образуют месторождение сапфира[a],

    и у неё есть золотая пыль.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, «лазурита»; какой именно драгоценный камень обозначало древнееврейское слово, точно неизвестно.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם
  choice: месторождение
  rationale: Буквально «место»; в контексте добычи полезных ископаемых русское «месторождение» естественно передаёт место залегания камня, не устраняя поэтический образ.
- source_word: סַפִּיר
  choice: сапфир
  rationale: Традиционное и понятное соответствие; точное название древнего минерала остаётся неясным, поэтому возможный лазурит указан в сноске.
- source_word: אֲבָנֶיהָ
  choice: камни её
  rationale: Сохранены множественное число и суффикс женского рода, отсылающий к земле в предыдущем стихе; такой порядок слов уместен в возвышенной русской поэзии.
- source_word: וְעַפְרֹת
  choice: и в прахе её
  rationale: Форма связана с прахом, пылью или рыхлой землёй. «Прах» сохраняет конкретный поэтический образ; местоимение «её» выражает подразумеваемую принадлежность земле.
- source_word: זָהָב
  choice: золото
  rationale: Прямое общеупотребительное соответствие названию драгоценного металла.
- source_word: לוֹ
  choice: в ... её
  rationale: Буквально «у неё/для неё»; в русском контексте содержания земли естественно передано местной конструкцией «в прахе её», без добавления глагола обладания.
