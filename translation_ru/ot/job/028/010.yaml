  text: He cuts channels through the rocks[b][a], and his eye sees every precious thing.
translation:
  language: ru
  text: В скалах он прорубает каналы[a], и глаз его видит всё драгоценное[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «водотоки» или «протоки»; еврейское слово обычно обозначает водные русла или каналы, но в данном горнорудном контексте, вероятно, имеются в виду каналы, прорубленные в скале.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё ценное»; в данном контексте также возможно: «всякую драгоценную руду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצּוּרוֹת
  choice: в скалах
  rationale: Множественное число от צוּר обозначает скалы или твёрдую каменную породу; сочетание с ב естественно передаётся местным «в скалах», не добавляя отсутствующего в тексте направления движения.
- source_word: יְאֹרִים
  choice: каналы
  rationale: יְאֹרִים обычно означает водотоки или каналы. В горнорудном контексте речь, вероятно, идёт о прорубленных в породе каналах, однако сноска сохраняет возможное значение «водотоки».
- source_word: בִּקֵּעַ
  choice: прорубает
  rationale: בקע значит «рассекать, раскалывать, прорезать». «Прорубает» естественно описывает тяжёлую работу в скале и хорошо сочетается с «каналы».
- source_word: יְקָר
  choice: всё драгоценное
  rationale: Субстантивированное יְקָר обозначает всё ценное или драгоценное, не ограничивая смысл рудой, металлами либо самоцветами.
- source_word: רָאֲתָה עֵינוֹ
  choice: глаз его видит
  rationale: Буквальный образ «его глаз увидел» сохранён, но в описательном поэтическом контексте употреблено настоящее время; постпозиция местоимения поддерживает достоинство библейской поэзии без архаизации.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого параллелизма и яркого образа «глаз его видит». Терминология не переуточняет устройство древних горных выработок и сохраняет лексическую широту оригинала.
