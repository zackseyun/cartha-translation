base_translation:
  language: en
  yaml_path: translation/ot/job/028/017.yaml
  text: Gold and glass cannot equal it[b][a], nor can its exchange be an article of fine gold.
translation:
  language: ru
  text: Не сравнятся с ней ни золото, ни стекло[a], и нельзя получить её в обмен на изделие из чистого золота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кристалл». Еврейское слово может обозначать ценный прозрачный материал; вероятнее всего, здесь имеется в виду стекло.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на сосуд из чистого золота». Еврейское слово может означать как сосуд, так и вообще изготовленный предмет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: не сравнятся с ней
  rationale: Глагол ערך здесь выражает сопоставление по ценности. Формулировка передаёт мысль, что золото и стекло не могут сравниться с мудростью; местоименный суффикс женского рода указывает на мудрость из контекста.
- source_word: זָהָב
  choice: золото
  rationale: Обычное и точное обозначение драгоценного металла.
- source_word: זְכוֹכִית
  choice: стекло
  rationale: Вероятнее всего, слово обозначает стекло — редкий и ценный прозрачный материал древности. Возможное значение «кристалл» сохранено в примечании.
- source_word: תְמוּרָתָהּ
  choice: не выменять её
  rationale: Существительное תְּמוּרָה связано с обменом или заменой. Русская глагольная конструкция естественно сохраняет торговый образ и мысль о невозможности получить мудрость в обмен на драгоценность.
- source_word: כְּלִי פָז
  choice: изделие из чистого золота
  rationale: כְּלִי может означать сосуд, предмет или изделие, поэтому общее «изделие» не сужает значение без необходимости. פָּז обозначает высококачественное, очищенное золото.
