  text: Действительно, у серебра есть месторождение[a], а у золота — место, где его очищают[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «источник», «место происхождения». Еврейское слово מוֹצָא само по себе не является специальным горным термином; перевод «месторождение» определяется контекстом добычи металлов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «где его выплавляют». Глагол может обозначать очищение или выплавку драгоценного металла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит и подчёркивает исходное утверждение рассуждения; «ведь» естественно передаёт эту вводно-обосновывающую силу, не превращая её в безусловно причинный союз.
- source_word: יֵשׁ
  choice: есть
  rationale: Обычная русская передача древнееврейской экзистенциальной частицы.
- source_word: לַכֶּסֶף מוֹצָא
  choice: у серебра есть месторождение
  rationale: מוֹצָא буквально обозначает источник или место происхождения, но в контексте добычи металлов конкретное «месторождение» ясно передаёт смысл; более широкое значение отмечено в сноске.
- source_word: וּמָקוֹם לַזָּהָב
  choice: и у золота — место
  rationale: 'Сохраняется параллелизм двух полустиший и отношение, выраженное предлогом ל: у серебра есть месторождение, у золота — место обработки.'
- source_word: יָזֹקּוּ
  choice: где его очищают
  rationale: Форма 3-го лица множественного числа допускает неопределённо-личную русскую конструкцию. «Очищают» доступно передаёт рафинирование металла, тогда как возможное техническое «выплавляют» сохранено в сноске.
