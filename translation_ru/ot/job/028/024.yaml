lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего утверждения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: הוּא
  choice: Он
  rationale: Местоимение в контексте относится к Богу; прописная буква соответствует принятому русскому благоговейному употреблению, не добавляя имени в текст.
- source_word: לִקְצוֹת הָאָרֶץ
  choice: до краёв земли
  rationale: Сочетание обозначает самые отдалённые пределы земли; «до краёв земли» сохраняет пространственный образ и направленность предлога לְ.
- source_word: יַבִּיט
  choice: взирает
  rationale: Порода хифиль глагола נבט выражает направленный взгляд; «взирает» сохраняет достоинство поэтической речи и отличается от обычного «видит» во второй строке.
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: всё, что под небесами
  rationale: Так по-русски естественно передаётся всеохватность выражения при сохранении пространственного образа «под небесами» и множественного числа.
- source_word: יִרְאֶה
  choice: видит
  rationale: Обычное значение ראה — «видеть»; выбор сохраняет параллелизм с направленным «взирает».
theological_decisions:
- issue: К кому относится местоимение הוּא
  choice: К Богу, Который обладает всеобъемлющим видением творения.
  alternative: Оставить референт местоимения без контекстуального определения.
  rationale: Непосредственный контекст Иов 28 однозначно говорит о Боге как о Том, Кто знает путь к мудрости и обозревает творение; имя при этом не вставлено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух полустиший сохранён; формулировка остаётся понятной без архаической лексики.
