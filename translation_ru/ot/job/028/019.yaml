  text: לֹֽא יַ֭עַרְכֶ/נָּה פִּטְדַת כּ֑וּשׁ בְּ/כֶ֥תֶם טָ֝ה֗וֹר לֹ֣א תְסֻלֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/028/019.yaml
  text: The topaz of Cush cannot equal it[a]; it cannot be valued in pure gold.
translation:
  language: ru
  text: Не сравнится с ней топаз из Куша[a], и чистым золотом её не оценить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хризолит из Куша»; возможно также: «перидот из Куша». Точное значение слова, обозначающего этот драгоценный камень, неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַרְכֶנָּה
  choice: не сравнится с ней
  rationale: Глагол ערך здесь выражает сопоставление по ценности. Формулировка естественна по-русски и сохраняет женский род местоимения, отсылающего к мудрости в контексте главы.
- source_word: פִּטְדַת כּוּשׁ
  choice: топаз из Куша
  rationale: Точное соответствие древнего названия драгоценного камня פִּטְדָה не установлено; «топаз» — традиционный и узнаваемый вариант, а неопределённость отражена в сноске. כּוּשׁ передано как имя собственное «Куш».
- source_word: בְּכֶתֶם טָהוֹר
  choice: чистым золотом
  rationale: כֶּתֶם обозначает драгоценное, очищенное золото, а טָהוֹר подчёркивает его чистоту. Предлог ב передан формой творительного падежа в естественной русской конструкции оценки.
- source_word: תְסֻלֶּה
  choice: не оценить
  rationale: В данном контексте глагол означает определить стоимость или цену. Безличная конструкция кратко и естественно передаёт невозможность оценить мудрость даже чистым золотом.
