  yaml_path: translation/ot/job/028/009.yaml
  text: He puts his hand to the flint[b][a]; he overturns mountains from their roots.
translation:
  language: ru
  text: 'Он простирает руку к кремню[a],

    выворачивает горы с корнем[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на кремень», «на кремнистую скалу». Еврейское выражение может описывать работу человека с твёрдой породой при добыче полезных ископаемых.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от корня гор». Единственное число «корень» имеет здесь собирательный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחַלָּמִישׁ
  choice: к кремню
  rationale: חַלָּמִישׁ обозначает кремень или вообще особо твёрдую скалу. Предлог ב в сочетании с образом протянутой руки допускает направленность действия на твёрдую породу; «к кремню» сохраняет этот образ, не уточняя сверх текста, идёт ли речь об ударе по поверхности или проникновении в породу.
- source_word: שָׁלַח יָדוֹ
  choice: простирает руку
  rationale: Буквально выражение передаёт протягивание или направление руки к объекту действия. «Простирает руку» сохраняет телесный образ и подходит к возвышенной поэзии, оставаясь понятным современному читателю.
- source_word: הָפַךְ
  choice: выворачивает
  rationale: Глагол הפך означает переворачивать, опрокидывать, выворачивать. В горнодобывающем контексте «выворачивает» естественно передаёт радикальное нарушение и перемещение горной породы.
- source_word: מִשֹּׁרֶשׁ
  choice: с корнем
  rationale: Единственное число שֹׁרֶשׁ сочетается с множественным הָרִים и создаёт образ гор, вывернутых от самого основания. Русское «с корнем» сохраняет метафору и её собирательный смысл.
- source_word: הָרִים
  choice: горы
  rationale: הָרִים прямо означает «горы»; отсутствие артикля в русском естественно передаёт обобщённый поэтический смысл.
