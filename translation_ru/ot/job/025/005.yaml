  text: הֵ֣ן עַד יָ֭רֵחַ וְ/לֹ֣א יַאֲהִ֑יל וְ֝/כוֹכָבִ֗ים לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/005.yaml
  text: Behold[a], even the moon does not shine[b], and the stars are not pure in his eyes.
translation:
  language: ru
  text: Вот, даже луна не сияет[a], и звёзды нечисты[b] в его глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не светла»; «не даёт света».'
    reason: Редкий глагол допускает близкие способы передачи светимости луны.
  - marker: b
    text: 'Или: «не чисты»; возможно: «не светлы».'
    reason: Глагольная форма от זכה может выражать чистоту, а в контексте небесных светил, возможно, также яркость.
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатическое привлечение внимания и сохраняет возвышенный поэтический тон без архаичного «се».
- source_word: עַד
  choice: даже
  rationale: 'Перед существительным имеет усилительное значение: речь идёт даже о луне, несмотря на её сияние.'
- source_word: יָרֵחַ
  choice: луна
  rationale: Прямое и естественное обозначение названного небесного светила.
- source_word: לֹא יַאֲהִיל
  choice: не сияет
  rationale: Передаёт редкую форму глагола в значении «давать свет, сиять»; вариант естественен по-русски и сохраняет небесную образность.
- source_word: וְכוֹכָבִים
  choice: и звёзды
  rationale: Прямо передаёт сочинительное продолжение ряда небесных светил.
- source_word: לֹא זַכּוּ
  choice: нечисты
  rationale: Сохраняет основное значение чистоты и допускает качественную либо нравственную оценку; возможный оттенок недостаточной яркости отмечен в сноске.
- source_word: בְעֵינָיו
  choice: в его глазах
  rationale: Близко передаёт еврейскую идиому оценки с чьей-либо точки зрения и естественно звучит в современном русском языке.
theological_decisions:
- issue: К кому относится местоименный суффикс 3-го лица мужского рода в בְעֵינָיו
  choice: «его» относится к Богу
  alternative: К неназванному наблюдателю в рамках поэтического рассуждения
  rationale: В контексте Иов 25:2–6 Вилдад говорит о Божьем величии и нечистоте творения перед Богом; поэтому ближайший смысл — Божья оценка. Строчная буква не добавляет отсутствующего в еврейском тексте типографского толкования.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным поэтическим строем. «Вот» предпочтено архаичному «се»; порядок слов сохраняет параллелизм двух полустиший. Местоимение «его» написано со строчной буквы, поскольку прописная буква не выражена исходным текстом.
