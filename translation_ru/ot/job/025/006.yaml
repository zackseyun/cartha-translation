  - marker: b
    text: 'Евр.: «сын человека»; здесь это поэтическое обозначение человека, а не мессианский титул.'
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: тем более
  rationale: 'В контексте выражение завершает восходящий аргумент Вилдада: если даже небесные светила нечисты перед Богом, то тем более немощный человек. Русское «тем более» естественно передаёт эту логическую связь.'
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Слово обозначает человека с оттенком слабости и смертности. «Человек» сохраняет собирательно-представительное единственное число, а оттенок поясняется в сноске.
- source_word: רִמָּה
  choice: личинка
  rationale: Существительное часто обозначает личинку, связанную с гниением. Такой перевод отличает его от последующего תּוֹלֵעָה и сохраняет два разных образа еврейского параллелизма.
- source_word: בֶן אָדָם
  choice: сын человеческий
  rationale: Буквально передаёт поэтическое еврейское выражение и сохраняет параллелизм. Здесь оно означает обычного человека, а не титул; это уточнено в сноске.
- source_word: תּוֹלֵעָה
  choice: червь
  rationale: Общее обозначение червя, естественно отличимое по-русски от более конкретного רִמָּה — «личинка».
theological_decisions:
- issue: Следует ли понимать «сын человеческий» как мессианский титул
  choice: Нетитульное поэтическое обозначение человека
  alternative: Мессианский титул
  rationale: В Иов 25:6 выражение בֶן אָדָם параллельно אֱנוֹשׁ и говорит о человеческой немощи; контекст не указывает на титульное или мессианское употребление.
translation_notes:
  register: Современный литературный русский язык с кратким, резким поэтическим параллелизмом. Тире воспроизводит безглагольные именные конструкции. «Личинка» и «червь» сохраняют лексическое различие исходного текста; строчная буква в «сын человеческий» подчёркивает нетитульное употребление.
