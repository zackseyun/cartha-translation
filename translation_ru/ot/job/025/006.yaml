  text: 'Тем более человек[a] — опарыш,

    и сын человеческий[b] — червь!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертный»; еврейское אֱנוֹשׁ нередко подчёркивает человеческую слабость и смертность.'
