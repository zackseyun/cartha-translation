  - marker: b
    text: 'Или: «на Его высотах»; вероятно, речь идёт о возвышенной небесной сфере.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֵׁל
  choice: Владычество
  rationale: Существительное от משל обозначает власть, господство или владычество. «Владычество» сохраняет отвлечённый и возвышенно-поэтический характер слова.
- source_word: וָפַחַד
  choice: и страх
  rationale: פחד может означать страх, трепет или ужас. «Страх» естественен в современном русском и не усиливает значение до «ужаса»; в контексте это внушаемый Божьим величием страх.
- source_word: עִמּוֹ
  choice: у Него
  rationale: Буквально предлог означает «с Ним», но в русском именная конструкция «у Него» естественно сохраняет возможное значение присутствия и принадлежности, не превращая его однозначно в притяжательное утверждение.
- source_word: עֹשֶׂה
  choice: Он творит
  rationale: Причастие от עשה здесь выражает характерное действие. «Творит» передаёт базовое значение «делает» и соответствует возвышенному поэтическому регистру, не добавляя более узкого смысла «устанавливает».
- source_word: שָׁלוֹם
  choice: мир
  rationale: שׁלום охватывает мир, благополучие и целостность. Здесь «мир» — наиболее прямой и естественный вариант в контексте небесного порядка.
- source_word: בִּמְרוֹמָיו
  choice: в Своих высотах
  rationale: מרום означает высоту или возвышенное место; форма множественного числа с суффиксом буквально передаётся как «в Его высотах». Возвратное «Своих» по-русски ясно соотносит местоимение с подлежащим и сохраняет поэтический образ, не сужая его до «небес».
theological_decisions:
- issue: Смысл начальной безглагольной фразы
  choice: Владычество и страх пребывают у Бога и характеризуют Его
  alternative: Владычество и страх принадлежат Ему
  rationale: Еврейское עִמּוֹ допускает как значение сопутствующего присутствия («с Ним»), так и подразумеваемую принадлежность. Формулировка «у Него» сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Сохранены краткость и параллелизм еврейского стиха; прописные местоимения выбраны как традиционная русская издательская норма для обозначения Бога.
