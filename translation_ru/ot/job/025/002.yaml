  text: Dominion and dread are with him[b][a]; he makes peace in his heights.
translation:
  language: ru
  text: Владычество и страх — у Него[a]; Он творит мир в Своих высях[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Владычество и страх принадлежат Ему».'
