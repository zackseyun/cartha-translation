  source_fidelity: Текст точно передаёт оба риторических вопроса еврейского оригинала. «Как же» адекватно выражает соединительно-риторическую силу וּמַה; «человеку» верно отражает обобщённое אֱנוֹשׁ. «Быть праведным перед Богом» естественно передаёт יִצְדַּק עִם־אֵל, при этом буквальный вариант предлога сохранён в сноске. «Рождённому женщиной» сохраняет образ и грамматическую зависимость יְלוּד אִשָּׁה, а «быть чистым» соответствует יִזְכֶּה, не сводя значение только к юридической невиновности.
