source:
  edition: WLC
  text: וּ/מַה יִּצְדַּ֣ק אֱנ֣וֹשׁ עִם אֵ֑ל וּ/מַה יִּ֝זְכֶּ֗ה יְל֣וּד אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/025/004.yaml
  text: So how can man be righteous before God? And how can one born of woman be pure?[a][b]
translation:
  language: ru
  text: Как же человеку быть праведным перед Богом?[a] И как рождённому женщиной быть чистым?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с Богом»; выражение может обозначать положение человека перед Ним.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «незапятнанным», «невиновным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה
  choice: Как же
  rationale: Сочетание союза с вопросительным מַה вводит риторический вопрос; «как же» естественно передаёт и связь с контекстом, и риторическую силу.
- source_word: יִצְדַּק
  choice: быть праведным
  rationale: Qal глагола צדק здесь означает быть правым или праведным по отношению к Богу; формулировка не сужает смысл до позднейшего специального понимания оправдания.
- source_word: אֱנוֹשׁ
  choice: человеку
  rationale: אֱנוֹשׁ обозначает человека с оттенком человеческой слабости и смертности; в русском «человеку» естественно сохраняет обобщённое единственное число.
- source_word: עִם אֵל
  choice: перед Богом
  rationale: Буквально «с Богом», однако в данном вопросе выражение касается положения человека по отношению к Богу; «перед Богом» естественно передаёт этот смысл, не устраняя возможного судебного оттенка.
- source_word: יִזְכֶּה
  choice: быть чистым
  rationale: Глагол זכה в Qal означает быть чистым, незапятнанным или невиновным; «чистым» сохраняет широкую семантику и параллелизм с «праведным».
- source_word: יְלוּד אִשָּׁה
  choice: рождённому женщиной
  rationale: Буквально «рождённый женщиной» — идиоматическое обозначение человека в его смертности и тварности; русский дательный согласован с конструкцией «как ... быть».
theological_decisions:
- issue: Обобщённое обозначение человечества
  choice: человеку ... рождённому женщиной
  alternative: смертному ... рождённому женщиной
  rationale: Еврейские выражения стоят в обобщённом единственном числе. «Человеку» ясно охватывает любого человека, а параллельная строка сохраняет исходный образ рождения от женщины.
- issue: Отношение человеческой праведности к Богу
  choice: перед Богом
  alternative: с Богом
  rationale: Предлог עִם буквально означает «с», но здесь, вероятно, описывает положение человека по отношению к Богу, возможно с судебным оттенком. Основной текст передаёт естественный русский смысл, а буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Риторический параллелизм двух строк сохранён; формулировки понятны без специальной богословской терминологии.
