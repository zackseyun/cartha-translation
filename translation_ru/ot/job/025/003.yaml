base_translation:
  language: en
  yaml_path: translation/ot/job/025/003.yaml
  text: Is there any number to his troops? And upon whom does his light not rise?[a][b][c]
translation:
  language: ru
  text: Есть ли счёт Его войскам?[a] И над кем не восходит Его свет?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его отрядам»; «Его полчищам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «И над кем не поднимается Его свет?»'
    reason: lexical_alternative
  - marker: c
    text: «Его свет» может означать всеобщий Божий свет, сияние или всеохватное действие; еврейский текст не уточняет образ.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ מִסְפָּר
  choice: Есть ли число
  rationale: Сохраняет экзистенциальный вопрос и образ неисчислимости, оставаясь естественным для возвышенной русской речи.
- source_word: לִגְדוּדָיו
  choice: Его воинствам
  rationale: גְּדוּד обозначает отряд, воинскую дружину или войско; множественное «воинствам» передаёт совокупность небесных сил и не сужает образ до одного рода подразделений.
- source_word: וְעַל־מִי
  choice: И над кем
  rationale: Передаёт пространственное значение עַל и естественно сочетается в русском с образом восходящего света.
- source_word: לֹא יָקוּם
  choice: не восходит
  rationale: קוּם значит «вставать, подниматься»; при подлежащем «свет» русский глагол «восходить» естественно сохраняет образ подъёма.
- source_word: אוֹרֵהוּ
  choice: Его свет
  rationale: Буквально передаёт אוֹר с местоименным суффиксом 3-го лица мужского рода, не уточняя, идёт ли речь о физическом свете, сиянии или более широком проявлении Божьего присутствия.
theological_decisions:
- issue: К кому относятся местоименные суффиксы в «Его воинствам» и «Его свет»
  choice: К Богу, о владычестве Которого говорит Вилдад
  alternative: Обобщённая отсылка к небесному властителю
  rationale: Контекст Иов 25:2 указывает на Бога как ближайшего смыслового референта. Местоимение сохранено, а имя Бога не подставлено в текст.
- issue: Смысл выражения «Его свет»
  choice: Широкий и намеренно неуточнённый образ Божьего света
  alternative: Солнечный свет; Божье сияние; Божье благоволение или всеохватное действие
  rationale: Еврейский текст не определяет образ точнее, поэтому перевод сохраняет его многозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем, подходящим для книги Иова. Заглавное «Его» ясно указывает на Бога в принятой русской издательской традиции, не заменяя местоимение толкованием.
