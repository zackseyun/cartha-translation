base_translation:
  language: en
  yaml_path: translation/ot/job/042/003.yaml
  text: ‘Who is this who hides counsel without knowledge?’ Therefore I have spoken, but I did not understand—things too wonderful for me[b][a], which I did not know.
translation:
  language: ru
  text: «Кто это такой, что скрывает замысел, не обладая знанием?»[a] Поэтому я говорил о том, чего не понимал, — о вещах, слишком дивных для меня[b], которых я не знал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно более традиционному переводу: «Кто это такой, что омрачает замысел, не обладая знанием?» В еврейском тексте слова Иова здесь отличаются от формулировки в Иов 38:2.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вещи, недоступные моему пониманию»; возможно также: «чудеса, превосходящие меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Кто это
  rationale: Сохраняет прямую вопросительную форму и естественно звучит по-русски.
- source_word: מַעְלִים
  choice: скрывает
  rationale: Передаёт каузативную форму корня עלם как сокрытие; не гармонизирует стих с отличающимся еврейским глаголом в Иов 38:2.
- source_word: עֵצָה
  choice: замысел
  rationale: В данном контексте обозначает мудрый замысел или намерение; современное русское «совет» могло бы быть понято лишь как рекомендация.
- source_word: בְּלִי דָעַת
  choice: не имея знания
  rationale: Близко передаёт отсутствие знания и сохраняет смысловую связь с последующим признанием Иова.
- source_word: לָכֵן
  choice: Поэтому
  rationale: Выражает вывод, который Иов делает из приведённого вопроса.
- source_word: הִגַּדְתִּי
  choice: я говорил
  rationale: В контексте это признание Иова относительно его прежних речей; формулировка сдержанна и естественна.
- source_word: וְלֹא אָבִין
  choice: но не понимал
  rationale: Передаёт контекстуальное противопоставление между речью Иова и отсутствием у него понимания.
- source_word: נִפְלָאוֹת
  choice: вещи, слишком дивные
  rationale: Сохраняет субстантивированное множественное число и идею необычайности, превосходящей человеческое постижение.
- source_word: מִמֶּנִּי
  choice: для меня
  rationale: В сочетании «слишком дивные для меня» естественно выражает то, что превосходило способность Иова постичь эти вещи.
- source_word: וְלֹא אֵדָע
  choice: которых я не знал
  rationale: Относительная конструкция естественно связывает заключительную фразу с упомянутыми вещами, не изменяя смысла.
theological_decisions:
- issue: Связь Иов 42:3 с Божьими словами в Иов 38:2
  choice: Перевести фактический глагол данного стиха как «скрывает замысел».
  alternative: «омрачает замысел, не имея знания»
  rationale: Иов цитирует или приспосабливает прежний вопрос Господа, однако в Иов 42:3 употреблён корень עלם, а не חשך, как в Иов 38:2. Перевод не должен устранять это лексическое различие.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи, но без избыточной архаизации. «Замысел» выбрано вместо потенциально двусмысленного современного «совет»; «дивные» сохраняет возвышенность נִפְלָאוֹת, а пояснение в сноске раскрывает смысл недоступности пониманию.
