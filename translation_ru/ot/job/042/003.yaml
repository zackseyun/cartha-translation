  source_fidelity: 'Основной смысл передан верно: מַעְלִים следует переводить как «скрывает», не гармонизируя его с «омрачает» в Иов 38:2; «замысел» удачно передаёт עֵצָה. Однако «Кто это скрывает...» синтаксически неестественно по-русски, а «не имея знания» звучит тяжеловесно. Во второй фразе нужно яснее связать признание Иова с тем, о чём он говорил, без изменения смысла.'
