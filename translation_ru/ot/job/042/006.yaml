  text: Поэтому я презираю себя[a] и раскаиваюсь в прахе и пепле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поэтому я отрекаюсь и сожалею о прахе и пепле». Еврейский текст здесь краток и допускает разные толкования: не названо, что именно Иов отвергает, а следующий глагол может означать «раскаиваться», «сожалеть», «отступаться» или «утешаться».'
