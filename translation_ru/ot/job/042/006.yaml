lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующих слов Бога и признания Иова в ст. 5, сохраняя причинно-следственную связь.
- source_word: אֶמְאַס
  choice: я отвергаю себя
  rationale: Глагол מאס означает «отвергать, презирать». Прямое дополнение в еврейском тексте не выражено; «себя» добавлено по ближайшему контексту, но неоднозначность отмечена в сноске.
- source_word: וְנִחַמְתִּי
  choice: и раскаиваюсь
  rationale: Порода нифаль глагола נחם допускает значения «раскаиваться, сожалеть, отступаться, утешаться». В контексте смирённого ответа Иова уместно «раскаиваюсь», тогда как другие возможные оттенки сохранены в сноске.
- source_word: עַל
  choice: в
  rationale: В основном чтении передаёт состояние или положение Иова в прахе и пепле естественным для русского языка оборотом; буквальное «о/относительно» связано с альтернативным толкованием всей фразы.
- source_word: עָפָר וָאֵפֶר
  choice: прахе и пепле
  rationale: Устойчивое библейское сочетание, выражающее смертность, унижение и скорбь; оно естественно и понятно в современном литературном русском.
theological_decisions:
- issue: 'Заключительный ответ Иова: самоуничижение и покаяние либо отказ от прежних слов или притязаний'
  choice: «я отвергаю себя и раскаиваюсь в прахе и пепле»
  alternative: «я отрекаюсь от сказанного и отступаюсь от слов о прахе и пепле»; также возможно «я отвергаю [свои слова]» без явного указания на себя
  rationale: 'Еврейская фраза предельно сжата: у אֶמְאַס не назван объект, а וְנִחַמְתִּי имеет широкий диапазон значений. Контекст встречи с Богом поддерживает покаянное прочтение, но не позволяет устранить альтернативу, поэтому она вынесена в сноску.'
translation_notes:
  register: Современный литературный русский с сохранением достоинства и лаконизма поэтической речи. Выражение «прах и пепел» сохранено как узнаваемый библейский оборот; подлинная смысловая неоднозначность отражена сноской.
