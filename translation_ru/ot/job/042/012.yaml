source:
  edition: WLC
  text: וַֽ/יהוָ֗ה בֵּרַ֛ךְ אֶת אַחֲרִ֥ית אִיּ֖וֹב מֵ/רֵאשִׁת֑/וֹ וַֽ/יְהִי ל֡/וֹ אַרְבָּעָה֩ עָשָׂ֨ר אֶ֜לֶף צֹ֗אן וְ/שֵׁ֤שֶׁת אֲלָפִים֙ גְּמַלִּ֔ים וְ/אֶֽלֶף צֶ֥מֶד בָּקָ֖ר וְ/אֶ֥לֶף אֲתוֹנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/012.yaml
  text: And Yahweh blessed the latter part of Job more than his beginning[a]. And he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen[b], and a thousand female donkeys.
translation:
  language: ru
  text: И Яхве благословил позднюю пору жизни Иова больше, чем раннюю[a]. И было у него четырнадцать тысяч голов мелкого скота[b], шесть тысяч верблюдов, тысяча пар волов[c] и тысяча ослиц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «последняя часть жизни Иова — больше, чем её начало».'
    reason: Передаёт образное противопоставление אַחֲרִית («последняя, поздняя часть») и רֵאשִׁית («начало»), которое в основном тексте выражено естественнее по-русски.
  - marker: b
    text: Еврейское слово обозначает мелкий скот — овец и коз.
    reason: Предотвращает неоправданное сужение собирательного צֹאן до одних овец.
  - marker: c
    text: 'Или: «тысяча упряжек волов».'
    reason: צֶמֶד может обозначать как пару животных, так и образованную этой парой рабочую упряжку.
lexical_decisions:
- source_word: וַיהוָה
  choice: И Яхве
  rationale: Передаёт собственное имя Бога, представленное тетраграмматоном יהוה, без замены титулом.
- source_word: בֵּרַךְ
  choice: благословил
  rationale: Сохраняет обычное богословски значимое значение корня ברך; последующий перечень показывает материальное выражение благословения.
- source_word: אַחֲרִית אִיּוֹב
  choice: последнюю пору жизни Иова
  rationale: Контекстуально обозначает поздний период жизни Иова; формулировка не сужает смысл до нескольких последних дней и звучит естественно по-русски.
- source_word: מֵרֵאשִׁתוֹ
  choice: больше, чем её начало
  rationale: Предлог מן выражает сравнение; местоимение «её» относится к жизни Иова и делает русскую фразу связной, сохраняя сопоставление поздней и начальной поры.
- source_word: וַיְהִי לוֹ
  choice: И было у него
  rationale: Близко передаёт еврейскую экзистенциально-посессивную конструкцию и при этом естественно звучит в русском библейском повествовании.
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף צֹאן
  choice: четырнадцать тысяч голов мелкого скота
  rationale: צֹאן — собирательное обозначение мелкого скота, то есть овец и коз; перевод не сужает значение только до овец.
- source_word: שֵׁשֶׁת אֲלָפִים גְּמַלִּים
  choice: шесть тысяч верблюдов
  rationale: Прямое и естественное соответствие числительного и существительного.
- source_word: אֶלֶף צֶמֶד בָּקָר
  choice: тысяча пар волов
  rationale: צֶמֶד обозначает пару, обычно запряжённую вместе; בָּקָר в сельскохозяйственном контексте указывает на крупный рабочий скот.
- source_word: אֶלֶף אֲתוֹנוֹת
  choice: тысяча ослиц
  rationale: Сохраняет выраженный в еврейском существительном женский пол животных и является краткой современной русской формой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Характер благословения поздней поры Иова
  choice: Сохранено прямое утверждение, что Яхве благословил её больше
  alternative: Истолковать благословение исключительно как материальное возмещение
  rationale: Текст связывает благословение с последующим имуществом, но не исчерпывает явно весь смысл благословения материальным достатком.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Начальное повторение «И» сохранено как характерная повествовательная связь еврейского текста. Единица счёта «голов» добавлена для естественной русской передачи собирательного «мелкий скот».
