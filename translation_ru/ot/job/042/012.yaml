revisions:
- from: И Яхве благословил последнюю пору жизни Иова больше, чем её начало[a]. И было у него четырнадцать тысяч голов мелкого скота[b], шесть тысяч верблюдов, тысяча пар волов[c] и тысяча ослиц.
  to: И Яхве благословил позднюю пору жизни Иова больше, чем раннюю[a]. И было у него четырнадцать тысяч голов мелкого скота[b], шесть тысяч верблюдов, тысяча пар волов[c] и тысяча ослиц.
  rationale: Исправлена только первая фраза и уточнена связанная с ней сноска. Новая формулировка сохраняет сравнение позднего периода жизни Иова с ранним, не утверждает, что имеются в виду исключительно последние дни, и устраняет двусмысленность местоимения «её». Перечень имущества и остальные примечания не требуют изменения.
