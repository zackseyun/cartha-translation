  text: וְ/עַתָּ֡ה קְחֽוּ לָ/כֶ֣ם שִׁבְעָֽה פָרִים֩ וְ/שִׁבְעָ֨ה אֵילִ֜ים וּ/לְכ֣וּ אֶל עַבְדִּ֣/י אִיּ֗וֹב וְ/הַעֲלִיתֶ֤ם עוֹלָה֙ בַּֽעַדְ/כֶ֔ם וְ/אִיּ֣וֹב עַבְדִּ֔/י יִתְפַּלֵּ֖ל עֲלֵי/כֶ֑ם כִּ֧י אִם פָּנָ֣י/ו אֶשָּׂ֗א לְ/בִלְתִּ֞י עֲשׂ֤וֹת עִמָּ/כֶם֙ נְבָלָ֔ה כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/008.yaml
  text: Take for yourselves seven bulls and seven rams[a], and go to my servant Job, and offer up a burnt offering for yourselves. And my servant Job will pray for you, for I will accept him, so that I may not deal with you disgracefully. For you have not spoken rightly about me[c][b], as my servant Job has.
translation:
  language: ru
  text: Итак, возьмите себе семь быков и семь баранов и пойдите к Моему слуге Иову. Принесите за себя всесожжение, а Мой слуга Иов помолится за вас, ибо Я приму его[a], чтобы Мне не поступить с вами позорно[b]. Ведь вы не говорили обо Мне верно[c], как Мой слуга Иов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо его лицо Я подниму». Это древнееврейское выражение означает благосклонно принять человека или оказать ему милость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы Мне не поступить с вами по вашему безрассудству». Слово נְבָלָה может обозначать безрассудство, постыдность или возмутительный поступок.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вы не говорили Мне верно». Древнееврейское выражение можно понять как речь, обращённую к Богу, или, по контексту, как речь о Боге.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Сочетание וְעַתָּה в WLC включает явное עַתָּה («теперь»), вопреки замечанию английского слоя. Здесь оно вводит следующий вывод и повеление; «итак» естественно передаёт переход в современном русском.
- source_word: קְחוּ לָכֶם
  choice: возьмите себе
  rationale: Повеление с дательным местоимением указывает на приобретение животных для предписанного им жертвоприношения.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: семь быков и семь баранов
  rationale: פָּר обозначает быка, а אַיִל — взрослого самца овцы; указание на молодость быков текстом не требуется.
- source_word: עַבְדִּי אִיּוֹב
  choice: Мой слуга Иов
  rationale: В данном обращении עֶבֶד является почётным обозначением верного служителя Бога, а не акцентом на рабском статусе.
- source_word: וְהַעֲלִיתֶם עוֹלָה
  choice: принесите всесожжение
  rationale: Это обычное древнееврейское культовое выражение для принесения жертвы, сжигаемой целиком.
- source_word: בַּעַדְכֶם
  choice: за себя
  rationale: Предлог выражает совершение жертвы ради них самих или от их имени; «за себя» кратко и естественно для русского библейского регистра.
- source_word: יִתְפַּלֵּל עֲלֵיכֶם
  choice: помолится за вас
  rationale: Форма глагола פלל и предлог здесь обозначают молитву в пользу других, то есть ходатайство.
- source_word: כִּי אִם פָּנָיו אֶשָּׂא
  choice: Я приму его ходатайство
  rationale: Буквально «только его лицо Я подниму» — идиома благосклонного принятия. Контекст связывает принятие Иова с его молитвой; дополнение «ходатайство» ясно передаёт это, а буквальная образность сохранена в примечании.
- source_word: לְבִלְתִּי עֲשׂוֹת עִמָּכֶם נְבָלָה
  choice: и не поступлю с вами по вашему безрассудству
  rationale: נְבָלָה может означать безрассудство, постыдность или возмутительный поступок. Такая передача выражает судебную соразмерность и не создаёт впечатления, будто Бог Сам совершит нравственно постыдное дело.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: вы говорили обо Мне не так верно
  rationale: אֵלַי формально означает «ко Мне», но в контексте речей о Боге может по смыслу передаваться «обо Мне». Неоднозначность отмечена в сноске.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: как Мой слуга Иов
  rationale: Русская сравнительная конструкция естественно восполняет эллипсис еврейского текста и сохраняет прямое сопоставление друзей с Иовом.
theological_decisions:
- issue: Принятие Иова и его посредническая молитва
  choice: Бог принимает ходатайство Иова, вследствие чего наказание друзей удерживается.
  alternative: Бог лишь выражает личное благоволение к Иову без особого акцента на действенности его молитвы.
  rationale: Последовательность повелений связывает жертву друзей, молитву Иова и Божье принятие его лица. Формулировка не вводит более поздних священнических или искупительных категорий.
- issue: Смысл נְבָלָה применительно к Божьему действию
  choice: Бог не поступит с друзьями по их безрассудству.
  alternative: Бог не сделает с ними постыдного или возмутительного дела.
  rationale: Существительное допускает оба оттенка. Основной текст передаёт судебный смысл без приписывания Богу нравственно постыдного поступка, а альтернативная конструкция указана в примечании.
- issue: Объект ошибочной речи друзей
  choice: Друзья говорили неверно о Боге.
  alternative: Друзья говорили неверно Богу.
  rationale: Предлог אֶל допускает прямое «ко Мне», однако содержание предшествующего спора поддерживает смысл «обо Мне». Подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской издательской практикой. «Всесожжение» сохранено как понятный устойчивый культовый термин. Синтаксис разделён на несколько фраз для ясности, без устранения смысловых напряжений оригинала.
