base_translation:
  language: en
  yaml_path: translation/ot/job/042/009.yaml
  text: So Eliphaz the Temanite[a], Bildad the Shuhite, and Zophar the Naamathite went and did as Yahweh had spoken to them, and Yahweh accepted Job.
translation:
  language: ru
  text: Елифаз из Темана, Вилдад из Шуаха и Софар из Наамы пошли и сделали, как сказал им Яхве. И Яхве благосклонно принял Иова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Яхве поднял лицо Иова» — еврейская идиома, означающая, что Яхве оказал Иову благоволение или принял его.'
    reason: Сноска сохраняет буквальный образ исходного текста и поясняет значение идиомы.
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: пошли
  rationale: Последовательная глагольная форма продолжает повествование и обозначает простое следующее действие; «пошли» естественно передаёт её в данном контексте.
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: феманитянин / шухитянин / нааматитянин
  rationale: Это обозначения происхождения или принадлежности к роду. Формы с дефисом при именах ясны современному читателю и сохраняют характер еврейских определений.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר
  choice: сделали так, как
  rationale: Передаёт широкое значение עשה и сравнительно-соотносительную конструкцию, не уточняя сверх текста, какие именно действия были совершены.
- source_word: דִּבֶּר אֲלֵיהֶם
  choice: сказал им
  rationale: Форма «сказал» естественно указывает на предшествующие слова Яхве и не превращает нейтральное דִּבֶּר в более узкое «повелел».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וַיִּשָּׂא יְהוָה אֶת־פְּנֵי אִיּוֹב
  choice: И Яхве благосклонно принял Иова
  rationale: Еврейская идиома «поднять лицо кого-либо» здесь означает оказать благоволение и принять человека. Наречие «благосклонно» сохраняет оттенок благоволения, а буквальный образ вынесен в сноску.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл благосклонного отношения Яхве к Иову
  choice: Яхве благосклонно принял Иова
  alternative: Яхве поднял лицо Иова
  rationale: Выбрана смысловая передача устойчивой еврейской идиомы. Она показывает благоприятное принятие Иова в контексте его ходатайства, но не добавляет утверждений о точном механизме принятия его друзей.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся близким к еврейской последовательности действий, а непрозрачная идиома передана естественно и пояснена в сноске.
