  yaml_path: translation/ot/job/042/005.yaml
  text: I had heard of you by the hearing of the ear[a], but now my eye has seen you.
translation:
  language: ru
  text: Прежде я слышал о Тебе по слухам[a], но теперь мой глаз увидел Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по слышанию уха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: лишь по слухам
  rationale: Еврейское выражение буквально означает «по слышанию уха» и указывает на знание, полученное через чужое сообщение. Русское «по слухам» естественно передаёт идиоматический смысл и сохраняет противопоставление косвенного знания непосредственному видению; «лишь» эксплицирует заложенный в контексте контраст.
- source_word: שְׁמַעְתִּיךָ
  choice: я слышал о Тебе
  rationale: Хотя форма буквально допускает «я слышал Тебя», в сочетании с לְשֵׁמַע אֹזֶן речь идёт о прежнем знании о Боге по сообщению. Русское «слышал о Тебе» точно и естественно передаёт этот смысл.
- source_word: וְעַתָּה
  choice: но теперь
  rationale: 'Союз в данном контексте имеет явную противопоставительную силу: прежнее косвенное знание сопоставляется с нынешним непосредственным видением.'
- source_word: עֵינִי
  choice: мой глаз
  rationale: Сохранено единственное число оригинала, поддерживающее поэтическую форму и личную непосредственность признания Иова.
- source_word: רָאָתְךָ
  choice: увидел Тебя
  rationale: Совершенный вид естественно передаёт завершённость события и его нынешний результат. Простая русская форма прошедшего времени звучит естественнее буквального «видел Тебя» и не ослабляет значение еврейского перфекта.
theological_decisions:
- issue: Характер «видения» Бога Иовом
  choice: увидел Тебя
  alternative: постиг Тебя; непосредственно встретился с Тобой
  rationale: Глагол «видеть» передан прямо, без уточнения, было ли это физическим зрением, духовным постижением или образом непосредственной встречи. Так сохраняются неоднозначность текста и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Местоимения, относящиеся к Богу, даны с прописной буквы согласно распространённой русской библейской традиции. Формулировка «по слухам» общеупотребительна; частица «лишь» подчёркивает контраст, не превращая его в доктринальное толкование.
