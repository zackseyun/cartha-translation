lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: И было у него
  rationale: 'Еврейская конструкция ויהי + ל с местоименным суффиксом выражает обладание: буквально «и было у него». В русском эта формулировка естественна, сохраняет повествовательную связь с предыдущим стихом и звучит уместно в библейском повествовании.'
- source_word: שִׁבְעָנָה
  choice: семь
  rationale: Точное соответствие количественному числительному.
- source_word: בָנִים
  choice: сыновей
  rationale: Еврейское слово прямо обозначает сыновей, поэтому родовое значение не нейтрализуется словом «дети».
- source_word: וְשָׁלֹשׁ
  choice: и три
  rationale: Союз и количественное числительное переданы прямо и естественно.
- source_word: בָּנוֹת
  choice: дочери
  rationale: Еврейское слово прямо обозначает дочерей; выбран стандартный современный литературный эквивалент.
