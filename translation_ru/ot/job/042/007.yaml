  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה אֶל אִיּ֑וֹב וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל אֱלִיפַ֣ז הַ/תֵּֽימָנִ֗י חָרָ֨ה אַפִּ֤/י בְ/ךָ֙ וּ/בִ/שְׁנֵ֣י רֵעֶ֔י/ךָ כִּ֠י לֹ֣א דִבַּרְתֶּ֥ם אֵלַ֛/י נְכוֹנָ֖ה כְּ/עַבְדִּ֥/י אִיּֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/042/007.yaml
  text: And it happened[a], after Yahweh had spoken these words to Job, that Yahweh said to Eliphaz the Temanite, “My anger burns against you and against your two friends, because you have not spoken rightly of me, as my servant Job has.”
translation:
  language: ru
  text: 'После того как Яхве сказал Иову эти слова, Яхве сказал Елифазу Феманитянину: «Мой гнев воспылал против тебя и против двух твоих друзей, потому что вы не говорили обо Мне верно, как Мой слуга Иов[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы не говорили Мне того, что верно, как Мой слуга Иов». Древнееврейский предлог буквально означает «ко Мне» или «Мне», но в данном контексте может указывать на речь о Боге.'
    reason: 'Сохраняет лексико-синтаксическую неоднозначность אֵלַי: буквальное «Мне/ко Мне» и контекстуальное «обо Мне».'
lexical_decisions:
- source_word: וַיְהִי אַחַר
  choice: После того как
  rationale: Естественно передаёт древнееврейский повествовательный переход и временную последовательность без неуклюжего буквализма «и было после».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: דִּבֶּר ... אֶת־הַדְּבָרִים הָאֵלֶּה אֶל אִיּוֹב
  choice: сказал Иову эти слова
  rationale: Сохраняет содержание דְּבָרִים как «слова» и ясно обозначает Иова адресатом речи.
- source_word: אֱלִיפַז הַתֵּימָנִי
  choice: Елифаз Феманитянин
  rationale: Использует укоренившиеся в русской библейской традиции формы имени и этнико-географического обозначения.
- source_word: חָרָה אַפִּי
  choice: Мой гнев пылает
  rationale: Сохраняет яркую древнееврейскую метафору разгоревшегося гнева и звучит естественно по-русски.
- source_word: בְךָ וּבִשְׁנֵי רֵעֶיךָ
  choice: на тебя и на двух твоих друзей
  rationale: Предлог передаёт направленность гнева; повтор «на» делает синтаксическую связь прозрачной.
- source_word: לֹא דִבַּרְתֶּם אֵלַי נְכוֹנָה
  choice: вы говорили обо Мне не так верно
  rationale: Контекстуально понимает אֵלַי как указание на предмет речи, но не сужает נְכוֹנָה до одной лишь фактической точности; сравнительная конструкция естественно подводит к сопоставлению с Иовом.
- source_word: כְּעַבְדִּי אִיּוֹב
  choice: как Мой слуга Иов
  rationale: Сохраняет прямое сравнение и значимое Божье наименование Иова «Мой слуга».
theological_decisions:
- issue: Означает ли אֵלַי «обо Мне» или буквально «Мне»
  choice: обо Мне
  alternative: Мне
  rationale: В контексте Бог оценивает содержание речей друзей о Нём. Однако буквальный смысл предлога допускает понимание речи, обращённой непосредственно к Богу, поэтому оно отмечено в сноске.
- issue: Смысл נְכוֹנָה в оценке речей
  choice: верно
  alternative: правильно; то, что верно
  rationale: «Верно» сохраняет диапазон смысла — истинно, надлежащим образом, основательно — и не сводит Божью оценку только к фактической точности или нравственной искренности.
- issue: Сила сравнения с Иовом
  choice: не так верно, как Мой слуга Иов
  alternative: не сказали Мне того, что верно, как Мой слуга Иов
  rationale: Основной текст отражает контекстуальное понимание речи о Боге, не объясняя, в каком именно отношении вся речь Иова признана верной; тем самым сохраняется напряжение книги.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок слов упрощён ради естественности; образ пылающего гнева и повтор имени Яхве сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с русской религиозно-издательской нормой.
