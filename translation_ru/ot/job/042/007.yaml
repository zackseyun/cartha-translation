  to: 'После того как Яхве сказал Иову эти слова, Яхве сказал Елифазу Феманитянину: «Мой гнев воспылал против тебя и против двух твоих друзей, потому что вы не говорили обо Мне верно, как Мой слуга Иов[a]».'
