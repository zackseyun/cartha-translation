  yaml_path: translation/ot/job/042/015.yaml
  text: And nowhere in all the land were women found as beautiful as Job’s daughters[a], and their father gave them an inheritance among their brothers.
translation:
  language: ru
  text: И не нашлось во всей стране женщин столь же красивых, как дочери Иова[a]. И отец дал им наследство среди их братьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на всей земле».'
    reason: 'Лексическая неоднозначность הָאָרֶץ: слово может означать определённую страну или край, а также землю в более широком смысле.'
lexical_decisions:
- source_word: נִמְצָא
  choice: не нашлось
  rationale: Естественная русская безличная конструкция точно передаёт значение существования/обнаружения; единственное число сказуемого также соответствует форме еврейского глагола.
- source_word: נָשִׁים יָפוֹת
  choice: женщин столь же красивых
  rationale: נָשִׁים означает «женщины», а не обязательно «жёны»; сравнительная конструкция естественно передаётся как «столь же красивых».
- source_word: כִּבְנוֹת אִיּוֹב
  choice: как дочери Иова
  rationale: Префикс כְּ выражает прямое сравнение.
- source_word: בְּכָל הָאָרֶץ
  choice: во всей земле
  rationale: В повествовательном контексте הָאָרֶץ естественно понимать как «земля, страна»; неоднозначность между локальным и более широким значением отмечена в сноске.
- source_word: וַיִּתֵּן לָהֶם
  choice: дал им
  rationale: Прямой и естественный перевод глагола נתן с местоименным косвенным дополнением.
- source_word: נַחֲלָה
  choice: наследство
  rationale: Слово обозначает наследство или наследственное владение; «наследство» ясно и ёмко передаёт смысл.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: среди их братьев
  rationale: Сохранено буквальное указание на братьев и примечательная деталь о получении дочерьми наследства среди мужских наследников.
theological_decisions:
- issue: Родовое обозначение родственников
  choice: среди их братьев
  alternative: среди их братьев и сестёр / среди родных
  rationale: Еврейский текст прямо употребляет форму мужского рода «братья»; её не следует нейтрализовать.
- issue: Объём значения הָאָרֶץ
  choice: во всей земле
  alternative: по всей земле / на всей земле
  rationale: «Земля» сохраняет диапазон значения от страны или края до земли в более широком смысле, не навязывая современного представления о глобальном обследовании.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Конструкция «не нашлось» звучит естественно, а два предложения сохраняют ясность и лёгкий повествовательный ритм оригинала.
