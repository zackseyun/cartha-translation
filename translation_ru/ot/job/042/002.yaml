lexical_decisions:
- source_word: ידעת
  choice: Я знаю
  rationale: Форма Qal perfect 2-го лица мужского рода обращена к Богу; по контексту Иов выражает нынешнее признание, поэтому настоящее время естественно передаёт состояние знания.
- source_word: כִּי
  choice: что
  rationale: Вводит содержание признания после «я знаю».
- source_word: כֹל תּוּכָל
  choice: Ты всё можешь
  rationale: Передаёт всеобъемлющую способность Бога естественной современной русской конструкцией без добавления конкретного действия.
- source_word: וְלֹא יִבָּצֵר
  choice: и никакой… не может быть остановлен
  rationale: Нифаль глагола בצר с מן здесь указывает на невозможность воспрепятствовать осуществлению Божьего замысла.
- source_word: מִמְּךָ
  choice: Твой
  rationale: В данном сочетании русская притяжательная форма естественно выражает принадлежность замысла Богу, не воспроизводя буквально неидиоматичное «от Тебя».
- source_word: מְזִמָּה
  choice: замысел
  rationale: Слово обозначает намерение, план или замысел; «замысел» сохраняет смысловую широту и в этом контексте не несёт обязательной отрицательной окраски.
theological_decisions:
- issue: Утверждение о Божьей силе и неодолимости Его намерения
  choice: Ты всё можешь и никакой Твой замысел не может быть остановлен
  alternative: Ты всё можешь, и ничто из задуманного Тобой не может быть предотвращено
  rationale: Перевод утверждает безграничную способность Бога и невозможность воспрепятствовать Его намерению, не добавляя систематических богословских выводов сверх текста.
