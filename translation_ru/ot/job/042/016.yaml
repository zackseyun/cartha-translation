  yaml_path: translation/ot/job/042/016.yaml
  text: After this[a], Job lived one hundred and forty years, and saw his sons and his grandsons, four generations.
translation:
  language: ru
  text: После этого Иов прожил ещё сто сорок лет и увидел своих сыновей и сыновей своих сыновей — четыре поколения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более свободно: «и увидел своих сыновей и потомков до четвёртого поколения». Буквально в еврейском тексте: «своих сыновей и сыновей своих сыновей — четыре поколения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי אִיּוֹב אַחֲרֵי זֹאת
  choice: После этого Иов прожил ещё
  rationale: Глагол חיה обозначает дальнейшую жизнь Иова после описанных событий. «Прожил ещё» естественно передаёт эту временную последовательность, не подразумевая, что речь идёт о полном возрасте Иова.
- source_word: מֵאָה וְאַרְבָּעִים שָׁנָה
  choice: сто сорок лет
  rationale: Прямое и естественное воспроизведение числового выражения.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Сохранено прямое значение глагола ראה; более разъяснительное «дожил до того, что увидел» не вводится в основной текст.
- source_word: בָּנָיו
  choice: своих сыновей
  rationale: Еврейский текст употребляет мужское множественное число «сыновья», поэтому оно сохранено, а не заменено более общим «дети».
- source_word: בְּנֵי בָנָיו
  choice: сыновей своих сыновей
  rationale: Буквальная конструкция «сыновья его сыновей» сохраняет форму и мужскую специфику исходного текста; идиоматическое «внуков» возможно, но несколько сглаживает выражение.
- source_word: אַרְבָּעָה דֹּרוֹת
  choice: четыре поколения
  rationale: Сохранена форма исходного текста без превращения её в более толковательное «до четвёртого поколения».
theological_decisions:
- issue: К каким потомкам относится выражение «четыре поколения»
  choice: 'Сохранено как присоединённое пояснение: «— четыре поколения»'
  alternative: «до четвёртого поколения» или «потомков в четырёх поколениях»
  rationale: Еврейский текст краток и допускает вопрос о точном соотношении названных сыновей, сыновей сыновей и четырёх поколений. Основной текст не устраняет эту неоднозначность посредством расширительного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Конструкция «прожил ещё» ясна обычному читателю, а более буквальное «сыновей своих сыновей» намеренно сохраняет структуру и возможную неоднозначность еврейского текста.
