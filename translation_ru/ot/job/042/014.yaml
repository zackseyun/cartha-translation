lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם
  choice: он назвал
  rationale: Еврейская конструкция буквально означает «нарёк имя», но в современном русском естественно передаётся глаголом «назвал».
- source_word: הָאַחַת ... הַשֵּׁנִית ... הַשְּׁלִישִׁית
  choice: первую ... вторую ... третью
  rationale: В последовательном перечислении дочерей порядковые числительные точно и естественно передают еврейские формы.
- source_word: יְמִימָה
  choice: Иемима
  rationale: Личное имя передано транслитерацией с учётом укоренившейся русской библейской формы.
- source_word: קְצִיעָה
  choice: Кеция
  rationale: Личное имя передано транслитерацией с учётом укоренившейся русской библейской формы.
- source_word: קֶרֶן הַפּוּךְ
  choice: Керен-Гаппух
  rationale: Составное личное имя транслитерировано, а дефис сохраняет заметную составную структуру еврейского имени; его вероятное значение вынесено в примечание.
