  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֵ֠לָי/ו כָּל אֶחָ֨י/ו וְ/כָל אחיתי/ו וְ/כָל יֹדְעָ֣י/ו לְ/פָנִ֗ים וַ/יֹּאכְל֨וּ עִמּ֣/וֹ לֶחֶם֮ בְּ/בֵית/וֹ֒ וַ/יָּנֻ֤דוּ ל/וֹ֙ וַ/יְנַחֲמ֣וּ אֹת֔/וֹ עַ֚ל כָּל הָ֣/רָעָ֔ה אֲשֶׁר הֵבִ֥יא יְהוָ֖ה עָלָ֑י/ו וַ/יִּתְּנוּ ל֗/וֹ אִ֚ישׁ קְשִׂיטָ֣ה אֶחָ֔ת וְ/אִ֕ישׁ נֶ֥זֶם זָהָ֖ב אֶחָֽד־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/042/011.yaml
  text: Then all his brothers[a], all his sisters, and all who had known him before came to him, and they ate bread with him in his house. They showed him sympathy and comforted him for all the calamity that Yahweh had brought upon him[d][c][b]. And each one gave him one qesitah and one gold ring.
translation:
  language: ru
  text: Тогда пришли к нему все его братья, все сёстры и все, кто знал его прежде. Они разделили с ним трапезу в его доме, выразили ему сочувствие и утешили его из-за всех бедствий, которые Яхве навёл на него. Каждый дал ему по одной кесите[a] и по одному золотому кольцу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кесита — древняя единица или предмет ценности; её точный эквивалент неизвестен.
    reason: cultural_note
  - marker: b
    text: Еврейское слово может обозначать кольцо, которое носили в носу или в ухе.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֵלָיו
  choice: пришли к нему
  rationale: Прямо передаёт повествовательную форму глагола בוא и направление движения.
- source_word: כָּל אֶחָיו וְכָל אֲחִיתָיו
  choice: все его братья, все сёстры
  rationale: Сохраняет раздельное упоминание братьев и сестёр и повтор כָּל, не перегружая русскую фразу местоимениями.
- source_word: וְכָל יֹדְעָיו לְפָנִים
  choice: и все, кто знал его прежде
  rationale: Передаёт как круг людей, прежде знавших Иова, так и временное значение לְפָנִים; формулировка не сужает их до близких друзей.
- source_word: וַיֹּאכְלוּ עִמּוֹ לֶחֶם
  choice: они разделили с ним трапезу
  rationale: Естественно передаёт идиому «ели с ним хлеб» как совместную трапезу, сохраняя оттенок общения и восстановления отношений.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: Буквальный и естественный эквивалент בית в данном контексте.
- source_word: וַיָּנֻדוּ לוֹ
  choice: выразили ему сочувствие
  rationale: В этом контексте נוד обозначает жест или выражение соболезнования и участия, а не насмешливое покачивание головой.
- source_word: וַיְנַחֲמוּ אֹתוֹ
  choice: утешили его
  rationale: Обычное контекстуальное значение נחם при утешении страдающего.
- source_word: עַל כָּל הָרָעָה
  choice: из-за всех бедствий
  rationale: רָעָה здесь означает пережитое несчастье или бедствие, а не нравственное зло; предлог сохраняет связь сочувствия и утешения с постигшими Иова бедами.
- source_word: אֲשֶׁר הֵבִיא יְהוָה עָלָיו
  choice: которые Яхве навёл на него
  rationale: Сохраняет явное приписывание действия Яхве в еврейском тексте и естественно передаёт конструкцию הביא על.
- source_word: קְשִׂיטָה
  choice: кесита
  rationale: Точный современный эквивалент древней единицы или предмета ценности неизвестен, поэтому сохранена транслитерация с пояснением.
- source_word: נֶזֶם זָהָב
  choice: золотое кольцо
  rationale: Нейтрально передаёт предмет украшения, не устраняя неопределённость относительно того, носили его в носу или в ухе.
theological_decisions:
- issue: Причастность Яхве к бедствиям Иова
  choice: которые Яхве навёл на него
  alternative: которые Яхве допустил в его жизни
  rationale: Глагольная конструкция прямо говорит, что Яхве навёл бедствия на Иова. Перевод сохраняет богословское напряжение повествования и не заменяет выраженное действие лишь дозволением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Идиома о вкушении хлеба передана естественным выражением «разделили трапезу», тогда как редкий культурный термин «кесита» сохранён и пояснён. Имя יהוה передано как «Яхве».
