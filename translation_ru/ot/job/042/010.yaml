  text: And Yahweh restored Job’s fortunes when he prayed for his friends[c][b][a], and Yahweh gave Job twice as much as he had before.
translation:
  language: ru
  text: Яхве восстановил благополучие Иова, когда Иов помолился за своих друзей[a], и Яхве дал Иову вдвое больше, чем у него было прежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за своего друга». Еврейское слово стоит в единственном числе, но в данном контексте, вероятно, употреблено собирательно и обозначает друзей Иова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, принятой современной русской транслитерацией.
- source_word: שָׁב אֶת שבית אִיּוֹב
  choice: вернул Иову благополучие
  rationale: Еврейская идиома обозначает восстановление прежнего благополучного положения; контекст не требует понимать её как освобождение из буквального плена.
- source_word: בְּהִתְפַּלְלוֹ
  choice: когда тот помолился
  rationale: Предлог ב при инфинитиве выражает временную или сопутствующую связь. Такое чтение естественно по-русски и не усиливает её до прямой причинности.
- source_word: בְּעַד רֵעֵהוּ
  choice: за своих друзей
  rationale: בְּעַד выражает ходатайство за кого-либо, а רֵעֵהוּ в данном контексте имеет собирательное значение и относится к друзьям Иова.
- source_word: וַיֹּסֶף יְהוָה אֶת כָּל אֲשֶׁר לְאִיּוֹב לְמִשְׁנֶה
  choice: и дал Яхве Иову вдвое больше того, что было у него прежде
  rationale: Передаёт итоговое удвоение всего прежнего достояния Иова ясным современным русским языком, не воспроизводя неестественно буквальную конструкцию «добавил… вдвойне».
theological_decisions:
- issue: Связь молитвы Иова с восстановлением его благополучия
  choice: «когда тот помолился» — временная связь
  alternative: «потому что он помолился» — причинная связь
  rationale: Конструкция ב + инфинитив связывает восстановление с ходатайственной молитвой Иова, но сама по себе не требует механистического причинного истолкования.
- issue: Значение восстановления Иова
  choice: восстановление благополучия
  alternative: освобождение из буквального плена
  rationale: В контексте книги речь идёт об изменении тяжёлого положения Иова и возвращении его благосостояния, а не о физическом пленении.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Инверсия «дал Яхве» сохраняет торжественность и повтор имени из исходного текста, не затрудняя понимания.
