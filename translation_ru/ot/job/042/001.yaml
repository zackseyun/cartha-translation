base_translation:
  language: en
  yaml_path: translation/ot/job/042/001.yaml
  text: Then Job answered Yahweh and said:[a]
translation:
  language: ru
  text: Тогда Иов ответил Яхве и сказал:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «YHWH»; традиционно переводится как «Господь». Другие варианты передачи: «Яхве» и «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Глагол ענה в повествовательной формуле означает «ответить, откликнуться». «Ответил» сохраняет диалогическую структуру книги, хотя непосредственно перед этим вопрос не задан.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Устоявшаяся русская форма еврейского личного имени אִיּוֹב.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель определённого прямого дополнения в еврейском языке; отдельного соответствия в русском не требует.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Прозрачно передаёт обычную еврейскую формулу продолжения повествования.
- source_word: וַ
  choice: Тогда
  rationale: Начальный последовательный союз продвигает повествование; «Тогда» естественно передаёт временную последовательность в современном русском.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон. Форма «Яхве» сохраняет личное имя; в примечании указаны традиционный русский эквивалент и другая известная передача.
translation_notes:
  register: Современный литературный русский с сохранением краткой повествовательной формулы оригинала. Двоеточие вводит следующую прямую речь; маркер примечания поставлен после двоеточия по предоставленному формату.
