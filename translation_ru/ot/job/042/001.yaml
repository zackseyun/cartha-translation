  source_fidelity: Точно переданы оба повествовательных глагола («ответил» и «сказал»), имя Иов и прямое дополнение с тетраграмматоном. «Тогда» допустимо передаёт начальный waw как последовательное продвижение повествования. Двоеточие уместно, поскольку далее начинается речь Иова.
