base_translation:
  language: en
  yaml_path: translation/ot/job/021/004.yaml
  text: As for me, is my complaint against man? If not, why should my spirit not be impatient?
translation:
  language: ru
  text: Разве человеку обращена моя жалоба? А если нет[a], то почему мне не быть нетерпеливым?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское условное выражение эллиптично. Его можно понимать как «если нет [то есть если моя жалоба обращена не к человеку]»; возможно и иное связывание со сказанным в предыдущем вопросе.
    reason: Сохраняет неоднозначность וְאִם, тогда как основной текст следует допустимому пониманию, отражённому в английском POB.
lexical_decisions:
- source_word: שִׂיחִי
  choice: моя жалоба
  rationale: В данном споре слово обозначает горестную речь или жалобу Иова; этот вариант естественен по-русски и соответствует контексту.
- source_word: לְאָדָם
  choice: человеку
  rationale: 'Предлог לְ передаёт направленность речи: жалоба обращена к человеку. Единственное число сохранено как обобщённое.'
- source_word: תִקְצַר רוּחִי
  choice: мне не терять терпения
  rationale: Буквально речь идёт о том, что дух становится короток; русская идиома «терять терпение» точно передаёт состояние нетерпения и сохраняет риторическую силу вопроса.
- source_word: וְאִם מַדּוּעַ לֹא
  choice: А если нет, то почему бы ... не
  rationale: Сочетание допускает эллиптическое понимание «а если [не человеку], то почему не…»; эксплицированное «нет» делает ход мысли ясным, не устраняя исходную условность.
theological_decisions:
- issue: Адресат жалобы Иова
  choice: «Разве человеку обращена моя жалоба?»
  alternative: «Разве моя жалоба — на человека?»
  rationale: Форма с לְ скорее указывает на того, к кому обращена речь, чем однозначно на объект обвинения. Перевод сохраняет различие между человеческими собеседниками и высшим адресатом жалобы, не называя его прямо.
- issue: Эллипсис условной фразы וְאִם
  choice: «А если нет»
  alternative: «И почему же»
  rationale: 'Сохранена условная конструкция еврейского текста и его смысловое напряжение: если жалоба обращена не к человеку, нет оснований удивляться нетерпению Иова.'
translation_notes:
  register: Современный литературный русский язык; риторические вопросы звучат естественно и достойно. Перевод сохраняет краткость, условный переход и неоднозначность относительно неназванного адресата жалобы.
