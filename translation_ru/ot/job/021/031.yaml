  text: מִֽי יַגִּ֣יד עַל פָּנָ֣י/ו דַּרְכּ֑/וֹ וְ/הֽוּא עָ֝שָׂ֗ה מִ֣י יְשַׁלֶּם לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/031.yaml
  text: Who declares his way to his face? And for what he has done[b][a], who repays him?
translation:
  language: ru
  text: Кто скажет ему в лицо[a], каков его путь? А за то, что он сделал[b], кто ему воздаст?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед ним»; буквально: «на его лице» — идиома, означающая непосредственное, открытое обращение к человеку.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст предельно краток: «и он сделал — кто воздаст ему?» В переводе явно выражен вероятный смысл: «за то, что он сделал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: кто
  rationale: Сохранена форма риторического вопроса; подразумеваемое отрицание («никто») не выражено прямо, как и в еврейском тексте.
- source_word: יַגִּיד
  choice: скажет
  rationale: Форма глагола נגד означает «сообщить, объявить, сказать». В данном контексте нейтральное «скажет» естественно передаёт прямое обращение, не добавляя отсутствующего в тексте явного значения «обличит».
- source_word: עַל־פָּנָיו
  choice: ему в лицо
  rationale: Буквально «на/перед его лицом»; это идиома непосредственного и открытого противостояния в присутствии человека.
- source_word: דַּרְכּוֹ
  choice: каков его путь
  rationale: דֶּרֶךְ — буквально «путь», а переносно образ жизни или поведение. Такая формулировка сохраняет исходный образ и при этом звучит по-русски естественнее, чем «скажет о его пути».
- source_word: וְהוּא עָשָׂה
  choice: за то, что он сделал
  rationale: 'Еврейская фраза предельно кратка: буквально «и он сделал». Контекст второго вопроса позволяет выразить подразумеваемое основание воздаяния, не уточняя, что именно было сделано.'
- source_word: יְשַׁלֶּם לוֹ
  choice: ему воздаст
  rationale: Piel глагола שלם здесь означает отплатить или воздать. «Воздаст» сохраняет судебно-ретрибутивный оттенок и соответствует возвышенному, но понятному регистру.
