lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Повернитесь ко мне
  rationale: Императив множественного числа от פנה с אֶל выражает направленность к говорящему. «Повернитесь ко мне» сохраняет образ физического или внимательного обращения и звучит естественно по-русски.
- source_word: וְהָשַׁמּוּ
  choice: и ужаснитесь
  rationale: Форма от שׁמם обозначает потрясённую, ошеломлённую реакцию, нередко с оттенком ужаса. «Ужаснитесь» передаёт здесь сильную эмоциональную реакцию, не сводя её лишь к удивлению.
- source_word: וְשִׂימוּ יָד עַל־פֶּה
  choice: прикройте рукой рот
  rationale: 'Буквально: «положите руку на рот». Русское «прикройте рукой рот» естественно передаёт жест молчания и потрясённого сдерживания; подразумеваемая принадлежность руки и рта адресатам ясна из императива множественного числа.'
