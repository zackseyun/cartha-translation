  yaml_path: translation/ot/job/021/003.yaml
  text: Bear with me[a], and I will speak; and after I have spoken[b], you may mock.
translation:
  language: ru
  text: Потерпите меня[a], и я скажу; а после того, как я скажу[b], можешь насмехаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Стерпите меня», то есть терпеливо выслушайте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а после того, как я скажу, будешь насмехаться». Еврейскую форму можно понять и как простое будущее, и как уступительное разрешение: «можешь насмехаться».'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: Потерпите меня
  rationale: Глагол נָשָׂא буквально означает «нести», но здесь в сочетании с местоименным суффиксом и в контексте просьбы дать слово передаёт смысл «терпеливо выслушать, снести». Русское «потерпите меня» сохраняет образ и естественно выражает просьбу о терпении.
- source_word: וְאָנֹכִי אֲדַבֵּר
  choice: и я выскажусь
  rationale: Эмфатическое אָנֹכִי передано явным «я», а אֲדַבֵּר — глаголом «выскажусь», который в данном контексте естественно обозначает возможность изложить свою речь до конца.
- source_word: וְאַחַר דַּבְּרִי
  choice: а после того, как я выскажусь
  rationale: Инфинитивная конструкция буквально означает «после моего говорения». Придаточное времени передаёт её по-русски естественно, не превращая действие в содержание речи.
- source_word: תַלְעִיג
  choice: можешь насмехаться
  rationale: Форма морфологически единственного числа и означает «насмехаться, глумиться». «Можешь» передаёт уместный в контексте разрешительно-уступительный оттенок, но неоднозначность формы отмечена в сноске.
theological_decisions:
- issue: Модальность תַלְעִיג
  choice: можешь насмехаться
  alternative: будешь насмехаться / насмехайся
  rationale: Еврейская форма сама по себе может читаться как простое будущее, а по контексту — как уступительное разрешение. Основной текст выбирает естественное для хода речи разрешительное прочтение, не скрывая альтернативу.
translation_notes:
  register: 'Современный литературный русский язык с достоинством поэтической речи. Смена множественного «потерпите» на единственное «можешь» сохранена по еврейской морфологии: сначала Иов обращается к собеседникам, затем — к одному оппоненту или к каждому из них в отдельности.'
