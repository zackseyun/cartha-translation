  source_fidelity: Первая часть передаёт риторическое пренебрежение, но «Кто такой Всемогущий» заменяет еврейское מַה («что») вопросом о личности («кто»). Более близкая и естественная русская формула «Что нам Всемогущий» сохраняет исходную конструкцию и её вызывающе-утилитарный смысл. Во второй части «умолять Его» точно передаёт נִפְגַּע בּוֹ — настойчиво обращаться с просьбой к Богу.
