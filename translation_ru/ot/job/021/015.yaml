base_translation:
  language: en
  yaml_path: translation/ot/job/021/015.yaml
  text: What is the Almighty[a], that we should serve him? And what would we gain if we entreat him?
translation:
  language: ru
  text: Что нам Всемогущий, чтобы мы служили Ему? И что нам за польза, если мы будем умолять Его?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שַׁדַּי
  choice: Кто такой Всемогущий
  rationale: Вопросительное מַה буквально означает «что», однако при личном божественном титуле естественное русское «кто такой» передаёт пренебрежительный вопрос о значимости и авторитете Бога, не превращая его в вопрос о сущности.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Традиционный и понятный перевод божественного титула שַׁדַּי; перевод титула здесь предпочтительнее транслитерации «Шаддай».
- source_word: כִּי נַעַבְדֶנּוּ
  choice: чтобы нам служить Ему
  rationale: В первой строке כִּי вводит основание или следствие риторического вопроса, а עבד обозначает служение Богу в широком смысле, не только богослужение.
- source_word: וּמַה נּוֹעִיל
  choice: И какая нам польза
  rationale: Форма от יעל выражает пользу или выгоду. Именная русская конструкция естественно передаёт утилитарный оттенок речи нечестивых.
- source_word: כִּי נִפְגַּע בּוֹ
  choice: если мы будем молить Его
  rationale: В данном сочетании פגע с ב означает обращаться с настойчивой просьбой, умолять; условное «если» естественно передаёт функцию כִּי в контексте.
theological_decisions:
- issue: Передача божественного титула שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: שַׁדַּי выступает как божественный титул. Его смысловой перевод понятен современному читателю и не привносит конфессионального толкования.
- issue: Риторическое מַה перед обозначением Бога
  choice: Кто такой Всемогущий
  alternative: Что такое Всемогущий
  rationale: Русское «кто такой» грамматически и стилистически уместно применительно к личности и сохраняет пренебрежительную риторическую силу вопроса; оно не должно пониматься как отрицание личностности Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством, но без архаизации. Параллелизм двух риторических вопросов сохранён; речь передаёт вызывающе-прагматическую позицию нечестивых в контексте Иов 21.
