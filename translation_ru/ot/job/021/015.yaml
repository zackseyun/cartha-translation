  terminology: «Всемогущий» — уместный смысловой перевод שַׁדַּי. «Служить» верно передаёт עבד в широком значении верности и религиозного служения, без неоправданного сужения до богослужения. Буква «Его» допустима по русской библейской издательской конвенции.
