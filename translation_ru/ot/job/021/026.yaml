  yaml_path: translation/ot/job/021/026.yaml
  text: Together they lie down in the dust[a], and worms cover them.
translation:
  language: ru
  text: Вместе они лягут в прах, и черви[a] покроют их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «личинки». Еврейское רִמָּה может обозначать червей или личинок в контексте разложения тела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: Вместе
  rationale: 'Наречие подчёркивает общую участь двух людей, противопоставленных в контексте: при разных обстоятельствах жизни оба приходят к одному концу.'
- source_word: עַל עָפָר
  choice: в прах
  rationale: Буквально предлог может означать «на», однако в контексте смерти и погребения естественное русское выражение «лечь в прах» точно передаёт образ, не заменяя его толкованием.
- source_word: יִשְׁכָּבוּ
  choice: они лягут
  rationale: Имперфект указывает на итоговую участь; будущее время естественно в русском контексте. Глагол «лягут» сохраняет конкретный образ смерти.
- source_word: רִמָּה
  choice: черви
  rationale: Существительное обозначает червей, в том числе личинок, связанных с разложением. «Черви» — широкое и традиционно понятное соответствие; более узкое «личинки» отмечено в сноске.
- source_word: תְּכַסֶּה
  choice: покроют
  rationale: Еврейский глагол стоит в единственном числе при собирательном существительном, тогда как по-русски с выбранным множественным «черви» требуется форма «покроют».
- source_word: עֲלֵיהֶם
  choice: их
  rationale: Значение предлога естественно включено в управление русского глагола «покрыть кого-либо»; буквальное «над ними» здесь было бы менее естественным.
