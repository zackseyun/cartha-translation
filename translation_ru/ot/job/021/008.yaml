  text: זַרְעָ֤/ם נָכ֣וֹן לִ/פְנֵי/הֶ֣ם עִמָּ֑/ם וְ֝/צֶאֱצָאֵי/הֶ֗ם לְ/עֵינֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/008.yaml
  text: Their offspring are established before them[a], with them, and their descendants before their eyes.
translation:
  language: ru
  text: Их потомство прочно устроено[a] перед ними, с ними, и их потомки — у них на глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Их потомство надёжно перед ними, с ними, а их потомки — у них на глазах».'
    reason: Нָכוֹן может означать «прочное, устойчивое, надёжное»; буквальное соотношение «перед ними, с ними» в еврейской фразе допускает разные способы передачи в русском.
lexical_decisions:
- source_word: זַרְעָם
  choice: их потомство
  rationale: Собирательное «потомство» передаёт значение זֶרַע и не сужает его до малолетних детей.
- source_word: נָכוֹן
  choice: прочно стоит
  rationale: Передаёт состояние устойчивости и утверждённости, сохраняя возможный оттенок безопасности.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Сохраняет пространственный образ исходного текста и подразумевает, что они сами видят благополучие своего потомства.
- source_word: עִמָּם
  choice: рядом с ними
  rationale: Естественно по-русски выражает присутствие потомства вместе с ними, не сливая эту фразу с предшествующей.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: и их потомки
  rationale: Передаёт צֶאֱצָאִים как последующие поколения и сохраняет параллелизм с «потомством».
- source_word: לְעֵינֵיהֶם
  choice: у них на глазах
  rationale: Живой современный русский оборот, передающий непосредственное зрительное свидетельство.
