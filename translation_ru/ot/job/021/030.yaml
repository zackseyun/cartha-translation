  - marker: b
    text: 'Или: «их приводят ко дню гнева». Еврейский глагол может означать, что их ведут, уводят или приводят к этому дню.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-аргументативную связь с предшествующей мыслью.
- source_word: לְיוֹם אֵיד
  choice: ко дню бедствия
  rationale: Предлог לְ при слове «день» указывает на будущий срок; אֵיד означает бедствие, несчастье или гибель.
- source_word: יֵחָשֶׂךְ
  choice: сбережён
  rationale: Форма нифаль от חשׂך допускает значения «пощажён», «удержан» и «сохранён». «Сбережён» естественно выражает сохранение до будущего дня, не исключая оттенка временной пощады.
- source_word: רָע
  choice: злой
  rationale: Субстантивированное прилагательное мужского рода обозначает злого, нечестивого человека; краткая форма сохраняет единственное число и обобщающий характер.
- source_word: לְיוֹם עֲבָרוֹת
  choice: ко дню гнева
  rationale: Множественное עֲבָרוֹת имеет усилительный оттенок ярости или гнева; по-русски естественно единственное собирательное «гнев».
- source_word: יוּבָלוּ
  choice: их ведут
  rationale: Хофаль от יבל означает «быть приведёнными/уведёнными». Русская неопределённо-личная конструкция сохраняет пассивный смысл и множественное число еврейского глагола.
theological_decisions:
- issue: Связь участи злых с будущим судом
  choice: Стих говорит, что злой сохраняется до будущего дня бедствия и гнева.
  alternative: Злой полностью избавляется от дня бедствия либо уже теперь выводится навстречу ему.
  rationale: Параллельные обороты לְיוֹם и значения глаголов наиболее естественно указывают на отсрочку, однако перевод и примечания сохраняют лексическую неоднозначность и не снимают напряжение в рассуждении Иова.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Переход от единственного числа «злой» к множественному «их» сохранён вслед за еврейским текстом.
