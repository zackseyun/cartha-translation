  yaml_path: translation/ot/job/021/030.yaml
  text: For the evil man is spared for the day of disaster[b][a]; they are led away for the day of wrath.
translation:
  language: ru
  text: Ведь нечестивый сохраняется[a] для дня бедствия; ко дню гнева их ведут[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пощажён», «удержан» или «сохранён». Еврейский глагол допускает эти значения.'
