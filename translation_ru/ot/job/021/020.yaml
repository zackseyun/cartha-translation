  text: יִרְא֣וּ עינ/ו כִּיד֑/וֹ וּ/מֵ/חֲמַ֖ת שַׁדַּ֣י יִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/020.yaml
  text: Let his own eyes see his ruin[b][a], and let him drink from the wrath of the Almighty.
translation:
  language: ru
  text: Пусть он своими глазами увидит своё бедствие[b] и испьёт гнев Всемогущего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его глаза увидят его бедствие, и он испьёт гнев Всемогущего». Древнееврейские формы глаголов допускают не только пожелание, но и предсказание будущего.'
    reason: alternative_reading
  - marker: b
    text: «Бедствие» можно также перевести как «несчастье», «гибель» или «разорение».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאוּ עֵינָיו
  choice: пусть он своими глазами увидит
  rationale: 'Буквально: «пусть его глаза увидят». Естественная русская конструкция сохраняет акцент на том, что нечестивый должен лично стать свидетелем постигшего его воздаяния.'
- source_word: כִּידוֹ
  choice: постигшее его бедствие
  rationale: כִּיד обозначает бедствие, несчастье или гибель. «Бедствие» передаёт смысл без чрезмерного усиления до полного уничтожения; оборот «постигшее его» естественно выражает притяжательный суффикс в данном контексте.
- source_word: וּמֵחֲמַת
  choice: и испьёт гнев
  rationale: חֵמָה здесь означает гнев или ярость, а сочетание с «пить» метафорически описывает личное переживание Божьего суда. «Испьёт гнев» сохраняет образ, тогда как буквальное воспроизведение предлога מִן звучало бы по-русски неестественно.
- source_word: שַׁדַּי
  choice: Всемогущего
  rationale: Устоявшаяся и понятная передача божественного титула שַׁדַּי, особенно уместная в книге Иова.
- source_word: יִשְׁתֶּה
  choice: пусть ... испьёт
  rationale: Форма имперфекта понята как пожелание, параллельное первой части стиха. Совершенный вид «испьёт» естественно передаёт полноту образного вкушения гнева.
theological_decisions:
- issue: Модальная сила древнееврейских имперфектов יִרְאוּ и יִשְׁתֶּה
  choice: 'Пожелание: «пусть ... увидит ... и испьёт»'
  alternative: 'Предсказание: «его глаза увидят ... и он испьёт»'
  rationale: В контексте Иов настаивает, чтобы нечестивый сам испытал воздаяние, а не только его потомки. Поэтому пожелательное прочтение лучше передаёт ход речи, но грамматика допускает и будущее значение, которое сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конструкция «своими глазами» естественно подчёркивает личное переживание суда; метафора питья сохранена без добавления отсутствующей в тексте «чаши».
