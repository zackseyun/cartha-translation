  text: Have you not asked those who travel the road[b][a], and do you not recognize their signs?
translation:
  language: ru
  text: Разве вы не расспрашивали путников[a] и не узнаёте их примет[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «проходящих дорогой»; также возможно: «тех, кто бывает в пути».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знаков», «указаний». Вероятно, имеются в виду известные путникам признаки или свидетельства того, о чём говорится далее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве… не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет укоризненный тон.
- source_word: שְׁאֶלְתֶּם
  choice: вы не спрашивали
  rationale: Прямо передаёт значение «спрашивать, расспрашивать»; форма естественна для современного русского языка.
- source_word: עֹבְרֵי דָרֶךְ
  choice: путников
  rationale: Компактно и естественно передаёт буквально «проходящих дорогой», то есть людей, бывающих в пути и знающих происходящее в разных местах.
- source_word: וְאֹתֹתָם
  choice: их примет
  rationale: Слово אוֹת обозначает знак, примету или свидетельствующий признак. «Приметы» сохраняет образ наблюдаемых указаний, не превращая его сразу в отвлечённое «свидетельство».
- source_word: לֹא תְנַכֵּרוּ
  choice: не узнаёте
  rationale: Порода piel глагола נכר здесь допускает смысл «узнавать, распознавать, признавать». «Узнаёте» хорошо сочетается с «приметами» и не устраняет смысловую неоднозначность.
