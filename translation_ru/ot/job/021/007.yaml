base_translation:
  language: en
  yaml_path: translation/ot/job/021/007.yaml
  text: Why do the wicked live on[a], grow old, and even become mighty in wealth?
translation:
  language: ru
  text: Почему нечестивые продолжают жить, достигают старости и даже богатеют?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «становятся всё сильнее (могущественнее)». Еврейское חָיִל может означать богатство, имущество, силу или военную мощь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Прямо передаёт вопросительное наречие и сохраняет резкую силу протеста Иова без добавочных пояснений.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Устойчивое и уместное для литературы мудрости обозначение людей, поступающих вопреки нравственной правде; речь не ограничена юридически виновными.
- source_word: יִחְיוּ
  choice: продолжают жить
  rationale: Имперфект выражает продолжающуюся жизнь нечестивых вопреки ожидаемому воздаянию; такой перевод естественно передаёт смысловой акцент вопроса.
- source_word: עָתְקוּ
  choice: достигают старости
  rationale: В данном ряду глагол, вероятнее всего, указывает на продвижение в годах; формулировка ясна современному читателю и не предполагает дряхлости.
- source_word: גַּם
  choice: и даже
  rationale: 'Передаёт присоединение с усилением: нечестивые не только живут долго, но и преуспевают.'
- source_word: גָּבְרוּ חָיִל
  choice: богатеют
  rationale: Естественно передаёт возрастание достатка и ресурсов в контексте последующего описания благополучия нечестивых. Возможное значение силы или могущества сохранено в сноске.
theological_decisions:
- issue: Благополучие нечестивых и справедливое воздаяние
  choice: Сохранён открытый вопрос Иова без пояснения или богословского разрешения напряжения.
  alternative: Добавить намёк на временность их благополучия или на будущий суд.
  rationale: Таких уточнений в еврейском тексте стиха нет; его риторическая и богословская напряжённость должна остаться явной.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, dignified и естественная. «Нечестивые» сохраняет библейский регистр, а «продолжают жить», «достигают старости» и «богатеют» остаются понятными обычному читателю.
