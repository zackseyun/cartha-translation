  text: Они поют[a] под бубен и лиру и радуются звуку свирели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимают» или «возносят»; вероятно, имеется в виду голос или песня.'
    reason: Сохраняет сведения о необычной эллиптической конструкции еврейского текста и не выдаёт контекстуальное восполнение за буквальное значение.
  - marker: b
    text: 'Точный вид этого древнего духового инструмента неизвестен; возможный перевод: «флейта».'
    reason: Отражает лексическую неопределённость названия музыкального инструмента.
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: поют
  rationale: Буквально глагол означает «поднимают, возносят», но здесь объект не назван; в сочетании с музыкальными инструментами подразумевается, что они возносят голос или песню. «Поют» естественно передаёт этот смысл по-русски, не добавляя искусственной конструкции.
- source_word: תֹף
  choice: бубен
  rationale: Ударный инструмент с мембраной, вероятно ручной рамочный барабан; традиционное и понятное русское соответствие — «бубен».
- source_word: כִּנּוֹר
  choice: лира
  rationale: Древний струнный инструмент; «лира» точнее нейтрального «арфа» и соответствует историческому типу инструмента.
- source_word: עוּגָב
  choice: свирель
  rationale: Обозначает духовой музыкальный инструмент, точный вид которого не установлен. «Свирель» сохраняет древний поэтический колорит и остаётся понятной современному читателю.
