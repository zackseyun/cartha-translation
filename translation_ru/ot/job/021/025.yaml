  text: while another dies with a bitter soul and has not enjoyed good[a].
translation:
  language: ru
  text: А другой умирает с горечью в душе, так и не вкусив добра[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не ел добра»; еврейский текст говорит об испытанном в жизни благе через образ еды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֶה
  choice: А другой
  rationale: В контексте это противопоставление человеку из предыдущего стиха. Русское «А другой» естественно передаёт соединительный союз и указательное местоимение, не ослабляя контраста.
- source_word: יָמוּת
  choice: умирает
  rationale: Имперфект описывает общий, типичный случай, а не обязательно отдельное будущее событие; настоящее время естественно для такого сопоставления.
- source_word: בְּ/נֶפֶשׁ מָרָה
  choice: с горечью в душе
  rationale: Так сохраняются и внутреннее состояние человека, и образ горечи, но фраза звучит естественнее современного русского «с горькой душой».
- source_word: וְ/לֹא אָכַל
  choice: так и не вкусив
  rationale: Причастный оборот естественно связывает состояние человека с его смертью; «вкусив» сохраняет еврейский образ еды и одновременно выражает переживание или приобщение.
- source_word: בַּ/טּוֹבָה
  choice: добра
  rationale: '«Добро» сохраняет широту значения: благо, благополучие и хорошие стороны жизни. Более узкое «достаток» неоправданно ограничило бы смысл.'
