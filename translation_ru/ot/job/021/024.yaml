lexical_decisions:
- source_word: עֲטִינָיו
  choice: его сосуды
  rationale: Редкое и спорное слово, вероятно обозначающее либо сосуды для молока, либо вымя. «Сосуды» сохраняет образ изобилия и не приписывает человеку буквальное вымя; лексическая альтернатива вынесена в сноску.
- source_word: מָלְאוּ
  choice: полны
  rationale: Перфект описывает устойчивое состояние благополучия; настоящее время естественно передаёт этот статический смысл.
- source_word: חָלָב
  choice: молока
  rationale: Прямое значение слова; молоко служит конкретным образом достатка.
- source_word: וּמֹחַ עַצְמוֹתָיו
  choice: а костный мозг
  rationale: Естественное современное русское соответствие буквальному сочетанию «мозг его костей», сохраняющее телесный образ без синтаксической тяжеловесности.
- source_word: יְשֻׁקֶּה
  choice: напоён влагой
  rationale: Пуаль выражает состояние насыщенности влагой. Формулировка передаёт образ свежести и телесной силы, не сводя его к сухому клиническому «увлажнён».
