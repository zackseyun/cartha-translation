  yaml_path: translation/ot/job/021/023.yaml
  text: One dies in the fullness of his vigor[a], wholly at ease and secure.
translation:
  language: ru
  text: Один умирает в полноте своих сил[a], совершенно спокойный и безмятежный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Один умирает в полной крепости, всецело спокойный и ничем не тревожимый».'
    reason: Лексически возможен более буквальный перевод сочетаний בְּעֶצֶם תֻּמּוֹ и כֻּלּוֹ; примечание сохраняет оттенки полноты, крепости и целостности состояния, не делая их основным текстом.
lexical_decisions:
- source_word: זֶה
  choice: Один
  rationale: Указательное местоимение вводит один из двух противопоставленных случаев. Русское «один» естественно передаёт обобщённо-единичное значение, не превращая фразу в указание на конкретного человека.
- source_word: יָמוּת
  choice: умирает
  rationale: Имперфект имеет здесь обобщающее значение; настоящее время естественно выражает наблюдение о человеческой участи.
- source_word: בְּעֶצֶם תֻּמּוֹ
  choice: в расцвете сил
  rationale: Сочетание буквально связано с полнотой, целостностью или крепостью состояния. В контексте речь идёт не о нравственной непорочности, а о неослабленной жизненной силе; «в расцвете сил» ясно и естественно передаёт этот смысл.
- source_word: כֻּלּוֹ
  choice: всецело
  rationale: Слово усиливает последующее описание и указывает на полноту состояния; «всецело» сохраняет эту функцию без тяжеловесного «весь он».
- source_word: שַׁלְאֲנַן
  choice: спокойный
  rationale: Прилагательное обозначает состояние покоя, благополучия и свободы от тревог. «Спокойный» сохраняет широкий смысл и не сводит его только к материальному достатку.
- source_word: וְשָׁלֵיו
  choice: и безмятежный
  rationale: Близкий по смыслу термин усиливает образ невозмутимого, ничем не нарушаемого благополучия. «Безмятежный» естественно дополняет «спокойный», сохраняя поэтический параллелизм.
