  text: מָֽתְקוּ ל֗/וֹ רִגְבֵ֫י נָ֥חַל וְ֭/אַחֲרָי/ו כָּל אָדָ֣ם יִמְשׁ֑וֹךְ וּ֝/לְ/פָנָ֗י/ו אֵ֣ין מִסְפָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/033.yaml
  text: The clods of the valley are sweet to him[a]; all mankind follows after him[c][b], and those before him are without number.
translation:
  language: ru
  text: Сладки ему комья земли в долине[a]; за ним последует всё человечество[b][c], а тех, кто был до него, — без числа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сладки ему комья земли в русле потока (вади)». Еврейское слово נחל может обозначать долину, овраг, русло потока или вади.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за ним последуют все люди»; буквально: «каждый человек».'
    reason: lexical_alternative
  - marker: c
    text: 'Эти слова могут изображать похоронную процессию или общий путь всех людей к смерти: бесчисленные люди ушли прежде него, а всё человечество следует за ним.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָתְקוּ
  choice: сладки
  rationale: Глагол от корня מתק обозначает сладость или приятность. Буквальный образ «сладки» сохраняет выразительную метафору еврейского текста, не сводя её к пояснительному пересказу о покое в могиле.
- source_word: לּוֹ
  choice: ему
  rationale: 'Предлог с местоименным суффиксом передаёт отношение к умершему; по-русски естественно и точно: «ему».'
- source_word: רִגְבֵי
  choice: комья земли
  rationale: רֶגֶב — ком, глыбка почвы. Добавление «земли» делает конкретный погребальный образ ясным для современного русского читателя.
- source_word: נָחַל
  choice: в долине
  rationale: נחל может означать долину, овраг, русло потока или вади. «В долине» естественно в основном тексте и не устраняет лексическую многозначность, отмеченную в сноске.
- source_word: וְאַחֲרָיו
  choice: за ним
  rationale: Выражение допускает как пространственный образ шествия следом, так и последовательность людей, идущих тем же путём смерти.
- source_word: כָּל אָדָם
  choice: всё человечество
  rationale: אָדָם употреблено собирательно и обозначает людей вообще, а не только мужчин; «всё человечество» сохраняет универсальный смысл.
- source_word: יִמְשׁוֹךְ
  choice: последует
  rationale: משך буквально связано с движением или влечением, но в сочетании с «за ним» здесь естественно передаётся как следование. Будущее время соответствует форме еврейского глагола.
- source_word: וּלְפָנָיו
  choice: тем, кто был до него
  rationale: Фраза может иметь пространственный и временной смысл. Русская формулировка сохраняет мысль о бесчисленных предшественниках, не уточняя, идёт ли речь о похоронном шествии или о смерти вообще.
- source_word: אֵין מִסְפָּר
  choice: нет числа
  rationale: Это близкая и естественная русская передача еврейской идиомы, обозначающей неисчислимое множество.
theological_decisions:
- issue: Смысл погребального образа и движения людей «за ним» и «до него»
  choice: Основной текст сохраняет конкретные образы могильной земли, следования за человеком и бесчисленных предшественников.
  alternative: 'Возможны более узкие толкования: похоронная процессия либо общее движение всего человечества к смерти.'
  rationale: Еврейский текст допускает оба прочтения. Перевод не сводит образ ни исключительно к погребальной церемонии, ни исключительно к отвлечённому утверждению о смертности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, поэтическим звучанием. Синтаксис краток и сохраняет параллелизм еврейского стиха; конкретная метафора «сладки… комья земли» оставлена без рационализирующего пояснения в основном тексте.
