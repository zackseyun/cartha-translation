  yaml_path: translation/ot/job/021/019.yaml
  text: God stores up his iniquity for his sons? Let him repay it to the man himself[c][b][a], so that he may know it.
translation:
  language: ru
  text: Неужели Бог приберегает его беззаконие[c] для его сыновей[b]?[a] Пусть Он воздаст ему самому, чтобы тот узнал это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод без риторического вопроса: «Бог приберегает его беззаконие для его сыновей; пусть Он воздаст ему, чтобы тот узнал». Однако контекст позволяет услышать здесь возражение Иова против этой мысли.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сыновей»; в данном контексте слово может относиться шире к потомкам человека.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово, переведённое как «беззаконие», может также означать зло, беду или пагубные последствия беззакония.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Обычное в книге Иова обозначение Бога в единственном числе; перевод не добавляет отсутствующих в форме оттенков.
- source_word: יִצְפֹּן
  choice: приберегает
  rationale: Глагол означает скрывать, хранить или откладывать; «приберегает» естественно передаёт мысль о воздаянии, отложенном для потомков.
- source_word: לְבָנָיו
  choice: для его сыновей
  rationale: Еврейский текст буквально говорит о сыновьях; более широкое значение «потомки» отмечено в сноске.
- source_word: אוֹנוֹ
  choice: беззаконие нечестивца
  rationale: Слово אָוֶן может обозначать беззаконие, зло, беду либо пагубные последствия зла. «Беззаконие» сохраняет прямую связь с проступком, а добавление «нечестивца» ясно обозначает референта притяжательного суффикса из контекста.
- source_word: יְשַׁלֵּם
  choice: пусть Он воздаст
  rationale: Пиэль от שׁלם означает воздать или отплатить; в контексте форма естественно понимается как пожелание-требование Иова, противопоставленное воздаянию сыновьям.
- source_word: אֵלָיו
  choice: ему самому
  rationale: Местоимение относится к самому нечестивцу; «самому» естественно подчёркивает контраст с его сыновьями.
- source_word: וְיֵדָע
  choice: чтобы тот узнал это
  rationale: ידע буквально означает «знать, узнать». Союз с формой глагола здесь допускает целевое или результативное понимание; «тот» устраняет неестественную для русского местоименную неясность и указывает на нечестивца.
theological_decisions:
- issue: Является ли начальная часть утверждением Иова или мнением, которое он оспаривает
  choice: 'Передать её риторическим вопросом: «Неужели Бог…?»'
  alternative: 'Передать как прямое утверждение: «Бог приберегает…»'
  rationale: В контексте Иов оспаривает представление, будто надлежащее нечестивцу воздаяние достаточно осуществить на его детях. Риторический вопрос, за которым следует «Пусть Он воздаст ему самому», сохраняет ход рассуждения, хотя еврейская форма сама по себе допускает и утвердительное прочтение.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым риторическим строем. Заглавное «Он» обозначает Бога по принятой русской библейской традиции. Формулировка сохраняет неоднозначность первого предложения и смысловой диапазон אָוֶן посредством сноски.
