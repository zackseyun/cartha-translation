lexical_decisions:
- source_word: שׁוֹרוֹ
  choice: бык его
  rationale: שׁוֹר обозначает крупный рогатый скот; в контексте размножения речь идёт о самце, поэтому «бык» точнее, чем «вол».
- source_word: עִבַּר
  choice: покрывает
  rationale: В данном контексте глагол относится к случке скота. «Покрывает» — естественный русский животноводческий термин, передающий действие самца без лишнего пояснения.
- source_word: וְלֹא יַגְעִל
  choice: и не безуспешно
  rationale: Значение формы יַגְעִל здесь не вполне ясно. По параллелизму речь идёт об успешном размножении; отрицательная конструкция «не безуспешно» сохраняет краткость и не приписывает глаголу чрезмерно конкретного технического смысла.
- source_word: תְּפַלֵּט
  choice: телится
  rationale: Поскольку подлежащее — корова, «телится» естественно и точно передаёт рождение приплода.
- source_word: פָּרָתוֹ
  choice: корова его
  rationale: פָּרָה обычно означает корову; уточнение возраста словом «тёлка» текстом не требуется.
- source_word: וְלֹא תְשַׁכֵּל
  choice: и не теряет телёнка
  rationale: שׁכל выражает лишение потомства. В данном контексте «не теряет телёнка» сохраняет более широкий смысл, чем исключительно «не выкидывает», и естественно сочетается с предшествующим «телится».
