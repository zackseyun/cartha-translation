source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ לָ֭/אֵל ס֣וּר מִמֶּ֑/נּוּ וְ/דַ֥עַת דְּ֝רָכֶ֗י/ךָ לֹ֣א חָפָֽצְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/014.yaml
  text: Yet they say to God[a], ‘Depart from us, and we do not desire the knowledge of your ways.’
translation:
  language: ru
  text: 'Но они говорят Богу: «Отойди от нас[a]; знать Твои пути мы не желаем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Уклонись от нас»; «Уйди от нас».'
    reason: Лексема סוּר допускает значения «отойти», «уклониться», «уйти».
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Но они говорят
  rationale: Форма вводит речь; настоящее время естественно передаёт характерную позицию нечестивых, а «но» выражает контраст с описанным в контексте благополучием.
- source_word: לָאֵל
  choice: Богу
  rationale: אֵל здесь является обычным обозначением Бога, а не именем собственным.
- source_word: סוּר מִמֶּנּוּ
  choice: Отойди от нас
  rationale: Императив סוּר требует удаления или отступления; выбран прямой и достойный русский эквивалент без смягчения дерзости обращения.
- source_word: וְדַעַת דְּרָכֶיךָ
  choice: знать Твои пути
  rationale: Еврейское сочетание буквально обозначает «знание Твоих путей», но по-русски инфинитивная конструкция естественнее и сохраняет смысл стремления познать Божьи пути.
- source_word: לֹא חָפָצְנוּ
  choice: мы не желаем
  rationale: חפץ выражает желание или расположение; «не желаем» точно передаёт сознательный отказ и хорошо сочетается с инфинитивом «знать».
theological_decisions:
- issue: Прямая речь нечестивых, обращённая к Богу
  choice: «Отойди от нас»
  alternative: «Оставь нас в покое»
  rationale: Прямой императив сохраняет резкость человеческого бунта; разговорная перифраза «оставь нас в покое» добавила бы отсутствующий в тексте оттенок.
- issue: Связь между двумя частями высказывания
  choice: 'Сочинительная связь передана бессоюзным продолжением: «знать Твои пути мы не желаем»'
  alternative: «ибо мы не желаем знать Твои пути»
  rationale: Еврейское וְ непосредственно соединяет требования. Русское бессоюзное продолжение сохраняет параллельность и не навязывает явно причинного толкования.
translation_notes:
  register: Современный литературный русский язык с краткой, резкой прямой речью. Инверсия «знать Твои пути мы не желаем» подчёркивает отвергаемый объект и сохраняет поэтическую торжественность без архаизации.
