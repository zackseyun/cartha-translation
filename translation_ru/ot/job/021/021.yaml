lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующей мысли; «ибо» естественно сохраняет причинно-пояснительную связь и достойный поэтический регистр.
- source_word: מַה
  choice: какое
  rationale: В сочетании «какое ему дело» передаёт риторический вопрос о безразличии, не превращая его в прямое утверждение.
- source_word: חֶפְצוֹ
  choice: ему дело
  rationale: חֵפֶץ может означать желание, удовольствие, интерес или заботу. Русская идиома «какое ему дело» естественно выражает здесь отсутствие интереса; буквальная возможность «какая ему радость» сохранена в сноске.
- source_word: בְּבֵיתוֹ
  choice: до его дома
  rationale: Предлог ב при חֵפֶץ обозначает объект интереса. «Дом» сохраняет конкретный образ оригинала, при этом возможное значение семьи или домочадцев отмечено в сноске.
- source_word: אַחֲרָיו
  choice: после него
  rationale: 'Буквально передаёт временное выражение и сохраняет некоторую недосказанность: речь может идти о времени после смерти или ухода человека.'
- source_word: וּמִסְפַּר
  choice: когда число
  rationale: Формальный союз «и» в контексте выражает обстоятельственную связь. «Когда» ясно и естественно связывает прекращение жизни с отсутствием дальнейшей заинтересованности.
- source_word: חֳדָשָׁיו
  choice: его месяцев
  rationale: Сохранён конкретный древнееврейский образ месяцев как меры продолжительности жизни.
- source_word: חֻצָּצוּ
  choice: оборвано
  rationale: Пассивная форма допускает смысл прекращения или отсечения. «Оборвано» естественно сочетается с исчисленной продолжительностью жизни и сохраняет резкость образа; вариант «определено/отмерено» отмечен в сноске.
