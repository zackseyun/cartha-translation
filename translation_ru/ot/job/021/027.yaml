  source_fidelity: Начальное «Вот, я знаю ваши мысли» точно передаёт הֵן и יָדַעְתִּי מַחְשְׁבוֹתֵיכֶם. Однако «вы хотите причинить» вносит явно выраженное желание, которого форма תַּחְמֹסוּ сама по себе не требует; она обозначает совершаемое/ожидаемое неправедное насилие или причинение вреда. Исправление передаёт это без добавления отдельного глагола намерения и сохраняет связь замыслов с неправедным обращением с Иовом.
