  text: הֵ֣ן יָ֭דַעְתִּי מַחְשְׁבֽוֹתֵי/כֶ֑ם וּ֝/מְזִמּ֗וֹת עָלַ֥/י תַּחְמֹֽסוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/027.yaml
  text: Look[a], I know your thoughts, and the schemes with which you would wrong me.
translation:
  language: ru
  text: Вот, я знаю ваши мысли и замыслы, которыми вы поступаете со мной несправедливо[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и замыслы, которые вы строите против меня»; возможно также: «и насильственные планы, которые вы замышляете против меня». Еврейский глагол может означать совершать насилие, угнетать или поступать несправедливо.'
    reason: Лексическое значение глагола допускает как общее причинение несправедливого вреда, так и более сильный оттенок насилия или угнетения; синтаксическую связь с «замыслами» можно передать по-разному.
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатическое привлечение внимания естественным для современного русского языка способом.
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект выражает наличное знание; настоящее время по-русски звучит естественно и точно.
- source_word: מַחְשְׁבוֹתֵיכֶם
  choice: ваши мысли
  rationale: Сохраняет широкое значение существительного — мысли, намерения или планы — не сужая его преждевременно.
- source_word: וּמְזִמּוֹת
  choice: и замыслы
  rationale: Передаёт намеренное планирование и допускает подразумеваемый контекстом враждебный оттенок без добавления слова «злые».
- source_word: עָלַי
  choice: мне
  rationale: В сочетании с глаголом враждебного действия естественно выражается косвенным дополнением; значение направленности против Иова раскрывается всей фразой.
- source_word: תַּחְמֹסוּ
  choice: вы хотите причинить зло
  rationale: Передаёт направленное против Иова несправедливое и вредоносное действие. Формулировка сохраняет оттенок намерения в данном контексте и не ограничивает значение физическим насилием.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и понятной формулировкой. «Вот» сохраняет эмфатическое начало, а «причинить мне зло» передаёт враждебное действие без неоправданного сведения его только к физическому насилию.
