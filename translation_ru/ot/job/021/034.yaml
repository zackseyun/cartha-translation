base_translation:
  language: en
  yaml_path: translation/ot/job/021/034.yaml
  text: How then can you comfort me with emptiness[a], when your answers remain nothing but treachery?
translation:
  language: ru
  text: Как же вы утешаете меня пустыми словами[a], когда в ваших ответах остаётся лишь вероломство?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как же вы утешаете меня напрасно, когда в ваших ответах остаётся вероломство?»'
    reason: Лексема הָבֶל может обозначать как пустое содержание утешения, так и его тщетность; נִשְׁאַר допускает буквальное «остаётся».
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Как же
  rationale: Вопросительное наречие с союзом вводит итоговый риторический вопрос; частица «же» естественно передаёт связь с предшествующим рассуждением.
- source_word: תְּנַחֲמוּנִי
  choice: вы утешаете меня
  rationale: Пиэль глагола נחם с суффиксом первого лица означает «утешать меня». Настоящее время по-русски естественно выражает риторическое обличение.
- source_word: הָבֶל
  choice: пустыми словами
  rationale: הבל обозначает пустоту, тщету, бессодержательность. Контекст речей друзей позволяет естественно выразить предмет их утешения как «пустые слова», сохранив смысл пустого содержания, а не только безуспешности.
- source_word: וּתְשׁוּבוֹתֵיכֶם
  choice: в ваших ответах
  rationale: תשובה означает «ответ, отклик»; предложная конструкция согласуется с русским оборотом «остаётся лишь» и отражает содержание ответов друзей.
- source_word: נִשְׁאַר
  choice: остаётся
  rationale: Нифаль глагола שׁאר означает «оставаться, быть оставленным». Единственное число масоретского текста сохранено в безлично-предикативной русской конструкции.
- source_word: מָעַל
  choice: вероломство
  rationale: מעל обозначает нарушение верности, предательство доверия, вероломство; этот выбор сохраняет более сильное обвинение, чем просто «ошибка» или «обман».
theological_decisions:
- issue: Сила обвинения в מָעַל
  choice: вероломство
  alternative: обман / неверность
  rationale: Перевод сохраняет нравственную тяжесть обвинения Иова, не уточняя сверх текста, идёт ли речь о неверности Богу, другу или истине.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Пустыми словами» звучит естественнее буквального «пустотой», а сноска сохраняет возможное наречное понимание «напрасно».
