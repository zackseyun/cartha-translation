  text: They send out their little ones like a flock[c][b][a], and their children dance.
translation:
  language: ru
  text: Они выпускают своих малышей, словно стадо[a], и их дети скачут[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно овец». Еврейское צֹאן — собирательное название овец, коз или мелкого скота вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пляшут», «подпрыгивают». Еврейский глагол передаёт живое, радостное движение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּחוּ
  choice: выпускают
  rationale: Порода пиэль глагола שלח здесь означает «выпускать, отпускать наружу». «Выпускают» естественно передаёт свободное движение детей, не добавляя идеи изгнания или удаления.
- source_word: כַצֹּאן
  choice: словно стадо
  rationale: צֹאן — собирательное обозначение мелкого скота, прежде всего овец и коз. «Словно стадо» сохраняет собирательный образ и хорошо сочетается с множеством выбегающих детей.
- source_word: עֲוִילֵיהֶם
  choice: своих малышей
  rationale: עויל обозначает совсем маленького ребёнка. «Малыши» сохраняет указание на ранний возраст, но не сужает значение исключительно до новорождённых.
- source_word: יַלְדֵיהֶם
  choice: их дети
  rationale: ילד в данной форме означает детей или потомство вообще. «Дети» естественно передаёт смысл и сохраняет параллелизм с «малышами».
- source_word: יְרַקֵּדוּן
  choice: резвятся
  rationale: רקד выражает живое движение — пляску, скачки или подпрыгивание. В контексте беззаботного благополучия «резвятся» естественно охватывает этот диапазон, не утверждая непременно формальный танец.
