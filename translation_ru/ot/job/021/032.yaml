  text: וְ֭/הוּא לִ/קְבָר֣וֹת יוּבָ֑ל וְֽ/עַל גָּדִ֥ישׁ יִשְׁקֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/032.yaml
  text: Yet he is carried to the grave[c][b][a], and over the mound one keeps watch.
translation:
  language: ru
  text: Но его несут к месту погребения[c], и над могильным холмом[b] бодрствуют[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и он бодрствует над могильным холмом», если считать погребённого субъектом глагола; в еврейском тексте субъект прямо не назван.'
    reason: alternative_reading
  - marker: b
    text: Буквально здесь употреблено еврейское слово со значением «куча», «груда»; вероятно, имеется в виду холм земли, насыпанной над могилой.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «к могилам»; в еврейском тексте слово стоит во множественном числе и, возможно, собирательно обозначает место захоронения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Но его
  rationale: 'Союз וְ в данном контексте имеет уместный противительный оттенок: нечестивец, несмотря на сказанное о нём, удостаивается погребения. Местоимение передано как объект в соответствии с пассивной формой следующего глагола.'
- source_word: לִקְבָרוֹת
  choice: к месту погребения
  rationale: Еврейское существительное стоит во множественном числе, однако в данном контексте может собирательно обозначать место захоронения. Русское выражение естественно передаёт направление погребальной процессии; форма оригинала отмечена в сноске.
- source_word: יוּבָל
  choice: относят
  rationale: Глагол в хофале от יבל означает, что человека ведут или несут. В контексте похорон «относят» ясно передаёт перенесение умершего к месту погребения.
- source_word: גָּדִישׁ
  choice: могильным холмом
  rationale: גָּדִישׁ буквально обозначает кучу или сложенную массу; здесь наиболее вероятен холм насыпанной над могилой земли. Определение «могильный» проясняет контекст, не заменяя конкретный образ.
- source_word: יִשְׁקֹד
  choice: бодрствуют
  rationale: שׁקד означает бодрствовать, быть начеку, нести бдение. Неопределённо-личная форма по-русски позволяет не называть субъекта, который в еврейской строке явно не выражен.
theological_decisions:
- issue: Неявный субъект глагола יִשְׁקֹד
  choice: Неопределённо-личное «бодрствуют»
  alternative: «он бодрствует над могильным холмом»
  rationale: Еврейский текст не называет субъект прямо. Основной текст не отождествляет его ни с погребённым, ни со сторожами, а возможное отнесение глагола к погребённому сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. «Место погребения» выбрано вместо менее естественного в данном обороте буквального «могилы», а неопределённо-личное «бодрствуют» сохраняет синтаксическую неопределённость оригинала.
