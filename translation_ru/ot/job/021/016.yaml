  text: 'Вот, их благополучие не в их руках.[a]

    Замысел нечестивых далёк от меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также вопросительное прочтение: «Разве их благополучие не в их руках?» Еврейский текст допускает такую интонацию, хотя формально первая строка построена как утверждение.'
    reason: Сохраняет контекстуально возможное вопросительное понимание הֵן לֹא, не заменяя им немаркированное декларативное построение масоретского текста.
lexical_decisions:
- source_word: הֵן
  choice: Но разве
  rationale: Частица привлекает внимание и вводит возражение или подчёркнутый вывод; в данном контексте сочетание «Но разве» естественно передаёт переход и риторический оттенок.
- source_word: טוּבָם
  choice: их благополучие
  rationale: Существительное טוּב обозначает здесь не отвлечённую нравственную «доброту», а достаток и благополучную жизнь нечестивых.
- source_word: עֲצַת רְשָׁעִים
  choice: Совет нечестивых
  rationale: 'Сохранено широкое значение עֵצָה: замысел, образ мысли или совет; буквальное «совет» не устраняет намеренно возможные оттенки.'
- source_word: רָחֲקָה מֶנִּי
  choice: далёк от меня
  rationale: Сохранена пространственная метафора еврейского текста, выражающая решительное отмежевание Иова.
theological_decisions:
- issue: 'Синтаксис первой строки: вопрос или утверждение'
  choice: 'Риторический вопрос: «разве не в их руках…?»'
  alternative: 'Утверждение: «не в их руках их благополучие»'
  rationale: Согласуется с допустимым прочтением הֵן לֹא и с контекстом наблюдаемого благоденствия нечестивых, однако масоретский текст не содержит современного вопросительного знака; альтернативное прочтение сохранено в сноске.
- issue: Отмежевание говорящего от нечестивых
  choice: 'Сохранено прямое: «Совет нечестивых далёк от меня»'
  alternative: 'Разъясняющее: «Я не принимаю образ мыслей нечестивых»'
  rationale: 'Прямой вариант сохраняет образность и богословское напряжение: Иов признаёт факты их благополучия, но не разделяет их позиции.'
