  text: יבלו בַ/טּ֣וֹב יְמֵי/הֶ֑ם וּ֝/בְ/רֶ֗גַע שְׁא֣וֹל יֵחָֽתּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/013.yaml
  text: They spend their days in prosperity[a], and in a moment they go down to Sheol.
translation:
  language: ru
  text: Они проводят свои дни в благополучии и в одно мгновение нисходят в шеол.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу», «в мир мёртвых» или «к смерти». Еврейское слово — «шеол».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יבלו
  choice: проводят
  rationale: Пиэль глагола בלה здесь описывает течение или исчерпание дней; «проводят свои дни» естественно передаёт временной смысл.
- source_word: בַטּוֹב
  choice: в благополучии
  rationale: טוֹב с предлогом обозначает здесь состояние достатка и благополучия, которым наслаждаются нечестивые.
- source_word: יְמֵיהֶם
  choice: свои дни
  rationale: Естественная русская передача буквального «их дни» при подлежащем «они».
- source_word: וּבְרֶגַע
  choice: и в одно мгновение
  rationale: רֶגַע обозначает краткий миг; выражение сохраняет контраст между всей жизнью в благополучии и внезапным нисхождением.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет широкий древнееврейский образ мира мёртвых и не сужает его до могилы, смерти или позднейшего понятия ада.
- source_word: יֵחָתּוּ
  choice: нисходят
  rationale: В сочетании с שְׁאוֹל форма лучше всего понимается как нисхождение в мир мёртвых; «нисходят» сохраняет образ и несколько возвышенный поэтический регистр.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых; смерть
  rationale: «Шеол» сохраняет концептуальную открытость древнееврейского термина и не подменяет его более узким или поздним богословским понятием.
- issue: Залог и значение יֵחָתּוּ
  choice: нисходят
  alternative: низводятся; сокрушаются
  rationale: Контекст шеола поддерживает значение нисхождения, но форма допускает обсуждение; перевод не добавляет явно выраженного деятеля и не выбирает несообразное контексту «сокрушаются».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой. Порядок фраз сохраняет резкий контраст между долгими днями благополучия и мгновенным нисхождением в шеол.
