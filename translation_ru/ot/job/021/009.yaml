  text: בָּתֵּי/הֶ֣ם שָׁל֣וֹם מִ/פָּ֑חַד וְ/לֹ֤א שֵׁ֖בֶט אֱל֣וֹהַּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/009.yaml
  text: Their houses are safe from fear[b][a], and the rod of God is not upon them.
translation:
  language: ru
  text: Их дома в безопасности от страха, и жезл Бога не на них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: «Жезл Бога» — образ Божьего удара, наказания или бедствия.
    reason: Поясняет сохранённую еврейскую метафору, не сводя её к одному виду Божьего действия.
lexical_decisions:
- source_word: בָּתֵּיהֶם
  choice: их дома
  rationale: Конкретное «дома» сохраняет еврейский образ; по контексту слово может охватывать и семьи, что отмечено в сноске.
- source_word: שָׁלוֹם מִפָּחַד
  choice: в безопасности, страх им неведом
  rationale: שָׁלוֹם здесь обозначает благополучие и защищённость, а מִפָּחַד — свободу от страха. Такая формулировка естественна по-русски и не превращает страх в объективную угрозу.
- source_word: שֵׁבֶט
  choice: жезл
  rationale: «Жезл» сохраняет многозначный образ орудия власти, удара или взыскания, не сводя его только к наказанию либо воспитанию.
- source_word: אֱלוֹהַּ
  choice: Бога
  rationale: Обычный русский эквивалент единственного поэтического обозначения Бога в книге Иова.
- source_word: עֲלֵיהֶם
  choice: над ними
  rationale: Передаёт образ нависшего или обращённого против них жезла и звучит естественнее современного русского «на них» в данном сочетании.
theological_decisions:
- issue: Характер Божьего действия, обозначенного выражением «жезл Бога»
  choice: Сохранить метафору «жезл Бога», не уточняя вид воздействия.
  alternative: «наказание Бога», «Божье взыскание», «Божья кара»
  rationale: Еврейская метафора допускает удар, взыскание, наказание или бедствие; конкретизация устранила бы намеренную смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Параллелизм двух частей сохранён; архаичное «на них» заменено естественным «над ними».
