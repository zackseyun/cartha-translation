  yaml_path: translation/ot/job/021/006.yaml
  text: When I remember, I am dismayed, and trembling seizes my flesh.
translation:
  language: ru
  text: Когда я вспоминаю, я прихожу в ужас, и дрожь охватывает мою плоть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם זָכַרְתִּי
  choice: Когда я вспоминаю об этом
  rationale: Условная частица אִם в данном контексте естественно передаёт повторяющуюся или фактическую ситуацию как «когда». Добавленное «об этом» ясно указывает на предмет размышления из контекста, не устраняя его намеренную неопределённость.
- source_word: וְנִבְהָלְתִּי
  choice: меня охватывает ужас
  rationale: Форма בהל выражает сильный испуг, смятение или потрясение; русское выражение сохраняет интенсивность и естественно сочетается с последующей строкой.
- source_word: פַּלָּצוּת
  choice: дрожь
  rationale: Существительное обозначает содрогание или трепет от ужаса; «дрожь» понятно современному читателю и точно передаёт телесную реакцию.
- source_word: וְאָחַז בְּשָׂרִי
  choice: сотрясает моё тело
  rationale: Буквально дрожь «охватывает мою плоть». Контекстуальное «сотрясает моё тело» передаёт физическую силу переживания естественным современным русским языком.
theological_decisions:
- issue: Значение условной частицы אִם
  choice: Когда я вспоминаю
  alternative: Если я вспоминаю
  rationale: Здесь речь идёт не о сомнительном условии, а о реально возникающей реакции Иова при воспоминании; «когда» лучше выражает этот контекстуальный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллелизм двух телесно-эмоциональных реакций сохранён; архаичное «плоть» заменено естественным «тело».
