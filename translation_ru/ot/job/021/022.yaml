  text: הַ/לְ/אֵ֥ל יְלַמֶּד דָּ֑עַת וְ֝/ה֗וּא רָמִ֥ים יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/022.yaml
  text: Can anyone teach God knowledge[a], since he judges those on high?
translation:
  language: ru
  text: Разве можно учить Бога знанию, ведь Он судит возвышенных?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто высок»; возможно, имеются в виду небесные существа.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְאֵל
  choice: Разве можно ... Бога
  rationale: Вопросительная частица при לְאֵל вводит риторический вопрос; безличная русская конструкция естественно передаёт подразумеваемого неопределённого деятеля.
- source_word: יְלַמֶּד
  choice: научить
  rationale: Порода пиэль глагола למד означает «учить, наставлять»; «научить» естественно сочетается в русском с дополнениями «Бога» и «знанию».
- source_word: דָּעַת
  choice: знанию
  rationale: Существительное обозначает знание или понимание; «знание» сохраняет абстрактное существительное оригинала.
- source_word: וְהוּא
  choice: если Он
  rationale: Союз с местоимением буквально допускает «а Он» или «и Он», но здесь вторая часть служит основанием риторического вопроса. «Если Он» естественно выражает этот смысл, не делая причинную связь чрезмерно явной.
- source_word: רָמִים
  choice: тех, кто высок
  rationale: Субстантивированное множественное число от רום может обозначать высоких или возвышенных существ либо лиц. Формулировка сохраняет неопределённость между земными властителями и небесными существами.
- source_word: יִשְׁפּוֹט
  choice: судит
  rationale: Прямое значение формы qal от שפט — «судить»; оно соответствует контексту верховной власти Бога.
theological_decisions:
- issue: Кого обозначает רָמִים
  choice: Общее выражение «тех, кто высок» без уточнения их природы
  alternative: «возвышенных»; «небесных существ»; «земных правителей»
  rationale: Еврейский текст допускает отнесение как к возвышенным людям, так и к небесным существам. Широкая формулировка сохраняет эту смысловую напряжённость и не навязывает узкой космологической или политической трактовки.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос передан естественно и достойно. Местоимение «Он» написано с прописной буквы по принятой в русском библейском стиле традиции. Неопределённость выражения רָמִים сохранена в основном тексте и пояснена в сноске.
