  terminology: «Бог», «знание» и «судит» точны. «Учить Бога знанию» намеренно близко к еврейской конструкции и допустимо в возвышенно-библейском регистре. Сноску следует привязать непосредственно к слову, которое она поясняет, а не к концу стиха.
