  yaml_path: translation/ot/job/021/028.yaml
  text: For you say[a], ‘Where is the house of the noble man, and where is the tent[b], the dwelling place of the wicked?’
translation:
  language: ru
  text: 'Ведь вы говорите: «Где дом знатного и где шатёр — жилище нечестивых?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза «шатёр — жилище нечестивых» предельно сжата. Её можно также понять как «шатёр, где живут нечестивые»; слово, переведённое как «жилище», в еврейском тексте стоит во множественном числе: «жилища нечестивых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующим рассуждением и естественно вводит слова собеседников Иова.
- source_word: תֹאמְרוּ
  choice: вы говорите
  rationale: Имперфект здесь уместно понимать как настоящее время, выражающее характерное или представленное в рассуждении высказывание.
- source_word: בֵית
  choice: дом
  rationale: Сохраняет основное значение слова и образ жилища, не сужая его до дворца или рода.
- source_word: נָדִיב
  choice: знатного
  rationale: В данном контексте слово обозначает человека высокого общественного положения; русское субстантивированное прилагательное звучит естественно и не привносит значение щедрости.
- source_word: אֹהֶל
  choice: шатёр
  rationale: Сохраняет конкретный древнееврейский образ и подходит для поэтической речи.
- source_word: מִשְׁכְּנוֹת רְשָׁעִים
  choice: жилище нечестивых
  rationale: Передаёт сжатую конструкцию как пояснительное приложение к «шатру»; собирательное единственное по-русски естественно, при этом множественность исходной формы отмечена в сноске.
theological_decisions:
- issue: Отнесение «знатного» и «нечестивых»
  choice: Сохранены две параллельные характеристики без явного отождествления.
  alternative: «Дом знатного нечестивца» или иное прямое отождествление.
  rationale: Еврейский текст ставит «дом знатного» и «шатёр/жилища нечестивых» в параллель, но грамматически не требует однозначно считать их одним и тем же лицом; перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. «Знатный» передаёт общественный статус; «шатёр» сохраняет древнееврейский образ. Тире делает естественной по-русски пояснительную связь в сжатой второй части.
