  text: כַּ/מָּ֤ה נֵר רְשָׁ֘עִ֤ים יִדְעָ֗ךְ וְ/יָבֹ֣א עָלֵ֣י/מוֹ אֵידָ֑/ם חֲ֝בָלִ֗ים יְחַלֵּ֥ק בְּ/אַפּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/021/017.yaml
  text: How often is the lamp of the wicked put out[c][b][a], and does their disaster come upon them? Does he apportion sorrows in his anger?
translation:
  language: ru
  text: Как часто гаснет светильник нечестивых[a][b], приходит на них беда и в своём гневе он распределяет им страдания?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сколько раз гаснет светильник нечестивых…?» Вопрос риторический: Иов ставит под сомнение утверждение, будто нечестивых регулярно постигает такое возмездие.'
    reason: lexical_alternative
  - marker: b
    text: «Светильник» — образ жизни, благополучия или продолжающегося преуспевания человека.
    reason: cultural_note
  - marker: c
    text: 'Или: «распределяет им боли»; еврейское слово может также означать боли, в том числе родовые схватки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: часто ли
  rationale: В данном контексте вопросительное слово касается частоты и вводит риторический вопрос, оспаривающий мысль о том, что нечестивых регулярно постигает возмездие.
- source_word: נֵר
  choice: светильник
  rationale: Сохраняет конкретный еврейский образ, который в литературе мудрости может обозначать жизнь, благополучие или продолжающееся преуспевание человека.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Устоявшееся и уместное для литературы мудрости обозначение людей, живущих вопреки правде и справедливости.
- source_word: יִדְעָךְ
  choice: гаснет
  rationale: Глагол דעך описывает угасание светильника. Русское «гаснет» естественно сочетается с выбранным образом и не уточняет, сам ли светильник угас или был погашен.
- source_word: וְיָבֹא עָלֵימוֹ אֵידָם
  choice: и приходит ли на них беда
  rationale: Оборот передаёт образ бедствия, настигающего людей; «беда» звучит естественно и достаточно широко, не сужая אֵיד до конкретного вида гибели.
- source_word: חֲבָלִים
  choice: муки
  rationale: В данном контексте слово обозначает причиняющие боль страдания, хотя может также передавать боли, в том числе родовые схватки; неоднозначность отмечена в сноске.
- source_word: יְחַלֵּק
  choice: раздаёт
  rationale: Порода пиэль глагола חלק означает разделять, распределять или назначать доли. «Раздаёт» ясно передаёт распределение бедствий и остаётся понятным современному читателю.
- source_word: בְּאַפּוֹ
  choice: в своём гневе
  rationale: אַף в этом обороте означает гнев. Возвратное местоимение естественно связывает гнев с невыраженным субъектом глагола.
theological_decisions:
- issue: Кто подразумевается как субъект глагола יְחַלֵּק
  choice: Субъект не назван; употреблено строчное «он», подразумевающее Бога из контекста.
  alternative: Прямо добавить «Бог» либо использовать прописное «Он».
  rationale: Еврейский текст не называет субъекта, хотя контекст убедительно указывает на Бога. Русский перевод сохраняет эту неявность и не добавляет конфессионально окрашенного написания с прописной буквы.
- issue: Охват начального вопроса כַּמָּה
  choice: Первая и последующая части оформлены как связанные риторические вопросы без добавления ответа.
  alternative: Распространить «как часто» на все три глагольные части или передать смысл как «как редко».
  rationale: Стих риторически ставит под сомнение регулярность возмездия нечестивым, однако прямо не говорит «редко». Раздельное вопросительное оформление сохраняет напряжение и структуру исходного высказывания.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа светильника. Формулировка проста и достойна по тону; риторический характер вопроса и неявность божественного субъекта не устранены.
