base_translation:
  language: en
  yaml_path: translation/ot/job/021/018.yaml
  text: May they be like straw before the wind[a], and like chaff that a storm carries away.
translation:
  language: ru
  text: Пусть они будут словно солома перед ветром и словно мякина, которую уносит буря[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которую буря крадёт»; возможно также: «похищает» или «подхватывает». Еврейский глагол обычно означает «красть» и здесь поэтически передаёт внезапное удаление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Пусть они будут
  rationale: Форма имперфекта допускает здесь волитивный, близкий к юссиву оттенок. «Пусть они будут» передаёт пожелание или представление о подобающей им участи, не превращая высказывание в простое описание.
- source_word: כְּתֶבֶן
  choice: словно солома
  rationale: תֶּבֶן обозначает сухие стебли, солому. «Солома» точнее и естественнее, чем «стерня», которая обычно остаётся укоренённой в поле.
- source_word: לִפְנֵי רוּחַ
  choice: перед ветром
  rationale: Сохранён еврейский пространственный образ чего-либо лёгкого, гонимого силой ветра. Выражение «перед ветром» уместно в возвышенной поэтической речи.
- source_word: וּכְמֹץ
  choice: и словно мякина
  rationale: מֹץ — лёгкие отходы, отделяемые от зерна при веянии. «Мякина» является точным и традиционно понятным русским соответствием этого поэтического образа.
- source_word: גְּנָבַתּוּ
  choice: которую уносит
  rationale: Глагол גנב буквально означает «красть», но в сочетании с бурей поэтически изображает внезапное похищение и удаление мякины. «Уносит» естественно передаёт действие в русском тексте, а буквальный образ сохранён в сноске.
- source_word: סוּפָה
  choice: буря
  rationale: סוּפָה обозначает бурю или сильный вихрь. «Буря» ясно и без неоправданного сужения передаёт значение исходного слова.
theological_decisions:
- issue: Модальность формы יִהְיוּ
  choice: Пожелательно-юссивное «Пусть они будут»
  alternative: Изъявительное «они бывают» или продолжение вопроса «как часто они бывают»
  rationale: Сама форма допускает как имперфектное, так и юссивное прочтение; в данном проектном контексте сохранён волитивный оттенок, отражённый в консультационном слое. Перевод не уточняет, является ли это проклятием, пожеланием справедливой участи или риторическим представлением такой участи.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного поэтического параллелизма. Повтор «словно» делает обе части образа ясными, а «перед ветром» удерживает пространственную метафору еврейского текста.
