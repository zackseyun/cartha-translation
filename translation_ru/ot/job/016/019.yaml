lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Но и теперь
  rationale: Сочетание подчёркивает, что даже в нынешнем тяжёлом положении у Иова остаётся свидетель на небесах; союз «но» естественно передаёт контраст с предшествующим контекстом, не устраняя значения «и теперь».
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» естественно и достаточно торжественно передаёт указательно-эмфатическую частицу, привлекающую внимание к утверждению.
- source_word: בַשָּׁמַיִם
  choice: на небесах
  rationale: Речь идёт о небесной сфере; русское множественное число сохраняет форму и возвышенный библейский образ, оставаясь понятным современному читателю.
- source_word: עֵדִי
  choice: мой свидетель
  rationale: Прямой перевод сохраняет судебную образность речи Иова.
- source_word: וְשָׂהֲדִי
  choice: и тот, кто свидетельствует обо мне
  rationale: Редкое арамеизирующее слово близко по значению к «свидетелю». Описательный перевод передаёт личного свидетеля и избегает необоснованного усиления до «защитника» или «ходатая».
- source_word: בַּמְּרוֹמִים
  choice: в вышних
  rationale: Краткое возвышенное выражение передаёт небесные высоты и сохраняет поэтический параллелизм с «на небесах».
theological_decisions:
- issue: Кто является небесным свидетелем Иова
  choice: 'Оставить лицо неназванным и обозначить лишь его функцию: «мой свидетель» и «тот, кто свидетельствует обо мне».'
  alternative: Уточнить, что это Бог, ангельский посредник либо олицетворённое свидетельство самого Иова.
  rationale: Еврейский текст не устанавливает личность свидетеля однозначно. Функциональный перевод сохраняет судебный образ и богословскую напряжённость.
- issue: Направленность свидетельства в שָׂהֲדִי
  choice: «свидетельствует обо мне»
  alternative: «свидетельствует за меня» или повторное «мой свидетель»
  rationale: Суффикс буквально выражает принадлежность или отношение («мой»), а контекст допускает благоприятное свидетельство в пользу Иова, но не формулирует это предлогом однозначно; «обо мне» сохраняет большую нейтральность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. «Вот» и «в вышних» поддерживают достоинство речи, а описательное «тот, кто свидетельствует обо мне» остаётся ясным и не навязывает личности или роли небесного свидетеля.
