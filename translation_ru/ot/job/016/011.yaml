base_translation:
  language: en
  yaml_path: translation/ot/job/016/011.yaml
  text: God hands me over to the ungodly and throws me into the hands of the wicked[a][b].
translation:
  language: ru
  text: Бог предаёт меня безбожнику и бросает в руки нечестивых[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последний глагол редок и труден для понимания; возможны переводы: «повергает меня» или «швыряет меня» во власть нечестивых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְגִּירֵנִי
  choice: предаёт меня
  rationale: Порода hифиль глагола סגר здесь означает передачу человека во власть другого; «предаёт меня» естественно и сохраняет враждебный оттенок действия.
- source_word: אֵל
  choice: Бог
  rationale: В контексте речи Иова אֵל обозначает Бога, а не просто некоего «сильного».
- source_word: אֶל עֲוִיל
  choice: безбожнику
  rationale: Предлог указывает на того, кому передают Иова, а עֲוִיל обозначает нравственно порочного, нечестивого человека; единственное число оригинала сохранено.
- source_word: וְעַל יְדֵי רְשָׁעִים
  choice: и … в руки нечестивых
  rationale: Образ рук передаёт попадание во власть нечестивых и естественно звучит по-русски.
- source_word: יִרְטֵנִי
  choice: бросает меня
  rationale: Редкий и трудный глагол, вероятно, выражает резкое бросание или низвержение; выбранный вариант сохраняет силу действия, не уточняя направление сверх текста.
theological_decisions:
- issue: Кого обозначает אֵל
  choice: Бог — тот, кто предаёт Иова безбожнику.
  alternative: Некий «сильный» предаёт Иова.
  rationale: В книге Иова אֵל обычно относится к Богу; именно обращённая к Богу жалоба составляет напряжение контекста.
- issue: Соотношение единственного עֲוִיל и множественного רְשָׁעִים
  choice: Сохранены «безбожник» в единственном числе и «нечестивые» во множественном.
  alternative: Обобщить оба обозначения множественным числом.
  rationale: Так воспроизводится грамматическая асимметрия еврейского текста без попытки искусственно отождествить или развести названных противников.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и напряжённая. «Предаёт» употреблено в значении передачи во власть, а не в узком смысле измены. Образ «в руки» сохранён.
