lexical_decisions:
- source_word: פָּעֲרוּ עָלַי בְּפִיהֶם
  choice: разинули на меня рты
  rationale: Глагол פער обозначает широкое раскрытие рта и здесь передаёт враждебную насмешку. Русское «разинули рты» сохраняет яркий образ; עָלַי в данном контексте передано как «на меня».
- source_word: בְּחֶרְפָּה
  choice: с поношением
  rationale: Существительное חֶרְפָּה означает поношение, оскорбление или бесчестье. Выбор сохраняет именную форму и возвышенный поэтический регистр.
- source_word: הִכּוּ לְחָיָי
  choice: били меня по щеке
  rationale: נכה означает наносить удар, а לְחִי — щёку или челюсть. Формулировка естественна по-русски и передаёт унизительный характер нападения; древнееврейская форма допускает собирательное понимание «щеки».
- source_word: יַחַד
  choice: все вместе
  rationale: Слово указывает на совместное, согласованное действие противников.
- source_word: יִתְמַלָּאוּן עָלָי
  choice: ополчились против меня
  rationale: Редкая идиома с התפעל от מלא буквально связана с наполнением, но в контексте, вероятно, описывает совместное сосредоточение враждебных сил. «Ополчились» естественно передаёт враждебное объединение, не сводя выражение к буквальному «наполнились».
