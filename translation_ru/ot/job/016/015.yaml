  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: «сшил» (תפרתי), «вретище» (שק), размещение на/поверх кожи (עלי גלדי), «прах» (בעפר) и буквальный образ «рога» (קרני). Неопределённость глагола ועוללתי не скрыта: «поверг в прах» представляет допустимое понимание унижения/низвержения, а сноска отмечает альтернативы и лексическую трудность.'
