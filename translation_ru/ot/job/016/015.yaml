  text: שַׂ֣ק תָּ֭פַרְתִּי עֲלֵ֣י גִלְדִּ֑/י וְ/עֹלַ֖לְתִּי בֶ/עָפָ֣ר קַרְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/015.yaml
  text: I have sewn sackcloth over my skin[b][a], and thrust my horn into the dust.
translation:
  language: ru
  text: Я сшил вретище поверх своей кожи и поверг[a] в прах свой рог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «низринул»; возможно также: «осквернил свой рог в прахе». Значение еврейского глагола здесь неясно.'
    reason: lexical_alternative
  - marker: b
    text: Рог в еврейской поэзии — образ силы, чести или возвышенного положения.
    reason: cultural_note
lexical_decisions:
- source_word: שַׂק
  choice: вретище
  rationale: Традиционное и точное обозначение грубой ткани или одежды, которую носили в знак скорби; сохраняет возвышенный поэтический регистр.
- source_word: תָּפַרְתִּי
  choice: я сшил
  rationale: Форма Qal perfect 1cs от תפר означает «шить, сшивать»; прошедшее совершенного вида передаёт завершённое действие и его сохраняющийся результат.
- source_word: עֲלֵי גִלְדִּי
  choice: поверх своей кожи
  rationale: 'Сохраняет буквальный телесный образ: вретище находится на коже Иова. «Поверх» естественно передаёт пространственное значение על, не заменяя «кожу» более общим словом «тело».'
- source_word: וְעֹלַלְתִּי
  choice: и поверг
  rationale: Глагол труден и допускает разные толкования. «Поверг» передаёт движение вниз и унижение в сочетании с «в прах», не уточняя образ чрезмерно.
- source_word: בֶעָפָר
  choice: в прах
  rationale: В сочетании с глаголом низвержения русский оборот «повергнуть в прах» естественно выражает направленность и результат унижения.
- source_word: קַרְנִי
  choice: свой рог
  rationale: Сохраняется буквальная еврейская метафора силы, чести или возвышенного положения; замена на «голову», «силу» либо «достоинство» устранила бы поэтический образ.
theological_decisions:
- issue: Метафора рога
  choice: Сохранить в основном тексте «свой рог»
  alternative: «свою силу», «своё достоинство» или «свою голову»
  rationale: Образ рога выражает силу, честь или возвышение, теперь поверженные в прах. Его сохранение передаёт напряжённость и конкретность еврейской поэзии, а краткое пояснение вынесено в сноску.
- issue: Неясное значение וְעֹלַלְתִּי
  choice: Передать как «поверг»
  alternative: «осквернил», «низринул», «вдавил»
  rationale: Точная нюансировка глагола спорна. «Поверг» согласуется с образом праха и унижения, а сноска честно сохраняет лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, уместной для поэтического плача. «Вретище» и «прах» сохраняют библейскую образность, оставаясь понятными в контексте; синтаксис сделан ясным и естественным.
