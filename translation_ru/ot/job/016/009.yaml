base_translation:
  language: en
  yaml_path: translation/ot/job/016/009.yaml
  text: His anger has torn me and hated me[a]; he gnashes his teeth at me; my adversary sharpens his eyes against me.
translation:
  language: ru
  text: Гнев его растерзал меня, и он возненавидел меня; он скрежещет на меня зубами; враг мой устремляет на меня острый взгляд[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «враг мой точит на меня глаза». Необычная еврейская метафора изображает пристальный, враждебный взгляд.'
    reason: Сохранение буквального образа и пояснение лексической метафоры.
lexical_decisions:
- source_word: אַפּוֹ
  choice: Гнев его
  rationale: אַף буквально означает «нос», а в данном поэтическом контексте метонимически — гнев. Русское «гнев» естественно и сохраняет силу образа.
- source_word: טָרַף
  choice: растерзал меня
  rationale: Глагол изображает разрывание добычи хищником. «Растерзал» передаёт этот сильный хищнический образ; подразумеваемое дополнение «меня» ясно из контекста и необходимо для естественного русского синтаксиса.
- source_word: וַיִּשְׂטְמֵנִי
  choice: и он возненавидел меня
  rationale: שׂטם выражает ненависть или враждебность. «Возненавидел» прямо передаёт значение, не добавляя действия, которого нет в лексеме.
- source_word: חָרַק עָלַי בְּשִׁנָּיו
  choice: он скрежещет на меня зубами
  rationale: Фраза описывает скрежет зубами от ярости. Настоящее время сохраняет живость поэтической картины, а «на меня» передаёт враждебную направленность עָלַי.
- source_word: צָרִי
  choice: враг мой
  rationale: צַר обозначает враждебного противника. «Враг» естественно в русском поэтическом плаче и не уточняет, идёт ли речь о человеческом, судебном или военном противнике.
- source_word: יִלְטוֹשׁ עֵינָיו לִי
  choice: устремляет на меня острый взгляд
  rationale: לָטַשׁ буквально значит «точить, заострять», но применительно к глазам создаёт метафору пристального враждебного взгляда. Перевод сохраняет образ остроты в понятной современной русской форме; буквальная необычность отмечена в сноске.
theological_decisions:
- issue: К кому относятся враждебные действия в плаче Иова
  choice: Сохранены местоимения мужского рода и обозначение «враг» без прямого отождествления действующего лица.
  alternative: Назвать действующее лицо Богом, человеком-врагом либо представить образ как намеренное слияние этих значений.
  rationale: Еврейский стих использует формы мужского рода единственного числа, но в самом стихе прямо не называет действующее лицо. Перевод не снимает богословского напряжения и не уточняет референта сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Хищнический образ передан сильным глаголом «растерзал», а необычная метафора заострённых глаз — естественным выражением в основном тексте и буквальным вариантом в сноске.
