  yaml_path: translation/ot/job/016/013.yaml
  text: His archers surround me[a]; he splits open my kidneys and does not spare[c][b]; he pours out my gall on the ground.
translation:
  language: ru
  text: Его лучники окружают меня[a]; он рассекает мои почки[b] и не щадит, и изливает мою желчь[c] на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его великие» или «его начальники». Еврейская форма трудна; значение «лучники» соответствует образам нападения в этом стихе и контексте.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «мои почки» — внутренние органы, которые в древнееврейской образности также могли обозначать глубины человеческого естества.'
    reason: cultural_note
  - marker: c
    text: 'Или: «мою горечь»; однако телесное значение «желчь» лучше соответствует жестокой анатомической образности стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסֹבּוּ
  choice: окружают
  rationale: Форма qal от סבב обозначает окружение при враждебном нападении; настоящее время естественно передаёт живость поэтической картины.
- source_word: רַבָּיו
  choice: его лучники
  rationale: Еврейская форма трудна и допускает связь со значением «великие» или «начальники», однако традиционное контекстуальное понимание «лучники» соответствует образам вооружённого нападения.
- source_word: יְפַלַּח
  choice: рассекает
  rationale: Piel от פלח выражает жестокое рассечение или пронзание; «рассекает» сохраняет силу образа и звучит естественно по-русски.
- source_word: כִּלְיוֹתַי
  choice: мне почки
  rationale: Слово буквально означает почки; конкретный анатомический образ сохранён, а дательный «мне» делает русскую фразу естественной.
- source_word: וְלֹא יַחְמֹל
  choice: и не щадит
  rationale: Кратко и точно передаёт отсутствие жалости в контексте насилия.
- source_word: יִשְׁפֹּךְ
  choice: изливает
  rationale: Глагол שפך означает «лить, изливать»; выбор сохраняет яркий физический образ и возвышенный поэтический регистр.
- source_word: מְרֵרָתִי
  choice: мою желчь
  rationale: В контексте почек и рассечения слово естественнее понимать как телесную желчь, а не отвлечённую горечь.
theological_decisions:
- issue: Антропологическая образность в поэзии страдания
  choice: Сохранить конкретные телесные образы «почки» и «желчь» в основном тексте.
  alternative: Передать их отвлечённо как «внутренность» и «горечь».
  rationale: Так сохраняются резкость и физиологическая конкретность еврейской поэзии без смягчающего богословского истолкования.
- issue: Неоднозначность подлежащего при переходе от множественного числа к единственному
  choice: Передать «его лучники» во множественном числе, а последующие действия — с подлежащим «он».
  alternative: Отнести все действия к лучникам или заменить «лучников» на «великих/начальников».
  rationale: Числовой переход присутствует в еврейском тексте; перевод сохраняет напряжение между орудиями нападения и главным действующим лицом, не устраняя его толкованием.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и резкой телесной образности древнееврейской поэзии. Синтаксис сделан ясным, но трудное чтение רַבָּיו и возможная переносность анатомических терминов отмечены в сносках.
