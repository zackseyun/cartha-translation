  text: O earth[a], do not cover my blood[c][b], and let there be no resting place for my cry.
translation:
  language: ru
  text: Земля, не скрывай моей крови[a][b], да не будет места для моего вопля[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моего кровопролития». Буквально в еврейском тексте: «моей крови»; в данном контексте может подразумеваться несправедливо пролитая кровь.'
    reason: lexical_alternative
  - marker: b
    text: Этот образ напоминает о крови, взывающей из земли о справедливости; ср. Бытие 4:10.
    reason: cross_reference
  - marker: c
    text: 'Или: «мой крик». Еврейское слово может обозначать крик бедствия, который одновременно служит призывом о помощи и справедливости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: О земля
  rationale: Контекст и форма глагола второго лица женского рода указывают на прямое обращение. «Земля» сохраняет широкий поэтический образ лучше, чем более узкое «страна».
- source_word: אַל תְּכַסִּי
  choice: не скрой
  rationale: Отрицательная частица אַל с данной глагольной формой выражает настоятельное запрещение или пожелание. «Не скрой» естественно передаёт обращение к земле и сохраняет конкретный образ сокрытия крови.
- source_word: דָמִי
  choice: моей крови
  rationale: Буквальное значение — «моя кровь». В контексте возможен смысл невинно пролитой крови, однако основной текст сохраняет образ и его неоднозначность.
- source_word: וְאַל יְהִי מָקוֹם
  choice: и пусть… нигде не найдёт покоя
  rationale: Буквальная конструкция означает «и да не будет места». Русская формулировка естественно передаёт отрицательное пожелание и контекстуальный образ отсутствия места, где крик мог бы остановиться или утихнуть.
- source_word: לְזַעֲקָתִי
  choice: мой вопль
  rationale: זְעָקָה обозначает крик бедствия, нередко одновременно являющийся призывом о помощи или справедливости. «Вопль» сохраняет силу поэтической речи и не сводит смысл только к судебной жалобе.
theological_decisions:
- issue: Намёк на невинную кровь, взывающую о справедливости
  choice: Сохранены конкретные образы «моя кровь» и «мой вопль», а связь между ними не разъясняется в основном тексте.
  alternative: Перевести как «моя пролитая кровь» или «мой призыв о справедливости».
  rationale: Стих, вероятно, отсылает к библейскому образу крови, взывающей из земли, но еврейский текст сохраняет поэтическое напряжение между кровью, воплем бедствия и требованием оправдания. Более явное истолкование вынесено в примечания.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Обращение «О земля» и форма «не скрой» поддерживают торжественность речи; оборот «нигде не найдёт покоя» естественно передаёт образ отсутствия места успокоения для вопля.
