  text: If I speak[a], my pain is not eased; and if I refrain, what goes away from me?
translation:
  language: ru
  text: Если я буду говорить, боль моя не ослабеет; если же умолкну, что от меня уйдёт?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что покинет меня?» Еврейская фраза кратка; возможно, подразумевается: «что из моей боли уйдёт от меня?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֲדַבְּרָה
  choice: Если я заговорю
  rationale: Условное אִם передано как «если», а форма глагола — естественным для русского условного высказывания совершенным видом, без добавления модального оттенка.
- source_word: לֹא יֵחָשֵׂךְ כְּאֵבִי
  choice: боль моя не ослабеет
  rationale: Нифаль от חשׂך буквально выражает удерживание или сдерживание; применительно к боли русский глагол «ослабеть» естественно передаёт контекстуальный смысл уменьшения, не сужая боль до физической или душевной.
- source_word: וְאַחְדְּלָה
  choice: если же умолкну
  rationale: חדל означает прекратить или воздержаться; параллель с «заговорю» показывает, что речь идёт о прекращении речи. «Умолкну» кратко и естественно сохраняет противопоставление.
- source_word: מַה מִנִּי יַהֲלֹךְ
  choice: что от меня уйдёт?
  rationale: Сочетание הלך с מן допускает значение «уйти, удалиться от». Вопрос оставлен таким же кратким и эллиптическим, как в еврейском тексте, без явного добавления слова «боль».
