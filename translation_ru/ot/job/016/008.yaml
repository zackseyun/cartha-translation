  source_fidelity: 'Перевод точно передаёт ключевые элементы еврейского текста: прямое обращение во 2-м лице («Ты сморщил меня»), свидетельское значение результата истощения, персонифицированную «исхудалость», её восстание против говорящего и глагол ענה в основном значении «отвечать». Безличное «это стало свидетельством» уместно сохраняет синтаксическую и референциальную неясность оригинала, не навязывая отнесения слова «свидетель» к Богу.'
