  text: וַֽ֭/תִּקְמְטֵ/נִי לְ/עֵ֣ד הָיָ֑ה וַ/יָּ֥קָם בִּ֥/י כַ֝חֲשִׁ֗/י בְּ/פָנַ֥/י יַעֲנֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/008.yaml
  text: You have shriveled me up—it has become a witness; my gauntness rises up against me and answers to my face.
translation:
  language: ru
  text: Ты сморщил меня — это стало свидетельством; моя исхудалость восстаёт против меня и отвечает мне в лицо.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקְמְטֵנִי
  choice: Ты сморщил меня
  rationale: Редкий глагол קמט означает «сморщить, сделать съёжившимся». Формулировка сохраняет прямое обращение к Богу и образ физического истощения.
- source_word: כַחֲשִׁי
  choice: моя исхудалость
  rationale: В данном контексте форма, вероятнее всего, обозначает исхудавшее состояние Иова; выбранное слово передаёт телесную измождённость, которая служит видимым свидетельством против него.
- source_word: יַעֲנֶה
  choice: отвечает
  rationale: 'Базовое значение ענה — «отвечать». Сохранён судебно-персонифицированный образ: исхудалость встаёт против Иова и отвечает ему прямо в лицо.'
theological_decisions:
- issue: Кто назван свидетелем
  choice: Безличное «это стало свидетельством» соотносится со сморщенным, истощённым состоянием Иова.
  alternative: «Ты стал свидетелем» или явное отнесение свидетельства к Богу.
  rationale: Форма הָיָה допускает невыраженный субъект, а ближайший контекст связывает свидетельство с видимым состоянием Иова. Перевод не вводит дополнительного богословского уточнения.
- issue: Судебный оттенок последней строки
  choice: Сохранено буквальное «отвечает мне в лицо».
  alternative: «свидетельствует против меня» или «обличает меня в лицо».
  rationale: Так передаётся обычное значение глагола и сохраняется напряжённая неоднозначность персонифицированного телесного состояния в судебной сцене.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Параллелизм и резкая судебная образность еврейского текста сохранены; местоимение «Ты» обозначает прямое обращение к Богу.
