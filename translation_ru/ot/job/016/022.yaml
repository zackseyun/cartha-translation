  yaml_path: translation/ot/job/016/022.yaml
  text: For a few years will come[b][a], and I will go on the path from which I will not return.
translation:
  language: ru
  text: Ибо настанут считанные годы[a], и я пойду путём, с которого не вернусь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «годы числа», то есть годы, немногочисленные или ограниченные по числу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и я пойду дорогой, по которой не возвращаются». Речь идёт о необратимом уходе к смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для предыдущих слов Иова; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: שְׁנוֹת מִסְפָּר
  choice: лишь несколько лет
  rationale: Буквально «годы числа» — идиома, обозначающая немногочисленные, ограниченные по числу годы. Частица «лишь» сохраняет акцент на краткости.
- source_word: יֶאֱתָיוּ
  choice: пройдёт
  rationale: Еврейский глагол буквально означает «придут, наступят». По-русски о сроке естественно сказать «пройдёт несколько лет»; временная перспектива и краткость сохраняются, а буквальный образ отмечен в сноске.
- source_word: וְאֹרַח
  choice: и я пойду путём
  rationale: אֹרַח — «путь, дорога»; выбран «путь», чтобы сохранить конкретную метафору движения. Союз передан в естественной русской структуре.
- source_word: לֹא אָשׁוּב
  choice: с которого не вернусь
  rationale: Буквально «не вернусь». Относительная конструкция делает связь с «путём» ясной по-русски, не устраняя образ необратимого ухода.
- source_word: אֶהֱלֹךְ
  choice: я пойду
  rationale: Простая форма глагола «идти» выражает предстоящее движение; «пойду» точно и естественно передаёт её в контексте.
theological_decisions:
- issue: Обозначает ли путь смерть прямо
  choice: Сохранить метафору пути без слова «смерть» в основном тексте
  alternative: 'Передать явно: «уйду в смерть» или пояснить смерть в тексте'
  rationale: Контекст указывает на необратимый уход к смерти, однако еврейский текст выражает это метафорически. Явное добавление устранило бы образ и сделало толкование частью перевода.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Пройдёт лишь несколько лет» звучит естественно для обычного читателя; метафора пути и подразумеваемая смерть сохранены без конфессионального уточнения.
