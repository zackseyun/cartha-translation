    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹכַח
  choice: Пусть он вступится
  rationale: 'Форма от יכח в данном контексте имеет судебно-правовой оттенок: вести дело, доказывать правоту, рассуживать или выступать посредником. «Вступится» естественно передаёт действие в чью-либо защиту и соответствует бенефактивному לְ, не сводя смысл к нейтральному арбитражу.'
- source_word: לְגֶבֶר עִם אֱלוֹהַּ
  choice: за человека перед Богом
  rationale: לְ указывает на того, в чью пользу ведётся дело; עִם буквально значит «с», но в судебном контексте обозначает другую сторону тяжбы. Русское «перед Богом» ясно и естественно выражает обращение к Богу в защиту человека, а буквальная альтернатива отмечена в сноске.
- source_word: וּבֶן אָדָם
  choice: как сын человеческий
  rationale: בן אדם буквально означает «сын человеческий» и здесь является обычным обозначением человека, параллельным גבר. Сравнительное «как» восполняет эллипсис поэтической строки.
- source_word: לְרֵעֵהוּ
  choice: за своего ближнего
  rationale: Повторение «за» сохраняет параллель с לְגֶבֶר. רֵעַ может означать ближнего, друга или товарища; «ближний» сохраняет широту значения.
theological_decisions:
- issue: Возможное мессианское прочтение выражения «сын человеческий»
  choice: Сохранить выражение со строчной буквы и пояснить его обычное человеческое значение.
  alternative: Перевести «человек» либо оформить «Сын Человеческий» как титул.
  rationale: В непосредственном контексте בן אדם — общееврейское обозначение человека и поэтическая параллель к גבר. Заглавные буквы внесли бы в стих более позднее титульное значение, которого сам текст не требует.
- issue: Характер желаемого судебного действия
  choice: Передать как выступление в защиту человека, сохранив иные юридические оттенки в сноске.
  alternative: Представить действующее лицо как нейтрального посредника между человеком и Богом.
  rationale: Параллельные конструкции с לְ естественно допускают действие в пользу человека и ближнего. Вместе с тем многозначность יכח не позволяет полностью исключить смысл разбора или решения тяжбы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Эллипсис во второй половине строки сохранён с помощью тире; строчные буквы предотвращают необоснованное титульное прочтение.
