  text: פָּנַ֣/י חמרמרה מִנִּי בֶ֑כִי וְ/עַ֖ל עַפְעַפַּ֣/י צַלְמָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/016.yaml
  text: My face is red from weeping[a], and on my eyelids is deep darkness.
translation:
  language: ru
  text: 'Моё лицо покраснело от плача,

    и на моих веках — глубокая тьма.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тень смерти». Еврейское слово может обозначать как тень смерти, так и глубокую, непроглядную тьму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנַי
  choice: моё лицо
  rationale: Форма с суффиксом первого лица обычно обозначает лицо как единое целое; это естественная и точная передача по-русски.
- source_word: חמרמרה
  choice: покраснело
  rationale: Редкий глагол описывает болезненно изменившийся вид лица вследствие сильного переживания; в контексте плача «покраснело» ясно передаёт наиболее вероятный видимый эффект, не уточняя физиологию сверх текста.
- source_word: מִנִּי בֶכִי
  choice: от плача
  rationale: Предлог выражает причину состояния лица, а существительное сохраняет возвышенный поэтический регистр.
- source_word: וְעַל
  choice: и на
  rationale: Прямо и естественно вводит вторую параллельную строку.
- source_word: עַפְעַפַּי
  choice: на моих веках
  rationale: Еврейское слово конкретно обозначает веки, поэтому более общее «глаза» не используется.
- source_word: צַלְמָוֶת
  choice: глубокая тьма
  rationale: В поэтическом древнееврейском слово может означать непроглядную, глубокую тьму, хотя традиционно понимается также как «тень смерти»; основная формулировка сохраняет образ мрака на веках.
