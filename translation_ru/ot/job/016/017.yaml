lexical_decisions:
- source_word: עַל
  choice: хотя
  rationale: Предлог עַל допускает разные синтаксические отношения. В контексте сетования Иова уступительное «хотя» естественно связывает его страдание с заявлением о невиновности, не устраняя возможного причинного прочтения.
- source_word: לֹא חָמָס
  choice: нет насилия
  rationale: חָמָס обозначает насилие, неправду или злодеяние. «Нет насилия» близко передаёт прямой смысл и сохраняет более широкий нравственный оттенок.
- source_word: בְּכַפָּי
  choice: в моих руках
  rationale: Буквально речь идёт о ладонях или руках Иова; образ указывает на его поступки и личную вину. Формулировка сохраняет конкретность еврейского выражения.
- source_word: וּתְפִלָּתִי
  choice: и молитва моя
  rationale: תְּפִלָּה — обычное обозначение молитвы. Порядок слов придаёт фразе достоинство, оставаясь понятным в современном русском языке.
- source_word: זַכָּה
  choice: чиста
  rationale: Прилагательное означает «чистая, незапятнанная». «Чиста» естественно сочетается с молитвой и передаёт нравственный смысл, не превращая слова Иова в заявление об абсолютной безгрешности.
theological_decisions:
- issue: Заявление Иова о собственной невиновности
  choice: Передать как конкретное утверждение об отсутствии насилия в его поступках и чистоте его молитвы.
  alternative: Понимать слова как заявление Иова о полной и абсолютной безгрешности.
  rationale: Непосредственно стих защищает Иова от предположения, будто его страдания вызваны совершённым им насилием. Перевод сохраняет силу его самооправдания, но не расширяет его до не выраженного здесь учения о полном нравственном совершенстве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Конкретный образ рук сохранён; формулировка остаётся ясной для обычного читателя.
