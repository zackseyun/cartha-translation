  text: I have heard many such things[a]; all of you are miserable comforters.
translation:
  language: ru
  text: Много такого я уже слышал; все вы — тягостные утешители.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «утешители тяготы (беды, страдания)». Еврейский оборот краток и допускает также смысловые оттенки: «жалкие утешители» или «утешители, приносящие тяготу».'
    reason: Лексическая альтернатива; сохранение неоднозначной смысловой связи в конструкции מְנַחֲמֵי עָמָל.
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: я уже слышал
  rationale: Перфект qal, 1-е лицо единственного числа. Частица «уже» естественно передаёт накопленный к настоящему моменту опыт Иова, не превращая форму в строгое указание на однократное прошлое событие.
- source_word: כְאֵלֶּה רַבּוֹת
  choice: много подобного
  rationale: Сочетание сравнительной частицы с указательным местоимением означает «подобное этому», а רַבּוֹת указывает на множество подразумеваемых высказываний или вещей. Формулировка кратка и сохраняет пренебрежительный оттенок.
- source_word: מְנַחֲמֵי
  choice: утешители
  rationale: 'Субстантивированное причастие от נחם. Слово сохраняет иронию: друзья намерены утешать Иова, но их речи усиливают его страдание.'
- source_word: עָמָל
  choice: от которых лишь страдание
  rationale: עָמָל может обозначать тяготу, беду, мучение или страдание. В сочетании с «утешителями» русская описательная конструкция естественно передаёт мысль о том, что их утешение само причиняет страдание, при этом неоднозначность еврейского оборота отмечена в сноске.
- source_word: כֻּלְּכֶם
  choice: все вы
  rationale: Передаёт обращение ко всей группе и сохраняет эмфатическое положение выражения.
