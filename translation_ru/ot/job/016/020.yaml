lexical_decisions:
- source_word: מְלִיצַי
  choice: мои насмешники
  rationale: В контексте жалобы Иова слово естественно понимать как обозначение тех, кто насмехается или глумится над ним. Иное, положительное понимание сохраняется в сноске.
- source_word: רֵעָי
  choice: мои друзья
  rationale: 'Обычное значение רֵעַ — «друг, товарищ». Слово «друзья» естественно по-русски и подчёркивает горький контраст: те, кто должен поддерживать Иова, стали его насмешниками.'
- source_word: אֶל אֱלוֹהַ
  choice: к Богу
  rationale: Предлог אֶל передаёт направленность, а אֱלוֹהַ — характерное для книги Иова обозначение Бога в единственном числе. «К Богу» сохраняет направление плача.
- source_word: דָּלְפָה
  choice: изливает слёзы
  rationale: Глагол буквально описывает капание или истечение жидкости. В сочетании с «мой глаз» выражение «изливает слёзы» естественно передаёт образ непрерывного плача.
- source_word: עֵינִי
  choice: мой глаз
  rationale: В еврейском тексте употреблено единственное число; оно сохранено ради точности и выразительного поэтического образа.
theological_decisions:
- issue: Роль друзей Иова в значении מְלִיצַי
  choice: «насмешники» в основном тексте
  alternative: «заступники», «посредники» или «толкователи»
  rationale: Непосредственный контекст жалобы поддерживает отрицательный смысл, однако лексическая неоднозначность не позволяет безоговорочно исключить положительное понимание; поэтому оно отмечено в сноске без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконизма и поэтического параллелизма еврейского текста. Инверсия «к Богу мой глаз изливает слёзы» подчёркивает направленность плача и сохраняет единственное число слова «глаз».
