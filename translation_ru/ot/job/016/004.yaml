base_translation:
  language: en
  yaml_path: translation/ot/job/016/004.yaml
  text: I too could speak like you[a], if your soul were in place of my soul[c][b]; I could heap up words against you and shake my head at you.
translation:
  language: ru
  text: Я тоже мог бы говорить, как вы, если бы вы были на моём месте[a]; я мог бы нагромождать против вас слова[b] и качать головой, глядя на вас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если бы ваша жизнь (или душа) была вместо моей жизни (или души)». Еврейское נֶפֶשׁ может обозначать душу, жизнь, самого человека или личность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нанизывать против вас слова»; еврейский глагол выражает соединение, связывание или нагромождение слов.'
    reason: lexical_alternative
  - marker: c
    text: Качание головой здесь — жест насмешки или презрения.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Я тоже
  rationale: Передаёт подчёркнутое самоотнесение Иова и его мысль о взаимной перемене ролей.
- source_word: כָכֶם אֲדַבֵּרָה
  choice: мог бы говорить, как вы
  rationale: Условно-потенциальная форма естественно выражена русской конструкцией «мог бы»; сравнение относится к манере речи друзей.
- source_word: לוּ יֵשׁ נַפְשְׁכֶם תַּחַת נַפְשִׁי
  choice: если бы вы оказались на моём месте
  rationale: נֶפֶשׁ здесь обозначает человека, его самого или его жизнь; русский оборот ясно и естественно передаёт гипотетическую перемену положений, не навязывая антропологического смысла слову «душа».
- source_word: אַחְבִּירָה עֲלֵיכֶם בְּמִלִּים
  choice: я мог бы сплетать против вас слова
  rationale: Глагол חָבַר означает соединять или связывать; «сплетать слова» сохраняет образ составления речи и её направленность против собеседников.
- source_word: וְאָנִיעָה עֲלֵיכֶם בְּמוֹ רֹאשִׁי
  choice: и качать головой, глядя на вас
  rationale: Передаёт физический жест, направленный на друзей; его насмешливое или презрительное значение пояснено в сноске, а не встроено в перевод.
theological_decisions:
- issue: Значение נֶפֶשׁ в условии о перемене мест
  choice: вы оказались на моём месте
  alternative: ваши души были бы вместо моей души
  rationale: В данном контексте речь идёт о людях и их положении, а не о противопоставлении телу нематериальной души. Идиоматический перевод сохраняет смысл без привнесения определённой антропологии.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Условная конструкция звучит естественно; необычный образ «сплетать слова» сознательно сохраняет конкретность еврейского глагола, а культурное значение жеста вынесено в сноску.
