  yaml_path: translation/ot/job/016/012.yaml
  text: I was at ease[a], but he shattered me; he seized me by my neck and dashed me to pieces; he set me up for himself as a target.
translation:
  language: ru
  text: Я жил спокойно, но он растерзал меня[a]; схватил меня за загривок и разбил вдребезги; поставил меня себе мишенью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкий глагол, переведённый как «растерзал меня», можно также понять как «яростно потряс меня» или «разорвал меня».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֵו
  choice: жил спокойно
  rationale: Прилагательное обозначает состояние покоя и безмятежности; по-русски естественнее передать составным сказуемым, сохранив контраст с последующим насилием.
- source_word: וַיְפַרְפְּרֵנִי
  choice: растерзал меня
  rationale: Редкий и трудный глагол описывает резкое насильственное разрушение прежнего благополучия Иова. «Растерзал» передаёт силу образа, а лексическая неопределённость отмечена в сноске.
- source_word: וְאָחַז
  choice: схватил
  rationale: Глагол означает крепко взять, ухватить; «схватил» естественно выражает враждебное действие.
- source_word: בְּעָרְפִּי
  choice: за загривок
  rationale: Существительное указывает на заднюю часть шеи. «За загривок» точно и наглядно передаёт место захвата.
- source_word: וַיְפַצְפְּצֵנִי
  choice: разбил вдребезги
  rationale: Редкий интенсивный глагол выражает сокрушение, раздробление. Русское выражение сохраняет усиленный образ полного разрушения.
- source_word: וַיְקִימֵנִי
  choice: поставил меня
  rationale: Каузативная форма קום означает заставить стоять или установить; в сочетании с образом мишени естественно «поставил меня».
- source_word: לוֹ
  choice: перед собой
  rationale: Местоименный элемент связывает мишень с нападающим. В русском «перед собой» естественно описывает положение мишени относительно стрелка, не устраняя образ.
- source_word: לְמַטָּרָה
  choice: мишенью
  rationale: Существительное означает цель или мишень для нападения; творительный падеж после «поставил» даёт ясную и лаконичную русскую конструкцию.
theological_decisions:
- issue: К кому относится субъект третьего лица мужского рода
  choice: Сохранено местоимение «он» без прямого называния субъекта.
  alternative: Назвать Бога подразумеваемым нападающим либо понять субъект как неопределённого противника.
  rationale: В речи Иова контекст подразумевает Бога, однако в самом стихе употреблены лишь глагольные формы третьего лица. Перевод сохраняет эту риторическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; речь выразительная и суровая, но понятная обычному читателю. Синтаксический параллелизм еврейского стиха и последовательность образов насилия сохранены.
