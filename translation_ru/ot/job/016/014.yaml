- source_word: פֶרֶץ עַל־פְּנֵי פָרֶץ
  choice: пролом за проломом
  rationale: Повтор существительного פֶרֶץ сохранён, а конструкция עַל־פְּנֵי передана как последовательность непрерывных сокрушительных действий.
- source_word: יָרֻץ עָלַי
  choice: устремляется на меня
  rationale: רוץ буквально означает «бежать», но здесь описывает стремительное враждебное нападение; «устремляется» сохраняет быстроту и агрессивную направленность без излишнего уточнения.
- source_word: כְגִבּוֹר
  choice: как воин
  rationale: גִּבּוֹר может обозначать сильного человека, витязя или воина. В контексте стремительного нападения «воин» наиболее ясно передаёт военный образ.
