  text: אַךְ עַתָּ֥ה הֶלְאָ֑/נִי הֲ֝שִׁמּ֗וֹתָ כָּל עֲדָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/016/007.yaml
  text: Surely now he has worn me out[b][a]; you have devastated all my company.
translation:
  language: ru
  text: Но теперь он изнурил меня[a]; ты разорил весь мой круг людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «довёл меня до изнеможения», «утомил меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё моё собрание», «всю мою общину». Еврейское слово может обозначать собравшийся вокруг Иова круг людей или близких ему домочадцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Частица отмечает резкий переход к нынешнему бедствию Иова. В данном контексте русское «но» естественно передаёт поворот речи, не придавая частице сомнительного ограничительного значения.
- source_word: עַתָּה
  choice: теперь
  rationale: Сохраняет временное указание и непосредственность плача.
- source_word: הֶלְאָנִי
  choice: он изнурил меня
  rationale: Форма от לאה обозначает доведение до усталости или изнеможения; прошедшее совершенного вида естественно передаёт результативное действие. Неявный субъект 3-го лица мужского рода сохранён как «он» и не отождествлён прямо с Богом.
- source_word: הֲשִׁמּוֹתָ
  choice: ты опустошил
  rationale: Каузативное значение שמם — «сделать пустынным, опустошить». Форма 2-го лица мужского рода передана прямо, чтобы сохранить смену лица.
- source_word: כָּל
  choice: всё
  rationale: Передаёт полный охват следующего собирательного понятия.
- source_word: עֲדָתִי
  choice: моё окружение
  rationale: עֵדָה обычно означает собрание или общину, однако здесь может обозначать круг близких Иова, его домочадцев или людей вокруг него. «Окружение» естественно в современном русском и сохраняет собирательный смысл; более буквальные варианты вынесены в примечание.
theological_decisions:
- issue: Смена грамматического лица между двумя глаголами
  choice: 'Сохранить: «он изнурил меня; ты опустошил…»'
  alternative: Согласовать оба глагола во 2-м лице («ты изнурил… ты опустошил…») либо в 3-м лице.
  rationale: Масоретский текст действительно переходит от 3-го лица мужского рода ко 2-му. Перевод не сглаживает эту напряжённость и оставляет открытой возможность риторического перехода от речи о Боге к прямому обращению к Нему.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Сохранены резкость образа, лаконизм и намеренно не сглаженная смена лица; «окружение» выбрано вместо церковно окрашенной «общины» в основном тексте.
