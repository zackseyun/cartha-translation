    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: ли... ли... или
  rationale: Троекратное אִם обозначает ряд альтернатив, а не обычное условие; русская конструкция «ли... ли... или» естественно передаёт эту структуру.
- source_word: לְשֵׁבֶט
  choice: для наказания
  rationale: Буквально שֵׁבֶט — «жезл, розга»; здесь слово метонимически указывает на кару или вразумляющее наказание. Сноска сохраняет буквальный образ и возможность дисциплинарного оттенка.
- source_word: לְאַרְצוֹ
  choice: для Своей земли
  rationale: אֶרֶץ допускает значения «земля, страна»; притяжательный суффикс 3-го лица относится к Богу. «Своя земля» сохраняет формулировку оригинала, не сводя её ни ко всей планете, ни к определённой стране.
- source_word: לְחֶסֶד
  choice: ради милости
  rationale: חֶסֶד может обозначать милость, доброту и верную любовь. В данном контексте «милость» звучит естественно и сохраняет благотворный смысл, не навязывая явно заветное прочтение.
- source_word: יַמְצִאֵהוּ
  choice: Он посылает её
  rationale: Хифиль от מצא здесь означает, что Бог заставляет упомянутое погодное явление прийти или достичь назначенной цели. «Посылает её» естественно по-русски и сохраняет женский референт из ближайшего контекста — тучу; возможные более буквальные передачи отмечены в сноске.
theological_decisions:
- issue: Смысл трёх оборотов с אִם и לְ
  choice: 'Перечисляются возможные цели, ради которых Бог направляет тучу: наказание, благо Своей земли или милость.'
  alternative: Обороты могут обозначать не цели, а направления или места назначения; «жезл» может подразумевать именно карательный суд.
  rationale: Контекст описывает Божье управление тучами и погодой. Перевод сохраняет как суровую, так и благотворную стороны этого управления, не сводя стих только к суду или только к благословению.
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный без архаизации. Заглавные местоимения «Своей» и «Он» ясно указывают на Бога. Женское «её» связывает стих с тучей (עָב) в предшествующем контексте; сноска отмечает референциальную и глагольную неоднозначность.
