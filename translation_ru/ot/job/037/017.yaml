lexical_decisions:
- source_word: אֲשֶׁר
  choice: ты, чьи
  rationale: Относительная частица продолжает обращённый к Иову вопрос и вводит характеристику подразумеваемого адресата. Русское «ты, чьи» сохраняет относительную конструкцию и связь с контекстом.
- source_word: בְּגָדֶיךָ
  choice: твои одежды
  rationale: בגד означает одежду или одеяние. «Одежды» соответствует возвышенному поэтическому регистру, оставаясь понятным современному читателю.
- source_word: חַמִּים
  choice: становятся горячими
  rationale: Прилагательное обозначает жар или тепло. Глагольная формулировка естественно передаёт по-русски ощущение одежды в условиях нарастающего зноя, не ослабляя значения до простого «тёплые».
- source_word: בְּהַשְׁקִט
  choice: когда … замирает
  rationale: Инфинитив от שקט означает быть спокойным, тихим, неподвижным; предлог ב придаёт временное значение. «Замирает» естественно описывает наступление безветрия или неподвижности в поэтическом метеорологическом контексте.
- source_word: אֶרֶץ
  choice: земля
  rationale: Слово может означать как землю вообще, так и страну или сушу. Здесь широкое «земля» лучше соответствует описанию атмосферного явления.
- source_word: מִדָּרוֹם
  choice: от южного ветра
  rationale: דָּרוֹם буквально обозначает юг или южную сторону. В данном метеорологическом контексте подразумевается несущий зной южный ветер; это уточнение вынесено также в примечание, чтобы сохранить буквальную альтернативу.
