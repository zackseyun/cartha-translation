base_translation:
  language: en
  yaml_path: translation/ot/job/037/010.yaml
  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: ru
  text: От дыхания Бога образуется лёд[a], и водная ширь затвердевает[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дыханием Бога образуется лёд». Еврейский предлог может указывать как на источник («от»), так и на средство («посредством»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «водный простор становится твёрдым»; также возможно: «ширь вод застывает». Поэтическое еврейское выражение описывает воды как затвердевшие, словно отлитые.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: От дыхания
  rationale: נִשְׁמָה означает «дыхание», а предлог מִן здесь допускает значение источника или средства. Основной текст передаёт источник; значение средства отмечено в сноске.
- source_word: אֵל
  choice: Бога
  rationale: אֵל — обычное наименование Бога; контекст не требует расширенного перевода вроде «Всемогущего».
- source_word: יִתֶּן
  choice: появляется
  rationale: Буквально נתן значит «даёт / даётся». В сочетании со льдом русский перевод «появляется» естественно выражает возникновение льда от Божьего дыхания, не вводя отдельного действующего лица.
- source_word: קָרַח
  choice: лёд
  rationale: קָרַח обозначает лёд; это соответствует параллельному образу затвердевшей воды.
- source_word: וְרֹחַב מַיִם
  choice: и водная ширь
  rationale: רֹחַב — «ширина, простор, широкая поверхность»; «водная ширь» кратко и поэтично передаёт широкую поверхность или простор вод.
- source_word: בְּמוּצָק
  choice: затвердевает
  rationale: מוּצָק связано с представлением о чём-либо отлитом, твёрдом и закреплённом. В данном метеорологическом контексте речь идёт о затвердевании воды; перевод сохраняет образ, не делая замерзание более явным, чем в еврейском выражении.
theological_decisions:
- issue: Божье дыхание как источник или средство образования льда
  choice: «От дыхания Бога» с вариантом в сноске
  alternative: «Дыханием Бога»
  rationale: Предлог מִן допускает оба понимания; основной текст сохраняет образ источника, а сноска — инструментальное прочтение, не разрешая неоднозначность догматически.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Водная ширь» передаёт параллелизм кратко и естественно; «затвердевает» сохраняет образную широту еврейского מוּצָק.
