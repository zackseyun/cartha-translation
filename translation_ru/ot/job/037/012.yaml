source:
  edition: WLC
  text: וְ/ה֤וּא מְסִבּ֨וֹת מִתְהַפֵּ֣ךְ ב/תחבולת/ו לְ/פָעֳלָ֑/ם כֹּ֖ל אֲשֶׁ֥ר יְצַוֵּ֓/ם עַל פְּנֵ֖י תֵבֵ֣ל אָֽרְצָ/ה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: ru
  text: Оно кружит, меняя направление под Его управлением[a], чтобы они исполнили всё, что Он повелит им, по всей обитаемой земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Его водительству», «по Его направлению». Еврейское слово подразумевает умелое руководство или управление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по лицу обитаемого мира — к земле (на землю)». Еврейское выражение многослойно обозначает земной, населённый мир.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Оно
  rationale: Местоимение мужского рода единственного числа отсылает к упомянутому в контексте облаку или атмосферному явлению. В русском языке средний род позволяет не сужать референт до одного конкретного явления.
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: кружит, меняя направление
  rationale: Сочетание передаёт повторяющееся круговое движение и повороты; такая формулировка сохраняет оба оттенка и звучит естественно по-русски.
- source_word: בְּתַחְבֻּלֹתוֹ
  choice: под Его управлением
  rationale: Существительное обозначает умелое направление, управление или ведение. В данном контексте речь идёт о Божьем контроле над погодными явлениями.
- source_word: לְפָעֳלָם
  choice: чтобы они исполнили
  rationale: Целевая конструкция с местоименным суффиксом указывает, что управляемые Богом силы должны выполнить назначенное им.
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: всё, что Он повелит им
  rationale: Сохраняется обычное значение глагола צוה «повелевать» и явно передаётся местоименный объект множественного числа.
- source_word: עַל־פְּנֵי תֵבֵל אָרְצָה
  choice: по всей обитаемой земле
  rationale: Естественная русская передача пространственного охвата и земной, населённой области; буквальная многослойность выражения отмечена в сноске.
theological_decisions:
- issue: Референт местоимения единственного числа в контексте описания бури
  choice: Не уточнять его сверх текста и передать нейтральным «оно»
  alternative: Назвать непосредственно облако, грозовую тучу или бурю
  rationale: Контекст говорит об облаках, молнии и иных погодных явлениях как орудиях Божьей власти, но стих не требует точного метеорологического отождествления.
- issue: Переход от единственного числа «оно» к множественному «они / им»
  choice: Сохранить грамматический переход
  alternative: Согласовать весь стих в единственном числе ради плавности
  rationale: Такой переход присутствует в еврейском тексте и может отражать собирательное понимание облака или совокупность подвластных Богу природных сил; устранять эту напряжённость без основания не следует.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Заглавные местоимения «Его», «Он» обозначают Бога. Необычный переход от единственного числа к множественному намеренно сохранён.
