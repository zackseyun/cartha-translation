  terminology: Заглавные местоимения последовательно обозначают Бога и соответствуют заявленному регистру. «Управление», «повелит», «обитаемая земля» не вносят конфессионально обусловленных интерпретаций. Сноска a надлежащим образом раскрывает возможные оттенки «водительства/направления», а сноска b — составной пространственный образ еврейского выражения.
