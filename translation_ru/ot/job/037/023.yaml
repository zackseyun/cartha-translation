base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: ru
  text: Вседержитель — мы не можем постичь Его[a]. Он велик силой, правосудием[b] и обилием праведности; Он не притесняет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мы не находим Его»; возможны также переводы: «мы не можем исследовать Его» или «мы не можем достигнуть Его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «судом».'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительный глагол можно перевести также: «Он не угнетает» или «Он не причиняет страдания». Иногда его понимают как «Он не отвечает», но это хуже согласуется с данным контекстом.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: Вседержитель
  rationale: Передаёт традиционный титул Бога понятным русским соответствием, не прибегая к транслитерации «Шаддай».
- source_word: לֹא מְצָאנֻהוּ
  choice: мы не можем постичь Его
  rationale: Буквально оборот означает «мы не находим Его», но в контексте недоступности Бога человеческому исследованию глагол выражает невозможность Его постичь или исследовать до конца.
- source_word: שַׂגִּיא כֹחַ
  choice: Он велик силой
  rationale: Сохраняет именную структуру и значение величия, соединённого с силой.
- source_word: וּמִשְׁפָּט
  choice: в правосудии
  rationale: מִשְׁפָּט может означать как судебное решение, так и правосудие; рядом с «праведностью» здесь естественно обозначает нравственно-судебное качество Божьих действий.
- source_word: וְרֹב צְדָקָה
  choice: и безмерной праведности
  rationale: רֹב выражает изобилие или великое множество, а צְדָקָה — праведность; «безмерная праведность» естественно передаёт усиление в современном русском языке.
- source_word: לֹא יְעַנֶּה
  choice: Он не притесняет
  rationale: Форма от ענה в породе пиэль обычно означает «угнетать, притеснять, причинять страдание». «Притесняет» сохраняет нравственный смысл контекста, не усиливая его до более категоричного «поступает несправедливо».
theological_decisions:
- issue: Связь заключительного לֹא יְעַנֶּה с Божьим правосудием и праведностью
  choice: Заключение утверждает, что Бог не притесняет.
  alternative: «Он не отвечает», то есть Бог не обязан отвечать человеку или быть доступным его вызову.
  rationale: В контексте правосудия и праведности значение «притеснять» лучше соответствует обычному значению пиэля ענה и сохраняет напряжение между непостижимостью Бога и праведностью Его действий.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Разделение на два предложения делает сжатую еврейскую конструкцию ясной, а точка с запятой сохраняет тесную связь Божьего правосудия и праведности с утверждением, что Он не притесняет.
