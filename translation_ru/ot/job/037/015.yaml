  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: ru
  text: Знаешь ли ты, как Бог возлагает это на них[a] и заставляет сиять свет своего облака[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Бог возлагает на них»; возможно также: «как Бог назначает им». В еврейском обороте прямо не названо, что именно Бог возлагает или назначает; «них» отсылает к явлениям, упомянутым в контексте.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «заставляет сверкать сияние своего облака».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Знаешь ли ты
  rationale: Форма Qal, 2-е лицо мужского рода единственного числа, вводит обращённый к Иову риторический вопрос; этот перевод прямо и естественно передаёт его форму.
- source_word: בְּשׂוּם אֱלוֹהַּ עֲלֵיהֶם
  choice: как Бог распоряжается ими
  rationale: Сочетание предлога ב с инфинитивом שׂוּם обозначает обстоятельство действия, а עליהם сохраняет отсылку к упомянутым в контексте явлениям. Русское «распоряжается ими» естественно передаёт идею Божьего установления или назначения, не уточняя скрытый объект еврейского оборота.
- source_word: וְהוֹפִיעַ
  choice: и заставляет сиять
  rationale: Hiphil глагола יפע выражает причинение появления света или сияния; конструкция «заставляет сиять» ясно передаёт каузативное значение.
- source_word: אוֹר
  choice: свет
  rationale: Существительное означает «свет» или «сияние»; основное значение сохраняется без замены на более конкретную «молнию».
- source_word: עֲנָנוֹ
  choice: Своего облака
  rationale: Существительное стоит в единственном числе с местоименным суффиксом 3-го лица мужского рода. Возвратное «Своего» в русском однозначно относит облако к Богу и сохраняет единственное число.
theological_decisions:
- issue: Скрытый объект при שׂוּם и референт местоимения עֲלֵיהֶם
  choice: Передать оборотом «распоряжается ими» и пояснить буквальную компактность в сноске.
  alternative: «возлагает на них», «устанавливает это над ними», «даёт им повеление»
  rationale: В еврейском тексте после שׂוּם не названо то, что Бог полагает или назначает, а референт «их/них» восстанавливается лишь из контекста. Выбранный русский оборот остаётся понятным, но не вводит явно ни повеление, ни облака, ни молнию.
- issue: Значение выражения אוֹר עֲנָנוֹ
  choice: «свет Своего облака»
  alternative: «молнию из Своего облака», «сияние Своего облака»
  rationale: Перевод сохраняет прямое значение אוֹר и образную неопределённость текста, не отождествляя свет исключительно с молнией.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного поэтического тона. Формулировка вопроса проста и ясна; необычная компактность еврейского оборота вынесена в сноску, а метеорологический образ намеренно не конкретизирован до «молнии».
