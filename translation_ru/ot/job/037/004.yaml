  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: ru
  text: Вслед за нею[a] раздаётся ревущий голос; Он гремит Своим величественным голосом и не удерживает их[b], когда[c] слышен Его голос.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Затем». Еврейское выражение можно понять наречно, однако в контексте оно, вероятно, указывает на молнию в предыдущем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не задерживает их». «Их», вероятно, относится к молниям, громовым ударам или другим проявлениям бури.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «потому что слышен Его голос». Еврейский союз может выражать как время, так и причину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Вслед за ней
  rationale: Местоименный суффикс естественно отсылает к молнии из предыдущего стиха; женский род обусловлен русским словом «молния». Формулировка сохраняет связь между вспышкой молнии и следующим за ней громом.
- source_word: יִשְׁאַג קוֹל
  choice: гремит голос
  rationale: Глагол שׁאג буквально передаёт рёв, но применительно к грому современное русское «гремит» звучит естественно и сохраняет мощь образа. Слово «голос» оставлено субъектом, как в еврейском тексте.
- source_word: יַרְעֵם
  choice: Он гремит
  rationale: Каузативная форма רעם описывает произведённый Богом гром. «Он гремит» естественно передаёт действие и сохраняет подразумеваемого личного деятеля, не добавляя имени Бога.
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: Своим величественным голосом
  rationale: גאון здесь обозначает величие и возвышенное могущество. Прилагательное «величественным» даёт естественную современную русскую конструкцию без утраты смысла.
- source_word: וְלֹא יְעַקְּבֵם
  choice: и не удерживает их
  rationale: Пиэль עקב допускает значения «удерживать», «задерживать», «препятствовать». Местоимение множественного числа сохранено без явного уточнения его не вполне ясного антецедента.
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: когда слышен Его голос
  rationale: כִּי может иметь временное или причинное значение. Временное «когда» естественно вписывается в последовательность явлений бури, при этом причинная возможность отмечена в сноске.
theological_decisions:
- issue: Кто гремит величественным голосом
  choice: Подразумеваемый субъект — Бог, чей голос проявляется в громе; это передано местоимением «Он» без добавления имени.
  alternative: Субъект можно понять более безлично — как сам голос или явление бури.
  rationale: Ближайший контекст описывает действия Бога, а выражение «Его голос» указывает на личного деятеля. Перевод не делает эту связь более явной, чем исходный текст.
- issue: К чему относится местоимение «их»
  choice: Неясный антецедент сохранён; вероятно, имеются в виду молнии, громовые удары или иные проявления бури.
  alternative: Можно было бы явно назвать «молнии» либо понять глагол как «не задерживает их».
  rationale: Еврейский текст содержит местоименный суффикс множественного числа без выраженного существительного, поэтому конкретизация в основном тексте устранила бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Повтор «голос» и неясное «их» сохранены ради структуры и неоднозначности еврейского текста; заглавные местоимения по отношению к Богу соответствуют принятому русскому библейскому регистру.
