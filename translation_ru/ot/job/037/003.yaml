lexical_decisions:
- source_word: תַּחַת
  choice: под
  rationale: Сохраняет буквальный пространственный образ еврейского предлога и естественно звучит в сочетании «под всеми небесами».
- source_word: כָּל הַשָּׁמַיִם
  choice: всеми небесами
  rationale: Передаёт множественное число исходного текста и сохраняет возвышенный поэтический регистр.
- source_word: יִשְׁרֵהוּ
  choice: направляет его
  rationale: Передаёт вероятное значение редкой глагольной формы как движения или направления; местоименное дополнение оставлено без уточнения, как в еврейском тексте.
- source_word: וְאוֹרוֹ
  choice: а Свою молнию
  rationale: 'Существительное буквально означает «Его свет», но в описании грозы наиболее вероятно обозначает вспышку молнии. Противительный оттенок не вводится: «а» здесь естественно присоединяет параллельную поэтическую строку.'
- source_word: עַל
  choice: к
  rationale: В сочетании с подразумеваемым движением естественно передаёт распространение молнии до земных пределов; буквальные варианты «над» и «на» здесь менее ясны по-русски.
- source_word: כַּנְפוֹת הָאָרֶץ
  choice: краям земли
  rationale: Буквально «крылья земли»; это поэтический образ её крайних пределов. «Края земли» ясно передаёт смысл, а исходный образ отмечен в сноске.
theological_decisions:
- issue: Референт слова אוֹר («свет») в описании грозы
  choice: молния
  alternative: свет
  rationale: Контекст грома и грозового явления указывает на молнию, однако буквальное значение и возможная неоднозначность сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и пространственных образов оригинала. Местоимение «его» намеренно не получает поясняющего существительного, поскольку еврейский текст также отсылает к ближайшему контексту.
