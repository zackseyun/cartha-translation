  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: ru
  text: По всему поднебесью Он посылает его, и Свою молнию[a] — к краям земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
