base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: ru
  text: 'Ибо снегу Он говорит: «Падай на землю»[a], дождю: «Стань ливнем», а дождям[b]: «Пролейтесь ливнями Его силы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будь на земле» — то есть появись или лежи на земле.'
    reason: lexical_alternative
  - marker: b
    text: 'Последнюю часть можно также перевести: «и сильным ливням Его силы» или «и могучим потокам дождя». Местоимение можно понять и как указание на силу самого дождя. Еврейская фраза сжата и поэтична.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение того, как Бог повелевает природными явлениями; «ибо» естественно передаёт причинно-пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: לַשֶּׁלַג
  choice: снегу
  rationale: Предлог ל при глаголе речи обозначает адресата. Дательный падеж сохраняет олицетворённое обращение Бога к снегу.
- source_word: יֹאמַר
  choice: Он говорит
  rationale: Имперфект в поэтическом описании передан настоящим временем, которое изображает постоянное владычество Бога над погодой. Повелительный смысл выражен прямой речью, поэтому усиливать глагол до «повелевает» не требуется.
- source_word: הֱוֵא אָרֶץ
  choice: Падай на землю
  rationale: Буквально сочетание допускает смысл «будь на земле», однако в обращении к снегу естественное русское «падай на землю» ясно передаёт появление снега на земле, не разрушая образ.
- source_word: וְגֶשֶׁם מָטָר
  choice: 'дождю: «Стань ливнем»'
  rationale: Сочетание двух близких слов со значением дождя передано как обращение к дождю с повелением стать ливнем. Так сохраняются поэтическое нарастание и параллелизм.
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: 'а дождям: «Станьте ливнями Его мощи»'
  rationale: Сжатая еврейская конструкция передана продолжением повеления; множественное מִטְרוֹת отражено словом «ливнями», а עֻזּוֹ — словосочетанием «Его мощи». Некоторая необычность образа сохранена как свойство оригинальной поэзии.
- source_word: עֻזּוֹ
  choice: Его мощи
  rationale: Местоименный суффикс мужского рода наиболее естественно относится к Богу, который говорит и управляет осадками. «Мощь» звучит весомо и уместно в поэтическом контексте.
theological_decisions:
- issue: К кому относится местоименный суффикс в עֻזּוֹ
  choice: 'К Богу: «Его мощи»'
  alternative: 'К дождю: «своей силы» или «со всей своей силой»'
  rationale: В непосредственном контексте Бог выступает говорящим и распоряжается погодой, поэтому отнесение суффикса к Нему лучше соответствует ходу речи. Альтернативная грамматическая связь с дождём остаётся возможной и отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Олицетворённое обращение к снегу и дождю сохранено; сжатость и нарастание еврейского параллелизма переданы без конфессиональных уточнений.
