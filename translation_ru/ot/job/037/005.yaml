lexical_decisions:
- source_word: יַרְעֵם
  choice: гремит
  rationale: Форма хифиль от רעם обозначает произведение грома; в сочетании с Божьим голосом русское «гремит» естественно передаёт образ бури.
- source_word: אֵל
  choice: Бог
  rationale: Обычное божественное наименование אֵל здесь не требует расширения до особого титула.
- source_word: בְּקוֹלוֹ
  choice: Своим голосом
  rationale: Предлог ב имеет инструментальное значение; возвратное притяжательное местоимение естественно связывает голос с подлежащим «Бог».
- source_word: נִפְלָאוֹת
  choice: дивно
  rationale: Хотя форма буквально означает «дивные дела, чудеса», в данной конструкции она, вероятно, употреблена наречно и характеризует то, как Бог гремит.
- source_word: עֹשֶׂה
  choice: совершает
  rationale: Глагол עשה имеет широкое значение «делать»; «совершает» звучит естественно с субстантивированным «великое» и сохраняет возвышенный, но современный регистр.
- source_word: גְּדֹלוֹת
  choice: великое
  rationale: Форма женского рода множественного числа употреблена субстантивно; собирательное русское «великое» передаёт великие дела без ненужного уточнения.
- source_word: וְלֹא נֵדָע
  choice: чего мы не знаем
  rationale: Сохраняется прямое значение ידע «знать» и естественная связь заключительной фразы с «великим», без усиления до полной непостижимости.
theological_decisions:
- issue: Предел человеческого знания в заключительной фразе
  choice: «чего мы не знаем» — Божьи великие дела остаются нам неизвестны
  alternative: «чего мы не можем постичь» / «что выше нашего понимания»
  rationale: Еврейский текст прямо говорит «не знаем», а не утверждает в усиленной форме абсолютную непостижимость; буквенная смысловая напряжённость сохранена.
- issue: Синтаксическая роль נִפְלָאוֹת
  choice: 'Наречное значение: Бог гремит «дивно»'
  alternative: 'Объектное значение: «Бог голосом издаёт/возглашает дивное»'
  rationale: Форма допускает более буквальное объектное прочтение, однако в контексте грома и Божьего голоса наречное понимание даёт наиболее естественный русский текст; подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок фраз близок к еврейскому оригиналу; избегнуты архаизмы и конфессионально окрашенные толкования.
