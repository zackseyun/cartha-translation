base_translation:
  language: en
  yaml_path: translation/ot/job/037/002.yaml
  text: Listen carefully[a] to the trembling of his voice[b], and the rumbling that comes out from his mouth.
translation:
  language: ru
  text: Вслушайтесь[a] в дрожь[b] его голоса и в гул[c], исходящий из его уст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушайте, слушайте»; такое повторение форм одного глагола усиливает повеление.'
    reason: translation_explanation
  - marker: b
    text: 'Или: «волнение», «смятение» или «яростное бушевание».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «рокот», «ропот» или «звук».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: Вслушайтесь
  rationale: Сочетание повелительной формы с абсолютным инфинитивом усиливает призыв. «Вслушайтесь» естественно передаёт в русском языке требование напряжённо и внимательно слушать; буквальное повторение отмечено в сноске.
- source_word: בְּרֹגֶז
  choice: в дрожь
  rationale: רֹגֶז может обозначать дрожь, смятение, волнение или яростное бушевание. В контексте грозы «дрожь» передаёт сотрясающее действие голоса, не сводя образ исключительно к гневу.
- source_word: קֹלוֹ
  choice: его голоса
  rationale: קוֹל означает «голос» или «звук». Упоминание уст во второй половине стиха поддерживает олицетворённый образ голоса Бога.
- source_word: וְהֶגֶה
  choice: и в гул
  rationale: הֶגֶה обозначает низкий, невнятный звук — гул, рокот, ропот или стон. В грозовом контексте естественно звучит «гул», при сохранении альтернатив в сноске.
- source_word: מִפִּיו יֵצֵא
  choice: исходящий из его уст
  rationale: Оборот сохраняет конкретный поэтический образ звука, выходящего из уст, и передаёт возвышенный, но понятный современный русский регистр.
theological_decisions:
- issue: Антропоморфный образ Бога в описании грозы
  choice: Сохранены выражения «его голос» и «его уста»
  alternative: 'Обезличить образ: «звук грома» или «его звучание»'
  rationale: Еврейский текст изображает грозу как собственное изречение Бога. Сохранение антропоморфного языка передаёт поэтическую и богословскую силу оригинала, не разъясняя образ сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Глагол «вслушайтесь» передаёт усиленное повеление без неестественного для русского буквального повтора; «уста» сохраняют достоинство и параллелизм образа.
