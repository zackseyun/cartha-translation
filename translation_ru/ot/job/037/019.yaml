  text: ה֭וֹדִיעֵ/נוּ מַה נֹּ֣אמַר ל֑/וֹ לֹ֥א נַ֝עֲרֹ֗ךְ מִ/פְּנֵי חֹֽשֶׁךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: ru
  text: Научи нас, что сказать Ему; мы не можем привести свои слова в порядок[a] из-за тьмы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изложить свои слова»; возможно также: «изложить своё дело».'
    reason: lexical_alternative
  - marker: b
    text: «Тьма» может образно указывать на человеческое неведение или неспособность, хотя возможен и буквальный смысл.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: Научи нас
  rationale: Побудительная форма глагола ידע означает «дай нам знать, сообщи нам». В данном обращении естественное русское «научи нас» передаёт просьбу о наставлении.
- source_word: מַה נֹּאמַר לוֹ
  choice: что сказать Ему
  rationale: 'Краткая инфинитивная конструкция естественно передаёт совещательный смысл: какие слова следует обратить к Богу.'
- source_word: לֹא נַעֲרֹךְ
  choice: мы не можем привести свои слова в порядок
  rationale: Глагол ערך означает «располагать, выстраивать, приводить в порядок». Добавление «слова» проясняет подразумеваемый объект в речевом контексте, не сводя выражение исключительно к судебному «изложить дело».
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: из-за тьмы
  rationale: מִפְּנֵי здесь естественно выражает причину, а буквальное «тьма» сохраняет сжатость образа и его возможный буквальный либо переносный смысл.
theological_decisions:
- issue: Смысл «тьмы» в заключительной части стиха
  choice: Сохранено слово «тьма» без истолкования.
  alternative: «из-за нашего неведения» или «потому что темно»
  rationale: Еврейский текст не уточняет, обозначает ли тьма человеческое неведение, неспособность говорить перед Богом или физическую темноту; перевод сохраняет эту неоднозначность.
- issue: Характер речи перед Богом
  choice: «привести свои слова в порядок»
  alternative: «изложить своё дело»
  rationale: Судебный оттенок возможен, но прямо не выражен; более широкая формулировка сохраняет как риторический, так и возможный судебный смысл.
translation_notes:
  register: Современный литературный русский язык; краткая поэтическая фраза сохраняет достоинство и образность оригинала. Местоимение «Ему» написано с прописной буквы по принятой русской библейской традиции, без устранения референтной связи с Богом из контекста.
