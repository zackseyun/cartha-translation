  text: הֲ֭/תֵדַע עַל מִפְלְשֵׂי עָ֑ב מִ֝פְלְא֗וֹת תְּמִ֣ים דֵּעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/016.yaml
  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: ru
  text: Знаешь ли ты о равновесии облаков[a], о чудесах того, кто совершенен в знании?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о том, как расстилаются облака». Еврейское слово встречается редко, и его точный оттенок неясен; вероятно, речь идёт о том, как облака распростёрты или удерживаются в небе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: Знаешь ли ты
  rationale: Вопросительная частица при глаголе ידע вводит обращённый к Иову риторический вопрос. Формулировка прямо передаёт значение «знать», не усиливая его до «понимать».
- source_word: עַל
  choice: о
  rationale: Предлог вводит предмет знания; русское «о» естественно передаёт значение «относительно, касательно».
- source_word: מִפְלְשֵׂי עָב
  choice: равновесии облаков
  rationale: Редкое существительное допускает толкования, связанные с равновесием, распространением или расположением облаков. «Равновесие облаков» сохраняет традиционный образ удерживаемых в небе облаков, а неопределённость отмечена в сноске.
- source_word: מִפְלְאוֹת
  choice: чудесах
  rationale: Слово обозначает необычайные деяния или явления; «чудеса» кратко и естественно передаёт его в возвышенном контексте.
- source_word: תְּמִים דֵּעִים
  choice: того, кто совершенен в знании
  rationale: תְּמִים выражает полноту и совершенство, а форма דֵּעִים — полноту знания. Русская конструкция передаёт личный референт и при этом не называет его прямо, как и еврейский текст.
theological_decisions:
- issue: К кому относится выражение «тот, кто совершенен в знании»
  choice: Референт оставлен не названным; по контексту речь идёт о Боге
  alternative: Прямо вставить имя «Бог» либо понять слова как указание на мудреца или самого Елиуя
  rationale: Контекст речи Елиуя о власти над погодой естественно указывает на Бога, однако еврейский стих не называет Его прямо. Перевод сохраняет эту косвенность и не устраняет возможное напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным звучанием. Синтаксический параллелизм двух предложных оборотов сохранён; редкое метеорологическое выражение не разъясняется внутри стиха, а сопровождается сноской.
