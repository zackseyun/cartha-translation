  yaml_path: translation/ot/job/037/011.yaml
  text: Indeed[a], he loads the thick cloud with moisture[b]; he scatters his cloud of light.
translation:
  language: ru
  text: И Он отягощает тучу влагой[a], рассеивает облако Своего света[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дождём» или «водой»; значение еврейского слова не вполне ясно.'
