  text: הַאֲזִ֣ינָ/ה זֹּ֣את אִיּ֑וֹב עֲ֝מֹ֗ד וְ/הִתְבּוֹנֵ֤ן נִפְלְא֬וֹת אֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: ru
  text: Послушай это, Иов; остановись и вдумайся в чудеса Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Послушай
  rationale: Императив призывает внимательно слушать. «Послушай» естественно звучит по-русски и сохраняет побудительную силу формы.
- source_word: זֹּאת
  choice: это
  rationale: Указательное местоимение женского рода единственного числа отсылает к сказанному или к тому, что последует; сочетание «послушай это» прямо передаёт конструкцию.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Использована закрепившаяся в русском языке форма библейского имени.
- source_word: עֲמֹד
  choice: остановись
  rationale: Буквально императив означает «стой». В сочетании со следующим призывом он требует прекратить движение или занятие и сосредоточиться; «остановись» естественно выражает эту контекстуальную функцию.
- source_word: וְהִתְבּוֹנֵן
  choice: и вдумайся
  rationale: Возвратная интенсивная форма глагола בין обозначает сосредоточенное размышление и внимательное рассмотрение. «Вдумайся» кратко и выразительно передаёт этот смысл.
- source_word: נִפְלְאוֹת
  choice: в чудеса
  rationale: Множественное число от פלא может обозначать как дивные явления, так и чудесные деяния. Слово «чудеса» сохраняет эту ёмкость и не сужает смысл до дел.
- source_word: אֵל
  choice: Бога
  rationale: Здесь אֵל является обычным обозначением Бога. «Бога» передаёт его без добавления отсутствующего в тексте определения «Всемогущий» или «могучий».
theological_decisions:
- issue: Передача божественного обозначения אֵל
  choice: Бога
  alternative: могучего Бога
  rationale: Контекст не требует разворачивать возможную этимологическую ассоциацию с силой в отдельное определение. Простая передача «Бога» сохраняет исходный смысл и не вносит дополнительного богословского акцента.
- issue: Смысл נִפְלְאוֹת как явлений или деяний
  choice: чудеса
  alternative: дивные деяния
  rationale: Еврейское существительное допускает более широкое понимание, чем только действия. «Чудеса» сохраняет неоднозначность между чудесными явлениями и Божьими делами.
translation_notes:
  register: Современный литературный русский язык с достойным, прямым обращением. Формулировка сохраняет последовательность трёх повелений и побуждение к сосредоточенному созерцанию, избегая архаического «внемли».
