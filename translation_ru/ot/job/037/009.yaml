translation:
  language: ru
  text: Из чертога приходит буря[a], и от рассеивающих ветров приходит холод[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «С юга приходит буря». Буквально: «из чертога»; это может быть поэтическим обозначением южной стороны или скрытого хранилища бури.'
    reason: alternative_reading
  - marker: b
