  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: ru
  text: Он налагает печать на руку каждого человека[a], чтобы все люди познали Его дело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «запечатывает руку каждого человека». Вероятно, это еврейское выражение означает, что Бог останавливает обычный человеческий труд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: руку
  rationale: 'При глаголе חתם предложное сочетание передано по-русски как прямое дополнение: «запечатывает руку». Это сохраняет необычный образ и звучит естественнее буквального «в руке».'
- source_word: כָּל אָדָם
  choice: каждого человека
  rationale: Существительное אָדָם употреблено обобщённо и обозначает любого человека, а не только мужчину.
- source_word: יַחְתּוֹם
  choice: запечатывает
  rationale: Глагол חתם означает «запечатывать, ставить печать». Выбор сохраняет метафору, не сводя её прямо к толкованию «прекращает труд».
- source_word: לָדַעַת
  choice: чтобы ... познали
  rationale: Инфинитив с ל передаёт цель или результат; конструкция «чтобы ... познали» естественно выражает эту связь.
- source_word: כָּל אַנְשֵׁי
  choice: все люди
  rationale: Фраза имеет собирательный смысл и относится ко всем людям; современное русское «все люди» точно передаёт этот обобщённый смысл.
- source_word: מַעֲשֵׂהוּ
  choice: Его дело
  rationale: Единственное число с суффиксом третьего лица передано формально близко. «Дело» сохраняет возможность понимать слово как деяние или деятельность Бога.
theological_decisions:
- issue: К кому относятся формы «Он» и «Его»
  choice: К Богу
  alternative: К буре или погодному явлению как действующей силе либо к неопределённому субъекту
  rationale: В речи Елиуя ближайший широкий контекст описывает Божью власть над погодой; поэтому Бог является наиболее связным подразумеваемым субъектом.
- issue: Смысл образа запечатанной руки
  choice: Сохранить образ в основном тексте
  alternative: 'Истолковать прямо: «Он прекращает труд каждого человека»'
  rationale: Еврейское выражение трудно и образно. Вероятно, речь идёт о прекращении обычной работы из-за Божьей погоды, но перевод не должен устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Прописные местоимения «Он», «Его» помогают обозначить подразумеваемого референта — Бога; трудный образ сохранён, а вероятный смысл вынесен в сноску.
