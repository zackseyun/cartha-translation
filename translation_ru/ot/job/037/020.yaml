lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: Разве ... сообщат
  rationale: Вопросительная частица с пассивной формой глагола ספר передана естественной русской неопределённо-личной конструкцией; «разве» сохраняет риторический характер вопроса.
- source_word: לוֹ
  choice: Ему
  rationale: По контексту местоимение относится к Богу. Прописная буква соответствует принятому русскому благоговейному написанию, не меняя лексического значения.
- source_word: כִּי אֲדַבֵּר
  choice: что я хочу говорить
  rationale: כִּי вводит содержание сообщения, а имперфект אֲדַבֵּר имеет здесь модально-намерительное значение. Формулировка избегает двусмысленного русского «я буду говорить».
- source_word: אִם אָמַר אִישׁ
  choice: Если человек заговорит
  rationale: Сохранены условная частица אִם и единственное число אִישׁ; «заговорит» естественно передаёт אָמַר в контексте намерения обратиться к Богу без добавления отсутствующего в еврейском тексте объекта.
- source_word: כִּי יְבֻלָּע
  choice: он будет поглощён
  rationale: Пассив יְבֻלָּע сохраняет сильный образ корня בלע. כִּי понимается как вводящее следствие; в русском условном построении оно не требует отдельного слова вроде «непременно».
theological_decisions:
- issue: Референт местоимения לוֹ
  choice: Ему, то есть Богу
  alternative: ему
  rationale: Контекст речи Елиуя указывает на Бога; прописная буква лишь делает этот референт явным по русской издательской норме.
- issue: Обобщающее значение אִישׁ
  choice: человек
  alternative: кто-либо; мужчина
  rationale: Здесь אִישׁ обозначает отдельного человека вообще, а не подчёркивает мужской пол; «человек» сохраняет единственное число и естественно звучит по-русски.
- issue: Трудный синтаксис второй половины стиха
  choice: 'Условное прочтение: «Если человек заговорит, он будет поглощён»'
  alternative: «Или скажет ли человек, что будет поглощён?»
  rationale: Еврейский текст синтаксически сжат и допускает разные способы членения. Основной текст следует прямой условной связи, а иной вопросительный разбор сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи Иова. Риторический вопрос и резкий образ поглощения сохранены; синтаксическая неоднозначность не скрыта и вынесена в примечание.
