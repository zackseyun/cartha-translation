    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לְזֹאת
  choice: И от этого
  rationale: Сочетание связывает стих с предшествующим описанием и указывает на причину потрясения. «И» передаёт связующую силу אַף, а «от этого» естественно выражает לְזֹאת в данном контексте.
- source_word: יֶחֱרַד
  choice: трепещет
  rationale: Глагол חרד обозначает дрожь от страха, благоговения или сильного волнения. «Трепещет» сохраняет широту значения и подходит возвышенному, но современному регистру.
- source_word: לִבִּי
  choice: моё сердце
  rationale: Буквальный образ сердца как внутреннего средоточия переживания сохранён без сведения его значения только к разуму или эмоциям.
- source_word: וְיִתַּר
  choice: и вырывается
  rationale: Редкий и трудный в данном контексте глагол передаёт резкое движение сердца. «Вырывается» сохраняет яркость образа, не превращая его в буквальное физиологическое утверждение.
- source_word: מִמְּקוֹמוֹ
  choice: со своего места
  rationale: Местоименный суффикс относится к сердцу; перевод сохраняет пространственную метафору внезапного смещения.
