  text: От этого также трепещет моё сердце и выскакивает со своего места[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «содрогается»; еврейский глагол может обозначать дрожь от страха, благоговения или сильного волнения.'
