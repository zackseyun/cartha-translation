  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: ru
  text: Тогда зверь входит в своё укрытие и остаётся в своих логовах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тогда дикое животное входит в своё логово и пребывает в местах своего обитания».'
    reason: Лексические варианты для חַיָּה, אָרֶב, מְעוֹנוֹת и שׁכן передают более буквальные и менее идиоматические оттенки исходного текста.
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Тогда ... уходит
  rationale: Форма wayyiqtol от בוא развивает последовательность поэтического описания; настоящее время передаёт наглядную картину повторяющегося природного явления. Русское «уходит в» здесь естественно выражает движение внутрь убежища.
- source_word: חַיָּה
  choice: зверь
  rationale: חַיָּה обозначает животное, часто дикого зверя. В данном контексте это обобщённое обозначение дикого животного, а «зверь» звучит естественно и кратко.
- source_word: בְמוֹ אָרֶב
  choice: в своё укрытие
  rationale: אָרֶב может обозначать скрытое место, где лежат в засаде, или убежище зверя. «Укрытие» сохраняет идею скрытого защищённого места, не сужая значение до конкретного типа логова.
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: в своих логовах
  rationale: מְעוֹנוֹת — множественное число со значением мест обитания. В отношении зверя «логова» идиоматично и сохраняет множественное число; местоименная форма передаёт суффикс 3-го лица женского рода, согласованный с חַיָּה.
- source_word: תִשְׁכֹּן
  choice: остаётся
  rationale: שׁכן означает пребывать, обитать. После ухода зверя в укрытие «остаётся» ясно выражает продолжительное пребывание там из-за непогоды.
