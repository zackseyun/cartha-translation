lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего описания Божьего величия и сохраняет логическую связь.
- source_word: יְרֵאוּהוּ
  choice: боятся Его
  rationale: Прямо передаёт ירא, охватывающее страх и благоговение, не ослабляя богословской весомости выражения.
- source_word: אֲנָשִׁים
  choice: люди
  rationale: Естественное современное русское обозначение людей вообще; в данном контексте слово употреблено обобщённо.
- source_word: לֹא יִרְאֶה
  choice: Он не обращает взора
  rationale: Сохраняет образное значение «видеть», одновременно естественно выражая смысл «не удостаивать внимания» и не сводя неоднозначность к одному толкованию.
- source_word: כָּל
  choice: ни на кого
  rationale: 'При отрицании естественно передаёт распределительное значение: ни на одного из названной группы.'
- source_word: חַכְמֵי לֵב
  choice: мудрых сердцем
  rationale: Сохраняет еврейскую метафору сердца как средоточия разумения и не добавляет отсутствующее в тексте уточнение «в собственных глазах».
theological_decisions:
- issue: Смысл того, что Бог «не видит» мудрых сердцем
  choice: Он не обращает взора ни на кого из мудрых сердцем
  alternative: Он не смотрит ни на кого из мудрых сердцем; Он не считается ни с кем из мудрых сердцем
  rationale: Подлежащее естественнее всего относится к Богу. Формулировка сохраняет зрительный образ ראה и допускает смысл отсутствия благосклонного внимания, не утверждая прямо, что речь именно о самодовольной человеческой мудрости.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавное «Его/Он» применено к Богу по принятой русской библейской традиции; оборот «мудрых сердцем» намеренно сохраняет исходную метафору.
