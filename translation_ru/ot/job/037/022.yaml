  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: ru
  text: С севера приходит золотое сияние[a]; у Бога — грозное величие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «золото».'
    reason: Еврейское זָהָב буквально означает «золото»; в данном поэтическом контексте оно может обозначать золотистый блеск или сияние.
lexical_decisions:
- source_word: זָהָב (заһав)
  choice: золотое сияние
  rationale: Основное значение слова — «золото», но в поэтическом описании небесного явления оно, вероятно, обозначает золотой блеск или сияние. Перевод сохраняет образ и естественно звучит по-русски; буквальное значение отмечено в сноске.
- source_word: הוֹד (ход)
  choice: величие
  rationale: Слово выражает великолепие, величавость и славу; «величие» здесь ясно и соответствует возвышенному поэтическому контексту.
- source_word: נוֹרָא (нора)
  choice: внушающее трепет
  rationale: Передаёт не только страх, но и благоговейное потрясение перед Божьим величием.
- source_word: עַל (аль)
  choice: окружает
  rationale: Хотя предлог буквально часто означает «на, над», в данном кратком поэтическом обороте он указывает на величие, пребывающее при Боге или вокруг Него. «Окружает» даёт естественный русский образ, не делая величие внешним источником Божества.
theological_decisions:
- issue: Связь внушающего трепет величия с Богом
  choice: Бога окружает величие, внушающее трепет
  alternative: Над Богом — грозное величие
  rationale: Выбранный вариант сохраняет образ Божьего величия и не создаёт нежелательного впечатления, будто над Богом находится нечто высшее. При этом он соответствует допустимому контекстуальному пониманию предлога עַל.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Сохранены параллелизм и лаконичность древнееврейской строки.
