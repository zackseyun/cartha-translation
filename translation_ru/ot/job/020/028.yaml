  yaml_path: translation/ot/job/020/028.yaml
  text: The produce of his house will be carried away[b][a], flowing away in the day of his anger.
translation:
  language: ru
  text: Достояние его дома исчезнет[a], всё утечёт в день его гнева[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уйдёт в изгнание»; глагол может обозначать уход, переселение или удаление. Здесь он, вероятно, говорит об удалении достояния нечестивого.'
    reason: lexical_alternative
  - marker: b
    text: Вероятнее всего, имеется в виду Божий гнев, хотя в еврейском тексте тот, чей это гнев, прямо не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: יִגֶל
  choice: будет унесён
  rationale: Форма Qal imperfect 3 м. р. ед. ч. от גלה может означать уход, переселение или удаление. При подлежащем «достаток» результативное «будет унесён» естественно передаёт утрату имущества, не называя прямо действующее лицо.
- source_word: יְבוּל
  choice: достаток
  rationale: Слово обозначает урожай, плод или прибыль. В сочетании с «домом» и в контексте гибели имущества нечестивого «достаток» передаёт совокупность приобретённого домом, сохраняя образ его благосостояния.
- source_word: בֵּיתוֹ
  choice: его дома
  rationale: Сохранён буквальный образ «дома», который в данном контексте может охватывать домочадцев, хозяйство и всё принадлежащее человеку.
- source_word: נִגָּרוֹת
  choice: утечёт прочь
  rationale: Форма от נגר выражает льющееся или текущее движение. Перевод сохраняет образ имущества, исчезающего подобно утекающему потоку, и согласуется по числу с русским словом «достаток».
- source_word: בְּיוֹם
  choice: в день
  rationale: Сохранён краткий и торжественный временной оборот еврейского текста.
- source_word: אַפּוֹ
  choice: его гнева
  rationale: Слово אַף здесь означает гнев; местоименный суффикс имеет форму 3 м. р. ед. ч. Строчная буква и местоимение сохраняют неявность того, к кому оно относится.
theological_decisions:
- issue: К кому относится выражение «его гнева»
  choice: В основном тексте сохранено местоимение «его» без прямого добавления имени Бога.
  alternative: «в день Божьего гнева»
  rationale: Контекст суда делает Божий гнев наиболее вероятным пониманием, однако в самом еврейском стихе Бог прямо не назван. Сохранение местоимения не устраняет намеренно краткую и формально неоднозначную формулировку.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. «Достаток» понятнее и шире буквального «урожай» применительно к дому; сочетание «утечёт прочь» сохраняет поэтический образ исчезающего потока без излишней архаизации.
