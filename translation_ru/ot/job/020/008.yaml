  text: כַּ/חֲל֣וֹם יָ֭עוּף וְ/לֹ֣א יִמְצָא֑וּ/הוּ וְ֝/יֻדַּ֗ד כְּ/חֶזְי֥וֹן לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/008.yaml
  text: Like a dream he flies away and is not found[b][a]; he is driven away like a vision of the night.
translation:
  language: ru
  text: Как сон, он улетит, и его не найдут[a]; его прогонят, как ночное видение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и никто его не найдёт». В еврейском тексте употреблён глагол во множественном числе с неопределённым субъектом: буквально «и не найдут его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Как сон
  rationale: Предлог כְּ выражает сравнение, а חֲלוֹם означает «сон». Краткая конструкция естественна для русской поэзии и сохраняет образ оригинала.
- source_word: יָעוּף
  choice: он улетит
  rationale: Глагол עוּף буквально означает «лететь, улетать». Будущее совершенного вида передаёт стремительное исчезновение, не ослабляя исходную метафору до простого «исчезнет».
- source_word: וְלֹא יִמְצָאֻהוּ
  choice: и его не найдут
  rationale: В еврейском тексте стоит активный глагол во множественном числе с неопределённым субъектом и объектным суффиксом «его». Русская неопределённо-личная конструкция точно и естественно сохраняет эту форму.
- source_word: וְיֻדַּד
  choice: его прогонят
  rationale: 'Форма хофаль передаёт действие, направленное на него: его гонят прочь, удаляют. «Его прогонят» сохраняет энергичность образа и синтаксический параллелизм.'
- source_word: כְּחֶזְיוֹן לָיְלָה
  choice: как ночное видение
  rationale: חֶזְיוֹן означает «видение», а לָיְלָה уточняет его как ночное. «Ночное видение» естественно и поэтично по-русски; возможную более буквальную конструкцию отмечать отдельно не требуется, поскольку смысл существенно не меняется.
