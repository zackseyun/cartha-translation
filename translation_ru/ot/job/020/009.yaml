  text: Глаз, видевший его, больше его не увидит[a], и его место больше не увидит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Глаз, смотревший на него, больше не будет смотреть на него». В еврейском тексте слово «глаз» стоит в единственном числе как поэтический образ, а во второй части строки «его место» олицетворено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Глаз
  rationale: Буквально «глаз»; сохранён поэтический собирательный образ, а не сглаженное «никто».
- source_word: שְׁזָפַתּוּ
  choice: видевший его
  rationale: Глагол означает «видеть, смотреть на»; причастный оборот естественно передаёт определительное придаточное еврейского текста.
- source_word: וְלֹא תוֹסִיף
  choice: больше его не увидит
  rationale: יסף с отрицанием выражает значение «вновь не сделать, больше не сделать»; глагол «увидит» и местоименное дополнение восстановлены из первой части строки.
- source_word: וְלֹא עוֹד
  choice: уже не будет
  rationale: Передаёт прекращение действия и поддерживает параллелизм двух частей стиха.
- source_word: תְּשׁוּרֶנּוּ
  choice: будет его созерцать
  rationale: שׁור означает «смотреть на, видеть»; «созерцать» сохраняет поэтический регистр и некоторое лексическое различие между двумя еврейскими глаголами зрения.
- source_word: מְקוֹמוֹ
  choice: место его
  rationale: Сохранены буквальное значение и олицетворение места, которое больше не видит человека.
