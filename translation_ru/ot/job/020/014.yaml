  text: his food in his belly is turned[a]; it is the venom of cobras within him.
translation:
  language: ru
  text: Пища в его утробе превращается[a]; внутри него она — яд кобр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Его хлеб во внутренностях изменяется; внутри него он — желчь аспидов».'
    reason: 'Лексические варианты: לֶחֶם может означать «хлеб», מְרוֹרָה — «желчь, горечь», а פֶּתֶן традиционно передаётся как «аспид».'
lexical_decisions:
- source_word: לַחְמוֹ
  choice: пища
  rationale: Хотя существительное буквально часто означает «хлеб», здесь оно обозначает съеденное вообще; «пища» естественно передаёт этот смысл по-русски.
- source_word: בְּמֵעָיו
  choice: в его утробе
  rationale: Слово обозначает внутренности, особенно органы пищеварения. «В утробе» сохраняет телесный образ и соответствует возвышенному, но понятному регистру.
- source_word: נֶהְפָּךְ
  choice: превращается
  rationale: 'Форма нифаля выражает изменение состояния: съеденная пища становится чем-то иным внутри человека.'
- source_word: מְרוֹרַת
  choice: яд
  rationale: В сочетании с названием ядовитых змей слово, буквально связанное с горечью или желчью, передаёт значение губительного змеиного яда.
- source_word: פְּתָנִים
  choice: кобр
  rationale: Еврейское слово обозначает ядовитых змей; «кобры» — понятный современному читателю эквивалент, сохраняющий конкретный образ.
- source_word: בְּקִרְבּוֹ
  choice: внутри него
  rationale: Выражение подчёркивает, что превращение и действие яда происходят во внутренностях нечестивого.
