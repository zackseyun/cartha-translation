  text: אַל יֵ֥רֶא בִ/פְלַגּ֑וֹת נַהֲרֵ֥י נַ֝חֲלֵ֗י דְּבַ֣שׁ וְ/חֶמְאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/017.yaml
  text: He will not look upon streams[a], rivers flowing with honey and curds.
translation:
  language: ru
  text: Не увидит он водных потоков[a], рек и ручьёв, текущих мёдом и сливками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть не увидит он русел, рек и сезонных потоков мёда и сливок».'
    reason: Еврейские слова могут обозначать потоки, водные русла, реки и сезонные ручьи; отрицательная конструкция также допускает оттенок пожелания.
lexical_decisions:
- source_word: אַל יֵרֶא
  choice: не увидит он
  rationale: Сочетание אַל с имперфектом в поэтическом описании участи нечестивого передано как отрицание будущего результата. Это естественно по-русски и соответствует контексту, хотя грамматически возможен и оттенок пожелания.
- source_word: בִפְלַגּוֹת
  choice: водных потоков
  rationale: פְלַגּוֹת обозначает потоки или водные русла. Предлог ב при глаголе зрения передан идиоматически, без буквального «в».
- source_word: נַהֲרֵי
  choice: рек
  rationale: Сохранён отдельный образ рек, входящий в поэтическое нагнетание картин изобилия.
- source_word: נַחֲלֵי
  choice: ручьёв, текущих
  rationale: נַחֲלֵי может означать ручьи, потоки или русла сезонных рек. «Ручьёв, текущих» естественно связывает образ с мёдом и сливками и не опускает отдельную еврейскую лексему.
- source_word: דְּבַשׁ
  choice: мёдом
  rationale: Обычный и контекстуально ясный эквивалент образа изобилия.
- source_word: וְחֶמְאָה
  choice: и сливками
  rationale: חֶמְאָה может обозначать густой молочный продукт, сливки, масло или простоквашу. «Сливки» сохраняют текучесть образа и звучат естественнее, чем текущие «масло» или «творог».
theological_decisions:
- issue: Значение отрицательной конструкции אַל יֵרֶא
  choice: Утверждение о том, что нечестивый не увидит благословения
  alternative: 'Пожелание: «Пусть не увидит он…»'
  rationale: Контекст речи о грядущей участи нечестивого поддерживает результативное чтение, но возможный волитивный оттенок не превращён в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной поэтической образности и трёхчастного нагнетания водных образов. Инверсия «Не увидит он» поддерживает стихотворный ритм, оставаясь понятной современному читателю.
