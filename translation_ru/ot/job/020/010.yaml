lexical_decisions:
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Существительное стоит во множественном числе мужского рода с суффиксом 3-го лица мужского рода единственного числа; перевод сохраняет грамматически точное значение.
- source_word: יְרַצּוּ
  choice: будут искать благосклонности
  rationale: Пиэль глагола רצה здесь может обозначать стремление добиться расположения или умилостивить тех, кому причинили зло. Выбранный оборот естественен по-русски и сохраняет неоднозначность мотива.
- source_word: דַלִּים
  choice: бедных
  rationale: דלים обозначает бедных, нуждающихся или социально слабых; в контексте возмещения наиболее прямо подходит «бедных».
- source_word: יָדָיו
  choice: его собственные руки
  rationale: Буквально «его руки»; слово «собственные» передаёт смысловое противопоставление сыновьям и подчёркивает личное возвращение.
- source_word: תָּשֵׁבְנָה
  choice: возвратят
  rationale: Каузативная форма глагола שוב означает «вернуть, восстановить»; «возвратят» сохраняет образ рук как подлежащего.
- source_word: אוֹנוֹ
  choice: его богатство
  rationale: אוֹן может означать богатство, имущество, достояние или силу. Контекст возвращения бедным делает материальный смысл наиболее вероятным, но иные значения отмечены в сноске.
