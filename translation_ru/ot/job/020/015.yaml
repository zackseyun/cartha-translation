  text: חַ֣יִל בָּ֭לַע וַ/יְקִאֶ֑/נּוּ מִ֝/בִּטְנ֗/וֹ יוֹרִשֶׁ֥/נּוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/015.yaml
  text: He swallowed wealth[a], but he will vomit it up[b]; God will drive it out of his belly.
translation:
  language: ru
  text: Богатство проглотил он, но извергнет его; из его чрева исторгнет его Бог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיִל
  choice: богатство
  rationale: В данном контексте слово обозначает материальное достояние; «богатство» естественно передаёт смысл и согласуется с образом неправедно приобретённого добра.
- source_word: בָּלַע
  choice: проглотил
  rationale: Сохраняет буквальный образ поглощения, который продолжают глагол «извергнет» и упоминание чрева.
- source_word: וַיְקִאֶנּוּ
  choice: но извергнет его
  rationale: Глагол означает «извергать, выблёвывать». Будущее время уместно в последовательности описываемого воздаяния, а союз «но» ясно передаёт контраст, не меняя сути связи.
- source_word: מִבִּטְנוֹ
  choice: из его чрева
  rationale: «Чрево» сохраняет яркий телесный образ и звучит dignified в поэтическом контексте; более клиническое «желудок» ослабило бы образ.
- source_word: יוֹרִשֶׁנּוּ
  choice: исторгнет его
  rationale: В каузативной форме глагол здесь выражает принудительное удаление проглоченного богатства. «Исторгнет» передаёт насильственное изгнание и поддерживает поэтический параллелизм.
- source_word: אֵל
  choice: Бог
  rationale: Прямое и контекстуально точное соответствие обычному обозначению Бога; субъект божественного действия сохранён явно.
theological_decisions:
- issue: Кто производит изгнание богатства как акт суда
  choice: 'Бог прямо назван субъектом: Он исторгает богатство из чрева нечестивого.'
  alternative: Представить потерю как безличное последствие либо оставить действующее лицо неопределённым.
  rationale: Еврейский текст прямо называет אֵל субъектом глагола יוֹרִשֶׁנּוּ, поэтому божественную причинность нельзя смягчать или устранять.
translation_notes:
  register: Современный литературный русский с сохранением сжатого поэтического параллелизма и резкой телесной метафоры. Инверсия в последней строке подчёркивает явное действие Бога и остаётся естественной для библейской поэзии.
