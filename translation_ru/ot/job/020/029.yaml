base_translation:
  language: en
  yaml_path: translation/ot/job/020/029.yaml
  text: This is the portion of a wicked man from God[a], the inheritance appointed for him from the Mighty One.
translation:
  language: ru
  text: 'Вот доля нечестивого человека от Бога,

    и наследие, назначенное ему[a] от Всесильного.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и наследие его слова от Бога». Еврейское выражение можно понять более буквально как «его слово» или «его изречение»; по контексту, вероятно, имеется в виду участь, которую Бог изрёк или назначил ему.'
    reason: Сохраняется существенная лексическая неоднозначность אִמְרוֹ.
lexical_decisions:
- source_word: זֶה
  choice: Вот
  rationale: Указательное слово вводит итоговое заключение Софара; русское «вот» естественно передаёт эту итогово-указательную функцию.
- source_word: חֵלֶק
  choice: доля
  rationale: Слово обозначает уделённую долю или выпавший удел; «доля» сохраняет образ назначенного исхода и хорошо сочетается с параллельным «наследие».
- source_word: אָדָם רָשָׁע
  choice: нечестивого человека
  rationale: Передан общий смысл единственного числа без сужения высказывания до конкретного мужчины; «нечестивый» соответствует нравственно-религиозной окраске רָשָׁע.
- source_word: מֵאֱלֹהִים
  choice: от Бога
  rationale: В контексте речь идёт о едином Боге как источнике назначенной нечестивому участи.
- source_word: וְנַחֲלַת
  choice: и наследие
  rationale: Сохраняется поэтический параллелизм с «долей» и значение того, что кому-либо достаётся или назначается.
- source_word: אִמְרוֹ
  choice: назначенное ему
  rationale: Контекст позволяет понимать существительное, связанное с «говорить», как изречённое или определённое Богом назначение. Такая передача ясна по-русски, а более буквальная возможность сохранена в сноске.
- source_word: מֵאֵל
  choice: Всесильным
  rationale: Титул אֵל передан словом, выражающим силу Бога и сохраняющим поэтическое отличие от אֱלֹהִים в первой строке; творительный падеж естественно выражает действующее лицо при «назначенное».
theological_decisions:
- issue: Обобщающее значение אָדָם в сочетании אָדָם רָשָׁע
  choice: нечестивого человека
  alternative: нечестивца / нечестивого мужчины
  rationale: «Человек» сохраняет обобщающее значение אָדָם и не ограничивает утверждение биологическим полом, тогда как грамматическая форма единственного числа остаётся видимой.
- issue: Толкование אִמְרוֹ
  choice: назначенное ему
  alternative: его слово / изречённое ему
  rationale: В контексте итоговой участи нечестивого выражение, вероятно, указывает на удел, объявленный или определённый Богом. Однако буквальная связь со «словом, изречением» реальна и поэтому не устраняется, а отмечается в сноске.
- issue: Передача божественного титула אֵל
  choice: Всесильным
  alternative: Богом
  rationale: «Всесильный» передаёт смысловую силу титула и сохраняет поэтическую вариативность двух обозначений Бога, не предполагая иного божества.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным ритмом поэтического заключения. Двухстрочное оформление сохраняет параллелизм древнееврейского стиха; архаизмы и конфессионально окрашенные добавления исключены.
