  source_fidelity: 'Временная структура и катофорическая связь с утверждением в ст. 5 переданы верно: «Разве ты не знаешь, что…» естественно выражает риторический вопрос, а «издревле, с тех пор как…» сохраняет два временных указания. Однако «был поселён» сужает שִׂים до идеи заселения/проживания, которой в еврейском тексте нет; речь о помещении человека на землю.'
