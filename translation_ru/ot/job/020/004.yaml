  text: הֲ/זֹ֣את יָ֭דַעְתָּ מִנִּי עַ֑ד מִנִּ֤י שִׂ֖ים אָדָ֣ם עֲלֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/004.yaml
  text: Have you known this from of old[a], since man was placed on the earth?
translation:
  language: ru
  text: Разве ты не знаешь, что издревле, с тех пор как человек был помещён на землю,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲ/זֹאת יָדַעְתָּ
  choice: Разве ты не знаешь, что
  rationale: Вопросительная конструкция имеет риторическую силу. «Разве ты не знаешь» естественно передаёт её по-русски, а «что» вводит содержание знания, раскрываемое далее в стихе 5.
- source_word: מִנִּי עַד
  choice: издревле
  rationale: Кратко и литературно передаёт указание на глубокую древность.
- source_word: מִנִּי שִׂים
  choice: с тех пор как … был поселён
  rationale: Передаёт исходный временной рубеж — время помещения человека на земле — естественной русской конструкцией.
- source_word: שִׂים
  choice: был поселён
  rationale: Глагол שׂים означает «положить, поставить, поместить». В сочетании с человеком и землёй «поселён» звучит естественно и сохраняет пространственный смысл, не добавляя идеи сотворения.
- source_word: אָדָם
  choice: человек
  rationale: Русское «человек» сохраняет грамматическое единственное число и естественно выражает родовое значение — человечество в лице человека.
- source_word: עֲלֵי אָרֶץ
  choice: на земле
  rationale: Прямой и естественный русский эквивалент пространственного выражения.
theological_decisions:
- issue: Относится ли указательное זֹאת к содержанию следующего стиха
  choice: 'Передать катофорически: «знаешь, что…», оставив предложение открытым до стиха 5'
  alternative: «Разве ты не знаешь этого издревле, с тех пор как человек был поселён на земле?»
  rationale: Синтаксис и смысл позволяют понимать «это» как указание вперёд на утверждение стиха 5. Такая передача сохраняет связь стихов и не создаёт впечатления, будто собеседник лично обладал знанием со времени появления человека.
- issue: Родовое значение אָדָם
  choice: человек
  alternative: человечество
  rationale: «Человек» соответствует форме единственного числа и в современном русском естественно употребляется в родовом значении, не ограничивая смысл мужчинами.
translation_notes:
  register: 'Современный литературный русский язык с достоинством поэтической речи. Запятая в конце намеренно сохраняет синтаксическую незавершённость: содержание придаточного раскрывается в Иов 20:5.'
