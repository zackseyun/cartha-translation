  text: אִם תַּמְתִּ֣יק בְּ/פִ֣י/ו רָעָ֑ה יַ֝כְחִידֶ֗/נָּה תַּ֣חַת לְשׁוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/012.yaml
  text: Though evil is sweet in his mouth[a], he hides it under his tongue,
translation:
  language: ru
  text: Хотя зло сладко у него во рту[a], он прячет его под языком,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если зло сладко у него во рту». Еврейскую частицу можно понимать условно («если») или уступительно («хотя»); контекст скорее указывает на уступительное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Хотя
  rationale: В данном контексте частица, вероятнее всего, вводит уступительное придаточное, продолжая описание того, как нечестивый услаждается злом; условное значение «если» сохраняется в сноске как реальная возможность.
- source_word: תַּמְתִּיק
  choice: сладко
  rationale: 'В породе hifil глагол может означать «делать сладким», но при абстрактном подлежащем רָעָה естественно передаёт состояние: зло оказывается сладким, приятным на вкус.'
- source_word: בְּפִיו
  choice: у него во рту
  rationale: Сохраняет конкретный образ рта и естественно сочетается с последующим выражением «под языком».
- source_word: רָעָה
  choice: зло
  rationale: Широкое и естественное обозначение нравственного зла, которым наслаждается нечестивый.
- source_word: יַכְחִידֶנָּה
  choice: он прячет его
  rationale: Глагол выражает сокрытие; местоименный суффикс женского рода относится к רָעָה, что по-русски передано местоимением среднего рода «его» в соответствии со словом «зло».
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: под языком
  rationale: Буквальная пространственная формулировка сохраняет яркий образ скрываемого и смакуемого зла.
theological_decisions: []
