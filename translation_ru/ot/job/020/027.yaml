  yaml_path: translation/ot/job/020/027.yaml
  text: The heavens will reveal his iniquity[b][a], and the earth will rise up against him.
translation:
  language: ru
  text: 'Небеса откроют его беззаконие[a],

    и земля[b] восстанет против него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его вину»; еврейское слово может обозначать как нравственное зло, так и связанную с ним виновность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страна»; однако «земля» лучше соответствует параллели с «небесами» в этом поэтическом контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלּוּ
  choice: откроют
  rationale: Пиэль имперфекта от גלה означает сделать явным, обнаружить. «Откроют» естественно передаёт разоблачение скрытого и сохраняет поэтическое олицетворение небес.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Форма множественного числа уместна для возвышенной поэзии Иова и подчёркивает образ небес как космического свидетеля.
- source_word: עֲוֺנוֹ
  choice: его беззаконие
  rationale: עָוֹן может обозначать как нравственное зло, так и связанную с ним вину. В контексте обличения нечестивого «беззаконие» передаёт прежде всего его неправедность, а возможное значение «вина» сохранено в примечании.
- source_word: וְאֶרֶץ
  choice: и земля
  rationale: Хотя אֶרֶץ может означать также отдельную страну или землю, здесь космический параллелизм с «небесами» указывает на землю как часть мироздания.
- source_word: מִתְקוֹמָמָה
  choice: восстанет
  rationale: Возвратная порода от קום выражает поднятие для противодействия. «Восстанет» сохраняет яркое олицетворение и в сочетании с «против него» ясно передаёт враждебную направленность.
- source_word: לוֹ
  choice: против него
  rationale: Предлог ל при глаголе враждебного выступления получает противительное значение, естественно передаваемое по-русски сочетанием «против него».
