  text: He sucks the venom of cobras[b][a]; the tongue of a viper kills him.
translation:
  language: ru
  text: Он сосёт яд кобр[a][b]; язык гадюки убивает его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голову кобр»; в этом контексте слово «голова», вероятно, употреблено в значении «яд».'
    reason: lexical_alternative
  - marker: b
    text: Точный вид змеи неясен; традиционный перевод — «аспидов».
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: яд
  rationale: Основное значение слова — «голова», однако в данном образе, параллельном смертельному действию языка гадюки, оно, вероятно, обозначает яд. В сноске сохранено буквальное чтение и присущая ему неоднозначность.
- source_word: פְּתָנִים
  choice: кобр
  rationale: Слово обозначает ядовитых змей; «кобры» — ясный современному читателю вариант, не использующий устаревшее «аспиды». Точная зоологическая идентификация остаётся неуверенной и отмечена в сноске.
- source_word: יִינָק
  choice: сосёт
  rationale: Передаёт буквальный и выразительный образ глагола «сосать, высасывать», не заменяя его более общим «пьёт».
- source_word: תַּהַרְגֵהוּ
  choice: убивает его
  rationale: Настоящее время естественно передаёт в поэтической речи неизбежный результат; местоименное дополнение «его» сохранено.
- source_word: לְשׁוֹן
  choice: язык
  rationale: Сохранён конкретный образ еврейского текста; перевод не подменяет язык предполагаемым жалом, клыком или укусом.
- source_word: אֶפְעֶה
  choice: гадюки
  rationale: Современное и понятное обозначение ядовитой змеи; оно не претендует на точную зоологическую идентификацию древнего названия.
