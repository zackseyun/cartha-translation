lexical_decisions:
- source_word: בִּמְלֹאות
  choice: при полноте
  rationale: 'Предлог ב с формой от מלא выражает обстоятельство времени или состояния: «при наполнении», «когда станет полным». Формулировка сохраняет образ полноты и компактность еврейского текста.'
- source_word: שִׂפְקוֹ
  choice: своего достатка
  rationale: שׂפק обозначает достаточность, обилие или достаток. В контексте благополучия нечестивого «достаток» звучит естественно и не сужает смысл до одного лишь богатства.
- source_word: יֵצֶר לוֹ
  choice: ему станет тесно
  rationale: Выражение передаёт образ стеснения, тесноты и бедствия. Буквально-образная русская формулировка сохраняет игру между полнотой достатка и наступающей теснотой, не сводя её к одному виду несчастья.
- source_word: כָּל יַד
  choice: всякая рука
  rationale: Сохранён яркий древнееврейский образ руки как действующей силы; כָּל при единственном числе имеет распределительное значение «всякая».
- source_word: עָמֵל
  choice: бедствующего
  rationale: עָמֵל может обозначать труженика, изнурённого человека или того, кто терпит бедствие. «Бедствующий» передаёт здесь страдание и нужду, не добавляя идеи пассивного угнетения.
- source_word: תְּבוֹאֶנּוּ
  choice: настигнет его
  rationale: Глагол בוא с местоименным дополнением буквально означает «придёт к/на него». В сочетании с враждебно действующей «рукой» глагол «настигнет» естественно выражает угрожающий характер действия.
