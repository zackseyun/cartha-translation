lexical_decisions:
- source_word: יִבְרַח
  choice: убежит
  rationale: Имперфект Qal 3-го лица мужского рода единственного числа от ברח в контексте грядущего возмездия естественно передаётся будущим временем.
- source_word: מִנֵּשֶׁק בַּרְזֶל
  choice: от железного оружия
  rationale: נשק может обозначать оружие или вооружение в широком смысле; сочетание с בַּרְזֶל буквально указывает на оружие из железа.
- source_word: תַּחְלְפֵהוּ
  choice: пронзит его
  rationale: Глагол חלף имеет основное значение прохождения мимо или сквозь; при луке как подлежащем военный контекст подразумевает поражение стрелой навылет. В основном тексте естественно передан вероятный смысл, а более формальный вариант сохранён в примечании.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: медный лук
  rationale: קשת — «лук»; נחושה обозначает медь или бронзу. Традиционное и понятное русское сочетание «медный лук» сохраняет образ металлического оружия, а вещественная неоднозначность отмечена в сноске.
