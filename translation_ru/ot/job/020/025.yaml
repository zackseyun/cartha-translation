  text: He pulls it out[a], and it comes from his body; a flashing point comes from his gall; terrors come upon him.
translation:
  language: ru
  text: Он выдёргивает её[a], и она выходит из его тела; сверкающее острие выходит из его желчи; его охватывают ужасы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть стрелу, упомянутую в предыдущем стихе. Буквально: «он извлекает [её]»; предмет глагола в еврейском тексте не назван. «Сверкающее острие» может также пониматься как блестящий клинок; «желчь» — как желчный пузырь.'
    reason: лексическая и синтаксическая неоднозначность
lexical_decisions:
- source_word: שָׁלַף
  choice: Он вытаскивает её
  rationale: Глагол означает «вытаскивать, извлекать», нередко оружие. Объект в еврейском не выражен; женское местоимение естественно отсылает к подразумеваемой стреле из предыдущего стиха.
- source_word: וַיֵּצֵא מִגֵּוָה
  choice: и она выходит из его тела
  rationale: יָצָא означает выход или появление наружу, а גֵּוָה — тело или туловище. «Тело» понятно современному читателю и не вносит излишней анатомической точности.
- source_word: וּבָרָק
  choice: сверкающее острие
  rationale: בָּרָק буквально обозначает молнию или блеск; в контексте пронзившего человека оружия слово метонимически указывает на блестящее острие. Перевод сохраняет и зрительный образ, и связь с оружием.
- source_word: מִמְּרֹרָתוֹ
  choice: из его желчи
  rationale: מְרֹרָה может обозначать желчь, желчный пузырь или горечь. Здесь телесный контекст поддерживает анатомический смысл; «желчь» сохраняет яркость образа без клинического уточнения.
- source_word: יַהֲלֹךְ עָלָיו
  choice: находят на него
  rationale: Сочетание הָלַךְ с עַל передаёт наступление или схождение чего-либо на человека. Русское выражение «ужасы находят на него» естественно описывает охватывающий его страх.
- source_word: אֵמִים
  choice: ужасы
  rationale: Форма множественного числа обозначает страхи, ужасы или устрашающие явления; «ужасы» сохраняет множественность и силу выражения.
