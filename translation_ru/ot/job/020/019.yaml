  text: כִּֽי רִ֭צַּץ עָזַ֣ב דַּלִּ֑ים בַּ֥יִת גָּ֝זַ֗ל וְ/לֹ֣א יִבֶנֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/019.yaml
  text: For he has crushed and abandoned the poor[a]; he has seized a house and will not rebuild it.
translation:
  language: ru
  text: 'Ибо он сокрушил и оставил бедных;

    захватил дом, но не построит его.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «захватил дом, которого не строил».'
    reason: 'Еврейскую форму וְלֹא יִבְנֵהוּ обычно понимают как указание на последствие: «не построит его». Ввиду поэтического синтаксиса возможно также относительное прочтение: речь о доме, построенном не им.'
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для суда, описанного в контексте; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет достоинство поэтической речи.
- source_word: רִצַּץ
  choice: сокрушал
  rationale: Глагол выражает сильное, конкретное действие — ломать, сокрушать; такой перевод сохраняет образную жестокость исходного текста и не сводит её к более общему «угнетал».
- source_word: עָזַב
  choice: бросал
  rationale: В данном сочетании слово обозначает виновное оставление бедных. «Бросал» звучит естественно по-русски и яснее передаёт жестокость поступка, чем нейтральное «оставлял».
- source_word: דַּלִּים
  choice: бедных
  rationale: Существительное обозначает бедных, слабых или социально уязвимых людей; в этом контексте «бедных» — наиболее прямой и понятный вариант.
- source_word: בַּיִת
  choice: дом
  rationale: Сочетание с насильственным захватом и глаголом «строить» прежде всего указывает на дом как строение или владение, хотя более широкое значение «дом, семейство» возможно в иных контекстах.
- source_word: גָּזַל
  choice: захватил
  rationale: Глагол означает отнять силой, ограбить. «Захватил дом» естественно выражает насильственное присвоение и не создаёт оттенка тайной кражи.
- source_word: וְלֹא יִבֶנֵהוּ
  choice: которого не строил
  rationale: 'Форма несовершенного вида в поэтическом контексте может описывать дом как построенный не захватчиком: он присвоил плод чужого труда. Синтаксически возможно и чтение как последующего результата — «но не построит/не отстроит его»; оно вынесено в примечание.'
