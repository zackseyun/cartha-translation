  text: אִם יַעֲלֶ֣ה לַ/שָּׁמַ֣יִם שִׂיא֑/וֹ וְ֝/רֹאשׁ֗/וֹ לָ/עָ֥ב יַגִּֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/006.yaml
  text: Though his exaltation rises to the heavens[a], and his head reaches to the clouds[b],
translation:
  language: ru
  text: Пусть даже[a] величие его[b] вознесётся до небес и голова его достигнет облаков,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если…». Еврейское אִם может вводить простое условие («если») либо, как здесь по смыслу, уступительное допущение («пусть даже», «хотя»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «высота его», «возвышение его». Еврейское слово может обозначать как буквальную высоту, так и величие или высокое положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Пусть даже
  rationale: В данном поэтическом контексте условная частица вводит уступительное допущение. «Пусть даже» естественно передаёт этот смысл, не превращая его в утверждение о действительном возвышении нечестивого.
- source_word: יַעֲלֶה
  choice: вознесётся
  rationale: Глагол обозначает движение вверх; «вознесётся» сохраняет вертикальный образ и соответствует возвышенному поэтическому регистру.
- source_word: לַשָּׁמַיִם
  choice: до небес
  rationale: Так естественно передаётся предельная высота движения в русском языке и сохраняется величественность образа.
- source_word: שִׂיאוֹ
  choice: величие его
  rationale: Существительное допускает значения высоты, возвышенности и высокого положения. «Величие» естественно сочетается с контекстом возвышения нечестивого, а пространственный оттенок поддерживается глаголом и поясняется в сноске.
- source_word: וְרֹאשׁוֹ
  choice: и голова его
  rationale: Сохранено прямое значение «голова», продолжающее образ человека исполинской высоты; постпозиция местоимения поддерживает поэтический параллелизм.
- source_word: לָעָב
  choice: облаков
  rationale: עָב означает облако или густую облачную массу. Множественное число естественно по-русски и образует ясную параллель с «небесами».
- source_word: יַגִּיעַ
  choice: достигнет
  rationale: Форма выражает достижение некоторого предела; «достигнет» ясно и точно сохраняет пространственную метафору.
