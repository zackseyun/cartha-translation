lexical_decisions:
- source_word: יַחְמֹל עָלֶיהָ
  choice: бережёт его
  rationale: Глагол חמל может означать «щадить», «жалеть», «беречь». Здесь речь идёт о зле, которое нечестивый смакует и не желает выпускать; «бережёт» естественно передаёт заботливое удерживание. Местоимение согласовано с русским словом «зло» из предыдущего стиха.
- source_word: וְלֹא יַעַזְבֶנָּה
  choice: и не отпускает
  rationale: עזב означает «оставлять», «покидать». В образе лакомства во рту «не отпускает» передаёт сознательное нежелание расстаться с ним.
- source_word: וְיִמְנָעֶנָּה
  choice: удерживая
  rationale: מנע обозначает удерживание или сдерживание. Деепричастная форма естественно связывает параллельные действия и передаёт продолжение образа.
- source_word: בְּתוֹךְ חִכּוֹ
  choice: во рту
  rationale: חך буквально означает «нёбо», однако всё выражение описывает удерживание чего-либо во рту. Основной текст передаёт образ естественно по-русски, а буквальное значение отмечено в сноске.
