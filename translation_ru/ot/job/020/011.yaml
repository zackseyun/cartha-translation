lexical_decisions:
- source_word: עַצְמוֹתָיו
  choice: кости его
  rationale: Сохраняет конкретный поэтический образ еврейского עֶצֶם во множественном числе с суффиксом 3-го лица мужского рода.
- source_word: מָלְאוּ
  choice: полны
  rationale: В контексте речи о нынешнем состоянии нечестивого русское настоящее время звучит естественно; еврейский перфект допускает описание состояния, возникшего ранее и сохраняющегося теперь.
- source_word: עֲלוּמָיו
  choice: юношеской силы
  rationale: Передаёт как молодость, так и связанную с ней крепость; форма единственного числа также создаёт ясный антецедент для последующего глагола женского рода.
- source_word: וְעִמּוֹ
  choice: с ним
  rationale: Прямо передаёт значение предлога עִם с местоименным суффиксом.
- source_word: עַל־עָפָר
  choice: во прах
  rationale: Русский библейско-поэтический оборот естественно передаёт образ смерти и погребения, выраженный буквально как лежание на прахе.
- source_word: תִּשְׁכָּב
  choice: ляжет
  rationale: Будущее время соответствует несовершенной форме в данном предсказательном контексте; женский род соотнесён с «силой».
theological_decisions:
- issue: К чему относится подлежащее תִּשְׁכָּב
  choice: 'к юношеской силе: «и она ляжет»'
  alternative: к молодости вообще или к подразумеваемому телу
  rationale: Глагол имеет форму 3-го лица женского рода единственного числа. Контекст вероятнее всего продолжает образ молодости или юношеской силы, однако поэтическая сжатость оригинала не позволяет считать связь совершенно однозначной; примечание сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. «Прах» сохраняет библейский образ смерти, не делая синтаксис архаичным; инверсия «кости его» поддерживает ритм и достоинство речи.
