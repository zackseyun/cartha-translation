  terminology: «Чрево» сохраняет телесную метафору и уместно в литературной поэзии. «Вырвется» передаёт מלט без богословской окраски, которую в современном русском может вызвать «спасётся». «То, что ему дорого» передаёт חמוד, не сужая его до денег или сокровищ.
