  text: כִּ֤י לֹא יָדַ֣ע שָׁלֵ֣ו בְּ/בִטְנ֑/וֹ בַּ֝/חֲמוּד֗/וֹ לֹ֣א יְמַלֵּֽט׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/020/020.yaml
  text: For he knew no quiet in his belly[a]; with his desirable things he will not escape.
translation:
  language: ru
  text: Ведь он не знал покоя в своём чреве[a] — с тем, что ему дорого, он не вырвется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь он не знал довольства в своём желудке; тем, что ему дорого, он не сможет спастись». Возможен также смысл: «Он не спасёт ничего из того, что ему дорого».'
    reason: «Покой» (שָׁלֵו) может означать также довольство или сытость; בטן буквально означает «живот, желудок, чрево». Последняя строка допускает как инструментальное понимание («не избежит беды с помощью желанного»), так и понимание, при котором желанное имущество не будет спасено.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующего суда; «ведь» естественно передаёт пояснительно-причинную связь в русском поэтическом контексте.
- source_word: לֹא יָדַע
  choice: не знал
  rationale: Отрицание с перфектом Qal выражает установившуюся характеристику нечестивого; простой прошедший вид сохраняет лаконичность еврейского текста.
- source_word: שָׁלֵו
  choice: покоя
  rationale: Слово обозначает спокойствие, безмятежность или довольство. «Покой» сохраняет широту значения и хорошо сочетается с образом внутренней ненасытности.
- source_word: בְּבִטְנוֹ
  choice: в своём чреве
  rationale: בטן буквально обозначает живот, чрево, внутренность. «Чрево» сохраняет телесный образ, связанный в контексте с ненасытным аппетитом, и при этом соответствует достоинству поэтической речи.
- source_word: בַּחֲמוּדוֹ
  choice: тем, чего желал
  rationale: Форма от חמד может указывать на желанное или драгоценное для него. Формулировка не сужает смысл исключительно до сокровищ и передаёт личную направленность желания.
- source_word: לֹא יְמַלֵּט
  choice: не спасётся
  rationale: Piel глагола מלט допускает значения «избежать», «спастись», «вырваться». Возвратное «не спасётся» естественно выражает невозможность избавления посредством желанного имущества или приобретений.
theological_decisions:
- issue: Связь желанного с избавлением
  choice: тем, чего желал, он не спасётся
  alternative: из желанного своего ничего не сохранит
  rationale: 'Еврейская конструкция допускает разное понимание: желанное может мыслиться как средство, которым он не избавится, либо как имущество, которое он не убережёт. Основной текст следует инструментальному прочтению, не добавляя идеи о духовном спасении.'
translation_notes:
  register: Современный литературный русский с сохранением сжатого параллелизма и телесного образа оригинала. «Чрево» слегка возвышенно, но понятно и уместно в поэзии Иова; сноска предлагает более буквальное «желудок».
