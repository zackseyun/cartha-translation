lexical_decisions:
- source_word: מֵשִׁיב
  choice: возвращает
  rationale: Причастие породы hифиль от שׁוב означает «заставляет вернуться, возвращает»; настоящее время естественно передаёт форму и контекст речи.
- source_word: יָגָע
  choice: добытое трудом
  rationale: Слово может обозначать как труд, так и его плод; при глаголе «возвращает» предметное значение выражено по-русски ясно и естественно.
- source_word: וְלֹא יִבְלָע
  choice: и не проглатывает его
  rationale: Сохранён конкретный образ глагола בלע «глотать»; местоимение указывает на возвращаемое нажитое.
- source_word: כְּחֵיל תְּמוּרָתוֹ
  choice: богатству, полученному в обмен
  rationale: חֵיל здесь означает имущество или богатство, а תְּמוּרָה — обмен либо полученное взамен. Компактная еврейская конструкция неоднозначна; основной вариант сохраняет экономический смысл без излишнего уточнения трудного כ.
- source_word: וְלֹא יַעֲלֹס
  choice: он не радуется
  rationale: עלס выражает ликование или радость; «не радуется» понятно современному читателю и не ослабляет отрицание.
