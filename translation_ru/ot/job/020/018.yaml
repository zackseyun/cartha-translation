  text: He gives back what he labored for and does not swallow it down; according to the wealth of his exchange[a], he does not rejoice.
translation:
  language: ru
  text: Он возвращает добытое трудом и не проглатывает его; богатству, полученному в обмен, он не радуется.[a]
  philosophy: optimal-equivalence
