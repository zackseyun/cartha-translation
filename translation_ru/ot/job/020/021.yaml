lexical_decisions:
- source_word: אֵין שָׂרִיד
  choice: Ничего не оставалось
  rationale: Сочетание отрицательной экзистенциальной частицы с существительным «уцелевшее, остаток» естественно передаётся как полное отсутствие чего-либо оставшегося.
- source_word: לְאָכְלוֹ
  choice: ему на съедение
  rationale: Сохраняет образ еды или пожирания и значение конструкции с инфинитивом и местоименным суффиксом, не добавляя прямо не выраженного в тексте объяснения.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Обычное выражение следствия, связывающее полное потребление с последующей утратой благополучия.
- source_word: יָחִיל
  choice: не продлится
  rationale: В данном контексте трудная глагольная форма наиболее вероятно говорит о том, что благополучие не сохранится и не будет продолжительным.
- source_word: טוּבוֹ
  choice: его благополучие
  rationale: טוּב буквально обозначает «добро, благо»; здесь речь идёт о достатке и благоприятном положении нечестивого, поэтому «благополучие» передаёт смысл без сужения до одного лишь богатства.
theological_decisions:
- issue: Связь между ненасытным потреблением и утратой благополучия
  choice: Передать её как прямое следствие, выраженное עַל כֵּן, не уточняя сверх текста механизм воздаяния.
  alternative: Добавить, что Бог отнимет богатство или накажет нечестивого.
  rationale: Стих утверждает следствие, но сам по себе не называет действующее лицо и не раскрывает механизм суда; это напряжение следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Формулировка «на съедение» сохраняет исходный образ, а сноска поясняет необычную еврейскую конструкцию. Маркеры сносок поставлены при соответствующих выражениях.
