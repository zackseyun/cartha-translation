  yaml_path: translation/ot/job/020/023.yaml
  text: When he is about to fill his belly[a], he will send against him the burning of his anger and rain it upon him as his food.
translation:
  language: ru
  text: Когда он соберётся наполнить своё чрево, Бог пошлёт на него жар Своего гнева и изольёт его на него, подобно дождю, — в пищу ему[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и изольёт его на него, подобно дождю, когда тот ест». Последняя фраза в еврейском тексте трудна и может обозначать либо гнев как ниспосланную ему пищу, либо время, когда суд постигает его за едой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי לְמַלֵּא
  choice: Когда он станет наполнять
  rationale: 'Сочетание формы היה с инфинитивом в контексте передано как временное обстоятельство: суд постигает нечестивого в момент ожидаемого насыщения. Сохранён конкретный глагол «наполнять», а не более отвлечённое «насыщаться».'
- source_word: בִטְנוֹ
  choice: своё чрево
  rationale: «Чрево» сохраняет яркий телесный образ и в возвышенной поэтической речи звучит естественнее, чем клиническое «желудок».
- source_word: יְשַׁלַּח בּוֹ
  choice: пошлёт на него
  rationale: שלח передано прямым значением «послать», а предлог ב — как направленность враждебного действия.
- source_word: חֲרוֹן אַפּוֹ
  choice: жар Своего гнева
  rationale: Сохранён образ жара, заключённый в חֲרוֹן, при естественном для русского языка построении фразы.
- source_word: וְיַמְטֵר עָלֵימוֹ
  choice: и дождём прольёт его на него
  rationale: Передан каузативный образ ниспосылаемого дождём суда; поэтическая форма עָלֵימוֹ в данном контексте относится к одному нечестивому.
- source_word: בִּלְחוּמוֹ
  choice: в пищу ему
  rationale: Трудное выражение сохранено в его наиболее прямом пищевом значении, без превращения его в однозначное временное придаточное.
theological_decisions:
- issue: Неуказанный субъект глаголов суда
  choice: Субъект обозначен словом «Бог».
  alternative: Оставить местоимение «он» либо прибегнуть к безличной конструкции.
  rationale: Хотя в еврейском субъект не назван прямо, выражение «жар Его гнева» и ближайший контекст указывают на Бога. Явное называние устраняет неестественную для отдельного русского стиха неясность, не добавляя нового богословского положения.
- issue: Связь последней фразы с образом пищи
  choice: Гнев, проливаемый дождём, представлен как пища нечестивому.
  alternative: 'Понимать фразу темпорально: суд обрушивается, когда нечестивый ест.'
  rationale: Форма בִּלְחוּמוֹ допускает трудное сочетание с «его пищей»; основной текст сохраняет эту напряжённую метафору, а временное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической лексикой. Слово «чрево» сохраняет телесную выразительность оригинала; метафора дождя и пищи намеренно не сглажена.
