  text: 'Подобно своему навозу[a], он навеки погибнет; видевшие его скажут: «Где он?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подобно своим отбросам»; или: «Подобно своим испражнениям». В еврейском тексте употреблён намеренно унизительный образ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגֶלֲלוֹ
  choice: Как собственный навоз
  rationale: Существительное גֶּלֶל обозначает навоз или экскременты; «навоз» прямо и естественно передаёт намеренно унизительный образ. Местоименный суффикс отражён словом «собственный».
- source_word: לָנֶצַח
  choice: навеки
  rationale: Передаёт длительность без конца и естественно звучит в поэтическом контексте окончательного исчезновения.
- source_word: יֹאבֵד
  choice: исчезнет
  rationale: Глагол אבד может означать гибель, утрату или исчезновение. Здесь последующий вопрос «Где он?» выдвигает на первый план полное исчезновение; при этом сохраняется смысл окончательной погибели.
- source_word: רֹאָיו
  choice: видевшие его
  rationale: Причастная форма с суффиксом буквально указывает на тех, кто его видел; краткая русская форма сохраняет эту временную неопределённость.
- source_word: יֹאמְרוּ
  choice: скажут
  rationale: Прямое соответствие глаголу אמר; вопросительный характер речи выражен следующей репликой.
- source_word: אַיּוֹ
  choice: Где он?
  rationale: Точно передаёт вопросительное слово места с местоименным суффиксом, без добавления отсутствующего в еврейском «теперь».
