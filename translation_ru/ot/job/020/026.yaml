  yaml_path: translation/ot/job/020/026.yaml
  text: All darkness is hidden up for his treasures[a]; a fire not blown will consume him[c][b]; it will feed on what remains in his tent.
translation:
  language: ru
  text: Всякая тьма припасена для его сокровищ[a]; нераздуваемый огонь пожрёт его и погубит остаток в его шатре[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякая тьма припасена для него». Еврейский оборот труден для понимания: речь может идти либо о бедствии, отложенном для него, либо о том, что скрыто среди его запасов или в его тайниках.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «он погубит уцелевшего в его шатре». «Нераздуваемый огонь» может означать огонь, не зажжённый и не поддерживаемый человеческим дыханием.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל חֹשֶׁךְ
  choice: Всякая тьма
  rationale: Сохраняет образ тьмы как бедствия или суда и передаёт полноту, выраженную כָּל.
- source_word: טָמוּן לִצְפּוּנָיו
  choice: припасена для его сокровищ
  rationale: Передаёт значение сокрытого или отложенного в запас, не устраняя трудность оборота לִצְפּוּנָיו и возможную связь с тайниками или сокровищами.
- source_word: תְּאָכְלֵהוּ אֵשׁ
  choice: огонь … пожрёт его
  rationale: Глагол буквально связан с поеданием; «пожрёт» естественно и выразительно описывает разрушительное действие огня.
- source_word: לֹא נֻפָּח
  choice: никем не раздуваемый
  rationale: Сохраняет образ огня, который не раздувается человеческим дыханием, не делая явный источник огня частью основного текста.
- source_word: יֵרַע שָׂרִיד
  choice: он истребит всё, что осталось
  rationale: В контексте огня передаёт губительное действие над остатком, при этом нейтральное «всё, что осталось» не ограничивает שָׂרִיד значением человека-уцелевшего.
- source_word: בְּאָהֳלוֹ
  choice: в его шатре
  rationale: Буквально сохраняет поэтический образ шатра, который может обозначать также дом и хозяйство.
theological_decisions:
- issue: Источник огня, который «не раздуваем»
  choice: Не называть огонь прямо божественным
  alternative: «Божий огонь» или «огонь, зажжённый Богом»
  rationale: Еврейский текст подразумевает необычный, не поддерживаемый человеком огонь, но прямо не называет его источник; перевод сохраняет эту недосказанность.
- issue: Кого или что обозначает שָׂרִיד
  choice: «всё, что осталось»
  alternative: «уцелевшего»
  rationale: Слово допускает личное и собирательно-предметное понимание; основной текст не должен без необходимости ограничивать смысл остатком семьи либо имущества.
translation_notes:
  register: Современный литературный русский язык с поэтической выразительностью. «Шатёр» сохраняет древний образ жилища; «пожрёт» поддерживает персонификацию огня. Все существенные неоднозначности вынесены в примечания.
