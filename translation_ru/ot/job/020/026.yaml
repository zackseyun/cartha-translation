  source_fidelity: 'Основной смысл передан верно: тьма/бедствие сокрыта или отложена, необычный огонь уничтожает нечестивого, а затем поражает остаток в его шатре. Однако «никем не раздуваемый» добавляет к еврейскому тексту всеобщее «никем» и звучит как характеристика постоянного действия; лучше передать пассивное «не раздуваемый [человеком]» без такого расширения. «Истребит всё, что осталось» несколько размывает единственное שָׂרִיד («уцелевший; остаток»); «остаток» сохраняет исходную компактность и неоднозначность.'
