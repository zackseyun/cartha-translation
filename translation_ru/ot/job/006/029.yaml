  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: ru
  text: 'Пересмотрите, прошу вас: пусть не будет несправедливости. Пересмотрите ещё раз: я всё ещё прав в этом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֻׁבוּ
  choice: одумайтесь
  rationale: Повелительная форма множественного числа от שוב призывает друзей Иова изменить направление своих рассуждений и пересмотреть вынесенное суждение. «Одумайтесь» естественно передаёт этот призыв по-русски, не добавляя конкретного объекта пересмотра.
- source_word: נָא
  choice: же
  rationale: Частица смягчает и одновременно подчёркивает просьбу. В данном настойчивом обращении русское «же» звучит естественнее буквального «пожалуйста».
- source_word: אַל תְּהִי עַוְלָה
  choice: пусть не будет несправедливости
  rationale: Безличная конструкция сохраняет абстрактное существительное и не уточняет сверх текста, кто именно совершает несправедливость.
- source_word: עַוְלָה
  choice: несправедливость
  rationale: 'В споре Иова с друзьями слово имеет нравственно-судебный оттенок: речь идёт о несправедливой оценке или суждении.'
- source_word: וְשֻׁבוּ
  choice: одумайтесь вновь
  rationale: Повтор повеления усиливает настойчивость призыва. «Вновь» сохраняет повторность, не превращая фразу в пространственное возвращение.
- source_word: עוֹד
  choice: по-прежнему
  rationale: 'Передаёт продолжающееся состояние: правота Иова, по его утверждению, сохраняется.'
- source_word: צִדְקִי
  choice: я прав
  rationale: В контексте спора צִדְקִי обозначает правоту или невиновность Иова в рассматриваемом деле. Предикативное «я прав» естественно по-русски и не превращает утверждение в заявление о безгрешном совершенстве.
- source_word: בָהּ
  choice: в этом
  rationale: Местоименный суффикс отсылает к подразумеваемому предмету спора. «В этом» сохраняет неопределённость антецедента; вероятное значение пояснено в сноске.
theological_decisions:
- issue: Смысл утверждения Иова о צִדְקִי
  choice: Иов утверждает, что по-прежнему прав в данном споре.
  alternative: Иов утверждает свою праведность либо говорит, что его правое дело остаётся в рассматриваемом вопросе.
  rationale: Контекст касается оценки Иова его друзьями. Формулировка «я по-прежнему прав в этом» сохраняет нравственно-судебный смысл, но не приписывает Иову притязание на абсолютную безгрешность.
translation_notes:
  register: Современный литературный русский язык; настойчивый, но не архаичный тон. Повтор повеления сохранён, а судебно-нравственная напряжённость передана словами «несправедливость» и «прав».
