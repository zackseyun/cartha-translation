  source_fidelity: В целом перевод точно передаёт структуру пожелания, волевой оттенок וְיֹאֵל, силу «сокрушить», образ руки и итоговую направленность на прекращение жизни. Однако «дал волю Своей руке» добавляет оттенок предоставления руке самостоятельной свободы, тогда как יַתֵּר יָדוֹ буквально говорит о том, чтобы Бог отпустил/освободил Свою руку. Более прямое «простёр Свою руку» было бы иным толкованием и менее безопасно; «отпустил Свою руку» сохраняет образ, но по-русски неестественно. «освободил Свою руку» естественнее и ближе к исходной метафоре.
