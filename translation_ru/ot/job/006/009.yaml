lexical_decisions:
- source_word: וְיֹאֵל
  choice: если бы … согласился
  rationale: Хифиль глагола יאל выражает готовность или согласие. «Согласился» сохраняет волевой оттенок и естественно звучит в контексте страстного пожелания Иова.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Обычное в книге Иова обозначение единого Бога; транслитерация здесь не требуется.
- source_word: וִידַכְּאֵנִי
  choice: сокрушить меня
  rationale: Глагол דכא в интенсивной породе передаёт представление о сокрушении, разрушении; выбранный вариант сохраняет силу речи Иова.
- source_word: יַתֵּר יָדוֹ
  choice: дал волю Своей руке
  rationale: נתר означает отпустить, освободить. В сочетании с «рукой» выражение изображает снятие удерживающей силы перед решительным ударом; русский оборот сохраняет образ и передаёт его смысл.
- source_word: וִיבַצְּעֵנִי
  choice: покончил со мной
  rationale: בצע может означать отсечь, оборвать или довести до конца. В контексте просьбы Иова о смерти эта формулировка естественно передаёт окончательность действия, не уточняя его способ.
theological_decisions:
- issue: Антропоморфное изображение Божьего действия
  choice: Сохранено конкретное выражение «Своей руке».
  alternative: 'Передать абстрактно: «Своей силе» или «Своему суду».'
  rationale: В еврейском тексте рука образно обозначает действие и силу Бога. Сохранение этого образа передаёт эмоциональную напряжённость просьбы Иова и не требует понимания Божьей природы как телесной.
- issue: Желание Иова, чтобы Бог положил конец его жизни
  choice: Прямая и напряжённая просьба сохранена без богословского смягчения.
  alternative: Ослабить формулировку до просьбы об избавлении от страданий.
  rationale: Контекст и глаголы стиха указывают именно на желание окончательной смерти; перевод не должен устранять напряжение речи Иова.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Конструкция продолжает форму пожелания из ближайшего контекста. Заглавная буква в местоимении «Своей» соответствует принятому русскому библейскому регистру; конкретный образ руки сохранён.
