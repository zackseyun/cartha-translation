  rationale: Передаёт оптативное пожелание и эмоциональную силу сетования Иова естественным для русского языка оборотом.
- source_word: שָׁקוֹל יִשָּׁקֵל
  choice: тщательно взвесили
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает значение глагола; наречие передаёт эту эмфазу без неестественного буквального повтора.
- source_word: כַּעְשִׂי
  choice: мою муку
  rationale: Слово допускает значения внутренней муки, досады, раздражения или гнева. В контексте жалобы «мука» естественно обозначает мучительное душевное состояние, не сводя его только к печали или гневу.
- source_word: וְהַוָּתִי
  choice: моё бедствие
  rationale: Существительное обозначает бедствие, гибель или разорение; здесь речь идёт об объективно постигшем Иова несчастье.
- source_word: בְּמֹאזְנַיִם
  choice: на весы
  rationale: Двойственное число обозначает весы; русское сочетание «положить на весы» естественно передаёт образ взвешивания.
- source_word: יִשְׂאוּ
  choice: положили
  rationale: Буквально глагол значит «подняли/понесли», но в сцене взвешивания по-русски естественно сказать, что предмет положили на весы. Неопределённо-личная конструкция сохраняет отсутствие названного деятеля.
- source_word: יָחַד
  choice: вместе с ней
  rationale: Передаёт совместное взвешивание внутренней муки Иова и постигшего его бедствия; местоимение делает связь ясной по-русски.
