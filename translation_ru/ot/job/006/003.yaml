- source_word: יִכְבָּד
  choice: тяжелее
  rationale: Передаёт значение корня כבד «быть тяжёлым». Подразумеваемое подлежащее из предыдущего стиха выражено как «всё это», чтобы фраза была понятна по-русски без чрезмерного уточнения.
- source_word: עַל־כֵּן
