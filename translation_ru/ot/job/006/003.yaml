- source_word: דְּבָרַי
  choice: слова мои
  rationale: Прямо передаёт форму множественного числа и сохраняет слегка возвышенный поэтический порядок слов.
- source_word: לָעוּ
  choice: необузданны
  rationale: Редкий и трудный глагол, вероятно, описывает речь как неконтролируемую, порывистую или сбивчивую. «Необузданны» сохраняет образ сильной, вышедшей из-под контроля речи, не сводя его лишь к неосмотрительности.
