  yaml_path: translation/ot/job/006/012.yaml
  text: Is my strength the strength of stones[a], or is my flesh bronze?
translation:
  language: ru
  text: Разве сила моя — сила камней? Разве плоть моя — бронза?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: разве
  rationale: В обеих частях стиха אִם вводит риторический вопрос; «разве» естественно передаёт ожидаемый отрицательный ответ.
- source_word: כֹּחַ / כֹּחִי
  choice: сила / сила моя
  rationale: «Сила» точно передаёт телесный и личный смысл כֹּחַ; повтор сохраняет еврейский параллелизм.
- source_word: אֲבָנִים
  choice: камней
  rationale: Буквальный конкретный образ подчёркивает недоступную человеку твёрдость и выносливость.
- source_word: בְּשָׂרִי
  choice: плоть моя
  rationale: «Плоть» сохраняет телесный образ оригинала и контраст человеческой хрупкости с бронзой.
- source_word: נָחוּשׁ
  choice: бронза
  rationale: В поэтическом контексте слово обозначает бронзу или медь; «бронза» яснее выражает образ твёрдого, прочного металла.
