base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: ru
  text: Ведь стрелы Всемогущего — во мне[a]; мой дух пьёт их яд[b]; ужасы Бога выстраиваются против меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со мной». Еврейский предлог буквально допускает такое значение, но образы стрел и яда позволяют понимать, что стрелы вонзились в Иова.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их отраву»; это слово может также означать «их ярость».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «становятся в боевой порядок против меня» — военный образ.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь со словами Иова в предыдущем контексте, не сводя её к строго причинному «потому что».
- source_word: חִצֵּי שַׁדַּי
  choice: стрелы Всемогущего
  rationale: Сохраняет военный образ и переводит божественный титул שַׁדַּי привычным русским соответствием.
- source_word: עִמָּדִי
  choice: во мне
  rationale: Буквально предлог допускает значение «со мной», однако образ отравленных стрел и следующая строка указывают на стрелы, уже поразившие Иова и находящиеся в нём.
- source_word: חֲמָתָם
  choice: их яд
  rationale: В непосредственном контексте стрел слово естественно обозначает яд; при этом в сноске сохранено возможное понимание как ярости.
- source_word: שֹׁתָה רוּחִי
  choice: мой дух пьёт
  rationale: Сохраняет яркую метафору еврейского текста и передаёт רוּחִי как внутреннее существо Иова, а не как буквальное дыхание.
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: Божьи ужасы
  rationale: Передаёт конструкцию принадлежности без добавления отсутствующего в тексте глагола «посылает» и сохраняет интенсивность множественного числа.
- source_word: יַעַרְכוּנִי
  choice: выстраиваются против меня
  rationale: Передаёт образ сил, строящихся в боевой порядок против Иова, современным и понятным русским выражением.
theological_decisions:
- issue: Передача божественных наименований שַׁדַּי и אֱלוֹהַּ
  choice: «Всемогущий» и «Бог» соответственно
  alternative: Транслитерировать שַׁדַּי как «Шаддай» или одинаково перевести оба наименования
  rationale: В еврейском стихе употреблены два разных божественных наименования. Их раздельный перевод сохраняет различие и не вводит конфессионального толкования.
- issue: Значение חֲמָתָם
  choice: Конкретный «яд» стрел
  alternative: «Их ярость» или «Его ярость»
  rationale: Образ стрел и глагол «пьёт» поддерживают конкретное значение яда, но возможное абстрактное значение отмечено в сноске.
- issue: Характер связи в выражении בִּעוּתֵי אֱלוֹהַּ
  choice: «Божьи ужасы»
  alternative: «Ужасы от Бога» или «ужасы, посланные Богом»
  rationale: Выбранная формулировка сохраняет сжатость и некоторую неоднозначность еврейской конструкции, не уточняя сверх текста, каким именно образом эти ужасы связаны с Богом.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтических и военных образов оригинала. Тире после «Всемогущего» подчёркивает состояние поражённого стрелами Иова, не усложняя синтаксис.
