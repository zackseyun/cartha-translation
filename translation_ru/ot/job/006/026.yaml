base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: ru
  text: Неужели вы думаете оспаривать слова и считать речи отчаявшегося ветром?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели вы думаете оспаривать слова, когда речи отчаявшегося — ветер?» Еврейская конструкция допускает понимать вторую часть либо как самостоятельное утверждение («речи отчаявшегося — ветер»), либо как продолжение того, что они намерены оспаривать, считая эти речи ветром.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְהוֹכַח
  choice: обличать
  rationale: Инфинитив יכח передаёт направленное против собеседника исправление или порицание; «обличать» сохраняет оценочный и полемический оттенок.
- source_word: מִלִּים
  choice: слова
  rationale: Прямой и сжатый эквивалент, не добавляющий к еврейскому тексту оттенка «всего лишь».
- source_word: תַּחְשֹׁבוּ
  choice: думаете
  rationale: חשב может означать «думать, полагать, намереваться»; в риторическом вопросе «думаете» естественно и не устраняет оттенок намерения.
- source_word: וּלְרוּחַ
  choice: на ветер
  rationale: לְרוּחַ буквально связано с «ветром» и может указывать на тщетность или мимолётность; русское выражение «на ветер» сохраняет образ.
- source_word: אִמְרֵי נֹאָשׁ
  choice: слова отчаявшегося
  rationale: Причастие נֹאָשׁ обозначает человека, потерявшего надежду; субстантивированное «отчаявшегося» лаконично передаёт единственное число и состояние говорящего.
theological_decisions:
- issue: Синтаксическая связь второй части стиха
  choice: 'В основном тексте вторая часть понята как утверждение: «слова отчаявшегося — на ветер».'
  alternative: 'Вся вторая часть может продолжать объект глагола: «и считать слова отчаявшегося ветром».'
  rationale: Краткая еврейская конструкция допускает обе связи; альтернативу следует сохранить в примечании, не превращая неоднозначность в богословски однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Риторическая резкость оригинала сохранена; архаические и конфессионально окрашенные формулы не добавлены.
