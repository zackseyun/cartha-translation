lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: Избавьте меня
  rationale: Побудительная форма породы hифиль от מלט выражает просьбу помочь ускользнуть, избавить от опасности. «Избавьте меня» естественно звучит по-русски и сохраняет отличие от פדה во второй части стиха.
- source_word: מִיַּד
  choice: от руки / из рук
  rationale: Буквальный образ руки передаёт власть и контроль. В первой части сохранено «от руки врага», а при множественном обозначении людей употреблено естественное русское «из рук безжалостных».
- source_word: צָר
  choice: врага
  rationale: צָר обозначает враждебного человека — врага или противника. «Враг» сохраняет единственное число и не сужает значение до военного либо судебного контекста.
- source_word: עָרִיצִים
  choice: безжалостных
  rationale: Существительное во множественном числе обозначает жестоких, насильственных, притесняющих людей. Субстантивированное «безжалостных» кратко и выразительно передаёт нравственную характеристику без политически суженного смысла слова «тираны».
- source_word: תִּפְדּוּנִי
  choice: выкупите меня
  rationale: Глагол פדה означает освобождение, нередко посредством выкупа. «Выкупите меня» сохраняет его отличие от מלט и в данном контексте звучит как конкретное избавление от власти жестоких людей, а не как специально богословский термин.
theological_decisions:
- issue: Передача פדה вне культового и сотериологического контекста
  choice: выкупите меня
  alternative: искупите меня / освободите меня
  rationale: «Выкупите» сохраняет присущую פדה идею освобождения ценой выкупа, но не навязывает слову догматического оттенка, который в современном русском часто связан с «искупить». В то же время оно не сливает этот глагол с מלט — «избавить».
translation_notes:
  register: Современный литературный русский язык с сохранением параллелизма двух просьб. Начальное «или» связывает стих с риторическим перечислением предыдущего контекста. Образ руки сохранён, но число во второй части естественно согласовано с множественным обозначением безжалостных людей.
