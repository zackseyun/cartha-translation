  text: Душа моя отказывается прикасаться к ним[a]; они — словно болезнь моей пищи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой аппетит отказывается прикасаться к ним». Еврейское слово нефеш может означать «душа», «сам человек», а в некоторых контекстах — «аппетит».'
    reason: lexical_alternative
  - marker: b
