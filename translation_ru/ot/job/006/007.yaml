lexical_decisions:
- source_word: מֵאֲנָה
  choice: отказывается
  rationale: Глагол מאן выражает отказ или нежелание; настоящее время естественно передаёт продолжающееся отвращение Иова.
- source_word: לִנְגּוֹעַ
  choice: прикасаться
  rationale: Инфинитив от נגע имеет прямое значение «касаться»; здесь он передаёт отвращение даже к соприкосновению с упомянутой пищей.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נפש может обозначать душу, самого человека, горло или аппетит. Буквальное «душа моя» сохраняет широту и поэтическую антропологию еврейского текста; значение «аппетит» отмечено в сноске.
- source_word: הֵמָּה
  choice: они
  rationale: Местоимение отсылает к тому, что описано в предыдущем стихе; русский эквивалент сохраняет эту анафорическую связь.
- source_word: כִּדְוֵי
  choice: словно болезнь в
  rationale: Трудное сжатое выражение связано с דוה, «болеть, быть больным». Формулировка сохраняет образ болезни и его неясное отношение к пище, не сводя его однозначно к «отвратительной пище».
- source_word: לַחְמִי
  choice: моей пище
  rationale: לחם буквально означает «хлеб», но часто обозначает пищу вообще; здесь общее значение лучше соответствует контексту.
