lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: Разве можно есть
  rationale: Вопросительная частица с нифалем глагола «есть» образует риторический вопрос; такая формулировка естественно передаёт его силу по-русски.
- source_word: תָּפֵל
  choice: пресную пищу
  rationale: Слово обозначает нечто безвкусное, несолёное или неприправленное; существительное «пища» восполняет подразумеваемый предмет и делает фразу ясной.
- source_word: מִ/בְּלִי מֶלַח
  choice: без соли
  rationale: Прямо передаёт отсутствие соли и соответствует обычному русскому выражению.
- source_word: אִם יֶשׁ
  choice: Есть ли
  rationale: В данном параллелизме вводит второй риторический вопрос; отдельное русское предложение сохраняет поэтическую краткость.
- source_word: טַעַם
  choice: вкус
  rationale: Прямой эквивалент, поддерживающий смысловую связь с пресной пищей в первой строке.
- source_word: בְּ/רִיר
  choice: у слизи
  rationale: Редкое и неясное слово, вероятно обозначающее слизистую жидкость или сок; «слизь» сохраняет резкий, непривлекательный образ контекста, а неопределённость отмечена в сноске.
- source_word: חַלָּמוּת
  choice: мальвы
  rationale: Точное значение названия неясно; «мальва» — распространённое научное понимание предполагаемого растения, однако другие толкования приведены в сноске.
