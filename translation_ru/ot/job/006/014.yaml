  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: ru
  text: Отчаявшемуся полагается доброта от друга[b][a], даже если он оставляет страх перед Всемогущим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто отказывает отчаявшемуся в доброте, тот оставляет страх перед Всемогущим». Синтаксис еврейского текста сжат и допускает такое понимание.'
    reason: alternative_reading
  - marker: b
    text: Слово «доброта» передаёт еврейское חֶסֶד, которое может также означать преданную любовь, верность, милость или сострадание.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  choice: отчаявшемуся
  rationale: Форма восходит к корню со значением «таять, растворяться» и метафорически обозначает человека, внутренне сломленного страданием. «Отчаявшемуся» естественно передаёт это состояние по-русски.
- source_word: מֵרֵעֵהוּ
  choice: от друга
  rationale: 'Предлог מִן указывает на источник, а суффикс 3-го лица сохраняет личную связь: ожидаемая поддержка должна исходить от его друга.'
- source_word: חָסֶד
  choice: милость
  rationale: В отношениях между людьми слово обозначает деятельное сострадание и верную, преданную доброту. «Милость» сохраняет нравственную весомость термина; более широкий спектр значений отмечен в сноске.
- source_word: וְיִרְאַת שַׁדַּי
  choice: страх перед Всемогущим
  rationale: Сохранён библейский оборот, включающий как страх, так и благоговение перед Богом.
- source_word: יַעֲזֹב
  choice: оставляет
  rationale: Глагол означает «оставлять, покидать, отказываться». В выбранном синтаксическом прочтении настоящее время естественно выражает обобщённое условно-уступительное высказывание.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Традиционный и понятный русский перевод божественного титула שַׁדַּי в книге Иова.
theological_decisions:
- issue: Синтаксическая связь заключительной части стиха
  choice: Отчаявшемуся полагается милость от друга, даже если сам отчаявшийся оставляет страх перед Всемогущим.
  alternative: Друг, отказывающий отчаявшемуся в милости, оставляет страх перед Всемогущим.
  rationale: Еврейская фраза предельно сжата и допускает оба прочтения. Основной вариант согласуется с обращённым к друзьям упрёком Иова и понимает начальное לַמָּס вместе с חָסֶד как указание на то, что причитается страдающему. Существенная альтернативная трактовка сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка «полагается милость» передаёт подразумеваемую долженствовательность при отсутствии явного глагола; маркеры сносок размещены непосредственно после слова «друга», как в консультационном слое.
