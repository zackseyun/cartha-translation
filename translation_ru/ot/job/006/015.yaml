    issue: Неестественная связь относительного придаточного с «руслами».
    rationale: Фраза «русла потоков, которые исчезают» грамматически относит «исчезают» к руслам, что в современном русском звучит неестественно и несколько затемняет образ. Безопаснее назвать сами потоки пересыхающими, сохранив образ их непостоянства.
  revised_text: Братья мои поступили вероломно, как вади, как русла пересыхающих потоков.
