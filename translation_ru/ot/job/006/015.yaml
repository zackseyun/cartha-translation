  text: Братья мои поступили вероломно, как вади, как русла пересыхающих потоков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: братья мои
  rationale: Буквально передаёт родственный термин «мои братья»; в контексте он может относиться и к близким спутникам Иова, однако основной текст сохраняет семейное обозначение.
- source_word: בָּגְדוּ
  choice: поступили вероломно
  rationale: Глагол выражает неверность и коварное нарушение доверия. Такая формулировка сохраняет нравственную силу слова, не сводя его к одному конкретному акту предательства.
- source_word: כְמוֹ
  choice: как
  rationale: Естественная русская передача сравнительной частицы.
- source_word: נָחַל
  choice: вади
  rationale: В данном контексте имеется в виду характерный для засушливой местности временный водоток, а не постоянная река. Термин сохраняет ближневосточный образ и подготавливает описание сезонного исчезновения воды в следующих стихах.
- source_word: כַאֲפִיק
  choice: как русла
  rationale: אפיק обозначает русло, ложе или канал, по которому течёт вода. «Русла» точно и естественно передаёт гидрографический образ.
- source_word: נְחָלִים
  choice: потоков
  rationale: Во множественном числе слово обозначает потоки или временные водотоки. Здесь выбрано естественное русское «потоков», тогда как засушливый характер образа уже обозначен словом «вади» и пояснён в сноске.
- source_word: יַעֲבֹרוּ
  choice: исчезают
  rationale: 'Основное значение глагола — «проходить, уходить». В контексте сезонных потоков речь идёт об их непостоянстве: вода уходит и пропадает. «Исчезают» ясно выражает этот смысл, который развивается в последующих стихах.'
