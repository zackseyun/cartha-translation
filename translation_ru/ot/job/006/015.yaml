  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: «братья мои», вероломство и образ непостоянного водотока сохранены. Однако «русла потоков, которые исчезают» в русском языке неудачно приписывает исчезновение руслам; в образе речь о временных потоках/водотоках, которые иссякают.'
  naturalness: «Братья мои поступили вероломно» — современно и выразительно. Нужна небольшая синтаксико-образная правка второй части, чтобы избежать неестественного представления об исчезающих руслах.
  terminology: «Вади» оправдано и корректно пояснено. «Вероломно» хорошо передаёт בגד. В сноске следует согласовать альтернативу с основным текстом и яснее обозначить, что נחל — также временный водоток.
  issues:
