  text: Is there injustice on my tongue? Does my palate not discern calamities?[a]
translation:
  language: ru
  text: Есть ли неправда на моём языке? Разве моё нёбо не распознаёт бедствий?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «извращённого» или «гибельного». Еврейское слово может обозначать как пагубные беды и бедствия, так и нравственно извращённые вещи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: Есть ли
  rationale: Естественно передаёт риторический вопрос о наличии чего-либо.
- source_word: בִּלְשׁוֹנִי
  choice: на моём языке
  rationale: Сохраняет телесный образ языка как органа речи, не заменяя его более толковательным выражением.
- source_word: עַוְלָה
  choice: неправда
  rationale: Передаёт нравственную неправильность и несправедливость; в сочетании «на языке» естественно относится к ложной или неправедной речи.
- source_word: אִם
  choice: Разве
  rationale: Вводит второй параллельный риторический вопрос и естественно выражает ожидаемый отрицательный ответ.
- source_word: חִכִּי
  choice: моё нёбо
  rationale: Сохраняет буквальный орган вкуса и основанную на нём метафору распознавания.
- source_word: לֹא יָבִין
  choice: не распознаёт
  rationale: Глагол בין здесь обозначает различение и осмысленное распознавание; этот выбор сочетается с образом нёба.
- source_word: הַוּוֹת
  choice: бедствий
  rationale: Множественное число может обозначать пагубные беды или бедствия; значение не сужается до одного конкретного несчастья, а нравственная альтернатива отмечена в сноске.
