  text: ה֭וֹרוּ/נִי וַ/אֲנִ֣י אַחֲרִ֑ישׁ וּ/מַה שָּׁ֝גִ֗יתִי הָבִ֥ינוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: ru
  text: Научите меня — и я умолкну; объясните мне, в чём я заблуждался.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: Научите меня
  rationale: Побудительная форма от ירה означает «учить, наставлять». «Научите меня» естественно передаёт просьбу Иова указать ему истину и исправить его.
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: и я умолкну
  rationale: Местоимение сохраняет смысловое ударение, а «умолкну» передаёт готовность Иова прекратить возражения, сохраняя возвышенный, но понятный регистр.
- source_word: וּמַה שָּׁגִיתִי
  choice: в чём я заблуждался
  rationale: Буквальное «что я ошибся» по-русски неестественно. В сочетании с последующим глаголом оборот просит указать содержание или характер ошибки; «в чём я заблуждался» сохраняет эту смысловую открытость.
- source_word: הָבִינוּ לִי
  choice: объясните мне
  rationale: Каузатив от בין с לִי означает привести говорящего к пониманию. «Объясните мне» естественно передаёт этот смысл по-русски без тяжеловесного «дайте мне понять».
theological_decisions:
- issue: Характер признания Иова
  choice: Фраза оформлена как просьба указать, в чём он заблуждался, а не как безусловное признание вины.
  alternative: «Покажите мне, как я согрешил»
  rationale: שׁגה обозначает ошибку или уклонение, но само по себе не требует более узкого богословского значения «согрешить». Контекст сохраняет открытым вопрос, действительно ли друзья способны доказать ошибку Иова.
translation_notes:
  register: 'Современный литературный русский язык с краткой, достоинственной интонацией. Множественное число повелительных форм сохранено как обращение Иова к друзьям. Тире передаёт тесную условно-следственную связь: если они наставят его, он умолкнет.'
