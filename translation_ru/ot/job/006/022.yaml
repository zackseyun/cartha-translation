base_translation:
  language: en
  yaml_path: translation/ot/job/006/022.yaml
  text: Have I ever said[a], ‘Give to me,’ or, ‘From your strength[b], pay a bribe on my behalf’?”
translation:
  language: ru
  text: 'Разве я говорил: «Дайте мне» или: «Из своих средств дайте взятку за меня»?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: Разве я говорил
  rationale: 'Вопросительная частица вводит риторическое отрицание: Иов отрицает, что обращался к друзьям с подобной просьбой. Русское «разве» естественно передаёт этот оттенок, не добавляя к тексту временного значения «когда-либо».'
- source_word: הָבוּ לִי
  choice: Дайте мне
  rationale: Форма множественного числа повелительного наклонения с местоименным дополнением прямо и естественно передаётся по-русски.
- source_word: וּמִכֹּחֲכֶם
  choice: Из своих средств
  rationale: כֹּחַ буквально означает «сила», но в контексте денежной выплаты обозначает имеющиеся у адресатов возможности или материальные средства. «Из своих средств» сохраняет экономический смысл и звучит естественно.
- source_word: שִׁחֲדוּ
  choice: дайте взятку
  rationale: Глагол связан с существительным שֹׁחַד, «взятка, подкуп». Перевод сохраняет конкретный и нравственно напряжённый смысл, не нейтрализуя его до общего «заплатите».
- source_word: בַעֲדִי
  choice: за меня
  rationale: Кратко и естественно выражает действие в пользу Иова или от его имени, сохраняя некоторую контекстуальную широту предлога.
theological_decisions: []
