  text: 'темнеющих ото льда[a],

    и на них скрывается снег.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мутнеющих ото льда»; еврейское причастие прежде всего означает «темнеющие», но в этом контексте может подразумевать воду, ставшую мутной из-за зимних условий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֹּדְרִים
  choice: темнеющих
  rationale: Причастие от קדר передаёт потемнение или тёмный вид; форма «темнеющих» сохраняет процессуальный оттенок и естественно согласуется с потоками из предыдущего стиха.
- source_word: מִנִּי
  choice: ото
  rationale: Предлог указывает здесь на причину потемнения; «ото льда» по-русски естественно выражает причинную связь.
- source_word: קָרַח
  choice: льда
  rationale: Слово обозначает лёд или мороз; в параллели со снегом конкретный образ льда наиболее уместен.
- source_word: עָלֵימוֹ
  choice: на них
  rationale: Пространственное выражение с суффиксом множественного числа относится к потокам, упомянутым в контексте.
- source_word: יִתְעַלֶּם
  choice: укрывается
  rationale: Форма глагола передаёт возвратное действие — прятаться, скрываться; «укрывается» сохраняет олицетворённый поэтический образ и допускает представление о снеге, лежащем на потоках.
- source_word: שָׁלֶג
  choice: снег
  rationale: Русское неисчисляемое существительное естественно употребляется здесь без определителя.
