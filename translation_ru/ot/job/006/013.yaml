  yaml_path: translation/ot/job/006/013.yaml
  text: Is my help not within me[a], and has sound wisdom been driven from me?
translation:
  language: ru
  text: Неужели во мне самом нет помощи и от меня изгнана здравая мудрость?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находчивость»; еврейское слово может обозначать практическую мудрость, умение действовать или способность найти выход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאִם אֵין
  choice: неужели … нет
  rationale: 'הַאִם вводит риторический вопрос, а אֵין сохраняет отрицание внутри вопроса: речь идёт об отсутствии у Иова внутренней опоры, а не об утверждении, что помощь у него есть.'
- source_word: עֶזְרָתִי בִי
  choice: во мне самом нет для меня помощи
  rationale: עֶזְרָתִי буквально означает «моя помощь», а בִי — «во мне». Формулировка сохраняет образ искомой внутри себя помощи и передаёт притяжательный суффикс естественным для русского языка оборотом «для меня».
- source_word: תֻשִׁיָּה
  choice: здравомыслие
  rationale: В литературе мудрости слово обозначает здравую, действенную мудрость, практическую рассудительность или способность найти выход. «Здравомыслие» естественно в данном контексте, а более практический оттенок отмечен в сноске.
- source_word: נִדְּחָה מִמֶּנִּי
  choice: прогнано прочь от меня
  rationale: Пассивная форма נדח передаёт удаление или изгнание. Выражение сохраняет сильный пространственный образ еврейского текста, хотя по-русски намеренно звучит несколько напряжённо.
theological_decisions:
- issue: Обладает ли Иов внутренней помощью или отрицает её наличие
  choice: Вопрос выражает отсутствие помощи в нём самом
  alternative: «Разве моя помощь не во мне?» — утверждение, что помощь находится внутри Иова
  rationale: Последовательность הַאִם אֵין естественно понимается как «неужели нет», а параллельная строка говорит об удалённом здравомыслии. Перевод сохраняет согласованное сетование на утрату внутренних ресурсов, не меняя область действия отрицания.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической жалобы. Повтор «во мне… для меня… от меня» частично сохраняет настойчивое самоуказание оригинала; «прогнано прочь» передаёт яркий пассивный образ, не сглаживая напряжённость стиха.
