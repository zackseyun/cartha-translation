lexical_decisions:
- source_word: בְּעֵת
  choice: когда
  rationale: Сочетание предлога с существительным вводит временное придаточное; «когда» естественно передаёт эту связь в современном русском языке.
- source_word: יְזֹרְבוּ
  choice: нагреваются
  rationale: Редкий глагол обозначает нагревание или состояние под воздействием тепла. Возвратная форма по-русски естественно описывает сезонные потоки, не уточняя источник тепла.
- source_word: נִצְמָתוּ
  choice: исчезают
  rationale: Форма нифаля может означать прекращение, уничтожение или исчезновение. В образе временных потоков «исчезают» ясно передаёт, что вода пропадает.
- source_word: בְּחֻמּוֹ
  choice: от зноя
  rationale: Буквально выражение означает «в его/его жаре». Контекст указывает на жару как условие исчезновения воды; «от зноя» сохраняет природный образ и естественно звучит по-русски.
- source_word: נִדְעֲכוּ
  choice: иссякают
  rationale: Глагол может означать угасание или прекращение. Применительно к потокам «иссякают» передаёт прекращение течения, не заменяя образ прямым пояснением.
- source_word: מִמְּקוֹמָם
  choice: на своём месте
  rationale: Существительное буквально означает «место». Формулировка сохраняет неопределённость еврейского текста; более конкретное «в своём русле» вынесено в примечание.
