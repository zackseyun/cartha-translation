translation:
  language: ru
  text: Ревёт ли дикий осёл, когда есть трава, или мычит вол, когда есть корм?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально речь идёт о смешанном корме, или мешанке, для скота.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְהַק
  choice: Ревёт ли
  rationale: Глагол נהק обозначает характерный крик осла. Русское «ревёт» естественно передаёт громкий ослиный крик; более точное «кричит по-ослиному» было бы тяжеловесно.
- source_word: פֶּרֶא
  choice: дикий осёл
  rationale: Слово означает дикого осла, или онагра; «дикий осёл» понятно современному читателю и точно передаёт вид животного.
- source_word: עֲלֵי דֶשֶׁא
  choice: над травой
  rationale: Буквально предлог выражает положение «над/на» траве; в контексте подразумевается, что животному доступна пища. Формулировка сохраняет образ и риторическую недосказанность оригинала.
- source_word: אִם
  choice: или
  rationale: В паре риторических вопросов אִם вводит второй, параллельный вопрос и естественно переводится союзом «или».
- source_word: יִגְעֶה
  choice: мычит
  rationale: Глагол обозначает голос крупного рогатого скота; «мычит» — точный и естественный современный русский эквивалент.
- source_word: שׁוֹר
  choice: вол
  rationale: שׁוֹר обозначает животное из крупного рогатого скота; «вол» сохраняет единственное число, параллелизм с диким ослом и традиционный образ рабочего животного.
- source_word: עַל בְּלִילוֹ
  choice: над своим кормом
  rationale: בְּלִיל — смешанный корм или мешанка для скота. В основном тексте обобщённое «корм» звучит естественно, а более узкое значение отмечено в сноске; местоимение передаёт еврейский суффикс.
