  text: The caravans of Tema looked[c][b][a]; the travelers of Sheba hoped for them.
translation:
  language: ru
  text: Караваны Фемы всматривались[c], путники из Савы надеялись на них[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ждали их». Еврейский глагол может означать и «надеяться», и «ожидать».'
