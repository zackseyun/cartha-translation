  - marker: b
    text: Местоимение «них», вероятно, относится к сезонным потокам, о которых говорится в предыдущих стихах.
    reason: cross_reference
  - marker: c
    text: Буквально еврейское слово может означать «пути» или «дороги», но здесь, вероятно, обозначает караваны, идущие этими путями.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: всматривались
  rationale: Глагол נבט означает «смотреть, вглядываться». В контексте поиска воды форма «всматривались» естественно передаёт направленное, напряжённое ожидание, не добавляя явного объекта, которого нет в этой строке.
- source_word: אָרְחוֹת
  choice: караваны
  rationale: Слово буквально может обозначать «пути», но здесь метонимически относится к караванам, следовавшим этими путями; это подтверждается параллельным обозначением путников из Савы.
- source_word: תֵּמָא
  choice: Фема
  rationale: Традиционная русская библейская передача географического названия Тема.
- source_word: הֲלִיכֹת
  choice: путники
  rationale: Буквально слово связано с хождением или шествиями; в данном параллелизме естественно обозначает людей, совершающих путь.
- source_word: שְׁבָא
  choice: Сава
  rationale: Традиционная русская библейская передача географического названия Шева/Сава.
- source_word: קִוּוּ
  choice: надеялись
  rationale: Глагол קוה допускает значения ожидания и надежды. «Надеялись» передаёт ожидание воды и сохраняет эмоциональное напряжение контекста.
- source_word: לָמוֹ
  choice: на них
  rationale: Местоимение множественного числа сохранено; вероятнее всего, оно отсылает к потокам, описанным выше.
