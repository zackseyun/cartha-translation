  text: 'Ведь теперь вы стали ничем[a]: видите бедствие[b] — и боитесь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по кетиву: «вы стали не». Традиционное чтение имеет «ему/для него»; в контексте это часто понимают как «вы стали ничем» или как указание на сходство с ненадёжным потоком из предыдущих стихов.'
    reason: textual_variant
  - marker: b
