lexical_decisions:
- source_word: כִּי
  choice: А
  rationale: Связывает вывод Иова с предшествующим сравнением друзей с ненадёжными потоками; в русском естественно вводит итоговое противопоставление настоящего ожиданиям.
- source_word: עַתָּה
  choice: теперь
  rationale: Передаёт временное противопоставление между прежними ожиданиями Иова и нынешней реакцией друзей.
- source_word: הֱיִיתֶם לא
  choice: вы стали ничем
  rationale: 'Глагол היה передаёт перемену состояния. Написание לא буквально даёт затруднительное «стали не»; выбранная формулировка сохраняет наиболее вероятный контекстуальный смысл: друзья оказались бесполезными, как потоки из предыдущих стихов.'
- source_word: תִּרְאוּ
  choice: видите
  rationale: Сохраняет основное значение ראה и непосредственность реакции друзей на состояние Иова.
- source_word: חֲתַת
  choice: бедствие
  rationale: Слово допускает значения ужаса, смятения и сокрушительного несчастья. «Бедствие» естественно обозначает увиденное друзьями тяжёлое состояние Иова, не устраняя альтернативного оттенка ужаса.
- source_word: וַתִּירָאוּ
  choice: и боитесь
  rationale: Передаёт вызванную увиденным реакцию друзей; настоящее время естественно звучит в описании их нынешнего поведения.
