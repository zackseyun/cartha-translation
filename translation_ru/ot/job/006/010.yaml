  text: וּ֥/תְהִי ע֨וֹד נֶ֘חָ֤מָתִ֗/י וַ/אֲסַלְּדָ֣ה בְ֭/חִילָה לֹ֣א יַחְמ֑וֹל כִּי לֹ֥א כִ֝חַ֗דְתִּי אִמְרֵ֥י קָדֽוֹשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: ru
  text: 'И это всё же было бы мне утешением: я ликовал бы среди неутихающей боли[a], ведь я не отвергал слов Святого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «я ликовал бы в муке: Он не щадил бы меня». Еврейская фраза здесь трудна и предельно сжата.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: мне утешением
  rationale: Существительное от נחם означает утешение или отраду. «Утешение» естественно для современного русского языка и сохраняет эмоциональный смысл слов Иова.
- source_word: וַאֲסַלְּדָה
  choice: я ликовал бы
  rationale: Редкий глагол סלד допускает разные толкования, но в данном контексте выражает сильную радость или торжество. «Ликовал бы» передаёт интенсивность, не навязывая сомнительный буквальный образ движения.
- source_word: בְחִילָה
  choice: среди неутихающей боли
  rationale: חִילָה может обозначать мучение, корчащую боль или тяжкую муку. Выражение «среди … боли» естественно описывает состояние Иова.
- source_word: לֹא יַחְמֹל
  choice: неутихающей
  rationale: חמל означает «щадить, проявлять жалость». В основном тексте эта сжатая фраза передана через характеристику боли, которой не дают облегчения; более формальное прочтение сохранено в сноске.
- source_word: כִחַדְתִּי
  choice: я не отвергал
  rationale: В породе пиэль כחד может означать скрывать, отрицать или отвергать. При дополнении «слова Святого» глагол «отвергал» естественно передаёт мысль о том, что Иов не отрёкся от Божьих слов, сохраняя некоторую широту исходного значения.
- source_word: אִמְרֵי
  choice: слов
  rationale: Форма сопряжённого множественного числа от אמרה обозначает изречения или слова. Русское «слов» здесь кратко и естественно.
- source_word: קָדוֹשׁ
  choice: Святого
  rationale: Субстантивированное прилагательное выступает как обозначение Бога. Прописная буква передаёт функцию божественного титула без добавочного толкования.
theological_decisions:
- issue: Божественное обозначение קָדוֹשׁ
  choice: Святого
  alternative: святого
  rationale: Контекст указывает на Бога, а не на неопределённого святого человека. Субстантивированная форма с прописной буквы сохраняет силу божественного обозначения.
- issue: Трудная сжатая конструкция בְחִילָה לֹא יַחְמֹל
  choice: среди неутихающей боли
  alternative: в муке, которой Он не щадит
  rationale: Синтаксис еврейского выражения неоднозначен. Основной вариант ясно передаёт боль без облегчения, а сноска сохраняет более формальную конструкцию и явное возможное указание на Бога как действующее лицо.
- issue: Значение כחד по отношению к Божьим словам
  choice: не отвергал
  alternative: не скрывал
  rationale: Оба значения лексически возможны. В контексте исповедания верности «не отвергал» звучит естественнее, но не усиливается до более конфессионального «не отрекался».
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Союз «ведь» естественно вводит основание утешения; двоеточие раскрывает, в чём оно состояло бы. Неоднозначность трудной средней части отмечена сноской.
