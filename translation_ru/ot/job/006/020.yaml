base_translation:
  language: en
  yaml_path: translation/ot/job/006/020.yaml
  text: They are ashamed because they trusted[b][a]; they came there and were disappointed.
translation:
  language: ru
  text: Они устыдились, потому что надеялись; пришли туда[b] — и были посрамлены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были унижены» или «смутились». В еврейском тексте употреблены два близких по смыслу глагола, связанных со стыдом и посрамлением.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пришли к ней» — то есть к сезонному потоку, о котором говорится выше.'
    reason: cross_reference
lexical_decisions:
- source_word: בֹּשׁוּ
  choice: постыжены
  rationale: Форма Qal перфекта 3-го лица множественного числа выражает пережитый стыд или посрамление. Результативное настоящее «постыжены» естественно передаёт состояние путников после несбывшейся надежды.
- source_word: כִּי
  choice: потому что
  rationale: Союз наиболее естественно вводит причину их посрамления — они возлагали надежду на поток.
- source_word: בָטָח
  choice: надеялись
  rationale: Хотя еврейская форма морфологически стоит в 3-м лице единственного числа, окружающие глаголы имеют множественное число, а субъектом по контексту являются караваны; русский перевод согласует сказуемое с коллективным множественным субъектом. «Надеялись» хорошо передаёт упование на ожидаемую воду.
- source_word: בָּאוּ
  choice: пришли
  rationale: Прямое и естественное соответствие Qal перфекту глагола בוא.
- source_word: עָדֶיהָ
  choice: туда
  rationale: Местоименный суффикс женского рода отсылает к сезонному потоку в предшествующем контексте. Наречие «туда» сохраняет указание на место назначения и избегает неестественного для русского рода буквального «к ней».
- source_word: וַיֶּחְפָּרוּ
  choice: и посрамились
  rationale: Глагол חפר здесь означает оказаться пристыженным, смущённым или униженным. «Посрамились» сохраняет оттенок стыда и намеренную смысловую близость к בוש, не сводя выражение только к разочарованию.
