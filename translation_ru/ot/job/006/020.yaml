translation_notes:
  register: Современный литературный русский язык с кратким, поэтическим параллелизмом. Родовая форма еврейского местоимения не воспроизводится буквально, поскольку в русском слово «поток» мужского рода. Смысловое повторение двух глаголов стыда сохранено.
