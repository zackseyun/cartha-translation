  yaml_path: translation/ot/job/006/018.yaml
  text: The paths of their course wind away[a]; they go up into wasteland and perish.
translation:
  language: ru
  text: Их пути извиваются[a], поднимаются в пустошь и исчезают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Караванные тропы сворачивают; они поднимаются в пустыню и пропадают». Еврейский образ труден: слова о путях могут пониматься буквально, в связи с потоками, или относиться к караванным путям и караванам.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: извиваются в сторону
  rationale: Нифаль глагола לפת передаёт извивание или отклонение. Выражение сохраняет образ русел, меняющих направление, не сводя его лишь к караванам.
- source_word: אָרְחוֹת
  choice: пути
  rationale: Основное значение — пути или тропы; здесь слово может обозначать направления водных потоков, хотя возможна и метонимия караванных путей.
- source_word: דַּרְכָּם
  choice: их русел
  rationale: Буквально — «их пути». В контексте пересыхающих потоков «русел» естественно передаёт отнесённость путей к водотокам и избегает тяжёлого повтора, но буквальная и караванная трактовки отмечены в сноске.
- source_word: יַעֲלוּ
  choice: уходят
  rationale: Буквально глагол означает «поднимаются, восходят». В данном трудном образе русское «уходят» передаёт направленное движение в пустошь без неестественного «поднимаются в пустошь»; более буквальная форма сохранена в сноске.
- source_word: בַתֹּהוּ
  choice: в пустошь
  rationale: תֹהוּ означает пустоту, запустение, безлюдную пустошь; выбор подходит к пустынному контексту.
- source_word: וְיֹאבֵדוּ
  choice: и исчезают
  rationale: אבד может означать погибать, теряться или исчезать. Для водных потоков, пропадающих в пустыне, «исчезают» естественно и сохраняет образ.
