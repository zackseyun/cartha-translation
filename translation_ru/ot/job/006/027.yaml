  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: ru
  text: 'Вы даже сироту разыграли бы по жребию[a]

    и своего друга сделали бы предметом торга[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заставили бы [жребий] пасть на сироту»; возможно также: «бросили бы жребий о сироте».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вырыли бы яму своему другу». Значение еврейского глагола здесь неясно; его также понимают как торговлю, торг или использование друга ради выгоды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: даже
  rationale: Частица усиливает обвинение, подчёркивая крайнюю степень бессердечия.
- source_word: יָתוֹם
  choice: сирота
  rationale: Слово обозначает человека, лишившегося отца и потому особенно беззащитного; в современном русском «сирота» звучит естественно и ёмко.
- source_word: תַּפִּילוּ עַל
  choice: разыграли бы по жребию
  rationale: Буквально сочетание означает «заставили бы [жребий] упасть на». Передача через «разыграли бы по жребию» сохраняет образ жребия и ясно выражает отношение к сироте как к объекту раздела или присвоения.
- source_word: תִכְרוּ עַל
  choice: сделали бы предметом торга
  rationale: Глагол труден для толкования. В данном параллелизме вероятен смысл торговли или торга вокруг человека; выбранная формулировка естественна по-русски и не скрывает обвинения в эксплуатации.
- source_word: רֵיעֲכֶם
  choice: своего друга
  rationale: В обращении Иова к собеседникам слово указывает на друга или близкого товарища; «друг» особенно ясно передаёт горечь предательства.
theological_decisions:
- issue: Характер обвинения друзей Иова
  choice: Сохранено условное обвинение в готовности эксплуатировать даже самых беззащитных и близких людей.
  alternative: Передать глаголы как описание уже совершённых поступков.
  rationale: Формы допускают контекстуальное понимание как резкое обобщение поведения; русское условное «разыграли бы… сделали бы» естественно передаёт готовность пойти на такое, не превращая образное обвинение в утверждение о конкретных совершённых действиях.
translation_notes:
  register: Современный литературный русский язык с кратким, резким параллелизмом. Формулировка сохраняет достоинство поэтической речи и одновременно остаётся понятной обычному читателю.
