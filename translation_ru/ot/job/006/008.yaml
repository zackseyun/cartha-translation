source:
  edition: WLC
  text: מִֽי יִ֭תֵּן תָּב֣וֹא שֶֽׁאֱלָתִ֑/י וְ֝/תִקְוָתִ֗/י יִתֵּ֥ן אֱלֽוֹהַּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: ru
  text: О, если бы исполнилась моя просьба и Бог даровал мне то, на что я надеюсь!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы
  rationale: Устойчивое древнееврейское выражение передаёт сильное желание, а не буквальный вопрос «кто даст?». Русское «О, если бы» естественно сохраняет молитвенно-скорбную интонацию.
- source_word: תָּבוֹא שֶׁאֱלָתִי
  choice: исполнилась моя просьба
  rationale: Буквально просьба должна «прийти», но в данном контексте речь идёт о её осуществлении. «Исполнилась моя просьба» ясно и естественно передаёт смысл образного выражения.
- source_word: וְתִקְוָתִי
  choice: то, на что я надеюсь
  rationale: תִּקְוָה может обозначать надежду, ожидание или желаемое. В сочетании с «даровал» здесь естественно понимать слово метонимически — как предмет надежды, не уточняя его сверх контекста.
- source_word: יִתֵּן
  choice: даровал мне
  rationale: Глагол буквально означает «дал». «Даровал» подходит к Богу как субъекту и к желаемому как объекту; добавленное «мне» естественно по-русски и подразумевается формой «моя надежда».
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Единственное число אֱלוֹהַּ означает «Бог»; оснований добавлять титул «Всемогущий» в самом слове нет.
