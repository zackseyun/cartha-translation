    reason: lexical_alternative
lexical_decisions:
- source_word: מַה־כֹּחִי
  choice: Какая у меня сила
  rationale: Риторический вопрос о том, остались ли у Иова силы и способность продолжать; формулировка сохраняет прямоту и образ еврейского текста.
- source_word: כִּי אֲיַחֵל
  choice: чтобы и дальше надеяться
  rationale: Глагол יחל может означать ожидание или надежду. В контексте «и дальше надеяться» естественно передаёт продолжающееся ожидание, не превращая его просто в пассивное промедление.
- source_word: וּמַה קִּצִּי
  choice: И каков мой конец
  rationale: קֵץ обозначает конец или предел. Краткая формулировка сохраняет параллелизм и экзистенциальную напряжённость вопроса.
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: чтобы мне продлевать свою жизнь
  rationale: Буквально выражение говорит об «удлинении души», но здесь это идиома продолжения жизни или стойкого перенесения страданий. Основной перевод передаёт наиболее ясный для современного читателя смысл, а альтернативный оттенок отмечен в сноске.
theological_decisions:
- issue: Неоднозначность между продолжением жизни и продолжением терпеливого ожидания
  choice: 'В основном тексте: «продлевать свою жизнь»'
  alternative: «продолжать терпеть» / «быть терпеливым»
  rationale: Перевод сохраняет связь נֶפֶשׁ с жизнью и не сводит слова Иова к нравственному призыву к терпению; возможный оттенок стойкости указан в сноске.
translation_notes:
  register: Современный литературный русский язык; сохранены два параллельных риторических вопроса, краткость и напряжённый тон жалобы Иова.
