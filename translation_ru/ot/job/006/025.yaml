- source_word: מַה נִּמְרְצוּ
  choice: Как убедительны
  rationale: Первое מַה выражает восклицательную степень. Редкий глагол מרץ допускает оттенки силы, убедительности и болезненности; «убедительны» естественно передаёт действенную силу правдивой речи, не сводя её лишь к резкости.
- source_word: אִמְרֵי יֹשֶׁר
  choice: слова правды
  rationale: Конструкция обозначает слова, которым свойственны прямота, правота и честность. «Слова правды» звучит естественно по-русски и сохраняет нравственный смысл יֹשֶׁר.
- source_word: וּמַה
  choice: Но что
  rationale: Союз в контексте вводит противопоставление между действенностью правдивых слов и упрёками друзей.
- source_word: יוֹכִיחַ הוֹכֵחַ
  choice: доказывают ... упрёки
  rationale: Обе формы восходят к корню יכח, который охватывает значения доказательства, спора, обличения и упрёка. Русский перевод распределяет эти оттенки между глаголом и существительным, сохраняя риторический вопрос.
- source_word: מִכֶּם
  choice: ваши
  rationale: 'Предлог מן указывает на источник: упрёки исходят от собеседников Иова. Притяжательное «ваши» передаёт это естественно и кратко.'
