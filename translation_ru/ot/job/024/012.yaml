  yaml_path: translation/ot/job/024/012.yaml
  text: From the city the dying groan[a], and the soul of the slain cries out for help[b], yet God does not regard it as folly.
translation:
  language: ru
  text: Из города доносятся стоны людей[a], и душа убитых взывает о помощи, но Бог не считает это безумием[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умирающих». Еврейское מְתִים понимают по-разному; в масоретской форме оно обычно означает «люди» или «мужчины».'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная еврейская фраза трудна. Возможны переводы: «но Бог не вменяет этого в вину» или «но Бог не считает это предосудительным». Её также понимают как жалобу на то, что Бог не откликается на этот вопль.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעִיר
  choice: Из города доносятся
  rationale: Предлог מִן естественно обозначает источник звука; такая формулировка сохраняет образ стонов, исходящих из города, и звучит по-русски естественно.
- source_word: מְתִים
  choice: умирающих
  rationale: Слово допускает понимание «люди», однако параллель с убитыми и контекст смертельного страдания поддерживают значение «умирающие».
- source_word: יִנְאָקוּ
  choice: стоны
  rationale: Глагол обозначает слышимый стон от страдания; конструкция «доносятся стоны» естественно сочетается с «из города».
- source_word: וְנֶפֶשׁ חֲלָלִים
  choice: и души убитых
  rationale: נֶפֶשׁ сохранено как «души», а חֲלָלִים передано как «убитые», то есть поражённые насмерть. Русское множественное число согласует собирательный образ с последующим глаголом.
- source_word: תְּשַׁוֵּעַ
  choice: взывают о помощи
  rationale: Форма выражает отчаянный призыв о помощи; перевод явно передаёт подразумеваемую просьбу о спасении.
- source_word: וֶאֱלוֹהַּ
  choice: но Бог
  rationale: Союз получает противительное значение из контраста между человеческим страданием и отсутствием видимой Божьей реакции.
- source_word: לֹא יָשִׂים תִּפְלָה
  choice: не считает это безумием
  rationale: Трудное сочетание буквально связано с тем, чтобы не приписывать или не вменять תִּפְלָה — безрассудство, нелепость или предосудительность. Формулировка сохраняет неопределённый референт «это» и не превращает выражение в однозначно юридическое обвинение.
theological_decisions:
- issue: Кажущееся бездействие Бога перед лицом насилия
  choice: но Бог не считает это безумием
  alternative: но Бог не вменяет вины; но Бог не обращает внимания на вопль
  rationale: Перевод сохраняет резкое напряжение жалобы Иова и не добавляет отсутствующего в стихе богословского разрешения. Неопределённость того, к чему относится заключительная фраза — к происходящему, к деяниям угнетателей или к воплю, — отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис передаёт параллелизм двух воплей и резкий противительный поворот в последней строке; подлинная лексическая и смысловая неоднозначность вынесена в сноски.
