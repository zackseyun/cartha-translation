source:
  edition: WLC
  text: כִּ֤י יַחְדָּ֨ו בֹּ֣קֶר לָ֣/מוֹ צַלְמָ֑וֶת כִּֽי יַ֝כִּ֗יר בַּלְה֥וֹת צַלְמָֽוֶת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/017.yaml
  text: For deep darkness is morning to them all[c][b][a], for they are familiar with the terrors of deep darkness.
translation:
  language: ru
  text: Ведь для всех них утро — глубокая тьма[a][b], ведь каждый знаком с ужасами глубокой тьмы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь утро для всех них подобно глубокой тьме». Еврейская конструкция предельно кратка и допускает такое понимание.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово צַלְמָוֶת (цалмавет) можно также перевести как «смертная тень». Здесь оно, вероятно, означает непроглядную тьму или мрак.
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте глагол стоит в единственном числе: буквально «он знает (распознаёт)». Вероятно, это обобщённое указание на каждого из нечестивых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит объяснение продолжающегося описания нечестивых; «ведь» естественно передаёт пояснительно-причинный оттенок.
- source_word: יַחְדָּו
  choice: для всех них
  rationale: Буквально наречие означает «вместе», но здесь имеет собирательно-распределительный смысл; такая передача звучит естественно по-русски и сохраняет отнесённость ко всей группе.
- source_word: בֹּקֶר
  choice: утро
  rationale: Основное значение слова; оно сохраняет резкое противопоставление глубокой тьме.
- source_word: לָמוֹ
  choice: для них
  rationale: Местоименная форма обозначает отношение к названной группе и естественно входит в русское именное предложение.
- source_word: צַלְמָוֶת
  choice: глубокая тьма
  rationale: В книге Иова слово часто обозначает густую тьму или мрак, не обязательно саму смерть. Современная передача не вносит в контекст лишнего прямого указания на смерть.
- source_word: יַכִּיר
  choice: каждый знаком
  rationale: Еврейский глагол стоит в 3-м лице единственного числа и может иметь распределительно-обобщающий смысл по отношению к группе нечестивых. «Каждый знаком» сохраняет единственное число и передаёт опытное знание.
- source_word: בַּלְהוֹת
  choice: ужасами
  rationale: Множественное число обозначает ужасы, пугающие явления или внезапные бедствия; «ужасы глубокой тьмы» естественно передаёт сочетание с последующим существительным.
theological_decisions:
- issue: Соотношение утра и глубокой тьмы в первой половине стиха
  choice: «для всех них утро — глубокая тьма»
  alternative: «утро для всех них подобно глубокой тьме»
  rationale: Компактная еврейская именная конструкция допускает несколько способов связать её члены. Основной текст сохраняет резкое отождествление, а примечание указывает более явно сравнительное понимание, не устраняя исходной неоднозначности.
- issue: Число подразумеваемого субъекта יַכִּיר
  choice: «каждый знаком»
  alternative: «они знакомы» или «он знает»
  rationale: Так сохраняется грамматическое единственное число и одновременно становится ясно, что речь идёт о каждом представителе ранее описанной группы, без введения отдельного персонажа.
translation_notes:
  register: Современный литературный русский язык; краткий, мрачный и ритмически плотный строй оригинала сохранён. Лексика понятна широкому читателю, а тире передаёт бессоюзную именную конструкцию без избыточного пояснения.
