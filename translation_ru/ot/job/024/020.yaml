  yaml_path: translation/ot/job/024/020.yaml
  text: The womb forgets him[a]; the worm feeds sweetly on him. He is remembered no more[b], and injustice is broken like a tree.
translation:
  language: ru
  text: Утроба забудет его; червь будет лакомиться им[a]. Больше о нём не вспомнят, и несправедливость будет сломлена, как дерево[b].
  philosophy: optimal-equivalence
  footnotes:
