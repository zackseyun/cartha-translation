    text: 'Или: «неправедный будет сломлен, как дерево». В еврейском тексте стоит абстрактное существительное «несправедливость, неправедность», которое здесь может обозначать неправедного человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁכָּחֵהוּ
  choice: забудет его
  rationale: Форма от שׁכח с местоименным суффиксом передаёт действие, направленное на мужчину; будущее время естественно согласуется с описанием его посмертной участи.
- source_word: רֶחֶם
  choice: утроба
  rationale: Сохранён буквальный и выразительный образ материнской утробы, которая забывает умершего; пояснительное «мать» в текст не добавляется.
- source_word: מְתָקוֹ רִמָּה
  choice: червь найдёт его сладким
  rationale: Передан образ сладости, связанный с червём как грамматическим субъектом, без устранения мрачной метафоры; более идиоматическое понимание вынесено в примечание.
- source_word: רִמָּה
  choice: червь
  rationale: Единственное число еврейского существительного сохранено и может пониматься собирательно.
- source_word: עוֹד לֹא יִזָּכֵר
  choice: Больше о нём не вспомнят
  rationale: Русская неопределённо-личная конструкция естественно передаёт еврейский пассив и значение прекращения всякого воспоминания.
- source_word: וַתִּשָּׁבֵר
  choice: будет сломлена
  rationale: Пассивное значение שׁבר сохранено; будущее время поддерживает последовательное описание ожидаемой участи.
- source_word: כָּעֵץ
  choice: как дерево
  rationale: Сохранено прямое сравнительное значение и основной смысл עֵץ.
- source_word: עַוְלָה
  choice: неправда
  rationale: Выбрано современное литературное слово, сохраняющее абстрактную форму еврейского существительного и охватывающее нравственное зло и несправедливость.
theological_decisions:
- issue: Следует ли понимать עַוְלָה абстрактно как неправду или конкретно как неправедного человека?
  choice: «неправда будет сломлена, как дерево»
  alternative: «неправедный будет сломлен, как дерево»
  rationale: В еврейском тексте стоит абстрактное существительное. Основной перевод сохраняет эту форму и присущую ей напряжённость образа, а возможное метонимическое обозначение злодея отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, суровым поэтическим строем. Буквальные образы утробы, сладости для червя и сломанного дерева сохранены; синтаксис сделан понятным без конфессионального истолкования.
