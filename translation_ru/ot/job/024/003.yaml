lexical_decisions:
- source_word: חֲמוֹר
  choice: осла
  rationale: Обычное современное обозначение домашнего вьючного животного; форма единственного числа соответствует еврейскому тексту.
- source_word: יְתוֹמִים
  choice: у сирот
  rationale: Еврейское слово стоит во множественном числе. Русская конструкция «осла у сирот» естественно передаёт принадлежность, не устраняя возможность коллективного или распределительного понимания.
- source_word: יִנְהָגוּ
  choice: угоняют
  rationale: Глагол נהג означает «вести, гнать»; в контексте насильственного лишения имущества «угоняют» естественно передаёт и действие, и его неправомерный характер.
- source_word: יַחְבְּלוּ
  choice: берут в залог
  rationale: 'Глагол חבל здесь имеет специальное юридико-экономическое значение: брать имущество как обеспечение долга.'
- source_word: שׁוֹר
  choice: вола
  rationale: В земледельческом контексте שׁוֹר обозначает крупное рабочее животное; «вол» — точный и традиционно понятный русский эквивалент.
- source_word: אַלְמָנָה
  choice: у вдовы
  rationale: 'Еврейская конструкция выражает принадлежность: вол принадлежит вдове. Оборот «вола у вдовы» звучит естественно по-русски.'
