lexical_decisions:
- source_word: בַּשָּׂדֶה
  choice: В поле
  rationale: Сочетание предлога ב с существительным שָׂדֶה имеет локативное значение; «в поле» естественно передаёт форму с определённым артиклем.
- source_word: בְּלִילוֹ
  choice: его корм
  rationale: Бְּלִיל означает смешанный корм для скота, а суффикс 3-го лица мужского рода единственного числа прямо передан местоимением «его», хотя его отнесённость в контексте не вполне ясна.
- source_word: יקצירו
  choice: они жнут
  rationale: Глагол קצר обозначает жатву; «жнут» сохраняет конкретный земледельческий образ и сочетается с кормовой культурой.
- source_word: וְכֶרֶם רָשָׁע
  choice: а в винограднике нечестивца
  rationale: В русском для естественной связи с глаголом собирательного значения добавлен предлог «в», которого во второй части еврейского текста явно нет. Рָשָׁע понято как субстантивированное обозначение нечестивого владельца.
- source_word: יְלַקֵּשׁוּ
  choice: собирают остатки урожая
  rationale: Пиэль глагола לקשׁ указывает на сбор поздних плодов или того, что осталось после основного сбора; формулировка передаёт смысл понятнее современному русскому читателю, чем редкое «подбирают» без дополнения.
