  text: עָר֣וֹם הִ֭לְּכוּ בְּלִ֣י לְב֑וּשׁ וּ֝/רְעֵבִ֗ים נָ֣שְׂאוּ עֹֽמֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/010.yaml
  text: They go about naked[a], without clothing; hungry, they carry sheaves.
translation:
  language: ru
  text: Они ходят нагими, без одежды, и, голодные, носят снопы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сноп». В еврейском тексте существительное стоит в единственном числе, но здесь может иметь собирательное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: нагими
  rationale: Передаёт состояние отсутствия одежды или крайней скудости одежды; форма естественно согласована по-русски с подразумеваемым множественным субъектом.
- source_word: הִלְּכוּ
  choice: ходят
  rationale: Настоящее время передаёт изображаемое здесь продолжающееся, обычное положение угнетённых людей.
- source_word: בְּלִי לְבוּשׁ
  choice: без одежды
  rationale: Прямое и ясное соответствие еврейскому выражению отсутствия одежды; повтор усиливает картину лишений.
- source_word: רְעֵבִים
  choice: голодные
  rationale: Сохраняет обычное значение слова, не усиливая его до «изголодавшиеся» или «умирающие от голода».
- source_word: נָשְׂאוּ
  choice: носят
  rationale: Естественно описывает труд людей, переносящих собранный урожай, и поддерживает длительный характер сцены.
- source_word: עֹמֶר
  choice: снопы
  rationale: Хотя существительное имеет форму единственного числа, в данном контексте оно может употребляться собирательно; множественное число естественно при нескольких работниках.
