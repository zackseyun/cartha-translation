lexical_decisions:
- source_word: רֹעֶה
  choice: пожирает
  rationale: Причастие от רעה буквально связано с выпасом и кормлением, однако в данном враждебном контексте описывает хищническое обращение с беззащитной женщиной. «Пожирает» передаёт этот отрицательный смысл и сохраняет образность; буквальная возможность отмечена в сноске.
- source_word: עֲקָרָה
  choice: бесплодную
  rationale: Форма женского рода обозначает женщину, не способную рождать; субстантивированное «бесплодную» естественно по-русски и сохраняет женский род.
- source_word: לֹא תֵלֵד
  choice: которая не рожает
  rationale: Буквально «не рождает / не рожает». Перевод не добавляет прямо не выраженной модальности «не может» и сохраняет поясняющее придаточное.
- source_word: אַלְמָנָה
  choice: вдове
  rationale: Обычное и точное обозначение названной в еврейском тексте социально уязвимой женщины.
- source_word: לֹא יְיֵטִיב
  choice: не делает добра
  rationale: Hифиль глагола יטב означает «делать добро, благодетельствовать, хорошо обращаться». Выбор близок к форме оригинала и сохраняет нравственную оценку.
