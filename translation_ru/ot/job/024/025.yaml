  text: וְ/אִם לֹ֣א אֵ֭פוֹ מִ֣י יַכְזִיבֵ֑/נִי וְ/יָשֵׂ֥ם לְ֝/אַ֗ל מִלָּתִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/024/025.yaml
  text: And if it is not so[a], then who can prove me a liar and make my word into nothing?
translation:
  language: ru
  text: А если это не так, то кто уличит меня во лжи и обратит моё слово в ничто?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: А если это не так
  rationale: Условный оборот вводит вызов, основанный на предшествующих утверждениях Иова; добавление «это не так» естественно для русского языка и сохраняет смысл.
- source_word: אֵפוֹ
  choice: передано логической связью условной конструкции
  rationale: Частица усиливает вывод и риторический переход; в русском оборот «А если… кто…» естественно передаёт эту силу без тяжеловесного «тогда».
- source_word: מִי
  choice: кто
  rationale: Прямое соответствие вопросительному местоимению, вводящему риторический вызов.
- source_word: יַכְזִיבֵנִי
  choice: уличит меня во лжи
  rationale: Hiphil от כזב означает показать кого-либо лжецом или доказать ложность его слов; русский оборот сохраняет личный и полемический оттенок.
- source_word: וְיָשֵׂם לְאַל
  choice: и сведёт … к ничему
  rationale: Идиоматически передаёт буквальное «положит/обратит в ничто», то есть опровергнет или лишит силы.
- source_word: מִלָּתִי
  choice: мои слова
  rationale: Существительное в единственном числе может обозначать высказывание или речь в целом; множественное «слова» звучит естественно по-русски и сохраняет смысл самозащиты Иова.
