  text: יַטּ֣וּ אֶבְיוֹנִ֣ים מִ/דָּ֑רֶךְ יַ֥חַד חֻ֝בְּא֗וּ עֲנִיֵּי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/004.yaml
  text: They turn the needy off the road[b][a]; together the poor of the land hide themselves.
translation:
  language: ru
  text: Они оттесняют нуждающихся с дороги[a]; бедняки страны все вместе скрываются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уводят нуждающихся с пути».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бедняки земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַטּוּ
  choice: оттесняют
  rationale: Порода hифиль глагола נטה выражает побуждение или принуждение свернуть в сторону. «Оттесняют» естественно передаёт причинный смысл и контекст притеснения, не уточняя способ действия.
- source_word: אֶבְיוֹנִים
  choice: нуждающихся
  rationale: אֶבְיוֹן обозначает бедного, нуждающегося и социально уязвимого человека. «Нуждающихся» сохраняет отличие от следующего עֲנִיֵּי, хотя значения слов пересекаются.
- source_word: מִדָּרֶךְ
  choice: с дороги
  rationale: דֶּרֶךְ может означать дорогу, путь или образ действий. Здесь пространственное «с дороги» хорошо сочетается с причинным глаголом и образом вытеснения из общего пространства.
- source_word: יַחַד
  choice: все вместе
  rationale: Наречие выражает совместность или совокупность. «Все вместе» ясно относится к беднякам, которые сообща оказываются вынуждены скрываться.
- source_word: חֻבְּאוּ
  choice: скрываются
  rationale: Пуаль глагола חבא допускает пассивно-результативное понимание («спрятаны») и естественную передачу возвратной формой («скрываются»). Русская форма сохраняет смысл ухода из виду, не добавляя прямо не выраженного деятеля.
- source_word: עֲנִיֵּי אָרֶץ
  choice: бедняки страны
  rationale: עָנִי обозначает бедного, угнетённого или страдающего, а אֶרֶץ — землю либо страну. В социальном контексте «бедняки страны» звучит естественно и не превращает выражение в указание исключительно на сельских жителей.
