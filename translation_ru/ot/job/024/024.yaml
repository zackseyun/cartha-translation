  text: ר֤וֹמּוּ מְּעַ֨ט וְֽ/אֵינֶ֗/נּוּ וְֽ/הֻמְּכ֗וּ כַּ/כֹּ֥ל יִקָּפְצ֑וּ/ן וּ/כְ/רֹ֖אשׁ שִׁבֹּ֣לֶת יִמָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/024.yaml
  text: They are exalted a little while[a], and then they are gone; they are brought low; like all others they are gathered up[c][b], and like the head of a stalk of grain they are cut off.
translation:
  language: ru
  text: Ненадолго они возвышены — и вот их уже нет; они унижены и, как все, собраны[a]; их срезают, как колосья[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унесены» или «удалены». Редкий еврейский глагол допускает различные толкования.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как голова (верхушка) колоса».'
    reason: cultural_note
lexical_decisions:
- source_word: רֹמּוּ מְעַט
  choice: ненадолго они возвышены
  rationale: Форма от רום передаёт возвышение, вероятно в положении или влиянии; מְעַט в связи с последующим исчезновением естественно имеет временной смысл «ненадолго».
- source_word: וְאֵינֶנּוּ
  choice: и вот их уже нет
  rationale: Еврейский оборот буквально означает отсутствие или прекращение присутствия. Морфологически местоименный элемент имеет форму единственного числа, но среди глаголов множественного числа лучше понимать его распределительно и передать русским множественным.
- source_word: וְהֻמְכוּ
  choice: они унижены
  rationale: Пассивная форма выражает низведение из высокого положения и сохраняет контраст с предшествующим «возвышены».
- source_word: כַכֹּל
  choice: как все
  rationale: Сравнительное כ с כל указывает на общую для всех участь; краткое «как все» сохраняет лаконизм и не уточняет сверх текста, о какой именно группе идёт речь.
- source_word: יִקָּפְצוּן
  choice: унесены
  rationale: Редкий и спорный глагол, вероятно, обозначает собирание или удаление. «Унесены» естественно в контексте смерти, но неоднозначность отмечена в сноске.
- source_word: וּכְרֹאשׁ שִׁבֹּלֶת
  choice: как верхушки колосьев
  rationale: רֹאשׁ означает верх или верхушку, а שִׁבֹּלֶת — колос. Русское выражение сохраняет земледельческий образ без избыточного пояснения.
- source_word: יִמָּלוּ
  choice: их срезают
  rationale: В контексте образа колоса глагол, вероятнее всего, описывает срезание; настоящее время по-русски естественно передаёт обобщённую участь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и резкого перехода от возвышения к исчезновению. Формулировка не уточняет, кем именно совершаются унижение, удаление и срезание, поскольку в еврейском тексте действующее лицо не названо.
