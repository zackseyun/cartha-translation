    reason: lexical_alternative
lexical_decisions:
- source_word: לָאוֹר
  choice: На рассвете
  rationale: Буквально сочетание указывает на наступление света; в данном временном контексте естественный русский эквивалент — «на рассвете».
- source_word: יָקוּם
  choice: встаёт
  rationale: Форма глагола קום обозначает, что человек поднимается и приступает к действию; «встаёт» кратко и сохраняет образ исходного текста.
- source_word: רוֹצֵחַ
  choice: убийца
  rationale: Причастие употреблено субстантивно и обозначает человека как убийцу.
- source_word: יִקְטָל
  choice: убивает
  rationale: Здесь употреблён обычный глагол со значением «убивать», отличный от корня רצח в слове «убийца»; перевод сохраняет это лексическое различие.
- source_word: עָנִי וְאֶבְיוֹן
  choice: бедного и нуждающегося
  rationale: Устойчивая пара обозначает социально уязвимых людей; два определения сохранены без сведения их к одному понятию.
- source_word: וּבַלַּיְלָה
  choice: а ночью
  rationale: Союз естественно передан как «а», чтобы выразить временной контраст между рассветом и ночью.
- source_word: יְהִי
  choice: становится
  rationale: Форма היה допускает значение «быть» или «становиться». Здесь «становится» естественно описывает переход к ночной роли, не устраняя сравнения.
- source_word: כַגַּנָּב
  choice: словно вор
  rationale: Префикс כ выражает простое сравнение; «словно вор» звучит естественно и поэтично в современном русском языке.
