lexical_decisions:
- source_word: גְּבֻלוֹת
  choice: межевые знаки
  rationale: Во множественном числе существительное обозначает здесь границы земельных владений, конкретно — знаки, которыми они отмечены. «Межевые знаки» ясно передаёт правовой и общественный контекст.
- source_word: יַשִּׂיגוּ
  choice: передвигают
  rationale: В контексте земельных границ глагол означает незаконное смещение межевых знаков ради захвата чужой земли. «Передвигают» сохраняет конкретность действия, не исключая возможного смысла удаления.
- source_word: עֵדֶר
  choice: стадо
  rationale: Собирательное существительное обозначает стадо, вероятнее всего мелкого скота. Русское «стадо» естественно и не уточняет вид животных сверх исходного текста.
- source_word: גָּזְלוּ
  choice: угоняют
  rationale: Глагол выражает насильственное или незаконное завладение. В сочетании со стадом «угоняют» естественно передаёт кражу скота, сохраняя явный характер присвоения.
- source_word: וַיִּרְעוּ
  choice: и пасут его
  rationale: Глагол רעה здесь означает пасти стадо. Формулировка подчёркивает, что похитители затем открыто обращаются с угнанным стадом как со своим.
