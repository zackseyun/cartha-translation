lexical_decisions:
- source_word: חָתַר בַּחֹשֶׁךְ בָּתִּים
  choice: В темноте он проламывает стены домов
  rationale: חָתַר буквально означает «прокапывать, проламывать» и в контексте кражи указывает на проникновение через стену. Единственное число глагола сохранено, хотя далее текст переходит ко множественному числу; эта смена числа присутствует в еврейском тексте.
- source_word: יוֹמָם
  choice: днём
  rationale: Кратко и естественно передаёт временное значение и подчёркивает противопоставление темноте.
- source_word: חִתְּמוּ לָמוֹ
  choice: они запираются у себя
  rationale: חָתַם имеет значение «запечатывать, закрывать»; сочетание с לָמוֹ допускает смысл самоизоляции или укрытия в дневное время. Русская формулировка передаёт действие естественно, не исключая более буквального варианта.
- source_word: לֹא יָדְעוּ אוֹר
  choice: света они не знают
  rationale: Сохранены глагол «знать» и образ света, чтобы не устранять возможное сочетание буквального и нравственного смыслов.
theological_decisions:
- issue: Возможный нравственно-символический смысл слова אוֹר («свет»)
  choice: Сохранить «свет» без истолкования в основном тексте.
  alternative: Передать как «дневной свет» либо истолковать как «добро».
  rationale: Контекст прежде всего говорит о преступниках, избегающих дневного света, но образ может иметь и нравственный оттенок. Буквальная передача сохраняет эту смысловую напряжённость.
- issue: Смена единственного числа на множественное
  choice: 'Сохранить: «он проламывает… они запираются… они не знают».'
  alternative: 'Унифицировать всё предложение во множественном числе: «они проламывают…».'
  rationale: В масоретском тексте חָתַר стоит в единственном числе, а חִתְּמוּ и יָדְעוּ — во множественном. Смена может переходить от типичного отдельного преступника к целой группе; её не следует бесшумно сглаживать.
