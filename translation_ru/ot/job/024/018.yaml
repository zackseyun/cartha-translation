  text: קַֽל ה֤וּא עַל פְּנֵי מַ֗יִם תְּקֻלַּ֣ל חֶלְקָתָ֣/ם בָּ/אָ֑רֶץ לֹֽא יִ֝פְנֶה דֶּ֣רֶךְ כְּרָמִֽים־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/018.yaml
  text: He is swift on the surface of the waters[a]; their portion in the land is cursed[c][b]; he does not turn toward the way of the vineyards.
translation:
  language: ru
  text: 'Он стремителен на поверхности вод[a];

    их удел на земле проклят[b];

    он не сворачивает на путь к виноградникам[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он лёгок на поверхности вод». Еврейский текст труден; начальные слова можно понимать как указание не на быстроту, а на мимолётность.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст труден; возможно также: «его удел на земле проклят».'
    reason: textual_variant
  - marker: c
    text: 'Буквально: «он не поворачивает к пути виноградников». Возможно, имеется в виду, что он больше не возвращается на возделанную землю или в места благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַל
  choice: стремителен
  rationale: Прилагательное буквально означает «лёгкий», но здесь может передавать быстроту или мимолётность движения. «Стремителен» естественно звучит по-русски и сохраняет вероятный смысл, не устраняя трудность текста, отмеченную в сноске.
- source_word: עַל־פְּנֵי מַיִם
  choice: на поверхности вод
  rationale: Передаёт еврейский образ буквально и вместе с тем естественно для современного русского языка.
- source_word: תְּקֻלַּל
  choice: проклят
  rationale: Форма пуаль от קלל наиболее прямо выражает пассивное значение «быть проклятым»; согласование с русским словом «удел» требует мужского рода.
- source_word: חֶלְקָתָם
  choice: их удел
  rationale: Следует представленной форме с суффиксом множественного числа. «Удел» сохраняет возможные значения доли, владения и наследственной части.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: В сочетании с «уделом» выражение естественно обозначает земельное владение, не исключая более широкого смысла земли.
- source_word: לֹא יִפְנֶה
  choice: не сворачивает
  rationale: Передаёт значение «поворачивать, обращаться к» в контексте пути и не вводит более определённого значения «возвращаться».
- source_word: דֶּרֶךְ כְּרָמִים
  choice: путь к виноградникам
  rationale: Естественная русская передача сочетания, сохраняющая образ дороги, ведущей в область виноградников, хотя буквальное отношение между «путём» и «виноградниками» допускает разные толкования.
