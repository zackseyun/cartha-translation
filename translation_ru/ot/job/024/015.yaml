  text: וְ/עֵ֤ין נֹאֵ֨ף שָׁ֤מְרָֽה נֶ֣שֶׁף לֵ֭/אמֹר לֹא תְשׁוּרֵ֣/נִי עָ֑יִן וְ/סֵ֖תֶר פָּנִ֣ים יָשִֽׂים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/015.yaml
  text: The eye of the adulterer waits for twilight[a], saying, ‘No eye will see me’[b]; and he puts a covering over his face.
translation:
  language: ru
  text: 'Глаз прелюбодея ждёт сумерек[a]; он говорит: «Ни один глаз меня не увидит», — и скрывает своё лицо[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечерней мглы». Еврейское слово обозначает слабый свет в переходное время суток; здесь контекст указывает на наступление вечерней темноты.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и сокрытие лица полагает». То есть он закрывает или маскирует лицо, чтобы его не узнали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵין
  choice: глаз
  rationale: 'Конкретный образ глаза сохранён в обоих случаях: прелюбодей высматривает удобное время и надеется остаться незамеченным.'
- source_word: נֹאֵף
  choice: прелюбодей
  rationale: Причастие мужского рода обозначает мужчину, совершающего прелюбодеяние; «прелюбодей» точно и естественно передаёт смысл.
- source_word: שָׁמְרָה
  choice: ждёт
  rationale: Хотя основной смысл глагола — «стеречь, наблюдать», здесь он означает выжидание наступления темноты.
- source_word: נֶשֶׁף
  choice: сумерки
  rationale: Слово обозначает время слабого света, в данном контексте — вечерние сумерки, благоприятные для тайного поступка.
- source_word: לֵאמֹר
  choice: он говорит
  rationale: Оборот вводит слова или внутреннюю речь прелюбодея; перевод не уточняет, произносит ли он их вслух.
- source_word: תְשׁוּרֵנִי
  choice: меня не увидит
  rationale: Глагол означает «смотреть, видеть»; современная формулировка сохраняет мотив наблюдения.
- source_word: וְסֵתֶר פָּנִים
  choice: скрывает своё лицо
  rationale: Сжатое еврейское выражение буквально говорит о «сокрытии лица»; глагольная передача естественна по-русски и сохраняет смысл маскировки.
- source_word: יָשִׂים
  choice: скрывает
  rationale: Буквально «кладёт, устанавливает»; вместе с выражением о сокрытии лица передано естественным русским глаголом.
