  text: עָר֣וֹם יָ֭לִינוּ מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת בַּ/קָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/007.yaml
  text: They spend the night naked[a], without clothing, and have no covering against the cold.
translation:
  language: ru
  text: Нагими ночуют они, без одежды, и нет у них покрова от холода.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нагими проводят они ночь, без одеяния, и нечем им укрыться в холод».'
    reason: 'Лексические и синтаксические варианты: יָלִינוּ допускает более развёрнутое «проводят ночь», לְבוּשׁ — «одеяние», а בַּקָּרָה можно передать буквально как «в холод».'
lexical_decisions:
- source_word: עָרוֹם
  choice: нагими
  rationale: Прилагательное обозначает отсутствие одежды либо крайнюю скудость одежды. «Нагими» прямо и выразительно передаёт бедственное положение людей и соответствует возвышенно-поэтическому строю стиха.
- source_word: יָלִינוּ
  choice: ночуют
  rationale: Форма от לין означает проводить ночь, ночевать. «Ночуют» — естественный и точный современный русский эквивалент.
- source_word: מִבְּלִי
  choice: без
  rationale: Сочетание выражает отсутствие и лишённость; краткое «без» естественно соединяется с существительным «одежда».
- source_word: לְבוּשׁ
  choice: одежды
  rationale: Существительное может обозначать одежду вообще или отдельное одеяние. В данном контексте родовое «одежда» точнее сохраняет неопределённость.
- source_word: כְּסוּת
  choice: покрова
  rationale: Слово обозначает то, чем укрываются, нередко одежду. «Покров» сохраняет широкий смысл и не уточняет без основания, идёт ли речь об одежде, одеяле или ином укрытии.
- source_word: בַּקָּרָה
  choice: от холода
  rationale: Буквально конструкция может передаваться как «в холоде», однако при существительном «покров» русский оборот «покров от холода» естественно выражает защитную функцию, не меняя сути образа.
