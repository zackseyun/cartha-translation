translation_notes:
  register: Современный литературный русский с сохранением поэтической инверсии начального עָרוֹם и параллелизма двух строк. Лексика dignified, но понятная; «покров» выбрано вместо более конкретного «одеяло», чтобы не сужать значение исходного слова.
