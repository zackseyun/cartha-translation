translation:
  language: ru
  text: Он даёт им безопасность[a], и они опираются[b], а его глаза — на их путях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «ему»; глагол в следующей части также стоит в единственном числе. Множественное число в переводе передаёт собирательный смысл в связи с окончанием стиха: «их путях».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «они поддержаны». Более формально: «Он даёт ему безопасность, и тот опирается; его глаза — на их путях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן ל֣וֹ לָ֭בֶטַח
  choice: Он даёт им жить в безопасности
  rationale: 'Буквально стоит единственное число: «даёт ему безопасность». Однако заключительное דַּרְכֵיהֶם («их путях») указывает на собирательное, распределительное описание нечестивых; по-русски естественно передать его множественным числом. Оборот «жить в безопасности» идиоматично выражает לָבֶטַח, не сводя смысл к внутренней уверенности.'
- source_word: וְיִשָּׁעֵן
  choice: и они находят опору
  rationale: Нифаль от שׁען допускает значения «опираться», «иметь опору», «быть поддерживаемым». «Находят опору» сохраняет образ опоры и звучит естественнее буквального русского пассива; множественное число согласовано с собирательным прочтением первой части.
- source_word: וְעֵינֵיהוּ
  choice: но глаза Его
  rationale: 'Буквально: «и его глаза». Заглавная буква отражает наиболее вероятного в контексте референта — Бога, но имя прямо не добавляется. Союз «но» передаёт контекстуальное напряжение: дарованная безопасность не исключает Божьего наблюдения.'
- source_word: עַל דַּרְכֵיהֶם
  choice: на их путях
  rationale: Сохраняется еврейская метафора דרך — «путь», которая может обозначать как жизненный путь, так и поведение; предлог עַל естественно передан конструкцией «глаза ... на».
theological_decisions:
- issue: Смена единственного и множественного числа
  choice: Передать нечестивых собирательно во множественном числе («им… они… их»), сохранив единственного наблюдающего («Его»).
  alternative: 'Формально: «Он даёт ему безопасность, и тот имеет опору; глаза его — на их путях».'
  rationale: В масоретском тексте לוֹ и форма וְיִשָּׁעֵן стоят в единственном числе, тогда как דַּרְכֵיהֶם — во множественном. Собирательное прочтение сохраняет смысловую связность, а сноска документирует формальную неоднородность.
- issue: Кому принадлежат «его глаза»
  choice: Наиболее вероятно, Богу; это обозначено прописной буквой в местоимении, без вставки имени «Бог».
  alternative: Оставить «его» со строчной буквы и полностью сохранить референциальную неоднозначность.
  rationale: Контекст речи Иова и грамматический переход лучше всего допускают Бога как дающего безопасность и наблюдающего за путями нечестивых. При этом перевод не добавляет отсутствующего в еврейском тексте имени.
- issue: Связь последней части с первой
  choice: Использовать противительный союз «но».
  alternative: Формально сохранить соединительное «и».
  rationale: Еврейский וְ допускает контекстуально-противительное значение. Здесь «но» делает слышимым напряжение между временной безопасностью нечестивых и тем, что Божьи глаза следят за их путями, не определяя заранее исход этого наблюдения.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Сохранены метафоры «опора», «глаза» и «пути». Местоимение «Его» написано с прописной буквы как традиционный русский способ обозначить вероятную отсылку к Богу; явное имя не внесено. Все сноски отмечены в основном тексте.
