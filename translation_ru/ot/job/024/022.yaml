  yaml_path: translation/ot/job/024/022.yaml
  text: Yet he drags away the mighty by his power; he rises up[a], but he has no assurance of life.
translation:
  language: ru
  text: Но сильных он тащит за собой своей силой; он поднимается[a] — и не уверен в своей жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он поднимается — и не полагается на жизнь». Возможна также обобщённая передача: «он поднимается — и никто не уверен в своей жизни». В заключительной части еврейского текста неясно, к кому относится субъект глагола.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁךְ
  choice: увлекает
  rationale: Глагол משׁך означает «тянуть, тащить, увлекать». Здесь он передаёт насильственное подчинение сильных; настоящее время естественно в русском описании поведения нечестивого.
- source_word: אַבִּירִים
  choice: сильных
  rationale: Форма обозначает сильных или могущественных; субстантивированное «сильных» понятно и не сужает смысл до официальной власти.
- source_word: בְּכֹחוֹ
  choice: своей мощью
  rationale: Инструментальное בְ передано творительным падежом; «мощью» выражает силу, которой действует тот же субъект.
- source_word: יָקוּם
  choice: поднимается
  rationale: קום в qal значит «вставать, подниматься». Выбор сохраняет образ и не уточняет без основания, идёт ли речь о выступлении, восстановлении или утверждении.
- source_word: וְלֹא יַאֲמִין בַּחַיִּין
  choice: и не уверен, что останется в живых
  rationale: Буквально конструкция говорит, что он «не уверен в жизни / не полагается на жизнь». Русская формулировка передаёт отсутствие уверенности в сохранении жизни, сохраняя единственное число глагола.
theological_decisions:
- issue: Субъект и смысл заключительной части стиха
  choice: 'Субъектом оставлен тот же человек: «не уверен, что останется в живых».'
  alternative: «И никто не уверен в своей жизни» — безлично-результативное понимание, при котором появление угнетателя делает жизнь других небезопасной.
  rationale: В еврейском стоит глагол мужского рода единственного числа, поэтому наиболее формально естественно соотнести его с прежним субъектом. Однако сжатый синтаксис допускает понимание неопределённого субъекта; оно отмечено в сноске без устранения смысловой напряжённости.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым синтаксисом поэтической речи. Союз «а» передаёт переход к действию угнетателя; тире подчёркивает резкий итог. Формулировки избегают архаизмов и конфессионально обусловленных уточнений.
