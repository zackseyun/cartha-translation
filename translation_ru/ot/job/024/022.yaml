  - severity: low
    issue: Сноска формулирует альтернативу слишком узко как «никто не уверен».
    rationale: Неопределённо-обобщённое понимание возможно, но еврейский текст не содержит слова «никто». Следует представить это как возможную интерпретационную передачу и отметить неясность референта субъекта.
