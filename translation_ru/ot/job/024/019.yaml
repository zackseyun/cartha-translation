  - marker: b
    text: 'Шеол — древнееврейское обозначение мира мёртвых; возможный перевод: «могила».'
    reason: alternative_reading
lexical_decisions:
- source_word: צִיָּה
  choice: засуха
  rationale: Слово обозначает сухость, засушливость; «засуха» естественно выступает действующим началом рядом со «зноем» и сохраняет образ иссушения.
- source_word: גַם חֹם
  choice: и зной
  rationale: גַם присоединяет второй элемент, а חֹם означает жар. «Зной» передаёт сильную жару и соответствует возвышенной поэтической речи.
- source_word: יִגְזְלוּ
  choice: похищают
  rationale: Глагол גזל выражает насильственное отнятие или захват. «Похищают» сохраняет олицетворение засухи и зноя и допускает эллиптическое продолжение во второй половине строки.
- source_word: מֵימֵי שֶׁלֶג
  choice: снеговые воды
  rationale: Сочетание буквально означает «воды снега». «Снеговые воды» сохраняет поэтический образ и не делает обязательным более узкое толкование как уже растаявшей воды.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское обозначение мира мёртвых и не сужает его до отдельной могилы или позднейшего представления об аде.
- source_word: חָטָאוּ
  choice: согрешивших
  rationale: Форма буквально означает «они согрешили». В поэтической конструкции она понимается субстантивированно как обозначение тех, кто согрешил; причастная форма сохраняет глагольный смысл.
theological_decisions:
- issue: Значение שְׁאוֹל
  choice: Сохранено слово «шеол» как обозначение мира мёртвых.
  alternative: «могила», «мир мёртвых» или «смерть»
  rationale: Контекст представляет шеол в поэтическом сравнении и не уточняет его как место окончательного наказания. Транслитерация сохраняет широту исходного понятия.
- issue: Синтаксическая связь שְׁאוֹל חָטָאוּ
  choice: 'Передана эллиптически: «так и шеол — согрешивших», с подразумеваемым глаголом «похищает».'
  alternative: «шеол поглощает согрешивших» или «шеол уносит грешников»
  rationale: В еврейском тексте связь предельно сжата и не содержит отдельного глагола при «шеоле». Эллипсис сохраняет поэтическое напряжение и не вводит отсутствующий образ поглощения.
translation_notes:
  register: Современный литературный русский с лаконичным поэтическим синтаксисом. Слова «зной» и «шеол» поддерживают достоинство библейского регистра; тире во второй половине сохраняет эллипсис исходной строки.
