  yaml_path: translation/ot/job/024/019.yaml
  text: Drought and heat also snatch away the waters of snow[b][a]; so Sheol takes those who have sinned.
translation:
  language: ru
  text: Засуха и зной похищают снеговые воды[a]; так и Шеол[b] похищает тех, кто согрешил.
  philosophy: optimal-equivalence
  footnotes:
