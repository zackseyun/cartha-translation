  text: מִ/זֶּ֣רֶם הָרִ֣ים יִרְטָ֑בוּ וּֽ/מִ/בְּלִ֥י מַ֝חְסֶ֗ה חִבְּקוּ צֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/024/008.yaml
  text: They are drenched by the mountain rains[a]; lacking shelter[b], they embrace the rock.
translation:
  language: ru
  text: От горных ливней[a] они промокают, а без укрытия обнимают скалу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от горного потока»; возможно также: «от горной бури».'
    reason: lexical_alternative
  - marker: b
    text: То есть тесно прижимаются к скале в поисках защиты.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזֶּרֶם הָרִים
  choice: от горных ливней
  rationale: זֶרֶם может обозначать сильный дождь, бурный поток или ливень. В контексте людей, оставшихся без укрытия и промокающих в горах, «от горных ливней» естественно передаёт погодную угрозу, не исключая образа потоков воды.
- source_word: יִרְטָבוּ
  choice: они промокают
  rationale: Глагол означает «становиться мокрыми, промокать». Настоящее время по-русски естественно продолжает описание постоянных бедствий в данном разделе.
- source_word: וּמִבְּלִי מַחְסֶה
  choice: а без укрытия
  rationale: Конструкция выражает отсутствие или нехватку убежища. «Укрытие» ясно передаёт конкретную защиту от непогоды.
- source_word: חִבְּקוּ
  choice: обнимают
  rationale: 'Сохранён буквальный и выразительный образ: лишённые укрытия люди тесно прижимаются к скале. Необычность сочетания намеренно не устранена.'
- source_word: צוּר
  choice: скалу
  rationale: צוּר обозначает скалу или массивный камень. «Скала» лучше передаёт природное место, к которому можно прижаться в поисках защиты.
theological_decisions: []
