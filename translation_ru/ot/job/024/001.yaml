  yaml_path: translation/ot/job/024/001.yaml
  text: Why are times not kept by the Almighty[b][a], and why do those who know him not see his days?
translation:
  language: ru
  text: Почему у Всемогущего не хранятся сроки[a], и почему знающие Его не видят Его дней[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «времена»; возможен смысл: «Почему Всемогущий не хранит назначенные сроки?»'
    reason: lexical_alternative
  - marker: b
    text: «Его дни», вероятно, означает дни, когда Бог действует, вмешивается или вершит суд.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Почему
  rationale: Естественно и точно передаёт вопросительное наречие, вводящее жалобу Иова.
- source_word: מִשַּׁדַּי
  choice: у Всемогущего
  rationale: Предлог מִן при пассивной форме допускает понимание источника или сферы распоряжения. Русское «у Всемогущего» сохраняет эту связь, не сужая её до однозначного обозначения деятеля.
- source_word: נִצְפְּנוּ
  choice: не сокрыты
  rationale: Глагол צפן может означать «скрывать», «хранить», «сберегать». «Сокрыты» сохраняет пассивную форму и поэтическую сжатость, хотя возможен смысл хранения в запасе.
- source_word: עִתִּים
  choice: времена
  rationale: Передаёт множественное число и сохраняет открытым вопрос, имеются ли в виду времена вообще или назначенные сроки.
- source_word: וְיֹדְעָיו
  choice: знающие Его
  rationale: Близко передаёт причастную форму с местоименным суффиксом и сохраняет личностный смысл знания Бога.
- source_word: חָזוּ
  choice: не видят
  rationale: Прямо передаёт חזה; контекст допускает также оттенок восприятия или созерцания.
- source_word: יָמָיו
  choice: Его дней
  rationale: Буквально сохраняет множественное число и намеренно не уточняет, являются ли это дни суда, вмешательства или иного Божьего действия.
theological_decisions:
- issue: Смысл выражения «Его дни» применительно к Богу
  choice: Сохранить буквальное и неоднозначное «Его дней».
  alternative: «дни Его суда»; «дни, когда Он действует»; «назначенные Им дни»
  rationale: Еврейский текст поэтически сжат. Уточнение в основном тексте преждевременно разрешило бы богословское напряжение.
- issue: Отношение времён к Всемогущему
  choice: «у Всемогущего не сокрыты времена»
  alternative: «Всемогущим не сохранены времена»; «от Всемогущего не сокрыты времена»
  rationale: Предлог и значение глагола допускают несколько синтаксических оттенков. Выбранная формулировка сохраняет вопрос о том, почему назначенные сроки не хранятся у Бога или не удерживаются Им в сокрытии.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают достоинство традиционного библейского регистра. Порядок маркеров [a], [b] соответствует местам поясняемых выражений.
