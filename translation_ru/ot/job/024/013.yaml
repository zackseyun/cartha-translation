base_translation:
  language: en
  yaml_path: translation/ot/job/024/013.yaml
  text: These are among those who rebel against the light[a]; they do not recognize its ways[b], and they do not stay in its paths.
translation:
  language: ru
  text: 'Они — из тех, кто восстаёт против света[a]: они не знают его путей[b] и не остаются на его стезях.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они были среди тех, кто восстаёт против света». Древнееврейская форма глагола допускает прошедшее время, но в этом поэтическом контексте, вероятно, характеризует постоянно существующую группу людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его путей… на его стезях». Местоименные суффиксы, вероятнее всего, относятся к слову «свет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הָיוּ
  choice: Они — из
  rationale: Самостоятельное местоимение подчёркивает названную группу, а сочетание с היה и ב выражает принадлежность к классу. Настоящее время передаёт продолжающуюся характеристику, хотя форма הָיוּ допускает прошедшее «были».
- source_word: בְּמֹרְדֵי
  choice: из восстающих
  rationale: Предлог ב здесь указывает на принадлежность к группе, а причастная форма сохраняет активный и продолжающийся характер сопротивления.
- source_word: אוֹר
  choice: света
  rationale: Прямой перевод сохраняет как буквальный образ света, так и возможный нравственный смысл, не сводя выражение только к одному из них.
- source_word: לֹא הִכִּירוּ
  choice: не знают
  rationale: Глагол נכר в породе hифиль может означать узнавать, знать или признавать. В сочетании с «путями» естественное русское «не знают» сохраняет смысл непризнания и отсутствия знакомства без излишнего уточнения.
- source_word: דְרָכָיו
  choice: его путей
  rationale: Суффикс 3-го лица мужского рода единственного числа естественно относится к אוֹר, которое в древнееврейском имеет мужской род. В русском «свет» также мужского рода, поэтому «его» передаёт грамматику без дополнительной персонификации.
- source_word: וְלֹא יָשְׁבוּ
  choice: и не остаются
  rationale: ישב может означать сидеть, жить, пребывать или оставаться. При образе стез смысл состоит в том, что эти люди не держатся их и не пребывают на них.
- source_word: בִּנְתִיבֹתָיו
  choice: на его стезях
  rationale: נתיבות — пути или тропы. «Стези» сохраняет поэтический регистр и лексическое отличие от דְרָכָיו; русский предлог «на» естественен при обозначении движения или пребывания на пути.
theological_decisions:
- issue: К кому относится местоименный суффикс в выражениях «его пути» и «его стези»
  choice: 'Суффиксы отнесены к «свету»: «его путей… на его стезях».'
  alternative: Понимать суффиксы как указание на подразумеваемое личное лицо и тем самым сильнее персонифицировать свет.
  rationale: Ближайший грамматический антецедент — אוֹר («свет»), существительное мужского рода единственного числа. Русская форма «его» отражает эту связь, но сама по себе не требует богословской персонификации.
- issue: Временная отнесённость הָיוּ
  choice: 'Настоящая, характеризующая группу людей: «Они — из…».'
  alternative: 'Прошедшая: «Они были среди восстававших…».'
  rationale: Хотя הָיוּ формально является формой прошедшего/совершенного вида, поэтический контекст описывает устойчивый тип поведения. Временная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим библейским звучанием. «Стези» употреблено для сохранения поэтического параллелизма и отличия от «путей»; синтаксис остаётся ясным для обычного современного читателя.
