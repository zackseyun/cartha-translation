lexical_decisions:
- source_word: יִגְזְלוּ
  choice: отрывают
  rationale: Глагол גזל обозначает насильственное или неправедное завладение. В сочетании с «от груди» глагол «отрывают» естественно передаёт резкость и жестокость действия, не сводя его к обычной краже.
- source_word: מִשֹּׁד
  choice: от груди
  rationale: Трудную еврейскую форму здесь можно понимать как указание на грудь, от которой насильно забирают ребёнка. Краткое «от груди» близко к форме исходного текста и не добавляет прямо не названное слово «материнской».
- source_word: יָתוֹם
  choice: сироту
  rationale: יָתוֹם называет сироту, нередко ребёнка без отца. Русское «сироту» кратко и естественно сохраняет обозначение особенно уязвимого человека.
- source_word: וְעַל
  choice: и у
  rationale: В сочетании с глаголом взятия залога предлог עַל указывает на человека, с которого взыскивают залог. Русское «у бедняка» естественно передаёт это отношение.
- source_word: עָנִי
  choice: бедняка
  rationale: 'В контексте долгового притеснения עָנִי имеет прежде всего социально-экономический смысл: бедный, нуждающийся человек.'
- source_word: יַחְבֹּלוּ
  choice: берут залог
  rationale: Глагол חבל в данном употреблении означает брать имущество в залог по долгу. Формулировка «берут залог» точна и понятна современному читателю.
