  text: מֵסִ֣יר שָׂ֭פָה לְ/נֶאֱמָנִ֑ים וְ/טַ֖עַם זְקֵנִ֣ים יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/020.yaml
  text: He removes speech from the trusted[b][a], and takes away discernment from the elders.
translation:
  language: ru
  text: 'Он лишает речи тех, кому доверяют[a],

    и отнимает рассудительность у старейшин[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отнимает губу у верных (или надёжных)»; то есть лишает их способности говорить или красноречия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у пожилых». «Рассудительность» можно также перевести как «здравое суждение», «разумение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: лишает
  rationale: Причастие породы хифиль выражает устранение или отнятие; с дополнением «речи» естественное русское соответствие — «лишает».
- source_word: שָׂפָה
  choice: речи
  rationale: Буквально «губа», здесь метонимически — речь или способность говорить; перевод передаёт смысл естественно, не добавляя непрояснённого оттенка красноречия.
- source_word: לְנֶאֱמָנִים
  choice: тех, кому доверяют
  rationale: Форма допускает значения «верные», «надёжные», «пользующиеся доверием». Описательный перевод сохраняет социально-пассивный оттенок и естественно звучит по-русски.
- source_word: טַעַם
  choice: рассудительность
  rationale: Буквально слово связано со «вкусом», а переносно обозначает здравое суждение, разумение или способность различать; «рассудительность» подходит контексту мудрости.
- source_word: זְקֵנִים
  choice: старейшин
  rationale: Слово может обозначать как пожилых людей, так и старейшин. «Старейшины» сохраняет возможный оттенок возраста, опыта и общественного положения.
- source_word: יִקָּח
  choice: отнимает
  rationale: Обычное значение — «брать»; параллелизм требует здесь лишительного смысла «отнимать».
theological_decisions:
- issue: Объём значения נֶאֱמָנִים
  choice: тех, кому доверяют
  alternative: верных / надёжных
  rationale: Текст не уточняет, идёт ли речь прежде всего о нравственной верности, надёжности или признанном доверии; основной перевод не сводит слово к конфессиональному понятию «верующие».
- issue: Объём значения זְקֵנִים
  choice: старейшин
  alternative: стариков / пожилых
  rationale: Выбрано общественно-весомое значение, уместное рядом с людьми, пользующимися доверием, но в примечании сохранено возможное указание просто на пожилых людей.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранён параллелизм двух полустиший; «лишает» и «отнимает» передают близкие, но не механически одинаковые еврейские глагольные конструкции.
