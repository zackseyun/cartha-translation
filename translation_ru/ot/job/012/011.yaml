base_translation:
  language: en
  yaml_path: translation/ot/job/012/011.yaml
  text: Does not the ear test words[a], as the palate tastes food?
translation:
  language: ru
  text: Разве ухо не разбирает слова[a], как нёбо пробует пищу на вкус?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве ухо не исследует речь, как нёбо ощущает вкус пищи?»'
    reason: 'Лексические варианты для מִלִּין, תִּבְחָן и יִטְעַם: «речь» вместо «слова», «исследует» вместо «разбирает», «ощущает вкус» вместо «пробует на вкус».'
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве… не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: אֹזֶן
  choice: ухо
  rationale: Сохраняет конкретный образ органа слуха, метафорически связанного с оценкой услышанного.
- source_word: מִלִּין
  choice: слова
  rationale: Прямой и контекстуально уместный перевод множественного числа со значением «слова, речь».
- source_word: תִּבְחָן
  choice: испытывает
  rationale: Передаёт значение проверки и оценки, сохраняя параллель с распознаванием вкуса.
- source_word: חֵךְ
  choice: нёбо
  rationale: Точно сохраняет анатомический образ еврейского текста, а не обобщает его до «рта».
- source_word: אֹכֶל
  choice: пища
  rationale: Достоинный и естественный русский эквивалент конкретного существительного «еда, пища».
- source_word: יִטְעַם
  choice: различает вкус
  rationale: В данном сравнении выражает действие вкусового распознавания естественнее, чем буквальное «вкушает».
- source_word: לוֹ
  choice: не выражено отдельно
  rationale: Дательный местоименный элемент при глаголе здесь идиоматичен и не требует отдельного русского соответствия; добавление «для себя» было бы неестественным и могло бы внести лишний смысл.
