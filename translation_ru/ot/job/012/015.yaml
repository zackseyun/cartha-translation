base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: ru
  text: Вот, Он удерживает воды — и они иссякают; выпускает их — и они переворачивают землю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страну». Еврейское слово אֶרֶץ может означать как землю вообще, так и страну или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатическое привлечение внимания естественным и достойным современным русским выражением.
- source_word: יַעְצֹר בַּמַּיִם
  choice: удержит воды
  rationale: Сохраняет образ Божьей власти, сдерживающей воды; множественное число соответствует еврейской форме מַיִם.
- source_word: וְיִבָשׁוּ
  choice: и они иссякнут
  rationale: Мужское множественное число глагола грамматически соотносится с водами. «Иссякнут» естественнее по-русски, чем буквальное «высохнут», и не вводит новый субъект.
- source_word: וִישַׁלְּחֵם
  choice: отпустит их
  rationale: Местоименный суффикс отсылает к водам; «отпустит» передаёт снятие удерживающей силы и поддерживает параллелизм.
- source_word: וְיַהַפְכוּ
  choice: и они перевернут
  rationale: Сохраняет сильный и намеренно широкий образ корня הפך, не сводя его заранее к конкретному наводнению или просто разрушению.
- source_word: אָרֶץ
  choice: землю
  rationale: В данном контексте слово может обозначать как всю землю, так и отдельную страну или сушу; основной вариант сохраняет широкий поэтический масштаб.
theological_decisions:
- issue: Масштаб значения אָרֶץ в описании Божьей власти над водами
  choice: землю
  alternative: страну
  rationale: «Землю» соответствует космическому звучанию высказывания, но примечание сохраняет возможное более узкое значение и не привязывает стих к определённому повествованию о потопе.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Заглавное «Он» обозначает Бога по контексту и соответствует принятой русской издательской практике. Образ «перевернут землю» сохранён как сильная метафора всеохватного потрясения.
