base_translation:
  language: en
  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: ru
  text: 'Он развязывает путы царей[a]

    и опоясывает их поясом[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление» или «наказание царей». Еврейское слово может означать наставление, наказание, а также путы или узы.'
    reason: lexical_alternative
  - marker: b
    text: 'Образ может указывать на унижение и подчинение: Бог лишает царей высокого положения и связывает их как простых людей или пленников. Возможно также, что это образ опоясывания для действия.'
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: узы
  rationale: Существительное может означать наставление или наказание, а также путы, узы. В сочетании с глаголом «развязывает» конкретное значение «узы» естественно передаёт образ и сохраняет его неоднозначность.
- source_word: פִּתֵּחַ
  choice: развязывает
  rationale: Глагол означает «открывать, распускать, освобождать». «Развязывает» сохраняет конкретный образ и создаёт точный контраст с последующим «обвязывает».
- source_word: מְלָכִים
  choice: царей
  rationale: Прямое и обычное значение еврейского слова; обобщающее «правителей» здесь не требуется.
- source_word: וַיֶּאְסֹר
  choice: обвязывает
  rationale: Глагол означает «связывать, привязывать». Выбор сохраняет физический образ и словесный контраст с «развязывает».
- source_word: אֵזוֹר
  choice: поясу
  rationale: Существительное обозначает пояс или опоясание. В конструкции «обвязывает по поясу» оно передано естественно для современного русского языка без уточнения материала или назначения.
- source_word: בְּמָתְנֵיהֶם
  choice: их по поясу
  rationale: Фраза указывает на бёдра или талию. «Обвязывает их по поясу» звучит естественно и избегает архаического «чресла».
theological_decisions:
- issue: Смысл образа перемены положения царей
  choice: 'Сохранён буквальный контраст: Бог развязывает узы царей, а затем сам обвязывает их по поясу.'
  alternative: Бог лишает царей власти и унижает их; либо освобождает их от уз и опоясывает для действия.
  rationale: Краткий еврейский образ допускает разные объяснения. Перевод не определяет однозначно, означает ли действие унижение и подчинение, лишение власти или подготовку к действию.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и контраста «развязывает — обвязывает». Архаизм «чресла» не используется; богословская неоднозначность образа вынесена в примечания.
