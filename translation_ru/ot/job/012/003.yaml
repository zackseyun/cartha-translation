  text: I too have a mind like you; I am not inferior to you[a]. And who does not know such things as these?
translation:
  language: ru
  text: И у меня есть разум, как у вас; я не ниже вас[a]. И кто не знает таких вещей?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И у меня есть сердце, как у вас». Здесь «сердце» означает способность мыслить и понимать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: Но и у меня есть разум
  rationale: גַּם продолжает спор и подчёркивает, что Иов также обладает способностью мыслить; לֵבָב буквально означает «сердце», но здесь обозначает разум и понимание. Частица «но» естественно передаёт контраст с притязаниями собеседников.
- source_word: כְּמוֹכֶם
  choice: как у вас
  rationale: Сравнение относится к разуму Иова и его собеседников; по-русски конструкция «разум, как у вас» ясна и естественна.
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: я не ниже вас
  rationale: Оборот נפל מן выражает уступание или более низкое положение. «Не ниже вас» сохраняет образ сравнительного положения и звучит естественнее, чем буквальное «не падаю ниже вас».
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: Да и кто не знает таких вещей?
  rationale: Эллиптическая риторическая фраза в контексте указывает на общеизвестность сказанного друзьями. «Таких вещей» сохраняет неопределённость אֵלֶּה и передаёт пренебрежительную риторическую силу.
theological_decisions:
- issue: Объект подразумеваемого знания в заключительной фразе
  choice: кто не знает таких вещей?
  alternative: у кого нет подобного?
  rationale: Еврейская фраза эллиптична и допускает более буквальное прочтение, однако контекст противопоставляет не духовные дары или переживания, а обычные доводы и знания собеседников. Выбранный вариант сохраняет риторический вопрос, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством полемической речи Иова. «Разум» передаёт контекстуальное значение לֵבָב, а буквальный образ сохранён в сноске. Частицы «но и» и «да и» поддерживают естественный ход возражения.
