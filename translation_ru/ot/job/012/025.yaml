  yaml_path: translation/ot/job/012/025.yaml
  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: ru
  text: Они идут ощупью во тьме, без света; он заставляет их блуждать, как пьяные[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставляет их шататься». Еврейский глагол может означать «заставлять блуждать» или «сбивать с пути»; сравнение с пьяным подчёркивает дезориентацию и нетвёрдое движение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: ощупью бредут
  rationale: Пиэль глагола משש передаёт движение или поиск на ощупь при отсутствии зрения. Сочетание «ощупью бредут» естественно по-русски выражает и осязание, и дезориентированное движение.
- source_word: חֹשֶׁךְ
  choice: во тьме
  rationale: חֹשֶׁךְ означает тьму; форма «во тьме» естественно сочетается с глаголом движения и сохраняет как буквальный, так и образный смысл.
- source_word: וְלֹא אוֹר
  choice: где нет света
  rationale: 'Буквально: «и нет света». Относительная конструкция ясно и естественно передаёт полное отсутствие света, не добавляя толкования.'
- source_word: וַיַּתְעֵם
  choice: он заставляет их блуждать
  rationale: Каузативная форма от תעה означает «заставлять блуждать, сбивать с пути». Выбор сохраняет основное лексическое значение; сравнение с пьяным добавляет оттенок шаткости и дезориентации.
- source_word: -ם (suffix in וַיַּתְעֵם)
  choice: их
  rationale: Суффикс третьего лица мужского рода множественного числа обозначает объект действия и соотносится с упомянутыми в контексте людьми.
- source_word: כַּשִּׁכּוֹר
  choice: словно пьяных
  rationale: Еврейское выражение буквально сравнивает их с пьяным человеком. Русское множественное число согласуется с «их» и естественно сохраняет образ, не делая его разговорным.
theological_decisions:
- issue: Неявное подлежащее וַיַּתְעֵם
  choice: он заставляет их блуждать
  alternative: они блуждают
  rationale: Глагольная форма имеет подлежащее третьего лица единственного числа и объект третьего лица множественного числа. Поэтому отдельное «он» сохраняет грамматику оригинала и связь с Богом как действующим лицом в ближайшем контексте.
translation_notes:
  register: Современный литературный русский язык с поэтической выразительностью, уместной для Книги Иова. Параллелизм двух полустиший сохранён; формулировки понятны без специальной богословской подготовки.
