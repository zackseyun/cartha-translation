lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Глагол ענה в форме нарративного wayyiqtol вводит ответ Иова на предшествующую речь; «ответил» естественно и точно передаёт диалоговую формулу.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: וַיֹּאמַר
  choice: сказал (отражено в сжатой формуле «ответил»)
  rationale: אמר — обычный глагол речи. В современном русском сочетание «ответил и сказал» звучит избыточно, поэтому два еврейских глагола естественно сведены к вводной формуле «ответил», а буквальное построение сохранено в сноске.
- source_word: וַ
  choice: последовательность передана порядком повествования без отдельного союза
  rationale: Начальный waw отмечает продолжение и последовательность повествования; в современном русском перед «Иов ответил» отдельное «и» или «тогда» необязательно.
