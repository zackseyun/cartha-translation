  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: ru
  text: Вот, Он разрушит — и никто не отстроит; заключит человека — и никто не выпустит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не будет открыто». Еврейский текст продолжает образ запирания; «не выпустит» передаёт его смысл применительно к заключённому.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица вводит emphатическое утверждение и привлекает внимание. «Вот» естественно и кратко передаёт эту функцию в современном литературном русском.
- source_word: יַהֲרוֹס
  choice: разрушит
  rationale: Глагол הרס обозначает разрушение или снос; выбор сохраняет строительный образ, продолженный пассивом בנה.
- source_word: וְלֹא יִבָּנֶה
  choice: и не будет отстроено
  rationale: Нифаль передаёт пассивное значение. «Отстроено» ясно выражает восстановление разрушенного и не усиливает простое будущее до модального «невозможно».
- source_word: יִסְגֹּר עַל אִישׁ
  choice: запрёт человека
  rationale: Сочетание סגר с עַל здесь означает запереть или заключить кого-либо. «Запрёт человека» сохраняет конкретный образ, не уточняя его как формальное тюремное заключение.
- source_word: וְלֹא יִפָּתֵחַ
  choice: и не откроется
  rationale: Нифаль от פתח допускает безлично-пассивное «не будет открыто» и медиальное «не откроется». Выбор сохраняет краткость и параллелизм еврейской строки, а неоднозначность подразумеваемого объекта отмечена в сноске.
theological_decisions:
- issue: Обозначение божественного субъекта
  choice: Он
  alternative: Бог; Господь
  rationale: В еврейском стихе субъект выражен лишь формами третьего лица единственного числа. Местоимение сохраняет связь с контекстом, где речь идёт о Боге, но не вводит отсутствующее здесь имя или наименование.
- issue: Модальность необратимости
  choice: 'будущее отрицание: «не будет отстроено… не откроется»'
  alternative: «невозможно будет отстроить… невозможно будет открыть»
  rationale: Еврейский текст содержит отрицание с имперфектом, но не отдельный модальный показатель невозможности. Выбранная формулировка сохраняет категоричность результата, не делая неявную модальность эксплицитной.
translation_notes:
  register: Современный литературный русский с торжественной библейской сжатостью. Местоимение «Он» написано с прописной буквы как ясная контекстуальная отсылка к Богу; синтаксис сохраняет параллелизм двух полустиший.
