base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: ru
  text: Он лишает правителей народа земли[a] разумения и заставляет их блуждать в бездорожной пустоши[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глав народа земли (или страны)».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в пустоши, [где] нет дороги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: лишает
  rationale: Причастие породы хифиль выражает действие удаления или отнятия; «лишает разумения» естественно передаёт смысл по-русски и сохраняет обобщённый характер высказывания.
- source_word: לֵב
  choice: разумения
  rationale: Буквально «сердце», но здесь слово обозначает способность мыслить и здраво судить; «разумение» передаёт эту функцию, не создавая у современного читателя преимущественно эмоциональной ассоциации.
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: вождей народов земли
  rationale: רָאשֵׁי — буквально «главы», то есть вожди или правители. Конструкция עַם הָאָרֶץ допускает понимание как «народ земли/страны», однако контекст перечисления Божьей власти над правителями позволяет естественное собирательное прочтение «народов земли»; неоднозначность отмечена в сноске.
- source_word: וַיַּתְעֵם
  choice: заставляет их блуждать
  rationale: Каузативная форма от תעה означает «заставлять блуждать, сбивать с пути»; выбранный вариант сохраняет явную причинность и пространственный образ.
- source_word: בְּתֹהוּ
  choice: в пустыне
  rationale: תֹהוּ обозначает пустоту, запустение или безлюдную пустошь; в сочетании с отсутствием дороги естественный русский образ — «пустыня».
- source_word: לֹא דָרֶךְ
  choice: бездорожной
  rationale: Буквально «[где] нет дороги». Прилагательное «бездорожной» кратко и образно передаёт отсутствие пути, не устраняя пространственного смысла.
theological_decisions:
- issue: Не названный непосредственно субъект глаголов
  choice: Местоимение «Он» относится к Богу, действующему над разумом и путём правителей.
  alternative: Оставить субъект формально неуточнённым или повторить имя «Бог».
  rationale: В ближайшем контексте Иов говорит о действиях Бога; русское личное предложение требует выраженного субъекта. «Он» сохраняет контекстуальную связь, не добавляя к тексту нового богословского определения.
- issue: Масштаб выражения עַם הָאָרֶץ
  choice: «вождей народов земли»
  alternative: «глав народа страны» или «вождей народа земли»
  rationale: Еврейская конструкция допускает локальное и более широкое понимание. Основной текст передаёт естественный в контексте универсальный смысл, а сноска сохраняет грамматически возможную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Лишает разумения» сохраняет библейскую весомость без архаической затемнённости; «бездорожная пустыня» естественно воспроизводит образ дезориентации.
