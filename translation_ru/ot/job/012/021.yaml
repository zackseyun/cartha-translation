lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: изливает
  rationale: Сохраняет конкретную метафору «лить, изливать» и естественно сочетается в русском языке со словом «презрение».
- source_word: בּוּז
  choice: презрение
  rationale: Передаёт значение презрения и унижения, не сужая его до насмешки.
- source_word: נְדִיבִים
  choice: знатных
  rationale: В контексте переворота общественного положения слово обозначает людей высокого положения; «знатные» не ограничивает смысл только царевичами или правителями.
- source_word: מְזִיחַ
  choice: пояс
  rationale: Сохраняет традиционно понимаемый конкретный образ пояса или опоясания, связанного с силой и готовностью действовать.
- source_word: אֲפִיקִים
  choice: могущественных
  rationale: В данном параллелизме слово обозначает сильных, влиятельных людей; «могущественные» естественно соотносится со «знатными» и сохраняет социально-политический оттенок силы.
- source_word: רִפָּה
  choice: ослабляет
  rationale: Глагол означает делать слабым или распускать, ослаблять; здесь он буквально относится к поясу и сохраняет образ лишения собранности и силы.
theological_decisions:
- issue: Метафорический образ унижения и лишения силы Богом
  choice: 'Сохранить конкретный образ: «у могущественных ослабляет пояс».'
  alternative: «лишает могущественных силы» или «обезоруживает могущественных»
  rationale: Исходный текст не объясняет образ однозначно. Буквальная метафора позволяет сохранить поэтическую напряжённость и не сводит смысл исключительно к военному разоружению.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного поэтического параллелизма. Необычный образ пояса оставлен в основном тексте, а возможный смысл пояснён в сноске.
