base_translation:
  language: en
  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: ru
  text: Или обратись к земле — и она научит тебя; рыбы морские расскажут тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֤וֹ
  choice: Или
  rationale: Разделительный союз продолжает ряд обращений в контексте и естественно передаётся русским «или».
- source_word: שִׂ֣יחַ
  choice: обратись
  rationale: В сочетании с לָאָרֶץ глагол означает обращение с речью. «Обратись к земле» естественно по-русски и сохраняет олицетворение.
- source_word: לָ/אָ֣רֶץ
  choice: к земле
  rationale: 'Здесь אֶרֶץ уместнее понимать как «землю» в широком смысле: рядом упомянуты звери, птицы и морские рыбы. Русское «земля» также допускает значение суши, сохраняя присущую слову смысловую широту.'
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: и она научит тебя
  rationale: Форма от ירה в породе Hiphil означает «учить, наставлять»; женский род согласуется с אֶרֶץ и в русском естественно сохраняется словом «она».
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: расскажут тебе
  rationale: Глагол ספר в Piel здесь означает «рассказать, поведать». Выбран ясный современный эквивалент, соответствующий поэтическому параллелизму.
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: рыбы морские
  rationale: Поэтическое сочетание естественно передаёт конструкцию «рыбы моря» и сохраняет торжественный ритм без архаизации.
