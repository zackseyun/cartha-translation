base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: ru
  text: Спокойны шатры разорителей, и в безопасности те, кто гневит Бога, — те, кому их бог даёт в руки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза на еврейском языке трудна и допускает другие переводы: «те, кого Бог отдаёт в Свою руку» или «те, кому Бог даёт в руки». Она может говорить либо о Божьем провидении, либо — иронически — о собственной силе нечестивого как о его «боге».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: спокойны
  rationale: Глагол от שלה передаёт состояние безмятежного покоя и благополучия; «спокойны» сохраняет иронию контекста, не сводя смысл только к материальному процветанию.
- source_word: אֹהָלִים
  choice: шатры
  rationale: Сохранён конкретный поэтический образ; здесь шатры также могут обозначать жилища или семьи.
- source_word: לְשֹׁדְדִים
  choice: разорителей
  rationale: Причастное существительное обозначает тех, кто насильственно опустошает и грабит; «разорители» передаёт более широкий смысл, чем только воровство.
- source_word: וּבַטֻּחוֹת
  choice: в безопасности
  rationale: Форма от בטח выражает защищённость и уверенное спокойствие и образует параллель к «спокойны».
- source_word: לְמַרְגִּיזֵי אֵל
  choice: те, кто гневит Бога
  rationale: 'Порода Hiphil глагола רגז здесь имеет причинное значение: эти люди вызывают Божий гнев. Формулировка естественна для современного русского языка.'
- source_word: לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: те, кому их бог всё даёт в руки
  rationale: Трудная заключительная конструкция передана как ироническое описание нечестивых, чья сила или предмет упования служит им «богом». «Всё» восполняет невыраженный объект глагола ради естественности по-русски; неоднозначность отражена в сноске.
theological_decisions:
- issue: Кого обозначает אֱלוֹהַּ в заключительной части
  choice: «их бог» — предмет упования или собственная сила нечестивых
  alternative: '«Бог» — истинный Бог: «те, кого Бог отдаёт в его руку» либо «те, кому Бог даёт в руки»'
  rationale: Контекст подчёркивает спокойствие нечестивых и допускает ироническое понимание их силы как бога. Однако синтаксис еврейской фразы действительно неоднозначен, поэтому альтернативы не исключены из перевода, а приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической речи. Параллелизм двух полустиший передан конструкциями «спокойны» и «в безопасности»; конкретный образ шатров сохранён.
