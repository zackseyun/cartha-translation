lexical_decisions:
- source_word: מוֹלִיךְ
  choice: уводит
  rationale: Причастие породы hифиль от הלך выражает понуждение к движению; «уводит» естественно передаёт действие победителя, ведущего людей прочь.
- source_word: יוֹעֲצִים
  choice: советников
  rationale: Форма от יעץ обозначает людей, дающих советы; «советники» соответствует общественно-политическому контексту и поэтическому параллелизму.
- source_word: שׁוֹלָל
  choice: разорёнными
  rationale: Слово связано с лишением имущества и положением захваченного как добыча. «Разорёнными» сохраняет идею утраты и унижения, не сводя образ к спорному значению «босыми».
- source_word: שֹׁפְטִים
  choice: судей
  rationale: Прямое значение формы от שפט — «судьи»; оно сохраняет параллель между влиятельными советниками и судьями.
- source_word: יְהוֹלֵל
  choice: лишает рассудка
  rationale: 'Пиэль от הלל II имеет каузативное значение: делать глупым или безрассудным. Выражение «лишает рассудка» естественно по-русски передаёт вызванную Богом неспособность здраво судить, не обязательно подразумевая клиническое безумие.'
theological_decisions:
- issue: Неявное подлежащее
  choice: «Он», то есть Бог
  alternative: Не называть подлежащее прямо
  rationale: В ближайшем контексте эти действия приписаны Богу; русское предложение требует явного подлежащего, и местоимение сохраняет контекст без добавления имени.
- issue: Характер действия над судьями
  choice: «лишает рассудка»
  alternative: «делает безумными» или «обращает в глупцов»
  rationale: Выбрано выражение, сохраняющее напряжённое утверждение о Божьей власти над разумением правителей, но не вносящее медицинского оттенка или утверждения об их неизменной сущности.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. «Разорёнными» звучит достойно и понятно; сноска сохраняет более буквальные оттенки добычи и ограбления.
