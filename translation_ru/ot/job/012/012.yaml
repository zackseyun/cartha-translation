  language: ru
  text: У старцев — мудрость[a], а долгие годы приносят разумение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Среди старцев — мудрость». Еврейский предлог может выражать связь с кем-либо или нахождение среди кого-либо.'
