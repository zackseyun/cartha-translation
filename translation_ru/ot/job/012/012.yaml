  - marker: b
    text: 'Буквально: «долгота дней», то есть долгая жизнь или множество прожитых дней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּישִׁישִׁים
  choice: у пожилых
  rationale: 'Предлог ב допускает значение нахождения или связи: мудрость пребывает «у» пожилых или «среди» них. Субстантивированное «пожилые» звучит современно и не ограничивает речь только мужчинами.'
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычный и точный русский эквивалент в литературе мудрости.
- source_word: וְאֹרֶךְ יָמִים
  choice: и у долголетних
  rationale: Буквально выражение означает «долгота дней». «У долголетних» естественно передаёт связь разумения с множеством прожитых дней и сохраняет поэтический параллелизм.
- source_word: תְּבוּנָה
  choice: разумение
  rationale: Передаёт способность понимать и различать; сохраняет смысловое соседство с «мудростью», не отождествляя эти понятия.
