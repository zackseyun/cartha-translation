  source_fidelity: 'Первая строка в целом верна: בִּישִׁישִׁים обозначает людей преклонного возраста, а «мудрость» точно передаёт חָכְמָה. Однако «у долголетних» во второй строке меняет исходный образ: וְאֹרֶךְ יָמִים — не группа людей, а «долгота/продолжительность дней», то есть долгая жизнь. В еврейской строке подразумевается связь долгой жизни с разумением; её следует передать без подмены абстрактного выражения личным существительным.'
