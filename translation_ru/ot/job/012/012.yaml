  terminology: «Мудрость» и «разумение» удачно различают חָכְמָה и תְּבוּנָה. «Разумение» имеет допустимо возвышенный, но не архаизирующий оттенок для книги Иова. «Старцы» здесь означает людей преклонного возраста, а не должностных лиц или членов совета.
