lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: Конечно
  rationale: Сочетание усиливает утверждение; в контексте ответной речи Иова «конечно» естественно передаёт ироническое согласие.
- source_word: אַתֶּם
  choice: вы
  rationale: Местоимение второго лица множественного числа прямо обращено к друзьям Иова.
- source_word: עָם
  choice: весь народ
  rationale: 'Буквально «народ». Добавление «весь» раскрывает саркастический смысл: друзья представлены так, словно они одни составляют весь достойный внимания народ; буквальный вариант сохранён в сноске.'
- source_word: וְעִמָּכֶם
  choice: и вместе с вами
  rationale: Прямо передаёт значение сопутствия и связывает смерть адресатов с предполагаемой смертью мудрости.
- source_word: תָּמוּת
  choice: умрёт
  rationale: Форма qal imperfect 3-го лица женского рода от מות согласуется с «мудростью»; буквальный и выразительный глагол сохраняет остроту иронии.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное соответствие חָכְמָה; здесь мудрость иронически представлена как исключительное достояние друзей Иова.
theological_decisions:
- issue: Характер высказывания
  choice: Ирония передана формой уверенного утверждения и восклицательным знаком
  alternative: Нейтральное буквальное утверждение без явного указания на иронию
  rationale: Контекст ответа Иова показывает насмешливую уступку, однако текст не дополняется прямым пояснением вроде «вы думаете».
