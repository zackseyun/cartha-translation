  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: ru
  text: В глазах того, кто живёт беззаботно, факел презрен[a]; он готов для тех, кто оступается.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская формулировка этого стиха трудна; буквально первая часть близка к: «факел — презрение в мыслях безмятежного».'
    reason: Отмечает подлинную синтаксическую и образную трудность еврейского текста, не навязывая истолкования образа факела.
lexical_decisions:
- source_word: לַפִּיד
  choice: факел
  rationale: Прямое значение существительного; образ сохранён без истолкования.
- source_word: בּוּז
  choice: презрен
  rationale: Передаёт значение презрения и соответствует краткой именной конструкции еврейского текста.
- source_word: לְעַשְׁתּוּת שַׁאֲנָן
  choice: в мыслях того, кто живёт спокойно
  rationale: Сохраняет упоминание мыслей и состояние безмятежности, не делая выражение чрезмерно буквальным по-русски.
- source_word: נָכוֹן
  choice: приготовлен
  rationale: Передаёт значение готовности или предназначенности в данном контексте.
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: для тех, чья нога оступается
  rationale: Передаёт традиционно и контекстуально вероятный разбор как обозначение оступающихся, а не значение «назначенные времена».
theological_decisions:
- issue: Неясная образная связь между факелом, безмятежным человеком и оступающимися
  choice: Сохранить образ и синтаксическую напряжённость без поясняющей интерпретации
  alternative: Истолковать факел как бедствие, презрение или помощь оступающемуся
  rationale: Еврейский стих труден и допускает различные объяснения; перевод не должен закреплять одно из них как несомненное.
translation_notes:
  register: Современный литературный русский язык с краткой, несколько афористичной структурой, соответствующей поэтической речи Иова. Сохранены необычный образ и смысловая напряжённость оригинала.
