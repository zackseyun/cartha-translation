  text: עִ֭מּ/וֹ חָכְמָ֣ה וּ/גְבוּרָ֑ה ל֝֗/וֹ עֵצָ֥ה וּ/תְבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: ru
  text: У Него — мудрость и могущество; Ему принадлежат совет и разумение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִמּוֹ
  choice: У Него
  rationale: Предлог עִם с местоименным суффиксом буквально выражает нахождение «с Ним», но в русском именная конструкция «у Него» естественно передаёт и присутствие этих качеств при Боге, и оттенок обладания, не превращая выражение в более толковательное «в Нём».
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное и контекстуально точное соответствие חָכְמָה, обозначающему мудрость и искусное постижение.
- source_word: וּגְבוּרָה
  choice: и могущество
  rationale: גְבוּרָה может означать силу, мощь или могущество. «Могущество» сохраняет возвышенный поэтический регистр и указывает на действенную силу Бога.
- source_word: לוֹ
  choice: Ему принадлежат
  rationale: ל с местоименным суффиксом в безглагольном предложении выражает принадлежность. Русская формулировка явно и естественно передаёт это значение.
- source_word: עֵצָה
  choice: совет
  rationale: עֵצָה обозначает совет, замысел или способность принимать обдуманные решения. «Совет» сохраняет широту значения и соответствует поэтическому регистру.
- source_word: וּתְבוּנָה
  choice: и разумение
  rationale: תְבוּנָה означает понимание, проницательность, разумение. «Разумение» уместно в возвышенной поэзии и хорошо сохраняет отличие от חָכְמָה — «мудрости».
theological_decisions:
- issue: К кому относятся местоименные суффиксы
  choice: Сохранено местоимение «Него/Ему», относящееся в контексте к Богу.
  alternative: 'Назвать Бога прямо: «У Бога… Богу принадлежат…»'
  rationale: Контекст определяет Бога как референта, однако еврейский текст употребляет местоимения. Их сохранение не вносит лишнего уточнения и следует структуре оригинала.
- issue: Характер обладания божественными качествами
  choice: Первая строка передана как «У Него», вторая — как «Ему принадлежат».
  alternative: «В Нём — мудрость и могущество; Его — совет и разумение».
  rationale: Так сохраняется различие еврейских конструкций עִמּוֹ и לוֹ, не утверждая сверх текста особого метафизического смысла формулы «в Нём».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Тире восполняет отсутствующую в еврейском связку; параллелизм двух половин стиха сохранён.
