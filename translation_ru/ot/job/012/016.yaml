  text: עִ֭מּ/וֹ עֹ֣ז וְ/תֽוּשִׁיָּ֑ה ל֝֗/וֹ שֹׁגֵ֥ג וּ/מַשְׁגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: ru
  text: У Него сила и здравомыслие[a]; Ему принадлежат и заблуждающийся, и вводящий в заблуждение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрость», «верное разумение». Еврейское слово означает основательную, действенную мудрость или здравое суждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: У Него
  rationale: 'Оборот с предлогом עִם и местоименным суффиксом выражает здесь обладание или неотъемлемую связь: сила и здравомыслие находятся у Бога и в Его распоряжении. Русское «у Него» естественно передаёт этот смысл.'
- source_word: עֹז
  choice: сила
  rationale: Существительное обозначает силу или могущество; «сила» — точный и естественный современный эквивалент.
- source_word: תּוּשִׁיָּה
  choice: здравомыслие
  rationale: В литературе мудрости слово означает основательную, действенную мудрость, здравое суждение и способность поступать разумно. «Здравомыслие» сохраняет этот оттенок лучше, чем общее «мудрость», не сводя значение к одному лишь успеху.
- source_word: לוֹ
  choice: Ему принадлежат
  rationale: Предлог ל с местоименным суффиксом выражает принадлежность или отношение. Явная формулировка естественна по-русски и сохраняет утверждение о том, что оба человека находятся во власти Бога.
- source_word: שֹׁגֵג
  choice: заблуждающийся
  rationale: Причастие породы qal от שׁגה обозначает того, кто ошибается, сбивается или заблуждается. Выбор сохраняет непереходный смысл формы и словесную связь со следующим причастием.
- source_word: מַשְׁגֶּה
  choice: вводящий в заблуждение
  rationale: Причастие породы hifil обозначает того, кто заставляет другого ошибаться или сбивает его с пути. Формулировка сохраняет причинительное значение и параллель с «заблуждающийся».
theological_decisions:
- issue: Отношение Бога к заблуждающемуся и вводящему в заблуждение
  choice: Оба названы принадлежащими Богу, без уточнения нравственной причинности.
  alternative: Понимать строку как утверждение, что Бог непосредственно является источником заблуждения и обмана.
  rationale: Еврейский текст сильно утверждает принадлежность обоих Богу или Его власть над ними, но прямо не объясняет, каким образом Бог относится к их поступкам. Перевод сохраняет это богословское напряжение и не добавляет тезиса о непосредственном авторстве зла.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Пара «заблуждающийся — вводящий в заблуждение» намеренно сохраняет различие между непереходным и причинительным причастиями и не заменяется более толковательным «обманутый — обманщик».
