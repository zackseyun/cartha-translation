base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: ru
  text: Я — посмешище для своего друга[a] — я, взывавший к Богу, и Он ответил мне[b]. Праведный, непорочный человек — посмешище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для его друга»; по контексту речь идёт о друге самого Иова.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и Он ответил ему»; местоимение относится к самому Иову.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: посмешище
  rationale: Существительное обозначает человека, над которым насмехаются; «посмешище» естественно передаёт предикативный смысл и повторено в обеих частях стиха.
- source_word: לְרֵעֵהוּ
  choice: для своего друга
  rationale: Масоретская форма буквально содержит суффикс третьего лица («для его друга»), однако при говорящем от первого лица русский возвратный оборот естественно относит друга к Иову. Формальная неоднозначность отмечена в сноске.
- source_word: אֶהְיֶה
  choice: я стал
  rationale: Имперфект описывает положение, в котором оказался Иов. «Стал» по-русски естественно выражает наступившее и продолжающееся унижение, хотя возможно и статическое «я — посмешище».
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: я, взывавший к Богу
  rationale: 'Причастие в сочетании с последующим повествовательным глаголом передаёт того же говорящего и последовательность: Иов взывал, Бог ответил.'
- source_word: וַיַּעֲנֵהוּ
  choice: и Он ответил мне
  rationale: Подлежащее по смыслу — Бог, а местоименный объект грамматически стоит в третьем лице («ему»), но относится к самому Иову. В основном тексте это выражено естественным русским первым лицом, а форма оригинала сохранена в сноске.
- source_word: צַדִּיק תָּמִים
  choice: праведный, непорочный человек
  rationale: Оба определения характеризуют нравственную правоту и цельность Иова. Добавленное «человек» делает эллиптическую еврейскую конструкцию ясной по-русски, не меняя её смысла.
theological_decisions:
- issue: Подразумевает ли תָּמִים абсолютную безгрешность Иова
  choice: «непорочный» как указание на нравственную цельность и отсутствие вины в данном споре
  alternative: «совершенный», что может быть понято как утверждение абсолютной безгрешности
  rationale: В книге Иова תָּמִים характеризует цельность и безупречность жизненного пути, не требуя богословского вывода об абсолютном совершенстве.
- issue: Синтаксическая связь заключительных слов שְׂחֹק צַדִּיק תָּמִים
  choice: «Праведный, непорочный человек стал посмешищем»
  alternative: «посмешище для праведного и непорочного человека»
  rationale: В еврейском перед צַדִּיק нет предлога לְ, поэтому заключительная фраза естественнее читается как повторное утверждение о том, что праведный и непорочный человек сделался посмешищем, а не как обозначение того, кто над ним смеётся.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической жалобы. Повтор слова «посмешище» сохраняет риторическую структуру оригинала; тире и отдельное заключительное предложение делают эллиптический еврейский синтаксис понятным без устранения его напряжения.
