  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: ru
  text: Но спроси, пожалуйста, у животных — они научат тебя; и у птиц небесных[a] — они расскажут тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «у птиц в небе». Буквально: «у птиц небес».'
    reason: Лексическая альтернатива и пояснение буквального еврейского выражения.
lexical_decisions:
- source_word: וְאוּלָם
  choice: Но
  rationale: Передаёт контрастный поворот в речи Иова кратко и естественно.
- source_word: שְׁאַל נָא
  choice: спроси, пожалуйста
  rationale: Императив означает «спроси», а частица נָא выражает просьбу или мягкое побуждение, а не обязательно временное «теперь».
- source_word: בְהֵמוֹת
  choice: у животных
  rationale: Слово здесь обозначает наземных животных вообще, а не только домашний скот; предлог «у» нужен при естественном русском управлении глагола «спросить».
- source_word: וְתֹרֶךָּ
  choice: они научат тебя
  rationale: Форма глагола женского рода единственного числа согласована с собирательным существительным, но по-русски множественное «они научат» естественно со словом «животные».
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: у птиц небесных
  rationale: Сохраняет образное выражение «птицы небес» и возвышенный поэтический регистр, оставаясь понятным современному читателю.
- source_word: וְיַגֶּד לָךְ
  choice: они расскажут тебе
  rationale: Порода гифиль глагола נגד означает «сообщить, рассказать, объявить»; «расскажут» естественно продолжает олицетворение птиц как наставников.
