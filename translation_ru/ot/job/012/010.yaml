source:
  edition: WLC
  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ נֶ֣פֶשׁ כָּל חָ֑י וְ֝/ר֗וּחַ כָּל בְּשַׂר אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: ru
  text: в руке Которого — жизнь всего живого[a] и дыхание каждого человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа всего живого и дух всякой человеческой плоти».'
    reason: Лексические значения נֶפֶשׁ и רוּחַ допускают варианты «душа» и «дух», а כָּל בְּשַׂר אִישׁ можно передать более буквально как «всякая человеческая плоть».
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: в руке Которого
  rationale: Сочетание относительной частицы с предложной конструкцией буквально обозначает «в руке Которого». Перевод сохраняет образ руки как власти и контроля и синтаксически связывает стих с предшествующим упоминанием Господа.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В данном параллелизме слово обозначает жизнь, оживляющую живые существа, а не обязательно отдельную нематериальную «душу». «Жизнь» естественно звучит по-русски и не привносит более узкого антропологического толкования.
- source_word: כָּל חָי
  choice: всего живого
  rationale: Передаёт всеобъемлющий смысл выражения и звучит естественно в современной литературной русской речи.
- source_word: וְרוּחַ
  choice: и дыхание
  rationale: В параллели с נֶפֶשׁ и применительно к людям רוּחַ вероятнее всего означает дыхание как признак и начало жизни. Вариант «дух» остаётся возможным и указан в сноске.
- source_word: כָּל בְּשַׂר אִישׁ
  choice: каждого человека
  rationale: Буквально выражение связано с «плотью человека», то есть с человечеством в его телесной и смертной природе. «Каждого человека» ясно передаёт универсальный человеческий охват без неестественной для современного русского кальки.
theological_decisions:
- issue: Значение антропологических терминов נֶפֶשׁ и רוּחַ
  choice: «жизнь» и «дыхание»
  alternative: «душа» и «дух»
  rationale: Контекст подчёркивает власть Бога над жизнью всех существ и людей. Конкретные слова «жизнь» и «дыхание» соответствуют параллелизму и не навязывают тексту более строгого разграничения души и духа, чем требует древнееврейский оригинал.
- issue: Передача כָּל בְּשַׂר אִישׁ
  choice: «каждого человека»
  alternative: «всякой человеческой плоти»
  rationale: Основной вариант ясно и естественно выражает собирательно-универсальный смысл. Более буквальный вариант сохраняется в сноске вместе с взаимосвязанной лексической альтернативой.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа Божьей руки. Строчная буква в начале обусловлена тем, что стих продолжает относительную конструкцию предыдущего стиха; тире делает её естественной и ясной по-русски.
