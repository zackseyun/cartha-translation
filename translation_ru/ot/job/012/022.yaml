base_translation:
  language: en
  yaml_path: translation/ot/job/012/022.yaml
  text: He reveals deep things out of darkness[a], and brings the shadow of death to light.
translation:
  language: ru
  text: Он открывает сокрытое во тьме и выводит на свет тень смерти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глубокую тьму»; возможно также: «смертельный мрак» (евр. צַלְמָוֶת).'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגַלֶּה
  choice: открывает
  rationale: Причастие от גלה означает раскрывать или делать известным; настоящее время естественно передаёт еврейскую причастную форму и продолжающееся описание Божьих действий.
- source_word: עֲמֻקוֹת
  choice: сокрытое
  rationale: Субстантивированная форма обозначает глубокое, недоступное или скрытое. «Сокрытое» естественно по-русски и сохраняет связь с последующим образом тьмы, хотя пространственный оттенок выражен менее явно.
- source_word: מִנִּי חֹשֶׁךְ
  choice: во тьме
  rationale: Буквально выражение допускает «из тьмы», однако при русском глаголе «открывать» сочетание «сокрытое во тьме» естественно передаёт источник и место сокрытия без изменения образа.
- source_word: וַיֹּצֵא
  choice: выводит
  rationale: 'Порода Hiphil глагола יצא имеет каузативное значение: заставляет выйти, выводит. Выбор сохраняет образ движения из сокрытия.'
- source_word: לָאוֹר
  choice: на свет
  rationale: Обычное русское выражение для движения к свету и обнаружения скрытого; хорошо сочетается с «выводит».
- source_word: צַלְמָוֶת
  choice: смертную тень
  rationale: Форма допускает традиционное понимание как тени смерти и лексическое понимание как глубокой, смертельной тьмы. «Смертная тень» сохраняет поэтическую связь со смертью и не превращает выражение в отвлечённый термин.
theological_decisions:
- issue: Значение צַלְמָוֶת
  choice: смертную тень
  alternative: глубокую тьму; смертельный мрак; тень смерти
  rationale: Это прежде всего лексико-поэтическая неоднозначность. Основной текст сохраняет образ смерти, а сноска сообщает читателю о распространённом понимании слова как крайней тьмы, не разрешая неоднозначность молча.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Параллелизм двух полустиший сохранён; архаизмы и конфессионально окрашенная терминология не использованы.
