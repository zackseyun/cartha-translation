base_translation:
  language: en
  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: ru
  text: 'Он возвеличивает народы[a] — и губит их;

    даёт народам разрастись — и уводит их[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умножает народы».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ведёт их». Еврейское выражение также может передавать мысль о распространении народов и последующем водительстве; основной текст отражает вероятный в данном контексте поворот от расширения к удалению.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: возвеличивает
  rationale: 'Причастие породы хифиль от שׂגא выражает причинное значение: делать великим, увеличивать. «Возвеличивает» сохраняет это значение и не сужает его до материального процветания.'
- source_word: לַגּוֹיִם
  choice: народы
  rationale: גּוֹיִם здесь обозначает народы как историко-политические общности, без обязательного противопоставления Израилю.
- source_word: וַיְאַבְּדֵם
  choice: и губит их
  rationale: Форма от אבד передаёт причинение гибели. «Губит» кратко и естественно противопоставлено возвеличиванию.
- source_word: שֹׁטֵחַ
  choice: расширяет пределы
  rationale: Глагол שטח передаёт образ распространения, расширения. Уточнение «пределы» делает выражение естественным по-русски и передаёт вероятное территориальное расширение народов, не превращая его в однозначное процветание.
- source_word: וַיַּנְחֵם
  choice: и уводит их
  rationale: נחה обычно значит «вести, направлять». В контексте подъёма и гибели народов приставочное «уводит» сохраняет образ движения и вероятный оттенок обратного действия, хотя положительное «ведёт» также возможно.
theological_decisions:
- issue: Характер движения народов во второй строке
  choice: Бог расширяет пределы народов, а затем уводит их
  alternative: Бог распространяет народы и ведёт их
  rationale: Контекст подчёркивает Божью власть над возвышением и падением народов. Перевод «уводит» передаёт вероятный обратный поворот параллелизма, а сноска сохраняет возможность нейтрального значения «ведёт, направляет».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим ритмом. Тире подчёркивает резкие повороты между возвышением и гибелью, расширением и удалением. Смысловая неоднозначность נחה сохранена в сноске.
