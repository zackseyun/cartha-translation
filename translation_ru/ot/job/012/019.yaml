lexical_decisions:
- source_word: מוֹלִיךְ
  choice: уводит
  rationale: Причастие породы хифиль от הלך обозначает побуждение идти; в контексте суда естественно передаётся как «уводит».
- source_word: כֹּהֲנִים
  choice: священников
  rationale: Прямое и общеупотребительное значение слова; речь идёт о влиятельных религиозных лицах.
- source_word: שׁוֹלָל
  choice: ограбленными
  rationale: Форма от שלל выражает лишение имущества, положения и чести. «Ограбленными» естественно передаёт унижение и разорение, а возможный образ людей, уводимых как добыча, сохранён в сноске.
- source_word: אֵתָנִים
  choice: могущественных
  rationale: Слово указывает на силу, прочность или устойчивость. В перечне влиятельных людей «могущественные» естественно передаёт основной контекстуальный смысл, не устраняя альтернативу «непоколебимые».
- source_word: יְסַלֵּף
  choice: низвергает
  rationale: Пиэль от סלף буквально связан с искривлением или извращением; здесь речь о разрушении устойчивого положения сильных. «Низвергает» ясно передаёт контекстуальный результат действия.
theological_decisions:
- issue: Подразумеваемый субъект в контексте Иов 12
  choice: Сохранить местоимение «Он», относящееся к Богу
  alternative: Явно назвать Бога
  rationale: В окружающих стихах продолжается описание Божьих действий. Местоимение сохраняет поэтическую связность еврейского текста и не добавляет имени там, где оно не повторено.
- issue: Характер Божьего действия над אֵתָנִים
  choice: Передать как низвержение могущественных
  alternative: «Искажает пути непоколебимых» или «лишает опоры стойких»
  rationale: Контекст говорит о ниспровержении влиятельных и устойчивых фигур, однако буквальный оттенок «искривлять» не превращён в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. «Низвергает» несколько возвышенно, но понятно и соответствует контексту суда; неоднозначность ключевых слов отражена в сносках.
