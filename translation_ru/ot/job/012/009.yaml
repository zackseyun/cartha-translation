  text: מִ֭י לֹא יָדַ֣ע בְּ/כָל אֵ֑לֶּה כִּ֥י יַד יְ֝הוָה עָ֣שְׂתָה זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: ru
  text: Кто из всех них не знает, что рука Яхве[a] сделала это?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לֹא יָדַע
  choice: Кто… не знает
  rationale: Риторический вопрос передан естественным русским настоящим временем; он выражает общеизвестность, а не просто завершённое познание в прошлом.
- source_word: בְּ/כָל אֵלֶּה
  choice: из всех них
  rationale: Предлог בְּ здесь имеет партитивный смысл. Местоимение «них» естественно отсылает к перечисленным ранее живым существам и сохраняет множественное число исходного выражения.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание знания.
- source_word: יַד
  choice: рука
  rationale: Сохранён ясный антропоморфный образ, обозначающий действие и силу Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עָשְׂתָה זֹּאת
  choice: сделала это
  rationale: Буквально сохраняются широкое значение עשה и указательное местоимение единственного числа; форма женского рода согласуется в еврейском с существительным «рука» и естественно воспроизводится по-русски.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл образа «рука Яхве»
  choice: Сохранить образ буквально
  alternative: «сила Яхве» или «Яхве совершил»
  rationale: Исходная метафора понятна современному русскому читателю и одновременно выражает Божественную силу и непосредственное действие, не устраняя антропоморфизм текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторическая краткость и образ «рука Яхве» сохранены.
