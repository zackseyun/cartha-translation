  text: Should he argue with useless words[a], or with speech that does no good?
translation:
  language: ru
  text: Станет ли он спорить бесполезными речами и словами, которыми ничего не добьётся?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹכֵחַ
  choice: доказывать
  rationale: Форма от יכח может означать «спорить», «рассуждать», «обличать» или «доказывать». В контексте спора Елифаз порицает доводы Иова; «доказывать» естественно передаёт попытку убеждать посредством речи, не усиливая судебного оттенка.
- source_word: בְּדָבָר לֹא יִסְכּוֹן
  choice: бесполезными речами
  rationale: דָבָר здесь обозначает речь, а לא יסכון — отсутствие пользы или действенности. Множественное «речами» естественно по-русски и сохраняет параллелизм со «словами».
- source_word: וּמִלִּים
  choice: и словами
  rationale: מִלִּים буквально означает «слова». Союз ו передан как «и», что сохраняет еврейскую структуру единого риторического вопроса и не превращает параллельные выражения в взаимоисключающие варианты.
- source_word: לֹא יוֹעִיל בָּם
  choice: от которых нет пользы
  rationale: יועיל выражает пользу или действенность; בם относится к словам. Формулировка ясно передаёт их безрезультатность и звучит естественно на современном русском языке.
