lexical_decisions:
- source_word: מַה יָדַעְתָ וְלֹא נֵדָע
  choice: Что ты знаешь, чего не знаем мы?
  rationale: Вопросительное מַה и противопоставление форм знания переданы естественным русским риторическим вопросом; конечное «мы» сохраняет смысловое ударение еврейской строки.
- source_word: תָבִין
  choice: Что ты понимаешь
  rationale: Форма от בין обозначает понимание или способность различать; «понимаешь» ясно и естественно продолжает параллелизм со «знаешь».
- source_word: וְלֹא עִמָנוּ הוּא
  choice: чего нет у нас
  rationale: Буквальное «и не с нами это» в данном контексте выражает обладание знанием или пониманием. Русское «чего нет у нас» сохраняет образ присутствия/обладания и звучит естественнее буквальной конструкции.
