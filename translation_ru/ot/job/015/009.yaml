  text: What do you know that we do not know? What do you understand that is not with us?[a]
translation:
  language: ru
  text: Что ты знаешь, чего не знаем мы? Что ты понимаешь, чего нет у нас?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чего мы не имеем». Буквально по-еврейски: «и не с нами это».'
