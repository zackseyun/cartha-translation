lexical_decisions:
- source_word: מַה
  choice: Что
  rationale: 'В первой части вопросительное מַה можно сохранить буквально как «что»: речь идёт о силе, увлекающей Иова, причём подлежащим прямо названо его сердце.'
- source_word: יִקָּחֲךָ
  choice: увлекает тебя
  rationale: Форма от לקח буквально означает «берёт тебя». В сочетании с «сердце» естественное русское «увлекает тебя» передаёт образ внутреннего побуждения, которое уносит человека за собой.
- source_word: לִבֶּךָ
  choice: твоё сердце
  rationale: Буквальный образ сердца как внутреннего центра мыслей и чувств понятен современному русскому читателю и не нуждается в истолковывающей замене.
- source_word: וּמַה
  choice: и отчего
  rationale: Во второй параллельной части מַה выражает вопрос о причине или побуждении. «Отчего» естественно вводит риторический вопрос и избегает тяжеловесного повтора.
- source_word: יִרְזְמוּן
  choice: сверкают
  rationale: Редкий глагол имеет неясный точный оттенок; возможны значения, связанные с миганием, подмигиванием или выразительным движением глаз. «Сверкают» естественно передаёт напряжённый взгляд в контексте упрёка, а неопределённость отмечена в сноске.
- source_word: עֵינֶיךָ
  choice: твои глаза
  rationale: Буквальный перевод сохраняет телесный и выразительный образ исходного текста.
