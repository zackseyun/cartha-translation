lexical_decisions:
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание обвинения, продолжая вопрос предыдущего стиха; русское «что» естественно связывает обе строки.
- source_word: תָשִׁיב
  choice: обращаешь
  rationale: Порода хифиль глагола שוב здесь означает направлять или обращать внутреннее расположение; настоящее время соответствует контексту прямого упрёка.
- source_word: אֶל אֵל
  choice: против Бога
  rationale: Предлог אֶל буквально указывает направление «к Богу», но обвинительный контекст придаёт этому направлению смысл противостояния; подлинная лексическая неоднозначность отмечена в сноске.
- source_word: רוּחֶךָ
  choice: свой дух
  rationale: רוּחַ здесь обозначает внутренний дух или расположение человека, а не буквальные ветер или дыхание.
- source_word: וְהֹצֵאתָ
  choice: и извергаешь
  rationale: Хифиль глагола יצא буквально передаёт выведение наружу. «Извергаешь» сохраняет образ выхода слов из уст и уместную для обвинения резкость, не сводя выражение к нейтральному «произносишь».
- source_word: מִפִּיךָ
  choice: из уст
  rationale: Предлог מִן обозначает источник; «из уст» естественно сохраняет конкретный образ оригинала. Притяжательность ясна из обращения к собеседнику.
- source_word: מִלִּין
  choice: такие слова
  rationale: Арамеизирующая форма множественного числа означает «слова, речения». Указательное «такие» естественно отсылает к порицаемой речи Иова в контексте, хотя в еврейском выражено просто «слова».
theological_decisions:
- issue: Направлен ли дух Иова к Богу или против Бога
  choice: против Бога
  alternative: к Богу
  rationale: Сам предлог אֶל обычно значит «к, по направлению к», тогда как смысл противостояния выводится из обвинительного контекста. Основной текст делает прагматический смысл ясным, а сноска сохраняет буквальную возможность.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и обвинительной силы реплики Елифаза. «Дух» оставлен как ёмкий антропологический термин; перенос строки отражает двучленную структуру стиха.
