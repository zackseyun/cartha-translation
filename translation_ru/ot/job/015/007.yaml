  text: Were you born as the first man[a], and were you brought forth before the hills?
translation:
  language: ru
  text: Разве ты родился первым человеком[a] и был рождён прежде холмов?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «Разве ты родился как Адам, первый человек?» В еврейском тексте сказано «первый человек»; это может быть намёком на Адама, но его имя прямо не употреблено.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/רִאישׁוֹן אָדָם
  choice: разве ты родился первым человеком
  rationale: Вопросительная частица вводит риторический вопрос; רִאשׁוֹן указывает на первенство во времени, а אָדָם здесь естественно понимать как «человек». Творительный падеж передаёт предикативный смысл без излишней конкретизации.
- source_word: תִּוָּלֵד
  choice: родился
  rationale: Нифаль глагола ילד обычно означает «родиться»; это прямой и естественный русский эквивалент.
- source_word: וְ/לִ/פְנֵי גְבָעוֹת
  choice: и ... прежде холмов
  rationale: Сочетание выражает второй согласованный вопрос о временном предшествовании. «Прежде» сохраняет возвышенный поэтический регистр, а «холмы» прямо передаёт גְבָעוֹת.
- source_word: חוֹלָלְתָּ
  choice: появился на свет
  rationale: Глагол использует образ рождения. Формулировка «появился на свет» сохраняет этот образ и позволяет избежать неестественного повтора «родился».
theological_decisions:
- issue: Следует ли понимать אָדָם как имя Адам или как нарицательное «человек»
  choice: Нарицательное «человек» в выражении «первым человеком»
  alternative: «Адамом, первым человеком»
  rationale: Риторический вопрос касается первозданной древности и мудрости. Еврейский текст допускает намёк на Адама, но не требует воспринимать אָדָם как имя собственное; основной перевод сохраняет эту неоднозначность, а возможная аллюзия отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллелизм двух риторических вопросов сохранён; во второй части использовано «появился на свет», чтобы передать повторный образ рождения без тяжёлого лексического повтора.
