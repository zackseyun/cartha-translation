  yaml_path: translation/ot/job/015/014.yaml
  text: What is man[a], that he should be pure, or one born of a woman[c][b], that he should be righteous?
translation:
  language: ru
  text: Что такое человек[a], чтобы он был чист[b], и чтобы рождённый женщиной был праведен[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может подчёркивать слабость и смертность человека; единственное число здесь относится к людям вообще.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «невинен». Еврейский глагол означает быть чистым, свободным от нечистоты или вины.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «прав».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Что такое
  rationale: Сохраняет форму риторического вопроса о положении и природе человека и естественно звучит по-русски.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Передаёт собирательно-родовое значение единственного числа; оттенок человеческой слабости и смертности отмечен в сноске.
- source_word: כִּי
  choice: чтобы
  rationale: 'Вслед за вопросительным оборотом вводит подразумеваемо невозможное или поразительное состояние: «чтобы он был…».'
- source_word: יִזְכֶּה
  choice: был чист
  rationale: Глагол זכה обозначает чистоту, в данном контексте прежде всего нравственную, не исключая образа очищенности.
- source_word: וְכִי
  choice: и … чтобы
  rationale: Сохраняет еврейское соединение двух параллельных риторических частей, не превращая их в логические альтернативы.
- source_word: יִצְדַּק
  choice: был праведен
  rationale: Передаёт состояние праведности, не сужая смысл до технического понятия оправдания.
- source_word: יְלוּד אִשָּׁה
  choice: рождённый женщиной
  rationale: Близко воспроизводит еврейское выражение о человеке как существе смертном и немощном и сохраняет поэтический параллелизм.
theological_decisions:
- issue: Объём значения אֱנוֹשׁ и יְלוּד אִשָּׁה
  choice: 'Единственное число с родовым значением: «человек» и «рождённый женщиной»'
  alternative: «Человеческое существо» или «всякий, кто рождён женщиной»
  rationale: Еврейские формы имеют мужской род и единственное число, но представляют человечество вообще; перевод сохраняет как грамматическую форму, так и общий смысл.
- issue: Нравственный и судебный оттенки יִצְדַּק
  choice: «был праведен»
  alternative: «был прав», «был оправдан»
  rationale: Широкое обозначение праведного состояния сохраняет напряжение текста и не вводит более узкую позднейшую богословскую терминологию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим синтаксисом. Тире обозначает эллипсис во второй параллельной части и не добавляет нового смыслового отношения.
