base_translation:
  language: en
  yaml_path: translation/ot/job/015/027.yaml
  text: because he has covered his face with his fat[a], and has put fatness on his loins.
translation:
  language: ru
  text: Ибо он покрыл своё лицо жиром и образовал жировые складки на боках.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…и образовал слой жира на пояснице». Редкое слово פִּימָה может означать толщину или жировую складку; כֶּסֶל — бока, поясницу либо область бёдер.'
    reason: Сохраняет лексическую и анатомическую неопределённость редких слов פִּימָה и כֶּסֶל.
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит объяснение сказанного ранее. «Ведь» естественно передаёт пояснительно-причинный оттенок, не делая причинную связь чрезмерно жёсткой.
- source_word: כִסָּה
  choice: покрыл
  rationale: Глагол означает «покрывать, скрывать». Простое прошедшее время естественно для русского повествования и сохраняет конкретный образ.
- source_word: פָנָיו
  choice: своё лицо
  rationale: Здесь речь идёт о лице как части тела; возвратное притяжательное местоимение соответствует русской норме при подлежащем «он».
- source_word: בְּחֶלְבּוֹ
  choice: жиром
  rationale: חֵלֶב буквально обозначает жир. Конкретный телесный образ сохранён без преждевременного сведения его к отвлечённым понятиям благополучия или самодовольства.
- source_word: וַיַּעַשׂ
  choice: нарастил
  rationale: Буквально глагол значит «сделал». В сочетании с обозначением жира «нарастил» естественно передаёт приобретение телесной полноты, сохраняя активную форму исходного текста.
- source_word: פִּימָה
  choice: жир
  rationale: Редкое существительное, вероятно, обозначает тучность, толщину или жировую прослойку. «Жир» ясно и конкретно передаёт основной образ; возможное значение «жировые складки» вынесено в примечание.
- source_word: עֲלֵי
  choice: на
  rationale: Простой пространственный предлог естественно передаётся русским «на».
- source_word: כָסֶל
  choice: боках
  rationale: Слово может обозначать поясницу, бока или область бёдер. В описании отложения жира «на боках» звучит естественно и не вводит излишне узкую анатомическую трактовку.
theological_decisions:
- issue: Связь телесной тучности с предыдущим описанием нечестивца
  choice: Сохранён конкретный образ без пояснения его богословского смысла
  alternative: Передать жир как метафору богатства, самодовольства или распущенности
  rationale: Исходный текст использует телесную образность, но прямо не раскрывает её символическое значение. Перевод не должен устранять эту напряжённость и навязывать единственное толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой телесной образности еврейской поэзии. Формулировка понятна широкому читателю и избегает как архаичного «чресла», так и разговорного «нагулял жир».
