  text: 'Разве ты слушал на совете Бога[a]

    и удержал мудрость только для себя?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тайном совете Бога»; еврейское слово может означать тайный или доверительный совет, близкий круг, а также сокровенный замысел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/בְ/סוֹד
  choice: на тайном совете
  rationale: Слово סוֹד может обозначать закрытый круг, доверительное совещание или тайное решение. Выражение «на тайном совете» сохраняет образ участия в сокровенном совещании, а не сводит смысл лишь к обладанию скрытой информацией.
- source_word: אֱלוֹהַ
  choice: Бога
  rationale: אֱלוֹהַ — часто употребляемое в книге Иова обозначение Бога в единственном числе; обычный русский эквивалент здесь — «Бог».
- source_word: תִּשְׁמָע
  choice: ты слушал
  rationale: Глагол שׁמע означает «слышать, слушать». В контексте совета «слушал» передаёт внимательное восприятие происходящего и сохраняет риторический вопрос.
- source_word: וְ/תִגְרַע
  choice: и удержал
  rationale: גרע может означать уменьшать, лишать или удерживать. В сочетании с направительным אֵלֶיךָ здесь выражена мысль о том, будто адресат оставил мудрость исключительно за собой; «удержал» естественно передаёт это по-русски, не устраняя оттенка ограничения доступа.
- source_word: אֵלֶי/ךָ
  choice: для себя
  rationale: Предлог אֶל с суффиксом второго лица указывает направленность к адресату; при глаголе «удержал» естественный русский оборот — «для себя».
- source_word: חָכְמָה
  choice: мудрость
  rationale: Прямой и общепринятый эквивалент חָכְמָה; здесь речь идёт о мудрости или проницательности вообще.
theological_decisions:
- issue: Образ סוֹד Бога в речи Елифаза
  choice: «тайный совет Бога» — закрытое совещание, к которому Иов будто бы имел исключительный доступ
  alternative: «тайна Бога» или «совет Бога» в смысле сокровенного замысла
  rationale: Контекст насмешливого риторического вопроса допускает образ участия в Божьем сокровенном совете. Перевод сохраняет этот образ, а сноска отмечает более широкий смысловой диапазон слова, не утверждая конкретного учения о небесном собрании.
translation_notes:
  register: Современный литературный русский язык с краткой поэтической строкой и риторическим «разве». «Тайный совет» выбран ради ясного образа закрытого совещания; «удержал мудрость лишь для себя» звучит естественно и передаёт обвинение в исключительном присвоении мудрости.
