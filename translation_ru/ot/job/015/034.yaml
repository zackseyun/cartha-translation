  yaml_path: translation/ot/job/015/034.yaml
  text: For the company of the godless is barren[b][a], and fire consumes the tents of bribery.
translation:
  language: ru
  text: Ибо сообщество безбожных[a] бесплодно, и огонь пожирает шатры взяточничества[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сообщество лицемера». Еврейское слово חָנֵף может означать «лицемер», но в книге Иова чаще имеет более широкий смысл: «безбожный», «нечестивый».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «шатры взятки». Это образное выражение характеризует жилища как связанные со взятками или взяточничеством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание или пояснение к предшествующей мысли; «ибо» естественно передаёт эту связь в литературном русском языке.
- source_word: עֲדַת
  choice: сообщество
  rationale: Слово обозначает собрание или объединённую группу. «Сообщество» сохраняет собирательный смысл и не привносит церковных ассоциаций слова «община».
- source_word: חָנֵף
  choice: безбожных
  rationale: В книге Иова слово обычно указывает на нечестивого, чуждого почтения к Богу, а не только на лицемера. Еврейское единственное число после собирательного существительного естественно передано русским множественным числом.
- source_word: גַּלְמוּד
  choice: бесплодно
  rationale: Прилагательное выражает лишённость плода, потомства или жизненной силы. «Бесплодно» сохраняет образ отсутствия продолжения и прочного результата.
- source_word: וְאֵשׁ
  choice: и огонь
  rationale: Сохранено простое сочинительное соединение двух параллельных утверждений.
- source_word: אָכְלָה
  choice: пожирает
  rationale: Форма перфекта в изречении выражает общую, наглядно представленную истину. Настоящее время и глагол «пожирает» сохраняют образ огня и афористическую силу.
- source_word: אָהֳלֵי
  choice: шатры
  rationale: Сохранён конкретный образ шатров, соответствующий древнему контексту и понятный современному читателю.
- source_word: שֹׁחַד
  choice: нажитые взятками
  rationale: Буквальное сочетание «шатры взятки» по-русски неестественно. Передача раскрывает подразумеваемую связь жилищ с неправедной выгодой, не меняя нравственного смысла образа.
