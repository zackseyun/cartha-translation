  edition: WLC
  text: לֹֽא יָס֨וּר מִנִּי חֹ֗שֶׁךְ יֹֽ֭נַקְתּ/וֹ תְּיַבֵּ֣שׁ שַׁלְהָ֑בֶת וְ֝/יָס֗וּר בְּ/ר֣וּחַ פִּֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/030.yaml
  text: He will not depart from darkness[a]; a flame will dry up his shoots[b], and by the breath of his mouth he will pass away.
translation:
  language: ru
  text: Он не выйдет из тьмы; пламя иссушит его молодой побег[b], и от дыхания его уст он исчезнет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «и от дыхания Его уст он исчезнет», если речь идёт об устах Бога, а не нечестивого.'
    reason: alternative_reading
  - marker: b
    text: 'Молодой побег продолжает образ растения: нечестивый уподоблен дереву, свежая поросль которого опалена и иссушена.'
    reason: cultural_note
lexical_decisions:
- source_word: יָסוּר ... מִנִּי חֹשֶׁךְ
  choice: не выйдет из тьмы
  rationale: Глагол סור означает «отойти, удалиться», а сочетание с מן указывает на удаление от чего-либо. Русское «не выйдет из тьмы» естественно передаёт невозможность избавиться от тьмы или бедствия, не сводя образ к одному истолкованию.
- source_word: יֹנַקְתּוֹ
  choice: его молодой побег
  rationale: Существительное обозначает молодой побег растения. Единственное число соответствует еврейской форме, а определение «молодой» делает растительный образ ясным современному читателю.
- source_word: תְּיַבֵּשׁ שַׁלְהָבֶת
  choice: пламя иссушит
  rationale: Порода пиэль глагола יבש означает «высушить, иссушить, заставить увянуть», а שַׁלְהֶבֶת — «пламя». Выбор сохраняет образ побега, погибающего от жара.
- source_word: וְיָסוּר
  choice: он исчезнет
  rationale: Повторный глагол סור здесь описывает окончательное удаление или гибель нечестивого. «Исчезнет» естественно выражает результат, тогда как буквальное «отойдёт» в этой фразе по-русски было бы неясным.
- source_word: בְּרוּחַ פִּיו
  choice: от дыхания его уст
  rationale: רוּחַ может означать «дыхание», «ветер» или «дух»; в сочетании с «устами» конкретное «дыхание» наиболее непосредственно. Предлог «от» передаёт причину или действующую силу.
- source_word: פִּיו
  choice: его уст
  rationale: Местоименный суффикс третьего лица мужского рода не уточняет, относится ли он к нечестивому или, при подразумеваемой смене субъекта, к Богу. Строчная форма «его» сохраняет ближайшую синтаксическую связь, а сноска отмечает другую возможность.
theological_decisions:
- issue: К кому относится выражение «его уст» в заключительной части стиха
  choice: К устам нечестивого, который остаётся ближайшим названным лицом
  alternative: К устам Бога, чьё дыхание совершает суд
  rationale: Еврейский текст не обозначает явной смены субъекта, поэтому основной текст следует ближайшей грамматической связи. Вместе с тем образ губительного дыхания уст может указывать на Божий суд; эта богословски значимая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены образ тьмы, растительная метафора и неоднозначность заключительного местоимения; архаичное «уста» употреблено в устойчивом библейско-поэтическом сочетании без чрезмерной стилизации.
