  text: כִּ֤י יְאַלֵּ֣ף עֲוֺנְ/ךָ֣ פִ֑י/ךָ וְ֝/תִבְחַ֗ר לְשׁ֣וֹן עֲרוּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/005.yaml
  text: For your iniquity teaches your mouth[b][a], and you choose the tongue of the crafty.
translation:
  language: ru
  text: Ведь твоё беззаконие учит твои уста[a], и ты избираешь язык коварных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоя вина учит твои уста»; еврейское עָוֹן может означать беззаконие, вину или несение вины — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «язык хитрых»; еврейское слово может обозначать как благоразумных и проницательных, так и хитрых, коварных людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит обоснование обвинения Елифаза и естественно связывает стих с предшествующим рассуждением.
- source_word: יְאַלֵּף
  choice: учит
  rationale: Пиэль глагола אלף означает «учить, наставлять»; перевод сохраняет олицетворение беззакония как наставника речи.
- source_word: עֲוֺנְךָ
  choice: твоё беззаконие
  rationale: עָוֹן может обозначать беззаконие, вину или несение вины; здесь нравственный порок представлен источником речи Иова.
- source_word: פִיךָ
  choice: твои уста
  rationale: Сохраняется образ органа речи; «уста» уместно в современном литературном поэтическом регистре и образует параллель с «языком».
- source_word: וְתִבְחַר
  choice: и ты избираешь
  rationale: Глагол בחר прямо означает «выбирать»; форма сохраняет непосредственное обвинение во втором лице.
- source_word: לְשׁוֹן
  choice: язык
  rationale: Буквальный образ «языка» сохраняет поэтический параллелизм с «устами» и одновременно обозначает манеру речи.
- source_word: עֲרוּמִים
  choice: коварных
  rationale: В обвинительном контексте עָרוּם имеет отрицательный оттенок хитрости и лукавого умысла; субстантивированное «коварных» передаёт множественное число.
theological_decisions:
- issue: Нравственный оттенок עָוֹן в обвинении
  choice: «твоё беззаконие»
  alternative: «твоя вина» или «твой грех»
  rationale: «Беззаконие» сохраняет сильный нравственный смысл обвинения, тогда как «вина» может быть понята преимущественно как состояние виновности. Лексическая неоднозначность отмечена в сноске.
- issue: Оценочная окраска עֲרוּמִים
  choice: «коварных»
  alternative: «хитрых» или «проницательных»
  rationale: Хотя слово может иметь положительное значение благоразумия, контекст речи Елифаза требует отрицательной окраски, не уточняя конкретный способ обмана.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой («уста», «избираешь»). Сохранены параллельные образы уст и языка, прямое обвинение Елифаза и неоднозначность ключевых еврейских слов.
