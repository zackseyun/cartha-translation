  yaml_path: translation/ot/job/015/033.yaml
  text: He will shake off his unripe grapes like a vine[b][a], and cast off his blossom like an olive tree.
translation:
  language: ru
  text: Он, как виноградная лоза, сорвёт свой незрелый виноград[a] и, как оливковое дерево, сбросит свой цвет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оберёт свой незрелый виноград». Еврейский глагол часто выражает насильственное отнятие или обирание, но здесь образ указывает на преждевременную потерю плода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свои цветки» или «своё цветение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְמֹס
  choice: сбросит
  rationale: В сельскохозяйственном образе глагол передаёт преждевременную утрату плода. «Сбросит» естественно по-русски сочетается с образом лозы, хотя еврейский корень обычно выражает более сильное действие — насилие, отнятие или обирание.
- source_word: כַּגֶּפֶן
  choice: словно виноградная лоза
  rationale: Передаёт сравнение с גפן и ясно называет растение, а не его плод.
- source_word: בִּסְרוֹ
  choice: свой незрелый виноград
  rationale: בֹּסֶר обозначает ещё не созревший виноград. Возвратное притяжательное местоимение естественно передаёт суффикс 3-го лица мужского рода и соотносит плод с подлежащим.
- source_word: וְיַשְׁלֵךְ
  choice: и осыплет
  rationale: Форма от שלך буквально выражает бросание или сбрасывание. В сочетании с цветом маслины «осыплет» естественно передаёт активный образ преждевременной потери цветков.
- source_word: כַּזַּיִת
  choice: словно маслина
  rationale: В данном сравнении זית означает оливковое дерево; русское «маслина» литературно и однозначно называет дерево в этом контексте.
- source_word: נִצָּתוֹ
  choice: свой цвет
  rationale: Существительное означает цветок или цветение растения. Собирательное «цвет» кратко и естественно подходит к образу маслины.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением параллелизма двух сельскохозяйственных сравнений. «Виноградная лоза» употреблено для ясности, а «маслина» — как традиционное, но понятное название оливкового дерева. Различие исходных глаголов передано словами «сбросит» и «осыплет».
