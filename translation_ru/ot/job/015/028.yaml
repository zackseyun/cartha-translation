lexical_decisions:
- source_word: וַיִּשְׁכּוֹן
  choice: Он поселился
  rationale: Глагол שכן означает «жить, обитать, поселяться». Совершенный вид естественно передаёт древнееврейскую повествовательную форму, а «поселился» хорошо выражает намеренное обитание в названных местах.
- source_word: עָרִים נִכְחָדוֹת
  choice: в разрушенных городах
  rationale: Причастие от כחד обозначает уничтоженные, разорённые или опустошённые места. «Разрушенные города» ясно передаёт их состояние и поддерживает параллель с грудами развалин.
- source_word: בָּתִּים לֹא יֵשְׁבוּ לָמוֹ
  choice: в домах, где никто не живёт
  rationale: Древнееврейская конструкция с לָמוֹ сжата и допускает разные синтаксические толкования. Безличная русская формулировка естественно передаёт основной смысл — дома остаются необитаемыми, — не создавая искусственной точности.
- source_word: אֲשֶׁר הִתְעַתְּדוּ
  choice: которым суждено стать
  rationale: Форма Hitpael от עתד может означать «быть приготовленным, назначенным, предназначенным». «Суждено» сохраняет направленность к ожидаемому состоянию, не уточняя, кем оно назначено.
- source_word: לְגַלִּים
  choice: грудами развалин
  rationale: גַּלִּים — груды или кучи, особенно камней и обломков. «Груды развалин» конкретизирует подразумеваемый контекст разрушенных построек и звучит естественно по-русски.
