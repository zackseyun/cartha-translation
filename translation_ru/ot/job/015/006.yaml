  language: ru
  text: Твои же уста осуждают тебя, а не я; твои губы свидетельствуют против тебя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвечают против тебя». Еврейский глагол буквально может означать «отвечать», но здесь, вероятно, употреблён в смысле свидетельства против обвиняемого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְשִׁיעֲךָ
  choice: осуждают тебя
  rationale: Порода hифиль глагола רשע обычно означает «признать виновным, осудить». «Осуждают тебя» естественно передаёт судебный оттенок и обвинительную силу собственных слов Иова.
- source_word: פִיךָ
  choice: твои же уста
  rationale: 'Буквально «твой рот». «Уста» соответствует возвышенному поэтическому регистру, а частица «же» подчёркивает противопоставление: Иова осуждает его собственная речь, а не Елифаз.'
- source_word: וְלֹא אָנִי
  choice: а не я
  rationale: Кратко и точно сохраняет прямое противопоставление еврейского текста.
- source_word: וּשְׂפָתֶיךָ
  choice: твои губы
  rationale: Прямое соответствие еврейскому выражению; сохраняется поэтический параллелизм с «устами».
- source_word: יַעֲנוּ
  choice: свидетельствуют
  rationale: 'Хотя основное значение глагола — «отвечать», в данном контексте он имеет судебный оттенок: собственные губы Иова выступают свидетельством против него.'
- source_word: בָךְ
  choice: против тебя
  rationale: 'В сочетании с судебным смыслом יַעֲנוּ предлог естественно передаётся как «против»: слова Иова свидетельствуют ему во вред.'
theological_decisions:
- issue: Степень обвинения, выраженная יַרְשִׁיעֲךָ
  choice: осуждают тебя
  alternative: доказывают, что ты нечестив
  rationale: Выбранный вариант сохраняет судебный смысл, не усиливая утверждение до окончательного богословского вывода о сущности или характере Иова.
