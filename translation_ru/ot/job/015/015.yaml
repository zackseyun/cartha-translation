  text: הֵ֣ן ב/קדש/ו לֹ֣א יַאֲמִ֑ין וְ֝/שָׁמַ֗יִם לֹא זַכּ֥וּ בְ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/015.yaml
  text: Look[a], he puts no trust even in his holy ones, and the heavens are not pure in his eyes.
translation:
  language: ru
  text: Вот, Своим святым[a] Он не доверяет, и небеса не чисты в Его глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Своим святым существам». Вероятно, здесь имеются в виду небесные существа.
    reason: Лексическая альтернатива и пояснение вероятного референта без его чрезмерного уточнения в основном тексте.
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатическое привлечение внимания естественным для современного русского языка способом, без архаического оттенка.
- source_word: בִּקְדֹשָׁיו
  choice: Своим святым
  rationale: Сохраняет буквальное значение «Его святые», не уточняя в основном тексте, люди это или небесные существа; предлог בְּ при глаголе доверия естественно передан русским дательным падежом.
- source_word: לֹא יַאֲמִין
  choice: Он не доверяет
  rationale: В данной конструкции אמן выражает доверие или уверенность; русский глагол «доверять» точно и естественно передаёт этот смысл.
- source_word: וְשָׁמַיִם
  choice: и небеса
  rationale: Сохраняет множественное число еврейского слова и поэтический параллелизм со «святыми».
- source_word: לֹא זַכּוּ
  choice: не чисты
  rationale: В контексте речь идёт о чистоте перед Богом, а не о юридической невиновности; краткая форма естественна в русском сказуемом.
- source_word: בְּעֵינָיו
  choice: в Его глазах
  rationale: Сохраняет еврейский образ Божьей оценки и остаётся понятным современному читателю.
theological_decisions:
- issue: Кого обозначают «Его святые»
  choice: В основном тексте оставлено широкое обозначение «Своим святым»; в примечании указано, что, вероятнее всего, имеются в виду небесные существа.
  alternative: Прямо перевести «Своим ангелам» или понять выражение как указание на святых людей.
  rationale: Параллелизм с небесами указывает на небесных существ, однако еврейский текст буквально говорит «Его святые» и не называет их ангелами. Перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Начальное «Вот» передаёт эмфазу; порядок слов подчёркивает «даже Своим святым». Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому стилю.
