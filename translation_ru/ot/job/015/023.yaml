  text: נֹ֘דֵ֤ד ה֣וּא לַ/לֶּ֣חֶם אַיֵּ֑ה יָדַ֓ע כִּֽי נָכ֖וֹן בְּ/יָד֣/וֹ יֽוֹם חֹֽשֶׁךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/023.yaml
  text: He wanders about for bread[a], saying[b], ‘Where is it?’ He knows that a day of darkness is ready at hand for him.
translation:
  language: ru
  text: 'Он скитается в поисках хлеба[a]: «Где он?» Он знает, что для него уже близок день тьмы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в поисках пищи». Еврейское слово «хлеб» может обозначать пищу вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «готов в его руке». Вероятно, имеется в виду, что день тьмы для него совсем близок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹדֵד
  choice: скитается
  rationale: Причастие породы qal от נדד передаёт продолжающееся беспокойное странствие. «Скитается» естественно выражает эту неустроенность, не добавляя идеи изгнания.
- source_word: לַלֶּחֶם
  choice: в поисках хлеба
  rationale: לֶחֶם буквально означает «хлеб», а шире — пищу. Предлог ל в данном контексте передаёт цель поисков; конкретный образ хлеба сохранён в основном тексте.
- source_word: אַיֵּה
  choice: «Где он?»
  rationale: Вопросительное слово означает «где?». Местоимение «он» естественно восполняет подразумеваемый в русском языке предмет — хлеб — и не меняет смысла вопроса.
- source_word: יָדַע
  choice: Он знает
  rationale: Простая и прямая передача формы ידע, обозначающей твёрдое осознание.
- source_word: נָכוֹן
  choice: уже близок
  rationale: נָכוֹן может означать «готов», «приготовлен», «установлен». Вместе с בְּיָדוֹ выражение указывает на непосредственную близость грозящего дня; «уже близок» естественно передаёт эту мысль по-русски.
- source_word: בְּיָדוֹ
  choice: для него уже близок
  rationale: Буквально выражение значит «в его руке», но здесь, вероятнее всего, описывает то, что находится совсем рядом и неминуемо для него. Перевод передаёт близость, а буквальная форма отмечена в сноске.
- source_word: יוֹם חֹשֶׁךְ
  choice: день тьмы
  rationale: Сочетание обозначает день, характеризуемый тьмой. Сохранён исходный образ без замены его толкованием вроде «день бедствия» или «день суда».
theological_decisions:
- issue: Образный смысл выражения «день тьмы»
  choice: день тьмы
  alternative: день бедствия; день гибели; день суда
  rationale: В речи Елифаза контекст указывает на грядущее бедствие для нечестивого, однако само еврейское выражение остаётся образным и не называет прямо ни суд, ни гибель. Буквенный образ сохраняет богословскую напряжённость текста.
- issue: Характер знания о грядущей тьме
  choice: Он знает, что для него уже близок день тьмы
  alternative: Он знает, что день тьмы приготовлен в его руке
  rationale: Перевод не уточняет источник или богословскую природу угрозы, а лишь сохраняет выраженную текстом уверенность персонажа в её близости.
translation_notes:
  register: Современный литературный русский язык с кратким, выразительным синтаксисом. «Скитается» сохраняет возвышенную серьёзность речи, оставаясь понятным современному читателю. Прямая речь в вопросе отражает наиболее вероятное членение фразы, но не перегружена пояснениями.
