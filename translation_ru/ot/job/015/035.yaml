  text: הָרֹ֣ה עָ֭מָל וְ/יָ֣לֹד אָ֑וֶן וּ֝/בִטְנָ֗/ם תָּכִ֥ין מִרְמָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/015/035.yaml
  text: They conceive trouble and give birth to wickedness[a]; their womb prepares deceit.
translation:
  language: ru
  text: Они зачинают беду и рождают зло[a], и их чрево готовит обман.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они беременны бедой и рождают беззаконие».'
    reason: 'Лексическая альтернатива: הָרֹה допускает состояние беременности, а אָוֶן — перевод «беззаконие».'
lexical_decisions:
- source_word: הָרֹה
  choice: зачинают
  rationale: Причастие Qal от הרה продолжает метафору беременности и вместе с «рождают» естественно передаёт последовательность зачатия и рождения.
- source_word: עָמָל
  choice: беду
  rationale: В литературе мудрости עָמָל может обозначать беду, тяготу или пагубное деяние; «беду» сохраняет широкую поэтическую семантику и нравственно отрицательный контекст.
- source_word: וְיָלֹד
  choice: и рождают
  rationale: Форма от ילד буквально относится к рождению; современный глагол «рождают» ясно сохраняет развёрнутую метафору.
- source_word: אָוֶן
  choice: зло
  rationale: אָוֶן может означать зло, нечестие или бедствие. «Зло» передаёт нравственную силу слова, не сужая его до конкретного вида греха.
- source_word: וּבִטְנָם
  choice: и их чрево
  rationale: בטן значит «живот, утроба, чрево». «Чрево» поддерживает образ вынашивания, звучит достойно и допускает собирательное употребление при множественном притяжательном местоимении.
- source_word: תָּכִין
  choice: готовит
  rationale: Hiphil от כון означает «готовить, устраивать, утверждать»; «готовит» естественно описывает внутреннее созревание того, что затем обнаружится.
- source_word: מִרְמָה
  choice: обман
  rationale: מִרְמָה обозначает обман или коварство. «Обман» краток, понятен современному читателю и не добавляет отсутствующей в тексте конкретизации.
theological_decisions:
- issue: Число подразумеваемого подлежащего
  choice: 'Множественное обобщающее: «они… их»'
  alternative: 'Единственное обобщающее: «он… его»'
  rationale: Хотя הָרֹה имеет форму единственного числа, суффикс 3-го лица множественного числа в וּבִטְנָם и контекст характеристики нечестивых как группы поддерживают множественное обобщение. Оно также позволяет избежать неестественного рассогласования в русском тексте.
- issue: Соотношение אָוֶן с нравственным злом и бедствием
  choice: «зло»
  alternative: «беззаконие» или «бедствие»
  rationale: Контекст обвинения и параллель с «обманом» придают слову нравственный оттенок, однако его семантика шире юридически или богословски нагруженного «беззакония»; поэтому выбрано более ёмкое «зло».
translation_notes:
  register: Современный литературный русский с сохранением лаконичного параллелизма и телесной метафоры древнееврейского текста. «Чрево» выбрано как умеренно возвышенное поэтическое слово; более бытовая «утроба» при сочетании «их утроба» звучит менее естественно.
