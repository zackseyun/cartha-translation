  source_fidelity: 'Текст точно передаёт образную последовательность еврейского оригинала: зачатие/беременность, рождение и внутреннее приготовление. «Беда» уместно передаёт עָמָל, «зло» сохраняет нравственно отрицательную, но не чрезмерно узкую семантику אָוֶן, а «обман» соответствует מִרְמָה. Множественное обобщающее «они… их» оправдано суффиксом 3-го лица множественного числа и контекстом характеристики нечестивых как класса.'
