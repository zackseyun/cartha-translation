  text: because he has stretched out his hand against God[a], and has shown himself mighty against the Almighty.
translation:
  language: ru
  text: 'Потому что он простёр руку против Бога[a]

    и выступает с силой против Всемогущего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёр руку к Богу и делает себя сильным против Всемогущего».'
    reason: Сохраняет более буквальное значение предлога אֶל («к, по направлению к») и рефлексивный оттенок формы יִתְגַּבָּר («делает себя сильным»).
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит причину постигшей нечестивца участи в контексте; «потому что» ясно передаёт причинную связь.
- source_word: נָטָה ... יָדוֹ
  choice: простёр руку
  rationale: Сохраняет конкретный древнееврейский образ; в сочетании с контекстом и предлогом «против» выражает враждебное выступление.
- source_word: אֶל
  choice: против
  rationale: Буквальное направление «к/по направлению к» в данном контексте имеет враждебный смысл, естественно передаваемый по-русски предлогом «против».
- source_word: אֵל
  choice: Бога
  rationale: Обычное обозначение Бога; отдельный перевод сохраняет параллелизм с титулом שַׁדַּי во второй строке.
- source_word: שַׁדַּי
  choice: Всемогущего
  rationale: Передаёт божественный титул смысловым переводом, традиционным и понятным в современном русском языке.
- source_word: יִתְגַּבָּר
  choice: восстал
  rationale: В контексте самонадеянного противостояния Всемогущему передаёт активное проявление силы и враждебный вызов; буквальный оттенок «делать себя сильным» отмечен в сноске.
theological_decisions:
- issue: Передача параллельных божественных обозначений אֵל и שַׁדַּי
  choice: «Бог» и «Всемогущий»
  alternative: «Бог» и «Шаддай»
  rationale: Смысловой перевод титула שַׁדַּי понятен читателю и сохраняет различие двух обозначений без их искусственного отождествления.
- issue: Характер противостояния человека Богу
  choice: «простёр руку против Бога… восстал против Всемогущего»
  alternative: «простёр руку к Богу… укрепляется против Всемогущего»
  rationale: Основной текст естественно выражает подразумеваемую контекстом враждебность, а сноска сохраняет более буквальную направленность предлога и рефлексивную силу глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Строковое членение отражает древнееврейский параллелизм; форма «простёр» сохраняет возвышенный, но понятный библейский образ.
