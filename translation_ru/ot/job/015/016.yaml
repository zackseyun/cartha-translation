  text: Тем более человек, отвратительный и осквернённый[a], пьющий беззаконие[b], как воду!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «растленный», «нечистый». Еврейское נֶאֱלָח — редкое слово со значением загрязнённости, скверны или нравственной испорченности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «несправедливость», «неправедность» или «зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: тем более
  rationale: 'В контексте выражает усиленный вывод a fortiori после предыдущего стиха: если даже небеса нечисты перед Богом, то тем более человек. В отрицательно окрашенном контексте русское «тем более» естественно передаёт этот ход мысли.'
- source_word: נִתְעָב
  choice: отвратительный
  rationale: Причастная форма обозначает того, кто вызывает отвращение; выбор сохраняет сильную оценочную окраску еврейского слова.
- source_word: נֶאֱלָח
  choice: растленный
  rationale: Редкое слово указывает на осквернённость, нечистоту или нравственную испорченность. «Растленный» естественно передаёт здесь прежде всего нравственное состояние; возможный оттенок нечистоты отмечен в сноске.
- source_word: אִישׁ
  choice: человек
  rationale: Еврейское существительное стоит в единственном числе и здесь обозначает отдельного человека как представителя человечества. Русское «человек» точно и естественно сохраняет форму и обобщающий смысл.
- source_word: שֹׁתֶה
  choice: пьющий
  rationale: Причастие передано причастием, что сохраняет сжатое строение и характеристику постоянного, привычного действия.
- source_word: כַמַּיִם
  choice: как воду
  rationale: Прямо сохраняет сравнение, передающее лёгкость, привычность и обилие действия.
- source_word: עַוְלָה
  choice: неправду
  rationale: Слово охватывает неправедность, зло и несправедливость. «Неправду» можно естественно «пить» в русском образном выражении, и она сохраняет широкую нравственную направленность слова, не сужая его лишь до общественной несправедливости.
theological_decisions:
- issue: Обобщающее обозначение человека
  choice: человек
  alternative: мужчина; люди; человечество
  rationale: אִישׁ — существительное мужского рода в единственном числе, но в данном изречении оно имеет представительный смысл. «Человек» сохраняет единственное число и не сужает утверждение до взрослых мужчин.
- issue: Нравственный смысл עַוְלָה
  choice: неправда
  alternative: несправедливость; беззаконие; неправедность
  rationale: Перевод сохраняет широкое обозначение нравственного зла и не вводит более узкое юридическое либо позднейшее богословское значение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Сжатая причастная конструкция воспроизводит плотность еврейской строки; тире подчёркивает вывод из предыдущего стиха. Все сноски отмечены в основном тексте.
