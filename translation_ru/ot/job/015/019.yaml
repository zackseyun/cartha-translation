  text: To them alone the land was given[b][a], and no stranger passed among them.
translation:
  language: ru
  text: Только им была дана земля[a], и никакой чужеземец не проходил среди них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна». Еврейское אֶרֶץ может означать как землю вообще, так и определённую страну или территорию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не проходил в их среде».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֶם לְבַדָּם
  choice: только им
  rationale: 'Сочетание местоименной формы с לְבַדָּם выражает исключительность: земля была дана именно им и никому иному.'
- source_word: נִתְּנָה
  choice: была дана
  rationale: Нифаль глагола נתן имеет здесь пассивное значение; русский перевод сохраняет пассивную конструкцию.
- source_word: הָאָרֶץ
  choice: земля
  rationale: אֶרֶץ допускает значения «земля» и «страна». В контексте владения и отсутствия чужаков «земля» естественно обозначает принадлежащую народу территорию, не исключая более широкого оттенка.
- source_word: זָר
  choice: чужеземец
  rationale: Слово обозначает чужого, постороннего по отношению к данной общине. «Чужеземец» сохраняет связь с территориальным контекстом, не уточняя национальность.
- source_word: עָבַר בְּתוֹכָם
  choice: не проходил среди них
  rationale: עָבַר передаёт движение мимо или через пространство, а בְּתוֹכָם — нахождение «среди них», «в их среде». Формулировка близка к еврейскому тексту и естественна по-русски.
