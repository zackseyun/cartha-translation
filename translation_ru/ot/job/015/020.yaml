    reason: cultural_note
lexical_decisions:
- source_word: כָּל יְמֵי רָשָׁע
  choice: Во все свои дни нечестивец
  rationale: Конструкция выражает всю продолжительность дней нечестивца. Местоимение «свои» естественно передаёт по-русски принадлежность дней названному лицу, не меняя смысла.
- source_word: הוּא מִתְחוֹלֵל
  choice: корчится
  rationale: Форма Hitpolel от חול обозначает продолжающееся мучительное извивание, содрогание или родовые муки. «Корчится» сохраняет телесную образность и интенсивность, не добавляя отсутствующего в тексте уточнения «от мучений».
- source_word: וּמִסְפַּר שָׁנִים
  choice: и … определённое число лет
  rationale: Речь идёт о некотором установленном, но не названном числе лет. «Определённое число» яснее передаёт фиксированность срока, чем разговорное «сколько-то лет».
- source_word: נִצְפְּנוּ
  choice: припасено
  rationale: Nifal от צפן допускает значения «сокрыто», «сохранено», «отложено, предназначено». «Припасено» сохраняет метафору отложенного запаса и естественно сочетается с «числом лет».
- source_word: לֶעָרִיץ
  choice: для безжалостного
  rationale: עָרִיץ обозначает жестокого, насильственного, притесняющего человека. «Безжалостный» передаёт нравственную жестокость, не сужая значение до политического тирана.
