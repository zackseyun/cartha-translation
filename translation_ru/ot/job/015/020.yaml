  text: All the days of the wicked man he writhes[c][b][a], and a number of years are stored up for the ruthless.
translation:
  language: ru
  text: Во все свои дни нечестивец[c] корчится[a], и некоторое число лет сохранено для безжалостного[b].
  philosophy: optimal-equivalence
  footnotes:
