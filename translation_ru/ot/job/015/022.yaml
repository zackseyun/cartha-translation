  text: He does not expect to return from darkness[a], and he is destined for the sword.
translation:
  language: ru
  text: Он не надеется вернуться из тьмы, и он обречён на меч[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза трудна. Возможны также переводы: «меч подстерегает его», «меч ожидает его» или «он предназначен для меча». Вероятно, фраза говорит о нависшей угрозе насильственной гибели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַאֲמִין
  choice: не надеется
  rationale: В данном контексте форма от אמן выражает не религиозную веру, а уверенность или ожидание будущего; «не надеется» естественно передаёт отсутствие ожидания благополучного исхода.
- source_word: שׁוּב מִנִּי חֹשֶׁךְ
  choice: вернуться из тьмы
  rationale: Сохранены значение возвращения и образ тьмы; образ может обозначать как буквальную тьму, так и бедствие или близость смерти.
- source_word: וְצָפוּ הוּא אֱלֵי חָרֶב
  choice: и ему суждено погибнуть от меча
  rationale: Еврейская форма и синтаксис трудны. Перевод естественно передаёт направленность к мечу и угрозу насильственной смерти, не вводя конкретного исполнителя.
theological_decisions:
- issue: Значение образа «тьма»
  choice: Сохранить образ без пояснения в основном тексте
  alternative: Передать как «бедствие» или «смерть»
  rationale: Еврейский текст допускает образное понимание, но не требует сводить многозначный образ к одному толкованию.
- issue: Смысл заключительной фразы о мече
  choice: Передать как неизбежную гибель от меча и отметить лексическую трудность
  alternative: «Меч подстерегает его» или «меч ожидает его»
  rationale: Контекст говорит о грозящей насильственной гибели, однако необычная еврейская форма не позволяет безоговорочно закрепить лишь один синтаксический разбор.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и торжественно без архаизмов. Образ «тьмы» сохранён, а не истолкован однозначно.
