lexical_decisions:
- source_word: הֶחָכָם
  choice: мудрец
  rationale: Вопросительная частица при חָכָם вводит риторический вопрос; единственное число передано естественным русским существительным мужского рода.
- source_word: יַעֲנֶה
  choice: станет отвечать
  rationale: Имперфект в риторическом вопросе выражает не только действие, но и упрёк в его неуместности; «станет отвечать» естественно передаёт этот оттенок.
- source_word: דַעַת רוּחַ
  choice: пустым знанием
  rationale: Буквально сочетание означает «знанием ветра»; в контексте רוח обозначает нечто пустое, бесплотное. Основной текст передаёт смысл, а сноска сохраняет буквальный образ и неоднозначность конструкции.
- source_word: וִימַלֵּא
  choice: и наполнять
  rationale: Форма продолжает единый риторический вопрос и сохраняет прямой образ наполнения.
- source_word: קָדִים
  choice: восточным ветром
  rationale: קָדִים — восточный ветер, часто сухой и губительный; перевод сохраняет конкретный образ без добавления невыраженного определения.
- source_word: בִּטְנוֹ
  choice: своё чрево
  rationale: Буквальный телесный образ בטן сохранён; «чрево» звучит dignified и уместно в поэтической речи, при этом связь с подлежащим естественно выражена возвратным местоимением.
