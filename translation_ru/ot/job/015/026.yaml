lexical_decisions:
- source_word: יָרוּץ
  choice: бросается
  rationale: Глагол רוץ буквально означает «бежать», но во враждебном контексте передаёт стремительное нападение; «бросается» естественно выражает это движение, не превращая образ в специальный военный термин.
- source_word: אֵלָיו
  choice: на Него
  rationale: При глаголе стремительного движения אֶל обозначает направленность нападения. Местоимение относится к Богу из предшествующего контекста; прописная буква служит русской издательской норме для такого референта.
- source_word: בְּצַוָּאר
  choice: выставив шею
  rationale: 'Буквально: «с шеей / шеей». Русское «выставив шею» сохраняет телесный образ и передаёт позу дерзкого, лобового натиска, не уточняя её как «жёсткую» или «вытянутую» без прямого указания в тексте.'
- source_word: בַּעֲבִי
  choice: толстыми
  rationale: Существительное עֳבִי обозначает толщину или массивность; в русском определение «толстыми» естественно согласуется с выступами щитов.
- source_word: גַּבֵּי
  choice: выступами
  rationale: В сочетании со щитами слово обозначает выпуклые, выступающие части, вероятно умбоны. «Выступы» понятно современному читателю и не требует узкого оружиеведческого термина.
- source_word: מָגִנָּיו
  choice: своих щитов
  rationale: Еврейская форма имеет множественное число и суффикс 3-го лица мужского рода; «своих щитов» сохраняет число и ясно связывает щиты с нападающим.
theological_decisions:
- issue: Референт местоимения אֵלָיו
  choice: «на Него» — нападение нечестивого на Бога
  alternative: «на него» без графического уточнения референта
  rationale: Контекст Иов 15:25 прямо говорит, что нечестивый простёр руку против Бога; перевод сохраняет эту связь, не добавляя нового богословского содержания.
- issue: Связь второй предложной группы с образом нападения
  choice: «прикрываясь толстыми выступами своих щитов»
  alternative: буквально-сжатое «толстыми выступами своих щитов»
  rationale: Еврейский образ синтаксически сжат и допускает понимание щитов как средства или оснащения нападения. «Прикрываясь» делает русскую фразу связной, а сноска сохраняет более буквальный вариант.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Сохранены стремительность и телесная наглядность образа; редкий специальный термин «умбоны» заменён понятным словом «выступы». Сноска отмечает буквальную форму и подлинную неоднозначность сжатой конструкции.
