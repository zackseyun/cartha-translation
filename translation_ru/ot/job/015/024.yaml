  yaml_path: translation/ot/job/015/024.yaml
  text: Distress and anguish terrify him[a]; they overpower him like a king ready for battle.
translation:
  language: ru
  text: Ужасают его беда и мучение; они одолевают его, словно царь, готовый к нападению.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно царь, готовый к битве». Значение редкого еврейского слова не вполне ясно; возможно, речь идёт именно о вооружённом нападении или натиске.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַעֲתֻהוּ
  choice: ужасают его
  rationale: Пиэль глагола בעת выражает сильное причинение страха; «ужасают» естественно передаёт интенсивность и согласуется с двумя однородными существительными.
- source_word: צַר
  choice: беда
  rationale: Существительное обозначает бедствие, притеснение или тяжёлое положение; «беда» ясно и естественно в данном поэтическом контексте.
- source_word: מְצוּקָה
  choice: мучение
  rationale: Слово передаёт стеснение, тяжкое давление и страдание; «мучение» дополняет «беду», сохраняя параллелизм без тавтологии.
- source_word: תִּתְקְפֵהוּ
  choice: они одолевают его
  rationale: Хотя глагол стоит в форме женского рода единственного числа, он соотносится с предшествующей парой как с составным поэтическим субъектом; множественное число естественно по-русски. תקף выражает превосходящую силу и одоление.
- source_word: כְּמֶלֶךְ
  choice: словно царь
  rationale: Сравнительная частица כ прямо вводит образ; «словно царь» естественно для русской поэзии.
- source_word: עָתִיד
  choice: готовый
  rationale: В контексте слово означает подготовленность или готовность к предстоящему действию.
- source_word: לַכִּידוֹר
  choice: к нападению
  rationale: Редкое и не вполне ясное כִּידוֹר, вероятнее всего, связано с вооружённым нападением или боевым натиском. «К нападению» сохраняет военный образ, не делая значение чрезмерно общим.
