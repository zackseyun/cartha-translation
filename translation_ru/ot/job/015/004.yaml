    reason: lexical_alternative
  - marker: c
    text: 'Или: «молитву», «благочестивое обращение» или «жалобу»; еврейское слово может обозначать размышление либо внутреннюю или произносимую речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Более того
  rationale: Частица усиливает обвинение Елифаза и вводит следующий, ещё более резкий вывод; «более того» естественно передаёт эту эмфатическую функцию.
- source_word: אַתָּה
  choice: ты
  rationale: Самостоятельное местоимение второго лица подчёркивает, что обвинение направлено лично против Иова.
- source_word: תָּפֵר
  choice: сводишь на нет
  rationale: Каузативная форма от פרר выражает действие, делающее что-либо недействительным или лишающим силы. Оборот «сводишь на нет» передаёт силу обвинения естественным современным русским языком.
- source_word: יִרְאָה
  choice: страх перед Богом
  rationale: Существительное буквально означает «страх», но в данном контексте обозначает религиозный страх, то есть благоговение перед Богом. Дополнение «перед Богом» проясняет подразумеваемый объект, не заменяя многозначное слово более узким «благоговением».
- source_word: וְתִגְרַע
  choice: и умаляешь
  rationale: Глагол גרע означает уменьшать, убавлять, сокращать или отнимать. «Умаляешь» сохраняет образ уменьшения и соответствует возвышенному поэтическому регистру.
- source_word: שִׂיחָה
  choice: размышление
  rationale: Слово может обозначать размышление, внутреннюю или произносимую речь, молитву либо жалобу. «Размышление» сохраняет широту значения лучше, чем более узкое «молитва».
- source_word: לִפְנֵי אֵל
  choice: пред Ним
  rationale: Еврейское выражение буквально значит «перед Богом». Поскольку Бог уже назван в первой части русского предложения для прояснения смысла יִרְאָה, местоимение избегает тяжёлого повтора, сохраняя значение пребывания в Божьем присутствии.
theological_decisions:
- issue: Религиозный смысл יִרְאָה
  choice: страх перед Богом
  alternative: страх; благоговение
  rationale: Речь идёт не о страхе вообще, а о почтении к Богу и богобоязненности. Формулировка сохраняет традиционный библейский образ «страха», не сводя его только к эмоциональной боязни.
- issue: Значение שִׂיחָה в присутствии Бога
  choice: размышление
  alternative: молитва; благочестивое обращение; жалоба
  rationale: Еврейское слово допускает как внутреннее размышление, так и молитвенную или жалобную речь. Широкий вариант в основном тексте и пояснение в сноске не устраняют эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Выражение «сводишь на нет» делает обвинение ясным и резким, а «умаляешь» и «пред Ним» поддерживают достоинство библейского регистра.
