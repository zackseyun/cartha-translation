base_translation:
  language: en
  yaml_path: translation/ot/job/015/029.yaml
  text: He will not become rich[a], and his wealth will not endure[b], and his produce will not bend down to the earth.
translation:
  language: ru
  text: Он не разбогатеет, и богатство его не устоит, и урожай их[a][b] не склонится к земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их имущество», «их прибыль» или «их изобилие». Еврейское слово редкое, и его значение неясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Последняя часть стиха, возможно, рисует образ ветвей или урожая, склоняющихся к земле от изобилия; другие понимают её шире: «их имущество не распространится по земле».'
    reason: alternative_reading
lexical_decisions:
- source_word: יֶעְשַׁר
  choice: не разбогатеет
  rationale: Форма глагола עשר в породе qal обозначает приобретение богатства; совершенный вид с приставкой «раз-» естественно передаёт становление богатым, а не статическое состояние.
- source_word: יָקוּם
  choice: не устоит
  rationale: Буквальное значение — «не встанет, не будет стоять». В сочетании с «богатство» русский глагол «устоит» естественно выражает непрочность состояния и при этом сохраняет образ стояния.
- source_word: חֵילוֹ
  choice: богатство его
  rationale: חַיִל может означать силу, состояние, имущество или средства. Контекст преуспевания нечестивого поддерживает значение «богатство».
- source_word: יִטֶּה
  choice: не склонится
  rationale: נטה означает наклоняться, простираться или распространяться. «Склонится к земле» сохраняет конкретный образ, не исключая иных толкований.
- source_word: מִנְלָם
  choice: урожай его
  rationale: Редкое и неясное слово с суффиксом третьего лица мужского рода единственного числа. «Урожай его» даёт связный сельскохозяйственный образ со словами «склонится к земле», но лексическая неопределённость отмечена в сноске.
theological_decisions:
- issue: Образ в последней части стиха
  choice: Сохранён конкретный образ урожая, склоняющегося к земле.
  alternative: Его имущество не распространится по земле.
  rationale: Еврейские נטה и מִנְלָם допускают разные понимания; перевод не превращает одно из них в богословски или толковательно бесспорное, а указывает альтернативу в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Повтор союза «и» сохраняет трёхчастный ритм еврейского стиха; «не устоит» удерживает исходную метафору стояния. Обе сноски поставлены при неясной последней части, к которой они фактически относятся.
