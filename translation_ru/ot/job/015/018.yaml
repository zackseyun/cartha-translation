lexical_decisions:
- source_word: אֲשֶׁר
  choice: то, что
  rationale: Относительное сочетание вводит содержание, продолжающее мысль предыдущего стиха; «то, что» естественно по-русски и соответствует значению «то, которое».
- source_word: חֲכָמִים
  choice: мудрецы
  rationale: Существительное мужского рода во множественном числе обозначает почитаемых носителей мудрости; «мудрецы» конкретно и естественно передаёт этот смысл.
- source_word: יַגִּידוּ
  choice: возвещают
  rationale: Порода hifil глагола נגד означает сообщать, объявлять, делать известным. «Возвещают» сохраняет приподнятый поэтический регистр и идею открытой передачи мудрости.
- source_word: וְלֹא כִחֲדוּ
  choice: и чего не скрыли
  rationale: Глагол כחד здесь передаёт сокрытие или утаивание. Повтор относительного местоимения делает русскую фразу грамматически ясной, не устраняя неоднозначность связи с последующим оборотом.
- source_word: מֵאֲבוֹתָם
  choice: от своих отцов
  rationale: Буквально сохраняет предлог מִן и слово «отцы», оставляя открытым вопрос, обозначены ли отцы как лица, от которых не скрывали, или как источник переданного учения.
theological_decisions:
- issue: Синтаксическая связь מֵאֲבוֹתָם с כִחֲדוּ
  choice: чего не скрыли от своих отцов
  alternative: чего не скрыли их отцы; и не скрыли ничего из полученного от своих отцов
  rationale: Краткая еврейская конструкция допускает разные способы связи слов «скрыли» и «от их отцов». Основной текст близко сохраняет форму оригинала, а примечание указывает другие возможные понимания, не делая неоднозначность искусственно однозначной.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим оттенком. «Возвещают» соответствует речи о передаче древней мудрости; буквальный оборот «от своих отцов» намеренно сохраняет синтаксическую неоднозначность оригинала.
