  text: I will tell you; listen to me. What I have seen[a], I will recount—
translation:
  language: ru
  text: Я расскажу тебе — выслушай меня; то, что я видел, я поведаю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я укажу тебе — выслушай меня; и это я видел, и возвещу это».'
    reason: 'Лексические и синтаксические варианты: אֲחַוְךָ может передаваться как «укажу/покажу», а וְזֶה — более формально как «и это».'
lexical_decisions:
- source_word: אֲחַוְךָ
  choice: Я расскажу тебе
  rationale: Пиэль глагола חוה вводит последующую речь Елифаза. «Расскажу тебе» естественно передаёт здесь речевой акт, не создавая ложного впечатления наглядного показа.
- source_word: שְׁמַע לִי
  choice: послушай меня
  rationale: Императив с предлогом выражает призыв внимательно выслушать говорящего; «послушай меня» звучит естественно и сохраняет побудительную силу.
- source_word: וְזֶה חָזִיתִי
  choice: то, что видел
  rationale: Формально וְזֶה означает «и это», но в данном построении указывает на содержание дальнейшего сообщения. Оборот «то, что видел» естественно передаёт эту функцию и сохраняет утверждение о личном наблюдении.
- source_word: וַאֲסַפֵּרָה
  choice: поведаю
  rationale: Когортатив выражает намерение говорящего изложить увиденное. «Поведаю» сохраняет оттенок намеренного изложения и поддерживает достойный литературный регистр.
