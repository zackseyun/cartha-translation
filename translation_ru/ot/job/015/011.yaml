base_translation:
  language: en
  yaml_path: translation/ot/job/015/011.yaml
  text: Are the consolations of God too small for you[a], or a word spoken gently to you?
translation:
  language: ru
  text: Разве для тебя мало Божьих утешений и слова, сказанного тебе мягко?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели Божьи утешения слишком незначительны для тебя? Или слово, сказанное тебе мягко?»'
    reason: הַמְעַט может передаваться как «слишком незначительны/малы», а союз וְ допускает понимание второго члена как отдельного риторического вопроса.
lexical_decisions:
- source_word: הַמְעַט
  choice: слишком малы
  rationale: Вопросительная частица с מְעַט образует риторический вопрос о недостаточности или малой ценности; «слишком малы» естественно передаёт этот смысл.
- source_word: מִמְּךָ
  choice: для тебя
  rationale: 'В данной конструкции предлог обозначает отношение к адресату: утешения представляются недостаточными «для тебя».'
- source_word: תַּנְחֻמוֹת
  choice: утешения
  rationale: Форма множественного числа обозначает слова или проявления утешения; русское «утешения» сохраняет число и возвышенный, но понятный регистр.
- source_word: אֵל
  choice: Божьи
  rationale: אֵל здесь является обозначением Бога; притяжательное прилагательное естественно передаёт еврейскую генитивную связь.
- source_word: וְדָבָר
  choice: и слово
  rationale: דָבָר в контексте речи означает «слово», а ו сохраняется как «и», чтобы не устранять возможную синтаксическую неоднозначность.
- source_word: לָאַט
  choice: сказанное кротко
  rationale: Наречие выражает мягкость, негромкость или бережность речи; добавленное «сказанное» делает русскую конструкцию естественной.
- source_word: עִמָּךְ
  choice: тебе
  rationale: Хотя עִם буквально означает «с/с тобой», в сочетании с подразумеваемой речью по-русски естественно сказать «слово, сказанное тебе».
