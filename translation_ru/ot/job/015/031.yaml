  text: אַל יַאֲמֵ֣ן ב/שו נִתְעָ֑ה כִּי שָׁ֝֗וְא תִּהְיֶ֥ה תְמוּרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/015/031.yaml
  text: Let him not trust in emptiness[a], deceiving himself[c][b], for emptiness will be his recompense.
translation:
  language: ru
  text: Пусть он не полагается на пустоту, заблуждаясь, ибо пустота будет тем, что он получит взамен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово, переведённое как «пустота», может также означать «тщета», «ложь» или «никчёмность»; оно повторено в еврейском тексте. «Заблуждаясь» может означать также «будучи введённым в заблуждение» или «сбившись с пути». Буквально в конце стиха: «пустота будет его обменом (тем, что получено взамен)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יַאֲמֵן
  choice: Пусть он не полагается
  rationale: Отрицательная частица с имперфектом выражает предостережение; «полагаться» передаёт значение Hiphil от אמן — доверять, возлагать надежду.
- source_word: בַשָּׁוְא
  choice: на пустоту
  rationale: שָׁוְא может означать пустоту, тщету, ложь или нечто никчёмное. «Пустота» сохраняет образ и позволяет воспроизвести повтор того же слова далее.
- source_word: נִתְעָה
  choice: обманываясь
  rationale: Niphal от תעה допускает значения «заблуждаться», «быть введённым в заблуждение». Возвратное «обманываясь» естественно по-русски, но не уточняет, кем вызвано заблуждение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предостережения и в данном контексте естественно передаётся причинным оборотом.
- source_word: שָׁוְא
  choice: пустота
  rationale: Повтор того же русского соответствия сохраняет риторический повтор еврейского текста.
- source_word: תִּהְיֶה תְמוּרָתוֹ
  choice: и будет ему воздаянием
  rationale: תְּמוּרָה обозначает замену, обмен или получаемое взамен. «Воздаяние» передаёт итоговую отдачу, хотя может звучать как заслуженная кара; буквальная альтернатива указана в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Повтор «пустота — пустота» намеренно сохранён. Форма «обманываясь» удерживает двусмысленность между самообманом и состоянием заблуждения лучше, чем однозначное «обманывая самого себя».
