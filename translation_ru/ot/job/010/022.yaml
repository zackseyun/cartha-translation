  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: ru
  text: в землю мрака, подобную густой тьме, — землю смертной тени, где нет порядка и где сияние — словно густая тьма.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶרֶץ
  choice: землю
  rationale: В контексте это область мёртвых, изображённая как особая земля; винительная форма с предлогом «в» естественно продолжает синтаксис предыдущего стиха.
- source_word: עֵיפָתָה
  choice: мрака
  rationale: Форма обозначает непроглядную тьму или мрачность; «мрак» естественно вписывается в насыщенный образами тьмы контекст.
- source_word: כְּמוֹ אֹפֶל
  choice: подобного густой тьме / словно густая тьма
  rationale: אֹפֶל — не просто темнота, а плотная, глубокая тьма. Повтор выражения сохранён в обеих частях стиха.
- source_word: צַלְמָוֶת
  choice: смертной тени
  rationale: Так сохраняется возможная связь слова со смертью и традиционный образ, тогда как более общее значение «глубокая тьма» указано в сноске.
- source_word: וְלֹא סְדָרִים
  choice: и беспорядка
  rationale: Сочетание буквально указывает на отсутствие порядка или устроенности; в русском перечислении «беспорядка» звучит кратко и естественно.
- source_word: וַתֹּפַע
  choice: где даже сияние
  rationale: 'Глагол יפע означает «сиять, являться светлым». Номинальная конструкция по-русски ясно передаёт парадокс: там само сияние подобно густой тьме; «даже» эксплицирует контраст, заложенный в образе.'
