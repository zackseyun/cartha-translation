  text: Но всё это Ты скрыл в Своём сердце[a]; я знал, что это было у Тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сберёг в Своём сердце», «сохранил в Своём сердце про запас». Еврейский глагол может означать «скрывать», «сберегать» или «сохранять про запас».'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «это было у Тебя» могут означать: «это было у Тебя на уме» или «это входило в Твой скрытый замысел».'
