lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Но это
  rationale: Союз וְ в контексте передаёт переход с оттенком противопоставления предыдущим благодеяниям Бога; «но» естественно выражает этот поворот. Множественное אֵלֶּה здесь допускает собирательную передачу через «это», соотносимую с последующим единственным זֹאת.
- source_word: צָפַנְתָּ
  choice: Ты скрыл
  rationale: Глагол צפן может означать «скрывать», «сберегать», «держать про запас». Здесь речь идёт о неявном намерении, поэтому «скрыл» наиболее прямо передаёт смысл, не уточняя самого намерения.
- source_word: בִלְבָבֶךָ
  choice: в Своём сердце
  rationale: לֵבָב обозначает сердце как внутренний центр мысли и воли. Буквальный образ естественен по-русски и не сводит значение только к разуму.
- source_word: יָדַעְתִּי
  choice: я знал
  rationale: Форма qatal первого лица единственного числа прямо передаётся прошедшим временем «я знал».
- source_word: כִּי
  choice: что
  rationale: כִּי вводит содержание знания Иова и естественно передаётся изъяснительным союзом «что».
- source_word: זֹאת עִמָּךְ
  choice: это было у Тебя
  rationale: זֹאת сохраняется как неопределённое «это», а עִמָּךְ — как «у Тебя», что в современном русском естественно передаёт принадлежность Богу или пребывание в Его замысле, не делая этот замысел более конкретным.
theological_decisions:
- issue: Характер скрытого Божьего намерения в речи Иова
  choice: Сохранить неопределённость того, к чему относится «это», и передать слова Иова как указание на скрытое Божье намерение.
  alternative: Прямо назвать «это» тайным замыслом Бога поразить Иова либо отнести «это» только к благодеяниям предыдущего стиха.
  rationale: Еврейский текст не определяет референт однозначно. Такая передача сохраняет напряжённость жалобы Иова и не превращает подразумеваемое в явное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа сердца как средоточия мысли и воли. Местоимения, обращённые к Богу, даны с прописной буквы в соответствии с распространённой русской издательской традицией. Синтаксис краток и сохраняет сжатость и неоднозначность еврейского стиха.
