  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: ru
  text: 'Если я нечестив — горе мне! Даже если я праведен, не могу поднять головы: я полон позора и вижу своё страдание.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и взгляни на моё страдание»; возможно также: «вот моё страдание». Еврейский текст здесь синтаксически труден; некоторые понимают эти слова как прямое обращение к Богу, а не как продолжение самоописания Иова.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: Если я нечестив
  rationale: Условная формулировка сохраняет нравственный смысл רשע и параллелизм со следующим וְצָדַקְתִּי; «нечестив» здесь точнее, чем преимущественно судебное «виновен».
- source_word: אַלְלַי לִי
  choice: горе мне
  rationale: Естественное русское восклицание, передающее силу плача без архаизации.
- source_word: וְצָדַקְתִּי
  choice: Но даже если я праведен
  rationale: «Даже если» выражает уступительное противопоставление, а «праведен» сохраняет нравственно-судебный диапазон корня צדק.
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: не могу поднять головы
  rationale: Русский оборот передаёт образ утраченного достоинства и уверенности; «не могу» отражает контекстуальную невозможность, не превращая фразу лишь в волевое решение.
- source_word: שְׂבַע קָלוֹן
  choice: я полон позора
  rationale: Передаёт прилагательное значение «насыщен, полон» и публичное унижение, заключённое в קָלוֹן.
- source_word: וּרְאֵה עָנְיִי
  choice: и вижу своё страдание
  rationale: Основной текст связывает трудную форму с продолжающимся самоописанием Иова, сохраняя глагол зрения и не усиливая толкование добавочными словами.
theological_decisions:
- issue: Синтаксическое понимание וּרְאֵה עָנְיִי
  choice: 'Продолжение самоописания Иова: «и вижу своё страдание»'
  alternative: 'Прямое обращение к Богу: «и взгляни на моё страдание»; либо восклицание: «вот моё страдание»'
  rationale: Еврейская форма и синтаксис допускают несколько прочтений. Основной вариант лучше продолжает описание состояния Иова, а сноска сохраняет возможность прямого обращения к Богу, не устраняя подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Сохранены параллелизм, нравственно-судебная лексика и неоднозначность последней фразы; архаические и конфессионально окрашенные формулировки не вводились.
