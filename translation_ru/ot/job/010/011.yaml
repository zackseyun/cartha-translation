lexical_decisions:
- source_word: עוֹר
  choice: кожа
  rationale: В контексте человеческого тела существительное обозначает кожу; «шкура» здесь было бы неестественно.
- source_word: בָשָׂר
  choice: плоть
  rationale: Конкретно обозначает телесную ткань и сохраняет поэтическую параллель с «кожей».
- source_word: תַּלְבִּישֵׁנִי
  choice: облёк меня
  rationale: Форма глагола לבש означает «одеть, облечь»; выбранный вариант сохраняет образ кожи и плоти как одеяния и соответствует возвышенному, но понятному регистру.
- source_word: בַעֲצָמוֹת
  choice: костями
  rationale: Предлог ב передаёт здесь средство или материал; русский творительный падеж естественно выражает этот смысл.
- source_word: גִידִים
  choice: жилами
  rationale: Слово обозначает соединительные ткани тела; «жилы» сохраняет поэтический библейский регистр без излишне медицинской конкретизации вариантов «сухожилия» или «связки».
- source_word: תְּסֹכְכֵנִי
  choice: сплёл меня
  rationale: В контексте формирования тела перевод передаёт образ соединения его частей, не устраняя возможного значения покрытия или окружения, отмеченного в сноске.
theological_decisions:
- issue: Образ созидания человеческого тела Богом
  choice: Стих передан как поэтическое описание того, как Бог сформировал тело Иова.
  alternative: Передать второй глагол строго как «покрыл» или «оградил».
  rationale: Контекст говорит о телесном формировании Иова. «Сплёл меня» сохраняет созидательный образ, а сноска удерживает лексическую неоднозначность глагола, не добавляя не выраженных в стихе антропологических положений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Инверсия во второй строке поддерживает параллелизм еврейского стиха; «облёк» и «сплёл» понятны современному читателю и сохраняют конкретность исходных образов.
