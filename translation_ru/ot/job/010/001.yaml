lexical_decisions:
- source_word: נָקְטָה
  choice: опротивела
  rationale: Глагол передаёт сильное отвращение, хотя может также подразумевать глубокую усталость; «опротивела» естественно и выразительно передаёт основное значение.
- source_word: נַפְשִׁי
  choice: душе моей / души моей
  rationale: Сохранён повтор слова נֶפֶשׁ и его эмоциональная выразительность; русская конструкция «душе моей опротивела» естественнее буквального именительного оборота.
- source_word: בְּחַיָּי
  choice: моя жизнь
  rationale: В данном сочетании речь идёт о жизни Иова как о том, что стало ему отвратительно.
- source_word: אֶעֶזְבָה עָלַי
  choice: я дам волю
  rationale: Идиома означает перестать сдерживать или отпустить; «дам волю» ясно выражает снятие внутреннего ограничения.
- source_word: שִׂיחִי
  choice: своей жалобе
  rationale: В контексте плача Иова слово обозначает скорбную речь, сетование или жалобу, а не нейтральное размышление.
- source_word: אֲדַבְּרָה
  choice: буду говорить
  rationale: Когортатив выражает решимость Иова говорить; будущее время естественно передаёт это намерение.
- source_word: בְּמַר נַפְשִׁי
  choice: в горечи души моей
  rationale: Сохранены образ эмоциональной горечи и повтор слова «душа»; оборот звучит достоинственно и понятно по-русски.
