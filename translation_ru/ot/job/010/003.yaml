  text: הֲ/ט֤וֹב לְ/ךָ֨ כִּֽי תַעֲשֹׁ֗ק כִּֽי תִ֭מְאַס יְגִ֣יעַ כַּפֶּ֑י/ךָ וְ/עַל עֲצַ֖ת רְשָׁעִ֣ים הוֹפָֽעְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: ru
  text: Разве хорошо для Тебя угнетать, презирать дело Своих рук и озарять замысел нечестивых?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоволить к замыслу нечестивых». Еврейский глагол буквально означает «сиять, озарять» и здесь, вероятно, выражает благосклонность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: Разве хорошо для Тебя
  rationale: Сохраняет прямую риторическую форму и оттенок вопроса о том, что хорошо или подобает Богу, не заменяя её более толковательным «разве Тебе угодно».
- source_word: תַעֲשֹׁק
  choice: угнетать
  rationale: Глагол עָשַׁק обозначает угнетение, притеснение или неправедное лишение; «угнетать» сохраняет резкость обвинительного вопроса Иова.
- source_word: תִמְאַס
  choice: презирать
  rationale: מָאַס выражает отвержение с пренебрежением; «презирать» передаёт и неприятие, и оттенок презрения.
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: дело Своих рук
  rationale: יְגִיעַ может обозначать труд либо плод труда. В сочетании с «руками» здесь естественно указывает на созданного Богом человека; русский оборот сохраняет образ исходного текста.
- source_word: עֲצַת רְשָׁעִים
  choice: замысел нечестивых
  rationale: עֵצָה охватывает значения совета, замысла и плана. В данном контексте «замысел» естественно обозначает намерение нечестивых и не предполагает, что Бог принимает от них совет.
- source_word: הוֹפָעְתָּ
  choice: озарять
  rationale: Хифиль глагола יָפַע буквально связан с сиянием или явлением в свете. «Озарять» сохраняет метафору, а вероятный смысл благоволения поясняется в сноске.
theological_decisions:
- issue: Антропоморфное обвинение Бога
  choice: Сохранить прямой риторический вызов Иова без смягчающих слов «словно» или «кажется».
  alternative: «Разве хорошо для Тебя словно угнетать…» или «Разве Тебе угодно поступать несправедливо…»
  rationale: Еврейский текст намеренно передаёт резкую речь Иова. Смягчение заранее разрешило бы богословское напряжение, которое сам стих оставляет открытым.
- issue: Образ света по отношению к замыслу нечестивых
  choice: Сохранить буквальную метафору «озарять» в основном тексте.
  alternative: 'Передать непосредственно: «благоволить к замыслу нечестивых».'
  rationale: Глагол допускает образное понимание как проявление благосклонности, однако буквальный световой образ остаётся значимым и не должен бесследно исчезать.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции; синтаксис сохраняет единый резкий риторический вопрос.
