  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: ru
  text: Вспомни, прошу, что Ты сделал меня подобным глине, — и возвратишь меня в прах?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально: «как глину»; оно выражает сравнение, а не говорит прямо «из глины», хотя явно вызывает образ сотворения человека. Вторую часть можно также понять как утверждение: «и Ты возвратишь меня в прах».'
    reason: lexical_alternative; alternative_reading
lexical_decisions:
- source_word: זְכָר נָא
  choice: Вспомни же
  rationale: Императив זְכָר обращён к Богу, а частица נָא смягчает просьбу. «Же» естественно передаёт настойчивую мольбу в современном литературном русском без неуместного временного значения.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, о чём Иов просит Бога вспомнить.
- source_word: כַחֹמֶר
  choice: подобным глине
  rationale: 'Префикс כַ־ выражает сравнение: буквально «как глину / подобным глине», а не явно материал происхождения «из глины». Формулировка сохраняет сравнение и естественно сочетается с глаголом «сделал».'
- source_word: עֲשִׂיתָנִי
  choice: Ты сделал меня
  rationale: Глагол עשה имеет общее значение «делать, создавать». «Сделал» не усиливает образ до более узкого «вылепил» или «сформировал».
- source_word: עָפָר
  choice: прах
  rationale: В контексте сотворения и смертности «прах» точно передаёт עָפָר и естественно вызывает библейскую ассоциацию возвращения человека в землю.
- source_word: תְּשִׁיבֵנִי
  choice: Ты вновь обратишь меня
  rationale: Каузативная форма от שוב означает «вернуть, заставить возвратиться». «Вновь обратишь меня в прах» идиоматично передаёт возвращение к праху и сохраняет образ смертности.
theological_decisions:
- issue: Утверждение или риторический вопрос во второй части стиха
  choice: 'Риторический вопрос: «и неужели Ты вновь обратишь меня в прах?»'
  alternative: 'Утверждение: «и Ты вновь обратишь меня в прах»'
  rationale: В еврейском тексте нет отдельной вопросительной частицы, поэтому грамматически возможно утверждение. Однако контекст жалобы и обращения к Богу допускает риторический вопрос; «неужели» ясно передаёт его протестующую силу, не скрывая альтернативу в примечании.
translation_notes:
  register: Современный литературный русский с достоинством поэтической жалобы. Прописное «Ты» принято как редакционный знак почтительного обращения к Богу. Тире перед второй частью подчёркивает напряжённый поворот от сотворения к возвращению в прах.
