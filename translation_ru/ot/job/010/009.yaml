- from: Вспомни же, что Ты сделал меня подобным глине[a], — и неужели Ты вновь обратишь меня в прах?[b]
  to: Вспомни, прошу, что Ты сделал меня подобным глине, — и возвратишь меня в прах?[a]
  rationale: Исправление точнее передаёт נָא как просьбу, устраняет невыраженное в оригинале «вновь» и сохраняет риторическое вопросительное прочтение без дополнительного усиления. Два исходных примечания объединены под одним якорем, поскольку оба относятся к той же строке и совместимы по содержанию.
