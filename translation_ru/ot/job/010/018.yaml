  text: וְ/לָ֣/מָּה מֵ֭/רֶחֶם הֹצֵאתָ֑/נִי אֶ֝גְוַ֗ע וְ/עַ֣יִן לֹא תִרְאֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: ru
  text: Зачем же Ты вывел меня из утробы? Я умер бы, и ни один глаз не увидел бы меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Я умру, и ни один глаз не увидит меня». Древнееврейские формы допускают такое прочтение, но контекст указывает на нереальное условие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: Зачем же
  rationale: Вопросительное «зачем» естественно передаёт לָמָה в жалобе Иова, а «же» выражает связь с предшествующими словами.
- source_word: מֵרֶחֶם
  choice: из утробы
  rationale: Сохраняется конкретный образ рождения и значение исходной точки.
- source_word: הֹצֵאתָנִי
  choice: Ты вывел меня
  rationale: Каузативная форма глагола יצא означает, что Бог вывел Иова из материнской утробы; прямое обращение сохранено.
- source_word: אֶגְוַע
  choice: Я умер бы
  rationale: 'Имперфект в данном контексте естественно понимается как нереальный результат: если бы Иов не был выведен из утробы, он умер бы незамеченным.'
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: и ни один глаз не увидел бы меня
  rationale: «Глаз» сохранён как метонимия наблюдателя; отрицательная конструкция передана естественным русским оборотом, а условное наклонение отражает контрфактический смысл контекста.
