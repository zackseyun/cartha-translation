translation:
  language: ru
  text: Если я поднимусь[a], Ты охотишься за мной, как лев, и вновь совершаешь против меня нечто необычайное[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь труден и эллиптичен; возможны также переводы: «И если он поднимется», «Если я возвышен» или «Если поднимется моя голова».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и вновь необычайно действуешь против меня». Еврейский глагол может обозначать необычайное, дивное действие; здесь оно описано в контексте страдания и противостояния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: Если я поднимусь
  rationale: Глагол גאה означает «подниматься, возвышаться». Хотя форма имеет 3-е лицо мужского рода единственного числа и еврейский текст эллиптичен, контекст допускает подразумеваемое первое лицо («если я поднимусь» или «если поднимется моя голова»). Условная формулировка естественно передаёт ход жалобы Иова, а неоднозначность отмечена в сноске.
- source_word: כַּשַּׁחַל
  choice: как лев
  rationale: שׁחל обозначает льва, иногда с оттенком силы и свирепости. Простое «как лев» сохраняет образ, не добавляя отсутствующих в тексте уточнений.
- source_word: תְּצוּדֵנִי
  choice: Ты охотишься за мной
  rationale: Глагол צוד описывает охоту или преследование добычи. Выбор согласуется с образом льва и ясно передаёт положение Иова как преследуемой жертвы.
- source_word: וְתָשֹׁב
  choice: и вновь
  rationale: Буквально שׁוב означает «возвращаться», но здесь конструкция вводит повторное действие; «и вновь» естественно передаёт это значение.
- source_word: תִּתְפַּלָּא
  choice: совершаешь нечто необычайное
  rationale: Форма хитпаэль от פלא может означать являть себя дивным или действовать необычайным образом. Русская формулировка сохраняет значение поразительного, выходящего за рамки обычного действия, не придавая ему обязательно благожелательной окраски.
- source_word: בִי
  choice: против меня
  rationale: Предлог ב допускает несколько способов передачи, но в контексте преследования направленность действия против Иова выражена наиболее ясно.
theological_decisions:
- issue: Передача פלא в контексте враждебно воспринимаемого действия Бога
  choice: совершаешь против меня нечто необычайное
  alternative: являешь Себя дивным против меня
  rationale: 'Перевод сохраняет напряжение: действие Бога остаётся необычайным и внушающим изумление, однако Иов воспринимает его как направленное против себя. Формулировка не превращает это действие ни в однозначно благой «чудесный поступок», ни в пояснительное упрощение вроде «могущественно нападаешь».'
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической жалобы. Образ охоты передан прямо; трудная эллиптическая начальная конструкция и многозначность פלא не сглажены, а пояснены в сносках.
