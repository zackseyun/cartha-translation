  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: ru
  text: Если я согрешу[a], Ты следишь за мной[b] и не освободишь меня от вины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
