lexical_decisions:
- source_word: אִם חָטָאתִי
  choice: Если я согрешу
  rationale: Условное אִם передано союзом «если». Хотя חָטָאתִי имеет форму перфекта и может означать «я согрешил», в русском условном высказывании совершенный вид будущего времени естественно выражает возможный случай согрешения, не превращая слова Иова в прямое признание конкретного прошлого проступка.
- source_word: וּשְׁמַרְתָּנִי
  choice: Ты следишь за мной
  rationale: В данном контексте שׁמר обозначает пристальное наблюдение, а не охрану или защиту. «Следишь за мной» естественно передаёт неблагоприятный для Иова оттенок надзора.
- source_word: וּמֵעֲוֺנִי
  choice: с меня вины за моё беззаконие
  rationale: עָוֹן может обозначать беззаконие, вину или последствие проступка. Формулировка различает само беззаконие и связанную с ним вину, сохраняя нравственно-судебный смысл выражения.
- source_word: לֹא תְנַקֵּנִי
  choice: не снимешь с меня вины
  rationale: 'Пиэль נקה здесь имеет судебный смысл: признать невиновным, освободить от вины. Русское «снять с меня вину» звучит естественно и не вносит менее вероятный ритуальный смысл очищения.'
theological_decisions:
- issue: Судебный или очистительный смысл נקה
  choice: 'судебный: «не снимешь с меня вины»'
  alternative: 'очистительный: «не очистишь меня»; карательный результат: «не оставишь меня без наказания»'
  rationale: Контекст жалобы Иова предполагает пристальное наблюдение и последующее судебное вменение. Судебная формулировка сохраняет напряжение текста, не сводя его ни к ритуальному очищению, ни исключительно к наказанию.
translation_notes:
  register: Современный литературный русский язык; обращение к Богу оформлено с прописной буквы. Перевод сохраняет условный характер жалобы и её судебную образность, избегая архаичного «очистишь» и двусмысленного «оправдаешь моё беззаконие».
