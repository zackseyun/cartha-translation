  text: that you seek out my iniquity and search for my sin?[a]
translation:
  language: ru
  text: чтобы Ты выискивал мою вину и разыскивал мой грех?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо Ты выискиваешь мою вину и разыскиваешь мой грех».'
    reason: Возможна причинная, а не целевая трактовка союза כִּי; при ней еврейские глаголы передаются русским настоящим временем.
lexical_decisions:
- source_word: כִּי
  choice: чтобы
  rationale: В контексте стих продолжает риторический вопрос предыдущего стиха и вводит содержание предполагаемого намерения Бога; «чтобы» естественно передаёт эту зависимость в русском синтаксисе.
- source_word: תְבַקֵּשׁ
  choice: выискивал
  rationale: Пиэль глагола בקש обозначает настойчивый поиск. «Выискивал» передаёт оттенок тщательного разыскания проступка, присущий жалобе Иова.
- source_word: לַעֲוֺנִי
  choice: мою вину
  rationale: עָוֹן может означать беззаконие, вину или наказание за вину. Здесь речь идёт о разыскиваемой нравственной вине; перевод сохраняет смысловую неоднозначность и не утверждает, что Иов действительно виновен.
- source_word: וּלְחַטָּאתִי
  choice: о моём грехе
  rationale: חַטָּאת означает «грех» и образует параллель с עָוֹן; предлог выбран в соответствии с естественным русским управлением глагола «допытываться».
- source_word: תִדְרֹשׁ
  choice: допытывался
  rationale: דרש может означать искать, разузнавать или исследовать. «Допытывался» передаёт настойчивое расследование и сохраняет параллелизм, не повторяя «выискивал».
theological_decisions:
- issue: Передача пары עָוֹן и חַטָּאת
  choice: «вина» и «грех» без утверждения фактической виновности Иова
  alternative: «беззаконие» и «грех»
  rationale: Иов описывает то, как воспринимает Божье обращение с ним. Формулировка сохраняет напряжение его жалобы и не выносит заранее богословского суждения о его виновности.
- issue: Связь כִּי с предыдущим риторическим вопросом
  choice: целевая формулировка «чтобы»
  alternative: причинная формулировка «ибо»
  rationale: Контекст стихов 5–6 благоприятствует продолжению вопроса о том, не подобны ли Божьи дни человеческим, чтобы Он разыскивал проступок. Однако причинное прочтение грамматически возможно и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Глаголы «выискивал» и «допытывался» передают обвинительно-следственный оттенок жалобы Иова, оставаясь понятными обычному читателю.
