  text: הַ/עֵינֵ֣י בָשָׂ֣ר לָ֑/ךְ אִם כִּ/רְא֖וֹת אֱנ֣וֹשׁ תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: ru
  text: Разве у Тебя глаза из плоти, или Ты видишь так, как видит человек[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово אֱנוֹשׁ означает человека как представителя человеческого рода и может подчёркивать его смертность и немощь.
    reason: Лексический оттенок исходного слова невозможно полностью отразить нейтральным русским словом «человек».
lexical_decisions:
- source_word: הַעֵינֵי בָשָׂר לָךְ
  choice: Разве у Тебя глаза из плоти
  rationale: Вопросительная частица и именная конструкция с לָךְ естественно передаются русской конструкцией обладания «у Тебя». Выражение «глаза из плоти» сохраняет конкретный образ בָשָׂר и не допускает нравственного оттенка, возможного у слова «плотские».
- source_word: אִם
  choice: или
  rationale: Здесь אִם вводит вторую часть альтернативного риторического вопроса, а не условие.
- source_word: כִּרְאוֹת אֱנוֹשׁ תִּרְאֶה
  choice: или Ты видишь так, как видит человек
  rationale: Сравнительная конструкция с инфинитивом ראה естественно разворачивается по-русски как «так, как видит». Повтор глагола «видеть» сохраняет связь с образом глаз.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Существительное обозначает отдельного человека как представителя человеческого рода и нередко несёт оттенок смертности или немощи; нейтральное «человек» сохраняет общий смысл, не усиливая этот оттенок в основном тексте.
theological_decisions:
- issue: Антропоморфный образ Божьего зрения
  choice: Сохранить прямой риторический вопрос о «глазах из плоти» и человеческом способе видеть
  alternative: 'Передать толковательно: «Разве Ты судишь по внешности, как люди?»'
  rationale: Еврейский текст намеренно использует конкретный телесный образ. Его сохранение передаёт напряжение речи Иова и не подменяет перевод богословским объяснением.
- issue: Обобщающее единственное число אֱנוֹשׁ
  choice: человек
  alternative: смертный; люди; человеческий род
  rationale: «Человек» сохраняет единственное число и обобщающий характер слова, тогда как «смертный» делает возможный оттенок основным значением, а множественное число меняет форму образа.
translation_notes:
  register: Современный литературный русский язык с сохранением конкретной поэтической образности. «Глаза из плоти» выбрано вместо «плотские глаза», поскольку последнее в современном русском может ошибочно восприниматься как нравственная характеристика. Местоимение, обращённое к Богу, дано с прописной буквы согласно устойчивой русской библейской традиции.
