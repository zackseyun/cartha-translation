  text: before I go—and do not return—to the land of darkness and deep shadow,[a]
translation:
  language: ru
  text: прежде чем я уйду в страну тьмы и глубокой тени[a] — и не вернусь,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глубокой тьмы»; традиционно: «тени смерти».'
    reason: Слово צַלְמָוֶת может обозначать глубокую тень или глубокую тьму; традиционный перевод связывает его со смертью.
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Временной союз естественно вводит придаточное «прежде чем я уйду».
- source_word: אֵלֵךְ
  choice: я уйду
  rationale: Простое значение глагола — «идти, уходить». «Уйду» естественно по-русски передаёт движение в иной мир, не подменяя его прямым «умру».
- source_word: וְלֹא אָשׁוּב
  choice: и не вернусь
  rationale: Прямая передача отрицания и глагола «вернуться» без добавления усилительного «никогда».
- source_word: אֶל אֶרֶץ
  choice: в страну
  rationale: Предлог направления с существительным обозначает движение в определённую область; по-русски естественно «уйти в страну».
- source_word: חֹשֶׁךְ
  choice: тьмы
  rationale: Основное значение — «тьма»; родительный падеж обусловлен сочетанием «страна тьмы».
- source_word: צַלְמָוֶת
  choice: мрака смертного
  rationale: Словосочетание сохраняет связь образа с глубокой тьмой и возможную ассоциацию со смертью, не прибегая к менее естественному современному выражению «тень смерти».
theological_decisions:
- issue: Передача צַלְמָוֶת в поэтическом контексте смерти
  choice: мрак смертный
  alternative: глубокая тень; смертная тень; тень смерти; глубокая тьма
  rationale: Значение слова допускает понимание как глубокой тьмы, так и традиционного образа смерти. Основной текст сохраняет оба смысловых оттенка в естественной русской поэтической форме, а примечание указывает альтернативу.
translation_notes:
  register: Современный литературный русский с сохранением сжатого, мрачного поэтического образа. Тире отмечает переход к цели движения; стих намеренно заканчивается запятой, поскольку синтаксически продолжается в следующем стихе.
