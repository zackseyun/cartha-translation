base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: ru
  text: Ты даровал мне жизнь и верную любовь, и Твоя забота[a] сохранила мой дух[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твой надзор»; возможно также: «Твоё посещение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моё дыхание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: жизнь
  rationale: Формально множественное число здесь обычно выражает понятие жизни во всей её полноте; в современном русском естественно единственное число.
- source_word: וָחֶסֶד
  choice: и неизменную любовь
  rationale: חֶסֶד обозначает верную, постоянную благосклонность и любовь. «Неизменная любовь» передаёт устойчивость этого отношения, не сужая смысл до одной лишь милости или доброты.
- source_word: עָשִׂיתָ עִמָּדִי
  choice: Ты даровал мне
  rationale: Буквально — «Ты сделал со мной»; при дополнениях «жизнь и любовь» оборот выражает благодеяние. «Даровал мне» естественно передаёт этот смысл.
- source_word: וּפְקֻדָּתְךָ
  choice: и Твоя забота
  rationale: פְקֻדָּה может означать попечение, надзор или посещение. Поскольку далее говорится о сохранении духа, в основном тексте выбран положительный смысл внимательной заботы; неоднозначность отмечена в сноске.
- source_word: שָׁמְרָה
  choice: хранила
  rationale: Глагол означает «хранить, оберегать, сохранять». «Хранила» точно и естественно сочетается с Божьей заботой.
- source_word: רוּחִי
  choice: мой дух
  rationale: רוּחַ может обозначать дух или дыхание. «Мой дух» сохраняет широту смысла внутренней жизни человека, а телесно-жизненный оттенок «дыхание» дан в сноске.
theological_decisions:
- issue: Смысл חֶסֶד применительно к Богу
  choice: неизменная любовь
  alternative: доброта; милость; верная любовь
  rationale: Выбранная формулировка передаёт постоянство и верность Божьего благоволения, но не вводит более узкое утверждение о формальном заветном отношении.
- issue: Смысл פְקֻדָּה
  choice: положительное Божье попечение
  alternative: надзор; посещение
  rationale: Контекст сохранения духа поддерживает благожелательный смысл, однако лексическая возможность «надзора» или «посещения» остаётся открытой в сноске.
- issue: Смысл רוּחַ
  choice: дух
  alternative: дыхание
  rationale: Контекст допускает как внутреннюю жизнь, так и жизненное дыхание; основной текст и сноска сохраняют эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Местоимение «Твоя» написано с прописной буквы в соответствии с традиционным обращением к Богу; синтаксис остаётся ясным и близким к еврейскому параллелизму.
