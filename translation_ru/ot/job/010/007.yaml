  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: ru
  text: Хотя Ты знаешь, что я не нечестив[a], нет никого, кто мог бы избавить из Твоей руки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я не виновен». Буквально еврейский текст говорит: «я не нечестив», то есть Иов отрицает, что он нечестивый человек, а не обязательно заявляет о своей абсолютной безгрешности.'
    reason: lexical_alternative
  - marker: b
    text: «Из Твоей руки» — еврейский образ, означающий избавление из-под чьей-либо власти.
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: Хотя Ты знаешь
  rationale: Оборот вводит известное Богу обстоятельство и в контексте имеет уступительный оттенок; такой перевод естественно передаёт жалобу Иова.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание Божьего знания.
- source_word: לֹא אֶרְשָׁע
  choice: я не нечестив
  rationale: Форма от רשע здесь допускает стативное понимание. «Не нечестив» сохраняет нравственный смысл исходного слова и не превращает слова Иова в заявление об абсолютной безгрешности.
- source_word: וְאֵין
  choice: никто не
  rationale: Экзистенциальное отрицание естественно передаётся по-русски местоимением «никто».
- source_word: מִיָּדְךָ
  choice: из Твоей руки
  rationale: Сохранён еврейский образ руки как власти и контроля.
- source_word: מַצִּיל
  choice: не избавит
  rationale: Причастие породы хифиль обозначает избавляющего или спасающего; вместе с וְאֵין выражает отсутствие того, кто способен избавить.
theological_decisions:
- issue: Заявление Иова о своей невиновности перед Богом
  choice: «я не нечестив» — отрицание того, что Иов является нечестивцем
  alternative: «я невиновен» или «я безгрешен»
  rationale: В еврейском тексте употреблён корень רשע, связанный с нечестием, а не прямое утверждение полной безгрешности. Перевод сохраняет напряжение между протестом Иова и более широким богословским контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавные буквы в местоимениях, обращённых к Богу, соответствуют распространённой русской библейской традиции. Порядок сносок приведён в последовательность [a], [b], а маркеры поставлены непосредственно при поясняемых выражениях.
