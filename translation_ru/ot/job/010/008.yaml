source:
  edition: WLC
  text: יָדֶ֣י/ךָ עִ֭צְּבוּ/נִי וַֽ/יַּעֲשׂ֑וּ/נִי יַ֥חַד סָ֝בִ֗יב וַֽ/תְּבַלְּעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: ru
  text: Твои руки придали мне форму и создали меня целиком, со всех сторон[a]; и всё же ты поглощаешь меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вместе, вокруг»; вероятно, речь о том, что Бог сформировал Иова целиком, со всех сторон.'
    reason: Сохранить необычность и возможную синтаксическую неоднозначность еврейского выражения יַחַד סָבִיב.
  - marker: b
    text: 'Или: «уничтожаешь меня». Еврейский текст буквально говорит «поглощаешь меня», используя яркий образ уничтожения.'
    reason: Пояснить переносное значение, сохранив буквальную метафору в основном тексте.
lexical_decisions:
- source_word: יָדֶיךָ
  choice: Твои руки
  rationale: Сохранено множественное число и конкретный антропоморфный образ личного созидательного действия Бога.
- source_word: עִצְּבוּנִי
  choice: придали мне форму
  rationale: Порода пиэль глагола עצב здесь обозначает целенаправленное формирование. Выражение передаёт образ искусной работы, не сужая его непременно до лепки из глины.
- source_word: וַיַּעֲשׂוּנִי
  choice: и создали меня
  rationale: Глагол עשה имеет общее значение «делать, создавать»; в параллели с предыдущим глаголом русский вариант естественно описывает завершённое созидание человека.
- source_word: יַחַד סָבִיב
  choice: целиком, со всех сторон
  rationale: Сочетание буквально передаёт идеи совокупности и окружения. Этот вариант естественно выражает полноту формирования Иова, не скрывая необычность еврейского оборота.
- source_word: וַתְּבַלְּעֵנִי
  choice: и всё же ты поглощаешь меня
  rationale: Сохранена яркая метафора глагола בלע «поглощать, проглатывать». Оборот «и всё же» передаёт контекстуальное противопоставление созидания и уничтожения, хотя союз ו сам по себе многозначен.
theological_decisions:
- issue: Антропоморфный образ Божьего созидания
  choice: Сохранить «Твои руки» и два глагола формирования.
  alternative: 'Обобщить: «Ты сотворил меня».'
  rationale: Конкретный образ подчёркивает личное и тщательное участие Бога в создании Иова; обобщение ослабило бы довод плача.
- issue: Напряжение между созиданием и уничтожением
  choice: 'Сохранить резкий контраст: «и всё же ты поглощаешь меня».'
  alternative: 'Сгладить смысл: «а теперь уничтожаешь меня» или «чтобы затем уничтожить».'
  rationale: Иов намеренно ставит рядом Божье созидательное действие и переживаемую им угрозу уничтожения. Перевод не объясняет и не разрешает это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Конкретные образы оригинала сохранены; синтаксис сделан понятным без устранения смыслового напряжения. Местоимение «ты» написано со строчной буквы в соответствии с нейтральной современной издательской практикой.
