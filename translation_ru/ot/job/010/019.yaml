  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: ru
  text: Мне бы быть так, словно меня не было; из утробы меня отнесли бы в могилу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: В сочетании с отрицательной формой глагола бытия передаёт уподобление нереальному состоянию; по-русски контрфактический смысл естественно выражается конструкцией «был бы как не бывший».
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: Я был бы как не бывший
  rationale: Сочетание форм היה в контексте выражает желаемое нереальное положение. Русское сослагательное наклонение сохраняет этот смысл без буквального, но вводящего в заблуждение будущего времени.
- source_word: מִבֶּטֶן
  choice: из утробы
  rationale: Сохраняет конкретный образ исходного текста и движение непосредственно от материнской утробы.
- source_word: לַקֶּבֶר
  choice: в могилу
  rationale: קֶבֶר обозначает могилу или место погребения, а не шеол; винительная конструкция с «в» естественно передаёт направление движения.
- source_word: אוּבָל
  choice: меня отнесли бы
  rationale: Хофаль глагола יבל имеет пассивно-каузативный смысл «быть принесённым/отнесённым». Неопределённо-личная русская конструкция естественно передаёт пассив и наглядный образ переноса из утробы прямо в могилу.
