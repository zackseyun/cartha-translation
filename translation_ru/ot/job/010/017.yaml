  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: ru
  text: Ты вновь выставляешь против меня Своих свидетелей[a] и всё сильнее гневаешься на меня; смены и войско — со мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свои свидетельства (доказательства) против меня». Еврейское слово может обозначать как свидетелей, так и предъявляемые против Иова доказательства.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «смены и войско — со мной». Возможны также переводы: «смены и война — со мной» или «перемены и тяжёлая служба — со мной». Вероятно, речь идёт о следующих одна за другой волнах нападения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: вновь выставляешь
  rationale: Пиэль передаёт возобновление действия; в сочетании со «свидетелями против меня» глагол «выставляешь» естественно сохраняет судебный образ.
- source_word: עֵדֶיךָ
  choice: Своих свидетелей
  rationale: Обычное значение множественного числа — «свидетели»; контекст «против меня» придаёт выражению судебный оттенок. Возможное значение «свидетельства, доказательства» отмечено в сноске.
- source_word: נֶגְדִּי
  choice: против меня
  rationale: Хотя основное пространственное значение — «передо мной», в данном состязательном контексте выражение означает направленность против Иова.
- source_word: וְתֶרֶב כַּעַשְׂךָ
  choice: и всё сильнее гневаешься
  rationale: רבה выражает усиление, а כַּעַשְׂךָ — Божий гнев или негодование. Глагольная русская конструкция ясна и сохраняет прямое обращение.
- source_word: עִמָּדִי
  choice: на меня
  rationale: Буквально «со мной», однако при слове «гнев» русский язык естественно требует направленности «на меня».
- source_word: חֲלִיפוֹת וְצָבָא
  choice: сменяя друг друга, войска
  rationale: חֲלִיפוֹת обозначает смены или чередование, а צָבָא — войско, воинство, войну либо тяжёлую службу. В контексте враждебного натиска сочетание естественно передаётся как последовательные воинские отряды, при сохранении буквальной альтернативы в сноске.
- source_word: עִמִּי
  choice: идут на меня
  rationale: Буквально «со мной»; в военном образе контекст требует враждебной направленности. «Идут на меня» делает сжатую еврейскую поэтическую фразу понятной по-русски.
theological_decisions:
- issue: Кто или что названо Божьими «свидетелями»
  choice: 'Сохранён личный судебный образ: «Своих свидетелей».'
  alternative: «Свои доказательства» или «Свидетельства против меня».
  rationale: Еврейское עֵד допускает как личное, так и доказательное понимание; основной текст сохраняет наиболее прямой образ, а сноска — реальную неоднозначность.
- issue: Смысл заключительного сочетания חֲלִיפוֹת וְצָבָא
  choice: Передан образ сменяющих друг друга войск.
  alternative: «Перемены и тяжёлая служба со мной» или «смены и война против меня».
  rationale: Военное значение צָבָא хорошо согласуется с идеей последовательных смен или отрядов, но трудность сжатой еврейской конструкции не позволяет исключить значения «война» и «тяжёлая служба»; они указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической жалобы Иова. Заглавная буква в «Своих» обозначает обращение к Богу без добавления конфессионально обусловленной терминологии. Заключительная сжатая конструкция развёрнута ради естественности русского текста, а её буквальная форма и смысловые альтернативы сохранены в сноске.
