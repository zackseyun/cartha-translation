  text: Are not my days few? Then cease and leave me alone[a], so that I may brighten up a little[b],
translation:
  language: ru
  text: Разве дней моих не мало? Перестань же и оставь меня в покое[a], чтобы я немного ободрился[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвернись от меня» или «отступи от меня». Еврейское выражение с глаголами «перестать» и «отступить от» сжато и допускает разные способы передачи.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «чтобы я немного воспрял духом» или «немного пришёл в себя». Глагол обозначает краткое облегчение и оживление духа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא מְעַט יָמַי
  choice: Разве не мало дней моих?
  rationale: Сохраняет отрицательно-вопросительную форму, ожидающую согласия, и близко передаёт порядок и смысл еврейских слов; выражение «дней моих» уместно для возвышенной речи Иова.
- source_word: יחדל ישית מִמֶּנִּי
  choice: Отступи же и оставь меня
  rationale: 'Согласная традиция WLC передаёт два сжатых глагольных элемента: прекращение действия и удаление от говорящего. Русская формулировка сохраняет оба, не делая трудное выражение чрезмерно буквальным.'
- source_word: וְאַבְלִיגָה
  choice: чтобы я… воспрянул
  rationale: Глагол בלג указывает на краткое облегчение, восстановление духа или бодрости. «Воспрянул» естественно и достойно передаёт это эмоциональное оживление, не сводя смысл только к улыбке или физическому восстановлению.
- source_word: מְעָט
  choice: немного
  rationale: Передаёт малую меру или краткость желанного облегчения, не устраняя возможную смысловую широту.
theological_decisions:
- issue: Неявный адресат повелительных форм
  choice: Сохранить обращение во втором лице без добавления слова «Бог»
  alternative: Явно написать «Боже, отступи…»
  rationale: Из контекста адресат понятен, однако в самом стихе имя Бога отсутствует; его добавление сделало бы подразумеваемое явным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией, соответствующей поэтической речи Иова. Инверсия «дней моих» сохраняет достоинство и ритм, оставаясь понятной современному читателю.
