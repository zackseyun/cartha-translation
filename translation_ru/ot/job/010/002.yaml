    text: 'Или: «за что Ты споришь со мной» или «за что предъявляешь мне обвинение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Скажу
  rationale: Форма Qal imperfect 1-го лица ед. числа здесь естественно передаёт намерение Иова обратиться к Богу; краткое «Скажу» сохраняет направленность вперёд и соответствует русской речи.
- source_word: אֶל אֱלוֹהַּ
  choice: Богу
  rationale: אֱלוֹהַּ — употребляемое в Иове единственное обозначение Бога; перевод нарицательным «Бог» естественен и не требует транслитерации.
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: Не осуждай меня
  rationale: Запретительная частица אַל с формой глагола передана естественным русским запретом; Hiphil от רשע имеет судебный смысл «признать виновным, осудить».
- source_word: הוֹדִיעֵנִי
  choice: дай мне знать
  rationale: Hiphil imperative от ידע означает «дать узнать, сообщить»; выбранный оборот сохраняет побудительный и каузативный смысл без книжной тяжеловесности.
- source_word: עַל מַה
  choice: за что
  rationale: В данном вопросе сочетание запрашивает основание или причину. «За что» особенно естественно по-русски в контексте обвинения и тяжбы.
- source_word: תְּרִיבֵנִי
  choice: Ты ведёшь со мной тяжбу
  rationale: Глагол ריב охватывает спор, противоборство и судебную тяжбу. Эта формулировка сохраняет юридический оттенок, не превращая образ в строго техническое описание суда.
theological_decisions:
- issue: Судебный оттенок обращения Иова к Богу
  choice: «Не осуждай меня» и «ведёшь со мной тяжбу»
  alternative: «Не объявляй меня виновным» и «предъявляешь мне обвинение»; либо «не считай меня нечестивым» и «споришь со мной»
  rationale: Еврейские глаголы создают судебно-конфликтное напряжение, но не требуют развёрнутой юридической парафразы. Выбранный перевод сохраняет неоднозначность между тяжбой и более широким противоборством и не сглаживает дерзновенность вопроса Иова Богу.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный по тону. Заглавное «Ты» употреблено как традиционная русская форма благоговейного обращения к Богу. Судебная образность сохранена без чрезмерно технической лексики; пунктуация оформляет прямую речь Иова.
