translation:
  language: ru
  text: 'Скажу Богу: «Не осуждай меня[a]; дай мне знать, за что Ты ведёшь со мной тяжбу[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не объявляй меня виновным»; еврейский глагол имеет судебный оттенок.'
