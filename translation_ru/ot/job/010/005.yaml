    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: Разве … как дни
  rationale: Вопросительная частица הֲ и сравнительная конструкция כִּימֵי образуют риторический вопрос; «разве … как» естественно передаёт его по-русски.
- source_word: אֱנוֹשׁ
  choice: смертного
  rationale: Слово обозначает человека и нередко подчёркивает его слабость и смертность; в данном противопоставлении Богу оттенок смертности особенно уместен.
- source_word: יָמֶיךָ
  choice: Твои дни
  rationale: Прямая передача формы с суффиксом 2-го лица мужского рода единственного числа; прописная буква указывает на обращение к Богу.
- source_word: אִם
  choice: или
  rationale: В параллельном риторическом вопросе אִם соединяет второй вариант сопоставления, а не вводит условие.
- source_word: שְׁנוֹתֶיךָ
  choice: Твои годы
  rationale: Прямая передача существительного с местоименным суффиксом, параллельная выражению «Твои дни».
- source_word: כִּימֵי
  choice: как годы
  rationale: Сравнительное כִּימֵי буквально означает «как дни»; по-русски эллипсис согласован с непосредственно предшествующим «Твои годы», сохраняя смысл поэтического параллелизма.
- source_word: גָבֶר
  choice: сильного человека
  rationale: גָּבֶר обозначает мужчину или человека, иногда с оттенком силы и зрелости. Такой перевод сохраняет отличие от אֱנוֹשׁ, не сужая значение до «воина».
