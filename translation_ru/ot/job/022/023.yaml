  text: Если ты возвратишься к Всемогущему, то будешь восстановлен[a], если удалишь зло из своего шатра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будешь построен»; возможно также: «будешь отстроен». Здесь строительный образ означает восстановление.'
