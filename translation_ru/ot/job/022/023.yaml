lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Вводит условное придаточное; простое «если» ясно передаёт синтаксис.
- source_word: תָּשׁוּב
  choice: возвратишься
  rationale: Глагол שוב означает «вернуться, обратиться назад»; этот выбор сохраняет образ движения к Богу и не сужает смысл до явно выраженного покаяния.
- source_word: עַד שַׁדַּי
  choice: к Всемогущему
  rationale: Предлог обозначает направленность, а традиционный перевод божественного титула שדי как «Всемогущий» естественен и понятен в современном русском языке.
- source_word: תִּבָּנֶה
  choice: будешь восстановлен
  rationale: Нифаль от בנה буквально означает «будешь построен/отстроен»; в отношении человека метафорически выражает восстановление или новое утверждение. Пассивная форма сохранена.
- source_word: תַּרְחִיק
  choice: удалишь
  rationale: Порода хифиль передаёт каузативное значение «сделать далёким, удалить»; «удалишь» звучит естественно и сохраняет это значение.
- source_word: עַוְלָה
  choice: неправду
  rationale: Слово обозначает моральное зло, неправедность или несправедливость; «неправда» здесь достаточно широко и естественно охватывает эти оттенки.
- source_word: מֵאָהֳלֶךָ
  choice: из своего шатра
  rationale: Сохранён конкретный образ шатра, который также может метонимически обозначать жилище или домочадцев.
theological_decisions:
- issue: Передавать ли метафору восстановления буквально или истолковательно
  choice: будешь восстановлен
  alternative: будешь отстроен; будешь вновь утверждён
  rationale: Такой перевод ясно передаёт метафорический смысл, сохраняя пассивность формы; буквальный строительный образ указан в сноске.
- issue: Переводить ли שוב как «возвратиться» или как «покаяться»
  choice: возвратишься
  alternative: обратишься; покаешься
  rationale: «Возвратишься» сохраняет основное лексическое значение и не превращает подразумеваемое покаяние в единственно возможный смысл.
- issue: Синтаксическая связь второй условной части
  choice: если удалишь неправду из своего шатра
  alternative: удалив неправду из своего шатра
  rationale: Повтор «если» естественно раскрывает условную структуру и соответствует возможному пониманию второй части как дополнительного условия, хотя в еврейском тексте союз перед ней отсутствует.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены образ возвращения к Богу и конкретное слово «шатёр»; малопонятная буквальная строительная метафора раскрыта естественным словом «восстановлен» и документирована в сноске.
