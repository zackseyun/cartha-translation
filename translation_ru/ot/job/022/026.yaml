  text: כִּי אָ֭ז עַל שַׁדַּ֣י תִּתְעַנָּ֑ג וְ/תִשָּׂ֖א אֶל אֱל֣וֹהַּ פָּנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/026.yaml
  text: For then you will delight yourself in the Almighty[b][a], and lift up your face to God.
translation:
  language: ru
  text: Ибо тогда ты будешь находить радость во Всемогущем[a] и поднимешь лицо к Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будешь наслаждаться Всемогущим».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «поднять лицо к Богу» может подразумевать уверенное обращение к Нему, восстановленное благоволение или смелость в молитве.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אָז
  choice: Ибо тогда
  rationale: כִּי вводит основание или следствие предшествующего призыва, а אָז указывает на последующее время; сочетание «ибо тогда» сохраняет обе связи.
- source_word: עַל שַׁדַּי
  choice: во Всемогущем
  rationale: Предлог עַל при התענג обозначает того, в ком находят радость. שַׁדַּי передано традиционным и понятным русским божественным титулом «Всемогущий».
- source_word: תִּתְעַנָּג
  choice: будешь находить радость
  rationale: Форма hitpael глагола ענג выражает личное переживание удовольствия и отрады. Этот вариант естественнее по-русски, чем буквальное «услаждаться», и не сводит смысл лишь к эмоциональному наслаждению.
- source_word: וְתִשָּׂא
  choice: и поднимешь
  rationale: Глагол נשׂא буквально означает «поднимать»; конкретный образ сохранён как часть устойчивого сочетания с «лицом».
- source_word: אֶל אֱלוֹהַּ
  choice: к Богу
  rationale: אֶל выражает направленность, а אֱלוֹהַּ — единственное число общего обозначения Бога; перевод не добавляет отсутствующего в еврейском тексте титула.
- source_word: פָּנֶיךָ
  choice: лицо
  rationale: Буквальный образ «поднять лицо к Богу» сохранён, поскольку он допускает оттенки уверенного обращения, восстановленного благоволения и смелой молитвы.
theological_decisions:
- issue: Смысл выражения «поднять лицо к Богу»
  choice: 'Сохранить конкретный образ: «поднимешь лицо к Богу».'
  alternative: «с уверенностью обратишься к Богу»; «будешь уверенно молиться Богу»; «воззришь к Богу»
  rationale: Еврейское выражение может указывать на уверенное приближение, восстановленное благоволение или смелость в молитве. Буквальный образ сохраняет эту смысловую многозначность и не ограничивает его одним толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и понятен; конкретная древнееврейская образность сохранена без конфессионального истолкования.
