  text: הֲֽ֭/מִ/יִּרְאָ֣תְ/ךָ יֹכִיחֶ֑/ךָ יָב֥וֹא עִ֝מְּ/ךָ֗ בַּ/מִּשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/004.yaml
  text: Is it because of your fear of him that he reproves you and enters into judgment with you?[a][b][c]
translation:
  language: ru
  text: Разве за то, что ты боишься Его,[a] Он обличает тебя[b] и вступает с тобой в суд?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за твоего страха»; то есть страха перед Богом. Возможный перевод: «за твоё благоговение перед Ним».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «укоряет тебя», «исправляет тебя»; в данном контексте возможно также судебное значение: «предъявляет тебе обвинение».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «приходит с тобой в суд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיִּרְאָתְךָ
  choice: Разве за то, что ты боишься Его
  rationale: 'Вопросительная частица и מִן перед יִרְאָה выражают причинный смысл: «разве из-за/за твой страх». В контексте подразумевается страх перед Богом; естественная русская глагольная конструкция ясно передаёт эту эллиптическую связь.'
- source_word: יֹכִיחֶךָ
  choice: Он обличает тебя
  rationale: Hiphil от יכח допускает значения обличения, упрёка и предъявления обвинения. «Обличает» сохраняет нравственный оттенок и согласуется с судебной образностью следующей части стиха.
- source_word: יָבֹא עִמְּךָ בַּמִּשְׁפָּט
  choice: вступает с тобой в суд
  rationale: Выражение буквально означает «входит/приходит с тобой в суд». Русская формула «вступает с тобой в суд» естественна и сохраняет юридический и состязательный оттенок.
- source_word: מִּשְׁפָּט
  choice: суд
  rationale: Здесь слово обозначает судебное разбирательство или суд; «суд» кратко и точно сохраняет юридическую семантику.
theological_decisions:
- issue: Подразумеваемый объект страха в יִרְאָתְךָ
  choice: 'Объектом назван Бог: «ты боишься Его».'
  alternative: 'Оставить объект невыраженным: «из-за твоего страха».'
  rationale: Контекст речи Елифаза указывает на Бога. В русском без объекта выражение было бы неестественно и могло бы означать обычную боязнь; экспликация не добавляет нового богословского утверждения.
- issue: Риторическая сила вопроса Елифаза
  choice: Вопрос сформулирован с «разве» и предполагает отрицательный ответ.
  alternative: 'Передать как нейтральный вопрос: «За то ли…?»'
  rationale: 'Контекст и еврейская вопросительная конструкция выражают иронию Елифаза: он отрицает, что Бог судит Иова за его богобоязненность.'
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Разве» передаёт риторический вопрос; прописная буква в местоимении «Его» ясно обозначает подразумеваемого Бога. Судебная метафора сохранена без конфессионального истолкования.
