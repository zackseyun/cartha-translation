id: JOB.22.22
reference: Job 22:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: קַח נָ֣א מִ/פִּ֣י/ו תּוֹרָ֑ה וְ/שִׂ֥ים אֲ֝מָרָ֗י/ו בִּ/לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/022.yaml
  text: Please[a], receive instruction from his mouth, and lay up his words in your heart.
translation:
  language: ru
  text: Прошу, прими наставление[a] из его уст и положи его слова в своё сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учение» или «закон» (евр. тора).'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: прими
  rationale: Императив буквально означает «возьми», но в сочетании с наставлением естественно передаёт принятие и усвоение сказанного.
- source_word: נָא
  choice: прошу
  rationale: Частица выражает просьбу или настойчивое побуждение, а не обязательно временное «теперь».
- source_word: מִפִּיו
  choice: из его уст
  rationale: Сохранён конкретный образ прямой речи, выраженный в еврейском тексте.
- source_word: תּוֹרָה
  choice: наставление
  rationale: В контексте речи мудреца слово обозначает авторитетное наставление и не требует узкого понимания как Моисеева закона.
- source_word: וְשִׂים
  choice: положи
  rationale: Прямое значение глагола сохраняет образ помещения слов в сердце; по-русски этот образ понятен как внутреннее усвоение.
- source_word: אֲמָרָיו
  choice: его слова
  rationale: Естественная и точная передача множественного существительного со значением высказываний.
- source_word: בִּלְבָבֶךָ
  choice: в своё сердце
  rationale: Сохранён древнееврейский образ сердца как средоточия мысли, воли и внутренней жизни.
theological_decisions:
- issue: Значение תּוֹרָה в речи мудреца
  choice: наставление
  alternative: закон; учение
  rationale: «Наставление» соответствует контексту призыва Елифаза принять исходящее от Бога учение и не вносит без достаточных оснований специальный смысл Моисеева или заветного закона.
- issue: Написание местоимения, относящегося к Богу
  choice: его — со строчной буквы
  alternative: Его — с прописной буквы
  rationale: В еврейском письме здесь нет различия между прописной и строчной буквой; строчное написание не добавляет в перевод конфессионально-редакционного оформления, при этом референт определяется контекстом.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «из уст» и метафоры помещения слов в сердце. «Прошу» передаёт просительный оттенок частицы נָא без архаичного оборота.
