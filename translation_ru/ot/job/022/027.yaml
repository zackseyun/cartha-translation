base_translation:
  language: en
  yaml_path: translation/ot/job/022/027.yaml
  text: You will pray to him[a], and he will hear you, and you will fulfill your vows.
translation:
  language: ru
  text: Ты будешь молиться Ему, и Он услышит тебя, и ты исполнишь свои обеты.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воздашь свои обеты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעְתִּיר
  choice: будешь молиться
  rationale: Порода hифиль глагола עתר означает усердно просить, умолять, молиться. В сочетании с «Ему» и последующим упоминанием о том, что Бог услышит, естественное русское соответствие — «молиться».
- source_word: אֵלָיו
  choice: Ему
  rationale: 'Буквально: «к нему». Местоимение относится к Богу из ближайшего контекста; прописная буква ясно передаёт референцию, не заменяя местоимение именем существительным.'
- source_word: וְיִשְׁמָעֶךָּ
  choice: и Он услышит тебя
  rationale: שׁמע непосредственно означает «слышать, слушать». «Услышит» сохраняет формулировку оригинала и подразумеваемое благосклонное внимание, не усиливая смысл до «ответит».
- source_word: וּנְדָרֶיךָ
  choice: и свои обеты
  rationale: נֶדֶר — обет, данный Богу. Возвратное притяжательное местоимение «свои» естественно по-русски соотносит обеты с подлежащим «ты».
- source_word: תְשַׁלֵּם
  choice: исполнишь
  rationale: Порода пиэль глагола שלם в сочетании с обетами идиоматически означает исполнить то, что было обещано. «Исполнишь» ясно передаёт смысл в современном русском языке; более буквальное «воздашь» отмечено в сноске.
theological_decisions:
- issue: Передавать ли заключительную фразу буквально-культовым выражением или понятным русским оборотом
  choice: исполнишь свои обеты
  alternative: воздашь свои обеты
  rationale: Речь идёт о выполнении обещанного Богу. «Исполнишь» передаёт обязательность обета, не придавая выражению денежного смысла и не добавляя конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм трёх будущих действий сохранён; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
