  text: וְ/ה֤וּא מִלֵּ֣א בָתֵּי/הֶ֣ם ט֑וֹב וַ/עֲצַ֥ת רְ֝שָׁעִ֗ים רָ֣חֲקָה מֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/018.yaml
  text: Yet he filled their houses with good things[b][a], but the counsel of the wicked is far from me.
translation:
  language: ru
  text: И всё же Он наполнил их дома добром[a], а совет нечестивых далёк от меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «добром»; по смыслу также возможно: «благами» или «благополучием».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также понимание как пожелания: «пусть совет нечестивых будет далёк от меня». Однако еврейский текст прямее выражает утверждение: «совет нечестивых далёк от меня».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: И всё же Он
  rationale: Союз с местоимением выражает контраст с отношением нечестивых в предыдущем контексте; явное местоимение сохраняет акцент на Боге как действующем лице.
- source_word: מִלֵּא
  choice: наполнил
  rationale: Форма qatal естественно передаётся русским совершенным прошедшим временем; сохраняется конкретный образ наполнения.
- source_word: בָתֵּיהֶם
  choice: их дома
  rationale: Буквальное и естественное соответствие; образ домов обозначает также сферу их благополучия, но перевод не заменяет образ толкованием.
- source_word: טוֹב
  choice: добром
  rationale: Субстантивированное «добро» передаёт широкий смысл благ и хороших даров, не сужая его до одного лишь материального процветания.
- source_word: וַעֲצַת
  choice: а совет
  rationale: Союз передан противительно-сопоставительным «а»; «совет» сохраняет диапазон значений замысла, намерения и предлагаемого пути.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Устойчивое и точное существительное во множественном числе для обозначения людей, виновно противящихся правде.
- source_word: רָחֲקָה מֶנִּי
  choice: далёк от меня
  rationale: Русское именное сказуемое в настоящем времени естественно передаёт состояние отчуждённости, выраженное еврейским qatal, без превращения фразы в повеление или пожелание.
theological_decisions:
- issue: 'Характер последней строки: утверждение или пожелание'
  choice: 'Утверждение: «совет нечестивых далёк от меня»'
  alternative: 'Пожелание: «да будет совет нечестивых далёк от меня»'
  rationale: Еврейский текст использует qatal רָחֲקָה, а не повелительную или юссивную форму. Перевод сохраняет заявление говорящего о непричастности к совету нечестивых и не добавляет молитвенного оттенка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Конкретный образ «домов» и широкое слово «добро» сохранены; синтаксис остаётся ясным для обычного читателя.
