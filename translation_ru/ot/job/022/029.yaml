  yaml_path: translation/ot/job/022/029.yaml
  text: For when they are brought low[a], you say[b], ‘Lift them up!’ and he saves the one with downcast eyes.
translation:
  language: ru
  text: 'Ибо когда людей унизят, ты скажешь: «Подъём!»[a] — и он спасёт того, чей взор опущен.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза предельно кратка и допускает более буквальный перевод: «Ибо когда они повержены, ты скажешь: „Есть возвышение!“»'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «опущенный глазами»; речь может идти о смиренном или удручённом человеке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо когда
  rationale: Сочетает причинную связь с предшествующим обещанием и временное значение, естественное в данном контексте.
- source_word: הִשְׁפִּילוּ
  choice: унижают
  rationale: Форма обозначает действие, при котором кого-либо делают низким, унижают или низвергают. Безличная русская конструкция сохраняет невыраженный в еврейском тексте объект и не приписывает действию добровольного самоуничижения.
- source_word: וַתֹּאמֶר
  choice: ты скажешь
  rationale: Глагол обращён к одному человеку; будущее время согласуется с обещаниями в ближайшем контексте и естественно передаёт последовательность событий.
- source_word: גֵּוָה
  choice: Возвышение!
  rationale: Существительное выражает высоту или возвышение и здесь противопоставлено унижению. Краткое восклицание сохраняет эллиптичность и не превращает существительное без необходимости в прямое повеление.
- source_word: וְשַׁח עֵינַיִם
  choice: того, чей взор опущен
  rationale: Передаёт буквальный образ опущенных глаз, который может указывать как на смирение, так и на подавленность, не устраняя эту смысловую широту.
- source_word: יוֹשִׁעַ
  choice: Он спасёт
  rationale: Глагол означает «спасать, избавлять». Будущее время соответствует обещанию в контексте; подразумеваемый субъект оставлен в форме местоимения, как и в сжатом еврейском выражении.
theological_decisions:
- issue: Подразумеваемый субъект יוֹשִׁעַ
  choice: «Он спасёт», где по контексту подразумевается Бог, но имя не добавляется
  alternative: «Бог спасёт»; неопределённое «спасут»; обращённое к собеседнику «ты спасёшь»
  rationale: Еврейский глагол стоит в третьем лице единственного числа мужского рода. Контекст указывает на Бога, однако явное существительное в стихе отсутствует, поэтому сохранена лаконичность оригинала.
- issue: Смысл גֵּוָה в эллиптической фразе
  choice: «Возвышение!» как декларация перемены положения
  alternative: «Ввысь!»; «Есть возвышение!»; «Возвысь их!»; отрицательное «гордость»
  rationale: Непосредственное противопоставление унижению указывает здесь на положительное возвышение. Именная восклицательная форма сохраняет грамматическую и смысловую напряжённость трудного еврейского оборота.
translation_notes:
  register: Современный литературный русский язык с краткой, возвышенной интонацией поэтической речи. Сохранены эллиптичность трудной первой половины стиха, образ опущенного взора и не названный прямо субъект последнего глагола.
