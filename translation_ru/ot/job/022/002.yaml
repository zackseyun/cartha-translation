base_translation:
  language: en
  yaml_path: translation/ot/job/022/002.yaml
  text: Can a man be of use to God? Surely he who is wise is of use to himself[a].
translation:
  language: ru
  text: Разве человек может быть полезен Богу? Ведь разумный приносит пользу самому себе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве человек может принести пользу Богу? Ибо обладающий разумением приносит пользу самому себе».'
    reason: 'Лексико-синтаксический вариант: סכן допускает перевод «приносить пользу», מַשְׂכִּיל — «обладающий разумением», а כִּי — причинное «ибо».'
lexical_decisions:
- source_word: הַלְאֵל
  choice: Разве … Богу?
  rationale: Вопросительная частица הֲ и предлог לְ при אֵל переданы естественной русской риторической конструкцией с косвенным дополнением «Богу».
- source_word: יִסְכָּן
  choice: может быть полезен / приносит пользу
  rationale: Глагол סכן здесь означает «быть полезным, приносить пользу». В двух полустишиях использованы близкие по смыслу русские выражения, подходящие к разному синтаксису.
- source_word: גָּבֶר
  choice: человек
  rationale: Хотя существительное имеет мужской род, в данном обобщающем риторическом вопросе оно обозначает человека вообще; современное русское «человек» точно и естественно передаёт эту функцию.
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит поясняющее и усиливающее второе полустишие; «ведь» естественно передаёт его аргументативную связь с вопросом.
- source_word: עָלֵימוֹ
  choice: самому себе
  rationale: Предлог עַל с местоименным суффиксом в данном контексте указывает на того, кому достаётся польза. Возвратная формулировка отражает контраст с пользой для Бога.
- source_word: מַשְׂכִּיל
  choice: разумный
  rationale: Субстантивированное причастие от שכל обозначает обладающего разумением или поступающего мудро; «разумный» сохраняет смысл и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Утверждает ли стих, что человек способен принести Богу пользу
  choice: Первое полустишие передано как риторический вопрос, подразумевающий отрицательный ответ; второе относит пользу разумности к самому человеку.
  alternative: 'Второе полустишие можно передать менее контрастно: «ибо разумный полезен самому себе».'
  rationale: Параллелизм противопоставляет возможную пользу Богу пользе для самого человека, но перевод не разворачивает это в более широкое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык; риторическая сила вопроса сохранена с помощью «разве». Слово «лишь» делает подразумеваемый контраст явным, не вводя нового адресата или доктринального пояснения.
