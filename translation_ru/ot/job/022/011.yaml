  source_fidelity: 'Текст точно передаёт еврейскую последовательность образов: «или тьма» (אוֹ חֹשֶׁךְ), отсутствие зрения (לֹא תִרְאֶה) и «обилие вод», которое покрывает адресата (וְשִׁפְעַת מַיִם תְּכַסֶּךָּ). Формулировка «в которой ты ничего не видишь» — допустимое русское синтаксическое раскрытие связи тьмы с невозможностью видеть; она не вносит существенного нового смысла.'
