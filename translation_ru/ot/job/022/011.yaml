  text: אוֹ חֹ֥שֶׁךְ לֹֽא תִרְאֶ֑ה וְֽ/שִׁפְעַת מַ֥יִם תְּכַסֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/011.yaml
  text: or darkness[a], so that you cannot see, and an abundance of waters covers you.
translation:
  language: ru
  text: или тьма, в которой ты ничего не видишь, и обилие вод покрывает тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «и поток вод покрывает тебя». Еврейское выражение может обозначать разлив или поток вод, но допускает и более широкое значение — «обилие вод».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: или
  rationale: Сохраняет краткую разделительную связь с предыдущим бедствием в речи Елифаза.
- source_word: חֹשֶׁךְ לֹא תִרְאֶה
  choice: тьма, в которой ты ничего не видишь
  rationale: Передаёт буквально выраженную невозможность видеть и естественно связывает бессоюзное «тьма» с глагольной фразой, не усиливая модальность до «не можешь».
- source_word: וְשִׁפְעַת מַיִם
  choice: и обилие вод
  rationale: Шִׁפְעָה обозначает обилие или избыток; перевод сохраняет широту образа и не сужает его до конкретного «потопа» или «паводка».
- source_word: תְּכַסֶּךָּ
  choice: покрывает тебя
  rationale: Прямо передаёт значение интенсивной формы глагола כסה «покрывать», не заменяя образ толкованием «поглощает» или «захлёстывает».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и поэтического параллелизма еврейского текста. Местоимение «тебя» оставлено со строчной буквы, поскольку речь обращена к Иову, а не к Богу.
