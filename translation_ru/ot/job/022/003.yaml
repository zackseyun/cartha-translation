  text: הַ/חֵ֣פֶץ לְ֭/שַׁדַּי כִּ֣י תִצְדָּ֑ק וְ/אִם בֶּ֝֗צַע כִּֽי תַתֵּ֥ם דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/003.yaml
  text: Is it any pleasure to the Almighty that you are righteous[b][a], or any gain that you make your ways blameless?
translation:
  language: ru
  text: Разве доставляет Всемогущему удовольствие то, что ты праведен, или приносит Ему выгоду то, что ты делаешь свои пути безупречными?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: удовольствие
  rationale: Существительное חֵפֶץ может обозначать удовольствие, отраду или желание. «Удовольствие» естественно передаёт здесь то, что могло бы доставлять удовлетворение, и поддерживает риторический характер вопроса.
- source_word: לְשַׁדַּי
  choice: для Всемогущего
  rationale: Божественный титул שַׁדַּי в книге Иова традиционно и понятно передаётся как «Всемогущий»; предлог לְ при слове «удовольствие» естественно выражен русским «для».
- source_word: כִּי תִצְדָּק
  choice: в том, что ты праведен
  rationale: Qal глагола צדק здесь означает «быть праведным» или «быть правым», а не «оправдывать себя». Оборот «в том, что» естественно связывает придаточную часть с существительным «удовольствие».
- source_word: וְאִם
  choice: или
  rationale: В параллельном риторическом вопросе וְאִם вводит вторую часть сопоставления; русское «или» ясно и естественно передаёт эту функцию.
- source_word: בֶּצַע
  choice: выгода
  rationale: בֶּצַע обозначает выгоду или прибыль. «Выгода» сохраняет образ пользы для Бога и лучше подходит к данному контексту, чем более узкое денежное «прибыль».
- source_word: כִּי תַתֵּם
  choice: в том, что ты делаешь … безупречными
  rationale: 'Форма Hiphil от תמם имеет каузативный смысл: делать целостным, совершенным или безупречным. Такая передача сохраняет действие, выраженное еврейской формой.'
- source_word: דְּרָכֶיךָ
  choice: свои пути
  rationale: Множественное число דֶּרֶךְ метафорически обозначает образ жизни и поступки. «Свои пути» сохраняет исходный образ и остаётся понятным в современном литературном русском.
theological_decisions:
- issue: Утверждает ли стих, что человеческая праведность приносит Богу внутреннюю пользу
  choice: 'Риторические вопросы передают довод Елифаза: человеческая праведность не даёт Всемогущему выгоды и не служит источником нужного Ему удовлетворения.'
  alternative: 'Более мягкое прочтение: Бог не нуждается в человеческой праведности, хотя она может быть Ему угодна.'
  rationale: Слова חֵפֶץ и בֶּצַע создают напряжение между удовольствием и выгодой. Перевод сохраняет силу довода Елифаза, но не превращает его слова в универсальное богословское утверждение о том, что праведность нигде и никогда не радует Бога.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксический параллелизм и метафора «пути» сохранены; формулировка не сглаживает риторическую резкость слов Елифаза.
