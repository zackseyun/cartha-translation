base_translation:
  language: en
  yaml_path: translation/ot/job/022/019.yaml
  text: The righteous see and rejoice[a], and the innocent mock them.
translation:
  language: ru
  text: Праведные увидят и возрадуются, а невинный посмеётся над ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְאוּ
  choice: увидят
  rationale: Qal, имперфект 3-го лица множественного числа от ראה; передаёт восприятие или наблюдение происходящего без добавления отсутствующего в еврейском тексте объекта.
- source_word: צַדִּיקִים
  choice: праведные
  rationale: Прилагательное во множественном числе, употреблённое как существительное; естественно и точно обозначает нравственную категорию.
- source_word: וְיִשְׂמָחוּ
  choice: и возрадуются
  rationale: Qal, имперфект 3-го лица множественного числа от שׂמח; «возрадуются» сохраняет возвышенный поэтический регистр и положительную эмоциональную реакцию.
- source_word: וְנָקִי
  choice: а невинный
  rationale: Субстантивированное прилагательное в единственном числе; сохранено грамматическое число оригинала и родовая, обобщающая функция. Союз «а» естественно оформляет параллельную строку в русском языке.
- source_word: יִלְעַג
  choice: посмеётся над
  rationale: Qal, имперфект 3-го лица единственного числа от לעג; в сочетании с «над» выражает насмешливый, презрительный смех.
- source_word: לָמוֹ
  choice: ними
  rationale: Местоименная форма множественного числа с предлогом; сочетание «посмеётся над ними» непосредственно передаёт конструкцию и оставляет референт местоимения контексту.
theological_decisions:
- issue: Референт местоимения לָמוֹ в контексте
  choice: Оставить «ними» без эксплицитного уточнения; в ближайшем контексте речь идёт о нечестивых, постигнутых судом.
  alternative: Вставить «нечестивыми» или истолковать стих как общее высказывание о радости праведных при Божьем суде.
  rationale: Еврейский текст использует местоимение, а не повторяет существительное. Сохранение местоимения не навязывает толкование в основном тексте, хотя контекст указывает на погибающих нечестивых.
- issue: Характер реакции невинного
  choice: 'Передать לעג как насмешку: «посмеётся над ними».'
  alternative: Ослабить до нейтрального «рассмеётся» или усилить до «будет глумиться».
  rationale: Глагол обозначает презрительную насмешку. Выбранная формулировка сохраняет напряжённость образа, не смягчая и не усиливая его богословски.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм и смена множественного числа на обобщающее единственное сохранены. Дополнительный объект после «увидят» не введён, поскольку в масоретском тексте он отсутствует.
