  text: עָבִ֣ים סֵֽתֶר ל֭/וֹ וְ/לֹ֣א יִרְאֶ֑ה וְ/ח֥וּג שָׁ֝מַ֗יִם יִתְהַלָּֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/014.yaml
  text: Clouds are a covering for him[a], so that he does not see; and he walks on the vault of heaven.
translation:
  language: ru
  text: Облака служат ему покровом[a], так что он не видит, и ходит по небесному своду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Густые облака служат ему покровом, и он не видит; он ходит по кругу небес».'
    reason: 'Лексические и синтаксические варианты: עָבִים может подчёркивать густоту облаков, וְלֹא יִרְאֶה допускает простое сочинение, а חוּג — значение «круг».'
lexical_decisions:
- source_word: עָבִים
  choice: облака
  rationale: Существительное во множественном числе обозначает облака, нередко плотные дождевые тучи. Нейтральное «облака» естественно по-русски, а образ скрывающего покрова уже передаёт их непрозрачность.
- source_word: סֵתֶר
  choice: покров
  rationale: Слово выражает идею укрытия, сокрытия или того, что заслоняет. «Покров» сохраняет конкретный образ облаков, закрывающих вид.
- source_word: לוֹ
  choice: ему
  rationale: Предлог с местоименным суффиксом естественно передаётся в конструкции «служат ему покровом»; местоимение сохраняет связь с Богом из предыдущего стиха, не добавляя имени в сам текст.
- source_word: וְלֹא יִרְאֶה
  choice: так что он не видит
  rationale: Союз допускает как простое присоединение («и он не видит»), так и оттенок следствия. Здесь «так что» естественно связывает покров облаков с приписываемой Богу неспособностью видеть; сочинительное прочтение отмечено в сноске.
- source_word: חוּג
  choice: свод
  rationale: Слово может обозначать круг или дугообразный свод. В сочетании с небесами «свод» ясно передаёт образ небесной дуги, не превращая его в техническое космологическое утверждение.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Традиционное и понятное русское множественное число сохраняет возвышенный регистр и соответствует форме исходного слова.
- source_word: יִתְהַלָּךְ
  choice: ходит
  rationale: Форма глагола הלך выражает хождение или движение взад и вперёд. «Ходит» кратко и непосредственно сохраняет образ движения по небесному своду.
theological_decisions:
- issue: Перспектива говорящего и подразумеваемый субъект
  choice: 'Местоимение «он» оставлено без замены на «Бог»: стих продолжает приписываемые Елифазом нечестивцу слова о том, будто облака скрывают Бога и Он не видит происходящего.'
  alternative: Понять стих как нейтральное утверждение о Божьей запредельности.
  rationale: 'В Иов 22:13–14 Елифаз передаёт предполагаемые им слова Иова: «Что знает Бог?» Поэтому перевод сохраняет обвинительный характер реплики, но не вставляет отсутствующее в еврейском тексте имя «Бог» и не снимает напряжение контекста.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Строчная буква в местоимениях следует обычной современной орфографии и не вносит конфессиональной стилизации.
