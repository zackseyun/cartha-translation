base_translation:
  language: en
  yaml_path: translation/ot/job/022/009.yaml
  text: You sent widows away empty[c][b][a], and the arms of orphans were crushed.
translation:
  language: ru
  text: 'Ты отсылал вдов ни с чем,

    и руки сирот[a] были сокрушены.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Руки» могут также означать силу или могущество.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנוֹת
  choice: вдов
  rationale: Стандартное значение множественного числа — женщины, лишившиеся мужей; слово сохраняет социальную уязвимость, подчёркнутую в контексте.
- source_word: שִׁלַּחְתָּ
  choice: отпускал
  rationale: Порода пиэль глагола שלח здесь означает «отсылать, отпускать, прогонять». «Отпускал» естественно сочетается с «ни с чем» и передаёт обвинительный смысл без излишнего усиления.
- source_word: רֵיקָם
  choice: ни с чем
  rationale: Наречие означает «порожняком, с пустыми руками». Русское «ни с чем» естественно передаёт отказ дать просителю необходимое.
- source_word: זְרֹעוֹת
  choice: руки
  rationale: Буквально «руки»; в еврейской образности слово может также обозначать силу или могущество. Конкретный образ сохранён в основном тексте.
- source_word: יְתֹמִים
  choice: сирот
  rationale: Слово обозначает детей, лишённых отца и потому социально беззащитных. «Сироты» — ясный и обычный современный русский эквивалент.
- source_word: יְדֻכָּא
  choice: сокрушал
  rationale: Пассивная форма от דכא означает «быть сокрушённым, сломанным». Однако масоретская форма глагола стоит в единственном числе при предшествующем множественном «руки»; вероятна собирательная или поэтическая конструкция. В русском контексте прямое обращение к обвиняемому и параллелизм естественно передаются активным «и сокрушал», не меняющим подразумеваемого деятеля.
theological_decisions:
- issue: Буквальный или переносный смысл «рук сирот»
  choice: Сохранён буквальный образ «руки сирот» с пояснением возможного значения силы.
  alternative: 'Передать непосредственно: «лишал сирот силы» или «сокрушал силу сирот».'
  rationale: Еврейский текст допускает конкретный и метафорический оттенки. Сохранение образа не устраняет смысловую напряжённость и не навязывает одно толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической обвинительной речи. Параллелизм двух строк сохранён; «ни с чем» выбрано как естественное соответствие выражению «с пустыми руками».
