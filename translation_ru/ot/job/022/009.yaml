  source_fidelity: 'Первая строка передаёт еврейский текст точно: «отсылал вдов ни с чем» соответствует שִׁלַּחְתָּ רֵיקָם. Во второй строке исходная форма יְדֻכָּא пассивна («были/была сокрушены»); активное «и сокрушал» в черновике неоправданно делает адресата прямо выраженным деятелем. Пассив следует сохранить. Число русского сказуемого естественно согласовать с «руки» во множественном числе, не пытаясь воспроизводить спорное/поэтическое единственное число еврейской формы.'
