  text: הֲ/לֹ֣א רָעָֽתְ/ךָ֣ רַבָּ֑ה וְ/אֵֽין קֵ֝֗ץ לַ/עֲוֺנֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/005.yaml
  text: Is not your evil abundant[b][a], and there is no end to your iniquities?
translation:
  language: ru
  text: Разве не велико твоё зло[a] и нет конца[b] твоим беззакониям?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоя нечестивость». В других контекстах еврейское слово может означать «бедствие», но здесь параллель с «беззакониями» указывает на нравственное зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нет предела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет обвинительный тон речи Елифаза.
- source_word: רָעָתְךָ
  choice: твоё зло
  rationale: В параллели с «твоими беззакониями» слово обозначает нравственное зло, а не бедствие; «зло» сохраняет широту еврейского выражения.
- source_word: רַבָּה
  choice: велико
  rationale: Передаёт большую меру или величину зла и естественно сочетается в русском языке с существительным единственного числа «зло».
- source_word: וְאֵין קֵץ
  choice: и нет конца
  rationale: Близко воспроизводит еврейскую конструкцию и естественно выражает отсутствие предела.
- source_word: לַעֲוֺנֹתֶיךָ
  choice: твоим беззакониям
  rationale: «Беззакония» передают сильную нравственную окраску עָוֹן и множественное число; дательный падеж соответствует русской конструкции «нет конца чему».
theological_decisions:
- issue: Нравственное зло или постигшее Иова бедствие в רָעָתְךָ
  choice: нравственное зло
  alternative: бедствие, несчастье
  rationale: Непосредственный параллелизм с «твоими беззакониями» показывает, что Елифаз обвиняет Иова в дурных поступках, а не просто говорит о его страданиях.
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет достоинство поэтической речи, риторический вопрос и прямой обвинительный тон оригинала.
