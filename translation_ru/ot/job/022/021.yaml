- from: Сблизься же с Ним и будь в мире; благодаря этому к тебе придёт добро.
  to: Примирись же с Ним и будь в мире; так к тебе придёт добро.
  rationale: Заменено «сблизься» на «примирись», чтобы точнее передать призыв к миру/согласию в контексте. «Благодаря этому» заменено на «так», что естественнее по-русски и не сглаживает спорную функцию множественного בָּהֶם до единственного указательного местоимения. Смысл обещания, произносимого Елифазом, не изменён.
