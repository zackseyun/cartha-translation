base_translation:
  language: en
  yaml_path: translation/ot/job/022/021.yaml
  text: Come to terms with him, please, and be at peace; by this good will come to you.
translation:
  language: ru
  text: Примирись же с Ним и будь в мире; так к тебе придёт добро.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסְכֶּן נָא עִמּוֹ
  choice: Сблизься же с Ним
  rationale: Глагол סכן здесь допускает значения «привыкнуть, познакомиться, войти в близкие отношения»; «сблизься» естественно передаёт призыв восстановить близкие отношения. Частица נָא отражена словом «же», выражающим настойчивое побуждение.
- source_word: וּשְׁלם
  choice: и будь в мире
  rationale: Форма связана с שׁלם и в данном контексте означает пребывание в мире, прежде всего с Богом; буквальный образ сохранён без чрезмерного истолкования.
- source_word: בָּהֶם
  choice: благодаря этому
  rationale: Буквально местоимение имеет форму множественного числа «через них / в них», но относится к предшествующим действиям как к совокупности; русский перевод передаёт инструментально-причинную связь, сохраняя смысловую неопределённость.
- source_word: תְּבוֹאַתְךָ טוֹבָה
  choice: к тебе придёт добро
  rationale: 'Сохранены порядок смысловых компонентов и общее значение: результатом станет приход добра к адресату.'
theological_decisions:
- issue: К кому относится местоимение עִמּוֹ («с ним»)?
  choice: «с Ним» — с Богом
  alternative: «с ним» без указания референта
  rationale: В речи Елифаза адресатом примирения подразумевается Бог; прописная буква помогает русскому читателю распознать референта, не добавляя Божьего имени.
- issue: Характер обещания добра
  choice: передать утверждение Елифаза прямо, без редакционного одобрения или оговорки
  alternative: смягчить обещание как возможность
  rationale: Стих сообщает позицию говорящего внутри диалога; перевод не должен ни превращать её в безусловное учение книги, ни ослаблять грамматику его утверждения.
translation_notes:
  register: Современный литературный русский язык; тон настойчивого, но внешне примирительного наставления. Синтаксис краткий и афористичный, в соответствии с поэтической речью Елифаза.
