    issue: «Сблизься же с Ним»
    rationale: Передача допускается словарно, однако современное «сблизиться» в первую очередь говорит об интимности или усилении близости, тогда как контекст и сочетание с «будь в мире» выражают примирение/согласие. Это также слабее согласуется с английским audit trail «Come to terms with him».
  - severity: low
    issue: «благодаря этому» для בָּהֶם
    rationale: Еврейская форма множественного числа может собирать два предшествующих повеления в один комплекс. Единственное «этому» не является грубой ошибкой, но «так» лучше сохраняет компактную, не до конца специфицированную связь оригинала.
