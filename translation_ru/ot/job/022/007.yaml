id: JOB.22.7
reference: Job 22:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹא מַ֭יִם עָיֵ֣ף תַּשְׁקֶ֑ה וּ֝/מֵ/רָעֵ֗ב תִּֽמְנַֽע לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/007.yaml
  text: You gave no water to the weary to drink[a], and from the hungry you withheld bread.
translation:
  language: ru
  text: Ты не давал утомлённому воды напиться и отказывал голодному в хлебе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «хлеб» может также обозначать пищу вообще, но в основном тексте сохранено конкретное слово источника.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Простое отрицание при первом обвинении; по-русски естественно передаётся сочетанием «не давал».
- source_word: מַיִם
  choice: воды
  rationale: Обычное значение — «вода»; после «давал» естественен родительный падеж партитивного значения.
- source_word: עָיֵף
  choice: утомлённому
  rationale: Прилагательное употреблено субстантивированно и в единственном числе как обобщённое обозначение утомлённого человека.
- source_word: תַּשְׁקֶה
  choice: давал … напиться
  rationale: Каузативная форма означает «давать пить, поить»; эта конструкция естественна в современном русском и сохраняет значение предоставления питья.
- source_word: וּמֵרָעֵב
  choice: и … голодному
  rationale: Субстантивированное прилагательное в единственном числе имеет обобщённый смысл. Значение исходного מִן выражено управлением глагола «отказывать кому-либо в чём-либо».
- source_word: תִּמְנַע
  choice: отказывал … в
  rationale: Глагол означает удерживать, не давать. «Отказывать голодному в хлебе» ясно передаёт нравственное обвинение и в русском звучит естественнее буквального «удерживал от голодного».
- source_word: לָחֶם
  choice: хлебе
  rationale: Сохранён конкретный исходный образ «хлеб», хотя слово может обозначать пищу шире.
theological_decisions: []
