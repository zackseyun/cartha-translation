  text: אִם לֹ֣א נִכְחַ֣ד קִימָ֑/נוּ וְ֝/יִתְרָ֗/ם אָ֣כְלָה אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/020.yaml
  text: Surely our adversaries have been cut off[b][a], and fire has consumed what was left of them.
translation:
  language: ru
  text: Воистину, наши противники[a] истреблены, и огонь пожрал то, что от них осталось[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское קִימָנוּ — трудная форма. Здесь она понята как «наши противники», то есть восставшие против нас; возможно также понимание «наше имущество» или «наше достояние».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «их остаток».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Воистину
  rationale: Сочетание здесь имеет усилительно-утвердительное, а не условное значение и вводит решительное утверждение.
- source_word: נִכְחַד
  choice: истреблены
  rationale: Нифаль глагола כחד передаёт пассивно-результативную мысль об уничтожении или устранении; «истреблены» сохраняет эту силу и естественно звучит в данном контексте.
- source_word: קִימָנוּ
  choice: наши противники
  rationale: Форма трудна для истолкования. В контексте наиболее связно понимать её как обозначение тех, кто восстал против говорящих, то есть их противников, не скрывая иной возможности в сноске.
- source_word: וְיִתְרָם
  choice: то, что от них осталось
  rationale: יתר обозначает остаток, а местоименный суффикс относится к уничтоженной группе. Такая формулировка естественна по-русски и сохраняет смысл остатка.
- source_word: אָכְלָה אֵשׁ
  choice: огонь пожрал
  rationale: Сочетание אכל с огнём в роли деятеля изображает полное уничтожение; «пожрал» сохраняет яркую метафору оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Утвердительное «Воистину» передаёт эмфатический оборот; метафора пожирающего огня сохранена. Неясность קִימָנוּ не устранена молча, а отражена в сноске.
