  text: יְֽמַלֵּ֥ט אִֽי נָקִ֑י וְ֝/נִמְלַ֗ט בְּ/בֹ֣ר כַּפֶּֽי/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/022/030.yaml
  text: He delivers even one who is not innocent[b][a], and he will be delivered through the cleanness of your hands.
translation:
  language: ru
  text: Он избавит даже виновного[a], и тот будет избавлен чистотой твоих рук[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст первой части стиха труден. Возможно также: «Он избавит невиновного».'
    reason: alternative_reading
  - marker: b
    text: «Чистота рук» — образ невиновности и нравственной чистоты.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַלֵּט
  choice: избавит
  rationale: Пиэль от מלט означает «дать избежать опасности, избавить, спасти»; «избавит» естественно передаёт каузативный смысл и сохраняет связь со второй частью стиха.
- source_word: אִי נָקִי
  choice: даже невиновного
  rationale: Еврейское выражение исключительно трудно. Основной текст следует традиционному пониманию, отражённому в ряде древних и современных переводов, но не представляет его как бесспорное; альтернативное чтение отмечено в сноске.
- source_word: וְנִמְלַט
  choice: и тот спасётся
  rationale: Нифаль от מלט может означать «быть избавленным» или «спастись». Местоимение «тот» ясно связывает глагол с человеком из первой строки, не называя прямо действующее лицо.
- source_word: בְּבֹר כַּפֶּיךָ
  choice: благодаря чистоте твоих рук
  rationale: Предлог ב передаёт средство или основание, а בֹּר в сочетании с «руками» означает чистоту; русское «благодаря» естественно выражает инструментально-причинную связь.
theological_decisions:
- issue: Смысл первой части стиха
  choice: Бог избавляет невиновного, а его спасение связано с чистотой рук Иова.
  alternative: Бог избавляет даже виновного благодаря чистоте рук Иова.
  rationale: Масоретский текст синтаксически труден. Вокализация WLC יְמַלֵּט אִי נָקִי допускает традиционное понимание אִי как усилительного элемента при «невиновном», тогда как отрицательное «не невиновного» опирается на спорное толкование. Поэтому основной текст выбирает более прямое «даже невиновного», а богословски значимое альтернативное чтение сохраняется в сноске, без утверждения развитого учения о ходатайстве.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная. Параллелизм сохранён, а неясность первой строки явно обозначена сноской.
