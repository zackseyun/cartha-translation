base_translation:
  language: en
  yaml_path: translation/ot/job/022/012.yaml
  text: Is not God in the height of heaven? And see the highest stars[b][a], how lofty they are.
translation:
  language: ru
  text: Разве Бог не на высоте небес? Взгляни, как высоко звёзды[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голова» или «верх звёзд»; возможно: «самые высокие звёзды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве… не
  rationale: Передаёт риторический вопрос, предполагающий согласие, без добавочного усиления вроде «несомненно».
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Прямой и обычный эквивалент единственного обозначения Бога; дополнительные титулы в еврейском слове отсутствуют.
- source_word: גֹּבַהּ שָׁמָיִם
  choice: в высоте небес
  rationale: Сохраняет пространственный образ и близко передаёт буквально единственное «высота» при поэтическом «небес».
- source_word: וּרְאֵה
  choice: Посмотри
  rationale: Естественно передаёт повелительную форму ראה как призыв обратить внимание; начальный союз в русском не обязателен и заменён границей предложения.
- source_word: רֹאשׁ כּוֹכָבִים
  choice: вершины звёзд
  rationale: Сохраняет образ רֹאשׁ («голова, верх, вершина») лучше, чем толковательное «самые высокие звёзды», и остаётся понятным в поэтическом контексте.
- source_word: כִּי
  choice: как
  rationale: Вводит восклицательное наблюдение о высоте звёзд, естественное для данного контекста.
- source_word: רָמּוּ
  choice: они высоки
  rationale: Передаёт физическую высоту от רום и не привносит возможного оттенка почётного возвышения, свойственного слову «возвышенны».
theological_decisions:
- issue: Следует ли передать пространственную трансцендентность Бога как утверждение о Его удалённости
  choice: Сохранить прямой риторический вопрос и пространственный образ без поясняющего вывода
  alternative: Перефразировать так, чтобы подчеркнуть удалённость Бога или скрытую критику Иова
  rationale: Это слова Елифаза; сам стих указывает на небесную высоту Бога и звёзд, но не формулирует дальнейшего богословского вывода. Перевод сохраняет напряжение речи, не развивая её аргумент за автора.
translation_notes:
  register: Современный литературный русский с сохранением поэтической возвышенности и риторической силы. «В высоте небес» намеренно оставлено как близкий к оригиналу пространственный образ; «вершины звёзд» пояснено сноской из-за необычности еврейской метафоры.
