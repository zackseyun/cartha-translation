translation:
  language: ru
  text: 'которые говорили Богу: «Уйди от нас! Что может сделать для них Всемогущий?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово буквально означает «для них»; оно сохраняет смену лица в прямой речи. По контексту возможно также понимание: «Что может сделать для нас Всемогущий?»'
    reason: Сноска отмечает формальное третье лицо множественного числа в לָמוֹ и контекстуально возможное первое лицо, не устраняя неоднозначность.
lexical_decisions:
- source_word: סוּר מִמֶּנּוּ
  choice: «Отойди от нас!»
  rationale: Императив סוּר передан прямо и естественно; מִמֶּנּוּ здесь означает «от нас».
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Традиционный и понятный русский эквивалент божественного титула Шаддай.
- source_word: יִפְעַל
  choice: может сделать
  rationale: Форма выражает действие Бога в риторическом вопросе; нейтральное «сделать» не уточняет, идёт ли речь о помощи или о воздействии/наказании.
- source_word: לָמוֹ
  choice: им
  rationale: По форме это поэтическое местоимение 3-го лица множественного числа — «им/для них»; необычность смены лица сохранена, а контекстуальная альтернатива отмечена в сноске.
theological_decisions:
- issue: К кому относится לָמוֹ и подразумевается ли благодеяние или действие против них
  choice: «Что может сделать им Всемогущий?»
  alternative: «Что может сделать для нас Всемогущий?»
  rationale: Масоретская форма буквально указывает на 3-е лицо множественного числа, поэтому основной текст сохраняет «им». Однако параллель с Иов 21:15 и рамка прямой речи позволяют понимать смысл как «для нас»; это не разрешено догматически и отражено в сноске.
translation_notes:
  register: Современный литературный русский язык; реплика звучит резко и естественно. Смена «нас» на «им» сохранена вслед за масоретским текстом, а её неоднозначность разъяснена в сноске.
