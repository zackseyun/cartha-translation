  text: которые были внезапно уничтожены не в своё время[a], у которых основание было размыто рекой[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были срезаны не в своё время». Еврейский глагол труден для толкования и может передавать мысль о том, что их схватили, они сморщились или были внезапно устранены.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «их основание было излито рекой»; вероятный смысл образа — основание было затоплено, размыто или унесено водой.'
    reason: lexical_alternative
  - marker: c
    text: Возможно, стих особо намекает на поколение, погибшее при потопе, но он может и в более общем смысле описывать внезапную гибель нечестивых.
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительное местоимение продолжает характеристику нечестивых, упомянутых в контексте, и естественно связывает стих с предыдущим.
- source_word: קֻמְּטוּ
  choice: были унесены
  rationale: Трудная пассивная форма передаёт внезапное устранение или гибель. «Были унесены» сохраняет эту силу, не закрепляя сомнительный буквальный образ сморщивания.
- source_word: וְלֹא עֵת
  choice: прежде времени
  rationale: Естественное русское выражение для безвременной, преждевременной гибели; передаёт смысл еврейского оборота без лишнего толкования.
- source_word: נָהָר
  choice: река
  rationale: Обычное значение существительного — «река». Такой перевод сохраняет конкретный водный образ, не превращая возможный намёк на потоп в явное утверждение.
- source_word: יוּצַק
  choice: было смыто
  rationale: Глагол связан с изливанием, но в сочетании с рекой и основанием сжатый образ естественно означает, что основание было размыто или унесено водой.
- source_word: יְסוֹדָם
  choice: их основание
  rationale: Существительное стоит в единственном числе с суффиксом третьего лица множественного числа; «их основание» точно и естественно сохраняет метафору крушения.
theological_decisions:
- issue: Характер образа суда
  choice: Сохранён образ преждевременной гибели нечестивых от нахлынувшей воды без уточнения, идёт ли речь о конкретном историческом событии или об общей метафоре суда.
  alternative: Понять стих исключительно как прямую ссылку на поколение, погибшее при потопе, либо исключительно как общую метафору внезапного низвержения.
  rationale: Контекст и водный образ допускают намёк на потоп, но сам еврейский текст не вынуждает выбирать только одно из этих прочтений.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет связь с предыдущим стихом. Формулировка возвышенная, но понятная, а сжатая водная метафора раскрыта лишь настолько, насколько необходимо для естественного русского выражения.
