  text: וְֽ֭/אָמַרְתָּ מַה יָּ֣דַֽע אֵ֑ל הַ/בְעַ֖ד עֲרָפֶ֣ל יִשְׁפּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/013.yaml
  text: Yet you say[b][a], ‘What does God know? Can he judge through thick darkness?’
translation:
  language: ru
  text: 'А ты говоришь: «Что знает Бог? Может ли Он судить сквозь густой мрак[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Судит ли Он сквозь густой мрак?» Еврейская форма глагола может обозначать простое настоящее или будущее действие, а в этом риторическом вопросе также может подразумевать способность.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: А ты говоришь
  rationale: Сочетание союза с формой перфекта 2-го лица мужского рода единственного числа здесь передаёт обвинительное цитирование позиции Иова; настоящее время естественно по-русски, а «А» выражает контраст с контекстом.
- source_word: מַה יָדַע אֵל
  choice: Что знает Бог?
  rationale: מַה вводит прямой вопрос о знании, יָדַע обозначает знание, а אֵל в данном контексте естественно передаётся словом «Бог».
- source_word: הַבְעַד עֲרָפֶל
  choice: сквозь густой мрак
  rationale: Предлог выражает действие через преграду, а עֲרָפֶל обозначает плотную тьму, мглу или тёмное облако; «густой мрак» сохраняет образ затруднённого видения.
- source_word: יִשְׁפּוֹט
  choice: Может ли Он судить
  rationale: Имперфект допускает простое настоящее или будущее, однако в риторическом вопросе контекстуально может подразумеваться способность; русский оборот «может ли» естественно передаёт скептический смысл, не устраняя альтернативу, отмеченную в сноске.
theological_decisions:
- issue: Передавать ли יִשְׁפּוֹט как вопрос о способности или как простое действие
  choice: «Может ли Он судить сквозь густой мрак?»
  alternative: «Судит ли Он сквозь густой мрак?» или «Будет ли Он судить сквозь густой мрак?»
  rationale: В устах Елифаза это пересказ мысли, будто мрак мешает Богу видеть и вершить суд. Вопрос о способности естественно выражает эту подразумеваемую дерзкую мысль, тогда как сноска сохраняет грамматически возможное прочтение как простого настоящего или будущего.
translation_notes:
  register: Современный литературный русский язык; реплика звучит прямо и обвинительно, но сохраняет достоинство библейской речи. Местоимение «Он» написано с прописной буквы по принятой русской библейской традиции. Лексическая вариативность עֲרָפֶל («мгла», «тёмное облако») не вынесена в отдельную сноску, чтобы не перегружать краткий стих.
