  yaml_path: translation/ot/job/022/010.yaml
  text: Therefore snares are all around you[a], and sudden terror terrifies you.
translation:
  language: ru
  text: 'Поэтому вокруг тебя — силки,

    и внезапный ужас повергает тебя в смятение.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего обвинения Елифаза.
- source_word: סְבִיבוֹתֶיךָ
  choice: вокруг тебя
  rationale: Точно и естественно передаёт пространственный образ окружающей опасности; связка восполнена тире.
- source_word: פַחִים
  choice: силки
  rationale: Поэтическое и понятное обозначение ловушек; сохраняет метафорический образ еврейского פַח.
- source_word: וִיבַהֶלְךָ
  choice: повергает тебя в смятение
  rationale: Глагол בהל означает приводить в смятение, тревогу или ужас; выбранная формулировка передаёт воздействие страха без неестественного русского повтора «ужас ужасает».
- source_word: פַּחַד
  choice: ужас
  rationale: Передаёт высокую интенсивность страха и соответствует угрожающему поэтическому контексту.
- source_word: פִּתְאֹם
  choice: внезапный
  rationale: Еврейское наречие «внезапно» естественно передано в русском определением при существительном, сохраняя идею неожиданности.
