  yaml_path: translation/ot/job/022/008.yaml
  text: But the land belonged to the strong man[b][a], and the favored man lived in it.
translation:
  language: ru
  text: А земля принадлежала сильному человеку[a], и человек, пользовавшийся благосклонностью[b], жил на ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек руки» — то есть сильный или влиятельный человек.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «почитаемый», «тот, кому оказывали предпочтение». Буквально: «поднятый лицом»; идиома может обозначать человека, которому благоволят или оказывают особое предпочтение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: А ... человеку
  rationale: Союз וְ в контексте противопоставляет участь слабых привилегированному положению сильного; русское «а» естественно передаёт этот контраст. אִישׁ обозначает мужчину или человека.
- source_word: זְרוֹעַ
  choice: сильному
  rationale: Буквально «рука»; сочетание אִישׁ זְרוֹעַ — образное обозначение сильного или влиятельного человека. В основном тексте передан смысл идиомы, а буквальный образ сохранён в примечании.
- source_word: לוֹ הָאָרֶץ
  choice: земля принадлежала ... человеку
  rationale: Конструкция с לְ и местоименным суффиксом выражает принадлежность либо фактическое владение и власть над землёй. «Принадлежала» ясно передаёт эту мысль, не уточняя способ приобретения.
- source_word: וּנְשׂוּא פָנִים
  choice: и почитаемый
  rationale: Буквально выражение связано с «поднятым лицом» и может указывать как на почёт, так и на благосклонность или пристрастное предпочтение. «Почитаемый» звучит естественно и сохраняет положительную сторону значения; прочие оттенки отмечены в сноске.
- source_word: יֵשֶׁב בָּהּ
  choice: жил на ней
  rationale: יָשַׁב может означать «сидеть, жить, обитать». Здесь речь идёт о проживании или занятии земли; «жил на ней» — современная и естественная русская формулировка.
theological_decisions:
- issue: Характер особого положения נְשׂוּא פָנִים
  choice: почитаемый
  alternative: тот, кому оказывали предпочтение; удостоенный благосклонности
  rationale: Еврейская идиома допускает как нейтральный почёт, так и пристрастное благоволение. Основной текст не объявляет это предпочтение непременно несправедливым, а сноска сохраняет смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным синтаксисом. «Земля» понимается как владение или территория; женский род местоимения «ней» сохраняет прямую связь с этим словом. Лексическая неоднозначность идиомы נְשׂוּא פָנִים вынесена в сноску.
