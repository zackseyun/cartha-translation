review_pass:
  verdict: approve
  source_fidelity: 'Перевод точно передаёт два параллельных дополнения при повелении «положи»: בָּצֶר — «золото», а אָפִיר, метонимически, — «офирское золото». «В прах» является допустимой поэтической и контекстуальной передачей עַל־עָפָר («на/в прах»), не меняя образа отказа от богатства. «Среди камней в руслах потоков» естественно раскрывает образ בְּצוּר נְחָלִים («в скале/каменистом месте вади»), не утверждая чрезмерно конкретной географии.'
