  text: וְ/שִׁית עַל עָפָ֥ר בָּ֑צֶר וּ/בְ/צ֖וּר נְחָלִ֣ים אוֹפִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/022/024.yaml
  text: and lay gold in the dust[a], and the gold of Ophir among the stones of the wadis[c][b],
translation:
  language: ru
  text: и положи золото в прах[a], и офирское золото[b] — среди камней в руслах потоков[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «положи золотую руду на землю». Еврейское слово может обозначать драгоценный металл или руду, а не только очищенное золото.'
    reason: lexical_alternative
  - marker: b
    text: Офир — местность, славившаяся высоко ценившимся золотом; в еврейском тексте здесь буквально стоит одно название «Офир».
    reason: cultural_note
  - marker: c
    text: Речь идёт о каменистых руслах потоков, которые могли быть сезонными и наполняться водой после дождей.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁית
  choice: и положи
  rationale: שׁית означает «класть, помещать, полагать»; форма сохраняет побудительный характер обращения и последовательность с предшествующим контекстом.
- source_word: עַל עָפָר
  choice: в прах
  rationale: Буквально предлог עַל обычно значит «на», однако по-русски образ отказа от ценности естественно передаётся выражением «положить в прах». Конкретный поэтический образ עָפָר сохранён.
- source_word: בָּצֶר
  choice: золото
  rationale: Редкое слово может обозначать драгоценный металл, золотую руду или необработанное золото. В параллели с Офиром основное значение ясно передано словом «золото», а лексическая широта отмечена в сноске.
- source_word: וּבְצוּר נְחָלִים
  choice: среди камней в руслах потоков
  rationale: צור буквально означает «скала, камень», а נְחָלִים — потоки, долины потоков или их русла. Выбранная формулировка естественно передаёт образ каменистых русел, не превращая их в обычные многоводные реки.
- source_word: אוֹפִיר
  choice: офирское золото
  rationale: Офир — географическое название, устойчиво связанное в библейском употреблении с высоко ценившимся золотом. Метонимия раскрыта минимально и в соответствии с поэтическим параллелизмом.
theological_decisions:
- issue: Смысл повеления в увещании Елифаза
  choice: Образ передан как призыв отказаться от упования на материальное богатство.
  alternative: Указание спрятать золото в надёжном природном месте.
  rationale: Связь со следующим стихом, где Всемогущий становится драгоценностью говорящего, поддерживает смысл отказа от золота. При этом перевод сохраняет конкретное действие «положи», не усиливая его до толковательного «выбрось».
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Сохранены оба соединительных «и» исходного текста и образ «праха»; тире облегчает восприятие параллельной второй строки. Не добавлено отсутствующее в еврейском тексте притяжательное «твоё».
