  text: You will decree a matter[a], and it will be established for you, and light will shine on your ways.
translation:
  language: ru
  text: 'Ты постановишь нечто — и это исполнится для тебя;

    и над твоими путями засияет свет.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִגְזַר
  choice: вынесешь решение
  rationale: Глагол גזר буквально связан с отсечением или разделением, а в расширенном значении — с твёрдым решением или постановлением. Русское «вынесешь решение» передаёт определённость высказывания, не приписывая Иову царской власти, которую могло бы подразумевать «издашь указ».
- source_word: אֹמֶר
  choice: решение
  rationale: Обычно слово означает «слово», «речь» или «высказывание», но в сочетании с גזר обозначает то, что твёрдо решено или провозглашено. Более буквальное прочтение сохранено в сноске.
- source_word: יָקָם
  choice: оно утвердится
  rationale: Форма от קום буквально означает «встанет» или «устоит»; применительно к решению выражает его подтверждение и действенность. «Утвердится» сохраняет результативный смысл, не усиливая его до безусловной гарантии исполнения.
- source_word: לָךְ
  choice: для тебя
  rationale: Предлог ל выражает отношение или пользу; «для тебя» прямо передаёт еврейскую конструкцию и не добавляет отсутствующего в тексте уточнения.
- source_word: דְּרָכֶיךָ
  choice: твоими путями
  rationale: דרך означает путь и метафорически жизненный ход или поведение. «Пути» сохраняют образ, связанный со светом.
- source_word: נָגַהּ אֹור
  choice: засияет свет
  rationale: Глагол נגה означает «сиять, светиться». Инверсия «засияет свет» естественна для русской поэтической речи и сохраняет образ внезапного освещения пути.
theological_decisions:
- issue: Характер обещания в речи Елифаза
  choice: Передать как уверенное утверждение ожидаемого результата, произнесённое Елифазом.
  alternative: Усилить до безусловного Божьего обещания благополучия либо ослабить до простой возможности.
  rationale: Стих передаёт богословское рассуждение Елифаза, а не обязательно окончательную позицию книги. Поэтому перевод сохраняет уверенность его слов, но не добавляет им силы универсальной или безусловной гарантии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Параллелизм двух строк и метафора света сохранены; архаизмы и канцелярское «издашь указ» исключены.
