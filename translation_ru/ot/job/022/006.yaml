base_translation:
  language: en
  yaml_path: translation/ot/job/022/006.yaml
  text: For you took pledges from your brothers for no reason[b][a], and stripped the clothing from the naked.
translation:
  language: ru
  text: Ведь ты без причины брал залог у своих братьев[a] и срывал одежду с нагих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «братья» может означать не только родных братьев, но и соплеменников или других членов общины.
    reason: cultural_note
  - marker: b
    text: 'Или: «с плохо одетых». Еврейское слово может обозначать как нагих, так и тех, кому не хватает одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит обоснование предыдущего обвинения; «ведь» естественно передаёт пояснительно-причинную связь в русском контексте.
- source_word: תַחְבֹּל
  choice: ты брал залог
  rationale: Глагол חבל здесь обозначает взятие имущества в залог по долгу. Несовершенный вид уместно передаёт приписываемое Иову поведение, а не обязательно единичный поступок.
- source_word: אַחֶיךָ
  choice: у своих братьев
  rationale: Сохранено буквальное «братья»; в данном социальном контексте слово может обозначать не только родных братьев, но и соплеменников или членов общины.
- source_word: חִנָּם
  choice: без причины
  rationale: Передаёт обвинение в необоснованном, несправедливом изъятии залога; возможен также оттенок «даром» или «ни за что».
- source_word: וּבִגְדֵי
  choice: и ... одежду
  rationale: Собирательное «одежду» естественно по-русски передаёт множественное בִגְדֵי в сочетании с глаголом снятия.
- source_word: עֲרוּמִּים
  choice: с нагих
  rationale: 'Сохраняет резкий парадокс еврейского текста: одежду снимают с тех, кто назван нагими; слово может также означать недостаточно одетых.'
- source_word: תַּפְשִׁיט
  choice: снимал
  rationale: Hiphil от פשט означает снимать с кого-либо одежду, раздевать. «Снимал одежду с» точно и естественно передаёт конструкцию.
