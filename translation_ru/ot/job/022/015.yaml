lexical_decisions:
- source_word: הָאֹרַח
  choice: пути
  rationale: Слово אֹרַח обозначает путь или стезю и часто служит метафорой образа жизни; «путь» естественно сохраняет этот образ по-русски.
- source_word: עוֹלָם
  choice: древнего
  rationale: В данном сочетании עוֹלָם указывает на путь, существующий с давних времён, а не обязательно вечный в богословском смысле.
- source_word: תִּשְׁמֹר
  choice: будешь держаться
  rationale: Глагол שׁמר буквально значит «хранить, соблюдать»; при дополнении «путь» речь идёт о следовании определённому образу жизни. «Держаться пути» передаёт эту идиому естественно.
- source_word: אֲשֶׁר
  choice: которым
  rationale: Относительное местоимение вводит придаточное, характеризующее путь; творительный падеж естественен с русским глаголом движения.
- source_word: דָּרְכוּ
  choice: ступали
  rationale: Глагол דרך означает «ступать, попирать, идти». «Ступали» сохраняет конкретный образ протоптанного пути и подходит к многократному действию в прошлом.
- source_word: מְתֵי אָוֶן
  choice: люди беззакония
  rationale: מְתֵי — сопряжённая форма со значением «люди», а אָוֶן может означать зло, беззаконие, беду или обман. В контексте нравственного осуждения «люди беззакония» сохраняет буквальную структуру и моральную силу выражения.
