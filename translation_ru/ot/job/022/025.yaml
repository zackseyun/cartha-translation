  text: тогда Всемогущий станет для тебя золотом[a] и серебром высшей пробы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тогда Всемогущий будет твоим сокровищем, а серебра у тебя будет в изобилии». Еврейские слова, переданные как «золото» и «высшей пробы», трудны для понимания; возможно, образ говорит не о Боге как о сокровище, а о богатстве, которое Он даёт.'
