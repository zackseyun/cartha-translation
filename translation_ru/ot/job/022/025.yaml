lexical_decisions:
- source_word: וְהָיָה
  choice: тогда ... будет
  rationale: 'В контексте увещевания Елифаза сочетание союза с перфектом выражает следствие: если Иов возвратится к Богу, тогда последует этот результат.'
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Устоявшаяся смысловая передача божественного титула Шаддай в книге Иова.
- source_word: בְּצָרֶיךָ
  choice: твоим золотом
  rationale: Редкое существительное может обозначать драгоценный металл или руду; в поэтическом параллелизме с серебром естественно передать его как «золото», сохранив образ Бога как истинного богатства.
- source_word: וְכֶסֶף
  choice: и ... серебром
  rationale: Сохраняется второй член поэтического параллелизма; связка «будет» подразумевается из первой строки.
- source_word: תּוֹעָפוֹת
  choice: отборным
  rationale: Значение редкого слова не вполне ясно; в сочетании с серебром оно, вероятно, указывает на особую ценность, качество или изобилие. «Отборным» звучит естественно и не перегружает перевод.
- source_word: לָךְ
  choice: для тебя
  rationale: Явно передаёт дательный оттенок личной принадлежности или пользы.
theological_decisions:
- issue: Смысл обещания в речи Елифаза
  choice: В основном тексте Всемогущий представлен как истинное золото Иова.
  alternative: Всемогущий даст Иову золото и серебро в изобилии.
  rationale: Еврейский синтаксис и поэтическая структура допускают как отождествление Бога с истинным сокровищем, так и обещание дарованного Богом материального богатства. Основной текст сохраняет более прямую метафору, а иной смысл отмечен в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык; поэтическая краткость и достоинство сохранены. Неоднозначность редкой лексики вынесена в сноску.
