  yaml_path: translation/ot/job/036/004.yaml
  text: For truly[a], my words are not false; one perfect in knowledge is with you.
translation:
  language: ru
  text: Ведь мои слова воистину не ложь; с тобой — тот, кто совершенен в знании.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, здесь говорится о Боге, а не о самом Елиуе.
    reason: Альтернативное понимание подразумеваемого лица в выражении תְּמִים דֵּעוֹת.
lexical_decisions:
- source_word: כִּי אָמְנָם
  choice: Ведь… поистине
  rationale: כִּי связывает утверждение с предыдущей речью Елиуя, а אָמְנָם усиливает его заверение. Раздельная передача сохраняет обе функции и естественно звучит по-русски.
- source_word: לֹא שֶׁקֶר מִלָּי
  choice: мои слова — … не ложь
  rationale: Именная конструкция прямо отрицает ложность слов Елиуя. Такая формулировка сохраняет выразительность оригинала и подходит для современного литературного русского.
- source_word: תְּמִים דֵּעוֹת
  choice: совершенный в знании
  rationale: תְּמִים обозначает полноту, цельность или безупречность, а множественное דֵּעוֹת здесь естественно передаётся русским отвлечённым существительным в единственном числе. «Совершенный» сохраняет риторическую смелость и неоднозначность выражения.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Прямая передача предлога עִם с суффиксом второго лица; обращение относится к Иову.
theological_decisions:
- issue: К кому относится выражение «совершенный в знании»
  choice: Основной текст допускает самохарактеристику Елиуя
  alternative: Выражение может относиться к Богу, находящемуся с Иовом
  rationale: Непосредственный контекст — защита Елиуем истинности собственных слов — поддерживает самореференцию, однако отсутствие явного подлежащего оставляет грамматическую и богословскую неоднозначность, которую следует сохранить.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи; краткая именная конструкция и тире сохраняют афористичность и напряжённость еврейского оригинала.
