  edition: WLC
  text: לֹֽא יִגְרַ֥ע מִ/צַּדִּ֗יק עֵ֫ינָ֥י/ו וְ/אֶת מְלָכִ֥ים לַ/כִּסֵּ֑א וַ/יֹּשִׁיבֵ֥/ם לָ֝/נֶ֗צַח וַ/יִּגְבָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/007.yaml
  text: He does not withdraw his eyes from the righteous[a], but with kings on the throne he seats them forever[b], and they are exalted.
translation:
  language: ru
  text: Он не отводит глаз от праведных, но навеки усаживает их с царями на престоле[a], и они возвышаются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а царей усаживает на престоле навеки». Еврейская фраза сжата, и её можно понимать как прямое высказывание о царях, а не о праведных, посаженных вместе с царями.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «и Он возвышает их». Последний глагол можно понимать активно, считая Бога подразумеваемым подлежащим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִגְרַע
  choice: не отводит
  rationale: Глагол גרע означает «уменьшать, отнимать, удалять»; в сочетании с «глазами» русское «не отводит глаз» естественно передаёт непрестанное внимание, сохраняя образ оригинала.
- source_word: מִצַּדִּיק
  choice: от праведных
  rationale: Форма единственного числа употреблена обобщённо; множественное «праведных» естественно выражает собирательный смысл и согласуется с последующим местоимением «их».
- source_word: עֵינָיו
  choice: глаз
  rationale: Сохраняется конкретный антропоморфный образ глаз, а не заменяется отвлечёнными словами «забота» или «внимание»; принадлежность ясна из подлежащего «Он».
- source_word: וְאֶת מְלָכִים לַכִּסֵּא
  choice: с царями на престоле
  rationale: Сжатая еврейская конструкция допускает понимание праведных как посаженных вместе с царями, но также может относить дальнейшее действие непосредственно к царям; основной текст следует первому синтаксическому прочтению, а альтернативу отмечает сноска.
- source_word: וַיֹּשִׁיבֵם
  choice: усаживает их
  rationale: Каузативная форма от ישׁב значит «сажать, давать сидеть». «Усаживает» передаёт это непосредственно, не усиливая смысл до однозначного «возводит на престол».
- source_word: לָנֶצַח
  choice: навеки
  rationale: לָנֶצַח обозначает неограниченную, устойчивую длительность; «навеки» естественно для возвышенной поэтической речи.
- source_word: וַיִּגְבָּהוּ
  choice: они возвышаются
  rationale: Краткая форма допускает неоднозначность в определении залога и субъекта. Возвратная конструкция передаёт результирующее возвышение праведных, не исключая действия Бога.
theological_decisions:
- issue: Антропоморфное описание Божьего внимания
  choice: Сохранить образ «не отводит глаз».
  alternative: 'Передать отвлечённо: «не перестаёт заботиться» или «не лишает внимания».'
  rationale: Конкретный образ соответствует еврейскому тексту и не сводит поэтическое выражение к богословскому толкованию.
- issue: К кому относится местоимение «их» в царской части стиха
  choice: Понимать его как относящееся к праведным, которых Бог усаживает с царями.
  alternative: Понимать объектом царей, которых Бог навеки усаживает на престоле.
  rationale: Обобщённое «праведный» естественно служит предшествующим референтом множественного местоимения, однако сжатый еврейский синтаксис допускает и прочтение о царях, поэтому оно сохранено в сноске.
- issue: Субъект последнего глагола
  choice: 'Передать результат: «они возвышаются».'
  alternative: 'Передать Бога подразумеваемым субъектом: «Он возвышает их».'
  rationale: Еврейская форма и предельно краткий контекст позволяют оба понимания; основной вариант не делает активное прочтение единственно возможным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены конкретный образ глаз, лаконичность стиха и существенные синтаксические неоднозначности; архаизмы и конфессионально окрашенные уточнения не вводятся.
