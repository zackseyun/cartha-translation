  yaml_path: translation/ot/job/036/027.yaml
  text: For he draws up the drops of water[a]; they distill rain from his mist.
translation:
  language: ru
  text: Ибо Он поднимает капли воды[a]; они проливаются дождём из Его тумана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он отнимает капли воды». Еврейский текст второй строки труден: глагол может означать «цедить, перегонять» или «изливать», а связь дождя с «Его туманом/испарением» понимается по-разному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с контекстом и естественно звучит в русской поэтической речи.
- source_word: יְגָרַע
  choice: собирает
  rationale: Основное значение связано с убавлением или изъятием; в метеорологическом контексте речь, вероятно, о собирании капель воды. Выбор сохраняет образ, не вводя прямо современное представление о подъёме воды.
- source_word: נִטְפֵי מָיִם
  choice: капли воды
  rationale: Прямое и естественное соответствие еврейскому сочетанию.
- source_word: יָזֹקּוּ
  choice: изливаются
  rationale: Передаёт возможный смысл истечения или излияния дождя, не закрепляя спорное значение «перегоняются».
- source_word: מָטָר
  choice: дождём
  rationale: Обычное русское соответствие; творительный падеж естественно связывает существительное с глаголом «изливаются».
- source_word: לְאֵדוֹ
  choice: из Его пара
  rationale: אֵד означает пар или туман; «пар» хорошо соответствует метеорологическому образу. Предлог לְ здесь труден, поэтому исходное отношение передано как источник; суффикс мужского рода единственного числа сохранён как указание на Бога.
theological_decisions:
- issue: К кому относится суффикс 3-го лица мужского рода в לְאֵדוֹ
  choice: '«Его пара»: суффикс относится к Богу.'
  alternative: Безличное «из пара» или понимание как «из их испарения».
  rationale: В ближайшем контексте действующее лицо — Бог, управляющий явлениями природы. При этом перевод не добавляет объяснения механизма дождя сверх сказанного в стихе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией. Трудность еврейской строки и смысловая неоднозначность вынесены в сноску.
