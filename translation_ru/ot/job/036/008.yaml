lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет и соединительную силу וְ, и условное значение אִם, естественно продолжая речь Елиуя.
- source_word: אֲסוּרִים
  choice: они скованы
  rationale: Передаёт пассивное значение причастия от אסר («связывать, сковывать») и согласуется с образом физических оков.
- source_word: בַּזִּקִּים
  choice: цепями
  rationale: Ясно и современно передаёт обозначение оков; форма творительного падежа естественна при русском «скованы».
- source_word: יִלָּכְדוּן
  choice: схвачены
  rationale: Сохраняет пассивное значение нифаля от לכד («быть пойманным, захваченным»), не уточняя сверх текста, кем именно они схвачены.
- source_word: בְּחַבְלֵי
  choice: узами
  rationale: Передаёт образ связывающих верёвок или пут и создаёт естественную по-русски метафору, параллельную цепям.
- source_word: עֹנִי
  choice: страдания
  rationale: В данном контексте охватывает бедствие и мучение, не сужая значение исключительно до материальной бедности.
theological_decisions:
- issue: Характер образности
  choice: Сохранить конкретные образы цепей и уз, допускающие метафорическое значение страдания или Божьего вразумления.
  alternative: Истолковать выражения только как буквальное заключение либо только как отвлечённое несчастье.
  rationale: Еврейский текст использует конкретную лексику связывания, тогда как контекст речи Елиуя допускает её переносное применение; перевод не устраняет эту напряжённость.
