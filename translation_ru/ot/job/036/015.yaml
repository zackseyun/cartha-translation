  text: He rescues the afflicted by their affliction[b][a], and opens their ears by oppression.
translation:
  language: ru
  text: Он избавляет страдающих в их страдании[a] и открывает им уши в бедствии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавляет бедных в их страдании». Еврейские слова могут указывать на бедность, страдание или угнетение; предлог допускает значения «в» и «через».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обнажает (открывает) им уши» — еврейское выражение о том, что людей побуждают услышать или принять наставление.'
    reason: cultural_note
lexical_decisions:
- source_word: יְחַלֵּץ
  choice: избавляет
  rationale: Пиэль от חלץ означает вызволять или избавлять от беды; «избавляет» естественно и ясно передаёт активное спасительное действие.
- source_word: עָנִי
  choice: страдающего
  rationale: עָנִי может обозначать бедного, угнетённого или несчастного. Параллель с «страданием» и «теснотой» здесь поддерживает более широкое значение — человека, терпящего страдание.
- source_word: בְעָנְיוֹ
  choice: через его страдание
  rationale: Предлог ב допускает обстоятельственное и инструментальное понимание. «Через» сохраняет вероятную мысль о страдании как средстве избавления, не устраняя альтернативу «в страдании», отмеченную в сноске.
- source_word: וְיִגֶל
  choice: открывает
  rationale: Буквально глагол означает «обнажает, открывает»; в сочетании с «ушами» это идиома, означающая побуждение услышать или принять наставление.
- source_word: בַּלַּחַץ
  choice: в тесноте
  rationale: לַחַץ охватывает давление, притеснение и бедствие. «В тесноте» сохраняет образ стеснённых обстоятельств и позволяет не утверждать однозначно лишь инструментальную функцию предлога.
- source_word: אָזְנָם
  choice: им уши
  rationale: Масоретская форма имеет суффикс третьего лица множественного числа. Русская конструкция «открывает им уши» естественно сохраняет это число, несмотря на собирательное единственное «страдающего» в первой строке.
theological_decisions:
- issue: Страдание как средство избавления и наставления
  choice: Первая половина передаёт инструментальный оттенок («через его страдание»), а вторая сохраняет более открытую формулировку («в тесноте»).
  alternative: «Избавляет бедного в его страдании и через притеснение открывает им уши».
  rationale: Два оборота с ב могут означать как средство, так и обстоятельства. Контекст речи Елиуя допускает мысль о Божьем наставлении через страдание, но перевод не должен превращать её в общее утверждение, будто всякое страдание само по себе благо или всегда является наказанием.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены резкая связь избавления со страданием, смена собирательного единственного числа на множественное в еврейском тексте и идиома «открывать уши»; неоднозначность предлога пояснена в сноске.
