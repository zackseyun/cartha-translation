  text: He covers his hands with lightning[b][a], and commands it to strike the mark.
translation:
  language: ru
  text: Он покрывает Свои ладони молнией[a] и велит ей поразить цель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свет»; в контексте окружающего описания грозы, вероятно, имеется в виду молния.'
    reason: lexical_alternative
  - marker: b
    text: 'Последняя фраза на еврейском языке трудна для понимания. Возможны также переводы: «против того, кого она поражает» или «против заступника».'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּפַּיִם
  choice: Свои ладони
  rationale: Двойственное число от כַּף обычно обозначает ладони или руки. «Ладони» сохраняет конкретный телесный образ еврейской поэзии, а возвратное «Свои» естественно указывает на принадлежность подлежащему.
- source_word: כִּסָּה
  choice: покрывает
  rationale: Глагол כסה означает «покрывать, скрывать». «Покрывает» сохраняет наглядность образа и не усложняет метафору.
- source_word: אוֹר
  choice: молнией
  rationale: Основное значение слова — «свет», однако в окружающем описании грозы оно, вероятнее всего, обозначает молнию. Творительный падеж естественно передаёт конструкцию как покрытие ладоней молнией.
- source_word: וַיְצַו
  choice: велит
  rationale: Глагол צוה означает «приказывать, повелевать». «Велит» естественно звучит по-русски и сохраняет личное управление стихией со стороны Бога.
- source_word: עָלֶיהָ
  choice: ей
  rationale: Женский местоименный суффикс передан местоимением, относящимся к «молнии», существительному женского рода. Синтаксическая связь в еврейском тексте остаётся трудной.
- source_word: בְמַפְגִּיעַ
  choice: поразить цель
  rationale: Форма от פגע допускает значения, связанные с попаданием, нападением или заступничеством. В грозовом контексте выражение, вероятно, описывает направление молнии к месту удара; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Неоднозначность בְמַפְגִּיעַ
  choice: Передать в основном тексте как направление молнии к цели, сохранив альтернативы в сноске.
  alternative: «против того, кого она поражает» или «против заступника»
  rationale: Грозовой контекст поддерживает образ молнии, направленной к цели, но еврейская форма трудна и может быть понята иначе. В частности, значение «заступник» не следует ни вводить как несомненное, ни скрывать как лексически возможное.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Прописная буква в «Свои» указывает на Бога по принятой русской библейской традиции, не добавляя в текст отдельного имени. Сноски расположены непосредственно после слов и выражений, к которым относятся.
