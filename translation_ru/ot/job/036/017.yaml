  - marker: b
    text: 'Или: «поддерживают тебя»; возможно также: «схватят тебя». Еврейский глагол может означать «поддерживать», «удерживать» или «хватать», а дополнение в тексте прямо не выражено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִין רָשָׁע
  choice: Но ты исполнен суда над нечестивым
  rationale: Союз וְ в контексте передан противительным «но». Сжатое сочетание דִּין רָשָׁע допускает понимание как суда, относящегося к нечестивому; формулировка сохраняет судебную лексику и не уточняет без необходимости, идёт ли речь о приговоре нечестивому или о характерном для него суде.
- source_word: מָלֵאתָ
  choice: ты исполнен
  rationale: Перфект 2-го лица мужского рода описывает состояние Иова. «Исполнен» сохраняет образ наполненности и соответствует достоинству поэтической речи.
- source_word: דִּין וּמִשְׁפָּט
  choice: суд и правосудие
  rationale: 'Различение двух близких судебных терминов сохраняет параллелизм: דִּין передано как «суд», а מִשְׁפָּט — как «правосудие».'
- source_word: יִתְמֹכוּ
  choice: держат тебя
  rationale: Глагол תמך может означать поддерживать, удерживать или хватать. «Держат тебя» естественно по-русски и сохраняет двусмысленность между поддержкой и властным удержанием; объект восстановлен из обращения к Иову.
theological_decisions:
- issue: Отнесение выражения דִּין רָשָׁע
  choice: «суд над нечестивым»
  alternative: «суд нечестивого» / «суждения, свойственного нечестивому»
  rationale: Еврейское выражение сжато и допускает как объективное, так и субъективное отношение. Основной текст использует естественное русское прочтение, а альтернативы отмечены в сноске без догматического разрешения.
- issue: Смысл и объект יִתְמֹכוּ
  choice: «держат тебя»
  alternative: '«поддерживают тебя» / «схватили тебя» / без выраженного объекта: «держатся твёрдо»'
  rationale: Форма 3-го лица множественного числа не содержит явного объекта, а значение глагола охватывает поддержку и удержание. Выбранная формулировка сохраняет напряжение между благоприятным и карательным оттенками.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной судебно-поэтической лексикой. Повтор «суд» сохранён; синтаксис остаётся сжатым в соответствии с еврейским стихом.
