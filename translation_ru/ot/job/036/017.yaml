  text: Но ты исполнен судом нечестивого[a]; суд и правосудие держат тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты исполнен судом над нечестивым». Еврейское выражение сжато и может относиться либо к суду над нечестивым, либо к суду или суждению, свойственному нечестивому.'
