  text: הִ֭שָּׁמֶר אַל תֵּ֣פֶן אֶל אָ֑וֶן כִּֽי עַל זֶ֝֗ה בָּחַ֥רְתָּ מֵ/עֹֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/021.yaml
  text: Take care[a]; do not turn to iniquity[b], for you have chosen this rather than affliction.
translation:
  language: ru
  text: 'Берегись: не обращайся к беззаконию[a], ведь ты предпочёл его страданию[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к злу», «к нечестию»; еврейское слово אָוֶן иногда также означает беду или несчастье.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выбрал его вместо страдания»; עֹנִי может также означать «бедствие», «несчастье» или «нищету».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: Берегись
  rationale: Возвратный императив передаёт предостережение кратко, естественно и с надлежащей настойчивостью.
- source_word: אַל תֵּפֶן
  choice: не обращайся
  rationale: Сочетание запрета с глаголом «поворачиваться, обращаться» естественно передаётся по-русски как запрет направлять себя к чему-либо.
- source_word: אֶל אָוֶן
  choice: к беззаконию
  rationale: В данном нравственном увещании אָוֶן вероятнее всего обозначает зло или неправедность; «беззаконие» сохраняет этический смысл, не сводя слово к беде или несчастью.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание предостережения; «ведь» естественно выражает эту пояснительную связь в современном русском языке.
- source_word: עַל זֶה
  choice: его
  rationale: Местоимение естественно отсылает к только что названному беззаконию. В русском буквальное «это» здесь звучало бы менее плавно; смысл указательного выражения сохраняется.
- source_word: בָּחַרְתָּ
  choice: ты предпочёл
  rationale: В сочетании со сравнительным מִן глагол выбора по-русски естественно передаётся как «предпочёл», что ясно выражает выбор одного вместо другого.
- source_word: מֵעֹנִי
  choice: страданию
  rationale: 'עֹנִי в контексте Иова означает бедствие или страдание, а приставка מ־ выражает сравнение: беззаконие предпочитается страданию.'
theological_decisions:
- issue: Утверждает ли Елиуй, что Иов уже окончательно избрал беззаконие?
  choice: Сохранена форма прямого утверждения «ты предпочёл», относящаяся к обвинению Елиуя.
  alternative: 'Смягчить до предупреждения: «не предпочитай его страданию».'
  rationale: Еврейский перфект בָּחַרְתָּ имеет форму совершившегося выбора. Перевод не должен ни смягчать слова Елиуя, ни превращать его оценку в безусловный авторский приговор Иову.
translation_notes:
  register: Современный литературный русский язык; краткое «Берегись» сохраняет торжественную серьёзность увещания без архаизации. Двоеточие подчёркивает содержание предостережения. Местоимение «его» согласовано с «беззаконием» и делает связь естественной для русского читателя.
