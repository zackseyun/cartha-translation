base_translation:
  language: en
  yaml_path: translation/ot/job/036/003.yaml
  text: I will bring my knowledge from afar[b][a], and to my Maker I will ascribe righteousness.
translation:
  language: ru
  text: Я принесу своё знание издалека и припишу праведность моему Творцу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «припишу моему Творцу справедливость»; то есть: «признаю правоту моего Творца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: принесу
  rationale: Глагол נשׂא буквально означает «поднимать, нести». При дополнении «моё знание» и обороте «издалека» естественно передаёт мысль о знании, которое говорящий почерпнёт и представит.
- source_word: דֵעִי
  choice: своё знание
  rationale: Прямо передаёт значение существительного от דעת — «знание, понимание»; возвратное местоимение естественно по-русски соотносит принадлежность знания с подлежащим.
- source_word: לְמֵרָחוֹק
  choice: издалека
  rationale: В сочетании с נשׂא предлог выражает удалённый источник знания. «Издалека» кратко и естественно сохраняет пространственную метафору.
- source_word: וּלְפֹעֲלִי
  choice: моему Создателю
  rationale: Причастие פֹעֵל означает «делающий, создающий», а суффикс первого лица — «мой». В контексте речь о Боге как о том, кто создал говорящего.
- source_word: אֶתֵּן
  choice: воздам
  rationale: נתן буквально означает «дать». С косвенным дополнением «моему Создателю» и объектом «праведность» русское «воздам» сохраняет образ отдачи и выражает признание принадлежащего Богу качества.
- source_word: צֶדֶק
  choice: праведность
  rationale: צדק охватывает праведность, справедливость и правоту. «Праведность» сохраняет широкую нравственную характеристику Бога, а значимая судебная альтернатива вынесена в сноску.
theological_decisions:
- issue: Значение צֶדֶק применительно к Богу
  choice: праведность
  alternative: справедливость
  rationale: Еврейское слово может обозначать как нравственную праведность, так и справедливость. Основной текст сохраняет более широкую характеристику Бога, а судебный оттенок представлен в сноске без устранения смыслового напряжения.
- issue: Сила выражения אֶתֵּן צֶדֶק
  choice: воздам … праведность
  alternative: признаю … праведным / припишу … праведность
  rationale: Буквальная конструкция говорит о «даровании» праведности Создателю, то есть о её признании за Ним. «Воздам» сохраняет метафору исходника и не превращает фразу лишь в отвлечённое суждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но понятным библейским звучанием. Синтаксис близок к еврейскому оригиналу; пространственная метафора и неоднозначность צדק сохранены.
