base_translation:
  language: en
  yaml_path: translation/ot/job/036/024.yaml
  text: Remember that you should magnify his work[a], of which men have sung.
translation:
  language: ru
  text: Помни, что тебе следует возвеличивать его дело[a], о котором пели люди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которое люди видели»; или: «которое люди созерцали». Еврейский глагол שֹׁרְרוּ труден для истолкования: его можно связывать не только с пением, но и со зрением или созерцанием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Помни
  rationale: Повелительная форма мужского рода единственного числа от זכר; прямой и естественный призыв помнить.
- source_word: כִּי
  choice: что
  rationale: В данном контексте вводит содержание того, что следует помнить, а не причинное придаточное.
- source_word: תַשְׂגִּיא
  choice: тебе следует возвеличивать
  rationale: Порода hифиль от שׂגא/שׂגה передаёт побуждение считать великим, возвеличивать или прославлять. Конструкция «тебе следует» естественно выражает увещательный оттенок после «помни».
- source_word: פָעֳלוֹ
  choice: его дело
  rationale: Слово פֹּעַל обозначает дело, труд или деяние. Единственное число и местоименный суффикс сохранены без смыслового сужения.
- source_word: אֲשֶׁר
  choice: о котором
  rationale: Относительное местоимение связывает «его дело» с последующим высказыванием; предлог «о» необходим при естественном русском выражении «петь о чём-либо».
- source_word: שֹׁרְרוּ
  choice: пели
  rationale: Традиционно трудную форму понимают как относящуюся к пению или воспеванию. Более буквальные альтернативы, связанные со зрением и созерцанием, отмечены в сноске.
- source_word: אֲנָשִׁים
  choice: люди
  rationale: Современное русское «люди» естественно передаёт множественное אֲנָשִׁים в обобщённом значении; вариант «мужи» был бы неоправданно архаичным и мог бы сузить смысл.
theological_decisions:
- issue: К кому относится суффикс третьего лица в פָעֳלוֹ («его дело»)
  choice: Сохранено местоимение «его»; из контекста речь идёт о деле Бога
  alternative: Явно сказать «дело Бога»
  rationale: Контекст указывает на Бога, но еврейский текст употребляет местоименный суффикс. Сохранение местоимения точнее передаёт форму источника и не добавляет отсутствующего существительного.
- issue: Трудная форма שֹׁרְרוּ
  choice: «пели» в основном тексте
  alternative: «видели» или «созерцали»
  rationale: Традиционное понимание как пения хорошо соответствует поэтическому контексту, однако лексическая неопределённость реальна и потому сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Возвеличивать» сохраняет возвышенный оттенок без архаизма; «люди» предпочтено архаическому «мужи». Божественное местоимение дано со строчной буквы в соответствии с обычной современной русской орфографией и формой исходного текста.
