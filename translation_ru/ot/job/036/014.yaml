  text: תָּמֹ֣ת בַּ/נֹּ֣עַר נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם בַּ/קְּדֵשִֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/014.yaml
  text: They die in youth[a], and their life ends among the male cult prostitutes.
translation:
  language: ru
  text: Они умирают молодыми, и жизнь их заканчивается среди мужчин, занимавшихся культовой проституцией[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди посвящённых». Вероятнее всего, еврейское слово обозначает мужчин, связанных с культовой проституцией при языческих святилищах.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּמֹת
  choice: умирают
  rationale: 'Форма глагола מות согласуется с נַפְשָׁם («их жизнь/душа»), но по-русски естественнее передать всю конструкцию личным множественным числом: «они умирают».'
- source_word: בַּנֹּעַר
  choice: молодыми
  rationale: נֹעַר обозначает юность, ранние годы жизни. «Умирают молодыми» естественно и точно передаёт обстоятельственный смысл.
- source_word: נַפְשָׁם
  choice: они
  rationale: נֶפֶשׁ здесь означает жизнь или самого человека как живое существо. Буквальное «их душа умирает» в современном русском звучало бы неестественно и вносило бы лишний антропологический оттенок.
- source_word: וְחַיָּתָם
  choice: и жизнь их обрывается
  rationale: Существительное обозначает их жизнь; сказуемое во второй параллельной строке подразумевается из первой. «Обрывается» восполняет его по-русски, не меняя смысла внезапно или преждевременно закончившейся жизни.
- source_word: בַּקְּדֵשִׁים
  choice: среди мужчин, занимавшихся культовой проституцией
  rationale: Множественное число от קָדֵשׁ, вероятнее всего, обозначает мужчин, связанных с сексуальными обрядами языческого культа. Описательная передача точнее и понятнее современному читателю, чем архаичное «храмовые блудники».
theological_decisions:
- issue: Значение קְדֵשִׁים
  choice: мужчины, занимавшиеся культовой проституцией
  alternative: посвящённые
  rationale: Употребление קָדֵשׁ в еврейской Библии и отрицательный контекст указывают на мужчин, связанных с культовой проституцией. Вместе с тем буквальная связь слова с идеей посвящения сохраняется в сноске как подлинная лексическая неоднозначность.
translation_notes:
  register: Современный литературный русский язык; формулировка dignified и понятная, без архаизма «блудники» и без традиционного, но лексически неточного наименования «содомиты».
