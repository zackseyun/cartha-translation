  yaml_path: translation/ot/job/036/023.yaml
  text: Who has appointed his way for him? Or who has said[b][a], ‘You have done wrong’?”
translation:
  language: ru
  text: 'Кто предписал Ему Его путь[a]? И кто сказал: «Ты совершил несправедливость[b]»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто назначил Ему Его путь?» Возможен также смысл: «Кто призвал Его к ответу за Его путь?» Еврейский глагол может означать назначать, предписывать, поручать или вменять в ответственность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты совершил неправду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: кто
  rationale: Вопросительное местоимение вводит риторический вопрос.
- source_word: פָקַד
  choice: предписал
  rationale: 'Глагол имеет широкий диапазон значений: назначать, поручать, предписывать, взыскивать, надзирать. В сочетании с «Его путь» здесь естественно передаёт мысль о том, что никто не определяет Богу образ действий.'
- source_word: עָלָיו
  choice: Ему
  rationale: Предлог עַל при פקד допускает значение назначения или возложения на кого-либо; дательный падеж создаёт естественную русскую конструкцию с глаголом «предписать».
- source_word: דַּרְכּוֹ
  choice: Его путь
  rationale: Сохраняет как буквальный образ пути, так и переносное значение образа действий.
- source_word: וּמִי
  choice: И кто
  rationale: Союз связывает два параллельных риторических вопроса; русское «и» точно и естественно сохраняет эту связь.
- source_word: אָמַר
  choice: сказал
  rationale: 'Форма перфекта передана прошедшим временем в общем риторическом вопросе: кто когда-либо мог предъявить такое обвинение.'
- source_word: פָּעַלְתָּ
  choice: Ты совершил
  rationale: В сочетании с существительным עַוְלָה глагол естественно передаётся русским «совершить».
- source_word: עַוְלָה
  choice: несправедливость
  rationale: Слово обозначает несправедливость, неправду или зло. «Несправедливость» сохраняет существительную форму и хорошо соответствует контексту Божьего правосудия.
theological_decisions:
- issue: К кому относятся местоименные суффиксы мужского рода и форма второго лица
  choice: 'Стих говорит о Боге: никто не предписывает Ему путь и никто не вправе обвинить Его в несправедливости.'
  alternative: Обобщённое высказывание о могущественном правителе или человеке.
  rationale: Контекст Иов 36:22–23 прославляет величие и справедливость Бога. Прописные местоимения в русском тексте ясно указывают на контекстуальный референт, не добавляя имени, отсутствующего в данном стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка сохраняет параллелизм двух риторических вопросов и лексическую неоднозначность פקד и עַוְלָה в сносках.
