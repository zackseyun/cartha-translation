  yaml_path: translation/ot/job/036/002.yaml
  text: Bear with me a little, and I will show you, for there are still words for God.
translation:
  language: ru
  text: Дай мне ещё немного времени, и я ещё покажу тебе, ведь у меня есть слова ради Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ибо ещё для Бога слова». Возможны переводы: «ещё есть слова в пользу (в защиту) Бога» или, в более широком смысле, «ещё есть что сказать о Боге».'
    reason: Еврейская конструкция לֶאֱלוֹהַּ מִלִּים кратка; предлог לְ допускает разные способы передачи в русском, хотя прежде всего указывает на направленность слов к пользе Бога.
lexical_decisions:
- source_word: כַּתַּר לִי זְעֵיר
  choice: Потерпи меня ещё немного
  rationale: Идиома означает просьбу немного подождать или проявить терпение к говорящему; по-русски естественно передаётся личной конструкцией «потерпи меня».
- source_word: וַאֲחַוֶּךָּ
  choice: и я объясню тебе
  rationale: Глагол חוה здесь означает сообщить, изложить или разъяснить; «объясню» естественно продолжает просьбу выслушать довод.
- source_word: כִּי עוֹד לֶאֱלוֹהַּ מִלִּים
  choice: ведь мне ещё есть что сказать о Боге
  rationale: 'Буквально: «ибо ещё для Бога слова». Русская формулировка сохраняет смысл дальнейших слов, относящихся к Богу, не навязывая более узкое «в защиту Бога».'
theological_decisions:
- issue: 'Значение לֶאֱלוֹהַּ: слова «для Бога», «о Боге» или «от имени Бога»'
  choice: о Боге
  alternative: в защиту Бога / от имени Бога
  rationale: Предлог ל допускает неоднозначность. Контекст речи Елиуя позволяет понимать слова как относящиеся к Богу, но не требует однозначно утверждать, что он выступает официальным представителем или защитником Бога.
translation_notes:
  register: Современный литературный русский язык; спокойная, уверенная и уважительная речь. Сохранена прямая форма обращения в единственном числе и краткость стиха.
