source:
  edition: WLC
  text: הֵן פָּרַ֣שׂ עָלָ֣י/ו אוֹר֑/וֹ וְ/שָׁרְשֵׁ֖י הַ/יָּ֣ם כִּסָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/030.yaml
  text: Behold[a], he spreads his light over it[c][b], and he covers the roots of the sea.
translation:
  language: ru
  text: Вот, он простирает над ним[a] свой свет[b] и покрывает корни моря[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над этим». Еврейское местоимение имеет форму мужского рода единственного числа, но его референт прямо не назван; в контексте оно может относиться к облаку или грозовой массе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «свою молнию» или «своё сияние».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «корни моря»; возможно, имеются в виду его глубочайшие или основополагающие части. Возможен также перевод: «и его свет покрывает корни моря».'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание к последующему образу; «вот» сохраняет возвышенную поэтическую выразительность и естественно звучит по-русски.
- source_word: פָּרַשׂ
  choice: простирает
  rationale: Глагол означает «расстилать, распространять, простирать». «Простирает» кратко передаёт образ света, распространяемого над чем-либо.
- source_word: עָלָיו
  choice: над ним
  rationale: Местоименный суффикс имеет форму мужского рода единственного числа, а его референт в самом стихе не назван. Буквальное «над ним» сохраняет эту неопределённость.
- source_word: אוֹרוֹ
  choice: свой свет
  rationale: Основное значение существительного — «свет»; в контексте грозы оно может подразумевать молнию или сияние. Возвратное «свой» естественно указывает на принадлежность свету действующего лица.
- source_word: וְשָׁרְשֵׁי
  choice: и ... корни
  rationale: Сохранён буквальный и выразительный образ «корней»; метафорически речь может идти о глубочайших или основополагающих частях моря.
- source_word: הַיָּם
  choice: моря
  rationale: Прямое соответствие еврейскому слову «море» без неоправданного обобщения до «вод».
- source_word: כִּסָּה
  choice: покрывает
  rationale: Основное значение глагола — «покрывать». Настоящее время согласуется с поэтическим описанием действия; подразумеваемым субъектом в основном тексте остаётся тот же «он».
theological_decisions:
- issue: Неявный референт местоимения עָלָיו
  choice: Сохранено буквальное «над ним» без отождествления референта.
  alternative: «Над этим» — с отнесением к облаку или грозовой массе из контекста.
  rationale: Сам стих не называет референт, поэтому перевод не должен без необходимости устранять исходную неоднозначность.
- issue: Субъект глагола כִּסָּה
  choice: В основном тексте субъектом по синтаксической последовательности понимается «он».
  alternative: 'Субъектом может быть «его свет»: «и его свет покрывает корни моря».'
  rationale: В еврейском глагол стоит в мужском роде единственного числа, поэтому грамматически возможен как прежний деятель, так и ближайшее существительное אוֹרוֹ, «его свет». Основное чтение согласуется с традиционной последовательностью действий, но альтернативу следует отметить.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Местоимения, относящиеся к Богу, оставлены со строчной буквы, поскольку такое написание не кодируется еврейским текстом и позволяет избежать внесения конфессионально-редакционного обычая.
