base_translation:
  language: en
  yaml_path: translation/ot/job/036/011.yaml
  text: If they listen and serve[b][a], they will complete their days in prosperity and their years in pleasantness.
translation:
  language: ru
  text: Если они будут слушать[a] и служить, то проведут свои дни в благополучии, а годы — в радости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут слушаться». Еврейский глагол может обозначать не только слушание, но и послушное исполнение услышанного.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «завершат свои дни во благе, а свои годы — в приятном (в приятностях)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Союз вводит прямое условие; «если» сохраняет условный характер высказывания Елиуя.
- source_word: יִשְׁמְעוּ
  choice: будут слушать
  rationale: Глагол שׁמע может означать «слышать», «слушать» и в контексте — «слушаться». Выбор сохраняет основной образ внимательного, отзывчивого слушания, не сводя его безоговорочно к послушанию.
- source_word: וְיַעֲבֹדוּ
  choice: и служить
  rationale: עבד имеет широкое значение «служить». Оно уместно для служения Богу и не сужает смысл до одного лишь богослужебного поклонения или труда.
- source_word: יְכַלּוּ
  choice: проведут
  rationale: В сочетании с «днями» и «годами» форма כלה означает прожить, довести до конца определённый срок. Русское «проведут свои дни» естественно передаёт временную идиому.
- source_word: יְמֵיהֶם
  choice: свои дни
  rationale: Возвратное местоимение естественно по-русски передаёт принадлежность дней подлежащему и сохраняет поэтический параллелизм.
- source_word: בַּטּוֹב
  choice: в благополучии
  rationale: Субстантивированное טוֹב обозначает хорошие, благоприятные жизненные обстоятельства; «благополучие» передаёт это без чрезмерного акцента исключительно на богатстве.
- source_word: וּשְׁנֵיהֶם
  choice: а годы
  rationale: Сохраняется параллель «дни — годы»; союз «а» в русском естественно оформляет сопоставительный поэтический параллелизм.
- source_word: בַּנְּעִימִים
  choice: в довольстве
  rationale: Множественная форма от נעים указывает на приятное, отрадное состояние или приятные блага. «Довольство» естественно и достойно звучит в русском, сохраняя широту образа.
theological_decisions:
- issue: Является ли стих безусловным обещанием земного процветания за послушание
  choice: Условное утверждение Елиуя передано прямо, без превращения его в универсальную доктрину.
  alternative: Понимать стих как безусловный закон материального процветания либо только как обещание внутреннего духовного блага.
  rationale: Еврейский текст формулирует условное утверждение внутри речи Елиуя. Перевод сохраняет его буквальную направленность на благоприятные жизненные обстоятельства, но не добавляет утверждения о всеобщем и неизменном богословском принципе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим ритмом. Синтаксис прост и понятен; параллелизм «дни — годы» сохранён. Термины «благополучие» и «довольство» передают благоприятные обстоятельства, не сужая смысл до материального богатства.
