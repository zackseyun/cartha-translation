lexical_decisions:
- source_word: וַיַּגֵּד
  choice: тогда Он возвещает
  rationale: Порода хифиль глагола נגד означает «сообщать, объявлять, давать знать». «Возвещает» сохраняет торжественность контекста, а «тогда» естественно передаёт последовательность в условной конструкции предшествующих стихов.
- source_word: לָהֶם
  choice: им
  rationale: Прямое соответствие предлогу с местоименным суффиксом, обозначающему адресатов возвещения.
- source_word: פָּעֳלָם
  choice: об их делах
  rationale: Существительное обозначает дело или поступок; рядом с «преступлениями» речь идёт о нравственно оцениваемых действиях. Предлог «об» естественно сочетается по-русски с глаголом «возвещает» в данном значении.
- source_word: וּפִשְׁעֵיהֶם
  choice: и преступлениях
  rationale: פשע обозначает нарушение, преступление или мятеж против законной власти. «Преступления» сохраняет нравственную серьёзность слова, не сужая его до буквального политического мятежа.
- source_word: כִּי
  choice: о том, что
  rationale: כִּי вероятнее всего вводит содержание возвещения. Конструкция «о том, что» грамматически связывает последнюю часть стиха с сообщением о делах и преступлениях.
- source_word: יִתְגַּבָּרוּ
  choice: они превозносились
  rationale: Хитпаэль от גבר буквально связан с усилением или утверждением себя, но в нравственном контексте передаёт самовозвышение. «Превозносились» сохраняет образ возвышения себя и отрицательный оттенок, не превращая его в отвлечённую характеристику характера.
theological_decisions:
- issue: Нравственный оттенок יִתְגַּבָּרוּ
  choice: «они превозносились» — указание на высокомерное самовозвышение
  alternative: «они стали сильны» или «они одолевали»
  rationale: Параллель с «преступлениями» указывает на нравственно отрицательное действие, а не на силу как таковую. При этом сноска сохраняет более буквальную лексическую возможность и не скрывает неоднозначность глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Он» указывает на Бога из ближайшего контекста. Тире помогает ясно представить заключительную часть как уточнение содержания возвещения.
