  source_fidelity: 'Текст точно передаёт еврейский стих: הֶן передано эмфатическим «Вот», אֵל — «Бог», повтор כַּבִּיר сохранён словом «могуч», а при וְלֹא יִמְאָס не добавлен отсутствующий в оригинале объект. Оборот «силой сердца» воспроизводит כֹּחַ לֵב без преждевременного выбора между разумом, пониманием и решимостью.'
