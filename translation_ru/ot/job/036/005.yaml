id: JOB.36.5
reference: Job 36:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֶן אֵ֣ל כַּ֭בִּיר וְ/לֹ֣א יִמְאָ֑ס כַּ֝בִּ֗יר כֹּ֣חַֽ לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/005.yaml
  text: Behold[a], God is mighty and does not despise[b]; he is mighty in strength of heart.
translation:
  language: ru
  text: Вот, Бог могуч и не отвергает[a]; Он могуч силой сердца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не презирает»; «не гнушается». В еврейском тексте объект не назван.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «силой сердца»; это выражение может подразумевать силу разума, понимание или твёрдость воли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Вот
  rationale: Сохраняет функцию эмфатического указателя и возвышенный поэтический тон; в современном русском естественнее буквального «се».
- source_word: אֵל
  choice: Бог
  rationale: Поэтическое обозначение Бога без необходимости разворачивать его в особый титул.
- source_word: כַּבִּיר
  choice: могуч
  rationale: Передаёт значение величия и силы и сохраняет повтор одного слова в обеих частях стиха.
- source_word: וְלֹא יִמְאָס
  choice: и не отвергает
  rationale: Глагол может означать «отвергать, презирать, гнушаться». «Не отвергает» естественно по-русски и не требует добавлять отсутствующий в еврейском тексте объект.
- source_word: כֹּחַ לֵב
  choice: силой сердца
  rationale: 'Сохраняет образ исходного текста и его смысловую широту: сердце здесь может обозначать разум, понимание или твёрдость воли.'
theological_decisions:
- issue: Не названный объект глагола יִמְאָס
  choice: не отвергает
  alternative: не презирает; не гнушается; не отвергает никого
  rationale: В еврейском тексте объект не выражен. Перевод не добавляет «никого» и тем самым сохраняет исходную неопределённость.
- issue: Значение выражения כֹּחַ לֵב
  choice: силой сердца
  alternative: силой разума; могуч разумом; твёрдостью намерения
  rationale: Буквальный образ не сводится к одному толкованию и сохраняет возможные значения понимания, внутренней силы и решимости.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Повтор «могуч» и метафора сердца сохранены; архаизм «се» не используется.
