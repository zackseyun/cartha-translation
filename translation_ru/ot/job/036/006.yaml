  yaml_path: translation/ot/job/036/006.yaml
  text: He does not keep the wicked alive[b][a], but gives justice to the afflicted.
translation:
  language: ru
  text: Он не оставляет нечестивого в живых[a], но даёт угнетённым правосудие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не даёт нечестивому жить».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бедным» или «страдающим». Еврейское слово может обозначать бедных, униженных, угнетённых или находящихся в бедственном положении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֶּה
  choice: оставляет … в живых
  rationale: Пиэль глагола חיה здесь означает сохранение жизни, а не воскрешение или наделение жизнью. Русское выражение естественно передаёт продолжающееся сохранение в живых.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Форма единственного числа сохранена как обобщённое обозначение человека, поступающего нечестиво.
- source_word: מִשְׁפָּט
  choice: справедливый суд
  rationale: В сочетании с נתן слово обозначает предоставление угнетённым должного им правосудия. Эта формулировка сохраняет судебный оттенок מִשְׁפָּט и естественна по-русски.
- source_word: עֲנִיִּים
  choice: угнетённым
  rationale: עָנִי может обозначать бедных, униженных, притесняемых или вообще страдающих. В данном контексте «угнетённым» передаёт социальный и правовой оттенок, не сводя значение только к материальной бедности.
- source_word: יִתֵּן
  choice: даёт
  rationale: Сохранено обычное значение נתן; в сочетании «даёт … справедливый суд» речь идёт о предоставлении правосудия.
- source_word: וּ
  choice: но
  rationale: Хотя союз формально значит «и», параллельные части стиха находятся в смысловом противопоставлении, которое в современном русском ясно выражает «но».
theological_decisions:
- issue: Может ли יְחַיֶּה подразумевать воскресение или особое дарование жизни
  choice: Переведено как «оставляет … в живых», то есть сохраняет земную жизнь.
  alternative: «оживляет» или «даёт жизнь»
  rationale: 'Контекст говорит о Божьем справедливом управлении: Он не сохраняет жизнь нечестивому, но обеспечивает правосудие угнетённым. Смысл воскресения здесь текстом не требуется.'
- issue: Следует ли понимать עֲנִיִּים исключительно как материально бедных
  choice: 'Основной текст: «угнетённым», с более широким диапазоном значения в сноске.'
  alternative: «бедным» или «страдающим»
  rationale: Еврейское слово охватывает бедность, унижение, притеснение и бедственное положение; перевод не должен искусственно ограничивать его только экономическим смыслом.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис краткий и параллельный; обобщённое единственное число «нечестивого» сохраняет форму оригинала, а сноски отмечают реальные лексические альтернативы.
