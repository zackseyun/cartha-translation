  text: כָּל אָדָ֥ם חָֽזוּ ב֑/וֹ אֱ֝נ֗וֹשׁ יַבִּ֥יט מֵ/רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/025.yaml
  text: All mankind has looked on it[b][a]; man gazes from afar.
translation:
  language: ru
  text: Все люди видели это[a]; человек[b] смотрит издалека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «видели Его». Еврейское местоимение — мужского рода, единственного числа — можно отнести непосредственно к Богу, однако в контексте вероятнее отсылка к Его делу.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может подразумевать смертного, бренного человека.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָדָם
  choice: Все люди
  rationale: Сочетание כָּל с собирательным אָדָם охватывает всё человечество; «все люди» естественно и ясно передаёт обобщённый смысл в современном русском языке.
- source_word: חָזוּ
  choice: видят
  rationale: חזה обозначает зрительное восприятие, иногда созерцательное. Русское «видят» сохраняет основной смысл и согласуется с множественным выражением «все люди»; форма перфекта в поэтическом обобщении передаёт доступный наблюдению факт, поэтому настоящее время здесь естественно.
- source_word: בּוֹ
  choice: это
  rationale: Местоименный суффикс имеет мужской род и единственное число, но вероятнее всего отсылает к упомянутому прежде Божьему делу. Нейтральное русское «это» передаёт наиболее вероятную связь, не превращая местоимение в прямое указание на Бога; личное «Его» отмечено в сноске как грамматически возможное.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: אֱנוֹשׁ — обобщённое обозначение человека, нередко с оттенком смертности и бренности. «Человек» сохраняет поэтический параллелизм и звучит естественнее, чем более истолковывающее «смертный».
- source_word: יַבִּיט
  choice: смотрит
  rationale: Hифиль נבט означает направлять взгляд, смотреть. «Смотрит» точно и без архаизации передаёт значение; возможный оттенок пристального наблюдения поддерживается поэтическим контекстом.
- source_word: מֵרָחוֹק
  choice: издалека
  rationale: מִן + רָחוֹק обозначает взгляд с большого расстояния. «Издалека» кратко, естественно и соответствует возвышенному поэтическому регистру.
theological_decisions:
- issue: Референт местоимения בּוֹ
  choice: «это» — вероятная отсылка к Божьему делу
  alternative: «Его» — отсылка непосредственно к Богу
  rationale: Еврейская форма допускает личное прочтение, однако ближайший контекст говорит о Божьем деянии. Основной текст следует наиболее вероятной контекстуальной связи, а подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим строем. Родовой смысл אָדָם передан инклюзивным выражением «все люди», а параллельное אֱנוֹשׁ — традиционным и естественным «человек». Подлинная неоднозначность местоимения вынесена в сноску.
