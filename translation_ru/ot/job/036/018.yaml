  yaml_path: translation/ot/job/036/018.yaml
  text: Because wrath—beware lest it entice you into scoffing[c][b][a], and do not let a great ransom turn you aside.
translation:
  language: ru
  text: Ведь гнев — берегись, как бы он не увлёк тебя к насмешке[a], — и пусть большой выкуп[b] не собьёт тебя с пути.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не увлёк тебя хлопком (ладоней)». Еврейское слово трудно для истолкования и может буквально указывать на удар ладонями или хлопок, возможно как жест насмешки.'
    reason: lexical_alternative
  - marker: b
    text: '«Выкуп» можно также понять как «искупительную плату», а в некоторых контекстах — как «взятку»; возможен перевод: «и пусть обилие выкупа не собьёт тебя с пути».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание или пояснение к предшествующему предостережению; «ведь» естественно передаёт причинно-пояснительную связь, не делая её чрезмерно жёсткой.
- source_word: חֵמָה
  choice: гнев
  rationale: Слово обозначает сильный, пылающий гнев. Перевод не уточняет, чей именно это гнев, поскольку еврейский текст оставляет референт открытым.
- source_word: פֶּן
  choice: берегись, как бы… не
  rationale: Передаёт предупредительную силу частицы и возможный нежелательный исход естественной современной русской конструкцией.
- source_word: יְסִיתְךָ
  choice: не склонил тебя
  rationale: Hiphil от סות выражает побуждение, прельщение или совращение; «склонил» сохраняет значение воздействия, не конкретизируя его сверх текста.
- source_word: בְסָפֶק
  choice: к насмешке
  rationale: Редкое и спорное выражение, вероятно связанное с ударом или хлопком ладоней как жестом осмеяния. В основном тексте передан вероятный контекстуальный смысл, а буквальная возможность вынесена в сноску.
- source_word: רָב כֹּפֶר
  choice: большой выкуп
  rationale: רָב непосредственно характеризует значительность или величину כֹּפֶר. «Большой выкуп» звучит естественно и сохраняет основной смысл платы, способной отвратить последствия.
- source_word: אַל יַטֶּךָּ
  choice: пусть… не собьёт тебя с пути
  rationale: Образно передаёт значение «отклонить, увести в сторону» и сохраняет запретительную силу אַל.
theological_decisions:
- issue: Чей гнев имеется в виду
  choice: Оставить просто «гнев», без притяжательного определения
  alternative: «гнев Божий» или «твой гнев»
  rationale: В еврейском тексте обладатель или источник гнева прямо не назван; контекст допускает разные толкования, поэтому перевод не устраняет эту богословскую неоднозначность.
- issue: Значение כֹּפֶר
  choice: «выкуп»
  alternative: «искупительная плата» или «взятка»
  rationale: «Выкуп» сохраняет широкий смысл платы за избавление от последствий и меньше, чем альтернативы, навязывает конкретное богословское или нравственно-правовое толкование.
translation_notes:
  register: Современный литературный русский язык с краткой, серьёзной интонацией предостережения. Конструкция «сбить с пути» сохраняет исходный образ уклонения и понятна широкому читателю; спорные значения не перегружают основной текст и отражены в сносках.
