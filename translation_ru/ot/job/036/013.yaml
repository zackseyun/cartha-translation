  text: וְֽ/חַנְפֵי לֵ֭ב יָשִׂ֣ימוּ אָ֑ף לֹ֥א יְ֝שַׁוְּע֗וּ כִּ֣י אֲסָרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/013.yaml
  text: But the godless in heart store up anger[b][a]; they do not cry for help when he binds them.
translation:
  language: ru
  text: Но безбожные сердцем[a] копят гнев; они не взывают о помощи, когда[b] он связывает их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицемерные сердцем»; также возможно: «нечестивые в сердце».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что он связывает их». Еврейский союз может выражать не время, а причину.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַנְפֵי לֵב
  choice: безбожные сердцем
  rationale: חנף обозначает безбожного, нечестивого или лицемерного человека. В контексте Иова на первом плане стоит внутренняя неугодность Богу, а לֵב указывает на расположение сердца; поэтому сохранён краткий еврейский оборот.
- source_word: יָשִׂימוּ אָף
  choice: копят гнев
  rationale: Буквальное «полагают гнев» по-русски неестественно. «Копят гнев» передаёт удерживание и накопление гнева самими людьми, не превращая его без достаточных оснований в Божий гнев.
- source_word: לֹא יְשַׁוְּעוּ
  choice: не взывают о помощи
  rationale: Глагол שׁוע в этой форме означает звать или взывать о помощи. Выбранный оборот естественен для современного литературного русского языка и сохраняет возвышенный регистр.
- source_word: כִּי
  choice: когда
  rationale: 'Здесь возможна временная связь: они не обращаются за помощью в то время, когда подвергаются связыванию или стеснению. Возможное причинное значение союза сохранено в сноске.'
- source_word: אֲסָרָם
  choice: он связывает их
  rationale: אסר может означать связывать, сковывать или заключать. «Связывает» сохраняет широту образа; субъект в еврейском тексте выражен формой третьего лица единственного числа и из контекста соотносится с Богом.
theological_decisions:
- issue: Кто является субъектом выражения «он связывает их»
  choice: Сохранено местоимение «он», контекстуально относящееся к Богу.
  alternative: 'Передать явно: «Бог связывает их».'
  rationale: Еврейский текст не называет Бога в этой строке прямо. Сохранение местоимения не устраняет контекстуальную связь с Богом, но и не делает подразумеваемое имя явным без текстового основания.
- issue: Чей гнев обозначен словом אָף
  choice: Гнев понимается как гнев безбожных, который они копят.
  alternative: Понимать выражение как накопление Божьего гнева против них.
  rationale: Подлежащим при יָשִׂימוּ являются «безбожные сердцем», поэтому наиболее прямое чтение состоит в том, что именно они удерживают и накапливают гнев. Формулировка не добавляет притяжательного местоимения и тем самым сохраняет краткость оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Оборот «безбожные сердцем» намеренно сохраняет лаконичность и внутреннюю направленность еврейского выражения. Местоимение «он» не заменено словом «Бог» и не выделено прописной буквой, поскольку оригинал содержит лишь подразумеваемый субъект.
