  text: He opens their ear to discipline[b][a], and says that they should turn back from wickedness.
translation:
  language: ru
  text: Он открывает им уши для наставления[a] и говорит, чтобы они отвернулись от беззакония[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открывает им уши для вразумления»; возможный смысл: «для исправления».'
