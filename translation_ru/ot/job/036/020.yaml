lexical_decisions:
- source_word: אַל
  choice: не
  rationale: Частица אַל с формой имперфекта выражает запрещение; по-русски естественно передаётся через «не» с повелительным наклонением.
- source_word: תִּשְׁאַף
  choice: жажди
  rationale: Глагол שׁאף может обозначать тяжёлое дыхание, страстное стремление или сильное желание. «Жажди» естественно выражает здесь напряжённое желание и сохраняет образную силу.
- source_word: הַלָּיְלָה
  choice: ночи
  rationale: Прямой перевод определённого существительного; после глагола «жаждать» в русском требуется родительный падеж.
- source_word: לַעֲלוֹת
  choice: когда… исчезают
  rationale: Инфинитив от עלה буквально связан с подъёмом или восхождением, однако синтаксис строки труден. Контекстуальное «исчезают» передаёт распространённое понимание удаления народов, а временное «когда» естественно связывает действие с ночью.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число обозначает человеческие сообщества или нации; «народы» сохраняет корпоративный и множественный смысл.
- source_word: תַּחְתָּם
  choice: со своего места
  rationale: Буквально выражение связано со значением «под ними», но здесь, вероятно, указывает на место или положение, откуда народы удаляются. Единственное число «своего места» сохраняет собирательный строй фразы.
