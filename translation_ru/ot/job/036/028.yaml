  text: which the clouds pour down[a]; they drip abundantly on man.
translation:
  language: ru
  text: которые облака изливают; они обильно орошают людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на многих людей». Слово רָב («много», «обильный») может относиться либо к обилию дождя, либо к собирательному слову אָדָם («люди»).'
    reason: Сохранение синтаксической и лексической неоднозначности выражения עֲלֵי אָדָם רָב.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительное местоимение связывает стих с упомянутыми ранее каплями воды и сохраняет подчинённость фразы.
- source_word: יִזְּלוּ
  choice: изливают
  rationale: Глагол נזל обозначает стекание или истечение; в контексте дождя «изливают» естественно передаёт нисходящий поток.
- source_word: שְׁחָקִים
  choice: облака
  rationale: В данной поэтической картине слово обозначает облака как источник дождя, а не небо вообще.
- source_word: יִרְעֲפוּ
  choice: проливая
  rationale: רָעַף означает капать, орошать или посылать дождь. Деепричастная форма создаёт естественную русскую фразу, сохраняя действие второго еврейского глагола.
- source_word: עֲלֵי
  choice: на
  rationale: Передаёт направленность дождя сверху на находящихся внизу людей.
- source_word: אָדָם
  choice: людей
  rationale: Единственное собирательное אָדָם здесь обозначает человечество или людей вообще; русский множественный эквивалент естественно выражает этот обобщённый смысл.
- source_word: רָב
  choice: обильно
  rationale: При наречном понимании слово указывает на обилие проливаемого дождя. Такое прочтение соответствует контексту и масоретской фразировке, хотя грамматически возможно соотнести его с людьми.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: людей
  alternative: человека / человечество
  rationale: В данном контексте אָדָם — собирательное обозначение людей вообще, а не отдельного мужчины. «Людей» ясно и естественно передаёт референт без внесения богословского уточнения.
- issue: Синтаксическая связь רָב
  choice: обильно
  alternative: на множество людей
  rationale: Рָב можно понять наречно — как указание на обилие дождя, — либо связать с собирательным אָדָם. Основной текст следует традиционному наречному прочтению, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Фрагментарное начало сохранено, поскольку относительное местоимение продолжает мысль предыдущего стиха; повтор двух близких дождевых глаголов передан без тяжеловесного буквального дублета.
