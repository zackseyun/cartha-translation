  terminology: «Не послушают» удачно не сводит שׁמע ни к физическому слышанию, ни к однозначно формальному повиновению. «Меч», «погибнут», «умрут», «знание» употреблены последовательно и в подходящем библейско-литературном регистре. Сноска с маркером [a] корректно привязана к כִּבְלִי דָעַת и не навязывает спорный причинный оттенок.
