  source_fidelity: Текст точно передаёт условное противопоставление וְאִם, широкий смысл לֹא יִשְׁמְעוּ («не послушают»), насильственную гибель בְּשֶׁלַח и параллелизм между יַעֲבֹרוּ и וְיִגְוְעוּ. «От меча» — допустимая идиоматичная конкретизация орудия поражения в данном контексте; она не искажает смысл. «Без знания» близко передаёт כִּבְלִי דָעַת, а возможное причинное прочтение корректно сохранено в примечании.
