language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אִם לֹ֣א יִ֭שְׁמְעוּ בְּ/שֶׁ֣לַח יַעֲבֹ֑רוּ וְ֝/יִגְוְע֗וּ כִּ/בְלִי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/012.yaml
  text: But if they do not listen[a], they will pass away by the sword, and they will die without knowledge.
translation:
  language: ru
  text: Но если они не послушают, то погибнут от меча и умрут без знания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за недостатка знания».'
    reason: Лексико-синтаксическая конструкция כִּבְלִי דָעַת может указывать как на состояние отсутствия знания, так и на причину гибели.
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Союз вводит условие, противопоставленное благоприятному исходу в предыдущем стихе; «но если» естественно передаёт этот контраст.
- source_word: לֹא יִשְׁמְעוּ
  choice: не послушают
  rationale: Глагол שׁמע охватывает как слушание, так и отклик на услышанное. Русское «не послушают» сохраняет обе стороны значения, не сводя его ни к простому восприятию звука, ни только к повиновению.
- source_word: בְּשֶׁלַח
  choice: от меча
  rationale: Существительное обозначает орудие поражения и может иметь более широкое значение «оружие» или «метательный снаряд»; в данном контексте «меч» — естественное традиционное обозначение насильственной смерти.
- source_word: יַעֲבֹרוּ
  choice: погибнут
  rationale: Буквально глагол означает «пройдут», однако в контексте суда употреблён в смысле ухода из жизни. «Погибнут» ясно передаёт этот смысл и сохраняет параллелизм со следующим глаголом.
- source_word: וְיִגְוְעוּ
  choice: и умрут
  rationale: Глагол גוע означает умереть, испустить дух; «умрут» — точная и естественная современная передача.
- source_word: כִּבְלִי דָעַת
  choice: без знания
  rationale: Формулировка близко передаёт состояние отсутствия знания и не исключает возможного причинного оттенка, вынесенного в примечание.
theological_decisions:
- issue: Передаёт ли שׁמע только слышание или также послушный отклик
  choice: не послушают
  alternative: не услышат; не станут повиноваться
  rationale: «Не послушают» сохраняет смысловую широту еврейского глагола и не сужает высказывание до физического слышания или исключительно формального повиновения.
- issue: Обозначает ли כִּבְלִי דָעַת состояние или причину смерти
  choice: без знания
  alternative: из-за недостатка знания
  rationale: Основной текст сохраняет формально выраженное состояние, тогда как возможное причинное прочтение отмечено в сноске и не устраняется.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный синтаксис соответствует поэтическому параллелизму оригинала. Слова «погибнут» и «умрут» сохраняют намеренное смысловое сближение двух еврейских глаголов.
