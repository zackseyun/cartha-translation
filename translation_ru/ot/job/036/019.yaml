lexical_decisions:
- source_word: הֲיַעֲרֹךְ
  choice: поможет ли
  rationale: Глагол ערך обычно означает «располагать, приводить в порядок», но в этом трудном поэтическом контексте вопрос, вероятно, касается того, окажется ли названное средство полезным или достаточным. «Поможет ли» естественно передаёт этот смысл по-русски.
- source_word: שׁוּעֲךָ
  choice: твой вопль
  rationale: Масоретская огласовка указывает на שׁוע — «вопль, крик о помощи». Возможное понимание «твоё богатство» сохранено в примечании из-за трудности текста.
- source_word: לֹא בְצָר
  choice: когда придёт беда
  rationale: Хотя לֹא обычно является отрицанием «не», сжатая поэтическая фраза допускает контекстуальное понимание как указание на наступление бедствия. Более буквальное отрицательное прочтение отражено в альтернативном переводе примечания.
- source_word: וְכֹל
  choice: или всё
  rationale: Союз וְ буквально значит «и», однако в риторическом вопросе он присоединяет второе возможное средство, которое также не поможет; русское «или» ясно передаёт эту функцию.
- source_word: מַאֲמַצֵּי כֹחַ
  choice: всё напряжение твоих сил
  rationale: Выражение сочетает идеи напряжённого усилия и силы. Такой перевод сохраняет оба элемента и звучит естественно в современной русской поэзии.
