lexical_decisions:
- source_word: הֶן
  choice: Вот
  rationale: Частица привлекает внимание к торжественному утверждению; «вот» естественно сохраняет возвышенный поэтический тон.
- source_word: אֵל
  choice: Бог
  rationale: Здесь слово служит общим обозначением Бога, а не именем собственным.
- source_word: יַשְׂגִּיב
  choice: возвышен
  rationale: Форма от שׂגב передаёт высоту и превосходство; выбранный вариант сохраняет связь с силой Бога, не сводя значение лишь к действию «поступает могущественно».
- source_word: בְּכֹחוֹ
  choice: Своей силой
  rationale: Предлог ב допускает инструментальное значение («силой») и значение сферы или проявления («в силе»); основной текст звучит естественно по-русски, а неоднозначность отмечена в сноске.
- source_word: מִי כָמֹהוּ
  choice: кто ... подобный Ему?
  rationale: Сохранён прямой риторический вопрос о несравненности Бога.
- source_word: מוֹרֶה
  choice: наставник
  rationale: Слово обозначает того, кто учит; «наставник» уместно в возвышенной поэзии и ясно передаёт роль учителя.
theological_decisions:
- issue: Связь возвышенности Бога с Его силой
  choice: Бог возвышен Своей силой
  alternative: Бог возвышен в Своей силе; Бог проявляет Своё величие силой
  rationale: Перевод сохраняет главную мысль о превосходстве Бога в связи с Его силой, не превращая её в более широкое догматическое утверждение.
- issue: Несравненность Бога как наставника
  choice: кто наставник, подобный Ему?
  alternative: кто подобен Ему как наставник?; кто учит, как Он?
  rationale: Сохранена риторическая сила еврейского текста и его акцент на несравненном Божьем наставлении без уточнения способа или содержания этого наставления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимение «Своей» и форма «Ему» написаны с прописной буквы согласно распространённой русской библейской традиции.
