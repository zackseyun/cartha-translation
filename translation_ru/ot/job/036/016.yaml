  text: וְ/אַ֤ף הֲסִיתְ/ךָ֨ מִ/פִּי צָ֗ר רַ֭חַב לֹא מוּצָ֣ק תַּחְתֶּ֑י/הָ וְ/נַ֥חַת שֻׁ֝לְחָנְ/ךָ֗ מָ֣לֵא דָֽשֶׁן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/016.yaml
  text: Indeed[a], he lured you out of the mouth of distress into a broad place with no constraint beneath it[c][b], and the setting of your table was full of richness.
translation:
  language: ru
  text: 'И ещё: Он увлёк тебя из пасти бедствия на простор, где нет стеснения[a], и то, что подано к твоему столу, было наполнено туком[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно. Возможны переводы: «на простор, где ничто не стесняет» или «на широкое место, под которым нет тесноты».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «полно жирности»; имеется в виду обильная, богатая пища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: И ещё
  rationale: Передаёт присоединительно-усилительное значение сочетания, не превращая его в более категоричное утверждение.
- source_word: הֲסִיתְךָ
  choice: Он увлекал тебя
  rationale: Глагол от סות/סית может означать побуждать, склонять или увлекать. «Увлекал» сохраняет необычный оттенок исходного слова, не навязывая исключительно отрицательного смысла.
- source_word: מִפִּי צָר
  choice: из пасти бедствия
  rationale: «Пасть» сохраняет образ פֶּה, а «бедствие» передаёт צַר как тесноту и скорбь; пространственный контраст с последующим простором остаётся явным.
- source_word: רַחַב
  choice: на простор
  rationale: Естественное русское выражение, сохраняющее конкретный образ широты и свободы от тесноты.
- source_word: לֹא מוּצָק תַּחְתֶּיהָ
  choice: где нет стеснения
  rationale: מוּצָק в этом месте труден для толкования. Выбранное чтение выражает отсутствие ограничения и поддерживает противопоставление тесноты и простора.
- source_word: וְנַחַת שֻׁלְחָנְךָ
  choice: и поставленное на твой стол
  rationale: Редкое נַחַת истолковано как то, что положено или поставлено; это сохраняет связь со столом и избегает неясного буквального существительного.
- source_word: מָלֵא דָשֶׁן
  choice: было полно тука
  rationale: «Тук» близко передаёт буквальный образ דָּשֶׁן — жирность, насыщенность, изобилие богатой пищи; значение поясняется в примечании.
theological_decisions:
- issue: Не названный прямо субъект הֲסִיתְךָ
  choice: Сохранить местоименный субъект «Он», не добавляя в текст слово «Бог».
  alternative: «Бог увлекал тебя»
  rationale: Из контекста речи Елиуя субъектом, вероятно, является Бог, но в самом еврейском стихе существительное не названо. Прописная буква помогает русскому читателю уловить контекст, не внося имени в текст.
- issue: Временная и модальная неоднозначность высказывания
  choice: «увлекал тебя»
  alternative: «увлёк тебя» или «увлекает тебя»
  rationale: Форма допускает контекстуальные нюансы, а общий смысл стиха и ближайшего рассуждения труден. Несовершенный вид не делает избавление однозначно завершившимся фактом.
- issue: Образ тесноты и простора
  choice: Сохранить образы «пасти бедствия» и «простора».
  alternative: «вывел тебя из страдания к свободе»
  rationale: Поэтическое и богословское напряжение строится на пространственном противопоставлении; абстрактный пересказ ослабил бы исходный образ.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной поэтической образности. «Пасть бедствия» намеренно конкретна; «тук» — редкое, но понятное в библейском регистре слово, снабжённое пояснением. Маркеры примечаний стоят непосредственно после соответствующих выражений.
