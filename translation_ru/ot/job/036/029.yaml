  text: אַ֣ף אִם יָ֭בִין מִפְרְשֵׂי עָ֑ב תְּ֝שֻׁא֗וֹת סֻכָּתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/029.yaml
  text: Can anyone understand the spreading of the clouds[a], the thunderings of his shelter?
translation:
  language: ru
  text: Может ли кто понять расстилание облаков и грохот его шатра?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гул его укрытия»; возможны также «раскаты» и «покров». Еврейские слова обозначают сильный шум, грохот или гул и укрытие, навес либо шатёр.'
    reason: Лексическая широта обоих поэтических выражений допускает несколько близких переводов.
lexical_decisions:
- source_word: אַף אִם
  choice: Да и… ли кто
  rationale: В данном контексте сочетание вводит риторический вопрос. Такая передача естественна по-русски и сохраняет усилительный оттенок אַף, не превращая фразу в обычное условие.
- source_word: יָבִין
  choice: поймёт
  rationale: Глагол בין означает понимать, постигать или различать; «поймёт» ясно и естественно передаёт смысл здесь.
- source_word: מִפְרְשֵׂי
  choice: как расстилаются
  rationale: Форма обозначает расстилание или развёртывание. Глагольная конструкция по-русски естественно передаёт наблюдаемое движение облаков.
- source_word: עָב
  choice: облака
  rationale: Единственное число может обозначать облачную массу собирательно; русское множественное число хорошо передаёт метеорологическую картину.
- source_word: תְּשֻׁאוֹת
  choice: грохот
  rationale: Слово обозначает сильный шум, гул, грохот или раскаты и не является узким техническим термином для грома. «Грохот» сохраняет эту широту и уместен в описании бури.
- source_word: סֻכָּתוֹ
  choice: Его шатра
  rationale: סֻכָּה означает укрытие, навес, шалаш; в поэтическом контексте это образ Божьего небесного или облачного шатра. «Шатёр» сохраняет конкретную метафору и звучит достойно в современной русской поэзии.
theological_decisions:
- issue: К кому относится местоименный суффикс 3-го лица мужского рода в סֻכָּתוֹ
  choice: 'Суффикс отнесён к Богу: «Его шатра».'
  alternative: Отнести образ к самой буре или облачной массе как к её покрову.
  rationale: Ближайший контекст говорит о Божьем управлении погодными явлениями. Отнесение суффикса к Богу лучше соответствует ходу речи, при этом метафора не разъясняется сверх сказанного в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого поэтического синтаксиса. Заглавная буква в «Его» указывает на Бога как наиболее вероятного носителя суффикса; образ шатра намеренно не истолкован внутри основного текста.
