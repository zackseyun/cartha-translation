  text: כִּי בָ֭/ם יָדִ֣ין עַמִּ֑ים יִֽתֶּן אֹ֥כֶל לְ/מַכְבִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/031.yaml
  text: For by them he judges peoples; he gives food in abundance.
translation:
  language: ru
  text: Ибо ими Он судит народы и даёт пищу в изобилии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָם
  choice: ими
  rationale: Местоимение множественного числа отсылает к явлениям, упомянутым в ближайшем контексте; русский творительный с «ими» естественно передаёт средство действия, не уточняя референт сверх исходного текста.
- source_word: יָדִין
  choice: судит
  rationale: Глагол דין здесь передаёт осуществление суда или правления над народами; «судит» сохраняет прямое судебное значение и смысл божественного воздаяния.
- source_word: עַמִּים
  choice: народы
  rationale: Обычное множественное значение существительного עם.
- source_word: יִתֶּן אֹכֶל
  choice: даёт пищу
  rationale: Буквально и естественно передаёт сочетание «давать пищу»; настоящее время согласуется с описанием постоянного действия.
- source_word: לְמַכְבִּיר
  choice: в изобилии
  rationale: Наречное выражение обозначает обильную меру; выбран современный и ясный русский эквивалент.
theological_decisions:
- issue: Связь суда и обеспечения пищей посредством одних и тех же явлений
  choice: Сохранить параллель без поясняющего уточнения
  alternative: Уточнить, что речь идёт о дожде, облаках или молнии
  rationale: Исходный текст использует местоимение «ими» и не называет его референт в самом стихе; явное уточнение устранило бы контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткий, возвышенный и понятный синтаксис. Заглавное «Он» употреблено как традиционное уважительное обозначение Бога, референт которого ясен из контекста.
