  text: הֶן אֵ֣ל שַׂ֭גִּיא וְ/לֹ֣א נֵדָ֑ע מִסְפַּ֖ר שָׁנָ֣י/ו וְ/לֹא חֵֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/036/026.yaml
  text: Behold[a], God is great, and we do not know him[b]; the number of his years is unsearchable.
translation:
  language: ru
  text: Вот, Бог велик, и мы не знаем Его[a]; число лет Его неисследимо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и мы не знаем»; объект «Его» подразумевается из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и нет исследования числа лет Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: Вот
  rationale: Частица вводит подчёркнутое утверждение и обращает внимание на последующие слова; «вот» естественно сохраняет её возвышенную поэтическую силу.
- source_word: אֵל
  choice: Бог
  rationale: Здесь אֵל — обычное поэтическое обозначение Бога, а не имя, требующее транслитерации.
- source_word: שַׂגִּיא
  choice: велик
  rationale: Слово выражает величие и превосходство; «велик» передаёт широкий смысл, не сводя его только к могуществу или возвышенности.
- source_word: וְלֹא נֵדָע
  choice: и мы не знаем Его
  rationale: В еврейском тексте объект прямо не выражен, но из контекста подразумевается Бог. Русская формулировка сохраняет эту контекстуальную связь, а сноска отмечает буквальную неопределённость.
- source_word: מִסְפַּר שָׁנָיו
  choice: число лет Его
  rationale: Сохранён поэтический антропоморфный образ Божьих «лет», без истолковывающей замены словом «вечность».
- source_word: וְלֹא חֵקֶר
  choice: неисследимо
  rationale: Кратко и естественно передаёт буквальную конструкцию «и нет исследования», то есть невозможность исследовать или исчислить продолжительность Божьих лет.
theological_decisions:
- issue: Неявный объект при וְלֹא נֵדָע
  choice: 'Передать: «мы не знаем Его»'
  alternative: 'Оставить без объекта: «мы не знаем»; либо истолковать: «Он непостижим для нас»'
  rationale: Указание «Его» минимально восполняет подразумеваемый из контекста объект, не превращая утверждение в более сильную систематическую формулу о полной непостижимости Бога. Буквальная форма отмечена в сноске.
- issue: Смысл Божьих «лет»
  choice: Сохранить выражение «число лет Его»
  alternative: 'Передать истолковывающе: «Его вечность» или «продолжительность Его бытия»'
  rationale: Еврейский текст использует конкретный поэтический образ лет. Его сохранение не устраняет напряжение между антропоморфным языком и безмерностью Бога.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «число лет Его» сохраняет достоинство и ритм библейской поэзии, оставаясь понятной современному читателю.
