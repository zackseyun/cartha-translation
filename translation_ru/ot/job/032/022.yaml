  yaml_path: translation/ot/job/032/022.yaml
  text: For I do not know how to flatter[b][a]; otherwise my Maker would soon carry me away.
translation:
  language: ru
  text: 'Ибо я не умею льстить[a]: вскоре мой Создатель заберёт меня[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обращаться к людям с лестными титулами». Еврейский глагол может обозначать угодливое или пристрастное именование человека почётным титулом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «унесёт меня» или «возьмёт меня». В еврейском тексте прямо не сказано «убьёт меня», хотя может подразумеваться удаление в результате суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание отказа Елиуя проявлять пристрастие; «ведь» естественно передаёт пояснительную связь с предыдущим стихом.
- source_word: לֹא יָדַעְתִּי
  choice: я не умею
  rationale: В сочетании со следующей глагольной формой выражает отсутствие умения или навыка, а не просто знание о чём-либо.
- source_word: אֲכַנֶּה
  choice: льстить
  rationale: В данном контексте глагол указывает на угодливое или пристрастное обращение к людям; краткое «льстить» передаёт отрицательный смысл, не перегружая основной текст.
- source_word: כִּמְעַט
  choice: вскоре
  rationale: В контексте предупреждения выражает близость грозящего последствия; временное значение здесь естественнее значения «почти».
- source_word: יִשָּׂאֵנִי
  choice: унёс бы меня
  rationale: נשא допускает значения «поднять», «нести», «унести». Выбранный вариант сохраняет образ удаления Божьим судом, не уточняя, что речь непременно идёт об умерщвлении.
- source_word: עֹשֵׂנִי
  choice: мой Создатель
  rationale: Причастная форма буквально обозначает «сотворивший меня»; «мой Создатель» естественно и ёмко передаёт личное отношение творения к Творцу.
theological_decisions:
- issue: Характер грозящего Божьего действия
  choice: «унёс бы меня мой Создатель» — общее указание на удаление или суд
  alternative: «мой Создатель убил бы меня»; «мой Создатель забрал бы меня»
  rationale: Еврейский נשא сам по себе не означает «убить». Смерть может подразумеваться, но перевод сохраняет силу предупреждения и вместе с тем не устраняет смысловую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим поэтической речи книги Иова. «Не умею льстить» звучит естественно и ясно; инверсия «унёс бы меня мой Создатель» сохраняет торжественный оттенок, не становясь архаичной.
