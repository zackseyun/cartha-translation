  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: ru
  text: И перестали эти трое отвечать Иову, потому что он был праведен в собственных глазах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В другой текстовой традиции: «потому что он был праведен в их глазах».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: перестали
  rationale: Глагол שבת здесь означает прекращение действия; в сочетании с инфинитивом «отвечать» современное русское «перестали» естественно и точно.
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: эти трое
  rationale: Контекст ясно указывает на трёх мужчин — собеседников Иова; русская субстантивированная форма «трое» передаёт число и род референтов без тяжеловесного «эти три человека».
- source_word: מֵעֲנוֹת
  choice: отвечать
  rationale: Инфинитив от ענה в значении «отвечать, давать ответ»; форма подходит к продолжающемуся спору.
- source_word: אֶת אִיּוֹב
  choice: Иову
  rationale: Русское управление глагола «отвечать» требует дательного падежа; показатель прямого дополнения отдельно не переводится.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину прекращения ответов; «потому что» ясно выражает эту связь в современном русском.
- source_word: צַדִּיק
  choice: праведен
  rationale: Сохраняет нравственно-судебный смысл צַדִּיק и привычную библейскую лексику, оставаясь понятным современному читателю.
- source_word: בְּעֵינָיו
  choice: в собственных глазах
  rationale: Суффикс в представленном еврейском тексте имеет форму 3-го лица мужского рода единственного числа. «В собственных глазах» естественно передаёт идиому и её рефлексивный оттенок.
theological_decisions:
- issue: Назван ли Иов объективно праведным или праведным лишь по собственной оценке
  choice: «он был праведен в собственных глазах»
  alternative: «он был праведен в их глазах»
  rationale: Основной текст с суффиксом единственного числа описывает представление Иова о себе, не утверждая и не отрицая объективно его праведность. Вариант с множественным суффиксом сохранён в примечании как текстовая традиция.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» передаёт повествовательную связь וַ־. Формулировка сохраняет краткость еврейского стиха и не снимает его богословского напряжения.
