lexical_decisions:
- source_word: עָרַךְ
  choice: направлял
  rationale: В сочетании со «словами» и אֵלַי глагол передаёт смысл выстраивания и обращения речи или доводов к собеседнику; «направлял» естественно выражает это по-русски.
- source_word: אֵלַי
  choice: против меня
  rationale: Предлог буквально указывает направление («ко мне»), но в контексте спора допускает направленность доводов против говорящего; этот оттенок сохранён в основном тексте, а более нейтральный вариант указан в сноске.
- source_word: מִלִּין
  choice: слов
  rationale: Прямое и естественное соответствие арамеизированной форме со значением «слова, речь»; спорный оттенок передаётся глаголом и предлогом.
- source_word: אִמְרֵיכֶם
  choice: вашими речами
  rationale: «Речами» сохраняет значение произнесённых слов, отличает этот термин от предшествующего מִלִּין и естественно обозначает содержание ответов друзей.
- source_word: אֲשִׁיבֶנּוּ
  choice: я не стану отвечать ему
  rationale: Форма глагола означает «ответить», а местоименный суффикс мужского рода единственного числа указывает на Иова.
- source_word: וּבְאִמְרֵיכֶם לֹא אֲשִׁיבֶנּוּ
  choice: и я не стану отвечать ему вашими речами
  rationale: 'Предлог בְּ передан инструментально: Елиуй не будет отвечать Иову посредством тех речей, которые уже произнесли друзья.'
