source:
  edition: WLC
  text: אָ֭כֵן רֽוּחַ הִ֣יא בֶ/אֱנ֑וֹשׁ וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּבִינֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: ru
  text: 'Но дух есть в человеке[a],

    и дыхание Всемогущего даёт им разумение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воистину, в человеке есть дух, и дыхание Всемогущего даёт ему разумение». В еврейском тексте после единственного числа «человек» следует местоимение множественного числа «им»; некоторые переводы согласуют его с единственным числом.'
    reason: Альтернативная передача אָכֵן и возможное сглаживание перехода числа.
lexical_decisions:
- source_word: אָכֵן
  choice: Но
  rationale: В речи Елиуя слово вводит поправку к мысли о том, что мудрость определяется возрастом; «но» естественно передаёт контраст, не устраняя возможного оттенка уверенного утверждения.
- source_word: רוּחַ
  choice: дух
  rationale: Здесь слово обозначает внутреннее нематериальное начало в человеке. Перевод «дух» также сохраняет различие с נְשָׁמָה — «дыханием» во второй строке.
- source_word: הִיא
  choice: есть
  rationale: В именной конструкции местоимение имеет утвердительно-экзистенциальную функцию; русское «есть» передаёт её естественно и достаточно близко к форме оригинала.
- source_word: בֶאֱנוֹשׁ
  choice: в человеке
  rationale: אֱנוֹשׁ означает смертного человека и употреблено здесь в обобщённом единственном числе. «В человеке» сохраняет эту форму и естественно звучит по-русски.
- source_word: וְנִשְׁמַת
  choice: и дыхание
  rationale: נְשָׁמָה обычно означает «дыхание», особенно когда речь идёт о даруемой Богом жизни и способности. Раздельная передача רוּחַ и נְשָׁמָה сохраняет поэтическое сопоставление.
- source_word: שַׁדַּי
  choice: Всемогущего
  rationale: Традиционный и понятный русский перевод божественного титула שַׁדַּי.
- source_word: תְּבִינֵם
  choice: даёт им разумение
  rationale: Каузативная форма глагола בין означает наделять пониманием или способностью различать; местоименный суффикс имеет форму третьего лица множественного числа («им»). «Разумение» сохраняет смысл проницательного понимания и возвышенный поэтический регистр.
theological_decisions:
- issue: Антропологический смысл и переход от единственного числа к множественному
  choice: Сохранены обобщённое единственное «в человеке» и множественное «им».
  alternative: 'Согласовать число: «в человеке… даёт ему разумение».'
  rationale: Еврейский текст переходит от אֱנוֹשׁ в единственном числе к суффиксу множественного числа в תְּבִינֵם. Этот переход позволяет услышать как отдельного человека, так и людей вообще; перевод не устраняет напряжение оригинала.
- issue: Соотношение человеческого духа и дыхания Всемогущего
  choice: Два выражения переданы разными словами — «дух» и «дыхание» — и соединены союзом «и».
  alternative: 'Истолковать их как одно и то же посредством пояснительного приложения: «дух в человеке, то есть дыхание Всемогущего».'
  rationale: Параллелизм допускает тесное смысловое сближение, но еврейская форма не требует явно отождествлять оба выражения. Союз сохраняет неоднозначность и не навязывает определённую антропологическую схему.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой. Порядок слов «дух есть в человеке» сохраняет акцент исходной строки, а «разумение» соответствует контексту мудрости и рассудительности. Подлинный переход от единственного числа к множественному оставлен в основном тексте и пояснён в сноске.
