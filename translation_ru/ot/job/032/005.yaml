lexical_decisions:
- source_word: וַיַּרְא
  choice: Когда… увидел
  rationale: Последовательная форма продвигает повествование, а придаточное с «когда» естественно связывает увиденное с последующей реакцией Елиуя.
- source_word: אֱלִיהוּא
  choice: Елиуй
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание увиденного Елиуем.
- source_word: אֵין מַעֲנֶה
  choice: больше нет ответа
  rationale: Отрицательная экзистенциальная конструкция передана в контексте завершившегося спора; «больше» естественно выражает, что трое уже не могли продолжать отвечать, не меняя сути высказывания.
- source_word: בְּפִי שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: у тех троих
  rationale: Еврейское «в устах трёх мужчин» является идиомой наличия ответа; краткая русская формулировка естественна, а конкретный образ сохранён в сноске.
- source_word: וַיִּחַר אַפּוֹ
  choice: он разгневался
  rationale: Устойчивая еврейская идиома буквально описывает воспламенение гнева; глагольная передача звучит естественно по-русски и ясно выражает сильную сердитую реакцию.
