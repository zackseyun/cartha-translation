base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: ru
  text: Тогда воспылал гнев Елиуя, сына Варахиила, вузитянина[a], из рода Рама. Он разгневался на Иова за то, что тот оправдывал себя, а не Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомка Вуза».'
    reason: Еврейское обозначение הַבּוּזִי может указывать на принадлежность к народу или роду Вуза.
  - marker: b
    text: 'Или: «за то, что он считал себя праведнее Бога».'
    reason: Заключительная конструкция допускает более сильное сравнительное понимание; основной текст сохраняет более сдержанный контраст самооправдания Иова с оправданием Бога.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Передаёт образ «горящего» гнева в естественной и достойной современной русской форме.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל
  choice: Елиуя, сына Варахиила
  rationale: Имена переданы в традиционной русской библейской форме; родительная конструкция естественна после «гнев Елиуя».
- source_word: הַבּוּזִי
  choice: вузитянина
  rationale: Передаёт этническую или родовую принадлежность; неоднозначность уточняется сноской.
- source_word: מִמִּשְׁפַּחַת רָם
  choice: из рода Рама
  rationale: «Род» естественно обозначает семейно-клановую группу и сохраняет значение исходного предлога.
- source_word: בְּאִיּוֹב חָרָה אַפּוֹ
  choice: Он разгневался на Иова
  rationale: Передаёт повтор формулы гнева, не создавая тяжеловесного буквального повтора «воспылал его гнев».
- source_word: עַל צַדְּקוֹ נַפְשׁוֹ
  choice: за то, что тот оправдывал себя
  rationale: 'Глагольная форма имеет судебно-оценочный оттенок, а נַפְשׁוֹ здесь естественно функционирует возвратно: «себя».'
- source_word: מֵאֱלֹהִים
  choice: а не Бога
  rationale: 'Передаёт сравнительно-контрастную силу מִן: самооправдание Иова противопоставляется оправданию Бога, без усиления до недвусмысленного заявления о нравственном превосходстве.'
theological_decisions:
- issue: Смысл выражения עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים
  choice: за то, что тот оправдывал себя, а не Бога
  alternative: за то, что он считал себя праведнее Бога
  rationale: Основной текст сохраняет контраст между самооправданием Иова и правотой Бога, не превращая трудную сравнительную конструкцию в более сильное и однозначное утверждение. Возможное сравнительное прочтение дано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Повтор еврейской формулы гнева сохранён смыслово и частично образно, но стилистически разнообразен ради естественности.
