  text: אֲדַבְּרָ֥ה וְ/יִֽרְוַֽח לִ֑/י אֶפְתַּ֖ח שְׂפָתַ֣/י וְ/אֶֽעֱנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/020.yaml
  text: I will speak[a], that I may find relief; I will open my lips and answer.
translation:
  language: ru
  text: Заговорю — и мне станет легче[a]; открою уста и отвечу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы мне стало легче»; возможно также: «и это принесёт мне облегчение». Союз в еврейском тексте допускает оттенок как цели, так и результата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: Заговорю
  rationale: Когортатив первого лица выражает решимость говорящего. «Заговорю» естественно передаёт намерение начать говорить и хорошо связано с последующим «открою уста».
- source_word: וְיִרְוַח לִי
  choice: и мне станет легче
  rationale: Оборот обозначает наступление облегчения для говорящего. Сочинительная конструкция сохраняет возможный оттенок результата, не исключая целевой связи; неоднозначность пояснена в сноске.
- source_word: אֶפְתַּח
  choice: открою
  rationale: Прямое соответствие форме Qal imperfect первого лица; в контексте передаёт намерение говорящего.
- source_word: שְׂפָתַי
  choice: уста
  rationale: Источник буквально говорит о губах, однако в русском сочетание «открыть уста» является естественным, dignified и устойчивым образом начала речи, сохраняя телесную образность оригинала.
- source_word: וְאֶעֱנֶה
  choice: и отвечу
  rationale: Глагол ענה здесь означает «отвечать, откликаться» и соответствует контексту спора.
