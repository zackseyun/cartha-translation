  yaml_path: translation/ot/job/032/006.yaml
  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: ru
  text: 'Тогда Елиуй, сын Варахиила, из рода Буза, ответил:


    «Я молод годами, а вы — старцы;

    поэтому я робел[a] и боялся

    высказать вам то, что знаю[b].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отступал в нерешительности».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «высказать вам моё знание».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: ответил
  rationale: Обычная формула введения речи. Одного глагола «ответил» достаточно для естественного русского текста; он сохраняет диалогический характер, не предполагая прямого вопроса.
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: Елиуй, сын Варахиила, из рода Буза
  rationale: Использованы привычные русские формы личных имён. Обозначение הַבּוּזִי передано ясным родовым определением «из рода Буза», не смешивающим происхождение с местом жительства.
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: я молод годами
  rationale: Естественно передаёт еврейское выражение «молод днями», сохраняя его связь с возрастом.
- source_word: יְשִׁישִׁים
  choice: старцы
  rationale: Слово обозначает людей преклонного возраста; «старцы» звучит уважительно и соответствует возвышенному регистру речи Елиуя.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Ясно выражает причинно-следственную связь между разницей в возрасте и нерешительностью говорящего.
- source_word: זָחַלְתִּי
  choice: я робел
  rationale: Передаёт значение боязливой нерешительности и отступления перед старшими, оставаясь естественным в современном литературном русском.
- source_word: וָאִירָא
  choice: и боялся
  rationale: Сохраняет второй, усиливающий элемент парного выражения о нерешительности и страхе.
- source_word: מֵחַוּוֹת דֵּעִי אֶתְכֶם
  choice: высказать вам то, что знаю
  rationale: Глагол חוה означает сообщить или высказать, а דֵּעִי — знание говорящего. Такая формулировка естественнее буквального «высказать вам моё знание» и не ослабляет смысл до простого мнения.
