  text: לֹֽא רַבִּ֥ים יֶחְכָּ֑מוּ וּ֝/זְקֵנִ֗ים יָבִ֥ינוּ מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: ru
  text: Не многие мудры, и не старики понимают, что справедливо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правосудие», «суд» или «что правильно». Еврейское слово мишпат может означать судебное решение, справедливость, правосудие или должный порядок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא רַבִּים יֶחְכָּמוּ
  choice: Не многие мудры
  rationale: 'Отрицание относится к обобщённому утверждению: многочисленность сама по себе не означает мудрости. Краткая русская формулировка сохраняет афористичность еврейского текста.'
- source_word: וּזְקֵנִים
  choice: и не старики
  rationale: Здесь זְקֵנִים обозначает людей преклонного возраста, а не носителей должности; «старики» естественно передаёт противопоставление возраста подлинному пониманию.
- source_word: יָבִינוּ
  choice: понимают
  rationale: Форма от בין означает понимание или различение; «понимают» прямо и естественно передаёт смысл в данном обобщающем высказывании.
- source_word: מִשְׁפָּט
  choice: что справедливо
  rationale: מִשְׁפָּט охватывает суд, правосудие и должный порядок. В контексте речи о способности верно рассуждать оборот «что справедливо» передаёт морально-судебный смысл, не сужая его до судебной процедуры.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены краткость, параллелизм и характер общего изречения. Формулировка не утверждает, что мудрых среди многочисленных или пожилых вовсе нет, а отрицает автоматическую связь множества и возраста с мудростью и пониманием.
