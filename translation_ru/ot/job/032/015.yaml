lexical_decisions:
- source_word: חַתּוּ
  choice: смущены
  rationale: Глагол חתת может обозначать состояние сломленности, растерянности или ужаса. В данном контексте речь идёт о том, что друзья Иова оказались поставлены в тупик и замолчали; «смущены» естественно передаёт их внутреннюю растерянность, не усиливая значение до ужаса.
- source_word: עָנוּ
  choice: отвечают
  rationale: ענה здесь означает отвечать или давать ответ в ходе спора; «отвечают» точно соответствует контексту беседы.
- source_word: לֹא ... עוֹד
  choice: больше не
  rationale: 'Сочетание отрицания с עוֹד указывает на прекращение продолжавшегося действия: они уже не отвечают.'
- source_word: הֶעְתִּיקוּ מֵהֶם מִלִּים
  choice: слова покинули их
  rationale: Глагол עתק в породе хифиль выражает удаление или перемещение. Такое построение сохраняет образное представление о словах, ушедших от говорящих, и одновременно ясно передаёт, что им нечего сказать.
