  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: ru
  text: 'И я внимательно слушал вас[a], и вот: никто из вас не опроверг Иова[b] и не ответил на его слова.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я внимательно наблюдал за вами» или «Я тщательно рассматривал вас». Еврейский глагол означает внимательное рассмотрение или сосредоточенное наблюдение; в данном контексте он может подразумевать внимательное слушание речей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обличил Иова» или «исправил Иова». Еврейское слово может означать опровержение в споре, а также обличение, исправление или доказательство неправоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: Я внимательно вслушивался в вас
  rationale: Глагол בין в породе Hitpolel выражает сосредоточенное рассмотрение или наблюдение; в контексте речей друзей Иова естественно передать это как внимательное вслушивание. Предлог с местоименным суффиксом указывает, на кого направлено внимание.
- source_word: וְהִנֵּה
  choice: но вот
  rationale: Частица вводит итог наблюдения с риторическим акцентом. Союз «но» естественно передаёт контраст между внимательным слушанием и обнаруженным отсутствием убедительного ответа.
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: никто ... не смог опровергнуть Иова
  rationale: Причастие от יכח может обозначать того, кто доказывает неправоту, возражает или обличает. В контексте спора «опровергнуть» передаёт прежде всего аргументативный смысл, не исключая оттенка исправления.
- source_word: עוֹנֶה אֲמָרָיו
  choice: ответить на его слова
  rationale: Сочетание ענה с אֲמָרָיו обозначает ответ на сказанное Иовом; буквальная по структуре русская формулировка ясна и уместна.
- source_word: מִכֶּם
  choice: из вас
  rationale: Предлог מן указывает на человека, который должен был бы выйти из состава данной группы; «никто из вас» точно и естественно передаёт отрицательную конструкцию.
theological_decisions:
- issue: Характер действия מוֹכִיחַ по отношению к Иову
  choice: опровергнуть Иова
  alternative: обличить / исправить Иова
  rationale: Контекст словесного диспута поддерживает значение доказательства неправоты, однако нравственно-корректирующий оттенок еврейского слова сохранён в сноске как реальная лексическая возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной риторикой. «Но вот» сохраняет выразительность וְהִנֵּה без архаического «се»; синтаксис остаётся ясным для обычного читателя.
