  text: הֵ֤ן הוֹחַ֨לְתִּי לְֽ/דִבְרֵי/כֶ֗ם אָ֭זִין עַד תְּב֥וּנֹֽתֵי/כֶ֑ם עַֽד תַּחְקְר֥וּ/ן מִלִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/011.yaml
  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: ru
  text: Вот, я ждал[a] ваших слов, вслушивался в ваши рассуждения[b], пока вы искали слова[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надеялся услышать ваши слова». Еврейский глагол может обозначать ожидание, соединённое с надеждой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ваше понимание», «ваши соображения».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пока вы исследовали слова»; возможно также: «пока вы искали, что сказать». Заключительная фраза в еврейской поэзии кратка и допускает разные оттенки смысла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание к словам Елиуя; «вот» сохраняет её указательно-эмфатическую функцию и естественно звучит в современном литературном русском.
- source_word: הוֹחַלְתִּי
  choice: я ждал
  rationale: Глагол יחל может обозначать как ожидание, так и надежду. Здесь Елиуй говорит о том, что сдерживался и слушал старших, поэтому значение ожидания лучше соответствует контексту.
- source_word: לְדִבְרֵיכֶם
  choice: ваших слов
  rationale: Сочетание с предлогом ל передано естественной русской конструкцией «ждать ваших слов», то есть ждать, пока собеседники выскажутся.
- source_word: אָזִין
  choice: вслушивался
  rationale: Форма от אזן выражает внимательное слушание. «Вслушивался» передаёт не просто восприятие речи, а сосредоточенное внимание.
- source_word: תְּבוּנוֹתֵיכֶם
  choice: ваши рассуждения
  rationale: Множественное число תבונות может обозначать проявления понимания, соображения или рассуждения. В контексте спора речь идёт о ходе мысли собеседников, поэтому «рассуждения» естественно и не сужает смысл до отдельных удачных мыслей.
- source_word: תַּחְקְרוּן
  choice: вы искали
  rationale: Глагол חקר означает тщательно искать, исследовать или доискиваться. В сочетании со «словами» русское «искали слова» сохраняет образ поиска подходящего выражения.
- source_word: מִלִּין
  choice: слова
  rationale: Поэтическое, арамеизирующее множественное число буквально означает «слова». Сохранён прямой эквивалент без уточнения «доводы» или «ответ», которое могло бы излишне истолковать сжатую фразу.
