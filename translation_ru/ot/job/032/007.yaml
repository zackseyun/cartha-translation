lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Я говорил
  rationale: Прямое соответствие форме qal, перфект, 1-е лицо ед. числа от אמר. В контексте передаёт прежнее убеждение Елиуя; вариант «я думал» возможен по смыслу, но менее буквально отражает глагол.
- source_word: יָמִים
  choice: дни
  rationale: Сохранён буквальный поэтический образ и олицетворение. Здесь «дни» метонимически обозначают преклонный возраст или пожилых людей.
- source_word: יְדַבֵּרוּ
  choice: пусть говорят
  rationale: Форма piel, имперфект, 3-е лицо мн. числа. В контексте выражает ожидаемую уместность речи старших; «пусть» естественно передаёт эту модально-нормативную окраску, не превращая высказывание в простое предсказание.
- source_word: וְרֹב שָׁנִים
  choice: и множество лет
  rationale: Формально и поэтически передаёт «обилие/множество лет» и сохраняет параллелизм с «днями».
- source_word: יֹדִיעוּ
  choice: возвещает
  rationale: Hiphil, имперфект от ידע означает «давать знать, делать известным». «Возвещает» сохраняет каузативно-декларативный смысл и согласуется в русском с собирательно осмысленным сочетанием «множество лет».
- source_word: חָכְמָה
  choice: мудрость
  rationale: Прямое соответствие абстрактному существительному; сохраняет поэтический стиль и тему мудрости в книге Иова.
