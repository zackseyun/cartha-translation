  text: כִּ֭י מָלֵ֣תִי מִלִּ֑ים הֱ֝צִיקַ֗תְ/נִי ר֣וּחַ בִּטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: ru
  text: Ибо я полон слов; дух внутри меня теснит меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дух в моём чреве»; также возможно: «дух моего чрева».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: 'Передаёт причинно-пояснительную связь: Елиуй объясняет, почему должен заговорить.'
- source_word: מָלֵתִי מִלִּים
  choice: я полон слов
  rationale: Сохраняет образ переполненности невысказанными словами и естественно звучит по-русски.
- source_word: הֱצִיקַתְנִי
  choice: теснит меня
  rationale: Передаёт внутреннее давление и понуждение к речи, не сводя значение только к отвлечённому «заставляет».
- source_word: רוּחַ
  choice: дух
  rationale: Сохраняет многозначность רוּחַ и здесь обозначает внутреннюю движущую силу человека.
- source_word: בִּטְנִי
  choice: во чреве моём
  rationale: Передаёт конкретный древнееврейский образ внутренностей как средоточия внутренних переживаний, не заменяя его более абстрактным выражением.
theological_decisions:
- issue: Чей дух подразумевается
  choice: «дух» без уточнения его происхождения
  alternative: «мой дух» или «Дух Божий»
  rationale: Исходный текст говорит о духе во внутренностях Елиуя, но прямо не отождествляет его ни с личным духом посредством притяжательного местоимения, ни со Святым Духом; неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский с сохранением поэтического телесного образа. «Чрево» слегка возвышенно, но понятно в библейском контексте; инверсия «во чреве моём» поддерживает достоинство поэтической речи.
