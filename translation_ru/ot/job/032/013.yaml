  text: Lest you say[a], ‘We have found wisdom; God will vanquish him, not man.’
translation:
  language: ru
  text: 'Чтобы вы не сказали: «Мы нашли мудрость; Бог прогонит его, а не человек».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог одолеет его, а не человек»; возможно также: «Бог опровергнет его, а не человек». Еврейский глагол обычно означает «прогонять», «оттеснять» или «обращать в бегство», но здесь может шире обозначать победу над Иовом или опровержение его слов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן תֹּאמְרוּ
  choice: Не говорите
  rationale: Частица פֶּן вводит предостережение против возможного заявления. Русское «не говорите» естественно и ясно передаёт эту предостерегающую силу.
- source_word: מָצָאנוּ חָכְמָה
  choice: Мы нашли мудрость
  rationale: Сохранены обычное значение חָכְמָה и завершённость действия, выраженная перфектом מָצָאנוּ.
- source_word: אֵל
  choice: Бог
  rationale: В данном противопоставлении אֵל обозначает Бога, а не просто сильное существо.
- source_word: יִדְּפֶנּוּ
  choice: одолеет его
  rationale: Глагол נדף буквально связан с изгнанием или обращением в бегство, но здесь образно указывает на победу над Иовом, в том числе в споре. «Одолеет» сохраняет идею решительного преодоления, не сводя смысл только к физическому изгнанию.
- source_word: לֹא אִישׁ
  choice: а не человек
  rationale: Противительный союз «а» естественно выражает явное сопоставление Бога с человеком; אִישׁ употреблено здесь в обобщённом значении.
theological_decisions:
- issue: Смысл выражения אֵל יִדְּפֶנּוּ לֹא אִישׁ
  choice: Бог одолеет его, а не человек
  alternative: Бог прогонит его, а не человек; Бог опровергнет его, а не человек
  rationale: Основной текст сохраняет идею победы, заключённую в образе изгнания, но не решает однозначно, идёт ли речь о поражении, опровержении или удалении. Возможные оттенки указаны в сноске.
- issue: Обобщённое אִישׁ в противопоставлении Богу
  choice: человек
  alternative: кто-либо из людей
  rationale: Речь идёт не о мужчине как таковом, а о человеческом участнике в противоположность Богу. «Человек» точно и кратко сохраняет форму исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, весомая формулировка прямой речи. Синтаксический параллелизм и противопоставление Бога человеку сохранены без конфессионально обусловленного уточнения.
