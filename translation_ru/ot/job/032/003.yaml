  yaml_path: translation/ot/job/032/003.yaml
  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: ru
  text: Он разгневался и на трёх друзей Иова за то, что они не нашли ответа, но осудили Иова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признали Иова виновным»; или: «сочли Иова нечестивым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: И на трёх друзей Иова
  rationale: Предлог ב при идиоме חרה אף обозначает того, на кого направлен гнев. Имя Иова вместо местоимения естественно по-русски проясняет, чьи это друзья, не меняя смысла контекста.
- source_word: חָרָה אַפּוֹ
  choice: воспылал его гнев
  rationale: Сохранена древнееврейская метафора разгорающегося гнева; выражение звучит литературно и понятно в современном русском языке.
- source_word: עַל אֲשֶׁר
  choice: за то, что
  rationale: Оборот вводит причину гнева; русское «за то, что» естественно передаёт причинное отношение и направленность негодования.
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: они не нашли ответа
  rationale: מַעֲנֶה означает ответ или возражение в споре. Буквальное «не нашли ответа» ясно передаёт, что друзья не сумели дать убедительный ответ.
- source_word: וַיַּרְשִׁיעוּ
  choice: но осудили
  rationale: 'Хифиль от רשע имеет значение «признать виновным, осудить». Союз «но» выражает подразумеваемое противопоставление: ответа друзья не нашли, однако Иова осудили.'
- source_word: אֶת אִיּוֹב
  choice: Иова
  rationale: Прямое дополнение с личным именем передано стандартной русской формой имени в родительном-винительном падеже.
theological_decisions:
- issue: Характер действия друзей по отношению к Иову
  choice: осудили Иова
  alternative: признали Иова виновным; сочли Иова нечестивым
  rationale: Основной текст сохраняет судебно-декларативный оттенок формы וַיַּרְשִׁיעוּ, не усиливая её до утверждения о действительной нравственной или богословской виновности Иова. Возможный оттенок характеристики его как нечестивого отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Метафора «воспылал гнев» сохранена, а синтаксис сделан ясным для обычного читателя.
