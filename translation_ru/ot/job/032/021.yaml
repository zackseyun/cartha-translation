  text: אַל נָ֭א אֶשָּׂ֣א פְנֵי אִ֑ישׁ וְ/אֶל אָ֝דָ֗ם לֹ֣א אֲכַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/021.yaml
  text: Please[a], let me not show partiality to any man[b], nor flatter any person.
translation:
  language: ru
  text: Да не стану я проявлять пристрастие к кому-либо[a] и льстить ни одному человеку[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимать лицо человека» — древнееврейская идиома, означающая оказывать предпочтение или проявлять лицеприятие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не стану величать ни одного человека почётными именами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: Да не стану я
  rationale: Сочетание отрицательной частицы אַל с נָא выражает настойчивое пожелание или зарок. Конструкция «да не стану я» естественно передаёт волитивный оттенок, не превращая слова Елиуя в обращённую к другому лицу просьбу.
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: проявлять пристрастие к кому-либо
  rationale: Буквально «поднимать лицо человека» — древнееврейская идиома со значением оказывать предпочтение, быть лицеприятным. Выбран ясный современный эквивалент; неопределённое אִישׁ передано обобщённым «кому-либо».
- source_word: וְאֶל אָדָם
  choice: и ... ни одному человеку
  rationale: אָדָם обозначает человека и образует параллель с אִישׁ. Отрицательное «ни одному человеку» естественно сочетается в русском с последующим לֹא и сохраняет всеобщий смысл высказывания.
- source_word: לֹא אֲכַנֶּה
  choice: льстить
  rationale: Пиэль глагола כנה здесь может обозначать обращение к человеку с почётным или льстивым наименованием. В контексте беспристрастной речи «льстить» кратко и естественно передаёт этический смысл, а более буквальная возможность отмечена в сноске.
