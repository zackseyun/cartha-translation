  text: Elihu had waited to speak to Job[b][a], because they were older than he in days.
translation:
  language: ru
  text: Елиуй ждал, прежде чем заговорить с Иовом[a], потому что они были старше его годами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Елиуй ждал Иова в словах»; этот оборот означает, что он ждал, прежде чем заговорить с Иовом.'
