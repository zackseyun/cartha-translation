  - marker: b
    text: 'Или: «были старше его по возрасту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: Елиуй
  rationale: Имя передано в принятой русской библейской форме. Союз ו в данном повествовательном переходе не требует отдельного русского соответствия.
- source_word: חִכָּה
  choice: ждал
  rationale: Глагол означает «ждать, медлить». Простое прошедшее время естественно по-русски передаёт фоновое действие; контекст следующего стиха показывает, что ожидание завершилось.
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: ждал, пока можно будет обратиться к Иову
  rationale: Буквальная конструкция «ждал Иова в словах» по-русски неясна. В контексте она означает, что Елиуй выжидал перед тем, как заговорить с Иовом; формулировка сохраняет направленность речи к Иову и мотив сдержанного ожидания.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит прямое причинное объяснение ожидания Елиуя.
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ
  choice: они были старше его
  rationale: Сравнительная конструкция указывает на возраст, а не на должность или статус старейшин. Множественное «они» относится к Иову и его собеседникам в контексте.
- source_word: לְיָמִים
  choice: годами
  rationale: Буквально выражение связано с «днями», но идиоматически означает возраст. Русское «старше годами» сохраняет образ измерения возраста и звучит литературно.
