lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к яркому сравнению; «вот» естественно и достойно передаёт её указательную силу.
- source_word: בִטְנִי
  choice: чрево моё
  rationale: בטן буквально обозначает живот, утробу и может указывать на внутреннее естество. «Чрево» сохраняет телесный образ и вместе с тем допускает метафорический смысл внутреннего напряжения.
- source_word: כְּיַיִן
  choice: как вино
  rationale: Перевод сохраняет простое сравнение; идея брожения подразумевается образом давления, но прямо в еврейском тексте не выражена.
- source_word: לֹא יִפָּתֵחַ
  choice: которому нет выхода
  rationale: Буквально форма означает «не открывается» или «не открыто». В данном образе речь о вине, из которого не выпущено давление; формулировка передаёт смысл естественно, не устраняя буквальную альтернативу, указанную в примечании.
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: как новые мехи
  rationale: אֹבוֹת здесь — кожаные сосуды для жидкостей, в частности вина; «мехи» — традиционное и понятное русское обозначение такого сосуда. חֲדָשִׁים прямо передано словом «новые».
- source_word: יִבָּקֵעַ
  choice: оно вот-вот лопнет
  rationale: Глагол בקע означает расколоться, разорваться. «Вот-вот лопнет» естественно выражает предельное, близкое к разрыву давление в сравнении; местоимение соотносится с чревом говорящего.
