translation_notes:
  register: Современный литературный русский с сохранением конкретного телесного образа оригинала. Слово «чрево» несколько возвышенное, но общепонятное и лучше, чем нейтральный «живот», передаёт одновременно физическую и внутреннюю метафорику стиха. Синтаксис сохраняет напряжённую параллельность двух сравнений.
