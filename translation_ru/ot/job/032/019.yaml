  yaml_path: translation/ot/job/032/019.yaml
  text: Look[a], my belly is like wine that has no vent[b]; like new wineskins it is about to burst.
translation:
  language: ru
  text: Вот, нутро моё — как вино, которому нет выхода[a]; оно вот-вот лопнет, как новые мехи[b].
  philosophy: optimal-equivalence
  footnotes:
