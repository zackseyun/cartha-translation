lexical_decisions:
- source_word: מִי זֶה
  choice: Кто это
  rationale: Сохраняет краткий, подчёркнуто вызывающий вопрос еврейского текста и естественно звучит по-русски.
- source_word: מַחְשִׁיךְ
  choice: омрачает
  rationale: Передаёт метафору затемнения, то есть лишения ясности, не заменяя её толкованием вроде «искажает» или «запутывает».
- source_word: עֵצָה
  choice: замысел
  rationale: В данном контексте «замысел» естественнее русского «совет» и сохраняет возможное указание на намерение или цель, не сужая смысл до простого совета как рекомендации.
- source_word: בְמִלִּין
  choice: словами
  rationale: 'Творительный падеж естественно передаёт инструментальное значение предлога ב: омрачение совершается посредством слов.'
- source_word: בְּלִי דָעַת
  choice: без знания
  rationale: Близко передаёт еврейское выражение и не подменяет «знание» более толковательными вариантами «понимание», «смысл» или «невежество».
theological_decisions:
- issue: Значение עֵצָה в Божьей речи
  choice: замысел
  alternative: совет; намерение
  rationale: В контексте слово может обозначать как мудрое решение, так и намерение или цель. «Замысел» сохраняет связь с Божьим намерением, а сноска удерживает более широкий спектр значений, не разрешая богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и обличительной интонацией. Конструкция «словами без знания» намеренно сохраняет лаконизм и смысловую напряжённость оригинала.
