lexical_decisions:
- source_word: וָאֹמַר
  choice: И сказал Я
  rationale: Форма wayyiqtol 1-го лица ед. числа продолжает рассказ о действиях Бога; постпозиция местоимения естественно подчёркивает говорящего в возвышенной русской речи.
- source_word: עַד פֹּה תָבוֹא
  choice: Досюда дойдёшь
  rationale: Сочетание עַד פֹּה обозначает предельную пространственную границу, а обращение во 2-м лице сохраняет олицетворение моря.
- source_word: וְלֹא תֹסִיף
  choice: и не дальше
  rationale: Глагол יסף буквально означает «прибавлять, продолжать»; в контексте установленной границы краткая русская формула точно передаёт запрет двигаться дальше.
- source_word: וּפֹא יָשִׁית
  choice: здесь остановятся
  rationale: Буквально глагол שׁית означает «ставить, помещать». В данном контексте он указывает на место, где движение волн полагается или пресекается; контекстуальное «остановятся» естественно по-русски, а буквальная неопределённость отмечена в сноске.
- source_word: בִּגְאוֹן גַּלֶּיךָ
  choice: твои гордые волны
  rationale: גאון может означать гордость, величие или надменное возвышение; применительно к вздымающимся морским волнам определение «гордые» сохраняет образ и согласуется с их олицетворением.
theological_decisions:
- issue: Олицетворение моря, которому Бог устанавливает предел
  choice: Сохранено прямое обращение к морю во 2-м лице и повелительно-граничная формулировка.
  alternative: Передать море исключительно как безличную природную силу.
  rationale: Еврейский текст поэтически обращается к морю как к собеседнику, подчёркивая верховную власть Бога над творением, но не представляя море самостоятельным божеством или соперником.
- issue: Неопределённый синтаксис заключительной строки
  choice: В основном тексте передан контекстуальный смысл прекращения движения волн, а буквальная образность глагола сохранена в сноске.
  alternative: 'Буквально: «здесь будет положена гордость твоих волн».'
  rationale: Буквальный русский вариант неясен и неестественен; при этом сноска не позволяет скрыть необычность еврейского выражения и его возможные смысловые оттенки.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической божественной речи. Краткие пространственные формулы «досюда» и «не дальше» подчёркивают установленную Богом границу; олицетворение моря сохранено без дополнительной мифологизации.
