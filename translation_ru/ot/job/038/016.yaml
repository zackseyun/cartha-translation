lexical_decisions:
- source_word: הֲבָאתָ עַד
  choice: Достигал ли ты
  rationale: Сочетание בוא с עַד выражает движение до предела или места назначения. «Достигал ли» естественно передаёт прямой вопрос и идею достижения скрытого места.
- source_word: נִבְכֵי יָם
  choice: источников моря
  rationale: Редкое נִבְכֵי допускает понимание как мест, откуда выходят воды, то есть источников моря. В сноске сохранено возможное пространственное понимание как сокровенных глубин.
- source_word: וּ
  choice: и
  rationale: Сохранено обычное соединительное значение еврейского וּ в параллельных вопросительных частях; русский вопрос естественно охватывает обе части.
- source_word: בְחֵקֶר תְּהוֹם
  choice: в тайниках бездны
  rationale: חֵקֶר связано с исследованием до предела и может обозначать недоступные, сокровенные области. «Тайники» передаёт пространственный образ, а «бездна» сохраняет поэтическую и космологическую ёмкость תְּהוֹם.
- source_word: הִתְהַלָּכְתָּ
  choice: бродил ли
  rationale: Hitpael глагола הלך указывает на хождение или передвижение по некоторому пространству. «Бродил» передаёт продолжительное хождение внутри недоступных областей, не превращая образ в отвлечённое «исследование».
