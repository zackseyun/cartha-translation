base_translation:
  language: en
  yaml_path: translation/ot/job/038/018.yaml
  text: Have you comprehended the expanse of the earth? Tell me, if you know it all.
translation:
  language: ru
  text: Охватил ли ты разумом просторы земли? Скажи, если знаешь её всю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְבֹּנַנְתָּ
  choice: охватил ли ты разумом
  rationale: Глагол בּין в породе hitpael здесь означает внимательное постижение, осмысление; выражение передаёт не физическое обозрение, а полноту понимания.
- source_word: רַחֲבֵי אָרֶץ
  choice: просторы земли
  rationale: Множественная форма רַחֲבֵי обозначает широты, обширные пространства; «просторы» естественно и точно звучит по-русски.
- source_word: הַגֵּד
  choice: скажи
  rationale: Прямой императив сохранён без добавления косвенного дополнения, отсутствующего в еврейском тексте.
- source_word: כֻלָּהּ
  choice: её всю
  rationale: 'Женский суффикс относится к אָרֶץ («земля»): речь идёт о знании земли во всей её полноте.'
theological_decisions:
- issue: Объём человеческого знания в риторическом вопросе Бога
  choice: 'Сохранён прямой вызов: «если знаешь её всю»'
  alternative: «если всё это знаешь»
  rationale: Местоименный суффикс грамматически указывает на землю, а формулировка сохраняет риторическую силу и не добавляет богословских уточнений.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но понятный регистр. Параллелизм двух риторических фраз сохранён.
