  text: Where is the way to the dwelling of light[a], and where is the place of darkness,
translation:
  language: ru
  text: Где путь к жилищу света[a] и где место тьмы?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Где тот путь, на котором обитает свет, и тьма — где её место?»'
    reason: Сохраняет более формальное строение еврейского текста и глагольный образ обитающего света.
lexical_decisions:
- source_word: אֵי זֶה
  choice: где
  rationale: В контексте вопрос направлен на местонахождение или путь; естественное русское «где» передаёт эту функцию без излишней буквальности.
- source_word: הַדֶּרֶךְ
  choice: путь
  rationale: Сохраняет образ дороги или доступа и хорошо сочетается с направлением к жилищу света.
- source_word: יִשְׁכָּן אוֹר
  choice: к жилищу света
  rationale: Еврейский текст буквально говорит о пути, где обитает свет. Номинальная формулировка естественна по-русски и сохраняет олицетворённый образ света, имеющего жилище.
- source_word: אוֹר
  choice: света
  rationale: Обычный эквивалент; в контексте противопоставлен тьме.
- source_word: וְחֹשֶׁךְ
  choice: и ... тьмы
  rationale: Сохраняет соединение и параллельное противопоставление света и тьмы.
- source_word: מְקֹמוֹ
  choice: место тьмы
  rationale: Суффикс третьего лица относится к тьме; повтор существительного по-русски яснее, чем «её место», и сохраняет смысл принадлежности.
