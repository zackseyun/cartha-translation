    и утоляешь голод молодых львов?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתָצוּד
  choice: Разве ты добываешь
  rationale: Вопросительная частица с формой Qal imperfect 2 м. ед. образует обращённый к Иову риторический вопрос. «Добываешь» естественно передаёт охоту за добычей без добавления отсутствующего в тексте объекта «добычу».
- source_word: לְלָבִיא
  choice: для львицы
  rationale: לָבִיא может обозначать льва или львицу; упоминание молодых львов допускает контекст кормящей самки, поэтому выбран естественный в контексте женский род, хотя грамматически значение не однозначно.
- source_word: טָרֶף
  choice: пищу
  rationale: טָרֶף — добыча, служащая пищей хищнику. В сочетании с «добываешь» слово «пищу» избегает неестественного повтора «добываешь добычу» и сохраняет смысл.
- source_word: וְחַיַּת
  choice: голод
  rationale: Буквально форма связана с «жизнью» или «жизненной силой», но в сочетании с מלא и применительно к молодым львам обозначает их жизненную потребность, то есть голод.
- source_word: כְּפִירִים
  choice: молодых львов
  rationale: כְּפִירִים обозначает молодых львов; этот вариант точен и естественнее, чем более узкое «львят».
- source_word: תְּמַלֵּא
  choice: утоляешь
  rationale: Piel imperfect 2 м. ед. от מלא буквально означает «наполняешь»; с существительным «голод» современное русское идиоматическое соответствие — «утоляешь».
