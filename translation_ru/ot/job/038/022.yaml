  text: הֲ֭/בָאתָ אֶל אֹצְר֣וֹת שָׁ֑לֶג וְ/אֹצְר֖וֹת בָּרָ֣ד תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/022.yaml
  text: Have you entered the storehouses of the snow[a], or have you seen the storehouses of the hail?
translation:
  language: ru
  text: Входил ли ты в хранилища снега[a] и видел ли хранилища града?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровищницы снега… сокровищницы града».'
    reason: 'Лексическая альтернатива для אֹצְרוֹת: слово может означать как хранилища запасов, так и сокровищницы.'
lexical_decisions:
- source_word: הֲבָאתָ אֶל
  choice: Входил ли ты в
  rationale: Вопросительная частица с глаголом בוא во 2-м лице единственного числа образует риторический вопрос; предлог אֶל задаёт движение к внутреннему пространству, поэтому «входил… в» естественно передаёт конкретный образ.
- source_word: אֹצְרוֹת
  choice: хранилища
  rationale: אֹצָר может обозначать сокровищницу, кладовую или хранилище. «Хранилища» ясно передаёт образ места, где сберегаются запасы природных явлений, не сужая его до денежных сокровищ.
- source_word: שָׁלֶג
  choice: снега
  rationale: Обычное русское соответствие названию данного вида осадков; родительный падеж естественен после «хранилища».
- source_word: וְאֹצְרוֹת
  choice: и видел ли хранилища
  rationale: Союз וְ сохранён как «и», а сказуемое תִּרְאֶה выражено при второй части, как в еврейском параллелизме.
- source_word: בָּרָד
  choice: града
  rationale: Стандартное соответствие метеорологическому термину; родительный падеж обусловлен словом «хранилища».
- source_word: תִּרְאֶה
  choice: видел ли
  rationale: Хотя форма морфологически имперфектная, в последовательности поэтических риторических вопросов русское прошедшее время естественно соотносится с предшествующим перфектом и спрашивает об опыте Иова.
