  text: Or who shut in the sea with doors when it burst out from the womb[b][a],
translation:
  language: ru
  text: И кто затворил море дверями, когда оно с силой вышло из утробы[a][b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлынуло из утробы»; еврейский глагол передаёт стремительное, сильное движение наружу.'
