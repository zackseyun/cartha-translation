  text: which I have reserved for a time of distress[a], for a day of battle and war[b],
translation:
  language: ru
  text: что Я сберёг на время бедствия[a], на день битвы и войны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Я удержал»; или: «что Я припас».'
