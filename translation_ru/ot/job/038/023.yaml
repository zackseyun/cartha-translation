lexical_decisions:
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительное местоимение отсылает к хранилищам снега и града в предыдущем стихе; форма множественного числа естественна по-русски при таком контексте.
- source_word: חָשַׂכְתִּי
  choice: Я сберёг
  rationale: Глагол может означать «удержать», «приберечь» или «сохранить». «Сберёг» передаёт намеренное сохранение для последующего употребления, не сводя смысл к простому отказу.
- source_word: לְעֶת
  choice: до времени
  rationale: Предлог לְ здесь указывает на срок или назначение сохранённого. «До времени» естественно сочетается с глаголом «сберёг» и сохраняет временной смысл.
- source_word: צָר
  choice: бедствия
  rationale: Слово обозначает беду, тесноту или тяжёлое положение; «бедствие» звучит весомо и понятно в данном контексте.
- source_word: לְיוֹם
  choice: до дня
  rationale: Сохраняет параллелизм с «до времени» и указывает на срок, для которого это сбережено.
- source_word: קְרָב
  choice: битвы
  rationale: Прямой и общеупотребительный русский эквивалент военного термина.
- source_word: וּמִלְחָמָה
  choice: и войны
  rationale: Сохраняет еврейское сочетание близких по смыслу военных терминов, не объединяя их в одно понятие.
theological_decisions:
- issue: Использование Богом природных сил в образах суда
  choice: 'Сохранить прямой смысл: Бог сберёг эти явления для времени бедствия, битвы и войны.'
  alternative: Истолковать выражение исключительно метафорически, как указание на провидение без военного смысла.
  rationale: Стих прямо называет битву и войну. Перевод сохраняет этот образ, не смягчая и не развивая его в отдельную богословскую систему.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Формы «сберёг» и «до времени» передают целенаправленное сохранение без архаизации. Местоимение «которые» требует связи с предыдущим стихом, как и в еврейском тексте.
