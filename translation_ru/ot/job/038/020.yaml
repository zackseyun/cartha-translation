  yaml_path: translation/ot/job/038/020.yaml
  text: that you might take it to its boundary[b][a], and that you might discern the paths to its house?
translation:
  language: ru
  text: чтобы ты мог отвести его к его пределу[a] и распознать пути к его дому?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «его» может относиться к свету или к мраку, о которых говорится в предыдущем стихе.
    reason: cross_reference
  - marker: b
    text: 'Или: «понять пути к его дому».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: чтобы
  rationale: 'В продолжении риторического вопроса частица вводит цель или предполагаемый результат: знать место света или тьмы — чтобы отвести его туда.'
- source_word: תִקָּחֶנּוּ
  choice: ты отвёл его
  rationale: Глагол לקח может означать «взять», «привести», «отвести». В сочетании с направлением אֶל естественное русское «отвёл» сохраняет идею сопровождения к назначенному месту; местоимение мужского рода может относиться и к свету, и к мраку.
- source_word: אֶל גְּבוּלוֹ
  choice: к его пределу
  rationale: גְּבוּל обозначает границу или предел. «Предел» уместен для поэтического образа назначенной области света либо мрака и не вносит политического оттенка слова «территория».
- source_word: וְכִי
  choice: и
  rationale: Вторая частица כִּי продолжает параллельную конструкцию; по-русски значение общей целевой связи естественно распространяется на соединённый союзом второй глагол без повторения «чтобы».
- source_word: תָבִין
  choice: распознал
  rationale: בין означает понимать, различать, постигать. «Распознал» передаёт способность разобраться в ведущих к дому путях, не сводя смысл лишь к наличию сведений.
- source_word: נְתִיבוֹת
  choice: пути
  rationale: נְתִיבוֹת — тропы, стези или пути. «Пути» звучит естественно и сохраняет пространственный образ.
- source_word: בֵּיתוֹ
  choice: его дому
  rationale: בַּיִת буквально означает «дом». Этот выбор сохраняет олицетворение света или мрака, имеющего собственный дом.
theological_decisions:
- issue: К чему относятся местоименные суффиксы единственного числа
  choice: Сохранена возможность отнести «его» как к свету, так и к мраку из Иов 38:19
  alternative: Явно назвать только свет или только мрак
  rationale: Еврейский текст не называет референт заново; оба существительных ближайшего контекста в русском языке мужского рода, поэтому неоднозначность можно сохранить естественно.
translation_notes:
  register: Современный литературный русский с сохранением поэтического олицетворения. Начальная строчная буква отражает синтаксическое продолжение вопроса предыдущего стиха; риторическая и намеренно не вполне определённая формулировка оригинала сохранена.
