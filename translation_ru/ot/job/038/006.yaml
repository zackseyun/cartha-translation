  language: ru
  text: На чём утверждены её основания[a], или кто положил её краеугольный камень[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её опоры» или «её опорные гнёзда». Еврейское слово обозначает основание, подножие либо опорное гнездо сооружения; глагол буквально передаёт погружение или вделывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кто бросил камень её угла». В строительном образе имеется в виду укладка краеугольного камня.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מָה
  choice: На чём
  rationale: Естественно передаёт вопрос о том, на какой опоре покоится сооружение, сохраняя строительный образ.
- source_word: אֲדָנֶיהָ
  choice: её основания
  rationale: אֶדֶן обозначает основание, подножие или опорное гнездо. «Основания» понятно современному читателю и сохраняет конкретный архитектурный образ; местоимение женского рода относится к земле в контексте.
- source_word: הָטְבָּעוּ
  choice: утверждены
  rationale: Пассивная форма глагола טבע выражает погружение или прочное установление. «Утверждены» естественно сочетается с основаниями и передаёт их прочную установку, хотя менее буквально, чем «погружены».
- source_word: אוֹ
  choice: и
  rationale: В параллельном русском риторическом вопросе союз «и» звучит естественно и связывает два взаимодополняющих образа; еврейское אוֹ буквально допускает «или», что отмечено в сноске.
- source_word: מִי
  choice: кто
  rationale: Прямо передаёт вопросительное местоимение.
- source_word: יָרָה
  choice: положил
  rationale: Буквально глагол может означать «бросил» или «метнул», но в строительном образе речь идёт об укладке камня; «положил» ясно передаёт это действие.
- source_word: אֶבֶן פִּנָּתָהּ
  choice: её краеугольный камень
  rationale: Устойчивое русское архитектурное выражение для буквального «камня её угла», сохраняющее метафору строительства земли.
theological_decisions:
- issue: Архитектурная метафора сотворения земли
  choice: Сохранить образы оснований и краеугольного камня.
  alternative: 'Передать описательно: «На чём держится земля?»'
  rationale: Божий вопрос Иову дан в поэтическом образе сооружения. Конкретная строительная метафора не должна превращаться ни в абстрактное объяснение, ни в современную космологическую формулировку.
- issue: Связь двух риторических вопросов
  choice: Передать אוֹ союзом «и», отметив буквальное «или» в сноске.
  alternative: «или кто положил»
  rationale: «И» создаёт в русском естественный поэтический параллелизм, но лексическая неоднозначность исходного союза сохранена в примечании.
translation_notes:
  register: Современный литературный русский с возвышенным, но доступным поэтическим звучанием. Сохранён архитектурный параллелизм; синтаксис сделан естественным для русского риторического вопроса.
