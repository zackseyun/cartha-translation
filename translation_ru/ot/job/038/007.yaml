  text: בְּ/רָן יַ֭חַד כּ֣וֹכְבֵי בֹ֑קֶר וַ֝/יָּרִ֗יעוּ כָּל בְּנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/007.yaml
  text: when the morning stars sang together[a], and all the sons of God shouted for joy?
translation:
  language: ru
  text: когда вместе пели утренние звёзды и все сыны Божьи[a] восклицали от радости?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «небесные существа», или «ангелы». Буквально с еврейского: «сыны Бога».'
    reason: Альтернативная смысловая передача древнееврейского выражения בְּנֵי אֱלֹהִים.
lexical_decisions:
- source_word: בְּ/רָן
  choice: когда… пели
  rationale: Предлог בְּ при инфинитиве רנן вводит придаточное времени. Глагол выражает ликующее пение или радостный возглас; в параллелизме естественно перевести «пели».
- source_word: יַחַד
  choice: вместе
  rationale: Передаёт одновременность и единство действия простым и естественным русским словом.
- source_word: כּוֹכְבֵי בֹקֶר
  choice: утренние звёзды
  rationale: Естественно передаёт конструкцию «звёзды утра», сохраняя поэтический образ.
- source_word: וַ/יָּרִיעוּ
  choice: восклицали от радости
  rationale: Порода hифиль глагола רוע/ריע обозначает громкий возглас, здесь явно ликующий; выбранная формулировка сохраняет праздничный смысл и поэтический параллелизм.
- source_word: כָּל
  choice: все
  rationale: Прямо передаёт значение всеохватности группы.
- source_word: בְּנֵי אֱלֹהִים
  choice: сыны Божьи
  rationale: Буквально сохраняет значимое древнееврейское выражение, не подменяя перевод толкованием «ангелы» или «небесные существа».
theological_decisions:
- issue: Кого обозначает выражение בְּנֵי אֱלֹהִים
  choice: 'В основном тексте: «сыны Божьи»'
  alternative: «небесные существа», «ангелы», «божественные существа»
  rationale: В книге Иова выражение, вероятно, относится к существам небесного совета, однако буквальная передача сохраняет образ и не устраняет заложенную в тексте богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтичности. Форма «сыны Божьи» намеренно немного торжественна и уместна для небесной сцены; синтаксис продолжает вопрос предыдущего стиха.
