  text: מִ/בֶּ֣טֶן מִ֭י יָצָ֣א הַ/קָּ֑רַח וּ/כְפֹ֥ר שָׁ֝מַיִם מִ֣י יְלָדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/029.yaml
  text: From whose womb did the ice come forth[a], and who gave birth to the frost of heaven?
translation:
  language: ru
  text: Из чьего чрева вышел лёд, и кто породил иней небес?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּטֶן מִי
  choice: Из чьего чрева
  rationale: Сочетание буквально обозначает источник рождения — «из чьего чрева». Такой перевод сохраняет поэтический образ рождения и естественно звучит в современном литературном русском.
- source_word: יָצָא
  choice: вышел
  rationale: Глагол означает «выйти». «Вышел» точно передаёт исходный образ и не добавляет отсутствующего в еврейском тексте уточнения.
- source_word: הַקָּרַח
  choice: лёд
  rationale: קֶרַח означает «лёд». В русском обобщённое употребление без определённого артикля естественно и не требует дополнительного указания определённости.
- source_word: וּכְפֹר שָׁמַיִם
  choice: и иней небес
  rationale: כְּפוֹר здесь означает иней, то есть ледяной налёт; «иней» точнее русского общего «мороз» передаёт наблюдаемое природное явление. Родительное «небес» сохраняет сжатую поэтическую конструкцию и космический масштаб образа.
- source_word: יְלָדוֹ
  choice: кто породил
  rationale: Форма от ילד означает «родить» и имеет местоименный суффикс мужского рода единственного числа, относящийся к инею. «Породил» сохраняет образ рождения, согласуется с вопросом «кто» и звучит поэтично, не будучи непонятным.
theological_decisions:
- issue: Олицетворение природных явлений через образ рождения
  choice: Сохранить вопросы о чреве и рождении буквально-образно
  alternative: Передать смысл отвлечённо как вопрос о происхождении льда и инея
  rationale: Еврейский текст намеренно изображает лёд и иней как рождённые. Сохранение метафоры поддерживает риторический смысл Божьей речи и не уточняет личность предполагаемого источника сверх сказанного.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической сжатостью. «Чрево» употреблено ради цельного образа рождения; «вышел» и «породил» сохраняют параллелизм двух полустиший.
