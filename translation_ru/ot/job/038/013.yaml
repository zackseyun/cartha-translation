base_translation:
  language: en
  yaml_path: translation/ot/job/038/013.yaml
  text: that it might take hold of the edges of the earth[a], and the wicked be shaken out of it[b],
translation:
  language: ru
  text: чтобы она ухватилась за края земли[a] и нечестивые были стряхнуты с неё[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за оконечности земли». Буквально по-еврейски: «за крылья земли» — поэтический образ её самых дальних краёв.'
    reason: lexical_alternative
  - marker: b
    text: Заря представлена так, словно она берёт землю за края и встряхивает её, как одежду, чтобы стряхнуть с неё нечестивых.
    reason: cultural_note
lexical_decisions:
- source_word: לֶאֱחֹז
  choice: чтобы она ухватилась
  rationale: Инфинитив с לְ продолжает вопрос предыдущего стиха и выражает цель или результат. Глагол אחז передаёт конкретный образ крепкого захвата; местоимение «она» указывает на зарю, названную ранее.
- source_word: בְּכַנְפוֹת
  choice: за края
  rationale: כָּנָף буквально означает «крыло», а во множественном числе в сочетании с «землёй» поэтически обозначает её края или оконечности. Русское управление «ухватиться за» естественно передаёт предлог בְּ.
- source_word: הָאָרֶץ
  choice: земли
  rationale: В космическом контексте речи о заре и мироустройстве имеется в виду вся земля, а не отдельная страна.
- source_word: וְיִנָּעֲרוּ
  choice: и ... были стряхнуты
  rationale: 'Форма нифаля от נער выражает страдательное действие: нечестивых стряхивают или вытряхивают. Перевод сохраняет грамматический фокус исходного текста и образ земли, которую встряхивают.'
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное обозначает людей, чьи поступки нравственно порочны. «Нечестивые» — краткое и привычное для библейской речи соответствие.
- source_word: מִמֶּנָּה
  choice: с неё
  rationale: Женский суффикс относится к «земле». В русском сочетание «стряхнуты с неё» естественно описывает удаление с поверхности и сохраняет образ исходного текста.
