  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲיֵשׁ לַמָּטָר
  choice: Есть ли у дождя
  rationale: Вопросительная частица с יֵשׁ и конструкцией с ל выражает наличие или принадлежность; по-русски это естественно передаётся оборотом «есть ли у».
- source_word: אָב
  choice: отец
  rationale: Сохранено буквальное родственное обозначение и отцовская метафора, поддержанная следующим глаголом рождения.
- source_word: אוֹ
  choice: и
  rationale: В русском поэтическом параллелизме последовательность взаимосвязанных риторических вопросов естественно соединяется союзом «и»; смысл не предполагает взаимоисключающей альтернативы.
- source_word: מִי
  choice: кто
  rationale: Прямое и естественное соответствие вопросительному местоимению.
- source_word: הוֹלִיד
  choice: породил
  rationale: Каузативная форма ילד означает «произвести на свет, породить». «Породил» сохраняет образ происхождения и связь с «отцом», оставаясь современным литературным словом.
- source_word: אֶגְלֵי טָל
  choice: капли росы
  rationale: Конструкция сопряжённого состояния буквально обозначает капли росы; выражение ясно и естественно по-русски.
