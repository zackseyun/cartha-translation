base_translation:
  language: en
  yaml_path: translation/ot/job/038/034.yaml
  text: Can you raise your voice to the clouds[b][a], so that an abundance of water covers you?
translation:
  language: ru
  text: Можешь ли ты поднять свой голос к туче[a], чтобы обилие вод покрыло тебя?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к облаку»; еврейское слово может обозначать плотное дождевое облако.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и обилие вод покроет тебя». Еврейский союз допускает как связь результата, так и простое соединение частей.'
    reason: structural_alternative
lexical_decisions:
- source_word: הֲתָרִים
  choice: Можешь ли ты возвысить
  rationale: Вопросительная частица и форма хифиль от רוּם выражают вопрос о способности поднять или возвысить голос. Такая формулировка естественно передаёт риторический вызов Бога.
- source_word: לָעָב
  choice: к туче
  rationale: עָב обозначает облако, нередко плотную дождевую тучу. Единственное число сохранено, а «туча» передаёт плотность и дождевой характер облака.
- source_word: קוֹלֶךָ
  choice: голос
  rationale: קוֹל здесь означает человеческий голос, обращённый к туче.
- source_word: וְשִׁפְעַת מַיִם
  choice: чтобы обилие вод
  rationale: שִׁפְעָה обозначает изобилие, множество или переливающийся поток. «Обилие вод» сохраняет количественный образ и не сводит его непременно к разрушительному наводнению.
- source_word: תְּכַסֶּךָּ
  choice: покрыло тебя
  rationale: Пиэль от כסה означает «покрывать»; суффикс второго лица мужского рода указывает на собеседника. Единственное число согласовано с собирательным выражением «обилие вод».
theological_decisions:
- issue: Связь между двумя частями стиха
  choice: 'Вторая часть передана как желаемый результат первой: человек обращает голос к туче, чтобы воды покрыли его.'
  alternative: 'Возможна более буквальная сочинительная связь: «и обилие вод покроет тебя».'
  rationale: Контекст содержит риторический вопрос о неспособности человека повелевать погодой. Союз וְ допускает связь результата, однако альтернативная сочинительная связь отмечена в сноске, чтобы не устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Единственное число «туче» следует форме еврейского текста; выражение «обилие вод» сохраняет его образность и грамматическую структуру.
