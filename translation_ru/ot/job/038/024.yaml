lexical_decisions:
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Где путь, по которому
  rationale: Сочетание אֵי זֶה с הַדֶּרֶךְ допускает вопрос о месте или способе. Формулировка «Где путь, по которому» естественна по-русски и близко передаёт еврейскую конструкцию.
- source_word: יֵחָלֶק
  choice: разделяется
  rationale: 'Нифаль от חלק выражает пассивное или возвратное значение: «быть разделённым, распределяться». «Разделяется» сохраняет краткость и неоднозначность образа.'
- source_word: אוֹר
  choice: свет
  rationale: Обычное значение אוֹר — «свет». Контекст позволяет понимать слово как молнию или связанное с бурей световое явление, но основной текст не сужает его значение.
- source_word: יָפֵץ
  choice: рассеивается
  rationale: Форма от פוץ передаёт рассеивание или распространение. Русское «рассеивается» естественно описывает движение ветра и сохраняет параллелизм.
- source_word: קָדִים
  choice: восточный ветер
  rationale: קָדִים обычно обозначает восточный ветер, нередко сухой ветер из пустынных областей, а не только направление.
- source_word: עֲלֵי אָרֶץ
  choice: над землёй
  rationale: Предлог с אֶרֶץ допускает значения «над землёй» и «по земле». «Над землёй» соответствует широкому космическому контексту речи Бога.
