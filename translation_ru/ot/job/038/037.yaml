translation:
  language: ru
  text: Кто может мудро исчислить облака или опрокинуть небесные сосуды[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «небесные бурдюки (или кувшины)». Это образ небесных вместилищ, из которых изливается дождь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос о способности, которой в данном контексте обладает Бог.
- source_word: יְסַפֵּר
  choice: может исчислить
  rationale: Пиэль глагола ספר здесь означает «сосчитать, исчислить»; сочетание с «может» естественно передаёт риторическую силу формы.
- source_word: שְׁחָקִים
  choice: облака
  rationale: В поэтическом и метеорологическом контексте слово обозначает облака, а не небо вообще.
- source_word: בְּחָכְמָה
  choice: мудро
  rationale: Наречная передача инструментально-обстоятельственного выражения естественна по-русски и сохраняет связь действия с мудростью.
- source_word: וְנִבְלֵי שָׁמַיִם
  choice: небесные сосуды
  rationale: נבל обозначает вместилище — бурдюк, кувшин или сосуд. «Небесные сосуды» сохраняет поэтический образ, не добавляя прямо не названную в еврейском тексте воду.
- source_word: יַשְׁכִּיב
  choice: опрокинет
  rationale: Хифиль от שכב буквально означает «уложить»; применительно к сосудам речь, вероятно, идёт о том, чтобы наклонить или опрокинуть их и тем самым излить содержимое.
