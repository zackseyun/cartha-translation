lexical_decisions:
- source_word: בְּצֶקֶת
  choice: когда … затвердевает
  rationale: Инфинитивная конструкция с בְּ передаёт временное обстоятельство. Глагольный образ связан с литьём или отвердеванием; применительно к пыли речь идёт о её уплотнении и превращении в твёрдую массу.
- source_word: עָפָר
  choice: земная пыль
  rationale: Слово обозначает пыль или рыхлую землю. Сочетание «земная пыль» ясно передаёт вещество почвы и не вызывает ненужной ассоциации с прахом умершего.
- source_word: לַמּוּצָק
  choice: в сплошную массу
  rationale: Производное от יצק может обозначать вылитое, отлитое или затвердевшее вещество. В данном контексте перевод естественно описывает результат уплотнения земли, а примечание сохраняет образ литья.
- source_word: וּרְגָבִים
  choice: и комья земли
  rationale: רְגָבִים — комья или глыбы почвы; явное добавление «земли» делает образ прозрачным для современного читателя.
- source_word: יְדֻבָּקוּ
  choice: слипаются
  rationale: Пассивная форма выражает соединение комьев вследствие прилипания. Русское «слипаются» кратко и естественно передаёт физический образ.
