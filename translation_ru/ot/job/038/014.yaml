  text: It is changed like clay under a seal[b][a], and they stand forth like a garment.
translation:
  language: ru
  text: Она изменяется[a], словно глина под печатью, и они выступают[b], словно одежда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Она поворачивается, словно глина под печатью». Еврейский глагол может также означать: «переворачивается» или «преобразуется».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и они выступают, словно одежда». Множественное «они» не имеет явно названного подлежащего; вероятно, речь идёт о чертах земной поверхности, которые становятся различимыми в свете зари.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: תִּתְהַפֵּךְ
  choice: изменяется
  rationale: Форма хитпаэль передаёт изменение облика земной поверхности; «изменяется» естественно сохраняет возвратно-пассивный оттенок, не уточняя механизм.
- source_word: כְּחֹמֶר חוֹתָם
  choice: словно глина под печатью
  rationale: Эллиптический образ описывает глину, на которой печать оставляет рельефный оттиск; русская формулировка ясно передаёт сравнение.
- source_word: וְיִתְיַצְּבוּ
  choice: её очертания выступают
  rationale: Множественное число не имеет явно названного подлежащего. По контексту речь, вероятно, о деталях или очертаниях земли, становящихся различимыми на рассвете; добавленное «очертания» делает русский текст понятным, но отмечается как контекстуальное истолкование.
- source_word: כְּמוֹ לְבוּשׁ
  choice: как складки одежды
  rationale: Буквально — «как одежда». Упоминание складок естественно связывает сравнение с выступающим рельефом, однако это уточнение не выражено в еврейском прямо и потому отмечено сноской.
