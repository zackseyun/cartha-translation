  register: Современный литературный русский с поэтической выразительностью. Женское «она» продолжает подразумеваемую в контексте «землю». Образ печати сохранён; неясное множественное подлежащее обозначено как «её очертания», а интерпретационное уточнение раскрыто в сноске.
