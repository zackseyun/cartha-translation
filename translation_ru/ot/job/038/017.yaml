  yaml_path: translation/ot/job/038/017.yaml
  text: Have the gates of death been revealed to you[a], or have you seen the gates of deep darkness?
translation:
  language: ru
  text: Открывались ли тебе врата смерти, и видел ли ты врата глубокой тьмы?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертной тени». Еврейское слово צַלְמָוֶת традиционно переводят так, но оно может также обозначать глубокую тьму или мрак вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִגְלוּ לְךָ
  choice: Открывались ли тебе
  rationale: Вопросительная частица הֲ и нифаль перфекта גלה образуют риторический вопрос. «Открывались ли тебе» естественно передаёт значение «были ли явлены/открыты тебе», не превращая пассивную конструкцию в активную.
- source_word: שַׁעֲרֵי מָוֶת
  choice: врата смерти
  rationale: Сочетание сохраняет конкретный поэтический образ входа в область смерти. «Врата» уместны в возвышенной поэзии и понятны современному читателю.
- source_word: וְשַׁעֲרֵי
  choice: и ... врата
  rationale: Союз ו передан основным значением «и», что сохраняет еврейский параллелизм и не превращает две взаимодополняющие части риторического вопроса в альтернативы.
- source_word: צַלְמָוֶת
  choice: глубокой тьмы
  rationale: Слово может обозначать густую, непроглядную тьму или мрак; такой перевод соответствует контексту подземной области, не закрепляя спорную этимологическую трактовку «тень смерти».
- source_word: תִּרְאֶה
  choice: видел ли ты
  rationale: Имперфект второго лица в поэтическом риторическом вопросе естественно передаётся русским прошедшим временем и согласуется с первой частью стиха.
