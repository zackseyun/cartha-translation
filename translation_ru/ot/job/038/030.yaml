  text: כָּ֭/אֶבֶן מַ֣יִם יִתְחַבָּ֑אוּ וּ/פְנֵ֥י תְ֝ה֗וֹם יִתְלַכָּֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/030.yaml
  text: The waters are hidden like stone[b][a], and the surface of the deep is frozen.
translation:
  language: ru
  text: 'Воды твердеют, как камень[a],

    и поверхность бездны сковывается[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «воды скрываются, как камень». Употреблённый здесь еврейский глагол необычен; по контексту он, вероятно, описывает, как вода при замерзании твердеет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поверхность бездны сцепляется»; то есть замерзает, становится сплошной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּאֶבֶן
  choice: как камень
  rationale: Предлог כְּ выражает сравнение; «как камень» сохраняет образ затвердевания, не превращая сравнение в прямое утверждение о превращении воды в камень.
- source_word: מַיִם
  choice: воды
  rationale: Форма מַיִם может обозначать воду как вещество, но поэтическое множественное «воды» естественно для возвышенного космического контекста.
- source_word: יִתְחַבָּאוּ
  choice: твердеют
  rationale: Обычное значение возвратной формы — «скрываются», однако сочетание «как камень» и параллельная строка указывают на затвердевание воды от холода. Необычность еврейского глагола сохранена в сноске.
- source_word: וּפְנֵי
  choice: и поверхность
  rationale: Буквально «и лицо», но применительно к водной бездне פָּנִים естественно обозначает её поверхность.
- source_word: תְהוֹם
  choice: бездны
  rationale: «Бездна» — традиционное и контекстуально точное обозначение глубинной массы вод; здесь слово не требует добавления «первозданная».
- source_word: יִתְלַכָּדוּ
  choice: сковывается
  rationale: Глагол передаёт значение схватывания, соединения или удерживания вместе. «Сковывается» сохраняет этот образ и в русском контексте естественно подразумевает замерзание, не делая его более явным, чем оригинал.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. «Сковывается» сохраняет конкретный образ исходного глагола и звучит естественно применительно к замерзающей водной поверхности.
