  text: אֵיפֹ֣ה הָ֭יִיתָ בְּ/יָסְדִ/י אָ֑רֶץ הַ֝גֵּ֗ד אִם יָדַ֥עְתָּ בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/004.yaml
  text: Where were you when I founded the earth? Tell me[a], if you know understanding.
translation:
  language: ru
  text: Где ты был, когда Я закладывал основание земли[a]? Скажи, если обладаешь разумением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Я основывал землю».'
    reason: 'Лексико-стилистический вариант передачи יסד: глагол может быть выражен кратко либо через образ закладывания основания.'
lexical_decisions:
- source_word: אֵיפֹה
  choice: Где
  rationale: Прямое вопросительное наречие места; краткая форма естественно передаёт силу Божьего вызова.
- source_word: הָיִיתָ
  choice: ты был
  rationale: Форма Qal perfect, 2-е лицо мужского рода единственного числа, в вопросе о прошлом естественно передаётся прошедшим временем.
- source_word: בְּיָסְדִי
  choice: когда Я закладывал основание
  rationale: 'Предлог ב при инфинитиве с суффиксом 1-го лица выражает одновременность: «когда Я основывал». Выбранная формулировка сохраняет заложенный в יסד архитектурный образ и звучит естественно по-русски.'
- source_word: אָרֶץ
  choice: земли
  rationale: В контексте космического творения речь идёт о земле как сотворённом мире, а не об отдельной стране или территории.
- source_word: הַגֵּד
  choice: Скажи
  rationale: Повелительная форма נגד требует объявить или сообщить ответ. Русское «Скажи» естественно сохраняет прямой, вызывающий тон; дополнение «Мне» в еврейском прямо не выражено и не добавляется.
- source_word: אִם
  choice: если
  rationale: Вводит условие с риторической, испытующей силой.
- source_word: יָדַעְתָּ
  choice: обладаешь
  rationale: В сочетании с абстрактным существительным בינה русское «обладаешь» идиоматично передаёт смысл «имеешь/знаешь» в рамках продолжающегося вызова.
- source_word: בִינָה
  choice: разумением
  rationale: Существительное обозначает понимание, проницательность или способность постигать; «разумение» сохраняет отвлечённое существительное и уместно для возвышенной речи книги Иова.
theological_decisions:
- issue: Образ основания земли в речи Бога о творении
  choice: закладывал основание земли
  alternative: основывал землю
  rationale: Перевод сохраняет прямо выраженное представление о Боге как Творце и архитектурную метафору глагола יסד, не развивая её в дополнительное учение.
- issue: Риторическое условие о разумении Иова
  choice: если обладаешь разумением
  alternative: если знаешь
  rationale: Сохранено условное и иронически-испытующее звучание фразы без утверждения или отрицания того, насколько Иов действительно разумен.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным регистром. Прямой вопрос и краткое повеление сохраняют торжественный и обличительный тон Божьей речи. Заглавное «Я» соответствует принятому русскому библейскому оформлению речи Бога.
