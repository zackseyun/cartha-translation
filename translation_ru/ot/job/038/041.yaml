  text: Who prepares its prey for the raven when its young cry out to God and wander about for lack of food?[a][b][c]
translation:
  language: ru
  text: Кто готовит ворону его добычу[a], когда[b] его птенцы взывают к Богу и скитаются без пищи?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пищу». Еврейское слово может означать как добычу, так и пищу вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что его птенцы взывают к Богу». Союз может иметь не временное, а причинное значение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «бродят»; возможный смысл — «блуждают». Еврейский глагол обозначает скитание или блуждание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос в речи Бога.
- source_word: יָכִין
  choice: готовит
  rationale: Хифиль глагола כון означает «приготовлять», «обеспечивать». «Готовит» сохраняет конкретность еврейского выражения и естественно сочетается с «добычей».
- source_word: לָעֹרֵב
  choice: ворону
  rationale: Предлог ל обозначает получателя или того, для кого нечто делается. Определённая форма единственного числа употреблена обобщённо — о вороне как представителе вида.
- source_word: צֵידוֹ
  choice: добычу
  rationale: ציד означает добычу, пойманную на охоте, а шире — пищу. Суффикс третьего лица относится к ворону; в русском дательный «ворону» уже ясно выражает принадлежность по смыслу, поэтому дополнительное «его» было бы тяжеловесным.
- source_word: כִּי
  choice: когда
  rationale: Союз вводит обстоятельство, при котором обнаруживается нужда птенцов. Временное прочтение естественно в контексте, но возможное причинное значение отмечено в сноске.
- source_word: ילדיו
  choice: его птенцы
  rationale: Буквально «его дети/детёныши»; применительно к птице современное русское «птенцы» точно и естественно.
- source_word: אֶל־אֵל
  choice: к Богу
  rationale: אֵל здесь обозначает Бога, а не требует передачи как собственного имени «Эль».
- source_word: יְשַׁוֵּעוּ
  choice: взывают
  rationale: Пиэль שוע передаёт громкий призыв о помощи. «Взывают» сохраняет направленность обращения к Богу и соответствует возвышенному, но понятному регистру.
- source_word: יִתְעוּ
  choice: скитаются
  rationale: Глагол תעה обозначает блуждание или скитание. В данном контексте слово передаёт беспокойное движение голодных птенцов без излишнего уточнения цели.
- source_word: לִבְלִי אֹכֶל
  choice: без пищи
  rationale: Выражение буквально указывает на отсутствие пищи; краткая русская формулировка сохраняет эту причинно-обстоятельственную связь.
theological_decisions:
- issue: Обращение птенцов к Богу
  choice: Сохранено прямое «взывают к Богу».
  alternative: Ослабить до «кричат» или истолковать как чисто образное описание.
  rationale: Еврейский текст прямо называет Бога адресатом вопля; перевод не должен устранять заложенное в тексте представление о Божьем попечении над творением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией, уместной для речи Бога. Синтаксис сохранён как единый риторический вопрос. «Ворон» употреблён как обобщённое название вида; местоимение «его» грамматически относится к ворону.
