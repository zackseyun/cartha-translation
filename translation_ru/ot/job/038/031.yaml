  text: Можешь ли ты связать цепи Плеяд[a][b] или ослабить узы Ориона?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое еврейское слово может означать «цепи», «узы», «перевязи» или соединение звёзд в скоплении.
    reason: lexical_alternative
