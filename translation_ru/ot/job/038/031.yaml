lexical_decisions:
- source_word: הַתְקַשֵּׁר
  choice: Можешь ли ты связать
  rationale: Вопросительная частица и форма 2-го лица вводят риторический вопрос о пределах человеческой власти. «Связать» сохраняет конкретный образ и естественно сочетается с «развязать» во второй части.
- source_word: מַעֲדַנּוֹת
  choice: узы
  rationale: Редкое слово, вероятнее всего, обозначает связи, перевязи или путы. «Узы» передают образ соединения и сохраняют параллель с «путами» Ориона, не принимая устаревшее толкование «сладостные влияния».
- source_word: כִּימָה
  choice: Плеяд
  rationale: 'Астрономическое название традиционно и с высокой вероятностью отождествляется со звёздным скоплением Плеяды; в родительном падеже по-русски: «Плеяд».'
- source_word: מֹשְׁכוֹת
  choice: путы
  rationale: 'Слово обозначает то, чем тянут или удерживают: верёвки, ремни, путы. «Путы» дают ясный образ небесных связей и хорошо сочетаются с глаголом «развязать».'
- source_word: כְּסִיל
  choice: Ориона
  rationale: В данном астрономическом контексте слово, обычно означающее «глупец», служит названием созвездия, традиционно отождествляемого с Орионом.
- source_word: תְּפַתֵּחַ
  choice: развязать
  rationale: Буквально глагол означает «открыть», но применительно к путам естественно выражает действие «развязать» или «освободить». «Развязать» сохраняет предметность образа и противопоставлено «связать».
