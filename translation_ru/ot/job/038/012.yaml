  text: Have you[a], in your days, commanded the morning[b], and caused the dawn to know its place?
translation:
  language: ru
  text: Повелевал ли ты когда-нибудь в жизни[a] утром и давал ли заре знать её место[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со [времени] твоих дней»; то есть за всю свою жизнь, когда-либо.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «давал заре знать её место». Еврейский глагол употреблён в каузативной форме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִיָּמֶיךָ
  choice: когда-нибудь в жизни
  rationale: Сочетание вопросительной частицы с מִן и «твои дни» спрашивает, делал ли Иов это хоть раз за всё время своей жизни. Русское выражение естественно передаёт смысл еврейского оборота.
- source_word: צִוִּיתָ
  choice: приказывал
  rationale: Глагол означает «приказывать, повелевать» и сохраняет образ властного распоряжения утру.
- source_word: בֹּקֶר
  choice: утру
  rationale: Прямое соответствие слову «утро»; дательный падеж обусловлен русским управлением глагола «приказывать».
- source_word: יָדַעְתָּה
  choice: указывал
  rationale: Каузативная форма ידע буквально означает «давал знать». В сочетании с «её место» русское «указывал» естественно передаёт причинный смысл, не устраняя олицетворение зари.
- source_word: שַׁחַר
  choice: заре
  rationale: «Заря» сохраняет поэтическое обозначение рассвета и параллель с «утром».
- source_word: מְקוֹמוֹ
  choice: её место
  rationale: Буквально «его место»; в русском местоимение согласуется с существительным женского рода «заря». Добавление смысла «назначенное место» было бы толкованием.
