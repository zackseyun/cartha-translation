lexical_decisions:
- source_word: בְּשׂוּמִי
  choice: когда Я… сделал
  rationale: Предлог ב с инфинитивом שׂוּם и суффиксом 1-го лица ед. числа имеет временное значение. Глагол «сделал» естественно передаёт наделение облака ролью одежды.
- source_word: עָנָן
  choice: облако
  rationale: Обычное значение עָנָן; в русском языке форма без артикля естественна.
- source_word: לְבֻשׁוֹ
  choice: ему одеждой
  rationale: לְבוּשׁ означает одежду, одеяние. Местоимение мужского рода отсылает к морю в предыдущем стихе; конструкция «сделал ему одеждой» сохраняет метафору и синтаксическую связь.
- source_word: וַעֲרָפֶל
  choice: а густую тьму
  rationale: עֲרָפֶל обозначает плотную атмосферную тьму или мрак. Союз «а» естественно оформляет поэтический параллелизм, не вводя противопоставления по смыслу.
- source_word: חֲתֻלָּתוֹ
  choice: пеленой
  rationale: Слово связано с обёртыванием и пеленанием. «Пелена» кратко и естественно продолжает образ новорождённого моря; возможный собирательный оттенок исходного слова отмечен в сноске.
