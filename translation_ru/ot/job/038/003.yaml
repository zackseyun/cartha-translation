  text: Препояшь же чресла, как мужчина[a]; Я буду спрашивать тебя, а ты дай Мне знать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приготовься, как воин». Буквально: «препояшь чресла, как мужчина» — это образ решительной готовности к действию.'
