lexical_decisions:
- source_word: אֱזָר נָא
  choice: препояшь же
  rationale: Императив אֱזָר сохраняет конкретный образ подпоясывания перед решительным действием; частица נָא здесь передана усилительным «же», уместным в контексте настойчивого вызова, а не вежливой просьбы.
- source_word: כְגֶבֶר
  choice: как мужчина
  rationale: גֶּבֶר обозначает мужчину, нередко с оттенком силы и мужества. Перевод сохраняет мужской образ исходного текста, не превращая его в утверждение о превосходстве мужчин.
- source_word: חֲלָצֶיךָ
  choice: чресла
  rationale: Слово буквально обозначает чресла или поясницу. В сочетании с «препояшь» традиционный русский образ остаётся кратким и выразительным; его идиоматический смысл пояснён в сноске.
- source_word: וְאֶשְׁאָלְךָ
  choice: Я буду спрашивать тебя
  rationale: שׁאל значит «спрашивать». Форма и контекст передают не единичный вопрос, а последующее вопрошание Бога.
- source_word: וְהוֹדִיעֵנִי
  choice: а ты объясняй Мне
  rationale: Побудительная форма породы hifil от ידע буквально означает «дай Мне знать, сообщи Мне». В русском контексте вопросов естественное «объясняй Мне» сохраняет требование Иову изложить своё знание, не сводя выражение только к формальному «отвечай».
theological_decisions:
- issue: Мужской образ в Божьем вызове
  choice: как мужчина
  alternative: как воин; как сильный человек
  rationale: Мужской образ גֶּבֶר сохранён, а его идиоматическая сила — призыв приготовиться мужественно и решительно — раскрыта в сноске. Формулировка не истолковывается как учение о превосходстве мужчин.
- issue: Смысл повеления וְהוֹדִיעֵנִי
  choice: а ты объясняй Мне
  alternative: а ты отвечай Мне; а ты дай Мне знать
  rationale: 'Выбранная формулировка удерживает напряжение сцены: Бог требует от Иова не просто реплики, а изложения знания. Более буквальное значение отмечено в сноске.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Препояшь чресла» сохранено ради конкретной метафоры оригинала, но разъяснено в сноске; синтаксис сделан ясным и естественным для современного читателя.
