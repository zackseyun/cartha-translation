  rationale: מְעוֹנוֹת — места обитания или укрытия зверей; «логова» соответствует контексту львиной охоты. Местоимение «своих» проясняет подразумеваемую принадлежность.
- source_word: יֵשְׁבוּ ... לְמוֹ אָרֶב
  choice: подстерегают добычу
  rationale: Сочетание буквального «сидят» с оборотом цели «для засады» идиоматически передаёт занятую в засаде позицию. «Добычу» добавлено как естественный объект русского глагола, ясно подразумеваемый контекстом 38:39.
- source_word: בַסֻּכָּה
  choice: в чаще
  rationale: Здесь סֻכָּה означает естественное укрытие, подходящее для засады, а не сооружённый шалаш; «чаща» передаёт этот образ в русском контексте.
