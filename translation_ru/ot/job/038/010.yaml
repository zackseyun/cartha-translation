lexical_decisions:
- source_word: וָאֶשְׁבֹּר
  choice: установил
  rationale: Хотя корень שׁבר обычно означает «ломать», буквальное значение здесь затруднительно. Контекст обуздания моря указывает на установление предела; «установил» естественно передаёт этот смысл, не вводя неясный образ буквального разрушения.
- source_word: עָלָיו
  choice: ему
  rationale: Суффикс мужского рода относится к морю из предшествующего контекста. Дательный оборот «установил ему границу» естественен для современного русского языка.
- source_word: חֻקִּי
  choice: границу
  rationale: חֹק может обозначать постановление, установленную меру или предел. В контексте сдерживания моря «граница» сохраняет конкретный пространственный смысл и подразумеваемое Божье установление.
- source_word: וָאָשִׂים
  choice: поставил
  rationale: Прямой и естественный эквивалент שׂים, подходящий к конкретным образам засовов и дверей.
- source_word: בְּרִיחַ
  choice: засовы
  rationale: בְּרִיחַ — запирающий брус или засов. Русское множественное число естественно в сочетании с «дверями» и передаёт образ преграды.
- source_word: וּדְלָתָיִם
  choice: двери
  rationale: Двойственное число указывает на пару створок; «двери» естественно сохраняет архитектурный образ, тогда как «ворота» было бы более интерпретирующим.
theological_decisions:
- issue: Антропоморфное изображение Божьей власти над морем
  choice: Сохранён конкретный образ границы, засовов и дверей.
  alternative: Передать стих абстрактно как утверждение о Божьей власти над природой.
  rationale: Поэтический текст выражает Божье владычество через образ моря, заключённого за преградой. Сохранение образа не сглаживает поэзию и не навязывает дополнительной догматической интерпретации.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Заглавная буква в местоимении «Я» соответствует принятому русскому библейскому регистру. Начальная строчная буква и конечная запятая сохраняют синтаксическую связь с окружающими стихами.
