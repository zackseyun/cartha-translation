base_translation:
  language: en
  yaml_path: translation/ot/job/038/033.yaml
  text: Do you know the ordinances of the heavens? Can you establish their rule on the earth?[a]
translation:
  language: ru
  text: Знаешь ли ты законы небес? Можешь ли установить их власть на земле?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его власть»; еврейский местоименный суффикс стоит в единственном числе и, вероятно, относится к небесам как к единому целому. Возможные переводы: «его господство» или «его порядок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: Знаешь ли ты
  rationale: Вопросительная частица с формой глагола ידע выражает вопрос о нынешнем знании; по-русски это естественно передаётся настоящим временем.
- source_word: חֻקּוֹת
  choice: законы
  rationale: Слово обозначает установленные предписания, пределы или постоянные установления. В космическом контексте «законы» ясно передаёт мысль о закреплённом порядке мироздания без излишне юридического оттенка.
- source_word: שָׁמָיִם
  choice: небес
  rationale: Форма множественного числа передана традиционным и возвышенным русским словом «небеса», уместным в контексте космоса.
- source_word: אִם
  choice: Можешь ли
  rationale: Здесь אִם вводит второй вопрос, параллельный первому; русская вопросительная конструкция передаёт его риторическую силу естественнее буквального «если».
- source_word: תָּשִׂים
  choice: установить
  rationale: Основное значение глагола — «поставить, поместить»; при существительном со значением власти он говорит о введении или утверждении её действия.
- source_word: מִשְׁטָרוֹ
  choice: их власть
  rationale: מִשְׁטָר означает власть, господство или управляющий порядок. Местоименный суффикс формально единственного числа, однако, вероятно, отсылает к небесам как к собирательному целому; в основном тексте русское «их» согласуется с множественным числом «небеса», а формальная особенность отмечена в сноске.
- source_word: בָאָרֶץ
  choice: на земле
  rationale: Предлог ב в этом контексте обозначает земную сферу, где действует небесный порядок; «на земле» — точная и естественная русская формулировка.
theological_decisions:
- issue: Характер небесного порядка
  choice: Стих говорит о постоянных законах небес и их власти, действующей на земле, не уточняя механизм этой связи.
  alternative: Понимать слова как прямое утверждение астрологического или созвездного воздействия на земные события.
  rationale: Контекст связан со звёздами и небесами, однако еврейские слова обозначают установления и власть и сами по себе не утверждают астрологического детерминизма. Перевод сохраняет образ космического управления, не конкретизируя его сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим Божьей речи. Параллельные вопросы сохранены; лексика понятна обычному читателю и не вносит конфессионально обусловленного толкования.
