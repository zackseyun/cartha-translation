translation:
  language: ru
  text: Кто проложил русло для ливня[a] и путь для громовой молнии?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для бурного потока». Буквально: «для потока… для молнии звуков (голосов)».'
    reason: Сохраняется смысловой диапазон שֶׁטֶף и необычное, неоднозначное сочетание חֲזִיז קֹלוֹת.
lexical_decisions:
- source_word: פִלַּג
  choice: прорубил
  rationale: Порода piel передаёт действие разделения или рассечения с образованием прохода; рядом с תְּעָלָה глагол естественно описывает прокладывание русла.
- source_word: שֶּׁטֶף
  choice: ливня
  rationale: Слово может обозначать бурный поток, наводнение или сильный ливень. В метеорологическом контексте и параллели с молнией «ливень» звучит естественно, при этом вариант «поток» сохранён в сноске.
- source_word: תְּעָלָה
  choice: русло
  rationale: Существительное обозначает канал или водовод. «Русло» ясно передаёт проложенный путь для стремительно льющейся воды и сохраняет поэтический образ.
- source_word: דֶרֶךְ
  choice: путь
  rationale: Обычное значение — путь или дорога; здесь это назначенный ход природного явления, параллельный руслу в первой строке.
- source_word: חֲזִיז קֹלוֹת
  choice: громовой молнии
  rationale: Редкое חֲזִיז обычно связывают с молнией, а קֹלוֹת буквально означает «голоса/звуки» и в грозовом контексте может указывать на гром. Перевод сохраняет оба компонента сочетания без буквального и неясного «молния голосов».
