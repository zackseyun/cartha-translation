source:
  edition: WLC
  text: וְ/יִמָּנַ֣ע מֵ/רְשָׁ אוֹרָ֑/ם וּ/זְר֥וֹעַ רָ֝מָ֗ה תִּשָּׁבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/015.yaml
  text: Their light is withheld from the wicked[b][a], and the uplifted arm is broken.
translation:
  language: ru
  text: И от нечестивых отнимается их свет, и поднятая рука[a] сокрушается[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рука» здесь, вероятно, служит образом силы или власти, особенно силы, применяемой для насилия.
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «будет сокрушена». Еврейская форма может обозначать как ярко представленное настоящее, так и будущее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִמָּנַע
  choice: отнимается
  rationale: Пассивная форма глагола מנע означает, что свет удерживается или отнимается; настоящее время передаёт живое поэтическое описание действия рассвета.
- source_word: מֵרְשָׁעִים
  choice: от нечестивых
  rationale: Предлог מִן выражает удаление или лишение, а רְשָׁעִים обозначает людей, творящих зло, без уточнения пола.
- source_word: אוֹרָם
  choice: их свет
  rationale: Суффикс третьего лица множественного числа сохранён; речь идёт о свете, которым пользовались нечестивые и которого они лишаются с наступлением рассвета.
- source_word: וּזְרוֹעַ
  choice: и рука
  rationale: זְרוֹעַ буквально обозначает руку и образно может указывать на силу или власть. В основном тексте сохранён конкретный поэтический образ.
- source_word: רָמָה
  choice: поднятая
  rationale: Форма от רום описывает руку как поднятую; это может подразумевать заносчивость или готовность применить силу, но текст не уточняет оттенок.
- source_word: תִּשָּׁבֵר
  choice: сокрушается
  rationale: Пассивная форма от שׁבר означает «быть сломанной, сокрушённой». Настоящее время подходит для наглядного поэтического описания, не исключая возможного будущего смысла.
theological_decisions:
- issue: Значение образа поднятой руки
  choice: Сохранить буквальный образ в основном тексте и пояснить вероятный переносный смысл в сноске.
  alternative: Передать непосредственно как «сила нечестивых сокрушается».
  rationale: Еврейский текст говорит о руке, а переносное значение силы или насилия вероятно, но не должно вытеснять исходный образ.
- issue: Временное значение תִּשָּׁבֵר
  choice: 'Передать поэтическим настоящим: «сокрушается».'
  alternative: «будет сокрушена».
  rationale: Имперфект допускает как яркое настоящее, так и будущее; основной перевод согласован с описанием действия рассвета, а альтернативное прочтение отмечено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. «Нечестивые» сохраняет нравственную категорию оригинала, а «сокрушается» естественно поддерживает образ сломанной силы и параллелизм стиха.
