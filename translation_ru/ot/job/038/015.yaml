  source_fidelity: 'Русский текст точно передаёт обе поэтические строки еврейского оригинала: свет лишается нечестивых, а поднятая (вознесённая) рука сокрушается. Множественный суффикс в «их свет» сохранён. Настоящее «сокрушается» является допустимой передачей еврейского имперфекта, при этом будущий оттенок корректно отмечен в сноске.'
