  terminology: «Нечестивые» адекватно передаёт רְשָׁעִים как нравственную категорию без гендерного уточнения. «Рука» обоснованно сохраняет буквальный образ זְרוֹעַ; сноска осторожно поясняет вероятный образ силы или насилия, не подменяя текст толкованием. Сноски привязаны к соответствующим словам и корректно отражают отмеченную английским аудитом неоднозначность.
