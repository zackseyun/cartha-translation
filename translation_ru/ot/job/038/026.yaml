  text: to make it rain on a land where no man is[a], on a wilderness in which there is no human,
translation:
  language: ru
  text: чтобы посылать дождь на землю, где нет никого[a], на пустыню, где нет человека,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «где нет человека… где нет человека». В еврейском тексте употреблены два близких, но разных слова: אִישׁ (иш — человек, некто) и אָדָם (адам — человек, человечество).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַמְטִיר
  choice: чтобы проливать дождь
  rationale: Порода хифиль выражает причинение дождя. «Проливать дождь» естественно по-русски передаёт действие того, кто даёт дождю идти, и сохраняет связь с предшествующим контекстом цели.
- source_word: עַל אֶרֶץ
  choice: на землю
  rationale: Здесь אֶרֶץ означает участок суши, на который выпадает дождь, а не весь мир; русский язык естественно употребляет «землю» без неопределённого артикля.
- source_word: לֹא אִישׁ
  choice: где нет никого
  rationale: В отрицательной конструкции אִישׁ имеет смысл «ни один человек, никто». Такой перевод современен и естественен, не создаёт ошибочного впечатления, будто речь только о мужчинах.
- source_word: מִדְבָּר
  choice: пустыню
  rationale: מִדְבָּר обозначает необитаемую дикую, невозделанную местность; в данном поэтическом контексте русское «пустыня» передаёт и безлюдность, и параллель с землёй без человека.
- source_word: לֹא אָדָם בּוֹ
  choice: где нет человека
  rationale: אָדָם здесь обозначает человека вообще. Конструкция с בּוֹ естественно передана относительным оборотом «где», без тяжеловесного «в которой».
theological_decisions:
- issue: Различение אִישׁ и אָדָם в параллельных строках
  choice: «никого» для אִישׁ и «человека» для אָדָם с пояснением в сноске
  alternative: «мужчины» и «человека» либо одинаковое «человека» в обеих строках
  rationale: Контекст говорит о полной безлюдности, а не об отсутствии только лиц мужского пола. Выбранный вариант сохраняет смысл и частично отражает лексическое различие; сноска сообщает особенность оригинала, не навязывая ей богословского значения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранён незавершённый синтаксис стиха, продолжающего вопрос из ближайшего контекста; запятая в конце соответствует продолжению предложения.
