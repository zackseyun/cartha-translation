  text: הֲ/תֹצִ֣יא מַזָּר֣וֹת בְּ/עִתּ֑/וֹ וְ֝/עַ֗יִשׁ עַל בָּנֶ֥י/הָ תַנְחֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/032.yaml
  text: Can you bring out the Mazzaroth in its season[b][a], or guide Ayish along with her children?
translation:
  language: ru
  text: Можешь ли ты выводить Маззарот в своё время[a] и вести Аиш вместе с её детьми?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Маззарот — редкий еврейский астрономический термин; возможно, он обозначает созвездия или знаки зодиака.
    reason: lexical_alternative
  - marker: b
    text: Аиш — еврейское название звезды или созвездия; его традиционно отождествляли с Арктуром, а многие понимают под ним Медведицу. «Дети», вероятно, означают сопутствующие звёзды.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֹצִיא
  choice: Можешь ли ты выводить
  rationale: Вопросительная частица и каузативная форма глагола יצא образуют риторический вопрос о способности вызывать появление небесных светил; «выводить» сохраняет образ движения и повторяемость сезонного появления.
- source_word: מַזָּרוֹת
  choice: Маззарот
  rationale: Редкий и не вполне ясный астрономический термин передан транслитерацией, чтобы не отождествлять его без достаточных оснований ни с созвездиями вообще, ни со знаками зодиака.
- source_word: בְּעִתּוֹ
  choice: в своё время
  rationale: Выражение обозначает надлежащее, назначенное время появления; русский оборот естественен и сохраняет временной смысл оригинала.
- source_word: וְעַיִשׁ
  choice: Аиш
  rationale: Неопределённое название звезды или созвездия сохранено в транслитерации; традиционные отождествления с Арктуром или Медведицей не бесспорны.
- source_word: עַל־בָּנֶיהָ
  choice: вместе с её детьми
  rationale: Передан женский суффикс и сохранена семейная метафора оригинала; в астрономическом образе «дети» могут обозначать сопутствующие звёзды.
- source_word: תַנְחֵם
  choice: вести
  rationale: Каузативная форма נחה означает вести или направлять; «вести» естественно описывает движение созвездия по небу, не добавляя отсутствующих в тексте деталей.
