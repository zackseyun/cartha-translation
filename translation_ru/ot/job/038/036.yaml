  source_fidelity: Перевод точно передаёт два риторических вопроса, глагольную пару «вложил / дал», союз «или» и различие между «мудростью» и «разумением». «В сокровенные глубины» является литературно естественной передачей трудного בַּטֻּחוֹת, не выдающей спорную анатомическую конкретизацию за несомненный смысл. «Уму» обоснованно передаёт предпочтительное контекстуальное понимание לַשֶּׂכְוִי.
