  terminology: «Мудрость» и «разумение» последовательно различены. Сноска ясно и без конфессионального навязывания фиксирует значимое альтернативное понимание второго трудного слова как названия птицы; также она отражает возможность понимать первое как «скрытые части». Маркер [a] поставлен на первом спорном выражении и охватывает относящуюся к обеим половинам стиха сноску.
