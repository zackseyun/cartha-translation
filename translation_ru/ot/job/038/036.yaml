  text: מִי שָׁ֭ת בַּ/טֻּח֣וֹת חָכְמָ֑ה א֤וֹ מִֽי נָתַ֖ן לַ/שֶּׂ֣כְוִי בִינָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/036.yaml
  text: Who has put wisdom in the inward parts[a], or who has given understanding to the mind?
translation:
  language: ru
  text: Кто вложил мудрость в сокровенные глубины[a], или кто дал разумение уму?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Кто вложил мудрость в скрытые части, или кто дал разумение петуху?» Второе редкое слово иногда понимают как название птицы — традиционно петуха, реже ибиса, — а не как «ум».'
    reason: Сохраняется существенная лексическая неоднозначность обоих редких еврейских слов.
lexical_decisions:
- source_word: מִי
  choice: кто
  rationale: Вопросительное местоимение вводит риторический вопрос Бога.
- source_word: שָׁת
  choice: вложил
  rationale: Передаёт значение «поместить, вложить» и естественно сочетается с мудростью как внутренним даром.
- source_word: בַּטֻּחוֹת
  choice: в сокровенные глубины
  rationale: Редкое и трудное слово, вероятно обозначающее внутренние или скрытые части. Формулировка сохраняет образ внутренней глубины, не сводя его без достаточных оснований к конкретному органу.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное соответствие еврейскому слову; сохраняет параллель с разумением.
- source_word: אוֹ
  choice: или
  rationale: Сохраняет разделительный союз между двумя параллельными вопросительными частями.
- source_word: נָתַן
  choice: дал
  rationale: Прямое и естественное соответствие глаголу со значением «дать».
- source_word: לַשֶּׂכְוִי
  choice: уму
  rationale: Значение слова спорно. Контекстуальная параллель с внутренними глубинами, мудростью и разумением поддерживает значение внутренней познавательной способности; возможное обозначение птицы отмечено в сноске.
- source_word: בִינָה
  choice: разумение
  rationale: Передаёт способность понимать и различать, сохраняя смысловое отличие от мудрости.
theological_decisions:
- issue: Толкование двух редких слов в контексте речи Бога о даровании мудрости
  choice: Обе части стиха относятся к внутренним познавательным способностям человека.
  alternative: Вторая часть может говорить о дарованном птице — традиционно петуху, иногда ибису — инстинктивном знании.
  rationale: Поэтический параллелизм поддерживает антропологическое прочтение, однако древнее и лексически возможное понимание второго слова как названия птицы нельзя исключить, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Синтаксический параллелизм и союз «или» сохранены; редкие слова переданы понятно, но без устранения их подлинной неоднозначности.
