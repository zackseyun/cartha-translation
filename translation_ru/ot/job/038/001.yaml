  text: וַ/יַּֽעַן יְהוָ֣ה אֶת אִ֭יּוֹב מנ ה/סערה וַ/יֹּאמַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/038/001.yaml
  text: Then Yahweh answered Job out of the whirlwind and said:[a]
translation:
  language: ru
  text: 'Тогда Яхве ответил Иову из бури[a] и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из вихря».'
    reason: 'Лексическая альтернатива: סְעָרָה может обозначать как бурю вообще, так и вихрь.'
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Глагол ענה в данной повествовательной форме означает «ответить»; выбор сохраняет связь с предшествующими речами Иова и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, что непосредственно отражает еврейский текст.
- source_word: אֶת אִיּוֹב
  choice: Иову
  rationale: Имя אִיּוֹב традиционно передаётся как «Иов»; русское управление глагола «ответить» требует дательного падежа, тогда как еврейский показатель прямого дополнения отдельно не переводится.
- source_word: מִן־הַסְּעָרָה
  choice: из бури
  rationale: Существительное סְעָרָה обозначает сильную бурю, грозную бурю или вихрь. «Из бури» точно, ёмко и естественно передаёт теофанический образ, не сужая его до одного вида атмосферного явления.
- source_word: וַיֹּאמַר
  choice: и сказал
  rationale: Прямое соответствие повествовательной форме אמר; повторять подлежащее по-русски не требуется.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя и не заменяет его титулом.
- issue: Степень конкретности образа סְעָרָה
  choice: буря
  alternative: вихрь
  rationale: Еврейское слово допускает более широкое значение сильной бури и более конкретный образ вихря. Основной текст сохраняет широкое значение, а допустимая более узкая передача приведена в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной повествовательной интонацией. Начальное «Тогда» передаёт последовательность повествования; двоеточие вводит последующую прямую речь.
