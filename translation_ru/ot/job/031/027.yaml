  choice: 'В основном тексте сохранено конкретное действие: «рука моя поцеловала мои уста».'
  alternative: «я послал рукой воздушный поцелуй»
  rationale: Контекст стихов 26–28 связывает жест с почитанием солнца или луны, однако сам стих описывает действие, не называя его поклонением прямо. Поэтому культурный смысл вынесен в сноску, а неоднозначность образа сохранена.
