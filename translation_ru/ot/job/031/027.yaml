- source_word: יָדִי
  choice: рука моя
  rationale: Буквальная передача подлежащего сохраняет необычный телесный образ еврейского текста.
- source_word: לְפִי
  choice: мои уста
  rationale: 'Буквально: «к моим устам». При глаголе «поцеловать» русская конструкция требует прямого дополнения; «уста» соответствует достоинству поэтической речи и обозначает рот как часть жеста.'
