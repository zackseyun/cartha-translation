lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Вводит условную часть клятвы Иова о своей невиновности.
- source_word: אֶרְאֶה
  choice: я смотрел
  rationale: Имперфект в контексте клятвенного отрицания передаёт предполагаемый поступок в прошлом; «смотрел» естественно сочетается с подразумеваемым восхищённым вниманием.
- source_word: אוֹר
  choice: свет
  rationale: Сохраняет буквальное значение еврейского слова и не устраняет его намеренную контекстуальную соотнесённость с солнцем.
- source_word: כִּי יָהֵל
  choice: сияющий
  rationale: Передаёт обстоятельственное значение כִּי и действие «сиять» компактным и естественным русским причастием.
- source_word: וְיָרֵחַ
  choice: или на ... луну
  rationale: В условном перечислении союз естественно имеет разделительный оттенок; предлог «на» восполнен по управлению глагола «смотрел».
- source_word: יָקָר הֹלֵךְ
  choice: величаво плывущую
  rationale: «Величаво» передаёт великолепие и достоинство יָקָר, а «плывущую» естественно описывает видимое движение луны по небу, сохраняя длительность причастия הֹלֵךְ.
theological_decisions:
- issue: Возможный контекст почитания небесных светил
  choice: Сохранить образ «света» и луны, не называя действие поклонением в самом стихе.
  alternative: Перевести אוֹר как «солнце», явно подчеркнув контекст осуждения астрального культа.
  rationale: В стихах 27–28 становится ясно, что речь идёт о соблазне почитания небесных светил, однако стих 26 сам по себе называет только «свет» и луну. Перевод не должен преждевременно устранять эту лексическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Незавершённый синтаксис и конечная запятая сохранены, поскольку условная конструкция продолжается в следующем стихе.
