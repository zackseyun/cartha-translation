- source_word: אִם לֹא
  choice: то я… бы
  rationale: В контексте клятвенного заявления сочетание вводит подчёркнутое следствие подразумеваемого условия из предыдущего стиха; русская условно-сослагательная конструкция сохраняет связь с контекстом и торжественную уверенность.
- source_word: עַל שִׁכְמִי
  choice: на плече
  rationale: Прямо передаёт пространственный образ и единственное число еврейского существительного.
- source_word: אֶשָּׂאֶנּוּ
  choice: носил бы его
  rationale: Глагол נשׂא означает здесь несение предмета; «носил бы» естественно сочетается с образом открытого ношения обвинительного свитка на плече.
- source_word: אֶעֶנְדֶנּוּ
  choice: повязал бы на себя
  rationale: ענד обозначает надевание или закрепление украшения. «Повязал бы» сохраняет конкретный образ прикрепления, не сводя его только к украшению.
- source_word: עֲטָרוֹת
  choice: словно венец
  rationale: Форма морфологически множественная, однако может иметь усилительное или собирательное значение. Единственное число естественно по-русски и сохраняет образ почётного головного украшения; буквальная форма отмечена в сноске.
- source_word: לִי
  choice: на себя
  rationale: При ענד дательный суффикс естественно передаётся по-русски возвратной конструкцией, указывающей, что Иов сам наденет это.
