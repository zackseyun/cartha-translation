  text: אִם שַׂ֣מְתִּי זָהָ֣ב כִּסְלִ֑/י וְ֝/לַ/כֶּ֗תֶם אָמַ֥רְתִּי מִבְטַחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/024.yaml
  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: ru
  text: 'Если я сделал золото своей опорой[a] и сказал чистому золоту[b]: «Ты — моя надежда[c]»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своей надеждой»; еврейское כִּסְלִי может означать уверенность, упование или надежду.'
    reason: lexical_alternative
  - marker: b
    text: «Чистое золото» передаёт כֶּתֶם — очищенное, высокопробное золото.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «то, на что я полагаюсь»; еврейское מִבְטַחִי обозначает предмет доверия или источник безопасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условную часть клятвы Иова о своей невиновности и сохраняет незавершённую синтаксическую связь с последующим контекстом.
- source_word: שַׂמְתִּי
  choice: я сделал
  rationale: В сочетании с дополнением и именной характеристикой естественно передаёт смысл «поставил/назначил чем-либо».
- source_word: זָהָב
  choice: золото
  rationale: Прямое и общеупотребительное соответствие.
- source_word: כִּסְלִי
  choice: своей опорой
  rationale: כֶּסֶל здесь означает предмет уверенности или упования; «опора» естественно выражает зависимость от богатства и не сливается со следующим מִבְטַחִי.
- source_word: וְלַכֶּתֶם
  choice: и сказал чистому золоту
  rationale: כֶּתֶם обозначает высокопробное, очищенное золото; предлог ל отмечает адресата глагола «сказал».
- source_word: אָמַרְתִּי
  choice: сказал
  rationale: Однородный глагол внутри условной конструкции; простое прошедшее время естественно по-русски.
- source_word: מִבְטַחִי
  choice: моя надежда
  rationale: Передаёт то, на что человек полагается и в чём видит безопасность; сохраняет лексическое отличие от כִּסְלִי.
theological_decisions:
- issue: Отрицание Иовом упования на богатство
  choice: 'Сохранена условная формула: «Если я сделал золото своей опорой…»'
  alternative: «Если я возлагал надежду на золото…»
  rationale: Формулировка сохраняет форму клятвы о невиновности и нравственно-богословский смысл отказа считать богатство высшим основанием безопасности, не вводя позднейших доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык; торжественность клятвенной речи сохранена без архаизмов. Лексическое различие между כִּסְלִי и מִבְטַחִי передано словами «опора» и «надежда».
