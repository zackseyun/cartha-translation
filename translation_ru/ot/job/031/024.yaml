  source_fidelity: 'Текст точно передаёт условную формулу еврейского оригинала: אִם («если»), שַׂמְתִּי («я сделал/поставил»), זָהָב («золото»), адресное ל при כֶּתֶם («чистому золоту») и личные суффиксы в כִּסְלִי и מִבְטַחִי. Различие между двумя существительными в русском сохранено: «опора» и «надежда». Незавершённость условной части и запятая в конце оправданы синтаксисом контекста (ст. 25 и далее).'
