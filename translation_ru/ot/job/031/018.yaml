lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для утверждения Иова в контексте его клятвы; «ведь» естественно передаёт пояснительно-аргументативную связь.
- source_word: מִנְּעוּרַי
  choice: с юности моей
  rationale: Сохраняет исходную временную точку и придаёт строке достойное, но понятное современному читателю звучание.
- source_word: גְּדֵלַנִי
  choice: он рос при мне
  rationale: Форма трудна. В контексте заботы Иова о сироте наиболее связно понимать её как указание на то, что сирота рос при Иове, относившемся к нему по-отцовски. Необычность еврейской формы и более буквальные варианты сохранены в сноске.
- source_word: כְאָב
  choice: как при отце
  rationale: Предлог כְּ выражает сравнение; в сочетании с «рос при мне» русский оборот «как при отце» ясно передаёт отцовскую роль Иова.
- source_word: וּמִבֶּטֶן אִמִּי
  choice: и от утробы матери моей
  rationale: Сохранён сильный временной образ исходного текста, подчёркивающий заботу с самого начала жизни; несколько возвышенный порядок слов соответствует поэтической речи.
- source_word: אַנְחֶנָּה
  choice: я направлял её
  rationale: Порода hифиль глагола נחה означает «вести, направлять»; женский объектный суффикс сохранён местоимением «её» и, вероятнее всего, отсылает к вдове в предыдущем стихе.
theological_decisions:
- issue: Неясная субъектно-объектная связь в первой строке
  choice: Сирота рос при Иове, относившемся к нему как отец.
  alternative: «Он вырастил меня как отец» или «я растил его как отец».
  rationale: Контекст говорит о заботе Иова о сироте, однако масоретская форма необычна и допускает иные способы понимания. Основной текст передаёт наиболее связный контекстуальный смысл, а сноска не скрывает грамматическую трудность.
- issue: Смена референта между полустишиями
  choice: Мужское «он» относится к сироте, женское «её» — к вдове из предыдущего стиха.
  alternative: Оба полустишия можно понимать обобщённо как описание давней заботы Иова о беззащитных.
  rationale: Перевод сохраняет различие грамматического рода в еврейском тексте и не устраняет резкий переход от сироты к вдове.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Оборот «от утробы матери моей» намеренно сохраняет напряжённую гиперболу оригинала; синтаксическая трудность первой строки обозначена сноской, а не устранена догматическим истолкованием.
