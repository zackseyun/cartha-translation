  text: The sojourner did not spend the night outside[a]; I opened my doors to the traveler.
translation:
  language: ru
  text: Пришелец не ночевал на улице[a]; я открывал свои двери путнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вне дома».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: на улице
  rationale: В данном контексте выражение обозначает место вне дома, под открытым небом; русское «на улице» естественно передаёт эту мысль.
- source_word: יָלִין
  choice: не ночевал
  rationale: Глагол לין означает проводить ночь или оставаться на ночлег; «не ночевал» кратко и точно сохраняет временной смысл.
- source_word: גֵּר
  choice: пришелец
  rationale: גֵּר обозначает живущего среди чужого народа неуроженца, нередко социально уязвимого; «пришелец» сохраняет этот оттенок лучше, чем просто «незнакомец».
- source_word: דְּלָתַי
  choice: двери мои
  rationale: Еврейская форма стоит во множественном числе с суффиксом первого лица; множественное число сохранено и естественно звучит в образе гостеприимно открытого дома.
- source_word: לָאֹרַח
  choice: путнику
  rationale: В контексте אֹרַח обозначает странника или путника, которому нужен ночлег; «путник» — понятное и достойное русское соответствие.
- source_word: אֶפְתָּח
  choice: я открывал
  rationale: Имперфект в самооправдании Иова естественно выражает обычное, повторявшееся в прошлом действие; русский несовершенный вид передаёт эту привычность.
