  text: пусть моя жена мелет для другого[a], и пусть другие мужчины склоняются над нею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно, выражение «склоняются над нею» означает: «ложатся с ней»; здесь, вероятно, употреблён сексуальный эвфемизм.'
    reason: лексическая альтернатива и пояснение вероятного эвфемизма
lexical_decisions:
- source_word: תִּטְחַן
  choice: мелет
  rationale: Сохраняет конкретный образ помола зерна и возможный оттенок унизительного подневольного труда; вероятный сексуальный подтекст не переносится в основной текст как однозначное значение.
- source_word: לְאַחֵר
  choice: для другого
  rationale: Естественно передаёт значение «для другого [мужчины]», не перегружая русскую фразу уточнением, которое ясно из контекста.
- source_word: אִשְׁתִּי
  choice: моя жена
  rationale: Обычное контекстуальное значение существительного с суффиксом первого лица.
- source_word: וְעָלֶיהָ
  choice: над ней
  rationale: Сохраняет пространственный образ еврейского предлога עַל и не смягчает двусмысленность выражения.
- source_word: יִכְרְעוּן
  choice: преклоняют колени
  rationale: Передаёт обычное значение корня כרע — «преклонять колени, становиться на колени» — и сохраняет эвфемистический образ.
- source_word: אֲחֵרִין
  choice: другие мужчины
  rationale: Мужской род множественного числа в данном контексте указывает на других мужчин; явное существительное делает русский текст понятным.
theological_decisions:
- issue: Следует ли прямо выразить сексуальный эвфемизм в основном тексте
  choice: Сохранить буквальные образы «мелет» и «преклоняют над ней колени», а вероятный сексуальный смысл указать в сноске.
  alternative: «Пусть моя жена принадлежит другому, и пусть другие мужчины спят с ней».
  rationale: Еврейский текст, вероятно, подразумевает сексуальное унижение, но не употребляет прямого обозначения полового акта. Основной текст сохраняет подлинную образность и неоднозначность, а сноска объясняет вероятный смысл.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный, соответствующий формуле самоосуждающей клятвы. Союзное начало не добавлено, поскольку стих дан отдельно, но форма «пусть» ясно передаёт продолжение условного проклятия из контекста.
