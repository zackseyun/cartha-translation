lexical_decisions:
- source_word: נָתַתִּי
  choice: не позволял
  rationale: В сочетании с инфинитивом буквальное «не давал» выражает недопущение или отказ позволить; по-русски это естественно передаётся как «не позволял».
- source_word: לַחֲטֹא
  choice: согрешить
  rationale: Инфинитив сохраняет обычное нравственное значение глагола חטא — «грешить».
- source_word: חִכִּי
  choice: устам моим
  rationale: Буквально «моему нёбу»; в поэтическом контексте это метонимия речи. «Устам моим» сохраняет образ части речевого аппарата и звучит естественно и возвышенно.
- source_word: לִשְׁאֹל
  choice: прося
  rationale: 'Инфинитив описывает, в чём состоял бы грех уст: в просьбе или пожелании, направленном против жизни врага.'
- source_word: בְּאָלָה
  choice: с проклятием
  rationale: אָלָה может означать проклятие или клятву; контекст враждебного пожелания в ст. 29–30 преимущественно указывает на проклятие, а иной смысл сохранён в сноске.
- source_word: נַפְשׁוֹ
  choice: его жизни
  rationale: נפשׁ здесь обозначает жизнь человека, которой могла касаться произнесённая формула проклятия, а не «душу» в узком метафизическом смысле.
