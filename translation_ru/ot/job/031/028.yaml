  verdict: approve
  source_fidelity: Текст точно передаёт условный смысл, заданный контекстом клятвенных отрицаний в Иов 31. «Это тоже» корректно отсылает к поступку предыдущего стиха; «беззаконием, подлежащим суду» передаёт עָוֺן פְּלִילִי без неоправданного уточнения о конкретных судьях. «Я отрёкся бы от Бога в вышине» адекватно выражает כִחַשְׁתִּי לָאֵל מִמָּעַל; пространственное определение не превращено в отсутствующий в оригинале титул.
