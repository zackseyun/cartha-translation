  terminology: «Беззаконие» сохраняет нравственно-правовой вес עָוֺן, а «подлежащее суду» — судебную окраску פְּלִילִי. «Отрёкся бы от Бога» — допустимая контекстуальная передача כחש в контексте поклонения небесным светилам. Сноски содержательно соответствуют обозначенным альтернативам и правильно привязаны к словам в тексте.
