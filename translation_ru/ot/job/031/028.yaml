source:
  edition: WLC
  text: גַּם ה֭וּא עָוֺ֣ן פְּלִילִ֑י כִּֽי כִחַ֖שְׁתִּי לָ/אֵ֣ל מִ/מָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/028.yaml
  text: this too would be an iniquity for the judges[b][a], for I would have denied God above.
translation:
  language: ru
  text: И это тоже было бы беззаконием, подлежащим суду[a], ведь я отрёкся бы от Бога в вышине[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконием, наказуемым судьями», «судебным преступлением» или «беззаконием, заслуживающим суда».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ведь я оказался бы неверен Богу свыше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: это тоже
  rationale: Сочетание отсылает к поступку, описанному в предыдущем стихе, и присоединяет его к перечню проступков, которые Иов отрицает.
- source_word: עָוֺן
  choice: беззаконие
  rationale: Передаёт одновременно нравственную вину и юридический оттенок контекста.
- source_word: פְּלִילִי
  choice: подлежащее суду
  rationale: Слово связано с судебным разбирательством или решением. Такая формулировка естественна по-русски и сохраняет юридический смысл, не уточняя без необходимости, кто именно выносит решение.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание, по которому названный поступок считался бы беззаконием.
- source_word: כִחַשְׁתִּי
  choice: я отрёкся бы
  rationale: В контексте почитания небесных светил глагол означает не просто ложь, а отрицание Бога или неверность Ему. Условное значение следует из всей гипотетической конструкции главы.
- source_word: לָאֵל
  choice: от Бога
  rationale: Русское управление глагола «отречься» естественно передаёт еврейскую конструкцию с предлогом ל.
- source_word: מִמָּעַל
  choice: в вышине
  rationale: Кратко сохраняет пространственный образ «свыше/на высоте» и контраст с небесными светилами, не превращая выражение в отдельный божественный титул.
theological_decisions:
- issue: Следует ли понимать מִמָּעַל как титул «Всевышний» или как указание на пребывание Бога в вышине
  choice: Бога в вышине
  alternative: Бога Всевышнего; Бога на небесах
  rationale: В еврейском тексте употреблено наречное выражение, а не титул עֶלְיוֹן. Выбранный вариант сохраняет краткость и вертикальный образ исходного текста, не добавляя отсутствующего титула.
- issue: Передаёт ли כִחַשְׁתִּי прямое отречение или неверность Богу
  choice: отрёкся бы от Бога
  alternative: оказался бы неверен Богу
  rationale: Контекст предполагает обращение к иной святыне и тем самым отрицание Бога; вместе с тем альтернативное значение неверности действительно возможно и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Юридическая окраска первой части сохранена, а краткое «в вышине» избегает как разговорности, так и необоснованного введения титула «Всевышний».
