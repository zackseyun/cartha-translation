  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: ru
  text: Ведь это — гнусный поступок, преступление, подлежащее суду[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…беззаконие, подсудное судьям».'
    reason: פְּלִילִים может прямо указывать на судей, а עָוֹן также может быть передано как «беззаконие».
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит обоснование предшествующей клятвы Иова; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: הוא
  choice: это
  rationale: Местоимение указывает на поступок, о котором сказано в предыдущем стихе; русское «это» сохраняет отсылку без лишнего уточнения.
- source_word: זִמָּה
  choice: постыдное дело
  rationale: Слово обозначает тяжкий, нравственно отвратительный поступок, в данном контексте сексуальное преступление; выбранный оборот понятен современному читателю и не сужает значение до одной лишь распущенности.
- source_word: ו/היא
  choice: преступление
  rationale: Женское местоимение продолжает характеристику того же поступка. В русском повтор связки можно естественно передать бессоюзным приложением, не меняя смысла.
- source_word: עָוֺן
  choice: преступление
  rationale: В данном судебном контексте слово выражает виновное злодеяние; «преступление» сохраняет одновременно нравственный и правовой вес.
- source_word: פְּלִילִים
  choice: подлежащее суду
  rationale: Множественная форма связана с судебным разбирательством или судьями. Такая передача естественно выражает, что дело относится к компетенции суда, не утверждая конкретной меры наказания.
