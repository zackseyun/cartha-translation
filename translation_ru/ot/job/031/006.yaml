  yaml_path: translation/ot/job/031/006.yaml
  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: ru
  text: Пусть Бог взвесит меня на справедливых весах[a] и узнает мою непорочность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на весах праведности»; также возможно: «на честных весах».'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «мою нравственную цельность» или «мою невиновность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: Пусть Он взвесит меня
  rationale: 'Имперфект породы qal с суффиксом первого лица в данном контексте имеет волитивный, близкий к юссиву оттенок: Иов призывает Бога подвергнуть его проверке. Такая передача сохраняет и побуждение, и образ взвешивания.'
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: на справедливых весах
  rationale: מֹאזְנַיִם означает весы, а צֶדֶק — праведность, справедливость или честность. «Справедливые весы» естественно передают образ беспристрастной и верной оценки.
- source_word: וְיֵדַע
  choice: и пусть … узнает
  rationale: Союз с имперфектом продолжает волитивную конструкцию первого полустишия. Повтор «пусть» ясно выражает этот параллелизм, не превращая глагол в простое будущее время.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Это поэтическая форма единственного числа со значением «Бог», особенно характерная для книги Иова; расширение до «Бог Всемогущий» здесь не обусловлено текстом.
- source_word: תֻּמָּתִי
  choice: мою непорочность
  rationale: תֻּמָּה обозначает нравственную цельность, непорочность или безупречность. «Непорочность» сохраняет характерное для книги Иова притязание на нравственную цельность, не добавляя утверждения об абсолютной безгрешности.
theological_decisions:
- issue: Смысл самооценки Иова
  choice: мою непорочность
  alternative: мою невиновность; мою нравственную цельность
  rationale: Иов просит о справедливой Божьей оценке своей жизни. Перевод сохраняет напряжение между его притязанием на непорочность и более широким богословским вопросом о человеческой греховности, не сводя его слова ни к утверждению абсолютной безгрешности, ни только к невиновности в одном обвинении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимение «Он» указывает на подразумеваемого Бога; повтор «пусть» сохраняет параллельную волитивную структуру еврейского текста.
