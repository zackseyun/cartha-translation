  text: כִּ֤י פַ֣חַד אֵ֭לַ/י אֵ֣יד אֵ֑ל וּ֝/מִ/שְּׂאֵת֗/וֹ לֹ֣א אוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: ru
  text: Ведь бедствие от Бога было для меня ужасом[a], и перед Его величием я не мог устоять[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедствие Божье было для меня страхом». Еврейское сочетание буквально допускает принадлежность, но, вероятно, означает бедствие, исходящее от Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из-за Его возвышенности я был бессилен». Еврейское существительное может означать возвышенность или величие, а глагольная форма — «не мог», «не мог противостоять» или «не мог выдержать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для сказанного ранее; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: פַחַד
  choice: ужасом
  rationale: Существительное обозначает сильный страх, ужас; именная конструкция сохраняется в выражении «было для меня ужасом».
- source_word: אֵלַי
  choice: для меня
  rationale: 'Предлог с суффиксом указывает на личное отношение Иова к угрозе; по-русски естественно: «было для меня ужасом».'
- source_word: אֵיד
  choice: бедствие
  rationale: Слово обозначает губительное несчастье или катастрофу; «бедствие» уместно в современном литературном русском.
- source_word: אֵל
  choice: от Бога
  rationale: Сочетание אֵיד אֵל вероятнее всего означает бедствие, исходящее от Бога, хотя формально возможно «бедствие Божье».
- source_word: וּמִשְּׂאֵתוֹ
  choice: и перед Его величием
  rationale: שְׂאֵת может обозначать возвышенность, превознесённость или величие; מִן здесь естественно понимать как указание на то, перед чем человек не способен устоять.
- source_word: לֹא אוּכָל
  choice: я не мог устоять
  rationale: יכל выражает способность; с упоминанием Божьего величия «не мог устоять» передаёт и невозможность противостоять, и невозможность выдержать.
theological_decisions:
- issue: Передача אֵל
  choice: Бог
  alternative: Сильный; Эль
  rationale: В данном контексте слово прямо указывает на Бога; транслитерация или титул сделали бы русский текст менее ясным, не добавляя необходимого смыслового оттенка.
- issue: Связь бедствия с Богом
  choice: бедствие от Бога
  alternative: бедствие Божье
  rationale: Так передаётся вероятный смысл источника бедствия, а формальная неоднозначность конструкции отмечается в сноске.
- issue: Значение מִשְּׂאֵתוֹ и объекта при «устоять»
  choice: перед Его величием я не мог устоять
  alternative: из-за Его возвышенности я был бессилен; я не мог вынести этого/противостоять Ему
  rationale: Формулировка сохраняет Божье величие как причину неспособности Иова противиться, не уточняя сверх текста, идёт ли речь о противостоянии Богу или о перенесении Его суда.
translation_notes:
  register: Современный литературный русский с достойной библейской интонацией. «Ведь» ясно связывает стих с предшествующим обоснованием; «Его» написано с прописной буквы согласно распространённой русской библейской традиции. Маркеры сносок размещены непосредственно после соответствующих выражений.
