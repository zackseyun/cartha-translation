  yaml_path: translation/ot/job/031/013.yaml
  text: If I have rejected the case of my male servant or my female servant when they brought a complaint against me[b][a],
translation:
  language: ru
  text: Если я отвергал право[a] моего раба или моей рабыни[b], когда они вели со мной тяжбу,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвергал правосудие», «отвергал судебное дело моего раба или моей рабыни». Еврейское слово может означать правосудие, законное право или судебное дело.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моего слуги или моей служанки». Еврейские слова обозначают соответственно раба и рабыню; их также могут передавать более традиционными словами «слуга» и «служанка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условную часть клятвы Иова о своей невиновности; простое «если» естественно и точно передаёт синтаксис.
- source_word: אֶמְאַס
  choice: я отказывал
  rationale: Глагол означает «отвергать, пренебрегать, отказывать»; вместе с מִשְׁפָּט речь идёт об отказе предоставить должное правосудие, а не только о чувстве презрения.
- source_word: מִשְׁפַּט
  choice: в правосудии
  rationale: Слово может обозначать суд, правосудие, законное право или судебное дело. В данном контексте выражение передаёт отказ признать законные притязания зависимых людей, сохраняя юридический смысл.
- source_word: עַבְדִּי וַאֲמָתִי
  choice: моему рабу или моей рабыне
  rationale: Эти слова обозначают соответственно мужчину и женщину в рабском или зависимом служебном положении. «Раб» и «рабыня» прямо передают их общественный статус; еврейский союз между парными членами здесь естественно передан русским «или» в сфере действия отрицательно-условной формулы.
- source_word: בְּרִיבָם
  choice: когда они судились
  rationale: רִיב обозначает спор, тяжбу или судебную жалобу. Глагольная передача «судились» естественна по-русски и сохраняет юридический характер противостояния.
- source_word: עִמָּדִי
  choice: со мной
  rationale: Буквально «со мной»; при глаголе «судились» русский творительный с «с» ясно выражает, что тяжба была направлена против Иова, не устраняя формальную особенность оригинала.
