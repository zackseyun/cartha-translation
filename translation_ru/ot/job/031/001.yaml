  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: ru
  text: Я заключил завет со своими глазами — как же мне засматриваться на девственницу?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Зачем же мне смотреть на девственницу?»'
    reason: 'Еврейские וּמָה и אֶתְבּוֹנֵן допускают передачу вопроса как «зачем / почему» и менее интенсивный перевод глагола: «смотреть».'
lexical_decisions:
- source_word: בְּרִית כָּרַתִּי
  choice: я заключил завет
  rationale: Еврейская идиома буквально означает «рассекать завет»; по-русски естественно и весомо звучит «заключить завет», передавая торжественное самообязательство.
- source_word: לְעֵינָי
  choice: со своими глазами
  rationale: Предлог לְ допускает оттенок «для / относительно», но в контексте естественная русская формулировка «со своими глазами» представляет глаза как образного участника данного обязательства.
- source_word: וּמָה
  choice: как же мне было бы
  rationale: Вопросительное сочетание связывает вторую часть со сделанным заявлением и выражает невозможность либо неуместность последующего поступка.
- source_word: אֶתְבּוֹנֵן
  choice: засматриваться
  rationale: Форма обозначает внимательное, намеренное разглядывание, а не мимолётный взгляд; «засматриваться» естественно передаёт этот смысл и нравственный контекст.
- source_word: עַל בְּתוּלָה
  choice: на девушку
  rationale: בְּתוּלָה обычно обозначает девушку, предполагаемо девственницу и незамужнюю. В современном русском «девушка» звучит естественнее, тогда как «девственница» здесь чрезмерно подчёркивает физиологический признак, а «дева» архаична.
theological_decisions:
- issue: Характер взгляда, от которого воздерживается Иов
  choice: «засматриваться» — намеренно и продолжительно смотреть
  alternative: нейтральное «смотреть» либо явное «смотреть с вожделением»
  rationale: Глагол указывает на пристальное внимание, а контекст подразумевает нравственную опасность, но слово «вожделение» прямо в еврейском тексте отсутствует; перевод сохраняет эту смысловую напряжённость без добавления.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи Иова. «Завет» сохраняет торжественность исходной формулы; «засматриваться» понятно современному читателю и передаёт не случайный взгляд, а сознательное разглядывание.
