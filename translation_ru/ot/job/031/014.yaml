  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: ru
  text: Что же я сделаю, когда восстанет Бог? И когда Он призовёт меня к ответу[a], что я отвечу Ему?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посетит меня»; «исследует меня». Еврейский глагол может означать «посетить», «проверить» или «призвать к ответу»; здесь контекст указывает на ответственность перед Божьим судом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה
  choice: Что же
  rationale: Частица «же» естественно передаёт связь с предыдущей мыслью и напряжённый характер риторического вопроса.
- source_word: אֶעֱשֶׂה
  choice: я сделаю
  rationale: Форма обозначает предполагаемое действие в мыслимой будущей ситуации; в русском языке будущее время естественно сохраняет эту модальность.
- source_word: כִּי יָקוּם
  choice: когда восстанет
  rationale: כִּי понято как временное «когда», а образ קום сохранён без поясняющего добавления «судить».
- source_word: אֵל
  choice: Бог
  rationale: Обычный и точный русский эквивалент данного наименования Бога; расширенные титулы контекстом не требуются.
- source_word: וְכִי יִפְקֹד
  choice: И когда Он призовёт меня к ответу
  rationale: У פקד широкий диапазон значений — посетить, проверить, взыскать. Параллельный вопрос об ответе Богу поддерживает судебный оттенок, выраженный естественной русской идиомой.
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: что я отвечу Ему
  rationale: Каузативная форма שוב здесь идиоматически означает дать ответ; местоименный суффикс передан словом «Ему».
theological_decisions:
- issue: Образ Божьего суда и взыскания
  choice: Бог восстаёт и призывает Иова к ответу, то есть подвергает его суду и проверке, без уточнения, что речь идёт именно о последнем суде.
  alternative: 'Передать פקד нейтральнее: «посетит» или «исследует меня»; либо истолковать стих исключительно эсхатологически.'
  rationale: Контекст ответа перед Богом придаёт פקד судебный оттенок, однако сам стих не ограничивает событие последним судом. Перевод сохраняет эту напряжённость, не вводя более узкой доктринальной трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Восстанет» сохраняет исходный образ и высокий регистр; прописные местоимения в отношении Бога использованы последовательно в рамках стиха.
