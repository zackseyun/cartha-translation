  yaml_path: translation/ot/job/031/040.yaml
  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: ru
  text: 'Пусть вместо пшеницы взойдут тернии,

    а вместо ячменя — зловонная трава.[a]


    Окончились слова Иова.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сорная трава» или «вредный сорняк»; точный вид растения, названного еврейским словом, неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: вместо
  rationale: В контексте проклятия земле слово обозначает замену желанного урожая вредной растительностью, а не пространственное положение.
- source_word: חִטָּה
  choice: пшеница
  rationale: Обычное значение названия зерновой культуры; оно противопоставлено бесполезной растительности.
- source_word: יֵצֵא
  choice: пусть … вырастет
  rationale: Буквально глагол означает «выйти», но применительно к растениям описывает появление из земли; «вырастет» естественно передаёт этот образ по-русски.
- source_word: חוֹחַ
  choice: терновник
  rationale: Еврейское слово обозначает колючее вредное растение. «Терновник» сохраняет собирательный образ нежелательной колючей поросли.
- source_word: שְׂעֹרָה
  choice: ячмень
  rationale: Стандартное название указанной зерновой культуры.
- source_word: בָאְשָׁה
  choice: зловонная трава
  rationale: Слово, вероятно, обозначает дурно пахнущее или вредное растение и связано с представлением о зловонии. Родовое обозначение сохраняет смысл, не создавая ложной ботанической точности.
- source_word: תַּמּוּ
  choice: на этом окончились
  rationale: Форма отмечает завершение слов Иова; добавление «на этом» естественно для современного русского заключительного уведомления.
- source_word: דִּבְרֵי אִיּוֹב
  choice: слова Иова
  rationale: Прямо и формально передаёт еврейскую сопряжённую конструкцию, не сужая её значения до отдельных речей.
