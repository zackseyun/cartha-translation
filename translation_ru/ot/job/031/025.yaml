  text: אִם אֶ֭שְׂמַח כִּי רַ֣ב חֵילִ֑/י וְ/כִֽי כַ֝בִּ֗יר מָצְאָ֥ה יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: ru
  text: если я радовался тому, что богатство моё велико, и тому, что рука моя приобрела многое[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рука моя нашла многое»; то есть добыла или приобрела своими силами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Вводит условие в клятве Иова о своей невиновности; «если» естественно сохраняет незавершённую протасису.
- source_word: אֶשְׂמַח
  choice: я радовался
  rationale: Передаёт радость и внутреннее удовлетворение, не добавляя отсутствующего в тексте прямого указания на упование.
- source_word: כִּי רַב חֵילִי
  choice: тому, что богатство моё велико
  rationale: כִּי обозначает причину радости, חֵיל в контексте — материальное состояние, а רַב указывает на его величину или обилие.
- source_word: וְכִי כַבִּיר
  choice: и тому, что… многое
  rationale: Сохраняет параллельную вторую причину и передаёт כַבִּיר как значительное количество без искусственной субстантивации.
- source_word: מָצְאָה יָדִי
  choice: рука моя приобрела
  rationale: Буквально «моя рука нашла»; в данном контексте это идиома получения или приобретения собственными силами. «Приобрела» естественно по-русски и сохраняет образ руки как действующей силы.
theological_decisions:
- issue: Осуждает ли стих само обладание богатством или радость, основанную на его изобилии и собственных достижениях
  choice: Иов отрицает, что радовался именно из-за великого богатства и того, что приобрела его рука.
  alternative: Передать стих так, будто предосудительно уже само обладание богатством.
  rationale: Две причинные конструкции с כִּי связывают нравственный вопрос с радостью по причине богатства и личного приобретения, а не с владением как таковым.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической речи. Инверсия «богатство моё» и «рука моя» поддерживает возвышенный ритм, не создавая архаичности. Тире сохраняет незавершённость условного периода, продолжающегося в следующем стихе.
