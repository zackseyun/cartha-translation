  terminology: «Бедняк» адекватно передаёт אֶבְיוֹן в данном материальном контексте. Различие между לְבוּשׁ («одежда») и כְּסוּת («покров/покрытие») сохранено в основном тексте и разъяснено в сноске без искусственного утяжеления.
