  text: אִם אֶרְאֶ֣ה א֭וֹבֵד מִ/בְּלִ֣י לְב֑וּשׁ וְ/אֵ֥ין כְּ֝ס֗וּת לָ/אֶבְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/019.yaml
  text: if I have seen anyone perishing for lack of clothing[b][a], or the needy without covering—
translation:
  language: ru
  text: если я видел погибающего без одежды[a] или бедняка, которому нечем было укрыться[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погибающего из-за недостатка одежды».'
    reason: Сочетание מִבְּלִי может выражать не только отсутствие, но и причинный оттенок лишения.
  - marker: b
    text: 'Букв.: «и у бедняка не было покрова».'
    reason: Сноска сохраняет форму еврейской отрицательной бытийной конструкции и предметное значение כְּסוּת.
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Вводит условную часть клятвы Иова о своей невиновности и сохраняет синтаксическую связь с последующим самоосуждением.
- source_word: אֶרְאֶה
  choice: я видел
  rationale: Имперфект в контексте ретроспективной клятвы естественно передаётся русским прошедшим временем.
- source_word: אֹבֵד
  choice: погибающего
  rationale: Причастие от אבד обозначает человека, находящегося в бедственном, гибельном положении; русское причастие сохраняет длительность состояния.
- source_word: מִבְּלִי לְבוּשׁ
  choice: без одежды
  rationale: Кратко и естественно передаёт лишённость одежды; возможный причинный оттенок отмечен в сноске.
- source_word: וְאֵין
  choice: или ... нечем было
  rationale: В параллельных условных членах союз естественно читается по-русски как разделительное «или», а отрицательная бытийная конструкция передана идиоматически.
- source_word: כְּסוּת
  choice: укрыться
  rationale: Передаёт функцию покрова или одеяния и сохраняет смысловое отличие от לְבוּשׁ в первой строке.
- source_word: לָאֶבְיוֹן
  choice: бедняка
  rationale: אֶבְיוֹן обозначает материально нуждающегося, бедного человека; «бедняк» ясно и естественно в данном поэтическом контексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической клятвы. Тире оставляет условную конструкцию незавершённой, как в контексте главы; параллелизм передан естественно, без устранения смысловых оттенков.
