base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: ru
  text: Разве не гибель ожидает неправедного[a] и бедствие — тех, кто творит зло[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разорение ожидает несправедливого».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «несчастье — совершающих беззаконие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: אֵיד
  choice: гибель
  rationale: Слово обозначает губительное несчастье или разорение; «гибель» сохраняет вес и поэтическую краткость выражения.
- source_word: לְעַוָּל
  choice: уготована неправедному
  rationale: Существительное обозначает человека, для которого характерны неправда и несправедливость; добавленное по смыслу «уготована» естественно выражает дательный оборот принадлежности или предназначения.
- source_word: וְנֵכֶר
  choice: и бедствие
  rationale: В параллелизме с אֵיד слово, вероятнее всего, означает тяжёлое несчастье; перевод сохраняет отличие двух близких по смыслу членов строки.
- source_word: לְפֹעֲלֵי
  choice: тем, кто творит
  rationale: Причастная форма указывает на людей, совершающих или практикующих соответствующие дела; этот оборот современнее буквального «делателям».
- source_word: אָוֶן
  choice: зло
  rationale: В данном нравственном контексте слово обозначает пагубное, виновное злодеяние; «зло» ясно и естественно для современного читателя.
theological_decisions:
- issue: Нравственное воздаяние в литературе мудрости
  choice: Сформулировать стих как общий принцип нравственного порядка, не уточняя, каким образом приходит бедствие.
  alternative: Явно назвать бедствие непосредственным Божьим наказанием либо только естественным последствием поступков.
  rationale: Еврейский текст соотносит гибель с неправедным, а бедствие — с творящими зло, но в самом стихе не определяет механизм воздаяния.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Риторическая форма и параллелизм сохранены; архаичные «делатели неправды» и чрезмерно церковнославянские обороты не использованы.
