- source_word: אִם לֹא
  choice: если ... не
  rationale: Сохраняет условную форму клятвенного самообязательства Иова, не раскрывая в самом стихе подразумеваемое проклятие.
- source_word: בֵרֲכוּנִי
  choice: не благословляли меня
  rationale: Передаёт обычное значение Piel от ברך и сохраняет образ благодарного благословения, не сводя его к простому «не благодарили».
- source_word: חֲלָצָיו
  choice: чресла его
  rationale: Формально передаёт телесный образ еврейского текста; чресла метонимически обозначают тело нуждающегося, одетое и согретое.
- source_word: וּמִגֵּז
  choice: шерстью
  rationale: Творительный падеж естественно выражает средство согревания; גֵּז может обозначать руно либо состриженную шерсть.
- source_word: כְּבָשַׂי
  choice: моих овец
  rationale: В контексте получения шерсти «овцы» точнее и естественнее, чем «ягнята».
- source_word: יִתְחַמָּם
  choice: он не согревался
  rationale: Передаёт возвратно-результативное значение Hitpael и сохраняет условное отрицание, заданное אִם לֹא.
