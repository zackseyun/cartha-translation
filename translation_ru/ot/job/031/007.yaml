lexical_decisions:
- source_word: תִּטֶּה אַשֻּׁרִי מִנִּי הַדָּרֶךְ
  choice: стопа моя уклонилась с пути
  rationale: Сочетание сохраняет конкретный образ шага, отклонившегося от должного пути. Прошедшее совершенное время естественно звучит в русском условном самоиспытании, вводимом אִם.
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: и сердце моё последовало за глазами моими
  rationale: 'Близкая передача сохраняет образ нравственного движения: внутреннее желание следует за тем, что привлекает взгляд. «Сердце» и «глаза» не заменены толкованием.'
- source_word: וּבְכַפַּי דָּבַק
  choice: и к ладоням моим пристало
  rationale: כַּף буквально обозначает ладонь, а דבק — прилипать, приставать. Формулировка сохраняет телесный образ нравственного загрязнения, связанного с поступками.
- source_word: מֻאוּם
  choice: какое-либо пятно
  rationale: Слово может обозначать пятно, изъян или порок. В данном нравственном контексте «пятно» естественно передаёт образ вины или нечистоты, приставшей к рукам, не устраняя многозначности.
theological_decisions:
- issue: Нравственная метафора пути
  choice: Сохранить конкретное выражение «уклонилась с пути».
  alternative: «Отступил я от праведного поведения».
  rationale: Исходный текст говорит образно, а не отвлечённо. Сохранение пути не добавляет определения «праведный» и оставляет образ открытым.
- issue: Соотношение сердца и глаз
  choice: Сохранить буквально сердце, следующее за глазами.
  alternative: «Я пожелал того, что увидел».
  rationale: Буквальная образность передаёт напряжение между зрительным восприятием и внутренним желанием, не сводя широкое значение לֵב только к эмоции или мысли.
- issue: Образ пятна на ладонях
  choice: Передать מֻאוּם как «пятно» и указать варианты в сноске.
  alternative: «Вина» или «неправда».
  rationale: Прямая абстрактная передача преждевременно истолковала бы образ. «Пятно» сохраняет метафору нравственного изъяна.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Инверсия «стопа моя», «сердце моё», «ладоням моим» поддерживает поэтическую речь Иова и остаётся понятной. Начальная строчная буква и конечная запятая отражают то, что условное придаточное продолжается самоосуждением в следующем стихе.
