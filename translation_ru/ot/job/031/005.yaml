  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם הָלַ֥כְתִּי עִם שָׁ֑וְא וַ/תַּ֖חַשׁ עַל מִרְמָ֣ה רַגְלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/005.yaml
  text: If I have walked with falsehood[b][a], and my foot has hastened to deceit—
translation:
  language: ru
  text: Если я ходил с ложью[b] и нога моя спешила к обману[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спешила вслед за обманом». Еврейский предлог здесь может указывать направление: «к», «по направлению к» или «вслед за».'
    reason: lexical_alternative
  - marker: b
    text: «Ходить» — библейский образ поведения и образа жизни человека.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условную часть клятвы Иова о своей невиновности без добавочного усиления.
- source_word: הָלַכְתִּי
  choice: я ходил
  rationale: Сохраняет образ еврейского глагола «ходить», который здесь относится к поведению и образу жизни.
- source_word: עִם
  choice: с
  rationale: Прямо передаёт значение совместности или связи с ложью.
- source_word: שָׁוְא
  choice: ложью
  rationale: В параллели с «обманом» слово обозначает нравственную ложность, а не просто пустоту или тщету.
- source_word: וַתַּחַשׁ
  choice: спешила
  rationale: Передаёт значение «торопиться, спешить» и сохраняет поэтическое олицетворение ноги.
- source_word: עַל
  choice: к
  rationale: При глаголе движения предлог может выражать направленность к цели; неоднозначность отмечена в сноске.
- source_word: מִרְמָה
  choice: обману
  rationale: Обозначает обманное, лживое поведение, не сужая смысл до мошенничества или предательства.
- source_word: רַגְלִי
  choice: нога моя
  rationale: Сохраняет единственное число и поэтический образ движения человека к неправде.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма, метафоры хождения и единственного числа «нога». Инверсия «нога моя» поддерживает возвышенный поэтический строй, оставаясь понятной современному читателю.
