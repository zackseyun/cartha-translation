  text: וּ/מֶ֤ה חֵ֣לֶק אֱל֣וֹהַּ מִ/מָּ֑עַל וְֽ/נַחֲלַ֥ת שַׁ֝דַּ֗י מִ/מְּרֹמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: ru
  text: И какая доля от Бога свыше[a], какое наследие от Всемогущего с высот?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доля свыше от Бога… наследие с высот от Всемогущего». Еврейские выражения можно понимать наречно — как указание на небесный источник назначаемых Богом доли и наследия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶה
  choice: И какая
  rationale: Союз וְ продолжает рассуждение, а вопросительное מֶה вводит риторический вопрос. В русском согласование с существительным «доля» требует формы «какая».
- source_word: חֵלֶק
  choice: доля
  rationale: חֵלֶק означает выделенную кому-либо долю или часть. «Доля» естественно передаёт этот смысл и образует поэтическую параллель с «наследием».
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: אֱלוֹהַּ — характерная для книги Иова поэтическая форма единственного числа со значением «Бог»; дополнительный титул в перевод не вносится.
- source_word: מִמָּעַל
  choice: свыше
  rationale: Наречное выражение указывает на источник сверху. Русское «от Бога свыше» сохраняет лаконичность и допускает присущую еврейской фразе смысловую связь как с исходящей от Бога долей, так и с небесным местопребыванием Бога.
- source_word: וְנַחֲלַת
  choice: какое наследие
  rationale: נַחֲלָה обозначает наследие или доставшееся владение. Повтор союза отдельно не передан, поскольку бессоюзный параллелизм после запятой звучит по-русски естественно, а форма «какое» ясно продолжает вопрос.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Традиционный и смыслово прозрачный русский эквивалент божественного титула שַׁדַּי; титул переведён, а не транслитерирован.
- source_word: מִמְּרֹמִים
  choice: с высот
  rationale: Форма с предлогом מִן буквально указывает на происхождение «с высот». Перевод сохраняет повтор исходного значения предлога и не добавляет отсутствующего в тексте слова «небеса».
theological_decisions:
- issue: Передача двух параллельных божественных обозначений
  choice: Бог ... Всемогущий
  alternative: Бог ... Шаддай
  rationale: 'Оба обозначения переданы понятными русскими эквивалентами: אֱלוֹהַּ как «Бог», а титул שַׁדַּי как «Всемогущий». Это сохраняет поэтический параллелизм, не превращая титул в непонятное современному читателю имя.'
- issue: Синтаксическая связь выражения מִמָּעַל
  choice: от Бога свыше
  alternative: от Бога, пребывающего в вышине / доля свыше от Бога
  rationale: Краткая формулировка не устраняет намеренно возможную связь «свыше» как с источником удела, так и с небесной сферой Бога; эта неоднозначность пояснена в сноске.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным поэтическим параллелизмом. Сохранены риторический вопрос, различие между «долей» и «наследием», а также повтор образа происхождения свыше.
