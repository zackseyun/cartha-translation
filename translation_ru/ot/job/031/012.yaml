base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: ru
  text: Ведь это огонь, который пожирает до погибели[a] и искоренил бы весь мой урожай.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до Аваддона». Еврейское слово אֲבַדּוֹן может означать «погибель», а в некоторых контекстах — царство погибели или её олицетворение.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительное обоснование сказанного выше и естественно связывает стих с контекстом клятвы Иова.
- source_word: אֵשׁ הִיא
  choice: это огонь
  rationale: Сохраняет яркую метафору, а указательное «это» естественно отсылает к греху, о котором говорится в предыдущих стихах.
- source_word: עַד אֲבַדּוֹן
  choice: до самой погибели
  rationale: Передаёт предел и полноту разрушительного действия; усилительное «самой» естественно выражает значение עַד в данном обороте. Возможность понять אֲבַדּוֹן как имя «Аваддон» вынесена в примечание.
- source_word: תֹּאכֵל
  choice: пожирающий
  rationale: Глагол буквально означает «есть, поглощать»; «пожирающий» звучит естественно в образе огня и сохраняет силу еврейского выражения.
- source_word: תְּבוּאָתִי
  choice: весь мой урожай
  rationale: Слово обозначает урожай, произведение земли или приобретённый достаток; «урожай» поддерживает сельскохозяйственный образ последующего искоренения.
- source_word: תְשָׁרֵשׁ
  choice: вырвал бы с корнем
  rationale: Порода пиэль здесь означает искоренить или вырвать с корнем. Условное «бы» учитывает контекст клятвы и предполагаемого воздаяния в предыдущих стихах.
theological_decisions:
- issue: Значение אֲבַדּוֹן
  choice: нарицательное «погибель»
  alternative: имя или обозначение сферы погибели — «Аваддон»
  rationale: В данном контексте литературы мудрости слово прежде всего указывает на крайнюю степень гибели, а не обязательно на персонифицированную силу или собственное имя. Подлинная лексическая неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной образностью. Сохранены образы пожирающего огня и полного искоренения; пунктуация подчёркивает переход от характеристики огня к его предполагаемому последствию.
