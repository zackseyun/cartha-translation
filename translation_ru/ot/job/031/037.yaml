lexical_decisions:
- source_word: מִסְפַּר
  choice: число
  rationale: Существительное обозначает число или счёт. Конкретный еврейский образ сохранён, а возможный смысл полного отчёта пояснён в сноске.
- source_word: צְעָדַי
  choice: моих шагов
  rationale: Буквальное и естественное по-русски обозначение шагов, которое также способно передавать образ поступков и жизненного пути без внесения этого толкования в основной текст.
- source_word: אַגִּידֶנּוּ
  choice: я объявил бы ему
  rationale: Порода hифиль глагола נגד означает сообщать, объявлять, давать знать. Условная форма соответствует контексту речи Иова, а «объявил» поддерживает торжественный судебный оттенок.
- source_word: כְּמוֹ
  choice: как
  rationale: Прямо и естественно передаёт сравнительную частицу.
- source_word: נָגִיד
  choice: князь
  rationale: Слово обозначает предводителя, правителя или знатного сановника. «Князь» сохраняет достоинство и уверенность сравнения, не сводя его к конкретной должности.
- source_word: אֲקָרֲבֶנּוּ
  choice: я приблизился бы к нему
  rationale: Глагол קרב здесь выражает приближение к лицу; русский оборот сохраняет личное местоименное дополнение и уверенный характер действия.
theological_decisions:
- issue: К кому относятся местоименные суффиксы мужского рода в выражениях «объявил бы ему» и «приблизился бы к нему»
  choice: Оставлено местоимение «ему/нему» без прямого называния лица.
  alternative: Назвать Бога либо обвинителя Иова.
  rationale: В ближайшем контексте упоминается обвинитель, но речь Иова также направлена к Богу. Еврейский текст стиха прямо не называет референта, поэтому перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, судебно-поэтическим звучанием. Инверсия сведена к минимуму; конкретный образ «числа шагов» и неуточнённый референт местоимения сохранены.
