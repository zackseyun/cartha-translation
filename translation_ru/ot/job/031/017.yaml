  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: ru
  text: если я ел свой кусок один, а сирота[a] не ел от него, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оставшийся без отца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹכַל
  choice: если я… съедал
  rationale: 'В контексте клятвенных самоиспытаний Иова союз ו вводит условную часть: «если». Несовершенный вид «съедал» естественно передаёт возможное повторявшееся поведение.'
- source_word: פִּתִּי
  choice: свой кусок
  rationale: פַּת обозначает кусок или ломоть пищи, часто хлеба. «Кусок» сохраняет конкретность, не уточняя без необходимости, что речь именно о хлебе.
- source_word: לְבַדִּי
  choice: один
  rationale: Передаёт буквальный смысл «один, в одиночку» и естественно сочетается с глаголом «съедал».
- source_word: וְלֹא אָכַל
  choice: и… не ел
  rationale: Сохраняется координация двух частей одного условного высказывания и простое отрицание еврейского текста.
- source_word: יָתוֹם
  choice: сирота[a]
  rationale: В современном русском «сирота» — наиболее естественное обозначение социально уязвимого ребёнка, хотя еврейское слово конкретно указывает на лишившегося отца; это уточнено в сноске.
- source_word: מִמֶּנָּה
  choice: от него
  rationale: Местоименный суффикс отсылает к פִּתִּי («мой кусок»). В русском род местоимения согласован со словом «кусок».
