translation:
  language: ru
  text: тогда пусть я сею, а другой ест, и пусть мои потомки[a] будут искоренены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть мой урожай будет вырван с корнем». Еврейское слово צֶאֱצָא может означать то, что происходит или появляется от кого-либо или чего-либо: как потомство, так и урожай.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: пусть я сею
  rationale: Когортатив первого лица в контексте клятвы-самопроклятия передан волитивной конструкцией «пусть я сею», сохраняющей условно-проклятийную силу речи Иова.
- source_word: וְאַחֵר
  choice: а другой
  rationale: אַחֵר означает «другой». Противительный союз «а» естественно выражает контраст между трудом Иова и тем, кто воспользуется его плодами.
- source_word: יֹאכֵל
  choice: ест
  rationale: Буквальное значение אכל — «есть». Такой перевод сохраняет конкретный земледельческий образ и подразумевает пользование урожаем.
- source_word: וְצֶאֱצָאַי
  choice: мои потомки
  rationale: צֶאֱצָא может обозначать как потомство, так и то, что произрастает. В основном тексте выбран вероятный личный смысл «потомки», а реальная земледельческая альтернатива сохранена в сноске.
- source_word: יְשֹׁרָשׁוּ
  choice: будут искоренены
  rationale: Форма глагола שׁרשׁ передаёт устранение с корнем. «Будут искоренены» сохраняет корневой образ и подходит к выбранному значению «потомки».
