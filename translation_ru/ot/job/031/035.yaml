source:
  edition: WLC
  text: מִ֤י יִתֶּן לִ֨/י שֹׁ֘מֵ֤עַֽ לִ֗/י הֶן תָּ֭וִ/י שַׁדַּ֣י יַעֲנֵ֑/נִי וְ/סֵ֥פֶר כָּ֝תַ֗ב אִ֣ישׁ רִיבִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: ru
  text: О, если бы кто-нибудь выслушал меня! Вот моя подпись[a]; пусть Всемогущий ответит мне, и пусть мой обвинитель напишет обвинение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой знак» либо «моя метка». Вероятно, имеется в виду удостоверяющий знак Иова под его заявлением.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее возможно: «и документ, который написал человек, спорящий со мной». В данном контексте эти слова обычно понимаются как желание Иова получить от противной стороны письменное изложение обвинения.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: О, если бы
  rationale: Еврейская идиома выражает сильное желание, а не буквальный вопрос «кто даст».
- source_word: שֹׁמֵעַ לִי
  choice: кто-нибудь выслушал меня
  rationale: Причастие обозначает того, кто готов услышать дело Иова; «выслушал» естественно передаёт и просьбу о внимании, и судебный оттенок.
- source_word: הֶן
  choice: Вот
  rationale: Указательная частица привлекает внимание к предъявляемому Иовом удостоверяющему знаку.
- source_word: תָּוִי
  choice: моя подпись
  rationale: תָּו обозначает знак или метку, здесь, вероятно, знак удостоверения под заявлением Иова; «подпись» ясно передаёт его функцию в современном русском.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Устоявшаяся и точная передача божественного титула שַׁדַּי в книге Иова.
- source_word: יַעֲנֵנִי
  choice: ответит мне
  rationale: В судебном контексте глагол означает ответ на изложенное Иовом дело.
- source_word: וְסֵפֶר כָּתַב
  choice: пусть … напишет обвинение
  rationale: סֵפֶר — письменный документ, а כָּתַב формально является перфектом. В контексте фраза допускает понимание как пожелание о письменном изложении обвинения, однако более буквальная синтаксическая возможность отмечена в сноске.
- source_word: אִישׁ רִיבִי
  choice: мой обвинитель
  rationale: Буквально «человек моего спора»; в судебной сцене это противная сторона, предъявляющая Иову претензии.
theological_decisions:
- issue: Судебная образность обращения Иова
  choice: 'Передать контекст современной юридической лексикой: «подпись», «обвинитель», «обвинение»'
  alternative: 'Более буквально: «мой знак», «человек моего спора», «документ»'
  rationale: Контекст представляет слова Иова как официальное заверение собственной защиты и требование письменного ответа на неё. Юридическая лексика раскрывает этот смысл, не определяя заранее, кого именно Иов считает обвинителем.
- issue: Неопределённость последней части стиха
  choice: 'Сохранить в основном тексте оптативное прочтение: «пусть мой обвинитель напишет обвинение»'
  alternative: «И документ, который написал человек, спорящий со мной»
  rationale: Масоретский текст буквально допускает чтение с перфектом «написал», тогда как последовательность пожеланий и судебный контекст поддерживают волитивное понимание. Альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством судебной речи. Междометие «О» сохраняет напряжённое пожелание; «выслушал» звучит естественно и удерживает судебный оттенок. Формулировка не уточняет, является ли обвинителем Бог или иной противник, сохраняя напряжение исходного текста.
