  source_fidelity: '«Если я поднимал руку на сироту ... потому что видел, что у городских ворот меня поддержат» точно передаёт условную клятвенную конструкцию, враждебный жест «поднять руку на», причинное כִּי и наличие поддержки/помощи в воротах как публично-правовом месте. Конечное тире уместно: подразумеваемое следствие сформулировано в следующем стихе.'
