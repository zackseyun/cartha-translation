  yaml_path: translation/ot/job/031/021.yaml
  text: if I have raised my hand against the fatherless because I saw that I had support in the gate—[a][b][c]
translation:
  language: ru
  text: если я поднимал руку на сироту[a], потому что видел, что у городских ворот[b] меня поддержат[c], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «лишённого отца». Еврейское слово обозначает прежде всего ребёнка без отца, а потому особенно уязвимого в обществе.
    reason: lexical_alternative
  - marker: b
    text: У городских ворот старейшины разбирали судебные дела и принимали общественные решения.
    reason: cultural_note
  - marker: c
    text: Буквально «мою помощь»; здесь имеется в виду поддержка или влиятельное покровительство при публичном разбирательстве.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет условную формулу клятвы Иова; следствие с подразумеваемым проклятием следует в следующем стихе.
- source_word: הֲנִיפוֹתִי עַל ... יָדִי
  choice: я поднимал руку на
  rationale: Естественная русская идиома, передающая враждебный или угрожающий жест, не уточняя без основания, был ли нанесён удар.
- source_word: יָתוֹם
  choice: сироту
  rationale: Наиболее естественное обозначение социально беззащитного ребёнка в современном русском; более узкое значение еврейского слова пояснено в сноске.
- source_word: כִּי
  choice: потому что
  rationale: 'Передаёт причинный смысл: возможное злоупотребление силой обусловлено уверенностью в поддержке.'
- source_word: אֶרְאֶה
  choice: видел
  rationale: Сохраняет образ восприятия и в контексте означает осознание доступной поддержки.
- source_word: בַשַּׁעַר
  choice: у городских ворот
  rationale: Уточнение «городских» делает понятной историко-культурную реалию, а предлог «у» естественно обозначает место суда и общественных дел.
- source_word: עֶזְרָתִי
  choice: меня поддержат
  rationale: Буквально «моя помощь»; контекстуально речь идёт о влиятельной поддержке в судебно-общественной среде. Личная конструкция звучит естественно по-русски.
