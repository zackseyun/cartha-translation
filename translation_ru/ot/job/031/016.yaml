  text: אִם אֶ֭מְנַע מֵ/חֵ֣פֶץ דַּלִּ֑ים וְ/עֵינֵ֖י אַלְמָנָ֣ה אֲכַלֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/016.yaml
  text: If I have withheld the poor from their desire[a], or caused the eyes of the widow to fail[b],
translation:
  language: ru
  text: Если я отказывал бедным в желаемом[a] и заставлял глаза вдовы томиться ожиданием[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не давал бедным того, чего они желали»; по контексту возможно: «того, в чём они нуждались».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «доводил глаза вдовы до изнеможения» — еврейская идиома, выражающая долгое разочарованное ожидание или несбывающуюся надежду.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условную часть клятвенного самообвинения Иова; простой союз «если» естественно передаёт структуру фразы.
- source_word: אֶמְנַע
  choice: я отказывал
  rationale: Глагол מןע в породе qal означает «удерживать, не давать, отказывать». В сочетании с бедными по-русски естественно «отказывал… в».
- source_word: מֵחֵפֶץ
  choice: в желаемом
  rationale: חֵפֶץ обозначает желание либо желаемое. Формулировка сохраняет исходную широту значения, не сужая его безусловно до нужды.
- source_word: דַּלִּים
  choice: бедным
  rationale: דַּלִּים может обозначать бедных, слабых или обездоленных; в данном контексте социальной справедливости «бедным» наиболее ясно и точно.
- source_word: וְעֵינֵי אַלְמָנָה
  choice: и заставлял глаза вдовы
  rationale: Союз связывает второе параллельное условие с первым. Глагольная конструкция по-русски выражена при сказуемом следующей части, а единственное число «вдовы» сохранено как обобщающее.
- source_word: אֲכַלֶּה
  choice: томиться ожиданием
  rationale: Пиэль от כלה буквально передаёт доведение до истощения или конца. В сочетании с глазами это идиома о долгом, напрасном ожидании; выбран естественный русский эквивалент с пояснительной сноской.
