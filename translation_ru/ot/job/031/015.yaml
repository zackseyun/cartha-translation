base_translation:
  language: en
  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: ru
  text: Разве не Тот, кто создал меня во чреве, создал и его? Разве не один образовал нас в утробе?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…и образовал нас в одной утробе». Еврейское выражение допускает такой синтаксический разбор, но может означать и «не один ли образовал нас в утробе?»; в контексте речь идёт об общем происхождении людей перед их Создателем.'
    reason: Сохраняет отмеченную в еврейском тексте синтаксическую неоднозначность, не приписывая Иову и его слуге одну биологическую мать в основном тексте.
lexical_decisions:
- source_word: הֲלֹא
  choice: Не Тот ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно сочетается в русском с последующим причастным оборотом.
- source_word: בַבֶּטֶן
  choice: во чреве
  rationale: В данном контексте בטן обозначает материнскую утробу как место внутриутробного формирования. «Во чреве» сохраняет достоинство поэтической речи и понятно современному читателю.
- source_word: עֹשֵׂנִי
  choice: кто создал меня
  rationale: Субстантивированное причастие с суффиксом первого лица передано глагольным оборотом, сохраняющим личный и деятельный смысл.
- source_word: עָשָׂהוּ
  choice: создал и его
  rationale: Местоименный суффикс относится к рабу из ближайшего контекста; частица «и» подчёркивает, что тот же Создатель сотворил обоих.
- source_word: וַיְכֻנֶנּוּ
  choice: и образовал нас
  rationale: Форма глагола כון здесь выражает устроение или формирование в утробе; суффикс естественно понимается как первое лицо множественного числа.
- source_word: בָּרֶחֶם אֶחָד
  choice: в одном чреве
  rationale: Буквальная поэтическая формулировка сохраняет акцент на общем человеческом происхождении, не сводя его к социальному положению.
theological_decisions:
- issue: К кому относится местоимение «его»
  choice: К рабу Иова, о котором говорится в непосредственном контексте
  alternative: К любому другому человеку в обобщённом смысле
  rationale: Иов 31:13–14 говорит о споре Иова с его рабом или рабыней. Единственное число оригинала сохранено, а более широкое применение к человеческому равенству оставлено подразумеваемым.
- issue: Смысл выражения «в одном чреве»
  choice: Общее сотворение и равное человеческое достоинство перед Богом
  alternative: 'Буквально одна и та же материнская утроба; либо синтаксическое прочтение: «и не Один ли образовал нас во чреве?»'
  rationale: Поэтический контекст говорит не о том, что у Иова и его раба одна биологическая мать, а об их общей сотворённости. При этом синтаксическая неоднозначность еврейского выражения отмечена в сноске, а не устранена из свидетельства текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейско-поэтическим словом «чрево». Единый риторический вопрос воспроизводит компактность еврейской строки; формулировка не вводит имени Бога, которого в стихе прямо нет.
