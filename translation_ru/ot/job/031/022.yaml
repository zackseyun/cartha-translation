  - marker: b
    text: 'Или: «от сустава». Редкое еврейское слово может обозначать кость руки либо её суставную часть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפִי
  choice: плечо моё
  rationale: כָּתֵף обычно обозначает плечо или бок; в параллели с «рукой» естественнее всего русское «плечо».
- source_word: מִשִּׁכְמָה
  choice: из сустава
  rationale: Буквально слово связано с областью плеча или спины, но сочетание с «выпадет» описывает отделение плеча от места соединения. «Из сустава» естественно передаёт телесный образ, а буквальная возможность отмечена в сноске.
- source_word: תִפּוֹל
  choice: выпадет
  rationale: Глагол буквально означает «падать». В сочетании с суставом «выпадет» сохраняет конкретный образ и не заменяет его медицинским термином «вывихнется».
- source_word: וְאֶזְרֹעִי
  choice: и рука моя
  rationale: זְרוֹעַ означает руку, особенно её часть от плеча; нейтральное русское «рука» здесь не вводит излишней анатомической точности.
- source_word: מִקָּנָה
  choice: у кости
  rationale: Редкое анатомическое употребление קָנֶה, вероятно, указывает на кость, стержень кости или суставную часть руки. «У кости» сохраняет телесный параллелизм, не утверждая чрезмерно точную анатомическую локализацию.
- source_word: תִשָּׁבֵר
  choice: переломится
  rationale: Нифаль от שׁבר выражает состояние или пассивное действие «быть сломанным»; применительно к руке по-русски естественно «переломится».
