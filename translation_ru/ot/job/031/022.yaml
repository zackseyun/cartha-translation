translation:
  language: ru
  text: 'тогда пусть моё плечо выпадет из сустава[a],

    и пусть моя рука отломится от кости[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от плеча». Еврейское выражение, вероятно, рисует плечо, оторванное от места своего соединения.'
