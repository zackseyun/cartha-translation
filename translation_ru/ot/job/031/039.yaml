  yaml_path: translation/ot/job/031/039.yaml
  text: if I have eaten its produce without payment[a], or caused its owners to lose heart—
translation:
  language: ru
  text: если я ел её урожай, не заплатив, и доводил её владельцев до изнеможения[a], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишал её владельцев жизни» или «заставлял их задыхаться». Еврейский глагол редок; этот оборот может означать крайнее угнетение либо причинение смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: её урожай
  rationale: Буквально «её сила»; в контексте земли слово обозначает её плодородную силу, то есть приносимый ею урожай.
- source_word: אָכַלְתִּי
  choice: я ел
  rationale: Обычное значение глагола — «есть»; здесь речь об употреблении урожая земли.
- source_word: בְלִי כָסֶף
  choice: не заплатив
  rationale: Буквально «без серебра»; серебро выступает обозначением денег, а деепричастная конструкция естественно передаёт смысл присвоения урожая без оплаты.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: Основные значения — «жизнь, живое существо, душа». Сохранение слова «жизнь» не снимает напряжения редкой конструкции и допускает сильный смысл — доведение владельцев до смерти.
- source_word: בְּעָלֶיהָ
  choice: её владельцев
  rationale: В данном контексте множественное число בַּעַל с суффиксом относится к владельцам земли.
- source_word: הִפָּחְתִּי
  choice: отнимал
  rationale: Редкая форма Hiphil от נפח допускает понимание «заставить испустить дух, лишить жизни» либо «заставить задыхаться». В сочетании с «жизнь» перевод «отнимал жизнь» сохраняет сильное традиционное прочтение, а неопределённость отмечена в сноске.
theological_decisions:
- issue: Степень причинённого владельцам вреда
  choice: 'Основной текст передаёт возможный буквальный смысл: «отнимал жизнь».'
  alternative: «Заставлял её владельцев задыхаться» или, более идиоматично, «доводил её владельцев до изнеможения».
  rationale: Редкий глагол допускает как причинение смерти, так и образ крайнего угнетения; поэтому основной текст не ослабляет сильное чтение, а альтернатива сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической клятвы Иова. Строка оставлена синтаксически незавершённой и заканчивается тире, поскольку это условная часть клятвенной формулы, продолженной в следующем стихе.
