base_translation:
  language: en
  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: ru
  text: Если я радовался бедствию того, кто ненавидит меня[a], и ликовал, когда его постигло несчастье[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моего врага». Буквально: «того, кто ненавидит меня».'
