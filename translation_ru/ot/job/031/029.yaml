  - marker: b
    text: 'Буквально: «когда зло нашло его»; также возможно: «когда его постигла беда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условную часть клятвенного заверения Иова в своей невиновности; незавершённость конструкции уместно передаётся тире в конце стиха.
- source_word: אֶשְׂמַח
  choice: я радовался
  rationale: Глагол שׂמח означает радость; форма прошедшего времени естественна в русском условном высказывании о прошлом.
- source_word: בְּפִיד
  choice: бедствию
  rationale: פִיד обозначает губительное бедствие, несчастье или погибель. «Бедствие» сохраняет широту значения и не утверждает непременно окончательную гибель человека.
- source_word: מְשַׂנְאִי
  choice: того, кто ненавидит меня
  rationale: Причастная форма буквально обозначает ненавидящего Иова; такой перевод точнее сохраняет словесную форму оригинала, чем обобщённое «враг».
- source_word: וְהִתְעֹרַרְתִּי
  choice: и ликовал
  rationale: В данном параллелизме форма от עור передаёт эмоциональное возбуждение и торжество. «Ликовал» выражает усиленную радость, не добавляя более узкого оттенка злорадства.
- source_word: כִּי
  choice: когда
  rationale: Связывает ликование с обстоятельством постигшего другого человека несчастья; временное значение естественно в контексте.
- source_word: מְצָאוֹ רָע
  choice: его постигло несчастье
  rationale: Буквально зло или беда «нашло его»; русское «постигло» естественно передаёт этот образ в значении случившейся беды, а не нравственного зла.
theological_decisions:
- issue: Нравственный смысл радости по поводу бедствия ненавидящего Иова
  choice: Сохранить отрицание радости и ликования по поводу чужого несчастья, не усиливая основной текст словом «злорадствовал».
  alternative: «Если я радовался погибели моего врага и злорадствовал, когда его постигла беда…»
  rationale: Контекст явно касается неправедной радости о несчастье недруга, однако еврейский глагол не требует непременно более узкого и оценочного перевода «злорадствовать».
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической клятвы Иова. Синтаксический параллелизм сохранён; конечное тире показывает незавершённую условную конструкцию. Лексика понятна широкому читателю и не вносит конфессиональных толкований.
