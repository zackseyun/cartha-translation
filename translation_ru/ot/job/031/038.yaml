  text: אִם עָ֭לַ/י אַדְמָתִ֣/י תִזְעָ֑ק וְ֝/יַ֗חַד תְּלָמֶ֥י/הָ יִבְכָּיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/038.yaml
  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: ru
  text: Если моя земля вопиёт против меня и её борозды вместе плачут[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рыдают»; еврейский глагол обычно обозначает плач или скорбь и здесь поэтически относится к бороздам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условие в клятве Иова о своей невиновности; простой союз «если» естественно передаёт еврейскую конструкцию.
- source_word: עָלַי
  choice: против меня
  rationale: 'При глаголе זעק предлог על здесь имеет обвинительный, направленный против Иова смысл: земля как бы свидетельствует о его вине.'
- source_word: אַדְמָתִי
  choice: моя земля
  rationale: אדמה обозначает землю как обрабатываемое угодье; «моя земля» естественно звучит в данном сельскохозяйственном контексте.
- source_word: תִזְעָק
  choice: вопиёт
  rationale: זעק означает сильный крик, нередко вызванный бедствием или требованием справедливости. «Вопиёт» сохраняет олицетворение земли и оттенок обвинительного протеста.
- source_word: וְיַחַד
  choice: и … вместе
  rationale: יחד указывает на совместность действия; наречие «вместе» сохранено рядом со сказуемым в естественном русском порядке слов.
- source_word: תְּלָמֶיהָ
  choice: её борозды
  rationale: תלם — борозда, проведённая плугом. Выбор точно сохраняет земледельческий образ.
- source_word: יִבְכָּיוּן
  choice: плачут
  rationale: Глагол בכה обычно означает «плакать». Здесь он поэтически продолжает олицетворение земли и отличает плач борозд от её вопля.
theological_decisions:
- issue: Обвинительное свидетельство земли
  choice: «вопиёт против меня»
  alternative: «вопиёт из-за меня»
  rationale: 'Формулировка сохраняет вероятный судебно-нравственный оттенок: в условной клятве земля выступает свидетельницей против Иова, но перевод не уточняет, в чём именно могло состоять нарушение.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим глаголом «вопиёт». Сохранены условная форма, олицетворение земли и параллелизм двух полустиший.
