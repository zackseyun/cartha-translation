  language: ru
  text: 'если люди моего шатра не говорили[a]: «Кто не насытился его мясом?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои домочадцы»; буквально: «люди моего шатра».'
