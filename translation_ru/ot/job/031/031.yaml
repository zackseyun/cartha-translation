  - marker: b
    text: 'Буквально: «от его плоти». Вероятно, речь о мясе, которым Иов кормил людей за своим столом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: если ... не
  rationale: Сохранена условная форма клятвенного заверения Иова; зависимость условия от окружающего контекста намеренно не сглажена.
- source_word: מְתֵי אָהֳלִי
  choice: люди моего шатра
  rationale: Передан конкретный образ шатра; выражение может обозначать домашних или домочадцев Иова.
- source_word: מִי יִתֵּן
  choice: кто
  rationale: В данном контексте оборот естественно вводит риторический вопрос, а не пожелание «кто бы дал».
- source_word: מִבְּשָׂרוֹ
  choice: его мясом
  rationale: Предлог מִן отражён русским творительным при глаголе насыщения; בשר здесь вероятнее означает мясо как пищу, которой Иов щедро кормил домашних или гостей, хотя буквально возможно «плоть».
- source_word: לֹא נִשְׂבָּע
  choice: не насыщался
  rationale: Нифаль от שׂבע передаёт насыщение, особенно уместное в контексте еды и гостеприимства.
theological_decisions:
- issue: Чья плоть или мясо подразумевается в מִבְּשָׂרוֹ
  choice: Сохранено местоимение «его» с пояснением пищевого смысла
  alternative: «мясом с его стола» или «моей пищей»
  rationale: Еврейский текст грамматически сохраняет местоимение третьего лица, референт которого не вполне прозрачен. Эксплицитная замена на «моим» устранила бы подлинную трудность текста.
translation_notes:
  register: Современный литературный русский с сохранением клятвенно-условного синтаксиса и конкретного образа шатра. Риторический вопрос сформулирован кратко и естественно; лексическая и референциальная неоднозначность местоимения не устранена.
