base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: ru
  text: Ибо я страшился великого множества людей[a], и презрение родов ужасало меня[b], так что я молчал и не выходил за порог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «великого множества»; речь идёт о многочисленной толпе или обществе.'
    reason: lexical_alternative
  - marker: b
    text: «Роды» — большие группы родственников, то есть семьи или кланы. Еврейское выражение может быть передано и как «презрение семей (кланов)». Стих входит в клятву Иова о невиновности; он называет страх перед общественным мнением как причину молчания и отказа выйти из дома.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: если
  rationale: В контексте клятвы Иова частица вводит подразумеваемое условие самоосуждения. Русское «если» яснее передаёт эту синтаксическую функцию, чем причинное «потому что».
- source_word: אֶעֱרוֹץ
  choice: я страшился
  rationale: Глагол ערץ обозначает сильный страх или трепет. «Страшился» сохраняет силу выражения и соответствует приподнятому, но понятному регистру.
- source_word: הָמוֹן רַבָּה
  choice: великого множества людей
  rationale: הָמוֹן — множество, толпа; רַבָּה подчёркивает многочисленность или величину. Добавление «людей» естественно раскрывает подразумеваемый референт.
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: и презрение родов
  rationale: בּוּז означает презрение или поношение, а מִשְׁפָּחוֹת — расширенные семьи, роды или кланы. «Роды» передаёт более широкие древние группы родства, не ограничивая смысл современными нуклеарными семьями.
- source_word: יְחִתֵּנִי
  choice: ужасало меня
  rationale: Каузативная форма от חתת выражает наведение страха, смятение или сокрушение мужества. «Ужасало меня» сохраняет эмоциональную силу и хорошо сочетается со «страшился».
- source_word: וָאֶדֹּם
  choice: так что я молчал
  rationale: דמם значит молчать или оставаться безмолвным. Связь с предшествующими страхами естественно понята как результат, что передано оборотом «так что».
- source_word: לֹא אֵצֵא פָתַח
  choice: и не выходил за порог
  rationale: Буквально выражение связано с выходом у входа или двери. Русское «не выходил за порог» естественно передаёт образ человека, остающегося внутри из страха перед обществом.
theological_decisions:
- issue: Условный или причинный смысл כִּי
  choice: Условное «если»
  alternative: «потому что» / «ибо»
  rationale: 'Стих входит в развернутую клятву о невиновности: Иов называет гипотетическое поведение, за которое готов принять последствия. Условная передача сохраняет связь с формулой клятвы и не утверждает, будто он действительно поступал так.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим тоном. Сохранена незавершённость клятвенной конструкции при помощи конечного тире; «за порог» звучит естественнее буквального «из двери», не устраняя образ пребывания внутри.
