base_translation:
  language: en
  yaml_path: translation/ot/job/031/004.yaml
  text: Does he not see my ways and count all my steps?[a]
translation:
  language: ru
  text: Разве Он не видит моих путей и не считает каждый мой шаг?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве Он не наблюдает за моим поведением и не исчисляет каждый мой шаг?»'
    reason: 'Лексическая альтернатива: «пути» могут обозначать поведение, а יִסְפּוֹר допускает перевод «исчисляет».'
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве ... не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; эта русская конструкция естественно передаёт его силу.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение сохраняется; прописная буква ясно указывает на Бога в данном контексте, не добавляя усилительного «Сам».
- source_word: יִרְאֶה
  choice: видит
  rationale: Основное значение глагола — «видеть»; оно сохраняет конкретный образ Божьего наблюдения без доктринального разъяснения.
- source_word: דְרָכָי
  choice: моих путей
  rationale: Сохраняются множественное число и еврейская метафора, охватывающая как жизненный путь, так и поведение.
- source_word: וְכָל
  choice: и ... всех
  rationale: Передаёт соединение двух параллельных частей и всеохватность исходного выражения.
- source_word: צְעָדַי
  choice: моих шагов
  rationale: Естественный современный эквивалент, сохраняющий образ отдельных движений и поступков Иова.
- source_word: יִסְפּוֹר
  choice: считает
  rationale: Прямо передаёт значение «считать, исчислять» и сохраняет конкретную образность оригинала.
theological_decisions:
- issue: Божественное знание, выраженное антропоморфными глаголами
  choice: Сохранить риторическое утверждение о том, что Бог видит пути Иова и считает все его шаги.
  alternative: Разве Он не наблюдает за моим поведением и не учитывает все мои поступки?
  rationale: В еврейском тексте употреблены конкретные образы видения и счёта. Их следует сохранить, не заменяя абстрактной формулировкой о всеведении и не сужая метафору до одних лишь нравственных поступков.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конструкция «Разве ... не» передаёт риторический вопрос; метафоры «пути» и «шаги» сохранены. Формы родительного падежа после отрицательных глаголов естественны для русского литературного употребления.
