  yaml_path: translation/ot/job/031/033.yaml
  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: ru
  text: Если я, подобно человеку[a], скрывал свои преступления, пряча свою вину у себя за пазухой, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобно Адаму». Еврейское אָדָם может означать как «человек», так и имя «Адам».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет условную протасис в структуре клятвы Иова, не добавляя усилительного значения.
- source_word: כִּסִּיתִי
  choice: скрывал
  rationale: Глагол כסה буквально означает «покрывать» и также «скрывать». В русском сочетание «покрывал преступления» может ошибочно восприниматься как укрывательство чужих деяний, поэтому «скрывал» естественно передаёт смысл в данном контексте.
- source_word: כְאָדָם
  choice: подобно человеку
  rationale: אָדָם допускает понимание как нарицательного «человек» и как имени «Адам». Основной текст сохраняет нейтральное нарицательное прочтение, а значимое альтернативное прочтение вынесено в сноску.
- source_word: פְּשָׁעָי
  choice: свои преступления
  rationale: פֶּשַׁע обозначает преступление, проступок или мятеж. «Преступления» сохраняет нравственно-правовой оттенок и хорошо сочетается с контекстом самооправдания Иова.
- source_word: לִטְמוֹן
  choice: пряча
  rationale: Инфинитив טמן выражает сокрытие; деепричастие естественно передаёт способ действия и связь с предшествующим «скрывал».
- source_word: בְּחֻבִּי
  choice: у себя за пазухой
  rationale: Редкая форма обозначает область груди, пазуху или скрытое место при себе. Русская идиома сохраняет телесный образ и идею тайного укрытия.
- source_word: עֲוֺנִי
  choice: свою вину
  rationale: עָוֹן может обозначать беззаконие, вину или последствие греха. «Вина» здесь естественна по-русски и не устраняет нравственный смысл.
theological_decisions:
- issue: Понимание אָדָם в כְאָדָם
  choice: 'нарицательное: «подобно человеку»'
  alternative: 'имя собственное: «подобно Адаму»'
  rationale: Еврейская форма допускает оба прочтения. Основной текст не утверждает спорную аллюзию, а сноска сохраняет традиционное и богословски значимое прочтение как указание на Адама.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической клятвы. Конструкция оставлена незавершённой и завершается тире, поскольку это условная часть более широкого высказывания. Местоимения «свои/свою» естественно соотносят проступки и вину с говорящим.
