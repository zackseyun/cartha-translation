  text: Если моё сердце увлеклось женщиной[a] и я подстерегал у двери моего ближнего[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «было обмануто», «было соблазнено» или «поддалось уговорам». Еврейский глагол может обозначать обольщение или склонение к чему-либо; здесь он употреблён в контексте сексуального искушения.'
