lexical_decisions:
- source_word: נִפְתָּה
  choice: прельстилось
  rationale: Нифаль глагола פתה может выражать обольщение, соблазнение или поддавание уговорам. «Прельстилось» естественно сочетается с «сердце», передаёт внутреннее влечение и не приписывает женщине прямо выраженную в еврейском тексте активную роль.
- source_word: לִבִּי
  choice: моё сердце
  rationale: Сохраняет еврейский образ сердца как средоточия желаний, решений и намерений.
- source_word: עַל אִשָּׁה
  choice: женщиной
  rationale: В сочетании с נִפְתָּה обозначает предмет или повод влечения; творительный падеж по-русски естественно передаёт смысл сексуального соблазна, не добавляя отсутствующих в тексте подробностей.
- source_word: פֶּתַח
  choice: у двери
  rationale: «Дверь» — краткий и естественный эквивалент, а предлог «у» передаёт нахождение возле входа.
- source_word: רֵעִי
  choice: моего ближнего
  rationale: רֵעַ может означать ближнего, друга или товарища. «Ближний» сохраняет широкий общественно-нравственный смысл и не предполагает непременно близкой дружбы.
- source_word: אָרָבְתִּי
  choice: я подстерегал
  rationale: Глагол ארב обозначает скрытое ожидание с недобрым или тайным намерением. «Подстерегал» передаёт намеренность и скрытность лучше, чем нейтральное «ждал».
theological_decisions:
- issue: Нравственный смысл клятвы Иова о супружеской неверности
  choice: Передать движение от внутреннего влечения к намеренному тайному действию, не называя прямо совершённое прелюбодеяние.
  alternative: Истолковать первую строку как безобидную влюблённость либо вторую как уже совершённую попытку прелюбодеяния.
  rationale: Еврейский текст соединяет внутреннее прельщение сердца и скрытое ожидание у двери ближнего. Перевод сохраняет нравственную серьёзность и развитие мысли, но не вносит деталей, которых стих прямо не сообщает.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Условное начало сохранено как часть продолжающейся клятвы; конечная запятая показывает синтаксическую связь со следующим стихом. Все примечания отмечены в основном тексте.
