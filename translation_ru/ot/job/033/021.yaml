lexical_decisions:
- source_word: יִכֶל
  choice: истощается
  rationale: Форма от כלה описывает постепенное иссякание и изнурение плоти; настоящее время естественно передаёт незавершённый процесс.
- source_word: בְּשָׂרוֹ
  choice: его плоть
  rationale: Конкретное «плоть» сохраняет телесный образ еврейского текста и уместно в возвышенном современном русском.
- source_word: מֵרֹאִי
  choice: исчезая из виду
  rationale: Сочетание מן с רֹאִי указывает на исчезновение из поля зрения; деепричастный оборот ясно связывает это с истощением плоти.
- source_word: וְשֻׁפִי
  choice: выступают наружу
  rationale: Трудная форма по контексту обозначает, что прежде скрытые кости становятся заметными или обнажаются; перевод сохраняет образ, не придавая форме чрезмерно узкого смысла.
- source_word: עַצְמוֹתָיו
  choice: кости его
  rationale: Прямой перевод существительного с суффиксом третьего лица мужского рода; порядок слов поддерживает достойный поэтический регистр.
- source_word: לֹא רֻאּוּ
  choice: прежде невидимые
  rationale: Отрицательная пассивная форма от ראה означает, что кости не были видны; «прежде» естественно выражает подразумеваемый временной контраст.
