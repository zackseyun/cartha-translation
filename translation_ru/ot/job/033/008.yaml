    rationale: Противительное «но» вносит в стих отчётливое противопоставление, которого сама частица в данном употреблении не требует. Утвердительное «Да» лучше соответствует её функции перед цитированием слов Иова.
  - severity: medium
    issue: Буквальное «в моих ушах» в основном тексте
    rationale: Это неестественный для современного литературного русского оборот и способен создать неверный физический образ. Идиоматическое «при мне» передаёт, что Елиуй слышал речь сам; буквальность уместно сохранить в сноске.
  - severity: low
    issue: «звук слов»
    rationale: Выражение чрезмерно буквально и стилистически тяжеловесно. «Я слышал твои слова» естественно передаёт смысл слухового восприятия; сноска отмечает буквальное повторное упоминание «звука/голоса слов».
