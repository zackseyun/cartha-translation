  text: 'Да, ты говорил при мне, и я слышал твои слова:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: 'В данном контексте частица может обозначать переход к возражению: Елиуй противопоставляет услышанным словам Иова свой ответ. «Но» естественно передаёт эту дискурсивную функцию, не устраняя возможного оттенка усиления.'
- source_word: אָמַרְתָּ
  choice: ты говорил
  rationale: Форма qatal 2 м. ед. указывает на уже прозвучавшую речь; несовершенный вид по-русски уместен перед последующим изложением её содержания.
- source_word: בְאָזְנָי
  choice: в моих ушах
  rationale: 'Сохранён буквальный еврейский образ: слова были произнесены непосредственно в присутствии Елиуя и доступны его слуху.'
- source_word: וְקוֹל
  choice: и ... звук
  rationale: קוֹל допускает значения «голос» и «звук»; при מִלִּין сочетание «звук слов» сохраняет чувственно-слуховой акцент исходного текста.
- source_word: מִלִּין
  choice: слов
  rationale: Арамеизирующая форма множественного числа означает «слова». Притяжательное «твоих» не добавлено, поскольку его нет в исходном тексте и принадлежность ясна из контекста.
- source_word: אֶשְׁמָע
  choice: я слышал
  rationale: Хотя форма морфологически имперфектная, здесь она соотносится с уже произнесённой речью Иова; русское прошедшее время естественно передаёт контекстуальный смысл.
