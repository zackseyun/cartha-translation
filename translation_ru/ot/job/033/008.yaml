  source_fidelity: Частица אַךְ здесь имеет утвердительно-усилительное значение («да», «поистине»), а не ясно выраженное противительное «но». Буквальное «в моих ушах» передаёт форму оригинала, но в современном русском не является естественным соответствием идиоме «в моём слухе / при мне».
  naturalness: «Но ты говорил в моих ушах» звучит неестественно и может быть понято как физическое действие. Сочетание «звук слов» грамматически возможно, но в данном контексте тяжеловесно; естественнее передать слуховой акцент глаголом «слышал» и дополнением «твои слова».
  terminology: Имена и специальные богословские термины отсутствуют. «При мне» адекватно передаёт смысл בְאָזְנָי; притяжательное «твои» в русском ясно и оправдано контекстом обращения Елиуя к Иову.
