  text: יָשֵׂ֣ם בַּ/סַּ֣ד רַגְלָ֑/י יִ֝שְׁמֹ֗ר כָּל אָרְחֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/011.yaml
  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: ru
  text: Он ставит мои ноги в колодки, следит за всеми моими путями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «охраняет все мои пути». Еврейский глагол может означать и наблюдение, и охрану; в данном контексте вероятнее имеется в виду пристальное, недоброжелательное наблюдение, а не защита.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: ставит
  rationale: Обычное значение глагола שׂים — «класть, ставить, помещать»; «ставит» естественно сочетается с образом ног в колодках.
- source_word: בַּסַּד
  choice: в колодки
  rationale: Существительное סַד обозначает приспособление, сковывающее ноги; «колодки» сохраняет конкретный образ принудительного заключения.
- source_word: רַגְלָי
  choice: мои ноги
  rationale: Форма с суффиксом первого лица относится к ногам говорящего; русский эквивалент передаёт это прямо и естественно.
- source_word: יִשְׁמֹר
  choice: следит
  rationale: Глагол שׁמר может означать «стеречь, охранять, наблюдать». В контексте пересказа жалобы Иова «следит» передаёт пристальное наблюдение без оттенка заботливой защиты.
- source_word: כָּל
  choice: всеми
  rationale: Количественное значение «все» естественно выражено формой «всеми» при управлении глагола «следит за».
- source_word: אָרְחֹתָי
  choice: моими путями
  rationale: אֹרַח означает «путь, тропа» и метафорически — образ действий или течение жизни; «пути» сохраняет исходную метафору.
theological_decisions:
- issue: Передаёт ли вторая строка защиту или пристальное наблюдение со стороны Бога
  choice: «следит за всеми моими путями» — наблюдение в судебно-враждебном контексте
  alternative: «охраняет все мои пути» — защитная забота
  rationale: Здесь Елиуй пересказывает жалобу Иова на то, что Бог обращается с ним как с противником и ограничивает его. Поэтому контекст склоняет к наблюдению, однако лексическая возможность значения «охранять» сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык; краткий параллелизм исходного стиха сохранён. «Колодки» передают конкретный древний образ сковывания ног, а «пути» сохраняют метафору жизненного поведения.
