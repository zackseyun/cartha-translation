  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: ru
  text: 'Он поёт перед людьми и говорит: «Я согрешил, извратил то, что правильно, и мне не воздано по заслугам[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не было равно мне». Смысл заключительной фразы не вполне ясен; возможны переводы: «мне не было воздано [соразмерно]» или «это не принесло мне пользы».'
    reason: Отмечает неоднозначность редкого еврейского выражения וְלֹא שָׁוָה לִי, сохраняя основной перевод в русле английского POB audit trail.
lexical_decisions:
- source_word: יָשֹׁר
  choice: поёт
  rationale: Форма допускает значение «поёт»; в данном контексте речь идёт о публичном свидетельстве избавленного человека. Возможное понимание «смотрит» менее естественно в контексте.
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  choice: и исказил правду
  rationale: 'Буквально: «прямое/правильное я сделал кривым». По-русски «исказил правду» естественно передаёт нравственное противопоставление прямого и кривого, не сужая его до отдельного поступка.'
- source_word: וְלֹא שָׁוָה לִי
  choice: но мне не было воздано по заслугам
  rationale: 'Редкое выражение допускает оттенки «не было равно/соразмерно мне» и «не принесло мне пользы». В контексте признания греха и избавления выбран смысл: человек не понёс соразмерного воздаяния. Союз «но» естественно выражает контраст.'
theological_decisions:
- issue: Смысл заключительной фразы о результате греха
  choice: мне не было воздано по заслугам
  alternative: это не принесло мне пользы
  rationale: Контекст стихов 24–28 говорит о пощаде и избавлении от погибели, поэтому вероятнее указание на незаслуженно смягчённое воздаяние. Однако древнееврейская фраза редка и остаётся неоднозначной.
translation_notes:
  register: Современный литературный русский язык; сохранены исповедальный тон, образ искажения правильного и напряжение между признанием вины и милостивым избавлением.
