  text: Вот, всё это Бог совершает с человеком два или три раза.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶן
  choice: Вот
  rationale: Частица привлекает внимание к итоговому утверждению; «вот» естественно и достойно передаёт её указательно-эмфатическую силу.
- source_word: כָּל אֵלֶּה
  choice: всё это
  rationale: Выражение охватывает перечисленные ранее действия Бога; в русском языке местоименная конструкция не требует добавления слова «дела» или «вещи».
- source_word: יִפְעַל
  choice: совершает
  rationale: Глагол обозначает осуществление действий. «Совершает» сочетается со «всё это» естественнее, чем буквальное «делает», и сохраняет возвышенный, но современный регистр.
- source_word: אֵל
  choice: Бог
  rationale: В данном контексте אֵל — обычное обозначение Бога, поэтому прямое соответствие «Бог» не требует уточняющих эпитетов.
- source_word: פַּעֲמַיִם שָׁלוֹשׁ
  choice: дважды и трижды
  rationale: Сохранена выразительная еврейская числовая последовательность, обозначающая повторяемость. Русское «дважды и трижды» звучит естественно и не сводит смысл к строго фиксированному числу повторений.
- source_word: עִם
  choice: с
  rationale: Предлог прямо описывает Божьи действия по отношению к человеку как совершаемые «с» ним и избегает более толковательных вариантов «для» или «по отношению к».
- source_word: גָּבֶר
  choice: человеком
  rationale: Хотя существительное мужского рода может означать мужчину, здесь оно употреблено как единичное обозначение человека вообще. Русское «человек» также грамматически мужского рода и сохраняет репрезентативное единственное число без ложного ограничения только взрослыми мужчинами.
theological_decisions:
- issue: Репрезентативное мужское обозначение גָּבֶר
  choice: человеком
  alternative: мужчиной
  rationale: Контекст говорит о Божьем обращении с отдельным человеком вообще. «Человек» в русском языке сохраняет единственное число и грамматический мужской род исходного слова, не приписывая тексту исключения женщин.
- issue: Смысл числовой пары פַּעֲמַיִם שָׁלוֹשׁ
  choice: дважды и трижды
  alternative: два или три раза
  rationale: Исходная формула допускает понимание повторных Божьих действий без необходимости строго выбирать между двумя и тремя случаями. Сохранение парной формулы передаёт её риторическую силу и смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Инверсия «всё это Бог совершает» подчёркивает совокупность ранее названных Божьих действий; тире отделяет итоговое указание на их повторяемость.
