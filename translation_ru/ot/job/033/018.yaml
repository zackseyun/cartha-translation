base_translation:
  language: en
  yaml_path: translation/ot/job/033/018.yaml
  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: ru
  text: Он бережёт его душу от ямы[a], а жизнь — от гибели от оружия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от могилы»; возможен также смысл «от погибели».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать оружие вообще, метательное оружие или дротик; возможно также значение «меч». Вторая строка говорит о спасении от насильственной смерти.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: удерживает
  rationale: Глагол חשׂך в породе хифиль означает «удерживать, не допускать, щадить». «Удерживает» сохраняет образ предотвращения движения к смерти и не уточняет субъект сверх сказанного в контексте.
- source_word: נַפְשׁוֹ
  choice: его душу
  rationale: נפש может обозначать душу, жизнь или самого человека. «Душу» сохраняет поэтическую форму первой строки, тогда как параллельное «жизнь» раскрывает смысл сохранения человека от смерти.
- source_word: מִנִּי שָׁחַת
  choice: от ямы
  rationale: שׁחת может означать яму, могилу или погибель. «Яма» сохраняет конкретный поэтический образ смерти и оставляет его смысловой диапазон открытым.
- source_word: וְחַיָּתוֹ
  choice: а жизнь
  rationale: В данном параллелизме חיה обозначает жизнь человека. Притяжательное отношение ясно из первой части и по-русски естественно не повторяется.
- source_word: מֵעֲבֹר בַּשָּׁלַח
  choice: от гибели от оружия
  rationale: Буквально конструкция содержит идею «прохождения» при שׁלח, однако в контексте речь о предотвращении насильственной смерти. Русское выражение передаёт смысл идиоматично, а неоднозначность существительного отмечена в сноске.
theological_decisions:
- issue: Соотношение «души» и «жизни»
  choice: Сохранён поэтический параллелизм «душу… жизнь».
  alternative: Передать оба слова как «жизнь» или первое как местоимение «его».
  rationale: Еврейский текст не утверждает здесь строгого разделения души и жизни; параллельные слова описывают спасение всего человека от смерти. Сохранение разных слов не снимает эту поэтическую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической образностью. Эллипсис «а жизнь» естественно передаёт параллелизм и избегает тяжёлого повторения притяжательного местоимения.
