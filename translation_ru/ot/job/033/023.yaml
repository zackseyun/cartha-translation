  yaml_path: translation/ot/job/033/023.yaml
  text: If there is for him an angel[a], a mediator, one among a thousand, to declare to man his uprightness[b],
translation:
  language: ru
  text: Если у него есть ангел, посредник[a], один из тысячи, чтобы возвестить человеку, что для него правильно[b],
  philosophy: optimal-equivalence
