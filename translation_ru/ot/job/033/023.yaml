lexical_decisions:
- source_word: אִם יֵשׁ
  choice: Если есть
  rationale: Передаёт условный характер высказывания и экзистенциальное значение יֵשׁ без усиления до значения «когда».
- source_word: עָלָיו
  choice: для него
  rationale: В данном сочетании указывает на отношение ангела к человеку и допускает действие в его пользу; формулировка не сводит выражение ни только к пространственному «над ним», ни исключительно к заступничеству.
- source_word: מַלְאָךְ
  choice: ангел
  rationale: В контексте речи Елиуя вероятнее небесный посланник; более широкое значение «вестник» сохранено в сноске.
- source_word: מֵלִיץ
  choice: посредник
  rationale: Слово может обозначать толкователя, представителя или ходатая. «Посредник» естественно передаёт общую функцию фигуры, не уточняя её сверх сказанного в тексте.
- source_word: אֶחָד מִנִּי אָלֶף
  choice: один из тысячи
  rationale: Сохраняет образ редкости и исключительности в естественной русской форме.
- source_word: לְהַגִּיד
  choice: возвестить
  rationale: Передаёт целевое значение инфинитива и торжественную весомость глагола, оставаясь понятным современному читателю.
- source_word: לְאָדָם
  choice: человеку
  rationale: Здесь אָדָם обозначает отдельного человека; русское «человеку» точно и естественно передаёт это значение.
- source_word: יָשְׁרוֹ
  choice: его правоту
  rationale: Сохраняет притяжательный суффикс и значение прямоты или правоты. Возможное идиоматическое понимание — сообщить человеку, что для него правильно, — вынесено в сноску.
theological_decisions:
- issue: Личность и функция מַלְאָךְ מֵלִיץ
  choice: Обобщённое «ангел, посредник» без дальнейшего отождествления.
  alternative: Человеческий вестник или толкователь; либо небесный ходатай с более выраженным богословским смыслом.
  rationale: Еврейский текст называет фигуру ангелом или вестником и посредником или толкователем, но не устанавливает её личность точнее. Перевод не привносит развитую ангелологическую или христологическую интерпретацию.
- issue: Значение יָשְׁרוֹ и отнесение суффикса
  choice: «его правоту», с сохранением грамматической краткости и некоторой неоднозначности.
  alternative: «Что для него правильно» или «его верный путь».
  rationale: Форма допускает понимание как правоты человека, так и того, что является правильным в его случае. Основной текст близок к форме оригинала, а идиоматическое прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Синтаксическая незавершённость в конце сохранена, поскольку условное предложение продолжается в следующем стихе.
