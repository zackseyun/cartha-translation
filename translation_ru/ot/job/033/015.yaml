  text: בַּ/חֲל֤וֹם חֶזְי֬וֹן לַ֗יְלָה בִּ/נְפֹ֣ל תַּ֭רְדֵּמָה עַל אֲנָשִׁ֑ים בִּ֝/תְנוּמ֗וֹת עֲלֵ֣י מִשְׁכָּֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: ru
  text: Во сне, в ночном видении, когда глубокий сон нисходит на людей, в дремоте на ложе,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: Во сне
  rationale: Предлог בְּ обозначает здесь обстановку или средство откровения; «во сне» естественно по-русски и соответствует поэтическому параллелизму.
- source_word: חֶזְיוֹן לַיְלָה
  choice: в ночном видении
  rationale: Сочетание буквально означает «видение ночи»; прилагательное «ночном» передаёт конструкцию естественным современным русским языком.
- source_word: בִּנְפֹל
  choice: когда … нисходит
  rationale: Инфинитив с בְּ вводит временное придаточное. Глагол «нисходит» сохраняет образ сна, опускающегося на человека, и соответствует возвышенному поэтическому регистру.
- source_word: תַּרְדֵּמָה
  choice: глубокий сон
  rationale: Слово обозначает особенно крепкий, глубокий сон; перевод не сужает значение до экстатического транса.
- source_word: עַל אֲנָשִׁים
  choice: на людей
  rationale: אֲנָשִׁים здесь имеет обобщающее значение и относится к людям, а не исключительно к мужчинам; «на людей» точно и естественно передаёт смысл.
- source_word: בִּתְנוּמוֹת
  choice: в дремоте
  rationale: Еврейское слово стоит во множественном числе как поэтическое обозначение состояния дремоты. Русское собирательное единственное звучит естественно, не меняя смысла.
- source_word: עֲלֵי מִשְׁכָּב
  choice: на ложе
  rationale: Сохраняется единственное число еврейского текста и поэтический образ; «ложе» уместно в dignified biblical register без архаической непонятности.
theological_decisions:
- issue: Обобщающее значение אֲנָשִׁים
  choice: людей
  alternative: мужчин
  rationale: Хотя существительное имеет форму мужского рода, в данном контексте оно обозначает людей вообще. Перевод «мужчин» мог бы ошибочно ограничить круг тех, кому Бог говорит во сне.
translation_notes:
  register: Современный литературный русский с умеренно поэтической библейской окраской. Сохранена незавершённая синтаксическая форма стиха, продолжающаяся в следующем стихе; поэтому в конце поставлена запятая.
