  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: ru
  text: Будь внимателен, Иов, слушай меня; молчи, и я буду говорить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: Внимай
  rationale: Побудительная форма от קשׁב призывает к сосредоточенному слушанию. «Внимай» точно передаёт усиленный оттенок и сохраняет достоинство поэтической речи, оставаясь понятным современному читателю.
- source_word: אִיּוֹב
  choice: Иов
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: שְׁמַע לִי
  choice: слушай меня
  rationale: Сочетание שׁמע с ל выражает направленное слушание; «слушай меня» естественно передаёт этот смысл и отличается от предшествующего призыва внимать.
- source_word: הַחֲרֵשׁ
  choice: молчи
  rationale: Императив от חרשׁ здесь означает сохранять молчание. «Молчи» кратко и прямо передаёт приказ в контексте просьбы не перебивать говорящего.
- source_word: וְאָנֹכִי
  choice: и я
  rationale: Сохранены союз וְ и явное местоимение אָנֹכִי; русское «и я» естественно выражает последовательность и лёгкое смысловое выделение говорящего.
- source_word: אֲדַבֵּר
  choice: буду говорить
  rationale: Имперфект Piel от דבר обозначает последующее, намеренное действие говорящего. «Буду говорить» точно и естественно передаёт продолженность речи после повеления молчать.
