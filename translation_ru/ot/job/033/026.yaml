source:
  edition: WLC
  text: יֶעְתַּ֤ר אֶל אֱל֨וֹהַּ וַ/יִּרְצֵ֗/הוּ וַ/יַּ֣רְא פָּ֭נָי/ו בִּ/תְרוּעָ֑ה וַ/יָּ֥שֶׁב לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: ru
  text: Он молится Богу[a], и Бог благоволит к нему; он видит лицо Бога[b] с радостным возгласом, и Бог возвращает человеку его праведность[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «усердно молит Бога». Еврейский глагол может подчёркивать настойчивую мольбу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его лицо». По смыслу, вероятнее всего, речь идёт о лице Бога.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «его правоту», «его правое положение». Здесь «праведность» может означать восстановленное положение человека перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: молится
  rationale: Глагол עתר обозначает обращённую к Богу молитву, нередко настойчивую и исполненную мольбы. «Молится» естественно звучит по-русски, а оттенок усиленной просьбы отмечен в сноске.
- source_word: אֱלוֹהַּ
  choice: Богу
  rationale: אֱלוֹהַּ — употребительное в книге Иова поэтическое единственное обозначение Бога. Добавление «Всемогущему» здесь не оправдано текстом.
- source_word: וַיִּרְצֵהוּ
  choice: и Бог благоволит к нему
  rationale: Глагол רצה здесь передаёт благосклонное принятие человека Богом. «Благоволит к нему» сохраняет личностный и положительный смысл, не сводя его лишь к формальному принятию.
- source_word: וַיַּרְא פָּנָיו
  choice: он видит лицо Бога
  rationale: Наиболее вероятно, что восстановленный человек видит лицо Бога. Явное повторение «Бога» устраняет неестественную для русского языка местоименную неясность, а сноска отмечает буквальную форму.
- source_word: בִּתְרוּעָה
  choice: с радостным возгласом
  rationale: תְּרוּעָה означает громкий возглас или крик, часто радостный либо торжествующий. Перевод сохраняет и звуковой, и эмоциональный компоненты.
- source_word: וַיָּשֶׁב
  choice: возвращает
  rationale: Каузативная форма שוב означает «возвратить, восстановить». В данном контексте Бог возвращает человеку утраченное положение.
- source_word: לֶאֱנוֹשׁ
  choice: человеку
  rationale: אֱנוֹשׁ обозначает человека, часто с оттенком смертности и немощи. «Человеку» литературно и естественно в данном обобщённом контексте.
- source_word: צִדְקָתוֹ
  choice: его праведность
  rationale: צְדָקָה прежде всего означает «праведность», но здесь может включать оправданность или восстановленное правое положение. Буквально широкий перевод не навязывает более позднюю догматическую схему.
theological_decisions:
- issue: Референты местоимений в последовательности «благоволит к нему; видит его лицо»
  choice: Бог благоволит к молящемуся человеку, после чего человек видит лицо Бога.
  alternative: Теоретически субъектом видения может быть Бог, а «его лицо» — лицом человека; однако контекст и библейская идиома «видеть лицо Бога» сильнее поддерживают выбранное прочтение.
  rationale: Контекст описывает восстановление общения человека с Богом. Выбранное прочтение наиболее связно передаёт движение мысли, а буквальная местоименная форма отмечена в сноске.
- issue: Смысл выражения «его праведность»
  choice: Бог возвращает человеку принадлежащую ему праведность, то есть его правое положение.
  alternative: Выражение может особо подчёркивать оправдание или восстановленную правоту человека; понимание его как вменения человеку Божьей праведности возможно лишь при добавлении отсутствующей в стихе догматической предпосылки.
  rationale: Местоименный суффикс естественнее всего относится к человеку. «Его праведность» сохраняет смысловую широту и не предрешает точный механизм восстановления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Повтор слова «Бог» выбран ради ясного обозначения смены субъектов; архаические инверсии и конфессионально окрашенная терминология исключены.
