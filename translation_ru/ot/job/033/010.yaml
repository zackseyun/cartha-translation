  text: Вот, Он находит основания для вражды против меня[a], считает меня Своим врагом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находит враждебные действия против меня», «находит поводы выступить против меня»; возможно также: «находит жалобы на меня». Еврейское существительное встречается редко, и его значение зависит от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатическое привлечение внимания естественным и достойным современным русским выражением.
- source_word: תְּנוּאוֹת
  choice: поводы для вражды
  rationale: Редкое существительное обозначает в данном контексте основания или случаи для враждебного отношения; формулировка сохраняет как идею найденных поводов, так и оттенок противостояния.
- source_word: עָלַי
  choice: со мной
  rationale: В сочетании с «враждой» естественное русское управление «вражда со мной» передаёт направленность против говорящего.
- source_word: יִמְצָא
  choice: находит
  rationale: Сохраняет основное значение глагола и не усиливает обвинение до смысла «выдумывает».
- source_word: יַחְשְׁבֵנִי
  choice: считает меня
  rationale: Точно и естественно передаёт оценочное значение חשב — считать или полагать кем-либо.
- source_word: לְאוֹיֵב לוֹ
  choice: Своим врагом
  rationale: Естественно передаёт роль, в которой Бог, по словам Иова, воспринимает его; возвратное «Своим» устраняет неясность принадлежности.
theological_decisions:
- issue: Восприятие Иовом Божьего отношения к нему
  choice: Передать жалобу как «Он находит поводы для вражды со мной», не утверждая от лица переводчика, что Бог измышляет обвинения.
  alternative: «Он выдумывает обвинения против меня»
  rationale: Стих приводит пересказ Елиуем жалобы Иова. Перевод сохраняет напряжённость обвинения, но не усиливает מצא до богословски более резкого и лексически менее прямого «выдумывает».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Местоимения, относящиеся к Богу, даны с прописной буквы по принятой русской библейской издательской традиции.
