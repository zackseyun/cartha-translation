  text: רֽוּחַ אֵ֥ל עָשָׂ֑תְ/נִי וְ/נִשְׁמַ֖ת שַׁדַּ֣י תְּחַיֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/004.yaml
  text: The Spirit of God has made me[a], and the breath of the Almighty gives me life.
translation:
  language: ru
  text: 'Дух Бога создал меня[a],

    и дыхание Всемогущего даёт мне жизнь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыхание Бога создало меня». Еврейское רוּחַ может также означать «дыхание» или «ветер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Дух
  rationale: В сочетании с אֵל и в параллели с «дыханием Всемогущего» слово обозначает исходящую от Бога животворящую силу; «Дух» сохраняет отличие от נִשְׁמַת, тогда как сноска отмечает возможное значение «дыхание».
- source_word: אֵל
  choice: Бога
  rationale: Здесь это обозначение Бога, параллельное титулу שַׁדַּי; обычное русское «Бог» естественно для данного контекста.
- source_word: עָשָׂתְנִי
  choice: создал меня
  rationale: Глагол עשה означает «делать, создавать»; в контексте происхождения и дарования жизни «создал» звучит естественно и не добавляет образа тщательного формирования, подразумеваемого словом «сотворил/изваял».
- source_word: נִשְׁמַת
  choice: дыхание
  rationale: Слово обозначает дыхание как животворное дыхание жизни и поддерживает образный параллелизм стиха.
- source_word: שַׁדַּי
  choice: Всемогущего
  rationale: Традиционный и понятный перевод божественного титула שַׁדַּי; родительный падеж обусловлен конструкцией «дыхание Всемогущего».
- source_word: תְּחַיֵּנִי
  choice: даёт мне жизнь
  rationale: Каузативное значение формы חיה передано ясным современным выражением, охватывающим дарование жизни без сужения смысла до одного лишь её поддержания.
theological_decisions:
- issue: Передавать ли רוּחַ אֵל как личностный «Дух Бога» или как безличное «дыхание Бога»
  choice: Дух Бога
  alternative: дыхание Бога
  rationale: Основной текст сохраняет различие между רוּחַ и параллельным נִשְׁמַת и допускает восприятие божественного действующего начала, но сноска сохраняет подлинную лексическую неоднозначность и не навязывает более определённого богословского вывода.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим параллелизмом. «Дух Бога» выбрано вместо более привычного конфессионально окрашенного «Дух Божий», чтобы прямо передать конструкцию исходного текста и не усиливать её догматическую определённость.
