  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: ru
  text: Он избавил мою душу, не дав ей сойти в яму[a], и жизнь моя увидит свет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкупил мою жизнь, не дав ей сойти в яму». «Яма» — распространённый древнееврейский образ смерти или могилы.'
    reason: Лексическая альтернатива для פָּדָה и נֶפֶשׁ; пояснение образа שַׁחַת без его излишней конкретизации в основном тексте.
lexical_decisions:
- source_word: פָּדָה
  choice: избавил
  rationale: Глагол означает выкуп или избавление от опасности. «Избавил» естественно по-русски передаёт совершённое спасительное действие, не вводя прямо не названной платы.
- source_word: נפשי (נַפְשִׁי)
  choice: мою душу
  rationale: נֶפֶשׁ может обозначать душу, жизнь или самого человека. «Мою душу» сохраняет поэтическое различие с חַיָּתִי во второй части строки.
- source_word: מֵעֲבֹר
  choice: от перехода
  rationale: Предлог с инфинитивом выражает удержание от перехода или вступления; перевод сохраняет образ пересечения границы смерти.
- source_word: בַּשַּׁחַת
  choice: в могильную яму
  rationale: שַׁחַת буквально обозначает яму и часто служит образом смерти или могилы. Прилагательное «могильную» делает подразумеваемый смысл понятным, сохраняя сам образ ямы.
- source_word: וְחַיָּתִי
  choice: и жизнь моя
  rationale: Существительное обозначает жизнь или живое существование; буквальная формулировка сохраняет параллелизм с «мою душу».
- source_word: בָּאוֹר
  choice: свет
  rationale: Свет противопоставлен могильной яме и подразумевает продолжающуюся жизнь; по-русски после «увидит» артиклевое значение не требует указательного уточнения.
- source_word: תִּרְאֶה
  choice: увидит
  rationale: Форма имперфекта здесь естественно передаётся будущим временем; «увидит свет» сохраняет простой и выразительный древнееврейский оборот.
theological_decisions:
- issue: Подлежащее начального глагола совершенного вида
  choice: Он избавил мою душу
  alternative: Бог избавил мою душу; Он выкупил мою жизнь
  rationale: В еврейской строке подлежащее прямо не названо, хотя контекст указывает на Бога. Местоимение «Он» сохраняет эту контекстуальную неявность и не добавляет имени в сам стих.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и поэтического параллелизма. Формулировка «перехода в могильную яму» намеренно удерживает образ движения, хотя несколько менее разговорна, чем «сошествия в могилу».
