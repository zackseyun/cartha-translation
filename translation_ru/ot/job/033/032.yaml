  source_fidelity: 'Текст точно передаёт условное приглашение Елиуя: «если тебе есть что сказать» соответствует אִם יֵשׁ מִלִּין, два повеления сохраняют הֲשִׁיבֵנִי и דַּבֵּר, а причинная связь כִּי и волевое חָפַצְתִּי переданы без добавлений. «Признать тебя правым» адекватно передаёт צַדְּקֶךָ как желание счесть Иова правым/оправдать его в споре.'
