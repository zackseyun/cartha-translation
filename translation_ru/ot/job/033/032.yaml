  text: אִם יֵשׁ מִלִּ֥ין הֲשִׁיבֵ֑/נִי דַּ֝בֵּ֗ר כִּֽי חָפַ֥צְתִּי צַדְּקֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/032.yaml
  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: ru
  text: Если тебе есть что сказать, отвечай мне; говори, потому что я желаю признать тебя правым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оправдать тебя»; или: «подтвердить твою правоту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: Если тебе есть что сказать
  rationale: Буквальное «если есть слова» в современном русском звучит неестественно. Эта идиоматическая передача сохраняет условное приглашение Иова высказаться, не усиливая «слова» до значения «доводы».
- source_word: הֲשִׁיבֵנִי
  choice: отвечай мне
  rationale: Побудительная форма передаёт прямое приглашение дать ответ; несовершенный вид естественно сочетается со следующим «говори».
- source_word: דַּבֵּר
  choice: говори
  rationale: Краткий прямой императив сохраняет настойчивость и параллелизм исходного текста.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание приглашения говорить и ясно передаёт причинную связь.
- source_word: חָפַצְתִּי
  choice: я желаю
  rationale: Передаёт искреннее волеизъявление и сохраняет достоинство речи; «я хочу» было бы несколько разговорнее.
- source_word: צַדְּקֶךָ
  choice: признать тебя правым
  rationale: В контексте Елиуй говорит о готовности согласиться с правотой Иова, если тот сможет ответить. Такая передача естественна по-русски и не вносит без необходимости специального богословского смысла глагола «оправдать».
theological_decisions:
- issue: Значение צַדְּקֶךָ от корня צדק
  choice: признать тебя правым
  alternative: оправдать тебя; подтвердить твою правоту
  rationale: Речь идёт не о техническом учении об оправдании перед Богом, а о заявленном желании Елиуя признать правоту Иова. Основной вариант ясно выражает этот контекстуальный смысл, а сноска сохраняет допустимые лексические оттенки.
translation_notes:
  register: Современный литературный русский язык с прямым, сдержанно возвышенным тоном. Идиома «тебе есть что сказать» предпочтена буквальному, но неестественному «у тебя есть слова».
