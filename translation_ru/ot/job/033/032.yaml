  terminology: «Признать тебя правым» удачно избегает неуместного переноса позднейшего технического богословского значения в реплику Елиуя, сохраняя судебно-оценочный смысл корня צדק. Сноска корректно даёт «оправдать тебя» и «подтвердить твою правоту» как возможные оттенки; маркер привязан к соответствующему выражению.
