  yaml_path: translation/ot/job/033/014.yaml
  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: ru
  text: Ведь Бог говорит однажды и дважды[a], но человек этого не замечает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одним способом и другим». Древнееврейские числительные можно понимать наречно: «однажды… дважды», — либо идиоматически, как указание на один или несколько способов Божьей речи.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующей речью Елиуя и естественно звучит в современном русском.
- source_word: בְאַחַת ... וּבִשְׁתַּיִם
  choice: раз и другой
  rationale: Сохраняет числовой образ и передаёт мысль о повторяющемся Божьем обращении, не сводя выражение к строго двум случаям. Возможное указание на разные способы речи отмечено в сноске.
- source_word: יְדַבֶּר
  choice: говорит
  rationale: Настоящее время естественно передаёт общее, обычное действие, выраженное древнееврейским имперфектом.
- source_word: אֵל
  choice: Бог
  rationale: Прямой и контекстуально достаточный перевод Божьего наименования אֵל без добавления отсутствующих определений.
- source_word: לֹא יְשׁוּרֶנָּה
  choice: человек этого не замечает
  rationale: Глагол שׁור здесь означает увидеть, распознать или заметить. «Не замечает» естественно описывает неспособность распознать Божье обращение; «этого» передаёт женский объектный суффикс, относящийся к речи или обращению Бога.
theological_decisions:
- issue: Не названный прямо субъект заключительной части
  choice: обобщённый субъект «человек»
  alternative: «он этого не замечает»
  rationale: Древнееврейская форма имеет невыраженный субъект мужского рода единственного числа. «Человек» ясно передаёт обобщённый смысл и не создаёт ошибочного впечатления, будто местоимение «он» относится к Богу.
- issue: Повторение или разные способы Божьей речи
  choice: 'в основном тексте — повторение: «раз и другой»'
  alternative: «одним способом и другим»
  rationale: Числительные допускают наречное понимание «раз… дважды» и идиоматическое указание на разные способы. Контекст последующих стихов говорит о неоднократных формах Божьего обращения, поэтому неоднозначность сохранена с помощью сноски.
translation_notes:
  register: Современный литературный русский; краткая поэтическая фраза с ясной логической связью. Выражение «раз и другой» звучит естественно и сохраняет числовой образ оригинала.
