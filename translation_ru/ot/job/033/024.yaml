  text: then he is gracious to him and says[a], ‘Deliver him from going down to the pit[b]; I have found a ransom.’
translation:
  language: ru
  text: 'Тогда он милует его и говорит: «Избавь его, чтобы он не сошёл в яму[a]; я нашёл выкуп[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Яма» может также означать могилу или гибель, а не только буквальную яму.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «искупительную плату», «возмещение». Еврейское כֹּפֶר обозначает выкуп или компенсацию, обеспечивающую освобождение, и в некоторых контекстах имеет оттенок искупления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: Тогда он милует его
  rationale: Глагол חנן выражает милость, благосклонность или благодать. «Милует» естественно по-русски передаёт милостивое расположение, не сводя его лишь к жалости.
- source_word: וַיֹּאמֶר
  choice: и говорит
  rationale: Историческое настоящее естественно вводит прямую речь и сохраняет последовательность действий еврейского повествования.
- source_word: פְּדָעֵהוּ
  choice: Избавь его
  rationale: Императив от פדה может означать избавление или выкуп. «Избавь» передаёт требуемое действие, не дублируя заранее значение כֹפֶר в конце стиха.
- source_word: מֵרֶדֶת
  choice: чтобы он не сошёл
  rationale: Инфинитив с предлогом מן обозначает предотвращение нисхождения. Такая конструкция ясна и естественна в современном русском языке.
- source_word: שָׁחַת
  choice: могильную яму
  rationale: Слово обозначает яму и в данном контексте вызывает ассоциации с могилой, смертью и погибелью. «Могильная яма» сохраняет конкретный образ и его смертельный смысл.
- source_word: מָצָאתִי
  choice: я нашёл
  rationale: Перфект первого лица передаёт совершившееся обретение основания для избавления; русское прошедшее время здесь естественно и допускает наличный результат.
- source_word: כֹפֶר
  choice: выкуп
  rationale: כֹפֶר обозначает выкуп или возмещение, благодаря которому достигается освобождение. «Выкуп» ясно соответствует избавлению от нисхождения в яму и не навязывает более узкого догматического толкования.
theological_decisions:
- issue: Значение כֹפֶר в речи Елиуя
  choice: выкуп
  alternative: искупительная плата; возмещение
  rationale: Контекст говорит об основании для избавления человека от могильной ямы. «Выкуп» сохраняет конкретный смысл цены освобождения, тогда как возможные искупительные оттенки отмечены в сноске без привнесения позднейшей догматической системы.
- issue: Кто является субъектом глаголов «милует» и «говорит»
  choice: сохранено местоимение «он» без уточняющего существительного
  alternative: Бог; ангел-посредник
  rationale: Ближайший контекст допускает синтаксическую связь с посредником из предыдущего стиха, но речь также может пониматься как выражение Божьей милости. Перевод не устраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис краток и близок к еврейскому оригиналу; сохранены образ могильной ямы, термин «выкуп» и неоднозначность субъекта.
