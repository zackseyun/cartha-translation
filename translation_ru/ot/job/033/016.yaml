lexical_decisions:
- source_word: אָז
  choice: тогда
  rationale: Временное наречие продолжает описание того, как Бог говорит с человеком во сне или видении; «тогда» естественно передаёт последовательность.
- source_word: יִגְלֶה אֹזֶן אֲנָשִׁים
  choice: Он открывает людям уши
  rationale: Глагол גלה буквально означает «открывать, обнажать»; в сочетании с «ухом» это идиома, обозначающая способность услышать и воспринять. Русская конструкция сохраняет образ и звучит естественно.
- source_word: אֲנָשִׁים
  choice: людям
  rationale: Здесь слово обозначает людей как представителей человечества. Дательный оборот «людям уши» естественнее буквального «уши людей» и не меняет смысла.
- source_word: וּבְמֹסָרָם
  choice: данное им наставление
  rationale: מוּסָר может означать наставление, вразумление, исправление, предостережение или дисциплину. Добавление «данное им» ясно передаёт значение местоименного суффикса, не утверждая, что наставление исходит от самих людей.
- source_word: יַחְתֹּם
  choice: запечатлевает
  rationale: חתם означает «запечатывать» и здесь сохраняет метафору закрепления или удостоверения сообщённого наставления.
