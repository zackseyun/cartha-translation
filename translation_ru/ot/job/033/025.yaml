lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: станет свежее
  rationale: Редкий глагол передаёт обновление, свежесть и полноту плоти. «Станет свежее» сохраняет конкретный телесный образ и не сводит его к более общему «восстановится».
- source_word: בְּשָׂרוֹ
  choice: его плоть
  rationale: «Плоть» прямо передаёт физический, телесный акцент еврейского слова; «тело» было бы естественно, но менее буквально.
- source_word: מִנֹּעַר
  choice: чем в юности
  rationale: 'Предлог מִן понят как вводящий сравнение: обновлённая плоть станет свежее, чем была в юности. Из-за редкости глагола и сжатости оборота иные способы истолкования отмечены в сноске.'
- source_word: יָשׁוּב
  choice: он вернётся
  rationale: Глагол мужского рода единственного числа естественнее относить к самому человеку, а не только к его плоти; активная формулировка сохраняет строй еврейской строки.
- source_word: לִימֵי
  choice: к дням
  rationale: Сохранён конкретный еврейский оборот «к дням», естественный и понятный в русском контексте.
- source_word: עֲלוּמָיו
  choice: своей юношеской силы
  rationale: Существительное может обозначать как саму молодость, так и свойственные ей жизненную силу и бодрость. Основной текст передаёт второй оттенок, а более буквальный вариант дан в сноске.
