  text: לְ/הָשִׁ֣יב נַ֭פְשׁ/וֹ מִנִּי שָׁ֑חַת לֵ֝/א֗וֹר בְּ/א֣וֹר הַֽ/חַיִּים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/030.yaml
  text: to bring back his soul from the pit[c][b][a], that he may be enlightened with the light of life.
translation:
  language: ru
  text: чтобы вернуть его душу из ямы[a][b] и озарить её светом жизни.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его жизнь»; еврейское слово нефеш может означать душу, жизнь или самого человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из могилы» или «от погибели».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы она увидела свет жизни» или «чтобы вывести её к свету жизни». Еврейское выражение сжато и поэтично.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: вернуть
  rationale: Каузативный инфинитив от שוב передаёт возвращение из угрожающего смертью состояния; «вернуть» сохраняет конкретность образа и естественно звучит по-русски.
- source_word: נַפְשׁוֹ
  choice: его душу
  rationale: נפש может обозначать душу, жизнь или самого человека. «Душу» сохраняет широту и поэтическую глубину выражения, не исключая смысла спасённой жизни.
- source_word: מִנִּי שָׁחַת
  choice: из ямы
  rationale: שחת в поэзии может означать яму, могилу или погибель. «Из ямы» наиболее прямо сохраняет исходный образ и его противопоставление свету жизни.
- source_word: לֵאוֹר
  choice: озарить её
  rationale: Еврейское выражение сжато и допускает разные синтаксические понимания. «Озарить её» передаёт корень אור, связывает действие с «душой» и сохраняет переход от избавления к свету.
- source_word: בְּאוֹר הַחַיִּים
  choice: светом жизни
  rationale: Творительный падеж естественно передаёт инструментально-ассоциативное значение предлога בְּ и сохраняет ёмкий поэтический образ.
theological_decisions:
- issue: Относится ли לֵאוֹר к озарению спасённой души или к её приведению/возвращению к свету
  choice: «и озарить её светом жизни»
  alternative: «чтобы она увидела свет жизни»; «чтобы вывести её к свету жизни»
  rationale: Исходная конструкция эллиптична. Основной текст воспроизводит игру однокоренных слов אור и не добавляет идеи, отсутствующие явно; иные допустимые способы раскрытия эллипсиса отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического противопоставления ямы и света жизни. Местоимение «её» проясняет естественную русскую связь с «душой», не устраняя отмеченной в сноске неоднозначности еврейского синтаксиса.
