id: JOB.33.12
reference: Job 33:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֶן זֹ֣את לֹא צָדַ֣קְתָּ אֶעֱנֶ֑/ךָּ כִּֽי יִרְבֶּ֥ה אֱ֝ל֗וֹהַ מֵ/אֱנֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/012.yaml
  text: Look[a], in this you are not right; I will answer you, for God is greater than man.
translation:
  language: ru
  text: Вот, в этом ты неправ; я отвечу тебе, потому что Бог больше человека[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертного». Еврейское אֱנוֹשׁ нередко подчёркивает человеческую слабость и бренность.'
    reason: Лексическая альтернатива, сохраняющая оттенок исходного слова.
lexical_decisions:
- source_word: הֶן
  choice: Вот
  rationale: Частица привлекает внимание и придаёт последующему возражению выразительность; «вот» естественно и достойно передаёт её в русском библейском повествовании.
- source_word: זֹאת
  choice: в этом
  rationale: Указательное местоимение отсылает к обсуждаемому утверждению или делу; предложная конструкция идиоматична по-русски.
- source_word: לֹא צָדַקְתָּ
  choice: ты неправ
  rationale: В контексте спора צדק означает быть правым, а не общую нравственную праведность.
- source_word: אֶעֱנֶךָּ
  choice: я отвечу тебе
  rationale: Имперфект первого лица с суффиксом второго лица обозначает предстоящий ответ Елиуя.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание возражения и прямо сохраняет причинную связь.
- source_word: יִרְבֶּה
  choice: больше
  rationale: Форма от רבה в сравнительной конструкции с מן выражает превосходство или величие, а не численное множество.
- source_word: אֱלוֹהַ
  choice: Бог
  rationale: Единственное число божественного наименования прямо относится к Богу.
- source_word: מֵאֱנוֹשׁ
  choice: человека
  rationale: Существительное употреблено обобщённо и противопоставляет Бога слабому, смертному человеку; в основном тексте естественно звучит «человека».
theological_decisions:
- issue: Смысл לֹא צָדַקְתָּ
  choice: ты неправ
  alternative: ты неправеден
  rationale: Здесь Елиуй оценивает правоту слов Иова в споре, а не выносит всеобъемлющий приговор его нравственности.
- issue: Передача אֱנוֹשׁ
  choice: человека
  alternative: смертного
  rationale: «Человека» сохраняет обобщённое единственное число и ясное противопоставление Богу, а оттенок бренности отмечен в сноске.
- issue: Характер превосходства Бога
  choice: Бог больше человека
  alternative: Бог могущественнее человека
  rationale: Общее сравнительное значение רבה не следует сужать только до могущества; «больше» сохраняет широту и богословскую напряжённость утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Краткость и прямота возражения сохранены; причинный союз передан явно.
