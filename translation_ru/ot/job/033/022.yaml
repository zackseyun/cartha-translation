  text: וַ/תִּקְרַ֣ב לַ/שַּׁ֣חַת נַפְשׁ֑/וֹ וְ֝/חַיָּת֗/וֹ לַֽ/מְמִתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: ru
  text: 'И душа его приближается к яме[a],

    и жизнь его — к несущим смерть[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к могиле»; или: «к гибели».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к мёртвым»; возможно также: «к губителям». Еврейское выражение трудно для толкования и может указывать на причиняющих смерть либо на область или силы смерти.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: приближается
  rationale: Глагол קרב означает «приближаться, подходить». Настоящее время естественно передаёт поэтическое описание того, что происходит со страдающим человеком в контексте речи Елиуя.
- source_word: לַשַּׁחַת
  choice: к яме
  rationale: שַׁחַת может означать яму, могилу или гибель. «Яма» сохраняет конкретный поэтический образ, не устраняя его связи со смертью.
- source_word: נַפְשׁוֹ
  choice: душа его
  rationale: נֶפֶשׁ может обозначать душу, жизнь, самого человека. «Душа его» сохраняет лексическое отличие от «жизнь его» во второй строке, не превращая его в строгое антропологическое определение.
- source_word: וְחַיָּתוֹ
  choice: и жизнь его
  rationale: Здесь слово обозначает жизнь или живое существование; «жизнь его» естественно сочетается с контекстом приближения смерти и образует параллель с «душа его».
- source_word: לַמְמִתִים
  choice: к несущим смерть
  rationale: 'Трудную форму можно понимать в активном или каузативном смысле: «те, кто причиняет смерть». Выражение «несущие смерть» сохраняет эту силу и не уточняет без достаточных оснований, идёт ли речь о людях или о силах смерти.'
theological_decisions:
- issue: Антропологический смысл параллели נַפְשׁוֹ и וְחַיָּתוֹ
  choice: Передать как «душа его» и «жизнь его», не подразумевая строгого разделения человека на тело и нематериальную душу.
  alternative: Сгладить различие как «жизнь его» и «существо его» либо истолковать «душу» как специальное обозначение нематериальной части человека.
  rationale: Это поэтический параллелизм близких по смыслу слов. Перевод сохраняет их различие, но не вносит в стих доктринального определения человеческой природы.
- issue: Референт לַמְמִתִים
  choice: Сохранить активный образ «несущих смерть».
  alternative: Понять выражение как «мёртвые» либо как область или силы смерти.
  rationale: Еврейская форма и контекст допускают разные толкования; основной текст передаёт вероятный каузативно-активный смысл, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Инверсия «душа его / жизнь его» придаёт строкам достоинство и сохраняет ритмическое соответствие; тире во второй строке естественно обозначает пропуск повторяющегося сказуемого.
