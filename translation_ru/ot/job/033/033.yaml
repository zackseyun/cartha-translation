lexical_decisions:
- source_word: אִם אַיִן
  choice: Если же нет
  rationale: Сочетание вводит противоположное условие относительно предыдущего приглашения Иова ответить. «Если же нет» кратко, естественно и сохраняет условную связь.
- source_word: שְׁמַע לִי
  choice: слушай меня
  rationale: Глагол שׁמע с ל обозначает внимательное слушание говорящего; «слушай меня» естественно передаёт повеление в современном русском языке.
- source_word: הַחֲרֵשׁ
  choice: молчи
  rationale: Повелительная форма от חרש требует сохранять молчание. «Молчи» прямо, ёмко и стилистически уместно в речи Елиуя.
- source_word: וַאֲאַלֶּפְךָ
  choice: и я научу тебя
  rationale: Пиэль глагола אלף означает «учить, наставлять»; форма с союзом после повелений естественно передаётся простым будущим временем.
- source_word: חָכְמָה
  choice: мудрости
  rationale: חָכְמָה — обычное древнееврейское обозначение мудрости; прямой эквивалент сохраняет ключевую лексику литературы мудрости.
