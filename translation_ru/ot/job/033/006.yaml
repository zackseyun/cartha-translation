  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: ru
  text: Вот, я — словно твои уста перед Богом[a]; я тоже вылеплен из глины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я — как твои уста к Богу». Возможные значения: «я говорю за тебя перед Богом», «я перед Богом согласно твоему желанию» или, возможно, «я перед Богом такой же, как ты».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «отщипнут из глины», «сформирован из глины». Древнееврейский глагол вызывает образ существа, отделённого щипком из глины или получившего форму из неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание и придаёт высказыванию выразительность; «вот» естественно для современного литературного русского и не звучит архаично.
- source_word: כְפִיךָ לָאֵל
  choice: словно твои уста перед Богом
  rationale: Сохранён конкретный образ древнееврейского выражения, буквально означающего «как твои уста к Богу/перед Богом». Такая передача допускает смысл представителя, говорящего за Иова, но не превращает спорную интерпретацию в однозначное утверждение.
- source_word: מֵחֹמֶר
  choice: из глины
  rationale: חֹמֶר обозначает глину или глинистый материал; здесь слово подчёркивает общее человеческое происхождение говорящего и Иова.
- source_word: קֹרַצְתִּי
  choice: вылеплен
  rationale: Глагол передаёт образ отделения щипком или придания формы глине. «Вылеплен» сохраняет ремесленно-телесную образность и звучит по-русски естественнее, чем буквальное «отщипнут».
- source_word: גַם אֲנִי
  choice: и я тоже
  rationale: 'Передаёт усиленное присоединение: Елиуй подчёркивает, что он, подобно Иову, является человеком, созданным из того же материала.'
theological_decisions:
- issue: Отношение Елиуя к Иову перед Богом
  choice: Образ «твои уста перед Богом» сохранён в основном тексте без полного истолкования; он может представлять Елиуя как говорящего от лица Иова.
  alternative: «Я перед Богом такой же, как ты» или «я перед Богом согласно твоему желанию».
  rationale: Сжатое древнееврейское выражение допускает несколько толкований. Следующая часть стиха ясно подчёркивает общую человеческую природу, но сама по себе не позволяет бесспорно свести первую часть лишь к равенству или придать Елиую более сильный посреднический статус.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Необычный образ «твои уста» намеренно сохранён, а его неоднозначность пояснена в сноске; «вылеплен» обеспечивает естественность, не устраняя образ гончарной работы.
