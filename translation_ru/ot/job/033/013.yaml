  text: מַ֭דּוּעַ אֵלָ֣י/ו רִיב֑וֹתָ כִּ֥י כָל דְּ֝בָרָ֗י/ו לֹ֣א יַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: ru
  text: Зачем ты споришь с Ним? Ведь Он не даёт ответа о всех Своих делах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отвечает на все Свои слова». «Слова» может обозначать также дела или действия. Отрицание перед «все» допускает также понимание: «не даёт ответа ни об одном из Своих дел».'
    reason: Сохраняет буквальный образ דְּבָרָיו, контекстуальное значение «дела» и неоднозначную сферу действия отрицания.
lexical_decisions:
- source_word: רִיבוֹתָ
  choice: споришь
  rationale: Форма от ריב обозначает спор, пререкание или тяжбу; «споришь» естественно передаёт обращённый к Богу вызов без излишне судебной конкретизации.
- source_word: כִּי
  choice: из-за того, что
  rationale: В данном вопросе союз естественно понимается как указание на основание недовольства Иова; такая передача сохраняет причинную связь.
- source_word: דְּבָרָיו
  choice: Свои дела
  rationale: דבר может означать как слово, так и дело/поступок. По контексту речь о Божьих действиях, объяснения которых требует человек; буквальное «слова» здесь менее естественно и может создать ложное впечатление, будто Бог не отвечает на собственные высказывания.
- source_word: יַעֲנֶה
  choice: отвечает за
  rationale: В сочетании с עַל передаёт ответ или объяснение относительно чего-либо; русское «отвечает за» сохраняет сжатость и допускает оттенок отчёта, не утверждая, что Бог обязан оправдываться.
theological_decisions:
- issue: Обязан ли Бог давать человеку отчёт о Своих действиях
  choice: «Он не отвечает за все Свои дела»
  alternative: «Он ни за одно из Своих дел не даёт ответа»
  rationale: Масоретская конструкция допускает различное соотнесение отрицания и כָּל. Основной текст сохраняет традиционное понимание «не отвечает за все», а сноска отмечает возможное чтение «не отвечает ни за одно».
translation_notes:
  register: Современный литературный русский, прямой и достоинственный. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции. Вопросительная форма и напряжённость упрёка сохранены.
