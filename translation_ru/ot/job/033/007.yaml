  text: Вот, страх, который я внушаю, не устрашит тебя, и моя рука не будет тяжела на тебе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и я не буду тяжело давить на тебя». Еврейское слово אַכְפִּי имеет неясное значение; традиционный перевод сохраняет образ руки, возложенной на человека, тогда как альтернативный перевод передаёт вероятный смысл давления или тяжести.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание и подчёркивает последующее заверение; «вот» естественно и близко передаёт её функцию.
- source_word: אֵמָתִי
  choice: страх передо мной
  rationale: 'Существительное обозначает ужас или страх, связанный с говорящим. Контекст поддерживает объективный смысл: Иову не нужно страшиться Елиуя.'
- source_word: תְבַעֲתֶךָ
  choice: не ужаснёт тебя
  rationale: Интенсивная форма глагола בעת выражает сильный испуг; «ужаснёт» сохраняет эту силу и сочетается со словом «страх».
- source_word: אַכְפִּי
  choice: давить
  rationale: Редкое и трудное существительное в сочетании с «быть тяжёлым» указывает на давление или тяготу. В русском глагольная конструкция естественнее буквального «моё давление не будет тяжёлым»; традиционный образ руки сохранён в примечании.
- source_word: עָלֶיךָ
  choice: на тебя
  rationale: Предлог על с суффиксом второго лица передаёт направленность давления на Иова.
- source_word: יִכְבָּד
  choice: не стану тяжело
  rationale: Глагол כבד буквально означает «быть тяжёлым». Наречие «тяжело» сохраняет образ веса в естественной русской конструкции.
