  text: Если можешь, ответь мне; изложи передо мной свои доводы[a] и встань.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расположи передо мной свои слова по порядку». Еврейский глагол означает «располагать, приводить в порядок» и может относиться либо к доводам Иова, либо шире — к подготовленному им ответу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Союз вводит прямое условие без необходимости усиливать его словами «если действительно».
- source_word: תּוּכַל
  choice: можешь
  rationale: Форма глагола יכל выражает способность; краткое «можешь» естественно звучит в прямом вызове.
- source_word: הֲשִׁיבֵנִי
  choice: ответь мне
  rationale: В данном контексте диспута каузативная форма שוב идиоматически означает ответ или возражение.
- source_word: עֶרְכָה
  choice: изложи … свои доводы
  rationale: Глагол ערך означает «располагать, приводить в порядок». Не выраженный объект естественно восстанавливается из контекста спора как доводы Иова; примечание сохраняет более буквальную альтернативу.
- source_word: לְפָנַי
  choice: передо мной
  rationale: Передаёт пространственно-реляционное значение выражения и сохраняет состязательный характер речи.
- source_word: הִתְיַצָּבָה
  choice: займи своё место
  rationale: Возвратная форма יצב призывает встать или расположиться для противостояния. Выбранный оборот передаёт готовность выступить, не добавляя идеи стойкости, которой нет в тексте.
