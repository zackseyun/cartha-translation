  text: «Я чист, без преступления; я невиновен[a], и нет во мне беззакония[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я чист»; еврейское слово חַף может обозначать как чистоту, так и отсутствие вины.'
