lexical_decisions:
- source_word: זַךְ
  choice: чист
  rationale: Прилагательное обозначает чистоту, в данном контексте прежде всего нравственную. «Чист» естественно передаёт образ и не вводит более узкое судебное толкование.
- source_word: בְּלִי פָשַׁע
  choice: без преступления
  rationale: בְּלִי выражает отсутствие, а פֶּשַׁע обозначает преступление, проступок или мятеж. Выражение «без преступления» сохраняет нравственно-правовой смысл, не сужая его до конкретного вида неповиновения.
- source_word: חַף
  choice: невиновен
  rationale: Слово может обозначать чистого, непричастного или свободного от вины. «Невиновен» ясно передаёт здесь утверждение об отсутствии вины и позволяет избежать стилистического повтора слова «чист».
- source_word: עָוֺן
  choice: беззаконие
  rationale: Слово может обозначать беззаконие, вину либо виновность. «Беззаконие» сохраняет нравственную тяжесть выражения и оставляет возможный оттенок вины для примечания.
- source_word: לִי
  choice: во мне
  rationale: Буквально «у меня/мне». В сочетании с отрицанием существования русское «нет во мне» естественно выражает приписываемое человеку нравственное состояние.
theological_decisions:
- issue: Степень притязания Иова в пересказе Елиуя
  choice: Передать высказывание прямо как решительное утверждение о чистоте и невиновности.
  alternative: Ослабить его словами «я считаю себя чистым» либо усилить до отвлечённого утверждения об абсолютной безгрешности.
  rationale: В еврейском тексте стоят прямые именные утверждения с повторённым местоимением первого лица. Перевод сохраняет напряжение, не вынося богословского суждения об истинности слов Иова.
- issue: Соотношение проступка и вины в עָוֺן
  choice: В основном тексте передать עָוֺן как «беззаконие», а значение «вина» отметить как возможное.
  alternative: Однозначно перевести «вина», превратив последнюю строку прежде всего в судебное заявление.
  rationale: Семантический диапазон עָוֺן включает как неправедное деяние, так и связанную с ним вину; контекст не требует устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом исходного стиха. Сохранена прямая речь и усиление через два параллельных утверждения; архаизмы и конфессионально окрашенные добавления исключены.
