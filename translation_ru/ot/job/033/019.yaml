lexical_decisions:
- source_word: וְהוּכַח
  choice: Его также вразумляют
  rationale: Хофал глагола יכח выражает исправление или обличение. «Вразумляют» сохраняет исправительный смысл, не представляя страдание исключительно как наказание; «также» передаёт связь с предыдущим контекстом.
- source_word: בְּמַכְאוֹב
  choice: болью
  rationale: מַכְאוֹב означает боль или страдание; творительный падеж естественно передаёт инструментальное значение предлога בְּ.
- source_word: עַל מִשְׁכָּבוֹ
  choice: на постели
  rationale: Прямо передаёт место и состояние лежащего из-за болезни человека; «постель» соответствует достоинству библейского повествования и остаётся понятным современному читателю.
- source_word: וְרִיב
  choice: и … борьбой
  rationale: רִיב обычно обозначает спор, распрю или борьбу; применительно к костям это образ внутреннего телесного мучения. Буквенный образ сохранён.
- source_word: עֲצָמָיו
  choice: в костях
  rationale: Сохранено конкретное значение «его кости», выражающее глубокое телесное страдание; принадлежность естественно ясна из русского контекста.
- source_word: אֵתָן
  choice: непрестанной
  rationale: Прилагательное может означать длительное, постоянное либо сильное. В данном контексте выбрано временное значение — неослабевающая продолжительность борьбы; возможное значение силы отмечено в сноске.
theological_decisions:
- issue: Страдание как действие, посредством которого человек получает исправление
  choice: Страдание представлено как средство вразумления, без утверждения, что оно является исключительно карательным воздаянием.
  alternative: Передать страдание как наказание либо как болезнь без какой-либо связи с Божьим обращением к человеку.
  rationale: В речи Елиуя страдание служит одним из способов, которыми Бог обращается к человеку. «Вразумляют» сохраняет исправительную направленность формы וְהוּכַח, но не разрешает богословское напряжение в пользу строгого воздаяния.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Образ «борьбы в костях» сохранён ради близости к еврейскому тексту; пассивное значение передано неопределённо-личной конструкцией, чтобы не добавлять прямо названного деятеля.
