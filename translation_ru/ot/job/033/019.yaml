  text: Его также вразумляют болью на его постели и непрестанной борьбой в его костях[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильной борьбой в его костях». Еврейское прилагательное может означать как «непрестанный, длительный», так и «сильный, могучий».'
