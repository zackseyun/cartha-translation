  text: to turn a man from his deed[a], and to cover pride from a strong man,
translation:
  language: ru
  text: 'чтобы отвратить человека от его дела[a]

    и удержать его от гордости.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «чтобы удалить дело человека и скрыть гордость от человека». Еврейская фраза сжата и допускает понимание как отвращение человека от его поступка, так и удаление самого дела.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְהָסִיר
  choice: отвести … от
  rationale: Каузативная форма глагола סור здесь естественно передаётся как побуждение человека оставить определённый путь или поступок.
- source_word: אָדָם
  choice: человека
  rationale: В данном контексте обозначает отдельного человека; русское «человек» сохраняет обобщённость без ненужной архаизации.
- source_word: מַעֲשֶׂה
  choice: его поступка
  rationale: Слово может означать дело, действие или поступок. В контексте Божьего предостережения «поступок» естественно передаёт нравственный оттенок, а принадлежность поступка человеку подразумевается синтаксисом.
- source_word: גֵוָה
  choice: гордость
  rationale: Существительное обозначает превозношение или высокомерие; «гордость» кратко и точно сохраняет отрицательный нравственный смысл.
- source_word: מִגֶּבֶר
  choice: от человека
  rationale: Хотя גֶּבֶר может подчёркивать мужскую силу или зрелость, здесь оно употреблено как параллель к אָדָם. Перевод «от сильного мужа» был бы в современном русском неестественным и придавал бы силе неоправданный акцент.
- source_word: יְכַסֶּה
  choice: скрыть
  rationale: Буквально глагол означает «покрывать, скрывать». В параллели с инфинитивом он выражает цель; «скрыть» сохраняет образ, не превращая его без пояснения в более толковательное «удержать».
theological_decisions:
- issue: Смысл сжатой целевой конструкции о человеческом поступке и гордости
  choice: Бог отводит человека от его поступка и скрывает от него гордость, то есть препятствует гордому намерению или его проявлению.
  alternative: Бог удаляет у человека его дело и скрывает гордость от человека.
  rationale: Еврейский синтаксис допускает буквальное понимание удаления самого дела, однако ближайший контекст говорит о Божьем предостережении, которое удерживает человека от пагубного пути. Основной текст передаёт этот контекстуальный смысл, а примечание сохраняет буквальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Синтаксический параллелизм сохранён, но искусственное различение אָדָם и גֶּבֶר посредством выражения «сильный муж» не вводится.
