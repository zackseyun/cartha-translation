lexical_decisions:
- source_word: יֹשֶׁר לִבִּי
  choice: прямота моего сердца
  rationale: Сохраняет образ внутренней нравственной прямоты и близко передаёт еврейскую именную конструкцию; слово «сердце» удерживает библейское обозначение внутреннего человека.
- source_word: אֲמָרָי
  choice: слова мои
  rationale: Прямой и естественный эквивалент множественного существительного, обозначающего высказывания Елиуя.
- source_word: וְדַעַת
  choice: знание
  rationale: Передаёт содержание речи без замены более толковательным «пониманием».
- source_word: שְׂפָתַי
  choice: уста мои
  rationale: Сохраняет поэтическую метонимию и параллелизм с «сердцем»; «уста» в русском литературном библейском регистре звучит естественнее, чем буквальное «губы».
- source_word: בָּרוּר
  choice: ясно
  rationale: В данном контексте естественно выражает ясность или недвусмысленность речи, при этом возможный оттенок чистоты отмечен в сноске.
- source_word: מִלֵּלוּ
  choice: изрекают
  rationale: Передаёт поэтическое «говорят, произносят» при подлежащем «уста» и сохраняет возвышенный, но понятный регистр.
