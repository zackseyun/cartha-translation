  yaml_path: translation/ot/job/019/028.yaml
  text: If you say[a], ‘How shall we pursue him, since the root of the matter is found in me?’
translation:
  language: ru
  text: 'Если вы скажете[a]: «Как нам преследовать его, ведь корень дела найден во мне?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст труден. Последнюю часть стиха можно также понять примерно так: «корень дела найден в нём» — в зависимости от того, как оцениваются согласный текст и древние переводы. Глагол «преследовать» может также иметь более сильный смысл: «жестоко преследовать».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном контексте вводит условное высказывание противников Иова; условное «если» естественно сочетается с תֹאמְרוּ.
- source_word: תֹאמְרוּ
  choice: вы скажете
  rationale: Qal imperfect, 2-е лицо множественного числа; в условной конструкции уместна форма будущего времени.
- source_word: מַה נִּרְדָּף
  choice: Как нам преследовать
  rationale: מַה при глаголе имеет наречное значение «как?», а רדף сохраняет образ погони и допускает более сильный оттенок гонения.
- source_word: לוֹ
  choice: его
  rationale: Предлог ל при רדף обозначает объект преследования; по-русски это естественно передаётся прямым дополнением.
- source_word: וְשֹׁרֶשׁ דָּבָר
  choice: если корень дела
  rationale: Метафора «корень дела» передаёт основание или суть рассматриваемого вопроса; союз по смыслу связывает эту фразу с основанием для преследования, хотя синтаксис труден.
- source_word: נִמְצָא
  choice: найден
  rationale: Niphal передаёт пассивно-результативное значение; краткое причастие сохраняет буквальную метафору.
- source_word: בִי
  choice: во мне
  rationale: Так огласован масоретский текст; трудность и возможное альтернативное понимание отмечены в сноске.
theological_decisions:
- issue: К кому отнесён «корень дела»
  choice: «во мне» согласно масоретской огласовке בִי
  alternative: «в нём» — по иному взвешиванию согласного текста и древних переводов
  rationale: Основной текст следует WLC, но не устраняет подлинную текстовую и толковательную неопределённость.
translation_notes:
  register: Современный литературный русский язык; сохранены образ «корня дела», обращение во множественном числе и намеренная неоднозначность трудного еврейского текста.
