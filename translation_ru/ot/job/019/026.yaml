lexical_decisions:
- source_word: וְאַחַר
  choice: И после того, как
  rationale: Сохраняет соединительную связь с предыдущей строкой и временное значение предлога; оборот естественен для современного русского языка.
- source_word: עוֹרִי
  choice: кожу мою
  rationale: עוֹר обычно означает «кожа»; это прямой и естественный перевод применительно к человеку, сохраняющий телесный образ страданий Иова.
- source_word: נִקְּפוּ זֹאת
  choice: уничтожат
  rationale: Сочетание лексически и синтаксически трудно. Неопределённо-личная форма передаёт третье лицо множественного числа נִקְּפוּ, а «уничтожат» ясно выражает разрушение кожи, не навязывая чрезмерно буквального и неясного прочтения указательного местоимения זֹאת.
- source_word: וּמִבְּשָׂרִי
  choice: всё же из плоти моей
  rationale: Предлог מִן прежде всего означает «из, от». «Из плоти моей» сохраняет конкретный образ и неоднозначность еврейской фразы, а «всё же» передаёт её контекстуальный противительный оттенок.
- source_word: אֶחֱזֶה
  choice: я увижу
  rationale: חזה означает «видеть, созерцать». «Увижу» ясно и естественно передаёт форму первого лица и контекстуальную направленность в будущее.
- source_word: אֱלוֹהַּ
  choice: Бога
  rationale: אֱלוֹהַּ — употребительное в книге Иова единственное наименование Бога; винительный падеж требуется русским глаголом «увижу».
theological_decisions:
- issue: Утверждает ли וּמִבְּשָׂרִי недвусмысленно телесное воскресение
  choice: Сохранить в основном тексте формально близкое «из плоти моей».
  alternative: «во плоти моей» либо «без плоти моей»
  rationale: Предлог и синтаксис спорны. Вариант «во плоти» прямо усилил бы понимание телесного воскресения, а «без плоти» — бестелесного видения. Основной текст не разрешает напряжение, которого не разрешает сам еврейский текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «кожу мою» и «из плоти моей» сохраняет достоинство речи и параллелизм, оставаясь понятной. Необычность выражения «из плоти моей» намеренно сохранена из-за подлинной неоднозначности источника.
