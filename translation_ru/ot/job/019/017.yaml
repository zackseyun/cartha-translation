source:
  edition: WLC
  text: ר֭וּחִֽ/י זָ֣רָה לְ/אִשְׁתִּ֑/י וְ֝/חַנֹּתִ֗י לִ/בְנֵ֥י בִטְנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/017.yaml
  text: My breath is repulsive to my wife[b][a], and I am loathsome to the sons of my own body.
translation:
  language: ru
  text: 'Моё дыхание отвратительно моей жене,

    и я противен[a] сынам моей утробы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при другом понимании трудного еврейского выражения: «и моя мольба — к сынам моей утробы» или «я молю сынов моей утробы о милости».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сынам моей утробы». Это выражение может обозначать собственных детей Иова или, шире, его близких кровных родственников.'
    reason: cultural_note
lexical_decisions:
- source_word: רוּחִי
  choice: моё дыхание
  rationale: רוּחַ может означать «дыхание», «ветер» или «дух». В данном телесном и семейном контексте конкретное значение «дыхание» наиболее уместно.
- source_word: זָרָה
  choice: отвратительно
  rationale: Форма передаёт значение чуждости, отчуждения или отвращения. По контексту речь идёт не просто о необычности дыхания Иова, а о том, что оно отталкивает жену.
- source_word: לְאִשְׁתִּי
  choice: моей жене
  rationale: Предлог לְ обозначает лицо, для которого дыхание стало отвратительным; дательный падеж естественно передаёт это отношение по-русски.
- source_word: וְחַנֹּתִי
  choice: и я противен
  rationale: Трудная форма истолкована в соответствии с параллелизмом первой строки как указание на отвращение окружающих к Иову. Другое возможное понимание, связанное с мольбой о милости, сохранено в примечании.
- source_word: לִבְנֵי
  choice: сынам
  rationale: בְּנֵי буквально означает «сыны». Такой перевод сохраняет образ исходного текста, а возможный более широкий круг кровных родственников поясняется в примечании.
- source_word: בִטְנִי
  choice: моей утробы
  rationale: בֶּטֶן буквально означает «живот, утроба». Формулировка сохраняет телесный образ кровного родства и намеренную необычность еврейского выражения.
theological_decisions:
- issue: Кого обозначают «сыны моей утробы»
  choice: Сохранить буквальный родственный образ без однозначного отождествления
  alternative: Перевести как «мои близкие родственники» или «мои родные дети»
  rationale: Еврейское выражение допускает понимание как собственных потомков Иова, так и его ближайших кровных родственников; контекст не позволяет бесспорно устранить эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и телесного образа оригинала. Слово «утроба» несколько возвышенно, но понятно и оправдано буквальным образом еврейского текста.
