  yaml_path: translation/ot/job/019/022.yaml
  text: Why do you pursue me like God[b][a], and are not satisfied with my flesh?
translation:
  language: ru
  text: Почему вы преследуете меня, как Бог[a], и всё не насыщаетесь моей плотью[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как бог». Еврейское אֵל может также означать «бог» или, что здесь менее вероятно, «могущественное существо».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «от моей плоти». По-видимому, имеется в виду, что они всё не могут насытиться плотью Иова, словно пожирая его или терзая; это яркий образ неотступной враждебности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Вопросительное наречие вводит протест Иова и прямо передаётся современным русским «почему».
- source_word: תִּרְדְּפֻנִי
  choice: вы преследуете меня
  rationale: Глагол רדף означает «гнаться, преследовать». «Преследуете» сохраняет как образ погони, так и смысл враждебного отношения друзей к Иову.
- source_word: כְמוֹ
  choice: словно
  rationale: Сравнительная частица передана естественным русским словом «словно», без изменения силы сравнения.
- source_word: אֵל
  choice: Бог
  rationale: 'В контексте наиболее вероятен Бог как определённый референт: Иов сопоставляет неотступность друзей с постигшим его Божьим воздействием. Лексическая неоднозначность отмечена в сноске.'
- source_word: וּמִבְּשָׂרִי
  choice: моей плотью
  rationale: Предлог מִן при שבע указывает на то, чем насыщаются. «Плотью» сохраняет конкретный и резкий телесный образ еврейского בשר.
- source_word: לֹא תִשְׂבָּעוּ
  choice: не насыщаетесь
  rationale: Форма от שבע означает «насыщаться, быть сытым». Выбор сохраняет образ ненасытной враждебности и риторический характер вопроса.
theological_decisions:
- issue: Референт אֵל в сравнении כְמוֹ אֵל
  choice: Бог
  alternative: бог; могучий
  rationale: Наиболее вероятно, что Иов обвиняет друзей в преследовании, подобном Божьему воздействию или суду. При этом еврейское слово допускает более общее значение, поэтому неоднозначность не устранена, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис близок к еврейскому риторическому вопросу; телесный образ «плоти» сохранён без смягчения.
