  text: וְ/אַף אָמְנָ֥ם שָׁגִ֑יתִי אִ֝תִּ֗/י תָּלִ֥ין מְשׁוּגָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/004.yaml
  text: And even if I truly have gone astray[a], my error remains with me.
translation:
  language: ru
  text: И даже если я действительно ошибся, моя ошибка остаётся при мне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «моя ошибка ночует со мной».'
    reason: Сохраняет образ глагола לין («ночевать, оставаться на ночлег»), переданного в основном тексте идиоматическим словом «остаётся».
lexical_decisions:
- source_word: וְאַף
  choice: Но даже если
  rationale: В контексте вводит уступку и одновременно противопоставляет этот ответ обвинениям друзей; современное русское «но даже если» естественно передаёт обе функции.
- source_word: אָמְנָם
  choice: и вправду
  rationale: Усиливает уступительное высказывание, не превращая его в признание установленной вины.
- source_word: שָׁגִיתִי
  choice: я заблуждался
  rationale: Глагол означает ошибаться, сбиваться с пути. «Заблуждался» сохраняет смысл ошибки и не уточняет её как грех.
- source_word: אִתִּי
  choice: при мне
  rationale: 'Передаёт буквальное «со мной» в сочетании с глаголом пребывания и допускает контекстуальный смысл: ошибка касается самого Иова.'
- source_word: תָּלִין
  choice: остаётся
  rationale: Буквально глагол обозначает ночлег или пребывание на ночь; здесь идиоматически выражает продолжительное пребывание.
- source_word: מְשׁוּגָתִי
  choice: моё заблуждение
  rationale: Существительное обозначает ошибку или уклонение; повтор того же русского корня, что и в «заблуждался», отражает однокоренную связь שָׁגִיתִי и מְשׁוּגָתִי.
theological_decisions:
- issue: Характер предполагаемой ошибки Иова
  choice: «заблуждался / заблуждение» без уточнения моральной вины
  alternative: «согрешил / грех»
  rationale: Еврейские слова допускают значение ошибки или уклонения, а контекст не требует сужать их до признания греха; условно-уступительная форма также сохраняет напряжение в речи Иова.
translation_notes:
  register: Современный литературный русский язык; речь краткая и достойная. Частица «и» в обороте «даже если я и вправду» подчёркивает уступительный характер фразы. Местоимение «моё» написано с «ё» для ясного чтения.
