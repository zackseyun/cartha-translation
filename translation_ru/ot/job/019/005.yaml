lexical_decisions:
- source_word: אִם אָמְנָם
  choice: если вы и вправду
  rationale: Сохраняет условную конструкцию אִם и усилительное значение אָמְנָם; оборот естественен для современного русского языка.
- source_word: עָלַי תַּגְדִּילוּ
  choice: превозноситесь надо мной
  rationale: Передаёт каузативное значение גדל — выставлять себя великим, возвышаться за счёт другого — и направленность действия против Иова.
- source_word: וְתוֹכִיחוּ עָלַי
  choice: обращаете … в довод против меня
  rationale: Передаёт судебно-доказательный оттенок יכח и избегает неестественного буквального выражения «доказываете против меня».
- source_word: חֶרְפָּתִי
  choice: мой позор
  rationale: Сохраняет значение бесчестья, поношения и общественного унижения, не уточняя сверх текста, идёт ли речь о вине Иова или о пережитом им унижении.
theological_decisions:
- issue: Считают ли друзья позор Иова доказательством его вины
  choice: Формулировка «обращаете мой позор в довод против меня» сохраняет обвинительный характер их рассуждений, не утверждая, что позор действительно доказывает вину.
  alternative: «Доказываете мою вину моим позором».
  rationale: В еврейском тексте стоит חֶרְפָּתִי («мой позор/поношение»), а не прямое слово «вина»; добавление вины сняло бы важное напряжение речи Иова.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «И вправду» передаёт эмфазу без архаизма; «обращаете … в довод» естественно выражает судебный оттенок исходного глагола. Запятая в конце отражает незавершённое условное предложение, продолжающееся в следующем стихе.
