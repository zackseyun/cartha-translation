  yaml_path: translation/ot/job/019/005.yaml
  text: If indeed you magnify yourselves against me and prove my disgrace against me[b][a],
translation:
  language: ru
  text: Если вы и вправду превозноситесь надо мной[a] и обращаете мой позор в довод против меня[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвышаете себя за мой счёт». Еврейский глагол может обозначать самовозвышение над другим человеком.'
