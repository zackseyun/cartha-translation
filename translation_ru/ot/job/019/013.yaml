  text: אַ֭חַ/י מֵ/עָלַ֣/י הִרְחִ֑יק וְ֝/יֹדְעַ֗/י אַךְ זָ֥רוּ מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/013.yaml
  text: He has driven my brothers far from me[b][a], and those who know me are wholly estranged from me.
translation:
  language: ru
  text: Он удалил от меня моих братьев[a], и те, кто знает меня, стали мне совершенно чужими[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдалил от меня моих братьев».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знающие меня стали мне чужими».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: моих братьев
  rationale: Буквально «мои братья»; сохраняет форму и социальную силу еврейского выражения, хотя в контексте оно может охватывать и близкую родню.
- source_word: מֵעָלַי
  choice: от меня
  rationale: В сочетании с הִרְחִיק выражает удаление из присутствия и близкого круга Иова; по-русски естественно передаётся как «удалил от меня».
- source_word: הִרְחִיק
  choice: удалил
  rationale: Каузативная форма означает «сделал далёкими, отдалил, удалил». «Удалил» сохраняет причинное действие без добавления отсутствующего в тексте оттенка насильственного изгнания.
- source_word: וְיֹדְעַי
  choice: те, кто знает меня
  rationale: Буквально «знающие меня»; эта формулировка прозрачна и сохраняет живой личный смысл лучше, чем более узкое «знакомые».
- source_word: אַךְ
  choice: совсем
  rationale: Здесь частица усиливает полноту отчуждения; «совсем» естественно передаёт этот акцент в современном русском языке.
- source_word: זָרוּ
  choice: стали мне чужими
  rationale: Глагол обозначает становление чужими или отчуждение. Русская конструкция сохраняет результирующий смысл и образ превращения близких в чужих.
- source_word: מִמֶּנִּי
  choice: мне
  rationale: 'Хотя מן буквально отмечает отделение «от меня», при русском «стали чужими» нормативное управление требует дательного: «стали мне чужими»; значение разрыва отношений сохраняется.'
theological_decisions:
- issue: Подразумеваемое подлежащее הִרְחִיק
  choice: Сохранено местоимение «Он» без прямого называния Бога.
  alternative: «Бог удалил от меня моих братьев».
  rationale: В еврейском тексте подлежащее — неназванное третье лицо мужского рода; ближайший контекст указывает на Бога. «Он» сохраняет лаконичность и напряжение оригинала, не внося пояснение внутрь стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической жалобы. Синтаксический параллелизм двух полустиший сохранён; формулировки понятны без конфессиональной терминологии.
