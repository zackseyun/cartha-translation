  text: חָנֻּ֬/נִי חָנֻּ֣/נִי אַתֶּ֣ם רֵעָ֑/י כִּ֥י יַד אֱ֝ל֗וֹהַּ נָ֣גְעָה בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/021.yaml
  text: Have pity on me[a], have pity on me, you my friends[b], for the hand of God has struck me.
translation:
  language: ru
  text: Сжальтесь надо мной[a], сжальтесь надо мной, друзья мои, ведь рука Бога поразила меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте милостивы ко мне»; или: «Помилуйте меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рука Бога коснулась меня»; в этом контексте выражение означает причиняющее страдание воздействие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֻּנִי
  choice: Сжальтесь надо мной
  rationale: Форма повелительного наклонения во множественном числе от חנן обращена к друзьям Иова. В данном контексте естественное русское «сжальтесь надо мной» передаёт просьбу о сострадании; повтор сохранён ради эмоциональной настойчивости.
- source_word: רֵעָי
  choice: друзья мои
  rationale: רֵעַ означает друга или товарища. Обращение «друзья мои» естественно для современного литературного русского языка и подчёркивает, что Иов ждёт сочувствия именно от близких ему людей.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание просьбы. «Ведь» ясно и естественно связывает мольбу Иова с последующим указанием на его бедствие.
- source_word: יַד אֱלוֹהַּ
  choice: рука Бога
  rationale: Сохранён еврейский образ руки как выражения действия и силы Бога, без его смыслового упрощения.
- source_word: נָגְעָה בִּי
  choice: поразила меня
  rationale: Глагол נגע с предлогом ב может обозначать прикосновение, удар или причинение вреда. В контексте страданий Иова «поразила меня» передаёт пагубное воздействие, сохраняя конкретность образа.
theological_decisions:
- issue: Причастность Бога к страданию Иова
  choice: ведь рука Бога поразила меня
  alternative: ведь рука Бога коснулась меня
  rationale: Еврейский текст прямо связывает страдание Иова с действием Божьей руки. Перевод сохраняет эту богословскую напряжённость, не смягчая и не объясняя её.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Дословный образ «рука Бога» сохранён; повтор просьбы воспроизведён. Все сноски обозначены в основном тексте.
