    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: Вот уже десять раз
  rationale: Сочетание указывает на многократность и риторически подводит итог повторным действиям собеседников Иова. «Вот уже» естественно передаёт этот оттенок в современном русском языке, сохраняя число «десять».
- source_word: תַּכְלִימוּנִי
  choice: вы унижали меня
  rationale: Каузативная форма от כלם означает подвергать стыду, позорить или унижать. «Унижали» ясно выражает причинённое Иову личное бесчестье и согласуется с повторностью действия.
- source_word: לֹא תֵבֹשׁוּ
  choice: вам не стыдно
  rationale: בוש обозначает испытывать стыд. Безличная русская конструкция звучит естественно и сохраняет нравственный упрёк.
- source_word: תַּהְכְּרוּ לִי
  choice: обращаться со мной как с чужим
  rationale: Трудная форма от נכר может описывать отчуждённое, враждебное или жестокое обращение. Выбранный перевод сохраняет конкретный образ чужого, не сводя неоднозначность лишь к общему «обижать».
