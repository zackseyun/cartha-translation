lexical_decisions:
- source_word: בְּעֵט
  choice: резцом
  rationale: עֵט обозначает орудие для письма или нанесения знаков; сочетание с железом и скалой указывает здесь на инструмент для высекания, поэтому «резец» естественнее, чем «перо».
- source_word: בַּרְזֶל
  choice: железным
  rationale: Прямое обозначение материала, из которого сделан резец.
- source_word: וְעֹפָרֶת
  choice: и свинцом
  rationale: עֹפָרֶת прямо означает свинец. Возможное применение металла для заполнения прорезанных букв не вносится в основной текст, поскольку оно не указано явно.
- source_word: לָעַד
  choice: навеки
  rationale: Передаёт идею непреходящей сохранности надписи и звучит естественно в поэтическом контексте.
- source_word: בַּצּוּר
  choice: в скале
  rationale: צוּר означает скалу или утёс; предлог «в» уместно передаёт нанесение знаков в глубину камня.
- source_word: יֵחָצְבוּן
  choice: высечены
  rationale: Глагол חצב обычно означает «высекать, вырубать». В контексте письменных слов «высечены» точно передаёт и физическое действие, и результат — долговечную надпись. Желательное значение формы сохраняется благодаря зависимости строки от пожелания в предыдущем стихе.
