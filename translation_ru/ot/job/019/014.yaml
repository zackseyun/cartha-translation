  text: חָדְל֥וּ קְרוֹבָ֑/י וּֽ/מְיֻדָּעַ֥/י שְׁכֵחֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/014.yaml
  text: My relatives have failed me[a], and my acquaintances have forgotten me.
translation:
  language: ru
  text: Мои близкие покинули меня[a], и знакомые забыли меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мои близкие отстранились». Буквально: «Мои близкие перестали».'
    reason: Лаконичная еврейская конструкция не уточняет, что именно близкие перестали делать; основной текст естественно передаёт подразумеваемый разрыв отношений.
lexical_decisions:
- source_word: חָדְלוּ
  choice: покинули меня
  rationale: Основное значение глагола — «перестать, прекратить». При подлежащем «мои близкие» русское «покинули меня» естественно передаёт прекращение отношений и поддержки; местоименное дополнение восполняется из контекста и параллельной строки.
- source_word: קְרוֹבָי
  choice: мои близкие
  rationale: Слово обозначает тех, кто находится близко, часто родственников или близких людей. «Близкие» сохраняет некоторую широту еврейского выражения и естественно звучит по-русски.
- source_word: וּמְיֻדָּעַי
  choice: и знакомые
  rationale: Субстантивированная форма от ידע указывает на людей, известных говорящему. «Знакомые» передаёт это значение, не усиливая степень близости до «друзей».
- source_word: שְׁכֵחוּנִי
  choice: забыли меня
  rationale: Прямо передаёт значение глагола שכח и сохраняет силу параллельного сетования Иова.
theological_decisions: []
