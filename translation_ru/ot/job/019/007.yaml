    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Естественное для современного литературного русского языка эмфатическое указание, привлекающее внимание к жалобе Иова.
- source_word: אֶצְעַק
  choice: я кричу
  rationale: Глагол צעק обозначает громкий, настойчивый крик, особенно в бедствии; настоящее время передаёт непосредственность жалобы.
- source_word: חָמָס
  choice: «Насилие!»
  rationale: Слово может обозначать насилие, неправду или вопиющее беззаконие; здесь оно звучит как возглас пострадавшего, требующего вмешательства.
- source_word: אֵעָנֶה
  choice: мне не отвечают
  rationale: Нифаль от ענה передаёт отсутствие ответа на крик; безличная русская конструкция сохраняет неопределённость субъекта.
- source_word: אֲשַׁוַּע
  choice: взываю о помощи
  rationale: Глагол выражает настоятельный призыв о помощи; «взываю» поддерживает поэтический параллелизм, не дублируя буквально «кричу».
- source_word: מִשְׁפָּט
  choice: правосудия
  rationale: 'В данном контексте слово имеет судебно-правовой оттенок: Иов сетует на отсутствие справедливого разбирательства и защиты.'
theological_decisions:
- issue: Характер жалобы Иова перед Богом
  choice: Сохранить прямую жалобу на отсутствие ответа и правосудия, не смягчая её.
  alternative: Передать слова косвеннее, чтобы не создавать впечатления, будто Бог допускает отсутствие справедливости.
  rationale: Еврейский текст намеренно сохраняет остроту протеста Иова; перевод не должен заранее разрешать это богословское напряжение.
- issue: Неуказанный субъект ответа
  choice: «мне не отвечают»
  alternative: «Бог мне не отвечает»
  rationale: В стихе действующее лицо грамматически не названо. Контекст может подразумевать Бога, но эксплицировать это в основном тексте означало бы устранить подлинную формальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической жалобы. Двоеточие оформляет חָמָס как прямой тревожный возглас, а точка с запятой сохраняет параллелизм двух полустиший. Все сноски отмечены в основном тексте.
