  text: גַּם עֲ֭וִילִים מָ֣אֲסוּ בִ֑/י אָ֝ק֗וּמָה וַ/יְדַבְּרוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/018.yaml
  text: Even little children despise me; when I rise[a], they speak against me.
translation:
  language: ru
  text: Даже мальчишки презирают меня; стоит мне подняться — они говорят против меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «мальчишки», может также означать «глупцы» или «наглецы». Здесь многие понимают его как обозначение незрелых юнцов, насмехающихся над Иовом.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Даже
  rationale: 'Передаёт усиление и продолжение жалобы: презрение исходит даже от тех, чьё неуважение особенно унизительно.'
- source_word: עֲוִילִים
  choice: мальчишки
  rationale: В данном контексте слово, основное значение которого связано с глупостью или нравственной несостоятельностью, вероятно, обозначает незрелых юнцов, насмехающихся над Иовом. «Мальчишки» естественно передаёт и возрастную незрелость, и унизительный для Иова социальный оттенок, не добавляя определения «маленькие», которого нет в еврейском тексте.
- source_word: מָאֲסוּ בִי
  choice: презирают меня
  rationale: Глагол מאס выражает пренебрежительное отвержение; настоящее время естественно передаёт описываемое Иовом продолжающееся положение.
- source_word: אָקוּמָה
  choice: стоит мне подняться
  rationale: 'Форма буквально означает «я встану/поднимусь»; в связи с последующим действием она естественно понимается как временно-условная: всякий раз, когда Иов поднимается, они начинают говорить против него.'
- source_word: וַיְדַבְּרוּ בִי
  choice: они говорят против меня
  rationale: Сочетание דבר с ב допускает значение речи о ком-либо или против кого-либо. Враждебный контекст поддерживает «против меня», при этом перевод не конкретизирует речь как насмешку сильнее, чем оригинал.
theological_decisions: []
