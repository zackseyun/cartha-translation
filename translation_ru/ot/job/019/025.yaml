  text: וַ/אֲנִ֣י יָ֭דַעְתִּי גֹּ֣אֲלִ/י חָ֑י וְ֝/אַחֲר֗וֹן עַל עָפָ֥ר יָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/025.yaml
  text: But as for me[a], I know that my Redeemer lives[c][b], and afterward he will rise over the dust.
translation:
  language: ru
  text: 'Но я знаю: мой Искупитель[a] жив, и напоследок он встанет над прахом[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой Заступник». Еврейское גֹּאֵל может обозначать родственника, который выкупает, защищает или добивается восстановления прав своего близкого.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «и в конце он встанет на земле» или «и как последний он встанет над прахом». Еврейская фраза трудна; «прах» может напоминать о земле, смертности или могиле.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но я
  rationale: Самостоятельное местоимение при союзе подчёркивает личное, контрастное утверждение Иова; по-русски это естественно передаётся сочетанием «Но я».
- source_word: יָדַעְתִּי
  choice: знаю
  rationale: Перфект выражает твёрдое знание, сохраняющее силу в настоящем; русский глагол настоящего времени передаёт это естественно.
- source_word: גֹּאֲלִי
  choice: мой Искупитель
  rationale: גאל обозначает родственника-заступника, выкупающего, защищающего или добивающегося восстановления прав. «Искупитель» сохраняет широту и традиционный богословский вес слова, не уточняя личность действующего лица сверх текста.
- source_word: חָי
  choice: жив
  rationale: Предикативное прилагательное буквально и естественно передаётся русским кратким прилагательным «жив».
- source_word: וְאַחֲרוֹן
  choice: и напоследок
  rationale: אַחֲרוֹן допускает наречное понимание «напоследок / в конце» и субстантивное «как последний». «Напоследок» сохраняет временную неопределённость, не превращая фразу в разработанную эсхатологическую формулу.
- source_word: עַל
  choice: над
  rationale: Предлог может означать «на, над, поверх». «Над» сохраняет пространственную открытость сочетания и не требует понимать прах просто как поверхность земли.
- source_word: עָפָר
  choice: прахом
  rationale: עָפָר буквально означает пыль или прах и может вызывать ассоциации с землёй, смертностью и могилой. «Прах» сохраняет эту образную многозначность.
- source_word: יָקוּם
  choice: встанет
  rationale: קום значит «встать, подняться, выступить». «Встанет» близко к основному значению и не навязывает исключительно воскресительный или судебный смысл.
theological_decisions:
- issue: Личность и функция גֹּאֵל Иова
  choice: «мой Искупитель» без прямого отождествления с Богом, небесным свидетелем или Мессией
  alternative: «мой Заступник» или «мой родственник-искупитель»
  rationale: Еврейское слово допускает юридический, родственный и избавительный оттенки, но стих прямо не устанавливает личность фигуры. Основной текст сохраняет богословскую ёмкость термина, а сноска сообщает важную контекстуальную альтернативу.
- issue: Смысл וְאַחֲרוֹן עַל־עָפָר יָקוּם
  choice: «и напоследок он встанет над прахом»
  alternative: «и в конце он встанет на земле»; «и как последний он встанет над прахом»
  rationale: Синтаксис и временно-пространственная образность спорны. Перевод сохраняет неоднозначность и не делает фразу более явно мессианской или воскресительной, чем позволяет еврейский текст.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной традиционной окраской. Слово «прах» сохраняет библейскую образность, оставаясь понятным; синтаксис краток и подчёркивает уверенность говорящего. Маркеры сносок размещены непосредственно после соответствующих выражений.
