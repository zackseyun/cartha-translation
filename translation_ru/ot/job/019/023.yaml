translation_notes:
  register: Современный литературный русский язык с торжественной эмоциональностью, соответствующей горячему желанию Иова. Параллелизм двух восклицаний сохранён; во второй строке местоимение «их» естественно восполняет подразумеваемый объект — «мои слова».
