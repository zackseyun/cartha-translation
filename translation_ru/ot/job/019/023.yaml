  text: Oh[a], that now my words were written down! Oh[b], that they were inscribed in a book!
translation:
  language: ru
  text: О, если бы теперь были записаны мои слова! О, если бы они были начертаны[b] в книге[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в свитке» либо «в письменном документе»; древнееврейское слово может обозначать разные виды письменного текста.'
    reason: cultural_note
  - marker: b
    text: 'Или: «высечены»; глагол может подразумевать нанесение надписи способом, рассчитанным на долговечность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы
  rationale: Устойчивое древнееврейское выражение передаёт горячее желание, а не буквальный вопрос «кто даст?».
- source_word: אֵפוֹ
  choice: теперь
  rationale: Частица усиливает эмоциональность и непосредственность желания; «теперь» естественно передаёт эту настоятельность.
- source_word: וְיִכָּתְבוּן
  choice: записали
  rationale: Форма имеет пассивный смысл («были записаны»), но неопределённо-личная русская конструкция сохраняет отсутствие названного исполнителя и звучит естественнее.
- source_word: מִלָּי
  choice: мои слова
  rationale: Прямой и естественный перевод, обозначающий произнесённые Иовом слова.
- source_word: בַּסֵּפֶר
  choice: в книге
  rationale: סֵפֶר может обозначать книгу, свиток или письменный документ; «книга» сохраняет широкий смысл и хорошо понятно современному читателю.
- source_word: וְיֻחָקוּ
  choice: начертали
  rationale: Глагол חקק указывает на нанесение или вырезание надписи и подчёркивает её долговечность; «начертали» сохраняет торжественный тон и связь с прочным запечатлением.
