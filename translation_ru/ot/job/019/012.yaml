lexical_decisions:
- source_word: יַחַד
  choice: Вместе
  rationale: Передаёт согласованное, одновременное действие отрядов и естественно звучит в современной русской поэзии.
- source_word: יָבֹאוּ
  choice: приходят
  rationale: Основное значение בוא — «приходить»; настоящее время сохраняет живость поэтического описания.
- source_word: גְדוּדָיו
  choice: его отряды
  rationale: גְּדוּד обозначает военный отряд или вооружённую группу; «отряды» сохраняет военный образ, не уточняя их численность и характер сверх текста.
- source_word: וַיָּסֹלּוּ
  choice: прокладывают
  rationale: Глагол סלל может обозначать сооружение или насыпание дороги либо осадной насыпи. В сочетании с דַּרְכָּם «прокладывают дорогу» ясно и естественно передаёт основной образ.
- source_word: עָלַי
  choice: против меня
  rationale: В контексте военного нападения עַל имеет враждебную направленность, которую естественно передаёт «против меня».
- source_word: דַּרְכָּם
  choice: дорогу
  rationale: דֶּרֶךְ может значить «дорога», «путь»; конкретное «дорога» лучше сочетается с образом её сооружения для наступления.
- source_word: וַיַּחֲנוּ
  choice: разбивают стан
  rationale: Передаёт военное значение חנה — располагаться лагерем; выражение литературное, понятное и соответствует осадному образу.
- source_word: סָבִיב
  choice: вокруг
  rationale: Выражает окружение со всех сторон без ненужного расширения текста.
- source_word: לְאָהֳלִי
  choice: моего шатра
  rationale: אֹהֶל буквально означает шатёр. Этот выбор сохраняет конкретный образ жилища и звучит достойно в поэтическом контексте.
theological_decisions:
- issue: К кому относится суффикс 3-го лица мужского рода в גְדוּדָיו («его отряды»)
  choice: Сохранено местоимение «его»; в ближайшем контексте оно указывает на Бога, которого Иов изображает нападающим на него.
  alternative: Понимать «его» как указание на не названного военачальника внутри метафоры.
  rationale: Еврейский текст не называет референта прямо в этом стихе. Местоимение сохраняет форму и напряжение оригинала, позволяя контексту определить его.
translation_notes:
  register: Современный литературный русский язык с сохранением военной метафоры. «Отряды», «дорога», «разбивают стан» и «шатёр» конкретны и понятны; синтаксис сохраняет поэтический параллелизм исходного текста.
