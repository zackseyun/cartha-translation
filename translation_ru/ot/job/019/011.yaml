  text: His anger burns against me[a], and he counts me as his enemies.
translation:
  language: ru
  text: Он разгневался на меня и счёл меня одним из Своих врагов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «счёл меня Своими врагами»; в еврейском тексте слово «врагами» стоит во множественном числе.'
    reason: Поясняет необычное сочетание единственного «меня» с множественным числом в еврейском тексте и основание для перевода «одним из ... врагов».
lexical_decisions:
- source_word: וַיַּחַר עָלַי אַפּוֹ
  choice: Его гнев воспылал против меня
  rationale: Сочетание חרה с אַף — образная идиома разгорающегося гнева. «Воспылал» естественно сохраняет метафору, а прошедшее время передаёт форму wayyiqtol; עָלַי указывает на направленность враждебного чувства против Иова.
- source_word: וַיַּחְשְׁבֵנִי
  choice: Он считает меня
  rationale: חשב означает считать, признавать или рассматривать кого-либо кем-либо. Настоящее время по-русски естественно передаёт сохраняющийся результат описанного отношения.
- source_word: לוֹ כְצָרָיו
  choice: одним из Своих врагов
  rationale: Буквально конструкция означает «для Него / у Него — как Его врагов». Поскольку дополнение «меня» единственного числа, а «врагов» — множественного, выражение «одним из» ясно и без устранения числа передаёт включение Иова в разряд Божьих врагов.
theological_decisions:
- issue: К кому относятся подлежащее и местоименные суффиксы третьего лица
  choice: Прописные «Он» и «Своих» указывают на Бога как на продолжающего действовать субъекта.
  alternative: Оставить третье лицо графически неопределённым и допустить неизвестного враждебного деятеля.
  rationale: В контексте Иов 19:6–12 действия приписываются Богу. Перевод сохраняет резкость жалобы Иова и не смягчает богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической жалобы. «Воспылал» слегка возвышенно, но понятно и сохраняет образ горящего гнева. Формулировка «одним из Своих врагов» делает синтаксис естественным, одновременно удерживая множественное число оригинала; буквальная особенность отмечена в сноске.
