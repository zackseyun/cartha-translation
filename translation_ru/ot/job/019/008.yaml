base_translation:
  language: en
  yaml_path: translation/ot/job/019/008.yaml
  text: He has walled up my way so that I cannot pass[a], and he has set darkness upon my paths.
translation:
  language: ru
  text: Он преградил стеной мой путь, так что мне не пройти[a], и окутал тьмой мои тропы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте подлежащее подразумевается. Из контекста видно, что Иов говорит о Боге, хотя в самом стихе сказано лишь: «он».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָרְחִי
  choice: мой путь
  rationale: Слово обозначает дорогу, путь или жизненный ход; «мой путь» естественно по-русски и сохраняет как конкретный, так и переносный смысл.
- source_word: גָדַר
  choice: преградил стеной
  rationale: Глагол передаёт образ ограждения стеной или преграды; сочетание сохраняет конкретность образа и звучит естественнее буквального «обнёс стеной» в данном контексте.
- source_word: וְלֹא אֶעֱבוֹר
  choice: так что мне не пройти
  rationale: Фраза ясно передаёт результат поставленной преграды и сохраняет значение невозможности пройти.
- source_word: נְתִיבוֹתַי
  choice: мои тропы
  rationale: Сохраняет множественное число и поэтический образ путей, по которым движется Иов.
- source_word: חֹשֶׁךְ
  choice: тьму
  rationale: Прямой эквивалент, сохраняющий возможный буквальный и метафорический смысл.
- source_word: יָשִׂים
  choice: положил
  rationale: Передаёт конкретный образ тьмы, помещённой на путях, не сводя выражение к более толковательному «омрачил».
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее третьего лица
  choice: Он
  alternative: Бог / Господь
  rationale: В еврейском тексте подлежащее не названо; из контекста ясно, что Иов говорит о Боге. Местоимение сохраняет литературный ход и не добавляет отсутствующего в самом стихе имени.
translation_notes:
  register: Современный литературный русский язык с сохранением конкретной поэтической образности еврейского текста. «Преградил стеной» передаёт גדר без архаизации; «положил тьму» намеренно сохраняет необычный осязаемый образ оригинала.
