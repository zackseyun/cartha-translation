lexical_decisions:
- source_word: בְּעוֹרִי וּבִבְשָׂרִי
  choice: к коже и плоти
  rationale: Существительные עוֹר и בָּשָׂר буквально означают «кожа» и «плоть». При глаголе דבק русский язык естественно передаёт предлог ב сочетанием «прилипнуть к»; притяжательность ясна из «моя кость» и контекста.
- source_word: דָּבְקָה עַצְמִי
  choice: Моя кость прилипла
  rationale: Сохранено единственное число עַצְמִי («моя кость»), которое, вероятно, собирательно обозначает костяк Иова. דבק передано как «прилипла», что выражает тесное прилегание вследствие крайнего истощения.
- source_word: וָאֶתְמַלְּטָה
  choice: и я спасся
  rationale: 'Форма от מלט обозначает избавление или спасение. Прошедшее время естественно передаёт достигнутое состояние: Иов всё ещё остался жив.'
- source_word: בְּעוֹר שִׁנָּי
  choice: лишь кожей на зубах
  rationale: Сохранён необычный телесный образ еврейского текста. Частица «лишь» передаёт предельную малость того, с чем Иов уцелел, не заменяя неясный образ привычным русским выражением.
