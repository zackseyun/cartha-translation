  source_fidelity: 'В первой части еврейские формы передают разворачивающееся действие: «он сокрушает/разрушает меня со всех сторон, и я иду». Передача «и меня не стало» допустима как контекстуальное истолкование וָאֵלַךְ, но она несколько сильнее буквального текста и должна оставаться снабжённой сноской. Во второй части образ требует, чтобы «как дерево» относилось к надежде как к вырываемому с корнем дереву. Настоящее время сохраняет поэтическую непосредственность еврейского текста и не вводит невыраженную завершённость.'
  naturalness: '«Он разрушил меня» и «вырвал» звучат естественно, однако прошедшее время ослабляет характер плача как описания текущего бедствия. Оборот «вырвал с корнем, как дерево» несколько неоднозначен по синтаксису; постановка дополнения после глагола делает образ яснее. Строчная буква в «он» уместна: деятель подразумевается контекстом, но прямо в стихе не назван.'
  terminology: «Сокрушает», «надежду» и «вырвать с корнем» точно и литературно передают נתץ, תִּקְוָה и נסע в образном контексте. Сноска должна буквально передавать «и я иду», а не заранее сужать его до «ухожу».
