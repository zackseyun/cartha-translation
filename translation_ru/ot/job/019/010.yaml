lexical_decisions:
- source_word: יִתְּצֵנִי
  choice: разрушил меня
  rationale: Глагол נתץ означает разрушать, сносить, разбирать. Выбор передаёт полное сокрушение Иова и сохраняет образ разрушения.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Наречное употребление указывает на всеохватность действия; это естественное и точное русское выражение.
- source_word: וָאֵלַךְ
  choice: и меня не стало
  rationale: Буквально форма означает «и я пошёл/ухожу», но в данном контексте выражает итог разрушения — исчезновение или гибель Иова. Неоднозначность отмечена в сноске.
- source_word: וַיַּסַּע
  choice: вырвал с корнем
  rationale: Глагол נסע может означать снятие, перемещение или выдёргивание закреплённого предмета. С последующим сравнением с деревом русский оборот «вырвал с корнем» ясно сохраняет образ искоренения.
- source_word: כָּעֵץ
  choice: как дерево
  rationale: Прямо передаёт сравнительную конструкцию и сохраняет образ дерева.
- source_word: תִּקְוָתִי
  choice: мою надежду
  rationale: תִּקְוָה обычно означает надежду или ожидание; «надежда» естественно соответствует смыслу плача Иова.
theological_decisions:
- issue: Обозначение подразумеваемого деятеля и написание местоимения
  choice: он — со строчной буквы
  alternative: Он — с прописной буквы или явное «Бог»
  rationale: В еврейском тексте деятель обозначен только глагольной формой третьего лица; контекст указывает на Бога, но стих не называет его прямо. Строчная буква не добавляет отсутствующего в оригинале конфессионального типографского признака.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Порядок слов «мою надежду он…» слегка подчёркивает надежду, не делая фразу архаичной; тире передаёт результат разрушения.
