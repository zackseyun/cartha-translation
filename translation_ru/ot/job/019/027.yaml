lexical_decisions:
- source_word: אֲשֶׁר
  choice: которого
  rationale: Относительное местоимение относится к личному предшествующему референту и выступает дополнением при глаголе «увижу».
- source_word: אֲנִי אֶחֱזֶה לִּי
  choice: я сам увижу своими глазами
  rationale: Самостоятельное אֲנִי передаёт усиление «я сам»; трудное לִי выражено естественной русской конструкцией «своими глазами», подчёркивающей личное видение без судебного истолкования «за меня».
- source_word: וְעֵינַי רָאוּ
  choice: и мои глаза увидят
  rationale: Будущее время следует поэтическому параллелизму с предшествующим имперфектом; повтор глагола «увидеть» сохраняет настойчивость исходного образа.
- source_word: וְלֹא זָר
  choice: не чужой
  rationale: 'זָר буквально означает «чужой, посторонний». Формулировка сохраняет лексическую неоднозначность: речь может идти либо о том, что увидит сам Иов, а не другой, либо о том, что увиденный не будет ему чужим.'
- source_word: כָּלוּ
  choice: истомились
  rationale: Глагол כלה здесь передаёт иссякание, изнеможение или томление; «истомились» естественно соединяет сильное внутреннее желание и изнеможение.
- source_word: כִלְיֹתַי
  choice: мои почки
  rationale: Сохранён буквальный древнееврейский образ почек как средоточия глубочайших чувств; значение пояснено в сноске.
- source_word: בְּחֵקִי
  choice: в груди моей
  rationale: חֵיק обозначает грудь, лоно, внутреннюю область у груди. Такой порядок слов сохраняет возвышенный поэтический регистр без архаизма «недра».
theological_decisions:
- issue: Характер ожидаемого Иовом видения
  choice: Передать личное будущее видение упомянутого ранее Искупителя, не уточняя его обстоятельств.
  alternative: Истолковать слова как однозначное указание на телесное воскресение, земное оправдание либо видение Бога после смерти.
  rationale: Стих настойчиво подчёркивает, что увидит сам Иов, но сам по себе не решает, когда и каким образом это произойдёт.
- issue: Значение וְלֹא זָר
  choice: Сохранить «не чужой» в основном тексте и пояснить возможный смысл в сноске.
  alternative: Однозначно перевести «а не кто-то другой».
  rationale: Синтаксическая краткость еврейского текста допускает связь как с субъектом видения, так и с воспринимаемым лицом; перевод не должен молча устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Конкретные образы «почки» и «грудь» сохранены; инверсия в заключительной строке умеренно возвышает регистр. Все маркеры сносок присутствуют в основном тексте.
