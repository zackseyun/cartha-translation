  text: How long will you torment me and crush me with words?[a]
translation:
  language: ru
  text: Доколе вы будете терзать мою душу и сокрушать меня словами?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Доколе вы будете огорчать меня и сокрушать меня словами?»'
    reason: 'Лексическая альтернатива: תּוֹגְיוּן допускает значение причинения скорби или огорчения, а נַפְשִׁי может обозначать человека как целое — «меня».'
lexical_decisions:
- source_word: עַד אָ֭נָה
  choice: Доколе
  rationale: Устойчивое и естественное для возвышенной современной русской речи выражение продолжительного жалобного вопроса; сохраняет риторическую силу еврейской формулы.
- source_word: תּוֹגְיוּן
  choice: будете терзать
  rationale: Глагол в породе хифиль передаёт причинение скорби и мучения. «Терзать» естественно сочетается с «душу» и выражает длительное внутреннее страдание Иова.
- source_word: נַפְשִׁי
  choice: мою душу
  rationale: Здесь נֶפֶשׁ обозначает самого Иова в его внутреннем, переживающем существе. Буквальный образ естественен по-русски и сохраняет поэтический параллелизм, не требуя жёсткого антропологического разделения души и тела.
- source_word: וּתְדַכְּאוּנַנִי
  choice: и сокрушать меня
  rationale: Корень דכא передаёт образ раздавливания, подавления или полного надлома; «сокрушать» сохраняет метафорическую силу и достоинство поэтической речи.
- source_word: בְמִלִּים
  choice: словами
  rationale: 'Предлог בְּ имеет инструментальное значение: слова друзей представлены средством, которым они сокрушают Иова.'
theological_decisions: []
