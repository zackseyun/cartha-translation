  yaml_path: translation/ot/job/019/029.yaml
  text: Be afraid of the sword yourselves[a], for wrath brings the punishments of the sword, so that you may know that there is judgment.
translation:
  language: ru
  text: Сами бойтесь меча, ведь гнев навлекает кары меча, чтобы вы знали, что есть суд[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что есть Всемогущий»; заключительное древнееврейское выражение трудно для понимания, и его также переводят: «что есть суды» или «что есть Судья».'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּרוּ לָכֶם
  choice: Сами бойтесь
  rationale: 'Повелительная форма множественного числа выражает предостережение, а местоименное לָכֶם придаёт ему эмфатический оттенок: Иов обращает угрозу суда на самих собеседников.'
- source_word: מִפְּנֵי חֶרֶב
  choice: меча
  rationale: Оборот с מִפְּנֵי после глагола страха естественно передаётся по-русски как указание на то, чего следует бояться.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для предостережения; «ведь» ясно и естественно передаёт пояснительную связь.
- source_word: חֵמָה
  choice: гнев
  rationale: Слово обозначает пылающий гнев или ярость. «Гнев» сохраняет и эмоциональный, и нравственно-судебный оттенок контекста.
- source_word: עֲוֺנוֹת חָרֶב
  choice: кары меча
  rationale: עָוֹן может обозначать не только вину или беззаконие, но и их наказание. В сочетании с «мечом» контекст требует смысла последствий вины; множественное число сохранено словом «кары».
- source_word: לְמַעַן תֵּדְעוּן
  choice: чтобы вы знали
  rationale: לְמַעַן вводит цель или ожидаемый результат, а форма второго лица множественного числа прямо обращена к друзьям Иова.
- source_word: שדין
  choice: что есть суд
  rationale: Заключительная форма трудна и допускает несколько разборов. Понимание в смысле существования суда лучше всего продолжает непосредственное предостережение о возмездии, не уточняя сверх текста, кто именно совершает суд.
theological_decisions:
- issue: Толкование трудного заключительного выражения שדין
  choice: что есть суд
  alternative: что есть Всемогущий; что есть суды; что есть Судья
  rationale: В контексте Иов предупреждает друзей, что их гнев и враждебность могут подвергнуть их возмездию. Основной текст сохраняет общий судебный смысл, а значимые древние и современные варианты понимания приведены в сноске, чтобы не устранять подлинную текстовую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, весомой интонацией предостережения. Повтор слова «меч» сохранён вслед за древнееврейским текстом; «Сами бойтесь» подчёркивает, что предупреждение относится к собеседникам Иова.
