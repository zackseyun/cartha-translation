    reason: lexical_alternative
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: гнушаются мной
  rationale: Глагол תעב выражает сильное отвращение, а не простую неприязнь; «гнушаются мной» передаёт эту интенсивность и соответствует возвышенному регистру плача.
- source_word: כָּל
  choice: все
  rationale: Количественное слово имеет всеохватное значение; «все» естественно передаёт его в данном контексте.
- source_word: מְתֵי סוֹדִי
  choice: мои близкие друзья
  rationale: Сочетание буквально обозначает людей, входящих в круг доверительного общения или совета. «Близкие друзья» естественно передаёт принадлежность к доверенному кругу, а буквальный образ отмечен в сноске.
- source_word: וְזֶה
  choice: и те
  rationale: Хотя זֶה формально стоит в единственном числе, последующий глагол имеет множественное число, а выражение параллельно предшествующей группе; собирательное «те» сохраняет смысл и звучит естественно.
- source_word: אָהַבְתִּי
  choice: кого я любил
  rationale: Форма qatal указывает на любовь Иова к этим людям; прошедшее время естественно для русского плача и не добавляет лишнего временного оттенка.
- source_word: נֶהְפְּכוּ
  choice: обратились
  rationale: Nifal глагола הפך выражает перемену или поворот; «обратились против» передаёт смену отношения и враждебную направленность.
- source_word: בִי
  choice: против меня
  rationale: В контексте отчуждения предлог ב имеет враждебный смысл, который по-русски естественно выражается сочетанием «против меня».
