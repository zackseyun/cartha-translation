  text: לְ/עַבְדִּ֣/י קָ֭רָאתִי וְ/לֹ֣א יַעֲנֶ֑ה בְּמוֹ פִ֝֗/י אֶתְחַנֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/016.yaml
  text: I call to my servant[a], but he does not answer[b]; I plead with him with my own mouth.
translation:
  language: ru
  text: Зову я слугу своего[a], но он не отвечает[b]; своими устами я умоляю его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раба своего». Еврейское עֶבֶד в зависимости от контекста может означать и слугу, и раба.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, при более строгой передаче временных форм: «Позвал я слугу своего, но он не ответил; своими устами я умолял его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעַבְדִּי
  choice: слугу своего
  rationale: עֶבֶד может обозначать слугу или раба. В основном тексте «слуга» естественно передаёт домашнего подчинённого, тогда как социальный статус остаётся неоднозначным и отмечен в сноске.
- source_word: קָרָאתִי
  choice: зову я
  rationale: Перфект קרא в поэтической жалобе допустимо понимать как живое описание нынешнего положения; инверсия сохраняет возвышенный, но понятный русский ритм.
- source_word: וְלֹא יַעֲנֶה
  choice: но он не отвечает
  rationale: ענה значит «отвечать, откликаться»; союз передан противительным «но» по смыслу контраста, а имперфект — как продолжающееся отсутствие ответа.
- source_word: בְּמוֹ פִי
  choice: своими устами
  rationale: 'Частица מו усиливает личный характер действия: Иов вынужден обращаться непосредственно. «Своими устами» сохраняет это подчёркивание без лишней модальности.'
- source_word: אֶתְחַנֶּן לוֹ
  choice: я умоляю его
  rationale: Hitpael от חנן выражает просьбу о милости или благосклонности. «Умоляю» передаёт унизительную для Иова настойчивую мольбу, не добавляя отсутствующего в еврейском тексте значения «должен».
