  text: כְּ֭בוֹדִ/י מֵ/עָלַ֣/י הִפְשִׁ֑יט וַ֝/יָּ֗סַר עֲטֶ֣רֶת רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/009.yaml
  text: He has stripped my honor from me and removed the crown from my head[a].
translation:
  language: ru
  text: 'Он совлёк с меня мою честь

    и снял венец с моей головы.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мою славу»; или: «моё достоинство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹדִי
  choice: мою честь
  rationale: כָּבוֹד может означать честь, славу, достоинство или общественный вес. В жалобе Иова «честь» естественно передаёт утрату положения и уважения, не придавая слову излишне богословского оттенка.
- source_word: מֵעָלַי
  choice: с меня
  rationale: Буквально «с того, что на мне»; при русском «совлёк» сочетание «с меня» идиоматично и сохраняет образ снятия одеяния.
- source_word: הִפְשִׁיט
  choice: совлёк
  rationale: Глагол обозначает снятие одежды или покрова. «Совлёк» сохраняет яркую метафору насильственного лишения чести и соответствует возвышенному поэтическому регистру.
- source_word: וַיָּסַר
  choice: снял
  rationale: Каузативная форма סור означает «удалил, убрал». В сочетании с венцом русское «снял» звучит естественно и точно передаёт действие.
- source_word: עֲטֶרֶת
  choice: венец
  rationale: Слово обозначает венец, корону или почётный головной убор. «Венец» сохраняет поэтичность и образ утраченных чести и положения.
- source_word: רֹאשִׁי
  choice: моей головы
  rationale: Прямо передаёт еврейскую притяжательную конструкцию и сохраняет центральный образ венца на голове.
theological_decisions:
- issue: Кто является неназванным деятелем
  choice: Местоимение «Он» оставлено без прямого называния Бога.
  alternative: Назвать Бога прямо либо понимать субъект как неопределённого противника или обстоятельства.
  rationale: В ближайшем контексте Иов говорит о Боге как о причине своего унижения, однако еврейский текст использует лишь форму третьего лица. Перевод сохраняет эту сжатость и богословское напряжение, не добавляя имени Бога.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Совлёк» и «венец» сохраняют параллельные образы лишения одежды и знака почёта; синтаксис остаётся ясным для обычного читателя.
