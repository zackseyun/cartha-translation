  text: דְּֽעוּ אֵ֭פוֹ כִּי אֱל֣וֹהַּ עִוְּתָ֑/נִי וּ֝/מְצוּד֗/וֹ עָלַ֥/י הִקִּֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/019/006.yaml
  text: Know then that God has wronged me and has surrounded me with his net[a][b].
translation:
  language: ru
  text: 'Итак, знайте: Бог поступил со мной несправедливо[a] и окружил меня Своей сетью[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обошёлся со мной несправедливо»; возможно также: «извратил правосудие против меня». Еврейский глагол может означать искривление или искажение того, что правильно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Своей ловушкой» или «Своей охотничьей сетью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹ
  choice: Итак, знайте
  rationale: Форма דְּעוּ — повелительное наклонение множественного числа, обращённое к собеседникам Иова; אֵפוֹ усиливает вывод из сказанного. «Итак, знайте» естественно передаёт и обращение, и ход рассуждения.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Обычное единственное обозначение Бога; в этой форме нет дополнительного значения «Всемогущий».
- source_word: עִוְּתָנִי
  choice: поступил со мной несправедливо
  rationale: Глагол עות может означать искривление, искажение правды или несправедливое обращение. Выбранная формулировка ясно сохраняет резкое обвинение Иова и при этом звучит естественно по-русски.
- source_word: מְצוּדוֹ
  choice: Своей сетью
  rationale: Существительное обозначает охотничью сеть или ловушку. «Сеть» сохраняет конкретный образ и не сужает его до одного вида западни.
- source_word: עָלַי הִקִּיף
  choice: окружил меня
  rationale: Каузативная форма глагола передаёт окружение или охватывание; творительный падеж «сетью» естественно выражает средство или образ этого окружения в русском языке.
theological_decisions:
- issue: Прямое обвинение Бога Иовом
  choice: Сохранено утверждение, что Бог «поступил со мной несправедливо».
  alternative: «Бог поразил меня» или «Бог обратился против меня».
  rationale: Еврейский глагол имеет сильный нравственно-судебный оттенок искажения правды или причинения несправедливости. Смягчение устранило бы напряжение, намеренно присутствующее в речи Иова. Перевод передаёт его оценку, не представляя её как нормативное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с прямой, выразительной синтаксической формой. Резкость жалобы Иова сохранена без архаизации и богословского смягчения. Местоимение «Своей» написано с прописной буквы как традиционный знак почтения при указании на Бога.
