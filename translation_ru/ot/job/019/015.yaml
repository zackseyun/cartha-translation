lexical_decisions:
- source_word: גָּרֵי בֵיתִי
  choice: живущие в моём доме
  rationale: גָּר может обозначать пришельца, временного жильца или гостя. Контекст указывает на людей, проживающих в доме Иова; нейтральная формулировка сохраняет широту значения и естественно звучит по-русски.
- source_word: אַמְהֹתַי
  choice: мои служанки
  rationale: Слово обозначает женщин-служанок или рабынь; «служанки» передаёт домашний контекст без ненужного усиления социально-правового оттенка.
- source_word: לְזָר תַּחְשְׁבֻנִי
  choice: считают меня чужим
  rationale: 'Передано прямое значение конструкции: они воспринимают Иова как чужого, не принадлежащего к своему кругу.'
- source_word: נָכְרִי
  choice: посторонним
  rationale: В параллельной строке употреблено слово со значением «чужеземец, незнакомец, чужой». «Посторонним» сохраняет смысловое усиление и позволяет избежать стилистически тяжёлого повтора слова «чужой».
