source:
  edition: WLC
  text: אִם אַ֭תָּה תְּשַׁחֵ֣ר אֶל אֵ֑ל וְ/אֶל שַׁ֝דַּ֗י תִּתְחַנָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/005.yaml
  text: But if you seek God earnestly[a], and plead for favor from the Almighty[b],
translation:
  language: ru
  text: Но если ты будешь усердно искать Бога[a] и молить Всемогущего[b] о милости,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будешь искать Бога с раннего утра»; древнееврейский глагол допускает такой временной оттенок, хотя здесь, вероятнее всего, говорится об усердном поиске Бога.'
    reason: lexical_alternative
  - marker: b
    text: Евр. «Шаддай»; традиционный перевод — «Всемогущий».
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Но если
  rationale: Частица вводит условное придаточное; союз «но» естественно передаёт смысловой контраст с предыдущим стихом.
- source_word: אַתָּה
  choice: ты
  rationale: Явное местоимение второго лица мужского рода единственного числа сохранено, поскольку в еврейском оно имеет смысловое ударение.
- source_word: תְּשַׁחֵר
  choice: будешь усердно искать
  rationale: Порода пиэль глагола שׁחר может означать «искать с раннего утра» либо, идиоматически, «искать усердно, ревностно». В данном молитвенном контексте второе значение наиболее естественно, а временной оттенок отмечен в сноске.
- source_word: אֶל אֵל
  choice: Бога
  rationale: Предлог направления естественно включён в русское управление глагола «искать»; אֵל передано обычным обозначением «Бог».
- source_word: וְאֶל שַׁדַּי
  choice: и Всемогущего
  rationale: Союз связывает параллельные части условия; предлог אֶל в сочетании с глаголом мольбы естественно передаётся русским управлением без отдельного эквивалента.
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Традиционная смысловая передача древнееврейского божественного титула; исходная форма «Шаддай» сохранена в сноске.
- source_word: תִּתְחַנָּן
  choice: молить … о милости
  rationale: Хитпаэль от חנן обозначает настойчивую мольбу о благоволении или милости; выбранная формулировка сохраняет этот оттенок и звучит естественно по-русски.
theological_decisions:
- issue: Передача божественного титула שַׁדַּי
  choice: Всемогущий
  alternative: Шаддай
  rationale: Смысловой перевод делает титул понятным современному читателю, не вводя конфессиональной трактовки; транслитерация приведена как допустимая альтернатива.
- issue: Содержание просьбы в תִּתְחַנָּן
  choice: молить … о милости
  alternative: умолять; искать благоволения
  rationale: Формулировка передаёт просьбу о незаслуженном благоволении, но не уточняет её предмет и не устраняет присущую глаголу смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм двух частей сохранён; запятая в конце показывает, что условное предложение продолжается в следующем стихе.
