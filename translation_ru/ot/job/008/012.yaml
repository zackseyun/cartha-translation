  - marker: b
    text: 'Или: «не сорван».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹדֶנּוּ
  choice: Пока он ещё
  rationale: Наречие с местоименным суффиксом выражает продолжающееся состояние растения; временная конструкция «пока он ещё» естественно передаёт этот смысл по-русски.
- source_word: בְאִבּוֹ
  choice: зеленеет
  rationale: Существительное אֵב/אִב обозначает свежий рост, молодой побег или зелень. Глагольная передача «зеленеет» звучит естественно и сохраняет образ живого, свежего растения.
- source_word: לֹא יִקָּטֵף
  choice: не срезан
  rationale: Форма глагола קטף допускает значения «быть срезанным» и «быть сорванным». В отношении болотного растения «не срезан» ясно передаёт пассивное значение.
- source_word: וְלִפְנֵי
  choice: раньше
  rationale: Сочетание союза с предлогом выражает временное сравнение; «раньше» естественно передаёт, что растение засыхает прежде травы.
- source_word: כָל חָצִיר
  choice: любой другой травы
  rationale: В сравнительной конструкции речь идёт о том, что данное растение засыхает раньше обычной травы. Слово «другой» делает сравнение явным, не меняя его смысла.
- source_word: יִיבָשׁ
  choice: он засыхает
  rationale: Глагол יבש означает «высыхать, засыхать». «Засыхает» точно и естественно описывает гибель растения из-за отсутствия воды.
