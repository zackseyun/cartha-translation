  yaml_path: translation/ot/job/008/012.yaml
  text: While it is still in its shoot[a], not cut down[b], it dries up before any other grass.
translation:
  language: ru
  text: Пока он ещё зелен[a] и не срезан[b], он засыхает раньше любой другой травы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей свежести» или «в молодом побеге». Еврейское слово обозначает свежую молодую поросль или зелень.'
