source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל שֹׁ֣כְחֵי אֵ֑ל וְ/תִקְוַ֖ת חָנֵ֣ף תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/013.yaml
  text: So are the paths of all who forget God[a], and the hope of the godless will perish.
translation:
  language: ru
  text: Таковы пути всех, кто забывает Бога, и надежда безбожного погибнет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечестивого»; традиционно также переводится как «лицемера». Еврейское слово обозначает человека нечестивого, непочтительного к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Таковы
  rationale: Слово подводит сравнительный итог предшествующему образу; «таковы» естественно согласуется с множественным «пути» и сохраняет выводный характер фразы.
- source_word: אָרְחוֹת
  choice: пути
  rationale: Сохраняет конкретную метафору жизненного пути и соответствует форме множественного числа.
- source_word: שֹׁכְחֵי אֵל
  choice: всех, кто забывает Бога
  rationale: Причастная конструкция естественно передана относительным оборотом; אֵל здесь является общеупотребительным обозначением Бога, а не именем, требующим транслитерации.
- source_word: תִקְוַת
  choice: надежда
  rationale: Передаёт обычное значение существительного и хорошо подходит контексту литературы мудрости.
- source_word: חָנֵף
  choice: безбожного
  rationale: В книге Иова слово обозначает прежде всего нечестивого, непочтительного к Богу человека, а не только лицемера; «безбожный» сохраняет широкий религиозно-нравственный смысл.
- source_word: תֹּאבֵד
  choice: погибнет
  rationale: Глагол אבד выражает гибель или исчезновение; «погибнет» сохраняет весомость судебного высказывания.
theological_decisions:
- issue: Передача חָנֵף в контексте суда литературы мудрости
  choice: безбожного
  alternative: лицемера; нечестивого
  rationale: «Лицемер» чрезмерно сужает значение до притворства. «Безбожный» передаёт более широкий смысл непочтительности и отчуждения от Бога, не вводя специальной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Синтаксический параллелизм и метафора путей сохранены; лексика понятна широкому читателю.
