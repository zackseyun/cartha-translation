base_translation:
  language: en
  yaml_path: translation/ot/job/008/006.yaml
  text: If you are pure and upright[c][b][a], surely even now he will rouse himself for you and restore your righteous dwelling.
translation:
  language: ru
  text: Если ты чист и праведен, то он уже теперь пробудится ради тебя[a] и восстановит[b] твой праведный дом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пробудится для тебя»; «поднимется, чтобы вступиться за тебя».'
