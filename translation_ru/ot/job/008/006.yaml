  - marker: b
    text: 'Или: «сделает целым»; «воздаст». Еврейский глагол может означать восстановление целостности или воздаяние.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «жилище твоей праведности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Обычная условная частица, вводящая условие в утверждении Вилдада.
- source_word: זַךְ
  choice: чист
  rationale: Передаёт нравственную чистоту, не усиливая смысл до формально-юридической невиновности.
- source_word: יָשָׁר
  choice: прямодушен
  rationale: Естественно передаёт в данном контексте нравственную прямоту и сочетается с кратким прилагательным «чист».
- source_word: כִּי עַתָּה
  choice: то уже теперь
  rationale: В аподосисе כִּי имеет усилительно-утвердительный оттенок, а עַתָּה подчёркивает непосредственность действия.
- source_word: יָעִיר עָלֶיךָ
  choice: Он пробудится ради тебя
  rationale: Сохраняет метафору пробуждения и значение действия в чью-либо пользу; заглавная буква ясно указывает на Бога из контекста, не добавляя Его имени.
- source_word: וְשִׁלַּם
  choice: и восстановит
  rationale: Пиэль от שׁלם допускает значения «сделать целым», «возместить», «восстановить»; при объекте «жилище» последнее наиболее естественно.
- source_word: נְוַת צִדְקֶךָ
  choice: жилище твоей праведности
  rationale: Сохраняет конструктивную связь и её подлинную неоднозначность вместо сведения выражения только к характеристике жилища.
theological_decisions:
- issue: Не названный явно субъект глаголов
  choice: Местоименный субъект передан как «Он», контекстуально указывая на Бога, без вставки имени «Бог».
  alternative: Явно добавить «Бог».
  rationale: В еврейском субъект выражен формой глагола и определяется контекстом; перевод не должен вводить отсутствующее существительное.
- issue: Статус воззрения Вилдада
  choice: Условное утверждение передано прямо как слова персонажа.
  alternative: Смягчить или дистанцировать формулировку, чтобы не создавать впечатления одобрения богословия воздаяния.
  rationale: Перевод должен точно представлять речь Вилдада, не подтверждая и не опровергая её от лица повествователя.
- issue: Значение נְוַת צִדְקֶךָ
  choice: Сохранено буквальное «жилище твоей праведности».
  alternative: «Твоё праведное жилище» или «жилище, подобающее твоей праведности».
  rationale: Конструкция может характеризовать жилище, связывать его с праведностью Иова либо подразумевать подобающее праведнику благополучие; буквальная формулировка сохраняет напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Прямодушен» выбрано вместо менее естественного предикативного «праведен» ради различения זַךְ и יָשָׁר. Буквальная конструкция «жилище твоей праведности» намеренно сохраняет смысловую неоднозначность исходного текста; все сноски отмечены в основном тексте.
