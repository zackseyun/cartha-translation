  text: For please ask the former generation[b][a], and consider the findings of their fathers.
translation:
  language: ru
  text: Ибо расспроси, пожалуйста, прежнее поколение и вникни в изыскания их отцов.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в исследование их отцов» или «в то, что нашли их отцы». Еврейское слово может обозначать как сам поиск, так и то, что было найдено в результате.'
    reason: lexical_alternative
  - marker: b
    text: '«Их отцы» можно понимать шире: «их предки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей мысли; «ибо» естественно передаёт эту связь в достойном литературном регистре.
- source_word: שְׁאַל נָא
  choice: спроси, пожалуйста
  rationale: Императив שׁאל означает «спроси, расспроси», а נָא смягчает побуждение и выражает просьбу, а не время.
- source_word: לְדֹר רִישׁוֹן
  choice: у прежнего поколения
  rationale: רִאשׁוֹן здесь указывает на более раннее, прежнее поколение, а не обязательно на самое первое поколение человечества.
- source_word: וְכוֹנֵן
  choice: и вникни
  rationale: Форма от כון призывает направить и сосредоточить внимание; «вникни» естественно выражает внимательное обращение к предмету исследования.
- source_word: לְחֵקֶר
  choice: в то, что исследовали
  rationale: חֵקֶר может обозначать как исследование, так и добытое исследованием знание. Формулировка сохраняет связь с процессом поиска и допускает подразумеваемый результат.
- source_word: אֲבוֹתָם
  choice: их отцы
  rationale: Суффикс относится к прежнему поколению. «Их отцы» сохраняет конкретную родовую образность еврейского текста; по смыслу речь может идти шире о предках.
