- source_word: הֲלֹא
  choice: Разве ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: הֵם
  choice: они
  rationale: Местоимение отсылает к прежним поколениям, упомянутым в предшествующем контексте.
- source_word: יוֹרוּךָ
