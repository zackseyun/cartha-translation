  rationale: Hiphil глагола ירה здесь означает «учить, наставлять»; «наставят» соответствует контексту мудрости и сохраняет возвышенный, но современный регистр.
- source_word: יֹאמְרוּ לָךְ
  choice: скажут тебе
  rationale: Прямо передаёт обычное значение אמר и сохраняет его отличие от предшествующего глагола наставления.
- source_word: וּמִלִּבָּם
  choice: от сердца
  rationale: Сохраняет еврейский образ сердца как внутреннего средоточия мысли, понимания и чувства, не сводя его лишь к эмоциям.
- source_word: יוֹצִיאוּ
  choice: изрекут
  rationale: В контексте слов естественно передаёт каузативный образ «вывести наружу, произнести», сохраняя торжественность речи предков без буквального русского оборота «выведут слова».
- source_word: מִלִּים
  choice: слова
  rationale: Прямой и естественный эквивалент, подходящий для контекста наставительной речи.
