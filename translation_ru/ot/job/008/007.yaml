  revision_rationale: Исправление устраняет неестественное и потенциально вводящее в заблуждение «конец твой», сохраняя поэтическое противопоставление малого начала и великого последующего состояния. «Возвысишься» передаёт глагол возрастания в естественной русской конструкции; сноска сохраняет более буквальный образ «последнего исхода» и вариант «будущее».
