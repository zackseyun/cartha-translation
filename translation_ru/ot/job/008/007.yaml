  text: Though your beginning was small[a], your latter end will increase greatly.
translation:
  language: ru
  text: Хотя начало твоё было малым, впоследствии ты весьма возвысишься.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…будущее твоё станет весьма великим»; буквально: «твой последний исход весьма возрастёт».'
    reason: אַחֲרִית может обозначать будущее, последующее состояние или итог; יִשְׂגֶּה — «возрастёт, станет великим».
lexical_decisions:
- source_word: וְהָיָה
  choice: Хотя ... было
  rationale: 'Сочетание союза וְ с формой היה буквально допускает «и было», однако в данном поэтическом противопоставлении естественно передать уступительный смысл: малое начало противопоставлено великому будущему исходу.'
- source_word: רֵאשִׁיתְךָ
  choice: начало твоё
  rationale: רֵאשִׁית обозначает начало, первую часть или первоначальное состояние; «начало твоё» прямо передаёт смысл и сохраняет поэтическую параллель.
- source_word: מִצְעָר
  choice: мало
  rationale: Слово выражает малость или незначительность. Краткая предикативная форма «было мало» естественна по-русски и соответствует противопоставлению последующему величию.
- source_word: אַחֲרִיתְךָ
  choice: конец твой
  rationale: אַחֲרִית может означать конец, исход или будущее. «Конец твой» сохраняет направленность к окончательному состоянию, не сводя значение просто к будущему времени.
- source_word: יִשְׂגֶּה
  choice: станет ... великим
  rationale: Глагол выражает возрастание или становление великим. В сочетании с подлежащим «конец» конструкция «станет великим» звучит естественнее, чем буквальное «возрастёт».
- source_word: מְאֹד
  choice: весьма
  rationale: מְאֹד служит сильным усилителем; «весьма» сохраняет его степень и соответствует достоинству поэтической речи.
