    issue: «Конец твой» в основном тексте
    rationale: В современном русском это обычно означает смерть, гибель или завершение жизни. Еврейское אַחֲרִית здесь относится к последующему положению/итогу Иова, а не обязательно к его смерти.
  - severity: low
    issue: «Начало твоё было мало»
    rationale: 'Предикативное «мало» возможно, но с отвлечённым существительным «начало» современнее и плавнее употребить творительный падеж: «было малым».'
  - severity: low
    issue: Формулировка сноски
    rationale: 'Вариант «И хотя...» не является существенной лексической альтернативой: уступительное «хотя» уже стоит в основном тексте. Полезнее пояснить диапазон значения אַחֲרִית.'
  revised_text: Хотя начало твоё было малым, впоследствии ты весьма возвысишься.[a]
