lexical_decisions:
- source_word: שֹׂנְאֶיךָ
  choice: ненавидящие тебя
  rationale: Причастие qal во множественном числе с суффиксом 2-го лица мужского рода единственного числа употреблено субстантивно. Такой перевод естественен по-русски и сохраняет личное дополнение «тебя».
- source_word: יִלְבְּשׁוּ
  choice: облекутся
  rationale: Глагол לבשׁ означает «надевать, носить». «Облекутся» сохраняет образ одежды и естественно сочетается с отвлечённым существительным «позор».
- source_word: בֹשֶׁת
  choice: позором
  rationale: בֹשֶׁת обозначает стыд и бесчестье. «Позор» здесь передаёт прежде всего явное унижение, которому уподобляется одежда.
- source_word: וְאֹהֶל
  choice: а шатра
  rationale: אֹהֶל буквально означает «шатёр» и может метонимически указывать на дом или семейство. Сохранён конкретный поэтический образ; союз передан как «а», поскольку вторая строка сопоставляет участь нечестивых с обещанным благополучием праведного.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе обозначает нечестивых людей как группу. Традиционное русское слово точно передаёт нравственно-религиозную оценку и уместно в литературном библейском тексте.
- source_word: אֵינֶנּוּ
  choice: больше не будет
  rationale: 'Форма представляет собой отрицание существования с местоименным суффиксом: буквально «его нет». Будущее выражение в русском согласуется с направленностью контекста на предстоящий исход, а «больше» передаёт прекращение существования.'
theological_decisions:
- issue: Временное значение заключительной части стиха
  choice: 'будущее/результативное: «шатра нечестивых больше не будет»'
  alternative: 'настоящее: «шатра нечестивых нет»'
  rationale: В Иов 8:20–22 Вилдад говорит об ожидаемом восстановлении праведного и исходе для его противников. Будущее время естественно передаёт ход мысли, тогда как сноска сохраняет формально настоящее древнееврейское отрицание существования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Облекутся позором» сохраняет метафору одежды, а «шатёр» — конкретный образ древнееврейского текста. Сноска поставлена при заключительной части стиха, к которой относится её содержание.
