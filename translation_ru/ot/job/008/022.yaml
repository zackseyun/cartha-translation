  text: Those who hate you will be clothed with shame[a], and the tent of the wicked will be no more.
translation:
  language: ru
  text: Ненавидящие тебя облекутся позором, и шатра нечестивых больше не будет.[a]
  philosophy: optimal-equivalence
  footnotes:
