  terminology: «Согрешили» и «преступление» удачно различают חטא и פשע. Прописные «Него» и «Он» соответствуют ясно подразумеваемому в контексте Богу, при этом само местоимение, а не имя, сохранено. Сноска корректно фиксирует буквальный образ и альтернативу.
