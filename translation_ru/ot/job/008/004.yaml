  source_fidelity: «Если» точно сохраняет условный характер אִם. «Твои сыновья» передаёт мужское множественное בָּנֶיךָ; «согрешили против Него» естественно воспроизводит חָטְאוּ לוֹ. «Он отдал их во власть их преступления» адекватно передаёт וַיְשַׁלְּחֵם בְּיַד פִּשְׁעָם как идиому передачи во власть собственного мятежного проступка, не сводя её к прямому утверждению о конкретном виде кары.
