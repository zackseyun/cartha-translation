base_translation:
  language: en
  yaml_path: translation/ot/job/008/004.yaml
  text: If your sons sinned against him[a], he gave them over into the hand of their transgression.
translation:
  language: ru
  text: Если твои сыновья согрешили против Него, Он отдал их во власть их преступления.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «послал их в руку их преступления»; «в руку» — еврейский оборот со значением «во власть». Возможный перевод: «предал их в руки их преступления».'
    reason: Сохраняет буквальный образ исходного текста и указывает допустимую лексическую альтернативу.
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет обычное условное значение частицы и не превращает предположение Вилдада в прямо утверждаемую причину.
- source_word: בָּנֶיךָ
  choice: твои сыновья
  rationale: Передаёт мужской род и множественное число исходного существительного, не заменяя его более общим словом «дети».
- source_word: חָטְאוּ
  choice: согрешили
  rationale: Естественно передаёт совершённое действие и обычное значение глагола חטא.
- source_word: לוֹ
  choice: против Него
  rationale: При глаголе חטא предлог указывает на того, против кого был совершён грех; местоимение сохранено, а его контекстуальный референт — Бог.
- source_word: וַיְשַׁלְּחֵם
  choice: Он отдал их
  rationale: В сочетании с оборотом «в руку» глагол выражает передачу под чью-либо власть; «отдал» естественно передаёт этот смысл по-русски.
- source_word: בְּיַד
  choice: во власть
  rationale: Передаёт смысл еврейской идиомы «в руку», обозначающей власть или господство, а буквальный образ отмечен в сноске.
- source_word: פִּשְׁעָם
  choice: их преступления
  rationale: «Преступление» сохраняет оттенок сознательного нарушения в פשע и отличает это слово от более общего חטא — «согрешили».
theological_decisions:
- issue: К кому относится местоимение в выражении «согрешили против Него»
  choice: Местоимение сохранено; по контексту оно относится к Богу.
  alternative: 'Прямо назвать Бога: «согрешили против Бога».'
  rationale: Контекст речи Вилдада ясно указывает на Бога, но сохранение местоимения точнее воспроизводит форму еврейского текста и не устраняет его формальную неявность.
- issue: Характер связи между поступком сыновей и их участью
  choice: «Он отдал их во власть их преступления»
  alternative: «Он покарал их за их преступление».
  rationale: Исходный текст образно говорит о передаче их во власть собственного преступления. Перевод не сводит эту формулировку к более определённому богословскому утверждению о наказании и сохраняет напряжение между Божьим действием и последствиями их поступка.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная по тону. Прописные буквы в местоимениях «Него» и «Он» помогают русскому читателю распознать Бога как контекстуального референта, не заменяя местоимение явным именованием.
