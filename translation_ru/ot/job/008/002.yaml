  text: עַד אָ֥ן תְּמַלֶּל אֵ֑לֶּה וְ/ר֥וּחַ כַּ֝בִּיר אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/002.yaml
  text: How long will you keep saying these things[a], and the words of your mouth be a mighty wind?
translation:
  language: ru
  text: Долго ли ты будешь говорить такое[a], и слова твоих уст будут могучим ветром?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «До каких пор ты будешь произносить это, а слова твоих уст будут сильным ветром?»'
    reason: Лексико-стилистический вариант, сохраняющий более буквальные соответствия תְּמַלֶּל и כַּבִּיר.
lexical_decisions:
- source_word: עַד אָן
  choice: Долго ли
  rationale: Естественное русское вопросительное выражение передаёт значение «до каких пор?» и нетерпеливый тон упрёка.
- source_word: תְּמַלֶּל
  choice: ты будешь говорить
  rationale: Передаёт продолжающуюся речь; в сочетании с «долго ли» длительность уже выражена и не требует добавления «продолжать».
- source_word: אֵלֶּה
  choice: такое
  rationale: Указывает на предшествующие высказывания Иова, не дублируя слово «слова» во второй строке; множественная отсылка исходного текста по-русски естественно выражается собирательным «такое».
- source_word: וְרוּחַ כַּבִּיר
  choice: и ... будут могучим ветром
  rationale: Сохраняет буквальный яркий образ ветра и значение силы в כַּבִּיר, не истолковывая метафору как пустословие или хвастовство.
- source_word: אִמְרֵי פִיךָ
  choice: слова твоих уст
  rationale: Формально-поэтическая конструкция сохраняет конкретность еврейского сочетания и уместна для возвышенного регистра книги Иова.
