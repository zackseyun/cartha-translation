translation:
  language: ru
  text: Надежда его оборвётся[a], и доверие его — дом паука[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его уверенность будет отсечена». Еврейское существительное может означать надежду, уверенность или безопасность; редкий и спорный глагол допускает также значение «быть отсечённым».'
    reason: lexical_alternative
  - marker: b
    text: То есть то, на что он полагается, непрочно, как жилище паука; образ может подразумевать паутину, но буквально в еврейском тексте сказано «дом паука».
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: его
  rationale: Относительная частица связывает стих с человеком, описанным в предыдущем контексте; по-русски естественнее продолжить мысль самостоятельным предложением с притяжательным местоимением.
- source_word: יָקוֹט
  choice: оборвётся
  rationale: Редкий и спорный глагол здесь, вероятнее всего, выражает прекращение или крушение надежды; «оборвётся» сохраняет образ резкого прекращения и не превращает метафору в пояснение.
- source_word: כִּסְלוֹ
  choice: его надежда
  rationale: В параллели с מִבְטַחוֹ существительное обозначает надежду, уверенность или чувство безопасности; «надежда» естественно сочетается с глаголом «оборвётся».
- source_word: וּבֵית עַכָּבִישׁ
  choice: паучий дом
  rationale: Буквальный образ «дома паука» сохранён без замены на «паутину», чтобы не сужать метафору исходного текста.
- source_word: מִבְטַחוֹ
  choice: опорой ему
  rationale: Существительное может обозначать предмет или основание доверия. Предикативная конструкция «опорой ему будет» ясно передаёт, на что человек полагается, и сохраняет параллелизм.
