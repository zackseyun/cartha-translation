translation:
  language: ru
  text: Его корни переплетаются на груде камней; он видит дом из камней[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «он видит каменный дом» или «он смотрит на дом из камней». Буквально по-еврейски: «дом камней»; это выражение может обозначать как сложенное из камней строение, так и каменистое место.'
    reason: Сохраняет лексическую и синтаксическую неоднозначность выражения בֵּית אֲבָנִים יֶחֱזֶה, не добавляя к глаголу значения проникновения взглядом.
lexical_decisions:
- source_word: עַל גַּל
  choice: поверх груды камней
  rationale: Предлог עַל передаёт расположение корней на груде или над ней, а גַּל в данном окружении естественно понимать как груду камней. Слово «поверх» сохраняет образ корней, разрастающихся по камням.
- source_word: שָׁרָשָׁיו
  choice: его корни
  rationale: Сохранены множественное число, притяжательное значение и метафора человека как растения.
- source_word: יְסֻבָּכוּ
  choice: переплетаются
  rationale: Форма глагола выражает сплетённость или запутанность корней; настоящее время естественно для поэтического описания в этом контексте.
- source_word: בֵּית אֲבָנִים
  choice: дом из камней
  rationale: 'Буквально сочетание означает «дом камней». Основной текст сохраняет конкретный образ и не устраняет возможную неоднозначность: речь может идти о каменном строении либо о каменистом месте.'
- source_word: יֶחֱזֶה
  choice: он видит
  rationale: Глагол означает «видеть, созерцать». Прямое «видит» звучит естественно и сохраняет олицетворение растения в мужском роде.
