  text: Does papyrus grow where there is no marsh? Does reed grass flourish without water?[a]
translation:
  language: ru
  text: Разве вырастет папирус без болота? Разве разрастётся болотная трава без воды?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тростник» вместо «папирус» и «камыш» вместо «болотная трава»; в еврейском тексте параллельно названы два болотных растения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יִגְאֶה
  choice: Разве вырастет
  rationale: Вопросительная частица вводит риторический вопрос, а глагол גאה в ботаническом контексте означает рост растения.
- source_word: גֹּמֶא
  choice: папирус
  rationale: Слово обозначает папирус либо близкое к нему болотное растение; «папирус» передаёт наиболее вероятный конкретный референт.
- source_word: בְּ/לֹא בִצָּה
  choice: без болота
  rationale: Кратко и естественно передаёт отсутствие болотистой среды, необходимой растению.
- source_word: יִשְׂגֶּה
  choice: разрастётся
  rationale: Глагол выражает обильный, успешный рост и сохраняет параллелизм с первым полустишием.
- source_word: אָחוּ
  choice: болотная трава
  rationale: Точная ботаническая идентификация не вполне ясна; выражение естественно обозначает водно-болотную растительность и отличает её от папируса.
- source_word: בְלִי מָיִם
  choice: без воды
  rationale: Прямо и идиоматично передаёт лишительное выражение оригинала.
