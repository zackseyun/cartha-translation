  yaml_path: translation/ot/job/008/018.yaml
  text: If he is destroyed from his place[a], then it will deny him, saying[b], “I have not seen you.”
translation:
  language: ru
  text: 'Если его поглотят, так что он исчезнет со своего места[a], то оно отречётся от него[b]: «Я тебя не видело».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с его места». Еврейский суффикс мужского рода может относиться к растению в развёрнутом образе, хотя этот образ одновременно олицетворяет нечестивого человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «откажется его признавать»; возможен также смысл «поступит с ним лживо». Еврейский глагол может обозначать отрицание, непризнание или отречение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет условный характер поэтического высказывания, не превращая его в однозначно временное «когда».
- source_word: יְבַלְּעֶנּוּ
  choice: его поглотят
  rationale: Передаёт образное значение корня בלע — поглощение, уничтожение без следа. Неопределённо-личная русская конструкция не вводит в текст явно не названного деятеля.
- source_word: מִמְּקוֹמוֹ
  choice: так что он исчезнет со своего места
  rationale: Предлог מִן указывает на удаление с места. Добавленное связующее выражение делает сочетание с русским «поглотят» естественным, сохраняя смысл полного исчезновения с прежнего места.
- source_word: וְכִחֶשׁ בּוֹ
  choice: то оно отречётся от него
  rationale: Место персонифицировано и отказывается признавать прежнего обитателя. «Отречётся» передаёт отрицание или непризнание, не сводя глагол лишь к обычной лжи.
- source_word: לֹא רְאִיתִיךָ
  choice: Я тебя не видело
  rationale: Сохраняется конкретный образ видения и прямая речь; средний род местоименно не выражен, но форма «видело» согласуется со словом «место».
