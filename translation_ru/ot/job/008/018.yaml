translation_notes:
  register: Современный литературный русский язык с сохранением поэтического олицетворения места. Неопределённо-личное «поглотят» позволяет не называть субъекта, которого еврейский текст прямо не определяет; фраза «так что он исчезнет» естественно выражает удаление с места.
