source:
  edition: WLC
  text: עַד יְמַלֵּ֣ה שְׂח֣וֹק פִּ֑י/ךָ וּ/שְׂפָתֶ֥י/ךָ תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/021.yaml
  text: He will yet fill your mouth with laughter[a], and your lips with shouting.
translation:
  language: ru
  text: 'Он ещё наполнит смехом твои уста[a],

    а твои губы — громкими возгласами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в связи с предыдущим стихом: «пока Он не наполнит смехом твои уста, а твои губы — возгласами ликования».'
    reason: Лексема עַד может выражать временной предел («пока не», «до тех пор пока»), тогда как основной текст передаёт её контекстуальный смысл словом «ещё».
lexical_decisions:
- source_word: עַד
  choice: ещё
  rationale: В связи с обещанием предыдущего стиха передаёт мысль о предстоящем действии Бога и естественно звучит по-русски. Возможное временное значение «пока не» сохранено в сноске.
- source_word: יְמַלֵּה
  choice: Он наполнит
  rationale: Пиэль, имперфект, 3-е лицо мужского рода единственного числа. Будущее время соответствует обещанию; подразумеваемый субъект — Бог, названный в стихе 20.
- source_word: שְׂחוֹק
  choice: смехом
  rationale: Прямое значение существительного уместно в контексте восстановления и не заменяется более общим понятием радости.
- source_word: פִּיךָ
  choice: твои уста
  rationale: Сохраняет телесный поэтический образ и параллелизм; «уста» относится к современному литературному возвышенному регистру, подходящему библейской поэзии.
- source_word: וּשְׂפָתֶיךָ
  choice: а твои губы
  rationale: Буквально передаёт образ и с помощью «а» естественно оформляет русский поэтический параллелизм без противопоставления.
- source_word: תְרוּעָה
  choice: громкими возгласами
  rationale: Слово обозначает громкий крик или возглас, нередко радостный либо победный. Перевод сохраняет широту значения, не вводя явно военный или богослужебный оттенок.
theological_decisions:
- issue: Подразумеваемый субъект глагола
  choice: Личное «Он», относящееся к Богу из непосредственного контекста
  alternative: 'Безличная или пассивная формулировка: «твои уста наполнятся смехом»'
  rationale: В стихе 20 Бог назван действующим лицом, и стих 21 естественно продолжает эту мысль. Личное местоимение сохраняет указание на Бога как источник восстановления.
- issue: Связь עַד с предыдущим стихом
  choice: Самостоятельное обещание с наречием «ещё»
  alternative: 'Временная связь: «пока Он не наполнит…»'
  rationale: Оба понимания допустимы. Основной текст даёт естественную по-русски перспективу будущего обещания, а временное прочтение сохранено в сноске, чтобы не устранять синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой. Параллелизм «уста / губы» и образ наполнения сохранены; порядок слов сделан естественным для русского языка.
