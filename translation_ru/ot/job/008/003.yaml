  text: הַ֭/אֵל יְעַוֵּ֣ת מִשְׁפָּ֑ט וְ/אִם שַׁ֝דַּ֗י יְעַוֵּֽת צֶֽדֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/008/003.yaml
  text: Does God pervert justice[a], or does the Almighty pervert righteousness?
translation:
  language: ru
  text: Разве Бог извращает правосудие[a], или Всемогущий извращает справедливость?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве Бог искажает суд, или Всемогущий — правду?»'
    reason: Лексические диапазоны מִשְׁפָּט, צֶדֶק и יְעַוֵּת допускают более буквальную передачу «суд», «правда» и «искажает».
lexical_decisions:
- source_word: הַאֵל
  choice: Разве Бог
  rationale: Вопросительная частица הַ вводит риторический вопрос, а אֵל здесь служит общим обозначением Бога, а не именем собственным. «Разве» естественно передаёт ожидаемый отрицательный ответ.
- source_word: יְעַוֵּת
  choice: извращает
  rationale: Пиэль глагола עוה означает делать кривым, искажать; в судебно-нравственном контексте «извращает» передаёт сильный смысл сознательного нарушения справедливости.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: Слово обозначает суд и справедливое судебное решение. «Правосудие» ясно передаёт юридический смысл и сохраняет отличие от צֶדֶק во второй строке.
- source_word: וְאִם
  choice: или
  rationale: Буквально сочетание может означать «и если», но в паре параллельных риторических вопросов оно вводит второй, альтернативно сформулированный вопрос; по-русски естественно «или».
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Божественный титул שַׁדַּי переведён традиционным и понятным русским соответствием, а не транслитерирован.
- source_word: צֶדֶק
  choice: справедливость
  rationale: צֶדֶק обозначает правоту, праведность или справедливость. Здесь «справедливость» естественно сочетается с глаголом и сохраняет нравственно-судебный смысл, не сливаясь полностью с «правосудием».
theological_decisions:
- issue: Передача параллельных божественных титулов אֵל и שַׁדַּי
  choice: Бог … Всемогущий
  alternative: Эль … Шаддай
  rationale: В данном контексте это обозначения и титулы Бога, поэтому перевод раскрывает их смысл для современного читателя и не представляет их как два личных имени.
- issue: Различение מִשְׁפָּט и צֶדֶק
  choice: правосудие … справедливость
  alternative: суд … праведность
  rationale: 'Два близких, но не тождественных юридико-нравственных понятия сохранены разными словами: первое подчёркивает справедливый суд, второе — соответствие правде и справедливости.'
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Повтор глагола сохранён ради еврейского параллелизма и риторической силы; «разве» ясно указывает на ожидаемый отрицательный ответ.
