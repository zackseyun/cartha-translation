base_translation:
  language: en
  yaml_path: translation/ot/job/008/020.yaml
  text: Behold[a], God does not reject the blameless, nor does he uphold the hand of evildoers.
translation:
  language: ru
  text: 'Вот: Бог не отвергает непорочного

    и не поддерживает злодеев[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не подаёт руки злодеям»; более буквально: «не держит злодеев за руку».'
    reason: 'Лексико-идиоматическая неоднозначность глагола חזק с выражением בְּיַד: буквально Бог держит или берёт злодеев за руку; в контексте это означает оказывать им поддержку.'
lexical_decisions:
- source_word: הֶן
  choice: Вот
  rationale: Передаёт вводное эмфатическое указание и сохраняет возвышенный поэтический тон без излишне архаичного «се».
- source_word: אֵל
  choice: Бог
  rationale: Прямое соответствие обычному поэтическому наименованию Бога; значение «Всемогущий» в самом слове здесь не выражено.
- source_word: יִמְאַס
  choice: не отвергает
  rationale: Передаёт значение отказа и отвержения, не усиливая его до эмоционального «презирает».
- source_word: תָּם
  choice: непорочного
  rationale: Субстантивированное прилагательное обозначает человека без порока, цельного в нравственном отношении; мужской род и единственное число исходного текста сохранены.
- source_word: יַחֲזִיק בְּיַד
  choice: берёт за руку
  rationale: Сохраняет конкретный образ еврейского выражения и одновременно естественно подразумевает помощь или поддержку.
- source_word: מְרֵעִים
  choice: творящих зло
  rationale: Причастная форма подчёркивает совершаемое зло; этот вариант точнее сохраняет активный оттенок, чем обобщённое «нечестивые».
theological_decisions:
- issue: Смысл выражения וְלֹא יַחֲזִיק בְּיַד מְרֵעִים
  choice: Бог не берёт за руку творящих зло, то есть не оказывает им поддержки.
  alternative: Бог не поддерживает творящих зло; Бог не укрепляет руку творящих зло.
  rationale: Основной текст сохраняет телесный образ исходного выражения, не сводя его только к одному толкованию; примечание поясняет вероятный переносный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух строк сохранён; архаизм «се» не использован.
