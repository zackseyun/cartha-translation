lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Первое כִּי вводит обоснование предыдущего призыва Вилдада; «ведь» естественно передаёт пояснительно-причинную связь в русском языке.
- source_word: תְמוֹל אֲנַחְנוּ
  choice: мы — люди вчерашнего дня
  rationale: Еврейское сжатое именное выражение буквально связывает говорящих со «вчерашним днём» и подчёркивает недавность человеческого появления и ограниченность опыта. Добавление слова «люди» делает образ понятным по-русски, не устраняя метафору.
- source_word: וְלֹא נֵדָע
  choice: и ничего не знаем
  rationale: Отрицание при глаголе ידע передаёт отсутствие знания. В данном обобщающем контексте «ничего не знаем» звучит естественнее, сохраняя риторическую силу высказывания.
- source_word: כִּי
  choice: потому что
  rationale: Второе כִּי указывает основание человеческого незнания — краткость земной жизни. «Потому что» ясно передаёт эту логическую связь.
- source_word: צֵל
  choice: тень
  rationale: Сохранён поэтический образ тени, выражающий мимолётность и непрочность человеческой жизни.
- source_word: יָמֵינוּ
  choice: наши дни
  rationale: Прямо передаёт форму с местоименным суффиксом первого лица множественного числа.
- source_word: עֲלֵי אָרֶץ
  choice: на земле
  rationale: Естественный современный русский эквивалент, обозначающий земную область человеческой жизни.
