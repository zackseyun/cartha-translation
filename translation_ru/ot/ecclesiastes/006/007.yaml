lexical_decisions:
- source_word: כָּל עֲמַל
  choice: весь труд
  rationale: Передаёт совокупность человеческих усилий; слово «труд» сохраняет характерный для Екклесиаста оттенок тягостных усилий.
- source_word: הָאָדָם
  choice: человека
  rationale: В данном изречении слово употреблено обобщённо и относится к человеку как таковому, а не к определённому мужчине.
- source_word: לְפִיהוּ
  choice: ради его рта
  rationale: Сохраняет конкретный образ оригинала — труд ради того, что необходимо рту, то есть ради пропитания.
- source_word: וְגַם
  choice: но даже
  rationale: 'В контексте частица создаёт иронический контраст: хотя весь труд направлен на удовлетворение нужды, само желание остаётся ненасыщенным.'
- source_word: הַנֶּפֶשׁ
  choice: его желание
  rationale: Здесь נֶפֶשׁ обозначает, вероятнее всего, желание или аппетит в контексте рта и насыщения. «Желание» естественно по-русски и не навязывает противопоставления тела и души; буквальная альтернатива вынесена в сноску.
- source_word: לֹא תִמָּלֵא
  choice: не насыщается
  rationale: Сохраняет образ наполнения и одновременно естественно сочетается в русском языке со словом «желание».
theological_decisions:
- issue: Обобщённое значение הָאָדָם
  choice: человека
  alternative: мужчины
  rationale: Стих представляет общее наблюдение о человеческом труде; русское «человека» точно сохраняет обобщённый единственный род без неоправданного ограничения мужским полом.
- issue: Значение נֶפֶשׁ в контексте желания и насыщения
  choice: желание
  alternative: душа
  rationale: Контекст позволяет понимать נֶפֶשׁ как средоточие желания или аппетит. Основной текст передаёт контекстуальный смысл, а сноска сохраняет буквальную и богословски значимую возможность «душа», не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык; афористическая краткость и конкретный образ «рта» сохранены. Формулировка звучит достойно и понятно без архаизмов.
