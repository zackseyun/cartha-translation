source:
  edition: WLC
  text: אִ֣ישׁ אֲשֶׁ֣ר יִתֶּן ל֣/וֹ הָ/אֱלֹהִ֡ים עֹשֶׁר֩ וּ/נְכָסִ֨ים וְ/כָב֜וֹד וְֽ/אֵינֶ֨/נּוּ חָסֵ֥ר לְ/נַפְשׁ֣/וֹ מִ/כֹּ֣ל אֲשֶׁר יִתְאַוֶּ֗ה וְ/לֹֽא יַשְׁלִיטֶ֤/נּוּ הָֽ/אֱלֹהִים֙ לֶ/אֱכֹ֣ל מִמֶּ֔/נּוּ כִּ֛י אִ֥ישׁ נָכְרִ֖י יֹֽאכֲלֶ֑/נּוּ זֶ֥ה הֶ֛בֶל וָ/חֳלִ֥י רָ֖ע הֽוּא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/002.yaml
  text: There is a man to whom God gives riches[a], possessions, and honor, so that he lacks nothing for himself of all that he desires, yet God does not empower him to eat from them, because a foreign man eats them[c][b]. This is vanity and a grievous sickness.
translation:
  language: ru
  text: Бывает человек, которому Бог даёт богатство, имущество и почёт, и он не лишён ничего из того, чего желает. Но Бог не даёт ему возможности пользоваться всем этим[a], и пользуется этим чужеземец[b]. Это суета[c] и тяжкий недуг[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «есть от этого» — конкретный образ пользования имуществом и наслаждения его плодами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посторонний», «чужой человек». Буквально: «чужеземный человек».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское הֶבֶל может также означать «дуновение», «мимолётность» или «тщета»; это одно из ключевых слов книги Екклесиаста.
    reason: lexical_alternative
  - marker: d
    text: 'Или: «злая болезнь». Еврейское выражение сохраняет образ болезни или недуга.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Бывает человек, которому
  rationale: Передаёт эллиптическое начало еврейской фразы как обобщённое наблюдение мудрости и сохраняет единственное число.
- source_word: יִתֶּן לוֹ הָאֱלֹהִים
  choice: Бог даёт
  rationale: Настоящее время естественно выражает общее, повторяющееся положение, подразумеваемое имперфектом.
- source_word: עֹשֶׁר וּנְכָסִים וְכָבוֹד
  choice: богатство, имущество и почёт
  rationale: 'Сохраняет трёхчастное перечисление: материальное изобилие, конкретные владения и общественное уважение.'
- source_word: וְאֵינֶנּוּ חָסֵר לְנַפְשׁוֹ מִכֹּל אֲשֶׁר יִתְאַוֶּה
  choice: и он не лишён ничего из того, чего желает
  rationale: נפש здесь обозначает самого человека, а не отдельно понимаемую душу; формулировка сохраняет полноту обладания без неуместного антропологического уточнения.
- source_word: וְלֹא יַשְׁלִיטֶנּוּ הָאֱלֹהִים
  choice: Но Бог не даёт ему власти
  rationale: 'Передаёт каузативный оттенок שלט: Бог не наделяет человека властью или способностью распорядиться полученным благом.'
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: пользоваться всем этим
  rationale: В контексте имущества «есть от него» означает пользоваться благами и получать от них пользу; буквальный образ отмечен в сноске.
- source_word: אִישׁ נָכְרִי
  choice: чужой человек
  rationale: Сохраняет оба компонента выражения и допускает значение постороннего или чужеземца, не сужая его без необходимости.
- source_word: זֶה הֶבֶל
  choice: Это суета
  rationale: «Суета» — узнаваемая и ёмкая русская передача ключевого для Екклесиаста слова הבל, сочетающего оттенки мимолётности, тщетности и неуловимости.
- source_word: וָחֳלִי רָע
  choice: и тяжкий недуг
  rationale: Сохраняет конкретный образ болезни в חֳלִי; прилагательное «тяжкий» естественно передаёт оценочное רָע в данном сочетании.
theological_decisions:
- issue: Значение לְנַפְשׁוֹ
  choice: он не лишён ничего
  alternative: для души его нет недостатка
  rationale: נפש в данном контексте означает самого человека; перевод не вводит искусственного противопоставления души и тела.
- issue: Действие Бога в וְלֹא יַשְׁלִיטֶנּוּ
  choice: Бог не даёт ему власти
  alternative: Бог не позволяет ему
  rationale: 'Выбранная формулировка сохраняет сильный каузативный смысл: речь не только о разрешении, но и о дарованной способности или власти пользоваться благом.'
- issue: Кто такой אִישׁ נָכְרִי
  choice: чужой человек
  alternative: чужеземец
  rationale: Еврейское выражение может указывать как на иноземца, так и шире на постороннего; перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной речи. Синтаксис сделан естественным для широкого читателя; ключевые образы и смысловые неоднозначности еврейского текста сохранены в основном тексте либо обозначены в сносках.
