  yaml_path: translation/ot/ecclesiastes/006/005.yaml
  text: Though it has not seen the sun or known anything[b][a], it has more rest than that man.
translation:
  language: ru
  text: Хотя оно не видело солнца[a] и ничего не знало, всё же у него больше покоя, чем у того человека.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Видеть солнце» — еврейский образ, означающий жить и переживать земную жизнь.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «у этого больше покоя, чем у того». «Это» относится к мертворождённому ребёнку, а «то» — к человеку, описанному в предыдущих стихах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Хотя … всё же
  rationale: 'В данном контексте частица вводит дополнительное обстоятельство с уступительным оттенком: несмотря на отсутствие жизненного опыта, мертворождённое дитя имеет больше покоя.'
- source_word: שֶׁמֶשׁ לֹא רָאָה
  choice: не видело солнца
  rationale: Сохранён конкретный еврейский образ; в контексте Екклесиаста он означает не испытать земной жизни.
- source_word: וְלֹא יָדָע
  choice: и ничего не знало
  rationale: У глагола יָדַע объект не выражен. «Ничего не знало» естественно передаёт общее отсутствие сознательного жизненного опыта, не уточняя его содержание.
- source_word: נַחַת
  choice: покоя
  rationale: Слово обозначает покой, безмятежность, отсутствие тревог; «покой» ясно и естественно передаёт противопоставление беспокойной участи человека.
- source_word: לָזֶה מִזֶּה
  choice: у него больше …, чем у того человека
  rationale: Сравнительная конструкция буквально сопоставляет «это» и «то». Местоимение и существительное проясняют контекстуальные референты, сохраняя само сравнение.
theological_decisions:
- issue: Оценка участи мертворождённого ребёнка
  choice: Передать только сравнительное утверждение о большем покое
  alternative: Истолковать стих как прямое учение о посмертном состоянии
  rationale: Текст сравнивает покой мертворождённого дитяти с участью человека из предыдущих стихов, но не объясняет природу этого покоя и не даёт оснований уточнять посмертное состояние.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и сдержанная. Местоимение среднего рода связывает стих с мертворождённым дитятей из предыдущего контекста; образ «видеть солнце» сохранён.
