  text: Ибо какое преимущество у мудрого перед глупцом? Какое преимущество у бедняка, который знает, как вести себя среди живых?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который знает, как ходить перед живыми». «Ходить» может обозначать образ жизни или поведение; «перед живыми» — в присутствии живых людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующей мысли; «ибо» сохраняет рассуждающий характер текста и уместен в современном литературном русском.
- source_word: מַה יּוֹתֵר
  choice: какое преимущество
  rationale: Выражение обозначает выгоду, превосходство или преимущество и связано с повторяющейся в книге темой пользы.
- source_word: לֶחָכָם מִן הַכְּסִיל
  choice: у мудрого перед глупцом
  rationale: Субстантивированные формы переданы естественно по-русски, а сравнительное מן — оборотом «перед».
- source_word: מַה לֶּעָנִי
  choice: что есть у бедняка
  rationale: 'Сохраняет краткость и формальную неоднозначность второй части: подразумеваемым может быть преимущество или иное достояние, но в основном тексте это не уточняется.'
- source_word: עָנִי
  choice: бедняк
  rationale: В контексте наиболее вероятно социально-экономическое значение; русское слово сохраняет единственное число и мужской род.
- source_word: יוֹדֵעַ לַהֲלֹךְ
  choice: умеет держаться
  rationale: יוֹדֵעַ с инфинитивом может означать практическое умение, а הלך здесь, вероятно, идиоматически относится к поведению; «умеет держаться» естественно выражает оба элемента.
- source_word: נֶגֶד הַחַיִּים
  choice: среди живых
  rationale: Фраза буквально указывает на нахождение перед живыми или в их присутствии; «среди живых» естественно передаёт общественное окружение, не сводя выражение к одному узкому толкованию.
theological_decisions:
- issue: Подразумеваемое значение во втором вопросе
  choice: Не добавлять слово «преимущество» в основной текст
  alternative: «Какое преимущество у бедняка, который умеет держаться среди живых?»
  rationale: 'Еврейская формулировка эллиптична: параллелизм позволяет подразумевать «преимущество», но прямо это слово во второй части не повторено. Перевод сохраняет напряжение и краткость оригинала.'
