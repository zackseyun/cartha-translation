base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/004.yaml
  text: For he comes in vanity and goes in darkness[b][a], and in darkness his name is covered.
translation:
  language: ru
  text: Ибо он приходит в тщете[a], уходит во тьме, и тьма покрывает его имя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в суете», «в пустоте». Еврейское слово הֶבֶל — ключевое для книги Екклесиаста; оно может выражать мимолётность, пустоту или тщетность.'
    reason: lexical_alternative
  - marker: b
    text: То, что тьма покрывает имя, может означать безвестность личности этого человека или исчезновение памяти о нём.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит объяснение предыдущего утверждения и сохраняет причинно-пояснительную связь.
- source_word: הֶבֶל
  choice: мимолётное дуновение
  rationale: Ключевое для Екклесиаста слово обозначает дыхание или пар и развивает значения мимолётности, пустоты и тщетности. Образное выражение по-русски естественнее буквального «в суете» в сочетании с глаголом «приходит».
- source_word: בָּא
  choice: приходит
  rationale: Настоящее время передаёт обобщённое описание и образует естественную пару с «уходит».
- source_word: חֹשֶׁךְ
  choice: тьма
  rationale: Сохранены повтор и образность еврейского текста; слово может обозначать как тьму, так и безвестность.
- source_word: יֵלֵךְ
  choice: уходит
  rationale: Передаёт отбытие из жизни, не делая подразумеваемую смерть явной вопреки сдержанности оригинала.
- source_word: שְׁמוֹ
  choice: его имя
  rationale: Сохранён буквальный образ имени, который в контексте может подразумевать личность или память о человеке.
- source_word: יְכֻסֶּה
  choice: покрывается
  rationale: Возвратно-страдательная форма естественно передаёт пассив оригинала и сохраняет образ покрывания, не сужая его до «забывается».
theological_decisions:
- issue: Смысл образов тьмы и покрытого имени
  choice: Сохранить образный язык без прямого истолкования как смерти или забвения.
  alternative: 'Перевести явно: «умирает, и о нём забывают».'
  rationale: Оригинал допускает связь с уходом из жизни, безвестностью и отсутствием памяти, но не формулирует это однозначно.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического повтора «тьма — тьмой». Формулировка dignified и понятна широкому читателю; смысловая неоднозначность הֶבֶל и образа покрытого имени отмечена в сносках.
