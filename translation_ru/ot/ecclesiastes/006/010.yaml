base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/010.yaml
  text: Whatever has come to be has already been named[a], and it is known what man is[b]; and he cannot contend with one stronger than he.
translation:
  language: ru
  text: Всё, что возникло, уже получило имя, и известно, что такое человек[a]; он не может спорить с тем, кто сильнее его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «человек» употреблено здесь в единственном числе как обозначение человечества в целом.
    reason: lexical_alternative
  - marker: b
    text: Вероятнее всего, имеется в виду Бог, однако еврейский текст прямо Его не называет.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Всё, что существует
  rationale: Оборот обобщает всё существующее или возникшее. Настоящее время по-русски естественно передаёт широкий смысл, не ограничивая фразу только прошлым.
- source_word: כְּבָר
  choice: уже
  rationale: Кратко передаёт мысль о предшествующем установлении или определении.
- source_word: נִקְרָא שְׁמוֹ
  choice: уже названо
  rationale: Сохраняет образ наречения имени и естественно передаёт еврейскую пассивную конструкцию.
- source_word: וְנוֹדָע אֲשֶׁר הוּא אָדָם
  choice: и известно, что такое человек
  rationale: Передаёт установленное знание о природе и положении человека; по-русски звучит естественнее буквального «известно, что он человек».
- source_word: אָדָם
  choice: человек
  rationale: Единственное число здесь имеет собирательно-представительный смысл и обозначает человечество в лице человека.
- source_word: וְלֹא יוּכַל לָדִין
  choice: он не может спорить
  rationale: Глагол выражает вступление в тяжбу или спор; «спорить» сохраняет состязательный смысл, не сужая его до судебного процесса.
- source_word: עִם שֶׁהִתְקִיף מִמֶּנּוּ
  choice: с тем, кто сильнее его
  rationale: Сохраняет сравнительный смысл и не называет прямо подразумеваемого более сильного, поскольку еврейский текст этого не делает.
theological_decisions:
- issue: Следует ли прямо назвать Бога тем, кто сильнее человека
  choice: 'Оставить обозначение неявным: «с тем, кто сильнее его»'
  alternative: «с Богом, Который сильнее его»
  rationale: Контекст, вероятно, указывает на Бога, однако в самом стихе Он прямо не назван. Неявность сохранена, чтобы не устранять риторическую и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык; краткий, афористичный строй стиха сохранён. Формулировка dignified и понятна широкому читателю, а подразумеваемый референт оставлен неопределённым, как в источнике.
