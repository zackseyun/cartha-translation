lexical_decisions:
- source_word: יֵשׁ
  choice: Есть
  rationale: Естественно передаёт еврейскую конструкцию существования, вводящую наблюдение.
- source_word: רָעָה
  choice: зло
  rationale: Сохраняет широкий смысл чего-то дурного, тяжкого или бедственного, не сужая его до одной лишь нравственной категории.
- source_word: אֲשֶׁר רָאִיתִי
  choice: которое я видел
  rationale: Точно передаёт относительное придаточное и форму первого лица; в русском прошедшее время естественно для размышления автора.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Устойчивый и понятный эквивалент характерного для Екклесиаста выражения о земной жизни.
- source_word: וְרַבָּה הִיא עַל
  choice: и оно тяжким бременем лежит на
  rationale: Передаёт как буквальную идею значительности или тяжести, так и конструкцию с עַל; формулировка естественна и сохраняет образ обременительности.
- source_word: הָאָדָם
  choice: человеке
  rationale: Единственное число соответствует форме оригинала, а русское «человек» в данном контексте имеет обобщённое значение.
theological_decisions:
- issue: Обобщённое значение הָאָדָם
  choice: на человеке
  alternative: на людях / на человечестве
  rationale: «Человек» сохраняет единственное число и собирательно-представительное значение еврейского слова; примечание поясняет, что речь идёт о людях вообще.
- issue: Характер רָעָה
  choice: зло
  alternative: беда / несчастье
  rationale: Оригинал допускает как нравственный, так и переживаемый бедственный оттенок. «Зло» сохраняет эту смысловую напряжённость, не разрешая её однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Двоеточие сохранено, поскольку стих вводит описание, продолжающееся далее.
