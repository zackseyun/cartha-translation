  text: ט֛וֹב מַרְאֵ֥ה עֵינַ֖יִם מֵֽ/הֲלָךְ נָ֑פֶשׁ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/009.yaml
  text: Better is the sight of the eyes than the wandering of the soul[c][b][a]; this too is vapor and a chasing after wind.
translation:
  language: ru
  text: Лучше то, что видят глаза[a], чем блуждание души[b]; и это тоже — пар и погоня за ветром[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «видение глаз».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «блуждание желания»; еврейское слово может означать душу, самого человека, желание или жажду.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стремление за ветром».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: лучше
  rationale: В сравнительной конструкции естественное русское соответствие — «лучше», а не буквальное «хорошо».
- source_word: מַרְאֵה עֵינַיִם
  choice: то, что видят глаза
  rationale: Передаёт конкретный образ непосредственно видимого и звучит естественнее, чем буквальное «видение глаз».
- source_word: מֵהֲלָךְ
  choice: чем блуждание
  rationale: Существительное от הלך обозначает хождение или движение; «блуждание» передаёт здесь беспокойную устремлённость к тому, чего ещё нет.
- source_word: נָפֶשׁ
  choice: желаний
  rationale: В данном контексте נֶפֶשׁ обозначает желающее, жаждущее начало человека; «желаний» яснее передаёт смысл противопоставления непосредственно видимому, не навязывая представление о бесплотной душе.
- source_word: גַּם זֶה
  choice: но и это
  rationale: Сохраняет повторяющуюся оценочную формулу Екклесиаста; союз «но» естественно выражает поворот от сравнительной мудрости к признанию её ограниченности.
- source_word: הֶבֶל
  choice: пар
  rationale: Сохраняет конкретную метафору чего-то неуловимого, непрочного и быстро исчезающего, не сводя многозначный образ к традиционному абстрактному «суета».
- source_word: וּרְעוּת רוּחַ
  choice: и погоня за ветром
  rationale: Доступно передаёт устойчивый образ тщетного стремления к неуловимому, сохраняя образ ветра.
theological_decisions:
- issue: Значение נָפֶשׁ в контексте
  choice: желаний
  alternative: души
  rationale: Контекст говорит о беспокойном стремлении к желаемому, однако примечание сохраняет более буквальную возможность и не превращает «душу» в позднейшую антропологическую категорию.
- issue: Смысл הֶבֶל
  choice: пар
  alternative: суета
  rationale: Конкретный образ оставляет открытыми оттенки мимолётности, неуловимости и бессодержательности, не закрепляя только один богословский вывод.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической речи Екклесиаста. Синтаксис краткий и параллельный; конкретные метафоры «пар» и «погоня за ветром» сохранены.
