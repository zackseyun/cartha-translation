source:
  edition: WLC
  text: אִם יוֹלִ֣יד אִ֣ישׁ מֵאָ֡ה וְ/שָׁנִים֩ רַבּ֨וֹת יִֽחְיֶ֜ה וְ/רַ֣ב שֶׁ/יִּהְי֣וּ יְמֵֽי שָׁנָ֗י/ו וְ/נַפְשׁ/וֹ֙ לֹא תִשְׂבַּ֣ע מִן הַ/טּוֹבָ֔ה וְ/גַם קְבוּרָ֖ה לֹא הָ֣יְתָה לּ֑/וֹ אָמַ֕רְתִּי ט֥וֹב מִמֶּ֖/נּוּ הַ/נָּֽפֶל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/003.yaml
  text: If a man fathers a hundred children and lives many years[a], however many the days of his years may be, but his soul is not satisfied with good, and he does not even have burial[c][b], I say that the stillborn child is better off than he.
translation:
  language: ru
  text: 'Если мужчина станет отцом ста детей и проживёт много лет — как бы многочисленны ни были дни его жизни, — но душа его не насытится благом[a] и даже погребения у него не будет, то я говорю[b]: мертворождённому младенцу[c] лучше, чем ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа его не насытится благом». Слово «душа» может здесь означать также самого человека или его желание, стремление к удовлетворению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я сказал». Еврейская форма допускает здесь как прошедшее время, так и формулу текущего авторского суждения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выкидышу», «преждевременно родившемуся». Еврейское слово обозначает плод, погибший до рождения или при рождении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Передаёт гипотетическое условие, открывающее рассматриваемый случай.
- source_word: יוֹלִיד אִישׁ מֵאָה
  choice: у человека родится сто детей
  rationale: Естественно передаёт мужской субъект и подразумеваемое контекстом многочисленное потомство; слово «детей» необходимо по-русски для ясности эллиптического числительного.
- source_word: וְשָׁנִים רַבּוֹת יִחְיֶה
  choice: он проживёт много лет
  rationale: Сохраняет прямое указание на долголетие и естественно звучит в современном русском.
- source_word: וְרַב שֶׁיִּהְיוּ יְמֵי שָׁנָיו
  choice: как бы многочисленны ни были дни его жизни
  rationale: Передаёт усилительно-уступительный смысл и сохраняет исходный образ многочисленных дней.
- source_word: וְנַפְשׁוֹ
  choice: душа его
  rationale: Сохраняет антропологическую и литературную фактуру נֶפֶשׁ, не сводя её однозначно к аппетиту или простому местоимению.
- source_word: לֹא תִשְׂבַּע מִן הַטּוֹבָה
  choice: не насытится благом
  rationale: Глагол שבע означает насыщение или удовлетворение, а טובה здесь охватывает благо и хорошие дары жизни.
- source_word: וְגַם קְבוּרָה לֹא הָיְתָה לּוֹ
  choice: и даже погребения у него не будет
  rationale: «Даже» передаёт усиление גַם, а формулировка сохраняет лишение погребения как крайнюю участь.
- source_word: אָמַרְתִּי
  choice: я говорю
  rationale: Перфект может выполнять функцию формулы текущего авторского суждения; настоящее время естественно в данном рассуждении.
- source_word: טוֹב מִמֶּנּוּ
  choice: лучше, чем ему
  rationale: Русская конструкция ясно выражает сравнение участи, а не нравственных качеств.
- source_word: הַנָּפֶל
  choice: мертворождённому младенцу
  rationale: Конкретно и понятно обозначает ребёнка, не пережившего рождения, при сохранении в сноске более широкого лексического диапазона.
theological_decisions:
- issue: Антропологический оттенок נֶפֶשׁ
  choice: Сохранено «душа его».
  alternative: «он не насытится» или «его желание не насытится»
  rationale: Здесь нет необходимости превращать слово в технический догматический термин, но его образную глубину лучше сохранить, пояснив диапазон значения в сноске.
- issue: Смысл сравнения с הַנָּפֶל
  choice: Сравнивается участь человека с участью мертворождённого младенца.
  alternative: Передать как абстрактное «выкидыш» или эвфемистическое «безвременно рождённый».
  rationale: Исходный текст делает резкое экзистенциальное сравнение; его не следует смягчать или истолковывать сверх сказанного.
- issue: Временное значение אָמַרְתִּי
  choice: «я говорю» как формула текущего суждения.
  alternative: «я сказал»
  rationale: Обе передачи грамматически возможны; настоящее время лучше связывает заключение с разворачивающимся рассуждением, а вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством мудростной речи. Синтаксис сохраняет протяжённое условно-уступительное построение оригинала, но расчленён тире для ясного чтения. Архаизмы и конфессионально окрашенные формулы не использованы.
