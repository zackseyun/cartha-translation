base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/012.yaml
  text: For who knows what is good for man in life, during the number of the days of his fleeting life, which he spends like a shadow? For who can tell man what will be after him under the sun?
translation:
  language: ru
  text: Ведь кто знает, что хорошо для человека в жизни, в течение немногих дней его мимолётной жизни[a], которые проходят, словно тень? И кто скажет человеку, что будет после него под солнцем?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переданное как «мимолётной», буквально означает «пар» или «дыхание» и может выражать быстротечность, неуловимость, тщетность или суетность.
    reason: Поясняет многозначность הֶבֶל, сохраняя в основном тексте образ краткости и не устраняя смысловую открытость слова.
lexical_decisions:
- source_word: הָאָדָם
  choice: человек
  rationale: Обобщённое обозначение человека как такового; артикль не требует в русском языке указательного или определённого выражения.
- source_word: מִסְפַּר יְמֵי
  choice: в считаные дни
  rationale: Передаёт представление об ограниченном, исчисленном числе дней естественным русским выражением, не добавляя точного указания на их количество.
- source_word: הֶבְלוֹ
  choice: его мимолётного существования
  rationale: Слово הֶבֶל буквально связано с дыханием или паром и здесь подчёркивает непрочность и быстротечность жизни; «существование» позволяет избежать неестественного повтора слова «жизнь».
- source_word: וְיַעֲשֵׂם כַּצֵּל
  choice: которые он проводит, словно тень
  rationale: 'По контексту местоименный суффикс относится к дням: человек проживает их, а сравнение с тенью подчёркивает их быстротечность. Формулировка сохраняет образ и следует синтаксическому пониманию, отражённому в консультационном тексте.'
- source_word: אַחֲרָיו
  choice: после него
  rationale: 'Сохраняет неоднозначность: речь может идти как о времени после смерти человека, так и о событиях, которые последуют за ним.'
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохранён характерный для Екклесиаста пространственно-мировоззренческий оборот.
theological_decisions:
- issue: Смысл הֶבֶל применительно к человеческой жизни
  choice: мимолётного существования
  alternative: суетной жизни / тщетной жизни
  rationale: Выбранный вариант подчёркивает образ краткости и неуловимости, не сводя высказывание исключительно к нравственной суетности или бессмысленности.
- issue: Значение выражения «что будет после него»
  choice: оставить без уточнения
  alternative: что будет после его смерти
  rationale: Еврейский текст не уточняет, имеется ли в виду именно смерть; перевод сохраняет исходную смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с сохранением афористической формы и двух риторических вопросов. Обороты «считаные дни», «словно тень» и «под солнцем» доступны широкому читателю и сохраняют поэтическую сжатость оригинала.
