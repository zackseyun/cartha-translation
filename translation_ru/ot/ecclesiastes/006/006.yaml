  yaml_path: translation/ot/ecclesiastes/006/006.yaml
  text: Even if he should live a thousand years twice over and not see good[c][b][a], do not all go to one place?
translation:
  language: ru
  text: И даже если бы он прожил тысячу лет дважды[a] и не увидел добра[b], разве не все идут в одно место[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «две тысячи лет»; буквально: «тысячу лет дважды».'
    reason: lexical_alternative
  - marker: b
    text: «Увидеть добро» — еврейское выражение со значением «испытать добро» или «насладиться благами».
    reason: lexical_alternative
  - marker: c
    text: 'Вероятно, имеется в виду общий для всех исход смерти; в еврейском тексте сказано лишь: «одно место».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִלּוּ
  choice: И даже если бы
  rationale: Передаёт уступительно-гипотетическое значение частицы и естественно связывает стих с предшествующим контекстом.
- source_word: חָיָה
  choice: он прожил
  rationale: В сочетании с «если бы» выражает гипотетическую ситуацию; совершенный вид уместен при взгляде на всю продолжительность жизни как на целое.
- source_word: אֶלֶף שָׁנִים פַּעֲמַיִם
  choice: тысячу лет дважды
  rationale: Сохраняет необычную и выразительную форму еврейского текста, не сводя её в основном тексте к простому числу «две тысячи лет».
- source_word: וְטוֹבָה לֹא רָאָה
  choice: но так и не увидел добра
  rationale: «Но» естественно передаёт противопоставление внутри уступительной конструкции; «так и не» подчёркивает отсутствие этого опыта за всю долгую жизнь, а «увидел добра» сохраняет ключевой образ и лексику Книги Экклезиаста.
- source_word: הֲלֹא
  choice: разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: אֶל מָקוֹם אֶחָד
  choice: в одно место
  rationale: Буквально сохраняет сдержанное выражение оригинала, не называя прямо смерть, могилу или шеол.
- source_word: הַכֹּל הוֹלֵךְ
  choice: все идут
  rationale: Передаёт обобщённое, постоянно верное положение; «все» в контексте относится к людям.
theological_decisions:
- issue: Подразумеваемое значение выражения «одно место»
  choice: Сохранить в основном тексте «в одно место».
  alternative: «в одно и то же место», «в могилу», «к смерти», «в шеол»
  rationale: Еврейский текст оставляет место назначения неуточнённым. Контекст связывает его со смертью, однако конкретизация в основном тексте устранила бы намеренную недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены риторический вопрос, лаконизм и характерный для Экклезиаста образ «увидеть добро»; смысл идиомы и подразумеваемое место назначения пояснены только в сносках.
