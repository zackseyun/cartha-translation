  yaml_path: translation/ot/ecclesiastes/006/011.yaml
  text: For there are many words that increase vanity; what advantage is there for man?
translation:
  language: ru
  text: Ведь много слов, умножающих суету; какая от этого польза человеку?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבָרִים
  choice: слов
  rationale: Существительное допускает значения «слова», «дела», «вещи», но в данном контексте и с учётом масоретского текста выбрано конкретное значение «слова», сохраняющее связь с многословием.
- source_word: מַרְבִּים הָבֶל
  choice: умножающих суету
  rationale: Причастная конструкция передана близко к форме и образу оригинала; «суета» сохраняет ключевой многозначный термин הֶבֶל книги — тщетность, мимолётность и пустоту.
- source_word: מַה־יֹּתֵר לָאָדָם
  choice: какая от этого польза человеку?
  rationale: Идиоматическая русская передача вопроса о преимуществе или выгоде; «от этого» естественно обозначает результат множества слов, не снимая риторического характера вопроса.
theological_decisions:
- issue: Смысл הֶבֶל
  choice: суета
  alternative: тщета / пустота
  rationale: Традиционное и ёмкое русское соответствие сохраняет богословскую и литературную напряжённость центрального понятия Екклесиаста, не сводя его только к бессмысленности.
- issue: Референт דְּבָרִים
  choice: слова
  alternative: вещи / дела
  rationale: Выбрано возможное прямое значение, соответствующее консультационному слою; при этом контекстуальная неоднозначность слова признаётся в лексическом решении, но отдельная сноска для краткого стиха не требуется.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достоинственная формулировка. Сохранены повторный образ «умножения» и риторический вопрос оригинала.
