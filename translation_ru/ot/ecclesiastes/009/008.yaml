lexical_decisions:
- source_word: בְּכָל־עֵת
  choice: всегда
  rationale: Буквально выражение означает «во всякое время»; «всегда» естественно и точно передаёт постоянный характер наставления.
- source_word: יִהְיוּ
  choice: пусть … будет
  rationale: В данном контексте имперфект имеет побудительное значение, поэтому русская конструкция с «пусть» передаёт наставление, а не простое будущее.
- source_word: בְגָדֶיךָ
  choice: твоя одежда
  rationale: Еврейское слово стоит во множественном числе («твои одежды»), однако собирательное единственное «твоя одежда» звучит естественнее в современном русском и сохраняет конкретный образ.
- source_word: לְבָנִים
  choice: белой
  rationale: Прямое значение прилагательного — «белый»; перевод сохраняет образ, не подменяя его толкованием «праздничный» или «чистый».
- source_word: וְשֶׁמֶן
  choice: масло
  rationale: В тексте сказано просто «масло»; уточнения «оливковое» или «масло для помазания» были бы культурно вероятными, но отсутствуют в исходном тексте.
- source_word: עַל־רֹאשְׁךָ
  choice: на твоей голове
  rationale: Прямой и естественный современный русский эквивалент предложного сочетания.
- source_word: אַל־יֶחְסָר
  choice: пусть … не иссякает
  rationale: Отрицательная частица с имперфектом выражает запрет или увещание. «Не иссякает» естественно передаёт отсутствие недостатка и сохраняет побудительный тон.
