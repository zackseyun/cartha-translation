    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה חָכְמָה
  choice: Мудрость лучше
  rationale: Предикативное טוֹבָה в сочетании с последующим מִן выражает сравнение; по-русски естественно передать его сравнительной формой «лучше».
- source_word: מִכְּלֵי קְרָב
  choice: боевого оружия
  rationale: כְּלֵי — предметы или орудия, а קְרָב указывает на бой; «боевое оружие» кратко и естественно передаёт военное значение сочетания.
- source_word: וְחוֹטֶא אֶחָד
  choice: но один грешник
  rationale: Союз וְ буквально может означать «и», однако в контексте вводит смысловое противопоставление. Субстантивированное причастие חוֹטֶא передано словом «грешник», а אֶחָד сохранено для подчёркивания того, что достаточно одного человека.
- source_word: יְאַבֵּד
  choice: губит
  rationale: Форма пиэль от אבד имеет каузативно-разрушительное значение. «Губит» сохраняет силу выражения и звучит естественно в русском изречении.
- source_word: טוֹבָה הַרְבֵּה
  choice: много добра
  rationale: Сочетание обозначает большое количество добра или пользы; «много добра» сохраняет широту значения, не ограничивая его только нравственным либо практическим благом.
