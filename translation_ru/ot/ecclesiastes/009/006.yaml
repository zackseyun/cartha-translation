base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/006.yaml
  text: Their love[a], their hatred, and their jealousy have already perished, and they no longer have a share forever in anything that is done under the sun.
translation:
  language: ru
  text: И любовь их, и ненависть их, и ревность[a] их уже исчезли; и никогда больше не будет им доли ни в чём, что делается под солнцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зависть их»; возможно также: «рвение их» — еврейское слово допускает все эти значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם ... גַּם
  choice: И ... и ... и
  rationale: Повторяющийся союз передаёт накопительное перечисление и подчёркивает каждый из трёх душевных порывов.
- source_word: אַהֲבָתָם
  choice: любовь их
  rationale: Прямой эквивалент отвлечённого существительного с суффиксом 3-го лица множественного числа; постпозиция местоимения поддерживает достоинство и ритм фразы.
- source_word: שִׂנְאָתָם
  choice: ненависть их
  rationale: Точно передаёт отвлечённое существительное и сохраняет параллелизм с «любовью» и «ревностью».
- source_word: קִנְאָתָם
  choice: ревность их
  rationale: קִנְאָה допускает значения ревности, зависти и рвения. В ряду человеческих чувств рядом с любовью и ненавистью «ревность» естественна, но неоднозначность отмечена в сноске.
- source_word: כְּבָר אָבָדָה
  choice: уже исчезли
  rationale: כְּבָר указывает на уже наступившее состояние, а אבד — на прекращение существования или утрату. Русское множественное число согласуется с составным подлежащим; «исчезли» здесь естественнее, чем буквальное «погибли» применительно к чувствам.
- source_word: וְחֵלֶק אֵין לָהֶם עוֹד לְעוֹלָם
  choice: и впредь вовеки нет им доли
  rationale: Сохраняется экзистенциальная конструкция «нет им», ключевое для Екклесиаста понятие доли и совокупная сила עוֹד и לְעוֹלָם — прекращение участия на всё последующее время.
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה
  choice: ни в чём, что делается
  rationale: После отрицательного «нет» конструкция «ни в чём» естественно передаёт всеохватность, а «делается» сохраняет пассивную форму исходного текста.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Традиционная и прозрачная передача устойчивого выражения Екклесиаста, обозначающего земную сферу жизни и деятельности.
theological_decisions:
- issue: Объём утверждения об отношении умерших к происходящему
  choice: Утверждение ограничено их отсутствием доли в делах, совершаемых «под солнцем».
  alternative: Понимать стих как всеобщее метафизическое утверждение о полном отсутствии у умерших какого-либо сознания.
  rationale: Заключительная оговорка «под солнцем» непосредственно задаёт земную сферу утверждения. Перевод сохраняет эту границу и не вводит более широкого учения о состоянии умерших.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Тройное «и» сохраняет риторическое усиление оригинала; «нет им доли» удерживает характерную лексику Екклесиаста. Маркер сноски поставлен в основном тексте.
