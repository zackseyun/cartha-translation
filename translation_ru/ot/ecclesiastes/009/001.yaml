source:
  edition: WLC
  text: כִּ֣י אֶת כָּל זֶ֞ה נָתַ֤תִּי אֶל לִבִּ/י֙ וְ/לָ/ב֣וּר אֶת כָּל זֶ֔ה אֲשֶׁ֨ר הַ/צַּדִּיקִ֧ים וְ/הַ/חֲכָמִ֛ים וַ/עֲבָדֵי/הֶ֖ם בְּ/יַ֣ד הָ/אֱלֹהִ֑ים גַּֽם אַהֲבָ֣ה גַם שִׂנְאָ֗ה אֵ֤ין יוֹדֵ֨עַ֙ הָֽ/אָדָ֔ם הַ/כֹּ֖ל לִ/פְנֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/001.yaml
  text: 'For I laid all this to my heart[a], even to examine all this: that the righteous and the wise and their works are in the hand of God. Whether love or hate, man does not know[b]; everything is before them.'
translation:
  language: ru
  text: 'Ибо всё это я принял к сердцу и всё это исследовал: праведные и мудрые, а также их дела[a] — в руке Бога. Любовь или ненависть — человек не знает[b]; всё перед ними.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их слуги». Еврейскую форму можно прочитать именно так, однако многие понимают её здесь как «их дела».'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст заключительной части стиха труден. Возможно, смысл в том, что человек заранее не знает, любовь или ненависть ожидает его, либо что по нынешним обстоятельствам нельзя определить, любим он или ненавидим.
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתִּי אֶל לִבִּי
  choice: я принял к сердцу
  rationale: Естественная русская передача еврейской идиомы внутреннего, серьёзного обдумывания с сохранением образа сердца.
- source_word: וְלָבוּר
  choice: и ... исследовал
  rationale: Передаёт значение тщательного рассмотрения и мысленного выяснения, уместное для рассуждений Кохелета.
- source_word: הַצַּדִּיקִים וְהַחֲכָמִים
  choice: праведные и мудрые
  rationale: Сохраняет нравственный смысл первого термина и характерную для литературы мудрости лексику второго.
- source_word: וַעֲבָדֵיהֶם
  choice: а также их дела
  rationale: В данном контексте форма, вероятно, обозначает дела праведных и мудрых, хотя её естественно можно прочесть как «их слуги»; альтернативное прочтение вынесено в сноску.
- source_word: בְּיַד הָאֱלֹהִים
  choice: в руке Бога
  rationale: Сохраняет конкретную еврейскую метафору Божьей власти и попечения, не уточняя её сверх текста.
- source_word: גַּם אַהֲבָה גַם שִׂנְאָה
  choice: ни любви, ни ненависти
  rationale: В сочетании с отрицанием естественно выражает по-русски неизвестность человеку любви и ненависти, не определяя однозначно, чьи именно это чувства или переживания.
- source_word: הַכֹּל לִפְנֵיהֶם
  choice: всё впереди у них
  rationale: Передаёт пространственно-временную метафору трудной заключительной фразы и допускает смысл ещё не известных человеку будущих обстоятельств.
theological_decisions:
- issue: Значение וַעֲבָדֵיהֶם
  choice: их дела
  alternative: их слуги
  rationale: Контекст размышляет о праведных и мудрых под Божьей властью; «их дела» образует связное утверждение о людях и их деятельности. Однако морфологически очевидное альтернативное прочтение сохранено в сноске.
- issue: Смысл высказывания о любви и ненависти
  choice: 'сохранить сжатость: «Ни любви, ни ненависти человек не знает; всё впереди у них»'
  alternative: человек не знает, любовь или ненависть ожидает его; либо по нынешним обстоятельствам нельзя узнать, любим он или ненавидим
  rationale: Еврейская фраза синтаксически трудна и допускает как отнесение любви и ненависти к будущему, так и невозможность судить о них по наблюдаемым обстоятельствам. Основной текст не разрешает эту напряжённость догматически, а поясняет её в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Сохранены библейская метафора «в руке Бога», образ сердца и неоднозначность заключительной фразы; архаизмы и конфессионально окрашенные уточнения не вводятся.
