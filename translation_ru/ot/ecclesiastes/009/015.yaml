base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/015.yaml
  text: And there was found in it a poor wise man[a], and he delivered the city by his wisdom; yet no one remembered that poor man.
translation:
  language: ru
  text: И нашёлся[a] в нём бедный мудрец, и своей мудростью он спас город; однако никто не вспомнил об этом бедняке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и [он] нашёл в нём»; субъект глагола в еврейском тексте прямо не назван.'
    reason: Сохраняет морфологическую неоднозначность активной глагольной формы, не представляя подразумеваемый субъект как отдельное слово исходного текста.
lexical_decisions:
- source_word: וּמָצָא בָהּ
  choice: И нашёлся в нём
  rationale: 'Форма глагола активная, 3-е лицо мужского рода, но в данном контексте естественно понимается неопределённо: в городе нашёлся такой человек. Возвратная конструкция передаёт это по-русски без введения не названного субъекта; буквальная возможность отмечена в сноске.'
- source_word: אִישׁ מִסְכֵּן חָכָם
  choice: бедный мудрец
  rationale: Сочетание обозначает мужчину, бедного и мудрого. Русское «бедный мудрец» естественно, ёмко и сохраняет обе характеристики.
- source_word: וּמִלַּט הוּא אֶת־הָעִיר
  choice: и своей мудростью он спас город
  rationale: Пиэль מלט с прямым дополнением означает избавить или спасти. Местоимение «он» сохраняет выраженное в еврейском тексте הוּא и подчёркивает роль мудреца.
- source_word: בְּחָכְמָתוֹ
  choice: своей мудростью
  rationale: Предлог בְּ обозначает средство; творительный падеж естественно передаёт инструментальное значение.
- source_word: וְאָדָם לֹא זָכַר
  choice: однако никто не вспомнил
  rationale: אָדָם здесь употреблено обобщённо в отрицательной конструкции и по-русски естественно передаётся словом «никто». Союз «однако» выражает контраст между спасением города и последующим забвением спасителя.
- source_word: הָאִישׁ הַמִּסְכֵּן הַהוּא
  choice: об этом бедняке
  rationale: Указательное определение относится к уже названному бедному мужчине. «Этот бедняк» сохраняет определённость и избегает тяжеловесного повторения «этот бедный человек».
theological_decisions:
- issue: Неопределённое или личное понимание וּמָצָא
  choice: нашёлся
  alternative: он нашёл
  rationale: Контекст говорит о появлении в городе бедного мудреца, который его спас. При этом активная морфология допускает буквальное «он нашёл», поэтому эта языковая неоднозначность не замалчивается, а отмечается в сноске.
- issue: Обобщённое значение אָדָם
  choice: никто
  alternative: ни один человек
  rationale: В отрицательной конструкции слово обозначает отсутствие какого-либо человека, который помнил бы мудреца; «никто» точно и естественно передаёт этот смысл без указания исключительно на мужчин.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Мудрец» и «бедняк» создают естественный для книги мудрости контраст между мудростью, низким общественным положением и забвением; местоимение «в нём» согласуется с мужским родом русского слова «город».
