base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/002.yaml
  text: 'All is the same for all: one fate comes to the righteous and to the wicked[a], to the good and to the clean and to the unclean, to the one who sacrifices and to the one who does not sacrifice; as the good one, so the sinner[b]; the one who swears is as the one who fears an oath.'
translation:
  language: ru
  text: 'Всё одинаково для всех: одна участь[a] постигает и праведника, и нечестивого, и доброго, и чистого, и нечистого, и приносящего жертвы, и не приносящего жертв; что добрый, то и грешник; клянущийся — как тот, кто боится клятвы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одно событие»; или: «один и тот же исход».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тот, кто боится клясться».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֹּל כַּאֲשֶׁר לַכֹּל
  choice: Всё одинаково для всех
  rationale: Естественно передаёт сжатую эллиптическую конструкцию и всеобщий охват утверждения.
- source_word: מִקְרֶה אֶחָד
  choice: одна участь
  rationale: В контексте Екклесиаста обозначает общий исход, постигающий людей; «участь» не вносит жёсткого представления о безличном фатализме.
- source_word: לַצַּדִּיק וְלָרָשָׁע
  choice: и праведника, и нечестивого
  rationale: Сохраняет традиционную нравственную антитезу еврейского текста.
- source_word: לַטּוֹב וְלַטָּהוֹר וְלַטָּמֵא
  choice: и доброго, и чистого, и нечистого
  rationale: Не сливает пересекающиеся категории и сохраняет возможный обрядовый смысл противопоставления «чистый — нечистый».
- source_word: וְלַזֹּבֵחַ וְלַאֲשֶׁר אֵינֶנּוּ זֹבֵחַ
  choice: и приносящего жертвы, и не приносящего жертв
  rationale: Ясно и естественно воспроизводит противопоставление причастных форм.
- source_word: כַּטּוֹב כַּחֹטֶא
  choice: что добрый, то и грешник
  rationale: Сохраняет краткую сравнительную структуру и афористичность оригинала.
- source_word: הַנִּשְׁבָּע כַּאֲשֶׁר שְׁבוּעָה יָרֵא
  choice: клянущийся — как тот, кто боится клятвы
  rationale: Передаёт буквальную неоднозначность заключительного сравнения, не сводя страх к одному толкованию.
theological_decisions:
- issue: Смысл מִקְרֶה אֶחָד
  choice: одна участь
  alternative: одно событие; один и тот же исход
  rationale: Ближайший контекст указывает на общий для всех смертный исход, но перевод не превращает наблюдение Екклесиаста в доктрину детерминизма.
- issue: Категории чистоты
  choice: чистый и нечистый
  alternative: непорочный и осквернённый
  rationale: Сохранён вероятный обрядовый оттенок наряду с более широким смыслом, без сведения слов только к нравственной оценке.
- issue: Заключение о клятве
  choice: тот, кто боится клятвы
  alternative: тот, кто боится клясться; тот, кто благоговеет перед клятвой
  rationale: 'Основной текст сохраняет смысловую напряжённость: речь может идти как о нежелании приносить клятву, так и о почтительно-осторожном отношении к ней.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Синтаксический параллелизм и накопление контрастных пар сохранены; архаизмы и конфессионально окрашенные уточнения не вводятся.
