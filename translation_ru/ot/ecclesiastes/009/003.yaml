  text: זֶ֣ה רָ֗ע בְּ/כֹ֤ל אֲשֶֽׁר נַעֲשָׂה֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּֽי מִקְרֶ֥ה אֶחָ֖ד לַ/כֹּ֑ל וְ/גַ֣ם לֵ֣ב בְּֽנֵי הָ֠/אָדָם מָלֵא רָ֨ע וְ/הוֹלֵל֤וֹת בִּ/לְבָבָ/ם֙ בְּ/חַיֵּי/הֶ֔ם וְ/אַחֲרָ֖י/ו אֶל הַ/מֵּתִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/003.yaml
  text: 'This is the evil in all that is done under the sun: that one fate comes to all[a]. Also, the heart of the sons of man is full of evil, and madness is in their hearts during their lives—and afterward[c][b], they go to the dead.'
translation:
  language: ru
  text: 'Вот что дурно во всём, что совершается под солнцем: одна участь постигает всех.[a] Кроме того, сердце людей[b] полно зла, и при жизни в их сердцах — безумие; а после этого — к мёртвым.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со всеми случается одно и то же». Еврейское מִקְרֶה может означать событие, то, что постигает человека, или общую участь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сердце сынов человеческих». Это еврейское выражение обозначает здесь человечество вообще, а не только мужчин.'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте фраза обрывочна: буквально «а после этого — к мёртвым». Подразумевается переход к умершим; глагол не назван.'
    reason: textual_ellipsis
lexical_decisions:
- source_word: זֶה רָע
  choice: Вот что худо
  rationale: Передаёт указательную и оценочную силу еврейского оборота естественным современным русским языком, не превращая רָע в отвлечённое учение о зле.
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה תַּחַת הַשֶּׁמֶשׁ
  choice: во всём, что совершается под солнцем
  rationale: Сохраняет безлично-пассивный смысл и характерную для Екклесиаста формулу «под солнцем».
- source_word: כִּי מִקְרֶה אֶחָד לַכֹּל
  choice: всех постигает одна участь
  rationale: מִקְרֶה обозначает то, что выпадает человеку, — событие или участь. В данном контексте «участь» естественно выражает общую для всех судьбу, не вводя жёсткого детерминизма.
- source_word: לֵב בְּנֵי הָאָדָם
  choice: сердце сынов человеческих
  rationale: Сохраняет единственное число собирательного «сердце» и образное мужское обозначение человечества в источнике; более идиоматическое значение пояснено в сноске.
- source_word: מָלֵא רָע
  choice: полно зла
  rationale: Прямо передаёт предикативную конструкцию и оставляет широкое значение нравственного и губительного зла.
- source_word: וְהוֹלֵלוֹת בִּלְבָבָם
  choice: и безумие — в их сердцах
  rationale: «Безумие» передаёт иррациональность и безрассудство; «в сердцах» сохраняет еврейский антропологический образ, включающий мысли, волю и желания.
- source_word: בְּחַיֵּיהֶם
  choice: при жизни
  rationale: Краткий и естественный русский эквивалент временного выражения.
- source_word: וְאַחֲרָיו אֶל הַמֵּתִים
  choice: а после этого они идут к мёртвым
  rationale: Восполняет подразумеваемое движение ради ясного русского предложения, тогда как необычная краткость и неопределённость еврейской фразы отмечены в сноске.
theological_decisions:
- issue: Общее для всех מִקְרֶה
  choice: одна участь
  alternative: одно и то же событие
  rationale: Контекст говорит об общем исходе людей, однако само слово допускает более нейтральное значение «то, что случается»; альтернатива сохранена в сноске, чтобы не навязывать учение о предопределённой судьбе.
- issue: Обобщающее выражение בְּנֵי הָאָדָם
  choice: сыны человеческие
  alternative: люди / человеческое сердце
  rationale: Форма источника использует мужское собирательное обозначение всего человечества, а не только мужчин. Основной текст сохраняет образ, сноска разъясняет его общий смысл.
- issue: Эллиптическое описание посмертного исхода
  choice: они идут к мёртвым
  alternative: а после этого — к мёртвым
  rationale: Глагол добавлен как требуемое русской речью раскрытие эллипсиса, без уточнения места или состояния умерших и без привнесения конфессиональной схемы загробной жизни.
translation_notes:
  register: Современный литературный русский язык с достоинством мудрой литературы. Сохранены формула «под солнцем», образ сердца и источник-ориентированное «сыны человеческие»; архаические синтаксические формы и излишне разговорная лексика исключены.
