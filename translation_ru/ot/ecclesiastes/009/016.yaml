source:
  edition: WLC
  text: וְ/אָמַ֣רְתִּי אָ֔נִי טוֹבָ֥ה חָכְמָ֖ה מִ/גְּבוּרָ֑ה וְ/חָכְמַ֤ת הַ/מִּסְכֵּן֙ בְּזוּיָ֔ה וּ/דְבָרָ֖י/ו אֵינָ֥/ם נִשְׁמָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/016.yaml
  text: And I said[a], “Wisdom is better than strength,” but the wisdom of the poor man is despised[c][b], and his words are not heard.
translation:
  language: ru
  text: 'И сказал я: «Мудрость лучше силы, но мудрость бедняка презирают, и к словам его не прислушиваются[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его слова остаются неуслышанными».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אָ֔נִי
  choice: И сказал я
  rationale: Сохраняет еврейскую последовательность и подчёркнутое местоимение אֲנִי, не навязывая более узкое значение связи вроде «тогда» или «поэтому».
- source_word: טוֹבָה חָכְמָה מִגְּבוּרָה
  choice: Мудрость лучше силы
  rationale: Сравнительная конструкция с מִן выражает превосходство; «сила» естественно передаёт גְּבוּרָה и сохраняет противопоставление мудрости физической или общественной мощи.
- source_word: וְחָכְמַת
  choice: но мудрость
  rationale: Хотя וְ формально означает «и», в контексте оно вводит контраст между превосходством мудрости и пренебрежением к ней, поэтому современное русское «но» точнее передаёт ход мысли.
- source_word: הַמִּסְכֵּן
  choice: бедняка
  rationale: Определённая форма мужского рода указывает на конкретного бедного человека, вероятнее всего на бедного мудреца из предыдущего стиха.
- source_word: בְּזוּיָה
  choice: презирают
  rationale: Еврейская форма описывает мудрость как презираемую; русская активная неопределённо-личная конструкция звучит естественно и сохраняет значение общественного пренебрежения.
- source_word: וּדְבָרָיו
  choice: и к словам его
  rationale: Прямо передаёт множественное דְּבָרָיו как произнесённые им слова или советы; постпозиция местоимения поддерживает достоинство библейского регистра.
- source_word: אֵינָם נִשְׁמָעִים
  choice: не прислушиваются
  rationale: Нифаль שׁמע допускает смысл не только физического слышания, но и внимания или послушания. В данном контексте речь о том, что совет бедняка не принимают во внимание; альтернативная буквальная передача отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Сохранён контраст между признанной ценностью мудрости и фактическим презрением к мудрости бедняка; неоднозначность שׁמע между «слышать» и «прислушиваться» отражена сноской.
