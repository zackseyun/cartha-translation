base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/007.yaml
  text: Go[a], eat your bread with joy, and drink your wine with a glad heart, for God has already approved your works.
translation:
  language: ru
  text: Иди, ешь свой хлеб с радостью и пей своё вино с радостным сердцем, ведь Бог уже одобрил[a] твои дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принял твои дела»; «благоволит к твоим делам».'
    reason: 'Лексическая многозначность רָצָה: глагол может обозначать одобрение, благосклонное принятие или благоволение.'
lexical_decisions:
- source_word: לֵךְ
  choice: Иди
  rationale: Императив הלך здесь идиоматически вводит побуждение. «Иди» сохраняет образ и побудительную силу еврейского выражения без лишнего разъяснения.
- source_word: אֱכֹל
  choice: ешь
  rationale: Прямой императив, естественно передаваемый простой повелительной формой.
- source_word: בְּשִׂמְחָה
  choice: с радостью
  rationale: Предлог ב выражает образ действия; русское «с радостью» естественно и сохраняет существительное.
- source_word: לַחְמֶךָ
  choice: свой хлеб
  rationale: לחם буквально означает «хлеб» и может шире обозначать пищу, однако здесь буквальный образ ясен и естественен. Возвратное «свой» соответствует русскому употреблению при обращении к одному лицу.
- source_word: וּשֲׁתֵה
  choice: и пей
  rationale: Прямой императив, сочинённый с предыдущим повелением.
- source_word: בְלֶב טוֹב
  choice: с весёлым сердцем
  rationale: Буквально «с добрым/хорошим сердцем»; в данном контексте это идиома внутренней радости. «Весёлое сердце» сохраняет образ сердца и не создаёт ошибочного смысла нравственной доброты.
- source_word: יֵינֶךָ
  choice: своё вино
  rationale: Буквальный и контекстуально уместный перевод; возвратное местоимение естественно в русском обращении.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего побуждения. «Ведь» естественно выражает пояснительно-причинную связь.
- source_word: כְבָר
  choice: уже
  rationale: Наречие указывает на предшествующее или уже существующее Божье благоволение.
- source_word: רָצָה
  choice: одобрил
  rationale: Глагол выражает благосклонное принятие, одобрение или удовольствие. «Одобрил» передаёт перфективную форму и оценочный оттенок; допустимые смысловые альтернативы сохранены в сноске.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Определённая форма здесь обозначает единого Бога; стандартная русская передача — «Бог».
- source_word: מַעֲשֶׂיךָ
  choice: твои дела
  rationale: מַעֲשִׂים означает поступки, дела или действия. «Дела» сохраняет конкретность и оценочный характер выражения.
theological_decisions:
- issue: Смысл Божьего одобрения в заключительной части стиха
  choice: Стих утверждает, что Бог уже благосклонно отнёсся к делам адресата, и этим обосновывает призыв радоваться дарам жизни.
  alternative: Возможны оттенки «Бог принял твои дела» или «Бог благоволит к твоим делам», включая предположение о культовом принятии действий.
  rationale: רצה в сочетании с מַעֲשִׂים может означать благосклонное принятие или удовольствие. Сам стих не утверждает, что человек заслуживает спасение делами; перевод сохраняет оценочную формулировку, не внося такого доктринального вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и понятен; параллелизм двух повелений и образ сердца сохранены.
