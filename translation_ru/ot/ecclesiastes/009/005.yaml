id: ECC.9.5
reference: Ecclesiastes 9:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֧י הַֽ/חַיִּ֛ים יוֹדְעִ֖ים שֶׁ/יָּמֻ֑תוּ וְ/הַ/מֵּתִ֞ים אֵינָ֧/ם יוֹדְעִ֣ים מְא֗וּמָה וְ/אֵֽין ע֤וֹד לָ/הֶם֙ שָׂכָ֔ר כִּ֥י נִשְׁכַּ֖ח זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/005.yaml
  text: For the living know that they will die[a], but the dead know nothing at all, and there is no longer any reward for them, because their memory is forgotten.
translation:
  language: ru
  text: Ведь живые знают, что умрут, а мёртвые не знают ничего; и нет уже для них награды, потому что память о них забыта.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующей мыслью естественным для современного русского языка способом.
- source_word: הַחַיִּים
  choice: живые
  rationale: Субстантивированное прилагательное во множественном числе обозначает всех живущих людей.
- source_word: יוֹדְעִים שֶׁיָּמֻתוּ
  choice: знают, что умрут
  rationale: Прямо передаёт содержание знания и будущее значение глагольной формы.
- source_word: וְהַמֵּתִים
  choice: а мёртвые
  rationale: Союз וְ в данном параллелизме выражает противопоставление; русское «а» сохраняет его без излишнего усиления.
- source_word: אֵינָם יוֹדְעִים מְאוּמָה
  choice: не знают ничего
  rationale: Отрицательная конструкция с מְאוּמָה имеет категорическое значение «не знают ничего»; русский порядок слов сохраняет её выразительность.
- source_word: וְאֵין עוֹד לָהֶם שָׂכָר
  choice: и нет уже для них награды
  rationale: «Награда» естественно передаёт שָׂכָר в контексте результата или воздаяния за человеческие труды, а «уже» отражает עוֹד.
- source_word: כִּי נִשְׁכַּח זִכְרָם
  choice: потому что память о них забыта
  rationale: Сохраняет причинную связь, пассивную форму и значение זִכְרָם как памяти или воспоминания о них.
theological_decisions:
- issue: Следует ли уточнять, что мёртвые ничего не знают лишь о происходящем «под солнцем», либо смягчать утверждение ради согласования с другими библейскими текстами?
  choice: Оставить категорическое утверждение «мёртвые не знают ничего» без добавленных ограничений.
  alternative: Добавить «о происходящем под солнцем» или иным образом смягчить фразу.
  rationale: Таких уточнений в еврейском тексте стиха нет. Перевод сохраняет намеренно резкую формулировку Кохелета и возникающее богословское напряжение, не превращая её при этом в расширенное систематическое учение.
translation_notes:
  register: 'Современный литературный русский язык; тон сдержанный и афористичный. Синтаксический параллелизм между живыми и мёртвыми сохранён. Дополнительная сноска не требуется: предложенная в английском слое сноска не соответствует стоящему там маркеру и не добавляет необходимой исходно-языковой информации.'
