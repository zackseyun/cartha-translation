base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/011.yaml
  text: I again saw under the sun that the race is not to the swift[a], nor the battle to the mighty, and also bread is not to the wise, nor riches to the discerning, nor favor to those who know; for time and chance happen to them all.
translation:
  language: ru
  text: 'И снова увидел я под солнцем: не всегда быстрым достаётся победа в беге и не всегда сильным — победа в битве; не всегда мудрым достаётся хлеб, разумным — богатство и сведущим — благосклонность, потому что время и случай постигают всех[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «время и событие», «время и непредвиденное происшествие». Еврейское выражение подчёркивает, что непредсказуемые обстоятельства постигают каждого.'
    reason: Лексическое сочетание עֵת וָפֶגַע допускает несколько близких передач; примечание сохраняет его смысловой диапазон.
lexical_decisions:
- source_word: שַׁבְתִּי וְרָאֹה
  choice: И снова увидел я
  rationale: Буквально оборот означает «я возвратился и увидел», но у Кохелета он вводит новое или повторное наблюдение. Русское «снова увидел» естественно передаёт эту функцию, а порядок слов поддерживает достоинство и ритм речи.
- source_word: תַחַת הַשֶּׁמֶשׁ
  choice: под солнцем
  rationale: Характерное для Екклесиаста обозначение земной области человеческой жизни; устойчивый и прозрачный русский эквивалент.
- source_word: לַקַּלִּים הַמֵּרוֹץ
  choice: не быстрым достаётся победа в беге
  rationale: Еврейская именная конструкция буквально говорит, что «бег — не быстрым». Добавление «достаётся победа» делает подразумеваемый исход состязания ясным по-русски, не утверждая, что скорость не имеет значения вообще.
- source_word: לַגִּבּוֹרִים הַמִּלְחָמָה
  choice: не могучим — в битве
  rationale: גִּבּוֹרִים обозначает сильных, могучих людей и нередко воинов. «Могучим» сохраняет широкий смысл, тогда как «в битве» естественно продолжает подразумеваемое «достаётся победа».
- source_word: לַחֲכָמִים לֶחֶם
  choice: не мудрым — хлеб
  rationale: Сохранён конкретный образ хлеба как пропитания и средств к жизни, а также краткий параллелизм еврейской строки.
- source_word: לַנְּבֹנִים
  choice: разумным
  rationale: Слово обозначает людей, обладающих пониманием и рассудительностью. «Разумным» естественно в данном ряду и не смешивается с предшествующим «мудрым».
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Прямой современный русский эквивалент, подходящий к поэтическому параллелизму.
- source_word: לַיֹּדְעִים
  choice: сведущим
  rationale: Причастие от ידע буквально означает «знающим». «Сведущим» передаёт обладание знанием более естественно и кратко по-русски, не уточняя его предмет.
- source_word: חֵן
  choice: благосклонность
  rationale: В данном контексте речь идёт о благоприятном отношении или принятии. «Благосклонность» избегает возможной богословской перегрузки слова «благодать».
- source_word: עֵת וָפֶגַע יִקְרֶה אֶת כֻּלָּם
  choice: всех их настигают время и случай
  rationale: Формулировка сохраняет соединение «времени» с непредвиденным происшествием и передаёт глагол как внезапное наступление обстоятельств. Она не превращает наблюдение о непредсказуемости в философское отрицание Божьего промысла.
theological_decisions:
- issue: Подразумевает ли «случай» отрицание Божьего промысла
  choice: Передать наблюдаемую человеком непредсказуемость исходов жизни «под солнцем», не добавляя утверждения о том, что события находятся вне Божьей власти.
  alternative: Истолковать стих как утверждение, будто жизнью управляет исключительно слепой случай.
  rationale: Еврейский текст описывает то, как обстоятельства неожиданно постигают всех, но прямо не формулирует метафизического отрицания промысла. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, афористичным ритмом. Эллиптические конструкции с тире сохраняют параллелизм оригинала, оставаясь понятными обычному читателю.
