revisions:
- from: 'И снова увидел я под солнцем: не быстрым достаётся победа в беге и не могучим — в битве; не мудрым — хлеб, не разумным — богатство и не сведущим — благосклонность, потому что всех их настигают время и случай[a].'
  to: 'И снова увидел я под солнцем: не всегда быстрым достаётся победа в беге и не всегда сильным — победа в битве; не всегда мудрым достаётся хлеб, разумным — богатство и сведущим — благосклонность, потому что время и случай постигают всех[a].'
  rationale: Внесены только безопасные смысловые и стилистические уточнения. Повтор «не всегда» передаёт, что перечисленные способности не обеспечивают соответствующих результатов, а не отрицает их возможную действенность. Явно названа победа в битве, чтобы восстановить параллельную структуру. Маркер примечания остаётся при «случае», то есть у выражения, которое оно поясняет.
