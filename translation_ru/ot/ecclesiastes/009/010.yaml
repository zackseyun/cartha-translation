  text: כֹּ֠ל אֲשֶׁ֨ר תִּמְצָ֧א יָֽדְ/ךָ֛ לַ/עֲשׂ֥וֹת בְּ/כֹחֲ/ךָ֖ עֲשֵׂ֑ה כִּי֩ אֵ֨ין מַעֲשֶׂ֤ה וְ/חֶשְׁבּוֹן֙ וְ/דַ֣עַת וְ/חָכְמָ֔ה בִּ/שְׁא֕וֹל אֲשֶׁ֥ר אַתָּ֖ה הֹלֵ֥ךְ שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/010.yaml
  text: Whatever your hand finds to do, do it with your strength, for there is no work or planning or knowledge or wisdom in Sheol, where you are going.
translation:
  language: ru
  text: Всё, что может сделать твоя рука, делай в полную силу, потому что в Шеоле[a], куда ты идёшь, нет ни дела, ни замысла, ни знания, ни мудрости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могиле»; «в мире мёртвых». Еврейское слово «Шеол» в Ветхом Завете обозначает место или состояние умерших.'
    reason: Лексическая альтернатива и пояснение древнееврейского понятия.
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Всё, что
  rationale: Передаёт неограниченное относительное выражение естественно для современного русского языка.
- source_word: תִּמְצָא יָדְךָ
  choice: найдёт рука твоя
  rationale: Сохраняет еврейский образ руки как способности и практической возможности действовать; инверсия поддерживает достоинство библейского регистра.
- source_word: לַעֲשׂוֹת ... עֲשֵׂה
  choice: чтобы сделать, делай
  rationale: Сохраняет повтор корня עשה и усиление, создаваемое повелительной формой.
- source_word: בְּכֹחֲךָ
  choice: в полную силу
  rationale: Естественно выражает действие с применением имеющейся силы, не вводя буквального «всей», которого в еврейском тексте нет.
- source_word: מַעֲשֶׂה
  choice: дело
  rationale: Широкое обозначение деятельности, согласующееся с темой земного действия в первой части стиха.
- source_word: חֶשְׁבּוֹן
  choice: замысел
  rationale: В контексте обозначает обдумывание или планирование; «замысел» естественно входит в перечисление человеческих способностей и занятий.
- source_word: דַעַת
  choice: знание
  rationale: Прямой и устойчивый эквивалент когнитивного значения существительного.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Сохраняет обычное для литературы мудрости широкое значение термина.
- source_word: בִּשְׁאוֹל
  choice: в Шеоле
  rationale: Транслитерация сохраняет древнееврейское представление и не сужает его до физической могилы или позднейшего понятия ада.
- source_word: אֲשֶׁר אַתָּה הֹלֵךְ שָׁמָּה
  choice: куда ты идёшь
  rationale: Естественно передаёт направление движения и продолжающийся характер причастной формы.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых
  rationale: «Шеол» сохраняет смысловой диапазон исходного понятия и не отождествляет его с адом; пояснение в сноске делает термин понятным читателю.
- issue: Характер отсутствующей деятельности в Шеоле
  choice: нет ни дела, ни замысла, ни знания, ни мудрости
  alternative: нет ни работы, ни расчёта, ни познания, ни мудрости
  rationale: Перечень сохранён без попытки согласовать высказывание с более поздними богословскими системами; перевод отражает перспективу и напряжение самого стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образ «рука твоя» намеренно сохранён; остальная формулировка сделана ясной и естественной для обычного читателя.
