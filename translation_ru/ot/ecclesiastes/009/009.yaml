  text: רְאֵ֨ה חַיִּ֜ים עִם אִשָּׁ֣ה אֲשֶׁר אָהַ֗בְתָּ כָּל יְמֵי֙ חַיֵּ֣י הֶבְלֶ֔/ךָ אֲשֶׁ֤ר נָֽתַן לְ/ךָ֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כֹּ֖ל יְמֵ֣י הֶבְלֶ֑/ךָ כִּ֣י ה֤וּא חֶלְקְ/ךָ֙ בַּֽ/חַיִּ֔ים וּ/בַ/עֲמָ֣לְ/ךָ֔ אֲשֶׁר אַתָּ֥ה עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/009.yaml
  text: Enjoy life with the wife whom you love all the days of your fleeting life that he has given you under the sun—all your fleeting days—for that is your portion in life and in your labor at which you toil under the sun[a][b][c].
translation:
  language: ru
  text: Наслаждайся жизнью с женой, которую любишь, во все дни твоей быстротечной жизни, которые он дал тебе под солнцем, — во все твои быстротечные дни, — потому что это твоя доля в жизни и в труде, над которым ты трудишься под солнцем.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидь жизнь с женой, которую любишь». Еврейское выражение «увидеть жизнь» может означать переживать жизнь и наслаждаться ею.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово хе́вель часто переводят как «суета», «тщета» или «пар». Здесь оно подчёркивает мимолётный, призрачный характер жизни.
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте подлежащее глагола «дал» прямо не названо. Более широкий контекст указывает на Бога, хотя в этой фразе он не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה חַיִּים
  choice: Наслаждайся жизнью
  rationale: Буквально «увидь жизнь», но в этом сочетании выражение означает переживать жизнь и пользоваться её благами. «Наслаждайся жизнью» естественно передаёт идиоматический призыв.
- source_word: עִם אִשָּׁה אֲשֶׁר אָהַבְתָּ
  choice: с женой, которую любишь
  rationale: Хотя у אִשָּׁה нет артикля, личное обращение и определительное придаточное указывают на супругу адресата. Перфект אָהַבְתָּ в данном наставлении естественно передаётся настоящим временем.
- source_word: חַיֵּי הֶבְלֶךָ / יְמֵי הֶבְלֶךָ
  choice: твоей быстротечной жизни / твои быстротечные дни
  rationale: הֶבֶל буквально связано с дыханием или паром и в Екклесиасте выражает мимолётность, неуловимость и тщету. «Быстротечный» здесь сохраняет акцент на краткости, не сводя смысл к полной бессмысленности.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: которые Он дал тебе
  rationale: Подлежащее при глаголе мужского рода единственного числа не названо; контекст указывает на Бога. Местоимение сохраняет эту неявность, а прописная буква помогает современному русскому читателю распознать контекстуального референта.
- source_word: כִּי הוּא חֶלְקְךָ
  choice: потому что это твоя доля
  rationale: חֵלֶק обозначает выделенную человеку долю или удел. «Доля» естественна по-русски и сохраняет образ назначенной части.
- source_word: וּבַעֲמָלְךָ אֲשֶׁר אַתָּה עָמֵל
  choice: и в труде, которым ты трудишься
  rationale: Повтор корня עמל намеренный и подчёркивает тягостное усилие. Лексический повтор в русском сохраняет риторическую настойчивость оригинала, хотя звучит более marked, чем сглаженное «в трудах твоих».
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: под солнцем
  rationale: Устойчивое выражение Екклесиаста, обозначающее земную жизнь в существующем миропорядке; традиционный и прозрачный русский эквивалент.
theological_decisions:
- issue: Неявное подлежащее при נָתַן
  choice: Сохранить местоимение «Он», не добавляя в основной текст слово «Бог».
  alternative: 'Явно перевести: «которые Бог дал тебе».'
  rationale: Ближайший контекст позволяет понимать подателем Бога, однако в самой фразе имя Бога отсутствует. Местоимение сохраняет сдержанность оригинала; примечание обозначает основание и степень определённости.
- issue: Смысл הֶבֶל применительно к жизни
  choice: Передать как «быстротечная».
  alternative: «Суетная», «тщетная», «подобная пару» или «бессмысленная».
  rationale: 'В данном призыве особенно заметен временной смысл: дни жизни проходят. «Быстротечная» сохраняет напряжение книги, не утверждая, будто жизнь совершенно лишена смысла, что плохо сочеталось бы с призывом принять данную человеку долю.'
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Сохранены характерный повтор «под солнцем», двукратное упоминание быстротечности дней и корневой повтор «труд — трудишься». Длинная фраза организована тире так, чтобы повтор читался как настойчивое пояснение, а не как случайная тавтология.
