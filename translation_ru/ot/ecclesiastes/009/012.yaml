language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֡י גַּם֩ לֹֽא יֵדַ֨ע הָ/אָדָ֜ם אֶת עִתּ֗/וֹ כַּ/דָּגִים֙ שֶׁ/נֶּֽאֱחָזִים֙ בִּ/מְצוֹדָ֣ה רָעָ֔ה וְ/כַ֨/צִּפֳּרִ֔ים הָ/אֲחֻז֖וֹת בַּ/פָּ֑ח כָּ/הֵ֗ם יֽוּקָשִׁים֙ בְּנֵ֣י הָֽ/אָדָ֔ם לְ/עֵ֣ת רָעָ֔ה כְּ/שֶׁ/תִּפּ֥וֹל עֲלֵי/הֶ֖ם פִּתְאֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/012.yaml
  text: 'For man does not even know his time: like fish that are caught in a cruel net[a], and like birds that are caught in a snare, so the sons of man are trapped at an evil time[c][b], when it suddenly falls upon them.'
translation:
  language: ru
  text: 'Ибо человек не знает даже своего времени: как рыбы, пойманные в губительную сеть, и как птицы, пойманные в силок, так и люди попадают в ловушку во время бедствия, когда оно внезапно обрушивается на них.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָדָם
  choice: человек
  rationale: Единственное число употреблено обобщённо; русское «человек» естественно сохраняет и форму, и отнесённость ко всему человечеству.
- source_word: עִתּוֹ
  choice: своего часа
  rationale: «Час» в данном контексте естественно обозначает неизвестный человеку момент, который его постигнет, не уточняя, идёт ли речь именно о смерти или о бедствии.
- source_word: מְצוֹדָה רָעָה
  choice: губительной сетью
  rationale: Буквально прилагательное означает «злая/плохая», но применительно к сети указывает на её пагубность для пойманной рыбы; «губительная» передаёт смысл без приписывания сети нравственного зла.
- source_word: צִפֳּרִים
  choice: птицы
  rationale: Прямой и естественный русский эквивалент широкого обозначения птиц.
- source_word: פָּח
  choice: силок
  rationale: «Силок» — ясное современное обозначение ловушки для птиц и сохраняет конкретный образ оригинала.
- source_word: יֽוּקָשִׁים
  choice: оказываются в ловушке
  rationale: Пассивная форма выражает внезапное попадание в западню; выбранная формулировка понятна современному читателю и поддерживает образы сети и силка.
- source_word: בְּנֵי הָאָדָם
  choice: люди
  rationale: Это устойчивое древнееврейское обозначение человеческих существ; буквальное «сыны человека» в современном русском звучало бы неестественно и могло бы ошибочно исключать женщин.
- source_word: לְעֵת רָעָה
  choice: в тяжёлый час
  rationale: Фраза буквально говорит о «злом/бедственном времени». «Тяжёлый час» естественно передаёт момент бедствия и сохраняет перекличку с «своим часом» в начале стиха.
- source_word: כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם
  choice: когда он настигает их
  rationale: Женский глагол соотносится с עֵת («время, час»). Местоимение «он» отсылает к русскому слову «час», а «настигает» идиоматично передаёт ниспадение бедственного времени на людей; наречие «внезапно» перенесено в предыдущую часть предложения для естественного русского порядка слов.
theological_decisions:
- issue: Обобщённое הָאָדָם и идиома בְּנֵי הָאָדָם
  choice: «человек» в единственном числе и «люди» во множественном
  alternative: «род человеческий» и «сыны человеческие»
  rationale: Так сохраняется переход оригинала от обобщённого единственного числа к коллективному обозначению, но без архаичного или потенциально сужающего смысл русского оборота.
- issue: Значение «своего часа»
  choice: Не уточнять, является ли это часом смерти, суда или бедствия
  alternative: «час своей смерти» или «час бедствия»
  rationale: Оригинал оставляет עִתּוֹ семантически широким; последующий образ бедственного времени направляет понимание, но не оправдывает внесение более узкого определения в текст.
- issue: Референт женского תִּפּוֹל
  choice: Отнести местоимение к «часу»
  alternative: 'Явно добавить «беда»: «когда беда внезапно обрушивается на них»'
  rationale: Грамматически глагол, вероятнее всего, отсылает к עֵת. Местоименная передача сохраняет эту связь и не вводит отсутствующее в заключительной фразе существительное.
translation_notes:
  register: Современный литературный русский с достоинством текста мудрости. Синтаксис сделан плавным и ясным; сохранены сравнения с рыбами и птицами, внезапность бедствия и смысловая перекличка двух упоминаний времени. Архаизмы «сыны человеческие» и буквальное «злая сеть» устранены как неестественные или вводящие в заблуждение.
