revisions:
- from: Ведь человек не знает даже своего часа. Как рыбы, пойманные губительной сетью, и как птицы, попавшие в силок, так и люди внезапно оказываются в ловушке в тяжёлый час, когда он настигает их.
  to: 'Ибо человек не знает даже своего времени: как рыбы, пойманные в губительную сеть, и как птицы, пойманные в силок, так и люди попадают в ловушку во время бедствия, когда оно внезапно обрушивается на них.'
  rationale: Исправлен синтаксический охват «внезапно», чтобы оно характеризовало внезапное наступление бедственного времени, как в еврейском тексте. «Ибо» поддерживает современный литературный, но не разговорный регистр. Выражение «время бедствия» сохраняет неоднозначность первого «своего времени» и не добавляет конкретизации вроде смерти или суда.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:28:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: сохранены обобщённое «человек», образы рыб и птиц, сеть и силок, а также бедственный характер времени. Однако פִּתְאֹם («внезапно») в оригинале относится к падению/наступлению бедственного времени на людей, а не непосредственно к их попаданию в ловушку. Это различие следует сохранить в синтаксисе перевода.'
  naturalness: Текст в основном литературен и понятен. «Ведь» несколько разговорнее, чем требуется для спокойного афористического регистра Екклесиаста; «Ибо» уместнее. Формула «в тяжёлый час, когда он настигает их» возможна, но перенос «внезапно» в предшествующую часть ослабляет заключительный удар оригинала.
  terminology: «Губительная сеть» удачно передаёт רָעָה в данном образном контексте; «силок» точно и естественно передаёт פָּח. «Люди» — адекватная современная передача בְּנֵי הָאָדָם. «Время бедствия» ясно раскрывает бедственный смысл עֵת רָעָה без доктринального уточнения.
  issues:
  - severity: medium
    issue: Наречие «внезапно» синтаксически перенесено к «оказываются в ловушке».
    rationale: В еврейском כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם означает «когда оно внезапно падает/обрушивается на них», где женский глагол, вероятно, соотнесён с עֵת («время»). В переводе внезапность должна быть выражена в заключительном придаточном.
  - severity: low
    issue: «Ведь» слегка снижает литературный регистр.
    rationale: כִּי здесь естественно передать союзом «ибо», который лучше соответствует связному мудростному рассуждению.
