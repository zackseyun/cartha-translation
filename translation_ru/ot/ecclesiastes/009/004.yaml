base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/004.yaml
  text: For whoever is joined to all the living has hope[b][a], because a living dog is better than a dead lion.
translation:
  language: ru
  text: 'Ведь у всякого, кто принадлежит к числу живых, есть надежда[a][b]: живая собака лучше мёртвого льва.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Тот, кто избран среди всех живых, имеет уверенность». Еврейская форма в начале стиха трудна и допускает разные толкования.'
    reason: alternative_reading
  - marker: b
    text: Слово «надежда» можно перевести также как «уверенность» или «безопасность».
    reason: lexical_alternative
lexical_decisions:
- source_word: יבחר
  choice: остаётся
  rationale: Форма в еврейском тексте трудна; в данном контексте речь, по-видимому, идёт о человеке, который всё ещё принадлежит к миру живых. «Остаётся» естественно передаёт эту мысль по-русски, не затемняя противопоставление жизни и смерти; буквальная возможность «избран» отмечена в сноске.
- source_word: אֶל כָּל הַחַיִּים
  choice: среди живых
  rationale: Оборот обозначает принадлежность к совокупности живых. Русское «среди живых» передаёт эту связь естественно; «ещё» выражает подразумеваемое контекстом продолжающееся пребывание в живых.
- source_word: בִּטָּחוֹן
  choice: надежда
  rationale: Существительное может означать также уверенность или чувство безопасности, но здесь жизнь противопоставлена смерти как состояние, при котором ещё остаются возможности. Поэтому в основном тексте выбрано «надежда», а лексические альтернативы приведены в сноске.
- source_word: לְכֶלֶב חַי
  choice: живая собака
  rationale: Прямой и естественный русский эквивалент, сохраняющий простоту афористического сравнения.
- source_word: טוֹב מִן
  choice: лучше
  rationale: Обычная сравнительная конструкция; краткая форма сохраняет пословичную выразительность.
- source_word: הָאַרְיֵה הַמֵּת
  choice: мёртвого льва
  rationale: 'В русском обобщённое противопоставление естественно выражается без указательного или определительного элемента: живая собака сопоставляется с мёртвым львом.'
theological_decisions:
- issue: Смысл начального оборота с יבחר
  choice: кто ещё остаётся среди живых
  alternative: кто избран среди всех живых
  rationale: Согласный текст допускает понимание от обычного глагола «избирать», однако такая фраза в контексте затруднительна. Контекст и древние свидетельства поддерживают смысл принадлежности к живым. Основной перевод передаёт преимущество всякой продолжающейся жизни перед смертью, а подлинная текстово-лексическая неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и афористичным звучанием. Оборот «у всякого, кто…» сохраняет универсальность высказывания, а вторая половина стиха передана лаконично, как пословичное сравнение.
