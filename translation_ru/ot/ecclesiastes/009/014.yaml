base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/014.yaml
  text: There was a small city[a], and few men were in it; and a great king came against it, surrounded it, and built great siegeworks against it.
translation:
  language: ru
  text: Был небольшой город[a], и мужчин в нём было мало. К нему подошёл великий царь, окружил его и возвёл против него большие осадные сооружения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «маленький город».'
    reason: Лексическая альтернатива для קְטַנָּה; «небольшой» естественно в современном русском повествовании.
  - marker: b
    text: 'Или: «большие укрепления против него» или «большие осадные насыпи против него». Еврейское מְצוֹדִים может в более широком смысле обозначать осадные сооружения или укрепления.'
    reason: Сохраняет лексическую неоднозначность מְצוֹדִים в военном контексте.
lexical_decisions:
- source_word: עִיר קְטַנָּה
  choice: небольшой город
  rationale: Передаёт обычное значение עִיר и малый размер, обозначенный קְטַנָּה; естественно звучит по-русски и сохраняет контраст с великим царём.
- source_word: וַאֲנָשִׁים בָּהּ מְעָט
  choice: и людей в нём было мало
  rationale: אֲנָשִׁים в данном повествовательном обобщении может обозначать жителей или людей; русское «людей» естественно и не добавляет отсутствующего в тексте уточнения о воинах.
- source_word: וּבָא אֵלֶיהָ
  choice: к нему подошёл
  rationale: Буквально выражает приближение к городу, тогда как враждебная цель ясно следует из окружения и осадных сооружений; перевод не делает имплицитное нападение излишне явным.
- source_word: מֶלֶךְ גָּדוֹל
  choice: великий царь
  rationale: Сохраняет прямое значение גָּדוֹל и риторический контраст между небольшим городом и великим царём.
- source_word: וְסָבַב אֹתָהּ
  choice: окружил его
  rationale: В военном контексте סבב естественно означает окружение города.
- source_word: וּבָנָה עָלֶיהָ
  choice: и возвёл против него
  rationale: «Возвёл» естественно сочетается с сооружениями, а «против него» передаёт направленность осадного строительства, выраженную עַל.
- source_word: מְצוֹדִים גְּדֹלִים
  choice: огромные осадные сооружения
  rationale: מְצוֹדִים допускает широкое обозначение осадных или укрепительных конструкций; «осадные сооружения» сохраняет широту термина, а «огромные» передаёт גְּדֹלִים и избегает стилистически неловкого повтора «великий… великие».
