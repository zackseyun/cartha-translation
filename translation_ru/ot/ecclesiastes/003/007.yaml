  text: עֵ֤ת לִ/קְר֨וֹעַ֙ וְ/עֵ֣ת לִ/תְפּ֔וֹר עֵ֥ת לַ/חֲשׁ֖וֹת וְ/עֵ֥ת לְ/דַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/007.yaml
  text: a time to tear[a], and a time to sew; a time to keep silent, and a time to speak[b];
translation:
  language: ru
  text: время разрывать[a] и время сшивать; время молчать[b] и время говорить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, речь идёт о разрывании одежды в знак горя, потрясения или скорби, однако в еврейском тексте объект действия не назван.
    reason: cultural_note
  - marker: b
    text: 'Или: «хранить молчание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: время
  rationale: Передаёт как момент, так и период времени и сохраняет повторяющийся ритм поэтических противопоставлений.
- source_word: לִקְרוֹעַ
  choice: разрывать
  rationale: Глагол означает «рвать, разрывать», нередко — одежду. Выбор сохраняет возможный намёк, не добавляя отсутствующий в еврейском тексте объект.
- source_word: לִתְפּוֹר
  choice: сшивать
  rationale: Точно передаёт значение «шить, сшивать» и образует естественную антитезу глаголу «разрывать», не вводя более узкого толкования «чинить».
- source_word: לַחֲשׁוֹת
  choice: молчать
  rationale: Естественный русский эквивалент со значением пребывания в молчании; сохраняет лаконичность строки.
- source_word: לְדַבֵּר
  choice: говорить
  rationale: Обычный и стилистически уместный эквивалент, прямо противопоставленный молчанию.
