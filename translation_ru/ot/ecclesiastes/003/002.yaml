  source_fidelity: 'Текст точно передаёт четыре инфинитивные конструкции и их параллелизм: «время» для עֵת, «рождаться/рожать» для лָלֶדֶת, «умирать» для לָמוּת, «сажать» для לָטַעַת и «вырывать с корнем посаженное» для לַעֲקוֹר נָטוּעַ. Сноска уместно сохраняет возможное активное значение первого инфинитива, не навязывая один вариант там, где форма и контекст допускают обсуждение.'
