  text: עֵ֥ת לָ/לֶ֖דֶת וְ/עֵ֣ת לָ/מ֑וּת עֵ֣ת לָ/טַ֔עַת וְ/עֵ֖ת לַ/עֲק֥וֹר נָטֽוּעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/002.yaml
  text: A time to be born[a], and a time to die; a time to plant, and a time to uproot what is planted.
translation:
  language: ru
  text: 'Время рождаться[a] и время умирать; время сажать и время вырывать с корнем посаженное.


    [a] Или: «рожать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рожать».'
    reason: 'Лексическая и грамматическая неоднозначность לָלֶדֶת: в данном противопоставлении уместно «рождаться», но форма может означать и «рожать».'
lexical_decisions:
- source_word: עֵת
  choice: время
  rationale: Слово обозначает время или назначенный срок; «время» естественно сохраняет повторяющуюся поэтическую формулу отрывка.
- source_word: לָלֶדֶת
  choice: рождаться
  rationale: В противопоставлении смерти речь естественно понимается как о начале жизни человека. При этом еврейская форма допускает значение «рожать», поэтому оно сохранено в сноске.
- source_word: לָמוּת
  choice: умирать
  rationale: Точное и естественное соответствие глаголу מות; образует смысловую противоположность рождению.
- source_word: לָטַעַת
  choice: сажать
  rationale: Глагол נטע означает сажать растения; простой русский инфинитив сохраняет буквальный земледельческий образ.
- source_word: לַעֲקוֹר
  choice: вырывать с корнем
  rationale: Выражение ясно передаёт действие עקר — извлекать или вырывать укоренившееся, не сужая образ до корчевания пней либо кустарника.
- source_word: נָטוּעַ
  choice: посаженное
  rationale: Субстантивированное причастие передаёт пассивное значение еврейской формы без добавления отсутствующего в оригинале существительного.
theological_decisions: []
