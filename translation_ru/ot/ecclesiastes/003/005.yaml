  text: עֵ֚ת לְ/הַשְׁלִ֣יךְ אֲבָנִ֔ים וְ/עֵ֖ת כְּנ֣וֹס אֲבָנִ֑ים עֵ֣ת לַ/חֲב֔וֹק וְ/עֵ֖ת לִ/רְחֹ֥ק מֵ/חַבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/005.yaml
  text: A time to throw stones[a], and a time to gather stones; a time to embrace, and a time to refrain from embracing.
translation:
  language: ru
  text: время бросать камни[a] и время собирать камни; время обнимать и время воздерживаться от объятий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «время разбрасывать камни и время собирать камни». Еврейский образ можно понимать буквально; некоторые толкователи понимают его и переносно — в связи с человеческими отношениями, земледелием или войной.'
    reason: Лексическая альтернатива для глагола «бросать» и указание на сохранённую неоднозначность образа без навязывания толкования.
lexical_decisions:
- source_word: עֵת
  choice: время
  rationale: Слово обозначает момент или период времени; «время» естественно сохраняет повторяющуюся поэтическую формулу отрывка.
- source_word: לְהַשְׁלִיךְ
  choice: разбрасывать
  rationale: Порода Hiphil глагола שלך означает «бросать, отбрасывать». В сочетании с множественным числом «камни» несовершенный вид «разбрасывать» естественно передаёт действие и образует точную антитезу глаголу «собирать».
- source_word: אֲבָנִים
  choice: камни
  rationale: Обычное конкретное значение אֶבֶן — «камень»; перевод сохраняет еврейский образ, не уточняя его возможный переносный смысл.
- source_word: כְּנוֹס
  choice: собирать
  rationale: Инфинитив от כנס означает «собирать, сводить вместе»; «собирать» кратко и естественно противопоставлено разбрасыванию.
- source_word: לַחֲבוֹק
  choice: обнимать
  rationale: Глагол חבק значит «обнимать»; выбранное слово литературно, понятно и допускает как буквальный, так и более широкий смысл.
- source_word: לִרְחֹק מֵחַבֵּק
  choice: уклоняться от объятий
  rationale: Буквально конструкция выражает удаление от обнимания. «Уклоняться от объятий» естественно передаёт намеренное воздержание и сохраняет связь с предшествующим «обнимать».
theological_decisions:
- issue: Смысл образа разбрасывания и собирания камней
  choice: Сохранён буквальный и неоднозначный образ без истолкования в основном тексте.
  alternative: Раскрыть его как указание на человеческие отношения, земледелие либо войну.
  rationale: Еврейский текст не определяет сферу применения образа, поэтому конкретное толкование необоснованно устранило бы его многозначность.
translation_notes:
  register: Современный литературный русский язык; сохранены лаконичный параллелизм, повтор слова «время» и точка с запятой между двумя смысловыми парами. Строка начинается со строчной буквы, поскольку представляет собой продолжение синтаксического ряда Екклесиаста 3:2–8.
