base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/016.yaml
  text: And I also saw under the sun that in the place of justice[a], there was wickedness, and in the place of righteousness, there was wickedness.
translation:
  language: ru
  text: 'И ещё я увидел под солнцем: на месте правосудия — нечестие, и на месте справедливости — нечестивый.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «нечестивый». В первой части стиха употреблено другое слово: «нечестие». Некоторые понимают вторую форму как абстрактное «нечестие» вследствие параллелизма.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְעוֹד
  choice: И ещё
  rationale: Передаёт добавочный характер нового наблюдения, не создавая лишнего оттенка повторения.
- source_word: רָאִיתִי
  choice: я увидел
  rationale: Сохраняет конкретный язык личного наблюдения, характерный для Екклесиаста.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Точно и естественно передаёт устойчивое выражение книги о земной сфере человеческой жизни.
- source_word: מְקוֹם הַמִּשְׁפָּט
  choice: на месте правосудия
  rationale: מִשְׁפָּט обозначает суд, судебное решение или справедливое правосудие; выбранный вариант сохраняет и институциональный, и нравственный смысл.
- source_word: שָׁמָּה
  choice: —
  rationale: Указательное значение «там, именно на этом месте» естественно выражено по-русски конструкцией с тире после оборота «на месте…».
- source_word: הָרֶשַׁע / הָרָשַׁע
  choice: беззаконие
  rationale: В контексте судебной и нравственной испорченности «беззаконие» передаёт абстрактное зло и сохраняет параллелизм обеих частей стиха.
- source_word: וּמְקוֹם הַצֶּדֶק
  choice: и на месте правды
  rationale: «Правда» естественно передаёт צֶדֶק как нравственную правоту и сохраняет отличие от מִשְׁפָּט («правосудие»), не устраняя смыслового пересечения.
theological_decisions:
- issue: Соотношение צֶדֶק и מִשְׁפָּט
  choice: צֶדֶק передано как «правда», а מִשְׁפָּט — как «правосудие»
  alternative: Передать צֶדֶק как «справедливость» или оба слова близкими производными от «справедливый»
  rationale: В еврейском тексте употреблены два разных, хотя и пересекающихся по смыслу слова. Разные русские соответствия сохраняют риторическую структуру и более широкий нравственный оттенок צֶדֶק, не навязывая специального богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, афористичным ритмом. Тире естественно воспроизводит резкое противопоставление ожидаемого правосудия и обнаруженного беззакония.
