  yaml_path: translation/ot/ecclesiastes/003/013.yaml
  text: And also that every man should eat and drink and see good in all his labor—this is the gift of God[a][b].
translation:
  language: ru
  text: И то, что каждый человек ест и пьёт и наслаждается благом во всём своём труде, — дар Божий[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытывает благо»; буквально: «видит добро».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: 'И ещё: чтобы'
  rationale: Сочетание союза и частицы добавляет эту мысль к предыдущей; двоеточие естественно связывает вводную конструкцию с её содержанием.
- source_word: כָּל הָאָדָם
  choice: каждый человек
  rationale: Форма единственного числа употреблена обобщённо и дистрибутивно. В современном русском «каждый человек» точно передаёт всеобщность без ошибочного ограничения только мужчинами.
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: чтобы ... ел и пил
  rationale: Конструкция с שֶׁ передаёт содержание того, что дано человеку; русская форма с «чтобы» сохраняет синтаксическую зависимость и не усиливает значение до нравственного предписания.
- source_word: וְרָאָה טוֹב
  choice: и видел добро
  rationale: Буквальный образ «видеть добро» сохранён; при этом в контексте возможен идиоматический смысл «наслаждаться благом», отмеченный в сноске.
- source_word: בְּכָל עֲמָלוֹ
  choice: во всём своём труде
  rationale: «Труд» передаёт עָמָל как напряжённую человеческую работу, а предлог «во» сохраняет конструкцию исходного текста и её смысловую широту.
- source_word: מַתַּת אֱלֹהִים הִיא
  choice: это дар Божий
  rationale: Указательное «это» соотносит дар со всей предшествующей ситуацией; краткая именная конструкция естественна и сохраняет акцент на Боге как Подателе.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: каждый человек
  alternative: каждый мужчина
  rationale: В данном высказывании אָדָם обозначает человека как представителя всего человечества, а не только взрослого мужчину; русский вариант сохраняет эту всеобщность.
- issue: Характер человеческого блага как Божьего дара
  choice: это дар Божий
  alternative: это один из даров Бога
  rationale: Исходная именная конструкция определяет описанную возможность как исходящую от Бога, не вводя отсутствующего в тексте количественного уточнения «один из».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранён ключевой образ «видеть добро» и синтаксическая связь с предшествующим контекстом; архаизмы и конфессионально окрашенные уточнения не добавлены.
