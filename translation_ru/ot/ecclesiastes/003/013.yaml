    rationale: В русском «чтобы» обычно требует управляющего слова. Номинализация «то, что» делает отнесение всей описанной реальности к Божьему дару ясным, не меняя смысла.
  revised_text: И то, что каждый человек ест и пьёт и наслаждается благом во всём своём труде, — дар Божий[a].
