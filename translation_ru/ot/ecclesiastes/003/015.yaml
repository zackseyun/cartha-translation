base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/015.yaml
  text: What has been already is[a], and what is to be has already been; and God seeks what has been driven away.
translation:
  language: ru
  text: Что было, то уже есть; и что будет, уже было; а Бог ищет то, что было прогнано[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог ищет преследуемое»; возможно также: «Бог призывает прошлое к ответу». Последняя часть еврейского текста трудна для понимания: она может говорить о том, что было прогнано или преследуется, либо о том, что ушло в прошлое.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Что было
  rationale: Обобщающая формула охватывает всё бывшее и сохраняет краткий, афористичный строй еврейского текста.
- source_word: כְּבָר
  choice: уже
  rationale: Передаёт предшествование и поддерживает параллелизм двух первых частей стиха.
- source_word: הוּא
  choice: то … есть
  rationale: Местоимение служит сказуемой связкой в безглагольном предложении; русская соотносительная конструкция «что…, то…» ясно и естественно выражает этот смысл.
- source_word: וַאֲשֶׁר לִהְיוֹת
  choice: и что будет
  rationale: Естественно передаёт направленность инфинитивной конструкции в будущее, не утяжеляя фразу буквальным «тому, что должно быть».
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В контексте Екклесиаста форма обозначает единого Бога; это обычный и контекстуально точный русский эквивалент.
- source_word: יְבַקֵּשׁ
  choice: отыскивает
  rationale: Сохраняет основное значение «искать», при этом приставка подчёркивает поиск исчезнувшего или удалённого, не превращая выражение в однозначно судебную формулу.
- source_word: אֶת נִרְדָּף
  choice: то, что было прогнано
  rationale: Передаёт пассивно-результативный оттенок причастия нифаля от רדף («преследовать, гнать») и согласуется с контекстом повторяющихся событий. Неясность других возможных смыслов вынесена в примечание.
theological_decisions:
- issue: Смысл выражения וְהָאֱלֹהִים יְבַקֵּשׁ אֶת נִרְדָּף
  choice: а Бог отыскивает то, что было прогнано
  alternative: «Бог ищет преследуемое»; «Бог взыскивает за прошлое»
  rationale: Еврейская фраза предельно сжата и допускает понимание как поиска прогнанного или преследуемого, так и обращения Бога к прошедшему, возможно с оттенком суда. Основной текст сохраняет лексический образ, не навязывая учения о суде или вечном повторении; существенно иные толкования отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и афористичным синтаксисом. Союз «а» перед последней частью обозначает смысловой поворот. Необычный образ «было прогнано» намеренно сохранён, поскольку более гладкая формулировка преждевременно устранила бы неясность оригинала.
