  text: כִּי֩ מִקְרֶ֨ה בְֽנֵי הָ/אָדָ֜ם וּ/מִקְרֶ֣ה הַ/בְּהֵמָ֗ה וּ/מִקְרֶ֤ה אֶחָד֙ לָ/הֶ֔ם כְּ/מ֥וֹת זֶה֙ כֵּ֣ן מ֣וֹת זֶ֔ה וְ/ר֥וּחַ אֶחָ֖ד לַ/כֹּ֑ל וּ/מוֹתַ֨ר הָ/אָדָ֤ם מִן הַ/בְּהֵמָה֙ אָ֔יִן כִּ֥י הַ/כֹּ֖ל הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/019.yaml
  text: 'For the fate of the sons of man and the fate of the beast is one fate for them: as this one dies[a], so dies that one, and one breath is for all. Man has no advantage over the beast, for all is vapor.'
translation:
  language: ru
  text: 'Потому что участь сынов человеческих и участь животных — одна и та же: как умирает один, так умирает и другой; и у всех одно дыхание[a]. Нет у человека преимущества перед животным, потому что всё — пар.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и у всех один дух». Еврейское слово רוּחַ может означать «дыхание», «ветер» или «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרֶה
  choice: участь
  rationale: Передаёт то, что выпадает на долю живого существа, особенно общий исход — смерть; звучит естественно и не предполагает безличного фатализма.
- source_word: בְנֵי הָאָדָם
  choice: сыны человеческие
  rationale: Сохраняет образную форму еврейского выражения и его обобщённое значение; форма «сынов» обусловлена родительным падежом после слова «участь».
- source_word: הַבְּהֵמָה
  choice: животные
  rationale: Еврейское единственное число имеет собирательное значение; русское множественное число ясно обозначает животных вообще.
- source_word: וּמִקְרֶה אֶחָד לָהֶם
  choice: одна и та же
  rationale: Естественно по-русски выражает буквальную мысль об одной общей участи людей и животных.
- source_word: כְּמוֹת זֶה כֵּן מוֹת זֶה
  choice: как умирают одни, так умирают и другие
  rationale: Сохраняет уравновешенный параллелизм и ясно относит две стороны сравнения к людям и животным.
- source_word: רוּחַ
  choice: дыхание
  rationale: В контексте общей смертности обозначает жизненное дыхание; возможное значение «дух» сохранено в примечании.
- source_word: מוֹתָר
  choice: преимущество
  rationale: Точно выражает отсутствие превосходства или выгоды человека в рассматриваемом отношении.
- source_word: הָאָדָם
  choice: человек
  rationale: Представительное единственное число естественно противопоставляет человека животному и имеет обобщённый смысл.
- source_word: הֶבֶל
  choice: пар
  rationale: Сохраняет конкретную метафору чего-то мимолётного, неуловимого и непрочного, важную для книги Екклесиаста.
theological_decisions:
- issue: Значение רוּחַ при сопоставлении людей и животных
  choice: дыхание
  alternative: дух
  rationale: Ближайший контекст подчёркивает общую смертность и общую жизненную силу, не разрешая окончательно вопрос о духовной природе человека; альтернативное значение указано в сноске.
- issue: Обобщённый смысл אָדָם / בְנֵי הָאָדָם
  choice: сыны человеческие ... человек
  alternative: люди ... человечество
  rationale: Так сохраняются и образная форма первого выражения, и представительное единственное число второго, без сужения смысла только до мужчин.
- issue: Смысл הֶבֶל
  choice: пар
  alternative: суета; тщета
  rationale: Конкретная метафора сохраняет многозначность слова — мимолётность, неуловимость и непрочность — вместо сведения его к одной отвлечённой идее.
translation_notes:
  register: Современный литературный русский язык с достоинством и афористичностью. Синтаксический параллелизм оригинала сохранён, но собирательное единственное הַבְּהֵמָה передано естественным русским множественным числом. Метафора «пар» последовательно удерживает предметный образ הֶבֶל.
