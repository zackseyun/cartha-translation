  yaml_path: translation/ot/ecclesiastes/003/009.yaml
  text: What profit has the worker from that in which he labors?[a]
translation:
  language: ru
  text: Какая выгода тому, кто трудится, от того, над чем он трудится?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Какая польза тому, кто трудится, от того, над чем он трудится?»'
    reason: 'Лексическая альтернатива: יִתְרוֹן также может передаваться словом «польза».'
lexical_decisions:
- source_word: מַה
  choice: Какая
  rationale: Вводит краткий риторический вопрос; согласование с существительным «выгода» естественно передаёт еврейскую конструкцию.
- source_word: יִתְרוֹן
  choice: выгода
  rationale: Ключевое для Екклесиаста слово обозначает прибыль, излишек или преимущество, остающееся человеку; «выгода» сохраняет экономический оттенок и хорошо звучит по-русски.
- source_word: הָעֹשֶׂה
  choice: работающему
  rationale: Субстантивированное причастие буквально означает «делающему»; в сочетании с עָמֵל речь идёт о человеке, занятом трудом. Форма «работающему» сохраняет причастный характер выражения.
- source_word: בַּאֲשֶׁר
  choice: от того, над чем
  rationale: Предлог с относительным словом указывает на дело или область труда. Русская конструкция ясно выражает источник предполагаемой выгоды, не сводя смысл только к оплате.
- source_word: הוּא
  choice: он
  rationale: Самостоятельно в переводе не выражено, поскольку русское «работающему… он трудится» было бы тяжеловесным; род и число сохраняются формой «трудится», а субъект однозначно восстанавливается.
- source_word: עָמֵל
  choice: трудится
  rationale: Передаёт напряжённый, обременительный труд, характерный для עמל, и естественно сочетается с «над чем».
theological_decisions:
- issue: Обобщающее мужское единственное число
  choice: работающему… трудится
  alternative: работающим… они трудятся
  rationale: Еврейский текст использует мужское единственное число как обобщающее. Русский перевод сохраняет эту форму без искусственной гендерно-нейтральной замены.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и риторическая. «Выгода» сохраняет сквозной экономический образ книги, а «трудится» — оттенок тяжёлого труда. Слово «работающему» употреблено субстантивированно и звучит несколько возвышенно, но остаётся понятным обычному читателю.
