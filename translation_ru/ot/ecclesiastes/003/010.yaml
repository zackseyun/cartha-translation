lexical_decisions:
- source_word: רָאִיתִי
  choice: Я увидел
  rationale: Форма qal, перфект, 1-е лицо единственного числа. Русское прошедшее совершенного вида естественно передаёт итог осмысленного наблюдения говорящего.
- source_word: הָעִנְיָן
  choice: дело
  rationale: В Екклесиасте слово обозначает занятие, труд или возложенное на человека дело, нередко тягостное. «Дело» сохраняет широту значения и звучит естественно по-русски.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: которое Бог дал
  rationale: Прямо передаёт относительное предложение и представляет человеческое занятие как данное Богом.
- source_word: לִבְנֵי הָאָדָם
  choice: сынам человеческим
  rationale: Сохраняет образное строение древнееврейского выражения, которое здесь обозначает людей вообще. Оборот понятен в русском библейском регистре и не сводит значение только к отдельным мужчинам.
- source_word: לַעֲנוֹת בּוֹ
  choice: чтобы они были заняты им
  rationale: Передаёт вероятное контекстуальное значение — быть занятыми данным делом, — но не усиливает основной текст до однозначного страдания; более тяжёлые оттенки сохранены в примечании.
theological_decisions:
- issue: Значение לַעֲנוֹת בּוֹ
  choice: чтобы они были заняты им
  alternative: чтобы оно изнуряло их; чтобы они трудились над ним
  rationale: Древнееврейское выражение неоднозначно и может указывать как на занятость делом, так и на тяготу или изнурительный труд. Основной текст сохраняет нейтрально-тягостный оттенок, а примечание не позволяет устранить напряжение.
- issue: Передача לִבְנֵי הָאָדָם
  choice: сынам человеческим
  alternative: людям; человеческому роду
  rationale: Выбран формально близкий, традиционно понятный оборот с собирательным значением всего человечества; он не вводит учения о какой-либо особой группе людей.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским оборотом «сынам человеческим». Синтаксис простой и ясный; лексическая неоднозначность заключительной фразы сохранена в примечании.
