base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/021.yaml
  text: Who knows whether the spirit of the sons of man goes upward[b][a], and whether the spirit of the beast goes down to the earth?
translation:
  language: ru
  text: Кто знает, восходит ли дух людей[a][b] ввысь и сходит ли дух животного вниз, к земле?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дух сынов человека»; это выражение относится к людям вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дыхание» — в обоих случаях; еврейское רוּחַ допускает здесь пересекающиеся значения «дух» и «дыхание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Кто знает
  rationale: Прямо передаёт риторический вопрос и сохраняет выраженную в стихе неопределённость, не усиливая его до «кто может знать» или «кто знает наверняка».
- source_word: רוּחַ
  choice: дух
  rationale: В контексте смерти и различной участи людей и животных слово обозначает жизненное начало; «дух» сохраняет широту значения, тогда как возможное «дыхание» отмечено в сноске.
- source_word: בְּנֵי הָאָדָם
  choice: людей
  rationale: Естественно передаёт собирательное значение буквально мужского древнееврейского выражения «сыны человека», относящегося ко всему человечеству.
- source_word: הָעֹלָה הִיא לְמָעְלָה
  choice: восходит ... ввысь
  rationale: Сохраняет причастную идею движения вверх и стилистически соответствует параллельному «сходит ... вниз».
- source_word: וְרוּחַ הַבְּהֵמָה
  choice: и ... дух животного
  rationale: Единственное число в древнееврейском имеет обобщающий смысл; «животного» в современном русском нейтральнее и точнее, чем «зверя».
- source_word: הַיֹּרֶדֶת הִיא לְמַטָּה לָאָרֶץ
  choice: сходит ... вниз, в землю
  rationale: Передаёт направленность движения и сохраняет контраст между «ввысь» и «в землю», включая мотив возвращения к земле.
theological_decisions:
- issue: Утверждает ли стих различную посмертную участь человека и животного или выражает неуверенность
  choice: 'Риторический вопрос: «Кто знает, восходит ли... и сходит ли...»'
  alternative: 'Утвердительное чтение: дух человека восходит, а дух животного сходит в землю'
  rationale: Начальное מִי יוֹדֵעַ естественно вводит вопрос о доступности такого знания. Перевод не превращает богословское напряжение текста в категорическое учение.
- issue: Распространяется ли вопросительная модальность на обе параллельные части
  choice: Повторить «ли» при обоих глаголах
  alternative: Выразить вопросительность только в начале фразы
  rationale: Хотя во второй части отдельной вопросительной частицы нет, вся сопоставительная конструкция находится в сфере вопроса; повтор «ли» делает это ясным по-русски без изменения смысла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, но понятной лексикой. Формы «восходит» и «сходит» поддерживают поэтический параллелизм; вопросительная конструкция сохраняет исходную неопределённость.
