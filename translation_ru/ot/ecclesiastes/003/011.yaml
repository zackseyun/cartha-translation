id: ECC.3.11
reference: Ecclesiastes 3:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֶת הַ/כֹּ֥ל עָשָׂ֖ה יָפֶ֣ה בְ/עִתּ֑/וֹ גַּ֤ם אֶת הָ/עֹלָם֙ נָתַ֣ן בְּ/לִבָּ֔/ם מִ/בְּלִ֞י אֲשֶׁ֧ר לֹא יִמְצָ֣א הָ/אָדָ֗ם אֶת הַֽ/מַּעֲשֶׂ֛ה אֲשֶׁר עָשָׂ֥ה הָ/אֱלֹהִ֖ים מֵ/רֹ֥אשׁ וְ/עַד סֽוֹף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/011.yaml
  text: He has made everything beautiful in its time. He has also put eternity in their heart[a], yet so that man cannot find out the work that God has done from beginning to end.
translation:
  language: ru
  text: Он всё сделал прекрасным в своё время. Он также вложил вечность в сердца людей[a], но человек всё же не может постичь дело, которое Бог совершил от начала до конца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мир», «век». Еврейское слово עוֹלָם здесь трудно для однозначного перевода; оно может указывать на осознание всей протяжённости времени или мира за пределами непосредственного человеческого опыта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: всё
  rationale: Передаёт всеохватность еврейского выражения и естественно относится ко всему, что Бог создаёт или устраивает.
- source_word: יָפֶה
  choice: прекрасным
  rationale: Сохраняет основной образ красоты и одновременно допускает контекстуальный оттенок уместности, согласованности с назначенным временем.
- source_word: בְעִתּוֹ
  choice: в своё время
  rationale: Соответствует теме назначенных времён в главе и сохраняет соотнесённость каждого дела с его временем.
- source_word: הָעֹלָם
  choice: вечность
  rationale: Передаёт данное человеку сознание временного горизонта, выходящего за пределы настоящего, не устраняя при этом трудность и многозначность слова; альтернативы отмечены в сноске.
- source_word: בְּלִבָּם
  choice: в сердца людей
  rationale: Еврейское «сердце» обозначает внутреннего человека, включая разум и волю. Такая формулировка естественна по-русски и ясно передаёт множественный суффикс и общечеловеческий смысл.
- source_word: מִבְּלִי אֲשֶׁר לֹא
  choice: но … всё же не может
  rationale: 'Передаёт ограничение и контраст: данный Богом широкий горизонт не позволяет человеку исчерпывающе постичь Божье дело. Формулировка не навязывает спорное понимание этой конструкции как прямого указания на цель.'
- source_word: הָאָדָם
  choice: человек
  rationale: Сохраняет единственное число и родовое, общечеловеческое значение существительного.
- source_word: יִמְצָא
  choice: постичь
  rationale: В данном контексте речь идёт не о физическом нахождении, а о полном исследовании и понимании Божьего дела.
- source_word: הַמַּעֲשֶׂה
  choice: дело
  rationale: Единственное число собирательно обозначает всю деятельность Бога и естественно сочетается с последующим определительным оборотом.
- source_word: מֵרֹאשׁ וְעַד סוֹף
  choice: от начала до конца
  rationale: Точно и идиоматично передаёт меризм, обозначающий полный охват.
theological_decisions:
- issue: Значение הָעֹלָם в связи с человеческим знанием и Божьим владычеством
  choice: В основном тексте — «вечность»
  alternative: «мир», «век»; возможно, осознание всей протяжённости времени или мира за пределами непосредственного опыта
  rationale: «Вечность» сохраняет напряжение между данным человеку сознанием чего-то большего, чем настоящее мгновение, и его неспособностью исчерпывающе постичь всё Божье дело. Поскольку еврейское слово здесь толкуется по-разному, альтернативы вынесены в сноску.
- issue: Характер человеческой неспособности постичь Божье дело
  choice: Ограничение передано без утверждения, что Бог вложил вечность именно с целью воспрепятствовать познанию
  alternative: «так что человек не может» или «чтобы человек не мог»
  rationale: Еврейская конструкция допускает оттенок результата или ограничения. Русское «но … всё же не может» сохраняет богословское напряжение и не превращает неоднозначную связь в однозначное указание на Божью цель.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный, без архаизмов. Повтор «Он» во втором предложении устраняет возможную неясность субъекта. Формулировка сохраняет традиционное «прекрасным», а сноска — подлинную неоднозначность ключевого еврейского слова.
