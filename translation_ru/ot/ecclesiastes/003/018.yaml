  yaml_path: translation/ot/ecclesiastes/003/018.yaml
  text: I said in my heart concerning the sons of man, that God is testing them, and to show them that they themselves are beasts.
translation:
  language: ru
  text: 'Я сказал в своём сердце о сынах человеческих[a]: Бог испытывает их, чтобы они увидели[b], что они сами — животные.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о людях». Еврейское выражение имеет мужскую форму, но употреблено в общем, представительном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и увидеть»; возможно также: «и дать им увидеть». Оборот можно понимать как выражение цели: «чтобы они увидели»; синтаксис еврейского текста допускает разные способы связать его с предыдущими словами.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Я сказал в своём сердце
  rationale: Сохранён еврейский образ внутренней речи; выражение понятно по-русски и соответствует созерцательному стилю Екклесиаста.
- source_word: עַל דִּבְרַת בְּנֵי הָאָדָם
  choice: о сынах человеческих
  rationale: Оборот עַל דִּבְרַת вводит предмет размышления, а традиционно понятное «сыны человеческие» сохраняет мужскую форму и собирательное значение исходного выражения.
- source_word: לְבָרָם הָאֱלֹהִים
  choice: Бог испытывает их
  rationale: Редкая форма от ברר допускает значение проверки, испытания или выявления; «испытывает» ясно передаёт смысл, не добавляя идеи наказания.
- source_word: וְלִרְאוֹת
  choice: чтобы они увидели
  rationale: Формально оборот означает «и увидеть», но в данном контексте естественно выражает цель или результат Божьего испытания — люди должны увидеть своё положение. Буквальная синтаксическая возможность отмечена в сноске.
- source_word: שֶׁהֵם בְּהֵמָה הֵמָּה לָהֶם
  choice: что сами по себе они — животные
  rationale: Именное сказуемое передано прямо, без смягчающего «подобны». «Сами по себе» передаёт эмфатическое повторение местоимения и значение לָהֶם; «животные» сохраняет смысл בְּהֵמָה, избегая непредусмотренной бранной окраски русского «скот».
theological_decisions:
- issue: Прямое отождествление людей с животными в контексте смертности
  choice: «они — животные»
  alternative: «они подобны животным»
  rationale: В еврейском тексте нет сравнительной частицы. Прямое сказуемое сохраняет напряжение мысли Екклесиаста о человеческой смертности и тварности, не отрицая и не разъясняя здесь иных библейских утверждений о человеке.
- issue: Представительное мужское выражение בְּנֵי הָאָדָם
  choice: «сыны человеческие»
  alternative: «люди»
  rationale: Основной текст сохраняет грамматическую и образную форму источника; общеохватное значение разъясняется в сноске.
- issue: Субъект и значение וְלִרְאוֹת
  choice: «чтобы они увидели»
  alternative: «и увидеть» / «и дать им увидеть»
  rationale: Контекст позволяет понимать инфинитив как цель испытания, при которой люди осознают собственное состояние. Поскольку форма допускает и более буквальный разбор, неоднозначность явно сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «в своём сердце» и выражение «сыны человеческие» намеренно сохраняют образы оригинала; остальной синтаксис сделан ясным для современного читателя.
