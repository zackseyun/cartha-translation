  text: время любить и время ненавидеть; время войне и время миру.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵת
  choice: время
  rationale: Слово обозначает момент или период времени; повтор «время» естественно сохраняет ритм и синтаксический рисунок еврейского стихотворения.
- source_word: לֶאֱהֹב
  choice: любить
  rationale: Инфинитив глагола אָהֵב прямо обозначает любовь и образует антитезу с «ненавидеть».
- source_word: לִשְׂנֹא
  choice: ненавидеть
  rationale: Прямое соответствие обычному значению שָׂנֵא; намеренно сохранена резкая поэтическая антитеза без истолковывающего смягчения.
- source_word: מִלְחָמָה
  choice: войне
  rationale: מִלְחָמָה означает войну или вооружённый конфликт. Дательный падеж в безличной конструкции «время войне» звучит естественно и сохраняет именной характер еврейской фразы.
- source_word: שָׁלוֹם
  choice: миру
  rationale: Хотя שָׁלוֹם может означать также благополучие и целостность, непосредственное противопоставление войне указывает здесь на мир как отсутствие войны.
theological_decisions:
- issue: Нравственный смысл слова «ненавидеть» в контексте мудростной антитезы
  choice: Сохранить в основном тексте прямое «ненавидеть».
  alternative: Передать как «противиться», «быть враждебным» или «не любить».
  rationale: Стих перечисляет различные времена человеческой жизни, а не формулирует безусловную заповедь ненавидеть. Прямой перевод сохраняет напряжённость еврейского текста и не вносит толкование в основной текст.
translation_notes:
  register: 'Современный литературный русский язык с лаконичным, возвышенным ритмом. Параллелизм оригинала сохранён: две глагольные и две именные конструкции. Начальная строчная буква предполагает продолжение единого поэтического перечня в Екклесиасте 3:2–8.'
