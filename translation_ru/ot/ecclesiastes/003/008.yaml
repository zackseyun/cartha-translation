  naturalness: Фраза звучит как современный литературный русский в намеренно лаконичном, поэтическом регистре. Конструкция «время войне и время миру» несколько возвышенна, но устойчива и особенно уместна в ритмическом перечне Екклесиаста; она не требует добавления «для». Строчная начальная буква оправдана продолжением единого списка в 3:2–8.
