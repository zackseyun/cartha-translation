  yaml_path: translation/ot/ecclesiastes/003/001.yaml
  text: For everything there is a season[a], and a time for every matter under the heavens.
translation:
  language: ru
  text: Всему свой срок, и всякому делу[a] под небесами — своё время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занятию», «замыслу». Еврейское חֵפֶץ может обозначать дело, занятие, желание или намерение.'
