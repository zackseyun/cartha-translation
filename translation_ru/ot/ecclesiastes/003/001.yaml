lexical_decisions:
- source_word: לַכֹּל
  choice: всему
  rationale: Краткая и естественная передача всеохватного значения לְ + כֹּל; сохраняет поэтический параллелизм со словами «всякому делу».
- source_word: זְמָן
  choice: свой срок
  rationale: זְמָן обозначает установленный или подходящий период. «Срок» отличает это слово от следующего עֵת, а «свой» естественно выражает соотнесённость времени с каждой вещью, подразумеваемую конструкцией.
- source_word: וְעֵת
  choice: и … своё время
  rationale: עֵת — обычное слово со значением «время», «пора», «случай». Перевод сохраняет близкий, но не тождественный параллелизм с זְמָן.
- source_word: לְכָל חֵפֶץ
  choice: всякому делу
  rationale: В данном контексте חֵפֶץ охватывает дела, занятия и происходящее в человеческой жизни. «Дело» звучит широко и естественно, не навязывая существительному исключительно телеологический смысл.
- source_word: תַּחַת הַשָּׁמָיִם
  choice: под небесами
  rationale: Передаёт пространственный образ и множественную форму שָׁמַיִם, сохраняя характерное для Екклесиаста обозначение земной сферы.
theological_decisions:
- issue: Следует ли переводить חֵפֶץ как «цель» или «замысел», тем самым подчёркивая преднамеренную цель каждого события
  choice: дело
  alternative: цель; замысел; занятие
  rationale: Само слово допускает значения, связанные с желанием, намерением, занятием или делом, но здесь не требует утверждения, что у каждого события явно задана цель. «Дело» сохраняет широту и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Эллипсис связки «есть» и тире во второй половине сохраняют достоинство и поэтический параллелизм оригинала; «под небесами» удерживает возвышенный библейский образ без архаизации.
