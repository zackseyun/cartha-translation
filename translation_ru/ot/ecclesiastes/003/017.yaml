    rationale: Конечное שָׁם следует сохранить, но буквальное «есть время там» в русском воспринимается как грамматически и стилистически натянуто. Перенос в «ибо там есть время...» сохраняет неясность того, к чему относится наречие, без искусственной конструкции.
