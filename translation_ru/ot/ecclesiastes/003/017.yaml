base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/017.yaml
  text: I said in my heart[a], “God will judge the righteous and the wicked[b], for there is a time for every matter and for every deed there.”
translation:
  language: ru
  text: 'Я сказал в своём сердце: «Бог будет судить и праведного, и нечестивого, ибо там есть время для всякого замысла и для всякого дела».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «там». Это слово может указывать на место или обстоятельство Божьего суда; его точный смысл здесь неясен. «Замысел» и «дело» также можно передать как «намерение» и «труд».'
    reason: textual_ambiguity_and_lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Я сказал в своём сердце
  rationale: Сохраняет еврейский образ внутренней речи и при этом понятно в современном литературном русском.
- source_word: אֶת הַצַּדִּיק וְאֶת הָרָשָׁע
  choice: и праведного, и нечестивого
  rationale: Передаёт субстантивированные прилагательные и подчёркивает охват обеих нравственных категорий.
- source_word: יִשְׁפֹּט הָאֱלֹהִים
  choice: Бог будет судить
  rationale: Имперфект в контексте выражает ожидаемый будущий Божий суд.
- source_word: כִּי
  choice: потому что
  rationale: Ясно передаёт основание предшествующего утверждения.
- source_word: עֵת לְכָל חֵפֶץ
  choice: для всякого дела есть время
  rationale: חֵפֶץ здесь допускает значения «дело», «замысел», «намерение»; «дело» естественно связано с темой времени в главе и не устраняет многозначность полностью.
- source_word: וְעַל כָּל הַמַּעֲשֶׂה
  choice: и для всякого поступка
  rationale: В контексте суда «поступок» передаёт нравственно оцениваемое человеческое действие; предлог עַל в трудной конструкции передан идиоматично.
- source_word: שָׁם
  choice: там
  rationale: Сохранено буквальное наречие в конечной позиции, чтобы не устранять неясность его связи с местом или обстоятельством Божьего суда.
theological_decisions:
- issue: Связь конечного שָׁם с Божьим судом
  choice: Сохранить «там» в конце высказывания.
  alternative: Опустить «там» либо истолковать его как «тогда» или «на суде».
  rationale: Масоретский текст явно содержит שָׁם, но его точное указание остаётся неясным. Буквальная передача сохраняет смысловое напряжение и не навязывает толкование.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Оборот «в своём сердце» намеренно сохраняет исходную метафору; конечное «там» звучит необычно, но необходимо для передачи подлинной неясности еврейского текста.
