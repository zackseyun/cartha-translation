  source_fidelity: 'Смысл в целом передан верно: внутреннее размышление, будущий Божий суд над праведным и нечестивым и сохранённое конечное שָׁם. Однако «дело» для חֵפֶץ недостаточно ясно передаёт значение «замысел/намерение», а «есть время там» представляет собой неестественный для современного русского порядок слов.'
  naturalness: «Я сказал в своём сердце» допустимо в литературно-библейском регистре. Оборот «для всякого дела и для всякого поступка есть время там» звучит искусственно; «там есть время для всякого замысла и для всякого дела» остаётся понятным и при этом не уточняет референт наречия «там».
  terminology: «Праведного» и «нечестивого», а также «Бог будет судить» передают исходные нравственные категории и будущий оттенок имперфекта удачно. «Замысел» для חֵפֶץ и «дело» для מַעֲשֶׂה лучше сохраняют различие двух слов и соответствуют нейтральному литературному регистру.
