id: ECC.3.20
reference: Ecclesiastes 3:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/כֹּ֥ל הוֹלֵ֖ךְ אֶל מָק֣וֹם אֶחָ֑ד הַ/כֹּל֙ הָיָ֣ה מִן הֶֽ/עָפָ֔ר וְ/הַ/כֹּ֖ל שָׁ֥ב אֶל הֶ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/020.yaml
  text: All go to one place[a]. All came from the dust[b], and all return to the dust.
translation:
  language: ru
  text: Всё идёт в одно место. Всё произошло из праха[a], и всё возвращается в прах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё было из праха».'
    reason: lexical_alternative
  - marker: b
    text: «Прах» напоминает о смертности и перекликается с Быт. 3:19.
    reason: cross_reference
lexical_decisions:
- source_word: הַכֹּל
  choice: всё
  rationale: Повторяющееся собирательное выражение охватывает и людей, и животных из ближайшего контекста. «Всё» сохраняет всеобщий охват и согласуется с единственным числом еврейских сказуемых.
- source_word: הוֹלֵךְ
  choice: идёт
  rationale: Причастная форма выражает постоянно действующую, общую закономерность; настоящее время естественно для изречения такого рода.
- source_word: מָקוֹם אֶחָד
  choice: одно место
  rationale: Прямая передача выражения без уточнения, что именно представляет собой это место; тем самым сохраняется сдержанность оригинала.
- source_word: הָיָה מִן הֶעָפָר
  choice: произошло из праха
  rationale: Буквально конструкция означает «было из праха», но по-русски «произошло из праха» естественно выражает происхождение и образует ясную параллель с возвращением в прах. Более буквальная форма отмечена в сноске.
- source_word: עָפָר
  choice: прах
  rationale: «Прах» — естественное для литературного и библейского русского языка обозначение земли как начала и конца смертного тела; оно также сохраняет отзвук Бытия 3:19.
- source_word: שָׁב אֶל הֶעָפָר
  choice: возвращается в прах
  rationale: «Возвращается» точно передаёт обратное движение к исходному состоянию и сохраняет параллелизм происхождения и конца.
theological_decisions:
- issue: Кого охватывает «всё» в контексте
  choice: Высказывание передаёт общую смертную участь людей и животных, не делая дополнительного утверждения о посмертном существовании.
  alternative: Понимать стих только как обобщение о людях либо как отрицание любого различия после смерти.
  rationale: В Екклесиасте 3:18–21 сопоставляются люди и животные и подчёркивается их общий телесный удел. Перевод не снимает богословского напряжения и не добавляет вывода, которого данный стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским словом «прах». Краткий параллелизм и троекратное «всё» сохранены; формулировка понятна без конфессиональных уточнений.
