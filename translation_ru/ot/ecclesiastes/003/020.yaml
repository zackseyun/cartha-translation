  source_fidelity: 'Текст точно передаёт три параллельных утверждения еврейского оригинала: «всё» идёт в одно место, было/произошло из праха и возвращается в прах. «Одно место» не получает лишнего истолкования. «Произошло из праха» — допустимая идиоматическая передача הָיָה מִן־הֶעָפָר в контексте происхождения и возврата; буквальная альтернатива корректно вынесена в сноску.'
  naturalness: Перевод краток, ритмичен и естественен для современного литературного русского. Повтор «всё» уместно сохраняет композицию оригинала. Слово «прах» имеет умеренно библейскую окраску, но остаётся понятным и хорошо соответствует контексту смертности.
  terminology: '«Прах» удачно передаёт עָפָר и сохраняет отзвук Быт. 3:19 без навязывания богословского вывода. Формы «идёт», «произошло» и «возвращается» согласованы по смыслу и передают обобщённое наблюдение текста. Сноски правильно привязаны: [a] относится к формулировке происхождения, [b] — к межтекстовому отзвуку слова «прах».'
