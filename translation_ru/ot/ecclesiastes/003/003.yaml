  text: עֵ֤ת לַ/הֲרוֹג֙ וְ/עֵ֣ת לִ/רְפּ֔וֹא עֵ֥ת לִ/פְר֖וֹץ וְ/עֵ֥ת לִ/בְנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/003.yaml
  text: a time to kill[a], and a time to heal; a time to tear down[b], and a time to build up.
translation:
  language: ru
  text: время убивать и время исцелять; время разрушать[a] и время строить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «время проламывать и время строить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: время
  rationale: עֵת обозначает время, пору или подходящий момент. «Время» естественно по-русски и сохраняет повторяющийся ритм стихотворения.
- source_word: לַהֲרוֹג
  choice: убивать
  rationale: Инфинитив הרג прямо означает «убивать». Такой перевод сохраняет резкость еврейского текста и не превращает описание жизненных противоположностей в их нравственное одобрение.
- source_word: לִרְפּוֹא
  choice: исцелять
  rationale: רפא означает «исцелять, лечить». «Исцелять» передаёт широкое восстановительное значение и образует ясную противоположность слову «убивать».
- source_word: לִפְרֹוץ
  choice: разрушать
  rationale: פרץ может означать «проламывать, разрушать». В противопоставлении глаголу «строить» речь, вероятнее всего, идёт о разрушении сооружения; «разрушать» ясно и естественно передаёт этот смысл.
- source_word: לִבְנוֹת
  choice: строить
  rationale: בנה прямо означает «строить». Русское «строить» естественно образует антитезу с «разрушать», не требуя дополнительного элемента.
theological_decisions:
- issue: Следует ли смягчать выражение «время убивать» из-за нравственной трудности
  choice: Сохранить «убивать» как элемент описательного перечня противоположностей у Кохелета
  alternative: «умерщвлять» или более мягкая перефразировка
  rationale: Текст перечисляет времена и обстоятельства человеческой жизни, но прямо не объявляет каждое названное действие нравственно правильным. Смягчение устранило бы напряжение, присутствующее в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная конструкция сохраняет параллелизм оригинала. Инфинитивы несовершенного вида естественно передают отвлечённые виды действия в поэтическом перечне.
