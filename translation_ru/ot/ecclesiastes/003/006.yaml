  text: a time to seek[a], and a time to lose; a time to keep[b], and a time to throw away.
translation:
  language: ru
  text: время искать и время терять[a]; время хранить и время выбрасывать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «время разыскивать и время признавать потерянным»; возможен также смысл «время уничтожать».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «время хранить и время отбрасывать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: время
  rationale: Существительное обозначает время или подходящий момент. Повтор «время» сохраняет ритм и параллелизм поэтического ряда.
- source_word: לְבַקֵּשׁ
  choice: искать
  rationale: Пиэльный инфинитив בקשׁ обычно означает «искать, разыскивать». Краткое «искать» естественно сочетается с последующим противопоставлением.
- source_word: לְאַבֵּד
  choice: терять
  rationale: Пиэль אבד может выражать уничтожение или утрату. В паре с «искать» естественно понять его как «терять» либо «признавать потерянным»; основной текст сохраняет лаконизм исходной строки, а примечание отмечает контекстуальную альтернативу.
- source_word: לִשְׁמוֹר
  choice: хранить
  rationale: שׁמר может означать «хранить, беречь, охранять». В противопоставлении выбрасыванию «хранить» наиболее ёмко передаёт сохранение чего-либо у себя.
- source_word: לְהַשְׁלִיךְ
  choice: выбрасывать
  rationale: Каузативный инфинитив שלך означает бросать или отбрасывать. Здесь, в противопоставлении «хранить», современное «выбрасывать» естественно передаёт избавление от ненужного.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного ритма и парных противопоставлений еврейского текста. Союз «и» внутри обеих пар передан без лишних пояснений.
