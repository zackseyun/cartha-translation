source:
  edition: WLC
  text: יָדַ֗עְתִּי כִּ֠י כָּל אֲשֶׁ֨ר יַעֲשֶׂ֤ה הָ/אֱלֹהִים֙ ה֚וּא יִהְיֶ֣ה לְ/עוֹלָ֔ם עָלָי/ו֙ אֵ֣ין לְ/הוֹסִ֔יף וּ/מִמֶּ֖/נּוּ אֵ֣ין לִ/גְרֹ֑עַ וְ/הָ/אֱלֹהִ֣ים עָשָׂ֔ה שֶׁ/יִּֽרְא֖וּ מִ/לְּ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/014.yaml
  text: I know that whatever God does will endure forever; there is nothing to add to it[a], and there is nothing to take from it. God has done it so that they may fear before him.
translation:
  language: ru
  text: 'Я знаю: всё, что делает Бог, пребудет вовеки. К этому нечего прибавить и от этого нечего убавить. Бог сделал это, чтобы люди испытывали перед Ним страх[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытывали перед Ним благоговейный трепет».'
    reason: 'Лексическая альтернатива: ירא по отношению к Богу может обозначать как страх, так и благоговейный трепет.'
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Перфект ידע выражает достигнутое и сохраняющееся осознание говорящего; настоящее время естественно передаёт это состояние по-русски.
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה הָאֱלֹהִים
  choice: всё, что делает Бог
  rationale: Сочетание כָּל אֲשֶׁר имеет всеобщий охват, а форма יַעֲשֶׂה здесь естественно выражает то, что Бог совершает вообще.
- source_word: הוּא יִהְיֶה לְעוֹלָם
  choice: пребудет вовеки
  rationale: Передаёт буквальную идею непреходящего существования Божьего дела в достойном и понятном русском регистре.
- source_word: עָלָיו אֵין לְהוֹסִיף
  choice: к этому нечего прибавить
  rationale: Сохраняет направление עָלָיו («к этому») и безличную конструкцию невозможности или отсутствия возможности прибавления.
- source_word: וּמִמֶּנּוּ אֵין לִגְרֹעַ
  choice: и от этого нечего убавить
  rationale: Глагол גרע означает уменьшать, убавлять; формулировка сохраняет параллелизм с предшествующей строкой.
- source_word: וְהָאֱלֹהִים עָשָׂה
  choice: Бог сделал так
  rationale: Перфект передаёт совершённое действие, а «так» естественно связывает его с последующим придаточным цели.
- source_word: שֶׁיִּרְאוּ
  choice: чтобы люди боялись
  rationale: Форма множественного числа имеет неопределённый человеческий субъект, который в русском необходимо обозначить; «люди» не сужает круг. «Боялись» сохраняет основное значение ירא и его богословское напряжение.
- source_word: מִלְּפָנָיו
  choice: Его
  rationale: В сочетании с русским «бояться» управление винительным/родительным падежом естественно передаёт смысл «бояться перед Ним»; буквальное «перед Ним» здесь менее идиоматично, хотя образ присутствия отражён в сноске.
theological_decisions:
- issue: Смысл страха перед Богом
  choice: боялись Его
  alternative: благоговели перед Ним
  rationale: Еврейское ירא охватывает страх, трепет и благоговение. Основной текст сохраняет более прямое «боялись», не смягчая богословское напряжение; сноска указывает на включённый в слово оттенок благоговения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенными библейскими формами «пребудет» и «вовеки». Синтаксис остаётся ясным для широкого читателя; параллелизм прибавления и убавления сохранён.
