  text: A time to weep[a], and a time to laugh; a time to mourn[b], and a time to dance.
translation:
  language: ru
  text: Время плакать[a] и время смеяться; время скорбеть[b] и время танцевать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пора»; так можно перевести это слово во всём стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оплакивать»; еврейское слово может обозначать также траурный плач, особенно по умершему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: время
  rationale: עֵת обозначает время, пору или подходящий случай. «Время» прямо передаёт повторяющуюся формулу еврейского текста и естественно звучит в русском поэтическом перечислении.
- source_word: לִבְכּוֹת
  choice: плакать
  rationale: Инфинитив от בכה означает «плакать». Это современное и нейтрально-возвышенное слово, образующее ясную антитезу со «смеяться».
- source_word: לִשְׂחוֹק
  choice: смеяться
  rationale: שׂחק здесь имеет прямое значение «смеяться»; перевод сохраняет контраст с плачем, не расширяя смысл до общего ликования.
- source_word: סְפוֹד
  choice: скорбеть
  rationale: ספד означает оплакивать, скорбеть или совершать плач по умершему. «Скорбеть» естественно передаёт траурный смысл, не ограничивая его исключительно формальным обрядом.
- source_word: רְקוֹד
  choice: танцевать
  rationale: רקד означает «танцевать». Инфинитив сохраняет синтаксический параллелизм и контраст со скорбью.
