id: ECC.3.22
reference: Ecclesiastes 3:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/רָאִ֗יתִי כִּ֣י אֵ֥ין טוֹב֙ מֵ/אֲשֶׁ֨ר יִשְׂמַ֤ח הָ/אָדָם֙ בְּֽ/מַעֲשָׂ֔י/ו כִּי ה֖וּא חֶלְק֑/וֹ כִּ֣י מִ֤י יְבִיאֶ֨/נּוּ֙ לִ/רְא֔וֹת בְּ/מֶ֖ה שֶׁ/יִּהְיֶ֥ה אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/022.yaml
  text: So I saw that there is nothing better than that a man should rejoice in his works[a], for that is his portion. For who can bring him to see what will be after him?
translation:
  language: ru
  text: И увидел я, что нет для человека ничего лучше, чем радоваться своим делам, потому что это его доля. Ибо кто даст ему увидеть то, что будет после него?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что произойдёт после его ухода».'
    reason: 'Лексико-смысловой вариант: אַחֲרָיו буквально означает «после него», но в контексте может подразумевать время после ухода человека из жизни.'
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: И увидел я
  rationale: Форма Qal, перфект 1-го лица единственного числа, вводит итоговое наблюдение говорящего. Такой порядок слов сохраняет личный и заключительный характер высказывания и звучит достойно в современном русском.
- source_word: אֵין טוֹב מֵאֲשֶׁר
  choice: нет … ничего лучше, чем
  rationale: Оборот выражает сравнительную оценку, а не утверждение об абсолютном нравственном добре. Русская конструкция передаёт этот смысл естественно.
- source_word: הָאָדָם
  choice: для человека
  rationale: אָדָם употреблено как родовое существительное в единственном числе. «Человек» в русском языке сохраняет единственное число и обобщающий смысл без ненужного сужения до взрослых мужчин.
- source_word: יִשְׂמַח
  choice: радоваться
  rationale: Инфинитив после «чем» естественно передаёт содержание того, что признаётся лучшим, не превращая высказывание в прямое повеление.
- source_word: בְּמַעֲשָׂיו
  choice: своим делам
  rationale: מַעֲשֶׂה охватывает дела, деятельность и труд человека. «Своим делам» сохраняет широту слова и возвратное отношение к подлежащему.
- source_word: חֶלְקוֹ
  choice: его доля
  rationale: חֵלֶק у Екклесиаста обозначает отведённую человеку долю в жизни. «Доля» сохраняет как смысл удела, так и характерную для книги тему.
- source_word: מִי יְבִיאֶנּוּ
  choice: кто приведёт его
  rationale: Hiphil от בוא буквально выражает побуждение прийти или приведение. Формулировка сохраняет образ исходного текста; риторический вопрос подразумевает невозможность для человека самостоятельно получить такое видение.
- source_word: לִרְאוֹת
  choice: чтобы он увидел
  rationale: Целевая конструкция с личной формой звучит по-русски естественнее буквального «приведёт его увидеть», сохраняя значение ראה — «видеть».
- source_word: בְּמֶה שֶׁיִּהְיֶה אַחֲרָיו
  choice: то, что будет после него
  rationale: 'Формулировка близка к еврейской и сохраняет неопределённость: речь может идти о событиях после человека, в том числе после его ухода из жизни, без излишнего уточнения в основном тексте.'
theological_decisions:
- issue: Родовое значение אָדָם в единственном числе
  choice: человек
  alternative: мужчина
  rationale: Здесь говорится о человеке как представителе всего человечества, а не специально о лице мужского пола. Русское «человек» грамматически сохраняет единственное число и мужской род, одновременно ясно передавая универсальный охват.
- issue: Смысл выражения «после него»
  choice: сохранить широкое «то, что будет после него»
  alternative: 'уточнить: «что произойдёт после его смерти»'
  rationale: Еврейский текст не называет смерть прямо. Более широкая формулировка сохраняет напряжение между будущими событиями после человека и явным постмортальным прочтением, не утверждая лишнего.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным синтаксисом. Слова «доля» и «дела» поддерживают ключевую лексику Екклесиаста; неоднозначность заключительной фразы сохранена, а более явное толкование вынесено в сноску.
