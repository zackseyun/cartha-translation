  text: 'Я сделал великими свои дела[a]: построил себе дома, насадил себе виноградники.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я расширил свои дела»; или: «Я умножил свои труды».'
