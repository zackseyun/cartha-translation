lexical_decisions:
- source_word: הִגְדַּלְתִּי
  choice: предпринял великие
  rationale: Каузативная форма глагола גדל указывает на придание делам большого масштаба. По-русски сочетание «предпринял великие дела» естественно передаёт крупный размах последующих строительных и земледельческих начинаний, хотя каузативность выражена менее буквально.
- source_word: מַעֲשָׂי
  choice: дела
  rationale: Слово מַעֲשֶׂה может обозначать дело, труд или свершение. В данном контексте широкое слово «дела» охватывает и строительство, и насаждение виноградников.
- source_word: בָּנִיתִי
  choice: построил
  rationale: Прямой и естественный перевод формы глагола בנה.
- source_word: לִי
  choice: себе
  rationale: Дательный возвратного местоимения передаёт значение личной пользы или принадлежности и сохраняет повтор, присутствующий в еврейском тексте.
- source_word: בָּתִּים
  choice: дома
  rationale: Обычное значение בָּתִּים — «дома»; царский контекст сам по себе не даёт основания уточнять «дворцы».
- source_word: נָטַעְתִּי
  choice: насадил
  rationale: «Насадил» — естественный литературный эквивалент נטע применительно к виноградникам.
- source_word: כְּרָמִים
  choice: виноградники
  rationale: Стандартный русский эквивалент, точно соответствующий сельскохозяйственному контексту.
