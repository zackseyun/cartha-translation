  text: וְ/אָמַ֨רְתִּֽי אֲנִ֜י בְּ/לִבִּ֗/י כְּ/מִקְרֵ֤ה הַ/כְּסִיל֙ גַּם אֲנִ֣י יִקְרֵ֔/נִי וְ/לָ֧/מָּה חָכַ֛מְתִּי אֲנִ֖י אָ֣ז יוֹתֵ֑ר וְ/דִבַּ֣רְתִּי בְ/לִבִּ֔/י שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/015.yaml
  text: And I said in my heart[a], "As happens to the fool, so it will happen to me also. Why then was I more wise?" And I said in my heart that this too is vanity.
translation:
  language: ru
  text: 'И сказал я в сердце своём: «Что случается с глупцом, то случится и со мной. Зачем же я тогда был мудрее?» И сказал я в сердце своём, что и это — суета[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пар», «дуновение»; еврейское הָבֶל — повторяющееся в Екклесиасте слово, обозначающее то, что мимолётно, неуловимо или тщетно.'
    reason: Лексическая альтернатива для ключевого многозначного термина книги; исправлено точное написание еврейского слова.
lexical_decisions:
- source_word: וְאָמַרְתִּי אֲנִי בְּלִבִּי
  choice: И сказал я в сердце своём
  rationale: Сохраняет образ внутренней речи и несколько возвышенный ритм оригинала; в современном литературном русском выражение понятно и уместно для Екклесиаста.
- source_word: כְּמִקְרֵה הַכְּסִיל
  choice: Что случается с глупцом
  rationale: מִקְרֶה обозначает случающееся событие или участь. Формулировка передаёт сравнение, не усиливая его до философски нагруженного понятия «судьба».
- source_word: גַּם אֲנִי יִקְרֵנִי
  choice: то случится и со мной
  rationale: Передаёт тот же корень קָרָה и будущее значение имперфекта, ясно связывая обе части сравнения.
- source_word: הַכְּסִיל
  choice: глупец
  rationale: Обычный термин литературы мудрости для человека, лишённого разумной и нравственной рассудительности.
- source_word: וְלָמָּה חָכַמְתִּי אֲנִי אָז יוֹתֵר
  choice: Зачем же тогда я был мудрее?
  rationale: В контексте вопрос касается пользы или смысла превосходства в мудрости, поэтому русское «зачем» естественно передаёт прагматическую силу לָמָּה; «был мудрее» не навязывает оттенок процесса приобретения мудрости.
- source_word: וְדִבַּרְתִּי בְלִבִּי
  choice: И сказал я в сердце своём
  rationale: Хотя דִבַּרְתִּי буквально означает «говорил», в контексте внутренней речи «сказал» естественнее и сохраняет параллель с началом стиха.
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: что и это — суета
  rationale: «Суета» — традиционное и ёмкое русское соответствие ключевому слову הֶבֶל; оно допускает оттенки мимолётности, неуловимости и тщетности, не сужая значение до полного отсутствия смысла.
theological_decisions:
- issue: Передача ключевого для Екклесиаста слова הָבֶל
  choice: суета
  alternative: пар; дуновение; тщета; бессмысленность
  rationale: «Суета» сохраняет литературную и богословскую многозначность термина. Вариант «бессмысленность» слишком однозначно превращает образ в философское утверждение, тогда как еврейское слово буквально связано с дыханием или паром и в книге может указывать на мимолётность, неуловимость либо тщетность.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и риторического рисунка текста. Инверсия «сказал я» поддерживает стиль внутреннего монолога, оставаясь понятной. Повтор корня «случается / случится» отражает повтор קָרָה. Маркер сноски помещён непосредственно после слова «суета», к которому относится примечание.
