  text: I made for myself pools of water, to irrigate from them a grove sprouting trees.
translation:
  language: ru
  text: Я устроил себе водоёмы, чтобы орошать[b] из них рощу[a], где растут деревья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лес» или «лесистую местность». Еврейское יַעַר может обозначать лес или покрытую деревьями местность; «роща» выбрана с учётом контекста возделываемых и орошаемых насаждений.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поливать». Глагол может означать «давать пить» или, применительно к растениям, «поливать»; «орошать» подчёркивает хозяйственное использование устроенных водоёмов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: Я устроил себе
  rationale: Глагол עשה означает «делать, создавать», а לִי указывает на действие для собственной пользы. «Устроил себе» естественно передаёт создание хозяйственных сооружений и сохраняет направленность действия на самого говорящего.
- source_word: בְּרֵכוֹת מָיִם
  choice: водоёмы
  rationale: בְּרֵכוֹת обозначает бассейны, пруды или резервуары для воды. «Водоёмы» сохраняет конкретный образ, не уточняя без достаточных оснований вид сооружения.
- source_word: לְהַשְׁקוֹת
  choice: орошать
  rationale: Каузативная форма глагола שקה буквально означает «давать пить», а применительно к растениям — «поливать, орошать». Контекст искусственных водоёмов и древесных насаждений поддерживает «орошать».
- source_word: מֵהֶם
  choice: из них
  rationale: Предлог מן с местоименным суффиксом обозначает источник воды и отсылает к упомянутым водоёмам.
- source_word: יַעַר
  choice: рощу
  rationale: יַעַר обычно означает лес или лесистую местность. В контексте намеренно орошаемых царских насаждений «роща» звучит естественно, а более буквальные варианты сохранены в примечании.
- source_word: צוֹמֵחַ עֵצִים
  choice: где растут деревья
  rationale: Причастие צוֹמֵחַ выражает продолжающийся рост или произрастание. Придаточная конструкция ясно и естественно передаёт образ древесной растительности, не навязывая спорного понимания синтаксической связи.
