lexical_decisions:
- source_word: וְגָדַלְתִּי
  choice: И я стал великим
  rationale: Форма Qal от גדל передаёт обретение величия, высокого положения или значимости. «Стал великим» сохраняет личный и результативный смысл без сужения до материального преуспевания.
- source_word: וְהוֹסַפְתִּי מִכֹּל
  choice: и превзошёл всех
  rationale: Hiphil от יסף буквально означает «прибавил, увеличил», но в сочетании со сравнительным מִן выражает превосходство. «Превзошёл» естественно передаёт эту сравнительную силу по-русски.
- source_word: שֶׁהָיָה לְפָנַי
  choice: кто был до меня
  rationale: Формулировка сохраняет временную и сравнительную отсылку к предшественникам, не уточняя без необходимости их статус или число поколений.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Обычная передача местного значения предлога и названия города.
- source_word: אַף
  choice: при этом
  rationale: Частица добавляет сопутствующее утверждение. «При этом» естественно связывает сохранение мудрости с описанным возвышением, не вводя чрезмерного усиления.
- source_word: חָכְמָתִי
  choice: мудрость моя
  rationale: Прямая передача существительного с притяжательным суффиксом; постпозиция местоимения поддерживает достоинство библейского повествовательного регистра.
- source_word: עָמְדָה לִּי
  choice: оставалась со мной
  rationale: Буквальный образ «стояла при/для меня» идиоматически означает, что мудрость сохранялась у говорящего и не покидала его. Выбранная формулировка ясна современному читателю, а буквальный образ отмечен в сноске.
