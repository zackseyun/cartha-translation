source:
  edition: WLC
  text: תַּ֣רְתִּי בְ/לִבִּ֔/י לִ/מְשׁ֥וֹךְ בַּ/יַּ֖יִן אֶת בְּשָׂרִ֑/י וְ/לִבִּ֞/י נֹהֵ֤ג בַּֽ/חָכְמָה֙ וְ/לֶ/אֱחֹ֣ז בְּ/סִכְל֔וּת עַ֣ד אֲשֶׁר אֶרְאֶ֗ה אֵי זֶ֨ה ט֜וֹב לִ/בְנֵ֤י הָ/אָדָם֙ אֲשֶׁ֤ר יַעֲשׂוּ֙ תַּ֣חַת הַ/שָּׁמַ֔יִם מִסְפַּ֖ר יְמֵ֥י חַיֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/003.yaml
  text: I searched in my heart to draw my flesh along with wine[a], while my heart was guiding me with wisdom, and to lay hold of folly[b], until I might see what was good for the sons of man to do under the heavens during the number of the days of their lives.
translation:
  language: ru
  text: Я стал искать в сердце своём, как увлечь вином свою плоть[a], — при том что сердце моё мудро руководило мною, — и как обратиться к безрассудству, пока не увижу, что хорошо делать сынам человеческим[b] под небесами в течение отведённых им дней жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально говорит о том, чтобы «тянуть» или «увлекать» плоть вином; его точный смысл неясен. Возможно, речь идёт об испытании телесного удовольствия от вина при сохранении мудрого самоконтроля.
    reason: lexical_alternative
  - marker: b
    text: 'То есть людям вообще. Еврейский текст буквально говорит: «сынам человека»; это родовое обозначение человечества.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּרְתִּי בְלִבִּי
  choice: Я исследовал в сердце своём
  rationale: Глагол תור передаёт намеренное исследование и испытание, а לֵב обозначает внутренний центр мысли и воли. Формулировка сохраняет рефлексивный и экспериментальный характер речи.
- source_word: לִמְשׁוֹךְ בַּיַּיִן אֶת בְּשָׂרִי
  choice: как увлечь вином свою плоть
  rationale: Необычное сочетание с משׁך («тянуть, увлекать») намеренно не сведено ни к опьянению, ни к простому веселью. «Плоть» сохраняет образ בשר, а не вводит специального нравственно-богословского значения.
- source_word: וְלִבִּי נֹהֵג בַּחָכְמָה
  choice: причём сердце моё мудро руководило мною
  rationale: נהג означает вести или направлять. Добавлен подразумеваемый объект «мною», чтобы фраза была естественной по-русски и показывала сохранение мудрого самоконтроля во время опыта.
- source_word: וְלֶאֱחֹז בְּסִכְלוּת
  choice: и как овладеть безрассудством
  rationale: אחז выражает сознательное схватывание или овладение, а סכלות — тематически противопоставленное мудрости безрассудство.
- source_word: עַד אֲשֶׁר אֶרְאֶה
  choice: пока не увижу
  rationale: Передаёт перспективную цель продолжающегося опыта без превращения её в уже достигнутый вывод.
- source_word: לִבְנֵי הָאָדָם
  choice: сынам человеческим
  rationale: Сохранён мужской родовой образ древнееврейского выражения, при этом сноска разъясняет его общечеловеческий охват.
- source_word: תַּחַת הַשָּׁמַיִם
  choice: под небесами
  rationale: Сохранено множественное число и характерная для Екклесиаста пространственная формула.
- source_word: מִסְפַּר יְמֵי חַיֵּיהֶם
  choice: в течение отведённых им дней жизни
  rationale: Естественная русская формулировка передаёт буквальную идею исчисленного, ограниченного числа дней, не добавляя прямо отсутствующего в тексте определения «немногие».
theological_decisions:
- issue: Родовое значение אָדָם в выражении בְּנֵי הָאָדָם
  choice: сынам человеческим
  alternative: людям / всему человечеству
  rationale: Сохранён исходный образ, но он не истолкован как относящийся только к мужчинам; общечеловеческое значение явно отмечено в сноске.
- issue: Соотношение вина, безрассудства и мудрого руководства
  choice: сохранить напряжение между опытом с вином и продолжающимся мудрым самоконтролем
  alternative: истолковать фразу как полное предание пьянству либо как простое умеренное наслаждение
  rationale: Текст одновременно говорит об увлечении плоти вином, овладении безрассудством и руководстве мудростью; перевод не устраняет этого намеренного напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сделан понятным для обычного читателя, но ключевая неоднозначность трудной фразы о вине и плоти сохранена; архаизирующее выражение «сынам человеческим» оставлено ради исходного образа и пояснено в сноске.
