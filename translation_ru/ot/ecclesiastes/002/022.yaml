  yaml_path: translation/ot/ecclesiastes/002/022.yaml
  text: For what does a man gain from all his labor and from the striving of his heart with which he toils under the sun?[a]
translation:
  language: ru
  text: Ибо что получает человек от всего своего труда и от устремления своего сердца, с которым он трудится под солнцем?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от томления его сердца»; возможно также: «от забот его сердца» или «от занятий его ума». Еврейское слово רַעְיוֹן в книге Екклесиаста может обозначать внутреннее стремление, умственную занятость или мучительную озабоченность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с предыдущей мыслью и сохраняет достоинство книжного рассуждения.
- source_word: מֶה הֹוֶה לָאָדָם
  choice: что достаётся человеку
  rationale: Буквально оборот спрашивает, что бывает или оказывается у человека; «что достаётся» естественно передаёт вопрос о результате труда, не сводя его исключительно к материальной выгоде.
- source_word: בְּכָל עֲמָלוֹ
  choice: от всех его трудов
  rationale: Предлог передан как указание на источник или результат, а עָמָל — как тяжёлый, изнурительный труд. Множественное «трудов» естественно по-русски в сочетании «от всех».
- source_word: וּבְרַעְיוֹן לִבּוֹ
  choice: и от устремлений его сердца
  rationale: רַעְיוֹן допускает значения внутреннего стремления, занятия ума или мучительной озабоченности. «Устремления» сохраняет активный внутренний смысл, а примечание отмечает неоднозначность.
- source_word: לִבּוֹ
  choice: его сердца
  rationale: Сохраняет древнееврейский образ сердца как средоточия мысли, воли и желания, не сужая его до одного лишь рассудка.
- source_word: שֶׁהוּא עָמֵל
  choice: с которыми он трудится
  rationale: Относительное предложение связывает внутренние устремления с трудом человека. Множественное согласование обусловлено естественной русской формой «устремлений».
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохраняет ключевой повторяющийся образ Екклесиаста, обозначающий земную человеческую жизнь.
