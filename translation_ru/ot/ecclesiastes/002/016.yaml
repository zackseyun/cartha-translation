base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/016.yaml
  text: For there is no lasting remembrance of the wise man any more than of the fool[a], since in the days to come everything will already have been forgotten[b]. And how the wise man dies just like the fool!
translation:
  language: ru
  text: 'Ибо ни о мудреце, ни о глупце не останется памяти навеки[a], ибо в грядущие дни всё уже будет забыто. И как же так: мудрец умирает так же, как глупец![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нет памяти о мудреце с глупцом навеки». Здесь выражена общая участь: ни мудрец, ни глупец не сохраняется в памяти навсегда.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «И как умирает мудрец с глупцом!» Это, вероятно, скорбное восклицание о том, что мудрец умирает так же, как глупец.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹן
  choice: помнить
  rationale: Русская глагольная конструкция «не будут помнить» естественно передаёт существительное со значением памяти, воспоминания и посмертной известности.
- source_word: לֶחָכָם / הֶחָכָם
  choice: мудрец
  rationale: Сохраняет мужской род и единственное число еврейского субстантивированного прилагательного и соответствует стилю книги.
- source_word: עִם הַכְּסִיל
  choice: ни мудреца, ни глупца / наравне с глупцом
  rationale: Буквальное «с глупцом» здесь обозначает общность участи; русские конструкции ясно выражают равенство мудреца и глупца в забвении и смерти.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Эксплицитно сохраняет временную характеристику исходного текста; в контексте речь идёт о непреходящей памяти.
- source_word: בְּשֶׁכְּבָר
  choice: в грядущие дни всё уже будет забыто
  rationale: Причинно-временная связь естественно передана двоеточием, а כְּבָר — словом «уже».
- source_word: הַיָּמִים הַבָּאִים
  choice: грядущие дни
  rationale: Достоинный и понятный современный эквивалент выражения «дни, которые приходят».
- source_word: הַכֹּל נִשְׁכָּח
  choice: всё уже будет забыто
  rationale: Будущее пассивное построение передаёт нифаль, а «всё» — собирательное הַכֹּל; наречие «уже» сохраняет כְּבָר.
- source_word: וְאֵיךְ
  choice: И как же так
  rationale: Передаёт не информационный вопрос, а восклицательное, скорбное недоумение Кохелета, не добавляя прямо отсутствующего междометия «увы».
- source_word: יָמוּת
  choice: умирает
  rationale: Настоящее время по-русски естественно выражает общую, неизбежную закономерность.
theological_decisions:
- issue: Равная смертная участь мудреца и глупца
  choice: Сохранено напряжённое восклицание о том, что мудрец умирает наравне с глупцом.
  alternative: Истолковать стих как утверждение о полном равенстве их конечной духовной участи.
  rationale: Текст прямо говорит о смерти и забвении, но сам по себе не определяет посмертную или эсхатологическую участь; перевод не должен добавлять такого вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Мудрец» и «глупец» передают репрезентативные мужские формы оригинала; синтаксис сделан естественным для русского без устранения риторического напряжения финала.
