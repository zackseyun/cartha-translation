base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/019.yaml
  text: And who knows whether he will be wise or foolish? Yet he will rule over all my labor in which I labored and used wisdom under the sun[a]. This too is vanity.
translation:
  language: ru
  text: И кто знает, будет ли он мудрым или глупым? И всё же он будет распоряжаться всем моим трудом, над которым я трудился и в котором проявил мудрость под солнцем[a]. И это тоже суета.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И это тоже дуновение», с акцентом на мимолётность; возможно также: «И это тоже тщета». Еврейское слово «хэвэл» в книге Екклесиаста имеет широкий диапазон значений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי יוֹדֵעַ
  choice: И кто знает
  rationale: Естественно передаёт вопросительную формулу и сохраняет связь с предыдущей мыслью, выраженную союзом וּ.
- source_word: הֶחָכָם יִהְיֶה אוֹ סָכָל
  choice: будет ли он мудрым или глупым
  rationale: Сохраняет косвенный вопрос и прямое противопоставление мудрости и глупости; формулировка естественна для современного русского языка.
- source_word: וְיִשְׁלַט
  choice: А ведь он станет распоряжаться
  rationale: Передаёт реальную власть преемника над результатами труда; «а ведь» выявляет контекстуальное напряжение, не превращая глагол в более жёсткое «господствовать».
- source_word: בְּכָל עֲמָלִי שֶׁעָמַלְתִּי
  choice: всем, над чем я трудился
  rationale: Русская конструкция естественно передаёт объект будущего распоряжения и сохраняет мотив тяжёлого личного труда, хотя буквальное корневое повторение в русском звучало бы громоздко.
- source_word: וְשֶׁחָכַמְתִּי
  choice: и к чему прилагал мудрость
  rationale: Передаёт деятельное применение мудрости, а не только обладание ею, и синтаксически соотносится с результатами труда.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохраняет ключевую и узнаваемую формулу Екклесиаста о земной сфере человеческой жизни.
- source_word: גַּם זֶה הָבֶל
  choice: И это тоже суета
  rationale: «Суета» — устойчивый русский эквивалент ключевого слова книги; примечание сохраняет более конкретный образ пара и смысловой оттенок тщетности.
theological_decisions:
- issue: Передача ключевого слова הֶבֶל в Екклесиасте
  choice: суета
  alternative: пар; тщета
  rationale: «Суета» сохраняет традиционную тематическую связь внутри книги, но не исчерпывает образ мимолётного дыхания или пара и возникающее из него значение тщетности; поэтому диапазон отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены краткость, риторический вопрос и ключевая формула «под солнцем»; архаизмы и конфессионально окрашенные уточнения не вводились.
