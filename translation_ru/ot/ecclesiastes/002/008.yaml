base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/008.yaml
  text: I also gathered for myself silver and gold[a], and the treasure of kings and provinces. I acquired for myself male singers and female singers[b], and the delights of the sons of man—a concubine and concubines.
translation:
  language: ru
  text: Я собрал для себя также серебро и золото, сокровища царей и провинций. Я завёл себе певцов и певиц, а также наслаждения людей[a] — наложницу и наложниц[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наслаждения человечества». Буквально по-еврейски: «наслаждения сынов человеческих».'
    reason: lexical_alternative
  - marker: b
    text: 'Значение переданного так еврейского выражения неясно. Среди предлагаемых вариантов: «любовницу и любовниц», «виночерпиев и виночерпиц» или, в более общем смысле, «всевозможную роскошь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּנַסְתִּי לִי
  choice: собрал для себя
  rationale: Глагол означает собирать, сводить воедино или накапливать; дательный оборот подчёркивает личное приобретение и повторяющуюся в контексте направленность на себя.
- source_word: כֶּסֶף וְזָהָב
  choice: серебро и золото
  rationale: Прямое и естественное обозначение драгоценных металлов как богатства.
- source_word: סְגֻלַּת מְלָכִים וְהַמְּדִינוֹת
  choice: сокровища царей и провинций
  rationale: סְגֻלָּה обозначает особо ценное имущество или сокровище, а מְדִינוֹת — управляемые области, провинции.
- source_word: עָשִׂיתִי לִי
  choice: я завёл себе
  rationale: Буквально широкий глагол «сделал» в данном перечне приобретений идиоматически передаёт обеспечение себя певцами; русский оборот сохраняет личную направленность действия.
- source_word: שָׁרִים וְשָׁרוֹת
  choice: певцов и певиц
  rationale: Парные формы мужского и женского рода прямо обозначают исполнителей обоих полов.
- source_word: תַעֲנוּגֹת בְּנֵי הָאָדָם
  choice: услады сынов человеческих
  rationale: «Услады» передают удовольствия и предметы роскоши, а «сыны человеческие» сохраняют образную и грамматическую форму еврейского выражения, не исключая его общего значения.
- source_word: שִׁדָּה וְשִׁדּוֹת
  choice: наложницу и наложниц
  rationale: Редкое и неясное выражение передано согласно вероятному традиционному пониманию как указание на женщин гарема; необычное сочетание единственного и множественного числа сохранено, а существенная неопределённость отмечена в сноске.
theological_decisions:
- issue: Передача בְּנֵי הָאָדָם
  choice: сынов человеческих
  alternative: людей; человечества
  rationale: Основной текст сохраняет грамматически мужской еврейский образ, но сноска сообщает естественное обобщающее значение, чтобы не ограничивать выражение только мужчинами.
- issue: Толкование неясного שִׁדָּה וְשִׁדּוֹת
  choice: наложницу и наложниц
  alternative: возлюбленную и возлюбленных; виночерпиев и виночерпиц; всевозможную роскошь
  rationale: Контекст царских наслаждений допускает традиционное гаремное понимание, однако уникальность и неясность слова не позволяют выдавать его за несомненное; основные альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Обороты «собрал для себя» и «завёл себе» естественны и сохраняют повторный акцент на личном приобретении. Архаизирующее «сыны человеческие» оставлено ради формы оригинала, но пояснено в сноске. Маркеры сносок поставлены непосредственно после соответствующих спорных выражений.
