source:
  edition: WLC
  text: כִּ֤י לְ/אָדָם֙ שֶׁ/טּ֣וֹב לְ/פָנָ֔י/ו נָתַ֛ן חָכְמָ֥ה וְ/דַ֖עַת וְ/שִׂמְחָ֑ה וְ/לַ/חוֹטֶא֩ נָתַ֨ן עִנְיָ֜ן לֶ/אֱס֣וֹף וְ/לִ/כְנ֗וֹס לָ/תֵת֙ לְ/טוֹב֙ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֔ים גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/026.yaml
  text: For to the man who is good before him he has given wisdom and knowledge and joy[a], but to the sinner he has given the task of gathering and collecting, to give to the one who is good before God[b]. This too is vanity and a chasing after wind.
translation:
  language: ru
  text: Ибо человеку, который хорош в Его глазах,[a] Он даёт мудрость, знание и радость, а грешнику даёт занятие — собирать и накапливать, чтобы отдать тому, кто хорош в глазах Бога. И это — суета и погоня за ветром.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который угоден Ему». Буквально: «который хорош перед Ним».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «стремление за ветром».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: человеку
  rationale: В данном контексте אָדָם обозначает отдельного человека и противопоставлен «грешнику». Русское «человеку» точно передаёт это значение без ненужного указания на пол.
- source_word: שֶׁטּוֹב לְפָנָיו
  choice: который добр в Его глазах
  rationale: Сохраняет значение טוֹב («добр, хорош») и передаёт идиому לִפְנֵי естественным современным русским выражением, не сводя её безоговорочно к значению «угоден».
- source_word: נָתַן
  choice: даёт
  rationale: Настоящее время соответствует обобщающему, назидательно-размышляющему характеру высказывания о постоянном Божьем распределении даров и занятий.
- source_word: חָכְמָה וְדַעַת וְשִׂמְחָה
  choice: мудрость, знание и радость
  rationale: Прямо и естественно передаёт три дара, сохраняя различие между мудростью и знанием и повторяющуюся в Екклесиасте тему радости как Божьего дара.
- source_word: לַחוֹטֶא
  choice: грешнику
  rationale: Причастная форма описывает человека как грешника, создавая прямой контраст с тем, кто добр в глазах Бога.
- source_word: עִנְיָן
  choice: занятие
  rationale: Слово обозначает порученное или выпавшее человеку дело, нередко тягостное. «Занятие» сохраняет нейтральность самого термина, тогда как тщетность раскрывается дальнейшим контекстом.
- source_word: לֶאֱסוֹף וְלִכְנוֹס
  choice: собирать и накапливать
  rationale: Передаёт пару близких по смыслу инфинитивов и подчёркивает накопление имущества, не устраняя их риторический параллелизм.
- source_word: לָתֵת לְטוֹב לִפְנֵי הָאֱלֹהִים
  choice: чтобы отдать тому, кто добр в глазах Бога
  rationale: Сохраняет цель накопления и повтор ключевого оборота о человеке, который «добр» перед Богом; во второй части Бог назван прямо, как и в еврейском тексте.
- source_word: הֶבֶל
  choice: суета
  rationale: «Суета» сохраняет традиционное русское тематическое слово Екклесиаста и передаёт здесь тщетность и мимолётность, не усиливая смысл до абсолютной бессмысленности.
- source_word: רְעוּת רוּחַ
  choice: погоня за ветром
  rationale: Ясно передаёт образ тщетного преследования недостижимого и звучит естественно на современном русском; возможный оттенок «стремления» отмечен в сноске.
theological_decisions:
- issue: Подразумеваемое подлежащее при נָתַן
  choice: Бог — подразумеваемый податель в обеих частях стиха
  alternative: Безличный или неопределённый деятель
  rationale: В ближайшем контексте говорится о том, что приходит «из руки Бога» (2:24), а далее в этом стихе Бог назван прямо. Местоимение «Он» делает естественным по-русски то, что однозначно восстанавливается из контекста.
- issue: Значение выражения טוֹב לִפְנֵי הָאֱלֹהִים
  choice: добр в глазах Бога
  alternative: угоден Богу
  rationale: Основной текст сохраняет оценочное слово טוֹב («добр») и не разрешает полностью возможную смысловую грань «угоден». Идиоматическое толкование приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудростной речи. Синтаксис остаётся ясным для широкого читателя; ключевое «суета» сохранено ради тематической связи всей книги. Заглавное «Его» указывает на Бога как подразумеваемого деятеля, установленного ближайшим контекстом.
