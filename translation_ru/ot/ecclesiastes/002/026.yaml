revisions:
- from: Ибо человеку, который добр в Его глазах,[a] Он даёт мудрость, знание и радость, а грешнику даёт занятие — собирать и накапливать, чтобы отдать тому, кто добр в глазах Бога. И это — суета и погоня за ветром.[b]
  to: Ибо человеку, который хорош в Его глазах,[a] Он даёт мудрость, знание и радость, а грешнику даёт занятие — собирать и накапливать, чтобы отдать тому, кто хорош в глазах Бога. И это — суета и погоня за ветром.[b]
  rationale: Изменены только идиоматическое оформление оценки «хорош в глазах» и альтернативная сноска к образу רְעוּת רוּחַ. Перевод сохраняет повтор формулы, явное упоминание Бога во второй части и тематические термины книги.
