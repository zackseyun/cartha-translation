source:
  edition: WLC
  text: כִּ֧י כָל יָמָ֣י/ו מַכְאֹבִ֗ים וָ/כַ֨עַס֙ עִנְיָנ֔/וֹ גַּם בַּ/לַּ֖יְלָה לֹא שָׁכַ֣ב לִבּ֑/וֹ גַּם זֶ֖ה הֶ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/023.yaml
  text: For all his days are pains[a], and his occupation is vexation; even in the night his heart does not lie down[b]. This too is vapor.
translation:
  language: ru
  text: Ведь все дни его полны страданий, и занятие его — досада; даже ночью сердце его не знает покоя[a]. И это тоже — суета[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сердце его не ложится», то есть не успокаивается и не отдыхает.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пар», «дуновение», «тщета». Еврейское הֶבֶל обозначает дыхание или пар — нечто мимолётное, неуловимое и непрочное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает стих с предшествующим рассуждением и естественно вводит пояснение в современном русском языке.
- source_word: כָל יָמָיו מַכְאֹבִים
  choice: все дни его полны страданий
  rationale: Сохраняет конкретное выражение «все дни его», а именная конструкция передана естественным русским оборотом; множественное מַכְאֹבִים охватывает боль и тяготы.
- source_word: וָכַעַס עִנְיָנוֹ
  choice: и занятие его — досада
  rationale: עִנְיָן обозначает дело или занятие, а כַּעַס здесь — вызванную им внутреннюю досаду и тягостное раздражение.
- source_word: גַּם בַּלַּיְלָה
  choice: даже ночью
  rationale: Передаёт усилительное значение גַּם и естественно звучит по-русски.
- source_word: לֹא שָׁכַב לִבּוֹ
  choice: сердце его не знает покоя
  rationale: Идиоматично передаёт буквальный образ «сердце его не ложится», сохраняя сердце как средоточие внутренней жизни и мыслей.
- source_word: גַּם זֶה
  choice: И это тоже
  rationale: Сохраняет добавочное значение и характерную для Екклесиаста повторяющуюся формулу.
- source_word: הֶבֶל
  choice: суета
  rationale: Традиционное и понятное русское соответствие в Екклесиасте; примечание сохраняет буквальный образ дыхания или пара и его оттенки мимолётности и неуловимости.
theological_decisions:
- issue: Значение הֶבֶל в рефрене Екклесиаста
  choice: суета
  alternative: пар; дуновение; тщета
  rationale: «Суета» сохраняет узнаваемость русского библейского рефрена, но не должна пониматься лишь как бесполезность; примечание отмечает исходный образ чего-то краткого, неуловимого и непрочного.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сделан естественным для широкой аудитории; образ сердца сохранён, а не заменён словом «ум». Традиционное «суета» сопровождается пояснением исходной метафоры.
