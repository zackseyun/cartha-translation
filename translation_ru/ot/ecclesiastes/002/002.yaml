  text: I said of laughter[a], “It is madness,” and of pleasure, “What does this accomplish?”
translation:
  language: ru
  text: 'О смехе я сказал: «Безумие!» — а о радости: «Что она даёт?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: О смехе
  rationale: 'Существительное שְׂחוֹק обозначает смех или веселье; предлог ל при אמר здесь естественно передаётся как указание на предмет высказывания: «о смехе».'
- source_word: אָמַרְתִּי
  choice: я сказал
  rationale: Форма Qal perfect 1-го лица ед. числа буквально означает «я сказал». Контекст допускает внутреннюю речь, но добавление «себе» не требуется самим стихом.
- source_word: מְהוֹלָל
  choice: Безумие!
  rationale: Слово выражает оценку как безумного, неразумного или лишённого здравого смысла. Именное «Безумие!» по-русски кратко и естественно характеризует смех как явление, не уточняя сверх текста, является ли форма строго существительным или предикативным прилагательным.
- source_word: וּלְשִׂמְחָה
  choice: а о радости
  rationale: שִׂמְחָה означает радость, веселье или удовольствие. «Радость» сохраняет основное и широкое значение слова; противопоставительно-присоединительное «а» естественно оформляет параллельную вторую часть.
- source_word: מַה זֹּה עֹשָׂה
  choice: Что она даёт?
  rationale: Буквально выражение можно передать «Что это делает?». В данном оценочном вопросе עשה относится к результату или пользе радости; «Что она даёт?» звучит естественно по-русски и сохраняет вопрос о её плоде, не вводя конкретного ответа.
