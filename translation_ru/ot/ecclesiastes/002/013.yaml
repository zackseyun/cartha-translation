  text: And I saw that wisdom has an advantage over folly[a], as light has an advantage over darkness.
translation:
  language: ru
  text: И увидел я, что мудрость имеет преимущество перед глупостью[a], как свет имеет преимущество перед тьмой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выгоду». Еврейское слово может означать избыток, выгоду или преимущество; здесь речь идёт о превосходстве мудрости над глупостью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אָ֔נִי
  choice: И увидел я
  rationale: Форма первого лица и отдельное местоимение אָ֔נִי придают субъекту лёгкое ударение. Постпозиция «я» естественно передаёт его по-русски, не создавая тяжеловесного «я сам».
- source_word: שֶׁיֵּ֥שׁ יִתְר֛וֹן לַֽחָכְמָ֖ה
  choice: что мудрость имеет преимущество
  rationale: Экзистенциальная конструкция буквально сообщает, что у мудрости есть יתרון. Русская конструкция с «имеет преимущество» ясна и сохраняет сравнительный смысл.
- source_word: יִתְרוֹן
  choice: преимущество
  rationale: Слово может означать избыток, выгоду или преимущество. В данном качественном сопоставлении мудрости с глупостью «преимущество» точнее и естественнее, чем экономически окрашенная «прибыль».
- source_word: מִן הַסִּכְל֑וּת
  choice: перед глупостью
  rationale: Сравнительный מִן после יִתְרוֹן выражает превосходство; «преимущество перед» — нормативная русская конструкция. סִכְלוּת передано как «глупость».
- source_word: כִּֽיתְר֥וֹן הָא֖וֹר מִן הַחֹֽשֶׁךְ
  choice: как свет — перед тьмой
  rationale: 'Сжатая эллиптическая конструкция сохраняет параллелизм оригинала: подразумевается то же «имеет преимущество». Тире естественно обозначает пропуск повторяющегося сказуемого.'
theological_decisions:
- issue: Смысл יִתְרוֹן в сопоставлении мудрости и глупости
  choice: «преимущество»
  alternative: «выгода» или «прибыль»
  rationale: Контекст утверждает сравнительное превосходство мудрости по аналогии со светом и тьмой, но не превращает его в абсолютное богословское заявление. «Преимущество» сохраняет этот ограниченный сравнительный смысл и не навязывает узко экономического оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной близостью к еврейскому порядку слов. «И увидел я» сохраняет акцент на говорящем; эллипсис во второй половине делает сравнение естественным и ясным.
