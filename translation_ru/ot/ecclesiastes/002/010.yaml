base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/010.yaml
  text: And whatever my eyes desired I did not withhold from them[a]; I did not keep my heart from any pleasure, for my heart rejoiced in all my labor[c][b], and this was my portion from all my labor.
translation:
  language: ru
  text: Я не отказывал своим глазам ни в чём, чего они желали[a]; не удерживал своего сердца ни от какой радости[b], ибо сердце моё радовалось всем моим трудам[c], и это было моей долей от всех моих трудов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё, чего просили мои глаза, я не удерживал от них».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни от какого удовольствия».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово, переведённое как «труды», может также означать «тяжкий труд» или «изнурительный труд».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ עֵינַי
  choice: чего желали мои глаза
  rationale: Глагол буквально означает «просили», но при подлежащем «мои глаза» выражает желание, вызванное увиденным. Перевод сохраняет образ глаз как носителя желания и естественно звучит по-русски.
- source_word: לֹא אָצַלְתִּי מֵהֶם
  choice: я им не отказывал
  rationale: Глагол передаёт значение удерживания или отказа в желаемом. Русское выражение ясно соотносит местоимение «им» с глазами и означает, что говорящий не лишал себя ничего увиденного и желанного.
- source_word: לֹא מָנַעְתִּי אֶת לִבִּי
  choice: не удерживал своего сердца
  rationale: Сохранён образ сердца как внутреннего средоточия желаний и переживаний; «не удерживал» передаёт сознательный отказ от самоограничения.
- source_word: שִׂמְחָה
  choice: радость
  rationale: «Радость» непосредственно соответствует основному значению существительного и сохраняет связь с однокоренным глаголом שָׂמֵחַ в следующей части стиха.
- source_word: לִבִּי שָׂמֵחַ
  choice: сердце моё радовалось
  rationale: Формулировка близко передаёт еврейский образ сердца как средоточия радости и при этом естественна для литературного русского языка.
- source_word: עֲמָלִי
  choice: мой труд / мои труды
  rationale: עָמָל обозначает труд, часто с оттенком тяготы и изнурительности. Выбрано нейтральное «труд», а возможный более сильный оттенок отмечен в сноске; изменение числа обусловлено русской грамматикой и контекстом двух конструкций.
- source_word: חֶלְקִי
  choice: моей долей
  rationale: «Доля» передаёт то, что достаётся человеку как его удел или часть, и сохраняет важный для Екклесиаста тематический смысл.
