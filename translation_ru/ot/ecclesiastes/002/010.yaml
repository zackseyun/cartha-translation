  naturalness: «Я не отказывал своим глазам ни в чём, чего они желали» — естественная современная русская формулировка, яснее исходного «во всём ... я им не отказывал». «Всем моим трудам» и «от всех моих трудов» сохраняют повтор и литературно звучат.
  terminology: '«Радость», «сердце», «труды» и «доля» уместны и не навязывают интерпретацию. Сноска к первому обороту исправлена: прежняя формулировка «я от них не удерживал» неполна по-русски и не может служить буквальным вариантом.'
