  text: וְ/שָׂנֵ֤אתִֽי אֲנִי֙ אֶת כָּל עֲמָלִ֔/י שֶׁ/אֲנִ֥י עָמֵ֖ל תַּ֣חַת הַ/שָּׁ֑מֶשׁ שֶׁ֣/אַנִּיחֶ֔/נּוּ לָ/אָדָ֖ם שֶׁ/יִּהְיֶ֥ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/018.yaml
  text: And I hated all my labor in which I toiled under the sun[a], because I must leave it to the man who will come after me.
translation:
  language: ru
  text: И я возненавидел весь свой труд, над которым я тружусь под солнцем, потому что оставлю его человеку, который будет после меня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который придёт мне на смену».'
    reason: Сочетание שֶׁיִּהְיֶה אַחֲרָי буквально означает «который будет после меня», но в контексте может обозначать преемника.
lexical_decisions:
- source_word: וְשָׂנֵאתִי אֲנִי
  choice: И я возненавидел
  rationale: Форма совершенного вида передаёт сложившуюся реакцию говорящего; отдельное местоимение אֲנִי сохранено для личного акцента, а וְ — как простая повествовательная связь.
- source_word: אֶת כָּל עֲמָלִי
  choice: весь свой труд
  rationale: עָמָל обозначает труд, нередко тягостный; «труд» сохраняет широкое значение и повторяющуюся лексику книги.
- source_word: שֶׁאֲנִי עָמֵל
  choice: которым тружусь
  rationale: Однокоренные «труд» и «тружусь» сохраняют намеренный повтор еврейского текста, оставаясь естественными по-русски.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохранено характерное для Екклесиаста устойчивое выражение о земной сфере человеческой жизни.
- source_word: שֶׁאַנִּיחֶנּוּ
  choice: потому что оставлю его
  rationale: Hiphil от נוח здесь значит «оставить, передать». Союз שֶׁ по контексту вводит причину; будущее «оставлю» передаёт форму без добавления явно не выраженной модальности долженствования.
- source_word: לָאָדָם
  choice: человеку
  rationale: אָדָם указывает на отдельного человека, которому достанется результат труда; русский дательный без местоименного уточнения естественно сохраняет неопределённость референта.
- source_word: שֶׁיִּהְיֶה אַחֲרָי
  choice: который будет после меня
  rationale: Буквальный временно-пространственный оборот сохранён, не сводя его безоговорочно к более узкому понятию преемника.
theological_decisions:
- issue: Кого обозначает אָדָם и что значит אַחֲרָי
  choice: «человеку, который будет после меня»
  alternative: «человеку, который придёт мне на смену»
  rationale: Текст говорит об отдельном последующем обладателе плодов труда, но сам оборот допускает как общее временное значение, так и значение преемства. Основной перевод сохраняет эту широту, а сноска поясняет контекстуальный вариант.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Намеренный корневой повтор «труд — тружусь» воспроизводит риторическое усиление оригинала; инверсия не используется, чтобы фраза оставалась понятной обычному читателю.
