source:
  edition: WLC
  text: וּ/פָנִ֤יתִֽי אֲנִי֙ לִ/רְא֣וֹת חָכְמָ֔ה וְ/הוֹלֵל֖וֹת וְ/סִכְל֑וּת כִּ֣י מֶ֣ה הָ/אָדָ֗ם שֶׁ/יָּבוֹא֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ אֵ֥ת אֲשֶׁר כְּבָ֖ר עָשֽׂוּ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/012.yaml
  text: So I turned to consider wisdom[a], madness, and folly; for what can the man do who comes after the king? Only what has already been done.
translation:
  language: ru
  text: И я обратился, чтобы рассмотреть мудрость, безумие и глупость. Ведь что сможет сделать человек, который придёт после царя? Лишь то, что уже было сделано.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст заключительной части стиха труден. Буквально он содержит: «что [такое] человек, который придёт после царя? — то, что они уже сделали [ему/это]». Последняя форма может относиться к нему или к чему-либо; возможный смысл: «лишь то, что уже было сделано».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: И обратился я
  rationale: Глагол פנה обозначает переход к новому предмету размышления; формулировка сохраняет связь с предыдущим рассуждением и достоинство повествовательного голоса.
- source_word: לִרְאוֹת
  choice: к рассмотрению
  rationale: Буквально «увидеть», но с абстрактными объектами здесь означает исследовать или обдумывать.
- source_word: חָכְמָה
  choice: мудрости
  rationale: Обычное и точное соответствие חכמה, охватывающее практическую и интеллектуальную мудрость.
- source_word: הוֹלֵלוֹת
  choice: безумия
  rationale: Передаёт резкое обозначение неразумного, почти помешанного поведения и сохраняет отличие от следующего סכלות.
- source_word: סִכְלוּת
  choice: глупости
  rationale: Естественное современное соответствие слову со значением глупости и неразумия; оно не сливается с «безумием».
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание предыдущего утверждения и естественно связывает части русского текста.
- source_word: מֶה הָאָדָם
  choice: что сможет сделать человек
  rationale: Буквально конструкция трудна («что [есть] человек»), однако в контексте это риторический вопрос об ограниченных возможностях преемника.
- source_word: שֶׁיָּבוֹא אַחֲרֵי הַמֶּלֶךְ
  choice: который придёт после царя
  rationale: Сохраняет единственное число и естественно обозначает будущего преемника царя.
- source_word: אֵת אֲשֶׁר כְּבָר עָשׂוּהוּ
  choice: Лишь то, что уже было сделано
  rationale: Передаёт вероятный контекстуальный смысл сжатой и грамматически трудной фразы, не уточняя неоднозначный объект суффикса; буквальная возможность отмечена в сноске.
theological_decisions:
- issue: Значение הָאָדָם в риторическом вопросе
  choice: человек
  alternative: этот человек; люди; человечество
  rationale: Здесь имеется в виду отдельный преемник царя, но русское «человек» сохраняет и обобщающий характер высказывания без ненужного конфессионального истолкования.
- issue: Смысл заключительной фразы עָשׂוּהוּ
  choice: Лишь то, что уже было сделано
  alternative: то, что они уже сделали ему/с ним
  rationale: Контекст поддерживает мысль, что преемник способен лишь повторить уже совершённое, однако еврейская форма допускает более буквальное понимание с неопределённым множественным субъектом и местоименным объектом; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Инверсия «обратился я» умеренно возвышенна, но понятна; различие между «безумием» и «глупостью» сохранено. Сноска отмечает реальную синтаксическую и местоименную неоднозначность еврейского текста.
