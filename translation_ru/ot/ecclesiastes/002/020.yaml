lexical_decisions:
- source_word: וְסַבּוֹתִי
  choice: И обратился я
  rationale: Форма от סבב обозначает смену направления, здесь — внутренний поворот в размышлении. «Обратился я» сохраняет образ поворота и звучит достойно и естественно.
- source_word: לְיַאֵשׁ אֶת־לִבִּי
  choice: к отчаянию в сердце своём
  rationale: Буквально конструкция допускает понимание «привести своё сердце в отчаяние» или «предаться отчаянию сердцем». Выбранная формулировка передаёт внутреннее состояние, не сводя לֵב только к разуму или чувствам.
- source_word: עַל כָּל הֶעָמָל
  choice: из-за всех трудов
  rationale: עַל здесь указывает на предмет или причину отчаяния, а עָמָל — на тягостный, изнурительный труд. Множественное «труды» естественно по-русски охватывает всё содеянное тяжким трудом.
- source_word: שֶׁעָמַלְתִּי
  choice: которыми я трудился
  rationale: Повтор однокоренных слов «труды — трудился» отражает выразительный повтор עָמָל / עָמַלְתִּי в еврейском тексте.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Устойчивое и повторяющееся выражение Екклесиаста сохранено буквально и последовательно.
theological_decisions:
- issue: Направленность глагола יאשׁ при объекте «моё сердце»
  choice: Передать как внутреннее обращение к отчаянию
  alternative: «Я стал приводить сердце своё в отчаяние» / «я отказался в сердце своём от надежды»
  rationale: Еврейская конструкция компактна и допускает как причинный оттенок, так и описание состояния говорящего. Основной текст сохраняет напряжение без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Инверсия «обратился я» поддерживает созерцательный голос книги; однокоренной повтор намеренно сохранён.
