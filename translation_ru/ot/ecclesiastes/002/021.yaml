source:
  edition: WLC
  text: כִּי יֵ֣שׁ אָדָ֗ם שֶׁ/עֲמָל֛/וֹ בְּ/חָכְמָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כִשְׁר֑וֹן וּ/לְ/אָדָ֞ם שֶׁ/לֹּ֤א עָֽמַל בּ/וֹ֙ יִתְּנֶ֣/נּוּ חֶלְק֔/וֹ גַּם זֶ֥ה הֶ֖בֶל וְ/רָעָ֥ה רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/021.yaml
  text: For there is a man whose labor is with wisdom and with knowledge and with skill[a], yet he must give his portion to a man who has not labored in it[b]. This also is vapor and a great evil.
translation:
  language: ru
  text: Ведь бывает человек, который трудится[a] с мудростью, знанием и умением, а свою долю должен отдать человеку, который над этим не трудился. И это тоже — пар[b] и великое зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское עָמָל часто обозначает тяжёлый, изнурительный труд.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально «пар» или «дыхание» — нечто мимолётное и неуловимое. Традиционный перевод: «суета».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает стих с предшествующим рассуждением и вводит обоснование; в современном русском «ведь» естественнее буквального «ибо».
- source_word: יֵשׁ אָדָם
  choice: бывает человек
  rationale: Передаёт еврейскую конструкцию существования как описание встречающегося жизненного случая, сохраняя единственное число.
- source_word: עֲמָלוֹ
  choice: трудится
  rationale: Передаёт напряжённый труд в естественной русской глагольной конструкции; возможный оттенок изнурительности отмечен в сноске.
- source_word: בְּחָכְמָה וּבְדַעַת וּבְכִשְׁרוֹן
  choice: с мудростью, знанием и умением
  rationale: Сохраняет трёхчастный ряд и различает мудрость, знание и практическое мастерство.
- source_word: וּלְאָדָם שֶׁלֹּא עָמַל בּוֹ
  choice: человеку, который над этим не трудился
  rationale: 'Не уточняет сверх текста неоднозначный референт местоимения בּוֹ: речь может относиться к труду, его делу или его плодам.'
- source_word: יִתְּנֶנּוּ חֶלְקוֹ
  choice: свою долю должен отдать
  rationale: «Должен» выражает контекстуальную неизбежность передачи, а «доля» сохраняет важную для Екклесиаста тему удела человека.
- source_word: הֶבֶל
  choice: пар
  rationale: Сохраняет конкретный образ чего-то мимолётного и неуловимого, не сводя многозначный образ к отвлечённой «суете».
- source_word: רָעָה רַבָּה
  choice: великое зло
  rationale: Сохраняет сильную оценочную формулировку оригинала и её нравственно-экзистенциальное напряжение.
theological_decisions:
- issue: Передача ключевого слова הֶבֶל в книге Екклесиаста
  choice: пар
  alternative: суета; мимолётность
  rationale: Конкретный образ пара сохраняет одновременно значения недолговечности, неуловимости и непостижимости, не ограничивая смысл традиционным абстрактным толкованием.
- issue: Референт местоимения בּוֹ
  choice: над этим
  alternative: ради неё; над ней; для этого
  rationale: 'Нейтральное указательное выражение сохраняет неоднозначность оригинала: человек не участвовал ни в труде, ни в создании того, что стало долей другого.'
- issue: Характер передачи имущества другому
  choice: должен отдать
  alternative: отдаст; отдаёт
  rationale: Форма выражает не нравственную обязанность, а неизбежность описанного исхода; такая передача не превращает стих в предписание.
translation_notes:
  register: Современный литературный русский с сдержанным, афористичным звучанием. «Ведь» и «бывает человек» обеспечивают естественную связь с контекстом; трёхчастный ряд оригинала сохранён. Метафора «пар» намеренно оставлена несколько непривычной, чтобы удержать конкретный образ ключевого еврейского слова.
