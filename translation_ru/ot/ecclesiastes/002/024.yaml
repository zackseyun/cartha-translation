  text: אֵֽין ט֤וֹב בָּ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/הֶרְאָ֧ה אֶת נַפְשׁ֛/וֹ ט֖וֹב בַּ/עֲמָל֑/וֹ גַּם זֹה֙ רָאִ֣יתִי אָ֔נִי כִּ֛י מִ/יַּ֥ד הָ/אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/024.yaml
  text: There is nothing better for a man than that he should eat and drink and show himself good in his labor[b][a]. I also saw that this is from the hand of God.
translation:
  language: ru
  text: Нет для человека ничего лучше, чем есть, пить и наслаждаться добром от своего труда.[a][b] И я увидел, что и это — от руки Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дать своей душе увидеть добро в своём труде», то есть испытать добро и насладиться им.'
    reason: lexical_alternative
  - marker: b
    text: 'Начало стиха можно передать более буквально: «Нет в человеке добра, чтобы ему есть и пить…» Однако контекст поддерживает сравнительный смысл: «Нет для человека ничего лучше, чем…»'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹב בָּאָדָם
  choice: Нет для человека ничего лучше
  rationale: Сравнительное понимание трудной еврейской конструкции лучше соответствует ближайшему контексту и повторяющемуся у Екклесиаста мотиву радости как Божьего дара. «Человек» естественно передаёт родовое значение אָדָם.
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: чем есть, пить
  rationale: Инфинитивная конструкция после «ничего лучше, чем» естественна для современного русского языка и точно передаёт содержание названного блага.
- source_word: וְהֶרְאָה אֶת נַפְשׁוֹ טוֹב
  choice: и наслаждаться добром
  rationale: Буквально выражение говорит о том, чтобы «дать своей душе увидеть добро»; по смыслу это переживание добра и радость от него. Русское «наслаждаться добром» сохраняет объект טוֹב и остаётся понятным.
- source_word: בַּעֲמָלוֹ
  choice: от своего труда
  rationale: Предлог «от» естественно выражает добро, получаемое благодаря труду; «труд» сохраняет серьёзный оттенок עָמָל, не делая положительный контекст чрезмерно мрачным.
- source_word: גַּם זֹה רָאִיתִי אָנִי
  choice: И я увидел, что и это
  rationale: Передаёт усиленное присутствие местоимения אָנִי и частицу גַּם естественным русским порядком слов.
- source_word: מִיַּד הָאֱלֹהִים
  choice: от руки Бога
  rationale: Сохранён исходный образ руки, обозначающий источник и дар Бога.
theological_decisions:
- issue: Смысл начальной конструкции אֵין טוֹב בָּאָדָם
  choice: 'Сравнительное понимание: «Нет для человека ничего лучше…»'
  alternative: 'Более буквальное абсолютное понимание: «Нет в человеке добра, чтобы ему есть и пить…»'
  rationale: Сравнительное прочтение лучше согласуется с продолжением стиха, где возможность радоваться труду названа происходящей от руки Бога. Однако подлинная синтаксическая неоднозначность отмечена в сноске.
- issue: Характер наслаждения трудом
  choice: Наслаждение добром от труда является даром от руки Бога
  alternative: Высказывание лишь рекомендует человеческое удовольствие без указания на Божий дар
  rationale: Заключительная фраза прямо относит «и это» к руке Бога; перевод не ослабляет эту богословскую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Сохранён образ «от руки Бога»; трудная еврейская идиома передана понятно, а её буквальная форма и альтернативное прочтение вынесены в сноски.
