base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/001.yaml
  text: I said in my heart[a], “Come now, I will test you with pleasure; so enjoy what is good.” But look[c][b], this too is vapor.
translation:
  language: ru
  text: 'Сказал я в сердце своём[a]: «Ну же, испытаю тебя радостью[b] — насладись благом[c]». Но вот: и это — дуновение[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказал я себе». В древнееврейском тексте буквально говорится о внутренней речи «в сердце».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весельем» или «удовольствием».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «увидь благо»; это выражение может означать испытать благо или насладиться им.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «пар», «тщета», «суета». Древнееврейское הֶבֶל — повторяющийся в книге образ чего-то мимолётного, неуловимого и непрочного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: Сказал я в сердце своём
  rationale: Сохранён древнееврейский образ внутренней речи «в сердце», при этом фраза остаётся понятной в современном литературном русском.
- source_word: לְכָה נָּא
  choice: Ну же
  rationale: Передаёт побуждение, обращённое говорящим к самому себе, без архаического или излишне буквального «иди же».
- source_word: אֲנַסְּכָה
  choice: испытаю тебя
  rationale: Глагол נסה означает «испытывать, проверять»; местоименное дополнение сохранено, чтобы передать мотив опыта над собственным сердцем или собой.
- source_word: בְשִׂמְחָה
  choice: радостью
  rationale: שִׂמְחָה обозначает радость, веселье или удовольствие. «Радость» сохраняет широкое значение слова и не сводит опыт исключительно к чувственному наслаждению.
- source_word: וּרְאֵה בְטוֹב
  choice: насладись благом
  rationale: Буквальное «увидь благо» здесь представляет древнееврейскую идиому переживания и вкушения хорошего; «насладись благом» ясно передаёт её смысл.
- source_word: וְהִנֵּה
  choice: Но вот
  rationale: «Вот» передаёт указательную и оценочную функцию הִנֵּה, а «но» естественно выражает контраст между намерением и последующим выводом.
- source_word: גַם הוּא
  choice: и это
  rationale: Выражение указывает на только что описанный опыт; частица «и» в сочетании с контекстом передаёт значение «это тоже».
- source_word: הָבֶל
  choice: дуновение
  rationale: «Дуновение» сохраняет конкретный образ чего-то мимолётного, неуловимого и непрочного, не сужая значение до одного отвлечённого толкования.
theological_decisions:
- issue: Передача ключевого слова הָבֶל в книге Екклесиаста
  choice: дуновение
  alternative: суета; тщета; пар; бессмыслица
  rationale: «Дуновение» удерживает исходную метафору краткости и неуловимости. Традиционные «суета» и «тщета» допустимы, но сильнее истолковывают образ, а «бессмыслица» неоправданно превращает многозначную метафору в однозначное богословско-философское заключение.
- issue: Объект испытания в словах «испытаю тебя»
  choice: Сохранено прямое обращение без уточнения, относится ли «ты» строго к сердцу или к самому говорящему
  alternative: Испытаю себя радостью
  rationale: Мужской местоименный суффикс в אֲנַסְּכָה выражает обращение на «ты», тогда как предшествующая внутренняя речь допускает как обращение к собственному сердцу, так и к себе. Перевод не устраняет эту образную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Инверсия «Сказал я» сохраняет достоинство и оттенок размышления, не создавая тяжёлой архаики. Ключевая метафора הָבֶל передана конкретным словом, а традиционные варианты вынесены в примечание.
