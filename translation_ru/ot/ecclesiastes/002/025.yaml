  yaml_path: translation/ot/ecclesiastes/002/025.yaml
  text: For who can eat[a], and who can enjoy[b], apart from him?
translation:
  language: ru
  text: Ибо кто может есть и кто может наслаждаться[a] без меня?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто может спешить?»; возможно также: «кто может чувствовать?». Значение еврейского глагола неясно; здесь он понят в смысле наслаждения или переживания удовольствия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по масоретскому тексту: «без меня». Многие толкователи и некоторые древние переводы понимают здесь: «без Него», то есть без Бога, в соответствии с ближайшим контекстом.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предыдущей мысли; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: מִי יֹאכַל
  choice: кто может есть
  rationale: В риторическом вопросе форма глагола выражает возможность; такая передача согласуется с контекстом еды и дарованной способности получать от неё удовольствие.
- source_word: וּמִי יָחוּשׁ
  choice: и кто может наслаждаться
  rationale: Значение יָחוּשׁ здесь спорно. В контексте Екклесиаста 2:24–26 наиболее связным является смысл переживания удовольствия; другие возможные значения сохранены в примечании.
- source_word: חוּץ מִמֶּנִּי
  choice: без Него
  rationale: חוּץ с предлогом выражает значение «вне, без». Хотя масоретская огласовка суффикса означает «без меня», контекст говорит о Боге как источнике еды и радости; контекстуальное понимание «без Него» вынесено в основной текст, а буквальное чтение сохранено в примечании.
theological_decisions:
- issue: К кому относится местоименный суффикс в מִמֶּנִּי
  choice: без Него, то есть без Бога
  alternative: без меня, то есть без говорящего Екклесиаста
  rationale: Масоретский текст с огласовкой прямо читается «без меня», однако ближайший контекст связывает возможность наслаждаться с Божьей рукой и Божьим даром. Основной текст передаёт вероятный контекстуальный смысл, не скрывая подлинную текстуально-интерпретационную напряжённость в примечании.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Риторический параллелизм еврейской строки сохранён. Заглавная буква в «Него» указывает на Бога согласно контексту; неоднозначность местоимения и трудный глагол не замалчиваются, а отражены в примечаниях.
