  yaml_path: translation/ot/ecclesiastes/002/005.yaml
  text: I made for myself gardens and parks[a], and I planted in them every kind of fruit tree.
translation:
  language: ru
  text: Я устроил для себя сады и парки[a] и посадил в них всякие плодовые деревья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плодовые сады». Еврейское слово פַרְדֵּסִים обозначает огороженные благоустроенные угодья — сады-парки или плодовые насаждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׂיתִי לִי
  choice: Я устроил для себя
  rationale: Глагол עשה в данном контексте обозначает создание и обустройство царских насаждений, а לִי выражает личную пользу и принадлежность. «Устроил для себя» естественно передаёт оба элемента.
- source_word: גַּנּוֹת
  choice: сады
  rationale: Обычное обозначение садов; выбор сохраняет отличие от следующего, более специального термина.
- source_word: פַרְדֵּסִים
  choice: парки
  rationale: Слово обозначает огороженные культурные угодья, сады-парки или плодовые насаждения. «Парки» передаёт более обширный характер этих владений и не дублирует «сады».
- source_word: וְנָטַעְתִּי בָהֶם
  choice: и посадил в них
  rationale: Естественная русская передача глагола נטע и местоименной отсылки к садам и паркам; повторение «я» не требуется по нормам русского языка.
- source_word: עֵץ כָּל פֶּרִי
  choice: всякие плодовые деревья
  rationale: Буквально конструкция означает «дерево всякого плода». Русское «всякие плодовые деревья» ясно передаёт разнообразие видов и звучит естественно.
