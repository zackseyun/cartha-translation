  source_fidelity: 'Текст точно передаёт еврейскую последовательность: «я устроил для себя» (עָשִׂיתִי לִי), «сады и парки» (גַּנּוֹת וּפַרְדֵּסִים), «посадил в них» (וְנָטַעְתִּי בָהֶם) и «всякие плодовые деревья» (עֵץ כָּל פֶּרִי). Личный, самонаправленный характер действий сохранён, а «в них» естественно относится к обоим видам насаждений.'
