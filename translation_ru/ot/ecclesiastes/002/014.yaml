base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/014.yaml
  text: The wise man has his eyes in his head[a], but the fool walks in darkness. Yet I also knew that one fate happens to them all.
translation:
  language: ru
  text: У мудрого глаза в голове, а глупец ходит во тьме. Но я тоже понял, что их всех постигает одна участь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одно событие постигает их всех». Еврейское מִקְרֶה означает то, что случается с человеком, и в зависимости от контекста может передаваться как «случай», «событие» или «участь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: мудрый
  rationale: Субстантивированное прилагательное обозначает мудрого человека; мужской род единственного числа соответствует форме еврейского текста и параллели с «глупцом».
- source_word: עֵינָיו בְּרֹאשׁוֹ
  choice: у мудрого глаза в голове
  rationale: 'Сохранён конкретный и выразительный образ оригинала: мудрый способен видеть и ориентироваться. Толкование «видит ясно» было бы понятнее, но устранило бы исходную метафору.'
- source_word: וְהַכְּסִיל
  choice: а глупец
  rationale: Союз ו в противопоставлении естественно передан русским «а», подчёркивающим контраст без усиления смысла.
- source_word: בַּחֹשֶׁךְ הוֹלֵךְ
  choice: ходит во тьме
  rationale: Передача сохраняет метафору движения во тьме и не уточняет, идёт ли речь о нравственной, умственной или иной слепоте.
- source_word: וְיָדַעְתִּי גַם אָנִי
  choice: Но понял и я
  rationale: '«Но» передаёт смысловой поворот: преимущество мудрости не отменяет общего исхода. «Понял» естественно выражает достигнутое говорящим осознание, а «и я» сохраняет גם и явное местоимение אני.'
- source_word: שֶׁמִּקְרֶה אֶחָד
  choice: что … одна участь
  rationale: מִקְרֶה обозначает то, что случается или выпадает человеку. «Участь» естественно передаёт общий для обоих исход, а возможная более буквальная передача отмечена в сноске.
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: их всех постигает
  rationale: Глагол קרה здесь означает «случаться с кем-либо, постигать», а כֻּלָּם охватывает обоих — мудрого и глупца.
theological_decisions:
- issue: Характер общей участи мудрого и глупца
  choice: Не уточнять в основном тексте, что речь именно о смерти.
  alternative: «Обоих ждёт одна смерть»
  rationale: Ближайший контекст ведёт к смерти как общему исходу, однако сам стих употребляет более широкое מִקְרֶה. Сохранение слова «участь» не снимает присущую тексту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с сохранением образности еврейского текста. Формулировка краткая и афористичная; «во тьме» придаёт ей достоинство без архаизации.
