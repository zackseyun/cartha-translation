source:
  edition: WLC
  text: קָנִ֨יתִי֙ עֲבָדִ֣ים וּ/שְׁפָח֔וֹת וּ/בְנֵי בַ֖יִת הָ֣יָה לִ֑/י גַּ֣ם מִקְנֶה֩ בָקָ֨ר וָ/צֹ֤אן הַרְבֵּה֙ הָ֣יָה לִ֔/י מִ/כֹּ֛ל שֶֽׁ/הָי֥וּ לְ/פָנַ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/007.yaml
  text: I acquired male servants and female servants[a], and homeborn servants were mine; I also had great herds of cattle and flocks[b], more than all who were before me in Jerusalem.
translation:
  language: ru
  text: Я приобрёл рабов и рабынь; были у меня и рабы, родившиеся в доме[a]. Были у меня также многочисленные стада крупного и мелкого скота[b] — больше, чем у всех, кто был до меня в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья дома» — люди, родившиеся в составе домашнего хозяйства; в данном контексте, вероятно, рабы, родившиеся в доме.'
    reason: cultural_note
  - marker: b
    text: Еврейские собирательные слова обозначают здесь крупный скот, а также мелкий скот — овец и коз.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתִי
  choice: Я приобрёл
  rationale: Передаёт широкое значение «приобрести, купить», не уточняя способ приобретения.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: рабов и рабынь
  rationale: Сохраняет указание как на несвободный статус, так и на различие по полу; в современном русском звучит ясно и прямо.
- source_word: וּבְנֵי בַיִת
  choice: рабы, родившиеся в доме
  rationale: Передаёт буквально-идиоматическое «сыновья дома» как людей, родившихся внутри хозяйства; контекст указывает на домашних рабов.
- source_word: הָיָה לִי
  choice: были у меня
  rationale: Естественная русская формула обладания, повтор которой сохраняет перечислительный строй еврейского текста.
- source_word: מִקְנֶה בָקָר וָצֹאן הַרְבֵּה
  choice: многочисленные стада крупного и мелкого скота
  rationale: מִקְנֶה обозначает скот как имущество, בָקָר — крупный рогатый скот, а צֹאן — собирательно овец и коз; формулировка передаёт обилие естественно для русского языка.
- source_word: מִכֹּל שֶׁהָיוּ לְפָנַי
  choice: больше, чем у всех, кто был до меня
  rationale: Сохраняет сравнительную конструкцию и намеренную неопределённость относительно того, кем именно были предшественники.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Общепринятая русская передача названия города.
