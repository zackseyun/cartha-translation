  text: וּ/פָנִ֣יתִֽי אֲנִ֗י בְּ/כָל מַעֲשַׂ/י֙ שֶֽׁ/עָשׂ֣וּ יָדַ֔/י וּ/בֶֽ/עָמָ֖ל שֶׁ/עָמַ֣לְתִּי לַ/עֲשׂ֑וֹת וְ/הִנֵּ֨ה הַ/כֹּ֥ל הֶ֨בֶל֙ וּ/רְע֣וּת ר֔וּחַ וְ/אֵ֥ין יִתְר֖וֹן תַּ֥חַת הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/011.yaml
  text: Then I turned to consider all the works that my hands had done[a], and the labor that I had labored to do; and behold, all was vanity and a chasing after wind[c][b], and there was no profit under the sun.
translation:
  language: ru
  text: 'Тогда я обратился, чтобы рассмотреть все дела, сделанные моими руками, и труд, которым я трудился, чтобы их совершить. И вот: всё — суета[a] и погоня за ветром[b], и нет никакой выгоды[c] под солнцем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «пар» или «дыхание». Еврейское слово «хэвэл» передаёт нечто мимолётное, неуловимое и потому тщетное.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «стремление к ветру»; буквальный образ может допускать оттенок «пасения ветра» и говорит о бесплодном усилии.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «прибыли», «преимущества», то есть остающегося приобретения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: Тогда я оглянулся
  rationale: Глагол פנה буквально обозначает поворот; в контексте это обращение к уже сделанному ради оценки. «Оглянулся» естественно передаёт и образ поворота, и ретроспективное осмысление.
- source_word: מַעֲשַׂי שֶׁעָשׂוּ יָדַי
  choice: все дела, которые совершили мои руки
  rationale: Сохранены конкретное «дела» и еврейское олицетворение рук, подчёркивающее личное участие и созидательную деятельность говорящего.
- source_word: וּבֶעָמָל שֶׁעָמַלְתִּי לַעֲשׂוֹת
  choice: и на труд, которым я трудился, совершая их
  rationale: Повтор «труд — трудился» сохраняет однокоренную фигуру оригинала; деепричастный оборот естественно передаёт לַעֲשׂוֹת и подразумеваемый объект — перечисленные дела.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Обычная русская формула, сохраняющая указательную и итоговую силу הִנֵּה без излишней архаичности.
- source_word: הֶבֶל
  choice: суета
  rationale: Традиционный и тематически устойчивый русский эквивалент, способный обозначать тщетность и неуловимость; буквальные образы «пар» и «дыхание» приведены в примечании, чтобы не сужать многозначность.
- source_word: וּרְעוּת רוּחַ
  choice: и погоня за ветром
  rationale: Передаёт образ безуспешного преследования чего-то неуловимого на ясном современном русском; возможный оттенок «томления/стремления» отмечен в сноске.
- source_word: וְאֵין יִתְרוֹן
  choice: и нет никакой выгоды
  rationale: יִתְרוֹן обозначает остающийся избыток, прибыль или преимущество. «Выгода» сохраняет оценочный, почти хозяйственный оттенок и хорошо сочетается с отрицательной конструкцией.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохранено программное выражение Екклесиаста, относящее оценку к земной сфере человеческой жизни.
theological_decisions:
- issue: Передача ключевого слова הֶבֶל
  choice: суета
  alternative: пар; дыхание; тщета
  rationale: «Суета» сохраняет традиционную связь с тематикой книги, но сама по себе может быть понята как хлопотливость. Поэтому сноска раскрывает исходный образ мимолётного и неуловимого, не сводя высказывание к абсолютной «бессмысленности».
- issue: Смысл רְעוּת רוּחַ
  choice: погоня за ветром
  alternative: томление духа; стремление за ветром; пасение ветра
  rationale: Форма допускает разборы, связанные со стремлением либо с пасением, однако в сочетании с «ветром» выражает тщетное усилие. Образная передача сохраняет эту напряжённость, не превращая её в отвлечённое богословское утверждение.
- issue: Объём отрицания в וְאֵין יִתְרוֹן תַּחַת הַשָּׁמֶשׁ
  choice: нет никакой выгоды под солнцем
  alternative: нет преимущества под солнцем
  rationale: Фраза утверждает отсутствие остающегося человеческого приобретения в рассматриваемой земной сфере; перевод не расширяет её до утверждения, будто вообще не существует никакой ценности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксический параллелизм и однокоренной повтор оригинала сохранены там, где они понятны по-русски; архаизмы и чрезмерно отвлечённые толкования исключены.
