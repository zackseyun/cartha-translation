base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/017.yaml
  text: So I hated life[a], because the work that is done under the sun was grievous to me[b]; for everything is vapor and a chasing after wind.
translation:
  language: ru
  text: 'И возненавидел я жизнь, потому что тягостно мне дело, совершаемое под солнцем: ведь всё — лишь пар[a] и погоня за ветром[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дуновение», «тщета». Еврейское слово передаёт образ чего-то мимолётного, неустойчивого и неуловимого.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стремление за ветром»; более буквально выражение может означать «попытку пасти ветер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: И возненавидел я
  rationale: Форма qal perfect 1-го лица ед. числа выражает сложившуюся реакцию говорящего; начальное «и» сохраняет связь с предшествующим рассуждением.
- source_word: אֶת הַחַיִּים
  choice: жизнь
  rationale: Формально множественное חַיִּים обычно имеет собирательное значение «жизнь».
- source_word: כִּי רַע עָלַי הַמַּעֲשֶׂה שֶׁנַּעֲשָׂה
  choice: потому что тягостно мне всё, что делается
  rationale: Оборот רַע עָלַי передаёт переживаемую говорящим тягость; сочетание существительного с пассивной формой естественно выражено по-русски как обобщённое «всё, что делается».
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохранён характерный для Екклесиаста образ земной сферы человеческой деятельности.
- source_word: הַכֹּל הֶבֶל
  choice: всё — лишь пар
  rationale: «Пар» сохраняет конкретный образ чего-то мимолётного, неуловимого и лишённого устойчивости; частица «лишь» делает метафору естественнее по-русски, не сводя её к одному отвлечённому понятию.
- source_word: וּרְעוּת רוּחַ
  choice: и погоня за ветром
  rationale: Передаёт образ тщетного стремления настичь и удержать неуловимое, сохраняя метафорическую напряжённость выражения.
theological_decisions:
- issue: Смысл הֶבֶל в Екклесиасте
  choice: пар
  alternative: суета; тщета; дуновение
  rationale: Выбран конкретный образ, позволяющий сохранить одновременно мимолётность, неуловимость и неустойчивость, а не заранее разрешать многозначность словом «тщета».
- issue: Толкование רְעוּת רוּחַ
  choice: погоня за ветром
  alternative: томление духа; стремление за ветром; попытка пасти ветер
  rationale: Фраза допускает лексическую неоднозначность. Основной текст использует понятный образ бесплодного преследования, а примечание отмечает более буквальную возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Инверсия «возненавидел я» поддерживает торжественный, рефлексивный тон, не становясь архаичной; двоеточие ясно вводит итоговое объяснение.
