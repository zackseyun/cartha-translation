  text: ס֥וֹף דָּבָ֖ר הַ/כֹּ֣ל נִשְׁמָ֑ע אֶת הָ/אֱלֹהִ֤ים יְרָא֙ וְ/אֶת מִצְוֺתָ֣י/ו שְׁמ֔וֹר כִּי זֶ֖ה כָּל הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/013.yaml
  text: 'The end of the matter, when all has been heard: fear God and keep his commandments, for this is the whole of man.[a]'
translation:
  language: ru
  text: 'Итог всему, после того как всё выслушано: бойся Бога и соблюдай Его заповеди, потому что в этом — весь человек.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потому что это — весь человек». Возможный смысл: в этом всё назначение человека; также переводят: «это касается каждого человека».'
    reason: Еврейская формула כָּל־הָאָדָם предельно кратка и неоднозначна; примечание сохраняет основные возможности без внесения слова «долг» в основной текст.
lexical_decisions:
- source_word: סוֹף דָּבָר
  choice: Итог всего, что было сказано
  rationale: Передаёт заключительный характер формулы и естественно связывается с последующим הַכֹּל נִשְׁמָע, не превращая её в утверждение о прекращении самого «дела».
- source_word: יְרָא
  choice: бойся
  rationale: Сохраняет прямое значение еврейского императива и библейское напряжение между страхом, благоговением и послушанием, не сужая его до одного лишь «почитания».
- source_word: שְׁמוֹר
  choice: соблюдай
  rationale: 'Обычное и точное русское соответствие в контексте заповедей: не только помнить, но исполнять и хранить верность им.'
- source_word: כָּל־הָאָדָם
  choice: весь человек
  rationale: Буквально сохраняет намеренно сжатую и допускающую разные толкования формулу; слово «долг» в еврейском тексте отсутствует.
theological_decisions:
- issue: Смысл формулы כִּי זֶה כָּל־הָאָדָם
  choice: потому что в этом — весь человек
  alternative: потому что в этом весь долг человека
  rationale: Выбранный вариант не добавляет отсутствующее в оригинале понятие «долга» и сохраняет возможность понимать фразу как указание на целостное назначение, сущность или удел человека.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Императивы даны в традиционной форме единственного числа. Заглавная буква в местоимении «Его» соответствует принятому благоговейному русскому оформлению, не изменяя смысла оригинала.
