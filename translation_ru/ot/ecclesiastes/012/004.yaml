base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/004.yaml
  text: and the doors on the street are shut when the sound of the grinding is low[a], and one rises at the sound of a bird[c][b], and all the daughters of song are brought low.
translation:
  language: ru
  text: и затворятся двери на улице, когда понизится звук молотьбы[a]; и будет вставать человек при голосе птицы, и поникнут все дочери песни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при понижении звука молотьбы». «Двери» нередко понимают как образ губ или рта, а молотьбу — как образ ослабевшего жевания; однако сам еврейский текст этого прямо не уточняет.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поникнут все дочери песни». Выражение может обозначать певиц, способность петь либо звуки, связанные с песней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֻגְּרוּ דְלָתַיִם בַּשּׁוּק
  choice: и затворятся двери на улицу
  rationale: Сохраняет буквальный поэтический образ дверей и естественно передаёт בַּשּׁוּק как их направленность наружу, к улице. Не уточняет спорное телесное соответствие образа.
- source_word: בִּשְׁפַל קוֹל הַטַּחֲנָה
  choice: когда стихнет звук жерновов
  rationale: Передаёт ослабление звука при помоле естественным русским выражением. «Жернова» конкретизируют орудие лишь в пределах самого образа молотьбы, не раскрывая его как зубы.
- source_word: וְיָקוּם לְקוֹל הַצִּפּוֹר
  choice: и будет человек вставать от голоса птицы
  rationale: Форма 3-го лица единственного числа не называет подлежащего; добавление общего «человек» делает русскую фразу грамматически ясной, не вводя конкретного персонажа. «Голос птицы» сохраняет קול и единственное число с определённым артиклем без излишней конкретизации как пение.
- source_word: וְיִשַּׁחוּ
  choice: и умолкнут
  rationale: В сочетании с «дочерьми песни» глагол по смыслу обозначает ослабление, понижение или затихание. «Умолкнут» естественно передаёт результат в звуковом контексте, хотя буквальнее возможно «поникнут».
- source_word: כָּל בְּנוֹת הַשִּׁיר
  choice: все дочери песни
  rationale: Сохраняет необычную и намеренно многозначную еврейскую метафору, не сводя её ни к певицам, ни к голосу, ни к слуху.
theological_decisions:
- issue: Истолкование образов старости в Екклесиасте 12
  choice: Сохранить образы дверей, жерновов и дочерей песни в основном тексте.
  alternative: Передать их прямо как губы, зубы и ослабевшие способности петь или слышать.
  rationale: Хотя весь отрывок обычно понимается как изображение старости, точные соответствия отдельных образов остаются спорными. Перевод не должен превращать вероятное толкование в содержание исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. «Затворятся» и «дочери песни» поддерживают достоинство и образность текста; синтаксис остаётся доступным современному читателю.
