lexical_decisions:
- source_word: בִּקֵּשׁ
  choice: стремился
  rationale: Глагол выражает целенаправленное искание и усилие; «стремился» естественно передаёт это в современном русском, не ослабляя смысла до простого «пытался».
- source_word: קֹהֶלֶת
  choice: Кохелет
  rationale: Транслитерация сохраняет особое еврейское обозначение литературного персонажа и не сужает его заранее до одного функционального толкования — «Учитель» или «Проповедник».
- source_word: לִמְצֹא
  choice: найти
  rationale: Прямое и естественное соответствие инфинитиву со значением нахождения.
- source_word: דִּבְרֵי חֵפֶץ
  choice: приятные слова
  rationale: חֵפֶץ здесь допускает значения желанности, удовольствия и привлекательности. «Приятные слова» звучит естественно и сохраняет эту смысловую широту; вариант отмечен в сноске.
- source_word: וְכָתוּב
  choice: и записать
  rationale: В компактной поэтической конструкции форма כָתוּב может быть понята в связи с предшествующим בִּקֵּשׁ как продолжение цели литературного труда. Русский инфинитив делает основное прочтение ясным, а возможное причастно-пассивное понимание сохраняется в сноске.
- source_word: יֹשֶׁר
  choice: верно
  rationale: Слово обозначает прямоту, правильность и честность. Наречие «верно» естественно относится к записи и сохраняет как смысл правильности, так и оттенок добросовестности.
- source_word: דִּבְרֵי אֱמֶת
  choice: слова истины
  rationale: Близкое воспроизведение еврейской конструкции сохраняет и объективное содержание истины, и правдивый характер слов.
theological_decisions:
- issue: Передача обозначения קֹהֶלֶת
  choice: Кохелет как транслитерированное обозначение
  alternative: Учитель; Проповедник
  rationale: Транслитерация не навязывает тексту единственную интерпретацию роли персонажа и сохраняет его особое еврейское литературное имя.
- issue: Синтаксическая связь וְכָתוּב יֹשֶׁר
  choice: «и верно записать» как продолжение цели Кохелета
  alternative: «а написанное было прямым — словами истины»
  rationale: Еврейская конструкция сжата и допускает оба прочтения. Основной текст передаёт деятельное продолжение мысли, а сноска сохраняет пассивно-причастное понимание, не устраняя подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Кохелет» сохраняет исходное обозначение, а «слова истины» — характерную еврейскую конструкцию. Формулировка основного текста ясна обычному читателю; существенная синтаксическая неоднозначность вынесена в сноску.
