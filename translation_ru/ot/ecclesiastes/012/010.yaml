  text: Qoheleth sought to find delightful words[b][a], and to write uprightly words of truth.
translation:
  language: ru
  text: Кохелет стремился найти приятные слова[a] и честно записать слова истины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желанные слова»; возможно также: «слова, доставляющие удовольствие».'
