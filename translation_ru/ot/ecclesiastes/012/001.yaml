base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/001.yaml
  text: And remember your Creator in the days of your youth[a], before the evil days come and the years arrive of which you will say, “I have no pleasure in them.”
translation:
  language: ru
  text: 'И помни своего Создателя[a] в дни юности твоей, пока не придут тяжёлые дни и не приблизятся годы, о которых ты скажешь: «Нет мне в них радости».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте это слово имеет форму множественного числа — буквально «твоих создателей». В данном контексте его обычно понимают как обозначение единого Бога; поэтому в переводе: «твоего Создателя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְכֹר
  choice: И помни
  rationale: Повелительная форма זכר передаёт прямой призыв; союз ו сохранён для связи с предшествующим рассуждением.
- source_word: אֶת בּוֹרְאֶיךָ
  choice: своего Создателя
  rationale: Форма слова морфологически множественная, но в данном контексте обозначает единого Бога; русское единственное число передаёт подразумеваемого референта, а особенность формы отмечена в сноске.
- source_word: בִּימֵי בְּחוּרֹתֶיךָ
  choice: в дни юности твоей
  rationale: Сохраняет временной образ оригинала и звучит естественно в возвышенной современной русской речи.
- source_word: עַד אֲשֶׁר לֹא יָבֹאוּ
  choice: пока не пришли
  rationale: Конструкция задаёт предел, предшествующий наступлению нежелательного времени; русское «пока не» естественно передаёт призыв помнить Создателя до его прихода.
- source_word: יְמֵי הָרָעָה
  choice: тяжёлые дни
  rationale: Здесь רָעָה обозначает бедствие, тяготу и невзгоды старости, а не обязательно нравственное зло; «тяжёлые» ясно передаёт смысл в контексте.
- source_word: וְהִגִּיעוּ שָׁנִים
  choice: и не настали годы
  rationale: Глагол выражает достижение или наступление; «настали» идиоматично сочетается с годами и сохраняет параллелизм.
- source_word: אֲשֶׁר תֹּאמַר
  choice: о которых ты скажешь
  rationale: Относительное предложение непосредственно относится к годам и естественно передаётся этой русской конструкцией.
- source_word: אֵין לִי בָהֶם חֵפֶץ
  choice: Нет мне в них радости
  rationale: חֵפֶץ здесь означает удовольствие, отраду или радость; формулировка сохраняет личную оценку и лаконичный строй оригинала.
theological_decisions:
- issue: Число формы בּוֹרְאֶיךָ («Создатель/создатели»).
  choice: 'Единственное число: «своего Создателя».'
  alternative: 'Формально множественное: «своих создателей».'
  rationale: Хотя еврейская форма морфологически множественная, в монотеистическом контексте израильской литературы мудрости она указывает на единого Бога. Единственное число не создаёт ложного политеистического смысла, а необычная форма оригинала документируется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, афористичным звучанием. Сохранены образы «дней юности» и грядущих лет; архаизмы сведены к минимуму, но порядок «в дни юности твоей» поддерживает достоинство и ритм текста.
