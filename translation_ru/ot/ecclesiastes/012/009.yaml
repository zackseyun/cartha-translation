base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/009.yaml
  text: And beyond that[a], because Qoheleth was wise, he still taught the people knowledge; he also weighed, searched out, and arranged many proverbs.
translation:
  language: ru
  text: Кроме того, поскольку Кохелет был мудр, он ещё и учил народ знанию; он взвешивал, исследовал и приводил в порядок множество притч.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И более того: Кохелет был мудр и также учил народ знанию; он обдумывал, исследовал и располагал по порядку множество притч».'
    reason: 'Лексические и синтаксические варианты: שֶׁ допускает менее причинное прочтение, וְאִזֵּן — перевод «обдумывал», а תִּקֵּן — «располагал по порядку».'
lexical_decisions:
- source_word: וְיֹתֵר
  choice: Кроме того
  rationale: Передаёт присоединение дополнительного замечания и естественно звучит в современном русском языке.
- source_word: שֶׁהָיָה
  choice: поскольку ... был
  rationale: Частица שֶׁ здесь правдоподобно выражает основание последующего действия, хотя возможна и более нейтральная связь.
- source_word: קֹהֶלֶת
  choice: Кохелет
  rationale: Сохранена еврейская форма особого имени-титула без сужения смысла до «Проповедника» или «Учителя».
- source_word: חָכָם
  choice: мудр
  rationale: Прямо передаёт предикативное прилагательное и сохраняет лаконичность оригинала.
- source_word: עוֹד
  choice: ещё и
  rationale: 'Выражает дополнительность действия: помимо собственной мудрости, Кохелет также наставлял народ.'
- source_word: לִמַּד דַּעַת אֶת הָעָם
  choice: учил народ знанию
  rationale: Сохраняет лексическое отличие דַּעַת «знание» от חָכָם «мудр» и близко следует еврейской конструкции.
- source_word: וְאִזֵּן
  choice: взвешивал
  rationale: Сохраняет вероятную метафору тщательной оценки; значение глагола не вполне бесспорно.
- source_word: וְחִקֵּר
  choice: исследовал
  rationale: Передаёт целенаправленный и тщательный поиск.
- source_word: תִּקֵּן
  choice: приводил в порядок
  rationale: Передаёт значение упорядочивания и редактирования, не утверждая однозначно, что речь только о сочинении.
- source_word: מְשָׁלִים הַרְבֵּה
  choice: множество притч
  rationale: Естественно передаёт большое количество מְשָׁלִים; слово «притчи» сохраняет традиционное и широкое жанровое значение.
