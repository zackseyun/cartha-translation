source:
  edition: WLC
  text: גַּ֣ם מִ/גָּבֹ֤הַּ יִרָ֨אוּ֙ וְ/חַתְחַתִּ֣ים בַּ/דֶּ֔רֶךְ וְ/יָנֵ֤אץ הַ/שָּׁקֵד֙ וְ/יִסְתַּבֵּ֣ל הֶֽ/חָגָ֔ב וְ/תָפֵ֖ר הָֽ/אֲבִיּוֹנָ֑ה כִּֽי הֹלֵ֤ךְ הָ/אָדָם֙ אֶל בֵּ֣ית עוֹלָמ֔/וֹ וְ/סָבְב֥וּ בָ/שּׁ֖וּק הַ/סֹּפְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/005.yaml
  text: Also they are afraid of heights[a], and terrors are on the road; the almond tree blossoms, the grasshopper drags itself along, and the caper berry fails, because man is going to his eternal house[c][b], and the mourners go about in the street.
translation:
  language: ru
  text: Боятся они высоты, и на дороге — ужасы; миндальное дерево цветёт, кузнечик еле тащится[a], и ягода каперса теряет силу[b], ведь человек уходит в свой вечный дом, а по улице ходят плакальщики[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кузнечик становится обузой». Еврейское выражение трудно для понимания: образ может указывать либо на немощное движение, либо на то, что в старости даже самая лёгкая вещь становится тяжёлой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «желание угасает». В еврейском тексте буквально упомянута ягода каперса, которую, вероятно, связывали с возбуждением аппетита или желания.'
    reason: lexical_alternative
  - marker: c
    text: Среди плакальщиков могли быть люди, которых нанимали для публичного оплакивания умершего.
    reason: cultural_note
lexical_decisions:
- source_word: מִגָּבֹהַּ יִרָאוּ
  choice: боятся они и высоты
  rationale: Сочетание предлога מִן со словом «высокое, высота» передаёт страх перед высотой; русский оборот естественно вписывается в описание старческой немощи.
- source_word: חַתְחַתִּים בַּדֶּרֶךְ
  choice: опасностей на дороге
  rationale: Редкое существительное во множественном числе обозначает пугающие явления или ужасы. «Опасности» звучит естественно и сохраняет конкретный образ пути, не превращая его в отвлечённую метафору.
- source_word: יָנֵאץ הַשָּׁקֵד
  choice: миндальное дерево цветёт
  rationale: Глагольная форма трудна, но традиционное понимание «цветёт» хорошо соответствует ряду образов старения; белый цвет миндаля может напоминать седину.
- source_word: יִסְתַּבֵּל הֶחָגָב
  choice: кузнечик еле тащится
  rationale: Трудная возвратная форма допускает разные толкования. Выбранный вариант передаёт ослабленное движение в контексте телесного угасания; буквенно близкая альтернатива отмечена в сноске.
- source_word: תָפֵר הָאֲבִיּוֹנָה
  choice: ягода каперса теряет силу
  rationale: Существительное, вероятнее всего, обозначает ягоду каперса, которую связывали с возбуждением аппетита или желания. Перевод сохраняет конкретный еврейский образ, а возможный переносный смысл вынесен в сноску.
- source_word: הָאָדָם
  choice: человек
  rationale: Артиклированное существительное здесь обозначает отдельного человека как представителя смертного человечества. Русское «человек» сохраняет и единственное число, и обобщающий смысл.
- source_word: בֵּית עוֹלָמוֹ
  choice: свой вечный дом
  rationale: Буквально — «дом его вечности». «Вечный дом» сохраняет торжественную метафору смерти, не уточняя сверх сказанного характер посмертного состояния.
- source_word: סָבְבוּ בַשּׁוּק הַסֹּפְדִים
  choice: по улице ходят плакальщики
  rationale: Глагол означает хождение вокруг или по округе, а שׁוּק — улицу либо рынок. Формулировка передаёт публичное движение оплакивающих без излишней конкретизации места.
theological_decisions:
- issue: Обобщающее значение הָאָדָם и образ посмертного удела
  choice: человек уходит в свой вечный дом
  alternative: люди уходят в вечный дом / человек уходит в своё последнее пристанище
  rationale: Единственное число сохранено как образ всякого смертного человека. «Вечный дом» передаёт буквальную метафору текста и его богословское напряжение, не отождествляя этот дом прямо ни с могилой, ни с определённым учением о загробной жизни.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Параллельные образы соединены плавно; трудные еврейские выражения не сглажены до однозначной аллегории, а существенные альтернативы сохранены в сносках.
