  text: עַ֣ד אֲשֶׁ֤ר לֹֽא ירחק חֶ֣בֶל הַ/כֶּ֔סֶף וְ/תָרֻ֖ץ גֻּלַּ֣ת הַ/זָּהָ֑ב וְ/תִשָּׁ֤בֶר כַּד֙ עַל הַ/מַּבּ֔וּעַ וְ/נָרֹ֥ץ הַ/גַּלְגַּ֖ל אֶל הַ/בּֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/006.yaml
  text: before the silver cord is snapped[a], and the golden bowl is shattered, and the jar is broken at the spring[d][c][b], and the wheel is crushed at the pit.
translation:
  language: ru
  text: прежде чем оборвётся[a] серебряный шнур, разобьётся золотая чаша, расколется кувшин[b] у источника и сломается колесо[c] у колодца[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол в этом контексте труден для понимания; возможны переводы: «будет удалён», «будет отсечён» или, традиционно, «развяжется».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сосуд».'
    reason: lexical_alternative
  - marker: c
    text: Возможно, имеется в виду колодезное колесо или ворот.
    reason: lexical_alternative
  - marker: d
    text: Еврейское слово может также означать «яму» или «водосборник».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: пока не
  rationale: В продолжение призыва помнить Творца оборот естественно обозначает время до наступления смерти; по-русски последовательность образов плавно вводится словами «пока не».
- source_word: ירחק
  choice: порвётся
  rationale: Глагольная форма и её смысл в данном контексте трудны. «Порвётся» естественно сочетается с нитью, соответствует параллельным образам разрушения и не устраняет лексическую неопределённость, отмеченную в сноске.
- source_word: חֶבֶל הַכֶּסֶף
  choice: серебряная нить
  rationale: «Нить» передаёт тонкий шнур или тесьму и сохраняет традиционный поэтический образ; буквальное «серебряный шнур» здесь звучит тяжелее.
- source_word: וְתָרֻץ
  choice: не разобьётся
  rationale: Форма от רצץ выражает сокрушение; применительно к чаше глагол «разбиться» естественен и достаточно силён.
- source_word: גֻּלַּת הַזָּהָב
  choice: золотая чаша
  rationale: גֻּלָּה может обозначать чашу или сосуд, иногда резервуар светильника. «Золотая чаша» сохраняет образ, не уточняя спорную функцию предмета.
- source_word: וְתִשָּׁבֶר כַּד
  choice: не расколется кувшин
  rationale: כַּד — сосуд для воды, обычно кувшин. «Расколется» передаёт разрушение хрупкого сосуда и позволяет избежать монотонного повтора.
- source_word: עַל הַמַּבּוּעַ
  choice: у источника
  rationale: מַבּוּעַ обозначает источник, родник или место выхода воды; «у источника» точно и естественно передаёт пространственное отношение.
- source_word: וְנָרֹץ
  choice: не сломается
  rationale: Тот же корень רצץ указывает на разрушение. Для колеса современное русское «сломается» естественнее, чем «раздробится», при этом сохраняет итоговый смысл.
- source_word: הַגַּלְגַּל
  choice: колесо
  rationale: Основное значение — «колесо»; в данном водозаборном контексте это, возможно, колодезное колесо или ворот, что отмечено в сноске.
- source_word: אֶל הַבּוֹר
  choice: у колодца
  rationale: בּוֹר может означать яму, водосборник, цистерну или колодец. Сочетание с кувшином, источником и колесом поддерживает «колодец»; предлог אֶל после глагола разрушения допускает пространственное понимание у места, а не обязательное движение внутрь.
theological_decisions:
- issue: Толкование последовательности образов
  choice: Сохранить буквальные поэтические образы разрушающихся предметов как картину приближения смерти, не отождествляя их с отдельными частями тела.
  alternative: Передать каждый предмет как прямую аллегорию конкретного органа или телесной функции стареющего человека.
  rationale: Общий контекст указывает на смерть и угасание жизни, но точное соответствие отдельных образов частям тела спорно. Сохранение образного ряда не снимает заложенную в тексте смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но доступной поэтической интонацией. Параллельная цепь конструкций с «не» сохраняет ритм оригинала; конкретные образы оставлены без аллегорической расшифровки.
