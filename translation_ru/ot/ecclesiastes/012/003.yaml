source:
  edition: WLC
  text: בַּ/יּ֗וֹם שֶׁ/יָּזֻ֨עוּ֙ שֹׁמְרֵ֣י הַ/בַּ֔יִת וְ/הִֽתְעַוְּת֖וּ אַנְשֵׁ֣י הֶ/חָ֑יִל וּ/בָטְל֤וּ הַ/טֹּֽחֲנוֹת֙ כִּ֣י מִעֵ֔טוּ וְ/חָשְׁכ֥וּ הָ/רֹא֖וֹת בָּ/אֲרֻבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/003.yaml
  text: on the day when the keepers of the house tremble[a], and the men of strength are bent, and the grinders cease because they are few, and those looking through the windows grow dark[b],
translation:
  language: ru
  text: в тот день, когда задрожат стражи дома[a], согнутся сильные мужи, перестанут молоть мелющие, потому что их осталось мало, и померкнут смотрящие сквозь окна[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эти образы, вероятно, описывают угасание человека в старости: «стражи дома» могут означать руки, «сильные мужи» — ноги, «мелющие» — зубы, а «смотрящие сквозь окна» — глаза.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сквозь решётчатые проёмы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: в тот день, когда
  rationale: Сохраняет временную рамку еврейского текста и естественно вводит ряд поэтических образов.
- source_word: יָזֻעוּ
  choice: задрожат
  rationale: Передаёт физическую дрожь и согласуется с будущей перспективой последовательных форм в стихе.
- source_word: שֹׁמְרֵי הַבַּיִת
  choice: стражи дома
  rationale: Близко передаёт образ оригинала, не подменяя его предполагаемым указанием на руки.
- source_word: הִתְעַוְּתוּ
  choice: согнутся
  rationale: Естественно выражает телесную согбенность или искривление, сохраняя поэтическую недосказанность.
- source_word: אַנְשֵׁי הֶחָיִל
  choice: сильные мужи
  rationale: Сохраняет мужской образ и значение силы; выражение звучит возвышенно, но понятно в поэтическом контексте.
- source_word: בָטְלוּ
  choice: перестанут молоть
  rationale: Глагольное раскрытие делает сочетание с субстантивированным причастием естественным по-русски и передаёт прекращение работы.
- source_word: הַטֹּחֲנוֹת
  choice: мелющие
  rationale: Сохраняет буквальный хозяйственный образ и грамматически женский референт, не заменяя его словом «зубы».
- source_word: כִּי מִעֵטוּ
  choice: потому что их осталось мало
  rationale: Ясно передаёт причинную связь и уменьшение числа действующих лиц образа.
- source_word: חָשְׁכוּ
  choice: померкнут
  rationale: Поэтически и естественно передаёт утрату света или ясности зрения.
- source_word: הָרֹאוֹת
  choice: смотрящие
  rationale: Сохраняет причастную форму и не отождествляет образ прямо с глазами.
- source_word: בָּאֲרֻבּוֹת
  choice: в окна
  rationale: В сочетании «смотрящие в окна» это наиболее естественное русское выражение; возможное значение «решётчатые проёмы» отмечено в сноске.
theological_decisions:
- issue: Следует ли прямо расшифровать образы как части стареющего тела
  choice: Сохранить в основном тексте образы дома и его обитателей
  alternative: Передать стражей как руки, сильных мужей как ноги, мелющих как зубы, а смотрящих как глаза
  rationale: Контекст с большой вероятностью изображает старение, однако сам еврейский текст не устанавливает однозначно соответствие каждого образа определённой части тела.
- issue: Передача мужского обозначения אַנְשֵׁי הֶחָיִל
  choice: сильные мужи
  alternative: сильные; силачи
  rationale: Выбор сохраняет грамматически мужской человеческий образ оригинала и его поэтическую приподнятость без дополнительного толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Синтаксический параллелизм и метафорика оригинала сохранены; запятая в конце учитывает продолжение предложения в контексте главы.
