base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/011.yaml
  text: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
translation:
  language: ru
  text: Слова мудрых — словно стрекала, а собранные изречения[a] — словно крепко вбитые гвозди; они даны от одного пастуха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для толкования; возможно также: «составители сборников» или «руководители собраний».'
    reason: alternative_reading
  - marker: b
    text: Под «одним пастухом» может подразумеваться Бог как высший источник мудрости, однако в самом стихе пастух прямо не назван.
    reason: theological_ambiguity
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: Слова мудрых
  rationale: Передаёт конструкцию буквально и естественно по-русски, не уточняя пол мудрых людей и не сужая значение דִּבְרֵי до отдельных афоризмов.
- source_word: כַּדָּרְבֹנוֹת
  choice: словно стрекала
  rationale: דָּרְבֹן обозначает заострённое орудие, которым понукают скот. «Стрекала» сохраняет конкретный образ и возвышенный, но понятный библейский регистр.
- source_word: וּכְמַשְׂמְרוֹת נְטוּעִים
  choice: словно крепко вбитые гвозди
  rationale: מַשְׂמְרוֹת может означать гвозди или колышки, а נְטוּעִים буквально — «посаженные». В русском образе гвоздей естественно «крепко вбитые», что передаёт прочную закреплённость без неясной кальки.
- source_word: בַּעֲלֵי אֲסֻפּוֹת
  choice: собранные изречения
  rationale: Трудное выражение буквально связано с «владетелями/распорядителями» и «собраниями/сборниками». В литературном контексте Экклезиаста «собранные изречения» естественно связывает образ гвоздей со словами мудрых; формальная неоднозначность сохранена в сноске.
- source_word: נִתְּנוּ
  choice: они даны
  rationale: Форма нифаля от נתן передана пассивно. Местоимение естественно отсылает к словам и изречениям, сохраняя множественное число исходного текста.
- source_word: מֵרֹעֶה אֶחָד
  choice: одним пастухом
  rationale: Русский творительный падеж после «даны» естественно выражает источник или деятеля. Слово «пастух» оставлено со строчной буквы, поскольку древнееврейский текст прямо не называет его Богом.
theological_decisions:
- issue: Кто такой «один пастух»
  choice: Личность пастуха в основном тексте не уточняется; слово написано со строчной буквы.
  alternative: Бог как высший источник мудрости; Соломон или Кохелет как единый учитель; обобщённый образ единого источника мудрых наставлений.
  rationale: Сам стих не устанавливает однозначно, кого обозначает пастух. Буквальный образ сохраняет возможный богословский смысл, не превращая его в прямо высказанное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Параллельная конструкция со «словно» делает сопоставления ясными; «стрекала» сохраняет древний предметный образ, а трудное בַּעֲלֵי אֲסֻפּוֹת не перегружает основной текст и поясняется в сноске.
