  yaml_path: translation/ot/ecclesiastes/012/008.yaml
  text: “Vapor of vapors,” says the Teacher[a]; “everything is vapor.”
translation:
  language: ru
  text: «Дуновение дуновений, — сказал Учитель[b], — всё — дуновение».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Суета сует… всё — суета»; «Тщета тщет… всё — тщета». Еврейское הבל буквально обозначает дыхание, дуновение или пар — нечто мимолётное, неосязаемое и неуловимое.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Екклесиаст»; еврейское слово, вероятно, обозначает того, кто обращается к собранию и наставляет его.'
    reason: title_clarification
lexical_decisions:
- source_word: הֲבֵל הֲבָלִים
  choice: дыхание дыханий
  rationale: Сочетание существительного с формой множественного числа выражает предельную степень. «Дыхание» сохраняет конкретный образ чего-то краткого, неуловимого и не имеющего прочной формы; в отличие от традиционной «суеты», оно не сужает значение до беспокойной деятельности или тщеславия.
- source_word: אָמַר
  choice: сказал
  rationale: Перфект естественно передаётся прошедшим временем; здесь это вводная формула заключительного изречения Учителя.
- source_word: הַקּוֹהֶלֶת
  choice: Учитель
  rationale: В данном контексте слово выступает как титул человека, обращающегося к собранию и наставляющего его. «Учитель» понятно современному читателю и не привносит обязательного церковно-проповеднического оттенка.
- source_word: הַכֹּל
  choice: всё
  rationale: Кратко и естественно передаёт всеохватность еврейского выражения.
- source_word: הָבֶל
  choice: дыхание
  rationale: 'Повтор того же русского слова сохраняет ключевой рефрен и его многозначный образ: мимолётность, неосязаемость, непрочность и неуловимость.'
theological_decisions:
- issue: Передача ключевого слова הבל в книге Екклесиаста
  choice: дыхание
  alternative: суета; тщета; пар; мимолётность
  rationale: «Дыхание» сохраняет предметный образ и не сводит многозначное слово к одному толкованию — нравственному тщеславию, бесполезности или бессмысленности. Тем самым сохраняется напряжение между краткостью, неуловимостью и непрочностью человеческого существования.
- issue: Передача титула קהלת
  choice: Учитель
  alternative: Екклесиаст; Проповедник; Собирающий
  rationale: Перевод титула делает его функцию понятной, не превращая его в личное имя и не приписывая носителю исключительно церковную роль.
translation_notes:
  register: Современный литературный русский язык с намеренно краткой, афористичной и слегка возвышенной конструкцией. Повтор «дыхание» и формула «дыхание дыханий» сохраняют поэтический параллелизм и предельное усиление оригинала; тире помогают ясно оформить обрамляющую прямую речь.
