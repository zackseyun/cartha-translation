base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/014.yaml
  text: For God will bring every deed into judgment[a], with every hidden thing, whether good or evil.
translation:
  language: ru
  text: Ибо Бог приведёт на суд всякое дело[a], касательно всего сокрытого, будь оно добрым или злым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «включая всё сокрытое»; или: «вместе со всем сокрытым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для заключительного наставления предыдущего стиха; «ибо» естественно передаёт пояснительно-причинную связь и соответствует достоинству контекста.
- source_word: אֶת כָּל מַעֲשֶׂה
  choice: всякое дело
  rationale: Сочетание с כָּל имеет распределительное значение. «Дело» достаточно широко и в данном контексте допускает нравственную оценку, не сужая смысл до отдельного вида поступков.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Определённая форма в еврейском языке здесь естественно передаётся русским собственным обозначением «Бог» без артиклевого оттенка.
- source_word: יָבִא בְמִשְׁפָּט
  choice: приведёт на суд
  rationale: Каузативная форма בוא означает «привести», а сочетание с בְמִשְׁפָּט указывает на представление дела судебной оценке. «Приведёт на суд» — современная и ясная русская формулировка.
- source_word: עַל כָּל נֶעְלָם
  choice: включая всё сокрытое
  rationale: נֶעְלָם обозначает скрытое или утаённое. Предлог עַל допускает здесь несколько способов понимания связи с судом; основной вариант естественно выражает охват всего сокрытого, а альтернативы сохранены в сноске.
- source_word: אִם טוֹב וְאִם רָע
  choice: будь оно добрым или злым
  rationale: Еврейская парная конструкция охватывает весь нравственный диапазон. Местоимение «оно» грамматически соотносится со «всем сокрытым», а творительный падеж после «будь» звучит естественно в современном литературном русском.
theological_decisions:
- issue: Охват и время Божьего суда
  choice: Стих утверждает, что Бог подвергнет суду всякое дело, в том числе сокрытое, не уточняя время и механизм суда.
  alternative: Понимать сказанное исключительно как последний суд либо как совокупность суда в истории и последнего суда.
  rationale: Еврейский текст подчёркивает всеохватность Божьего суда, но сам по себе не ограничивает его только эсхатологическим событием и не описывает его осуществление; перевод сохраняет эту открытость.
- issue: Нравственная характеристика сокрытого
  choice: «будь оно добрым или злым» относится непосредственно ко всему сокрытому, не предполагая, что сокрытое обязательно зло.
  alternative: Отнести «доброе или злое» ко всякому делу в целом.
  rationale: Обе связи близки по общему смыслу и не меняют утверждения о полном нравственном охвате суда. Русский синтаксис следует ближайшему еврейскому выражению, не отождествляя сокрытое исключительно с грехом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. «Ибо» сохраняет связь с предыдущим наставлением; остальные формулировки понятны без специальной богословской подготовки. Маркер [a] помещён при выражении о суде, поскольку сноска поясняет неоднозначную связь עַל כָּל נֶעְלָם со всей конструкцией.
