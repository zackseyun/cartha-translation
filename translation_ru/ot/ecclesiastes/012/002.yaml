  text: before the sun and the light and the moon and the stars grow dark[a], and the clouds return after the rain.
translation:
  language: ru
  text: прежде чем померкнут солнце, и свет, и луна, и звёзды[a], и вернутся тучи после дождя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде чем солнце, и дневной свет, и луна, и звёзды помрачатся».'
    reason: 'Лексическая альтернатива: אוֹר может означать «дневной свет», а תֶחְשַׁךְ — «помрачиться».'
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: прежде чем
  rationale: В данном контексте сочетание указывает на то, что действие должно произойти до наступления описываемого времени; «прежде чем» естественно передаёт этот смысл по-русски.
- source_word: תֶחְשַׁךְ
  choice: померкнут
  rationale: Форма Qal выражает наступление темноты или утрату яркости. «Померкнут» сохраняет непереходный смысл и подходит к поэтическому перечислению светил.
- source_word: הַשֶּׁמֶשׁ וְהָאוֹר וְהַיָּרֵחַ וְהַכּוֹכָבִים
  choice: солнце, и свет, и луна, и звёзды
  rationale: Прямые соответствия сохраняют простоту образов и повторяющийся союз еврейского текста.
- source_word: וְשָׁבוּ
  choice: и снова появятся
  rationale: Буквально глагол означает «вернутся». В сочетании с тучами по-русски естественнее «снова появятся», при этом сохраняется смысл их возвращения.
- source_word: הֶעָבִים אַחַר הַגָּשֶׁם
  choice: тучи после дождя
  rationale: «Тучи» естественно передаёт עָבִים в образе ненастья, а «после дождя» прямо воспроизводит временное отношение.
theological_decisions:
- issue: Толкование образов померкших светил и возвращающихся туч
  choice: Сохранить поэтические образы без пояснения в основном тексте.
  alternative: Раскрыть их как метафору старости, угасания человеческих сил или повторяющихся бед.
  rationale: Сам стих даёт образы, но не объясняет их однозначно. Перевод сохраняет интерпретационную и богословскую напряжённость контекста.
translation_notes:
  register: Современный литературный русский язык; поэтический, но понятный ряд сохранён. Начальная форма «прежде чем» намеренно продолжает синтаксис предыдущего стиха.
