base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/007.yaml
  text: and the dust returns to the earth as it was[a], and the spirit returns to God who gave it.
translation:
  language: ru
  text: И прах возвратится в землю, как было прежде, а дух[a] возвратится к Богу, который дал его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыхание». Древнееврейское רוּחַ может означать «дух», «дыхание» или «ветер»; в контексте смерти более вероятно значение «дух», хотя «дыхание» остаётся возможным переводом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב
  choice: и возвратится
  rationale: Форма Qal imperfect выражает неизбежный будущий исход; будущее время естественно для русского контекста и сохраняет последовательность, отмеченную союзом וְ.
- source_word: הֶעָפָר
  choice: прах
  rationale: Определённое существительное обозначает вещество человеческого тела и перекликается с языком творения и смертности; «прах» сохраняет достоинство и библейскую образность, оставаясь понятным современному читателю.
- source_word: עַל הָאָרֶץ
  choice: в землю
  rationale: При глаголе שוב предлог עַל здесь передаёт возвращение к месту. Русское «в землю» естественно описывает возвращение тела после смерти; выбор «земля», а не «почва», соответствует אֶרֶץ.
- source_word: כְּשֶׁהָיָה
  choice: как было прежде
  rationale: Сравнительное придаточное указывает на возвращение к прежнему состоянию. Безличная русская конструкция естественна и не вводит отсутствующего в тексте пояснения о происхождении праха.
- source_word: וְהָרוּחַ
  choice: а дух
  rationale: רוּחַ может означать дух, дыхание или ветер. В параллели с прахом, возвращающимся в землю, и перед словами о возвращении к давшему его Богу «дух» лучше всего передаёт смысл, не исключая лексически возможного «дыхание», указанного в сноске. Союз «а» естественно выражает сопоставление двух частей в русском языке.
- source_word: תָּשׁוּב
  choice: возвратится
  rationale: Повтор того же русского глагола сохраняет лексическую связь с וְיָשֹׁב и поэтический параллелизм стиха.
- source_word: אֶל הָאֱלֹהִים
  choice: к Богу
  rationale: Предлог אֶל обозначает направленность движения; «к Богу» — прямое и естественное русское соответствие.
- source_word: אֲשֶׁר נְתָנָהּ
  choice: который дал его
  rationale: Придаточное определяет Бога как Подателя духа. Местоимение «его» согласуется с грамматическим родом русского слова «дух», тогда как древнееврейский суффикс женского рода согласован с רוּחַ.
theological_decisions:
- issue: Значение רוּחַ при описании человеческой смерти
  choice: дух
  alternative: дыхание
  rationale: Контраст с прахом тела и возвращение к Богу, который дал רוּחַ, поддерживают перевод «дух», однако текст не определяет подробно природу человеческого существа. Возможное значение «дыхание» сохранено в сноске, чтобы не устранять присущую древнееврейскому слову смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским словом «прах». Синтаксис сделан ясным и ритмичным; повтор «возвратится» сохраняет параллелизм оригинала. Неоднозначность רוּחַ отмечена сноской.
