  text: 'And beyond these[a], my son, be warned: of making many books there is no end, and much study is a weariness of the flesh.'
translation:
  language: ru
  text: 'А сверх всего этого, сын мой, прими предостережение: составлению множества книг нет конца, а много читать[a] — утомительно для тела.'
  philosophy: optimal-equivalence
