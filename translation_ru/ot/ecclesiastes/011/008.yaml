source:
  edition: WLC
  text: כִּ֣י אִם שָׁנִ֥ים הַרְבֵּ֛ה יִחְיֶ֥ה הָ/אָדָ֖ם בְּ/כֻלָּ֣/ם יִשְׂמָ֑ח וְ/יִזְכֹּר֙ אֶת יְמֵ֣י הַ/חֹ֔שֶׁךְ כִּֽי הַרְבֵּ֥ה יִהְי֖וּ כָּל שֶׁ/בָּ֥א הָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/008.yaml
  text: For if a man lives many years[a], let him rejoice in them all; but let him remember the days of darkness, for they will be many. All that comes is vapor.
translation:
  language: ru
  text: Ибо если человек проживёт много лет, пусть радуется всем этим годам; но пусть помнит о днях тьмы, потому что их будет много. Всё, что приходит, — пар[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыхание»; традиционно: «суета» или «тщета». Еврейское слово הֶבֶל (хе́вел), неоднократно встречающееся в книге Екклесиаста, обозначает нечто мимолётное, непрочное или неуловимое.'
    reason: Лексическая альтернатива для ключевого многозначного слова книги.
lexical_decisions:
- source_word: כִּי אִם
  choice: Даже если
  rationale: 'В данном контексте сочетание вводит уступительно-условную мысль: долгая жизнь не отменяет предстоящих дней тьмы. Такой перевод естественно связывает стих с дальнейшим предостережением.'
- source_word: שָׁנִים הַרְבֵּה
  choice: много лет
  rationale: Прямо передаёт представление о долгой жизни без излишнего усиления.
- source_word: הָאָדָם
  choice: человек
  rationale: Еврейское существительное употреблено в единственном числе и имеет обобщённое значение; русское «человек» точно и естественно сохраняет его.
- source_word: בְּכֻלָּם יִשְׂמָח
  choice: пусть радуется каждому из них
  rationale: Местоимение относится к годам; «каждому из них» по-русски ясно передаёт мысль о радости во все годы жизни, а форма «пусть» сохраняет увещательный оттенок.
- source_word: וְיִזְכֹּר
  choice: но пусть помнит
  rationale: Формально союз означает «и», однако в контексте он противопоставляет радость памяти о грядущей тьме; «но» естественно выражает это отношение.
- source_word: יְמֵי הַחֹשֶׁךְ
  choice: дни тьмы
  rationale: 'Сохраняет образность и намеренную многозначность: речь может идти о бедствиях, старости, смерти или мраке могилы.'
- source_word: כִּי הַרְבֵּה יִהְיוּ
  choice: потому что их будет много
  rationale: Ясно передаёт причинное значение и относит местоимение к дням тьмы.
- source_word: כָּל שֶׁבָּא
  choice: всё грядущее
  rationale: Причастная форма может указывать на то, что приходит или ещё наступит; «всё грядущее» кратко и естественно передаёт широкое, обобщающее значение.
- source_word: הָבֶל
  choice: пар
  rationale: Конкретный образ передаёт мимолётность, неуловимость и непрочность, не сводя слово к оценке «бессмысленно».
theological_decisions:
- issue: Обобщённое значение הָאָדָם
  choice: человек
  alternative: мужчина; всякий человек
  rationale: В стихе говорится не исключительно о мужчине, а о человеке как представителе человечества. Русское «человек» сохраняет число и обобщённый смысл.
- issue: Значение הָבֶל
  choice: пар
  alternative: дыхание; суета; тщета
  rationale: «Пар» сохраняет центральную предметную метафору книги и её смысловой диапазон — мимолётность, неуловимость и непрочность, — не вводя более узкого вывода о бессмысленности.
- issue: Референт «дней тьмы»
  choice: образ оставлен без поясняющего уточнения в тексте
  alternative: дни бедствий; старость; смерть и пребывание в могиле
  rationale: Еврейский образ допускает несколько взаимосвязанных толкований; перевод не должен выбирать одно из них без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной поэтичностью. Синтаксис сохраняет увещательный ритм стиха, а образы «дни тьмы» и «пар» оставлены конкретными и богословски ненагруженными.
