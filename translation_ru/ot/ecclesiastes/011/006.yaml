translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного наставительного тона и сельскохозяйственной образности. Формы «сей» и «не давай» передают обращение к одному человеку. Неопределённость относительно того, какое из начинаний даст хороший результат, сохранена.
