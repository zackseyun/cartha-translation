base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/006.yaml
  text: In the morning sow your seed[a], and in the evening do not let your hand rest, for you do not know which will succeed, this or that[b], or whether both alike will be good.
translation:
  language: ru
  text: Утром сей своё семя и вечером не давай своей руке покоя, потому что ты не знаешь, какое из них окажется успешным — это или то, или же и то и другое окажутся одинаково хорошими.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не давай своей руке покоя»; то есть не прекращай трудиться.'
    reason: cultural_note
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Утром
  rationale: Естественно и точно передаёт обстоятельство времени, обозначающее первую часть дня.
- source_word: זְרַע אֶת זַרְעֶךָ
  choice: сей своё семя
  rationale: Сохраняет сельскохозяйственный образ и однокоренную связь глагола «сеять» с существительным «семя».
- source_word: וְלָעֶרֶב
  choice: и вечером
  rationale: Сохраняет параллелизм с «утром» и сочинительную связь еврейского текста.
- source_word: אַל תַּנַּח יָדֶךָ
  choice: не давай руке своей покоя
  rationale: Передаёт конкретный еврейский образ и при этом понятно выражает призыв не прекращать труд.
- source_word: כִּי אֵינְךָ יוֹדֵעַ
  choice: потому что ты не знаешь
  rationale: Ясно выражает причинную связь между наставлением и неопределённостью результата.
- source_word: אֵי זֶה יִכְשָׁר
  choice: что преуспеет
  rationale: В данном противопоставлении אֵי זֶה указывает на выбор между двумя начинаниями, а יִכְשָׁר означает успешный, благоприятный исход.
- source_word: הֲזֶה אוֹ זֶה
  choice: то или это
  rationale: Сохраняет контраст двух указательных выражений без уточнения, какие именно труды имеются в виду.
- source_word: וְאִם שְׁנֵיהֶם כְּאֶחָד טוֹבִים
  choice: или же и то и другое окажется одинаково хорошим
  rationale: 'Передаёт третью возможность: благоприятными могут оказаться оба начинания в равной мере; будущее «окажется» естественно выражает подразумеваемый результат.'
