revisions:
- from: Как ты не знаешь пути ветра[a] и того, как образуются кости во чреве беременной женщины[b], так не знаешь и дела Бога, Который творит всё.
  to: Подобно тому как ты не знаешь, каким путём идёт ветер[a], и как образуются кости в утробе беременной женщины[b], так и не знаешь деяний Бога, Который совершает всё.
  rationale: Правка делает русский синтаксис более естественным, сохраняя образ «пути» и сравнительную структуру оригинала. «Совершает всё» точнее передаёт широкий глагол עשה, чем «творит всё». Сноска b уточнена для более точной передачи буквальной формы еврейского идиоматического выражения.
  reviewer_model: gpt-5.6-terra
