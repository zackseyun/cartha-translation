  text: כַּ/אֲשֶׁ֨ר אֵֽינְ/ךָ֤ יוֹדֵ֨עַ֙ מַה דֶּ֣רֶךְ הָ/ר֔וּחַ כַּ/עֲצָמִ֖ים בְּ/בֶ֣טֶן הַ/מְּלֵאָ֑ה כָּ֗כָה לֹ֤א תֵדַע֙ אֶת מַעֲשֵׂ֣ה הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר יַעֲשֶׂ֖ה אֶת הַ/כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/005.yaml
  text: Just as you do not know the way of the wind[a], or how the bones form in the womb of a pregnant woman, so you do not know the work of God[b], who makes everything.
translation:
  language: ru
  text: Подобно тому как ты не знаешь, каким путём идёт ветер[a], и как образуются кости в утробе беременной женщины[b], так и не знаешь деяний Бога, Который совершает всё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «каким путём идёт дух»; возможно также: «как движется дыхание». Еврейское слово רוּחַ может означать «ветер», «дыхание» или «дух».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в утробе полной [женщины]»; это идиоматическое обозначение беременной женщины.'
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ הָרוּחַ
  choice: пути ветра
  rationale: רוּחַ может означать «ветер», «дыхание» или «дух». В контексте размышления о непостижимых для человека явлениях природы наиболее вероятно значение «ветер»; слово דֶּרֶךְ передано буквально как «путь», а подлинная многозначность отмечена в сноске.
- source_word: כַּעֲצָמִים
  choice: как образуются кости
  rationale: 'Еврейское выражение эллиптично: буквально «как кости». Добавление глагола «образуются» естественно раскрывает подразумеваемый процесс внутриутробного развития, не уточняя его сверх сказанного в контексте.'
- source_word: בְּבֶטֶן הַמְּלֵאָה
  choice: во чреве беременной женщины
  rationale: Буквально הַמְּלֵאָה означает «наполненной» или «полной»; здесь это идиоматическое обозначение беременной женщины. «Во чреве» сохраняет возвышенный библейский регистр и остаётся понятным современному читателю.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: дела Бога
  rationale: Единственное число «дела» передаёт מַעֲשֵׂה как совокупное Божье действие и сохраняет форму исходного выражения.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל
  choice: Который творит всё
  rationale: Относительное предложение естественно относится к Богу. «Творит всё» передаёт широкий смысл עשה — «делать, совершать, создавать» — и всеохватность הַכֹּל.
theological_decisions:
- issue: Значение רוּחַ в данном стихе
  choice: ветер
  alternative: дух; дыхание
  rationale: Контекст подчёркивает человеческое незнание сокрытых процессов в творении и Божьих дел. «Ветер» лучше всего соответствует этому образу, однако еврейское слово действительно допускает значения «дух» и «дыхание», поэтому они сохранены в сноске, а не исключены толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «во чреве» выбран как понятный и достойный по регистру; синтаксис сохраняет параллель «как… так…». Заглавная буква в «Который» соответствует распространённой русской библейской издательской традиции.
