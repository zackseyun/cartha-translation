  text: שֹׁמֵ֥ר ר֖וּחַ לֹ֣א יִזְרָ֑ע וְ/רֹאֶ֥ה בֶ/עָבִ֖ים לֹ֥א יִקְצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/004.yaml
  text: Whoever watches the wind will not sow[a], and whoever looks at the clouds will not reap.
translation:
  language: ru
  text: Кто следит за ветром, тот не станет сеять, и кто смотрит на облака, тот не станет жать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наблюдающий за ветром не посеет, и глядящий на облака не пожнёт».'
    reason: лексическая и синтаксическая альтернатива
lexical_decisions:
- source_word: שֹׁמֵר
  choice: следит
  rationale: Причастие обозначает того, кто внимательно и постоянно наблюдает. «Следит» естественно передаёт это значение и не вносит неподходящего смысла охраны.
- source_word: רוּחַ
  choice: ветром
  rationale: В контексте сева и облаков слово имеет метеорологическое значение «ветер», а не «дух» или «дыхание».
- source_word: יִזְרָע
  choice: не станет сеять
  rationale: Имперфект выражает обычное следствие в пословичном изречении; такая конструкция естественна по-русски.
- source_word: וְרֹאֶה
  choice: и кто смотрит
  rationale: Причастие образует параллель с שֹׁמֵר и обозначает любого человека, поступающего таким образом. «Смотрит» сохраняет различие между двумя близкими глаголами наблюдения.
- source_word: בֶעָבִים
  choice: на облака
  rationale: После русского глагола «смотреть» предлог ב естественно передаётся как «на»; «облака» сохраняет сельскохозяйственный образ погоды.
- source_word: יִקְצוֹר
  choice: не станет жать
  rationale: Глагол означает жатву. «Жать» сохраняет краткую традиционную пару «сеять — жать» и передаёт общее следствие.
