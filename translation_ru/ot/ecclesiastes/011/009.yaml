  text: שְׂמַ֧ח בָּח֣וּר בְּ/יַלְדוּתֶ֗י/ךָ וִֽ/יטִֽיבְ/ךָ֤ לִבְּ/ךָ֙ בִּ/ימֵ֣י בְחוּרוֹתֶ֔/ךָ וְ/הַלֵּךְ֙ בְּ/דַרְכֵ֣י לִבְּ/ךָ֔ וּ/בְ/מַרְאֵ֖י עֵינֶ֑י/ךָ וְ/דָ֕ע כִּ֧י עַל כָּל אֵ֛לֶּה יְבִֽיאֲ/ךָ֥ הָ/אֱלֹהִ֖ים בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/009.yaml
  text: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
translation:
  language: ru
  text: 'Радуйся, юноша, в юности твоей, и пусть сердце твоё веселит тебя в дни твоей молодости. Иди путями своего сердца и следуй тому, что открывается твоим глазам[a], но знай: за всё это Бог приведёт тебя на суд.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и по тому, что является (предстаёт) твоим глазам».'
    reason: lexical_alternative
  - marker: b
    text: В стихе одновременно звучат призыв наслаждаться молодостью и напоминание об ответственности перед Богом. Эти слова можно понимать как дозволение, ограниченное грядущим судом, или как призыв, в котором уже слышится предостережение.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמַח
  choice: Радуйся
  rationale: Повелительная форма породы qal призывает к деятельной радости и соответствует повторяющимся в книге призывам наслаждаться жизнью.
- source_word: בָּחוּר
  choice: юноша
  rationale: Существительное мужского рода в единственном числе прямо обозначает молодого мужчину; «юноша» естественно и точно передаёт обращение.
- source_word: בְּיַלְדוּתֶיךָ
  choice: пока ты молод
  rationale: В данном контексте речь идёт о поре молодости, а не о раннем детстве. Временная конструкция звучит по-русски естественно.
- source_word: וִיטִיבְךָ לִבְּךָ
  choice: пусть сердце твоё веселит тебя
  rationale: Hiphil глагола יטב с сердцем как подлежащим выражает причинение радости или блага; формулировка сохраняет каузативность и образ сердца.
- source_word: בִּימֵי בְחוּרוֹתֶךָ
  choice: в дни твоей юности
  rationale: Выражение обозначает пору юношеской силы. Буквальное «в дни твоего юношества» менее естественно в современном русском.
- source_word: וְהַלֵּךְ
  choice: Иди
  rationale: Сохранена еврейская метафора хождения как образа поведения и жизненного выбора.
- source_word: בְּדַרְכֵי לִבְּךָ
  choice: путями своего сердца
  rationale: Переданы и метафора путей, и представление о сердце как средоточии желаний и намерений.
- source_word: וּבְמַרְאֵי עֵינֶיךָ
  choice: следуй тому, что видят твои глаза
  rationale: Еврейское выражение буквально связано с «видимым глазами»; выбранная формулировка понятна современному читателю и сохраняет параллель между внутренним желанием и внешним восприятием.
- source_word: וְדָע
  choice: но знай
  rationale: Союз формально может означать «и», однако здесь вводит уравновешивающее предостережение. «Но» ясно передаёт этот дискурсивный поворот, не превращая первые повеления в иронию.
- source_word: עַל כָּל אֵלֶּה
  choice: за всё это
  rationale: В судебном контексте предлог выражает ответственность за названные поступки; русский оборот краток и естественен.
- source_word: יְבִיאֲךָ הָאֱלֹהִים בַּמִּשְׁפָּט
  choice: Бог приведёт тебя на суд
  rationale: Hiphil בוא передаёт приведение человека к судебной оценке. «Приведёт на суд» сохраняет торжественный юридический смысл и естественно звучит по-русски.
theological_decisions:
- issue: Одобряет ли стих неограниченное следование желаниям или ставит радость жизни под Божью ответственность
  choice: Основной текст сохраняет как искренний призыв к радости, так и предупреждение о Божьем суде.
  alternative: Все повеления можно понимать иронически как предостережение от юношеского своеволия; либо буквально как разрешение наслаждаться жизнью в нравственных пределах.
  rationale: Екклесиаст соединяет наслаждение жизнью с ответственностью перед Богом. Перевод не устраняет это напряжение и не приписывает тексту не выраженную явно иронию.
- issue: Род адресата
  choice: Обращение передано словом «юноша» и формами мужского рода.
  alternative: Возможны обобщающие «молодой человек» или «молодёжь», но они менее точно отражают мужской род и единственное число оригинала.
  rationale: Еврейское существительное и местоименные суффиксы имеют форму мужского рода единственного числа.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и поэтического параллелизма. Библейская метафора пути сохранена; синтаксис упрощён лишь там, где буквальная калька была бы неестественной.
