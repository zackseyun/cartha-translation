  yaml_path: translation/ot/ecclesiastes/011/003.yaml
  text: If the clouds are full of rain[a], they pour it out on the earth; and if a tree falls to the south or to the north, in the place where the tree falls, there it will lie.
translation:
  language: ru
  text: Если облака наполнятся дождём, они изольют дождь на землю; и если дерево упадёт на юг или на север, то там, где упадёт дерево, оно и останется.[a]
  philosophy: optimal-equivalence
  footnotes:
