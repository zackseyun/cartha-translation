  yaml_path: translation/ot/ecclesiastes/011/001.yaml
  text: Cast your bread upon the surface of the waters, for after many days you will find it.
translation:
  language: ru
  text: Пусти свой хлеб по водам[a], потому что спустя много дней ты найдёшь его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пошли свой хлеб по водам». Еврейский образ может подразумевать щедрость, вложение с отсроченной отдачей или и то и другое; в основном тексте метафора сохранена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁלַּח
  choice: Пусти
  rationale: Императив означает «пошли», «отпусти». «Пусти» естественно сочетается в русском с образом движения по водам и не уточняет, идёт ли речь о щедрости, торговле или ином рискованном действии.
- source_word: לַחְמְךָ
  choice: свой хлеб
  rationale: Сохраняется конкретное значение «хлеб» и образность еврейского изречения; «свой» естественно передаёт принадлежность подлежащему второго лица.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: по водам
  rationale: Буквально выражение обозначает нахождение или движение «по поверхности вод». По-русски «по водам» кратко и естественно сохраняет образ, тогда как «по поверхности вод» звучит избыточно технически.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для повеления; «потому что» ясно передаёт причинную связь в современном русском.
- source_word: בְרֹב הַיָּמִים
  choice: спустя много дней
  rationale: Передаёт временной смысл отсроченного результата и близко соответствует еврейскому выражению.
- source_word: תִּמְצָאֶנּוּ
  choice: ты найдёшь его
  rationale: Глагол означает «найти», а местоименный суффикс мужского рода естественно соотносится с существительным «хлеб»; «найдёшь» не привносит более узкого смысла «вернёшь» или «получишь обратно».
theological_decisions:
- issue: Толкование образа хлеба, пущенного по водам
  choice: Сохранить образ без сведения его к одному практическому применению.
  alternative: Передать стих как прямой призыв к щедрости либо как совет о торговом предприятии и оправданном риске.
  rationale: Еврейская формулировка остаётся метафорической и допускает несколько традиционных пониманий. Перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой мудрого изречения. Метафора оригинала сохранена, а синтаксис сделан естественным для обычного читателя.
