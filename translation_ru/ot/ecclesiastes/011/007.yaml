base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/007.yaml
  text: And the light is sweet[b][a], and it is good for the eyes to see the sun.
translation:
  language: ru
  text: Сладок[a] свет, и хорошо глазам видеть солнце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приятен»: «Свет приятен».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «видеть солнце» сохраняет буквальный образ, но может также подразумевать, что человек жив и наслаждается земной жизнью.
    reason: cultural_note
lexical_decisions:
- source_word: וּמָתוֹק
  choice: сладок
  rationale: Сохраняет конкретную метафору מָתוֹק («сладкий»), которая здесь передаёт приятность и отраду, не сводя образ к более общему «приятен».
- source_word: הָאוֹר
  choice: свет
  rationale: Прямо передаёт определённую форму הָאוֹר; в контексте имеется в виду дневной, животворный свет, однако уточнение «дневной» не вносится в основной текст.
- source_word: וְטוֹב
  choice: хорошо
  rationale: Передаёт широкое значение טוֹב и сохраняет еврейский оборот, оставаясь понятным по-русски.
- source_word: לָעֵינַיִם
  choice: глазам
  rationale: 'Дательный падеж естественно передаёт לְ в значении отношения или пользы: «хорошо глазам».'
- source_word: לִרְאוֹת
  choice: видеть
  rationale: Прямой и стилистически нейтральный эквивалент инфинитива ראה.
- source_word: אֶת־הַשָּׁמֶשׁ
  choice: солнце
  rationale: Прямо передаёт определённое дополнение «солнце»; возможный смысловой оттенок жизни под солнцем оставлен неявным.
theological_decisions:
- issue: Следует ли раскрывать выражение «видеть солнце» как указание на жизнь и наслаждение земной жизнью
  choice: Сохранить в основном тексте буквальный поэтический образ «видеть солнце»
  alternative: «наслаждаться жизнью» или «жить и видеть солнечный свет»
  rationale: Еврейский текст конкретен и образен. Буквальная передача сохраняет характерную для Екклесиаста солнечную образность и не превращает вероятный подтекст в единственно возможное толкование.
translation_notes:
  register: Современный литературный русский язык с краткой, поэтической структурой оригинала. Оборот «хорошо глазам» намеренно сохраняет лёгкий древнееврейский оттенок, оставаясь понятным современному читателю.
