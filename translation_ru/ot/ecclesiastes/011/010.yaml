  source_fidelity: Текст точно передаёт две повелительные формы и заключительное כִּי («ведь»). «Досада» допустимо передаёт כַּעַס в значении внутреннего огорчения/раздражения; «беда» для רָעָה сохраняет возможность вреда или несчастья, не сводя выражение к нравственному злу. «Тело» уместно для בָּשָׂר в данном контексте. «Юность и рассвет жизни» воспроизводит намеренно близкие по смыслу הַיַּלְדוּת וְהַשַּׁחֲרוּת, а «пар» сохраняет конкретную метафору הֶבֶל, не подменяя её толкованием.
