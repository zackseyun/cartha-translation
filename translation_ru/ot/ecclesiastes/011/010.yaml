  text: וְ/הָסֵ֥ר כַּ֨עַס֙ מִ/לִּבֶּ֔/ךָ וְ/הַעֲבֵ֥ר רָעָ֖ה מִ/בְּשָׂרֶ֑/ךָ כִּֽי הַ/יַּלְד֥וּת וְ/הַֽ/שַּׁחֲר֖וּת הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/010.yaml
  text: So remove vexation from your heart, and put away harm from your flesh, for youth and the dawn of life are vapor.
translation:
  language: ru
  text: Так удали досаду из своего сердца и отведи беду от своего тела, ведь юность и рассвет жизни — пар.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּעַס
  choice: досада
  rationale: Слово обозначает внутреннее огорчение, раздражение или досаду; «досада» естественно сочетается с сердцем и не сужает смысл до одного лишь гнева.
- source_word: רָעָה
  choice: беда
  rationale: В данном контексте возможно как нравственное «зло», так и переживаемый вред или несчастье. «Беда» передаёт вредоносное для тела явление, не вводя ненужного морализующего уточнения.
- source_word: בָּשָׂר
  choice: тело
  rationale: Буквально «плоть»; здесь речь о телесной стороне человеческой жизни, поэтому современное «тело» звучит яснее и естественнее.
- source_word: הַשַּׁחֲרוּת
  choice: рассвет жизни
  rationale: Редкое слово связано с образом черноты волос или ранней поры жизни. «Рассвет жизни» сохраняет поэтический образ и смысл молодости, не дублируя её буквально.
- source_word: הָבֶל
  choice: пар
  rationale: Ключевое слово книги означает дыхание, пар, нечто мимолётное и неуловимое; «пар» сохраняет конкретную метафору, а не истолковывает её как «суету».
theological_decisions:
- issue: 'Характер רָעָה: нравственное зло или причиняемый вред'
  choice: беда
  alternative: зло
  rationale: Сочетание с удалением от тела допускает болезнь, страдание или иной вред. Перевод не превращает стих исключительно в нравственное предписание, сохраняя контекстуальную широту.
- issue: Смысл הָבֶל применительно к юности
  choice: пар
  alternative: суета
  rationale: 'Здесь акцент вероятнее на краткости и мимолётности юности, хотя слово сохраняет характерную для книги многозначность: неуловимость, непрочность и тщетность.'
translation_notes:
  register: Современный литературный русский язык с кратким наставительным строем и сохранённой поэтической метафорой. Союз «так» передаёт связь с предыдущим призывом; императивы сформулированы естественно и достоинственно.
