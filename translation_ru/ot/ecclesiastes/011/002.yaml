id: ECC.11.2
reference: Ecclesiastes 11:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: תֶּן חֵ֥לֶק לְ/שִׁבְעָ֖ה וְ/גַ֣ם לִ/שְׁמוֹנָ֑ה כִּ֚י לֹ֣א תֵדַ֔ע מַה יִּהְיֶ֥ה רָעָ֖ה עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/002.yaml
  text: Give a portion to seven[a], and even to eight, for you do not know what disaster will happen on the earth.
translation:
  language: ru
  text: Дай долю семерым и даже восьмерым, потому что ты не знаешь, какое бедствие случится на земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране». Еврейское אֶרֶץ может означать как землю вообще, так и страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  choice: Дай
  rationale: Повелительная форма глагола נתן выражает прямой призыв; «дай» естественно и точно передаёт её в современном русском языке.
- source_word: חֵלֶק
  choice: долю
  rationale: חֵלֶק означает долю или часть; винительный падеж без артикля естественен после «дай» и сохраняет конкретный образ распределения.
- source_word: לְשִׁבְעָה וְגַם לִשְׁמוֹנָה
  choice: семерым и даже восьмерым
  rationale: Сохранены числа и нарастающая формула исходного текста. Русские собирательно-личные формы ясно указывают на получателей, не сводя образ к отвлечённому пересказу о щедрости.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего призыва; «потому что» прозрачно выражает причинную связь.
- source_word: לֹא תֵדַע
  choice: ты не знаешь
  rationale: Буквально передаёт отрицание и форму второго лица, не усиливая высказывание до «не можешь знать».
- source_word: מַה יִּהְיֶה רָעָה
  choice: какое бедствие случится
  rationale: רָעָה в данном контексте обозначает пагубное событие, а не нравственное зло; «случится» естественно передаёт событийное значение היה.
- source_word: עַל הָאָרֶץ
  choice: на земле
  rationale: «На земле» сохраняет широкий смысл אֶרֶץ и звучит естественно по-русски; возможное более узкое значение «в стране» отмечено в сноске.
theological_decisions:
- issue: Сфера значения הָאָרֶץ
  choice: земля
  alternative: страна
  rationale: Контекст общих размышлений Екклесиаста о непредсказуемых бедствиях допускает широкий смысл «земля», однако еврейское слово может обозначать и конкретную страну; неоднозначность сохранена в сноске.
- issue: Практический смысл раздачи долей
  choice: сохранить образ без уточнения, идёт ли речь о милостыне, вложениях или распределении имущества
  alternative: явно истолковать стих как призыв к благотворительности либо диверсификации
  rationale: Еврейский текст не называет ни предмет раздачи, ни её хозяйственную или благотворительную цель. Перевод не должен устранять эту содержательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Числовая формула и неопределённость предмета раздачи сохранены; синтаксис сделан естественным для обычного читателя.
