lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего наставления; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: גַּם פְּעָמִים רַבּוֹת
  choice: много раз
  rationale: Сочетание обозначает неоднократность. В русском «много раз» ясно и естественно передаёт смысл, тогда как первое גַּם не требует отдельного «также».
- source_word: יָדַע לִבֶּךָ
  choice: сердце твоё знает
  rationale: Форма перфекта выражает устойчивое знание, основанное на личном опыте, поэтому уместно настоящее время. Слово «сердце» сохранено как обозначение внутреннего человека, включая память и совесть.
- source_word: אֲשֶׁר
  choice: что
  rationale: Вводит содержание того, что известно сердцу.
- source_word: גַּם אַתָּה
  choice: и ты
  rationale: Частица с самостоятельным местоимением подчёркивает, что сам адресат поступал так же; русское «и ты» сохраняет это включающее ударение.
- source_word: קִלַּלְתָּ
  choice: проклинал
  rationale: Глагол прямо обозначает проклятие или уничижительную речь. «Проклинал» сохраняет смысловую симметрию с предыдущим стихом; более широкие речевые значения указаны в сноске.
- source_word: אֲחֵרִים
  choice: других
  rationale: Кратко и естественно обозначает других людей без ненужного уточнения.
