lexical_decisions:
- source_word: הַחָכְמָה
  choice: Мудрость
  rationale: Определённый артикль сопровождает отвлечённое существительное; в русском изречении естественно передать его без дополнительных указателей.
- source_word: תָּעֹז
  choice: придаёт… силы
  rationale: Передаёт значение наделения силой и сохраняет конструкцию с адресатом действия, оставаясь естественной по-русски.
- source_word: לֶחָכָם
  choice: мудрому
  rationale: Предлог ל выражает адресата или того, кому действие служит на пользу; субстантивированное прилагательное сохраняет единственное число и обобщённый характер изречения.
- source_word: מֵעֲשָׂרָה
  choice: больше… чем десять
  rationale: Предлог מ־ вводит сравнение; русская конструкция ясно выражает превосходство силы, которую даёт мудрость.
- source_word: שַׁלִּיטִים
  choice: правителей
  rationale: Слово обозначает людей, обладающих властью; «правители» естественно соответствует городскому контексту и не сужает должность до конкретного ранга.
- source_word: אֲשֶׁר הָיוּ בָּעִיר
  choice: находившихся в городе
  rationale: Причастный оборот естественно передаёт определительное придаточное. Форма בָּעִיר формально определённая, поэтому основной текст сохраняет «в городе», не привязывая изречение к названному городу.
