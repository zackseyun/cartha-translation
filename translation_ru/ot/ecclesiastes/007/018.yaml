  text: ט֚וֹב אֲשֶׁ֣ר תֶּאֱחֹ֣ז בָּ/זֶ֔ה וְ/גַם מִ/זֶּ֖ה אַל תַּנַּ֣ח אֶת יָדֶ֑/ךָ כִּֽי יְרֵ֥א אֱלֹהִ֖ים יֵצֵ֥א אֶת כֻּלָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/018.yaml
  text: It is good that you should grasp this[a], and also not let your hand rest from that; for the one who fears God will come out with them all.
translation:
  language: ru
  text: Хорошо, если ты будешь держаться этого[a] и при этом не будешь отнимать руки от того, потому что боящийся Бога выйдет со всем этим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительные слова можно также понять как «выйдет из всего этого», то есть благополучно пройдёт через всё это; по другому толкованию — «избежит всего этого».
    reason: Альтернативные понимания сжатой и спорной еврейской конструкции יֵצֵא אֶת כֻּלָּם.
lexical_decisions:
- source_word: טוֹב אֲשֶׁר תֶּאֱחֹז בָּזֶה
  choice: Хорошо, если ты держишься этого
  rationale: Передаёт оценочное טוֹב и сохраняет образ удерживания в אָחַז; условно-рекомендательная конструкция естественна по-русски.
- source_word: וְגַם מִזֶּה אַל תַּנַּח אֶת יָדֶךָ
  choice: и при этом не выпускаешь из руки того
  rationale: Сохраняет образ руки и смысл запрета ослабить удержание; «этого… того» различает два обсуждаемых предмета.
- source_word: יְרֵא אֱלֹהִים
  choice: боящийся Бога
  rationale: Причастное выражение обозначает человека, для которого страх Божий является устойчивой чертой.
- source_word: יֵצֵא אֶת כֻּלָּם
  choice: выйдет со всем этим
  rationale: Сохраняет основной образ глагола יָצָא и трудную, сжатую конструкцию с אֶת, не сводя её однозначно к «избежит» или «исполнит».
theological_decisions:
- issue: Смысл заключительной фразы
  choice: «выйдет со всем этим» — сохранён образ выхода и открытость отношения ко всему упомянутому
  alternative: «избежит обеих крайностей» или «успешно пройдёт через всё это»
  rationale: Еврейская конструкция необычна и допускает разные толкования. Основной текст не должен без необходимости превращать её в конкретный нравственный или доктринальный вывод.
translation_notes:
  register: Современный литературный русский язык; обращение во втором лице единственного числа соответствует еврейскому тексту. Сохранены метафоры удерживания рукой и выхода, но синтаксис сделан естественным для обычного читателя.
