base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/016.yaml
  text: Do not be overly righteous[a], and do not make yourself too wise[b]. Why should you ruin yourself?
translation:
  language: ru
  text: Не будь слишком праведным[a] и не мудрствуй сверх меры. Зачем губить себя?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не будь праведен сверх меры».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Зачем тебе быть опустошённым (разорённым)?» Еврейский глагол может также означать «прийти в ужас» или «оцепенеть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: не будь
  rationale: Отрицательная частица אַל с формой имперфекта выражает запрет или предостережение; по-русски естественно «не будь».
- source_word: צַדִּיק הַרְבֵּה
  choice: слишком праведным
  rationale: צַדִּיק прямо означает «праведный», а הַרְבֵּה в данном сочетании указывает на чрезмерность. Перевод сохраняет вызывающее напряжение исходного текста и не подменяет «праведность» толкованием вроде «самоправедность».
- source_word: תִּתְחַכַּם יוֹתֵר
  choice: не считай себя чрезмерно мудрым
  rationale: Порода хитпаэль у חכם допускает оттенок самонаправленного или демонстративного действия — представлять или выставлять себя мудрым; יוֹתֵר обозначает превышение меры. Такая формулировка естественна по-русски и передаёт рефлексивный оттенок, не утверждая, будто сама мудрость порочна.
- source_word: לָמָּה
  choice: зачем тебе
  rationale: Вводит риторический вопрос с предостерегающей силой; «зачем тебе» естественно передаёт эту функцию.
- source_word: תִּשּׁוֹמֵם
  choice: губить себя
  rationale: Глагол שמם может означать опустошение, разорение, оцепенение или ужас. В контексте последствий чрезмерности «губить себя» ясно передаёт вероятный смысл, тогда как сноска сохраняет более буквальную многозначность.
theological_decisions:
- issue: Предостережение против чрезмерной праведности и мудрости
  choice: Сохранить прямое «слишком праведным», не заменяя его на «самоправедным».
  alternative: Истолковать стих непосредственно как осуждение самоправедности, показного благочестия либо как отрицание праведности и мудрости вообще.
  rationale: Наречия הַרְבֵּה и יוֹתֵר обозначают избыток, но сам текст не уточняет его природу. Прямой перевод сохраняет намеренно острую формулировку Кохелета и не разрешает её богословское напряжение за читателя.
- issue: Характер последствия, выраженного תִּשּׁוֹמֵם
  choice: 'Передать как саморазрушительный итог: «губить себя».'
  alternative: «Приводить себя в ужас», «делать себя опустошённым» или «навлекать на себя разорение».
  rationale: Контекст поддерживает значение гибельного последствия, однако широкий семантический диапазон глагола отмечен в сноске.
translation_notes:
  register: Современный литературный русский, краткий и афористичный синтаксис. Формулировка сохраняет парадоксальность и богословское напряжение еврейского текста; «считай себя» передаёт рефлексивный оттенок хитпаэля без тяжеловесного «делай себя мудрым».
