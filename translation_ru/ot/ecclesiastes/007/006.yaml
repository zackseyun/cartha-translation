base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/006.yaml
  text: For like the crackling of thorns under a pot[a], so is the laughter of the fool[b]; this too is vapor.
translation:
  language: ru
  text: Ибо как треск терновника под котлом[a], таков и смех глупца; и это тоже — пар[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как звук терновника под котлом». Буквально по-еврейски — «как звук терновника»; контекст подразумевает резкий треск горящих колючих ветвей.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово хэвэл часто переводят как «суета», «тщета» или «дыхание». Здесь «пар» сохраняет образ чего-то мимолётного и неуловимого.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит поясняющее сравнение, связанное с предыдущей мыслью, не уточняя причинную связь сильнее, чем позволяет еврейский текст.
- source_word: כְקוֹל הַסִּירִים
  choice: как треск терновника
  rationale: קוֹל буквально означает «звук, голос», но образ горящего колючего кустарника указывает на резкий треск; собирательное «терновник» естественно передаёт множественное обозначение колючих растений.
- source_word: תַּחַת הַסִּיר
  choice: под котлом
  rationale: Существительное обозначает сосуд для приготовления пищи; «котёл» сохраняет конкретный бытовой образ и словесную игру между сходно звучащими еврейскими словами «терновник» и «котёл», насколько это возможно по смыслу.
- source_word: כֵּן שְׂחֹק הַכְּסִיל
  choice: таков и смех глупца
  rationale: Формулировка ясно выражает соответствие между звуком быстро сгорающего терновника и смехом глупца, сохраняя традиционный термин литературы мудрости.
- source_word: וְגַם זֶה
  choice: и это тоже
  rationale: Сохраняет присоединительное значение исходного выражения и связь с повторяющейся оценкой Кохелета.
- source_word: הָבֶל
  choice: пар
  rationale: Передаёт конкретный образ чего-то мимолётного и неуловимого, не сводя многозначное ключевое слово книги только к тщетности или нравственному тщеславию.
theological_decisions:
- issue: Смысл הָבֶל в оценке смеха глупца
  choice: Сохранён образ «пар», допускающий оттенки мимолётности, неуловимости и бессодержательности.
  alternative: «Суета», «тщета» или «дыхание».
  rationale: Контекст не требует выбирать только одно абстрактное толкование; конкретная метафора сохраняет богословскую и литературную многозначность термина.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической речи. Синтаксис краток и ритмичен; «глупец» сохраняет устойчивую категорию библейской литературы мудрости. Все примечания отмечены в основном тексте.
