lexical_decisions:
- source_word: גַּם
  choice: Также
  rationale: Передаёт добавочное значение частицы и связывает наставление с предшествующим контекстом.
- source_word: לְכָל הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ
  choice: всего, что говорят
  rationale: דְּבָרִים здесь обозначает произносимые слова или высказывания; неопределённое множественное число глагола естественно передаётся по-русски неопределённо-личной конструкцией.
- source_word: אַל תִּתֵּן לִבֶּךָ
  choice: не принимай близко к сердцу
  rationale: 'Естественная русская идиома точно передаёт смысл буквального еврейского выражения «не отдавай своего сердца»: не направляй на это пристального внутреннего внимания и не позволяй сказанному глубоко задевать тебя.'
- source_word: אֲשֶׁר לֹא תִשְׁמַע
  choice: чтобы не услышать
  rationale: После запрета оборот выражает нежелательное последствие, которого следует избежать; русская конструкция сохраняет эту целевую и предостерегающую направленность.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: עֶבֶד может обозначать слугу или раба. В данном житейском контексте «слуга» естественно передаёт положение подчинённого в доме, не устраняя возможного значения «раб», отмеченного в сноске.
- source_word: מְקַלְלֶךָ
  choice: проклинает тебя
  rationale: Прямо передаёт значение причастия от קלל — проклинать, злословить или поносить; контекст допускает сильное значение «проклинать».
