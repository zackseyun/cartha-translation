lexical_decisions:
- source_word: לְבַד רְאֵה זֶה
  choice: Только вот что
  rationale: Сочетание вводит ограничивающий итоговый вывод. По-русски «Только вот что» естественно связывается с последующим «я нашёл» и передаёт указательную силу רְאֵה זֶה без архаического «вот, смотри».
- source_word: מָצָאתִי
  choice: я нашёл
  rationale: Перфект обозначает достигнутый говорящим вывод; русское прошедшее время здесь естественно выражает результат размышления.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Обычная контекстуальная передача определённой формы האלהים.
- source_word: עָשָׂה ... אֶת־הָאָדָם יָשָׁר
  choice: создал человека праведным
  rationale: הָאָדָם употреблено обобщённо, о человеке и человечестве; יָשָׁר означает «прямой, правильный, честный» и в данном противопоставлении имеет нравственный оттенок, естественно передаваемый словом «праведный».
- source_word: וְהֵמָּה
  choice: но люди
  rationale: Множественное местоимение возвращает к собирательному הָאָדָם. Повтор существительного в русском яснее, чем неоднозначное «они», и сохраняет переход от обобщённого единственного к множественному.
- source_word: בִקְשׁוּ
  choice: пустились
  rationale: Буквально глагол означает «искали, домогались». В сочетании с חִשְּׁבֹנוֹת русское «пустились в» естественно передаёт деятельное обращение людей к разнообразным замыслам, не превращая глагол прямо в «изобрели».
- source_word: חִשְּׁבֹנוֹת רַבִּים
  choice: во многие ухищрения
  rationale: חִשְּׁבֹנוֹת допускает значения расчётов, замыслов, изобретений и уловок. «Ухищрения» сохраняет контекстуально вероятный отрицательный оттенок и идею изобретательности; широта слова отмечена в сноске.
theological_decisions:
- issue: Обобщённое значение הָאָדָם
  choice: человека, затем люди
  alternative: человечество, затем оно/люди
  rationale: Еврейское определённое единственное число обозначает человеческий род в целом, а следующее множественное местоимение раскрывает собирательность. Русское «человека ... люди» сохраняет грамматическое движение оригинала и не ограничивает смысл мужчиной.
- issue: Нравственный смысл יָשָׁר
  choice: праведным
  alternative: прямым; честным; правильным
  rationale: Противопоставление человеческим ухищрениям указывает на нравственную прямоту. «Праведным» ясно выражает этот смысл, но сноска сохраняет буквальный образ прямоты и возможные оттенки.
translation_notes:
  register: Современный литературный русский язык, сдержанный и афористичный. Сохранены итоговый характер высказывания, переход от собирательного единственного числа к множественному и смысловая широта заключительного существительного.
