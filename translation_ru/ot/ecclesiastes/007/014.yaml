source:
  edition: WLC
  text: בְּ/י֤וֹם טוֹבָה֙ הֱיֵ֣ה בְ/ט֔וֹב וּ/בְ/י֥וֹם רָעָ֖ה רְאֵ֑ה גַּ֣ם אֶת זֶ֤ה לְ/עֻמַּת זֶה֙ עָשָׂ֣ה הָֽ/אֱלֹהִ֔ים עַל דִּבְרַ֗ת שֶׁ/לֹּ֨א יִמְצָ֧א הָֽ/אָדָ֛ם אַחֲרָ֖י/ו מְאֽוּמָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/014.yaml
  text: 'In a day of prosperity[a], be joyful; and in a day of adversity, consider: God has made the one as well as the other[c][b], so that man may not find out anything that will come after him.'
translation:
  language: ru
  text: 'В день благополучия радуйся, а в день бедствия поразмысли: и то и другое сделал Бог, чтобы человек не мог узнать, что будет после него.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не мог узнать ничего из того, что будет потом». «После него» может относиться к неизвестному будущему вообще или к тому, что наступит после жизни человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם טוֹבָה
  choice: В день благополучия
  rationale: Сочетание יוֹם с абстрактным существительным обозначает пору или обстоятельства; טוֹבָה здесь — благоприятные условия, а не нравственное добро.
- source_word: הֱיֵה בְטוֹב
  choice: радуйся
  rationale: Идиоматическое повеление призывает положительно принимать благополучие; буквальное «будь в добре» по-русски неестественно.
- source_word: וּבְיוֹם רָעָה
  choice: а в день бедствия
  rationale: רָעָה в данном противопоставлении означает беду или неблагоприятные обстоятельства, а не нравственное зло.
- source_word: רְאֵה
  choice: задумайся
  rationale: Повелительная форма ראה здесь призывает не просто увидеть, а осмыслить происходящее.
- source_word: גַּם אֶת זֶה לְעֻמַּת זֶה
  choice: и то и другое
  rationale: Фраза сопоставляет две названные реальности — благополучие и бедствие — как поставленные одна напротив другой.
- source_word: עָשָׂה הָאֱלֹהִים
  choice: сотворил Бог
  rationale: Глагол עשה прямо относит обе противопоставленные реальности к действию Бога; «сотворил» сохраняет эту сильную формулировку.
- source_word: עַל דִּבְרַת שֶׁלֹּא יִמְצָא הָאָדָם
  choice: чтобы человек не мог узнать
  rationale: עַל דִּבְרַת вводит цель или результат, а מצא в контексте означает обнаружить, узнать.
- source_word: אַחֲרָיו מְאוּמָה
  choice: что будет после него
  rationale: Фраза допускает отнесение к будущему, наступающему после человека, но сохраняет известную неоднозначность, пояснённую в сноске.
theological_decisions:
- issue: Божественное действие в благополучии и бедствии
  choice: и то и другое сотворил Бог
  alternative: Бог устроил одно напротив другого
  rationale: Еврейский текст прямо приписывает Божьему действию обе реальности. Перевод не ослабляет этого утверждения и не добавляет объяснения теодицеи.
- issue: Значение הָאָדָם
  choice: человек
  alternative: люди / человечество
  rationale: В русском «человек» естественно передаёт грамматически единственное число и обобщённое значение всего человечества.
- issue: Неоднозначность אַחֲרָיו
  choice: что будет после него
  alternative: что будет потом
  rationale: Местоименный суффикс буквально означает «после него» и может указывать на события после жизни человека либо шире на недоступное ему будущее; основной текст сохраняет буквальную связь, а сноска отмечает диапазон смысла.
translation_notes:
  register: Современный литературный русский язык; краткий афористичный строй и параллелизм стиха сохранены. «Радуйся» и «задумайся» передают повелительный характер исходного текста без архаизации.
