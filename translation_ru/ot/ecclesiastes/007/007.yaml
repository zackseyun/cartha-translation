    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предыдущей мысли; «ведь» естественно передаёт пояснительно-причинную связь в рассуждении Екклесиаста.
- source_word: הָעֹשֶׁק
  choice: притеснение
  rationale: Слово обозначает угнетение и корыстное злоупотребление властью; «притеснение» сохраняет широкий социально-нравственный смысл.
- source_word: יְהוֹלֵל
  choice: сводит … с ума
  rationale: Каузативное значение глагола указывает на доведение человека до безрассудства или помешательства; русская идиома ясно и естественно передаёт эту силу.
- source_word: חָכָם
  choice: мудрого
  rationale: Субстантивированное прилагательное мужского рода обозначает мудрого человека; форма «мудрого» сохраняет грамматический образ и лаконичность афоризма.
- source_word: וִיאַבֵּד
  choice: губит
  rationale: Каузативная форма глагола אבד означает погубить или разрушить; «губит» сохраняет силу высказывания и естественно сочетается со словом «сердце».
- source_word: אֶת לֵב
  choice: сердце
  rationale: Сохранён древнееврейский образ внутреннего центра человека, включающего рассудительность, понимание и волю.
- source_word: מַתָּנָה
  choice: взятка
  rationale: Хотя слово может означать подарок вообще, параллелизм с притеснением и губительное воздействие на сердце указывают здесь на корыстный дар — взятку.
