translation:
  language: ru
  text: Ведь притеснение сводит мудрого с ума, а подарок[a] губит сердце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взятка». Древнееврейское слово означает «дар», «подарок»; в данном контексте оно может подразумевать взятку.'
