lexical_decisions:
- source_word: טוֹב שֵׁם
  choice: доброе имя
  rationale: Буквально передаёт еврейское выражение; в контексте литературы мудрости «имя» естественно включает значение доброй репутации.
- source_word: מִשֶּׁמֶן טוֹב
  choice: лучше хорошего масла
  rationale: Предлог מִן выражает сравнение, а שֶׁמֶן буквально означает «масло». Основной текст сохраняет исходный образ, не заменяя его толкованием «благовония».
- source_word: וְיוֹם הַמָּוֶת
  choice: и день смерти
  rationale: Сохраняет параллельную структуру и резкое, намеренно парадоксальное утверждение еврейского текста.
- source_word: מִיּוֹם הִוָּלְדוֹ
  choice: лучше дня рождения
  rationale: Сравнительное «лучше» восполнено по параллелизму, как того требует естественный русский синтаксис. Притяжательный суффикс 3-го лица имеет обобщающее значение; по-русски «день рождения» без местоимения естественно выражает ту же мысль.
theological_decisions:
- issue: Обобщающий мужской суффикс в הִוָּלְדוֹ
  choice: дня рождения
  alternative: дня его рождения
  rationale: Еврейская форма буквально означает «дня его рождения», однако в изречении мужской род употреблён представительно. Русское сочетание «день рождения» не устраняет смысл и избегает неясного местоименного отнесения.
- issue: Парадоксальное превосходство дня смерти
  choice: день смерти лучше дня рождения
  alternative: не смягчать и не пояснять утверждение в основном тексте
  rationale: Исходный текст прямо проводит это сравнение. Перевод сохраняет богословское и экзистенциальное напряжение, не сводя его к отдельному толкованию.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма и параллелизм оригинала сохранены. Лексика понятна широкому читателю, а буквальный образ масла пояснён в сноске.
