  yaml_path: translation/ot/ecclesiastes/007/001.yaml
  text: A good name is better than good oil[a], and the day of death than the day of one's birth.
translation:
  language: ru
  text: Доброе имя лучше хорошего масла[a], и день смерти лучше дня рождения.
  philosophy: optimal-equivalence
  footnotes:
