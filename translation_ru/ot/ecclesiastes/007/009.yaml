lexical_decisions:
- source_word: תְּבַהֵל
  choice: не спеши
  rationale: Запрет с אַל и форма пиэль предостерегают от поспешности; последующий инфинитив уточняет, что речь идёт о скорой готовности разгневаться.
- source_word: בְּרוּחֲךָ
  choice: в духе своём
  rationale: רוּחַ обозначает внутренний настрой человека. Такой перевод сохраняет образ исходного текста и остаётся понятным в современном литературном русском.
- source_word: לִכְעוֹס
  choice: гневаться
  rationale: Инфинитив называет вхождение в состояние гнева; в сочетании «не спеши… гневаться» этот оттенок естественно выражается всей конструкцией.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего предостережения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: כַעַס
  choice: гнев
  rationale: В данном контексте это наиболее прямое и ясное соответствие существительному, соотносящееся с глаголом «гневаться» в первой части.
- source_word: בְּחֵיק
  choice: за пазухой
  rationale: חֵיק обозначает грудь, лоно или пространство у груди, где нечто держат близко к себе. Русский образ «за пазухой» сохраняет пространственную и интимную близость лучше, чем отвлечённое «в сердце».
- source_word: כְּסִילִים
  choice: у глупцов
  rationale: Стандартный термин литературы мудрости для нравственно и рассудочно неразумных людей; «глупцы» — точное и традиционно понятное соответствие.
- source_word: יָנוּחַ
  choice: покоится
  rationale: Глагол נוח означает отдыхать, оседать или оставаться. «Покоится» сохраняет образ гнева, который обосновался у глупцов, а не посетил их мимолётно.
