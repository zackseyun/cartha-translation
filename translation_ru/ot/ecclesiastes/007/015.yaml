  text: אֶת הַ/כֹּ֥ל רָאִ֖יתִי בִּ/ימֵ֣י הֶבְלִ֑/י יֵ֤שׁ צַדִּיק֙ אֹבֵ֣ד בְּ/צִדְק֔/וֹ וְ/יֵ֣שׁ רָשָׁ֔ע מַאֲרִ֖יךְ בְּ/רָעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/015.yaml
  text: 'I have seen it all in the days of my vanity: there is a righteous man perishing in his righteousness[c][b][a], and there is a wicked man prolonging his life in his evil.'
translation:
  language: ru
  text: 'Всё это я видел в дни моей суетной жизни[a]: бывает, что праведник гибнет в своей праведности[b], а нечестивец долго живёт в своём зле[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дни моей мимолётной жизни», «в дни моей тщеты». Еврейское הֶבֶל — ключевое слово книги; оно выражает мимолётность, неуловимость и тщетность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гибнет, несмотря на свою праведность». Еврейский оборот допускает разные понимания; основной текст сохраняет неоднозначность.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «долго живёт, несмотря на своё зло»; также возможно: «продлевает свои дни в своём зле».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶת הַכֹּל רָאִיתִי
  choice: Всё это я видел
  rationale: Передаёт полноту наблюдений Кохелета; «это» естественно связывает стих с окружающим рассуждением, не сужая объёма еврейского הַכֹּל.
- source_word: בִּימֵי הֶבְלִי
  choice: в дни моей суетной жизни
  rationale: Сохраняет связь הֶבֶל с ключевым для книги словом «суета», но уточнение «жизни» не позволяет понять выражение как занятость или тщеславие говорящего. Оборот передаёт краткость, неуловимость и тщетность человеческой жизни.
- source_word: יֵשׁ ... וְיֵשׁ
  choice: бывает, что ... а ...
  rationale: Естественная русская форма для двух наблюдаемых случаев; противительный союз «а» ясно передаёт парадоксальное сопоставление.
- source_word: צַדִּיק אֹבֵד
  choice: праведник гибнет
  rationale: Субстантивированное единственное число передано словом «праведник»; «гибнет» сохраняет более широкий смысл אֹבֵד и не ограничивает его обычной естественной смертью.
- source_word: בְּצִדְקוֹ
  choice: в своей праведности
  rationale: 'Буквальный предлог «в» сохраняет неоднозначность: праведность может обозначать обстоятельство, вопреки которому человек гибнет, либо быть понята иначе по контексту.'
- source_word: רָשָׁע מַאֲרִיךְ
  choice: нечестивец долго живёт
  rationale: Идиоматически передаёт каузативную форму ארך как продолжительность жизни, не создавая в русском ошибочного впечатления, будто нечестивец сознательно продлевает себе жизнь.
- source_word: בְּרָעָתוֹ
  choice: в своём зле
  rationale: Сохраняет параллель с «в своей праведности» и не разрешает семантическую гибкость предлога ב. «Зло» непосредственно передаёт רָעָה.
theological_decisions:
- issue: Смысл הֶבְלִי применительно к жизни говорящего
  choice: «моей суетной жизни» — жизнь мимолётная, неуловимая и подверженная тщете
  alternative: «моей мимолётной жизни»; «дни моего дуновения»; «дни моей тщеты»
  rationale: Здесь речь не обязательно идёт о тщеславии или нравственном пороке говорящего. Формулировка сохраняет тематическую лексику книги и одновременно направляет читателя к смыслу непрочности и тщетности жизни.
- issue: Значение предлога ב в בְּצִדְקוֹ и בְּרָעָתוֹ
  choice: Сохранено буквальное и неоднозначное «в своей праведности» / «в своём зле»
  alternative: «несмотря на свою праведность» / «несмотря на своё зло»; «из-за своей праведности» / «из-за своего зла»
  rationale: Еврейский предлог допускает обстоятельственное, уступительное или причинное понимание. Текст утверждает парадокс наблюдаемой жизни, но не вынуждает переводчика однозначно объявить праведность или зло причиной соответствующего исхода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, афористичным звучанием. Ключевое для Екклесиаста слово «суета» сохранено в форме «суетной», но уточнено существительным «жизнь». Параллельные обороты «в своей праведности» и «в своём зле» намеренно оставлены семантически открытыми.
