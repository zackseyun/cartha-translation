lexical_decisions:
- source_word: תִּרְשַׁע
  choice: будь нечестив
  rationale: Форма Qal от רשע обозначает нечестивое поведение или состояние. «Будь нечестив» кратко и прямо сохраняет нравственную категорию исходного текста.
- source_word: הַרְבֵּה
  choice: чрезмерно
  rationale: Наречие степени относится к запрету и создаёт намеренно провокационное напряжение. «Чрезмерно» передаёт эту степень, не устраняя её из перевода.
- source_word: תְּהִי סָכָל
  choice: будь глупцом
  rationale: Сочетание היה с существительным סכל передано именной конструкцией «будь глупцом», что сохраняет форму и увещательный характер еврейского выражения.
- source_word: לָמָּה
  choice: зачем тебе
  rationale: Вводит риторический вопрос с предостерегающей силой. «Зачем тебе» естественно по-русски выражает не поиск причины, а предупреждение.
- source_word: תָמוּת
  choice: умирать
  rationale: Инфинитив после «зачем тебе» естественно передаёт русский риторический вопрос, соответствующий еврейскому имперфекту מות.
- source_word: בְּלֹא עִתֶּךָ
  choice: прежде своего времени
  rationale: Идиоматически передаёт буквальное «не в своё время», то есть преждевременно, не добавляя отсутствующего в еврейском тексте понятия назначенного срока.
theological_decisions:
- issue: Следует ли сгладить формулировку, которая может показаться допускающей умеренное нечестие
  choice: 'Сохранить степень: «не будь чрезмерно нечестив»'
  alternative: «Не будь нечестив вовсе» или «не поступай нечестиво» без указания степени
  rationale: В еврейском тексте прямо присутствует הַרְבֵּה, параллельное предшествующему предостережению о чрезмерной праведности. Перевод сохраняет намеренное напряжение Книги Экклезиаста, не превращая его в одобрение какой-либо меры нечестия.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и увещательным звучанием. Синтаксис сделан естественным для обычного читателя; при этом сохранены именная форма «глупцом» и провокационное указание степени при «нечестив».
