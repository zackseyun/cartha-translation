lexical_decisions:
- source_word: טוֹבָה
  choice: хороша
  rationale: Предикативное прилагательное «хороша» передаёт значение טוֹבָה без внесения неявной сравнительной степени; связка в русском настоящем времени не требуется.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычный и контекстуально уместный эквивалент; у Екклесиаста речь прежде всего о практической жизненной мудрости.
- source_word: עִם
  choice: вместе с
  rationale: Сохраняет наиболее прямое значение совместности, не исключая отмеченного в сноске сравнительного прочтения всей конструкции.
- source_word: נַחֲלָה
  choice: наследством
  rationale: Точно передаёт унаследованное владение или имущество и не расширяет смысл до богатства вообще.
- source_word: וְיֹתֵר
  choice: и полезна
  rationale: Передаёт идею преимущества или пользы естественным русским выражением; подразумеваемым подлежащим остаётся мудрость в сочетании с наследством.
- source_word: לְרֹאֵי
  choice: тем, кто видит
  rationale: Сохраняет причастную конструкцию и образность исходного текста; значение адресата или получателя пользы передано дательным падежом.
- source_word: הַשָּׁמֶשׁ
  choice: солнце
  rationale: Буквальный перевод сохраняет характерный для книги образ, тогда как идиоматический смысл поясняется в сноске.
