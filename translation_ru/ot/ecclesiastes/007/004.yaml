lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет еврейский образ внутреннего средоточия мыслей, внимания и устремлений человека, не сводя значение лишь к чувствам.
- source_word: חֲכָמִים
  choice: мудрые
  rationale: Субстантивированное прилагательное во множественном числе; краткая форма сохраняет афористический стиль и не вводит отсутствующего в еврейском тексте указания на пол.
- source_word: בֵּית
  choice: дом
  rationale: Прямой эквивалент, сохраняющий параллельный образ двух домов; здесь подразумевается место, где люди пребывают вместе по случаю скорби или веселья.
- source_word: אֵבֶל
  choice: скорбь
  rationale: Слово обозначает траур и скорбь, особенно в связи со смертью. Сочетание «дом скорби» естественно по-русски и сохраняет более широкий образ, не добавляя прямо отсутствующего слова «траур».
- source_word: וְ
  choice: а
  rationale: Формально союз может означать «и», но в антитетическом параллелизме он выражает противопоставление; русское «а» передаёт его естественно и без чрезмерного усиления.
- source_word: כְּסִילִים
  choice: глупые
  rationale: Передаёт устойчивую нравственно-интеллектуальную категорию литературы мудрости и сохраняет параллель с «мудрыми».
- source_word: שִׂמְחָה
  choice: веселье
  rationale: В данном противопоставлении скорби слово указывает на радостное, праздничное настроение. «Веселье» передаёт контекст точнее, чем более широкое «радость».
