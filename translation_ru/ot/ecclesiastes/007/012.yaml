source:
  edition: WLC
  text: כִּ֛י בְּ/צֵ֥ל הַֽ/חָכְמָ֖ה בְּ/צֵ֣ל הַ/כָּ֑סֶף וְ/יִתְר֣וֹן דַּ֔עַת הַֽ/חָכְמָ֖ה תְּחַיֶּ֥ה בְעָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/012.yaml
  text: For wisdom is a shelter just as money is a shelter[b][a], but the advantage of knowledge is that wisdom preserves the life of its possessors.
translation:
  language: ru
  text: Ведь мудрость даёт защиту, как и деньги[a], но преимущество знания в том, что мудрость сохраняет жизнь тем, кто ею обладает[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в тени мудрости, в тени денег». В еврейском тексте тень служит образом укрытия и защиты.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «мудрость даёт жизнь тем, кто ею обладает». Еврейский глагол может также означать «давать жизнь» или «сохранять в живых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз поясняет предыдущее высказывание; «ведь» естественно передаёт эту связь, не превращая её в жёсткую причинную конструкцию.
- source_word: בְּצֵל הַחָכְמָה בְּצֵל הַכָּסֶף
  choice: мудрость даёт защиту, как и деньги
  rationale: Буквально дважды сказано «в тени». В данном образном употреблении тень означает укрытие и защиту. Формулировка сохраняет параллель между практической пользой мудрости и денег.
- source_word: הַכָּסֶף
  choice: деньги
  rationale: כֶּסֶף может означать серебро или деньги; здесь современное «деньги» лучше передаёт экономический смысл сравнения.
- source_word: וְיִתְרוֹן דַּעַת
  choice: но преимущество знания
  rationale: יִתְרוֹן означает преимущество, пользу или выгоду. Противительный союз выявляет добавочное преимущество мудрости, а формулировка «преимущество знания» сохраняет неоднозначную связь существительных в еврейском тексте.
- source_word: תְּחַיֶּה
  choice: сохраняет жизнь
  rationale: Пиэль глагола חיה может означать «сохранять в живых», «давать жизнь» или «оживлять». В контексте защиты основной текст передаёт значение поддержания и сохранения жизни, а иной возможный оттенок отмечен в сноске.
- source_word: בְעָלֶיהָ
  choice: тем, кто ею обладает
  rationale: Буквально «её обладателям». Описательная русская конструкция звучит естественно и ясно относит местоимение к мудрости.
theological_decisions:
- issue: Характер животворящего действия мудрости
  choice: мудрость сохраняет жизнь
  alternative: мудрость даёт жизнь
  rationale: Контекст допускает как сохранение человека в живых, так и более сильное выражение «даёт жизнь». Основной текст выбирает контекстуально вероятное значение, не придавая высказыванию специального догматического смысла; альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Образ «тени» раскрыт в основном тексте как защита ради ясности, а буквальная метафора сохранена в сноске.
