  text: То, что было, далеко и очень глубоко — кто может постичь это?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «и глубоко, глубоко»; повтор усиливает смысл: «очень глубоко», «чрезвычайно глубоко». Глагол «постичь» также можно передать: «найти», «обнаружить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחוֹק
  choice: далеко
  rationale: Предикативное употребление передаёт удалённость и недоступность; краткое наречие естественно звучит по-русски и сохраняет образ.
- source_word: מַה שֶּׁהָיָה
  choice: то, что было
  rationale: Относительная конструкция с формой היה указывает на то, что уже было или возникло; перевод сохраняет временную и смысловую неоднозначность.
- source_word: וְעָמֹק עָמֹק
  choice: и глубоко, глубоко
  rationale: Повтор прилагательного в еврейском тексте служит усилению. Его прямое воспроизведение сохраняет риторическую выразительность и образ непостижимой глубины.
- source_word: מִי
  choice: кто
  rationale: Обычное вопросительное местоимение, вводящее риторический вопрос.
- source_word: יִמְצָאֶנּוּ
  choice: может постичь это
  rationale: מצא означает «найти, обнаружить»; в контексте мудрости речь идёт о постижении скрытой реальности. «Постичь» естественно передаёт этот смысл, а «может» выявляет риторическую силу вопроса. Местоимение среднего рода относится ко всему описанному предмету размышления.
theological_decisions:
- issue: Предмет, названный «далёким» и «глубоким»
  choice: Оставить неопределённым через «то, что было» и «это»
  alternative: Уточнить как «сущность вещей», «мудрость» или «Божий замысел»
  rationale: Еврейский текст не называет предмет прямо; конкретизация сняла бы намеренную неоднозначность и внесла бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным ритмом. Повтор «глубоко, глубоко» намеренно сохранён как выразительное усиление оригинала.
