  source_fidelity: 'Перевод точно передаёт последовательность и основные образы еврейского текста: личное наблюдение («И нахожу я»), сравнение «горше смерти», единственное число «женщину», метафоры сердца как западней и сетей и рук как оков, а также контраст между добрым пред Богом и грешником. «Спасётся от неё» допустимо передаёт יִמָּלֵט («избежит/спасётся»), а «будет пойман ею» сохраняет пассивный образ יִלָּכֶד בָּהּ, не уточняя сверх текста характер этой женщины.'
