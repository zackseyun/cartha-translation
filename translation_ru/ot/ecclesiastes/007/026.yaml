id: ECC.7.26
reference: Ecclesiastes 7:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מוֹצֶ֨א אֲנִ֜י מַ֣ר מִ/מָּ֗וֶת אֶת הָֽ/אִשָּׁה֙ אֲשֶׁר הִ֨יא מְצוֹדִ֧ים וַ/חֲרָמִ֛ים לִבָּ֖/הּ אֲסוּרִ֣ים יָדֶ֑י/הָ ט֞וֹב לִ/פְנֵ֤י הָ/אֱלֹהִים֙ יִמָּלֵ֣ט מִמֶּ֔/נָּה וְ/חוֹטֵ֖א יִלָּ֥כֶד בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/026.yaml
  text: And I find more bitter than death the woman whose heart is traps and nets[a], and whose hands are chains. The one who is good before God will escape from her[b], but the sinner will be caught by her.
translation:
  language: ru
  text: И нахожу я горше смерти женщину, чьё сердце — западни и сети[a], а руки — оковы. Добрый пред Богом спасётся от неё[b], а грешник будет пойман ею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ловушки и сети».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Угодный Богу спасётся от неё».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמוֹצֶא אֲנִי
  choice: И нахожу я
  rationale: Причастная конструкция с явным подлежащим передаёт текущее личное наблюдение Кохелета; порядок слов сохраняет достоинство и лёгкую поэтичность речи.
- source_word: מַר מִמָּוֶת
  choice: горше смерти
  rationale: Краткая и естественная русская сравнительная конструкция точно передаёт прилагательное с מן.
- source_word: הָאִשָּׁה
  choice: женщину
  rationale: Сохраняется определённый артикль в контексте описательного типа, но русский винительный падеж без указательного слова естественно передаёт данную конструкцию и не превращает её в обобщение обо всех женщинах.
- source_word: מְצוֹדִים וַחֲרָמִים
  choice: западни и сети
  rationale: Оба слова относятся к образам ловли; сочетание ясно различает ловушку и сеть, сохраняя параллельный образ пленения.
- source_word: לִבָּהּ
  choice: чьё сердце — западни и сети
  rationale: Сохраняется прямое отождествление сердца как средоточия намерений с орудиями ловли, без разъясняющего пересказа.
- source_word: אֲסוּרִים יָדֶיהָ
  choice: а руки — оковы
  rationale: «Оковы» конкретно и естественно передают связывающие узы и поддерживают образ пленения.
- source_word: טוֹב לִפְנֵי הָאֱלֹהִים
  choice: Добрый пред Богом
  rationale: Лексически сохраняет «добрый/хороший перед Богом» и не подменяет его более истолковывающим «угодный Богу»; форма «пред Богом» уместна в возвышенном библейском регистре.
- source_word: יִמָּלֵט מִמֶּנָּה
  choice: спасётся от неё
  rationale: Возвратная форма естественно передаёт нифаль מלט и допускает оттенки как избавления, так и бегства.
- source_word: וְחוֹטֵא
  choice: а грешник
  rationale: Субстантивированное причастие передано кратким существительным; союз выражает смысловой контраст.
- source_word: יִלָּכֶד בָּהּ
  choice: будет пойман ею
  rationale: Сохраняет пассивность формы לכד и инструментально-агентивное значение בָּהּ в рамках образа ловушки.
theological_decisions:
- issue: Следует ли смягчать или обобщать изображение «женщины»
  choice: Сохранить единственное число и неопределённость образа без расширения до всех женщин
  alternative: «соблазнительница» или «олицетворённая глупость»
  rationale: Еврейский текст не устанавливает прямо, идёт ли речь о конкретной женщине, нравственном типе или персонификации; перевод не должен разрешать эту напряжённость.
- issue: Значение טוֹב לִפְנֵי הָאֱלֹהִים
  choice: «Добрый пред Богом»
  alternative: «угодный Богу»
  rationale: Основной текст сохраняет буквальную нравственно-реляционную формулу, а идиоматическое понимание как Божьего благоволения отмечается в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Метафоры сердца, западней, сетей и оков сохранены прямо; синтаксис остаётся ясным для обычного читателя.
