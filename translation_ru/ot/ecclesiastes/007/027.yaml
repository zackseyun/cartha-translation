base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/027.yaml
  text: See, this is what I found, says Qoheleth, adding one thing to another to find the sum.
translation:
  language: ru
  text: Вот что я нашёл, — говорит Кохелет, — прибавляя одно к другому, чтобы найти итог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Вот
  rationale: В данном вводном употреблении естественно обращает внимание читателя на последующее утверждение; буквальное «смотри» по-русски звучало бы менее естественно.
- source_word: קֹהֶלֶת
  choice: Кохелет
  rationale: Транслитерация сохраняет необычное еврейское обозначение говорящего и не сужает его значение до одного из возможных толкований титула.
- source_word: אַחַת לְאַחַת
  choice: сопоставляя одно с другим
  rationale: Передаёт поэтапное соотнесение отдельных наблюдений; сохраняет смысловой образ исходной идиомы в естественной русской форме.
- source_word: חֶשְׁבּוֹן
  choice: итог
  rationale: В контексте обозначает результат подсчёта или рассуждения. «Подвести итог» естественно передаёт стремление получить совокупный результат, не превращая слово в однозначное «объяснение».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной речи. Женская форма אָמְרָה согласована с грамматическим родом названия «Кохелет» в еврейском, но в русском транслитерированное имя оформлено как мужское несклоняемое обозначение говорящего; поэтому употреблено нейтральное по контексту «говорит». Конструкция с тире ясно отделяет авторскую ремарку.
