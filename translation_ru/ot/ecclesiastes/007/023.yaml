  text: כָּל זֹ֖ה נִסִּ֣יתִי בַֽ/חָכְמָ֑ה אָמַ֣רְתִּי אֶחְכָּ֔מָה וְ/הִ֖יא רְחוֹקָ֥ה מִמֶּֽ/נִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/023.yaml
  text: All this I tested by wisdom[a]. I said[c][b], “I will become wise,” but it was far from me.
translation:
  language: ru
  text: 'Я исследовал всё это с помощью мудрости[a]. Я сказал: «Стану мудрым», — но она была далека от меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я проверил всё это с помощью мудрости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זֹה
  choice: Всё это
  rationale: Сочетание с указательным местоимением в единственном числе обобщённо указывает на предшествующие размышления как на единое целое.
- source_word: נִסִּיתִי
  choice: я испытывал
  rationale: Глагол נסה в породе пиэль передаёт проверку или исследование; несовершенный вид по-русски естественно представляет проводившийся способ исследования.
- source_word: בַחָכְמָה
  choice: мудростью
  rationale: Предлог ב здесь обозначает средство или способ действия; творительный падеж кратко и естественно сохраняет это значение.
- source_word: אָמַרְתִּי
  choice: Я сказал
  rationale: Сохранено прямое значение глагола «говорить»; в контексте эти слова выражают внутреннее намерение.
- source_word: אֶחְכָּמָה
  choice: Стану мудрым
  rationale: Форма выражает устремление или решимость обрести мудрость; глагол «стану» передаёт движение к ещё не достигнутому состоянию.
- source_word: וְהִיא
  choice: но она
  rationale: Местоимение женского рода отсылает к мудрости; союз передан противительно, поскольку намерение говорящего противопоставлено недостижимости цели.
- source_word: רְחוֹקָה מִמֶּנִּי
  choice: была далека от меня
  rationale: Прямо сохраняется образ пространственной удалённости без истолковывающего замещения выражением «недоступна мне».
theological_decisions:
- issue: К чему относится местоимение וְהִיא
  choice: 'К мудрости: «но она была далека от меня»'
  alternative: 'Безличное или истолковывающее: «но это было мне недоступно»'
  rationale: Женский род местоимения естественно соотносится с חָכְמָה, «мудрость»; прямое соответствие сохраняет образ и богословское напряжение между стремлением к мудрости и её удалённостью.
translation_notes:
  register: Современный литературный русский язык, сдержанный и близкий к форме еврейского текста. «Испытывал мудростью» намеренно сохраняет инструментальное значение ב, хотя вариант в сноске звучит более разъяснительно. Женское местоимение «она» ясно связывает заключительную часть с мудростью.
