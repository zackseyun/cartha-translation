  text: רְאֵ֖ה אֶת מַעֲשֵׂ֣ה הָ/אֱלֹהִ֑ים כִּ֣י מִ֤י יוּכַל֙ לְ/תַקֵּ֔ן אֵ֖ת אֲשֶׁ֥ר עִוְּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/013.yaml
  text: Consider the work of God[a], for who can straighten what he has made crooked?
translation:
  language: ru
  text: 'Посмотри на дело Бога: кто может выпрямить то, что Он искривил?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Посмотри
  rationale: Императив призывает не просто увидеть, а обратить вдумчивое внимание; «посмотри на» естественно передаёт это в контексте мудрости.
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: дело Бога
  rationale: Единственное число обозначает в широком смысле то, что Бог совершает; «дело Бога» сохраняет форму и звучит естественно и достойно.
- source_word: כִּי
  choice: ':'
  rationale: 'Двоеточие естественно выражает пояснительно-причинную связь: последующий риторический вопрос обосновывает призыв посмотреть на Божье дело.'
- source_word: מִי יוּכַל לְתַקֵּן
  choice: кто может выпрямить
  rationale: Сохраняются риторический вопрос, значение способности и конкретный образ, противопоставленный глаголу «искривил».
- source_word: אֵת אֲשֶׁר עִוְּתוֹ
  choice: то, что Он искривил
  rationale: Формулировка сохраняет конкретную метафору кривизны и передаёт мужской единственный субъектный суффикс как отсылку к Богу.
theological_decisions:
- issue: К кому относится субъектный суффикс 3-го лица мужского рода единственного числа в עִוְּתוֹ
  choice: «то, что Он искривил» — субъектом назван Бог
  alternative: «то, что искривлено»; «то, что Он согнул»
  rationale: Ближайший контекст прямо говорит о деле Бога. Явное «Он» сохраняет грамматику еврейского текста и его богословское напряжение, не смягчая высказывание безличной конструкцией.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная формулировка в стиле литературы мудрости. Местоимение «Он» написано с прописной буквы для ясной отсылки к Богу. Конкретная пара «выпрямить — искривил» сохраняет образ и антитезу оригинала.
