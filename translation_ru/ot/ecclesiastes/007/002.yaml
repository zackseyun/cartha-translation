  text: ט֞וֹב לָ/לֶ֣כֶת אֶל בֵּֽית אֵ֗בֶל מִ/לֶּ֨כֶת֙ אֶל בֵּ֣ית מִשְׁתֶּ֔ה בַּ/אֲשֶׁ֕ר ה֖וּא ס֣וֹף כָּל הָ/אָדָ֑ם וְ/הַ/חַ֖י יִתֵּ֥ן אֶל לִבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/002.yaml
  text: It is better to go to a house of mourning than to go to a house of feasting[a], because that is the end of every person, and the living should take it to heart.
translation:
  language: ru
  text: Лучше пойти в дом скорби, чем в дом пиршества, ведь это конец всякого человека[a], и живым следует принять это к сердцу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конец всего человечества». Еврейское אָדָם здесь обозначает людей вообще.'
    reason: Сохраняется возможная собирательная передача обобщающего выражения כָּל הָאָדָם.
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: Сравнительная оценка, вводящая изречение мудрости; краткая русская конструкция естественно передаёт смысл.
- source_word: לָלֶכֶת / מִלֶּכֶת
  choice: пойти ... чем
  rationale: В контексте посещения мест и событий הלך означает «идти/пойти»; во второй части глагол естественно подразумевается по-русски.
- source_word: בֵּית אֵבֶל
  choice: дом скорби
  rationale: Формально близкая и понятная передача сочетания «дом скорби/траура», обозначающего место, где оплакивают умершего.
- source_word: בֵּית מִשְׁתֶּה
  choice: дом пиршества
  rationale: מִשְׁתֶּה обозначает пир или праздничное застолье, нередко с вином; «пиршество» сохраняет контраст со скорбью.
- source_word: בַּאֲשֶׁר
  choice: ведь
  rationale: Союз вводит основание для сравнения; «ведь» естественно и ясно выражает причинно-пояснительную связь.
- source_word: סוֹף כָּל הָאָדָם
  choice: конец всякого человека
  rationale: אָדָם употреблено родово и относится ко всему человечеству; «всякого человека» сохраняет распределительное значение כָּל и ясно указывает на всеобщность смерти.
- source_word: וְהַחַי
  choice: и тот, кто жив
  rationale: Субстантивированное единственное число с артиклем имеет обобщающее значение; развёрнутая русская конструкция звучит естественнее буквального «живой».
- source_word: יִתֵּן אֶל לִבּוֹ
  choice: пусть примет это к сердцу
  rationale: Еврейская идиома буквально говорит о помещении чего-либо в сердце и призывает к серьёзному внутреннему осмыслению; форма с «пусть» передаёт наставительную силу.
theological_decisions:
- issue: Объём значения אָדָם в высказывании о смертности
  choice: всякого человека
  alternative: всего человечества
  rationale: В данном контексте הָאָדָם имеет обобщающее значение. Основной вариант подчёркивает неизбежность конца для каждого отдельного человека, а собирательное понимание отмечено в сноске без ограничения текста только мужчинами.
- issue: Наставительный или предсказательный смысл יִתֵּן
  choice: пусть примет
  alternative: примет
  rationale: В контексте изречения мудрости форма выражает не просто прогноз поведения живого, а призыв усвоить урок смертности; повелительная конструкция сохраняет эту прагматическую силу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, афористичным звучанием. Сохранены традиционные образы «дома скорби», «дома пиршества» и сердца, но синтаксис сделан понятным современному читателю.
