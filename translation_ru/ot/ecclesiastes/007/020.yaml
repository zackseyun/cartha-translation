  text: כִּ֣י אָדָ֔ם אֵ֥ין צַדִּ֖יק בָּ/אָ֑רֶץ אֲשֶׁ֥ר יַעֲשֶׂה טּ֖וֹב וְ/לֹ֥א יֶחֱטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/020.yaml
  text: For there is no righteous man on the earth who does good and does not sin[a].
translation:
  language: ru
  text: Ведь нет на земле праведного человека, который делал бы добро и не грешил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующей мысли; «ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: אָדָם
  choice: человека
  rationale: Еврейское существительное употреблено в единственном числе как обобщающее обозначение человека; русское «человек» сохраняет и число, и универсальный смысл.
- source_word: אֵין צַדִּיק
  choice: нет … праведного
  rationale: Экзистенциальная конструкция естественно передаётся оборотом «нет», а «праведный» сохраняет нравственно-богословское содержание צַדִּיק.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: В контексте Екклесиаста выражение имеет общий смысл человеческого мира, а не отдельной страны или территории.
- source_word: יַעֲשֶׂה טּוֹב
  choice: делал бы добро
  rationale: Форма с «бы» естественно согласуется в русском языке с отрицательной конструкцией существования и относительным предложением, сохраняя общий, а не единичный характер действия.
- source_word: וְלֹא יֶחֱטָא
  choice: и не грешил
  rationale: Сохранена явная сочинительная связь еврейского текста без усиления до «никогда не грешил».
theological_decisions:
- issue: Обобщающее употребление אָדָם в единственном числе
  choice: человека
  alternative: мужчины
  rationale: Здесь אָדָם обозначает отдельного представителя человечества и выражает всеобщую истину; перевод «мужчина» неоправданно сузил бы смысл до мужского пола.
- issue: Характер утверждения о грехе
  choice: и не грешил
  alternative: никогда не грешил
  rationale: Перевод сохраняет грамматическую сдержанность оригинала и не добавляет наречия «никогда», хотя общий смысл высказывания указывает на универсальность человеческого греха.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Ведь» звучит естественнее тяжеловесного «ибо», сохраняя логическую связь с предыдущим стихом; лексика остаётся dignified и общепонятной.
