base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/025.yaml
  text: I turned[a], I and my heart, to know and to search out and seek wisdom and an explanation[c][b], and to know that wickedness is folly and foolishness is madness.
translation:
  language: ru
  text: Я обратился[a] — я и сердце моё, — чтобы познать, исследовать и искать мудрость и объяснение[b], и чтобы познать, что нечестие — глупость, а неразумие — безумие[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я повернулся — я и сердце моё»; этот вариант буквальнее сохраняет образ перемены направления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «расчёт», «обоснование», «итог рассуждения» или «замысел».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейская фраза предельно сжата; буквально: «познать нечестие — глупость, а неразумие — безумие». Возможна также атрибутивная передача: «нечестие глупости и неразумие безумия».'
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוֹתִי
  choice: Я обратился
  rationale: Глагол סבב буквально передаёт поворот или перемену направления. «Обратился» сохраняет образ сознательной переориентации к исследованию и естественно звучит по-русски.
- source_word: אֲנִי וְלִבִּי
  choice: я и сердце моё
  rationale: Сохранено необычное соединение говорящего с его «сердцем». В библейском иврите сердце обозначает внутренний центр мысли, воли и решения; замена на «разум» сузила бы образ.
- source_word: לָדַעַת
  choice: познать
  rationale: Повтор одного и того же русского глагола отражает повтор ידע и поддерживает ритм целенаправленного исследования.
- source_word: לָתוּר
  choice: исследовать
  rationale: תור означает разыскивать, разведывать, обстоятельно исследовать. «Исследовать» отличает этот глагол от следующего בקש.
- source_word: וּבַקֵּשׁ
  choice: искать
  rationale: Обычное значение בקש — «искать»; оно сохраняет накопление трёх глаголов познания и поиска.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Традиционный и точный эквивалент ключевого понятия литературы мудрости.
- source_word: חֶשְׁבּוֹן
  choice: разумное объяснение
  rationale: Слово может означать расчёт, итог рассуждения, замысел или обоснованное объяснение. Здесь речь идёт об интеллектуальном поиске, поэтому выбран естественный контекстуальный вариант, а широта значения отмечена в сноске.
- source_word: רֶשַׁע
  choice: нечестие
  rationale: רשע имеет выраженную нравственную окраску; «нечестие» точнее общего слова «зло».
- source_word: כֶּסֶל
  choice: глупость
  rationale: В литературе мудрости слово обозначает не только недостаток ума, но и нравственно порочную глупость.
- source_word: הַסִּכְלוּת
  choice: неразумие
  rationale: Выбор отличает этот близкий синоним от כֶּסֶל, не создавая чрезмерно резкого оттенка «тупости».
- source_word: הוֹלֵלוֹת
  choice: безумие
  rationale: Слово обозначает иррациональность, безрассудство или безумие; данный вариант соответствует его оценочной силе в Екклесиасте.
theological_decisions:
- issue: Антропологический образ сердца
  choice: Сохранить «я и сердце моё»
  alternative: Передать как «я всем своим разумом» или «я всем сердцем решил»
  rationale: Исходный текст необычно координирует говорящего и его сердце. Сохранение этой формы не сводит «сердце» лишь к интеллекту и оставляет вместе мысль, волю и внутреннюю решимость.
- issue: Связь между нечестием, глупостью, неразумием и безумием
  choice: 'Передать две сжатые именные группы как оценочные сопоставления: «нечестие как глупость, а неразумие — как безумие»'
  alternative: 'Понять сочетания атрибутивно: «нечестие глупости и неразумие безумия» либо предикативно: «нечестие есть глупость, а неразумие — безумие»'
  rationale: В еврейском нет выраженной связки или предлога, поэтому синтаксическая связь остаётся сжатой и допускает несколько оттенков. «Как» сохраняет оценочный характер, не превращая фразу в жёсткое отвлечённое тождество; альтернативная конструкция отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством и лёгкой поэтической инверсией в выражении «я и сердце моё». Накопление инфинитивов и повтор «познать» сохранены ради ритма и структуры оригинала; смысловая неоднозначность заключительной части не устранена без пояснения.
