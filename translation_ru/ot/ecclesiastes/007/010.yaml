id: ECC.7.10
reference: Ecclesiastes 7:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַל תֹּאמַר֙ מֶ֣ה הָיָ֔ה שֶׁ֤/הַ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים הָי֥וּ טוֹבִ֖ים מֵ/אֵ֑לֶּה כִּ֛י לֹ֥א מֵ/חָכְמָ֖ה שָׁאַ֥לְתָּ עַל זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/010.yaml
  text: Do not say[b][a], “Why were the former days better than these?” For it is not from wisdom that you ask this.
translation:
  language: ru
  text: 'Не говори: «Почему прежние дни были лучше нынешних?» Ведь не от мудрости ты спрашиваешь об этом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Запретительная частица אַל с формой второго лица единственного числа естественно передаётся прямым запретом «не говори», без дополнительного усиления.
- source_word: מֶה הָיָה
  choice: Почему
  rationale: В данном вопросительном обороте сочетание вводит вопрос о причине; буквальное «что было» по-русски затемнило бы смысл.
- source_word: הַיָּמִים הָרִאשֹׁנִים
  choice: прежние дни
  rationale: Выражение обозначает более раннее время; «прежние дни» сохраняет временное сопоставление и звучит естественно.
- source_word: הָיוּ טוֹבִים מֵאֵלֶּה
  choice: были лучше нынешних
  rationale: Сравнительная конструкция означает «были лучше этих». Слово «нынешних» ясно указывает на подразумеваемые текущие дни и естественно противопоставлено «прежним».
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего запрета; «ведь» естественно передаёт пояснительно-причинную связь в русском афористическом высказывании.
- source_word: לֹא מֵחָכְמָה
  choice: не от мудрости
  rationale: Предлог מִן обозначает источник или основание. Формулировка сохраняет образ исходящего от мудрости вопроса, не сводя смысл к наречию «немудро».
- source_word: שָׁאַלְתָּ עַל זֶה
  choice: ты спрашиваешь об этом
  rationale: Хотя глагол морфологически стоит в перфекте, в обобщающем контексте русский настоящий вид передаёт применимый в настоящем принцип; עַל זֶה прямо соответствует «об этом».
theological_decisions:
- issue: Характер оценки прежних времён
  choice: Сохранён вопрос о том, почему прежние дни якобы были лучше, без утверждения, что они действительно были лучше.
  alternative: «Не говори, что прежние дни были лучше нынешних»
  rationale: Еврейский текст цитирует вопрос и порицает источник такого вопрошания; он не требует превращать вопрос в прямое отрицание сравнительной оценки.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и афористичным строем. Обращение оставлено во втором лице единственного числа, как в еврейском тексте. Лексика понятна широкому читателю и не содержит конфессиональных уточнений.
