  text: Sorrow is better than laughter[b][a], for by a sad face the heart is made better.
translation:
  language: ru
  text: Печаль лучше смеха[a], ибо, когда лицо печально[b], сердцу становится лучше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Огорчение лучше смеха», «Досада лучше смеха» или «Гнев лучше смеха». Еврейское слово כַּעַס обычно может обозначать досаду, огорчение или гнев; здесь «печаль» выбрано по контексту, где говорится о благотворном воздействии скорби и серьёзности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «при неблагополучии лица». Это еврейское выражение обозначает печальный, омрачённый или встревоженный вид.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: лучше
  rationale: В сочетании с מִן выражает сравнение, поэтому перевод «лучше» точнее абсолютного «хороша».
- source_word: כַּעַס
  choice: печаль
  rationale: Слово может обозначать также гнев, досаду или огорчение, однако противопоставление смеху и упоминание печального лица в данном контексте указывают прежде всего на скорбное, серьёзное состояние.
- source_word: מִשְּׂחֹק
  choice: смеха
  rationale: Прямой и естественный русский эквивалент, сохраняющий конкретность еврейского слова.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание для предшествующего утверждения и ясно передаёт причинно-пояснительную связь.
- source_word: בְרֹעַ פָּנִים
  choice: при печальном лице
  rationale: Буквально выражение означает «при дурноте лица»; это еврейская идиома, обозначающая печальный или омрачённый вид. Формулировка сохраняет образ лица и связь с последующим изменением сердца.
- source_word: יִיטַב
  choice: становится лучше
  rationale: Форма глагола יטב означает «становиться хорошим/лучшим, быть улучшенным». Перевод сохраняет благотворное воздействие печали, не сужая смысл до одной лишь радости.
- source_word: לֵב
  choice: сердце
  rationale: В литературе мудрости слово обозначает внутреннего человека, включая мысли, волю и расположение; традиционный русский эквивалент сохраняет эту широту.
theological_decisions:
- issue: Благотворное действие печали
  choice: сердце становится лучше
  alternative: сердце становится радостнее
  rationale: Еврейский глагол указывает на улучшение или благо для внутреннего человека, но не требует понимать результат именно как эмоциональную радость.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и афористичности стиха. Формулировка «сердце становится лучше» намеренно сохраняет широту еврейского выражения и его образ внутреннего нравственного и рассудочного улучшения.
