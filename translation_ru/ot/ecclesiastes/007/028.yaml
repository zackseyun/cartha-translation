  text: 'which my soul still sought[a], but I did not find: one man among a thousand I found[b], but a woman among all these I did not find.'
translation:
  language: ru
  text: 'чего всё ещё искала душа моя, но я не нашёл: одного мужчину из тысячи[a] я нашёл, а среди всех этих ни одной женщины[b] не нашёл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одного из тысячи».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «среди всех этих», по-видимому, относится ко всей группе, которую рассматривал Кохелет. Здесь сообщается о результате его поиска, а не обязательно выносится суждение обо всех женщинах вообще.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: чего
  rationale: Относительное местоимение продолжает мысль предыдущего стиха. Форма «чего» естественно связывается с глаголами поиска и нахождения и не конкретизирует неоднозначный антецедент.
- source_word: עוֹד
  choice: всё ещё
  rationale: Передаёт продолжавшийся поиск, а не отдельную дополнительную попытку.
- source_word: בִּקְשָׁה נַפְשִׁי
  choice: искала душа моя
  rationale: Сохранён явный субъект נַפְשִׁי («моя душа»), отражающий образность и внутренний характер поиска; порядок слов остаётся литературным, но понятным.
- source_word: וְלֹא מָצָאתִי
  choice: но я не нашёл
  rationale: Союз וְ здесь имеет естественное противительное значение между поиском и его безрезультатностью.
- source_word: אָדָם
  choice: мужчину
  rationale: В непосредственном противопоставлении слову אִשָּׁה («женщина») слово אָדָם обозначает мужчину, а не человека вообще.
- source_word: אֶחָד מֵאֶלֶף
  choice: одного мужчину из тысячи
  rationale: Передаёт числовое выражение буквально и идиоматично по-русски; слово «мужчину» восполняется из контраста следующей части.
- source_word: מָצָאתִי
  choice: я нашёл
  rationale: Прямо передаёт личное свидетельство говорящего о результате его поиска.
- source_word: וְאִשָּׁה
  choice: а женщины
  rationale: Союз «а» ясно выражает сопоставление с найденным мужчиной, не усиливая его до более резкого противопоставления.
- source_word: בְכָל אֵלֶּה
  choice: среди всех них
  rationale: Фраза указывает на всю рассматриваемую говорящим группу; местоимение «них» естественно относится к упомянутой тысяче.
- source_word: לֹא מָצָאתִי
  choice: не нашёл
  rationale: Прямой перевод отрицательной глагольной формы без добавления моральной оценки.
theological_decisions:
- issue: Возможность универсального или уничижительного прочтения высказывания о женщинах
  choice: Передать слова говорящего как сообщение о результате именно его поиска, сохранив прямоту исходного текста.
  alternative: Смягчить формулировку либо расширить её до общего суждения обо всех женщинах.
  rationale: Еврейский текст сообщает, кого Кохелет нашёл в рассматриваемой группе. Перевод не скрывает неудобное противопоставление, но и не превращает ограниченное личное наблюдение в универсальное учение о женщинах.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Инверсия «душа моя» сохраняет образность оригинала; остальной синтаксис сделан ясным и естественным. Начальное «чего» намеренно сохраняет зависимость стиха от предыдущего контекста.
