    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֵּית הָסוּרִים
  choice: из дома узников
  rationale: Буквально передаёт еврейское выражение «из дома связанных/узников»; более естественное русское «из тюрьмы» дано как вариант в сноске.
- source_word: יָצָא
  choice: вышел
  rationale: Обычное значение глагола — «выйти»; оно естественно передаёт освобождение из места заключения.
- source_word: לִמְלֹךְ
  choice: чтобы царствовать
  rationale: Инфинитив от מלך обозначает царствование или пребывание царём; целевая конструкция сохраняет синтаксическую связь с выходом.
- source_word: גַּם
  choice: даже
  rationale: Передаёт усилительный оттенок частицы во второй части стиха.
- source_word: בְּמַלְכוּתוֹ
  choice: в своём царстве
  rationale: Сохраняет близкое значение «в его царстве», но возвратное местоимение естественнее по-русски. Возможное временное значение «во время своего царствования» отмечено в сноске.
- source_word: נוֹלַד
  choice: родился
  rationale: Русский совершенный вид естественно выражает завершённый факт рождения; отдельная форма давнопрошедшего времени не требуется.
- source_word: רָשׁ
  choice: бедным
  rationale: Прямое и общеупотребительное соответствие значению «бедный, неимущий».
- source_word: כִּי ... כִּי
  choice: ведь ... хотя
  rationale: Первое כִּי понято как пояснительно-причинное, второе — как уступительное. Это отражает вероятную логику контекста, не сглаживая её полностью.
theological_decisions:
- issue: Неясная временная и смысловая связь выражения בְּמַלְכוּתוֹ с рождением бедным
  choice: «хотя даже в своём царстве родился бедным»
  alternative: «хотя во время своего царствования он оказался беден» / «ведь и в своём царстве он родился бедным»
  rationale: 'Сохранена формальная напряжённость масоретского текста: буквальное «родился бедным в своём царстве» необычно, но исправлять текст или однозначно переосмысливать נולד как «стал бедным» без рукописного основания не следует. Лексическая альтернатива для בְּמַלְכוּתוֹ вынесена в сноску.'
translation_notes:
  register: Современный литературный русский, сдержанный и понятный. Буквальный образ «дом узников» сохранён ради связи с еврейским текстом; две реальные лексические неоднозначности отмечены сносками.
