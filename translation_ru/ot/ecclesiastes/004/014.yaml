  yaml_path: translation/ot/ecclesiastes/004/014.yaml
  text: For he came out from the house of prisoners to reign[b][a], though even in his kingdom he had been born poor.
translation:
  language: ru
  text: Ведь он вышел из дома узников[a], чтобы царствовать, хотя даже в его царстве он родился бедным.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
