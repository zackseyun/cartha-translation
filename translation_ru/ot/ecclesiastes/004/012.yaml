source:
  edition: WLC
  text: וְ/אִֽם יִתְקְפ/וֹ֙ הָ/אֶחָ֔ד הַ/שְּׁנַ֖יִם יַעַמְד֣וּ נֶגְדּ֑/וֹ וְ/הַ/חוּט֙ הַֽ/מְשֻׁלָּ֔שׁ לֹ֥א בִ/מְהֵרָ֖ה יִנָּתֵֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/012.yaml
  text: And if someone overpowers one[a], two will stand against him; and a threefold cord is not quickly broken.
translation:
  language: ru
  text: И если кто-нибудь одолеет одного, двое устоят против него; а нить, скрученная втрое,[a] не скоро порвётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шнур из трёх прядей». Древнееврейское выражение описывает нить или шнур, сделанные тройными.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет и условное значение, и связующую силу союза ו, продолжая мысль предыдущего стиха.
- source_word: יִתְקְפוֹ הָאֶחָד
  choice: кто-нибудь одолеет одного
  rationale: Глагол תקף передаёт превосходство в силе, способность одолеть; неопределённое «кто-нибудь» естественно выражает подразумеваемого противника, а «одного» связывает фразу с темой одиночества.
- source_word: הַשְּׁנַיִם יַעַמְדוּ נֶגְדּוֹ
  choice: двое устоят против него
  rationale: «Устоять против» сохраняет образ стояния перед противником и одновременно естественно передаёт сопротивление ему.
- source_word: וְהַחוּט
  choice: а нить
  rationale: חוּט может обозначать нить или шнур. «Нить» естественно сочетается с образом скручивания, а союз «а» по-русски ясно вводит итоговое образное сопоставление.
- source_word: הַמְשֻׁלָּשׁ
  choice: скрученная втрое
  rationale: Форма описывает нить, сделанную тройной. Такой перевод передаёт устройство нити, не сводя смысл исключительно к трём отдельным прядям.
- source_word: לֹא בִמְהֵרָה
  choice: не скоро
  rationale: Буквально передаёт временное наречие «быстро, скоро» и сохраняет форму древнееврейского изречения, не заменяя её толкованием «нелегко».
- source_word: יִנָּתֵק
  choice: порвётся
  rationale: Нифаль глагола נתק означает быть разорванным или оторванным; применительно к нити «порвётся» звучит точно и естественно.
