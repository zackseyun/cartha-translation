lexical_decisions:
- source_word: טוֹבִים הַשְּׁנַיִם מִן הָאֶחָד
  choice: Двоим лучше, чем одному
  rationale: Прилагательное טוֹבִים с מִן образует сравнительную конструкцию. Дательный «двоим… одному» естественно передаёт обобщённое сопоставление совместного и одиночного труда, не вводя конкретных лиц.
- source_word: אֲשֶׁר
  choice: потому что
  rationale: Здесь относительная частица вводит основание предыдущего утверждения; причинный союз ясно передаёт эту связь.
- source_word: יֵשׁ לָהֶם
  choice: они получают
  rationale: Буквально конструкция означает «у них есть», однако в сочетании с воздаянием за труд русский глагол «получают» естественно выражает возникающий у них результат, не сводя его к денежной плате.
- source_word: שָׂכָר טוֹב
  choice: добрую награду
  rationale: שָׂכָר обозначает вознаграждение, воздаяние или отдачу от труда; «добрая награда» сохраняет широту значения и прямое определение טוֹב.
- source_word: בַּעֲמָלָם
  choice: за свой труд
  rationale: עָמָל у Екклесиаста означает труд, нередко тяжкий; предлог ב здесь допускает понимание труда как основания или источника вознаграждения. «За свой труд» естественно связывает труд с наградой.
