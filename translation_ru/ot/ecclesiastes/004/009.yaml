  yaml_path: translation/ot/ecclesiastes/004/009.yaml
  text: Two are better than one[a], because they have a good reward for their labor.
translation:
  language: ru
  text: Двоим лучше, чем одному, потому что за свой труд они получают хорошее вознаграждение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
