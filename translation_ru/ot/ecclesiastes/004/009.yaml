  - severity: low
    issue: Глагол «получают» эксплицирует динамику, не выраженную непосредственно в יֵשׁ לָהֶם.
    rationale: Исходная конструкция буквально обозначает наличие у них хорошего вознаграждения. Русское «получают» контекстуально возможно, но формулировка с существительным «вознаграждение» и сноска с «отдачей» лучше удерживают нейтральность исходного выражения.
