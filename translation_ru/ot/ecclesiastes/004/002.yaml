base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/002.yaml
  text: And I considered the dead[a], who have already died, more fortunate than the living, who are still alive.
translation:
  language: ru
  text: И я счёл умерших, которые уже умерли, счастливее живых, которые всё ещё живы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И я восхвалил умерших… больше, чем живых». Еврейский глагол буквально может означать «хвалить» или «одобрять»; здесь он выражает суждение Кохелета о том, что умершие находятся в лучшем положении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבֵּחַ
  choice: И я счёл ... счастливее
  rationale: 'Пиэль глагола שׁבח обычно означает «хвалить, одобрять», однако здесь в сочетании со сравнительным מן выражает оценочное суждение: умершие находятся в лучшем положении. «Счёл ... счастливее» естественно передаёт эту силу, не представляя умерших объектом нравственной похвалы.'
- source_word: אֲנִי
  choice: я
  rationale: Явное местоимение первого лица сохранено, поскольку оно подчёркивает личную оценку Кохелета.
- source_word: אֶת הַמֵּתִים
  choice: умерших
  rationale: Субстантивированная форма обозначает умерших как группу; «умерших» — прямой и естественный русский эквивалент.
- source_word: שֶׁכְּבָר מֵתוּ
  choice: которые уже умерли
  rationale: כבר передаёт значение «уже», а перфект מות — завершившееся действие. Намеренная смысловая повторность еврейского текста сохранена.
- source_word: מִן הַחַיִּים
  choice: счастливее живых
  rationale: מן после глагола оценки имеет сравнительное значение. Сравнительная степень «счастливее» показывает, что речь идёт о положении умерших относительно угнетаемых живых, а не обязательно об их внутреннем ощущении счастья.
- source_word: אֲשֶׁר הֵמָּה חַיִּים עֲדֶנָה
  choice: которые всё ещё живы
  rationale: Относительное предложение вновь подчёркивает продолжающееся состояние живых; עֲדֶנָה естественно передано сочетанием «всё ещё».
theological_decisions:
- issue: Сопоставление умерших и живых
  choice: Передать личное наблюдение Кохелета о том, что перед лицом угнетения умершие находятся в более благоприятном положении, чем продолжающие жить.
  alternative: Истолковать стих как утверждение о блаженном посмертном состоянии умерших либо лишь как риторическое преувеличение без реального сравнения.
  rationale: Ближайший контекст (4:1–3) говорит об угнетении «под солнцем». Перевод сохраняет напряжённость высказывания, но не вводит учение о состоянии после смерти и не ослабляет сравнительную оценку.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и резкой повторности оригинала. Формула «которые уже умерли» намеренно не сглажена, а «всё ещё живы» передаёт подчёркнутое продолжение жизни.
