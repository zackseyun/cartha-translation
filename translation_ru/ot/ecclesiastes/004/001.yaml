source:
  edition: WLC
  text: וְ/שַׁ֣בְתִּֽי אֲנִ֗י וָ/אֶרְאֶה֙ אֶת כָּל הָ֣/עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֣ה דִּמְעַ֣ת הָ/עֲשֻׁקִ֗ים וְ/אֵ֤ין לָ/הֶם֙ מְנַחֵ֔ם וּ/מִ/יַּ֤ד עֹֽשְׁקֵי/הֶם֙ כֹּ֔חַ וְ/אֵ֥ין לָ/הֶ֖ם מְנַחֵֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/001.yaml
  text: 'Then I turned and saw all the oppressions that are done under the sun: and behold[a], the tears of the oppressed, and they had no comforter. Power was in the hand of their oppressors[b], and they had no comforter.'
translation:
  language: ru
  text: И снова я обратил взор и увидел всякое угнетение[a], совершаемое под солнцем. И вот — слёзы угнетённых, а утешителя у них нет; в руке их угнетателей — сила[b], а утешителя у них нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех угнетённых под солнцем». Еврейская пассивная форма может обозначать угнетённых людей или, в более широком смысле, совершаемые притеснения.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и от руки их угнетателей — сила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי אֲנִי
  choice: И снова я обратил свой взор
  rationale: שׁוב здесь вводит новое наблюдение, а не буквальное возвращение. Формулировка естественно передаёт переход к очередному предмету размышления.
- source_word: וָאֶרְאֶה
  choice: и увидел
  rationale: Сохранено прямое значение ראה и характерная для Когелета формула личного наблюдения.
- source_word: כָּל הָעֲשֻׁקִים אֲשֶׁר נַעֲשִׂים
  choice: всякое угнетение, совершаемое
  rationale: Форма הָעֲשֻׁקִים буквально допускает значение «угнетённые», однако сочетание с נַעֲשִׂים («совершаемые») указывает на случаи или проявления угнетения. Русское собирательное единственное число звучит естественно и сохраняет общий охват.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохранён буквально устойчивый и ключевой для Екклесиаста оборот.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Частица привлекает внимание к открывшейся взору картине; «и вот» передаёт её риторическую выразительность в современном литературном русском.
- source_word: דִּמְעַת הָעֲשֻׁקִים
  choice: слёзы угнетённых
  rationale: Хотя דִּמְעַת формально стоит в единственном числе, контекстуально и по-русски естественно употребить множественное «слёзы», обозначающее страдание множества людей.
- source_word: וְאֵין לָהֶם מְנַחֵם
  choice: а утешителя у них нет
  rationale: Экзистенциальная конструкция передана кратко, с сохранением существительного «утешитель» и точного повтора рефрена. Настоящее время сохраняет непосредственность наблюдаемого состояния, которую допускает безглагольная еврейская конструкция.
- source_word: וּמִיַּד עֹשְׁקֵיהֶם כֹּחַ
  choice: в руке их угнетателей — сила
  rationale: Передаётся образ руки как сферы обладания властью. Предлог מִן буквально означает «из/от», но в данной сжатой конструкции мысль состоит в том, что сила находится на стороне угнетателей; буквальная форма отмечена сноской.
- source_word: עֹשְׁקֵיהֶם
  choice: их угнетателей
  rationale: Активное причастие обозначает тех, кто притесняет пострадавших; выбор сохраняет лексическую связь с «угнетением» и «угнетёнными».
theological_decisions:
- issue: Референт הָעֲשֻׁקִים в первой части стиха
  choice: «всякое угнетение» — действия и проявления притеснения
  alternative: «всех угнетённых» — пострадавшие люди
  rationale: Пассивная причастная форма сама по себе может обозначать угнетённых людей, но согласование по смыслу с «совершаемое» поддерживает расширенное значение случаев угнетения. Далее фокус явно переносится на самих пострадавших и их слёзы.
- issue: Временная форма повторяющегося וְאֵין לָהֶם מְנַחֵם
  choice: 'настоящее время: «утешителя у них нет»'
  alternative: 'прошедшее время: «утешителя у них не было»'
  rationale: Еврейская безглагольная экзистенциальная конструкция не задаёт прошедшего времени сама по себе. Настоящее время сохраняет обобщающую силу и делает картину непосредственной, не отрицая того, что она была увидена рассказчиком.
- issue: Смысл כֹּחַ у угнетателей
  choice: сила как фактическое преимущество и возможность принуждения
  alternative: формализованная власть угнетателей
  rationale: כֹּחַ означает силу или мощь и не требует уточнения её политического либо юридического характера; поэтому сохранено более широкое «сила».
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной риторической выразительностью. Сохранены ключевой оборот «под солнцем», образ руки и двукратный рефрен об отсутствии утешителя. Архаичное «се» не используется; וְהִנֵּה передано естественным «и вот».
