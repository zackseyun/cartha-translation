  text: שְׁמֹ֣ר רגלי/ך כַּ/אֲשֶׁ֤ר תֵּלֵךְ֙ אֶל בֵּ֣ית הָ/אֱלֹהִ֔ים וְ/קָר֣וֹב לִ/שְׁמֹ֔עַ מִ/תֵּ֥ת הַ/כְּסִילִ֖ים זָ֑בַח כִּֽי אֵינָ֥/ם יוֹדְעִ֖ים לַ/עֲשׂ֥וֹת רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/017.yaml
  text: Guard your steps when you go to the house of God[a], and draw near to listen rather than to offer the sacrifice of fools[c][b], for they do not know that they are doing evil.
translation:
  language: ru
  text: 'Следи за своими шагами, когда идёшь в дом Бога, и приближайся, чтобы слушать[a], а не приносить жертву, как глупцы: ведь они не сознают, что творят зло[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы услышать».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ведь они не знают делать зло». Смысл, вероятно, в том, что они не осознают зла собственного поступка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר רגליך
  choice: Следи за своими шагами
  rationale: Еврейское выражение буквально говорит о ногах, но в контексте предостерегает человека о его поведении при приближении к месту поклонения. «Следи за своими шагами» сохраняет образ и естественно звучит по-русски.
- source_word: כַּאֲשֶׁר תֵּלֵךְ
  choice: когда идёшь
  rationale: В данном наставлении оборот естественнее всего понимать во временном смысле.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Бога
  rationale: Сохранено формальное еврейское выражение; перевод «храм» был бы более узким толкованием.
- source_word: וְקָרוֹב לִשְׁמֹעַ
  choice: и приближайся, чтобы слушать
  rationale: Краткая еврейская конструкция продолжает побуждение. «Слушать» передаёт внимательное восприятие, характерное для литературы мудрости, не исключая оттенка послушания.
- source_word: מִתֵּת ... זָבַח
  choice: а не приносить жертву
  rationale: נתן при слове «жертва» имеет смысл представления или принесения. Противопоставление передано естественной русской конструкцией «а не».
- source_word: הַכְּסִילִים
  choice: глупцов
  rationale: Обычный термин литературы мудрости для нравственно и духовно неразумных людей, а не только интеллектуально ограниченных.
- source_word: כִּי אֵינָם יוֹדְעִים לַעֲשׂוֹת רָע
  choice: ведь они не сознают, что творят зло
  rationale: Буквально сжатое выражение допускает неоднозначность, но в контексте, вероятнее всего, обозначает неосознание ими зла собственного поступка. «Не сознают» ясно передаёт отсутствие нравственного понимания.
theological_decisions:
- issue: Характер противопоставления слушания и жертвоприношения
  choice: Стих ставит внимательное слушание Бога выше неразумного жертвоприношения, не отвергая жертвы как таковые.
  alternative: Понимать стих как полное отвержение жертвоприношений.
  rationale: Текст осуждает именно «жертву глупцов» и связывает её со злом, которого они не осознают; поэтому критика направлена на неразумное и пустое богослужение, а не обязательно на всякую жертву.
- issue: Смысл заключительной фразы לַעֲשׂוֹת רָע
  choice: Они не осознают, что их действие является злом.
  alternative: Они не знают ничего иного, кроме как делать зло; либо не умеют делать зло.
  rationale: Еврейская конструкция сжата и грамматически допускает разное понимание. Контекст противопоставления внимательного слушания жертве глупцов поддерживает значение неосознанного злого действия, но буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, наставительный и сдержанно возвышенный регистр. Сохранены конкретный образ шагов и выражение «дом Бога»; синтаксис слегка распрямлён ради ясности без устранения отмеченной смысловой неоднозначности.
