  text: הַ/כְּסִיל֙ חֹבֵ֣ק אֶת יָדָ֔י/ו וְ/אֹכֵ֖ל אֶת בְּשָׂרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/005.yaml
  text: The fool folds his hands and eats his own flesh[a][b].
translation:
  language: ru
  text: Глупец складывает руки[a] и ест собственную плоть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обнимает (охватывает) свои руки»; это образ праздного бездействия.'
    reason: lexical_alternative
  - marker: b
    text: То есть своей глупостью или праздностью губит самого себя.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּסִיל
  choice: глупец
  rationale: В литературе мудрости это нравственно и разумно неразумный человек, а не просто человек с низкими умственными способностями; «глупец» естественно передаёт афористический тон.
- source_word: חֹבֵק
  choice: складывает
  rationale: Глагол буквально означает «обнимает, охватывает». В сочетании с руками образ указывает на праздное бездействие; «складывает руки» — естественное русское выражение, сохраняющее конкретный образ.
- source_word: יָדָיו
  choice: руки
  rationale: Форма с суффиксом 3-го лица мужского рода означает «его руки»; русская конструкция «складывает руки» естественно выражает принадлежность без обязательного местоимения.
- source_word: וְאֹכֵל
  choice: и ест
  rationale: Причастие продолжает общеистинное, пословичное описание; настоящее время сохраняет этот смысл.
- source_word: בְּשָׂרוֹ
  choice: собственную плоть
  rationale: Буквально — «его плоть». Слово «собственную» ясно передаёт возвратную направленность образа, а «плоть» сохраняет резкую телесную метафору оригинала.
theological_decisions:
- issue: Метафорический смысл выражения «ест собственную плоть»
  choice: Сохранить в основном тексте буквальную телесную метафору как образ саморазрушительной глупости и праздности.
  alternative: 'Передать толкованием: «губит себя» или «истощает себя».'
  rationale: Еврейский текст использует яркий и допускающий некоторую смысловую широту образ. Его сохранение не сужает смысл до одного объяснения, а примечание помогает читателю понять вероятную направленность метафоры.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и несколько резкая формулировка соответствует характеру еврейского изречения. Сохранена конкретная метафора оригинала.
