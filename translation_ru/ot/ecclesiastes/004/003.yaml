  text: וְ/טוֹב֙ מִ/שְּׁנֵי/הֶ֔ם אֵ֥ת אֲשֶׁר עֲדֶ֖ן לֹ֣א הָיָ֑ה אֲשֶׁ֤ר לֹֽא רָאָה֙ אֶת הַ/מַּעֲשֶׂ֣ה הָ/רָ֔ע אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/003.yaml
  text: But better than both of them is the one who has not yet been[a], who has not seen the evil deed that is done under the sun.
translation:
  language: ru
  text: Но лучше их обоих — тот, кого ещё не было[a], кто не видел злого дела, совершаемого под солнцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «тот, кто ещё не родился». Буквально по-еврейски: «тот, кого ещё не было».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטוֹב
  choice: Но лучше
  rationale: В контексте выражение имеет сравнительное значение, а союз передан как «но», чтобы естественно обозначить переход к более резкому выводу по сравнению с предыдущим стихом.
- source_word: מִשְּׁנֵיהֶם
  choice: их обоих
  rationale: Фраза прямо сопоставляет третьего с двумя ранее названными — живыми и умершими; «их обоих» кратко и точно сохраняет это сравнение.
- source_word: אֵת אֲשֶׁר עֲדֶן לֹא הָיָה
  choice: тот, кого ещё не было
  rationale: Формулировка сохраняет буквальную широту еврейского «ещё не был», не подменяя её более конкретным толкованием «ещё не родился».
- source_word: אֲשֶׁר לֹא רָאָה
  choice: кто не видел
  rationale: Естественная русская передача относительного придаточного и завершённого отрицательного опыта.
- source_word: הַמַּעֲשֶׂה הָרָע
  choice: злого дела
  rationale: Сохраняет единственное число и конкретное значение מַעֲשֶׂה как дела или деяния, не сужая его до отдельного вида угнетения.
- source_word: אֲשֶׁר נַעֲשָׂה
  choice: совершаемого
  rationale: Причастная конструкция естественно передаёт пассивное и обобщённо-продолжительное значение происходящего зла.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Устойчивая и узнаваемая передача повторяющейся формулы книги Екклесиаста.
theological_decisions:
- issue: Кого обозначает выражение «тот, кого ещё не было»
  choice: Сохранить буквальное и несколько открытое выражение «кого ещё не было».
  alternative: «Тот, кто ещё не родился».
  rationale: Контекст допускает понимание нерождённого человека, однако глагол היה буквально означает «быть, существовать» и сам по себе не называет рождение; примечание сообщает вероятное толкование, не внося его в основной текст.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Тире делает сравнительную конструкцию прозрачной, а формула «под солнцем» сохранена ради последовательности с остальной книгой.
