  yaml_path: translation/ot/ecclesiastes/004/015.yaml
  text: I saw all the living[a], those walking under the sun, with the second youth who would stand in his place.
translation:
  language: ru
  text: Я видел всех живущих, ходящих под солнцем, со вторым юношей[a], который займёт его место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со вторым ребёнком» или «со вторым молодым человеком»; возможно, речь идёт о преемнике, который занимает место прежнего правителя.'
    reason: Слово הַיֶּלֶד может означать ребёнка или молодого человека; הַשֵּׁנִי буквально означает «второй». Контекст допускает преемственную роль, но не требует прямо называть юношу преемником в основном тексте.
lexical_decisions:
- source_word: רָאִיתִי
  choice: Я видел
  rationale: Прямо передаёт Qal perfect 1cs и обычную для Екклесиаста формулу личного наблюдения.
- source_word: כָּל הַחַיִּים
  choice: всех живущих
  rationale: Сохраняет компактность еврейского выражения «все живые», но по-русски ясно указывает на людей.
- source_word: הַמְהַלְּכִים
  choice: ходящих
  rationale: Причастная форма передаёт продолжительное действие и естественно согласуется с «живущих».
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохраняет устойчивый и значимый рефрен книги Екклесиаста.
- source_word: עִם
  choice: они были со
  rationale: Передаёт основное значение предлога «с» и не уточняет, означает ли он простое присутствие, поддержку или следование за юношей.
- source_word: הַיֶּלֶד
  choice: юношей
  rationale: יַלֶד может обозначать ребёнка или молодого человека; в контексте смены правителя «юноша» звучит естественно, не делая его возраст чрезмерно определённым.
- source_word: הַשֵּׁנִי
  choice: вторым
  rationale: Сохраняет буквальное порядковое значение и не подменяет спорный образ толкованием «преемник».
- source_word: אֲשֶׁר יַעֲמֹד
  choice: который займёт
  rationale: Глагол עמד буквально означает «встать, стать», но в сочетании с תַּחְתָּיו здесь естественно выражает вступление на место другого; несовершенный вид допускает будущую направленность.
- source_word: תַּחְתָּיו
  choice: место прежнего
  rationale: В контексте преемства выражение означает занять место того, о ком говорилось ранее. «Прежнего» делает местоименную отсылку понятной по-русски, не называя его царём прямо.
theological_decisions:
- issue: Кого обозначает «второй юноша» и как он связан с живущими
  choice: Сохранено буквальное «второй юноша» и нейтральное отношение «были с ним».
  alternative: «молодой преемник, за которым пошёл весь народ»
  rationale: Еврейский текст допускает политический контекст и идею поддержки преемника, но прямо не называет юношу царём и не употребляет глагол «следовать».
translation_notes:
  register: Современный литературный русский язык с сохранением характерного выражения «под солнцем». Двоеточие помогает показать, что вторая часть поясняет наблюдение автора. Формулировка избегает архаизмов и не устраняет неоднозначность политической сцены.
