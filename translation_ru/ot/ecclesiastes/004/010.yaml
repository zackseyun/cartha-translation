source:
  edition: WLC
  text: כִּ֣י אִם יִפֹּ֔לוּ הָ/אֶחָ֖ד יָקִ֣ים אֶת חֲבֵר֑/וֹ וְ/אִ֣י/ל֗/וֹ הָֽ/אֶחָד֙ שֶׁ/יִּפּ֔וֹל וְ/אֵ֥ין שֵׁנִ֖י לַ/הֲקִימֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/010.yaml
  text: For if they fall[a], one will lift up his companion[b]; but woe to the one who falls when there is not a second to lift him up.
translation:
  language: ru
  text: Ведь если они упадут, один поднимет своего товарища[a]. Но горе тому, кто упадёт, а второго[b] нет, чтобы поднять его!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «друга»; еврейское слово может обозначать товарища, спутника или друга.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и нет второго, чтобы поднять его».'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי אִם
  choice: Ведь если
  rationale: Сочетание вводит поясняющее условие и связывает стих с предшествующим утверждением о преимуществе двоих перед одним.
- source_word: יִפֹּלוּ
  choice: они упадут
  rationale: Форма множественного числа сохраняет конкретный образ падения и согласуется с контекстом, где речь идёт о двоих.
- source_word: הָאֶחָד
  choice: один
  rationale: 'В первой части это естественно передаёт распределительное значение: один из двоих.'
- source_word: יָקִים
  choice: поднимет
  rationale: Каузативная форма глагола קום означает «поможет встать, поднимет»; выбранное слово сохраняет физический образ без лишнего толкования.
- source_word: אֶת חֲבֵרוֹ
  choice: своего товарища
  rationale: חבר обозначает связанного с человеком другого — товарища или спутника; «товарищ» достаточно широко и не обязательно подразумевает близкую дружбу.
- source_word: וְאִילוֹ
  choice: Но горе тому
  rationale: Передаёт сильное предостережение или скорбное восклицание еврейского выражения и одновременно обозначает противопоставление.
- source_word: הָאֶחָד שֶׁיִּפּוֹל
  choice: тому, кто упадёт
  rationale: Естественная русская формулировка сохраняет указание на одного человека, противопоставленного паре.
- source_word: וְאֵין שֵׁנִי
  choice: а второго нет
  rationale: Сохраняет буквальный числовой контраст между одним и двумя, важный для аргумента всего отрывка.
- source_word: לַהֲקִימוֹ
  choice: чтобы поднять его
  rationale: Повтор глагола «поднять» воспроизводит повтор קום и сохраняет цель действия.
theological_decisions: []
