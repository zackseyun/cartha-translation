  source_fidelity: Текст точно передаёт условное «если они упадут», распределительное «один», каузативный смысл יָקִים («поднимет») и намеренно повторяемый образ поднятия. «Но горе тому» адекватно передаёт וְאִילוֹ; «второго нет» сохраняет важное для контекста числовое противопоставление.
