source:
  edition: WLC
  text: ט֛וֹב יֶ֥לֶד מִסְכֵּ֖ן וְ/חָכָ֑ם מִ/מֶּ֤לֶךְ זָקֵן֙ וּ/כְסִ֔יל אֲשֶׁ֛ר לֹא יָדַ֥ע לְ/הִזָּהֵ֖ר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/013.yaml
  text: Better is a poor but wise youth than an old and foolish king who no longer knows how to heed warning[a].
translation:
  language: ru
  text: Лучше бедный, но мудрый юноша, чем старый и глупый царь, который уже не умеет прислушиваться к предостережениям[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который уже не умеет принимать наставления»; или: «который уже не даёт себя вразумить».'
    reason: Лексически форма לְהִזָּהֵר может обозначать принятие предостережения, наставления или вразумления.
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: Лучше ... чем
  rationale: Сравнительная конструкция с מִן естественно передаётся по-русски оборотом «лучше… чем».
- source_word: יֶלֶד
  choice: юноша
  rationale: Слово обозначает молодого человека; «юноша» сохраняет противопоставление старому царю, не сужая смысл до маленького ребёнка.
- source_word: מִסְכֵּן
  choice: бедный
  rationale: В данном контексте прилагательное указывает на бедность или низкое общественное положение; «бедный» — краткий и ясный эквивалент.
- source_word: וְחָכָם
  choice: но мудрый
  rationale: Союз передан уступительно-противительным «но», поскольку мудрость юноши противопоставлена его бедности.
- source_word: מֶלֶךְ זָקֵן וּכְסִיל
  choice: старый и глупый царь
  rationale: Передано прямо, с сохранением двух характеристик царя; «глупый» здесь означает нравственно и практически неразумный.
- source_word: אֲשֶׁר לֹא יָדַע ... עוֹד
  choice: который уже не умеет
  rationale: Отрицание с עוֹד выражает состояние «уже не / больше не»; «не умеет» естественно передаёт неспособность царя должным образом реагировать.
- source_word: לְהִזָּהֵר
  choice: принимать предостережения
  rationale: В данном контексте форма допускает смысл восприимчивости к предупреждению, наставлению или вразумлению; выбранный вариант хорошо сочетается с царской невосприимчивостью к совету.
