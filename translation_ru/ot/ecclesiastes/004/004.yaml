base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/004.yaml
  text: And I saw that all labor and all skillful work come from a man's envy of his neighbor[c][b][a]. This too is vanity and a chasing after wind.
translation:
  language: ru
  text: И увидел я, что всякий труд и всякое мастерство в работе[a] — это зависть человека к своему ближнему.[b] И это тоже суета и погоня за ветром.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий успех в деле»; еврейское כִּשְׁרוֹן может обозначать умение, мастерство или достигнутый благодаря им успех.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «зависть человека к своему ближнему». Единственное число мужского рода, вероятно, имеет обобщающий смысл.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «томление духа»; значение еврейского выражения спорно, возможен также образ стремления поймать или пасти ветер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמָל
  choice: труд
  rationale: В Екклесиасте слово обозначает тяжёлый человеческий труд; «труд» естественно звучит по-русски и не сужает значение до одних лишь мучений.
- source_word: כִּשְׁרוֹן הַמַּעֲשֶׂה
  choice: умение в деле
  rationale: כִּשְׁרוֹן может означать умение, мастерство либо достигнутый благодаря им успех. Формулировка сохраняет связь с деятельностью и не сводит смысл только к результату.
- source_word: כִּי הִיא
  choice: это
  rationale: Еврейская именная конструкция буквально утверждает тождество или характеристику; русский вариант сохраняет её прямоту и не усиливает причинное толкование «происходит от».
- source_word: קִנְאַת
  choice: зависть
  rationale: В контексте соперничества и сравнения с другим человеком «зависть» точнее современного русского «ревность».
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: человека к ближнему своему
  rationale: Сохраняются единственное число, межличностная направленность зависти и обобщающий характер мужской формы.
- source_word: הֶבֶל
  choice: суета
  rationale: «Суета» сохраняет устойчивый тематический термин книги и допускает присущие הֶבֶל оттенки тщетности, мимолётности и неуловимости.
- source_word: רְעוּת רוּחַ
  choice: погоня за ветром
  rationale: Выражение естественно передаёт образ бесплодного стремления, не устраняя образ ветра.
theological_decisions:
- issue: Связь труда и мастерства с завистью
  choice: 'Сохранено прямое именное утверждение: «это зависть человека к ближнему своему»'
  alternative: «происходят от зависти человека к ближнему»
  rationale: В еврейском тексте нет явного глагола причинности. Прямой вариант сохраняет резкость и неоднозначность наблюдения, не превращая его безусловно в тезис о происхождении всякого труда.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной близостью к синтаксису оригинала. Инверсия «увидел я» и выражение «ближнему своему» сохраняют библейскую тональность, оставаясь понятными. Маркеры сносок расположены непосредственно после соответствующих выражений.
