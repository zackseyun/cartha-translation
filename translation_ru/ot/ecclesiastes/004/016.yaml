source:
  edition: WLC
  text: אֵֽין קֵ֣ץ לְ/כָל הָ/עָ֗ם לְ/כֹ֤ל אֲשֶׁר הָיָה֙ לִ/פְנֵי/הֶ֔ם גַּ֥ם הָ/אַחֲרוֹנִ֖ים לֹ֣א יִשְׂמְחוּ ב֑/וֹ כִּֽי גַם זֶ֥ה הֶ֖בֶל וְ/רַעְי֥וֹן רֽוּחַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/016.yaml
  text: There was no end to all the people[a], to all who were before them; yet those who come later will not rejoice in him[c][b]. For this too is vanity and a chasing after wind.
translation:
  language: ru
  text: Не было конца всему народу[a] — всем, кто был перед ними; однако и те, кто придёт после, не будут радоваться ему[b]. И это тоже суета[c] и погоня за ветром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Нет конца всему народу, всем, кто был прежде них». Синтаксис этой части еврейского текста труден и допускает несколько пониманий.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не будут довольны им» либо «не будут радоваться из-за него».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово «хевель» — ключевое слово Екклесиаста; оно может указывать на то, что мимолётно, неуловимо или приносит разочарование.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין קֵץ
  choice: не было конца
  rationale: Сочетание отрицательной частицы существования со словом «конец» указывает на отсутствие предела, то есть на неисчислимое множество. Прошедшее время согласуется с последующим הָיָה и ретроспективным описанием, хотя формально возможно и настоящее время.
- source_word: לְכָל הָעָם
  choice: всему народу
  rationale: 'Предлог ל после выражения «нет конца» обозначает отношение: «нет конца всему народу». Русская формулировка близка к структуре еврейского текста и сохраняет его необычность.'
- source_word: לְכֹל אֲשֶׁר הָיָה לִפְנֵיהֶם
  choice: всем, кто был перед ними
  rationale: Синтаксис фразы труден и допускает разные понимания. Буквальное «был перед ними» не уточняет сверх текста, идёт ли речь о предшествовавших людях или о тех, перед кем находился правитель.
- source_word: הָאַחֲרוֹנִים
  choice: те, кто придёт после
  rationale: Слово обозначает последующих людей или более позднее поколение. Будущее время естественно передаёт еврейский имперфект יִשְׂמְחוּ и временной контраст с бывшими прежде.
- source_word: לֹא יִשְׂמְחוּ בוֹ
  choice: не будут радоваться ему
  rationale: Глагол означает «радоваться, быть довольным», а местоименный суффикс мужского рода, вероятнее всего, отсылает к юноше-правителю из ближайшего контекста. Дательный падеж естественно передаёт отношение, выраженное предлогом ב, не уточняя его излишне.
- source_word: הֶבֶל
  choice: суета
  rationale: Ключевое слово Екклесиаста буквально связано с дыханием или паром и обозначает нечто мимолётное, неуловимое и разочаровывающее. «Суета» сохраняет узнаваемую библейскую традицию, а примечание раскрывает более широкий смысл.
- source_word: רַעְיוֹן רוּחַ
  choice: погоня за ветром
  rationale: Устойчивый образ в Екклесиасте выражает тщетное стремление поймать неуловимое. Эта формулировка ясна современному читателю и сохраняет метафору.
theological_decisions:
- issue: Неясные референты местоимений и синтаксис первой половины стиха
  choice: Сохранены формулировки «перед ними» и «радоваться ему» без явного отождествления действующих лиц.
  alternative: Прямо связать «ему» с юношей, ставшим царём, а первую фразу понять как указание на всех его подданных или на предшествовавшие поколения.
  rationale: Еврейский текст сжат и синтаксически неоднозначен. Контекст делает отсылку к юноше-правителю вероятной, но перевод не должен устранять подлинную неясность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Необычная конструкция первой половины стиха сохранена ради исходной неоднозначности, но тире помогает читателю увидеть пояснительную связь. Термин «суета» оставлен как узнаваемый сквозной эквивалент הֶבֶל и снабжён пояснением.
