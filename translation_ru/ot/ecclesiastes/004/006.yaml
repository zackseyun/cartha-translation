translation_notes:
  register: Краткая, афористичная конструкция сохранена. Лексика современная и литературная; повтор «горсть — две горсти» удерживает наглядное противопоставление оригинала. Предлоги «с» передают сопутствующие обстоятельства без добавления идеи о способе приобретения.
