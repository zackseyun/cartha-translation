translation:
  language: ru
  text: Лучше одна полная горсть при покое, чем две полные горсти при тяжком труде и погоне за ветром.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при спокойствии».'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. может означать: «и стремление к ветру»; традиционно: «и томление духа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: Сравнительное оценочное слово вводит краткое изречение; русское «лучше» естественно передаёт подразумеваемую связку.
- source_word: מְלֹא כַף
  choice: одна горсть
  rationale: Буквально «наполнение ладони»; «одна горсть» сохраняет образ меры и подготавливает противопоставление двум горстям.
- source_word: נָחַת
  choice: покой
  rationale: Существительное обозначает покой, тишину или спокойствие; «покой» кратко и естественно противопоставлен изнурительному труду.
- source_word: מִמְלֹא חָפְנַיִם
  choice: чем две горсти
  rationale: Предлог מִן выражает сравнение, а форма двойственного числа указывает на две наполненные сложенные ладони; «две горсти» ясно сохраняет контраст с одной горстью.
- source_word: עָמָל
  choice: тяжкий труд
  rationale: В Екклесиасте слово часто обозначает не просто работу, а тягостный, изнурительный труд; определение «тяжкий» передаёт эту смысловую окраску.
- source_word: וּרְעוּת רוּחַ
  choice: и погоней за ветром
  rationale: Устойчивый образ в Екклесиасте выражает тщетное стремление к неуловимому. «Погоня за ветром» понятно современному читателю и сохраняет метафору, не подменяя её традиционным толкованием о духе.
