  text: גַּ֛ם אִם יִשְׁכְּב֥וּ שְׁנַ֖יִם וְ/חַ֣ם לָ/הֶ֑ם וּ/לְ/אֶחָ֖ד אֵ֥יךְ יֵחָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/011.yaml
  text: Again[a], if two lie down together, they keep warm; but how can one keep warm alone?
translation:
  language: ru
  text: 'И ещё: если двое лягут вместе, им будет тепло[a]; а одному как согреться?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «им тепло»; буквально еврейское выражение означает: «тепло им».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: И ещё
  rationale: Передаёт добавочную связь с предыдущим рассуждением и естественно вводит ещё один пример преимущества двоих.
- source_word: אִם יִשְׁכְּבוּ שְׁנַיִם
  choice: если двое лягут вместе
  rationale: Сохраняет условную конструкцию и основное значение שׁכב — «лечь, лежать»; «вместе» естественно выражает подразумеваемую близость двоих, благодаря которой они согреваются.
- source_word: וְחַם לָהֶם
  choice: им будет тепло
  rationale: Близко передаёт безличную еврейскую конструкцию, буквально указывающую, что тепло будет им, не уточняя способ или длительность согревания.
- source_word: וּלְאֶחָד אֵיךְ יֵחָם
  choice: а одному как согреться?
  rationale: Передаёт контраст и риторический вопрос. «Согреться» естественно выражает значение формы יחם — стать или быть тёплым — без добавления отсутствующего отдельного слова «одному/в одиночку» сверх уже выраженного לְאֶחָד.
