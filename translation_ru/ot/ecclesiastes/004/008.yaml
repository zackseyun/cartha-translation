base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/008.yaml
  text: There is one man[a], and he has no second; he has neither son nor brother, and there is no end to all his labor[c][b]. Yet his eyes are not satisfied with wealth, and he says, “And for whom am I laboring and depriving myself of good?” This too is vanity and a grievous business.
translation:
  language: ru
  text: Бывает один человек, и нет у него второго; нет у него ни сына, ни брата. Нет конца всем его трудам, и глаза его не насыщаются богатством. «Для кого я тружусь и лишаю себя добра?» И это — суета[b] и тяжкое дело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Еврейское слово, переведённое как «суета», может также выражать образ пара или дыхания и указывать на мимолётность, неуловимость либо тщетность.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אֶחָד וְאֵין שֵׁנִי
  choice: Бывает человек одинокий, и нет у него никого другого
  rationale: Сочетание описывает отдельного человека, у которого нет «второго», то есть спутника или близкого ему человека. Естественное русское «одинокий» передаёт смысл, а продолжение сохраняет образ отсутствия другого.
- source_word: גַּם בֵּן וָאָח אֵין לוֹ
  choice: ни сына, ни брата у него нет
  rationale: Буквально сохранён перечень ближайших родственников без обобщения до «семьи».
- source_word: וְאֵין קֵץ לְכָל עֲמָלוֹ
  choice: И нет конца всем его трудам
  rationale: עָמָל обозначает изнурительный труд; «труды» естественно сочетается с «нет конца» и сохраняет связь с последующим «тружусь».
- source_word: גַּם עֵינָיו לֹא תִשְׂבַּע עֹשֶׁר
  choice: но глаза его не насыщаются богатством
  rationale: 'Образ глаз сохранён. Частица גַּם в контексте получает противительный оттенок: несмотря на бесконечный труд, богатство не приносит насыщения.'
- source_word: וּלְמִי אֲנִי עָמֵל
  choice: Для кого же я тружусь
  rationale: Вопрос о том, кому достанется плод труда. Частица «же» естественно вводит внутренний вопрос, не добавляя отсутствующего в еврейском глагола речи.
- source_word: וּמְחַסֵּר אֶת נַפְשִׁי מִטּוֹבָה
  choice: и лишаю себя благ
  rationale: נֶפֶשׁ здесь означает самого человека, поэтому «себя» точнее по функции, чем терминологическое «душу». Множественное «благ» естественно передаёт широкое значение טוֹבָה — хорошего, доступных жизненных благ.
- source_word: גַּם זֶה הֶבֶל
  choice: И это — суета
  rationale: '«Суета» — понятное традиционное русское соответствие программному слову הֶבֶל, сохраняющее его смысловую многослойность: мимолётность, тщетность и неуловимость.'
- source_word: וְעִנְיַן רָע הוּא
  choice: и тяжкое занятие
  rationale: עִנְיָן означает занятие, дело или труд, а רָע в данном контексте характеризует его как тягостное, бедственное.
theological_decisions:
- issue: Антропологический смысл נַפְשִׁי
  choice: себя
  alternative: свою душу
  rationale: В контексте נֶפֶשׁ обозначает личность говорящего, а не утверждает особое учение о составе человека.
- issue: Передача ключевого слова הֶבֶל
  choice: суета
  alternative: пар; тщета
  rationale: «Суета» поддерживает сквозную лексику Екклесиаста и не сводит многозначный образ только к бессмысленности; образ пара и оттенок тщетности отмечены в сноске.
- issue: Подразумеваемая речь одинокого человека
  choice: прямая речь без добавления «говорит он»
  alternative: и говорит он
  rationale: Еврейский текст непосредственно переходит к вопросу и не содержит глагола речи; кавычки ясно передают этот переход без словесного добавления.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной речи. Синтаксис упрощён ровно настолько, чтобы стих был понятен обычному читателю; сохранены образ «ненасыщающихся глаз», перечисление родства и внутренний вопрос. Все сноски имеют маркеры в основном тексте.
