base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/019.yaml
  text: They make bread for laughter[a], and wine gladdens life[b], and money answers everything.
translation:
  language: ru
  text: Для веселья готовят трапезу[a], вино радует жизнь, а деньги отвечают на всё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «готовят хлеб»; слово «хлеб» может обозначать пищу или трапезу в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «деньги дают ответ на всё». Еврейский текст буквально говорит, что деньги «отвечают на всё»; смысл этой краткой фразы может быть практическим или ироническим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: для веселья
  rationale: Предлог לְ выражает цель или результат, а שְׂחוֹק означает смех или веселье. «Для веселья» сохраняет краткость и афористичность еврейского текста.
- source_word: עֹשִׂים לֶחֶם
  choice: готовят трапезу
  rationale: Форма множественного числа допускает неопределённое действующее лицо. Хотя לֶחֶם буквально означает «хлеб», здесь слово естественно понимать шире — как пищу или трапезу; такой перевод звучит по-русски ясно и соответствует контексту застолья.
- source_word: וְיַיִן יְשַׂמַּח חַיִּים
  choice: вино радует жизнь
  rationale: Порода пиэль глагола שׂמח означает «веселить, радовать», а חַיִּים здесь естественно передать как «жизнь». Формулировка сохраняет олицетворённую и сжатую образность оригинала.
- source_word: וְהַכֶּסֶף
  choice: а деньги
  rationale: כֶּסֶף может означать «серебро» или «деньги»; в данном практическом наблюдении уместно экономическое значение. Союз передан как «а», чтобы естественно обозначить итоговый поворот изречения.
- source_word: יַעֲנֶה אֶת־הַכֹּל
  choice: отвечают на всё
  rationale: ענה обычно значит «отвечать, откликаться». Буквально близкий перевод сохраняет намеренно резкую и допускающую разные толкования формулировку, не сводя её заранее к смыслу «удовлетворяют все нужды».
theological_decisions:
- issue: Тон и сила заключительной части стиха
  choice: 'Передать утверждение прямо: «деньги отвечают на всё».'
  alternative: Уточнить прагматически («деньги удовлетворяют всякую нужду») или явно обозначить иронию («людям кажется, что деньги — ответ на всё»).
  rationale: В еврейском тексте ирония грамматически не обозначена, а абсолютность высказывания не смягчена. Прямой перевод сохраняет богословское и литературное напряжение, оставляя оценку контексту книги.
translation_notes:
  register: Современный литературный русский язык; краткий, афористичный строй сохранён. «Трапеза» употреблена как понятное и достоинственное обозначение общей еды, без конфессиональной нагрузки. Заключительная фраза намеренно оставлена необычной, как и в еврейском оригинале.
