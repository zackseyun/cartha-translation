  text: אִם קֵהָ֣ה הַ/בַּרְזֶ֗ל וְ/הוּא֙ לֹא פָנִ֣ים קִלְקַ֔ל וַ/חֲיָלִ֖ים יְגַבֵּ֑ר וְ/יִתְר֥וֹן הכשיר חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/010.yaml
  text: If the iron is dull and one has not sharpened its edge[a], then he must use more strength[b]; but wisdom brings success.
translation:
  language: ru
  text: Если железное лезвие затупилось и его рабочую кромку не наточили[a], придётся приложить больше сил; но преимущество мудрости в том, что она помогает добиться успеха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если железо затупилось и он не привёл в порядок его поверхность (лицо)». Под «железом», вероятно, подразумевается железное лезвие или орудие, а «поверхность» в данном контексте — его рабочая кромка.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «а мудрость даёт преимущество для успеха». Еврейская конструкция допускает разные способы передачи связи между мудростью, преимуществом и успешным действием.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: קֵהָה
  choice: затупилось
  rationale: Передаёт утрату остроты режущей кромки естественным для современного русского языка глаголом.
- source_word: הַבַּרְזֶל
  choice: железное лезвие
  rationale: Буквально сказано «железо», но в контексте имеется в виду железная режущая часть орудия; «железное лезвие» ясно передаёт эту метонимию.
- source_word: פָנִים קִלְקַל
  choice: его не наточили
  rationale: פָנִים буквально означает «лицо» или «поверхность», а здесь — рабочую грань, то есть лезвие; קלקל в данном контексте означает привести кромку в надлежащее состояние, наточить её.
- source_word: וַחֲיָלִים יְגַבֵּר
  choice: придётся приложить больше сил
  rationale: 'Передаёт практическое следствие: при тупом орудии необходимо увеличить физическое усилие.'
- source_word: וְיִתְרוֹן
  choice: преимущество
  rationale: Сохраняет явно выраженное в еврейском тексте значение выгоды или преимущества, важное для лексики Екклесиаста.
- source_word: הכשיר
  choice: помогает добиться успеха
  rationale: Форма от כשר выражает приведение к пригодности, успешному или действенному результату; перевод сохраняет практический смысл, не сводя его к гарантии успеха.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное соответствие; здесь слово включает практическое умение и здравое суждение.
theological_decisions:
- issue: Характер обещанного мудростью успеха
  choice: «помогает добиться успеха»
  alternative: «обеспечивает успех»
  rationale: Текст говорит о практическом преимуществе и действенности мудрости, но не требует понимать её как безусловную гарантию результата.
translation_notes:
  register: Современный литературный русский язык; образ передан ясно и без архаизмов. Полупословичный ритм оригинала сохранён, а неоднозначность заключительной фразы отмечена в сноске.
