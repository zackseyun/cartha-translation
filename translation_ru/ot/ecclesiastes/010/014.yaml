  text: וְ/הַ/סָּכָ֖ל יַרְבֶּ֣ה דְבָרִ֑ים לֹא יֵדַ֤ע הָ/אָדָם֙ מַה שֶׁ/יִּֽהְיֶ֔ה וַ/אֲשֶׁ֤ר יִֽהְיֶה֙ מֵֽ/אַחֲרָ֔י/ו מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/014.yaml
  text: And the fool multiplies words[a]. A man does not know what will be[b], and who can tell him what will be after him?
translation:
  language: ru
  text: А глупец множит слова. Человек не знает, что будет. И кто скажет ему, что будет после него?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что произойдёт после него»; возможно также: «что будет после его ухода». Еврейское выражение может обозначать события, которые наступят позднее, особенно после смерти человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַסָּכָל
  choice: А глупец
  rationale: Определённое существительное הַסָּכָל передано прямо как «глупец»; союз וְ в контексте естественно звучит по-русски как «а», продолжая и оттеняя предшествующую мысль.
- source_word: יַרְבֶּה דְבָרִים
  choice: множит слова
  rationale: Сохранён образ еврейского выражения — глупец произносит множество слов. Формулировка кратка, понятна и соответствует поэтическому регистру книги.
- source_word: לֹא יֵדַע הָאָדָם
  choice: Человек не знает
  rationale: הָאָדָם употреблено как обобщающее единственное число. Русское «человек» естественно выражает человечество через представителя, не превращая фразу в более свободное «никто не знает».
- source_word: מַה שֶׁיִּהְיֶה
  choice: что будет
  rationale: Прямо передаёт открытое указание на неизвестное будущее, не уточняя его как конкретные события.
- source_word: וַאֲשֶׁר יִהְיֶה מֵאַחֲרָיו
  choice: что будет после него
  rationale: 'Формулировка сохраняет неоднозначность: речь может идти о последующих событиях вообще или о времени после жизни человека.'
- source_word: מִי יַגִּיד לוֹ
  choice: И кто скажет ему
  rationale: Отдельный риторический вопрос ясно передаёт силу еврейской конструкции и избегает возможного ошибочного понимания, будто слова «кто скажет» являются вторым дополнением глагола «не знает».
