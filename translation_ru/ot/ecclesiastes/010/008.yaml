  text: חֹפֵ֥ר גּוּמָּ֖ץ בּ֣/וֹ יִפּ֑וֹל וּ/פֹרֵ֥ץ גָּדֵ֖ר יִשְּׁכֶ֥/נּוּ נָחָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/008.yaml
  text: Whoever digs a pit will fall into it[b][a], and whoever breaks through a wall will be bitten by a snake.
translation:
  language: ru
  text: Кто роет яму, тот упадёт в неё, а кто проламывает ограду[a], того укусит змея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать ограду, забор или стену; в древней обстановке, вероятно, имеется в виду каменная межевая ограда.
    reason: cultural_note
lexical_decisions:
- source_word: חֹפֵר
  choice: Кто роет
  rationale: Причастие породы qal имеет обобщённое, пословичное значение; конструкция «кто…, тот…» естественно передаёт его по-русски.
- source_word: גּוּמָּץ
  choice: яму
  rationale: Слово обозначает выкопанную яму или ловчую яму; «яма» сохраняет конкретный образ и естественно звучит в пословице.
- source_word: בּוֹ יִפּוֹל
  choice: тот упадёт в неё
  rationale: Предлог с глаголом падения естественно передаётся направительной конструкцией «в неё»; имперфект выражает обычное или ожидаемое следствие.
- source_word: וּפֹרֵץ
  choice: а кто проламывает
  rationale: Причастие снова обозначает всякого, кто совершает действие; «проламывает» передаёт создание пролома в преграде.
- source_word: גָּדֵר
  choice: ограду
  rationale: Слово может обозначать стену или ограду, часто каменную межевую кладку. «Ограда» сохраняет более широкий диапазон значения, чем одно лишь «стена».
- source_word: יִשְּׁכֶנּוּ
  choice: того укусит
  rationale: Глагол נשך означает «кусать», а местоименный суффикс относится к человеку, проламывающему ограду. Порядок слов сохраняет выразительную еврейскую конструкцию без неясности.
- source_word: נָחָשׁ
  choice: змея
  rationale: Обычное современное русское соответствие, не привносящее дополнительных символических ассоциаций слова «змей».
