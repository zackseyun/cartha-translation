  text: The beginning of the words of his mouth is foolishness[a], and the end of his speech is evil madness.
translation:
  language: ru
  text: Первые слова из его уст — глупость, а последние слова — злое безумие.[a]
  philosophy: optimal-equivalence
  footnotes:
