    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת
  choice: первые
  rationale: Конструктивная форма означает «начало» или «первую часть». В сочетании со «словами» прилагательное «первые» естественно передаёт начало речи по-русски и сохраняет противопоставление последним словам.
- source_word: דִּבְרֵי
  choice: слова
  rationale: В данном контексте множественное число דָּבָר обозначает произносимые слова, а не отвлечённые «дела» или «вещи».
- source_word: פִיהוּ
  choice: из его уст
  rationale: Сохраняет конкретный образ еврейского «его рот/уста», но оформляет его естественным современным русским оборотом.
- source_word: סִכְלוּת
  choice: глупость
  rationale: Передаёт характерное для Экклезиаста понятие неразумия и ясно противопоставляется мудрости.
- source_word: וְאַחֲרִית
  choice: а последние
  rationale: Передаёт «конец, последнюю часть» и образует ясную параллель с «первыми словами».
- source_word: פִיהוּ
  choice: слова
  rationale: Еврейский текст буквально повторяет «его уст», однако в русском повтор «последние слова» естественно выражает смысл окончания его речи; буквальная особенность отмечена в сноске.
- source_word: הוֹלֵלוּת
  choice: безумие
  rationale: Слово обозначает иррациональность или безумие и усиливает выраженную ранее «глупость».
- source_word: רָעָה
  choice: злое
  rationale: Сохраняет возможную нравственную оценку и резкость еврейского выражения, не исключая оттенка пагубности, указанного в сноске.
