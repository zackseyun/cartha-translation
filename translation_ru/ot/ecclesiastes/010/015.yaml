  text: עֲמַ֥ל הַ/כְּסִילִ֖ים תְּיַגְּעֶ֑/נּוּ אֲשֶׁ֥ר לֹֽא יָדַ֖ע לָ/לֶ֥כֶת אֶל עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/015.yaml
  text: The labor of fools wearies them[a], for he does not know how to go to the city.
translation:
  language: ru
  text: Труд глупцов изнуряет того, кто не знает, как дойти до города.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Труд глупцов изнуряет их, потому что они не знают дороги в город». Еврейские местоименные формы и относительное предложение допускают собирательное понимание; основной текст сохраняет форму единственного числа — «того, кто не знает».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲמַל
  choice: труд
  rationale: Существительное обозначает тяжёлый, изнурительный труд; «труд» сохраняет конкретный смысл усилия и не сводит его к бедствию.
- source_word: הַכְּסִילִים
  choice: глупцов
  rationale: В литературе мудрости כְּסִיל — нравственно-интеллектуальная категория; обычное русское «глупец» передаёт её без разговорной грубости.
- source_word: תְּיַגְּעֶנּוּ
  choice: изнуряет того
  rationale: Пиэль от יגע означает «утомлять, изнурять»; глагол согласован с עֲמַל, а суффикс 3-го лица мужского рода единственного числа сохранён через «того».
- source_word: אֲשֶׁר
  choice: кто
  rationale: Относительная частица вводит характеристику лица, обозначенного единственным числом в суффиксе предыдущего глагола.
- source_word: לֹא יָדַע
  choice: не знает
  rationale: В афористическом контексте перфект выражает устойчивую характеристику, естественно передаваемую русским настоящим временем.
- source_word: לָלֶכֶת
  choice: как дойти
  rationale: При ידע инфинитив הלך выражает умение или знание пути; «как дойти» естественно по-русски и сохраняет образ движения.
- source_word: אֶל עִיר
  choice: до города
  rationale: Существительное без артикля имеет неопределённо-обобщённый смысл; русский язык естественно выражает его без неопределённого артикля. «До города» передаёт направленность אל.
