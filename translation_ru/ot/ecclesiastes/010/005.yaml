  language: ru
  text: 'Есть зло, которое я видел под солнцем: словно ошибка[a], исходящая от правителя:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно оплошность, исходящая из присутствия правителя». Еврейское выражение может означать как действительно непреднамеренную ошибку, так и нечто, представленное в качестве ошибки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ רָעָה
  choice: Есть зло
  rationale: Сохраняет бытийную конструкцию и намеренно не уточняет, идёт ли речь о нравственном зле, бедствии или тяжком пороке общественного порядка.
- source_word: רָאִיתִי
  choice: которое я видел
  rationale: Передаёт свидетельское, осмысляющее наблюдение Кохелета; простое прошедшее время естественно для современного русского повествования.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохраняет характерное для Екклесиаста выражение о земной человеческой жизни.
- source_word: כִּשְׁגָגָה
  choice: словно ошибка
  rationale: «Словно» передаёт сравнительную частицу כ, а «ошибка» сохраняет возможность как непреднамеренного промаха, так и того, что лишь представляется или выдаётся за ошибку.
- source_word: שֶׁיֹּצָא מִלִּפְנֵי
  choice: исходящая от
  rationale: Естественно по-русски передаёт происхождение решения из присутствия и окружения властителя; более буквальный оттенок отмечен в сноске.
- source_word: הַשַּׁלִּיט
  choice: правителя
  rationale: Обозначает лицо, наделённое властью, не сужая значение до царя или иного конкретного титула.
