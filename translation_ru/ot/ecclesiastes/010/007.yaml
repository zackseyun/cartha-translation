lexical_decisions:
- source_word: רָאִיתִי
  choice: Я видел
  rationale: Форма qal perfect, 1-е лицо единственного числа, передаёт личное наблюдение Кохелета. Русское «я видел» естественно выражает пережитый опыт, сохраняющий значение для настоящего.
- source_word: עֲבָדִים
  choice: рабов
  rationale: Слово עֶבֶד может обозначать раба или слугу; здесь резкая перестановка общественных ролей делает значение «рабы» наиболее уместным.
- source_word: עַל סוּסִים
  choice: верхом на конях
  rationale: Буквально «на конях». Добавление «верхом» естественно для русского языка и ясно передаёт противопоставление пешему передвижению.
- source_word: שָׂרִים
  choice: вельмож
  rationale: Слово обозначает людей высокого положения, начальников или знатных лиц. «Вельможи» сохраняет социальный контраст с рабами, не ограничивая значение членами царской семьи.
- source_word: הֹלְכִים
  choice: идущими
  rationale: Причастие от הלך изображает продолжающееся движение; «идущими» сохраняет конкретный образ.
- source_word: כַּעֲבָדִים
  choice: словно рабы
  rationale: 'Сравнительная частица כ указывает на уподобление: вельможи не названы рабами, а выглядят или передвигаются подобно им.'
- source_word: עַל הָאָרֶץ
  choice: по земле
  rationale: Буквально «по земле / на земле»; выражение сохраняет предметный контраст с положением верхом, не заменяя его более толковательным «пешком».
