  text: Through laziness the roof sags[b][a], and through idle hands the house leaks.
translation:
  language: ru
  text: От лености проседает крыша[a], и из-за праздности рук дом протекает[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оседает кровля». Еврейский глагол означает, что нечто опускается или поддаётся, а существительное может обозначать как крышу в целом, так и её несущую конструкцию.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-за низости рук»; это образ праздности, нерадивости или небрежения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲצַלְתַּיִם
  choice: От лености
  rationale: Предлог ב выражает причину или обстоятельство, а עֲצַלְתַּיִם обозначает леность. «От лености» естественно передаёт причинный смысл и сохраняет афористическую краткость.
- source_word: יִמַּךְ
  choice: проседает
  rationale: Форма нифаля от מוך означает становиться низким, оседать или поддаваться. В отношении кровельной конструкции «проседает» передаёт постепенное разрушение, не усиливая смысл до полного обвала.
- source_word: הַמְּקָרֶה
  choice: крыша
  rationale: מְקָרֶה может обозначать крышу или её несущую конструкцию. Общее слово «крыша» понятно современному читателю и не вводит излишней конкретизации вроде «стропила».
- source_word: וּבְשִׁפְלוּת יָדַיִם
  choice: и от опущенных рук
  rationale: Буквально выражение означает «при опущенности рук» и образно указывает на бездействие и нерадивость. Русское «опущенные руки» сохраняет телесный образ, хотя может также ассоциироваться с унынием; смысл небрежного бездействия уточнён в сноске.
- source_word: יִדְלֹף
  choice: протекает
  rationale: Глагол דלף означает капать или протекать. При подлежащем «дом» естественное русское соответствие — «дом протекает».
- source_word: הַבָּיִת
  choice: дом
  rationale: Обычное значение בַּיִת — «дом»; оно сохраняет конкретный образ еврейского текста.
