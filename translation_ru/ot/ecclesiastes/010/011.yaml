  text: If the snake bites before it is charmed[b][a], there is no advantage for the charmer.
translation:
  language: ru
  text: Если змея укусит без заклинания, нет пользы заклинателю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «владельцу языка». Вероятно, имеется в виду заклинатель змей — человек, искусный в произнесении заклинаний. Возможен перевод: «Если змея укусит без заклинания, нет пользы владельцу языка»; выражение «без заклинания» также может подразумевать, что змея укусила прежде, чем её успели заклясть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условный, имеющий характер пословицы случай; «если» естественно передаёт еврейскую конструкцию.
- source_word: יִשֹּׁךְ
  choice: укусит
  rationale: Глагол נָשַׁךְ обычно обозначает укус, особенно змеи.
- source_word: הַנָּחָשׁ
  choice: змея
  rationale: Речь идёт о буквальной змее в образе пословицы; современное нейтральное слово не привносит лишних богословских ассоциаций.
- source_word: בְּלוֹא לָחַשׁ
  choice: прежде заклинания
  rationale: Буквально конструкция означает «без заклинания»; в контексте естественно подразумевается, что змея кусает до того, как заклинатель успел применить своё искусство. Формулировка сохраняет существительное לָחַשׁ и практический временной смысл.
- source_word: וְאֵין יִתְרוֹן
  choice: уже нет пользы
  rationale: יִתְרוֹן — характерное для Екклесиаста понятие пользы, преимущества или выгоды. «Нет пользы» ясно и естественно по-русски; «уже» передаёт подразумеваемое последствие укуса, не изменяя основной мысли.
- source_word: לְבַעַל הַלָּשׁוֹן
  choice: заклинателю
  rationale: Буквально «владельцу языка». В связи со змеёй выражение, вероятнее всего, обозначает человека, искусного в устном заклинании, то есть заклинателя змей.
theological_decisions:
- issue: Значение לְבַעַל הַלָּשׁוֹן
  choice: В основном тексте передано как «заклинателю».
  alternative: «владельцу языка» или «искусному в речах»
  rationale: Контекст змеи и לָחַשׁ поддерживает значение заклинателя, однако буквальный образ неоднозначен и поэтому отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичной, пословичной структурой. Сохранена неоднозначность сочетания «без заклинания» между обстоятельственным и практически-временным пониманием посредством сноски.
