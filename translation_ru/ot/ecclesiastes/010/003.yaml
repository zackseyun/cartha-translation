base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/003.yaml
  text: Even on the road[a], when the fool walks, his heart lacks sense, and he says to everyone that he is a fool.
translation:
  language: ru
  text: Даже на дороге, когда глупец идёт, ему недостаёт разума, и он говорит всем, что он глупец.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и говорит всем: „Он глупец“». Еврейский текст можно понять и так, что глупец выдаёт собственную глупость, и так, что он называет глупцом другого; первое лучше соответствует контексту, где глупость сама себя обнаруживает.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Даже
  rationale: 'Передаёт присоединительное значение с оттенком усиления: глупость обнаруживается даже в обычной публичной обстановке.'
- source_word: בַּדֶּרֶךְ
  choice: по дороге
  rationale: Естественно передаёт пространственный образ движения, выраженный еврейским оборотом.
- source_word: כשהסכל הֹלֵךְ
  choice: когда глупец идёт
  rationale: כ + ש понято как временная связка; причастие הֹלֵךְ передано настоящим временем общего наблюдения.
- source_word: לִבּוֹ חָסֵר
  choice: ему недостаёт разума
  rationale: «Сердце» в этом контексте обозначает разумение и здравое суждение; русский идиоматический оборот передаёт смысл без искусственного выражения «сердце неполно».
- source_word: וְאָמַר לַכֹּל
  choice: и он всем показывает
  rationale: Буквально глагол означает «говорит», однако в контексте речь и поведение глупца фактически возвещают всем его глупость; «показывает» естественно выражает этот подразумеваемый результат.
- source_word: סָכָל הוּא
  choice: что он глупец
  rationale: Сохраняет именную характеристику исходного текста и основное прочтение, при котором местоимение относится к самому глупцу.
theological_decisions:
- issue: К кому относится הוּא («он») в заключительной фразе
  choice: Глупец обнаруживает перед всеми, что он сам глупец.
  alternative: 'Глупец говорит всем о ком-то другом: «Он глупец»; возможно также понимание, что он называет глупцами окружающих.'
  rationale: Синтаксис допускает неоднозначность, но контекст самообнаруживающейся глупости лучше поддерживает первое понимание; альтернативу следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык; афористичный, ясный и достойный регистр. Смысловой идиоматизм לִבּוֹ חָסֵר передан естественно, а подлинная неоднозначность последней фразы сохранена в сноске.
