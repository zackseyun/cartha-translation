base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/020.yaml
  text: Even in your thoughts[a], do not curse a king, and in your bedroom do not curse a rich man, for a bird of the heavens may carry the sound[c][b], and a winged creature may report the matter.
translation:
  language: ru
  text: Даже в мыслях[a] не проклинай царя и в своей спальне[b] не проклинай богача, потому что птица небесная[c] может донести голос, а крылатое существо — передать сказанное.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даже в своём уме».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в покоях своего ложа», то есть в уединении собственной спальни.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «птица небес»; этот образ близок выражению «сорока на хвосте принесла».'
    reason: cultural_note
lexical_decisions:
- source_word: בְּמַדָּעֲךָ
  choice: в мыслях
  rationale: מַדָּע может обозначать знание или мысль; здесь параллель с уединением указывает на внутреннюю, никому не высказанную мысль. Русское «в мыслях» естественно передаёт этот смысл.
- source_word: מֶלֶךְ
  choice: царя
  rationale: В контексте древнеизраильской литературы «царь» — естественный эквивалент מֶלֶךְ. Отсутствие артикля придаёт наставлению общий характер, что по-русски не требует неопределённого артикля.
- source_word: תְּקַלֵּל
  choice: не проклинай
  rationale: Piel глагола קלל означает «проклинать», а также может включать злословие или презрительное поношение. «Не проклинай» прямо сохраняет силу исходного выражения и параллелизм.
- source_word: בְחַדְרֵי מִשְׁכָּבְךָ
  choice: в своей спальне
  rationale: Буквально выражение означает «в комнатах/покоях твоего ложа» и обозначает наиболее уединённое место дома. «В своей спальне» ясно и естественно передаёт эту идею.
- source_word: עָשִׁיר
  choice: богача
  rationale: Субстантивированное прилагательное мужского рода в единственном числе обозначает богатого человека. «Богач» кратко и точно сохраняет форму и несколько предостерегающий тон пословицы.
- source_word: עוֹף הַשָּׁמַיִם
  choice: небесная птица
  rationale: Буквально — «птица небес». «Небесная птица» сохраняет образ и привычно звучит в русском библейском регистре без излишней архаики.
- source_word: יוֹלִיךְ אֶת־הַקּוֹל
  choice: может разнести звук
  rationale: קוֹל буквально означает «голос, звук», а הוליך — «нести, уносить». «Разнести звук» сохраняет конкретный образ распространения услышанного; «может» естественно выражает предостерегающую силу будущей формы в пословице.
- source_word: בַעַל הַכְּנָפַיִם
  choice: крылатое создание
  rationale: Буквально — «обладатель крыльев». «Крылатое создание» естественно передаёт идиоматическое обозначение крылатого существа и сохраняет параллель с птицей.
- source_word: יַגֵּיד דָּבָר
  choice: передать сказанное
  rationale: נגד значит «сообщать, рассказывать», а דָבָר может обозначать слово, высказывание или дело. Здесь речь идёт о тайно произнесённых словах, поэтому «передать сказанное» ясно выражает смысл, не уточняя способ разглашения.
