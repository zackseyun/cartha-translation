base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/016.yaml
  text: Woe to you[a], O land[b], when your king is a youth and your princes eat in the morning.
translation:
  language: ru
  text: Горе тебе, страна, чей царь — юноша[a], а твои вельможи едят по утрам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ребёнок», «отрок». Еврейское слово נַעַר может обозначать ребёнка, юношу или молодого человека; здесь, вероятно, подчёркивается незрелость правителя.'
    reason: lexical_alternative
  - marker: b
    text: То, что вельможи едят утром, вероятно, подразумевает несвоевременные пиры и потворство себе — в противоположность порядку, одобряемому в следующем стихе.
    reason: cultural_note
lexical_decisions:
- source_word: אִי לָךְ
  choice: Горе тебе
  rationale: Устойчиво передаёт обращённое к стране восклицание скорби и предостережения, сохраняя силу еврейского выражения.
- source_word: אֶרֶץ
  choice: страна
  rationale: В данном контексте имеется в виду политическое сообщество или царство, а не земля как почва или весь мир; «страна» естественно звучит в современном русском.
- source_word: שֶׁמַּלְכֵּךְ
  choice: когда твой царь
  rationale: Относительная частица допускает передачу «чей царь», однако обстоятельственное «когда твой царь» естественно выражает условно-временную ситуацию и не меняет смысла.
- source_word: נָעַר
  choice: юноша
  rationale: Слово может обозначать ребёнка, отрока или молодого человека. «Юноша» сохраняет указание на молодость и возможную незрелость, не утверждая буквальное детство.
- source_word: וְשָׂרַיִךְ
  choice: а твои вельможи
  rationale: שָׂרִים — высокопоставленные правители и должностные лица. «Вельможи» передаёт придворно-управленческий статус без узкого значения царских сыновей, возможного у слова «князья».
- source_word: בַּבֹּקֶר יֹאכֵלוּ
  choice: едят по утрам
  rationale: Сохраняется основное значение глагола «есть» без внесения в текст толкования «пируют»; неблагоприятный оттенок несвоевременного излишества выявляется контекстом следующего стиха.
theological_decisions:
- issue: Характеристика молодого царя
  choice: Сохранить буквальное обозначение возраста «юноша» и пояснить возможный акцент на незрелости в сноске.
  alternative: 'Передать истолковательно: «незрелый царь».'
  rationale: Еврейский текст прямо называет царя נָעַר, но не формулирует оценку его способностей отдельным прилагательным; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая конструкция сохраняет торжественный тон мудростной речи. «По утрам» звучит естественно и передаёт обычное или характерное поведение сановников.
