  text: לֵ֤ב חָכָם֙ לִֽ/ימִינ֔/וֹ וְ/לֵ֥ב כְּסִ֖יל לִ/שְׂמֹאלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/002.yaml
  text: A wise man's heart is at his right hand[a], but a fool's heart is at his left.
translation:
  language: ru
  text: Сердце мудреца — справа[a], а сердце глупца — слева.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «направлено вправо… влево». В еврейском тексте правая и левая стороны служат символическими ориентирами и, вероятно, указывают на здравое и ошибочное суждение.'
    reason: Ламед при словах «правая сторона» и «левая сторона» может выражать как положение, так и направление; примечание сохраняет эту смысловую неоднозначность.
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет основной образ древнееврейского текста; здесь «сердце» обозначает внутреннего человека, включая разум, волю и склонности.
- source_word: חָכָם
  choice: мудрый
  rationale: Субстантивированное прилагательное мужского рода передано естественным для русского языка существительным в значении лица; форма сохраняет грамматическое число и род исходного текста.
- source_word: לִימִינוֹ
  choice: с правой стороны
  rationale: Передаёт пространственный образ правой стороны, не сводя его однозначно к рассудительности или нравственной правоте.
- source_word: כְּסִיל
  choice: глупец
  rationale: Обычное обозначение нравственно и рассудочно несостоятельного человека в библейской литературе мудрости; оно точнее по регистру, чем разговорные оскорбительные варианты.
- source_word: לִשְׂמֹאלוֹ
  choice: с левой
  rationale: Сохраняет лаконичный параллелизм и символический контраст правой и левой сторон.
theological_decisions:
- issue: Мужской род участников противопоставления
  choice: «мудрого» и «глупца»
  alternative: «мудрого человека» и «неразумного человека» либо гендерно-нейтральная перефразировка
  rationale: В исходном тексте употреблены субстантивированные формы мужского рода единственного числа. Русская формулировка сохраняет их как типичных представителей, не добавляя утверждения о том, что изречение относится только к мужчинам.
- issue: Символика правой и левой сторон
  choice: Сохранить пространственную метафору без раскрытия её смысла в основном тексте
  alternative: «Мудрый склонен к верному решению, а глупец — к ошибочному»
  rationale: Образ допускает оттенки умелого, благоприятного и верного направления в противоположность неумелому или неблагоприятному. Истолковывающая замена устранила бы поэтическую ёмкость и подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим параллелизмом. Повтор слова «сердце» сохранён ради структуры оригинала; во второй половине опущено повторное «стороны», что естественно по-русски и не меняет смысла.
