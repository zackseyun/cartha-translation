base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/017.yaml
  text: Happy are you[a], O land, when your king is a son of nobles, and your princes eat at the proper time[c][b], for strength and not for drunkenness.
translation:
  language: ru
  text: Счастлива ты[a], земля, чей царь — сын знатных[b], а князья твои едят в надлежащее время — для подкрепления сил, а не ради пьянства[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Блаженна ты, земля»; также возможно: «Благополучна ты».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сын благородных»; возможный более смысловой перевод: «благородного происхождения».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «для силы, а не для питья». По смыслу речь идёт о еде ради поддержания сил, а не ради опьянения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיךְ
  choice: Счастлива ты
  rationale: Формула אַשְׁרֵי выражает достойное зависти благополучие. «Счастлива ты» естественно передаёт обращение к земле и не вносит прямого указания на божественное благословение, которого в контексте нет.
- source_word: אֶרֶץ
  choice: земля
  rationale: В данном политическом контексте слово обозначает страну или государство, но «земля» сохраняет поэтическое прямое обращение и связь с библейским языком.
- source_word: שֶׁמַּלְכֵּךְ
  choice: если царь твой
  rationale: Относительная конструкция буквально допускает «чей царь», однако в русском изречении «если царь твой» естественно выражает описательное условие благополучия страны.
- source_word: בֶּן חוֹרִים
  choice: сын благородных
  rationale: חוֹרִים обозначает знатных или свободнорождённых людей. Формулировка сохраняет образ «сына» и указывает на достойное происхождение, противопоставленное рабу в предыдущем стихе.
- source_word: וְשָׂרַיִךְ
  choice: а князья твои
  rationale: שָׂרִים — князья, сановники или правители. «Князья» сохраняет придворно-политический колорит и понятно современному читателю.
- source_word: בָּעֵת
  choice: в надлежащее время
  rationale: Выражение указывает на уместное время еды, в противоположность утреннему пиру из предыдущего стиха.
- source_word: יֹאכֵלוּ
  choice: едят
  rationale: Сохранено основное значение глагола без необязательного усиления до «пируют».
- source_word: בִּגְבוּרָה
  choice: чтобы подкрепить силы
  rationale: גְּבוּרָה означает силу или крепость. В контексте выражение наиболее естественно понимается как цель еды — поддержание сил, а не потворство излишеству.
- source_word: וְלֹא בַשְּׁתִי
  choice: а не предаваться пьянству
  rationale: Существительное связано с питьём; контраст указывает не на запрет питья как такового, а на неумеренное употребление и опьянение.
