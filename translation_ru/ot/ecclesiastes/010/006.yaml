lexical_decisions:
- source_word: נִתַּן
  choice: поставлена
  rationale: Страдательная форма глагола נתן означает «дана, помещена, поставлена». «Поставлена» сохраняет пассивную конструкцию и не уточняет действующее лицо.
- source_word: הַסֶּכֶל
  choice: глупость
  rationale: Существительное обозначает глупость или безрассудство, а не обязательно конкретного глупца. Выбор сохраняет абстрактное понятие, характерное для противопоставления мудрости и глупости у Екклесиаста.
- source_word: בַּמְּרוֹמִים רַבִּים
  choice: на многих высотах
  rationale: Перевод сохраняет пространственный образ высоты и передаёт רַבִּים («многие»), не сводя метафору однозначно к должностям или общественному положению.
- source_word: וַעֲשִׁירִים
  choice: а богатые
  rationale: Прилагательное во множественном числе употреблено как существительное. Союз «а» естественно выражает контраст между двумя частями стиха.
- source_word: בַּשֵּׁפֶל
  choice: внизу
  rationale: Краткое русское выражение передаёт низкое место или положение и сохраняет пространственное противопоставление «высотам», не добавляя оценки смирения.
- source_word: יֵשֵׁבוּ
  choice: сидят
  rationale: Основное значение ישב — «сидеть»; здесь оно также может подразумевать пребывание или занятие определённого общественного положения. Буквальный выбор сохраняет образность и смысловую открытость.
