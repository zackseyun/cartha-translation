  source_fidelity: В первом полустишии מַסִּיעַ означает прежде всего «передвигающий/сдвигающий» камни, а не обязательно выламывающий их. Во втором עֵצִים — древесина, дрова; «брёвна» излишне конкретизирует. Модальные «может» удачно передают общий характер предупреждения; множественное «ними» соответствует בָּם.
  naturalness: «Передвигает камни» и «колет дрова» — естественные современные литературные русские сочетания. «Может пострадать от них» параллельно и яснее, чем несколько тяжеловесное «может подвергнуться опасности от них».
  terminology: Специальных богословских терминов и имён нет. Перевод сохраняет трудовой образ и не навязывает причинно-нравственного толкования. Английское «quarries stones» отражает один возможный контекст, но еврейский глагол не требует уточнения добычи камня.
