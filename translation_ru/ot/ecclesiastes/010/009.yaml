  text: מַסִּ֣יעַ אֲבָנִ֔ים יֵעָצֵ֖ב בָּ/הֶ֑ם בּוֹקֵ֥עַ עֵצִ֖ים יִסָּ֥כֶן בָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/009.yaml
  text: Whoever quarries stones may be hurt by them, and whoever splits logs may be endangered by them.
translation:
  language: ru
  text: Кто передвигает камни, может пострадать от них, и кто колет дрова, может подвергнуться опасности из-за них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַסִּיעַ אֲבָנִים
  choice: выламывает камни
  rationale: Причастие от נסע здесь обозначает сдвигание или извлечение камней; «выламывает» естественно передаёт тяжёлую работу с камнем, не сужая её непременно до добычи в каменоломне.
- source_word: יֵעָצֵב בָּהֶם
  choice: может пораниться о них
  rationale: Глагол עצב допускает значение боли или причинения вреда; модальная формулировка передаёт общий риск занятия, а местоимение относится к камням.
- source_word: בּוֹקֵעַ עֵצִים
  choice: колет брёвна
  rationale: בקע означает раскалывать, а עצים в данном контексте — куски древесины, предназначенные для раскалывания; «брёвна» сохраняет конкретность образа.
- source_word: יִסָּכֶן בָּם
  choice: может подвергнуться опасности от них
  rationale: Редкая форма допускает понимание опасности или вреда; перевод сохраняет неопределённость конкретного характера угрозы и множественную отсылку к брёвнам.
theological_decisions:
- issue: Связь риска с человеческим трудом
  choice: Сохранить нейтральные утверждения о возможном вреде при опасной работе
  alternative: Истолковать вред как прямое воздаяние за злой умысел предыдущего стиха
  rationale: Сам стих описывает риски двух видов труда и явно не устанавливает нравственную или богословскую причинность.
translation_notes:
  register: Современный литературный русский язык; параллелизм двух полустиший сохранён. Формулировка конкретна и понятна, при этом редкие еврейские глагольные формы не истолкованы чрезмерно узко.
