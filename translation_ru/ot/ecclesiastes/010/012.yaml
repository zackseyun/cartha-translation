  text: Слова из уст мудрого приятны[a], а уста глупца поглощают его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слова из уст мудрого снискивают благосклонность»; еврейское слово חֵן может означать «благосклонность», «привлекательность» или «приятность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִי חָכָם
  choice: Слова из уст мудрого
  rationale: Передаёт конструктивную цепочку естественным современным русским выражением, сохраняя образ уст и субстантивированное единственное число חָכָם.
- source_word: חֵן
  choice: благодатны
  rationale: Предикативное существительное означает «благодать, благосклонность, привлекательность». Прилагательное «благодатны» сохраняет ёмкость образа и не сводит смысл только к приятности речи.
- source_word: וְשִׂפְתוֹת כְּסִיל
  choice: а уста глупца
  rationale: Противительный союз естественно передан как «а»; «уста» сохраняют поэтический параллелизм с первым полустишием и соответствуют возвышенному, но понятному регистру.
- source_word: תְּבַלְּעֶנּוּ
  choice: поглощают его
  rationale: 'Сохраняет яркую метафору глагола בלע: собственная речь глупца губительно обращается против него. Русское множественное число согласуется с «уста».'
theological_decisions:
- issue: Характеристика слов мудрого словом חֵן
  choice: благодатны
  alternative: приносят благосклонность / приятны
  rationale: Контекст допускает как качество речи, исполненной благодати и привлекательности, так и её результат — приобретение благосклонности. Основной текст сохраняет смысловую ёмкость, а примечание отмечает конкретную альтернативу.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим библейским звучанием. Параллельные образы «уст» сохранены; архаические синтаксические конструкции исключены.
