  register: Современный литературный русский язык; сохранены лаконичность притчи, чувственный образ порчи благовонного масла и неоднозначность сравнительного יָקָר. Союз «так и» делает подразумеваемое сопоставление явным, не добавляя отдельного богословского толкования.
