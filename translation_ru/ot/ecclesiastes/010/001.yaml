base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/001.yaml
  text: Dead flies make a perfumer’s oil stink and bubble up[b][a]; so a little folly outweighs wisdom and honor.
translation:
  language: ru
  text: Мёртвые мухи делают благовонное масло зловонным и заставляют его пузыриться[a]; так и небольшая глупость перевешивает мудрость и почёт[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставляют его выделяться (изливаться)»; возможно также более общее: «портят». Еврейский глагол указывает на выделение или образование пузырьков в испорченном масле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «так небольшая глупость ценнее мудрости и почёта». Еврейское слово может обозначать ценность, вес или значимость; здесь сравнение, вероятно, подчёркивает, что небольшая глупость способна иметь большее влияние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּבֵי מָוֶת
  choice: мёртвые мухи
  rationale: Конструкция буквально означает «мухи смерти», но в данном образе естественнее понимать её как мух, погибших в масле и вызывающих его порчу.
- source_word: יַבְאִישׁ
  choice: придают зловоние
  rationale: Каузативная форма глагола באש означает «заставлять дурно пахнуть»; выбранная формулировка передаёт результат порчи масла и звучит достойно и естественно по-русски.
- source_word: יַבִּיעַ
  choice: вызывают брожение
  rationale: Глагол может описывать извержение, выделение или образование пузырьков. В контексте испорченного масла «вызывают брожение» сохраняет образ активной порчи, не сводя значение лишь к общему «портят».
- source_word: שֶׁמֶן רוֹקֵחַ
  choice: благовонное масло
  rationale: Буквально это «масло составителя благовоний». Русское «благовонное масло» ясно передаёт назначение и характер приготовленной ароматической смеси без архаичного обозначения ремесленника.
- source_word: יָקָר
  choice: перевешивает
  rationale: Слово обычно выражает ценность, весомость или значимость. В сравнительной конструкции «перевешивает» естественно передаёт мысль о несоразмерно большом влиянии малой глупости, при этом альтернативное понимание отмечено в сноске.
- source_word: מֵחָכְמָה מִכָּבוֹד
  choice: мудрость и почёт
  rationale: Обе предложные группы понимаются как совместный объект сравнения. В человеческом общественном контексте כָּבוֹד уместно передать словом «почёт».
- source_word: סִכְלוּת מְעָט
  choice: малая глупость
  rationale: 'Краткий перевод существительного с определением сохраняет афористичность и парадокс: даже небольшая глупость может иметь чрезмерные последствия.'
