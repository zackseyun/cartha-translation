id: ECC.8.17
reference: Ecclesiastes 8:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/רָאִיתִי֮ אֶת כָּל מַעֲשֵׂ֣ה הָ/אֱלֹהִים֒ כִּי֩ לֹ֨א יוּכַ֜ל הָ/אָדָ֗ם לִ/מְצוֹא֙ אֶת הַֽ/מַּעֲשֶׂה֙ אֲשֶׁ֣ר נַעֲשָׂ֣ה תַֽחַת הַ/שֶּׁ֔מֶשׁ בְּ֠/שֶׁ/ל אֲשֶׁ֨ר יַעֲמֹ֧ל הָ/אָדָ֛ם לְ/בַקֵּ֖שׁ וְ/לֹ֣א יִמְצָ֑א וְ/גַ֨ם אִם יֹאמַ֤ר הֶֽ/חָכָם֙ לָ/דַ֔עַת לֹ֥א יוּכַ֖ל לִ/מְצֹֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/017.yaml
  text: 'Then I saw all the work of God: that man cannot find out the work that is done under the sun[a]. However much man labors to seek it out, he will not find it; and even if the wise man says he knows[b], he cannot find it out.'
translation:
  language: ru
  text: 'И увидел я все дела Бога: человек[a] не может постичь того, что совершается под солнцем. Сколько бы человек ни трудился, стараясь исследовать это, он не постигнет; и даже если мудрец скажет, что знает[b], он не сможет постичь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человек вообще, всё человечество.
    reason: Пояснение родового значения еврейского единственного числа.
  - marker: b
    text: 'Или: «станет утверждать, что знает».'
    reason: Еврейская фраза допускает оттенок притязания на знание.
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: И увидел я
  rationale: Сохраняет значение наблюдения и продолжение рассуждения; обратный порядок слов придаёт фразе достоинство, оставаясь понятным в современном русском.
- source_word: כָּל מַעֲשֵׂה הָאֱלֹהִים
  choice: все дела Бога
  rationale: מַעֲשֶׂה обозначает дело, действие или деятельность; русское множественное число естественно передаёт собирательное «всё совершаемое Богом».
- source_word: הָאָדָם
  choice: человек
  rationale: Русское «человек» естественно сохраняет родовое единственное число и обозначает здесь человечество вообще, а не конкретного мужчину.
- source_word: לִמְצוֹא
  choice: постичь
  rationale: В контексте напряжённых поисков речь идёт не о физическом обнаружении, а о достижении понимания; «постичь» точно передаёт эту интеллектуальную направленность.
- source_word: הַמַּעֲשֶׂה אֲשֶׁר נַעֲשָׂה תַחַת הַשֶּׁמֶשׁ
  choice: того, что совершается под солнцем
  rationale: Передаёт действие пассивной формы נַעֲשָׂה и сохраняет ключевой для Екклесиаста образ «под солнцем», не создавая тяжеловесного повтора слова «дело».
- source_word: בְּשֶׁל אֲשֶׁר יַעֲמֹל
  choice: Сколько бы человек ни трудился
  rationale: Контекстуально выражает безрезультатность усилий любой степени; «трудился» сохраняет оттенок напряжённого труда у עמל.
- source_word: לְבַקֵּשׁ
  choice: стараясь исследовать это
  rationale: Передаёт целенаправленный поиск и показывает, что предметом исследования остаются происходящие под солнцем дела.
- source_word: וְגַם אִם יֹאמַר הֶחָכָם לָדַעַת
  choice: и даже если мудрец скажет, что знает
  rationale: 'Сохраняет эллиптичность и неоднозначность фразы: это может быть простое высказывание о знании или притязание на него.'
- source_word: לֹא יוּכַל לִמְצֹא
  choice: он не сможет постичь
  rationale: Сохраняет заключительный акцент на человеческой неспособности и повторяет смысл ранее употреблённого לִמְצוֹא.
theological_decisions:
- issue: Родовое значение הָאָדָם в утверждении о пределах человеческого познания
  choice: человек
  alternative: человечество
  rationale: «Человек» сохраняет грамматическое единственное число оригинала и в русском естественно имеет обобщающее значение. Стих говорит об ограниченности всех людей, а не только мужчин.
- issue: Характер знания, приписываемого мудрецом самому себе
  choice: скажет, что знает
  alternative: станет утверждать, что знает
  rationale: Более прямой вариант не решает заранее, является ли высказывание мудреца нейтральным сообщением или самоуверенным притязанием; возможный оттенок притязания вынесен в примечание.
translation_notes:
  register: Современный литературный русский с достоинством библейской мудростной речи. Формула «под солнцем» сохранена как сквозной образ книги; синтаксис сделан ясным без устранения напряжения между человеческим поиском и невозможностью полного постижения Божьих дел.
