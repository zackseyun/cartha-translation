base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/015.yaml
  text: So I commended joy[a], because there is nothing better for man under the sun than to eat and to drink and to rejoice[c][b]; and this will accompany him in his labor during the days of his life that God has given him under the sun.
translation:
  language: ru
  text: И похвалил я радость[a], потому что нет ничего лучше для человека[b] под солнцем, чем есть, пить и радоваться; и это будет сопровождать его в его труде[c] на протяжении всех дней его жизни, которые Бог дал ему под солнцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восхвалил радость».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «нет блага для человека, кроме как есть, пить и радоваться».'
    reason: ambiguity
  - marker: c
    text: 'Или: «это пойдёт с ним в его труде».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּחְתִּי
  choice: И похвалил я
  rationale: Порядок слов сохраняет личное, подчёркнутое אֲנִי и передаёт piel שׁבח как положительную оценку радости; «похвалил» естественно и не обязательно имеет культовый оттенок.
- source_word: הַשִּׂמְחָה
  choice: радость
  rationale: Широкий и естественный русский эквивалент, соответствующий повторяющейся в книге теме радости как дара Бога.
- source_word: אֵין טוֹב לָאָדָם
  choice: нет ничего лучше для человека
  rationale: Передаёт вероятный сравнительный смысл еврейской идиомы, не прибегая к неестественному буквальному «нет добра человеку».
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: под солнцем
  rationale: Сохраняет ключевой рефрен Екклесиаста и его образ жизни в земном порядке.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׂמוֹחַ
  choice: есть, пить и радоваться
  rationale: Естественно воспроизводит последовательность трёх инфинитивов и сохраняет глагольный характер последнего элемента.
- source_word: וְהוּא יִלְוֶנּוּ
  choice: и она будет сопутствовать ему
  rationale: Местоимение мужского рода в еврейском допускает отнесение к содержанию сказанного, однако по смыслу наиболее вероятно возвращается к радости; русский язык требует женского согласования с «радость».
- source_word: בַעֲמָלוֹ
  choice: в его труде
  rationale: «Труд» передаёт עָמָל достаточно широко; возможный оттенок тяготы отмечен в сноске.
- source_word: יְמֵי חַיָּיו
  choice: во все дни его жизни
  rationale: Русское «во все дни» естественно выражает длительность сопровождения на протяжении данного Богом срока жизни.
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: которые Бог дал ему
  rationale: Относительное местоимение согласовано с ближайшим «дни»; формулировка сохраняет представление о сроке жизни как данном Богом.
theological_decisions:
- issue: Родовое значение לָאָדָם
  choice: для человека
  alternative: для людей / человеку
  rationale: אָדָם здесь обозначает человека вообще, а не только мужчину; русское «человек» сохраняет родовое единственное число без сужения смысла.
- issue: Субъект וְהוּא יִלְוֶנּוּ
  choice: радость будет сопутствовать человеку
  alternative: это будет сопутствовать ему / она пойдёт с ним
  rationale: Контекст поддерживает отнесение местоимения к радости либо ко всему описанному наслаждению. Основной текст выбирает грамматически и контекстуально связное «она», а сноска сохраняет широту возможного понимания.
- issue: Смысл אֵין טוֹב לָאָדָם
  choice: нет ничего лучше для человека
  alternative: нет блага для человека, кроме как
  rationale: Сравнительное прочтение хорошо соответствует конструкции с כִּי אִם и контексту, но буквальная исключительная формулировка остаётся возможной и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Инверсия «похвалил я» сохраняет авторское ударение без архаизации; ключевой рефрен «под солнцем» оставлен буквально. Все сноски отмечены в основном тексте.
