revisions:
- from: И похвалил я радость[a], потому что нет ничего лучше для человека[b] под солнцем, чем есть, пить и радоваться; и она будет сопутствовать ему в его труде[c] во все дни его жизни, которые Бог дал ему под солнцем.
  to: И похвалил я радость[a], потому что нет ничего лучше для человека[b] под солнцем, чем есть, пить и радоваться; и это будет сопровождать его в его труде[c] на протяжении всех дней его жизни, которые Бог дал ему под солнцем.
  rationale: Замена «она» на «это» сохраняет намеренную или по меньшей мере реальную неоднозначность мужского еврейского местоимения וְהוּא и согласуется с английским контрольным решением «this». Уточнены сноски, чтобы они отражали лексические альтернативы исходного текста, не меняя смысла стиха. Остальная формулировка сохранена, поскольку она точна и естественна для современного литературного русского.
