language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֶת כָּל זֶ֤ה רָאִ֨יתִי֙ וְ/נָת֣וֹן אֶת לִבִּ֔/י לְ/כָֽל מַעֲשֶׂ֔ה אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ עֵ֗ת אֲשֶׁ֨ר שָׁלַ֧ט הָ/אָדָ֛ם בְּ/אָדָ֖ם לְ/רַ֥ע לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/009.yaml
  text: All this I have seen[a], while applying my heart to every deed that is done under the sun, at a time when man has ruled over man to his harm.
translation:
  language: ru
  text: Всё это я видел, обращая сердце моё ко всякому делу, которое совершается под солнцем, в то время, когда человек властвует над человеком ему во вред.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда один человек властвует над другим ему во вред». Возможно также понимание: «себе во вред».'
    reason: Сохраняются обобщённый смысл повторённого אָדָם и неоднозначная отсылка местоимения לוֹ.
lexical_decisions:
- source_word: רָאִיתִי
  choice: я видел
  rationale: Перфект передаёт итог накопленного личного наблюдения; русское прошедшее время естественно выражает это в размышлении Екклесиаста.
- source_word: וְנָתוֹן אֶת־לִבִּי
  choice: обращая сердце моё
  rationale: Сохраняется еврейский образ сердца как средоточия мысли и внимания, при этом оборот остаётся понятным на современном литературном русском.
- source_word: מַעֲשֶׂה ... נַעֲשָׂה
  choice: делу, которое совершается
  rationale: Передаёт широкий смысл человеческих дел и сохраняет пассивную форму исходного текста.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохраняется характерная и повторяющаяся формула книги Екклесиаста.
- source_word: עֵת אֲשֶׁר
  choice: в то время, когда
  rationale: Явно передаёт временное существительное עֵת и вводимое им обстоятельство.
- source_word: שָׁלַט
  choice: властвует
  rationale: Глагол выражает осуществление власти или господства; настоящее время по-русски естественно звучит в общем наблюдении, включённом в рассказ о виденном.
- source_word: הָאָדָם בְּאָדָם
  choice: человек властвует над человеком
  rationale: Сохраняются единственное число, симметрия и обобщённо-человеческий смысл исходной формулы.
- source_word: לְרַע לוֹ
  choice: ему во вред
  rationale: 'Кратко передаёт результат власти и сохраняет неоднозначность местоимения: вред может относиться к подвластному человеку либо, менее вероятно, к властвующему.'
theological_decisions:
- issue: К кому относится местоимение לוֹ в выражении לְרַע לוֹ
  choice: ему во вред
  alternative: себе во вред
  rationale: Нерефлексивное «ему» не навязывает отнесение вреда к властвующему и сохраняет подлинную синтаксическую неоднозначность; контекст допускает прежде всего вред тому, над кем властвуют.
- issue: Обобщённое употребление אָדָם
  choice: человек ... человеком
  alternative: один человек ... другим
  rationale: Русское «человек» естественно охватывает любого человека и одновременно воспроизводит повтор и афористическую форму еврейского текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «сердце моё» поддерживает достоинство стиля, не делая текст архаичным; ключевая неоднозначность последнего местоимения не устранена.
