reference: Ecclesiastes 8:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֲשֶׁ֣ר חֹטֶ֗א עֹשֶׂ֥ה רָ֛ע מְאַ֖ת וּ/מַאֲרִ֣יךְ ל֑/וֹ כִּ֚י גַּם יוֹדֵ֣עַ אָ֔נִי אֲשֶׁ֤ר יִהְיֶה טּוֹב֙ לְ/יִרְאֵ֣י הָ/אֱלֹהִ֔ים אֲשֶׁ֥ר יִֽירְא֖וּ מִ/לְּ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/012.yaml
  text: Though a sinner does evil a hundred times and prolongs his life[a], yet I also know that it will be well for those who fear God[b], who fear before him.
translation:
  language: ru
  text: Хотя грешник сто раз делает зло и продлевает себе жизнь[a], всё же я знаю и то, что благо будет боящимся Бога[b], тем, кто пребывает в страхе перед Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и долго живёт».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «боящимся Бога будет хорошо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Хотя
  rationale: В данном контексте частица вводит уступительное придаточное; «хотя» естественно передаёт его связь с последующим утверждением.
- source_word: חֹטֶא
  choice: грешник
  rationale: Субстантивированное причастие обозначает человека, для которого характерно совершать грех; единственное число сохранено.
- source_word: עֹשֶׂה רָע
  choice: делает зло
  rationale: Прямой и естественный перевод, сохраняющий конкретную глагольную конструкцию оригинала.
- source_word: מְאַת
  choice: сто раз
  rationale: Числительное употреблено наречно и указывает на многократное совершение зла; числовое значение сохранено.
- source_word: וּמַאֲרִיךְ לוֹ
  choice: и продлевает себе жизнь
  rationale: Буквально выражение говорит о «продлении для себя»; добавление «жизнь» ясно передаёт подразумеваемый смысл и сохраняет активную форму глагола.
- source_word: כִּי גַּם יוֹדֵעַ אָנִי
  choice: всё же я знаю и то
  rationale: Формулировка передаёт контраст с уступительным придаточным, а также сохраняет добавочно-усилительное значение גַּם.
- source_word: אֲשֶׁר יִהְיֶה טּוֹב
  choice: что благо будет
  rationale: Сохраняет существительное/субстантивированное значение «благо, добро» и будущую направленность утверждения, не уточняя, в чём именно оно состоит.
- source_word: לְיִרְאֵי הָאֱלֹהִים
  choice: боящимся Бога
  rationale: Причастная конструкция естественно передана по-русски и сохраняет библейское понятие страха Божьего.
- source_word: אֲשֶׁר יִירְאוּ מִלְּפָנָיו
  choice: которые благоговеют перед Ним
  rationale: «Благоговеют» в современном русском передаёт почтительный страх, а «перед Ним» сохраняет пространственно-реляционный оттенок מִלְּפָנָיו. Повтор корня передан смысловым повтором, без неестественного «боятся перед Ним».
theological_decisions:
- issue: Характер страха в выражении יִירְאוּ מִלְּפָנָיו
  choice: благоговеют перед Ним
  alternative: боятся перед Ним / пребывают в страхе перед Ним
  rationale: Контекст говорит о почтительном страхе перед Богом. «Благоговеют» не сводит его к испугу и при этом не вводит конфессионально специфического толкования.
- issue: Референт местоименного суффикса в מִלְּפָנָיו
  choice: Ним — Богом
  alternative: явно повторить «перед Богом»
  rationale: Ближайший и естественный антецедент — Бог; местоимение сохраняет связность еврейской фразы без ненужного повтора.
- issue: Смысл יִהְיֶה טּוֹב
  choice: благо будет боящимся Бога
  alternative: боящимся Бога будет хорошо
  rationale: 'Выбранный вариант сохраняет некоторую неоднозначность: речь может идти как о благополучном исходе, так и о даруемом добре, не определяя его характер.'
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим библейской мудрой словесности. Синтаксис остаётся близким к еврейскому ходу мысли, но не звучит архаично. Заглавная буква в «Ним» служит ясности референции в принятой русской издательской традиции.
