  terminology: «Грешник», «зло», «боящиеся Бога» и «благо» уместны. Следует сохранить повтор «бояться / страх», не подменяя его «благоговением», поскольку последнее хотя и близко по смыслу, но не воспроизводит повтор лексемы оригинала.
