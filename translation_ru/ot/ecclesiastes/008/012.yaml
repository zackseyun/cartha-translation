  source_fidelity: В целом переданы уступительная конструкция, многократность зла, продление жизни, уверенное знание говорящего и благо для боящихся Бога. Однако в конце стиха еврейский текст намеренно повторяет корень ירא («бояться»), тогда как «благоговеют» заменяет его другим словом. Это ослабляет заметный формальный и смысловой повтор оригинала.
