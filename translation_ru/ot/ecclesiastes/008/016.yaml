  text: כַּ/אֲשֶׁ֨ר נָתַ֤תִּי אֶת לִבִּ/י֙ לָ/דַ֣עַת חָכְמָ֔ה וְ/לִ/רְאוֹת֙ אֶת הָ֣/עִנְיָ֔ן אֲשֶׁ֥ר נַעֲשָׂ֖ה עַל הָ/אָ֑רֶץ כִּ֣י גַ֤ם בַּ/יּוֹם֙ וּ/בַ/לַּ֔יְלָה שֵׁנָ֕ה בְּ/עֵינָ֖י/ו אֵינֶ֥/נּוּ רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/016.yaml
  text: When I applied my heart to know wisdom and to observe the activity that is done on the earth—for even by day and by night his eyes do not see sleep—[a]
translation:
  language: ru
  text: Когда я обратил своё сердце к познанию мудрости и рассмотрению дела, совершаемого на земле, — ведь и днём и ночью его глаза сна не видят[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «он не спит ни днём ни ночью». Буквально: «сон его глаза не видят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Когда
  rationale: Передаёт временное обстоятельство, при котором говорящий приступил к исследованию; естественно звучит по-русски.
- source_word: נָתַתִּי אֶת־לִבִּי
  choice: я устремил своё сердце
  rationale: Сохраняет древнееврейский образ сердца как средоточия размышления и выражает сознательную направленность.
- source_word: לָדַעַת חָכְמָה
  choice: к тому, чтобы познать мудрость
  rationale: Близко передаёт инфинитивную конструкцию и сохраняет значение ידע «знать, познавать».
- source_word: וְלִרְאוֹת
  choice: и увидеть
  rationale: Сохраняет основной зрительный образ ראה; в контексте слово подразумевает внимательное наблюдение.
- source_word: הָעִנְיָן
  choice: занятие
  rationale: В Экклезиасте существительное обозначает дело или деятельность, которой заняты люди; «занятие» естественно и не сужает смысл до торговли.
- source_word: אֲשֶׁר נַעֲשָׂה עַל־הָאָרֶץ
  choice: которым заняты на земле
  rationale: Естественно передаёт безлично-пассивную конструкцию и широкий охват земной человеческой деятельности.
- source_word: כִּי גַם
  choice: ведь и
  rationale: «Ведь» передаёт пояснительную силу כִּי, а «и» — добавочное усиление גַם.
- source_word: בַּיּוֹם וּבַלַּיְלָה
  choice: днём и ночью
  rationale: Современное русское обозначение непрерывности, соответствующее древнееврейскому обороту.
- source_word: שֵׁנָה בְּעֵינָיו אֵינֶנּוּ רֹאֶה
  choice: его глаза не видят сна
  rationale: Сохраняет необычный и выразительный образ масоретского текста, а также местоимение третьего лица мужского рода.
theological_decisions:
- issue: К кому относится местоименный суффикс 3-го лица мужского рода в בְּעֵינָיו
  choice: Сохранить форму «его глаза», не уточняя референта
  alternative: Истолковать как относящееся к самому говорящему («мои глаза») либо обобщённо передать «человек не спит»
  rationale: Масоретский текст содержит суффикс 3-го лица, а его референт не вполне явен. Сохранение этой формы не исправляет текст предположительно и не устраняет подлинную неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с сохранением возвышенного образа сердца и намеренно необычного образа глаз, не видящих сна. Конечное тире отражает незавершённость синтаксиса: мысль продолжается в следующем стихе.'
