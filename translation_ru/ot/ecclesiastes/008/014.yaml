  text: יֶשׁ הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל הָ/אָרֶץ֒ אֲשֶׁ֣ר יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר מַגִּ֤יעַ אֲלֵ/הֶם֙ כְּ/מַעֲשֵׂ֣ה הָ/רְשָׁעִ֔ים וְ/יֵ֣שׁ רְשָׁעִ֔ים שֶׁ/מַּגִּ֥יעַ אֲלֵ/הֶ֖ם כְּ/מַעֲשֵׂ֣ה הַ/צַּדִּיקִ֑ים אָמַ֕רְתִּי שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/014.yaml
  text: 'There is a vanity that is done on the earth: there are righteous people to whom it happens according to the deeds of the wicked[a], and there are wicked people to whom it happens according to the deeds of the righteous. I said that this too is vanity.'
translation:
  language: ru
  text: 'Есть на земле такая суета: есть праведники, которых постигает участь, соответствующая делам нечестивых, и есть нечестивые, которых постигает участь, соответствующая делам праведников. Я сказал: и это — суета.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тщета»; буквальный образ слова — «пар, дыхание». Еврейское הֶבֶל — ключевое слово книги, обозначающее нечто мимолётное, неуловимое или мучительно несообразное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: суета
  rationale: Традиционный и узнаваемый ключевой термин Екклесиаста; здесь он выражает мимолётность, неуловимость и мучительное несоответствие между нравственным поведением и участью человека. Сноска сохраняет более конкретный образ пара и смысл тщетности.
- source_word: נַעֲשָׂה עַל הָאָרֶץ
  choice: бывает на земле
  rationale: В данном контексте естественно передаёт происходящее в человеческом мире, не сужая הָאָרֶץ до отдельной страны и не подменяя его формулой «под солнцем».
- source_word: צַדִּיקִים
  choice: праведники
  rationale: Ясное и устойчивое обозначение нравственной категории в русской библейской речи.
- source_word: מַגִּיעַ אֲלֵהֶם
  choice: им достаётся
  rationale: Передаёт то, что выпадает человеку как участь или результат, и звучит естественно по-русски.
- source_word: כְּמַעֲשֵׂה
  choice: то, чего заслуживают дела
  rationale: Контекст указывает не просто на сходство с поступками, а на перевёрнутое соответствие между поступками и ожидаемой участью. Формулировка делает подразумеваемый результат понятным, не уточняя его как награду или наказание.
- source_word: הָרְשָׁעִים
  choice: нечестивые
  rationale: Сохраняет нравственный контраст с «праведниками» и соответствует достоинству русской библейской прозы.
- source_word: אָמַרְתִּי
  choice: я сказал
  rationale: Прямо сохраняет простую форму еврейского глагола, не усиливая её до «решил» или «заключил».
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: и это — суета
  rationale: Сохраняет повтор ключевого слова и краткую рефренную интонацию оригинала.
theological_decisions:
- issue: Смысл הֶבֶל в нравственно перевёрнутой действительности
  choice: суета
  alternative: тщета; пар; бессмыслица
  rationale: «Суета» сохраняет сквозной термин книги и допускает одновременно образы мимолётности, неуловимости и мучительной несообразности. «Бессмыслица» слишком однозначно утверждала бы отсутствие смысла, тогда как еврейское слово шире.
- issue: Связь участи с делами праведных и нечестивых
  choice: «то, чего заслуживают дела» без обозначения конкретной награды или кары
  alternative: «по делам»; «как бывает за дела»
  rationale: Фраза показывает ожидаемое нравственное соответствие, которое оказывается перевёрнутым, но текст не называет ни механизм воздаяния, ни конкретные последствия. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством библейской мудрой прозы. Параллелизм двух частей сохранён; синтаксис сделан естественным для обычного читателя. Маркер сноски поставлен при заключительном повторе ключевого слова и относится к обоим случаям его употребления.
