revisions:
- from: 'Бывает на земле такая суета: праведникам достаётся то, чего заслуживают дела нечестивых, а нечестивым — то, чего заслуживают дела праведников. Я сказал: и это — суета.[a]'
  to: 'Есть на земле такая суета: есть праведники, которых постигает участь, соответствующая делам нечестивых, и есть нечестивые, которых постигает участь, соответствующая делам праведников. Я сказал: и это — суета.[a]'
  rationale: Исправлен только центральный оборот, чтобы устранить неестественное и семантически смещённое «заслуживают дела». «Постигает участь, соответствующая делам…» передаёт מַגִּיעַ אֲלֵהֶם כְּמַעֲשֵׂה как приходящую к человеку участь, сообразную чужим делам, не называя её наградой либо наказанием. «Есть на земле» несколько ближе к יֵשׁ, чем «бывает на земле», при сохранении естественности.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:28:11Z'
