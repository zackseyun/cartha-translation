id: ECC.8.6
reference: Ecclesiastes 8:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י לְ/כָל חֵ֔פֶץ יֵ֖שׁ עֵ֣ת וּ/מִשְׁפָּ֑ט כִּֽי רָעַ֥ת הָ/אָדָ֖ם רַבָּ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/006.yaml
  text: For every matter there is a time and a judgment[b][a], because the evil of man weighs heavily upon him.
translation:
  language: ru
  text: Ведь для всякого дела есть своё время и суд[a], потому что бедствие человека тяжело лежит на нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правосудие», «решение» или «надлежащий порядок».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зло человека велико над ним»; также возможно: «несчастье человека тяжким бременем лежит на нём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Первое כִּי поясняет мысль предыдущего стиха; «ведь» естественно передаёт эту связующую функцию.
- source_word: לְכָל חֵפֶץ
  choice: для всякого дела
  rationale: חֵפֶץ здесь, рядом с עֵת, обозначает дело, занятие или замысел; «дело» сохраняет требуемую широту и перекликается с Екклесиастом 3:1.
- source_word: יֵשׁ עֵת
  choice: есть своё время
  rationale: Экзистенциальная конструкция передана естественно по-русски; «своё» выражает соотнесённость времени с каждым делом, не вводя идеи, отсутствующей в контексте.
- source_word: וּמִשְׁפָּט
  choice: и суд
  rationale: מִשְׁפָּט может означать суд, судебное решение, правосудие или надлежащий порядок. «Суд» сохраняет основной смысл и присущую выражению неоднозначность.
- source_word: כִּי
  choice: потому что
  rationale: Второе כִּי вводит причину и естественно передаётся причинным союзом.
- source_word: רָעַת הָאָדָם
  choice: бедствие человека
  rationale: רָעָה в данном контексте может обозначать зло, бедствие, несчастье или тяготу. Сочетание с רַבָּה עָלָיו скорее указывает на обрушившееся на человека бедствие, однако вариант «зло» отмечен в сноске.
- source_word: רַבָּה עָלָיו
  choice: тяжело лежит на нём
  rationale: Формально выражение означает «велико/много над ним»; русский оборот передаёт подразумеваемую тяжесть бремени и сохраняет образ лежащей на человеке тяготы.
theological_decisions:
- issue: Значение מִשְׁפָּט
  choice: суд
  alternative: правосудие; надлежащий порядок; решение
  rationale: Контекст не позволяет окончательно определить, идёт ли речь о судебном решении, правосудии или должном порядке действий; основной текст сохраняет ёмкое слово «суд», а сноска — альтернативы.
- issue: Значение רָעָה применительно к человеку
  choice: бедствие человека
  alternative: зло человека; несчастье человека
  rationale: В книге Екклесиаста רָעָה часто обозначает тяжёлое зло или бедствие. Здесь синтаксис подчёркивает его бремя для человека, но нравственный смысл «зло» остаётся возможным и потому не устраняется.
- issue: Обобщающее הָאָדָם
  choice: человека
  alternative: людей; человечества
  rationale: Единственное число в еврейском имеет обобщающий смысл. Русское «человека» сохраняет как грамматическую форму, так и универсальную применимость высказывания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка сохраняет причинную структуру двух כִּי и смысловую неоднозначность слов מִשְׁפָּט и רָעָה; все сноски обозначены в основном тексте.
