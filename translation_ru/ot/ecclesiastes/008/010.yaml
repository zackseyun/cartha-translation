base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/010.yaml
  text: And so I saw the wicked buried[a]; they had come and gone from the holy place, and they were forgotten in the city where they had done so[c][b]. This too is vanity.
translation:
  language: ru
  text: И тогда я увидел, как хоронили нечестивцев. Они приходили, а затем уходили из святого места[b], и в городе, где они так поступали, о них забывали[a]. И это тоже — суета[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Согласно некоторым древним переводам и иному пониманию еврейского текста, возможно: «а в городе, где они так поступали, их прославляли».'
    reason: textual_variant
  - marker: b
    text: «Святое место» может означать храмовую территорию или другое место, считавшееся священным.
    reason: cultural_note
  - marker: c
    text: Еврейское слово «хевел», часто переводимое как «суета», буквально означает «дыхание», «дуновение», также «пар»; оно передаёт мысль о чём-то мимолётном или неуловимом.
    reason: lexical_alternative
