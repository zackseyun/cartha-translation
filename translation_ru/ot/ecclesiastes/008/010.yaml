- source_word: גַּם זֶה הָבֶל
  choice: И это тоже — суета
  rationale: «Суета» — укоренившийся и уместный русский эквивалент рефрена הבל; сноска сохраняет конкретный образ пара и оттенки мимолётности и неуловимости.
theological_decisions:
- issue: Связь нечестивых со святым местом
  choice: Оставить без уточнения, зачем они туда приходили и что именно там делали
  alternative: Истолковать фразу как указание на лицемерное участие нечестивых в богослужении
  rationale: Еврейский текст сообщает о движении относительно святого места, но не называет намерения или конкретного проступка; перевод не должен разрешать эту неоднозначность.
- issue: Судьба нечестивых в памяти города
  choice: «их забывали» согласно масоретскому тексту
  alternative: «их прославляли» по свидетельству некоторых древних переводов и иному пониманию текста
  rationale: Основной текст следует WLC, а значимый древний вариант сохраняется в сноске без догматического предпочтения.
