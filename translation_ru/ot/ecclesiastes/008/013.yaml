- from: А нечестивому не будет блага, и он не продлит своих дней, подобных тени,[a] потому что не боится Бога.[b]
  to: А нечестивому не будет блага, и дней своих он не продлит, что подобны тени, потому что не боится Бога.[a]
  rationale: Исправлена вводящая в заблуждение сноска о сравнении «как тень». Основной текст немного перестроен для более естественного русского синтаксиса, сохраняя связь «дней» с образом тени и причинное значение אֲשֶׁר. Единственная сноска оставлена при выражении «не боится Бога», где буквальный образ в русском основном тексте был бы менее естественен.
