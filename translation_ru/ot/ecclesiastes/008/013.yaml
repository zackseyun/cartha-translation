  terminology: «Нечестивый» уместно передаёт רשע в книге Екклесиаста. «Боится Бога» сохраняет прямое значение ירא и не навязывает более узкое толкование («благоговеет»). В сноске следует говорить «перед лицом Бога», а не «пред лицом Бога», если ориентироваться на современную литературную норму; основной текст предпочтительно оставлять кратким.
