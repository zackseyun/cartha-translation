  source_fidelity: 'Основной смысл передан верно: нечестивому не будет благополучия, он не продлит дней своих; основание названо как отсутствие страха перед Богом. Сравнение «как тень» в еврейском тексте синтаксически компактно и допускает нюансы присоединения, однако предложенная альтернативная формулировка в сноске a («он не продлит своих дней, словно тень») по-русски создаёт иной, неясный образ, будто нечестивец сам уподоблен тени в действии.'
