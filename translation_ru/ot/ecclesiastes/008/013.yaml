base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/013.yaml
  text: But it will not go well for the wicked[a], and he will not prolong his days like a shadow[b], because he does not fear before God.
translation:
  language: ru
  text: А нечестивому не будет блага, и дней своих он не продлит, что подобны тени, потому что не боится Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не боится перед лицом Бога»; то есть не живёт в страхе перед Богом, в Его присутствии.'
    reason: Еврейское מִלִּפְנֵי אֱלֹהִים буквально содержит образ пребывания перед лицом Бога. Сноска поясняет образ, не подменяя основное значение.
lexical_decisions:
- source_word: וְטוֹב לֹא יִהְיֶה לָרָשָׁע
  choice: А нечестивому не будет блага
  rationale: Сочетание טוֹב с היה говорит о благополучии или благоприятном исходе. «Не будет блага» сохраняет предметность еврейского выражения и звучит естественно в литературном русском; союз «а» передаёт противопоставление предыдущему стиху.
- source_word: וְלֹא יַאֲרִיךְ יָמִים
  choice: и он не продлит своих дней
  rationale: Порода hифиль глагола ארך с יָמִים буквально означает «продлить дни». Местоимение «своих» естественно восполняет подразумеваемую принадлежность дней.
- source_word: כַּצֵּל
  choice: дней, подобных тени
  rationale: Образ тени сохранён как указание на краткость и преходящий характер жизни. Основной текст относит сравнение к дням, но синтаксически возможно и другое присоединение, отмеченное в сноске.
- source_word: אֲשֶׁר
  choice: потому что
  rationale: В данном контексте אֲשֶׁר естественно понимать как вводящее причину участи нечестивого, а не как относительное местоимение, относящееся к тени.
- source_word: אֵינֶנּוּ יָרֵא מִלִּפְנֵי אֱלֹהִים
  choice: не боится Бога
  rationale: Выражение передаёт отсутствие у нечестивого постоянного страха и почтения перед Богом. Краткая русская формулировка естественна; более буквальный пространственный оборот приведён в сноске.
theological_decisions:
- issue: Характер воздаяния нечестивому в литературе мудрости
  choice: 'Сохранено безоговорочное общее утверждение стиха: нечестивому не будет блага и он не продлит своих дней.'
  alternative: Понимать слова либо как механическую гарантию ранней смерти каждого нечестивого уже в этой жизни, либо как высказывание, вовсе не предполагающее нравственного порядка.
  rationale: Екклесиаст удерживает напряжение между наблюдаемой жизнью и нравственным порядком. Перевод не добавляет ограничений, которых нет в тексте, но и не усиливает утверждение до более строгой формулы.
- issue: Значение страха перед Богом
  choice: «не боится Бога»
  alternative: «не благоговеет перед Богом»
  rationale: «Боится» сохраняет прямое значение ירא и допускает присущую выражению связь страха с почтением, не сводя его заранее только к благоговению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Слова «нечестивому» и «не будет блага» сохраняют лексику мудростной традиции, оставаясь понятными современному читателю.
