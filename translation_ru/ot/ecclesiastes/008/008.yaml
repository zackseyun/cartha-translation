id: ECC.8.8
reference: Ecclesiastes 8:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֵ֣ין אָדָ֞ם שַׁלִּ֤יט בָּ/ר֨וּחַ֙ לִ/כְל֣וֹא אֶת הָ/ר֔וּחַ וְ/אֵ֤ין שִׁלְטוֹן֙ בְּ/י֣וֹם הַ/מָּ֔וֶת וְ/אֵ֥ין מִשְׁלַ֖חַת בַּ/מִּלְחָמָ֑ה וְ/לֹֽא יְמַלֵּ֥ט רֶ֖שַׁע אֶת בְּעָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/008.yaml
  text: No man has power over the wind to restrain the wind[a], and there is no authority over the day of death, and there is no discharge in war, and wickedness will not deliver its master.
translation:
  language: ru
  text: Никто не властен над ветром, чтобы удержать его[a]; никто не властен над днём смерти; на войне нет освобождения от службы, и нечестие не избавит своего хозяина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никто не властен над духом, чтобы удержать его». Еврейское רוּחַ может означать ветер, дух или дыхание.'
    reason: Сохранение подлинной многозначности исходного слова.
lexical_decisions:
- source_word: אָדָם
  choice: никто
  rationale: Экзистенциальная конструкция אֵין אָדָם естественно передаётся по-русски обобщающим «никто», относящимся ко всякому человеку.
- source_word: שַׁלִּיט
  choice: властен
  rationale: Передаёт значение обладания властью или способностью распоряжаться чем-либо и сохраняет связь со следующим שִׁלְטוֹן.
- source_word: רוּחַ
  choice: ветер
  rationale: Повтор слова при глаголе «удержать» и ряд неподвластных человеку явлений поддерживают конкретное значение «ветер»; возможные значения «дух» и «дыхание» отмечены в сноске.
- source_word: לִכְלוֹא
  choice: удержать
  rationale: Глагол означает запереть, сдержать или не дать выйти; «удержать» естественно сочетается со словом «ветер».
- source_word: שִׁלְטוֹן
  choice: властен
  rationale: Русская конструкция «никто не властен над» ясно передаёт отсутствие власти над временем смерти и создаёт уместный параллелизм с первой частью стиха.
- source_word: בְּיוֹם הַמָּוֶת
  choice: над днём смерти
  rationale: 'Предлог понимается в связи с понятием власти: человек не распоряжается днём своей смерти.'
- source_word: מִשְׁלַחַת
  choice: освобождение от службы
  rationale: В военном контексте существительное обозначает отпуск, увольнение или освобождение; развёрнутая формулировка предотвращает неясность русского «освобождение».
- source_word: בַּמִּלְחָמָה
  choice: на войне
  rationale: Естественная русская передача военного контекста без неоправданного сужения до отдельного сражения.
- source_word: רֶשַׁע
  choice: нечестие
  rationale: Сохранено абстрактное существительное, которое в тексте олицетворено как неспособное спасти принадлежащего ему человека.
- source_word: יְמַלֵּט
  choice: не избавит
  rationale: Передаёт смысл спасения или выведения из опасности и соответствует возвышенному, но современному стилю книги.
- source_word: בְּעָלָיו
  choice: своего хозяина
  rationale: Сохраняет олицетворение нечестия и образ человека как того, кто им владеет или ему принадлежит, не заменяя образ толкованием «того, кто творит нечестие».
theological_decisions:
- issue: Значение רוּחַ в первой части стиха
  choice: ветер
  alternative: дух или дыхание
  rationale: Сочетание с глаголом «удержать» и последовательность неподвластных человеку реалий благоприятствуют значению «ветер». Однако слово действительно может обозначать дух или дыхание, в том числе жизненное дыхание человека, поэтому эта смысловая возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для библейской мудрой литературы. Параллельные конструкции сохранены, но перестроены естественно для русского синтаксиса; архаизмы и конфессионально окрашенные уточнения не используются.
