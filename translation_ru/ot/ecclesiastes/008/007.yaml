  text: כִּֽי אֵינֶ֥/נּוּ יֹדֵ֖עַ מַה שֶּׁ/יִּֽהְיֶ֑ה כִּ֚י כַּ/אֲשֶׁ֣ר יִֽהְיֶ֔ה מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/007.yaml
  text: For he does not know what will be, for who can tell him how it will be?
translation:
  language: ru
  text: 'Ведь он не знает, что будет: кто скажет ему, как это будет?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда это будет?» Еврейский оборот допускает понимание как образа осуществления события, так и времени его наступления; возможен также более общий перевод: «что произойдёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Начальный союз вводит объяснение к предыдущей мысли; «ведь» естественно передаёт эту связь в современном русском языке.
- source_word: אֵינֶנּוּ יֹדֵעַ
  choice: он не знает
  rationale: Отрицательная форма с местоименным суффиксом и причастием ידע говорит о незнании; мужской род сохраняет грамматическую форму и контекстуально имеет обобщённое значение.
- source_word: מַה שֶּׁיִּהְיֶה
  choice: что будет
  rationale: Прямо и естественно передаёт еврейское выражение, относящееся к неизвестному будущему.
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: как это будет
  rationale: Сохраняет возможное различие между тем, «что» произойдёт, и тем, «как» оно осуществится; неоднозначность оборота отмечена в сноске.
- source_word: מִי יַגִּיד לוֹ
  choice: кто скажет ему
  rationale: Глагол נגד в породе hифиль означает «сообщить, сказать, объявить». Вопрос сам выражает невозможность получить такое знание, поэтому модальное «может» добавлять необязательно.
theological_decisions:
- issue: Степень утверждения о недоступности знания будущего
  choice: Риторический вопрос «кто скажет ему»
  alternative: «кто может сказать ему»
  rationale: Выбранная форма следует грамматическому будущему времени еврейского текста и сохраняет риторическую силу, не превращая её в более явное универсальное утверждение о способности.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Двоеточие естественно передаёт пояснительную связь второго כִּי и избегает тяжёлого повтора «ведь».
