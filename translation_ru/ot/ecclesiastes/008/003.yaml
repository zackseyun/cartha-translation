source:
  edition: WLC
  text: אַל תִּבָּהֵ֤ל מִ/פָּנָי/ו֙ תֵּלֵ֔ךְ אַֽל תַּעֲמֹ֖ד בְּ/דָבָ֣ר רָ֑ע כִּ֛י כָּל אֲשֶׁ֥ר יַחְפֹּ֖ץ יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/003.yaml
  text: Do not be hasty to leave his presence[a]. Do not take your stand in an evil matter[b], for he does whatever he pleases.
translation:
  language: ru
  text: Не спеши уходить от него[a]; не упорствуй в злом деле[b], ведь он делает всё, что пожелает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не уходи от него в смятении». Еврейский глагол может указывать не только на поспешность, но и на тревогу или испуг.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не вставай за злое дело» или «не держись злого дела». Еврейское выражение может означать как занятие дурной позиции, так и упорство в ней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבָּהֵל
  choice: не спеши
  rationale: Глагол בהל может обозначать смятение, испуг или поспешность. В сочетании с последующим «уходить» выражение «не спеши» естественно передаёт предостережение от опрометчивого ухода, а эмоциональный оттенок сохраняется в сноске.
- source_word: מִפָּנָיו תֵּלֵךְ
  choice: уходить от него
  rationale: 'Буквально: «идти от его лица». Русское «уходить от него» естественно передаёт удаление из присутствия правителя, не подставляя слово «царь» вместо местоимения исходного текста.'
- source_word: תַּעֲמֹד
  choice: не упорствуй
  rationale: עמד может означать стоять, занимать позицию, оставаться или упорно держаться её. В данном предостережении «не упорствуй» передаёт продолжительное отстаивание или сохранение дурной позиции; буквальная альтернатива отмечена в сноске.
- source_word: בְּדָבָר רָע
  choice: в злом деле
  rationale: 'דבר имеет широкий смысл: слово, дело, вопрос, обстоятельство. «Злое дело» сохраняет как смысловую широту, так и нравственную силу רע.'
- source_word: כִּי כָּל אֲשֶׁר יַחְפֹּץ יַעֲשֶׂה
  choice: ведь он делает всё, что пожелает
  rationale: Фраза подчёркивает действенную власть правителя осуществлять собственную волю. «Всё, что пожелает» точно и естественно передаёт חפץ, не усиливая высказывание дополнительными толкованиями.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для двух предостережений; русское «ведь» ясно и естественно выражает эту пояснительно-причинную связь.
theological_decisions:
- issue: К кому относятся местоимения третьего лица
  choice: Сохранены местоимения «него» и «он»; в ближайшем контексте они относятся к царю.
  alternative: Обобщённый правитель или представитель власти.
  rationale: Упоминание царя в Екклесиасте 8:2 и его повеления в 8:4 делает царя наиболее вероятным референтом. Однако перевод не подменяет местоимения существительным и тем самым не уточняет текст сверх еврейского оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным и достойным тоном. Синтаксический параллелизм двух запретов сохранён; формулировки понятны без специальных знаний, а существенная лексическая неоднозначность вынесена в сноски.
