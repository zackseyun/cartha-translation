  yaml_path: translation/ot/ecclesiastes/008/001.yaml
  text: Who is like the wise man[a], and who knows the interpretation of a matter? A man's wisdom lights up his face[b], and the hardness of his face is changed.
translation:
  language: ru
  text: Кто подобен мудрецу и кто знает истолкование дела? Мудрость человека озаряет его лицо, и суровое выражение его лица меняется[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «твёрдость (дерзость) его лица изменяется». Еврейское выражение допускает оттенки суровости, непреклонности или дерзости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי כְּהֶחָכָם
  choice: Кто подобен мудрецу
  rationale: Сохраняет риторический вопрос, сравнительное значение כְּ и единственное число субстантивированного הֶחָכָם; по-русски звучит естественно и достойно.
- source_word: יוֹדֵעַ פֵּשֶׁר דָּבָר
  choice: знает истолкование дела
  rationale: יוֹדֵעַ передано прямым «знает», פֵּשֶׁר — как «истолкование», а широкое דָּבָר — как «дело». Формулировка сохраняет предметный характер еврейского сочетания и не сводит его лишь к абстрактному «смыслу».
- source_word: חָכְמַת אָדָם
  choice: Мудрость человека
  rationale: Передаёт конструкцию «мудрость человека» и обобщающее значение единственного אָדָם. Русское «человек» здесь естественно обозначает любого человека без ненужного сужения смысла по полу.
- source_word: תָּאִיר פָּנָיו
  choice: озаряет его лицо
  rationale: 'Форма породы хифиль от אור имеет причинное значение: мудрость делает лицо светлым. «Озаряет» сохраняет образ света и естественно сочетается со словом «лицо».'
- source_word: עֹז פָּנָיו
  choice: суровое выражение его лица
  rationale: Буквальное «сила/твёрдость его лица» в данном сочетании описывает твёрдый, суровый или дерзкий вид. Слово «выражение» делает идиому понятной по-русски, не устраняя её неоднозначность, которая отмечена в сноске.
- source_word: יְשֻׁנֶּא
  choice: меняется
  rationale: Передаёт пассивное значение глагола שנה — «быть изменённым». Русская возвратная форма естественна и не усиливает смысл до «преображается».
theological_decisions:
- issue: Обобщающее значение אָדָם в изречении о мудрости
  choice: Мудрость человека
  alternative: Мудрость мужчины
  rationale: В этом контексте אָדָם употреблено как обобщающее единственное число и относится к человеку вообще. «Человека» точно передаёт объём значения и не вносит полового ограничения, которого контекст не требует.
- issue: Связь мудрости с изменением лица
  choice: Сохранено утверждение, что мудрость озаряет лицо, а его суровое выражение меняется
  alternative: Явно указать, что именно мудрость смягчает лицо
  rationale: Еврейский текст сближает две части, но во второй не повторяет мудрость как выраженное подлежащее. Перевод сохраняет эту связь и не превращает подразумеваемую причинность в недвусмысленное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром книги Екклесиаста. Сохранены риторический вопрос, параллелизм и образ озарённого лица; неясная идиома עֹז פָּנָיו передана понятно, но её смысловой диапазон отмечен в сноске.
