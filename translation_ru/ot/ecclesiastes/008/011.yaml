  text: אֲשֶׁר֙ אֵין נַעֲשָׂ֣ה פִתְגָ֔ם מַעֲשֵׂ֥ה הָ/רָעָ֖ה מְהֵרָ֑ה עַל כֵּ֡ן מָלֵ֞א לֵ֧ב בְּֽנֵי הָ/אָדָ֛ם בָּ/הֶ֖ם לַ/עֲשׂ֥וֹת רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/011.yaml
  text: Because the sentence against an evil deed is not carried out quickly[b][a], therefore the heart of the sons of man is fully set in them to do evil.
translation:
  language: ru
  text: Поскольку приговор за злое дело не приводится в исполнение без промедления, сердце сынов человеческих[a] исполнено решимости творить зло[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть речь идёт о людях вообще, обо всём человечестве.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сердце … полно в них, чтобы творить зло»; выражение передаёт укрепившуюся решимость или возросшую смелость делать зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתְגָם
  choice: приговор
  rationale: В данном судебном контексте слово обозначает властное решение о злодеянии; «приговор» естественно сочетается с выражением «приводить в исполнение».
- source_word: מַעֲשֵׂה הָרָעָה
  choice: злое дело
  rationale: Сохраняет единственное число еврейского сочетания и его обобщающий смысл.
- source_word: אֵין נַעֲשָׂה ... מְהֵרָה
  choice: не приводится в исполнение скоро
  rationale: Пассивная форма עשה в связи с приговором означает его осуществление, а מְהֵרָה указывает на отсутствие быстрого воздаяния.
- source_word: עַל־כֵּן
  choice: поскольку …, [следствие без повторного союза]
  rationale: Начальное אֲשֶׁר вводит причинное обстоятельство, а עַל־כֵּן — его следствие. Русская конструкция «поскольку …, …» ясно передаёт эту причинно-следственную связь без тяжеловесного «поскольку …, поэтому».
- source_word: לֵב בְּנֵי הָאָדָם
  choice: сердце сынов человеческих
  rationale: Сохраняется собирательное единственное число «сердце» и традиционный, но понятный современному читателю образ внутреннего волевого центра.
- source_word: בְּנֵי הָאָדָם
  choice: сыны человеческие
  rationale: Форма «сынов человеческих» в составе родительного оборота сохраняет мужское собирательное выражение оригинала; примечание поясняет его общечеловеческий охват.
- source_word: מָלֵא ... לַעֲשׂוֹת רָע
  choice: исполнено решимости творить зло
  rationale: Передаёт буквальный образ наполненности сердца и одновременно понятный в контексте смысл укрепившейся, дерзкой готовности ко злу.
- source_word: רָע
  choice: зло
  rationale: Сохраняет нравственную силу исходного слова и лексическую связь с «злым делом».
theological_decisions:
- issue: Обобщающее значение בְּנֵי הָאָדָם
  choice: сыны человеческие
  alternative: люди; род человеческий
  rationale: Оригинал употребляет мужское представительное выражение, относящееся ко всему человечеству. Основной текст сохраняет его форму, а примечание предотвращает ошибочное ограничение смысла только мужчинами.
- issue: Смысл наполненности сердца при отсроченном правосудии
  choice: исполнено решимости творить зло
  alternative: осмеливается творить зло; полно желания делать зло
  rationale: Перевод не превращает наблюдение в отвлечённое учение о природе человека, а сохраняет конкретную связь между задержкой приговора и укрепившейся склонностью людей ко злу.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Приводится в исполнение» — естественная судебная формула; «творить зло» и «сыны человеческие» сохраняют достоинство и образность исходного текста. Маркеры примечаний поставлены непосредственно после поясняемых выражений.
