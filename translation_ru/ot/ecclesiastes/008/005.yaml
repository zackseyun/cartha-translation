  text: שׁוֹמֵ֣ר מִצְוָ֔ה לֹ֥א יֵדַ֖ע דָּבָ֣ר רָ֑ע וְ/עֵ֣ת וּ/מִשְׁפָּ֔ט יֵדַ֖ע לֵ֥ב חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/005.yaml
  text: Whoever keeps a command will not know an evil thing[b][a], and a wise heart knows the proper time and judgment.
translation:
  language: ru
  text: Кто соблюдает повеление, тот не испытает беды[a], а мудрое сердце знает время и суд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не узнает чего-либо злого (дурного)». Возможно также: «не познает зла» или «не столкнётся с несчастьем». Здесь, вероятно, имеются в виду беда или вредные последствия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «время и суд». Речь может идти о подходящем времени и судебном решении, порядке действий или способе разбирательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: соблюдает
  rationale: Причастие обозначает того, кто хранит или исполняет повеление; «соблюдает» естественно передаёт послушание ему.
- source_word: מִצְוָה
  choice: повеление
  rationale: Единственное число здесь допускает обобщённое значение. «Повеление» сохраняет широту смысла и не сводит выражение к определённой заповеди.
- source_word: לֹא יֵדַע
  choice: не испытает
  rationale: Буквально «не узнает»; в сочетании с бедой глагол, вероятно, имеет опытное значение. «Не испытает» естественно по-русски, а буквальная возможность отмечена в сноске.
- source_word: דָּבָר רָע
  choice: беды
  rationale: Буквально «злого/дурного дела (явления)»; в контексте речь, вероятнее всего, о вредном последствии или несчастье. «Беда» передаёт эту контекстуальную силу без морального сужения.
- source_word: וְעֵת
  choice: подходящее время
  rationale: В литературе мудрости עֵת может означать не просто время, но уместный момент; это значение естественно в паре с распознаванием решения.
- source_word: וּמִשְׁפָּט
  choice: верное решение
  rationale: מִשְׁפָּט охватывает суд, решение, порядок действий и правосудие. В данном контексте «верное решение» читается естественно, но неоднозначность сохранена в сноске.
- source_word: יֵדַע לֵב חָכָם
  choice: мудрое сердце знает
  rationale: Сохранён образ сердца как средоточия понимания и рассудительности, а не заменён более плоским «мудрый человек знает».
theological_decisions:
- issue: Антропологический образ לֵב חָכָם
  choice: мудрое сердце
  alternative: мудрый человек; сердце мудреца
  rationale: Сохранение «сердца» передаёт древнееврейское представление о внутреннем средоточии рассудительности и не навязывает современного разделения разума и чувств.
- issue: Обобщённое причастие мужского рода
  choice: кто соблюдает повеление
  alternative: соблюдающий повеление; тот, кто соблюдает заповедь
  rationale: Конструкция «кто… тот» естественно выражает общее правило и не ограничивает его мужчинами.
- issue: Характер обещания לֹא יֵדַע דָּבָר רָע
  choice: не испытает беды
  alternative: не узнает ничего злого; не познает зла
  rationale: Контекст повиновения царскому повелению указывает на избежание дурных последствий, однако буквальная и моральная смысловые возможности не исключены и отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и афористичности текста мудрости. Синтаксическая конструкция «кто… тот» подчёркивает общее правило; образ «мудрого сердца» сохранён. Контекстуально ясные варианты вынесены в основной текст, а подлинная лексическая неоднозначность — в сноски.
