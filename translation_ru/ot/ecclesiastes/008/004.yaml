base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/004.yaml
  text: For the word of a king is authority[a], and who may say to him, “What are you doing?”
translation:
  language: ru
  text: 'Ибо слово царя обладает властью[a], и кто скажет ему: «Что ты делаешь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Где слово царя, там власть». Еврейское начало стиха допускает такое более буквальное понимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Поскольку
  rationale: В контексте выражение естественно вводит основание предыдущего наставления; при этом возможное местное понимание сохранено в сноске.
- source_word: דְּבַר מֶלֶךְ
  choice: слово царя
  rationale: Буквальное «слово» сохраняет широту значения и в царском контексте подразумевает властное распоряжение, не сужая его прямо до «приказа».
- source_word: שִׁלְטוֹן
  choice: имеет власть
  rationale: Существительное обозначает власть или властную силу. Русская конструкция «слово царя имеет власть» естественно передаёт, что его слово обладает обязательной силой.
- source_word: וּמִי יֹאמַר לוֹ
  choice: кто скажет ему
  rationale: Риторический вопрос сам выражает невозможность или недопустимость такого вызова; отдельное модальное слово в русском не требуется.
- source_word: מַה תַּעֲשֶׂה
  choice: Что ты делаешь?
  rationale: Прямая и естественная передача вопроса, которым ставят под сомнение действие царя.
theological_decisions:
- issue: Характер царской власти
  choice: Передать силу царского слова без добавочного утверждения о нравственной или божественной безусловности этой власти.
  alternative: Усилить формулировку до «слово царя — закон».
  rationale: Еврейский текст говорит о властной силе царского слова, но не употребляет слово «закон» и в данном стихе не разрешает вопрос о пределах царской власти.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, афористичная и достойная по тону. Местоимение «ты» в прямом вопросе соответствует форме единственного числа и естественной русской речи при обращении к одному лицу.
