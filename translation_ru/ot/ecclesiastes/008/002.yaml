  yaml_path: translation/ot/ecclesiastes/008/002.yaml
  text: I say[a], keep the king’s command[c][b], because of your oath before God.
translation:
  language: ru
  text: 'Я говорю: соблюдай повеление царя[a] ввиду клятвы, данной перед Богом[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уста царя».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение сжато. Его можно понимать также как «клятва Богу» или «Божья клятва»; возможен и синтаксический разбор: «Соблюдай повеление царя — и ввиду клятвы Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Я говорю
  rationale: Самостоятельное местоимение «я» открывает фразу резко и эллиптически; добавление «говорю» минимально восполняет подразумеваемый глагол и даёт естественную русскую речь.
- source_word: פִּי מֶלֶךְ
  choice: повеление царя
  rationale: Буквально «уста царя»; здесь это идиома, обозначающая сказанное или предписанное царём. «Повеление» передаёт властный характер выражения.
- source_word: שְׁמֹר
  choice: исполняй
  rationale: Глагол значит «хранить, соблюдать, исполнять». С объектом «повеление» русское «исполняй» естественно выражает требуемое повиновение.
- source_word: וְעַל דִּבְרַת
  choice: ради
  rationale: Сжатое сочетание допускает причинное или соотносительное понимание. «Ради» кратко и естественно передаёт вероятное основание исполнения приказа.
- source_word: שְׁבוּעַת אֱלֹהִים
  choice: клятвы перед Богом
  rationale: Сочетание допускает значения «клятва перед Богом», «клятва Богу» и «клятва Бога». Основной текст передаёт вероятную клятву человека под Божьим свидетельством, а примечание сохраняет неоднозначность.
theological_decisions:
- issue: Связь клятвы перед Богом с повиновением царю
  choice: Клятва, принесённая слушателем перед Богом, служит основанием для исполнения царского повеления.
  alternative: «Клятва Богу» либо «клятва Бога»; кроме того, союз можно понимать как присоединяющий второе наставление, а не только указывающий причину.
  rationale: Контекст повелительного обращения поддерживает отнесение клятвы к адресату, однако еврейская конструкция не уточняет её носителя и направление. Поэтому перевод не превращает стих в утверждение о безусловной царской власти и отмечает иные чтения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксическая сжатость оригинала слегка раскрыта словами «Я говорю», а подлинная неоднозначность второй половины сохранена в примечании.
