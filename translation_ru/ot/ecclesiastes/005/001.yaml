base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/001.yaml
  text: Do not be hasty with your mouth[a], and do not let your heart be quick to bring forth a word before God, for God is in heaven and you are on earth. Therefore let your words be few.
translation:
  language: ru
  text: Не спеши говорить[a], и пусть сердце твоё не торопится произнести слово перед Богом, ведь Бог на небесах, а ты на земле. Поэтому пусть слов у тебя будет немного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будь поспешен устами своими». В данном контексте речь может включать необдуманные обеты, однако еврейский текст говорит шире — о словах, произносимых перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל עַל־פִּיךָ
  choice: Не спеши говорить
  rationale: Еврейское выражение буквально связывает поспешность с устами; по-русски «не спеши говорить» естественно передаёт предостережение против необдуманной речи, а сноска сохраняет телесный образ оригинала.
- source_word: לִבְּךָ
  choice: сердце твоё
  rationale: В древнееврейском «сердце» обозначает внутренний центр мысли и воли, а не только чувства; этот значимый образ сохранён.
- source_word: יְמַהֵר
  choice: не торопится
  rationale: Глагол выражает поспешность; «не торопится» естественно продолжает параллелизм, не создавая тяжеловесного повтора.
- source_word: לְהוֹצִיא דָבָר
  choice: произнести слово
  rationale: Буквально — «вывести слово». Русское «произнести слово» сохраняет общий смысл речи и не сужает его до обета, хотя контекст допускает такое применение.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: перед Богом
  rationale: Прямой и естественный эквивалент, сохраняющий представление о речи в Божьем присутствии.
- source_word: בַּשָּׁמַיִם
  choice: на небесах
  rationale: Русская форма «на небесах» естественна для высокого, но понятного регистра и отражает морфологически множественную форму еврейского слова.
- source_word: עַל־הָאָרֶץ
  choice: на земле
  rationale: Прямой перевод, сохраняющий пространственный контраст между Богом и человеком.
- source_word: עַל־כֵּן
  choice: Поэтому
  rationale: Ясно выражает вывод, следующий из противопоставления небес и земли.
- source_word: יִהְיוּ דְבָרֶיךָ מְעַטִּים
  choice: пусть слов у тебя будет немного
  rationale: Передаёт побудительное значение юссива и звучит по-русски естественнее, чем буквальное «пусть твои слова будут немногими».
theological_decisions:
- issue: Следует ли сужать смысл стиха до обетов или обещаний, произносимых во время богослужения
  choice: Сохранить более широкое указание на речь перед Богом
  alternative: Передать как прямое предостережение против поспешных обетов
  rationale: Ближайший контекст говорит о поклонении и обетах, но сам стих использует общее выражение «произнести слово». Перевод не вводит в основной текст отсутствующее существительное «обет» и тем самым сохраняет смысловую широту и контекстуальное напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для обычного читателя; сохранены образы сердца, небес и земли, а буквальная метафора уст вынесена в сноску.
