  terminology: «Суеты» сохраняет множественное число и связь с ключевым словом הֶבֶל в Екклесиасте. «Бойся Бога» — устойчивая и точная передача יְרָא אֶת־הָאֱלֹהִים; заменять её более мягким «почитай» не следует.
