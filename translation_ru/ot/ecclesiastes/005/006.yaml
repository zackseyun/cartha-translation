  source_fidelity: Черновик верно передаёт начальный причинный союз, императив יְרָא и сохраняет эллипсис. Однако «во множестве снов, суеты и многословия» синтаксически связывает неоднородные формы и заменяет еврейское множественное הֲבָלִים собирательным единственным числом. Кроме того, «многословие» может обозначать свойство речи, тогда как דְבָרִים הַרְבֵּה буквально означает «многие слова»; предпочтительно сохранить эту формулировку.
