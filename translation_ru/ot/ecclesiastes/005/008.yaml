  yaml_path: translation/ot/ecclesiastes/005/008.yaml
  text: The land’s profit is for everyone; even a king is served by the field.[a]
translation:
  language: ru
  text: Польза земли — для всех; даже царь пользуется тем, что даёт поле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь особенно труден. Возможен и такой перевод: «Преимущество страны во всём — царь, заботящийся об обрабатываемых полях». Последнюю часть можно также понять так: «даже царь зависит от поля».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְרוֹן אֶרֶץ
  choice: Выгода от земли
  rationale: יִתְרוֹן — характерное для Екклесиаста слово со значениями «выгода», «преимущество», «прибыль»; «выгода» сохраняет смысловую связь с повторяющейся лексикой книги, а אֶרֶץ здесь естественно понимать как источник земледельческого дохода.
- source_word: בַּכֹּל
  choice: для всех
  rationale: При принятом членении сжатой еврейской фразы выражение понимается как указание на всеобщую пользу земли. Возможное наречное значение «во всех отношениях» сохранено в сноске.
- source_word: מֶלֶךְ לְשָׂדֶה נֶעֱבָד
  choice: даже царь получает необходимое от поля
  rationale: Сжатая конструкция допускает понимание царя как того, кого «обслуживает» поле. По-русски буквальное «царь обслуживается полем» неестественно, поэтому смысл передан как зависимость царя от произведённого полем, без устранения грамматической неоднозначности в сноске.
theological_decisions:
- issue: Связь царя с обрабатываемым полем
  choice: Царь, как и все, получает необходимое от поля
  alternative: Преимущество страны во всём — царь, заботящийся об обрабатываемых полях
  rationale: Еврейский текст допускает оба синтаксических разбора и не требует богословски или политически усиливать один из них; основной текст следует пассивному прочтению, а альтернативное сохранено явно.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная по тону. Неестественный буквальный пассив заменён естественным выражением зависимости, а существенная неоднозначность исходного текста сохранена в сноске.
