    text: 'Или: «не будет много думать о днях своей жизни» или «не будет подолгу размышлять о днях своей жизни». Глагол буквально означает «помнить, вспоминать», но в данном контексте может подразумевать продолжительное обдумывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, более буквально: «Бог отвечает ему радостью его сердца». Значение еврейского глагола здесь не вполне ясно; в данном контексте он, вероятно, означает, что Бог занимает человека или погружает его в радость.'
