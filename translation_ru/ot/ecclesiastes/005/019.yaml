  yaml_path: translation/ot/ecclesiastes/005/019.yaml
  text: For he will not remember much the days of his life[b][a], because God keeps him occupied with the joy of his heart.
translation:
  language: ru
  text: Ведь он не будет много вспоминать о днях своей жизни[a], потому что Бог занимает его радостью его сердца[b].
  philosophy: optimal-equivalence
  footnotes:
