base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/005.yaml
  text: Do not let your mouth cause your flesh to sin[a], and do not say before the messenger, “It was a mistake.” Why should God be angry at your voice and destroy the work of your hands?
translation:
  language: ru
  text: 'Не позволяй своим устам вводить в грех твою плоть и не говори перед посланником[a]: «Это была ошибка». Зачем Богу гневаться из-за твоих слов и губить дело твоих рук?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед ангелом». Еврейское слово מַלְאָךְ может обозначать как человеческого посланника, так и небесного вестника.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתֵּן אֶת־פִּיךָ
  choice: позволяй своим устам
  rationale: Буквальное «давай свои уста» неестественно по-русски. Эта формулировка сохраняет разрешительно-каузативный смысл и образ уст как источника опрометчивой речи.
- source_word: לַחֲטִיא
  choice: вводить в грех
  rationale: Каузативная форма глагола חטא означает побуждение или приведение ко греху; выбранный оборот передаёт эту силу без уточнения невыраженного механизма.
- source_word: בְּשָׂרֶךָ
  choice: твою плоть
  rationale: Сохранено буквальное и многозначное «плоть», обозначающее телесное человеческое существование; замена на «тебя самого» устранила бы образность оригинала.
- source_word: הַמַּלְאָךְ
  choice: посланником
  rationale: מַלְאָךְ может обозначать как человеческого посланника, так и небесного ангела. В контексте обетов возможен служитель, связанный с их исполнением, но значение не следует сужать безоговорочно; альтернативное понимание дано в сноске.
- source_word: שְׁגָגָה
  choice: ошибка
  rationale: Слово обозначает ошибку или неумышленный проступок. «Ошибка» естественно звучит как попытка оправдать опрометчиво данный обет.
- source_word: קוֹלֶךָ
  choice: из-за твоих слов
  rationale: Буквально — «на твой голос», но в данном контексте голос метонимически обозначает произнесённый обет или оправдание. Русское «из-за твоих слов» ясно передаёт смысл, не создавая неестественного оборота.
- source_word: וְחִבֵּל
  choice: губить
  rationale: Глагол выражает нанесение тяжёлого ущерба, разорение или уничтожение. «Губить» сохраняет серьёзность последствий и естественно сочетается с «делом рук».
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: дело твоих рук
  rationale: Сохранён прозрачный древнееврейский образ труда человека и его плодов; по-русски он остаётся понятным и выразительным.
theological_decisions:
- issue: Кого обозначает הַמַּלְאָךְ в контексте обета
  choice: посланник
  alternative: ангел
  rationale: Храмовый контекст допускает человеческого посланника или служителя, принимающего сведения об обетах, тогда как само еврейское слово может обозначать и небесного вестника. Основной текст сохраняет более широкое значение, а сноска — реальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; образы «плоть» и «дело рук» сохранены, а неестественное буквальное «гневаться на голос» передано смысловым оборотом «гневаться из-за твоих слов».
