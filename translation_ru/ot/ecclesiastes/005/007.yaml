  source_fidelity: 'В целом смысл передан верно: עֹשֶׁק רָשׁ — угнетение бедного, גֵזֶל מִשְׁפָּט וָצֶדֶק — насильственное лишение правосудия и справедливости, מְדִינָה — административная область/провинция. Однако в заключении русское «за высоким начальником наблюдает тот, кто выше» меняет синтаксическое направление еврейского מֵעַל: буквально высокий наблюдает сверху, то есть над высоким. Это же направление важно для образа иерархического надзора.'
