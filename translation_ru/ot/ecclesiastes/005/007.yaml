base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/007.yaml
  text: If you see the oppression of the poor and the robbery of justice and righteousness in the province, do not be astonished at the matter; for a high official is watched by one higher, and there are even higher ones over them.
translation:
  language: ru
  text: 'Если увидишь в области угнетение бедного[a] и попрание правосудия и справедливости[b], не удивляйся происходящему: ведь над высоким начальником наблюдает тот, кто выше, а над ними — те, кто ещё выше[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «вымогательство у бедного». Еврейское слово может означать как угнетение вообще, так и корыстное отнятие имущества.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ограбление правосудия и справедливости».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ведь высокий наблюдает над высоким, а над ними — высокие». Это может относиться к нескольким уровням человеческой власти, но может также подразумевать высший Божий надзор.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׁק רָשׁ
  choice: угнетение бедного
  rationale: עֹשֶׁק обозначает угнетение, притеснение или корыстную эксплуатацию, а רָשׁ — бедного человека. Формулировка естественна по-русски и сохраняет социальную направленность выражения.
- source_word: גֵזֶל מִשְׁפָּט וָצֶדֶק
  choice: попрание правосудия и справедливости
  rationale: גֵזֶל буквально связано с насильственным отнятием или грабежом; в сочетании с абстрактными מִשְׁפָּט и צֶדֶק русское «попрание» естественно передаёт грубое лишение людей законного и справедливого порядка.
- source_word: מְדִינָה
  choice: область
  rationale: Слово обозначает административную территорию, провинцию или округ. «Область» понятно современному русскому читателю и подходит к бюрократическому контексту.
- source_word: אַל תִּתְמַהּ עַל הַחֵפֶץ
  choice: не удивляйся происходящему
  rationale: תִּתְמַהּ выражает изумление, а הַחֵפֶץ здесь, вероятнее всего, указывает на описанное явление или положение дел. Перевод не приписывает слову значение «желание», неестественное в данном контексте.
- source_word: גָבֹהַּ מֵעַל גָּבֹהַ שֹׁמֵר
  choice: за высоким начальником наблюдает тот, кто выше
  rationale: Повторённое прилагательное גָבֹהַּ употреблено субстантивно и указывает на людей высокого положения. «Начальник» проясняет должностную иерархию, а «наблюдает» сохраняет смысл שֹׁמֵר, не уточняя, является ли надзор защитным или контролирующим.
- source_word: וּגְבֹהִים עֲלֵיהֶם
  choice: а над ними — те, кто ещё выше
  rationale: Фраза продолжает образ многоуровневой власти. Такой перевод сохраняет множественное число и нарастание рангов, не называя последнюю инстанцию прямо.
theological_decisions:
- issue: Следует ли прямо назвать Бога высшим наблюдающим
  choice: Сохранить неопределённое «те, кто ещё выше»
  alternative: Указать в основном тексте, что над всеми наблюдает Бог
  rationale: Еврейский текст прямо Бога не называет и допускает как описание человеческой административной иерархии, так и намёк на высший божественный надзор. Перевод сохраняет эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Синтаксис ясен для широкого читателя; административный оттенок сохранён без архаизмов. Формулировки не устраняют намеренную неопределённость заключительной части стиха.
