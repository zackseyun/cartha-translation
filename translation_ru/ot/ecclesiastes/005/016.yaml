base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/016.yaml
  text: Also[a], all his days he eats in darkness[b], with much vexation and sickness and anger.
translation:
  language: ru
  text: К тому же, все свои дни он ест во тьме[a] — с великой досадой[b], в болезни и гневе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Во тьме» можно понимать буквально или как образ мрачной, безрадостной жизни.
    reason: lexical_alternative
  - marker: b
    text: Древнееврейское слово, переданное как «досада», может также означать «огорчение» или «раздражение».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: И ещё
  rationale: Передаёт добавочное значение частицы и связывает стих с предшествующим описанием бедственного состояния.
- source_word: כָּל יָמָיו
  choice: все свои дни
  rationale: Сохраняет образное древнееврейское выражение, естественное и понятное в современном русском языке.
- source_word: בַּחֹשֶׁךְ
  choice: во тьме
  rationale: Сохраняет конкретный образ оригинала, не решая однозначно, буквальна ли тьма или обозначает мрачную, безрадостную жизнь.
- source_word: יֹאכֵל
  choice: ест
  rationale: Имперфект в контексте описывает обычное, характерное действие; настоящее время естественно передаёт это значение.
- source_word: וְכָעַס הַרְבֵּה
  choice: в великой досаде
  rationale: Сжатая конструкция указывает на сильное внутреннее раздражение, огорчение или мучительное недовольство; «досада» сохраняет широту значения, а предлог восполняет эллипсис по-русски.
- source_word: חָלְיוֹ
  choice: болезни
  rationale: Передаёт конкретное значение существительного как болезни или недуга; местоименный суффикс не выражен отдельно, поскольку русский ряд обстоятельств состояния без него звучит естественнее.
- source_word: וָקָצֶף
  choice: и гневе
  rationale: Передаёт сильное раздражение или гнев самого человека, не превращая его без основания в указание на Божий гнев.
theological_decisions:
- issue: Относится ли «гнев» к человеку или к Божьему гневу
  choice: Фраза представлена как описание озлобленного состояния человека.
  alternative: Понимать «гнев» как Божий гнев против него.
  rationale: В непосредственном перечислении рядом стоят досада и болезнь, поэтому естественнее видеть здесь состояние человека; субъект или источник гнева, однако, в оригинале прямо не назван.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатости и мрачной образности оригинала. Тире помогает естественно присоединить эллиптический ряд состояний, не добавляя в текст нового сказуемого.
