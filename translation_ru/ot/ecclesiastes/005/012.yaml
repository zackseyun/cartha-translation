lexical_decisions:
- source_word: יֵשׁ
  choice: Есть
  rationale: Экзистенциальная частица естественно передаётся русским «есть» и вводит наблюдение автора.
- source_word: רָעָה חוֹלָה
  choice: тяжкое зло
  rationale: חוֹלָה буквально связано с болезнью, но здесь усиливает רָעָה, обозначая особенно серьёзное, мучительное зло; «тяжкое зло» сохраняет силу выражения без неестественного буквализма.
- source_word: רָאִיתִי
  choice: которое я видел
  rationale: Форма глагола передаёт личное наблюдение говорящего; простое прошедшее время естественно в русском повествовании.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохранена повторяющаяся формула Екклесиаста в её привычной и естественной русской форме.
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Современное нейтральное существительное точно передаёт имущество и материальное достояние.
- source_word: שָׁמוּר
  choice: сберегаемое
  rationale: Страдательное причастие обозначает богатство, которое сохраняют или удерживают; «сберегаемое» передаёт длительное сохранение, не добавляя прямо мотива накопительства.
- source_word: לִבְעָלָיו
  choice: его владельцем
  rationale: בעל здесь означает владельца. Предлог ל допускает оттенок отношения или пользы, однако в контексте естественно понять владельца как того, кто сохраняет богатство; альтернативное синтаксическое прочтение отмечено в сноске.
- source_word: לְרָעָתוֹ
  choice: ему же во вред
  rationale: 'Выражение обозначает пагубный результат для владельца; частица «же» подчёркивает парадокс: сбережённое им богатство вредит ему самому.'
