source:
  edition: WLC
  text: בִּ/רְבוֹת֙ הַ/טּוֹבָ֔ה רַבּ֖וּ אוֹכְלֶ֑י/הָ וּ/מַה כִּשְׁרוֹן֙ לִ/בְעָלֶ֔י/הָ כִּ֖י אִם ראית עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/010.yaml
  text: When goods increase[a], those who consume them increase[b]; and what advantage is there to their owners except the seeing of their eyes?
translation:
  language: ru
  text: Когда умножается имущество[a], умножаются и те, кто его потребляет; какая же выгода от него владельцу, кроме возможности видеть его своими глазами[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «блага», «достаток» или «богатство». Еврейское слово может обозначать материальное благо или благополучие вообще; упоминание владельца и тех, кто это потребляет, указывает здесь прежде всего на имущество.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «видение его глаз». Этот оборот подразумевает, что владельцу остаётся лишь смотреть на своё имущество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: Когда умножается
  rationale: 'Предлог ב при инфинитиве конструктивном выражает время: «когда умножается». Эта формулировка также позволяет сохранить повтор корня רבה в обеих частях стиха.'
- source_word: הַטּוֹבָה
  choice: добро
  rationale: טוֹבָה может обозначать благо, достаток или имущество. «Добро» сохраняет широту значения, а контекст владения и потребления указывает здесь прежде всего на материальные блага.
- source_word: רַבּוּ
  choice: умножаются
  rationale: 'Повтор глагола «умножаться» передаёт намеренный параллелизм: умножается добро — умножаются его потребители.'
- source_word: אֹכְלֶיהָ
  choice: те, кто его потребляет
  rationale: Буквально — «едящие его». В экономическом контексте речь может идти не только о буквальной еде, но и обо всех, кто расходует или использует имущество; «потребляет» передаёт эту широту.
- source_word: וּמַה כִּשְׁרוֹן
  choice: Какая же выгода
  rationale: כִּשְׁרוֹן означает выгоду, преимущество или пользу. Риторический вопрос естественно звучит по-русски с формой «какая же выгода».
- source_word: לִבְעָלֶיהָ
  choice: от него владельцу
  rationale: בעל здесь означает владельца или обладателя. Единственное число «владельцу» согласовано с собирательным «добро» и с последующим единственным числом עֵינָיו.
- source_word: כִּי אִם
  choice: кроме того, что
  rationale: 'После риторического вопроса оборот вводит единственное остающееся преимущество: «кроме / разве только».'
- source_word: רְאִית עֵינָיו
  choice: он видит его своими глазами
  rationale: 'Буквально — «видение его глаз». Естественная русская идиома передаёт тот же смысл: владельцу остаётся лишь смотреть на своё добро, при этом местоимения единственного числа исходного текста сохранены.'
theological_decisions:
- issue: Характер пользы владельца
  choice: Фраза оставлена как риторический вопрос, сводящий выгоду к возможности видеть имущество.
  alternative: Истолковать видение как положительное наслаждение богатством.
  rationale: Текст допускает оттенок обладания или созерцания, но контекст и конструкция «какая выгода... кроме» подчёркивают ограниченность пользы, не требуя более узкого богословского вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно афористичным звучанием. Повтор «умножается — умножаются» намеренно сохраняет словесный параллелизм еврейского текста; местоимения единственного числа следуют масоретской форме.
