  text: וְ/גַם זֹה֙ רָעָ֣ה חוֹלָ֔ה כָּ/ל עֻמַּ֥ת שֶׁ/בָּ֖א כֵּ֣ן יֵלֵ֑ךְ וּ/מַה יִּתְר֣וֹן ל֔/וֹ שֶֽׁ/יַּעֲמֹ֖ל לָ/רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/015.yaml
  text: 'This too is a grievous evil: exactly as he came[a], so he will go. And what profit is there for him who toils for the wind?'
translation:
  language: ru
  text: 'И это — тяжкое зло: как он пришёл, так и уйдёт. И какая ему польза от того, что он трудится на ветер[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для духа» или «для дыхания»; еврейское רוּחַ может означать «ветер», «дыхание» или «дух». В данном контексте «ветер» лучше всего передаёт образ тщетного труда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה חוֹלָה
  choice: тяжкое зло
  rationale: Сочетание обозначает особенно мучительное, тяжёлое зло; буквальный образ болезни не следует превращать в указание на физический недуг.
- source_word: כָּל עֻמַּת שֶׁבָּא
  choice: как он пришёл, так и уйдёт
  rationale: Русская парная конструкция естественно и точно передаёт полное соответствие между приходом человека в мир и его уходом из него.
- source_word: יֵלֵךְ
  choice: уйдёт
  rationale: В данном контексте глагол говорит о неизбежном уходе человека при смерти; приставочная форма естественно выражает это по-русски.
- source_word: יִתְרוֹן
  choice: польза
  rationale: Ключевое для Екклесиаста слово означает выгоду, преимущество или остающийся итог; «польза» ясно передаёт вопрос о реальном результате труда.
- source_word: שֶׁיַּעֲמֹל
  choice: от того, что он трудится
  rationale: עמל обозначает тяжёлый, изнурительный труд. Такая конструкция сохраняет связь вопроса о пользе с самим трудом и звучит естественно по-русски.
- source_word: לָרוּחַ
  choice: на ветер
  rationale: רוּחַ может означать ветер, дыхание или дух. Здесь «на ветер» сохраняет конкретный образ бесплодного труда и соответствует контексту тщетности.
theological_decisions:
- issue: Значение רוּחַ в контексте мудрости и тщетности
  choice: ветер
  alternative: дух; дыхание
  rationale: Контекст говорит о выгоде, которая не остаётся человеку после смерти. «Ветер» передаёт образ напрасных усилий и не вносит не требуемого контекстом учения о духе; лексическая многозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная конструкция сохраняет афористичность стиха. Тон возвышенный, но общепонятный, без архаизмов и конфессионально окрашенной терминологии.
