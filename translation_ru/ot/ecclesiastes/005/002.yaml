- source_word: הַחֲלוֹם
  choice: сон
  rationale: Несмотря на артикль в еврейском тексте, существительное имеет здесь родовое значение; в русском языке оно естественно передаётся без указательного оттенка.
- source_word: בְּרֹב עִנְיָן
  choice: от множества забот
  rationale: עִנְיָן обозначает занятие, дело или то, что занимает и обременяет человека. «Заботы» естественно передают в данном контексте умственную занятость и обременённость; «от» выражает вероятный причинный оттенок ב, не устраняя иной возможности, отмеченной в сноске.
- source_word: וְקוֹל כְּסִיל
  choice: а голос глупца
  rationale: Сохраняется образ голоса и характерная для литературы мудрости категория «глупца»; союз «а» естественно оформляет параллельное сопоставление.
- source_word: בְּרֹב דְּבָרִים
  choice: от множества слов
  rationale: Повтор «от множества» воспроизводит синтаксический параллелизм двух частей и связывает многословие с голосом глупца без добавления отсутствующего в оригинале сказуемого.
