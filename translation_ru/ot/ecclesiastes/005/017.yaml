source:
  edition: WLC
  text: הִנֵּ֞ה אֲשֶׁר רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר יָפֶ֣ה לֶֽ/אֶכוֹל וְ֠/לִ/שְׁתּוֹת וְ/לִ/רְא֨וֹת טוֹבָ֜ה בְּ/כָל עֲמָל֣/וֹ שֶׁ/יַּעֲמֹ֣ל תַּֽחַת הַ/שֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי חי/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים כִּי ה֥וּא חֶלְקֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/017.yaml
  text: Behold[a], what I myself have seen to be good and fitting is to eat and to drink and to see good in all the labor at which he labors under the sun during the number of the days of his life that God has given him, for this is his portion.
translation:
  language: ru
  text: 'Вот что я сам увидел: хорошо и правильно есть и пить и видеть добро[a] во всём труде, над которым он трудится под солнцем, в течение отмеренного ему срока жизни, который дал ему Бог, потому что это — его доля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наслаждаться добром»; «испытывать добро». Буквально: «видеть добро».'
    reason: Лексическая альтернатива для еврейской идиомы וְלִרְאוֹת טוֹבָה.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-эмфатическую функцию частицы естественным для современного русского языка способом.
- source_word: רָאִיתִי אָנִי
  choice: что я сам увидел
  rationale: Местоимение אָנִי выражено явно и подчёркивает личное наблюдение говорящего; «сам» сохраняет это ударение.
- source_word: טוֹב אֲשֶׁר יָפֶה
  choice: хорошо и подобает
  rationale: Сохраняет сочетание оценки добра и уместности; «подобает» придаёт фразе достойный, но понятный оттенок.
- source_word: לֶאֱכוֹל וְלִשְׁתּוֹת
  choice: есть, пить
  rationale: Прямое и естественное воспроизведение инфинитивов без лишнего усложнения.
- source_word: וְלִרְאוֹת טוֹבָה
  choice: видеть добро
  rationale: Сохраняет буквальный и повторяющийся у Екклесиаста образ; идиоматические значения отмечены в сноске.
- source_word: בְּכָל עֲמָלוֹ שֶׁיַּעֲמֹל
  choice: во всех своих трудах, которыми он трудится
  rationale: Передаёт однокоренное сочетание существительного и глагола, а также местоименные формы оригинала, не вводя отсутствующее существительное «человек» в относительную часть.
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: под солнцем
  rationale: Сохраняет ключевой рефрен книги.
- source_word: מִסְפַּר יְמֵי חַיָּו
  choice: во все отведённые ему дни жизни
  rationale: Естественно передаёт ограниченное, исчисленное количество дней, не добавляя прямо отсутствующего определения «немногие».
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: которые дал ему Бог
  rationale: Прямо передаёт относительное придаточное и личного дарующего — Бога.
- source_word: כִּי הוּא חֶלְקוֹ
  choice: потому что это — его доля
  rationale: «Доля» передаёт отведённую человеку часть жизни и сохраняет тематическую лексику книги.
theological_decisions:
- issue: Подразумеваемый человеческий субъект при инфинитивах и местоименных формах
  choice: «человеку» при «подобает», далее «он»
  alternative: «хорошо и прекрасно есть и пить… в труде, которым трудится человек»
  rationale: Русскому предложению нужен ясный носитель действия. «Человеку» делает универсальный смысл явным, а последующее «он» не усиливает грамматический мужской род сверх требований связности.
- issue: Идиома וְלִרְאוֹת טוֹבָה
  choice: видеть добро
  alternative: наслаждаться добром; испытывать добро
  rationale: Буквальный образ понятен по-русски и сохраняет характерную напряжённость между наблюдением, переживанием и наслаждением; более толковательные варианты вынесены в сноску.
- issue: Мִסְפַּר как указание на исчисленность дней
  choice: отведённые ему дни
  alternative: число дней; немногие дни
  rationale: Формула подчёркивает ограниченность данного Богом срока, но сам стих прямо не говорит, что дней мало. Перевод избегает добавления «немногие».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены ключевые образы «видеть добро», «под солнцем» и «доля»; тяжеловесная буквальная формула «число дней его жизни» передана естественнее без добавления идеи «немногих» дней.
