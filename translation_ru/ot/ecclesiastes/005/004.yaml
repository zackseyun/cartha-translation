- source_word: טוֹב אֲשֶׁר לֹא תִדֹּר
  choice: Лучше не давать обета
  rationale: Безличная сравнительная конструкция естественна для современного русского языка и точно передаёт общеоценочный, афористический смысл еврейского выражения.
- source_word: מִשֶּׁתִּדּוֹר
  choice: чем дать обет
  rationale: Предлог מִן в сочетании с אֲשֶׁר вводит второй член сравнения; русский инфинитив сохраняет краткость и параллелизм.
- source_word: וְלֹא תְשַׁלֵּם
  choice: и не исполнить его
  rationale: В контексте обета Piel глагола שׁלם означает довести обязательство до исполнения, буквально — «уплатить» его. Местоимение «его» естественно восполняет подразумеваемый объект — обет.
