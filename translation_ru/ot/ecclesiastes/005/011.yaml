base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/011.yaml
  text: Sweet is the sleep of the worker[a], whether he eats little or much, but the abundance of the rich man does not let him sleep.
translation:
  language: ru
  text: Сладок сон трудящегося, ест ли он мало или много; а изобилие богатого[a] не даёт ему спать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сытость богатого»; возможны также значения «наполненность» и «пресыщенность». Древнееврейское слово может указывать как на материальное изобилие, так и на состояние сытости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתוּקָה
  choice: сладок
  rationale: Сохраняет конкретный древнееврейский образ сладости, метафорически описывающий приятный, спокойный сон.
- source_word: שְׁנַת הָעֹבֵד
  choice: сон трудящегося
  rationale: Форма сопряжённого состояния передана принадлежностью; причастие от עבד обозначает человека, который трудится. «Трудящийся» естественно и достаточно широко, не сужая смысл до наёмного работника или слуги.
- source_word: אִם מְעַט וְאִם הַרְבֵּה יֹאכֵל
  choice: ест ли он мало или много
  rationale: Передаёт соотносительную конструкцию «будь то… или…» естественным русским оборотом и сохраняет мысль, что сон сладок независимо от количества съеденного.
- source_word: וְהַשָּׂבָע
  choice: а изобилие
  rationale: Существительное может обозначать сытость, наполненность или достаток. В противопоставлении трудящемуся и богатому «изобилие» естественно выражает вероятный смысл, а предметная неоднозначность сохранена в сноске.
- source_word: לֶעָשִׁיר
  choice: богатого
  rationale: 'Предлог ל в данном контексте выражает отношение принадлежности: изобилие, которым обладает богатый человек. Субстантивированное «богатого» сохраняет мужской род и единственное число без тяжеловесного «богатого человека».'
- source_word: אֵינֶנּוּ מַנִּיחַ לוֹ לִישׁוֹן
  choice: не даёт ему спать
  rationale: Естественно передаёт каузативную конструкцию со значением недопущения сна, не добавляя идеи именно о моменте засыпания.
