    text: 'Вторая часть стиха в еврейском тексте синтаксически трудна и буквально очень кратка. Её можно также понять как: «кто любит изобилие — нет прибыли (дохода, приращения)». Возможны и значения «богатство» вместо «изобилие», а также «доход», «приращение» или «урожай» вместо «прибыль».'
