  - marker: b
    text: Евр. «пар» (традиционно «суета») — повторяющийся в Екклесиасте образ чего-то мимолётного, неуловимого или непрочного.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: кто любит
  rationale: Причастие имеет обобщающее значение и описывает всякого человека, которому свойственна любовь к богатству; эта формулировка естественна для современного русского языка.
- source_word: כֶּסֶף
  choice: серебро
  rationale: Слово буквально означает серебро и часто употребляется в значении денег. Буквальный выбор сохраняет образ и повтор исходного текста.
- source_word: יִשְׂבַּע
  choice: не насытится
  rationale: Глагол обозначает насыщение или полное удовлетворение; «не насытится» передаёт образ неутолимого желания и сохраняет метафору.
- source_word: וּמִי
  choice: и кто
  rationale: Сочетание вводит параллельную обобщающую конструкцию. В русском параллелизм с первой частью позволяет естественно восполнить опущенное сказуемое.
- source_word: בֶּהָמוֹן
  choice: изобилие
  rationale: הָמוֹן может означать множество, изобилие или богатство. «Изобилие» сохраняет широту значения, не сводя его только к деньгам.
- source_word: תְבוּאָה
  choice: прибыль
  rationale: Обычно слово означает урожай, плод или доход; в контексте любви к серебру и изобилию «прибыль» ясно передаёт экономический оттенок, сохраняя идею приращения.
- source_word: הָבֶל
  choice: пар
  rationale: Ключевой образ Екклесиаста указывает на нечто мимолётное, неуловимое и непрочное. «Пар» сохраняет конкретную метафору и не сужает её до абстрактной «бессмысленности».
theological_decisions:
- issue: Передача повторяющегося в Екклесиасте слова הָבֶל
  choice: пар
  alternative: суета; дуновение; бессмысленность
  rationale: «Пар» сохраняет исходный образ быстротечности и неуловимости, не разрешая заранее его богословскую и смысловую многозначность.
- issue: Синтаксис второй части стиха
  choice: понимать как параллель к первой части с опущенным сказуемым «не насытится»
  alternative: передать более буквально как «и кто любит изобилие — нет прибыли» либо понимать הָמוֹן как богатство, а תְבוּאָה как доход или приращение
  rationale: Еврейская конструкция предельно кратка и синтаксически трудна. Параллельное прочтение даёт связный смысл, однако неоднозначность отмечена в сноске, а не скрыта.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной поэзии. Повтор «серебро — серебром» и краткий итог сохранены; эллипсис во второй части передан естественной русской параллельной конструкцией.
