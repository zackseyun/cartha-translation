  yaml_path: translation/ot/ecclesiastes/005/013.yaml
  text: And that wealth was lost in a bad venture[b][a], and he fathered a son and had nothing in his hand.
translation:
  language: ru
  text: И пропало то богатство из-за неудачного дела[a]. Он стал отцом сына, а в руках у него ничего не было[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за бедственного дела»; возможно также: «при несчастном стечении обстоятельств». Еврейское выражение может обозначать как пагубное предприятие, так и тяжёлое обстоятельство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и нет в его руке ничего» — то есть у него ничего нет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד
  choice: пропало
  rationale: Глагол Qal, 3-е лицо мужского рода единственного числа; подлежащее — «богатство». «Пропало» естественно передаёт утрату, не уточняя её виновника или способ.
- source_word: הָעֹשֶׁר הַהוּא
  choice: то богатство
  rationale: Сочетание существительного с артиклем и указательным словом обозначает ранее упомянутое богатство.
- source_word: בְּעִנְיַן רָע
  choice: из-за неудачного дела
  rationale: עִנְיָן может означать дело, предприятие или обстоятельство, а רָע — вредное, бедственное либо неудачное. Формулировка сохраняет контекст имущественной потери, не сводя выражение только к рискованному вложению.
- source_word: וְהוֹלִיד בֵּן
  choice: Родился у него сын
  rationale: Hiphil глагола ילד буквально указывает, что мужчина стал отцом. Русская безличная конструкция естественна и сохраняет конкретное значение «сын».
- source_word: וְאֵין בְּיָדוֹ מְאוּמָה
  choice: а в руках у него ничего не осталось
  rationale: Сохранён конкретный еврейский образ «в его руке», означающий отсутствие имущества; «не осталось» связывает его с предшествующей утратой богатства.
