revisions:
- from: Как вышел он из утробы матери своей, так нагим и возвратится — уйдёт таким же, каким пришёл. И ничего из плодов своего труда он не унесёт с собой в руке.[a]
  to: Как вышел он нагим из утробы своей матери, так нагим и возвратится, уходя, как пришёл; и ничего не унесёт он от своего труда — ничего, что мог бы взять в руку.[a]
  rationale: Исправление устраняет добавленное понятие «плодов» и заменяет неточную сноску. Сохранены буквальная нагота, образ материнской утробы, глагол «возвратится», не уточняющий посмертное состояние, и конкретный образ того, что можно взять в руку. Формулировка не навязывает богословского истолкования.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:27:46Z'
review_pass:
  verdict: revise
  source_fidelity: В исходнике говорится, что человек возвращается нагим, уходя так же, как пришёл, и не может унести ничего от своего труда, что мог бы взять в руку. Черновик в целом передаёт мысль, но «из плодов своего труда» добавляет отсутствующее в еврейском тексте понятие плодов/результатов, а сноска неточно и неестественно воспроизводит заключительную конструкцию.
  naturalness: «Уйдёт таким же, каким пришёл» гладко звучит, но «таким же» несколько расширяет текст. Формулировка «возвратится, уходя, как пришёл» сохраняет сжатую связь еврейских глаголов и остаётся понятной в современном литературном русском. «Ничего, что мог бы взять в руку» естественно передаёт конкретный образ.
  terminology: «Утроба матери», «нагим», «возвратится» уместны для умеренно торжественного библейского регистра. «Труд» точно передаёт עָמָל; добавлять «плоды» не следует. Сноска перенесена к заключительной относительной клаузе, к которой она относится.
  issues:
  - severity: medium
    issue: Добавлено «из плодов своего труда».
    rationale: בַּעֲמָלוֹ означает «от/из своего труда, своей тяжкой работы», а не прямо «из плодов труда». Добавление сужает или конкретизирует смысл без необходимости.
  - severity: medium
    issue: 'Сноска даёт неточную и неестественную буквальную передачу: «не понесёт за свой труд, что пошло бы в руке его».'
    rationale: В тексте нет значения «за свой труд», а предложенная русская фраза не отражает функцию относительного предложения שֶׁיּוֹלֵךְ בְּיָדוֹ. Нужна ясная альтернатива, привязанная к заключительной клаузе.
  - severity: low
    issue: Сноска поставлена после «руке», но её формулировка не объясняет текстовый вариант адекватно.
    rationale: Якорь уместнее оставить при заключительной клаузе, но заменить содержание сноски на возможное более буквальное прочтение.
