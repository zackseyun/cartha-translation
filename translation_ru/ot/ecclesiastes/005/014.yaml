base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/014.yaml
  text: As he came from his mother’s womb[a], naked he will return, going as he came; and he will carry away nothing from his labor that he can take in his hand.
translation:
  language: ru
  text: Как вышел он нагим из утробы своей матери, так нагим и возвратится, уходя, как пришёл; и ничего не унесёт он от своего труда — ничего, что мог бы взять в руку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…и ничего не унесёт он от своего труда, что мог бы унести в руке».'
    reason: Заключительная еврейская относительная конструкция допускает более близкое к порядку слов оригинала прочтение; основной текст передаёт её естественно по-русски, сохраняя образ руки.
lexical_decisions:
- source_word: כַּאֲשֶׁר יָצָא מִבֶּטֶן אִמּוֹ
  choice: Как вышел он из утробы матери своей
  rationale: Сохраняет сравнительную конструкцию и конкретный образ рождения; порядок слов придаёт фразе достоинство, не делая её архаичной.
- source_word: עָרוֹם יָשׁוּב
  choice: так нагим и возвратится
  rationale: Передаёт буквальную наготу и глагол возвращения, подчёркивающий одинаковую беспомощность человека при рождении и смерти.
- source_word: לָלֶכֶת כְּשֶׁבָּא
  choice: уйдёт таким же, каким пришёл
  rationale: Естественно передаёт несколько сжатую еврейскую конструкцию и сохраняет параллель между приходом и уходом.
- source_word: וּמְאוּמָה לֹא יִשָּׂא
  choice: И ничего … он не унесёт с собой
  rationale: Полное отрицание מְאוּמָה передано словом «ничего», а יִשָּׂא в контексте смерти — естественным «не унесёт с собой».
- source_word: בַעֲמָלוֹ
  choice: из плодов своего труда
  rationale: עָמָל может обозначать как тягостный труд, так и приобретённое им; контекст требует того, что человек мог бы унести. Добавление «плодов» делает смысл ясным, сохраняя связь с трудом.
- source_word: שֶׁיֹּלֵךְ בְּיָדוֹ
  choice: с собой в руке
  rationale: Сохраняет конкретный образ руки, при этом смысл сопровождения выражен естественным русским оборотом; буквальная синтаксическая форма отмечена в сноске.
theological_decisions:
- issue: Подразумеваемое возвращение при смерти
  choice: Сохранён глагол «возвратится» без уточнения места или состояния, куда возвращается человек.
  alternative: «Вернётся в землю» или явное утверждение о посмертной участи.
  rationale: В данном стихе объект возвращения не назван; добавление земли либо определённого учения о посмертной участи устранило бы намеренную недосказанность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом. «Утроба матери» и «возвратится» сохраняют библейскую образность, тогда как «унесёт с собой» обеспечивает ясность для современного читателя.
