  text: גַּ֣ם כָּֽל הָ/אָדָ֡ם אֲשֶׁ֣ר נָֽתַן ל֣/וֹ הָ/אֱלֹהִים֩ עֹ֨שֶׁר וּ/נְכָסִ֜ים וְ/הִשְׁלִיט֨/וֹ לֶ/אֱכֹ֤ל מִמֶּ֨/נּוּ֙ וְ/לָ/שֵׂ֣את אֶת חֶלְק֔/וֹ וְ/לִ/שְׂמֹ֖חַ בַּ/עֲמָל֑/וֹ זֹ֕ה מַתַּ֥ת אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/018.yaml
  text: Also[a], every man to whom God has given wealth and possessions, and has empowered him to eat from them, and to take his portion[c][b], and to rejoice in his labor—this is the gift of God.
translation:
  language: ru
  text: Также, когда Бог даёт человеку богатство и имущество и наделяет его возможностью пользоваться ими[b], принимать свою долю[c] и радоваться своему труду, — это дар Божий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «дал ему власть есть от этого»; то есть наделил возможностью пользоваться данным ему и получать от него благо.'
    reason: idiom_and_lexical_alternative
  - marker: c
    text: 'Или: «брать свою долю», «получать свой удел». «Доля» — одно из ключевых слов Екклесиаста для того, что отведено человеку в жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Также
  rationale: Сохраняет добавочное значение связки и естественно продолжает мысль предыдущего стиха.
- source_word: כָּל הָאָדָם
  choice: всякому человеку
  rationale: Передаёт дистрибутивный смысл и родовое употребление единственного числа без неестественного для современного русского языка обобщающего «мужчине».
- source_word: עֹשֶׁר וּנְכָסִים
  choice: богатство и имущество
  rationale: Различает материальное изобилие и принадлежащую человеку собственность, сохраняя естественный современный русский язык.
- source_word: וְהִשְׁלִיטוֹ
  choice: наделил способностью
  rationale: Порода гифиль выражает дарованную Богом возможность или власть распорядиться полученным; в контексте речь не только о разрешении, но и о способности извлечь из него благо.
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: пользоваться ими
  rationale: Буквально «есть от этого»; русское «пользоваться ими» естественно передаёт контекстуальный смысл — получать пользу от богатства и имущества, не дублируя последующую радость.
- source_word: וְלָשֵׂאת אֶת חֶלְקוֹ
  choice: брать свою долю
  rationale: Сохраняет активную силу נשׂא и ключевое для Екклесиаста понятие חֵלֶק как отведённой человеку доли.
- source_word: וְלִשְׂמֹחַ בַּעֲמָלוֹ
  choice: радоваться своему труду
  rationale: Передаёт явное значение радости в שמח и весомое значение труда/усилий в עמל.
- source_word: זֹה מַתַּת אֱלֹהִים הִיא
  choice: это дар Божий
  rationale: Прямо и естественно передаёт именное утверждение, относя дар ко всей описанной способности пользоваться полученным.
theological_decisions:
- issue: Родовое значение הָאָדָם
  choice: всякому человеку
  alternative: всякому мужчине
  rationale: Существительное мужского рода в данном изречении обозначает человека вообще. Русское «человеку» сохраняет единственное число и универсальность, не сужая смысл до мужчин.
- issue: Характер Божьего действия в וְהִשְׁלִיטוֹ
  choice: наделил способностью
  alternative: позволил
  rationale: Форма глагола указывает на данную Богом возможность или власть, а не лишь на внешнее разрешение; перевод не уточняет механизм этой способности.
- issue: Содержание «дара Божьего»
  choice: даром названа вся описанная способность пользоваться своей долей и радоваться труду
  alternative: даром названы только богатство и имущество
  rationale: Указательное זֹה естественно подводит итог всей предшествующей конструкции; формулировка сохраняет широту референции без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Синтаксис сохраняет протяжённую условно-относительную конструкцию еврейского текста, но избегает тяжёлых канцеляризмов. «Дар Божий» поддерживает традиционный библейский регистр; «пользоваться ими» передаёт древнееврейскую идиому понятно современному читателю.
