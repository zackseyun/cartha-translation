source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ תִּדֹּ֨ר נֶ֜דֶר לֵֽ/אלֹהִ֗ים אַל תְּאַחֵר֙ לְ/שַׁלְּמ֔/וֹ כִּ֛י אֵ֥ין חֵ֖פֶץ בַּ/כְּסִילִ֑ים אֵ֥ת אֲשֶׁר תִּדֹּ֖ר שַׁלֵּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/003.yaml
  text: When you make a vow to God[a], do not delay in paying it, for he takes no pleasure in fools[b]. Pay what you vow.
translation:
  language: ru
  text: Когда даёшь обет Богу, не медли исполнить его[a], ведь глупцы Ему неугодны[b]. Исполни то, что обещал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не откладывай уплату по нему». Еврейский глагол может означать уплату, завершение или исполнение обещанного по обету.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ведь к глупцам нет благоволения»; тот, кому они неугодны, в еврейском тексте прямо не назван. По контексту подразумевается Бог.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Когда
  rationale: 'Союз вводит обстоятельство времени: наставление относится к случаю, когда человек даёт обет. «Когда» естественно передаёт это значение по-русски.'
- source_word: תִּדֹּר נֶדֶר
  choice: даёшь обет
  rationale: 'Еврейская конструкция с однокоренными глаголом и существительным буквально означает «обещать обет»; по-русски устойчиво и ясно: «дать обет».'
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: В данном контексте речь идёт о Боге, Которому человек даёт обет.
- source_word: אַל תְּאַחֵר לְשַׁלְּמוֹ
  choice: не медли исполнить его
  rationale: Глагол שׁלם может обозначать уплату, завершение или исполнение обязательства. «Исполнить обет» — естественное русское сочетание, охватывающее как денежные, так и иные обеты.
- source_word: כִּי אֵין חֵפֶץ בַּכְּסִילִים
  choice: ведь глупцы Ему неугодны
  rationale: Еврейская фраза буквально говорит об отсутствии благоволения к глупцам, не называя явно того, кому они неугодны. Русская формулировка естественно выражает подразумеваемую связь с Богом, упомянутым непосредственно перед этим.
- source_word: אֵת אֲשֶׁר תִּדֹּר שַׁלֵּם
  choice: Исполни то, что обещал
  rationale: Повеление кратко и настойчиво повторяет обязанность довести обет до исполнения. «То, что обещал» естественно передаёт объектную конструкцию «то, о чём дал обет».
theological_decisions:
- issue: Подразумеваемый носитель отношения в выражении אֵין חֵפֶץ בַּכְּסִילִים
  choice: Передать как «глупцы Ему неугодны», относя местоимение к Богу.
  alternative: 'Сохранить безличную конструкцию: «к глупцам нет благоволения».'
  rationale: Ближайший контекст говорит об обете Богу, поэтому именно Божье отношение объясняет предостережение. Сноска сохраняет формальную неопределённость еврейской фразы.
- issue: Смысл כְּסִילִים
  choice: «глупцы» как нравственно-религиозная категория литературы мудрости.
  alternative: «неразумные» или «глупые люди».
  rationale: Слово характеризует не просто недостаток ума, а безрассудное и нравственно порочное отношение к Богу и своим обязательствам.
translation_notes:
  register: Современный литературный русский язык; обращение во втором лице единственного числа сохраняет прямой наставительный тон оригинала. Формулировки краткие и торжественные без архаизмов.
