base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/016.yaml
  text: I said in my heart, saying, “I—look—I have become great and increased in wisdom beyond all who were before me over Jerusalem, and my heart has seen much wisdom and knowledge.”
translation:
  language: ru
  text: 'Я сказал в своём сердце: «Вот, я стал велик и умножил мудрость больше всех, кто был до меня в Иерусалиме, и сердце моё познало много мудрости и знания».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבַּרְתִּי אֲנִי עִם לִבִּי
  choice: Я сказал в своём сердце
  rationale: Естественно передаёт древнееврейскую идиому внутренней речи, сохраняя образ сердца.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую частицу и привлекает внимание к последующему утверждению.
- source_word: הִגְדַּלְתִּי
  choice: я возвеличился
  rationale: Передаёт значение достижения величия, не сводя его только к накоплению знаний.
- source_word: וְהוֹסַפְתִּי חָכְמָה
  choice: и умножил мудрость
  rationale: 'Сохраняет каузативно-накопительное значение: говорящий увеличил имеющуюся у него мудрость.'
- source_word: עַל כָּל אֲשֶׁר הָיָה לְפָנַי עַל יְרוּשָׁלִָם
  choice: больше всех, кто был до меня над Иерусалимом
  rationale: Сохраняет сравнительное עַל и неоднозначную формулировку власти или положения «над Иерусалимом», не подменяя её более узким словом «царствовал».
- source_word: וְלִבִּי רָאָה הַרְבֵּה חָכְמָה וָדָעַת
  choice: и сердце моё познало много мудрости и знания
  rationale: Русское «познало» естественно выражает опытное восприятие, обозначенное буквально глаголом «видело», при сохранении образа сердца.
theological_decisions:
- issue: Круг предшественников говорящего в Иерусалиме
  choice: кто был до меня над Иерусалимом
  alternative: кто правил до меня в Иерусалиме
  rationale: Исходный текст не употребляет глагол «царствовать» или «править»; выбранный вариант сохраняет историко-литературную напряжённость и не уточняет личность говорящего сверх текста.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис слегка приподнят, но понятен; повтор образа сердца сохранён как значимый элемент оригинала.
