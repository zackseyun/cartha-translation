  yaml_path: translation/ot/ecclesiastes/001/008.yaml
  text: All things are wearisome; a man cannot speak of it. The eye is not satisfied with seeing, nor is the ear filled with hearing.
translation:
  language: ru
  text: Всё[a] утомительно; человек не в силах этого выразить.[b] Глаз не насыщается от зрения, и ухо не наполняется от слышания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все слова утомительны»; еврейское דְּבָרִים может означать «слова», «дела», «обстоятельства» или «вещи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «человек не может говорить». Еврейский текст может означать, что человек не способен исчерпывающе выразить всё это или что оно слишком утомительно для описания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַדְּבָרִים
  choice: Всё
  rationale: דְּבָרִים допускает значения «слова», «дела», «обстоятельства» и «вещи». В контексте круговорота мира обобщающее «всё» естественно по-русски и сохраняет широту отсылки, не сужая её до речи.
- source_word: יְגֵעִים
  choice: утомительно
  rationale: Форма передаёт изнурительность, тягостность или вызываемую усталость. «Утомительно» кратко и естественно выражает это качество.
- source_word: לֹא יוּכַל אִישׁ לְדַבֵּר
  choice: человек не в силах этого выразить
  rationale: אִישׁ передано родовым существительным «человек». Глагол דּבר буквально означает «говорить», но в контексте может указывать на неспособность исчерпывающе высказать описываемое; «этого» проясняет отсылку, а примечание сохраняет буквальную альтернативу.
- source_word: לֹא תִשְׂבַּע עַיִן לִרְאוֹת
  choice: Глаз не насыщается тем, что видит
  rationale: שׂבע означает «насыщаться, получать довольно». Представительное единственное число «глаз» сохранено, а придаточная конструкция естественно передаёт еврейский инфинитив «видеть».
- source_word: וְלֹא תִמָּלֵא אֹזֶן מִשְּׁמֹעַ
  choice: и ухо не наполняется тем, что слышит
  rationale: Сохранён отдельный образ מלא — «наполняться», отличный от предыдущего «насыщаться». Единственное число имеет обобщающий смысл.
