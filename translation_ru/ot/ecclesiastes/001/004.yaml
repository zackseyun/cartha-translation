  text: דּ֤וֹר הֹלֵךְ֙ וְ/ד֣וֹר בָּ֔א וְ/הָ/אָ֖רֶץ לְ/עוֹלָ֥ם עֹמָֽדֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/004.yaml
  text: A generation goes[a], and a generation comes[b], but the earth stands forever.
translation:
  language: ru
  text: Поколение уходит, и поколение приходит, а земля стоит вечно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «остаётся навеки». Буквально еврейский глагол означает «стоит» и создаёт конкретный образ устойчивости. «Вечно» здесь передаёт выражение длительной непрерывности, подчёркивающее контраст между сменой поколений и устойчивостью земли.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: דּוֹר
  choice: поколение
  rationale: Означает поколение людей, живущих в одно время; повтор сохраняет параллелизм еврейского текста.
- source_word: הֹלֵךְ
  choice: уходит
  rationale: Причастие выражает постоянное, повторяющееся действие. «Уходит» естественно передаёт образ движения, не добавляя толкования «умирает».
- source_word: בָּא
  choice: приходит
  rationale: Кратко и симметрично передаёт противопоставленный глагол בוא.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В этом универсальном размышлении речь идёт о земле как мире, а не об отдельной стране.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Передаёт идиому длительной непрерывности и риторически противопоставляет устойчивость земли смене поколений.
- source_word: עֹמָדֶת
  choice: стоит
  rationale: Сохраняет конкретный образ еврейского עמד; возможное смысловое прочтение — «остаётся».
theological_decisions:
- issue: Следует ли понимать לְעוֹלָם как абсолютное метафизическое утверждение или как риторическое обозначение длительной устойчивости
  choice: «вечно» в основном тексте
  alternative: «из века в век»; «остаётся навеки»
  rationale: Стих противопоставляет сменяющиеся человеческие поколения устойчивости земли в языке наблюдательной мудрости. Перевод сохраняет силу и напряжение исходного утверждения, не превращая его в уточнённый тезис о космологии.
translation_notes:
  register: Современный литературный русский язык; краткий афористичный строй и параллелизм оригинала сохранены. Союз «а» естественно выражает противопоставление.
