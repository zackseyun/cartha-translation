  text: מַה שֶּֽׁ/הָיָה֙ ה֣וּא שֶׁ/יִּהְיֶ֔ה וּ/מַה שֶׁ/נַּֽעֲשָׂ֔ה ה֖וּא שֶׁ/יֵּעָשֶׂ֑ה וְ/אֵ֥ין כָּל חָדָ֖שׁ תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/009.yaml
  text: What has been is what will be[a], and what has been done is what will be done; and there is nothing new under the sun.
translation:
  language: ru
  text: Что было, то и будет; и что было сделано, то и будет сделано; и нет ничего нового под солнцем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: Что было
  rationale: Субстантивированная относительная конструкция означает «то, что было». В русском афористическом высказывании краткое «что было» звучит естественно и точно.
- source_word: הוּא שֶׁיִּהְיֶה
  choice: то и будет
  rationale: Местоимение הוּא вместе с относительным оборотом образует конструкцию тождества. Частица «и» естественно передаёт мысль о повторяемости, не превращая её в пояснительное «будет тем же самым».
- source_word: וּמַה שֶׁנַּעֲשָׂה
  choice: и что делалось
  rationale: Нифаль от עשה имеет страдательно-результативное значение. Несовершенный вид «делалось» в русском лучше поддерживает контекст повторяющихся явлений и параллелизм изречения; возможное «было сделано» звучит как указание на единичный завершённый поступок.
- source_word: הוּא שֶׁיֵּעָשֶׂה
  choice: то и будет делаться
  rationale: Сохранена страдательная форма и точный параллелизм с «что делалось»; более широкое «то и произойдёт» устранило бы лексическую связь двух форм עשה.
- source_word: וְאֵין כָּל חָדָשׁ
  choice: и нет ничего нового
  rationale: Отрицательная экзистенциальная конструкция אֵין + כָּל естественно передаётся по-русски как «нет ничего нового» и сохраняет всеобщую силу высказывания.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Устойчивое выражение Екклесиаста, обозначающее наблюдаемую сферу земной человеческой жизни; традиционное русское соответствие ясно современному читателю.
theological_decisions:
- issue: Пределы утверждения в мировоззрении Екклесиаста
  choice: Сохранить высказывание как всеобщее наблюдение о повторяемости земной жизни, ограниченное словами «под солнцем».
  alternative: Понимать стих как абсолютное метафизическое отрицание всякой новизны в любом смысле.
  rationale: Выражение «под солнцем» задаёт сферу наблюдаемой человеческой жизни. Перевод сохраняет категоричность риторической формулы, но не добавляет толкования, расширяющего её за пределы самого стиха.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Повтор глагольных форм и симметрия частей сохранены как важные черты еврейского оригинала.
