base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/011.yaml
  text: There is no remembrance of the former ones[a], and even of the later ones who will be, there will be no remembrance among those who will come afterward.
translation:
  language: ru
  text: Нет памяти о прежних[a], и о тех, кто будет позднее, не останется памяти у тех, кто будет ещё позднее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нет памяти о прежних, и даже о последующих, которые будут, не останется памяти среди тех, кто будет позднее». Еврейские формы множественного числа могут относиться к людям, поколениям или предшествующему и последующему в более широком смысле.'
    reason: Уточняет сохранённую переводом широту субстантивированных форм и отмечает возможный способ передать עִם как «среди», не навязывая более узкого толкования.
lexical_decisions:
- source_word: אֵין
  choice: не остаётся
  rationale: Экзистенциальное отрицание передано естественной русской конструкцией, выражающей отсутствие сохраняющейся памяти.
- source_word: זִכְרוֹן / זִכָּרוֹן
  choice: память
  rationale: В контексте речь идёт о сохранении воспоминания о прежних и будущих людях; «память» естественно передаёт абстрактное значение и позволяет сохранить повтор.
- source_word: לָרִאשֹׁנִים
  choice: о прежних
  rationale: Предлог ל отмечает объект памяти. Субстантивированное «прежние» сохраняет широту еврейского выражения и не уточняет без необходимости, люди это, поколения или предшественники.
- source_word: וְגַם
  choice: и даже
  rationale: Передаёт как соединение, так и усилительный оттенок גַּם.
- source_word: לָאַחֲרֹנִים שֶׁיִּהְיוּ
  choice: о тех, кто будет после них
  rationale: Передаёт будущую группу «последующих» естественно по-русски; «после них» делает временное противопоставление прежним ясным, не сводя его к конкретному поколению.
- source_word: לֹא יִהְיֶה לָהֶם זִכָּרוֹן
  choice: не останется памяти
  rationale: Еврейская экзистенциально-посессивная конструкция допускает понимание «о них не будет памяти»; русский оборот сохраняет смысл забвения и параллелизм первой части.
- source_word: עִם
  choice: у
  rationale: Здесь выражена связь с группой, в памяти которой могли бы сохраниться последующие люди. Русское «у тех» идиоматично обозначает носителей памяти.
- source_word: שֶׁיִּהְיוּ לָאַחֲרֹנָה
  choice: кто придёт ещё позднее
  rationale: Передаёт группу, следующую по времени даже за уже названными будущими людьми; «ещё» ясно отмечает последовательность.
