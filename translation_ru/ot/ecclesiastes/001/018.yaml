lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущей мыслью и естественно звучит в русском афористическом высказывании.
- source_word: בְּרֹב חָכְמָה
  choice: где много мудрости
  rationale: Русская соотносительная конструкция «где много..., там много...» естественно передаёт обстоятельственное בְּ и сохраняет мерный параллелизм стиха.
- source_word: רָב כָּעַס
  choice: много томления
  rationale: «Томление» охватывает душевную тяготу и мучительное беспокойство, не сужая כָּעַס до одного лишь гнева; неоднозначность отмечена в сноске.
- source_word: וְיוֹסִיף דַּעַת
  choice: и кто умножает знание
  rationale: Обобщённо-личная конструкция передаёт причастное значение формы глагола и сохраняет характер изречения.
- source_word: יוֹסִיף מַכְאוֹב
  choice: тот умножает боль
  rationale: Повтор «умножает... умножает» воспроизводит намеренный повтор יוֹסִיף и сохраняет широкое значение מַכְאוֹב — физическую или душевную боль.
