lexical_decisions:
- source_word: מַה יִּתְרוֹן
  choice: Какую пользу получает
  rationale: יִתְרוֹן обозначает выгоду, преимущество или остающийся итог. «Пользу» естественно передаёт вопрос о конечном результате труда; глагол «получает» добавлен для полноценной русской конструкции, не меняя смысла еврейского именного вопроса.
- source_word: לָאָדָם
  choice: человек
  rationale: אָדָם употреблено в единственном числе как обобщённое обозначение человека. Русское «человек» сохраняет и грамматическое число, и представительное значение без указания исключительно на мужчин.
- source_word: בְּכָל עֲמָלוֹ
  choice: от всего труда
  rationale: Предлог передан как «от», поскольку речь идёт о пользе, извлекаемой из труда. Единственное число «труд» сохраняет форму исходного текста и охватывает всю совокупность усилий человека.
- source_word: שֶׁיַּעֲמֹל
  choice: которым он трудится
  rationale: Сохранены относительная конструкция и намеренный повтор однокоренных существительного и глагола, важный для риторики стиха.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Прямой и естественный перевод программного для Екклесиаста выражения, обозначающего земную, наблюдаемую область жизни.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: человек
  alternative: люди; человечество
  rationale: Единственное число «человек» точно сохраняет форму оригинала и в современном русском языке естественно выражает обобщение, не ограничивая высказывание мужским полом.
translation_notes:
  register: Современный литературный русский язык с лаконичной риторической формой. Сохранены ключевое выражение «под солнцем» и корневой повтор «труд — трудится»; неизбежная лёгкая необычность повтора соответствует выразительности еврейского текста.
