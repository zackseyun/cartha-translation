source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת כָּל הַֽ/מַּעֲשִׂ֔ים שֶֽׁ/נַּעֲשׂ֖וּ תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֥ה הַ/כֹּ֛ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/014.yaml
  text: I have seen all the works that are done under the sun[a], and behold[b], all is vanity and a striving after wind.
translation:
  language: ru
  text: 'Я видел все дела, какие совершаются под солнцем, и вот: всё — суета[a] и погоня за ветром[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское הֶבֶל может означать «дуновение», «пар» или «тщета»; у Екклесиаста это слово указывает на мимолётное, неуловимое и приводящее к разочарованию, а не только на «бессмысленное».
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение רְעוּת רוּחַ, вероятно, означает бесплодную попытку достичь неуловимого; более буквальный возможный перевод — «пастьба ветра».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Я видел
  rationale: Форма qal perfect 1-го лица ед. числа обозначает завершённое наблюдение, лежащее в основе настоящего вывода; русское прошедшее время естественно передаёт этот смысл.
- source_word: כָּל הַמַּעֲשִׂים
  choice: все дела
  rationale: מַעֲשִׂים охватывает поступки, труды и человеческую деятельность вообще; «дела» сохраняет широту значения и звучит естественно.
- source_word: שֶׁנַּעֲשׂוּ
  choice: какие совершаются
  rationale: Нифаль указывает на совершаемые действия; настоящее время по-русски выражает обобщённый характер наблюдения, а не только разовое прошлое событие.
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: под солнцем
  rationale: Сохранён ключевой для Екклесиаста образ земной сферы человеческой жизни.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: «И вот» естественно передаёт указательно-эмфатическую функцию הִנֵּה в современном литературном русском.
- source_word: הַכֹּל
  choice: всё
  rationale: Слово обобщает всю совокупность только что упомянутых дел; краткое «всё» сохраняет силу исходного вывода.
- source_word: הֶבֶל
  choice: суета
  rationale: Традиционное русское соответствие сохраняет связь с лейтмотивом книги, однако многозначность еврейского образа — мимолётность, неуловимость и тщетность — раскрыта в сноске.
- source_word: רְעוּת רוּחַ
  choice: погоня за ветром
  rationale: Выражение передаёт образ бесплодного стремления овладеть неуловимым и звучит ясно для современного читателя; более буквальная возможность отмечена в сноске.
theological_decisions:
- issue: Смысл הֶבֶל
  choice: Не сводить слово к утверждению о полной бессмысленности всего сущего
  alternative: «всё бессмысленно»
  rationale: Образ הֶבֶל прежде всего связан с дыханием или паром и допускает оттенки мимолётности, неуловимости и тщетности; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «И вот» предпочтено архаичному «и се», а традиционное «суета» сохранено с поясняющей сноской, чтобы оно не понималось лишь как хлопотливость или оживлённая деятельность.
