source:
  edition: WLC
  text: אֲנִ֣י קֹהֶ֗לֶת הָיִ֥יתִי מֶ֛לֶךְ עַל יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/012.yaml
  text: I[a], Qoheleth, was king over Israel in Jerusalem.
translation:
  language: ru
  text: Я, Кохелет[a], был царём над Израилем в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Кохелет» можно также перевести как «Учитель» или «Проповедник».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Я
  rationale: Самостоятельное местоимение сохраняет подчёркнутое самоопределение говорящего в начале высказывания.
- source_word: קֹהֶלֶת
  choice: Кохелет
  rationale: Транслитерация сохраняет особое, близкое к имени или титулу обозначение говорящего и не устраняет спорную смысловую многозначность еврейского слова.
- source_word: הָיִיתִי
  choice: был
  rationale: Форма перфекта 1-го лица единственного числа в ретроспективном контексте естественно передаётся русским прошедшим временем.
- source_word: מֶלֶךְ
  choice: царём
  rationale: После глагола «был» название царской должности естественно ставится в творительном падеже.
- source_word: עַל
  choice: над
  rationale: Предлог обозначает власть и правление над Израилем; «над» непосредственно сохраняет эту связь.
- source_word: יִשְׂרָאֵל
  choice: Израилем
  rationale: Общепринятая русская форма имени; творительный падеж обусловлен предлогом «над».
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Предлог ב здесь имеет обычное местное значение, естественно передаваемое русским «в».
theological_decisions:
- issue: Переводить ли קֹהֶלֶת как титул или сохранить транслитерированное обозначение
  choice: Кохелет
  alternative: Учитель; Проповедник; Собирающий собрание
  rationale: Точное значение слова остаётся спорным, а в книге оно служит характерным обозначением говорящего. Транслитерация не навязывает более узкого толкования и сохраняет неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным синтаксисом. Порядок компонентов близок к еврейскому оригиналу, но падежное оформление естественно для русского языка.
