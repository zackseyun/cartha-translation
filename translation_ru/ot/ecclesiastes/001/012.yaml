  source_fidelity: 'Русский текст точно передаёт все элементы еврейского стиха: эмфатическое «Я», обозначение говорящего קֹהֶלֶת через транслитерацию, прошедшее состояние «был», царскую власть «над Израилем» и локатив «в Иерусалиме». Транслитерация «Кохелет» оправданно сохраняет спорную семантику исходного обозначения.'
  naturalness: Фраза «Я, Кохелет, был царём над Израилем в Иерусалиме» грамматически корректна и звучит естественно в современном литературном русском с уместным библейско-литературным достоинством. Сочетание «царь над Израилем» несколько формальнее, чем «царь Израиля», но точно отражает עַל в значении власти над народом.
  terminology: «Кохелет» последовательно передаёт имяподобный/титульный характер קֹהֶלֶת и не навязывает спорное толкование. «Царь», «Израиль» и «Иерусалим» нормативны. Сноска корректно предлагает основные переводные альтернативы и надлежащим образом привязана к «Кохелет».
