  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ru
  text: Дуновение дуновений[a], — говорит Кохелет[b], — дуновение дуновений; всё — лишь дуновение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  choice: дуновение
  rationale: Еврейское слово буквально обозначает дыхание, дуновение или пар и в книге одновременно вызывает представления о мимолётности, неуловимости и несоответствии между ожиданием и действительностью. Конкретный образ «дуновение» сохраняет эту многозначность лучше, чем абстрактные варианты «суета», «тщета» или «бессмысленность».
- source_word: הֲבֵל הֲבָלִים
  choice: дуновение дуновений
  rationale: Сочетание существительного с его формой множественного числа выражает еврейскую превосходную степень по модели «Песнь песней» и «Святое святых». Формулировка сохраняет и образ, и форму оригинала.
- source_word: אָמַר
  choice: говорит
  rationale: Хотя глагол имеет форму завершённого действия, в литературной формуле авторского изречения настоящее время по-русски естественно передаёт живое, непреходящее высказывание.
- source_word: קֹהֶלֶת
  choice: Кохелет
  rationale: Транслитерация сохраняет открытым значение еврейского обозначения и не сужает его заранее до толкований «Учитель» или «Проповедник».
- source_word: הַכֹּל
  choice: всё
  rationale: Краткое русское «всё» естественно передаёт всеохватность выражения.
- source_word: הָבֶל
  choice: лишь дуновение
  rationale: Частица «лишь» при сказуемом передаёт оценочную, обесценивающую силу заключения и не позволяет понять фразу как буквальное утверждение о физической сущности всего существующего.
theological_decisions:
- issue: Передача ключевого образа הֶבֶל
  choice: 'Сохранить конкретный образ: «дуновение дуновений» и «лишь дуновение».'
  alternative: «Суета сует», «полная тщета», «всё бессмысленно», «всё мимолётно».
  rationale: Абстрактные варианты выбирают лишь один аспект значения и могут навязать книге вывод о всеобщей бессмысленности, которого само слово не требует. Образ дуновения сохраняет напряжение между мимолётностью, неуловимостью и разочаровывающей непредсказуемостью.
- issue: Значение обозначения קֹהֶלֶת
  choice: Кохелет
  alternative: Учитель; Проповедник; Собирающий собрание
  rationale: Этимология и функция обозначения допускают разные оттенки; транслитерация не превращает одно из толкований в бесспорный перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством и афористической краткостью. Повтор и конструкция превосходной степени сохранены намеренно. Тире оформляют вставную формулу речи и усиливают заключительный приговор; «лишь» передаёт его оценочную силу без превращения образа в отвлечённое учение о бессмысленности.
