base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/017.yaml
  text: And I set my heart to know wisdom[a], and to know madness and folly; I came to know that this too is a chasing after wind.
translation:
  language: ru
  text: Я направил своё сердце на познание мудрости и на познание безумия и глупости. Я узнал, что и это — погоня за ветром[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стремление поймать ветер»; традиционный перевод: «томление духа».'
    reason: Сочетание רַעְיוֹן רוּחַ допускает разные толкования; основной перевод передаёт наиболее вероятный образ тщетной погони, а примечание сохраняет лексическую неопределённость и традиционный вариант.
lexical_decisions:
- source_word: וָאֶתְּנָה לִבִּי
  choice: Я обратил сердце
  rationale: Сохранён древнееврейский образ сознательного направления внутреннего внимания и воли; выражение звучит возвышенно, но остаётся понятным в современном русском языке.
- source_word: לָדַעַת / וְדַעַת
  choice: познать / и познать
  rationale: Повтор глагола передаёт параллелизм оригинала и указывает на познание через целенаправленное исследование.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное и контекстуально точное обозначение исследуемой Кохелетом практической и интеллектуальной мудрости.
- source_word: הוֹלֵלוֹת
  choice: безумие
  rationale: Слово обозначает не просто недостаток мудрости, а иррациональность или безумное поведение; перевод отличает его от следующего שִׂכְלוּת.
- source_word: שִׂכְלוּת
  choice: глупость
  rationale: Передаёт противоположное мудрости качество и сохраняет смысловое различие с «безумием».
- source_word: יָדַעְתִּי
  choice: Я узнал
  rationale: 'Перфект подводит итог предпринятому исследованию: говорящий сообщает сделанный им вывод.'
- source_word: שֶׁגַּם זֶה הוּא
  choice: что и это —
  rationale: 'Частица גַּם имеет добавочное значение: данный опыт также относится к уже описанной категории.'
- source_word: רַעְיוֹן רוּחַ
  choice: погоня за ветром
  rationale: Передаёт образ бесплодной попытки добиться неуловимого результата. Значение первого существительного обсуждается, поэтому альтернативу следует сохранить в примечании.
