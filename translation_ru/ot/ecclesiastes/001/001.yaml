lexical_decisions:
- source_word: דִּבְרֵי
  choice: Слова
  rationale: Форма сопряжённого множественного числа от דָּבָר вводит содержание книги. «Слова» — прямой и естественный русский эквивалент; «изречения» было бы несколько более истолковывающим.
- source_word: קֹהֶלֶת
  choice: Кохелета
  rationale: Особое еврейское обозначение говорящего имеет спорное значение. Транслитерация сохраняет форму и неоднозначность оригинала, не сводя её заранее к «Учителю», «Проповеднику» или участнику собрания.
- source_word: בֶּן דָּוִד
  choice: сына Давида
  rationale: Прямо передаёт еврейское родственное выражение и сохраняет его возможный царский оттенок без дополнительных толкований.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Обычный русский эквивалент מֶלֶךְ; контекст не требует более свободной передачи.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог ב здесь обозначает местонахождение; «в Иерусалиме» — естественная современная русская формулировка.
theological_decisions:
- issue: Переводить ли קֹהֶלֶת как функциональный титул или сохранить его как транслитерированное обозначение
  choice: Кохелет в основном тексте
  alternative: Учитель; Проповедник; человек, связанный с собранием
  rationale: Точное значение еврейского слова спорно и существенно для литературного образа говорящего. Транслитерация сохраняет подлинную неоднозначность, а примечание сообщает основные варианты смысла.
translation_notes:
  register: Современный литературный русский язык, сжатый и торжественный зачин. Родительный ряд «Кохелета, сына Давида, царя» естественно передаёт синтаксис оригинала; неоднозначное обозначение говорящего сохранено транслитерацией.
