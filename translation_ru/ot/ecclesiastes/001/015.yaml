  text: מְעֻוָּ֖ת לֹא יוּכַ֣ל לִ/תְקֹ֑ן וְ/חֶסְר֖וֹן לֹא יוּכַ֥ל לְ/הִמָּנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/015.yaml
  text: What is crooked cannot be made straight[b][a], and what is lacking cannot be counted.
translation:
  language: ru
  text: Кривое нельзя выпрямить[a], а недостающее нельзя сосчитать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Искривлённое невозможно сделать прямым».'
    reason: 'Лексическая альтернатива: מְעֻוָּת и לִתְקֹן допускают более развёрнутую передачу страдательного значения и образа выпрямления.'
  - marker: b
    text: 'Или: «недостачу нельзя учесть».'
    reason: 'Лексическая альтернатива: חֶסְרוֹן может обозначать отвлечённую недостачу, а מנה — подсчёт или учёт.'
lexical_decisions:
- source_word: מְעֻוָּת
  choice: кривое
  rationale: Страдательное причастие от עוה обозначает нечто искривлённое, извращённое или нарушенное. Субстантивированное «кривое» сохраняет отвлечённый, афористический характер еврейского выражения и образную связь с «выпрямить».
- source_word: לֹא יוּכַל
  choice: нельзя
  rationale: Сочетание выражает невозможность или неспособность. Безличная конструкция «нельзя» естественна для современного русского языка и не уточняет причину невозможности.
- source_word: לִתְקֹן
  choice: выпрямить
  rationale: Глагол תקן здесь означает сделать прямым или привести в порядок. «Выпрямить» сохраняет конкретный образ, образующий пару со словом «кривое», тогда как «исправить» было бы шире и толковательнее.
- source_word: וְחֶסְרוֹן
  choice: а недостающее
  rationale: Существительное обозначает недостаток, недостачу или то, чего недостаёт. «Недостающее» сохраняет параллелизм с субстантивированным «кривое»; союз передан как «а», поскольку по-русски он естественно связывает два параллельных, но различных утверждения.
- source_word: לְהִמָּנוֹת
  choice: сосчитать
  rationale: Нифальский инфинитив от מנה означает быть сосчитанным или учтённым. В русской безличной конструкции активный инфинитив «сосчитать» передаёт тот же смысл естественнее, чем тяжеловесное «быть сосчитанным».
