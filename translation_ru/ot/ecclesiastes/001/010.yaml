  yaml_path: translation/ot/ecclesiastes/001/010.yaml
  text: Is there a thing of which one says[a], “See, this is new”? It has already been in the ages before us.
translation:
  language: ru
  text: 'Есть ли что-нибудь, о чём говорят: «Смотри, вот это новое»? Оно уже было в веках, предшествовавших нам.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в веках, которые были прежде нас».'
    reason: Сноска показывает более формальную структуру еврейского выражения и сохраняет образ последовательности веков.
lexical_decisions:
- source_word: יֵשׁ
  choice: Есть ли
  rationale: В контексте выражение вводит риторический вопрос; такая передача естественна по-русски и продолжает мысль предыдущего стиха.
- source_word: דָּבָר
  choice: что-нибудь
  rationale: Широкое значение слова охватывает любую вещь, явление или дело, которое могут объявить новым.
- source_word: שֶׁיֹּאמַר
  choice: о чём говорят
  rationale: Неопределённо-личная форма передаёт общий, повторяющийся характер высказывания без уточнения говорящего.
- source_word: רְאֵה
  choice: Смотри
  rationale: Современная и естественная передача повелительного призыва обратить внимание; не имеет архаического оттенка слова «се».
- source_word: זֶה חָדָשׁ הוּא
  choice: вот это новое
  rationale: «Вот» сохраняет указательную силу זֶה, а фраза естественно звучит как заявление о мнимой новизне.
- source_word: כְּבָר הָיָה
  choice: уже было
  rationale: Передаёт подчёркнутое предшествующее существование того, что теперь называют новым.
- source_word: לְעֹלָמִים אֲשֶׁר הָיָה מִלְּפָנֵינוּ
  choice: в прежние века, до нас
  rationale: Сохраняет множественное число и широкий временной охват, при этом звучит естественно в современном русском языке.
