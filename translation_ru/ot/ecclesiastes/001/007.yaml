  text: כָּל הַ/נְּחָלִים֙ הֹלְכִ֣ים אֶל הַ/יָּ֔ם וְ/הַ/יָּ֖ם אֵינֶ֣/נּוּ מָלֵ֑א אֶל מְק֗וֹם שֶׁ֤/הַ/נְּחָלִים֙ הֹֽלְכִ֔ים שָׁ֛ם הֵ֥ם שָׁבִ֖ים לָ/לָֽכֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/007.yaml
  text: All the streams flow into the sea[a], yet the sea is not full; to the place where the streams flow[b], there they return to flow again.
translation:
  language: ru
  text: Все потоки текут в море[a], но море не наполняется; к месту, куда текут потоки[b], туда они возвращаются, чтобы течь снова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «реки». Еврейское слово נְחָלִים в зависимости от контекста может обозначать потоки, реки, временные водотоки или их русла.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к месту, куда потоки идут, туда они возвращаются, чтобы идти». Эти слова могут передавать повторяющийся круговорот вод, не объясняя его механизма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: потоки
  rationale: Слово может обозначать потоки, русла временных водотоков или реки. «Потоки» здесь достаточно широко передаёт образ движущейся воды, не уточняя без основания размер или постоянство водотоков.
- source_word: הֹלְכִים
  choice: текут
  rationale: Глагол буквально означает «идут», но применительно к воде естественный русский эквивалент — «текут».
- source_word: יָם
  choice: море
  rationale: Основное значение еврейского слова — «море»; вариант «океан» был бы излишне конкретным.
- source_word: אֵינֶנּוּ מָלֵא
  choice: не наполняется
  rationale: Передаёт продолжающееся состояние в данном контексте, не добавляя прямо отсутствующее в еврейском тексте слово «никогда».
- source_word: מְקוֹם
  choice: место
  rationale: Сохранено буквальное «место» без истолковывающей замены на «исток».
- source_word: שָׁם
  choice: туда
  rationale: Русское «туда» естественно сохраняет указательное возобновление мысли после оборота «к месту, куда…».
- source_word: שָׁבִים
  choice: возвращаются
  rationale: Прямо передаёт значение повторного движения и поддерживает образ круговорота.
- source_word: לָלָכֶת
  choice: чтобы течь снова
  rationale: Буквально — «чтобы идти». Для потоков по-русски естественно «течь»; «снова» выражает повторность, подразумеваемую сочетанием с «возвращаются».
theological_decisions:
- issue: Описывает ли стих прямо механизм круговорота воды
  choice: Механизм не уточняется; сохранён образ повторяющегося движения вод.
  alternative: Перевести «возвращаются к своим истокам» или прямо назвать круговорот воды.
  rationale: Еврейский текст говорит о «месте» и возвращении потоков, но не называет истоки, испарение или иной механизм; толкование не следует вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык с поэтической размеренностью. Синтаксический параллелизм и повтор указательного слова сохранены, но буквальное «идут» применительно к воде передано естественным глаголом «текут».
