    issue: «Предал я сердце своё»
    rationale: В современном русском «предать сердце» не является ясным эквивалентом еврейской идиомы и может читаться в значениях, не связанных с сосредоточением ума и воли.
  - severity: low
    issue: «Изведать»
    rationale: Слово стилистически устарело и обычно обозначает испытать, пережить; в данном контексте оно менее точно передаёт исследовательский оттенок לָתוּר.
