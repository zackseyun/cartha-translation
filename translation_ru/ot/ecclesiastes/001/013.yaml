base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/013.yaml
  text: And I set my heart to seek and to explore by wisdom all that is done under heaven[b][a]. It is an unhappy task God has given to the sons of man to be occupied with.
translation:
  language: ru
  text: Я обратил своё сердце к тому, чтобы мудростью исследовать и изучить всё, что делается под небом. Это тяжкое занятие дал Бог сынам человеческим[b], чтобы они занимались им[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они трудились над ним»; возможно также: «чтобы они мучились из-за него». Еврейское выражение может обозначать как занятость делом, так и обременённость им.'
    reason: lexical_alternative
  - marker: b
    text: «Сынам человеческим» — то есть людям, человеческому роду.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת לִבִּי
  choice: И предал я сердце своё
  rationale: Буквальный образ «дал своё сердце» передаёт сознательную направленность разума и воли; «предал сердце» сохраняет образ и звучит достойно по-русски.
- source_word: לִדְרוֹשׁ וְלָתוּר
  choice: исследовать и изведать
  rationale: 'Сохранены два близких, но не полностью тождественных глагола: первый обозначает целенаправленное исследование, второй — тщательное разыскивание и изучение.'
- source_word: בַּחָכְמָה
  choice: мудростью
  rationale: Творительный падеж естественно передаёт мудрость как средство и образ исследования.
- source_word: עַל כָּל אֲשֶׁר נַעֲשָׂה
  choice: всё, что делается
  rationale: Передаёт обобщающий смысл пассивной формы и всеохватность исследования.
- source_word: תַּחַת הַשָּׁמָיִם
  choice: под небом
  rationale: Естественное русское соответствие устойчивому выражению, обозначающему область человеческой жизни.
- source_word: עִנְיַן רָע
  choice: тяжкое занятие
  rationale: עִנְיַן указывает на дело или занятие, а רָע здесь характеризует его как тягостное и мучительное, не обязательно как нравственно злое.
- source_word: לִבְנֵי הָאָדָם
  choice: сынам человеческим
  rationale: Сохраняет мужскую родовую форму исходного выражения и его обобщённое значение; современное пояснение дано в сноске.
- source_word: לַעֲנוֹת בּוֹ
  choice: чтобы они были им заняты
  rationale: Передаёт вероятный смысл занятости данным делом, не устраняя возможного оттенка обременённости, отмеченного в сноске.
theological_decisions:
- issue: Следует ли понимать רָע как нравственное зло, данное Богом
  choice: тяжкое
  alternative: злое
  rationale: Контекст говорит о мучительном и обременительном характере человеческого занятия. Перевод не приписывает Богу происхождение нравственного зла, но сохраняет резко отрицательную оценку текста.
- issue: Родовое значение לִבְנֵי הָאָדָם
  choice: сынам человеческим
  alternative: людям / человеческому роду
  rationale: Основной текст сохраняет форму еврейского выражения, а сноска ясно указывает на его обобщённое значение.
- issue: Смысл לַעֲנוֹת בּוֹ
  choice: чтобы они были им заняты
  alternative: чтобы мучиться им / трудиться над ним
  rationale: Еврейская форма допускает оттенки занятости, труда и обременённости; основной вариант естественен по-русски, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, афористическим строем, подходящим для Екклесиаста. Инверсия «предал я» и выражение «сыны человеческие» сохраняют достоинство и образность оригинала без чрезмерной архаизации.
