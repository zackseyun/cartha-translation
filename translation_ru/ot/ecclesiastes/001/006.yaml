  text: הוֹלֵךְ֙ אֶל דָּר֔וֹם וְ/סוֹבֵ֖ב אֶל צָפ֑וֹן סוֹבֵ֤ב סֹבֵב֙ הוֹלֵ֣ךְ הָ/ר֔וּחַ וְ/עַל סְבִיבֹתָ֖י/ו שָׁ֥ב הָ/רֽוּחַ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/006.yaml
  text: Going toward the south and turning toward the north[a], turning and turning goes the wind[b]; and on its circuits the wind returns.
translation:
  language: ru
  text: Ветер идёт к югу и поворачивает к северу, всё кружит и кружит[a] и возвращается по своим кругам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское רוּחַ может также означать «дух» или «дыхание»; здесь контекст природных круговоротов указывает на ветер.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по своим оборотам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: идёт
  rationale: Причастие Qal от הלך обозначает непрерывное движение. «Идёт» сохраняет образ движения ветра, не добавляя отсутствующего в тексте глагола «дуть».
- source_word: דָּרוֹם / צָפוֹן
  choice: юг / север
  rationale: 'С предлогом אֶל эти существительные указывают направление: «к югу» и «к северу».'
- source_word: וְסוֹבֵב / סוֹבֵב סֹבֵב
  choice: поворачивает / кружит и кружит
  rationale: Корень סבב передаёт поворот и круговое движение. Повтор сохранён естественной русской конструкцией «кружит и кружит», подчёркивающей непрерывность.
- source_word: הָרוּחַ
  choice: ветер
  rationale: Хотя רוּחַ также может означать «дух» или «дыхание», перечисление природных круговоротов в Екклесиасте 1:5–7 указывает здесь на ветер.
- source_word: סְבִיבֹתָיו
  choice: свои круги
  rationale: Существительное того же смыслового поля, что и סבב, обозначает круговые пути или обороты; «круги» сохраняет повторяющийся циклический образ.
- source_word: שָׁב
  choice: возвращается
  rationale: Глагол שוב прямо обозначает возвращение и поддерживает тему неизменного круговорота.
theological_decisions:
- issue: Значение רוּחַ в данном стихе
  choice: метеорологическое значение «ветер»
  alternative: «дух» или «дыхание»
  rationale: Непосредственный контекст описывает наблюдаемые природные циклы — движение солнца, ветра и потоков. Поэтому «ветер» передаёт наиболее вероятный смысл, не внося в стих не обозначенного контекстом богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим порядком слов. Повтор «кружит и кружит» сохраняет ритм и настойчивую цикличность еврейского текста; начальное появление подлежащего отложено вслед за оригиналом, но фраза остаётся понятной.
