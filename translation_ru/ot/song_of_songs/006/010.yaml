  yaml_path: translation/ot/song_of_songs/006/010.yaml
  text: Who is this who looks forth like the dawn[a], beautiful as the moon, bright as the sun[c][b], awe-inspiring as bannered armies?
translation:
  language: ru
  text: Кто эта, что появляется, словно заря[a], прекрасная, как луна, сияющая, как солнце[b], грозная, как войска под знамёнами[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто она, появляющаяся, словно заря…?»'
    reason: lexical_alternative
  - marker: b
    text: Еврейское прилагательное может также означать «чистая» или «ясная».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «внушающая трепет, как войска со знамёнами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: Кто эта
  rationale: Сохраняет буквальное сочетание вопросительного местоимения с указательным местоимением женского рода и его риторическую выразительность.
- source_word: הַנִּשְׁקָפָה
  choice: что выглядывает
  rationale: Передаёт зрительный образ глагола שׁקף — смотреть или показываться из некоторой точки; не сводит его к нейтральному «появляется».
- source_word: כְּמוֹ שָׁחַר
  choice: словно заря
  rationale: «Заря» естественно и поэтично передаёт שַׁחַר — рассвет, утреннюю зарю.
- source_word: יָפָה כַלְּבָנָה
  choice: прекрасная, как луна
  rationale: Прямая и современная передача образа красоты и лунного сравнения.
- source_word: בָּרָה כַּחַמָּה
  choice: ясная, как солнце
  rationale: בָּרָה допускает значения «чистая», «ясная», «сияющая»; «ясная» сохраняет многозначность и естественно сочетается с солнечным образом.
- source_word: אֲיֻמָּה
  choice: внушающая трепет
  rationale: Передаёт грозное, вызывающее благоговейный страх впечатление без нежелательного нравственного оттенка слова «ужасная».
- source_word: כַּנִּדְגָּלוֹת
  choice: как войска под знамёнами
  rationale: Форма связана со знамёнами и, вероятно, обозначает построенные под ними отряды; развёрнутая русская формулировка яснее буквального «знаменосные».
