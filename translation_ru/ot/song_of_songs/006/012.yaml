  text: לֹ֣א יָדַ֔עְתִּי נַפְשִׁ֣/י שָׂמַ֔תְ/נִי מַרְכְּב֖וֹת עַמִּ/י נָדִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/012.yaml
  text: Before I knew it[b][a], my soul set me among the chariots of my noble people.
translation:
  language: ru
  text: Не успела я опомниться, как душа моя[a] поставила меня среди колесниц моего знатного народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё желание», «моё сердце» или «моё внутреннее я». Еврейское слово имеет широкий круг значений, а смысл строки неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди колесниц Амминадива», если последние два еврейских слова понимать как имя собственное, а не как «моего знатного народа».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדַעְתִּי
  choice: Не успела я опомниться
  rationale: 'Буквально: «я не знала». В данном поэтическом контексте выражение передаёт внезапность и неосознанность происходящего; выбранный русский оборот естественно выражает обе стороны смысла.'
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נֶפֶשׁ может означать душу, самого человека, внутреннее «я» или желание. «Душа моя» сохраняет образность и неоднозначность еврейского текста; другие возможности отмечены в сноске.
- source_word: שָׂמַתְנִי
  choice: поставила меня среди
  rationale: Основное значение שׂוּם — «класть, ставить, помещать». Перевод сохраняет прямой пространственный образ, не заменяя его истолкованием «сделала меня подобной» или «понесла меня».
- source_word: מַרְכְּבוֹת
  choice: колесниц
  rationale: Прямое соответствие форме множественного числа מַרְכָּבָה; образ оставлен без поясняющей конкретизации.
- source_word: עַמִּי נָדִיב
  choice: моего знатного народа
  rationale: עַמִּי естественно читается как «мой народ», а נָדִיב — как определение «знатный, благородный». Синтаксис труден, поэтому возможность имени собственного сохранена в сноске.
