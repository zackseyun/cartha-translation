  text: אֶל גִּנַּ֤ת אֱגוֹז֙ יָרַ֔דְתִּי לִ/רְא֖וֹת בְּ/אִבֵּ֣י הַ/נָּ֑חַל לִ/רְאוֹת֙ הֲ/פָֽרְחָ֣ה הַ/גֶּ֔פֶן הֵנֵ֖צוּ הָ/רִמֹּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/011.yaml
  text: I went down to the walnut grove to look at the shoots in the valley[a], to see whether the vine had budded[c][b], whether the pomegranates had blossomed.
translation:
  language: ru
  text: Я спустилась в ореховый сад[a], чтобы посмотреть на молодую поросль в долине[b], увидеть, распустилась ли виноградная лоза[c], зацвели ли гранатовые деревья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в сад ореховых деревьев» или «в ореховую рощу».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также обозначать вади — долину с руслом временного потока — или само русло потока.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дала ли почки виноградная лоза» или «зацвела ли виноградная лоза». Еврейский глагол может обозначать появление почек, ростков или цветов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּנַּת אֱגוֹז
  choice: ореховый сад
  rationale: Сочетание обозначает сад или рощу с ореховыми деревьями. «Ореховый сад» естественно звучит по-русски и сохраняет образ возделываемого насаждения, не сужая значение אֱגוֹז исключительно до грецкого ореха.
- source_word: יָרַדְתִּי
  choice: я спустилась
  rationale: Глагол ירד передаёт движение вниз. Прошедшее время сохранено, а женский род выбран по ближайшему контексту Песни песней, где речь продолжает женщина, хотя сама еврейская форма первого лица рода не выражает.
- source_word: לִרְאוֹת
  choice: чтобы посмотреть / увидеть
  rationale: 'Дважды повторённый инфинитив передан двумя естественными русскими соответствиями: сначала как целенаправленное наблюдение, затем как выяснение состояния растений.'
- source_word: בְּאִבֵּי הַנָּחַל
  choice: на молодую поросль в долине
  rationale: אִבִּים указывает на свежую растительность или молодые побеги, а נַחַל может обозначать долину, русло сезонного потока или вади. Основной текст сохраняет поэтичный и понятный образ, а диапазон второго слова отмечен в сноске.
- source_word: הֲפָרְחָה הַגֶּפֶן
  choice: распустилась ли виноградная лоза
  rationale: פרח охватывает появление почек, ростков и цветов. «Распустилась» сохраняет эту смысловую широту и естественно сочетается с лозой.
- source_word: הֵנֵצוּ הָרִמֹּנִים
  choice: зацвели ли гранатовые деревья
  rationale: Глагол נוץ здесь означает появление цветов. Уточнение «деревья» устраняет возможное для русского языка понимание слова «гранаты» только как плодов, сохраняя ботанический образ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с мягким поэтическим ритмом. Женский род сказуемого выбран на основании контекста речи женщины; в самой еврейской форме первого лица род не выражен. Повтор לִרְאוֹת передан вариативно, чтобы избежать тяжеловесности, при сохранении двух последовательных целей наблюдения.
