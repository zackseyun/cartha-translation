  text: 'Я принадлежу своему возлюбленному,

    а мой возлюбленный принадлежит мне,

    он пасёт среди лилий[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он пасётся среди лилий». Еврейское причастие может означать «пасти», «быть пастухом» или «пастись, кормиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי לְדוֹדִי
  choice: Я принадлежу моему возлюбленному
  rationale: Предлог לְ в этой поэтической формуле выражает принадлежность. Явный глагол «принадлежу» естественно передаёт смысл по-русски, не устраняя взаимность высказывания.
- source_word: וְדוֹדִי לִי
  choice: а мой возлюбленный — мне
  rationale: Безглагольная ответная часть сохранена краткой и параллельной первой строке. Дательный «мне» передаёт принадлежность без тяжеловесного повтора «принадлежит».
- source_word: דּוֹדִי
  choice: мой возлюбленный
  rationale: «Возлюбленный» сохраняет любовный и поэтический характер обращения, не усиливая его до исключительно сексуального значения.
- source_word: הָרֹעֶה
  choice: он пасёт
  rationale: Причастие от רעה может обозначать пастьбу, кормление или выпас. Употребление «пасёт» без названного объекта сохраняет пасторальный образ и не добавляет отсутствующее в еврейском тексте «стадо».
- source_word: בַּשׁוֹשַׁנִּים
  choice: среди лилий
  rationale: Предлог בְּ здесь естественно передаётся как «среди», а традиционное «лилии» сохраняет повторяющийся цветочный образ Песни песней.
theological_decisions:
- issue: Взаимная принадлежность в любовной поэзии
  choice: Сохранить прямую речь о взаимной принадлежности двух возлюбленных без аллегорического пояснения.
  alternative: Истолковать возлюбленного непосредственно как Бога или Мессию.
  rationale: Еврейский текст сам по себе говорит языком взаимной любви; перевод не должен вносить в основной текст позднейшее богословское истолкование.
- issue: Неопределённость образа הָרֹעֶה
  choice: Оставить объект пастьбы неназванным и пояснить диапазон значения в сноске.
  alternative: Добавить «стадо» либо однозначно представить возлюбленного кормящимся среди лилий.
  rationale: В исходном тексте объект не выражен, а форма רעה допускает как деятельность пастуха, так и кормление пасущегося животного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Трёхстрочная форма подчёркивает параллелизм и заключительный пасторальный образ; точка с запятой еврейского разделителя раздела не воспроизводится как текстовый знак.
