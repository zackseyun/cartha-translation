translation:
  language: ru
  text: Твой висок — как долька граната за твоей вуалью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за твоими локонами» или «сквозь твои волосы», если לְצַמָּתֵךְ означает волосы, а не вуаль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפֶלַח
  choice: как долька
  rationale: Префикс כְּ выражает сравнение, а פֶלַח обозначает отделённую часть или сегмент. «Долька» естественно передаёт образ разрезанного плода.
- source_word: הָרִמּוֹן
  choice: граната
  rationale: Существительное означает «гранат»; родительный падеж образует естественное русское сочетание «долька граната» и сохраняет поэтический образ.
- source_word: רַקָּתֵךְ
  choice: твои виски
  rationale: רַקָּה прежде всего обозначает висок, боковую часть головы. Множественное число в русском естественно передаёт собирательный смысл формы с суффиксом 2-го лица женского рода, не подменяя образ щеками.
- source_word: מִבַּעַד
  choice: за
  rationale: Предлог указывает на видимость из-за или сквозь преграду. С существительным «вуаль» краткое «за» естественно передаёт основной пространственный смысл.
- source_word: לְצַמָּתֵךְ
  choice: твоей вуалью
  rationale: В данном контексте слово обычно понимают как женское покрывало или вуаль, хотя возможно толкование «волосы, локоны»; альтернативу следует сохранить в сноске.
