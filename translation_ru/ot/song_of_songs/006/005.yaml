  yaml_path: translation/ot/song_of_songs/006/005.yaml
  text: Turn your eyes away from me[a], for they overwhelm me[b]. Your hair is like a flock of goats streaming down from Gilead.
translation:
  language: ru
  text: 'Отведи от меня свои глаза —

    они ошеломляют меня[a].


    Твои волосы — словно стадо коз,

    спускающихся с Галаада[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они приводят меня в смятение»; возможно: «они одолевают меня». Еврейский глагол редок, и точный оттенок его значения здесь спорен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сходящих с Галаада»; по смыслу образа — со склонов Галаада.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵבִּי עֵינַיִךְ מִנֶּגְדִּי
  choice: Отведи от меня свои глаза
  rationale: Женский императив передаёт прямую просьбу говорящего, а сочетание מִנֶּגְדִּי естественно выражено как «от меня». «Отведи глаза» звучит современно и сохраняет образ исходного текста.
- source_word: שֶׁהֵם הִרְהִיבֻנִי
  choice: они ошеломляют меня
  rationale: Редкий и спорный глагол רהב здесь описывает сильное воздействие взгляда женщины на говорящего. «Ошеломляют» сохраняет эмоциональную силу, не уточняя её как страх, смущение или покорение.
- source_word: שַׂעְרֵךְ כְּעֵדֶר הָעִזִּים
  choice: Твои волосы — словно стадо коз
  rationale: Сохранено прямое пастушеское сравнение; «словно» естественно вводит поэтический образ в современном русском языке.
- source_word: שֶׁגָּלְשׁוּ מִן הַגִּלְעָד
  choice: сбегающих с Галаада
  rationale: Глагол גלשׁ передаёт движение вниз, а «сбегающих» одновременно подходит к стаду и создаёт образ ниспадающих волос. Название Галаад сохранено без добавления отсутствующих в еврейском тексте слов «гора» или «склоны».
