lexical_decisions:
- source_word: אָנָה הָלַךְ
  choice: Куда ушёл
  rationale: 'Вопросительное наречие אָנָה обозначает направление, а перфект הָלַךְ указывает на совершившийся уход, последствия которого сохраняются: спрашивающие хотят узнать нынешнее местонахождение возлюбленного.'
- source_word: דּוֹדֵךְ
  choice: твой возлюбленный
  rationale: В Песни песней דּוֹד обозначает любимого мужчину в романтическом контексте. «Возлюбленный» сохраняет поэтическое достоинство и нежный оттенок.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: прекраснейшая из женщин
  rationale: Еврейская конструкция выражает превосходную степень. Эта формулировка естественна для русского поэтического обращения и точно передаёт сравнение.
- source_word: אָנָה פָּנָה
  choice: Куда направился
  rationale: Пָנָה буквально связано с поворотом или изменением направления. «Направился» естественно передаёт вопрос о том, куда он пошёл, не устраняя образ направления полностью.
- source_word: וּנְבַקְשֶׁנּוּ
  choice: Мы будем искать его
  rationale: Форма первого лица множественного числа выражает готовность или намерение присоединиться к поискам. Самостоятельное предложение звучит естественно по-русски и сохраняет волевой оттенок.
- source_word: עִמָּךְ
  choice: вместе с тобой
  rationale: Предлог с местоименным суффиксом женского рода обозначает совместное действие и обращён к женщине.
