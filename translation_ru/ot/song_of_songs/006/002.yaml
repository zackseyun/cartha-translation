  text: דּוֹדִ/י֙ יָרַ֣ד לְ/גַנּ֔/וֹ לַ/עֲרוּג֖וֹת הַ/בֹּ֑שֶׂם לִ/רְעוֹת֙ בַּ/גַּנִּ֔ים וְ/לִ/לְקֹ֖ט שֽׁוֹשַׁנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/002.yaml
  text: My beloved has gone down to his garden[a], to the beds of spices[b], to graze in the gardens and to gather lilies.
translation:
  language: ru
  text: Возлюбленный мой сошёл в свой сад, к грядкам ароматных растений, чтобы пастись[a] в садах и собирать лилии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасти» или «кормиться». Еврейский глагол может обозначать как выпас стада, так и кормление или поедание корма; возможно, пасторальная неоднозначность здесь намеренна.'
    reason: lexical_alternative
  - marker: b
    text: Какой именно цветок обозначает еврейское слово, точно не установлено; традиционный перевод — «лилии».
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: Возлюбленный мой
  rationale: В Песни песней существительное דּוֹד обозначает возлюбленного женщины. Такой порядок слов естественен для возвышенной русской поэзии и сохраняет оттенок нежной привязанности.
- source_word: יָרַד
  choice: сошёл
  rationale: Глагол передаёт завершённое движение вниз. Совершенный вид сохраняет направленность и результат действия без излишне тяжеловесного «спустился».
- source_word: לְגַנּוֹ
  choice: в свой сад
  rationale: Предлог לְ указывает направление, а местоименный суффикс — принадлежность сада возлюбленному. Русское «в свой сад» естественно при глаголе движения.
- source_word: לַעֲרוּגוֹת הַבֹּשֶׂם
  choice: к грядкам ароматных растений
  rationale: עֲרוּגוֹת — возделанные грядки или участки, а בֹּשֶׂם связано с благовониями, бальзамом и ароматическими веществами. Формулировка сохраняет садовый и благоухающий образ, не сводя его только к кулинарным пряностям.
- source_word: לִרְעוֹת
  choice: чтобы пастись
  rationale: רעה может означать пастись, пасти или кормиться. «Пастись» удерживает конкретную пасторальную метафору, а неоднозначность отмечена в сноске.
- source_word: בַּגַּנִּים
  choice: в садах
  rationale: Сохранены предлог בְּ и множественное число, несмотря на стоящее ранее единственное число «сад».
- source_word: וְלִלְקֹט
  choice: и собирать
  rationale: לקט означает собирать или срывать. «Собирать» звучит естественно и не уточняет способ действия сверх исходного текста.
- source_word: שׁוֹשַׁנִּים
  choice: лилии
  rationale: Традиционное соответствие сохраняет поэтический образ и последовательность словоупотребления в книге, хотя точный вид цветка не установлен.
