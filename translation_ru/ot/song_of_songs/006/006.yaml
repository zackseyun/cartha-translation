  source_fidelity: Черновик верно передаёт общий образ и подразумеваемую полноту зубного ряда, но в основном тексте заменяет два пастушеских выражения («приносят двойню» и «лишилась детёнышей») объяснением метафоры о парных зубах. Это ослабляет образность и не соответствует оптимально-эквивалентному подходу. «После омовения» также несколько менее прямо передаёт מִן הָרַחְצָה, чем «от/после мытья», но не является существенной ошибкой.
