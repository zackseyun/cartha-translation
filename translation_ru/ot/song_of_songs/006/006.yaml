  terminology: «Стадо овец» — естественное русское обозначение, хотя еврейское רְחֵלִים уточняет самок овец. Не следует вводить в поэтический текст техническое «овцы-матки». Слово «двойня» точно передаёт овцеводческий образ; сноска может отметить также подразумеваемую парность зубов.
