base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/006.yaml
  text: Your teeth are like a flock of ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: ru
  text: Твои зубы — как стадо овец, вышедших после мытья; все они приносят двойню[a], и ни одна из них не лишилась детёнышей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все они подобраны попарно». Образ двойни также подразумевает, что каждому зубу соответствует парный ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и нет среди них лишившейся детей» или «и нет среди них бездетной». Образ выражает полноту: ни один зуб не отсутствует.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: твои зубы
  rationale: Прямая передача формы множественного числа с суффиксом второго лица женского рода единственного числа; естественное русское соответствие.
- source_word: כְּעֵדֶר הָרְחֵלִים
  choice: как стадо овец
  rationale: רְחֵלִים обозначает взрослых самок овец. В русском «стадо овец» естественно и достаточно точно передаёт образ; вариант «стадо овечек» внёс бы отсутствующую в оригинале уменьшительность.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: вышедших после омовения
  rationale: Сохраняет образ стада, поднимающегося после мытья, и подразумеваемую чистоту и белизну, не добавляя прямо отсутствующих деталей.
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: все они ходят парами
  rationale: Форма от תאם допускает образ овец, приносящих двойню, и одновременно указывает на парность зубов. Формулировка естественна по-русски и сохраняет двойную соотнесённость; буквальный овцеводческий образ отмечен в сноске.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: и ни одной среди них не недостаёт пары
  rationale: Буквально речь идёт об отсутствии овцы, лишившейся приплода, но в сравнении подразумевается полнота зубного ряда. Основной текст делает смысл понятным, а сноска сохраняет буквальный образ и родовую несогласованность, возникающую из метафоры.
