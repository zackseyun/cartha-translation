  yaml_path: translation/ot/song_of_songs/006/008.yaml
  text: There are sixty queens and eighty concubines[a], and young women without number.
translation:
  language: ru
  text: Цариц — шестьдесят, наложниц — восемьдесят, а девушек[a] — без числа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодых женщин»; возможно: «девственниц». Еврейское עֲלָמוֹת имеет широкое значение и само по себе не обязательно указывает на девственность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשִּׁים הֵמָּה מְּלָכוֹת
  choice: Цариц — шестьдесят
  rationale: Именная конструкция с тире естественно передаёт перечисление и лёгкое выделение, выраженное самостоятельным местоимением הֵמָּה, без тяжеловесного буквального «они — шестьдесят цариц».
- source_word: וּשְׁמֹנִים פִּילַגְשִׁים
  choice: наложниц — восемьдесят
  rationale: «Наложницы» — точное и общепонятное обозначение женщин, имевших признанный, но более низкий статус по сравнению с жёнами или царицами.
- source_word: וַעֲלָמוֹת
  choice: а девушек
  rationale: עֲלָמוֹת обозначает молодых женщин брачного возраста и само по себе не требует значения «девственницы». «Девушки» сохраняет эту смысловую широту и звучит естественно в современном русском языке.
- source_word: אֵין מִסְפָּר
  choice: без числа
  rationale: Устойчивое поэтическое выражение передаёт неисчислимое множество и сохраняет возвышенную краткость оригинала.
