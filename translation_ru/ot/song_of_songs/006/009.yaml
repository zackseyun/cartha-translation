revisions:
- from: Одна она — голубка моя, совершенная моя[a]; единственная у матери своей, избранная[b] у родившей её. Увидели её девушки[c] — и назвали счастливой; царицы и наложницы — и восхвалили её.
  to: Одна она — голубка моя, безупречная моя[a]; единственная у своей матери, чистая у родившей её[b]. Увидели её девушки[c] и назвали счастливой; а царицы и наложницы восхвалили её.
  rationale: Изменение сохраняет поэтический параллелизм и неоднозначность בָּרָה, но устраняет впечатление, будто мать совершает действие избрания. «Безупречная» более естественно передаёт תַּמָּה в современном русском, а синтаксис последней части приведён к плавной литературной норме. Все имеющиеся примечания сохранены и их маркеры остаются привязаны к соответствующим словам.
