base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/009.yaml
  text: My dove[a], my flawless one, is the only one; she is the only one of her mother, pure to the one who bore her. Daughters saw her and called her blessed[c][b]; queens and concubines also praised her.
translation:
  language: ru
  text: Одна она — голубка моя, безупречная моя[a]; единственная у своей матери, чистая у родившей её[b]. Увидели её девушки[c] и назвали счастливой; а царицы и наложницы восхвалили её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершенная моя», «непорочная моя». Еврейское слово выражает цельность, полноту или безупречность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избранная», «сияющая». Еврейское прилагательное может обозначать чистоту, сияние или исключительное достоинство.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «дочери»; в поэтической речи так могут называться девушки или молодые женщины.'
    reason: cultural_note
lexical_decisions:
- source_word: יוֹנָתִי
  choice: голубка моя
  rationale: Сохраняет буквальный поэтический образ и ласковое обращение, характерное для Песни песней.
- source_word: תַמָּתִי
  choice: совершенная моя
  rationale: Передаёт значение цельности и безупречности, не сводя слово исключительно к нравственной непорочности.
- source_word: אַחַת הִיא
  choice: одна она / единственная
  rationale: Повтор выражения подчёркивает её уникальность и исключительность; вариативная передача позволяет сохранить поэтическое движение русского текста.
- source_word: לְאִמָּהּ
  choice: у матери своей
  rationale: Русская конструкция естественно выражает уникальное положение девушки по отношению к матери.
- source_word: בָּרָה
  choice: избранная
  rationale: В данном параллелизме слово вероятно указывает на особое, исключительное достоинство; при этом сохраняется примечание о возможном значении чистоты или сияния.
- source_word: לְיוֹלַדְתָּהּ
  choice: у родившей её
  rationale: Сохраняет отличие от слова «мать» в предыдущей строке и близко передаёт причастное обозначение родившей.
- source_word: בָנוֹת
  choice: девушки
  rationale: В поэтическом контексте обозначает молодых женщин; буквальное «дочери» без уточнения в современном русском здесь звучало бы неясно.
- source_word: וַיְאַשְּׁרוּהָ
  choice: назвали счастливой
  rationale: Передаёт значение породы אשר в пиэле — признавать или провозглашать счастливой, благополучной.
- source_word: מְלָכוֹת וּפִילַגְשִׁים
  choice: царицы и наложницы
  rationale: Прямая и понятная передача названий двух групп женщин.
- source_word: וַיְהַלְלוּהָ
  choice: восхвалили её
  rationale: Сохраняет возвышенный поэтический регистр глагола הלל и его значение открытой похвалы.
