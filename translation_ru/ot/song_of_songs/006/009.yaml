  source_fidelity: 'В целом переданы все основные элементы стиха: ласкательные образы «голубка» и תַּמָּה, повторное подчёркивание исключительности, женщины/девушки, царицы и наложницы, а также два глагола признания и хвалы. Однако «избранная у родившей её» неудачно передаёт בָּרָה и связь с לְיוֹלַדְתָּהּ: по-русски оно может означать, что мать её избрала, тогда как текст характеризует саму женщину как чистую/безупречную или исключительную по отношению к родившей её.'
  naturalness: «Совершенная моя» возможно в намеренно библейской поэтике, но «безупречная моя» естественнее в современном литературном русском. Вторая фраза нуждается в более ясном параллелизме. Конструкция «царицы и наложницы — и восхвалили её» с тире и дополнительным «и» звучит искусственно; союз «а» ясно оформляет вторую согласованную часть.
