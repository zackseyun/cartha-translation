base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/007.yaml
  text: Tell me[a], you whom my soul loves, where you pasture your flock, where you make it lie down at noon; for why should I be like one who veils herself beside the flocks of your companions?
translation:
  language: ru
  text: Скажи мне, ты, кого любит моя душа, где ты пасёшь своё стадо, где даёшь ему отдыхать в полдень? Почему мне быть словно закутанная в покрывало женщина[a] возле стад твоих товарищей?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно скиталица». Еврейское слово может означать женщину, закутанную в покрывало; по контексту его также понимают как указание на ту, что бродит в поисках возлюбленного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Скажи мне
  rationale: Прямая и естественная передача повелительной формы נגד с местоименным дополнением первого лица.
- source_word: שֶׁאָהֲבָה נַפְשִׁי
  choice: возлюбленный душою моей
  rationale: Сохраняет поэтическую интенсивность еврейского выражения с נֶפֶשׁ и при этом звучит естественно в русском контексте обращения к мужчине.
- source_word: אֵיכָה תִרְעֶה
  choice: где ты пасёшь стадо
  rationale: אֵיכָה здесь указывает на место; объект «стадо» подразумевается пастушеским контекстом и добавлен для ясности.
- source_word: אֵיכָה תַּרְבִּיץ
  choice: где укладываешь его на отдых
  rationale: Передаёт каузативное значение породы hифиль глагола רבץ; местоимение относится к подразумеваемому собирательному «стаду».
- source_word: בַּצָּהֳרָיִם
  choice: в полдень
  rationale: Краткая и точная передача временного выражения.
- source_word: שַׁלָּמָה אֶהְיֶה
  choice: Зачем мне быть
  rationale: Естественно передаёт риторический вопрос и желательность избежать названного положения.
- source_word: כְּעֹטְיָה
  choice: подобной женщине под покрывалом
  rationale: Основано на обычном значении עטה — «покрывать, окутывать»; формулировка не уточняет сверх текста цель или социальный смысл покрывала.
- source_word: עַל עֶדְרֵי חֲבֵרֶיךָ
  choice: возле стад твоих товарищей
  rationale: עַל передано пространственно как «возле», а חֲבֵרִים — нейтральным «товарищи», без излишнего уточнения отношений.
