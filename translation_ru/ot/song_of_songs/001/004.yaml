source:
  edition: WLC
  text: מָשְׁכֵ֖/נִי אַחֲרֶ֣י/ךָ נָּר֑וּצָה הֱבִיאַ֨/נִי הַ/מֶּ֜לֶךְ חֲדָרָ֗י/ו נָגִ֤ילָה וְ/נִשְׂמְחָה֙ בָּ֔/ךְ נַזְכִּ֤ירָה דֹדֶ֨י/ךָ֙ מִ/יַּ֔יִן מֵישָׁרִ֖ים אֲהֵבֽוּ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/004.yaml
  text: Draw me after you[a]; let us run. The king has brought me into his chambers. We will rejoice and be glad in you; we will extol your love more than wine[b]. Rightly do they love you.
translation:
  language: ru
  text: Увлеки меня за собой — побежим! Царь ввёл меня в свои покои. Будем ликовать и радоваться о тебе, будем превозносить твою любовь больше, чем вино.[a] По праву тебя любят.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем вспоминать», «будем рассказывать о» или «будем праздновать твою любовь больше, чем вино».'
    reason: Лексический диапазон נַזְכִּירָה включает воспоминание, упоминание и хвалебное возвещение.
  - marker: b
    text: 'Или: «Честные люди любят тебя» (возможен также перевод: «Праведные любят тебя»). Еврейское מֵישָׁרִים можно понять либо наречно — «по праву», либо как обозначение людей — «честные, праведные».'
    reason: Сохранение альтернативного синтаксического и лексического прочтения.
lexical_decisions:
- source_word: מָשְׁכֵנִי
  choice: Увлеки меня
  rationale: Глагол משׁך означает «тянуть, влечь». «Увлеки» естественно передаёт и движение вслед за возлюбленным, и любовное притяжение, не сводя образ к физическому принуждению.
- source_word: אַחֲרֶיךָ נָּרוּצָה
  choice: за собой — побежим
  rationale: Сохраняется переход от единственного числа «меня» к форме первого лица множественного числа נָּרוּצָה. Побудительно-желательный оттенок кохортатива естественно выражен формой «побежим».
- source_word: הֱבִיאַנִי
  choice: ввёл меня
  rationale: Форма понята как перфект, сообщающий о совершившемся действии, а не как пожелание. В контексте внутренних покоев «ввёл» точнее и естественнее общего «привёл».
- source_word: הַמֶּלֶךְ
  choice: Царь
  rationale: Прямой перевод литературного обозначения персонажа; прописная буква обусловлена началом предложения и не вносит богословской идентификации.
- source_word: חֲדָרָיו
  choice: в свои покои
  rationale: חדר обозначает внутреннюю комнату или покой. «Покои» сохраняет поэтический и интимный характер сцены.
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: Будем ликовать и радоваться
  rationale: Две согласованные формы передают совместное радостное торжество; перевод сохраняет поэтический параллелизм и оттенок волеизъявления.
- source_word: בָּךְ
  choice: о тебе
  rationale: Предлог ב может обозначать предмет или повод радости. Русское «радоваться о тебе» сохраняет личную направленность и звучит поэтически, хотя несколько возвышенно.
- source_word: נַזְכִּירָה
  choice: будем превозносить
  rationale: Корень זכר буквально связан с памятью и упоминанием, но здесь может означать хвалебное воспоминание или возвещение любви возлюбленного. «Превозносить» естественно передаёт контекстуальную силу; буквальные возможности отмечены в сноске.
- source_word: דֹדֶיךָ
  choice: твою любовь
  rationale: Множественное דֹדִים может обозначать проявления любви, ласки или любовные утехи. Собирательное единственное «любовь» естественно по-русски и не устраняет романтический смысл.
- source_word: מִיַּיִן
  choice: больше, чем вино
  rationale: 'Предлог מן выражает сравнение. Формулировка сохраняет структуру: любовь упоминается или восхваляется более вина; возможный смысл «лучше вина» не навязывается.'
- source_word: מֵישָׁרִים
  choice: По праву
  rationale: Наречное понимание слова передаёт смысл «справедливо, с основанием». Субстантивное понимание «праведные/искренние» сохраняется в сноске.
- source_word: אֲהֵבוּךָ
  choice: любят тебя
  rationale: Поэтический перфект может описывать устойчивую действительность; настоящее время естественно передаёт это по-русски. Третье лицо множественного числа сохранено без уточнения субъекта.
theological_decisions:
- issue: Кого обозначает «царь» в Песни песней 1:4
  choice: Оставить «Царь» как образ действующего лица поэмы без прямого отождествления с Богом или Мессией.
  alternative: Понимать как аллегорическое указание на Бога либо Мессию/Христа.
  rationale: Сам стих не устанавливает такую идентификацию однозначно; её включение в перевод сняло бы литературную и богословскую открытость текста.
- issue: Субъект множественного «любят тебя»
  choice: Сохранить неопределённое третье лицо множественного числа.
  alternative: Отнести слова к девушкам из контекста либо прочесть מֵישָׁרִים как субъект «искренние/праведные».
  rationale: Еврейский стих допускает разные способы синтаксического понимания, поэтому перевод не уточняет субъект сверх исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Сохранены смена числа, интимный образ царских покоев и неоднозначность заключительной строки. Местоимения, обращённые к возлюбленному, даны со строчной буквы, чтобы не вносить конфессионального толкования.
