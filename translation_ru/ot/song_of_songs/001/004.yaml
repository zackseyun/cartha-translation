  source_fidelity: Основной перевод точно передаёт последовательность еврейского текста, включая переход от «меня» к «побежим», совершенный вид «царь ввёл меня» и неопределённое третье лицо множественного числа в заключении. Однако «По праву любят тебя» в русском может означать, что у них есть право любить; порядок слов «По праву тебя любят» яснее передаёт наречное «справедливо/вполне обоснованно».
