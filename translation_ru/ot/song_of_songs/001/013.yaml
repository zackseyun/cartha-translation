  yaml_path: translation/ot/song_of_songs/001/013.yaml
  text: My beloved is to me a sachet of myrrh[c][b][a]; he lies between my breasts.
translation:
  language: ru
  text: Мой возлюбленный — для меня узелок мирры[a]; между моими грудями он ночует[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свёрток мирры» или «мешочек с миррой». Еврейское слово обозначает небольшой связанный свёрток, узелок или пакет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «остаётся на ночь» или «проводит ночь между моими грудями». Мужская форма глагола может соотноситься как с «возлюбленным», так и с «узелком»; образ соединяет возлюбленного с благоухающим узелком мирры.'
    reason: ambiguity
lexical_decisions:
- source_word: צְרוֹר הַמֹּר
  choice: мешочек с миррой
  rationale: צְרוֹר обозначает небольшой свёрток, узелок или мешочек; в сочетании с благовонной миррой «мешочек» естественно передаёт образ носимого на теле ароматического саше, не теряя предметной конкретности.
- source_word: דּוֹדִי
  choice: возлюбленный мой
  rationale: В Песни песней דּוֹדִי обозначает любимого мужчину в романтическом и интимном контексте; этот вариант сохраняет поэтический и достойный регистр.
- source_word: לִי
  choice: для меня
  rationale: Предлог выражает личное отношение и значимость; по-русски конструкция «для меня» естественнее буквального «мне» в данном сравнительном обороте.
- source_word: בֵּין שָׁדַי
  choice: между моих грудей
  rationale: Еврейский текст прямо называет груди и использует пространственный предлог «между»; перевод сохраняет телесную конкретность без эвфемизма.
- source_word: יָלִין
  choice: он ночует
  rationale: Глагол לין обычно содержит значение ночлега или пребывания ночью. Мужской род допускает отнесение к возлюбленному, метафорически уподобленному мешочку с миррой; «ночует» сохраняет интимный ночной оттенок.
theological_decisions:
- issue: Референт мужского глагола יָלִין
  choice: «он ночует» — личное отнесение к возлюбленному
  alternative: «он лежит» или предметное отнесение к мешочку с миррой
  rationale: Мужской род согласуется и с דּוֹדִי («мой возлюбленный»), и с צְרוֹר («мешочек/свёрток»), поэтому образ намеренно допускает наложение человека и ароматического предмета. Личный перевод сохраняет грамматику и интимность, а двуплановость поясняется в сноске.
translation_notes:
  register: Современный литературный русский с сохранением поэтической инверсии «возлюбленный мой». Телесный образ передан прямо, без традиционного смягчения «на груди» или «у сердца». «Ночует» выбрано вместо нейтрального «лежит», чтобы сохранить значение ночлега в לין.
