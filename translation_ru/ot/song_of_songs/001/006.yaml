source:
  edition: WLC
  text: אַל תִּרְא֨וּ/נִי֙ שֶׁ/אֲנִ֣י שְׁחַרְחֹ֔רֶת שֶׁ/שֱּׁזָפַ֖תְ/נִי הַ/שָּׁ֑מֶשׁ בְּנֵ֧י אִמִּ֣/י נִֽחֲרוּ בִ֗/י שָׂמֻ֨/נִי֙ נֹטֵרָ֣ה אֶת הַ/כְּרָמִ֔ים כַּרְמִ֥/י שֶׁ/לִּ֖/י לֹ֥א נָטָֽרְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/006.yaml
  text: Do not stare at me because I am dark[a], because the sun has scorched me. My mother’s sons were angry with me; they made me keeper of the vineyards[d][c][b], but my own vineyard I have not kept.
translation:
  language: ru
  text: 'Не разглядывайте меня из-за того, что я смугла[a]: меня опалило солнце[b]. Сыновья моей матери[c] разгневались на меня и поставили меня стеречь виноградники, а своего виноградника я не уберегла[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я черна». Это более буквальная передача еврейского прилагательного.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол передаёт обжигающее воздействие солнца; традиционно его иногда переводили: «солнце взглянуло на меня».'
    reason: lexical_alternative
  - marker: c
    text: То есть её братья; буквальная формулировка может подчёркивать отчуждение или дистанцию.
    reason: cultural_note
  - marker: d
    text: «Свой виноградник», вероятно, употреблено метафорически, но что именно подразумевается, еврейский текст не уточняет.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּרְאוּנִי
  choice: Не разглядывайте меня
  rationale: Буквально — «не смотрите на меня». В данном контексте речь идёт о пристальном, оценивающем взгляде на внешность; «не разглядывайте» естественно передаёт этот оттенок, не превращая фразу в свободный пересказ.
- source_word: שְׁחַרְחֹרֶת
  choice: смугла
  rationale: Прилагательное обозначает тёмный цвет кожи или потемневшую внешность. «Смугла» звучит естественно по-русски и согласуется с последующим упоминанием воздействия солнца; более буквальное «черна» сохранено в примечании.
- source_word: שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ
  choice: меня опалило солнце
  rationale: Глагол описывает обжигающее воздействие солнца. «Опалило» передаёт и жар, и заметное потемнение кожи, сохраняя поэтическую выразительность.
- source_word: בְּנֵי אִמִּי
  choice: Сыновья моей матери
  rationale: Сохранена точная родственная формула оригинала, которая может подчёркивать дистанцию между говорящей и её братьями.
- source_word: נִחֲרוּ בִי
  choice: разгневались на меня
  rationale: Форма глагола выражает разгоревшийся гнев. Такой перевод ясен современному читателю и не вводит в основной текст неестественный буквализм «разгорелись против меня».
- source_word: שָׂמֻנִי נֹטֵרָה אֶת־הַכְּרָמִים
  choice: поставили меня стеречь виноградники
  rationale: Передаёт принуждение или назначение говорящей к охране виноградников и естественно звучит на современном русском языке.
- source_word: כַּרְמִי שֶׁלִּי
  choice: своего виноградника
  rationale: 'Возвратное притяжательное местоимение передаёт усиленное указание оригинала: речь именно о её собственном винограднике.'
- source_word: לֹא נָטָרְתִּי
  choice: я не уберегла
  rationale: Глагол относится к тому же корню «стеречь, хранить», что и предыдущее обозначение её работы. «Не уберегла» сохраняет эту смысловую связь и допускает как прямое, так и метафорическое прочтение.
theological_decisions:
- issue: Метафорический смысл выражения «свой виноградник»
  choice: Сохранить образ виноградника без пояснения его значения в основном тексте.
  alternative: Раскрыть его как образ тела, внешности, целомудрия или личной жизни говорящей.
  rationale: В еврейском тексте метафорическое прочтение вероятно, однако точный референт не назван. Сохранение образа не устраняет намеренную поэтическую многозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической сжатости. Формулировки понятны обычному читателю, родственная конструкция и образ виноградника оставлены без сглаживания, а повтор значения корня נטר передан сочетанием «стеречь — не уберегла».
