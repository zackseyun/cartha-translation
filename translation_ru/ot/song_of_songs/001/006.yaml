  source_fidelity: 'Перевод точно передаёт синтаксические и смысловые компоненты еврейского текста: запрет обращать пристальное внимание на говорящую, её смуглость вследствие солнечного воздействия, гнев сыновей матери, назначение сторожить виноградники и противопоставление собственному винограднику. «Смугла» уместно передаёт שְׁחַרְחֹרֶת в данном контексте, не навязывая современных этнических коннотаций слову «черна». «Опалило солнце» хорошо отражает שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ. Повтор смыслового поля נטר сохранён сочетанием «стеречь» — «не уберегла».'
