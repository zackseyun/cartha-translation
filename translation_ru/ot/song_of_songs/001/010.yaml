translation:
  language: ru
  text: Как прекрасны твои щёки в рядах украшений[a], твоя шея — в ожерельях[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в украшениях». Еврейское слово, вероятно, означает ряды или упорядоченно расположенные элементы украшения; точный их вид неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в нитях бус». Еврейское слово относится к нанизанным украшениям, возможно бусинам или драгоценностям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוּ
  choice: прекрасны
  rationale: Глагол выражает красоту или привлекательность; «прекрасны» естественно передаёт поэтическую похвалу и не звучит архаично.
- source_word: לְחָיַיִךְ
  choice: твои щёки
  rationale: לְחִי обозначает щёку или область щеки и челюсти; в описании женских украшений «щёки» — наиболее естественный русский эквивалент.
- source_word: בַּתֹּרִים
  choice: в рядах украшений
  rationale: В данном параллелизме слово, вероятнее всего, указывает на ряды или расположение декоративных элементов. Перевод сохраняет идею упорядоченного украшения, не отождествляя его без достаточных оснований с каким-либо одним видом изделия.
- source_word: צַוָּארֵךְ
  choice: твоя шея
  rationale: Прямой и естественный эквивалент анатомического термина.
- source_word: בַּחֲרוּזִים
  choice: в нитях бус
  rationale: Редкое слово обозначает нанизанные элементы украшения; «нити бус» передают и способ расположения, и зрительный образ, поддерживая параллелизм стиха.
