  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: женское «я», характеристику שְׁחוֹרָה («черна»), обращение к дочерям Иерусалима и оба сравнения — с шатрами Кедара и завесами Соломона. «Черна» находится в допустимом семантическом диапазоне שְׁחוֹרָה и не навязывает этнического определения. Противительное «но» является контекстуально возможной передачей ו; буквальная соединительная возможность надлежащим образом сохранена в примечании.'
