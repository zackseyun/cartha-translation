  text: שְׁחוֹרָ֤ה אֲנִי֙ וְֽ/נָאוָ֔ה בְּנ֖וֹת יְרוּשָׁלִָ֑ם כְּ/אָהֳלֵ֣י קֵדָ֔ר כִּ/ירִיע֖וֹת שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/005.yaml
  text: I am dark[a], yet lovely, daughters of Jerusalem, like the tents of Kedar, like the curtains of Solomon.
translation:
  language: ru
  text: Я черна, но прекрасна[a], дочери Иерусалима, как шатры Кедара, как завесы Соломона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я черна и прекрасна». В еврейском тексте стоит обычный союз «и»; перевод «но» передаёт вероятное противопоставление в контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁחוֹרָה
  choice: черна
  rationale: Прилагательное обозначает чёрный или тёмный цвет. «Черна» прямо передаёт образ, не уточняя сверх текста этническую принадлежность или точный оттенок кожи; связь с потемневшей от солнца кожей раскрывается ближайшим контекстом (ст. 6).
- source_word: וְנָאוָה
  choice: но прекрасна
  rationale: Формально союз ו означает «и», однако в данном поэтическом контексте вероятен оттенок противопоставления. «Но прекрасна» естественно звучит по-русски; буквальная связь через «и» сохранена в примечании.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: дочери Иерусалима
  rationale: Прямой перевод сохраняет поэтическое обращение и женский собирательный образ; вариант «девушки Иерусалима» был бы более истолковывающим.
- source_word: כְּאָהֳלֵי קֵדָר
  choice: как шатры Кедара
  rationale: Прямое сравнение сохраняет историко-поэтический образ кочевых шатров Кедара, не добавляя в основной текст пояснения об их тёмном цвете.
- source_word: כִּירִיעוֹת שְׁלֹמֹה
  choice: как завесы Соломона
  rationale: יְרִיעוֹת может обозначать завесы, полотнища или шатровые покрывала. «Завесы» понятно современному читателю, сохраняет поэтический регистр и не сужает образ до одной конкретной конструкции.
theological_decisions:
- issue: Значение союза ו перед נָאוָה
  choice: противительное «но прекрасна»
  alternative: соединительное «и прекрасна»
  rationale: Контекст допускает подразумеваемое противопоставление между тёмным цветом кожи и красотой, но сам еврейский союз формально не выражает его однозначно. Поэтому вероятный смысл дан в основном тексте, а буквальная и богословски нейтральная альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного параллелизма и возвышенной поэтической формы. Обращение «дочери Иерусалима» оставлено буквально как устойчивый библейский образ.
