  text: Look[a], you are beautiful, my beloved; look, you are beautiful—your eyes are doves.
translation:
  language: ru
  text: Как ты прекрасна, любимая моя! Как ты прекрасна! Глаза твои — голуби.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
