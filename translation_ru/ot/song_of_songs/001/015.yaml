lexical_decisions:
- source_word: הִנָּךְ
  choice: Как ты
  rationale: Частица הִנֵּה с суффиксом 2-го лица женского рода здесь вводит эмоциональное восклицание и привлекает внимание к красоте возлюбленной. В современном русском «Как ты прекрасна!» естественнее передаёт эту живость, чем архаичное «вот» или книжное «воистину».
- source_word: יָפָה
  choice: прекрасна
  rationale: Прилагательное обозначает красоту и привлекательность. «Прекрасна» сохраняет возвышенный поэтический регистр и остаётся понятным современному читателю.
- source_word: רַעְיָתִי
  choice: любимая моя
  rationale: В Песни песней слово служит ласковым обращением к женщине. «Любимая моя» естественно передаёт близость и именной характер обращения, не внося дополнительных богословских смыслов.
- source_word: הִנָּךְ יָפָה
  choice: Как ты прекрасна
  rationale: Повтор сохранён полностью как значимый поэтический приём, усиливающий восхищение.
- source_word: עֵינַיִךְ
  choice: глаза твои
  rationale: Прямое соответствие конструкции с суффиксом 2-го лица женского рода; обратный порядок слов поддерживает поэтический регистр.
- source_word: יוֹנִים
  choice: голуби
  rationale: 'В еврейском тексте дано краткое именное сказуемое без показателя сравнения: буквально «глаза твои — голуби». Прямая метафора сохранена в основном тексте; возможное сравнительное понимание отмечено в сноске.'
