  text: While the king was at his table[b][a], my nard gave its fragrance.
translation:
  language: ru
  text: Пока царь был за своим столом[a], мой нард[b] источал благоухание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был на своём пиру»; возможно также: «возлежал». Еврейское слово может обозначать стол, пиршественное собрание или место возлежания.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «нардовое благовоние». Нард — ароматическое растение и приготовляемое из него благовоние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: Пока
  rationale: В поэтическом контексте слово вводит обстоятельство времени; «пока» естественно передаёт одновременность, не навязывая строго предельного значения «до тех пор, пока».
- source_word: שֶׁהַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное обозначает возлюбленного в образном мире песни. Строчная буква не привносит мессианского или иного богословского толкования.
- source_word: בִּמְסִבּוֹ
  choice: за своим столом
  rationale: Слово может обозначать стол, пиршественное собрание или место возлежания. Эта формулировка естественна по-русски и сохраняет вероятный образ трапезы; неоднозначность отмечена в сноске.
- source_word: נִרְדִּי
  choice: мой нард
  rationale: Имеется в виду ароматическое растение или благовоние из него; притяжательный суффикс передан словом «мой».
- source_word: נָתַן
  choice: источал
  rationale: Буквально глагол означает «дал», но сочетание «источал благоухание» естественно передаёт еврейскую идиому испускания запаха без изменения смысла.
- source_word: רֵיחוֹ
  choice: благоухание
  rationale: Положительно окрашенное слово подходит контексту любовной поэзии; принадлежность запаха нарду в русском ясна из конструкции и грамматического согласования.
theological_decisions:
- issue: Следует ли понимать слово «царь» как богословский или мессианский титул
  choice: «царь» со строчной буквы как персонаж поэтического мира Песни песней
  alternative: «Царь» с прописной буквы как указание на богословское или типологическое прочтение
  rationale: Еврейский текст сам по себе не требует титульной прописной буквы или мессианского истолкования; перевод сохраняет прямой литературный смысл и не исключает последующих интерпретаций.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим, достойным регистром. «Благоухание» сохраняет возвышенный чувственный тон, оставаясь понятным; синтаксис краток и близок к структуре еврейской строки.
