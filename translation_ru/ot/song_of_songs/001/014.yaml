lexical_decisions:
- source_word: אֶשְׁכֹּל
  choice: гроздь
  rationale: Существительное обозначает гроздь или пучок; здесь оно относится к соцветию хны, а не к виноградной грозди. «Гроздь» сохраняет конкретность и поэтический образ.
- source_word: הַכֹּפֶר
  choice: цветов хны
  rationale: В данном контексте כֹּפֶר, вероятнее всего, обозначает хну (Lawsonia inermis), ценившуюся за душистые цветы. Добавление «цветов» естественно раскрывает образ соцветия, выраженный сочетанием с אֶשְׁכֹּל.
- source_word: דּוֹדִי
  choice: мой возлюбленный
  rationale: В Песни песней слово обозначает любимого мужчину; «возлюбленный» точно передаёт смысл и сохраняет возвышенный поэтический регистр.
- source_word: לִי
  choice: для меня
  rationale: Предлог выражает личное отношение и оценку; «для меня» естественно передаёт эту связь по-русски.
- source_word: בְּכַרְמֵי
  choice: в виноградниках
  rationale: Предлог בְּ и форма множественного числа כֶּרֶם дают естественное пространственное значение «в виноградниках», не уточняя сверх текста, находится ли растение внутри них или среди них.
- source_word: עֵין גֶּדִי
  choice: Эн-Геди
  rationale: Географическое название передано принятой в русской библейской традиции формой «Эн-Геди».
