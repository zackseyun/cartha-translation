lexical_decisions:
- source_word: לְרֵיחַ שְׁמָנֶיךָ טוֹבִים
  choice: Благоуханны твои масла
  rationale: Сжатая поэтическая конструкция буквально связывает «запах/аромат» с «хорошими» маслами. Русское «благоуханны» естественно передаёт положительную оценку их аромата, сохраняя образ масел.
- source_word: שֶׁמֶן תּוּרַק שְׁמֶךָ
  choice: твоё имя — разлитое масло
  rationale: Сохранены конкретный образ масла и пассивное значение формы תּוּרַק — «разлито». Метафора уподобляет имя, то есть известность и саму личность возлюбленного, ароматному разлитому маслу.
- source_word: עַל־כֵּן
  choice: потому
  rationale: Передаёт связь основания и следствия, оставаясь естественным в русской лирической речи.
- source_word: עֲלָמוֹת
  choice: девушки
  rationale: Слово обозначает молодых женщин брачного возраста, но само по себе не требует более узкого значения «девственницы».
- source_word: אֲהֵבוּךָ
  choice: любят тебя
  rationale: Перфект передан настоящим временем как общее, актуальное утверждение в поэтическом контексте.
