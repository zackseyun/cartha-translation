  text: קֹר֤וֹת בָּתֵּ֨י/נוּ֙ אֲרָזִ֔ים רחיט/נו בְּרוֹתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/017.yaml
  text: The beams of our house are cedars[c][b][a]; our rafters are cypresses.
translation:
  language: ru
  text: Балки нашего дома — кедры[a], стропила наши[b] — кипарисы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наших домов»; еврейская форма стоит во множественном числе, хотя здесь возможен собирательный смысл: «наш дом, наше жилище».'
    reason: lexical_alternative
  - marker: b
    text: 'Значение еврейского слова не вполне ясно; возможно также: «обшивка» или «галереи».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «можжевельники» либо «пихты»; точная порода дерева неизвестна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרוֹת
  choice: балки
  rationale: Слово обозначает конструкционные брёвна или брусья, особенно кровельные балки; «балки» естественно передаёт архитектурный образ и сохраняет параллелизм.
- source_word: בָּתֵּינוּ
  choice: нашего дома
  rationale: Форма морфологически множественная («наших домов»), но в поэтическом контексте может иметь собирательный смысл общего жилища; единственное число естественно по-русски, а буквальная возможность отмечена в сноске.
- source_word: אֲרָזִים
  choice: кедры
  rationale: Прямое соответствие множественному числу; в именной части сказуемого обозначает кедровую древесину или кедровые брусья.
- source_word: רחיטנו
  choice: стропила наши
  rationale: Значение редкого архитектурного термина не вполне ясно. «Стропила» согласуется с параллельным упоминанием балок, тогда как другие возможные значения сохранены в сноске.
- source_word: בְּרוֹתִים
  choice: кипарисы
  rationale: Точное определение породы дерева спорно; «кипарисы» — традиционно и контекстуально уместное соответствие рядом с кедрами, без устранения неопределённости, отмеченной в сноске.
