lexical_decisions:
- source_word: שִׁיר
  choice: Песнь
  rationale: Существительное означает «песня, песнь»; в заглавной формуле литературное «песнь» естественно для современного русского библейского текста.
- source_word: הַשִּׁירִים
  choice: песней
  rationale: Сохраняет прозрачную еврейскую конструкцию превосходной степени «Песнь песней», не заменяя её истолкованием «лучшая песнь».
- source_word: אֲשֶׁר
  choice: которая
  rationale: Относительное местоимение согласовано с «Песнь» и вводит определение, связывающее произведение с Соломоном.
- source_word: לִשְׁלֹמֹה
  choice: Соломона
  rationale: Родительный оборот после паузы кратко и достаточно широко передаёт принадлежность или связь, не утверждая однозначно авторство, адресацию либо тематику.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Имя передано в его общепринятой русской библейской форме; в тексте употреблён родительный падеж «Соломона».
theological_decisions:
- issue: Характер связи песни с Соломоном, выраженный לִשְׁלֹמֹה
  choice: 'Передать широко: «которая — Соломона»'
  alternative: «написанная Соломоном»; «для Соломона»; «о Соломоне»
  rationale: Предлог לְ допускает авторство, посвящение, предназначение, принадлежность или иную связь. Выбранная формулировка сохраняет эту открытость и не усиливает историко-богословское утверждение текста.
translation_notes:
  register: Современный литературный русский с сохранением традиционной и узнаваемой формулы «Песнь песней». Тире помогает естественно прочитать намеренно широкое обозначение связи с Соломоном.
