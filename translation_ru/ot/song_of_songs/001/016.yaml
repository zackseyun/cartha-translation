lexical_decisions:
- source_word: הִנְּךָ
  choice: Вот, ты
  rationale: Указательно-восклицательная частица привлекает внимание к собеседнику; «вот» естественно передаёт её выразительную силу в русском поэтическом контексте.
- source_word: יָפֶה
  choice: красив
  rationale: Прилагательное обозначает внешнюю красоту и привлекательность; мужская форма соответствует обращению к возлюбленному.
- source_word: דוֹדִי
  choice: мой возлюбленный
  rationale: В Песни песней это устойчивое обозначение любимого мужчины; выбор сохраняет поэтический и близкий характер обращения.
- source_word: אַף
  choice: и
  rationale: В обоих случаях частица имеет присоединительно-усилительную силу. Русское «и» передаёт её естественно, не перегружая краткую поэтическую строку.
- source_word: נָעִים
  choice: приятен
  rationale: Слово выражает приятность, привлекательность и очарование; «приятен» прямо передаёт смысл и сохраняет параллелизм с «красив».
- source_word: עַרְשֵׂנוּ
  choice: ложе наше
  rationale: Существительное может означать ложе, постель или место отдыха. «Ложе» сохраняет поэтический регистр и не устраняет возможный интимный оттенок.
- source_word: רַעֲנָנָה
  choice: зеленеет
  rationale: Прилагательное буквально связано со свежестью, зеленью и пышной растительностью. Предикативное «зеленеет» звучит по-русски естественнее, чем «зелено», и живо вызывает образ природного ложа, хотя еврейская форма является прилагательным.
