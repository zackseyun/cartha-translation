  text: אִם לֹ֤א תֵדְעִי֙ לָ֔/ךְ הַ/יָּפָ֖ה בַּ/נָּשִׁ֑ים צְֽאִי לָ֞/ךְ בְּ/עִקְבֵ֣י הַ/צֹּ֗אן וּ/רְעִי֙ אֶת גְּדִיֹּתַ֔יִ/ךְ עַ֖ל מִשְׁכְּנ֥וֹת הָ/רֹעִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/008.yaml
  text: If you do not know[a], most beautiful among women, go out for yourself in the tracks of the flock[b], and pasture your young goats beside the shepherds’ tents.
translation:
  language: ru
  text: Если ты не знаешь, прекраснейшая из женщин, выйди по следам стада[a] и паси своих козлят[b] возле шатров пастухов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иди за стадом»; буквально: «по следам стада».'
    reason: lexical_alternative
  - marker: b
    text: То есть молодых коз.
    reason: lexical_clarification
lexical_decisions:
- source_word: אִם לֹא תֵדְעִי
  choice: Если ты не знаешь
  rationale: Условная конструкция передана прямо и естественно. ידע здесь означает знать, куда идти или что делать; дополнение в еврейском тексте подразумевается.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: прекраснейшая из женщин
  rationale: Сочетание прилагательного с בְּ и названием группы имеет превосходное значение. Такая формулировка сохраняет поэтичность и понятна современному читателю.
- source_word: צְאִי לָךְ
  choice: выйди
  rationale: Императив означает «выйди». Местоименный дательный לָךְ придаёт личную или возвратную окраску, но буквальное «выйди себе» по-русски неестественно и не добавляет здесь ясного отдельного смысла.
- source_word: בְּעִקְבֵי הַצֹּאן
  choice: по следам стада
  rationale: עִקְבֵי обозначает следы, отпечатки ног или пятки. Перевод сохраняет конкретный пастушеский образ и допускает смысл движения вслед за стадом.
- source_word: וּרְעִי אֶת גְּדִיֹּתַיִךְ
  choice: и паси своих козлят
  rationale: רעה здесь означает пасти или давать пастись, а גְּדִיֹּת — молодых коз. «Козлят» — точное и естественное русское обозначение.
- source_word: עַל מִשְׁכְּנוֹת הָרֹעִים
  choice: возле шатров пастухов
  rationale: В пастушеском контексте מִשְׁכְּנוֹת — места обитания, вероятнее всего шатры; עַל здесь выражает пространственную близость.
