  text: I compare you[a], my beloved, to my mare among Pharaoh’s chariots.
translation:
  language: ru
  text: Я уподобил тебя, моя возлюбленная, моей кобылице среди колесниц фараона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסֻסָתִי
  choice: моей кобылице
  rationale: 'Существительное סוּסָה обозначает самку лошади, а суффикс первого лица единственного числа выражает принадлежность: «моей кобылице». Конкретный женский образ сохранён.'
- source_word: בְּרִכְבֵי פַרְעֹה
  choice: среди колесниц фараона
  rationale: Предлог בְּ здесь естественно передаёт нахождение или включённость в окружение царских колесниц; «среди» сохраняет яркий сравнительный образ и не создаёт впечатления, будто кобылица находится внутри колесницы.
- source_word: דִּמִּיתִיךְ
  choice: я уподобил тебя
  rationale: Форма породы пиэль от דמה с местоименным суффиксом 2-го лица женского рода означает «я уподобил/сравнил тебя». «Уподобил» точно и поэтично передаёт завершённую форму еврейского глагола.
- source_word: רַעְיָתִי
  choice: моя возлюбленная
  rationale: В Песни песней это нежное обращение к любимой женщине. «Возлюбленная» сохраняет интимный и возвышенный регистр, не ослабляя романтического смысла.
