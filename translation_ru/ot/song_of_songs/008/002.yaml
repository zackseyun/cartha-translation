  yaml_path: translation/ot/song_of_songs/008/002.yaml
  text: I would lead you and bring you into my mother’s house[a], where she taught me; I would give you spiced wine to drink[b], from the juice of my pomegranate.
translation:
  language: ru
  text: Я повела бы тебя и привела бы в дом моей матери[a], которая учила меня; я напоила бы тебя пряным вином[b], соком моего граната.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты учил бы меня». Краткая поэтическая фраза допускает отнесение глагола как к матери, так и к возлюбленному.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сладким вином из моего граната». Еврейское слово может обозначать свежий сок, сладкий напиток или сусло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶנְהָגֲךָ
  choice: Я повела бы тебя
  rationale: Имперфект 1-го лица ед. числа с суффиксом 2-го лица муж. рода в поэтическом контексте передан условно-желательным оборотом «повела бы», а не простым будущим.
- source_word: אֲבִיאֲךָ
  choice: и привела бы
  rationale: Каузативное значение глагола בוא и параллелизм с предыдущим глаголом естественно передаются русским «привела бы».
- source_word: בֵּית אִמִּי
  choice: в дом моей матери
  rationale: Предлог אֶל после глагола движения указывает на вход или направленность внутрь; русское «в дом» звучит естественно.
- source_word: תְּלַמְּדֵנִי
  choice: которая учила меня
  rationale: Форма допускает отнесение к матери как к субъекту женского рода; придаточное предложение ясно передаёт эту связь, не устраняя альтернативный синтаксический разбор, отмеченный в сноске.
- source_word: אַשְׁקְךָ
  choice: я напоила бы тебя
  rationale: Порода hифиль выражает побуждение или предоставление питья; «напоила бы» кратко и естественно сохраняет каузативный смысл.
- source_word: מִיַּיִן הָרֶקַח
  choice: пряным вином
  rationale: Сочетание обозначает вино, приготовленное с пряностями или ароматическими добавками; «пряное вино» сохраняет чувственный и праздничный образ.
- source_word: מֵעֲסִיס רִמֹּנִי
  choice: соком моего граната
  rationale: עָסִיס может означать свежий сок, сладкий напиток или сусло. «Сок» не навязывает степень брожения, а единственное число и притяжательность сохраняют форму еврейского текста.
theological_decisions:
- issue: Кто является субъектом תְּלַמְּדֵנִי
  choice: «которая учила меня» — субъектом считается мать
  alternative: «ты учил бы меня» — субъектом считается возлюбленный
  rationale: Краткий поэтический синтаксис и совпадение соответствующих глагольных форм позволяют два прочтения. Основной текст следует ближайшему существительному женского рода, а иной разбор сохранён в сноске без богословского переосмысления.
translation_notes:
  register: Современный литературный русский язык с мягко-поэтическим, но понятным строем. Женский род говорящей сохранён. Условно-желательные формы передают устремлённость речи, а образность оригинала не расширена конфессиональными или аллегорическими толкованиями.
