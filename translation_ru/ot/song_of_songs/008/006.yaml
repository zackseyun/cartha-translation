  source_fidelity: 'Основные соответствия масоретскому тексту сохранены: повелительная просьба, двукратный образ печати, сравнения любви со смертью и ревности с Шеолом, а также повтор огненной лексики. «Шеол» и явный элемент יָה переданы прозрачно; спорное усилительное прочтение последнего выражения корректно вынесено в сноску. Однако в заключительной строке русская пунктуация недостаточно ясно оформляет «пламя Яха» как завершающее приложение к «вспышкам огня».'
