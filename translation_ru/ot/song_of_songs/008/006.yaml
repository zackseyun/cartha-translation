base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/006.yaml
  text: Set me as a seal upon your heart[a], as a seal upon your arm; for love is as strong as death, jealousy as relentless as Sheol. Its flashes are flashes of fire[c][b], a flame of Yah.
translation:
  language: ru
  text: 'Положи меня, как печать, на своё сердце, как печать — на свою руку; ведь любовь крепка, как смерть, ревность неумолима, как Шеол[a]. Её вспышки — вспышки огня: пламя Яха[c][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Шеол — мир мёртвых; выражение можно также передать: «ревность сурова, как могила».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Её искры — искры огня».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пламя Яха», где Ях — краткая форма имени Яхве. Возможно также усилительное понимание: «могучее пламя» или «яростное пламя».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂימֵנִי
  choice: Положи меня
  rationale: Повелительная форма с местоименным суффиксом передана прямо и лично; глагол сохраняет образ помещения печати, не добавляя идеи ношения или запечатления.
- source_word: כַחוֹתָם
  choice: как печать
  rationale: חוֹתָם обозначает печать или перстень-печатку, служившие знаком принадлежности и удостоверения. «Печать» понятно современному читателю и сохраняет широту образа.
- source_word: עַל לִבֶּךָ
  choice: на сердце твоё
  rationale: Буквенный поэтический образ сохранён; постпозиция местоимения поддерживает возвышенный, но понятный регистр.
- source_word: עַל זְרוֹעֶךָ
  choice: на руку твою
  rationale: В данном образе русское «рука» звучит естественнее анатомического «предплечье» и охватывает значение זְרוֹעַ, сохраняя параллель с сердцем.
- source_word: כִּי עַזָּה כַמָּוֶת אַהֲבָה
  choice: ведь любовь крепка, как смерть
  rationale: עַזָּה передаёт силу и мощь; «крепка» естественно сочетается с любовью и сохраняет резкое сравнение со смертью.
- source_word: קָשָׁה כִשְׁאוֹל קִנְאָה
  choice: ревность неумолима, как Шеол
  rationale: קִנְאָה сохраняет значение исключительной, ревнивой страсти, а «неумолима» выражает суровую непреклонность קָשָׁה и соответствует образу неизбежности Шеола.
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Сохраняется конкретный древнееврейский термин, чтобы не сводить его значение только к могиле; пояснение дано в сноске.
- source_word: רְשָׁפֶיהָ
  choice: Её вспышки
  rationale: רֶשֶׁף может обозначать вспышку, искру, пламя или огненную стрелу. «Вспышки» сохраняют яркую динамику образа и допускают связь как с любовью, так и с ревностью.
- source_word: רִשְׁפֵּי אֵשׁ
  choice: вспышки огня
  rationale: Повтор слова «вспышки» воспроизводит еврейское лексическое повторение и поэтическое усиление.
- source_word: שַׁלְהֶבֶתְ יָה
  choice: пламя Яха
  rationale: יָה — краткая форма божественного имени. Её явное сохранение следует древнееврейскому тексту и не устраняет возможный богословско-поэтический оттенок; усилительное понимание отмечено в сноске.
theological_decisions:
- issue: Содержит ли שַׁלְהֶבֶתְ יָה прямое упоминание божественного имени или только усилительную конструкцию
  choice: 'Сохранить имя: «пламя Яха»'
  alternative: «могучее пламя» или «яростное пламя»
  rationale: В масоретском тексте присутствует יָה, краткая форма божественного имени. Основной текст сохраняет её, а спорное усилительное толкование не исключается и приводится в сноске.
- issue: Следует ли смягчать קִנְאָה до «страсти» или «пыла»
  choice: «ревность»
  alternative: «страсть», «пыл» или «рвение»
  rationale: «Ревность» сохраняет обычное лексическое ядро слова и напряжённый образ исключительной, требовательной любви, не сглаживая его для романтического контекста.
- issue: К чему относится женский суффикс в רְשָׁפֶיהָ
  choice: Передать местоимением «её», не уточняя референт
  alternative: Явно отнести вспышки к любви либо к ревности
  rationale: И «любовь», и «ревность» в древнееврейском имеют женский род и могут служить ближайшим смысловым референтом. Русское «её» сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Синтаксический параллелизм и повтор исходного текста сохранены; архаизмы по возможности исключены. Термины «Шеол» и «Ях» оставлены ради точности и сопровождаются краткими пояснениями.
