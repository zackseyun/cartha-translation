base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/012.yaml
  text: My vineyard[a], my very own, is before me. The thousand is for you, Solomon[b], and two hundred for those who keep its fruit.
translation:
  language: ru
  text: Мой виноградник — мой собственный — передо мной.[a] Тысяча[b] — тебе, Соломон, а двести — тем, кто стережёт его плоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Передо мной» может также подразумевать «в моём распоряжении» или «под моей властью».
    reason: lexical_alternative
  - marker: b
    text: В предыдущем стихе говорится о тысяче серебряников; здесь в еврейском тексте сказано лишь «тысяча», а затем «двести», без названия денежной единицы.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְמִי שֶׁלִּי
  choice: Мой виноградник — мой собственный
  rationale: כֶּרֶם обычно означает «виноградник», а שֶׁלִּי подчёркивает принадлежность. Формулировка сохраняет и образ, и усиленное указание на владение, не истолковывая метафору вместо читателя.
- source_word: לְפָנָי
  choice: передо мной
  rationale: 'Буквальное пространственное выражение сохраняет поэтическую неоднозначность: речь может идти как о непосредственном присутствии, так и о распоряжении или контроле.'
- source_word: הָאֶלֶף
  choice: Тысяча
  rationale: В стихе названо только «тысяча»; денежная единица подразумевается контекстом предыдущего стиха, но в основной текст не добавляется.
- source_word: לְךָ שְׁלֹמֹה
  choice: тебе, Соломон
  rationale: Предлог לְ выражает предназначение или принадлежность; краткая русская конструкция естественно передаёт прямое обращение.
- source_word: וּמָאתַיִם
  choice: а двести
  rationale: Число передано без добавления денежной единицы, которой в данном стихе нет; союз «а» ясно обозначает распределение второй доли.
- source_word: לְנֹטְרִים
  choice: тем, кто стережёт
  rationale: Причастие от נטר обозначает тех, кто хранит, охраняет или сторожит. «Стережёт» естественно для виноградника и сохраняет оттенок охраны.
- source_word: אֶת־פִּרְיוֹ
  choice: его плоды
  rationale: פְּרִי может означать плод или урожай. Множественное «плоды» естественно по-русски в связи с виноградником, а местоимение относится к нему.
