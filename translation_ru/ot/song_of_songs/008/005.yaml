  source_fidelity: 'Основной смысл передан точно: восхождение из пустыни, опора на возлюбленного, прямое обращение во второй части, повтор «там» и образ родовых мук сохранены. «Пробудила» обоснованно передаёт עוֹרַרְתִּיךָ, не навязывая более сильный эротический смысл. Женский род русского глагола является интерпретационным следствием вероятной, но не прямо названной в еврейском тексте говорящей; это надлежащим образом оговорено в сноске.'
