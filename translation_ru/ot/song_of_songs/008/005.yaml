base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/005.yaml
  text: Who is this coming up from the wilderness[a], leaning on her beloved? Under the apple tree I awakened you; there your mother was in labor with you[c][b]; there she who bore you was in labor.
translation:
  language: ru
  text: Кто это поднимается из пустыни, опираясь на своего возлюбленного? Под яблоней[a] я пробудила тебя[b][c]; там твоя мать мучилась родами, там мучилась родами та, что родила тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «под абрикосовым деревом»; точный вид дерева, обозначенного еврейским словом, неизвестен, хотя «яблоня» — традиционный перевод.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «возбудила тебя»; в контексте любовной поэзии еврейский глагол может означать не только пробуждение ото сна.'
    reason: alternative_reading
  - marker: c
    text: 'Вероятно, в середине стиха голос меняется: после вопроса наблюдателей звучит прямое обращение женщины к мужчине. Однако еврейский текст прямо не называет говорящего; русский язык требует выбрать род в слове «пробудила».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  choice: поднимается
  rationale: Причастие от עלה обозначает движение вверх или выход из местности; «поднимается» естественно передаёт образ движения и сохраняет его направленность.
- source_word: הַמִּדְבָּר
  choice: из пустыни
  rationale: מִדְבָּר может обозначать пустыню или безлюдную, невозделанную местность. «Пустыня» — ясный и традиционный русский эквивалент, не сужающий здесь поэтический образ сверх контекста.
- source_word: מִתְרַפֶּקֶת עַל
  choice: опираясь на
  rationale: Редкая возвратная форма выражает тесную физическую близость и поддержку. «Опираясь на» естественно соответствует предлогу עַל и не усиливает значение до «цепляясь».
- source_word: דּוֹדָהּ
  choice: своего возлюбленного
  rationale: В Песни песней דּוֹד обозначает любимого мужчину. «Возлюбленный» сохраняет любовный и литературный регистр; возвратное «своего» естественно по-русски соотносится с женщиной, о которой задан вопрос.
- source_word: תַּחַת הַתַּפּוּחַ
  choice: под яблоней
  rationale: «Яблоня» — традиционный и понятный перевод תַּפּוּחַ, хотя точный ботанический вид остаётся неустановленным; неопределённость отмечена в сноске.
- source_word: עוֹרַרְתִּיךָ
  choice: я пробудила тебя
  rationale: עור может означать «будить, пробуждать» и допускать оттенок любовного возбуждения. «Пробудила» сохраняет основное значение и поэтическую многозначность; женский род обусловлен наиболее вероятной ролью говорящей, поскольку русский прошедший глагол требует указания рода.
- source_word: חִבְּלַתְךָ
  choice: мучилась родами
  rationale: В данном контексте חבל описывает родовые муки. Формулировка передаёт телесное страдание и сохраняет параллелизм двух строк.
- source_word: יְלָדַתְךָ
  choice: родившая тебя
  rationale: ילד прямо обозначает рождение. Причастная конструкция ясно называет мать и позволяет сохранить повтор выражения о родовых муках.
- source_word: שָׁמָּה ... שָׁמָּה
  choice: там ... там
  rationale: Повтор наречия сохранён ради еврейского акцента и поэтического параллелизма.
theological_decisions:
- issue: Смена говорящего и адресата во второй половине стиха
  choice: 'Первая часть передана как вопрос наблюдателей о женщине, а затем сохранено прямое обращение: «я пробудила тебя… твоя мать».'
  alternative: Приписать весь стих одному явно названному говорящему либо сгладить переход от третьего лица ко второму.
  rationale: Еврейский текст переходит от «её возлюбленного» к формам второго лица, не называя говорящего. Перевод сохраняет литературный переход и не превращает вероятную идентификацию голоса в несомненный факт.
- issue: Возможный эротический оттенок עוֹרַרְתִּיךָ
  choice: «пробудила тебя» с указанием варианта в сноске
  alternative: «возбудила тебя»
  rationale: В любовной поэзии возможен более сильный оттенок, но лексема не требует его однозначного выражения. Основной текст сохраняет смысловую открытость.
translation_notes:
  register: Современный литературный русский с сохранением достоинства любовной поэзии, синтаксического перехода и повторов оригинала. Архаизмы и конфессионально обусловленные толкования не вводятся. Маркер ботанической сноски поставлен непосредственно после «яблоней», к которой эта сноска относится.
