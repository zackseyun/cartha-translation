base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/014.yaml
  text: Flee[a], my beloved[c][b], and be like a gazelle or a young stag on the mountains of spices.
translation:
  language: ru
  text: Беги[a], мой возлюбленный[c], и будь подобен газели или молодому оленю[b] на горах благовоний.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Умчись» или «поспеши прочь». Еврейский глагол буквально может означать «бежать, убегать», но здесь, вероятно, подчёркивает стремительное движение в любовном поэтическом образе, а не бегство из страха.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «молодому самцу оленя». Еврейское выражение буквально обозначает молодое животное из числа оленей.'
    reason: lexical_alternative
  - marker: c
    text: Ср. Песн. 2:17, где возлюбленный также уподобляется газели или молодому оленю на горах.
    reason: cross_reference
lexical_decisions:
- source_word: בְּרַח
  choice: Беги
  rationale: Императив от ברח буквально означает «беги», «убегай». Такой перевод сохраняет стремительность движения и не устраняет возможную напряжённость образа; примечание поясняет, что в любовной поэзии речь не обязательно идёт о бегстве из страха.
- source_word: דּוֹדִי
  choice: мой возлюбленный
  rationale: В Песни песней דּוֹד — ласковое обозначение мужчины, которого любит говорящая. «Мой возлюбленный» точно передаёт отношение и соответствует возвышенному, но понятному поэтическому регистру.
- source_word: וּדְמֵה לְךָ
  choice: и будь подобен
  rationale: Оборот с דמה и ל выражает уподобление. «Будь подобен» естественно передаёт повелительное значение и сохраняет поэтический параллелизм.
- source_word: לִצְבִי
  choice: газели
  rationale: צְבִי обозначает газель — образ грации и быстроты. Современное русское «газель» точно и понятно.
- source_word: אֹו לְעֹפֶר הָאַיָּלִים
  choice: или молодому оленю
  rationale: עֹפֶר — детёныш или молодое животное, а אַיָּלִים — олени, самцы оленя. «Молодой олень» естественно по-русски передаёт мужской образ, соотнесённый с возлюбленным.
- source_word: עַל הָרֵי בְשָׂמִים
  choice: на горах благовоний
  rationale: עַל имеет обычное пространственное значение «на», а בְשָׂמִים обозначает ароматические вещества, пряности или благовония. «Горы благовоний» сохраняют намеренно чувственный и поэтически неопределённый образ.
