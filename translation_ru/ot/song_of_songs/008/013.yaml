  yaml_path: translation/ot/song_of_songs/008/013.yaml
  text: You who dwell in the gardens[a], companions are listening for your voice; let me hear it.
translation:
  language: ru
  text: Ты, живущая в садах, — друзья прислушиваются к твоему голосу; дай мне услышать его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделай так, чтобы я услышал».'
    reason: Сноска сохраняет явное побудительное значение еврейской формы, тогда как основной текст передаёт его естественной русской просьбой.
lexical_decisions:
- source_word: הַיּוֹשֶׁבֶת
  choice: Ты, живущая
  rationale: Определённое причастие женского рода единственного числа употреблено как обращение к женщине. Такая передача сохраняет длительный характер действия и естественно звучит по-русски.
- source_word: בַּגַּנִּים
  choice: в садах
  rationale: Сохранено множественное число исходного текста; предлог естественно передан как «в».
- source_word: חֲבֵרִים
  choice: друзья
  rationale: Слово обозначает друзей или спутников. «Друзья» понятно современному читателю и сохраняет близкие отношения, не уточняя их сверх сказанного в тексте.
- source_word: מַקְשִׁיבִים לְקוֹלֵךְ
  choice: прислушиваются к твоему голосу
  rationale: Причастие передаёт внимательное слушание. Глагол «прислушиваются» сохраняет оттенок сосредоточенного, ожидающего внимания, а управление «к голосу» соответствует русской норме.
- source_word: הַשְׁמִיעִינִי
  choice: дай и мне услышать его
  rationale: Побудительная форма буквально означает «сделай так, чтобы я услышал». Русское «дай мне услышать» естественно выражает просьбу; «и» подчёркивает сопоставление с друзьями, а местоимение «его» ясно отсылает к голосу.
