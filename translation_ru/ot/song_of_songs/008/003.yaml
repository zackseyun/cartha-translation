lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: его левая рука
  rationale: Существительное обозначает левую сторону или левую руку. В контексте объятия естественно уточнить подразумеваемую «руку», сохраняя образ оригинала.
- source_word: תַּחַת
  choice: под
  rationale: Прямое и естественное соответствие пространственному значению предлога «под, ниже».
- source_word: רֹאשִׁי
  choice: у меня под головой
  rationale: Существительное с суффиксом первого лица буквально означает «моя голова»; конструкция «у меня под головой» звучит по-русски естественно и точно передаёт положение руки.
- source_word: וִימִינוֹ
  choice: а правая
  rationale: Буквально «и его правая [рука/сторона]». В русском после явно названной левой руки слово «рука» естественно опускается, а принадлежность тому же мужчине ясна из параллелизма.
- source_word: תְּחַבְּקֵנִי
  choice: обнимает меня
  rationale: Форма от חבק означает «обнимать». Настоящее время естественно передаёт незавершённое, живо изображённое действие.
