base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/008.yaml
  text: We have a little sister[a], and she has no breasts. What shall we do for our sister on the day when she is spoken for?
translation:
  language: ru
  text: Есть у нас маленькая сестра, а грудей у неё нет. Что нам делать для нашей сестры в тот день, когда будут говорить о ней[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда станут договариваться о ней». Еврейское выражение может означать, что о ней будут говорить или вести переговоры; в данном контексте, вероятно, имеются в виду переговоры о браке.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוֹת לָנוּ
  choice: Есть у нас ... сестра
  rationale: 'Конструкция буквально выражает принадлежность: «у нас есть сестра». Такой порядок слов естественен по-русски и сохраняет лёгкую поэтическую приподнятость.'
- source_word: קְטַנָּה
  choice: маленькая
  rationale: Прилагательное может указывать на малый возраст или размер. «Маленькая» сохраняет эту широту лучше, чем «младшая», которое уточняло бы порядок рождения.
- source_word: וְשָׁדַיִם אֵין לָהּ
  choice: а грудей у неё нет
  rationale: Сохранена прямая и конкретная формулировка еврейского текста без поясняющего добавления «ещё» или истолкования «не развилась».
- source_word: מַה נַּעֲשֶׂה
  choice: Что нам сделать
  rationale: Форма передаёт совместное обдумывание будущего действия; русский инфинитив с дательным субъектом звучит естественно и сохраняет совещательный оттенок.
- source_word: לַאֲחֹתֵנוּ
  choice: для нашей сестры
  rationale: Предлог ל здесь естественно передаёт действие ради сестры или в её отношении; «для» подчёркивает заботу, не исключая более широкого контекста.
- source_word: בַּיּוֹם
  choice: в тот день
  rationale: Сохранён образ конкретного дня и структура исходного выражения; указательное «тот» делает русскую фразу связной.
- source_word: שֶׁיְּדֻבַּר בָּהּ
  choice: когда о ней заговорят
  rationale: Пассивная конструкция с דבר и ב допускает общее значение обсуждения. Русская безличная формулировка сохраняет неопределённого деятеля и не сводит смысл исключительно к сватовству.
