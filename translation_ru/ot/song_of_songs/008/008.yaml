  source_fidelity: 'Основной смысл передан точно: у говорящих есть маленькая сестра; её физическая незрелость выражена прямо; затем следует совместный вопрос о действиях в день, когда о ней будет идти речь. Однако «заговорят о ней» добавляет оттенок начала разговора, которого в пассивной форме יְדֻבַּר («будут говорить / будет говориться») нет.'
  naturalness: Текст в целом современный и литературный. «Что нам делать» несколько естественнее как вопрос о предстоящем решении, чем «Что нам сделать». «Когда будут говорить о ней» звучит нейтрально и не вносит аспектуального значения начала обсуждения.
  terminology: «Грудей у неё нет» сохраняет прямоту еврейского выражения и не подменяет его диагностическим или эвфемистическим толкованием. Сноска корректно отмечает вероятный контекст брачных переговоров, не превращая его в единственно возможное значение.
