  text: כֶּ֣רֶם הָיָ֤ה לִ/שְׁלֹמֹה֙ בְּ/בַ֣עַל הָמ֔וֹן נָתַ֥ן אֶת הַ/כֶּ֖רֶם לַ/נֹּטְרִ֑ים אִ֛ישׁ יָבִ֥א בְּ/פִרְי֖/וֹ אֶ֥לֶף כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/011.yaml
  text: Solomon had a vineyard at Baal-hamon[a]; he gave the vineyard to keepers[c][b]. Each man was to bring a thousand pieces of silver for its fruit.
translation:
  language: ru
  text: У Соломона был виноградник в Баал-Гамоне; он отдал виноградник смотрителям[a]. Каждый должен был приносить за его плоды тысячу серебром[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поручил виноградник смотрителям». Древнееврейский глагол имеет широкое значение «дал, отдал» и здесь может подразумевать передачу в управление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тысячу серебра». Единица веса или денежного счёта в древнееврейском тексте не названа. Выражение «за его плоды» можно также понять как «из его плодов» или «со своими плодами»; местоименный суффикс может относиться к винограднику либо, распределительно, к урожаю каждого смотрителя.'
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: כֶּרֶם
  choice: виноградник
  rationale: Существительное обозначает возделываемый виноградник, а не отдельную лозу; один и тот же перевод уместен в обоих случаях.
- source_word: הָיָה לִשְׁלֹמֹה
  choice: У Соломона был
  rationale: Древнееврейская конструкция обладания буквально означает «был у Соломона»; русский оборот естественно и точно передаёт этот смысл.
- source_word: בְּבַעַל הָמוֹן
  choice: в Баал-Гамоне
  rationale: Сочетание понимается как название местности; предлог «в» естественно выражает местонахождение.
- source_word: נָתַן אֶת־הַכֶּרֶם לַנֹּטְרִים
  choice: он отдал виноградник смотрителям
  rationale: נתן имеет широкое значение «дать, отдать». В контексте хозяйственного управления «отдал ... смотрителям» сохраняет основную лексику, не уточняя без достаточных оснований юридическую форму отношений.
- source_word: לַנֹּטְרִים
  choice: смотрителям
  rationale: Причастие от נטר обозначает тех, кто хранит, сторожит или присматривает. «Смотрители» охватывает как охрану, так и попечение о винограднике.
- source_word: אִישׁ יָבִא
  choice: Каждый должен был приносить
  rationale: Единственное число имеет распределительное значение, а имперфект выражает ожидаемое или установленное действие. Формулировка передаёт обязанность в рамках описанного порядка.
- source_word: בְּפִרְיוֹ
  choice: за его плоды
  rationale: Суффикс естественно соотносится с виноградником, а предлог ב в данном хозяйственном контексте выражает отношение платежа к урожаю. Русское местоимение сохраняет возможную формальную соотнесённость и с ближайшим участником, поэтому неоднозначность отмечена в сноске.
- source_word: אֶלֶף כָּסֶף
  choice: тысячу серебром
  rationale: В тексте буквально сказано «тысячу серебра» без названия единицы. Оборот «тысячу серебром» сохраняет эту неопределённость и не добавляет ни монет, ни сиклей.
