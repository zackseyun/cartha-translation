  text: הִשְׁבַּ֥עְתִּי אֶתְ/כֶ֖ם בְּנ֣וֹת יְרוּשָׁלִָ֑ם מַה תָּעִ֧ירוּ וּֽ/מַה תְּעֹֽרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/004.yaml
  text: 'I adjure you[b][a], daughters of Jerusalem: why should you awaken or stir up love until it desires?'
translation:
  language: ru
  text: 'Заклинаю вас, дочери Иерусалима: зачем вам будить, зачем пробуждать любовь, пока она сама не пожелает?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Заклинаю вас, дочери Иерусалима: не будите и не пробуждайте любовь, пока она сама не пожелает». В еврейском тексте употреблена вопросительная форма («зачем…?»), однако всё выражение имеет силу настойчивого предостережения.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: Заклинаю
  rationale: Каузативная форма от שׁבע означает связать клятвой, торжественно обязать. «Заклинаю» естественно и кратко передаёт торжественную силу обращения в поэтическом контексте.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: дочери Иерусалима
  rationale: Буквально передаёт устойчивое поэтическое обращение Песни песней, не заменяя его толкованием «девушки Иерусалима».
- source_word: מַה
  choice: зачем вам
  rationale: Сохраняет явную вопросительную форму еврейского текста и одновременно передаёт её увещевательную, близкую к запрету силу.
- source_word: תָּעִירוּ וּמַה תְּעֹרְרוּ
  choice: будить, зачем пробуждать
  rationale: Два родственных глагола переданы близкими, но различными словами, чтобы сохранить поэтическое удвоение. Повтор «зачем» отражает повтор מַה.
- source_word: הָאַהֲבָה
  choice: любовь
  rationale: 'Сохраняет широту существительного: речь может идти о любви как переживании, страсти или действующей силе.'
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: пока она сама не пожелает
  rationale: Глагол стоит в женском роде и согласуется с «любовью», поэтому русский текст естественно сохраняет олицетворение. «Сама» ясно выражает внутреннюю волю любви, не задавая извне предмет желания.
