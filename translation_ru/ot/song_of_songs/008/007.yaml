  yaml_path: translation/ot/song_of_songs/008/007.yaml
  text: Many waters cannot quench love[a], nor can rivers sweep it away. If a man were to give all the wealth of his house for love, he would be utterly despised.
translation:
  language: ru
  text: 'Многие воды не могут погасить любовь,

    и реки не унесут её.


    Если бы человек отдал за любовь

    всё богатство своего дома,

    его бы непременно презрели[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «презирать презрят его»; инфинитив абсолютный в сочетании с личной формой глагола выражает сильное презрение.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם רַבִּים
  choice: Большие воды
  rationale: Сохраняет поэтический образ множества и мощи вод, не сужая его до конкретного наводнения.
- source_word: לֹא יוּכְלוּ לְכַבּוֹת
  choice: не могут погасить
  rationale: Глагол כבה обычно обозначает тушение огня; «погасить» сохраняет связь с образом пламени любви в 8:6.
- source_word: הָאַהֲבָה
  choice: любовь
  rationale: Прямое и естественное соответствие абстрактному существительному; определённость в русском не требует отдельного выражения.
- source_word: וּנְהָרוֹת
  choice: и реки
  rationale: Сохраняет простой образ параллельной строки и нарастание от больших вод к текущим рекам.
- source_word: לֹא יִשְׁטְפוּהָ
  choice: не смоют её
  rationale: שטף может означать затопить, унести или смыть потоком; «не смоют» естественно передаёт действие мощной воды, направленное против любви.
- source_word: אִם יִתֵּן אִישׁ
  choice: Если бы человек отдал
  rationale: Условная конструкция представляет воображаемый случай; «человек» здесь естественно передаёт обобщённое אִישׁ.
- source_word: כָּל הוֹן בֵּיתוֹ
  choice: всё богатство своего дома
  rationale: הוֹן означает богатство или достояние, а «дом» может охватывать всё имущество домохозяйства; формулировка сохраняет структуру еврейского текста.
- source_word: בָּאַהֲבָה
  choice: за любовь
  rationale: Предлог ב здесь имеет значение обмена или цены; «за любовь» кратко и ясно передаёт попытку приобрести её богатством.
- source_word: בּוֹז יָבֻזוּ לוֹ
  choice: его бы непременно презрели
  rationale: Неопределённо-личная конструкция передаёт еврейский глагол во множественном числе, а «непременно» выражает усиление посредством инфинитива абсолютного.
