  yaml_path: translation/ot/song_of_songs/008/009.yaml
  text: If she is a wall[a], we will build on her a battlement of silver; but if she is a door[b], we will enclose her with a board of cedar.
translation:
  language: ru
  text: Если она — стена, мы возведём на ней серебряную башню[a]; а если она — дверь, мы загородим её кедровой доской[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряное укрепление». Еврейское слово может обозначать башнеподобную или укреплённую часть сооружения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перегородим» или «закроем её кедровой доской». Еврейский глагол может выражать также охрану, окружение или осаду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: стена
  rationale: Прямое и естественное соответствие, сохраняющее архитектурный образ и не истолковывающее заранее его метафорический смысл.
- source_word: נִבְנֶה
  choice: мы возведём
  rationale: Форма 1-го лица множественного числа передаёт предполагаемое будущее действие; «возведём» естественно сочетается с башней.
- source_word: טִירַת כָּסֶף
  choice: серебряную башню
  rationale: Редкое слово טִירָה обозначает башнеподобное либо укреплённое сооружение; «башня» сохраняет архитектурный параллелизм со стеной, а определение «серебряная» передаёт конструкцию сопряжённого сочетания.
- source_word: דֶּלֶת
  choice: дверь
  rationale: Сохранён основной конкретный смысл слова без замены метафоры её возможным толкованием.
- source_word: נָצוּר
  choice: мы загородим
  rationale: Глагол может означать окружение, преграждение или охрану. В сочетании с одной кедровой доской «загородим» даёт ясный архитектурный образ, не устраняя лексической неоднозначности, отмеченной в сноске.
- source_word: לוּחַ אָרֶז
  choice: кедровой доской
  rationale: לוּחַ — доска или плита; форма единственного числа сохранена, а материал передан естественным русским прилагательным.
- source_word: עָלֶיהָ
  choice: на ней / её
  rationale: В первой строке предлог передан буквально как «на ней». Во второй его пространственный смысл выражен управлением русского глагола «загородим её», чтобы избежать неестественной конструкции.
- source_word: וְאִם
  choice: а если
  rationale: Союз «а» естественно обозначает контраст между двумя условными образами, не усиливая его сверх текста.
theological_decisions:
- issue: Метафорическое значение стены и двери
  choice: Оставить образы без поясняющего толкования в основном тексте
  alternative: Передать их как указание на целомудрие либо доступность девушки
  rationale: Стих прямо использует архитектурные метафоры, а их точное нравственное и сюжетное значение остаётся предметом интерпретации; перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным синтаксисом. Парные конструкции «если она — стена» и «если она — дверь» сохраняют поэтический параллелизм оригинала; конкретные архитектурные образы оставлены без конфессионального или аллегорического разъяснения.
