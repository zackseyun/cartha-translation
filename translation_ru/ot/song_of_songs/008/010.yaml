lexical_decisions:
- source_word: חוֹמָה
  choice: стена
  rationale: Прямо передаёт образ городской или защитной стены, не добавляя отсутствующей в тексте военной конкретики.
- source_word: שָׁדַי
  choice: груди мои
  rationale: Еврейское слово прямо обозначает груди женщины; такой перевод сохраняет телесную образность стихотворения.
- source_word: כַּמִּגְדָּלוֹת
  choice: как башни
  rationale: Сохраняет множественное число и архитектурное сравнение, связанное с образом стены.
- source_word: אָז
  choice: тогда
  rationale: Передаёт временной либо логико-результативный переход без излишнего уточнения.
- source_word: הָיִיתִי
  choice: я стала
  rationale: В данном контексте форма היה допускает как состояние, так и наступление состояния; «стала» естественно связывает самоописание девушки с последующей оценкой возлюбленного.
- source_word: בְּעֵינָיו
  choice: в его глазах
  rationale: Сохраняет еврейскую идиому со значением «по его оценке, в его восприятии» и естественно звучит по-русски.
- source_word: כְּמוֹצְאֵת
  choice: подобной той, что обрела
  rationale: Передаёт женский род причастия от מצא и допускаемое здесь значение нахождения или обретения.
- source_word: שָׁלוֹם
  choice: мир
  rationale: «Мир» — основное и узнаваемое соответствие, при этом более широкий смысл благополучия, целостности или расположения отмечен в сноске.
