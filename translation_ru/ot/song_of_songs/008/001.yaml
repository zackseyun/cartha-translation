base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/001.yaml
  text: Oh[a], that you were like a brother to me, who nursed at my mother’s breasts! If I found you outside, I would kiss you[c][b], and no one would despise me.
translation:
  language: ru
  text: О, если бы ты был мне как брат, который сосал грудь моей матери! Если бы я встретила тебя на улице, я поцеловала бы тебя, и никто не стал бы меня презирать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и они не презирали бы меня»; неопределённое множественное число обозначает общественное осуждение вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֶּנְךָ
  choice: О, если бы ты был
  rationale: Еврейская идиома выражает сильное желание, а не буквальный вопрос о том, кто «даст» возлюбленного.
- source_word: כְּאָח לִי
  choice: мне как брат
  rationale: Предлог כְּ обозначает сравнение; перевод сохраняет образ брата, не утверждая буквального родства.
- source_word: יוֹנֵק שְׁדֵי אִמִּי
  choice: вскормленный грудью моей матери
  rationale: Причастие יוֹנֵק обозначает того, кто сосал материнскую грудь. Эта естественная русская формулировка сохраняет конкретный образ общего материнского вскармливания.
- source_word: אֶמְצָאֲךָ בַחוּץ
  choice: Встретив тебя на улице
  rationale: В контексте желания форма допускает условно-гипотетическое понимание. «На улице» естественно передаёт публичное пространство, подразумеваемое противопоставлением домашней близости.
- source_word: אֶשָׁקְךָ
  choice: я поцеловала бы тебя
  rationale: Условное наклонение продолжает гипотетический смысл предыдущей части стиха.
- source_word: גַּם לֹא יָבֻזוּ לִי
  choice: и никто не стал бы меня презирать
  rationale: Неопределённое множественное число буквально означает «они не презирали бы меня»; по-русски общее общественное неодобрение естественно передаётся словом «никто».
theological_decisions:
- issue: Родственный образ в любовной поэзии
  choice: Сохранить сравнение возлюбленного с братом как выражение желания свободно проявлять привязанность публично
  alternative: Понять слова как утверждение буквального родства или устранить образ брата пересказом
  rationale: Текст говорит не о буквальном родстве, а использует сравнение כְּאָח. Общая мать сделала бы публичный поцелуй социально приемлемым; перевод сохраняет образ, не привнося дополнительных нравственных или вероучительных выводов.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной интонацией любовной поэзии. Междометие «О» и конструкция «если бы» передают эмоциональное желание; образ материнской груди сохранён без эвфемизма.
