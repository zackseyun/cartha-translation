  source_fidelity: 'Основной смысл передан верно: речь идёт о сделанном Соломоном роскошном переносном ложе/паланкине, с серебряными столбами, золотой опорной частью, пурпурным местом для сидения/езды и необычно описанным внутренним убранством. Однако «украшен» слишком обобщает רָצוּף, обозначающее выкладку, настил или облицовку. «Выложен» лучше сохраняет образ, не устраняя намеренную поэтическую необычность сочетания с «любовью».'
