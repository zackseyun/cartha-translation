base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/010.yaml
  text: He made its pillars of silver[a], its back of gold, its seat of purple[c][b]; its interior was inlaid with love by the daughters of Jerusalem.
translation:
  language: ru
  text: 'Столбы его сделал он из серебра,

    опору его — из золота,

    сиденье его — из пурпура;

    внутри он выложен любовью дочерей Иерусалима.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение необычно. Возможны переводы: «внутри он вымощен любовью дочерей Иерусалима» или «внутри он выложен любовью, устроенной дочерьми Иерусалима». Слово, переданное как «опора», редкое и может означать также основание, спинку или покрытие; «сиденье» может обозначать место для езды либо часть паланкина, предназначенную для ездока.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: столбы его
  rationale: Обычное значение существительного — «столбы, колонны»; здесь сохраняется архитектурный образ применительно к переносному царскому ложу.
- source_word: עָשָׂה
  choice: сделал он
  rationale: Прямой перевод общеупотребительного глагола; мужской субъект восстанавливается из ближайшего контекста и относится к Соломону.
- source_word: כֶסֶף
  choice: серебро
  rationale: Стандартное обозначение металла.
- source_word: רְפִידָתוֹ
  choice: опору его
  rationale: Редкое и не вполне ясное слово обозначает, вероятно, часть, служащую основанием или опорой. «Опора» естественна по-русски и не создаёт излишне конкретного образа спинки.
- source_word: זָהָב
  choice: золото
  rationale: Стандартное обозначение металла.
- source_word: מֶרְכָּבוֹ
  choice: сиденье его
  rationale: Хотя слово связано с ездой и колесницей, здесь, среди частей паланкина, оно вероятнее всего обозначает место, где сидят или едут.
- source_word: אַרְגָּמָן
  choice: пурпур
  rationale: Слово обозначает дорогой пурпурный материал или ткань; краткое «из пурпура» сохраняет вещественный смысл и поэтический параллелизм.
- source_word: תּוֹכוֹ
  choice: внутри
  rationale: Естественная русская передача внутренней части паланкина без тяжеловесного существительного.
- source_word: רָצוּף
  choice: украшен
  rationale: Причастие передаёт покрытие или выкладку поверхности. «Украшен» естественно в описании роскошного паланкина, а более буквальная необычная картина отмечена в сноске.
- source_word: אַהֲבָה
  choice: любовью
  rationale: Сохранено прямое значение масоретского текста, несмотря на необычность образа; предполагаемое значение «кожа» или исправление текста не вводится.
- source_word: מִבְּנוֹת יְרוּשָׁלָם
  choice: дочерей Иерусалима
  rationale: 'Предлог допускает значение источника или деятеля. Русский родительный после «любовью» намеренно сохраняет некоторую двусмысленность: это может быть любовь, исходящая от дочерей Иерусалима, либо украшение, выполненное ими.'
theological_decisions:
- issue: Необычный образ «любовью дочерей Иерусалима»
  choice: Сохранить слово «любовь» и не аллегоризировать его
  alternative: Заменить его предполагаемой «кожей» или истолковать как конкретный богословский символ
  rationale: Масоретский текст прямо говорит о любви; поэтическое напряжение следует сохранить, не внося конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Синтаксический параллелизм исходного стиха сохранён; редкие детали предмета переданы понятно, а подлинная лексическая и синтаксическая неопределённость вынесена в одну компактную сноску.
