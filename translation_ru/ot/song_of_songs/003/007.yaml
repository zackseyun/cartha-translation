    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указывает на представшее взору и привлекает к нему внимание; «вот» естественно и достойно передаёт дейктическую силу без архаизации.
- source_word: מִטָּתוֹ
  choice: ложе его / ложе Соломона
  rationale: מִטָּה может обозначать кровать или место для возлежания; «ложе» сохраняет широкое значение и не уточняет преждевременно, что речь именно о переносном паланкине.
- source_word: שֶׁלִּשְׁלֹמֹה
  choice: Соломона
  rationale: Конструкция выражает принадлежность; русский родительный падеж передаёт её естественно.
- source_word: שִׁשִּׁים
  choice: шестьдесят
  rationale: Прямое соответствие количественному числительному.
- source_word: גִּבֹּרִים
  choice: могучих воинов
  rationale: Слово обозначает сильных, доблестных людей, особенно бойцов. Сочетание передаёт и силу, и военный смысл; повтор сохранён в обеих частях стиха.
- source_word: סָבִיב לָהּ
  choice: вокруг него
  rationale: Выражает расположение со всех сторон. В русском местоимение согласовано с выбранным словом «ложе» среднего рода, а не с грамматическим родом еврейского существительного.
- source_word: מִגִּבֹּרֵי יִשְׂרָאֵל
  choice: из числа могучих воинов Израиля
  rationale: Предлог מִן указывает, что эти шестьдесят выбраны из более широкого круга израильских воинов; «из числа» ясно сохраняет эту партитивную семантику.
