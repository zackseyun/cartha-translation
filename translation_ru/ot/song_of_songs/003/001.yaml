lexical_decisions:
- source_word: עַל מִשְׁכָּבִי
  choice: На постели моей
  rationale: Сохраняет конкретный образ места, где лежат, и поэтический порядок слов; «постель» естественно звучит в современном литературном русском.
- source_word: בַּלֵּילוֹת
  choice: по ночам
  rationale: Передаёт форму множественного числа и возможный смысл повторявшегося ночного поиска, не создавая неестественного оборота «в ночи».
- source_word: בִּקַּשְׁתִּי
  choice: я искала
  rationale: Форма женского рода определяется голосом возлюбленной в контексте Песни песней. «Искала» точно и естественно передаёт בקשׁ.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: того, кого любит душа моя
  rationale: Сохраняет поэтическое упоминание נֶפֶשׁ и относительную конструкцию оригинала, не сводя выражение просто к «моему возлюбленному».
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: В этом любовно-поэтическом контексте «душа» передаёт внутреннее «я» и силу привязанности, сохраняя образность древнееврейского текста.
- source_word: בִּקַּשְׁתִּיו
  choice: искала его
  rationale: Сохраняет намеренное повторение глагола и явное местоименное дополнение, усиливающие ощущение настойчивого поиска.
- source_word: וְלֹא מְצָאתִיו
  choice: но не нашла
  rationale: «Но» естественно выражает противопоставленный результат; дополнение «его» уже непосредственно названо в предыдущей фразе и по-русски может быть опущено без утраты смысла.
