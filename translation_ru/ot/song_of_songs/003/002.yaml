base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/002.yaml
  text: I will rise now and go about the city[a], in the marketplaces and in the streets; I will seek the one my soul loves. I sought him, but I did not find him.
translation:
  language: ru
  text: Встану же, пойду по городу, по рынкам и улицам; поищу того, кого любит душа моя. Искала его, но не нашла.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָקוּמָה נָּא
  choice: Встану же
  rationale: Когортатив выражает решимость говорящей, а נָא придаёт побуждению оттенок настойчивости и непосредственности. «Встану же» естественно передаёт внутреннее решение без превращения частицы в вежливую просьбу.
- source_word: וַאֲסוֹבְבָה בָעִיר
  choice: и обойду город
  rationale: Когортатив от סבב описывает движение по городу в поисках. «Обойду город» ясно передаёт намерение пройти по его общественным местам.
- source_word: בַּשְּׁוָקִים וּבָרְחֹבוֹת
  choice: по площадям и улицам
  rationale: שׁוּק обозначает городское открытое пространство, улицу или площадь, нередко торговую; רְחֹבוֹת — широкие улицы или открытые общественные места. В данном поэтическом сочетании «по площадям и улицам» сохраняет образ поисков в публичных пространствах и звучит естественно по-русски.
- source_word: אֲבַקְשָׁה
  choice: поищу
  rationale: Когортатив от בקשׁ продолжает выражение решимости. Совершенный вид «поищу» естественно передаёт намеченное действие и согласуется с русской прямой речью.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: того, кого любит душа моя
  rationale: Формулировка сохраняет буквальный образ נֶפֶשׁ («душа») и характерный для книги повтор, не сводя выражение только к «любимому» или «тому, кого я люблю».
- source_word: בִּקַּשְׁתִּיו וְלֹא מְצָאתִיו
  choice: Искала я его, но не нашла
  rationale: Прошедшее время передаёт завершённое повествовательное резюме. Повтор корня בקשׁ отражён однокоренным русским глаголом по смыслу, а «но» естественно выражает контраст результата.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно поэтическим строем. Инверсия «любит душа моя» и «Искала я» сохраняет возвышенный лирический ритм, оставаясь понятной современному читателю. Прямая речь оформлена кавычками по смыслу внутренней решимости говорящей; род говорящей явно передан формой «искала».
