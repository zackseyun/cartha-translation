base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/003.yaml
  text: 'The watchmen who go about the city found me: “Have you seen the one whom my soul loves?”[a][b]'
translation:
  language: ru
  text: Меня встретили стражи, обходящие город. «Не видели ли вы того, кого любит моя душа?»[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Меня нашли стражи, обходящие город».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «того, кого любит моя душа»; это поэтическое выражение неоднократно повторяется в Песни песней.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאוּנִי
  choice: меня встретили
  rationale: Форма Qal 3-го лица множественного числа с суффиксом 1-го лица буквально означает «нашли меня», но в данном контексте естественное русское «меня встретили» передаёт, что стражи повстречались героине во время её поисков, не предполагая, что они разыскивали её.
- source_word: הַשֹּׁמְרִים
  choice: стражи
  rationale: Субстантивированное причастие от שמר обозначает людей, несущих охрану; «стражи» соответствует ночной городской обстановке и сохраняет поэтический регистр.
- source_word: הַסֹּבְבִים בָּעִיר
  choice: обходящие город
  rationale: Причастие от סבב передаёт продолжающееся движение вокруг или по городу. «Обходящие город» близко к форме оригинала и не вносит современного оттенка полицейского патрулирования.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: того, кого любит моя душа
  rationale: Сохранён повторяющийся в Песни поэтический оборот с נֶפֶשׁ; местоимение «того» естественно указывает на возлюбленного, не заменяя образ души словом «сердце».
- source_word: רְאִיתֶם
  choice: не видели ли вы
  rationale: Перфект 2-го лица мужского рода множественного числа в вопросе естественно передаётся русской формулой недавнего поиска «не видели ли вы»; частица «ли» ясно обозначает вопрос.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Порядок слов сделан естественным для русского языка, а прямая речь оформлена как непосредственный вопрос стражам. Буквальный образ «моя душа любит» сохранён в основном тексте.
