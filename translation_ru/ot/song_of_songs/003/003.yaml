  source_fidelity: '«Меня встретили» является контекстуально оправданной передачей מְצָאוּנִי («нашли меня»): речь идёт о встрече женщины со стражами во время ночных поисков, без утверждения, что они её разыскивали. «Стражи, обходящие город» точно передаёт הַשֹּׁמְרִים הַסֹּבְבִים בָּעִיר. Вопросительная формула «Не видели ли вы…?» естественно выражает רְאִיתֶם в данном контексте.'
