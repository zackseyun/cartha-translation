  text: צְאֶ֧ינָה וּֽ/רְאֶ֛ינָה בְּנ֥וֹת צִיּ֖וֹן בַּ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה בָּ/עֲטָרָ֗ה שֶׁ/עִטְּרָה לּ֤/וֹ אִמּ/וֹ֙ בְּ/י֣וֹם חֲתֻנָּת֔/וֹ וּ/בְ/י֖וֹם שִׂמְחַ֥ת לִבּֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/011.yaml
  text: Go out and look[a], O daughters of Zion, at King Solomon, with the crown with which his mother crowned him on the day of his wedding, on the day of the joy of his heart.
translation:
  language: ru
  text: Выйдите и посмотрите, дочери Сиона, на царя Соломона в венце[a], которым увенчала его мать в день его свадьбы, в день радости его сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в короне»; еврейское עֲטָרָה может означать царскую корону, праздничный венец или венок, что особенно уместно в свадебном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאֶינָה וּרְאֶינָה
  choice: Выйдите и посмотрите
  rationale: Два повелительных глагола женского рода множественного числа передают призыв дочерям Сиона выйти и увидеть происходящее; формулировка естественна для современного русского языка.
- source_word: בְּנוֹת צִיּוֹן
  choice: дочери Сиона
  rationale: Сохранено традиционное поэтическое обращение к женщинам Иерусалима; звательная функция ясна благодаря строению фразы и запятым.
- source_word: בַּמֶּלֶךְ שְׁלֹמֹה
  choice: на царя Соломона
  rationale: После глагола зрения предлог ב обозначает объект, на который предлагается посмотреть.
- source_word: בָּעֲטָרָה
  choice: в венце
  rationale: 'Предлог ב передаёт обстоятельство внешнего облика: Соломон предстаёт в надетом на него венце.'
- source_word: עֲטָרָה
  choice: венец
  rationale: Слово может обозначать корону, венец или праздничный венок. «Венец» сохраняет широкий смысл и уместен одновременно в царском и свадебном контексте.
- source_word: שֶׁעִטְּרָה לּוֹ אִמּוֹ
  choice: которым увенчала его мать
  rationale: Однокоренные «венец» и «увенчала» воспроизводят связь существительного עֲטָרָה с глаголом עטר и не уточняют способ возложения.
- source_word: בְּיוֹם חֲתֻנָּתוֹ
  choice: в день его свадьбы
  rationale: Передаёт брачный и праздничный смысл חֲתֻנָּה близко к еврейской конструкции.
- source_word: וּבְיוֹם שִׂמְחַת לִבּוֹ
  choice: в день радости его сердца
  rationale: Сохранены параллелизм двух временных оборотов и поэтическая генитивная конструкция оригинала.
