base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/004.yaml
  text: I had scarcely passed by them when I found the one my soul loves[a]. I held on to him and would not let him go until I had brought him into my mother's house[b], into the chamber of the one who conceived me.
translation:
  language: ru
  text: Едва я миновала их, как нашла того, кого любит моя душа[a]. Я ухватилась за него и не отпускала, пока не привела его в дом моей матери, в комнату той, что зачала меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «того, кого любит душа моя».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «та, что зачала меня» — поэтическое обозначение матери и параллель к словам «дом моей матери».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט שֶׁעָבַרְתִּי מֵהֶם
  choice: Едва я отошла от них
  rationale: Конструкция передаёт, что встреча произошла почти сразу после того, как героиня миновала стражей. «Едва… как» естественно выражает эту временную близость по-русски, а «отошла от них» сохраняет движение прочь от упомянутых людей.
- source_word: עַד שֶׁמָּצָאתִי
  choice: как нашла
  rationale: Формальное значение עַד שֶׁ — «пока не», однако после русского «едва» конструкция «как нашла» точнее и естественнее передаёт почти немедленное наступление следующего события.
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: того, кого любит моя душа
  rationale: Сохранено слово נֶפֶשׁ («душа», внутреннее существо, сама личность) и повторяющаяся поэтическая формула Песни песней; выражение звучит возвышенно, но остаётся понятным современному читателю.
- source_word: אֲחַזְתִּיו
  choice: Я держала его
  rationale: Глагол אחז обозначает схватить или крепко держать. В данном контексте «держала» передаёт настойчивость без неуместного оттенка насилия.
- source_word: וְלֹא אַרְפֶּנּוּ
  choice: и не отпускала
  rationale: Порода hифиль глагола רפה здесь означает позволить уйти, отпустить; выбран прямой и естественный русский эквивалент.
- source_word: עַד שֶׁהֲבֵיאתִיו
  choice: пока не привела его
  rationale: 'Сохранено значение предела действия: она не отпускала возлюбленного до тех пор, пока не привела его к названному месту.'
- source_word: אֶל בֵּית אִמִּי
  choice: в дом моей матери
  rationale: Предлог «в» естественно передаёт движение внутрь дома, подразумеваемое продолжением фразы.
- source_word: וְאֶל חֶדֶר הוֹרָתִי
  choice: в комнату той, что зачала меня
  rationale: חֶדֶר — внутренняя комната, а הוֹרָתִי буквально указывает на женщину, зачавшую героиню. Перевод сохраняет поэтический параллелизм, не сводя вторую строку к простому повторению слова «мать».
