  yaml_path: translation/ot/song_of_songs/003/008.yaml
  text: All of them are holding swords[a], trained in warfare; each man has his sword at his thigh because of terror in the nights.
translation:
  language: ru
  text: Все они держат мечи, обучены военному делу; у каждого меч на бедре — из-за страха по ночам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за страха в ночах». Множественное число слова «ночи» может поэтически усиливать образ опасности, грозящей в ночное время.'
    reason: Сохраняет необычное множественное число בַּלֵּילוֹת и поясняет естественную русскую передачу «по ночам».
lexical_decisions:
- source_word: כֻּלָּם
  choice: Все они
  rationale: Передаёт собирательное значение и местоименный суффикс, подчёркивая полноту группы.
- source_word: אֲחֻזֵי חֶרֶב
  choice: вооружены мечами
  rationale: Причастная конструкция описывает воинов, держащих или носящих мечи; выбранный оборот естественен по-русски и сохраняет военный образ.
- source_word: מְלֻמְּדֵי מִלְחָמָה
  choice: обучены воевать
  rationale: Сохраняет значение людей, наученных и подготовленных к войне, в ясной современной формулировке.
- source_word: אִישׁ
  choice: у каждого
  rationale: Передаёт распределительное значение единственного числа после описания всей группы; мужской состав стражи ясен из контекста.
- source_word: חַרְבּוֹ עַל יְרֵכוֹ
  choice: у каждого меч на бедре
  rationale: Близко передаёт буквальный образ меча у верхней части ноги, то есть закреплённого и готового к применению.
- source_word: מִפַּחַד
  choice: из-за страхов
  rationale: 'Предлог מן понят как причинный: оружие носится ввиду опасностей, вызывающих страх; множественное число в русском согласовано с ночными угрозами.'
- source_word: בַּלֵּילוֹת
  choice: ночных
  rationale: Еврейское множественное число передано естественным русским сочетанием «ночных страхов», допускающим как повторяющиеся ночи, так и ночную опасность вообще.
