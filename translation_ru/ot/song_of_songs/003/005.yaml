base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/005.yaml
  text: I adjure you[a], daughters of Jerusalem, by the gazelles or by the does of the field[b], that you not stir up or awaken love until it desires.
translation:
  language: ru
  text: 'Заклинаю вас[a], дочери Иерусалима, газелями или полевыми ланями[b]: не будите и не пробуждайте любовь, пока она не пожелает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Обязываю вас клятвой».'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст буквально называет газелей и полевых ланей; еврейское слово, переведённое здесь как «газели», может также поэтически перекликаться со словом «воинства» в формуле заклятия.
    reason: cultural_note
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: Заклинаю вас
  rationale: Форма каузативной породы от שׁבע означает обязать клятвой или торжественно заклясть. «Заклинаю» естественно и достойно передаёт клятвенную силу выражения.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: дочери Иерусалима
  rationale: Буквальная поэтическая форма обращения сохраняет образность и корпоративный оттенок еврейского выражения.
- source_word: בִּצְבָאוֹת אֹו בְּאַיְלוֹת הַשָּׂדֶה
  choice: газелями и полевыми ланями
  rationale: Оба существительных в контексте обозначают животных. В формуле заклятия русский соединительный союз звучит естественно и отражает совокупную поэтическую пару, хотя еврейский текст формально использует «или».
- source_word: אִם ... וְאִם
  choice: не будите и не пробуждайте
  rationale: В формуле клятвы частицы вводят строгое запрещение; по-русски оно естественно передаётся отрицательным повелительным оборотом.
- source_word: תָּעִירוּ וְתְּעוֹרְרוּ
  choice: не будите и не пробуждайте
  rationale: Два близких по значению глагола воспроизведены парой русских синонимов, чтобы сохранить усилительный параллелизм.
- source_word: הָאַהֲבָה
  choice: любовь
  rationale: Обычное значение существительного; оно сохраняет открытым вопрос, имеется ли в виду чувство, любовное желание или поэтически олицетворённая любовь.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: пока она сама не пожелает
  rationale: Глагол женского рода согласуется с существительным «любовь», которое и в русском языке женского рода. «Сама» ясно сохраняет любовь субъектом желания, не отождествляя её с конкретным человеком.
theological_decisions:
- issue: Кто является субъектом в заключительной части стиха
  choice: 'Любовь остаётся субъектом: «пока она сама не пожелает».'
  alternative: «пока не пожелает она» или «пока не пожелает он» — с отнесением к конкретной женщине либо мужчине.
  rationale: Еврейский глагол женского рода естественно согласуется с существительным «любовь». Текст не требует видеть здесь конкретного человека, поэтому перевод сохраняет олицетворение и смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Сохранены традиционное обращение «дочери Иерусалима», клятвенная торжественность и намеренная неоднозначность олицетворённой любви.
