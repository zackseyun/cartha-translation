  source_fidelity: 'Черновик верно передаёт женский референт, движение «вверх/из пустыни», дымовые столбы и перечень ароматических веществ. Однако оборот «окутанная ароматом мирры и ладана, всех благовонных порошков торговца» синтаксически неудачен: родительный падеж последнего члена не может естественно зависеть от «ароматом» и ослабляет его связь с пассивным причастием מְקֻטֶּרֶת. Инструментальный ряд прямо передаёт окурение/ароматизацию всеми названными веществами.'
