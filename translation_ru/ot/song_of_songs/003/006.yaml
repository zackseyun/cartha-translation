lexical_decisions:
- source_word: מִי זֹאת
  choice: Кто это
  rationale: Сохраняет буквальную форму вопроса с указательным местоимением женского рода; женский референт далее выражен причастием «окутанная».
- source_word: עֹלָה
  choice: поднимается
  rationale: Передаёт обычное значение עלה и образ движения вверх или приближения из пустыни.
- source_word: מִן הַמִּדְבָּר
  choice: из пустыни
  rationale: Естественное русское соответствие מִדְבָּר; слово может обозначать пустынную, малонаселённую местность, не обязательно песчаную.
- source_word: כְּתִימֲרוֹת עָשָׁן
  choice: словно столбы дыма
  rationale: Передаёт вертикально поднимающиеся клубы или столбы дыма и сохраняет поэтическую образность.
- source_word: מְקֻטֶּרֶת
  choice: окутанная ароматом
  rationale: Пассивное причастие связано с окуриванием благовониями; эта формулировка естественно передаёт как действие ароматического дыма, так и его результат.
- source_word: מוֹר וּלְבוֹנָה
  choice: мирры и ладана
  rationale: Устоявшиеся русские названия этих ароматических смол.
- source_word: מִכֹּל אַבְקַת רוֹכֵל
  choice: всех благовонных порошков торговца
  rationale: Сохраняет значение порошка или пыли и торговца; благовонный характер следует из контекста. Предлог מִן после пассивного причастия естественно передаётся зависимым родительным оборотом при слове «ароматом».
