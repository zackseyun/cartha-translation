source:
  edition: WLC
  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/007.yaml
  text: 'I adjure you[a], daughters of Jerusalem[c][b], by the gazelles or by the does of the field: do not stir up or awaken love until it pleases.'
translation:
  language: ru
  text: 'Заклинаю вас[a], дочери Иерусалима, газелями или полевыми ланями[b]: не будите и не пробуждайте любовь, пока она не пожелает[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «обязываю вас клятвой».'
    reason: lexical_alternative
  - marker: b
    text: Это поэтическая формула клятвы. Некоторые усматривают в ней созвучие с именованиями Бога, однако прямой смысл связан с образами животных.
    reason: cultural_note
  - marker: c
    text: 'Или: «пока любовь не будет готова». Еврейский глагол стоит в женском роде и может относиться к «любви».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: Заклинаю вас
  rationale: Каузативная форма глагола שׁבע в этой формуле означает «обязывать клятвой, торжественно заклинать». «Заклинаю» сохраняет клятвенную и поэтическую силу выражения.
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: дочери Иерусалима
  rationale: Прямой и литературно естественный перевод традиционного древнееврейского обращения, сохраняющий его собирательно-поэтический характер.
- source_word: בִּצְבָאוֹת
  choice: газелями
  rationale: В параллели с «полевыми ланями» слово обозначает газелей, а не воинства. Творительный падеж естественно передаёт клятву «газелями».
- source_word: אוֹ
  choice: и
  rationale: Хотя אוֹ обычно означает «или», в поэтической клятвенной формуле два однородных образа могут естественно соединяться по-русски союзом «и». Буквальный вариант отмечен в сноске.
- source_word: בְּאַיְלוֹת הַשָּׂדֶה
  choice: полевыми ланями
  rationale: «Лани» — литературное и понятное обозначение самок оленя; «полевыми» кратко и естественно сохраняет определение הַשָּׂדֶה.
- source_word: אִם תָּעִירוּ וְאִם תְּעוֹרְר֛וּ
  choice: не будите и не пробуждайте
  rationale: После формулы заклинания אִם выражает запрет. Два близких глагола сохранены, чтобы передать поэтическое усиление оригинала.
- source_word: הָאַהֲבָה
  choice: любовь
  rationale: Определённый артикль не требует отдельной передачи по-русски; абстрактное существительное естественно звучит без указательного уточнения.
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: пока она сама не пожелает
  rationale: Глагол стоит в женском роде и естественно соотносится с существительным «любовь», также женского рода в русском. «Сама» подчёркивает заложенную в тексте мысль о собственной воле любви, не превращая её в указание на конкретное время.
theological_decisions:
- issue: Референт и олицетворение любви в заключительной фразе
  choice: 'Женская форма отнесена к «любви»: «пока она сама не пожелает».'
  alternative: «Пока не придёт её время» или «пока она не будет готова».
  rationale: Грамматика оригинала допускает прямое соотнесение глагола женского рода с אַהֲבָה. Русский также позволяет естественно сохранить женский род и мягкое олицетворение, не уточняя сверх текста, чего именно любовь должна пожелать.
- issue: Образ клятвы газелями и ланями
  choice: Сохранить прямой образ животных.
  alternative: Передать предполагаемую игру слов с божественными именованиями.
  rationale: Непосредственный параллелизм ясно указывает на животных. Возможный звуковой намёк остаётся гипотетическим и не должен вытеснять буквальный поэтический смысл.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Сохранены обращение «дочери Иерусалима», парные глаголы и олицетворение любви; архаичные или малопонятные синтаксические обороты избегаются.
