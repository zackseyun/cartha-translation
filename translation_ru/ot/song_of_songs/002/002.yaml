  text: 'Как лилия среди колючих кустов,

    так и моя любимая среди девушек.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди дочерей»; здесь это выражение означает девушек или молодых женщин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/שׁוֹשַׁנָּה
  choice: Как лилия
  rationale: Точное ботаническое значение שׁוֹשַׁנָּה не вполне определённо; традиционное «лилия» сохраняет узнаваемый поэтический образ, не вводя излишней конкретизации. Предлог כְּ передан сравнительным «как».
- source_word: בֵּין
  choice: среди
  rationale: При множественном дополнении «среди» естественно передаёт положение внутри группы и поэтическое сопоставление.
- source_word: הַ/חוֹחִים
  choice: колючек
  rationale: חוֹחִים обозначает колючие растения. «Колючки» звучит естественно и сохраняет контраст с нежной лилией; возможны также «тернии» или «колючие кусты».
- source_word: כֵּן
  choice: так и
  rationale: «Так и» ясно связывает вторую строку с первой и естественно завершает сравнительную конструкцию по-русски.
- source_word: רַעְיָתִי
  choice: моя любимая
  rationale: Форма обозначает близкую женщину — возлюбленную или подругу говорящего. «Моя любимая» естественно выражает нежность и соответствует женскому роду, не делая образ официальным.
- source_word: הַ/בָּנוֹת
  choice: девушек
  rationale: Буквально בָּנוֹת означает «дочери», но здесь это поэтическое обозначение женщин или девушек как группы. «Девушки» ясно и естественно передаёт смысл в современном русском языке.
