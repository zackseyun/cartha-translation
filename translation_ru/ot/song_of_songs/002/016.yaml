lexical_decisions:
- source_word: דּוֹדִי
  choice: мой возлюбленный
  rationale: В Песни песней דּוֹד обозначает любимого мужчину в близких романтических отношениях. «Возлюбленный» естественно для русской поэзии, передаёт нежность и не сводит смысл только к сексуальной связи.
- source_word: לִי
  choice: мой
  rationale: Предлог с местоименным суффиксом выражает принадлежность и взаимную связь. Краткое «мой» сохраняет лаконизм еврейской фразы и не усиливает оттенок собственности, как могло бы «принадлежит мне».
- source_word: וַאֲנִי לוֹ
  choice: а я — его
  rationale: Формулировка сохраняет параллелизм и взаимность двух частей высказывания. Союз «а» по-русски естественно подчёркивает соотнесённость, не вводя противопоставления по существу.
- source_word: הָרֹעֶה
  choice: он пасёт
  rationale: Причастие от רעה может обозначать пастьбу, кормление или выпас. «Он пасёт» даёт естественную русскую фразу, сохраняет пастушеский образ и не добавляет отсутствующий в еврейском тексте объект.
- source_word: בַּשּׁוֹשַׁנִּים
  choice: среди лилий
  rationale: Традиционное «лилии» узнаваемо и уместно в поэтическом контексте, хотя точный вид цветка неизвестен. «Среди» естественно передаёт местное значение предлога בְּ во множественном окружении цветов.
