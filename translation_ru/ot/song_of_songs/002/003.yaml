base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/003.yaml
  text: Like an apple tree among the trees of the forest[a], so is my beloved among the sons. In his shade I delighted to sit[b], and his fruit was sweet to my taste.
translation:
  language: ru
  text: 'Как яблоня[a] среди лесных деревьев,

    так мой возлюбленный среди юношей.

    В его тени я пожелала сесть и села,

    и плод его сладок для моего нёба.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово תַּפּוּחַ традиционно переводится как «яблоня», однако точный вид дерева неизвестен; среди предлагаемых вариантов — абрикос и цитрон.
    reason: cultural_note
lexical_decisions:
- source_word: תַּפּוּחַ
  choice: яблоня
  rationale: Традиционный и узнаваемый перевод; точный вид дерева не установлен, поэтому ботаническая неопределённость отмечена в сноске.
- source_word: בַּעֲצֵי הַיַּעַר
  choice: среди лесных деревьев
  rationale: Сохраняет образ одного плодового дерева, выделяющегося среди деревьев леса.
- source_word: דּוֹדִי
  choice: мой возлюбленный
  rationale: В Песни песней слово обозначает любимого мужчину; этот вариант точен, естественен и соответствует возвышенному регистру поэзии.
- source_word: בֵּין הַבָּנִים
  choice: среди юношей
  rationale: Буквально «среди сыновей», но в контексте речь идёт о возлюбленном среди других молодых мужчин; буквальное «сыновей» по-русски создало бы неуместный оттенок родства.
- source_word: בְּצִלּוֹ
  choice: в его тени
  rationale: Мужской суффикс продолжает метафорическое отождествление возлюбленного с деревом.
- source_word: חִמַּדְתִּי וְיָשַׁבְתִּי
  choice: я пожелала укрыться и села
  rationale: Передаёт желание оказаться в тени и последующее действие, не сводя חמד только к эмоциональному удовольствию; «укрыться» естественно в сочетании с тенью.
- source_word: וּפִרְיוֹ
  choice: и плод его
  rationale: Сохраняет продолжение личной метафоры и поэтический порядок слов.
- source_word: מָתוֹק
  choice: сладок
  rationale: Именное сказуемое естественно передаёт качество плода; настоящее время в русском сохраняет допустимую временную открытость еврейской формы.
- source_word: לְחִכִּי
  choice: моему нёбу
  rationale: Буквально передаёт телесный и чувственный образ חֵךְ, оставаясь понятным в литературном русском.
theological_decisions:
- issue: Аллегорическое или буквальное прочтение образа возлюбленного и его плода
  choice: Сохранена любовная метафора без её богословского истолкования.
  alternative: Явно отнести образ ко Христу, Израилю или Церкви.
  rationale: Сам стих представляет речь женщины о возлюбленном; конфессиональное аллегорическое толкование не должно вноситься непосредственно в перевод.
translation_notes:
  register: Современный литературный русский с достоинством и ясной поэтической образностью. Строки оформлены как стих; женский род глаголов следует голосу девушки в контексте песни. Единственный маркер [a] помещён после строки, к которой относится ботаническая оговорка.
