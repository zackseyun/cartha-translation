  to: 'Как яблоня[a] среди лесных деревьев,

    так мой возлюбленный среди юношей.

    В его тени я пожелала сесть и села,

    и плод его сладок для моего нёба.'
  rationale: Убрано «укрыться», поскольку оно привносит мотив, которого нет в исходном еврейском тексте. «Пожелала сесть и села» сохраняет желание и последующее действие, выраженные двумя глаголами. Маркер ботанической сноски перенесён к «яблоне», к которой он относится; «для моего нёба» делает буквальный чувственный образ немного естественнее по-русски.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:28:57Z'
