  source_fidelity: 'В целом образность и основные соответствия переданы точно: תַּפּוּחַ — «яблоня» с необходимой оговоркой, דּוֹדִי — «мой возлюбленный», בֵּין הַבָּנִים — «среди юношей», а личные местоименные суффиксы в образе дерева сохранены. Однако «пожелала укрыться» добавляет отсутствующий в оригинале мотив защиты/убежища. В еврейском тексте выражены желание (или удовольствие) и сидение в тени, без глагола «укрыться».'
