base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/009.yaml
  text: My beloved is like a gazelle or a young stag[a]. Look—there he stands behind our wall, gazing through the windows[b], peering through the lattice.
translation:
  language: ru
  text: Мой любимый — как газель или молодой олень[a]. Вот он стоит за нашей стеной, смотрит сквозь окна, заглядывает через решётчатые проёмы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «оленёнок». Еврейское выражение обозначает молодое животное из семейства оленевых; вариант «молодой олень» сохраняет мужской образ возлюбленного.'
    reason: lexical_alternative
  - marker: b
    text: Имеются в виду узкие отверстия или проёмы с решётчатым либо плетёным заполнением, а не обязательно отдельная оконная решётка современного типа.
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹמֶה דוֹדִי
  choice: Мой любимый — как
  rationale: Причастие выражает сравнение, а «мой любимый» естественно и поэтично передаёт обращение женщины к возлюбленному без излишне современного или откровенно сексуального оттенка.
- source_word: לִצְבִי
  choice: газель
  rationale: «Газель» — ясное современное соответствие названию стройного и быстрого животного в поэтическом сравнении.
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: молодой олень
  rationale: Сочетание обозначает молодое животное из семейства оленевых; мужской образ соответствует изображению возлюбленного.
- source_word: הִנֵּה זֶה
  choice: Вот он
  rationale: Передаёт живое указание и внезапное привлечение внимания, характерные для еврейского выражения.
- source_word: עוֹמֵד אַחַר כָּתְלֵנוּ
  choice: стоит за нашей стеной
  rationale: Сохраняет настоящее, зримо разворачивающееся действие и единственное число слова «стена».
- source_word: מַשְׁגִּיחַ מִן הַחֲלֹּנוֹת
  choice: смотрит сквозь окна
  rationale: В контексте речь идёт о взгляде внутрь через оконные отверстия; «смотрит» звучит естественно и не придаёт действию настораживающего оттенка.
- source_word: מֵצִיץ מִן הַחֲרַכִּים
  choice: заглядывает через решётчатые проёмы
  rationale: Глагол передаёт взгляд через узкое отверстие, а существительное во множественном числе может обозначать отверстия или элементы решётчатой конструкции.
