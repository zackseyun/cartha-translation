base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/017.yaml
  text: Until the day breathes and the shadows flee[a], turn[b], my beloved—be like a gazelle or a young stag on the mountains of Bether.
translation:
  language: ru
  text: Пока не задышит день и не убегут тени[a], повернись, мой возлюбленный, и будь подобен газели или молодому оленю на горах Бетера[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пока день не станет прохладным и тени не убегут». Буквально еврейский текст говорит, что день «дышит» или «веет»; этот поэтический образ может относиться к вечернему ветерку или к свежести рассвета.'
    reason: lexical_alternative
  - marker: b
    text: '«Бетер» может быть названием местности. Возможны также переводы: «на горах разделения» или, с меньшей вероятностью, «на рассечённых (изрезанных) горах».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: Пока день не повеет
  rationale: Глагол פוח означает «дуть, веять, дышать». Поэтическое «день повеет» сохраняет олицетворение и не устраняет неоднозначность между вечерней прохладой и наступлением рассвета.
- source_word: וְנָסוּ הַצְּלָלִים
  choice: и тени не убегут
  rationale: נוּס обычно означает «бежать, спасаться бегством». «Тени убегут» естественно передаёт яркую поэтическую персонификацию, не сглаживая её до «исчезнут».
- source_word: סֹב
  choice: повернись
  rationale: Императив от סבב прежде всего выражает поворот. Вариант «вернись» возможен по контексту, но добавляет идею возвращения, которой сам глагол здесь однозначно не требует.
- source_word: דְּמֵה לְךָ
  choice: будь подобен
  rationale: Форма выражает уподобление; литературное «будь подобен» естественно вводит последующее сравнение.
- source_word: דוֹדִי
  choice: мой возлюбленный
  rationale: В Песни песней слово обозначает любимого мужчину и несёт интимно-любовный оттенок; «мой возлюбленный» точно и достойно передаёт его в современном литературном русском.
- source_word: לִצְבִי
  choice: газели
  rationale: Предлог ל после דמה обозначает объект сравнения. «Газель» — точное и привычное русское название צְבִי.
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: или молодому оленю
  rationale: עֹפֶר — детёныш, а сочетание с אַיָּלִים указывает на молодого оленя. Формулировка сохраняет образ и звучит естественнее буквального «оленёнок оленей».
- source_word: עַל הָרֵי בָתֶר
  choice: на горах Бетера
  rationale: בתר может быть географическим названием либо нарицательным словом, связанным с разделением или рассечением. Основной текст сохраняет возможный топоним, а смысловые варианты отмечены в сноске.
