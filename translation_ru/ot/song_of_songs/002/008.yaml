lexical_decisions:
- source_word: ק֣וֹל
  choice: Слышен голос
  rationale: קוֹל может обозначать как голос, так и вообще звук. Русское «слышен голос» естественно передаёт внезапное узнавание приближающегося любимого; возможность более общего значения отмечена в сноске.
- source_word: דּוֹדִי
  choice: моего любимого
  rationale: В Песни песней דּוֹדִי — обращённое к мужчине обозначение возлюбленного. «Мой любимый» звучит естественно, поэтично и не добавляет оттенков, отсутствующих в оригинале.
- source_word: הִנֵּה זֶה
  choice: Вот он
  rationale: Сочетание дейктически и живо указывает на появившегося любимого. «Вот он» кратко и естественно передаёт этот эффект в современном русском.
- source_word: בָּא
  choice: идёт
  rationale: Форма описывает живо представленное приближение. В данном контексте русское «идёт» естественнее буквального «приходит» и сохраняет настоящее время сцены.
- source_word: מְדַלֵּג
  choice: скачет
  rationale: Причастие обозначает энергичное движение скачками. «Скачет» передаёт лёгкость и живость образа.
- source_word: עַל הֶהָרִים
  choice: по горам
  rationale: При глаголе движения עַל здесь изображает движение по горной местности или через неё. Русское «по горам» естественно и не навязывает сомнительного образа перескакивания через целые горы.
- source_word: מְקַפֵּץ
  choice: прыгает
  rationale: Близкий по смыслу параллельный глагол усиливает картину пружинистого, стремительного движения; «прыгает» сохраняет лексическое варьирование.
- source_word: עַל הַגְּבָעוֹת
  choice: по холмам
  rationale: Параллельно предыдущей строке передаёт движение по холмистой местности и сохраняет различие между горами и холмами.
