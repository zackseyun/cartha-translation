  text: The sound of my beloved! Look[a], here he comes, leaping over the mountains, bounding over the hills.
translation:
  language: ru
  text: Слышен голос[a] моего любимого! Вот он идёт — скачет по горам, прыгает по холмам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слышен звук моего любимого!» Еврейское слово קוֹל может означать и «голос», и «звук».'
