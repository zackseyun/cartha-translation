  text: He brought me into the house of wine[a], and his banner over me was love.
translation:
  language: ru
  text: Он привёл меня в дом вина[a], и его знамя надо мной — любовь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пиршественный зал». Еврейское выражение буквально означает «дом вина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱבִיאַנִי
  choice: Он привёл меня
  rationale: 'Порода hифиль перфекта 3 м. ед. ч. с суффиксом объекта 1 ед. ч. от בוא выражает каузативное движение: «привести, ввести». «Привёл меня» естественно звучит по-русски и не конкретизирует аспект сверх необходимого.'
- source_word: אֶל
  choice: в
  rationale: При глаголе движения и обозначении места אֶל указывает на направление с достижением цели; русское «в» естественно передаёт вход внутрь.
- source_word: בֵּית הַיָּיִן
  choice: дом вина
  rationale: Конструктивное сочетание буквально означает «дом вина». Такой перевод сохраняет конкретный поэтический образ; возможное значение пиршественного помещения вынесено в сноску.
- source_word: וְדִגְלוֹ
  choice: и его знамя
  rationale: דֶּגֶל обозначает знамя или стяг. «Знамя» сохраняет образ видимого знака и подходит возвышенному поэтическому регистру.
- source_word: עָלַי
  choice: надо мной
  rationale: Предлог עַל в сочетании с образом знамени естественно передаётся пространственным «надо мной».
- source_word: אַהֲבָה
  choice: любовь
  rationale: 'Существительное употреблено без артикля и завершает именную конструкцию: «его знамя надо мной — любовь». Добавление «его любовь» было бы допустимым истолкованием, но вводило бы отсутствующее в еврейском тексте притяжательное определение.'
