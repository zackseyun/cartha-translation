  text: סַמְּכ֨וּ/נִי֙ בָּֽ/אֲשִׁישׁ֔וֹת רַפְּד֖וּ/נִי בַּ/תַּפּוּחִ֑ים כִּי חוֹלַ֥ת אַהֲבָ֖ה אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/005.yaml
  text: Sustain me with raisin cakes[a]; refresh me with apples[c][b], for I am sick with love.
translation:
  language: ru
  text: Поддержите меня лепёшками из изюма[a], освежите меня яблоками[b], ведь я больна любовью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лепёшками из прессованного винограда».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, традиционно переводимое как «яблоки», могло обозначать и другой душистый плод; точный вид растения неизвестен.
    reason: cultural_note
  - marker: c
    text: 'Или: «я изнемогаю от любви», «я томлюсь от любви».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַמְּכוּנִי
  choice: поддержите меня
  rationale: Форма повелительного наклонения множественного числа от סמך означает «поддерживать, укреплять». Выбор передаёт просьбу героини помочь ей в состоянии слабости и сохраняет параллелизм следующей строке.
- source_word: בָּאֲשִׁישׁוֹת
  choice: лепёшками из изюма
  rationale: אֲשִׁישׁוֹת обозначает прессованные лепёшки, вероятнее всего из изюма или винограда. Такой перевод конкретен, понятен современному читателю и не выходит за пределы наиболее вероятного значения.
- source_word: רַפְּדוּנִי
  choice: освежите меня
  rationale: Основное значение корня связано с подкладыванием или устройством опоры, однако в данном поэтическом параллелизме с пищей выражение передаёт восстановление сил. «Освежите меня» естественно звучит по-русски, не устраняя исходный образ полностью благодаря сноске.
- source_word: בַּתַּפּוּחִים
  choice: яблоками
  rationale: Традиционное соответствие для תַּפּוּחַ — «яблоко», хотя точный вид душистого плода установить невозможно. Неопределённость отмечена в сноске.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит причину просьбы. «Ведь» естественно связывает части русской поэтической строки.
- source_word: חוֹלַת אַהֲבָה
  choice: я больна любовью
  rationale: Перевод сохраняет метафору болезни, причинённой любовью, а форма женского рода отражает грамматический род חוֹלַת и голос героини.
theological_decisions:
- issue: Характер любовной болезни
  choice: Сохранена буквальная поэтическая метафора «больна любовью».
  alternative: «Изнемогаю от любви» или «томлюсь от любви».
  rationale: Текст описывает сильное состояние героини и сам по себе не требует ни аллегорического, ни медицинского истолкования; буквальная метафора сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с мягко поэтическим строем. Сохранены обращения во множественном числе, пищевые образы и женский голос героини; архаизмы и конфессионально окрашенные толкования не вводились.
