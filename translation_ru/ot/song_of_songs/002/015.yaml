  text: אֶֽחֱזוּ לָ֨/נוּ֙ שֽׁוּעָלִ֔ים שֽׁוּעָלִ֥ים קְטַנִּ֖ים מְחַבְּלִ֣ים כְּרָמִ֑ים וּ/כְרָמֵ֖י/נוּ סְמָדַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/015.yaml
  text: Catch the foxes for us[a], the little foxes that ruin the vineyards[c][b], for our vineyards are in blossom.
translation:
  language: ru
  text: Поймайте для нас лисиц[a], маленьких лисиц, которые губят виноградники[b], — ведь наши виноградники в цвету[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово שׁוּעָלִים в некоторых контекстах можно также понимать как «шакалов».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которые портят виноградники».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «цветут»; менее вероятно: «покрылись молодыми гроздьями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחֱזוּ
  choice: Поймайте
  rationale: Форма повелительного наклонения во множественном числе от אחז призывает схватить животных; «поймайте» естественно передаёт это действие по-русски.
- source_word: לָנוּ
  choice: для нас
  rationale: Предлог с суффиксом первого лица множественного числа означает действие в интересах говорящих; «для нас» сохраняет множественное число и естественно сочетается с глаголом.
- source_word: שׁוּעָלִים
  choice: лисиц
  rationale: Обычное значение слова — «лисицы»; возможное значение «шакалы» отмечено в сноске.
- source_word: שׁוּעָלִים קְטַנִּים
  choice: маленьких лисиц
  rationale: Повтор существительного и прилагательное сохранены, чтобы передать выразительный акцент еврейского текста.
- source_word: מְחַבְּלִים
  choice: которые губят
  rationale: Причастие обозначает продолжающееся причинение серьёзного вреда. «Губят» звучит естественно и не обязательно подразумевает полное уничтожение.
- source_word: כְּרָמִים
  choice: виноградники
  rationale: Существительное обычно обозначает виноградники как участки насаждений, а не отдельные лозы.
- source_word: וּכְרָמֵינוּ
  choice: ведь наши виноградники
  rationale: Союз ו допускает контекстуально-пояснительное прочтение; «ведь» естественно связывает призыв ловить лисиц с уязвимостью цветущих виноградников.
- source_word: סְמָדַר
  choice: в цвету
  rationale: Слово обозначает раннюю стадию цветения виноградной лозы. Краткое выражение «в цвету» ясно и поэтично передаёт сезонный образ.
