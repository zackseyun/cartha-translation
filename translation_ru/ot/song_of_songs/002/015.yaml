  register: Современный литературный русский язык с сохранением поэтического повтора «лисиц, маленьких лисиц». Тире перед «ведь» подчёркивает пояснительную связь между повелением и состоянием виноградников; формулировка остаётся ясной и естественной для широкого читателя.
