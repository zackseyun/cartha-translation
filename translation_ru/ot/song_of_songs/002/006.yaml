lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: левая рука его
  rationale: Существительное обозначает левую сторону или левую руку; в данном телесном контексте естественно уточнить «рука», хотя отдельного слова «рука» в еврейском тексте нет.
- source_word: תַּחַת
  choice: под
  rationale: Предлог прямо выражает положение ниже чего-либо; «под» естественно и точно передаёт пространственное отношение.
- source_word: לְרֹאשִׁי
  choice: моей головой
  rationale: רֹאשׁ означает «голова»; вместе с תַּחַת сочетание естественно переводится «под моей головой» без смыслового расширения.
- source_word: וִימִינוֹ
  choice: а правая
  rationale: Существительное обозначает правую сторону или правую руку. В русском параллелизме слово «рука» естественно подразумевается из первой строки, что позволяет избежать тяжеловесного повтора.
- source_word: תְּחַבְּקֵנִי
  choice: обнимает меня
  rationale: Форма от חבק означает «обнимать»; настоящее время живо передаёт изображённую поэтическую сцену и сохраняет непосредственную телесную близость.
