  text: My beloved answered and said to me, “Rise up, my love, my beautiful one, and come away.”
translation:
  language: ru
  text: 'Мой возлюбленный отозвался и сказал мне: «Встань, любимая моя, прекрасная моя, и пойдём!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹדִי
  choice: возлюбленный мой
  rationale: Передаёт мужского возлюбленного и сохраняет поэтический, но понятный современному читателю регистр.
- source_word: עָנָה
  choice: заговорил
  rationale: В данном контексте глагол вводит речь возлюбленного; буквальное «ответил» могло бы ошибочно подразумевать явно предшествующий вопрос.
- source_word: רַעְיָתִי
  choice: любимая моя
  rationale: Естественное русское обращение, выражающее близость; не вносит более узкого семейного статуса.
- source_word: יָפָתִי
  choice: прекрасная моя
  rationale: Сохраняет прямое ласковое обращение и поэтический параллелизм.
- source_word: וּלְכִי־לָךְ
  choice: и пойдём
  rationale: Идиоматично передаёт приглашение отправиться вместе; возвратное לָךְ усиливает побуждение, но обычно не требует отдельного русского соответствия.
