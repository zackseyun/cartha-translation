lexical_decisions:
- source_word: אֲנִי
  choice: Я —
  rationale: Самостоятельное местоимение подчёркивает самоидентификацию говорящей; в русском настоящем времени именная связка естественно передаётся тире.
- source_word: חֲבַצֶּלֶת
  choice: шафран
  rationale: Точный вид растения неизвестен. «Шафран» — вероятное современное соответствие, сохраняющее образ полевого цветка и не вносящее традиционный, но ботанически сомнительный образ розы.
- source_word: הַשָּׁרוֹן
  choice: Шарона
  rationale: Шарон — географическое имя; родительный падеж естественно передаёт конструктивную связь.
- source_word: שׁוֹשַׁנַּת
  choice: лилия
  rationale: Хотя точная ботаническая идентификация не вполне ясна, «лилия» — устойчивое и обоснованное соответствие, сохраняющее поэтический цветочный образ.
- source_word: הָעֲמָקִים
  choice: долин
  rationale: Форма множественного числа обозначает долины или низменные места; «долин» ясно и естественно поддерживает параллелизм строки.
