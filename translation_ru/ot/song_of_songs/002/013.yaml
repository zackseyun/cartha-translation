  text: The fig tree has ripened its early figs[a], and the vines in blossom give off fragrance. Arise, my love, my beautiful one[c][b], and come away.
translation:
  language: ru
  text: Смоковница завязала свои ранние плоды[a], и цветущие лозы источают аромат[b]. Встань, возлюбленная моя, прекрасная моя, иди же[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дала свои зелёные плоды». Еврейские слова могут подчёркивать раннюю стадию развития плодов, а не их полную зрелость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лозы с молодыми гроздьями источают аромат». Еврейское слово может относиться к цветению лозы или к самой ранней стадии формирования винограда.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и иди себе». Здесь это повторное приглашение уйти; возможна передача: «иди же».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנְטָה פַגֶּיהָ
  choice: завязала свои ранние плоды
  rationale: Глагол חנט вместе с פגים указывает на появление и раннюю стадию развития плодов смоковницы, а не обязательно на их полное созревание. «Завязала» естественно передаёт этот ботанический образ по-русски.
- source_word: סְמָדַר
  choice: цветущие
  rationale: Слово обозначает цветение виноградной лозы либо самую раннюю стадию формирования винограда. В связи с упоминанием аромата наиболее естественно «цветущие лозы», при сохранении альтернативы в сноске.
- source_word: נָתְנוּ רֵיחַ
  choice: источают аромат
  rationale: Современная поэтическая передача идиомы «дают запах»; настоящее время уместно для живого описания наступившей весны.
- source_word: קוּמִי
  choice: Встань
  rationale: Императив приглашения; «встань» ясно, естественно и сохраняет поэтическое достоинство.
- source_word: רַעְיָתִי
  choice: любовь моя
  rationale: Нежное обращение к возлюбленной. Выбор сохраняет интимность и поэтический регистр, не сужая значение до нейтральной «подруги».
- source_word: יָפָתִי
  choice: красавица моя
  rationale: Естественное современное русское обращение, прямо передающее значение красоты и параллельное выражению «любовь моя».
- source_word: וּלְכִי לָךְ
  choice: и пойдём со мной
  rationale: Буквально обращение велит женщине «иди себе», однако в контексте приглашения говорящего русское «пойдём со мной» естественно передаёт совместное удаление, не создавая ошибочного впечатления, будто её отсылают одну.
