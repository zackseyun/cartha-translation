lexical_decisions:
- source_word: הַנִּצָּנִים
  choice: цветы
  rationale: Слово обозначает весенние цветы или соцветия; «цветы» естественно для современного русского языка и не сужает значение до ещё не раскрывшихся бутонов.
- source_word: נִרְאוּ
  choice: показались
  rationale: Нифаль глагола ראה здесь передаёт появление в поле зрения; «показались» сохраняет образ наступившей весны.
- source_word: בָאָרֶץ
  choice: на земле
  rationale: В локальной весенней сцене אֶרֶץ означает землю или край; по-русски цветы естественно показываются «на земле».
- source_word: עֵת הַזָּמִיר
  choice: время пения
  rationale: זָמִיר допускает значения «пение» и «обрезка». В контексте слышимого голоса горлицы «пение» лучше соответствует параллелизму, а иной вариант сохранён в сноске.
- source_word: הִגִּיעַ
  choice: настало
  rationale: В сочетании со словом «время» это естественная русская передача значения «пришло, наступило».
- source_word: וְקוֹל הַתּוֹר
  choice: и голос горлицы
  rationale: קוֹל буквально означает «голос» или «звук», а תּוֹר — именно горлицу; буквальный образ сохраняет лирическую выразительность.
- source_word: נִשְׁמַע
  choice: слышен
  rationale: Краткая пассивная форма естественно передаёт значение нифаля «слышится, бывает услышан», не добавляя идеи зова.
- source_word: בְּאַרְצֵנוּ
  choice: в нашей земле
  rationale: Передаёт местоименный суффикс первого лица множественного числа и сохраняет повтор существительного אֶרֶץ в стихе.
