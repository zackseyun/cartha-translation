  text: The blossoms appear in the land; the time of singing has come[a], and the voice of the turtledove is heard in our land.
translation:
  language: ru
  text: На земле появились цветы; настала пора пения[a], и в нашем краю слышен голос горлицы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настала пора обрезки». Еврейское זָמִיר может означать и «пение/песня», и «обрезка»; здесь выбран вариант «пение», поскольку ему соответствует дальнейшее упоминание голоса горлицы.'
