  text: כִּֽי הִנֵּ֥ה ה/סתו עָבָ֑ר הַ/גֶּ֕שֶׁם חָלַ֖ף הָלַ֥ךְ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/011.yaml
  text: For look[a], the winter has passed; the rain is over and gone.
translation:
  language: ru
  text: Ведь вот, зима[a] прошла, дождь миновал и ушёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сезон дождей». Еврейское слово, переведённое как «зима», может обозначать именно дождливое время года.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим приглашением и естественно звучит в современной русской поэтической речи.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательное значение частицы, привлекающей внимание, без архаического оттенка.
- source_word: הַסְּתָו
  choice: зима
  rationale: Наиболее естественное русское обозначение холодного дождливого времени года; возможное более узкое значение «сезон дождей» сохранено в сноске.
- source_word: עָבָר
  choice: прошла
  rationale: Передаёт завершённость действия и согласуется с существительным женского рода «зима».
- source_word: הַגֶּשֶׁם
  choice: дождь
  rationale: Прямой и контекстуально точный эквивалент определённого существительного.
- source_word: חָלַף
  choice: миновал
  rationale: Передаёт прекращение и удаление дождя, сохраняя отличие от предшествующего глагола «прошла».
- source_word: הָלַךְ לוֹ
  choice: и ушёл
  rationale: 'Сохраняет усилительное продолжение: дождь не просто миновал, но окончательно удалился; выражение естественно по-русски.'
theological_decisions: []
