  yaml_path: translation/ot/song_of_songs/002/014.yaml
  text: My dove[a], in the clefts of the rock, in the hiding place of the cliff, let me see your appearance; let me hear your voice, for your voice is sweet[b], and your appearance is lovely.
translation:
  language: ru
  text: Голубка моя, в расселинах скалы, в укромном месте крутого уступа[a], покажи мне свой облик; дай мне услышать твой голос, потому что голос твой сладок, и облик твой прекрасен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в укромном месте крутого подъёма»; еврейское слово редкое и может обозначать крутой каменистый склон, уступ или обрыв.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנָתִי
  choice: Голубка моя
  rationale: Буквальный и естественный для русской любовной поэзии образ ласкового обращения; женский род соответствует адресату.
- source_word: בְּחַגְוֵי הַסֶּלַע
  choice: в расселинах скалы
  rationale: Передаёт множественное число и конкретный образ трещин или углублений в скале.
- source_word: בְּסֵתֶר הַמַּדְרֵגָה
  choice: в укрытии крутого уступа
  rationale: סֵתֶר обозначает укрытое, скрытое место, а редкое מַדְרֵגָה — вероятно, крутой каменистый уступ, подъём или обрыв; перевод сохраняет топографическую неопределённость с пояснением в сноске.
- source_word: הַרְאִינִי אֶת־מַרְאַיִךְ
  choice: покажись мне
  rationale: Естественно передаёт побудительную форму «дай мне увидеть» и широкий визуальный смысл מַרְאֶה, не ограничивая его только лицом.
- source_word: הַשְׁמִיעִינִי אֶת־קוֹלֵךְ
  choice: дай мне услышать твой голос
  rationale: Идиоматично передаёт каузативную форму и сохраняет мягкий просительный тон.
- source_word: עָרֵב
  choice: сладок
  rationale: Сохраняет поэтическую характеристику приятного голоса и естественно звучит в данном контексте.
- source_word: מַרְאַיִךְ / מַרְאֵיךְ
  choice: облик
  rationale: «Облик» передаёт видимый образ или внешность шире, чем «лицо», и уместен в литературно-поэтическом регистре.
- source_word: נָאוֶה
  choice: прекрасен
  rationale: Естественное современное соответствие со значением красоты и привлекательности.
