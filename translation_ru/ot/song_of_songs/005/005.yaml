base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/005.yaml
  text: I arose to open to my beloved[a], and my hands dripped with myrrh, my fingers with flowing myrrh[b], on the handles of the bolt.
translation:
  language: ru
  text: Я встала, чтобы открыть дверь своему возлюбленному; с рук моих капала мирра, с пальцев моих — струящаяся мирра[a], на ручки засова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жидкая мирра»; возможно также: «текущая мирра».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на ручки замка»; возможно также: «на щеколду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתִּי אֲנִי
  choice: Я встала
  rationale: Форма 1-го лица с явным местоимением подчёркивает субъект; русское «я встала» естественно передаёт это ударение и согласуется с женским голосом контекста.
- source_word: לִפְתֹּחַ לְדוֹדִי
  choice: чтобы открыть моему возлюбленному
  rationale: Инфинитив передаёт цель действия, а לְדוֹדִי обозначает возлюбленного, которому героиня намерена открыть дверь.
- source_word: יָדַי נָטְפוּ מוֹר
  choice: руки мои источали мирру
  rationale: נטף означает «капать, сочиться»; «источали мирру» сохраняет образ каплющего благовония и звучит естественно в поэтическом русском.
- source_word: אֶצְבְּעֹתַי מוֹר עֹבֵר
  choice: пальцы мои — текучую мирру
  rationale: Во второй параллельной строке сказуемое подразумевается. עֹבֵר буквально связано с движением или течением; «текучую» сохраняет образ жидкой, стекающей мирры без лишнего уточнения.
- source_word: כַּפּוֹת הַמַּנְעוּל
  choice: ручки засова
  rationale: В контексте двери כַּפּוֹת обозначает части запирающего устройства, за которые берутся рукой, а מַּנְעוּל — запор или засов. Формулировка сохраняет древний предметный образ.
