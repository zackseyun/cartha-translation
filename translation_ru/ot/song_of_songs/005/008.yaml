  yaml_path: translation/ot/song_of_songs/005/008.yaml
  text: 'I adjure you[a], daughters of Jerusalem: if you find my beloved, what will you tell him? That I am sick with love.'
translation:
  language: ru
  text: 'Заклинаю вас, дочери Иерусалима: если вы найдёте моего возлюбленного, что скажете ему? Что я больна любовью[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я изнемогаю от любви». Буквально: «я больна любовью».'
    reason: Указан естественный поэтический вариант при сохранении буквальной метафоры в основном тексте.
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: Заклинаю вас
  rationale: Форма глагола שׁבע в этой конструкции означает связать клятвой или обратиться с торжественным настоятельным призывом. «Заклинаю вас» сохраняет возвышенный и настойчивый тон, не вводя лишнего пояснения.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: дочери Иерусалима
  rationale: Прямой и традиционный поэтический перевод обращения; он сохраняет образность еврейского текста без истолковывающего уточнения возраста или общественного положения женщин.
- source_word: אִם תִּמְצְאוּ
  choice: если вы найдёте
  rationale: Условная частица אִם естественно передаётся словом «если»; вариант «когда» неоправданно превращал бы возможность встречи в ожидаемое событие.
- source_word: דּוֹדִי
  choice: моего возлюбленного
  rationale: В Песни песней דּוֹד обозначает любимого мужчину. «Возлюбленный» звучит естественно и достойно в поэтическом контексте и не сужает значение до преимущественно телесной связи.
- source_word: מַה תַּגִּידוּ לוֹ
  choice: что скажете ему?
  rationale: Сохранён прямой вопрос еврейского текста. Русское будущее время естественно передаёт предполагаемую передачу вести.
- source_word: שֶׁחוֹלַת אַהֲבָה אָנִי
  choice: Что я больна любовью
  rationale: Перевод сохраняет метафору болезни и необычную, напряжённую формулировку оригинала, не заменяя её более свободным «я изнемогаю от любви».
