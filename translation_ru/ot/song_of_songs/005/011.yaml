lexical_decisions:
- source_word: רֹאשׁוֹ
  choice: Голова его
  rationale: Рֹאשׁ здесь обозначает голову как первую часть поэтического описания тела возлюбленного; конкретное анатомическое значение естественно в контексте.
- source_word: כֶּתֶם פָּז
  choice: чистейшее золото
  rationale: Сочетание двух обозначений высококачественного золота усиливает образ драгоценности и чистоты. Русская превосходная форма естественно передаёт эту эмфазу без буквального и неясного нагромождения.
- source_word: קְוּצּוֹתָיו
  choice: пряди его
  rationale: Слово обозначает пряди или локоны волос. «Пряди» звучит поэтично и современно, не предрешая, насколько сильно волосы вьются.
- source_word: תַּלְתַּלִּים
  choice: волнисты
  rationale: Редкое поэтическое слово, вероятно, описывает волнистые или вьющиеся волосы. «Волнисты» сохраняет образ и не придаёт неопределённому термину излишней точности.
- source_word: שְׁחֹרוֹת
  choice: черны
  rationale: Прилагательное прямо обозначает чёрный цвет; краткая форма поддерживает возвышенный поэтический ритм.
- source_word: כָּעוֹרֵב
  choice: как ворон
  rationale: Прямое сравнение с вороном передаёт насыщенно-чёрный цвет волос и сохраняет образ оригинала.
