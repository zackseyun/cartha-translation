lexical_decisions:
- source_word: שׁוֹקָיו
  choice: его ноги
  rationale: Слово может обозначать ногу, голень или область бедра; в поэтическом описании «ноги» естественно передаёт образ столпов без излишней анатомической конкретизации.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: мраморные столпы
  rationale: עַמּוּדֵי означает «столпы/колонны», а שֵׁשׁ — ценную белую породу, традиционно понимаемую как мрамор; «столпы» сохраняет возвышенный поэтический регистр.
- source_word: מְיֻסָּדִים עַל אַדְנֵי פָז
  choice: утверждённые на основаниях из чистого золота
  rationale: Причастие от יסד выражает прочную постановку на основание; אַדְנֵי — архитектурные основания, а פָז — золото высокого качества.
- source_word: מַרְאֵהוּ
  choice: вид его
  rationale: Передаёт целостное внешнее впечатление и сохраняет поэтическую краткость.
- source_word: כַּלְּבָנוֹן
  choice: как Ливан
  rationale: Ливан выступает образом красоты и величия; прямое сравнение сохраняет географический и поэтический образ.
- source_word: בָּחוּר כָּאֲרָזִים
  choice: величествен, как кедры
  rationale: בָּחוּר буквально связано с избранностью и превосходством; в данном контексте характеризует выдающееся достоинство, которое по-русски естественно выражено словом «величествен» в сочетании с образом кедров.
