  text: בָּ֣אתִי לְ/גַנִּ/י֮ אֲחֹתִ֣/י כַלָּה֒ אָרִ֤יתִי מוֹרִ/י֙ עִם בְּשָׂמִ֔/י אָכַ֤לְתִּי יַעְרִ/י֙ עִם דִּבְשִׁ֔/י שָׁתִ֥יתִי יֵינִ֖/י עִם חֲלָבִ֑/י אִכְל֣וּ רֵעִ֔ים שְׁת֥וּ וְ/שִׁכְר֖וּ דּוֹדִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/001.yaml
  text: I have come into my garden[a], my sister, my bride; I have gathered my myrrh with my spice. I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, friends; drink, and be drunk, beloved ones.
translation:
  language: ru
  text: Я пришёл в свой сад, сестра моя, невеста; собрал я мирру мою с благовониями моими, ел соты мои с мёдом моим, пил вино моё с молоком моим. Ешьте, друзья, пейте и упивайтесь любовью![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пейте и упивайтесь, возлюбленные», если понимать последнее слово как обращение.'
    reason: Еврейское דּוֹדִים допускает как значение «любовь, любовные ласки», так и вокативное понимание «возлюбленные».
lexical_decisions:
- source_word: בָּאתִי לְגַנִּי
  choice: Я пришёл в свой сад
  rationale: Перфект 1-го лица ед. числа обозначает совершившееся прибытие; «в свой сад» естественно передаёт направительное לְ и достижение цели движения.
- source_word: אֲחֹתִי כַלָּה
  choice: сестра моя, невеста
  rationale: Сохранены оба обращения и их поэтический параллелизм; слово «сестра» здесь является нежным обращением, а не пояснением родства.
- source_word: אָרִיתִי מוֹרִי עִם בְּשָׂמִי
  choice: собрал я мирру мою с благовониями моими
  rationale: אָרָה означает собирание ароматических веществ; בְּשָׂמִים охватывает пряности и благовония, причём форма с суффиксом может быть понята как множественное число.
- source_word: יַעְרִי עִם דִּבְשִׁי
  choice: соты мои с мёдом моим
  rationale: יַעַר в данном сочетании обозначает медовые соты или мёд в сотах; буквенная парность образов сохранена.
- source_word: יֵינִי עִם חֲלָבִי
  choice: вино моё с молоком моим
  rationale: Конкретные образы пиршества переданы буквально без рационализирующего пояснения способа их сочетания.
- source_word: שְׁת֥וּ וְשִׁכְר֖וּ דּוֹדִים
  choice: пейте и упивайтесь любовью
  rationale: שׁכר в повелительной форме означает насыщение питьём вплоть до опьянения; דּוֹדִים может обозначать любовь или любовные ласки. «Упивайтесь любовью» естественно сохраняет чувственно-поэтический смысл, а возможное обращение вынесено в сноску.
theological_decisions:
- issue: Значение דּוֹדִים в заключительном приглашении
  choice: любовью — как содержание или сфера упоения
  alternative: «пейте и упивайтесь, возлюбленные», если понимать דּוֹדִים как обращение
  rationale: В Песни песней דּוֹדִים неоднократно означает любовь или любовные ласки. Эта трактовка хорошо соответствует поэтическому призыву и не вводит аллегорического толкования, однако грамматически возможное обращение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «собрал я», а также повтор притяжательных форм сохраняют ритм и подчёркнутую образность еврейского текста; архаические глагольные формы исключены.
