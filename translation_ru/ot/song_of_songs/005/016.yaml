  text: חִכּ/וֹ֙ מַֽמְתַקִּ֔ים וְ/כֻלּ֖/וֹ מַחֲּמַדִּ֑ים זֶ֤ה דוֹדִ/י֙ וְ/זֶ֣ה רֵעִ֔/י בְּנ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/016.yaml
  text: His mouth is sweetness itself[a], and all of him is desirable. This is my beloved, and this is my friend[b], O daughters of Jerusalem.
translation:
  language: ru
  text: Уста его — сама сладость[a], и весь он желанен[b]. Вот мой возлюбленный, и вот мой друг, дочери Иерусалима!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нёбо его — сладости»; возможно также: «речь его — сама сладость».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «весь он — желанные вещи (прелести)». Множественное число усиливает значение желанности и привлекательности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִכּוֹ
  choice: уста его
  rationale: Буквально существительное обозначает нёбо, но в любовной поэзии метонимически указывает на рот — возможный источник сладости поцелуев или речи. «Уста» сохраняет телесный образ и соответствует возвышенному поэтическому регистру.
- source_word: מַמְתַקִּים
  choice: сама сладость
  rationale: Форма множественного числа здесь имеет усилительное или абстрактное значение. «Сама сладость» естественно передаёт поэтическую интенсивность, не превращая выражение в простое прилагательное.
- source_word: וְכֻלּוֹ
  choice: и весь он
  rationale: Прямо передаёт буквальное «и весь он», сохраняя акцент на всей личности возлюбленного.
- source_word: מַחֲמַדִּים
  choice: желанен
  rationale: Слово выражает желанность, привлекательность и прелесть; множественное число, вероятно, усилительное. Предикативное «желанен» непосредственно передаёт смысл и естественно звучит по-русски.
- source_word: זֶה דֹודִי וְזֶה רֵעִי
  choice: Вот мой возлюбленный, и вот мой друг
  rationale: Повтор указательного местоимения сохранён ради эмфазы и параллелизма. «Возлюбленный» поддерживает поэтический регистр, а «друг» сохраняет широту значения רֵעַ.
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: дочери Иерусалима
  rationale: Сохранена буквальная и повторяющаяся в книге поэтическая формула обращения; замена на «девушки Иерусалима» была бы более истолковательной.
theological_decisions:
- issue: Возможное мессианское или конфессионально-догматическое истолкование מַחֲמַדִּים
  choice: Передать слово в непосредственном контексте любовной песни как «желанен».
  alternative: Использовать традиционную формулу «весь он — любезность» или придать слову титульное либо мессианское значение.
  rationale: В данном месте женщина описывает своего возлюбленного. Еврейский текст не требует дополнительного титульного или догматического смысла, поэтому перевод сохраняет непосредственное поэтическое значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. «Уста» выбрано вместо анатомического «нёбо» как естественная метонимия; синтаксический параллелизм и повтор «вот» сохранены.
