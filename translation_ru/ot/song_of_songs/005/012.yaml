lexical_decisions:
- source_word: עֵינָיו
  choice: Глаза его
  rationale: 'עַיִן здесь обозначает глаз: притяжательный суффикс и сравнение с голубями указывают на описание внешности возлюбленного, а не на значение «источник».'
- source_word: כְּיוֹנִים
  choice: словно голуби
  rationale: Частица כְּ вводит сравнение; «словно голуби» естественно передаёт поэтический образ в современном русском языке.
- source_word: עַל אֲפִיקֵי מָיִם
  choice: у водных потоков
  rationale: אֲפִיקִים может означать русла, протоки или потоки; предлог «у» естественно передаёт расположение возле воды.
- source_word: רֹחֲצוֹת בֶּחָלָב
  choice: омытые молоком
  rationale: Причастие от רחץ допускает значения «омывающиеся» и «омытые». Формулировка сохраняет яркий образ молочной белизны и не уточняет, относится ли он непосредственно к голубям или метафорически к глазам.
- source_word: יֹשְׁבוֹת עַל מִלֵּאת
  choice: сидящие у полноводья
  rationale: יֹשְׁבוֹת буквально передаёт пребывание или сидение, а редкое מִלֵּאת связано с полнотой. «У полноводья» поддерживает образ голубей возле обильной воды, но трудность и иное возможное понимание выражения отмечены в сноске.
