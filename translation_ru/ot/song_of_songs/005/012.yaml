translation_notes:
  register: 'Современный литературный русский язык с сохранением лаконичного и чувственного поэтического образа. Неясность заключительной фразы не устранена безоговорочно: основной текст следует водному образу, а вариант, относящий выражение к расположению глаз, приведён в сноске.'
