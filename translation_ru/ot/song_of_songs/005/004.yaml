lexical_decisions:
- source_word: דּוֹדִי
  choice: Возлюбленный мой
  rationale: Передаёт поэтическое и близкое обращение к любимому мужчине, сохраняя характерную для Песни песней лексику.
- source_word: שָׁלַח יָדוֹ
  choice: протянул руку
  rationale: В сочетании с «рукой» глагол означает направить или просунуть её; «протянул» естественно передаёт движение без добавления неявных подробностей.
- source_word: מִן הַחֹר
  choice: через отверстие
  rationale: Хотя предлог буквально означает «из/от», в данном контексте выражение указывает на движение руки через отверстие, вероятно в двери. «Отверстие» сохраняет конкретность и не уточняет конструкцию сверх текста.
- source_word: וּמֵעַי
  choice: всё внутри меня
  rationale: Еврейское слово буквально обозначает внутренние органы и образно — глубочайшие чувства. Русская формулировка сохраняет телесно-эмоциональный образ и звучит естественно.
- source_word: הָמוּ
  choice: затрепетало
  rationale: Глагол описывает внутреннее волнение, движение или смятение; «затрепетало» уместно передаёт сильный чувственный отклик в поэтическом контексте.
- source_word: עָלָיו
  choice: от любви к нему
  rationale: Предлог допускает значения «из-за него», «о нём», «к нему». В контексте выражена направленная к возлюбленному глубокая эмоция; добавление «от любви» делает русский смысл естественным, а менее определённые варианты отмечены в сноске.
