  text: The watchmen who go about the city found me[a]; they struck me, they wounded me[b]; the keepers of the walls took my cloak from me.
translation:
  language: ru
  text: Стражи, обходившие город, нашли меня; они избили меня, ранили меня; стражи стен сняли с меня накидку[b].
  philosophy: optimal-equivalence
