lexical_decisions:
- source_word: מְצָאֻנִי
  choice: нашли меня
  rationale: Прямое соответствие глаголу מצא; в контексте поисков женщины естественно передаёт, что стражи обнаружили её.
- source_word: הַשֹּׁמְרִים
  choice: стражи
  rationale: Причастное существительное от שמר обозначает тех, кто несёт стражу; «стражи» естественно для городской ночной охраны.
- source_word: הַסֹּבְבִים בָּעִיר
  choice: обходящие город
  rationale: Сохраняет причастную форму и основное значение סבב — «обходить, кружить», не вводя излишне специализированного понятия патрулирования.
- source_word: הִכּוּנִי
  choice: избили меня
  rationale: В данном сочетании с последующим «изранили» глагол נכה описывает физическое насилие; «избили» звучит по-русски естественнее, чем буквальное «ударили» во множественном числе.
- source_word: פְצָעוּנִי
  choice: изранили меня
  rationale: Глагол פצע означает причинить раны; «изранили» сохраняет усиление после «избили» и повтор объектного суффикса.
- source_word: נָשְׂאוּ אֶת רְדִידִי מֵעָלַי
  choice: сорвали с меня покрывало
  rationale: נשא с מֵעָלַי означает снять или унести то, что было на ней; в насильственном контексте «сорвали» естественно. רְדִיד — верхнее покрытие или накидка, поэтому «покрывало» сохраняет некоторую предметную неопределённость.
- source_word: שֹׁמְרֵי הַחֹמוֹת
  choice: стражи стен
  rationale: Буквально передаёт конструкцию и сохраняет повтор корня שמר, связывающий заключительное определение с упомянутыми ранее стражами.
