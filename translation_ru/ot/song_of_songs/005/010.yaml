lexical_decisions:
- source_word: דּוֹדִי
  choice: возлюбленный мой
  rationale: В Песни песней דּוֹד обозначает любимого мужчину в романтическом смысле. «Возлюбленный мой» звучит естественно и достойно, сохраняя повторяющуюся лексику книги.
- source_word: צַח
  choice: светел
  rationale: Прилагательное передаёт яркость, чистоту и сияющий облик. «Светел» сохраняет образ видимой светлоты, не сводя его однозначно к цвету кожи.
- source_word: וְאָדוֹם
  choice: и румян
  rationale: אָדוֹם буквально связано с красным цветом; применительно к облику человека «румян» естественно передаёт здоровую красноту лица.
- source_word: דָּגוּל
  choice: выделяется
  rationale: Форма может означать отмеченного, заметного или выдающегося среди других. «Выделяется» естественно передаёт заметность, не усиливая смысл до безусловного превосходства.
- source_word: מֵרְבָבָה
  choice: среди десяти тысяч
  rationale: Предлог מִן здесь указывает на выделение из огромного множества. «Среди десяти тысяч» естественно сохраняет поэтический образ.
