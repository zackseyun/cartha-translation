  text: My beloved is radiant and ruddy[a], distinguished among ten thousand.
translation:
  language: ru
  text: Возлюбленный мой светел и румян, выделяется среди десяти тысяч.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заметен среди десяти тысяч»; более буквально: «отмечен знаменем среди десяти тысяч».'
