base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/009.yaml
  text: What is your beloved more than another beloved[a], most beautiful among women? What is your beloved more than another beloved[b], that you have made us swear thus?
translation:
  language: ru
  text: Чем твой возлюбленный лучше другого возлюбленного[a], прекраснейшая из женщин? Чем твой возлюбленный лучше другого возлюбленного, что ты взяла с нас такую клятву[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твой любимый»; еврейское דּוֹד здесь обозначает возлюбленного в романтическом смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ты заставила нас поклясться»; возможно также: «ты закляла нас». Еврейский глагол означает побудить кого-либо поклясться или связать его клятвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: чем… лучше
  rationale: В сравнительной конструкции מַה вместе с מִן выражает вопрос об отличительном превосходстве. Русское «чем… лучше» естественно передаёт прямую силу вопроса.
- source_word: דּוֹדֵךְ
  choice: твой возлюбленный
  rationale: В Песни песней דּוֹד обозначает любимого мужчину или возлюбленного. «Возлюбленный» сохраняет романтический смысл и возвышенный поэтический регистр.
- source_word: מִדּוֹד
  choice: лучше другого возлюбленного
  rationale: Предлог מִן имеет сравнительное значение. Повтор слова «возлюбленный» сохраняет параллелизм и словесный повтор еврейского текста; «другого» ясно выражает подразумеваемое сравнение.
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: прекраснейшая из женщин
  rationale: Сочетание прилагательного с בְּ и множественным числом в данном обращении имеет превосходный смысл. Формулировка поэтична, ясна и соответствует женскому адресату.
- source_word: שֶׁכָּכָה
  choice: такую
  rationale: Наречное выражение указывает на характер или степень действия. В сочетании «такую клятву» оно естественно передаёт смысл «так, подобным образом».
- source_word: הִשְׁבַּעְתָּנוּ
  choice: ты взяла с нас клятву
  rationale: Каузативная форма глагола שבע означает побудить кого-либо поклясться или связать клятвой. Русское выражение передаёт этот смысл естественно и без архаической тяжеловесности.
