translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Порядок «сердце моё», «сестра моя» и сходные обороты поддерживают ритм любовной поэзии, оставаясь понятными современному читателю. Лексическая неоднозначность קוֹל и תַמָּתִי сохранена с помощью сносок.
