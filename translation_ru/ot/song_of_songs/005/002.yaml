  text: אֲנִ֥י יְשֵׁנָ֖ה וְ/לִבִּ֣/י עֵ֑ר ק֣וֹל דּוֹדִ֣/י דוֹפֵ֗ק פִּתְחִי לִ֞/י אֲחֹתִ֤/י רַעְיָתִ/י֙ יוֹנָתִ֣/י תַמָּתִ֔/י שֶׁ/רֹּאשִׁ/י֙ נִמְלָא טָ֔ל קְוֻּצּוֹתַ֖/י רְסִ֥יסֵי לָֽיְלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/002.yaml
  text: 'I was asleep[a], but my heart was awake. The sound of my beloved knocking: “Open to me, my sister, my darling, my dove, my blameless one, for my head is drenched with dew[b], my locks with the drops of the night.”'
translation:
  language: ru
  text: 'Я спала, но сердце моё бодрствовало. Голос[a] моего возлюбленного: он стучится: «Открой мне, сестра моя, любимая моя, голубка моя, непорочная моя[b], ведь голова моя покрыта росой, кудри мои — каплями ночи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звук». Еврейское קוֹל может обозначать как голос, так и вообще слышимый звук.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совершенная моя»; возможно также: «чистая моя». Еврейское слово выражает цельность, невинность или чистоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֵׁנָה
  choice: Я спала
  rationale: Предикативная форма женского рода естественно передаётся прошедшим временем; это задаёт фон сцены и сохраняет противопоставление бодрствующему сердцу.
- source_word: לִבִּי עֵר
  choice: сердце моё бодрствовало
  rationale: «Сердце» сохраняет еврейский образ внутреннего человека, а «бодрствовало» подчёркивает поэтическое напряжение между сном и внутренней явью.
- source_word: קוֹל דּוֹדִי
  choice: Голос моего возлюбленного
  rationale: קוֹל допускает значения «голос» и «звук». Введение последующей прямой речи делает «голос» естественным в основном тексте, а более широкое «звук» отмечено в сноске.
- source_word: דוֹפֵק
  choice: он стучится
  rationale: Причастие передаёт продолжающееся действие; отдельная краткая фраза сохраняет внезапность и живость восприятия.
- source_word: פִּתְחִי לִי
  choice: Отвори мне
  rationale: «Отвори» естественно сочетается с подразумеваемой дверью и сохраняет прямой, настойчивый призыв; форма «открой мне» в данном контексте менее плавна.
- source_word: אֲחֹתִי
  choice: сестра моя
  rationale: Буквальный образ сохранён как характерное для Песни Песней обращение к возлюбленной.
- source_word: רַעְיָתִי
  choice: любимая моя
  rationale: Передаёт ласковое обращение к возлюбленной современным и литературным русским языком.
- source_word: יוֹנָתִי
  choice: голубка моя
  rationale: Прозрачная метафора оригинала сохранена без истолковывающей замены.
- source_word: תַמָּתִי
  choice: непорочная моя
  rationale: Слово выражает цельность, невинность или чистоту. «Непорочная» сохраняет нравственно-отношенческий оттенок, не сводя слово к абсолютному совершенству; варианты отмечены в сноске.
- source_word: שֶׁרֹּאשִׁי נִמְלָא טָל
  choice: ведь голова моя покрыта росой
  rationale: Причинная связь передана словом «ведь»; буквальное «наполнена росой» по-русски неестественно, тогда как «покрыта» ясно передаёт физический образ без усиления до «промокла насквозь».
- source_word: קְוּצּוֹתַי
  choice: кудри мои
  rationale: Слово обозначает пряди или локоны; «кудри» кратко и поэтично передаёт образ волос.
- source_word: רְסִיסֵי לָיְלָה
  choice: каплями ночи
  rationale: Близкая к форме оригинала передача сохраняет поэтический параллелизм с росой и не уточняет образ как туман или ночную росу.
