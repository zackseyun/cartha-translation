base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/006.yaml
  text: I opened to my beloved[a], but my beloved had turned away and gone. My soul went out when he spoke; I sought him, but I did not find him. I called him[b], but he did not answer me.
translation:
  language: ru
  text: Я отворила моему возлюбленному, но мой возлюбленный ускользнул и ушёл.[a] Душа моя изнемогла, когда он говорил.[b] Я искала его, но не нашла; звала его, но он мне не ответил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ускользнул и прошёл». В еврейском тексте стоят два глагола, подчёркивающие его уход.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «душа моя вышла, когда он говорил». Еврейский поэтический оборот выражает сильное душевное потрясение или изнеможение; возможен также перевод: «я была вне себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַחְתִּי אֲנִי לְדוֹדִי
  choice: Я отворила возлюбленному моему
  rationale: «Отворила» естественно подразумевает дверь из контекста и сохраняет поэтический регистр; отдельное אֲנִי слегка подчёркивает говорящую, что по-русски достаточно передаётся явным местоимением «я».
- source_word: וְדוֹדִי חָמַק עָבָר
  choice: но возлюбленный мой ускользнул и ушёл
  rationale: Союз передан противительно по контексту. Два еврейских глагола сохранены, чтобы передать подчёркнутое и окончательное удаление возлюбленного.
- source_word: נַפְשִׁי יָצְאָה
  choice: Душа моя замерла
  rationale: Буквальное «душа моя вышла» в современном русском легко воспринимается как указание на смерть. «Замерла» естественно передаёт сильное потрясение, не устраняя образ души; буквальный вариант отмечен в сноске.
- source_word: בְדַבְּרוֹ
  choice: когда он говорил
  rationale: Конструкция с בְּ и инфинитивом допускает временное прочтение. Несовершенный вид «говорил» сохраняет возможность отнесения к его словам или голосу, не уточняя сверх текста, было ли это воспоминание.
- source_word: בִּקַּשְׁתִּיהוּ וְלֹא מְצָאתִיהוּ
  choice: Я искала его, но не нашла
  rationale: «Искала» — современный и поэтически естественный эквивалент בקשׁ; «не нашла» точно передаёт отрицание, не добавляя оттенка невозможности.
- source_word: קְרָאתִיו וְלֹא עָנָנִי
  choice: звала его, но он мне не ответил
  rationale: «Звала его» естественнее русского «позвала его» в контексте продолжающихся поисков; «не ответил» сохраняет личный характер молчания.
