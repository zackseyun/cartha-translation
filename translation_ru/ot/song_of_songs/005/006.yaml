translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «возлюбленному моему / возлюбленный мой» поддерживает лирику Песни песней, оставаясь понятной современному читателю. В основном тексте сохранены оба глагола ухода и образ души, а трудная идиома разъяснена в сноске.
