  text: פָּשַׁ֨טְתִּי֙ אֶת כֻּתָּנְתִּ֔/י אֵיכָ֖כָה אֶלְבָּשֶׁ֑/נָּה רָחַ֥צְתִּי אֶת רַגְלַ֖/י אֵיכָ֥כָה אֲטַנְּפֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/003.yaml
  text: I have taken off my tunic—how can I put it on again? I have washed my feet—how can I soil them?[a][b]
translation:
  language: ru
  text: Я сняла свою тунику — как же мне снова надеть её? Я вымыла ноги — как же мне их запачкать?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как же мне их испачкать?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשַׁטְתִּי
  choice: Я сняла
  rationale: Глагол означает снять с себя одежду; естественное современное выражение сохраняет конкретный бытовой смысл.
- source_word: כֻּתָּנְתִּי
  choice: свою тунику
  rationale: כֻּתֹּנֶת — основная нательная одежда, близкая к тунике; этот вариант точнее общего «одежда» и не создаёт образа верхней мантии.
- source_word: אֵיכָכָה
  choice: как же мне
  rationale: Вопрос выражает не отсутствие возможности, а практическое возражение и нежелание; частица «же» естественно передаёт этот оттенок.
- source_word: אֶלְבָּשֶׁנָּה
  choice: снова надеть её
  rationale: Глагол значит «надеть», а суффикс женского рода отсылает к тунике; «снова» ясно передаёт подразумеваемое обратное действие.
- source_word: רָחַצְתִּי
  choice: Я вымыла
  rationale: Перфект обозначает завершённое действие, результат которого актуален в момент речи; в русском это естественно передаётся прошедшим совершенного вида.
- source_word: רַגְלַי
  choice: ноги
  rationale: Форма обозначает обе ноги; русский множественный эквивалент соответствует контексту.
- source_word: אֲטַנְּפֵם
  choice: их запачкать
  rationale: Пиэль טנף означает сделать грязными, запачкать; вариант сохраняет буквальный физический образ без привнесения ритуального или духовного «осквернения».
theological_decisions:
- issue: Толкование речи женщины
  choice: Передать слова как буквальное бытовое возражение, не вводя в основной текст эротический эвфемизм.
  alternative: Понимать одежду и ноги прежде всего как эротические метафоры.
  rationale: Непосредственная лексика стиха конкретна и относится к домашней обстановке. Возможная многослойность Песни песней остаётся открытой для толкования, но не должна навязываться переводом.
translation_notes:
  register: Современный литературный русский язык с мягкой поэтической интонацией. Сохранены параллельная структура двух возражений и конкретность бытовых образов; формулировки понятны без архаизации.
