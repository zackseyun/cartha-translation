    text: 'Или: «топазом» либо «хризолитом». Точно определить камень, названный еврейским словом תַּרְשִׁישׁ (таршиш), невозможно.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «его внутренности»; в этом описании тела имеется в виду живот. Еврейское выражение может обозначать обработанную слоновую кость, изделие или пластину из неё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָיו
  choice: руки его
  rationale: יָד обычно обозначает кисть или руку; прямое «руки» сохраняет конкретность поэтического описания, хотя здесь возможно и более широкое значение «предплечья».
- source_word: גְּלִילֵי זָהָב
  choice: золотые стержни
  rationale: גְּלִילִים обозначает округлые, цилиндрические формы. «Стержни» естественно передаёт вытянутый округлый образ; возможное понимание как «кольца» отмечено в сноске.
- source_word: מְמֻלָּאִים בַּתַּרְשִׁישׁ
  choice: инкрустированные бериллом
  rationale: В контексте ювелирного образа буквальное «наполненные» означает украшение вставленными камнями. Точная минералогическая идентификация תַּרְשִׁישׁ неизвестна, поэтому традиционно возможный «берилл» сопровождается сноской.
- source_word: מֵעָיו
  choice: живот его
  rationale: מֵעֶה может означать внутренности или живот. Последовательное описание тела здесь поддерживает конкретное телесное значение; «живот» точнее сохраняет его, чем расширяющее «тело».
- source_word: עֶשֶׁת שֵׁן
  choice: гладкая слоновая кость
  rationale: Редкое сочетание описывает обработанную, гладкую слоновую кость. Выбранная формулировка сохраняет образ материала и его искусной отделки, не навязывая конкретную форму предмета.
- source_word: מְעֻלֶּפֶת סַפִּירִים
  choice: усыпанная сапфирами
  rationale: Причастие передаёт покрытие или обложение поверхности; «усыпанная» естественно звучит в образе драгоценных камней и сохраняет зрительную насыщенность строки.
