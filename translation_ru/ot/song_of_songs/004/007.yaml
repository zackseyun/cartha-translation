lexical_decisions:
- source_word: כֻּלָּךְ
  choice: вся
  rationale: Форма с суффиксом 2-го лица женского рода охватывает женщину целиком; русское «вся» кратко, естественно и сохраняет эту всеохватность.
- source_word: יָפָה
  choice: прекрасна
  rationale: «Прекрасна» прямо передаёт утверждение о красоте и соответствует возвышенному, но современному поэтическому регистру Песни песней.
- source_word: רַעְיָתִי
  choice: возлюбленная моя
  rationale: В Песни песней слово служит нежным обращением к женщине. «Возлюбленная моя» сохраняет интимный и именной характер обращения без излишней разговорности.
- source_word: וּמוּם
  choice: изъяна
  rationale: מוּם обозначает телесный недостаток, порок или дефект; «изъян» естественен в поэтическом описании безупречной красоты и не сужает смысл до пятна.
- source_word: אֵין בָּךְ
  choice: нет в тебе
  rationale: Эта формулировка близко передаёт еврейскую отрицательную экзистенциальную конструкцию и звучит естественно по-русски.
