  register: Современный литературный русский с сохранением параллелизма и чувственной образности древнееврейской поэзии. Инверсия «Как алая нить — твои губы» поддерживает поэтический ритм, не создавая архаического звучания. «Уста» выбрано как умеренно возвышенное, но общепонятное слово.
