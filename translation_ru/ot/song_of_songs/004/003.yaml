base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/003.yaml
  text: Your lips are like a scarlet thread[a], and your mouth is lovely[c][b]. Your temples are like a slice of pomegranate behind your veil.
translation:
  language: ru
  text: 'Твои губы подобны алой нити,

    и прекрасны твои уста.[a]

    Твой висок подобен дольке граната,

    виднеющейся из-за твоей вуали.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и прекрасна твоя речь». Еврейское слово может обозначать речь или говорение, хотя в последовательном описании черт лица оно, вероятно, указывает на уста.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «виднеющийся сквозь твою вуаль». Слово, переведённое как «вуаль», в этом контексте спорно и может означать пряди волос.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּחוּט הַשָּׁנִי
  choice: как алая нить
  rationale: חוּט обозначает нить, шнур или верёвочку; «нить» передаёт тонкость образа. שָׁנִי — алый, багряный цвет; «алая» естественно и поэтично описывает цвет губ.
- source_word: שִׂפְתֹתַיִךְ
  choice: твои губы
  rationale: Форма обозначает две губы; современное русское соответствие — множественное число «губы».
- source_word: וּמִדְבָּרֵיךְ
  choice: твои уста
  rationale: Слово связано с речью и говорением, но в последовательном описании черт лица, вероятно, метонимически указывает на говорящие уста. «Уста» сохраняет телесный образ и достойный поэтический регистр; лексическая неоднозначность отмечена в сноске.
- source_word: נָאוֶה
  choice: прекрасны
  rationale: Слово означает «прекрасный, приятный, привлекательный»; «прекрасны» естественно для интимной поэзии и согласуется с русским множественным «уста».
- source_word: כְּפֶלַח הָרִמּוֹן
  choice: как долька граната
  rationale: פֶּלַח — часть, сегмент или долька; «долька граната» ясно передаёт образ разрезанного плода и звучит естественнее, чем буквальное «ломоть».
- source_word: רַקָּתֵךְ
  choice: твой висок
  rationale: רַקָּה обычно обозначает боковую часть головы — висок. Еврейская форма единственного числа сохранена, хотя по-русски в сходном описании возможно множественное «виски».
- source_word: מִבַּעַד לְצַמָּתֵךְ
  choice: за твоей вуалью
  rationale: מִבַּעַד может описывать вид из-за преграды или сквозь неё. צַמָּה традиционно понимается как вуаль или покрывало, однако может обозначать пряди волос; обе неоднозначности сохранены в сноске.
