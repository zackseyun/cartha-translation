  text: nard and saffron[a], calamus and cinnamon, with all the trees of frankincense, myrrh and aloes[e][d][c][b], with all the finest spices.
translation:
  language: ru
  text: 'нард и шафран,

    благовонный тростник[a] и корица,

    со всеми ладановыми деревьями[b],

    мирра и агаровая древесина[c],

    со всеми лучшими благовониями[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аир»; буквально: «тростник». Здесь имеется в виду ароматическое растение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «со всеми деревьями ладана».'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционно: «алоэ». Здесь имеется в виду не алоэ вера, а, вероятно, ароматная древесина агарового дерева.'
    reason: cultural_note
  - marker: d
    text: 'Буквально: «со всеми главными благовониями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵרְדְּ
  choice: нард
  rationale: Традиционное и точное название дорогого ароматического растения и получаемого из него благовония; в русском библейском и литературном употреблении слово узнаваемо.
- source_word: כַרְכֹּם
  choice: шафран
  rationale: Стандартное соответствие названию дорогой ароматической пряности.
- source_word: קָנֶה
  choice: благовонный тростник
  rationale: Основное значение слова — «тростник, камыш», но в перечне ароматов речь идёт о душистом растении. Перевод сохраняет образ тростника и поясняет его функцию; традиционное «аир» оставлено в сноске как возможная идентификация.
- source_word: קִנָּמוֹן
  choice: корица
  rationale: Общепринятое и естественное русское название этой пряности.
- source_word: עִם כָּל עֲצֵי לְבוֹנָה
  choice: со всеми ладановыми деревьями
  rationale: Передаёт буквально присутствующий в еврейском тексте образ деревьев, а не только получаемого из них ладана.
- source_word: מֹר
  choice: мирра
  rationale: Устоявшееся русское название ароматической смолы.
- source_word: אֲהָלוֹת
  choice: агаровая древесина
  rationale: В контексте древней парфюмерии слово, вероятнее всего, обозначает ароматную древесину агарового дерева, а не растение алоэ вера. Такой перевод предотвращает распространённое современное недоразумение.
- source_word: רָאשֵׁי בְשָׂמִים
  choice: лучшие благовония
  rationale: Буквально «главные/первые из благовоний»; идиоматически речь о самых отборных ароматических веществах.
