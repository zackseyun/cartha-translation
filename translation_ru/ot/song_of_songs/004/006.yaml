base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/006.yaml
  text: Until the day breathes and the shadows flee[b][a], I will go to the mountain of myrrh and to the hill of frankincense.
translation:
  language: ru
  text: Пока день не подышит[a] и тени не убегут, я пойду[b] к горе мирры и к холму ладана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пока день не повеет»; возможно также понимание: «Пока день не станет прохладным». Еврейский глагол буквально означает «дышать, веять» и может указывать как на вечерний ветер, так и на наступление рассвета.'
    reason: lexical_alternative
  - marker: b
    text: Буквально при глаголе «пойду» стоит местоимение «мне, для себя». Вероятно, это дательный заинтересованности, который усиливает личную вовлечённость говорящего и не требует отдельного перевода.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: Пока не
  rationale: В сочетании с последующими глаголами естественно передаёт временной предел действия, выраженный еврейским עַד.
- source_word: שֶׁיָּפוּחַ
  choice: повеет
  rationale: Глагол פוח означает «дышать, веять, дуть». «День повеет» сохраняет поэтическое олицетворение и не решает однозначно, идёт ли речь о вечерней прохладе или наступлении рассвета.
- source_word: הַיּוֹם
  choice: день
  rationale: Прямое соответствие существительному с артиклем; в сочетании с «повеет» сохраняет образность оригинала.
- source_word: וְנָסוּ
  choice: и … не убегут
  rationale: נוס буквально означает «бежать, спасаться бегством». «Убегут» сохраняет живую метафору, тогда как «исчезнут» было бы более истолковывающим.
- source_word: הַצְּלָלִים
  choice: тени
  rationale: Обычное и естественное соответствие צְלָלִים в данном поэтическом контексте.
- source_word: אֵלֶךְ לִי
  choice: я пойду
  rationale: אֵלֶךְ — форма первого лица «я пойду»; לִי представляет собой дательный заинтересованности или усиления, который по-русски лучше не передавать отдельным словом в основном тексте, чтобы не привнести оттенок беспечности выражением «пойду себе».
- source_word: אֶל
  choice: к
  rationale: Естественно передаёт направительное значение предлога перед обозначениями возвышенностей.
- source_word: הַר הַמּוֹר
  choice: гора мирры
  rationale: Формально сохраняет конструкцию принадлежности и конкретный образ благовонной смолы, не истолковывая его аллегорически.
- source_word: גִּבְעַת הַלְּבוֹנָה
  choice: холм ладана
  rationale: Передаёт различие между הַר «гора» и גִּבְעָה «холм»; לְבוֹנָה обозначает именно ладан.
theological_decisions:
- issue: Следует ли раскрывать образ горы мирры и холма ладана как аллегорию или эротическую метафору
  choice: Сохранить буквальные поэтические образы без поясняющего истолкования в основном тексте
  alternative: Передать их как прямое указание на тело возлюбленной либо как символ места поклонения или уединения
  rationale: Еврейский текст оставляет референт образов неуточнённым. Буквальная передача сохраняет намеренную образность и богословско-поэтическую многозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. «Повеет» выбрано как естественное, но не чрезмерно архаичное слово; пара «гора — холм» и названия благовоний переданы последовательно.
