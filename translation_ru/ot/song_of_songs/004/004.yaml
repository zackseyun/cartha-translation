base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/004.yaml
  text: Your neck is like the tower of David[a], built in rows of stone; a thousand shields hang on it[b], all the small shields of the warriors.
translation:
  language: ru
  text: Шея твоя — как башня Давида, сложенная рядами камней[a]; тысяча щитов висит на ней — все щиты воинов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «построенная для оружейных запасов», «с зубцами» или «сложенная рядами». Еврейское слово תַלְפִּיּוֹת встречается редко, и его точное значение неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте употреблены два разных слова для защитного вооружения: מָגֵן и שֶׁלֶט. Точное значение второго слова неясно; оба здесь переданы словом «щиты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִגְדַּל דָּוִיד
  choice: как башня Давида
  rationale: 'Префикс כְּ передаёт сравнение, а сочетание с именем Давида естественно переводится определённо: «башня Давида».'
- source_word: צַוָּארֵךְ
  choice: шея твоя
  rationale: Прямой перевод образа; порядок слов сохраняет возвышенный поэтический строй и остаётся естественным для русского языка.
- source_word: בָּנוּי לְתַלְפִּיּוֹת
  choice: сложенная рядами камня
  rationale: בָּנוּי — страдательное причастие «построенная, сложенная». Редкое תַלְפִּיּוֹת имеет неясное значение; основной вариант передаёт архитектурный образ, не утверждая предположительное военное назначение башни.
- source_word: אֶלֶף הַמָּגֵן
  choice: тысяча щитов
  rationale: Единственное число с числительным имеет собирательный смысл; по-русски требуется множественное «щитов».
- source_word: תָּלוּי עָלָיו
  choice: висит на ней
  rationale: Причастная форма рисует устойчивую зрительную картину. Местоимение согласовано в русском с существительным «башня».
- source_word: שִׁלְטֵי הַגִּבּוֹרִים
  choice: малые щиты воинов
  rationale: שֶׁלֶט обозначает разновидность защитного вооружения, вероятно щит, и отличается от מָגֵן. «Малые щиты» сохраняет это лексическое различие, а גִּבּוֹרִים в военном контексте естественно передано как «воины».
