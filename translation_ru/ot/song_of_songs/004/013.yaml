  text: Your shoots are an orchard of pomegranates with choice fruits, henna with nards.
translation:
  language: ru
  text: Твои побеги — гранатовый сад с отборными плодами, хной и нардами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלָחַיִךְ
  choice: твои побеги
  rationale: В данном образе слово обозначает то, что произрастает или пускает побеги; «побеги» естественно связывает его с последующим образом сада, не конкретизируя растение.
- source_word: פַּרְדֵּס רִמּוֹנִים
  choice: гранатовый сад
  rationale: פַּרְדֵּס — сад или плодовый сад, а רִמּוֹנִים — гранаты; сочетание передано естественной русской конструкцией.
- source_word: פְּרִי מְגָדִים
  choice: отборными плодами
  rationale: מְגָדִים указывает на нечто превосходное, ценное и желанное; «отборные» сохраняет качественную оценку и подходит к плодам.
- source_word: כְּפָרִים
  choice: хной
  rationale: Множественное число относится к растениям или соцветиям хны; в русском языке название растения естественно употребляется как собирательное.
- source_word: נְרָדִים
  choice: нардами
  rationale: Сохранено множественное число исходного текста; «нард» — традиционное и точное название ароматического растения и получаемого из него благовония.
