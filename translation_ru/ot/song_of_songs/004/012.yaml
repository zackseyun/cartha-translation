  text: A locked garden is my sister[a], my bride; a locked spring[b], a sealed fountain.
translation:
  language: ru
  text: Запертый сад — сестра моя, невеста; запертый источник[a], запечатанный родник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «источник», в других контекстах может означать «груда» или «вал», но здесь параллель с «родником» указывает на источник воды.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּן
  choice: сад
  rationale: Основное значение — «сад»; значение недоступности передано следующим причастием נָעוּל, поэтому добавлять к существительному определение «огороженный» не требуется.
- source_word: נָעוּל
  choice: запертый
  rationale: Страдательное причастие обозначает нечто закрытое или запертое. «Запертый» ярко передаёт ограниченный доступ; повтор сохранён в соответствии с еврейским текстом.
- source_word: אֲחֹתִי
  choice: сестра моя
  rationale: Буквальное родственное наименование сохранено как характерное для поэтического обращения в Песни песней.
- source_word: כַלָּה
  choice: невеста
  rationale: Существительное означает «невеста». В русском приложении после «сестра моя» притяжательность естественно распространяется на оба обращения без обязательного повторения «моя».
- source_word: גַּל
  choice: источник
  rationale: Хотя данная форма в других местах может означать «груда» или «вал», параллелизм с מַעְיָן здесь убедительно указывает на источник воды.
- source_word: מַעְיָן
  choice: родник
  rationale: Слово обозначает источник воды. «Родник» сохраняет водный образ и поэтический параллелизм, не создавая неестественного повтора слова «источник».
- source_word: חָתוּם
  choice: запечатанный
  rationale: Прямо передаёт образ источника, закрытого печатью, и сохраняет отличие от повторённого «запертый».
