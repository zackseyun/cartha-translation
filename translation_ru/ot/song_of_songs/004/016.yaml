  text: ע֤וּרִי צָפוֹן֙ וּ/ב֣וֹאִי תֵימָ֔ן הָפִ֥יחִי גַנִּ֖/י יִזְּל֣וּ בְשָׂמָ֑י/ו יָבֹ֤א דוֹדִ/י֙ לְ/גַנּ֔/וֹ וְ/יֹאכַ֖ל פְּרִ֥י מְגָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/016.yaml
  text: Awake[a], north wind, and come, south wind! Blow on my garden, so that its spices may flow[c][b]. Let my beloved come into his garden and eat its choice fruits.
translation:
  language: ru
  text: Пробудись, северный ветер[a], и приди, южный ветер! Овей мой сад, чтобы струились его благовония[b]. Пусть мой возлюбленный придёт в свой сад[c] и поест его отборных плодов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «север» и «юг». Слово «ветер» добавлено по смыслу: к сторонам света обращаются как к силам, способным веять над садом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы струился его аромат». Еврейское слово может обозначать как ароматические вещества и пряности, так и исходящий от них запах.'
    reason: lexical_alternative
  - marker: c
    text: Переход от «моего сада» к саду возлюбленного присутствует в еврейском тексте и, вероятно, выражает взаимную принадлежность в образном языке влюблённых.
    reason: cross_reference
lexical_decisions:
- source_word: ע֤וּרִי
  choice: Пробудись
  rationale: Повелительная форма передаёт яркое поэтическое обращение; женский род еврейской формы невозможно естественно воспроизвести при русском существительном мужского рода «ветер».
- source_word: צָפוֹן / תֵימָן
  choice: северный ветер / южный ветер
  rationale: Буквально это «север» и «юг», но направления олицетворены, к ним обращаются и велят дуть на сад; добавление слова «ветер» проясняет подразумеваемый смысл.
- source_word: וּב֣וֹאִי
  choice: и приди
  rationale: Сохраняет простое значение повелительной формы «приходить», не перенося сюда значение следующего глагола «дуть».
- source_word: הָפִ֥יחִי
  choice: овей
  rationale: Естественно описывает действие ветра над садом и сохраняет образ дуновения; единственное число соответствует еврейской форме.
- source_word: גַנִּ֖י
  choice: мой сад
  rationale: Прямо передаёт форму с притяжательным суффиксом первого лица и сохраняет метафору говорящей.
- source_word: יִזְּל֣וּ
  choice: чтобы струились
  rationale: Глагол обозначает течение или истечение; конструкция с «чтобы» естественно выражает желаемый результат повеления.
- source_word: בְשָׂמָ֑יו
  choice: его благовония
  rationale: Слово обозначает ароматические вещества, пряности либо производимый ими аромат. «Благовония» удерживает связь как с веществами, так и с распространяющимся запахом.
- source_word: יָבֹ֤א
  choice: пусть ... придёт
  rationale: Конструкция с «пусть» ясно передаёт волитивный оттенок еврейской формы.
- source_word: דוֹדִי
  choice: мой возлюбленный
  rationale: Естественное и достойное обозначение любимого мужчины в любовной поэзии, сохраняющее нежность обращения.
- source_word: לְגַנּוֹ
  choice: в свой сад
  rationale: Возвратное притяжательное местоимение ясно показывает, что сад принадлежит грамматическому субъекту — возлюбленному, и сохраняет переход от «моего сада» к «своему саду».
- source_word: וְיֹאכַ֖ל
  choice: и ест
  rationale: Сохраняет буквальный образ еды и параллельное пожелание, не заменяя его истолковывающим «наслаждается».
- source_word: פְּרִ֥י מְגָדָֽיו
  choice: его отборные плоды
  rationale: «Отборные» передаёт ценность и желанность плодов без добавления отсутствующей в еврейском превосходной степени.
theological_decisions:
- issue: Чувственная садовая метафора и смена притяжательных форм
  choice: Сохранить чувственный поэтический образ без явного аллегорического истолкования и передать переход от «моего сада» к «своему саду» возлюбленного.
  alternative: Истолковать сад как богословскую аллегорию либо сгладить смену принадлежности ради стилистической однородности.
  rationale: Еврейский текст непосредственно использует интимную любовную образность. Перевод не должен ни подавлять её, ни вводить не выраженную здесь конфессиональную аллегорию; смена притяжательных форм важна для образа взаимной принадлежности влюблённых.
translation_notes:
  register: Современный литературный русский язык с поэтическим, но понятным строем. Повеления краткие и возвышенные без архаизмов; чувственность оригинала сохранена без усиления и без аллегоризации.
