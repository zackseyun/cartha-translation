base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/008.yaml
  text: Come with me from Lebanon[a], my bride; with me from Lebanon, come. Look from the summit of Amanah, from the summit of Senir and Hermon, from lions’ dens[b], from mountains of leopards.
translation:
  language: ru
  text: 'Иди со мною с Ливана, невеста,

    со мною с Ливана иди!

    Взгляни[a] с вершины Аманы,

    с вершины Сенира[b] и Ермона,

    от львиных логовищ,

    с гор леопардов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сойди». Значение еврейского глагола здесь не вполне ясно: он может описывать взгляд с горных высот либо уход с них.'
    reason: lexical_alternative
  - marker: b
    text: Сенир — древнее название части горного массива Ермон.
    reason: cultural_note
lexical_decisions:
- source_word: אִתִּי מִלְּבָנוֹן
  choice: со мною с Ливана
  rationale: Предлог אֵת с суффиксом означает «со мною», а מִן указывает на исходную точку — «с Ливана». Повтор сохранён как поэтическое усиление призыва.
- source_word: כַּלָּה
  choice: невеста
  rationale: В обращении слово обозначает возлюбленную как невесту. Русская форма не требует добавления притяжательного местоимения, поскольку близость отношений ясна из контекста.
- source_word: תָּבוֹאִי
  choice: иди
  rationale: Хотя форма морфологически может выражать будущее, в этом контексте она имеет побудительную силу. «Иди» естественно передаёт приглашение и согласуется с направлением движения «с Ливана».
- source_word: תָּשׁוּרִי
  choice: взгляни
  rationale: Редкий и трудный глагол здесь может означать взгляд с высоты; именно это значение принято в основном тексте. Возможное понимание как движения вниз сохранено в сноске.
- source_word: מֵרֹאשׁ
  choice: с вершины
  rationale: Буквально «от головы»; применительно к горе естественный русский эквивалент — «с вершины».
- source_word: אֲמָנָה
  choice: Амана
  rationale: Географическое название передано русской транслитерацией.
- source_word: שְׂנִיר
  choice: Сенир
  rationale: Древнее географическое название передано русской транслитерацией.
- source_word: חֶרְמוֹן
  choice: Ермон
  rationale: Использована традиционная и узнаваемая русская форма библейского географического названия.
- source_word: מִמְּעֹנוֹת אֲרָיוֹת
  choice: от львиных логовищ
  rationale: מְעוֹנוֹת обозначает места обитания или логовища. Формулировка сохраняет образ опасной дикой местности и предлог исходной точки.
- source_word: מֵהַרְרֵי נְמֵרִים
  choice: с гор, где водятся леопарды
  rationale: Идиоматическая русская передача конструкции «горы леопардов» сохраняет образ и ясно обозначает горы как место обитания животных.
