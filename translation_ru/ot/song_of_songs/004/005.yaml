- source_word: תְּאוֹמֵי
  choice: близнецы
  rationale: Форма означает «близнецы» и подчёркивает сходство и парность двух детёнышей.
- source_word: צְבִיָּה
  choice: газели
  rationale: Женская форма обозначает самку газели или близкое оленевидное животное. «Газель» соответствует повторяющейся образности Песни песней, а более широкая возможность отражена в сноске.
- source_word: הָרֹעִים
  choice: пасущиеся
  rationale: Причастие от רעה описывает животных, которые кормятся на пастбище; «пасущиеся» сохраняет живой пасторальный образ.
- source_word: בַּשּׁוֹשַׁנִּים
  choice: среди лилий
  rationale: Традиционное и вероятное значение שׁוֹשַׁנִּים — «лилии»; «среди» естественно передаёт нахождение животных в цветущей растительности.
