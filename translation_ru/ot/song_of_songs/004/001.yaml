base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/001.yaml
  text: Look[a], you are beautiful, my darling; look, you are beautiful. Your eyes are doves behind your veil[b]. Your hair is like a flock of goats streaming down from Mount Gilead.
translation:
  language: ru
  text: Вот ты прекрасна, любимая моя, вот ты прекрасна! Глаза твои — голуби за твоим покрывалом[a]. Волосы твои — как стадо коз, спускающихся с горы Галаад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сквозь твоё покрывало». Еврейское выражение указывает на глаза, видимые из-за или сквозь частично скрывающий их покров. Слово, переведённое как «покрывало», можно также понимать как «локоны» или «коса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: Вот ты
  rationale: Передаёт указательно-восклицательную силу частицы הִנֵּה с суффиксом 2-го лица женского рода естественным современным русским оборотом.
- source_word: יָפָה
  choice: прекрасна
  rationale: Прямое и поэтически достойное обозначение красоты без архаизации.
- source_word: רַעְיָתִי
  choice: любимая моя
  rationale: В Песни песней это нежное обращение к возлюбленной; такой перевод сохраняет близость и высокий поэтический регистр.
- source_word: עֵינַיִךְ יוֹנִים
  choice: Глаза твои — голуби
  rationale: Сохранена сильная бессоюзная метафора еврейского текста без поясняющего «как».
- source_word: מִבַּעַד לְצַמָּתֵךְ
  choice: за твоей фатой
  rationale: Предлог указывает на взгляд из-за или сквозь частично скрывающий покров; «за» естественно сочетается с наиболее вероятным пониманием спорного существительного.
- source_word: שַׂעְרֵךְ
  choice: Волосы твои
  rationale: Прямой современный эквивалент.
- source_word: כְּעֵדֶר הָעִזִּים
  choice: как стадо коз
  rationale: Сохраняет пасторальное сравнение; по-русски коз обычно называют стадом.
- source_word: שֶׁגָּלְשׁוּ
  choice: сбегающее
  rationale: Передаёт движение вниз и одновременно поддерживает живой образ стада; причастие согласовано с собирательным существительным «стадо».
- source_word: מֵהַר גִּלְעָד
  choice: с горы Галаадской
  rationale: Сохраняет единичное «гора Галаада» в естественной для русской библейской географии форме.
