lexical_decisions:
- source_word: לִבַּבְתִּנִי
  choice: ты пленила моё сердце
  rationale: Редкий глагол לבב здесь описывает сильное воздействие возлюбленной на сердце говорящего. Выражение «пленила моё сердце» естественно для современной русской поэзии и сохраняет эмоциональную силу и повтор исходного текста.
- source_word: אֲחֹתִי
  choice: сестра моя
  rationale: Буквальный перевод сохраняет характерное для Песни песней ласковое обращение, не утверждая в данном контексте биологического родства.
- source_word: כַלָּה
  choice: невеста
  rationale: Слово обозначает невесту или молодую жену. В сочетании с «сестра моя» форма обращения без повторения местоимения звучит по-русски естественно и сохраняет брачный оттенок.
- source_word: בְאֶחָד מֵעֵינַיִךְ
  choice: одним взглядом своих глаз
  rationale: Буквальная конструкция «одним из твоих глаз» неоднозначна и по-русски может ошибочно означать один глаз. «Одним взглядом своих глаз» передаёт наиболее вероятный поэтический смысл — единственный взгляд.
- source_word: בְּאַחַד עֲנָק מִצַּוְּרֹנָיִךְ
  choice: одним украшением на своей шее
  rationale: עֲנָק означает шейное украшение или цепь, а редкая форма צַוְּרֹנַיִךְ связана с шеей и допускает понимание украшений на ней. Перевод сохраняет образ, не уточняя без достаточных оснований, идёт ли речь об отдельной драгоценности, цепочке или ожерелье.
