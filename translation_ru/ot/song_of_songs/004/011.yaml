lexical_decisions:
- source_word: נֹפֶת
  choice: сотовый мёд
  rationale: Передаёт более конкретное значение текущего мёда из сот и сохраняет отличие от общего דְּבַשׁ далее в стихе.
- source_word: תִּטֹּפְנָה
  choice: струится
  rationale: Глагол обозначает стекание каплями; «струится» естественно и поэтично сочетается в русском языке с мёдом и устами.
- source_word: שִׂפְתוֹתַיִךְ
  choice: твои уста
  rationale: «Уста» сохраняет точное значение и соответствует возвышенному, но понятному регистру любовной поэзии.
- source_word: כַּלָּה
  choice: невеста
  rationale: Прямой и естественный эквивалент обращения к возлюбленной в брачной образности Песни песней.
- source_word: דְּבַשׁ וְחָלָב
  choice: мёд и молоко
  rationale: Сохраняет порядок слов еврейского текста и не подменяет его привычной формулой «молоко и мёд».
- source_word: תַּחַת לְשׁוֹנֵךְ
  choice: под твоим языком
  rationale: Прямо и естественно сохраняет конкретный чувственный образ оригинала.
- source_word: רֵיחַ
  choice: благоухание
  rationale: В положительном поэтическом контексте передаёт приятный аромат и поддерживает достойный литературный регистр.
- source_word: שַׂלְמֹתַיִךְ
  choice: твоих одежд
  rationale: Точно обозначает одежду во множественном числе без излишнего уточнения вида одеяния.
- source_word: כְּרֵיחַ לְבָנוֹן
  choice: как благоухание Ливана
  rationale: Сохраняет географический и поэтический образ оригинала, не сводя его к одному предполагаемому источнику аромата.
