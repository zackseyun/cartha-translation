base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/010.yaml
  text: How beautiful your love is[a], my sister, my bride! How much better your love is than wine[b], and the fragrance of your oils than all spices!
translation:
  language: ru
  text: Как прекрасны твои ласки[a], сестра моя, невеста! Насколько твои ласки лучше вина, а аромат твоих масел[b] — лучше всех благовоний!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоя любовь» — в обоих случаях. Еврейское דֹדַיִךְ может означать любовь, выражаемую в телесной нежности и ласках.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеются в виду ароматические масла или благовонные мази.
    reason: cultural_note
lexical_decisions:
- source_word: מַה יָּפוּ
  choice: Как прекрасны
  rationale: Восклицательное מַה выражает восхищение, а форма множественного числа יָפוּ согласуется с דֹדַיִךְ. Такая передача естественна для современной русской поэзии.
- source_word: דֹדַיִךְ
  choice: твои ласки
  rationale: В Песни песней דּוֹדִים может обозначать любовь, любовные проявления или ласки. «Ласки» сохраняют множественное число и уместный здесь чувственно-конкретный оттенок, не делая выражение чрезмерно откровенным; вариант «твоя любовь» отмечен в сноске.
- source_word: אֲחֹתִי כַלָּה
  choice: сестра моя, невеста
  rationale: Оба обращения сохранены отдельно, как в еврейском тексте. «Сестра» здесь выступает как нежное обращение к возлюбленной, а не как пояснение родства.
- source_word: מַה טֹּבוּ
  choice: Как хороши
  rationale: Восклицательная конструкция параллельна первой строке; «хороши» прямо передаёт טוֹב и подводит к сравнению с вином.
- source_word: מִיַּיִן
  choice: лучше вина
  rationale: Предлог מִן выражает сравнение; слово «лучше» восполняется в русском по смыслу сравнительной конструкции.
- source_word: וְרֵיחַ
  choice: а благоухание
  rationale: רֵיחַ означает запах или аромат. «Благоухание» соответствует положительному поэтическому контексту, а союз «а» естественно вводит параллельный образ.
- source_word: שְׁמָנַיִךְ
  choice: твоих масел
  rationale: Сохранён конкретный образ масел; в данном контексте, вероятно, имеются в виду ароматические масла или благовонные мази, что поясняется в сноске.
- source_word: מִכָּל בְּשָׂמִים
  choice: лучше всех благовоний
  rationale: בְּשָׂמִים обозначает ароматические вещества, пряности или благовония. «Благовония» здесь естественно сочетаются с благоуханием масел и сохраняют сравнительный смысл מִן.
