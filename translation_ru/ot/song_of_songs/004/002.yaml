  source_fidelity: 'Основной образ передан верно: зубы сопоставлены со стадом остриженных овец, вышедших после мытья; далее последовательно сохранены образы двойни и отсутствия овцы, лишившейся детёныша. «Вышедших после мытья» точнее передаёт עָלוּ מִן («поднялись/вышли от, после») и естественнее по-русски, чем «поднявшихся после мытья».'
