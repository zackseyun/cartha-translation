base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/002.yaml
  text: Your teeth are like a flock of shorn ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: ru
  text: 'Зубы твои — словно стадо остриженных овец, вышедших после мытья: все они приносят по двойне[a], и среди них нет ни одной, лишившейся детёныша[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все они расположены парами». Еврейское слово допускает образ двойни и одновременно указывает на парность зубов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально речь по-прежнему идёт об овцах: среди них нет ни одной, лишившейся детёныша. В сравнении это подразумевает, что ни одного зуба не недостаёт.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: зубы твои
  rationale: Прямо передаёт обращение к женщине и не добавляет отсутствующего в еврейском тексте сравнения со слоновой костью.
- source_word: כְּעֵדֶר הַקְּצוּבוֹת
  choice: словно стадо остриженных овец
  rationale: Сохраняет пастушеское сравнение; «овец» естественно восполняет подразумеваемое существительное, а женские формы далее в стихе поддерживают образ овец-маток.
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: поднявшихся после мытья
  rationale: Передаёт конкретный образ чистых овец, поднявшихся после мытья, без превращения метафоры в прямое описание белизны зубов.
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: все они приносят двойни
  rationale: Сохраняет овечий образ и возможный смысл рождения двойни; одновременно сравнение подразумевает полный ряд зубов, совпадающих попарно.
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: и нет среди них ни одной, потерявшей ягнёнка
  rationale: Сохраняет буквальный образ лишившейся детёныша овцы и не подменяет его сразу истолкованием о недостающем зубе.
