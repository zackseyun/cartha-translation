  yaml_path: translation/ot/song_of_songs/004/015.yaml
  text: A spring of gardens[a], a well of living water[c][b], and streams flowing from Lebanon.
translation:
  language: ru
  text: Источник садов[a], колодец живой воды[b] и потоки, текущие с Ливана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родник садов». Еврейское слово может означать природный источник или родник.'
    reason: lexical_alternative
  - marker: b
    text: «Живая вода» — древнееврейское выражение, означающее свежую, текущую, а не стоячую воду.
    reason: cultural_note
lexical_decisions:
- source_word: מַעְיַן
  choice: источник
  rationale: Еврейское слово обозначает природный источник, ключ или место выхода воды. «Источник» естественно звучит по-русски и сохраняет водный образ.
- source_word: גַּנִּים
  choice: садов
  rationale: Сохранено явное множественное число еврейского текста.
- source_word: בְּאֵר
  choice: колодец
  rationale: Обычное значение существительного — «колодец»; «водоём» или «цистерна» могли бы ошибочно подразумевать стоячую запасённую воду.
- source_word: מַיִם חַיִּים
  choice: живая вода
  rationale: Сохранено устойчивое древнееврейское образное выражение, обозначающее свежую, текущую воду.
- source_word: וְנֹזְלִים
  choice: и потоки, текущие
  rationale: Причастие передаёт движение воды; существительное «потоки» восполняется по контексту и согласуется с формой множественного числа.
- source_word: מִן־לְבָנוֹן
  choice: с Ливана
  rationale: Предлог обозначает происхождение или направление от Ливана; русское «с Ливана» естественно передаёт движение воды с горной местности.
