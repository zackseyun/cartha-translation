    reason: lexical_alternative
  - marker: b
    text: 'Или: «пряное вино». Имеется в виду вино, смешанное, вероятно, с водой или пряностями.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «Твоя утроба — груда пшеницы», если понимать слово как обозначение внутренней части тела; однако в данном контексте вероятнее значение «живот».'
