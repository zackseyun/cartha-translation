base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/005.yaml
  text: Your neck is like a tower of ivory[a]; your eyes are pools in Heshbon, by the gate of Bath-rabbim. Your nose is like the tower of Lebanon[c][b], looking toward Damascus.
translation:
  language: ru
  text: 'Шея твоя — словно башня из слоновой кости;

    глаза твои — пруды в Хешбоне,

    у ворот Бат-Раббим[a].


    Нос твой[b] — словно башня Ливана,

    обращённая к Дамаску[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «у ворот многолюдного города» или «у ворот многих». Еврейское выражение «Бат-Раббим» может быть названием места либо иметь описательное значение.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте: «нос». Поэтический образ, вероятно, восхваляет благородный профиль возлюбленной.'
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «смотрящая на Дамаск» или «возвышающаяся над Дамаском».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוָּארֵךְ
  choice: шея твоя
  rationale: Существительное обозначает шею; это прямой и естественный перевод в контексте поэтического описания возлюбленной.
- source_word: כְּמִגְדַּל הַשֵּׁן
  choice: словно башня из слоновой кости
  rationale: הַשֵּׁן в данном сочетании обозначает слоновую кость, а не буквально «зуб»; сравнительная конструкция передана без добавления отсутствующих в тексте характеристик.
- source_word: עֵינַיִךְ בְּרֵכוֹת
  choice: глаза твои — словно пруды
  rationale: בְּרֵכוֹת обозначает пруды, бассейны или водоёмы. «Пруды» сохраняет образ спокойной, отражающей свет воды; слово «словно» добавлено по-русски как естественное продолжение сравнения.
- source_word: בְּחֶשְׁבּוֹן
  choice: в Хешбоне
  rationale: Название места передано транслитерацией, близкой к еврейской форме.
- source_word: עַל שַׁעַר בַּת רַבִּים
  choice: у ворот Бат-Раббима
  rationale: Фраза, вероятнее всего, содержит топоним; поскольку её точное значение неясно, в основном тексте сохранено название, а описательные варианты вынесены в примечание.
- source_word: אַפֵּךְ
  choice: нос твой
  rationale: Прямое значение слова здесь — «нос». Более общее «лицо» устранило бы конкретный образ оригинала.
- source_word: כְּמִגְדַּל הַלְּבָנוֹן
  choice: словно башня Ливана
  rationale: Конструкция буквально указывает на «башню Ливана»; перевод сохраняет возможную отсылку к известной или поэтически представленной башне.
- source_word: צוֹפֶה פְּנֵי דַמָּשֶׂק
  choice: обращённая к Дамаску
  rationale: Причастие выражает направленность дозорной башни в сторону Дамаска. Формулировка естественна по-русски и не исключает оттенка наблюдения.
