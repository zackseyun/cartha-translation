base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/001.yaml
  text: Return[a], return, O Shulammite; return, return, that we may look at you[b]. Why do you look at the Shulammite as at the dance of Mahanaim?
translation:
  language: ru
  text: Вернись, вернись, Суламита! Вернись, вернись, чтобы мы посмотрели на тебя. Почему вы смотрите на Суламиту, словно на танец Маханаима?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст последнего вопроса труден. Возможен также перевод: «Что вы видите в Суламите? — Нечто подобное танцу Маханаима». Маханаим, вероятно, название места; само это название может означать «два стана».'
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוּבִי
  choice: Вернись
  rationale: Повелительная форма женского рода единственного числа от שוב. «Вернись» естественно передаёт повторный призыв, не уточняя, идёт ли речь о физическом возвращении или о возобновлении близости.
- source_word: הַשּׁוּלַמִּית
  choice: Суламита
  rationale: 'Транслитерация сохраняет неоднозначность обозначения: это может быть происхождение, имя или поэтический титул.'
- source_word: וְנֶחֱזֶה בָּךְ
  choice: чтобы мы могли посмотреть на тебя
  rationale: Форма первого лица множественного числа после повторных императивов выражает цель; нейтральный глагол «посмотреть» сохраняет зрительный образ без усиления до «любоваться».
- source_word: מַה תֶּחֱזוּ
  choice: Что вы разглядываете
  rationale: מַה передано своим обычным значением «что», а חזה — глаголом зрительного восприятия. Русская конструкция намеренно сохраняет поэтическую трудность и допускает смысл «что вы находите/видите в Суламите?», не превращая вопрос безоговорочно в «почему».
- source_word: כִּמְחֹלַת
  choice: словно танец
  rationale: Предлог כ выражает сравнение; «словно танец» естественно воспроизводит образ, хотя точная синтаксическая связь второй половины строки остаётся спорной.
- source_word: הַמַּחֲנָיִם
  choice: Маханаима
  rationale: Форма, вероятнее всего, является топонимом Маханаим; перевод как «два стана» перенесён в примечание, чтобы не устранять возможную игру значения.
