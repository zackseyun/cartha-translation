  text: Пойдём, мой любимый, выйдем в поля, переночуем в селениях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди цветов хны». Еврейское слово можно связать с названием растения, упомянутого в Песн. 1:14; однако здесь, рядом с упоминанием полей и ночлега, вероятнее значение «селения».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכָה
  choice: Пойдём
  rationale: Императив от הלך здесь служит приглашением отправиться вместе; «Пойдём» естественно передаёт призыв, согласуясь с последующими формами совместного намерения.
- source_word: דוֹדִי
  choice: мой любимый
  rationale: Устойчивое поэтическое обращение к возлюбленному; форма мужского рода соответствует говорящей женщине и сохраняет теплоту оригинала.
- source_word: נֵצֵא
  choice: выйдем
  rationale: Когортатив первого лица множественного числа выражает совместное намерение; «выйдем» сохраняет значение выхода из нынешнего места.
- source_word: הַשָּׂדֶה
  choice: в поля
  rationale: Существительное в единственном числе может обозначать открытую сельскую местность собирательно; русское «в поля» звучит естественно и поэтично.
- source_word: נָלִינָה
  choice: заночуем
  rationale: Когортатив от לון/לין означает остаться или провести ночь; «заночуем» кратко и естественно передаёт этот смысл.
- source_word: בַּכְּפָרִים
  choice: среди селений
  rationale: По контексту наиболее вероятно значение «в селениях/среди селений»; «селения» сохраняет сельский колорит и поэтический регистр.
