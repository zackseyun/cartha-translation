- source_word: תָּאֳמֵי צְבִיָּה
  choice: близнецы газели
  rationale: 'Передаёт сочетание в сопряжённом состоянии: два детёныша являются близнецами, рождёнными одной самкой. צְבִיָּה — форма женского рода, обычно обозначающая самку газели, хотя возможно более общее понимание как самки оленевого животного.'
