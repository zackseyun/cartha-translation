base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/014.yaml
  text: The mandrakes give off fragrance[a], and at our doorways are all choice fruits, new as well as old, which I have stored up for you[b], my beloved.
translation:
  language: ru
  text: Мандрагоры источают аромат[a], и у наших дверей — всевозможные отборные плоды[b], новые и старые. Я припасла их для тебя, мой любимый.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любовные яблоки» — образное наименование мандрагор, связанное с их традиционной ассоциацией с любовью и плодородием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всевозможные лакомства»; возможен также смысл «всевозможные драгоценности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּדָאִים
  choice: мандрагоры
  rationale: Прямое и общепринятое название растения; сохраняет связь библейского образа с любовью и плодородием без внесения этого толкования в основной текст.
- source_word: נָתְנוּ רֵיחַ
  choice: источают аромат
  rationale: Естественно передаёт буквальное «дают запах» и живую поэтическую картину; перфект в контексте допускает описание наступившего состояния.
- source_word: וְעַל פְּתָחֵינוּ
  choice: и у наших дверей
  rationale: Пֶתַח означает вход или дверной проём; сочетание с עַל здесь естественно передаётся пространственным «у», не навязывая буквального «над».
- source_word: כָּל מְגָדִים
  choice: всевозможные отборные плоды
  rationale: Мְגָדִים может обозначать драгоценные дары, лакомства или лучшие плоды; в растительном и чувственном окружении «отборные плоды» уместно, а маркер כָּל передан словом «всевозможные».
- source_word: חֲדָשִׁים גַּם יְשָׁנִים
  choice: новые и старые
  rationale: Сохраняет контраст и добавочную силу גַּם в краткой, естественной русской форме.
- source_word: דּוֹדִי
  choice: мой любимый
  rationale: Современное, поэтически достойное обращение к возлюбленному; грамматический род говорящего определяется женской формой צָפַנְתִּי лишь контекстуально, тогда как адресат обозначен мужской формой לָךְ в масоретской вокализации.
- source_word: צָפַנְתִּי לָךְ
  choice: Я сберегла их для тебя
  rationale: Передаёт значение «запасти, сохранить, приберечь» и естественно согласуется с образом приготовленных даров; женский род говорящей следует контексту Песни и русской синтаксической необходимости.
