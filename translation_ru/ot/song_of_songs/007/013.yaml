  yaml_path: translation/ot/song_of_songs/007/013.yaml
  text: Let us rise early for the vineyards[a]; let us see whether the vine has budded, whether the blossom has opened, whether the pomegranates are in bloom[c][b]. There I will give you my love.
translation:
  language: ru
  text: Рано утром пойдём в виноградники; посмотрим, распустилась ли виноградная лоза, раскрылся ли виноградный цвет, зацвели ли гранатовые деревья. Там я дам тебе мою любовь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское: «мои любви» — форма множественного числа. Она может выражать любовь как собирательное понятие, ласки или любовную близость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְׁכִּימָה
  choice: Встанем пораньше и пойдём
  rationale: Когортатив хифиля от שׁכם выражает совместное раннее отправление. В русском сочетание передаёт и ранний подъём, и подразумеваемое движение к виноградникам.
- source_word: לַכְּרָמִים
  choice: к виноградникам
  rationale: Предлог ל в контексте обозначает направление; «к виноградникам» естественно передаёт цель движения.
- source_word: נִרְאֶה אִם
  choice: посмотрим, … ли
  rationale: Когортатив от ראה передан совместным побуждением, а אִם — русской частицей косвенного вопроса «ли».
- source_word: פָּרְחָה הַגֶּפֶן
  choice: распустилась ли виноградная лоза
  rationale: פרח допускает значения прорастания и цветения. «Распустилась» сохраняет некоторую широту образа и естественно вводит последующее раскрытие соцветий.
- source_word: פִּתַּח הַסְּמָדַר
  choice: раскрылись ли соцветия
  rationale: סמדר обозначает цвет виноградной лозы или раннее соцветие; «соцветия» ясно отличает эту стадию от общего распускания лозы.
- source_word: הֵנֵצוּ הָרִמּוֹנִים
  choice: зацвели ли гранатовые деревья
  rationale: Глагол נוץ здесь означает появление цветов. Уточнение «деревья» предотвращает ошибочное понимание, будто цветут уже собранные плоды.
- source_word: שָׁם
  choice: Там
  rationale: 'Сохранено пространственное значение наречия: именно в виноградниках возлюбленная отдаст свою любовь.'
- source_word: אֶתֵּן אֶת דֹּדַי לָךְ
  choice: я подарю тебе мою любовь
  rationale: נתן передано естественным для любовной речи «подарю», а множественное דֹּדַי — собирательным «мою любовь», без чрезмерного уточнения характера близости.
