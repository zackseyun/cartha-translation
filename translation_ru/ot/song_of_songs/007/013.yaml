  source_fidelity: 'В целом смысл и последовательность образов переданы верно: совместное раннее отправление, осмотр лозы, виноградного цвета и гранатов, затем пространственное «там» и обещание любви. Однако «подарю» добавляет оттенок дара, которого у обычного נתן («дам») нет; «раскрылись ли соцветия» менее точно соотносится с формой единственного числа הַסְּמָדַר и несколько утяжеляет строку.'
