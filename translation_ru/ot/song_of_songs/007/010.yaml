  text: And your mouth is like the best wine[a], going down smoothly for my beloved[b], gliding over the lips of sleepers.
translation:
  language: ru
  text: И уста твои[a] — как лучшее вино, что плавно льётся к моему возлюбленному, скользя по губам спящих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нёбо твоё»; еврейское слово точнее обозначает нёбо, верхнюю часть полости рта, и может быть связано с ощущением вкуса.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «побуждая уста спящих говорить». Редкий еврейский глагол может описывать либо мягкое движение вина по губам, либо его действие, заставляющее губы шевелиться и говорить.'
    reason: alternative_reading
lexical_decisions:
- source_word: חִכֵּךְ
  choice: уста твои
  rationale: Слово буквально обозначает нёбо, а также связано со вкусом; в любовной поэзии «уста» естественно передаёт образ рта, не придавая строке анатомического звучания. Более буквальный вариант указан в сноске.
- source_word: כְּיֵין הַטּוֹב
  choice: как лучшее вино
  rationale: Определённое прилагательное הַטּוֹב в данном контексте подчёркивает превосходное качество вина; русское «лучшее вино» естественно передаёт эту силу.
- source_word: הוֹלֵךְ
  choice: льётся
  rationale: Буквально причастие означает «идущий, движущийся», но применительно к вину по-русски естественен глагол «льётся», сохраняющий образ движения жидкости.
- source_word: לְדוֹדִי
  choice: к моему возлюбленному
  rationale: Предлог לְ допускает направительное значение. «К моему возлюбленному» сохраняет направление движения вина и неожиданную смену лица в еврейской строке.
- source_word: לְמֵישָׁרִים
  choice: плавно
  rationale: Буквально выражение связано с прямизной или ровностью; при описании вина оно передаёт лёгкое, беспрепятственное течение. «Плавно» звучит естественно и поэтично.
- source_word: דּוֹבֵב
  choice: скользя
  rationale: Редкий глагол допускает понимание мягкого движения по губам, хотя возможен и каузативный смысл «побуждая говорить». Основной текст сохраняет образ движения, а альтернативное толкование отмечено в сноске.
- source_word: שִׂפְתֵי יְשֵׁנִים
  choice: по губам спящих
  rationale: Близкая к форме оригинала передача сохраняет необычный и намеренно загадочный поэтический образ.
