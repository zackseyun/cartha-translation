base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/009.yaml
  text: I said[a], “I will climb the palm tree; I will take hold of its branches. May your breasts be like clusters of the vine[b], and the fragrance of your breath like apples.”
translation:
  language: ru
  text: 'Я сказал: «Взберусь на финиковую пальму, ухвачусь за её ветви[a]. Пусть груди твои будут как гроздья виноградной лозы, а аромат твоего носа[b] — как у яблок».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за её побеги» или «за её плодовые ветви»; еврейское слово обозначает ветви либо плодоносящие побеги пальмы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоего носа». Этот поэтический образ может относиться к аромату дыхания или области лица.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמָר
  choice: финиковая пальма
  rationale: Существительное обозначает пальму, прежде всего финиковую; конкретный русский эквивалент сохраняет образ плодоносящего дерева.
- source_word: אֶעֱלֶה
  choice: взберусь
  rationale: Глагол буквально означает «поднимусь», но при пальме естественно передаёт действие восхождения на дерево.
- source_word: אֹחֲזָה
  choice: ухвачусь
  rationale: Передаёт решительное «возьмусь, схвачусь» без излишне насильственного оттенка.
- source_word: סַנְסִנָּיו
  choice: её ветви
  rationale: Редкое слово может обозначать ветви либо плодоносящие побеги пальмы; основной текст использует понятное общее обозначение, а примечание сохраняет варианты.
- source_word: וְיִהְיוּ נָא
  choice: пусть ... будут
  rationale: Передаёт желательное значение юссива с частицей נָא.
- source_word: שָׁדַיִךְ
  choice: груди твои
  rationale: Прямой перевод сохраняет откровенную эротическую образность поэмы без эвфемизации.
- source_word: אֶשְׁכְּלֹת הַגֶּפֶן
  choice: гроздья виноградной лозы
  rationale: Близко воспроизводит буквальное выражение «гроздья лозы» и естественно звучит по-русски.
- source_word: רֵיחַ
  choice: аромат
  rationale: Положительный и поэтически уместный эквивалент в чувственном контексте.
- source_word: אַפֵּךְ
  choice: твоего дыхания
  rationale: Буквально слово означает «твой нос», однако сочетание с ароматом в данном образе естественно относится к дыханию или области лица; буквальное значение сохранено в примечании.
- source_word: כַּתַּפּוּחִים
  choice: как аромат яблок
  rationale: Традиционное распознавание плода как яблока сохранено; повтор слова «аромат» делает эллиптическое сравнение ясным по-русски.
