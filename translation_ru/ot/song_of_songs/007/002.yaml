base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/002.yaml
  text: How beautiful are your feet in sandals[a], O noble daughter! The curves of your thighs are like jewels[b], the work of the hands of a master craftsman.
translation:
  language: ru
  text: Как прекрасны твои ступни в сандалиях, благородная дочь! Изгибы твоих бёдер[a] — словно украшения[b], созданные руками искусного мастера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать бедро, область таза или чресла.
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «драгоценности» или, более конкретно, «ожерелья». Вероятно, имеются в виду искусно изготовленные ювелирные украшения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפוּ
  choice: Как прекрасны
  rationale: Восклицательная конструкция выражает восхищение, а не вопрос; «как прекрасны» естественно передаёт её по-русски.
- source_word: פְעָמַיִךְ
  choice: твои ступни
  rationale: Слово может обозначать стопы или шаги; упоминание сандалий указывает здесь прежде всего на ступни.
- source_word: בַּנְּעָלִים
  choice: в сандалиях
  rationale: Прямо и естественно передаёт сочетание предлога בְּ с существительным «сандалии».
- source_word: בַּת נָדִיב
  choice: благородная дочь
  rationale: Компактное обращение сохраняет возможность понимать נָדִיב как указание и на знатность, и на благородство, не сводя выражение однозначно к происхождению от вельможи.
- source_word: חַמּוּקֵי
  choice: изгибы
  rationale: Слово обозначает округлые очертания или повороты; в поэтическом описании тела «изгибы» передают эстетический образ без излишне анатомического оттенка.
- source_word: יְרֵכַיִךְ
  choice: твоих бёдер
  rationale: יָרֵךְ охватывает область бедра и таза; «бёдра» естественно звучит в данном поэтическом контексте, а широта значения отмечена в сноске.
- source_word: חֲלָאִים
  choice: украшения
  rationale: Редкое слово, вероятно, обозначает искусно изготовленные ювелирные украшения; нейтральное «украшения» не навязывает более узкую идентификацию.
- source_word: מַעֲשֵׂה יְדֵי אָמָּן
  choice: творение рук искусного мастера
  rationale: Формулировка сохраняет образ ручной работы и подчёркивает умение создателя, оставаясь естественной для современного литературного русского языка.
