translation:
  language: ru
  text: Как ты прекрасна и как мила, о возлюбленная[a], среди наслаждений[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любовь» или «любовь моя». Еврейское אַהֲבָה буквально означает «любовь» и здесь служит обращением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в наслаждениях» или «с наслаждениями». Краткое еврейское выражение בַּתַּעֲנוּגִים может указывать на сферу наслаждений либо на сопровождающие возлюбленную услады.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּפִית
  choice: Как ты прекрасна
  rationale: Восклицательное מַה перед глагольной формой передаёт восхищение, а форма женского рода единственного числа указывает на обращение к женщине.
- source_word: וּמַה נָּעַמְתְּ
  choice: и как мила
  rationale: Корень נעם обозначает приятность, прелесть и отраду. «Мила» естественно звучит в современной русской любовной поэзии и сохраняет обращение в женском роде.
- source_word: אַהֲבָה
  choice: о любовь
  rationale: Существительное «любовь» употреблено как прямое обращение. Частица «о» ясно выражает звательную функцию, не добавляя отсутствующего в еврейском притяжательного местоимения.
- source_word: בַּתַּעֲנוּגִים
  choice: среди наслаждений
  rationale: Предлог בְּ допускает пространственно-сферическое значение «в, среди», а множественное תַּעֲנוּגִים означает наслаждения или услады. Такой перевод не добавляет притяжательного значения и сохраняет сжатость оригинала.
