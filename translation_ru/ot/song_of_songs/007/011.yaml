lexical_decisions:
- source_word: אֲנִי
  choice: Я
  rationale: Эксплицитное местоимение первого лица сохранено, поскольку в еврейском оно несёт смысловое ударение.
- source_word: לְדוֹדִי
  choice: принадлежу моему возлюбленному
  rationale: Предлог לְ в безглагольной конструкции выражает принадлежность или близкие отношения. В русском явный глагол «принадлежу» естественно передаёт этот смысл и согласуется с повторяющейся формулой Песни (2:16; 6:3), не сводя её к простому направлению «для/к».
- source_word: וְעָלַי
  choice: и ко мне обращено
  rationale: При существительном «желание» предлог עַל указывает на объект и направленность желания. Эта формулировка естественна по-русски и сохраняет образ направленного к героине желания.
- source_word: תְּשׁוּקָתוֹ
  choice: его желание
  rationale: תְּשׁוּקָה прямо обозначает желание, влечение или стремление. «Желание» сохраняет лексическую связь с Быт. 3:16 и 4:7, не перенося в данный любовно-поэтический контекст споры об истолковании тех мест.
theological_decisions:
- issue: Смысл безглагольной конструкции אֲנִי לְדוֹדִי
  choice: 'Романтическая взаимная принадлежность: «Я принадлежу моему возлюбленному»'
  alternative: «Я — для моего возлюбленного»
  rationale: Буквально конструкция допускает значение «я — для моего возлюбленного», однако в повторяющейся формуле Песни выражает отношения принадлежности. Перевод сохраняет прямой любовно-поэтический смысл и не вводит позднейшего аллегорического толкования.
translation_notes:
  register: Современный литературный русский язык; поэтический и достоинственный, но понятный широкому читателю. Формулировка сохраняет эмоциональную близость оригинала без архаизации и конфессиональных добавлений.
