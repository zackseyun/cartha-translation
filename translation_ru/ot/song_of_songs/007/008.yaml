translation:
  language: ru
  text: Этот твой стан подобен пальме, и твои груди — гроздьям[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «виноградным гроздьям». В еврейском тексте сказано просто «гроздьям»; это слово часто обозначает гроздья винограда, но здесь плод прямо не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת קוֹמָתֵךְ
  choice: Этот твой стан
  rationale: Указательное זֹאת придаёт описанию непосредственность, а קוֹמָה здесь обозначает телосложение, фигуру или рост женщины. «Стан» естественно и поэтично передаёт образ всей её высокой фигуры, не сводя его к измерению роста.
- source_word: דָּמְתָה לְתָמָר
  choice: подобен пальме
  rationale: Глагол דמה с ל выражает уподобление. Настоящее время естественно для русского поэтического описания, хотя еврейская форма формально является перфектом.
- source_word: וְשָׁדַיִךְ
  choice: а твои груди
  rationale: שָׁדַיִם прямо означает женские груди; буквальный анатомический образ уместен в любовной поэзии Песни песней и не должен смягчаться.
- source_word: לְאַשְׁכֹּלוֹת
  choice: гроздьям
  rationale: אַשְׁכֹּלוֹת обозначает гроздья или скопления плодов, часто виноградные. Русское «гроздья» сохраняет неопределённость еврейского текста и остаётся ясным в контексте плодового образа.
