base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/006.yaml
  text: Your head upon you is like Carmel[a], and the flowing hair of your head like purple[c][b]; a king is held captive in the tresses.
translation:
  language: ru
  text: Голова твоя над тобой — как Кармил[a], пряди твоих волос[b] — как пурпур; царь пленён твоими локонами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кармил, вероятно, означает гору Кармил, образ величественной высоты и красоты.
    reason: cultural_note
  - marker: b
    text: 'Или: «свисающие волосы твои». Еврейское слово редко и, вероятно, обозначает ниспадающие пряди или волосы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «царь связан в галереях». Последнее еврейское слово трудно для понимания и толкуется по-разному; основной текст следует образу волос в ближайшем контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשֵׁךְ עָלַיִךְ
  choice: Голова твоя возвышается над тобой
  rationale: Буквальное «голова твоя на тебе» по-русски неестественно. Глагол «возвышается» ясно передаёт пространственный образ и поддерживает сравнение с горой, не заменяя «голову» более толковательным «венцом».
- source_word: כַּכַּרְמֶל
  choice: как Кармил
  rationale: Сохраняется краткая форма еврейского топонима; вероятнее всего, имеется в виду гора Кармил, что поясняется в сноске.
- source_word: דַלַּת רֹאשֵׁךְ
  choice: пряди волос твоих
  rationale: Редкое דַלָּה в данном контексте, вероятно, обозначает свисающие или струящиеся волосы. «Пряди волос» естественно по-русски и не скрывает предмет образа; неопределённость отмечена в сноске.
- source_word: כָּאַרְגָּמָן
  choice: как пурпур
  rationale: אַרְגָּמָן может обозначать дорогой пурпурный краситель, цвет или ткань. Краткое «пурпур» сохраняет ассоциации с цветом, роскошью и царским достоинством, не уточняя материал без необходимости.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Существительное употреблено без артикля. Русское «царь» без указательного уточнения допускает обобщённо-поэтическое прочтение; неопределённый артикль в русском отсутствует.
- source_word: אָסוּר
  choice: пленён
  rationale: Пассивная форма от אסר буквально выражает связанность. «Пленён» сохраняет метафору несвободы и естественно звучит в любовной поэзии, не сводя её лишь к эмоциональному «очарован».
- source_word: בָּרְהָטִים
  choice: твоими локонами
  rationale: Редкое слово допускает разные толкования. В контексте описания волос «локоны» создают наиболее связный образ, однако традиционная альтернатива «в галереях» сохранена в сноске. Притяжательное «твоими» эксплицирует очевидную связь с волосами возлюбленной.
