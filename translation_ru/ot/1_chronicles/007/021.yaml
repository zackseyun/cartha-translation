  text: וְ/זָבָ֥ד בְּנ֛/וֹ וְ/שׁוּתֶ֥לַח בְּנ֖/וֹ וְ/עֵ֣זֶר וְ/אֶלְעָ֑ד וַ/הֲרָג֗וּ/ם אַנְשֵׁי גַת֙ הַ/נּוֹלָדִ֣ים בָּ/אָ֔רֶץ כִּ֣י יָרְד֔וּ לָ/קַ֖חַת אֶת מִקְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: ru
  text: Завад, его сын, и Шутелах, его сын, и Езер, и Елеад; их убили жители Гата, уроженцы той земли[a], потому что они[b] спустились, чтобы забрать их скот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рождённые в земле».'
    reason: lexical_alternative
  - marker: b
    text: По контексту, вероятнее всего, речь идёт о Езере и Елеаде, ближайших названных во множественном числе лицах.
    reason: referent_ambiguity
lexical_decisions:
- source_word: בְּנוֹ
  choice: его сын
  rationale: Существительное с суффиксом 3-го лица мужского рода единственного числа; повтор сохранён как часть генеалогической цепочки.
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: и Езер, и Елеад
  rationale: Имена переданы транслитерацией; повтор союза сохраняет перечислительную структуру еврейского текста.
- source_word: וַהֲרָגוּם
  choice: их убили
  rationale: Прямое значение формы глагола הרג с объектным суффиксом множественного числа; порядок слов естественно связывает местоимение с Езером и Елеадом.
- source_word: אַנְשֵׁי גַת
  choice: жители Гата
  rationale: В данном контексте выражение обозначает мужчин — местных жителей Гата; по-русски «жители Гата» звучит естественнее, чем буквальное «мужи Гата».
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: уроженцы той земли
  rationale: Передаёт значение пассивного причастия «рождённые в земле» и его характеристику жителей Гата как местных уроженцев.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину убийства; прямой причинный перевод ясен в современном русском языке.
- source_word: יָרְדוּ
  choice: спустились
  rationale: Сохранён пространственный образ еврейского глагола «спускаться», без замены на более общее «пошли».
- source_word: לָקַחַת
  choice: забрать
  rationale: Передаёт широкое значение לקח и в данном контексте звучит естественно, не усиливая его до однозначного «похитить» или «захватить».
- source_word: מִקְנֵיהֶם
  choice: их скот
  rationale: מִקְנֶה обозначает скот или стада; местоименный суффикс сохранён, его референтом по контексту являются жители Гата.
theological_decisions:
- issue: К кому относится подлежащее множественного числа при יָרְדוּ («спустились»)?
  choice: В основном тексте сохранено местоимение «они», а в сноске указано наиболее вероятное отнесение к Езеру и Елеаду.
  alternative: 'Явно написать в тексте: «Езер и Елеад спустились».'
  rationale: Ближайшие подходящие участники повествования — Езер и Елеад, однако еврейская глагольная форма сама по себе не называет их и допускает более широкое отнесение к упомянутым членам рода.
translation_notes:
  register: Современный литературный русский язык с достоинством генеалогического повествования. Точка с запятой отделяет продолжение родословного перечня от сообщения о гибели. Формулировка сохраняет местоименную неоднозначность еврейского текста, поясняя наиболее вероятный смысл в сноске.
