base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: ru
  text: 'Сыновья Белы: Эцбон, Уззи, Уззиил, Иеримоф и Ири — пять глав родовых домов, доблестные воины. По родословным спискам[a] их насчитывалось двадцать две тысячи тридцать четыре человека.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их родословная насчитывала двадцать две тысячи тридцать четыре человека» или «их родословная регистрация». Еврейское слово обозначает внесение в родословные записи.'
    reason: lexical_alternative
