  rationale: Транслитерация личного имени; форма различима с предшествующим именем Уззи.
- source_word: יְרִימוֹת
  choice: Иеримоф
  rationale: Традиционная русская библейская передача имени, при которой конечное ת передаётся как «ф».
- source_word: עִירִי
  choice: Ири
  rationale: Прямая и понятная транслитерация личного имени.
- source_word: רָאשֵׁי בֵּית אָבוֹת
  choice: глав родовых домов
  rationale: 'Передаёт социально-генеалогический термин: «главы» сохраняет идею руководства, а «родовые дома» звучит естественнее современного буквального «дома отцов».'
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: доблестные воины
  rationale: Контекстуально передаёт устойчивое выражение о сильных и способных к войне мужчинах без архаичного оборота.
- source_word: וְהִתְיַחְשָׂם
  choice: В родословные списки их было внесено
  rationale: Глагольная формулировка ясно передаёт значение Hitpael от יחס в Хрониках — запись и учёт по родословиям.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: двадцать две тысячи тридцать четыре человека
  rationale: Точная передача числа 22 034; добавление «человека» делает подразумеваемый объект счёта явным и естественным по-русски.
