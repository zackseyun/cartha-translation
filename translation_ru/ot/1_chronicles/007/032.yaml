lexical_decisions:
- source_word: חֶבֶר
  choice: Хевер
  rationale: Личное имя передано транслитерацией с сохранением начального еврейского согласного ח как «х».
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В генеалогическом контексте форма породы хифиль от ילד обозначает рождение потомства от мужчины; выражение естественно для современного русского языка и сохраняет генеалогический смысл.
- source_word: יַפְלֵט
  choice: Иафлет
  rationale: Личное имя передано в привычной для русской библейской традиции форме.
- source_word: שׁוֹמֵר
  choice: Шомер
  rationale: Транслитерация соответствует огласовке масоретского текста; вариант «Шемер» сохранён в примечании.
- source_word: חוֹתָם
  choice: Хотам
  rationale: Личное имя передано транслитерацией.
- source_word: שׁוּעָא
  choice: Шуа
  rationale: Личное имя передано в соответствии с формой и огласовкой масоретского текста; вариант «Шуах» указан в примечании.
- source_word: אֲחוֹתָם
  choice: их сестры
  rationale: Существительное имеет суффикс третьего лица мужского рода множественного числа и естественнее всего относится ко всем ранее названным братьям.
