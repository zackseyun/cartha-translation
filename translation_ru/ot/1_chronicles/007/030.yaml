  text: בְּנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְ/יִשְׁוָ֛ה וְ/יִשְׁוִ֥י וּ/בְרִיעָ֖ה וְ/שֶׂ֥רַח אֲחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: ru
  text: 'Сыновья Асира: Имна, Ишва, Ишви и Берия; их сестра — Серах.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן («сын»). Здесь перечислены непосредственные дети Асира, поэтому буквальное «сыновья» точнее, чем более широкое «потомки».
- source_word: אָשֵׁר
  choice: Асир
  rationale: Традиционная и узнаваемая русская передача имени אָשֵׁר.
- source_word: יִמְנָה
  choice: Имна
  rationale: Передача имени по масоретской огласовке с учётом сложившейся русской библейской традиции.
- source_word: יִשְׁוָה
  choice: Ишва
  rationale: Прямая передача согласных и масоретской огласовки данного стиха без унификации с родственными формами имени в других родословиях.
- source_word: יִשְׁוִי
  choice: Ишви
  rationale: Прямая передача имени согласно масоретской форме יִשְׁוִי.
- source_word: בְרִיעָה
  choice: Берия
  rationale: Устоявшаяся русская библейская передача этого личного имени.
- source_word: שֶׂרַח
  choice: Серах
  rationale: Передача שׂ через «с» и сохранение формы имени, отличной от имени Сарра.
- source_word: אֲחוֹתָם
  choice: их сестра
  rationale: Суффикс 3-го лица мужского рода множественного числа означает, что Серах названа сестрой перечисленных братьев в совокупности.
