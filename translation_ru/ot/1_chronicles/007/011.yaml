base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: ru
  text: Все они — сыновья Иедиаэля[a], по главам своих родов[b] — доблестные воины[c]; всего их было семнадцать тысяч двести человек, готовых выступить на войну[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки Иедиаэля». В родословиях еврейское слово «сыновья» может обозначать и более отдалённых потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по главам отцов». Имеются в виду главы родов, или больших семей.'
    reason: cultural_note
  - marker: c
    text: 'Или: «сильные и храбрые воины».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «выходящих на военную службу для войны»; выражение может обозначать мужчин, способных или подлежащих военной службе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Сохраняет краткую итоговую формулу еврейского текста и естественно связывает стих с предшествующим перечнем.
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: сыновья Иедиаэля
  rationale: Формально передаёт בְּנֵי; возможное более широкое генеалогическое значение «потомки» отмечено в сноске.
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: по главам родов
  rationale: Передаёт распределение или учёт по главам родовых объединений, не вводя в основной текст тяжеловесное буквальное «главы отцов».
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: доблестные воины
  rationale: Естественное современное русское обозначение сильных, способных и испытанных воинов; сохраняет военный смысл выражения.
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: семнадцать тысяч двести человек
  rationale: Точно воспроизводит указанное число; «человек» добавлено для ясного русского синтаксиса при подсчёте воинов.
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: выходивших с войском на войну
  rationale: Близко передаёт образное выражение исходного текста и не сводит причастие безоговорочно к понятию формальной годности к службе.
