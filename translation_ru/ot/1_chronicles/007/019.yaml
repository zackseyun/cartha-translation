  yaml_path: translation/ot/1_chronicles/007/019.yaml
  text: The sons of Shemida were Ahian[a], Shechem, Likhi, and Aniam.
translation:
  language: ru
  text: Сыновьями Шемиды были Ахиан, Шехем, Ликхи и Аниам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: были
  rationale: В родословном перечне форма глагола היה естественно вводит имена перечисляемых сыновей; русское «были» сохраняет структуру и смысл исходного текста.
- source_word: בְּנֵי
  choice: сыновьями
  rationale: Хотя в родословиях слово может шире обозначать потомков, ближайший контекст и перечисление мужских имён поддерживают прямое значение «сыновья».
- source_word: שְׁמִידָע
  choice: Шемиды
  rationale: Имя передано транслитерацией с учётом принятой русской библейской формы.
- source_word: אַחְיָן
  choice: Ахиан
  rationale: Имя транслитерировано по масоретской огласовке в естественной для русского языка форме.
- source_word: שֶׁכֶם
  choice: Шехем
  rationale: Здесь это личное имя; форма «Шехем» передаёт еврейское שֶׁכֶם и соответствует русской библейской традиции.
- source_word: לִקְחִי
  choice: Ликхи
  rationale: Транслитерация сохраняет различие согласных и передаёт конечный гласный имени.
- source_word: אֲנִיעָם
  choice: Аниам
  rationale: Имя передано прямой транслитерацией без попытки переводить его возможное значение.
theological_decisions: []
translation_notes:
  register: Краткий, dignified родословный стиль на современном литературном русском; порядок имён и синтаксическая связь исходного текста сохранены. Отдельная сноска о возможном значении «потомки» не добавлена, поскольку в данном непосредственном контексте «сыновья» является наиболее вероятным и естественным чтением.
