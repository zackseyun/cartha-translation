  text: וּ/בְנֵ֥י אֶפְרַ֖יִם שׁוּתָ֑לַח וּ/בֶ֤רֶד בְּנ/וֹ֙ וְ/תַ֣חַת בְּנ֔/וֹ וְ/אֶלְעָדָ֥ה בְנ֖/וֹ וְ/תַ֥חַת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/020.yaml
  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: ru
  text: 'Сыновья Ефрема: Шутелах[a], его сын Беред, его сын Тахат, его сын Елеада и его сын Тахат.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейских родословиях слово «сын» иногда может обозначать более отдалённого потомка, однако здесь на каждой ступени буквально сказано «его сын».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: Сыновья Ефрема
  rationale: Сочетание вводит родословную линию. Начальный союз в русском естественно опустить, сохранив функцию заголовка.
- source_word: שׁוּתָלַח
  choice: Шутелах
  rationale: Личное имя передано современной русской транслитерацией, достаточно близкой к еврейской форме.
- source_word: וּבֶרֶד
  choice: Беред
  rationale: Личное имя; союз перед ним не воспроизводится отдельно, поскольку последовательность родословия ясно выражена синтаксисом русского предложения.
- source_word: בְּנוֹ
  choice: его сын
  rationale: Буквальное и контекстуально естественное значение формы בן с местоименным суффиксом 3-го лица мужского рода единственного числа. Возможное обозначение более отдалённого потомка отмечено в сноске.
- source_word: וְתַחַת
  choice: Тахат
  rationale: В данном контексте תַחַת является личным именем, а не предлогом или нарицательным словом.
- source_word: וְאֶלְעָדָה
  choice: Елеада
  rationale: Личное имя передано по принятой русской библейской традиции с сохранением различимости еврейской формы.
- source_word: וְתַחַת בְּנוֹ
  choice: его сын Тахат
  rationale: Повтор родословной формулы сохранён, но порядок слов естественно перестроен для современного русского языка.
