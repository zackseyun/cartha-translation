  text: וּ/מָכִ֞יר לָקַ֤ח אִשָּׁה֙ לְ/חֻפִּ֣ים וּ/לְ/שֻׁפִּ֔ים וְ/שֵׁ֤ם אֲחֹת/וֹ֙ מַעֲכָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖י צְלָפְחָ֑ד וַ/תִּהְיֶ֥נָה לִ/צְלָפְחָ֖ד בָּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: ru
  text: Махир взял жену для Хуппима и для Шуппима. Имя его сестры — Мааха, а имя второго — Целофхад[a]. У Целофхада были дочери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а имя второго сына — Целофхад». В еврейском тексте сказано просто «второго»; к кому относится это слово, прямо не указано.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: взял жену
  rationale: Устойчивое древнееврейское выражение означает «взять в жёны»; конструкция с последующими לְ показывает, что Махир взял жену не себе, а для названных лиц.
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: для Хуппима и для Шуппима
  rationale: Повтор предлога לְ передан повтором «для», чтобы сохранить необычную синтаксическую конструкцию исходного текста, не уточняя характера брачного устройства.
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: Имя его сестры — Мааха
  rationale: Прямо передаёт формулу именования; местоимение «его» оставляет референцию такой же контекстуальной, как в еврейском тексте.
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: а имя второго — Целофхад
  rationale: В еврейском тексте сказано буквально «второго» без выраженного существительного. Русский перевод сохраняет эту сжатость и неоднозначность, не добавляя «сына».
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: У Целофхада были дочери
  rationale: Естественная русская передача древнееврейской конструкции обладания, сохраняющая генеалогическое сообщение о дочерях Целофхада.
theological_decisions:
- issue: Генеалогическая неоднозначность выражения «второй»
  choice: Сохранить в основном тексте сжатое выражение «второго», не добавляя подразумеваемое существительное
  alternative: «второго сына» или «другого»
  rationale: Исходный текст не называет прямо, кто именно обозначен как «второй». Добавление «сын» сделало бы неявную генеалогическую связь определённой; поэтому возможное уточнение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имена переданы в формах, привычных для русской библейской традиции; необычный синтаксис и неоднозначность оригинала сохранены там, где их сглаживание потребовало бы толкования.
