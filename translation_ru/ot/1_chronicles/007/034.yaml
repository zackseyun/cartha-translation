  text: וּ/בְנֵ֖י שָׁ֑מֶר אֲחִ֥י ו/רוהגה יחבה וַ/אֲרָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: ru
  text: 'И сыновья Шемера[a]: Ахи, Рохга, Йехубба[b] и Арам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейских родословиях выражение «сыновья» может обозначать также более отдалённых потомков или представителей рода, а не только непосредственных сыновей.
    reason: cultural_note
  - marker: b
    text: Это имя также передают как «Иехубба» или «Иегубба»; различия обусловлены способами транслитерации еврейского имени.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сохранены соединительный союз и обычная для родословий формула; слово может обозначать не только непосредственных сыновей, но и мужских потомков или представителей рода.
- source_word: שָׁמֶר
  choice: Шемера
  rationale: Имя передано транслитерацией и поставлено в родительный падеж в соответствии с русским синтаксисом.
- source_word: אֲחִי
  choice: Ахи
  rationale: В перечне это личное имя, поэтому оно транслитерировано, а не переведено по возможной связи со словом «брат».
- source_word: וְרוהגה
  choice: Рохга
  rationale: Личное имя передано близко к еврейскому звучанию; присоединительный союз выражен в структуре русского перечисления.
- source_word: יחבה
  choice: Йехубба
  rationale: Начальный йод передан как «Йе-», а ח — как «х»; удвоение «б» отражает традиционную передачу формы имени.
- source_word: וַאֲרָם
  choice: и Арам
  rationale: Союз сохранён перед последним членом перечисления; форма אֲרָם непосредственно соответствует имени «Арам».
theological_decisions: []
