  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: ru
  text: Шуппим и Хуппим[b] — сыновья Ира; Хушим — сыновья Ахера.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Хушим — сыновья Ахера». Еврейский текст синтаксически труден: при имени Хушим стоит форма множественного числа «сыновья». Слово «Ахер» можно понимать как имя собственное или как слово «другой».'
    reason: lexical_alternative
  - marker: b
    text: В связанных родословиях встречаются варианты передачи этих имён, например «Шефуфам» и «Хуфам».
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  choice: Шуппим
  rationale: Имя собственное передано транслитерацией непосредственно по масоретскому тексту; начальный союз естественно не воспроизводить в русском начале самостоятельного стиха.
- source_word: וְ/חֻפִּם
  choice: и Хуппим
  rationale: Имя собственное транслитерировано; союз וְ передан как «и».
- source_word: בְּנֵי עִיר
  choice: сыновья Ира
  rationale: בְּנֵי имеет обычное для родословия значение «сыновья»; עִיר передано как имя Ир. В русском именная конструкция с тире естественно воспроизводит безглагольное еврейское предложение.
- source_word: חֻשִׁם
  choice: Хушим
  rationale: Имя собственное передано транслитерацией по еврейскому тексту.
- source_word: בְּנֵי אַחֵר
  choice: сыновья Ахера
  rationale: Сохранено морфологическое число еврейского בְּנֵי («сыновья»), несмотря на синтаксическую трудность при имени Хушим. אַחֵר принято за имя собственное Ахер, но иное понимание отмечено в сноске.
