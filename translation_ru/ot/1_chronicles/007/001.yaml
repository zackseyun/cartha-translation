  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: ru
  text: 'Сыновья Иссахара: Тола, Пуах[a], Яшув[b] и Шимрон — четверо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская форма здесь — «Пуах»; в других родословных перечнях встречается родственная форма имени, которую передают как «Пува» или «Фува».
    reason: alternative_reading
  - marker: b
    text: Здесь еврейский текст даёт имя «Яшув»; в параллельном перечне в Бытии 46:13 стоит форма «Ишви».
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Сыновья
  rationale: Сочетание открывает новую родословную ветвь. По-русски заголовочная конструкция без явной передачи союза и предлога звучит естественно и полностью передаёт их функцию.
- source_word: יִשָׂשכָר
  choice: Иссахара
  rationale: Имя передано в закрепившейся в русском библейском употреблении форме и поставлено в родительный падеж после слова «сыновья».
- source_word: תּוֹלָע
  choice: Тола
  rationale: Личное имя транслитерировано с еврейского; переводить его возможное лексическое значение в родословном перечне не следует.
- source_word: וּ/פוּאָה
  choice: Пуа
  rationale: Передана масоретская форма имени в данном стихе; союз выражен структурой русского перечисления.
- source_word: ישיב
  choice: Яшув
  rationale: Передана форма имени, представленная в Паралипоменоне; отличающаяся параллельная форма из Бытия не подменяет текст данного стиха.
- source_word: וְ/שִׁמְרוֹן
  choice: и Шимрон
  rationale: Союз естественно вводит последний элемент русского перечисления, а имя транслитерировано.
- source_word: אַרְבָּעָה
  choice: четверо
  rationale: Собирательное числительное естественно относится к четырём названным лицам; тире сохраняет характер итогового уточнения.
