base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/009.yaml
  text: 'They were enrolled by genealogy[a], according to their generations, as heads of their fathers’ houses[b], mighty men of valor: twenty thousand two hundred.'
translation:
  language: ru
  text: Они были внесены в родословные записи[a] по своим поколениям — главы своих отеческих домов[b], доблестные воины, числом двадцать тысяч двести человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были зарегистрированы по родословным». Еврейский глагол означает внесение в родословную запись.'
    reason: lexical_alternative
  - marker: b
    text: «Отеческие дома» — семейно-родовые объединения, основанные на общем происхождении, а не только отдельные семьи в современном смысле.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְיַחְשָׂם
  choice: В родословной они были записаны
  rationale: Форма хитпаэль глагола יחשׂ в книгах Паралипоменон означает внесение в родословную запись или учёт; эта формулировка передаёт и административный, и генеалогический смысл.
- source_word: לְתֹלְדוֹתָם
  choice: по своим поколениям
  rationale: תולדות обозначает поколения и происхождение; буквальная формулировка сохраняет генеалогический характер выражения, не сводя его лишь к семьям.
- source_word: רָאשֵׁי בֵּית אֲבוֹתָם
  choice: главы своих отеческих домов
  rationale: Устойчивое родоплеменное выражение обозначает руководителей семейно-родовых объединений; «отеческие дома» сохраняет социальную структуру исходного текста.
- source_word: גִּבּוֹרֵי חָיִל
  choice: доблестные воины
  rationale: В данном контексте выражение указывает на сильных, доблестных и пригодных к военной службе мужчин; «доблестные воины» звучит естественно и сохраняет военный оттенок.
- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: двадцать тысяч двести человек
  rationale: Точное воспроизведение еврейского числительного; добавление «человек» естественно проясняет единицу счёта, подразумеваемую контекстом.
