  text: 'The sons of Ulla: Arah[a], Hanniel[d][c][b], and Rizia.'
translation:
  language: ru
  text: 'И сыновья Уллы: Арах, Ханниил и Риция.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сочетание передаёт как присоединительный союз וּ («и»), так и форму сопряжённого состояния בְנֵי («сыновья»); в генеалогическом перечне это естественная и точная формулировка.
- source_word: עֻלָּא
  choice: Уллы
  rationale: Личное имя передано транслитерацией «Улла» и поставлено в родительный падеж после слова «сыновья».
- source_word: אָרַח
  choice: Арах
  rationale: Личное имя транслитерировано с передачей конечной ח через «х».
- source_word: חַנִּיאֵל
  choice: Ханниил
  rationale: Транслитерация передаёт начальную ח через «х», удвоенную נ и элемент אֵל; форма соответствует фонетике еврейского имени лучше, чем традиционное «Ганниил».
- source_word: רִצְיָא
  choice: Риция
  rationale: Личное имя передано близкой русской транслитерацией еврейской формы.
