lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: Сыновья Берии
  rationale: Сопряжённая форма множественного числа «сын» вводит генеалогическую подгруппу. Начальный союз естественно не выражать отдельно в русском перечне.
- source_word: חֶבֶר
  choice: Хевер
  rationale: Передача еврейского личного имени современными средствами русской библейской транслитерации.
- source_word: וּמַלְכִּיאֵל
  choice: и Малкиил
  rationale: Личное имя с присоединительным союзом; союз передан непосредственно.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение возобновляет ближайшее предшествующее существительное мужского рода — Малкиила — без устранения возможной синтаксической напряжённости.
- source_word: אֲבִי
  choice: был отцом
  rationale: Сохранена буквальная генеалогическая формула; она может обозначать как непосредственное отцовство, так и предка либо основателя.
- source_word: ברזות
  choice: Бирзаита
  rationale: Редкое имя без огласовки передано консервативной транслитерацией; падежное окончание соответствует русскому управлению после слова «отцом».
