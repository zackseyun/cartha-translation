  text: בְּנֵ֣י מְנַשֶּׁ֔ה אַשְׂרִיאֵ֖ל אֲשֶׁ֣ר יָלָ֑דָה פִּֽילַגְשׁ/וֹ֙ הָֽ/אֲרַמִּיָּ֔ה יָלְדָ֕ה אֶת מָכִ֖יר אֲבִ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: ru
  text: 'Сыновья Манассии[a]: Асриил, которого родила наложница Манассии, арамейка[b]. Она родила Махира, отца Галаада[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В родословиях слово «сыновья» может также означать «потомки».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его наложница, арамейка». Местоимение «его», по-видимому, относится к Манассии.'
    reason: ambiguity
  - marker: c
    text: В родословиях выражение «отец Галаада» может также означать «предок Галаада» или «основатель Галаада».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: Сыновья Манассии
  rationale: Буквально передаёт форму множественного числа в сопряжённом состоянии; в родословиях слово «сыновья» может обозначать и более отдалённых потомков.
- source_word: אַשְׂרִיאֵל
  choice: Асриил
  rationale: Традиционная и узнаваемая русская передача библейского личного имени.
- source_word: אֲשֶׁר יָלָדָה
  choice: которого родила
  rationale: Глагол стоит в форме женского рода и вводит относительное придаточное; активная конструкция сохраняет форму и ход еврейской фразы.
- source_word: פִּילַגְשׁוֹ
  choice: наложница Манассии
  rationale: פִּילֶגֶשׁ прямо означает «наложница». Местоименный суффикс буквально значит «его»; имя Манассии повторено по-русски, чтобы избежать ошибочного отнесения местоимения к Асриилу.
- source_word: הָאֲרַמִּיָּה
  choice: арамейка
  rationale: Обозначает женщину-арамейку; это исторически точнее традиционного «сириянка».
- source_word: יָלְדָה אֶת מָכִיר
  choice: Она родила Махира
  rationale: Повтор глагола сохранён, поскольку он возобновляет сообщение о той же женщине и вводит Махира.
- source_word: אֲבִי גִלְעָד
  choice: отца Галаада
  rationale: Сохраняет прямое значение אָב и традиционную форму родословия, не исключая более широкого значения «предок» или «основатель».
