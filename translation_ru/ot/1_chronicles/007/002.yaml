base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: ru
  text: 'Сыновья Фолы: Уззий, Рефаия, Иериил, Иахмай, Ивсам и Самуил — главы[a] отеческих домов рода Фолы, доблестные воины[b] по своим родословиям[c]. В дни Давида их насчитывалось двадцать две тысячи шестьсот.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предводители» либо «начальники».'
    reason: lexical_alternative
  - marker: b
    text: Выражение можно также перевести как «сильные и доблестные мужи» или «храбрые воины».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по поколениям»; речь может идти о родовых линиях или генеалогических списках.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: Сыновья Фолы
  rationale: В прямом генеалогическом перечне בְּנֵי естественно означает «сыновья». Начальный союз ו не выражен отдельно, чтобы стих естественно звучал по-русски. Имя передано в традиционной русской библейской форме «Фола».
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: Уззий, Рефаия, Иериил, Иахмай, Ивсам и Самуил
  rationale: Имена переданы в привычных русских библейских формах, соответствующих масоретской огласовке.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: главы своих отеческих домов
  rationale: רָאשִׁים буквально означает «главы» и здесь обозначает руководителей родовых подразделений; בֵּית אָבוֹת — устойчивое обозначение отеческого дома как родовой единицы.
- source_word: לְתוֹלָע
  choice: в роду Фолы
  rationale: Предлог ל связывает названные отеческие дома с линией Фолы. Формулировка «в роду Фолы» естественно передаёт эту принадлежность, не сводя её непременно к непосредственному сыновству.
- source_word: גִּבּוֹרֵי חַיִל
  choice: доблестные воины
  rationale: Устойчивое сочетание обозначает сильных, доблестных или состоятельных мужей и нередко имеет военный оттенок; в контексте учёта мужчин выражение «доблестные воины» передаёт вероятный смысл.
- source_word: לְתֹלְדוֹתָם
  choice: перечисленные по своим родословиям
  rationale: תּוֹלְדוֹת здесь относится к родовым линиям и генеалогической регистрации. Добавленное «перечисленные» делает синтаксическую связь ясной по-русски, сохраняя смысл учёта по родословиям.
- source_word: מִסְפָּרָם בִּימֵי דָוִיד
  choice: В дни Давида их насчитывалось
  rationale: Естественная русская передача буквального «их число в дни Давида», подходящая для переписного или военного учёта.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: двадцать две тысячи шестьсот
  rationale: Точная передача указанного в еврейском тексте числа 22 600.
