  yaml_path: translation/ot/1_chronicles/007/033.yaml
  text: 'The sons of Japhlet: Pasach[a], Bimhal, and Ashvath[b]. These were the sons of Japhlet.'
translation:
  language: ru
  text: 'Сыновья Иафлета: Пасах, Бимхал и Ашват. Это сыновья Иафлета.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי
  choice: сыновья
  rationale: В непосредственном контексте родословного перечня конструктивная форма множественного числа от בֵּן обозначает именно сыновей, а не более широко потомков.
- source_word: יַפְלֵט
  choice: Иафлет
  rationale: Личное имя передано принятой в русской библейской традиции формой, достаточно близкой к древнееврейскому звучанию.
- source_word: פָּסַךְ
  choice: Пасах
  rationale: Имя транслитерировано с передачей конечного согласного ך как «х».
- source_word: וּבִמְהָל
  choice: Бимгал
  rationale: Союз וּ передан отдельно как «и»; в имени буква ה передана через «г» в соответствии с традиционным русским библейским написанием.
- source_word: וְעַשְׁוָת
  choice: Ашват
  rationale: Союз וְ передан отдельно; личное имя транслитерировано как «Ашват», сохраняя последовательность согласных еврейского текста.
- source_word: אֵלֶּה
  choice: Это
  rationale: В русской родословной формуле указательное местоимение естественно передаётся нейтральным «это» без добавления глагола-связки и без необходимости выбирать между настоящим и прошедшим временем.
- source_word: בְּנֵי יַפְלֵט
  choice: сыновья Иафлета
  rationale: Повтор формулы сохранён полностью, поскольку он завершает перечень и воспроизводит структуру еврейского текста.
