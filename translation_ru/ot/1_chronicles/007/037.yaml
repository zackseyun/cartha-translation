  text: Бецер, Ход, Шамма, Шилша, Итран и Беэра.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  choice: Бецер
  rationale: Личное имя в родословном перечне; передано транслитерацией с учётом еврейской согласной צ (ц).
- source_word: הוֹד
  choice: Ход
  rationale: В данном контексте это личное имя, а не нарицательное со значением «величие» или «блеск»; начальная ה передана через «х», а не традиционное «г».
- source_word: שַׁמָּא
  choice: Шамма
  rationale: Передаёт масоретскую огласовку и удвоение מ; конечная א не требует отдельного обозначения в естественной русской форме имени.
- source_word: שִׁלְשָׁה
  choice: Шилша
  rationale: Имя транслитерировано по масоретской форме; конечная ה здесь соответствует окончанию «а», поэтому форма «Шилша» точнее и естественнее, чем англизированное «Шилшах».
- source_word: יִתְרָן
  choice: Итран
  rationale: Имя передано непосредственно с еврейского; начальный йод перед гласной в этой позиции естественно отражён русским «И», без опоры на англизированную форму Jethran.
- source_word: בְאֵרָא
  choice: Беэра
  rationale: Раздельное звучание гласных по обе стороны א передано сочетанием «еэ», позволяющим сохранить строение еврейского имени без апострофа.
