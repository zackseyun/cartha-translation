  text: 'Сыновья Вениамина: Бела, Бехер и Иедиаил — трое.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְיָמִן
  choice: Вениамин
  rationale: Традиционная и общеупотребительная русская форма библейского личного и родового имени; по контексту родословия подразумеваются его сыновья.
- source_word: בֶּלַע
  choice: Бела
  rationale: Устоявшаяся русская передача личного имени.
- source_word: בֶּכֶר
  choice: Бехер
  rationale: Русская форма близко передаёт еврейское произношение с фрикативным согласным כ и согласуется с принятой библейской традицией.
- source_word: יְדִיעֲאֵל
  choice: Иедиаил
  rationale: Устоявшаяся русская форма имени, сохраняющая его узнаваемость в библейской традиции.
- source_word: שְׁלֹשָׁה
  choice: трое
  rationale: Собирательное числительное естественно по-русски подводит итог перечислению трёх сыновей.
- source_word: '[подразумеваемый заголовок родословия]'
  choice: 'Сыновья Вениамина:'
  rationale: Еврейская фраза безглагольна и эллиптична; связь «сыновья Вениамина» ясно следует из жанра и ближайшего контекста родословия.
