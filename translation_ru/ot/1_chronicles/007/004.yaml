translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией. «Отцовские дома» сохраняет социально-родовую структуру оригинала, а «насчитывалось» естественно для переписного контекста. Добавлен подразумеваемый счётный компонент «человек», чтобы число 36 000 не воспринималось как количество отрядов.
