base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: ru
  text: Вместе с ними, согласно их родословиям, по отцовским домам, насчитывалось 36 000 воинов, составлявших боевые отряды[a], потому что у них было много жён[b] и сыновей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейское выражение соединяет слова «отряды», «войско» и «война»; возможный перевод: «воинские подразделения для войны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «женщин». Еврейское נָשִׁים допускает оба значения, но в данном родословном и семейном контексте значение «жёны» подходит лучше.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלֵיהֶם
  choice: Вместе с ними
  rationale: В контексте перечня עַל с местоименным суффиксом указывает на тех, кто был связан с ранее названными людьми; пространственное «над ними» здесь менее уместно.
- source_word: לְתֹלְדוֹתָם
  choice: по их родословиям
  rationale: תּוֹלְדוֹת здесь обозначает распределение по происхождению и родовым линиям; «родословия» естественно передаёт генеалогический смысл.
- source_word: לְבֵית אֲבוֹתָם
  choice: по отцовским домам
  rationale: Сохранён обычный библейский термин, обозначающий патрилинейные родовые объединения; выражение понятно из контекста и не сводит их просто к отдельным семьям.
- source_word: גְּדוּדֵי צְבָא מִלְחָמָה
  choice: человек в боевых отрядах
  rationale: Еврейское выражение буквально нагромождает военные термины — «отряды, войско, война». Русская формулировка ясно показывает, что 36 000 — численность людей, а не число отдельных отрядов, и сохраняет военный смысл.
- source_word: שְׁלֹשִׁים וְשִׁשָּׁה אָלֶף
  choice: 36 000
  rationale: Точное число передано арабскими цифрами в соответствии с современной русской издательской практикой.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину большой численности и естественно передаётся причинной конструкцией.
- source_word: הִרְבּוּ
  choice: у них было много
  rationale: Каузативная форма רבה буквально связана с умножением или увеличением; при дополнениях «жёны и сыновья» идиоматический русский требует выражения «было много».
- source_word: נָשִׁים
  choice: жён
  rationale: נָשִׁים может означать и «женщин», и «жён», но в генеалогическом контексте и в сочетании с сыновьями речь, вероятнее всего, о многочисленных семьях.
- source_word: וּבָנִים
  choice: и сыновей
  rationale: Сохранено прямое значение בָּנִים; более широкое «детей» неоправданно устранило бы мужской род, значимый для генеалогической переписи.
