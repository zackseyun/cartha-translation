  yaml_path: translation/ot/1_chronicles/007/036.yaml
  text: 'The sons of Zophah: Suah[a], Harnepher, Shual, Beri, and Imrah.'
translation:
  language: ru
  text: 'Сыновья[a] Цофаха: Суах, Харнефер, Шуал, Бери и Имра.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потомки Цофаха». В родословиях еврейское בְּנֵי может обозначать более широкую линию потомков, хотя «сыновья» — более прямой перевод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן («сын») непосредственно обозначает сыновей, хотя в родословиях может относиться и к более широкому кругу потомков.
- source_word: צוֹפָח
  choice: Цофах
  rationale: Личное имя передано транслитерацией масоретской формы с учётом норм современного русского языка.
- source_word: סוּחַ
  choice: Суах
  rationale: Личное имя транслитерировано близко к масоретской огласовке.
- source_word: חַרְנֶפֶר
  choice: Харнефер
  rationale: Личное имя передано транслитерацией; начальная буква ח последовательно отражена русским «х».
- source_word: שׁוּעָל
  choice: Шуал
  rationale: В данном родословном контексте слово является личным именем, поэтому оно транслитерировано, а не переведено как нарицательное.
- source_word: בֵרִי
  choice: Бери
  rationale: Транслитерация соответствует масоретской форме имени в этом стихе.
- source_word: יִמְרָה
  choice: Имра
  rationale: Личное имя передано естественной русской транслитерацией; начальный йод перед гласным здесь не требует отдельного «й».
theological_decisions: []
translation_notes:
  register: Краткая генеалогическая формула сохранена. Использованы современные русские формы транслитерации имён и естественное перечисление с союзом «и» перед последним именем.
