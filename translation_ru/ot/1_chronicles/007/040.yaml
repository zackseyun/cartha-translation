base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: ru
  text: Все они — потомки Асира, главы родовых домов, отборные мужи, могучие воины, главные среди вождей. Они были внесены в родословные списки для службы в войске на войне. Число их составляло двадцать шесть тысяч человек.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי אָשֵׁר
  choice: потомки Асира
  rationale: В генеалогическом контексте בנים охватывает не только непосредственных сыновей, но и более дальних потомков; русский вариант устраняет неверное впечатление, будто перечислены лишь сыновья первого поколения.
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: главы родовых домов
  rationale: Устойчивое обозначение руководителей патрилинейных родовых объединений; «родовые дома» передаёт древнюю общественную структуру яснее, чем буквальное «дома отцов».
- source_word: בְּרוּרִים
  choice: отборные мужи
  rationale: Страдательное причастие указывает на отобранных, избранных по качествам людей; «мужи» соответствует торжественному генеалогическому регистру, не звуча архаично чрезмерно.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: могучие воины
  rationale: Контекст прямо военный; выражение характеризует силу и боеспособность, а не отвлечённую нравственную доблесть.
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: главные вожди
  rationale: Сжатое и несколько неоднозначное выражение обозначает высокий ранг среди предводителей. Перевод сохраняет идею первенства, не вводя монархического значения слова «князья».
- source_word: וְהִתְיַחְשָׂם
  choice: они были внесены в родословные списки
  rationale: Hitpael глагола יחס в книгах Паралипоменон обычно обозначает регистрацию по родословию. Здесь форма относится к перечисленным людям, а последующий военный оборот указывает на назначение этой регистрации.
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: для военной службы
  rationale: Два связанных оборота описывают войско и войну; естественный русский эквивалент передаёт функциональный смысл без тяжеловесного повтора «в войске на войну».
- source_word: מִסְפָּרָם אֲנָשִׁים עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: Число их составляло двадцать шесть тысяч человек
  rationale: Естественная русская формула подсчёта людей, точно сохраняющая численность и явное указание на лиц мужского пола в данном военном контексте.
