lexical_decisions:
- source_word: נ֥וֹן
  choice: Нун
  rationale: Личное имя передано в принятой русской библейской форме; оно не переводится.
- source_word: בְּנ֖/וֹ
  choice: его сын
  rationale: Существительное בֵּן с местоименным суффиксом 3-го лица мужского рода единственного числа буквально означает «его сын»; повтор формулы сохранён как характерная черта родословия.
- source_word: יְהוֹשֻׁ֥עַ
  choice: Иисус Навин
  rationale: Использована устоявшаяся русская библейская форма имени данного лица. Добавление «Навин» традиционно отличает его от других носителей имени Иисус и соответствует обычному русскому именованию, хотя в данном еврейском слове стоит только личное имя יְהוֹשֻׁעַ.
- source_word: בְּנֽ/וֹ
  choice: его сын
  rationale: Повторяющаяся формула родословия передана буквально, чтобы ясно показать последовательность происхождения.
