base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: ru
  text: Затем он вошёл к своей жене, и она зачала и родила сына. Он назвал его Берия[a], потому что в его доме была беда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Берия» созвучно еврейскому слову, переведённому здесь как «беда».
    reason: wordplay
  - marker: b
    text: Под «бедой» здесь понимается несчастье, постигшее его семью, а не нравственное зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: он вошёл к своей жене
  rationale: Оборот בוא אל в данном контексте служит традиционным эвфемизмом супружеской близости. Русская формулировка сохраняет образ и остаётся понятной в контексте зачатия.
- source_word: וַתַּהַר וַתֵּלֶד בֵּן
  choice: она зачала и родила сына
  rationale: Прямо и естественно передаёт последовательность действий и краткость еврейского повествования.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: он назвал его Берия
  rationale: Естественный русский эквивалент еврейской формулы наречения имени; личное имя передано принятой библейской транслитерацией.
- source_word: כִּי בְרָעָה הָיְתָה בְּבֵיתוֹ
  choice: потому что беда постигла его дом
  rationale: בְרָעָה здесь обозначает бедствие или несчастье, а не нравственное зло. Глагольная формулировка по-русски естественно выражает несчастье, затронувшее дом как семью, хотя буквально сказано «беда была в его доме».
theological_decisions:
- issue: Значение בְרָעָה
  choice: беда
  alternative: зло
  rationale: Контекст смерти сыновей Ефрема указывает на несчастье или бедствие, а не на нравственное зло.
- issue: Значение בֵּיתוֹ
  choice: его дом
  alternative: его семья
  rationale: Сохранён образ «дома», который в еврейском может означать также домочадцев или семью; это не сужает выражение до здания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён до двух предложений ради естественности; сохранены эвфемизм супружеской близости, игра слов при наречении имени и образ дома как семьи.
