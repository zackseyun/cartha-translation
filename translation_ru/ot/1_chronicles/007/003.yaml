source:
  edition: WLC
  text: וּ/בְנֵ֥י עֻזִּ֖י יִֽזְרַֽחְיָ֑ה וּ/בְנֵ֣י יִֽזְרַֽחְיָ֗ה מִֽיכָאֵ֡ל וְ֠/עֹבַדְיָה וְ/יוֹאֵ֧ל יִשִּׁיָּ֛ה חֲמִשָּׁ֖ה רָאשִׁ֥ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: ru
  text: 'Сыновья Уззия: Израхия. Сыновья Израхии: Михаил, Овадия, Иоиль и Ишшия — пятеро, и все они главы[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пять предводителей» или «пять глав родов». Буквально по-еврейски: «пять глав, все они».'
    reason: Слово רָאשִׁים буквально означает «главы», но в генеалогическом контексте может обозначать предводителей или глав родов.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Стандартная генеалогическая формула; союз ו передан через последовательность фраз, поскольку повторение «и сыновья» в современном русском перечне звучало бы тяжеловесно.
- source_word: עֻזִּי
  choice: Уззий
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: יִזְרַחְיָה
  choice: Израхия
  rationale: Транслитерация личного имени, последовательно сохранённая в обоих употреблениях.
- source_word: מִיכָאֵל
  choice: Михаил
  rationale: Традиционная русская форма библейского личного имени.
- source_word: וְעֹבַדְיָה
  choice: Овадия
  rationale: Русская транслитерация имени; союз выражен синтаксисом перечисления.
- source_word: וְיוֹאֵל
  choice: Иоиль
  rationale: Традиционная русская форма библейского личного имени.
- source_word: יִשִּׁיָּה
  choice: Ишшия
  rationale: Передача удвоенного согласного в масоретской форме имени при сохранении естественного русского написания.
- source_word: חֲמִשָּׁה
  choice: пятеро
  rationale: Собирательное числительное естественно обозначает группу мужчин и сохраняет указание текста на общее число пять, хотя после Израхии названы четыре имени.
- source_word: רָאשִׁים
  choice: главы
  rationale: Сохранён буквальный образ «главы» и его возможный смысл руководителей родов без внесения уточнения в основной текст.
- source_word: כֻּלָּם
  choice: все они
  rationale: Передаёт эмфатическое обобщение, относящееся ко всем пяти.
theological_decisions: []
