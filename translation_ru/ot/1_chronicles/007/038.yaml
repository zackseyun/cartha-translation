lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма בְּנֵי — сопряжённое множественное число от «сын»; в родословном перечне естественно передаётся формулой «сыновья». Начальный союз וּ в русском перечне можно не выражать отдельно.
- source_word: יֶתֶר
  choice: Иефера
  rationale: Личное имя передано в принятой русской библейской форме «Иефер» и поставлено в родительный падеж после слова «сыновья».
- source_word: יְפֻנֶּה
  choice: Иефунния
  rationale: Использована традиционная русская форма этого еврейского личного имени.
- source_word: וּפִסְפָּה
  choice: Фиспа
  rationale: Личное имя передано транслитерацией, естественной для русской библейской традиции; присоединённый союз выражен структурой перечисления.
- source_word: וַאְרָא
  choice: и Ара
  rationale: Слово понято как личное имя в родословном перечне; присоединённый союз передан русским «и» перед последним элементом списка.
