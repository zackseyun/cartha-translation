lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: Сыновья Неффалима
  rationale: Конструктивное сочетание буквально обозначает «сыновья Неффалима»; здесь перечислены четыре мужчины, поэтому более широкое «потомки» не требуется.
- source_word: יַחֲצִיאֵל
  choice: Иахциил
  rationale: Имя передано современной русской библейской транслитерацией, сохраняющей согласный состав еврейской формы.
- source_word: גוּנִי
  choice: Гуни
  rationale: Прямая транслитерация еврейского личного имени.
- source_word: יֵצֶר
  choice: Иецер
  rationale: Транслитерация личного имени с передачей начального йода через «И» и сохранением звука цади.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Перевод следует форме масоретского текста Паралипоменон; отличающаяся форма в Бытии отмечена в сноске.
- source_word: בְּנֵי בִלְהָה
  choice: сыновья Валлы
  rationale: Заключительное генеалогическое пояснение сохранено как приложение к перечню; имя передано в принятой русской библейской форме.
