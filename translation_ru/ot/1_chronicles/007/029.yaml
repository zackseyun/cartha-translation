base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: ru
  text: У границ владений потомков Манассии[a] находились Бет-Шеан и его окрестные поселения[b], Таанах и его окрестные поселения, Мегиддо и его окрестные поселения, Дор и его окрестные поселения. В этих местах жили потомки Иосифа, сына Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рядом с потомками Манассии». Древнееврейская идиома буквально означает «у стороны»; в данном территориальном перечне она указывает на прилегание к территории или границе Манассии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и его дочери». В географических перечнях так называются поселения, относящиеся к главному городу; возможный перевод: «дочерние города» или «окрестные селения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יְדֵי בְנֵי מְנַשֶּׁה
  choice: Вдоль границ владений потомков Манассии
  rationale: Идиома עַל יְדֵי в данном территориальном перечне указывает на соседство или прохождение вдоль границы, а не на буквальные «руки». Слово «владений» добавлено для естественной передачи подразумеваемой территории; неоднозначность отмечена в сноске.
- source_word: בְנֵי מְנַשֶּׁה
  choice: потомков Манассии
  rationale: В племенном и территориальном контексте בנים обозначает не только непосредственных сыновей, но и потомков, составляющих колено.
- source_word: בֵּית שְׁאָן
  choice: Бет-Шеан
  rationale: Передача топонима по масоретской форме с использованием понятной современной русской транслитерации.
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: с зависимыми от него поселениями
  rationale: Буквально «и её дочери»; в географических перечнях это устойчивое обозначение небольших поселений, административно или территориально зависимых от главного города. Местоимение согласовано с русским словом «город», подразумеваемым в названиях.
- source_word: תַּעְנַךְ
  choice: Таанах
  rationale: Современная русская передача древнееврейского топонима.
- source_word: מְגִדּוֹ
  choice: Мегиддо
  rationale: Устоявшаяся русская передача топонима.
- source_word: דּוֹר
  choice: Дор
  rationale: Устоявшаяся русская передача топонима.
- source_word: בְּאֵלֶּה
  choice: В этих местах
  rationale: Указательное выражение отсылает к перечисленным городам и их поселениям; добавление «местах» делает русскую фразу ясной, не сужая референцию до одних главных городов.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: Глагол обозначает проживание или обитание; «жили» естественно для современного русского языка и не привносит акцента на первоначальное заселение.
- source_word: בְּנֵי יוֹסֵף
  choice: потомки Иосифа
  rationale: В контексте племён Израиля выражение обозначает потомков Иосифа, а не только его непосредственных сыновей.
- source_word: בֶּן יִשְׂרָאֵל
  choice: сына Израиля
  rationale: Сохранено родословное приложение, отождествляющее Иосифа как сына Израиля.
