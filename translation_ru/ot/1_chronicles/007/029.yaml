translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского историко-географического перечня. Повтор формулы о зависимых поселениях сохранён, чтобы отразить структуру древнееврейского текста; родоплеменное «сыновья» передано как «потомки» ради ясности для обычного читателя.
