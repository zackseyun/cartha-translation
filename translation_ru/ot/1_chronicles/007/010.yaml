- source_word: יְדִיעֲאֵל
  choice: Иедиаил
  rationale: Имя передано в привычной русской библейской форме, близкой к древнееврейскому звучанию.
- source_word: בִּלְהָן
  choice: Билган
  rationale: Собственное имя транслитерировано с передачей ה как «г» по традиции русских библейских имён.
- source_word: וּבְנֵי בִלְהָן
  choice: 'Сыновья Билгана:'
  rationale: Повтор генеалогической формулы сохранён, но начальный союз опущен ради естественного русского синтаксиса.
- source_word: יעיש
  choice: Иеуш
  rationale: Необычная форма, вероятно, обозначает известное имя יְעוּשׁ; это отражено в тексте, а формальная неопределённость отмечена сноской.
- source_word: וּבִנְיָמִן
  choice: Вениамин
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: וְאֵהוּד
  choice: Аод
  rationale: Использована узнаваемая традиционная русская библейская форма имени Эхуд.
- source_word: וּכְנַעֲנָה
  choice: Хенаана
  rationale: Имя передано как собственное имя, а не как этноним или название земли Ханаан.
- source_word: וְזֵיתָן
  choice: Зефан
  rationale: Выбрана традиционная русская библейская форма этого личного имени.
- source_word: וְתַרְשִׁישׁ
  choice: Фарсис
  rationale: В данном генеалогическом контексте это личное имя; использована устоявшаяся русская библейская форма.
- source_word: וַאֲחִישָׁחַר
  choice: Ахишахар
  rationale: Имя транслитерировано непосредственно с древнееврейской формы אֲחִישָׁחַר.
