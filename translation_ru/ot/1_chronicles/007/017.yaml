base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: ru
  text: 'Сыновья Улама: Бедан. Это сыновья Галаада, сына Махира[a], сына Манассии.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Это сыновья Галаада…». Возможно, эта фраза подводит итог родословной и связывает линию Улама с Галаадом, Махиром и Манассией.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Сыновья
  rationale: В русской генеалогической записи начальный союз ו естественно не выражать; בְנֵי передано обычной формулой «сыновья».
- source_word: אוּלָם
  choice: Улам
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: בְּדָן
  choice: Бедан
  rationale: Личное имя транслитерировано как «Бедан».
- source_word: אֵלֶּה
  choice: Это
  rationale: Именная древнееврейская конструкция допускает подразумеваемую связку; русское «это» сохраняет неопределённость времени между «это есть» и «это были».
- source_word: בְּנֵי גִלְעָד
  choice: сыновья Галаада
  rationale: Сохранена формальная генеалогическая идиома «сыновья», а не более широкое толкование «потомки».
- source_word: בֶּן מָכִיר
  choice: сына Махира
  rationale: Стандартная генеалогическая связь передана буквально; падеж согласован с именем «Галаада».
- source_word: בֶּן מְנַשֶּׁה
  choice: сына Манассии
  rationale: Стандартная генеалогическая связь передана буквально с традиционной русской формой имени.
theological_decisions:
- issue: Связь итоговой формулы с предшествующей линией Улама
  choice: Сохранена формулировка «Это сыновья Галаада» без уточнения степени родства.
  alternative: «Это потомки Галаада» или явное пояснение, что линия Улама восходит к Галааду.
  rationale: Древнееврейский текст формально говорит «сыновья Галаада»; вероятная функция генеалогического обобщения отмечена в сноске, но не внесена как однозначное толкование в основной текст.
translation_notes:
  register: Современный литературный русский с краткой, достойной генеалогической формой. Традиционные русские формы библейских имён сохранены. Временная неоднозначность безглагольного אֵלֶּה בְּנֵי передана словом «это».
