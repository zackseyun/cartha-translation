base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: ru
  text: 'Их владения и поселения: Вефиль с зависимыми от него селениями[b], на востоке — Нааран[a], а на западе — Гезер с зависимыми от него селениями, Сихем с зависимыми от него селениями вплоть до Айи[c] с зависимыми от неё селениями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых переводах и связанных традициях названия это место именуется «Наара».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «с её дочерьми». Это древнееврейское выражение обозначает меньшие зависимые города или селения, относившиеся к главному городу.'
    reason: cultural_note
  - marker: c
    text: В еврейском тексте — «Айя»; некоторые древние текстовые свидетели и переводы отражают название «Газа».
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: их владениями
  rationale: Слово обозначает земельное владение, что соответствует следующему далее перечню городов и зависимых поселений; множественное число естественно передаёт собирательный смысл в русском контексте.
- source_word: מֹשְׁבוֹתָם
  choice: поселениями
  rationale: В данном территориальном перечне речь идёт о населённых местах, а не просто о жилищах отдельных людей.
- source_word: בְנֹתֶיהָ
  choice: зависимыми от него/неё селениями
  rationale: Буквально «её дочерьми»; это древнееврейская идиома, обозначающая небольшие населённые пункты, административно или территориально связанные с главным городом.
- source_word: לַמִּזְרָח / לַמַּעֲרָב
  choice: на востоке / на западе
  rationale: Естественно передаёт парные указания направления в описании территории.
- source_word: נַעֲרָן
  choice: Нааран
  rationale: Передаёт огласованную форму масоретского текста; иная традиция названия отмечена в сноске.
- source_word: גֶּזֶר
  choice: Гезер
  rationale: Современная русская транслитерация древнееврейского названия без замены гласной по поздней традиции.
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Устоявшаяся русская библейская форма названия.
- source_word: עַד
  choice: вплоть до
  rationale: Выражает предел перечисляемой территории и естественно звучит в русском географическом описании.
- source_word: עַיָּה
  choice: Айя
  rationale: Передаёт чтение масоретского текста; вариант древних свидетелей не внесён в основной текст, а сохранён в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского географического перечня. Повтор формулы «с зависимыми от него селениями» сохраняет структуру исходного текста, а тире ясно оформляют противопоставление восточной и западной сторон.
