lexical_decisions:
- source_word: רֶפַח
  choice: Рефах
  rationale: Личное имя передано русской транслитерацией; конечная ח обозначена как «х».
- source_word: בְּנוֹ
  choice: его сын
  rationale: Существительное «сын» с местоименным суффиксом 3-го лица мужского рода единственного числа; повтор формулы сохранён с естественным для русского порядком слов.
- source_word: רֶשֶׁף
  choice: Решеф
  rationale: В родословной это личное имя, поэтому оно транслитерировано, а не переведено по возможным нарицательным значениям слова.
- source_word: תֶלַח
  choice: Телах
  rationale: Личное имя передано русской транслитерацией.
- source_word: תַחַן
  choice: Тахан
  rationale: Личное имя передано русской транслитерацией.
- source_word: וְ
  choice: затем; а
  rationale: Союз связывает звенья родословной; русские связки и пунктуация делают отношения последовательности понятными, не добавляя глагола в исходный текст.
theological_decisions:
- issue: Связь Решефа с соседними именами в эллиптической родословной
  choice: Сохранить Решефа как отдельное звено списка, обозначив продолжение словом «затем»
  alternative: Понять Решефа как второго сына Рефаха или прямо вставить формулу «его сын Решеф»
  rationale: В еврейском тексте после רֶשֶׁף нет בְּנוֹ, поэтому точная генеалогическая связь выражена менее явно, чем у остальных имён; перевод не должен категорически добавлять отсутствующую формулу.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Пунктуация помогает прочитать эллиптическую генеалогическую цепочку, а примечание объясняет отсутствие явного глагола.
