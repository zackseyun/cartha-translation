base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: ru
  text: 'И сыновья Бехера: Земира, Иоаш, Элиезер, Элиоэнай, Омри, Иеремот[a], Авия, Анафот и Алемет. Все они — сыновья Бехера.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Иеремот также передают как «Иеримот».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сохраняет присоединительный союз и обычную для родословий формулу; «сыновья» точнее более широкого «дети».
- source_word: בֶכֶר
  choice: Бехер
  rationale: Традиционная русская библейская передача личного имени.
- source_word: זְמִירָה
  choice: Земира
  rationale: Передача личного имени с учетом еврейской огласовки и русской библейской традиции.
- source_word: יוֹעָשׁ
  choice: Иоаш
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: אֱלִיעֶזֶר
  choice: Элиезер
  rationale: Прямая и узнаваемая русская транслитерация личного имени.
- source_word: אֶלְיוֹעֵינַי
  choice: Элиоэнай
  rationale: Передает состав и звучание еврейского имени в естественной русской форме.
- source_word: עָמְרִי
  choice: Омри
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: יְרֵמוֹת
  choice: Иремоф
  rationale: Традиционная русская библейская форма; вариант «Иеримоф» отмечен в сноске ввиду возможной иной передачи огласовки.
- source_word: אֲבִיָּה
  choice: Авия
  rationale: Устоявшаяся русская библейская форма имени, соответствующая еврейскому אֲבִיָּה.
- source_word: עֲנָתוֹת
  choice: Анафоф
  rationale: В данном родословном контексте это личное имя; использована традиционная русская передача.
- source_word: עָלָמֶת
  choice: Алемет
  rationale: Транслитерация личного имени по еврейской огласовке, адаптированная к русскому написанию.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественная русская итоговая формула, ясно отсылающая ко всем перечисленным лицам.
