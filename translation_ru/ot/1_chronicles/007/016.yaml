  source_fidelity: 'В целом перевод точно передаёт еврейский текст. Однако заключительная конструкция «а его сыновей — Улам и Рекем» грамматически неверна: после тире названы подлежащие, поэтому требуется именительный падеж «сыновья». Притяжательный суффикс в וּבָנָיו в данном генеалогическом контексте естественно относится к непосредственно названному Шерешу; специальная сноска, объявляющая это место неясным, не требуется и создаёт необоснованную текстологическую неопределённость.'
