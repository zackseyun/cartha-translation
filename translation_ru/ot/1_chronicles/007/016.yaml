base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: ru
  text: Мааха, жена Махира, родила сына и назвала его Перешем. Его брата звали Шереш. А его сыновья — Улам и Рекем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Обычная и точная передача глагола ילד в родословном сообщении.
- source_word: אֵשֶׁת מָכִיר
  choice: жена Махира
  rationale: Сохраняет указание на родственную связь и естественно звучит по-русски как приложение к имени Мааха.
- source_word: בֵּן
  choice: сына
  rationale: Еврейское существительное стоит в единственном числе и обозначает ребёнка мужского пола, имя которого сообщается далее.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: назвала его
  rationale: Естественная современная русская передача еврейской идиомы «назвала его имя», без изменения смысла.
- source_word: פֶּרֶשׁ
  choice: Переш
  rationale: Личное имя передано транслитерацией с еврейского.
- source_word: וְשֵׁם אָחִיו שָׁרֶשׁ
  choice: Его брата звали Шереш
  rationale: Идиоматично передаёт еврейскую именную конструкцию «имя его брата — Шереш», сохраняя родословный регистр.
- source_word: וּבָנָיו
  choice: а его сыновей
  rationale: Передаёт мужской род существительного בנים и сохраняет неоднозначность местоименного отнесения.
- source_word: אוּלָם וָרָקֶם
  choice: Улам и Рекем
  rationale: Личные имена транслитерированы с еврейского; союз передан естественным русским «и».
theological_decisions:
- issue: К кому относится местоимение в וּבָנָיו («его сыновья»)?
  choice: Неоднозначность сохранена в основном тексте и отмечена сноской.
  alternative: Однозначно отнести сыновей к Шерешу как к ближайшему упомянутому мужчине.
  rationale: Форма местоимения сама по себе допускает отнесение как к Шерешу, так и к Перешу; контекст не устраняет эту неоднозначность полностью.
translation_notes:
  register: Современный литературный русский язык с кратким родословным стилем. Конструкция «назвала его Перешем» предпочтена буквальному, но менее естественному «нарекла ему имя Переш». Имена последовательно транслитерированы с еврейского.
