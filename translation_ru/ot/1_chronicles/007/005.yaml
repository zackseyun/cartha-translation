base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: ru
  text: А их родичи[a] во всех родах Иссахара были доблестными воинами; внесённых в родословные списки[b] было всего восемьдесят семь тысяч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «братья»; в родословном контексте это слово может означать также родичей.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зарегистрированных по родословиям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: А их соплеменники
  rationale: Буквально «их братья», но в родословном контексте אָח может обозначать более широкий круг родичей; «соплеменники» естественно связывает их со всем коленом Иссахара, а буквальное значение сохраняется в сноске.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָּׂשכָר
  choice: во всех родах Иссахара
  rationale: Передаёт охват всех родовых подразделений колена; «роды» соответствует генеалогическому контексту מִשְׁפָּחוֹת.
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: доблестные воины
  rationale: Устойчивое сочетание обозначает сильных, испытанных воинов; современная формулировка сохраняет военный и оценочный оттенки.
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף ... לַכֹּל
  choice: всего восемьдесят семь тысяч
  rationale: Естественно передаёт итоговое число и суммирующую функцию לַכֹּל.
- source_word: הִתְיַחְשָׂם
  choice: внесённых в родословные списки
  rationale: Форма от יחשׂ указывает на генеалогический учёт или регистрацию; выбранная формулировка ясно передаёт административно-родословный смысл.
