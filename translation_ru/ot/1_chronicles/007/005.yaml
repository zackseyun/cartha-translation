- from: А их соплеменники[a] во всех родах Иссахара — доблестные воины, всего восемьдесят семь тысяч, внесённых в родословные списки[b].
  to: А их родичи[a] во всех родах Иссахара были доблестными воинами; внесённых в родословные списки[b] было всего восемьдесят семь тысяч.
