  text: וּ/בִתּ֣/וֹ שֶׁאֱרָ֔ה וַ/תִּ֧בֶן אֶת בֵּית חוֹר֛וֹן הַ/תַּחְתּ֖וֹן וְ/אֶת הָ/עֶלְי֑וֹן וְ/אֵ֖ת אֻזֵּ֥ן שֶׁאֱרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/024.yaml
  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: ru
  text: Его дочерью была Шеера[a]. Она построила Нижний Беф-Хорон и Верхний Беф-Хорон[b], а также Уззен-Шееру.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «и его дочь Шеера».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и Верхний»; название «Беф-Хорон» подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ
  choice: Его дочерью была
  rationale: Буквально «и его дочь». В контексте родословия именная конструкция «Его дочерью была Шеера» естественно передаёт родственную связь и называет дочь, тогда как союз в русском можно не воспроизводить.
- source_word: שֶׁאֱרָה
  choice: Шеера
  rationale: Личное имя передано транслитерацией с еврейского, без истолкования его возможного значения.
- source_word: וַתִּבֶן
  choice: Она построила
  rationale: Глагол בנה обычно означает «строить». Перевод не уточняет без достаточных оснований, были ли эти города основаны, отстроены или укреплены.
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: Нижний Беф-Хорон
  rationale: Название места передано в принятой русской библейской форме «Беф-Хорон», а определение הַתַּחְתּוֹן — естественным русским прилагательным «Нижний».
- source_word: הָעֶלְיוֹן
  choice: Верхний Беф-Хорон
  rationale: В еврейском тексте буквально сказано «и верхний»; название Беф-Хорон подразумевается из предыдущего словосочетания и восполнено для ясности.
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: Уззен-Шееру
  rationale: Составной топоним передан через дефис; винительный падеж естественно включён в русское предложение.
theological_decisions: []
