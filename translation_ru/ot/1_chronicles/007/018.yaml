  yaml_path: translation/ot/1_chronicles/007/018.yaml
  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: ru
  text: Его сестра Гаммолехет[a] родила Ишгода, Авиезера и Махлу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. Гаммолехет; возможно также: «Молехет». По форме имя связано со словом, означающим «царица» или «правительница», но здесь его лучше понимать как личное имя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: Его сестра
  rationale: Существительное с суффиксом 3-го лица мужского рода единственного числа означает «его сестра». Союз ו связывает стих с предшествующей родословной, но по-русски его можно не передавать ради естественности.
- source_word: הַמֹּלֶכֶת
  choice: Гаммолехет
  rationale: В родословном контексте форма употреблена как личное имя. Транслитерация сохраняет начальный элемент, соответствующий еврейскому артиклю, вошедшему в форму имени.
- source_word: יָלְדָה
  choice: родила
  rationale: Женская форма глагола ילד прямо указывает на материнство; «родила» естественно и точно передаёт смысл в русской родословной формуле.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Частица обозначает определённое прямое дополнение и не имеет отдельного соответствия в русском тексте.
- source_word: אִישְׁהוֹד
  choice: Ишгод
  rationale: Личное имя передано транслитерацией; буква ה после ש здесь отражена как «г», согласно традиционной передаче еврейского согласного he в составе имени.
- source_word: אֲבִיעֶזֶר
  choice: Авиезер
  rationale: Личное имя передано в привычной русской библейской форме.
- source_word: מַחְלָה
  choice: Махла
  rationale: Личное имя передано прямой транслитерацией с учётом традиционной русской передачи ח как «х».
