lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: Но ... было
  rationale: Первое וַיְהִי передаёт развитие повествования с лёгким противопоставлением предыдущему решению Давида; второе естественно входит в русскую формулу «было слово...». Так сохраняется связь с контекстом без тяжеловесного повтора.
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту ночь
  rationale: Естественное русское временное выражение, сохраняющее указательное значение הַהוּא.
- source_word: דְּבַר אֱלֹהִים
  choice: слово Бога
  rationale: Формальная передача сочетания в контексте пророческого откровения; сохраняет значение «слово», не сводя его однозначно к «сообщению».
- source_word: אֱלֹהִים
  choice: Бога
  rationale: Здесь форма обозначает единого Бога Израиля; родительный падеж обусловлен сочетанием «слово Бога».
- source_word: אֶל נָתָן
  choice: к Нафану
  rationale: Предлог אֶל указывает на адресата; «к Нафану» соответствует традиционной и естественной русской формуле откровения.
- source_word: לֵאמֹר
  choice: ':'
  rationale: В еврейском повествовании инфинитив вводит прямую речь. В современном русском перед последующей репликой эту функцию естественно выполняет двоеточие, без избыточного «говоря».
theological_decisions:
- issue: Передача формулы откровения דְּבַר אֱלֹהִים
  choice: слово Бога
  alternative: слово от Бога
  rationale: Основной вариант сохраняет формальную конструкцию и вес пророческой формулы. Альтернатива возможна по смыслу, но несколько явнее истолковывает отношение как источник; она приведена в сноске, чтобы сохранить лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Формула «было слово Бога к Нафану» намеренно слегка возвышенная и сохраняет структуру пророческого откровения; לֵאמֹר передано пунктуационно как естественное введение прямой речи.
