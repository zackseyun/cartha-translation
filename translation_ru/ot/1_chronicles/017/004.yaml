  text: לֵ֤ךְ וְ/אָמַרְתָּ֙ אֶל דָּוִ֣יד עַבְדִּ֔/י כֹּ֖ה אָמַ֣ר יְהוָ֑ה לֹ֥א אַתָּ֛ה תִּבְנֶה לִּ֥/י הַ/בַּ֖יִת לָ/שָֽׁבֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: ru
  text: '«Пойди и скажи Давиду, Моему слуге: „Так говорит Яхве: не ты[a] построишь Мне дом, чтобы Я обитал в нём“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не ты построишь Мне дом для обитания». Местоимение «ты» подчёркнуто. «Дом» здесь означает предназначенное для Яхве святилище, то есть храм.'
    reason: Уточняет эмфатическое местоимение, сохраняет буквальную конструкцию и поясняет контекстуальное значение слова «дом».
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: Пойди и скажи
  rationale: Повелительное לֵךְ и следующий перфект с союзом образуют последовательность повелений; это естественно передаётся по-русски двумя формами повелительного наклонения.
- source_word: דָּוִיד עַבְדִּי
  choice: Моему слуге Давиду
  rationale: עֶבֶד в обращении к Давиду обозначает служителя Яхве, а не подчёркивает подневольное состояние; русский порядок слов звучит естественно и сохраняет принадлежность «Моему».
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена традиционная пророческая формула в настоящем времени и передано собственное имя יהוה.
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: не ты построишь
  rationale: 'Отдельное местоимение אַתָּה несёт контрастное ударение: речь не только о запрете, но прежде всего о том, что строителем будет не Давид.'
- source_word: לִּי הַבַּיִת
  choice: Мне дом
  rationale: «Дом» буквально передаёт בַּיִת и в контексте означает святилище, не подменяя образ более узким словом «храм».
- source_word: לָשָׁבֶת
  choice: для обитания
  rationale: Инфинитив выражает назначение дома. Формулировка сохраняет намеренную компактность оригинала и не добавляет отсутствующего в еврейском тексте явного субъекта обитания.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон, поэтому собственное имя передано непосредственно, без замены титулом.
- issue: Смысл отрицания לֹא אַתָּה תִּבְנֶה
  choice: не ты построишь
  alternative: ты не должен строить / ты не построишь
  rationale: Выдвинутое местоимение подчёркивает личность строителя. Выбранный вариант сохраняет этот контраст и не сводит высказывание к простому запрету.
- issue: Значение הַבַּיִת
  choice: дом
  alternative: храм
  rationale: Хотя в контексте имеется в виду храм, исходный текст употребляет слово «дом»; его образная и богословская напряжённость сохранена.
- issue: Субъект при לָשָׁבֶת
  choice: для обитания
  alternative: чтобы Мне обитать в нём
  rationale: Еврейский инфинитив не называет субъект явно. Нейтральная конструкция не устраняет эту грамматическую неоднозначность, хотя контекст связывает дом с обитанием Яхве.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краток и близок к еврейскому; архаизмы устранены. Контрастное «не ты» сохраняет акцент оригинала, а «для обитания» не добавляет явно не названного субъекта инфинитива.
