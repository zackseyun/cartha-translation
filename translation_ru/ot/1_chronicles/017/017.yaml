  to: И это было малым в Твоих глазах, Боже; и Ты говорил о доме раба Твоего на далёкое будущее и отнёсся ко мне как к человеку высокого положения[a], Яхве, Боже!
  rationale: Исправление устраняет добавленное значение «ещё», делает русский синтаксис и лексику более современными и естественными, а также сохраняет неоднозначность заключительной еврейской фразы посредством сноски. Смысл обещания дому Давида и возвышенного отношения к Давиду не изменён.
