base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: ru
  text: И это было малым в Твоих глазах, Боже; и Ты говорил о доме раба Твоего на далёкое будущее и отнёсся ко мне как к человеку высокого положения[a], Яхве, Боже!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и показал мне будущие поколения людей»; или: «и увидел меня по чину возвышенного человека». Заключительная фраза в еврейском тексте трудна и допускает несколько толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת בְּעֵינֶיךָ
  choice: И это показалось малым в Твоих глазах
  rationale: 'Сохраняет еврейскую оценочную идиому и значение корня קטן: сказанное прежде представлялось Богу малым, то есть недостаточным по сравнению с дальнейшим обещанием.'
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения естественно передаёт вокатив в молитве Давида.
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: Ты ещё говорил о доме раба Твоего
  rationale: Глагол передан основным значением «говорить», без внесения более узкого толкования «обещать»; «ещё» выражает присоединительную силу וַ в контексте.
- source_word: לְמֵרָחוֹק
  choice: на далёкое будущее
  rationale: В данном контексте пространственное «вдаль» имеет временной смысл и указывает на отдалённую судьбу дома Давида.
- source_word: וּרְאִיתַנִי
  choice: и воззрел на меня
  rationale: Сохраняет образ глагола ראה и допускает смысл благосклонного отношения или рассмотрения, не сводя его к простому зрительному восприятию.
- source_word: כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: как на человека высокого положения
  rationale: 'Это осторожная контекстуальная передача трудной фразы: תור может обозначать порядок или ранг, а המעלה — возвышенность или высокий статус. Неопределённость отмечена в сноске.'
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Боже
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а אֱלֹהִים — звательной формой «Боже».
theological_decisions:
- issue: Смысл трудной заключительной фразы וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: и воззрел на меня как на человека высокого положения
  alternative: «и показал мне будущие поколения людей»; «и воззрел на меня по чину возвышенного человека»
  rationale: Масоретский текст устойчив, но сочетание תור האדם המעלה семантически неясно. Основной текст передаёт вероятную мысль о возвышенном положении, тогда как иные допустимые понимания сохранены в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис близок к еврейскому, но остаётся понятным современному читателю; трудная заключительная фраза не представлена как однозначная.
