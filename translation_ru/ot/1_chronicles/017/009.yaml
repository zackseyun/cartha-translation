  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: ru
  text: И Я определю место для Моего народа Израиля, посажу его[a], и он будет жить на своём месте[b] и больше не будет знать тревог. Беззаконники[c] больше не будут изнурять его, как прежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «насажу его»; Израиль представлен как единый народ, прочно укоренённый Богом.'
    reason: metaphor_and_collective_singular
  - marker: b
    text: 'Буквально: «под ним»; в данном контексте смысл — на отведённом ему месте.'
    reason: idiomatic_rendering
  - marker: c
    text: 'Буквально: «сыны беззакония».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: определю место
  rationale: Глагол שׂים имеет основное значение «поместить, установить»; в сочетании с «местом для народа» речь идёт о назначении Богом определённого места.
- source_word: וּנְטַעְתִּיהוּ
  choice: посажу его
  rationale: Сохранён образ «посадки», выражающий прочное укоренение. Единственное число согласовано с собирательным существительным «народ».
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: он будет жить на своём месте
  rationale: Форма единственного числа относится к Израилю как к единому народу. Буквальное «под собой» в данном контексте идиоматически передаёт пребывание на закреплённом за ним месте.
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: больше не будет знать тревог
  rationale: רגז обозначает дрожь, волнение или потрясение; русский оборот естественно передаёт отсутствие тревожащих и расшатывающих народ бедствий.
- source_word: בְנֵי עַוְלָה
  choice: люди беззакония
  rationale: Еврейская конструкция буквально означает «сыны беззакония». «Люди беззакония» сохраняет нравственную характеристику, но звучит яснее по-русски.
- source_word: לְבַלֹּתוֹ
  choice: изнурять его
  rationale: Форма глагола בלה выражает длительное истощение, изматывание или угнетение; «изнурять» передаёт этот оттенок.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: как прежде
  rationale: Кратко и естественно указывает на прежние времена притеснения Израиля, не уточняя период сверх сказанного в тексте.
theological_decisions:
- issue: Собирательное обозначение Израиля формами единственного числа
  choice: Передать Израиль как единый народ местоимениями «его» и «он».
  alternative: 'Использовать множественное число: «их», «они».'
  rationale: В еврейском тексте местоименные суффиксы и глаголы стоят в единственном числе и относятся к עַמִּי, «Моему народу». В русском языке такое согласование одновременно естественно и формально близко источнику.
- issue: Образ насаждения Израиля
  choice: Сохранить метафору «посажу».
  alternative: 'Передать смысл без образа: «прочно поселю».'
  rationale: Образ понятен по-русски и подчёркивает установленность и устойчивость народа, не добавляя богословских уточнений.
- issue: Значение תַּחְתָּיו
  choice: Передать как «на своём месте».
  alternative: 'Буквально: «под собой».'
  rationale: Буквальный вариант по-русски непонятен; контекст обещания безопасности указывает на устойчивое пребывание народа на отведённом ему месте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Начальное «И» и прописные местоимения, относящиеся к Богу, сохранены в соответствии с русской библейской традицией; архаизмы по возможности исключены.
