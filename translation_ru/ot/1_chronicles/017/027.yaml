  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: ru
  text: И теперь Ты благоволил[a] благословить дом[b] раба Твоего, чтобы он вечно пребывал пред Тобой; ведь Ты, Яхве, благословил его, и он благословен навеки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соизволил благословить», «согласился благословить» или «предпринял благословить».'
    reason: lexical_alternative
  - marker: b
    text: «Дом» здесь, вероятно, подразумевает прежде всего династию, а не только жилище.
    reason: cultural_note
  - marker: c
    text: 'Или: «и да будет он благословен навеки». Еврейскую форму иногда понимают как пожелание, хотя пассивное причастие естественнее читать как утверждение о непреходящем состоянии благословения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как соединительный וְ, так и временно-дискурсивное עַתָּה.
- source_word: הוֹאַלְתָּ
  choice: Ты благоволил
  rationale: Передаёт добровольное и милостивое согласие Бога; соответствует возвышенному контексту молитвы и не сводит значение к механическому «предпринял».
- source_word: לְבָרֵךְ
  choice: благословить
  rationale: Прямое и естественное соответствие инфинитиву ברך.
- source_word: בֵּית עַבְדְּךָ
  choice: дом раба Твоего
  rationale: 'Слово «дом» сохраняет присущую контексту широту: речь может идти не только о жилище или семье, но прежде всего о династии Давида.'
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: чтобы он вечно пребывал пред Тобой
  rationale: Передаёт целевой или результативный оттенок לִהְיוֹת и устойчивое существование дома в Божьем присутствии, не конкретизируя его сверх текста.
- source_word: כִּי
  choice: ведь
  rationale: Естественно вводит основание предшествующего утверждения в русской молитвенной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: בֵּרַכְתָּ
  choice: благословил
  rationale: Совершенный вид естественно передаёт завершённое действие, результат которого сохраняется.
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: и он благословен навеки
  rationale: Пассивное причастие естественнее всего понимать как утверждение о продолжающемся состоянии, возникшем вследствие Божьего благословения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя сохранено, а не заменено титулом.
- issue: Смысл заключительных слов וּמְבֹרָךְ לְעוֹלָם
  choice: 'утверждение результата: «и он благословен навеки»'
  alternative: 'пожелание: «и да будет он благословен навеки»; будущее: «и будет он благословен навеки»'
  rationale: Еврейский текст использует пассивное причастие, которое наиболее естественно обозначает устойчивое состояние. Вместе с тем контекст молитвы допускает понимание этих слов как пожелания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Слово «пред» выбрано вместо разговорно-нейтрального «перед» для краткости и достоинства, без архаизации синтаксиса.
