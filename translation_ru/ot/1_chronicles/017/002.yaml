  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: ru
  text: 'И сказал Нафан Давиду: «Сделай всё, что у тебя на сердце, потому что Бог с тобой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой глагола продолжает повествование; «И сказал» естественно для русского библейского повествования и сохраняет связь с контекстом.
- source_word: נָתָן
  choice: Нафан
  rationale: Традиционная русская библейская передача личного имени, соответствующая еврейскому נָתָן.
- source_word: אֶל דָּוִיד
  choice: Давиду
  rationale: Русский дательный падеж естественно передаёт адресата речи без отдельного предлога.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: всё, что у тебя на сердце
  rationale: Выражение охватывает намерения и замыслы Давида; образ сердца сохранён, а русская конструкция звучит естественно и не сужает значение до одних чувств.
- source_word: עֲשֵׂה
  choice: Сделай
  rationale: Прямой императив точно передаёт форму и широкий смысл глагола עשה в данном контексте.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание данного совета; «потому что» ясно выражает причинную связь в современном русском языке.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Здесь אֱלֹהִים с артиклем определённо указывает на Бога; по-русски имя-титул естественно передаётся без артикля.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Краткая и обычная русская передача выражения божественного присутствия и поддержки.
theological_decisions:
- issue: Передача הָאֱלֹהִים
  choice: Бог
  alternative: Господь
  rationale: В источнике стоит אֱלֹהִים, а не тетраграмматон יהוה, поэтому «Бог» сохраняет различие божественных наименований.
- issue: Смысл выражения «на сердце»
  choice: Сохранить образ сердца без поясняющей конкретизации
  alternative: всё, что ты задумал
  rationale: Еврейское לֵבָב может обозначать внутренний замысел, волю и мысль. Образное выражение по-русски понятно и сохраняет широту исходного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краткий и прямой; архаизмы не используются.
