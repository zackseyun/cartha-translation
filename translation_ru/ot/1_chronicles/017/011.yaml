source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: ru
  text: И когда исполнятся твои дни и ты отойдёшь к своим предкам[a], Я воздвигну после тебя твоего потомка, который будет одним из твоих сыновей, и утвержу его царство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пойдёшь со своими отцами» — еврейский оборот, означающий смерть и присоединение к умершим предкам.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Формула вводит будущее обстоятельство; по-русски временное значение естественно и точно передаётся сочетанием «И когда».
- source_word: מָלְאוּ יָמֶיךָ
  choice: исполнятся твои дни
  rationale: Сохраняет еврейский образ завершившегося срока жизни и торжественный тон, оставаясь понятным современному читателю.
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: ты отойдёшь к своим предкам
  rationale: Естественно передаёт эвфемистическое указание на смерть и приобщение к умершим предкам; буквальная особенность оборота отмечена в сноске.
- source_word: וַהֲקִימוֹתִי
  choice: Я воздвигну
  rationale: Глагол קום в породе hифиль означает, что Бог поставит преемника; «воздвигну» сохраняет династический и возвышенный оттенок и отличается от последующего הכין.
- source_word: זַרְעֲךָ
  choice: твоего потомка
  rationale: В данном контексте слово זרע грамматически допускает собирательность, но последующие местоимения и уточнение о сыновьях указывают на одного преемника; «потомок» естественно передаёт этот смысл.
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: который будет одним из твоих сыновей
  rationale: Передаёт относительное предложение и частичное значение предлога מן без неестественной кальки.
- source_word: וַהֲכִינוֹתִי אֶת מַלְכוּתוֹ
  choice: и утвержу его царство
  rationale: «Утвержу» передаёт значение прочного установления или упрочения царства и позволяет не смешивать הכין с ранее употреблённым קום.
theological_decisions:
- issue: Династическое обещание и возможное мессианское значение
  choice: Передать непосредственное обещание о потомке Давида из числа его сыновей, не добавляя мессианского титула.
  alternative: Сделать мессианское прочтение явным непосредственно в основном тексте.
  rationale: В стихе прямо говорится о преемнике Давида и утверждении его царства. Возможное дальнейшее мессианское развитие обещания должно следовать из более широкого канонического контекста, а не вноситься в перевод данного стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «воздвигну» и «утвержу» сохраняют торжественность обещания, не делая текст архаичным.
