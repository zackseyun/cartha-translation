id: 1CH.17.7
reference: 1 Chronicles 17:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: ru
  text: 'Итак, скажи Моему слуге Давиду: «Так говорит Яхве Воинств: Я взял тебя с пастбища[a], от овечьего стада, за которым ты ходил, чтобы ты стал правителем[b] Моего народа Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из овчарни».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вождём» или «князем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт переход к следующему поручению и возможный выводный оттенок сочетания союза וְ с наречием עַתָּה; по-русски звучит естественнее буквального «и теперь».
- source_word: כֹּה תֹאמַר
  choice: скажи
  rationale: Естественно передаёт предписывающую силу древнееврейской формулы; содержание повеления непосредственно следует далее.
- source_word: לְעַבְדִּי
  choice: Моему слуге
  rationale: В данном контексте עֶבֶד — почётное обозначение Давида как состоящего на служении Богу, а не акцент на подневольном положении.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устоявшаяся и ясная русская передача пророческой формулы; перфект אָמַר здесь вводит прямую речь перформативно.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Бога и широту титула צְבָאוֹת, который может обозначать воинства как земного, так и небесного порядка.
- source_word: לְקַחְתִּיךָ
  choice: Я взял тебя
  rationale: Прямая передача глагола לקח, подчёркивающая Божью инициативу в возвышении Давида.
- source_word: מִן הַנָּוֶה
  choice: с пастбища
  rationale: В пастушеском контексте נָוֶה естественно означает место выпаса; вариант «из овчарни» возможен, но более конкретен.
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: от овечьего стада, за которым ты ходил
  rationale: Сохраняет пространственно-пастушеский образ буквального «из-за/вслед за стадом», не сводя выражение лишь к обобщённому «пас овец».
- source_word: לִהְיוֹת נָגִיד
  choice: чтобы ты стал правителем
  rationale: Передаёт назначение на руководящую власть; «правитель» сохраняет смысл נָגִיד, не делая титул технически царским.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: Моего народа Израиля
  rationale: Естественный русский порядок слов сохраняет и принадлежность народа Богу, и его наименование — Израиль.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл обозначения Давида עַבְדִּי
  choice: Моему слуге
  alternative: Моему рабу
  rationale: Здесь выражение подчёркивает избранное служение Давида Богу и имеет почётно-заветный оттенок; «раб» сильнее выдвигал бы на первый план подневольный статус.
- issue: Объём титула צְבָאוֹת
  choice: Воинств
  alternative: небесных воинств; войск
  rationale: Обобщённая форма не ограничивает титул исключительно небесными силами или человеческими армиями и тем самым сохраняет смысловую широту оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные буквы в местоимениях, относящихся к Богу, употреблены в соответствии с русской библейской издательской традицией; обращённое к Давиду «тебя/ты» оставлено со строчной. Формулировка сохраняет пастушеский образ и не устраняет неоднозначность слов נָוֶה и נָגִיד.
