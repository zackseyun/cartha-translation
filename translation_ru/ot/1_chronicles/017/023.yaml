  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: ru
  text: И теперь, Яхве, пусть слово, которое Ты сказал о Твоём слуге и о его доме[a], утвердится навеки; сделай же так, как Ты сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его династии», «его роде». В данном контексте еврейское слово «дом» может обозначать семейство, род или царскую династию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и соединительный переход от предшествующей части молитвы, и временной оттенок еврейского выражения; при этом звучит естественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: הַדָּבָר אֲשֶׁר דִּבַּרְתָּ
  choice: слово, которое Ты сказал
  rationale: «Слово» непосредственно отражает הַדָּבָר и сохраняет связь с Божьей речью; «сказал» ясно и естественно передаёт דִּבַּרְתָּ в современной русской речи.
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: о Твоём слуге и о его доме
  rationale: Предлог עַל здесь указывает на содержание сказанного. Повтор «о» отражает еврейский параллелизм, а «дом» сохраняет многозначный заветный образ рода, семейства и династии.
- source_word: יֵאָמֵן
  choice: пусть … утвердится
  rationale: Нифаль глагола אמן выражает утверждение, упрочение или подтверждение. Эта формулировка передаёт просьбу о непреложном осуществлении Божьего слова, не сводя значение только к исполнению обещания.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткий и естественный для торжественной молитвы эквивалент выражения о непреходящей длительности.
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: сделай же так, как Ты сказал
  rationale: Передаёт прямую просьбу действовать согласно ранее сказанному; повтор «сказал» сохраняет словесную связь с первой частью стиха, а частица «же» естественно подчёркивает итоговое прошение.
theological_decisions:
- issue: Значение «его дома» в контексте завета с Давидом
  choice: Сохранить в основном тексте «его доме».
  alternative: «его династии» или «его роде»
  rationale: В контексте речь идёт не о жилище Давида, а о его семье, потомстве и царской линии. Однако еврейское «дом» намеренно ёмко и является важным образом повествования, поэтому более узкое толкование вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис сохраняет параллелизм и повтор исходного текста, но избегает устаревших форм «ныне», «да утвердится» и «рёк».
