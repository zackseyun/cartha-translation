base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: ru
  text: Я буду ему отцом[a], и он будет Мне сыном. Я не отниму у него Моей неизменной любви, как отнял её у того, кто был до тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я буду его Отцом, и он будет Моим сыном».'
    reason: lexical_alternative
  - marker: b
    text: «Тот, кто был до тебя» — Саул, предшественник Давида на царском престоле.
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Я буду ему Отцом
  rationale: Передаёт еврейскую конструкцию «буду ему отцом» естественно для современного русского языка и сохраняет прямой язык отношений отца и сына.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: и он будет Мне сыном
  rationale: Сохраняет синтаксический параллелизм первой части и заветный характер отношений, не заменяя образ истолковывающим пересказом.
- source_word: חַסְדִּי
  choice: Моей неизменной любви
  rationale: חֶסֶד обозначает верную, устойчивую любовь и благоволение в рамках заветных отношений. «Неизменная любовь» передаёт как любовь, так и её постоянство, не сводя значение лишь к милости или юридической верности.
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: не отниму у него
  rationale: Порода хифиль глагола סור здесь означает удаление или отнятие. Русское «отниму у него» естественно и позволяет точно повторить тот же глагольный образ в следующей части.
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: как отнял её
  rationale: Сохраняет лексический повтор с предшествующим «не отниму»; местоимение «её» ясно отсылает к неизменной любви.
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: у того, кто был до тебя
  rationale: Сохраняет косвенное обозначение предшественника Давида и передаёт временно-династический смысл выражения, не вставляя имя Саул в основной текст.
theological_decisions:
- issue: Отцовско-сыновний язык Давидова завета
  choice: Сохранить прямую формулировку «Я буду ему Отцом, и он будет Мне сыном»
  alternative: «Я буду заботиться о нём как отец, а он будет принадлежать Мне как сын»
  rationale: Исходный текст прямо утверждает отношения Отца и сына. Пересказ ослабил бы заветное царское сыновство и его дальнейшую библейско-богословскую значимость.
- issue: Значение חֶסֶד в контексте завета
  choice: «неизменная любовь»
  alternative: «милость»; «верность завету»; «милосердие»
  rationale: Выбранное выражение удерживает одновременно личную любовь и её устойчивую, верную природу, не ограничивая многозначное חֶסֶד только состраданием или обязательством.
- issue: Личность того, кто был до Давида
  choice: Не называть Саула в основном тексте, а пояснить в сноске
  alternative: «как отнял её у Саула, который был до тебя»
  rationale: Еврейский текст оставляет лицо неназванным. Перевод сохраняет эту форму выражения, тогда как историческая идентификация уместна в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в «Отцом», «Мне», «Моей» и «Моим» обозначают Бога и соответствуют принятой русской издательской традиции. Формулировка сохраняет параллелизм еврейского текста и повтор глагола «отнять».
