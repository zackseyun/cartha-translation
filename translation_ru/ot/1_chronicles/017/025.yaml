base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: ru
  text: Ведь Ты, Бог мой, открыл Твоему слуге[a], что построишь ему дом[b]. Поэтому Твой слуга осмелился помолиться пред Тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыл ухо Твоего слуги» — еврейское выражение со значением «открыл Твоему слуге».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утвердишь его династию»; «дом» здесь может означать также непрерывную царскую линию, род.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: открыл Своему слуге
  rationale: Буквально «открыл ухо Своего слуги» — еврейская идиома со значением «открыл, сообщил». Перевод передаёт смысл естественным современным русским языком; буквальный образ отмечен в сноске.
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: что построишь ему дом
  rationale: Инфинитив после формулы откровения выражает содержание сообщённого. Будущее время естественно передаёт обещанное Богом действие, а «построишь ему дом» сохраняет исходный образ и его смысловую многослойность.
- source_word: בָּיִת
  choice: дом
  rationale: Слово «дом» сохраняет метафору оригинала и допускает как значение дома или рода, так и контекстуальный династический смысл, не сводя текст только к одному толкованию.
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: осмелился помолиться
  rationale: Буквальная конструкция «нашёл… помолиться» в данном контексте выражает обретённую решимость или смелость. «Осмелился помолиться» кратко и естественно передаёт этот идиоматический смысл.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Традиционно-достоинная и понятная передача пространственно-реляционного выражения, указывающего на молитву в Божьем присутствии.
- source_word: עַבְדְּךָ
  choice: Твой слуга
  rationale: В царской молитве это почтительное самообозначение перед Богом. «Слуга» передаёт подчинённость и соответствует современному русскому регистру лучше, чем «раб», не исключая силы исходного понятия.
theological_decisions:
- issue: Значение слова «дом» в обещании Давиду
  choice: Сохранить «дом» в основном тексте, оставив династический смысл подразумеваемым
  alternative: Передать явно как «династия» или «царский род»
  rationale: В контексте обещания Давиду еврейское слово сохраняет многослойность. Буквальный образ «дома» связывает этот стих с предшествующей игрой смыслов и одновременно указывает на продолжительный царский род; явная замена на «династию» чрезмерно сузила бы образ.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический выбор русского религиозного регистра. Формула «пред Тобой» сохраняет возвышенный оттенок, оставаясь понятной современному читателю.
