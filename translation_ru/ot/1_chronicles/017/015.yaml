  yaml_path: translation/ot/1_chronicles/017/015.yaml
  text: According to all these words and according to all this vision[b][a], so Nathan spoke to David.
translation:
  language: ru
  text: Согласно всем этим словам и всему этому видению[a] Нафан так говорил Давиду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «откровению». Еврейское חָזוֹן может обозначать пророческое видение или данное свыше откровение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... וּכְכֹל
  choice: со всеми ... и со всем
  rationale: Конструкция с כְּ и כֹּל выражает соответствие всей полноте переданного содержания. В русском оборот «со всеми... и со всем...» в сочетании с «так и говорил» естественно передаёт эту соотнесённость и сохраняет параллелизм двух фраз.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דְּבָרִים допускает значения «слова», «дела» или «вещи», но здесь речь идёт о переданном Богом сообщении, поэтому «слова» наиболее точно передаёт словесное содержание откровения.
- source_word: הֶחָזוֹן הַזֶּה
  choice: всё это видение
  rationale: חָזוֹן обозначает пророческое видение или откровение. «Видение» — прямой и традиционно понятный русский эквивалент; возможный смысл «откровение» отмечен в сноске.
- source_word: כֵּן דִּבֶּר
  choice: так и говорил
  rationale: כֵּן указывает на точное соответствие сказанного полученному сообщению. Русское «так и говорил» передаёт это соответствие естественнее буквального «так говорил».
- source_word: נָתָן
  choice: Нафан
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: אֶל דָּוִיד
  choice: Давиду
  rationale: Направленность речи, выраженная אֶל, естественно передаётся русским дательным падежом.
