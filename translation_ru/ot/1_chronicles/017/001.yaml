base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: ru
  text: 'Когда Давид жил в своём доме, он сказал пророку Нафану: «Вот я живу в кедровом доме, а ковчег завета Яхве находится под полотнищами[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под полотнищами шатра». Еврейское слово обозначает тканевые полотнища или завесы, в особенности части шатра или скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Сочетание вводит временное обстоятельство новой сцены. В современном русском отдельное «и случилось» здесь избыточно; придаточное с «когда» естественно передаёт повествовательную функцию.
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: поселился ... живу
  rationale: ישׁב в контексте дома обозначает проживание. «Поселился» естественно описывает достигнутое состояние в повествовании, а «живу» — продолжающееся проживание в прямой речи.
- source_word: בְּבֵיתוֹ
  choice: в своём доме
  rationale: Сохраняется буквальное «дом», а не более толковательное «дворец»; возвратное местоимение естественно по-русски соотносит дом с Давидом.
- source_word: נָתָן הַנָּבִיא
  choice: пророку Нафану
  rationale: Русский порядок слов и дательный падеж естественно передают имя и должность адресата.
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к контрасту, не прибегая к архаичному «се».
- source_word: בְּבֵית הָאֲרָזִים
  choice: в кедровом доме
  rationale: Фраза означает дом, построенный или отделанный кедром; краткая русская конструкция сохраняет образ и контраст.
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: а ковчег завета Яхве
  rationale: Союз «а» естественно выражает заложенное в контексте противопоставление, сохраняя именную цепочку исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя, представленное тетраграмматоном, а не заменяется титулом.
- source_word: תַּחַת יְרִיעוֹת
  choice: находится под полотнищами
  rationale: יְרִיעוֹת — тканевые полотнища или завесы, особенно составляющие шатёр; «полотнища» сохраняет предметный образ без чрезмерного уточнения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Характер покрытия ковчега
  choice: под полотнищами
  alternative: под завесами шатра
  rationale: Текст называет тканевые полотнища, но не добавляет здесь существительное «шатёр». Основной перевод сохраняет эту недосказанность, а вероятный смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены повтор слова «дом», контраст между жилищем Давида и укрытием ковчега, а также личное имя Яхве; синтаксис сделан естественным для современного читателя.
