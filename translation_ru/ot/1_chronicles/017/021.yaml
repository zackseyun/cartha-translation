  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: ru
  text: И кто подобен Твоему народу Израилю — одному народу на земле, который Бог пошёл искупить для Себя как народ, чтобы сделать Тебе имя, совершив великие и грозные дела и изгнав народы от лица Твоего народа, который Ты искупил из Египта?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально порядок слов в конце стиха: «изгнать от лица Твоего народа, которого Ты искупил из Египта, народы». Связь последних слов допускает разные способы пунктуации; параллельное место во 2 Царств 7:23 также содержит текстуальную трудность.'
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: И кто подобен Твоему народу Израилю
  rationale: Сохраняет риторический вопрос, явное сравнение и обращение к Богу; מִי буквально означает «кто».
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: единственному народу на земле
  rationale: אֶחָד здесь выражает исключительность Израиля среди народов; «на земле» естественно передаёт בָּאָרֶץ без сужения значения до конкретной страны.
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: ради которого Бог пошёл
  rationale: Сохраняет образ решительного движения Бога, не сглаживая антропоморфный язык оригинала.
- source_word: לִפְדּוֹת לוֹ עָם
  choice: чтобы искупить его Себе как народ
  rationale: פדה передано обычным библейским глаголом «искупить»; формулировка выражает цель и результат — стать Божьим народом.
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: сделать Тебе имя
  rationale: Сохраняет второе лицо и еврейскую идиому об утверждении славы и известности, не вводя дополнительного богословского толкования.
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: великими и грозными делами
  rationale: Подразумеваемое «делами» делает выражение естественным по-русски; «грозными» сохраняет оттенки трепета и страха в נוראות.
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ ... גּוֹיִם
  choice: изгнать народы перед Твоим народом
  rationale: Передаёт изгнание народов и образ удаления их с пути или из присутствия Божьего народа; необычный порядок слов оригинала разъяснён в сноске.
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: который Ты искупил из Египта
  rationale: Сохраняет прямое обращение к Богу и повтор ключевого глагола פדה.
theological_decisions:
- issue: Божье утверждение Своего имени в לָשׂוּם לְךָ שֵׁם
  choice: сделать Тебе имя
  alternative: прославить Своё имя
  rationale: Выбранный вариант сохраняет прямое второе лицо и образ приобретения имени, не подменяя его более истолковывающим выражением.
- issue: Смысл נוֹרָאוֹת
  choice: грозными
  alternative: внушающими трепет
  rationale: «Грозными» удерживает одновременно величие, трепет и страх, не сводя значение только к ужасу.
- issue: Переход от третьего лица «Бог» ко второму лицу «Ты»
  choice: сохранить переход лиц
  alternative: унифицировать всё обращение во втором лице
  rationale: Такой переход присутствует в еврейском тексте и отражает напряжённую риторическую структуру молитвы; его не следует незаметно сглаживать.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным звучанием. Прописные местоимения в обращении к Богу использованы последовательно. Сохранены риторический вопрос, антропоморфное «Бог пошёл» и смена третьего лица на второе.
