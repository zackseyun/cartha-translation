revisions:
- from: И кто подобен Твоему народу Израилю — единственному народу на земле, ради которого Бог пошёл, чтобы искупить его Себе как народ, сделать Тебе имя великими и грозными делами и изгнать народы перед Твоим народом, который Ты искупил из Египта?[a]
  to: И кто подобен Твоему народу Израилю — одному народу на земле, который Бог пошёл искупить для Себя как народ, чтобы сделать Тебе имя, совершив великие и грозные дела и изгнав народы от лица Твоего народа, который Ты искупил из Египта?[a]
  rationale: 'Исправлены три точки: объектная связь относительного местоимения с «искупить», более формальное соответствие אֶחָד и русский эквивалент мִפְּנֵי. «Совершив великие и грозные дела» ясно связывает подразумеваемые действия с установлением имени. Сноска сохранена у спорного конечного порядка слов и уточнена в соответствии с основным переводом.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:57:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Требуется небольшая правка. «Ради которого Бог пошёл» смещает синтаксис: относительное слово относится к объекту искупления, а не прямо к мотиву движения. «Единственному» несколько сильнее, чем формальное «одному». Оборот «изгнать народы перед Твоим народом» в современном русском двусмыслен; «от лица Твоего народа» точнее передаёт מִפְּנֵי.'
  naturalness: После правки текст сохраняет возвышенное молитвенное звучание, но избегает неестественного «ради которого Бог пошёл» и пространственной двусмысленности «перед Твоим народом».
  terminology: «Искупить», «имя», «великие и грозные дела» удачно передают ключевую лексику. Смена «Бог» / «Ты» сохранена. «Для Себя как народ» передаёт לִפְדּוֹת לוֹ עָם без конфессионального истолкования.
  issues:
  - severity: medium
    issue: Синтаксическая связь «ради которого Бог пошёл»
    rationale: 'Еврейское אֲשֶׁר относится к объекту לִפְדּוֹת: Бог пошёл искупить Израиль для Себя как народ. «Ради которого» может представить Израиль прежде всего причиной, по которой Бог пошёл, а не объектом искупления.'
  - severity: low
    issue: «Единственному народу» вместо «одному народу»
    rationale: אֶחָד формально означает «один». Контекст предполагает несравненность, но «единственный» делает это толкование явным; «одному» сохраняет форму и риторический смысл.
  - severity: medium
    issue: «Изгнать народы перед Твоим народом»
    rationale: מִפְּנֵי означает «от лица, из присутствия, от перед лицом». В русском «изгнать перед» обычно обозначает действие на глазах у кого-либо, а не удаление от него.
  revised_text: И кто подобен Твоему народу Израилю — одному народу на земле, который Бог пошёл искупить для Себя как народ, чтобы сделать Тебе имя, совершив великие и грозные дела и изгнав народы от лица Твоего народа, который Ты искупил из Египта?[a]
