base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: ru
  text: Я был с тобой всюду, куда ты ходил, и истребил всех твоих врагов с твоего пути. Я сделаю твоё имя таким же великим, как имена великих на земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославлю тебя, как великих на земле». Еврейский текст буквально: «сделаю тебе имя, подобное имени великих, которые на земле». Слово «земля» может также означать «страна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: Я был с тобой
  rationale: Последовательная форма от היה в этом ретроспективном контексте говорит о прежнем присутствии и поддержке Господа.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: всюду, куда ты ходил
  rationale: Естественно передаёт еврейский оборот со значением сопровождения Давида во всех его странствиях.
- source_word: וָאַכְרִית אֶת כָּל אוֹיְבֶיךָ
  choice: истребил всех твоих врагов
  rationale: Hiphil глагола כרת означает устранение или уничтожение; «истребил» естественно и достаточно полно передаёт смысл в военном контексте.
- source_word: מִפָּנֶיךָ
  choice: перед тобой
  rationale: 'Сохраняет пространственный образ еврейского выражения: враги были устранены с пути Давида.'
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: Я сделаю твоё имя
  rationale: Форма имеет будущее значение в последовательности обещаний; «имя» сохраняет важную еврейскую метафору известности и славы.
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: подобным имени великих людей
  rationale: Передаёт сравнение с известностью выдающихся людей, не вводя более узкого понятия власти или военной силы.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: на земле
  rationale: Слово אֶרֶץ допускает значения «земля» и «страна»; широкий контекст славы Давида поддерживает «на земле», при этом альтернатива отмечена в сноске.
theological_decisions:
- issue: Временная последовательность Божьих действий
  choice: Первые действия переданы прошедшим временем, последнее — будущим
  alternative: Передать все действия либо прошедшим, либо будущим временем
  rationale: Стих сначала вспоминает прежнюю верность Бога Давиду, а затем формулирует обращённое к нему обещание.
- issue: Значение образа «сделать имя»
  choice: Сохранить образ имени в основном тексте
  alternative: 'Передать смысл непосредственно: «прославлю тебя» или «дарую тебе славу»'
  rationale: Образ понятен по-русски и сохраняет библейскую метафору; смысл известности поясняется сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены образ «имени» и переход от рассказа о прошлом к обещанию будущего; буквальные еврейские обороты сглажены там, где они были бы неестественны по-русски.
