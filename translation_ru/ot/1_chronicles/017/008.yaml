- from: Я был с тобой всюду, куда ты ходил, и истребил всех твоих врагов перед тобой. Я сделаю твоё имя подобным имени великих людей на земле.[a]
  to: Я был с тобой всюду, куда ты ходил, и истребил всех твоих врагов с твоего пути. Я сделаю твоё имя таким же великим, как имена великих на земле.[a]
