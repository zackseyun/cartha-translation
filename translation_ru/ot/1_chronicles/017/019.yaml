base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: ru
  text: О Яхве, ради Твоего слуги и по сердцу Твоему[a] Ты совершил всё это великое деяние[b], чтобы открыть все великие дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Твоей воле». Буквально: «по Твоему сердцу».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь стоит единственное число — «всё это великое деяние», а далее множественное — «все великие дела»: вероятно, сначала всё совершённое обобщается как единое великое деяние, а затем называются его отдельные проявления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте как обращение, а не заменяет его титулом.
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: ради Твоего слуги
  rationale: Сочетание выражает мотив или благосклонное отношение; «ради» естественно передаёт эту связь в молитвенной речи.
- source_word: וּכְלִבְּךָ
  choice: и по сердцу Твоему
  rationale: Сохранён образ «сердца» как обозначение внутренней воли, намерения и желания Бога, без сведения метафоры только к одному толкованию.
- source_word: עָשִׂיתָ
  choice: Ты совершил
  rationale: Глагол עשה имеет широкое значение «делать»; «совершил» естественно сочетается с последующим «величием» и обозначает уже осуществлённое действие.
- source_word: כָּל הַגְּדוּלָּה הַזֹּאת
  choice: всё это величие
  rationale: Сохранены единственное число и отвлечённое существительное исходного текста, обобщающие великое деяние Бога.
- source_word: לְהֹדִיעַ
  choice: чтобы явить
  rationale: Каузативная форма от ידע означает «сделать известным, дать узнать»; «явить» кратко и естественно передаёт раскрытие Божьих великих дел.
- source_word: כָּל הַגְּדֻלּוֹת
  choice: все эти великие дела
  rationale: Еврейское множественное число буквально обозначает «величия»; по-русски «великие дела» ясно передаёт конкретные проявления величия и сохраняет связь с предыдущим выражением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное имя, засвидетельствованное согласным текстом, и не подменяет его традиционным титулом.
- issue: Антропоморфное выражение «по сердцу Твоему»
  choice: сохранить образ сердца
  alternative: по Твоей воле
  rationale: Буквальный образ допускает оттенки воли, намерения и желания; его сохранение не устраняет заложенную в тексте смысловую широту.
- issue: Переход от единственного числа к множественному
  choice: «всё это величие» — «все эти великие дела»
  alternative: в обоих случаях «все эти великие дела»
  rationale: 'Смена числа в еврейском тексте значима: сначала Божье действие дано как совокупное величие, затем — как множество его проявлений.'
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Заглавные местоимения при обращении к Богу использованы как уместная русская орфографическая традиция. Синтаксис оставлен компактным и близким к движению еврейской фразы; буквальный образ сердца и переход от единственного числа к множественному сохранены.
