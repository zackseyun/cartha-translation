base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: ru
  text: Ты сделал Свой народ, Израиль, Своим народом навеки, и Ты, Яхве, стал их Богом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был их Богом». Еврейскую форму можно понимать как обозначающую состояние, однако основной текст передаёт установление отношений завета в данном контексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Ты сделал
  rationale: 'Хотя נתן буквально означает «дать», конструкция с לְךָ לְעָם выражает установление статуса: Бог сделал, утвердил Израиль Своим народом.'
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: народ Твой, Израиль
  rationale: Сохраняет принадлежность и пояснительное наименование Израиля, а также торжественный, но понятный русский порядок слов.
- source_word: לְךָ לְעָם
  choice: Своим народом
  rationale: 'Естественно передаёт двойную конструкцию с ל как результат и статус: Израиль принадлежит Богу как Его народ.'
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт идею непреходящей длительности в данном заветном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: стал их Богом
  rationale: Передаёт совершившееся установление отношений завета в повествовательном контексте; речь идёт не об изменении природы Бога, а о возникновении обозначенного отношения к Израилю.
theological_decisions:
- issue: Передача заветной формулы היה + ל + אלהים
  choice: стал их Богом
  alternative: был их Богом
  rationale: «Стал» сохраняет динамику установления заветных отношений, соответствующую предшествующему действию Бога. В сноске отмечено возможное более стативное понимание, чтобы не устранять подлинную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные формы «Твой», «Своим» сохранены как уважительное обозначение Бога; фраза остаётся понятной обычному современному читателю.
