base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: ru
  text: И ныне, Яхве, Ты — Бог, и Ты сказал это доброе о Твоём слуге.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты дал Твоему слуге это доброе обещание». Буквально: «Ты сказал это доброе о Твоём слуге».'
    reason: 'Лексическая альтернатива: в контексте речь идёт о Божьем обещании, однако слово «обещание» прямо не употреблено в еврейском тексте.'
lexical_decisions:
- source_word: וְעַתָּה
  choice: И ныне
  rationale: Сохраняет присоединительную силу союза и переход к следующему утверждению в молитве; «ныне» соответствует достоинству контекста и понятно современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, транслитерацией, а не заменяет его титулом.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: Ты — Бог
  rationale: Именное предложение с тире естественно по-русски передаёт утверждение тождества; отдельное «Ты Сам» было бы допустимым, но необязательным усилением.
- source_word: וַתְּדַבֵּר
  choice: Ты изрёк
  rationale: Передаёт совершившийся речевой акт без внесения более узкого значения «обещал»; глагол соответствует возвышенному молитвенному регистру.
- source_word: עַל עַבְדְּךָ
  choice: о рабе Твоём
  rationale: Предлог обозначает предмет речи, а עֶבֶד в молитве служит смиренным самообозначением Давида; «раб» сохраняет привычную библейскую образность.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: это доброе слово
  rationale: Субстантивированное прилагательное буквально означает «это доброе»; «слово» естественно восстанавливает подразумеваемое содержание в контексте Божьей речи, не сужая его до явного «обещания».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя; «Яхве» сохраняет это различие, не подменяя имя титулом.
- issue: Характер Божьей речи как обещания
  choice: изрёк это доброе слово
  alternative: дал это доброе обещание
  rationale: Контекст указывает на обещание, однако еврейская формулировка буквально говорит о «добром» как предмете сказанного. Основной текст сохраняет более широкое выражение, а контекстуальное толкование вынесено в примечание.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Заглавные местоимения при обращении к Богу применены последовательно. Формула «раб Твой» сохраняет библейское смиренное самообозначение; «изрёк» слегка возвышенно, но не архаично.
