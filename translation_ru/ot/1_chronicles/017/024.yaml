language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: ru
  text: 'Да утвердится это, и да возвеличится имя Твоё навеки, чтобы говорили: «Яхве Воинств, Бог Израиля, — Бог для Израиля[a]»; и да будет дом[b] Давида, слуги Твоего, утверждён пред Тобой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог Израиля». Буквальнее: «Бог для Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «дом» означает царский род, то есть династию Давида.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: Да утвердится это
  rationale: Нифаль от אמן в молитвенном контексте выражает пожелание, чтобы данное Богом обещание стало твёрдым и непреложным. Местоимение «это» естественно передаёт подразумеваемое содержание предшествующего обещания.
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: и да возвеличится имя Твоё
  rationale: Сохраняются молитвенно-пожелательная сила формы и библейское понятие Божьего имени как Его явленной славы и известности.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткий и естественный русский эквивалент выражения неограниченной длительности.
- source_word: לֵאמֹר
  choice: чтобы говорили
  rationale: Передаёт функцию инфинитива — введение будущего исповедания — естественнее для современного русского языка, чем буквальное «говоря» без явного субъекта.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией, а צְבָאוֹת — широким традиционным обозначением подвластных Богу небесных и земных сил.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт конструкцию принадлежности и заветную связь Яхве с Израилем.
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: Бог для Израиля
  rationale: Предлог ל передан как «для», чтобы сохранить оттенок отношения и благосклонной направленности, не сводя выражение только к принадлежности.
- source_word: בֵית דָּוִיד עַבְדְּךָ
  choice: дом Давида, слуги Твоего
  rationale: Сохраняется образ «дома», который в данном контексте обозначает царский род или династию; приложение оформлено естественно по-русски.
- source_word: נָכוֹן לְפָנֶיךָ
  choice: будет ... утверждён пред Тобой
  rationale: Передаёт состояние прочности и установленности в Божьем присутствии; «пред Тобой» сохраняет образность еврейского выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Модальность глагольных форм
  choice: 'Молитвенное пожелание: «да утвердится… да возвеличится… да будет… утверждён»'
  alternative: 'Будущее утверждение: «утвердится… возвеличится… будет утверждён»'
  rationale: Контекст молитвы Давида делает оптативное прочтение наиболее вероятным, хотя сами формы могут допускать оттенок будущего.
- issue: Значение אֱלֹהִים לְיִשְׂרָאֵל
  choice: Бог для Израиля
  alternative: Бог Израиля; Бог Израилю
  rationale: «Для Израиля» сохраняет необычную предложную конструкцию и её возможный оттенок благосклонной направленности, не превращая её безоговорочно в притяжательное выражение.
- issue: Значение «дома Давида»
  choice: Сохранён образ «дом» с пояснением о царском роде
  alternative: династия Давида
  rationale: Так сохраняются библейский образ и династический смысл без конфессионального расширения.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Частица «да» и форма «пред Тобой» сохраняют возвышенный библейский регистр, оставаясь понятными; синтаксис слегка сглажен посредством «чтобы говорили».
