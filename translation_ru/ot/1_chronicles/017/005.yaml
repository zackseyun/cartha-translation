base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: ru
  text: Ведь Я не обитал в доме с того дня, когда вывел Израиль, и доныне, но переходил из шатра в шатёр и из одного обиталища в другое[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но был, переходя от шатра к шатру и от скинии к скинии». Последняя часть еврейской фразы выражена кратко: буквально «и из обиталища», поэтому подразумеваемое продолжение передаётся по смыслу.'
    reason: Лексическая и синтаксическая неоднозначность слов וָאֶהְיֶה и מִשְׁכָּן, а также эллиптической концовки масоретского текста.
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: обитал
  rationale: При указании места глагол означает «жить, обитать». «Обитал» естественно сочетается с речью о Божьем присутствии и сохраняет достойный регистр.
- source_word: בְּבַיִת
  choice: в доме
  rationale: Существительное обозначает дом или постоянное строение; перевод «храм» был бы более узким, чем еврейский текст.
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: вывел Израиль
  rationale: Каузативная форма עלה означает «поднять, вывести». В данном контексте подразумевается исход Израиля; по-русски «вывел» естественно передаёт действие Бога, не добавляя прямо не названного Египта.
- source_word: וָאֶהְיֶה
  choice: переходил
  rationale: Буквально — «и был», но сочетание «из шатра в шатёр» выражает смену мест пребывания. «Переходил» естественно передаёт подразумеваемое движение; буквальная возможность отмечена в сноске.
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: из шатра в шатёр
  rationale: Сохраняет повтор и направительное построение исходного выражения, оставаясь естественным в современном русском языке.
- source_word: מִשְׁכָּן
  choice: обиталище
  rationale: Слово может означать место пребывания или скинию. «Обиталище» сохраняет его основное значение и не превращает здесь термин автоматически в позднейшее собственное название.
theological_decisions:
- issue: Обозначение постоянного святилища
  choice: «дом», а не «храм»
  alternative: «храм»
  rationale: В стихе противопоставлены постоянный дом и переносные места Божьего пребывания. «Храм» преждевременно уточнял бы смысл слова בַּיִת.
- issue: Передача משכן
  choice: «обиталище» в основном тексте
  alternative: «скиния»
  rationale: Еврейское слово допускает как нарицательное «обиталище», так и культовое «скиния». Основной текст сохраняет более широкий смысл, а традиционная возможность приведена в сноске.
- issue: Степень выраженности движения
  choice: «переходил»
  alternative: буквальное «был» или «пребывал»
  rationale: Форма וָאֶהְיֶה сама по себе означает «был», однако последующая конструкция «из… в…» подразумевает перемещение. Перевод выражает этот смысл, не связывая его с особой доктринальной трактовкой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Я» в прямой Божьей речи написано с прописной буквы по устойчивой русской издательской традиции. Архаизмы и преждевременно техническая храмовая терминология избегаются.
