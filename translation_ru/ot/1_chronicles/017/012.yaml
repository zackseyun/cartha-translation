  text: ה֥וּא יִבְנֶה לִּ֖/י בָּ֑יִת וְ/כֹנַנְתִּ֥י אֶת כִּסְא֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: ru
  text: Он построит Мне дом[a], и Я утвержу его престол навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм». Буквально по-еврейски: «дом»; в данном контексте имеется в виду святилище, которое построит Соломон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение мужского рода единственного числа явно и с некоторым акцентом обозначает подлежащее.
- source_word: יִבְנֶה
  choice: построит
  rationale: Форма imperfect qal 3 м. р. ед. ч. в контексте обещания выражает будущее действие; совершенный вид естественно передаёт его завершённость.
- source_word: לִּי
  choice: Мне
  rationale: Предлог ל с суффиксом первого лица указывает, для кого предназначен дом; русское «Мне» кратко и естественно передаёт это отношение.
- source_word: בָּיִת
  choice: дом
  rationale: Буквальное значение слова — «дом»; в контексте имеется в виду святилище, которое построит Соломон, однако более широкое слово сохраняет связь образов внутри обетования.
- source_word: וְכֹנַנְתִּי
  choice: и Я утвержу
  rationale: Глагол כון здесь означает сделать прочным, прочно установить. «Утвержу» естественно для царского престола и сохраняет смысл надёжности и постоянства.
- source_word: אֶת כִּסְאוֹ
  choice: его престол
  rationale: Существительное с местоименным суффиксом третьего лица мужского рода передано обычной русской притяжательной конструкцией.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Устойчивое сочетание обозначает неограниченную длительность; «навеки» ясно и достойно звучит в обещании о престоле.
theological_decisions:
- issue: Передавать ли בָּיִת буквально как «дом» или контекстуально как «храм»
  choice: дом
  alternative: храм
  rationale: Еврейский текст использует более широкое слово «дом». Его сохранение поддерживает литературную и богословскую связь в обетовании Давиду, тогда как сноска поясняет контекст, не подменяя формулировку текста.
- issue: Сила выражения עַד עוֹלָם в обещании Давиду
  choice: навеки
  alternative: вечно
  rationale: Перевод прямо сохраняет утверждение текста о непрекращающейся длительности и не разрешает за читателя богословский вопрос об окончательном исполнении обещания.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для библейского обещания. Заглавные буквы в «Мне» и «Я» обозначают говорящего Бога согласно устойчивой русской издательской практике; синтаксис остаётся простым и понятным.
