  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: ru
  text: О Яхве, нет подобного Тебе, и нет Бога, кроме Тебя, — по всему, что мы слышали своими ушами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога сохраняет прямое обращение еврейского текста.
- source_word: אֵין כָּמוֹךָ
  choice: нет подобного Тебе
  rationale: Точно передаёт отрицание существования кого-либо сравнимого с Богом и естественно звучит по-русски.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: и нет Бога, кроме Тебя
  rationale: Сохраняет прямое утверждение исключительности Бога; זוּלָתֶךָ имеет смысл «кроме Тебя / помимо Тебя».
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ
  choice: судя по всему, что мы слышали
  rationale: Предлог בְ здесь естественно понимать как указание на основание исповедания — всё услышанное; русский оборот ясно выражает эту связь.
- source_word: בְּאָזְנֵינוּ
  choice: своими ушами
  rationale: Идиоматичная русская передача буквального «нашими ушами», сохраняющая выразительность исходного образа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» непосредственно передаёт его, не заменяя титулом.
- issue: Смысл וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: 'абсолютное утверждение: «нет Бога, кроме Тебя»'
  alternative: сравнительное утверждение о превосходстве над другими богами
  rationale: Синтаксис отрицает существование иного Бога, а не только утверждает превосходство Яхве.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Частица «О» сохраняет форму торжественного обращения; прописные местоимения в обращении к Богу поддерживают принятую русскую библейскую традицию.
