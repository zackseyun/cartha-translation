  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: ru
  text: 'со времён, когда Я поставил судей над Моим народом Израилем. Я покорил всех твоих врагов. И возвещаю тебе: Яхве построит тебе дом[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Яхве утвердит твой царский дом — династию.
    reason: Поясняет подразумеваемое в контексте значение слова «дом», не устраняя из основного текста намеренную игру значений.
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: со времён
  rationale: Сочетание предлогов образует временной оборот, продолжающий мысль предыдущего стиха; по-русски естественно передаётся как «со времён».
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: когда Я поставил судей
  rationale: В данном историческом контексте צוה обозначает назначение судей Богом, а не передачу им отдельного повеления.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: над Моим народом Израилем
  rationale: Предлог עַל выражает власть над народом; выражение «Мой народ» сохраняет значимый для завета притяжательный смысл.
- source_word: וְהִכְנַעְתִּי
  choice: Я покорю
  rationale: Перфект с союзом в последовательности обещаний имеет здесь будущее значение; при объекте «враги» глагол «покорю» естественно передаёт значение הכנע.
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: всех твоих врагов
  rationale: Передаёт полноту, выраженную כָּל, и обращение во втором лице единственного числа.
- source_word: וָאַגִּד לָךְ
  choice: И возвещаю тебе
  rationale: נגד вводит торжественное Божье объявление; настоящее время естественно передаёт совершаемое в данный момент возвещение.
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: Яхве построит тебе дом
  rationale: Сохранено ключевое слово «дом» и игра значений между храмом и царским домом Давида; русская конструкция остаётся ясной и не истолковывает метафору внутри основного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Значение слова «дом» в заключительной фразе
  choice: Сохранить «дом» в основном тексте, позволяя контексту указывать на династию.
  alternative: Яхве утвердит твою династию.
  rationale: בַיִת намеренно связывает дом-храм, который Давид хотел построить Богу, с царским домом, который Бог обещает создать Давиду. Прямая замена на «династию» устранила бы эту литературную и богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Начальная строчная буква отражает то, что стих синтаксически продолжает предыдущее предложение. Местоимение «Я» написано с прописной буквы как традиционное обозначение Бога; личное имя передано как «Яхве».
