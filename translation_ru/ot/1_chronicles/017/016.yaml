base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: ru
  text: 'Тогда царь Давид вошёл, сел перед Яхве и сказал: «Кто я, Яхве, Боже, и что такое мой дом[a], что Ты привёл меня так далеко?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семья», «род» или «династия». Еврейское слово «дом» может обозначать домашних, семью или род Давида, а в данном контексте также его царскую династию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: вошёл
  rationale: Глагол בוא может означать «прийти», «пойти» или «войти»; в данном контексте «вошёл» естественно передаёт приближение Давида к месту присутствия Бога, не уточняя само место.
- source_word: וַיֵּשֶׁב
  choice: сел
  rationale: После действия «вошёл» конкретное значение «сел» лучше всего соответствует последовательности повествования.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: «Пред» кратко и достойно передаёт нахождение в присутствии Бога, а имя יהוה передано как «Яхве».
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Боже
  rationale: 'Форма прямого обращения сохранена: личное имя передано как «Яхве», а אֱלֹהִים — традиционной русской звательной формой «Боже».'
- source_word: מִי אֲנִי
  choice: кто я
  rationale: Естественное русское выражение смирения и осознания собственного недостоинства.
- source_word: וּמִי בֵיתִי
  choice: и что такое мой дом
  rationale: Еврейский текст буквально повторяет «кто», но по-русски применительно к дому естественнее «что такое». Слово «дом» сохранено ради его широкого семейного и династического смысла.
- source_word: בֵיתִי
  choice: мой дом
  rationale: '«Дом» сохраняет многозначность еврейского בַּיִת: жилище, семейство, род или династическая линия. Возможные значения пояснены в сноске.'
- source_word: הֲבִיאֹתַנִי
  choice: Ты привёл меня
  rationale: Каузативная форма בוא означает, что Бог довёл Давида до достигнутого им положения; «привёл» точно и естественно передаёт этот смысл.
- source_word: עַד הֲלֹם
  choice: так далеко
  rationale: Выражение обозначает достигнутую к настоящему моменту степень или рубеж. «Так далеко» сохраняет образ движения и удивление Давида, не конкретизируя характер его возвышения.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе употреблено собственное заветное имя Бога. Форма «Яхве» передаёт его именно как имя, не заменяя титулом.
- issue: Значение «дома» Давида
  choice: сохранить многозначное слово «дом»
  alternative: семья, род или династия
  rationale: Контекст Божьего обещания Давиду придаёт слову династическое звучание, однако само еврейское слово шире. Основной текст не сужает смысл, а варианты раскрыты в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «пред» и «Боже» поддерживают достоинство прямой молитвенной речи, не делая текст архаичным; местоимение «Ты» написано с прописной буквы как принятая русская форма почтительного обращения к Богу.
