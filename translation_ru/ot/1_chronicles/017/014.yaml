source:
  edition: WLC
  text: וְ/הַֽעֲמַדְתִּ֛י/הוּ בְּ/בֵיתִ֥/י וּ/בְ/מַלְכוּתִ֖/י עַד הָ/עוֹלָ֑ם וְ/כִסְא֕/וֹ יִהְיֶ֥ה נָכ֖וֹן עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: ru
  text: Но Я утвержу его в Моём доме и в Моём царстве навеки[a][b], и престол его будет утверждён навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я поставлю его в Моём доме и над Моим царством навеки». Древнееврейский предлог буквально соответствует «в», однако в контексте может подразумевать и поставление над царством.'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «его» непосредственно может относиться к царскому потомку Давида, особенно к Соломону; вместе с тем эти слова входят в более широкое обетование Давиду, впоследствии получившее мессианское понимание. Выражение «Мой дом» также может обозначать Божий храм, Его домочадство или Его заветную сферу.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: Но Я утвержу его
  rationale: Каузативная форма глагола עמד означает, что Бог прочно поставит или утвердит его в данном положении. «Но» естественно передаёт смысловой контраст с предшествующим стихом.
- source_word: בְּבֵיתִי
  choice: в Моём доме
  rationale: Буквальная передача предлога ב сохраняет широту слова «дом», которое здесь может указывать на Божий дом, Его домочадство или храм, не сводя смысл к одному толкованию.
- source_word: וּבְמַלְכוּתִי
  choice: и в Моём царстве
  rationale: Передача сохраняет параллелизм с выражением «в Моём доме» и не уточняет без необходимости характер положения или власти обещанного потомка.
- source_word: עַד הָעוֹלָם
  choice: навеки
  rationale: Устойчивое древнееврейское выражение обозначает непреходящую длительность; «навеки» звучит естественно и торжественно в современном русском библейском тексте.
- source_word: וְכִסְאוֹ
  choice: и престол его
  rationale: Сохранён прямой царский образ כסא — «престол», без замены на толковательные слова «власть» или «династия».
- source_word: יִהְיֶה נָכוֹן
  choice: будет утверждён
  rationale: נכון выражает прочность, устойчивость и надёжную установленность. Эта формулировка также передаёт смысловую перекличку с начальным глаголом стиха.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Повтор того же русского слова сохраняет подчёркнутое в еврейском тексте обещание непреходящей длительности.
theological_decisions:
- issue: К кому относится местоимение «его»
  choice: Сохранить местоимение без указания конкретного лица.
  alternative: Прямо назвать Соломона, весь царский род Давида или Мессию.
  rationale: В самом стихе стоит местоимение мужского рода единственного числа. Контекст допускает непосредственное отношение к царскому потомку Давида, особенно Соломону, и одновременно входит в более широкое Давидово обетование, позднее понимаемое мессиански; перевод не должен устранять это напряжение.
- issue: Объём значения выражения «Мой дом»
  choice: Сохранить буквальное и многозначное выражение «в Моём доме».
  alternative: Уточнить как «в Моём храме», «среди Моих домочадцев» или «над Моим домом».
  rationale: Слово בית способно обозначать дом, домочадство либо храм. Буквальная передача не навязывает одно из возможных контекстуальных толкований.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавные буквы в местоимениях «Я», «Мой» обозначают говорящего Бога согласно принятой русской издательской традиции. Формула «утвержу / будет утверждён» намеренно сохраняет лексико-смысловую перекличку оригинала.
