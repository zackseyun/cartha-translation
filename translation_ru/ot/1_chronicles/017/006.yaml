source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: ru
  text: 'Во всех местах, где Я ходил среди всего Израиля[a], сказал ли Я хоть слово одному из судей Израиля, которому Я повелел пасти Мой народ: «Почему вы не построили Мне дом из кедра?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельном месте, 2 Царств 7:7, еврейский текст говорит о «коленах Израиля»; некоторые свидетельства отражают чтение «вожди» или «скипетры». Здесь, в Паралипоменон, еврейский текст гласит: «судьи».'
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: Я ходил
  rationale: Сохраняет образ Божьего хождения среди народа; форма передаёт неоднократное перемещение, а не один отдельный переход.
- source_word: בְּכָל יִשְׂרָאֵל
  choice: среди всего Израиля
  rationale: Передаёт присутствие и движение Бога среди всего народа, а не только географическое перемещение по стране.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: сказал ли Я хоть слово
  rationale: Естественно передаёт усиленный риторический вопрос и созвучное сочетание существительного с глаголом в еврейском тексте.
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: кому-либо из судей Израиля
  rationale: В сочетании с глаголом «говорить» אֶת указывает на адресата; «кому-либо» естественно выражает неопределённое אַחַד в отрицательно-риторическом контексте.
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: судей Израиля
  rationale: Прямо отражает масоретский текст Паралипоменон и не гармонизирует его с параллельным местом во 2 Царств 7:7.
- source_word: צִוִּיתִי לִרְעוֹת
  choice: которым повелел пасти
  rationale: Сохраняет пастырскую метафору правления и заботы. Множественное «которым» согласовано по смыслу с группой «судей», тогда как еврейская относительная конструкция формально допускает связь с неопределённым представителем этой группы.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Сохраняет стандартное заветное обозначение народа как принадлежащего Богу.
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: Почему вы не построили Мне
  rationale: Множественное число «вы» точно передаёт בְנִיתֶם; русский прошедший вид естественно выражает отсутствие такого строительства до данного момента.
- source_word: בֵּית אֲרָזִים
  choice: дом из кедра
  rationale: Естественный современный русский оборот для здания, сооружённого из кедровой древесины, с сохранением достоинства стиля.
theological_decisions:
- issue: «Судьи» в Паралипоменон и «колена» в параллельном месте 2 Царств 7:7
  choice: В основном тексте переведено «судей Израиля» по масоретскому тексту 1 Паралипоменон 17:6.
  alternative: «колен Израиля» или «вождей Израиля» по параллельному месту и отдельным текстовым свидетельствам.
  rationale: Разночтение следует сохранить, а не устранять гармонизацией. Оно является текстуально-литературным вопросом и не требует богословского сглаживания.
- issue: Адресат повеления пасти народ
  choice: «судей Израиля, которым повелел пасти Мой народ»
  alternative: «одному из судей Израиля, которому Я повелел пасти Мой народ»
  rationale: Еврейская конструкция допускает формальную связь относительного оборота с «одним», но по смыслу речь идёт о судьях как о поставленных Богом пастырях народа. Русское множественное число также согласуется с последующим множественным «вы не построили» и сохраняет напряжение исходной формулировки без искусственного разрешения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Риторический вопрос сохранён; пастырская метафора не заменена пояснительным выражением.
