  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: ru
  text: Он построил себе дома в Городе Давида, приготовил место для ковчега Божьего и поставил для него шатёр[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставил себе шатёр». Еврейское местоимение можно отнести как к ковчегу, так и к Давиду, хотя ближайший контекст скорее указывает на ковчег.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: построил
  rationale: Хотя עשה буквально имеет широкое значение «делать», при дополнении «дома» современное русское «построил» естественно и точно передаёт действие.
- source_word: בָתִּים
  choice: дома
  rationale: Обычное значение множественного числа בַּיִת; текст не уточняет, что это были дворцы или иные особые сооружения.
- source_word: בְּעִיר דָּוִיד
  choice: в Городе Давида
  rationale: Прямое обозначение места; традиционное название передано как имя собственное.
- source_word: וַיָּכֶן
  choice: приготовил
  rationale: В породе хифиль глагол выражает подготовку или приведение в готовность; здесь речь идёт о месте для ковчега.
- source_word: מָקוֹם
  choice: место
  rationale: Основное и контекстуально достаточное значение слова.
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: для ковчега Божьего
  rationale: Точно передаёт указание на священный ковчег, принадлежащий Богу или связанный с Ним, без пояснительного расширения.
- source_word: וַיֶּט
  choice: поставил
  rationale: При слове «шатёр» глагол נטה означает раскинуть или поставить шатёр; «поставил» звучит естественно в современном русском.
- source_word: אֹהֶל
  choice: шатёр
  rationale: Существительное означает переносное жилище или культовый шатёр; отсутствие артикля не требует определённости.
- source_word: לוֹ
  choice: для него
  rationale: Местоимение мужского рода естественнее всего соотнести с ближайшим подходящим предшествующим словом «ковчег», но русская форма сохраняет возможность отнести его и к Давиду.
theological_decisions:
- issue: К кому относится местоименный суффикс в וַיֶּט לוֹ אֹהֶל
  choice: 'к ковчегу: «поставил для него шатёр»'
  alternative: 'к Давиду: «поставил себе шатёр»'
  rationale: Ближайший контекст описывает приготовление места для ковчега, поэтому продолжение о шатре для него образует связную последовательность. Однако грамматика допускает отнесение суффикса к Давиду, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Синтаксический параллелизм еврейского повествования сохранён без излишней буквальности.
