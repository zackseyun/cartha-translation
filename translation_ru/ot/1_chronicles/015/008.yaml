  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: ru
  text: 'Из сыновей Елисафана: Шемаия, глава, и двести его братьев.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сородичей»; еврейское слово может обозначать не только родных братьев, но и членов одного рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Из сыновей
  rationale: Предлог לְ вводит очередную родовую группу в перечне; по-русски конструкция «Из сыновей…» естественно передаёт выбор названного главы и сопровождающих его людей из этой группы. בְּנֵי буквально означает «сыновья», но здесь служит обозначением рода.
- source_word: אֱלִיצָפָן
  choice: Елицафана
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительный падеж по синтаксису фразы.
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Транслитерация еврейского личного имени в современной русской библейской форме.
- source_word: הַשָּׂר
  choice: глава
  rationale: שַׂר обозначает начальника, руководителя или предводителя. В перечне родов «глава» естественно указывает на руководителя группы, не приписывая ему княжеского достоинства или специальной военной должности.
- source_word: וְאֶחָיו
  choice: и его братьев
  rationale: אָח буквально значит «брат», но в подобных родовых списках может обозначать также сородичей или членов одной родовой группы. Основной текст сохраняет буквальный образ, а более широкое значение отмечено в сноске.
- source_word: מָאתָיִם
  choice: двести
  rationale: Прямое соответствие количественному числительному.
