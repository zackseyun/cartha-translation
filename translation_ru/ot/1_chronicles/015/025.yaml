base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: ru
  text: Тогда Давид, старейшины Израиля и начальники тысяч отправились перенести ковчег завета Яхве из дома Овед-Эдома с радостью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Итак, ... отправились
  rationale: Форма вводит следующий этап повествования; естественный русский переход «Итак» вместе со сказуемым «отправились» передаёт её дискурсивную функцию без тяжеловесного «и было».
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: старейшины Израиля
  rationale: Устойчивое и точное обозначение признанных руководителей народа.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: начальники тысяч
  rationale: Сохраняет структуру еврейского выражения и его отсылку к военным или административным подразделениям численностью в тысячу.
- source_word: הַהֹלְכִים
  choice: отправились
  rationale: Причастие характеризует всю названную группу как идущую с определённой целью; личная форма естественна для современного русского повествования.
- source_word: לְהַעֲלוֹת
  choice: перенести
  rationale: В контексте перемещения ковчега глагол означает доставить его на другое, подразумеваемое более высокое место; «перенести» ясно передаёт действие и не создаёт ошибочного впечатления о простом поднятии предмета.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Близко передаёт еврейскую конструкцию и сохраняет связь ковчега с заветом Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: из дома Овед-Эдома
  rationale: Прямой и естественный перевод предложной конструкции с сохранением личного имени.
- source_word: בְּשִׂמְחָה
  choice: с радостью
  rationale: Кратко и естественно передаёт обстоятельственный смысл предлога и праздничный характер события.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя; форма «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизмов. Перечень участников сохранён, а синтаксис слегка перестроен ради естественного повествования.
