lexical_decisions:
- source_word: לִבְנֵי
  choice: Из сыновей
  rationale: Предлог לְ вводит очередную родовую группу в перечне; по-русски структуру списка естественно передаёт оборот «из сыновей».
- source_word: קְהָת
  choice: Каафа
  rationale: Имя левитского родоначальника передано в традиционной русской библейской форме и поставлено в родительный падеж по синтаксису фразы.
- source_word: אוּרִיאֵל
  choice: Уриила
  rationale: Личное имя передано в традиционной русской форме; винительный падеж согласуется с подразумеваемым из контекста действием перечисления и созыва.
- source_word: הַשָּׂר
  choice: начальника
  rationale: שַׂר здесь обозначает главу или руководителя родовой группы, не обязательно князя; «начальник» сохраняет административный смысл без оттенка царского достоинства.
- source_word: וְאֶחָיו
  choice: и … его братьев
  rationale: Сохранено буквальное значение «братья», хотя в данном родовом перечне слово может охватывать более широкий круг соплеменников или родственников.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: сто двадцать
  rationale: Число передано словами, что естественно для краткого повествовательного перечня в русском библейском тексте.
