lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: Берехия
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: אֶלְקָנָה
  choice: Елкана
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: שֹׁעֲרִים
  choice: привратниками
  rationale: Слово обозначает людей, охранявших ворота или вход; «привратники» естественно и точно передаёт эту служебную роль в русском библейском контексте.
- source_word: לָאָרוֹן
  choice: при ковчеге
  rationale: Предлог ל может указывать как на порученное служение по отношению к ковчегу, так и на место служения. «При ковчеге» естественно сохраняет оба оттенка, не сводя выражение только к принадлежности или местонахождению.
- source_word: וּ/… וְ
  choice: А … и
  rationale: Начальное ו связывает стих с предыдущим перечислением и естественно передано союзом «А», тогда как ו между именами передано союзом «и».
