  text: Berechiah and Elkanah were gatekeepers for the ark[a].
translation:
  language: ru
  text: А Берехия и Елкана были привратниками при ковчеге[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привратниками у ковчега». Еврейский предлог может обозначать как служение, порученное в связи с ковчегом, так и нахождение у ковчега.'
