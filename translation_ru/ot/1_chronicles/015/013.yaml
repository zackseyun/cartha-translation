source:
  edition: WLC
  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: ru
  text: Поскольку при первой попытке вы не участвовали[a], Яхве, наш Бог, обрушился на нас, потому что мы не искали Его так, как предписано[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское начало фразы сжато и не называет действия, в котором левиты не участвовали. В контексте речь идёт о первой попытке перенести ковчег; возможно уточнение: «Поскольку при первой попытке ковчег несли не вы».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «потому что мы не вопросили Его согласно установленному порядку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַבָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: Поскольку в первый раз это были не вы
  rationale: Начальная конструкция сжата и эллиптична. В контексте обращения Давида к левитам она указывает на то, что при первой попытке ковчег переносили не они; перевод сохраняет недосказанность, не добавляя прямо «несли ковчег».
- source_word: פָּרַץ ... בָּנוּ
  choice: обрушился на нас
  rationale: Глагол описывает внезапное и суровое действие Яхве против людей после нарушения установленного порядка. Русское «обрушился на нас» естественно передаёт силу образа прорыва и направленность действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Прямо передаёт существительное с суффиксом первого лица множественного числа.
- source_word: דְרַשְׁנֻהוּ
  choice: искали Его
  rationale: דרשׁ охватывает значения «искать», «вопрошать», «обращаться за указанием». «Искали Его» сохраняет более широкий смысл, уместный в контексте приближения к Богу и исполнения Его воли.
- source_word: כַּמִּשְׁפָּט
  choice: так, как предписано
  rationale: Здесь מִשְׁפָּט обозначает установленный порядок перенесения ковчега. Формулировка ясна современному читателю и сохраняет нормативный смысл.
theological_decisions:
- issue: Эллиптичное начало стиха
  choice: Отнести слова «не вы» к отсутствию надлежащего участия левитов при первой попытке перенести ковчег, не называя их действие прямо.
  alternative: «Потому что прежде Яхве, наш Бог, произвёл среди нас пролом» или «потому что в первый раз не вы несли его».
  rationale: Контекст стихов 2, 12–15 связывает неудачу первой попытки с тем, что ковчег не несли левиты. Однако еврейский текст не содержит дополнения «несли его», поэтому оно не внесено в основной текст.
- issue: Характер действия Яхве в פָּרַץ
  choice: 'Передать как внезапное карающее действие: «обрушился на нас».'
  alternative: «произвёл среди нас пролом» или «прорвался против нас».
  rationale: Так сохраняются суровость Божьего суда и словесная связь с повествованием о Перец-Уззе без неестественной для современного русского буквальности.
- issue: Значение דָּרַשׁ в культовом контексте
  choice: «не искали Его»
  alternative: «не вопрошали Его» или «не обратились к Нему за указанием».
  rationale: Форма допускает как общее «искать Бога», так и более узкое «вопрошать Его». Основной текст сохраняет широкое богословское значение, а примечание отмечает альтернативу.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Архаизмы вроде «взыскали» и буквальная, неестественная метафора «сделал пролом» избегаются; неоднозначность начальной фразы и глагола דרשׁ вынесена в примечания.
