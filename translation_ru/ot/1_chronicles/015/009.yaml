base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/009.yaml
  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: ru
  text: 'Из сыновей Хеврона: предводитель Елиил и восемьдесят его братьев[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его сородичей». В еврейском тексте буквально: «его братьев»; вероятно, имеются в виду мужчины из родовой группы, которую представлял Елиил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Из сыновей
  rationale: Предлог לְ вводит очередную родовую группу в перечне; по-русски конструкция «из сыновей» естественно обозначает представителей рода и сохраняет еврейский образ родства.
- source_word: חֶבְרוֹן
  choice: Хеврона
  rationale: Личное имя, переданное в традиционной русской библейской форме.
- source_word: אֱלִיאֵל
  choice: Елиил
  rationale: Личное имя, переданное в традиционной русской библейской форме.
- source_word: הַשָּׂר
  choice: предводитель
  rationale: שַׂר обозначает главу или руководителя; в перечне представителей родов «предводитель» передаёт административное старшинство, не привнося значения царского титула или военной должности.
- source_word: וְאֶחָיו
  choice: и его братьев
  rationale: Буквально — «и его братья»; после конструкции «из сыновей» русский синтаксис требует родительного падежа. В данном контексте слово может обозначать более широкий круг мужчин рода, что отмечено в сноске.
- source_word: שְׁמוֹנִים
  choice: восемьдесят
  rationale: Точное воспроизведение количественного числительного.
