  terminology: '«Арфы» допустимы для נְבָלִים, хотя инструмент мог быть также лирой. Имена в целом переданы последовательно. «Аламот» следует писать как несклоняемый транслитерированный технический термин; ударение не требуется. В сноске не следует говорить именно о «голосах девушек»: еврейское слово связано с девушками/молодыми женщинами, а не прямо с голосами.'
