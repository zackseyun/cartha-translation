  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: ru
  text: а Захария, Азиил, Шемирамоф, Иехиил, Унний, Елиав, Маасея и Ванея — на арфах, «Аламот».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на арфах в высоком регистре». Еврейское «Аламот», буквально связанное с девушками или молодыми женщинами, вероятно, является музыкальным указанием, возможно на высокий регистр.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: на арфах
  rationale: נְבָלִים обозначает струнные инструменты, обычно арфы или лиры; конструкция с ב естественно передаётся по-русски как игра «на арфах».
- source_word: עַל
  choice: согласно
  rationale: В музыкальном контексте עַל, вероятно, вводит указание на способ исполнения, настройку или регистр; «согласно» сохраняет эту широту и не придаёт предлогу пространственного смысла.
- source_word: עֲלָמוֹת
  choice: аламоту
  rationale: Вероятно, это специальный музыкальный термин, точное значение которого неясно; транслитерация не устраняет подлинную неоднозначность. Форма «аламоту» после «согласно» оформлена как склоняемое заимствованное обозначение.
- source_word: וּזְכַרְיָה וַעֲזִיאֵל וּשְׁמִירָמוֹת וִיחִיאֵל וְעֻנִּי וֶאֱלִיאָב וּמַעֲשֵׂיָהוּ וּבְנָיָהוּ
  choice: а Захария, Азиил, Шемирамоф, Иехиил, Унний, Елиав, Маасея и Ванея
  rationale: Имена переданы в традиционных или близких к еврейской форме русских библейских написаниях. Начальный союз сохранён как «а», поскольку стих продолжает перечень предыдущего стиха.
