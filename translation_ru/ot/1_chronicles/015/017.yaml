  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: ru
  text: И левиты назначили Емана, сына Иоиля[a], и из его братьев — Асафа, сына Берехии, и из сыновей Мерари, их братьев[b], — Ефана, сына Кушаии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставили»; еврейский глагол может означать поставить человека на порученное ему служение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из сыновей Мерари» — то есть из рода Мерари.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: поставили
  rationale: Порода hифиль глагола עמד означает «поставить», в данном контексте — определить на порученное служение. Русское «поставили» сохраняет образ исходного слова и естественно выражает назначение на роль.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое русское обозначение представителей колена Левия; определённость передаётся контекстом.
- source_word: הֵימָן בֶּן יוֹאֵל
  choice: Емана, сына Иоиля
  rationale: Имена переданы в традиционной русской библейской форме, а явное указание родства сохранено.
- source_word: וּמִן אֶחָיו
  choice: а из его братьев
  rationale: Предлог מִן указывает на выбор представителя из группы. Местоимение единственного числа «его» формально сохраняет еврейский текст, не устраняя возможную неоднозначность отнесения.
- source_word: אָסָף בֶּן בֶּרֶכְיָהוּ
  choice: Асафа, сына Берехии
  rationale: Имена переданы в традиционной русской библейской форме; родственная связь выражена непосредственно.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: и из сыновей Мерари
  rationale: Сохранено буквальное родовое выражение «сыны Мерари», а не заменено более толковательным «мерариты».
- source_word: אֲחֵיהֶם
  choice: их братьев
  rationale: Сохранён буквальный термин родства и множественное местоимение исходного текста; в контексте речь идёт о родственной левитской группе.
- source_word: אֵיתָן בֶּן קוּשָׁיָהוּ
  choice: Ефана, сына Кушайи
  rationale: Ефан — традиционная русская библейская форма имени; Кушайя передаёт удлинённую еврейскую форму קוּשָׁיָהוּ без отождествления с иной формой имени.
