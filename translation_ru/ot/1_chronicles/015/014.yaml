  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: ru
  text: И священники, и левиты освятили себя[a], чтобы поднять ковчег Яхве, Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятили себя»; здесь имеется в виду приготовление к священному служению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: освятили себя
  rationale: Возвратная порода хитпаэль от קדשׁ обозначает ритуальное приготовление к священному служению. «Освятили себя» сохраняет значение святости и естественно звучит в данном контексте.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное соответствие כהנים в контексте богослужения.
- source_word: וְהַלְוִיִּם
  choice: и левиты
  rationale: Стандартная передача названия левитов; определённость выражена контекстом и порядком слов.
- source_word: לְהַעֲלוֹת
  choice: чтобы поднять
  rationale: Каузативная форма от עלה означает «поднять, привести наверх». Выбор сохраняет образ восхождения при перенесении ковчега в Иерусалим, не уточняя способ переноса сверх сказанного здесь.
- source_word: אֶת אֲרוֹן
  choice: ковчег
  rationale: В данном контексте ארון обозначает священный ковчег; это укоренившееся и точное русское соответствие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Конструктивная цепочка прямо передана как приложение, поясняющее имя Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Характер освящения священников и левитов
  choice: освятили себя
  alternative: подготовили себя к священному служению
  rationale: Формулировка сохраняет возвратность глагола и его ритуально-сакральный смысл, не превращая освящение в исключительно внутреннее нравственное действие.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор союза «и» естественно подчёркивает обе названные группы; традиционные термины «левиты» и «ковчег» сохранены.
