  source_fidelity: 'Текст точно передаёт еврейское וַיִּתְקַדְּשׁוּ как возвратное ритуальное действие («освятили себя»), сохраняет обе группы — священников и левитов — и цель действия: поднять/принести вверх ковчег. «Ковчег Яхве, Бога Израиля» корректно воспроизводит конструкцию אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל без добавления невыраженных деталей.'
