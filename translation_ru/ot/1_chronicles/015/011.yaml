base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: ru
  text: 'Тогда Давид призвал священников Садока и Авиафара и левитов: Уриила, Асаию, Иоиля, Шемаию, Елиила и Амминадава.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: Форма глагола קרא в данном контексте обозначает вызов конкретных людей к Давиду; «призвал» естественно передаёт значение созыва и сохраняет достоинство повествовательного стиля.
- source_word: לְצָדוֹק וּלְאֶבְיָתָר הַכֹּהֲנִים
  choice: священников Садока и Авиафара
  rationale: Русская конструкция с приложением естественно передаёт, что Садок и Авиафар — названные священники; определённость еврейского артикля выражена контекстом и порядком слов.
- source_word: וְלַלְוִיִּם
  choice: и левитов
  rationale: Повтор предлога ל связывает левитов с тем же глаголом призыва; в русском управление глагола позволяет не воспроизводить предлог отдельно.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: Уриила, Асаию, Иоиля, Шемаию, Елиила и Амминадава
  rationale: Имена переданы в русской библейской форме и поставлены после двоеточия как перечень призванных левитов; падежные окончания соответствуют управлению глагола «призвал».
- source_word: דָוִיד
  choice: Давид
  rationale: Устоявшаяся русская библейская форма имени.
