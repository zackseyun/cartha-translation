id: 1CH.15.26
reference: 1 Chronicles 15:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: ru
  text: И когда Бог помог левитам, нёсшим ковчег завета Яхве[a], они принесли в жертву семь быков и семь баранов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ковчег завета Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: когда ... помог
  rationale: Инфинитивная конструкция с ב после ויהי образует временное придаточное; «когда Бог помог» естественно передаёт её по-русски.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Артикль в еврейском тексте здесь не требует передачи отдельным словом; речь идёт о Боге Израиля.
- source_word: הַלְוִיִּם נֹשְׂאֵי
  choice: левитам, нёсшим
  rationale: Причастие обозначает продолжающееся в данной сцене действие и естественно передаётся русским действительным причастием.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Передаёт всю цепочку сопряжённых существительных и сохраняет личное имя יהוה.
- source_word: וַיִּזְבְּחוּ
  choice: они принесли в жертву
  rationale: Глагол имеет форму третьего лица множественного числа; выражение ясно передаёт жертвенный контекст, не уточняя сверх текста, кто именно входил в эту группу.
- source_word: שִׁבְעָה פָרִים וְשִׁבְעָה אֵילִים
  choice: семь быков и семь баранов
  rationale: Прямые и обычные русские наименования жертвенных животных; повтор числительного сохранён.
theological_decisions:
- issue: Субъект жертвоприношения
  choice: они принесли в жертву
  alternative: он принёс в жертву
  rationale: Еврейское וַיִּזְבְּחוּ стоит во множественном числе. Перевод сохраняет грамматическую множественность, но не определяет точнее, к кому относится «они».
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господа
  rationale: Транслитерация сохраняет личное Божье имя в основном тексте; традиционная замена титулом отмечена как допустимый вариант в сноске.
translation_notes:
  register: Современный литературный русский язык; достоинство культового контекста сохранено без архаизации. Формулировка следует еврейскому синтаксису настолько близко, насколько это допускает естественная русская речь.
