- from: И Давид велел начальникам левитов назначить их братьев[a] певцами с музыкальными инструментами — арфами, лирами и тарелками, — чтобы они громко играли, возвышая голос с радостью.[b]
  to: 'И Давид велел начальникам левитов назначить их братьев[a] — певцов — с музыкальными инструментами: арфами, лирами и тарелками, чтобы они громко исполняли музыку, возвышая голос в радости.[b]'
  rationale: Исправление устраняет неоправданное ограничение значения «громко играли», сохраняя певцов, инструменты, громкое музыкальное звучание и образ возвышенного голоса. Примечание уточнено так, чтобы не выдавать одну интерпретацию за единственно возможную.
