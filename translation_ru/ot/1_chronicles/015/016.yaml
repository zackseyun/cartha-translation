  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: ru
  text: 'И Давид велел начальникам левитов назначить их братьев[a] — певцов — с музыкальными инструментами: арфами, лирами и тарелками, чтобы они громко исполняли музыку, возвышая голос в радости.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть их собратьев-левитов.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «давая звучать, чтобы возвысить голос для радости». Точная синтаксическая связь этих выражений допускает несколько передач.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִיד
  choice: И Давид велел
  rationale: Форма וַיֹּאמֶר продолжает повествование, а последующий инфинитив выражает распоряжение; «велел» естественно передаёт эту конструкцию по-русски.
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: начальникам левитов
  rationale: שָׂרִים обозначает начальников или руководителей; «начальники» уместно в организационном контексте.
- source_word: לְהַעֲמִיד
  choice: назначить
  rationale: Каузатив от עמד может означать «поставить», «установить», «назначить». Здесь речь идёт об определении левитов на служение, поэтому выбрано «назначить».
- source_word: אֶת אֲחֵיהֶם
  choice: их братьев
  rationale: Сохранён буквальный термин родства; в данном контексте это соплеменники и собратья-левиты, что пояснено в сноске.
- source_word: הַמְשֹׁרְרִים
  choice: певцами
  rationale: Причастие от שׁיר конкретно обозначает поющих; творительный падеж естественно сочетается с глаголом «назначить».
- source_word: בִּכְלֵי שִׁיר
  choice: с музыкальными инструментами
  rationale: Естественная русская передача выражения «инструменты музыки/песни».
- source_word: נְבָלִים וְכִנֹּרוֹת וּמְצִלְתָּיִם
  choice: арфами, лирами и тарелками
  rationale: Два вида древних струнных инструментов переданы различными общеупотребительными названиями; מְצִלְתַּיִם — ударные музыкальные тарелки.
- source_word: מַשְׁמִיעִים
  choice: чтобы они громко играли
  rationale: Hiphil от שׁמע означает «делать слышимым, издавать звук». В связи с перечисленными инструментами «громко играли» естественно передаёт публичное звучание, не уточняя его характер сверх контекста.
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: возвышая голос с радостью
  rationale: Передана образная конструкция «поднимать голос/звук для радости». Формулировка сохраняет связь с пением и не добавляет отсутствующее в еврейском тексте существительное «песни».
