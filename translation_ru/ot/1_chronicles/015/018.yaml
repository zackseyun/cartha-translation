base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: ru
  text: 'Вместе с ними были их братья второго ряда[a]: Захария, Бен[b], Яазиил, Шемирамот, Иехиил, Унни, Елиав, Ванея, Маасея, Маттафия, Элифлеху, Микнея, а Овед-Эдом и Иеиил — привратники.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «их братья из второй группы» или «их братья второго порядка». Еврейское выражение, вероятно, выделяет вторую группу или второй порядок среди левитов-музыкантов.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст допускает чтение «Бен» как отдельного имени; в некоторых переводах сочетание передаётся как одно имя: «Бен-Яазиил».'
    reason: textual_ambiguity
