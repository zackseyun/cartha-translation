- source_word: וְעִמָּהֶם
  choice: Вместе с ними были
  rationale: В еврейском тексте это безглагольное предложение; глагол «были» добавлен для естественного русского синтаксиса.
- source_word: אֲחֵיהֶם
  choice: их братья
  rationale: Сохранено прямое значение слова; в данном контексте речь может идти о собратьях-левитах.
- source_word: הַמִּשְׁנִים
  choice: второго разряда
  rationale: Форма от слова «второй» обозначает вторую группу, порядок или более низкий ранг; «второго разряда» передаёт вероятное функциональное различие, не устраняя неоднозначности.
- source_word: זְכַרְיָהוּ בֵּן וְיַעֲזִיאֵל
  choice: Захария, Бен, Яазиил
  rationale: Масоретский текст, представленный в WLC, содержит союз перед именем Яазиил и позволяет естественно читать Бен как отдельное имя в перечне. Неоднозначность отмечена в сноске.
- source_word: הַשֹּׁעֲרִים
  choice: привратники
  rationale: Определение во множественном числе отнесено к двум последним названным лицам — Овед-Эдому и Иеиилу.
