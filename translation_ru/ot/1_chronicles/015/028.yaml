  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: ru
  text: И весь Израиль поднимал ковчег завета Яхве при громких возгласах[a], под звуки шофара[b], труб и кимвалов, играя на арфах и лирах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при ликовании»; еврейское слово может обозначать громкий праздничный крик или возглас приветствия.'
    reason: lexical_alternative
  - marker: b
    text: Шофар — роговой сигнальный инструмент, отличный от труб, упомянутых далее.
    reason: lexical_clarification
lexical_decisions:
- source_word: מַעֲלִים
  choice: поднимал
  rationale: 'Причастие породы хифиль передаёт продолжающееся действие: весь народ участвовал в перенесении ковчега вверх, в Иерусалим. Единственное число естественно согласуется с собирательным выражением «весь Израиль».'
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Сохраняется цепочка сопряжённых существительных и богословски значимое указание на завет.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога, стоящего в еврейском тексте, а не замена его титулом.
- source_word: תְרוּעָה
  choice: громкие возгласы
  rationale: Слово обозначает громкий крик, в данном праздничном контексте — возгласы ликования или приветствия; формулировка не сводит его исключительно к радости.
- source_word: קוֹל שׁוֹפָר
  choice: звуки шофара
  rationale: קוֹל прямо указывает на звук, а «шофар» сохраняет отличие этого рогового инструмента от упомянутых далее труб.
- source_word: חֲצֹצְרוֹת
  choice: трубы
  rationale: Обычное обозначение прямых церемониальных труб; материал инструмента в стихе не указан.
- source_word: מְצִלְתָּיִם
  choice: кимвалы
  rationale: Традиционный и понятный в библейском регистре русский эквивалент ударного инструмента.
- source_word: מַשְׁמִעִים
  choice: играя
  rationale: Хифильное причастие буквально означает «давая звучать». В сочетании со струнными инструментами естественное русское «играя» передаёт действие без ошибочной привязки только к кимвалам.
- source_word: נְבָלִים
  choice: арфы
  rationale: Точное современное соответствие древнему инструменту неизвестно; «арфы» сохраняют традиционное различение с כִנֹּרוֹת.
- source_word: כִנֹּרוֹת
  choice: лиры
  rationale: Выбран отдельный термин, чтобы сохранить различие двух названных в еврейском тексте видов струнных инструментов.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
- issue: Характер תְרוּעָה
  choice: громкие возгласы
  alternative: ликование; боевой клич; трубный сигнал
  rationale: Контекст торжественного перенесения указывает на праздничную аккламацию, однако само слово шире; перевод сохраняет эту смысловую открытость и не приписывает ему только одну эмоциональную окраску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Ковчег», «завет», «шофар» и «кимвалы» сохранены как точные культурно-библейские термины; синтаксис сделан плавным и понятным для обычного читателя.
