    reason: лексическая неоднозначность
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: собрал
  rationale: Порода hифиль глагола קהל означает, что Давид созвал и собрал народ; «собрал» естественно и точно передаёт это значение.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено обычное библейское собирательное обозначение народа или представляющего его собрания без поясняющего расширения.
- source_word: אֶל יְרוּשָׁלִָם
  choice: в Иерусалим
  rationale: Предлог אֶל выражает направление; русская конструкция «собрал … в Иерусалим» одновременно естественна и сохраняет эту направленность.
- source_word: לְהַעֲלוֹת
  choice: чтобы перенести
  rationale: В данном контексте речь идёт о доставке ковчега к приготовленному месту. «Перенести» естественно передаёт транспортировку священного предмета, не добавляя не указанного в стихе способа переноски; буквальный оттенок движения вверх здесь по-русски звучал бы неестественно.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Сохранена конструкция принадлежности и личное имя יְהוָה, переданное принятой русской транслитерацией «Яхве».
- source_word: אֶל מְקוֹמוֹ
  choice: на место
  rationale: Русская фраза с последующим «для него» ясно связывает место с ковчегом и избегает тяжеловесного повторения местоимений; значение суффикса раскрывается контекстом.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: которое приготовил для него
  rationale: Опущенное подлежащее естественно понимается как Давид. Мужское местоимение «него» сохраняет формальную неоднозначность древнееврейского לוֹ, пояснённую в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога — тетраграмматон, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Референт местоименного суффикса לוֹ
  choice: для него — вероятнее всего, для ковчега
  alternative: для Него — для Яхве
  rationale: Ближайший предметный контекст указывает на ковчег и его место, однако мужская форма древнееврейского местоимения допускает отнесение к Яхве; эта неоднозначность не устранена молча.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан плавным и доступным; личное имя «Яхве» сохранено, а реальная местоименная неоднозначность вынесена в сноску.
