  text: וְ/דָוִ֞יד מְכֻרְבָּ֣ל בִּ/מְעִ֣יל בּ֗וּץ וְ/כָל הַ/לְוִיִּם֙ הַ/נֹּשְׂאִ֣ים אֶת הָ/אָר֔וֹן וְ/הַ/מְשֹׁ֣רְרִ֔ים וּ/כְנַנְיָ֛ה הַ/שַּׂ֥ר הַ/מַּשָּׂ֖א הַ/מְשֹֽׁרְרִ֑ים וְ/עַל דָּוִ֖יד אֵפ֥וֹד בָּֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: ru
  text: Давид был облачён в верхнее одеяние из тонкого льна, как и все левиты, нёсшие ковчег, певцы и Хенания, руководитель пения певцов[a]. На Давиде был льняной эфод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «Хенания, руководитель при переноске»; или: «руководитель музыки». Еврейская фраза трудна и допускает разные толкования.'
    reason: Сохраняет неоднозначность выражения הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים, включая возможную связь הַמַּשָּׂא с ношением или переноской.
lexical_decisions:
- source_word: מְכֻרְבָּל
  choice: был облачён
  rationale: Страдательное причастие описывает Давида одетым или закутанным в названное далее одеяние; «был облачён» естественно для торжественного контекста.
- source_word: מְעִיל בּוּץ
  choice: одеяние из тонкого льна
  rationale: מְעִיל обозначает верхнее одеяние, а בּוּץ — высококачественный тонкий лён; перевод сохраняет и вид одежды, и материал.
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: левиты, нёсшие ковчег
  rationale: Причастная конструкция передаёт действие левитов во время шествия; «несшие» звучит естественно и точно.
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Корень прямо связан с пением; более широкое «музыканты» было бы менее точным.
- source_word: כְנַנְיָה
  choice: Хенания
  rationale: Передача имени соответствует его еврейской форме и принятому русскому библейскому именослову.
- source_word: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: руководитель пения певцов
  rationale: Это читаемая контекстуальная передача трудной масоретской конструкции; буквальное значение הַמַּשָּׂא допускает связь с ношением, поэтому неоднозначность отмечена в сноске.
- source_word: אֵפוֹד בָּד
  choice: льняной эфод
  rationale: «Эфод» сохранён как название особого культового одеяния, а בָּד передано как «льняной».
- source_word: וְעַל דָּוִיד
  choice: На Давиде был также
  rationale: Конструкция сохраняет различие между льняным одеянием и дополнительно упомянутым эфодом; «также» ясно выражает добавочный характер второй детали без богословского истолкования.
theological_decisions:
- issue: Характер одеяния Давида в богослужебном шествии
  choice: Сохранить термин «эфод», не определяя его как священническое облачение и не приписывая Давиду священническое служение.
  alternative: Передать как «священническое облачение» или прямо назвать Давида действующим священником.
  rationale: Стих сообщает, во что был одет Давид, но сам по себе не утверждает, что он занимал священническую должность.
- issue: Неясная конструкция הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: В основном тексте дать контекстуальное «руководитель пения певцов», а буквальную возможность связи с ношением сохранить в сноске.
  alternative: «Начальник ношения» или «руководитель при переноске».
  rationale: Масоретская формулировка синтаксически и лексически трудна. Читаемый основной вариант не должен скрывать реальную возможность иного понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Синтаксис упрощён для ясности, но перечень участников шествия и различие между двумя предметами одежды сохранены. Маркер сноски поставлен непосредственно после спорной фразы, к которой относится примечание.
