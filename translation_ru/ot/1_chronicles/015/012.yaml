  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: ru
  text: 'И сказал он им: «Вы — главы родов левитов. Освятитесь[a], вы и ваши братья, и принесите ковчег Яхве, Бога Израиля, на место, которое я приготовил для него».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятите себя». Еврейский глагол обозначает ритуальное освящение перед святым служением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: главы родов левитов
  rationale: Фраза обозначает глав родовых объединений среди левитов. «Главы родов» естественно передаёт патрилинейную семейно-родовую структуру, не вводя менее точного «семейств».
- source_word: הִתְקַדְּשׁוּ
  choice: освятитесь
  rationale: Возвратная форма глагола קדשׁ здесь означает ритуальное приготовление и посвящение себя святому служению. «Освятитесь» сохраняет культовый смысл и звучит естественно в библейском регистре.
- source_word: וַאֲחֵיכֶם
  choice: вы и ваши братья
  rationale: Сохранено прямое значение «братья»; в контексте речь идёт о собратьях-левитах.
- source_word: וְהַעֲלִיתֶם
  choice: внесите
  rationale: Каузатив глагола עלה буквально передаёт движение вверх, однако в данном контексте речь идёт о торжественном перенесении ковчега на приготовленное место. «Внесите» естественно передаёт действие по-русски и согласуется с последующим указанием места назначения.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: ковчег Яхве, Бога Израиля
  rationale: Сохранены как личное имя Яхве, так и приложение «Бога Израиля».
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: на место, которое я приготовил для него
  rationale: Существительное «место» не выражено прямо, но однозначно подразумевается предлогом направления אֶל и повествовательным контекстом; его добавление необходимо для ясного и естественного русского синтаксиса.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер повеления הִתְקַדְּשׁוּ
  choice: освятитесь
  alternative: посвятите себя; очиститесь
  rationale: Глагол указывает на ритуальное освящение перед служением. Перевод не сводит его только к нравственному очищению и не уточняет не названные в стихе обряды.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён без утраты родовой терминологии, культового смысла и прямого именования Яхве.
