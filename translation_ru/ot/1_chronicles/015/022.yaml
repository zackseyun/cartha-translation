base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: ru
  text: А Хенания, начальник левитов, руководил переноской[a], потому что был в этом искусен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «руководил пением, потому что был в нём искусен». Еврейское слово מַשָּׂא обычно означает «ноша», «несение» или «переноска», но некоторые понимают его здесь в музыкальном смысле из-за упоминаний певцов и музыкантов в ближайшем контексте.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально еврейский текст повторяет то же существительное: «при переноске… в переноске». Во втором случае повтор передан по-русски словами «в этом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: Хенания
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: שַׂר
  choice: начальник
  rationale: В данном служебном и культовом контексте слово обозначает руководителя или старшего; «начальник» ясно передаёт его положение среди левитов.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Стандартное русское обозначение потомков и служителей колена Левия; определённость выражена контекстом конструкции.
- source_word: בְּמַשָּׂא
  choice: переноской
  rationale: Обычное значение מַשָּׂא — «ноша, груз, несение». В контексте перенесения ковчега естественно передать его как «переноска», не исключая отмеченного в сноске музыкального понимания.
- source_word: יָסֹר
  choice: руководил
  rationale: Глагол выражает наставление или руководство. «Руководил» естественно описывает надзор Хенании за порученным делом.
- source_word: בַּמַּשָּׂא
  choice: в этом
  rationale: Повтор того же еврейского существительного передан по-русски местоименно, чтобы избежать тяжеловесности; повтор отмечен в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой Хенании было поручено руководство.
- source_word: מֵבִין הוּא
  choice: был искусен
  rationale: Причастие от בין здесь указывает не только на понимание, но и на практическую компетентность; «искусен» сохраняет смысл умения и опытности.
theological_decisions:
- issue: Относится ли מַשָּׂא к перенесению или к музыкальному исполнению
  choice: Основной текст говорит о переноске.
  alternative: «Руководил пением, потому что был в нём искусен».
  rationale: Обычное лексическое значение מַשָּׂא и ближайший повествовательный контекст перенесения ковчега поддерживают «переноску». Однако музыкальное окружение стиха допускает традиционное понимание как пения, поэтому неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. Синтаксис сделан ясным и естественным; лексическая неоднозначность מַשָּׂא не устранена молча, а отражена в сноске.
