  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: ru
  text: 'Тогда Давид сказал: «Никому, кроме левитов, нельзя носить ковчег Божий[a], потому что Яхве избрал их для того, чтобы они носили ковчег Яхве и служили ему вечно[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ковчег Божий нельзя носить никому, кроме левитов». В еврейском тексте подлежащее не выражено прямо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совершали для него священное служение». Еврейский глагол часто обозначает служение при святилище или во время богослужения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временную последовательность и естественно связывает слова Давида с предшествующими событиями.
- source_word: אָמַר דָּוִיד
  choice: Давид сказал
  rationale: Нейтральная и естественная повествовательная формула, соответствующая еврейскому тексту.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: Никому, кроме левитов, нельзя носить ковчег Божий
  rationale: В еврейском выражении подлежащее не названо; русский перевод восполняет его неопределённым местоимением, сохраняя исключительное право левитов и нормативный смысл высказывания.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: «Ковчег» — укоренившееся и точное обозначение священного предмета; форма «Божий» естественна для современного литературного русского языка.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое русское обозначение представителей колена Левия.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: потому что Яхве избрал их
  rationale: כִּי вводит основание сказанного, а совершенный вид «избрал» передаёт состоявшийся выбор с сохраняющейся силой.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: לָשֵׂאת
  choice: носить
  rationale: В данном контексте глагол означает физически переносить ковчег; «носить» также естественно передаёт постоянную обязанность.
- source_word: אֲרוֹן יְהוָה
  choice: ковчег Яхве
  rationale: Прямо сохраняет конструкцию принадлежности и повтор имени в еврейском тексте.
- source_word: וּלְשָׁרְתוֹ
  choice: и служить ему
  rationale: Глагол שרת обозначает служение, особенно священное или богослужебное; местоимение естественнее всего относится к Яхве.
- source_word: עַד עוֹלָם
  choice: вечно
  rationale: Кратко и естественно передаёт непреходящий характер назначения левитов.
theological_decisions:
- issue: К кому относится местоименный суффикс в וּלְשָׁרְתוֹ
  choice: «служить ему», то есть Яхве
  alternative: «служить перед ним/при нём», относя служение по смыслу к ковчегу
  rationale: Яхве — ближайший личный референт, а служение левитов в библейском употреблении понимается как служение Яхве. Перевод не превращает служение в обращение к священному предмету.
- issue: Исключительность поручения левитам
  choice: «Никому, кроме левитов, нельзя носить»
  alternative: «Ковчег Божий должны носить только левиты»
  rationale: Выбранная формулировка сохраняет отрицательно-исключительную структуру еврейского текста, не уточняя сверх него характер запрета.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сделан понятным без устранения эллиптичности оригинала из примечания; личное имя Яхве сохранено, а местоимение «ему» написано со строчной буквы как нейтральная современная норма.
