base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: ru
  text: Маттифия, Елифлеху, Микнейя, Овед-Эдом, Иеиел и Азазия должны были руководить исполнением на лирах согласно шеминиту[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на восьмом». Возможно: «в нижней октаве». Еврейское выражение «согласно шеминиту» — музыкальный термин, точное значение которого неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: Маттифия
  rationale: Личное имя передано в форме, близкой к еврейскому звучанию и естественной для русской библейской традиции.
- source_word: אֱלִיפְלֵהוּ
  choice: Елифлеу
  rationale: Транслитерация сохраняет засвидетельствованное здесь полное окончание имени.
- source_word: מִקְנֵיָהוּ
  choice: Микнеия
  rationale: Имя транслитерировано с передачей конечного теофорного элемента в привычной русской форме «-ия».
- source_word: עֹבֵד אֱדֹם
  choice: Овед-Эдом
  rationale: Составное личное имя передано транслитерацией и соединено дефисом для ясности.
- source_word: יעִיאֵל
  choice: Иеиел
  rationale: Использована узнаваемая русская транслитерация еврейского личного имени.
- source_word: עֲזַזְיָהוּ
  choice: Азазия
  rationale: Имя транслитерировано с естественной для русского библейского употребления передачей окончания יהו как «-ия».
- source_word: בְּכִנֹּרוֹת
  choice: игрой на лирах
  rationale: כִּנּוֹר обозначает древний струнный инструмент, точнее всего передаваемый современным словом «лира»; предлог ב имеет инструментальное значение.
- source_word: עַל הַשְּׁמִינִית
  choice: согласно шеминиту
  rationale: Это техническое музыкальное обозначение с неустановленным точным смыслом; транслитерация сохраняет неопределённость оригинала, а עַל передано как указание на способ исполнения.
- source_word: לְנַצֵּחַ
  choice: должны были руководить игрой
  rationale: В музыкальном контексте глагол может означать руководство или ведение исполнения; формулировка передаёт функцию названных музыкантов, не вводя более узкого должностного значения.
