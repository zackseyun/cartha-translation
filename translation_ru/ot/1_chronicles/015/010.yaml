  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: ru
  text: Из сыновей Уззиила — Амминадав, глава[a], и сто двенадцать его братьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальник»; возможно также: «князь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: из сыновей
  rationale: В данном перечне предлог ל вводит очередную родовую группу; по-русски естественно передать это как «из сыновей», согласуя с синтаксисом соседних пунктов списка.
- source_word: עֻזִּיאֵל
  choice: Уззиил
  rationale: Личное имя передано принятой в русской библейской традиции транслитерацией.
- source_word: עַמִּינָדָב
  choice: Амминадав
  rationale: Личное имя передано принятой в русской библейской традиции формой.
- source_word: הַשָּׂר
  choice: глава
  rationale: שַׂר обозначает начальника, руководителя или старшего; в перечне глав левитских родов слово «глава» звучит естественно и не привносит монархического смысла слова «князь».
- source_word: וְאֶחָיו
  choice: и ... его братьев
  rationale: אָח может обозначать как родных братьев, так и более широкий круг соплеменников или сородичей. «Братья» сохраняет родственный язык оригинала, а порядок слов перестроен ради естественного русского перечисления.
- source_word: מֵאָה וּשְׁנֵים עָשָׂר
  choice: сто двенадцать
  rationale: Прямая передача количественного числительного; в русском предложении число естественно поставлено перед существительным.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением краткой структуры родового перечня. Тире помогает ясно отделить название рода от имени его главы; перестановка числительного и сочетания «его братьев» соответствует естественному русскому синтаксису.
