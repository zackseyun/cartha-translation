  source_fidelity: 'Перевод точно передаёт еврейский текст: ковчег завета Яхве достигает города Давида; Мелхола, дочь Саула, смотрит из окна, видит царя Давида, пляшущего и веселящегося, и внутренне презирает его. «Выглянула из окна» не навязывает возможное значение взгляда вниз. «Плясал и веселился» адекватно передаёт два одновременных причастия מְרַקֵּד וּמְשַׂחֵק.'
