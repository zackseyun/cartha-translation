  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: ru
  text: Когда ковчег завета Яхве прибыл в город Давида, Мелхола, дочь Саула, выглянула из окна и увидела царя Давида, который плясал и веселился[a]. И она презрела его в своём сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «играл», «ликовал» или «предавался веселью».'
    reason: Еврейское מְשַׂחֵק допускает оттенки игры, ликования и праздничного веселья.
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Передаёт еврейскую цепочку сопряжённых существительных и сохраняет личное имя Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация тетраграмматона сохраняет личное имя, прямо употреблённое в еврейском тексте.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: прибыл в город Давида
  rationale: Глагол בוא с עַד обозначает достижение места назначения; по-русски «прибыл в» естественно выражает это без излишнего акцента на способе движения.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Мелхола, дочь Саула
  rationale: Сохраняет традиционную русскую форму имени и повествовательный акцент на её происхождении от Саула.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: выглянула из окна
  rationale: Естественно передаёт взгляд наружу из окна, не добавляя прямо не выраженного направления вниз.
- source_word: וַתֵּרֶא אֶת הַמֶּלֶךְ דָּוִיד
  choice: увидела царя Давида
  rationale: Естественная русская передача сочетания титула с личным именем.
- source_word: מְרַקֵּד
  choice: плясал
  rationale: Передаёт энергичное танцевальное движение; «плясал» уместно для публичного праздничного действия.
- source_word: וּמְשַׂחֵק
  choice: веселился
  rationale: В контексте праздничного шествия глагол обозначает радостное, игровое поведение; «веселился» естественно по-русски, а возможная оттеночная вариативность отмечена в сноске.
- source_word: וַתִּבֶז לוֹ
  choice: она презрела его
  rationale: Точно передаёт сильное внутреннее презрение, выраженное глаголом בזה.
- source_word: בְּלִבָּהּ
  choice: в своём сердце
  rationale: Сохраняет образное выражение еврейского текста и подчёркивает внутренний характер презрения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно стоит тетраграмматон; «Яхве» сохраняет личное имя Бога, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; традиционная форма имени «Мелхола» сохранена. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая вариативность.
