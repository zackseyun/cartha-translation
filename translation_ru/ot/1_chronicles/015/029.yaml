  terminology: «Ковчег завета Яхве» последовательно передаёт конструкцию אֲרוֹן בְּרִית יְהוָה и принятое в проекте личное имя Бога. «Царь Давид» и «Мелхола, дочь Саула» корректны. Сноска относится непосредственно к «веселился» и корректно отражает семантический диапазон מְשַׂחֵק; в отличие от английской аудиторской записи, её якорь поставлен по смыслу.
