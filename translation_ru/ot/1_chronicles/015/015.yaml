base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: ru
  text: И сыновья левитов понесли Божий ковчег на плечах, на шестах, лежавших на их плечах, как повелел Моисей по слову Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: понесли
  rationale: В данном повествовательном контексте נשׂא означает не разовое поднятие, а перенос ковчега; «понесли» естественно передаёт начавшееся действие.
- source_word: בְנֵי הַלְוִיִּם
  choice: сыновья левитов
  rationale: Сохранено буквальное родовое обозначение «сыновья левитов», а не обобщённое «левиты».
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Божий ковчег
  rationale: Естественная русская передача конструкции «ковчег Бога» без добавления отсутствующих в стихе слов «завета».
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: как повелел Моисей
  rationale: Передаёт соответствие действия ранее данному повелению Моисея без ненужного усложнения русской фразы.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Сохраняет существительное דָּבָר «слово» и связь повеления Моисея с прямым указанием Яхве.
- source_word: בִּכְתֵפָם
  choice: на плечах
  rationale: Точно и идиоматично указывает, на чём несли ковчег.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: с шестами на них
  rationale: Сохраняет упоминание шестов и местоименную конструкцию «на них», не устраняя полностью синтаксическую неоднозначность древнееврейской фразы; смысл пояснён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; личное имя передано как «Яхве», а не заменено титулом.
- issue: Родовое обозначение בְנֵי הַלְוִיִּם
  choice: сыновья левитов
  alternative: левиты
  rationale: Сохранена явно выраженная в исходном тексте форма мужского рода и родственная формулировка, а не нейтрализованное собирательное обозначение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет родовое обозначение, личное имя Яхве и краткость исходного текста.
