  yaml_path: translation/ot/1_chronicles/015/019.yaml
  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: ru
  text: А певцы — Еман, Асаф и Ефан — были с бронзовыми кимвалами, чтобы они громко звучали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы сделать слышимым», то есть чтобы звук был слышен; также возможно: «чтобы издавать громкий звук».'
    reason: Еврейский инфинитив לְהַשְׁמִיעַ буквально означает «сделать слышимым» и прямо не называет ни звук, ни инструмент.
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: А певцы
  rationale: Причастие с артиклем обозначает именно певцов; союз וְ передан как «а», поскольку стих продолжает распределение обязанностей в предыдущем контексте.
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: Еман, Асаф и Ефан
  rationale: Использованы устоявшиеся русские библейские формы личных имён.
- source_word: בִּמְצִלְתַּיִם
  choice: на кимвалах
  rationale: Предлог בְּ имеет инструментальное значение. «Кимвалы» точно обозначают древние ударные тарелки и сохраняют уместный библейский регистр.
- source_word: נְחֹשֶׁת
  choice: бронзовых
  rationale: В данном контексте слово обозначает бронзу или медный сплав; «бронзовых» точнее для металлических музыкальных инструментов и не вносит позднейшую латунь.
- source_word: לְהַשְׁמִיעַ
  choice: чтобы их было слышно
  rationale: Побудительная порода глагола שׁמע буквально выражает значение «сделать слышимым». Русская формулировка естественно передаёт цель — добиться отчётливо слышимого звучания кимвалов — без обязательного добавления отсутствующего в еврейском тексте наречия «громко».
