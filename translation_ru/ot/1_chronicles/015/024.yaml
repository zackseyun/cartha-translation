base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: ru
  text: Шевания, Иосафат, Нафанаил, Амасай, Захария, Ванея и Елиезер, священники, трубили[a] в трубы[b] перед ковчегом Божьим, а Овед-Эдом и Иехия были привратниками[c] при ковчеге.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «извлекали звуки из труб».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово здесь обычно обозначает прямые священнические трубы, использовавшиеся при богослужении.
    reason: cultural_note
  - marker: c
    text: 'Или: «дверными служителями при ковчеге».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Определённая форма служит приложением к перечисленным именам и указывает на их принадлежность к священникам.
- source_word: מחצצרים
  choice: трубили
  rationale: Причастная форма обозначает продолжающееся действие во время шествия; русский глагол «трубили» естественно передаёт и действие, и его длительный характер.
- source_word: בַּחֲצֹצְרוֹת
  choice: в трубы
  rationale: חֲצֹצְרוֹת — трубы, особенно прямые культовые трубы священников. Уточнение «серебряные» в самом стихе отсутствует и потому не внесено в основной текст.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Сохраняется прямое пространственное значение: священники находились перед ковчегом в шествии.'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Естественная русская передача конструкции «ковчег Бога» с сохранением традиционного библейского обозначения.
- source_word: שֹׁעֲרִים
  choice: привратниками
  rationale: Слово обозначает служителей, отвечавших за вход или доступ в священном пространстве; «привратники» сохраняет его служебно-культовый оттенок.
- source_word: לָאָרוֹן
  choice: при ковчеге
  rationale: Предлог указывает на назначение или сферу служения. «При ковчеге» естественно выражает ответственность этих людей по отношению к ковчегу, не уточняя сверх текста характер их поста.
- source_word: וְעֹבֵד אֱדֹם
  choice: Овед-Эдом
  rationale: Имя передано транслитерацией, близкой к еврейскому произношению и понятной в русской библейской традиции.
- source_word: וִיחִיָּה
  choice: Иехия
  rationale: Транслитерация сохраняет согласный состав еврейского имени и соответствует современному русскому оформлению библейских имён.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет перечисление и приложение «священники», но остаётся удобочитаемым. Имена переданы последовательно; добавления, отсутствующие в еврейском тексте, исключены.
