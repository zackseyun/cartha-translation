  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: И собрал
  rationale: Глагол אסף в повествовательной форме обозначает созывание людей вместе. «Собрал» естественно по-русски и близко передаёт еврейский текст; союз «И» отражает וַ и связь с предшествующим повествованием.
- source_word: דָּוִיד
  choice: Давид
  rationale: Традиционная и общепринятая русская форма личного имени.
- source_word: בְּנֵי אַהֲרֹן
  choice: сыновей Аарона
  rationale: Буквально «сыновья Аарона». В данном контексте выражение, вероятно, обозначает священническую группу потомков Аарона, однако перевод сохраняет родословную формулировку исходного текста и не заменяет её толкованием.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Устоявшееся русское обозначение представителей колена Левия, точно соответствующее культовому контексту.
- source_word: אֵת ... וְאֵת
  choice: отдельно не переводится; передано координацией однородных дополнений
  rationale: Частица אֵת маркирует определённое прямое дополнение и не имеет отдельного русского эквивалента. Повтор перед двумя объектами естественно передан конструкцией «сыновей Аарона и левитов».
