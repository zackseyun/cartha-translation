  text: לִ/בְנֵ֖י גֵּרְשׁ֑וֹם יוֹאֵ֣ל הַ/שָּׂ֔ר וְ/אֶחָ֖י/ו מֵאָ֥ה וּ/שְׁלֹשִֽׁים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/007.yaml
  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: ru
  text: 'Из сыновей Гершома: начальник Иоиль и 130 его братьев[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «братья» — мужчины из той же левитской родовой группы, не обязательно родные братья Иоиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Из сыновей
  rationale: Предлог לְ вводит очередную родовую группу в перечне. По-русски конструкция «Из сыновей…» естественно обозначает выбор названного главы и его группы из этого рода.
- source_word: גֵּרְשׁוֹם
  choice: Гершом
  rationale: Передаёт именно форму Гершом, засвидетельствованную в еврейском тексте данного стиха, не заменяя её встречающейся в других местах формой Гершон.
- source_word: יוֹאֵל
  choice: Иоиль
  rationale: Традиционная и узнаваемая русская библейская передача имени יוֹאֵל.
- source_word: הַשָּׂר
  choice: начальник
  rationale: В контексте перечня левитских родов שַׂר обозначает руководителя или главу группы; «начальник» передаёт эту служебную роль без оттенка царского достоинства.
- source_word: וְאֶחָיו
  choice: и его братьев
  rationale: Сохранено основное значение слова אָח, однако в данном родовом перечне речь идёт о мужчинах той же левитской семейной группе, а не обязательно о родных братьях Иоиля.
- source_word: מֵאָה וּשְׁלֹשִׁים
  choice: '130'
  rationale: Точное числовое значение передано цифрами, что естественно и удобно для восприятия в перечне.
