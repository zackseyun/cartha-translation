base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: ru
  text: И сделал Давид так, как повелел ему Бог, и они разбили стан филистимлян от Гаваона до Газера.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִיד כַּאֲשֶׁר
  choice: И сделал Давид так, как
  rationale: Сохраняет обычную повествовательную формулу и выражает соответствие поступка Давида Божьему повелению естественным русским языком.
- source_word: צִוָּהוּ הָאֱלֹהִים
  choice: повелел ему Бог
  rationale: «Повелел» передаёт значение צוה и соответствует достоинству библейского повествовательного регистра; предшествование повеления ясно из смысла и не требует отдельной грамматической маркировки в русском.
- source_word: וַיַּכּוּ
  choice: они разбили
  rationale: Форма глагола имеет множественное число и указывает на Давида вместе с его воинами. В военном контексте «разбили» естественно передаёт поражение противника.
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: стан филистимлян
  rationale: «Стан» близко передаёт буквальное значение מַחֲנֶה и в данном военном контексте может обозначать как лагерь, так и расположенное в нём войско, не устраняя исходную метонимическую многозначность.
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: от Гаваона до Газера
  rationale: Конструкция «от… до…» естественно обозначает предел распространения разгрома или преследования. Использованы традиционные русские формы библейских топонимов.
theological_decisions:
- issue: Подлежащее при וַיַּכּוּ
  choice: 'множественное число: Давид и его воины — «они разбили»'
  alternative: единственное число с Давидом как собирательным субъектом — «он разбил»
  rationale: Еврейская глагольная форма недвусмысленно стоит во множественном числе; перевод сохраняет эту грамматическую деталь, не добавляя прямо отсутствующего обозначения воинов.
- issue: Значение מַחֲנֵה в военном контексте
  choice: «стан филистимлян»
  alternative: «войско филистимлян»
  rationale: «Стан» сохраняет лексический образ исходного текста и допускает контекстуальное понимание военной силы, тогда как «войско» однозначно разрешило бы возможную метонимию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Синтаксис прост и понятен; «стан» выбран как общеупотребительное в библейском контексте слово, сохраняющее образ оригинала.
