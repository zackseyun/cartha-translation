base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: ru
  text: И послал Хирам, царь Тира, к Давиду посланников[a], и кедровую древесину, каменщиков и плотников, чтобы построить ему дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «послов». В царском контексте еврейское слово может обозначать официальных представителей.'
