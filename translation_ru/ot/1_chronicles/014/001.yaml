  - marker: b
    text: 'Или: «дворец». Еврейское слово «дом» может обозначать царскую резиденцию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Вав с последовательной глагольной формой продолжает повествование; «И послал» естественно передаёт связь с предшествующим контекстом и прошедшее действие.
- source_word: חירם
  choice: Хирам
  rationale: Передача имени следует данной в стихе консонантной форме и принятой русской библейской традиции для этого царя.
- source_word: מֶלֶךְ צֹר
  choice: царь Тира
  rationale: Сопряжённая конструкция прямо обозначает сан Хирама и город-государство, которым он правил.
- source_word: מַלְאָכִים
  choice: посланников
  rationale: Слово имеет широкое значение «посланники»; в царском контексте возможны «послы», однако основной вариант не уточняет их официальный ранг сверх еврейского текста.
- source_word: וַעֲצֵי אֲרָזִים
  choice: а также кедровые брёвна
  rationale: Речь идёт о кедровом строительном материале, а не о растущих деревьях; «брёвна» конкретно и естественно в данном контексте. «А также» ясно связывает отправленные материалы и мастеров с посланниками.
- source_word: חָרָשֵׁי קִיר
  choice: каменщиков
  rationale: Буквально это мастера по стенам; в контексте строительства русское «каменщики» является кратким и естественным соответствием.
- source_word: חָרָשֵׁי עֵצִים
  choice: плотников
  rationale: Сочетание обозначает мастеров, работающих с деревом; при строительстве дома естественный русский эквивалент — «плотники».
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: чтобы построить ему дом
  rationale: Инфинитив передаёт цель. «Дом» сохраняет основное значение בַּיִת, не устраняя возможный контекстуальный смысл царской резиденции.
theological_decisions:
- issue: Значение בַּיִת применительно к царю
  choice: дом
  alternative: дворец
  rationale: Царский контекст допускает значение «дворец», но исходное слово остаётся более широким. Основной текст сохраняет эту смысловую открытость, а возможное уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность и координацию еврейского повествования, но избегает тяжеловесности; неоднозначность слова «дом» сохранена.
