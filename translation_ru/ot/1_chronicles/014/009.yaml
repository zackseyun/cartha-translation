  text: The Philistines came and raided the Valley of Rephaim[a].
translation:
  language: ru
  text: Филистимляне пришли и совершили набег на долину Рефаим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «развернулись в долине Рефаим». Еврейский глагол может означать развёртывание войска или совершение набега; контекст указывает на вражеское военное вторжение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Филистимляне
  rationale: Этноним פְלִשְׁתִּים передан принятым русским соответствием «филистимляне». Союз ו в русском повествовании можно не выражать отдельным словом, поскольку связь с контекстом ясна.
- source_word: בָּאוּ
  choice: пришли
  rationale: Форма qal perfect 3-го лица множественного числа от בוא имеет прямое значение «пришли»; совершенный вид естественен для последовательного повествования.
- source_word: וַיִּפְשְׁטוּ
  choice: совершили набег
  rationale: В военном контексте פשט может обозначать как развёртывание или рассредоточение, так и враждебное вторжение с целью набега. «Совершили набег» естественно передаёт вероятный контекстуальный смысл, а подлинная лексическая неоднозначность сохранена в сноске.
- source_word: בְּ/עֵמֶק
  choice: на долину
  rationale: עֵמֶק означает «долина». При глагольном выражении «совершить набег» еврейский предлог ב естественно передаётся русским «на».
- source_word: רְפָאִים
  choice: Рефаим
  rationale: Здесь רְפָאִים входит в географическое название; оно передано традиционной русской транслитерацией «Рефаим», без истолковывающего перевода.
