source:
  edition: WLC
  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: ru
  text: И когда услышишь звук шагов в верхушках бальзамовых деревьев[a], тогда выступай на битву, потому что Бог выступил перед тобой, чтобы поразить войско филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деревьев бака»; по традиции — «тутовых деревьев». Какой именно вид дерева обозначает древнееврейское слово, точно неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: И когда услышишь
  rationale: Сочетание וִיהִי с כְּ и инфинитивом вводит временное обстоятельство. Русское «И когда услышишь» естественно передаёт эту функцию, не утяжеляя фразу буквальным «и будет».
- source_word: קוֹל הַצְּעָדָה
  choice: звук шагов
  rationale: קוֹל здесь означает слышимый звук, а הַצְּעָדָה — шагание или поступь. «Звук шагов» сохраняет образ исходного текста и не конкретизирует его сверх необходимого как стройное военное шествие.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: в верхушках бальзамовых деревьев[a]
  rationale: רָאשֵׁי обозначает верхние части деревьев. Вид дерева, названный בְּכָאִים, точно не установлен; «бальзамовые деревья» — распространённое и понятное соответствие, а неопределённость отмечена в сноске.
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: тогда выступай на битву
  rationale: אָז обозначает последующее действие, а יצא в военном контексте естественно передаётся глаголом «выступать». Императивное русское «выступай» выражает повелительную силу древнееврейского имперфекта в данной речи.
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: потому что Бог выступил перед тобой
  rationale: כִּי вводит основание повеления. Перфект יָצָא представляет действие Бога как уже начавшееся к моменту знамения; повторение «выступил» сохраняет военный образ глагола יצא.
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: чтобы поразить войско филистимлян
  rationale: Инфинитив לְהַכּוֹת выражает цель и означает «поразить, разбить». מַחֲנֶה может означать лагерь или расположенное войско; в контексте сражения «войско» естественно передаёт объект предстоящего поражения.
theological_decisions:
- issue: Передача הָאֱלֹהִים
  choice: Бог
  alternative: боги
  rationale: Хотя форма אֱלֹהִים морфологически множественного числа, согласованный с ней глагол стоит в единственном числе, а контекст указывает на Бога Израиля; поэтому требуется единственное число.
- issue: Временной смысл יָצָא применительно к Божьему действию
  choice: выступил
  alternative: выступает / выступит
  rationale: Перфект изображает Божье выступление как уже совершившееся или начавшееся к моменту, когда Давид услышит знак. Прошедшее время сохраняет эту последовательность, не добавляя отсутствующего в тексте наречия «уже».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Военная образность сохранена без архаизмов; синтаксис остаётся ясным для широкого круга читателей.
