  text: וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת הַ/יְלוּדִ֔ים אֲשֶׁ֥ר הָיוּ ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב נָתָ֖ן וּ/שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: ru
  text: 'И вот имена детей, родившихся у него в Иерусалиме: Шаммуа, Шовав, Нафан и Соломон.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Сочетание союза с указательным местоимением связывает стих с предыдущим повествованием и вводит перечень; «И вот» естественно передаёт эту функцию по-русски.
- source_word: שְׁמוֹת
  choice: имена
  rationale: Форма множественного числа в сопряжённой конструкции вводит следующий далее перечень лиц.
- source_word: הַיְלוּדִים אֲשֶׁר הָיוּ לוֹ
  choice: детей, родившихся у него
  rationale: Субстантивированное пассивное причастие буквально обозначает «рождённых», а конструкция с לוֹ указывает на принадлежность. «Детей, родившихся у него» сохраняет родовой термин без необоснованной замены на обычное еврейское слово «сыновья»; все перечисленные имена при этом мужские.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предложная конструкция прямо обозначает место рождения.
- source_word: שַׁמּוּעַ
  choice: Шаммуа
  rationale: Традиционно узнаваемая русская передача личного имени с сохранением удвоенного согласного исходной формы.
- source_word: שׁוֹבָב
  choice: Шовав
  rationale: Транслитерация личного имени с передачей еврейской буквы bet без дагеша как «в».
- source_word: נָתָן
  choice: Нафан
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Устоявшаяся русская библейская форма имени.
