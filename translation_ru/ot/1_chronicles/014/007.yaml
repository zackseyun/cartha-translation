base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/007.yaml
  text: and Elishama[a], and Beeliada, and Eliphelet.
translation:
  language: ru
  text: Элишама, Беэлиада[a] и Элифелет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном списке, во 2 Царств 5:16, это имя дано в форме «Элиада». Здесь в еврейском тексте стоит «Беэлиада».
    reason: alternative_reading
lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: Элишама
  rationale: Личное имя передано транслитерацией с учётом еврейской согласной שׁ (ш). Союз ו входит в последовательное перечисление и по нормам русского языка не воспроизводится перед каждым именем.
- source_word: וּ/בְעֶלְיָדָע
  choice: Беэлиада
  rationale: Перевод следует данной форме масоретского текста בְעֶלְיָדָע, не заменяя её формой «Элиада» из параллельного списка. Написание «Беэлиада» сохраняет начальную согласную ב и позволяет отличить эту форму имени от параллельной.
- source_word: וֶ/אֱלִיפָלֶט
  choice: и Элифелет
  rationale: Личное имя передано транслитерацией; конечный союз «и» естественно завершает русское перечисление и совокупно передаёт повторяющийся еврейский союз ו.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткое перечисление оформлено естественно для русской речи, без механического повторения союза перед каждым именем. Транслитерации сохраняют различие между формами имени в данном и параллельном текстах.
