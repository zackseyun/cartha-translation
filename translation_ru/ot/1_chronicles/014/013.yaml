  rationale: Традиционное и общепонятное русское название этого народа.
- source_word: וַיִּפְשְׁטוּ
  choice: расположились
  rationale: В данном военном контексте глагол פשט описывает развёртывание войска по местности; «расположились» передаёт это без необоснованного уточнения о набеге или грабеже.
- source_word: בָּעֵמֶק
  choice: по долине
  rationale: Предлог ב допускает локативное понимание; в сочетании с развёртыванием войска русское «по долине» естественно передаёт распространение по её пространству.
