- source_word: וַיֹּסִיפוּ עוֹד
  choice: снова
  rationale: Сочетание глагола יסף с עוֹד передаёт повторение действия; по-русски его естественно выразить одним наречием «снова».
- source_word: פְּלִשְׁתִּים
