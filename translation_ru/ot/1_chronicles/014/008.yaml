base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: ru
  text: Когда филистимляне услышали, что Давид был помазан царём над всем Израилем, все филистимляне поднялись искать Давида. Давид услышал об этом и выступил им навстречу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышел перед ними»; возможно также: «вышел против них». Древнееврейское выражение может подразумевать военное столкновение, не называя его прямо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: услышали
  rationale: В повествовательном контексте שׁמע означает получение известия; «услышали» прямо передаёт глагол и сохраняет его повтор далее в стихе.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское наименование этого народа.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного, а не причину действия.
- source_word: נִמְשַׁח
  choice: был помазан
  rationale: Форма нифаль передаёт страдательное значение «быть помазанным»; русское прошедшее время естественно обозначает уже совершившееся событие.
- source_word: לְמֶלֶךְ
  choice: царём
  rationale: Творительный падеж естественно выражает положение, на которое Давид был помазан.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Предлог עַל при царской власти указывает на правление над народом и сохраняет всеизраильский масштаб царствования.
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Передаёт обычное пространственное значение עלה в военно-географическом повествовании, не добавляя прямо не выраженного значения «выступили войной».
- source_word: כָל פְּלִשְׁתִּים
  choice: все филистимляне
  rationale: Прямо сохраняет коллективную формулировку древнееврейского текста, не заменяя народ явно военным подразделением.
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: искать Давида
  rationale: Буквально и естественно передаёт בקשׁ; в контексте поиск явно враждебен, но конкретная цель не уточняется самим глаголом.
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: Давид услышал об этом
  rationale: Сохраняет повтор глагола שׁמע, а добавленное по нормам русского языка «об этом» проясняет подразумеваемый предмет известия.
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: выступил им навстречу
  rationale: Передаёт движение Давида навстречу филистимлянам в естественной русской форме, не утверждая однозначно оттенок нападения; буквальный образ сохранён в сноске.
