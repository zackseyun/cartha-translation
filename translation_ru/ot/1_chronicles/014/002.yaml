source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔יד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל כִּֽי נִשֵּׂ֤את לְ/מַ֨עְלָ/ה֙ מַלְכוּת֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: ru
  text: И Давид узнал, что Яхве утвердил его царём над Израилем, ибо его царство было высоко возвышено[a] ради его народа, Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его царская власть была высоко возвеличена»; также возможно: «его царствование было высоко вознесено».'
    reason: Еврейское מַלְכוּת может означать «царство», «царская власть» или «царствование», а выражение נִשֵּׂאת לְמַעְלָה передаёт образ высокого возвышения.
  - marker: b
    text: 'То есть Израиля как народа Яхве; возможно также понимание: «ради народа Давида — Израиля».'
    reason: Местоименный суффикс в עַמּוֹ («его народа») грамматически может относиться как к Яхве, так и к Давиду. Строчная буква в основном тексте сохраняет эту неоднозначность.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: И понял
  rationale: Форма ידע может обозначать как знание, так и осознание. В данном повествовательном контексте «понял» естественно передаёт наступившее осознание Давида.
- source_word: הֱכִינוֹ
  choice: утвердил его
  rationale: Hiphil глагола כון означает сделать прочным, утвердить или упрочить; здесь речь об утверждении Давида в царском положении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: царём над Израилем
  rationale: Предлог לְ указывает на назначение или положение, а עַל — на власть над Израилем.
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: было высоко вознесено
  rationale: Перевод сохраняет образ буквального возвышения и одновременно передаёт значение высокого возвеличения.
- source_word: מַלְכוּתוֹ
  choice: царство его
  rationale: מַלְכוּת допускает значения «царство», «царская власть» и «царствование». «Царство» сохраняет предметную неоднозначность исходного выражения.
- source_word: בַּעֲבוּר
  choice: ради
  rationale: 'Предлог выражает цель или благо получателя: возвышение царства совершилось ради народа.'
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: Его народа Израиля
  rationale: Заглавная буква отражает принятое в основном тексте понимание суффикса как относящегося к Яхве; сама синтаксическая возможность отнести его к Давиду отмечена в сноске.
theological_decisions:
- issue: К кому относится местоименный суффикс в עַמּוֹ («его народа»)?
  choice: 'К Яхве: «Его народа Израиля»'
  alternative: 'К Давиду: «его народа Израиля»'
  rationale: Контекст Летописей естественно представляет Израиль народом Яхве и объясняет возвышение царства благом Божьего народа. Однако грамматически возможна и отсылка к Давиду, поэтому альтернатива сохранена в сноске.
- issue: Значение второго כִּי
  choice: 'Причинное: «потому что»'
  alternative: 'Изъяснительное: «что»'
  rationale: Вторая часть стиха наиболее естественно сообщает основание, по которому Давид понял, что Яхве утвердил его; изъяснительное прочтение также возможно, но менее ясно в данном синтаксисе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «царство его» сохраняет ясную связь местоимения с Давидом и умеренно возвышенный регистр; написание «Его» помогает обозначить основное понимание другого местоимения, не устраняя альтернативу, вынесенную в сноску.
