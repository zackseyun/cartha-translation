base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: ru
  text: 'И вновь Давид вопросил Бога, и Бог сказал ему: «Не выступай вслед за ними. Обойди в стороне от них и подойди к ним напротив бальзамовых деревьев[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «деревьев бака»; точный вид дерева неизвестен. В традиционных переводах также встречается «тутовые деревья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: Давид вопросил Бога
  rationale: Глагол שׁאל с предлогом ב здесь означает обращение к Богу за указанием. «Вопросил» сохраняет краткость и торжественный повествовательный регистр, оставаясь понятным современному читателю.
- source_word: עוֹד
  choice: вновь
  rationale: Обозначает повторное обращение Давида к Богу; «вновь» естественно звучит в литературном повествовании.
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: Не выступай вслед за ними
  rationale: עלה буквально связано с движением вверх, а в военном контексте — с выступлением или наступлением. «Не выступай» передаёт военный смысл, не уточняя способ атаки сверх еврейского текста.
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: Обойди в стороне от них
  rationale: הָסֵב указывает на поворот или обходной манёвр, а מֵעֲלֵיהֶם — на удаление от прямого направления к противнику. Перевод не добавляет отсутствующего в данной формулировке прямого указания на заход в тыл.
- source_word: וּבָאתָ לָהֶם
  choice: и подойди к ним
  rationale: בוא с ל в военном контексте описывает приближение к противнику. Контекст уже ясно указывает на враждебное столкновение, поэтому дополнительное «напади» не требуется.
- source_word: מִמּוּל
  choice: напротив
  rationale: Передаёт пространственное положение лицом к объекту или по другую сторону от него, сохраняя лаконичность оригинала.
- source_word: הַבְּכָאִים
  choice: бальзамовых деревьев
  rationale: Точный вид растения не установлен. «Бальзамовые деревья» отражает распространённое лексикографическое понимание и даёт читателю конкретный образ; неопределённость отмечена в сноске.
