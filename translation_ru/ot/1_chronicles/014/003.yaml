base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: ru
  text: И взял Давид в Иерусалиме ещё жён[a], и родились у Давида ещё сыновья и дочери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давид взял в Иерусалиме ещё жён» можно передать: «Давид женился в Иерусалиме ещё на женщинах»; буквально: «взял в Иерусалиме ещё жён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Глагол לקח буквально означает «брать»; в сочетании с נָשִׁים он описывает взятие женщин в жёны. Формулировка сохраняет образ еврейского текста, а сноска поясняет естественную русскую альтернативу.
- source_word: עוֹד
  choice: ещё
  rationale: В обоих случаях слово имеет количественное значение и указывает на дополнительных жён и детей.
- source_word: נָשִׁים
  choice: жён
  rationale: Хотя форма может означать «женщин» или «жён», контекст с глаголом «взял» указывает на брачные отношения.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог ב употреблён здесь в обычном местном значении.
- source_word: וַיּוֹלֶד
  choice: родились у Давида
  rationale: Каузативная форма ילד с Давидом как мужским субъектом означает, что он стал отцом. Русское «родились у Давида» точно и естественно передаёт смысл без архаического «породил».
- source_word: בָּנִים וּבָנוֹת
  choice: сыновья и дочери
  rationale: Сохраняется явное упоминание обоих полов вместо обобщающего «дети».
- source_word: דָּוִיד
  choice: Давид
  rationale: Традиционная русская форма библейского имени.
theological_decisions:
- issue: Повествовательное упоминание многожёнства Давида
  choice: Передать сообщение описательно, без нравственной оценки.
  alternative: Добавить оттенок одобрения или осуждения.
  rationale: Сам стих сообщает о дополнительных жёнах Давида, но не даёт практике прямой нравственной оценки; перевод не должен привносить её.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционным библейским строем. Повтор имени Давида сохранён по смыслу, но вторая конструкция сделана естественной для русского языка; нравственная оценка повествованию не добавлена.
