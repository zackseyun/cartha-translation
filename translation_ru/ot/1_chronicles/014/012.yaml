  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: ru
  text: Они оставили там своих богов[a], и Давид приказал[b] сжечь их огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих идолов». Буквально в еврейском тексте: «своих богов», хотя, вероятно, имеются в виду их культовые изображения.'
    reason: lexical_alternative
  - marker: b
    text: 'В параллельном повествовании, во 2 Царств 5:21, сказано иначе: «Давид и его люди унесли их». Здесь же, в Паралипоменоне, говорится, что по приказу Давида они были сожжены огнём.'
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַזְבוּ שָׁם
  choice: Они оставили там
  rationale: 'Глагол עזב здесь естественно передаётся как «оставили»: филистимляне при бегстве оставили принадлежавшие им культовые предметы. Наречие שָׁם прямо означает «там».'
- source_word: אֶת אֱלֹהֵיהֶם
  choice: своих богов
  rationale: Еврейский текст буквально говорит «их богов». Возвратное «своих» естественно по-русски указывает на принадлежность подлежащему; вероятный предметный референт пояснён в сноске.
- source_word: וַיֹּאמֶר דָּוִיד
  choice: и Давид приказал
  rationale: 'Буквально: «и сказал Давид». По контексту его слова имеют силу распоряжения о сожжении, поэтому «приказал» ясно и естественно передаёт функцию речи.'
- source_word: וַיִּשָּׂרְפוּ בָּאֵשׁ
  choice: сжечь их в огне
  rationale: Форма וַיִּשָּׂרְפוּ может быть понята как «они были сожжены»; в русском сочетание «Давид приказал, и они были сожжены» тяжеловесно. Инфинитивная конструкция естественно выражает тот же результат распоряжения, а местоимение «их» относится к ранее названным богам, не называя исполнителей.
theological_decisions:
- issue: Передача אֱלֹהֵיהֶם применительно к языческим культовым изображениям
  choice: своих богов
  alternative: своих идолов
  rationale: Сохранено буквальное обозначение исходного текста — «боги», без внесения в основной текст более истолковывающего слова «идолы». Вероятный смысл поясняется в сноске.
- issue: Связь распоряжения Давида с уничтожением культовых предметов
  choice: Давид приказал сжечь их в огне
  alternative: Давид сказал, и они были сожжены в огне
  rationale: Выбранная русская конструкция передаёт речевой акт как приказ и сохраняет отсутствие названных исполнителей, не устраняя различие с параллельным повествованием во 2 Царств 5:21.
translation_notes:
  register: Современный литературный русский язык, ясный и повествовательно сдержанный. Слово «боги» сохраняет формулировку еврейского источника, а конструкция «приказал сжечь» избегает неестественного пассива и не называет не указанных в тексте исполнителей.
