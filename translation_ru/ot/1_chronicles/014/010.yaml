  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: ru
  text: 'И вопросил Давид Бога: «Идти ли мне против филистимлян? Предашь ли Ты их в мои руки[a]?» И сказал ему Яхве: «Иди, и Я предам их в твои руки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дашь ли Ты их в мою руку». Это древнееврейское выражение означает «отдашь ли Ты их в мою власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: вопросил ... Бога
  rationale: В данном сочетании глагол означает обращение к Богу за указанием. «Вопросил Бога» передаёт осознанное вопрошание, оставаясь естественным для возвышенного повествовательного стиля.
- source_word: הַאֶעֱלֶה
  choice: идти ли мне
  rationale: Глагол עלה буквально означает «подниматься, восходить», но здесь употреблён в военном значении выступления в поход. Русское «идти ли мне» естественно передаёт вопрос о необходимости военного выступления без неуместного акцента на рельефе.
- source_word: עַל פלשתיים
  choice: против филистимлян
  rationale: Предлог עַל в военном контексте обозначает враждебное движение против народа.
- source_word: וּנְתַתָּם בְּיָדִי / וּנְתַתִּים בְּיָדֶךָ
  choice: предашь ли Ты их в мои руки / Я предам их в твои руки
  rationale: Оборот נתן ביד означает отдать врага во власть победителя. «Предать в руки» сохраняет древнееврейский образ и зеркальное соответствие вопроса и ответа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: עֲלֵה
  choice: иди
  rationale: Повелительная форма повторяет глагол из вопроса Давида; «иди» сохраняет эту связь и естественно звучит по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит личное имя Бога. Форма «Яхве» передаёт наиболее общепринятую научную реконструкцию произношения и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён до естественного русского вопроса, а параллелизм вопроса Давида и ответа Яхве сохранён.
