  choice: Элишуа
  rationale: Имя транслитерировано непосредственно по масоретскому тексту Паралипоменон; форма «Элишама» из параллельного места не внесена в основной текст.
- source_word: אֶלְפָּלֶט
  choice: Элпелет
  rationale: Транслитерация следует согласным и огласовке масоретского текста и не подменяет имя традиционным вариантом написания.
- source_word: וְ / וֶ
  choice: и
  rationale: Повторяющийся союз сохранён как многосоюзие, поскольку стих продолжает перечень имён и еврейский текст ставит союз перед каждым именем.
