base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: ru
  text: И имя Давида разнеслось по всем землям[a], а Яхве внушил всем народам страх перед ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имя Давида вышло во все земли»; имеется в виду, что повсюду распространилась слава Давида.'
    reason: lexical_alternative
  - marker: b
    text: 'Вероятнее всего, речь о страхе перед Давидом. Возможно также понимание: «Яхве внушил всем народам страх перед Собой».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: имя Давида разнеслось
  rationale: Буквально сочетание означает «имя Давида вышло», но в данном обороте речь идёт о распространении известности. «Имя… разнеслось» сохраняет еврейскую метонимию и естественно звучит по-русски.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: по всем землям
  rationale: Множественное אֲרָצוֹת обозначает земли или страны, прежде всего окружающие территории. «По всем землям» передаёт распространение известности и сохраняет образ исходного текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: נָתַן אֶת פַּחְדּוֹ עַל
  choice: навёл… страх перед ним на
  rationale: 'Буквально: «положил/дал страх перед ним на». Русский оборот «навёл страх» естественно передаёт каузативный смысл этого сочетания.'
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: גּוֹיִם здесь обозначает окружающие народы; «народы» точнее сохраняет этнополитический смысл, чем более современное «государства».
theological_decisions:
- issue: К кому относится местоименный суффикс в פַּחְדּוֹ («страх перед ним»)?
  choice: 'В основном тексте местоимение отнесено к Давиду: Яхве внушил народам страх перед Давидом.'
  alternative: 'Суффикс можно отнести к Яхве: Яхве навёл на народы страх перед Собой.'
  rationale: Ближайший контекст говорит о распространившемся имени Давида после его побед, поэтому Давид является наиболее вероятным референтом. Альтернативное грамматически возможное понимание сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Еврейская метонимия «имя» сохранена, а не заменена словом «слава»; неестественная для русского буквальная конструкция с глаголом «вышло» разъяснена в примечании.
