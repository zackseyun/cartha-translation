revisions:
- from: 'И поднялись они к Баал-Перациму[a], и Давид поразил их там. И сказал Давид: «Бог прорвался сквозь моих врагов моей рукой, как прорываются воды». Поэтому то место назвали Баал-Перацимом.'
  to: 'Они пошли к Баал-Перациму[a], и Давид поразил их там. Давид сказал: «Бог сокрушил моих врагов моей рукой, подобно прорыву вод». Поэтому то место назвали Баал-Перацим.'
  rationale: Исправлена двусмысленная русская конструкция, создававшая впечатление буквального прохождения «сквозь» врагов. Новый вариант сохраняет божественное действие, посредничество Давида («моей рукой»), образ прорыва вод и словесную связь с Баал-Перацимом. Формула именования оставлена в русском множественно-неопределённом виде, соответствующем еврейскому глаголу во множественном числе.
