base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: ru
  text: 'Они пошли к Баал-Перациму[a], и Давид поразил их там. Давид сказал: «Бог сокрушил моих врагов моей рукой, подобно прорыву вод». Поэтому то место назвали Баал-Перацим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Баал-Перацим» может означать «владыка прорывов» или «место прорывов»; оно перекликается со словами Давида о прорыве, совершённом Богом против его врагов.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: поднялись они
  rationale: Сохраняет обычное для военного передвижения значение עלה — «подняться, выступить вверх», не уточняя направление сверх сказанного в тексте.
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: к Баал-Перациму / Баал-Перацимом
  rationale: Название места передано транслитерацией; русские падежные формы обеспечивают естественность. Значение и игра слов с корнем פרץ пояснены в сноске.
- source_word: וַיַּכֵּם
  choice: Давид поразил их
  rationale: В военном контексте נכה означает нанесение поражения или поражающий удар. «Поразил» сохраняет конкретность и допускает оба оттенка.
- source_word: פָּרַץ
  choice: прорвался сквозь
  rationale: Передаёт образ мощного прорыва и сохраняет связь с названием Перацим и сравнением с прорывающимися водами.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Несмотря на артикль, форма здесь обозначает единого Бога; единственное число глагола подтверждает единственного субъекта.
- source_word: אֶת אוֹיְבַי
  choice: моих врагов
  rationale: Прямое и естественное соответствие еврейскому выражению.
- source_word: בְּיָדִי
  choice: моей рукой
  rationale: Сохраняет еврейский образ руки как орудия действия и одновременно ясно показывает, что Бог действует посредством Давида.
- source_word: כְּפֶרֶץ מָיִם
  choice: как прорываются воды
  rationale: Естественно передаёт образ вод, с силой прорывающих преграду, и сохраняет повтор корня «прорыв», важный для игры слов.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Ясно и естественно передаёт причинно-следственную связь.
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: то место назвали
  rationale: Безлично-множественная русская конструкция точно отражает форму третьего лица множественного числа, не заменяя её единственным числом, и звучит естественнее буквального «назвали имя того места».
theological_decisions:
- issue: Кто действует в словах Давида и какова роль Давида
  choice: Бог — единственный божественный субъект, совершающий прорыв посредством руки Давида
  alternative: Давид одержал победу сам, лишь приписав её Богу в общем смысле
  rationale: Единственное число פָּרַץ прямо называет Бога действующим субъектом, а בְּיָדִי сохраняет Давида как человеческое орудие действия. Перевод удерживает обе стороны высказывания.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Повтор «И» в первых предложениях сохраняет последовательный ритм еврейского рассказа, а формула именования передана естественной русской конструкцией.
