translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранена последовательность кратких военных действий; архаизмы вроде «поразил» и «сына Аммона» не использованы. Подлинная неопределённость выражения о времени года сохранена в основном тексте и пояснена сноской.
