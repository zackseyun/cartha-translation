base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: ru
  text: И было на рубеже года[a], в то время, когда цари выступают в поход, Иоав повёл войско, опустошил землю аммонитян, пришёл и осадил Равву. Давид же оставался в Иерусалиме. Иоав поразил Равву и разрушил её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «весной, когда цари выступают в поход». Буквально по-еврейски: «на рубеже года, в то время, когда цари выходят».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: на рубеже года
  rationale: Передаёт буквальный образ поворота или возвращения годового цикла и не сводит выражение безоговорочно к весне; сезонное истолкование отмечено в сноске.
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: в то время, когда цари выступают в поход
  rationale: Глагол буквально означает «выходить», но военный контекст делает естественным русское «выступать в поход», не требуя уточнять конкретное сражение.
- source_word: וַיִּנְהַג ... אֶת חֵיל הַצָּבָא
  choice: Иоав повёл войско
  rationale: וַיִּנְהַג выражает ведение вперёд, а сочетание חֵיל הַצָּבָא обозначает военную силу; «повёл войско» звучит естественно и сохраняет движение армии.
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: опустошил землю аммонитян
  rationale: Глагол обозначает разорение или уничтожение; применительно к территории «опустошил» точно передаёт военный контекст. Этноним передан обычной русской формой.
- source_word: וַיָּצַר
  choice: осадил
  rationale: Стандартное обозначение военной осады города.
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: Давид же оставался в Иерусалиме
  rationale: Причастная форма передаёт продолжающееся состояние, а частица «же» естественно подчёркивает контраст между походом Иоава и пребыванием Давида в столице.
- source_word: וַיַּךְ ... אֶת רַבָּה
  choice: взял Равву
  rationale: נכה имеет широкий диапазон «поразить, атаковать, разбить». В сочетании с последующим разрушением города русское военное «взял» естественно выражает успешный исход нападения, не повторяя глагол разрушения.
- source_word: וַיֶּהֶרְסֶהָ
  choice: разрушил её
  rationale: Глагол означает снести или разрушить; «разрушил» ясно относится к городу и отличается от предшествующего опустошения страны.
- source_word: רַבָּה
  choice: Равва
  rationale: Употреблена традиционная русская библейская передача названия аммонитской столицы.
