base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: ru
  text: И вновь была война с филистимлянами.[a] Элханан, сын Яира, сразил Лахми, брата Голиафа из Гата; древко его копья было как ткацкий навой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте, 2 Царств 21:19, еврейский текст труден и часто рассматривается в связи с этим стихом; здесь, в Паралипоменон, прямо сказано, что Элханан сразил Лахми, брата Голиафа.
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: И снова началась война
  rationale: Выражение вводит очередной военный эпизод; «снова» естественно передаёт עוֹד в данном контексте, а «началась война» звучит по-русски естественнее буквального «была война».
- source_word: אֶת פְּלִשְׁתִּים
  choice: с филистимлянами
  rationale: При обозначении противоборствующей стороны אֶת здесь естественно передаётся русским предлогом «с».
- source_word: וַיַּךְ
  choice: сразил
  rationale: Глагол נכה в боевом контексте означает нанесение смертельного удара; «сразил» сохраняет образ действия и ясно подразумевает смерть.
- source_word: אֶלְחָנָן בֶּן יעור
  choice: Элханан, сын Яира
  rationale: Сохранены имя и обычная для русской библейской речи конструкция родства; написание «Яир» отражает традиционное отождествление имени в этом стихе.
- source_word: אֶת לַחְמִי
  choice: Лахми
  rationale: Согласно масоретской огласовке и синтаксису Паралипоменон, לַחְמִי понимается как собственное имя прямого дополнения.
- source_word: אֲחִי גָּלְיָת
  choice: брата Голиафа
  rationale: Прямо сохраняется выраженное в еврейском тексте родство.
- source_word: הַגִּתִּי
  choice: из Гата
  rationale: Естественная современная русская передача географического наименования жителя Гата; она понятнее формы «гефянин» и не меняет смысла.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: древко его копья
  rationale: עֵץ в данном сочетании обозначает деревянное древко копья; местоимение отнесено к Лахми без стилистического усложнения.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: как ткацкий навой
  rationale: מְנוֹר обозначает крупную деталь ткацкого станка, обычно навой; сравнение передаёт необычайную толщину и тяжесть древка.
theological_decisions:
- issue: Соотношение с параллельным и текстологически трудным местом во 2 Царств 21:19
  choice: 'Следовать ясному масоретскому тексту 1 Паралипоменон: Элханан сразил Лахми, брата Голиафа.'
  alternative: Перенести сюда формулировку или реконструкцию текста 2 Царств либо истолковать לַחְמִי как часть обозначения «вифлеемлянин».
  rationale: Перевод данного стиха должен передавать его собственный еврейский текст, не устраняя и не привнося трудность параллельного повествования; связь с ним уместно отметить в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Устаревшее «г ефянин» заменено ясным «из Гата»; технический термин «ткацкий навой» точно сохраняет древний образ.
