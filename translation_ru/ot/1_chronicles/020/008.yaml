  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: ru
  text: Они родились у Рафы[a] в Гате и пали от руки Давида и от руки его слуг.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произошли от Рафы»; возможно, имеются в виду потомки рефаимов — рода великанов в Гате.'
    reason: Альтернативная передача родового выражения и пояснение неоднозначного обозначения הָרָפָא.
lexical_decisions:
- source_word: אֵל
  choice: Они
  rationale: Указательное местоимение отсылает к воинам, названным ранее; в русском связном тексте естественно местоимение «они», без добавления слова «мужи».
- source_word: נוּלְּדוּ
  choice: родились
  rationale: Нифаль глагола ילד обычно означает «родиться»; буквальная передача сохраняет возможный оттенок происхождения от предка или рода.
- source_word: לְהָרָפָא
  choice: у Рафы
  rationale: В сочетании с «родились» русский оборот «родились у Рафы» естественно передаёт принадлежность к предку или роду, не отождествляя Рафу однозначно с великаном или рефаимами.
- source_word: בְּגַת
  choice: в Гате
  rationale: Обычное местное значение предлога ב перед названием города.
- source_word: וַיִּפְּלוּ
  choice: и пали
  rationale: Сохраняет образ еврейского נפל и в военном контексте ясно указывает на гибель.
- source_word: בְיַד
  choice: от руки
  rationale: Сохраняет еврейскую идиому обозначения действующего лица и соответствует возвышенному историческому повествованию.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: Прямо передаёт עבד; в данном царском и военном контексте речь идёт о людях, состоявших на службе у Давида.
theological_decisions:
- issue: Кого обозначает הָרָפָא
  choice: Рафа как имя предка или обозначение рода без дальнейшего уточнения
  alternative: великан; рефаимы; род великанов
  rationale: Форма единственного числа с артиклем допускает понимание как эпонимического предка или родового обозначения, но сама по себе не является обычной формой множественного числа «рефаимы». Основной текст сохраняет эту неопределённость, а примечание сообщает вероятную связь с родом великанов в Гате.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной окраской. Идиома «пали от руки» сохранена как понятная и уместная для военного контекста; неоднозначность имени или родового обозначения Рафа вынесена в примечание.
