  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/תַּעֲמֹ֧ד מִלְחָמָ֛ה בְּ/גֶ֖זֶר עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֞ה סִבְּכַ֣י הַ/חֻֽשָׁתִ֗י אֶת סִפַּ֛י מִ/ילִדֵ֥י הָ/רְפָאִ֖ים וַ/יִּכָּנֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: ru
  text: После этого в Гезере началась война с филистимлянами. Тогда Сивхай хушатянин поразил Сиппая[a], одного из потомков рефаимов[b], и они были покорены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя также передают как «Сафай».
    reason: lexical_alternative
  - marker: b
    text: Евр. «рефаимов»; традиционный вариант перевода — «исполинов».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественный для современного русского повествовательный переход, сохраняющий временную последовательность без буквального воспроизведения формулы «и было».
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: началась война
  rationale: В сочетании с מִלְחָמָה глагол עמד обозначает возникновение военного столкновения; русский оборот естественен и точен.
- source_word: בְּגֶזֶר עִם פְּלִשְׁתִּים
  choice: война с филистимлянами у Гезера
  rationale: Предлог עִם формально передан как «с», а בְּ при месте сражения — естественным русским «у». Контекст ясно указывает на противостояние.
- source_word: הִכָּה
  choice: поразил
  rationale: Сохраняет обычный военный смысл נכה и не уточняет сверх текста, было ли это прямо выраженное убийство или смертельное поражение.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Сивхай хушатянин
  rationale: Имена и обозначение происхождения переданы традиционной русской библейской транслитерацией в современной орфографии.
- source_word: סִפַּי
  choice: Сиппай
  rationale: Передаёт масоретскую огласовку формы סִפַּי; иной традиционный вариант вынесен в сноску.
- source_word: מִילִדֵי הָרְפָאִים
  choice: одного из потомков рефаимов
  rationale: ילידי выражает рождение или происхождение; добавление «одного из» естественно передаёт принадлежность единственного названного лица к группе.
- source_word: וַיִּכָּנֵעוּ
  choice: они были покорены
  rationale: Страдательная форма сохраняет нифаль глагола כנע и его военный смысл — оказаться покорёнными или подчинёнными.
theological_decisions:
- issue: Передача הָרְפָאִים
  choice: рефаимов
  alternative: исполинов
  rationale: Транслитерация сохраняет возможность понимать слово как название народа или рода и не навязывает толкование «исполины»; традиционный вариант указан в сноске.
- issue: Неявный референт множественного числа וַיִּכָּנֵעוּ
  choice: они были покорены
  alternative: филистимляне были покорены
  rationale: Еврейский текст оставляет подлежащее местоименно невыраженным. Русское «они» сохраняет эту формальную неоднозначность, хотя по контексту наиболее вероятны филистимляне.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён до естественного повествования, но сохранены сдержанность исходного текста, этноним «рефаимы» и неявный референт заключительного глагола.
