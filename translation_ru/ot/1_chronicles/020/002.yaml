base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: ru
  text: Давид снял с головы их царя корону[a] и обнаружил, что она весила один талант[b] золота и что в ней был драгоценный камень. Она была на голове Давида. Из города он вывез чрезвычайно много добычи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корону Милкома» (либо «Малкома»), если понимать מַלְכָּם как имя аммонитского божества, а не как слова «их царь».'
    reason: alternative_reading
  - marker: b
    text: Талант — крупная древняя мера веса; её часто оценивают примерно в 34 килограмма, хотя точная величина в разные времена и в разных местах могла различаться.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: корона
  rationale: Обычное современное обозначение царского головного убора; «диадема» возможно, но здесь излишне стилистически маркировано.
- source_word: מַלְכָּם
  choice: их царя
  rationale: Морфологически естественно понимать как «их царь»; местоимение в выражении «с его головы» поддерживает отнесение к человеку. Возможное имя аммонитского божества сохранено в примечании.
- source_word: מֵעַל רֹאשׁוֹ
  choice: с головы
  rationale: Естественная русская передача пространственного выражения без утраты конкретного образа.
- source_word: וַיִּמְצָאָהּ
  choice: обнаружил, что она весила
  rationale: Передаёт обнаруженный Давидом вес короны и естественно звучит по-русски.
- source_word: מִשְׁקַל כִּכַּר זָהָב
  choice: она весила один талант золота
  rationale: Сохраняет древнюю единицу веса, не вводя чрезмерно точного современного пересчёта.
- source_word: אֶבֶן יְקָרָה
  choice: драгоценный камень
  rationale: Прямая и понятная передача единственного числа без уточнения вида камня.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: Корона оказалась на голове Давида
  rationale: Сохраняет буквальную результативную формулировку «и была на голове Давида», не добавляя прямо не названного действия возложения; повтор существительного устраняет неясность местоимения.
- source_word: וּשְׁלַל הָעִיר
  choice: добычи из города
  rationale: «Добыча» — естественное современное обозначение имущества, захваченного в военном походе.
- source_word: הוֹצִיא
  choice: вывез
  rationale: В контексте городской военной добычи передаёт её удаление из города; буквальное «вывел» по-русски здесь менее естественно.
- source_word: הַרְבֵּה מְאֹד
  choice: чрезвычайно много
  rationale: Сохраняет сильное количественное усиление исходного текста.
theological_decisions:
- issue: Относится ли מַלְכָּם к «их царю» или к аммонитскому божеству Милкому (Малкому)
  choice: их царя
  alternative: Милкома (или Малкома)
  rationale: Грамматика допускает естественное чтение «их царь», а последующее «с его головы» лучше всего согласуется с царём как личным носителем короны. Однако чтение как имени божества действительно возможно и потому сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис умеренно формальный; древняя мера веса сохранена в основном тексте и пояснена в примечании. Подлинная лексическая неоднозначность מַלְכָּם не устранена молча.
