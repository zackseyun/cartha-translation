  text: И когда он оскорблял Израиль[a], Ионафан, сын Шимы, брата Давида, сразил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бросал вызов Израилю». Еврейский глагол может обозначать презрительное оскорбление или открытый вызов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: стал поносить
  rationale: Глагол חרף обозначает оскорбительную, презрительную речь, которая в данном контексте также выражает открытый вызов. «Стал поносить» естественно передаёт речевое действие и сохраняет его враждебный характер.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Прямое дополнение называет народ как единое целое; форма «Израиль» сохраняет еврейское выражение и естественна по-русски.
- source_word: וַיַּכֵּהוּ
  choice: сразил его
  rationale: Форма глагола נכה в повествовательном контексте указывает на смертельный удар. «Сразил» передаёт действие и его результат, не заменяя образ более толковательным «убил».
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Традиционная и узнаваемая русская передача библейского имени.
- source_word: בֶּן שִׁמְעָא
  choice: сын Шимы
  rationale: Конструкция буквально обозначает происхождение по отцу; «Шима» — уместная русская передача имени שִׁמְעָא.
- source_word: אֲחִי דָוִיד
  choice: брата Давида
  rationale: 'Синтаксически приложение «брата Давида» относится к Шиме: Ионафан был сыном Шимы, а Шима — братом Давида. Такая пунктуация предотвращает ошибочное отнесение определения к Ионафану.'
