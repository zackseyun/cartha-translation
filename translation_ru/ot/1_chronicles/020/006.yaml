base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: ru
  text: 'И снова в Гате была война, и там был человек огромного роста: на каждой руке и каждой ноге у него было по шесть пальцев — всего двадцать четыре. Он также был рождён от Рафы.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «происходил от исполина»; или: «принадлежал к рефаимам». Буквально: «был рождён от Рафы».'
    reason: Сохранение неоднозначности еврейского выражения נוֹלַד לְהָרָפָא.
lexical_decisions:
- source_word: עוֹד
  choice: снова
  rationale: В повествовательной последовательности обозначает повторение войны.
- source_word: מִלְחָמָה
  choice: война
  rationale: Обозначает вооружённый конфликт в широком смысле; здесь это естественнее, чем более узкое «битва».
- source_word: בְּגַת
  choice: у Гата
  rationale: Предлог ב допускает локативное значение; «у Гата» естественно обозначает место военных действий.
- source_word: אִישׁ מִדָּה
  choice: человек огромного роста
  rationale: Буквально «человек меры/роста»; контекст указывает на необычайные физические размеры.
- source_word: אֶצְבְּעֹתָיו שֵׁשׁ וָשֵׁשׁ
  choice: на руках и ногах у него было по шесть пальцев
  rationale: В параллельном описании речь явно идёт о пальцах на руках и ногах; русский язык допускает общее слово «пальцы» при явном указании конечностей.
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: всего двадцать четыре
  rationale: Слово «всего» естественно передаёт итоговый подсчёт.
- source_word: וְגַם הוּא
  choice: он также
  rationale: Связывает этого человека с прочими представителями той же линии в контексте.
- source_word: נוֹלַד לְהָרָפָא
  choice: был рождён у Рафы
  rationale: Сохраняет буквальный образ рождения и транслитерацию неоднозначного הָרָפָא, не решая, означает ли оно предка, род или исполина.
theological_decisions:
- issue: Значение הָרָפָא
  choice: Рафа как транслитерированное обозначение предка или рода
  alternative: «исполин» либо «рефаим»
  rationale: Еврейская форма допускает понимание как обозначения предка, рода или группы. Транслитерация в основном тексте сохраняет эту неоднозначность, а варианты разъясняются в примечании.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно-торжественное. Короткие предложения устраняют тяжёлую цепочку союзов, не меняя смысловых связей.
