  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֨שַׂר בַּ/מְּגֵרָ֜ה וּ/בַ/חֲרִיצֵ֤י הַ/בַּרְזֶל֙ וּ/בַ/מְּגֵר֔וֹת וְ/כֵן֙ יַעֲשֶׂ֣ה דָוִ֔יד לְ/כֹ֖ל עָרֵ֣י בְנֵי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛יד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: ru
  text: Он вывел жителей, находившихся в городе, и назначил их на работы с пилами[a], железными орудиями и топорами[b]. Так Давид поступил со всеми городами аммонитян. Затем Давид и весь народ возвратились в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «подверг их действию пил, железных молотильных досок и режущих орудий». Некоторые, учитывая 2 Цар 12:31, понимают этот стих как сообщение о казни людей такими орудиями.'
    reason: alternative_reading
  - marker: b
    text: Точные значения некоторых еврейских названий орудий неясны; слова, переведённые как «железные орудия и топоры», могут в более общем смысле обозначать железные режущие приспособления.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: вывел
  rationale: Каузативная форма глагола יצא обычно означает «вывести» или «извлечь». Здесь речь идёт о выведении жителей из захваченного города.
- source_word: וַיָּשַׂר
  choice: поставил их работать
  rationale: Редкий и трудный глагол допускает разные толкования. В формулировке Паралипоменона его можно понять как назначение людей на работу перечисленными орудиями; это чтение не переносит автоматически более суровое понимание параллельного места из 2 Цар 12:31.
- source_word: בַּמְּגֵרָה
  choice: пилами
  rationale: Существительное מְגֵרָה обозначает пилу; множественное число естественно по-русски в перечне рабочих орудий.
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: железными орудиями
  rationale: Выражение указывает на острые железные приспособления, однако точный вид орудия неясен. Обобщённый перевод не создаёт ложной конкретности.
- source_word: וּבַמְּגֵרוֹת
  choice: и топорами
  rationale: Название орудия лексически не вполне ясно; по контексту оно может обозначать ещё один вид режущего инструмента. «Топорами» даёт понятный смысл, а неопределённость отмечена в сноске.
- source_word: וְכֵן יַעֲשֶׂה
  choice: так Давид поступил
  rationale: Конструкция подводит итог действиям Давида по отношению ко всем аммонитским городам. Русское прошедшее время естественно в данном повествовательном контексте.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: со всеми городами аммонитян
  rationale: «Аммонитяне» — обычное современное русское название народа, буквально названного «сынами Аммона».
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: возвратились в Иерусалим
  rationale: Глагол שוב с указанием места назначения имеет стандартное повествовательное значение возвращения. Сказуемое согласовано по смыслу с составным подлежащим «Давид и весь народ».
theological_decisions:
- issue: Описывает ли стих принудительный труд аммонитян или их казнь перечисленными орудиями
  choice: В основном тексте Давид назначает выведенных жителей на работу с перечисленными орудиями.
  alternative: Особенно под влиянием параллельного места 2 Цар 12:31 этот стих можно понять как описание казни людей пилами и другими железными орудиями.
  rationale: Текст Паралипоменона отличается от формулировки параллельного места и допускает менее насильственное прочтение. Неоднозначность этически и богословски существенна, поэтому альтернативное толкование указано в сноске, а не устранено молча.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Формулировка «жителей, находившихся в городе» естественно передаёт собирательное הָעָם אֲשֶׁר בָּהּ и устраняет неясность местоимения без добавления нового содержания.
