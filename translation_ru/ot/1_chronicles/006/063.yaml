base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: ru
  text: 'А по ту сторону Иордана, у Иерихона, к востоку от Иордана, от колена Рувима: Бецер в пустыне с его пастбищными угодьями и Яаца[a] с её пастбищными угодьями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхаца».'
    reason: Вариант передачи еврейского географического названия יַהְצָה.
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: А по ту сторону Иордана, у Иерихона
  rationale: Сочетание обозначает область за Иорданом в районе Иерихона. Формулировка сохраняет пространственную точку отсчёта и естественно звучит по-русски.
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: к востоку от Иордана
  rationale: Передаёт географическое уточнение буквально и ясно, не заменяя его более общим выражением «на восточном берегу».
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: от колена Рувима
  rationale: В контексте распределения городов מַטֶּה означает племя Израиля; «колено» — понятный и укоренившийся русский библейский термин.
- source_word: בֶּצֶר
  choice: Бецер
  rationale: Транслитерация географического названия с учётом еврейского צ.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר здесь служит географическим определением Бецера; «пустыня» точно и естественно передаёт значение.
- source_word: מִגְרָשֶׁיהָ
  choice: с его/её пастбищными угодьями
  rationale: В перечнях левитских городов מִגְרָשׁ обозначает открытые земли вокруг города, предназначенные прежде всего для выпаса; местоимения согласованы с родом русских названий городов.
- source_word: יַהְצָה
  choice: Иааца
  rationale: Традиционная русская передача названия; вариант «Яхаца» ближе показывает согласные еврейской формы и отмечен в сноске.
