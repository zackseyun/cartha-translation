lexical_decisions:
- source_word: חוּקֹק
  choice: Хукок
  rationale: Название города передано транслитерацией масоретского текста; вариант из параллельного перечня не подменяет чтение данного стиха.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными угодьями
  rationale: Слово обозначает принадлежавшие городу открытые земли, в частности использовавшиеся для выпаса; «пастбищные угодья» ясно передаёт конкретный смысл в перечне левитских городов.
- source_word: רְחֹב
  choice: Рехов
  rationale: Название города передано современной русской транслитерацией еврейской формы.
- source_word: וְאֶת
  choice: и
  rationale: Повторяющийся союз с показателем прямого дополнения естественно передан сочинительным союзом; связь города с угодьями выражена предлогом «с».
