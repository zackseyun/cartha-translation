source:
  edition: WLC
  text: וּ/בְנֵ֧י שְׁמוּאֵ֛ל הַ/בְּכֹ֥ר וַשְׁנִ֖י וַ/אֲבִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/013.yaml
  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: ru
  text: 'И сыновья Самуила: первенец Вашни[a] и Авия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Вашни». Эти слова можно также понять как «и второй»; ср. 1 Цар 8:2, где сыновья Самуила названы Иоилем и Авией.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «и», чтобы сохранить последовательность родословия; конструктивная форма בְנֵי с личным именем естественно передаётся как «сыновья».
- source_word: שְׁמוּאֵל
  choice: Самуила
  rationale: Имя передано в традиционной русской библейской форме и поставлено в родительном падеже по требованиям русского синтаксиса.
- source_word: הַבְּכֹר
  choice: первенец
  rationale: Существительное с артиклем обозначает старшего по рождению сына; «первенец» точно и естественно передаёт генеалогическое значение.
- source_word: וַשְׁנִי
  choice: Вашни
  rationale: Масоретская огласовка допускает восприятие формы как личного имени, поэтому в основном тексте сохранено имя «Вашни». Возможное понимание как «и второй» отмечено в сноске из-за параллели в 1 Цар 8:2.
- source_word: וַאֲבִיָּה
  choice: и Авия
  rationale: Союз и личное имя переданы прямо; использована традиционная русская форма имени «Авия».
theological_decisions:
- issue: Трудность в именах и порядке сыновей Самуила
  choice: Сохранить в основном тексте масоретскую форму «Вашни»
  alternative: Понять וַשְׁנִי как «и второй» либо восполнить имя первенца «Иоиль» по 1 Цар 8:2
  rationale: Это текстологическая и генеалогическая, а не вероучительная трудность. Основной текст следует дошедшей до нас огласованной еврейской форме и не гармонизирует её молча с 1 Цар 8:2; существенная неоднозначность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с краткой, характерной для родословий конструкцией. Двоеточие ясно вводит перечень; традиционные формы библейских имён сохранены.
