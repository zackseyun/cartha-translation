lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: У Гершома
  rationale: Предлог לְ вводит генеалогическую линию Гершома. Оборот «У Гершома» естественно передаёт эту функцию по-русски и сохраняет краткость перечня.
- source_word: לִבְנִי
  choice: Ливни
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: בְנוֹ
  choice: сын его
  rationale: Существительное с местоименным суффиксом 3-го лица мужского рода обозначает прямое сыновство; порядок «сын его» сохраняет торжественную лаконичность генеалогии.
- source_word: יַחַת
  choice: Иахат
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: זִמָּה
  choice: Зимма
  rationale: Здесь слово является личным именем, поэтому транслитерируется, а не переводится по возможному нарицательному значению корня.
