base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/039.yaml
  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: ru
  text: Вот места их проживания в их поселениях[a], в пределах их владений, — для сыновей Аарона, из рода Каафа, потому что жребий достался им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в их станах»; или: «в их ограждённых селениях».'
    reason: Лексема טִירָה может означать поселение, стан или ограждённое селение; основной текст сохраняет широкий смысл без излишней конкретизации.
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: их места жительства
  rationale: Существительное обозначает места проживания; этот вариант конкретен, естественен для современного русского языка и сохраняет множественное число.
- source_word: לְטִירוֹתָם
  choice: по их поселениям
  rationale: טִירָה может обозначать поселение, стан или ограждённое селение. «По их поселениям» подходит контексту распределения населённых мест и не сужает значение до кочевых станов или деревень.
- source_word: בִּגְבוּלָם
  choice: в пределах их владений
  rationale: גְּבוּל может обозначать как границу, так и ограниченную ею территорию. Здесь речь идёт о территории удела, поэтому перевод передаёт территориальный смысл.
- source_word: לִבְנֵי אַהֲרֹן
  choice: предназначенные сынам Аарона
  rationale: Предлог לְ выражает отнесённость этих мест к сынам Аарона; добавление «предназначенные» делает синтаксическую связь ясной, сохраняя традиционное родственное обозначение.
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: из рода каафитов
  rationale: Фраза указывает на родовую принадлежность сынов Аарона к каафитской ветви. «Род» естественно передаёт מִשְׁפָּחָה в генеалогическом контексте.
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: потому что им достался жребий
  rationale: Еврейская конструкция буквально говорит, что жребий был их; русский оборот «им достался жребий» естественно передаёт назначение удела по жребию, не уточняя сверх текста механизм распределения.
