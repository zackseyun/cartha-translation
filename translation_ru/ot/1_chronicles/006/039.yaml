  source_fidelity: 'В целом переданы все основные элементы текста: места проживания, поселения/станы, территория, сыны Аарона, каафитская родовая ветвь и жребий. Однако «предназначенные» не выражено в еврейском тексте и, будучи грамматически отнесено к «местам», создаёт ненужное синтаксическое уточнение. Более прямое «для сыновей Аарона» сохраняет исходную эллиптическую конструкцию. «В их поселениях» естественнее по-русски, чем «по их поселениям», при этом не устраняет лексическую неоднозначность, отмеченную в сноске.'
