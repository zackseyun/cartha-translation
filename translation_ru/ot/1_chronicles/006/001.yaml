  text: 'The sons of Levi: Gershom[a], Kohath[b], and Merari.'
translation:
  language: ru
  text: 'Сыновья Левия: Гершом[a], Кааф и Мерари.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит имя «Гершом»; в некоторых других местах встречается родственная форма имени, традиционно передаваемая по-русски как «Гирсон».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן. В родословиях слово может обозначать и потомков шире, но здесь перечислены непосредственные сыновья Левия.
- source_word: לֵוִי
  choice: Левий
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: גֵּרְשֹׁם
  choice: Гершом
  rationale: Передаёт форму масоретского текста גֵּרְשֹׁם; вариант «Гирсон» связан с иной формой имени в родственных местах.
- source_word: קְהָת
  choice: Кааф
  rationale: Традиционная русская библейская форма имени, понятная читателю и соответствующая имени קְהָת.
- source_word: וּ/מְרָרִי
  choice: и Мерари
  rationale: Союз ו передан как «и», а личное имя — в традиционной русской библейской форме.
