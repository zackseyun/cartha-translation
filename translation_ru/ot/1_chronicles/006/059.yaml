  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: ru
  text: 'и от колена Асира: Машал с его пастбищными землями[a] и Авдон с его пастбищными землями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь в Хрониках — «Машал»; в параллельном перечне в Иис. Нав. 21:30 — «Мишал».
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: и от колена
  rationale: В контексте распределения городов מַטֶּה означает племя Израиля; традиционное и естественное русское соответствие — «колено». Союз и предлог переданы как «и от».
- source_word: אָשֵׁר
  choice: Асира
  rationale: Название колена передано в принятой русской библейской форме «Асир» и поставлено в родительный падеж после «от колена».
- source_word: מָשָׁל
  choice: Машал
  rationale: Передана форма масоретского текста Хроник; отличающееся чтение параллельного места сохранено в сноске.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными землями
  rationale: מִגְרָשׁ обозначает открытые земли при городе, предназначенные прежде всего для выпаса; местоимение согласовано в русском с существительным «город», подразумеваемым названием города.
- source_word: עַבְדּוֹן
  choice: Авдон
  rationale: Топоним передан в традиционной русской библейской форме.
