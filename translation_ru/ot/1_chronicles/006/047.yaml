  text: וְ/לִ/בְנֵ֨י גֵרְשׁ֜וֹם לְ/מִשְׁפְּחוֹתָ֗/ם מִ/מַּטֵּ֣ה יִ֠שָׂשכָר וּ/מִ/מַּטֵּ֨ה אָשֵׁ֜ר וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וּ/מִ/מַּטֵּ֤ה מְנַשֶּׁה֙ בַּ/בָּשָׁ֔ן עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: ru
  text: Сынам Гирсома[a], по их родам, достались от колена Иссахара, от колена Асира, от колена Неффалима и от колена Манассии в Васане[b] тринадцать городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте имя здесь имеет форму «Гирсом»; в некоторых переводах употребляется «Гирсон».
    reason: alternative_reading
  - marker: b
    text: 'Некоторые переводы уточняют: «от половины колена Манассии в Васане», однако слова «половина колена» в еврейском тексте этого стиха отсутствуют.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Сынам
  rationale: В контексте распределения городов сочетание обозначает следующую группу получателей. Предлог передан русским дательным падежом; союз в начале опущен как необязательный для естественной русской связи.
- source_word: גֵרְשׁוֹם
  choice: Гирсома
  rationale: Передана засвидетельствованная здесь форма имени Гирсом, а не традиционный вариант Гирсон.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: по их родам
  rationale: В племенном и распределительном контексте מִשְׁפָּחָה обозначает родовую группу внутри колена; «роды» точнее, чем бытовое «семьи».
- source_word: מִמַּטֵּה
  choice: от колена
  rationale: В данном территориально-родословном контексте מַטֶּה означает «колено»; повтор предлога сохранён при каждом названии.
- source_word: יִשָׂשכָר
  choice: Иссахара
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: אָשֵׁר
  choice: Асира
  rationale: Устоявшаяся русская библейская форма имени и названия колена.
- source_word: נַפְתָּלִי
  choice: Неффалима
  rationale: Устоявшаяся русская библейская форма имени и названия колена.
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: Манассии в Васане
  rationale: Перевод следует прямо выраженному еврейскому тексту и не добавляет отсутствующее в стихе уточнение «половины колена».
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: тринадцать городов
  rationale: Прямое и естественное соответствие еврейскому сочетанию существительного с количественным числительным.
- source_word: '[эллиптическая связка из контекста]'
  choice: достались
  rationale: В еврейском стихе глагол подразумевается из контекста распределения городов; его добавление создаёт полноценное естественное русское предложение, не меняя содержания.
