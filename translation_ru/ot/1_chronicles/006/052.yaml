base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: ru
  text: 'Им дали города-убежища: Сихем с его пастбищными угодьями в нагорье Ефрема[a] и Гезер с его пастбищными угодьями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «города-убежища — Сихем и его пастбищные угодья в нагорье Ефрема, а также Гезер и его пастбищные угодья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: Им дали
  rationale: Форма wayyiqtol от נתן продолжает повествовательную последовательность; в русском нулевое подлежащее естественно восстанавливается из контекста, а местоимение לָהֶם передано как «им».
- source_word: עָרֵי הַמִּקְלָט
  choice: города-убежища
  rationale: Устойчивое и понятное обозначение городов, предоставлявших законное убежище; дефис естественно передаёт определительное сложение.
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Традиционная русская библейская форма топонима.
- source_word: מִגְרָשֶׁיהָ
  choice: его пастбищные угодья
  rationale: מִגְרָשׁ обозначает прилегающие к городу открытые земли, в данном контексте прежде всего используемые для выпаса; «пастбищные угодья» точно и современно.
- source_word: בְּהַר אֶפְרָיִם
  choice: в нагорье Ефрема
  rationale: Выражение обозначает горную область, связанную с Ефремом, а не отдельную вершину; «нагорье» сохраняет географический смысл.
- source_word: גֶּזֶר
  choice: Гезер
  rationale: Традиционная русская библейская форма топонима.
theological_decisions:
- issue: Синтаксическая связь выражения עָרֵי הַמִּקְלָט с перечнем городов
  choice: Двоеточие представляет Сихем и Гезер как перечисление городов-убежищ.
  alternative: 'Более формально сохранить аппозиционную структуру: «города-убежища — Сихем… и Гезер…»'
  rationale: Еврейский синтаксис допускает понимание последующих названий как поясняющего перечня. Основной текст передаёт это естественным русским двоеточием, не устраняя формальную альтернативу, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционные формы топонимов сохранены; устаревшее «предместья» заменено контекстуально точным выражением «пастбищные угодья».
