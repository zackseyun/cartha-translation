  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: ru
  text: И сыновья Израиля дали левитам города и пастбищные угодья при них[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прилегающие к городам земли»; также возможно: «общинные земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: отдали
  rationale: Форма Qal wayyiqtol от נתן означает «дали, отдали». В контексте передачи городов левитам «отдали» естественно передаёт совершённую передачу владений.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Дословное соответствие еврейскому выражению сохраняет его традиционную родовую формулировку и остаётся понятным в литературном русском; возможный идиоматический вариант — «израильтяне».
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: Точное и общепринятое обозначение представителей колена Левия с дательным значением префикса ל.
- source_word: הֶעָרִים
  choice: города
  rationale: Обычное значение עָרִים; термин согласуется с контекстом городов, выделенных левитам.
- source_word: מִגְרְשֵׁיהֶם
  choice: их пастбища
  rationale: מִגְרָשׁ обозначает открытую землю вокруг города, в данном контексте используемую как пастбище. «Пастбища» ясно передаёт практическое назначение этих земель, тогда как более широкие варианты приведены в сноске.
