  rationale: Использована устоявшаяся русская библейская форма имени; в тексте — родительный падеж «Азарии».
- source_word: צְפַנְיָה
  choice: Софония
  rationale: Использована устоявшаяся русская библейская форма имени; в тексте — родительный падеж «Софонии».
