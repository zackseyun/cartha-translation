base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: ru
  text: 'Сынам Гершома — из рода половины колена Манассии: Голан в Васане с его пастбищными землями[a] и Аштарот с его пастбищными землями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общинными землями». Еврейское слово означает открытые земли, принадлежавшие городу и часто использовавшиеся для выпаса скота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: Сынам Гершома
  rationale: Предлог ל обозначает получателей удела; буквальная родословная формула «сыны» в данном контексте включает потомков Гершома.
- source_word: מִמִּשְׁפַּחַת חֲצִי מַטֵּה מְנַשֶּׁה
  choice: от рода половины колена Манассии
  rationale: מִשְׁפָּחָה здесь означает родовое подразделение племени, а חֲצִי מַטֵּה — территориальную половину колена.
- source_word: גּוֹלָן בַּבָּשָׁן
  choice: Голан в Васане
  rationale: Переданы название города и название области с традиционными русскими библейскими формами.
- source_word: מִגְרָשֶׁיהָ
  choice: его пастбищными землями
  rationale: מִגְרָשׁ обозначает открытые угодья при городе, в том числе используемые для выпаса; примечание сохраняет более широкую смысловую возможность.
- source_word: עַשְׁתָּרוֹת
  choice: Аштарот
  rationale: Транслитерация топонима соответствует еврейской форме и укоренённому русскому библейскому употреблению.
- source_word: וְאֶת ... וְאֶת
  choice: и ... с
  rationale: Перечень двух городов и относящихся к каждому угодий передан естественной русской конструкцией.
