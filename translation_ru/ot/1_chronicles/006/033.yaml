  text: And their brothers the Levites were appointed for all the service of the tabernacle of the house of God[a].
translation:
  language: ru
  text: А их братья, левиты, были назначены для всякого служения скинии — дома Божьего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были даны»; еврейское причастие буквально означает «даны», здесь — в смысле «поручены» или «назначены» на служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: А их братья
  rationale: Союз ו передан естественным для контекста «А»; «братья» прозрачно сохраняет родственный термин, который здесь может обозначать также соплеменников.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое и точное обозначение представителей колена Левия; оформлено как приложение к слову «братья».
- source_word: נְתוּנִים
  choice: были назначены
  rationale: Причастие от נתן буквально означает «даны», но в данном контексте выражает назначение на определённую службу. Более буквальный вариант указан в сноске.
- source_word: לְכָל עֲבוֹדַת
  choice: для всякого служения
  rationale: Передаёт как целевое значение предлога לְ, так и полноту כָּל; «служение» уместно для храмово-культового труда и не вносит поздней церковной терминологии.
- source_word: מִשְׁכַּן
  choice: скиния
  rationale: Традиционное, узнаваемое и точное обозначение священного жилища Бога.
- source_word: בֵּית הָאֱלֹהִים
  choice: дома Божьего
  rationale: Буквально сохраняет выражение «дом Бога», не подменяя его словом «храм».
theological_decisions:
- issue: Соотношение слов «скиния» и «дом Божий» в контексте Летописца
  choice: 'Сохранены оба образа: «при скинии дома Божьего».'
  alternative: 'Свести выражение к одному понятию: «при храме Божьем» или «при скинии Божьей».'
  rationale: В еврейском тексте присутствуют оба выражения — מִשְׁכַּן и בֵּית הָאֱלֹהִים. Их сохранение не сглаживает напряжение между языком скинии и языком дома/храма.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Конструкция «скиния дома Божьего» намеренно сохраняет необычное сочетание исходного текста; предлог «при» естественно обозначает место и сферу служения.
