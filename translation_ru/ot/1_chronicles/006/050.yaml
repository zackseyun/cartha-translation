  verdict: revise
  source_fidelity: 'Смысл распределения городов по жребию из трёх колен передан верно. Однако «следующие города» и двоеточие несколько сильнее, чем еврейское «эти города», ориентируют читателя на непосредственно следующий список; исходный текст заканчивает стих обычным указательным выражением. Сноска ошибочно называет форму יִקְרְאוּ будущим «назовут» как буквальное значение: в данном формульном контексте она относится к обозначению городов по именам.'
  naturalness: «Они по жребию выделили ... эти города» — более естественная современная русская конструкция, чем вынесенное в начало «И по жребию ... они отдали». «Выделили» точно передаёт административное наделение, не предполагая передачи в собственность.
  terminology: Термин «колено» уместен в библейском родоплеменном контексте. Формула «сынов Иуды / Симеона / Вениамина» сохранена. «Названные по именам» приемлемо передаёт формульную функцию еврейского оборота; сноска уточняет буквальную конструкцию и её роль.
