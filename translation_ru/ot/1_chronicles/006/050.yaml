  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: ru
  text: Они по жребию выделили из колена сынов Иуды, из колена сынов Симеона и из колена сынов Вениамина эти города, названные по именам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эти города, которые они называют по именам». Это формульное выражение указывает на перечень городов, приводимый далее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: они отдали
  rationale: Основное значение נתן — «дать, отдать». В контексте распределения левитских городов эта формулировка естественна и сохраняет конкретное действие исходного текста.
- source_word: בַגּוֹרָל
  choice: по жребию
  rationale: גורל обозначает жребий как средство распределения; «по жребию» — обычная и точная русская формула.
- source_word: מִמַּטֵּה
  choice: от колена
  rationale: В племенном контексте מַטֶּה означает «колено»; предлог מִן передан как «от».
- source_word: בְנֵי יְהוּדָה / בְנֵי שִׁמְעוֹן / בְּנֵי בִנְיָמִן
  choice: сынов Иуды / сынов Симеона / сынов Вениамина
  rationale: Сохранена характерная для Паралипоменона родоплеменная формула «сыны» в форме русского родительного падежа после слова «колено».
- source_word: הֶעָרִים הָאֵלֶּה
  choice: следующие города
  rationale: Буквально — «эти города». Поскольку далее следует перечень, «следующие города» естественно выполняет указательную функцию без изменения смысла.
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: названные поимённо
  rationale: Формульное сочетание קרא с בְּשֵׁמוֹת буквально связано с называнием по именам и вводит последующий перечень. Причастная конструкция передаёт это кратко и естественно.
