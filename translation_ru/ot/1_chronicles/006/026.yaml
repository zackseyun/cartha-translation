lexical_decisions:
- source_word: בֶּן
  choice: сын
  rationale: В генеалогической цепочке слово указывает на происхождение и при каждом повторении передаётся словом «сын», сохраняя структуру еврейского текста и естественность по-русски.
- source_word: אֶתְנִי
  choice: Ефний
  rationale: Личное имя передано в принятой русской библейской форме, соответствующей еврейскому אֶתְנִי.
- source_word: זֶרַח
  choice: Зерах
  rationale: Личное имя транслитерировано близко к еврейской форме זֶרַח; написание отличает его от нарицательного значения имени.
- source_word: עֲדָיָה
  choice: Адаия
  rationale: Личное имя передано в принятой русской библейской форме, отражающей еврейское עֲדָיָה.
