lexical_decisions:
- source_word: בֻּקִּי
  choice: Буккий
  rationale: Личное имя передано принятой в русской библейской традиции формой, близкой к древнееврейскому звучанию.
- source_word: בְנ/וֹ
  choice: его сын
  rationale: Существительное בֵּן с суффиксом 3-го лица мужского рода единственного числа буквально означает «его сын»; повтор сохранён как характерная генеалогическая формула.
- source_word: עֻזִּי
  choice: Уззий
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: זְרַחְיָה
  choice: Зерахия
  rationale: Личное имя транслитерировано с сохранением элемента -יה; форма «Зерахия» естественна для современного русского библейского текста.
