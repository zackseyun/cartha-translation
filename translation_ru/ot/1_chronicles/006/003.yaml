  yaml_path: translation/ot/1_chronicles/006/003.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: ru
  text: 'И сыновья Каафа: Амрам, Ицгар, Хеврон и Узиил.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «и», чтобы сохранить последовательность родословия; форма сопряжённого состояния בְנֵי означает «сыновья». Здесь названы непосредственные сыновья Каафа, поэтому более широкое «потомки» не требуется.
- source_word: קְהָת
  choice: Кааф
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: עַמְרָם
  choice: Амрам
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: וְיִצְהָר
  choice: Ицгар
  rationale: Имя передано в принятой русской библейской форме; начальный союз выражен структурой перечисления.
- source_word: וְחֶבְרוֹן
  choice: Хеврон
  rationale: Здесь חֶבְרוֹן — имя человека, а не географическое название; использована традиционная русская форма имени.
- source_word: וְעֻזִּיאֵל
  choice: Узиил
  rationale: Использована устоявшаяся русская библейская форма; союз перед последним элементом списка передан как «и».
