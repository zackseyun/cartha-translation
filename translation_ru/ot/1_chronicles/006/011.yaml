lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Елкана
  rationale: Личное имя передано принятой русской библейской транслитерацией; повтор имени сохранён согласно еврейскому тексту.
- source_word: בְּנוֹ / בנו
  choice: сын его
  rationale: Существительное «сын» с местоименным суффиксом 3-го лица мужского рода единственного числа. Порядок слов сохраняет торжественный ритм родословия и ясно связывает каждого названного с предыдущим.
- source_word: צוֹפַי
  choice: Цофай
  rationale: Имя транслитерировано в соответствии с масоретской огласовкой צוֹפַי; иной вариант передачи отмечен в сноске.
- source_word: וְ
  choice: и
  rationale: Обычный соединительный союз, связывающий последний элемент ряда.
- source_word: נַחַת
  choice: Нахат
  rationale: Личное имя передано прямой транслитерацией с еврейского.
