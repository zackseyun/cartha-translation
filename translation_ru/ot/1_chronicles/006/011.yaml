  text: Елкана, его сын; Елкана, его сын; Цофай[a], его сын; и Нахат, его сын.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Цуфай» — согласно другой традиции огласовки и передачи имени צוֹפַי.'
