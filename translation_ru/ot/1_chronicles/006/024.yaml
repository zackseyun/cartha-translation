base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: ru
  text: 'А его брат Асаф стоял справа от него[a]: Асаф, сын Берехии, сына Шимеи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по правую руку от него»; выражение указывает на место справа от другого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָחִיו
  choice: А его брат
  rationale: Союз וְ передан как «а» для естественной связи с предшествующим перечислением, а אָחִיו — в основном значении «его брат»; более широкое «родственник» контекстом не требуется.
- source_word: אָסָף
  choice: Асаф
  rationale: Традиционная и узнаваемая русская передача личного имени; повтор имени сохранён, как в еврейском тексте.
- source_word: הָעֹמֵד
  choice: стоял
  rationale: Причастная форма от עמד описывает положение Асафа; личная форма прошедшего времени естественна в русском повествовательно-родословном контексте.
- source_word: עַל יְמִינוֹ
  choice: справа от него
  rationale: Еврейское выражение обозначает положение по правую сторону от упомянутого ранее человека. Русская формулировка ясна и не создаёт ложного буквального образа нахождения «на руке».
- source_word: בֶּן
  choice: сын
  rationale: Родословная формула сохранена в обоих звеньях; форма «сына Шимеи» показывает, что Берехия был сыном Шимеи.
- source_word: בֶּרֶכְיָהוּ
  choice: Берехии
  rationale: Имя передано в принятой русской библейской форме «Берехия» и поставлено в родительный падеж после слова «сын».
- source_word: שִׁמְעָא
  choice: Шимеи
  rationale: Имя передано как «Шимеа» с требуемой контекстом формой родительного падежа «Шимеи».
