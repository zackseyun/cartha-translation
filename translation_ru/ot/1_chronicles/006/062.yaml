base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: ru
  text: 'Оставшимся сынам Мерари были выделены города из племени Завулона: Риммоно[a] с его пастбищными угодьями и Фавор с его пастбищными угодьями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Риммоно»; в параллельном месте, в книге Иисуса Навина 21:35, — «Димна».
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי הַנּוֹתָרִים
  choice: Оставшимся сынам Мерари
  rationale: Предлог לְ обозначает получателей удела, а причастие הַנּוֹתָרִים — тех, кто оставался после предыдущих распределений. Русская формулировка передаёт оба значения естественно и кратко.
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: от племени Завулона
  rationale: В контексте распределения городов מַטֶּה означает «племя», а не буквальный «посох».
- source_word: רִמּוֹנוֹ
  choice: Риммоно
  rationale: Сохранено чтение масоретского текста и передана форма данного топонима транслитерацией; вариант параллельного места вынесен в сноску.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными угодьями
  rationale: מִגְרָשׁ в перечнях левитских городов обозначает прилегающую к городу открытую землю, используемую, в частности, для выпаса. Местоимение согласовано в русском языке со словом «город», подразумеваемым названием.
- source_word: תָּבוֹר
  choice: Фавор
  rationale: Использована устоявшаяся русская библейская форма топонима; здесь имеется в виду названный так город.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами известных библейских имён. Тире помогает ясно обозначить переход к источнику удела, а двоеточие вводит перечень городов. Маркер сноски поставлен непосредственно после названия, к которому относится текстовый вариант.
