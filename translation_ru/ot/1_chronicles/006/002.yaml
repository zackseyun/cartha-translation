  yaml_path: translation/ot/1_chronicles/006/002.yaml
  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: ru
  text: 'Вот имена сыновей Гершома: Ливни и Шимей.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейских рукописях здесь стоит имя «Гершом»; в некоторых переводческих традициях в родственных родословиях употребляется форма «Гирсон».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Сочетание союза с указательным местоимением вводит перечень; русское «вот» естественно передаёт эту презентативную функцию, не перегружая фразу начальным «и».
- source_word: שְׁמוֹת
  choice: имена
  rationale: В сочетании שְׁמוֹת בְּנֵי образует конструкцию «имена сыновей»; в русском артикль не требуется.
- source_word: בְּנֵי
  choice: сыновей
  rationale: Хотя слово может шире обозначать потомков, здесь названы непосредственные сыновья Гершома, поэтому точнее «сыновей».
- source_word: גֵרְשׁוֹם
  choice: Гершома
  rationale: Имя передано принятой русской библейской формой «Гершом» и поставлено в родительный падеж по синтаксису фразы.
- source_word: לִבְנִי
  choice: Ливни
  rationale: Собственное имя передано традиционной русской библейской формой.
- source_word: וְשִׁמְעִי
  choice: и Шимей
  rationale: Префиксальный союз координирует второе имя; имя передано традиционной русской библейской формой.
