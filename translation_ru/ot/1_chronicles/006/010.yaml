lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «и», чтобы сохранить последовательность родословия; בְנֵי в сопряжённой конструкции естественно передаётся как «сыновья».
- source_word: אֶלְקָנָה
  choice: Елканы
  rationale: Личное имя передано принятой русской библейской формой «Елкана» и поставлено в родительном падеже согласно синтаксису.
- source_word: עֲמָשַׂי
  choice: Амасай
  rationale: Транслитерация еврейского личного имени с учётом современной русской библейской традиции.
- source_word: וַ/אֲחִימוֹת
  choice: и Ахимоф
  rationale: Префиксальный союз передан как «и»; личное имя транслитерировано в традиционной русской форме «Ахимоф».
