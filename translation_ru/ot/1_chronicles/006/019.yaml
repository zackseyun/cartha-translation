lexical_decisions:
- source_word: בֶּן
  choice: сын
  rationale: В родословном перечне בֶּן обозначает сыновнюю или более широкую прямую родственную связь; традиционное «сын» сохраняет лаконичную повторяемость еврейского текста.
- source_word: אֶלְקָנָה
  choice: Елкана
  rationale: Личное имя передано в принятой русской библейской форме; падежная форма в тексте — «Елканы».
- source_word: יְרֹחָם
  choice: Иерохам
  rationale: Личное имя транслитерировано в принятой русской библейской форме; падежная форма в тексте — «Иерохама».
- source_word: אֱלִיאֵל
  choice: Елиил
  rationale: Передаёт согласные и огласовку масоретского текста; падежная форма в тексте — «Елиила».
- source_word: תּוֹחַ
  choice: Тоах
  rationale: Передаёт именно форму WLC תּוֹחַ без замены именем из параллельной родословной; падежная форма в тексте — «Тоаха».
theological_decisions: []
translation_notes:
  register: Сохранён обрывочный, перечислительный синтаксис родословной, продолжающей предыдущее предложение. Имена даны в современных русских библейских формах, а повторение «сын» воспроизводит структуру оригинала. Сноска поставлена при имени Тоаха, к которому относится текстологическое замечание; некорректная привязка английского маркера к имени Елканы не воспроизводится.
