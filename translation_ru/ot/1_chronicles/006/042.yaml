base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: ru
  text: 'Сыновьям Аарона дали города-убежища: Хеврон, Ливну с её пастбищными землями[a], Иаттир, Ештемоа с её пастбищными землями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «открытыми землями». Еврейское слово обозначает открытую землю, принадлежавшую городу.'
    reason: 'Лексическая альтернатива: значение מִגְרָשׁ шире, чем только пастбище.'
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: Сыновьям Аарона
  rationale: Предлог ל обозначает получателя. Слово «сыновья» сохранено как прямое соответствие еврейскому בְּנֵי и естественно звучит в родовом контексте.
- source_word: נָתְנוּ
  choice: дали
  rationale: Основное значение נתן — «давать»; оно ясно и уместно в контексте распределения городов.
- source_word: עָרֵי הַמִּקְלָט
  choice: города-убежища
  rationale: Устойчивое и понятное обозначение городов, предоставлявших предусмотренное Законом убежище.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Общепринятая русская форма библейского топонима.
- source_word: לִבְנָה
  choice: Ливна
  rationale: Традиционная и узнаваемая русская передача топонима; в тексте употреблена форма винительного падежа «Ливну».
- source_word: מִגְרָשֶׁיהָ
  choice: с её пастбищными землями
  rationale: מִגְרָשׁ обозначает открытую землю, принадлежавшую городу и использовавшуюся, в частности, как пастбище. Местоимение женского рода соотнесено с непосредственно предшествующим названием города.
- source_word: יַתִּר
  choice: Иаттир
  rationale: Передача топонима, сохраняющая его еврейскую форму и соответствующая русской библейской традиции.
- source_word: אֶשְׁתְּמֹעַ
  choice: Эштемоа
  rationale: Современная русская транслитерация еврейского топонима.
theological_decisions:
- issue: Отнесение выражения «города-убежища» к последующему перечню
  choice: 'Сохранить структуру еврейского текста: «города-убежища: Хеврон, Ливну…»'
  alternative: Уточнить, что только Хеврон был городом-убежищем
  rationale: Масоретский текст грамматически вводит весь перечень после выражения во множественном числе, хотя из параллельных мест известно особое положение Хеврона. Перевод не вносит отсутствующего в данном стихе пояснения и сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Перечень оформлен пунктуационно так, чтобы Хеврон не сливался с Ливной; повтор местоимения сохраняет отнесение земель к каждому непосредственно названному городу.
