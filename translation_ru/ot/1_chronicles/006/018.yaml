base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: ru
  text: 'Вот те, кто стоял[a], и их сыновья[b]: из потомков Каафа — певец Еман, сын Иоиля, сына Самуила.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стоял». В этом контексте слово может подразумевать исполнение установленного служения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вместе со своими сыновьями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот те
  rationale: Естественно вводит следующий перечень; начальный союз в русском не требуется для передачи связности повествования.
- source_word: הָעֹמְדִים
  choice: кто стоял на службе
  rationale: Сохраняет конкретный образ глагола עמד («стоять») и одновременно передаёт подразумеваемое исполнение установленного служения.
- source_word: וּבְנֵיהֶם
  choice: вместе со своими сыновьями
  rationale: По смыслу сыновья участвуют вместе с названными служителями; русский оборот ясно выражает эту связь, тогда как буквально возможное «и их сыновья» оставлено в примечании.
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: из потомков Каафа
  rationale: Естественно передаёт принадлежность к роду Каафа, выраженную сочетанием «из сынов каафитянина».
- source_word: הֵימָן
  choice: Еман
  rationale: Традиционная русская библейская передача личного имени.
- source_word: הַמְשׁוֹרֵר
  choice: певец
  rationale: Прямое и общепонятное обозначение того, кто поёт; «музыкант» было бы шире исходного значения.
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: сын Иоиля, сына Самуила
  rationale: Русская родословная формула ясно показывает, что Иоиль был сыном Самуила.
theological_decisions:
- issue: 'Характер положения названных лиц: буквальное стояние или служение'
  choice: стоял на службе
  alternative: служил; стоял
  rationale: Формулировка сохраняет образ «стояния» и не сводит его исключительно к должности, но делает понятным служебный контекст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Родословная изложена ясно, без архаизмов; неоднозначность עמד и присоединительного ו пояснена в сносках.
