base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: ru
  text: А от колена Иссахара — Кедес с его пастбищными землями и Давраф[a] с его пастбищными землями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Давраф» также передают как «Давераф»; ср. параллельный список городов в Нав. 21:28.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: А от колена
  rationale: Сочетание союза, предлога и מַטֶּה продолжает перечень и указывает на колено как племенное подразделение Израиля.
- source_word: יִשָׂשכָר
  choice: Иссахара
  rationale: Устоявшаяся русская библейская форма имени колена.
- source_word: קֶדֶשׁ
  choice: Кедес
  rationale: Устоявшаяся русская передача названия города; уточнение местности не добавляется, поскольку его нет в еврейском тексте.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными землями
  rationale: מִגְרָשׁ обозначает открытые общинные земли вокруг левитского города, прежде всего предназначенные для выпаса; местоимение относится к каждому городу.
- source_word: דָּבְרַת
  choice: Давраф
  rationale: Устоявшаяся русская библейская форма топонима, соответствующего еврейскому דָּבְרַת; вариант написания отмечен в сноске.
