  text: and Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands.
translation:
  language: ru
  text: и Аялон с его пастбищными угодьями[a], и Гат-Риммон с его пастбищными угодьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общинными землями» или «окрестными землями». Еврейское слово обозначает открытые земли, принадлежавшие городу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Аялон
  rationale: Название города передано транслитерацией в форме, близкой к еврейскому произношению и естественной для русской библейской топонимии.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными угодьями
  rationale: Термин обозначает принадлежавшие городу открытые земли вокруг него, в том числе предназначенные для выпаса; «пастбищные угодья» ясно передаёт функцию и сохраняет связь этих земель с городом.
- source_word: גַּת רִמּוֹן
  choice: Гат-Риммон
  rationale: Составное географическое название передано транслитерацией; дефис показывает, что это единый топоним.
- source_word: וְאֶת
  choice: и
  rationale: Сочетание союза с показателем прямого дополнения оформляет продолжение перечня; непереводимый показатель дополнения опущен, а союз сохранён.
