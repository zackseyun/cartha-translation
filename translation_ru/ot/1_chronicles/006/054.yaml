  source_fidelity: Текст точно передаёт оба топонима и повторяющуюся конструкцию «с его ...». «Пастбищные угодья» является уместной передачей מִגְרָשֶׁיהָ — открытых земель при городе, в том числе для выпаса. Начальное «и» оправдано тем, что стих продолжает перечень.
