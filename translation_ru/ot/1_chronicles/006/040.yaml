  text: И дали им Хеврон в земле Иуды с пастбищными угодьями вокруг него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с общинными землями вокруг него». Еврейское слово обозначает открытую землю, прилегавшую к городу и часто использовавшуюся для выпаса скота.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: И дали
  rationale: Форма wayyiqtol от נתן продолжает повествовательную последовательность; союз «и» естественно сохраняет связь с контекстом.
- source_word: לָהֶם
  choice: им
  rationale: Предлог ל обозначает косвенное дополнение; русское «дали им» точно и естественно.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Устоявшаяся русская передача названия города.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иуды
  rationale: Сохраняет существительное אֶרֶץ и географическую привязку к Иуде, не сужая значение до административной территории.
- source_word: מִגְרָשֶׁיהָ
  choice: пастбищными угодьями
  rationale: מִגְרָשׁ обозначает открытую землю при городе, нередко служившую для выпаса; выбранная передача понятна современному читателю и сохраняет функциональный оттенок.
- source_word: סְבִיבֹתֶיהָ
  choice: вокруг него
  rationale: Передаёт расположение угодий вокруг Хеврона; местоимение согласовано с русским названием города.
