  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: ru
  text: Они служили пением перед скинией — шатром встречи — до тех пор, пока Соломон не построил дом Яхве[a] в Иерусалиме; и они занимали свои места согласно установленному для них порядку служения.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом Яхве»; имеется в виду храм.'
    reason: Поясняет референт выражения, сохраняя буквальное «дом Яхве» в основном тексте.
  - marker: b
    text: 'Или: «согласно их установлению»; возможно также: «согласно их обычаю».'
    reason: Отражает смысловой диапазон מִשְׁפָּט в данном контексте.
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: служили
  rationale: Причастие обозначает исполнение обязанностей при святилище; «служили» естественно и сохраняет культовый контекст.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Передаёт пространственно-служебное отношение: служение совершалось перед святилищем.'
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: скинией — шатром встречи
  rationale: Сохранены оба еврейских обозначения; второе выступает приложением к первому.
- source_word: בַּשִּׁיר
  choice: пением
  rationale: Предлог ב здесь указывает на способ служения; творительный падеж передаёт это кратко и естественно.
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: до тех пор, пока Соломон не построил
  rationale: Инфинитивная конструкция обозначает временную границу; придаточное предложение ясно передаёт её по-русски.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохранено исходное «дом», а не введено истолковывающее «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
- source_word: וַיַּעַמְדוּ
  choice: исполняли
  rationale: В сочетании с עַל עֲבוֹדָתָם глагол описывает занятие назначенного места и несение обязанностей; буквальное «стояли над своим служением» по-русски неестественно.
- source_word: כְמִשְׁפָּטָם
  choice: по установленному для них порядку
  rationale: Передаёт значение предписанной нормы или порядка, не сводя его лишь к обычаю.
- source_word: עַל עֲבוֹדָתָם
  choice: своё служение
  rationale: В контексте сочетание указывает на порученную им службу; русская конструкция с прямым дополнением естественно передаёт функциональный смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение כְמִשְׁפָּטָם
  choice: по установленному для них порядку
  alternative: по своему обычаю
  rationale: Контекст организованного храмового служения скорее указывает на установленное предписание, однако возможный оттенок обычая отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Термин «скиния» сохранён как широко узнаваемое обозначение святилища, а «шатёр встречи» делает второе еврейское наименование понятным. Синтаксис упрощён там, где буквальное воспроизведение было бы неестественным.
