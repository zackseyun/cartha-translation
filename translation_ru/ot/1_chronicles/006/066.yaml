lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Хешбон
  rationale: Название места передано транслитерацией в форме, соответствующей еврейскому произношению и принятой русской библейской традиции.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищами
  rationale: В контексте левитских городов מִגְרָשׁ обозначает принадлежавшие городу открытые земли, прежде всего пастбища. Местоимение «его» относится к каждому городу.
- source_word: יַעְזֵיר
  choice: Язер
  rationale: Название места передано традиционной русской библейской формой, близкой к еврейскому оригиналу.
- source_word: וְאֶת
  choice: и
  rationale: Повторяющиеся союз и показатель прямого дополнения оформляют продолжение перечня; непереводимый показатель дополнения опущен, а союз сохранён.
