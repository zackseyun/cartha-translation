  text: Ramoth with its pasturelands[a], and Anem with its pasturelands.
translation:
  language: ru
  text: Рамот с его пастбищными угодьями и Анем[a] с его пастбищными угодьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Анем»; в параллельном перечне в Иисусе Навине 21:25 — «Анер».
    reason: alternative_reading
lexical_decisions:
- source_word: רָאמוֹת
  choice: Рамот
  rationale: Название города передано транслитерацией в форме, естественной для русской библейской топонимии.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными угодьями
  rationale: Слово מִגְרָשׁ обозначает принадлежавшие городу открытые земли вокруг него, в данном контексте используемые как пастбища. Местоимение согласовано с подразумеваемым словом «город».
- source_word: עָנֵם
  choice: Анем
  rationale: Сохранено чтение масоретского текста עָנֵם; вариант параллельного списка вынесен в сноску.
- source_word: וְאֶת
  choice: и
  rationale: Непереводимый отдельно показатель прямого дополнения опущен, а союз וְ передан русским «и», связывающим элементы перечня.
