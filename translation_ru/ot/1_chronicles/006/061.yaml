  text: וּ/מִ/מַּטֵּ֣ה נַפְתָּלִ֗י אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת חַמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת קִרְיָתַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: ru
  text: А от племени Неффалима — Кедес в Галилее с его пастбищными угодьями[a], Хаммон с его пастбищными угодьями и Кириафаим с его пастбищными угодьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общинными землями». Еврейское слово обозначает открытую землю, принадлежавшую городу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: А от племени
  rationale: В контексте распределения городов מַטֶּה обозначает племя Израиля; сочетание союза и предлога естественно передаётся как «А от».
- source_word: נַפְתָּלִי
  choice: Неффалима
  rationale: Использована укоренившаяся русская библейская форма имени в родительном падеже после предлога «от».
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Кедес в Галилее
  rationale: Региональное уточнение בַּגָּלִיל естественно и точно передаётся как «в Галилее».
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными угодьями
  rationale: מִגְרָשׁ обозначает открытую землю при городе, использовавшуюся, в частности, для выпаса; местоимение согласовано с русским словом «город», подразумеваемым в перечне.
- source_word: חַמּוֹן
  choice: Хаммон
  rationale: Транслитерация еврейского географического названия с сохранением удвоенного согласного.
- source_word: קִרְיָתַיִם
  choice: Кириафаим
  rationale: Форма передаёт еврейское название קִרְיָתַיִם и соответствует привычной русской библейской передаче компонента ת как «ф».
