base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: ru
  text: Сынам Мерари, по их родам, из колена Рувима, из колена Гада и из колена Завулона — двенадцать городов по жребию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: сынам Мерари
  rationale: Дательный падеж передаёт ל как указание на получателей удела; «сыны» сохраняет родословную формулу и связь с левитской линией.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: по их родам
  rationale: В контексте племенного распределения מִשְׁפָּחָה обозначает родовое подразделение; «по их родам» естественно и точно передаёт принцип распределения.
- source_word: מִמַּטֵּה
  choice: из колена
  rationale: В контексте земельных уделов מַטֶּה означает племя Израиля; традиционное русское «колено» уместно в библейской родоплеменной системе.
- source_word: רְאוּבֵן / גָד / זְבוּלֻן
  choice: Рувим / Гад / Завулон
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён.
- source_word: בַּגּוֹרָל
  choice: по жребию
  rationale: Фраза обозначает способ распределения; «по жребию» — краткое и естественное русское соответствие.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: двенадцать городов
  rationale: Русский порядок слов передаёт числительное и существительное ясно и без изменения смысла.
