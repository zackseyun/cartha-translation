  text: וְ/אֶת קְדֵמוֹת֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת מֵיפַ֖עַת וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/064.yaml
  text: and Kedemoth with its pasturelands[a], and Mephaath with its pasturelands.
translation:
  language: ru
  text: Кедемот с его пастбищными угодьями[a] и Мефаат с его пастбищными угодьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общинными землями»; еврейское слово обозначает открытую землю, принадлежавшую городу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Кедемот
  rationale: Название города передано принятой русской транслитерацией, без перевода.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными угодьями
  rationale: מִגְרָשׁ обозначает открытую землю, принадлежавшую городу и использовавшуюся, в частности, для выпаса; местоимение «его» согласовано с названием каждого города.
- source_word: מֵיפַעַת
  choice: Мефаат
  rationale: Название города транслитерировано в форме, естественной для русской библейской традиции.
- source_word: וְאֶת ... וְאֶת
  choice: … и …
  rationale: Повторяющиеся союз וְ и показатель прямого дополнения оформляют продолжение перечня; по-русски связь естественно передана союзом «и», тогда как связь города с угодьями выражена предлогом «с».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая структура перечня сохранена. Начальное «и» не воспроизведено, поскольку в русском тексте отдельного стиха оно звучало бы тяжеловесно, а соединительная функция выражена внутренним союзом.
