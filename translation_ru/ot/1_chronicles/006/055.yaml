  naturalness: Повтор «с его пастбищными землями» допустим и воспроизводит структуру оригинала, но «пастбищными угодьями» естественнее для закреплённых за городом земель. Явное «были отданы» делает русское предложение законченным, сохраняя подразумеваемый в перечне глагол распределения.
