  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת עָנֵר֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת בִּלְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑י/הָ לְ/מִשְׁפַּ֥חַת לִ/בְנֵי קְהָ֖ת הַ/נּוֹתָרִֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: ru
  text: А от половины колена Манассии роду оставшихся сыновей Каафа были отданы Анер с его пастбищными угодьями и Билеам[a] с его пастбищными угодьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Билеам»; в параллельном месте, Иисус Навин 21:25, — «Ивлеам».
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: А от половины колена Манассии
  rationale: מַחֲצִית означает «половина», а מַטֶּה в контексте распределения земель — «колено». Формулировка передаёт составную часть колена Манассии без добавления отсутствующего в тексте уточнения.
- source_word: אֶת עָנֵר
  choice: Анер
  rationale: Топоним передан транслитерацией в форме, естественной для русской библейской традиции.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными землями
  rationale: מִגְרָשׁ обозначает открытые угодья при городе, особенно в перечнях левитских городов. «Пастбищные земли» ясно передаёт их назначение; местоимение согласовано в русском с подразумеваемым словом «город».
- source_word: בִּלְעָם
  choice: Билеам
  rationale: Масоретский текст здесь прямо читает בִּלְעָם. Отличающееся чтение параллельного места сохранено в примечании, а не внесено в основной текст.
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: роду остальных сыновей Каафа
  rationale: Единственное число מִשְׁפַּחַת передано собирательным «роду», а הַנּוֹתָרִים — нейтральным «остальных», то есть тех каафитян, для которых города перечисляются здесь.
