    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  choice: Ашан
  rationale: Название города передано транслитерацией по масоретскому тексту Паралипоменона; вариант «Аин» отмечен в сноске.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными угодьями
  rationale: Слово обозначает открытые земли вокруг города, использовавшиеся, в частности, как пастбища; местоимение согласовано в русском языке с существительным «город», подразумеваемым в перечне.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Бейт-Шемеш
  rationale: Собственное географическое название транслитерировано, а не переведено буквально как «Дом солнца».
- source_word: וְאֶת
  choice: и
  rationale: Непереводимый объектный показатель опущен, а союз передан естественным русским соединением элементов перечня.
