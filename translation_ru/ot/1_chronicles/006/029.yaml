lexical_decisions:
- source_word: וּבְנֵי מְרָרִי
  choice: А сыны Мерари
  rationale: «Сыны» сохраняет форму родословного обозначения, которое здесь также может охватывать потомков или представителей рода; союз передан как естественное продолжение перечня.
- source_word: אֲחֵיהֶם
  choice: их братья
  rationale: Сохранено основное значение еврейского слова, при этом в родоплеменном контексте оно может обозначать более широкое родство.
- source_word: עַל הַשְּׂמֹאול
  choice: стояли слева
  rationale: Буквально — «слева»; глагол «стояли» восполняет эллипсис по контексту расположения певцов и даёт естественную русскую фразу.
- source_word: אֵיתָן
  choice: Ефан
  rationale: Традиционная русская библейская передача личного имени.
- source_word: בֶּן
  choice: сын
  rationale: В родословной цепочке сохранена обычная формула прямого происхождения; последующие формы родительного падежа естественны по-русски.
- source_word: קִישִׁי
  choice: Киши
  rationale: Передача еврейского личного имени средствами русской библейской ономастики.
- source_word: עַבְדִּי
  choice: Авди
  rationale: Передача еврейского личного имени средствами русской библейской ономастики.
- source_word: מַלּוּךְ
  choice: Маллуха
  rationale: Имя Маллух поставлено в родительном падеже как часть родословной цепочки.
