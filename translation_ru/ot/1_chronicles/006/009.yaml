base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/009.yaml
  text: Tahath his son[a], Uriel his son, Uzziah his son, and Shaul his son.
translation:
  language: ru
  text: Тахат, сын его, Уриил, сын его, Уззия, сын его, и Шаул[a], сын его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шаул — древнееврейское имя, традиционно передаваемое по-русски как Саул.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: Тахат
  rationale: Личное имя в родословии передано транслитерацией с древнееврейского.
- source_word: בְּנוֹ
  choice: сын его
  rationale: Сохранена повторяющаяся родословная формула оригинала. Хотя בֵּן в родословиях иногда может обозначать более отдалённого потомка, здесь не следует без текстовых оснований расширять значение.
- source_word: אוּרִיאֵל
  choice: Уриил
  rationale: Использована устоявшаяся русская форма древнееврейского личного имени.
- source_word: עֻזִּיָּה
  choice: Уззия
  rationale: Форма близко передаёт древнееврейское звучание и удвоенный согласный, не подменяя имя традиционной формой, основанной на иной передаче.
- source_word: וְשָׁאוּל
  choice: и Шаул
  rationale: Имя передано непосредственно с древнееврейского; союз וְ переведён как «и». Более привычная русская форма указана в сноске.
