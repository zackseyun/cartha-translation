  text: וּ/מִ֨/מַּטֵּה גָ֔ד אֶת רָאמ֥וֹת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: ru
  text: А от колена Гада — Рамот в Галааде с его пастбищными землями и Маханаим с его пастбищными землями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: А от колена
  rationale: В контексте распределения городов מַטֶּה означает «колено»; сочетание союза וּ и предлога מִ естественно передано как «А от».
- source_word: גָד
  choice: Гада
  rationale: Традиционная русская форма названия колена; родительный падеж обусловлен конструкцией «от колена».
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: Рамот в Галааде
  rationale: Предлог בְּ имеет пространственное значение «в»; формы «Рамот» и «Галаад» соответствуют принятой русской библейской традиции.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными землями
  rationale: מִגְרָשׁ обозначает открытые угодья при левитском городе, в данном контексте предназначенные прежде всего для выпаса; местоимение женского рода в еврейском согласуется с «городом», но по-русски относится к названию населённого пункта и естественно передаётся формой «его».
- source_word: מַחֲנַיִם
  choice: Маханаим
  rationale: Традиционная русская транслитерация географического названия.
- source_word: וְאֶת
  choice: и
  rationale: Повторённый показатель прямого дополнения с союзом оформляет перечисление; по-русски естественно передаётся простым союзом «и».
