  text: Shimea his son[a], Haggiah his son, Asaiah his son.
translation:
  language: ru
  text: Шимея, сын его[a]; Хаггия, сын его; Асаия, сын его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте родословная формула буквально повторяется: «сын его… сын его… сын его», обозначая последовательные поколения этой родословной.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעָא
  choice: Шимея
  rationale: Личное имя передано принятой русской библейской транслитерацией, без перевода значения имени.
- source_word: בְנוֹ
  choice: сын его
  rationale: Форма בֵּן с местоименным суффиксом 3-го лица мужского рода означает «его сын». Постпозиция местоимения сохраняет торжественный родословный ритм и буквальный повтор формулы.
- source_word: חַגִּיָּה
  choice: Хаггия
  rationale: Личное имя транслитерировано с передачей начального ח через «Х» и удвоенного ג через «гг»; конечный теофорный элемент передан как «ия» по русской библейской традиции.
- source_word: עֲשָׂיָה
  choice: Асаия
  rationale: Личное имя передано традиционной русской библейской формой «Асаия», соответствующей еврейскому עֲשָׂיָה.
