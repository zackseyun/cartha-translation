  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: ru
  text: 'И вот сыновья Аарона: Елеазар, его сын; Финеес, его сын; Ависуй, его сын.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Сочетание союза с указательным местоимением вводит генеалогический перечень. «И вот» естественно передаёт этот переход, не добавляя временного значения.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Далее названа непосредственная последовательность от отца к сыну, поэтому конкретное «сыновья», а не более широкое «потомки».
- source_word: אַהֲרֹן
  choice: Аарон
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: בְּנוֹ
  choice: его сын
  rationale: Форма с местоименным суффиксом обозначает прямое сыновство; повтор сохранён как характерная черта генеалогической формулы.
- source_word: פִּינְחָס
  choice: Финеес
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: אֲבִישׁוּעַ
  choice: Ависуй
  rationale: Устоявшаяся русская библейская форма имени.
