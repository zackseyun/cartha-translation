  yaml_path: translation/ot/1_chronicles/006/007.yaml
  text: 'The sons of Kohath: Amminadab his son[a], Korah his son, Assir his son.'
translation:
  language: ru
  text: 'Сыновья Каафа: Амминадав, его сын[a], Корей, его сын, Ассир, его сын.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельных родословиях на соответствующем месте назван Ицгар, а не Амминадав; еврейский текст здесь гласит: «Амминадав».'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן вводит родословную. «Сыновья» прямо передаёт еврейскую формулу; хотя в родословиях возможны пропуски поколений, последующее повторение «его сын» поддерживает буквальную родственную формулировку.
- source_word: קְהָת
  choice: Кааф
  rationale: Традиционная русская библейская передача личного имени, сохраняющая узнаваемость родословной.
- source_word: עַמִּינָדָב
  choice: Амминадав
  rationale: Традиционная русская транслитерация имени. Несмотря на расхождение с параллельными родословиями, еврейский текст данного стиха читает «Амминадав».
- source_word: בְּנוֹ
  choice: его сын
  rationale: Существительное в единственном числе с суффиксом 3-го лица мужского рода обозначает сыновнюю связь. Повтор формулы сохранён для передачи структуры еврейской родословной.
- source_word: קֹרַח
  choice: Корей
  rationale: Традиционная русская библейская форма личного имени.
- source_word: אַסִּיר
  choice: Ассир
  rationale: Имя передано транслитерацией, а не переведено по возможному нарицательному значению.
