  yaml_path: translation/ot/1_chronicles/006/043.yaml
  text: and Hilen with its pasturelands[a], Debir with its pasturelands.
translation:
  language: ru
  text: и Хилез[a] с его пастбищами, и Девир с его пастбищами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте Паралипоменона здесь стоит название «Хилез»; в параллельном перечне в Иис. Нав. 21:15 — «Холон».
    reason: alternative_reading
lexical_decisions:
- source_word: חִילֵז
  choice: Хилез
  rationale: Название передано транслитерацией непосредственно по огласованной еврейской форме масоретского текста. Последняя согласная — ז, поэтому форма «Хилез» точнее отражает данный источник, чем «Хилен».
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищами
  rationale: Слово обозначает открытые земли при левитском городе, служившие, в частности, для выпаса скота. «Пастбища» естественно и понятно передаёт его значение в данном перечне.
- source_word: דְּבִיר
  choice: Девир
  rationale: Географическое название транслитерировано согласно еврейскому произношению.
- source_word: וְאֶת / אֶת
  choice: и / не передаётся отдельно
  rationale: Союз связывает пункты перечня, а показатель прямого дополнения не имеет отдельного соответствия в русском языке; синтаксическая связь выражена построением фразы.
theological_decisions: []
