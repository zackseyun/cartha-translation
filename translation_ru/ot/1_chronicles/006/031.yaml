lexical_decisions:
- source_word: בֶּן
  choice: сын
  rationale: В родословиях слово בֶּן может обозначать как непосредственного сына, так и потомка. Основное, формально прозрачное соответствие — «сын»; возможное сокращение поколений отмечено в сноске.
- source_word: אַמְצִי
  choice: Амци
  rationale: Личное имя передано транслитерацией с еврейского; сочетание צ передано через «ц» в соответствии с нормами русской библейской передачи имён.
- source_word: בָּנִי
  choice: Бани
  rationale: Личное имя передано прямой транслитерацией с еврейского.
- source_word: שָׁמֶר
  choice: Шемер
  rationale: Личное имя передано с учётом масоретской огласовки и обычной русской передачи שׁ как «ш».
