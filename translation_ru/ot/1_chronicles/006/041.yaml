  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָתְנ֖וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/041.yaml
  text: But the fields of the city and its pasturelands they gave to Caleb son of Jephunneh[a].
translation:
  language: ru
  text: Но поля города и принадлежавшие ему селения[a] отдали Халеву, сыну Иефоннии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посёлки»; возможно также: «прилегающие к нему земли».'
    reason: Еврейское חָצֵר допускает значения зависимого поселения и земли, относящейся к городу; перевод не должен скрывать эту лексическую неоднозначность.
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: поля города
  rationale: שָׂדֶה обозначает поле, открытую местность или обрабатываемую землю; здесь форма имеет собирательное значение и указывает на земли, относящиеся к городу.
- source_word: חֲצֵרֶיהָ
  choice: принадлежавшие ему селения
  rationale: חָצֵר может обозначать зависимые селения или поселения, относящиеся к городу. В данном контексте перечисления земель это значение наиболее непосредственно, хотя возможно понимание как прилегающих угодий.
- source_word: נָתְנוּ
  choice: отдали
  rationale: Форма Qal перфекта от נתן прямо означает «дали»; «отдали» естественно передаёт распределение земли и сохраняет простой смысл глагола.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: Халеву, сыну Иефоннии
  rationale: Предлог לְ обозначает косвенный объект. Имена переданы в традиционной русской библейской форме.
- source_word: וְאֶת ... וְאֶת
  choice: Но ... и ...
  rationale: Начальный союз связывает стих с предыдущим сообщением и выражает контраст между переданным священникам городом и землями, отданными Халеву.
