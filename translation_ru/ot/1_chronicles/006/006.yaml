  text: Joah his son[a], Iddo his son, Zerah his son, Jeatherai his son.
translation:
  language: ru
  text: Иоах, сын его; Иддо, сын его; Зерах, сын его; Иеатерай[a], сын его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иетерай».'
    reason: Возможная альтернативная передача личного имени יְאָתְרַי.
lexical_decisions:
- source_word: יוֹאָח
  choice: Иоах
  rationale: Личное имя передано принятой русской библейской транслитерацией, а не переведено по предполагаемому значению.
- source_word: בְּנוֹ
  choice: сын его
  rationale: В генеалогическом перечне בֵּן с местоименным суффиксом естественнее всего означает «его сын». Хотя родословия иногда опускают поколения, здесь сохранено непосредственное лексическое значение и повторяющаяся структура оригинала.
- source_word: עִדּוֹ
  choice: Иддо
  rationale: Личное имя передано традиционной русской транслитерацией.
- source_word: זֶרַח
  choice: Зерах
  rationale: Личное имя транслитерировано; форма «Зерах» близко передаёт еврейское звучание и согласуется с современным русским употреблением библейских имён.
- source_word: יְאָתְרַי
  choice: Иеатрай
  rationale: Транслитерация отражает масоретскую огласовку и согласный состав имени; вариант «Иетерай» отмечен в сноске.
