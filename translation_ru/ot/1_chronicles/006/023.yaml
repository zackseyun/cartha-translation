  text: son of Izhar[a], son of Kohath, son of Levi, son of Israel.
translation:
  language: ru
  text: сын Ицгара, сына Каафа, сына Левия, сына Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Иакова, названного именем Израиль.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: сын / сына
  rationale: Повторяющееся בֶּן передаёт прямую родословную формулу «сын». Падежные формы согласованы с русским синтаксисом; более широкое «потомок» не требуется контекстом.
- source_word: יִצְהָר
  choice: Ицгар
  rationale: Использована устоявшаяся русская библейская передача еврейского личного имени.
- source_word: קְהָת
  choice: Кааф
  rationale: Использована узнаваемая традиционная русская форма имени, не меняющая его референцию.
- source_word: לֵוִי
  choice: Левий
  rationale: Имя передано в принятой русской библейской форме.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Основной текст сохраняет именно имя, стоящее в еврейском источнике, а не заменяет его поясняющим именем «Иаков».
theological_decisions:
- issue: Отождествление Израиля с Иаковом
  choice: В основном тексте сохранено «Израиль», а отождествление с Иаковом дано в сноске.
  alternative: Заменить в основном тексте на «Иаков».
  rationale: Еврейский текст употребляет יִשְׂרָאֵל; замена на «Иаков» устранила бы значимый выбор имени в источнике.
translation_notes:
  register: Краткая родословная формула передана современным литературным русским языком с сохранением традиционных русских форм библейских имён. Повтор родительного «сына» делает цепочку происхождения естественной и однозначной по-русски.
