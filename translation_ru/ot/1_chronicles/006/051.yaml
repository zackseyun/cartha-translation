  text: וּ/מִֽ/מִּשְׁפְּח֖וֹת בְּנֵ֣י קְהָ֑ת וַ/יְהִי֙ עָרֵ֣י גְבוּלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: ru
  text: А у семей сыновей Каафа города их владений были из колена Ефрема.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «города их пограничной области»; еврейское слово может означать границу, пределы или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: А родам
  rationale: מִשְׁפָּחוֹת обозначает родовые группы, или кланы. В русском контексте распределения городов естественная конструкция «родам… были отданы» передаёт адресатов удела; союз וּ передан как «А», сохраняя течение перечня.
- source_word: בְּנֵי קְהָת
  choice: сыновей Каафа
  rationale: Сохранена буквальная генеалогическая формула «сыны Каафа», которая в данном контексте охватывает его потомков.
- source_word: וַיְהִי
  choice: были отданы
  rationale: Форма היה буквально означает «были», однако контекст распределения левитских городов позволяет по-русски ясно выразить подразумеваемую передачу городов, не добавляя нового участника действия.
- source_word: עָרֵי גְבוּלָם
  choice: города на их территории
  rationale: גְבוּל может обозначать границу, пределы или территорию. Здесь речь, вероятнее всего, о городах в пределах земельного удела, а не только о пограничных городах.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: из колена Ефрема
  rationale: В контексте земельных уделов מַטֶּה означает «колено»; предлог מִן передан словом «из».
