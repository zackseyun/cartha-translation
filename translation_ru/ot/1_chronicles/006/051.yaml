revisions:
- from: А родам сыновей Каафа[a] были отданы города на их территории[b] из колена Ефрема.
  to: А у семей сыновей Каафа города их владений были из колена Ефрема.[a]
  rationale: Убрано невыраженное в оригинале «были отданы». «У семей» даёт естественное русское оформление исходной связи с семьями сыновей Каафа, а «города их владений» сохраняет неопределённость גְּבוּל. Примечание перенесено к слову «владений», к которому оно относится.
