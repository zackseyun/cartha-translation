lexical_decisions:
- source_word: בֶּן
  choice: сын
  rationale: В родословном перечне слово указывает на сыновство или принадлежность к линии предков. Повторение «сын» сохраняет лаконичную структуру еврейского текста и естественно звучит по-русски в контексте списка.
- source_word: חֲשַׁבְיָה
  choice: Хашавия
  rationale: Имя передано транслитерацией с еврейского; форма «Хашавия» отражает согласный состав имени и его окончание -יה.
- source_word: אֲמַצְיָה
  choice: Амация
  rationale: Употреблена традиционная русская библейская форма имени, соответствующая еврейскому אֲמַצְיָה.
- source_word: חִלְקִיָּה
  choice: Хилкия
  rationale: Употреблена узнаваемая русская библейская форма имени, близкая к еврейскому חִלְקִיָּה.
