  text: and Jokmeam with its pasturelands[b][a], and Beth-horon with its pasturelands.
translation:
  language: ru
  text: И Иокмеам с его пастбищными угодьями[a], и Беф-Хорон с его пастбищными угодьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Иокмеам»; в некоторых переводах и в связи с параллельной топонимической традицией — «Иокнеам».
    reason: alternative_reading
lexical_decisions:
- source_word: יָקְמְעָם
  choice: Иокмеам
  rationale: Передача топонима следует согласному тексту Масоретской традиции в Паралипоменоне; вариант «Иокнеам» известен по параллельной топонимической традиции, но здесь не принимается в основной текст.
- source_word: מִגְרָשֶׁיהָ
  choice: с его пастбищными угодьями
  rationale: В контексте левитских городов существительное обозначает открытые земли при городе, предназначенные, в частности, для выпаса; «пастбищные угодья» ясно и естественно передаёт это значение.
- source_word: בֵּית חוֹרוֹן
  choice: Беф-Хорон
  rationale: Использована укоренившаяся в русской библейской традиции форма составного топонима.
- source_word: וְאֶת
  choice: и
  rationale: Повторяющееся сочетание союза с показателем прямого дополнения естественно передаётся сочинительным союзом «и»; сам показатель дополнения отдельно не переводится.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением ритма перечня. Формулировка «пастбищные угодья» выбрана как понятная современному читателю передача земель, принадлежавших городу; отдельная сноска о возможных вариантах «общинные земли» или «окрестные земли» не требуется, поскольку они менее точны в данном контексте.
