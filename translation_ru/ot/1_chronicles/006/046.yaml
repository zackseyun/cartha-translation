  text: וְ/לִ/בְנֵ֨י קְהָ֜ת הַ/נּוֹתָרִ֗ים מִ/מִּשְׁפַּ֣חַת הַ/מַּטֶּ֡ה מִֽ֠/מַּחֲצִית מַטֵּ֨ה חֲצִ֧י מְנַשֶּׁ֛ה בַּ/גּוֹרָ֖ל עָרִ֥ים עָֽשֶׂר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: ru
  text: А остальным сынам Каафа[a] из семейств колена, из половины колена — половины Манассии, — по жребию досталось десять городов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оставшимся сынам Каафа». Речь идёт о тех каафитских родах, которые ещё не получили городов при предыдущем распределении.'
    reason: Уточнение значения причастия הַנּוֹתָרִים и родословного выражения «сыновья Каафа».
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: А остальным сынам Каафа
  rationale: Предлог לְ продолжает перечень распределения, а причастие הַנּוֹתָרִים обозначает оставшуюся после прежних наделов часть каафитов. «Сынам Каафа» сохраняет родословную идиому и традиционную русскую форму имени.
- source_word: מִ/מִּשְׁפַּחַת הַ/מַּטֶּה
  choice: из семейств колена
  rationale: מִשְׁפָּחָה здесь обозначает родовые подразделения, а מַטֶּה в контексте земельных наделов — колено. Русское множественное число естественно передаёт коллективную формулу.
- source_word: מִֽ/מַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: из половины колена — половины Манассии
  rationale: Сохранена необычная повторность еврейской формулы, при этом тире показывает пояснительное отношение и делает фразу понятной по-русски.
- source_word: בַּ/גּוֹרָל
  choice: по жребию
  rationale: Устойчивая и точная русская передача способа распределения.
- source_word: עָרִים עָשֶׂר
  choice: досталось десять городов
  rationale: В еврейском тексте глагол отсутствует; «досталось» восполняется из контекста распределения и естественно сочетается с «по жребию».
