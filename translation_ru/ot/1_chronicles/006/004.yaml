lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן вводит перечень непосредственных сыновей; «сыновья» точно и естественно передаёт генеалогическую формулу.
- source_word: מְרָרִי
  choice: Мерари
  rationale: Традиционная русская передача личного имени.
- source_word: מַחְלִי
  choice: Махли
  rationale: Транслитерация личного имени в соответствии с его еврейской формой.
- source_word: וּמֻשִׁי
  choice: и Муши
  rationale: Союз וּ передан как «и», личное имя транслитерировано.
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Указательное выражение с союзом естественно вводит итоговое перечисление; «вот» сохраняет указательную силу без тяжеловесного «и вот эти».
- source_word: מִשְׁפְּחוֹת
  choice: роды
  rationale: В племенном и генеалогическом контексте слово обозначает родственные объединения, а не только отдельные семьи.
- source_word: הַלֵּוִי
  choice: левитов
  rationale: Форма единственного числа здесь имеет коллективное родовое значение; русское множественное число ясно и естественно обозначает левитскую общность.
- source_word: לַאֲבוֹתֵיהֶם
  choice: по их отцовским домам
  rationale: Буквально «по их отцам»; в генеалогическом контексте речь идёт о распределении по патрилинейным родовым домам, что выражено привычным библейским оборотом.
