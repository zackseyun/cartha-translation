  rationale: Личное имя транслитерировано как «Зимма»; возможное нарицательное значение связанного корня здесь не актуально.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Личное имя передано в принятой и узнаваемой русской библейской форме «Шимей».
