  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: ru
  text: 'и от колена Вениамина: Геву с её пастбищными угодьями, Алемет[a] с его пастбищными угодьями и Анатот с его пастбищными угодьями. Всех их городов — тринадцать, по их родам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Алемет»; в параллельном перечне в Иисусе Навине 21:18 — «Алмон».
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: и от колена Вениамина
  rationale: 'מַטֶּה в контексте распределения земель означает колено; приставки וּמִ передают продолжение списка: «и от».'
- source_word: גֶּבַע
  choice: Гева
  rationale: Географическое название передано принятой русской библейской транслитерацией.
- source_word: מִגְרָשֶׁיהָ
  choice: пастбищные угодья
  rationale: מִגְרָשׁ обозначает открытые земли вокруг левитского города, предназначенные прежде всего для выпаса; выражение ясно передаёт функцию этих земель.
- source_word: עָלֶמֶת
  choice: Алемет
  rationale: Основной текст сохраняет форму масоретского текста עָלֶמֶת, не заменяя её вариантом из параллельного перечня.
- source_word: עֲנָתוֹת
  choice: Анатот
  rationale: Географическое название транслитерировано в форме, привычной для русской библейской традиции.
- source_word: כָּל עָרֵיהֶם
  choice: всего у них было ... городов
  rationale: Итоговая формула передана естественно по-русски, сохраняя значение совокупности всех перечисленных городов.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: тринадцать городов
  rationale: Числительное с существительным в единственном числе по еврейской конструкции идиоматически передаётся русским множественным числом.
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: распределённых по их родам
  rationale: מִשְׁפָּחוֹת здесь обозначает родовые группы; добавление «распределённых» ясно выражает функцию предложной конструкции в контексте выделения городов.
