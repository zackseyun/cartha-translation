  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: ru
  text: Вот те, кого Давид назначил отвечать за пение в доме Яхве[a] после того, как ковчег обрёл покой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господа». Здесь стоит личное имя Бога — Яхве.'
    reason: divine_name
  - marker: b
    text: 'Буквально: «от покоя ковчега».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот те
  rationale: Естественно вводит следующий далее перечень, сохраняя указательное значение; начальный союз отдельно не передан как избыточный в русском повествовании.
- source_word: אֲשֶׁר הֶעֱמִיד דָּוִיד
  choice: кого Давид поставил
  rationale: Hiphil глагола עמד здесь означает назначение людей на определённое служение; «поставил» сохраняет образ исходного глагола и естественно звучит по-русски.
- source_word: עַל יְדֵי שִׁיר
  choice: руководить пением
  rationale: Оборот указывает на ответственность за пение или заведование им. Такой перевод понятен современному читателю и не вводит отсутствующего в тексте слова «богослужение».
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: «Дом» буквально передаёт בַּיִת и уместен до построения храма; тетраграмматон передан личным именем «Яхве».
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: после того, как ковчег обрёл покой
  rationale: Предлог מִן здесь имеет временной смысл, а מְנוֹחַ обозначает покой, место или состояние покоя. Формулировка передаёт наступившую устойчивость, не уточняя сверх текста, где именно был поставлен ковчег.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; «Яхве» непосредственно передаёт тетраграмматон и не заменяет его титулом.
- issue: Характер служения назначенных левитов
  choice: руководить пением
  alternative: служить пением; отвечать за пение
  rationale: Еврейский оборот допускает оттенки назначения, ответственности и руководства. Основной текст отражает административную ответственность, а примечание сохраняет близкие варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; сохранены буквальный образ «дома» и неоднозначность выражения о покое ковчега.
