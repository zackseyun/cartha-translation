  text: בְּנֵ֥י מְרָרִ֖י מַחְלִ֑י לִבְנִ֥י בְנ֛/וֹ שִׁמְעִ֥י בְנ֖/וֹ עֻזָּ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: ru
  text: 'Сыновья Мерари: Махли[a], его сын Ливни, его сын Шимей, его сын Узза.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более широком родословном смысле: «Потомки Мерари».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма множественного числа в сопряжённом состоянии вводит родословие. «Сыновья» непосредственно передаёт еврейское выражение; в родословном контексте оно может обозначать и потомков шире.
- source_word: מְרָרִי
  choice: Мерари
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: מַחְלִי
  choice: Махли
  rationale: Личное имя передано транслитерацией, соответствующей современной русской библейской традиции.
- source_word: לִבְנִי
  choice: Ливни
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בְנוֹ
  choice: его сын
  rationale: Существительное с местоименным суффиксом 3-го лица мужского рода указывает на сыновнее отношение и сохраняет последовательную цепь родословия.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: עֻזָּה
  choice: Узза
  rationale: Личное имя передано по еврейской форме עֻזָּה и в соответствии с привычной русской передачей этого имени.
