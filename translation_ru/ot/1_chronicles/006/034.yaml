base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: ru
  text: Аарон и его сыновья возжигали приношения на жертвеннике всесожжения и на жертвеннике благовоний — для исполнения всякого служения в Святом святых[a] и для совершения искупления за Израиль, во всём согласно тому, что повелел Моисей, слуга Божий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в отношении величайших святынь»; еврейское выражение может обозначать Святое святых или особо святые предметы.'
    reason: Сохраняет возможное предметно-культовое значение קֹדֶשׁ הַקֳּדָשִׁים, тогда как в основном тексте дано вероятное в данном контексте пространственное значение.
lexical_decisions:
- source_word: מַקְטִירִים
  choice: возжигали приношения
  rationale: Причастие породы хифиль от קטר обозначает возжигание жертв или благовоний, при котором дым поднимается вверх. Формулировка охватывает служение у обоих названных жертвенников и не ограничивает действие только жертвами либо только благовониями.
- source_word: מִזְבַּח הָעוֹלָה
  choice: жертвенник всесожжения
  rationale: Устоявшееся и точное русское обозначение жертвенника, на котором приносили жертвы всесожжения.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: жертвенник благовоний
  rationale: Передаёт назначение жертвенника без архаичного слова «фимиам» и соответствует современному литературному русскому языку.
- source_word: לְכֹל מְלֶאכֶת
  choice: совершая всё служение, связанное с
  rationale: מְלָאכָה здесь означает совокупность порученного священнического труда. «Служение» естественно для храмового контекста, а деепричастная конструкция ясно связывает его с действиями Аарона и его сыновей.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: святыней святынь
  rationale: Буквальное суперлативное выражение сохраняет возвышенный культовый смысл и допускает понимание как особо святого места, тогда как примечание сохраняет возможность отнесения к наиболее святым предметам или обрядам.
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: и совершая искупление за Израиль
  rationale: «Совершать искупление» передаёт священническое употребление כפר, не уточняя механизм искупления и не привнося отдельной богословской теории.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: во всём так, как повелел
  rationale: Передаёт как соответствие повелению, так и полноту его исполнения.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: слуга Божий
  rationale: Естественно и достойно передаёт почётное наименование Моисея; «слуга» в современном русском понятнее, чем более архаичное «раб» в данном титульном употреблении.
theological_decisions:
- issue: Референт קֹדֶשׁ הַקֳּדָשִׁים
  choice: святыня святынь как обозначение особо святой сферы служения
  alternative: Святое святых как внутреннее помещение святилища; величайшие святыни как особо святые предметы или обряды
  rationale: Еврейское выражение допускает пространственное и предметно-культовое понимание. Основной текст сохраняет формулу без уточнения, а примечание прямо отмечает обе возможности.
- issue: Смысл כפר
  choice: совершать искупление за Израиль
  alternative: очищать Израиль; умилостивлять за Израиль
  rationale: Выбран широкий культовый термин, который сохраняет богословскую ёмкость исходного слова и не сводит его к одной модели искупления.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены понятные традиционные культовые термины «жертвенник», «всесожжение» и «искупление»; менее понятное современному читателю слово «фимиам» заменено на «благовония». Повтор «совершая» отражает две связанные цели священнического служения и поддерживает ясность синтаксиса.
