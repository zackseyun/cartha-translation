  terminology: «Жертвенник всесожжения», «жертвенник благовоний», «искупление» и титул «слуга Божий» сохранены. Основное чтение «Святое святых» согласуется с наиболее вероятным пространственным значением в данном контексте, не исключая в примечании значения «особо святые предметы/святыни».
