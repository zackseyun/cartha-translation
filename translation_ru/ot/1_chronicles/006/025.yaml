  rationale: Устоявшаяся русская библейская форма имени, соответствующая еврейскому מִיכָאֵל.
- source_word: בַּעֲשֵׂיָה
  choice: Баасея
  rationale: Передаёт чтение масоретского текста с начальным ב; форма «Маасея», известная по другим родословиям и традициям, не соответствует данной форме WLC.
- source_word: מַלְכִּיָּה
  choice: Малхия
  rationale: Устоявшаяся и естественная русская передача еврейского имени מַלְכִּיָּה.
