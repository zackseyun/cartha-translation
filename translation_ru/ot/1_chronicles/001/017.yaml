base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: ru
  text: 'Сыновья Сима: Элам, Ассур, Арпахшад, Луд и Арам; Уц, Хул, Гетер и Мешех.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельной родословной, в Бытие 10:23, вместо «Мешех» стоит «Маш».
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן вводит родословный перечень; прямой перевод сохраняет форму и регистр оригинала.
- source_word: שֵׁם
  choice: Сим
  rationale: Устоявшаяся русская библейская форма имени, понятная современному читателю.
- source_word: עֵילָם
  choice: Элам
  rationale: Устоявшаяся русская передача имени, которое в данном контексте стоит в родословном перечне.
- source_word: אַשּׁוּר
  choice: Ассур
  rationale: В родословии это имя лица, поэтому выбрана традиционная русская форма имени, а не географическое название «Ассирия».
- source_word: אַרְפַּכְשַׁד
  choice: Арпахшад
  rationale: Передача еврейской формы имени, сохраняющая согласный состав оригинала и приемлемая для современного русского текста.
- source_word: לוּד
  choice: Луд
  rationale: В оригинале употреблено собственное имя в единственном числе, а не множественное этническое название.
- source_word: אֲרָם
  choice: Арам
  rationale: Родословный контекст требует имени предка, а не позднейшего географического обозначения Сирии.
- source_word: עוּץ
  choice: Уц
  rationale: Традиционная и близкая к еврейскому звучанию русская передача собственного имени.
- source_word: חוּל
  choice: Хул
  rationale: Прямая русская транслитерация собственного имени.
- source_word: גֶתֶר
  choice: Гетер
  rationale: Прямая и удобочитаемая русская передача собственного имени.
- source_word: מֶשֶׁךְ
  choice: Мешех
  rationale: Таково чтение масоретского текста в 1 Пар 1:17; отличающееся чтение параллельного места сохранено в примечании.
theological_decisions: []
translation_notes:
  register: Лаконичный родословный стиль сохранён. Имена переданы в формах, сочетающих близость к еврейскому тексту с устоявшимся русским библейским употреблением. Точка с запятой отражает внутреннее членение перечня без добавления отсутствующих в оригинале пояснений.
