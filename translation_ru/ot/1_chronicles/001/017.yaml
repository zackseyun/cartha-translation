  source_fidelity: 'Текст точно передаёт еврейский перечень: בְּנֵי־שֵׁם передано как «Сыновья Сима», а все девять имён сохранены. «Ассур» и «Арам» корректно оставлены личными именами в генеалогическом контексте, а не заменены географическими названиями. Разделение после «Арам» точкой с запятой допустимо как воспроизведение структуры перечня без добавления смысла.'
