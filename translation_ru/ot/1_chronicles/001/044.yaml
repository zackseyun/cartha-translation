  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: ru
  text: И умер Бела, и вместо него воцарился Иовав, сын Зераха, из Боцры.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: и умер
  rationale: Форма wayyiqtol от מוּת продолжает последовательность повествования; союз «и» сохраняет характерную для родословно-царского перечня связь событий.
- source_word: בָּלַע
  choice: Бела
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: Qal wayyiqtol от מלך в формуле царской преемственности обозначает вступление на царство; «воцарился» естественно и точно передаёт начало правления.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: תחת с местоименным суффиксом указывает на занятие места предшественника и непосредственно передаёт формулу преемственности.
- source_word: יוֹבָב
  choice: Иовав
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בֶּן זֶרַח
  choice: сын Зераха
  rationale: Прямое и естественное воспроизведение еврейской патронимической конструкции.
- source_word: מִבָּצְרָה
  choice: из Боцры
  rationale: Предлог מִן здесь естественнее всего обозначает происхождение или связь с городом; русское «из Боцры» сохраняет эту смысловую широту без необходимости примечания.
