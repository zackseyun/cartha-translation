- source_word: הֲדוֹרָם
  choice: Гадорама
  rationale: Собственное имя передано традиционной русской библейской формой; падежное окончание обусловлено тем, что еврейский показатель прямого дополнения אֶת подразумевает продолжение синтаксической конструкции предыдущего стиха.
- source_word: אוּזָל
  choice: Узала
  rationale: Собственное имя транслитерировано в принятой русской форме и поставлено в винительный падеж по синтаксису еврейского текста.
- source_word: דִּקְלָה
  choice: Диклу
  rationale: Собственное имя передано русской формой «Дикла» в винительном падеже; конечная ה отражается окончанием -а в именительном и -у в данном контексте.
- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  choice: перечень с союзом «и» перед последним именем
  rationale: Повторяющиеся союз וְ и показатель прямого дополнения אֶת вводят каждый элемент перечня. В современном русском естественно оформить их как обычный ряд однородных членов, сохранив синтаксическую связь посредством винительного падежа.
