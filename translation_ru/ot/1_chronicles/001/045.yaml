base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/045.yaml
  text: And Yobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: ru
  text: И умер Иовав, и вместо него воцарился Хушам из земли теманитян[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из земли Темана»; возможно также: «из земли теманитянина».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер
  rationale: Форма wayyiqtol от מות продолжает последовательное повествование; союз «и» сохраняет характер генеалогического перечня.
- source_word: יוֹבָב
  choice: Иовав
  rationale: Передача еврейского имени יוֹבָב в принятой русской библейской форме, достаточно близкой к его звучанию.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле престолонаследия глагол מלך указывает на вступление во власть; «воцарился» естественно сочетается с выражением «вместо него».
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: В контексте смены царей תחת с местоименным суффиксом обозначает преемство и замещение.
- source_word: חוּשָׁם
  choice: Хушам
  rationale: Прямая русская транслитерация еврейского личного имени חוּשָׁם.
- source_word: מֵאֶרֶץ
  choice: из земли
  rationale: Сочетание מן с אֶרֶץ обозначает географическое происхождение; полный оборот сохраняет образ исходного текста.
- source_word: הַתֵּימָנִי
  choice: теманитян
  rationale: В сочетании с «земля» слово понимается как обозначение народа или области; множественное число по-русски естественно передаёт смысл «земля теманитян», не устраняя иных грамматически возможных прочтений, отмеченных в сноске.
