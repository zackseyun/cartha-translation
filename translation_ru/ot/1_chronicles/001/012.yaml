base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: ru
  text: и патруситов, и каслухитов (из которых вышли филистимляне[a]), и кафторитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оттуда вышли филистимляне». Здесь, в Паралипоменоне, еврейский текст естественнее всего связывает эти слова с каслухитами, хотя в Бытии 10:14 стоит та же формулировка, а другие библейские места связывают филистимлян также с Кафтором (см. Амоса 9:7; Иеремии 47:4).'
    reason: cross_reference
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: патрусимов
  rationale: Этноним передан транслитерацией в принятой для библейских родословий форме; винительный падеж сохраняет синтаксическую связь с глаголом предыдущего стиха.
- source_word: כַּסְלֻחִים
  choice: каслухимов
  rationale: Этноним с неясной референцией транслитерирован без попытки географического истолкования; использован винительный падеж как продолжение перечня из предыдущего стиха.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: от которых произошли
  rationale: Так естественно по-русски выражается происхождение народа в родословии. Связь отнесена к непосредственно предшествующим каслухимам, а буквальное пространственное значение и существующая текстовая напряжённость отмечены в сноске.
- source_word: פְּלִשְׁתִּים
  choice: филистимляне
  rationale: Устойчивое русское наименование этого народа.
- source_word: כַּפְתֹּרִים
  choice: кафторимов
  rationale: Связанный с Кафтором этноним транслитерирован и поставлен в винительный падеж в соответствии со структурой родословного перечня.
- source_word: וְאֶת
  choice: и
  rationale: Повторяющийся союз передан словом «и», тогда как непереводимый объектный показатель отражён падежной формой существительных.
theological_decisions:
- issue: К какому народу относится происхождение филистимлян
  choice: В основном тексте относительное придаточное отнесено к каслухимам, непосредственно названным перед ним.
  alternative: Отнести происхождение филистимлян к кафторимам либо оставить только пространственное «оттуда».
  rationale: Синтаксис данного стиха естественнее всего связывает придаточное с каслухимами, однако другие библейские места связывают филистимлян с Кафтором; напряжённость не устранена, а обозначена в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских этнонимов. Сохранена зависимость стиха от предыдущего предложения посредством винительного падежа; скобки ясно выделяют родословное пояснение.
