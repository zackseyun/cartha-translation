  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: ru
  text: 'У Евера родились два сына: имя одного — Фалек, потому что в его дни земля[a] была разделена, а имя его брата — Иоктан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна была разделена». Еврейское слово может обозначать как всю землю, так и страну или территорию; характер разделения в тексте не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: У Евера
  rationale: Предлог לְ при пассивном глаголе передаёт принадлежность детей Еверу; русское «у Евера родились» естественно сохраняет пассивную конструкцию и генеалогическую связь.
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: родились два сына
  rationale: Пассивная форма ילד описывает рождение, а בָנִים в данном родословном контексте означает именно сыновей.
- source_word: שֵׁם הָאֶחָד
  choice: имя одного
  rationale: Сохраняется буквальное различение «одного» из двух; вариант «первого» добавил бы отсутствующую в еврейском тексте нумерацию.
- source_word: פֶּלֶג
  choice: Фалек
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
- source_word: כִּי בְיָמָיו
  choice: потому что в его дни
  rationale: כִּי вводит объяснение имени Фалека, а выражение «в его дни» точно и естественно передаёт временную формулу.
- source_word: נִפְלְגָה הָאָרֶץ
  choice: земля была разделена
  rationale: Пассивная формулировка передаёт нифаль глагола פלג и не уточняет ни характер разделения, ни его деятеля. Слово «земля» сохраняет широкое значение הָאָרֶץ.
- source_word: וְשֵׁם אָחִיו
  choice: а имя его брата
  rationale: Союз передан как «а», естественно обозначающее переход ко второму из двух братьев без усиленного противопоставления.
- source_word: יָקְטָן
  choice: Иоктан
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
theological_decisions:
- issue: Смысл слов «земля была разделена» при объяснении имени Фалека
  choice: Сохранить широкую формулировку «земля была разделена», не уточняя природу разделения.
  alternative: «Страна была разделена»; явная ссылка на разделение народов или языков после Вавилона; указание на географическое разделение.
  rationale: Еврейский текст не объясняет, какое именно разделение имеется в виду. Перевод не связывает выражение с конкретным событием и сохраняет его толковательную открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного повествования. Синтаксис близок к еврейскому оригиналу, но естественен для русского читателя; традиционные русские формы личных имён сохранены.
