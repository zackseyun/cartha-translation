  text: וְ/אַרְפַּכְשַׁ֖ד יָלַ֣ד אֶת שָׁ֑לַח וְ/שֶׁ֖לַח יָלַ֥ד אֶת עֵֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/018.yaml
  text: Arpachshad fathered Shelah[b][a], and Shelah fathered Eber.
translation:
  language: ru
  text: Арпахшад[a] стал отцом Шелаха[b], а Шелах стал отцом Эвера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционная форма имени в некоторых русских переводах — «Арфаксад»; она отражает греческую и церковную традицию.
    reason: lexical_alternative
  - marker: b
    text: Евр. Шелах; традиционная форма в некоторых переводах и параллельных родословиях — «Сала».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְפַּכְשַׁד
  choice: Арпахшад
  rationale: Передача имени непосредственно по еврейской форме. Традиционное «Арфаксад» связано с греческой и церковной традицией.
- source_word: יָלַד
  choice: стал отцом
  rationale: В мужской родословной глагол обозначает отцовство и происхождение потомка. Оборот естественен для современного русского языка и точнее в данном контексте, чем буквальное «родил».
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, не имеющий самостоятельного соответствия в русском; его функция выражена синтаксисом.
- source_word: שָׁלַח / שֶׁלַח
  choice: Шелах
  rationale: Обе масоретские огласовки в стихе относятся к одному человеку; единая передача «Шелах» непосредственно отражает еврейское имя. Традиционная форма «Сала» отмечена в сноске.
- source_word: עֵבֶר
  choice: Эвер
  rationale: Прямая передача еврейской формы имени עֵבֶר; традиционное «Евер» менее точно передаёт начальную согласную.
