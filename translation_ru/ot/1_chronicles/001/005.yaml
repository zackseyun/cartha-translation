  text: בְּנֵ֣י יֶ֔פֶת גֹּ֣מֶר וּ/מָג֔וֹג וּ/מָדַ֖י וְ/יָוָ֣ן וְ/תֻבָ֑ל וּ/מֶ֖שֶׁךְ וְ/תִירָֽס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: ru
  text: 'Сыновья Иафета[a]: Гомер, Магог, Мадай, Иаван, Фувал, Мешех и Фирас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «сыновья» в родословиях может обозначать как непосредственных сыновей, так и более отдалённых потомков; здесь оно вводит перечень рода Иафета.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן вводит родословный перечень. В данном контексте названы непосредственные сыновья, поэтому формальное «сыновья» естественно и точно; более широкое родословное употребление отмечено в сноске.
- source_word: יֶפֶת
  choice: Иафет
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: גֹּמֶר
  choice: Гомер
  rationale: Личное имя транслитерировано в традиционной русской библейской форме.
- source_word: מָגוֹג
  choice: Магог
  rationale: Собственное имя передано транслитерацией.
- source_word: מָדַי
  choice: Мадай
  rationale: Сохранено как личное родословное имя, без замены этническим толкованием «мидяне».
- source_word: יָוָן
  choice: Иаван
  rationale: Сохранено как имя в принятой русской библейской передаче, без истолковывающей замены на «Греция» или «ионийцы».
- source_word: תֻבָל
  choice: Фувал
  rationale: Использована узнаваемая традиционная русская библейская форма имени.
- source_word: מֶשֶׁךְ
  choice: Мешех
  rationale: Имя передано близко к еврейскому звучанию и в современной русской форме.
- source_word: תִירָס
  choice: Фирас
  rationale: Использована традиционная русская библейская форма имени.
- source_word: וְ / וּ
  choice: перечень с запятыми и союзом «и» перед последним именем
  rationale: Повторяющиеся еврейские союзы выполняют функцию связи элементов списка; современное русское оформление сохраняет эту функцию без тяжеловесного повторения «и».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным синтаксисом родословного перечня. Имена в основном даны в узнаваемых русских библейских формах; для מֶשֶׁךְ выбрана более близкая к еврейскому форма «Мешех».
