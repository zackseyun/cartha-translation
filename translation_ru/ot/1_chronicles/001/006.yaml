  yaml_path: translation/ot/1_chronicles/001/006.yaml
  text: 'And the sons of Gomer: Ashkenaz[a], Diphath, and Togarmah.'
translation:
  language: ru
  text: 'И сыновья Гомера: Аскеназ, Дифат[a] и Фогарма.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельной родословной, в Бытии 10:3, стоит имя «Рифат»; здесь еврейский текст Диврей ха-Ямим читает «Дифат».
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сочетание сохраняет соединительный союз ו и обычную для родословий формулу בְּנֵי, не расширяя её до более общего «дети».
- source_word: גֹּמֶר
  choice: Гомер
  rationale: Традиционная русская передача библейского имени.
- source_word: אַשְׁכֲּנַז
  choice: Аскеназ
  rationale: Устоявшаяся русская форма имени, соответствующая еврейскому אַשְׁכֲּנַז.
- source_word: דִיפַת
  choice: Дифат
  rationale: Основной текст следует масоретскому чтению Диврей ха-Ямим דִיפַת; созвучное чтение параллельного места отмечено в сноске.
- source_word: תוֹגַרְמָה
  choice: Фогарма
  rationale: Устоявшаяся русская библейская форма имени; начальное ת передано согласно традиции передачи этого имени.
theological_decisions: []
