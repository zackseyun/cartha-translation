  text: וַ/יָּ֖מָת שַׂמְלָ֑ה וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שָׁא֖וּל מֵ/רְחֹב֥וֹת הַ/נָּהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/048.yaml
  text: Samlah died[a], and Shaul from Rehoboth by the River reigned in his place.
translation:
  language: ru
  text: Самла умер, и вместо него стал царствовать Саул из Реховота при реке[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Реховота у реки»; многие считают, что речь идёт о Евфрате.'
    reason: 'Сохраняется буквальная неопределённость еврейского выражения «Реховот реки»: река не названа в самом тексте, хотя её часто отождествляют с Евфратом.'
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямая передача Qal формы глагола מות без ненужного эвфемизма.
- source_word: שַׂמְלָה
  choice: Самла
  rationale: Транслитерация личного имени с учётом норм русского библейского именословия.
- source_word: וַיִּמְלֹךְ
  choice: стал царствовать
  rationale: В формуле престолонаследия глагол מלך указывает на вступление в царствование; выбранная формулировка естественно передаёт этот смысл.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Точно передаёт замещение одного царя другим в контексте престолонаследия.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская передача еврейского личного имени שָׁאוּל; контекст ясно отличает этого едомского царя от израильского Саула.
- source_word: מֵרְחֹבוֹת
  choice: из Реховота
  rationale: Предлог מ־ передаёт происхождение, а название места транслитерируется как Реховот.
- source_word: הַנָּהָר
  choice: у Реки
  rationale: Буквально означает «у реки / у Реки» в составе географического обозначения; прописная буква сохраняет вероятное значение известного водного объекта, не подменяя его прямо названием Евфрат.
theological_decisions: []
