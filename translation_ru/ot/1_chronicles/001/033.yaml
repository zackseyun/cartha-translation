base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: ru
  text: 'Сыновья Мадиана: Ефа, Ефер, Ханох, Авида и Елдага. Все они — сыновья Хеттуры.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Сыновья Мадиана
  rationale: Сочетание в сопряжённой форме передано естественной русской генеалогической формулой. Начальный союз не выражен отдельно, поскольку стих продолжает перечень, а по-русски новый пункт списка естественно начинается без «и».
- source_word: עֵיפָה
  choice: Ефа
  rationale: Устоявшаяся русская передача данного личного имени, соответствующая еврейскому עֵיפָה.
- source_word: וָעֵפֶר
  choice: Ефер
  rationale: Имя передано в принятой русской библейской форме; присоединительный союз выражен структурой перечисления.
- source_word: וַחֲנוֹךְ
  choice: Ханох
  rationale: Прямая и узнаваемая русская передача еврейского имени חֲנוֹךְ; она не смешивает его с иной традиционной формой имени Енох.
- source_word: וַאֲבִידָע
  choice: Авида
  rationale: Имя передано в традиционной русской форме, близкой к еврейскому произношению.
- source_word: וְאֶלְדָּעָה
  choice: и Елдага
  rationale: Последний элемент перечисления соединён союзом «и». Форма «Елдага» сохраняет принятую русскую передачу конечной гортанной согласной.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: В данном контексте естественная русская формула, однозначно отсылающая ко всем названным людям.
- source_word: בְּנֵי קְטוּרָה
  choice: сыновья Хеттуры
  rationale: Сопряжённая конструкция передана буквально и естественно. Связка выражена тире в русском именном предложении.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, достоинственной формой родословия. Сохранены привычные русскому читателю библейские формы имён; ненужная для русского текста английская сноска о варианте Hanoch/Enoch не перенесена. Написание «Мадиан» выбрано как более близкое к еврейскому מִדְיָן и широко узнаваемое.
