  text: and the Arvadites[a], and the Zemarites, and the Hamathites.
translation:
  language: ru
  text: и арвадцев[a], и цемаритов, и хаматитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские названия народов здесь грамматически стоят в единственном числе, но имеют собирательное значение: арвадец, цемарит, хаматит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: и
  rationale: В генеалогическом перечне сочетание союза וְ с показателем прямого дополнения אֶת вводит очередной однородный элемент. Показатель אֶת отдельно не переводится, а повторяющийся союз передаётся русским «и».
- source_word: הָאַרְוָדִי
  choice: арвадцев
  rationale: Форма грамматически единственного числа является этнохоронимом с собирательным значением и обозначает народ или род, связанный с Арвадом. Множественное число естественно передаёт это значение по-русски.
- source_word: הַצְּמָרִי
  choice: цемаритов
  rationale: Этнохороним в единственном числе употреблён собирательно. Форма «цемариты» сохраняет связь с названием Цемар и соответствует стилю перечня древних народов.
- source_word: הַחֲמָתִי
  choice: хаматитов
  rationale: Собирательный этнохороним обозначает жителей или род, связанный с Хаматом. Форма множественного числа ясно выражает, что речь идёт о группе людей.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык. Повтор союза «и» сохранён, поскольку он отражает структуру еврейского перечисления и уместен в торжественном генеалогическом ряду. Названия переданы как этнонимы во множественном числе, а не как имена отдельных предков.
