  text: בְּנֵ֖י עֵשָׂ֑ו אֱלִיפַ֛ז רְעוּאֵ֥ל וִ/יע֖וּשׁ וְ/יַעְלָ֥ם וְ/קֹֽרַח׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/035.yaml
  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: ru
  text: 'Сыновья Исава: Елифаз, Реуил[a], Иеуш, Ялам и Корах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это имя также передают как «Рагуил»; различие связано с традицией передачи имени, а не с другим еврейским именем.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן вводит перечень непосредственных сыновей; «сыновья» здесь точнее, чем более широкие «дети» или «потомки».
- source_word: עֵשָׂו
  choice: Исав
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: אֱלִיפַז
  choice: Елифаз
  rationale: Устоявшаяся русская передача личного имени, близкая к еврейской форме.
- source_word: רְעוּאֵל
  choice: Реуил
  rationale: Передаёт еврейское имя רְעוּאֵל непосредственно; традиционная форма «Рагуил» возникла по иному пути транслитерации.
- source_word: וִיעוּשׁ
  choice: Иеуш
  rationale: Передача личного имени יְעוּשׁ с отделением присоединённого союза וְ; форма сохраняет согласный שׁ как «ш».
- source_word: וְיַעְלָם
  choice: Ялам
  rationale: Близкая к еврейскому звучанию передача имени יַעְלָם; начальный וְ переведён как союз в структуре русского перечисления.
- source_word: וְקֹרַח
  choice: и Корах
  rationale: Имя קֹרַח передано близко к еврейской форме; союз выражен русским «и» перед последним элементом перечня.
theological_decisions: []
translation_notes:
  register: Краткая генеалогическая формула передана современным литературным русским языком. Сохранены двоеточие и естественная русская структура перечисления; имена по возможности переданы непосредственно с древнееврейского, при этом для общеизвестных форм «Исав» и «Елифаз» сохранена устоявшаяся русская традиция.
