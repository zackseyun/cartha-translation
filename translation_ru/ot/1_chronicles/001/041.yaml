base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/041.yaml
  text: 'The sons of Anah: Dishon. And the sons of Dishon: Hamran[a], Eshban, Ithran, and Keran.'
translation:
  language: ru
  text: 'Сыновья Аны: Дишон. Сыновья Дишона: Хамран[a], Эшбан, Итран и Керан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельной родословной в Быт. 36:26 стоит имя «Хемдан» вместо «Хамран». Основной текст здесь следует масоретскому тексту 1 Паралипоменон.
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן в родословии естественно и точно передаётся словом «сыновья».
- source_word: עֲנָה
  choice: Ана
  rationale: Личное имя передано транслитерацией, соответствующей нормам современного русского библейского именословия.
- source_word: דִּישׁוֹן
  choice: Дишон
  rationale: 'Личное имя последовательно передано одинаково: сначала как имя сына Аны, затем как имя отца перечисленных сыновей.'
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Связь с предыдущей генеалогической фразой в русском естественно выражается без начального «и»; структура перечня сохраняется.
- source_word: חַמְרָן
  choice: Хамран
  rationale: Основной текст следует масоретскому чтению 1 Пар. 1:41; вариант из параллельной родословной вынесен в сноску.
- source_word: אֶשְׁבָּן
  choice: Эшбан
  rationale: Имя транслитерировано непосредственно с еврейского с учётом русской фонетики.
- source_word: יִתְרָן
  choice: Итран
  rationale: Имя передано непосредственно с еврейского; начальная буква י здесь обозначена русским «И».
- source_word: כְרָן
  choice: Керан
  rationale: Имя транслитерировано с еврейского; присоединительный союз перед последним элементом списка передан словом «и».
