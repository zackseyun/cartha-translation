  text: Mishma[a], Dumah, Massa, Hadad, and Tema.
translation:
  language: ru
  text: Мишма[a], Дума, Масса, Хадад и Тема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном перечне в Бытие 25:15 стоит «Хадар»; здесь, в 1 Паралипоменон, — «Хадад».
    reason: textual_variant
lexical_decisions:
- source_word: מִשְׁמָע
  choice: Мишма
  rationale: Личное имя в родословном перечне; передано принятой русской библейской транслитерацией, а не переведено.
- source_word: וְ/דוּמָה
  choice: Дума
  rationale: דוּמָה — имя собственное, переданное транслитерацией; союз וְ в перечислении естественно выражен русской пунктуацией и союзом перед последним элементом.
- source_word: מַשָּׂא
  choice: Масса
  rationale: В данном родословном контексте это имя собственное, хотя сходная форма в иных контекстах может означать «ноша» или «пророчество».
- source_word: חֲדַד
  choice: Хадад
  rationale: Сохранено чтение масоретского текста Паралипоменона חֲדַד; отличающееся чтение параллельного списка отмечено в сноске.
- source_word: וְ/תֵימָא
  choice: и Тема
  rationale: Имя собственное передано транслитерацией; союз וְ переведён как «и» перед последним именем списка.
