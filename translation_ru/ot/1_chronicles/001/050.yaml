base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: ru
  text: Ваал-Ханан умер, и вместо него воцарился Хадад. Его город назывался Паи[a], а его жену звали Мехетавел, дочь Матред, дочери Мезахава[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Бытии 36:39 название города дано в форме «Пау», тогда как в Паралипоменон — «Паи».
    reason: textual_variant
  - marker: b
    text: Повторение слова «дочь» в родословной может означать, что Мехетавел была внучкой Мезахава, однако в основном тексте еврейская формулировка сохранена буквально.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת בַּעַל חָנָן
  choice: Ваал-Ханан умер
  rationale: Глагол מות передаёт обычное сообщение о смерти в последовательности царей; имя передано принятой русской библейской транслитерацией.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: и вместо него воцарился
  rationale: Формула естественно передаёт вступление нового царя на место предшественника.
- source_word: הֲדַד
  choice: Хадад
  rationale: Транслитерация личного имени, сохраняющая согласный состав еврейской формы.
- source_word: וְשֵׁם עִירוֹ
  choice: Его город назывался
  rationale: Естественная русская передача безглагольной именной формулы; местоимение относится к только что названному Хададу.
- source_word: פָּעִי
  choice: Паи
  rationale: Передана именно форма текста Паралипоменон; отличная форма параллельного места отмечена в сноске.
- source_word: וְשֵׁם אִשְׁתּוֹ
  choice: а его жену звали
  rationale: Современная и ясная русская передача формулы называния имени.
- source_word: מְהֵיטַבְאֵל
  choice: Мехетавел
  rationale: Транслитерация собственного имени с учётом еврейской формы.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: дочь Матред, дочери Мезагава
  rationale: Грамматическое согласование показывает, что второе «дочь» описывает Матред. Сохранена буквальная генеалогическая конструкция без замены на интерпретирующее «внучка».
- source_word: מֵי זָהָב
  choice: Мезагав
  rationale: В контексте родословной выражение понято как личное имя и транслитерировано, а не переведено буквально.
