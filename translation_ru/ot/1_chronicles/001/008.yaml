base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/008.yaml
  text: 'The sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: ru
  text: 'Сыновья Хама: Куш, Мицраим[a], Пут и Ханаан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мицраим — еврейское название Египта; здесь оно сохранено как имя родоначальника в родословном перечне.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן. В родословии это естественная формула, которая может обозначать как непосредственных сыновей, так и более отдалённых потомков.
- source_word: חָם
  choice: Хам
  rationale: Устоявшаяся русская передача личного имени.
- source_word: כּוּשׁ
  choice: Куш
  rationale: Передача собственного имени, близкая к еврейской форме; в родословном перечне оно обозначает одноимённого предка, хотя может быть связано также с народом или областью.
- source_word: מִצְרַיִם
  choice: Мицраим
  rationale: В данном родословном перечне слово выступает как собственное имя наряду с Кушем, Путом и Ханааном, поэтому сохранена транслитерация, а не географическое соответствие «Египет».
- source_word: פּוּט
  choice: Пут
  rationale: Прямая и принятая в современной русской библейской традиции передача собственного имени.
- source_word: כְנָעַן
  choice: Ханаан
  rationale: Устоявшаяся русская передача собственного имени; здесь оно функционирует как имя родоначальника.
theological_decisions: []
translation_notes:
  register: Краткая родословная формула передана современным литературным русским языком с сохранением традиционных библейских имён там, где они прочно закрепились. Неоднозначность слова «сыновья», способного в родословиях включать более широкое потомство, сохранена без пояснительной сноски, поскольку такое употребление естественно для жанра.
