lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого состояния множественного числа от בֵּן вводит перечень непосредственных сыновей в родословии; буквальная передача естественна по-русски.
- source_word: רְעוּאֵל
  choice: Рагуила
  rationale: Личное имя передано в принятой русской библейской форме «Рагуил» и поставлено в родительный падеж после слова «сыновья».
- source_word: נַחַת
  choice: Нахат
  rationale: Личное имя транслитерировано, а не переведено.
- source_word: זֶרַח
  choice: Зерах
  rationale: Личное имя транслитерировано; возможное нарицательное значение корня здесь не передаётся.
- source_word: שַׁמָּה
  choice: Шамма
  rationale: Личное имя передано современной русской транслитерацией с удвоенной согласной.
- source_word: וּ/מִזָּה
  choice: и Мизза
  rationale: Союз ו передан как «и», а личное имя — транслитерацией с удвоенной согласной, отражающей дагеш.
