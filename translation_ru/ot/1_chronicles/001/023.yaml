lexical_decisions:
- source_word: וְ/אֶת
  choice: и
  rationale: Префикс וְ координирует имена в продолжающемся перечне, а אֶת служит показателем прямого дополнения и отдельно не переводится. Повтор союза «и» естественно передаёт структуру еврейского перечисления.
- source_word: אוֹפִיר
  choice: Офира
  rationale: Традиционная русская передача имени Офир; винительный падеж сохраняет синтаксическую связь с подразумеваемым из предыдущего стиха глаголом «родил».
- source_word: חֲוִילָה
  choice: Хавилу
  rationale: Традиционная русская передача имени Хавила; употреблён винительный падеж как у продолжения перечня прямых дополнений.
- source_word: יוֹבָב
  choice: Иовава
  rationale: Традиционная русская библейская передача имени Иовав; форма винительного падежа соответствует еврейскому показателю прямого дополнения.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественное современное русское итоговое обозначение всех ранее перечисленных лиц; передаёт совокупное значение כָּל и указательное значение אֵלֶּה без тяжеловесности.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Прямо передаёт мужское множественное число конструктивной формы בְּנֵי. Возможное более широкое генеалогическое значение отмечено в сноске, а не подменяет буквальный смысл в основном тексте.
- source_word: יָקְטָן
  choice: Иоктана
  rationale: Использована узнаваемая традиционная русская форма имени Иоктан; родительный падеж передаёт конструктивное сочетание «сыновья Иоктана».
theological_decisions:
- issue: Широта значения בְּנֵי в родословии
  choice: 'В основном тексте: «сыновья»'
  alternative: «потомки»
  rationale: Еврейский текст буквально говорит «сыновья Иоктана», однако в родословных это слово иногда может обозначать представителей более широкой линии происхождения. Чтобы не устранять эту смысловую возможность, она вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства генеалогического стиля. Повторяющийся союз «и» отражает еврейскую координацию, а тире делает итоговую формулу естественной и ясной. Имена даны в традиционных русских библейских формах.
