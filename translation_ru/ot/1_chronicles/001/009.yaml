base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/009.yaml
  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: ru
  text: 'Сыновья Куша: Сева, Хавила, Савта, Раама и Савтеха. А сыновья Раамы: Шева и Дедан.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי כוּשׁ
  choice: Сыновья Куша
  rationale: Формульное בְּנֵי передано буквально как «сыновья»; начальный союз опущен ради естественного русского начала перечня.
- source_word: סְבָא
  choice: Сева
  rationale: Имя транслитерировано с учётом еврейской согласной ב без дагеша, произносимой как /v/.
- source_word: חֲוִילָה
  choice: Хавила
  rationale: Прямая транслитерация собственного имени в естественной для русского языка форме.
- source_word: סַבְתָּא
  choice: Савта
  rationale: Транслитерация сохраняет согласные еврейской формы и не добавляет отсутствующего в тексте конечного звука.
- source_word: רַעְמָא
  choice: Раама
  rationale: Форма передаёт две гласные, разделённые гортанной ע, не смешивая это имя с другим библейским именем Рама.
- source_word: סַבְתְּכָא
  choice: Савтеха
  rationale: Транслитерация отражает еврейские согласные и гласные имени в русской орфографии.
- source_word: וּבְנֵי רַעְמָא
  choice: Сыновья Раамы
  rationale: Новая ветвь родословия оформлена отдельным предложением; בְּנֵי последовательно передано как «сыновья», а имя поставлено в родительный падеж.
- source_word: שְׁבָא
  choice: Шева
  rationale: Прямая транслитерация еврейского имени.
- source_word: דְדָן
  choice: Дедан
  rationale: Собственное имя передано напрямую, без расширительного толкования как названия рода.
