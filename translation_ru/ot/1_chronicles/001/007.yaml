base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/007.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Rodanim.'
translation:
  language: ru
  text: 'И сыновья Иавана: Элиша, Таршиш, Киттим и Роданим[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Бытии 10:4 вместо «Роданим» стоит «Доданим»; это отражает разночтение в написании имени.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сохраняет соединительный союз и родословную формулу; в данном контексте בְּנֵי передаёт перечисление сыновей, хотя в родословиях слово может иметь и более широкое значение «потомки».
- source_word: יָוָן
  choice: Иаван
  rationale: Личное имя передано принятой в русской библейской традиции транслитерацией, а не заменено географическим толкованием «Греция».
- source_word: אֱלִישָׁה
  choice: Элиша
  rationale: Имя транслитерировано с еврейского; форма «Элиша» ближе к звучанию исходного текста и понятна современному читателю.
- source_word: תַרְשִׁישָׁה
  choice: Таршиш
  rationale: Имя транслитерировано непосредственно; конечная ה входит в засвидетельствованную форму имени и отдельно не передаётся.
- source_word: כִּתִּים
  choice: Киттим
  rationale: Сохранена форма этнонима/имени во множественном числе с удвоенным согласным, соответствующая еврейскому כִּתִּים.
- source_word: וְרוֹדָנִים
  choice: и Роданим
  rationale: Основной текст следует масоретскому чтению книги Паралипоменон רוֹדָנִים; вариант из Бытия вынесен в примечание.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, dignified родословной формулой. Имена переданы транслитерацией с еврейского, без замены их предполагаемыми географическими соответствиями. Маркер примечания поставлен непосредственно после имени, к которому относится разночтение.
