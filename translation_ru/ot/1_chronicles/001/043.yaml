  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: ru
  text: И вот цари, которые царствовали в земле Эдома прежде, чем воцарился царь над сынами Израиля:[a] Бела, сын Беора; его город назывался Дингава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде, чем над сынами Израиля стал царствовать какой-либо царь». Буквально: «прежде царствования царя над сынами Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: И вот
  rationale: Сохраняет связь с предшествующим перечнем и естественно вводит новый список в современном русском языке.
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: цари, которые царствовали
  rationale: Передаёт однокоренную конструкцию и ясно обозначает осуществление царской власти.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: в земле Эдома
  rationale: Сохраняет явно выраженное в еврейском тексте слово «земля».
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: прежде, чем воцарился царь
  rationale: Естественно передаёт временную конструкцию с инфинитивом и однокоренным существительным, не добавляя отсутствующего в оригинале слова «какой-либо».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: над сынами Израиля
  rationale: Предлог «над» выражает отношение царской власти, а «сыны Израиля» сохраняет форму исходного этнонима.
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: Бела, сын Беора
  rationale: Имена переданы традиционной русской библейской транслитерацией; приложение оформлено естественно для родословного перечня.
- source_word: וְשֵׁם עִירוֹ
  choice: его город назывался
  rationale: Динамически и ясно передаёт именную конструкцию «имя его города», избегая тяжеловесности.
- source_word: דִּנְהָבָה
  choice: Дингава
  rationale: Использована закрепившаяся в русской библейской традиции форма топонима.
theological_decisions:
- issue: Обобщённое или единичное значение слова מֶלֶךְ
  choice: царь
  alternative: какой-либо царь
  rationale: Еврейский текст употребляет существительное в единственном числе без явного эквивалента «какой-либо»; возможный общий смысл отражён в сноске, а не внесён безоговорочно в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно торжественным летописно-родословным звучанием. Синтаксис упрощён там, где буквальная калька была бы тяжеловесной, но неоднозначность временной фразы сохранена в сноске.
