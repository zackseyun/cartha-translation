  yaml_path: translation/ot/1_chronicles/001/039.yaml
  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: ru
  text: 'Сыновья Лотана: Хори и Хомам[a]. Сестрой Лотана была Тимна.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном родословии, в Бытии 36:22, это имя дано в форме «Хемам», а не «Хомам».
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма בְּנֵי — сопряжённое множественное число слова «сын». В родословии «сыновья» является точной и естественной передачей; начальный союз וּ не требуется воспроизводить отдельным «и» в начале русского стиха.
- source_word: לוֹטָן
  choice: Лотана
  rationale: Личное имя передано принятой русской библейской транслитерацией и поставлено в родительный падеж после слова «сыновья».
- source_word: חֹרִי
  choice: Хори
  rationale: В данном родословном контексте это личное имя, а не обозначение хоррея.
- source_word: וְהוֹמָם
  choice: и Хомам
  rationale: Сохранено чтение книги Паралипоменон הוֹמָם — «Хомам»; отличающаяся форма в Бытие 36:22 отмечена в сноске.
- source_word: וַאֲחוֹת לוֹטָן
  choice: Сестрой Лотана была
  rationale: אֲחוֹת означает «сестра». Русская именная конструкция требует естественно выразить подразумеваемую связку «была»; творительный падеж сохраняет ясность сообщения.
- source_word: תִּמְנָע
  choice: Тимна
  rationale: Личное имя передано как «Тимна» в соответствии с формой еврейского текста данного стиха.
