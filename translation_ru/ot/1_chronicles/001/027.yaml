lexical_decisions:
- source_word: אַבְרָם
  choice: Аврам
  rationale: Личное имя передано в общепринятой русской библейской форме.
- source_word: הוּא
  choice: это
  rationale: Самостоятельное местоимение буквально означает «он», но в безглагольной именной конструкции между двумя именами выполняет функцию отождествления; русское «это» естественно показывает, что речь идёт об одном и том же человеке.
- source_word: אַבְרָהָם
  choice: Авраам
  rationale: Личное имя передано в общепринятой русской библейской форме; стих отождествляет Аврама с Авраамом.
theological_decisions:
- issue: Передача безглагольной формулы отождествления в родословии
  choice: Аврам — это Авраам.
  alternative: Аврам — он Авраам; Аврам есть Авраам.
  rationale: Еврейский текст соединяет два имени местоимением הוּא. В современном русском «это» ясно и естественно передаёт пояснительное отождествление, не добавляя богословского истолкования.
translation_notes:
  register: Краткая, ясная и литературно нейтральная формулировка, соответствующая лаконичному стилю родословия. Тире перед «это» подчёркивает отождествление двух форм имени.
