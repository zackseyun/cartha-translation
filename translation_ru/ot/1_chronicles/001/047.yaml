  text: וַ/יָּ֖מָת הֲדָ֑ד וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו שַׂמְלָ֖ה מִ/מַּשְׂרֵקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/047.yaml
  text: Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: ru
  text: И умер Хадад, и вместо него воцарился Самла из Масреки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямое и естественное соответствие глаголу מוּת; форма повествовательной последовательности передана союзом «и».
- source_word: הֲדָד
  choice: Хадад
  rationale: Личное имя передано русской транслитерацией с сохранением начального придыхательного согласного через «х».
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле царской преемственности глагол מָלַךְ обозначает вступление на царство; «воцарился» естественно передаёт это событие и сохраняет лаконичный стиль списка царей.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: תַּחַת с местоименным суффиксом здесь указывает на замещение предшественника и царскую преемственность; «вместо него» передаёт это прямо, не сводя выражение только к хронологическому «после него».
- source_word: שַׂמְלָה
  choice: Самла
  rationale: Личное имя передано русской транслитерацией.
- source_word: מִמַּשְׂרֵקָה
  choice: из Масреки
  rationale: Предлог מִן выражает происхождение или связь с местом; русское «из Масреки» естественно обозначает место происхождения Самлы.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с сохранением краткой, формульной структуры царского списка. Повтор союза «и» отражает последовательность еврейского повествования, не создавая тяжеловесности. Сноска английского консультационного слоя не перенесена: она прикреплена к слову «умер», хотя относится к תַּחְתָּיו; выбранный перевод «вместо него» достаточно ясно передаёт смысл без примечания.'
