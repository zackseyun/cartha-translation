base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/029.yaml
  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: ru
  text: 'Вот их родословие: первенец Измаила Наваиоф[a], Кедар, Адбеел и Мивсам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя נְבָיוֹת можно также передать как «Небайот»; «Наваиоф» — его традиционная русская форма.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Естественная русская формула, вводящая перечень и передающая указательное значение еврейского выражения.
- source_word: תֹּלְדוֹתָם
  choice: их родословие
  rationale: В генеалогическом контексте слово обозначает родословную запись, происхождение или последующие поколения; «родословие» сохраняет характер заголовка и не сужает смысл до одних только непосредственных потомков.
- source_word: בְּכוֹר
  choice: первенец
  rationale: Точно передаёт статус первого по рождению без добавления отсутствующего в еврейском тексте слова «сын».
- source_word: יִשְׁמָעֵאל
  choice: Измаил
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: נְבָיוֹת
  choice: Наваиоф
  rationale: Устоявшаяся в русской библейской традиции форма имени; более буквальная передача «Небайот» отмечена в сноске.
- source_word: קֵדָר
  choice: Кедар
  rationale: Устоявшаяся русская передача имени, близкая к еврейской форме.
- source_word: אַדְבְּאֵל
  choice: Адбеел
  rationale: Передача еврейского личного имени с сохранением его узнаваемой традиционной формы.
- source_word: מִבְשָׂם
  choice: Мивсам
  rationale: Устоявшаяся русская передача еврейского личного имени.
