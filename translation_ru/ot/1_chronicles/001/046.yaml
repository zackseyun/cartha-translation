base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: ru
  text: И умер Хушам, и вместо него воцарился Гадад, сын Бедада, поразивший Мадиан в земле Моава. Его город назывался Авит[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Аиот» — другой вариант передачи названия города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямое и обычное повествовательное значение глагола מות, без эвфемизма.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: вместо него воцарился
  rationale: Передаёт как вступление на царство, так и значение תחתיו — занятие места предшественника.
- source_word: חוּשָׁם
  choice: Гусам
  rationale: Транслитерация личного имени в форме, естественной для русской библейской традиции.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Гадад, сын Бедада
  rationale: Сохраняет личные имена и прямо передаёт патронимическую конструкцию с בן.
- source_word: הַמַּכֶּה
  choice: поразивший
  rationale: Причастная форма сохраняет характеристику Гадада через совершённое им действие и не усиливает её до однозначного «уничтоживший».
- source_word: אֶת מִדְיָן
  choice: Мадиан
  rationale: Сохраняется форма собственного имени; контекст допускает понимание как народа или политико-географического образования, поэтому это не уточняется словом «мадианитяне».
- source_word: בִּשְׂדֵה מוֹאָב
  choice: в земле Моава
  rationale: שׂדה может обозначать не только отдельное поле, но и открытую местность или область; «в земле Моава» естественно передаёт региональный смысл в данном военном контексте.
- source_word: וְשֵׁם עִירוֹ
  choice: Его город назывался
  rationale: Естественная русская передача древнееврейской формулы «и имя его города», без утраты смысла.
- source_word: עיות
  choice: Авит
  rationale: Традиционная русская передача названия города; вариант чтения отражён в примечании.
