base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: ru
  text: 'Сыновья Шовала: Алиан[a], Манахат, Евал, Шефи[b] и Онам. Сыновья Цивеона: Айя и Ана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь «Алиан»; в параллельной родословной, Бытие 36:23, — «Алван».
    reason: alternative_reading
  - marker: b
    text: В Паралипоменоне здесь «Шефи»; в параллельном месте, Бытие 36:23, — «Шефо».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: В родословном перечне слово буквально обозначает сыновей; контекст не требует более широкого «потомки».
- source_word: שׁוֹבָל
  choice: Шовал
  rationale: Передача личного имени по еврейской форме с учётом принятого русского библейского облика имён.
- source_word: עַלְיָן
  choice: Алиан
  rationale: Передаёт непосредственно форму имени в еврейском тексте Паралипоменона; отличие параллельного места отмечено в сноске.
- source_word: מָנַחַת
  choice: Манахаф
  rationale: Транслитерация личного имени; конечная ת передана в соответствии с традиционным русским библейским написанием подобных имён.
- source_word: עֵיבָל
  choice: Евал
  rationale: Прямая передача имени в данном еврейском тексте с традиционной для русского библейского регистра передачей ב как «в».
- source_word: שְׁפִי
  choice: Шефи
  rationale: Сохраняет форму имени именно в Паралипоменоне; вариант из параллельной родословной указан в сноске.
- source_word: אוֹנָם
  choice: Онам
  rationale: Прямая транслитерация личного имени.
- source_word: צִבְעוֹן
  choice: Цивеон
  rationale: Передача еврейского личного имени в естественной русской библейской форме.
- source_word: אַיָּה
  choice: Айя
  rationale: Форма отражает еврейское произношение имени и ясно отличается от следующего имени.
- source_word: עֲנָה
  choice: Ана
  rationale: Прямая и естественная для русского языка передача личного имени.
- source_word: וְ / וּ / וַ
  choice: и; во втором предложении союз не воспроизведён
  rationale: В перечислении союзы естественно переданы русским «и». Начальное וּ перед второй группой опущено как избыточное для современного русского синтаксиса, при этом связь частей сохранена.
