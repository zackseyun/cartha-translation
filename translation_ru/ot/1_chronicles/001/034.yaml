  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: ru
  text: 'Авраам стал отцом Исаака. Сыновья Исаака: Исав и Израиль[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Иаков.
    reason: Поясняет, что названный здесь Израиль — Иаков, сохраняя при этом форму имени из еврейского текста.
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Порода hифиль глагола ילד в родословиях обозначает отцовство; выражение «стал отцом» точно и естественно для современного русского языка, в отличие от архаичного «родил» применительно к мужчине.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, функция которого передана русским падежным управлением.
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בן вводит следующую строку родословия; двоеточие естественно передаёт её заголовочную краткость.
- source_word: עֵשָׂו
  choice: Исав
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: וְיִשְׂרָאֵל
  choice: и Израиль
  rationale: Сохранено прямо указанное в еврейском тексте имя Израиль, а не заменено именем Иаков.
theological_decisions:
- issue: Передача יִשְׂרָאֵל в родословии, где имеется в виду Иаков
  choice: Израиль
  alternative: Иаков
  rationale: Еврейский текст называет сыновей Исаака «Исав и Израиль». Перевод сохраняет данное в источнике имя, а примечание поясняет, что речь идёт об Иакове, не сглаживая формулировку оригинала.
translation_notes:
  register: Современный литературный русский язык; краткая форма родословия сохранена. Оборот «стал отцом» выбран как естественный и достойный эквивалент генеалогической формулы.
