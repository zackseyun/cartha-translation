lexical_decisions:
- source_word: אַלּוּף
  choice: вождь
  rationale: В перечне эдомских родов слово обозначает главу племени или рода. «Вождь» кратко и естественно передаёт титул, не сужая его значения до военного командования.
- source_word: אָהֳלִיבָמָה
  choice: Оголивама
  rationale: Имя передано в принятой русской библейской форме; родительный падеж соответствует пониманию имени как названия рода, возглавляемого данным вождём.
- source_word: אֵלָה
  choice: Эла
  rationale: Имя транслитерировано с еврейского и поставлено в родительный падеж как обозначение рода.
- source_word: פִּינֹן
  choice: Пинон
  rationale: Имя транслитерировано с еврейского и поставлено в родительный падеж как обозначение рода.
