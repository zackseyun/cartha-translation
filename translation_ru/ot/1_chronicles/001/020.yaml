lexical_decisions:
- source_word: יָקְטָן
  choice: Иоктан
  rationale: Личное имя передано в принятой русской библейской форме, близкой к еврейскому звучанию.
- source_word: יָלַד
  choice: стал отцом
  rationale: В мужской родословной глагол обозначает отцовство, рождение потомка. Формулировка естественна для современного русского языка и не предполагает, что речь непременно идёт о непосредственном рождении в узком биологическом смысле.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, переданный средствами русского синтаксиса.
- source_word: אַלְמוֹדָד
  choice: Алмодад
  rationale: 'Личное имя транслитерировано; в тексте употреблён требуемый после «отцом» родительный падеж: «Алмодада».'
- source_word: שָׁלֶף
  choice: Шалеф
  rationale: Личное имя передано по масоретской огласовке; в тексте стоит форма родительного падежа «Шалефа».
- source_word: חֲצַרְמָוֶת
  choice: Хацармавет
  rationale: Личное имя транслитерировано с передачей конечного ת как «т»; в тексте стоит форма «Хацармавета».
- source_word: יָרַח
  choice: Иерах
  rationale: Личное имя передано в форме, соответствующей сложившейся русской библейской традиции; в тексте стоит родительный падеж «Иераха».
