- source_word: אַלּוּף
  choice: вождь
  rationale: В перечне эдомских родов слово обозначает главу племени или рода. «Вождь» кратко и естественно передаёт руководящее положение, сохраняя лаконичный ритм списка.
- source_word: קְנַז
  choice: Кеназ
  rationale: Собственное имя передано транслитерацией, близкой к еврейской форме.
- source_word: תֵּימָן
  choice: Феман
  rationale: Здесь слово употреблено как имя в перечне эдомских вождей. Выбрана узнаваемая русская библейская форма имени.
- source_word: מִבְצָר
  choice: Мивцар
  rationale: Собственное имя передано транслитерацией с учётом еврейского произношения.
