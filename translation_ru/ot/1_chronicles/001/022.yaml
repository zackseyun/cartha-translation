  text: Ebal[a], Abimael, and Sheba.
translation:
  language: ru
  text: Евала[a], Авимаила и Шеву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельной родословной в Бытии 10:28 это имя дано в форме «Овал».
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: и; в остальных случаях передано перечислением
  rationale: 'Сочетание союза וְ с показателем прямого дополнения אֶת вводит каждый элемент родословного перечня. В русском повторять служебную конструкцию не требуется: связь передаётся запятыми и союзом «и» перед последним именем.'
- source_word: עֵיבָל
  choice: Евала
  rationale: Имя передано в форме, соответствующей еврейскому עֵיבָל и привычной русской библейской ономастике. В параллельной родословной Бытия 10:28 встречается форма «Овал»; различие сохранено в сноске.
- source_word: אֲבִימָאֵל
  choice: Авимаила
  rationale: Личное имя транслитерировано с учётом принятой русской библейской формы и поставлено в винительный падеж как одушевлённое прямое дополнение, продолжающее синтаксис предыдущего стиха.
- source_word: שְׁבָא
  choice: Шеву
  rationale: Имя שְׁבָא передано как «Шева», а в данном перечислении — в винительном падеже «Шеву». Эта форма отличает имя от сходного имени סְבָא.
