  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֖לֶּה אַלּוּפֵ֥י אֱדֽוֹם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/054.yaml
  text: Chief Magdiel[a], chief Iram. These were the chiefs of Edom.
translation:
  language: ru
  text: Вождь Магдиил, вождь Ирам. Это вожди Эдома.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главы родов Эдома». Еврейское слово может обозначать племенных или родовых предводителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: вождь
  rationale: В эдомских родословных и политических перечнях слово обозначает предводителя племени или рода. «Вождь» кратко и естественно передаёт этот смысл, не прибегая к исторически чуждому титулу «князь» или архаическому «герцог».
- source_word: מַגְדִּיאֵל
  choice: Магдиил
  rationale: Имя собственное передано в принятой русской библейской форме, близкой к еврейскому звучанию.
- source_word: עִירָם
  choice: Ирам
  rationale: Имя собственное транслитерировано в соответствии с его еврейской формой.
- source_word: אֵלֶּה
  choice: Это
  rationale: Указательное местоимение вводит итог к предшествующему перечню; настоящее именное предложение сохраняет лаконичность еврейского текста.
- source_word: אַלּוּפֵי אֱדֹם
  choice: вожди Эдома
  rationale: Сочетание подводит итог перечню, называя перечисленных лиц эдомскими племенными или родовыми предводителями.
theological_decisions: []
