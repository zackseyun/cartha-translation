  source_fidelity: 'Текст точно передаёт еврейский перечень: повтор אַלּוּף сохранён, имена Магдиил и Ирам переданы корректно, а итоговое «Это вожди Эдома» верно отражает именную конструкцию אֵלֶּה אַלּוּפֵי אֱדוֹם. Настоящее «Это» допустимо и сохраняет лаконичный характер оригинала; английское ретроспективное «were» не требует обязательной передачи прошедшим временем по-русски.'
