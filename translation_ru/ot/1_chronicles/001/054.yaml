  terminology: «Вождь» — приемлемая современная передача אַלּוּף в данном эдомском списке и не навязывает позднейший титул. Сноска корректно указывает родо-племенной оттенок термина и привязана к итоговому «вожди Эдома». Имена переданы последовательно и близко к еврейской форме.
