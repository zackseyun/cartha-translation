  yaml_path: translation/ot/1_chronicles/001/038.yaml
  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: ru
  text: 'И сыновья[a] Сеира: Лотан, Шовал, Цивеон, Ана, Дишон, Эцер и Дишан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «сыновья» может обозначать как непосредственных сыновей, так и, шире, потомков или представителей родов. Здесь сохранена формальная родословная формулировка.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сохраняет соединительный союз ו, продолжающий генеалогический перечень, и формальную родословную формулу בְּנֵי.
- source_word: שֵׂעִיר
  choice: Сеир
  rationale: Личное имя в данном генеалогическом контексте; передано в принятой русской библейской форме.
- source_word: לוֹטָן
  choice: Лотан
  rationale: Личное имя, переданное в принятой русской транслитерации.
- source_word: שׁוֹבָל
  choice: Шовал
  rationale: Личное имя, переданное по еврейскому звучанию и русской библейской традиции.
- source_word: צִבְעוֹן
  choice: Цивеон
  rationale: Личное имя, переданное в принятой русской библейской форме.
- source_word: עֲנָה
  choice: Ана
  rationale: Личное имя; форма соответствует русской библейской традиции.
- source_word: דִישֹׁן
  choice: Дишон
  rationale: Личное имя; сохранено отличие от следующего имени דִישָׁן.
- source_word: אֵצֶר
  choice: Эцер
  rationale: Личное имя, переданное близко к еврейскому произношению и в принятой русской форме.
- source_word: דִישָׁן
  choice: Дишан
  rationale: Личное имя; отдельная передача сохраняет его отличие от דִישֹׁן («Дишон»).
