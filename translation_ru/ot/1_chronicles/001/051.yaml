  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: ru
  text: 'Гадад умер, и вождями[a] Эдома были: вождь Фимна, вождь Алия[b] и вождь Иетет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово אַלּוּף обозначает здесь главу едомского племени или рода; в старых переводах его иногда передавали титулом «князь».
    reason: lexical_alternative
  - marker: b
    text: В параллельном перечне в Бытии 36:40 это имя дано в форме «Алва»; здесь в еврейском тексте Паралипоменона — «Алия».
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Форма wayyiqtol продолжает последовательное повествование; русский глагол совершенного вида естественно передаёт завершённое событие, а союз выражен далее общей связью предложения.
- source_word: הֲדָד
  choice: Гадад
  rationale: Устоявшаяся русская передача библейского личного имени.
- source_word: וַיִּהְיוּ
  choice: были
  rationale: Здесь глагол вводит перечень едомских вождей; связка «были» сохраняет структуру еврейского текста и естественна по-русски.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: вождями / вождь
  rationale: В едомском перечне слово обозначает глав племён или родов. «Вождь» понятно современному читателю и не вносит позднейшего феодального титула.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Устоявшаяся русская форма названия страны и народа.
- source_word: תִּמְנָע
  choice: Фимна
  rationale: Сохранена узнаваемая традиционная русская форма этого библейского имени.
- source_word: עליה
  choice: Алия
  rationale: Передаёт форму имени, засвидетельствованную в Паралипоменоне; отличие параллельного места в Бытии отмечено в сноске.
- source_word: יְתֵת
  choice: Иетеф
  rationale: Употреблена традиционная русская форма библейского имени, соответствующая еврейскому יְתֵת.
