lexical_decisions:
- source_word: וּכְנַעַן
  choice: Ханаан
  rationale: Имя передано в принятой русской библейской форме. Союз וּ не выражен отдельно, поскольку стих продолжает генеалогический перечень, а начальное «И» в современном русском здесь необязательно.
- source_word: יָלַד
  choice: стал отцом
  rationale: В генеалогии глагол с подлежащим мужского рода обозначает рождение потомка от данного предка. Выражение «стал отцом» естественно для современного русского языка и сохраняет родословный смысл без неуместного буквального «родил».
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском языке и передаётся синтаксической формой дополнения.
- source_word: צִידוֹן
  choice: Сидона
  rationale: Имя צִידוֹן передано принятой русской формой «Сидон» и поставлено в винительный падеж по синтаксису предложения.
- source_word: בְּכֹרוֹ
  choice: своего первенца
  rationale: Существительное означает «первенец», а местоименный суффикс указывает на Ханаана. «Своего» ясно соотносит первенца с подлежащим и сохраняет указание на порядок рождения.
- source_word: וְאֶת
  choice: и
  rationale: Союз вводит второе однородное дополнение; показатель прямого дополнения отдельно не переводится.
- source_word: חֵת
  choice: Хета
  rationale: Здесь употреблено личное имя родоначальника, а не название народа во множественном числе; в предложении оно поставлено в винительный падеж.
