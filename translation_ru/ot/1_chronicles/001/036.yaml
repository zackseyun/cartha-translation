source:
  edition: WLC
  text: בְּנֵ֖י אֱלִיפָ֑ז תֵּימָ֤ן וְ/אוֹמָר֙ צְפִ֣י וְ/גַעְתָּ֔ם קְנַ֖ז וְ/תִמְנָ֥ע וַ/עֲמָלֵֽק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: ru
  text: 'Сыновья Елифаза: Феман, Омар, Цефи[a], Гафам, Кеназ, Фимна[b] и Амалик.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь Цефи; в Бытии 36:11 стоит другой вариант имени — Цефо.
    reason: textual_variant
  - marker: b
    text: В Бытии 36:12 Фимна названа наложницей Елифаза, а Амалик — её сыном. Здесь в Паралипоменон оба имени входят в перечень сыновей Елифаза.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן вводит генеалогический перечень; прямое «сыновья» точнее, чем более широкое «потомки».
- source_word: אֱלִיפָז
  choice: Елифаз
  rationale: Передача личного имени в соответствии с укоренившейся русской библейской традицией.
- source_word: תֵּימָן
  choice: Феман
  rationale: Традиционная и узнаваемая русская форма личного имени.
- source_word: אוֹמָר
  choice: Омар
  rationale: Прямая передача личного имени.
- source_word: צְפִי
  choice: Цефи
  rationale: Передаёт именно форму צְפִי в тексте Паралипоменон и сохраняет её отличие от формы צְפוֹ в Бытии 36:11.
- source_word: גַעְתָּם
  choice: Гафам
  rationale: Укоренившаяся русская библейская форма имени.
- source_word: קְנַז
  choice: Кеназ
  rationale: Укоренившаяся русская передача личного имени.
- source_word: תִמְנָע
  choice: Фимна
  rationale: Традиционная русская библейская форма этого личного имени.
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: Традиционная русская форма имени родоначальника.
- source_word: וְ / וַ
  choice: перечень через запятые с союзом «и» перед последним именем
  rationale: Так естественно передаётся структура еврейского перечня в современном русском языке без тяжеловесного повторения союза перед каждым именем.
theological_decisions:
- issue: Соотношение Фимны и Амалика с сыновьями Елифаза по сравнению с Бытием 36
  choice: В основном тексте Фимна и Амалик оставлены в общем перечне после вводной формулы «Сыновья Елифаза», как это дано в Паралипоменон.
  alternative: Истолковать Фимну как наложницу Елифаза, а Амалика — как её сына, согласовав стих с Бытием 36:12.
  rationale: Перевод следует непосредственной форме еврейского текста и не устраняет напряжение между параллельными генеалогическими сообщениями; различие поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционных, хорошо узнаваемых русских форм библейских имён. Краткая генеалогическая формула передана естественно и без добавочного истолкования.
