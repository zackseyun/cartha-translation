  yaml_path: translation/ot/1_chronicles/001/010.yaml
  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: ru
  text: И Хуш родил Нимрода; он начал быть могучим человеком на земле[а].
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Или: «в стране». Еврейское эре́ц может означать «земля» или «страна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כ֖וּשׁ
  choice: И Хуш
  rationale: Простой союз связывает эту фразу с предшествующим родословием; имя передано в принятой русской библейской форме.
- source_word: יָלַ֣ד
  choice: родил
  rationale: В родословном контексте глагол обозначает отцовство; краткая традиционная русская формула естественна для библейской генеалогии.
- source_word: נִמְר֑וֹד
  choice: Нимрода
  rationale: Имя передано в принятой русской библейской форме и поставлено в винительный падеж.
- source_word: ה֣וּא הֵחֵ֔ל לִ/הְי֥וֹת
  choice: он первым стал
  rationale: 'Конструкция буквально допускает «он начал быть», однако в данном контексте естественно выражает начало нового явления: Нимрод первым стал таковым. Такое прочтение отражено и в параллельном месте Быт 10:8.'
- source_word: גִּבּ֖וֹר
  choice: могучим человеком
  rationale: Слово широко обозначает сильного, могущественного человека и не требует здесь более узкого значения «воин» или оценочного «герой».
- source_word: בָּ/אָֽרֶץ
  choice: на земле
  rationale: 'Русское «на земле» естественно сохраняет широту אֶרֶץ: выражение может относиться как к земле вообще, так и к конкретной стране; контекст не уточняет пределы.'
theological_decisions:
- issue: Смысл הֵחֵל в характеристике Нимрода
  choice: он первым стал
  alternative: он начал быть
  rationale: Буквальная конструкция «начал быть» по-русски неестественна и может создать ошибочное впечатление постепенного обретения свойства. Контекст родословного сообщения допускает значение «первым стал», не уточняя нравственной оценки Нимрода.
- issue: Объём значения בָּאָרֶץ
  choice: на земле
  alternative: в стране
  rationale: אֶרֶץ может обозначать и землю вообще, и отдельную страну. Русское выражение «на земле» сохраняет более широкое и традиционное понимание, не делая утверждение о вселенском господстве Нимрода.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного повествования. Сохранена краткость стиха; архаичное «родил» здесь уместно как устойчивая генеалогическая формула. Пунктуация передаёт два тесно связанных сообщения.
