  yaml_path: translation/ot/1_chronicles/001/031.yaml
  text: Jetur[a], Naphish, and Kedemah. These were the sons of Ishmael.
translation:
  language: ru
  text: Иетур, Нафиш и Кедема[a]. Это сыновья Измаила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В русской библейской традиции это имя также передаётся как «Кедма».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְטוּר
  choice: Иетур
  rationale: Собственное имя передано транслитерацией, соответствующей еврейскому звучанию и русской библейской традиции.
- source_word: נָפִישׁ
  choice: Нафиш
  rationale: Собственное имя передано непосредственно с еврейского; конечная согласная ש обозначена как «ш».
- source_word: וָ/קֵדְמָה
  choice: и Кедема
  rationale: Союз ו передан как «и», а имя קֵדְמָה — близкой к еврейской форме транслитерацией «Кедема».
- source_word: אֵלֶּה הֵם
  choice: Это
  rationale: Естественная русская форма именного отождествляющего предложения; настоящее время, не выраженное связкой, сохраняется без добавления глагола «были».
- source_word: בְּנֵי
  choice: сыновья
  rationale: В данном генеалогическом перечне речь идёт о названных по именам сыновьях, поэтому буквальное значение подходит контексту.
- source_word: יִשְׁמָעֵאל
  choice: Измаила
  rationale: Употреблена закрепившаяся в русском библейском языке форма имени в родительном падеже.
