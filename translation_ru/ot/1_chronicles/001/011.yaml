  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לודיים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/011.yaml
  text: Mizraim fathered the Ludites[a], the Anamites, the Lehabites, and the Naphtuhites.
translation:
  language: ru
  text: Мицраим стал отцом лудимов[a], анамимов, лехавимов и нафтухимов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при передаче имён без русского падежного оформления: «Лудим, Анамим, Лехавим и Нафтухим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Мицраим
  rationale: В родословии слово выступает как личное имя прародителя, поэтому передано транслитерацией, а не названием страны «Египет».
- source_word: יָלַד
  choice: стал отцом
  rationale: В генеалогическом контексте глагол обозначает отцовство или происхождение по мужской линии. Эта формулировка естественна в современном русском и не сужает смысл до непосредственного рождения каждого названного народа.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, не имеющий самостоятельного соответствия в русском; его функция выражена синтаксисом.
- source_word: לודיים
  choice: лудимов
  rationale: Еврейская форма обозначает народ или потомков; русская форма на «-им» сохраняет узнаваемость имени, а падежное окончание естественно включается в предложение.
- source_word: עֲנָמִים
  choice: анамимов
  rationale: Передано как название народа во множественном числе, параллельно остальным членам перечня.
- source_word: לְהָבִים
  choice: лехавимов
  rationale: Транслитерация отражает согласную ח как «х» и передаёт форму как название группы потомков.
- source_word: נַפְתֻּחִים
  choice: нафтухимов
  rationale: Передано как этноним во множественном числе с русским падежным оформлением.
theological_decisions:
- issue: Непосредственное отцовство или происхождение народов
  choice: стал отцом
  alternative: породил; от него произошли
  rationale: Выражение сохраняет генеалогический образ еврейского יָלַד, не утверждая более точно, чем текст, идёт ли речь о непосредственных сыновьях или о народах-потомках.
translation_notes:
  register: Современный литературный русский язык; сохранён краткий ритм родословного перечня. Названия народов транслитерированы и оформлены по нормам русского склонения.
