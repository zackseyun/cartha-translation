id: 1CH.1.32
reference: 1 Chronicles 1:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: ru
  text: 'И сыновья Хеттуры[a], наложницы Авраама: она родила Зимрана, Иокшана, Медана, Мадиана, Ишбака и Шуаха. Сыновья Иокшана: Шева и Дедан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Быт. 25:1 Хеттура названа женой Авраама; здесь Летописец прямо называет её его наложницей.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сохраняет союз, связывающий стих с последовательностью родословия, и точно передаёт форму сопряжённого множественного числа.
- source_word: קְטוּרָה
  choice: Хеттура
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: פִּילֶגֶשׁ
  choice: наложница
  rationale: Точно передаёт обозначенный еврейским словом признанный союз, имевший более низкий статус по сравнению с браком с главной женой; не смешивает формулировку стиха со словом «жена» в Быт. 25:1.
- source_word: יָלְדָה
  choice: она родила
  rationale: Женский род глагола отсылает к Хеттуре; явное местоимение делает эту связь естественной и ясной по-русски.
- source_word: זִמְרָן
  choice: Зимран
  rationale: Традиционная русская библейская передача имени.
- source_word: יָקְשָׁן
  choice: Иокшан
  rationale: Традиционная русская библейская передача имени.
- source_word: מְדָן
  choice: Медан
  rationale: Транслитерация личного имени с учётом сложившейся русской библейской формы.
- source_word: מִדְיָן
  choice: Мадиан
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: יִשְׁבָּק
  choice: Ишбак
  rationale: Близкая к еврейскому звучанию и понятная русская транслитерация.
- source_word: שׁוּחַ
  choice: Шуах
  rationale: Передаёт конечный гортанный согласный и соответствует принятой русской форме имени.
- source_word: שְׁבָא
  choice: Шева
  rationale: Традиционная русская передача имени в данном родословном контексте.
- source_word: דְדָן
  choice: Дедан
  rationale: Традиционная русская передача имени.
theological_decisions:
- issue: Статус Хеттуры по отношению к Аврааму
  choice: наложница
  alternative: жена; второстепенная жена
  rationale: В данном стихе прямо употреблено פִּילֶגֶשׁ. Перевод сохраняет формулировку Летописца и не гармонизирует её молча с Быт. 25:1, где Хеттура названа женой.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified родословным ритмом. Двоеточия сохраняют структуру перечисления; повторный союз перед вторым поколением опущен как необязательный по-русски, без потери связи.
