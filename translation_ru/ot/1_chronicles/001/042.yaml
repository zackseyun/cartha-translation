  text: בְּֽנֵי אֵ֔צֶר בִּלְהָ֥ן וְ/זַעֲוָ֖ן יַעֲקָ֑ן בְּנֵ֥י דִישׁ֖וֹן ע֥וּץ וַ/אֲרָֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: ru
  text: 'Сыновья Эцера: Билхан, Зааван и Яакан[a]. Сыновья Дишона: Уц и Аран.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельной родословной в Быт. 36:27 это имя дано в форме Акан.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן вводит перечень непосредственных сыновей; буквальный и естественный для родословия перевод.
- source_word: אֵצֶר
  choice: Эцер
  rationale: Передача личного имени по еврейской форме с сохранением начального гласного и согласного צ как «ц».
- source_word: בִּלְהָן
  choice: Билхан
  rationale: Транслитерация личного имени; сочетание «х» передаёт еврейскую ה и отличает имя от традиционализированной передачи через «г».
- source_word: זַעֲוָן
  choice: Зааван
  rationale: Транслитерация отражает два слога, разделённые гортанным ע, без добавления не выраженных в тексте звуков.
- source_word: יַעֲקָן
  choice: Яакан
  rationale: Транслитерация формы именно в 1 Пар 1:42; начальное יַ и следующий слог с ע переданы как «Яа-».
- source_word: דִישׁוֹן
  choice: Дишон
  rationale: Транслитерация личного имени; сохранено отличие от сходного имени דִּישָׁן («Дишан») в той же родословной.
- source_word: עוּץ
  choice: Уц
  rationale: 'Прямая русская передача еврейского имени: וּ как «у», צ как «ц».'
- source_word: אֲרָן
  choice: Аран
  rationale: Прямая транслитерация личного имени.
theological_decisions: []
translation_notes:
  register: 'Краткий, формально ясный генеалогический стиль. Двоеточия естественно вводят перечни имён. Имена переданы непосредственно с древнееврейского в современной русской транслитерации. Предложенную английскую сноску о различии «Зааван/Заван» не включаем: масоретский текст Быт. 36:27 также читает זַעֲוָן; поэтому такое примечание не подтверждается еврейским источником.'
