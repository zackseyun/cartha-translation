  text: וַ/יָּ֖מָת שָׁא֑וּל וַ/יִּמְלֹ֣ךְ תַּחְתָּ֔י/ו בַּ֥עַל חָנָ֖ן בֶּן עַכְבּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: ru
  text: И умер Шаул[a], и вместо него воцарился Баал-Ханан, сын Ахбора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В традиционных русских переводах эти имена обычно передаются как «Саул», «Ваал-Ханан» и «Ахбор». Здесь использованы формы, более непосредственно отражающие еврейское звучание; для имени Ахбор сохранена привычная русская передача.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: и умер
  rationale: Стандартная повествовательная форма глагола מות передаёт последовательность событий; прямое «умер» точнее эвфемизмов.
- source_word: שָׁאוּל
  choice: Шаул
  rationale: Транслитерация еврейского личного имени сохраняет его исходное звучание и отличает этого эдомского царя от традиционной русской формы «Саул».
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В формуле царской преемственности глагол מלך обозначает вступление на царство; совершенный вид естественно передаёт это событие по-русски.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Сочетание תַּחַת с местоименным суффиксом выражает замещение и преемство.
- source_word: בַּעַל חָנָן
  choice: Баал-Ханан
  rationale: Имя передано близкой к еврейской форме транслитерацией; дефис делает прозрачным составное строение имени.
- source_word: בֶּן
  choice: сын
  rationale: В данном родословно-царском сообщении בֶּן прямо обозначает сына.
- source_word: עַכְבּוֹר
  choice: Ахбор
  rationale: Русская библейская транслитерация «Ахбор» естественно передаёт спирантное произношение буквы כ после гласной и остаётся узнаваемой.
