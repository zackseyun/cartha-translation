    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: и
  rationale: Союз ו передан словом «и»; показатель прямого дополнения אֵת в русском языке отдельно не выражается.
- source_word: הַחִוִּי
  choice: хиввеев
  rationale: Этноним в форме единственного числа с артиклем в данном родословном перечне имеет собирательное значение; русский множественный этноним естественно передаёт название народа.
- source_word: הָעַרְקִי
  choice: аркеев
  rationale: Обозначение народа или рода в родословном перечне передано традиционной русской формой множественного числа.
- source_word: הַסִּינִי
  choice: синеев
  rationale: Этноним с собирательным значением передан русской формой множественного числа, соответствующей контексту перечисления народов.
