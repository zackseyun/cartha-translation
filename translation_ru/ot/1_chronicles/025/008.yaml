    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: бросили жребии
  rationale: Устойчивое еврейское выражение обозначает бросание жребия для распределения назначений; русский библейский оборот точен и понятен.
- source_word: מִשְׁמֶרֶת
  choice: о чередах служения
  rationale: В контексте храмовых музыкантов слово обозначает установленную очередь или назначенную служебную обязанность. Множественное число по смыслу отражает распределение между участниками, хотя в еврейском стоит единственное число.
- source_word: לְעֻמַּת
  choice: наравне с
  rationale: Здесь предлог выражает соответствие и равное положение сопоставляемых групп, а не пространственное противостояние.
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: малый наравне с великим
  rationale: Сохранена еврейская парная формула, указывающая на равное участие независимо от положения.
- source_word: מֵבִין
  choice: сведущий
  rationale: Причастие буквально обозначает понимающего, знающего или умелого человека. «Сведущий» сохраняет эту широту и не превращает его без достаточного основания именно в учителя.
- source_word: עִם תַּלְמִיד
  choice: вместе с учеником
  rationale: תַּלְמִיד — обучающийся; «ученик» естественно для контекста обучения храмовому музыкальному служению, а עִם прямо выражает совместность.
