  source_fidelity: 'В целом переданы бросание жребиев, равное участие «малого» и «великого» и сопоставление сведущего с учеником. Однако «бросили жребии о чередах» неудачно связывает жребии с назначением: русский предлог «о» здесь звучит так, будто жребии бросают для обсуждения вопроса, а не для распределения служения. Более ясная конструкция должна передать функциональную связь, не выдавая спорный смысл מִשְׁמֶרֶת за более узкий, чем он есть.'
