  text: 'Четырнадцатым был Маттифия[a]: его сыновья и братья — всего двенадцать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Для четырнадцатого — Маттифия». В контексте этого перечня число обозначает четырнадцатый жребий, то есть четырнадцатую группу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: Четырнадцатым был
  rationale: В повторяющейся формуле главы сочетание לְ с числительным обозначает порядковый номер жребия или группы. По-русски естественно передать это порядковым числительным; слово «жребий» подразумевается контекстом, но отсутствует в данном стихе.
- source_word: מַתִּתְיָהוּ
  choice: Маттифия
  rationale: Использована традиционная русская библейская форма имени, соответствующая еврейскому Маттитьяху.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Еврейское слово прямо обозначает сыновей, поэтому родовое значение сохранено.
- source_word: וְאֶחָיו
  choice: и братья
  rationale: Прямой современный эквивалент; более широкое «родственники» неоправданно расширило бы значение.
- source_word: שְׁנֵים עָשָׂר
  choice: всего двенадцать
  rationale: Числительное указывает общее число названной группы. «Всего» естественно проясняет функцию числа, не изменяя содержания.
