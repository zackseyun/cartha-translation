  text: לִ/שְׁנַ֤יִם וְ/עֶשְׂרִים֙ לְ/גִדַּ֔לְתִּי בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/029.yaml
  text: 'For the twenty-second[a], to Giddalti: his sons and his brothers, twelve.'
translation:
  language: ru
  text: 'Двадцать второй[a] — Гиддалти, его сыновья и братья: двенадцать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Двадцать второй жребий — Гиддалти, его сыновья и братья: двенадцать». Еврейский перечень изложен сжато; слово «жребий» подразумевается из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: Двадцать второй
  rationale: В последовательном перечне выражение обозначает двадцать второй жребий; порядковое числительное естественно передаёт смысл, а предлог ל в русском списочном построении отдельно не выражен.
- source_word: לְגִדַּלְתִּי
  choice: Гиддалти
  rationale: Префикс ל указывает, кому достался жребий; тире в сжатой русской формулировке передаёт отношение назначения без добавления отсутствующего в тексте глагола.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Слово обозначает именно сыновей, а не детей вообще.
- source_word: וְאֶחָיו
  choice: и братья
  rationale: Сохранено обычное значение «братья»; местоимение «его» из первой части относится к обоим однородным членам.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Конечное числительное указывает общее число членов группы; именная конструкция с двоеточием сохраняет лаконичность еврейского перечня.
