lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: Третий
  rationale: Определённое порядковое числительное служит элементом последовательного перечня; слово «жребий» подразумевается из контекста, но в этой строке не повторено.
- source_word: זַכּוּר
  choice: Заккур
  rationale: Личное имя передано транслитерацией с удвоенным «к», отражающим геминацию согласного в еврейской форме.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Множественное число בנים с местоименным суффиксом 3-го лица мужского рода прямо означает «его сыновья».
- source_word: וְאֶחָיו
  choice: и братья
  rationale: Форма אחים с суффиксом наиболее прямо означает «его братья»; повторять местоимение в русском не требуется, поскольку принадлежность обоих однородных членов ясна.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать человек
  rationale: Числительное обозначает общую численность группы. Слово «человек» естественно уточняет счёт лиц, не добавляя нового смыслового содержания.
