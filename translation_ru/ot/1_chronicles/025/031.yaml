lexical_decisions:
- source_word: לְאַרְבָּעָה וְעֶשְׂרִים
  choice: двадцать четвёртый
  rationale: Предлог לְ указывает на распределение, а числительное в контексте последовательности жеребьёв имеет порядковое значение. Слово «жребий» подразумевается контекстом, но в основном тексте не добавлено.
- source_word: לְרוֹמַמְתִּי עָזֶר
  choice: Ромамти-Эзеру
  rationale: Личное имя передано транслитерацией; дательный падеж естественно выражает значение предлога לְ и назначение очереди этой группе.
- source_word: בָּנָיו
  choice: его сыновьям
  rationale: Еврейское слово прямо обозначает сыновей; дательный падеж согласован с подразумеваемым распределением.
- source_word: וְאֶחָיו
  choice: и братьям
  rationale: Сохранено основное лексическое значение «братья», хотя в таком перечне оно может шире относиться к родственникам или членам певческой группы.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Количественное числительное указывает на общую численность названной группы.
