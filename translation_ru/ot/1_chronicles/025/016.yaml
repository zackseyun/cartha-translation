  text: הַ/תְּשִׁיעִ֣י מַתַּנְיָ֔הוּ בָּנָ֥י/ו וְ/אֶחָ֖י/ו שְׁנֵ֥ים עָשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/016.yaml
  text: The ninth was Mattanyahu[a], his sons and his brothers, twelve.
translation:
  language: ru
  text: Девятый — Маттаньяху[a], его сыновья и братья — двенадцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Маттаньяху; традиционная русская форма имени — Матфания.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: Девятый
  rationale: Определённое порядковое числительное употреблено эллиптически в перечне жеребьёв и групп; подразумеваемое слово «жребий» не добавляется, чтобы сохранить краткость еврейского текста.
- source_word: מַתַּנְיָהוּ
  choice: Маттаньяху
  rationale: Транслитерация непосредственно передаёт еврейскую форму имени и сохраняет конечный теофорный элемент -я́ху.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Еврейское слово в данном родословно-служебном перечне прямо обозначает сыновей, а не детей вообще.
- source_word: וְאֶחָיו
  choice: и братья
  rationale: Сохранено основное значение «братья»; возможное более широкое значение «сородичи» контекстом не подтверждено настолько явно, чтобы заменять прямой смысл.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Кратко передано общее число названной группы, в соответствии с повторяющейся формулой главы и сжатым стилем оригинала.
