base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: ru
  text: Все они находились под руководством своих отцов в музыкальном служении в доме Яхве[a], играя на кимвалах, арфах и лирах[b], для служения в доме Бога; а Асаф, Идифун и Еман — под руководством царя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога, переданное еврейскими согласными יהוה (ЙХВХ).
    reason: divine_name
  - marker: b
    text: Точное соответствие древних инструментов, переведённых как «арфы» и «лиры», современным инструментам неизвестно.
    reason: cultural_note
  - marker: c
    text: 'Или: «по распоряжению царя». Буквально: «под рукой царя»; этот оборот может обозначать руководство, надзор или действие по чьему-либо распоряжению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה עַל יְדֵי אֲבִיהֶם
  choice: Все они, каждый под руководством своего отца
  rationale: Оборот עַל יְדֵי буквально связан с «рукой», но здесь обозначает руководство или надзор. Единственное число «отца» сохранено в распределительном обороте «каждый… своего отца», поскольку речь идёт о группах сыновей Асафа, Идифуна и Емана.
- source_word: בַּשִּׁיר
  choice: участвовали в пении
  rationale: שִׁיר может обозначать песню, пение или музыкальное исполнение. В контексте храмовых певцов естественнее «пение», без сужения до одной конкретной песни.
- source_word: בֵּית יְהוָה
  choice: в доме Яхве
  rationale: Сохранён образ «дома», а тетраграмматон יְהוָה передан личным именем «Яхве».
- source_word: בִּמְצִלְתַּיִם נְבָלִים וְכִנֹּרוֹת
  choice: играя на кимвалах, арфах и лирах
  rationale: Предлог בְּ имеет инструментальное значение. Различие между двумя видами древних струнных инструментов сохранено традиционными соответствиями «арфы» и «лиры», хотя их точная конструкция неизвестна.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: для служения в доме Бога
  rationale: עֲבֹדָה здесь означает храмовое служение или работу; «служение» естественно передаёт культовый контекст, не привнося более поздней церковной терминологии.
- source_word: עַל יְדֵי הַמֶּלֶךְ אָסָף וִידוּתוּן וְהֵימָן
  choice: Асаф, Идифун и Еман находились под руководством царя
  rationale: Сжатая еврейская конструкция связывает трёх руководителей с царским надзором или распоряжением. В русском порядок перестроен ради ясности, при этом неоднозначность оттенка между непосредственным руководством и царским повелением отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» непосредственно обозначает это имя и отличает его от титула אֲדֹנָי.
- issue: Характер царского участия в храмовом служении
  choice: под руководством царя
  alternative: по распоряжению царя
  rationale: Идиома עַל יְדֵי допускает значение надзора, полномочия или распорядительной власти. Основной текст следует повтору той же идиомы в начале стиха, а альтернативный оттенок сохранён в сноске.
translation_notes:
  register: 'Современный литературный русский, ясный и торжественный без архаизации. Синтаксис перестроен для естественного чтения: распределительное «каждый… своего отца» устраняет ложное впечатление об одном общем отце, а заключительные имена вынесены в позицию подлежащего. Термины храмового служения сохранены без конфессионально окрашенных добавлений.'
