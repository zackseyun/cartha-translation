  source_fidelity: 'Основная смысловая структура передана верно: сыновья находятся под руководством своих отцов, а Асаф, Идифун и Еман — под властью/руководством царя. Однако «каждый под руководством своего отца» излишне утяжеляет фразу, а «участвовали в пении» несколько ослабляет прямую связь с музыкальным служением. Более ясное русское построение может сохранить иерархию, не добавляя смысла.'
