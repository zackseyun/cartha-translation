base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: ru
  text: 'От Идифуна: сыновья Идифуна — Гедалия, Цери, Иешаия, Хашавия и Маттифия, всего шестеро[a], — под руководством своего отца Идифуна, который пророчествовал с лирой, вознося благодарение и хвалу Яхве[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь названы пять сыновей, но затем сказано: «шестеро». Возможно, одно имя было пропущено или в число шести включён сам Идифун.'
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод: «который пророчествовал с лирой для благодарения и хвалы Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: От Идифуна
  rationale: Предлог ל здесь вводит следующий раздел перечня. Формула «От Идифуна» естественна для русского каталожного контекста и не уточняет сверх текста, идёт ли речь о принадлежности или назначении.
- source_word: בְּנֵי יְדוּתוּן
  choice: сыновья Идифуна
  rationale: Сохранено прямое обозначение родства; в контексте оно может также охватывать членов его рода или храмовой музыкальной группы.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: Гедалия, Цери, Исаия, Хашавия и Маттифия
  rationale: Использованы понятные русские библейские формы имён, достаточно близкие к древнееврейскому тексту.
- source_word: שִׁשָּׁה
  choice: всего шестеро
  rationale: Число «шесть» прямо засвидетельствовано масоретским текстом и сохранено, хотя перечислены только пять имён; расхождение отмечено в сноске, а не устранено гармонизацией.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: под руководством своего отца
  rationale: Буквально «под руками своего отца»; в организационном и музыкальном контексте идиома выражает руководство или надзор.
- source_word: בַּכִּנּוֹר
  choice: под звуки лиры
  rationale: כִּנּוֹר обозначает древний струнный инструмент, точнее всего передаваемый словом «лира». Оборот естественно связывает игру на инструменте с пророческим служением.
- source_word: הַנִּבָּא
  choice: который пророчествовал
  rationale: Сохранено обычное значение глагола נבא и его форма мужского рода единственного числа, относящая действие к Идифуну; музыкальное служение не сведено к простому исполнению.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: вознося благодарение и хвалу
  rationale: Переданы оба элемента фразы и их связь с пророчеством через музыку. Поскольку предлог עַל допускает оттенки содержания и цели, альтернативная передача приведена в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», что прозрачно отражает исходный текст и согласуется с консультационным английским слоем.
theological_decisions:
- issue: Значение пророчества в контексте храмовой музыки
  choice: Сохранить в основном тексте «пророчествовал»
  alternative: «исполнял вдохновенную музыку» или «пел пророчески»
  rationale: Летописец прямо применяет пророческую терминологию к храмовым музыкантам. Перевод сохраняет эту богословскую напряжённость, а упоминание лиры, благодарения и хвалы поясняет форму данного служения, не переопределяя его.
- issue: Соотношение пяти перечисленных имён и числа шесть
  choice: Сохранить «шестеро» и отметить расхождение в сноске
  alternative: Добавить отсутствующее имя или считать самого Идифуна без оговорки
  rationale: Исходный масоретский текст содержит реальное несоответствие. Ни одна из предлагаемых гармонизаций не должна без текстового основания вноситься в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис перечня сохранён, но сделан ясным для обычного читателя; архаичные обороты вроде «под рукой отца» устранены. Имена даны в узнаваемых русских библейских формах, а название инструмента уточнено как «лира».
