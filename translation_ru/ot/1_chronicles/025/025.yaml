lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: Восемнадцатый жребий выпал
  rationale: Предлог לְ обозначает отнесение к восемнадцатой позиции в последовательности; слово «жребий» прямо не названо, но ясно подразумевается повторяющейся формулой главы. Глагол «выпал» естественно передаёт по-русски распределение по жребию.
- source_word: לַחֲנָנִי
  choice: Ханани
  rationale: Личное имя передано транслитерацией с еврейского.
- source_word: בָּנָיו
  choice: с его сыновьями
  rationale: Еврейское слово конкретно означает сыновей; предлог «с» введён для естественной русской конструкции, выражающей состав группы.
- source_word: וְאֶחָיו
  choice: и братьями
  rationale: Сохранено прямое семейное значение «братья», без расширения до «родственников» или «соплеменников».
- source_word: שְׁנֵים עָשָׂר
  choice: их было двенадцать
  rationale: Числительное обозначает общую численность Ханани, его сыновей и братьев в данном подразделении; русская предикативная конструкция ясно выражает итоговый счёт.
