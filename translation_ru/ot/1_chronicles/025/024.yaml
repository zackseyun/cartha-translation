  text: Семнадцатый жребий выпал Иошбекаше, его сыновьям и братьям; всего двенадцать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: Семнадцатый
  rationale: Предлог לְ с порядковым числительным в контексте перечня указывает на место при распределении по жребию. Эллиптичность еврейского текста сохранена, а подразумеваемое слово пояснено в сноске.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: Иошбекаше
  rationale: Имя передано транслитерацией; дательный падеж естественно выражает значение לְ — кому досталось семнадцатое назначение.
- source_word: בָּנָיו
  choice: его сыновьям
  rationale: בָּנִים здесь прямо обозначает сыновей; дательный падеж согласован с конструкцией распределения.
- source_word: וְאֶחָיו
  choice: и братьям
  rationale: Прямое значение אֶחִים — «братья»; возможное более широкое значение родичей не подставлено в основной текст.
- source_word: שְׁנֵים עָשָׂר
  choice: всего двенадцать
  rationale: Числительное сообщает общую численность названной группы; «всего» делает краткую списочную формулу ясной по-русски, не добавляя нового содержания.
