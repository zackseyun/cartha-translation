  text: Шестнадцатый[a] — Хананьяху со своими сыновьями и братьями, всего двенадцать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть шестнадцатый жребий. Слово «жребий» подразумевается из контекста, но в еврейском тексте этого стиха не стоит.
    reason: lexical_alternative
  - marker: b
