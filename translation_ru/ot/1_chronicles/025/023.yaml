    reason: literal_rendering
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: Шестнадцатый —
  rationale: Предлог לְ при порядковом числительном обозначает распределение по жребию в последовательности, заданной контекстом. Слово «жребий» в самом стихе отсутствует, поэтому вынесено в примечание.
- source_word: לַחֲנַנְיָהוּ
  choice: Ханании
  rationale: Использована укоренившаяся русская форма библейского имени; дательный падеж передаёт значение назначения, выраженное предлогом לְ.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: בָּנִים здесь обозначает именно сыновей в перечне мужских групп.
- source_word: וְאֶחָיו
  choice: и братья
  rationale: Прямое значение אָח — «брат»; в данном контексте слово может охватывать более широкий круг родственников или собратьев, однако основной текст сохраняет наиболее непосредственное значение.
- source_word: שְׁנֵים עָשָׂר
  choice: всего двенадцать
  rationale: Числительное указывает общее число названной группы. «Всего» естественно выражает эту функцию по-русски, хотя отдельного соответствующего слова в еврейском тексте нет.
