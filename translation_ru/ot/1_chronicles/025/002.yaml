base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: ru
  text: 'Из сыновей Асафа: Заккур, Иосиф, Нефания и Асарела — сыновья Асафа, по указанию Асафа, который пророчествовал по указанию царя.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при руке Асафа» и «при руках царя». Еврейский оборот может обозначать действие по указанию кого-либо, через него или под его надзором.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Из сыновей
  rationale: В контексте перечня предлог לְ вводит подразделение списка; «из сыновей» естественно передаёт эту функцию по-русски.
- source_word: זַכּוּר
  choice: Заккур
  rationale: Транслитерация еврейского личного имени в форме, принятой в русской библейской традиции.
- source_word: יוֹסֵף
  choice: Иосиф
  rationale: Традиционная русская форма еврейского личного имени.
- source_word: נְתַנְיָה
  choice: Нефания
  rationale: Традиционная русская библейская передача личного имени.
- source_word: אֲשַׂרְאֵלָה
  choice: Асарела
  rationale: Передача формы имени, засвидетельствованной в масоретском тексте данного стиха.
- source_word: בְּנֵי אָסָף
  choice: сыновья Асафа
  rationale: 'Повтор сохранён вслед за еврейским текстом: он явно связывает перечисленных людей с родом или группой Асафа.'
- source_word: עַל יַד
  choice: под руководством
  rationale: Еврейский оборот буквально связан с «рукой», но здесь обозначает руководство, надзор или полномочия.
- source_word: הַנִּבָּא
  choice: который пророчествовал
  rationale: Причастие от נבא передано личной формой в относительном придаточном; сохранено прямое указание на пророческую деятельность.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: под руководством царя
  rationale: Повтор того же идиоматического оборота передан параллельно, без сужения смысла до одного лишь приказа.
theological_decisions:
- issue: Значение «пророчествовал» в контексте храмовой музыки
  choice: Сохранить «пророчествовал» в основном тексте.
  alternative: «исполнял вдохновенную музыку» или «пел пророчески»
  rationale: Глагол נבא выражает пророческую деятельность и не должен быть сведён лишь к музыкальному исполнению; контекст связывает её с храмовым служением, не устраняя богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Синтаксический повтор оригинала сохранён, а два случая עַל יַד переданы одинаково ради параллелизма. Маркер сноски поставлен после всего предложения, поскольку поясняет оба употребления оборота.
