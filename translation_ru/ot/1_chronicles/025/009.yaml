base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: ru
  text: 'Первый жребий выпал Асафу, Иосифу[a]; второй — Гедалии: он, его братья и сыновья — всего двенадцать человек.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Асафу, Иосифу». В стихе 2 Иосиф назван среди сыновей Асафа.'
    reason: Уточняет контекст двух имён, не разрешая в основном тексте сжатую синтаксическую связь оригинала.
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: жребий выпал
  rationale: В контексте жеребьёвки это естественное современное русское соответствие буквальному «жребий вышел»; оно сохраняет образ случайного распределения.
- source_word: הָרִאשׁוֹן
  choice: первый
  rationale: Порядковое числительное обозначает первое назначение по жребию.
- source_word: לְאָסָף לְיוֹסֵף
  choice: Асафу — Иосифу
  rationale: Оба предложных оборота сохранены. Тире передаёт, что Иосиф назван в связи с Асафом, но не устраняет краткость и синтаксическую неоднозначность еврейского текста.
- source_word: גְּדַלְיָהוּ
  choice: Гедалии
  rationale: Использована закрепившаяся в русском библейском именослове форма имени; падеж обусловлен подразумеваемым глаголом «выпал».
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Обозначает второе назначение по жребию; пропущенный глагол естественно восстанавливается из первой части стиха.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: он, его братья и сыновья
  rationale: Личное местоимение сохранено как часть перечисления, а «сыновья» передаёт мужской род בנים без обобщения до «детей».
- source_word: שְׁנֵים עָשָׂר
  choice: всего двенадцать человек
  rationale: Число относится ко всей названной группе. Слова «всего» и «человек» делают эллиптическую еврейскую конструкцию ясной и естественной по-русски, не меняя её смысла.
theological_decisions:
- issue: Соотношение имён Асафа и Иосифа
  choice: Сохранить оба имени и связать их пояснительным тире
  alternative: 'Передать только Иосифа как получателя первого жребия либо развернуть: «из потомков Асафа — Иосифу»'
  rationale: В еврейском тексте дважды стоит предлог לְ, а точное синтаксическое соотношение имён выражено сжато. Перевод не должен без необходимости превращать эту связь в явно родословную или административную формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством реестрового повествования. Сохранена лаконичная параллельная структура двух назначений; во второй части опущенный глагол передан тире.
