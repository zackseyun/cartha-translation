- source_word: הַשִּׁשִּׁי
  choice: шестой
  rationale: Определённое порядковое числительное употреблено эллиптически в перечне жребиев. Краткая форма сохраняет структуру еврейского текста, а подразумеваемое слово «жребий» поясняется в сноске.
- source_word: בֻקִּיָּהוּ
  choice: Буккия
  rationale: Имя передано традиционной русской библейской транслитерацией, соответствующей еврейской форме.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Еврейское слово прямо обозначает сыновей; притяжательный суффикс передан местоимением «его».
- source_word: וְאֶחָיו
  choice: и братья
  rationale: Сохранено основное значение «братья». В данном перечне слово может охватывать близких родственников или собратьев по служению, однако контекст не требует конкретизировать это в основном тексте.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Числительное обозначает общее число названной группы. Безглагольная конструкция передаёт лаконичность еврейского перечня.
