lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: восьмой
  rationale: Определённое порядковое числительное употреблено в перечне жребиев. Контекст подразумевает «жребий», но в самом стихе этого слова нет, поэтому основной текст сохраняет краткую форму.
- source_word: יְשַׁעְיָהוּ
  choice: Исаия
  rationale: Личное имя передано в принятой русской библейской форме; его следует отличать по контексту от пророка Исаии.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Слово בנים здесь прямо обозначает сыновей, а не детей вообще.
- source_word: וְאֶחָיו
  choice: и братья
  rationale: אחים естественно передаётся как «братья»; контекст не требует более широкого значения «родственники» или «соплеменники».
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Числительное указывает общую численность группы. Глагол в еврейском отсутствует, поэтому сохранена лаконичная именная конструкция.
