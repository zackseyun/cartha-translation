source:
  edition: WLC
  text: לְ/הֵימָ֑ן בְּנֵ֣י הֵימָ֡ן בֻּקִּיָּ֡הוּ מַתַּנְיָ֡הוּ עֻ֠זִּיאֵל שְׁבוּאֵ֨ל וִֽ/ירִימ֜וֹת חֲנַנְיָ֣ה חֲנָ֗נִי אֱלִיאָ֤תָה גִדַּ֨לְתִּי֙ וְ/רֹמַ֣מְתִּי עֶ֔זֶר יָשְׁבְּקָ֣שָׁה מַלּ֔וֹתִי הוֹתִ֖יר מַחֲזִיאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: ru
  text: 'Для Емана — сыновья Емана: Буккия[a], Маттания, Уззиил, Шевуил[c] и Иеримоф[b], Ханания, Ханани, Элиата, Гиддалти и Ромамти-Эзер, Иошбекаша, Маллофи, Хофир, Махазиоф.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые толкователи полагают, что часть этого перечня можно прочитать не только как имена, но и как фразу, особенно в районе имён «Гиддалти» и «Ромамти-Эзер». Здесь, согласно контексту, они переданы как личные имена.
    reason: alternative_reading
  - marker: b
    text: Имя «Иеримоф» также передают как «Иеремоф».
    reason: lexical_alternative
  - marker: c
    text: Имя «Шевуил» также передают как «Шуваил».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/הֵימָן
  choice: Для Емана
  rationale: Предлог לְ в контексте перечня обозначает отнесение этой группы к Еману; «для Емана» естественно передаёт распределительную структуру главы.
- source_word: בְּנֵי הֵימָן
  choice: сыновья Емана
  rationale: בְּנֵי прямо означает «сыновья» и здесь вводит перечень названных потомков Емана.
- source_word: בֻּקִּיָּהוּ
  choice: Буккия
  rationale: Русская транслитерация личного имени с передачей конечного теофорного элемента в привычной форме -ия.
- source_word: מַתַּנְיָהוּ
  choice: Маттания
  rationale: Русская транслитерация личного имени с сохранением удвоенного согласного и традиционной передачи окончания.
- source_word: עֻזִּיאֵל
  choice: Уззиил
  rationale: Форма близко передаёт еврейское имя и его удвоенный согласный.
- source_word: שְׁבוּאֵל
  choice: Шевуил
  rationale: Передаёт масоретскую огласовку שְׁבוּאֵל; вариант «Шуваил» отмечен в сноске.
- source_word: וִירִימוֹת
  choice: и Иеримоф
  rationale: Союз וְ передан явно; имя транслитерировано по еврейской форме, причём конечное ת передано как «ф» в соответствии с устойчивой русской библейской традицией.
- source_word: חֲנַנְיָה
  choice: Ханания
  rationale: Прямая и понятная русская транслитерация личного имени.
- source_word: חֲנָנִי
  choice: Ханани
  rationale: Прямая русская транслитерация личного имени.
- source_word: אֱלִיאָתָה
  choice: Элиата
  rationale: Транслитерация сохраняет звуковой облик еврейского имени без искусственного придыхательного окончания.
- source_word: גִדַּלְתִּי
  choice: Гиддалти
  rationale: Хотя форма может совпадать с глагольным выражением, синтаксис перечня поддерживает понимание её как личного имени.
- source_word: וְרֹמַמְתִּי עֶזֶר
  choice: и Ромамти-Эзер
  rationale: В контексте списка сочетание понято как составное личное имя; дефис показывает его единство, а союз передан явно.
- source_word: יָשְׁבְּקָשָׁה
  choice: Иошбекаша
  rationale: Транслитерация масоретской формы имени в удобочитаемой русской записи.
- source_word: מַלּוֹתִי
  choice: Маллофи
  rationale: Транслитерация имени с традиционной русской передачей конечного ת как «ф».
- source_word: הוֹתִיר
  choice: Хофир
  rationale: Транслитерация личного имени с передачей начального ה как «х» и ת как «ф» по русской библейской традиции.
- source_word: מַחֲזִיאוֹת
  choice: Махазиоф
  rationale: Транслитерация личного имени с традиционной передачей конечного ת как «ф».
theological_decisions:
- issue: Следует ли понимать часть последовательности как осмысленную фразу, а не только как личные имена
  choice: Вся последовательность после слов «сыновья Емана» передана как список личных имён.
  alternative: Некоторые формы, особенно Гиддалти и Ромамти-Эзер, можно связывать во фразу наподобие «я возвеличил и превознёс помощь».
  rationale: Ближайший контекст представляет собой перечень служителей и сыновей; поэтому чтение всех единиц как имён лучше сохраняет явную литературную функцию стиха, не исключая отмеченной в сноске игры смыслов.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского перечня. Двоеточие после вводной конструкции заменено тире для естественного русского синтаксиса; имена переданы последовательно и без архаических служебных слов.
