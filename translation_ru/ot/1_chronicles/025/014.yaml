  text: Седьмой жребий выпал Иесареле; его сыновей и братьев было двенадцать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: Седьмой жребий
  rationale: Порядковое числительное употреблено самостоятельно в перечне распределения по жребию; добавление слова «жребий» естественно выражает подразумеваемое из контекста существительное.
- source_word: יְשַׂרְאֵלָה
  choice: Иесареле
  rationale: Личное имя передано принятой русской библейской транслитерацией и поставлено в дательный падеж в соответствии с добавленной формулой «выпал».
- source_word: בָּנָיו
  choice: с сыновьями его
  rationale: Сохранено конкретное значение «сыновья», а не более широкое «дети».
- source_word: וְאֶחָיו
  choice: и братьями его
  rationale: Сохранено основное значение существительного «братья»; возможное более широкое групповое значение не подставлено в основной текст.
- source_word: שְׁנֵים עָשָׂר
  choice: их было двенадцать
  rationale: Числительное обозначает общую численность группы; личная конструкция по-русски ясно передаёт итоговый счёт.
- source_word: '[подразумеваемая формула распределения жребия]'
  choice: жребий выпал
  rationale: Глагола в данной краткой строке нет, но формула однозначно восстанавливается по окружающему перечню; примечание делает это добавление прозрачным.
