  text: Четвёртый[a] — для Ицри, его сыновей и братьев; всего двенадцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом контекста, более полно: «Четвёртый жребий выпал Ицри». Слово «жребий» подразумевается из окружающего перечня, но в этом стихе не употреблено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Четвёртый
  rationale: Порядковое числительное употреблено эллиптически в перечне назначений по жребию. Краткая форма сохраняет структуру еврейского текста; подразумеваемый «жребий» пояснён в сноске.
- source_word: לַיִּצְרִי
  choice: Ицри
  rationale: Предлог ל обозначает адресата назначения; в русском контексте перечня это естественно передаётся конструкцией с тире без отдельного «для» или «Ицри достался».
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Еврейское слово прямо означает сыновей, а не детей вообще.
- source_word: וְאֶחָיו
  choice: и братья
  rationale: Основное значение — родные или более широко близкие по родству мужчины; прямой перевод «братья» сохраняет возможную широту контекста без её уточнения.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Числительное указывает общее число участников группы; именная конструкция с тире естественна по-русски и сохраняет лаконичность списка.
