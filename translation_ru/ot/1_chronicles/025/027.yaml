  text: Двадцатый жребий достался Элиате; его сыновья и братья — двенадцать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֶשְׂרִים
  choice: для двадцатого
  rationale: Предлог לְ передаёт назначение, а עֶשְׂרִים в последовательности этой главы обозначает двадцатое место. Слово «жребий» подразумевается, но в данном стихе прямо не выражено.
- source_word: לֶאֱלִיָּתָה
  choice: Элиата
  rationale: Имя передано транслитерацией с еврейского; предлог ל включён в конструкцию назначения «для двадцатого», поэтому имя дано как приложение.
- source_word: בָּנָיו
  choice: его сыновья
  rationale: Форма множественного числа בֵּן с суффиксом третьего лица единственного числа мужского рода обозначает его сыновей.
- source_word: וְאֶחָיו
  choice: и братья
  rationale: Сохранено обычное родственное значение слова אָח; расширительное «родственники» контекстом не требуется.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Числительное указывает общее число участников группы; сохранён краткий безглагольный стиль перечня.
