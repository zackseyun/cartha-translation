    text: 'Или: «Двадцать третий жребий — Махазиоту». Предлог в еврейском тексте может указывать на назначение в последовательности жребиев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה וְעֶשְׂרִים
  choice: Двадцать третий
  rationale: В перечне жребиев числовое выражение идиоматически обозначает порядковый номер. Предлог ל указывает на назначение жребия; по-русски это естественно передаётся структурой именного списка.
- source_word: לְמַחֲזִיאוֹת
  choice: Махазиоту
  rationale: Личное имя передано транслитерацией и поставлено в дательный падеж, поскольку ל обозначает того, кому назначен двадцать третий жребий.
- source_word: בָּנָיו
  choice: с его сыновьями
  rationale: Еврейское слово прямо означает сыновей. Предлог «с» добавлен по нормам русского языка, чтобы ясно выразить состав группы, насчитывающей двенадцать человек.
- source_word: וְאֶחָיו
  choice: и братьями
  rationale: В контексте списка музыкальных служителей речь идёт о братьях/собратьях; основной текст сохраняет прямое значение «братья», не расширяя его до «родственников».
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Числительное обозначает общую численность группы, связанной с Махазиотом.
