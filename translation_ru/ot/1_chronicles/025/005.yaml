  rationale: Исправление уточняет, что Еман является провидцем царя, а не просто «царским» прозорливцем, и заменяет неестественную кальку «в словах Бога» современной русской формулировкой, которая по-прежнему оставляет отношение к Божьим словам неопределённым. Остальные элементы, включая метафору рога, целевое «чтобы» и числовые данные, сохранены.
