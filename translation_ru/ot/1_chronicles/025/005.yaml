  text: כָּל אֵ֨לֶּה בָנִ֜ים לְ/הֵימָ֗ן חֹזֵ֥ה הַ/מֶּ֛לֶךְ בְּ/דִבְרֵ֥י הָ/אֱלֹהִ֖ים לְ/הָרִ֣ים קָ֑רֶן וַ/יִּתֵּ֨ן הָ/אֱלֹהִ֜ים לְ/הֵימָ֗ן בָּנִ֛ים אַרְבָּעָ֥ה עָשָׂ֖ר וּ/בָנ֥וֹת שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: ru
  text: Все они — сыновья Емана, провидца царя, в связи с Божьими словами[a], чтобы вознести рог[b]. Бог дал Еману четырнадцать сыновей и трёх дочерей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «провидца царя в делах Бога» или «провидца царя посредством Божьих слов». Еврейское выражение сжато и может описывать связь служения Емана с Божьим откровением.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «поднять рог». В еврейском языке рог служит образным обозначением силы, чести или возвышенного положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֵה
  choice: прозорливец
  rationale: Передаёт человека, получающего откровение, и сохраняет придворно-пророческий оттенок слова, не отождествляя его без необходимости с более широким обозначением «пророк».
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: в словах Бога
  rationale: 'Близко следует сжатой еврейской конструкции и не устраняет её неоднозначность: речь может идти о сфере Божьего откровения, о делах Бога или о средстве, посредством которого Еман исполнял своё служение.'
- source_word: לְהָרִים קָרֶן
  choice: чтобы вознести рог
  rationale: Сохраняет целевую конструкцию и библейскую метафору возвышения силы, чести или положения, не уточняя без основания, чей именно рог имеется в виду.
- source_word: קָרֶן
  choice: рог
  rationale: Образ рога как символа силы и достоинства оставлен в основном тексте, а не заменён одним из возможных толкований.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: Бог дал Еману
  rationale: Естественная русская конструкция точно выражает дарование Богом потомства Еману.
- source_word: בָנִים ... וּבָנוֹת
  choice: сыновей ... дочерей
  rationale: Прямо сохраняет проведённое в еврейском тексте различие между сыновьями и дочерьми.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественное русское указание на всех ранее перечисленных лиц.
theological_decisions:
- issue: Смысл выражения «царский прозорливец в словах Бога»
  choice: Еман представлен как прозорливец царя, чьё служение связано с Божьими словами и откровением.
  alternative: «царский прозорливец в делах Бога» или «царский прозорливец посредством слов Бога»
  rationale: Еврейский предлог и существительное допускают несколько отношений; буквальная, несколько сжатая формулировка вместе со сноской сохраняет эту открытость.
- issue: Смысл выражения «вознести рог»
  choice: Сохранить метафору возвышения силы, чести или положения.
  alternative: «возвысить силу» или «оказать честь»
  rationale: Исходный текст не сводит образ к одному отвлечённому значению и прямо не называет обладателя рога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Термин «прозорливец» выбран как понятное, хотя и книжное обозначение носителя откровения. Необычная формулировка «в словах Бога» намеренно сохраняет сжатость и неоднозначность оригинала; сноска поясняет возможные связи.
