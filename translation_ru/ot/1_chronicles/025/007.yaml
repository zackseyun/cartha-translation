base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: ru
  text: Число их вместе с их братьями — всех, обученных петь Яхве[a] и искусных[b], — составляло двести восемьдесят восемь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обученных петь для Яхве». Еврейский предлог здесь может указывать как на адресата пения, так и на цель музыкального служения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всех понимающих», то есть сведущих, умелых в музыкальном служении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם עִם אֲחֵיהֶם
  choice: общее число их и их братьев
  rationale: מִסְפָּרָם обозначает их подсчитанное число, а עִם — совместность. Русская конструкция «общее число их и их братьев» естественно передаёт совокупный подсчёт, не меняя состава группы.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: обученных петь
  rationale: Страдательное причастие от למד указывает на обучение, а שִׁיר в данном контексте — на пение. Глагольная конструкция звучит по-русски естественнее, чем буквальное «обученных песне».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל при глагольном понятии пения может указывать на адресата или цель. В основном тексте выбрано «петь Яхве», а вариант цели отмечен в сноске.
- source_word: כָּל הַמֵּבִין
  choice: всех искусных
  rationale: Причастие בין буквально связано с пониманием и разумением, но здесь в контексте организованного музыкального служения обозначает умение и компетентность. Краткое «искусных» сохраняет эту контекстуальную силу.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: двести восемьдесят восемь
  rationale: Еврейская последовательность числительных однозначно обозначает 288; число записано словами в соответствии с библейским стилем.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон יהוה. Передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение לַיהוָה при пении
  choice: петь Яхве
  alternative: петь для Яхве
  rationale: Предлог ל допускает понимание Яхве как адресата пения и как того, ради кого совершается служение. Основной текст передаёт адресата, а сноска сохраняет целевую возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис слегка перестроен ради ясного выражения общего числа, при этом состав группы и обе лексические неоднозначности сохранены.
