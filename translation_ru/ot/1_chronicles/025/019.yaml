  text: Двенадцатый жребий — Хашавии, его сыновьям и братьям; всего двенадцать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: двенадцатый
  rationale: 'Хотя форма буквально обозначает число «двенадцать», в последовательном перечне жребиев она идиоматически выполняет функцию порядкового числительного: «двенадцатый».'
- source_word: לַחֲשַׁבְיָה
  choice: Хашавии
  rationale: Предлог ל обозначает того, кому выпал или был назначен жребий; русская дательная форма естественно передаёт это отношение в эллиптической структуре списка.
- source_word: חֲשַׁבְיָה
  choice: Хашавия
  rationale: Личное имя передано русской транслитерацией с сохранением конечного элемента -ия; в тексте употреблена требуемая дательная форма «Хашавии».
- source_word: בָּנָיו
  choice: его сыновьям
  rationale: בנים здесь обозначает сыновей; дательный падеж согласован с подразумеваемым назначением жребия всей группе.
- source_word: וְאֶחָיו
  choice: и братьям
  rationale: Сохранено основное значение אחים — «братья»; более широкое «родственники» контекстом не требуется.
- source_word: שְׁנֵים עָשָׂר
  choice: всего двенадцать
  rationale: Заключительное число указывает общую численность назначенной группы; слово «всего» делает функцию числа ясной по-русски, не добавляя нового содержания.
