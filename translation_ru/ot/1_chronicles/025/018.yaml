lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: двенадцатый
  rationale: В перечне жребиев количественное числительное по контексту обозначает порядковый номер очередной группы; по-русски это естественно передаётся порядковым числительным.
- source_word: עֲזַרְאֵל
  choice: Азарел
  rationale: Личное имя транслитерировано, а не переведено; вариант «Азарел» близко передаёт еврейскую форму и естественно выглядит в современном русском тексте.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Еврейское слово прямо обозначает сыновей; форма родительного падежа обусловлена эллиптической конструкцией подсчёта в русском языке.
- source_word: וְאֶחָיו
  choice: и братьев
  rationale: Сохранено прямое значение «братья», хотя в данном организационном перечне слово потенциально может охватывать близких родственников или соплеменников.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Итоговое числительное указывает общую численность группы; подразумеваемая связка естественно опускается, как и в еврейском тексте.
