lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: Пятнадцатый
  rationale: В повторяющейся формуле распределения по жребию выражение имеет порядковое значение. Слово «жребий» подразумевается контекстом главы, но в данном стихе по-еврейски не выражено, поэтому в основной текст не добавлено.
- source_word: לִירֵמוֹת
  choice: Иеремофу
  rationale: Предлог ל обозначает назначение или принадлежность при распределении. Форма имени передана в соответствии с принятой русской библейской традицией.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Еврейское слово прямо означает сыновей, а не детей вообще.
- source_word: וְאֶחָיו
  choice: и братьев
  rationale: Наиболее прямое значение — «его братья»; в данном организационно-родовом контексте слово может также охватывать близких родственников или соплеменников, но это не уточняется в основном тексте.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Числительное обозначает общее число сыновей и братьев, связанных с Иеремофом.
