  yaml_path: translation/ot/1_chronicles/025/020.yaml
  text: The thirteenth[a], Shubael; his sons and his brothers, twelve.
translation:
  language: ru
  text: Тринадцатый[a] — Шуваэл; его сыновей и братьев — двенадцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «На тринадцатый — Шуваэл». Из контекста подразумевается слово «жребий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: Тринадцатый
  rationale: Предлог לְ указывает на назначение тринадцатого жребия; в кратком перечне естественно передать порядковым числительным, не добавляя в основной текст отсутствующее в стихе слово «жребий».
- source_word: שׁוּבָאֵל
  choice: Шуваэл
  rationale: Имя передано транслитерацией с еврейского; сочетание ב между гласными отражено как «в».
- source_word: בָּנָיו
  choice: его сыновей
  rationale: בָּנִים здесь обозначает именно сыновей, а не детей вообще; родительный падеж естественно сочетается с подразумеваемым исчислением в русском перечне.
- source_word: וְאֶחָיו
  choice: и братьев
  rationale: Сохранено прямое значение «братья» без сужения или расширения до родственников либо соратников.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Число обозначает состав группы, связанной с Шуваэлом; эллиптическая конструкция исходного текста сохранена в естественной русской форме.
