base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: ru
  text: 'Давид и военачальники выделили для служения сыновей[a] Асафа, Емана и Идифуна, пророчествовавших, играя на лирах, арфах и кимвалах[b]. Число людей, исполнявших работу в этом служении, было следующим:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «сыновья» здесь может означать также потомков или членов родовых объединений Асафа, Емана и Идифуна, а не только их непосредственных сыновей.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «пророков с лирами, арфами и кимвалами». Еврейское выражение допускает понимание Асафа, Емана и Идифуна как названных здесь пророками.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: отделили
  rationale: Каузативная форма בדל означает «отделить, выделить». Здесь речь идёт о выделении людей для особого храмового служения, без добавления идеи формального посвящения, прямо не выраженной в тексте.
- source_word: שָׂרֵי הַצָּבָא
  choice: военачальники
  rationale: Передаёт руководителей войска естественным современным русским словом и сохраняет военное значение צָבָא.
- source_word: לַעֲבֹדָה
  choice: для служения
  rationale: В храмовом контексте עֲבֹדָה обозначает организованное служение; этот вариант сохраняет культовый оттенок и остаётся понятным современному читателю.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: сыновей Асафа, Емана и Идифуна
  rationale: Сохраняется конкретный образ еврейского выражения; при этом сноска отмечает, что בְּנֵי может охватывать потомков или членов соответствующих родов и объединений.
- source_word: הנביאים
  choice: пророчествовавших
  rationale: Контекстуально форма описывает пророческую деятельность названных служителей. Причастие естественно связывает её с музыкальным служением, не устраняя возможности понимать выражение как обозначение их роли.
- source_word: בְּכִנֹּרוֹת
  choice: под звуки лир
  rationale: כִּנּוֹר — древний струнный инструмент, обычно передаваемый как «лира». Оборот «под звуки» по-русски естественно вводит весь перечень инструментов.
- source_word: בִּנְבָלִים
  choice: арф
  rationale: נֵבֶל обозначает струнный инструмент, отличный от כִּנּוֹר; традиционное и доступное соответствие «арфа» сохраняет это различие.
- source_word: וּבִמְצִלְתָּיִם
  choice: и кимвалов
  rationale: מְצִלְתַּיִם — парные ударные металлические инструменты; «кимвалы» является точным и устойчивым библейским наименованием в русском языке.
- source_word: וַיְהִי מִסְפָּרָם
  choice: 'Число ... было следующим:'
  rationale: Фраза вводит перечисление в дальнейших стихах; двоеточие сохраняет её направленность вперёд.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: людей, исполнявших свою работу в этом служении
  rationale: Передаёт и идею порученной работы, и сферу служения, не добавляя не выраженного прямо значения профессионального мастерства.
theological_decisions:
- issue: Следует ли понимать הנביאים как обозначение «пророков» или как описание совершаемого ими пророчества
  choice: «пророчествовавших» — описание пророческой деятельности в сопровождении инструментов
  alternative: «пророков с лирами, арфами и кимвалами» — наименование роли в приложении к Асафу, Еману и Идифуну
  rationale: Причастная передача естественна по-русски и сохраняет прямую связь пророчества с музыкальным служением. Сноска удерживает возможное именное прочтение и не определяет сверх текста характер этого пророчества.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Синтаксис сделан ясным для обычного читателя; сохранены традиционные формы имён и наименование «кимвалы». Двоеточие показывает, что стих непосредственно вводит последующее перечисление.
