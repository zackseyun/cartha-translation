  text: Пятый — Нефания[a]; его сыновей и братьев — двенадцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом контекста: «Пятый жребий выпал Нефании; его сыновей и братьев было двенадцать». В еврейском тексте слова «жребий» и «выпал» отсутствуют и подразумеваются из окружающего перечня.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Пятый
  rationale: Определённое порядковое числительное употреблено эллиптически в перечне жребиев и групп. Основной текст сохраняет краткость еврейского оригинала, не добавляя прямо не выраженные слова «жребий» или «выпал».
- source_word: נְתַנְיָהוּ
  choice: Нафания
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Форма множественного числа בֵּן с суффиксом 3-го лица мужского рода означает здесь именно сыновей.
- source_word: וְאֶחָיו
  choice: и братьев
  rationale: Обычное значение множественного числа אָח в формуле этого перечня — «братья»; более широкое «родственники» контекстом не требуется.
- source_word: שְׁנֵים עָשָׂר
  choice: было двенадцать
  rationale: Числительное указывает на общее число сыновей и братьев; связка «было» добавлена для естественного русского синтаксиса.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая реестровая формула оригинала сохранена, а двоеточие-подобное пояснительное отношение передано тире и точкой с запятой. Форма «сыновей и братьев было двенадцать» естественно обозначает совокупное число.
