base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/017.yaml
  text: the tenth[a], Shimei; his sons and his brothers, twelve.
translation:
  language: ru
  text: десятый[a] — Шимей; его сыновей и братьев — двенадцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более полно по контексту: «десятый жребий выпал Шимею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: десятый
  rationale: Определённое порядковое числительное продолжает последовательность жребиев в ближайшем контексте. По-русски достаточно «десятый», поскольку подразумеваемый жребий ясен из контекста.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בָּנָיו
  choice: его сыновей
  rationale: בנים здесь означает именно сыновей; форма родительного падежа обусловлена итоговым количеством «двенадцать».
- source_word: וְאֶחָיו
  choice: и братьев
  rationale: Прямое значение אחים с местоименным суффиксом — «его братья». Более широкие возможные значения, такие как родственники или члены рода, в основной текст не привносятся.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцать
  rationale: Числительное обозначает общее число сыновей и братьев Шимея, как и в повторяющейся формуле этой главы.
