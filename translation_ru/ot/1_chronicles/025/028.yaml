  text: for the twenty-first[a], Hothir; his sons and his brothers, twelve.
translation:
  language: ru
  text: Двадцать первый[a] — Гофиру, его сыновьям и братьям; всего двенадцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один и двадцать». Еврейская формулировка отражает последовательность жребиев в этой главе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: Двадцать первый
  rationale: Оборот обозначает порядковый номер жребия в последовательности главы. Предлог לְ указывает на назначение; слово «жребий» ясно из контекста, но в данном стихе прямо не выражено, поэтому в основной текст не добавлено.
- source_word: לְ/הוֹתִיר
  choice: Гофиру
  rationale: Личное имя הוֹתִיר передано принятой русской библейской формой «Гофир»; дательный падеж сохраняет значение префикса לְ и естественно продолжает эллиптическую формулу распределения жребиев.
- source_word: בָּנָיו
  choice: его сыновьям
  rationale: בָּנִים здесь означает именно сыновей. Дательный падеж согласован с распределением жребия всей названной группе.
- source_word: וְאֶחָיו
  choice: и братьям
  rationale: Сохранено прямое значение «братья», без расширительного толкования «родственники» или «соплеменники».
- source_word: שְׁנֵים עָשָׂר
  choice: всего двенадцать
  rationale: Число указывает общую численность группы. Слово «всего» естественно проясняет счёт, не меняя содержания.
theological_decisions: []
