source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י בֶּן צְרוּיָ֗ה הִכָּ֤ה אֶת אֱדוֹם֙ בְּ/גֵ֣יא הַמֶּ֔לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/012.yaml
  text: And Abishai son of Zeruiah struck down eighteen thousand Edomites in the Valley of Salt[a].
translation:
  language: ru
  text: Авесса, сын Саруи, поразил восемнадцать тысяч эдомитян[a] в Соляной долине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Эдом»; по контексту речь идёт о людях Эдома, то есть эдомитянах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשַׁי
  choice: Авесса
  rationale: Союз ו здесь связывает сообщение с предыдущим повествованием, однако в русском отдельном стихе его можно естественно не передавать. Имя дано в традиционной русской библейской форме.
- source_word: בֶּן צְרוּיָה
  choice: сын Саруи
  rationale: Прямо передаёт родственное указание и сохраняет традиционную русскую форму имени.
- source_word: הִכָּה
  choice: поразил
  rationale: Глагол נכה в военном контексте означает «поразить, разгромить»; «поразил» сохраняет силу исходного слова, не уточняя сверх текста, лично ли Авесса убил каждого или возглавлял сражение.
- source_word: אֶת אֱדוֹם
  choice: эдомитян
  rationale: Хотя буквально стоит название «Эдом», сочетание с военным глаголом и числом указывает на людей Эдома, а не на территорию.
- source_word: בְּ/גֵיא הַמֶּלַח
  choice: в Соляной долине
  rationale: Естественная русская передача топонима со значением «долина соли».
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: восемнадцать тысяч
  rationale: Числительное передано словами в соответствии с литературным стилем библейского текста.
theological_decisions:
- issue: 'Объект «Эдом»: народ или территория'
  choice: народ Эдома («эдомитяне»)
  alternative: территория Эдома
  rationale: Военный глагол в сочетании с числом восемнадцать тысяч убедительно указывает на людей. Это контекстуально-лексическое, а не конфессиональное решение.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского повествования. Использованы привычные русскому читателю формы имён и краткий синтаксис исторического сообщения.
