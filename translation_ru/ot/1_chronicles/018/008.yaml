base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: ru
  text: Из Тивхата и Куна, городов Ададезера, Давид взял чрезвычайно много бронзы. Из неё Соломон сделал бронзовое море, столбы и бронзовые изделия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В данном контексте обозначает медь или медный сплав; традиционное и естественное русское название храмовых предметов — «бронза».
- source_word: בָּהּ
  choice: из неё
  rationale: Местоимение относится к ранее упомянутой бронзе и указывает на материал, из которого были изготовлены предметы.
- source_word: יָם הַנְּחֹשֶׁת
  choice: бронзовое море
  rationale: Сохраняет образное название большого храмового резервуара и связь с материалом изготовления.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: бронзовые изделия
  rationale: כְּלֵי может обозначать сосуды, утварь или предметы вообще; «изделия» не сужает значение без достаточных оснований.
