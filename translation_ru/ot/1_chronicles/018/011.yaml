source:
  edition: WLC
  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: ru
  text: 'Царь Давид также посвятил их[a] Яхве — вместе с серебром и золотом, которые он захватил[b] у всех народов: у эдомитян, моавитян, аммонитян[c], филистимлян и амаликитян.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть бронзовые изделия, упомянутые в предыдущем стихе.
    reason: cross_reference
  - marker: b
    text: 'Или: «унёс» либо «взял». Еврейский глагол буквально связан с поднятием и перенесением, а здесь означает взятие добычи или дани у покорённых народов.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сыновей Аммона», то есть аммонитян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: также … их
  rationale: Передаёт продолжение мысли предыдущего стиха и сохраняет местоименную отсылку к упомянутым там бронзовым изделиям.
- source_word: הִקְדִּישׁ
  choice: посвятил
  rationale: Естественно передаёт отделение ценностей для священного употребления без избыточного конфессионального оттенка.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, стоящее в еврейском тексте.
- source_word: עִם הַכֶּסֶף וְהַזָּהָב
  choice: вместе с серебром и золотом
  rationale: Ясно связывает предметы из предыдущего стиха с перечисляемыми драгоценными металлами.
- source_word: אֲשֶׁר נָשָׂא
  choice: которые он захватил
  rationale: В военно-политическом контексте глагол обозначает изъятие и унесение добычи или дани; «захватил» естественно выражает этот смысл.
- source_word: מִכָּל הַגּוֹיִם
  choice: у всех народов
  rationale: Предлог «у» естественно сочетается по-русски с получением или захватом имущества у перечисленных народов.
- source_word: מֵאֱדוֹם וּמִמּוֹאָב וּמִבְּנֵי עַמּוֹן וּמִפְּלִשְׁתִּים וּמֵעֲמָלֵק
  choice: у эдомитян, моавитян, аммонитян, филистимлян и амаликитян
  rationale: Современные русские этнонимы делают однородное перечисление народов ясным; «аммонитяне» идиоматично передаёт буквальное «сыны Аммона».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Порядок слов немного перестроен ради естественности; тире обозначает пояснительное присоединение. Этнонимы даны в современной форме и со строчной буквы.
