  text: וַ/יִּקַּ֣ח דָּוִ֗יד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ עַ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: ru
  text: Давид взял золотые щиты[a], которые были у слуг[b] Хададезера[c], и принёс их в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «щиты из золота». Возможно, имеются в виду щиты, покрытые золотом.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «слуги» — вероятно, царские приближённые или военные сопровождающие Хададезера, а не обязательно домашние рабы в узком современном понимании.
    reason: cultural_note
  - marker: c
    text: В некоторых текстовых традициях и в параллельном повествовании во 2 Царств имя передаётся в форме «Хададрезер».
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение לקח — «взять». Военный контекст подразумевает захват добычи, однако нейтральное «взял» не добавляет к исходному тексту лишней конкретизации.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: золотые щиты
  rationale: שִׁלְטֵי обозначает щиты, возможно щиты сравнительно небольшого размера. Естественное русское сочетание «золотые щиты» передаёт конструкцию с הַזָּהָב, не решая однозначно, были ли они изготовлены из золота или покрыты им.
- source_word: אֲשֶׁר הָיוּ עַל
  choice: которые были у
  rationale: Буквально оборот означает «которые были на». Русское «были у» естественно выражает связь щитов с людьми и сохраняет возможность того, что они носили или держали эти щиты, не превращая предположение в явное утверждение.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: слуг Хададезера
  rationale: עֲבָדִים обычно означает «слуги», но при царском дворе и в военной обстановке может обозначать приближённых, должностных лиц или воинов. Основной текст сохраняет широкое значение слова, а примечание поясняет культурный контекст.
- source_word: הֲדַדְעָזֶר
  choice: Хададезер
  rationale: Передаёт масоретскую форму имени в данном стихе и сохраняет различие между элементами Хадад и эзер без опоры на традиционную форму, возникшую через иную передачу имени.
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: и принёс их в Иерусалим
  rationale: Порода хифиль глагола בוא означает «принести, привести». Поскольку дополнением служат щиты, естественный русский глагол — «принёс»; местоименный суффикс передан словом «их».
