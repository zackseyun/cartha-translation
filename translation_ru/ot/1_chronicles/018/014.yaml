base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: ru
  text: И Давид царствовал над всем Израилем и осуществлял правосудие и праведность[a] по отношению ко всему своему народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суд и праведность». Еврейская пара обозначает как справедливое судебное управление, так и правоту в действиях правителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: царствовал
  rationale: Форма глагола מלך обозначает царское правление; «царствовал» естественно звучит в историческом повествовании и не предполагает лишь момент восшествия на престол.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Предлог עַל при מלך указывает на область царской власти; перевод сохраняет полноту охвата.
- source_word: וַיְהִי עֹשֶׂה
  choice: обеспечивал
  rationale: Сочетание היה с причастием выражает постоянную, обычную деятельность. В контексте царского управления «обеспечивал» естественно передаёт длительное осуществление названных принципов.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В контексте царского управления слово обозначает справедливый судебно-правовой порядок; «правосудие» сохраняет юридический оттенок и отличает его от следующего понятия.
- source_word: וּצְדָקָה
  choice: справедливость
  rationale: צְדָקָה обозначает праведность, правоту и соответствие должному. В паре с מִשְׁפָּט слово «справедливость» естественно передаёт нравственную сторону правильного правления.
- source_word: לְכָל עַמּוֹ
  choice: всему своему народу
  rationale: Предлог לְ указывает здесь на тех, кому служило справедливое правление Давида; притяжательное местоимение передаёт суффикс третьего лица.
theological_decisions:
- issue: Передача царской этической пары מִשְׁפָּט וּצְדָקָה
  choice: правосудие и справедливость
  alternative: суд и праведность
  rationale: Выбранная пара сохраняет различие между юридически справедливым управлением и нравственной правотой, не сводя оба еврейских понятия к одному. Более буквальная формулировка приведена в примечании, чтобы сохранить традиционную и богословски значимую двусоставность выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Формулировка «обеспечивал всему своему народу» естественно выражает постоянный характер царского управления; ключевая еврейская пара сохранена двумя различимыми существительными.
