  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛יד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֛ח אֶת גַּ֥ת וּ/בְנֹתֶ֖י/הָ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: ru
  text: После этого Давид поразил филистимлян и покорил их. Он взял из рук филистимлян Геф и зависевшие от него селения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его дочерей» — так назывались небольшие поселения, зависевшие от главного города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт повествовательный переход и временную последовательность, не воспроизводя буквально древнееврейскую формулу «и было».
- source_word: וַיַּךְ
  choice: поразил
  rationale: Сохраняет конкретное значение глагола נכה в военном контексте; последующий глагол отдельно выражает подчинение противника.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Устоявшееся русское название этого народа.
- source_word: וַיַּכְנִיעֵם
  choice: покорил их
  rationale: Каузативная форма כנע означает привести к покорности, подчинить; русский вариант краток и уместен в военно-политическом контексте.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Передаёт широкое значение לקח и в данном контексте ясно обозначает овладение городом и зависимыми поселениями.
- source_word: גַּת
  choice: Геф
  rationale: Устоявшаяся русская библейская форма названия филистимского города.
- source_word: וּבְנֹתֶיהָ
  choice: зависевшие от него селения
  rationale: Буквально «его дочери» — древнееврейское обозначение меньших поселений, административно зависевших от главного города. Выбор передаёт не только близость, но и зависимое положение.
- source_word: מִיַּד
  choice: из рук
  rationale: Сохраняет понятный по-русски образ древнееврейской идиомы, обозначающей власть или владение.
