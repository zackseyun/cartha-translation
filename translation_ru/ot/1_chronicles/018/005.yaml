lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: арамеи из Дамаска
  rationale: אֲרַם может обозначать Арам или арамеев; в данном контексте глагол во множественном по смыслу и последующее число павших естественно указывают на войско/народ. «Арамеи» сохраняет древнее этническое обозначение и не подменяет его более поздним «сирийцы».
- source_word: לַעְזוֹר
  choice: на помощь
  rationale: Естественная русская передача инфинитива עזר в военном контексте.
- source_word: הֲדַדְעֶזֶר
  choice: Хададезеру
  rationale: Передаёт написание имени в данном стихе; вариант «Хадарезер» относится к параллельным местам.
- source_word: מֶלֶךְ צוֹבָה
  choice: царю Цовы
  rationale: Прямая и естественная передача титула и географического названия.
- source_word: וַיַּךְ
  choice: поразил
  rationale: נכה в военном контексте допускает значения «поразить», «разбить», «убить»; «поразил» сохраняет широту значения, тогда как указанное число ясно сообщает о масштабах потерь.
- source_word: בַּאֲרָם
  choice: арамеев
  rationale: Русская конструкция с прямым дополнением естественно передаёт этнический референт אֲרָם в контексте подсчёта поражённых людей.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: двадцать две тысячи
  rationale: Число передано точно; существительное «арамеев» одновременно выражает אִישׁ по смыслу и избегает тяжеловесного «двадцать две тысячи человек из арамеев».
