source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: ru
  text: И Давид разместил гарнизоны[a] в Дамасском Араме, и арамеи[b] стали слугами Давида, принося ему дань. И Яхве даровал Давиду победу[c] повсюду, куда он ходил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поставил» или «поместил»; слово «гарнизоны» подразумевается из военного контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское название — «Арам»; традиционный вариант: «Сирия», а «арамеи» — «сирийцы».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «спас Давида», «избавил Давида»; в контексте военных походов — «даровал победу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: разместил гарнизоны
  rationale: Глагол שׂוּם буквально означает «поместил, поставил»; прямое дополнение в еврейском тексте не выражено. Военный контекст и параллельное повествование указывают на гарнизоны, поэтому подразумеваемый объект введён в основной текст и отмечен сноской.
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: в Дамасском Араме
  rationale: Так передаётся сочетание названия области/народа Арам с Дамаском без сведения всего выражения лишь к городу Дамаску.
- source_word: אֲרָם
  choice: арамеи
  rationale: В данном контексте название относится к народу, покорившемуся Давиду. «Арамеи» точнее передаёт еврейский этноним, чем традиционное «сирийцы».
- source_word: עֲבָדִים
  choice: слугами
  rationale: В политическом контексте слово обозначает зависимое, вассальное положение. «Слугами» сохраняет основное лексическое значение, не уточняя его как рабство или подданство.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: принося ему дань
  rationale: Причастная конструкция описывает регулярное принесение дара подвластным народом правителю; в этом контексте מִנְחָה естественно передать как «дань».
- source_word: וַיּוֹשַׁע
  choice: даровал Давиду победу
  rationale: Порода хифиль от יָשַׁע означает «спас, избавил»; в повествовании о военных походах выражение указывает на дарованный Богом успех. Сноска сохраняет более буквальные варианты.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога, представленное тетраграмматоном, передано транслитерацией «Яхве», а не заменено титулом.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: повсюду, куда он ходил
  rationale: Русская формулировка естественно передаёт широкий смысл еврейской идиомы, не сужая его исключительно до военных маршей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога, поэтому оно сохраняется как имя, а не заменяется титулом.
- issue: Значение וַיּוֹשַׁע в военном контексте
  choice: даровал Давиду победу
  alternative: спас Давида; избавил Давида
  rationale: Контекст поддерживает значение военного успеха, но глагол сохраняет смысл спасения или избавления; эта смысловая напряжённость отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис остаётся ясным для широкого читателя; этноним «арамеи» и географическое обозначение «Дамасский Арам» сохраняют историческую конкретность оригинала.
