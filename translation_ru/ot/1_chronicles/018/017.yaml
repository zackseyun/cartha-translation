  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: ru
  text: А Ванея, сын Иодая, начальствовал над керетеями и пелетеями, а сыновья Давида были первыми[a] при царе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главными сановниками». Буквально: «первыми»; вероятно, имеется в виду их высокий ранг при дворе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у руки царя» — то есть рядом с ним, в непосредственном служении ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: начальствовал над
  rationale: В административно-военном контексте предлог указывает на власть или руководство; глагольная передача естественна по-русски и не уточняет без основания конкретную должность.
- source_word: הַכְּרֵתִי
  choice: керефеями
  rationale: Название группы передано традиционной русской библейской транслитерацией, без истолкования её происхождения или функции.
- source_word: הַפְּלֵתִי
  choice: пелефеями
  rationale: Название группы транслитерировано в традиционной русской библейской форме.
- source_word: הָרִאשֹׁנִים
  choice: первыми
  rationale: 'Буквальная передача сохраняет неоднозначность: речь может идти о первенстве по рангу либо о должности высших придворных.'
- source_word: לְיַד הַמֶּלֶךְ
  choice: при царе
  rationale: Естественное русское выражение передаёт близость к царю и придворное служение, не сводя оборот только к физическому местонахождению.
- source_word: וּבְנֵי דָוִיד
  choice: сыновья Давида
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Ванея, сын Иодая
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён, понятные читателю и соответствующие именному выражению оригинала.
