    text: 'Или: «секретарём», «ведавшим записями». Еврейское слово обозначает царского чиновника, который хранил записи и докладывал царю о делах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Иоав
  rationale: Начальный союз не выражен отдельно, чтобы по-русски естественно продолжить перечень должностных лиц; имя передано в принятой библейской форме.
- source_word: בֶּן צְרוּיָה
  choice: сын Саруи
  rationale: Стандартная конструкция родства передана прямо; использована традиционная русская форма имени.
- source_word: עַל הַ/צָּבָא
  choice: начальствовал над войском
  rationale: Предлог עַל при должностном лице обозначает власть над определённой сферой. Формулировка сохраняет структуру и смысл еврейского текста, не уточняя должность как «военачальник» сверх сказанного.
- source_word: וִ/יהוֹשָׁפָט
  choice: а Иосафат
  rationale: Союз передан как «а», естественно связывающее две параллельные записи перечня без смыслового противопоставления; имя дано в принятой русской форме.
- source_word: בֶּן אֲחִיל֖וּד
  choice: сын Ахилуда
  rationale: Стандартное указание на отца передано прямо, с традиционной русской формой имени.
- source_word: מַזְכִּיר
  choice: летописцем
  rationale: В царском административном контексте слово обозначает чиновника, связанного с записями и представлением дел царю. «Летописец» — понятный традиционный эквивалент, однако точный круг обязанностей остаётся не вполне определённым, что отмечено в сноске.
