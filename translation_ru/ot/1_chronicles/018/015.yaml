  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: ru
  text: Иоав, сын Саруи, начальствовал над войском, а Иосафат, сын Ахилуда, был летописцем[a].
  philosophy: optimal-equivalence
  footnotes:
