base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: ru
  text: Давид захватил у него тысячу колесниц, семь тысяч всадников[a] и двадцать тысяч пеших воинов. Затем Давид перерезал сухожилия у всех колесничных коней[b], оставив коней лишь для ста колесниц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Во 2 Царств 8:4 в параллельном месте указано «тысяча семьсот всадников», а не «семь тысяч всадников». Это числовое расхождение между параллельными местами в текстовой традиции.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «всё колесничное войско» или «все колесницы». Поскольку глагол означает перерезание сухожилий, выражение метонимически относится к коням колесничного войска.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: Глагол לכד обозначает захват в военном контексте; «захватил» точно и естественно передаёт смысл.
- source_word: מִמֶּנּוּ
  choice: у него
  rationale: Местоименный суффикс стоит в единственном числе и отсылает к Адраазару из предшествующего контекста.
- source_word: אֶלֶף רֶכֶב
  choice: тысячу колесниц
  rationale: רכב может обозначать колесничное войско собирательно, но при числительном естественно понимается как исчисляемые колесницы.
- source_word: פָּרָשִׁים
  choice: всадников
  rationale: Слово обозначает конных воинов; «всадники» — ясный и близкий к источнику современный эквивалент.
- source_word: אִישׁ רַגְלִי
  choice: пеших воинов
  rationale: Буквально «пеший человек»; выбранное выражение сохраняет конкретный военный смысл и звучит естественно по-русски.
- source_word: וַיְעַקֵּר
  choice: перерезал сухожилия
  rationale: В данном военном контексте עקר означает вывести лошадей из строя перерезанием сухожилий; выражение понятно современному читателю и конкретнее общего «искалечил».
- source_word: אֶת כָּל הָרֶכֶב
  choice: у всех колесничных коней
  rationale: Буквально речь идёт обо «всём колесничном войске/всех колесницах», но действие глагола относится к лошадям; метонимия раскрыта в основном тексте.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: оставив коней лишь для ста колесниц
  rationale: Фраза указывает на сохранённую часть колесничной силы, соответствующую ста колесницам; добавление «коней» ясно связывает её с предшествующим действием.
