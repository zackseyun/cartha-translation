  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: ru
  text: И поразил он Моав, и моавитяне стали рабами Давида, принося ему дань.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стали слугами Давида, принося ему дар». Еврейские слова могут иметь более общее значение, но в контексте завоевания «рабы» и «дань» яснее передают подчинение и обязательный платёж зависимого народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה буквально означает нанесение удара и в данном повествовании обозначает военное поражение; «поразил» сохраняет конкретность еврейского выражения, не заменяя его более толковательным «победил».
- source_word: מוֹאָב
  choice: Моав / моавитяне
  rationale: В первом случае название обозначает страну или народ как объект военного действия; во втором по-русски естественно назвать жителей — «моавитяне», поскольку именно они становятся подчинёнными Давиду.
- source_word: וַיִּהְיוּ
  choice: стали
  rationale: 'В повествовательной последовательности היה с именной частью сказуемого имеет начинательное значение: после поражения моавитяне «стали» рабами Давида.'
- source_word: עֲבָדִים
  choice: рабами
  rationale: עבד может обозначать как раба, так и слугу. После завоевания и при обязательной выплате дани слово подчёркивает принудительное подчинение; «рабами» сохраняет силу исходного выражения, не сводя его к нейтральной государственной терминологии.
- source_word: לְדָוִיד
  choice: Давида
  rationale: В сочетании «стали рабами Давида» русский родительный падеж естественно передаёт отношение подчинения, выраженное предлогом לְ.
- source_word: נֹשְׂאֵי
  choice: принося
  rationale: Причастие נשׂא буквально означает «несущие»; в сочетании с данью естественное русское выражение — «принося дань».
- source_word: מִנְחָה
  choice: дань
  rationale: В военно-политическом контексте מִנְחָה означает дар или платёж, который подчинённый народ доставляет победителю; «дань» точно передаёт это контекстуальное значение.
theological_decisions:
- issue: Характер подчинения моавитян
  choice: рабы Давида
  alternative: слуги Давида / подданные Давида
  rationale: Еврейское עֲבָדִים допускает диапазон от слуг до рабов. Контекст завоевания и выплаты дани делает жёсткое значение уместным, однако примечание сохраняет более широкую лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и торжественной повествовательной формы. Местоимение «он» оставлено в соответствии с еврейским текстом и связью с предыдущим стихом; добавленное «ему» делает по-русски ясной направленность дани и не изменяет смысла.
