base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: ru
  text: Давид поразил Гададезера, царя Цовы в направлении Хамата[a], когда Гададезер шёл утвердить свою власть[b] у реки Евфрат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте, 2 Царств 8:3, имя имеет другое написание, обычно передаваемое как «Гадарезер».
    reason: textual_variant
  - marker: b
    text: 'Или: «восстановить свой контроль»; буквально: «поставить свою руку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה буквально означает «ударить, поразить» и в данном контексте описывает военное действие, не усиливая смысл до полного разгрома.
- source_word: הֲדַדְעֶזֶר
  choice: Гададезер
  rationale: Передаёт написание имени именно в масоретском тексте 1 Пар 18:3; отличное написание в параллельном месте отмечено в сноске.
- source_word: מֶלֶךְ צוֹבָה
  choice: царь Цовы
  rationale: Прямая передача сопряжённой конструкции с современным русским склонением топонима.
- source_word: חֲמָתָה
  choice: на пути к Хамату
  rationale: Направительный суффикс -ה указывает движение к Хамату; формулировка естественно выражает направление и не превращает его безоговорочно в место действия.
- source_word: בְּלֶכְתּוֹ
  choice: когда тот шёл
  rationale: Инфинитивная конструкция с בְּ выражает сопутствующее время. Указательное «тот» естественно относит местоименный суффикс к ближайшему участнику — Гададезеру.
- source_word: לְהַצִּיב יָדוֹ
  choice: утвердить свою власть
  rationale: Буквально «поставить/утвердить свою руку»; в военно-политическом контексте рука обозначает власть или контроль.
- source_word: בִּנְהַר פְּרָת
  choice: у реки Евфрат
  rationale: Передаёт как общее слово נָהָר, так и собственное имя Пְּרָת; предлог «у» естественен для территориальной привязки.
