  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲבִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וְ/שַׁוְשָׁ֖א סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/016.yaml
  text: Zadok son of Ahitub and Abimelech son of Abiathar were priests[a], and Shavsha was secretary.
translation:
  language: ru
  text: Садок, сын Ахитува, и Авимелех, сын Авиафара, были священниками[a], а Шавша — писцом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном месте, 2 Царств 8:17, стоит «Ахимелех, сын Авиафара», а не «Авимелех, сын Авиафара». Здесь перевод следует еврейскому тексту Паралипоменона.
    reason: textual_variant
lexical_decisions:
- source_word: צָדוֹק
  choice: Садок
  rationale: Традиционная русская библейская передача личного имени.
- source_word: בֶּן
  choice: сын
  rationale: В перечне должностных лиц слово естественнее всего обозначает непосредственное сыновство.
- source_word: אֲחִיטוּב
  choice: Ахитув
  rationale: Традиционная русская библейская передача личного имени.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелех
  rationale: Перевод следует еврейскому тексту Паралипоменона, где стоит אֲבִימֶלֶךְ, не исправляя его по параллельному месту.
- source_word: אֶבְיָתָר
  choice: Авиафар
  rationale: Традиционная русская библейская передача личного имени.
- source_word: כֹּהֲנִים
  choice: священниками
  rationale: Основное значение слова и контекст священнических родов указывают на культовое служение.
- source_word: שַׁוְשָׁא
  choice: Шавша
  rationale: Имя передано по масоретской форме в Паралипоменоне.
- source_word: סוֹפֵר
  choice: писцом
  rationale: В царской администрации слово обозначает грамотного должностного лица, ведавшего письменными делами; «писец» сохраняет связь с исходным термином и не чрезмерно уточняет круг его обязанностей.
