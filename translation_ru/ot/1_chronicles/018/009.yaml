  text: וַ/יִּשְׁמַ֕ע תֹּ֖עוּ מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔יד אֶת כָּל חֵ֖יל הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/009.yaml
  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: ru
  text: Когда Тоу, царь Хамата, услышал, что Давид разгромил всё войско Хадад-Эзера, царя Цовы,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь «Тоу»; в параллельном рассказе, во 2 Царств 8:9, — «Тои».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Когда ... услышал
  rationale: Форма с повествовательным וַ вводит обстоятельственную завязку, продолжение которой следует в следующем стихе; временная конструкция естественно передаёт эту связь по-русски.
- source_word: תֹּעוּ
  choice: Тоу
  rationale: Имя транслитерировано по форме масоретского текста Паралипоменона; отличающаяся форма в параллельном месте отмечена в сноске.
- source_word: מֶלֶךְ חֲמָת
  choice: царь Хамата
  rationale: Конструкция принадлежности прямо обозначает царский титул и владение Тоу.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного.
- source_word: הִכָּה
  choice: разгромил
  rationale: В военном контексте נכה обозначает нанесение сокрушительного поражения; «разгромил» ясно и естественно передаёт результат, не утверждая непременно гибель каждого воина.
- source_word: כָּל
  choice: всё
  rationale: Сохранён явно выраженный полный охват.
- source_word: חֵיל
  choice: войско
  rationale: В данном военном контексте слово обозначает вооружённые силы; «войско» соответствует литературному библейскому повествованию и остаётся понятным современному читателю.
- source_word: הֲדַדְעֶזֶר
  choice: Хадад-Эзер
  rationale: Имя передано близко к еврейской форме הֲדַדְעֶזֶר с сохранением различимых компонентов сложного имени.
- source_word: מֶלֶךְ צוֹבָה
  choice: царь Цовы
  rationale: Прямая передача титула и топонима; «Цова» соответствует еврейскому צוֹבָה и принятой русской библейской традиции.
