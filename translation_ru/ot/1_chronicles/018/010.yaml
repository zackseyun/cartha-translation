source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אֶת הֲדֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִיד ל/שאול ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עוּ הָיָ֣ה הֲדַדְעָ֑זֶר וְ/כֹ֗ל כְּלֵ֛י זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: ru
  text: И послал он своего сына Гадорама к царю Давиду, чтобы узнать о его благополучии и благословить[a] его за то, что тот сразился с Гададезером и поразил его, ведь Гададезер воевал с Тоу. Он послал также всевозможные изделия из золота, серебра и бронзы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и поздравить его». В этой дипломатической обстановке глагол «благословить» может выражать поздравление с победой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально еврейский текст заканчивается словами: «а также всевозможные изделия из золота, серебра и бронзы». Глагол «послал» повторён по смыслу из начала стиха.'
    reason: supplied_word
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал он
  rationale: Последовательная повествовательная форма продолжает рассказ; порядок слов сохраняет связность с предшествующим контекстом и не вводит названного субъекта, которого нет в самом стихе.
- source_word: הֲדוֹרָם בְּנוֹ
  choice: своего сына Гадорама
  rationale: Аппозиция естественно передана по-русски, а имя транслитерировано как «Гадорам».
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: чтобы узнать о его благополучии
  rationale: Еврейская идиома буквально связана с вопросом о «мире/благополучии»; выбранная формулировка ясно выражает справление о состоянии Давида.
- source_word: וּלְבָרֲכוֹ
  choice: и благословить его
  rationale: Сохранено основное значение глагола ברך. Дипломатический контекст допускает смысл поздравления, отмеченный в сноске без устранения более буквального значения.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: за то, что тот сразился с Гададезером и поразил его
  rationale: Местоимение «тот» естественно указывает на Давида. «Поразил» передаёт военную победу, не утверждая непременно, что Гададезер был убит.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: ведь Гададезер воевал с Тоу
  rationale: Буквальная идиома «был человеком войн с Тоу» передаётся естественной русской формой, обозначающей состояние войны между ними.
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: Он послал также всевозможные изделия из золота, серебра и бронзы
  rationale: כְּלֵי имеет широкое значение предметов или изделий, а נְחֹשֶׁת в древнем контексте естественно передаётся как «бронза». Глагол повторён по смыслу из начала предложения для ясности русского текста; это отмечено в сноске.
