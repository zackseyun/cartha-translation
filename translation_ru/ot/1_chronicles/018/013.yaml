  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: ru
  text: Он поставил в Эдоме гарнизоны, и все эдомитяне стали рабами Давида. И Господь даровал Давиду победу, куда бы он ни шёл.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצִיבִים
  choice: наместников
  rationale: В данном контексте речь, вероятнее всего, о поставленных представителях оккупационной власти; это значение естественнее русского «гарнизоны», хотя еврейское слово допускает понимание как военных постов или гарнизонов.
- source_word: עֲבָדִים
  choice: подданными
  rationale: Слово буквально обозначает рабов или слуг, но в политико-военном контексте описывает покорённый народ, обязанный служить Давиду; «подданные» передаёт коллективный вассальный статус без неуместного утверждения о личном рабстве каждого эдомитянина.
- source_word: וַיּוֹשַׁע
  choice: даровал ... победу
  rationale: Буквально «спасал/давал избавление»; в рассказе о военных походах идиоматически означает, что Господь обеспечивал Давиду победу.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона в библейском тексте.
theological_decisions:
- issue: Божественное действие в успехах Давида
  choice: Господь даровал Давиду победу
  alternative: Господь спасал Давида
  rationale: Сохраняется прямое приписывание успеха Господу, а контекстуальное значение глагола выражено естественным русским оборотом без ослабления богословского утверждения.
- issue: Статус покорённого Эдома
  choice: все эдомитяне стали подданными Давида
  alternative: весь Эдом стал рабами Давида
  rationale: Коллективная политическая зависимость передана без догматизации вопроса о форме принудительной службы; множественное согласование отражает людей, подразумеваемых названием страны.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис краткий и ясный; сохранено начальное «И» во второй фразе как отражение еврейской повествовательной связи.
