    rationale: Такое чтение возможно в отдельных контекстах, но здесь военное повествование и параллель 2 Царств 8:14 поддерживают значение «гарнизоны»; «наместники» неоправданно конкретизирует характер поставленных сил.
  - severity: medium
    issue: «Подданными» для עֲבָדִים
    rationale: «Подданные» обозначает политическую принадлежность правителю, но не передаёт прямо лексику служения/рабства в исходном тексте и заметно смягчает её.
  revised_text: Он поставил в Эдоме гарнизоны, и все эдомитяне стали рабами Давида. И Господь даровал Давиду победу, куда бы он ни шёл.
