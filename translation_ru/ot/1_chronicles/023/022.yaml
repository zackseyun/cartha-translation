  text: וַ/יָּ֨מָת֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וַ/יִּשָּׂא֥וּ/ם בְּנֵי קִ֖ישׁ אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: ru
  text: Елеазар умер, и сыновей у него не было, а были только дочери. Сыновья Киша — их братья[a] — женились на них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «братья» может означать близких родственников по роду, а не родных братьев.
    reason: cultural_note
  - marker: b
    text: 'Букв.: «взяли их [себе в жёны]».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямое и нейтральное соответствие глаголу מות без эвфемизма.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Традиционная русская передача библейского личного имени.
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: сыновей у него не было
  rationale: На фоне последующего упоминания дочерей בָּנִים обозначает именно сыновей, а не детей вообще; русская конструкция естественно передаёт еврейский оборот обладания.
- source_word: כִּי אִם בָּנוֹת
  choice: а были только дочери
  rationale: Оборот כִּי אִם выражает исключение и противопоставление; выбранная формулировка ясна и естественна по-русски.
- source_word: וַיִּשָּׂאוּם
  choice: женились на них
  rationale: В данном контексте נשׂא с женщинами в качестве объекта означает вступление с ними в брак. Перевод передаёт смысл естественным современным русским языком; более буквальный образ сохранён в сноске.
- source_word: בְּנֵי קִישׁ
  choice: сыновья Киша
  rationale: Формальная передача еврейской сопряжённой конструкции, уместная в родословном контексте Паралипоменон.
- source_word: אֲחֵיהֶם
  choice: их братья
  rationale: Перевод сохраняет буквальное значение существительного אָח и не заменяет его истолковывающим словом «родственники»; возможный более широкий родовой смысл пояснён в сноске.
