  text: וּ/בְנֵ֣י שִׁמְעִ֔י יַ֣חַת זִינָ֔א וִ/יע֖וּשׁ וּ/בְרִיעָ֑ה אֵ֥לֶּה בְנֵי שִׁמְעִ֖י אַרְבָּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: ru
  text: 'И сыновья Шимея: Иахат, Зина[a], Иеуш и Берия. Это сыновья Шимея — четверо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В следующем стихе это имя дано в форме «Зиза»; здесь в еврейском тексте — «Зина».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעִי
  choice: И сыновья Шимея
  rationale: Союз ו передан как простая связь с предшествующим перечнем; בְנֵי в родословном контексте естественно передаётся словом «сыновья» и при необходимости может охватывать потомков или представителей рода.
- source_word: יַחַת
  choice: Иахат
  rationale: Личное имя передано принятой в русской библейской традиции транслитерацией.
- source_word: זִינָא
  choice: Зина
  rationale: Основной текст следует огласованной еврейской форме זִינָא. Отличающаяся форма в следующем стихе отмечена в сноске, а не внесена в основной текст.
- source_word: וִיעוּשׁ
  choice: Иеуш
  rationale: Личное имя передано традиционной русской библейской формой; prefixed ו выражен союзом внутри перечисления по нормам русского языка.
- source_word: וּבְרִיעָה
  choice: и Берия
  rationale: Имя транслитерировано в традиционной русской форме, а союз передан явно для естественного завершения списка.
- source_word: אֵלֶּה בְנֵי שִׁמְעִי
  choice: Это сыновья Шимея
  rationale: Сохранены указательное слово и повтор существительного, передающие итоговый, возобновляющий характер еврейской фразы. Настоящее время естественно выражено русским именным предложением без связки.
- source_word: אַרְבָּעָה
  choice: четверо
  rationale: Для счёта лиц мужского пола русское собирательное числительное «четверо» звучит естественно и точно подводит итог списку.
