id: 1CH.23.28
reference: 1 Chronicles 23:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: ru
  text: Ведь их обязанность[a] состояла в том, чтобы помогать[b] сынам Аарона в служении в доме Яхве, отвечая за дворы и помещения, за очищение всего святого[c] и за работу по служению в доме Божьем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенным им местом служения»; возможно также: «их должностью».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «быть у руки сынов Аарона», то есть служить рядом с ними и помогать им.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «за очищение каждой святыни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительную связь со сказанным ранее и естественно вводит обоснование обязанностей левитов.
- source_word: מַעֲמָדָם
  choice: их обязанностью
  rationale: В данном административно-храмовом контексте слово обозначает назначенное положение или круг обязанностей; выбран функционально ясный русский эквивалент.
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: помогать сынам Аарона
  rationale: Буквально «при руке сынов Аарона»; идиома указывает на вспомогательное служение рядом с ними, не требуя более сильного утверждения о подчинении.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: в служении при доме Яхве
  rationale: Сохраняет храмовый смысл עֲבֹדָה и связь служения с домом Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, представленное тетраграмматоном.
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: отвечать за дворы и помещения
  rationale: עַל вводит сферы порученной ответственности; «помещения» естественно обозначает храмовые комнаты без излишней архитектурной конкретизации.
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: за очищение всего святого
  rationale: Сохраняет широкое коллективное значение קֹדֶשׁ и не уточняет, идёт ли речь только о предметах.
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: за исполнение работ служения в доме Божьем
  rationale: Передаёт сочетание «работа/дело служения» естественным русским оборотом, сохраняя оба смысловых компонента.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблено собственное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Отношение левитов к сынам Аарона в выражении לְיַד
  choice: помогать сынам Аарона
  alternative: быть при сынах Аарона; находиться под руководством сынов Аарона
  rationale: Выбранный вариант ясно выражает вспомогательную роль, но не усиливает идиому до недвусмысленного утверждения о формальной иерархии.
- issue: Объём значения כָּל־קֹדֶשׁ
  choice: всё святое
  alternative: всякая святыня; все священные предметы
  rationale: Коллективное и несколько неопределённое выражение оригинала сохранено без ограничения только материальными предметами.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; административно-храмовый характер перечня сохранён. Слово «дом» не капитализировано как часть обычного словосочетания, тогда как «Божьем» оформлено по современной русской религиозной орфографической традиции.
