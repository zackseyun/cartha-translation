review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: речь идёт о потомках Левия, классифицированных по родовым домам, внесённых в учёт по именам и по отдельности, и о возрастном пороге в двадцать лет для работы, связанной со служением в доме Яхве. Однако «поголовно» в современном русском прежде всего означает «все без исключения» и неудачно передаёт переписную идиому «по головам».'
  naturalness: «Учтённые поимённо, поголовно» звучит тяжеловесно и семантически дублируется; кроме того, «по служению при доме» менее естественно, чем «для служения в доме» в данном храмовом контексте. Перестройка фразы делает перечисление понятным, сохраняя его официально-переписной характер.
  terminology: «Родовые дома», «главы родов» и «Яхве» приемлемы. «Потомки Левия» естественнее, чем «сыновья Левия», поскольку далее речь идёт о родовых подразделениях. «Служение в доме Яхве» не сужает עֲבֹדָה до одного вида культовой деятельности.
  issues:
  - severity: medium
    issue: Слово «поголовно» неточно передаёт לְגֻלְגְּלֹתָם.
    rationale: Еврейская идиома означает индивидуальный подсчёт («по головам», то есть каждого отдельно). Русское «поголовно» обычно значит «все без исключения» и может не передать именно способ учёта.
  - severity: low
    issue: «Учтённые поимённо, поголовно» неестественно и избыточно.
    rationale: Оба наречия поставлены без ясного различения функций еврейских переписных формул. Формулировка «перечисленные поимённо, каждый в отдельности» передаёт обе.
  - severity: low
    issue: «По служению при доме Яхве» стилистически менее точно.
    rationale: Конструкция может означать службу лишь около здания, тогда как בֵּית יְהוָה обозначает храм как сферу служения. «Для служения в доме Яхве» естественнее и ближе к исходной связи слов.
  revised_text: Вот потомки Левия по своим родовым домам — главы родов, перечисленные поимённо, каждый в отдельности[a], исполнявшие работу для служения в доме Яхве, — от двадцати лет и старше.
