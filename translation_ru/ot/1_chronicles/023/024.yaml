  text: אֵ֣לֶּה בְנֵֽי לֵוִי֩ לְ/בֵ֨ית אֲבֹתֵי/הֶ֜ם רָאשֵׁ֧י הָ/אָב֣וֹת לִ/פְקוּדֵי/הֶ֗ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם עֹשֵׂה֙ הַ/מְּלָאכָ֔ה לַ/עֲבֹדַ֖ת בֵּ֣ית יְהוָ֑ה מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: ru
  text: Вот потомки Левия по своим родовым домам — главы родов, перечисленные поимённо, каждый в отдельности[a], исполнявшие работу для служения в доме Яхве, — от двадцати лет и старше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «по головам»; это переписная формула, означающая, что каждого учитывали отдельно.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: по своим родовым домам
  rationale: Выражение обозначает распределение по наследственным семейно-родовым подразделениям Израиля. «Родовые дома» точнее, чем просто «роды», и понятнее современному читателю, чем буквальное «дома отцов».
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главы родов
  rationale: Буквально «главы отцов»; в данном контексте имеются в виду руководители родовых объединений. Перевод передаёт функцию без архаичного оборота.
- source_word: לִפְקוּדֵיהֶם בְּמִסְפַּר שֵׁמוֹת
  choice: учтённые поимённо
  rationale: Оборот относится к переписи или реестру, в котором каждый человек был учтён по имени. Сжатая русская формулировка естественно передаёт обе части еврейского выражения.
- source_word: לְגֻלְגְּלֹתָם
  choice: поголовно
  rationale: Буквально «по их черепам/головам» — идиома индивидуального подсчёта. Русское «поголовно» сохраняет образ головы и значение подсчёта каждого человека.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: исполнявшие работу
  rationale: Причастие единственного числа употреблено собирательно по отношению к перечисляемым левитам; в русском согласование во множественном числе необходимо.
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: по служению при доме Яхве
  rationale: עֲבֹדָה охватывает практические и культовые обязанности, связанные с храмом. Предлог «при» естественно указывает на служение, совершаемое в связи с домом Яхве, не сужая его до богослужебного обряда.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: от двадцати лет и старше
  rationale: Естественный современный русский способ обозначить нижний возрастной предел допуска к служению.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Перечень переписных формул слегка уплотнён ради ясности, при этом сохранены поимённый и индивидуальный характер учёта. Маркер сноски поставлен непосредственно после слова «поголовно», к которому относится пояснение.
