  rationale: 'Исправлены неестественное и потенциально двусмысленное «поголовно» и менее удачная конструкция «по служению при доме». Перевод сохраняет последовательность еврейских элементов: родовые дома, главы родов, поимённый индивидуальный учёт, работа для храмового служения и возраст от двадцати лет.'
