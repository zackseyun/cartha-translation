lexical_decisions:
- source_word: לַגֵּרְשֻׁנִּי
  choice: Из потомков Гирсона
  rationale: Форма с לְ выполняет здесь рубрикационную функцию и вводит подразделение левитов. В русском генеалогическом контексте естественно передать её как «Из потомков Гирсона», не превращая обозначение рода в имя одного человека.
- source_word: לַעְדָּן
  choice: Лаадан
  rationale: Личное имя транслитерировано с сохранением двух гласных, отражённых масоретской огласовкой; это также позволяет отличить его от возможного русского прочтения «Ладан» как нарицательного слова.
- source_word: וְשִׁמְעִי
  choice: и Шимей
  rationale: Союз וְ передан обычным русским «и», а личное имя שִׁמְעִי — традиционной и узнаваемой формой «Шимей».
