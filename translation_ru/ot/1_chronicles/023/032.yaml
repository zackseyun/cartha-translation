base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: ru
  text: Они должны были исполнять обязанности, связанные с шатром встречи, обязанности, связанные со святыней[a], и обязанности по отношению к сынам Аарона, своим братьям, — для служения в доме Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святым местом»; еврейское слово может обозначать как священное место, так и святыню в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: они должны были исполнять
  rationale: Глагол שׁמר в сочетании с מִשְׁמֶרֶת обозначает соблюдение порученной обязанности. Модальная форма передаёт установленную для левитов ответственность, а не единичное действие в прошлом.
- source_word: מִשְׁמֶרֶת
  choice: обязанности
  rationale: Существительное означает порученную службу, обязанность или ответственность. Его троекратное повторение сохранено, чтобы отразить структуру еврейского текста.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Прозрачно передаёт оба элемента устойчивого названия и звучит понятнее для современного читателя, чем традиционное «скиния собрания».
- source_word: הַקֹּדֶשׁ
  choice: святыня
  rationale: В культовом контексте слово может обозначать святое место, священную область или относящиеся к ней святыни. «Святыня» сохраняет эту широту лучше, чем более узкое «Святое место».
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: сыны Аарона, свои братья
  rationale: Сохранены родовая формула «сыны Аарона» и указание на братство ааронидов и остальных левитов.
- source_word: לַעֲבֹדַת
  choice: ради служения
  rationale: עֲבֹדָה здесь обозначает храмовое служение; оборот выражает цель перечисленных обязанностей.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: «Дом» непосредственно передаёт בַּיִת, а личное имя Яхве — тетраграмматон יְהוָה без замены титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Характер обязанностей левитов по отношению к сынам Аарона
  choice: обязанности при сынах Аарона
  alternative: поручения сыновей Аарона
  rationale: Еврейская конструкция מִשְׁמֶרֶת בְּנֵי אַהֲרֹן допускает понимание обязанностей по отношению к ааронидам или службы под их началом. Формулировка «при сынах Аарона» не превращает эту связь однозначно в поручения, исходящие от них.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор слова «обязанности» намеренно сохраняет трёхчастную структуру оригинала; архаизмы «скиния» и «охранение» не используются.
