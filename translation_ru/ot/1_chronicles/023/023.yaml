  yaml_path: translation/ot/1_chronicles/023/023.yaml
  text: 'The sons of Mushi: Mahli[a], Eder, and Jeremoth—three.'
translation:
  language: ru
  text: 'Сыновья Муши: Махли, Эдер и Иеремот — трое.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от «сын» вводит перечень трёх непосредственно названных лиц; буквальное «сыновья» здесь естественно и точнее, чем более широкое «потомки».
- source_word: מוּשִׁי
  choice: Муши
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: מַחְלִי
  choice: Махли
  rationale: Личное имя транслитерировано с еврейского; форма «Махли» узнаваема в русской библейской традиции.
- source_word: וְעֵדֶר
  choice: Эдер
  rationale: Союз וְ передан русским «и» перед последним членом перечисления, а личное имя עֵדֶר — как «Эдер».
- source_word: וִירֵמוֹת
  choice: Иремот
  rationale: Личное имя передано непосредственно с масоретской формы יְרֵמוֹת; русское «Иремот» сохраняет её звучание без опоры на варианты английской транслитерации.
- source_word: שְׁלֹשָׁה
  choice: трое
  rationale: Числительное подводит итог числу названных сыновей. Собирательное «трое» естественно по-русски применительно к трём лицам мужского пола; тире сохраняет структуру «перечень — итог».
theological_decisions: []
