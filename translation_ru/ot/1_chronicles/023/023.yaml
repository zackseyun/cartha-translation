  register: 'Современный литературный русский язык с краткой генеалогической формулой. Сохранены прямой порядок перечисления и заключительный подсчёт. Английская сноска о вариантах Jeremoth/Jerimoth не перенесена: она относится к английскому написанию имени и не сообщает значимого варианта еврейского текста.'
