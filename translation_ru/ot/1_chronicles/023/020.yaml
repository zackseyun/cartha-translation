lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого состояния множественного числа от בֵּן вводит перечень сыновей; прямое значение естественно в данном родословном контексте.
- source_word: עֻזִּיאֵל
  choice: Уззиил
  rationale: Традиционная русская библейская передача личного имени, достаточно близкая еврейской форме.
- source_word: מִיכָה
  choice: Миха
  rationale: Прямая и узнаваемая русская транслитерация краткой еврейской формы имени.
- source_word: הָרֹאשׁ
  choice: первый
  rationale: Хотя רֹאשׁ буквально означает «голова» и может обозначать главу или начальника, параллель с הַשֵּׁנִי («второй») указывает здесь на значение первенства или порядка.
- source_word: וְיִשִּׁיָּה
  choice: и Ишшия
  rationale: Передача личного имени следует масоретскому написанию, сохраняя удвоенный согласный ш.
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Прямое соответствие порядковому числительному, обозначающему второго в перечне.
