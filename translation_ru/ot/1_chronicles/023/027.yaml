  rationale: Еврейское выражение эллиптично и буквально связано с «числом»; в контексте речь идёт о включении левитов в исчисление.
- source_word: בְּנֵי לֵוִי
  choice: сыновья Левия
  rationale: Сохраняет генеалогическую форму оригинала и при этом понятно обозначает потомков Левия как группу.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמַעְלָה
  choice: начиная с двадцатилетнего возраста и старше
  rationale: Естественно передаёт стандартную еврейскую формулу возраста и ясно включает всех достигших двадцати лет и более старших.
