  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: ru
  text: Давид был стар и насыщен днями[a], и поставил своего сына Соломона царём над Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достиг преклонных лет»; буквально: «стар и насыщен днями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: состарился
  rationale: Форма qatal описывает достигнутую Давидом старость; «состарился» естественно передаёт состояние и сохраняет повествовательную лаконичность.
- source_word: וְשָׂבַע יָמִים
  choice: и насытился днями
  rationale: Сохранён образный древнееврейский оборот о долгой, полной жизни; его буквальный образ литературно понятен по-русски, а возможный идиоматический смысл пояснён в сноске.
- source_word: וַיַּמְלֵךְ
  choice: и поставил ... царём
  rationale: Каузативная форма породы hifil означает, что Давид возвёл Соломона на царство; «поставил царём» передаёт это без добавления не упомянутой в тексте церемонии коронации.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: своего сына Соломона
  rationale: Естественный русский порядок слов сохраняет явно выраженное родство.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при обозначении воцарения выражает власть над народом; слово «всем» не добавляется, поскольку его нет в стихе.
- source_word: וְ
  choice: и
  rationale: Начальный союз передан обычным русским соединительным союзом без добавления временного наречия.
