    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: привратников
  rationale: Слово обозначает людей, поставленных у ворот; «привратники» естественно и точно передаёт храмовую должность.
- source_word: מְהַלְלִים
  choice: прославляющих
  rationale: Причастие передаёт постоянную обязанность этой группы левитов; форма «прославляющих» сохраняет структуру еврейского перечисления.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, прямо стоящее в еврейском тексте.
- source_word: בַּכֵּלִים
  choice: на инструментах
  rationale: Хотя כֵּלִים — широкое слово со значением «предметы, орудия, инструменты», контекст прославления указывает на музыкальные инструменты; предлог «на» идиоматичен в современном русском.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: которые я сделал
  rationale: Прямая передача относительного придаточного и формы первого лица; говорящий в контексте — Давид.
- source_word: לְהַלֵּל
  choice: для прославления
  rationale: Инфинитив с ל выражает цель. Безличная формулировка сохраняет отсутствие явно названного дополнения в еврейском тексте.
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: и четыре тысячи… и четыре тысячи
  rationale: Повтор числительного сохранён, поскольку еврейский текст подчёркивает две отдельные группы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Подразумеваемый объект לְהַלֵּל
  choice: для прославления
  alternative: чтобы прославлять Его
  rationale: В еврейском инфинитиве объект не выражен. Вариант без «Его» сохраняет формальную неоднозначность, хотя по контексту прославление направлено к Яхве.
translation_notes:
  register: Современный литературный русский с сохранением перечислительной структуры еврейского текста. «Привратники» употреблено как понятное название храмовой должности; «для прославления» сохраняет целевое значение и не добавляет отсутствующее в оригинале местоимение.
