  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: ru
  text: И собрал он всех вождей Израиля[a], священников и левитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальников Израиля», «сановников Израиля» или «правителей Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: И собрал он
  rationale: Последовательная форма с וַ продвигает повествование; «собрал» прямо передаёт обычное значение אסף и естественно звучит по-русски.
- source_word: כָּל
  choice: всех
  rationale: Квантор выражает совокупную полноту и при одушевлённом существительном во множественном числе естественно передаётся словом «всех».
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: вождей Израиля
  rationale: שָׂרִים может обозначать вождей, начальников, сановников или правителей. «Вожди» сохраняет широкий смысл руководителей народа и не создаёт ложного впечатления, будто речь непременно идёт о царских сыновьях.
- source_word: וְהַכֹּהֲנִים
  choice: священников
  rationale: Прямой и общепринятый перевод определённого существительного во множественном числе; союз передаётся структурой перечисления.
- source_word: וְהַלְוִיִּם
  choice: и левитов
  rationale: «Левиты» — традиционное и понятное русское обозначение членов колена Левия; заключительный союз естественно сохранён.
