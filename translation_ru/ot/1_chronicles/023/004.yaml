source:
  edition: WLC
  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: ru
  text: Из них двадцать четыре тысячи были поставлены руководить работой дома Яхве, а шесть тысяч — быть распорядителями и судьями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Из них
  rationale: Сочетание מִן с указательным אֵלֶּה имеет партитивный смысл и выделяет часть из ранее названных левитов.
- source_word: לְנַצֵּחַ עַל
  choice: были поставлены руководить
  rationale: Пиэльный инфинитив נצח с עַל здесь обозначает руководство и надзор; конструкция по контексту выражает назначение обязанностей.
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: работами в доме Яхве
  rationale: מְלָאכָה охватывает работы и обязанности, не ограничивая их только богослужением; «дом» сохраняет образность исходного текста, а Яхве передаёт личное имя יהוה.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи
  rationale: Прямая передача количественного числительного словами в связном литературном тексте.
- source_word: וְשֹׁטְרִים
  choice: распорядителями
  rationale: שֹׁטֵר обозначает должностное лицо с административно-исполнительными полномочиями; «распорядители» естественно для распределения храмовых обязанностей и не создаёт современного военного оттенка слова «офицеры».
- source_word: וְשֹׁפְטִים
  choice: судьями
  rationale: Прямой современный эквивалент для лиц, исполняющих судебные функции.
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: шесть тысяч
  rationale: Прямая передача числительного словами, согласованная с первым числом.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» непосредственно передаёт его и согласуется с предоставленным богословским решением, не заменяя имя титулом.
- issue: Характер храмовой деятельности
  choice: работы
  alternative: служение
  rationale: מְלָאכָה имеет широкое значение труда и порученного дела. «Работы» сохраняет эту широту и не сужает обязанности до собственно культового служения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Эллипсис во второй части восполнен инфинитивом «быть» для ясности; названия должностей даны без архаизмов.
