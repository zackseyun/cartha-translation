  yaml_path: translation/ot/1_chronicles/023/011.yaml
  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: ru
  text: Иахат был первым, а Зиза — вторым. У Иеуша и Берии было немного сыновей, поэтому при исчислении они составили один отцовский дом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поэтому они стали одним отцовским домом для одного исчисления». Еврейское слово может относиться к учёту (исчислению) или к организационному назначению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: Иахат был первым
  rationale: В данном перечне הָרֹאשׁ противопоставлено «второму» и обозначает первое место в порядке или старшинстве; «первым» естественнее и точнее передаёт это соотношение, чем буквальное «главой».
- source_word: וְזִיזָה הַשֵּׁנִי
  choice: а Зиза — вторым
  rationale: Союз передан как противопоставляющее «а», уместное в паре «первый — второй»; имя передано в принятой русской библейской форме.
- source_word: וִיעוּשׁ וּבְרִיעָה
  choice: у Иеуша и Берии
  rationale: Имена переданы в традиционных русских формах; конструкция с «у» позволяет естественно выразить обладание в следующей фразе.
- source_word: לֹא הִרְבּוּ בָנִים
  choice: было немного сыновей
  rationale: Еврейская идиома буквально означает, что они «не умножили сыновей». Русская формулировка передаёт смысл естественно и сохраняет конкретное указание на сыновей, а не обобщает его до детей.
- source_word: וַיִּהְיוּ לְבֵית אָב
  choice: они составили один отцовский дом
  rationale: בֵּית אָב — родственная и административная единица, объединённая по отцовской линии. «Отцовский дом» сохраняет этот специальный смысл, а глагол «составили» выражает результирующий статус группы.
- source_word: לִפְקֻדָּה אֶחָת
  choice: при исчислении
  rationale: פְּקֻדָּה здесь связано с учётом или организационным распределением левитов. «При исчислении» естественно показывает, что две малочисленные линии учитывались как одна единица, не сводя неоднозначное слово только к служебному назначению.
