base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: ru
  text: а также за хлеб расположения[a], за тонкую муку для хлебного приношения, за пресные лепёшки, за изделия, приготовленные на сковороде, за замешенное тесто и за всякую меру и всякое измерение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлеб предложения» или «хлеб Присутствия». Буквально: «хлеб расположения»; то есть хлеб, разложенный в установленном порядке.'
    reason: Сочетание допускает традиционные культовые наименования, тогда как основной текст сохраняет буквальный смысл еврейского выражения.
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: хлеб, разложенный рядами
  rationale: Передаёт буквальный смысл сочетания — хлеб, упорядоченно разложенный или расположенный рядами, — и при этом остаётся понятным без архаичного культового термина.
- source_word: סֹלֶת
  choice: лучшая мука
  rationale: Обозначает тонкую, высококачественную муку, предназначенную для приношений; это естественный русский эквивалент в данном контексте.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В культовом контексте речь идёт не о даре вообще, а о приношении из муки или зерна; устойчивое русское выражение точно обозначает его характер.
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: пресные лепёшки
  rationale: Кратко и естественно передаёт тонкие лепёшки, приготовленные без закваски.
- source_word: מַּחֲבַת
  choice: приготовленное на сковороде
  rationale: Слово обозначает плоскую сковороду или противень, но в перечне подразумеваются приготовленные на ней изделия, а не сама утварь.
- source_word: מֻּרְבָּכֶת
  choice: то, что замешано
  rationale: Сохраняет неопределённость пассивной формы и не уточняет без достаточных оснований состав смеси или точный способ приготовления.
- source_word: מְשׂוּרָה וּמִדָּה
  choice: меры объёма и размера
  rationale: Различает стандарт вместимости или количества и более общее измерение величины, сохраняя парную конструкцию еврейского текста.
