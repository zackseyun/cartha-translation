base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/019.yaml
  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: ru
  text: 'Сыновья Хеврона: Иерия — первый[a], Амария — второй, Иахазиил — третий, Иекамеам — четвёртый.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глава». Здесь это слово, по-видимому, означает «первый», поскольку далее следуют «второй», «третий» и «четвёртый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי חֶבְרוֹן
  choice: Сыновья Хеврона
  rationale: Форма сопряжённого сочетания вводит перечень сыновей Хеврона; прямой перевод точнее более широкого «потомки».
- source_word: יְרִיָּהוּ
  choice: Иерия
  rationale: Традиционная русская передача библейского личного имени.
- source_word: הָרֹאשׁ
  choice: первый
  rationale: Хотя רֹאשׁ буквально означает «глава» и может обозначать начальствующего, здесь слово стоит в ряду со «вторым», «третьим» и «четвёртым» и выполняет функцию порядкового обозначения.
- source_word: אֲמַרְיָה
  choice: Амария
  rationale: Устоявшаяся русская форма личного имени.
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Прямое порядковое обозначение в перечне.
- source_word: יַחֲזִיאֵל
  choice: Иахазиил
  rationale: Традиционная русская передача библейского личного имени.
- source_word: הַשְּׁלִישִׁי
  choice: третий
  rationale: Прямое порядковое обозначение в перечне.
- source_word: וִיקַמְעָם
  choice: Иекамеам
  rationale: Союз передан структурой русского перечисления, имя — в традиционной русской форме.
- source_word: הָרְבִיעִי
  choice: четвёртый
  rationale: Прямое порядковое обозначение в перечне.
