lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן. В генеалогическом перечне прямое соответствие «сыновья» естественно и не расширяет значение до более общего «потомки».
- source_word: יִצְהָר
  choice: Ицгар
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: שְׁלֹמִית
  choice: Шеломиф
  rationale: Личное имя передано принятой русской библейской формой, отражающей еврейское שְׁלֹמִית.
- source_word: הָרֹאשׁ
  choice: глава
  rationale: Слово רֹאשׁ с определённым артиклем здесь обозначает главного или ведущего представителя рода. «Глава» сохраняет образ и естественно звучит в русском генеалогическом контексте.
