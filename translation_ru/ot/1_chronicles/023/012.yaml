  yaml_path: translation/ot/1_chronicles/023/012.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: ru
  text: 'Сыновья Каафа: Амрам, Ицгар, Хеврон и Узиил — четверо.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן вводит перечень четырёх непосредственно названных сыновей; буквальное «сыновья» здесь естественно и точно.
- source_word: קְהָת
  choice: Каафа
  rationale: Имя передано в принятой русской библейской форме «Кааф» и поставлено в родительный падеж после слова «сыновья».
- source_word: עַמְרָם
  choice: Амрам
  rationale: Передача личного имени в принятой русской библейской форме.
- source_word: יִצְהָר
  choice: Ицгар
  rationale: Передача личного имени в узнаваемой русской библейской форме; согласная ה отражена буквой «г» согласно сложившейся традиции этого имени.
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Передача личного имени в принятой русской форме; в данном родословном перечне это человек, а не географическое название.
- source_word: וְעֻזִּיאֵל
  choice: и Уззиил
  rationale: Союз וְ передан как «и», а личное имя — в принятой русской библейской форме.
- source_word: אַרְבָּעָה
  choice: четверо
  rationale: Числительное подводит итог числу перечисленных мужчин; собирательное «четверо» естественно в современном русском языке.
