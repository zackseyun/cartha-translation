  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: ru
  text: И левитам больше не нужно[a] носить скинию и всю её утварь для служения при ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «левитам нет необходимости носить скинию и всю её утварь для служения при ней».'
    reason: Еврейская конструкция אֵין לָשֵׂאת выражает отсутствие необходимости переносить; основной текст с «больше» передаёт контекстуальный смысл прекращения прежней обязанности.
lexical_decisions:
- source_word: וְגַם
  choice: И
  rationale: Сочетание союза с усилительно-присоединительной частицей продолжает мысль предыдущего стиха. В русском контексте «И» естественно передаёт это присоединение; дополнительное «также» здесь было бы стилистически тяжеловесно.
- source_word: לַלְוִיִּם
  choice: левитам
  rationale: 'Предлог לְ обозначает сторону, которой относится отсутствие необходимости: буквально «для левитов нет [необходимости]». Дательный падеж точно и естественно передаёт эту конструкцию.'
- source_word: אֵין לָשֵׂאת
  choice: больше не нужно носить
  rationale: Конструкция буквально означает «нет [необходимости/предстоит] носить». В свете предшествующего утверждения о постоянном покое скинии речь идёт о прекращении прежней обязанности, а не о запрете; «больше не нужно» ясно выражает этот смысл.
- source_word: הַמִּשְׁכָּן
  choice: скинию
  rationale: «Скиния» — укоренившийся и точный русский термин для מִשְׁכָּן в данном культовом контексте.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: и всю её утварь
  rationale: כֵּלִים охватывает сосуды, принадлежности и прочие предметы, используемые при скинии. «Утварь» кратко и точно передаёт это собирательное значение; «всю» сохраняет כָּל.
- source_word: לַעֲבֹדָתוֹ
  choice: для служения при ней
  rationale: Суффикс мужского рода естественнее всего соотносится со скинией (מִשְׁכָּן — мужского рода в еврейском). Русское «при ней» обозначает служение, связанное со скинией, не создавая впечатления, будто служат самой постройке.
theological_decisions:
- issue: Является ли переноска запрещённой или лишь более не требующейся?
  choice: больше не нужно носить
  alternative: не должны носить
  rationale: Контекст реорганизации левитов после установления скинии на постоянном месте указывает на прекращение необходимости и обязанности переноски, а не на введение нравственного или обрядового запрета.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного библейского термина «скиния». Формулировка проста и торжественно-нейтральна; синтаксис адаптирован к естественной русской речи без устранения смысловой неоднозначности конструкции אֵין לָשֵׂאת.
