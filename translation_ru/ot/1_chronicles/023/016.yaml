  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главный».'
    reason: 'Лексическая альтернатива: הָרֹאשׁ может обозначать как «главу», так и лицо, занимающее главное, руководящее положение.'
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Прямо передаёт форму сопряжённого состояния множественного числа от בֵּן и естественно вводит родовую линию в данном перечне.
- source_word: גֵרְשׁוֹם
  choice: Гирсам
  rationale: Транслитерация личного имени в форме, принятой в русской библейской традиции; здесь еврейское имя גֵרְשׁוֹם, а не גֵּרְשׁוֹן.
- source_word: שְׁבוּאֵל
  choice: Шевуил
  rationale: Транслитерация личного имени в форме, принятой в русской библейской традиции.
- source_word: הָרֹאשׁ
  choice: глава
  rationale: В организационно-родословном контексте слово обозначает первенство или руководящее положение; «глава» естественно и достаточно близко сохраняет образ еврейского רֹאשׁ.
