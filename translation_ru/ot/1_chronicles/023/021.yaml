  text: 'Сыновья Мерари: Махли и Муши. Сыновья Махли: Елеазар и Киш.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма множественного числа в сопряжённом состоянии вводит родословный перечень; прямое значение «сыновья» здесь естественно и не требует расширения до «потомки».
- source_word: מְרָרִי
  choice: Мерари
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: מַחְלִי
  choice: Махли
  rationale: Личное имя передано в принятой русской библейской форме; одинаково переведено в обоих вхождениях.
- source_word: וּמוּשִׁי
  choice: и Муши
  rationale: Союз ו передан как «и», личное имя — в принятой русской библейской форме.
- source_word: בְּנֵי מַחְלִי
  choice: Сыновья Махли
  rationale: Повтор родословного заголовка сохраняет структуру еврейского текста и ясно обозначает следующую ветвь рода.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Личное имя передано в устойчивой русской библейской форме.
- source_word: וְקִישׁ
  choice: и Киш
  rationale: Союз ו передан как «и», личное имя — в устойчивой русской библейской форме.
