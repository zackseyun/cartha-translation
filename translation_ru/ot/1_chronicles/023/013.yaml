source:
  edition: WLC
  text: בְּנֵ֥י עַמְרָ֖ם אַהֲרֹ֣ן וּ/מֹשֶׁ֑ה וַ/יִּבָּדֵ֣ל אַהֲרֹ֡ן לְֽ/הַקְדִּישׁ/וֹ֩ קֹ֨דֶשׁ קָֽדָשִׁ֤ים הֽוּא וּ/בָנָי/ו֙ עַד עוֹלָ֔ם לְ/הַקְטִיר֩ לִ/פְנֵ֨י יְהוָ֧ה לְ/שָׁרְת֛/וֹ וּ/לְ/בָרֵ֥ךְ בִּ/שְׁמ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: ru
  text: 'Сыновья Амрама: Аарон и Моисей. Аарон был отделён, чтобы сделать его святейшим. Он и его сыновья были назначены на это навеки: воскурять перед Яхве, служить Ему и благословлять Его именем навеки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: Сыновья Амрама
  rationale: В данном контексте названы непосредственные сыновья Амрама — Аарон и Моисей, поэтому буквальное «сыновья» точнее общего «потомки».
- source_word: וַיִּבָּדֵל
  choice: был отделён
  rationale: Форма нифаля от בדל обозначает отделение для особого, священного назначения; «был отделён» сохраняет пассивную форму и культовый оттенок.
- source_word: לְהַקְדִּישׁוֹ
  choice: чтобы его освятили
  rationale: Гифиль от קדש с суффиксом 3-го лица мужского рода единственного числа буквально выражает действие над «ним». Неопределённо-личная русская конструкция естественно передаёт подразумеваемого деятеля, не превращая Аарона в того, кто освящает самого себя.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: как величайшую святыню
  rationale: Еврейская сочетательная конструкция имеет превосходное значение. В контексте она описывает священный статус Аарона, а не помещение святилища.
- source_word: הוּא וּבָנָיו עַד עוֹלָם
  choice: он и его сыновья — навеки
  rationale: Сохранены явное местоимение, родовая преемственность священства и длительность, выраженная עַד עוֹלָם.
- source_word: לְהַקְטִיר
  choice: воскурять
  rationale: В священническом контексте глагол обозначает вознесение дыма благовоний или жертв; «воскурять» кратко передаёт культовое действие, не сужая его без необходимости до одного лишь ладана.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי передаёт пребывание и служение пред лицом Бога; личное имя יהוה транслитерировано как «Яхве».
- source_word: לְשָׁרְתוֹ
  choice: служить Ему
  rationale: שרת здесь обозначает священническое служение; местоимение отнесено к ближайшему божественному референту — Яхве.
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: и благословлять Его именем
  rationale: Формулировка сохраняет возможные оттенки действия посредством имени и на основании власти, связанной с именем Яхве.
theological_decisions:
- issue: К кому относятся суффиксы в לְהַקְדִּישׁוֹ и לְשָׁרְתוֹ
  choice: В первом случае «его» относится к Аарону, во втором «Ему» — к Яхве.
  alternative: Первый суффикс понимать безлично либо относить к иному объекту; второй — к Аарону.
  rationale: После упоминания отделённого Аарона естественным объектом освящения является Аарон, тогда как после слов «перед Яхве» служение естественно направлено Яхве. Различие референтов отражает ближайший синтаксический контекст.
- issue: Относится ли «величайшая святыня» только к Аарону или также к его сыновьям
  choice: 'Синтаксис текста сохранён: сначала назван Аарон как объект освящения, затем добавлено «он и его сыновья — навеки».'
  alternative: Явно распространить определение «величайшая святыня» на Аарона и всех его сыновей.
  rationale: Еврейское расположение допускает связь последующей фразы с постоянным священническим статусом всей линии, но не требует грамматически переписывать единственное число как множественное.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Слово «воскурять» сохранено как укоренённый культовый термин; архаические формы вроде «пред лицом» и «во имя его» не используются. Тире выделяет присоединённое пояснение о вечном служении Аарона и его сыновей.
