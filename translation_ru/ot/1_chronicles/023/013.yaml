    reason: lexical_alternative
  revision_rationale: 'Заменено неточное для лица «величайшая святыня» на предикативное «святейшим». Перестроена русская синтаксическая связь: постоянное назначение Аарона и его сыновей теперь выражено явным сказуемым и вводит перечисление обязанностей. Конструкция «чтобы сделать его» сохраняет единственное число еврейского суффикса и не называет деятеля освящения.'
