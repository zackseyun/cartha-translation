revisions:
- from: 'Сыновья Амрама: Аарон и Моисей. Аарон был отделён, чтобы его освятили как величайшую святыню[a]; он и его сыновья — навеки, чтобы воскурять перед Яхве, служить Ему и благословлять Его именем навеки.'
  to: 'Сыновья Амрама: Аарон и Моисей. Аарон был отделён, чтобы сделать его святейшим. Он и его сыновья были назначены на это навеки: воскурять перед Яхве, служить Ему и благословлять Его именем навеки.'
  rationale: 'Заменено неточное для лица «величайшая святыня» на предикативное «святейшим». Перестроена русская синтаксическая связь: постоянное назначение Аарона и его сыновей теперь выражено явным сказуемым и вводит перечисление обязанностей. Конструкция «чтобы сделать его» сохраняет единственное число еврейского суффикса и не называет деятеля освящения.'
  reviewer_model: gpt-5.6-terra
