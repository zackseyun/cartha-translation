review_pass:
  verdict: revise
  source_fidelity: 'Смысл основных лексем передан верно: Аарон и Моисей названы сыновьями Амрама; Аарон отделён для особого священного статуса; последующие обязанности совершаются перед Яхве, в служении Ему и при благословении Его именем. Однако «величайшая святыня» в русском прежде всего обозначает предмет либо место почитания и потому неточно передаёт предикативный статус лица в קֹדֶשׁ קָדָשִׁים. Формулировка исправлена на «святейшим».'
  naturalness: 'Исходное «он и его сыновья — навеки, чтобы…» синтаксически обрывочно: тире не даёт читателю ясного сказуемого, а два последовательных оборота с «чтобы» затрудняют связь. В исправлении явно выражено подразумеваемое для Аарона и его сыновей постоянное назначение, без изменения перечня служебных обязанностей.'
  terminology: «Яхве», «воскурять», «служить» и «благословлять Его именем» уместны в современном литературном библейском регистре. «Святейшим» передаёт превосходную конструкцию קֹדֶשׁ קָדָשִׁים применительно к Аарону, не превращая его в культовый предмет или помещение. Заглавное «Ему/Его» последовательно относится к Яхве; «его» в первом предложении относится к Аарону.
  issues:
  - severity: medium
    issue: «как величайшую святыню» характеризует Аарона как объект или место культа.
    rationale: В данном контексте еврейское קֹדֶשׁ קָדָשִׁים выражает предельно святой статус, а не называет Аарона «святыней» в обычном русском смысле.
  - severity: medium
    issue: Неясная синтаксическая связь фразы «он и его сыновья — навеки, чтобы…».
    rationale: Русская фраза не содержит сказуемого и неясно присоединяет «навеки» к последующим обязанностям. Следует выразить постоянное назначение священнической линии.
  revised_text: 'Сыновья Амрама: Аарон и Моисей. Аарон был отделён, чтобы сделать его святейшим. Он и его сыновья были назначены на это навеки: воскурять перед Яхве, служить Ему и благословлять Его именем навеки.'
