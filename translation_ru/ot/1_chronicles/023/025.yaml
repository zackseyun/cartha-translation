base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: ru
  text: 'Ибо Давид сказал: «Яхве, Бог Израиля, даровал покой своему народу и обитает[a] в Иерусалиме навеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и обитал в Иерусалиме навеки»; возможно также: «и будет обитать в Иерусалиме навеки». Еврейский глагол может обозначать установившееся, непреходящее пребывание Яхве там.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим указанием естественным русским союзом.
- source_word: אָמַר דָּוִיד
  choice: Давид сказал
  rationale: Простая форма прошедшего времени прямо передаёт еврейское повествование.
- source_word: הֵנִיחַ
  choice: даровал покой
  rationale: Каузативная форма глагола נוח означает, что Яхве дал народу покой и безопасность; «даровал покой» сохраняет этот смысл и звучит естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямое и привычное русское воспроизведение конструкции принадлежности, стоящей в приложении к имени Яхве.
- source_word: לְעַמּוֹ
  choice: Своему народу
  rationale: Возвратное притяжательное местоимение ясно относит народ к подлежащему Яхве; дательный падеж соответствует получателю дарованного покоя.
- source_word: וַיִּשְׁכֹּן
  choice: и обитает
  rationale: Глагол שכן обозначает пребывание или обитание. Настоящее время естественно выражает установившееся и продолжающееся пребывание, не сводя высказывание только к начальному моменту поселения.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Прямая передача обстоятельства места.
- source_word: עַד לְעוֹלָם
  choice: навеки
  rationale: Кратко и достойно передаёт значение непрекращающейся длительности без архаической тяжеловесности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Временной и аспектуальный смысл пребывания Яхве в Иерусалиме
  choice: и обитает в Иерусалиме навеки
  alternative: и поселился в Иерусалиме навеки; и будет обитать в Иерусалиме навеки
  rationale: Еврейская глагольная последовательность допускает понимание действия как установившегося пребывания, продолжающегося бессрочно. Основной текст передаёт это как настоящее состояние, а сноска сохраняет возможные временные оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Даровал покой» и «обитает» понятны широкому читателю и сохраняют достоинство речи. Местоимение «Своему» написано с прописной буквы как уважительное указание на Бога.
