base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/003.yaml
  text: The Levites were counted from thirty years old and upward[a], and their number by heads, man by man, was thirty-eight thousand.
translation:
  language: ru
  text: Левитов в возрасте от тридцати лет и старше сосчитали; при подсчёте каждого мужчины их число составило тридцать восемь тысяч.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по их головам, по мужчинам»; то есть был произведён индивидуальный подсчёт взрослых мужчин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּפְרוּ
  choice: были пересчитаны
  rationale: Форма нифаль представляет левитов как тех, кого подсчитали. «Были пересчитаны» естественно передаёт переписной контекст.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое русское обозначение представителей колена Левия.
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמָעְלָה
  choice: от тридцати лет и старше
  rationale: Современная и точная передача нижней возрастной границы, выраженной еврейской идиомой.
- source_word: וַיְהִי מִסְפָּרָם
  choice: их число составило
  rationale: Естественная русская формулировка, вводящая итог подсчёта.
- source_word: לְגֻלְגְּלֹתָם
  choice: при поголовном подсчёте
  rationale: Передаёт идиоматический смысл подсчёта каждого человека, сохраняя образ «головы» в русском слове «поголовный».
- source_word: לִגְבָרִים
  choice: мужчин
  rationale: Сохраняет указанную в источнике мужскую принадлежность подсчитываемых лиц; во взаимосвязи с предыдущим выражением подразумевается индивидуальный подсчёт.
- source_word: שְׁלֹשִׁים וּשְׁמוֹנָה אָלֶף
  choice: тридцать восемь тысяч
  rationale: Прямая передача итогового числа.
