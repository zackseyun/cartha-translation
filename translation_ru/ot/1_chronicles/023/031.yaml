base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: ru
  text: и для принесения Яхве всех всесожжений — по субботам, в новомесячия и в установленные праздники, в числе, предписанном для них, постоянно пред Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: и при каждом вознесении всесожжений
  rationale: Сочетание инфинитива הַעֲלוֹת с однокоренным существительным עֹלוֹת обозначает совершение жертвенного действия. «При каждом вознесении всесожжений» сохраняет эту конструкцию и естественно продолжает перечень обязанностей.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт собственное заветное имя יהוה транслитерацией, а направленность жертвы выражена словом «вознесении» в сочетании «вознесении всесожжений Яхве».
- source_word: לַשַּׁבָּתוֹת
  choice: по субботам
  rationale: Предлог указывает на регулярно повторяющиеся календарные случаи; форма множественного числа сохранена через русскую распределительную конструкцию.
- source_word: לֶחֳדָשִׁים
  choice: в новомесячия
  rationale: В культовом календарном контексте חֳדָשִׁים означает празднования начала нового месяца, а не просто месяцы.
- source_word: וְלַמּוֹעֲדִים
  choice: и установленные праздники
  rationale: מוֹעֲדִים здесь обозначает назначенные священные праздничные сроки; перевод передаёт и установленность, и праздничный характер.
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: в предписанном для них числе
  rationale: Компактно передаёт требование приносить установленное количество жертв согласно действующему для данных случаев предписанию, не переопределяя возможный антецедент местоимения.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Сохраняет значение непрерывной, регулярно поддерживаемой храмовой службы.
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Естественный и традиционно возвышенный русский эквивалент культовой формулы служения в присутствии Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер תָּמִיד
  choice: постоянно
  alternative: регулярно
  rationale: «Постоянно» сохраняет полноту выражения, не исключая того, что в контексте календарных жертв постоянство осуществляется через установленную регулярность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной культовой лексикой. Сохранены перечислительный синтаксис стиха, термин «всесожжение», календарные реалии и формула «пред Яхве»; избыточно канцелярские обороты устранены.
