  yaml_path: translation/ot/1_chronicles/023/006.yaml
  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: ru
  text: 'Давид разделил их на группы среди сыновей Левия: Гирсона, Каафа и Мерари.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: разделил их
  rationale: Пиэль глагола חלק означает «разделять, распределять»; суффикс 3-го лица множественного числа требует сохранить прямое дополнение «их».
- source_word: מַחְלְקוֹת
  choice: на подразделения
  rationale: Существительное обозначает установленные разряды или организованные группы. В сочетании с «разделил» предлог «на» естественно передаёт результат разделения.
- source_word: לִבְנֵי לֵוִי
  choice: по сыновьям Левия
  rationale: Так передаётся генеалогическая структура распределения и сохраняется явное упоминание сыновей Левия; русский предлог «по» естественно связывает подразделения с родовыми линиями.
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: Гирсону, Каафу и Мерари
  rationale: Префикс ל перед первым именем допускает понимание всего перечня как зависимого от предлога. Дательный падеж передаёт эту связь, а формы имён соответствуют укоренившейся русской библейской традиции.
