theological_decisions:
- issue: Статус сыновей Моисея в коленной структуре Израиля
  choice: были причислены к колену Левия
  alternative: были названы по колену Левия
  rationale: Перевод сохраняет утверждение текста о принадлежности к колену, не добавляя особого священнического статуса и не исключая иных функций.
