  yaml_path: translation/ot/1_chronicles/023/030.yaml
  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: ru
  text: и каждое утро[a] стоять, чтобы благодарить и славить Яхве, и так же вечером.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «утро за утром» — то есть регулярно, каждое утро.'
    reason: Сноска отмечает повторную конструкцию בַּבֹּקֶר בַּבֹּקֶר, естественно переданную в основном тексте как «каждое утро».
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: и … становиться
  rationale: Инфинитив с לְ продолжает описание установленной обязанности левитов; «становиться» сохраняет конкретный образ предстояния при богослужении, не заменяя его более толковательным «служить».
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: каждое утро
  rationale: Повтор существительного имеет распределительное значение и указывает на регулярное ежедневное исполнение обязанности; по-русски это естественно передаётся выражением «каждое утро».
- source_word: לְ/הֹדֹות
  choice: чтобы благодарить
  rationale: В данном богослужебном контексте Hiphil глагола ידה означает благодарение, а не исповедание; целевая конструкция естественно передана союзом «чтобы».
- source_word: וּ/לְ/הַלֵּל
  choice: и славить
  rationale: Piel глагола הלל прямо обозначает хвалу; «славить» звучит естественно и достойно в русском богослужебном контексте, не добавляя отсутствующего в тексте указания на пение.
- source_word: לַ/יהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», что сохраняет его функцию как явленного имени Бога, а не заменяет его титулом.
- source_word: וְ/כֵן
  choice: и так же
  rationale: Выражение связывает вечернюю обязанность с утренней как такое же действие; «так же» ясно передаёт это соответствие.
- source_word: לָ/עָרֶב
  choice: вечером
  rationale: Форма обозначает соответствующее вечернее время; наречие «вечером» естественнее для современного русского языка, чем буквальное «к вечеру».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное божественное имя. Передача «Яхве» сохраняет его как имя и не подменяет титулом; «Иегова» отражает более позднюю гибридную форму произношения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сохраняет связь с перечнем обязанностей в предшествующем контексте; начальное «и» оставлено. Конкретный глагол «становиться» удерживает образ установленного богослужебного предстояния.
