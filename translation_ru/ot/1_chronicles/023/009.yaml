base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/009.yaml
  text: 'The sons of Shimei: Shelomoth[a], Haziel, and Haran—three. These were the heads of the fathers’ houses of Ladan.'
translation:
  language: ru
  text: 'Сыновья Шимея: Шеломот, Хазиил и Харан — трое. Они были главами отеческих домов Лаедана.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי שִׁמְעִי
  choice: Сыновья Шимея
  rationale: В данном родословном перечне речь естественнее всего идёт о непосредственных сыновьях, а не о потомках вообще.
- source_word: שלמות
  choice: Шеломот
  rationale: Передаёт согласный состав и огласованную форму еврейского личного имени; вариант «Шеломит» отмечен в сноске.
- source_word: וַחֲזִיאֵל
  choice: Хазиил
  rationale: Прямая передача формы חֲזִיאֵל без подмены родственным именем Иахазиил, встречающимся в других местах.
- source_word: וְהָרָן
  choice: и Харан
  rationale: Союз и личное имя переданы прямо и естественно по-русски.
- source_word: שְׁלֹשָׁה
  choice: трое
  rationale: Явно сохраняет данное в еврейском тексте итоговое число названных сыновей; форма «трое» естественна применительно к мужчинам.
- source_word: אֵלֶּה רָאשֵׁי הָאָבוֹת
  choice: Они были главами отеческих домов
  rationale: «Главы» сохраняет административно-родовой смысл רָאשֵׁי, а «отеческие дома» передаёт родовые подразделения по отцовской линии, обозначенные הָאָבוֹת.
- source_word: לְלַעְדָּן
  choice: Лаэдана
  rationale: Предлог לְ обозначает принадлежность к родовой линии Лаэдана; русский родительный падеж выражает эту связь естественно.
