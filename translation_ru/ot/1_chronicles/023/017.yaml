base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: ru
  text: 'Сыновья Елиезера: Рехавия — глава[a]. Других сыновей у Елиезера не было, но сыновей у Рехавии стало чрезвычайно много.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первый».'
    reason: Еврейское הָרֹאשׁ может обозначать главу, главного или первого; контекст не позволяет с полной уверенностью выбрать между статусным и порядковым значением.
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: 'Сыновья Елиезера:'
  rationale: Генеалогическая вводная формула передана краткой рубрикой. Множественное число сохранено, хотя далее назван единственный сын, что прямо поясняется в следующей части стиха.
- source_word: רְחַבְיָה
  choice: Рехавия
  rationale: Имя транслитерировано в соответствии с принятой русской библейской традицией.
- source_word: הָרֹאשׁ
  choice: глава
  rationale: Существительное с артиклем обозначает главу или ведущего представителя. Такое значение уместнее в родословно-организационном контексте, чем буквальное «голова»; возможное порядковое значение отмечено в сноске.
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: Других сыновей у Елиезера не было
  rationale: Еврейская конструкция обладания передана естественным русским оборотом; «других» ясно указывает, что Рехавия был единственным сыном.
- source_word: וּבְנֵי רְחַבְיָה
  choice: но сыновей у Рехавии
  rationale: Союз передан как «но», чтобы выразить контраст между единственным сыном Елиезера и множеством сыновей Рехавии.
- source_word: רָבוּ לְמָעְלָה
  choice: стало чрезвычайно много
  rationale: Глагол выражает увеличение численности, а לְמָעְלָה здесь усиливает его; перевод сохраняет и динамику умножения, и высокую степень.
