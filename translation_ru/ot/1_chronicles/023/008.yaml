base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: ru
  text: 'Сыновья Лаедана: Иехиил, глава[a], Зефам и Иоиль — трое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главный», «старший» или «первый». Еврейское слово буквально означает «глава, голова» и может указывать на ведущее положение или старшинство в перечне.'
    reason: Сохраняет лексическую неоднозначность הָרֹאשׁ, не делая один из возможных смыслов исключительным.
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа означает «сыновья». Здесь непосредственно перечислены три лица, поэтому расширительное «потомки» не требуется.
- source_word: לַעְדָּן
  choice: Лаедан
  rationale: Имя передано близко к еврейской форме и в соответствии с принятой русской библейской традицией.
- source_word: הָרֹאשׁ
  choice: глава
  rationale: Буквально «голова, глава»; слово может обозначать главного или старшего. Перевод «глава» сохраняет эту смысловую широту и не превращает выражение в однозначное указание на первенца.
- source_word: יְחִיאֵל
  choice: Иехиил
  rationale: Традиционная русская передача еврейского личного имени.
- source_word: וְזֵתָם
  choice: затем Зефам
  rationale: Союз וְ связывает имена в перечне; по-русски «затем» естественно продолжает список после обособленного указания на главу. Имя передано в традиционной форме.
- source_word: וְיוֹאֵל
  choice: и Иоиль
  rationale: Союз и личное имя переданы прямо, с традиционной русской формой имени.
- source_word: שְׁלֹשָׁה
  choice: всего трое
  rationale: Числительное мужского рода подводит итог перечислению; «всего трое» естественно и явно сохраняет итоговый счёт.
theological_decisions:
- issue: Значение הָרֹאשׁ при имени Иехиила
  choice: глава
  alternative: первый / старший / главный
  rationale: Контекст допускает представление о старшинстве или ведущем положении, но само слово не является обычным порядковым числительным. Основной текст сохраняет буквальную метафору и неоднозначность, а примечание разъясняет варианты.
translation_notes:
  register: Современный литературный русский с сохранением традиционных форм библейских имён. Пунктуация делает краткий родословный перечень ясным; формулировка остаётся сдержанной и достоинственной.
