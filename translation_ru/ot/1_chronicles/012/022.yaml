base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: ru
  text: И они помогли Давиду в борьбе с отрядом[a], потому что все они были храбрыми воинами[b] и стали начальниками в войске[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против воинского отряда»; еврейское גְּדוּד может означать также отряд налётчиков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доблестными и сильными воинами»; еврейское выражение גִבּוֹרֵי חַיִל обозначает храбрых и способных бойцов.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «военачальниками» или «командирами в войске».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: И они
  rationale: Самостоятельное местоимение подчёркивает подлежащее; сочетание «И они» естественно передаёт это в русском повествовании.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: помогали Давиду
  rationale: Хотя עִם буквально означает «с», при русском глаголе «помогать» адресат естественно выражается дательным падежом.
- source_word: עַל הַגְּדוּד
  choice: против отряда
  rationale: גְּדוּד может обозначать вооружённый отряд, войсковое подразделение или шайку налётчиков; нейтральное «отряд» сохраняет контекстуальную неоднозначность, а עַל передано как «против».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание последующего утверждения и ясно передаётся причинным «потому что».
- source_word: גִבּוֹרֵי חַיִל
  choice: храбрыми воинами
  rationale: Устойчивое военное выражение обозначает доблестных и способных бойцов; этот вариант естественен в современном русском и сохраняет военный смысл.
- source_word: כֻּלָּם
  choice: все
  rationale: Передаёт охват всей названной группы без исключения.
- source_word: וַיִּהְיוּ
  choice: стали
  rationale: Форма здесь естественно указывает на наступившее положение, а не только на статическое состояние.
- source_word: שָׂרִים בַּצָּבָא
  choice: военачальниками
  rationale: В военном контексте שָׂרִים означает начальников или командиров; русское «военачальники» ёмко передаёт их руководящее положение в войске.
