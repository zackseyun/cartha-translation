  source_fidelity: 'Основной смысл передан верно: речь о прибывших к Давиду в Хевроне/Хеврон военных руководителях, содействовавших переходу царства Саула к Давиду в согласии со словом Яхве. Однако «вооружённых для войны отрядов» менее точно отражает הֶחָלוּץ לַצָּבָא: еврейский текст говорит о вооружённых (снаряжённых) людях для военной службы, а не прямо об «отрядах».'
