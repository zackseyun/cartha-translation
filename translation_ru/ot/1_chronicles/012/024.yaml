  terminology: «Яхве» точно передаёт יהוה и согласуется с предоставленной богословской установкой. «Царство Саула» допустимо для מַלְכוּת שָׁאוּל; «передать ему» хорошо выражает переход власти. Примечание о «главных подразделениях» не имеет достаточной опоры в самой конструкции и создаёт искусственную неоднозначность.
