  text: וְ֠/אֵלֶּה מִסְפְּרֵ֞י רָאשֵׁ֤י הֶֽ/חָלוּץ֙ לַ/צָּבָ֔א בָּ֥אוּ עַל דָּוִ֖יד חֶבְר֑וֹנָ/ה לְ/הָסֵ֞ב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו כְּ/פִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: ru
  text: Вот число начальников вооружённых воинов[a], прибывших к Давиду в Хеврон, чтобы передать ему царство Саула, по слову Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глав вооружённого (снаряжённого) для военной службы». Выражение обозначает начальников вооружённых воинов.'
    reason: Передаёт буквальную форму и поясняет собирательное значение без внесения неподтверждённого смысла «подразделений».
  - marker: b
    text: 'Буквально: «по устам Яхве»; то есть по слову Яхве, как Яхве сказал.'
    reason: Сохраняет образность еврейского идиоматического выражения и объясняет его значение.
lexical_decisions:
- source_word: מִסְפְּרֵי
  choice: численность
  rationale: Форма множественного числа вводит последующий перечень по группам; русское собирательное «численность» естественно передаёт смысл подсчёта.
- source_word: רָאשֵׁי
  choice: предводителей
  rationale: Буквально «глав»; в отношении воинских отрядов современное русское «предводителей» сохраняет значение руководства и не звучит канцелярски.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: вооружённых для войны отрядов
  rationale: הֶחָלוּץ обозначает снаряжённых или вооружённых воинов как коллектив, а לַצָּבָא указывает на военное назначение.
- source_word: בָּאוּ עַל דָּוִיד
  choice: пришедших к Давиду
  rationale: В данном контексте предлог выражает движение к Давиду и присоединение к нему, а не выступление против него.
- source_word: חֶבְרוֹנָה
  choice: в Хеврон
  rationale: Направительный суффикс указывает на движение в Хеврон; вместе с «к Давиду» естественный русский порядок требует формы «в Хеврон».
- source_word: לְהָסֵב מַלְכוּת שָׁאוּל אֵלָיו
  choice: чтобы передать ему царство Саула
  rationale: Каузативная форма סבב означает обратить или перевести власть к Давиду; «передать» ясно выражает переход царства, не уточняя механизм передачи.
- source_word: כְּפִי יְהוָה
  choice: по слову Яхве
  rationale: Буквально «по устам Яхве» — устойчивое обозначение сказанного или повелённого Богом; имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует исходной форме.
- issue: Характер перехода царства Саула к Давиду
  choice: передать ему царство Саула
  alternative: обратить к нему царскую власть Саула
  rationale: Перевод сохраняет мысль о переходе правления к Давиду, не добавляя утверждения о том, что сами пришедшие обладали верховным правом назначить царя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Военная терминология понятна неспециалисту; неоднозначность трудного сочетания רָאשֵׁי הֶחָלוּץ вынесена в примечание, а не скрыта.
