  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: ru
  text: Они пробыли там с Давидом три дня, ели и пили, потому что их братья[a] приготовили для них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соплеменники» или «родственники». Буквально в еврейском тексте: «братья»; в данном контексте слово может обозначать также членов того же рода или племени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: они пробыли
  rationale: Форма глагола היה в сочетании с указанием длительности описывает пребывание; «пробыли» естественно передаёт это значение по-русски.
- source_word: שָׁם
  choice: там
  rationale: Краткое и естественное обозначение уже известного места собрания у Давида.
- source_word: עִם דָּוִיד
  choice: с Давидом
  rationale: Предлог עִם обозначает совместное пребывание или нахождение рядом.
- source_word: יָמִים שְׁלוֹשָׁה
  choice: три дня
  rationale: В русском языке длительность после «пробыли» естественно выражается без дополнительного предлога.
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: ели и пили
  rationale: Причастия обозначают продолжавшиеся во время пребывания действия; буквальная пара сохранена без обобщающего «пировали».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину того, что собравшиеся могли есть и пить.
- source_word: הֵכִינוּ
  choice: приготовили
  rationale: Порода hифиль глагола כון означает «приготовить, сделать готовым»; прошедшее время естественно в русском повествовании.
- source_word: לָהֶם
  choice: для них
  rationale: Предложное местоименное сочетание передаёт адресата приготовления.
- source_word: אֲחֵיהֶם
  choice: их братья
  rationale: Основное значение существительного — «братья»; более широкий родственный или племенной смысл отмечен в сноске.
theological_decisions:
- issue: Возможный широкий смысл אֲחֵיהֶם
  choice: их братья
  alternative: их соплеменники; их родственники
  rationale: Основной текст сохраняет конкретный мужской термин оригинала и не устраняет его возможную многозначность; контекстуально более широкий смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены конкретные глаголы «ели и пили» и родственный термин «братья»; сноска поставлена непосредственно после слова, к которому относится.
