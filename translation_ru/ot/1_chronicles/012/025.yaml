lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: из сынов Иуды
  rationale: Оборот обозначает представителей или потомков колена Иуды. «Из сынов Иуды» сохраняет родоплеменную формулу еврейского текста и естественно вводит численность отряда в контекстном перечне.
- source_word: נֹשְׂאֵי
  choice: носивших
  rationale: Причастие от נשׂא здесь описывает воинов, несущих воинское снаряжение; «носивших» точно и естественно передаёт эту функцию.
- source_word: צִנָּה
  choice: щит
  rationale: צִנָּה обозначает щит, нередко большой. В основном тексте выбрано общеупотребительное «щит», поскольку противопоставление щитов разных типов в данном стихе несущественно.
- source_word: וָרֹמַח
  choice: и копьё
  rationale: רֹמַח — копьё или пика; «копьё» является наиболее понятным и обычным русским соответствием.
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: 6 800 человек
  rationale: Число передано цифрами для удобства чтения перечня; слово «человек» естественно уточняет подразумеваемый счёт воинов.
- source_word: חֲלוּצֵי צָבָא
  choice: снаряжённых для боя
  rationale: В военном контексте выражение обозначает людей, оснащённых и подготовленных к участию в сражении. Формулировка сохраняет смысл военной готовности, не сужая его только до наличия оружия.
