revisions:
- from: Из Завулона — пятьдесят тысяч воинов, способных нести военную службу и готовых к бою со всевозможным оружием; они пришли поддержать Давида[a] с нераздвоенным сердцем[b].
  to: Из Завулона — пятьдесят тысяч воинов, пригодных к военной службе, готовых к бою, со всем воинским снаряжением, чтобы оказать поддержку[a] с нераздвоенным сердцем[b].
  rationale: Убрано не выраженное в стихе имя Давида, хотя оно ясно подразумевается ближайшим контекстом. Воинское оснащение передано более широким словом «снаряжение». Сохранены неоднозначность редкого глагола в сноске и образ сердца в основном тексте; якоря сносок соотносятся соответственно с «поддержку» и «нераздвоенным сердцем».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:55:31Z'
