base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: ru
  text: Из Завулона — пятьдесят тысяч воинов, пригодных к военной службе, готовых к бою, со всем воинским снаряжением, чтобы оказать поддержку[a] с нераздвоенным сердцем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встать в строй». Употреблённый здесь еврейский глагол редок; он может означать оказание поддержки или присоединение к боевому строю.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «без сердца и сердца» — то есть без раздвоенности в намерениях и преданности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: Из Завулона
  rationale: Предлог מִן указывает на происхождение отряда; форма «из Завулона» естественно обозначает колено, из которого пришли воины.
- source_word: יוֹצְאֵי צָבָא
  choice: воины, способные нести военную службу
  rationale: Буквально выражение говорит о «выходящих на службу/в войско» и идиоматически обозначает людей, пригодных и готовых к военной службе.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: готовых к бою
  rationale: Причастие от ערך передаёт построение или приведение войска в боевой порядок; по-русски смысл ясно выражен оборотом «готовых к бою».
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: со всевозможным оружием
  rationale: כְּלֵי מִלְחָמָה — оружие или воинское снаряжение; «всевозможным» естественно передаёт בְּכָל, не утверждая буквально, что каждый воин имел при себе все виды оружия.
- source_word: חֲמִשִּׁים אָלֶף
  choice: пятьдесят тысяч
  rationale: Прямое соответствие еврейскому числительному.
- source_word: וְלַעֲדֹר
  choice: они пришли поддержать Давида
  rationale: Редкий и спорный глагол в данном контексте может относиться к оказанию поддержки либо к вступлению в строй. Основной текст передаёт контекстуальный смысл поддержки; глагол «пришли» и имя Давида восстановлены из ближайшего контекста главы для естественности русского предложения.
- source_word: בְּלֹא לֵב וָלֵב
  choice: с нераздвоенным сердцем
  rationale: Буквально «без сердца и сердца» — идиома, отрицающая раздвоенность намерений и преданности. Перевод сохраняет образ сердца и ясно передаёт смысл.
theological_decisions:
- issue: Объект поддержки при וְלַעֲדֹר прямо не назван в стихе
  choice: Давида
  alternative: 'не называть объект: «чтобы поддержать»'
  rationale: Во всём отрывке перечисляются пришедшие к Давиду и поддержавшие его; явное имя делает русский текст понятным, не добавляя отдельного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Военная терминология понятна обычному читателю; еврейский образ сердца сохранён, а не заменён отвлечённым словом «искренне».
