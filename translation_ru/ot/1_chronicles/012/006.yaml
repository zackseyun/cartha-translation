lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: Елъузай
  rationale: Личное имя передано транслитерацией; твёрдый знак помогает сохранить раздельное звучание элементов имени и не читать начальную часть как «Елю-».
- source_word: וִירִימוֹת
  choice: Иеримот
  rationale: Личное имя передано в привычной для русского библейского регистра форме; союз при перечислении выражен русской пунктуацией.
- source_word: וּבְעַלְיָה
  choice: Беалия
  rationale: Личное имя транслитерировано с учётом масоретской огласовки; конечный теофорный элемент передан естественной русской формой «-ия».
- source_word: וּשְׁמַרְיָהוּ
  choice: Шемарьяху
  rationale: Сохранена полная форма окончания -יהו (-ьяху), представленная в еврейском тексте.
- source_word: וּשְׁפַטְיָהוּ
  choice: Шефатьягу
  rationale: Имя транслитерировано с сохранением полной формы -יהו; интервокальное ה в последовательности yāhû передано через «г», согласно укоренившейся русской традиции передачи еврейских имён.
- source_word: הַחֲרִיפִי
  choice: харифянин
  rationale: Форма с артиклем обозначает принадлежность к роду или клану; русское образование на «-янин» естественно передаёт такое gentilicum. Выбор «Хариф» непосредственно следует масоретской огласовке חֲרִיפִי.
