base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: ru
  text: Ибо день за днём они приходили к Давиду, чтобы помочь ему, пока не образовался великий стан, подобный Божьему стану.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобный Божьему лагерю»; возможно также: «подобный небесному» или «божественному стану». Еврейское выражение кратко и многозначно.'
    reason: Сохраняет образ стана/лагеря и не снимает неоднозначность сочетания «стан Бога».
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение, связанное с предшествующим повествованием; «ибо» передаёт эту связь в достойном литературном регистре.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: день за днём
  rationale: Выражение обозначает повторяющееся действие в течение последовательных дней; русский оборот естественно передаёт итеративность.
- source_word: יָבֹאוּ
  choice: приходили
  rationale: Имперфект в повествовательном контексте описывает многократное действие в прошлом; русский несовершенный вид сохраняет этот смысл.
- source_word: עַל דָּוִיד
  choice: к Давиду
  rationale: При глаголе движения и последующем указании цели предлог обозначает направленность к Давиду, а не враждебное выступление против него.
- source_word: לְעָזְרוֹ
  choice: чтобы помочь ему
  rationale: Инфинитив с местоименным суффиксом выражает цель прихода.
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: пока не собралось великое войско
  rationale: Конструкция указывает на достигнутый итог постоянного притока людей. מַחֲנֶה может означать военный стан или собравшееся войско; в русском контексте «войско» яснее передаёт совокупность прибывших воинов.
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: подобное воинству Божьему
  rationale: Сохранено прямое сравнение и богословская выразительность еврейского генитива без сведения его лишь к значению «огромное».
theological_decisions:
- issue: Значение אֱלֹהִים в сравнении כְּמַחֲנֵה אֱלֹהִים
  choice: Божьему
  alternative: небесному; необычайно великому
  rationale: Наиболее прямо выражение означает принадлежность Богу — «воинство Божье». Такой перевод сохраняет богословскую образность и не подменяет её истолкованием как простого усиления величины.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Ибо» уместно для объяснительной связи; «день за днём» и несовершенный вид естественно передают длительное пополнение. Слово «люди» добавлено по ближайшему контексту для естественности русского предложения, хотя в еврейском подлежащее выражено только формой глагола.
