revisions:
- from: Ибо день за днём к Давиду приходили люди, чтобы помочь ему, пока не собралось великое войско, подобное воинству Божьему.[a]
  to: Ибо день за днём они приходили к Давиду, чтобы помочь ему, пока не образовался великий стан, подобный Божьему стану.[a]
  rationale: 'Исправление устраняет добавленное явное подлежащее и восстанавливает единый образ מַחֲנֶה: «стан» в обеих частях сравнения. Формулировка остаётся современной литературной, передаёт повторяемость прихода и не навязывает толкование выражения «стан Бога».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T11:55:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы итеративность («день за днём»), направленность прихода к Давиду и цель помощи. Однако в перевод внесены два не предусмотренных исходником смысловых сдвига: явное «люди» при невыраженном подлежащем и, существеннее, замена מַחֲנֶה («стан», «лагерь», «ополчение») на «войско». В сравнении מַחֲנֵה אֱלֹהִים следует сохранить тот же образ «стана/лагеря», а не менять его на «воинство».'
  naturalness: «Ибо день за днём к Давиду приходили…» звучит естественно в современном литературном русском с умеренно библейским регистром. «Пока не образовался великий стан» ясно выражает итог постепенного притока и сохраняет образ исходного текста.
  terminology: «Стан» последовательно передаёт מַחֲנֶה в обеих частях стиха. «Божий стан» сохраняет генитивную конструкцию и богословскую образность, не решая заранее, следует ли понимать выражение как Божий, небесный или чрезвычайно великий стан.
  issues:
  - severity: medium
    issue: «Люди» добавлено как подлежащее.
    rationale: Еврейская форма глагола не называет подлежащего. Хотя контекст допускает людей, русское «они» столь же естественно и точнее сохраняет неявность оригинала.
  - severity: high
    issue: מַחֲנֶה передано сначала как «войско», а затем как «воинство».
    rationale: Слово обозначает прежде всего стан, лагерь, ополчение; исходный образ — большой стан, подобный стану Божьему. «Войско/воинство» сужает или меняет образ и нарушает лексический параллелизм.
  - severity: low
    issue: Сноска предлагает «Божий стан», но основной текст использует «воинство Божье».
    rationale: После сохранения «стана» в основном тексте альтернативу лучше сформулировать как «Божьему лагерю» и отдельно отметить возможное «небесному/божественному стану».
  revised_text: Ибо день за днём они приходили к Давиду, чтобы помочь ему, пока не образовался великий стан, подобный Божьему стану.[a]
