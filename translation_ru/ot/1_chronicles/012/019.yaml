base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: ru
  text: 'И Дух облёк Амасая[a], начальника Тридцати, и он сказал: «Мы — твои, Давид, и мы с тобой, сын Иессея! Мир, мир тебе, и мир твоим помощникам[b], потому что твой Бог помогает тебе[c]». Давид принял их и поставил их во главе отряда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «дух облёк Амасая» или «Дух сошёл на Амасая». Буквально по-еврейски: «дух облёк Амасая».'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «твоему помощнику»; в еврейском тексте стоит единственное число, которое может иметь собирательное значение.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «потому что твой Бог помог тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה אֶת עֲמָשַׂי
  choice: И Дух облёк Амасая
  rationale: Сохранена выразительная еврейская метафора с глаголом לָבַשׁ («облекать»). Заглавная буква передаёт наиболее вероятное указание на Божьего Духа, а отсутствие артикля и возможная более общая трактовка отмечены в сноске.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: начальника Тридцати
  rationale: רֹאשׁ означает «глава, начальник»; «Тридцать» передано как название известной воинской группы.
- source_word: לְךָ דָוִיד
  choice: Мы — твои, Давид
  rationale: Краткая именная формула выражает принадлежность и преданность Давиду; по-русски смысл естественно передаётся с подразумеваемой связкой.
- source_word: וְעִמְּךָ בֶן יִשַׁי
  choice: и мы с тобой, сын Иессея
  rationale: В еврейском это краткая безглагольная фраза; повторение «мы» делает параллелизм ясным и естественным по-русски.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: Мир, мир тебе
  rationale: Сохранён эмфатический повтор שָׁלוֹם, не сведённый к одному пожеланию.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: и мир твоим помощникам
  rationale: Форма единственного числа может иметь собирательное значение; контекст группы сторонников Давида поддерживает множественное число. Буквальная альтернатива дана в сноске.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: потому что твой Бог помогает тебе
  rationale: Перфект допускает как результативное «помог», так и контекстуальное утверждение о действующей поддержке Бога; основным выбран естественный русский презенс.
- source_word: וַיְקַבְּלֵם
  choice: Давид принял их
  rationale: קבל означает «принять» или «допустить»; нейтральное «принял» не добавляет идеи формальной церемонии.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: назначил начальниками отрядов
  rationale: Буквальное «поставил/дал среди глав отряда» обозначает назначение на руководящие должности; גְּדוּד здесь относится к воинским подразделениям.
theological_decisions:
- issue: Относится ли רוּחַ к Божьему Духу или к духу/внутреннему побуждению
  choice: Дух
  alternative: дух; дух сошёл на Амасая
  rationale: В контексте Паралипоменон внезапное вдохновенное провозглашение и идиома «дух облёк» вероятнее всего указывают на действие Божьего Духа. При этом грамматическая неопределённость не скрыта и отмечена в сноске.
- issue: Временной оттенок עֲזָרְךָ
  choice: Бог помогает тебе
  alternative: Бог помог тебе
  rationale: Форма может обозначать уже оказанную помощь либо её сохраняющийся результат. Настоящее время передаёт действующую Божью поддержку, а альтернативное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Сохранены лаконизм формулы верности, повтор «мир, мир» и необычная исходная метафора «Дух облёк». Двоеточие вводит вдохновенную речь без добавления отсутствующего в еврейском тексте глагола «сказал».
