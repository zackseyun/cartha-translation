  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: ru
  text: 'Также и те, кто находился неподалёку от них, вплоть до Иссахара, Завулона и Неффалима[b], привозили на ослах, верблюдах, мулах и крупном скоте продовольствие[a]: муку, инжирные лепёшки, сушёный виноград[c], вино и масло, а также множество крупного и мелкого скота, потому что в Израиле была радость.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб»; здесь это слово обобщённо обозначает продовольствие, перечисленное далее.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «даже до Иссахара, Завулона и Неффалима». Выражение указывает, насколько далеко простиралась область, откуда доставляли припасы.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «изюм»; возможно, имеется в виду спрессованный сушёный виноград.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Также и
  rationale: Передаёт присоединительное значение и лёгкое усиление, продолжая перечень из предыдущего стиха.
- source_word: הַקְּרֹבִים אֲלֵיהֶם
  choice: те, кто жил неподалёку от них
  rationale: Сохраняет буквальный смысл «находившиеся близко к ним», не сужая его до формального понятия соседей.
- source_word: עַד יִשָּׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: вплоть до Иссахара, Завулона и Неффалима
  rationale: עַד обозначает предел или протяжённость; перевод сохраняет географический характер выражения и его некоторую синтаксическую неоднозначность.
- source_word: מְבִיאִים
  choice: привозили
  rationale: Причастие в повествовательном контексте выражает продолжавшееся или повторявшееся действие.
- source_word: לֶחֶם
  choice: продовольствие
  rationale: Буквально слово означает «хлеб», но здесь оно обобщённо вводит широкий перечень пищевых запасов.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: на ослах, верблюдах, мулах и быках
  rationale: Предлог בְּ обозначает средство перевозки; בָּקָר здесь понимается как тягловый или вьючный крупный скот, без внесения отсутствующих в тексте повозок.
- source_word: קֶמַח
  choice: муку
  rationale: Обычное значение слова в перечне пищевых припасов.
- source_word: דְּבֵלִים
  choice: инжирные лепёшки
  rationale: Речь идёт о спрессованном инжире, подготовленном для хранения и перевозки.
- source_word: צִמּוּקִים
  choice: сушёный виноград
  rationale: Нейтрально передаёт значение высушенного винограда, не утверждая однозначно, был ли он спрессован в лепёшки.
- source_word: יַיִן וְשֶׁמֶן
  choice: вино и масло
  rationale: Сохраняет общие названия исходного текста; вероятное оливковое происхождение масла не уточняется.
- source_word: בָקָר וְצֹאן לָרֹב
  choice: множество крупного и мелкого скота
  rationale: Передаёт парное обозначение крупного и мелкого домашнего скота и значение изобилия.
