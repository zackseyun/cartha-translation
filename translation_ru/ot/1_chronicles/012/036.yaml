lexical_decisions:
- source_word: וּמִן הַדָּנִי
  choice: Из колена Дана
  rationale: Сочетание предлога с этнонимом в данном перечне обозначает людей из колена Дана. Такой перевод естественен по-русски и не создаёт ошибочного впечатления, будто речь идёт об одном данитянине.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: выстроенных для битвы
  rationale: Причастный оборот от ערך передаёт построение войска в боевой порядок и связанную с ним готовность вступить в бой. Формулировка сохраняет конкретный образ боевого строя.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: двадцать восемь тысяч шестьсот
  rationale: Прямое воспроизведение еврейского количественного числительного в нормативной русской форме.
- source_word: '[implicit human referent]'
  choice: человек
  rationale: В еврейском тексте исчисляемые воины подразумеваются. Добавление слова «человек» необходимо для естественного русского синтаксиса и не меняет содержания.
