base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: ru
  text: Из сынов Иссахара — люди, понимавшие времена[a] и знавшие, что следует делать Израилю. Их предводителей было двести, и все их братья следовали их распоряжениям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «обладавшие пониманием времён»; имеется в виду проницательность, позволявшая верно оценить исторический момент.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по их устам» — то есть согласно их слову или распоряжениям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: Из сынов Иссахара
  rationale: Предлог מִן обозначает принадлежность к перечисляемому племенному отряду; «сынов Иссахара» сохраняет древнееврейское обозначение племени, а начальный союз естественно не передаётся в русском перечне.
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: люди, понимавшие времена
  rationale: Сочетание выражает способность осмыслять времена и верно распознавать требования исторического момента. Формулировка естественна по-русски и не сужает значение до календарных сроков или времён года.
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: и знавшие, что следует делать Израилю
  rationale: Инфинитив לָדַעַת раскрывает практический результат или цель их понимания, а имперфект יַעֲשֶׂה в контексте указывает на надлежащее действие, а не на предсказание будущего.
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: Их глав было двести
  rationale: רָאשֵׁיהֶם обозначает глав или руководителей. «Глав» сохраняет образ и соответствует возвышенному историческому регистру, оставаясь понятным современному читателю.
- source_word: וְכָל אֲחֵיהֶם
  choice: и все их братья
  rationale: Буквальное «братья» в данном военном и племенном контексте относится к мужчинам-соплеменникам; перевод сохраняет родственный язык оригинала.
- source_word: עַל־פִּיהֶם
  choice: действовали по их указанию
  rationale: Буквально «по их устам» — идиома подчинения слову, решению или распоряжению. Выбранная формулировка ясно передаёт руководство, не усиливая его до обязательно жёсткого военного командования.
