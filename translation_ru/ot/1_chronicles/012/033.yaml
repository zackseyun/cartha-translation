revisions:
- from: Из сынов Иссахара — люди, понимавшие времена[a] и знавшие, что следует делать Израилю. Их глав было двести, и все их братья действовали по их указанию[b].
  to: Из сынов Иссахара — люди, понимавшие времена[a] и знавшие, что следует делать Израилю. Их предводителей было двести, и все их братья следовали их распоряжениям[b].
  rationale: Заменено двусмысленное «их глав» на естественное «их предводителей». Идиома עַל־פִּיהֶם передана как следование распоряжениям, что сохраняет смысл подчинения руководству без добавления конкретного действия или чрезмерного военного оттенка. Содержание, численность и историческая неопределённость выражения «понимавшие времена» сохранены.
