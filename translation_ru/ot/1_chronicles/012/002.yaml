lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: вооружены луками
  rationale: Причастное сочетание буквально обозначает людей, носивших или применявших лук; такой перевод ближе к форме еврейского текста, чем существительное «лучники».
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: умели действовать как правой, так и левой рукой
  rationale: Формы указывают на способность умело пользоваться обеими руками, а не только на природную право- или леворукость.
- source_word: בָּאֲבָנִים
  choice: бросая камни
  rationale: В военном контексте речь идёт о применении камней как метательного оружия; слово «праща» не добавлено, поскольку в стихе она прямо не названа.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: пуская стрелы из лука
  rationale: Естественная русская формулировка ясно передаёт применение стрел посредством лука.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: из братьев Саула
  rationale: Сохранено прямое значение слова «братья», а возможный более широкий смысл родства пояснён в сноске.
- source_word: מִבִּנְיָמִן
  choice: из колена Вениамина
  rationale: Предлог указывает на происхождение или принадлежность; добавление «колена» естественно выражает названную здесь племенную принадлежность.
