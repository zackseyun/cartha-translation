  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: ru
  text: Они были вооружены луками и умели пользоваться как правой, так и левой рукой, бросая камни и пуская стрелы из лука; они были из числа братьев Саула[a], из колена Вениамина.
