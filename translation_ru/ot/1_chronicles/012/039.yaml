  text: כָּל אֵ֜לֶּה אַנְשֵׁ֣י מִלְחָמָה֮ עֹדְרֵ֣י מַעֲרָכָה֒ בְּ/לֵבָ֤ב שָׁלֵם֙ בָּ֣אוּ חֶבְר֔וֹנָ/ה לְ/הַמְלִ֥יךְ אֶת דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וְ֠/גַם כָּל שֵׁרִ֧ית יִשְׂרָאֵ֛ל לֵ֥ב אֶחָ֖ד לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: ru
  text: Все они были воинами, выстроившимися в боевой порядок; они пришли в Хеврон всем сердцем, чтобы поставить Давида царём над всем Израилем. И весь остальной Израиль[a] был единодушен в желании поставить Давида царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весь остаток Израиля». В данном контексте, вероятнее всего, имеются в виду все остальные израильтяне, а не «остаток» в особом пророческом смысле.'
    reason: Лексическая альтернатива для שְׁאֵרִית и предупреждение о возможном богословском переосмыслении.
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: воинами
  rationale: Передаёт военное значение сочетания «люди войны» естественным и современным русским словом, не ослабляя смысла.
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: способными выстроиться к битве
  rationale: Причастная конструкция связана с построением боевого порядка; перевод сохраняет оттенок организованного построения, а не только общей готовности сражаться.
- source_word: בְּלֵבָב שָׁלֵם
  choice: от всего сердца
  rationale: Естественное русское выражение передаёт полноту и нераздельность намерения и сохраняет образ сердца.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: пришли в Хеврон
  rationale: Направительный суффикс при названии города обозначает движение к Хеврону.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: поставить Давида царём
  rationale: Каузатив глагола מלך означает сделать или установить царём; формулировка не добавляет не упомянутого в тексте обряда коронации.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Прямо и естественно выражает царскую власть над всем народом.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: весь остальной Израиль
  rationale: В данном повествовательном контексте речь идёт об остальных израильтянах, не включённых в перечисленные отряды; перевод не привносит специального пророческого смысла «остатка».
- source_word: לֵב אֶחָד
  choice: был единодушен
  rationale: Естественно передаёт идиому «одно сердце» как единство общего намерения; образ сердца уже явно сохранён в первой части стиха.
theological_decisions:
- issue: Возможный богословский оттенок слова שֵׁרִית («остаток»)
  choice: весь остальной Израиль
  alternative: весь остаток Израиля
  rationale: Непосредственный контекст подводит итог общенародной поддержке Давида, поэтому здесь слово обозначает остальных представителей Израиля. Вариант «остаток» мог бы без достаточного основания вызвать ассоциацию с пророческим учением об остатке.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Сохранён образ сердца в выражении «от всего сердца», а параллельное לֵב אֶחָד передано естественным русским «единодушен». Синтаксис разделён на три предложения для ясности без изменения логических связей исходного текста.
