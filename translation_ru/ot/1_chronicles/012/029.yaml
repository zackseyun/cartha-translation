  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: ru
  text: И Садок, молодой человек, храбрый воин, и из его отцовского дома — двадцать два начальника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדוֹק
  choice: Садок
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: נַעַר
  choice: молодой человек
  rationale: В данном военном перечне слово обозначает молодого мужчину; перевод сохраняет возрастной оттенок, не добавляя значения «слуга» или «воин».
- source_word: גִּבּוֹר חָיִל
  choice: могучий доблестью
  rationale: Передаёт силу и доблесть устойчивого еврейского сочетания, сохраняя его именную конструкцию и не сужая значение до формального воинского звания.
- source_word: בֵית אָבִיו
  choice: его отцовский дом
  rationale: Сохраняет образ еврейского выражения, обозначающего родовую семью по отцовской линии.
- source_word: שָׂרִים
  choice: начальника
  rationale: В контексте военного перечня речь идёт о людях, обладавших властью и командным положением; «начальники» достаточно широко передаёт это значение.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: двадцать два
  rationale: Прямая передача количественного числительного.
- source_word: וְ / וּ
  choice: и
  rationale: Повтор союзов сохраняет присоединительную, перечневую структуру еврейского текста.
