base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: ru
  text: Во главе был Ахиезер, а также Иоас — сыновья Шемаа из Гивы; Иезиил[a] и Фелет — сыновья Азмавета; Бераха[b] и Ииуй из Анафофа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это имя можно также передать как «Изиил».
    reason: lexical_alternative
  - marker: b
    text: Имя «Бераха» также можно передать как «Берака».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: Во главе был
  rationale: В перечне רֹאשׁ обозначает главного, стоящего во главе человека; связка «был» естественно передаёт именную древнееврейскую конструкцию.
- source_word: אֲחִיעֶזֶר וְיוֹאָשׁ
  choice: Ахиезер, затем Иоас
  rationale: Имена переданы в привычной русской библейской форме; «затем» ясно показывает последовательность после указания главы списка, хотя буквально союз означает «и».
- source_word: בְּנֵי הַשְּׁמָעָה הַגִּבְעָתִי
  choice: сыновья Шемаа из Гивы
  rationale: בְּנֵי — обычное родословное обозначение сыновей; форма жителя местности передана естественным русским оборотом «из Гивы» и по смыслу относится к Шемаа.
- source_word: ויזואל וָפֶלֶט
  choice: Иезиил и Фелет
  rationale: Личные имена транслитерированы с учётом сложившихся русских библейских форм; вариант первого имени отмечен в сноске.
- source_word: בְּנֵי עַזְמָוֶת
  choice: сыновья Азмавета
  rationale: Стандартная родословная конструкция; имя передано в традиционной русской форме.
- source_word: וּבְרָכָה
  choice: Бераха
  rationale: Транслитерация сохраняет согласный כ как «х»; встречающийся вариант имени отмечен в сноске.
- source_word: וְיֵהוּא הָעֲנְּתֹתִי
  choice: Ииуй из Анафофа
  rationale: Имя дано в принятой русской библейской форме, а этникон передан понятным обозначением происхождения из Анафофа.
theological_decisions: []
