  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: ru
  text: Это те, кто перешли Иордан в первом месяце, когда он разлился, затопив все свои берега, и обратили в бегство всех жителей долин — к востоку и к западу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все долины». Здесь это метонимия, обозначающая их жителей, поскольку глагол означает «обратили в бегство». Слова «к востоку и к западу» могут указывать либо на направление бегства, либо на расположение долин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Это те
  rationale: Эмфатическая формула отождествления естественно передаётся по-русски словами «Это те»; существительное «мужчины» в еврейском тексте отсутствует и не требуется благодаря контексту.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: кто перешёл Иордан
  rationale: Глагол עָבַר имеет обычное значение «переходить, пересекать»; форма единственного числа сказуемого допустима при собирательном «те, кто» в современном русском.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: в первом месяце
  rationale: Прямая и естественная передача временного выражения без добавления календарного толкования.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: когда он выходил из всех своих берегов
  rationale: Оборот описывает разлив Иордана. Русская идиома «выходить из берегов» ясно передаёт смысл, а «из всех своих берегов» сохраняет необычное обобщение כָּל.
- source_word: וַיַּבְרִיחוּ
  choice: и обратил в бегство
  rationale: Порода hифиль выражает причинение бегства; «обратить в бегство» сохраняет военный оттенок и каузативность.
- source_word: אֶת כָּל הָעֲמָקִים
  choice: всех жителей долин
  rationale: Буквально объектом названы «все долины», но одушевлённый объект подразумевается метонимически, поскольку в бегство обращают людей. Добавление «жителей» делает смысл понятным.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: к востоку и к западу
  rationale: Сохраняет обе направительные формы и не уточняет сверх текста, относятся ли направления к долинам либо к бегству их жителей.
