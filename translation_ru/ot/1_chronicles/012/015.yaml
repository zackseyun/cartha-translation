base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: ru
  text: 'Это были потомки Гада, начальники войска: наименьший из них был равен сотне, а наибольший — тысяче.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один к ста, малый; а великий — к тысяче». Это эллиптическое выражение, вероятно, говорит об их боевой силе или эффективности.'
    reason: Сохраняет буквальную, синтаксически сжатую форму еврейского оборота и отмечает подразумеваемый военный смысл, не выдавая его за однозначный.
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: Это были потомки Гада
  rationale: Безглагольное еврейское предложение естественно передано с «были»; «потомки Гада» сохраняет родоплеменное значение выражения «сыны Гада» и звучит современно.
- source_word: רָאשֵׁי הַצָּבָא
  choice: начальники войска
  rationale: רָאשֵׁי буквально обозначает «глав» и в данном военном контексте — руководителей или начальников; «начальники войска» естественно передаёт функцию без излишнего уточнения звания.
- source_word: הַקָּטָן
  choice: меньший из них
  rationale: Сохраняет сравнительное противопоставление «малого» и «великого», не сводя его однозначно к физической силе, возрасту или званию.
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: меньший из них один стоил сотни, а больший — тысячи
  rationale: Еврейская формула эллиптична. Русское «один стоил сотни» кратко и понятно выражает военную доблесть или эффективность, а сноска сохраняет буквальную форму и отмечает неоднозначность.
