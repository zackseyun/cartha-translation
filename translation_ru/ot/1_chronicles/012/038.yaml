base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: ru
  text: А из-за Иордана[a] — из рувимлян, гадитян и половины колена Манассии — насчитывалось сто двадцать тысяч человек со всем военным снаряжением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с другой стороны Иордана». Еврейское выражение допускает передачу с иной географической точки зрения: «с того берега Иордана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: А из-за Иордана
  rationale: Оборот обозначает область по ту сторону Иордана относительно подразумеваемой точки зрения. «Из-за Иордана» кратко и естественно передаёт направление движения, а сноска сохраняет возможность иной географической формулировки.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: из колена Рувима, колена Гада и половины колена Манассии
  rationale: Еврейские формы «рувимит» и «гадит» употреблены собирательно. В современном русском указание на колена звучит ясно и естественно; параллельное построение также устраняет возможную неясность принадлежности половины колена.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: воины со всевозможным оружием для войны
  rationale: כְּלֵי в военном контексте означает снаряжение или оружие, а בְּכֹל указывает на всю совокупность либо разнообразие. Слово «воины» добавлено как естественно подразумеваемое обозначение исчисляемых людей, тогда как «со всевозможным оружием» сохраняет конкретный образ вооружения.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: сто двадцать тысяч
  rationale: Прямое и нормативное воспроизведение количественного числительного в современном русском языке.
