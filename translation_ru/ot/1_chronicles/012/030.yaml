source:
  edition: WLC
  text: וּ/מִן בְּנֵ֧י בִנְיָמִ֛ן אֲחֵ֥י שָׁא֖וּל שְׁלֹ֣שֶׁת אֲלָפִ֑ים וְ/עַד הֵ֨נָּה֙ מַרְבִּיתָ֔/ם שֹׁמְרִ֕ים מִשְׁמֶ֖רֶת בֵּ֥ית שָׁאֽוּל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: ru
  text: И из сынов Вениамина, братьев[a] Саула, — три тысячи; до того времени большинство из них стояло на страже дома Саула[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родичей Саула», «родственников Саула». Еврейское слово «братья» может обозначать не только родных братьев, но и более широкий круг соплеменников или родственников.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Саула» может означать семью и двор Саула либо, шире, его царский род и его интересы.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: И из
  rationale: Союз и предлог продолжают перечень племён и сохраняют присоединительную структуру еврейского текста.
- source_word: בְּנֵי בִנְיָמִן
  choice: сынов Вениамина
  rationale: Сохранён родоплеменной оборот оригинала; в контексте перечня он звучит понятно и достаточно естественно.
- source_word: אֲחֵי שָׁאוּל
  choice: братьев Саула
  rationale: Буквальный эквивалент сохраняет родственный образ оригинала, а возможное более широкое значение поясняется в сноске.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: три тысячи
  rationale: Прямая и естественная передача числительного.
- source_word: וְעַד הֵנָּה
  choice: до того времени
  rationale: В историческом повествовании выражение указывает на период до описываемого момента, а не до времени читателя.
- source_word: מַרְבִּיתָם
  choice: большинство из них
  rationale: Точно и современно передаёт значение большей части группы.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: стояло на страже
  rationale: Естественный русский оборот передаёт длительное исполнение охранной обязанности и воспроизводит сочетание однокоренных слов без неуклюжей буквальности.
- source_word: בֵּית שָׁאוּל
  choice: дома Саула
  rationale: 'Слово «дом» сохраняет широту еврейского выражения: речь может идти о семье, дворе, династии или её интересах.'
theological_decisions:
- issue: Объём понятия «дом Саула»
  choice: Сохранить широкое выражение «дом Саула»
  alternative: «династия Саула» или «семья Саула»
  rationale: Оригинал не требует выбора только одного из возможных значений; более узкий перевод преждевременно снял бы смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, перечневым ритмом. Инверсия «из сынов Вениамина» и тире перед числом сохраняют структуру военного списка, не делая фразу архаичной.
