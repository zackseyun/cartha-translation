  source_fidelity: 'Перевод точно передаёт последовательность и основные элементы еврейского текста: присоединительное «И из», племенную формулу «сынов Вениамина», численность, временную границу «до того времени», большинство группы и их охранную/сторожевую обязанность по отношению к дому Саула. «Стояло на страже» уместно передаёт שֹׁמְרִים מִשְׁמֶרֶת без неоправданного сужения смысла до физической охраны здания.'
