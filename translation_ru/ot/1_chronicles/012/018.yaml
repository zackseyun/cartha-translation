  text: וַ/יֵּצֵ֣א דָוִיד֮ לִ/פְנֵי/הֶם֒ וַ/יַּ֨עַן֙ וַ/יֹּ֣אמֶר לָ/הֶ֔ם אִם לְ/שָׁל֞וֹם בָּאתֶ֤ם אֵלַ/י֙ לְ/עָזְרֵ֔/נִי יִֽהְיֶה לִּ֧/י עֲלֵי/כֶ֛ם לֵבָ֖ב לְ/יָ֑חַד וְ/אִֽם לְ/רַמּוֹתַ֣/נִי לְ/צָרַ֗/י בְּ/לֹ֤א חָמָס֙ בְּ/כַפַּ֔/י יֵ֛רֶא אֱלֹהֵ֥י אֲבוֹתֵ֖י/נוּ וְ/יוֹכַֽח־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: ru
  text: 'Давид вышел к ним, обратился к ним и сказал: «Если вы пришли ко мне с миром, чтобы помочь мне, то моё сердце будет едино с вами. Но если вы пришли, чтобы предать[a] меня врагам, хотя на моих руках нет насилия, пусть Бог наших отцов увидит и рассудит[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обмануть». Еврейский глагол может обозначать коварный обман; здесь «предать» соответствует контексту передачи Давида врагам.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обличит»; возможно также: «решит спор». Еврейский глагол может означать обличение, разбирательство или вынесение решения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא ... לִפְנֵיהֶם
  choice: вышел к ним
  rationale: Передаёт движение Давида навстречу группе и естественно выражает пространственный смысл «вышел перед ними / в их присутствие», не перегружая русскую фразу буквализмом.
- source_word: וַיַּעַן וַיֹּאמֶר לָהֶם
  choice: обратился к ним и сказал
  rationale: Парная повествовательная формула сохранена двумя глаголами, но «ответил» не употреблено, поскольку в непосредственном контексте не приведена предшествующая речь.
- source_word: לְשָׁלוֹם
  choice: с миром
  rationale: Сохраняет смысл мирного и искреннего намерения и обычную библейскую формулу без архаизации.
- source_word: לְעָזְרֵנִי
  choice: чтобы помочь мне
  rationale: Прямо и естественно передаёт инфинитив цели от עזר.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: моё сердце будет едино с вами
  rationale: Естественно передаёт идиоматический образ единодушия и солидарности, сохраняя слово «сердце» и не сводя выражение лишь к практическому союзу.
- source_word: לְרַמּוֹתַנִי
  choice: предать меня
  rationale: В породе пиэль глагол может означать коварный обман; военный контекст и упоминание врагов делают «предать» наиболее точным контекстуальным выбором. Альтернатива отмечена в сноске.
- source_word: לְצָרַי
  choice: моим врагам
  rationale: Ясный современный эквивалент обозначения враждебных противников.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: хотя на моих руках нет насилия
  rationale: Сохраняет образ рук как сферы вины и значение חמס как насилия или злодеяния; союз «хотя» выражает подразумеваемое уступительное отношение.
- source_word: יֵרֶא אֱלֹהֵי אֲבוֹתֵינוּ
  choice: пусть Бог наших отцов увидит
  rationale: Форма понята как торжественный призыв к Богу, а не как простое предсказание. «Бог наших отцов» сохраняет традиционную форму исходного выражения.
- source_word: וְיוֹכַח
  choice: и рассудит
  rationale: Глагол допускает значения обличения, решения спора и вынесения суждения. «Рассудит» естественно передаёт обращение к Богу как к арбитру, не устраняя многозначности полностью; варианты указаны в сноске.
theological_decisions:
- issue: Характер заключительного обращения к Богу
  choice: пусть Бог наших отцов увидит и рассудит
  alternative: Бог наших отцов увидит и рассудит; пусть Бог наших отцов увидит и обличит
  rationale: В условном предостережении формы глаголов естественно звучат как призыв к Божьему разбирательству. «Пусть» сохраняет характер обращения, не превращая его в безусловное предсказание, а «рассудит» соответствует судебному контексту, сохраняя в сноске возможность значения «обличит».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис ясен для широкого читателя; сохранены ключевые образы сердца, рук и Бога отцов. Сноски поставлены непосредственно после слов, к которым относятся.
