  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: ru
  text: От Неффалима — 1 000 военачальников[a], и с ними — 37 000 человек со щитами[b] и копьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальников», «предводителей».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать большой щит.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: От Неффалима
  rationale: В перечне племён союз וְ естественно передаётся структурой списка без отдельного «и»; предлог מִן указывает на происхождение от племени Неффалима.
- source_word: שָׂרִים
  choice: военачальников
  rationale: В контексте военного сбора слово обозначает начальников или предводителей; «военачальники» ясно передаёт военную функцию, не закрепляя за ними чрезмерно узкое звание.
- source_word: אָלֶף
  choice: 1 000
  rationale: Числовая запись удобна и уместна в перечне воинских сил.
- source_word: וְעִמָּהֶם
  choice: а с ними
  rationale: Передаёт присоединение более многочисленного отряда к упомянутым военачальникам и естественно звучит по-русски.
- source_word: בְּצִנָּה
  choice: с большими щитами
  rationale: צִנָּה обозначает щит, нередко большой щит; здесь конструкция с בְ описывает вооружение воинов.
- source_word: וַחֲנִית
  choice: и копьями
  rationale: חֲנִית — обычное обозначение копья; множественное число по-русски согласуется с группой из 37 000 воинов.
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: 37 000 человек
  rationale: Числовая форма соответствует стилю военного перечня; слово «человек» добавлено для естественности и явно выражает подразумеваемое исчисляемое существительное.
