  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: ru
  text: Из половины колена Манассии — восемнадцать тысяч человек, названных поимённо, чтобы прийти и поставить Давида царём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: Из половины колена Манассии
  rationale: חֲצִי означает «половина», а מַטֵּה в племенном и военном контексте — «колено». Предлог מֵ передан словом «из»; союз וּ естественно опущен в изолированном стихе, поскольку русское начало перечня не требует «и».
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: восемнадцать тысяч человек
  rationale: Числительное передано прямо; слово «человек» добавлено для естественности русского счётного оборота и ясно подразумевается контекстом.
- source_word: אֲשֶׁר נִקְּבוּ בְּ/שֵׁמוֹת
  choice: поимённо назначенных
  rationale: Сохранены страдательное значение формы נִקְּבוּ и указание בְּשֵׁמוֹת на индивидуальное обозначение. «Назначенных» естественно в данном контексте, а сноска сохраняет более буквальную возможность «названных по именам».
- source_word: לָ/בוֹא
  choice: прийти
  rationale: Инфинитив цели сохранён как инфинитив и зависит от «назначенных».
- source_word: לְ/הַמְלִיךְ אֶת דָּוִיד
  choice: поставить Давида царём
  rationale: Каузативная форма מלך означает сделать или установить царём. «Поставить царём» передаёт это прямо, не сужая смысл до обряда коронации.
