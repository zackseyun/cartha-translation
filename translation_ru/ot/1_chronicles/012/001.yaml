revisions:
- from: Вот те, кто пришёл к Давиду в Циклаг, когда он ещё был вынужден скрываться из-за Саула, сына Киса[a]. Они принадлежали к числу могучих воинов[b], помогавших в битве.
  to: Вот те, кто пришёл к Давиду в Циклаг, когда он всё ещё был вынужден держаться в стороне из-за Саула, сына Киса[a]; они были среди могучих воинов[b], помогавших в войне.
  rationale: Заменено толковательное «скрываться» на более нейтральное «держаться в стороне», чтобы сохранить неопределённость עָצוּר. Также «в битве» заменено на «в войне» в соответствии с הַמִּלְחָמָה. Сноска a уточнена так, чтобы отражать лексическую неопределённость, не предлагая реконструкцию обстоятельств как смысл самого слова.
