base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: ru
  text: Вот те, кто пришёл к Давиду в Циклаг, когда он всё ещё был вынужден держаться в стороне из-за Саула, сына Киса[a]; они были среди могучих воинов[b], помогавших в войне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он всё ещё был удерживаем» или «стеснён из-за Саула, сына Киса»; еврейское слово не уточняет характер этого ограничения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сильных мужей»; еврейское слово обозначает доблестных воинов или героев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот те
  rationale: Вводит новый перечень; «вот те» естественно передаёт указательное значение אֵלֶּה и функцию начала раздела, не добавляя временного «теперь».
- source_word: הַבָּאִים אֶל דָּוִיד לְצִיקְלַג
  choice: кто пришёл к Давиду в Циклаг
  rationale: Субстантивированное причастие естественно передано относительным придаточным; לְצִיקְלַג в данном контексте указывает место прибытия к Давиду.
- source_word: עוֹד עָצוּר
  choice: когда он ещё был вынужден скрываться
  rationale: עוֹד обозначает продолжающееся состояние, а עָצוּר — стеснённость или ограниченность положения. В контексте преследования Давида русское выражение передаёт вынужденное удаление от обычной жизни, не утверждая буквального заключения.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: из-за Саула, сына Киса
  rationale: מִפְּנֵי здесь выражает причину или угрозу, исходящую от Саула; «из-за» ясно и естественно передаёт эту связь.
- source_word: בַּגִּבּוֹרִים
  choice: к числу могучих воинов
  rationale: גִּבּוֹרִים обозначает доблестных, сильных бойцов; «могучие воины» сохраняет военный смысл и приподнятый регистр.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: помогавших в битве
  rationale: Конструкция описывает их как оказывавших военную помощь; причастный оборот звучит по-русски естественнее буквального «помощники войны».
