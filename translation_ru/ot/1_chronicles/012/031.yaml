base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: ru
  text: Из сыновей Ефрема — двадцать тысяч восемьсот доблестных воинов, людей именитых[a] в своих родах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «людей имён»; то есть известных, выдающихся людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Из
  rationale: Предлог вводит очередную группу в продолжающемся перечне; русская структура списка не требует отдельной передачи соединительного וּ.
- source_word: בְּנֵי אֶפְרַיִם
  choice: сыновей Ефрема
  rationale: Сохраняет генеалогическую форму еврейского выражения, которое здесь обозначает представителей колена Ефрема.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: двадцать тысяч восемьсот
  rationale: Точно передаёт указанное число словами в естественной русской форме.
- source_word: גִּבּוֹרֵי חַיִל
  choice: доблестных воинов
  rationale: В контексте военного сбора выражение обозначает людей, отличающихся воинской силой, отвагой и способностью; этот вариант естественен по-русски и сохраняет военный смысл.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: людей именитых
  rationale: Буквально «люди имён»; идиома указывает на известных, заметных людей. «Именитых» сохраняет почётный оттенок и звучит достойно.
- source_word: לְבֵית אֲבוֹתָם
  choice: в своих родовых домах
  rationale: Передаёт отнесённость этих людей к патрилинейным родовым объединениям. «Родовые дома» понятнее современному читателю, чем буквальное «дома отцов».
