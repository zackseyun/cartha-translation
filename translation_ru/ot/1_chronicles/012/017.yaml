id: 1CH.12.17
reference: 1 Chronicles 12:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ מִן בְּנֵ֤י בִנְיָמִן֙ וִֽ/יהוּדָ֔ה עַד לַ/מְצָ֖ד לְ/דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/017.yaml
  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: ru
  text: Некоторые из потомков Вениамина и Иуды[a] пришли к Давиду в крепость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из сынов Вениамина и Иуды». Еврейская конструкция указывает, что пришли лишь некоторые представители этих колен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в укреплённое убежище». Еврейское слово обозначает укреплённое, защищённое место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Глагол בוא в повествовательной форме обозначает прибытие к месту, где находился Давид, и продвигает рассказ вперёд.
- source_word: מִן
  choice: некоторые из
  rationale: 'Предлог имеет партитивное значение: речь идёт не обо всех представителях этих колен, а о части из них.'
- source_word: בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: из потомков Вениамина и Иуды
  rationale: В данном контексте «сыны» обозначает представителей соответствующих колен. «Потомки» естественно передаёт этот смысл по-русски и восполняет подразумеваемую связь с Иудой, не меняя объёма высказывания.
- source_word: עַד לַמְצָד
  choice: в крепость
  rationale: При глаголе движения עַד указывает на конечный пункт, а מְצָד — на укреплённое место или защищённое убежище. Русское «в крепость» естественно выражает прибытие внутрь такого места.
- source_word: לְדָוִיד
  choice: к Давиду
  rationale: Предлог לְ указывает на Давида как на человека, к которому направлялись пришедшие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранён простой повествовательный строй. «Потомки» употреблено вместо буквального «сыны», поскольку речь идёт о представителях колен, а «крепость» кратко и понятно передаёт характер места.
