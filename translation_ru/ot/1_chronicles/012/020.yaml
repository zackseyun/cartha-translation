id: 1CH.12.20
reference: 1 Chronicles 12:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: ru
  text: 'И из племени Манассии некоторые перешли на сторону Давида[a], когда он пришёл с филистимлянами сражаться против Саула. Однако они им не помогли, потому что правители филистимлян, посоветовавшись, отослали Давида, сказав: «Он может перейти на сторону своего господина Саула ценой наших голов»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пали к Давиду»; это древнееврейское выражение означает перейти на чью-либо сторону или присоединиться к кому-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «нашими головами», то есть ценой наших жизней, к нашей гибели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: И из племени Манассии некоторые
  rationale: Предлог מן имеет партитивное значение; слово «некоторые» естественно выражает подразумеваемую часть колена, а «племя» поясняет, что Манассия здесь — название колена Израиля.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: перешли на сторону Давида
  rationale: Военно-политическая идиома означает присоединение к чьей-либо стороне, а не буквальное падение. Формулировка сохраняет смысл, не усиливая оттенок предательства словом «перебежали».
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: когда он пришёл с филистимлянами сражаться против Саула
  rationale: Временная конструкция с ב передаёт «когда он пришёл»; עִם обозначает совместное движение, עַל — направленность против Саула, а לַמִּלְחָמָה — цель похода.
- source_word: וְלֹא עֲזָרֻם
  choice: Однако они им не помогли
  rationale: Сохранено местоимение третьего лица множественного числа без добавления отсутствующего в тексте уточнения; вероятнее всего, оно относится к филистимлянам.
- source_word: כִּי בְעֵצָה
  choice: потому что ... посоветовавшись
  rationale: כִּי вводит причину, а בְעֵצָה указывает на принятое после совета или совещания решение.
- source_word: שִׁלְּחֻהוּ
  choice: отослали Давида
  rationale: Порода пиэль глагола שלח в контексте означает удалить или отослать из войска. Имя повторено вместо местоимения ради ясности русского текста.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: правители филистимлян
  rationale: סֶרֶן — особый титул правителей филистимских городов; нейтральное «правители» понятно современному читателю и не привносит недоказанную военную должность.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: Он может перейти на сторону своего господина Саула
  rationale: Повторная идиома с נפל обозначает переход на другую сторону. Имперфект в речи выражает опасение или возможность; «может перейти» сохраняет эту модальность. «Господин» передаёт политико-служебное отношение Давида к Саулу без богословского оттенка.
- source_word: בְּרָאשֵׁינוּ
  choice: ценой наших голов
  rationale: Сохранён яркий образ исходного текста; по смыслу речь идёт о смертельной опасности и возможной расплате жизнью.
