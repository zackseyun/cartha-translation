lexical_decisions:
- source_word: מִן בְּנֵי שִׁמְעוֹן
  choice: Из сыновей Симеона
  rationale: Сохраняет выражение родства и указывает, из какого колена происходил воинский отряд.
- source_word: גִּבּוֹרֵי חַיִל
  choice: доблестных воинов
  rationale: Передаёт устойчивое обозначение сильных, способных и отважных бойцов; в данном военном перечне слово «воинов» естественно уточняет смысл.
- source_word: לַצָּבָא
  choice: готовых к военной службе
  rationale: Предлог ל обозначает предназначение или пригодность, а צבא здесь относится к организованной военной службе; формулировка естественно связывает выражение с перечисляемыми людьми.
- source_word: שִׁבְעַת אֲלָפִים וּמֵאָה
  choice: 7 100
  rationale: Точно передаёт число семь тысяч сто в принятом современном русском цифровом оформлении.
