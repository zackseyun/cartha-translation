lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָ֧ה
  choice: и Ишмаия
  rationale: Союз וְ продолжает перечень сторонников Давида; имя передано в принятой русской библейской форме «Ишмаия».
- source_word: הַ/גִּבְעוֹנִ֛י
  choice: из Гаваона
  rationale: Форма принадлежности указывает на происхождение или связь с Гаваоном; естественная русская конструкция избегает неоднозначного этнонима «гаваонитянин».
- source_word: גִּבּ֥וֹר
  choice: могучий воин
  rationale: В контексте перечня воинов слово обозначает сильного, доблестного бойца; этот вариант передаёт и силу, и военный контекст.
- source_word: בַּ/שְּׁלֹשִׁ֖ים
  choice: среди тридцати
  rationale: Предлог בְּ естественно указывает на принадлежность к элитной группе, известной как «тридцать», но возможен и более буквальный оттенок «из числа тридцати».
- source_word: וְ/עַל הַ/שְּׁלֹשִֽׁים
  choice: и начальник над тридцатью
  rationale: Предлог עַל здесь, вероятнее всего, выражает руководство или более высокий ранг по отношению к группе; добавление «начальник» делает подразумеваемое отношение естественным по-русски, не устраняя его вероятностный характер.
