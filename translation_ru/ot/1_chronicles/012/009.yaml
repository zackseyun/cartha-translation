base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: ru
  text: Некоторые из гадитян отделились и перешли к Давиду в крепости в пустыне[a]. Это были могучие воины, люди войска, готовые к битве и умевшие обращаться со щитом и копьём[b]. Лица у них были как у львов, а сами они были быстры, как газели на горах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к крепости в пустыне». Еврейский оборот допускает понимание крепости как направления движения или как места прибытия.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «располагавшие щит и копьё [для боя]»; то есть подготовленные и умелые в бою.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: Некоторые из гадитян
  rationale: Предлог מִן с обозначением принадлежности к Гаду указывает, что речь идёт о части людей из колена Гада, а не обо всём колене.
- source_word: נִבְדְּלוּ אֶל דָּוִיד
  choice: отделились и пришли к Давиду
  rationale: Форма Niphal глагола בדל выражает отделение; сочетание с אֶל דָּוִיד указывает на движение к Давиду. Русская конструкция передаёт оба элемента без уточнения их мотивов.
- source_word: לַמְצַד מִדְבָּרָה
  choice: в крепость в пустыне
  rationale: מְצַד означает укреплённое место или крепость. Основной текст естественно понимает оборот как место прибытия, а возможное направительное прочтение отмечено в сноске.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: могучие воины
  rationale: Устойчивое военное выражение обозначает сильных, испытанных бойцов; выбран современный и достойный русский эквивалент.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: люди войска, готовые к битве
  rationale: Перевод сохраняет усиленное указание на военный статус и боевую готовность, не вводя отсутствующей в тексте идеи специального обучения.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: умевшие обращаться со щитом и копьём
  rationale: Причастие от ערך буквально связано с приведением в порядок или построением; в военном контексте оборот описывает готовность и навык владения названным вооружением.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: Лица у них были как у львов
  rationale: Сохранено прямое сравнение с львами и повтор ключевого образа лица, но устранена неестественная для русского буквальная тавтология.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: быстротой они были подобны газелям на горах
  rationale: צְבָאִים обозначает газелей, а לְמַהֵר явно выражает быстроту; перевод делает основание сравнения явным и сохраняет горный образ.
