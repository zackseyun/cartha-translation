  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: ru
  text: и Иодай, предводитель потомков Аарона[a], и с ним три тысячи семьсот человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предводитель Аарона» или «предводитель при Аароне»; вероятно, глава, представлявший священнический дом потомков Аарона.'
    reason: лексическая неоднозначность предлога לְ и сжатой древнееврейской конструкции
lexical_decisions:
- source_word: וִ/יהוֹיָדָע
  choice: и Иодай
  rationale: Союз ו передан как «и», поскольку стих продолжает перечень. Имя יְהוֹיָדָע передано в принятой русской библейской форме «Иодай».
- source_word: הַ/נָּגִיד
  choice: предводитель
  rationale: נָגִיד обозначает руководителя, начальника или вождя. «Предводитель» естественно звучит в данном перечне людей, пришедших к Давиду, и не создаёт монархического оттенка слова «князь».
- source_word: לְ/אַהֲרֹן
  choice: потомков Аарона
  rationale: Предлог לְ выражает здесь принадлежность или связь. По контексту речь идёт не о самом Аароне, а о связанном с ним священническом доме; добавление «потомков» делает этот смысл понятным, а сноска сохраняет буквальную неоднозначность конструкции.
- source_word: וְ/עִמּ/וֹ
  choice: и с ним
  rationale: Буквально и естественно передаёт союз и предложное сочетание, вводя число сопровождавших Иодая.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: три тысячи семьсот человек
  rationale: Точное числительное передано словами; «человек» добавлено по смыслу эллиптического перечня и для естественности русского текста.
