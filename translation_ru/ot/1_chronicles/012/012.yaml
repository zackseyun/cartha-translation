  rationale: Личное имя транслитерировано с сохранением его еврейского звучания и привычного русского библейского оформления.
- source_word: הַשְּׁבִעִי
  choice: седьмой
  rationale: Порядковое числительное обозначает место Элиэля в перечне; определённый артикль в русском отдельно не выражается.
