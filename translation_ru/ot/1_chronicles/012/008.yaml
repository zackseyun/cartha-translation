  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
translation:
  language: ru
  text: Иоэла и Зевадию, сыновей Иерохама из Гедора.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: Иоэла
  rationale: Личное имя передано транслитерацией с учётом формы יוֹעֵאלָה. Начальный союз וְ в русском перечне естественно не повторяется перед первым из двух заключительных имён.
- source_word: וּ/זְבַדְיָה
  choice: и Зевадия
  rationale: Союз וּ передан как «и», личное имя — в принятой русской библейской форме «Зевадия».
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן здесь естественнее всего обозначает непосредственных сыновей.
- source_word: יְרֹחָם
  choice: Иерохама
  rationale: Личное имя передано традиционной русской библейской формой и поставлено в родительный падеж после слова «сыновья».
- source_word: מִן הַ/גְּדֽוֹר
  choice: из Гедора
  rationale: Предлог מִן обозначает происхождение; הַגְּדוֹר понимается как географическое название. По-русски направление происхождения естественно выражается сочетанием «из Гедора».
