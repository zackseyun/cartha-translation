lexical_decisions:
- source_word: יִרְמְיָה
  choice: Иеремия
  rationale: Личное имя передано в принятой русской библейской форме, соответствующей еврейскому יִרְמְיָה.
- source_word: יַחֲזִיאֵל
  choice: Иахазиил
  rationale: Использована узнаваемая русская библейская форма имени без излишнего приближения к современной научной транслитерации.
- source_word: יוֹחָנָן
  choice: Иоханан
  rationale: Форма «Иоханан» непосредственно различима как личное имя и соответствует принятой русской передаче данного еврейского имени.
- source_word: יוֹזָבָד
  choice: Иозавад
  rationale: Имя передано в традиционной и понятной русской библейской форме.
- source_word: הַגְּדֵרָתִי
  choice: Гедерафянин
  rationale: Субстантивированное обозначение с артиклем передано русским этнонимическим существительным, которое сохраняет возможность понимать его как указание на происхождение или родовую связь, не сводя смысл только к месту жительства.
