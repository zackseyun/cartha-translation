  text: Elkanah[a], Isshiah, Azarel, Joezer, and Jashobeam, the Korahites.
translation:
  language: ru
  text: Елкана, Ишшиягу, Азарел, Иоэзер и Яшовам — корахиты.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки Кораха».'
    reason: Лексически возможное развёрнутое пояснение родового обозначения הַקָּרְחִים.
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Елкана
  rationale: Личное имя передано принятой русской библейской транслитерацией, близкой к еврейской форме.
- source_word: יִשִּׁיָּהוּ
  choice: Ишшиягу
  rationale: Транслитерация сохраняет удвоенный согласный и конечный теофорный элемент -ягу в еврейской форме имени.
- source_word: עֲזַרְאֵל
  choice: Азарел
  rationale: Личное имя транслитерировано непосредственно с еврейского; конечный элемент -эл сохранён.
- source_word: יוֹעֶזֶר
  choice: Иоэзер
  rationale: Начальное יוֹ передано как «Ио-», а имя в целом — в форме, естественной для русской библейской ономастики.
- source_word: יָשָׁבְעָם
  choice: Яшовам
  rationale: Передана именно засвидетельствованная здесь еврейская форма имени; не подменена иной формой из другого места.
- source_word: הַקָּרְחִים
  choice: корахеи
  rationale: Форма с артиклем обозначает группу или род, связанный с Корахом; краткое русское родовое обозначение сохраняет форму исходного текста.
