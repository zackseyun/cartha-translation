  source_fidelity: 'В целом смысл передан точно: временный оборот, движение в Циклаг, переход людей из Манассии на сторону Давида и их статус «глав тысяч» сохранены. Однако написание «Иедиаил» не отражает имя יְדִיעֲאֵל достаточно точно; следует «Иедиаиел». Имя צִלְּתָי также нуждается в более точной передаче удвоенного ל и конечного -ай: «Циллетай».'
