base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: ru
  text: 'Когда он шёл в Циклаг, к нему перешли несколько человек из колена Манассии: Аднах, Иозавад, Иедиаиел, Михаил, Иозавад[b], Елиуй и Циллетай — главы тысяч Манассии[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Тысячи» могли быть военными подразделениями или родовыми объединениями; соответственно, их главы могли быть военачальниками или родовыми вождями.
    reason: lexical_alternative
  - marker: b
    text: Имя Иозавад в еврейском списке названо дважды; речь идёт о двух разных людях с одним именем.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלֶכְתּוֹ
  choice: Когда он шёл
  rationale: Предлог ב с инфинитивом сопряжённой формы и местоименным суффиксом выражает обстоятельство времени; этот вариант естественно передаёт временное значение.
- source_word: אֶל צִיקְלַג
  choice: в Циклаг
  rationale: אֶל обозначает движение к месту назначения; по-русски с глаголом движения название города естественно оформляется предлогом «в».
- source_word: נָפְלוּ עָלָיו
  choice: к нему перешли
  rationale: Военно-политическая идиома буквально означает «пали к нему», то есть перешли на его сторону. Выбранный вариант передаёт смену лояльности, не вводя излишне отрицательной оценки.
- source_word: מִמְּנַשֶּׁה
  choice: некоторые из колена Манассии
  rationale: Предлог מִן указывает на происхождение из Манассии; добавление «колена» делает племенное значение имени ясным современному читателю.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: Аднах, Иозавад, Иедиаил, Михаил, ещё один Иозавад, Елиуй и Цилтай
  rationale: Имена переданы принятой русской библейской транслитерацией. Слова «ещё один» ясно показывают, что Иозавад упомянут в еврейском списке дважды, без изменения текста.
- source_word: רָאשֵׁי הָאֲלָפִים אֲשֶׁר לִמְנַשֶּׁה
  choice: главы тысяч Манассии
  rationale: 'Буквальная и достаточно понятная передача сохраняет неопределённость: אֲלָפִים может обозначать как военные подразделения, так и родовые объединения.'
