  yaml_path: translation/ot/1_chronicles/012/037.yaml
  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: ru
  text: И из Асира — сорок тысяч выступавших на военную службу, чтобы выстроиться в боевой порядок.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «сорок тысяч выступавших на военную службу, чтобы выстроиться для войны». Еврейский текст сочетает выражение «выступающие на военную службу» с глаголом, который в военном контексте означает построение войск в боевой порядок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָשֵׁר
  choice: И из Асира
  rationale: Сохранены соединительный союз и предлог; Асир назван как родоначальник и имя колена, без пояснительного добавления «колена».
- source_word: יֹצְאֵי צָבָא
  choice: выступавших на военную службу
  rationale: Сочетание причастия от יצא с צבא обозначает выход или выступление для организованной военной службы; выбран естественный русский военный оборот.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: чтобы выстроиться к бою
  rationale: В военном контексте ערך передаёт построение в боевой порядок, а מלחמה — бой или войну. Возвратная форма естественно выражает подразумеваемое построение самих воинов.
- source_word: אַרְבָּעִים אָלֶף
  choice: сорок тысяч
  rationale: Прямой перевод числительного.
