lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: и Авишуа
  rationale: Префикс ו передаёт продолжение генеалогического перечня союзом «и»; личное имя транслитерировано в форме, принятой в русской библейской традиции.
- source_word: וְ/נַעֲמָן
  choice: Нааман
  rationale: Имя транслитерировано как «Нааман». Хотя в еврейском тексте перед ним стоит союз ו, в естественном русском перечислении союз не требуется перед каждым однородным членом.
- source_word: וַ/אֲחוֹחַ
  choice: и Ахоах
  rationale: Союз ו перед последним именем естественно передан русским «и»; имя אֲחוֹחַ транслитерировано как «Ахоах» без попытки истолковать его значение.
