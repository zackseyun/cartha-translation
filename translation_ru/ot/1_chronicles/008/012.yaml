base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: ru
  text: 'Сыновья Элпаала: Эвер, Мишам и Шемед. Он[a] построил Оно и Лод с его зависимыми селениями[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «он», вероятнее всего, относится к Шемеду, названному последним; возможно и более широкое отнесение к роду Элпаала.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и её дочери» — древнееврейское обозначение зависимых от города селений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: Сыновья Элпаала
  rationale: Форма сопряжённого множественного числа вводит генеалогический перечень. Начальный союз по-русски естественно опущен.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: Эвер, Мишам и Шемед
  rationale: Личные имена переданы прямой транслитерацией с заключительным союзом перед последним именем.
- source_word: הוּא בָּנָה
  choice: Он построил
  rationale: Независимое местоимение мужского рода и глагол בנה в породе qal переданы без истолковывающего усиления вроде «основал» или «восстановил».
- source_word: אוֹנוֹ וְאֶת לֹד
  choice: Оно и Лод
  rationale: Географические названия транслитерированы непосредственно с древнееврейского; показатели прямого дополнения отдельно не передаются.
- source_word: וּבְנֹתֶיהָ
  choice: с принадлежавшими ему селениями
  rationale: Буквально «и его дочерями»; применительно к городу это идиома, обозначающая зависимые от него поселения. Местоименный суффикс женского рода относится к Лоду, но в русском названии «Лод» мужского рода, поэтому употреблено «ему».
theological_decisions:
- issue: К кому относится местоимение הוּא («он»)
  choice: В основном тексте сохранено самостоятельное «Он», а наиболее естественная отсылка к Шемеду пояснена в сноске.
  alternative: Понимать местоимение шире — как отсылку к семейной линии Элпаала.
  rationale: По ближайшему грамматическому антецеденту речь, вероятнее всего, о Шемеде, однако древнееврейский текст прямо его имя повторно не называет, и неоднозначность не следует устранять без пояснения.
translation_notes:
  register: Современный литературный русский язык; краткий генеалогический стиль сохранён. Имена переданы единообразной транслитерацией, а городская идиома раскрыта естественно и без излишней конкретизации.
