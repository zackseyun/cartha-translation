lexical_decisions:
- source_word: חֲנַנְיָה
  choice: Ханания
  rationale: Личное имя передано принятой русской библейской транслитерацией; конечный элемент -ия отражает теофорный компонент имени.
- source_word: עֵילָם
  choice: Эйлам
  rationale: В генеалогическом перечне это личное имя; форма «Эйлам» непосредственно передаёт еврейское произношение и отличает его от традиционного названия области «Елам».
- source_word: עַנְתֹתִיָּה
  choice: Анатотия
  rationale: Личное имя транслитерировано с сохранением полной последовательности согласных и гласных, засвидетельствованной масоретским текстом.
- source_word: וְ
  choice: и
  rationale: Союз связывает имена в перечне. В естественном русском перечислении повторяющиеся союзы перед первыми именами не воспроизводятся, а «и» ставится перед последним именем.
