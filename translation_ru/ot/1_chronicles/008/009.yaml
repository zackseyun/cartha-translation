  text: От своей жены Ходеш он стал отцом Иовава[a], Цивии, Меши и Малкама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «От Ходеш, своей жены, он стал отцом Иовава, Цивии, Меши и Малкама». Еврейская формула допускает такой порядок слов; предлог מִן передан значением «от».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: он стал отцом
  rationale: Порода хифиль глагола ילד в родословии означает, что мужчина произвёл на свет названных детей. Оборот «стал отцом» естественен в современном русском языке и сохраняет мужскую генеалогическую перспективу.
- source_word: מִן
  choice: от
  rationale: 'Предлог указывает на материнский источник: сыновья были рождены от Ходеш. Русское «от своей жены Ходеш» естественно для родословной формулы, хотя возможна и конструкция «своей женой Ходеш».'
- source_word: חֹדֶשׁ
  choice: Ходеш
  rationale: Личное имя передано транслитерацией, а не переведено.
- source_word: אִשְׁתּוֹ
  choice: своей жены
  rationale: В данном контексте אשה с местоименным суффиксом однозначно обозначает супругу; возвратное «своей» естественно соотносит её с подлежащим.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: показатели прямого дополнения не переданы; имена соединены перечислением
  rationale: Повторяющийся показатель прямого дополнения не имеет отдельного русского соответствия; его синтаксическая функция выражена перечислением имён.
- source_word: יוֹבָב
  choice: Иовав
  rationale: Традиционная русская библейская передача личного имени, близкая еврейской форме.
- source_word: צִבְיָא
  choice: Цивия
  rationale: Транслитерация личного имени צִבְיָא с передачей конечного алефа через -ия, естественной для русской библейской ономастики.
- source_word: מֵישָׁא
  choice: Меша
  rationale: Личное имя передано транслитерацией, сохраняющей звучание еврейской формы.
- source_word: מַלְכָּם
  choice: Малкам
  rationale: В родословии форма является личным именем; транслитерация «Малкам» передаёт еврейские согласные без истолкования имени.
