lexical_decisions:
- source_word: וּגְדוֹר
  choice: и Гедор
  rationale: Союз ו передан как «и», чтобы сохранить последовательную структуру родословного перечня; личное имя גְדוֹר транслитерировано в принятой русской форме «Гедор».
- source_word: וְאַחְיוֹ
  choice: и Ахио
  rationale: Союз ו передан как «и»; личное имя אַחְיוֹ транслитерировано как «Ахио» в соответствии с масоретской огласовкой.
- source_word: וָזָכֶר
  choice: и Зехер
  rationale: Союз ו передан как «и»; личное имя זָכֶר транслитерировано как «Зехер», что отражает масоретскую огласовку и соответствует русской передаче начального еврейского ז через «з».
