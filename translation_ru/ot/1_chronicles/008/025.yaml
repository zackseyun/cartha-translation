lexical_decisions:
- source_word: יִפְדְיָה
  choice: Ифдея
  rationale: Личное имя передано транслитерацией с еврейского; начальный йод отражён традиционной русской формой с начальным «И».
- source_word: פניאל
  choice: Пенуэл
  rationale: Личное имя передано транслитерацией; написание «Пенуэл» отражает возможное чтение с гласным u и позволяет сохранить отличие от варианта «Пениэл».
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма множественного числа в сопряжённом состоянии буквально означает «сыновья». В русском именном предложении связка в настоящем времени не требуется.
- source_word: שָׁשָׁק
  choice: Шашак
  rationale: Личное имя передано прямой транслитерацией с еврейского.
