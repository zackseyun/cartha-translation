lexical_decisions:
- source_word: שַׁמְשְׁרַי
  choice: Шамшерай
  rationale: Личное имя в родословном перечне передано транслитерацией; форма «Шамшерай» естественно отражает еврейское звучание и соответствует принятой русской библейской традиции.
- source_word: שְׁחַרְיָה
  choice: Шехария
  rationale: Личное имя передано транслитерацией с сохранением конечного элемента -ия, соответствующего еврейскому -יה; форма удобна для современного русского чтения.
- source_word: עֲתַלְיָה
  choice: Аталия
  rationale: Личное имя передано традиционной русской библейской формой, близкой к еврейскому עֲתַלְיָה.
- source_word: וְ / וּ / וַ
  choice: и
  rationale: Каждый префиксальный союз waw соединяет имена в перечне; повторение союза «и» сохраняет структуру и ритм еврейского текста.
