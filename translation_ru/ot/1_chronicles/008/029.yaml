  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: ru
  text: В Гаваоне жили отец Гаваона[a] и его жена, которую звали Мааха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «основатель Гаваона»; или: «глава Гаваона». Буквально: «отец Гаваона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְעוֹן
  choice: В Гаваоне
  rationale: Предлог בְּ передаёт местонахождение; начальный союз וּ в русском можно естественно не воспроизводить в отдельном стихе.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: Форма множественного числа означает «жили, обитали» и согласуется с подразумеваемыми двумя лицами — отцом Гаваона и его женой.
- source_word: אֲבִי גִבְעוֹן
  choice: отец Гаваона
  rationale: Сохранено буквальное выражение, поскольку оно может обозначать отца, родоначальника, основателя или главу, связанного с городом; варианты отмечены в сноске.
- source_word: וְ/שֵׁם אִשְׁתּוֹ מַעֲכָה
  choice: и его жена, которую звали Мааха
  rationale: Естественная русская передача именной конструкции «и имя его жены — Мааха», одновременно позволяющая ясно согласовать множественное число глагола «жили».
- source_word: מַעֲכָה
  choice: Мааха
  rationale: Традиционная русская библейская передача личного имени, соответствующего еврейскому מַעֲכָה.
