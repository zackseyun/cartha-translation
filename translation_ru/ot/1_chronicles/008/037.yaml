  text: וּ/מוֹצָ֖א הוֹלִ֣יד אֶת בִּנְעָ֑א רָפָ֥ה בְנ֛/וֹ אֶלְעָשָׂ֥ה בְנ֖/וֹ אָצֵ֥ל בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: ru
  text: И Моца родил Бинею; Рафа — сын его, Елеаса — сын его, Ацел — сын его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: И Моца
  rationale: Союз ו передан как «И», чтобы сохранить связность родословного перечня; имя מוֹצָא транслитерировано как «Моца».
- source_word: הוֹלִיד
  choice: родил
  rationale: В породных списках каузативная форма глагола ילד означает «стать отцом, породить». «Родил» кратко и естественно для библейской родословной.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском и выражен винительным падежом имени «Бинею».
- source_word: בִּנְעָא
  choice: Бинею
  rationale: Личное имя передано как «Бинея»; в данном предложении употреблена форма винительного падежа «Бинею».
- source_word: רָפָה
  choice: Рафа
  rationale: Транслитерация соответствует масоретской огласовке רָפָה и естественной русской передаче библейского имени.
- source_word: בְנ֛/וֹ
  choice: сын его
  rationale: Буквально передаёт בְּנוֹ и сохраняет лаконичный, повторяющийся строй еврейской родословной.
- source_word: אֶלְעָשָׂה
  choice: Елеаса
  rationale: Имя транслитерировано с учётом начального אֶלְ и традиционно звучащей русской передачи.
- source_word: בְנ֖/וֹ
  choice: сын его
  rationale: 'Повтор сохраняет последовательную цепь происхождения: каждый названный далее является сыном непосредственно предшествующего.'
- source_word: אָצֵל
  choice: Ацел
  rationale: Прямая русская транслитерация еврейского личного имени.
- source_word: בְּנֽ/וֹ
  choice: сын его
  rationale: Буквальный повтор завершает родословную цепь и сохраняет синтаксический ритм оригинала.
theological_decisions: []
