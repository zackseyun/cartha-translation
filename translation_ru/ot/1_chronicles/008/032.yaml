lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: И Миклоф
  rationale: Союз ו передан явно, а имя מִקְלוֹת транслитерировано в принятой русской библейской форме «Миклоф».
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В генеалогическом контексте каузативная форма означает «породил, стал отцом»; выбран современный и достойный оборот без архаизма «родил» применительно к мужчине.
- source_word: אֶת שִׁמְאָה
  choice: Шимы
  rationale: Показатель прямого дополнения не переводится; имя передано как «Шима» и поставлено в родительный падеж по управлению оборота «стал отцом».
- source_word: וְאַף הֵמָּה
  choice: Они также
  rationale: 'Передаёт присоединительно-усилительное значение сочетания: упомянутые лица тоже жили там.'
- source_word: נֶגֶד
  choice: напротив
  rationale: Сохраняет основное пространственное значение «перед, напротив», не сводя его без необходимости к более общему «рядом».
- source_word: אֲחֵיהֶם
  choice: своих братьев
  rationale: Буквально передаёт термин родства; возвратное «своих» естественно по-русски при совпадении обладателя с подлежащим. В данном родословном контексте возможен более широкий смысл — сородичи.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: Современная естественная передача глагола ישׁב в значении постоянного проживания.
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Стандартная русская форма названия города.
- source_word: עִם אֲחֵיהֶם
  choice: вместе со своими братьями
  rationale: Передаёт עִם как совместность и сохраняет намеренный повтор слова «братья» в еврейском тексте.
