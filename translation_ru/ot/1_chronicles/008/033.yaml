  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: ru
  text: Нер стал отцом Киша, Киш — отцом Саула, а Саул — отцом Ионафана, Малки-Шуа, Авинадава и Эшбаала.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Во 2-й книге Самуила Эшбаал назван Иш-Бошетом (в традиционном русском написании — Иевосфеем).
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלִיד
  choice: стал отцом / отцом
  rationale: В родословии каузативная форма глагола ילד обозначает мужскую линию происхождения. «Стал отцом» ясно передаёт этот смысл на современном русском; в последующих частях эллипсис «отцом» устраняет тяжеловесный повтор, не меняя отношений между названными лицами.
- source_word: נֵר
  choice: Нер
  rationale: Личное имя передано транслитерацией, близкой к еврейской форме.
- source_word: קִישׁ
  choice: Киш
  rationale: Личное имя передано непосредственно с еврейского с сохранением конечного согласного ש как «ш».
- source_word: שָׁאוּל
  choice: Саул
  rationale: Устоявшаяся и узнаваемая русская форма имени.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Устоявшаяся русская форма имени сына Саула; она сохраняет его узнаваемость, хотя еврейская форма здесь полнее, чем вариант יוֹנָתָן.
- source_word: מַלְכִּי שׁוּעַ
  choice: Малки-Шуа
  rationale: Двухчастное личное имя передано близкой к еврейскому звучанию транслитерацией и соединено дефисом.
- source_word: אֲבִינָדָב
  choice: Авинадав
  rationale: Транслитерация еврейского имени; она точнее соответствует исходной форме, чем традиционный вариант «Аминадав» в некоторых русских переводах этого места.
- source_word: אֶשְׁבָּעַל
  choice: Эшбаал
  rationale: Основной текст следует непосредственно форме имени в еврейском тексте Паралипоменона и не заменяет её формой из книг Самуила.
theological_decisions:
- issue: Форма имени последнего из перечисленных сыновей Саула
  choice: Эшбаал в основном тексте
  alternative: Иевосфей (Иш-Бошет)
  rationale: Это различие текстовой и именной традиции, а не вероучительный вопрос. В еврейском тексте Паралипоменона стоит אֶשְׁבָּעַל, тогда как в книгах Самуила тот же человек назван Иш-Бошетом, в русской традиции — Иевосфеем. Основной текст сохраняет форму источника, а примечание помогает читателю отождествить персонажа.
translation_notes:
  register: Современный литературный русский язык с ясной родословной конструкцией. Эллиптическое повторение «отцом» сохраняет ритм перечисления и избегает архаичного и неестественного для современного русского «родил» применительно к мужчине. Имена преимущественно переданы непосредственно с еврейского, при сохранении прочно укоренившихся русских форм «Саул» и «Ионафан».
