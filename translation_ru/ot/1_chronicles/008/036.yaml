base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/036.yaml
  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: ru
  text: Ахаз стал отцом Иегоадды[a], Иегоадда стал отцом Алемета, Азмавета и Зимри, и Зимри стал отцом Моцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Иегоадда; в некоторых переводах — Иегоада.
    reason: 'Текстуально-ономастический вариант передачи имени: основное чтение следует форме יְהוֹעַדָּה в WLC; примечание отмечает иной вариант передачи имени, не утверждая неподтверждённый рукописный вариант.'
lexical_decisions:
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В родословии порода hифиль глагола ילד обозначает рождение потомка по отцовской линии. Оборот «стал отцом» точно передаёт смысл и естественно звучит на современном русском языке.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения в древнееврейском языке; в русском его функция выражается синтаксисом.
- source_word: יְהוֹעַדָּה
  choice: Иегоадда
  rationale: Транслитерация имени следует огласованной форме предоставленного масоретского текста и передаёт удвоение согласной далет.
- source_word: עָלֶמֶת
  choice: Алемет
  rationale: Имя передано транслитерацией с учётом формы масоретского текста.
- source_word: עַזְמָוֶת
  choice: Азмавет
  rationale: Имя передано транслитерацией с сохранением согласного состава древнееврейской формы.
- source_word: זִמְרִי
  choice: Зимри
  rationale: Последовательная транслитерация имени в обоих его употреблениях.
- source_word: מוֹצָא
  choice: Моца
  rationale: Транслитерация огласованной древнееврейской формы; буква צ передана русской «ц».
- source_word: וְ
  choice: и / а
  rationale: Союз связывает звенья родословия. В последней части «а» естественно продолжает цепочку на русском, не добавляя противопоставления по смыслу.
