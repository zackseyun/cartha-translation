  text: Его сыном-первенцем был Авдон[a], затем Цур, Киш, Баал и Надав.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «И его сын, первенец: Авдон, Цур, Киш, Баал и Надав».'
