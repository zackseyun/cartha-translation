lexical_decisions:
- source_word: וּבְנוֹ
  choice: Его … был
  rationale: Начальный союз связывает стих с ходом родословия, но по-русски естественнее передать его бессоюзным продолжением; суффикс третьего лица передан словом «его».
- source_word: הַבְּכוֹר
  choice: первенцем
  rationale: Слово прямо обозначает первого по рождению сына; «первенец» сохраняет генеалогический смысл и звучит естественно в современном литературном русском.
- source_word: עַבְדּוֹן
  choice: Авдон
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וְצוּר
  choice: затем Цур
  rationale: Имя передано транслитерацией; «затем» естественно вводит продолжение перечня после конструкции «первенцем был».
- source_word: וְקִישׁ
  choice: Киш
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וּבַעַל
  choice: Баал
  rationale: В данном генеалогическом контексте это личное имя; оно транслитерировано, а не переведено как титул или обозначение божества.
- source_word: וְנָדָב
  choice: Надав
  rationale: Личное имя передано в принятой русской библейской форме.
