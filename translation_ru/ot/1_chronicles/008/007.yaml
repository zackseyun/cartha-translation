base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: ru
  text: И Нааман, Ахия и Гера — он увёл их в изгнание и стал отцом Уззы и Ахихуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲמָן
  choice: Нааман
  rationale: Личное имя передано в традиционной русской библейской форме, соответствующей еврейскому произношению.
- source_word: אֲחִיָּה
  choice: Ахия
  rationale: Личное имя транслитерировано в естественной для русского библейского текста форме.
- source_word: גֵרָא
  choice: Гера
  rationale: Личное имя транслитерировано, а не переведено.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение имеет возобновительное или эмфатическое употребление; простой эквивалент «он» сохраняет синтаксическую неоднозначность.
- source_word: הֶגְלָם
  choice: переселил их
  rationale: Форма породы hифиль от גלה с суффиксом 3-го лица множественного числа означает «заставил их уйти в изгнание / переселил их». «Переселил их» естественно по-русски и не уточняет насильственный характер сильнее, чем позволяет контекст.
- source_word: וְהוֹלִיד
  choice: и стал отцом
  rationale: В родословии hифиль глагола ילד означает «породил, стал отцом». Выбрано современное и достойное выражение без архаизма «родил» применительно к мужчине.
- source_word: עֻזָּא
  choice: Узза
  rationale: Личное имя передано транслитерацией с сохранением удвоенного согласного.
- source_word: אֲחִיחֻד
  choice: Ахихуд
  rationale: Личное имя передано транслитерацией в соответствии с еврейской формой.
theological_decisions:
- issue: К кому относится местоимение «он» при глаголе הֶגְלָם
  choice: Сохранено буквальное «он» без явного отождествления субъекта
  alternative: «Гера переселил их»
  rationale: Синтаксически субъект единственного числа естественнее всего соотносится с Герой, однако текст родословия труден; прямое называние Геры устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким генеалогическим синтаксисом. Союз «и» в начале сохранён как связь с предыдущим стихом. Неоднозначность субъекта не устранена; редкое «переселил» пояснено сноской через более явные варианты об изгнании.
