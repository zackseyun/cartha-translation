base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/001.yaml
  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: ru
  text: Вениамин стал отцом Белы, своего первенца, Ашбела, второго сына, и Ахраха, третьего сына.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: Вениамин
  rationale: Имя передано в принятой русской библейской форме. Начальный союз וּ естественно не выражен отдельно, поскольку стих продолжает генеалогическое изложение.
- source_word: הוֹלִיד
  choice: родил
  rationale: В генеалогическом контексте каузативная форма глагола ילד означает «произвёл на свет, стал отцом». Русское «родил» традиционно и понятно употребляется о мужчине в родословиях, сохраняя краткость исходного текста.
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия и передаётся синтаксисом.
- source_word: בֶּלַע
  choice: Белу
  rationale: Имя בֶּלַע передано принятой русской библейской формой «Бела» и поставлено в винительный падеж.
- source_word: בְּכֹרוֹ
  choice: своего первенца
  rationale: Слово בְּכוֹר прямо обозначает первенца; местоименная форма «своего» ясно соотносит его с Вениамином.
- source_word: אַשְׁבֵּל
  choice: Ашбела
  rationale: Имя передано близко к еврейскому звучанию и в форме винительного падежа.
- source_word: הַשֵּׁנִי
  choice: второго
  rationale: Субстантивированное порядковое числительное сохраняет указание на порядок рождения и согласуется со структурой перечня.
- source_word: וְאַחְרַח
  choice: и Ахраха
  rationale: Масоретская форма אַחְרַח передана как «Ахрах» с сохранением обеих гортанных согласных; союз וְ переведён как «и».
- source_word: הַשְּׁלִישִׁי
  choice: третьего
  rationale: Порядковое числительное передаёт третье место в перечислении сыновей.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский с достоинством и лаконичностью генеалогической записи. Тире перед порядковыми числительными делает отношения между именами и указаниями на порядок рождения прозрачными. Примечание английского консультационного слоя об Aharah/Ahrah неприменимо к русскому тексту: форма «Ахрах» непосредственно отражает масоретское אַחְרַח, поэтому сноска не требуется.'
