  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: ru
  text: А от Хушим он стал отцом Авитува и Элпаала.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: А от Хушим
  rationale: 'Союз וּ сохраняет связь с предыдущим стихом, а предлог מִן обозначает происхождение: сыновья родились от Хушим. В русском языке «от Хушим» естественно передаёт материнство и одновременно сохраняет буквальный образ еврейского выражения.'
- source_word: הוֹלִיד
  choice: у него родились
  rationale: Форма хифиль глагола ילד в родословии означает «породил, стал отцом». С учётом предшествующего «от Хушим» конструкция «у него родились» звучит естественно по-русски, передаёт отцовство подразумеваемого мужчины и не создаёт ошибочного впечатления, будто подлежащим является Хушим.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском языке.
- source_word: אֲבִיטוּב
  choice: Авитув
  rationale: Имя передано транслитерацией с учётом еврейского согласного ב без дагеша как «в» и конечного ב как «в».
- source_word: וְ/אֶת
  choice: и
  rationale: Союз וְ переведён как «и»; показатель прямого дополнения אֶת отдельно не передаётся.
- source_word: אֶלְפָּעַל
  choice: Элпаал
  rationale: Имя передано близкой к еврейскому звучанию русской транслитерацией; гортанная согласная ע отдельно не обозначена, чтобы имя оставалось удобочитаемым.
