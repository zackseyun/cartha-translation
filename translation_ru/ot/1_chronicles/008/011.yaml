  naturalness: «А от Хушим он стал отцом Авитува и Элпаала» — естественная для современного литературного русского краткая родословная формула. Она не создаёт впечатления, что Хушим является подлежащим глагола.
  terminology: Передача имён «Хушим», «Авитув» и «Элпаал» приемлема и близка к еврейской форме. Специальная богословская терминология отсутствует.
