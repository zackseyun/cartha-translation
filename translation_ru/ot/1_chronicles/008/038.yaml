base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: ru
  text: 'У Ацеля было шестеро сыновей[a], и вот их имена: Азрикам, его первенец, Измаил, Шеария, Овадия и Ханан. Все они — сыновья Ацеля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В древнееврейском тексте сказано о шести сыновьях, но далее названы только пять имён.
    reason: textual_detail
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: У Ацеля было
  rationale: Естественная русская передача древнееврейской генеалогической конструкции принадлежности с לְ; она сохраняет её смысл без буквального и неестественного «Ацелю — шесть сыновей».
- source_word: שִׁשָּׁה בָנִים
  choice: шестеро сыновей
  rationale: בָנִים в этой родословной означает сыновей; собирательное числительное «шестеро» естественно сочетается с обозначением лиц мужского пола.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: и вот их имена
  rationale: Сохранена стандартная формула перечисления и местоименный суффикс третьего лица множественного числа.
- source_word: עַזְרִיקָם
  choice: Азрикам
  rationale: Имя транслитерировано с учётом принятой русской библейской передачи.
- source_word: בֹּכְרוּ
  choice: его первенец
  rationale: Форма указывает, что Азрикам был первенцем Ацеля; местоимение сохраняет выраженное в древнееврейском тексте отношение.
- source_word: יִשְׁמָעֵאל
  choice: Измаил
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: שְׁעַרְיָה
  choice: Шеария
  rationale: Имя передано транслитерацией, отражающей древнееврейскую форму.
- source_word: עֹבַדְיָה
  choice: Овадия
  rationale: Имя передано в принятой русской библейской форме.
- source_word: חָנָן
  choice: Ханан
  rationale: Имя передано прямой транслитерацией.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: Все они — сыновья Ацеля
  rationale: Естественная и точная русская заключительная формула родословной; вариант написания имени אָצַל передан единообразно с אָצֵל.
