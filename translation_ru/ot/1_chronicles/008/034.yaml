translation:
  language: ru
  text: Сын Иехонатана — Мерив-Баал, а Мерив-Баал стал отцом Михи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельной родословной (2 Царств 9:12) имя написано немного иначе: מִיכָא вместо מִיכָה; обе формы по-русски передаются как «Миха».'
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: Сын
  rationale: Существительное בֵּן обозначает сына и продолжает генеалогическую цепь. Начальный союз וּ в русском естественно не выражать отдельно, поскольку связь с предыдущей строкой ясна из самой генеалогической конструкции.
- source_word: יְהוֹנָתָן
  choice: Иегонафан
  rationale: Передана более полная форма имени, стоящая в еврейском тексте, без сведения её к более привычной краткой форме «Ионафан».
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: Мерив-Баал
  rationale: Оба написания относятся к одному личному имени. Дефис показывает единство составного имени и сохраняет его две части.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В породах родословий порода Hiphil глагола ילד обозначает рождение потомка мужчиной, то есть «стал отцом». Эта формулировка естественна по-русски и не придаёт глаголу лишнего биологического оттенка.
- source_word: אֶת מִיכָה
  choice: Михи
  rationale: אֶת — непереводимый показатель прямого дополнения. Имя מִיכָה передано как «Миха» и поставлено в родительный падеж после выражения «стал отцом».
