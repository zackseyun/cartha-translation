  rationale: Личное имя передано в традиционной русской библейской форме, соответствующей еврейскому יָקִים.
- source_word: זִכְרִי
  choice: Зихри
  rationale: Личное имя транслитерировано с передачей еврейских согласных и огласовки; буква כ без дагеша передана как «х».
- source_word: זַבְדִּי
  choice: Завдий
  rationale: Личное имя передано в привычной русской библейской форме; конечный элемент имени естественно оформлен по-русски как «-ий».
