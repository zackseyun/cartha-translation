  text: and Zebadiah, and Meshullam, and Hizki, and Heber.
translation:
  language: ru
  text: и Зевадия, и Мешуллам, и Хизки, и Хевер.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: и Зевадия
  rationale: Личное имя с присоединённым союзом וּ; передано принятой русской библейской транслитерацией, сохраняющей связь с еврейской формой.
- source_word: וּ/מְשֻׁלָּם
  choice: и Мешуллам
  rationale: Личное имя с присоединённым союзом וּ; транслитерировано, а не переведено.
- source_word: וְ/חִזְקִי
  choice: и Хизки
  rationale: Передано непосредственно по еврейской огласованной форме חִזְקִי; форма не заменена более знакомым, но иным именем «Езекия».
- source_word: וָ/חָבֶר
  choice: и Хевер
  rationale: Личное имя с присоединённым союзом; начальная ח передана буквой «х», а ב без дагеша — буквой «в», в соответствии с произношением данной еврейской формы.
