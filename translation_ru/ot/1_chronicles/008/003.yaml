lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְבָלַע
  choice: У Белы были сыновья
  rationale: Еврейская конструкция буквально означает «и были сыновья у Белы»; естественный русский генеалогический оборот передаёт тот же смысл без ненужной буквальности.
- source_word: אַדָּר
  choice: Аддар
  rationale: Имя передано транслитерацией с удвоенным «д», отражающим дагеш в еврейском написании; упрощённая форма «Адар» отмечена в сноске.
- source_word: וְגֵרָא
  choice: Гера
  rationale: Личное имя передано принятой русской библейской формой.
- source_word: וַאֲבִיהוּד
  choice: Авиуд
  rationale: Личное имя передано принятой русской библейской формой; начальная часть имени соответствует традиционной русской передаче еврейского אֲבִי־.
