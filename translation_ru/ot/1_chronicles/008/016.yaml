  text: and Michael, Ishpah, and Joha, the sons of Beriah.
translation:
  language: ru
  text: и Михаил, Ишпа и Иоха — сыновья Берии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִיכָאֵל
  choice: и Михаил
  rationale: Личное имя передано в принятой русской библейской форме; приставной союз וּ передан как «и».
- source_word: וְ/יִשְׁפָּה
  choice: Ишпа
  rationale: Имя транслитерировано с еврейского в соответствии с его звучанием; повтор союза внутри русского перечисления опущен как ненужный.
- source_word: וְ/יוֹחָא
  choice: Иоха
  rationale: Начальный йод передан традиционным для русской библейской ономастики сочетанием «Ио»; союз выражен естественным построением перечисления.
- source_word: בְּנֵי
  choice: сыновья
  rationale: В родословном перечне слово непосредственно обозначает сыновей, а не потомков вообще.
- source_word: בְרִיעָה
  choice: Берии
  rationale: Имя передано в принятой русской библейской форме «Берия» и поставлено в родительном падеже после слова «сыновья».
