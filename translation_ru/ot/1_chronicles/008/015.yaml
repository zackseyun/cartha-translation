- source_word: וּ/זְבַדְיָה
  choice: и Зевадия
  rationale: Префиксальный союз וּ передан как «и»; личное имя זְבַדְיָה дано в принятой русской библейской форме «Зевадия».
- source_word: וַ/עֲרָד
  choice: Арад
  rationale: Имя עֲרָד транслитерировано как «Арад»; отдельное повторение союза в русском перечислении не требуется.
- source_word: וָ/עָדֶר
  choice: и Эдер
  rationale: Союз וָ передан как «и» перед последним именем; масоретская огласовка עָדֶר соответствует форме «Эдер».
