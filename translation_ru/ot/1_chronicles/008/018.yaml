lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: Ишмерай
  rationale: Личное имя передано транслитерацией с еврейского; начальный йод отражён русским «И» согласно принятой передаче библейских имён.
- source_word: יִזְלִיאָה
  choice: Излия
