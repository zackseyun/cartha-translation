- source_word: יוֹבָב
  choice: Иовав
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого состояния множественного числа от «сын»; именное предложение естественно передаёт генеалогическую формулу без добавления глагола.
- source_word: אֶלְפָּעַל
  choice: Элпаала
  rationale: Личное имя транслитерировано как «Элпаал» и поставлено в родительный падеж в соответствии с русским синтаксисом.
