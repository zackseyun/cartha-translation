  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: ru
  text: А Берия и Шема были главами родов среди жителей Аиалона[a]; именно они обратили в бегство жителей Гата[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейское выражение означает: «главы отцов»; это обозначение глав родов, то есть крупных родственных объединений.'
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «изгнали». Еврейский глагол подчёркивает, что жителей Гата заставили бежать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: А Берия и Шема
  rationale: Личные имена переданы транслитерацией с еврейского; начальный союз сохраняет связь с генеалогическим перечнем.
- source_word: הֵמָּה רָאשֵׁי הָאָבוֹת
  choice: были главами родов
  rationale: Самостоятельное местоимение придаёт подлежащему выразительность, а сочетание רָאשֵׁי הָאָבוֹת обозначает руководителей родовых объединений. Русское «главы родов» естественно передаёт этот общественный институт.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: среди жителей Аиалона
  rationale: Предлог לְ в данном сочетании наиболее естественно указывает на круг людей, внутри которого Берия и Шема были родовыми главами, а не обязательно на служение от их имени.
- source_word: הֵמָּה הִבְרִיחוּ
  choice: именно они обратили в бегство
  rationale: Повторное הֵמָּה подчёркивает деятелей и передано словом «именно». Каузативная форма глагола ברח буквально выражает то, что они заставили противников бежать.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: жителей Гата
  rationale: Объектная конструкция передана прямо; название места транслитерировано с еврейского как «Гат».
