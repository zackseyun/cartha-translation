base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: ru
  text: Сыновья Улама были доблестными воинами, лучниками[a]. У них было много сыновей и внуков — всего сто пятьдесят. Все они были потомками Вениамина[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «натягивавшими (или сгибавшими) лук».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из сыновей Вениамина»; то есть потомками Вениамина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אוּלָם
  choice: Сыновья Улама были
  rationale: Простая описательная формула в родословном контексте; сохраняет конструкцию исходного текста и естественно звучит по-русски.
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: доблестными воинами
  rationale: Устойчивое еврейское выражение обозначает сильных, храбрых и способных к войне мужчин; выбран естественный современный русский эквивалент с военным оттенком.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: умевшими натягивать лук
  rationale: Причастная конструкция буквально описывает натягивающих или сгибающих лук, то есть искусных лучников. Передан конкретный образ исходного текста без неестественной кальки.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: У них было много сыновей и внуков
  rationale: Порода hифиль глагола רבה здесь выражает многочисленность потомства; «внуки» естественно передаёт буквально «сыновья сыновей».
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: всего сто пятьдесят человек
  rationale: Добавление «всего» ясно связывает число с совокупностью сыновей и внуков, не меняя содержания еврейского текста.
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: Все они происходили от сынов Вениамина
  rationale: Предлог מן с родословным обозначением передаёт происхождение или принадлежность к потомкам Вениамина.
theological_decisions:
- issue: Значение מִבְּנֵי בִנְיָמִן в заключительной родословной формуле
  choice: происходили от сынов Вениамина
  alternative: принадлежали к сынам Вениамина
  rationale: Основной текст естественно выражает родовое происхождение, а примечание сохраняет возможный оттенок принадлежности к колену, не превращая его в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным родословным стилем. Фразы короткие и ясные; военный образ еврейского текста сохранён, а смысл числительного недвусмысленно отнесён ко всем названным потомкам.
