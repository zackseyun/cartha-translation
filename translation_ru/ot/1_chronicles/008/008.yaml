base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: ru
  text: Шахараим стал отцом детей в земле Моава[a] после того, как он отослал Хушим и Баару, своих жён[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на полях Моава»; возможен также смысл «на территории Моава».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от его отсылания их»; смысл еврейской конструкции, вероятно, таков: «после того, как он их отослал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲרַיִם
  choice: Шахараим
  rationale: Союз וְ связывает стих с генеалогическим перечнем; в русском продолжение естественно передаётся без обязательного начального «и». Имя транслитерировано.
- source_word: הוֹלִיד
  choice: стал отцом детей
  rationale: В генеалогическом контексте порода hифиль глагола ילד означает «произвести на свет, стать отцом». Формулировка сохраняет мужское отцовство и не вводит имён детей, названных лишь далее.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: в земле Моава
  rationale: שָׂדֶה буквально означает «поле», но в географическом сочетании обозначает местность или территорию; «земля Моава» естественно передаёт этот смысл.
- source_word: מִן שִׁלְחוֹ אֹתָם
  choice: после того, как отослал
  rationale: Предлог מִן при инфинитиве שלח здесь, вероятнее всего, выражает временное отношение. Русская конструкция передаёт вероятный смысл, а буквальная форма отмечена в сноске.
- source_word: חוּשִׁים
  choice: Хушим
  rationale: Личное имя передано транслитерацией; несмотря на внешне множественное окончание, контекст указывает на имя женщины.
- source_word: וְאֶת בַּעֲרָא
  choice: и Баару
  rationale: Частица אֶת отмечает прямое дополнение; имя передано транслитерацией и поставлено в винительный падеж.
- source_word: נָשָׁיו
  choice: своих жён
  rationale: Форма множественного числа אִשָּׁה с местоименным суффиксом здесь обозначает жён Шахараима; возвратное «своих» естественно для русского синтаксиса.
