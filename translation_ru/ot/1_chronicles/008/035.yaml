base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: ru
  text: 'И сыновья Михи: Пифон, Мелех, Тареа и Ахаз.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «И», чтобы сохранить последовательность родословия; בְנֵי в данном перечне означает непосредственных сыновей.
- source_word: מִיכָה
  choice: Михи
  rationale: Личное имя מִיכָה передано в принятой русской библейской форме «Миха» и поставлено в родительный падеж после слова «сыновья».
- source_word: פִּיתוֹן
  choice: Пифон
  rationale: Транслитерация еврейского личного имени с учётом традиционной русской передачи буквы ת через «ф» в библейских именах.
- source_word: וָמֶלֶךְ
  choice: Мелех
  rationale: В родословном контексте מֶלֶךְ является личным именем, а не нарицательным «царь»; отдельный союз перед именем по нормам русского перечисления не требуется.
- source_word: וְתַאְרֵעַ
  choice: Тареа
  rationale: Имя передано близко к масоретскому чтению Taʾrea; согласная א обозначает разрыв гласных, который естественно отражается сочетанием «еа».
- source_word: וְאָחָז
  choice: Ахаз
  rationale: Личное имя передано в традиционной русской библейской форме; союз ו выражен русским «и» перед последним элементом списка.
