  text: וּ/בְנֵ֖י עֵ֣שֶׁק אָחִ֑י/ו אוּלָ֣ם בְּכֹר֔/וֹ יְעוּשׁ֙ הַ/שֵּׁנִ֔י וֶֽ/אֱלִיפֶ֖לֶט הַ/שְּׁלִשִֽׁי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: ru
  text: 'И сыновья Эшека, его брата: Улам, его первенец, Иеуш — второй, и Элифелет — третий.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сохранён начальный союз וּ, естественный для связного ряда родословия; בְנֵי передаёт конструкцию «сыновья [кого-либо]».
- source_word: עֵשֶׁק
  choice: Эшек
  rationale: Личное имя передано транслитерацией, сохраняющей начальный гласный и согласный שׁ как «ш».
- source_word: אָחִיו
  choice: его брата
  rationale: Обычное значение אָח — «брат»; контекст не требует расширительного перевода «родственник».
- source_word: אוּלָם
  choice: Улам
  rationale: Личное имя передано транслитерацией с исходной огласовкой.
- source_word: בְּכֹרוֹ
  choice: его первенец
  rationale: «Первенец» точно передаёт статус первого рождённого сына и лучше сохраняет генеалогическую лексику, чем «старший».
- source_word: יְעוּשׁ
  choice: Иеуш
  rationale: Транслитерация отражает еврейское имя יְעוּשׁ и отличает конечный שׁ («ш»).
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Порядковое числительное прямо обозначает место в последовательности сыновей.
- source_word: וֶאֱלִיפֶלֶט
  choice: и Элифелет
  rationale: Союз перед последним элементом перечня сохранён; имя передано транслитерацией.
- source_word: הַשְּׁלִשִׁי
  choice: третий
  rationale: Порядковое числительное прямо передаёт третье место в перечислении.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена краткая, перечислительная форма родословия. Начальный союз передан явно, поэтому примечание о его наличии не требуется. Тире при порядковых обозначениях делает структуру перечня ясной, не добавляя смысла.
