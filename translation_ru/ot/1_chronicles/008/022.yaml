- source_word: יִשְׁפָּן
  choice: Ишпан
  rationale: Личное имя передано транслитерацией с еврейского; начальный йод здесь естественно отражается в русской форме как «И».
- source_word: עֵבֶר
  choice: Эвер
  rationale: Личное имя передано непосредственно с еврейского; буква ב без дагеша имеет звук «в», поэтому выбрана форма «Эвер».
- source_word: אֱלִיאֵל
  choice: Элиэль
  rationale: Личное имя транслитерировано с еврейского без перевода составляющих его богословски значимых элементов.
- source_word: וְ / וָ / וֶ
  choice: и
  rationale: Префикс ו соединяет имена в перечне; по нормам современного русского языка союз ставится перед последним именем, а предыдущие разделяются запятыми.
