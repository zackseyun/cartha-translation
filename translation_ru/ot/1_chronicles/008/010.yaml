  text: а также Иеуца, Сахию и Мирму. Это его сыновья, главы родов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главы отцов»; то есть главы родовых домов или семейных групп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: Иеуц
  rationale: Личное имя передано транслитерацией; в данном предложении поставлено в винительный падеж «Иеуца» в соответствии с еврейским показателем прямого дополнения אֶת.
- source_word: שָׂכְיָה
  choice: Сахия
  rationale: Личное имя передано транслитерацией с учётом чтения שׂ как /с/; в тексте употреблена форма винительного падежа «Сахию».
- source_word: מִרְמָה
  choice: Мирма
  rationale: В родословном контексте это личное имя, поэтому оно транслитерировано, а не переведено по значению однокоренного нарицательного слова; в тексте употреблена форма «Мирму».
- source_word: אֵלֶּה
  choice: это
  rationale: Указательное слово относится к только что перечисленным сыновьям; «это его сыновья» естественно передаёт русским именным предложением отсутствие связки в еврейском.
- source_word: בָנָיו
  choice: его сыновья
  rationale: Мужское множественное число в родословии точно передано словом «сыновья», а суффикс третьего лица — местоимением «его».
- source_word: רָאשֵׁי אָבוֹת
  choice: главы родов
  rationale: Еврейское сочетание буквально означает «главы отцов» и идиоматически обозначает руководителей родовых объединений; «главы родов» сохраняет метафору и понятно современному русскому читателю.
