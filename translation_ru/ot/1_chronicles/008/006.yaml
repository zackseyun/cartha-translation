  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: ru
  text: 'Вот сыновья Эхуда. Они были главами родов[a] жителей Гевы и увели их в изгнание в Манахат[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главы отцовских домов»; речь идёт о главах родов или родовых домов.'
    reason: cultural_note
  - marker: b
    text: В еврейском тексте не уточняется, к кому именно относятся местоимения «они» и «их».
    reason: ambiguity_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Естественно вводит новый раздел родословия; начальное וְ передано его дискурсивной функцией, а не механическим союзом.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Обычное обозначение членов родословной; в данном контексте может охватывать и более дальних потомков.
- source_word: אֵחוּד
  choice: Эхуд
  rationale: Имя передано транслитерацией с еврейского, с сохранением начального гортанного согласного через «х».
- source_word: אֵלֶּה הֵם
  choice: Они были
  rationale: Передаёт возобновляющую и выделительную функцию еврейского выражения без тяжеловесного повтора «вот эти».
- source_word: רָאשֵׁי אָבוֹת
  choice: главами родов
  rationale: Передаёт социально-родословный смысл глав патрилинейных родовых объединений естественным современным русским выражением.
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: жителей Гевы
  rationale: 'Предлог לְ выражает здесь принадлежность или отношение: главы родов, относящихся к жителям Гевы.'
- source_word: וַיַּגְלוּם
  choice: и увели их в изгнание
  rationale: Каузативная форма глагола גלה обозначает принудительное удаление в изгнание; местоименная конструкция сохраняет неопределённость референтов субъекта и объекта.
- source_word: אֶל מָנָחַת
  choice: в Манахат
  rationale: Предлог направления передан естественной русской конструкцией; название места транслитерировано с еврейского.
theological_decisions:
- issue: Неясность референтов в וַיַּגְלוּם
  choice: Сохранить местоимения «они» и «их» в основном тексте и пояснить неясность в сноске.
  alternative: Уточнить субъект или объект как сыновей Эхуда либо жителей Гевы.
  rationale: Еврейская форма указывает на субъект во множественном числе и объект во множественном числе, но сам стих не называет их однозначно; уточнение внесло бы отсутствующее в источнике толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного повествования. Техническое выражение передано понятно как «главы родов», а буквальная форма отмечена в сноске. Неясность местоименных референтов сохранена.
