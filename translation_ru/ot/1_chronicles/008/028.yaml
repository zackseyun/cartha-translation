  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: ru
  text: Это были главы родов по своим поколениям[a], вожди. Они жили в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главы отцовских домов по своим поколениям — главы». В еврейском тексте повторяется слово со значением «глава, вождь», что служит усилению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: главы родов
  rationale: Еврейское сочетание обозначает руководителей отцовских домов, то есть родовых объединений. «Главы родов» естественно звучит по-русски и сохраняет социально-генеалогический смысл.
- source_word: לְתֹלְדוֹתָם
  choice: по своим поколениям
  rationale: תולדות указывает на поколения или линии происхождения; формальная передача не уточняет без необходимости, имеются ли в виду письменные родословные списки.
- source_word: רָאשִׁים
  choice: вожди
  rationale: Отдельное существительное вновь выражает идею главенства. «Вожди» сохраняет усилительный повтор корня по смыслу, не создавая неестественного сочетания «главы… главы».
- source_word: יָשְׁבוּ
  choice: жили
  rationale: В данном генеалогическом сообщении глагол означает постоянное проживание, а не буквальное сидение.
- source_word: בִירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Стандартная русская форма топонима с сохранением предлога места.
- source_word: אֵלֶּה ... אֵלֶּה
  choice: Это были ... Они
  rationale: Первое указательное местоимение сохранено прямо; второе естественно передано личным местоимением, поскольку буквальное «эти» в отдельном русском предложении звучало бы тяжеловесно.
