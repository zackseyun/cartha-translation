lexical_decisions:
- source_word: יַעֲרֶשְׁיָה
  choice: Иарешия
  rationale: Личное имя передано транслитерацией с еврейского; форма сохраняет звуковой состав масоретского чтения и соответствует нормам русской библейской ономастики.
- source_word: אֵלִיָּה
  choice: Илия
  rationale: Использована устоявшаяся русская библейская форма имени, соответствующая еврейскому אֵלִיָּה.
- source_word: זִכְרִי
  choice: Зихри
  rationale: Личное имя передано транслитерацией; сочетание כְ передано как «х», без перевода значения имени.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма множественного числа в сопряжённом состоянии непосредственно означает «сыновья». В родословиях слово может иметь более широкое значение «потомки», что отражено в сноске.
- source_word: יְרֹחָם
  choice: Иерохам
  rationale: Личное имя передано принятой русской библейской транслитерацией.
