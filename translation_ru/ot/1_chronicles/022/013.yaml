id: 1CH.22.13
reference: 1 Chronicles 22:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: ru
  text: Тогда ты преуспеешь[a], если будешь тщательно исполнять постановления и законы[b], которые Яхве заповедал Моисею для Израиля. Будь твёрд и мужествен. Не бойся и не падай духом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добьёшься успеха». Еврейский глагол может означать как преуспевание, так и успешное осуществление дела.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «установления и правовые предписания». В еврейском тексте употреблены два разных юридических термина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Естественно обозначает следствие, связанное с предшествующим наставлением.
- source_word: תַּצְלִיחַ
  choice: ты преуспеешь
  rationale: Hiphil глагола צלח может означать как процветание, так и успешное осуществление дела; «преуспеешь» сохраняет эту широту.
- source_word: אִם תִּשְׁמוֹר לַעֲשׂוֹת
  choice: если будешь тщательно исполнять
  rationale: Сочетание «хранить» с инфинитивом действия передаёт внимательное и верное соблюдение; по-русски это естественно выражается словами «тщательно исполнять».
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Передаёт установленные предписания и сохраняет отличие от מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: В данном правовом контексте обозначает обязательные нормы и судебно-правовые установления; отдельный перевод сохраняет различие двух еврейских терминов.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: которые Яхве заповедал Моисею для Израиля
  rationale: Прямое дополнение указывает, что заповедь дана Моисею, а עַל в контексте естественно передаётся как «для Израиля».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: חֲזַק וֶאֱמָץ
  choice: Будь твёрд и мужествен
  rationale: Естественная и достойная русская передача устойчивого призыва к силе, решимости и мужеству.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Прямая, краткая и естественная передача запрета.
- source_word: וְאַל תֵּחָת
  choice: и не падай духом
  rationale: Передаёт состояние внутренней сломленности, смятения или уныния современным литературным русским языком.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Связь преуспевания с послушанием
  choice: Сохранено условное «если»
  alternative: Истолковать как безусловное обещание или как гарантию материального благополучия
  rationale: Еврейский текст прямо выражает условие и не уточняет, что речь исключительно о материальном процветании; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис краткий и ясный; различие двух правовых терминов сохранено, а архаизмы по возможности исключены.
