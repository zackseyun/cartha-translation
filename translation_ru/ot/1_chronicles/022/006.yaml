  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: ru
  text: И призвал он своего сына Соломона и повелел ему построить дом для Яхве[a], Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дом для Господа»; по смыслу — «храм Господа». В еврейском тексте буквально: «дом для Яхве».'
    reason: Лексическая альтернатива и традиционный способ передачи Божьего имени.
lexical_decisions:
- source_word: וַיִּקְרָא לִשְׁלֹמֹה
  choice: И призвал он… Соломона
  rationale: Последовательная форма продвигает повествование, а קרא с ל при имени лица означает «позвать, призвать». «Призвал» естественно передаёт вызов Соломона к Давиду.
- source_word: בְנוֹ
  choice: своего сына
  rationale: Суффикс указывает на сына Давида; возвратное «своего» по-русски ясно связывает Соломона с подлежащим.
- source_word: וַיְצַוֵּהוּ
  choice: и повелел ему
  rationale: צוה обозначает авторитетное повеление; «повелел» сохраняет эту силу и соответствует достоинству повествования.
- source_word: לִבְנוֹת בַּיִת
  choice: построить дом
  rationale: Инфинитив передаёт содержание повеления, а בית буквально значит «дом»; контекстуальное значение «храм» вынесено в примечание, чтобы сохранить образ исходного текста.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל обозначает предназначение возводимого дома. Имя יהוה передано как «Яхве», то есть как личное Божье имя, а не как титул.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Конструктивное сочетание точно и естественно передаётся устойчивым русским выражением «Бог Израиля».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация сохраняет различие между именем и титулом; традиционный вариант указан в примечании без навязывания конфессионального прочтения.
- issue: Значение בַּיִת в культовом контексте
  choice: дом
  alternative: храм
  rationale: Буквальное «дом» сохраняет библейский образ жилища, посвящённого Богу, тогда как «храм» яснее выражает референт, но является контекстуальным уточнением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов «призвал он» поддерживает повествовательный ритм, не создавая архаической тяжеловесности.
