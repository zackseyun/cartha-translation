id: 1CH.22.10
reference: 1 Chronicles 22:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הֽוּא יִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י וְ/הוּא֙ יִהְיֶה לִּ֣/י לְ/בֵ֔ן וַ/אֲנִי ל֖/וֹ לְ/אָ֑ב וַ/הֲכִ֨ינוֹתִ֜י כִּסֵּ֧א מַלְכוּת֛/וֹ עַל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: ru
  text: Он построит дом для Моего имени[a]. Он будет Мне сыном, а Я буду ему Отцом. Я утвержу престол его царства над Израилем навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм для Моего имени». Буквально: «дом для Моего имени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: дом
  rationale: Основное значение слова — «дом». В данном контексте имеется в виду храм, однако «дом для Моего имени» сохраняет образ и формулировку еврейского текста.
- source_word: לִשְׁמִי
  choice: для Моего имени
  rationale: Прямая передача устойчивого библейского выражения о посвящённости Богу и Его присутствию; не раскрывает идиому посредством толкования в основном тексте.
- source_word: לְבֵן ... לְאָב
  choice: Мне сыном ... ему Отцом
  rationale: Сохраняет прямую формулу отношений завета и естественно звучит по-русски.
- source_word: וַהֲכִינוֹתִי
  choice: Я утвержу
  rationale: Порода хифиль глагола כון выражает придание прочности и устойчивости; «утвержу» точно подходит к династическому престолу.
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: престол его царства
  rationale: Передача сохраняет оба элемента исходного выражения — престол и царство — и тем самым его царский и династический смысл.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל в контексте царской власти обозначает правление над народом.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Естественная для современного литературного русского языка передача обещания непреходящей длительности.
theological_decisions:
- issue: Формула отношений Отца и сына относится непосредственно к Соломону и вместе с тем имеет более широкое значение в контексте обетования Давиду.
  choice: 'Сохранена прямая формула: «Он будет Мне сыном, а Я буду ему Отцом».'
  alternative: 'Толковательный пересказ: «Я буду относиться к нему как к сыну».'
  rationale: Еврейский текст прямо утверждает эти отношения. Такая передача не ослабляет формулу завета и не ограничивает её богословское значение заранее заданным толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в местоимениях «Моего», «Мне», «Я» и слове «Отцом» отражают устойчивую русскую традицию обозначения Бога; синтаксис слегка разгружен разделением на три предложения без изменения смысловых связей.
