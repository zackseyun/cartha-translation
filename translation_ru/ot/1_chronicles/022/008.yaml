source:
  edition: WLC
  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: ru
  text: 'Но слово Яхве пришло ко мне: «Ты пролил много крови[a] и вёл великие войны[b]. Ты не построишь дом для Моего имени[c], потому что пролил много крови на землю[d] предо Мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кровь во множестве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или буквально: «совершил великие войны».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть храм; по-еврейски буквально: «дом для Моего имени».'
    reason: cultural_note
  - marker: d
    text: 'Или: «на земле»; направительная форма также допускает буквальный смысл «на землю, на почву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет обычную формулу божественного обращения и передаёт личное имя יהוה как «Яхве».
- source_word: וַיְהִי עָלַי
  choice: ко мне было
  rationale: Естественно для библейского повествования передаёт идиому о слове, обращённом Богом к человеку, не превращая её в отвлечённое «послание».
- source_word: דָּם לָרֹב
  choice: много крови
  rationale: Сохраняет конкретный образ крови и выражает значение большого количества без излишней абстракции.
- source_word: שָׁפַכְתָּ
  choice: пролил
  rationale: В сочетании с «кровью» это устойчивый и точный русский эквивалент еврейской идиомы.
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: вёл великие войны
  rationale: Глагол עשה буквально широк по значению; по-русски войны естественно «ведут». Определение «великие» сохраняет масштаб и формальную окраску גדלות.
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: Ты не построишь дом Моему имени
  rationale: Будущее с отрицанием естественно передаёт запрет или определённое Богом решение. «Дом» и «Моему имени» сохраняют храмовую и заветную образность оригинала.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит названную в тексте причину.
- source_word: דָּמִים רַבִּים
  choice: много крови
  rationale: Хотя множественное דמים может указывать на кровопролитие или вину за кровь, конкретное «много крови» сохраняет образ и намеренный повтор первой части стиха.
- source_word: אַרְצָה
  choice: на землю
  rationale: 'Передаёт направительную форму слова «земля»: кровь была пролита на землю. Возможное обстоятельственное понимание отмечено в сноске.'
- source_word: לְפָנַי
  choice: предо Мной
  rationale: Сохраняет пространственно-богословский образ происходящего перед лицом Бога, то есть в Его присутствии и на Его глазах.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале стоит личное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Передача בַיִת в храмовом контексте
  choice: дом
  alternative: храм
  rationale: Речь идёт о храме, однако буквальное «дом» сохраняет важный библейский образ дома для имени Бога; значение поясняется в сноске.
- issue: Значение דָּמִים во второй половине стиха
  choice: кровь
  alternative: кровопролитие; вина за кровь
  rationale: Контекст безусловно говорит о пролитой крови, но сам стих не формулирует отдельно юридическое понятие вины. Конкретный образ не следует без необходимости заменять богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для обычного читателя; формы «Яхве», «дом Моему имени» и «предо Мной» сохраняют ключевую образность оригинала без конфессиональной конкретизации.
