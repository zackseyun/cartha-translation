- source_word: וַ/עֲצֵי אֲרָזִים
  choice: и кедровых брёвен
  rationale: В контексте заготовки материалов для строительства сочетание обозначает кедровый лесоматериал; «брёвна» естественно передаёт конкретный строительный материал, не подразумевая стоящие деревья.
- source_word: לְ/אֵין מִסְפָּר
  choice: без счёта
  rationale: Устойчивое русское выражение точно передаёт идею неисчислимого количества и сохраняет лаконизм древнееврейского оборота.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему кедрового материала было так много.
- source_word: הֵבִיאוּ
  choice: доставляли
  rationale: Глагол означает «приносить, привозить, доставлять». Несовершенный вид по-русски естественно представляет многократное или продолжительное снабжение, не добавляя идеи единовременного действия.
- source_word: הַ/צִּידֹנִים וְ/הַ/צֹּרִים
  choice: сидоняне и тиряне
  rationale: Общепринятые русские названия жителей Сидона и Тира.
- source_word: לָ/רֹב
  choice: во множестве
  rationale: Передаёт большое количество и сохраняет отличие от предшествующего усиленного выражения «без счёта».
- source_word: לְ/דָוִד
  choice: Давиду
  rationale: Дательный падеж прямо и естественно обозначает получателя поставок.
