  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: ru
  text: 'И при тебе множество работников для дела: каменотёсов, мастеров по камню и дереву, а также всякого искусного мастера во всяком ремесле.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и всякого искусного во всяком деле». Форма мужского рода единственного числа употреблена собирательно и относится к искусным работникам.'
    reason: Уточняет, что добавленное в русском тексте слово «мастера» поясняет подразумеваемого квалифицированного работника, а не ограничивает группу по полу.
lexical_decisions:
- source_word: וְעִמְּךָ לָרֹב
  choice: И при тебе множество
  rationale: Передаёт прямое обращение к Соломону и идею большого количества естественным современным русским выражением.
- source_word: עֹשֵׂי מְלָאכָה
  choice: работников для дела
  rationale: Обозначает людей, занятых работой над строительным замыслом; «для дела» сохраняет целевую связь и избегает тяжёлого повтора.
- source_word: חֹצְבִים
  choice: каменотёсов
  rationale: В строительном контексте причастие обозначает тех, кто обтёсывает или высекает камень; объект уточняется из ближайшего контекста.
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: мастеров по камню и дереву
  rationale: חָרָשׁ обозначает искусного ремесленника; русское сочетание естественно передаёт обе названные области работы.
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  choice: и всяких искусных во всяком ремесле
  rationale: חָכָם здесь означает практическое умение, а не отвлечённую мудрость. Субстантивированное «искусных» сохраняет собирательно-представительное значение; повтор «всяких… во всяком» отражает двойное כָל.
theological_decisions:
- issue: Род и представительное значение выражения כָל חָכָם
  choice: всяких искусных
  alternative: каждого искусного мужчину / всякого искусного работника
  rationale: Древнееврейское выражение стоит в форме мужского рода единственного числа, но в перечне рабочей силы имеет представительное значение. Русское субстантивированное «искусных» не вводит необоснованного ограничения только мужчинами и сохраняет смысл квалифицированных людей.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Каменотёсы» — точный и понятный профессиональный термин; «ремесло» в конце помогает избежать неясного повтора слова «дело».
