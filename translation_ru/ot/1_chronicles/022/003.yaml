base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: ru
  text: Давид заготовил железо в большом количестве для гвоздей к дверям ворот и для соединительных деталей, а также столько меди, что её невозможно было взвесить[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «петель». Еврейское слово имеет широкое значение и обозначает соединительные детали.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «без веса»; то есть меди было слишком много, чтобы её взвешивать.'
    reason: idiom_clarification
lexical_decisions:
- source_word: בַרְזֶל
  choice: железо
  rationale: Слово прямо обозначает железо как строительный материал.
- source_word: לָרֹב
  choice: множество / столько
  rationale: Оборот указывает на чрезвычайно большое количество; варианты согласованы с естественным русским синтаксисом в двух частях стиха.
- source_word: מִּסְמְרִים
  choice: гвозди
  rationale: В контексте изготовления дверей это наиболее прямой и достаточно широкий эквивалент.
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: двери ворот
  rationale: Передаёт принадлежность дверных створок воротам и естественно звучит по-русски.
- source_word: מְחַבְּרוֹת
  choice: скрепы
  rationale: Сохраняет общее значение соединительных металлических деталей, не сужая его до петель.
- source_word: הֵכִין
  choice: заготовил
  rationale: В данном перечне строительных материалов глагол означает, что Давид заранее обеспечил наличие необходимого; «заготовил» естественнее общего «приготовил».
- source_word: נְחֹשֶׁת
  choice: медь
  rationale: Еврейское נְחֹשֶׁת может обозначать медь или медный сплав; традиционное и понятное русское название материала — «медь».
- source_word: אֵין מִשְׁקָל
  choice: невозможно было взвесить
  rationale: Буквальный идиоматический оборот «нет веса» в контексте выражает неисчислимо большое количество, а не отсутствие физического веса.
