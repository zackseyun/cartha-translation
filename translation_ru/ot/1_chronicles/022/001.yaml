base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: ru
  text: 'Тогда Давид сказал: «Это дом[a] Яхве, Бога, и это жертвенник для всесожжений[b] Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм». Буквально: «дом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для всесожжения». Древнееврейское существительное стоит в единственном числе, но может употребляться в родовом значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: דָּוִיד
  choice: Давид
  rationale: Устоявшаяся русская форма личного имени.
- source_word: זֶה הוּא
  choice: Это
  rationale: Сочетание указательного местоимения с личным местоимением подчёркивает отождествление; русское «это» передаёт его прямо, без добавления слова «место».
- source_word: בֵּית
  choice: дом
  rationale: Буквальное значение существительного — «дом». В данном контексте имеется в виду будущий храм, но «дом» сохраняет формулировку и образность древнееврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: הָאֱלֹהִים
  choice: Бога
  rationale: Слово стоит в приложении к имени Яхве; родительный падеж согласован с конструкцией «дом Яхве Бога».
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Обычное русское обозначение сооружения для принесения жертв.
- source_word: לְעֹלָה
  choice: для всесожжения
  rationale: Предлог לְ указывает на назначение, а существительное עֹלָה употреблено в единственном числе, которое может иметь родовое или собирательное значение.
- source_word: לְיִשְׂרָאֵל
  choice: Израиля
  rationale: Родительный падеж естественно и кратко передаёт отношение жертвенника к Израилю; по смыслу допустимо также более явное «для Израиля».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте употреблено личное имя Бога. Транслитерация «Яхве» сохраняет это имя и не заменяет его титулом.
- issue: Передача בֵּית как «дом» или «храм»
  choice: дом
  alternative: храм
  rationale: Хотя контекст указывает на место будущего храма, древнееврейский текст буквально говорит «дом». Такой перевод не устраняет образность и не вносит уточнение непосредственно в основной текст.
- issue: Число при עֹלָה
  choice: всесожжение в единственном числе с родовым значением
  alternative: всесожжения во множественном числе
  rationale: Форма оригинала единственного числа, однако по смыслу она может обозначать данный вид жертвоприношений вообще; эта открытость отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Сохранены повтор «это» и буквальный образ «дом»; порядок «Яхве Бога» следует оригиналу, хотя для русского он несколько необычен.
