source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: ru
  text: Давид велел собрать иноземцев[a], живших в земле Израиля, и назначил каменотёсов, чтобы они высекали тёсаные камни[b] для строительства дома Божьего[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «пришельцев», или «чужеземцев, постоянно живших в стране». Еврейское слово обозначает людей не из коренного населения, живущих среди израильтян.
    reason: lexical_alternative
  - marker: b
    text: Или «обработанные камни», или «высеченные камни».
    reason: lexical_alternative
  - marker: c
    text: То есть храма.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: велел
  rationale: Хотя буквально глагол означает «сказал», сочетание с инфинитивом לִכְנוֹס выражает распоряжение. «Велел» естественно передаёт эту силу в современном русском языке.
- source_word: לִכְנוֹס
  choice: собрать
  rationale: Инфинитив обозначает содержание распоряжения Давида. Конструкция «велел собрать» ясно показывает, что сбор должны были осуществить другие люди.
- source_word: הַגֵּרִים
  choice: иноземцев
  rationale: Слово обозначает людей не из коренного израильского населения, живущих среди Израиля. «Иноземцы» сохраняет отличие от израильтян и звучит менее бюрократично, чем «постоянно проживающие иностранцы».
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: в земле Израиля
  rationale: Сохранено явное значение אֶרֶץ — «земля», важное для территориального смысла выражения.
- source_word: וַיַּעֲמֵד
  choice: назначил
  rationale: В данном контексте глагол означает поручение людям определённой работы, а не просто физическое размещение.
- source_word: חֹצְבִים
  choice: каменотёсов
  rationale: Причастие обозначает работников, обрабатывающих или высекающих камень. «Каменотёсы» — точное и понятное профессиональное наименование.
- source_word: לַחְצוֹב
  choice: чтобы они высекали
  rationale: Целевая конструкция передаёт назначение работников; «высекали» сохраняет смысл обработки камня и естественно сочетается с «каменотёсами».
- source_word: אַבְנֵי גָזִית
  choice: тёсаные камни
  rationale: Выражение обозначает камни, обтёсанные и подготовленные для строительства. Это устойчивый и точный русский эквивалент.
- source_word: לִבְנוֹת
  choice: для строительства
  rationale: Предложная конструкция естественно передаёт цель заготовки камней.
- source_word: בֵּית הָאֱלֹהִים
  choice: дома Божьего
  rationale: Сохранён образ исходного выражения «дом Бога» без замены в основном тексте на толковательное «храм».
theological_decisions:
- issue: Передача בֵּית הָאֱלֹהִים
  choice: дом Божий
  alternative: храм Божий
  rationale: Речь идёт о будущем храме, однако еврейский текст буквально говорит о «доме Бога». Основной текст сохраняет исходный образ, а значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Синтаксис сделан ясным для широкого читателя; исходные образы «земля Израиля» и «дом Божий» сохранены.
