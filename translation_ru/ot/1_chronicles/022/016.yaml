  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: ru
  text: Золота, серебра, бронзы и железа — без счёта[a]. Встань и приступай к делу, и да будет Яхве с тобой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нет числа»; то есть их невозможно сосчитать.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «и Яхве будет с тобой». Еврейская форма может выражать пожелание или благословение.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: Золота, серебра, бронзы и железа
  rationale: Повторяющийся предлог ל вводит перечень материалов как тему; по-русски естественнее всего передать это вынесенным перечнем в родительном падеже перед сказуемым «без счёта».
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: В перечне строительных материалов и металлов для храмовых работ слово обычно обозначает бронзу; значение «медь» также лексически возможно.
- source_word: אֵין מִסְפָּר
  choice: без счёта
  rationale: Устойчивое и ясное русское выражение передаёт идиому неисчислимого количества, не утяжеляя фразу буквальным «нет числа».
- source_word: קוּם וַעֲשֵׂה
  choice: Встань и приступай к делу
  rationale: Первый императив сохраняет образ побуждения к действию, а עשה в контексте предстоящего строительства естественно передано как призыв приступить к делу.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: и да будет Яхве с тобой
  rationale: Юссивная форма выражает пожелание или благословение; конструкция «да будет» сохраняет эту модальность, а личное имя передано как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и соответствует предоставленному аудированному решению, не подменяя его титулом.
- issue: Модальность וִיהִי יְהוָה עִמָּךְ
  choice: 'пожелание: «да будет Яхве с тобой»'
  alternative: 'утверждение: «Яхве будет с тобой»'
  rationale: Форма וִיהִי допускает в данном контексте благословение или пожелание; основной текст сохраняет эту естественную юссивную силу, а возможность обещательного прочтения отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формулировка краткая и побудительная; архаизмы избегаются. Все сноски имеют соответствующие маркеры в основном тексте.
