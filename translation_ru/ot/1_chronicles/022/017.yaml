lexical_decisions:
- source_word: וַיְצַו
  choice: Тогда Давид повелел
  rationale: Глагольная форма продолжает последовательное повествование, поэтому וַ передано словом «тогда»; «повелел» сохраняет силу властного распоряжения.
- source_word: שָׂרֵי
  choice: вождям
  rationale: Слово обозначает руководителей или начальствующих лиц. «Вожди» — понятное современное обозначение национального руководства, не сужающее его до конкретной должности.
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: всем вождям Израиля
  rationale: Перевод сохраняет всеохватность כָל и принадлежность руководителей к Израилю, не уточняя их должности сверх исходного текста.
- source_word: לַעְזֹר
  choice: помогать
  rationale: Инфинитив עזר прямо означает «помогать, оказывать помощь»; несовершенный вид естественно выражает порученную поддержку в предстоящем деле.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: его сыну Соломону
  rationale: Русский порядок слов естественно передаёт имя адресата и подчёркивает указанное в еврейском тексте родство с Давидом.
