base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: ru
  text: 'И сказал Давид своему сыну Соломону: «Что до меня, у меня было на сердце построить дом для имени Яхве, моего Бога».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с последовательным וַ передаёт развитие повествования; обычное русское «И сказал» сохраняет библейский повествовательный ход.
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: своему сыну Соломону
  rationale: Естественный русский порядок слов точно передаёт отношение между Давидом и Соломоном.
- source_word: אֲנִי
  choice: Что до меня
  rationale: Самостоятельное местоимение имеет оттенок смыслового выделения; оборот «Что до меня» передаёт его без чрезмерного усиления.
- source_word: הָיָה עִם לְבָבִי
  choice: у меня было на сердце
  rationale: Устойчивый современный русский оборот сохраняет образ сердца и выражает внутреннее намерение или решимость Давида.
- source_word: לִבְנוֹת בַּיִת
  choice: построить дом
  rationale: Сохраняется буквальное значение בַּיִת и характерное библейское обозначение святилища как дома; перевод «храм» был бы более пояснительным.
- source_word: לְשֵׁם
  choice: во имя
  rationale: Русское «во имя» естественно передаёт посвящение дома имени Яхве и сохраняет богословски значимое упоминание имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהָי
  choice: моего Бога
  rationale: Сохранён явный суффикс первого лица единственного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя сохраняется в принятой русской транслитерации «Яхве».
- issue: Передача בַּיִת применительно к будущему святилищу
  choice: дом
  alternative: храм
  rationale: Исходный текст говорит «дом». Контекст позволяет понять, что речь идёт о храме, не устраняя исходный образ.
- issue: Значение выражения לְשֵׁם
  choice: во имя
  alternative: для имени; в честь имени
  rationale: Формулировка сохраняет связь будущего дома с именем и присутствием Яхве, не сводя её лишь к чествованию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис ясен для обычного читателя; образы «на сердце», «дом» и «имя» сохранены. Сноски не требуются.
