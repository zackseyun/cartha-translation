  source_fidelity: 'Смысл передан верно: Давид обращается к Соломону, выделяет собственное намерение, говорит о строительстве «дома» и сохраняет личное имя Яхве и «моего Бога». Однако «во имя Яхве» несколько смещает более буквальное лְשֵׁם — «для имени [Яхве]»; в данном храмовом контексте эта формула точнее сохраняет исходную конструкцию.'
