  text: אַ֣ךְ יִֽתֶּן לְּ/ךָ֤ יְהוָה֙ שֵׂ֣כֶל וּ/בִינָ֔ה וִֽ/יצַוְּ/ךָ֖ עַל יִשְׂרָאֵ֑ל וְ/לִ/שְׁמ֕וֹר אֶת תּוֹרַ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: ru
  text: Лишь пусть Яхве даст тебе благоразумие и разумение и поставит тебя над Израилем[a], чтобы ты соблюдал закон[b] Яхве, твоего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повелит тебе относительно Израиля»; еврейский глагол можно также понять как «поручит тебе Израиль».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наставление Яхве, твоего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: Ограничительно-усилительная частица выделяет главное в пожелании Давида; «только» сохраняет этот акцент без превращения фразы в простое противопоставление.
- source_word: יִתֶּן
  choice: пусть ... даст
  rationale: Имперфект в данном контексте выражает пожелание или благословение; русская конструкция с «пусть» естественно передаёт это значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: שֵׂכֶל וּבִינָה
  choice: благоразумие и разумение
  rationale: 'Сохраняется смысловая пара: שֵׂכֶל обозначает практическую рассудительность, а בִינָה — способность понимать и различать.'
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: и поставит тебя над Израилем
  rationale: В царском контексте сочетание צוה с עַל допускает смысл поручения власти или попечения над народом. Формулировка естественна по-русски, а более буквальный вариант отмечен в сноске.
- source_word: וְלִשְׁמוֹר
  choice: чтобы ты соблюдал
  rationale: Союз с инфинитивом выражает цель или ожидаемый результат; «чтобы» ясно и естественно передаёт эту связь.
- source_word: תּוֹרַת
  choice: закон
  rationale: В заветном контексте традиционное «закон» уместно и понятно, хотя слово также может означать «наставление», что отражено в сноске.
- source_word: אֱלֹהֶיךָ
  choice: твоего Бога
  rationale: Точно передаёт существительное с суффиксом второго лица мужского рода единственного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение וִיצַוְּךָ עַל יִשְׂרָאֵל в царском контексте
  choice: поставит тебя над Израилем
  alternative: даст тебе повеление об Израиле; поручит тебе Израиль
  rationale: Контекст обращения к Соломону допускает значение наделения полномочием над народом, однако обычное значение глагола «повелевать» остаётся возможным и поэтому не скрывается, а приводится в сноске.
- issue: Значение תּוֹרָה
  choice: закон
  alternative: наставление
  rationale: «Закон» сохраняет узнаваемое заветное употребление, тогда как более широкая семантика наставления указана отдельно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; смысловые неоднозначности еврейского текста вынесены в сноски. Маркеры сносок размещены непосредственно при соответствующих выражениях.
