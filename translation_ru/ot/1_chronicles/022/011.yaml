base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: ru
  text: Теперь, сын мой, пусть Яхве будет с тобой, и пусть ты преуспеешь[a] и построишь дом Яхве, твоего Бога[b], как Он сказал о тебе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добьёшься успеха»; еврейский глагол может означать «преуспеть» или «иметь успех».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «храм Яхве, твоего Бога». Буквально: «дом Яхве, твоего Бога».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как Он обещал относительно тебя». В еврейском тексте буквальнее: «как Он сказал о тебе».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: Итак
  rationale: В данном обращении слово служит не только временным указанием, но и переходом к благословению и наставлению; «итак» естественно передаёт эту дискурсивную функцию.
- source_word: בְנִי
  choice: сын мой
  rationale: Сохраняет прямое отцовское обращение и соответствует естественному русскому порядку слов в торжественной речи.
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: пусть Яхве будет с тобой
  rationale: Юссив יְהִי выражает пожелание или благословение, а не простое предсказание.
- source_word: וְהִצְלַחְתָּ
  choice: и пусть ты преуспеешь
  rationale: Глагол צלח в породе hifil может означать «преуспеть» или «добиться успеха». Модальная форма связывает его с предшествующим благословением, не сводя успех к материальному благополучию.
- source_word: וּבָנִיתָ
  choice: и построишь
  rationale: Форма продолжает последовательность после юссива и допускает оттенок ожидаемого результата или пожелания; русская координация под общим «пусть» сохраняет эту связь без превращения высказывания в категорическое предсказание.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: дом Яхве, твоего Бога
  rationale: Буквально сохраняет образ «дома» и поясняет, что Яхве — Бог Соломона; «храм» возможно по смыслу, но более истолковательно.
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: как Он говорил о тебе
  rationale: Передаёт обычное значение דבר + על и не усиливает высказывание до явного «обещал», хотя по контексту речь Бога имеет силу обещания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Сила глагольной последовательности после יְהִי
  choice: 'Пожелание-благословение с ожидаемым исполнением: «пусть… преуспеешь и построишь»'
  alternative: 'Категорическое предсказание: «будет с тобой, и ты преуспеешь и построишь»; целевая связь: «чтобы ты преуспел и построил»'
  rationale: Начальный юссив ясно задаёт благословительный тон, тогда как последующие перфектные формы допускают ожидаемый результат. Общая сфера действия «пусть» сохраняет модальность, не добавляя отсутствующего в тексте явного значения цели.
- issue: «Дом» или «храм»
  choice: дом Яхве
  alternative: храм Яхве
  rationale: «Дом» формально соответствует בֵּית и сохраняет библейский образ; «храм» яснее обозначает сооружение, но сужает выражение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Обращение «сын мой» и конструкция с «пусть» передают отцовское благословение без излишней архаизации. Прописное «Он» употреблено как уважительное обозначение Бога.
