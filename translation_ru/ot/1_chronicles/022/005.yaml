base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: ru
  text: 'И сказал Давид: «Сын мой Соломон молод и неопытен[a], а дом, который должен быть построен для Яхве[b], должен быть весьма великим, чтобы прославиться и явить великолепие во всех землях[c]. Я же приготовлю для него». И Давид сделал обильные приготовления перед своей смертью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молод и нежен (незрел)». Еврейское слово буквально обозначает мягкость или нежность, а здесь, вероятно, указывает на молодость и недостаток опыта.'
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога, переданное в еврейском тексте четырьмя согласными יהוה (ЙХВХ).
    reason: divine_name
  - marker: c
    text: 'Буквально: «для имени и для великолепия во всех землях». То есть дом должен обрести широкую славу и отличаться великолепием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: молод и неопытен
  rationale: נַעַר указывает на относительную молодость Соломона, а רַךְ буквально означает мягкость или нежность, но в данном контексте передаёт незрелость и недостаток опыта.
- source_word: הַבַּיִת
  choice: дом
  rationale: Сохраняет прямое значение еврейского слова и образ дома Яхве; по контексту речь идёт о храме.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Передаёт непосредственно употреблённое в источнике личное имя Бога, тетраграмматон יהוה.
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: должен быть чрезвычайно величественным
  rationale: Выражение подчёркивает исключительное величие будущего здания; русская формулировка естественно передаёт усиление.
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: славным и великолепным
  rationale: שֵׁם здесь связано с известностью и славой, а תִּפְאֶרֶת — с великолепием и красотой.
- source_word: לְכָל הָאֲרָצוֹת
  choice: в глазах всех стран
  rationale: Передаёт международный масштаб славы и великолепия дома, сохраняя множественное число «страны/земли».
- source_word: אָכִינָה נָּא לוֹ
  choice: Поэтому я приготовлю всё для него
  rationale: Когортатив выражает решимость Давида; местоименный суффикс допускает соотнесение с домом или Соломоном, поэтому русский оборот сохраняет сходную референциальную открытость.
- source_word: וַיָּכֶן דָּוִיד לָרֹב
  choice: Давид ... заготовил великое множество всего необходимого
  rationale: לָרֹב обозначает изобилие или большое количество; добавление «всего необходимого» естественно выражает подразумеваемые материалы и приготовления.
- source_word: לִפְנֵי מוֹתוֹ
  choice: до своей смерти
  rationale: Прямое и естественное русское временное выражение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе стоит личное имя Бога; транслитерация сохраняет различие между именем יהוה и титулом «Господь».
- issue: Передача הַבַּיִת
  choice: дом
  alternative: храм
  rationale: «Дом» формально соответствует источнику и сохраняет богословски значимый образ; примечание разъясняет референт без подмены текста.
- issue: Референт суффикса в לוֹ
  choice: сохранена возможная отсылка к дому или Соломону
  alternative: однозначно «для храма»
  rationale: Мужской суффикс грамматически может соотноситься как с «домом», так и с Соломоном; перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным тоном. Сохранён образ «дома» и имя Яхве; буквальные семитские конструкции сглажены там, где они звучали бы неестественно, при этом существенная неоднозначность לוֹ отмечена и по возможности сохранена.
