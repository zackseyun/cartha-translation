revisions:
- from: Итак, обратите ваше сердце и вашу душу к тому, чтобы искать Яхве, вашего Бога.[a] Встаньте и постройте святилище Яхве Бога, чтобы внести ковчег завета Яхве и священные принадлежности Бога в дом, который будет построен во имя Яхве.[b]
  to: Итак, направьте сердца и души ваши на поиск Яхве, Бога вашего.[a] Встаньте и постройте святилище Яхве Бога, чтобы внести ковчег завета Яхве и священные предметы Бога в дом, который будет построен во имя Яхве.[b]
  rationale: Перевод исправлен только там, где требовались более естественные и точные русские соответствия. «Направьте сердца и души ваши на поиск» передаёт образную конструкцию «дать сердце и душу» без ненужной перифразы; «священные предметы» адекватно охватывает значение храмовой утвари. Неоднозначность причастия «строящийся/предназначенный к строительству» сохранена естественным будущим «будет построен», согласующимся с контекстом повеления о строительстве.
