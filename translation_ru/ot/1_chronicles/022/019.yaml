  text: עַתָּ֗ה תְּנ֤וּ לְבַבְ/כֶם֙ וְ/נַפְשְׁ/כֶ֔ם לִ/דְר֖וֹשׁ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/ק֗וּמוּ וּ/בְנוּ֙ אֶת מִקְדַּשׁ֙ יְהוָ֣ה הָֽ/אֱלֹהִ֔ים לְ/הָבִ֞יא אֶת אֲר֣וֹן בְּרִית יְהוָ֗ה וּ/כְלֵי֙ קֹ֣דֶשׁ הָֽ/אֱלֹהִ֔ים לַ/בַּ֖יִת הַ/נִּבְנֶ֥ה לְ/שֵׁם יְהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: ru
  text: Итак, направьте сердца и души ваши на поиск Яхве, Бога вашего.[a] Встаньте и постройте святилище Яхве Бога, чтобы внести ковчег завета Яхве и священные предметы Бога в дом, который будет построен во имя Яхве.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдайте сердца и души ваши на поиск Яхве, Бога вашего».'
    reason: lexical_alternative
  - marker: b
    text: «Дом» здесь означает храмовое здание, которое должно быть возведено во имя Яхве.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Итак
  rationale: В контексте заключительного призыва Давида слово служит переходом к настоятельному выводу; «итак» естественно передаёт дискурсивно-временной оттенок.
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: обратите ваше сердце и вашу душу
  rationale: Буквально говорится «дайте ваше сердце и вашу душу». Русское «обратите ... к тому, чтобы» передаёт сознательную направленность, сохраняя оба антропологических термина.
- source_word: לִדְרוֹשׁ
  choice: искать
  rationale: Глагол דרשׁ применительно к Богу обозначает стремление к нему, обращение к нему и преданное взыскание его; «искать» сохраняет широту значения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо представленное тетраграмматоном в еврейском тексте.
- source_word: וְקוּמוּ וּבְנוּ
  choice: Встаньте и постройте
  rationale: Сохраняет последовательность двух повелительных форм и энергичный характер призыва.
- source_word: מִקְדַּשׁ
  choice: святилище
  rationale: Точно обозначает священное место и не смешивает его с последующим словом «дом», указывающим на храмовое здание.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Сохраняет цепочку родительных отношений исходного текста и традиционное обозначение ковчега.
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: священные принадлежности Бога
  rationale: כְּלִי может обозначать сосуды, предметы или утварь; «принадлежности» не сужает значение только до сосудов и остаётся понятным современному читателю.
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: в дом, который будет построен во имя Яхве
  rationale: Причастная форма в контексте запланированного строительства естественно передаётся будущим временем; «во имя» сохраняет формулу посвящения имени Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст употребляет собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Сочетание «сердце и душа»
  choice: Сохранены оба слова
  alternative: всем существом; всем сердцем
  rationale: Два еврейских термина вместе усиливают призыв к полной внутренней решимости, но текст не требует превращать их в строгую схему устройства человека.
- issue: Фраза לְשֵׁם יְהוָה
  choice: во имя Яхве
  alternative: для имени Яхве; посвящённый имени Яхве
  rationale: Формальная и богословски насыщенная формула сохранена без пояснительного расширения; она указывает на храм как место, связанное с именем Яхве, не утверждая, что Бог ограничен зданием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Сохранены повелительная сила обращения, повторение имени Яхве и различие между «святилищем» и «домом»; архаизмы вроде «взыщите» и «восстаньте» не использованы.
