source:
  edition: WLC
  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: ru
  text: Разве Яхве, ваш Бог, не с вами? Разве не Он даровал вам покой со всех сторон? Ведь Он отдал в мою руку жителей земли, и земля была покорена перед Яхве и перед его народом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «его» вероятнее всего относится к Яхве; возможно также, что оно относится к Давиду. Выражение «перед его народом» может означать также «на глазах у его народа».
    reason: Сохраняет возможную неоднозначность референта местоименного суффикса и смысловой оттенок выражения לִפְנֵי.
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественно для современного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵיכֶם עִמָּכֶם
  choice: с вами Яхве, ваш Бог
  rationale: Сохраняет прямое утверждение о Божьем присутствии и поддержке; форма אֱלֹהֵיכֶם здесь имеет единственное значение «ваш Бог».
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: даровал вам покой со всех сторон
  rationale: В контексте покорения врагов глагол означает предоставление покоя или избавления от угроз вокруг.
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание для предшествующего риторического утверждения и естественно связывает части русской фразы.
- source_word: נָתַן בְּיָדִי
  choice: отдал в мою руку
  rationale: Сохраняет еврейский образ передачи во власть говорящего; смысл понятен из контекста.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жителей этой земли
  rationale: Естественно передаёт субстантивированное причастие; указательное «этой» контекстуально обозначает упомянутую землю без изменения референта.
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: и земля была покорена
  rationale: Страдательная форма точно передаёт нифаль глагола כבש и завершённое покорение земли.
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: перед Яхве и перед Его народом
  rationale: Сохраняет синтаксический параллелизм и наиболее вероятную отсылку местоимения к Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: К кому относится суффикс в עַמּוֹ («его народом»)
  choice: 'К Яхве: «Его народом»'
  alternative: 'К Давиду: «его народом», то есть народом Давида'
  rationale: Ближайший явно названный референт — Яхве, а сочетание «перед Яхве и перед Его народом» естественно связывает Бога с Его народом. Однако грамматическая форма сама по себе допускает отнесение к Давиду, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «Разве не» делает обе координированные части исходного риторического вопроса естественными по-русски. Сохранены образ «в мою руку» и параллелизм «перед Яхве и перед Его народом».
