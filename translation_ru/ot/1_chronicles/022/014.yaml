  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: ru
  text: И вот, в моём бедствии[a] я приготовил для дома Яхве сто тысяч талантов золота и миллион[b] талантов серебра. Количество бронзы и железа не было взвешено, потому что их было очень много. Я приготовил также древесину и камни, а ты добавишь[c] к ним ещё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в моей нужде»; еврейское слово может означать бедствие, тяготы, нужду или бедность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тысячу тысяч».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «добавь к ним» или «можешь добавить к ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְעָנְיִי
  choice: в моём бедствии
  rationale: עֳנִי обозначает бедствие, тяготы или нужду; «бедствие» сохраняет широту значения, не сводя его только к материальной бедности.
- source_word: הֲכִינוֹתִי
  choice: я приготовил
  rationale: Hiphil глагола כון означает «приготовить, сделать готовым»; русский совершенный вид естественно передаёт завершённую подготовку.
- source_word: לְבֵית יְהוָה
  choice: для дома Яхве
  rationale: Сохранены буквальный образ «дома» и личное имя יהוה; из контекста ясно, что речь идёт о храме.
- source_word: כִּכָּרִים
  choice: талантов
  rationale: כִּכָּר — древняя крупная мера веса, традиционно называемая талантом.
- source_word: אֶלֶף אֲלָפִים
  choice: миллион
  rationale: Современное русское обозначение количества ясно передаёт буквальное «тысяча тысяч».
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: меди и железа — без счёта по весу
  rationale: 'Оборот сохраняет связь с מִשְׁקָל «вес, взвешивание», но не создаёт впечатления, будто металлы не имеют веса: их количество не было исчислено взвешиванием.'
- source_word: כִּי לָרֹב הָיָה
  choice: потому что их было очень много
  rationale: Естественно выражает причинное пояснение и согласует собирательное еврейское единственное число с двумя названными металлами по нормам русского языка.
- source_word: וְעֵצִים וַאֲבָנִים
  choice: также древесину и камни
  rationale: В строительном контексте עֵצִים точнее передаётся как «древесина», а не просто «дерево».
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: а ты добавишь к ним ещё
  rationale: Еврейский имперфект допускает оттенок будущего действия или мягкого побуждения; форма «добавишь» сохраняет эту модальную открытость.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблено тетраграмматическое имя; транслитерация сохраняет личное Божье имя, не заменяя его титулом.
- issue: Модальность תּוֹסִיף
  choice: ты добавишь
  alternative: добавь; можешь добавить
  rationale: Имперфект в обращении к Соломону допускает будущее, наставление или разрешение. Основной текст не усиливает его до однозначного приказа, а примечание сохраняет варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён для ясности, однако сохранены ключевые еврейские образы («дом Яхве») и неоднозначность заключительного глагола.
