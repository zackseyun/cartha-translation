  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: ru
  text: Вот, у тебя родится сын. Он будет человеком покоя, и Я дам ему покой от всех врагов, окружающих его. Ведь имя ему будет Соломон[a], и в его дни Я дарую Израилю мир и спокойствие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Соломон» созвучно еврейскому слову шалом — «мир»; в этом стихе оно также тематически связано с покоем.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную и привлекающую внимание силу еврейского слова, оставаясь естественным для торжественной речи на современном русском языке.
- source_word: בֵן נוֹלָד לָךְ
  choice: у тебя родится сын
  rationale: Передаёт будущий смысл причастной формы в контексте обещания; русская конструкция естественно выражает рождение сына Давиду.
- source_word: אִישׁ מְנוּחָה
  choice: человек покоя
  rationale: Сохраняет отдельное понятие מְנוּחָה и его связь с последующим глаголом נוח, не подменяя его словом שָׁלוֹם «мир».
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: и Я дам ему покой
  rationale: Сохраняет корневой повтор с מְנוּחָה и ясно выражает дарованную Богом безопасность.
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: от всех врагов, окружающих его
  rationale: Передаёт как совокупность врагов, так и значение «со всех сторон», без тяжеловесного буквального оборота.
- source_word: כִּי
  choice: опущено как отдельный союз
  rationale: В русском пояснительная связь естественно выражена последовательностью предложений; перевод «ибо» придал бы тексту ненужную архаичность, а «потому что» мог бы чрезмерно сузить связь.
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: Имя ему будет Соломон
  rationale: Сохраняет выделение имени и естественно звучит в современном литературном русском.
- source_word: וְשָׁלוֹם וָשֶׁקֶט
  choice: мир и спокойствие
  rationale: Различает два еврейских существительных и передаёт общественное благополучие и безопасную, тихую жизнь.
- source_word: אֶתֵּן עַל יִשְׂרָאֵל בְּיָמָיו
  choice: в его дни Я дарую Израилю
  rationale: «Дарую» уместно передаёт божественное дарование, а «в его дни» ясно относится ко времени царствования сына.
theological_decisions:
- issue: Связь между покоем, именем Соломона и миром
  choice: Различить «покой» (מְנוּחָה/נוח) и «мир» (שָׁלוֹם), пояснив созвучие имени и слова «мир» в примечании.
  alternative: Перевести אִישׁ מְנוּחָה как «человек мира», сгладив различие еврейских слов.
  rationale: Еврейский текст соединяет несколько близких тем, но не употребляет одно и то же слово во всех случаях. Такое решение сохраняет и повтор корня покоя, и отдельную связь имени Соломона с שָׁלוֹם.
- issue: Причинно-пояснительная функция כִּי
  choice: Передать связь бессоюзным пояснительным продолжением.
  alternative: «Ибо имя ему будет Соломон» или «потому что имя ему будет Соломон».
  rationale: Функция כִּי допускает пояснительный оттенок. Бессоюзная связь сохраняет смысл, не навязывая узкой причинности и не архаизируя речь.
translation_notes:
  register: Современный литературный русский с умеренно торжественным тоном. «Вот» и прописное «Я» соответствуют прямой божественной речи; избегаются как разговорные упрощения, так и церковнославянизмы. Все примечания отмечены в основном тексте.
