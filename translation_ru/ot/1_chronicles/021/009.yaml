  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: ru
  text: 'И сказал Яхве[a] Гаду, провидцу Давида:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH) — личное имя Бога; традиционно также передаётся как «Иегова» или заменяется титулом «Господь».
    reason: Пояснение передачи божественного имени и различия между передачей имени и традиционной титульной заменой.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: И сказал
  rationale: Форма с повествовательным וַ־ обозначает следующее событие рассказа; «сказал» естественно вводит прямую речь, а לֵאמֹר передаётся двоеточием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶל־גָּד
  choice: Гаду
  rationale: Предлог אֶל при глаголе речи обозначает адресата; в русском это естественно выражается дательным падежом.
- source_word: חֹזֵה
  choice: прозорливцу
  rationale: Термин обозначает человека, получающего откровение через видение; «прозорливец» сохраняет отличие от более общего слова «пророк» и звучит литературно.
- source_word: דָוִיד
  choice: Давида
  rationale: 'Сопряжённая конструкция передана обычным русским родительным падежом: «прозорливец Давида».'
- source_word: לֵאמֹר
  choice: ':'
  rationale: Формула вводит последующую прямую речь; в современном русском её функцию естественно выполняет двоеточие без тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» передаёт его как имя, не заменяя титулом; традиционные варианты указаны в примечании.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор еврейской формулы «сказал… говоря» устранён: לֵאמֹר передано пунктуационно. Термин «прозорливец» сохраняет специальное значение חֹזֵה.'
