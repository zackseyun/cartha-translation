base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: ru
  text: 'И сказал Орна Давиду: «Возьми себе, и пусть царь, мой господин, поступит так, как считает нужным.[a] Вот, я отдаю скот для всесожжений,[b] молотильные сани — на дрова,[c] а пшеницу — для хлебного приношения.[d] Всё это я отдаю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть господин мой, царь, сделает то, что хорошо в его глазах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «волов для всесожжений». Еврейское слово может обозначать крупный рогатый скот в целом или, в данном контексте, волов.'
    reason: lexical_alternative
  - marker: c
    text: То есть молотильные орудия предлагаются как топливо для жертвенного огня.
    reason: cultural_note
  - marker: d
    text: 'Или: «для приношения». В жертвенном контексте еврейское слово обычно обозначает приношение из муки или зерна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: Возьми себе
  rationale: Императив с לָךְ выражает передачу в распоряжение Давида; «возьми себе» естественно сохраняет этот оттенок.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: и пусть господин мой царь поступит так, как считает нужным
  rationale: Еврейская идиома буквально означает «сделает доброе в его глазах» и здесь предоставляет царю свободу поступить по своему усмотрению.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Это почтительное обращение к Давиду, а не божественный титул; инверсия сохраняет достоинство придворной речи.
- source_word: רְאֵה
  choice: Вот
  rationale: В данном контексте императив служит для привлечения внимания к последующему предложению; русское «вот» передаёт эту дискурсивную функцию естественнее буквального «смотри».
- source_word: הַבָּקָר לָעֹלוֹת
  choice: волов для всесожжений
  rationale: בקר — собирательное обозначение крупного рогатого скота, но в жертвенном и хозяйственном контексте речь естественно идёт о волах; עֹלוֹת обозначает всесожжения.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: молотильные сани — на дрова
  rationale: מוֹרִגִּים — молотильные орудия типа саней; они предлагаются как древесина для огня жертвенника.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: пшеницу — для хлебного приношения
  rationale: В жертвенном контексте מִנְחָה означает приношение из растительного продукта; традиционное и понятное русское обозначение — «хлебное приношение».
- source_word: הַכֹּל נָתָתִּי
  choice: Всё это я отдаю
  rationale: Перфект в прямой речи может обозначать решительно совершаемую передачу; настоящее время естественно передаёт предложение дара в момент разговора, не устраняя аспектуального оттенка окончательности.
