base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: ru
  text: 'И сказал Давид Гаду: «Мне очень тяжело. Прошу, пусть я попаду в руки Яхве, ибо Его милосердие безмерно; но пусть я не попаду в руки человека[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в человеческие руки». В еврейском тексте буквально стоит единственное число: «в руку человека», в противопоставлении руке Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Мне очень тяжело
  rationale: Еврейская идиома выражает крайне тяжёлое, мучительное положение. Такой перевод естественен для современного русского языка и сохраняет как обстоятельственный, так и эмоциональный смысл.
- source_word: אֶפְּלָה נָּא
  choice: Пусть же я попаду
  rationale: Когортатив с נָא передаёт настойчивую просьбу или желательное для говорящего решение. Частица «же» сохраняет оттенок мольбы, а «попаду» естественно передаёт образ перехода под чью-либо власть.
- source_word: בְיַד יְהוָה
  choice: в руку Яхве
  rationale: Сохранён буквальный образ «руки» как власти и суда, важный для параллели с «рукой человека». Имя יהוה передано как «Яхве».
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: потому что милосердие Его очень велико
  rationale: רַחֲמִים обозначает глубокое сострадание и милосердие. В русском языке естественнее отвлечённое существительное в единственном числе; интенсивность רַבִּים ... מְאֹד передана словами «очень велико».
- source_word: וּבְיַד אָדָם אַל אֶפֹּל
  choice: но в руку человека да не попаду
  rationale: Сохранены отрицательное пожелание и намеренный контраст между рукой Яхве и рукой человека. Оборот с «да не» достоин по регистру и не превращает просьбу Давида в прямое повеление Богу.
- source_word: אָדָם
  choice: человека
  rationale: Здесь слово обозначает человека как человеческого деятеля в противопоставлении Яхве. Единственное число сохраняет форму и образ исходного текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно стоит тетраграмматон; передача личного имени как «Яхве» сохраняет различие между именем Бога и титулом.
- issue: Единственное или множественное число в выражении בְיַד אָדָם
  choice: в руку человека
  alternative: в человеческие руки
  rationale: 'Выбрано единственное число, чтобы сохранить точную параллель исходного текста: «в руку Яхве» — «в руку человека». Более идиоматичный русский вариант указан в сноске.'
- issue: Число существительного רַחֲמִים
  choice: милосердие Его
  alternative: Его милости
  rationale: Хотя еврейская форма морфологически множественная, в данном контексте она обозначает присущее Богу глубокое сострадание. Русское собирательно-абстрактное «милосердие» передаёт смысл естественно, не утверждая отдельного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксический параллелизм и образ руки сохранены; архаизмы сведены к уместному пожелательному обороту «да не попаду».
