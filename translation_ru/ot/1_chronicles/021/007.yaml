base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: ru
  text: Но это дело было злом в глазах Бога[a], и Он поразил Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это дело было неугодно Богу». Буквально: «это дело было злом в глазах Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: было злом
  rationale: Сохраняет сильную нравственную оценку еврейского глагола от корня רעע и не смягчает её до простого неудовольствия.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: в глазах Бога
  rationale: Естественно передаёт еврейский образ и указывает на Божью оценку случившегося.
- source_word: הָאֱלֹהִים
  choice: Бога
  rationale: В тексте стоит אֱלֹהִים, а не личное имя יהוה, поэтому перевод «Бог», а не «Господь».
- source_word: עַל הַדָּבָר הַזֶּה
  choice: это дело
  rationale: דָּבָר имеет широкое значение «дело, событие, поступок»; «это дело» ясно отсылает к переписи, не добавляя отсутствующей в стихе конкретизации.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Передаёт נכה как действие Божьего суда, не уточняя здесь способ поражения и не утверждая само по себе, что весь Израиль был умерщвлён.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Прямой объект — Израиль как народ; поясняющее расширение не требуется.
- source_word: וַ
  choice: Но … и
  rationale: Первый союз передаёт контраст между совершённым Давидом действием и Божьей оценкой; второй сохраняет простую повествовательную связь, не усиливая явно причинность сверх формы оригинала.
theological_decisions:
- issue: Божья оценка переписи Давида и последующий суд над Израилем
  choice: Прямо сказать, что дело было злом в глазах Бога и что Он поразил Израиль.
  alternative: Смягчить оценку до «это не понравилось Богу» или представить поражение лишь как неопределённое неблагоприятное последствие.
  rationale: Еврейский текст содержит сильную оценочную формулировку и прямо называет Бога действующим лицом последующего поражения. Перевод сохраняет напряжение между виной Давида и ударом по Израилю, не пытаясь объяснить его за пределами данного стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Оборот «в глазах Бога» намеренно сохраняет образ оригинала; местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
