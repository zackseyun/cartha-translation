base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: ru
  text: Орнан повернулся и увидел ангела, а четверо его сыновей, которые были с ним, прятались; в это время Орнан молотил пшеницу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: повернулся
  rationale: Глагол שׁוב означает «повернуться/возвратиться»; в данном повествовательном контексте речь идёт о движении, после которого Орнан увидел ангела.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: увидел ангела
  rationale: מַלְאָךְ может означать «посланник» или «ангел», но контекст Божьего суда ясно указывает на сверхъестественного посланника.
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: а четверо его сыновей, бывшие с ним
  rationale: Так переданы число сыновей и их нахождение вместе с Орнаном без предположения, что других сыновей у него не было.
- source_word: מִתְחַבְּאִים
  choice: прятались
  rationale: Причастие породы хитпаэль имеет возвратно-среднее значение и описывает продолжающееся или фоновое действие; русское «прятались» естественно передаёт оба оттенка.
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: В это время Орнан молотил пшеницу
  rationale: Форма דָּשׁ здесь обозначает сопутствующее, продолжавшееся действие; отдельное предложение делает соотношение действий ясным и сохраняет повествовательный ход.
- source_word: חִטִּים
  choice: пшеницу
  rationale: Существительное обозначает именно пшеницу, а не зерно вообще.
- source_word: אָרְנָן
  choice: Орнан
  rationale: Имя передано непосредственно по еврейской форме с сохранением конечного согласного.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Союз «а» естественно отмечает смену действующего лица; выражение «В это время» передаёт обстоятельственный характер последней части без добавления самостоятельного временного указателя вроде «теперь».
