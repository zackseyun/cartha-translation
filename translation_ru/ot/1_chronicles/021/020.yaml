- from: Орнан повернулся и увидел ангела, а четверо его сыновей, бывшие с ним, прятались[a]. В это время Орнан молотил пшеницу.
  to: Орнан повернулся и увидел ангела, а четверо его сыновей, которые были с ним, прятались; в это время Орнан молотил пшеницу.
  rationale: Исправлена неестественная характеристика сыновей и уточнена сноска, чтобы она отражала возвратно-средний характер еврейской формы, не превращая действие в завершённое. Сохранены порядок событий, число сыновей, их присутствие с Орнаном и обстоятельственный характер молотьбы.
