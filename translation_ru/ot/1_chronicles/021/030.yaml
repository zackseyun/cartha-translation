  text: וְ/לֹא יָכֹ֥ל דָּוִ֛יד לָ/לֶ֥כֶת לְ/פָנָ֖י/ו לִ/דְרֹ֣שׁ אֱלֹהִ֑ים כִּ֣י נִבְעַ֔ת מִ/פְּנֵ֕י חֶ֖רֶב מַלְאַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: ru
  text: Но Давид не мог пойти туда, чтобы искать Бога[a], потому что был в ужасе из-за меча ангела Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пойти к Нему, чтобы искать Бога», если местоимение относится к Богу, а не к шатру в Гаваоне.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא
  choice: Но ... не
  rationale: Связка продолжает повествование и выражает лёгкое противопоставление предыдущему стиху; современное русское «но» передаёт это естественно.
- source_word: יָכֹל ... לָלֶכֶת
  choice: не мог пойти
  rationale: Конструкция обозначает невозможность совершить движение к упомянутому месту; «не мог пойти» естественно по-русски.
- source_word: לְפָנָיו
  choice: к нему
  rationale: Местоименный суффикс мужского рода, вероятнее всего, отсылает к шатру Господа, упомянутому в ст. 29. Русское «к нему» сохраняет грамматический род и не устраняет неоднозначность референта.
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: чтобы взыскать Бога
  rationale: דרש по отношению к Богу означает искать Его, обращаться к Нему за ответом и помощью. «Взыскать Бога» сохраняет широкий культово-молитвенный смысл и достоинство регистра.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой Давид не мог пойти.
- source_word: נִבְעַת
  choice: был устрашён
  rationale: Нифаль выражает сильный страх, охвативший Давида; «был устрашён» передаёт и интенсивность, и причинную связь с последующей фразой.
- source_word: מִפְּנֵי חֶרֶב
  choice: мечом
  rationale: После глагола страха מִפְּנֵי обозначает источник или причину страха; русский творительный падеж передаёт это естественно.
- source_word: מַלְאַךְ יְהוָה
  choice: ангела Яхве
  rationale: В данном повествовании מַלְאָךְ — небесный посланник, поэтому уместно «ангел»; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Референт местоимения в לְפָנָיו
  choice: В основном тексте «к нему» вероятнее всего относится к шатру Господа в Гаваоне.
  alternative: 'Местоимение может относиться к Богу: «пред Ним».'
  rationale: Ближайший контекст (ст. 29) говорит о шатре Господа и жертвеннике в Гаваоне, а ст. 30 объясняет, почему Давид туда не пошёл. При этом еврейская форма сама по себе допускает отнесение к Богу, поэтому альтернативу следует сохранить в примечании.
- issue: Передача выражения «искать Бога»
  choice: «взыскать Бога»
  alternative: «вопросить Бога» или «обратиться к Богу»
  rationale: Исходное выражение может включать и поклонение, и обращение за Божьим ответом. Выбранная формулировка не сужает его исключительно до получения откровения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Формулировка сохраняет неоднозначность местоимения и сильную эмоциональную окраску глагола נבעת.
