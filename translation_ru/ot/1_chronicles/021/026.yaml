base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: ru
  text: Там Давид построил жертвенник Яхве и принёс всесожжения и мирные жертвы[a]. Он воззвал к Яхве, и Тот ответил ему огнём с небес на жертвенник всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִיד מִזְבֵּחַ
  choice: Там Давид построил жертвенник
  rationale: Сохраняет последовательность и конкретность еврейского повествования; «построил» — естественный современный эквивалент בנה.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, а ל обозначает посвящение жертвенника Яхве.
- source_word: וַיַּעַל עֹלוֹת
  choice: принёс всесожжения
  rationale: В жертвенном контексте עלה означает принесение жертвы; עֹלוֹת — установленное обозначение жертв, сжигавшихся целиком.
- source_word: וּשְׁלָמִים
  choice: мирные жертвы
  rationale: Традиционный и достаточно буквальный русский эквивалент; возможный смысл совместной трапезы и общения отмечен в сноске.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: Он воззвал к Яхве
  rationale: В данном молитвенном контексте «воззвал» естественно передаёт обращение к Богу, сохраняя направленность אֶל.
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ מִן הַשָּׁמַיִם
  choice: и Тот ответил ему огнём с небес
  rationale: Заглавное «Тот» ясно обозначает Яхве как подразумеваемое подлежащее; творительный падеж передаёт инструментальное ב.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: сошедшим на жертвенник всесожжения
  rationale: Причастие делает по-русски ясной пространственную связь огня «с небес» с жертвенником, не добавляя отдельного события; конструкция «жертвенник всесожжения» сохраняет культовый термин.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Характер ответа огнём
  choice: Яхве ответил Давиду огнём с небес, сошедшим на жертвенник
  alternative: Истолковать огонь символически или подробно описать его ниспослание
  rationale: Перевод сохраняет сверхъестественное событие ровно в пределах повествовательного утверждения, не вводя отсутствующего в стихе толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; культовые термины сохранены, а реальная лексическая альтернатива для שְׁלָמִים вынесена в сноску.
