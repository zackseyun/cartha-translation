base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: ru
  text: 'И пришёл Гад к Давиду и сказал ему: «Так говорит Яхве: „Выбери себе[a] —“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «прими себе»; из контекста следует, что Давиду велено выбрать один из вариантов, названных в следующем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Обычный повествовательный глагол движения от בוא; форма «пришёл» естественно передаёт движение Гада к Давиду.
- source_word: גָד
  choice: Гад
  rationale: Традиционная русская передача личного имени.
- source_word: אֶל דָּוִיד
  choice: к Давиду
  rationale: Предлог אֶל обозначает направленность движения к лицу; русский дательный с «к» передаёт это естественно.
- source_word: וַיֹּאמֶר לוֹ
  choice: и сказал ему
  rationale: Прямое соответствие אמר с местоименным косвенным дополнением без дополнительного истолкования.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Устойчивая и достойная русская передача пророческой формулы посланника; настоящее время уместно при введении непосредственно передаваемой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: קַבֶּל
  choice: выбери
  rationale: Основной смысл глагола — «прими», однако в контексте повеление вводит предложенные Давиду варианты наказания; «выбери» ясно передаёт контекстуальную функцию, а буквальная возможность сохранена в сноске.
- source_word: לָךְ
  choice: себе
  rationale: Дательный местоименный элемент указывает на личное принятие или выбор Давида; по-русски естественно передаётся возвратным местоимением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Интерпретационная сила קַבֶּל
  choice: выбери
  alternative: прими себе
  rationale: Следующий стих перечисляет три варианта суда, поэтому «выбери» передаёт смысл повеления в контексте. Поскольку лексически глагол означает прежде всего принятие или получение, эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной пророческой формулы. Начальное «И» отражает последовательность еврейского повествования; тире в конце сохраняет незавершённость речи, продолжающейся в следующем стихе.
