  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: ru
  text: И Давид взошёл по слову Гада, которое тот произнёс от имени Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה означает движение вверх; «поднялся» сохраняет направительный оттенок и естественно звучит в данном повествовании.
- source_word: בִּדְבַר גָּד
  choice: по слову Гада
  rationale: Предлог ב здесь указывает на основание или соответствие сказанному; выражение «по слову» передаёт, что Давид поступил согласно повелению, переданному Гадом.
- source_word: אֲשֶׁר דִּבֶּר
  choice: которое тот произнёс
  rationale: Относительное предложение отнесено к «слову Гада», а местоимение «тот» естественно уточняет, что говорящим был Гад.
- source_word: בְּשֵׁם יְהוָה
  choice: от имени Яхве
  rationale: Формулировка передаёт пророческую речь, произнесённую с полномочием Яхве, и сохраняет личное Божье имя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан принятой русской транслитерацией личного имени Бога, а не заменён титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יהוה; «Яхве» сохраняет различие между именем и титулом.
- issue: Смысл выражения בְּשֵׁם יְהוָה
  choice: от имени Яхве
  alternative: именем Яхве
  rationale: «От имени» ясно выражает, что Гад говорил как уполномоченный пророк, не добавляя к тексту конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и повествовательное. Сохранены направительный смысл глагола «поднялся» и формула пророческого полномочия «от имени Яхве».
