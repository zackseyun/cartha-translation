  text: וְ/לֵוִי֙ וּ/בִנְיָמִ֔ן לֹ֥א פָקַ֖ד בְּ/תוֹכָ֑/ם כִּֽי נִתְעַ֥ב דְּבַר הַ/מֶּ֖לֶךְ אֶת יוֹאָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/006.yaml
  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: ru
  text: Но левитов и вениамитян он не сосчитал вместе с остальными, потому что приказ царя был отвратителен Иоаву.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово царя вызывало у Иоава отвращение».'
    reason: Существительное דָּבָר может быть передано более буквально как «слово», а נִתְעַב допускает передачу через сильную реакцию отвращения.
lexical_decisions:
- source_word: וְ/לֵוִי וּ/בִנְיָמִן
  choice: Но левитов и вениамитян
  rationale: Названия колен естественно переданы по-русски во множественном числе; союз «но» выражает контраст с итогами переписи в предыдущем стихе.
- source_word: לֹא פָקַד
  choice: не пересчитал
  rationale: В контексте переписи פקד означает считать или вносить в число; «пересчитал» ясно связывает действие с проводимой переписью.
- source_word: בְּ/תוֹכָם
  choice: вместе с остальными
  rationale: Буквально «среди них»; контекстуальная формулировка показывает, что эти два колена не были включены в общий подсчёт.
- source_word: כִּי
  choice: потому что
  rationale: Передаёт причинное значение союза.
- source_word: נִתְעַב
  choice: был отвратителен
  rationale: 'Нифаль выражает сильную отрицательную оценку: приказ вызывал у Иоава отвращение.'
- source_word: דְּבַר הַ/מֶּלֶךְ
  choice: приказ царя
  rationale: דבר может означать «слово», «дело» или «приказ»; здесь речь идёт о царском распоряжении провести перепись.
- source_word: אֶת יוֹאָב
  choice: Иоаву
  rationale: При глаголе оценки אֶת обозначает лицо, воспринимающее предмет как отвратительный.
theological_decisions:
- issue: Степень нравственной оценки царского распоряжения
  choice: Сохранена сильная характеристика «был отвратителен Иоаву» без объяснения причины.
  alternative: «Иоав считал приказ царя неправильным»
  rationale: Исходный текст передаёт сильное отвращение, но не раскрывает здесь богословскую или правовую причину; перевод не должен её добавлять.
translation_notes:
  register: Современный литературный русский язык; синтаксис простой и достоинственный. Формы «левитов» и «вениамитян» обозначают соответствующие колена и звучат естественнее буквальных названий в единственном числе.
