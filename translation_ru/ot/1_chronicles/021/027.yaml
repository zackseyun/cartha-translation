  text: וַ/יֹּ֤אמֶר יְהוָה֙ לַ/מַּלְאָ֔ךְ וַ/יָּ֥שֶׁב חַרְבּ֖/וֹ אֶל נְדָנָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: ru
  text: И сказал Яхве ангелу, и тот вложил свой меч обратно в ножны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом.
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Основное значение אמר — «сказать»; русский оборот «сказал ангелу» естественен и не добавляет отсутствующего в тексте уточнения о содержании повеления.
- source_word: לַמַּלְאָךְ
  choice: ангелу
  rationale: Хотя מַלְאָךְ может означать «вестник», в данном повествовании речь идёт о небесном существе с обнажённым мечом.
- source_word: וַיָּשֶׁב
  choice: вложил обратно
  rationale: Каузативная форма שוב означает возвращение предмета на прежнее место; применительно к мечу по-русски естественно «вложил обратно».
- source_word: חַרְבּוֹ
  choice: свой меч
  rationale: Возвратное притяжательное местоимение естественно связывает меч с субъектом действия — ангелом.
- source_word: אֶל נְדָנָהּ
  choice: в ножны
  rationale: נְדָן обозначает ножны; форма множественного числа «ножны» является обычным современным русским наименованием футляра для клинка, а направление внутрь естественно передаётся предлогом «в».
theological_decisions:
- issue: Субъект וַיָּשֶׁב («и возвратил/вложил обратно»)
  choice: 'Ангел: «и тот вложил свой меч»'
  alternative: Яхве возвратил меч в ножны
  rationale: Грамматически явный субъект не повторён, но ближайший участник — ангел, а контекст изображает его исполняющим слово Яхве. Указательное «тот» ясно передаёт наиболее вероятную связь, не превращая слово Яхве в явно сформулированное повеление.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и повествовательная. Сохранено личное имя «Яхве». «Вложил свой меч обратно в ножны» звучит естественнее буквального «возвратил свой меч к его ножнам».
