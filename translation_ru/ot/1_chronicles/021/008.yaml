source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: ru
  text: 'Тогда Давид сказал Богу: «Я тяжко согрешил, сделав это. Но теперь прошу, сними с Твоего слуги вину[a], потому что я поступил крайне неразумно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконие». Еврейское слово может означать беззаконие, вину или ответственность, возникающую вследствие вины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: חָטָאתִי מְאֹד
  choice: Я тяжко согрешил
  rationale: «Тяжко» передаёт усилитель מְאֹד и серьёзность признания, оставаясь понятным в современном литературном русском.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: сделав это
  rationale: Оборот указывает на конкретный поступок как содержание и основание признанного греха; краткая русская формулировка не требует буквального «это дело».
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Союз отмечает поворот от исповедания к просьбе; «но теперь» естественно выражает этот риторический переход.
- source_word: הַעֲבֶר נָא
  choice: прошу, сними
  rationale: Побудительная форма עבר в данной идиоме означает удаление, а נָא придаёт просьбе почтительный характер.
- source_word: עֲוֹן
  choice: вину
  rationale: Слово может обозначать беззаконие, вину или связанную с ней ответственность; в просьбе об удалении наиболее естественно по-русски звучит «вина», при этом неоднозначность отмечена в сноске.
- source_word: עַבְדְּךָ
  choice: Твоего слуги
  rationale: Это почтительное самообозначение Давида перед Богом; «слуга» передаёт отношение служения, не выдвигая на первый план подневольный статус.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: я поступил крайне неразумно
  rationale: Глагол описывает не просто качество человека, а совершённый им неразумный поступок; «крайне» передаёт повторный усилитель מְאֹד.
theological_decisions:
- issue: Значение עָוֹן в просьбе Давида
  choice: вина
  alternative: беззаконие; наказание или ответственность за беззаконие
  rationale: Контекст соединяет исповедание греха с просьбой к Богу удалить его нравственную обременённость. «Вина» не сужает значение исключительно до самого проступка или исключительно до наказания; реальная широта еврейского слова сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исповедальной речи. Синтаксис упрощён там, где буквальное воспроизведение было бы тяжеловесным, но последовательность «исповедание — просьба — основание просьбы» и оба усилителя מְאֹד сохранены.
