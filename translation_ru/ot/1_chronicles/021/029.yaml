  source_fidelity: Текст точно передаёт оба подлежащих еврейского именного предложения, относительное придаточное о Моисее, указание «в то время» и местонахождение в Гаваоне. «Скиния», «жертвенник всесожжения» и «на высоте» адекватно соответствуют מִשְׁכָּן, מִזְבַּח הָעֹלָה и בָּמָה. Начальный союз не обязан воспроизводиться отдельным русским словом.
