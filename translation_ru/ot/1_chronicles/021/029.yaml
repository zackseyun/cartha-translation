  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: ru
  text: Скиния Яхве, которую Моисей сделал в пустыне, и жертвенник всесожжения находились в то время на высоте в Гаваоне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: скиния
  rationale: Устоявшееся и точное русское обозначение переносного святилища Израиля в данном культовом контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֲשֶׁר עָשָׂה
  choice: которую Моисей сделал
  rationale: Естественно передаёт относительное придаточное; русское прошедшее время достаточно ясно указывает на более раннее действие.
- source_word: בַמִּדְבָּר
  choice: в пустыне
  rationale: Обычное русское соответствие в контексте странствований Израиля.
- source_word: מִזְבַּח הָעוֹלָה
  choice: жертвенник всесожжения
  rationale: Устоявшийся русский культовый термин для жертвенника, на котором приносили жертвы, сжигавшиеся целиком.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Точно и естественно обозначает временную обстановку повествования.
- source_word: בַּבָּמָה
  choice: на высоте
  rationale: Сохраняет культовое значение בָּמָה и пространственный образ возвышенного священного места.
- source_word: בְּגִבְעוֹן
  choice: в Гаваоне
  rationale: Использует закрепившуюся в русской библейской традиции форму топонима и естественное для города управление.
- source_word: וּ
  choice: связь передана без начального союза
  rationale: Начальный ו соединяет стих с контекстом и вводит поясняющее обстоятельство; в современном русском отдельный начальный союз здесь необязателен. Второй ו естественно передан союзом «и» между однородными подлежащими.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемой библейской культовой терминологии. Синтаксис ясен и достоин по тону; связка во множественном числе выражена глаголом «находились», подразумеваемым в еврейском именном предложении.
