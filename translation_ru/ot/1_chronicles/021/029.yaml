  terminology: «Яхве» последовательно передаёт тетраграмматон; «скиния» и «жертвенник всесожжения» — устоявшиеся точные культовые термины. Топоним «Гаваон» соответствует русской библейской традиции. «Высота» сохраняет техническую и пространственную неоднозначность בָּמָה, не навязывая более узкое толкование.
