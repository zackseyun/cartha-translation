source:
  edition: WLC
  text: וַ/יָּבֹ֥א דָוִ֖יד עַד אָרְנָ֑ן וַ/יַּבֵּ֤ט אָרְנָן֙ וַ/יַּ֣רְא אֶת דָּוִ֔יד וַ/יֵּצֵא֙ מִן הַ/גֹּ֔רֶן וַ/יִּשְׁתַּ֧חוּ לְ/דָוִ֛יד אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: ru
  text: Когда Давид подошёл к Орнану, Орнан взглянул, увидел Давида, вышел с гумна и поклонился Давиду до земли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрся перед Давидом лицом к земле». Еврейское выражение описывает глубокий поклон, при котором лицо обращено к земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: Когда Давид подошёл к Орнану
  rationale: Глагол בוא с עַד описывает приближение Давида к Орнану. «Подошёл к» естественно передаёт движение к человеку, не добавляя отсутствующего в тексте оттенка.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: Орнан взглянул, увидел Давида
  rationale: 'Сохранена последовательность двух еврейских глаголов: сначала Орнан направляет взгляд, затем видит Давида. «Взглянул» не вносит контекстуально возможного, но не выраженного прямо значения «поднял глаза».'
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: вышел с гумна
  rationale: «Гумно» — точное и принятое русское обозначение площадки для молотьбы; предлог «с» естественно передаёт исходное מן при движении с открытой площадки.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד אַפַּיִם אָרְצָה
  choice: поклонился Давиду до земли
  rationale: Формула естественно передаёт глубокий поклон или простёртое положение лицом к земле. Она сохраняет конкретное телесное действие и не истолковывает его как поклонение божеству.
theological_decisions:
- issue: Подразумевает ли действие Орнана поклонение Давиду как божеству
  choice: поклонился Давиду до земли
  alternative: простёрся перед Давидом лицом к земле; поклонился Давиду
  rationale: השתחוה может обозначать как почтительный поклон человеку, так и религиозное поклонение — в зависимости от контекста. Здесь адресат — царь Давид, поэтому перевод описывает глубокий поклон, не вводя идеи божественного поклонения.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Гумно» сохранено как точный традиционный сельскохозяйственный термин; смысл глубокой прострации пояснён в сноске.
