  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: ru
  text: 'Тогда Давид сказал Иоаву и начальникам народа: «Пойдите, пересчитайте Израиль от Вирсавии до Дана[a] и принесите мне результат подсчёта, чтобы я знал их число».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «от Вирсавии до Дана» означает всю территорию Израиля — от одного её края до другого.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда Давид сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: שָׂרֵי הָעָם
  choice: начальникам народа
  rationale: שָׂרִים может обозначать начальников, правителей или должностных лиц. «Начальники» сохраняет широкий административно-военный смысл и подходит к контексту переписи рядом с Иоавом.
- source_word: לְכוּ
  choice: Пойдите
  rationale: Прямой и естественный русский эквивалент повелительной формы глагола הלך.
- source_word: סִפְרוּ אֶת יִשְׂרָאֵל
  choice: пересчитайте Израиль
  rationale: Глагол ספר здесь означает пересчитать или исчислить. «Пересчитайте» ясно передаёт проведение подсчёта, а «Израиль» сохраняет собирательное обозначение народа в оригинале.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: от Вирсавии до Дана
  rationale: Сохранён порядок географических названий в еврейском тексте и традиционные русские формы этих топонимов; выражение обозначает всю страну с юга до севера.
- source_word: וְהָבִיאוּ אֵלַי
  choice: и принесите мне результат подсчёта
  rationale: Буквально сказано «и принесите ко мне», причём подразумеваемый объект не назван. В русском требуется уточнение; «результат подсчёта» передаёт контекстуальный смысл, не отождествляя его преждевременно только с итоговой цифрой.
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: чтобы я знал их число
  rationale: Когортатив выражает желаемую цель; конструкция «чтобы я знал» передаёт эту целевую оттеночность, а «их число» близко соответствует אֶת מִסְפָּרָם.
