  to: '«Пойди и скажи Давиду: „Так говорит Яхве: Я ставлю перед тобой три возможности[a]. Выбери себе одну из них, и Я сделаю это с тобой“».'
  rationale: Исправлен только неестественный и грамматически неполный русский эллипсис. «Ставлю перед тобой три возможности» передаёт контекстуальное значение נֹטֶה — предъявлять варианты для выбора — без добавления слов «кары», «бедствия» или «суды». Из-за добавленного существительного согласование исправлено на «одну из них».
