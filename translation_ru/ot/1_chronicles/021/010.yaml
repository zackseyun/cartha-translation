base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: ru
  text: '«Пойди и скажи Давиду: „Так говорит Яхве: Я ставлю перед тобой три возможности[a]. Выбери себе одну из них, и Я сделаю это с тобой“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «три Я простираю над тобой». Еврейский текст не называет, что именно составляют эти три; «возможности» добавлено по-русски, чтобы передать смысл предложенных для выбора вариантов, не уточняя их содержание.'
    reason: Поясняет необычный еврейский оборот, невыраженный объект и минимальное русское восполнение.
lexical_decisions:
- source_word: לֵךְ וְדִבַּרְתָּ אֶל דָּוִיד
  choice: Пойди и скажи Давиду
  rationale: Императив לֵךְ передан прямым повелением «пойди», а דבר אל в контексте передачи вести естественно выражено как «скажи».
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена пророческая формула посланника и личное имя יהוה.
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: Я простираю над тобой три
  rationale: Глагол נטה передан близко к его образному значению «простирать»; подразумеваемый объект не добавлен, чтобы сохранить эллиптичность и напряжённость еврейского текста.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: Выбери себе одно из них
  rationale: Сохранены повелительная форма, дательный личной заинтересованности לְךָ и партитивное значение מֵהֵנָּה.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: и Я сделаю это с тобой
  rationale: В карательном контексте לָךְ означает направленность действия на Давида; «с тобой» по-русски естественно передаёт угрозу, не уточняя заранее вид бедствия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом.
- issue: Не названный предмет при числительном «три»
  choice: 'Сохранить эллипсис: «три»'
  alternative: три вещи; три кары; три бедствия; три выбора
  rationale: В еврейском тексте существительное отсутствует. Контекст следующего стиха раскрывает три возможные кары, но здесь их конкретизация сняла бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным звучанием. Синтаксическая сжатость исходного текста сохранена; местоимение «Я» в прямой речи Бога написано с прописной буквы по русской библейской традиции.
