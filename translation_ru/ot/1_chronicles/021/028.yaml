  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: ru
  text: В то время, когда Давид увидел, что Яхве ответил ему[a] на гумне Орнана, иевусея, он совершил там жертвоприношение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «откликнулся ему». Глагол может обозначать ответ, в том числе ответ на молитву или жертвоприношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Устойчивое временное выражение, сохраняющее связь с предшествующим повествованием и не уточняющее, шла ли речь об одном мгновении или более широком периоде.
- source_word: בִּרְאוֹת דָּוִיד
  choice: увидев ... Давид
  rationale: Инфинитивная конструкция с בְּ передаёт временное обстоятельство. Русский деепричастный оборот естественно выражает значение «когда Давид увидел» и сохраняет Давида субъектом обоих действий.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание увиденного Давидом, не превращая связь в явно причинную.
- source_word: עָנָהוּ
  choice: ответил ему
  rationale: Глагол ענה обозначает ответ или отклик; в контексте это Божий ответ Давиду, явленный после жертвоприношения. Буквальное «ответил ему» не уточняет способ ответа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּגֹרֶן אָרְנָן הַיְבוּסִי
  choice: на гумне Орнана-иевусея
  rationale: «Гумно» точно и кратко передаёт גֹּרֶן в древнем земледельческом контексте; определение «иевусея» естественно присоединено к имени через дефис.
- source_word: וַיִּזְבַּח שָׁם
  choice: принёс там жертву
  rationale: Русское выражение естественно передаёт действие глагола זבח, не добавляя числа жертв и сохраняя указание на место.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Характер Божьего ответа Давиду
  choice: ответил ему
  alternative: услышал его
  rationale: Формулировка «ответил ему» сохраняет прямое значение ענה и не сводит ответ лишь к выслушиванию молитвы; контекст раскрывает, как этот ответ был явлен.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Слово «гумно» сохранено как точный и понятный традиционный термин; синтаксис упрощён без устранения временной связи между увиденным ответом и последующим жертвоприношением.
