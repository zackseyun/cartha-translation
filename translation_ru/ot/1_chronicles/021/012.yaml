source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: ru
  text: или три года голода, или три месяца гибнуть перед своими противниками, когда тебя настигает меч твоих врагов[a], или три дня меча Яхве, то есть моровой язвы в стране, при которой ангел Яхве несёт гибель по всей территории Израиля[b]. Теперь рассуди, что мне ответить Тому, кто послал меня».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «быть сметённым» или «быть сокрушённым перед своими противниками»; еврейское причастие может обозначать гибель или сокрушительное поражение в бою.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мора»; еврейское слово обозначает эпидемическую болезнь, посланную как суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: голод
  rationale: В контексте общенародного суда слово обозначает продолжительную нехватку пищи; «голод» — естественный и устойчивый русский эквивалент.
- source_word: נִסְפֶּה
  choice: терпеть поражение
  rationale: Нифальское причастие передаёт гибель или сокрушительное поражение. В военном контексте русское выражение естественно и не сводит смысл исключительно к физической смерти.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: от своих противников
  rationale: Предлог с оборотом указывает на поражение и отступление перед враждебными силами; «противники» позволяет избежать немедленного повтора слова «враги».
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: меч твоих врагов
  rationale: Сохранён образ меча и конструкция принадлежности.
- source_word: לְמַשֶּׂגֶת
  choice: будет настигать тебя
  rationale: Инфинитив указывает на достижение преследуемого; длительная форма согласуется с трёхмесячным периодом и образом преследования.
- source_word: חֶרֶב יְהוָה
  choice: меч Яхве
  rationale: Сохранены конструкция оригинала и намеренный контраст с мечом врагов.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: דֶבֶר
  choice: моровая язва
  rationale: Сочетание обозначает губительную эпидемию и сохраняет торжественно-библейский регистр; альтернативное «мор» отмечено в сноске.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: В повествовательном контексте это сверхъестественный посланник; перевод не уточняет его природу или тождество.
- source_word: מַשְׁחִית
  choice: будет нести гибель
  rationale: Причастие выражает продолжающееся разрушительное действие ангела; такая формулировка естественнее по-русски, чем буквальное «уничтожающий».
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: по всей земле Израиля
  rationale: גְּבוּל здесь обозначает всю территорию, а не только пограничную линию.
- source_word: רְאֵה
  choice: реши
  rationale: Императив в данном речевом контексте побуждает Давида обдумать выбор и определить ответ.
- source_word: שֹׁלְחִי
  choice: Пославшему меня
  rationale: Субстантивированное причастие передано естественным русским оборотом; прописная буква ясно соотносит его с Яхве из контекста, не добавляя имени в текст.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо употребляет тетраграмматон; личное имя сохранено в переводе.
- issue: Природа מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Сохранено обычное контекстуальное значение без уточнения, является ли этот ангел сотворённым существом или особым явлением Бога.
- issue: Связь между «мечом Яхве» и דבר
  choice: «моровой язвы» поставлено как пояснение к «мечу Яхве»
  alternative: понимать меч и язву как два отдельных бедствия
  rationale: Союз ו допускает пояснительное значение, и непосредственный контекст представляет единый трёхдневный вариант суда; тире сохраняет близкое приложение, не вводя жёсткого логического толкования.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксический параллелизм трёх вариантов сохранён. «Моровая язва» умеренно традиционно, но понятно из контекста; сноска даёт краткую альтернативу. Все маркеры сносок присутствуют в основном тексте.
