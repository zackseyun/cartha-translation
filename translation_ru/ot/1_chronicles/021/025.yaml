  yaml_path: translation/ot/1_chronicles/021/025.yaml
  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: ru
  text: И дал Давид Орнану за это место золота весом в шестьсот шекелей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном рассказе во 2 Царств 24:24 названы пятьдесят шекелей серебра. Здесь, в Паралипоменон, говорится о шестистах шекелях золота; возможно, имеется в виду иной объём приобретения или отражена другая текстовая традиция.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: Глагол נתן обычно означает «дать, отдать». В контексте покупки это передаёт уплату, но не заменяет исходный глагол более узким «заплатил».
- source_word: לְאָרְנָן
  choice: Орнану
  rationale: Сохранена форма имени Орнан, употреблённая в тексте Паралипоменон; форма Орна из параллельного повествования не подставляется.
- source_word: בַּמָּקוֹם
  choice: за это место
  rationale: Предлог ב в контексте сделки имеет смысл цены или обмена — «за»; указательное «это» естественно отсылает к уже названному месту и не меняет референт.
- source_word: שִׁקְלֵי זָהָב
  choice: шестьсот шекелей золота
  rationale: Сохранена древняя единица веса и указание на материал без пересчёта в современные меры.
- source_word: מִשְׁקָל
  choice: по весу
  rationale: Выражение прямо отражает то, что шекели здесь являются мерой веса.
- source_word: שֵׁשׁ מֵאוֹת
  choice: шестьсот
  rationale: Число передано буквально, без согласования с отличающимся параллельным рассказом.
theological_decisions:
- issue: Числовое расхождение с параллельным рассказом во 2 Царств 24:24
  choice: 'Сохранить чтение Паралипоменон: «шестьсот шекелей золота».'
  alternative: Гармонизировать со 2 Царств 24:24, где названы пятьдесят шекелей серебра за гумно и волов.
  rationale: Еврейский текст данного стиха однозначно называет шестьсот шекелей золота. Перевод сохраняет межтекстовое напряжение и не навязывает объяснение в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов сделан естественным для русского; древняя мера «шекель» сохранена. Маркер сноски поставлен после всего предложения.
