  text: וַ/יִּתֵּ֧ן יְהוָ֛ה דֶּ֖בֶר בְּ/יִשְׂרָאֵ֑ל וַ/יִּפֹּל֙ מִ/יִּשְׂרָאֵ֔ל שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: ru
  text: И навёл Яхве мор на Израиль, и среди израильтян пало семьдесят тысяч мужчин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וַיִּתֵּן
  choice: навёл
  rationale: Буквально глагол означает «дал», но в сочетании с обозначением мора по-русски естественно «навёл»; при этом сохраняется прямая причинная роль Яхве.
- source_word: דֶּבֶר
  choice: мор
  rationale: Слово обозначает смертоносную массовую болезнь, нередко выступающую орудием Божьего суда. «Мор» краток, точен и уместен в литературном библейском повествовании.
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: В сочетании «навёл мор» предлог естественно передаёт направленность бедствия на народ Израиля.
- source_word: וַיִּפֹּל
  choice: пало
  rationale: Сохранён древнееврейский образ «пасть» как обозначение смерти; по-русски он понятен и не требует разъясняющей замены на «умерло».
- source_word: מִיִּשְׂרָאֵל
  choice: из Израиля
  rationale: 'Буквально сохраняется значение исходной группы: погибшие принадлежали к Израилю.'
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: семьдесят тысяч человек
  rationale: После числительного אִישׁ имеет собирательно-счётное употребление. Русское «человек» точно и естественно, тогда как «мужчин» здесь могло бы неоправданно сузить значение до взрослых лиц мужского пола.
theological_decisions:
- issue: Прямая роль Бога в суде
  choice: «навёл Яхве мор»
  alternative: «Яхве допустил мор»
  rationale: Древнееврейский текст прямо приписывает действие Яхве и не содержит глагола со значением дозволения. Перевод не смягчает эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной окраской. «Мор» и «пало» сохраняют краткость и образность оригинала, оставаясь понятными современному читателю.
