base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: ru
  text: 'Но Иоав сказал: «Пусть Яхве прибавит к Своему народу в сто раз столько же, сколько их теперь[a]! Разве не все они — слуги[b] моего господина, царя? Зачем господин мой добивается этого? Зачем это должно обернуться виной для Израиля[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть Яхве прибавит к Своему народу таких, как они, в сто раз».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабы».'
    reason: lexical_alternative
  - marker: c
    text: То есть виной или ответственностью, которая ляжет на Израиль из-за этого поступка.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹסֵף
  choice: пусть … умножит
  rationale: Юссив выражает пожелание или молитву Иоава. В сочетании с образом стократного увеличения русское «пусть … умножит» естественно передаёт смысл буквального «пусть прибавит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: Свой народ во сто раз
  rationale: Еврейский оборот обозначает увеличение относительно нынешней численности; краткая русская формулировка ясно передаёт это сравнение.
- source_word: הֲלֹא
  choice: разве не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: господин мой царь
  rationale: Сохранено почтительное придворное обращение к царю и порядок слов, естественный для возвышенной русской речи.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: не все они … слуги господина моего
  rationale: В данном царском контексте עֲבָדִים прежде всего выражает подчинение и службу царю; «слуги» не исключает более сильного значения слова, отмеченного в сноске.
- source_word: יְבַקֵּשׁ זֹאת
  choice: добивается этого
  rationale: Форма от בקש описывает стремление осуществить задуманную перепись. «Добивается» естественнее по-русски, чем буквальное «ищет», и сохраняет направленность действия.
- source_word: לְאַשְׁמָה
  choice: виной
  rationale: В контексте слово обозначает вину или возникшую из-за поступка ответственность, а не жертву за вину.
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: это должно стать виной для Израиля
  rationale: Формулировка близко сохраняет конструкцию результата в еврейском тексте и не уточняет сверх текста, идёт ли речь преимущественно о виновности или о следующей за ней ответственности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение עֲבָדִים применительно к подданным царя
  choice: слуги
  alternative: рабы
  rationale: Речь сосредоточена на принадлежности народа царской власти и его подчинении. «Слуги» лучше соответствует придворно-политическому контексту, а возможное более сильное значение сохранено в сноске.
- issue: Характер אַשְׁמָה для Израиля
  choice: вина для Израиля
  alternative: ответственность, навлечённая на Израиль; причина виновности Израиля
  rationale: Еврейское слово допускает оттенки виновности и ответственности за проступок. Основной текст сохраняет ёмкое «вина», а сноска поясняет диапазон без догматического сужения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным придворным обращением. Синтаксис риторических вопросов сохранён; архаизмы избегаются. Заглавная буква в «Свой» указывает на Яхве как на ближайший референт местоимения.
