  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: ru
  text: 'И сказал Давид Богу: «Не я ли велел пересчитать народ? Я — тот, кто согрешил и совершил великое зло. А эти овцы — что они сделали?[a] Яхве, Боже мой! Пусть же Твоя рука будет против меня и дома моего отца,[b] но не против Твоего народа, чтобы поразить его мором».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эти овцы» — образное обозначение народа.
    reason: cultural_note
  - marker: b
    text: Еврейское имя Бога יהוה (ЙХВХ) передано как «Яхве». «Рука» здесь — образ действующей силы Бога, в данном контексте силы суда.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: Не я ли велел пересчитать народ?
  rationale: Риторический вопрос ожидает утвердительного ответа. Глагол «сказал» с инфинитивом в данном контексте передаёт распоряжение Давида о переписи; «велел пересчитать» естественно выражает это по-русски.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: Я — тот, кто согрешил
  rationale: Конструкция подчёркивает личную ответственность Давида; тире помогает сохранить эмфазу в современном русском.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: и поступил крайне дурно
  rationale: Инфинитив абсолютный при личной форме усиливает значение глагола. Наречие «крайне» передаёт интенсивность, не превращая выражение в отвлечённое существительное.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: А эти овцы
  rationale: Сохранена исходная пастырская метафора, в которой народ представлен овцами.
- source_word: יְהוָה אֱלֹהַי
  choice: Господи, Боже мой
  rationale: В русском прямом обращении традиционная передача тетраграмматона как «Господь» принимает звательную форму «Господи» и звучит естественно и достойно.
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  choice: Пусть же Твоя рука будет против меня и дома моего отца
  rationale: Сохранён образ руки как проявления действующей силы и суда; «против» ясно передаёт карательный смысл контекста. «Дом отца» оставлен как библейское обозначение семьи и рода.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: но не поражай мором Твой народ
  rationale: Фрагментарная еврейская конструкция естественно развёрнута по-русски как просьба не обращать губительное действие на народ. «Мор» точно и кратко обозначает поражающую народ эпидемию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господи
  alternative: Яхве
  rationale: В современном литературном русском «Господь» является широко понятной и богослужебно укоренённой передачей тетраграмматона; в обращении употреблено «Господи». Вариант «Яхве» точнее транслитерирует личное имя, но в русском тексте воспринимается более специальным. Различие отмечено в сноске.
- issue: Ответственность Давида и невиновность народа
  choice: Сохранены подчеркнутое признание Давида и его вопрос об овцах
  alternative: Явно назвать народ невиновным
  rationale: Исходный текст выражает невиновность народа риторическим вопросом, а не прямым утверждением; эта богословская напряжённость сохранена без поясняющей вставки.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис прямой и понятный; сохранены риторический вопрос, метафора овец и образ Божьей руки. Местоимения при обращении к Богу написаны с прописной буквы как редакционный выбор регистра.
