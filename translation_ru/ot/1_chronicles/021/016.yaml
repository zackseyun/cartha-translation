  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: ru
  text: Давид поднял глаза и увидел ангела Яхве, стоявшего между землёй и небом[a]. В руке у него был обнажённый меч, простёртый над Иерусалимом. Тогда Давид и старейшины, одетые во вретище, пали лицом на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между землёй и небесами».'
    reason: Еврейский текст имеет «между землёй и небесами»; в русском основном тексте выбран естественный вариант «между землёй и небом».
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו
  choice: поднял глаза
  rationale: Естественно передаёт еврейский образ и сохраняет торжественную конкретность повествования.
- source_word: מַלְאַךְ יְהוָה
  choice: ангела Яхве
  rationale: Конструкция передана прямо, а личное имя יהוה транслитерировано как «Яхве».
- source_word: עֹמֵד
  choice: стоявшего
  rationale: Причастие обозначает видимое положение ангела; такой перевод прост и точен.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: между землёй и небом
  rationale: Это естественное русское выражение космического противопоставления; формальное множественное число еврейского слова отмечено в сноске.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: В руке у него был обнажённый меч
  rationale: Передаёт результативное значение «вынутый из ножен» и явно сохраняет указание, что меч находился в руке ангела.
- source_word: נְטוּיָה עַל יְרוּשָׁלִָם
  choice: простёртый над Иерусалимом
  rationale: Сохраняет образ угрожающе протянутого над городом меча и библейскую лексику суда.
- source_word: וַיִּפֹּל ... עַל פְּנֵיהֶם
  choice: пали лицом на землю
  rationale: Естественно передаёт физическое действие и выраженные им смирение и благоговение.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: одетые во вретище
  rationale: Сохраняет культурный образ покаянной одежды из грубой ткани, оставаясь понятным в библейском контексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога, поэтому транслитерация сохраняет отличие имени от титула.
- issue: Характер падения Давида и старейшин
  choice: пали лицом на землю
  alternative: простёрлись ниц
  rationale: Перевод не уточняет сверх текста, было ли действие исключительно поклонением, страхом или покаянием, и тем самым сохраняет смысловую напряжённость сцены.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. Слова «простёртый» и «вретище» сохранены ради образности и культурного значения; синтаксис упрощён для ясности без устранения деталей оригинала.
