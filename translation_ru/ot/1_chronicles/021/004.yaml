base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: ru
  text: Но слово царя возобладало над Иоавом[a]. Иоав вышел, прошёл по всему Израилю[b] и пришёл в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повеление царя взяло верх над Иоавом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обошёл весь Израиль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: Но слово царя
  rationale: Сохраняет конкретный образ еврейского דָּבָר («слово»), которое в данном контексте означает властное распоряжение; «но» передаёт контраст с возражением Иоава в предыдущем стихе.
- source_word: חָזַק עַל
  choice: пересилило Иоава
  rationale: 'Естественно передаёт идиому «оказалось сильнее над/против»: царское распоряжение взяло верх над сопротивлением Иоава, без излишнего истолкования.'
- source_word: וַיֵּצֵא יוֹאָב
  choice: И вышел Иоав
  rationale: Прямо передаёт обычное значение יָצָא и сохраняет последовательное повествование.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: и обошёл весь Израиль
  rationale: Форма hitpael указывает на передвижение по территории; «обошёл» кратко и естественно выражает путешествие по всему Израилю, не добавляя прямо не названных подробностей переписи.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Естественное русское соответствие, передающее полный общенациональный охват.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: а затем пришёл в Иерусалим
  rationale: «Пришёл» сохраняет обычное значение בּוֹא и не вводит подразумеваемое, но прямо не выраженное значение «вернулся»; «а затем» ясно обозначает завершение маршрута.
