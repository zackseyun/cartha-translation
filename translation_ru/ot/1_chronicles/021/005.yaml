base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: ru
  text: Иоав передал Давиду число народа по переписи. Весь Израиль насчитывал 1 100 000[a] мужчин, обнажающих меч, а Иудея — 470 000 мужчин, обнажающих меч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тысяча тысяч и сто тысяч».'
    reason: Сноска сохраняет необычную форму записи числа в древнееврейском тексте.
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: итог переписи народа
  rationale: Сочетание מִסְפַּר и מִפְקַד обозначает численный итог проведённого учёта. «Итог переписи народа» сохраняет оба смысловых компонента и звучит естественно по-русски.
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: Во всём Израиле насчитывалось
  rationale: Так передаётся результативная конструкция и совокупное значение «весь Израиль», при этом фраза остаётся естественной в контексте переписи.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 1 100 000
  rationale: Запись цифрами ясно передаёт число; буквальная необычная форма древнееврейского выражения сохранена в сноске.
- source_word: אִישׁ
  choice: мужчин
  rationale: В контексте военного исчисления слово относится к мужчинам, учитываемым как носители оружия.
- source_word: שֹׁלֵף חֶרֶב
  choice: обнажающих меч
  rationale: Буквально причастие означает «вынимающий, обнажающий» меч. Выбранный вариант сохраняет живой военный образ, не заменяя его более общим «способных носить оружие».
- source_word: וִיהוּדָה
  choice: а в Иудее
  rationale: Союз вводит параллельный итог по Иудее. Русское «а» ясно обозначает сопоставление двух чисел без усиления противопоставления.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: 470 000
  rationale: Цифровая запись удобна для современного читателя и точно передаёт исходное число.
