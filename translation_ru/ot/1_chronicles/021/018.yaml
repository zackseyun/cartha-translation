base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: ru
  text: И ангел Яхве[a] сказал Гаду передать Давиду, чтобы тот поднялся[b] и воздвиг жертвенник Яхве на гумне Орнана-иевусеянина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «вестник Яхве».
    reason: lexical_alternative
  - marker: b
    text: Или «что Давид должен подняться»; или «что Давиду следует подняться».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: И ангел Яхве
  rationale: מַלְאַךְ может означать «вестник» или «ангел»; в данном повествовании речь идёт о небесном существе, поэтому «ангел» естественно в основном тексте. Имя יְהוָה передано как «Яхве».
- source_word: אָמַר אֶל גָּד לֵאמֹר לְדָוִיד
  choice: сказал Гаду передать Давиду
  rationale: Такая конструкция естественно передаёт поручение Гаду сообщить Давиду последующее повеление, не превращая косвенную речь в прямую.
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: чтобы тот поднялся
  rationale: Форма יַעֲלֶה в контексте передаёт содержание повеления. Местоимение «тот» избегает неестественного повтора имени Давида, а «поднялся» сохраняет пространственный оттенок עלה.
- source_word: לְהָקִים מִזְבֵּחַ
  choice: и воздвиг жертвенник
  rationale: הקים значит «поднять, установить, воздвигнуть». Сочетание «воздвиг жертвенник» точно, естественно и стилистически уместно; союз «и» по-русски ясно передаёт действие, ради которого Давид должен подняться.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Дательный смысл посвящения выражен русским управлением: «воздвиг жертвенник Яхве».'
- source_word: בְּגֹרֶן
  choice: на гумне
  rationale: גֹרֶן обозначает площадку для молотьбы. «Гумно» — краткий и устоявшийся русский эквивалент, подходящий для библейского повествования.
- source_word: אָרְנָן הַיְבֻסִי
  choice: Орнана-иевусея
  rationale: Имя передано как «Орнан», а обозначение этнической принадлежности — приложением «иевусей».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено собственное имя Бога, поэтому оно сохраняется как «Яхве», без замены титулом и без внесения конфессионального толкования.
- issue: Повелительный оттенок כִּי יַעֲלֶה
  choice: чтобы тот поднялся
  alternative: что Давид должен подняться; что Давиду следует подняться
  rationale: Оборот с «чтобы» естественно передаёт содержание поручения, сохраняя директивную силу, но не уточняя без необходимости степень обязательности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Воздвиг жертвенник» и «гумно» сохраняют достоинство и историческую предметность текста; синтаксис упрощён ровно настолько, чтобы стих был понятен обычному современному читателю.
