base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: ru
  text: 'И послал Бог ангела в Иерусалим, чтобы уничтожить его. Но когда тот стал уничтожать город, Яхве увидел и пожалел о бедствии[a]. Он сказал ангелу-губителю: «Довольно! Теперь отведи руку[b]». Ангел Яхве стоял у гумна Орнана-иевусея.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отказался от дальнейшего бедствия». Еврейское רָעָה здесь означает губительное бедствие, а не нравственное зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение буквально использует образ руки; оно означает: «прекрати действие, совершаемое рукой».'
    reason: idiom
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Артикль и контекст с глаголом в единственном числе ясно указывают на Бога Израиля.
- source_word: מַלְאָךְ
  choice: ангел
  rationale: Речь идёт о посланном Богом небесном исполнителе суда; «ангел» точнее передаёт референт, чем общее «посланник».
- source_word: לִירוּשָׁלִַם לְהַשְׁחִיתָהּ
  choice: в Иерусалим, чтобы уничтожить его
  rationale: Предлог ל выражает направление, а инфинитив — цель. Местоимение формально относится к названию города, которое в еврейском языке имеет мужской род.
- source_word: וּכְהַשְׁחִית
  choice: Но когда тот стал уничтожать город
  rationale: Конструкция обозначает действие, во время которого последовало вмешательство. «Стал уничтожать» естественно передаёт уже начавшийся процесс, а явное «город» устраняет неестественную для русского языка смену рода местоимения.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: отступил от бедствия
  rationale: נחם здесь означает прекращение или удержание дальнейшего суда, а רעה — губительное бедствие, не нравственное зло. Формулировка сохраняет повествовательное изображение отклика Бога, не объясняя его философски.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: ангелу-губителю
  rationale: Причастие характеризует ангела как совершающего уничтожение; русское сложное наименование кратко и естественно сохраняет активный смысл.
- source_word: רַב
  choice: Довольно!
  rationale: Краткое восклицание точно передаёт значение достаточности и приказ прекратить действие.
- source_word: הֶרֶף יָדֶךָ
  choice: опусти руку
  rationale: Еврейская идиома требует прекратить действие, совершаемое рукой. «Опусти руку» понятно в современном русском и сохраняет телесный образ оригинала.
- source_word: גֹּרֶן אָרְנָן הַיְבוּסִי
  choice: гумна Орнана-иевусея
  rationale: «Гумно» — точное и устоявшееся русское обозначение площадки для молотьбы; этноним передан как приложение к имени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передаётся собственное имя Бога, прямо употреблённое в еврейском тексте, а не заменяется титулом.
- issue: Антропопатическое выражение וַיִּנָּחֶם עַל הָרָעָה
  choice: отступил от бедствия
  alternative: раскаялся в зле; пожалел о бедствии; передумал насчёт бедствия
  rationale: Перевод сохраняет повествовательную картину Божьего отклика и прекращения суда, не превращая бедствие в нравственное зло и не разрешая скрытую в тексте богословскую напряжённость.
- issue: Личность מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: Сам Яхве в ангельском явлении; сотворённый ангел
  rationale: Буквальная конструкция не определяет онтологический статус фигуры и потому не навязывает спорного богословского вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены имя «Яхве», термин «гумно» и образ руки; синтаксис упрощён там, где буквальное согласование еврейских местоимений было бы неясно по-русски.
