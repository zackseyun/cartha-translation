base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: ru
  text: 'Но царь Давид сказал Орнану: «Нет, я непременно куплю это, заплатив сполна серебром, потому что не возьму для Яхве того, что принадлежит тебе, и не принесу всесожжение даром».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: Нет
  rationale: Решительное לֹא передаёт отказ Давида; следующая часть фразы раскрывает его основание без необходимости механически переводить כִּי отдельным союзом.
- source_word: קָנֹה אֶקְנֶה
  choice: я непременно куплю
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение и выражает твёрдое намерение купить.
- source_word: בְּכֶסֶף מָלֵא
  choice: за полную цену серебром
  rationale: Передаёт как полноту уплаты, так и прямо названный в еврейском тексте материал платежа — серебро.
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: не возьму ... то, что принадлежит тебе
  rationale: В данном контексте נשׂא означает присвоить или принять чужую собственность; выражение принадлежности передано ясно и естественно.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог указывает, что взятое предназначалось бы Яхве; порядок слов сохраняет связь с глаголом «возьму».
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: и не принесу всесожжение
  rationale: Отрицание первой части по смыслу распространяется и на продолжение; «всесожжение» — установившееся точное обозначение жертвы, сжигавшейся целиком.
- source_word: חִנָּם
  choice: даром
  rationale: Наречие означает «без платы, без затрат» и кратко передаёт противопоставление полной оплате.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл жертвы «даром»
  choice: Сохранено буквальное указание на отсутствие платы
  alternative: Толкование как жертвы, которая «ничего мне не стоит»
  rationale: 'Перевод не разворачивает фразу в богословское объяснение и сохраняет лаконичность חִנָּם: Давид отказывается приносить жертву из чужого имущества, полученного бесплатно.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис слегка упрощён ради ясности, а лексические повторы еврейского текста переданы естественными русскими средствами.
