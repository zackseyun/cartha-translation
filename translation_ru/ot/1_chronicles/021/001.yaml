lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: восстал
  rationale: Глагол עמד буквально означает «встать, занять положение»; в данном контексте «восстал» естественно передаёт начало враждебного действия и сохраняет конкретный образ.
- source_word: שָׂטָן
  choice: сатана
  rationale: Существительное употреблено без артикля и может означать как противника вообще, так и личного противника — сатану. Контекст и каноническое восприятие позволяют избрать личное обозначение, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: עַל יִשְׂרָאֵל
  choice: против Израиля
  rationale: Предлог עַל при обозначении враждебного выступления естественно передаётся как «против».
- source_word: וַיָּסֶת
  choice: побудил
  rationale: Порода хифиль глагола סות выражает склонение или подстрекательство к действию. «Побудил» передаёт причинное воздействие, не подразумевая принуждения.
- source_word: לִמְנוֹת
  choice: пересчитать
  rationale: Глагол מנה означает «считать, исчислять». «Пересчитать» ясно обозначает подсчёт народа, не разворачивая выражение до более толковательного «провести перепись».
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: В еврейском тексте прямым дополнением является просто «Израиль»; сохранена краткость оригинала без поясняющего добавления «народ».
theological_decisions:
- issue: Значение и референт שָׂטָן
  choice: сатана как личный враждебный деятель
  alternative: некий противник
  rationale: Еврейское слово допускает нарицательное значение «противник», однако здесь правдоподобно личное обозначение сатаны. Подлинная лексическая неоднозначность сохранена в сноске.
- issue: Соотношение с 2 Царств 24:1
  choice: сохранить сатану как непосредственного побудителя в изложении Паралипоменон
  alternative: согласовать тексты путём замены деятеля или пояснения в основном тексте
  rationale: В 2 Царств 24:1 побуждение связано с гневом Господа, тогда как здесь назван сатана. Перевод не должен сглаживать это богословское напряжение; оно обозначено в сноске без навязанного разрешения.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным и достойным библейским звучанием. Союз «И» сохраняет последовательность еврейского повествования. Строчная форма «сатана» отражает русскую норму написания этого обозначения; неоднозначность между именованием личности и нарицательным «противником» вынесена в сноску.
