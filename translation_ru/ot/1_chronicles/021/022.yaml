  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: обращение Давида к Орнану, просьбу передать участок гумна, цель возведения жертвенника ГОСПОДУ, уплату полной цены и прекращение поражения, постигшего народ. Результативное «чтобы прекратилось» уместно передаёт וְתֵעָצַר в данном контексте, не добавляя причинно-следственной богословской схемы.'
  naturalness: Современный литературный русский выдержан. «Место, где находится гумно» несколько описательнее, чем еврейское «место гумна», но звучит естественно и ясно обозначает участок, а не только хозяйственное действие. Повтор «Отдай» оправдан повтором повелительной формы в оригинале.
  terminology: «ГОСПОДУ» последовательно передаёт тетраграмматон. «За полную цену» точно выражает בְּכֶסֶף מָלֵא. «Поражение» сохраняет широту הַמַּגֵּפָה и не навязывает конкретный медицинский диагноз; в контексте оно понятно как бедствие, поразившее народ.
