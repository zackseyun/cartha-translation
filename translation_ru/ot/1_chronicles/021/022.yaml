base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: ru
  text: 'И сказал Давид Орнану: «Отдай мне место, где находится гумно, чтобы я построил на нём жертвенник ГОСПОДУ. Отдай его мне за полную цену, чтобы прекратилось поражение народа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: место, где находится гумно
  rationale: Передаёт буквально «место гумна» естественным современным русским языком; речь идёт о самом участке, а не только о сооружении.
- source_word: בְּכֶסֶף מָלֵא
  choice: за полную цену
  rationale: Идиома означает уплату полной стоимости без скидки или дара; «цена» естественнее буквального «серебро» в контексте покупки.
- source_word: הַמַּגֵּפָה
  choice: поражение
  rationale: Сохраняет широкий смысл бедствия, поражающего народ, не сужая его непременно до конкретного медицинского диагноза.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона титулом, выделенным прописными буквами.
theological_decisions:
- issue: Цель приобретения места и постройки жертвенника
  choice: чтобы прекратилось поражение народа
  alternative: и поражение народа прекратится
  rationale: Еврейская конструкция с וְ и имперфектом здесь естественно выражает желаемый результат; формулировка не утверждает механической причинности обряда.
translation_notes:
  register: Современный литературный русский, сдержанный и повествовательный. Повтор «Отдай мне» сохранён вслед за настойчивым повтором תנה ... תנהו в еврейском тексте; обращение передано без архаизации.
