  source_fidelity: В целом перечисление и число переданы верно. Однако итоговое «у Овед-Эдома было» может звучать как личное владение и несколько размывает родовую отнесённость לְעֹבֵד אֱדֹם. Формулировка «в роду Овед-Эдома» точнее передаёт итог по его дому. Связку אִישׁ חַיִל בַּכֹּחַ следует передать как характеристику пригодности и силы для службы; сноска не должна выдавать спорную реконструкцию за буквальный перевод.
