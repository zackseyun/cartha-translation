base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: ru
  text: 'Все они были из сыновей Овед-Эдома: они, их сыновья и их братья[a] — люди способные и сильные[b], пригодные к служению. Всего в роду Овед-Эдома было шестьдесят два человека.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственники» — еврейское слово «братья» может обозначать и других мужчин одного рода.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение может означать также «люди доблести» или «доблестные люди»; в этом контексте оно подчёркивает пригодность и силу для исполнения порученной службы.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי עֹבֵד אֱדֹם
  choice: из сыновей Овед-Эдома
  rationale: Предлог מִן указывает на принадлежность к родовой группе; формулировка сохраняет генеалогический смысл и естественна по-русски.
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: они, их сыновья и их братья
  rationale: Сохраняется буквальное перечисление самих мужчин, их сыновей и братьев; возможное более широкое значение последнего слова отмечено в сноске.
- source_word: אִישׁ חַיִל בַּכֹּחַ
  choice: люди способные и сильные
  rationale: חַיִל здесь обозначает состоятельность и пригодность к порученной обязанности, а בַּכֹּחַ — физическую силу; перевод избегает неоправданно военного оттенка.
- source_word: לַעֲבֹדָה
  choice: для служения
  rationale: В контексте распределения привратников речь идёт о храмовой обязанности, однако само еврейское слово не конкретизируется сверх контекста.
- source_word: שִׁשִּׁים וּשְׁנַיִם לְעֹבֵד אֱדֹם
  choice: Всего у Овед-Эдома было шестьдесят два человека
  rationale: Итоговое לְ выражает отнесение общего числа к дому Овед-Эдома; добавление «всего» и «человека» естественно передаёт итоговую формулу.
