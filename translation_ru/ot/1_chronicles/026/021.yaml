base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: ru
  text: Сыновья[a] Лаадана — потомки гирсонита Лаадана. Главами родовых домов[b] Лаадана, гирсонита, были Иехиэли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки». В родословиях слово «сыновья» может обозначать более широкую линию потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «главы отцов»; в родословной терминологии имеются в виду главы родовых семейных объединений.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Основное значение формы сохранено; в родословном контексте слово может обозначать и более широкую линию потомков, что отмечено в сноске.
- source_word: לַעְדָּן
  choice: Лаадан
  rationale: Имя передано транслитерацией, отражающей еврейскую огласовку.
- source_word: הַגֵּרְשֻׁנִּי
  choice: гирсонит
  rationale: Форма указывает на принадлежность к роду Гирсона; краткое обозначение естественно для русской генеалогической речи.
- source_word: לְלַעְדָּן
  choice: Лаадана / Лаадана-гирсонита
  rationale: Предлог выражает родовую принадлежность. Русская конструкция передаёт эту связь без буквального и неясного «для Лаадана».
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главы родовых домов
  rationale: Сохранён традиционный образ «глав», а выражение «родовые дома» понятно передаёт расширенные семейно-родовые объединения.
- source_word: יְחִיאֵלִי
  choice: Иехиэли
  rationale: Форма передана как собственное/родовое имя без попытки устранить присущую сжатой генеалогической записи неоднозначность.
