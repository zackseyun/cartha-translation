- source_word: בְּנֵי חָיִל
  choice: способные люди
  rationale: В данном перечне храмовых привратников выражение, вероятнее всего, указывает на силу, состоятельность и пригодность к служению, а не исключительно на воинскую доблесть.
- source_word: אֱלִיהוּ וּסְמַכְיָהוּ
  choice: Элигу и Семахия
  rationale: Имена переданы транслитерацией с еврейской формы; союз сохранён перед последним элементом перечня.
