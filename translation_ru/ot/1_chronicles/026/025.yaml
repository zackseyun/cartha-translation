base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: ru
  text: 'А вот род Елиезера[a]: Рехавия, его сын, Иешая, его сын, Иорам, его сын, Зихри, его сын и Шеломот, его сын.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его братья Елиезеру». Конструкция в еврейском тексте необычна и, вероятно, вводит родовую ветвь Елиезера; «братья» в родословном контексте может означать также родственников или членов рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: А его братья
  rationale: Сохраняет обычное значение אָח во множественном числе с местоименным суффиксом; в родословном контексте слово может обозначать и более широкую родню.
- source_word: לֶאֱלִיעֶזֶר
  choice: из рода Елиезера
  rationale: Предлог לְ здесь выражает родовую соотнесённость и вводит ветвь Елиезера; формулировка естественна по-русски, а буквальная необычность конструкции отмечена в сноске.
- source_word: רְחַבְיָהוּ
  choice: Рехавия
  rationale: Передача личного имени в форме, соответствующей русской библейской традиции и еврейскому источнику.
- source_word: בְנוֹ
  choice: его сын
  rationale: Повтор выражения в каждом звене сохраняет явно представленную в еврейском тексте последовательность происхождения, не заменяя её пояснительной формулой.
- source_word: וִישַׁעְיָהוּ
  choice: Иешая
  rationale: Транслитерация имени отличает этого человека от пророка Исаии и отражает форму имени в источнике.
- source_word: וְיֹרָם
  choice: Иорам
  rationale: Передаёт краткую форму имени, стоящую в данном стихе, без замены родственной полной формой.
- source_word: וְזִכְרִי
  choice: Зихри
  rationale: Устойчивая русская передача данного личного имени.
- source_word: ו/שלמות
  choice: и Шеломит
  rationale: Передаёт традиционно понимаемое личное имя; союз וְ сохранён, а форма согласуется с чтением имени в этом месте.
