base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: ru
  text: Жребий на восточную сторону выпал Шелемии. Затем бросили жребий для его сына Захарии[a], советника, наделённого проницательностью, и его жребий выпал на северную сторону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрого советника». Буквально еврейское выражение характеризует Захарию как «советника с разумением (рассудительностью)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: жребий ... выпал
  rationale: Сохраняет обычный древнееврейский оборот נפל + גורל и естественно звучит по-русски.
- source_word: מִזְרָחָה
  choice: на восточную сторону
  rationale: Направительный суффикс обозначает сторону, закреплённую при распределении; формулировка согласуется с контекстом храмовых ворот.
- source_word: לְשֶׁלֶמְיָהוּ
  choice: Шелемии
  rationale: Предлог לְ указывает на получателя назначения; имя передано в традиционной русской библейской форме.
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: Затем ... для его сына Захарии
  rationale: Связь с последующим глаголом раскрыта в естественном русском порядке слов; союз ו передан как последовательность событий без усиления смысла.
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: советника, наделённого проницательностью
  rationale: 'Сохраняет оба смысловых компонента: роль советника и присущие ему разумение, рассудительность или проницательность.'
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: бросили жребий
  rationale: Это естественный русский оборот для определения посредством жребия; русское единственное число употреблено собирательно, хотя в еврейском стоит множественное גורלות.
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: и его жребий выпал
  rationale: Передаёт появление результата жеребьёвки естественным русским выражением, не воспроизводя буквально глагол «вышел».
- source_word: צָפוֹנָה
  choice: на северную сторону
  rationale: Передаёт направительное значение и образует параллель с назначением на восточную сторону.
