  source_fidelity: 'Начальное «В этих подразделениях» неверно передаёт לְאֵלֶּה: это не указание места «в», а вводное соотнесение с перечисляемыми подразделениями («у/для этих подразделений»). «Старшие из мужчин» чрезмерно связывает רָאשֵׁי с возрастом; речь о главных, начальствующих людях. Выражение «наравне со своими братьями» допустимо лишь как один из вариантов לְעֻמַּת, но лучше прямо сохранить значение сопоставления или параллельности обязанностей.'
