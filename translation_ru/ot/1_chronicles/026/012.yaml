  terminology: «Привратники», «служить» и «в доме Яхве» уместны. «Начальники» естественно передаёт руководящее значение רָאשֵׁי, не утверждая, что гְּבָרִים непременно означает воинов или просто мужчин определённого возраста. Имя Яхве сохранено.
