  text: לְ֠/אֵלֶּה מַחְלְק֨וֹת הַ/שֹּֽׁעֲרִ֜ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִשְׁמָר֖וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֑ם לְ/שָׁרֵ֖ת בְּ/בֵ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: ru
  text: У этих подразделений привратников начальники имели служебные обязанности, соответствующие обязанностям их братьев, чтобы служить в доме Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза сжата. Буквально: «у этих подразделений привратников — у глав мужей — служебные обязанности напротив (или: наряду с) их братьев». Слово מִשְׁמָרוֹת может означать дежурства, смены, стражу или служебные назначения; לְעֻמַּת — «соответственно», «напротив» или «наряду с».'
    reason: Лексическая и синтаксическая неоднозначность сочетания לְרָאשֵׁי הַגְּבָרִים מִשְׁמָרוֹת לְעֻמַּת אֲחֵיהֶם.
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת
  choice: В этих подразделениях
  rationale: Предложное לְ вводит соотнесение с названными подразделениями; русская конструкция передаёт эту связь естественно, не превращая её в отдельную формулу «таковы».
- source_word: הַשֹּׁעֲרִים
  choice: привратников
  rationale: Речь о служителях, охранявших и обслуживавших храмовые ворота; «привратники» — ясный современный эквивалент.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: старшие из мужчин
  rationale: Сохраняет значение руководящего положения רָאשֵׁי и мужскую референцию גְּבָרִים, избегая неестественного буквального оборота «главы мужей».
- source_word: מִשְׁמָרוֹת
  choice: несли дежурство
  rationale: Существительное обозначает стражу, дежурства или служебные назначения. В эллиптическом еврейском предложении по-русски требуется глагольное оформление; «несли дежурство» не предполагает явно названного в тексте назначающего лица.
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: наравне со своими братьями
  rationale: לְעֻמַּת выражает сопоставление, соответствие или совместность; «наравне» сохраняет связь обязанностей старших с обязанностями их собратьев.
- source_word: לְשָׁרֵת
  choice: чтобы служить
  rationale: Инфинитив выражает цель храмового дежурства; «служить» естественно и сохраняет культовый смысл в данном контексте.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: «Дом» буквально передаёт בַּיִת и в контексте означает храм; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Мужская референция גְּבָרִים
  choice: мужчин
  alternative: людей; руководителей
  rationale: Исторический контекст говорит о мужчинах, исполнявших храмовое служение; мужская референция сохранена без расширения до нейтрального обозначения.
- issue: Характер обязанностей מִשְׁמָרוֹת
  choice: несли дежурство
  alternative: имели служебные назначения; стояли на страже
  rationale: Термин допускает значения стражи, смены и порученной службы. Основной текст выбирает подходящее контексту выражение, а примечание сохраняет широту возможного понимания.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового контекста. Эллиптический еврейский синтаксис умеренно раскрыт ради ясности, но неназванный субъект назначения обязанностей не добавлен; неоднозначность отмечена в сноске.
