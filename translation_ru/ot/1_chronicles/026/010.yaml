base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: ru
  text: 'У Хосы, из потомков Мерари, были сыновья: главным был Шимри, хотя он не был первенцем[a]; отец поставил его главным.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь он не был первенцем»; еврейский союз может иметь как уступительное, так и пояснительное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: У Хосы
  rationale: 'Предлог לְ при личном имени в генеалогическом перечне естественно передаёт принадлежность: «у Хосы были сыновья». Начальное ו связывает стих с предыдущим перечнем и по-русски не требует отдельного союза.'
- source_word: מִן בְּנֵי מְרָרִי
  choice: из сыновей Мерари
  rationale: Сохраняет буквальную родовую формулу и указывает на принадлежность Хосы к потомкам Мерари.
- source_word: בָּנִים
  choice: были сыновья
  rationale: В еврейском тексте стоит именная конструкция «сыновья»; глагольная связка добавлена для естественного русского синтаксиса без изменения смысла.
- source_word: שִׁמְרִי
  choice: Шимри
  rationale: Передача личного имени современной русской библейской транслитерацией.
- source_word: הָרֹאשׁ
  choice: главный
  rationale: רֹאשׁ обозначает здесь первенство по положению, а не часть тела; «главный» естественно передаёт ранг и сохраняет повтор с заключительной фразой.
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: хотя он не был первенцем
  rationale: 'В контексте כִּי выражает вероятное уступительное отношение: Шимри стал главным вопреки тому, что не был первенцем. Возможное пояснительное прочтение сохранено в сноске.'
- source_word: בְכוֹר
  choice: первенцем
  rationale: Обычное обозначение первого по рождению сына; контекст позволяет не добавлять слово «сын».
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: отец поставил его главным
  rationale: שׂים с לְ обозначает назначение или определение на положение. «Поставил его главным» сохраняет это значение и лексический повтор רֹאשׁ.
