source:
  edition: WLC
  text: עַמִּיאֵ֤ל הַ/שִּׁשִּׁי֙ יִשָׂשכָ֣ר הַ/שְּׁבִיעִ֔י פְּעֻלְּתַ֖י הַ/שְּׁמִינִ֑י כִּ֥י בֵרֲכ֖/וֹ אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: ru
  text: Аммиил — шестой, Иссахар — седьмой, Пеуллетай — восьмой, потому что Бог благословил его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По контексту «его», вероятнее всего, означает Овед-Эдома.
    reason: referent_clarification
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: Аммиил
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: הַשִּׁשִּׁי
  choice: шестой
  rationale: Порядковое числительное продолжает перечень сыновей по порядку.
- source_word: יִשָׂשכָר
  choice: Иссахар
  rationale: Здесь это личное имя одного из сыновей; сохранена традиционная русская форма.
- source_word: הַשְּׁבִיעִי
  choice: седьмой
  rationale: Порядковое числительное передано в соответствии с параллельным строением перечня.
- source_word: פְּעֻלְּתַי
  choice: Пеуллетай
  rationale: Транслитерация личного имени отражает еврейскую вокализацию и удвоение согласного.
- source_word: הַשְּׁמִינִי
  choice: восьмой
  rationale: Порядковое числительное завершает последовательность.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение многочисленности сыновей; русский причинный союз ясно передаёт эту функцию.
- source_word: בֵרֲכוֹ
  choice: благословил его
  rationale: Форма означает «благословил» с местоименным суффиксом третьего лица мужского рода; в русском нет необходимости добавлять значение предпрошедшего времени.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте слово обозначает единого Бога и согласуется с глаголом в единственном числе.
theological_decisions:
- issue: К кому относится местоимение «его»
  choice: В основном тексте сохранено местоимение; по контексту оно, вероятнее всего, относится к Овед-Эдому, отцу перечисленных сыновей.
  alternative: Понимать благословение более широко как относящееся ко всему его дому или роду.
  rationale: Ближайший контекст (1 Пар. 26:4–8) перечисляет сыновей и потомков Овед-Эдома, поэтому благословение естественнее всего связывать с ним; однако само местоимение в стихе не называет референта прямо.
translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified перечнем. Тире помогают естественно оформить подразумеваемую связку в именном ряду; причинная связь передана прямо, без искусственного предпрошедшего времени.
