  yaml_path: translation/ot/1_chronicles/026/019.yaml
  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: ru
  text: Вот подразделения привратников из потомков Корея и потомков Мерари.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот подразделения привратников для потомков Корея и потомков Мерари».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное местоимение в безглагольном итоговом предложении естественно передаётся русским «вот»; оно не навязывает отсутствующее в еврейском тексте время связки.
- source_word: מַחְלְקוֹת
  choice: распределение… по подразделениям
  rationale: Существительное обозначает организованные служебные группы или разряды. Такая формулировка ясно передаёт административный смысл в храмовом контексте.
- source_word: הַשֹּׁעֲרִים
  choice: привратников
  rationale: Современное и понятное обозначение людей, охранявших храмовые ворота; точнее по контексту, чем общее «сторожей».
- source_word: לִבְנֵי הַקָּרְחִי
  choice: среди потомков Корея
  rationale: Форма קָּרְחִי является обозначением рода Корея, а בְּנֵי в родословно-клановом контексте может естественно означать потомков; русский перевод избегает неестественного буквального сочетания «сыновья кореянина».
- source_word: וְלִבְנֵי מְרָרִי
  choice: и среди сыновей Мерари
  rationale: Сохранено явное еврейское выражение «сыновья Мерари» и параллельное распределительное значение предлога לְ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно официальным оттенком, подходящим для итоговой формулы храмового перечня. Безглагольность еврейского предложения передана конструкцией с «вот», чтобы не вводить искусственно настоящее или прошедшее время.
