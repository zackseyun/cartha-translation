base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: ru
  text: Сыновья Иехиэли — Зетам и его брат Иоиль — заведовали сокровищницами дома Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дома Яхве»; традиционный перевод: «дома Господа».'
    reason: Указание буквального выражения и традиционного способа передачи божественного имени.
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן; в данном родословно-административном контексте прямое значение «сыновья» предпочтительнее более широкого «потомки».
- source_word: יְחִיאֵלִי
  choice: Иехиэли
  rationale: Форма понята как личное имя после слова «сыновья». Возможное прилагательное со значением принадлежности к роду Иехиэля здесь менее вероятно ввиду последующего перечисления лиц.
- source_word: זֵתָם
  choice: Зетам
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: וְיוֹאֵל
  choice: и Иоиль
  rationale: Союз וְ соединяет второе личное имя с первым; имя יוֹאֵל передано традиционной русской формой «Иоиль».
- source_word: אָחִיו
  choice: его брат
  rationale: Существительное в единственном числе с суффиксом 3-го лица мужского рода единственного числа естественно обозначает Иоиля как брата Зетама; русский порядок слов делает эту связь ясной.
- source_word: עַל
  choice: заведовали
  rationale: В административном контексте предлог указывает на возложенный надзор и ответственность. «Заведовали» естественно выражает эту функцию по-русски.
- source_word: אֹצְרוֹת
  choice: сокровищницами
  rationale: Во множественном числе слово обозначает храмовые помещения или хранилища ценностей и припасов; «сокровищницы» сохраняет институциональный смысл.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сочетание буквально означает «дом Яхве». Слово «дом» сохранено вместо поясняющего «храм», а личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Форма «Яхве» передаёт его как личное имя и не заменяет титулом, при этом традиционный вариант отмечен в сноске.
- issue: Передача выражения בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: Буквальное «дом Яхве» сохраняет образность и формулировку исходного текста; в контексте речь идёт о храме, но это уточнение не требуется в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире оформляют пояснительное перечисление и помогают ясно связать слова «его брат» с Зетамом, не устраняя грамматической особенности еврейского текста.
