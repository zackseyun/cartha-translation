base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: ru
  text: И всё, что посвятили Самуил-прозорливец[a], Саул, сын Киса, Авенир, сын Нира, и Иоав, сын Саруи, — всё, что кто-либо посвятил, — находилось в ведении[b] Шеломифа и его братьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Прозорливец» — древний еврейский титул пророческого служителя.
    reason: cultural_note
  - marker: b
    text: 'Или: «было поручено Шеломифу и его братьям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִקְדִּישׁ
  choice: посвятили
  rationale: Форма породы hифиль от קדשׁ означает передачу или отделение имущества для священного употребления; «посвятили» естественно передаёт это действие в контексте храмовой казны.
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: Самуил-прозорливец
  rationale: Сохранён особый древнееврейский титул רֹאֶה, буквально связанный со зрением и отличающийся от более общего «пророк».
- source_word: בֶּן
  choice: сын
  rationale: В перечислении названий лиц это обычная формула прямого родства.
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: всё, что кто-либо посвящал
  rationale: Собирательное כֹּל с причастием охватывает всё посвящавшееся любым человеком; такой перевод передаёт более широкий смысл возобновляющей фразы и не сводит её к простому повтору предыдущего списка.
- source_word: עַל יַד
  choice: находилось в ведении
  rationale: В административном контексте идиома указывает на порученную ответственность и надзор, а не буквально на пространственное положение «на руке».
- source_word: וְאֶחָיו
  choice: и его братьев
  rationale: Форма естественнее всего обозначает братьев Шеломифа; более широкое значение «родственников» возможно, но контекст его не требует.
