revisions:
- from: И всё, что посвятили Самуил-прозорливец[a], Саул, сын Киса, Авенир, сын Нира, и Иоав, сын Саруи, — всё, что кто-либо посвящал, — находилось в ведении Шеломифа и его братьев[b].
  to: И всё, что посвятили Самуил-прозорливец[a], Саул, сын Киса, Авенир, сын Нира, и Иоав, сын Саруи, — всё, что кто-либо посвятил, — находилось в ведении[b] Шеломифа и его братьев.
  rationale: Заменён несовершенный вид «посвящал» на совершенный «посвятил», чтобы не вносить значение продолжающейся практики и сохранить ретроспективный характер перечисления. Якорь лексической сноски перенесён к «в ведении», точному месту передачи עַל־יַד. Остальные формулировки сохранены.
