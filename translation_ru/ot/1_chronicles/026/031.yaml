base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: ru
  text: Среди хевронитов Иерия был главой по родословиям и отцовским домам[a]. На сороковом году царствования Давида их разыскали, и среди них в Иазере Галаадском нашлись доблестные мужи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Отцовский дом» — родовая группа, объединённая происхождением от общего предка, а не только отдельная семья.
    reason: cultural_note
  - marker: b
    text: Еврейское выражение может также означать «храбрые воины» или «способные люди» — людей, отличавшихся силой, доблестью или испытанными способностями.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: У хевронитов
  rationale: Предлог לְ вводит новую тему и обозначает группу, к которой относится последующее сообщение; по-русски естественно передать это как «У хевронитов».
- source_word: יְרִיָּה
  choice: Иерия
  rationale: Традиционно узнаваемая русская передача данного еврейского личного имени, соответствующая его форме в масоретском тексте.
- source_word: הָרֹאשׁ
  choice: главой был / глава
  rationale: רֹאשׁ в родословно-административном контексте означает старшего или руководителя рода; «глава» сохраняет и образ, и официальный оттенок.
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: по их родословиям и отцовским домам
  rationale: תולדות обозначает линии происхождения или родословные, а «отцовские дома» — устойчивую родовую единицу. Местоимение передано во множественном числе по смыслу, как относящееся к хевронитскому роду, представленному Иерией.
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
  choice: В сороковой год царствования Давида
  rationale: Естественная русская передача формулы датировки по году царствования.
- source_word: נִדְרָשׁוּ
  choice: их разыскали
  rationale: Нифаль глагола דרש указывает на целенаправленный поиск или проверку. Русская неопределённо-личная конструкция естественно сохраняет отсутствие названного деятеля.
- source_word: וַיִּמָּצֵא בָהֶם
  choice: среди них ... нашлись
  rationale: Форма глагола буквально стоит в единственном числе, но в данном обороте вводит следующее множественное обозначение лиц; «нашлись» естественно передаёт результат поиска.
- source_word: גִּבּוֹרֵי חַיִל
  choice: доблестные мужи
  rationale: Сочетание может обозначать воинскую доблесть, силу или выдающуюся способность. «Доблестные мужи» сохраняет широкий и возвышенный смысл, не сводя его исключительно к военной должности.
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: в Иазере Галаадском
  rationale: Передаёт название города и его областное определение естественной русской библейско-географической формой.
