translation:
  language: ru
  text: А Шевуил, сын Гирсама, сына Моисея, был начальником[a] над сокровищницами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руководителем», «главой». Еврейское слово обозначает человека, наделённого властью и поставленного во главе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хранилищами». Еврейское слово может обозначать как места хранения ценностей, так и сами сокровища — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: А Шевуил
  rationale: Союз ו передаёт связь с предшествующим перечнем; «а» естественно вводит в русском языке следующего названного служителя. Имя передано в принятой русской библейской форме.
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: сын Гирсома, сына Моисея
  rationale: 'Дважды повторённое בֶּן сохраняет прямую родословную цепочку: Шевуил — сын Гирсома, а Гирсом — сын Моисея.'
- source_word: נָגִיד
  choice: начальником
  rationale: Слово обозначает поставленного над другими руководителя. В административном контексте «начальник» ясно выражает полномочия и не привносит монархического смысла слова «князь».
- source_word: עַל
  choice: над
  rationale: Предлог выражает руководство и ответственность за названную область.
- source_word: הָ/אֹצָרוֹת
  choice: сокровищницами
  rationale: Во множественном числе слово может обозначать как хранилища, так и находящиеся в них ценности; в данном храмово-административном контексте «сокровищницы» естественно охватывает место хранения ценностей.
