  text: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ בָּנִ֧ים וְ/אַחִ֛ים בְּנֵי חָ֖יִל שְׁמוֹנָ֥ה עָשָֽׂר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/009.yaml
  text: And Shelemiah had sons and brothers[a], valiant men[b], eighteen.
translation:
  language: ru
  text: У Мешелемии были сыновья и братья[a] — способные люди[b], всего восемнадцать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и у Мешелемии — сыновья и братья»; такая еврейская конструкция вводит человека, чьи люди здесь подсчитываются.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доблестные люди»; буквально: «сыны силы (доблести)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֶֽׁלֶמְיָ֗הוּ
  choice: У Мешелемии были
  rationale: Буквальное «и у/для Мешелемии» в данном перечне вводит человека, чьи родственники подсчитываются. Русская конструкция «у Мешелемии были» естественно передаёт эту функцию.
- source_word: בָּנִים
  choice: сыновья
  rationale: Слово обозначает сыновей, то есть потомков мужского пола, а не детей вообще.
- source_word: וְ/אַחִים
  choice: и братья
  rationale: Обычное значение אַחִים — «братья». Более широкое «родственники» возможно в иных контекстах, но здесь для него нет достаточных оснований.
- source_word: בְּנֵי חָיִל
  choice: способные люди
  rationale: Идиома буквально означает «сыны силы/доблести» и может характеризовать сильных, достойных или умелых людей. В контексте распределения обязанностей «способные люди» звучит естественно и не сужает смысл исключительно до воинской храбрости.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: всего восемнадцать
  rationale: Числительное передано стандартно; «всего» ясно обозначает итог подсчёта, подразумеваемый перечислительной конструкцией.
theological_decisions: []
