  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: ru
  text: И у Шемаии, его сына, родились сыновья, стоявшие во главе домов своих отцов[a], потому что они были сильными и способными людьми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «управлявшие домами своих отцов». Под «домами отцов» имеются в виду родовые семейные общности.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение может также означать «доблестные мужи» или «сильные воины»; здесь оно может указывать шире на силу, надёжность и доказанные способности.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  choice: И у Шемаии, его сына
  rationale: Предложная конструкция с формулой рождения естественно передаётся по-русски оборотом «у Шемаии… родились». Приложение «его сына» сохраняет отнесение Шемаии к ранее названному Овед-Эдому.
- source_word: נוֹלַד בָּנִים
  choice: родились сыновья
  rationale: Хотя глагольная форма морфологически стоит в единственном числе, в данной формуле рождения смысловым подлежащим является множественное «сыновья»; русское согласование требует множественного числа.
- source_word: הַמִּמְשָׁלִים
  choice: стоявшие во главе
  rationale: Причастие от משל выражает управление или власть. Этот оборот естественно передаёт руководящее положение, не приписывая персонажам формального титула.
- source_word: לְבֵית אֲבִיהֶם
  choice: своего отцовского дома
  rationale: בית אב обозначает родовую семейную общность, а не только здание. «Отцовский дом» сохраняет библейский общественно-родовой образ и сингулярную форму בית.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание того, почему сыновья занимали руководящее положение.
- source_word: גִּבּוֹרֵי חַיִל
  choice: людьми сильными и способными
  rationale: Устойчивое выражение может обозначать не только воинскую доблесть, но также силу, состоятельность и доказанную способность. В контексте родовой и служебной организации широкий перевод уместнее исключительно военного.
- source_word: הֵמָּה
  choice: они были
  rationale: Самостоятельное местоимение придаёт утверждению оттенок подчёркивания; по-русски он достаточно передан явным местоимением «они».
