  text: לְ/מַחְלְק֖וֹת לְ/שֹׁעֲרִ֑ים לַ/קָּרְחִ֕ים מְשֶֽׁלֶמְיָ֥הוּ בֶן קֹרֵ֖א מִן בְּנֵ֥י אָסָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: ru
  text: О разрядах привратников:[a] из корахитян — Мешелемия, сын Коре, из сыновей Асафа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По разрядам привратников». Начальные слова служат заголовком раздела о группах привратников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: О разрядах привратников
  rationale: Начальные формы с לְ вводят тему нового раздела. «Разряды» передаёт организованные служебные группы, а «привратники» — служителей, поставленных при воротах.
- source_word: לַקָּרְחִים
  choice: из корахитян
  rationale: Форма обозначает принадлежность к роду Корея; русское «из корахитян» естественно вводит представителя этой родовой группы.
- source_word: מְשֶׁלֶמְיָהוּ
  choice: Мешелемия
  rationale: Имя передано принятой русской библейской формой, соответствующей полной форме еврейского имени в данном стихе.
- source_word: בֶן קֹרֵא
  choice: сын Коре
  rationale: בֶן в этой краткой родословной естественно означает «сын»; личное имя קֹרֵא передано транслитерацией «Коре».
- source_word: מִן בְּנֵי אָסָף
  choice: из сыновей Асафа
  rationale: מִן выражает происхождение или принадлежность к более широкой родовой линии. Буквальная формулировка сохраняет имя Асафа и не отождествляет его без текстового основания с каким-либо другим носителем этого имени.
theological_decisions: []
translation_notes:
  register: Краткая именная конструкция сохранена как заголовок и начало перечня. Двоеточие и тире делают её понятной в современном литературном русском, не превращая фрагментарный еврейский синтаксис в полное предложение.
