  text: 'У Парвара[a] с западной стороны: четверо у дороги[b] и двое у Парвара.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «территория», «двор» или «пристройка»; традиционно — «предместье». Точное значение редкого еврейского слова «парвар» неизвестно.'
