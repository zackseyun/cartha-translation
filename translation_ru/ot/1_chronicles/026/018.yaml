lexical_decisions:
- source_word: פַּרְבָּר
  choice: Парвар
  rationale: Редкое слово с неясным архитектурным значением. Транслитерация сохраняет название конкретного храмового места и не навязывает спорное толкование; возможные значения приведены в сноске.
- source_word: מַעֲרָב
  choice: с западной стороны
  rationale: Передаёт направление или расположение на западной стороне естественным современным русским выражением.
- source_word: אַרְבָּעָה
  choice: четверо
  rationale: Собирательное числительное естественно обозначает подразумеваемых по контексту привратников.
- source_word: מְסִלָּה
  choice: дорога
  rationale: Нейтрально передаёт путь или устроенную дорогу; более узкое значение «насыпная дорога» сохранено в сноске.
- source_word: שְׁנַיִם
  choice: двое
  rationale: Собирательное числительное естественно обозначает вторую группу подразумеваемых привратников.
- source_word: לְ
  choice: у
  rationale: В перечне назначений предлог указывает место несения службы; русское «у» звучит естественно и сохраняет пространственное отношение.
