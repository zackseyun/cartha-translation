base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/002.yaml
  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: ru
  text: 'У Шелемии были сыновья[a]: Захария — первенец, Иедиаил — второй, Зевадия — третий, Иафниил[b] — четвёртый.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И у Шелемии — сыновья»; это родословная конструкция со значением «у Шелемии были сыновья».'
    reason: cultural_note
  - marker: b
    text: 'Или: «Ятниэл» — более точная передача начальных звуков еврейского имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: У Шелемии были сыновья
  rationale: Буквально еврейская безглагольная конструкция означает «и у Шелемии — сыновья». Русское «у Шелемии были сыновья» естественно передаёт значение принадлежности; союз וְ здесь может лишь связывать запись с предшествующим перечнем и не требует отдельного «и» в русском стихе.
- source_word: זְכַרְיָהוּ
  choice: Захария
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: הַבְּכוֹר
  choice: первенец
  rationale: Точно передаёт значение первого родившегося сына, а не просто старшего по возрасту.
- source_word: יְדִיעֲאֵל
  choice: Иедиаил
  rationale: Традиционная русская библейская передача личного имени.
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Прямая и последовательная передача порядкового числительного.
- source_word: זְבַדְיָהוּ
  choice: Зевадия
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: הַשְּׁלִישִׁי
  choice: третий
  rationale: Прямая и последовательная передача порядкового числительного.
- source_word: יַתְנִיאֵל
  choice: Иафниил
  rationale: Традиционная русская библейская форма имени; более буквальная транслитерация с еврейского — «Ятниэл».
- source_word: הָרְבִיעִי
  choice: четвёртый
  rationale: Прямая и последовательная передача порядкового числительного.
