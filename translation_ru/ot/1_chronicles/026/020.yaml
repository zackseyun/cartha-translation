  text: וְֽ/הַ/לְוִיִּ֑ם אֲחִיָּ֗ה עַל אֽוֹצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹֽצְר֖וֹת הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: ru
  text: А из левитов[a] Ахия ведал сокровищницами дома Божьего и сокровищницами святынь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что касается левитов, Ахия ведал…» Начало еврейской фразы несколько эллиптично и может служить переходом, подобным заголовку.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «святых вещей»; возможно также: «посвящённых вещей» или «освящённых вещей», то есть предметов, отделённых для священного употребления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: А из левитов
  rationale: Сочетание союза с определённым существительным здесь, перед именем в единственном числе, естественно понимать как эллиптический тематический переход. Перевод сохраняет эту особенность и связывает Ахию с левитами.
- source_word: אֲחִיָּה
  choice: Ахия
  rationale: Традиционная и понятная русская передача еврейского личного имени.
- source_word: עַל
  choice: ведал
  rationale: В административном контексте предлог указывает на порученное руководство или надзор; «ведал» передаёт это значение кратко и в достойном литературном регистре.
- source_word: אֹצְרוֹת
  choice: сокровищницами
  rationale: В храмовом контексте речь идёт о помещениях или хранилищах ценностей и запасов; «сокровищницы» соответствует контексту и сохраняет институциональный оттенок.
- source_word: בֵּית הָאֱלֹהִים
  choice: дома Божьего
  rationale: Прямая передача выражения «дом Бога»; в контексте оно обозначает храм, но перевод не заменяет исходный образ пояснением.
- source_word: וּלְאֹצְרוֹת
  choice: и сокровищницами
  rationale: Предлог לְ связывает вторую группу сокровищниц с тем же порученным надзором. Русское управление глагола «ведал» естественно распространяется на оба однородных дополнения.
- source_word: הַקֳּדָשִׁים
  choice: святынь
  rationale: Субстантивированное множественное число обозначает то, что отделено для священного употребления, в том числе посвящённые предметы и дары. «Святыни» сохраняет широкое значение без чрезмерной конкретизации.
