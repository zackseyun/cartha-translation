lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: Что касается родов Амрама
  rationale: Предлог לְ при обозначении рода вводит заголовок перечня. Оборот «что касается» естественно передаёт эту функцию, а «роды Амрама» ясно выражает собирательное родовое обозначение.
- source_word: לַיִּצְהָרִי
  choice: Ицгара
  rationale: Родовое обозначение передано сочетанием «роды … Ицгара»; имя יִצְהָר транслитерировано в принятой русской библейской форме «Ицгар».
- source_word: לַחֶבְרוֹנִי
  choice: Хеврона
  rationale: Собирательное обозначение потомков Хеврона включено в однородный перечень родов без тяжеловесного повторения слова «роды».
- source_word: לָעָזִּיאֵלִי
  choice: и Уззиила
  rationale: Последнее родовое обозначение передано согласованно с остальными; союз «и» добавлен по нормам русского перечисления.
