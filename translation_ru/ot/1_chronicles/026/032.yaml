base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: ru
  text: А его братьев[a] — доблестных людей, глав отеческих домов — было две тысячи семьсот. Царь Давид назначил их над рувимлянами, гадитянами и половиной колена Манассии для ведения всех дел Бога и дел царя.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сородичи» или «родственники».'
    reason: Слово אחים может обозначать как родных братьев, так и сородичей или родственников в более широком смысле.
  - marker: b
    text: 'Или: «по всем вопросам, относящимся к Богу, и по делам царя».'
    reason: Слово דבר допускает значения «дело», «вопрос» или «занятие»; более буквальная конструкция сохраняет неоднозначный объём ответственности.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Его братья
  rationale: Прямое значение אחים — «братья»; в родовом контексте слово может обозначать и более широкий круг родственников, что отмечено в сноске.
- source_word: בְּנֵי חַיִל
  choice: доблестные люди
  rationale: Устойчивое сочетание обозначает людей силы, доблести и способности; выбранный вариант сохраняет достоинство выражения и не сводит его лишь к административной компетентности.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: глав отеческих домов
  rationale: Это родовой и административный термин для руководителей больших семейных объединений; формулировка сохраняет устройство, выраженное в еврейском тексте.
- source_word: וַיַּפְקִידֵם
  choice: поставил их
  rationale: Каузативная форма פקד здесь означает официальное возложение ответственности или надзора.
- source_word: עַל הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: над рувимлянами, гадитянами и половиной колена Манассии
  rationale: Предлог עַל указывает на вверенный надзор, а формы названий племён в единственном числе обозначают их членов собирательно.
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: для ведения всех дел Божьих и дел царя
  rationale: דבר здесь имеет значение «дело, вопрос, занятие». Перевод сохраняет различение Божьей и царской сфер ответственности, не уточняя их содержание сверх оригинала.
theological_decisions:
- issue: Соотношение Божьих и царских дел
  choice: 'Сохранены две параллельные сферы ответственности: «дел Божьих и дел царя».'
  alternative: «по всем вопросам, относящимся к Богу и царю»
  rationale: Еврейский текст различает две области управления, но не устанавливает между ними иерархии и не даёт оснований переносить сюда позднейшие категории отношений религиозной и светской власти.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Термин «отеческие дома» сохранён как понятное обозначение древнего родового устройства; синтаксис разделён на два предложения для ясности.
