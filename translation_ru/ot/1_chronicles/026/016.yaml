base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/016.yaml
  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: ru
  text: Шуппиму и Хосе выпал жребий на западную сторону, у ворот Шаллехет[a], на дороге, ведущей вверх; караул напротив караула.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «у ворот Выбрасывания». «Шаллехет», вероятно, собственное название ворот, связанное с глаголом «выбрасывать» или «низвергать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: Шуппиму и Хосе выпал жребий
  rationale: Префиксы ל обозначают назначение в контексте распределения мест по жребию. Слова «выпал жребий» восполняют подразумеваемую по соседним стихам формулу и делают фразу естественной по-русски.
- source_word: לַמַּעֲרָב
  choice: на западную сторону
  rationale: Выражение обозначает западную сторону или западный участок назначенной охраны; этот перевод сохраняет пространственный смысл.
- source_word: עִם שַׁעַר שַׁלֶּכֶת
  choice: у ворот Шаллехет
  rationale: Предлог עִם связывает назначенный участок с ориентиром. В данном контексте русское «у» естественно передаёт пространственную связь, а שַׁלֶּכֶת сохранено как вероятное собственное название ворот.
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: на дороге, ведущей вверх
  rationale: מְסִלָּה обозначает проложенную или возвышенную дорогу, а причастие הָעוֹלָה указывает, что она поднимается вверх. Описательный перевод ясен и не переуточняет тип дороги.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: караул напротив караула
  rationale: 'Сохранена краткая и несколько неоднозначная конструкция оригинала: речь может идти о караулах или сторожевых постах, расположенных друг напротив друга либо соотнесённых один с другим.'
