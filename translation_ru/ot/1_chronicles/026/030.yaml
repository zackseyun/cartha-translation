source:
  edition: WLC
  text: לַֽ/חֶבְרוֹנִ֡י חֲשַׁבְיָהוּ֩ וְ/אֶחָ֨י/ו בְּנֵי חַ֜יִל אֶ֣לֶף וּ/שְׁבַע מֵא֗וֹת עַ֚ל פְּקֻדַּ֣ת יִשְׂרָאֵ֔ל מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן מַעְרָ֑בָ/ה לְ/כֹל֙ מְלֶ֣אכֶת יְהוָ֔ה וְ/לַ/עֲבֹדַ֖ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: ru
  text: 'Хеврониты: Хашавия и его братья — тысяча семьсот способных мужей — надзирали за Израилем к западу от Иордана[a] во всём, что касалось дела Господа и службы царю.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по ту сторону Иордана, к западу», то есть на западной стороне Иордана.'
    reason: Сноска сохраняет буквальную пространственную формулировку еврейского текста при идиоматичном переводе в основном тексте.
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: Из хевронитов
  rationale: Форма обозначает хевронитскую левитскую группу; русский множественный родительный естественно вводит представителя этой группы в перечне.
- source_word: חֲשַׁבְיָהוּ
  choice: Хашавия
  rationale: Имя передано транслитерацией с еврейского; конечное -יהו отражено традиционной для русского библейского употребления формой «-ия».
- source_word: וְאֶחָיו
  choice: и его братья
  rationale: Сохранено прямое значение; в родовом контексте слово может охватывать более широкий круг соплеменников, но контекст этого не требует уточнять.
- source_word: בְּנֵי חַיִל
  choice: способных мужей
  rationale: В административном контексте выражение характеризует пригодность и состоятельность людей, не обязательно воинскую доблесть.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת
  choice: тысяча семьсот
  rationale: Числительное передано словами в соответствии с литературным повествовательным регистром.
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: надзирали за Израилем
  rationale: Передаёт порученную ответственность и надзор, избегая избыточно современной бюрократической терминологии.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: к западу от Иордана
  rationale: Идиоматично обозначает западную сторону Иордана; более буквальное пространственное выражение сохранено в сноске.
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: во всём, что касалось дела Господа
  rationale: Широкое значение מְלָאכָה — работа, дело, занятие — передано без искусственного ограничения храмовым служением.
- source_word: יְהוָה
  choice: Господь
  rationale: Тетраграмматон передан принятой в русской библейской литературе заместительной формой «Господь».
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: и службы царю
  rationale: Сохраняется отличие царской службы от дела Господа; дательный падеж естественен в современном русском.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана укоренённая русская библейская передача, соответствующая предоставленному аудированному слою и последней редакции; она не добавляет конфессионального толкования.
- issue: Характер обязанностей хевронитов
  choice: общее дело Господа и служба царю
  alternative: исключительно культовое или исключительно гражданское управление
  rationale: Широта слов מְלָאכָה и עֲבֹדָה сохранена; текст не уточняет полный состав обязанностей, поэтому перевод не сужает их до одной сферы.
translation_notes:
  register: Современный литературный русский с достоинством хроникального административного перечня. Синтаксис упрощён до естественной русской конструкции, при этом сохранены число людей, сфера надзора и параллель между делом Господа и царской службой.
