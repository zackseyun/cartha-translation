  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: ru
  text: Шеломот и его братья заведовали всеми сокровищницами посвящённых даров[a], которые посвятили царь Давид, главы родов[b], начальники тысяч и сотен[c] и военачальники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священных вещей»; речь идёт о посвящённых дарах и предметах.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «главы отцов» — родовой административный термин, то есть главы родов или родовых домов.'
    reason: cultural_note
  - marker: c
    text: 'В еврейском тексте перед словами «начальники тысяч» стоит предлог, который может указывать на особую связь с предшествующими словами; возможно также: «главы родов при начальниках тысяч и сотен».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: Шеломот и его братья
  rationale: Формально фраза начинается местоимением «он», но далее назван составной субъект. В русском естественно передать его прямо, не воспроизводя грамматически неловкое единственное число.
- source_word: עַל כָּל אֹצְרוֹת
  choice: заведовали всеми сокровищницами
  rationale: В административном контексте עַל обозначает надзор или ответственность, а אֹצָר — сокровищницу либо хранилище. «Заведовали» кратко и естественно выражает эту функцию.
- source_word: הַקֳּדָשִׁים
  choice: святынь
  rationale: Слово обозначает священные, посвящённые предметы. «Святыни» сохраняет культовый смысл и хорошо сочетается с упоминанием сокровищниц.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: которые посвятили
  rationale: Hифиль глагола קדשׁ значит «посвящать, отделять как святыню». Множественное число по-русски согласует сказуемое со всем последующим рядом лиц, который наиболее естественно понимается как совокупный субъект.
- source_word: דָּוִיד הַמֶּלֶךְ
  choice: царь Давид
  rationale: Обычный и естественный для русского языка порядок титула и имени.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главы родов
  rationale: Это родовой административный термин. «Главы родов» понятно современному читателю и не требует буквального, но неясного выражения «главы отцов».
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: начальники тысяч и сотен
  rationale: Передаёт воинско-административные подразделения, не подменяя их современными воинскими званиями.
- source_word: שָׂרֵי הַצָּבָא
  choice: военачальники
  rationale: Компактный современный эквивалент выражения «начальники войска»; речь идёт о земном войске.
theological_decisions:
- issue: Круг лиц, посвятивших святыни
  choice: Все перечисленные лица — Давид, главы родов, начальники подразделений и военачальники — представлены как те, кто посвятил святыни.
  alternative: Глагол в единственном числе можно формально связать только с Давидом, а дальнейшие определения истолковать иначе.
  rationale: Несмотря на единственное число הִקְדִּישׁ, последовательное соединение именных групп союзом וְ наиболее естественно образует составной ряд субъектов; единственное число объяснимо тем, что сказуемое предшествует остальным членам ряда.
- issue: Необычный предлог לְ перед «начальниками тысяч»
  choice: Основной текст передаёт перечисление посвятивших лиц, а грамматическая трудность отмечена в сноске.
  alternative: 'Возможна более буквальная связь: «главы родов при начальниках тысяч и сотен».'
  rationale: Форма לְ допускает различное понимание связи между группами. Контекст поддерживает обычное перечисление, но неоднозначность масоретского текста не следует скрывать.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Имена и древние должности переданы без архаизации; структура предложения сохраняет последовательный перечень исходного текста.
