base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: ru
  text: 'С восточной стороны — шесть левитов; с северной — по четыре в день; с южной — по четыре в день; у кладовых[a] — по двое.


    [a] Евр. «Асуппим»; возможно, это название определённого места или комплекса помещений, а не кладовые в общем смысле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Асуппим»; возможно, это название определённого места или комплекса помещений, а не кладовые в общем смысле.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: с восточной стороны
  rationale: Предлог с обозначением стороны света указывает на место служения; такой оборот естественен по-русски в перечне назначенных постов.
- source_word: הַלְוִיִּם שִׁשָּׁה
  choice: шесть левитов
  rationale: Сохраняется прямое указание на число левитов, назначенных с восточной стороны.
- source_word: לַצָּפוֹנָה ... לַנֶּגְבָּה
  choice: с северной ... с южной
  rationale: Параллельные обозначения сторон переданы единообразно и естественно для русского перечня.
- source_word: לַיּוֹם
  choice: по четыре в день
  rationale: Оборот выражает ежедневное распределение; частица «по» ясно передаёт распределительное значение.
- source_word: וְלָאֲסֻפִּים
  choice: у кладовых[a]
  rationale: Вероятное значение связано с помещениями для хранения, однако точный референт спорен; поэтому возможное имя места «Асуппим» сохранено в сноске.
- source_word: שְׁנַיִם שְׁנָיִם
  choice: по двое
  rationale: Повтор числительного имеет распределительное значение; «по двое» кратко и естественно передаёт назначение парами.
