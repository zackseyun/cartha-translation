  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: ru
  text: Овед-Эдому досталась южная сторона, а его сыновьям — дом кладовых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дом хранилищ»; возможно также: «дом собранных запасов». Значение еврейского слова спорно; оно может обозначать хранилища или собранные предметы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: Овед-Эдому досталась
  rationale: Предлог לְ в контексте распределения по жребию обозначает получателя назначения; добавленное «досталась» естественно передаёт по-русски подразумеваемую формулу распределения.
- source_word: נֶגְבָּה
  choice: южная сторона
  rationale: Форма с направительным окончанием указывает на южное направление или сторону; в контексте распределения мест служения «южная сторона» яснее, чем наречие «к югу».
- source_word: וּלְבָנָיו
  choice: а его сыновьям
  rationale: Сохраняется прямое значение «сыновья» и параллельное обозначение получателей следующего назначения; союз «а» естественно разграничивает два назначения.
- source_word: בֵּית הָאֲסֻפִּים
  choice: дом кладовых
  rationale: בֵּית передаёт здание или дом, а форма הָאֲסֻפִּים, связанная с идеей собирания и хранения, вероятно обозначает кладовые либо хранилища. «Дом кладовых» сохраняет конструкцию и не устраняет лексическую неоднозначность.
