base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/029.yaml
  text: For the Izharites[a], Chenaniah and his sons were assigned to the outside work over Israel, as officers and judges.
translation:
  language: ru
  text: Из рода ицгарян Кенания и его сыновья были назначены для внешней работы по делам Израиля — как должностные лица и судьи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть работы вне внутреннего служения при святилище; вероятно, это включало административные и судебные обязанности в Израиле.
    reason: Поясняется вероятный контекстуальный смысл выражения «внешняя работа», тогда как основной текст сохраняет буквальную формулировку и её широту.
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Из ицгарян
  rationale: Предлог לְ при названии рода вводит очередную группу в перечне; по-русски естественно передать принадлежность Кенании к роду Ицгара конструкцией «из ицгарян».
- source_word: כְּנַנְיָהוּ
  choice: Кенания
  rationale: Имя транслитерировано в форме, принятой в русской библейской традиции и достаточно близкой к древнееврейскому произношению.
- source_word: וּבָנָיו
  choice: и его сыновья
  rationale: בנים в данном родовом и служебном контексте обозначает сыновей, а не детей вообще.
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: были назначены на внешние дела
  rationale: מְלָאכָה означает работу или порученное дело, а הַחִיצוֹנָה — внешнее, находящееся вне внутреннего храмового служения. Глагол «были назначены» передаёт подразумеваемое распределение обязанностей в перечне.
- source_word: עַל יִשְׂרָאֵל
  choice: Израиля
  rationale: В сочетании с административными должностями עַל указывает на сферу ответственности и надзора; русская конструкция «дела Израиля» естественно выражает эту сферу, не превращая её в географическое указание.
- source_word: לְשֹׁטְרִים
  choice: надзирателями
  rationale: שֹׁטְרִים обозначает должностных лиц, осуществлявших административный надзор; «надзиратели» здесь яснее, чем современное широкое «чиновники».
- source_word: וּלְשֹׁפְטִים
  choice: и судьями
  rationale: Слово прямо обозначает лиц, исполнявших судебные обязанности.
theological_decisions:
- issue: Характер «внешних дел»
  choice: Не уточнять в основном тексте, что речь непременно идёт о служении вне святилища
  alternative: «дела вне святилища» или «внешнее храмовое служение»
  rationale: Сам еврейский текст говорит лишь о «внешней работе/деле»; контекст делает внехрамовые административные и судебные обязанности вероятными, но не выражает это уточнение прямо.
translation_notes:
  register: Современный литературный русский язык с достоинством хроникального перечня. Сохранена краткость стиха; «внешние дела» оставляет допустимую смысловую широту, а сноска поясняет наиболее вероятный контекст.
