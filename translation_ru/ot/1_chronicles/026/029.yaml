  terminology: «Кенания» сохранено как избранная в проекте передача имени. «Внешняя работа» буквально отражает מְלָאכָה הַחִיצוֹנָה, не внося в текст уточнение о святилище. «Должностные лица и судьи» различает административную и судебную роли.
