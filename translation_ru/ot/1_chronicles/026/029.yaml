  source_fidelity: 'Основной смысл передан верно: Кенания и его сыновья отнесены к группе ицгарян и поставлены на «внешнюю работу» в отношении Израиля, с административно-судебными функциями. Однако «внешние дела Израиля» слишком легко читается как просто внутренние государственные дела Израиля и не выражает достаточно ясно сферу поручения, передаваемую עַל־יִשְׂרָאֵל.'
