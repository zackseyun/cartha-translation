translation:
  language: ru
  text: Из завоеваний и из добычи они посвятили средства для укрепления дома Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Из войн (или: завоеваний) и из добычи они посвятили [это] для укрепления дома Яхве». В еврейском тексте прямое дополнение не названо; слово «средства» добавлено для ясности. Слово «добыча» можно также перевести как «трофеи» или «военная добыча».'
    reason: Указаны эллиптическое прямое дополнение и возможные переводы двух близких по контексту выражений без отождествления их значений.
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: из добытого на войнах
  rationale: Предлог מִן указывает на источник, а множественное מִלְחָמוֹת — на войны. В сочетании с эллиптическим объектом глагола естественный русский перевод передаёт имущество, добытое на войнах.
- source_word: וּמִן הַשָּׁלָל
  choice: и из трофеев
  rationale: שָׁלָל обозначает имущество, захваченное в войне; «трофеи» здесь звучит естественно и сохраняет военный контекст. Возможен вариант «добыча».
- source_word: הִקְדִּישׁוּ
  choice: они посвящали средства
  rationale: Hiphil от קדשׁ означает «посвящать, отделять как святыню». Прямое дополнение в еврейском не выражено; «средства» добавлено для ясности и соответствует контексту храмового имущества. Перфект в данном контексте передан несовершенным видом как обобщение повторявшихся посвящений перечисленными лицами.
- source_word: לְחַזֵּק
  choice: чтобы укреплять
  rationale: 'Инфинитив חזק выражает цель: сделать крепким, поддержать. «Укреплять» близко к форме оригинала и не сужает значение до одного лишь ремонта.'
- source_word: לְבֵית יְהוָה
  choice: дом Яхве
  rationale: Сохраняется библейская метафора «дом» для святилища и личное имя יהוה передаётся как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение укрепления дома Яхве
  choice: укреплять
  alternative: ремонтировать / поддерживать
  rationale: Перевод сохраняет более широкое значение חזק и не решает без достаточных оснований, шла ли речь именно о ремонте, содержании или ином укреплении храма.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формула «дом Яхве» сохраняет образ оригинала; добавление «средства» делает эллиптическую конструкцию понятной обычному читателю, а сноска раскрывает буквальную форму.
