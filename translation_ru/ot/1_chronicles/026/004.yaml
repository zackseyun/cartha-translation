  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: ru
  text: 'У Овед-Едома были сыновья: первенец Шемая, второй — Иехозавад, третий — Иоах, четвёртый — Сахар[a], пятый — Нетанел.'
  philosophy: optimal-equivalence
