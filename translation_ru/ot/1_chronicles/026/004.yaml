lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: У Овед-Эдома были сыновья
  rationale: Буквальная эллиптическая формула «и у Овед-Эдома — сыновья» естественно передаётся по-русски конструкцией обладания с добавленным глаголом «были».
- source_word: שְׁמַעְיָה הַבְּכוֹר
  choice: первенец Шемая
  rationale: «Первенец» сохраняет семейно-правовой оттенок בְּכוֹר, а не сводит выражение к простому порядковому числительному.
- source_word: יְהוֹזָבָד הַשֵּׁנִי
  choice: второй — Иегозавад
  rationale: Имя передано в принятой русской библейской форме; порядковое определение обозначает последовательность сыновей.
- source_word: יוֹאָח הַשְּׁלִשִׁי
  choice: третий — Иоах
  rationale: Прямая передача имени и порядкового определения.
- source_word: וְשָׂכָר הָרְבִיעִי
  choice: четвёртый — Сахар
  rationale: Еврейская форма имени שָׂכָר здесь отличается от имени Иссахар; русская транслитерация передаёт именно данную форму.
- source_word: וּנְתַנְאֵל הַחֲמִישִׁי
  choice: пятый — Нафанаил
  rationale: Использована укоренившаяся русская библейская форма еврейского имени נְתַנְאֵל.
