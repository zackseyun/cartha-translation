base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: ru
  text: и вес для золотых светильников и их золотых ламп — вес для каждого светильника[a] и его ламп; и для серебряных светильников — вес для каждого светильника и его ламп, в соответствии с назначением каждого светильника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по весу светильника и светильника»; далее также: «по назначению светильника и светильника». Такое повторение имеет распределительное значение: каждый светильник рассматривается отдельно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: вес
  rationale: В контексте перечня храмовой утвари существительное обозначает установленное количество материала по весу; «вес» точно и естественно передаёт этот смысл.
- source_word: מְנֹרוֹת
  choice: светильники
  rationale: מְנוֹרָה — подставка с лампами, а не отдельная лампа. В современном русском библейском употреблении «светильник» сохраняет различие между всей конструкцией и её лампами.
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: лампы
  rationale: נֵר обозначает отдельные лампы, установленные на светильнике; выбор отделяет их от самого светильника.
- source_word: זָהָב
  choice: золото / золотой
  rationale: Название материала передано прямо; повтор применительно к лампам сохранён как «золотых ламп».
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: вес для каждого светильника
  rationale: Повтор «светильник и светильник» имеет распределительное значение и естественно передаётся словом «каждый».
- source_word: וְלִמְנֹרוֹת הַכֶּסֶף
  choice: и для серебряных светильников
  rationale: Краткая русская конструкция ясно сохраняет параллель с золотыми светильниками.
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: в соответствии с назначением каждого светильника
  rationale: עֲבוֹדָה здесь указывает на службу, функцию или предусмотренное употребление предмета. «Назначение» естественно выражает функциональный смысл, не вводя лишней конкретизации.
