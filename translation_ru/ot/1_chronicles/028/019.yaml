base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: ru
  text: Всё это — в письменном виде, от руки Яхве; Его рука была на мне[a], и Он дал мне разумение всех работ по этому плану[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст сжат; возможно также: «Всё это Яхве дал мне понять в письменном виде; Его рука была на мне, и Он открыл мне все работы этого плана».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «по этому образцу»; возможны также значения «проект» и «устройство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Всё это
  rationale: 'Контекст придаёт כֹּל указательный смысл: речь идёт обо всём устройстве храма, описанном выше.'
- source_word: בִּכְתָב
  choice: в письменном виде
  rationale: Передаёт мысль о письменно зафиксированном откровении или документе, не сводя выражение просто к устному наставлению.
- source_word: מִיַּד יְהוָה
  choice: от руки Яхве
  rationale: Сохраняет конкретный древнееврейский образ непосредственного Божьего действия и передачи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном в еврейском тексте.
- source_word: עָלַי
  choice: бывшей на мне
  rationale: Сохраняет сжатый образ руки Яхве, пребывающей на Давиде, не устраняя синтаксическую напряжённость исходного текста.
- source_word: הִשְׂכִּיל
  choice: Он дал мне понять
  rationale: Порода hифиль выражает наделение пониманием или способность разумно исполнить порученное.
- source_word: כֹּל מַלְאֲכוֹת הַתַּבְנִית
  choice: как выполнить все работы по этому плану
  rationale: מְלָאכוֹת обозначает совокупность работ, а תַּבְנִית — показанный образец, устройство или проект; русская формулировка ясно связывает работы с осуществлением плана.
theological_decisions:
- issue: Синтаксическая связь עָלַי הִשְׂכִּיל
  choice: '«от руки Яхве, бывшей на мне: Он дал мне понять»'
  alternative: «Яхве дал мне понять всё это в письменном виде Своей рукой — все работы по плану»
  rationale: Еврейская фраза предельно сжата. Основной текст сохраняет и образ руки Яхве на Давиде, и Яхве как подразумеваемого субъекта הִשְׂכִּיל, а сноска отмечает возможную иную синтаксическую связь.
- issue: Значение תַּבְנִית
  choice: план
  alternative: образец; проект; устройство
  rationale: В контексте храмового строительства слово обозначает данный свыше план или образец. «План» естественно по-русски, но сноска сохраняет более широкий диапазон.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа «руки Яхве». Формулировка остаётся понятной неспециалисту, а сноски отражают синтаксическую неоднозначность и смысловой диапазон תַּבְנִית.
