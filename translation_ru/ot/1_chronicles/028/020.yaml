  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: ru
  text: 'И сказал Давид своему сыну Соломону: «Будь твёрд и мужествен и приступай к делу. Не бойся и не падай духом, потому что Яхве Бог, мой Бог, с тобой. Он не оставит тебя без поддержки[a] и не покинет тебя, пока не будет завершена вся работа по служению в доме Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он не выпустит тебя из рук»; еврейский глагол может означать, что Бог не ослабит своей поддержки и не даст человеку пасть.'
    reason: 'Лексическая альтернатива: форма от רפה допускает образ удерживания, наряду с общим смыслом неослабевающей поддержки.'
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: Будь твёрд и мужествен
  rationale: Устойчивая пара повелительных форм призывает Соломона к внутренней стойкости и решимости; перевод сохраняет оба оттенка и звучит естественно по-русски.
- source_word: וַעֲשֵׂה
  choice: и приступай к делу
  rationale: Буквально «и делай»; в контексте речь идёт о порученной работе над храмом. Выражение передаёт прямой призыв действовать, не вводя лишнего объекта.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Не бойся и не падай духом
  rationale: Первый глагол обозначает страх, второй — утрату решимости, смятение или внутренний надлом. Современная русская формулировка сохраняет различие между ними.
- source_word: יְהוָה אֱלֹהִים אֱלֹהַי
  choice: Яхве Бог, мой Бог
  rationale: Сохранены личное имя Бога и подчёркнутое еврейским текстом приложение «мой Бог».
- source_word: עִמָּךְ
  choice: с тобой
  rationale: 'Именное предложение выражает настоящее заверение: Бог уже пребывает с Соломоном; связка естественно подразумевается в русском настоящем времени.'
- source_word: לֹא יַרְפְּךָ
  choice: Он не оставит тебя без поддержки
  rationale: Глагол רפה в каузативной форме здесь передаёт мысль о том, что Бог не ослабит поддержки и не выпустит Соломона. Выбор отличает эту фразу от следующего «не покинет» и сохраняет образный оттенок через примечание.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: и не покинет тебя
  rationale: עזב означает оставить или покинуть. Формулировка ясна современному читателю и сохраняет торжественный характер заверения.
- source_word: עַד לִכְלוֹת
  choice: пока не будет завершена
  rationale: Инфинитив указывает на завершение как предел применительно к порученной работе; пассивная конструкция естественна по-русски.
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: вся работа по служению в доме Яхве
  rationale: Перевод передаёт оба существительных — «работа» и «служение» — и делает плотную цепочку сопряжённых форм понятной без излишнего истолкования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Отношение заверения о Божьем присутствии к сроку выполнения работы
  choice: Сохранить конструкцию «пока не будет завершена» без вывода, будто после этого Божье присутствие прекратится
  alternative: Перефразировать как безусловное обещание без временной границы
  rationale: Еврейское עַד относится к гарантии Божьей помощи на всём протяжении поручения. Перевод сохраняет формальную временную конструкцию и не разрешает сверх текста вопрос о том, что следует после завершения работы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён там, где буквальное воспроизведение еврейской цепочки было бы тяжеловесным; личное имя Яхве и повтор «Бог, мой Бог» сохранены.
