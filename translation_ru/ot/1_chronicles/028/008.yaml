  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: ru
  text: 'И теперь перед глазами всего Израиля — собрания Яхве — и так, чтобы слышал Бог наш: соблюдайте и исследуйте все заповеди Яхве, вашего Бога, чтобы вы овладели доброй землёй[a] и оставили её в наследство вашим сыновьям[b] после вас навеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы вы наследовали добрую землю». Еврейский глагол может означать как наследование, так и овладение или обладание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыновьям»; в еврейском тексте употреблено существительное мужского рода во множественном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительную силу וְ и переход к заключительному призыву.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: пред глазами всего Израиля
  rationale: Передаёт буквальный образ и публичный характер обращения.
- source_word: קְהַל יְהוָה
  choice: собрания Яхве
  rationale: קהל обозначает собранную общину; «собрание» современно и не вносит узкоконфессионального оттенка.
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: и пред лицом нашего Бога
  rationale: Еврейская идиома буквально означает «в ушах нашего Бога»; по-русски «пред лицом» естественно выражает, что Бог слышит и выступает свидетелем, хотя образ слуха становится менее буквальным.
- source_word: שִׁמְרוּ וְדִרְשׁוּ
  choice: соблюдайте и усердно ищите исполнения
  rationale: «Соблюдайте» естественно сочетается с заповедями, а развёрнутая передача דרש показывает деятельное стремление следовать им, а не только интеллектуальное изучение.
- source_word: כָּל מִצְוֺת
  choice: всех заповедей
  rationale: Прямо передаёт сочетание כל с множественным числом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя, а не заменяет его титулом.
- source_word: תִּירְשׁוּ
  choice: владели
  rationale: ירשׁ здесь допускает значения наследования и обладания; в данном контексте владение землёй естественно выражает продолжение её заветного удержания.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: этой доброй землёй
  rationale: «Добрая земля» сохраняет традиционный заветный эпитет; указательное «этой» уместно в ситуации речи о уже известной земле.
- source_word: וְהִנְחַלְתֶּם
  choice: и передали её в наследство
  rationale: Каузативная форма נחל означает сделать последующее поколение наследниками; русская формулировка естественно передаёт этот смысл.
- source_word: לִבְנֵיכֶם
  choice: своим сыновьям
  rationale: Сохраняет мужской множественный термин בנים без необоснованного обобщения до «детей».
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Кратко и возвышенно передаёт продолжительность, выраженную עַד עוֹלָם.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Связь владения землёй с соблюдением заповедей
  choice: сохранена целевая конструкция «чтобы»
  alternative: переформулировать как безусловное обещание
  rationale: לְמַעַן связывает призыв соблюдать заповеди с последующим владением землёй; перевод не должен устранять заложенное в тексте напряжение между даром земли и верностью завету.
- issue: Значение בנים
  choice: сыновьям
  alternative: детям
  rationale: Исходное существительное имеет форму мужского множественного числа; более широкая передача возможна по употреблению, но здесь сохранена формальная гендерная конкретность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром. Синтаксис сохраняет публичный и заветный характер призыва. Формула «пред глазами» намеренно удерживает исходный образ; «пред лицом нашего Бога» выбрано как естественная русская передача идиомы слуха.
