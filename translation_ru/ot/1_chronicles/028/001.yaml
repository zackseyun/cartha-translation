source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: ru
  text: 'Давид собрал в Иерусалиме всех руководителей Израиля: глав племён, начальников подразделений, служивших царю, тысяченачальников и сотников, распорядителей всего имущества и скота царя и его сыновей, а также придворных[a], могучих воинов и всех доблестных воинов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евнухов»; еврейское слово может обозначать как евнухов в буквальном смысле, так и царских придворных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: собрал
  rationale: Каузативная форма глагола קהל обозначает созыв официального собрания; «собрал» естественно передаёт это по-русски.
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: всех руководителей Израиля
  rationale: שַׂר имеет широкий диапазон значений — руководитель, начальник, должностное лицо; здесь это обобщающее обозначение последующего перечня.
- source_word: שָׂרֵי הַשְּׁבָטִים
  choice: глав племён
  rationale: «Главы племён» — естественное русское обозначение их руководителей; варьирование передачи שַׂר соответствует конкретному контексту.
- source_word: שָׂרֵי הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: начальников подразделений, служивших царю
  rationale: מַחְלְקוֹת — организованные отряды или подразделения; причастие относится к подразделениям, а не к начальникам, что сохранено грамматически.
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: тысяченачальников и сотников
  rationale: Устоявшиеся и понятные русские наименования военно-административных начальников над тысячами и сотнями.
- source_word: רְכוּשׁ וּמִקְנֶה
  choice: имущества и скота
  rationale: רְכוּשׁ охватывает имущество и богатство, а מִקְנֶה — домашний скот в широком смысле.
- source_word: שָׂרֵי כָל רְכוּשׁ וּמִקְנֶה
  choice: распорядителей всего имущества и скота
  rationale: В данном хозяйственно-административном контексте שָׂר обозначает ответственных управляющих; «распорядители» не предполагает владения этим имуществом.
- source_word: לַמֶּלֶךְ וּלְבָנָיו
  choice: царя и его сыновей
  rationale: Дательный предлог выражает принадлежность или отнесённость; русский родительный естественно передаёт эту связь без избыточного пояснения.
- source_word: הַסָּרִיסִים
  choice: придворных
  rationale: סָרִיסִים может обозначать евнухов либо царских придворных служащих. В административном перечне функциональное значение вероятно, но буквальная альтернатива сохранена в сноске.
- source_word: הַגִּבּוֹרִים
  choice: могучих воинов
  rationale: В книгах Паралипоменон слово часто обозначает выдающихся воинов Давида; «могучие воины» передаёт и силу, и военный контекст.
- source_word: כָל גִּבּוֹר חָיִל
  choice: всех доблестных воинов
  rationale: Естественная современная передача идиомы, обозначающей людей военной силы, способности и доблести.
