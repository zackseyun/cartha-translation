base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/006.yaml
  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: ru
  text: 'И Он сказал мне: «Твой сын Соломон — он построит Мой дом и Мои дворы, потому что Я избрал его Себе сыном, и Я буду ему Отцом».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более свободно: «Я избрал его, чтобы он был Моим сыном, и Я буду его Отцом».'
    reason: Лексико-синтаксический вариант передачи двойной конструкции с לְ.
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: И Он сказал мне
  rationale: 'Последовательная форма וַיֹּאמֶר передаёт повествовательное прошедшее время, а לִי обозначает адресата: «мне».'
- source_word: שְׁלֹמֹה בִנְךָ הוּא
  choice: Твой сын Соломон — он
  rationale: Порядок слов естественен для современного русского языка, а отдельное הוּא сохранено посредством конструкции с тире и местоимением, подчёркивающей, что строителем будет именно Соломон.
- source_word: יִבְנֶה בֵיתִי
  choice: построит Мой дом
  rationale: Буквальное «Мой дом» сохраняет храмовый и заветный образ еврейского בֵיתִי; в контексте ясно, что речь идёт о храме.
- source_word: וַחֲצֵרוֹתָי
  choice: и Мои дворы
  rationale: В храмовом контексте חֲצֵרוֹת обозначает ограждённые храмовые дворы; «дворы» — точный и привычный русский эквивалент.
- source_word: כִּי בָחַרְתִּי בוֹ
  choice: потому что Я избрал его
  rationale: כִּי вводит основание сказанного, а перфект בָחַרְתִּי выражает совершённый Божий выбор с сохраняющейся силой.
- source_word: לִי לְבֵן
  choice: Себе в сыновья
  rationale: 'Формула сохраняет оба отношения, выраженные предлогом לְ: избрание «Себе» и сыновний статус; множественная форма «в сыновья» является устойчивым русским оборотом и не означает нескольких сыновей.'
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: и буду ему Отцом
  rationale: Естественная русская конструкция близко воспроизводит буквальное «буду ему отцом» и сохраняет заветную взаимность формулы без добавления сравнительного «как».
theological_decisions:
- issue: Отцовско-сыновняя формула отношений Бога и Соломона
  choice: «Я избрал его Себе в сыновья и буду ему Отцом»
  alternative: «Я избрал его, чтобы он был Моим сыном, и Я буду его Отцом»
  rationale: Перевод прямо сохраняет царско-заветный язык сыновства и отцовства, не ослабляя его до одной лишь функции и не привнося в непосредственный контекст более поздние богословские выводы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прописные местоимения и наименования «Мой», «Я», «Себе», «Отцом» обозначают Бога в соответствии с принятой русской библейской издательской практикой; тире перед «он» передаёт эмфазу самостоятельного местоимения הוּא.
