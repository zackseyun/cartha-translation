base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: ru
  text: для подразделений священников и левитов[a], для всей работы, связанной со служением в доме Яхве, и для всей утвари для служения в доме Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смен священников и левитов».'
    reason: Лексема מַחְלְקוֹת может обозначать служебные группы, исполнявшие обязанности по очереди.
  - marker: b
    text: 'Или: «для всех принадлежностей для служения в доме Яхве».'
    reason: Слово כְּלֵי имеет широкое значение и включает не только сосуды, но и другие храмовые предметы и орудия.
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: подразделений
  rationale: Слово обозначает организованные группы священников и левитов, между которыми распределялись обязанности. «Подразделения» передаёт административный смысл понятнее, чем традиционное «череды».
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Обычное современное обозначение израильского священства; определённость в русском контексте не требует отдельного выражения.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Устоявшееся русское наименование племенной и служебной группы.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: работ по служению
  rationale: Сочетание сохраняет различие между широким понятием работы и храмовым служением, не вводя поздней церковной терминологии.
- source_word: בֵּית יְהוָה
  choice: доме Яхве
  rationale: Буквально передано «дом Яхве»; имя יהוה воспроизведено как «Яхве», а не заменено титулом.
- source_word: כְּלֵי עֲבוֹדַת
  choice: утвари, употребляемой при служении
  rationale: כְּלֵי охватывает различные священные предметы и принадлежности, не только сосуды. Формулировка естественно выражает их назначение в русском языке.
- source_word: לְכָל
  choice: для всех / для всей
  rationale: Повтор предлога לְ формирует перечень того, что было предусмотрено ранее упомянутым планом; русское «для» сохраняет эту связь.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не превращает его в титул.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальная конструкция без прописной буквы отражает синтаксическую зависимость стиха от предшествующего перечисления. Повтор «для» сохранён как структурная особенность исходного текста; тяжеловесная буквальность «утварь служения» заменена естественным оборотом без потери смысла.
