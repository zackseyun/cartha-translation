base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: ru
  text: 'и план всего того, что было у него в Духе: для дворов дома Господа, для всех окружающих помещений, для хранилищ дома Божьего и для хранилищ святынь.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всего того, что было у него в духе», то есть в мыслях или сердце Давида.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַבְנִית
  choice: чертёж
  rationale: В контексте храмового строительства слово обозначает архитектурный план или проект; «чертёж» естественно связывает этот стих с переданными Давидом указаниями предыдущего стиха.
- source_word: כֹּל אֲשֶׁר הָיָה בָרוּחַ עִמּוֹ
  choice: всего, что было у него от Духа
  rationale: Формулировка передаёт вероятную мысль о божественном источнике замысла, но не делает её более конкретной, чем позволяет контекст; возможное указание на собственный дух Давида сохранено в сноске.
- source_word: לְחַצְרוֹת בֵּית יְהוָה
  choice: дворов дома Господа
  rationale: Сохраняется архитектурное значение «дворы» и буквальный библейский образ «дом Господа».
- source_word: לְשָׁכוֹת סָבִיב
  choice: всех помещений вокруг
  rationale: «Помещения» понятно современному читателю и охватывает комнаты или палаты, расположенные вокруг храмового комплекса.
- source_word: אֹצְרוֹת
  choice: хранилищ
  rationale: Слово может обозначать сокровищницы или кладовые; нейтральное «хранилища» подходит как для храмового имущества вообще, так и для святынь.
- source_word: בֵּית הָאֱלֹהִים
  choice: дома Божьего
  rationale: Сохраняет параллель с выражением «дом Господа» и не заменяет исходную метафору более истолковывающим словом «храм».
- source_word: הַקֳּדָשִׁים
  choice: святынь
  rationale: В данном контексте имеются в виду священные или посвящённые предметы, хранившиеся при храме; «святыни» передаёт это кратко и естественно.
theological_decisions:
- issue: Значение בָרוּחַ עִמּוֹ
  choice: «что было у него от Духа» — вероятное указание на Божий Дух как источник замысла
  alternative: «что было у него в духе», то есть в мыслях или сердце самого Давида
  rationale: Контекст богоданного храмового замысла, особенно стих 19, благоприятствует указанию на Божий Дух. Однако необычная еврейская конструкция допускает антропологическое понимание, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный. Сохранены библейские выражения «дом Господа» и «дом Божий»; архитектурные термины переданы понятно для неспециалиста.
