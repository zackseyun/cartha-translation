source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: ru
  text: А ты, Соломон, сын мой, знай Бога своего отца и служи Ему всем сердцем и с готовой душой, потому что Яхве исследует все сердца и понимает всякую направленность мыслей. Если будешь искать Его, Он даст тебе найти Себя[a], но если оставишь Его, Он навсегда отвергнет тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он будет найден тобой». Еврейский глагол имеет пассивно-возвратную форму.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он навсегда отринет тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: знай
  rationale: Повелительная форма призывает Соломона не просто располагать сведениями о Боге, а лично знать и признавать Его; краткое «знай» сохраняет эту смысловую ёмкость.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Бога своего отца
  rationale: Передаёт конструкцию принадлежности и подчёркивает преемственность между верой Давида и призванием Соломона.
- source_word: וְעָבְדֵהוּ
  choice: и служи Ему
  rationale: Глагол охватывает как поклонение, так и преданное послушание, поэтому «служи» точнее более узкого «поклоняйся».
- source_word: בְּלֵב שָׁלֵם
  choice: всем сердцем
  rationale: Естественное русское выражение передаёт полноту, цельность и неразделённость сердца, не создавая значения безгрешного совершенства.
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: с готовой душой
  rationale: Сохраняет образ души как внутреннего существа человека и значение готовности, желания и добровольности.
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: потому что Яхве исследует все сердца
  rationale: В данном контексте דרשׁ означает исследовать или испытывать; «исследует» ясно показывает совершенное знание Богом человеческого сердца.
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: и понимает всякое побуждение мыслей
  rationale: יֵצֶר обозначает внутреннее формирование, склонность или намерение; «побуждение мыслей» сохраняет направленность на скрытые мотивы, не сужая смысл до уже принятого решения.
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: если будешь искать Его
  rationale: Здесь דרשׁ означает искать Бога в преданности и зависимости от Него; несовершенный вид естественно выражает условное направленное действие.
- source_word: יִמָּצֵא לָךְ
  choice: Он даст тебе найти Себя
  rationale: Русская идиома передаёт пассивно-возвратный оттенок нифаля и сохраняет мысль, что Бог становится доступен ищущему, не превращая фразу лишь в человеческое достижение.
- source_word: תַּעַזְבֶנּוּ
  choice: если оставишь Его
  rationale: В контексте заветной верности «оставишь» означает отказ от преданности Богу; это современное и ясное соответствие торжественному «покинешь/оставишь».
- source_word: יַזְנִיחֲךָ לָעַד
  choice: Он навсегда отвергнет тебя
  rationale: זנח в породе хифиль выражает решительное отвержение; перевод сохраняет суровость предупреждения и прямое значение לָעַד — «навсегда».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой современной русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Различение «сердца» и «души»
  choice: 'Сохранены оба антропологических образа: «всем сердцем и с готовой душой».'
  alternative: «с искренним сердцем и охотно» или «с совершенным сердцем и готовым разумом»
  rationale: Еврейский текст различает לֵב и נֶפֶשׁ и тем самым описывает цельную внутреннюю преданность; сведение второго слова к «разуму» или наречию обеднило бы образ.
- issue: Доступность Бога в יִמָּצֵא לָךְ
  choice: «Он даст тебе найти Себя»
  alternative: «Он будет найден тобой» или «ты найдёшь Его»
  rationale: Формулировка сохраняет пассивно-возвратную форму и напряжение между человеческим поиском и Божьим самооткрытием, не закрепляя частную богословскую систему.
- issue: Суровость предупреждения завета
  choice: «Он навсегда отвергнет тебя»
  alternative: «Он навсегда отринет тебя» или «Он навсегда отбросит тебя»
  rationale: Перевод не смягчает безусловно звучащее предупреждение Давида и не пытается согласовать его с более поздними доктринальными построениями.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой отцовской речи. Синтаксис сделан ясным для чтения вслух; традиционные библейские образы «сердце» и «душа» сохранены, но архаизмы вроде «ведай», «взыщешь» и «отринет» не внесены в основной текст. Местоимения, относящиеся к Богу, написаны с прописной буквы как допустимая русская издательская норма.
