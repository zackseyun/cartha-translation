  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: ru
  text: 'Но Бог сказал мне: «Ты не построишь дом для Моего имени[b], потому что ты человек войны[a] и пролил кровь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек войн».'
    reason: lexical_alternative
  - marker: b
    text: «Дом для Моего имени» — храм как место, связанное с Божьим именем и присутствием.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: Но Бог
  rationale: 'Союз וְ в контексте имеет противительный оттенок: Давид хотел построить храм, но Бог не позволил ему. «Бог» прямо передаёт אֱלֹהִים как обозначение Бога Израиля.'
- source_word: אָמַר לִי
  choice: сказал мне
  rationale: Прямое и естественное соответствие еврейской конструкции с глаголом אמר и местоименным дополнением.
- source_word: לֹא תִבְנֶה
  choice: Ты не построишь
  rationale: Форма сохраняет торжественный характер Божьего запрета и отчасти его смысловую напряжённость между запрещением и объявлением того, чего Давиду не суждено сделать.
- source_word: בַיִת
  choice: дом
  rationale: Сохраняет буквальный образ еврейского текста; по контексту речь идёт о храме, но замена на «храм» устранила бы исходную метафору.
- source_word: לִשְׁמִי
  choice: для Моего имени
  rationale: Прямо передаёт выражение о святилище, связанном с Божьим именем и присутствием, не подменяя его толкованием.
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно выражает причинную связь: далее названа причина, по которой Давид не должен строить дом.'
- source_word: אִישׁ מִלְחָמוֹת
  choice: человек войны
  rationale: Естественное по-русски выражение, близкое к буквальному «человек войн» и указывающее на постоянную вовлечённость Давида в войны. Буквальное множественное число отмечено в сноске.
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: и пролил кровь
  rationale: Передаёт устойчивое еврейское выражение דמים שפך естественным русским оборотом. Единственное число «кровь» требуется русской идиоматикой, хотя в еврейском употреблено множественное число.
theological_decisions:
- issue: Причина, по которой Давиду не позволено строить храм
  choice: Войны Давида и пролитая им кровь представлены как названная Богом причина запрета.
  alternative: Понимать кровопролитие либо как нравственно виновное насилие, либо исключительно как обрядовую или символическую непригодность для роли храмостроителя.
  rationale: Сам стих не уточняет, было ли кровопролитие греховным, ритуально оскверняющим или просто несовместимым с ролью строителя храма. Перевод не разрешает эту богословскую напряжённость за исходный текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены исходные образы «дом» и «для Моего имени»; неестественное русское «человек войн» вынесено в сноску. Маркеры сносок поставлены непосредственно после поясняемых выражений.
