    issue: Сфера «для всякого служения» перенесена в характеристику добровольца.
    rationale: В «искусный во всяком деле» слова «во всяком деле» читаются как область, в которой искусен работник. В еврейском לְכָל עֲבוֹדָה относится к его наличию/готовности для любого служения, тогда как בַּחָכְמָה характеризует работника.
