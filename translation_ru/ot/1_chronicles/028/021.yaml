  rationale: Сохранены все смысловые компоненты исходного текста и существующие сноски. «Наделённый мастерством» естественно выражает практический смысл חָכְמָה, а отдельное «для всякого служения» восстанавливает сферу лְכָל עֲבוֹדָה. Никакого богословского или конфессионального уточнения не добавлено.
