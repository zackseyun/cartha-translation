base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: ru
  text: Вот череды священников и левитов для всякого служения в доме Бога. С тобой во всякой работе будет каждый доброволец, наделённый мастерством, для всякого служения[a]; начальники же и весь народ будут исполнять все твои распоряжения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый доброволец в мудрости — для всякого служения»; здесь «мудрость» означает также практическое умение и мастерство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для всех твоих слов», то есть готовы выполнить все твои указания.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Вот
  rationale: Сохраняет указательную и привлекающую внимание функцию еврейского оборота, оставаясь естественным в современном русском языке.
- source_word: מַחְלְקוֹת
  choice: череды
  rationale: Обозначает организованные группы священников и левитов, служившие по установленной очереди; «череды» сохраняет институциональный смысл и библейскую торжественность.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священников и левитов
  rationale: Прямо передаёт названия двух отдельных групп храмовых служителей.
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: для всякого служения в доме Бога
  rationale: Сохраняет широкий охват служения и конкретное выражение «дом Бога», не заменяя его толковательным «храм».
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: С тобой во всякой работе
  rationale: Передаёт поддержку Соломону во всём практическом труде, связанном с возведением и устройством дома Бога.
- source_word: לְכָל נָדִיב
  choice: всякий доброволец
  rationale: Передаёт человека, побуждаемого собственной готовностью, и сохраняет грамматическое единственное число исходного текста.
- source_word: בַּחָכְמָה ... לְכָל עֲבוֹדָה
  choice: искусный во всяком деле
  rationale: В данном ремесленном контексте חָכְמָה означает практическое умение и мастерство; формулировка естественна по-русски, а примечание сохраняет буквальный образ мудрости.
- source_word: וְהַשָּׂרִים
  choice: начальники же
  rationale: Передаёт царских руководителей и должностных лиц без подразумеваемого словом «князья» наследственного титула.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: Прямо сохраняет всеобщность обещанной поддержки.
- source_word: לְכָל דְּבָרֶיךָ
  choice: будут исполнять все твои распоряжения
  rationale: Передаёт контекстуальный смысл готовности действовать согласно всем словам и указаниям Соломона; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Конкретное обозначение בֵּית הָאֱלֹהִים
  choice: дом Бога
  alternative: храм
  rationale: Выбрана исходная конкретная метафора; контекст храма ясен, но не подменяет формулировку еврейского текста.
- issue: Характер готовых работников в לְכָל נָדִיב
  choice: всякий доброволец
  alternative: всякий человек с готовым сердцем
  rationale: Перевод сохраняет добровольную готовность, не приписывая ей более узкого богословского содержания; единственное число соответствует форме оригинала.
- issue: Смысл חָכְמָה в рабочем контексте
  choice: искусный
  alternative: мудрый
  rationale: Здесь мудрость проявляется как практическое мастерство. Перевод не отрицает связи с мудростью, которая указана в примечании, но делает непосредственный смысл понятным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. «Череды» сохраняет историко-храмовую специфику, а синтаксис разбит на два предложения ради ясности без устранения смысловых связей оригинала.
