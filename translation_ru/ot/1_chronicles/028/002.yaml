  text: וַ/יָּ֨קָם דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ עַל רַגְלָ֔י/ו וַ/יֹּ֕אמֶר שְׁמָע֖וּ/נִי אַחַ֣/י וְ/עַמִּ֑/י אֲנִ֣י עִם לְבָבִ֡/י לִ/בְנוֹת֩ בֵּ֨ית מְנוּחָ֜ה לַ/אֲר֣וֹן בְּרִית יְהוָ֗ה וְ/לַ/הֲדֹם֙ רַגְלֵ֣י אֱלֹהֵ֔י/נוּ וַ/הֲכִינ֖וֹתִי לִ/בְנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: ru
  text: 'Тогда царь Давид поднялся на ноги и сказал: «Послушайте меня, братья мои[a] и народ мой! У меня было на сердце построить место покоя[b] для ковчега завета Яхве и для подножия ног нашего Бога[c], и я сделал приготовления к строительству».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сородичи мои». В еврейском тексте буквально: «братья мои» — обращение в форме мужского рода, употреблённое перед собранием народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дом покоя». Речь идёт о постоянном месте пребывания ковчега.'
    reason: lexical_alternative
  - marker: c
    text: 'Ковчег связывается с подножием присутствующего среди Израиля Бога; ср. Псалом 132:7 (в традиционной русской нумерации — 131:7). При этом еврейский текст здесь буквально говорит: «для ковчега… и для подножия…».'
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם ... עַל רַגְלָיו
  choice: поднялся на ноги
  rationale: Естественно передаёт сочетание глагола קום с выражением עַל רַגְלָיו и сохраняет действие повествования.
- source_word: שְׁמָעוּנִי
  choice: Послушайте меня
  rationale: Императив שמע с суффиксом первого лица; современная и уместная для торжественного публичного обращения формулировка.
- source_word: אַחַי וְעַמִּי
  choice: братья мои и народ мой
  rationale: Сохраняет буквальное родственное обращение во множественном числе и параллельное обозначение народа.
- source_word: אֲנִי עִם לְבָבִי
  choice: У меня было на сердце
  rationale: Естественная русская передача еврейского идиоматического выражения о внутреннем намерении, без усиления до твёрдого решения.
- source_word: בֵּית מְנוּחָה
  choice: дом покоя
  rationale: Сохраняет оба элемента выражения — «дом» и «покой» — и его образный, культовый характер.
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: для ковчега завета Яхве
  rationale: Ясно передаёт цепочку сопряжённых существительных и сохраняет личное имя יְהוָה в форме «Яхве».
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: и для подножия ног нашего Бога
  rationale: Сохраняет метафору и соединительный союз, не превращая неявную связь между ковчегом и подножием в явное отождествление.
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: и я сделал приготовления к строительству
  rationale: Передаёт подготовительное значение Hiphil הכין и последующий инфинитив, не добавляя в основной текст отсутствующее местоименное дополнение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерационная форма сохраняет личное имя и отличает его от титула.
- issue: Связь ковчега с «подножием ног нашего Бога»
  choice: 'Сохранить сочинение: «для ковчега… и для подножия…»'
  alternative: 'Передать как явное приложение: «для ковчега…, то есть подножия…»'
  rationale: Контекст позволяет понимать ковчег как подножие, однако сама грамматика стиха использует союз וְ и не содержит явного показателя пояснительного приложения; перевод сохраняет эту смысловую напряжённость.
- issue: Обращение אַחַי
  choice: братья мои
  alternative: сородичи мои; братья и сёстры
  rationale: Мужская форма множественного числа передана прямо; возможный более широкий охват собрания отмечен в сноске, а не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественностью, соответствующей царской речи. Синтаксис сделан ясным для обычного читателя, при этом сохранены ключевые образы «дом покоя» и «подножие ног», а не заменены толкованием.
