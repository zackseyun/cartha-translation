  text: וּ/מִ/כָּ֨ל בָּנַ֔/י כִּ֚י רַבִּ֣ים בָּנִ֔ים נָ֥תַן לִ֖/י יְהוָ֑ה וַ/יִּבְחַר֙ בִּ/שְׁלֹמֹ֣ה בְנִ֔/י לָ/שֶׁ֗בֶת עַל כִּסֵּ֛א מַלְכ֥וּת יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: ru
  text: И из всех моих сыновей — ведь Господь дал мне много сыновей — Он избрал моего сына Соломона, чтобы тот восседал на престоле царства Господня над Израилем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на престоле царства Господа». Такое выражение подчёркивает, что царство над Израилем в конечном счёте принадлежит Господу, хотя земным царём становится Соломон.'
    reason: theological_clarification
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: И из всех моих сыновей
  rationale: Предлог מִן при глаголе выбора указывает на выделение одного из группы; «из всех» естественно передаёт этот смысл по-русски.
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: ведь Господь дал мне много сыновей
  rationale: כִּי вводит пояснительное замечание; «ведь» сохраняет пояснительную функцию. Перфект נָתַן передан обычным русским прошедшим временем.
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: Он избрал моего сына Соломона
  rationale: При בחר предлог ב отмечает избранного. «Избрал» уместно в возвышенном повествовательном регистре, а порядок слов естественен для русского языка.
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: чтобы тот воссел на престоле
  rationale: В контексте престолонаследия ישב означает занятие престола и царствование. «Воссел» ясно выражает интронизацию; «тот» устраняет возможную двусмысленность субъекта инфинитива.
- source_word: מַלְכוּת יְהוָה
  choice: царства Господня
  rationale: 'Сохранена конструкция принадлежности: царство принадлежит Господу, а не просто Израилю или дому Давида.'
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: עַל в сочетании с престолом и царством обозначает власть над народом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господь
  alternative: Яхве
  rationale: В основном тексте употреблена укоренённая в русской библейской традиции благоговейная передача «Господь»; она не смешивается с обычным «господин» благодаря прописной букве.
- issue: Смысл выражения כִּסֵּא מַלְכוּת יְהוָה
  choice: престол царства Господня
  alternative: царский престол / престол Израильского царства
  rationale: Полная конструкция сохранена, поскольку еврейский текст подчёркивает, что царство в конечном счёте принадлежит Господу, хотя земным царём будет Соломон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Скобочная пояснительная часть оригинала передана тире. Форма «Господня» сохраняет достоинство стиля, оставаясь понятной современному читателю.
