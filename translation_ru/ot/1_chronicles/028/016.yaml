  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: ru
  text: и вес золота для столов, на которых раскладывают хлебы[a], — для каждого стола, и серебро для серебряных столов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «столов расположения (в ряд)». Вероятно, имеются в виду столы для хлебов, разложенных перед Господом; традиционно: «столы хлебов предложения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: по весу
  rationale: В перечне храмовых принадлежностей речь идёт о весовом количестве золота, назначенном для изготовления каждого предмета. Оборот «по весу» прямо передаёт еврейское существительное и естественно связывается с продолжением предыдущего перечня.
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: столы разложения
  rationale: Сочетание буквально обозначает столы, связанные с упорядоченным разложением; в данном культовом контексте подразумеваются разложенные перед Господом хлебы. Основной текст сохраняет краткость и некоторую неявность еврейского выражения, а пояснение вынесено в сноску.
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: для каждого стола
  rationale: Повтор существительного в еврейском языке имеет распределительное значение. Русское «для каждого стола» естественно и точно передаёт назначение отдельного количества золота каждому столу.
- source_word: כֶּסֶף
  choice: серебро
  rationale: Это прямое обозначение материала, противопоставленного золоту.
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: серебряные столы
  rationale: Конструкция естественно обозначает столы из серебра либо столы, выделенные как серебряные; краткий русский эквивалент сохраняет эту формальную неоднозначность.
