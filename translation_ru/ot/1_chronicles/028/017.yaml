base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/017.yaml
  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: ru
  text: и вилки, чаши для кропления и кувшины[a] из чистого золота; и для золотых чаш — по весу для каждой чаши[b], и для серебряных чаш — по весу для каждой чаши.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сосуды для возлияний»; точный вид этих сосудов неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для чаши и чаши» — еврейский способ сказать, что для каждой отдельной чаши был установлен свой вес. То же подразумевается и в следующей фразе о серебряных чашах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: вилки
  rationale: Существительное обозначает вилкообразные храмовые принадлежности; «вилки» ясно и конкретно передаёт предмет без архаизма.
- source_word: מִּזְרָקוֹת
  choice: тазы
  rationale: Термин обозначает ритуальные сосуды, употреблявшиеся при жертвоприношениях. «Тазы» отличает их от כְפוֹרֵי, переданного ниже словом «чаши».
- source_word: קְּשָׂוֹת
  choice: кувшины
  rationale: Вероятно, имеются в виду сосуды для возлияния или разливания; «кувшины» естественно передаёт эту функцию, хотя точная форма сосуда не вполне ясна.
- source_word: זָהָב טָהוֹר
  choice: из чистого золота
  rationale: Фраза относится к перечисленным принадлежностям и естественно указывает материал, из которого они изготовлены.
- source_word: כְפוֹרֵי
  choice: чаши
  rationale: В данном перечне слово обозначает чашеобразные сосуды; этот перевод также позволяет отличить их от ранее названных тазов.
- source_word: בְּמִשְׁקָל
  choice: вес каждой чаши
  rationale: Оборот указывает на установленный вес драгоценного металла для каждого отдельного сосуда; по-русски это естественно выражается через вес каждой чаши.
- source_word: לִכְפוֹר וּכְפוֹר
  choice: каждой чаши
  rationale: 'Повтор существительного в еврейском имеет распределительное значение: вес назначался каждому сосуду отдельно. Буквальное повторение по-русски было бы неестественным.'
- source_word: כֶּסֶף
  choice: серебряных
  rationale: Прилагательная форма естественно передаёт материал сосудов в противопоставлении золотым чашам.
