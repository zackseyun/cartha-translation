base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: ru
  text: 'Теперь обрати внимание[a]: ведь Яхве избрал тебя, чтобы построить дом для святилища[b]. Будь твёрд и сделай это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теперь смотри», «учти же». Повеление призывает внимательно осмыслить сказанное, а не только посмотреть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дом для святилища»; то есть здание храма как святое место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: Итак, обрати внимание
  rationale: Императив ראה здесь идиоматически призывает не просто посмотреть, а осознанно внять сказанному; עתה усиливает непосредственность наставления. Русское «Итак, обрати внимание» естественно передаёт эту функцию.
- source_word: כִּי
  choice: ':'
  rationale: В данном контексте כִּי вводит основание призыва. В русском причинно-пояснительная связь естественно выражается двоеточием без обязательного союза «ведь» или «потому что».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בָּחַר בְּךָ
  choice: избрал тебя
  rationale: בחר обозначает выбор для порученного служения; «избрал» сохраняет торжественный характер наставления и завершённость выбора.
- source_word: לִבְנוֹת בַּיִת לַמִּקְדָּשׁ
  choice: чтобы построить дом для святилища
  rationale: Сохранены оба существительных исходного текста — «дом» и «святилище», — без сведения выражения к одному слову «храм».
- source_word: חֲזַק
  choice: Будь твёрд
  rationale: Императив призывает к внутренней силе и решимости. «Будь твёрд» естественно звучит в русском и не сужает смысл только до физической силы.
- source_word: וַעֲשֵׂה
  choice: и сделай это
  rationale: Широкий глагол עשה в контексте указывает на исполнение порученного строительства; местоимение «это» естественно восполняет подразумеваемый объект в русском.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Передача выражения בַּיִת לַמִּקְדָּשׁ
  choice: дом для святилища
  alternative: храм; дом-святилище
  rationale: Хотя речь идёт о храме, формулировка сохраняет два элемента еврейского выражения и не устраняет возможное смысловое отношение между зданием и его священным назначением.
translation_notes:
  register: Современный литературный русский с достоинством наставления. Синтаксис сделан естественным для русской речи, при этом сохранены прямота повелений, личное имя Яхве и необычное сочетание «дом для святилища».
