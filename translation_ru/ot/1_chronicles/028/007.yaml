  text: וַ/הֲכִינוֹתִ֥י אֶת מַלְכוּת֖/וֹ עַד לְ/עוֹלָ֑ם אִם יֶחֱזַ֗ק לַ/עֲשׂ֛וֹת מִצְוֺתַ֥/י וּ/מִשְׁפָּטַ֖/י כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: ru
  text: И Я утвержу его царство навеки[a], если он будет твёрд в исполнении Моих заповедей и установлений[b], как ныне[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укреплю» либо «сделаю прочным его царство».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «если он будет крепко держаться исполнения Моих заповедей и установлений»; возможный смысл — «если он будет решителен в исполнении».'
    reason: lexical_alternative
  - marker: c
    text: То есть как он поступает теперь.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: И Я утвержу
  rationale: Хифиль глагола כון означает «сделать твёрдым, утвердить». «Утвержу» естественно звучит применительно к царству и сохраняет образ прочности.
- source_word: מַלְכוּתוֹ
  choice: его царство
  rationale: מַלְכוּת может обозначать царство, царскую власть или царствование. В контексте долговечности династии «царство» сохраняет необходимую широту значения.
- source_word: עַד לְעוֹלָם
  choice: навеки
  rationale: Передаёт значение непреходящей длительности кратко, ясно и в достойном библейском регистре.
- source_word: אִם
  choice: если
  rationale: Прямо сохраняет условный характер обещания, не ослабляя его и не превращая в характеристику Соломона.
- source_word: יֶחֱזַק
  choice: будет твёрд
  rationale: Глагол חזק здесь выражает твёрдость и решимость в послушании. Будущее время естественно для русского условного предложения и не добавляет идеи неизменного продолжения, отсутствующей в форме глагола.
- source_word: לַעֲשׂוֹת
  choice: в исполнении
  rationale: Буквально означает «делать». Русское «быть твёрдым в исполнении» естественно передаёт сочетание חזק + לעשות, не меняя смысл на простое обладание заповедями.
- source_word: מִצְוֺתַי
  choice: Моих заповедей
  rationale: «Заповеди» сохраняет заветно-правовой оттенок מִצְוֹת и привычно для современного литературного русского.
- source_word: וּמִשְׁפָּטַי
  choice: и установлений
  rationale: מִשְׁפָּטִים в данном законодательном контексте обозначает правовые предписания или установления. «Установления» яснее современному читателю, чем буквальные «суды», и не смешивает их с судебными решениями.
- source_word: כַּיּוֹם הַזֶּה
  choice: как в этот день
  rationale: Сохраняет еврейскую временную формулу и её отсылку к нынешнему поведению Соломона; смысл поясняется в примечании, а не внедряется в основной текст.
theological_decisions:
- issue: Условность обещания об утверждении царства Соломона
  choice: 'Сохранено прямое условие: «если он будет твёрд».'
  alternative: Смягчить условие, представив послушание лишь описанием нынешнего характера Соломона.
  rationale: Частица אִם недвусмысленно вводит условие. Перевод сохраняет напряжение между этим условным обещанием и иными формулировками об обетовании Давиду, не гармонизируя их.
- issue: Значение «навеки» в условном обещании
  choice: Передано прямо как «навеки» без ограничения или поясняющего толкования.
  alternative: Истолковать как ограниченную продолжительность династии либо заранее связать с определённым богословским исполнением.
  rationale: עַד לְעוֹלָם выражает непреходящую длительность; стих сам не уточняет способ исполнения, поэтому перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Прописные местоимения «Я», «Моих» употреблены как издательская норма почтительного обозначения Бога. Порядок примечаний приведён к последовательности маркеров в основном тексте.
