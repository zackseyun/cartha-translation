  text: the weight of the gold for all the articles of every kind of service[a], and the weight of the silver for all the articles of every kind of service.
translation:
  language: ru
  text: Золото — по весу для всех предметов из золота, для каждого вида служения[a]; и серебро — по весу для всех предметов из серебра, для каждого вида служения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте повторено: «служения и служения». Это распределительный оборот со значением «для каждого вида служения» или «для каждого назначения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: золото
  rationale: Основное название материала; в перечислительном контексте определённость естественно передаётся без отдельного указательного элемента.
- source_word: בַּמִּשְׁקָל
  choice: по весу
  rationale: Предлог בְּ указывает на определение количества посредством веса; «по весу» сохраняет сжатый инвентарный стиль.
- source_word: כְּלֵי
  choice: предметы
  rationale: Широкое обозначение вещей и принадлежностей; «предметы» не сужает смысл до сосудов или орудий.
- source_word: עֲבוֹדָה
  choice: служение
  rationale: В храмовом контексте слово обозначает совершаемую службу или работу; «служение» передаёт культовый контекст без конфессионального уточнения.
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: каждого вида служения
  rationale: Повтор имеет распределительное значение и различает предметы согласно разным видам или назначениям службы.
- source_word: כֶּסֶף
  choice: серебро
  rationale: Название материала, параллельное золоту.
- source_word: לְכָל / לְכֹל
  choice: для всех
  rationale: Передаёт полный охват предметов, тогда как следующий распределительный оборот уточняет их назначение.
