base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: ru
  text: Тогда Давид передал своему сыну Соломону план притвора, храмовых строений, сокровищниц, верхних комнат, внутренних помещений и помещения для крышки ковчега[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом крышки ковчега». Еврейское слово כַּפֹּרֶת обозначает крышку ковчега в Святом святых; традиционные варианты перевода: «престол милости» или «очистилище».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: чертёж
  rationale: В контексте строительства храма слово обозначает заданный архитектурный план или проект; «чертёж» естественно передаёт то, что Давид передал Соломону.
- source_word: הָאוּלָם
  choice: притвор
  rationale: Речь идёт о входной части монументального храмового здания; «притвор» — понятный и уместный русский архитектурный термин.
- source_word: בָּתָּיו
  choice: храмовые строения
  rationale: Буквально — «его дома», но в данном перечне имеются в виду помещения или структурные части храмового комплекса, а не жилые дома. Добавление «храмовые» проясняет отнесённость местоименного суффикса.
- source_word: גַנְזַכָּיו
  choice: сокровищницы
  rationale: Термин обозначает хранилища ценностей и посвящённых предметов; в храмовом контексте «сокровищницы» передаёт это кратко и естественно.
- source_word: עֲלִיֹּתָיו
  choice: верхние комнаты
  rationale: Слово обозначает комнаты или покои на верхнем уровне; выбран современный и конкретный эквивалент.
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: внутренние покои
  rationale: Перевод сохраняет значение внутренних помещений, не усиливая его до «самых внутренних», поскольку превосходная степень в еврейском тексте не выражена.
- source_word: בֵית הַכַּפֹּרֶת
  choice: помещение для крышки ковчега
  rationale: Буквально — «дом каппорета». В культовом употреблении כַּפֹּרֶת — крышка ковчега, а вся фраза обозначает помещение, где она находилась, то есть Святое святых. Функциональная формулировка понятна современному читателю и не превращает название предмета в отвлечённое понятие.
- source_word: וַיִּתֵּן
  choice: Тогда Давид передал
  rationale: Последовательная повествовательная форма продвигает рассказ; «тогда» передаёт связь с предшествующим, а «передал» естественнее русского «дал» применительно к чертежу.
theological_decisions:
- issue: Передача культового термина כַּפֹּרֶת
  choice: крышка ковчега
  alternative: крышка искупления; престол милости; очистилище
  rationale: Еврейское слово непосредственно называет крышку ковчега в Святом святых, хотя связано с обрядом искупления. Основной текст называет предмет ясно и без навязывания одного богословского толкования; традиционные и семантические варианты сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Архитектурные термины сделаны понятными без архаизации; местоименные суффиксы, способные звучать двусмысленно по-русски, переданы явной отсылкой к храму.
