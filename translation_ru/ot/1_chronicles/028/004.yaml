reference: 1 Chronicles 28:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: ru
  text: Но Яхве, Бог Израиля, избрал меня из всего дома моего отца, чтобы я был царём над Израилем навеки[a]. Ведь Он избрал Иуду предводителем[b], а в доме Иуды — дом моего отца; и среди сыновей моего отца Он благоволил поставить царём над всем Израилем меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Навеки» передаёт еврейское слово, которое может обозначать непреходящую или неопределённо долгую продолжительность; здесь оно относится к царствованию дома Давида.
    reason: cultural_note
  - marker: b
    text: 'Или: «правителем»; еврейское слово нагид обозначает поставленного предводителя или правителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וַיִּבְחַר / בָּחַר
  choice: избрал
  rationale: Сохраняет повтор глагола и его смысл осознанного избрания; литературно уместно в контексте Божьего выбора.
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: меня из всего дома моего отца
  rationale: Передаёт выбор Давида из более широкого отцовского дома, не сводя בֵּית к современному значению жилища.
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: чтобы я был царём
  rationale: Прямо передаёт назначение и сохраняет конструкцию цели или результата.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Сохраняет сильное значение продолжительности и династическую перспективу, не ограничивая выражение сроком жизни Давида.
- source_word: לְנָגִיד
  choice: предводителем
  rationale: Передаёт руководящую роль Иуды без обязательного сведения термина к узкому титулу князя или к царскому званию.
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: а в доме Иуды — дом моего отца
  rationale: Сохраняет еврейский предлог בְּ и последовательное сужение выбора от Иуды к отцовскому дому Давида.
- source_word: וּבִבְנֵי אָבִי
  choice: и среди сыновей моего отца
  rationale: Следует явной генеалогической формулировке оригинала, не заменяя её более общим словом «братья».
- source_word: בִּי רָצָה
  choice: Он благоволил ... именно меня
  rationale: «Благоволил» передаёт благосклонность и удовольствие, выраженные רצה, а «именно меня» естественно воспроизводит эмфатическое положение בִּי.
- source_word: לְהַמְלִיךְ
  choice: поставить царём
  rationale: 'Передаёт каузативную форму глагола מלך: сделать кого-либо царём, назначить на царство.'
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Сохраняет и полноту охвата, и смысл царской власти.
theological_decisions:
- issue: Значение לְעוֹלָם применительно к царствованию Давида
  choice: навеки
  alternative: на долгие времена; вовеки
  rationale: Перевод сохраняет династическую и заветную перспективу высказывания, не объясняя в самом тексте, каким образом осуществляется его вечный горизонт.
- issue: Статус Иуды, выраженный словом נָגִיד
  choice: предводителем
  alternative: правителем; князем
  rationale: Выбранное слово ясно обозначает руководящую роль, но не вводит более узкого технического или монархического различия, которого стих прямо не устанавливает.
- issue: Оттенок רצה при избрании Давида
  choice: благоволил поставить царём именно меня
  alternative: пожелал поставить царём меня; избрал меня царём
  rationale: Формулировка сохраняет оттенок Божьего благоволения и не смешивает этот глагол с уже дважды употреблённым בחר — «избрал».
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествовательной речи. Синтаксис второй фразы сохраняет ступенчатое сужение выбора: Иуда → дом Иуды → дом отца Давида → сам Давид. Заглавное «Он» употреблено как принятое в русском религиозном регистре, но без добавления толкования.'
