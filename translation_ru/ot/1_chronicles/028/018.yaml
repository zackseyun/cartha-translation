  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: ru
  text: и для жертвенника курений — очищенное золото по весу; и для образца колесницы[a] — золотых херувимов, распростирающих крылья и осеняющих[b] ковчег завета Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чертежа (модели) колесницы». Древнееврейское выражение трудно для понимания; возможно, оно обозначает престольную конструкцию из херувимов, подобную колеснице и связанную с ковчегом.'
    reason: alternative_reading
  - marker: b
    text: 'Возможен также перевод: «покрывающих»; речь идёт о крыльях херувимов, распростёртых над ковчегом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: жертвенник курений
  rationale: Точная и устоявшаяся передача сочетания «жертвенник благовонного курения»; краткая форма естественна для храмового контекста.
- source_word: זָהָב מְזֻקָּק
  choice: очищенное золото
  rationale: Причастие מְזֻקָּק указывает на золото, очищенное посредством плавки; перевод сохраняет металлургический смысл.
- source_word: בַּמִּשְׁקָל
  choice: по весу
  rationale: Фраза обозначает установленное количество, определённое взвешиванием.
- source_word: תַבְנִית הַמֶּרְכָּבָה
  choice: образец колесницы
  rationale: תַבְנִית передано как «образец», а обычное значение מֶרְכָּבָה — как «колесница»; трудное сочетание не истолковано в основном тексте как «престол».
- source_word: הַכְּרֻבִים זָהָב
  choice: золотых херувимов
  rationale: Золото естественно понимается как материал херувимов; форма «херувимов» сохраняет традиционный библейский термин.
- source_word: לְפֹרְשִׂים
  choice: распростирающих крылья
  rationale: Глагол означает «распростирать»; подразумеваемый объект «крылья» ясно следует из изображения херувимов над ковчегом.
- source_word: וְסֹכְכִים
  choice: и осеняющих
  rationale: «Осенять» передаёт покрывание распростёртыми крыльями и сохраняет возвышенный, но понятный храмовый образ.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Сохранена последовательность древнееврейской сопряжённой конструкции, а личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Образ колесницы и херувимов
  choice: сохранить слово «колесница» и пояснить трудность в сноске
  alternative: колесничный престол / престол-колесница
  rationale: Контекст может подразумевать престольную конструкцию над ковчегом, однако сам текст употребляет обычное слово «колесница»; основной перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной храмовой лексикой. Синтаксическая незавершённость начала стиха сохранена, поскольку стих продолжает перечень материалов и указаний из предыдущего контекста. Тире делают структуру перечня понятной, не добавляя отсутствующего в данном отрывке сказуемого.
