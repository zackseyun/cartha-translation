  text: וַ/יָּקוּמוּ֮ כָּל אִ֣ישׁ חַיִל֒ וַ/יִּשְׂא֞וּ אֶת גּוּפַ֣ת שָׁא֗וּל וְ/אֵת֙ גּוּפֹ֣ת בָּנָ֔י/ו וַ/יְבִיא֖וּ/ם יָבֵ֑ישָׁ/ה וַ/יִּקְבְּר֨וּ אֶת עַצְמוֹתֵי/הֶ֜ם תַּ֤חַת הָ/אֵלָה֙ בְּ/יָבֵ֔שׁ וַ/יָּצ֖וּמוּ שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: ru
  text: Тогда поднялись все храбрые воины, унесли тело Саула и тела его сыновей и принесли их в Иавис[a]. Они похоронили их кости под дубом[b] в Иависе и постились семь дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В более широком повествовании это место названо Иависом Галаадским; здесь еврейский текст употребляет сокращённое название «Иавис».
    reason: cross_reference
  - marker: b
    text: 'Или: «под теревинфом». Еврейское אֵלָה может обозначать крупное дерево типа теревинфа или дуба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: все храбрые воины
  rationale: Устойчивое выражение обозначает людей, отличавшихся силой, мужеством и воинской доблестью. Такой перевод естественен по-русски и сохраняет военный оттенок.
- source_word: וַיִּשְׂאוּ
  choice: унесли
  rationale: В данном контексте глагол означает, что тела подняли и перенесли с прежнего места; «унесли» кратко и естественно передаёт это действие.
- source_word: גּוּפַת שָׁאוּל וְאֵת גּוּפֹת בָּנָיו
  choice: тело Саула и тела его сыновей
  rationale: Существительное обозначает мёртвое тело. «Тело» сохраняет ясность контекста без излишне резкого слова «труп».
- source_word: וַיְבִיאוּם יָבֵשָׁה
  choice: принесли их в Иавис
  rationale: Перевод следует краткой форме топонима в самом стихе и не добавляет «Галаадский» в основной текст.
- source_word: עַצְמוֹתֵיהֶם
  choice: их кости
  rationale: Сохранено конкретное значение еврейского עֶצֶם — «кость», без сглаживания до более общего «останки».
- source_word: תַּחַת הָאֵלָה
  choice: под дубом
  rationale: אֵלָה обозначает крупное дерево типа дуба или теревинфа. «Дуб» понятен современному читателю, а ботаническая неопределённость отмечена в сноске.
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: и постились семь дней
  rationale: Прямой и естественный перевод выражения, описывающего семидневный траурный пост.
