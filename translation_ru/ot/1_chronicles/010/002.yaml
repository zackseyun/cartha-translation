translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Повтор слова «филистимляне» во второй части заменён местоимением «они» ради естественности русского текста; действующее лицо остаётся однозначным. Разделение на два предложения облегчает чтение, не меняя структуры событий.
