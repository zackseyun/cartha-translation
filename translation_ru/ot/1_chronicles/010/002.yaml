base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: ru
  text: Филистимляне неотступно преследовали Саула и его сыновей[a], и филистимляне сразили Ионафана, Авинадава и Малхисую, сыновей Саула.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преследовали Саула и его сыновей по пятам». Буквально глагол означает «прильнуть, приклеиться»; здесь он описывает упорное близкое преследование в бою.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: неотступно преследовали
  rationale: Сочетание דבק с אַחֲרֵי в повествовании о сражении обозначает упорное, близкое преследование. Перевод передаёт интенсивность образа «держаться вплотную», не воспроизводя его неестественно буквально.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Традиционное и общепонятное русское название народа.
- source_word: בָנָיו
  choice: его сыновей
  rationale: Существительное обозначает сыновей; последующее перечисление имён подтверждает это значение.
- source_word: וַיַּכּוּ
  choice: сразили
  rationale: Глагол נכה имеет широкий смысл «поразить, сразить». В данном военном контексте речь идёт о смертельном поражении, однако «сразили» сохраняет лексическую широту исходного глагола лучше, чем прямое «убили».
- source_word: יוֹנָתָן
  choice: Ионафана
  rationale: Традиционная русская библейская форма имени, поставленная в требуемый синтаксисом винительный падеж.
- source_word: אֲבִינָדָב
  choice: Авинадава
  rationale: Традиционная русская передача имени, поставленная в винительный падеж.
- source_word: מַלְכִּי שׁוּעַ
  choice: Малхисую
  rationale: Традиционная русская библейская передача составного еврейского имени; форма винительного падежа совпадает с родительным.
- source_word: בְּנֵי שָׁאוּל
  choice: сыновей Саула
  rationale: Сохранено заключительное приложение, прямо определяющее трёх названных мужчин как сыновей Саула.
