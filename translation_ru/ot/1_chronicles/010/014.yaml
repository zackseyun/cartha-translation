base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: ru
  text: И не взыскал Яхве[a]. Поэтому Он предал его смерти и передал царство Давиду, сыну Иессея.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не вопросил Яхве», «не обратился к Яхве за советом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царскую власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: взыскал Господа
  rationale: Сочетание דָרַשׁ с ב и обозначением Бога может означать искать Его, вопрошать Его или обращаться к Нему за советом. «Взыскал Господа» естественно для библейского литературного регистра и сохраняет как значение обращения за руководством, так и более широкую идею устремления к Богу.
- source_word: יְהוָה
  choice: Господа
  rationale: В современном русском библейском употреблении тетраграмматон традиционно передаётся словом «Господь»; форма «Господа» обусловлена управлением глагола. Это обеспечивает ясность и достоинство текста, а личное имя отмечено в сноске как допустимый более буквальный вариант.
- source_word: וַיְמִיתֵהוּ
  choice: Он предал его смерти
  rationale: Каузативная форма глагола מות прямо приписывает Господу причинение смерти Саула. Формулировка сохраняет эту каузативность и не смягчает её до простого допущения.
- source_word: וַיַּסֵּב
  choice: передал
  rationale: В породе хифиль סבב здесь обозначает переход царской власти к другому лицу. «Передал» кратко и естественно выражает этот смысл.
- source_word: הַמְּלוּכָה
  choice: царство
  rationale: מְלוּכָה может обозначать царство, царскую власть или царствование. «Царство» сохраняет конкретность исходного выражения, тогда как возможный смысл «царская власть» указан в сноске.
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: Давиду, сыну Иессея
  rationale: Естественная русская передача еврейского патронима с приложением.
theological_decisions:
- issue: Причинность в смерти Саула
  choice: Господь прямо представлен как Тот, кто предал Саула смерти.
  alternative: Господь лишь допустил смерть Саула.
  rationale: Последовательность глаголов и каузативная форма וַיְמִיתֵהוּ приписывают действие Господу. Перевод сохраняет напряжение текста и не заменяет прямую причинность идеей одного лишь допущения.
- issue: Значение обращения к Господу
  choice: «взыскал Господа» сохраняет широкий религиозный и контекстуальный смысл.
  alternative: «вопросил Господа» или «обратился к Господу за советом».
  rationale: В ближайшем контексте речь связана с поиском руководства, но еврейское выражение допускает более широкую идею поиска Господа; основной текст не сужает её без необходимости.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «Он» делает смену субъекта ясной: речь идёт о Господе. Все сноски отмечены в основном тексте.'
