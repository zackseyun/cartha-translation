  yaml_path: translation/ot/1_chronicles/010/010.yaml
  text: They put his armor in the house of their gods[b][a], and they fastened his skull in the house of Dagon.
translation:
  language: ru
  text: Они положили его боевое снаряжение[a] в храм своих богов, а его череп[b] прикрепили в храме Дагона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его оружие»; возможно также: «его доспехи». Еврейское слово имеет широкое значение и может обозначать оружие, доспехи или иное воинское снаряжение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его голову». Употреблённое здесь еврейское слово непосредственно означает «череп», но может обозначать и голову.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: они положили
  rationale: Глагол שׂים означает «класть, помещать, ставить»; «положили» естественно передаёт совершённое действие в данном повествовании.
- source_word: כֵּלָיו
  choice: его боевое снаряжение
  rationale: כְּלִי может обозначать предметы, орудия, оружие или воинское оснащение. Собирательное «боевое снаряжение» сохраняет широту слова и не сводит его только к оружию либо доспехам.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: в храме своих богов
  rationale: בַּיִת буквально означает «дом», но применительно к божествам обычно обозначает храм. По-русски «храм» ясно и естественно выражает культовый смысл.
- source_word: גֻּלְגָּלְתּוֹ
  choice: его череп
  rationale: גֻּלְגֹּלֶת обозначает череп, а в контексте может подразумевать голову; «череп» точнее передаёт конкретное существительное.
- source_word: תָקְעוּ
  choice: прикрепили
  rationale: תקע может означать «вбить, укрепить, прикрепить». «Прикрепили» передаёт выставление останков без недоказанного уточнения способа крепления.
- source_word: בֵּית דָּגוֹן
  choice: в храме Дагона
  rationale: В культовом контексте בֵּית естественно передаётся как «храм»; имя דָּגוֹן транслитерируется как «Дагон».
theological_decisions:
- issue: Упоминание אֱלֹהֵיהֶם во множественном числе
  choice: своих богов
  alternative: своего бога
  rationale: Масоретский текст содержит множественное число с местоименным суффиксом множественного числа; оно сохранено без согласования с последующим упоминанием Дагона в единственном числе.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Храм» выбран вместо буквального «дом», поскольку в русском культовом контексте это значение ясно без примечания. Синтаксис сохраняет последовательность двух действий и не усиливает неопределённое תָקְעוּ до «пронзили» или «насадили».
