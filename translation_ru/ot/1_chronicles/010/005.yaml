  text: וַ/יַּ֥רְא נֹשֵֽׂא כֵלָ֖י/ו כִּ֣י מֵ֣ת שָׁא֑וּל וַ/יִּפֹּ֥ל גַּם ה֛וּא עַל הַ/חֶ֖רֶב וַ/יָּמֹֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: ru
  text: Когда оруженосец Саула[a] увидел, что тот мёртв, он тоже пал на меч[b] и умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «несущий его оружие».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «пал на меч» означает, что он покончил с собой, бросившись на меч.
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: оруженосец Саула
  rationale: Сочетание буквально означает «несущий его оружие/снаряжение» и обозначает воинскую должность. «Оруженосец» — естественный и точный русский эквивалент; имя «Саула» устраняет неясность местоимения в русском предложении.
- source_word: כִּי
  choice: что
  rationale: 'Союз вводит содержание восприятия: оруженосец увидел, что Саул мёртв.'
- source_word: מֵת
  choice: мёртв
  rationale: Форма описывает состояние Саула в момент, когда его увидел оруженосец; русский предикатив «мёртв» передаёт это непосредственно.
- source_word: וַיִּפֹּל
  choice: пал
  rationale: Глагол буквально значит «упал/пал». В сочетании с «на меч» сохраняется лаконичный образ исходного текста и выражается намеренное самоубийство.
- source_word: גַּם הוּא
  choice: он тоже
  rationale: 'Передаёт добавочное и эмфатическое значение: оруженосец последовал примеру Саула.'
- source_word: עַל הַחֶרֶב
  choice: на меч
  rationale: В еврейском тексте стоит определённое «на меч», без притяжательного местоимения. Перевод не добавляет «свой», сохраняя формулировку источника.
- source_word: וַיָּמֹת
  choice: и умер
  rationale: Прямо передаёт завершающее звено краткой повествовательной последовательности.
