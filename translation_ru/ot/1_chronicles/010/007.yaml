- from: Когда все израильтяне, жившие в долине[a], увидели, что войско бежало и что Саул и его сыновья погибли, они покинули свои города и бежали. Тогда филистимляне пришли и поселились в них.
  to: Когда все израильские мужчины, находившиеся в долине[a], увидели, что они бежали и что Саул и его сыновья умерли, они покинули свои города и бежали. Тогда филистимляне пришли и поселились в них.
  rationale: 'Исправлены три места, где черновик добавлял или менял смысл: постоянное проживание вместо нахождения, «войско» вместо невыраженного подлежащего и гибель вместо нейтрального сообщения о смерти. Сохранены последовательность повествования, современный литературный регистр и лексическая альтернатива для עֵמֶק.'
