translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Формулировки ясны для обычного читателя; сохранена последовательность еврейского рассказа. Явное мужское значение исходного выражения передано грамматически мужским словом «израильтяне», без тяжеловесного «все мужи Израиля».
