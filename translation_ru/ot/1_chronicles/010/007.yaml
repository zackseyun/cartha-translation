  text: וַ֠/יִּרְאוּ כָּל אִ֨ישׁ יִשְׂרָאֵ֤ל אֲשֶׁר בָּ/עֵ֨מֶק֙ כִּ֣י נָ֔סוּ וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ עָרֵי/הֶם֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: ru
  text: Когда все израильские мужчины, находившиеся в долине[a], увидели, что они бежали и что Саул и его сыновья умерли, они покинули свои города и бежали. Тогда филистимляне пришли и поселились в них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на равнине».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: увидели
  rationale: Передаёт основное значение ראה и сохраняет конкретность повествования, не заменяя зрительное восприятие более толковательным «поняли».
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: все израильтяне
  rationale: Естественная современная русская передача собирательно-дистрибутивного выражения; в данном контексте форма мужского рода обозначает израильских мужчин, находившихся в этой местности.
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: жившие в долине
  rationale: עֵמֶק обычно означает долину; причастие «жившие» естественно выражает нахождение местных жителей в данной области.
- source_word: כִּי נָסוּ
  choice: что войско бежало
  rationale: В еврейском подлежащее не названо. По контексту речь идёт об израильских силах, разбитых в сражении; «войско» ясно передаёт смысл, не создавая в русском двусмысленной отсылки к жителям долины.
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: и что Саул и его сыновья погибли
  rationale: «Погибли» естественно для смерти в бою и передаёт завершившееся событие без лишнего истолкования.
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: они покинули свои города
  rationale: עזב означает оставить или покинуть; контекст ясно показывает вынужденное оставление городов.
- source_word: וַיָּנֻסוּ
  choice: и бежали
  rationale: Точная и стилистически уместная передача стандартного значения נוס.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Тогда филистимляне пришли
  rationale: «Тогда» естественно отражает последовательность событий, выраженную повествовательной формой с ו.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: и поселились в них
  rationale: В контексте занятия оставленных городов ישב указывает не просто на пребывание, а на заселение; местоимение относится к городам.
