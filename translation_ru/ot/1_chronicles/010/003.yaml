translation:
  language: ru
  text: Битва всё сильнее теснила Саула. Лучники настигли его, и он был ранен лучниками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он сильно мучился из-за лучников». Еврейский глагол может обозначать не физическое ранение, а сильное страдание или мучение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה עַל שָׁאוּל
  choice: Битва против Саула становилась всё ожесточённее
  rationale: כבד буквально связано с тяжестью, но в описании боя обозначает усиление натиска. «Становилась всё ожесточённее» естественно передаёт развитие действия и враждебное значение עַל.
- source_word: וַיִּמְצָאֻהוּ
  choice: настигли его
  rationale: מצא обычно означает «найти», однако здесь речь о лучниках, достигших отступающего Саула; «настигли» ясно и естественно передаёт военный контекст.
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: лучники
  rationale: 'Буквально: «стреляющие из лука». Русское «лучники» кратко и точно передаёт выражение.'
- source_word: וַיָּחֶל מִן הַיּוֹרִים
  choice: он был тяжело ранен их стрелами
  rationale: В данном контексте глагол вероятнее всего описывает тяжёлое ранение или болезненное состояние вследствие стрельбы. Упоминание стрел делает русскую фразу естественной, а возможное значение сильного страха или мучения сохранено в примечании.
theological_decisions:
- issue: Неоднозначность глагола וַיָּחֶל
  choice: был тяжело ранен
  alternative: пришёл в сильное смятение / испытывал сильные мучения
  rationale: Контекст сражения и непосредственное упоминание лучников поддерживают понимание физического ранения, но форма допускает толкование как сильного страдания или ужаса; поэтому альтернатива не устраняется, а указывается в примечании.
translation_notes:
  register: Современный литературный русский язык, повествовательный и сдержанно-достоинственный стиль. Образ «битва стала тяжёлой» передан естественным русским выражением без утраты смысла нарастающего натиска.
