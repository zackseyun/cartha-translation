  terminology: «Яхве» последовательно передаёт тетраграмматон. «Неверность» удачно сохраняет заветный характер מַעַל. «Медиум» не утверждает ни пол, ни реальность контакта с умершими; культурное примечание поясняет историческое значение термина без догматического вывода.
