  source_fidelity: 'Драфт верно передаёт смерть Саула как следствие его неверности Яхве и называет два обозначенных в тексте проявления: несоблюдение слова Яхве и обращение к אוֹב. Однако «вызывающей духов» необоснованно задаёт женский пол: в данном стихе еврейское בָּאוֹב не указывает на пол лица. Формулировка «обращался» также ослабляет единичный инфинитивный акт, а «чтобы вопросить» оставляет не вполне естественное для современного русского управление.'
