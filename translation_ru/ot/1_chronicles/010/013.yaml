source:
  edition: WLC
  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: ru
  text: 'И умер Саул за свою неверность Яхве: он не соблюдал слова Яхве и обратился к медиуму, чтобы получить ответ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «ов» может обозначать медиума либо духа, с которым обращаются за сведениями; ср. 1 Царств 28:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер
  rationale: Последовательная форма с וַ продолжает повествование; русское «И умер» естественно связывает стих с предшествующим контекстом, не усиливая причинность сверх текста.
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: за свою неверность, за то, что оказался неверен
  rationale: Существительное и однокоренной глагол подчёркивают нарушение верности. Повтор корня по возможности сохранён без тяжеловесной буквальности.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог при מָעַל обозначает того, против кого направлена неверность; русская конструкция «неверен Яхве» передаёт это отношение. Имя יהוה транслитерировано как «Яхве».
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: он не исполнил слова Яхве
  rationale: שׁמר применительно к слову означает соблюдать или исполнять его. Синтаксис перестроен естественно для русского языка, при этом конкретное проявление неверности сохранено.
- source_word: וְגַם לִשְׁאוֹל בָּאוֹב
  choice: а также обращался к вызывающей духов
  rationale: אוֹב в данном контексте обозначает посредника при обращении к духам; женский род согласуется с известным эпизодом 1 Царств 28, хотя само слово здесь грамматически не уточняет пол.
- source_word: לִדְרֹשׁ
  choice: чтобы вопросить
  rationale: Инфинитив передаёт цель обращения — получить ответ или указание. «Вопросить» сохраняет различие с предшествующим «обращался» и соответствует возвышенному повествовательному регистру.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя.
- issue: Характер проступка Саула
  choice: неверность / оказался неверен
  alternative: преступление / согрешил
  rationale: מעל обозначает вероломство, нарушение доверия или заветной верности, а не просто общий грех.
- issue: К кому обратился Саул
  choice: к вызывающей духов
  alternative: к медиуму
  rationale: Такой перевод понятнее широкому русскоязычному читателю и обозначает запрещённую практику, не утверждая отдельно, говорил ли реально дух умершего или имело место иное явление.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранён однокоренной повтор «неверность — неверен»; громоздкая цепочка еврейских инфинитивов преобразована в естественную русскую фразу. Все маркеры примечаний включены в основной текст.
