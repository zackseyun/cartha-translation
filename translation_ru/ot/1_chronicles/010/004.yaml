base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: ru
  text: 'Тогда Саул сказал своему оруженосцу: «Обнажи свой меч и пронзи меня им[a], чтобы не пришли эти необрезанные[b] и не стали жестоко обращаться со мной[c]». Но оруженосец не захотел, потому что очень боялся. Тогда Саул взял меч и пал на него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заколи меня им»; буквально речь идёт о пронзании колющим оружием.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «эти необрезанные»; в данном контексте имеются в виду филистимляне.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не стали издеваться надо мной», «не обесчестили меня». Еврейское слово обозначает унизительное и жестокое обращение, не уточняя его формы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: своему оруженосцу
  rationale: Устойчивое военное обозначение человека, носившего оружие и снаряжение воина; «оруженосец» точно и естественно передаёт идиому.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Обнажи свой меч
  rationale: В контексте меча глагол означает вынуть его из ножен; «обнажи» — естественная русская военная формулировка.
- source_word: וְדָקְרֵנִי בָהּ
  choice: и пронзи меня им
  rationale: דקר обозначает нанесение колющего удара, прокалывание оружием; «пронзи» передаёт и действие, и очевидное намерение смертельного исхода, не добавляя отсутствующих деталей.
- source_word: פֶּן
  choice: чтобы не
  rationale: Передаёт предотвращаемый, пугающий Саула исход естественной современной русской конструкцией.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: эти необрезанные
  rationale: Сохраняет буквальное полемическое этнорелигиозное обозначение, не подменяя его контекстуальным словом «филистимляне».
- source_word: וְהִתְעַלְּלוּ בִי
  choice: и не надругались надо мной
  rationale: Форма глагола здесь указывает на унизительное, жестокое обращение. «Надругались» сохраняет тяжесть угрозы, не уточняя конкретный вид насилия.
- source_word: וְלֹא אָבָה
  choice: не захотел этого
  rationale: Передаёт отсутствие согласия или готовности выполнить просьбу; местоимение «этого» естественно связывает фразу с приказом Саула.
- source_word: כִּי יָרֵא מְאֹד
  choice: потому что очень боялся
  rationale: Прямо сохраняет причинную связь и усиление наречием מְאֹד.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: и пал на него
  rationale: Близко передаёт буквальное «упал на него» при естественном для русского повествования глаголе «пал»; местоимение относится к мечу.
theological_decisions:
- issue: Характер угрожавшего Саулу обращения
  choice: не надругались надо мной
  alternative: не стали издеваться надо мной / не обесчестили меня
  rationale: Еврейский глагол подразумевает унизительное и, вероятно, жестокое обращение, но не определяет его точную форму. Перевод сохраняет эту смысловую широту и серьёзность угрозы.
- issue: Описание самоубийства Саула
  choice: взял меч и пал на него
  alternative: бросился на меч
  rationale: Выбранная формулировка следует явному описанию текста и не усиливает его добавочным толкованием; нравственная оценка поступка в стих не вносится.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Военная лексика ясна обычному читателю; сохранены резкость выражения «эти необрезанные» и смысловая широта глагола, описывающего угрожавшее Саулу унижение.
