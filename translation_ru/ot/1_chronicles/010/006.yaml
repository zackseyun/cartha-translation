base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: ru
  text: Так умер Саул, и вместе с ним умерли три его сына и весь его дом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все его домашние» или «вся его семья». В еврейском тексте буквально: «весь его дом»; здесь «дом» может означать домашних, семью или род, а не здание.'
    reason: 'Лексическая альтернатива: сохранён широкий смысл еврейского בֵּיתוֹ.'
lexical_decisions:
- source_word: וַיָּמָת
  choice: Так умер Саул
  rationale: Форма wayyiqtol от מוּת продолжает повествование и здесь подводит итог предшествующим событиям. «Так» естественно передаёт эту связь по-русски, а «умер» сохраняет основное значение глагола, не добавляя более узкого смысла «погиб в бою».
- source_word: שָׁאוּל
  choice: Саул
  rationale: Традиционная русская форма библейского имени.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: и три его сына
  rationale: Сочетание числительного с существительным в сопряжённой форме и местоименным суффиксом означает трёх сыновей Саула, уже известных из контекста.
- source_word: וְכָל בֵּיתוֹ
  choice: и весь его дом[a]
  rationale: Слово בַּיִת может обозначать не только здание, но также домашних, семью или род. «Дом» сохраняет широту и образность еврейского выражения, не сужая его до одного толкования.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие обозначает совместность общей участи Саула, его сыновей и его дома.
- source_word: מֵתוּ
  choice: все они умерли
  rationale: Форма qal perfect 3-го лица множественного числа от מוּת передана прошедшим временем. Местоимение «все они» необходимо для ясного и естественного русского синтаксиса и сохраняет повтор глагола «умереть» в еврейском тексте.
theological_decisions:
- issue: Объём выражения «весь его дом»
  choice: Сохранить в основном тексте выражение «весь его дом», не уточняя, что речь непременно идёт о каждом родственнике Саула.
  alternative: «все его домашние» или «вся его семья»
  rationale: Непосредственный контекст говорит о павших вместе с Саулом, тогда как слово «дом» может обозначать домашних, семью или род. Более узкая формулировка создала бы историческое утверждение, точность которого сам стих не определяет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «умер… умерли» сохраняет структуру и акцент оригинала; тире делает эту конструкцию естественной и ясной по-русски.
