base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: ru
  text: На следующий день филистимляне пришли грабить убитых[a] и нашли Саула и его сыновей павшими на горе Гилбоа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть снимать с погибших воинов добычу, например доспехи или одежду.
    reason: Культурное пояснение значения глагола в контексте поля битвы.
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: на следующий день
  rationale: Естественно передаёт указание на день после описанной битвы.
- source_word: לְפַשֵּׁט
  choice: снять доспехи и одежду
  rationale: В данном контексте глагол означает снимать с павших воинов одежду, оружие или доспехи; конкретизированный перевод понятнее современному читателю.
- source_word: הַחֲלָלִים
  choice: убитых
  rationale: Обозначает погибших насильственной смертью, здесь — убитых в сражении.
- source_word: נֹפְלִים
  choice: павшими
  rationale: Сохраняет буквальный образ падения и обычный для военного повествования смысл гибели.
- source_word: בְּהַר גִּלְבֹּעַ
  choice: на горе Гилбоа
  rationale: Прямой и естественный перевод географического названия.
- source_word: וַיְהִי
  choice: не выражено отдельной формулой
  rationale: Еврейская повествовательная формула отмечает продолжение рассказа; по-русски её функция естественно передаётся начальным обстоятельством времени без тяжеловесного «и случилось».
