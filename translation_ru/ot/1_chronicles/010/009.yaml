base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: ru
  text: Они раздели его, забрали его голову и оружие и разослали весть по всей земле филистимлян, чтобы возвестить об этом их идолам[a] и народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их изображениям». Еврейское слово может обозначать культовые изображения; перевод «идолам» передаёт полемическую окраску контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: сняли с него всё
  rationale: Глагол פשט в данной породе означает «снять одежду или доспехи, обнажить». Прямым дополнением выступает сам Саул; доспехи прямо не названы, поэтому перевод не уточняет их, но естественно передаёт полное ограбление павшего.
- source_word: וַיִּשְׂאוּ אֶת רֹאשׁוֹ
  choice: забрали его голову
  rationale: נשא может означать «поднять, понести, унести, взять». В контексте военного трофея «забрали» передаёт захват головы, не добавляя отсутствующего в стихе глагола «отсекли».
- source_word: כֵּלָיו
  choice: его оружие
  rationale: כְּלִי обозначает предмет, орудие, снаряжение или оружие. Поле боя и параллельный рассказ поддерживают значение «оружие»; более узкое «доспехи» не обязательно.
- source_word: וַיְשַׁלְּחוּ בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: разослали весть по всей земле филистимлян
  rationale: Сам глагол означает «послали», а цель последующего לְבַשֵּׂר позволяет по-русски естественно восполнить подразумеваемую «весть». סָבִיב передано оборотом «по всей», то есть во все стороны по филистимской земле.
- source_word: לְבַשֵּׂר
  choice: чтобы возвестить об этом
  rationale: בשר означает публично сообщать весть, нередко радостную для сообщающих. «Возвестить» сохраняет оттенок торжественного объявления; «об этом» естественно отсылает к победе и трофеям.
- source_word: עֲצַבֵּיהֶם
  choice: их идолам
  rationale: עֶצֶב может обозначать культовое изображение или идола. «Идолы» ясно передаёт предмет языческого почитания и присущую библейскому словоупотреблению отрицательную оценку.
- source_word: הָעָם
  choice: народу
  rationale: Определённое собирательное существительное буквально означает «народ». Притяжательное «их» не добавлено, хотя из контекста ясно, что речь о филистимлянах.
theological_decisions:
- issue: Значение עֲצַבֵּיהֶם в культовом контексте
  choice: их идолам
  alternative: их изображениям
  rationale: Слово может называть культовые изображения, представляющие божеств. «Идолы» сохраняет библейскую полемическую окраску, тогда как «изображения» нейтральнее; альтернативное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис остаётся ясным для широкого читателя; сохранена последовательность действий оригинала и не добавлено прямое упоминание обезглавливания.
