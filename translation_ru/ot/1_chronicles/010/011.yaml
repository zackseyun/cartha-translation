lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: Когда ... услышал
  rationale: Последовательная форма с וַ вводит следующий этап повествования и здесь образует временную придаточную часть, действие которой получает продолжение в следующем стихе.
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: весь Иавеш Галаадский
  rationale: 'Сохранена буквальная метонимия: название города обозначает его жителей. Единственное число сказуемого естественно согласуется в русском с названием города.'
- source_word: אֵת כָּל אֲשֶׁר
  choice: обо всём, что
  rationale: Передаёт полноту известия и звучит естественно по-русски после глагола «услышал».
- source_word: עָשׂוּ
  choice: сделали
  rationale: Русский вид и контекст ясно показывают, что действия филистимлян предшествовали получению вести; специальная форма давнопрошедшего не требуется.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Традиционное и общепонятное русское название народа.
- source_word: לְשָׁאוּל
  choice: с Саулом
  rationale: В сочетании с «сделали» это естественно передаёт лицо, затронутое действием, не усиливая значение до однозначного «против Саула».
