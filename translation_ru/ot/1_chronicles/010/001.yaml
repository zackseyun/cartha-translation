base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/001.yaml
  text: The Philistines fought against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: ru
  text: Филистимляне сражались против Израиля; израильтяне[a] побежали от филистимлян и пали убитыми на горе Гелвуй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «муж Израиля»; единственное число употреблено здесь в собирательном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Филистимляне
  rationale: Устоявшееся русское название народа. Начальный союз ו передан связью повествования без добавления временного маркера.
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: сражались против Израиля
  rationale: Нифаль глагола לחם с предлогом ב в данном военном контексте означает ведение боя против противника.
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: израильтяне побежали
  rationale: Единственное число אִישׁ здесь имеет собирательно-распределительное значение; естественное русское множественное число согласуется с дальнейшим глаголом во множественном числе.
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: от филистимлян
  rationale: Идиома מִפְּנֵי в контексте бегства обозначает удаление от наступающего врага; буквальное «от лица» в современном русском звучало бы неестественно.
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: пали убитыми
  rationale: 'Сохранена обычная древнееврейская военная формула: речь не просто о падении, а о гибели в бою.'
- source_word: בְּהַר גִּלְבֹּעַ
  choice: на горе Гелвуй
  rationale: Использована традиционная русская форма библейского топонима и естественный для обозначения места предлог.
