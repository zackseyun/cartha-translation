base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: ru
  text: Давид разгневался из-за того, что Яхве обрушился на Уззу, и назвал это место Перец-Узза[a] — так оно называется по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Название «Перец-Узза» связано с выражением «прорыв против Уззы» или «вспышка против Уззы». В еврейском тексте здесь игра однокоренных слов: Яхве «совершил прорыв» против Уззы.'
    reason: Сохранение еврейской игры слов и объяснение значения названия места.
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: Давид разгневался
  rationale: Еврейская идиома выражает вспыхнувший гнев. Такой перевод естественен по-русски и сохраняет силу чувства, не уточняя сверх текста, на кого именно был направлен гнев Давида.
- source_word: כִּי
  choice: из-за того, что
  rationale: Союз вводит причину гнева; русский оборот ясно передаёт причинную связь и естественно сочетается с глаголом «разгневался».
- source_word: פָרַץ יְהוָה פֶּרֶץ בְּעֻזָּא
  choice: Яхве обрушился на Уззу
  rationale: Сочетание глагола и однокоренного существительного описывает внезапное губительное выступление или прорыв против Уззы. «Обрушился на» естественно передаёт резкость действия; утраченную в основном тексте игру однокоренных слов поясняет сноска.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, обозначенное тетраграмматоном, распространённой русской транслитерацией, а не заменяет его титулом.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: и назвал то место
  rationale: Естественная русская передача обычной древнееврейской формулы наречения имени.
- source_word: פֶּרֶץ עֻזָּא
  choice: Перец-Узза
  rationale: Название места транслитерировано, а его связь с предшествующей игрой слов раскрыта в сноске.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: как оно называется и по сей день
  rationale: Передаёт устойчивость названия ко времени повествователя естественным современным русским оборотом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Направленность гнева Давида
  choice: Не уточнять, на кого направлен гнев
  alternative: Давид разгневался на Яхве
  rationale: Текст называет причиной гнева действие Яхве, но грамматически не формулирует прямо объект гнева Давида; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; намеренно сохранена неоднозначность относительно объекта гнева Давида.
