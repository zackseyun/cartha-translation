  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: ru
  text: А Давид и весь Израиль праздновали[a] перед Богом изо всех сил — с песнями, лирами, арфами, бубнами, кимвалами и трубами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «веселились» либо «ликовали»; еврейский глагол может обозначать игровое, радостное или праздничное действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: праздновали
  rationale: Причастие от שׂחק может обозначать игру, веселье и праздничное ликование. В контексте торжественного шествия с песнями и музыкальными инструментами «праздновали» естественно передаёт публичное радостное действие, не сводя его только к игре на инструментах.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: перед Богом
  rationale: Прямой и естественный перевод выражения, указывающего на действие в Божьем присутствии.
- source_word: בְּכָל עֹז
  choice: изо всех сил
  rationale: Идиоматичное русское выражение передаёт значение полной силы и энергичности действия.
- source_word: שִׁירִים
  choice: песнями
  rationale: Сохраняет форму и прямое значение существительного во множественном числе.
- source_word: כִנֹּרוֹת
  choice: лирами
  rationale: כִּנּוֹר обычно обозначает струнный инструмент типа лиры; этот перевод точнее традиционного обобщённого «гусли» или «арфы».
- source_word: נְבָלִים
  choice: арфами
  rationale: Обозначает иной струнный инструмент, отличный от כִּנּוֹר. Точный облик древнего инструмента неясен, но «арфы» сохраняет различие и понятно современному читателю.
- source_word: תֻפִּים
  choice: бубнами
  rationale: תֹּף обозначает рамный барабан или подобный бубну ударный инструмент; «бубен» — доступный современный эквивалент.
- source_word: מְצִלְתַּיִם
  choice: кимвалами
  rationale: Устоявшееся русское обозначение древних парных ударных тарелок, уместное в библейском регистре.
- source_word: חֲצֹצְרוֹת
  choice: трубами
  rationale: Передаёт название церемониальных труб, не добавляя отсутствующего в стихе указания на материал.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: А Давид и весь Израиль
  rationale: Начальное «А» сохраняет повествовательную связь, а «весь Израиль» естественно передаёт коллективное обозначение народа.
theological_decisions:
- issue: Передача הָאֱלֹהִים
  choice: Богом
  alternative: Богом Израиля
  rationale: Несмотря на артикль в еврейском тексте, здесь это обычное обозначение Бога Израиля. Добавлять «Израиля» не требуется, поскольку оно не выражено непосредственно, а форма «Богом» естественна по-русски.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Перечень инструментов сохранён без архаического синтаксиса; тире естественно вводит поясняющий перечень средств празднования.
