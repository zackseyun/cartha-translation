  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: ru
  text: И давайте вернём к себе ковчег нашего Бога, ведь во дни Саула мы не искали его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обращались к нему»; возможно также: «не вопрошали через него». Еврейский глагол может означать «искать», «обращаться» или «вопрошать». Местоимение естественно относится к ковчегу; по смыслу может подразумеваться обращение к Богу посредством ковчега.'
    reason: Сохранение лексической альтернативы глагола и контекстуального смысла без изменения основного, грамматически прямого указания на ковчег.
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: И возвратим
  rationale: Когортатив первого лица множественного числа выражает совместное побуждение. «Возвратим» естественно передаёт каузативное движение ковчега обратно к общине.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: ковчег нашего Бога
  rationale: Точно передаёт сопряжённую конструкцию и сохраняет конкретное обозначение священного предмета.
- source_word: אֵלֵינוּ
  choice: к себе
  rationale: В русском призыве от первого лица множественного числа «к себе» естественнее буквального «к нам» и сохраняет направление движения к говорящим и общине.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для предложения и естественно сохраняет пояснительно-причинную связь.
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: мы к нему не обращались
  rationale: 'Глагол דרש может означать искать, обращаться за ответом или вопрошать. Формулировка сохраняет смысл пренебрежения и не устраняет неоднозначность объекта: русское «к нему» может соотноситься и с ближайшим словом «ковчег», и с Богом.'
- source_word: בִּימֵי שָׁאוּל
  choice: во дни Саула
  rationale: Передаёт временную формулу в сдержанном библейском регистре; используется укоренившаяся русская форма имени «Саул».
theological_decisions:
- issue: Объект выражения לֹא דְרַשְׁנֻהוּ
  choice: Сохранить неоднозначность посредством «к нему не обращались».
  alternative: «не искали его»; «не вопрошали Бога»; «не обращались к ковчегу»
  rationale: Местоименный суффикс мужского рода единственного числа естественно может отсылать к ближайшему существительному «ковчег», тогда как употребление דרש допускает богословский смысл обращения к Богу. Основной текст не должен принудительно выбирать только одно из этих прочтений.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным оттенком. Форма «во дни» уместна в историко-библейском контексте, не делая весь стих архаичным; конструкция остаётся понятной современному читателю.
