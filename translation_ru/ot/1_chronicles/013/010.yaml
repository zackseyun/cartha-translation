id: 1CH.13.10
reference: 1 Chronicles 13:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔א וַ/יַּכֵּ֕/הוּ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ עַל הָ/אָר֑וֹן וַ/יָּ֥מָת שָׁ֖ם לִ/פְנֵ֥י אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: ru
  text: И воспылал гнев Яхве на Уззу, и Он поразил его за то, что тот протянул руку к ковчегу[a]; и умер он там пред Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёр руку на ковчег».'
    reason: Еврейское שׁלח יד על допускает более буквальную передачу «простереть руку на/к»; предлог על может звучать направительно или указывать на воздействие, поэтому альтернативный вариант сохраняет конструкцию источника.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: И воспылал гнев Яхве
  rationale: Русское «воспылал гнев» естественно и выразительно передаёт еврейскую идиому חרה אף, сохраняя образ разгоревшегося гнева.
- source_word: בְּעֻזָּא
  choice: на Уззу
  rationale: Предлог ב при идиоме гнева обозначает того, против кого направлен гнев; русское «гнев на Уззу» соответствует этому значению.
- source_word: וַיַּכֵּהוּ
  choice: Он поразил его
  rationale: Глагол נכה означает ударить или поразить. Последующая фраза прямо сообщает о смерти, поэтому нейтральное «поразил» не дублирует и не усиливает результат.
- source_word: עַל אֲשֶׁר
  choice: за то, что
  rationale: Оборот вводит основание суда; «за то, что» ясно выражает причинно-оценочную связь в данном контексте.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: протянул руку к ковчегу
  rationale: Формулировка сохраняет конкретное физическое действие и направление руки, не приписывая Уззе отсутствующего в тексте намерения.
- source_word: הָאָרוֹן
  choice: ковчегу
  rationale: В еврейском тексте стоит просто «ковчег»; контекст однозначно указывает на священный ковчег, поэтому дополнение «Божьему» не требуется.
- source_word: וַיָּמָת שָׁם
  choice: и умер он там
  rationale: Сохраняет последовательность повествования и наречие שָׁם без дополнительных смысловых уточнений.
- source_word: לִפְנֵי אֱלֹהִים
  choice: пред Богом
  rationale: «Пред Богом» кратко и торжественно передаёт пространственно-реляционное לִפְנֵי и соответствует достоинству библейского повествования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Источник непосредственно употребляет тетраграмматон; «Яхве» передаёт личное имя, не заменяя его титулом.
- issue: Различение יְהוָה и אֱלֹהִים в одном стихе
  choice: «Яхве» … «Богом»
  alternative: Унифицировать оба наименования как «Господь» или заменить второе местоимением
  rationale: Сохранение двух разных еврейских обозначений отражает лексику источника и не сглаживает намеренную или стилистическую вариативность текста.
- issue: Характер вины Уззы
  choice: Не уточнять мотив и не добавлять прямого указания на прикосновение
  alternative: «за то, что прикоснулся к ковчегу»
  rationale: В данном стихе сказано буквально о протягивании руки к ковчегу. Хотя контекст может подразумевать прикосновение, перевод не должен подменять сформулированное действие толкованием.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Инверсия «умер он там» сохраняет ритм и торжественность, оставаясь понятной современному читателю. Заглавное «Он» употреблено для ясного соотнесения с Яхве.
