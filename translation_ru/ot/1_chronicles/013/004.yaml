lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: решило
  rationale: Буквально глагол означает «сказали», но в сочетании с инфинитивом и в данном контексте выражает общее согласие собрания с предложением; «решило» естественно передаёт эту функцию по-русски.
- source_word: כָל הַקָּהָל
  choice: всё собрание
  rationale: קָהָל обозначает собравшуюся общину; «собрание» понятно современному читателю и не привносит узкого церковного оттенка.
- source_word: לַעֲשׂוֹת כֵּן
  choice: так и сделать
  rationale: Естественный русский эквивалент конструкции «сделать так», указывающей на ранее высказанное предложение.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание общего решения.
- source_word: יָשַׁר
  choice: было правильным
  rationale: В контексте обсуждения слово характеризует дело как верное или надлежащее; «правильным» сохраняет оценочный смысл.
- source_word: הַדָּבָר
  choice: это дело
  rationale: דָּבָר здесь относится к обсуждаемому предложению или начинанию; «дело» сохраняет широту значения без излишнего уточнения.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохраняется прозрачная и употребительная в русском библейском стиле идиома оценки с чьей-либо точки зрения.
- source_word: כָל הָעָם
  choice: всего народа
  rationale: עָם обозначает народ как единое целое; русский родительный оборот естественно передаёт еврейскую конструкцию.
