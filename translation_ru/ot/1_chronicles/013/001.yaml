  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: ru
  text: И Давид посоветовался с начальниками тысяч и сотен, со всеми предводителями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: советовался
  rationale: Форма нифаля от יעץ передаёт участие в совещании; «советовался» естественно выражает взаимный, совещательный характер действия.
- source_word: עִם
  choice: с
  rationale: Предлог прямо обозначает тех, с кем Давид советовался.
- source_word: שָׂרֵי
  choice: начальниками
  rationale: В сочетании с «тысячами и сотнями» שׂרים обозначает руководителей военно-административных подразделений; «начальники» сохраняет широкий служебный смысл.
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: тысяч и сотен
  rationale: Буквальные числовые обозначения сохранены как названия военно-административных подразделений.
- source_word: לְכָל נָגִיד
  choice: со всеми предводителями
  rationale: לְכָל расширяет круг участников совета, а נָגִיד обозначает лицо, наделённое руководящим положением. «Предводители» отличает эту общую группу руководителей от названных ранее начальников подразделений.
