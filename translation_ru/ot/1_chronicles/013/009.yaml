  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: ru
  text: Когда они дошли до гумна Кидона, Узза протянул руку, чтобы ухватиться за ковчег, потому что волы оступились[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поскользнулись». Еврейский глагол может обозначать скольжение или выпускание чего-либо; здесь он описывает неустойчивое движение волов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: гумно Кидона
  rationale: גֹּרֶן обозначает гумно, то есть площадку для молотьбы; כִּידֹן передано как имя собственное «Кидон».
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: протянул руку
  rationale: Естественная русская передача идиомы «послал/простёр свою руку», сохраняющая конкретное физическое действие.
- source_word: לֶאֱחֹז
  choice: чтобы придержать
  rationale: אחז означает схватить или удержать. В данном контексте «придержать» естественно выражает попытку не дать ковчегу потерять устойчивость, не приписывая действию враждебного характера.
- source_word: הָאָרוֹן
  choice: ковчег
  rationale: В еврейском тексте здесь сказано только «ковчег»; уточнение «Божий» из контекста не добавляется.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину действия Уззы; современная русская формулировка передаёт причинную связь прямо.
- source_word: שָׁמְטוּ
  choice: оступились
  rationale: Глагол может обозначать скольжение или выпускание/роняние. При подлежащем «волы» слово «оступились» естественно описывает движение, из-за которого ковчег оказался под угрозой, не устраняя лексическую неоднозначность полностью; иной оттенок отмечен в сноске.
- source_word: הַבָּקָר
  choice: волы
  rationale: Хотя בָּקָר может обозначать крупный рогатый скот вообще, в контексте перевозки речь идёт о тягловых животных.
