base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: ru
  text: 'И устрашился Давид Бога в тот день[a] и сказал: «Как же мне принести к себе ковчег Божий?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испугался Бога»; еврейский глагол в зависимости от контекста может обозначать страх, ужас или благоговение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: устрашился
  rationale: Глагол ירא в данном контексте выражает сильный страх перед Богом после гибели Уззы; «устрашился» сохраняет оттенок благоговейного трепета, не сводя его к одному лишь почтению.
- source_word: אֶת הָאֱלֹהִים
  choice: Бога
  rationale: Определённое существительное с показателем прямого дополнения естественно передаётся по-русски как «Бога».
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямая и естественная передача стандартного еврейского обстоятельства времени.
- source_word: לֵאמֹר
  choice: и сказал
  rationale: Еврейский инфинитив, вводящий прямую речь, в современном русском повествовании естественно передаётся личной формой «и сказал».
- source_word: הֵיךְ
  choice: как же
  rationale: Вопросительное слово передаёт не только способ действия, но и растерянность Давида относительно его возможности или допустимости; частица «же» естественно отражает эту напряжённость.
- source_word: אָבִיא
  choice: мне принести
  rationale: Каузативная форма от בוא означает «принести, доставить»; конструкция с «мне» естественно передаёт вопрос говорящего о собственном действии.
- source_word: אֵלַי
  choice: к себе
  rationale: Передаёт направление к самому Давиду, не уточняя, идёт ли речь о его доме, городе или месте пребывания.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Устойчивое, ясное и торжественное обозначение священного ковчега, соответствующее еврейской определительной конструкции.
theological_decisions:
- issue: Характер реакции Давида на Божий суд
  choice: «устрашился Давид Бога»
  alternative: «убоялся Давид Бога»; «стал Давид бояться Бога»; «благоговел перед Богом»
  rationale: Контекст гибели Уззы указывает на настоящий страх перед Божьей святостью и судом. Формулировка не смягчает его до простого почтения, но и сохраняет возможность благоговейного трепета.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «устрашился Давид» сохраняет повествовательную весомость, оставаясь понятной современному читателю.
