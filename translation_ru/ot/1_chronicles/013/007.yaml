  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: ru
  text: Они поставили на новую повозку Божий ковчег, взятый из дома Авинадава, а Узза и Ахио правили повозкой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вели повозку». Древнееврейское причастие может означать «вести» или «править» повозкой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: поставили… на повозку
  rationale: Каузативная форма от רכב означает «сделать так, чтобы нечто ехало/перевозилось»; выбранная конструкция конкретно передаёт помещение ковчега на транспорт.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Божий ковчег
  rationale: Естественная русская конструкция, точно передающая древнееврейское сочетание «ковчег Бога» в данном культовом контексте.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: на новую повозку
  rationale: «Повозка» — понятное современному читателю обозначение колёсного транспортного средства; определение «новую» сохранено явно.
- source_word: מִבֵּית אֲבִינָדָב
  choice: чтобы вывезти его из дома Авинадава
  rationale: Предлог מִן выражает исходную точку движения. Целевая конструкция по-русски связывает помещение ковчега на повозку с его вывозом из дома, не меняя последовательности событий.
- source_word: עֻזָּא
  choice: Узза
  rationale: Транслитерация сохраняет удвоенный согласный исходного имени и соответствует современной передаче еврейской формы.
- source_word: אַחְיוֹ
  choice: Ахио
  rationale: Прямая и понятная русская транслитерация личного имени.
- source_word: נֹהֲגִים בָּעֲגָלָה
  choice: правили повозкой
  rationale: Причастие נהג может означать ведение или управление транспортом; русское «правили повозкой» естественно передаёт продолженное действие и управление ею.
