  terminology: «Шихор», «Лево-Хамат» и «Кириаф-Иарим» последовательно переданы как топонимы. «Ковчег Божий» — ясное, традиционно узнаваемое и лексически точное выражение. Примечания в русском тексте стоят у соответствующих топонимов и сохраняют необходимую неопределённость в идентификации Шихора и в понимании Лево-Хамата.
