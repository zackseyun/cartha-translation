  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: Давид является субъектом действия, כָּל־יִשְׂרָאֵל передано собирательно как «весь Израиль», южная и северная границы сохранены, а инфинитив לְהָבִיא корректно выражен целевой конструкцией «чтобы перенести». «Ковчег Божий» верно соответствует אֲרוֹן הָאֱלֹהִים. Передача «перенести» уместна в контексте перемещения ковчега и не добавляет отсутствующего в тексте пункта назначения.'
