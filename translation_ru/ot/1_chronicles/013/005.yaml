source:
  edition: WLC
  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: ru
  text: И собрал Давид весь Израиль — от египетского Шихора[a] до Лево-Хамата[b], — чтобы перенести ковчег Божий из Кириаф-Иарима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Египетский Шихор» — обозначение южной границы; некоторые понимают его как «Египетский поток».
    reason: cultural_note
  - marker: b
    text: 'Или, более буквально: «до входа в Хамат».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: собрал
  rationale: Порода hифиль глагола קהל означает, что Давид созвал и свёл людей вместе; «собрал» естественно передаёт это значение по-русски.
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено собирательное обозначение народа; оно может подразумевать общенародное представительство, а не обязательно каждого человека без исключения.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: от египетского Шихора
  rationale: Шихор сохранён как собственное географическое название; определение «египетский» естественно передаёт сочетание с מִצְרַיִם, не отождествляя водный рубеж с конкретным потоком.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: до Лево-Хамата
  rationale: Сочетание передано как известное географическое название и пограничное обозначение; буквальное прочтение вынесено в примечание.
- source_word: לְהָבִיא
  choice: чтобы перенести
  rationale: Инфинитив выражает цель. В контексте ковчега «перенести» по-русски естественнее общего «принести» и ясно обозначает перемещение священного предмета из одного места в другое.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Точное и традиционно понятное соответствие конструкции «ковчег Бога» без богословского расширения.
- source_word: מִקִּרְיַת יְעָרִים
  choice: из Кириаф-Иарима
  rationale: Использована укоренившаяся в русской библейской традиции форма топонима, остающаяся узнаваемой и близкой к еврейскому названию.
