base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: ru
  text: И ковчег Божий оставался у семьи Овед-Эдома[a], в его доме, три месяца. И Яхве благословил семью Овед-Эдома и всё, что ему принадлежало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у дома Овед-Эдома». Еврейское слово בֵּית может означать как дом-здание, так и семью или домочадцев; далее то же слово употреблено в выражении «в его доме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: оставался
  rationale: Глагол יָשַׁב может означать «сидеть», «жить», «пребывать», «оставаться». Здесь речь о временном нахождении ковчега в определённом месте, поэтому «оставался» естественно передаёт контекст.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Перевод точно сохраняет употреблённое здесь краткое наименование, не добавляя отсутствующих в еврейском тексте слов «завета».
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: у семьи Овед-Эдома
  rationale: Слово בֵּית может обозначать как дом-здание, так и семью или домочадцев. В сочетании с последующим בְּבֵיתוֹ («в его доме») социальное значение позволяет передать фразу по-русски ясно и без тяжеловесного повтора; неоднозначность отмечена в сноске.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: Здесь выражение указывает на конкретное место нахождения ковчега и естественно передаётся как «в его доме».
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: три месяца
  rationale: Русская форма длительности не требует дополнительного предлога и точно передаёт еврейское выражение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет употребление Тетраграмматона в исходном тексте.
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: семью Овед-Эдома
  rationale: В качестве объекта благословения בֵּית естественно понимать как семью и домочадцев, а не только здание; возможное более широкое значение «дом» сохраняется в сноске.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: и всё, что ему принадлежало
  rationale: Формулировка сохраняет широкое значение еврейской фразы и охватывает всё относящееся к Овед-Эдому, не сужая смысл только до имущества.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо употреблено личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем Бога и титулом «Господь», не добавляя конфессионального толкования.
- issue: Объём благословения «дома» Овед-Эдома
  choice: семью Овед-Эдома и всё, что ему принадлежало
  alternative: дом Овед-Эдома и всё, что у него было
  rationale: 'Перевод не ограничивает благословение материальным зданием или имуществом: בֵּית может включать семью и домочадцев, а последующая фраза имеет намеренно широкий охват.'
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Синтаксис сохраняет последовательность двух еврейских повествовательных предложений. Имя עֹבֵד אֱדֹם передано как «Овед-Эдом» по форме исходного имени; личное имя יהוה — как «Яхве».
