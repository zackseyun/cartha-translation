- from: 'И сказал Давид всему собранию Израиля: «Если вы считаете это правильным и если на то воля Яхве, нашего Бога, давайте разошлём повсюду весть нашим братьям[a], оставшимся во всех областях Израиля[b], а также живущим среди них священникам и левитам — в городах с принадлежащими им пастбищами[c], — чтобы они собрались к нам».'
  to: 'И сказал Давид всему собранию Израиля: «Если вы сочтёте это хорошим и если это от Яхве, нашего Бога, давайте широко разошлём весть нашим братьям[a], оставшимся во всех областях Израиля[b], а также священникам и левитам, живущим среди них в городах с прилегающими к ним пастбищами[c], чтобы они собрались к нам».'
  rationale: 'Исправлены два места, где перевод несколько выходил за пределы исходной формулировки: «правильным» заменено на более широкое «хорошим», а «воля Яхве» — на сохраняющее эллипсис оригинала «если это от Яхве». Уточнена связь городов с прилегающими к ним угодьями. «Широко разошлём весть» передаёт сочетание двух когортативов, включая оттенок распространения/рассылки, без утверждения конкретного способа отправки посланцев.'
