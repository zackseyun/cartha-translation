  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: ru
  text: 'И сказал Давид всему собранию Израиля: «Если вы сочтёте это хорошим и если это от Яхве, нашего Бога, давайте широко разошлём весть нашим братьям[a], оставшимся во всех областях Израиля[b], а также священникам и левитам, живущим среди них в городах с прилегающими к ним пастбищами[c], чтобы они собрались к нам».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братья» здесь — соплеменники Давида, остальные израильтяне.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во всех землях Израиля».'
    reason: lexical_alternative
  - marker: c
    text: То есть в городах, которым принадлежали окружавшие их открытые угодья, в том числе пастбища.
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  choice: собрание
  rationale: Передаёт собравшееся общенациональное сообщество без излишних церковных коннотаций слова «община».
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: если вы считаете это правильным
  rationale: Естественно передаёт идиому, обозначающую одобрение и согласие слушателей.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: и если на то воля Яхве, нашего Бога
  rationale: В русском языке естественно выражает подразумеваемое условие о Божьем одобрении, не утверждая его как уже данное.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: давайте разошлём повсюду весть
  rationale: Сочетание буквально необычно («прорвёмся/распространимся; пошлём»); перевод передаёт широкий охват рассылки и подразумеваемое сообщение.
- source_word: עַל אַחֵינוּ
  choice: нашим братьям
  rationale: В сочетании с глаголом посылания указывает на адресатов; родственный термин сохранён.
- source_word: הַנִּשְׁאָרִים
  choice: оставшимся
  rationale: Передаёт нейтральное значение причастия, не вводя специального богословского понятия «остаток».
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: во всех областях Израиля
  rationale: Сохраняет множественное число и естественно обозначает территориальные части Израиля.
- source_word: וְעִמָּהֶם הַכֹּהֲנִים וְהַלְוִיִּם
  choice: а также живущим среди них священникам и левитам
  rationale: Проясняет, что священники и левиты, находившиеся среди остальных израильтян, также были адресатами призыва.
- source_word: בְּעָרֵי מִגְרְשֵׁיהֶם
  choice: в городах с принадлежащими им пастбищами
  rationale: Мִגְרָשׁ обозначает открытые угодья вокруг городов, в частности используемые как пастбища.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: чтобы они собрались к нам
  rationale: Передаёт цель рассылки и сохраняет направление движения к Давиду и собранию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога; транслитерация сохраняет это различие.
- issue: Соотношение одобрения народа и Божьей воли
  choice: 'два согласованных условия: «если вы считаете… и если на то воля…»'
  alternative: утверждение, что решение уже исходит от Бога
  rationale: Грамматика допускает восполнение условного сказуемого во второй части; такой перевод сохраняет напряжение между человеческим согласием и Божьим одобрением, не объявляя последнее заранее установленным.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Формула «давайте» делает совместное побуждение естественным; тире отделяет уточнение о городах и их угодьях. Все примечания отмечены в основном тексте.
