base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: ru
  text: И Давид и весь Израиль поднялись в Баалу[a], то есть в Кириаф-Иарим, что в Иудее, чтобы перенести оттуда ковчег Бога — Яхве, восседающего на херувимах, который назван Именем.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Баала — другое название Кириаф-Иарима.
    reason: Поясняет приложение и тождество двух географических названий.
  - marker: b
    text: 'Еврейский оборот эллиптичен; буквально: «который назван именем». Вероятно, говорится о ковчеге, названном именем Яхве; возможна и связь этой формулы с призыванием имени. Ср. 2 Царств 6:2, где параллельная фраза выражена подробнее.'
    reason: Сохраняет синтаксическую неоднозначность заключительного оборота и не переносит в основной текст уточнение, отсутствующее в 1 Пар 13:6.
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялись
  rationale: Сохраняет направительное значение עלה («подниматься, идти вверх») и естественно звучит в повествовании о совместном пути Давида и Израиля.
- source_word: בַּעֲלָתָה
  choice: в Баалу
  rationale: Передаёт древнееврейское название места Баала и направительный суффикс -ה; далее оно отождествляется с Кириаф-Иаримом.
- source_word: אֶל קִרְיַת יְעָרִים
  choice: то есть в Кириаф-Иарим
  rationale: '«То есть» ясно выражает приложение: Баала здесь отождествлена с Кириаф-Иаримом.'
- source_word: אֲשֶׁר לִיהוּדָה
  choice: что в Иудее
  rationale: Естественная русская передача принадлежности города территории Иуды; «Иудея» употреблена как привычное географическое название, а не как обозначение позднейшей провинции.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: чтобы перенести оттуда
  rationale: В каузативной форме עלה означает доставить или поднять; «перенести» ясно передаёт перемещение ковчега, не создавая неестественного русского повтора с «поднялись».
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Бога
  rationale: Прямая передача сочетания в сопряжённом состоянии; слово «ковчег» в данном контексте понятно без добавления «завета», которого в еврейском тексте нет.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: восседающего над херувимами
  rationale: Причастие יושב в контексте ковчега несёт царственный образ восседания; «над» соответствует образу престола, не вводя отсутствующее в тексте «между».
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: чьё имя призывается над ним
  rationale: Сжатая и неоднозначная фраза соотносит имя Яхве с ковчегом. Такая передача сохраняет пассивную идею призывания имени и местоименную соотнесённость с ковчегом, а альтернативный синтаксический разбор указан в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Отнесение оборота אֲשֶׁר נִקְרָא שֵׁם
  choice: чьё имя призывается над ним
  alternative: который называется Именем
  rationale: 'Еврейская фраза эллиптична: относительное местоимение может соотноситься с Яхве или ковчегом, а «имя» допускает несколько синтаксических истолкований. Основной текст следует вероятной связи с Яхве и ковчегом, сноска сохраняет иной возможный разбор.'
- issue: Образ יוֹשֵׁב הַכְּרוּבִים
  choice: восседающего над херувимами
  alternative: обитающего среди херувимов
  rationale: Царственно-престольный образ уместен при упоминании ковчега, однако в еврейском нет выраженного предлога; поэтому возможный пространственный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя, при этом сохранены имя Яхве, образ восседания над херувимами и неоднозначность последней фразы.
