base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: ru
  text: И не перенёс Давид ковчег к себе[a], в город Давида, а направил его[b] в дом Овед-Эдома, гефянина[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не переместил ковчег к себе». Еврейский глагол может означать «удалить» или «переместить»; в данном контексте — не везти ковчег дальше к своему месту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отвёл его» или «повернул его в сторону».'
    reason: lexical_alternative
  - marker: c
    text: То есть человека из Гефа.
    reason: clarification
lexical_decisions:
- source_word: הֵסִיר
  choice: не перенёс
  rationale: В породе хифиль глагол סוּר может означать «удалить», «отвести» или «перенести». Здесь речь о том, что Давид не стал дальше перемещать ковчег к намеченному месту; «не перенёс» естественно передаёт этот смысл по-русски.
- source_word: אֵלָיו
  choice: к себе
  rationale: Буквально «к нему», но при Давиде как подлежащем выражение имеет возвратный смысл и указывает на его собственное место.
- source_word: עִיר דָּוִיד
  choice: город Давида
  rationale: Устоявшееся русское обозначение данного места, точно соответствующее еврейскому сочетанию.
- source_word: וַיַּטֵּהוּ
  choice: отвёл его
  rationale: 'Глагол נָטָה здесь обозначает изменение направления: ковчег отвели с предполагавшегося пути в дом Овед-Эдома.'
- source_word: בֵּית
  choice: в дом
  rationale: В данном повествовательном контексте בַּיִת прежде всего обозначает место, где разместили ковчег; при этом возможный оттенок «домочадцы, хозяйство» не исключается.
- source_word: עֹבֵד אֱדֹם
  choice: Овед-Эдома
  rationale: Форма имени следует распространённой русской библейской передаче и оформлена в родительном падеже после слова «дом».
- source_word: הַגִּתִּי
  choice: гефянина
  rationale: Этноним прямо передан традиционным русским словом «гефянин», то есть человек, связанный с Гефом.
