base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: ru
  text: 'Их сёстры — Церуя и Авигея. Сыновья Церуи: Авесса, Иоав и Асаил — трое.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: Их сёстры —
  rationale: Сохранены множественное число и местоименный суффикс третьего лица множественного числа; именная конструкция с тире естественна для современного русского языка.
- source_word: צְרוּיָה
  choice: Церуя
  rationale: Имя передано в принятой русской библейской форме.
- source_word: וַאֲבִיגָיִל
  choice: и Авигея
  rationale: Союз ו передан как «и», имя — в принятой русской библейской форме.
- source_word: וּבְנֵי צְרוּיָה
  choice: Сыновья Церуи
  rationale: Конструкция сопряжённого состояния передана буквально и естественно; двоеточие вводит последующий перечень.
- source_word: אַבְשַׁי
  choice: Авесса
  rationale: Использована узнаваемая традиционная русская библейская форма имени.
- source_word: וְיוֹאָב
  choice: Иоав
  rationale: Имя передано в принятой русской библейской форме; союз оформлен по правилам русского перечисления.
- source_word: וַעֲשָׂהאֵל
  choice: и Асаил
  rationale: Имя передано в принятой русской библейской форме, а соединительный союз сохранён перед последним членом перечня.
- source_word: שְׁלֹשָׁה
  choice: трое
  rationale: Итоговое числительное сохранено явно; собирательное «трое» естественно по отношению к трём сыновьям.
