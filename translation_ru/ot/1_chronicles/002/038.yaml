- source_word: עוֹבֵד
  choice: Овед
  rationale: Личное имя передано в принятой русской библейской форме, соответствующей еврейскому звучанию.
- source_word: הוֹלִיד
  choice: породил
  rationale: В родословном контексте форма породы хифиль глагола ילד обозначает отцовство и прямое происхождение; «породил» кратко и точно передаёт формулу генеалогии.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, не имеющий самостоятельного соответствия в русском языке; его функция выражена синтаксисом.
- source_word: יֵהוּא
  choice: Ииуй
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וְ
  choice: а
  rationale: Союз связывает две последовательные генеалогические формулы; «а» естественно продолжает цепочку родства без добавления временного или причинного оттенка.
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Личное имя передано в принятой русской библейской форме; после переходного глагола употреблена форма винительного падежа «Азарию».
