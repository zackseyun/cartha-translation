id: 1CH.2.3
reference: 1 Chronicles 2:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּנֵ֣י יְהוּדָ֗ה עֵ֤ר וְ/אוֹנָן֙ וְ/שֵׁלָ֔ה שְׁלוֹשָׁה֙ נ֣וֹלַד ל֔/וֹ מִ/בַּת שׁ֖וּעַ הַֽ/כְּנַעֲנִ֑ית וַ/יְהִ֞י עֵ֣ר בְּכ֣וֹר יְהוּדָ֗ה רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה וַ/יְמִיתֵֽ/הוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: ru
  text: 'Сыновья Иуды: Эр, Онан и Шела. Эти трое родились у него от дочери Шуи, хананеянки[a]. Эр, первенец Иуды, был нечестив в глазах Яхве, и Он умертвил его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «от хананеянки Бат-Шуа». Древнееврейское сочетание можно понимать либо как «дочь Шуи», либо как собственное имя Бат-Шуа.'
    reason: lexical_alternative
  - marker: b
    text: В древнееврейском подлежащее здесь не названо; естественнее всего отнести его к Яхве, упомянутому непосредственно перед этим.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Сыновья Иуды
  rationale: Конструкция сопряжённого состояния передана естественной русской родословной формулой.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה
  choice: Эр, Онан и Шела
  rationale: Имена переданы непосредственно с древнееврейского с учётом норм современной русской транслитерации.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: Эти трое родились у него
  rationale: Сохранены и явно названное число, и пассивно-результативное значение формы נולד לו, без замены на активное «он стал отцом».
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: от дочери Шуи, хананеянки
  rationale: Основной текст следует раздельному чтению «дочь Шуи»; форма женского рода הַכְּנַעֲנִית характеризует саму женщину. Возможное чтение Бат-Шуа как имени отражено в примечании.
- source_word: בְּכוֹר יְהוּדָה
  choice: первенец Иуды
  rationale: Кратко и точно передано отношение сопряжённой конструкции.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: был нечестив в глазах Яхве
  rationale: «Нечестив» естественно выражает нравственную оценку רַע применительно к человеку, а «в глазах» сохраняет древнееврейскую образность формулы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, обозначенное тетраграмматоном, передано принятой научной русской транслитерацией, а не заменено титулом.
- source_word: וַיְמִיתֵהוּ
  choice: и Он умертвил его
  rationale: '«Умертвил» сохраняет каузативное значение глагола: сделал так, что он умер. Русское местоимение восполняет невыраженное древнееврейское подлежащее; его отнесение к Яхве отмечено в сноске.'
theological_decisions:
- issue: Неявное подлежащее וַיְמִיתֵהוּ
  choice: «и Он умертвил его», где «Он» относится к Яхве
  alternative: «и Яхве умертвил его»
  rationale: В древнееврейском подлежащее не названо отдельно, но ближайшим и наиболее естественным референтом является Яхве из предшествующей части. Местоимение сохраняет ход исходной фразы, а примечание сообщает о грамматической неявности.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Сохранено личное Божье имя исходного текста без конфессионально обусловленной замены титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным родословным стилем. Синтаксис разделён на два предложения ради ясности; повтор «эти трое» сохраняет явный счёт исходного текста. Архаизмы сведены к минимуму, при этом формула «в глазах Яхве» сохраняет образность оригинала.
