  text: וּ/בְנֵ֥י נָדָ֖ב סֶ֣לֶד וְ/אַפָּ֑יִם וַ/יָּ֥מָת סֶ֖לֶד לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: ru
  text: 'Сыновья Надава: Селед и Аппаим. Селед умер, не оставив сыновей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма сопряжённого состояния множественного числа от בֵּן вводит генеалогическое сообщение. Начальный союз וּ естественно не выражать отдельно после предыдущего контекста перечня.
- source_word: נָדָב
  choice: Надава
  rationale: Личное имя передано принятой русской библейской транслитерацией и поставлено в родительный падеж после слова «сыновья».
- source_word: סֶלֶד
  choice: Селед
  rationale: Личное имя последовательно передано транслитерацией в обоих случаях.
- source_word: וְאַפָּיִם
  choice: и Аппаим
  rationale: В генеалогическом контексте это личное имя, несмотря на совпадение формы с нарицательным словом; союз וְ передан как «и».
- source_word: וַיָּמָת
  choice: умер
  rationale: Форма wayyiqtol от מוּת сообщает о смерти как о следующем событии; простое прошедшее время естественно по-русски.
- source_word: לֹא בָנִים
  choice: не оставив сыновей
  rationale: Буквально «не сыновья». В сочетании с сообщением о смерти оборот «не оставив сыновей» ясно и естественно передаёт отсутствие сыновей, не расширяя значение до детей вообще.
