  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: ru
  text: Она родила Шаафа, отца Мадманны, и Шеву, отца Махбены и отца Гивы. Дочерью Халева была Ахса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Она родила также
  rationale: Форма глагола женского рода продолжает речь о Маахе из предыдущего стиха; «также» естественно передаёт продолжение перечня рождённых ею сыновей.
- source_word: אֲבִי
  choice: отца
  rationale: Сохранено буквальное и намеренно широкое обозначение родства или родоначальничества, без замены на более узкое «основатель».
- source_word: שַׁעַף
  choice: Шаафа
  rationale: Транслитерация еврейского имени с сохранением удвоенного гласного звучания, отличающая его от имени שְׁוָא.
- source_word: שְׁוָא
  choice: Шеву
  rationale: Передача имени согласно его еврейской форме; винительный падеж обусловлен ролью прямого дополнения при «родила».
- source_word: עַכְסָה
  choice: Ахса
  rationale: Устоявшаяся и узнаваемая русская передача имени.
theological_decisions:
- issue: Кто является подлежащим при וַתֵּלֶד
  choice: Мааха, названная в предыдущем стихе («она»)
  alternative: 'Шааф как субъект: «Шааф породил Шеву»'
  rationale: Глагол וַתֵּלֶד стоит в женском роде, а частица אֶת перед именем Шева отмечает ещё одно прямое дополнение; следовательно, Шааф и Шева — оба рождённые ранее названной женщиной. Такое прочтение также сохраняет выражение «Шааф, отец Мадманны», отсутствующее в английском консультационном тексте.
- issue: Значение אֲבִי в родословно-географическом перечне
  choice: Сохранить «отец»
  alternative: Передать как «основатель» или «родоначальник»
  rationale: Еврейское слово допускает как прямое родство, так и значение предка либо основателя поселения; буквальная передача сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного повествования. Синтаксис проясняет, что Мааха родила и Шаафа, и Шеву, но не устраняет смысловую широту слова «отец».
