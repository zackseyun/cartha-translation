base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: ru
  text: Ефа, наложница Халева, родила Харана, Моцу и Газеза; и Харан стал отцом Газеза.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵיפָה
  choice: Ефа
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: פִּילֶגֶשׁ
  choice: наложница
  rationale: Еврейское слово обозначает женщину с признанным, но подчинённым брачным статусом; «наложница» — краткий и традиционно понятный русский эквивалент.
- source_word: כָּלֵב
  choice: Халев
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: יָלְדָה
  choice: родила
  rationale: При подлежащем женского рода в родословной записи это естественная и точная передача глагола ילד.
- source_word: חָרָן
  choice: Харан
  rationale: Имя последовательно передано одинаково в обоих случаях.
- source_word: מוֹצָא
  choice: Моца
  rationale: Личное имя транслитерировано в соответствии с его еврейской формой.
- source_word: גָּזֵז
  choice: Газез
  rationale: Имя последовательно передано одинаково в обоих случаях.
- source_word: הֹלִיד
  choice: стал отцом
  rationale: В породных списках форма Hiphil глагола ילד выражает мужское происхождение; эта формулировка естественна в современном русском и не звучит архаично.
- source_word: וְ
  choice: и / а
  rationale: При перечислении союз передан как «и», а на границе двух сообщений — как естественное русское «а».
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения передан русским синтаксисом и не требует отдельного эквивалента.
