source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: ru
  text: Но Гешур и Арам отняли у них селения Иаира[a], а также Кенат с зависимыми от него поселениями[b] — всего шестьдесят городов. Все эти города принадлежали сыновьям Махира[c], отца Галаада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хаввот-Иаир» — географическое название, буквально означающее «селения Иаира».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с её дочерями»; имеются в виду зависимые поселения вокруг Кената.'
    reason: cultural_note
  - marker: c
    text: Выражение «сыновья Махира» может означать его потомков или членов его рода, а не обязательно непосредственных сыновей.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: отняли
  rationale: Передаёт переход владения «от них», не уточняя сверх текста, произошло ли это путём завоевания или иного захвата; единственное число еврейского сказуемого при составном подлежащем по-русски естественно передаётся множественным.
- source_word: גְּשׁוּר וַאֲרָם
  choice: Гешур и Арам
  rationale: Сохранены древнееврейские собственные имена; «Арам» точнее отражает форму источника, чем исторически более позднее «Сирия».
- source_word: חַוֺּת יָאִיר
  choice: селения Иаира
  rationale: Передан прозрачный смысл топонимического выражения; его возможное понимание как цельного географического названия отмечено в сноске.
- source_word: מֵאִתָּם
  choice: у них
  rationale: Естественно по-русски обозначает изъятие из владения или власти ранее названной группы.
- source_word: קְנָת
  choice: Кенат
  rationale: Транслитерация географического названия с учётом древнееврейской формы.
- source_word: בְּנֹתֶיהָ
  choice: зависимыми от него поселениями
  rationale: Передаёт древний образ «дочерей» города понятным современному читателю выражением; буквальный образ сохранён в сноске.
- source_word: שִׁשִּׁים עִיר
  choice: всего шестьдесят городов
  rationale: עִיר допускает значения города и укреплённого населённого пункта; «городов» сохраняет прямое обобщающее обозначение, а «всего» ясно связывает число со всеми названными поселениями.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Не добавляет отсутствующего в источнике существительного и сохраняет некоторую неопределённость референта.
- source_word: בְּנֵי מָכִיר
  choice: сыновья Махира
  rationale: Формально воспроизводит генеалогическое выражение, которое в данном контексте может обозначать потомков или членов рода, а не только непосредственных сыновей.
- source_word: אֲבִי גִלְעָד
  choice: отца Галаада
  rationale: Сохраняет древнееврейскую родословную формулу без её сужения до одного из возможных значений — непосредственного отца, родоначальника или основателя.
theological_decisions:
- issue: Референт выражения כָּל אֵלֶּה и связь с בְּנֵי מָכִיר
  choice: «Все они — сыновья Махира» с поясняющей сноской
  alternative: «Все эти города принадлежали сыновьям Махира»
  rationale: В еврейском тексте нет явного глагола «принадлежали» и нет повторного слова «города». Формальная конструкция допускает генеалогическое прочтение, хотя после перечня городов звучит напряжённо; перевод не устраняет эту неоднозначность молча.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис сделан ясным для обычного читателя, при этом сохранены древние имена, родословная формула и смысловая напряжённость заключительной фразы.
