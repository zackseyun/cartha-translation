  text: וְ/שַׁלּוּם֙ הוֹלִ֣יד אֶת יְקַמְיָ֔ה וִֽ/יקַמְיָ֖ה הֹלִ֥יד אֶת אֱלִישָׁמָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/041.yaml
  text: Shallum fathered Jekamiah, and Jekamiah fathered Elishama.
translation:
  language: ru
  text: Шаллум стал отцом Иекамии, а Иекамия стал отцом Елишамы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: הוֹלִיד / הֹלִיד
  choice: стал отцом
  rationale: В родословном контексте порода hифиль глагола ילד означает «произвести на свет, стать отцом». Эта формулировка естественна для современного русского языка и сохраняет генеалогический смысл.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: Иекамия / а Иекамия
  rationale: Личное имя передано принятой русской библейской формой; повтор имени сохранён в соответствии с еврейским текстом, а союз ו передан как «а» для естественной связи звеньев родословия.
- source_word: אֱלִישָׁמָע
  choice: Елишама
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском языке; его функция выражена синтаксисом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая и ритмичная генеалогическая формула без архаизма «родил». Союз между звеньями передан как «а», чтобы избежать тяжеловесного повторения «и».
