  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: ru
  text: 'Сыновья Яхдая: Регем, Йотам, Гешан, Пелет, Эфа и Шааф.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма множественного числа в сопряжённом состоянии вводит перечень сыновей. Начальный союз וּ естественно не передавать отдельно, поскольку стих представляет собой продолжение генеалогического списка, а в русском самостоятельное «и» здесь утяжеляло бы фразу.
- source_word: יָהְדָּי
  choice: Яхдай
  rationale: Личное имя передано транслитерацией с начальным «Я», отражающим еврейский согласный йод и гласный патах; буква «х» передаёт ה и отличает форму от более сглаженного «Иадай».
- source_word: רֶגֶם
  choice: Регем
  rationale: Личное имя передано близкой русской транслитерацией.
- source_word: יוֹתָם
  choice: Иофам
  rationale: Использована устоявшаяся в русской библейской традиции форма имени, соответствующего также более фонетической передаче «Йотам».
- source_word: גֵישָׁן
  choice: Гешан
  rationale: Личное имя передано транслитерацией; «Гешан» естественно для русского чтения и достаточно близко к масоретской форме.
- source_word: פֶלֶט
  choice: Пелет
  rationale: Личное имя передано прямо, с конечным «т» для ת.
- source_word: עֵיפָה
  choice: Эфа
  rationale: Здесь слово является личным именем, а не названием меры сыпучих тел. Выбрана краткая устоявшаяся русская форма имени.
- source_word: שָׁעַף
  choice: Шааф
  rationale: Транслитерация сохраняет два слога и внутренний гортанный согласный посредством стечения гласных, не перегружая текст специальными знаками.
