base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: ru
  text: 'Халев, сын Хецрона, имел детей от своей жены Азувы и от Иериофы[a]. Вот её сыновья[b]: Иешер, Шовав и Ардон.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская конструкция синтаксически трудна. Иериофу можно понимать как вторую женщину, связанную с Халевом, либо, согласно некоторым толкованиям, как имя, приложенное к имени Азувы.
    reason: alternative_reading
  - marker: b
    text: 'Буквально по-еврейски: «её сыновья»; здесь употреблён суффикс женского рода единственного числа. В некоторых толкованиях эту родословную понимают иначе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: имел детей от
  rationale: Порода hифиль глагола ילד означает «породил, стал отцом». В современной русской генеалогической речи оборот «имел детей от» естественно передаёт отцовство и позволяет связать глагол с названными далее женщинами без искусственной буквальности.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: от своей жены Азувы и от Иериофы
  rationale: Еврейская конструкция сжата и синтаксически трудна. אִשָּׁה понято как приложение к имени Азувы — «жена», а Иериофа в основном тексте представлена как ещё одна женщина; неоднозначность отмечена в сноске.
- source_word: אִשָּׁה
  choice: своей жены
  rationale: В данном генеалогическом контексте слово естественно означает «жена». Притяжательное «своей» не выражено отдельным суффиксом, но необходимо для ясной и идиоматичной русской фразы.
- source_word: יְרִיעוֹת
  choice: Иериофы
  rationale: Личное имя передано в принятой русской библейской форме и поставлено в родительный падеж после предлога «от».
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: Вот её сыновья
  rationale: Суффикс при בָנֶיהָ имеет форму женского рода единственного числа, поэтому сохранено «её», без исправления на «его». Русское местоимение также сохраняет некоторую неясность antecedента.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: Иешер, Шовав и Ардон
  rationale: Личные имена переданы русской транслитерацией, близкой к сложившейся библейской традиции.
theological_decisions:
- issue: Неоднозначность генеалогической связи Азувы и Иериофы
  choice: В основном тексте Иериофа представлена как отдельная женщина, а женский суффикс в выражении «её сыновья» сохранён.
  alternative: Иериофу можно понимать как имя, приложенное к Азуве, либо иначе реконструировать распределение названных сыновей.
  rationale: Масоретский текст синтаксически труден и не позволяет безоговорочно устранить неоднозначность. Основной перевод остаётся читаемым, а альтернативное понимание указано в сносках без навязывания конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционными формами библейских имён. Оборот «имел детей от» выбран вместо архаичного «родил от»; краткая конструкция «Вот её сыновья» сохраняет генеалогический стиль и грамматическую неоднозначность источника.
