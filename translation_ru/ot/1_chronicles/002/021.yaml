base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: ru
  text: После этого Есрон пришёл к[a] дочери Махира, отца Галаада[b], и взял её в жёны[c]. Ему было шестьдесят лет, и она родила ему Сегува.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское выражение можно также передать как «вошёл к»; в этом контексте оно служит сдержанным обозначением супружеского или полового сближения.
    reason: lexical_alternative
  - marker: b
    text: В родословном контексте слово «отец» может означать также предка или основателя рода либо области.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «взял её». Этот глагол в сочетании с женщиной может означать «взял в жёны» или «женился на ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: После этого
  rationale: Передаёт последующее действие в родословном повествовании естественным современным русским выражением.
- source_word: בָּא אֶל
  choice: вошёл к
  rationale: Сохраняет сдержанный древнееврейский оборот, который в данном контексте указывает на супружеское или половое сближение, не делая подразумеваемое излишне явным.
- source_word: בַּת מָכִיר
  choice: дочери Махира
  rationale: Прямо и естественно передаёт древнееврейскую сопряжённую конструкцию.
- source_word: אֲבִי גִלְעָד
  choice: отца Галаада
  rationale: Сохраняет основное значение אָב и родословную формулу, не исключая более широкого смысла «предок» или «основатель».
- source_word: לְקָחָהּ
  choice: взял её
  rationale: Формально близко к древнееврейскому тексту и сохраняет возможность подразумеваемого значения «взял в жёны», не подменяя его разъясняющим переводом.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: Ему тогда было шестьдесят лет
  rationale: Естественно передаёт древнееврейскую формулу указания возраста; «тогда» связывает возраст с описанным действием.
- source_word: וַתֵּלֶד לוֹ
  choice: она родила ему
  rationale: Сохраняет местоименный дательный компонент לוֹ и естественно звучит в русском родословном повествовании.
- source_word: שְׂגוּב
  choice: Сегува
  rationale: Традиционно понятная русская передача имени שְׂגוּב с падежным окончанием после глагола «родила».
theological_decisions:
- issue: Значение родственного обозначения «отец Галаада»
  choice: Сохранено буквальное «отец Галаада»
  alternative: «предок Галаада» или «основатель Галаада»
  rationale: Родословное употребление допускает как непосредственное отцовство, так и более широкое происхождение либо связь с родовой областью; основной текст не должен устранять эту неоднозначность.
- issue: Характер отношений Есрона с дочерью Махира
  choice: Сохранены сдержанные выражения «вошёл к» и «взял её»
  alternative: «сошёлся с ней и женился на ней» или «взял её в жёны»
  rationale: Контекст предполагает супружеский союз, однако древнееврейские выражения не формулируют его современным юридическим термином; перевод сохраняет эвфемизм и смысловое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Родословная сжатость оригинала сохранена, но длинная древнееврейская цепочка разделена на более ясные русские предложения. Эвфемистические и генеалогические неоднозначности вынесены в примечания.
