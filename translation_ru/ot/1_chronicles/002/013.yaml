lexical_decisions:
- source_word: וְאִישַׁי
  choice: И Иессей
  rationale: Союз וְ продолжает родословное перечисление; имя передано в принятой русской библейской форме «Иессей».
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד в родословиях означает «породил, стал отцом»; современное «стал отцом» сохраняет мужскую генеалогическую связь без архаизма «родил» применительно к мужчине.
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: первенца своего Елиава
  rationale: בְּכֹרוֹ означает «его первенца», а Елиав стоит в приложении; порядок «первенца своего» поддерживает достоинство родословного стиля.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: второго — Аминадава
  rationale: Порядковое числительное относится к месту сына в перечне. Имя передано традиционной русской библейской формой «Аминадав».
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: а третьего — Шимы
  rationale: Форма שִׁמְעָא в данном масоретском тексте передана как «Шима», без замены на вариант имени из параллельного места; конструкция ясно обозначает третьего сына.
