  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: ru
  text: А Азува умерла, и Халев взял себе в жёны Ефрату[a], и она родила ему Хура.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женился на Ефрате». Буквально по-еврейски: «взял себе Ефрату» — это выражение означает вступление в брак. Имя здесь имеет краткую форму «Ефрата»; в других местах встречается родственная форма «Ефрафа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: умерла
  rationale: Прямой и обычный эквивалент формы Qal wayyiqtol от מות; эвфемизм здесь не требуется.
- source_word: עֲזוּבָה
  choice: Азува
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: וַיִּקַּח לוֹ
  choice: взял себе в жёны
  rationale: Оборот לקח с женщиной в качестве дополнения является идиомой вступления в брак; формулировка сохраняет образ еврейского выражения и ясно передаёт его смысл.
- source_word: כָלֵב
  choice: Халев
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: אֶפְרָת
  choice: Ефрату
  rationale: Передана краткая форма имени אֶפְרָת, стоящая именно в этом стихе; окончание -у обусловлено русским винительным падежом.
- source_word: וַתֵּלֶד לוֹ
  choice: она родила ему
  rationale: Естественно передаёт рождение ребёнка и сохраняет выраженное местоимением לוֹ значение косвенного объекта.
- source_word: חוּר
  choice: Хура
  rationale: Использована традиционная русская библейская форма имени; окончание -а обусловлено винительным падежом.
