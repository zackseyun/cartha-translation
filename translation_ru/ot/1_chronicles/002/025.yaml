base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: ru
  text: 'Сыновья Иерахмеила[a], первенца Хецрона, были: Рам, его первенец, Буна, Орен, Оцем и Ахия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский синтаксис позволяет понимать этот стих как перечень пяти сыновей Иерахмеила, причём Рам назван его первенцем. Некоторые толкователи иначе связывают имя «Ахия» с перечнем, однако согласно наиболее прямому прочтению Ахия — ещё один сын в этом ряду.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: были
  rationale: В родословном перечне глагол היה вводит состав семьи; «были» естественно передаёт эту функцию.
- source_word: בְנֵי
  choice: сыновьями
  rationale: В данном родословном контексте слово обозначает сыновей мужского пола и сохраняет конкретный генеалогический смысл еврейского текста.
- source_word: יְרַחְמְאֵל
  choice: Иерахмеила
  rationale: Имя передано транслитерацией, учитывающей сложившуюся русскую библейскую форму.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: первенца Хецрона
  rationale: Оборот указывает на положение Иерахмеила среди сыновей Хецрона и сохранён как приложение.
- source_word: הַבְּכוֹר
  choice: его первенец
  rationale: Определение относится к Раму; местоимение естественно проясняет, что Рам был первенцем Иерахмеила, не устраняя повторение исходного текста.
- source_word: רָם
  choice: Рам
  rationale: Личное имя передано транслитерацией.
- source_word: וּבוּנָה
  choice: Буна
  rationale: Личное имя передано транслитерацией.
- source_word: וָאֹרֶן
  choice: Орен
  rationale: Личное имя передано транслитерацией.
- source_word: וָאֹצֶם
  choice: Оцем
  rationale: Личное имя передано транслитерацией с различением еврейской согласной צ.
- source_word: אֲחִיָּה
  choice: Ахия
  rationale: Личное имя передано в естественной русской библейской форме.
