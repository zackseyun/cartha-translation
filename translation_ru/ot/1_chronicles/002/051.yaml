- source_word: שַׂלְמָא
  choice: Салма
  rationale: Личное имя передано традиционной русской транслитерацией, близкой к еврейской форме.
- source_word: אֲבִי
  choice: отец
  rationale: Буквально сохраняет еврейское слово; в родословных оно может обозначать не только непосредственного отца, но также предка или основателя рода либо поселения.
- source_word: בֵית לָחֶם
  choice: Вифлеем
  rationale: Использовано прочно установившееся русское название города.
- source_word: חָרֵף
  choice: Хареф
  rationale: Личное имя транслитерировано согласно согласным и огласовке данной формы масоретского текста.
- source_word: בֵית גָּדֵר
  choice: Бет-Гадер
  rationale: Сочетание, вероятно, является географическим названием; транслитерация сохраняет его топонимическую форму и не превращает в буквальное «дом Гадера».
