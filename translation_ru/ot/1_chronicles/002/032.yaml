  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: ru
  text: 'Сыновья Иады, брата Шаммая: Иефер и Ионафан. Иефер умер, не оставив сыновей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма сопряжённого состояния множественного числа от בֵּן вводит новую генеалогическую ветвь; начальный союз в русском перечислении можно не выражать отдельно.
- source_word: יָדָע
  choice: Иада
  rationale: Традиционная и узнаваемая русская библейская передача еврейского личного имени יָדָע.
- source_word: אֲחִי שַׁמַּי
  choice: брата Шаммая
  rationale: Буквальное родственное обозначение точно передаёт конструкцию «брат Шаммая» и естественно звучит как приложение к имени.
- source_word: יֶתֶר
  choice: Иефер
  rationale: Традиционная русская библейская передача имени; одинаково употреблена в обоих вхождениях.
- source_word: וְיוֹנָתָן
  choice: и Ионафан
  rationale: Союз сохранён; имя передано в принятой русской библейской форме.
- source_word: וַיָּמָת
  choice: умер
  rationale: Нарративная форма обозначает следующее событие; простой глагол прошедшего времени естественен в русской генеалогической прозе.
- source_word: לֹא בָנִים
  choice: не оставив сыновей
  rationale: Эллиптическое буквальное выражение «не сыновья» по смыслу указывает, что после Иефера не осталось сыновей; деепричастный оборот ясно и естественно передаёт это по-русски.
theological_decisions:
- issue: Указывает ли לֹא בָנִים на полную бездетность Иефера
  choice: не оставив сыновей
  alternative: не оставив детей
  rationale: В источнике прямо названы именно сыновья; перевод не расширяет утверждение до отсутствия дочерей или полной бездетности.
translation_notes:
  register: Современный литературный русский язык с кратким, сдержанным генеалогическим стилем. Сохранены традиционные русские формы библейских имён; синтаксис сделан естественным без утраты содержания еврейского текста.
