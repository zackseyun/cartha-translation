  text: У Иерахмеила была ещё одна жена, по имени Атара; она была матерью Онама.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: была и
  rationale: 'Конструкция היה с ל при лице выражает обладание: буквально «была у Иерахмеила». Частица «и» передаёт связующий וַ в контексте дополнительной жены.'
- source_word: אִשָּׁה אַחֶרֶת
  choice: другая жена
  rationale: В генеалогическом контексте אִשָּׁה означает «жена», а אַחֶרֶת указывает на ещё одну, отличную от ранее упомянутой.
- source_word: לִירַחְמְאֵל
  choice: у Иерахмеила
  rationale: Предлог ל в сочетании с היה естественно передан русской конструкцией обладания «у ... была»; имя транслитерировано в принятой русской библейской форме.
- source_word: וּשְׁמָהּ
  choice: по имени
  rationale: Еврейская формула «и имя её» естественно и без потери смысла передаётся современным русским оборотом «по имени».
- source_word: עֲטָרָה
  choice: Атара
  rationale: Личное имя передано транслитерацией, а не переводом его значения.
- source_word: הִיא
  choice: она
  rationale: Самостоятельное местоимение сохранено; в русском оно ясно выделяет Атару как мать названного сына.
- source_word: אֵם
  choice: матерью
  rationale: Прямое лексическое соответствие в именной конструкции «она была матерью».
- source_word: אוֹנָם
  choice: Онама
  rationale: Личное имя передано транслитерацией и поставлено в требуемый русским управлением родительный падеж.
