lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: передано двоеточием в генеалогическом перечне
  rationale: Форма «и были» вводит перечень; в современном русском её значение естественно выражается именной конструкцией с двоеточием.
- source_word: בְנֵי
  choice: сыновья
  rationale: В данном генеалогическом контексте перечислены мужчины, поэтому прямое соответствие «сыновья» точнее общего «дети» или «потомки».
- source_word: רָם
  choice: Рам
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בְּכוֹר
  choice: первенец
  rationale: Слово стоит перед именем Иерахмеила и определяет его как первенца Рама; русское приложение сохраняет краткость исходного текста.
- source_word: יְרַחְמְאֵל
  choice: Иерахмеил
  rationale: Личное имя передано в форме, укоренённой в русской библейской традиции.
- source_word: מַעַץ
  choice: Маас
  rationale: Личное имя передано согласно принятой русской библейской форме.
- source_word: יָמִין
  choice: Иамин
  rationale: Здесь это личное имя, а не нарицательное значение корня; использована традиционная русская форма.
- source_word: עֵקֶר
  choice: Екер
  rationale: Личное имя транслитерировано с учётом начального ע и традиционного русского написания.
