  text: Хур стал отцом Ури, и Ури стал отцом Бецалела.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּר
  choice: Хур
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В породной форме (хифиль) глагол ילד в родословиях обозначает отцовство/происхождение по мужской линии. Оборот «стал отцом» естественен в современном русском и не имеет архаического оттенка слова «родил» применительно к мужчине.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, не имеющий самостоятельного русского соответствия; его синтаксическая функция передана строением предложения.
- source_word: אוּרִי
  choice: Ури
  rationale: Личное имя транслитерировано в соответствии с принятой русской библейской формой.
- source_word: וְ
  choice: а
  rationale: Союз связывает две последовательные родословные формулы; русское «а» естественно отмечает переход к следующему поколению, не выражая противопоставления.
- source_word: בְּצַלְאֵל
  choice: Бецалел
  rationale: Личное имя передано в форме, близкой к еврейскому произношению и употребительной в современных русских переводах.
