base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/011.yaml
  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: ru
  text: Нахшон стал отцом Салмы[a], а Салма стал отцом Боаза.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. Салма; в некоторых переводах стоит «Салмон» для согласования с другими родословиями (например, Руфь 4:20–21; Мф. 1:4–5).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: Нахшон
  rationale: Личное имя передано транслитерацией с еврейского; начальный союз естественно не выражен отдельно в начале русского предложения.
- source_word: הוֹלִיד
  choice: был отцом
  rationale: В родословии порода hифиль глагола ילד означает «породил, стал отцом». Формулировка «был отцом» естественна для современного русского языка и сохраняет мужскую генеалогическую связь.
- source_word: אֶת
  choice: '[не переводится]'
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском языке.
- source_word: שַׂלְמָא
  choice: Салма
  rationale: Еврейская форма в данном стихе — שַׂלְמָא; имя передано непосредственно, без согласования с формой «Салмон» в параллельных родословиях.
- source_word: וְ/שַׂלְמָא
  choice: а Салма
  rationale: Союз ו передан русским «а», которое естественно связывает два последовательных звена родословия; имя соответствует форме исходного текста.
- source_word: בֹּעַז
  choice: Боаз
  rationale: Традиционная и узнаваемая русская передача еврейского личного имени בֹּעַז.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая формула родословия без архаичного «родил». Частица «а» обеспечивает естественное последовательное повествование. Маркер сноски поставлен непосредственно после имени.
