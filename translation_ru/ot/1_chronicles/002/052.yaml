base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: ru
  text: 'У Шовала, отца Кириат-Иарима[a], были сыновья: Хароэ[b] и половина менухотян[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «основателя Кириат-Иарима». В родословиях слово «отец» может обозначать предка, основателя или главу, связанного с городом.'
    reason: lexical_alternative
  - marker: b
    text: Имя Хароэ в некоторых традициях передаётся как «Реая».
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «половина Менухота». Возможно также: «половина жителей (или рода) Менухота». Связь этого выражения с именем Хароэ в еврейском тексте не вполне ясна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: У Шовала … были сыновья
  rationale: Естественная русская передача еврейской генеалогической формулы «были сыновья у/для Шовала».
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: отца Кириат-Иарима
  rationale: Буквальное «отец» сохраняет многозначность генеалогического обозначения; возможный смысл «основатель» указан в сноске.
- source_word: קִרְיַת יְעָרִים
  choice: Кириат-Иарим
  rationale: Название поселения передано транслитерацией, а не переведено как «город лесов».
- source_word: הָרֹאֶה
  choice: Хароэ
  rationale: В генеалогическом контексте форма понята как имя собственное и транслитерирована без сведения её к нарицательному «провидец».
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: половина менухотян
  rationale: Передаёт вероятное указание на половину рода или населения Менухота, при этом альтернативное географическое понимание сохранено в сноске.
