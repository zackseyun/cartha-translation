lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма сопряжённого состояния множественного числа от בֵּן в данном родословии обозначает непосредственных сыновей; это подтверждается контекстом перечисления двух сыновей Фареса.
- source_word: פֶרֶץ
  choice: Фареса
  rationale: Личное имя передано в традиционной русской библейской форме «Фарес» и поставлено в родительном падеже после слова «сыновья».
- source_word: חֶצְרוֹן
  choice: Есром
  rationale: Личное имя передано в закрепившейся русской библейской форме «Есром», обеспечивающей узнаваемость в родословиях.
- source_word: וְחָמוּל
  choice: и Хамул
  rationale: Союз וְ передан как «и», а личное имя חָמוּל — близкой к еврейскому звучанию и принятой в русском употреблении формой «Хамул».
