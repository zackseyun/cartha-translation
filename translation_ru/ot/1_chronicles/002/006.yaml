lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сохраняет соединительный союз и обычное для родословий значение формы множественного числа в сопряжённом состоянии.
- source_word: זֶרַח
  choice: Зерах
  rationale: Личное имя передано современной русской транслитерацией с еврейского.
- source_word: זִמְרִי
  choice: Зимри
  rationale: Личное имя транслитерировано непосредственно с еврейского.
- source_word: וְאֵיתָן
  choice: Этан
  rationale: Передаёт еврейское личное имя без опоры на устаревшую традиционную форму.
- source_word: וְהֵימָן
  choice: Хеман
  rationale: Начальный еврейский ה передан через «х», а имя дано в современной русской форме.
- source_word: וְכַלְכֹּל
  choice: Калкол
  rationale: Форма отражает согласные масоретского текста; вариант «Халкол» отмечен в сноске.
- source_word: וָדָרַע
  choice: Дара
  rationale: Основной текст следует чтению данного стиха, не уподобляя его параллельному месту в 3 Царств 4:31.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: всего пятеро
  rationale: Естественная русская передача буквального «все они — пять»; форма «пятеро» уместна для группы мужчин.
