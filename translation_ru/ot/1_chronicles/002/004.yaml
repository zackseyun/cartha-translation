  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: ru
  text: А Фамарь, его невестка, родила ему Фареса и Зару. Всего сыновей у Иуды было пятеро.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть всего пять сыновей: Ир, Онан, Шела, Фарес и Зара.'
    reason: cross_reference
lexical_decisions:
- source_word: תָמָר
  choice: Фамарь
  rationale: Традиционная и узнаваемая русская библейская форма личного имени; она соответствует принятому русскому ономастическому употреблению.
- source_word: כַּלָּתוֹ
  choice: его невестка
  rationale: כַּלָּה с суффиксом 3-го лица мужского рода ед. числа обозначает жену сына; «невестка» — естественный современный русский термин в данном контексте.
- source_word: יָלְדָה
  choice: родила
  rationale: Форма Qal перфекта 3-го лица женского рода ед. числа от ילד прямо обозначает рождение детей и естественно звучит в родословии.
- source_word: לוֹ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом выражает отношение рождённых детей к Иуде; краткое «ему» сохраняет структуру и смысл еврейского текста.
- source_word: פֶּרֶץ
  choice: Фарес
  rationale: Традиционная русская библейская форма имени, понятная читателю и согласованная с русской библейской ономастикой.
- source_word: זָרַח
  choice: Зара
  rationale: Традиционная русская библейская форма данного личного имени.
- source_word: כָּל בְּנֵי יְהוּדָה
  choice: Всего сыновей у Иуды
  rationale: Передаёт и значение כָּל как итогового охвата, и בְּנֵי как «сыновей», сохраняя родословный характер фразы.
- source_word: חֲמִשָּׁה
  choice: было пятеро
  rationale: Собирательное числительное «пятеро» естественно сочетается с обозначением лиц мужского пола и ясно передаёт итоговое число.
theological_decisions:
- issue: Итоговый подсчёт сыновей Иуды
  choice: «Всего сыновей у Иуды было пятеро»
  alternative: «Все сыновья Иуды — пятеро»
  rationale: Еврейская фраза является простым итогом перечисления. Выбранный вариант ясно передаёт общее число, не добавляя богословского толкования.
- issue: Гендерно определённые термины родства
  choice: Сохранить «невестка» и «сыновей»
  alternative: Использовать нейтральные «родственница» и «дети»
  rationale: Исходный текст употребляет конкретный термин свойства и обозначение сыновей; их нейтрализация уменьшила бы точность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным родословным стилем. Начальное וְ передано союзом «А», отмечающим продолжение повествования. Традиционные русские формы библейских имён сохранены ради узнаваемости.
