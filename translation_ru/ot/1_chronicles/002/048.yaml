lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: наложница
  rationale: Слово обозначает женщину, состоявшую в признанном, но подчинённом брачном союзе; «наложница» — краткий и традиционно понятный русский эквивалент.
- source_word: כָּלֵב
  choice: Халев
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: מַעֲכָה
  choice: Мааха
  rationale: Личное имя передано в принятой русской библейской форме, отражающей еврейское מַעֲכָה.
- source_word: יָלַד
  choice: родила
  rationale: В родословиях глагол может иметь более широкое значение произведения потомства, но при явно женском подлежащем естественное и точное русское соответствие — «родила».
- source_word: שֶׁבֶר
  choice: Шевер
  rationale: Транслитерация личного имени с учётом еврейского произношения.
- source_word: וְאֶת
  choice: и
  rationale: Союз соединяет второй прямой объект с первым; показатель прямого объекта отдельно по-русски не передаётся.
- source_word: תִּרְחֲנָה
  choice: Тирхана
  rationale: Транслитерация личного имени с передачей еврейской согласной ח через «х».
