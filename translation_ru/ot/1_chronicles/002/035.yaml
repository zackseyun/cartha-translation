base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: ru
  text: Шешан отдал свою дочь в жёны Иархе, своему рабу[a], и она родила ему Аттая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуге». Еврейское עֶבֶד может означать как раба, так и слугу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: отдал
  rationale: В брачном контексте נתן означает передачу дочери в жёны; «отдал … в жёны» естественно по-русски и сохраняет структуру еврейского выражения.
- source_word: שֵׁשָׁן
  choice: Шешан
  rationale: Передача еврейского личного имени в форме, принятой в современной русской библейской традиции.
- source_word: בִּתּוֹ
  choice: свою дочь
  rationale: Точно передаёт существительное с притяжательным суффиксом третьего лица мужского рода.
- source_word: לְיַרְחָע
  choice: Иархе
  rationale: Личное имя передано в дательном падеже согласно функции предлога לְ.
- source_word: עַבְדּוֹ
  choice: своему рабу
  rationale: עֶבֶד может обозначать и слугу, и раба. Здесь зависимое положение Иархи в доме Шешана существенно для родословного повествования; контекст предыдущего стиха также подчёркивает его статус. Альтернатива отмечена в сноске.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Устойчивое и естественное русское соответствие еврейскому брачному выражению, буквально «в качестве жены».
- source_word: וַתֵּלֶד
  choice: она родила
  rationale: Qal глагола ילד при подлежащем женского рода означает «родила»; местоимение делает русскую фразу ясной.
- source_word: לוֹ
  choice: ему
  rationale: Сохраняет еврейскую формулу рождения и указывает на отцовство Иархи.
- source_word: עַתָּי
  choice: Аттая
  rationale: Личное имя «Аттай» поставлено в винительном падеже как прямое дополнение.
