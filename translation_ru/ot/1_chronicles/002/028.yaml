base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: ru
  text: 'Сыновья Онама: Шаммай и Иада. Сыновья Шаммая: Надав и Авишур.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 'Сыновья Онама:'
  rationale: В родословной формуле היה служит связкой; в современном русском естественно передать её именным предложением с двоеточием, не добавляя тяжеловесного «были».
- source_word: בְנֵי
  choice: сыновья
  rationale: Контекст перечисляет непосредственных потомков мужского пола, поэтому «сыновья» точнее, чем более широкие «дети» или «потомки».
- source_word: אוֹנָם
  choice: Онам
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: שַׁמַּי
  choice: Шаммай
  rationale: Личное имя последовательно передано одной и той же формой в обоих случаях.
- source_word: יָדָע
  choice: Иада
  rationale: Личное имя передано традиционной русской библейской формой, отражающей еврейское יָדָע.
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Союз ו вводит следующую ветвь родословной. В русском отдельное предложение без начального «и» звучит естественнее, при этом повтор формулы сохранён.
- source_word: נָדָב
  choice: Надав
  rationale: Личное имя передано принятой русской библейской формой.
- source_word: אֲבִישׁוּר
  choice: Авишур
  rationale: Личное имя передано принятой русской библейской формой.
