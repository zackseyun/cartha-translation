base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: ru
  text: 'Сыновья Карми: Ахар[a], навлёкший беду на Израиль, проявив неверность в отношении заклятого[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ахан». Здесь, в Паралипоменоне, употреблена форма «Ахар», вероятно созвучная следующему еврейскому слову со значением «наводящий беду». См. Иисус Навин 7.'
    reason: alternative_reading
  - marker: b
    text: То есть того, что находилось под заклятием и было предназначено уничтожению.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כַּרְמִי
  choice: Сыновья Карми
  rationale: Сохранена стандартная родословная формула с множественным числом בְנֵי, хотя далее назван один потомок.
- source_word: עָכָר
  choice: Ахар
  rationale: Передана форма имени именно в Паралипоменоне, עָכָר, без согласования с более известной формой עָכָן («Ахан») в Иисусе Навине 7.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: навлёкший беду на Израиль
  rationale: Причастный оборот естественно передаёт действие того, кто причинил Израилю беду; точную еврейскую игру между именем עָכָר и причастием עוֹכֵר по-русски воспроизвести невозможно.
- source_word: מָעַל
  choice: проявил неверность
  rationale: Глагол обозначает вероломное нарушение обязательства, нередко святотатство; выбранная формулировка сохраняет нравственно-религиозный смысл, не сужая его до конкретного действия.
- source_word: בַּחֵרֶם
  choice: в отношении заклятого
  rationale: Субстантивированное «заклятое» кратко передаёт חֵרֶם как то, что по Божьему повелению было изъято из обычного употребления и предназначено уничтожению; пояснение дано в сноске.
theological_decisions:
- issue: Значение חֵרֶם в рассказе о святотатстве и суде
  choice: заклятое
  alternative: предназначенное уничтожению; находившееся под заклятием
  rationale: Основной текст сохраняет ёмкий сакрально-правовой термин, не сводя его только к запрету или уничтожению; необходимое пояснение вынесено в сноску.
- issue: Форма имени עָכָר и связь с Иисусом Навином 7
  choice: Ахар
  alternative: Ахан
  rationale: Сохранена форма масоретского текста Паралипоменона и заложенная в ней связь со следующим словом «навлёкший беду», без гармонизации с именем в книге Иисуса Навина.
translation_notes:
  register: Современный литературный русский язык с краткой родословной формулой. Формулировка сохраняет необычную форму имени, смысл обвинения и специальное значение חֵרֶם; непередаваемая напрямую игра слов пояснена в сноске.
