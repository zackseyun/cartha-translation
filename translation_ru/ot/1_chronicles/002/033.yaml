  text: וּ/בְנֵ֥י יוֹנָתָ֖ן פֶּ֣לֶת וְ/זָזָ֑א אֵ֥לֶּה הָי֖וּ בְּנֵ֥י יְרַחְמְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/033.yaml
  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: ru
  text: 'А сыновья Ионафана: Пелет и Заза. Они были сыновьями Иерахмеила.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: А сыновья
  rationale: Союз ו передан как «А», естественно продолжающее родословное перечисление; בְּנֵי сохраняется как «сыновья».
- source_word: יוֹנָתָן
  choice: Ионафана
  rationale: Имя передано в традиционной русской библейской форме и поставлено в родительном падеже по нормам русского синтаксиса.
- source_word: פֶּלֶת
  choice: Пелет
  rationale: Еврейское личное имя транслитерировано в форме, близкой к исходному звучанию.
- source_word: וְזָזָא
  choice: и Заза
  rationale: Соединительный союз сохранён; личное имя транслитерировано.
- source_word: אֵלֶּה הָיוּ
  choice: Они были
  rationale: Указательное אֵלֶּה относится к только что названным лицам; в современном русском повтор «эти» звучал бы тяжеловесно, поэтому естественно употреблено «они». הָיוּ передано как связка «были».
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: сыновьями Иерахмеила
  rationale: Формальное обозначение родства «сыновья» сохранено без расширения до «потомков»; имя дано в традиционной русской библейской форме.
