source:
  edition: WLC
  text: בְּנֵ֣י שַׂלְמָ֗א בֵּ֥ית לֶ֨חֶם֙ וּ/נְט֣וֹפָתִ֔י עַטְר֖וֹת בֵּ֣ית יוֹאָ֑ב וַ/חֲצִ֥י הַ/מָּנַחְתִּ֖י הַ/צָּרְעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: ru
  text: 'Сыновья Салмы: Вифлеем, нетофатяне, Атрот-Бет-Иоав, половина манахтян[a], цоряне[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «менухотян». Точная связь еврейского названия с тем или иным местом неясна.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть жители или выходцы из Цоры; возможно также передать: «цоратяне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Сохранена формула родословия; в данном перечне она может обозначать не только непосредственных сыновей, но также потомков и родовые группы.
- source_word: שַׂלְמָא
  choice: Салмы
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительном падеже по синтаксису фразы.
- source_word: בֵּית לֶחֶם
  choice: Вифлеем
  rationale: Использована традиционная русская форма топонима; в контексте родословного перечня название, вероятно, представляет связанную с Вифлеемом общину или род.
- source_word: וּנְטוֹפָתִי
  choice: нетофатяне
  rationale: Форма является этнохоронимом и здесь естественно понимается собирательно как жители или родовая группа из Нетофы.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: Атрот-Бет-Иоав
  rationale: Сочетание передано как составное собственное имя места или рода, а не переведено буквально как «венцы дома Иоава».
- source_word: וַחֲצִי
  choice: половина
  rationale: Передаёт буквальное значение существительного; соединительный союз в русском перечне естественно выражен пунктуацией.
- source_word: הַמָּנַחְתִּי
  choice: манахтян
  rationale: Еврейская форма с артиклем обозначает группу людей, вероятно связанную с Манахатом; избрана естественная русская форма множественного числа.
- source_word: הַצָּרְעִי
  choice: цоряне
  rationale: Этнохороним передан как название людей, связанных с Цорой, при сохранении транслитерационной формы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткой структуры родословного перечня. Традиционная форма «Вифлеем» сочетается с последовательной передачей малоизвестных этнохоронимов и составного собственного имени. Маркеры сносок поставлены непосредственно после слов, к которым относятся варианты.
