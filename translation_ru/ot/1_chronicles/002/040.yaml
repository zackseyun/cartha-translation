  yaml_path: translation/ot/1_chronicles/002/040.yaml
  text: Eleasah fathered Sismai, and Sismai fathered Shallum.
translation:
  language: ru
  text: Елеаса стал отцом Сисмая, а Сисмай стал отцом Шаллума.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: Елеаса
  rationale: Личное имя передано принятой русской библейской транслитерацией, соответствующей еврейской форме.
- source_word: הֹלִיד
  choice: стал отцом
  rationale: Порода hифиль глагола ילד в родословиях означает «родить, произвести на свет, стать отцом». Выражение «стал отцом» точно передаёт генеалогический смысл и естественно звучит на современном русском языке.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, не имеющий самостоятельного соответствия в русском языке; его функция выражена синтаксисом.
- source_word: סִסְמָי
  choice: Сисмай
  rationale: Личное имя транслитерировано с еврейского; окончание имени сохранено без искусственной русификации.
- source_word: וְ
  choice: а
  rationale: Союз связывает две последовательные ступени родословия. Русское «а» естественно продолжает цепочку, выделяя смену подлежащего, не вводя смыслового противопоставления.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Личное имя передано традиционной русской библейской формой, близкой к еврейскому звучанию.
theological_decisions: []
