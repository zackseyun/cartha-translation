  text: וְ/עַתַּי֙ הֹלִ֣יד אֶת נָתָ֔ן וְ/נָתָ֖ן הוֹלִ֥יד אֶת זָבָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/036.yaml
  text: Attai fathered Nathan, and Nathan fathered Zabad.
translation:
  language: ru
  text: Аттай стал отцом Нафана, а Нафан стал отцом Завада.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתַּי
  choice: Аттай
  rationale: Личное имя передано традиционной русской библейской транслитерацией; начальный союз в русском не требуется, поскольку стих продолжает родословный перечень.
- source_word: הֹלִיד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד в родословии означает «породил, стал отцом». Современное выражение «стал отцом» естественно и точно передаёт генеалогическую связь без архаизма.
- source_word: אֶת
  choice: отдельно не переведено
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском и выражен синтаксисом.
- source_word: נָתָן
  choice: Нафана
  rationale: Личное имя передано в традиционной русской библейской форме и поставлено в родительный падеж после выражения «стал отцом».
- source_word: וְ/נָתָן
  choice: а Нафан
  rationale: Союз ו передан как «а», что естественно связывает последовательные звенья русской родословной; имя дано в традиционной форме.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Тот же глагол в той же генеалогической функции переведён последовательно.
- source_word: זָבָד
  choice: Завада
  rationale: Личное имя передано в традиционной русской библейской форме и поставлено в родительный падеж.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, ясная формула родословия. Выражение «стал отцом» сохраняет буквальную генеалогическую связь и звучит естественнее архаического «родил» применительно к мужчине.
