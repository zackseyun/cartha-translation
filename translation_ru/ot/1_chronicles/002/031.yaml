lexical_decisions:
- source_word: וּבְנֵי
  choice: сыновья
  rationale: В родословной формула בְּנֵי может обозначать как непосредственных сыновей, так и потомков; «сыновья» наиболее прямо передаёт еврейское выражение, а более широкое значение отмечено в сноске.
- source_word: אַפַּיִם
  choice: Аппаим
  rationale: Личное имя передано транслитерацией, близкой к еврейскому звучанию и естественной для русской библейской ономастики.
- source_word: יִשְׁעִי
  choice: Ишъи
  rationale: Транслитерация сохраняет согласный ע посредством разделительного знака и отличает это имя от יִשַׁי (Иессей).
- source_word: שֵׁשָׁן
  choice: Шешан
  rationale: Личное имя транслитерировано непосредственно с еврейского.
- source_word: אַחְלָי
  choice: Ахлай
  rationale: Личное имя транслитерировано непосредственно с еврейского; грамматическая форма стиха не уточняет пол или родственную степень названного лица.
