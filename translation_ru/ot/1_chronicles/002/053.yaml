base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: ru
  text: 'И роды[a] Кириат-Иеарима: итритяне, путитяне, шуматитяне и мишраитяне. От них произошли[b] цораитяне и эштаолитяне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семейства»; еврейское слово может обозначать расширенные родственные группы внутри племени или родословной.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вышли»; здесь речь идёт о происхождении названных групп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: И роды
  rationale: В родословном контексте מִשְׁפָּחוֹת обозначает расширенные родственные объединения, а не только отдельные семьи; «роды» естественно передаёт это значение по-русски.
- source_word: קִרְיַת יְעָרִים
  choice: Кириат-Иеарима
  rationale: 'Название места передано транслитерацией; падежная форма обусловлена русским синтаксисом: «роды Кириат-Иеарима».'
- source_word: הַיִּתְרִי וְהַפּוּתִי וְהַשֻּׁמָתִי וְהַמִּשְׁרָעִי
  choice: итритяне, путитяне, шуматитяне и мишраитяне
  rationale: Еврейские обозначения родовых групп переданы русскими этнонимическими формами во множественном числе, что соответствует собирательному значению перечисления.
- source_word: מֵאֵלֶּה
  choice: От них
  rationale: Местоимение отсылает к только что перечисленным родам; «от них» кратко и естественно выражает эту связь.
- source_word: יָצְאוּ
  choice: произошли
  rationale: Буквально глагол означает «вышли», но здесь описывает генеалогическое происхождение. «Произошли» ясно передаёт контекст, а буквальный образ сохранён в сноске.
- source_word: הַצָּרְעָתִי וְהָאֶשְׁתָּאֻלִי
  choice: цоритяне и эштаолитяне
  rationale: Обозначения групп, связанных с Цорой и Эштаолом, переданы последовательной транслитерацией и естественными русскими формами множественного числа.
