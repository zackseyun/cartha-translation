  text: וּ/בְנֵ֥י חֶצְר֖וֹן אֲשֶׁ֣ר נוֹלַד ל֑/וֹ אֶת יְרַחְמְאֵ֥ל וְ/אֶת רָ֖ם וְ/אֶת כְּלוּבָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: ru
  text: 'Сыновья Хецрона, родившиеся у него: Иерахмеил, Рам и Келувай[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Келувай, вероятно, тот же человек, который в других местах этой родословной назван Халевом.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма множественного числа בֵּן в сопряжённом состоянии означает «сыновья [кого-либо]». Начальный союз ו естественно не передаётся в отдельном генеалогическом перечне.
- source_word: חֶצְרוֹן
  choice: Хецрон
  rationale: Имя передано транслитерацией с сохранением начального ח как «х» и согласного צ как «ц».
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: родившиеся у него
  rationale: Причастная конструкция с нифалем ילד и לו передана пассивно-возвратным оборотом, сохраняющим смысл «которые были рождены ему» и естественно звучащим по-русски.
- source_word: אֶת
  choice: —
  rationale: Показатель определённого прямого дополнения не имеет отдельного соответствия в русском переводе.
- source_word: יְרַחְמְאֵל
  choice: Иерахмеил
  rationale: Личное имя передано в узнаваемой русской библейской форме.
- source_word: רָם
  choice: Рам
  rationale: Личное имя передано прямой транслитерацией.
- source_word: כְּלוּבָי
  choice: Келувай
  rationale: Передана именно засвидетельствованная здесь форма имени Келувай, без гармонизации с именем Халев; возможное отождествление вынесено в сноску.
theological_decisions:
- issue: Отождествление Келувая с Халевом
  choice: В основном тексте сохранено имя Келувай
  alternative: Халев
  rationale: Еврейский текст данного стиха содержит כְּלוּבָי, поэтому возможное генеалогическое отождествление с Халевом не должно молча заменять засвидетельствованную форму.
translation_notes:
  register: Современный литературный русский язык; краткая именная конструкция соответствует стилю родословия. Имена переданы ясно и без конфессиональной гармонизации.
