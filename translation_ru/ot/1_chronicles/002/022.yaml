base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: ru
  text: Сегув стал отцом Иаира, и у него было двадцать три города в земле Галаада.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «у него» формально не уточняет, относится ли местоимение к Сегуву или к Иаиру; по контексту, особенно по следующему стиху, вероятнее имеется в виду Иаир.
    reason: Сохраняет неоднозначность местоимения в исходном тексте, не приписывая ему в основном тексте однозначный антецедент.
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: Сегув
  rationale: Имя передано в форме, принятой в русской библейской традиции; начальный союз וּ передан связью с предшествующим контекстом, но в отдельном стихе не выражен искусственным начальным «и».
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד в родословиях означает «породил, стал отцом»; выбран современный и достойный русский эквивалент без архаизма «родил» применительно к мужчине.
- source_word: יָאִיר
  choice: Иаира
  rationale: Личное имя передано в традиционной русской библейской форме и поставлено в винительный падеж по синтаксису предложения.
- source_word: וַיְהִי לוֹ
  choice: и у того было
  rationale: Конструкция היה + ל выражает обладание. Указательное «у того» естественно относит местоимение к ближайшему лицу — Иаиру, не устраняя грамматическую неоднозначность отдельного стиха полностью.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: двадцать три
  rationale: Числительное передано в обычной современной русской форме.
- source_word: עָרִים
  choice: города
  rationale: עִיר может означать город или поселение; «города» соответствует обычному значению слова и характеру территориального сообщения.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: в земле Галаадской
  rationale: Сохранено полное географическое выражение אֶרֶץ הַגִּלְעָד в естественной традиционной русской форме.
theological_decisions:
- issue: К кому относится местоимение לוֹ («у него»)
  choice: 'В основном тексте: «у того», то есть у Иаира'
  alternative: «у него», что в русском может быть понято как относящееся к Сегуву
  rationale: Ближайший грамматический антецедент — Иаир, и дальнейший контекст (ст. 23) связывает эти поселения с Иаиром. Однако форма לוֹ сама по себе не называет владельца, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной передачей библейских имён и географического названия. Родословная формула передана ясно и без неоправданной архаизации.
