  text: וַ/אֲבִיגַ֕יִל יָלְדָ֖ה אֶת עֲמָשָׂ֑א וַ/אֲבִ֣י עֲמָשָׂ֔א יֶ֖תֶר הַ/יִּשְׁמְעֵאלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: ru
  text: Авигея родила Амасу, а отцом Амасы был Иефер, измаильтянин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях и в параллельном месте, 2 Царств 17:25, вместо «Иефер, измаильтянин» стоит «Итра, израильтянин». Здесь масоретский текст гласит: «Иефер, измаильтянин».'
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: родила
  rationale: В породословном контексте форма глагола ילד с подлежащим женского рода прямо означает «родила»; это естественная и точная передача.
- source_word: אֶת עֲמָשָׂא
  choice: Амасу
  rationale: Частица אֶת обозначает прямое дополнение и отдельно не переводится; имя עֲמָשָׂא передано как «Амаса», здесь в винительном падеже.
- source_word: וַאֲבִי עֲמָשָׂא
  choice: а отцом Амасы был
  rationale: Конструкция сохраняет явно выраженное родство, а союз «а» естественно вводит второе генеалогическое сообщение в современном русском языке.
- source_word: יֶתֶר
  choice: Иефер
  rationale: Традиционная русская форма библейского личного имени, соответствующая еврейскому יֶתֶר.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: измаильтянин
  rationale: Этноним с определённым артиклем служит обозначением происхождения Иефера; по-русски сказуемое-приложение или приложение такого типа естественно употребляется без отдельного аналога артикля.
