lexical_decisions:
- source_word: זָבָד
  choice: Завад
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: הוֹלִיד
  choice: родил
  rationale: В генеалогическом контексте форма хифиль глагола ילד означает «породил, стал отцом»; краткое «родил» естественно для русских библейских родословий и сохраняет мужскую генеалогическую направленность.
- source_word: אֶת
  choice: не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного лексического соответствия в русском языке.
- source_word: אֶפְלָל
  choice: Ефлал
  rationale: Личное имя транслитерировано с учётом принятой русской библейской передачи.
- source_word: וְ
  choice: а
  rationale: Союз связывает два последовательных звена родословия; «а» естественно передаёт переход к следующему субъекту без противопоставления.
- source_word: עוֹבֵד
  choice: Овед
  rationale: Личное имя передано традиционной русской библейской формой, а не переведено по значению связанного с ним корня.
