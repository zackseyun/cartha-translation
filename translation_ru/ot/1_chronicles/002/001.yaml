base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: ru
  text: 'Вот сыновья Израиля: Рувим, Симеон, Левий, Иуда, Иссахар и Завулон.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово вводит перечень; русское «вот» естественно передаёт эту функцию без добавления глагольной связки.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Здесь названы непосредственно сыновья патриарха Иакова, а не его потомки вообще.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Сохранено употреблённое в еврейском тексте имя Израиль, хотя речь идёт о патриархе Иакове.
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Традиционная русская библейская форма имени.
- source_word: שִׁמְעוֹן
  choice: Симеон
  rationale: Традиционная русская библейская форма имени.
- source_word: לֵוִי
  choice: Левий
  rationale: Традиционная русская библейская форма имени.
- source_word: וִיהוּדָה
  choice: Иуда
  rationale: Традиционная русская библейская форма имени; еврейский союз внутри перечня не воспроизводится механически, чтобы список звучал естественно по-русски.
- source_word: יִשָׂשכָר
  choice: Иссахар
  rationale: Традиционная русская библейская форма имени.
- source_word: וּזְבֻלוּן
  choice: и Завулон
  rationale: Традиционная русская библейская форма имени; заключительный союз естественно оформляет перечень.
