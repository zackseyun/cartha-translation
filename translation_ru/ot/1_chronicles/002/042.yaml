  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: ru
  text: 'А сыновья Халева, брата Иерахмеила: Меша, его первенец, был отцом Зифа[b], и сыновья Мареши, отца Хеврона[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза в еврейском тексте синтаксически трудна. Буквально масоретский текст гласит: «и сыновья Мареши, отца Хеврона». Её можно понимать как указание на Марешу, отца Хеврона, но возможны и другие способы связать эти слова.'
    reason: alternative_reading
  - marker: b
    text: В книгах Паралипоменон выражение «отец» может означать не только родного отца, но также предка, главу рода или основателя, связанного с определённым местом.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי כָלֵב
  choice: Сыновья Халева
  rationale: Сохранена обычная родословная формула «сыновья»; в данном контексте она может обозначать и более отдалённых потомков. Начальный союз не передан, поскольку по-русски при начале нового стиха он утяжелял бы перечисление.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: брата Иерахмеила
  rationale: Прямо передаёт конструкцию «брат Иерахмеила» и естественно служит приложением к имени Халева.
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: Меша, его первенец
  rationale: «Первенец» сохраняет не только указание на старшинство, но и родословно-правовой оттенок בְּכוֹר.
- source_word: הוּא אֲבִי זִיף
  choice: отец Зифа
  rationale: 'Местоимение הוּא не выражено отдельно, поскольку русское приложение естественно соотносится с Мешей. «Отец» сохраняет многозначность אָב: буквальный отец, предок, глава рода или основатель места.'
- source_word: וּבְנֵי מָרֵשָׁה
  choice: и сыновья Мареши
  rationale: Сохранена трудная масоретская конструкция без исправления текста и без замены «сыновей» более общим словом «потомки».
- source_word: אֲבִי חֶבְרוֹן
  choice: отца Хеврона
  rationale: Родительный падеж естественно связывает определение с ближайшим именем «Мареши», но примечание сохраняет сведения о синтаксической трудности и иных возможностях понимания.
theological_decisions:
- issue: Значение выражения «отец» при названиях Зиф и Хеврон
  choice: Сохранить буквальное «отец», пояснив его широкий родословный и топонимический смысл в примечании.
  alternative: Передать как «основатель» или «родоначальник».
  rationale: Исходный текст не позволяет однозначно решить, названы ли лица, роды или населённые пункты; более конкретный перевод устранил бы подлинную неоднозначность.
- issue: Связь заключительного выражения אֲבִי חֶבְרוֹן
  choice: Передать «сыновья Мареши, отца Хеврона», сохраняя ближайшую грамматическую связь.
  alternative: Оставить предельно буквальное и синтаксически неровное «и сыновья Мареши, отец Хеврона» либо истолковать Хеврона как одного из сыновей.
  rationale: Выбранный вариант читается естественно по-русски и соответствует вероятному пониманию, а примечание прямо сообщает о трудности масоретского текста, не выдавая толкование за несомненное.
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими формами имён. Синтаксис краток и родословен по характеру; подлинная неоднозначность выражений «отец Зифа» и «отец Хеврона» не устранена.
