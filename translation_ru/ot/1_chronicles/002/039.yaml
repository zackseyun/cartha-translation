  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: ru
  text: Азария стал отцом Хелеца, а Хелец стал отцом Елеасы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Еласа»; здесь еврейское имя точнее передано как «Елеаса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: Азария
  rationale: Личное имя передано в принятой русской библейской форме; начальный союз естественно выражен связью с предшествующей генеалогией и отдельно в этом стихе не воспроизводится.
- source_word: הֹלִיד
  choice: стал отцом
  rationale: В генеалогическом контексте порода Hiphil глагола ילד означает «породить, стать отцом»; выбран современный и ясный оборот без архаического оттенка.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения, не имеющий самостоятельного соответствия в русском языке.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: Хелец / а Хелец
  rationale: Одно и то же личное имя последовательно передано русской транслитерацией; союз между звеньями родословия выражен естественным русским «а».
- source_word: אֶלְעָשָׂה
  choice: Елеаса
  rationale: Имя передано близко к масоретской форме; окончание «-ы» обусловлено родительным падежом после сочетания «стал отцом».
