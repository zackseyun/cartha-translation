  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: ru
  text: После смерти Хецрона в Халев-Ефрафе[a] Авия, жена Хецрона, родила ему Ашхура, отца Текоа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «в Халев-Ефрафе» не вполне ясно. Возможно, это обозначение места или рода; традиционно его передают как «Халев-Ефрафа».
    reason: alternative_reading
  - marker: b
    text: 'Или: «основателя Текоа». В родословиях слово «отец» может обозначать не только непосредственного родителя, но и основателя либо главного предка поселения или рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: После смерти Хецрона
  rationale: Оборот с אַחַר и инфинитивом מוֹת передаёт временное значение. Русское «после смерти Хецрона» естественно и точно воспроизводит смысл.
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: в Халев-Ефрафе
  rationale: Предлог בְּ понят локативно, а два имени переданы как единое, хотя и неясное, обозначение места или рода. Дефис показывает их тесную связь, не снимая трудности еврейской фразы.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: Авия, жена Хецрона
  rationale: Перестановка имени перед приложением звучит естественно по-русски и сохраняет обе части еврейского выражения.
- source_word: וַתֵּלֶד לוֹ
  choice: родила ему
  rationale: Сохраняет косвенное дополнение לוֹ и не уточняет сверх текста, была ли речь о рождении ребёнка после смерти Хецрона или об иной хронологической связи.
- source_word: אַשְׁחוּר
  choice: Ашхур
  rationale: Транслитерация отражает согласные еврейского имени, включая ח, и отличает это имя от Ассура.
- source_word: אֲבִי תְקוֹעַ
  choice: отца Текоа
  rationale: Буквально сохраняет אָב «отец». В родословиях слово может обозначать также основателя или главу поселения либо рода; это разъяснено в сноске.
