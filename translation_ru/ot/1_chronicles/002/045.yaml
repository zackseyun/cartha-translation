  text: וּ/בֶן שַׁמַּ֖י מָע֑וֹן וּ/מָע֖וֹן אֲבִ֥י בֵֽית צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: ru
  text: Сыном Шаммая был Маон, а Маон был отцом Беф-Цура[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предком (основателем) Беф-Цура». В родословиях выражение «отец» может обозначать также родоначальника рода или основателя поселения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן
  choice: Сыном … был
  rationale: Естественная для современной русской генеалогической прозы передача конструкции «и сын»; союзная связь сохранена во второй части фразы словом «а».
- source_word: שַׁמַּי
  choice: Шаммай
  rationale: Личное имя передано транслитерацией с еврейского.
- source_word: מָעוֹן
  choice: Маон
  rationale: По синтаксису это имя потомка Шаммая, хотя та же форма может употребляться как название места.
- source_word: וּ/מָעוֹן
  choice: а Маон
  rationale: Повтор имени сохранён; союз «а» естественно соединяет две последовательные генеалогические формулы без смыслового противопоставления.
- source_word: אֲבִי
  choice: был отцом
  rationale: Сохранена обычная генеалогическая формула; возможное более широкое значение — предок или основатель — отмечено в сноске.
- source_word: בֵית צוּר
  choice: Беф-Цур
  rationale: Составное собственное имя передано принятой русской библейской формой, а не буквальным выражением «дом Цура».
theological_decisions:
- issue: Характер связи Маона с Беф-Цуром
  choice: был отцом Беф-Цура
  alternative: был предком или основателем Беф-Цура
  rationale: Еврейское אֲבִי допускает как непосредственное отцовство, так и более широкое отношение к роду или поселению. Основной текст сохраняет традиционную генеалогическую формулу, а неоднозначность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный и естественный генеалогический стиль. Смысловая неоднозначность слова אֲבִי не устранена, а пояснена в сноске.
