  text: 'The sons of Hebron: Korah[a], Tappuah, Rekem, and Shema.'
translation:
  language: ru
  text: 'Сыновья Хеврона: Корах, Таппуах, Рекем и Шама[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Шема».'
    reason: Возможный традиционный вариант передачи древнееврейского личного имени שָׁמַע; основной текст следует масоретской огласовке.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма בְנֵי — сопряжённое множественное число слова «сын» — вводит перечень непосредственных сыновей. Начальный союз וּ не передан отдельно, поскольку в современном русском языке самостоятельная генеалогическая строка естественно начинается без «и».
- source_word: חֶבְרוֹן
  choice: Хеврон
  rationale: Личное имя передано принятой русской транслитерацией; в данном контексте это человек, а не название города.
- source_word: קֹרַח
  choice: Корах
  rationale: Имя транслитерировано с сохранением согласного состава древнееврейской формы; вариант «Корей» менее прозрачно отражает источник.
- source_word: תַפֻּחַ
  choice: Таппуах
  rationale: Личное имя транслитерировано, а не переведено по созвучному нарицательному значению «яблоко».
- source_word: רֶקֶם
  choice: Рекем
  rationale: Имя передано прямой и естественной для русского языка транслитерацией.
- source_word: שָׁמַע
  choice: Шема
  rationale: Личное имя транслитерировано в соответствии с масоретской огласовкой; возможная передача «Шама» отмечена в сноске.
theological_decisions: []
