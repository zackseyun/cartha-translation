base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: ru
  text: У Шешана не было сыновей, а только дочери. У Шешана был раб[a] из Египта по имени Ярха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга». Еврейское עֶבֶד может обозначать как раба, так и слугу; перевод «раб» сохраняет указание на зависимый статус.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: у Шешана не было / у Шешана был
  rationale: Еврейская конструкция «быть у кого-либо» выражает обладание; русская конструкция с «у» естественно и точно передаёт её в обоих предложениях.
- source_word: בָּנִים
  choice: сыновей
  rationale: На конкретное значение указывает противопоставление дочерям; более широкое «детей» здесь было бы неточным.
- source_word: כִּי אִם
  choice: а только
  rationale: После отрицания сочетание означает «кроме / а только»; выбран естественный для русского языка вариант.
- source_word: בָּנוֹת
  choice: дочери
  rationale: Прямой эквивалент, сохраняющий противопоставление сыновьям.
- source_word: עֶבֶד
  choice: раб
  rationale: Слово обозначает зависимого человека и может также переводиться как «слуга». «Раб» сохраняет выраженный в исходном термине несвободный статус, а возможная альтернатива отмечена в сноске.
- source_word: מִצְרִי
  choice: из Египта
  rationale: Естественно передаёт египетское происхождение или принадлежность человека без тяжеловесного сочетания «египетский раб».
- source_word: וּשְׁמוֹ
  choice: по имени
  rationale: Идиоматичный русский эквивалент буквального «и имя его», сохраняющий всю сообщаемую информацию.
- source_word: יַרְחָע
  choice: Ярха
  rationale: Транслитерация еврейского личного имени в форме, близкой к его исходному звучанию.
