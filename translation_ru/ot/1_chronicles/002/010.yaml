base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: ru
  text: Рам стал отцом Аминадава, а Аминадав — Наассона, вождя[a] сынов Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князя»; или: «главу».'
    reason: Еврейское נְשִׂיא допускает значения «вождь», «князь» и «глава»; примечание сохраняет лексическую широту слова.
lexical_decisions:
- source_word: הוֹלִיד
  choice: родил
  rationale: В родословии каузативная форма глагола ילד обозначает мужское порождение потомка. «Родил» — традиционное и понятное по-русски родословное выражение, сохраняющее повтор и структуру еврейского текста.
- source_word: נְשִׂיא
  choice: предводитель
  rationale: Слово обозначает признанного главу или вождя общины. «Предводитель» ясно передаёт руководящее положение Наассона и не приписывает ему монархический титул.
- source_word: בְּנֵי יְהוּדָה
  choice: сыны Иуды
  rationale: Буквально «сыны Иуды»; в данном родословно-племенном контексте выражение сохраняет мужскую и родовую направленность оригинала.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: Рам / Аминадав / Наассон
  rationale: Использованы устоявшиеся русские библейские формы личных имён.
