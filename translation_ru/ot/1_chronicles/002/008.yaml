  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте после слов «сыновья Ефана» следует только одно имя — Азария. Это может быть родословной формулой, вводящей линию Ефана, либо слово «сыновья» употреблено в более широком значении — «потомки».
