lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «И», чтобы сохранить связь с предшествующим родословным перечнем. בְנֵי — форма множественного числа в сопряжённом состоянии, буквально «сыновья»; она сохранена, несмотря на следующее за ней одно имя.
- source_word: אֵיתָן
  choice: Ефана
  rationale: Личное имя передано в принятой русской библейской форме «Ефан» и поставлено в родительном падеже после слова «сыновья».
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Личное имя передано в принятой русской библейской форме; несоответствие между множественным числом «сыновья» и одним названным лицом не сглаживается.
