lexical_decisions:
- source_word: וּ/בֹעַז
  choice: Вооз
  rationale: Личное имя передано в традиционной русской библейской форме; начальный союз учтён связью с предшествующей генеалогией, но по-русски отдельно не выражен, чтобы не утяжелять стих.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В генеалогическом контексте Hiphil глагола ילד обозначает рождение потомка от названного мужчины. Современный оборот «стал отцом» естественен и сохраняет родословный смысл без архаичного «родил» или «породил».
- source_word: אֶת
  choice: '[не переводится]'
  rationale: Показатель прямого дополнения не имеет отдельного естественного соответствия в русском языке; его синтаксическая функция передана конструкцией предложения.
- source_word: עוֹבֵד
  choice: Овида
  rationale: Личное имя передано в принятой русской библейской форме и поставлено в родительный падеж после выражения «стал отцом».
- source_word: וְ/עוֹבֵד
  choice: а Овид
  rationale: Союз ו связывает две последовательные ступени родословия. Русское «а» естественно продолжает цепочку и избегает тяжеловесного повторения «и».
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Повторённый генеалогический глагол переведён одинаково для сохранения структуры и терминологической последовательности.
- source_word: יִשָׁי
  choice: Иессея
  rationale: Использована традиционная русская библейская форма имени «Иессей», поставленная в родительный падеж после «стал отцом».
