base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/044.yaml
  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: ru
  text: Шема стал отцом Рахама[a], отца Иоркеама, а Рекем стал отцом Шаммая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Рахама, основателя (предка) Иоркеама». Древнееврейское выражение «отец кого-либо» может обозначать основателя или родоначальника, особенно в родословиях, связанных с родами или поселениями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В генеалогическом контексте порода hифиль глагола ילד обычно обозначает рождение потомка по мужской линии. «Стал отцом» естественно звучит по-русски и точнее передаёт смысл, чем архаичное «родил» применительно к мужчине.
- source_word: אֲבִי
  choice: отца
  rationale: Сохраняет основное и наиболее прозрачное значение древнееврейского выражения. Поскольку при названии рода или поселения оно может указывать также на основателя либо предка, эта смысловая возможность отмечена в сноске.
- source_word: שֶׁמַע
  choice: Шема
  rationale: Передача собственного имени, близкая к древнееврейскому звучанию.
- source_word: רַחַם
  choice: Рахам
  rationale: Транслитерация собственного имени.
- source_word: יָרְקֳעָם
  choice: Иоркеам
  rationale: Транслитерация собственного имени или названия с начальным «Ио-», естественная для русской библейской ономастики.
- source_word: רֶקֶם
  choice: Рекем
  rationale: Транслитерация собственного имени.
- source_word: שַׁמָּי
  choice: Шаммай
  rationale: Транслитерация собственного имени с передачей удвоенного согласного согласно принятой русской форме.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткой генеалогической структуры оригинала. Повтор «стал отцом» передаёт одинаковую древнееврейскую глагольную форму в обеих частях стиха; оборот «отца Иоркеама» сохраняет возможную неоднозначность родственной либо основательской связи.
