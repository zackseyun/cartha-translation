  text: וּ/בְנֵי֙ יֹאשִׁיָּ֔הוּ הַ/בְּכוֹר֙ יוֹחָנָ֔ן הַ/שֵּׁנִ֖י יְהוֹיָקִ֑ים הַ/שְּׁלִשִׁי֙ צִדְקִיָּ֔הוּ הָ/רְבִיעִ֖י שַׁלּֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: ru
  text: 'И сыновья Иосии: первенец — Иоханан, второй — Иоаким, третий — Седекия, четвёртый — Шаллум[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шаллума обычно отождествляют с Иоахазом в 4 Царств 23:30–34 и Иеремии 22:11; однако в родословии Иосии Летописец сохраняет имя Шаллум.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Союз ו передан как «и», чтобы сохранить связь с предшествующим родословием; בְנֵי здесь означает непосредственных сыновей, поскольку далее перечислены четверо.
- source_word: יֹאשִׁיָּהוּ
  choice: Иосии
  rationale: Использована укоренившаяся в русской библейской традиции форма имени «Иосия», поставленная в родительном падеже.
- source_word: הַבְּכוֹר
  choice: первенец
  rationale: Слово обозначает первого по рождению сына и его положение; «первенец» точно и естественно передаёт родословный контекст.
- source_word: יוֹחָנָן
  choice: Иоханан
  rationale: Форма близко передаёт еврейское יוֹחָנָן и позволяет отличить это имя от иных традиционных русских форм.
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Порядковое числительное передано прямо, с сохранением последовательности списка.
- source_word: יְהוֹיָקִים
  choice: Иоаким
  rationale: Выбрана общепринятая русская библейская форма имени, соответствующая еврейскому имени в данном стихе.
- source_word: הַשְּׁלִשִׁי
  choice: третий
  rationale: Порядковое числительное передано прямо и единообразно.
- source_word: צִדְקִיָּהוּ
  choice: Седекия
  rationale: Использована общепринятая русская библейская форма царского имени.
- source_word: הָרְבִיעִי
  choice: четвёртый
  rationale: Порядковое числительное передано прямо и единообразно.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Имя транслитерировано с еврейского текста; удвоенная «л» помогает отразить форму имени и соответствует современной практике передачи еврейских имён.
theological_decisions:
- issue: Родословная очерёдность и порядок царствования
  choice: Сохранить данный в еврейском тексте перечень сыновей Иосии с обозначением их порядка, не переставляя имена согласно последовательности царствования.
  alternative: Переставить имена или пояснить их порядок непосредственно в основном тексте, согласуя его с повествованием о преемниках Иосии.
  rationale: Стих представляет родословный список и прямо снабжает каждого сына порядковым обозначением. Историческое сопоставление не должно изменять основной текст; необходимое пояснение уместно в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достоинственным строем родословного перечня. Тире делает последовательность имён ясной без добавления отсутствующих в еврейском тексте глаголов. Маркер сноски поставлен после слова «первенец», как в предоставленном консультационном слое, хотя содержание сноски относится к отождествлению Шаллума.
