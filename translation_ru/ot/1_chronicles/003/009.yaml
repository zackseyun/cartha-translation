  text: Все они — сыновья Давида, помимо сыновей наложниц[a]; и Тамар — их сестра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не считая сыновей наложниц». Еврейское выражение может указывать как на то, что эти сыновья не входят в предшествующий перечень, так и на то, что они упомянуты дополнительно, за его пределами.'
