lexical_decisions:
- source_word: כֹּל בְּנֵי דָוִיד
  choice: Все они — сыновья Давида
  rationale: כֹּל подводит итог ранее перечисленным именам; местоимение «они» естественно отсылает к этому списку. Именная конструкция передана тире, без добавления отсутствующего в еврейском тексте глагола.
- source_word: מִלְּבַד
  choice: помимо
  rationale: «Помимо» кратко и естественно передаёт значение исключения или добавления и не снимает присущую еврейской конструкции неоднозначность.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: сыновей наложниц
  rationale: Сохраняется мужской род בְּנֵי и точное обозначение социального положения פִילַגְשִׁים; уточнение «Давида» не требуется из-за контекста.
- source_word: וְתָמָר אֲחוֹתָם
  choice: а Фамарь — их сестра
  rationale: Союз «а» естественно присоединяет отдельное замечание после итоговой формулы. Безглагольное еврейское предложение передано русской именной конструкцией с тире; использована закрепившаяся в русской библейской традиции форма имени «Фамарь».
