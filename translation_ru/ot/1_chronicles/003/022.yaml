base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/022.yaml
  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: ru
  text: 'Сыновья Шехании: Шемаия. Сыновья Шемаии: Хаттуш[a], Игаль, Бариах, Неария и Шафат — шестеро.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сказано «шестеро», хотя в масоретском тексте здесь перечислены только пять имён. Это может указывать на текстовую проблему или на утрату одного имени при передаче текста.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Форма בְנֵי буквально означает «сыновья»; в данном генеалогическом перечне прямой перевод уместнее более широкого «потомки». Начальный союз וּ естественно не выражен по-русски, чтобы избежать тяжеловесного повторения «и».
- source_word: שְׁכַנְיָה
  choice: Шехания
  rationale: Личное имя передано русской библейской транслитерацией, отражающей согласный שׁ как «ш» и כ без дагеша как «х».
- source_word: שְׁמַעְיָה
  choice: Шемая
  rationale: Личное имя транслитерировано в форме, естественной для русской библейской традиции; в зависимой форме употреблено «Шемаи».
- source_word: חַטּוּשׁ
  choice: Хаттуш
  rationale: Прямая транслитерация личного имени с сохранением удвоенного согласного.
- source_word: יִגְאָל
  choice: Игаль
  rationale: Имя передано близко к еврейскому произношению; конечный мягкий знак естественно обозначает мягкость согласного в русской передаче.
- source_word: בָרִיחַ
  choice: Бариах
  rationale: Передаётся чтение именно масоретского текста בָרִיחַ; более знакомое имя «Берия» не вносится из иной формы текста.
- source_word: נְעַרְיָה
  choice: Неария
  rationale: Транслитерация сохраняет последовательность звуков и элемент -ия в теофорном имени.
- source_word: שָׁפָט
  choice: Шафат
  rationale: Прямая и понятная русская транслитерация личного имени.
- source_word: שִׁשָּׁה
  choice: шестеро
  rationale: Числительное сохранено вопреки тому, что в масоретском тексте перечислены лишь пять имён; собирательная русская форма естественна применительно к группе мужчин.
