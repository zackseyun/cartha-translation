  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: ru
  text: третий — Авессалом, сын Маахи, дочери Фалмая, царя Гессурского[a]; четвёртый — Адония, сын Аггифы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно, «внучки Фалмая»: в родословных слово «дочь» иногда может обозначать и более отдалённую потомицу. Однако буквально по-еврейски здесь сказано: «дочь Фалмая, царя Гессурского».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִישִׁי
  choice: третий
  rationale: Определённое порядковое числительное продолжает перечень сыновей Давида; по-русски естественно передать его словом «третий».
- source_word: לְאַבְשָׁלוֹם
  choice: Авессалом
  rationale: Традиционная русская форма библейского личного имени, соответствующая еврейскому אַבְשָׁלוֹם.
- source_word: בֶּן
  choice: сын
  rationale: В генеалогической конструкции обозначает родство; краткая форма «сын» естественна для перечня.
- source_word: מַעֲכָה
  choice: Мааха
  rationale: Передача еврейского личного имени מַעֲכָה в современной русской библейской форме.
- source_word: בַּת
  choice: дочь
  rationale: Прямое значение слова — «дочь»; более широкое генеалогическое значение возможно, но контекст не требует заменять основной смысл.
- source_word: תַּלְמַי
  choice: Фалмай
  rationale: Традиционная русская библейская форма имени תַּלְמַי.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: царь Гессурский
  rationale: Естественная русская передача сочетания, обозначающего царскую власть Фалмая над Гессуром.
- source_word: הָרְבִיעִי
  choice: четвёртый
  rationale: Определённое порядковое числительное продолжает структуру перечня.
- source_word: אֲדֹנִיָּה
  choice: Адония
  rationale: Традиционная русская форма библейского имени אֲדֹנִיָּה.
- source_word: חַגִּית
  choice: Аггифа
  rationale: Традиционная русская библейская форма имени חַגִּית.
