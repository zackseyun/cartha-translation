  yaml_path: translation/ot/1_chronicles/003/010.yaml
  text: And the son of Solomon was Rehoboam; Abijah his son[a], Asa his son, Jehoshaphat his son.
translation:
  language: ru
  text: Сын Соломона — Ровоам; его сын — Авия[a], его сын — Аса, его сын — Иосафат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Авия». В книгах 3–4 Царств этот же царь также назван «Авиям».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֶן שְׁלֹמֹה
  choice: Сын Соломона
  rationale: Краткая именная конструкция естественно передаёт звено родословия. Союз ו продолжает уже идущий перечень и по-русски не требует отдельного «и» в начале стиха.
- source_word: רְחַבְעָם
  choice: Ровоам
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: אֲבִיָּה
  choice: Авия
  rationale: Передаёт именно форму имени אֲבִיָּה, употреблённую в тексте Паралипоменон; отличная форма в книгах Царств отмечена в сноске.
- source_word: בְנ/וֹ
  choice: его сын
  rationale: Естественно передаёт существительное с местоименным суффиксом 3-го лица мужского рода и сохраняет повторяющийся ритм родословия.
- source_word: אָסָא
  choice: Аса
  rationale: Традиционная русская форма имени.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Традиционная и узнаваемая русская форма библейского имени.
