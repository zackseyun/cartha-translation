base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: ru
  text: 'Вот те, кто родились у него в Иерусалиме: Шимеа[a], Шовав, Нафан и Соломон — четверо от Бат-Шуа[b], дочери Аммиила.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном перечне в 2 Царств 5:14 это имя дано в форме «Шаммуа».
    reason: textual_variant
  - marker: b
    text: В 2 Царств 11:3 она названа Вирсавией, дочерью Елиама.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот те
  rationale: Естественно вводит следующую группу в родословии и сохраняет указательное значение еврейского выражения.
- source_word: נוּלְּדוּ לוֹ
  choice: родился у него
  rationale: Передаёт пассивную форму глагола ילד и местоименную отсылку к Давиду, не подставляя его имя непосредственно в текст.
- source_word: בִּירוּשָׁלָיִם
  choice: в Иерусалиме
  rationale: Прямое обозначение места рождения.
- source_word: שִׁמְעָא
  choice: Шимеа
  rationale: Передаёт форму имени в тексте Паралипоменон, не заменяя её вариантом из параллельного места.
- source_word: שׁוֹבָב
  choice: Шовав
  rationale: Регулярная русская передача еврейского имени.
- source_word: נָתָן
  choice: Нафан
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Устоявшаяся русская форма широко известного имени.
- source_word: אַרְבָּעָה
  choice: четверо
  rationale: Одушевлённая собирательная форма естественно подытоживает перечисление четырёх сыновей.
- source_word: לְבַת שׁוּעַ
  choice: от Бат-Шуа
  rationale: В родословном контексте естественно обозначает мать детей, сохраняя именно форму имени в еврейском тексте Паралипоменон.
- source_word: בַּת עַמִּיאֵל
  choice: дочери Аммиила
  rationale: Точно передаёт указание на отца Бат-Шуа.
theological_decisions:
- issue: Форма имени жены Давида и имени её отца в Паралипоменон по сравнению с параллельным местом
  choice: Бат-Шуа, дочь Аммиила
  alternative: Вирсавия, дочь Елиама
  rationale: Основной текст следует еврейскому тексту Паралипоменон и не гармонизирует его с 2 Царств 5:14; параллельная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного повествования. Сохранены формы имён, засвидетельствованные непосредственно в еврейском тексте Паралипоменон; для общеизвестных имён использованы традиционные русские формы.
