  text: וּ/בְנֵ֣י אֶלְיוֹעֵינַ֗י הדיוהו וְ/אֶלְיָשִׁ֡יב וּ/פְלָיָ֡ה וְ֠/עַקּוּב וְ/יוֹחָנָ֧ן וּ/דְלָיָ֛ה וַ/עֲנָ֖נִי שִׁבְעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: ru
  text: 'И сыновья Елиоеная: Ходавия[a], Елиашив, Фелаия, Аккув, Иоханан, Делаия и Анани — семеро.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское написание первого имени в этом перечне необычно. «Ходавия» следует наиболее вероятному традиционному отождествлению; возможны также формы «Ходия» или более буквальная транслитерация «Ходевагу».
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сочетание передаёт конструктивную форму множественного числа «сыновья» и сохраняет союз, связывающий эту строку с продолжающимся родословным перечнем.
- source_word: אֶלְיוֹעֵינַי
  choice: Елиоеная
  rationale: Личное имя передано транслитерацией, близкой к еврейской огласовке; родительный падеж естественен после слова «сыновья».
- source_word: הדיוהו
  choice: Ходавия
  rationale: Написание имени в еврейском тексте необычно. В основном тексте использована наиболее вероятная традиционная идентификация имени, а неопределённость отражена в сноске.
- source_word: וְאֶלְיָשִׁיב
  choice: Елиашив
  rationale: Транслитерация личного имени с учётом еврейского согласного ב без дагеша как «в».
- source_word: וּפְלָיָה
  choice: Фелаия
  rationale: Транслитерация личного имени; начальное פ без дагеша передано как «ф», а окончание יָה — как «ия» в соответствии с русской библейской традицией.
- source_word: וְעַקּוּב
  choice: Аккув
  rationale: Транслитерация личного имени; удвоенное «к» отражает дагеш в קּ, конечное ב без дагеша передано как «в».
- source_word: וְיוֹחָנָן
  choice: Иоханан
  rationale: Форма сохраняет именно краткое еврейское имя יוֹחָנָן, не смешивая его с более длинным теофорным вариантом.
- source_word: וּדְלָיָה
  choice: Делаия
  rationale: Личное имя передано транслитерацией с традиционным русским оформлением окончания יָה.
- source_word: וַעֲנָנִי
  choice: и Анани
  rationale: Союз естественно поставлен перед последним именем русского перечня.
- source_word: שִׁבְעָה
  choice: семеро
  rationale: Собирательное числительное естественно подводит итог числу названных сыновей и сохраняет явный подсчёт исходного текста.
