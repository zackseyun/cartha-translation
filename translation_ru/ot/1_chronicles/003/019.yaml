  text: וּ/בְנֵ֣י פְדָיָ֔ה זְרֻבָּבֶ֖ל וְ/שִׁמְעִ֑י וּ/בֶן זְרֻבָּבֶל֙ מְשֻׁלָּ֣ם וַ/חֲנַנְיָ֔ה וּ/שְׁלֹמִ֖ית אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: ru
  text: 'Сыновья Федаии: Зоровавель и Шимей. Сыновья Зоровавеля[a]: Мешуллам и Ханания; а Шеломиф была их сестрой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «сын Зоровавеля». Поскольку далее названы Мешуллам и Ханания, эту форму нередко понимают как текстовую нерегулярность или как генеалогическое употребление единственного числа в собирательном смысле.'
    reason: Сохраняет для читателя форму масоретского текста и не скрывает расхождение между грамматическим числом и последующим перечислением.
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: Сыновья Федаии
  rationale: В родословии בְּנֵי естественно обозначает сыновей. Начальный союз не передан, поскольку по-русски здесь начинается новая генеалогическая строка, а его буквальное воспроизведение звучало бы тяжеловесно.
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: Зоровавель и Шимей
  rationale: Личные имена переданы в формах, укоренившихся в русской библейской традиции; союз сохраняет простое соединение двух сыновей.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: Сыновья Зоровавеля[a]
  rationale: В масоретском тексте стоит единственное число «сын», однако далее названы двое мужчин и их сестра. Основной текст передаёт наиболее вероятный смысл перечисления, а буквальная форма сохранена в сноске.
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: Мешуллам и Ханания
  rationale: Имена транслитерированы в привычных русских библейских формах, а союз передан естественным русским соединением.
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: а Шеломиф была их сестрой
  rationale: Местоименный суффикс имеет множественное число и естественно относится к Мешулламу и Ханании. Связка «была» добавлена для ясного и литературного русского выражения именного древнееврейского предложения.
