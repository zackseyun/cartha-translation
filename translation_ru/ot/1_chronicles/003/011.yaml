  text: Joram his son[a], Ahaziah his son[c][b], Joash his son.
translation:
  language: ru
  text: Иорам, его сын[a]; Охозия, его сын; Иоас, его сын.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В родословиях еврейское слово «сын» иногда может означать и более отдалённого потомка, однако здесь оно передано как «сын», поскольку стих кратко перечисляет последовательность царей.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרָם
  choice: Иорам
  rationale: Традиционная русская библейская передача еврейского имени; соответствует краткой форме имени в исходном тексте.
- source_word: בְּנוֹ
  choice: его сын
  rationale: Буквальное и естественное соответствие форме בְּנוֹ. Хотя в родословиях слово «сын» иногда обозначает более отдалённого потомка, здесь перечисляется непосредственная царская преемственность.
- source_word: אֲחַזְיָהוּ
  choice: Охозия
  rationale: Устоявшаяся русская библейская форма имени, обеспечивающая узнаваемость персонажа.
- source_word: יוֹאָשׁ
  choice: Иоас
  rationale: Устоявшаяся русская библейская форма краткого еврейского имени יוֹאָשׁ.
theological_decisions: []
