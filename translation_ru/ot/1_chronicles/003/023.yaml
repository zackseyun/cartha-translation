base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/023.yaml
  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: ru
  text: 'Сыновья Неарии[a]: Элиоэнай, Езекия и Азрикам — трое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «сын Неарии»; однако далее названы трое, поэтому в данном родословии эта форма служит заголовком для перечня сыновей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Сыновья
  rationale: В еврейском тексте стоит форма единственного числа «и сын», однако здесь она вводит перечень из трёх потомков Неарии, что подтверждается тремя именами и итоговым словом «трое». Поэтому по-русски естественно употребить множественное число, сохранив буквальную особенность в сноске.
- source_word: נְעַרְיָה
  choice: Неарии
  rationale: Личное имя נְעַרְיָה передано русской библейской транслитерацией; родительный падеж обусловлен конструкцией «сыновья Неарии».
- source_word: אֶלְיוֹעֵינַי
  choice: Элиоэнай
  rationale: Личное имя передано транслитерацией, близкой к еврейской форме.
- source_word: וְחִזְקִיָּה
  choice: Езекия
  rationale: Выбрана укоренившаяся в русской библейской традиции форма имени חִזְקִיָּה, понятная русскому читателю.
- source_word: וְעַזְרִיקָם
  choice: и Азрикам
  rationale: Личное имя передано принятой русской транслитерацией; союз וְ воспроизведён как «и».
- source_word: שְׁלֹשָׁה
  choice: трое
  rationale: Числительное сохраняет итоговый подсчёт перечисленных мужчин; собирательная форма «трое» естественна в современном русском языке.
