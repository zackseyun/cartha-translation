lexical_decisions:
- source_word: יִבְחָר
  choice: Ивхар
  rationale: Личное имя в родословном перечне передано транслитерацией с древнееврейского; начальная буква йод отражена русским «И», а сочетание בְח — как «вх».
- source_word: אֱלִישָׁמָע
  choice: Элишама
  rationale: Личное имя передано в форме, близкой к древнееврейскому звучанию; конечная ע отдельно не обозначена, что соответствует обычной русской передаче библейских имён.
- source_word: אֱלִיפָלֶט
  choice: Элифелет
  rationale: Личное имя транслитерировано с сохранением различия между гласными в слогах имени; такая форма близко передаёт масоретское чтение.
- source_word: וְ / וֶ
  choice: и
  rationale: Повторяющийся союз связывает имена в перечне; по нормам современного русского языка явно поставлен только перед последним именем.
