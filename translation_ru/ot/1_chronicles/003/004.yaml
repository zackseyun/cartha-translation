  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: ru
  text: Шестеро родились у него в Хевроне. Там он царствовал семь лет и шесть месяцев, а в Иерусалиме — тридцать три года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: Шестеро
  rationale: Субстантивированное собирательное числительное естественно обозначает шестерых сыновей, перечисленных в предыдущих стихах, не добавляя отсутствующего в еврейском тексте указательного слова «эти».
- source_word: נוֹלַד לוֹ
  choice: родились у него
  rationale: Сохраняет пассивную конструкцию еврейского текста и естественно звучит по-русски; вариант «он породил» был бы более активным и интерпретирующим.
- source_word: בְחֶבְרוֹן
  choice: в Хевроне
  rationale: Прямое обозначение места с общепринятой русской формой топонима.
- source_word: וַיִּמְלָךְ שָׁם
  choice: Там он царствовал
  rationale: Глагол מלך в данном контексте означает осуществление царской власти; «царствовал» точно передаёт смысл, а начальное «там» сохраняет пространственный акцент.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: семь лет и шесть месяцев
  rationale: Естественная русская передача точного срока.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: тридцать три года
  rationale: Передаёт составное числительное и согласование в соответствии с нормами современного русского языка.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: а в Иерусалиме — тридцать три года
  rationale: Эллипсис глагола «царствовал» естественен по-русски, избегает тяжёлого повтора и сохраняет контраст между Хевроном и Иерусалимом.
