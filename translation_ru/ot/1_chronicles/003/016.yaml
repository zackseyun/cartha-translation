  text: וּ/בְנֵ֖י יְהוֹיָקִ֑ים יְכָנְיָ֥ה בְנ֖/וֹ צִדְקִיָּ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: ru
  text: 'И сыновья Иоакима: Иехония, сын его[a], Седекия, сын его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст краток: «Иехония, сын его, Седекия, сын его». Это можно понимать как простую родословную последовательность, однако толкователи расходятся во мнениях: названы ли оба сына Иоакима или же Седекия представлен здесь как сын Иехонии.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Сопряжённая форма множественного числа בְּנֵי вводит родословный перечень; союз ו передан как «и», чтобы сохранить связь с предшествующим списком.
- source_word: יְהוֹיָקִים
  choice: Иоаким
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: יְכָנְיָה
  choice: Иехония
  rationale: Использована устоявшаяся русская библейская форма имени, соответствующая данной еврейской форме.
- source_word: בְנ֖/וֹ
  choice: сын его
  rationale: Существительное с суффиксом третьего лица мужского рода единственного числа передано буквально; постпозиция местоимения сохраняет краткий родословный строй.
- source_word: צִדְקִיָּה
  choice: Седекия
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: בְנֽ/וֹ
  choice: сын его
  rationale: Повтор родословного обозначения сохранён, чтобы не устранять неоднозначность связи между названными лицами.
theological_decisions:
- issue: Синтаксис родословия и родственная связь в трудном родословном сообщении
  choice: 'Формулировка сохранена как последовательность: «Иехония, сын его, Седекия, сын его».'
  alternative: Оба имени можно понимать как имена сыновей Иоакима; возможно также понимать Седекию как сына Иехонии согласно непосредственной последовательности слов.
  rationale: Еврейский текст предельно краток и после каждого имени повторяет «сын его». Перевод не гармонизирует этот стих с другими историческими сообщениями и не разрешает неоднозначность толкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным родословным строем. Традиционные русские формы библейских имён сохранены; подлинная синтаксическая неоднозначность отмечена в сноске.
