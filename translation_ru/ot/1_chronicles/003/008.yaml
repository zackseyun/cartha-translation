lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: Елишама
  rationale: Личное имя передано принятой русской библейской транслитерацией, без перевода его значения.
- source_word: אֶלְיָדָע
  choice: Елиада
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: אֱלִיפֶלֶט
  choice: Елифелет
  rationale: Транслитерация отражает полную еврейскую форму имени в данном стихе.
- source_word: וְ / וֶ
  choice: и; перечислительная пунктуация
  rationale: Повторяющийся союз при именах естественно передан по-русски запятыми и союзом «и» перед последним именем.
- source_word: תִּשְׁעָה
  choice: всего девять
  rationale: Числительное подводит итог числу сыновей, перечисленных в стихах 5–8; «всего» ясно передаёт его итоговую функцию, не добавляя нового содержания.
