  text: Elishama[a], Eliada, and Eliphelet—nine.
translation:
  language: ru
  text: Елишама[a], Елиада и Елифелет — всего девять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Этими именами завершается перечень девяти сыновей в стихах 5–8.
