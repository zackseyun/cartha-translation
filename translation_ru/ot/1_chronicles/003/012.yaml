  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: ru
  text: Амасия, его сын; Азария[a], его сын; Иоафам, его сын.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Азария»; в других местах этот царь также известен как Озия.
    reason: Уточняется альтернативная форма имени этого царя без гармонизации основного текста.
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: Амасия
  rationale: Личное имя передано в его традиционной русской библейской форме.
- source_word: בְנוֹ
  choice: его сын
  rationale: Форма בְנוֹ прямо означает «его сын». Хотя родословия иногда пропускают поколения, здесь нет оснований заменять точное родственное обозначение более общим словом «потомок».
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Перевод следует именно форме имени עֲזַרְיָה в исходном тексте и не подменяет её встречающимся в других местах именем Озия.
- source_word: יוֹתָם
  choice: Иоафам
  rationale: Использована устоявшаяся русская библейская форма этого личного имени.
theological_decisions:
- issue: Обозначение сыновства в царской родословной
  choice: Во всех случаях сохранить прямое значение «его сын».
  alternative: Передать как «его потомок», учитывая возможность пропуска поколений в библейских родословиях.
  rationale: Еврейский текст трижды использует בְנוֹ, то есть «его сын». Более общее «потомок» внесло бы в текст не выраженное здесь толкование.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Тире делает краткую родословную формулу естественной и ясной, сохраняя повтор исходного текста.
