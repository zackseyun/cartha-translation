  text: וּ/בְנֵי֙ יְכָנְיָ֣ה אַסִּ֔ר שְׁאַלְתִּיאֵ֖ל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: ru
  text: 'И сыновья Иехонии: Ассир[a], Шеалтиил, сын его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И сыновья Иехонии-пленника: Шеалтиил, сын его». Еврейское слово אַסִּר можно понять либо как имя Ассир, либо как нарицательное «пленник».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Союз ו сохраняет продолжение генеалогического перечня, а בְנֵי передано в обычном для родословий значении «сыновья».
- source_word: יְכָנְיָה
  choice: Иехония
  rationale: Использована устоявшаяся русская библейская форма имени, соответствующая еврейскому יְכָנְיָה.
- source_word: אַסִּר
  choice: Ассир
  rationale: В основном тексте слово принято за личное имя, что естественно для генеалогического перечня; возможное нарицательное значение сохранено в сноске.
- source_word: שְׁאַלְתִּיאֵל
  choice: Салафиил
  rationale: Использована узнаваемая и устоявшаяся русская библейская форма данного имени.
- source_word: בְּנוֹ
  choice: сын его
  rationale: Суффикс третьего лица передан буквально; такая формулировка сохраняет лаконичность и возможную синтаксическую неоднозначность генеалогической записи.
theological_decisions:
- issue: Следует ли понимать אַסִּר как личное имя или как обозначение Иехонии «пленник».
  choice: В основном тексте сохранено личное имя «Ассир».
  alternative: '«И сыновья Иехонии, пленника: Салафиил, сын его».'
  rationale: Еврейская форма допускает оба понимания. Контекст перечня позволяет читать её как имя, однако нарицательное значение «пленник» также лексически возможно, поэтому неоднозначность не устраняется, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой структуры родословия; традиционные русские формы библейских имён обеспечивают узнаваемость, а сноска сохраняет подлинную неоднозначность еврейского текста.
