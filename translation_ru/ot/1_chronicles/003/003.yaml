  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: ru
  text: пятый — Шефатия, от Авитали; шестой — Итреам, от Эглы, его жены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые толкователи отождествляют Эглу с Мелхолой, однако сам текст этого не утверждает.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: пятый
  rationale: Определённое порядковое числительное продолжает нумерованный перечень сыновей Давида; по-русски артикль отдельно не передаётся.
- source_word: שְׁפַטְיָה
  choice: Сафатия
  rationale: Личное имя передано в принятой русской библейской форме, близкой к еврейскому звучанию.
- source_word: לַאֲבִיטָל
  choice: от Авитали
  rationale: Предлог ל в этой родословной формуле обозначает материнство; русское «от Авитали» кратко и естественно передаёт смысл «рождённый Авиталью».
- source_word: הַשִּׁשִּׁי
  choice: шестой
  rationale: Сохраняет параллельную структуру нумерованного перечня.
- source_word: יִתְרְעָם
  choice: Итреам
  rationale: Личное имя транслитерировано в соответствии с современной русской библейской традицией.
- source_word: לְעֶגְלָה
  choice: от Эглы
  rationale: Как и в предыдущей формуле, ל указывает на мать ребёнка; оборот «от Эглы» идиоматичен для родословного контекста.
- source_word: אִשְׁתּוֹ
  choice: его жены
  rationale: Обычное значение существительного אִשָּׁה с суффиксом 3-го лица мужского рода — «его жена»; форма родительного падежа естественно присоединяется к «от Эглы».
theological_decisions:
- issue: К кому относится выражение «его жена» и подразумевает ли оно особый статус Эглы
  choice: Передать прямое указание текста, что Эгла была женой Давида, не объясняя, почему это отмечено.
  alternative: Считать выражение указанием на особый статус Эглы либо отождествить её с Мелхолой.
  rationale: Еврейский текст называет Эглу «его женой», но не утверждает ни её особого положения среди жён Давида, ни её тождества с Мелхолой; перевод не должен вносить позднейшие толкования.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной родословной формой. Тире подчёркивает структуру перечня; традиционные формы имён сохранены без архаизации синтаксиса.
