translation_notes:
  register: Современный литературный русский язык с лаконичным генеалогическим строем. Союзы не воспроизводятся механически перед каждым именем, а оформлены по нормам русского перечисления. Имена переданы непосредственно с еврейского, без перевода их возможных значений.
