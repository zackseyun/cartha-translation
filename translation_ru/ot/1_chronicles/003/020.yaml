  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: ru
  text: и Хашува, Охел, Берехия, Хасадия и Юшав-Хесед — пять.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «пять»; это краткое подведение итога пяти перечисленным именам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: и Хашува
  rationale: Личное имя передано транслитерацией; начальный союз ו выражен русским «и».
- source_word: וָ/אֹהֶל
  choice: Охел
  rationale: Форма здесь является личным именем, поэтому не переводится как нарицательное «шатёр».
- source_word: וּ/בֶרֶכְיָה
  choice: Берехия
  rationale: Транслитерация личного имени сохраняет согласный כ как «х» и традиционно передаёт конечный теофорный элемент יה как «ия».
- source_word: וַֽ/חֲסַדְיָה
  choice: Хасадия
  rationale: Личное имя транслитерировано; конечное יה передано привычным для библейских имён окончанием «ия».
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: Юшав-Хесед
  rationale: Два графически раздельных еврейских элемента поняты как одно составное личное имя; дефис ясно показывает это русскому читателю.
- source_word: חָמֵשׁ
  choice: пятеро
  rationale: Собирательное числительное естественно подытоживает перечень пяти лиц и сохраняет краткость еврейской генеалогической формулы.
