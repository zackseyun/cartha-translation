  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: ru
  text: 'Вот сыновья Давида, которые родились у него в Хевроне: первенец — Амнон, от Ахиноамы из Изрееля; второй — Даниил[a], от Авигеи из Кармила.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном перечне во 2 Царств 3:3 этот сын назван Хилеавом, а не Даниилом.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Открывает новый раздел родословия и естественно передаёт указательную силу выражения; отдельное «и» в русском не требуется.
- source_word: בְּנֵי דָוִיד
  choice: сыновья Давида
  rationale: Сохраняет мужской род и родословное значение сочетания.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: которые родились у него
  rationale: Сохраняет пассивную конструкцию и отношение к Давиду, не заменяя её более толковательным «которых он породил».
- source_word: בְּחֶבְרוֹן
  choice: в Хевроне
  rationale: Естественная русская передача указания на место.
- source_word: הַבְּכוֹר
  choice: первенец
  rationale: Передаёт не только порядок рождения, но и возможное родословное значение статуса первенца.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: от Ахиноамы из Изрееля
  rationale: Предлог перед именем матери передан естественной русской формулой происхождения; женский этникон раскрыт современным обозначением места.
- source_word: שֵׁנִי
  choice: второй
  rationale: Сохраняет порядковое обозначение следующего сына в перечне.
- source_word: דָּנִיֵּאל
  choice: Даниил
  rationale: Передаёт именно форму имени в масоретском тексте 1 Паралипоменон, не подменяя её вариантом из параллельного места.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: от Авигеи из Кармила
  rationale: Естественно указывает мать и её происхождение, избегая архаичного русского этникона.
