base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: ru
  text: 'А сын Ханании: Пелатия и Иешая; сыновья Рефаии[a], сыновья Арнана, сыновья Овадии, сыновья Шехании.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский синтаксис здесь сжат и не вполне ясен. Буквально: «А сын Ханании: Пелатия и Иешая; сыновья Рефаии, сыновья Арнана, сыновья Овадии, сыновья Шехании». Хотя названы два имени, в начале стоит единственное число «сын». Некоторые понимают часть этого перечня шире — как линию потомков, а не только как непосредственных сыновей.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: А сыновья
  rationale: Масоретский текст формально содержит единственное число «и сын», однако за ним названы двое — Пелатия и Иешая. В русском основном тексте множественное число обеспечивает грамматическую связность, а формальная особенность и неоднозначность еврейского синтаксиса отмечены в сноске.
- source_word: חֲנַנְיָה
  choice: Ханании
  rationale: Личное имя передано принятой русской библейской транслитерацией в форме родительного падежа.
- source_word: פְּלַטְיָה
  choice: Пелатия
  rationale: Личное имя транслитерировано; форма подходит для именительного падежа и не переводит значение имени.
- source_word: וִישַׁעְיָה
  choice: и Иешая
  rationale: Союз сохранён; транслитерация отражает данную форму имени и не отождествляет её без необходимости с более привычным именем пророка Исаии.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Повторяющееся генеалогическое обозначение сохранено формально. Возможное более широкое значение «потомки» не внесено в основной текст, но отражено в сноске.
- source_word: רְפָיָה
  choice: Рефаии
  rationale: Личное имя транслитерировано и поставлено в родительный падеж после слова «сыновья».
- source_word: אַרְנָן
  choice: Арнана
  rationale: Личное имя транслитерировано и поставлено в родительный падеж.
- source_word: עֹבַדְיָה
  choice: Овадии
  rationale: Использована традиционная русская библейская форма имени, восходящего к עֹבַדְיָה.
- source_word: שְׁכַנְיָה
  choice: Шехании
  rationale: Имя транслитерировано с передачей начального שׁ как «ш» и поставлено в родительный падеж.
theological_decisions:
- issue: Степень родства в повторяющемся בְּנֵי
  choice: В основном тексте — «сыновья»
  alternative: «потомки» или понимание части перечня как последовательной родословной линии
  rationale: Еврейское בְּנֵי обычно означает «сыновья», но в родословиях может охватывать более отдалённых потомков. Текст не позволяет уверенно устранить эту неоднозначность, поэтому буквальная формулировка сохранена, а альтернативное понимание указано в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичной, повторяющейся структуры родословия. Имена переданы в узнаваемых русских библейских формах; синтаксическая трудность исходного текста не скрыта, а вынесена в сноску.
