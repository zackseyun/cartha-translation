  yaml_path: translation/ot/1_chronicles/003/018.yaml
  text: Malchiram[a], Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.
translation:
  language: ru
  text: Малкирам, Федаия, Шенаццар, Иекамия, Хошама и Недавия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: Малкирам
  rationale: Личное имя в родословии передано транслитерацией с еврейского; форма сохраняет согласные и огласовку масоретского текста.
- source_word: פְדָיָה
  choice: Федаия
  rationale: Личное имя передано в современной русской библейской форме, отражающей начальный еврейский согласный и теофорное окончание.
- source_word: שֶׁנְאַצַּר
  choice: Шенаццар
  rationale: Транслитерация отражает удвоение цади, обозначенное дагешем в масоретском тексте.
- source_word: יְקַמְיָה
  choice: Иекамия
  rationale: Имя транслитерировано с учётом русской традиции передачи начального йода перед гласным и теофорного окончания.
- source_word: הוֹשָׁמָע
  choice: Хошама
  rationale: Транслитерация непосредственно отражает согласный состав и огласовку еврейского имени.
- source_word: נְדַבְיָה
  choice: Недавия
  rationale: Личное имя передано транслитерацией; буква бет без дагеша отражена как «в», а теофорный элемент — окончанием «-ия».
- source_word: וּ / וְ
  choice: и
  rationale: Союз связывает имена в перечне; по нормам естественного русского языка он выражен перед последним элементом, а остальные связи переданы запятыми.
