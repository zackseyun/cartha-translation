base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: ru
  text: Ведь многие пали, потому что битва была от Бога[a]; и они поселились на их месте до изгнания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эта битва принадлежала Богу». Еврейское выражение подчёркивает, что битва и её исход были от Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Первое כִּי объясняет сообщённую ранее победу; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: חֲלָלִים רַבִּים נָפָלוּ
  choice: многие пали убитыми
  rationale: חֲלָלִים обозначает павших, поражённых в бою, а נָפָלוּ сохраняет обычный для военного контекста образ падения.
- source_word: כִּי מֵהָאֱלֹהִים הַמִּלְחָמָה
  choice: потому что битва была от Бога
  rationale: Второе כִּי выражает причину, а предлог מִן указывает на Бога как источник решающего исхода битвы, не уточняя способ его действия.
- source_word: וַיֵּשְׁבוּ תַחְתֵּיהֶם
  choice: они поселились на их месте и жили там
  rationale: ישב в данном контексте включает заселение и последующее проживание, а תַחְתֵּיהֶם означает занятие места прежних жителей, а не положение «под ними».
- source_word: עַד הַגֹּלָה
  choice: до изгнания
  rationale: גּוֹלָה здесь обозначает историческое изгнание и переселение племён; «изгнание» кратко и ясно передаёт эту временную границу.
theological_decisions:
- issue: Участие Бога в битве
  choice: битва была от Бога
  alternative: это была Божья битва
  rationale: Основной перевод сохраняет значение источника, выраженное предлогом מִן, и утверждает Божье определяющее участие, не разворачивая стих в более широкое учение о войне.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис разделён на два предложения для ясности; военная образность и причинная связь оригинала сохранены.
