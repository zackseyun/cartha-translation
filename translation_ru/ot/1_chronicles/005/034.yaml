  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיטוּב
  choice: Ахитув
  rationale: Личное имя передано в принятой русской библейской форме, соответствующей еврейскому имени.
- source_word: הוֹלִיד
  choice: породил
  rationale: В родословном контексте каузативная форма глагола ילד означает «стал отцом / произвёл потомка»; «породил» кратко и точно сохраняет родословную формулу без архаичного «родил» применительно к мужчине.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель прямого дополнения не имеет самостоятельного лексического эквивалента в русском языке; его синтаксическая функция выражена формой винительного падежа.
- source_word: צָדוֹק
  choice: Садок
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: וְ
  choice: а
  rationale: Союз связывает две последовательные родословные формулы; «а» естественно передаёт переход от одного поколения к следующему, не добавляя временного значения.
- source_word: הוֹלִיד
  choice: породил
  rationale: Повторяющийся родословный глагол переведён одинаково ради прозрачности структуры.
- source_word: אֲחִימָעַץ
  choice: Ахимаац
  rationale: Использована устоявшаяся русская библейская форма личного имени.
