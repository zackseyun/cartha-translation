  text: מְרָיוֹת֙ הוֹלִ֣יד אֶת אֲמַרְיָ֔ה וַ/אֲמַרְיָ֖ה הוֹלִ֥יד אֶת אֲחִיטֽוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/033.yaml
  text: Meraioth fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: ru
  text: Мерайот стал отцом Амарии, а Амария стал отцом Ахитува.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: Мерайот
  rationale: Личное имя передано транслитерацией, близкой к масоретскому произношению; окончание согласуется с формой еврейского имени.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В родословии каузативная форма глагола ילד обозначает отцовство и происхождение по мужской линии. Современный оборот «стал отцом» естественнее архаичного «родил» и не утверждает сверх того, что выражает генеалогическая формула.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель определённого прямого дополнения, функция которого выражена русским синтаксисом.
- source_word: אֲמַרְיָה
  choice: Амария
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וַ/אֲמַרְיָה
  choice: а Амария
  rationale: Союз ו передан естественной русской связкой «а», которая продолжает последовательность родословия без смыслового противопоставления.
- source_word: אֲחִיטוּב
  choice: Ахитув
  rationale: Имя транслитерировано с передачей конечного еврейского согласного ב без дагеша как «в».
theological_decisions:
- issue: Степень непосредственности родства в генеалогической формуле הוֹלִיד
  choice: «стал отцом»
  alternative: «был предком»
  rationale: Формула представляет отношение как отцовство, однако библейские родословия иногда опускают промежуточные поколения. Перевод сохраняет форму исходного текста и не добавляет явного уточнения о непосредственности.
translation_notes:
  register: Современный литературный русский язык; краткий и ритмически параллельный стиль родословия. Имена переданы с опорой на еврейский текст и устойчивую русскую библейскую традицию там, где она уместна.
