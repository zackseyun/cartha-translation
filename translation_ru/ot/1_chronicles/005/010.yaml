  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: ru
  text: Во дни Саула они воевали с агарянами[a]. Агаряне попали в их руки[b], а рувимляне поселились в их шатрах по всей области к востоку от Галаада.
  philosophy: optimal-equivalence
  footnotes:
