    text: 'Или: «с агритами». Еврейский этноним, вероятно, обозначает народ, связанный с Агарью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «они пали в их руку», то есть оказались в их власти. Из контекста следует, что речь идёт об агарянах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: Во дни Саула
  rationale: Конструкция בִּימֵי обозначает период времени. «Во дни» сохраняет библейскую торжественность и при этом понятно современному читателю.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: воевали с
  rationale: Еврейская идиома буквально означает «вели войну с». Русское «воевали с» естественно и точно передаёт значение.
- source_word: הַהַגְרִאִים
  choice: агарянами
  rationale: Этноним, вероятно связанный с именем Агарь. Форма «агаряне» узнаваема в русской библейской традиции; возможная передача «агриты» отмечена в сноске.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: Агаряне попали в их руки
  rationale: Идиома «пасть в руку» означает оказаться во власти другого. Явное повторение этнонима устраняет неясность русского местоимения, не меняя подразумеваемого контекстом субъекта.
- source_word: וַיֵּשְׁבוּ
  choice: поселились
  rationale: В контексте занятия шатров побеждённых глагол יָשַׁב означает жить или обосноваться. «Поселились» естественно передаёт начало проживания, не обязательно предполагая постоянное владение.
- source_word: בְּאָהֳלֵיהֶם
  choice: в их шатрах
  rationale: Сохранён конкретный образ шатров. Местоимение, вероятнее всего, относится к побеждённым агарянам.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: по всей области к востоку от Галаада
  rationale: Идиома עַל כָּל־פְּנֵי обозначает распространение по всей протяжённости местности; русский оборот передаёт пространственный смысл без буквального «по всему лицу».
