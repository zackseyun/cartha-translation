  text: Азария стал отцом Амарии, а Амария стал отцом Ахитува.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: стал отцом
  rationale: Глагол ילד в породе хифиль с последовательным вау употреблён в родословной формуле. «Стал отцом» естественно звучит по-русски и передаёт прямое происхождение без архаизма «родил» применительно к мужчине.
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Личное имя передано принятой русской библейской формой.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель определённого прямого дополнения; его функция выражена русским синтаксисом.
- source_word: אֲמַרְיָה
  choice: Амария
  rationale: Личное имя передано принятой русской библейской формой и одинаково в обоих случаях.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Та же родословная форма глагола ילד; единообразный перевод сохраняет структуру стиха и естественность современного русского языка.
- source_word: אֲחִיטוּב
  choice: Ахитув
  rationale: Личное имя передано принятой русской библейской формой.
