base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: ru
  text: 'А его братья по их родам[a], когда их вносили в родословные списки по поколениям: глава — Иеиел и Захария.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при их регистрации в родословных списках по поколениям».'
    reason: 'Лексико-синтаксическая альтернатива: בְּהִתְיַחֵשׂ может быть передано обстоятельственным оборотом о генеалогической регистрации, а לְתֹלְדוֹתָם уточняет её по поколениям.'
lexical_decisions:
- source_word: וְאֶחָיו
  choice: А его братья
  rationale: Прямо передаёт אָח; в родословном контексте слово может охватывать более широкий круг соплеменников, однако «братья» сохраняет форму исходного текста.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: по их родам
  rationale: מִשְׁפָּחָה в племенных списках обозначает род, а не домашнюю семью. Местоимение передано во множественном числе по смыслу, поскольку речь идёт о распределении братьев по родам.
- source_word: בְּהִתְיַחֵשׂ
  choice: при внесении их в родословную
  rationale: Hitpael глагола יחס в книгах Паралипоменон относится к учёту или регистрации по происхождению; данная формулировка естественна по-русски и сохраняет родословный смысл.
- source_word: לְתֹלְדוֹתָם
  choice: по поколениям
  rationale: תּוֹלְדוֹת здесь указывает на последовательность поколений или линии происхождения; «по поколениям» кратко и точно передаёт эту классификацию.
- source_word: הָרֹאשׁ
  choice: глава
  rationale: רֹאשׁ обозначает главу или старшего в родовой группе; «глава» сохраняет и образ исходного слова, и значение руководящего положения.
- source_word: יְעִיאֵל
  choice: Иеиел
  rationale: Традиционная русская библейская передача личного имени, соответствующая еврейскому יְעִיאֵל.
- source_word: וּזְכַרְיָהוּ
  choice: и Захария
  rationale: Устоявшаяся русская библейская форма имени זְכַרְיָהוּ.
