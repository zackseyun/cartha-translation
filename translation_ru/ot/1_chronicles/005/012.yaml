  revision_rationale: Устранены неестественный присоединительный союз и неясное прикрепление «в Васане». Глагол «жили» выражает подразумеваемое обстоятельство места в соответствии с контекстом перечня и традиционной русской передачей, не добавляя нового содержательного утверждения. Имя יַעְנַי приведено к обычной русской библейской форме «Янай».
