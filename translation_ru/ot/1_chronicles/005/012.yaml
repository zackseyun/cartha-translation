lexical_decisions:
- source_word: יוֹאֵל
  choice: Иоиль
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: הָרֹאשׁ
  choice: глава
  rationale: В данном перечне רֹאשׁ обозначает первенство или руководящее положение; «глава» естественно передаёт это значение и сохраняет краткую именную конструкцию.
- source_word: וְשָׁפָם
  choice: Шафам
  rationale: Личное имя транслитерировано в соответствии с принятой русской библейской традицией.
- source_word: הַמִּשְׁנֶה
  choice: второй по положению
  rationale: מִשְׁנֶה указывает на второе место в иерархии. Формулировка передаёт ранг, не уточняя без достаточных оснований конкретную должность.
- source_word: וְיַעְנַי
  choice: Яанай
  rationale: Личное имя передано посредством близкой к еврейскому звучанию русской транслитерации.
- source_word: וְשָׁפָט
  choice: Шафат
  rationale: Личное имя транслитерировано в соответствии с принятой русской библейской формой.
- source_word: בַּבָּשָׁן
  choice: в Васане
  rationale: Название области передано традиционной русской библейской формой «Васан»; предлог ב выражен русским «в».
