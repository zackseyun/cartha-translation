  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: ru
  text: Они жили в Галааде, в Васане и его городах[a], а также на всех пастбищах Сарона[b], до их пределов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его дочерях» — древнееврейское обозначение городов или селений, относящихся к данной области.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на всех открытых угодьях Сарона» либо «на всех общинных землях Сарона».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на (или у) их выходов»; то есть до их внешних пределов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Они жили
  rationale: Глагол ישׁב здесь обозначает постоянное проживание. «Жили» естественно для современного русского языка и, в отличие от «поселились», не переносит акцент на начало заселения.
- source_word: בַּגִּלְעָד
  choice: в Галааде
  rationale: Традиционная русская форма географического названия.
- source_word: בַּבָּשָׁן
  choice: в Васане
  rationale: Традиционная русская библейская форма географического названия.
- source_word: וּבִבְנֹתֶיהָ
  choice: и зависимых от него городах
  rationale: Буквально «и в его дочерях»; это древнееврейская идиома, обозначающая подчинённые или зависимые поселения. Местоименный суффикс женского рода естественнее всего отнести к ближайшему названию — Васану.
- source_word: מִגְרְשֵׁי
  choice: пастбищах
  rationale: מִגְרָשׁ обозначает открытые угодья вокруг поселений, нередко используемые для выпаса. В данном территориальном контексте «пастбища» передаёт наиболее вероятный смысл, а более широкие варианты отмечены в сноске.
- source_word: שָׁרוֹן
  choice: Сарона
  rationale: Использована традиционная русская форма названия области.
- source_word: עַל תּוֹצְאוֹתָם
  choice: до самых их границ
  rationale: Пространственное выражение буквально говорит об «их выходах» и указывает на внешние пределы упомянутых земель. «До самых их границ» ясно передаёт полноту территориального охвата.
