lexical_decisions:
- source_word: כֻּלָּם
  choice: Все они
  rationale: Передаёт значение совокупности и сохраняет явную силу местоименного суффикса 3-го лица множественного числа.
- source_word: הִתְיַחְשׂוּ
  choice: были внесены в родословные записи
  rationale: Хитпаэль глагола יחשׂ в книгах Паралипоменон обозначает внесение или учёт в генеалогических списках; выбранная формулировка естественно передаёт документально-генеалогический смысл.
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохраняет буквальный древнееврейский временной оборот, привычный и понятный в русском библейском стиле.
- source_word: יוֹתָם
  choice: Иофам
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Прямая и естественная передача сопряжённой конструкции.
- source_word: וּבִימֵי
  choice: и во дни
  rationale: Сохранены союз и повтор временного оборота, поддерживающие параллелизм исходного текста.
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции.
