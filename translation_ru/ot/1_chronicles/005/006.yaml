  text: בְּאֵרָ֣ה בְנ֔/וֹ אֲשֶׁ֣ר הֶגְלָ֔ה תִּלְּגַ֥ת פִּלְנְאֶ֖סֶר מֶ֣לֶךְ אַשֻּׁ֑ר ה֥וּא נָשִׂ֖יא לָ/רֽאוּבֵנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: ru
  text: Беэра, его сын, которого Тилгат-Пилнеэсэр[a], царь Ассирии, увёл в изгнание. Он был вождём рувимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Так имя ассирийского царя звучит в еврейском тексте этого стиха; более известная историческая форма — «Тиглатпаласар».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: Беэра
  rationale: Личное имя передано транслитерацией с еврейского; сочетание «э» отражает раздельное звучание гласных вокруг алефа.
- source_word: בְנוֹ
  choice: его сын
  rationale: Существительное с суффиксом 3-го лица мужского рода отсылает к ранее названному предку; по-русски естественно «его сын».
- source_word: אֲשֶׁר
  choice: которого
  rationale: Относительное местоимение вводит придаточное, где Беэра является прямым объектом действия царя.
- source_word: הֶגְלָה
  choice: увёл в изгнание
  rationale: Каузативная форма глагола גלה обозначает насильственное отправление в изгнание; формулировка сохраняет исторический смысл депортации и остаётся понятной без канцеляризма.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: Тилгат-Пилнеэсэр
  rationale: Имя передано непосредственно по еврейской форме данного стиха, без согласования с более известной аккадской или иной библейской формой.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: царь Ассирии
  rationale: Естественная русская передача сопряжённой конструкции; титул стоит как приложение к имени.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение возобновляет речь о Беэре после относительного придаточного и сохраняет еврейское смысловое выделение.
- source_word: נָשִׂיא
  choice: вождь
  rationale: В родоплеменном контексте слово обозначает признанного главу; «вождь» не приписывает ему царского статуса, возможного при переводе «князь».
- source_word: לָרְאוּבֵנִי
  choice: рувимлян
  rationale: Предлог ל выражает отношение руководителя к группе; родительный падеж после «вождь» естественно передаёт значение «вождь рувимлян».
