source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: ru
  text: ибо Иуда стал сильнее своих братьев, и из его рода вышел правитель[a], а первородство принадлежало Иосифу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вождь»; или: «князь».'
    reason: Лексема נָגִיד допускает значения «правитель», «вождь», «князь».
lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение предшествующего утверждения об утрате Рувимом первородства; причинная связь в русском передаётся естественно.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная русская передача имени и одноимённого колена.
- source_word: גָּבַר בְּאֶחָיו
  choice: стал сильнее своих братьев
  rationale: Глагол выражает превосходство в силе или положении; сравнительная конструкция по-русски ясно передаёт возвышение Иуды среди братьев.
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: и от него произошёл вождь
  rationale: נָגִיד обозначает предводителя, правителя или князя; формулировка сохраняет происхождение вождя от Иуды, не уточняя сверх текста его личность.
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  choice: но первородство принадлежало Иосифу
  rationale: בְּכֹרָה означает статус и право первенца. Противительный союз естественно выражает сопоставление власти Иуды с первородством Иосифа.
theological_decisions:
- issue: Соотношение главенства Иуды и первородства Иосифа
  choice: Власть и превосходство связываются с Иудой, тогда как первородство остаётся за Иосифом.
  alternative: Понимать слова лишь как общее превосходство Иуды при сохранении за Иосифом наследственных преимуществ.
  rationale: Еврейский текст намеренно различает две привилегии; перевод сохраняет это напряжение и не сводит их к одному статусу.
- issue: Личность נָגִיד
  choice: Не называть конкретного правителя и передать родовым словом «вождь».
  alternative: Уточнить как царя Давида, мессианского Правителя или князя.
  rationale: Контекст допускает династическую и богословскую значимость, но сам стих не называет конкретного лица; уточнение было бы истолкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранено различие между возвышением Иуды, происхождением от него вождя и принадлежностью первородства Иосифу.
