base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: ru
  text: Но они изменили Богу своих отцов и предались блуду, последовав за богами народов этой земли[a], которых Бог истребил перед ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст использует сексуальную метафору: идолопоклонство изображено как блуд и нарушение верности завету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: изменили
  rationale: Глагол מעל обозначает вероломное нарушение верности, особенно в отношениях завета. «Изменили» естественно передаёт нарушение верности Богу и поддерживает последующую брачную метафору.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: Богу своих отцов
  rationale: Предлог ב при מעל указывает на того, против кого совершена измена; по-русски это естественно выражается беспредложным дательным падежом.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: блудно пошли вслед за
  rationale: Перевод сохраняет сексуальную метафору זנה и одновременно передаёт направленность אַחֲרֵי — следование за чужими богами.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: богами народов той земли
  rationale: «Народы» точно передаёт עַמֵּי, а «той земли» обозначает местную землю, населённую народами, о которых говорится далее.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: которых Бог истребил перед ними
  rationale: Относительное местоимение отнесено к ближайшему грамматически подходящему антецеденту — народам. Единственное число глагола при אֱלֹהִים требует перевода «Бог»; «перед ними» сохраняет образ удаления народов с пути израильтян.
theological_decisions:
- issue: Сохранение сексуальной метафоры идолопоклонства
  choice: блудно пошли вслед за богами
  alternative: стали поклоняться богам / оказались неверны, последовав за богами
  rationale: זנה намеренно изображает идолопоклонство как супружескую и заветную неверность; нейтральный перевод ослабил бы богословскую силу текста.
- issue: Значение אֱלֹהִים в относительном предложении
  choice: Бог
  alternative: боги
  rationale: Глагол הִשְׁמִיד стоит в единственном числе, поэтому здесь имеется в виду единый Бог, истребивший народы.
- issue: Антецедент относительного местоимения אֲשֶׁר
  choice: народы той земли
  alternative: боги народов той земли
  rationale: Форма местоимения сама по себе не различает эти варианты, однако именно народы, а не их боги, обычно описываются как истреблённые Богом перед Израилем. Синтаксис допускает формальную близость к «богам», поэтому конструкция сохраняет присущую оригиналу относительную компактность.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства летописного повествования. «Блудно пошли» несколько маркировано, но понятно и необходимо для сохранения исходной метафоры; архаизмы вроде «блудодействовали вослед» исключены.
