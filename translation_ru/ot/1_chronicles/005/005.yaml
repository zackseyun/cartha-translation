translation:
  language: ru
  text: Миха, его сын; Реайя, его сын; Ваал, его сын.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «Ваал» здесь является личным именем в родословии, а не титулом, переводимым как «господин».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיכָה
  choice: Миха
  rationale: Личное имя передано принятой в русской библейской традиции формой, соответствующей еврейскому имени.
- source_word: בְנוֹ
  choice: его сын
  rationale: Существительное с суффиксом 3-го лица мужского рода единственного числа буквально означает «его сын»; повтор формулы передаёт последовательность родословия.
- source_word: רְאָיָה
  choice: Реая
  rationale: Личное имя транслитерировано с учётом еврейского звучания и норм русской передачи библейских имён.
- source_word: בַּעַל
  choice: Баал
  rationale: В родословном перечне слово функционирует как личное имя, поэтому оно транслитерировано, а не переведено как титул «господин».
theological_decisions:
- issue: Следует ли переводить בַּעַל как титул или обозначение божества либо сохранять как личное имя
  choice: Сохранено личное имя «Баал»
  alternative: Перевести как «господин» или истолковать непосредственно как обозначение божества
  rationale: Синтаксис и жанр родословия ставят это слово в один ряд с другими личными именами. Перевод титулом нарушил бы структуру перечня, а прямое отождествление с божеством добавило бы к тексту не выраженное им толкование.
translation_notes:
  register: Краткая родословная формула передана современным литературным русским языком с сохранением повторов оригинала. Точки с запятой помогают ясно разделить звенья цепи; сноска поставлена после всего стиха, поскольку относится к имени «Баал».
