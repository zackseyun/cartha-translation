  yaml_path: translation/ot/1_chronicles/005/032.yaml
  text: Uzzi fathered Zerahiah, and Zerahiah fathered Meraioth.
translation:
  language: ru
  text: Уззий родил Зерахию, а Зерахия родил Мераиофа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: Уззий
  rationale: Личное имя передано принятой в русской библейской традиции формой; начальный союз не выражен отдельно, поскольку стих продолжает родословный перечень, а по-русски начинать самостоятельный стих с «и» необязательно.
- source_word: הוֹלִיד
  choice: родил
  rationale: В родословном контексте каузативная форма глагола ילד означает «породил, стал отцом»; «родил» — краткая традиционная формула, применяемая здесь к мужчине и сохраняющая структуру оригинала.
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском языке.
- source_word: זְרַחְיָה
  choice: Зерахию
  rationale: Личное имя передано традиционной русской библейской формой и поставлено в винительный падеж по синтаксису предложения.
- source_word: וּֽ/זְרַֽחְיָה
  choice: а Зерахия
  rationale: Союз ו передан как «а», чтобы естественно связать последовательные звенья родословия; имя повторено в соответствии с оригиналом.
- source_word: הוֹלִיד
  choice: родил
  rationale: Повтор глагола сохранён ради ритма и ясности родословной цепочки.
- source_word: מְרָיֽוֹת
  choice: Мераиофа
  rationale: Имя передано принятой русской библейской формой «Мераиоф» и поставлено в винительный падеж.
theological_decisions: []
