  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: ru
  text: 'Сыновья Амрама[a]: Аарон, Моисей и Мариам; сыновья Аарона: Надав, Авиуд, Елеазар и Ифамар.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья». В этом генеалогическом перечне наряду с Аароном и Моисеем названа также Мариам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: Сыновья Амрама
  rationale: Форма множественного числа в сопряжённом состоянии вводит генеалогический перечень; начальный союз в русском заголовочном обороте естественно не воспроизводится.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: Аарон, Моисей и Мариам
  rationale: Имена переданы в укоренившихся русских библейских формах; повторяющийся еврейский союз оформлен как естественное русское перечисление.
- source_word: וּבְנֵי אַהֲרֹן
  choice: сыновья Аарона
  rationale: Оборот вводит второй, подчинённый генеалогический перечень. Связь с первым перечнем ясно выражена точкой с запятой, поэтому союз опущен ради естественного русского синтаксиса.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: Надав, Авиуд, Елеазар и Ифамар
  rationale: Использованы традиционные русские формы библейских имён; союзы исходного текста переданы по нормам русского перечисления.
theological_decisions:
- issue: Употребление בְּנֵי («сыновья») перед перечнем, включающим Мариам
  choice: Сохранить буквальное «сыновья» и пояснить особенность в сноске
  alternative: Передать нейтрально как «дети Амрама»
  rationale: Мужская форма важна для формы генеалогического перечня, но в данном месте перечень явно включает дочь; сноска сохраняет и буквальную лексику, и фактический смысл без устранения напряжения.
translation_notes:
  register: Современный литературный русский с кратким генеалогическим синтаксисом; сохранены традиционные русские формы общеизвестных библейских имён.
