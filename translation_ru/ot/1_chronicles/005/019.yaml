lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: вели войну
  rationale: Еврейское сочетание буквально означает «делать войну», но по-русски естественно передаётся устойчивым выражением «вести войну»; оно сохраняет более широкий смысл военных действий, не сводя их к одному сражению.
- source_word: עִם
  choice: с
  rationale: В сочетании «вести войну с» русский предлог ясно обозначает противника и естественно передаёт контекстуально враждебный смысл еврейского עִם.
- source_word: הַהַגְרִיאִים
  choice: агарянами
  rationale: Этноним передан традиционной и понятной русской формой «агаряне»; определённость еврейского артикля в русском здесь выражается контекстом, без отдельного показателя.
- source_word: וִיטוּר
  choice: Итуром
  rationale: Имя собственное транслитерировано в принятой русской библейской форме и поставлено в творительный падеж по управлению предлога «с».
- source_word: וְנָפִישׁ
  choice: Нафишем
  rationale: Имя собственное передано русской транслитерацией и согласовано с синтаксисом перечисления.
- source_word: וְנוֹדָב
  choice: и Нодавом
  rationale: Имя собственное передано русской транслитерацией; союз сохранён для структуры перечисления.
