  text: Они вели войну с агарянами[a], Итуром, Нафишем и Нодавом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хагритами». Еврейский этноним допускает разные способы передачи на русском языке.'
