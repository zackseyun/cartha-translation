  text: Ahitub fathered Zadok, and Zadok fathered Shallum.
translation:
  language: ru
  text: Ахитув стал отцом Садока, и Садок стал отцом Шаллума.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: Ахитув
  rationale: Личное имя передано традиционной русской библейской транслитерацией; начальный союз не выделен отдельно, поскольку стих продолжает родословную.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В породе хифиль глагол ילד в родословиях означает «породить, стать отцом». Выражение «стал отцом» естественно для современного русского языка и точно передаёт генеалогическую связь.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; его функция выражена синтаксисом.
- source_word: צָדוֹק
  choice: Садок
  rationale: Личное имя передано в укоренившейся русской библейской форме.
- source_word: וְ/צָדוֹק
  choice: а Садок
  rationale: Союз ו соединяет последовательные звенья родословной; русское «а» естественно обозначает переход к следующему поколению без противопоставления.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Личное имя передано в форме, близкой к еврейскому произношению и принятой в современных русских передачах библейских имён.
