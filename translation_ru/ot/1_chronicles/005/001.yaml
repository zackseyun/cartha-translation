  naturalness: 'Основной текст сделан более естественным для современного литературного русского: устранены неудачная запятая перед завершающим тире и чрезмерно определённое местоимение в последней части. Стих по-прежнему намеренно заканчивается тире, так как синтаксически продолжается в ст. 2.'
  terminology: «Право первородства» точно передаёт בְּכֹרָה, а «внесение в родословие» — генеалогический смысл להתיחשׂ. «Ложе» уместно для יצועי в данном контексте. Имя «Израиль» сохранено без пояснительной сноски, поскольку оно является обычным библейским именем и не нуждается здесь в отдельном якоре.
