  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: ru
  text: Сыновья Рувима, первенца Израиля, — ведь он был первенцем; но, поскольку он осквернил ложе своего отца, его право первородства было отдано сыновьям Иосифа, сына Израиля, однако это не означало внесения в родословие по праву первородства —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: Сыновья Рувима
  rationale: Начальное ו связывает стих с контекстом, но в русском отдельное «и» перед заголовочно-генеалогической конструкцией не требуется; בְּנֵי передано прямо как «сыновья».
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: первенца Израиля
  rationale: Сохраняется указание на биологический и родовой статус Рувима как первенца; «Израиль» здесь — имя Иакова.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: ведь он был первенцем
  rationale: כִּי вводит пояснение; русское «ведь» естественно передаёт его пояснительную функцию.
- source_word: וּבְחַלְּלוֹ יְצוּעֵי אָבִיו
  choice: но за то, что он осквернил ложе своего отца
  rationale: Инфинитив с ב выражает причину или обстоятельство. חלל сохраняет сильный смысл осквернения, а множественное יְצוּעֵי идиоматически передано единственным «ложе».
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: его право первородства было отдано
  rationale: בְּכֹרָה означает привилегии и права первенца, а не только порядок рождения; «право первородства» ясно выражает юридико-родовой смысл.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: сыновьям Иосифа, сына Израиля
  rationale: Сохранена явная генеалогическая идентификация Иосифа как сына Израиля.
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: однако по праву первородства он не был внесён в родословие
  rationale: התיחשׂ — специальный глагол генеалогического учёта. Формулировка удерживает не вполне выраженный в еврейском подлежащий референт и различает передачу права первородства и место в родословной.
theological_decisions:
- issue: Соотношение биологического первенства Рувима и переданного права первородства
  choice: Рувим остаётся назван первенцем по рождению, тогда как право первородства передано сыновьям Иосифа; последняя оговорка не позволяет полностью отождествить это право с порядком генеалогической записи.
  alternative: Понять передачу так, будто Иосиф или его сыновья во всех отношениях заменили Рувима в качестве первенца.
  rationale: Текст намеренно различает исходный статус Рувима, привилегии первородства и генеалогическое исчисление; перевод не устраняет это напряжение.
- issue: Неявный субъект заключительной фразы
  choice: В основном тексте употреблено «он», наиболее естественно относящееся к Рувиму, при сохранении поясняющей сноски о синтаксической сжатости.
  alternative: 'Отнести фразу к Иосифу или его сыновьям: они получили право первородства, но не были записаны как первенцы.'
  rationale: В еврейской конструкции субъект инфинитива прямо не назван. Контекст допускает пояснительное понимание результата передачи, поэтому альтернативная формулировка вынесена в сноску, а не исключена.
translation_notes:
  register: Современный литературный русский язык с достоинством летописно-генеалогического контекста. Стих оставлен синтаксически незавершённым и заканчивается тире, поскольку мысль продолжается в следующем стихе. Термины «первородство» и «родословие» выбраны как понятные и точные для обычного читателя.
