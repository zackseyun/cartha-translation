revisions:
- from: Сыновья Рувима, первенца Израиля[a] — ведь он был первенцем, но за то, что он осквернил ложе своего отца, его право первородства было отдано сыновьям Иосифа, сына Израиля, однако по праву первородства он не был внесён в родословие[b], —
  to: Сыновья Рувима, первенца Израиля, — ведь он был первенцем; но, поскольку он осквернил ложе своего отца, его право первородства было отдано сыновьям Иосифа, сына Израиля, однако это не означало внесения в родословие по праву первородства —
  rationale: Убрана необоснованная идентификация неявного субъекта с Рувимом. Формулировка «это не означало» связывает последнюю оговорку с передачей права первородства, не утверждая, кто именно должен был или не должен был быть внесён в родословие. Ненужная сноска об имени Израиль удалена; сноска b переработана так, чтобы описывать грамматическую трудность без конфессионального или интерпретационного разрешения.
  reviewer_model: gpt-5.6-terra
