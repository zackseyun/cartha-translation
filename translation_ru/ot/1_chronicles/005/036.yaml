  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: ru
  text: И Иоханан стал отцом Азарии; именно Азария служил священником в доме[a], построенном Соломоном в Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храме»; буквально: «в доме» — так часто называли храм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: И Иоханан
  rationale: Союз ו передан как «И», чтобы сохранить последовательность родословия; имя передано в принятой русской библейской форме.
- source_word: הוֹלִיד אֶת עֲזַרְיָה
  choice: стал отцом Азарии
  rationale: В родословии Hiphil глагола ילד означает «породил, стал отцом». Выбран естественный современный оборот, сохраняющий значение мужского родительства.
- source_word: הוּא אֲשֶׁר
  choice: он и был тем, кто
  rationale: Конструкция особо выделяет Азарию; частица «и» передаёт эмфатический характер местоимения הוּא.
- source_word: כִּהֵן
  choice: служил священником
  rationale: Глагол כהן обозначает исполнение священнического служения, а не только обладание саном.
- source_word: בַּ/בַּיִת
  choice: в доме
  rationale: Сохранено буквальное «дом»; из контекста ясно, что речь идёт о храме Соломона.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: построенном Соломоном
  rationale: Причастный оборот естественно передаёт определительное придаточное и однозначно связывает постройку с Соломоном.
- source_word: בִּ/ירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Стандартная русская передача топонима с сохранением предлога.
