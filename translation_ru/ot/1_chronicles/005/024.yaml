base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: ru
  text: 'Вот главы их родов: Эфер, Ишъи, Элиэл, Азриэл, Иеремия, Годавия и Яхдиэл — доблестные воины, прославленные люди[a], главы своих родов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «люди имён», то есть известные, выдающиеся люди.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי בֵית אֲבוֹתָם / רָאשִׁים לְבֵית אֲבוֹתָם
  choice: главы их родов / главы своих родов
  rationale: Выражение обозначает руководителей родовых объединений, ведущих происхождение от общего предка. Русское «главы родов» естественно передаёт социальную структуру текста; повтор в конце сохранён.
- source_word: עֵפֶר
  choice: Эфер
  rationale: Транслитерация личного имени непосредственно с еврейской формы.
- source_word: יִשְׁעִי
  choice: Ишъи
  rationale: Транслитерация сохраняет гортанный согласный айн через разделительный твёрдый знак.
- source_word: אֱלִיאֵל
  choice: Элиэл
  rationale: Прямая и благозвучная русская транслитерация личного имени.
- source_word: עַזְרִיאֵל
  choice: Азриэл
  rationale: Передаёт еврейскую форму имени без добавочного гласного.
- source_word: יִרְמְיָה
  choice: Иеремия
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: הוֹדַוְיָה
  choice: Годавия
  rationale: Начальный еврейский h передан традиционным для русских библейских имён «г»; форма отражает Hodawyah.
- source_word: יַחְדִּיאֵל
  choice: Яхдиэл
  rationale: Транслитерация сохраняет согласный хет и структуру еврейского имени.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: доблестные воины
  rationale: Устойчивое сочетание указывает на силу, отвагу и военную состоятельность; современная русская формулировка передаёт весь оборот без тяжеловесной буквальности.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: прославленные люди
  rationale: Буквально «люди имён» — идиома, обозначающая известных, выдающихся людей.
