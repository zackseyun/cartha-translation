  text: בְּנֵ֥י רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל חֲנ֥וֹךְ וּ/פַלּ֖וּא חֶצְר֥וֹן וְ/כַרְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/003.yaml
  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: ru
  text: 'Сыновья Рувима, первенца Израиля: Ханох, Фаллу, Хецрон и Карми.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן в непосредственном перечне мужских потомков естественно означает «сыновья»; более широкое «потомки» здесь не требуется.
- source_word: רְאוּבֵן
  choice: Рувим
  rationale: Использована устоявшаяся в русской библейской традиции форма имени, хорошо узнаваемая современным читателем.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: первенца Израиля
  rationale: Приложение определяет Рувима как первенца Израиля; родительный падеж естественно согласуется с оборотом «сыновья Рувима» и сохраняет структуру исходного смысла.
- source_word: חֲנוֹךְ
  choice: Ханох
  rationale: Транслитерация ближе к еврейской форме имени и отличает его от традиционной русской формы другого имени «Енох».
- source_word: פַלּוּא
  choice: Фаллу
  rationale: Сохранена устоявшаяся русская библейская форма имени.
- source_word: חֶצְרוֹן
  choice: Хецрон
  rationale: Передача имени следует еврейскому звучанию и современной русской транслитерации.
- source_word: כַרְמִי
  choice: Карми
  rationale: Имя передано простой транслитерацией без смыслового перевода.
