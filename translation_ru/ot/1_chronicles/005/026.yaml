  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: ru
  text: И возбудил Бог Израиля дух Фула, царя Ассирии, и дух Феглафелласара, царя Ассирии[a], и он увёл в изгнание рувимлян, гадитян и половину колена Манассии; он привёл их в Халах, Хавор, Хару и к реке Гозан, где они остаются по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская конструкция может обозначать двух ассирийских правителей или два имени одного царя. «Феглафелласар» передаёт форму имени в еврейском тексте; более привычный вариант — «Тиглатпаласар».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּעַר
  choice: возбудил
  rationale: Глагол означает побудить, пробудить к действию. «Возбудил дух» сохраняет причинное действие Бога и соответствует возвышенному повествовательному регистру, не придавая ему обязательно отрицательного оттенка.
- source_word: רוּחַ ... רוּחַ
  choice: дух ... дух
  rationale: Прямо передаёт внутреннее побуждение или расположение правителя и сохраняет богословскую выразительность исходного текста.
- source_word: פּוּל
  choice: Фул
  rationale: Традиционная русская библейская передача личного имени, понятная читателям и близкая еврейской форме.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: Феглафелласар
  rationale: Устоявшаяся русская библейская форма имени; отличие формы еврейского текста от других традиционных вариантов отмечено в сноске.
- source_word: וַיַּגְלֵם
  choice: переселил в изгнание
  rationale: Каузативная форма означает увести или переселить в изгнание. Формулировка естественна по-русски и передаёт как насильственное перемещение, так и состояние изгнания.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: колено Рувима, колено Гада
  rationale: Такое обозначение племенных групп естественно и ясно для современного русского читателя в библейском контексте.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: половину колена Манассии
  rationale: Точно и естественно передаёт половину племени Манассии, жившую к востоку от Иордана.
- source_word: וַיְבִיאֵם
  choice: привёл их
  rationale: Прямое соответствие каузативной форме глагола בוא в последовательности изгнания и перемещения.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: в Халах, Хавор, Хару и к реке Гозан
  rationale: Географические названия переданы транслитерацией. Разные предлоги отражают естественное русское управление при названиях мест и реки.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Там они остаются и по сей день
  rationale: Русская формулировка раскрывает подразумеваемое продолжение пребывания изгнанников, делая заключение предложения естественным без изменения смысла идиомы.
theological_decisions:
- issue: Соотношение Фула и Феглафелласара
  choice: Основной текст сохраняет повтор «дух» и союз «и», не отождествляя имена однозначно.
  alternative: Понимать Фула и Феглафелласара как два имени одного ассирийского царя.
  rationale: Еврейский текст повторяет רוּחַ и соединяет два имени союзом, что синтаксически допускает как двух правителей, так и два имени одного правителя. Основной текст сохраняет эту неоднозначность, а исторически вероятное отождествление вынесено в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксическая неоднозначность двух царских имён сохранена, а не разрешена в основном тексте.
