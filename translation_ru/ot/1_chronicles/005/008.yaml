  text: וּ/בֶ֨לַע֙ בֶּן עָזָ֔ז בֶּן שֶׁ֖מַע בֶּן יוֹאֵ֑ל ה֚וּא יוֹשֵׁ֣ב בַּ/עֲרֹעֵ֔ר וְ/עַד נְב֖וֹ וּ/בַ֥עַל מְעֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: ru
  text: И Бела, сын Азаза, сына Шемы, сына Иоиля, жил в Ароэре, вплоть до Нево и Баал-Меона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֶלַע
  choice: и Бела
  rationale: Союз ו сохраняет связь с продолжающимся перечнем; личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: В родословной конструкции слово естественно обозначает сыновнюю или родовую связь; буквальная форма сохраняет структуру еврейского текста.
- source_word: עָזָז
  choice: Азаз
  rationale: Личное имя транслитерировано с еврейского.
- source_word: שֶׁמַע
  choice: Шема
  rationale: Личное имя транслитерировано с еврейского с различением от формы «Шемая».
- source_word: יוֹאֵל
  choice: Иоиль
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: הוּא יוֹשֵׁב
  choice: Он жил
  rationale: Местоимение возобновляет речь о Беле после цепочки предков, а причастие от ישׁב обозначает постоянное проживание; современное «жил» передаёт смысл без архаизации.
- source_word: בַּעֲרֹעֵר
  choice: в Ароэре
  rationale: Предлог ב обозначает место проживания; название передано в устоявшейся русской форме.
- source_word: וְעַד
  choice: вплоть до
  rationale: Оборот обозначает предел территории и естественно связывает исходный пункт с географической границей.
- source_word: נְבוֹ
  choice: Нево
  rationale: Название места передано в принятой русской библейской форме.
- source_word: וּבַעַל מְעוֹן
  choice: и Баал-Меона
  rationale: Составное географическое название транслитерировано через дефис; родительный падеж определяется предлогом «до», общим для двух названий.
