source:
  edition: WLC
  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: ru
  text: Сыны половины колена Манассии жили в земле от Васана до Ваал-Ермона, Сенира и горы Ермон[a]; они стали многочисленны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ваал-Ермон, Сенир и гора Ермон — географические названия, обозначающие северные пределы этой территории.
    reason: cultural_note
  - marker: b
    text: 'Или: «их стало много», «они умножились». Еврейский глагол подчёркивает увеличение их численности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыны
  rationale: В родоплеменном контексте слово обозначает членов или потомков группы. «Сыны» сохраняет генеалогический оттенок оригинала и остаётся понятным в возвышенном повествовательном стиле.
- source_word: חֲצִי שֵׁבֶט
  choice: половины колена
  rationale: Речь идёт о признанной части колена Манассии, обитавшей к востоку от Иордана; эта формулировка естественна для русской библейской терминологии.
- source_word: מְנַשֶּׁה
  choice: Манассии
  rationale: Употреблена закрепившаяся в русском языке форма библейского имени.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: Глагол описывает постоянное обитание в области; «жили» передаёт смысл естественно и без архаизма.
- source_word: בָּאָרֶץ
  choice: в земле
  rationale: Сохранён широкий смысл «земля, область, территория» без излишнего уточнения.
- source_word: מִבָּשָׁן עַד
  choice: от Васана до
  rationale: Предложная конструкция обозначает географические пределы территории.
- source_word: בַּעַל חֶרְמוֹן
  choice: Ваал-Ермона
  rationale: Использована традиционная русская передача составного географического названия; падеж обусловлен предлогом «до».
- source_word: וּשְׂנִיר
  choice: Сенира
  rationale: Географическое имя передано в традиционной русской форме и включено в ряд пределов после «до».
- source_word: וְהַר חֶרְמוֹן
  choice: и горы Ермон
  rationale: הַר буквально означает «гора»; перевод сохраняет отличие горы Ермон от названного ранее Ваал-Ермона.
- source_word: הֵמָּה רָבוּ
  choice: они стали многочисленны
  rationale: Глагол רָבוּ выражает рост численности, а самостоятельное местоимение הֵמָּה придаёт субъекту некоторое смысловое выделение. Формулировка передаёт итоговое увеличение группы.
