  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: ru
  text: И Иоседек ушёл, когда Яхве увёл Иудею и Иерусалим в изгнание рукой Навуходоносора.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «И Иоседек пошёл, когда Яхве изгнал Иудею и Иерусалим рукой Навуходоносора».'
    reason: Лексическая альтернатива, показывающая более формальное соответствие глаголам הָלַךְ и הגלה.
lexical_decisions:
- source_word: וִיהוֹצָדָק
  choice: И Иоседек
  rationale: Союз ו передан как «И». Для имени выбрана укоренившаяся в русской библейской традиции форма «Иоседек», соответствующая полной еврейской форме יְהוֹצָדָק.
- source_word: הָלַךְ
  choice: ушёл
  rationale: Глагол означает «идти, уходить»; в контексте переселения «ушёл» естественно передаёт удаление из страны, не приписывая Иоседеку инициативу в самом изгнании.
- source_word: בְּהַגְלוֹת
  choice: когда ... увёл ... в изгнание
  rationale: 'Предлог ב с инфинитивом породы hifil имеет временное значение: «когда [Яхве] изгонял/переселял». Формулировка сохраняет смысл изгнания и естественно разворачивает еврейскую инфинитивную конструкцию по-русски.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֶת יְהוּדָה וִירוּשָׁלָם
  choice: Иудею и Иерусалим
  rationale: Сохранены прямо названные объекты действия — страна Иудея и город Иерусалим; уточнение «жителей» не добавляется.
- source_word: בְּיַד
  choice: рукой
  rationale: Еврейская идиома обозначает посредника или орудие действия. Буквально-идиоматическое «рукой» сохраняет одновременно божественную и человеческую причинность.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Навуходоносора
  rationale: Использована общепринятая русская форма имени в требуемом родительном падеже.
theological_decisions:
- issue: Божественная и человеческая причинность изгнания
  choice: Яхве представлен совершающим изгнание, а Навуходоносор — его человеческим орудием.
  alternative: Представить Навуходоносора единственным действующим лицом переселения.
  rationale: В еврейском синтаксисе Яхве является субъектом действия הגלה, тогда как оборот בְּיַד נְבֻכַדְנֶאצַּר обозначает посредника. Перевод сохраняет это напряжение, не умаляя исторической роли вавилонского царя.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Оборот «рукой Навуходоносора» намеренно сохранён как понятная библейская идиома, чтобы явно передать вторичную человеческую причинность.
