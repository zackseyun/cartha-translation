  text: בְּנֵ֖י לֵוִ֑י גֵּרְשׁ֕וֹן קְהָ֖ת וּ/מְרָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/027.yaml
  text: 'The sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: ru
  text: 'Сыновья Левия: Гирсон[a], Кааф и Мерари.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки Левия». В родословиях слово «сыновья» иногда обозначает более широкую линию потомков, хотя здесь, вероятнее всего, имеются в виду три непосредственных сына Левия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן. В родословиях слово может обозначать и потомков в более широком смысле, но здесь перечислены три непосредственных сына Левия.
- source_word: לֵוִי
  choice: Левий
  rationale: Традиционная и устоявшаяся русская передача библейского личного имени.
- source_word: גֵּרְשׁוֹן
  choice: Гирсон
  rationale: Устоявшаяся русская форма имени Гершон; она отличает его от имени Гирсам, соответствующего иной еврейской форме.
- source_word: קְהָת
  choice: Кааф
  rationale: Устоявшаяся русская библейская форма личного имени קְהָת.
- source_word: מְרָרִי
  choice: Мерари
  rationale: Устоявшаяся русская библейская форма личного имени מְרָרִי.
- source_word: וּ
  choice: и
  rationale: Простой соединительный союз перед последним именем в перечне.
theological_decisions: []
