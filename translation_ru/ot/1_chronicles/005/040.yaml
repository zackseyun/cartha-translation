  text: Azariah fathered Seraiah, and Seraiah fathered Jehozadak.
translation:
  language: ru
  text: Азария стал отцом Сераии, а Сераия стал отцом Иехосадака.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: Азария
  rationale: Личное имя передано в принятой русской библейской форме; начальный союз естественно учитывается связью с предшествующей родословной.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В родословном контексте форма хифиль глагола ילד обозначает рождение потомка от названного мужчины. Современное «стал отцом» естественно и не имеет архаического оттенка слова «родил» применительно к мужчине.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного соответствия в русском; его синтаксическая функция выражена построением фразы.
- source_word: שְׂרָיָה
  choice: Сераия
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: וּ/שְׂרָיָה
  choice: а Сераия
  rationale: Союз ו связывает параллельные звенья родословной; русское «а» естественно передаёт переход к следующему поколению без противопоставления.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Повтор глагола передан одинаково ради ясности и сохранения структуры родословной.
- source_word: יְהוֹצָדָק
  choice: Иехосадак
  rationale: Имя передано в традиционной русской библейской форме, отражающей еврейское יְהוֹצָדָק.
