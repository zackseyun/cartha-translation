  text: 'Сыновья Иоиля[a]: Шемаия; его сын — Гог; его сын — Шимей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потомки Иоиля». Еврейская родословная формула иногда может обозначать более широкое происхождение, однако повторение слов «его сын» здесь указывает на прямую линию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Сыновья
  rationale: Форма множественного числа в сопряжённом состоянии вводит родословную. Буквальное «сыновья» сохраняет еврейскую формулу; в родословиях слово может обозначать и потомков шире, однако последующее повторение «его сын» указывает здесь на прямую линию.
- source_word: יוֹאֵל
  choice: Иоиль
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Личное имя транслитерировано с древнееврейского в современной понятной форме.
- source_word: בְנוֹ
  choice: его сын
  rationale: Существительное בֵּן с суффиксом третьего лица мужского рода единственного числа буквально обозначает «его сын»; повтор формулы сохранён.
- source_word: גּוֹג
  choice: Гог
  rationale: Личное имя передано традиционной русской библейской формой; в данном месте оно имеет обычную родословную функцию.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Личное имя передано в принятой русской библейской форме.
