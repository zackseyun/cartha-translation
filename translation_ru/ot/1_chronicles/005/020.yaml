  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: ru
  text: Им была оказана помощь в борьбе против них, и агаряне, и все, кто был с ними, были преданы в их руки[a], потому что в битве они воззвали к Богу, и Он внял их мольбе[b], так как они уповали на Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «преданы в их руки» означает, что враги были отданы под их власть и потерпели поражение.
    reason: lexical_alternative
  - marker: b
    text: 'Также возможен буквальный перевод: «Он дал Себя умолить им», то есть благосклонно ответил на их молитву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: Им была оказана помощь в борьбе с ними
  rationale: Страдательная конструкция передаёт нифаль глагола עזר и не называет прямо действующее лицо; последующая часть стиха указывает на Божью помощь. Оборот сохраняет местоименную неоднозначность оригинала.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: были преданы в их руки
  rationale: Сохранён древнееврейский военный образ передачи противника под власть победителей; смысл идиомы пояснён в сноске.
- source_word: הַהַגְרִיאִים
  choice: агаряне
  rationale: Употреблено традиционное и узнаваемое в русском библейском контексте название народа, соответствующее еврейскому этнониму.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: и все, кто был с ними
  rationale: Буквально и естественно передаёт сопровождавших агарян людей, не уточняя без достаточного основания, были ли они союзниками или иными участниками войска.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ בַּמִּלְחָמָה
  choice: потому что в битве они воззвали к Богу
  rationale: «Воззвали» передаёт настойчивый крик о помощи, а «в битве» относится к конкретному сражению в контексте.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: и Он внял их мольбе
  rationale: Нифаль עתר обозначает благосклонный отклик на обращённую к Богу мольбу. Выражение естественно по-русски и сохраняет молитвенный контекст.
- source_word: כִּי בָטְחוּ בוֹ
  choice: так как они уповали на Него
  rationale: «Уповали» передаёт доверие и опору на Бога, сохраняя причинную связь между доверием и Божьим ответом.
theological_decisions:
- issue: Кто оказал помощь в битве
  choice: Страдательное выражение «им была оказана помощь» оставляет непосредственного деятеля невыраженным, как и еврейская форма.
  alternative: «Бог помог им одолеть врагов».
  rationale: Не следует превращать страдательную конструкцию в прямо названное действие Бога, хотя дальнейшие слова о молитве и уповании ясно указывают на Него как на источник помощи.
- issue: Характер Божьего ответа на молитву
  choice: «Он внял их мольбе».
  alternative: «Он позволил им умолить Себя» или «Он ответил им».
  rationale: Выбранный вариант ясно выражает благосклонный ответ Бога, не вводя дополнительного содержания о форме этого ответа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («воззвали», «уповали»). Синтаксис сохраняет повтор местоимений и причинные связи оригинала, не устраняя его подлинную неоднозначность.
