lexical_decisions:
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Традиционная и узнаваемая русская передача библейского личного имени.
- source_word: הוֹלִיד / הֹלִיד
  choice: стал отцом
  rationale: В родословном контексте каузативная форма глагола ילד указывает на рождение потомка; выражение естественно для современного русского языка и не привносит архаичности слова «родил» применительно к мужчине.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения; его синтаксическая функция передана русской конструкцией.
- source_word: פִּינְחָס
  choice: Финеес
  rationale: Традиционная русская библейская форма имени, последовательно сохранённая в обеих частях стиха.
- source_word: אֲבִישׁוּעַ
  choice: Авишуя
  rationale: Передача имени, близкая к еврейскому звучанию и согласованная с современным русским употреблением; в конструкции «стал отцом» употреблён родительный падеж «Авишуи».
