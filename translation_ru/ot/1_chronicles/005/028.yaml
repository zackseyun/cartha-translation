lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Союз ו передаёт продолжение родословия, а בְנֵי в сопряжённой форме здесь естественно означает непосредственных сыновей.
- source_word: קְהָת
  choice: Каафа
  rationale: Имя передано в традиционной русской библейской форме; родительный падеж обусловлен конструкцией «сыновья Каафа».
- source_word: עַמְרָם
  choice: Амрам
  rationale: Имя передано в принятой русской библейской форме.
- source_word: יִצְהָר
  choice: Ицгар
  rationale: Транслитерация отражает еврейскую согласную צ как «ц» и фрикативное ה в традиционной русской форме «Ицгар».
- source_word: וְחֶבְרוֹן
  choice: Хеврон
  rationale: Имя передано в традиционной русской библейской форме; в данном родословии это личное имя, а не название города.
- source_word: וְעֻזִּיאֵל
  choice: и Уззиил
  rationale: Имя передано в традиционной русской библейской форме, а союз ו явно выражен перед последним элементом перечня.
