  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: ru
  text: Это были сыновья Авихаила, сына Хури[a], сына Яроаха, сына Галаада, сына Михаила, сына Иешишая, сына Яхдо, сына Буза.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские выражения «сыновья» и повторяющееся «сын» здесь обозначают родословную линию и не обязательно подразумевают, что перечислено каждое поколение без пропусков.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Вот
  rationale: Указательное слово вводит перечисление; «вот» естественно и точно выполняет эту функцию в русской родословной формуле, не добавляя отсутствующего в еврейском тексте времени.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма множественного числа в сопряжённом состоянии прямо означает «сыновья»; возможное более широкое родословное значение пояснено в сноске.
- source_word: אֲבִיחַיִל
  choice: Авихаил
  rationale: Имя передано транслитерацией, близкой к еврейской форме и принятой русской библейской традиции.
- source_word: בֶּן
  choice: сына
  rationale: Повторяющаяся родословная формула сохранена буквально; русский родительный падеж естественно продолжает цепочку после слова «сыновья».
- source_word: חוּרִי
  choice: Хури
  rationale: Транслитерация личного имени с передачей начального ח через «х».
- source_word: יָרוֹחַ
  choice: Яроах
  rationale: Транслитерация сохраняет согласный ח и вокализацию имени.
- source_word: גִּלְעָד
  choice: Галаад
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מִיכָאֵל
  choice: Михаил
  rationale: Использована устоявшаяся русская форма еврейского имени.
- source_word: יְשִׁישַׁי
  choice: Ишшай
  rationale: Форма передаёт масоретскую вокализацию и удвоенный ש; начальное безударное шва не воспроизводится отдельной гласной.
- source_word: יַחְדּוֹ
  choice: Яхдо
  rationale: Транслитерация сохраняет начальное Ya-, гортанный ח и конечное -о.
- source_word: בּוּז
  choice: Буз
  rationale: Прямая и естественная русская транслитерация личного имени.
