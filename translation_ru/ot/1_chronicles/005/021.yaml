base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: ru
  text: 'Они захватили их скот: пятьдесят тысяч верблюдов, двести пятьдесят тысяч овец, две тысячи ослов и сто тысяч человек[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа человека» (נֶפֶשׁ אָדָם); счётное выражение, означающее людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Они захватили
  rationale: Глагол שׁבה обозначает взятие добычи или пленников. «Захватили» естественно относится здесь и к скоту, и к людям.
- source_word: מִקְנֵיהֶם
  choice: их скот
  rationale: מִקְנֶה может обозначать скот или имущество, но последующий перечень животных уточняет значение.
- source_word: גְּמַלֵּיהֶם
  choice: верблюдов
  rationale: Прямое обозначение верблюдов; принадлежность уже выражена словами «их скот», поэтому повторное «их» по-русски избыточно.
- source_word: וְצֹאן
  choice: овец
  rationale: צֹאן — собирательное обозначение мелкого скота, прежде всего овец и коз; в данном числовом перечне традиционное «овец» звучит ясно и естественно.
- source_word: וַחֲמוֹרִים
  choice: ослов
  rationale: Современное и точное русское наименование животных.
- source_word: וְנֶפֶשׁ אָדָם
  choice: человек
  rationale: Буквально выражение означает «душа человека», но при подсчёте обозначает отдельных людей. Русское «человек» естественно передаёт этот смысл.
- source_word: מֵאָה אָלֶף
  choice: сто тысяч
  rationale: Число передано словами в соответствии с нормами связного русского библейского текста.
