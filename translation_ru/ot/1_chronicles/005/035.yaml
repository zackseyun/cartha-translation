lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: Ахимаас
  rationale: Личное имя передано принятой в русской библейской традиции транслитерацией; начальный союз отдельно не выражен, поскольку стих продолжает родословную.
- source_word: הוֹלִיד
  choice: был отцом
  rationale: В родословном контексте каузативная форма глагола ילד означает «породил, стал отцом». Выражение «был отцом» естественно для современного русского языка и сохраняет родословную связь, не навязывая уточнений о непосредственности поколения.
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения в еврейском языке; в русском его функция выражается синтаксисом.
- source_word: עֲזַרְיָה
  choice: Азарии
  rationale: Личное имя עֲזַרְיָה передано традиционной русской библейской формой «Азария», здесь в родительном падеже.
- source_word: וַ/עֲזַרְיָה
  choice: а Азария
  rationale: Союз ו связывает параллельные звенья родословной; русское «а» естественно передаёт переход к следующему поколению без оттенка противопоставления.
- source_word: יוֹחָנָן
  choice: Иоханана
  rationale: Личное имя יוֹחָנָן передано традиционной русской библейской формой «Иоханан», здесь в родительном падеже.
