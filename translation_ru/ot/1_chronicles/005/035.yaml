  source_fidelity: Глагол הוֹלִיד в обеих частях — активная родословная формула «родил / стал отцом». «Был отцом» передаёт родство, но заменяет событие рождения статическим отношением и поэтому ослабляет формулировку оригинала.
  naturalness: «Ахимаас родил Азарию, а Азария — отцом Иоханана» понятна, но эллипсис во второй части вместе со статическим «был отцом» менее точно отражает повторённый глагол оригинала. Повтор «родил» в краткой родословной формуле естественен для современного литературного библейского русского.
  terminology: Формы имён «Ахимаас», «Азария» и «Иоханан» допустимо последовательно передают данные еврейские имена. Союз ו в параллельных звеньях лучше передать нейтральным «и», а не «а», поскольку противопоставления нет.
