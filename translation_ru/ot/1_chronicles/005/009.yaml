base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: ru
  text: А к востоку он поселился до входа в пустыню от реки Евфрат[a], потому что их скот умножился в земле Галаада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до пустыни от реки Евфрат»; возможно также: «до входа в пустыню, простирающуюся от реки Евфрат». Древнееврейское описание границы сжато и допускает несколько толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: А к востоку
  rationale: Союз и указание направления сохранены; такая формулировка естественно продолжает повествование и передаёт пространственную ориентацию.
- source_word: יָשַׁב
  choice: он расселился
  rationale: Глагол в единственном числе относится к роду, представленному его предком; «расселился» уместно передаёт занятие территории.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: до подступов к пустыне
  rationale: Оборот обозначает предел распространения — вход или подход к пустыне. «До подступов» сохраняет конкретный пограничный смысл и естественно звучит по-русски.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: со стороны реки Евфрат
  rationale: Сжатая древнееврейская конструкция синтаксически неоднозначна. «Со стороны» близко передаёт исходное направление и не создаёт ложной географической точности.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину расселения к востоку.
- source_word: מִקְנֵיהֶם
  choice: их стада
  rationale: Слово обозначает домашний скот в широком смысле; «стада» — естественное русское собирательное обозначение в данном контексте.
- source_word: רָבוּ
  choice: умножились
  rationale: Глагол выражает численное увеличение; форма прошедшего времени указывает на причину территориального расширения.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: в земле Галаадской
  rationale: Сохранено обозначение территории; традиционная географическая форма сочетается с современным литературным синтаксисом.
