- source_word: וַאֲחֵיהֶם
  choice: И их братья
  rationale: Передаёт прямое значение אחים и сохраняет родственную формулировку еврейского текста; в родословном контексте слово может обозначать и более широкую группу родственников.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: по их отцовским домам
  rationale: Сохраняет характерное для родословий обозначение патрилинейных семейно-родовых объединений; смысл пояснён в сноске.
