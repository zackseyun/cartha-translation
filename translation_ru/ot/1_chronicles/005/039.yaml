lexical_decisions:
- source_word: וְ
  choice: '[не передано отдельно]'
  rationale: В начале продолжения родословного перечня союз соединяет эту строку с предыдущей; в русском отдельное начальное «и» здесь необязательно и утяжеляло бы фразу.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Имя передано принятой русской библейской транслитерацией.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В породе Hифиль глагол ילד в родословии означает «породил, стал отцом». Этот вариант точно передаёт мужскую генеалогическую линию и звучит естественно в современном русском.
- source_word: אֶת
  choice: '[не переведено]'
  rationale: Показатель прямого дополнения не имеет самостоятельного лексического соответствия в русском языке.
- source_word: חִלְקִיָּה
  choice: Хилкия
  rationale: Имя передано принятой русской библейской формой и одинаково в обоих случаях.
- source_word: וְ
  choice: а
  rationale: Союз координирует следующую ступень родословия; русское «а» естественно связывает две параллельные части, не добавляя противопоставления в данном контексте.
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Имя передано принятой русской библейской формой.
