  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: ru
  text: Сыновья Рувима, гадитяне и половина колена Манассии — доблестные воины[a], носившие щит и меч, натягивавшие лук[b] и обученные военному делу, — насчитывали сорок четыре тысячи семьсот шестьдесят человек, способных выступать в поход[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «сильные воины» или «мужественные люди».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сгибавшие (или натягивавшие) лук» — еврейское выражение, обозначающее натягивание лука для выстрела.'
    reason: cultural_note
  - marker: c
    text: 'Или: «годных к военной службе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: Сыновья Рувима
  rationale: Сохраняется явная родовая формула בְּנֵי; в контексте она обозначает потомков и членов колена Рувима.
- source_word: וְגָדִי
  choice: гадитяне
  rationale: Этнико-родовое прилагательное обозначает членов колена Гада, а не самого Гада.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: и половина колена Манассии
  rationale: Прямо и естественно передаёт еврейскую конструкцию и традиционное обозначение этой части колена.
- source_word: מִן בְּנֵי חַיִל
  choice: доблестные воины
  rationale: В военном контексте выражение характеризует сильных, способных и отважных бойцов; частичное מן естественно передаётся описательно.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: носившие щит и меч
  rationale: Сохраняется конкретный образ буквального ношения оружия без добавочного значения полной экипировки.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: владевшие луком
  rationale: Еврейская идиома буквально связана с натягиванием или сгибанием лука; по-русски дан естественный военный эквивалент, а буквальный образ отмечен в сноске.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: обученные войне
  rationale: 'Передаёт пассивно-результативный смысл: эти люди были подготовлены к ведению войны.'
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: сорок четыре тысячи семьсот шестьдесят
  rationale: Число полностью и точно воспроизводится словами в связном русском тексте.
- source_word: יֹצְאֵי צָבָא
  choice: способных выступать в поход
  rationale: Военная формула означает людей, пригодных и готовых выходить в составе войска; «выступать в поход» сохраняет образ движения и ясно звучит по-русски.
