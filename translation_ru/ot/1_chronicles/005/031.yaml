  text: Abishua fathered Bukki, and Bukki fathered Uzzi.
translation:
  language: ru
  text: Авишуа стал отцом Букки, и Букки стал отцом Уззи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: Авишуа
  rationale: Личное имя передано принятой русской библейской транслитерацией; начальный союз учтён синтаксически, но не выражен отдельным «и», поскольку стих представляет собой продолжение родословной, а без контекста такое начало по-русски звучало бы неестественно.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Порода hифиль глагола ילד в родословии обозначает рождение потомка от названного мужчины. «Стал отцом» естественно для современного русского языка и не привносит архаического оттенка слова «родил» применительно к мужчине.
- source_word: אֶת
  choice: не переводится
  rationale: Показатель определённого прямого дополнения не имеет отдельного соответствия в русском языке.
- source_word: בֻּקִּי
  choice: Букки
  rationale: Личное имя передано принятой русской библейской транслитерацией с удвоенной согласной.
- source_word: וּ/בֻקִּי
  choice: а Букки
  rationale: Союз ו соединяет последовательные звенья родословной. Русское «а» естественно обозначает переход от первого поколения ко второму без смыслового противопоставления.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Повтор глагола передан одинаково, чтобы сохранить параллельное построение родословной.
- source_word: עֻזִּי
  choice: Уззи
  rationale: Личное имя передано традиционной русской библейской формой «Уззи».
