base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: ru
  text: А сыновья Гада жили напротив них[a] в земле Васан до Салхи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рядом с ними» или «перед ними»; еврейское выражение указывает на положение относительно группы, упомянутой выше.'
    reason: lexical_alternative
  - marker: b
    text: Название этого города также передают как «Салка».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: А сыновья Гада
  rationale: Сохраняет буквальную форму «сыновья» в племенном контексте; союз ו передан естественным русским «а», поскольку вводится сопоставленное территориальное сообщение о другом колене.
- source_word: לְנֶגְדָּם
  choice: напротив них
  rationale: Передаёт пространственное положение по отношению к ранее упомянутым потомкам Рувима, не уточняя географию сверх того, что выражено в еврейском тексте.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: В данном сообщении о территории глагол обозначает постоянное проживание; «жили» звучит современно и не вносит дополнительного оттенка первоначального заселения.
- source_word: בְּאֶרֶץ הַבָּשָׁן
  choice: в земле Васан
  rationale: אֶרֶץ обозначает названную область; традиционная русская форма топонима בָּשָׁן — «Васан».
- source_word: עַד סַלְכָה
  choice: до Салхи
  rationale: עַד обозначает пространственный предел, а «Салха» близко передаёт еврейский топоним סַלְכָה; после «до» употреблён родительный падеж.
