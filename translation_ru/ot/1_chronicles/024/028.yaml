  text: לְ/מַחְלִי֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יָה ל֖/וֹ בָּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/028.yaml
  text: 'For Mahli: Eleazar[a], and he had no sons.'
translation:
  language: ru
  text: 'У Махли: Елеазар; у него не было сыновей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַחְלִי
  choice: У Махли
  rationale: Предлог לְ здесь, вероятнее всего, вводит рубрику или тему в родословном перечне. Оборот «У Махли» естественно передаёт структуру списка, не делая родственную связь более определённой, чем в еврейском тексте.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Принятая в русской библейской традиции передача личного имени.
- source_word: וְלֹא הָיָה לוֹ
  choice: у него не было
  rationale: Еврейская конструкция существования буквально означает «не было у него»; современный русский эквивалент — «у него не было». Простое соединение частей передано точкой с запятой без усиления противопоставления.
- source_word: בָּנִים
  choice: сыновей
  rationale: В данном родословном контексте слово обозначает именно сыновей, а не детей вообще.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, перечневой синтаксической формой. Точка с запятой помогает ясно отделить имя от сообщения об отсутствии сыновей.
