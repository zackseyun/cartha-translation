  text: 'Сыновья Мерари: Махли и Муши. Сыновья Яазии — его сын.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «Сыновья Яазии — его сын»; эта родословная формула грамматически трудна. Последнее слово иногда понимают как имя Бено.'
    reason: Сохраняет единственное число оригинала и отмечает традиционное, но спорное понимание последнего слова как собственного имени.
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: Сыновья Мерари
  rationale: Формально и естественно передаёт родословную формулу «сыновья Мерари».
- source_word: מַחְלִי וּמוּשִׁי
  choice: Махли и Муши
  rationale: Имена переданы принятой русской библейской транслитерацией.
- source_word: בְּנֵי יַעֲזִיָּהוּ בְנוֹ
  choice: Сыновья Яазии — его сыновья
  rationale: Масоретский текст буквально содержит множественное «сыновья Яазии» и затем единственное с суффиксом «его сын»; в контексте вероятно имеется в виду родовая ветвь Яазии, но текст грамматически труден. В основном тексте число согласовано для естественного русского чтения, а буквальная форма сохранена в примечании.
theological_decisions:
- issue: Неясная родословная формула בְּנֵי יַעֲזִיָּהוּ בְנוֹ
  choice: Сыновья Яазии — его сыновья
  alternative: 'Сыновья Яазии — его сын / сыновья Яазии: Бено'
  rationale: Не трактовать בנו как имя «Бено» без достаточных оснований и не скрывать текстовую трудность; выбранное чтение понимает выражение как указание на потомков Яазии, а буквальная грамматика отмечена сноской.
translation_notes:
  register: Современный литературный русский язык; краткая родословная формула сохранена. Текстовая неоднозначность не разрешена без оговорки.
