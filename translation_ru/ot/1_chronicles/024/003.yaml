base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: ru
  text: Давид вместе с Садоком из сыновей Елеазара и Ахимелехом из сыновей Ифамара распределил их согласно назначенному им порядку служения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разделил их по порученным им обязанностям в служении». Еврейское выражение может включать значения назначения, надзора, должности или установленного порядка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: распределил их
  rationale: Глагол חָלַק буквально означает «разделил», но в контексте учреждения черед священнического служения «распределил» естественно передаёт упорядоченное разделение на группы.
- source_word: וְצָדוֹק
  choice: вместе с Садоком
  rationale: Союз וְ буквально означает «и»; оборот «вместе с» ясно показывает участие Садока и Ахимелеха в действии Давида и соответствует синтаксису фразы.
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: из сыновей Елеазара
  rationale: Сочетание מִן с «сыновьями» указывает на принадлежность Садока к роду Елеазара; формулировка сохраняет образ исходного текста.
- source_word: וַאֲחִימֶלֶךְ
  choice: и Ахимелехом
  rationale: Имя передано в принятой русской библейской форме; творительный падеж обусловлен оборотом «вместе с».
- source_word: מִן בְּנֵי אִיתָמָר
  choice: из сыновей Ифамара
  rationale: Параллельно предыдущему обороту указывает на принадлежность Ахимелеха к роду Ифамара.
- source_word: לִפְקֻדָּתָם
  choice: согласно назначенному им порядку
  rationale: Существительное פְּקֻדָּה может обозначать назначение, порученную обязанность, надзор или установленный порядок. Основной текст передаёт административное упорядочение, а примечание сохраняет лексическую широту.
- source_word: בַּעֲבֹדָתָם
  choice: служения
  rationale: עֲבֹדָה означает работу или службу, здесь — священническое служение. Родительный оборот естественен по-русски в сочетании «порядок служения».
