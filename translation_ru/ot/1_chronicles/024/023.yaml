  yaml_path: translation/ot/1_chronicles/024/023.yaml
  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: ru
  text: 'А сыновья Иерии: Амария — второй[a], Иахазиил — третий, Иекамеам — четвёртый.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте перечень построен эллиптически, без выраженного глагола: буквально «А сыновья Иерии: Амария — второй, Иахазиил — третий, Иекамеам — четвёртый». Можно также передать: «Амария был вторым» и далее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנָי
  choice: А сыновья
  rationale: Союз ו связывает стих с предшествующим перечнем, а בְנֵי — форма сопряжённого состояния множественного числа со значением «сыновья [кого-либо]».
- source_word: יְרִיָּהוּ
  choice: Иерии
  rationale: Личное имя передано в традиционной русской библейской форме «Иерия» и поставлено в родительный падеж после слова «сыновья».
- source_word: אֲמַרְיָהוּ
  choice: Амария
  rationale: Личное имя передано в принятой русской библейской транслитерации.
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Порядковое числительное сохранено без добавления глагола; тире естественно передаёт эллиптическую структуру еврейского перечня.
- source_word: יַחֲזִיאֵל
  choice: Иахазиил
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: הַשְּׁלִישִׁי
  choice: третий
  rationale: Порядковое числительное прямо передаёт место в перечисляемом порядке.
- source_word: יְקַמְעָם
  choice: Иекамеам
  rationale: Транслитерация следует традиционной русской библейской форме и масоретской огласовке имени.
- source_word: הָרְבִיעִי
  choice: четвёртый
  rationale: Порядковое числительное сохранено в краткой структуре исходного перечня.
