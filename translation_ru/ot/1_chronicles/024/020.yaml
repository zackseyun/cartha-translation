    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַנּוֹתָרִים
  choice: А из остальных сыновей Левия
  rationale: Союз וְ сохраняет связь с предшествующим перечнем, а לְ в контексте распределительного списка естественно передаётся русским «из». Причастие הַנּוֹתָרִים означает «оставшиеся, остальные».
- source_word: לִ/בְנֵי עַמְרָם
  choice: из сыновей Амрама
  rationale: Повторяющаяся формула вводит ветвь рода Амрама; «из сыновей» естественно передаёт структуру административно-родословного перечня.
- source_word: שׁוּבָאֵל
  choice: Шуваил
  rationale: Традиционная русская передача еврейского личного имени; в эллиптическом перечне имя обозначает названного представителя или главу ветви.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: из сыновей Шуваила
  rationale: Сохранён параллелизм исходного перечня и введение следующей родовой ветви.
- source_word: יֶחְדְּיָהוּ
  choice: Иехдия
  rationale: Устоявшаяся русская библейская форма личного имени, соответствующая еврейскому יֶחְדְּיָהוּ.
