base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: ru
  text: 'Таковы были их установленные обязанности при служении: входить в дом Яхве по установленному для них порядку[a], в соответствии с указаниями их праотца Аарона[b], как повелел ему Яхве, Бог Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно установленному для них правилу». Еврейское слово может означать предписание, правило или установленный порядок действий.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Аарона, их отца». Это выражение может обозначать руководство или власть; Аарон назван отцом как родоначальник священнических родов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדָּתָם לַעֲבֹדָתָם
  choice: установленный для них порядок служения
  rationale: Сочетание обозначает установленное распределение обязанностей и порядок священнического служения; цельная русская формулировка естественнее буквального «их назначения для их служения».
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: входить в дом Яхве
  rationale: В данном контексте בוא означает приходить или входить для совершения служения; «дом Яхве» сохраняет устойчивый древнееврейский образ, не заменяя его пояснительным «храм».
- source_word: כְּמִשְׁפָּטָם
  choice: согласно предписанному им распорядку
  rationale: מִשְׁפָּט здесь указывает не на судебное решение, а на установленное правило или регламент священнического служения.
- source_word: בְּיַד אַהֲרֹן
  choice: под руководством Аарона
  rationale: Буквальное «рукой Аарона» является идиомой управления или власти; функциональный перевод ясно передаёт административный смысл.
- source_word: אֲבִיהֶם
  choice: их праотца
  rationale: Аарон — родоначальник названных священнических родов, поэтому «праотец» точнее передаёт контекстуальное значение буквального «отец».
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Яхве, Бог Израиля
  rationale: Передача имени Яхве сохраняет личное имя Бога в исходном тексте; приложение «Бог Израиля» отражено без перестройки.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; «Яхве» непосредственно и общепонятно передаёт его, не подменяя титулом.
- issue: Значение בְּיַד אַהֲרֹן в описании священнического порядка
  choice: под руководством Аарона
  alternative: рукой Аарона; под властью Аарона
  rationale: Идиома допускает оттенки посредничества и власти. В контексте установленного порядка служения «под руководством» передаёт административный смысл, не усиливая его до неограниченной власти.
translation_notes:
  register: Современный литературный русский язык с достоинством летописного повествования. Синтаксис упрощён до естественной русской конструкции, но сохранены культовые понятия «служение» и «дом Яхве». Все примечания отмечены в основном тексте.
