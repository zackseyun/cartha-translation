base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: ru
  text: 'И записал их Шемаия, сын Нетанела, писец из левитов, в присутствии царя, сановников, священника Садока, Ахимелеха, сына Авиафара, и глав родовых домов священников и левитов: один родовой дом был выбран для Елеазара, и один — для Ифамара.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь предельно сжат: буквально — «один родовой дом взят для Елеазара, и взят, взят для Ифамара». В контексте речь идёт о том, что родовые дома выбирались поочерёдно из линий Елеазара и Ифамара.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: И записал их
  rationale: Глагол כתב с местоименным суффиксом указывает на письменную регистрацию упомянутых в контексте подразделений; «записал их» естественно и не уточняет сверх текста способ записи.
- source_word: הַסּוֹפֵר
  choice: писец
  rationale: Слово обозначает писца или должностное лицо, ведущее записи; «писец» сохраняет исторический характер роли.
- source_word: מִן הַלֵּוִי
  choice: из левитов
  rationale: Предлог מן выражает принадлежность Шемаии к группе левитов; формулировка сохраняет партитивный оттенок.
- source_word: לִפְנֵי
  choice: в присутствии
  rationale: Здесь выражение указывает на официальных свидетелей процедуры, а не просто на пространственное положение «перед» ними.
- source_word: הַשָּׂרִים
  choice: сановников
  rationale: В придворно-административном контексте שׂרים — высокопоставленные должностные лица; «сановники» не создаёт впечатления, будто речь непременно о царских сыновьях.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: глав родовых домов
  rationale: Это родовое и административное обозначение руководителей семейно-клановых объединений; «родовые дома» понятно передаёт историческую структуру.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: священников и левитов
  rationale: Фраза уточняет, к каким группам принадлежали упомянутые родовые дома.
- source_word: בֵּית אָב אֶחָד
  choice: один родовой дом
  rationale: Техническое выражение обозначает родовую семейную единицу; вариант естественнее буквального «дом отца» в современном русском языке.
- source_word: אָחֻז
  choice: брали
  rationale: Пассивная форма от אחז буквально связана со взятием; в контексте распределения она означает, что род выбирали или назначали, вероятно посредством жребия. «Брали» сохраняет образ исходного слова, не устраняя сжатость текста.
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: для Елеазара ... для Ифамара
  rationale: Предлог ל соотносит выбранные родовые дома с двумя священническими линиями; «для» сохраняет административно-распределительный смысл.
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: и один — для Ифамара
  rationale: Повтор אָחֻז אָחֻז сжат и допускает распределительное понимание. В основном тексте восполнено «один» по параллельной первой части, а необычность еврейского выражения отмечена в сноске.
