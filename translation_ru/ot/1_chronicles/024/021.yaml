  yaml_path: translation/ot/1_chronicles/024/021.yaml
  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: ru
  text: У Рехавии среди его сыновей главой был Ишшия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что касается Рехавии, среди сыновей Рехавии главой был Ишшия».'
    reason: Первое לְ может вводить заголовок очередной родовой ветви; в еврейском кратком перечне имя Рехавии повторено.
lexical_decisions:
- source_word: לִ/רְחַבְיָהוּ
  choice: У Рехавии
  rationale: Предлог ל вводит очередную родовую ветвь в перечне. Русское «у Рехавии» естественно обозначает принадлежность к этой ветви, не придавая предлогу излишне узкого значения.
- source_word: לִ/בְנֵי רְחַבְיָהוּ
  choice: из сыновей Рехавии
  rationale: בני означает «сыновья» или «потомки»; здесь сохранено конкретное генеалогическое «сыновья», а «из» ясно показывает, что названный глава принадлежал к этой ветви.
- source_word: הָ/רֹאשׁ
  choice: главой
  rationale: ראש буквально значит «голова», а в родовом и административном перечне обозначает главу, то есть ведущего представителя семьи.
- source_word: יִשִּׁיָּה
  choice: Ишшия
  rationale: Имя передано транслитерацией, отражающей удвоенный согласный שׁ и конечный теофорный элемент יה.
