lexical_decisions:
- source_word: אֲחִי מִיכָה
  choice: Брат Михи
  rationale: 'Сопряжённая форма אֲחִי выражает родственную связь: «брат Михи». Определённость в русском языке передаётся контекстом списка без отдельного показателя.'
- source_word: יִשִּׁיָּה
  choice: Ишшия
  rationale: Имя передано транслитерацией с еврейского; удвоенное «ш» отражает сильный дагеш, а окончание «-ия» соответствует принятой русской передаче теофорных имён такого типа.
- source_word: לִבְנֵי יִשִּׁיָּה
  choice: из сыновей Ишшии
  rationale: В генеалогическом перечне сочетание לְ с בְּנֵי обозначает принадлежность к роду или группе потомков; русское «из сыновей» естественно выражает эту связь.
- source_word: זְכַרְיָהוּ
  choice: Захария
  rationale: Использована устоявшаяся русская библейская форма имени, соответствующая еврейскому זְכַרְיָהוּ.
