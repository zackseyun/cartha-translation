  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: Иакину
  rationale: Предлог לְ в перечне указывает, кому досталась соответствующая череда; по-русски это естественно передаётся дательным падежом. Имя передано в принятой библейской форме.
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: двадцать первый
  rationale: Буквально количественное «один и двадцать» в последовательном перечне обозначает порядковый номер череды.
- source_word: לְ/גָמוּל
  choice: Гамулу
  rationale: Как и в первой части стиха, לְ обозначает отнесение очереди к названному священническому роду; русский дательный падеж кратко и естественно передаёт эту связь.
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: двадцать второй
  rationale: Буквально количественное «два и двадцать» в контексте нумерованного списка имеет порядковое значение.
