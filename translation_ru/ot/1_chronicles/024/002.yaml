  text: וַ/יָּ֨מָת נָדָ֤ב וַ/אֲבִיהוּא֙ לִ/פְנֵ֣י אֲבִי/הֶ֔ם וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַֽ/יְכַהֲנ֔וּ אֶלְעָזָ֖ר וְ/אִיתָמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: ru
  text: Но Надав и Авиуд умерли прежде своего отца[a], и сыновей у них не было; поэтому священниками служили Елеазар и Ифамар.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии своего отца». Еврейское выражение может иметь пространственный смысл («перед ним, в его присутствии») или временной («прежде него», то есть при жизни отца).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: умерли
  rationale: Форма wayyiqtol от מוּת повествует о прошлом событии; русское простое прошедшее время естественно передаёт её в данном контексте. Множественное число согласовано с двумя подлежащими — Надавом и Авиудом.
- source_word: לִפְנֵי
  choice: прежде
  rationale: 'Сочетание с «своего отца» наиболее естественно допускает временной смысл: они умерли раньше отца, то есть при его жизни. При этом возможный пространственный смысл сохранён в сноске.'
- source_word: אֲבִיהֶם
  choice: своего отца
  rationale: Суффикс третьего лица множественного числа относится к отцу Надава и Авиуда; возвратное притяжательное местоимение «своего» естественно для русского языка при совпадении обладателей с подлежащим.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: и сыновей у них не было
  rationale: בָּנִים здесь означает именно «сыновья», а русская конструкция «у них не было» точно и естественно передаёт еврейский оборот существования с לָהֶם.
- source_word: וַיְכַהֲנוּ
  choice: поэтому священниками служили
  rationale: Пиэль глагола כָּהַן обозначает исполнение священнического служения. Формулировка сохраняет глагольный смысл, а «поэтому» ясно выражает повествовательное следствие в данном контексте.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: Елеазар и Ифамар
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён, понятные современному читателю.
theological_decisions:
- issue: Смысл выражения לִפְנֵי אֲבִיהֶם
  choice: прежде своего отца
  alternative: в присутствии своего отца
  rationale: Еврейское выражение допускает как временное понимание («раньше отца», то есть при его жизни), так и пространственное («перед ним, в его присутствии»). Основной текст сохраняет краткий временной смысл, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; традиционные формы личных имён сохранены.
