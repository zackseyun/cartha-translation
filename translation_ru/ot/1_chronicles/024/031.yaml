  text: וַ/יַּפִּילוּ֩ גַם הֵ֨ם גּוֹרָל֜וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֣ם בְּנֵֽי אַהֲרֹ֗ן לִ/פְנֵ֨י דָוִ֤יד הַ/מֶּ֨לֶךְ֙ וְ/צָד֣וֹק וַ/אֲחִימֶ֔לֶךְ וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם אָב֣וֹת הָ/רֹ֔אשׁ לְ/עֻמַּ֖ת אָחִ֥י/ו הַ/קָּטָֽן־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: ru
  text: Они тоже бросили жребии наряду со своими братьями[a], сыновьями Аарона, в присутствии царя Давида, Садока, Ахимелеха и глав родовых домов священников и левитов — родовые дома главных наравне с домами их младших братьев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соответственно своим братьям» или «напротив своих братьев». Древнееврейское выражение может означать положение напротив, соответствие или участие наряду с кем-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «родовые дома главного — соответственно его младшему брату». Формы единственного числа, вероятно, употреблены распределительно: главные родовые ветви и ветви их младших братьев участвовали в жеребьёвке на равных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: бросили жребии
  rationale: Передаёт обычную древнееврейскую идиому о распределении обязанностей посредством жребия естественным современным русским выражением.
- source_word: גַם הֵם
  choice: и они также
  rationale: Связывает стих с ранее упомянутыми левитскими группами и подчёркивает, что они тоже участвовали в жеребьёвке.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: наравне со своими братьями, сыновьями Аарона
  rationale: לְעֻמַּת допускает значения «напротив», «соответственно», «наряду/наравне»; здесь выражение передаёт параллельное и равноправное участие, не навязывая узкой технической схемы.
- source_word: לִפְנֵי
  choice: перед
  rationale: Кратко и точно обозначает официальное совершение жеребьёвки в присутствии названных свидетелей.
- source_word: דָוִיד הַמֶּלֶךְ
  choice: царём Давидом
  rationale: Естественный русский порядок титула и имени.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главами родовых домов
  rationale: Сохраняет социально-родовую структуру выражения בית־אב и при этом понятно современному читателю.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: священников и левитов
  rationale: Родительный падеж естественно указывает, к каким группам относились главы родовых домов.
- source_word: אָבוֹת הָרֹאשׁ לְעֻמַּת אָחִיו הַקָּטָן
  choice: как главы родов, так и их младшие братья
  rationale: Сжатая древнееврейская конструкция противопоставляет старших или главных представителей младшим; единственное число понято распределительно. Формулировка сохраняет равное участие обеих категорий, не превращая их явно в «старшие» и «младшие ветви», чего текст прямо не говорит.
