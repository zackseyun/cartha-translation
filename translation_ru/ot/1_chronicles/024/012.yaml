- source_word: לְיָקִים
  choice: Иакиму
  rationale: Предлог לְ передан дательным падежом как указание на того, кому достался соответствующий жребий. Форма имени следует современной русской библейской традиции.
- source_word: שְׁנֵים עָשָׂר
  choice: двенадцатый
