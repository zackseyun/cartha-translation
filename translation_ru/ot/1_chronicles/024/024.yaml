  text: בְּנֵ֤י עֻזִּיאֵל֙ מִיכָ֔ה לִ/בְנֵ֥י מִיכָ֖ה שמור׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/024.yaml
  text: 'The sons of Uzziel: Micah[a]; of the sons of Micah: Shamir.'
translation:
  language: ru
  text: 'Сыновья Уззиила: Миха; из сыновей Михи — Шамир[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное чтение: «Шемор». Еврейское написание שמור допускает обе передачи имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Прямая передача формы сопряжённого множественного числа от בֵּן в генеалогическом перечне; здесь нет необходимости расширять значение до «потомков».
- source_word: עֻזִּיאֵל
  choice: Уззиил
  rationale: Традиционная русская библейская форма личного имени, сохраняющая удвоение согласного, отражённое в еврейском написании.
- source_word: מִיכָה
  choice: Миха
  rationale: Устоявшаяся русская передача данного личного имени в ветхозаветных родословных.
- source_word: לִ/בְנֵי
  choice: из сыновей
  rationale: Префикс ל в формуле перечня связывает следующую ветвь рода с её представителем. Русское «из сыновей» естественно передаёт эту связь, не превращая её в указание адресата.
- source_word: שמור
  choice: Шамир
  rationale: Принятая русская форма имени в этом месте; поскольку еврейское согласное написание допускает иную вокализацию, альтернативное чтение вынесено в примечание.
