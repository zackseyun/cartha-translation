lexical_decisions:
- source_word: וַיֵּצֵא
  choice: выпал
  rationale: В контексте распределения по жребию русское «жребий выпал» естественно и точно передаёт результат жеребьёвки, хотя буквально глагол означает «вышел».
- source_word: הַגּוֹרָל
  choice: жребий
  rationale: Стандартное русское обозначение средства и результата жеребьёвки; соответствует контексту распределения священнических черед.
- source_word: הָרִאשׁוֹן
  choice: первый
  rationale: Передаёт порядковое значение и согласуется с последующим «второй».
- source_word: לִיהוֹיָרִיב
  choice: Иегоиариву
  rationale: Дательный падеж естественно передаёт адресата распределения, выраженного еврейским предлогом ל.
- source_word: לִידַעְיָה
  choice: Иедаии
  rationale: Дательный падеж естественно передаёт адресата второго жребия, выраженного еврейским предлогом ל.
- source_word: הַשֵּׁנִי
  choice: второй
  rationale: Передаёт порядковое значение; пропуск повторного слова «жребий» делает фразу по-русски краткой и ясной.
