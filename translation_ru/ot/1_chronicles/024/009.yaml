  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пятый — для Малхии, шестой — для Миямина». Еврейский предлог в этом перечне распределения по жребию допускает оба способа передачи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלְכִּיָּה
  choice: Малхии
  rationale: Предлог לְ в перечне жребиев обозначает отнесение или назначение; по-русски это естественно передаётся дательным падежом. Имя транслитерировано как «Малхия».
- source_word: הַחֲמִישִׁי
  choice: пятый
  rationale: Определённое порядковое числительное употреблено самостоятельно и обозначает пятый жребий или порядок служения; краткая форма оригинала сохранена.
- source_word: לְמִיָּמִן
  choice: Миямину
  rationale: Как и в первой части стиха, לְ передаёт назначение; в русском это выражено дательным падежом. Имя транслитерировано как «Миямин».
- source_word: הַשִּׁשִּׁי
  choice: шестой
  rationale: Порядковое числительное продолжает формулу распределения жребиев и обозначает шестой жребий или порядок служения.
