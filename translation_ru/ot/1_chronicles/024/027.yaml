  text: 'The sons of Merari: of Jaaziah, his son, Shoham, Zaccur, and Ibri.'
translation:
  language: ru
  text: 'Сыновья Мерари: от Иаазии — его сын[a], Шохам, Заккур и Иври.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «его сын». Синтаксис этого места неясен; некоторые считают это слово именем Бено, а другие понимают его во множественном числе: «его сыновья».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: Сыновья Мерари
  rationale: Прямое воспроизведение генеалогической формулы с формой сопряжённого состояния множественного числа בְּנֵי.
- source_word: לְיַעֲזִיָּהוּ
  choice: от Иаазии
  rationale: Предлог לְ в данном родословном перечне обозначает ветвь, происходящую от Иаазии; «от Иаазии» естественно передаёт эту связь по-русски.
- source_word: בְנוֹ
  choice: его сын
  rationale: Масоретская огласовка прямо даёт значение «его сын». Несмотря на трудность синтаксиса, это чтение сохранено в основном тексте, а иные толкования указаны в сноске.
- source_word: שֹׁהַם
  choice: Шохам
  rationale: Личное имя передано транслитерацией, близкой к еврейскому звучанию.
- source_word: זַכּוּר
  choice: Заккур
  rationale: Личное имя передано транслитерацией с сохранением удвоенного согласного.
- source_word: עִבְרִי
  choice: Иври
  rationale: Личное имя передано транслитерацией.
