lexical_decisions:
- source_word: לְחֵזִיר
  choice: Хезиру
  rationale: Предлог לְ обозначает того, кому назначен соответствующий жребий; в русском перечислении это естественно передаётся дательным падежом. Личное имя транслитерировано, а не переведено по предполагаемому значению.
- source_word: שִׁבְעָה עָשָׂר
  choice: семнадцатый
  rationale: В последовательном перечне священнических черед количественное числительное употреблено в значении порядкового номера жребия.
- source_word: לְהַפִּצֵּץ
  choice: Гаппиццецу
  rationale: Предлог לְ передаёт назначение жребия и выражен русским дательным падежом. Начальная буква «Г» отражает традиционную передачу еврейского ה в этом имени; удвоение согласных сохранено в форме «Гаппиццец».
- source_word: שְׁמוֹנָה עָשָׂר
  choice: восемнадцатый
  rationale: 'Контекст упорядоченного списка требует порядкового значения: речь идёт о восемнадцатом жребии.'
