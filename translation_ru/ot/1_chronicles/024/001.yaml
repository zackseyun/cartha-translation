lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: Сыновья Аарона были
  rationale: Сочетание с союзом и предлогом вводит новый раздел о сыновьях Аарона. В современном русском его функцию естественно передаёт начало тематического предложения без буквального «и для».
- source_word: מַחְלְקוֹתָם
  choice: распределены по группам
  rationale: Существительное обозначает разделение или упорядоченные группы. Глагольная конструкция естественна по-русски и ясно передаёт организацию священников в группы, не прибегая к малопонятному традиционному слову «череды».
- source_word: בְּנֵי אַהֲרֹן
  choice: Сыновьями Аарона
  rationale: Сохраняется повтор исходного текста и точное обозначение родства.
- source_word: נָדָב
  choice: Надав
  rationale: Устоявшаяся русская библейская передача имени.
- source_word: וַאֲבִיהוּא
  choice: и Авиуд
  rationale: Устоявшаяся русская библейская передача имени с сохранением союза.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Устоявшаяся русская библейская передача имени.
- source_word: וְאִיתָמָר
  choice: и Ифамар
  rationale: Устоявшаяся русская библейская передача имени с сохранением союза.
