  text: לִ/דְלָיָ֨הוּ֙ שְׁלֹשָׁ֣ה וְ/עֶשְׂרִ֔ים לְ/מַֽעַזְיָ֖הוּ אַרְבָּעָ֥ה וְ/עֶשְׂרִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/018.yaml
  text: for Delaiah, the twenty-third; for Maaziah, the twenty-fourth.
translation:
  language: ru
  text: Делаии — двадцать третий, Маазии — двадцать четвёртый.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְלָיָהוּ
  choice: Делаии
  rationale: Предлог לְ в перечне указывает, кому выпал соответствующий жребий или была назначена череда. В русском эллиптическом перечислении это естественно передаётся дательным падежом; имя транслитерируется в традиционной форме.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים
  choice: двадцать третий
  rationale: Формально это количественное числительное «двадцать три», однако в последовательности священнических черед оно выполняет порядковую функцию.
- source_word: לְמַעַזְיָהוּ
  choice: Маазии
  rationale: Предлог לְ обозначает отнесение следующего номера к Маазии; дательный падеж кратко и естественно передаёт структуру еврейского перечня.
- source_word: אַרְבָּעָה וְעֶשְׂרִים
  choice: двадцать четвёртый
  rationale: Количественная по форме конструкция в данном нумерованном списке имеет порядковое значение.
theological_decisions: []
translation_notes:
  register: Краткая, ритмичная форма перечня сохранена. Пропущенное в еврейском тексте существительное («жребий» или «череда») не добавлено, поскольку оно ясно из контекста и эллипсис естественен по-русски. Имена переданы в формах, привычных для русской библейской традиции.
