base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/016.yaml
  text: for Pethahiah[a], the nineteenth; for Jehezkel, the twentieth.
translation:
  language: ru
  text: Петахии — девятнадцатый; Иехезкелю[a] — двадцатый.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иезекиилю». Еврейское имя יְחֶזְקֵאל здесь передано ближе к его звучанию как «Иехезкель»; в русской библейской традиции обычно употребляется форма «Иезекииль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: Петахии
  rationale: Предлог לְ в перечне обозначает, кому выпал соответствующий жребий или черёд; имя передано транслитерацией в форме русского дательного падежа.
- source_word: תִּשְׁעָה עָשָׂר
  choice: девятнадцатый
  rationale: Формально количественное числительное в данном перечне употреблено в значении порядкового; подразумевается «жребий» или «черед».
- source_word: לִיחֶזְקֵאל
  choice: Иехезкелю[a]
  rationale: Предлог לְ обозначает назначение жребия или череды. Передача «Иехезкель» близко отражает форму еврейского имени и не заменяет её без пояснения привычной русской формой «Иезекииль».
- source_word: הָעֶשְׂרִים
  choice: двадцатый
  rationale: Числительное с артиклем в последовательности жребиев имеет порядковое значение; существительное восстанавливается из контекста и по-русски может быть опущено.
