lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: Сыновья Муши
  rationale: Генеалогическая формула передана естественно для русского перечня; начальный союз не выражен отдельно, поскольку стих продолжает уже идущий список.
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: Махли, Едер и Иеримоф
  rationale: Личные имена переданы в привычной русской библейской форме; повторяющиеся еврейские союзы оформлены по нормам русского перечисления.
- source_word: אֵלֶּה בְּנֵי הַלְוִיִּם
  choice: Это сыновья левитов
  rationale: Сохранена буквальная генеалогическая формула «сыновья левитов», без замены на более широкое толкование «потомки».
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: по их отцовским домам
  rationale: Выражение обозначает распределение по родовым домам, ведущим происхождение по отцовской линии; традиционный библейский термин «отцовские дома» сохраняет историко-административный смысл.
