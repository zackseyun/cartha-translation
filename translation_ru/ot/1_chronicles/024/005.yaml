  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: ru
  text: Их распределили по жребиям — одних вместе с другими[a], потому что и среди потомков Елеазара, и среди потомков Ифамара были руководители святилища и руководители служения Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «этих с этими»; возможно также: «одну группу вместе с другой».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «руководители святилища и руководители Бога»; также возможно: «князья (предводители) святилища и князья (предводители) Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: И разделили их
  rationale: Форма глагола חלק в пиэле с местоименным суффиксом передаёт разделение или распределение упомянутых священнических групп; прямой перевод сохраняет конкретность действия.
- source_word: בְּגוֹרָלוֹת
  choice: по жребиям
  rationale: Множественное число сохранено; выражение указывает на жребий как способ распределения.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: одних вместе с другими
  rationale: Так передана краткая и несколько неоднозначная соотносительная формула «эти с этими/теми» без уточнения механизма распределения.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: начальники святилища
  rationale: שָׂרֵי обозначает руководителей или должностных лиц, а קֹדֶשׁ в данном культовом контексте естественно понимать как святилище.
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: и начальники Божьи
  rationale: Перевод сохраняет буквальное «Божьи/Бога» и не добавляет отсутствующее в еврейском тексте слово «дом».
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: и среди сыновей Елеазара, и среди сыновей Ифамара
  rationale: Предлоги в сочетании с контекстом указывают, что такие начальники имелись в обеих родовых линиях; «сыновья» сохраняет генеалогическую формулу.
theological_decisions:
- issue: Значение שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים
  choice: 'Сохранены два параллельных обозначения: «начальники святилища и начальники Божьи».'
  alternative: «начальники святынь и начальники Бога» либо расширенное «начальники дома Божьего»
  rationale: Еврейский текст различает две формулы, но не объясняет точное соотношение между ними. Перевод не отождествляет их и не вводит отсутствующее слово «дом».
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Причинная связь выражена естественно, а повтор «и среди… и среди…» подчёркивает наличие должностных лиц в обеих священнических линиях. Необычная формула «начальники Божьи» сохранена ради близости к источнику и снабжена примечанием.
