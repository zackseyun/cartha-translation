base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: ru
  text: 'Среди сыновей Елеазара оказалось больше глав родов[a], чем среди сыновей Ифамара, и разделили их так: у сыновей Елеазара — шестнадцать глав отеческих домов[b], а у сыновей Ифамара — восемь глав их отеческих домов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глав мужей». Еврейское גְּבָרִים может обозначать мужчин, сильных или влиятельных мужей; здесь, вероятно, имеются в виду главы родовых подразделений.'
    reason: lexical_alternative
  - marker: b
    text: «Отеческий дом» — родовая семейная община, служившая в Израиле единицей родословного и административного устройства.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  choice: оказалось
  rationale: Нифаль глагола מצא обозначает выявившееся положение дел; русское «оказалось» естественно передаёт результат подсчёта.
- source_word: רַבִּים
  choice: больше
  rationale: Сравнение с сыновьями Ифамара показывает, что прилагательное употреблено в сравнительном смысле.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: глав родов
  rationale: По контексту речь идёт о мужчинах, возглавлявших родовые подразделения. Перевод передаёт административно-родовой смысл, а буквальная и иная возможная трактовка отмечена в сноске.
- source_word: וַיַּחְלְקוּם
  choice: их разделили так
  rationale: Глагол во множественном числе описывает распределение священнических родов по группам; неопределённо-личная конструкция сохраняет отсутствие явно названного деятеля.
- source_word: רָאשִׁים
  choice: глав
  rationale: Сохраняется терминология руководителей родовых домов и связь с предыдущим выражением.
- source_word: לְבֵית אָבוֹת / לְבֵית אֲבוֹתָם
  choice: отеческих домов / их отеческих домов
  rationale: «Отеческий дом» передаёт устойчивую израильскую родовую и административную единицу; местоимение во второй фразе отражает еврейский суффикс.
- source_word: שִׁשָּׁה עָשָׂר / שְׁמוֹנָה
  choice: шестнадцать / восемь
  rationale: Прямое обозначение числа глав отеческих домов в каждой линии.
