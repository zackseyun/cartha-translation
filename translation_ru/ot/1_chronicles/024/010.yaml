lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: Гаккоцу
  rationale: Предлог לְ обозначает, кому по жребию назначена соответствующая череда. Имя הַקּוֹץ передано традиционной русской библейской формой «Гаккоц»; дательный падеж естественно выражает распределение.
- source_word: הַשְּׁבִעִי
  choice: седьмой
  rationale: Порядковое числительное с артиклем обозначает седьмую священническую череду; в русском контексте списка определённость передаётся без отдельного средства.
- source_word: לַאֲבִיָּה
  choice: Авии
  rationale: Предлог לְ вновь обозначает назначение по жребию. Имя אֲבִיָּה передано принятой русской библейской формой «Авия» в дательном падеже.
- source_word: הַשְּׁמִינִי
  choice: восьмой
  rationale: Порядковое числительное параллельно «седьмой» и обозначает восьмую священническую череду.
