lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: Иешуа
  rationale: Предлог לְ в контексте распределения священнических черед по жребию обозначает, кому выпал соответствующий жребий. В русском перечислении это естественно передаётся конструкцией с тире; личное имя транслитерировано.
- source_word: הַתְּשִׁעִי
  choice: девятый
  rationale: Определённое порядковое числительное употреблено субстантивированно и указывает на девятый жребий в последовательности.
- source_word: לִשְׁכַנְיָהוּ
  choice: Шехания
  rationale: Предлог לְ указывает на получателя соответствующего жребия. Еврейское личное имя передано современной русской библейской транслитерацией.
- source_word: הָעֲשִׂרִי
  choice: десятый
  rationale: Определённое порядковое числительное обозначает десятый жребий в последовательности.
