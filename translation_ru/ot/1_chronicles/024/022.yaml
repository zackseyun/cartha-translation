- source_word: שְׁלֹמוֹת
  choice: Шеломоф
  rationale: Личное имя передано в принятой русской библейской форме; одинаковое написание сохранено при повторе.
- source_word: לִבְנֵי
  choice: для сынов
  rationale: ל передаёт отнесение в административном перечне, а בְנֵי формально означает «сыны» и в родословных может охватывать более широкое понятие потомков.
- source_word: יָחַת
  choice: Иахаф
  rationale: Личное имя передано в традиционной русской библейской форме, соответствующей еврейскому יָחַת.
