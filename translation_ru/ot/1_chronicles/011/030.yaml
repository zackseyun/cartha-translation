- source_word: בַּעֲנָה
  choice: Баана
  rationale: Личное имя передано традиционной русской библейской формой; после слова «сын» употреблён родительный падеж «Бааны».
- source_word: הַנְּטוֹפָתִי
  choice: нетофатянина
  rationale: Повторное обозначение грамматически относится к Баане; родительный падеж сохраняет это отнесение и повтор исходного текста.
