base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: ru
  text: 'Давиду захотелось воды, и он сказал: «Кто напоит меня водой из колодца[b] в Вифлееме, который находится у ворот?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Если бы кто-нибудь дал мне напиться воды из колодца в Вифлееме, у ворот!»'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переведённое как «колодец», может также означать «цистерна» или «яма»; здесь имеется в виду источник питьевой воды.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: захотелось Давиду
  rationale: Глагол выражает сильное желание. Безличная русская конструкция естественно передаёт внезапное страстное желание, не усиливая его сверх исходного текста.
- source_word: מי
  choice: кто
  rationale: Сохранена вопросительная форма еврейской речи, которая в контексте выражает желание; более идиоматическое пожелание приведено в сноске.
- source_word: ישקני
  choice: напоит меня
  rationale: Русский каузативный глагол точно и естественно передаёт хифиль שקה — «дать пить, напоить».
- source_word: מים
  choice: водой
  rationale: Прямой эквивалент; творительный падеж обусловлен управлением глагола «напоить».
- source_word: מבּור
  choice: из колодца
  rationale: בור может означать яму, водоём или цистерну; в данном контексте речь идёт об известном источнике питьевой воды, поэтому «колодец» наиболее ясно.
- source_word: בית לחם
  choice: Вифлееме
  rationale: Употреблена традиционная русская форма библейского топонима.
- source_word: אשר בשער
  choice: что у ворот
  rationale: Фраза естественно указывает местоположение колодца относительно городских ворот и сохраняет относительную конструкцию.
