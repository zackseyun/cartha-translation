base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: ru
  text: 'И сказал Давид: «Кто первым поразит иевусея, тот станет главой и военачальником[a]». Иоав, сын Церуи, первым поднялся[b] и стал главой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет главой и начальником».'
    reason: lexical_alternative
  - marker: b
    text: Глагол «поднялся» может подразумевать подъём для штурма крепости, но само еврейское выражение означает просто «поднялся».
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: кто поразит иевусея
  rationale: Сочетание כָּל с причастием образует неопределённо-относительную конструкцию «кто / всякий, кто». В военном контексте נכה передано глаголом «поразить», который допускает смысл нанесения поражения и не уточняет сверх еврейского текста, был ли противник непременно убит. Единственное число יְבוּסִי понято обобщённо.
- source_word: בָּרִאשׁוֹנָה
  choice: первым
  rationale: Наречная форма указывает на первенство в действии. Русское «первым» естественно выражает этот смысл и в обещании Давида, и в сообщении об Иоаве.
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: станет главой и военачальником
  rationale: Конструкция היה + ל обозначает приобретение положения, поэтому выбрано «станет». רֹאשׁ передано как «глава», а שַׂר в данном военном контексте — как «военачальник»; парность обозначений сохранена.
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה буквально означает движение вверх. Контекст может подразумевать подъём для штурма крепости, однако перевод сохраняет прямое значение и не заменяет его более толковательным «атаковал».
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: Иоав, сын Саруи
  rationale: Использованы традиционные русские формы библейских имён; указание на происхождение передано прямо и современно.
- source_word: וַיְהִי לְרֹאשׁ
  choice: и стал главой
  rationale: Перевод сохраняет повтор слова רֹאשׁ и тем самым связь с обещанием Давида. В этой части стиха שַׂר не повторяется, поэтому «военачальником» не добавлено.
