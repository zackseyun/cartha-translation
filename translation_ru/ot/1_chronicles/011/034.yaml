lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Сопряжённая форма множественного числа от בֵּן буквально означает «сыновья». Сохраняется чтение масоретского текста без согласования с параллельным перечнем.
- source_word: הָשֵׁם
  choice: Хашема
  rationale: Личное имя передано транслитерацией и поставлено в родительный падеж после слова «сыновья».
- source_word: הַגִּזוֹנִי
  choice: из Гизона
  rationale: Обозначение происхождения естественно передаётся по-русски предложным оборотом; определённый артикль отдельно не воспроизводится.
- source_word: יוֹנָתָן
  choice: Ионафан
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: בֶּן
  choice: сын
  rationale: Сопряжённая форма единственного числа обозначает сыновнее происхождение; русская конструкция требует родительного падежа следующего имени.
- source_word: שָׁגֵה
  choice: Шаге
  rationale: Личное имя передано близкой русской транслитерацией с сохранением конечного гласного.
- source_word: הַהֲרָרִי
  choice: из Харара
  rationale: Нисба, вероятно обозначающая происхождение или принадлежность, передана естественным русским оборотом без излишнего уточнения характера связи.
