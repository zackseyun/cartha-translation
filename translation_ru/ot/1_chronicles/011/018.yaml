  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: ru
  text: Тогда трое прорвались в стан филистимлян, зачерпнули воды из колодца у ворот Вифлеема, понесли её и принесли Давиду. Но Давид не захотел её пить, а совершил ею возлияние Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вылил её Яхве». Еврейский глагол обозначает выливание и в данном контексте может иметь культовый смысл жертвенного возлияния.'
    reason: 'Лексическая альтернатива: сохраняет конкретное действие «вылил», тогда как основной текст прямо передаёт культовое значение глагола נסך.'
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: прорвались
  rationale: В военном контексте глагол означает прорыв через вражеское расположение; «прорвались» естественно и точно передаёт силу действия.
- source_word: הַשְּׁלֹשָׁה
  choice: трое
  rationale: В еврейском тексте сказано просто «трое»; уточнение «сильных воинов» понятно из контекста, но в данном стихе отсутствует.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: в стан филистимлян
  rationale: При глаголе движения предлог указывает на проникновение во вражеский стан; «стан» сохраняет повествовательный и военный регистр.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: зачерпнули воды
  rationale: Глагол שאב обозначает черпание воды из колодца; родительный партитивный оборот естественен в русском повествовании.
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: из колодца у ворот Вифлеема
  rationale: בּוֹר допускает значения «яма», «водоём» или «колодец»; черпание питьевой воды поддерживает «колодец». Оборот «у ворот Вифлеема» ясно передаёт местоположение, не переуточняя синтаксис.
- source_word: וַיִּשְׂאוּ וַיָּבִיאוּ אֶל דָּוִיד
  choice: взяли её и принесли Давиду
  rationale: Первый глагол здесь относится к переносу воды, второй — к доставке Давиду. Местоимение «её» согласуется с русским словом «вода».
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: Но Давид не захотел её пить
  rationale: אָבָה выражает волю или согласие; «не захотел» точно передаёт это значение, не усиливая его до категорического «отказался».
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: и вылил её перед Яхве
  rationale: נסך обозначает излияние и может иметь культовый смысл возлияния. «Перед Яхве» естественно выражает направленность действия Богу, а примечание сохраняет жертвенный оттенок глагола.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Культовое значение поступка Давида с водой
  choice: В основном тексте дано конкретное действие «вылил её перед Яхве», а значение возлияния пояснено в сноске.
  alternative: «совершил возлияние Яхве» или «вылил её как возлияние Яхве»
  rationale: Еврейский глагол несёт культовый оттенок, однако повествование одновременно описывает видимое действие. Такое решение сохраняет и образность сцены, и её богослужебное измерение, не делая толкование более определённым, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранено краткое «трое» без контекстного добавления «воинов». Слово «стан» употреблено как понятное традиционное обозначение военного лагеря; синтаксис упрощён до естественной русской последовательности. Маркер [a] помещён непосредственно после выражения, к которому относится примечание.
