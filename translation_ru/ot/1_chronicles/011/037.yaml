lexical_decisions:
- source_word: חֶצְרוֹ
  choice: Хецро
  rationale: Личное имя передано транслитерацией формы, засвидетельствованной в масоретском тексте Паралипоменон; отличие параллельного списка отмечено в сноске.
- source_word: הַכַּרְמְלִי
  choice: кармелитянин
  rationale: Прилагательное принадлежности с артиклем обозначает уроженца или жителя Кармила. Русское «кармелитянин» кратко передаёт географическую принадлежность и в данном древнем контексте не относится к позднейшему монашескому ордену.
- source_word: נַעֲרַי
  choice: Наарай
  rationale: Личное имя транслитерировано непосредственно с еврейской формы с сохранением последовательности гласных.
- source_word: בֶּן
  choice: сын
  rationale: В перечне имён בֶּן естественно означает непосредственное родство «сын»; оснований расширять значение до «потомок» нет.
- source_word: אֶזְבָּי
  choice: Эзбай
  rationale: Личное имя передано транслитерацией еврейской формы.
