  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: ru
  text: И пошёл Давид со всем Израилем в Иерусалим — то есть Иевус, где жили иевусеи, жители этой земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и там иевусей, жители земли»; слово «иевусей» стоит в единственном числе, но имеет собирательное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: И пошёл
  rationale: Форма с последовательным וַ продвигает повествование; русское «И пошёл» естественно сохраняет связь с предшествующими событиями.
- source_word: וְכָל יִשְׂרָאֵל
  choice: со всем Израилем
  rationale: Хотя союз буквально может передаваться как «и», по-русски при одном сказуемом естественнее выразить сопровождающих Давида оборотом «со всем Израилем».
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: к Иерусалиму, то есть Иевусу
  rationale: Местоимение הִיא отождествляет Иерусалим с его прежним названием Иевус; пояснительный оборот ясно передаёт это отношение.
- source_word: וְשָׁם
  choice: там
  rationale: Прямое и естественное соответствие еврейскому наречию места в русском повествовании.
- source_word: הַיְבוּסִי
  choice: иевусеи
  rationale: Существительное стоит в единственном числе, но употреблено собирательно, что подтверждается следующим причастием во множественном числе.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жители той земли
  rationale: Причастный оборот означает «жители земли»; указательное «той» естественно связывает землю с названной местностью и не расширяет смысл до всей земли вообще.
