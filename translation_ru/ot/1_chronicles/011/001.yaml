  text: Then all Israel gathered to David at Hebron, saying, “Look, we are your bone and your flesh.”
translation:
  language: ru
  text: 'И весь Израиль собрался в Хеврон, к Давиду, и сказал: «Вот, мы — твоя кость и твоя плоть».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ כָל־יִשְׂרָאֵל
  choice: И собрались все израильтяне
  rationale: Коллективное «весь Израиль» естественно передано как «все израильтяне», без предположения, что речь непременно о каждом отдельном человеке.
- source_word: אֶל־דָּוִיד חֶבְרוֹנָה
  choice: к Давиду в Хевроне
  rationale: Направительный суффикс при названии города обозначает движение в Хеврон; по-русски сочетание естественно формулируется как собрание к Давиду, находившемуся в Хевроне.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую функцию частицы и звучит достойно и естественно в прямой речи.
- source_word: עַצְמְךָ וּבְשָׂרְךָ אֲנָחְנוּ
  choice: мы — твоя кость и твоя плоть
  rationale: Сохранена телесная метафора родства и единства, а также единственное число существительных в еврейском тексте; тире ясно передаёт именную конструкцию.
theological_decisions:
- issue: Смысл формулы «кость и плоть»
  choice: Сохранить образ буквально
  alternative: 'Передать толкованием: «мы одной с тобой крови» или «мы твои родичи»'
  rationale: Буквальная формула является значимым библейским образом родства и общности; её истолкование не следует вносить непосредственно в основной текст.
translation_notes:
  register: Современный литературный русский с сохранением торжественной библейской образности. Союз «И» отражает повествовательную связь стиха с предыдущим контекстом; архаизм «се» не используется.
