  text: עֻזִיָּ֖א הָ/עֲשְׁתְּרָתִ֑י שָׁמָע֙ ו/יעואל בְּנֵ֖י חוֹתָ֥ם הָ/עֲרֹעֵרִֽיס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/044.yaml
  text: Uzzia the Ashterathite[a], Shama and Jeiel[b], the sons of Hotham the Aroerite.
translation:
  language: ru
  text: Уззия, аштератянин[a], Шама и Иеуэл[b], сыновья Хотама, ароэрянина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аштаротянин»; это обозначение, вероятно, указывает на уроженца Аштерота (Аштарота).'
    reason: lexical_alternative
  - marker: b
    text: Имя также передают как «Иеиел». В представленном еврейском написании стоит форма, соответствующая передаче «Иеуэл».
    reason: textual_transliteration
lexical_decisions:
- source_word: עֻזִּיָא
  choice: Уззия
  rationale: Личное имя передано транслитерацией с сохранением удвоенного согласного, отражённого в масоретской огласовке.
- source_word: הָעֲשְׁתְּרָתִי
  choice: аштератянин
  rationale: Форма является обозначением жителя или уроженца места Аштерот/Аштерат; русский демоним сохраняет географическую отнесённость исходного слова.
- source_word: שָׁמָע
  choice: Шама
  rationale: Личное имя передано по данной еврейской форме без добавления конечного согласного из иных традиций передачи.
- source_word: ויעואל
  choice: и Иеуэл
  rationale: Союз ו передан как «и», а имя транслитерировано в соответствии с представленным согласным написанием יעואל; распространённая альтернативная передача отмечена в сноске.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма множественного числа в сопряжённом состоянии прямо указывает, что Шама и Иеуэл — сыновья Хотама.
- source_word: חוֹתָם
  choice: Хотама
  rationale: Личное имя транслитерировано; родительный падеж обусловлен словом «сыновья».
- source_word: הָעֲרֹעֵרִי
  choice: ароэрянина
  rationale: Гентилий от топонима Ароэр передан естественным русским обозначением жителя или уроженца; падеж согласован с именем Хотам.
theological_decisions: []
translation_notes:
  register: Краткий перечислительный стиль родословно-воинского списка сохранён. Для географических обозначений использованы понятные русские демонимы; запятые показывают, что «ароэрянин» относится к Хотаму, а «сыновья Хотама» — к Шаме и Иеуэлу.
