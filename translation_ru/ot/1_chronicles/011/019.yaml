source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י מֵ/אֱלֹהַ֜/י מֵ/עֲשׂ֣וֹת זֹ֗את הֲ/דַ֣ם הָ/אֲנָשִׁים֩ הָ/אֵ֨לֶּה אֶשְׁתֶּ֤ה בְ/נַפְשׁוֹתָ/ם֙ כִּ֣י בְ/נַפְשׁוֹתָ֣/ם הֱבִיא֔וּ/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: ru
  text: 'И он сказал: «Да сохранит меня мой Бог от такого! Неужели я стану пить кровь этих людей,[b] рисковавших жизнью?[a] Ведь они принесли её, рискуя жизнью». И он не захотел пить её. Вот что совершили трое могучих воинов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с их жизнями». Этот оборот повторён в еврейском тексте для усиления и означает, что они подвергали жизнь смертельной опасности.'
    reason: lexical_alternative
  - marker: b
    text: Давид называет воду «кровью», поскольку воины принесли её, рискуя жизнью.
    reason: cultural_note
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: Да сохранит меня мой Бог от такого!
  rationale: Современная русская формула решительного отвращения и отказа передаёт идиому חָלִילָה и сохраняет явное обращение к Богу, не превращая её в отвлечённое «это далеко от меня».
- source_word: מֵעֲשׂוֹת זֹאת
  choice: от такого
  rationale: После русской идиомы «да сохранит» конструкция естественно выражает предотвращение действия; «такого» относится к намерению выпить воду.
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: Неужели я стану пить кровь этих людей
  rationale: «Неужели» передаёт риторический вопрос, а буквальный образ крови сохранён, поскольку он составляет смысловой центр высказывания Давида.
- source_word: בְנַפְשׁוֹתָם
  choice: ценой их жизни / рискуя жизнью
  rationale: נֶפֶשׁ здесь означает физическую жизнь. В первом случае оборот связан с образом крови, во втором естественный русский оборот ясно показывает, что воины подвергли жизнь смертельной опасности, а не обязательно погибли.
- source_word: כִּי בְנַפְשׁוֹתָם הֱבִיאוּם
  choice: Ведь они принесли её, рискуя жизнью
  rationale: Союз «ведь» выражает обоснование отказа; местоимение «её» относится к воде. Повтор мысли о жизни сохранён без неестественного русского буквального оборота.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: И он не захотел её пить
  rationale: Глагол אָבָה обозначает желание или согласие; перевод не усиливает его до более категоричного «отказался».
- source_word: אֵלֶּה עָשׂוּ שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: Вот что совершили трое могучих воинов
  rationale: גִּבּוֹרִים обозначает прославленных сильных воинов Давида; «совершили» естественно подводит итог их подвигу.
theological_decisions:
- issue: Образ крови в словах Давида
  choice: Сохранить слово «кровь» буквально, пояснив образ примечанием.
  alternative: 'Передать только смысл: «Неужели я стану пить воду, ради которой они рисковали жизнью?»'
  rationale: Еврейский текст прямо говорит о крови. Давид оценивает воду как равную крови людей из-за смертельной опасности, которой они подверглись; устранение образа ослабило бы этическое напряжение повествования.
- issue: Значение נֶפֶשׁ
  choice: Передать как «жизнь».
  alternative: «душа»
  rationale: Контекст говорит об опасности для физической жизни, а не формулирует учение о нематериальной душе.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Избегаются как церковнославянизмы, так и разговорная сниженная лексика. Риторический вопрос и повтор мотива жизни сохранены, а буквальный образ крови не сглажен.
