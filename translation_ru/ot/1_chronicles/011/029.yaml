lexical_decisions:
- source_word: סִבְּכַי
  choice: Сивхай
  rationale: Личное имя передано транслитерацией с еврейского; буква ב с дагешем отражена удвоенным согласным не графически, а в принятой русской библейской форме имени.
- source_word: הַחֻשָׁתִי
  choice: хушатянин
  rationale: Обозначение принадлежности к месту или роду передано естественным русским этнонимно-родовым суффиксом; определённый артикль отдельно не воспроизводится, поскольку русская конструкция этого не требует.
- source_word: עִילַי
  choice: Илай
  rationale: Сохранена форма имени в еврейском тексте 1 Паралипоменон, без гармонизации с параллельным перечнем во 2 Царств 23:26.
- source_word: הָאֲחוֹחִי
  choice: ахохитянин
  rationale: Родовое обозначение от אֲחוֹחַ передано транслитерацией основы и естественным русским суффиксом принадлежности.
