source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: ru
  text: Это были предводители могучих воинов Давида, которые вместе с ним поддерживали его в его царствовании, действуя заодно со всем Израилем, чтобы поставить его царём, согласно слову Яхве об Израиле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно слову Яхве о том, чтобы поставить его царём над Израилем». Еврейский предлог может также связываться с «поставить его царём» («над Израилем»), хотя естественно относится к «слову Яхве» («об Израиле»).'
    reason: Сохраняет возможную синтаксическую неоднозначность выражения עַל יִשְׂרָאֵל и ясно указывает место её возникновения.
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: главы могучих воинов
  rationale: «Главы» естественно передаёт руководящее положение, а «могучие воины» сохраняет военно-героический смысл обозначения Давидова отряда.
- source_word: אֲשֶׁר לְדָוִיד
  choice: Давида
  rationale: Краткая притяжательная конструкция естественно передаёт принадлежность и связь этих воинов с Давидом.
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: которые вместе с ним укрепляли
  rationale: Передаёт возвратно-совместный оттенок hitpael и политико-военный смысл поддержки, не сводя выражение только к односторонней помощи Давиду.
- source_word: בְמַלְכוּתוֹ
  choice: его царскую власть
  rationale: В контексте поставления Давида царём מַלְכוּת прежде всего обозначает царствование или царскую власть, а не территорию царства.
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: действуя заодно со всем Израилем
  rationale: Ясно выражает совместность действий Давидовых воинов и всего народа.
- source_word: לְהַמְלִיכוֹ
  choice: чтобы поставить его царём
  rationale: 'Прямо передаёт каузативное значение формы hiphil: сделать Давида царём.'
- source_word: כִּדְבַר יְהוָה
  choice: согласно слову Яхве
  rationale: Сохраняет формальную связь с Божьим словом и передаёт тетраграмматон личным именем.
- source_word: עַל יִשְׂרָאֵל
  choice: об Израиле
  rationale: При דָּבָר предлог עַל естественно означает тему высказывания — «об, относительно»; буквальная пространственная передача здесь двусмысленна.
theological_decisions:
- issue: Характер действия הַמִּתְחַזְּקִים עִמּוֹ
  choice: Совместное с Давидом укрепление его царской власти
  alternative: Они оказывали Давиду решительную поддержку; они укреплялись вместе с ним
  rationale: Контекст воцарения указывает на активную поддержку Давидовой власти, однако совместная формулировка сохраняет рефлексивно-взаимный оттенок еврейского выражения.
- issue: Значение בְמַלְכוּתוֹ
  choice: царская власть Давида
  alternative: его царство; его царствование
  rationale: Непосредственный контекст говорит об утверждении Давида как царя, поэтому речь вероятнее о его царской власти, хотя еврейское слово допускает более широкий смысл.
- issue: Связь עַל יִשְׂרָאֵל
  choice: слово Яхве об Израиле
  alternative: слово Яхве над Израилем; воцарить Давида над Израилем
  rationale: Синтаксически оборот естественно относится к «слову Яхве», но буквальное «над Израилем» может допускать связь с царской властью; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным регистром. Синтаксис упрощён для ясности, но сохранены военная образность, совместный характер поддержки Давида и неоднозначность заключительного оборота.
