  text: וַ/יֵּ֥שֶׁב דָּוִ֖יד בַּ/מְצָ֑ד עַל כֵּ֥ן קָרְאוּ ל֖/וֹ עִ֥יר דָּוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/007.yaml
  text: David lived in the stronghold[a]; therefore they called it the City of David.
translation:
  language: ru
  text: Давид поселился в крепости[a]; поэтому её назвали Городом Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в укреплении». Еврейское מְצָד означает укреплённое, защищённое место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: В повествовании при указании места глагол ישב означает жить или обосноваться. «Поселился» естественно передаёт начало пребывания Давида в захваченной крепости.
- source_word: בַּמְצָד
  choice: в крепости
  rationale: מְצָד обозначает укреплённое, защищённое место; «крепость» ясно сохраняет военно-оборонительный смысл.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Устойчивое сочетание выражает следствие и причинную связь с предыдущим сообщением.
- source_word: קָרְאוּ לוֹ
  choice: её назвали
  rationale: Активная форма множественного числа сохранена без неопределённого подлежащего; местоимение женского рода согласовано с русским словом «крепость» и относится к этому месту.
- source_word: עִיר דָּוִיד
  choice: Городом Давида
  rationale: Сохранено традиционное собственное наименование места; творительный падеж обусловлен русской конструкцией с глаголом «назвали».
theological_decisions: []
