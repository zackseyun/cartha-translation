base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/039.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, the armor-bearer of Joab son of Zeruiah;
translation:
  language: ru
  text: Целек, аммонитянин, Нахрай, беэротянин, оруженосец Иоава, сына Церуи;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶלֶק
  choice: Целек
  rationale: Личное имя передано транслитерацией, близкой к еврейской форме.
- source_word: הָעַמּוֹנִי
  choice: аммонитянин
  rationale: Этноним с артиклем указывает на происхождение Целека; в русском перечне естественно употребление без отдельного указательного слова.
- source_word: נַחְרַי
  choice: Нахрай
  rationale: Личное имя передано транслитерацией с сохранением согласного ח как «х».
- source_word: הַבֵּרֹתִי
  choice: беэротянин
  rationale: Обозначение жителя или уроженца Беэрота; форма сохраняет прозрачную связь с названием места.
- source_word: נֹשֵׂא כְּלֵי
  choice: оруженосец
  rationale: Устойчивое сочетание буквально означает «носящий оружие/снаряжение» и обозначает оруженосца; русское слово точно и естественно передаёт должность.
- source_word: יוֹאָב
  choice: Иоав
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: בֶּן צְרוּיָה
  choice: сына Церуи
  rationale: Сохранено примечательное указание родства по матери; падеж согласован с приложением «Иоава».
