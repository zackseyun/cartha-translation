source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: ru
  text: Все старейшины Израиля пришли к царю в Хеврон, и Давид заключил с ними в Хевроне завет перед Яхве. Затем они помазали Давида царём над Израилем по слову Яхве, переданному через Самуила.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рукой Самуила» — еврейская идиома со значением «через Самуила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: старейшины
  rationale: Это обычное и точное обозначение признанных представителей народа, сохраняющее общественно-политический смысл еврейского слова.
- source_word: הַמֶּלֶךְ
  choice: к царю
  rationale: Еврейский текст употребляет здесь титул с определённым артиклем, а имя Давида называет в следующей части стиха.
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: в Хеврон / в Хевроне
  rationale: Форма חֶבְרוֹנָה указывает на направление движения, поэтому по-русски естественно «пришли к царю в Хеврон»; сочетание с בְּ обозначает место заключения завета — «в Хевроне».
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: заключил ... завет
  rationale: Буквально идиома означает «разрезал завет», но нормативное современное русское соответствие — «заключил завет».
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Формулировка сохраняет торжественный смысл совершения завета в присутствии Бога как свидетеля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в исходном тексте и не заменяет его титулом.
- source_word: וַיִּמְשְׁחוּ
  choice: помазали
  rationale: Глагол прямо обозначает обряд помазания при поставлении на царство; более общее «посвятили» было бы менее точно.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: в цари над Израилем
  rationale: Это естественная русская формула царского поставления, передающая как назначение Давида, так и область его власти.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Сохраняется прямое значение דָבָר — «слово», без сужения смысла до «обещания».
- source_word: בְּיַד שְׁמוּאֵל
  choice: переданному через Самуила
  rationale: Еврейская идиома буквально говорит «рукой Самуила» и обозначает его как посредника, через которого было сообщено слово Яхве.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит личное заветное имя Бога. Форма «Яхве» передаёт имя как имя, не подменяя его титулом; «Иегова» отражает более позднюю гибридную традицию произношения.
- issue: Роль Самуила в выражении בְּיַד שְׁמוּאֵל
  choice: слово Яхве, переданное через Самуила
  alternative: слово Яхве рукой Самуила; слово Яхве, сказанное Самуилом
  rationale: Так сохраняется посредническая роль Самуила без утверждения, будто слово исходило от него самого; буквальный образ руки поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Пред Яхве» сохраняет solemnный оттенок исходной формулы, тогда как синтаксис остальных предложений остаётся ясным и естественным. Маркер сноски помещён после слов о Самуиле, к которым относится пояснение.
