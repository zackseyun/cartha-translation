base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/026.yaml
  text: 'And the mighty warriors were: Asahel the brother of Joab[a], Elhanan son of Dodo, from Bethlehem.'
translation:
  language: ru
  text: 'И среди могучих воинов были: Асаил, брат Иоава, Елханан, сын Додо, из Вифлеема.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: И среди могучих воинов были
  rationale: Сочетание обозначает доблестных, выдающихся воинов. «Могучие воины» естественно звучит по-русски и сохраняет военный смысл; союз וְ продолжает перечень. Связка «были» подразумевается именным построением и нужна для ясного русского предложения.
- source_word: עֲשָׂה אֵל
  choice: Асаил
  rationale: Традиционная русская библейская передача личного имени עֲשָׂהאֵל.
- source_word: אֲחִי יוֹאָב
  choice: брат Иоава
  rationale: Точно передаёт конструкцию принадлежности и естественно звучит в русском перечне.
- source_word: אֶלְחָנָן
  choice: Елханан
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: בֶּן דּוֹדוֹ
  choice: сын Додо
  rationale: Обычная родословная формула; דּוֹדוֹ здесь понимается как личное имя.
- source_word: מִבֵּית לָחֶם
  choice: из Вифлеема
  rationale: Предлог מִן с названием места прямо указывает на происхождение. Передача «из Вифлеема» сохраняет буквальный смысл и не превращает выражение в прилагательное.
