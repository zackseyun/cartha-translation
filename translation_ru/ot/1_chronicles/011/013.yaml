base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: ru
  text: Он был с Давидом в Пас-Даммиме[a], где филистимляне собрались для сражения. Участок поля был покрыт ячменём, и народ бежал от филистимлян[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пас-Даммим — название местности; в параллельном рассказе, 1 Царств 17:1, это место названо Ефес-Даммимом.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «бежал от лица филистимлян»; то есть бежал перед ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: в Пас-Даммиме
  rationale: Форма передана как географическое название, а не переведена по предполагаемой этимологии; это соответствует контексту и параллельному рассказу.
- source_word: נֶאֱסְפוּ
  choice: собрались
  rationale: Нифаль глагола אסף здесь обозначает совместное сосредоточение войска; возвратная форма естественна по-русски.
- source_word: לַמִּלְחָמָה
  choice: на битву
  rationale: Речь идёт о конкретном сражении, поэтому «битва» точнее контекстуального «война».
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: участок поля
  rationale: Передаёт определённую возделываемую часть поля без излишне специальной лексики.
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: был засеян ячменём
  rationale: Естественная русская передача поля, «полного ячменя»; конкретная культура — ячмень — сохранена.
- source_word: וְהָעָם
  choice: и народ
  rationale: Сохраняется широкое значение עם без необоснованного сужения до «воинов», хотя по контексту имеются в виду израильтяне, участвовавшие в сражении.
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: бежал от филистимлян
  rationale: Передаёт обычное значение еврейской идиомы מִפְּנֵי в понятной современной русской форме.
