  text: Ittai son of Ribai[a], from Gibeah of the sons of Benjamin; Benaiah the Pirathonite;
translation:
  language: ru
  text: Иттай, сын Ривая, из Гивы, в земле сынов Вениамина[a]; Беная, пирафонянин;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Вениамина», то есть представителей колена Вениамина.'
