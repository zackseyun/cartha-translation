lexical_decisions:
- source_word: אִיתַי
  choice: Иттай
  rationale: Личное имя передано транслитерацией, отражающей удвоенный согласный в еврейской форме.
- source_word: בֶּן רִיבַי
  choice: сын Ривая
  rationale: Конструкция с בֶּן прямо указывает на сыновство; имя רִיבַי передано как «Ривай», в родительном падеже — «Ривая».
- source_word: מִגִּבְעַת
  choice: из Гивы
  rationale: Предлог מִן обозначает происхождение, а גִּבְעַת здесь является названием города.
- source_word: בְּנֵי בִנְיָמִן
  choice: сынов Вениамина
  rationale: Сохранён буквальный племенной оборот, а его значение пояснено в сноске.
- source_word: בְּנָיָה
  choice: Беная
  rationale: Личное имя передано русской транслитерацией с сохранением формы еврейского имени.
- source_word: הַפִּרְעָתֹנִי
  choice: пирафонянин
  rationale: Прилагательное принадлежности обозначает уроженца или жителя Пирафона; естественный русский эквивалент — этнохороним «пирафонянин».
