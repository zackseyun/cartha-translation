  text: Eliel[a], Obed, and Jaasiel the Mezobaite.
translation:
  language: ru
  text: Елиил, Овед и Иасиил Мецоваитянин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское הַמְּצֹבָיָה — обозначение происхождения; вероятно, оно указывает, что Иасиил был из Мецовы либо принадлежал к одноимённому роду. Точное название места или рода неясно; возможна также передача «Мицоваитянин».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Елиил
  rationale: Личное имя передано принятой русской библейской транслитерацией, без перевода его составных частей.
- source_word: וְעוֹבֵד
  choice: Овед
  rationale: Личное имя с союзом; в русском перечислении союз естественно ставится только перед последним однородным членом.
- source_word: וְיַעֲשִׂיאֵל
  choice: и Иасиил
  rationale: Личное имя передано традиционной русской библейской формой; prefixed וְ выражено союзом «и».
- source_word: הַמְּצֹבָיָה
  choice: Мецовитянин
  rationale: Форма с артиклем представляет собой обозначение происхождения от места или рода. Русский суффиксальный этноним сохраняет эту функцию, не превращая неясное обозначение в уверенно установленное географическое название.
