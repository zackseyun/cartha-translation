lexical_decisions:
- source_word: עַזְמָוֶת
  choice: Азмавет
  rationale: Личное имя передано транслитерацией с еврейского в форме, естественной для русской библейской традиции.
- source_word: הַבַּחֲרוּמִי
  choice: Бахарумит
  rationale: Этникон с артиклем обозначает происхождение или родовую связь. Основной текст следует огласованной масоретской форме; возможная связь с Бахуримом отмечена в сноске.
- source_word: אֶלְיַחְבָּא
  choice: Элияхба
  rationale: Личное имя транслитерировано с сохранением различимого элемента יה и еврейского звучания насколько это естественно по-русски.
- source_word: הַשַּׁעַלְבֹנִי
  choice: Шаалбонит
  rationale: Этникон передан краткой транслитерированной формой, указывающей на связь с местностью Шаалбон и подходящей для перечня имён.
