base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: ru
  text: Он пользовался большим почётом, чем Тридцать, но не достиг уровня Трёх[a]. Давид поставил его во главе своей стражи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «но к Трём не пришёл»; то есть не достиг их положения или ранга.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «над своим отрядом». Древнееврейское слово может обозначать стражу, подчинённый отряд или тех, кто исполняет приказания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
  choice: Среди тридцати
  rationale: 'Предлог מִן при обозначении группы здесь естественно понимать в партитивном смысле: он принадлежал к числу тридцати воинов. Такой перевод также сохраняет сопоставление с последующим упоминанием трёх.'
- source_word: הִנּוֹ נִכְבָּד
  choice: он был особенно почитаем
  rationale: הִנּוֹ усиливает утверждение, а נִכְבָּד обозначает высокий почёт или весомое положение. «Особенно почитаем» передаёт эмфазу естественным современным русским языком.
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: но с тремя не сравнялся
  rationale: Буквально «но к трём не пришёл»; в данном контексте בוא אֶל идиоматически выражает достижение уровня или положения. «Не сравнялся» ясно передаёт различие в ранге, не добавляя того, что он пытался получить официальный чин.
- source_word: הַשְּׁלוֹשָׁה
  choice: три
  rationale: Это известная по контексту особая группа из трёх выдающихся воинов Давида. В русском написание со строчной буквы не превращает числительное в имя собственное и остаётся естественным.
- source_word: וַיְשִׂימֵהוּ דָוִיד
  choice: Давид поставил его
  rationale: שׂים в военном и административном контексте означает назначение на должность; «поставил» сохраняет образ исходного глагола и естественно сочетается с «во главе».
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: во главе своей стражи
  rationale: Редкое מִשְׁמַעַת может обозначать находящийся в подчинении отряд, стражу или порученную сферу ответственности. «Своя стража» наиболее вероятно указывает на стражу Давида, но неоднозначность отмечена в сноске.
