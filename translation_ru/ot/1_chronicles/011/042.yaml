  text: Адина, сын Шизы, рувимлянин, предводитель рувимлян; с ним было тридцать человек.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и над ним — тридцать». Еврейский предлог допускает такое прочтение, но в этом военном перечне, вероятно, имеются в виду тридцать человек, состоявших при нём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדִינָא
  choice: Адина
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶן־שִׁיזָא
  choice: сын Шизы
  rationale: В перечне воинов בֶן естественно обозначает непосредственное сыновство; имя שִׁיזָא передано транслитерацией.
- source_word: הָרְאוּבֵנִי
  choice: рубенит
  rationale: Этноним с артиклем указывает на принадлежность к колену Рувима; «рубенит» — краткая и традиционная русская форма.
- source_word: רֹאשׁ
  choice: глава
  rationale: В данном перечне слово обозначает положение руководителя, а не часть тела; «глава» сохраняет достоинство стиля и не уточняет вид должности сверх текста.
- source_word: לָרְאוּבֵנִי
  choice: рубенитов
  rationale: 'Предлог ל выражает здесь отношение или сферу руководства: Адина был главой среди рубенитов.'
- source_word: וְעָלָיו
  choice: с ним было
  rationale: Буквально עַל означает «на/над», однако в военном перечне оборот, вероятнее всего, указывает на людей, состоявших при Адине или сопровождавших его. Более буквальная возможность сохранена в сноске.
- source_word: שְׁלוֹשִׁים
  choice: тридцать человек
  rationale: Числительное передано прямо; слово «человек» добавлено по подразумеваемому смыслу военного перечня для естественности русского языка.
