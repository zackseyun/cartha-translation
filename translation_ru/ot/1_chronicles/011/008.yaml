base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: ru
  text: Он обстроил город кругом — начиная от Милло[a] и далее по кругу, а Иоав восстановил остальную часть города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Милло — топографическое название в Иерусалиме; его точное значение неизвестно. Возможно, так называлось террасное сооружение или насыпь.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Он застроил
  rationale: Глагол בנה обозначает строительство; «застроил» естественно передаёт здесь работу Давида над городом как целым, не добавляя прямо не выраженного значения «перестроил».
- source_word: הָעִיר מִסָּבִיב
  choice: город кругом
  rationale: Сочетание сохраняет значение города и окружающего охвата, оставаясь понятным в современном русском повествовании.
- source_word: מִן הַמִּלּוֹא
  choice: от Милло
  rationale: Милло оставлено как топографическое название, поскольку точный характер обозначаемого им сооружения или участка неясен.
- source_word: וְעַד הַסָּבִיב
  choice: до окрестностей
  rationale: Сжатое еврейское выражение указывает на предел или окружающую территорию; перевод сохраняет его пространственный смысл без излишней конкретизации.
- source_word: וְיוֹאָב
  choice: а Иоав
  rationale: Союз «а» естественно отмечает смену действующего лица и сопоставляет работу Иоава с работой Давида.
- source_word: יְחַיֶּה
  choice: восстановил
  rationale: Пиэль от חיה буквально означает «оживил», но применительно к городу идиоматически указывает на его восстановление или приведение в жизнеспособное состояние.
- source_word: אֶת שְׁאָר הָעִיר
  choice: остальную часть города
  rationale: Передаёт значение оставшейся, ещё не охваченной части города естественным современным русским языком.
