base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/046.yaml
  text: Eliel the Mahavite[a], and Jeribai and Joshaviah, the sons of Elnaam[b], and Ithmah the Moabite.
translation:
  language: ru
  text: Элиэл, махавитянин[a], Иеривай и Иошавия, сыновья Элнаама, и Итма, моавитянин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское обозначение «махавитянин» может относиться к жителю местности или к представителю рода; его точная основа и отождествление неизвестны.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלִיאֵל
  choice: Элиэл
  rationale: Личное имя передано транслитерацией с еврейского в форме, естественной для русской библейской традиции.
- source_word: הַמַּחֲוִים
  choice: из Махавы
  rationale: Неясное обозначение происхождения, вероятно связанное с местностью или родом; русская конструкция «из Махавы» естественно передаёт вероятное значение, не отождествляя место с каким-либо известным пунктом.
- source_word: וִירִיבַי
  choice: Иривай
  rationale: Личное имя транслитерировано непосредственно с масоретской формы יְרִיבַי; начальный йод перед гласным передан русским И.
- source_word: וְיוֹשַׁוְיָה
  choice: Иошавия
  rationale: Личное имя транслитерировано с сохранением согласных и огласовки еврейской формы.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма множественного числа в сопряжённом состоянии определяет Иривая и Иошавию как сыновей Элнаама.
- source_word: אֶלְנָעַם
  choice: Элнаам
  rationale: Личное имя передано транслитерацией; сочетание двух а сохраняет слоговую структуру еврейского имени.
- source_word: וְיִתְמָה
  choice: Итма
  rationale: Личное имя передано по масоретской форме; буква ת без дагеша здесь транслитерируется как т в естественной русской передаче.
- source_word: הַמּוֹאָבִי
  choice: моавитянин
  rationale: Этноним с определённым артиклем служит характеристикой Итмы; русское «моавитянин» является обычной и ясной формой.
