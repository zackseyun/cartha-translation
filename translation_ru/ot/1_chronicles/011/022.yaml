  text: בְּנָיָ֨ה בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חַ֛יִל רַב פְּעָלִ֖ים מִֽן קַבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִיאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת הָ/אֲרִ֛י בְּ/ת֥וֹךְ הַ/בּ֖וֹר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: ru
  text: Ванея, сын Иодая, сына доблестного мужа из Кавцеила, совершившего множество подвигов, сразил двух моавских героев[a]. Он также спустился в яму и сразил там льва в снежный день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение еврейского выражения אֲרִיאֵל מוֹאָב неясно. Возможные переводы: «двух сыновей Ариила, моавитянина», «двух Ариилов Моава» или «двух львоподобных героев Моава».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חַיִל
  choice: доблестного мужа
  rationale: В воинском контексте выражение обозначает человека силы, доблести и испытанной храбрости; «доблестный муж» сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: רַב פְּעָלִים
  choice: прославленного многими подвигами
  rationale: Буквально — «многих деяний» или «великий делами». Контекст перечня воинов позволяет естественно передать речь о многочисленных выдающихся подвигах, не уточняя их характер сверх текста.
- source_word: מִן קַבְצְאֵל
  choice: из Кавцеила
  rationale: Предлог מן указывает на происхождение; «из» прямо и естественно передаёт это значение.
- source_word: הִכָּה
  choice: сразил
  rationale: Глагол נכה означает «поразить, сразить» и в данном повествовании, вероятно, подразумевает убийство. «Сразил» сохраняет широту исходного глагола и подходит к героико-воинскому контексту.
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: двух моавских героев[a]
  rationale: Значение אֲרִיאֵל здесь неясно. Контекст поддерживает обозначение выдающихся воинов, однако возможны и понимания, связанные с именем Ариил; поэтому неоднозначность отмечена сноской.
- source_word: יָרַד
  choice: спустился в яму
  rationale: Глагол означает «спуститься». Направление «в яму» естественно восстанавливается по следующему указанию места и делает русскую фразу ясной.
- source_word: הָאֲרִי
  choice: льва
  rationale: Существительное однозначно обозначает льва.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: в яму … там
  rationale: Исходное выражение указывает на нахождение внутри ямы. В русском перестройка «спустился в яму и … там» ясно сохраняет пространственный образ без тяжеловесного «посреди ямы».
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: в снежный день
  rationale: Идиоматическая передача буквального «в день снега», сохраняющая обстоятельство события.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной лексикой, уместной для перечня воинских подвигов. Синтаксис слегка перестроен ради ясности: определение отца Ванеи оформлено отдельным сказуемым, а местонахождение льва передано через «в яму … там». Текст сохраняет неопределённость спорного אֲרִיאֵל посредством сноски.'
