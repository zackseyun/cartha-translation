base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: ru
  text: И Давид становился всё более великим[a], и Яхве Воинств был с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Давид шёл, идя и становясь великим»; это еврейская идиома, обозначающая постепенное возрастание его величия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: становился всё могущественнее и могущественнее
  rationale: Вся конструкция представляет собой еврейскую идиому постепенного усиления, а не буквального движения. «Становился» естественно передаёт развитие состояния; «могущественнее» в контексте царского возвышения точнее, чем общее «больше».
- source_word: דָּוִיד
  choice: Давид
  rationale: Устоявшаяся русская форма личного имени.
- source_word: וַיהוָה צְבָאוֹת
  choice: и Яхве Воинств
  rationale: Союз ו передан нейтральным «и», без добавления причинного смысла. Имя יהוה транслитерировано как «Яхве», а צְבָאוֹת сохранено в составе традиционно понятного божественного титула.
- source_word: עִמּוֹ
  choice: был с ним
  rationale: Прямо передаёт присутствие и поддержку, не сводя выражение лишь к значению «был на его стороне».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Связь между возвышением Давида и присутствием Яхве
  choice: и
  alternative: потому что
  rationale: Еврейский ו формально соединяет части стиха и сам по себе не требует явной причинной связи; перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Архаизмы сведены к минимуму; необычный титул «Яхве Воинств» сохранён ради прозрачности исходного образа.
