  text: וַ/יִּֽתְיַצְּב֤וּ בְ/תוֹךְ הַ/חֶלְקָה֙ וַ/יַּצִּיל֔וּ/הָ וַ/יַּכּ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יּ֥וֹשַׁע יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: ru
  text: Они встали посреди участка, отстояли его и поразили филистимлян. И Яхве даровал великую победу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил великое избавление»; или: «даровал великое спасение».'
    reason: Лексема תְּשׁוּעָה может обозначать победу, избавление или спасение; контекст не устраняет полностью эти смысловые оттенки.
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: они встали
  rationale: Возвратная порода глагола יצב обозначает намеренно занять позицию и стоять на ней; в военном контексте «встали» естественно передаёт этот смысл, не добавляя отсутствующего в тексте наречия.
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: посреди участка
  rationale: תוך означает «среди, посреди», а חלקה — отдельный участок земли; «участок» сохраняет сельскохозяйственный и пространственный смысл.
- source_word: וַיַּצִּילוּהָ
  choice: отстояли его
  rationale: נצל означает избавлять или спасать. Поскольку объектом служит земельный участок, «отстояли его» естественно выражает его спасение от захвата в данном военном контексте.
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: поразили филистимлян
  rationale: נכה в повествовании о сражении означает нанести удар или разгромить; традиционное и понятное «поразили» сохраняет силу глагола без уточнения, что каждый противник был убит.
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: Яхве даровал великую победу
  rationale: Конструкция сочетает однокоренные формы ישׁע и תשועה и означает, что Яхве совершил великое избавление или даровал победу. В контексте битвы «даровал великую победу» ясно и естественно передаёт результат, не вводя отсутствующего прямого дополнения «их».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и соответствует предоставленному принципу перевода.
- issue: Значение תְּשׁוּעָה в военном контексте
  choice: великая победа
  alternative: великое избавление; великое спасение
  rationale: Слово допускает значения спасения, избавления и победы. Здесь речь идёт о сражении с филистимлянами, поэтому «победа» передаёт непосредственный контекст, а другие возможные оттенки сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным звучанием. Сохранено множественное число еврейских глаголов и не добавлен явно не выраженный объект при וַיּוֹשַׁע. Маркер примечания поставлен при неоднозначной заключительной фразе.
