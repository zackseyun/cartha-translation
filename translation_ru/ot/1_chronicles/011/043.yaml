lexical_decisions:
- source_word: חָנָן
  choice: Ханан
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: Стандартное обозначение родства в перечне имён.
- source_word: מַעֲכָה
  choice: Маахи
  rationale: Имя מַעֲכָה передано как «Мааха» и поставлено в родительный падеж после слова «сын».
- source_word: וְיוֹשָׁפָט
  choice: и Иошафат
  rationale: Союз וְ передан как «и», а личное имя יוֹשָׁפָט — непосредственно по краткой еврейской форме, без подмены более полной формой «Иосафат».
- source_word: הַמִּתְנִי
  choice: из Митни
  rationale: Еврейское относительное обозначение, вероятно указывающее на место или род, естественно передано по-русски конструкцией «из Митни»; неопределённость между местом и кланом сохраняется.
