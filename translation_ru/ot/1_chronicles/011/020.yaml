base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: ru
  text: Авесса, брат Иоава, был предводителем Троих[a]. Он поднял копьё против трёхсот и поразил их; он обрёл славу среди Троих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «трёх». В параллельном месте (2 Цар. 23:18) и в перечнях воинов Давида существуют текстологические и контекстуальные трудности, связанные с чтениями «три» и «тридцать».'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «у него было имя среди Троих», то есть он был известен среди них. В согласном написании (кетив) стоит «не было имени», тогда как предписываемое чтение (кере) — «у него было имя».'
    reason: textual_variant
lexical_decisions:
- source_word: רֹאשׁ
  choice: предводителем
  rationale: В военном контексте слово обозначает начальника или руководителя; «предводитель» естественно передаёт положение Авессы во главе группы.
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: Троих / среди Троих
  rationale: Масоретский текст дважды содержит форму «три». Сочетание передано как название определённой группы воинов без согласования с параллельным местом, где существует текстовая трудность между «тремя» и «тридцатью».
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: поднял своё копьё
  rationale: Буквально глагол означает «пробудил, привёл в движение»; в военном контексте выражение описывает применение копья. «Поднял своё копьё» сохраняет образ и звучит естественно по-русски.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: против трёхсот человек и сразил их
  rationale: חָלָל обозначает убитого или поражённого. Русская формулировка ясно выражает результат подвига, избегая неестественного сочетания «против трёхсот убитых».
- source_word: שֵׁם
  choice: прославился
  rationale: Идиома «иметь имя» означает обладать известностью или славой. «Прославился» естественно передаёт этот смысл в современном русском языке.
- source_word: אַבְשַׁי
  choice: Авесса
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: אֲחִי יוֹאָב
  choice: брат Иоава
  rationale: Прямая и естественная передача еврейской конструкции принадлежности.
theological_decisions:
- issue: Соотношение «Троих» и «тридцати» в перечнях воинов Давида
  choice: Сохранено чтение масоретского текста «Троих»
  alternative: «тридцати» или «тридцати воинов»
  rationale: Данный еврейский текст дважды говорит о «трёх»; перевод не гармонизирует его с параллельными перечнями и сохраняет текстовую напряжённость в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Название воинской группы «Трое» оформлено с прописной буквы. Еврейские идиомы переданы понятно, а существенные текстовые особенности сохранены в примечаниях.
