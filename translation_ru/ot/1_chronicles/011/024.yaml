  text: אֵ֣לֶּה עָשָׂ֔ה בְּנָיָ֖הוּ בֶּן יְהוֹיָדָ֑ע וְ/ל/וֹ שֵׁ֖ם בִּ/שְׁלוֹשָׁ֥ה הַ/גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: ru
  text: Вот что совершил Ванея, сын Иодая, и он прославился среди трёх могучих воинов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и у него было имя среди трёх могучих воинов».'
    reason: Сноска сохраняет прозрачность еврейской идиомы וְלוֹ שֵׁם, которая в основном тексте естественно передана как «он прославился».
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Вот что совершил
  rationale: Сочетание указывает на только что перечисленные подвиги и подводит им итог; «вот что совершил» естественно передаёт эту отсылку и более достойно звучит по-русски, чем буквальное «это сделал».
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Ванея, сын Иодая
  rationale: Использованы традиционные русские библейские формы имён, узнаваемые читателями; конструкция родства передана прямо.
- source_word: וְלוֹ שֵׁם
  choice: и он прославился
  rationale: 'Буквально: «и у него было имя»; в данном контексте идиома означает известность и славу. Естественный русский глагол передаёт смысл без неясного калькирования.'
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: среди трёх могучих воинов
  rationale: Предлог ב передаёт положение или известность в кругу трёх; גִּבֹּרִים здесь обозначает выдающихся воинов Давида, а определение «могучих» сохраняет силу исходного обозначения.
