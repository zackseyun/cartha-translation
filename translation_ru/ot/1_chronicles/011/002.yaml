  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: ru
  text: 'Уже в прежние времена[a], ещё при царе Сауле, ты выводил и приводил Израиль[b]. И Яхве, твой Бог, сказал тебе: «Ты будешь пасти Мой народ, Израиль, и станешь правителем[c] Моего народа, Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «также вчера, также третьего дня», то есть «вчера и позавчера»; еврейское выражение означает «прежде», «в прежние времена».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «выводить и приводить» означает руководить народом, особенно ведя его в поход и возвращая обратно.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вождём», «предводителем». Здесь употреблено не обычное еврейское слово «царь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: И прежде
  rationale: Еврейское сочетание буквально говорит о «вчера и третьего дня», но употреблено как устойчивое обозначение прежних времён. «И прежде» естественно передаёт смысл и связывает стих с предшествующим контекстом.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: ещё когда Саул был царём
  rationale: Предлог ב при инфинитивной конструкции образует временное придаточное; «ещё» уместно передаёт усилительное גַּם и подчёркивает, что это происходило уже при царствовании Саула.
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: ты выводил и вводил Израиль
  rationale: Сохранён образ исходного выражения о выведении и введении народа; в данном контексте это обозначает фактическое руководство Израилем, в том числе в походах.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אַתָּה תִרְעֶה אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: Ты будешь пасти Мой народ Израиль
  rationale: Глагол רעה сохраняет пастырский образ царского руководства; «пасти» передаёт метафору непосредственно и понятно.
- source_word: נָגִיד
  choice: правитель
  rationale: נָגִיד обозначает поставленного руководителя или правителя, но не совпадает с обычным словом «царь» (מֶלֶךְ); перевод сохраняет это различие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. «Яхве» сохраняет его как имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Пастырская метафора תִרְעֶה
  choice: будешь пасти
  alternative: будешь вести; будешь править
  rationale: Буквальная пастырская метафора существенна для библейского образа царской власти и не должна сводиться к общему обозначению управления.
- issue: Значение נָגִיד
  choice: правитель
  alternative: вождь; князь; предводитель
  rationale: Выбрано широкое обозначение поставленного над народом руководителя без отождествления термина с מֶלֶךְ («царь»).
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены пастырская метафора, образ «выводить и вводить» и различие между «царём» и поставленным «правителем»; архаизмы и конфессионально окрашенные формулы не вводились.
