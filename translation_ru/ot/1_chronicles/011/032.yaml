  text: חוּרַי֙ מִ/נַּ֣חֲלֵי גָ֔עַשׁ אֲבִיאֵ֖ל הָ/עַרְבָתִֽיס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/032.yaml
  text: Hurai from the wadis of Gaash[b][a], Abiel the Arbathite.
translation:
  language: ru
  text: Хурай из ущелий Гааша[a], Авиил арбатянин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из долин Гааша»; еврейское слово может обозначать ущелье, овраг, долину или русло сезонного потока.'
    reason: lexical_alternative
  - marker: b
    text: То есть человек из Арбата; точное местонахождение этой местности неизвестно, и, возможно, её название связано с Аравой.
    reason: cultural_note
lexical_decisions:
- source_word: חוּרַי
  choice: Хурай
  rationale: Личное имя передано транслитерацией в форме, естественной для русской библейской традиции и соответствующей еврейскому звучанию.
- source_word: מִנַּחֲלֵי
  choice: из ущелий
  rationale: נַחַל может обозначать русло сезонного потока, овраг, ущелье или долину. Во множественном числе «из ущелий» естественно передаёт географический смысл, не создавая впечатления постоянных водотоков.
- source_word: גָעַשׁ
  choice: Гааша
  rationale: Географическое название транслитерировано; родительный падеж требуется русским управлением.
- source_word: אֲבִיאֵל
  choice: Авиил
  rationale: Личное имя транслитерировано с учётом принятой русской библейской передачи семитского элемента אב как «ав».
- source_word: הָעַרְבָתִי
  choice: арбатянин
  rationale: Прилагательное происхождения передано русским обозначением жителя или уроженца местности Арбат, без отождествления её с Аравой.
