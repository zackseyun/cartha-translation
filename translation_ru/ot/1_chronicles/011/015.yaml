base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: ru
  text: Тогда трое из тридцати главных воинов спустились к скале[a], к Давиду, к пещере Адуллам, а филистимский лагерь стоял в долине Рефаим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «трое из тридцати главных воинов спустились на скалу к Давиду, к пещере Адуллам». Еврейская конструкция сжата; в основном тексте «к скале» передаёт возможное направительное значение предлога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: спустились
  rationale: Глагол ירד в повествовательной форме обозначает движение вниз; «спустились» естественно и сохраняет направление.
- source_word: שְׁלוֹשָׁה מִן־הַשְּׁלוֹשִׁים רֹאשׁ
  choice: трое из тридцати предводителей
  rationale: Сочетание указывает на трёх ведущих воинов из известной группы тридцати; «предводителей» передаёт значение רֹאשׁ, не приписывая им конкретного воинского звания.
- source_word: עַל־הַצּוּר
  choice: к скале
  rationale: Предлог עַל при глаголе движения допускает направительное значение «к/на»; «к скале» сохраняет конкретный топографический образ и естественно звучит по-русски.
- source_word: אֶל־דָּוִיד אֶל־מְעָרַת עֲדֻלָּם
  choice: к Давиду, находившемуся у пещеры Адуллам
  rationale: Дважды употреблённое אֶל буквально обозначает движение «к Давиду, к пещере»; причастный оборот ясно передаёт, что пещера указывает на местонахождение Давида, не устраняя сжатость еврейской конструкции без примечания.
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: а филистимский лагерь стоял
  rationale: Причастие חֹנָה описывает фоновое, продолжающееся расположение лагеря; «стоял» — естественное русское выражение о лагере.
- source_word: בְּעֵמֶק רְפָאִים
  choice: в долине Рефаим
  rationale: Географическое название передано традиционной русской транслитерацией; родовой термин «долина» пишется со строчной буквы.
