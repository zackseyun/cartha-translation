revisions:
- from: Тогда трое из тридцати предводителей спустились к скале[a], к Давиду, находившемуся у пещеры Адуллам, а филистимский лагерь стоял в долине Рефаим.
  to: Тогда трое из тридцати главных воинов спустились к скале[a], к Давиду, к пещере Адуллам, а филистимский лагерь стоял в долине Рефаим.
  rationale: Исправление сохраняет направленность обоих употреблений אֶל («к Давиду, к пещере Адуллам») и не добавляет утверждения, что Давид находился именно возле, а не в пещере. «Главных воинов» точнее обозначает статус трёх в составе «тридцати», сохраняя отсутствие специально названного воинского титула. Альтернатива при עַל־הַצּוּר сохранена в сноске.
