  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: ru
  text: Из троих он был почитаем больше, чем двое других, и стал их начальником; однако до уровня Троих он не дошёл.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза в начале стиха сжата и допускает иной синтаксический разбор, при котором сопоставляются «трое» и «двое». Общий смысл, вероятно, таков: он занимал особо почётное место в своей группе, но всё же не достиг положения Троих.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: Среди троих… большим почётом, чем двое других
  rationale: 'Еврейская сравнительная конструкция предельно сжата и допускает разные разборы. Этот вариант естественно передаёт наиболее вероятный смысл: в данной тройке он превосходил почётом двух остальных, не устраняя отмеченную в сноске текстовую трудность.'
- source_word: נִכְבָּד
  choice: пользовался большим почётом
  rationale: Нифаль глагола כבד здесь указывает на почёт и высокое положение; сравнительный контекст требует выражения «большим… чем».
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: и стал их предводителем
  rationale: שַׂר обозначает начальника или военного предводителя. «Предводитель» ясно и достойно звучит в контексте отряда воинов, не внося более поздней военной терминологии.
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: однако с Тремя он не сравнялся
  rationale: Сочетание בוא с עַד выражает достижение уровня или положения. «Не сравнялся» естественно передаёт, что он не достиг статуса знаменитой высшей тройки; прописная буква показывает употребление «Трое» как обозначения известной группы.
