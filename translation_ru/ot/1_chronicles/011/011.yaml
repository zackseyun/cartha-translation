  source_fidelity: 'В черновике верно переданы перечень, принадлежность воинов Давиду, звание и число «триста». Однако «и поразил их» добавляет явно выраженное утверждение, которого в данной сжатой еврейской конструкции нет: текст называет «триста убитых/павших», не формулируя отдельным глаголом «он поразил их». Имя חַכְמוֹנִי также следует передать с начальным «Х» и без необоснованного русифицирующего родительного окончания.'
