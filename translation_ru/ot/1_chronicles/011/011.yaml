base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: ru
  text: 'Вот перечень[a] храбрых воинов Давида: Яшовеам, сын Хахмони, глава Тридцати[b]. Он поднял своё копьё против трёхсот павших в одном случае[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «число» или «счёт». По контексту речь идёт о перечне воинов.'
    reason: lexical_alternative
  - marker: b
    text: Так в еврейском тексте; написание слова «Тридцать» необычно. Некоторые древние свидетельства и параллельное место во 2 Цар. 23:8 допускают иное понимание названия или состава этого отряда.
    reason: textual_ambiguity
  - marker: c
    text: 'Еврейская фраза буквально и очень сжато говорит, что он «поднял своё копьё против трёхсот убитых за один раз». Глагол можно также передать: «поднял», «взмахнул» или «орудовал» своим копьём; точная связь действия с обозначением «убитых» выражена неразвёрнуто.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: перечень
  rationale: Хотя основное значение — «число, счёт», здесь слово вводит список названных по имени воинов; «перечень» естественно передаёт контекстуальную функцию.
- source_word: הַגִּבֹּרִים אֲשֶׁר לְדָוִיד
  choice: храбрых воинов Давида
  rationale: גִּבּוֹר обозначает сильного, доблестного человека или воина; сочетание «храбрые воины» ясно передаёт военный контекст, а родительный падеж выражает их принадлежность к окружению Давида.
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: Иашовам, сын Ахмония
  rationale: Имена переданы традиционной русской библейской транслитерацией; явное указание на происхождение сохранено.
- source_word: רֹאשׁ הַשלושים
  choice: глава Тридцати
  rationale: רֹאשׁ в обозначении ранга значит «глава, начальник»; «Тридцать» сохранено как название отряда, хотя написание в масоретском тексте представляет текстологическую трудность.
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: поднял своё копьё
  rationale: Буквально глагол означает «пробудить, поднять, привести в действие». В сочетании с копьём выражение описывает военное действие; «поднял» сохраняет образ и не уточняет способ применения сверх исходного текста.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: против трёхсот и поразил их
  rationale: עַל указывает на направленность действия против врагов, а חָלָל — на убитых или поражённых насмерть. Русская конструкция разворачивает предельно сжатую еврейскую фразу, не превращая уже убитых в объект нападения.
- source_word: בְּפַעַם אֶחָת
  choice: за один раз
  rationale: Выражение буквально означает «за один раз / в один раз» и указывает на одно событие, не подразумевая одного физического удара.
