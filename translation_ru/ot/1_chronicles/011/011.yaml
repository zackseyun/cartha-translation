  terminology: «Храбрые воины», «глава Тридцати» и «копьё» уместны. «Тридцать» следует сохранить с прописной буквы как обозначение группы; примечание об особенностях еврейского текста оправдано. Имя передано как «Яшовеам, сын Хахмони».
