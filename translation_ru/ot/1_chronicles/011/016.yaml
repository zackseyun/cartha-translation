  text: וְ/דָוִ֖יד אָ֣ז בַּ/מְּצוּדָ֑ה וּ/נְצִ֣יב פְּלִשְׁתִּ֔ים אָ֖ז בְּ/בֵ֥ית לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/016.yaml
  text: David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
translation:
  language: ru
  text: Давид был тогда в укреплении[a], а филистимский гарнизон[b] находился тогда в Вифлееме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в крепости».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать также военный пост или поставленного начальника; здесь по контексту имеется в виду филистимская военная сила в Вифлееме.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצוּדָה
  choice: укрепление
  rationale: Слово обозначает укреплённое, пригодное для обороны место или убежище. «Укрепление» естественно звучит в данном военном контексте и не уточняет без достаточных оснований конкретный вид сооружения.
- source_word: נְצִיב
  choice: гарнизон
  rationale: В сочетании с указанием на филистимлян и местонахождением в Вифлееме слово здесь вероятнее всего обозначает размещённую там военную силу или пост, а не гражданского правителя.
- source_word: פְּלִשְׁתִּים
  choice: филистимский
  rationale: Общепринятое русское обозначение народа передано прилагательным, естественным в сочетании «филистимский гарнизон».
- source_word: בְּבֵית לָחֶם
  choice: в Вифлееме
  rationale: Предлог בְּ выражает местонахождение; «в Вифлееме» — естественная русская передача названия города.
- source_word: אָז ... אָז
  choice: тогда ... тогда
  rationale: Повтор временного наречия сохранён, чтобы передать параллельное построение и акцент исходного текста.
- source_word: וְדָוִיד
  choice: Давид
  rationale: Начальный וְ связывает предложение с повествованием, но отдельный русский союз здесь не обязателен; отсутствие вводного «и» или «а» даёт естественное начало стиха без добавления невыраженного «теперь».
