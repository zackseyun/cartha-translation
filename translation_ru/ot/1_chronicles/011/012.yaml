  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: ru
  text: После него — Елеазар, сын Додо, ахохитянина; он был одним из трёх могучих воинов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди трёх могучих воинов». Еврейское выражение указывает на принадлежность к этой группе из трёх.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: После него
  rationale: Оборот обозначает следующее лицо в перечне; начальный союз естественно не воспроизводить отдельно по-русски.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Традиционная русская передача еврейского личного имени.
- source_word: בֶּן דּוֹדוֹ
  choice: сын Додо
  rationale: בֶּן здесь естественно указывает на непосредственное сыновство, а форму имени דּוֹדוֹ следует сохранить как Додо, не заменяя вариантом Додай.
- source_word: הָאֲחוֹחִי
  choice: ахохитянин
  rationale: Родовое или клановое обозначение передано транслитерацией в естественной для русского языка форме.
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: одним из трёх могучих воинов
  rationale: Предлог בְּ с числительным выражает принадлежность к известной тройке; גִּבּוֹרִים в данном воинском перечне обозначает прославленных сильных воинов.
