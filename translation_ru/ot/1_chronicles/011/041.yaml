lexical_decisions:
- source_word: אֽוּרִיָּה
  choice: Урия
  rationale: Традиционная русская передача еврейского личного имени; соответствует современному библейскому употреблению.
- source_word: הַ/חִתִּי
  choice: хеттеянин
  rationale: Этноним с определённым артиклем, указывающий на происхождение Урии; «хеттеянин» — ясная и устоявшаяся русская форма.
- source_word: זָבָד
  choice: Завад
  rationale: Транслитерация личного имени с учётом еврейского согласного ב без дагеша, произносимого как /v/.
- source_word: בֶּן
  choice: сын
  rationale: Естественная русская передача отношения непосредственного сыновства в родословном перечне.
- source_word: אַחְלָי
  choice: Ахлай
  rationale: Транслитерация еврейского личного имени в форме, близкой к источнику и понятной русскому читателю.
