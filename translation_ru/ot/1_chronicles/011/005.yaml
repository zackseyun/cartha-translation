base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: ru
  text: 'Жители Иевуса сказали Давиду: «Ты сюда не войдёшь».[a] Но Давид захватил крепость Сион — это и есть город Давида.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ты сюда не придёшь»; по смыслу это отказ впустить Давида: «Ты сюда не войдёшь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: жители Иевуса
  rationale: Конструктивное сочетание буквально обозначает живущих в Иевусе; «жители Иевуса» естественно и точно передаёт собирательный смысл.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Ты сюда не войдёшь
  rationale: 'Буквально: «ты не придёшь сюда», но в контексте отказа впустить русский глагол «войти» естественно передаёт смысл и сохраняет прямую, вызывающую реплику.'
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: В военном контексте глагол означает взятие или захват укреплённого места.
- source_word: מְצֻדַת צִיּוֹן
  choice: крепость Сион
  rationale: מְצוּדָה обозначает крепость или укреплённое место; «крепость» — ясный и обычный русский эквивалент.
- source_word: הִיא עִיר דָּוִיד
  choice: это и есть город Давида
  rationale: Местоименная именная конструкция отождествляет крепость Сион с городом Давида; оборот «это и есть» естественно выражает пояснительно-идентифицирующий смысл.
