- source_word: נָתָן
  choice: Нафан
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: מִבְחָר
  choice: Мивхар
  rationale: Личное имя транслитерировано с сохранением согласного ח посредством «х».
- source_word: בֶּן
  choice: сын
  rationale: Обычное обозначение непосредственного сыновства в перечне имён; контекст не требует более широкого «потомок».
- source_word: הַגְרִי
  choice: Хагри
  rationale: В основном тексте форма истолкована как личное имя после слова «сын»; возможное понимание как этнико-родового обозначения вынесено в примечание.
