  text: וְ/הֽוּא הִכָּה֩ אֶת הָ/אִ֨ישׁ הַ/מִּצְרִ֜י אִ֥ישׁ מִדָּ֣ה חָמֵ֣שׁ בָּ/אַמָּ֗ה וּ/בְ/יַ֨ד הַ/מִּצְרִ֤י חֲנִית֙ כִּ/מְנ֣וֹר אֹרְגִ֔ים וַ/יֵּ֥רֶד אֵלָ֖י/ו בַּ/שָּׁ֑בֶט וַ/יִּגְזֹ֤ל אֶֽת הַ/חֲנִית֙ מִ/יַּ֣ד הַ/מִּצְרִ֔י וַ/יַּהַרְגֵ֖/הוּ בַּ/חֲנִיתֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: ru
  text: Он сразил египтянина — человека ростом в пять локтей[a][b]. В руке у египтянина было копьё, словно перекладина ткацкого станка. Он сошёл к нему с посохом[c], вырвал копьё из руки египтянина и убил его его же копьём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека меры»; возможно также: «человека огромного роста, ростом в пять локтей».'
    reason: lexical_alternative
  - marker: b
    text: Локоть — древняя мера длины, приблизительно равная расстоянию от локтя до кончиков пальцев.
    reason: cultural_note
  - marker: c
    text: 'Или: «с палкой» либо «с дубиной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: сразил
  rationale: Глагол נכה обозначает нанесение удара или поражение противника. «Сразил» передаёт боевой контекст, но не заменяет последующий явный глагол «убил».
- source_word: הָאִישׁ הַמִּצְרִי
  choice: египтянина
  rationale: Естественная русская передача обозначения человека по его происхождению; отдельное слово «мужчина» здесь избыточно.
- source_word: אִישׁ מִדָּה חָמֵשׁ בָּאַמָּה
  choice: человека ростом в пять локтей
  rationale: Передаёт указанную высоту ясным современным языком, сохраняя древнюю единицу измерения. Необычное буквальное выражение «человек меры» отмечено в сноске.
- source_word: חֲנִית
  choice: копьё
  rationale: По контексту это крупное древковое оружие; «копьё» точно и понятно современному читателю.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: словно перекладина ткацкого станка
  rationale: Сравнение подчёркивает массивность древка. «Перекладина ткацкого станка» понятнее современному читателю, чем традиционное, но малознакомое «ткацкий навой».
- source_word: וַיֵּרֶד אֵלָיו
  choice: сошёл к нему
  rationale: Сохраняет конкретный глагол движения ירד и не добавляет отсутствующего в тексте толкования вроде «напал» или «выступил против».
- source_word: בַּשָּׁבֶט
  choice: с посохом
  rationale: שבט может означать посох, палку, жезл или дубину. «Посох» сохраняет нейтральный образ простого деревянного предмета в противопоставлении копью; варианты указаны в сноске.
- source_word: וַיִּגְזֹל
  choice: вырвал
  rationale: Глагол выражает насильственное отнятие; «вырвал из руки» естественно передаёт стремительность схватки.
- source_word: וַיַּהַרְגֵהוּ
  choice: убил его
  rationale: Это явный глагол убийства; современная и недвусмысленная передача.
- source_word: בַּחֲנִיתוֹ
  choice: его же копьём
  rationale: Местоименный суффикс естественно относится к копью египтянина, только что вырванному из его руки. Частица «же» ясно передаёт этот референт и иронию развязки.
