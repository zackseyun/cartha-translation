lexical_decisions:
- source_word: אֲחִיאָם
  choice: Ахиам
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: В перечне воинов слово естественнее всего обозначает непосредственное сыновство; более широкое значение родства отмечено в сноске.
- source_word: שָׂכָר
  choice: Сахар
  rationale: Личное имя транслитерировано с учётом еврейской согласной שׂ и сложившейся русской библейской формы.
- source_word: הֲרָרִי
  choice: хараритянин
  rationale: Форма передана как географическое или родовое обозначение, без попытки уточнить неизвестный топоним либо истолковать её как «горец».
- source_word: אֱלִיפַל
  choice: Елифал
  rationale: Личное имя передано естественной русской библейской транслитерацией.
- source_word: אֽוּר
  choice: Ур
  rationale: В данном контексте это личное имя, а не название месопотамского города.
