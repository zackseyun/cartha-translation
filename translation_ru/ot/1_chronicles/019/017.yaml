base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: ru
  text: Когда об этом сообщили Давиду, он собрал весь Израиль, перешёл Иордан, выступил против них и выстроил войска против них. Затем Давид выстроил войска для битвы с Арамом, и они сразились с ним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они воевали против него». В еврейском тексте буквально стоит «с ним»; здесь по контексту речь идёт о сражении против Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: Когда об этом сообщили Давиду
  rationale: Безличная конструкция сохраняет пассивный смысл и не вводит не названного в тексте сообщающего; «об этом» естественно отсылает к предыдущему событию.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: он собрал весь Израиль
  rationale: Передаёт как обычное значение אָסַף, так и подразумеваемый военный сбор, не добавляя слова «войско» к самому названию Израиля.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: перешёл Иордан
  rationale: Краткое и естественное соответствие глаголу עבר с прямым дополнением.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: выступил против них
  rationale: Военный контекст придаёт בוא אל направленно-враждебный смысл; «выступил» передаёт движение к противнику без излишней конкретизации.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: построил войска против них
  rationale: В военном контексте ערך означает расположение сил в боевом порядке. Добавление «войска» делает эллиптическую еврейскую конструкцию понятной по-русски.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: Давид построил войска для битвы с Арамом
  rationale: Сохраняется повтор ערך и военное значение מִלְחָמָה; לִקְרַאת в данном контексте естественно передано как подготовка к столкновению с Арамом.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено древнее собственное имя, без замены более поздним географическим названием «Сирия» и без интерпретирующего перехода к «арамейцам».
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: они сразились с ним
  rationale: Русское «сразились с ним» естественно выражает враждебное столкновение и одновременно близко передаёт предлог עִם, буквально «с».
