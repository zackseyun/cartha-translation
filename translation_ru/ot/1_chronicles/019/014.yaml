  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: ru
  text: Иоав и люди, бывшие с ним, выступили на битву против Арама[a], арамеи обратились в бегство от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед Арамом»; в обстановке битвы это может означать также «навстречу Араму» или «против Арама».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: выступили
  rationale: Глагол נגשׁ означает приближение; в военном контексте «выступили» естественно передаёт движение навстречу сражению.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: и люди, бывшие с ним
  rationale: Сохраняет буквальное значение הָעָם «народ, люди», не сужая его без необходимости до «войска».
- source_word: לִפְנֵי אֲרָם
  choice: против Арама
  rationale: В контексте битвы пространственный оборот לִפְנֵי («перед, пред лицом») обозначает выступление навстречу силам Арама; буквальная форма отмечена в сноске.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено древнее собственное имя; «Сирия» было бы исторически менее точным, а «арамеи» заменило бы топоним этнонимом.
- source_word: לַמִּלְחָמָה
  choice: на битву
  rationale: Передаёт целевое значение предлога לְ и военный смысл מִלְחָמָה кратким литературным оборотом.
- source_word: וַיָּנוּסוּ
  choice: побежали
  rationale: נוס означает бегство, а не просто организованное отступление.
- source_word: מִפָּנָיו
  choice: от него
  rationale: Естественный русский эквивалент буквального «от его лица/присутствия»; местоимение относится к Иоаву.
