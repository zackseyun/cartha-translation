base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: ru
  text: Когда слуги Хададэзера увидели, что потерпели поражение перед Израилем, они заключили мир с Давидом и стали служить ему. И Арам больше не хотел помогать сынам Аммона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аммонитянам». Буквально: «сынам Аммона»; это этническое обозначение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: слуги
  rationale: В царско-политическом контексте слово обозначает подчинённых или вассалов Хададэзера; «слуги» сохраняет идею подчинения, не навязывая значения рабства.
- source_word: נִגְּפוּ
  choice: потерпели поражение
  rationale: Форма нифаль в военном контексте означает быть побеждёнными; это естественная и точная русская формулировка.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: перед Израилем
  rationale: Передаёт еврейскую идиому близко к форме источника и сохраняет возможный оттенок «от Израиля» без его излишнего уточнения.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: заключили мир с Давидом
  rationale: Конструкция означает установление мира или мирного соглашения; «заключили мир» естественно звучит в данном политическом контексте.
- source_word: וַיַּעַבְדֻהוּ
  choice: стали служить ему
  rationale: Глагол выражает последующее политическое подчинение Давиду; «стали» ясно передаёт наступившее вслед за миром состояние.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохранено древнее собственное имя, которое здесь употреблено как собирательное обозначение арамеев, без подмены позднейшим названием «Сирия».
- source_word: לְהוֹשִׁיעַ
  choice: помогать
  rationale: В контексте военного союза инфинитив означает приходить на помощь; «помогать» передаёт смысл без неуместного сотериологического оттенка.
- source_word: בְּנֵי עַמּוֹן
  choice: сынам Аммона
  rationale: Сохранён буквальный этноним «сыны Аммона»; в русском библейском повествовании он понятен и близок к исходной форме.
- source_word: וְלֹא אָבָה ... עוֹד
  choice: больше не хотел
  rationale: Сочетание отрицания, глагола желания/согласия и עוֹד выражает прекращение готовности оказывать помощь.
