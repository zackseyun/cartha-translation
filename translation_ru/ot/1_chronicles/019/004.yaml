  text: И Ханун взял слуг Давида[a], обрил их, обрезал их одежды до ягодиц, наполовину, и отпустил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном рассказе, во 2 Царств 10:4, уточняется, что Ханун сбрил половину бороды у каждого из них. В 1 Паралипоменон сказано только, что он «обрил их».
    reason: cross_reference
lexical_decisions:
- source_word: עַבְדֵי
  choice: слуг
  rationale: Существительное может обозначать слуг или рабов; здесь речь идёт о людях на царской службе, посланниках Давида, поэтому «слуг» точно передаёт контекст без необоснованного акцента на их правовом положении.
- source_word: וַיְגַלְּחֵם
  choice: обрил их
  rationale: В еврейском тексте объект бритья не назван. Формулировка сохраняет эту недосказанность и не переносит сюда уточнение о половине бороды из параллельного места во 2 Царств 10:4.
- source_word: מַדְוֵיהֶם
  choice: их одежды
  rationale: Слово обозначает одежду или одеяния; нейтральное «одежды» естественно по-русски и не уточняет без достаточных оснований вид облачения.
- source_word: בַּחֵצִי
  choice: наполовину
  rationale: Передаёт указание на отсечение половины одежды и соответствует краткой конструкции исходного текста.
- source_word: עַד הַמִּפְשָׂעָה
  choice: до ягодиц
  rationale: Редкое существительное указывает на заднюю часть тела, область ягодиц. Такой перевод конкретнее, чем «до бёдер», и сохраняет смысл намеренного публичного унижения.
- source_word: וַיְשַׁלְּחֵם
  choice: отпустил их
  rationale: В данном контексте глагол «послать» описывает удаление униженных посланников; «отпустил» звучит естественно и передаёт их отсылку прочь.
