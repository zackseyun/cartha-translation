base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: ru
  text: 'И сказал он: «Если Арам окажется сильнее меня, ты придёшь мне на помощь; а если аммонитяне окажутся сильнее тебя, я спасу тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק)
  choice: окажутся сильнее
  rationale: Конструкция חזק с מן выражает превосходство в силе в боевом контексте. Русское «окажутся сильнее» естественно передаёт условную ситуацию, не усиливая смысл до фактической победы.
- source_word: אֲרָם
  choice: арамеи
  rationale: Хотя буквально назван Арам, в данном военном контексте речь идёт о его войске; этноним «арамеи» естественнее по-русски и согласуется с участниками сражения.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: ты придёшь мне на помощь
  rationale: 'Буквально: «ты будешь мне для спасения/избавления». Русская военная идиома «прийти на помощь» ясно и естественно передаёт обещание выручить в бою.'
- source_word: תְּשׁוּעָה
  choice: помощь
  rationale: В непосредственном контексте сражения существительное обозначает конкретное избавление от опасности; «помощь» сохраняет практический военный смысл без неуместного богословского оттенка слова «спасение».
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Устойчивый русский этноним естественно передаёт буквально сказанное «сыны Аммона».
- source_word: וְהוֹשַׁעְתִּיךָ (ישע)
  choice: я приду на помощь тебе
  rationale: Порода hифиль глагола ישע означает спасти или избавить. В боевой ситуации эта формулировка передаёт конкретную взаимную поддержку и создаёт уместный параллелизм с первой половиной стиха.
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Стандартная передача древнееврейской повествовательной формы wayyiqtol, сохраняющая связь с предыдущим контекстом.
