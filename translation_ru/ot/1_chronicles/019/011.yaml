base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: ru
  text: Остальных воинов он передал под командование своего брата Авессы[a], и они выстроились навстречу аммонитянам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдал в руку Авессы, своего брата»; то есть поручил их его власти и командованию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: остальных воинов
  rationale: יֶתֶר означает «остаток, остальные», а הָעָם буквально — «народ»; в данном военном контексте речь идёт о воинах, оставшихся под началом Иоава.
- source_word: נָתַן בְּיַד
  choice: отдал под командование
  rationale: Буквально «дал в руку» — идиома, обозначающая передачу под власть или руководство другого человека.
- source_word: אַבְשַׁי אָחִיו
  choice: своего брата Авессы
  rationale: Сохранено указание на родство с Иоавом; использована укоренившаяся в русской библейской традиции форма имени «Авесса».
- source_word: וַיַּעַרְכוּ
  choice: они выстроились для сражения
  rationale: В военном контексте ערך означает построение войска в боевой порядок; выбран естественный современный русский оборот.
- source_word: לִקְרַאת
  choice: с ...
  rationale: לִקְרַאת буквально означает «навстречу, перед лицом»; в сочетании с глаголом боевого построения естественно передаётся как подготовка к сражению с противником.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитянами
  rationale: Буквальное «сыновья Аммона» является этнонимом; «аммонитяне» — нормативная русская передача.
