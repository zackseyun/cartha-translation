base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: ru
  text: И наняли они себе тридцать две тысячи колесниц[a], а также царя Маахи с его народом. Они пришли и расположились станом перед Медевой. Аммонитяне[b] же собрались из своих городов и выступили на битву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «колесницы» может здесь обозначать колесничное войско в целом, а не обязательно только число отдельных боевых повозок.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыновья Аммона» — обычное еврейское обозначение аммонитян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: наняли они себе
  rationale: Глагол שׂכר означает наём за плату, а לָהֶם выражает действие в собственных интересах; перевод не уточняет без прямого основания, были ли наняты именно наёмники.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: тридцать две тысячи колесниц
  rationale: Число передано в естественном русском порядке. רֶכֶב может обозначать как колесницы, так и колесничное войско в собирательном смысле; эта неоднозначность отмечена в сноске.
- source_word: מֶלֶךְ מַעֲכָה
  choice: царя Маахи
  rationale: Сопряжённая конструкция обозначает царя области или государства Мааха; русское склонение топонима даёт форму «Маахи».
- source_word: עַמּוֹ
  choice: его народом
  rationale: עַם буквально означает «народ». Военный контекст допускает значение войска, но основной текст не сужает смысл.
- source_word: לִפְנֵי מֵידְבָא
  choice: перед Медевой
  rationale: לִפְנֵי здесь выражает пространственное положение перед городом или напротив него; «перед Медевой» естественно и сохраняет эту широту.
- source_word: בְנֵי עַמּוֹן
  choice: Аммонитяне
  rationale: Буквально «сыновья Аммона» — обычное древнееврейское этническое обозначение. В современном русском «аммонитяне» ясно и естественно передаёт весь народ.
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם
  choice: собрались из своих городов
  rationale: Нифаль от אסף передаёт собирание или сосредоточение; предлог מִן обозначает выход из городов, откуда они собрались.
- source_word: וַיָּבֹאוּ לַמִּלְחָמָה
  choice: выступили на битву
  rationale: Буквально «пришли на войну/битву»; в данном контексте русское «выступили на битву» естественно передаёт движение к боевому столкновению.
