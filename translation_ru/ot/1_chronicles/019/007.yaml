  source_fidelity: 'Перевод точно передаёт последовательность и основные элементы еврейского текста: наём тридцати двух тысяч колесниц и царя Маахи с его народом, прибытие и стоянку перед Медевой, а затем сбор аммонитян из их городов и их выход к битве. «Выступили на битву» является естественным русским соответствием для «пришли к/на войну» в данном военном контексте и не вносит существенного дополнительного смысла.'
