base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: ru
  text: Когда аммонитяне увидели, что арамеи обратились в бегство, они тоже бежали перед Авессой, братом Иоава[a], и вошли в город. Затем Иоав пришёл в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед Авессой, его братом»; по контексту имеется в виду брат Иоава.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Еврейское выражение буквально означает «сыновья Аммона», но обозначает народ; современный русский этноним передаёт смысл естественно и точно.
- source_word: רָאוּ כִּי נָס
  choice: увидели, что … бежали
  rationale: כִּי вводит содержание восприятия, а перфект נָס представляет бегство арамейских сил как уже замеченный факт.
- source_word: אֲרָם
  choice: арамеи
  rationale: Название «Арам» употреблено собирательно применительно к арамейскому войску; форма «арамеи» ясна по-русски и не подменяет древний этноним традиционным «сирийцы».
- source_word: וַיָּנוּסוּ גַם הֵם
  choice: они тоже побежали
  rationale: Передаёт развитие повествования и подчёркнутое уподобление бегству арамеев.
- source_word: מִפְּנֵי
  choice: от
  rationale: В военном контексте выражение обозначает бегство от наступающего противника; это наиболее естественная русская формулировка.
- source_word: אַבְשַׁי אָחִיו
  choice: Авессы, брата Иоава
  rationale: Местоименный суффикс естественнее всего относится к Иоаву; явное имя устраняет неестественную для русского текста двусмысленность, сохраняя контекстуальный смысл.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: укрылись в городе
  rationale: Направительная форма означает движение в город; в контексте военного отступления «укрылись» естественно выражает цель входа, хотя сам глагол буквально означает «вошли».
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: После этого Иоав пришёл в Иерусалим
  rationale: Сохраняет последовательность повествования и не добавляет значения «вернулся», отсутствующего в самом глаголе.
