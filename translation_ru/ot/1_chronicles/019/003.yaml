base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: ru
  text: 'Но князья аммонитян сказали Хануну: «Неужели Давид, по-твоему[a], чтит твоего отца, раз послал к тебе утешителей? Не для того ли пришли к тебе его слуги, чтобы исследовать, ниспровергнуть[b] и разведать страну?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоих глазах». Еврейское выражение указывает на восприятие или суждение Хануна.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перевернуть». Еврейский глагол может означать «перевернуть, опрокинуть»; здесь он, вероятно, подразумевает враждебное ниспровержение или подрыв.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: князья
  rationale: Обозначает высокопоставленных правителей или придворных сановников; «князья» сохраняет высокий политический ранг и соответствует придворному контексту.
- source_word: הַמְכַבֵּד
  choice: чтит
  rationale: Форма от כבד означает оказывать честь или проявлять уважение; «чтит» естественно передаёт предполагаемое почтение Давида к отцу Хануна.
- source_word: בְּעֵינֶיךָ
  choice: по-твоему
  rationale: Еврейская идиома буквально означает «в твоих глазах» и указывает на восприятие или суждение Хануна. «По-твоему» естественно передаёт её функцию в русском вопросе.
- source_word: מְנַחֲמִים
  choice: утешителей
  rationale: Причастие от נחם обозначает людей, посланных выразить утешение после смерти близкого; существительное «утешители» кратко и точно сохраняет эту роль.
- source_word: בַּעֲבוּר
  choice: для того… чтобы
  rationale: В данном месте предлог вводит цель прихода слуг; русская конструкция ясно выражает предполагаемое намерение.
- source_word: לַחְקֹר
  choice: исследовать
  rationale: חקר может означать тщательно исследовать или разузнать. «Исследовать» сохраняет широкий смысл и подходит к контексту разведывательной миссии.
- source_word: וְלַהֲפֹךְ
  choice: ниспровергнуть
  rationale: הפך буквально связано с переворачиванием и может в этом враждебном политическом контексте подразумевать ниспровержение или подрыв страны. Выбор сохраняет сильный враждебный оттенок, не сводя действие только к физическому разрушению.
- source_word: וּלְרַגֵּל
  choice: разведать
  rationale: רגל в данной породе означает заниматься разведкой или высматривать территорию. «Разведать» естественно и ясно передаёт шпионско-военный контекст.
- source_word: הָאָרֶץ
  choice: страну
  rationale: אֶרֶץ здесь обозначает территорию аммонитян; «страна» звучит естественно и передаёт политико-территориальный смысл.
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: В царском контексте עֶבֶד может обозначать слуг или посланников правителя. Прямой перевод «слуги» не уточняет их должность сверх сказанного в тексте.
