  to: Когда Арам[a] увидел, что потерпел поражение перед Израилем, арамеи послали вестников и привели арамеев из-за Реки[b], а впереди них шёл Шофах, военачальник войска Адад-Эзера.
  rationale: Убрано невыраженное в оригинале «которые жили» и заменено «вывели» на более естественное в данном контексте «привели». Оборот о Шофахе соединён с основным предложением и передан как его положение впереди войска, без усиления до явного командования. Сохранены терминология, имена и сдержанная неопределённость относительно Реки.
