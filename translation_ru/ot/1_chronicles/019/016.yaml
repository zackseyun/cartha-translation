base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: ru
  text: Когда Арам[a] увидел, что потерпел поражение перед Израилем, арамеи послали вестников и привели арамеев из-за Реки[b], а впереди них шёл Шофах, военачальник войска Адад-Эзера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Сирия»; в еврейском тексте — «Арам».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть, вероятно, из-за Евфрата; в еврейском тексте сказано просто: «из-за Реки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Арам / арамеи
  rationale: В первом случае название обозначает народ или политическое объединение как единое целое, а во втором — людей и войско. «Арам» сохраняет древнееврейское название, а «арамеи» естественно передаёт собирательное значение в контексте мобилизации сил.
- source_word: נִגְּפוּ
  choice: потерпел поражение
  rationale: Форма нифаля в военном контексте означает быть побеждённым. Выражение передаёт исход битвы, не усиливая его до полного уничтожения.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: перед Израилем
  rationale: Сохранён образный строй еврейского выражения «перед лицом Израиля»; в данном контексте оно означает поражение от Израиля.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: Речь идёт о людях, отправленных с военно-политическим поручением, а не об ангелах. «Вестники» точно и понятно передаёт значение.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: вывели тех арамеев
  rationale: Каузативная форма глагола יצא буквально означает «вывести, заставить выйти» и здесь описывает приведение или мобилизацию дополнительных арамейских сил.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: по ту сторону Реки
  rationale: Еврейский текст буквально говорит «из-за Реки», не называя её. Заглавная буква показывает, что это известное географическое обозначение; вероятнее всего, имеется в виду Евфрат.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: военачальник войска Адад-Эзера
  rationale: שַׂר צְבָא — обычное воинское звание командующего войском. Перевод сохраняет и должность, и принадлежность войска Адад-Эзеру.
- source_word: לִפְנֵיהֶם
  choice: во главе их стоял
  rationale: Буквально «перед ними»; в военном контексте положение впереди войска указывает на руководство им. Русское выражение естественно передаёт этот смысл.
