  source_fidelity: 'Смысл в целом передан точно: Арам потерпел военное поражение, затем были отправлены посланцы за подкреплением из-за Реки; Шофах назван военачальником Адад-Эзера и помещён впереди войска. Однако «те арамеи, которые жили» неоправданно конкретизирует исходное «арамеи из-за Реки»: текст обозначает их происхождение/местонахождение, но не утверждает, что они там постоянно жили.'
