base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: ru
  text: 'Они пошли и сообщили Давиду об этих людях. Он послал им навстречу[a], потому что те были крайне унижены. Царь сказал: «Оставайтесь в Иерихоне, пока у вас не отрастут бороды, а потом возвращайтесь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он послал посланников им навстречу». В еврейском тексте не названо, кого именно он послал, хотя подразумевать посланников естественно.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Они пошли
  rationale: Прямо передаёт обычную повествовательную форму глагола הלך и сохраняет последовательность действий.
- source_word: וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: рассказали Давиду об этих людях
  rationale: Глагол הגיד с ל обозначает адресата сообщения, а עַל — его предмет. Указательное «этих» естественно отсылает к униженным послам из предыдущего стиха.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: он послал им навстречу
  rationale: Еврейский текст не называет объект глагола שׁלח; формулировка сохраняет эту недосказанность, не добавляя явно «посланников».
- source_word: נִכְלָמִים מְאֹד
  choice: были глубоко унижены
  rationale: Нифаль от כלם выражает пережитый стыд и общественное унижение; «глубоко» естественно передаёт усилитель מְאֹד.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Оставайтесь в Иерихоне
  rationale: В данном контексте ישׁב означает оставаться или пребывать, а не буквально сидеть.
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: пока у вас не отрастут бороды
  rationale: צמח означает расти; «отрастут» естественно учитывает, что бороды были сбриты в предыдущем стихе. Собирательная форма זְקַנְכֶם по-русски передана множественным числом.
- source_word: וְשַׁבְתֶּם
  choice: а потом возвращайтесь
  rationale: Передаёт последующее действие после указанного срока; русский императив естественно продолжает прямую речь, хотя в еврейском употреблена форма перфекта с союзом.
