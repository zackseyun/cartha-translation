source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: ru
  text: Когда аммонитяне увидели, что стали отвратительны Давиду[a], Ханун и аммонитяне послали тысячу талантов серебра, чтобы нанять себе колесницы и всадников из Арам-Нахараима[b], Арам-Маахи и Цовы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделались зловонными перед Давидом» — древнееврейская идиома со значением «стали отвратительны, ненавистны».'
    reason: lexical_alternative
  - marker: b
    text: Арам-Нахараим традиционно понимается как «Арам двух рек», то есть Месопотамия.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: увидели
  rationale: 'Сохраняет основное значение глагола ראה и естественный для русского языка оборот осознания ситуации: «увидели, что…».'
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Естественное русское обозначение народа вместо буквального «сыны Аммона».
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: стали отвратительны Давиду
  rationale: Передаёт идиоматический смысл формы от באש — стать неприятными, отвратительными для кого-либо, не воспроизводя в основном тексте неестественную буквальную метафору запаха.
- source_word: וַיִּשְׁלַח
  choice: послали
  rationale: По контексту речь идёт об отправке серебра как платы за наём; множественное число согласовано с составным подлежащим «Ханун и аммонитяне».
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: тысячу талантов серебра
  rationale: Сохраняет древнюю меру веса без предположительного пересчёта в современные единицы.
- source_word: לִשְׂכֹּר לָהֶם
  choice: чтобы нанять себе
  rationale: Передаёт как цель отправки серебра, так и значение выгоды или предназначения в לָהֶם.
- source_word: אֲרַם נַהֲרַיִם
  choice: Арам-Нахараим
  rationale: Транслитерация сохраняет характер географического имени; его традиционное толкование пояснено в сноске.
- source_word: אֲרַם מַעֲכָה
  choice: Арам-Мааха
  rationale: Передаёт составное название области как имя собственное.
- source_word: מִצּוֹבָה
  choice: из Цовы
  rationale: Использована закрепившаяся в русской библейской традиции форма географического названия.
- source_word: רֶכֶב וּפָרָשִׁים
  choice: колесницы и всадников
  rationale: Коллективное רֶכֶב естественно передано множественным числом, а פָרָשִׁים — конкретным обозначением конных воинов.
