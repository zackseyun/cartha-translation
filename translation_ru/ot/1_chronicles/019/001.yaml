base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: ru
  text: После этого умер Наас, царь аммонитян, и вместо него воцарился его сын.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временной переход еврейской повествовательной формулы, не утяжеляя русский текст буквальным «и было после этого».
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямое и точное соответствие глаголу מות без неуместного смягчения.
- source_word: נָחָשׁ
  choice: Наас
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: царь аммонитян
  rationale: Идиоматично передаёт буквальное «царь сынов Аммона» как обозначение народа.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В контексте престолонаследия глагол מלך обозначает вступление в царскую власть; совершенный вид естественен для последовательности событий.
- source_word: בְּנוֹ
  choice: его сын
  rationale: Местоимение однозначно относится к Наасу.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт занятие прежнего положения в ходе царского наследования и сохраняет структуру исходной фразы.
