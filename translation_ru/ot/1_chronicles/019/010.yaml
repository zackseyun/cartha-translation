  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: ru
  text: Когда Иоав увидел, что против него стоят вражеские силы — и перед ним, и позади него, — он отобрал из всех отборных воинов Израиля[a] и выстроил их против Арама[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из всех избранных воинов Израиля». Еврейское слово может означать «отборный», «избранный»; в данном военном контексте речь идёт об отборных бойцах.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское: «Арам»; то есть арамейские силы.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Сохраняет обычное повествовательное значение ראה и естественно передаёт осознание Иоавом тактической обстановки.
- source_word: פְנֵי הַמִּלְחָמָה אֵלָיו פָּנִים וְאָחוֹר
  choice: ему предстоит сражаться и спереди, и с тыла
  rationale: Передаёт военный смысл образного выражения «лицо битвы было к нему спереди и сзади» естественным современным русским языком.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: лучших воинов со всего Израиля
  rationale: В военном контексте בָּחוּר обозначает отборных бойцов; конструкция с מִן допускает понимание как выбора из их числа.
- source_word: וַיַּעֲרֹךְ
  choice: выстроил их
  rationale: Глагол ערך в военном контексте означает построить или расположить войска в боевом порядке.
- source_word: לִקְרַאת אֲרָם
  choice: против арамеев
  rationale: לקראת здесь обозначает выступление навстречу для боя, а אֲרָם контекстуально указывает на арамейские силы.
