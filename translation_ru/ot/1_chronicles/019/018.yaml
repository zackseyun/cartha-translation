    issue: «Давид поразил»
    rationale: הרג означает убийство; русское «поразил» может означать также нанёс поражение или ранил, поэтому ослабляет утверждение исходного текста.
  - severity: medium
    issue: «предал смерти»
    rationale: Эта формула обычно связана с приговором, казнью или выдачей на смерть. הֵמִית здесь означает, что Давид убил военачальника в ходе описываемого сражения; специального юридического смысла нет.
  - severity: low
    issue: Порядок «поразил у арамеев»
    rationale: Фраза грамматически возможна, но менее плавна и точна, чем «убил в арамейском войске».
