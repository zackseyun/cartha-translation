base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: ru
  text: И побежали арамеи от израильтян, а Давид убил в арамейском войске семь тысяч воинов колесничного войска[a] и сорок тысяч пеших воинов. Шофаха[b], военачальника, он убил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельном месте, 2 Царств 10:18, сказано: «семьсот колесниц и сорок тысяч всадников». Здесь, в Хрониках, — «семь тысяч воинов колесничного войска и сорок тысяч пеших воинов».'
    reason: textual_variant
  - marker: b
    text: В параллельном рассказе, 2 Царств 10:16, 18, Шофах назван Шовахом.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּנָס אֲרָם
  choice: И побежали арамеи
  rationale: Название אֲרָם здесь обозначает участвовавшие в сражении арамейские силы; множественное «арамеи» естественно передаёт собирательное значение в русском повествовании.
- source_word: מִלִּפְנֵי יִשְׂרָאֵל
  choice: от израильтян
  rationale: Буквально «от лица Израиля» — устойчивое обозначение бегства перед противником; в данном контексте «от израильтян» ясно и естественно.
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: Давид поразил
  rationale: Глагол הרג означает «убить»; «поразил» сохраняет военный характер повествования и соответствует возвышенному, но современному библейскому регистру.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: семь тысяч воинов на колесницах
  rationale: רֶכֶב буквально обозначает колесницы или колесничное войско и здесь метонимически относится к людям колесничного подразделения. Формулировка не сужает значение до одних возниц.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: сорок тысяч пеших воинов
  rationale: אִישׁ רַגְלִי буквально «пеший человек», то есть воин пехоты; выбран ясный современный военный термин.
- source_word: שׁוֹפַךְ
  choice: Шофах
  rationale: Транслитерация формы имени в Хрониках; отличающаяся форма параллельного рассказа отмечена в сноске.
- source_word: שַׂר הַצָּבָא
  choice: военачальника
  rationale: Кратко и естественно передаёт начальника войска без архаичного «воевода».
- source_word: הֵמִית
  choice: предал смерти
  rationale: Каузатив глагола מות означает «умертвить, предать смерти»; отдельная формулировка сохраняет лексическое отличие от более раннего הרג.
