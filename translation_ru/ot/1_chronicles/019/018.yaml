revisions:
- from: И побежали арамеи от израильтян, а Давид поразил у арамеев семь тысяч воинов на колесницах[a] и сорок тысяч пеших воинов. Шофаха[b], военачальника, он предал смерти.
  to: И побежали арамеи от израильтян, а Давид убил в арамейском войске семь тысяч воинов колесничного войска[a] и сорок тысяч пеших воинов. Шофаха[b], военачальника, он убил.
  rationale: Правка устраняет смысловую неопределённость «поразил» и неуместный юридический оттенок «предал смерти». «Воины колесничного войска» сохраняет неоднозначно-коллективный характер רֶכֶב и не утверждает без необходимости, что речь идёт только о возницах. Сноски сохранены, с приведением цитаты в сноске к пересмотренной формулировке основного текста.
