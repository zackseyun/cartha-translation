  text: וַ/יֵּצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּֽעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הָ/עִ֑יר וְ/הַ/מְּלָכִ֣ים אֲשֶׁר בָּ֔אוּ לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: ru
  text: И вышли аммонитяне[a] и выстроились к битве[b] у входа в город[c], а пришедшие цари расположились отдельно от них в поле[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Аммона».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «построили войско для битвы». Еврейский оборот означает расположение войск в боевом порядке.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно: «у городских ворот», однако в еврейском тексте употреблено общее слово «вход», а не обычное слово «ворота».'
    reason: lexical_alternative
  - marker: d
    text: То есть пришедшие на помощь цари со своими силами стояли в поле отдельно от аммонитян.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Обычное повествовательное значение יצא; русское «вышли» естественно описывает выход войска из города.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Идиоматическое современное русское обозначение народа; буквальное «сыновья Аммона» сохранено в сноске.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: выстроились к битве
  rationale: Военный оборот указывает на построение войск в боевой порядок, а не просто на начало сражения.
- source_word: פֶּתַח הָעִיר
  choice: у входа в город
  rationale: פתח означает вход или проём; перевод не подменяет его более специальным словом «ворота».
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: а пришедшие цари
  rationale: Союз «а» естественно передаёт сопоставление двух отдельно расположенных сил.
- source_word: לְבַדָּם
  choice: отдельно от них
  rationale: По контексту речь идёт об отдельном расположении союзных царей и их сил, а не о том, что цари находились без войск.
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое и точное соответствие; контекст сам показывает, что речь идёт о местности вне города.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясной военной лексикой. Этноним передан естественно, а буквальная еврейская форма вынесена в сноску. Формулировка «отдельно от них» раскрывает контекстуальный смысл לְבַדָּם без предположения, будто цари были одни.
