base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: ru
  text: Будь мужественен, и будем твёрдо стоять за наш народ и за города нашего Бога. И Яхве пусть сделает то, что угодно Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «И Яхве сделает то, что угодно Ему». Еврейская форма допускает здесь как пожелание, так и утверждение о будущем.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Будь мужественен
  rationale: Императив חזק в военном призыве означает проявить силу и мужество; этот вариант естественно передаёт не физическое состояние, а решимость.
- source_word: וְנִתְחַזְּקָה
  choice: и будем твёрдо стоять
  rationale: Порода хитпаэль и когортатив выражают совместное решительное усилие. Буквальное «укрепимся» возможно, но в современном русском здесь звучит менее естественно.
- source_word: בְּעַד
  choice: за
  rationale: В контексте сражения предлог обозначает действие ради кого-либо и в его защиту; русское «за» кратко передаёт оба оттенка.
- source_word: עַמֵּנוּ
  choice: наш народ
  rationale: עַם обозначает народ в целом, а не только войско.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: города нашего Бога
  rationale: 'Сохранена конструкция принадлежности: города представлены как принадлежащие Богу.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: то, что угодно Ему
  rationale: Естественная русская передача еврейской идиомы «доброе в его глазах», то есть то, что Он считает правильным и желательным.
- source_word: יַעֲשֶׂה
  choice: пусть сделает
  rationale: Вслед за призывами имперфект допускает волитивное прочтение, выражающее доверительное вручение исхода Богу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя; транслитерация сохраняет это различие.
- issue: Модальность заключительной фразы
  choice: А Яхве пусть сделает
  alternative: И Яхве сделает
  rationale: Контекст поддерживает пожелание и покорное доверие Богу, однако форма может пониматься и как предсказание; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством военного призыва. «Будем твёрдо стоять» передаёт совместную решимость без тяжеловесного буквального «укрепимся». Частица «А» естественно обозначает переход от человеческой ответственности к вручению исхода Богу.
