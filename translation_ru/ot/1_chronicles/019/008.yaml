  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: ru
  text: Когда Давид услышал об этом[a], он послал Иоава и всё войско доблестных воинов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнал об этом»; «ему сообщили об этом».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «доблестные воины» может обозначать храбрых воинов Давида или его отборное боевое подразделение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал об этом
  rationale: В повествовательном контексте глагол означает получение известия. Добавление «об этом» естественно для русского языка и передаёт подразумеваемый объект, не уточняя способ получения вести.
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычный и точный русский эквивалент в военном повествовании; не усиливает значение до более специального «направил» или «отправил в поход».
- source_word: יוֹאָב
  choice: Иоава
  rationale: Имя передано в принятой русской библейской форме и поставлено в винительный падеж в соответствии с синтаксисом.
- source_word: כָּל
  choice: всё
  rationale: Согласуется с собирательным существительным «войско» и прямо передаёт значение полноты.
- source_word: צָבָא
  choice: войско
  rationale: В данном военном контексте обозначает организованную боевую силу; «войско» звучит естественно и соответствует повествовательному регистру.
- source_word: הַגִּבּוֹרִים
  choice: доблестных воинов
  rationale: Передаёт значение сильных, храбрых, прославленных бойцов, не сводя выражение однозначно к официальному названию особого подразделения.
- source_word: וְאֵת כָּל צָבָא הַגִּבּוֹרִים
  choice: и всё войско доблестных воинов
  rationale: Сохраняет конструктивную связь существительных в еврейском тексте и не упрощает выражение до «всё его войско».
