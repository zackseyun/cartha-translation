base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: ru
  text: 'И сказал Давид: «Я окажу доброту Хануну, сыну Нахаша, потому что его отец оказал мне доброту». И послал Давид посланцев утешить его в связи с его отцом[a]. И пришли слуги Давида в землю аммонитян, к Хануну, чтобы утешить его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утешить его об отце». Еврейское выражение указывает, что утешение было связано с его отцом; в данном контексте подразумевается его смерть.'
    reason: Передаёт возможное буквальное понимание עַל אָבִיו и поясняет траурный контекст, не добавляя «смерть» в основной текст.
lexical_decisions:
- source_word: חֶסֶד
  choice: поступить по-доброму
  rationale: В данном межличностном и дипломатическом контексте слово обозначает проявленную доброту или благожелательную верность. Эта формулировка естественна по-русски, не придаёт слову исключительно заветного смысла и сохраняется в обоих случаях.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: Речь идёт о людях, посланных Давидом; «вестники» передаёт основное значение, не утверждая более узкого официального статуса послов.
- source_word: לְנַחֲמוֹ
  choice: утешить его
  rationale: В контексте смерти отца глагол означает утешение человека в скорби; прямой русский эквивалент ясен и уместен в обоих случаях.
- source_word: עַל אָבִיו
  choice: после смерти отца
  rationale: Буквально выражение связывает утешение с отцом Хануна; в траурном контексте причиной утешения подразумевается смерть отца. Явная формулировка делает русский текст естественным, а буквальная особенность отмечена в сноске.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: землю аммонитян
  rationale: «Аммонитяне» — принятый русский этноним; формулировка сохраняет географическое значение אֶרֶץ.
- source_word: עַבְדֵי דָוִיד
  choice: слуги Давида
  rationale: Прямое значение указывает на людей, состоявших на службе у Давида; контекст не требует уточнять их как чиновников.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: И сказал ... И послал ... И пришли
  rationale: Повтор союза сохраняет последовательное повествовательное движение еврейского текста и остаётся приемлемым в литературном русском библейском повествовании.
