  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: ru
  text: И Яхве чрезвычайно возвеличил Соломона в глазах всего Израиля и даровал ему такое царское величие[a], какого прежде не было ни у одного царя, правившего Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царское великолепие»; или: «величие царской власти».'
    reason: Лексическое сочетание הוֹד מַלְכוּת допускает близкие оттенки величия, великолепия и достоинства, связанного с царской властью.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: чрезвычайно возвеличил
  rationale: Каузативная форма גדל означает «сделал великим, возвеличил», а לְמַעְלָה усиливает её. Сочетание передаёт и причинное действие Яхве, и высокую степень возвышения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: в глазах всего Израиля
  rationale: Сохранён прозрачный для современного русского языка еврейский оборот, указывающий на публичное признание и восприятие.
- source_word: וַיִּתֵּן עָלָיו
  choice: даровал ему
  rationale: Буквально «дал на него»; русский глагол «даровал» естественно выражает торжественное наделение величием.
- source_word: הוֹד מַלְכוּת
  choice: царское величие
  rationale: הוֹד обозначает величие, великолепие или блеск, а מַלְכוּת определяет царскую сферу. Выражение «царское величие» точно и естественно в данном контексте.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: какого до него не было ни у одного царя над Израилем
  rationale: Относительное предложение относится к царскому величию; «до него» передаёт временной смысл לְפָנָיו, а «над Израилем» — власть царя над народом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис сохраняет последовательность действий исходного текста; двусмысленность образа величия, «данного» царю, не перегружена буквальным оборотом «на нём».
