source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: ru
  text: Тебе, Яхве, принадлежат величие, могущество, великолепие, превосходство[a] и величавость, ибо всё на небесах и на земле — Твоё. Тебе, Яхве, принадлежит царство, и Ты возвышаешься как глава над всем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «победа»; возможно также: «вечность». Еврейское נֵצַח здесь может обозначать торжество, непреходящесть или верховное превосходство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, посредством распространённой современной русской транслитерации.
- source_word: לְךָ
  choice: Тебе… принадлежат / Тебе… принадлежит
  rationale: Передаёт дательный принадлежности и сохраняет эмфатическое повторение в обеих частях стиха.
- source_word: הַגְּדֻלָּה
  choice: величие
  rationale: Прямой русский эквивалент абстрактного существительного со значением величия.
- source_word: הַגְּבוּרָה
  choice: могущество
  rationale: Естественно выражает силу и мощь в возвышенном славословии.
- source_word: הַתִּפְאֶרֶת
  choice: великолепие
  rationale: Передаёт смысл красоты, славы и блистательности, не смешивая это слово с соседним הוֹד.
- source_word: הַנֵּצַח
  choice: превосходство
  rationale: В данном славословии может обозначать непреходящее превосходство или торжество; основной текст сохраняет царственно-доксологический оттенок без сведения значения только к военной победе.
- source_word: הַהוֹד
  choice: величавость
  rationale: Передаёт царственное достоинство и величественный блеск, оставаясь отличным от תפארת.
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: ибо всё на небесах и на земле — Твоё
  rationale: כִּי понято как причинное «ибо», а כֹל — всеобъемлюще; добавленное именное сказуемое естественно выражает подразумеваемую принадлежность.
- source_word: הַמַּמְלָכָה
  choice: царство
  rationale: Сохраняет царскую образность и может охватывать как царство, так и царское владычество.
- source_word: וְהַמִּתְנַשֵּׂא
  choice: и Ты возвышаешься
  rationale: Причастная форма передана как личное сказуемое; медиально-рефлексивная форма допускает значение пребывания или явления возвышенным.
- source_word: לְכֹל לְרֹאשׁ
  choice: как глава над всем
  rationale: Сохраняет метафору главы и выражает верховенство над всем сущим.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст содержит собственное имя; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Значение נֵצַח в перечне Божьих свойств
  choice: превосходство
  alternative: победа; вечность
  rationale: Еврейское слово здесь неоднозначно и может выражать победу, непреходящесть либо верховное превосходство. Альтернативы вынесены в примечание, чтобы не устранять смысловое напряжение.
- issue: Форма וְהַמִּתְנַשֵּׂא
  choice: Ты возвышаешься
  alternative: Ты возвышен; Тот, кто превознесён
  rationale: Русская личная конструкция естественно передаёт причастие, не уточняя сверх необходимого, является ли акцент состоянием, проявлением возвышенности или возвышением.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенно-литургическим звучанием. Повтор «Тебе, Яхве» сохранён ради риторического акцента; прописные формы местоимений относятся к Богу в соответствии с традиционным русским благоговейным регистром.
