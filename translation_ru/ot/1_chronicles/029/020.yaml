base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: ru
  text: 'Тогда Давид сказал всему собранию: «Благословите же Яхве, вашего Бога».[a] И всё собрание благословило Яхве, Бога своих отцов, склонилось и простёрлось ниц перед Яхве и перед царём.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Прошу, благословите Яхве, вашего Бога». Частица נָא может выражать просьбу или настойчивое побуждение.'
    reason: lexical_alternative
  - marker: b
    text: Буквально речь идёт о телесном склонении и простирании ниц перед «Яхве и царём». Некоторые переводы поясняют действие по отношению к царю словами «воздали почтение».
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: Благословите же
  rationale: Императив בָּרְכוּ передан прямо; частица נָא здесь придаёт призыву настойчивость или оттенок просьбы. «Же» естественно выражает побуждение, а возможный просительный оттенок отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: הַקָּהָל
  choice: собрание
  rationale: קָהָל обозначает собравшийся народ; «собрание» ясно и уместно в публичном культовом контексте.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: Бога своих отцов
  rationale: Сохранена конкретная библейская формула, связывающая собравшихся с их отцами и историей завета.
- source_word: וַיִּקְּדוּ
  choice: склонились
  rationale: Глагол קדד обозначает поклон, склонение тела или головы. Нейтральное «склонились» не добавляет отсутствующего в еврейском тексте слова «головы» и сохраняет отличие от следующего полного простирания.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: простёрлись
  rationale: Форма от שׁחה передаёт телесное простирание ниц. Конкретное физическое действие сохранено вместо толковательного «поклонились» в смысле богопочитания, поскольку далее названы и Яхве, и царь.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: перед Яхве и перед царём
  rationale: Сочетание предлога ל с глаголом простирания естественно передаётся по-русски как «перед». Повтор предлога отражает оба объекта действия, не утверждая, что оказываемая им честь была тождественной по природе.
theological_decisions:
- issue: Действие собрания направлено и к Яхве, и к царю
  choice: 'Сохранить единое описание телесного действия: «простёрлись перед Яхве и перед царём»'
  alternative: «поклонились Яхве и воздали почтение царю»
  rationale: Еврейский текст не разделяет действие на два разных глагола. Конкретная телесная формулировка сохраняет напряжение текста и не приравнивает почтение царю к божественному поклонению, но и не вносит отсутствующего в оригинале пояснительного разграничения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис близок к еврейскому повествованию; лексика избегает архаизмов. Местоимение «они» добавлено перед однородными сказуемыми для естественности русского предложения и ясного перехода от собирательного подлежащего к действиям людей.
