base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: ru
  text: Деяния царя Давида — от начала до конца[a] — записаны в записях[b] провидца Самуила, пророка Нафана и провидца Гада[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «деяния (или слова, события) царя Давида, первые и последние». Это выражение охватывает весь период его жизни и царствования.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «записаны на словах Самуила… Нафана… Гада». Здесь речь идёт о письменных источниках или записях.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте титул Самуила — רֹאֶה, а титул Гада — חֹזֶה. Оба здесь переданы словом «провидец»; возможен также перевод «прозорливец».
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד הַמֶּלֶךְ
  choice: дела царя Давида
  rationale: В данном контексте דְּבָרִים обозначает не только слова, но и дела, события и обстоятельства жизни и царствования Давида. «Дела» естественно передаёт этот смысл по-русски, не сужая его до речей.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: от первых до последних
  rationale: Парное выражение охватывает весь период жизни и правления Давида. Такая формулировка сохраняет образ исходного текста и звучит естественнее, чем «прежние и последующие».
- source_word: הִנָּם כְּתוּבִים
  choice: записаны
  rationale: Глагольная форма прямо указывает на письменную фиксацию. Указательно-усилительное הִנָּם не требует отдельного «вот» в современном русском предложении.
- source_word: עַל דִּבְרֵי שְׁמוּאֵל / נָתָן / גָּד
  choice: в записях Самуила / Нафана / Гада
  rationale: Буквальное «на словах» здесь обозначает письменные источники. «В записях» ясно передаёт документальный смысл, не навязывая более узкий жанр «летописи» или «хроники».
- source_word: הָרֹאֶה
  choice: прозорливец
  rationale: Рֹאֶה — древний титул человека, получающего откровение или видение. «Прозорливец» сохраняет отличие от обычного обозначения пророка и от другого титула в конце стиха.
- source_word: הַנָּבִיא
  choice: пророк
  rationale: Обычный и точный русский эквивалент נָבִיא.
- source_word: הַחֹזֶה
  choice: провидец
  rationale: «Провидец» естественно передаёт חֹזֶה и позволяет сохранить лексическое различие между этим титулом и רֹאֶה, переведённым как «прозорливец».
theological_decisions:
- issue: Передача трёх пророческих обозначений רֹאֶה, נָבִיא и חֹזֶה
  choice: «прозорливец», «пророк» и «провидец»
  alternative: Передать как «провидец», «пророк» и «провидец», объединив רֹאֶה и חֹזֶה одним русским словом
  rationale: Исходный текст употребляет три обозначения и тем самым различает титулы Самуила, Нафана и Гада. Русский язык позволяет сохранить это различие без тяжеловесности; при этом перевод не утверждает, что между двумя видами провидческого служения существовало строгое богословское разграничение.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Повтор «в записях» сохраняет трёхчастную структуру оригинала; дефисные сочетания «Самуила-прозорливца» и «Гада-провидца» ясно показывают приложение и избегают двусмысленности.
