  terminology: «Деяния» — удачный высокий, но современно понятный эквивалент в данном итоговом перечне. Для обоих רֹאֶה и חֹזֶה следует употребить общий естественный титул «провидец», а лексическое различие еврейских слов отметить в сноске без догматизации. «Пророк» для נָבִיא сохранён.
