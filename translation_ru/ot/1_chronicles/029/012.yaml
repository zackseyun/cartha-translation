base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: ru
  text: И богатство, и слава[b] исходят от Тебя[a], и Ты владычествуешь над всем. В Твоей руке — сила и могущество, и в Твоей руке — возвеличивать[c] и укреплять всех[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица Твоего»; возможно также: «от Твоего присутствия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «почёт».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «делать великими»; возможно также: «возвышать».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «всё»; еврейское слово может иметь значение «все», «всякий» или «всё».'
    reason: ambiguity
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: богатство
  rationale: Слово обозначает материальное изобилие или состояние; «богатство» естественно звучит в возвышенной молитвенной речи.
- source_word: הַכָּבוֹד
  choice: слава
  rationale: Здесь слово может обозначать славу, почёт и высокое положение. «Слава» сохраняет широкий смысл и естественно сочетается с «богатством».
- source_word: מִלְּפָנֶיךָ
  choice: исходят от Тебя
  rationale: Буквально выражение означает «от лица Твоего / от присутствия Твоего» и указывает на источник. Основной текст передаёт смысл современным русским языком, а образ исходного выражения сохранён в сноске.
- source_word: מוֹשֵׁל בַּכֹּל
  choice: Ты владычествуешь над всем
  rationale: Причастная форма выражает продолжающееся верховное правление; «владычествуешь» сохраняет возвышенный молитвенный регистр.
- source_word: בְיָדְךָ
  choice: в Твоей руке
  rationale: Сохранён конкретный образ руки как выражение обладания властью и способности действовать.
- source_word: כֹּחַ
  choice: сила
  rationale: Слово обозначает силу или способность; «сила» является прямым и естественным соответствием.
- source_word: גְבוּרָה
  choice: могущество
  rationale: Слово передаёт мощь и действенную силу; «могущество» позволяет не сливать его с предшествующим כֹּחַ.
- source_word: לְגַדֵּל
  choice: возвеличивать
  rationale: Порода piel выражает действие «делать великим»; в данном контексте речь идёт о способности Бога возвышать.
- source_word: לְחַזֵּק
  choice: укреплять
  rationale: Прямо передаёт значение «делать сильным, укреплять».
- source_word: לַכֹּל
  choice: всех
  rationale: כֹּל имеет широкий охват и может относиться ко всем или ко всему. В сочетании с «возвеличивать и укреплять» русский основной текст естественно указывает на всех людей, а более широкая возможность отмечена в сноске.
theological_decisions:
- issue: Источник богатства и славы в выражении מִלְּפָנֶיךָ
  choice: исходят от Тебя
  alternative: исходят от лица Твоего / от Твоего присутствия
  rationale: Перевод ясно передаёт Бога как источник, не добавляя учения сверх текста; буквальный образ присутствия не устраняется, а указывается в сноске.
- issue: Охват לַכֹּל
  choice: всех
  alternative: всё / всякого
  rationale: Контекст возвеличивания и укрепления благоприятствует личному референту, однако еврейское выражение само по себе допускает более широкий охват, что сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенным звучанием. Сохранены повтор «в Твоей руке» и образ Божьей руки; архаические формы сведены к минимуму. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской практике.
