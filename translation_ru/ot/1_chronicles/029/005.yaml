base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: ru
  text: золото — для золотых изделий, серебро — для серебряных изделий и для всякой работы, выполняемой мастерами. Кто же сегодня добровольно наполнит свою руку для Яхве?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнит свою руку». Эта еврейская идиома может означать посвящение на священное служение или принесение приношения для него.'
    reason: Поясняет буквальную культовую идиому, сохраняя в основном тексте её смысловую неоднозначность.
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: золото — для золотых изделий
  rationale: 'Повтор в еврейском тексте эллиптичен: речь идёт о золоте, предназначенном для изделий из золота. Добавление «изделий» естественно передаёт подразумеваемый смысл.'
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: серебро — для серебряных
  rationale: Параллельная эллиптическая конструкция; слово «изделий» подразумевается из предыдущей части и не повторяется ради естественности русского синтаксиса.
- source_word: וּלְכָל מְלָאכָה בְּיַד חָרָשִׁים
  choice: и для всякой работы, исполняемой руками мастеров
  rationale: מְלָאכָה охватывает все виды работ, а בְּיַד сохраняет образ рук как средства исполнения; חָרָשִׁים обозначает искусных ремесленников, естественно переданных словом «мастера».
- source_word: וּמִי מִתְנַדֵּב
  choice: Кто же сегодня добровольно
  rationale: Форма от נדב выражает добровольную готовность или свободное приношение. Наречие «добровольно» сохраняет этот оттенок в риторическом призыве.
- source_word: לְמַלֹּאות יָדוֹ
  choice: наполнит свою руку
  rationale: 'Буквальная передача культовой идиомы сохраняет её намеренную многозначность: она может указывать на посвящение себя и на предоставление дара для священного дела. Значение пояснено в сноске.'
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямая и естественная передача временного наречия.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל здесь указывает, кому предназначено добровольное посвящение или приношение; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога, поэтому транслитерация сохраняет различие между именем יהוה и титулом «Господь».
- issue: Культовая идиома לְמַלֹּאות יָדוֹ
  choice: наполнит свою руку
  alternative: посвятит себя; принесёт щедрый дар
  rationale: Контекст допускает взаимосвязанные оттенки посвящения и принесения дара. Буквальная формулировка в основном тексте не устраняет эту напряжённость, а сноска делает идиому понятной современному читателю.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Эллипсис в параллельных фразах передан естественно; необычная культовая идиома намеренно сохранена и разъяснена сноской.
