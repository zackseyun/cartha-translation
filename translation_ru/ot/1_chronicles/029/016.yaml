  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: ru
  text: Яхве, Боже наш! Всё это богатство[a], которое мы приготовили, чтобы построить Тебе дом для Твоего святого имени, — из Твоей руки[b], и всё принадлежит Тебе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё это изобилие»; еврейское слово может обозначать множество, богатство или большие запасы — здесь собранные для храма ценности и материалы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из Твоей руки это».'
    reason: literal_rendering
  - marker: c
    text: 'Или: «и всё Твоё».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, принятой современной русской транслитерацией.
- source_word: אֱלֹהֵינוּ
  choice: Боже наш
  rationale: В обращении к Яхве форма אֱלֹהִים имеет единственное значение; русский звательный оборот «Боже наш» естественен для молитвы.
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: всё это богатство
  rationale: הָמוֹן обозначает множество, изобилие или богатство; здесь речь о большом количестве собранных для храма ценностей и материалов.
- source_word: הֲכִינֹנוּ
  choice: мы приготовили
  rationale: Глагол означает «приготовить, сделать готовым»; совершенный вид передаёт завершённость подготовки.
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: чтобы построить Тебе дом
  rationale: Сохраняется образ «дома», а не подставляется толкование «храм»; дательный «Тебе» естественно передаёт לְךָ.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: для Твоего святого имени
  rationale: Передаёт предназначение дома Божьему святому имени и избегает возможного современного смысла оборота «во имя» как действия по чьему-либо полномочию.
- source_word: מִיָּדְךָ הִיא
  choice: из Твоей руки
  rationale: Сохраняет исходный образ руки как источника дара; связка в русском естественно опускается.
- source_word: וּלְךָ הַכֹּל
  choice: и всё принадлежит Тебе
  rationale: Ясно и современно выражает всеобъемлющее владение Бога, сохраняя объём הַכֹּל.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; «Яхве» сохраняет это различие без замены титулом.
- issue: Смысл מִיָּדְךָ и וּלְךָ הַכֹּל
  choice: Бог является источником приготовленного богатства, и всё принадлежит Ему
  alternative: 'Более узкое понимание: только перечисленные храмовые дары принадлежат Богу'
  rationale: Первая часть непосредственно относится к приготовленным дарам, тогда как обобщённое הַכֹּל допускает и естественно поддерживает более широкое «всё»; перевод не сужает его до одних материалов.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным молитвенным звучанием. Прописные местоимения в обращении к Богу поддерживают традиционный русский библейский регистр. Синтаксис сохраняет параллель исходника, не делая его тяжеловесным.
