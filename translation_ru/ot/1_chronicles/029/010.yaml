base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: ru
  text: 'И благословил Давид Яхве на глазах у всего собрания. Давид сказал: «Благословен Ты, Яхве, Бог Израиля, нашего отца[a], от века и до века!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог Израиля, Отец наш», если слова «Отец наш» понимать как прямое обращение к Богу, а не как относящиеся к Израилю (Иакову), нашему праотцу.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Сохраняет основное значение ברך в пиэле при Боге как объекте и лексическую связь с последующим בָּרוּךְ («благословен»), а также торжественный богослужебный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לְעֵינֵי
  choice: на глазах у
  rationale: Естественно передаёт буквальный зрительный образ еврейского оборота и подчёркивает публичность происходящего.
- source_word: כָּל הַקָּהָל
  choice: всего собрания
  rationale: קהל обозначает собравшееся сообщество; «собрание» понятно современному читателю и соответствует официальному контексту.
- source_word: בָּרוּךְ אַתָּה
  choice: Благословен Ты
  rationale: Торжественная и естественная по-русски формула прямого обращения, сохраняющая предикативную конструкцию оригинала.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача сопряжённой конструкции.
- source_word: אָבִינוּ
  choice: отца нашего
  rationale: 'Родительный падеж связывает выражение с именем «Израиль» и передаёт основное понимание: Израиль, то есть Иаков, является праотцом народа. Порядок «отца нашего» сохраняет возвышенный регистр.'
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: от века и до века
  rationale: Устоявшаяся русская библейская формула, выражающая неограниченную длительность и сохраняющая возвышенный характер славословия.
theological_decisions:
- issue: 'К кому относится אָבִינוּ («отец наш»): к Израилю/Иакову или непосредственно к Богу'
  choice: «Бог Израиля, отца нашего» — «отца нашего» относится к Израилю/Иакову
  alternative: «Бог Израиля, Отец наш» — прямое обращение к Богу как к Отцу
  rationale: Синтаксически естественно понимать אָבִינוּ как приложение к «Израилю», то есть обозначение патриарха Иакова. Поскольку еврейская конструкция допускает и обращение к Богу как к Отцу, альтернативное понимание сохранено в примечании.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Синтаксис слегка приподнят, но остаётся ясным; повтор имени Давида сохранён вслед за еврейским текстом. Маркер примечания поставлен непосредственно у спорной фразы.
