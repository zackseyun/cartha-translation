- from: И народ радовался тому, что они жертвовали добровольно[a], потому что от всего сердца они жертвовали добровольно Яхве[b]. И царь Давид тоже возрадовался великой радостью.
  to: Народ радовался их добровольным пожертвованиям[a], ибо они от всего сердца[b] добровольно жертвовали Яхве; и царь Давид тоже радовался с великой радостью.
  rationale: Исправлены содержание и положение сноски b, чтобы она поясняла выражение בְּלֵב שָׁלֵם, как в английской аудиторской записи. Также слегка сглажен русский синтаксис, сохранены добровольность приношений, повтор этого мотива, имя «Яхве» и усиленная радость Давида.
