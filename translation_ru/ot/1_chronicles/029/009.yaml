base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: ru
  text: Народ радовался их добровольным пожертвованиям[a], ибо они от всего сердца[b] добровольно жертвовали Яхве; и царь Давид тоже радовался с великой радостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радовался тому, что они добровольно жертвовали»; еврейский глагол подчёркивает свободный, добровольный характер пожертвований.'
    reason: lexical_alternative
  - marker: b
    text: Евр. «с цельным сердцем»; выражение означает искренность и неразделённую преданность.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: И народ радовался
  rationale: Обычное повествовательное выражение точно передаёт радость собравшегося народа; начальное «И» отражает последовательность еврейского повествования.
- source_word: עַל הִתְנַדְּבָם
  choice: тому, что они жертвовали добровольно
  rationale: Предлог עַל здесь указывает на причину радости, а Hitpael корня נדב подчёркивает добровольность пожертвований.
- source_word: כִּי
  choice: потому что
  rationale: Вводит объяснение причины народной радости и естественно связывает части русского предложения.
- source_word: בְּלֵב שָׁלֵם
  choice: от всего сердца
  rationale: Естественная русская идиома, сохраняющая смысл цельности, искренности и неразделённой расположенности сердца.
- source_word: הִתְנַדְּבוּ
  choice: жертвовали добровольно
  rationale: Повтор того же русского выражения сохраняет заметный повтор еврейского корня и его связь с добровольным приношением.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, выраженное тетраграмматоном יהוה, а не заменяет его титулом.
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: И царь Давид тоже
  rationale: 'Естественный русский порядок слов передаёт добавочное значение וְגַם: Давид разделил радость народа.'
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: возрадовался великой радостью
  rationale: Сохраняет усилительную конструкцию с однокоренными словами и торжественный повествовательный ритм, не сводя её к простому наречию «очень».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл בְּלֵב שָׁלֵם
  choice: от всего сердца
  alternative: с цельным сердцем
  rationale: Выбранная формулировка естественна по-русски и выражает искреннюю, неразделённую преданность, не превращая оборот в специальный конфессиональный термин.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «жертвовали добровольно» и выражение «возрадовался великой радостью» намеренно сохраняют риторические повторы еврейского текста; синтаксис при этом остаётся понятным обычному читателю.
