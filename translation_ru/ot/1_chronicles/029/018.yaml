  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: ru
  text: Яхве, Боже Авраама, Исаака и Израиля[a], отцов наших, сохрани навеки эту направленность помыслов сердца Твоего народа[b] и направь их сердце к Тебе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит «Израиль», а не ожидаемое в такой формуле имя «Иаков».
    reason: lexical_alternative
  - marker: b
    text: 'Возможен более буквальный перевод: «сохрани это навеки как склонность помыслов сердца Твоего народа».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «утверди их сердце в обращённости к Тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֵי
  choice: Боже
  rationale: Форма обращения «Боже Авраама…» естественна для русской молитвенной речи и точно передаёт конструкцию «Бог [кого]».
- source_word: אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: Авраама, Исаака и Израиля, отцов наших
  rationale: Сохранено имя «Израиль», стоящее в источнике, без замены на более ожидаемое «Иаков»; «отцов наших» точно обозначает названных патриархов.
- source_word: שָׁמְרָה זֹּאת לְעוֹלָם
  choice: Сохрани навеки это
  rationale: Императив молитвы и единичное указательное местоимение переданы непосредственно; «это» собирательно отсылает к только что проявленной готовности народа.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: это устремление помыслов в сердце Твоего народа
  rationale: «Устремление» передаёт волевую направленность יֵצֶר, а «помыслы» и «сердце» сохраняют внутренний, нравственно-волевой язык оригинала. Синтаксис сглажен ради ясного современного русского.
- source_word: וְהָכֵן
  choice: и направь
  rationale: Порода hифиль глагола כון допускает значения «утверди», «приготовь», «направь»; в сочетании с אֵלֶיךָ «к Тебе» перевод «направь» ясно выражает ориентацию сердца.
- source_word: לְבָבָם אֵלֶיךָ
  choice: их сердце к Тебе
  rationale: Сохранено собирательное единственное число «сердце», как в еврейском тексте, и пространственно-реляционное «к Тебе».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал содержит тетраграмматон как личное имя; его передача сохраняет различие между именем Бога и титулом.
- issue: Имя третьего патриарха
  choice: Израиль
  alternative: Иаков
  rationale: Несмотря на знакомую формулу «Авраам, Исаак и Иаков», масоретский текст здесь прямо читает «Израиль», поэтому гармонизация не производится.
- issue: Значение וְהָכֵן в отношении сердца
  choice: направь
  alternative: утверди
  rationale: «Направь» естественно сочетается с «к Тебе» и выражает обращённость к Богу; возможный оттенок утверждения не исключён и отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Синтаксис сделан понятным без устранения образов «помыслов» и «сердца»; прописные местоимения при обращении к Богу поддерживают традиционный русский библейский регистр.
