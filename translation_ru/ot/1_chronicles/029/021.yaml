source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: ru
  text: 'Они принесли Яхве жертвы и вознесли Яхве всесожжения на следующий день[a]: тысячу быков, тысячу баранов, тысячу ягнят и их возлияния[b], а также множество жертв для всего Израиля[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на другой день после того дня».'
    reason: lexical_alternative
  - marker: b
    text: Возлияния — жидкие приношения, которые выливали при принесении жертв.
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «за весь Израиль» или «от имени всего Израиля».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: закололи жертвы
  rationale: Сочетание глагола и однокоренного существительного обозначает ритуальный закол и сохраняет отличие этих жертв от названных далее всесожжений.
- source_word: לַיהוָה
  choice: для Яхве / Яхве
  rationale: Имя יהוה передано как «Яхве»; предлог ל выражает посвящение жертв Богу, а при глаголе «принесли» естественна беспредложная конструкция.
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Устоявшееся русское обозначение жертв, целиком сжигавшихся на жертвеннике.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: на следующий день
  rationale: Естественно передаёт временное значение еврейского выражения без тяжеловесного буквального повтора.
- source_word: פָּרִים אֶלֶף
  choice: тысячу быков
  rationale: פָּרִים обозначает взрослых самцов крупного рогатого скота, пригодных для жертвоприношения.
- source_word: אֵילִים אֶלֶף
  choice: тысячу баранов
  rationale: אֵילִים конкретно обозначает баранов, а не овец вообще.
- source_word: כְּבָשִׂים אֶלֶף
  choice: тысячу ягнят
  rationale: В жертвенном контексте כְּבָשִׂים обычно обозначает ягнят или молодых овец.
- source_word: וְנִסְכֵּיהֶם
  choice: и полагавшиеся к ним возлияния
  rationale: Притяжательный суффикс связывает жидкие приношения с перечисленными животными; добавление «полагавшиеся» естественно выражает эту сопутствующую функцию.
- source_word: וּזְבָחִים לָרֹב
  choice: а также множество жертв
  rationale: Фраза указывает на большое число дополнительных жертв помимо перечисленных всесожжений.
- source_word: לְכָל יִשְׂרָאֵל
  choice: для всего Израиля
  rationale: Широкое значение предлога ל сохранено без навязывания более узкого представительного или искупительного смысла.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано личное заветное имя, непосредственно стоящее в еврейском тексте, а не его традиционная замена титулом.
- issue: Смысл לְכָל יִשְׂרָאֵל
  choice: для всего Израиля
  alternative: за весь Израиль; от имени всего Израиля
  rationale: Формулировка сохраняет широкий смысл еврейского предлога и не уточняет без необходимости, были ли жертвы принесены ради народа или представительски от его имени.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Термины «всесожжения» и «возлияния» сохранены ради точности, причём менее знакомое слово «возлияния» пояснено в сноске. Синтаксис упрощён для ясного чтения, а смысловые различия между жертвами и всесожжениями сохранены.
