base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: ru
  text: Все сановники, доблестные мужи, а также все сыновья царя Давида подчинились царю Соломону.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дали руку под царя Соломона» — еврейское выражение, означающее подчинение или заверение в верности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: сановники
  rationale: Слово обозначает правителей или высокопоставленных должностных лиц. «Сановники» естественно для царского двора и не сужает значение до военного командования.
- source_word: גִּבֹּרִים
  choice: доблестные воины
  rationale: В данном повествовательном контексте термин, обозначающий сильных и доблестных мужей, вероятнее всего имеет военный оттенок; перевод сохраняет представление об их доблести и силе.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: сыновья царя Давида
  rationale: Прямо сохраняет родство и царский титул Давида.
- source_word: נָתְנוּ יָד תַּחַת
  choice: признали власть
  rationale: Еврейская идиома буквально говорит о передаче руки «под» царя и выражает подчинение и верность. «Признали власть» ясно передаёт это в современном русском, не добавляя прямо не названной клятвы.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: царя Соломона
  rationale: Естественный русский порядок слов передаёт приложение «Соломон, царь» и подчёркивает признание его царского положения.
theological_decisions:
- issue: Характер действия, выраженного идиомой נָתְנוּ יָד תַּחַת
  choice: признали власть царя Соломона
  alternative: поклялись в верности царю Соломону; подчинились царю Соломону
  rationale: Исходная идиома соединяет идеи подчинения и верности, но сама по себе не требует понимания действия как формальной клятвы. Выбранный перевод сохраняет политический смысл признания власти, а буквальный образ и диапазон значения пояснены в сноске.
translation_notes:
  register: Современный литературный русский с торжественным повествовательным оттенком. «Сановники» соответствует придворно-государственному контексту; синтаксис остаётся ясным для широкого читателя.
