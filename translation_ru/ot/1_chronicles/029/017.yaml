  source_fidelity: 'Основной смысл передан точно: Бог испытывает сердце, благоволит к нравственной правоте; Давид добровольно принёс дары и с радостью видит добровольные приношения присутствующего народа. Однако «от чистого сердца» заметно смещает בְּיֹשֶׁר לְבָבִי от честности/правоты к чистоте или искренности. Добавленное «и» перед «Твой народ» не имеет опоры в исходном тексте.'
