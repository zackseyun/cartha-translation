  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: ru
  text: И я знаю, Боже мой, что Ты испытываешь сердце и благоволишь к правоте. Я с честным сердцем добровольно пожертвовал всё это, а теперь с радостью вижу, как Твой народ, находящийся здесь[a], добровольно жертвует Тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «который нашёлся здесь»; то есть присутствует здесь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: испытываешь сердце
  rationale: Передаёт оценочный смысл בֹּחֵן и сохраняет библейский образ сердца как внутреннего человека, включая мысли и намерения.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: благоволишь к прямоте
  rationale: מֵישָׁרִים обозначает нравственную прямоту, а רצה — благосклонное принятие или удовольствие; формулировка сохраняет оба оттенка.
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: от чистого сердца
  rationale: Естественное русское выражение для искреннего и нравственно цельного намерения; избегает тяжеловесного буквального «в прямоте моего сердца».
- source_word: הִתְנַדַּבְתִּי
  choice: добровольно пожертвовал
  rationale: Форма от נדב выражает добровольность дара, а «пожертвовал» соответствует контексту приношений на храм.
- source_word: כָל אֵלֶּה
  choice: всё это
  rationale: Указание относится к перечисленным ранее дарам; русский оборот естественен и не вводит лишней конкретизации.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: Твой народ, находящийся здесь[a]
  rationale: נמצא в нифале буквально означает «находиться/быть найденным», а в данном контексте — присутствовать; перевод сохраняет близость к форме источника.
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: с радостью вижу
  rationale: Предложная группа естественно относится к тому, как Давид наблюдает за народом, и сохраняет эту синтаксическую связь.
- source_word: לְהִתְנַדֶּב לָךְ
  choice: добровольно жертвует Тебе
  rationale: Повторяет ключевую идею добровольного приношения и ясно обозначает Бога как адресата дара.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Естественная русская форма прямого обращения с притяжательным значением.
theological_decisions:
- issue: Антропологический смысл לֵבָב
  choice: сердце как внутренний человек, включая волю и намерения
  alternative: ум; внутреннее существо
  rationale: «Сердце» сохраняет исходную метафору и не сужает широкое древнееврейское значение до одной рассудочной способности.
- issue: Связь מֵישָׁרִים תִּרְצֶה с нравственным качеством
  choice: Бог благоволит к прямоте
  alternative: Бог одобряет правое; Бог радуется честности
  rationale: Перевод не уточняет сверх текста, идёт ли речь прежде всего о внутренней цельности или о правом поведении, и сохраняет богословское напряжение между испытанием сердца и благосклонностью к прямоте.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы как редакционная норма. Повтор «добровольно» намеренно сохраняет повтор корня נדב в исходном тексте.
