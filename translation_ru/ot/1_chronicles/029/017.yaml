  terminology: «Испытываешь сердце», «благоволишь к правоте», «добровольно пожертвовал/жертвует» и «Боже мой» уместны по регистру и соответствуют еврейскому тексту. «Правота» точнее «чистоты» отражает יֹשֶׁר и מֵישָׁרִים.
