source:
  edition: WLC
  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: ru
  text: Кроме того, поскольку мне дорог дом моего Бога[a], у меня есть своё сокровище[b] — золото и серебро; я отдал его дому моего Бога сверх всего, что я приготовил для святого дома[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в моём благоволении к дому моего Бога». Возможный перевод: «из любви к дому моего Бога» или «поскольку дом моего Бога мне дорог».'
    reason: Сочетание בִּרְצוֹתִי בְּבֵית אֱלֹהַי выражает благоволение, удовольствие или расположение по отношению к дому Бога; роль предлога בְּ допускает несколько близких передач.
  - marker: b
    text: 'Или: «личное сокровище», «особо ценное имущество».'
    reason: סְגֻלָּה обозначает ценную, особо выделенную собственность; в контексте это личное достояние Давида, отличное от уже подготовленного для святого дома.
  - marker: c
    text: 'Или: «для святилища»; буквально: «для дома святости».'
    reason: לְבֵית הַקֹּדֶשׁ буквально содержит слово «дом» и может быть передано как «святой дом» либо, по контексту, «святилище».
lexical_decisions:
- source_word: וְעוֹד
  choice: Кроме того
  rationale: 'Передаёт присоединительное и усилительное значение: Давид добавляет к ранее перечисленным приготовлениям ещё и личный дар.'
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: из любви к дому моего Бога
  rationale: רצון здесь обозначает расположение, удовольствие, горячую привязанность; русское «из любви к» естественно выражает мотив Давида, не сводя его слова к простому желанию.
- source_word: יֶשׁ לִי סְגֻלָּה
  choice: собственное сокровище
  rationale: Оборот יֶשׁ לִי выражает обладание, а סְגֻלָּה — особо ценимое личное имущество. «Собственное сокровище» подчёркивает отличие личных средств Давида от уже подготовленных запасов.
- source_word: זָהָב וָכָסֶף
  choice: золото и серебро
  rationale: Прямое и однозначное обозначение драгоценных металлов.
- source_word: נָתַתִּי לְבֵית אֱלֹהַי
  choice: я отдаю дому моего Бога
  rationale: Еврейский перфект обозначает совершённое решение или действие, актуальное в момент речи. В контексте публичного объявления дара русское настоящее «отдаю» звучит естественно и сохраняет перформативную силу высказывания.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: сверх всего, что я приготовил
  rationale: Точно передаёт значение добавления сверх полного объёма прежних приготовлений.
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: для святого дома
  rationale: Сохраняет повтор ключевого слова בַּיִת, а конструкцию «дом святости» естественно передаёт определением «святой».
theological_decisions:
- issue: Обозначение будущего храма в речи Давида
  choice: дом / святой дом
  alternative: храм / святилище
  rationale: В еврейском тексте последовательно употреблено בַּיִת, «дом». Такой перевод сохраняет образ дома Бога и не подменяет его более узким термином «храм».
- issue: Характер личного дара Давида
  choice: собственное сокровище
  alternative: особое сокровище / личное имущество
  rationale: Слово סְגֻלָּה указывает на ценную собственность, которой Давид распоряжается лично. Формулировка не утверждает какого-либо особого сакрального статуса самого имущества.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Повтор «дому моего Бога» сохранён как значимый повтор исходного текста. Настоящее время «отдаю» передаёт публично объявляемый и актуальный дар; завершённость еврейского перфекта остаётся контекстуально возможной.
