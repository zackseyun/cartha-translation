base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: ru
  text: И сел Соломон на престол Яхве как царь вместо своего отца Давида; он преуспевал, и весь Израиль повиновался ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «слушал его»; здесь это выражение означает, что народ внимал царю и повиновался ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: сел
  rationale: Сохраняет конкретный образ еврейского глагола «сидеть»; сочетание «сел на престоле» естественно выражает вступление на царство, не превращая образ в пояснительный пересказ.
- source_word: כִּסֵּא יְהוָה
  choice: престоле Яхве
  rationale: Буквально передаёт конструкцию «престол Яхве» и сохраняет личное Божье имя, а также богословски значимое представление о царской власти, осуществляемой от имени Бога.
- source_word: לְמֶלֶךְ
  choice: как царь
  rationale: Предлог לְ здесь обозначает положение или служение; «как царь» ясно передаёт царский статус Соломона.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: вместо своего отца Давида
  rationale: תַּחַת в контексте династической преемственности означает замещение, а не просто последующее время.
- source_word: וַיַּצְלַח
  choice: он преуспевал
  rationale: Глагол צלח выражает успех и благополучное продвижение; несовершенный вид по-русски естественно представляет дальнейшее успешное царствование.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: повиновался ему
  rationale: Оборот שׁמע אל буквально связан со слушанием, но применительно к подданным и царю означает внимать власти и повиноваться ей. В единственном числе сказуемое согласовано с собирательным выражением «весь Израиль».
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Обычное собирательное обозначение народа как целого.
theological_decisions:
- issue: Смысл выражения «престол Яхве» применительно к царствованию Соломона
  choice: Сохранить выражение буквально, показывая, что престол Давидовой династии представлен как престол Яхве.
  alternative: Передать описательно как «престол, принадлежащий Яхве» либо свести выражение к обычному политическому престолу.
  rationale: Летописец намеренно связывает царскую власть Соломона с Божьим правлением. Формулировка сохраняет это утверждение, не уточняя сверх текста, каким именно образом соотносятся Божья и человеческая царская власть.
- issue: Степень повиновения в וַיִּשְׁמְעוּ אֵלָיו
  choice: Передать «повиновался ему», отметив буквальную альтернативу в сноске.
  alternative: «слушал его» или «внимал ему».
  rationale: Царский контекст поддерживает значение послушания, но сноска сохраняет лексическую широту еврейского оборота.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союзная цепочка оригинала слегка упорядочена точкой с запятой; богословски значимые образы и личное имя Яхве сохранены.
