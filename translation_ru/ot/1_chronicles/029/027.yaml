  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: ru
  text: 'Он царствовал над Израилем сорок лет: в Хевроне царствовал семь лет, и в Иерусалиме царствовал тридцать три года.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: Он царствовал… сорок лет
  rationale: Еврейская конструкция буквально говорит о «днях, которые он царствовал», то есть о продолжительности царствования. По-русски естественнее выразить этот временной смысл непосредственно, не сохраняя неестественное «дни, которые».
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при глаголе מלך обозначает народ, над которым осуществляется царская власть. Слово «всем» не добавлено, поскольку в данном стихе его нет.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Стандартная русская передача еврейского числительного с существительным в единственном числе при десятках.
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: в Хевроне царствовал семь лет
  rationale: Сохранены место, повтор глагола и параллельное построение исходного текста.
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: а в Иерусалиме — тридцать три года
  rationale: Союз передаёт сопоставление двух мест царствования; тире естественно восполняет опущенный в русском повтор сказуемого, тогда как значение еврейского текста остаётся ясным.
