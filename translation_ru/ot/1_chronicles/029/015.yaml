source:
  edition: WLC
  text: כִּֽי גֵרִ֨ים אֲנַ֧חְנוּ לְ/פָנֶ֛י/ךָ וְ/תוֹשָׁבִ֖ים כְּ/כָל אֲבֹתֵ֑י/נוּ כַּ/צֵּ֧ל יָמֵ֛י/נוּ עַל הָ/אָ֖רֶץ וְ/אֵ֥ין מִקְוֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: ru
  text: Ведь мы пред Тобой странники[a] и временные жители[b], как и все наши предки. Наши дни на земле — словно тень, и нет надежды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришельцы», «чужеземцы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поселенцы», то есть живущие не как коренные и постоянные жители.'
    reason: lexical_alternative
  - marker: c
    text: В ближайшем контексте речь идёт о быстротечности человеческой жизни на земле; эти слова не обязательно означают полное отсутствие надежды на Бога.
    reason: cross_reference
lexical_decisions:
- source_word: גֵרִים
  choice: странники
  rationale: Слово обозначает людей, живущих не на своей земле и не обладающих полным статусом коренных жителей. «Странники» естественно передаёт непостоянство их положения, не сводя смысл к краткому путешествию.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Буквально «перед Твоим лицом». Краткое и естественное выражение сохраняет направленность молитвы к Богу.
- source_word: תוֹשָׁבִים
  choice: временные жители
  rationale: Обозначает проживающих в стране без полного и постоянного статуса. Такой перевод ясно передаёт параллель с גֵרִים и тему непрочности человеческой жизни.
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: как и все наши предки
  rationale: В данном контексте אֲבֹתֵינוּ охватывает прежние поколения Израиля. «Предки» звучит современно и передаёт историческую преемственность без неоправданного сужения смысла.
- source_word: כַּצֵּל
  choice: словно тень
  rationale: Сохранён библейский образ быстротечности и непрочности человеческой жизни.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: наши дни на земле
  rationale: Прямой и естественный перевод пространственно-временного выражения.
- source_word: וְאֵין מִקְוֶה
  choice: и нет надежды
  rationale: מִקְוֶה может означать «надежда» или «ожидание». Сохранена краткая и напряжённая формулировка оригинала; контекст связывает её с быстротечностью земной жизни.
theological_decisions:
- issue: Смысл וְאֵין מִקְוֶה в контексте человеческой смертности
  choice: «и нет надежды» — без добавленного в основной текст уточнения
  alternative: «и нет ожидания [продолжения]»; «и нет ничего прочного»
  rationale: Еврейская формулировка категорична и допускает напряжение. Основной текст не смягчает её богословским пояснением, а примечание лишь указывает на ближайший контекст быстротечности жизни, не превращая это в отрицание всякой надежды на Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы. Образы и резкость заключительной фразы сохранены; архаичные и конфессионально нагруженные формулировки не вводились.
