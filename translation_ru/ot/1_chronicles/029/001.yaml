base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: ru
  text: 'И сказал царь Давид всему собранию: «Соломон, сын мой, — тот, кого избрал Бог, — молод и неопытен, а дело велико, потому что этот дворец[a] — не для человека, а для Господа[b] Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крепость». Еврейское слово может обозначать дворец или крепость; здесь так назван храм Господа.'
    reason: Поясняет необычное обозначение храма и сохраняет лексическую многозначность оригинала.
  - marker: b
    text: В еврейском тексте здесь стоит имя Бога יהוה (ЙХВХ), традиционно передаваемое как «Господь».
    reason: Делает прозрачной передачу тетраграмматона без нарушения естественности русского текста.
lexical_decisions:
- source_word: הַקָּהָל
  choice: собрание
  rationale: Передаёт общину, созванную как единое собрание, и естественно звучит в данном официальном контексте.
- source_word: אֶחָד בָּחַר בּוֹ אֱלֹהִים
  choice: тот, кого избрал Бог
  rationale: Сохраняет выделение Соломона как избранного Богом, не превращая אֶחָד в избыточное числительное и не уточняя сверх текста, был ли он единственным возможным избранником.
- source_word: נַעַר וָרָךְ
  choice: молод и неопытен
  rationale: В этом контексте רַךְ указывает не просто на физическую нежность, а на незрелость и недостаток опыта перед великим поручением.
- source_word: הַמְּלָאכָה
  choice: дело
  rationale: Обозначает предстоящую работу или задачу по строительству храма; широкое русское «дело» сохраняет объём значения.
- source_word: הַבִּירָה
  choice: чертог
  rationale: Редкое слово обозначает крупное дворцовое или крепостное сооружение; здесь оно относится к будущему храму как чертогу Бога. «Чертог» сохраняет возвышенный образ, не называя сооружение обычным человеческим дворцом.
- source_word: יהוה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона в библейском тексте; примечание указывает форму еврейского имени.
theological_decisions:
- issue: Характер Божьего избрания Соломона
  choice: тот, кого избрал Бог
  alternative: единственный, кого избрал Бог
  rationale: Выбранная формулировка передаёт акцент אֶחָד, но не усиливает его до исключительности, которая может восприниматься как отдельное богословское утверждение сверх непосредственного контекста.
- issue: Назначение строящегося сооружения
  choice: не для человека, а для Господа Бога
  alternative: принадлежит не человеку, а Господу Богу
  rationale: 'Сохранена краткая и напряжённая конструкция оригинала: храм предназначен Богу, хотя его строят люди; отношение владения или присутствия дополнительно не конкретизируется.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Начальное «И сказал» сохраняет повествовательную связь стиха с контекстом; порядок слов остаётся естественным для русского языка.
