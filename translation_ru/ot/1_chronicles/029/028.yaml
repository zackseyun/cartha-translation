  text: וַ/יָּ֨מָת֙ בְּ/שֵׂיבָ֣ה טוֹבָ֔ה שְׂבַ֥ע יָמִ֖ים עֹ֣שֶׁר וְ/כָב֑וֹד וַ/יִּמְלֹ֛ךְ שְׁלֹמֹ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/028.yaml
  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: ru
  text: И умер он в доброй старости, насытившись днями[a], богатством и почётом; и воцарился вместо него его сын Соломон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «насытившись днями»; то есть прожив долгую, исполненную жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер он
  rationale: Последовательная форма глагола מות продолжает повествование; союз «и» сохраняет простую связь с предыдущими событиями.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: в доброй старости
  rationale: Перевод сохраняет положительную оценку старости в еврейском выражении, не подменяя её более конкретными понятиями глубокой или счастливой старости.
- source_word: שְׂבַע יָמִים
  choice: насытившись днями
  rationale: 'Сохраняется образ еврейской идиомы: человек прожил долгую, исполненную жизнь и был удовлетворён её продолжительностью.'
- source_word: עֹשֶׁר וְכָבוֹד
  choice: богатством и почётом
  rationale: עֹשֶׁר обозначает материальное богатство, а כָבוֹד в данном царском контексте — общественный почёт и высокое положение.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: В контексте престолонаследия форма מלך указывает на вступление Соломона в царствование; «воцарился» передаёт это кратко и естественно.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: его сын Соломон
  rationale: Такой порядок слов естественен для современного русского языка и точно передаёт родственную связь.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Формула престолонаследия означает, что Соломон занял место Давида как царь.
