source:
  edition: WLC
  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: ru
  text: И Соломону, сыну моему, дай сердце, всецело преданное Тебе, чтобы соблюдать Твои заповеди, Твои свидетельства и Твои установления, исполнять всё это и построить крепость[a], которую я подготовил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «дворец». Еврейское слово необычно и может обозначать величественное или укреплённое сооружение; в данном контексте оно относится к святилищу, для которого Давид сделал приготовления.
    reason: Лексическая неоднозначность слова בִּירָה и его контекстуальная отсылка к святилищу.
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: А Соломону, сыну моему, дай
  rationale: Сохраняет косвенное дополнение и прямую форму молитвенной просьбы; порядок слов естественен для современного русского языка.
- source_word: לֵבָב שָׁלֵם
  choice: цельное сердце
  rationale: Передаёт образ сердца как внутренней воли и значение полноты, целостности и искренности, не сводя выражение только к значению «неразделённое» и не вводя идею безгрешного совершенства.
- source_word: לִשְׁמוֹר
  choice: соблюдать
  rationale: Обычное русское соответствие глаголу שׁמר при заповедях и иных предписаниях.
- source_word: מִצְוֺתֶיךָ
  choice: Твои заповеди
  rationale: Традиционное и понятное обозначение Божьих повелений; прописная буква соответствует принятому в русском религиозном письме уважительному оформлению обращения к Богу.
- source_word: עֵדְוֺתֶיךָ
  choice: Твои свидетельства
  rationale: Формально сохраняет особый заветно-правовой термин и его отличие от заповедей и установлений.
- source_word: וְחֻקֶּיךָ
  choice: и Твои установления
  rationale: Передаёт смысл закреплённых предписаний и сохраняет отличие от двух соседних терминов.
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: исполнять всё это
  rationale: Естественно связывает «всё» с перечисленными заповедями, свидетельствами и установлениями.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: и построить крепость
  rationale: Передаёт основное значение редкого слова בירה без включения слова «храм» непосредственно в текст; контекстуальный культовый референт и возможные значения разъясняются в сноске.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: которую я подготовил
  rationale: Сохраняет относительную конструкцию и совершённость предварительного приготовления, не конкретизируя, шла ли речь о замысле, материалах или иных приготовлениях.
theological_decisions:
- issue: Значение בִּירָה применительно к Иерусалимскому святилищу
  choice: крепость с пояснительной сноской
  alternative: дворец; храм; храм-крепость
  rationale: Само слово обозначает крупное дворцовое или укреплённое сооружение, тогда как в данном контексте речь идёт о святилище, подготовленном Давидом к строительству. Основной текст сохраняет необычную лексику источника, а сноска предотвращает ошибочное понимание как светской крепости.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис слегка упрощён через придаточное с «чтобы», при этом три цели — соблюдать, исполнять и построить — сохранены параллельно. Термины «заповеди», «свидетельства» и «установления» намеренно не сведены к одному общему обозначению.
