  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: ru
  text: Тогда главы родов[a], главы племён Израиля, начальники тысяч и сотен[b], а также начальники, ведавшие царскими работами, добровольно внесли пожертвования[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально означает «предводители отцов»; имеются в виду главы родовых объединений, связанных общим происхождением по отцовской линии.
    reason: cultural_note
  - marker: b
    text: «Тысячи» и «сотни» — военные или административные подразделения.
    reason: cultural_note
  - marker: c
    text: 'Или: «добровольно принесли дары». Еврейский глагол подчёркивает, что пожертвования были сделаны по доброй воле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: добровольно внесли пожертвования
  rationale: Форма глагола נדב подчёркивает свободное волеизъявление; ближайший контекст говорит именно о материальных дарах на храм, поэтому значение передано явно, без сведения смысла к общему «вызвались».
- source_word: שָׂרֵי הָאָבוֹת
  choice: главы родов
  rationale: Выражение обозначает руководителей родовых объединений, основанных на происхождении по отцовской линии. «Главы родов» естественно звучит по-русски, а культурная специфика пояснена в сноске.
- source_word: שָׂרֵי שִׁבְטֵי יִשְׂרָאֵל
  choice: главы племён Израиля
  rationale: Прямой и общепонятный перевод обозначения руководителей племенных подразделений Израиля.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: начальники тысяч и сотен
  rationale: Сохраняет традиционные названия военных или административных подразделений и ясно указывает, что речь идёт об их начальниках.
- source_word: וּלְשָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: а также начальники, ведавшие царскими работами
  rationale: Передаёт ещё одну группу должностных лиц и административный оттенок מְלָאכָה. Оборот «ведавшие царскими работами» естественнее буквального «начальники работы царя» и не сужает круг обязанностей до одного проекта.
