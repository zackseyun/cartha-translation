  source_fidelity: 'Перевод точно передаёт последовательность еврейского текста: праздничную трапезу перед Яхве, повторное воцарение Соломона, его помазание в связи с Яхве как נָגִיד и поставление Садока священником. «Во второй раз» верно отражает שֵׁנִית, а «поставили ... царём» адекватно передаёт каузативное וַיַּמְלִיכוּ. Неоднозначность לַיהוָה не снята догматически и корректно отмечена в сноске.'
