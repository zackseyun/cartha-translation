  text: וַ/יֹּאכְל֨וּ וַ/יִּשְׁתּ֜וּ לִ/פְנֵ֧י יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/יַּמְלִ֤יכוּ שֵׁנִית֙ לִ/שְׁלֹמֹ֣ה בֶן דָּוִ֔יד וַ/יִּמְשְׁח֧וּ לַ/יהוָ֛ה לְ/נָגִ֥יד וּ/לְ/צָד֖וֹק לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: ru
  text: И ели они и пили пред Яхве в тот день с великой радостью. И во второй раз поставили Соломона, сына Давида, царём[a], и помазали его для Яхве как правителя[b], а Садока — как священника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «снова поставили Соломона, сына Давида, царём».'
    reason: Лексема שֵׁנִית может быть передана менее конкретным наречием «снова», хотя буквально указывает на второй раз.
  - marker: b
    text: 'Или: «помазали его пред Яхве как правителя». Еврейское выражение может указывать либо на посвящение Яхве, либо на действие, совершённое в его присутствии. Слово נָגִיד также можно перевести как «вождь» или «князь».'
    reason: Сохранена неоднозначность לַיהוָה и смысловой диапазон נָגִיד.
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: пред Яхве
  rationale: Оборот буквально обозначает пребывание перед Яхве, в его присутствии; «пред Яхве» сохраняет культовый оттенок и звучит достойно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: с великой радостью
  rationale: Естественно передаёт обстоятельство образа действия и силу исходного выражения.
- source_word: וַיַּמְלִיכוּ
  choice: поставили ... царём
  rationale: Каузативная форма глагола מלך означает сделать царём, поставить на царство; перевод не добавляет прямо не названного обряда коронации.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Сохраняет явное указание не просто на повторение, а на вторичность действия.
- source_word: וַיִּמְשְׁחוּ
  choice: помазали
  rationale: Стандартное обозначение обрядового помазания при поставлении на царское и священническое служение.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Сохраняет вероятное значение посвящения или назначения для служения Яхве, не исключая оттенка совершения действия перед ним.
- source_word: לְנָגִיד
  choice: как правителя
  rationale: נָגִיד обозначает поставленного руководителя; «правитель» ясно передаёт властную функцию, не внося наследственно-аристократического оттенка слова «князь».
- source_word: לְכֹהֵן
  choice: как священника
  rationale: Прямо передаёт священническую должность и сохраняет синтаксический параллелизм.
- source_word: בֶן דָּוִיד
  choice: сына Давида
  rationale: Сохраняет династическое и родственное обозначение Соломона.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Смысл לַיהוָה при помазании
  choice: помазали его для Яхве
  alternative: помазали его пред Яхве; помазали его Яхве
  rationale: Предлог ל может выражать посвящение, отношение или назначение. Основной текст отражает посвящение Яхве, а примечание сохраняет возможный пространственно-обрядовый смысл.
- issue: Соотношение царского и священнического поставления
  choice: Соломон помазан как правитель, Садок — как священник
  alternative: Грамматически можно понять общий глагол помазания как относящийся к обоим назначениям
  rationale: Перевод сохраняет эллиптический параллелизм еврейского текста и не смешивает две должности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Форма «пред Яхве» выбрана как устойчивая и компактная; синтаксис слегка упорядочен для ясности, при этом повтор союзов и параллелизм исходного текста сохранены.
