  terminology: «Яхве», «царь», «помазали», «правитель» и «священник» переданы последовательно и соответствуют исходнику. «Правитель» удачно передаёт נָגִיד, не отождествляя его без остатка с титулом «царь». Имя Садок передано в нормативной русской форме.
