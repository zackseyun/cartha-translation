  yaml_path: translation/ot/1_chronicles/029/026.yaml
  text: And David son of Jesse reigned over all Israel.
translation:
  language: ru
  text: И Давид, сын Иессея, царствовал над всем Израилем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: И Давид
  rationale: Союз וְ передаёт повествовательное продолжение; простое «И» сохраняет связь с предыдущим контекстом. Имя דָוִיד традиционно передано как «Давид».
- source_word: בֶּן יִשָׁי
  choice: сын Иессея
  rationale: Сопряжённое сочетание буквально обозначает родство. Форма «сын Иессея» естественна для современного литературного русского языка и сохраняет традиционную передачу имени.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Qal perfect глагола מלך в данном контексте обозначает осуществление царской власти, а не только восшествие на престол.
- source_word: עַל
  choice: над
  rationale: При глаголе מלך предлог עַל указывает на народ, которым правит царь; по-русски это естественно выражается сочетанием «царствовать над».
- source_word: כָּל יִשְׂרָאֵל
  choice: всем Израилем
  rationale: כָּל выражает полноту охвата народа; творительный падеж после «над» требует формы «всем Израилем».
