base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: ru
  text: Но кто я и кто мой народ, что мы способны так охотно жертвовать?[a] Ведь всё — от Тебя, и полученное из Твоей руки мы отдали Тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что мы имеем силу, чтобы добровольно пожертвовать так?»; выражение означает способность или наличие средств принести такой дар.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Но
  rationale: Союз вводит смиренный риторический поворот в молитве Давида; «но» естественно передаёт контраст с предшествующим благодарением.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: кто я и кто мой народ
  rationale: Вопросительное מִי означает «кто» и здесь выражает осознание своего недостоинства и положения, а не вопрос о сущности.
- source_word: נַעְצֹר כֹּחַ
  choice: мы способны
  rationale: Буквально идиома говорит об удержании или сохранении силы, но в данном контексте обозначает возможность или наличие средств для пожертвования.
- source_word: לְהִתְנַדֵּב
  choice: охотно жертвовать
  rationale: Форма от נדב обозначает добровольное, исходящее из желания приношение; «охотно жертвовать» сохраняет и добровольность, и контекст дара Богу.
- source_word: כָּזֹאת
  choice: так
  rationale: Указывает на описанную ранее необычайную щедрость; краткое «так» естественно для современного русского языка.
- source_word: מִמְּךָ הַכֹּל
  choice: всё — от Тебя
  rationale: Формулировка прямо и ёмко сохраняет мысль о Боге как источнике всего, не добавляя отсутствующего в тексте пояснения.
- source_word: וּמִיָּדְךָ
  choice: полученное из Твоей руки
  rationale: Сохраняется прозрачный еврейский образ руки как источника дара и обеспечения; добавленное «полученное» лишь делает синтаксическую связь естественной по-русски.
- source_word: נָתַנּוּ לָךְ
  choice: мы отдали Тебе
  rationale: Прошедшее совершенного вида передаёт завершённое действие; «отдали» подчёркивает, что принесённое прежде было получено от Бога, не превращая эту мысль в развёрнутую парафразу.
theological_decisions:
- issue: Божественная принадлежность всего и человеческое приношение
  choice: Текст подчёркивает, что всё происходит от Бога и что принесённое народом получено из Его руки.
  alternative: 'Можно было бы истолковательно перевести: «мы лишь возвратили Тебе то, что и так принадлежит Тебе».'
  rationale: Еврейский текст прямо утверждает происхождение всего от Бога и зависимость человеческого дара от Его предварительного даяния, но не формулирует более позднее учение о распоряжении вверенным имуществом.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Сохранён образ «из Твоей руки», а редкая еврейская идиома пояснена в сноске.
