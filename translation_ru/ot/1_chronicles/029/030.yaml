lexical_decisions:
- source_word: עִם
  choice: а также
  rationale: В данном итоговом перечислении передаёт присоединительное значение предлога и естественно связывает стих с предшествующим контекстом.
- source_word: מַלְכוּתוֹ
  choice: его царствование
  rationale: Контекст подводит итог жизни и правлению Давида, поэтому временное и деятельностное значение точнее территориального «царство».
- source_word: גְבוּרָתוֹ
  choice: его могущество
  rationale: Сохраняет широкий смысл силы, доблести и мощи, не сужая его до отдельных подвигов.
- source_word: הָעִתִּים
  choice: времена
  rationale: Прямо передаёт множественное число и сохраняет обобщённое указание на исторические периоды и обстоятельства.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: прошедшие над ним
  rationale: Сохраняет образную еврейскую конструкцию и её намеренную широту; более идиоматический вариант указан в сноске.
- source_word: וְעַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: 'Повтор предлога сохраняет параллелизм: над ним, над Израилем, над царствами.'
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: все царства земель
  rationale: Передаёт множественное число «земель» и не расширяет выражение до универсального «всей земли».
