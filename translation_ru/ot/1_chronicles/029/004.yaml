  text: שְׁלֹ֧שֶׁת אֲלָפִ֛ים כִּכְּרֵ֥י זָהָ֖ב מִ/זְּהַ֣ב אוֹפִ֑יר וְ/שִׁבְעַ֨ת אֲלָפִ֤ים כִּכַּר כֶּ֨סֶף֙ מְזֻקָּ֔ק לָ/ט֖וּחַ קִיר֥וֹת הַ/בָּתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: ru
  text: три тысячи талантов золота из Офира[a] и семь тысяч талантов очищенного серебра[b], чтобы покрыть стены зданий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «офирского золота». Еврейское выражение может указывать на происхождение золота из Офира либо характеризовать его как офирское золото.'
    reason: lexical_alternative
  - marker: b
    text: Талант — единица веса.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: три тысячи
  rationale: Прямая и естественная передача количественного числительного.
- source_word: כִּכְּרֵי / כִּכַּר
  choice: талантов
  rationale: Историческое название крупной единицы веса; оно сохраняет древнюю меру, не подменяя её неточным современным эквивалентом.
- source_word: זָהָב
  choice: золота
  rationale: Прямое обозначение драгоценного металла.
- source_word: מִזְּהַב אוֹפִיר
  choice: золота из Офира
  rationale: Предлог מִן передан как указание на происхождение, а Офир — как географическое название. Возможное понимание как качественной характеристики отмечено в сноске.
- source_word: וְשִׁבְעַת אֲלָפִים
  choice: и семь тысяч
  rationale: Прямая передача числового сочетания с союзом.
- source_word: כֶּסֶף
  choice: серебра
  rationale: В контексте строительных даров слово обозначает драгоценный металл, а не деньги.
- source_word: מְזֻקָּק
  choice: очищенного
  rationale: Страдательное причастие обозначает металл, прошедший очистку; выбран обычный русский термин для металлургического контекста.
- source_word: לָטוּחַ
  choice: покрыть
  rationale: В данном контексте речь идёт о нанесении слоя драгоценного металла на поверхность стен; «покрыть» естественно передаёт действие, не вызывая ассоциации исключительно со штукатуркой.
- source_word: קִירוֹת
  choice: стены
  rationale: Стандартная передача существительного во множественном числе.
- source_word: הַבָּתִּים
  choice: зданий
  rationale: Хотя буквальное значение — «домов», храмовый контекст указывает на сооружения или помещения; «зданий» сохраняет требуемую широту и не создаёт впечатления жилых домов.
