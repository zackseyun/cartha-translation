  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: ru
  text: И они пожертвовали для служения Дому Божьему пять тысяч талантов золота и десять тысяч дариков[a], десять тысяч талантов серебра, восемнадцать тысяч талантов бронзы и сто тысяч талантов железа.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Дарик — персидская золотая монета.
    reason: cultural_note
  - marker: b
    text: Талант — древняя крупная единица веса.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: И пожертвовали
  rationale: Глагол נתן буквально означает «дали», но в контексте добровольных приношений русское «пожертвовали» естественно и точно передаёт характер действия.
- source_word: לַעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: на служение в доме Бога
  rationale: עֲבוֹדָה допускает значения «служение» и «работа». Формулировка сохраняет храмовый оттенок и не сужает смысл исключительно до строительства.
- source_word: כִּכָּרִים
  choice: талантов
  rationale: Традиционное обозначение древней крупной единицы веса; пояснение предотвращает смешение с современным значением слова «талант».
- source_word: אֲדַרְכֹנִים
  choice: дариков
  rationale: Персидское заимствование обозначает исторически конкретную золотую монету — дарик; транслитерация точнее общего «золотые монеты».
- source_word: נְחֹשֶׁת
  choice: бронзы
  rationale: Слово может обозначать медь или бронзу; в перечне металлов для храмовых работ «бронза» является естественным и традиционным соответствием.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: восемнадцать тысяч
  rationale: Еврейская конструкция буквально складывает десять тысяч и восемь тысяч; суммарное число естественнее по-русски.
- source_word: בַרְזֶל
  choice: железа
  rationale: Стандартное соответствие названию металла.
theological_decisions: []
