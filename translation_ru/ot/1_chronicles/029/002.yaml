base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: ru
  text: 'И всеми своими силами я приготовил для дома моего Бога: золото для изделий из золота, серебро для изделий из серебра, бронзу для изделий из бронзы, железо для изделий из железа и дерево для деревянных изделий; ониксовые камни[a], оправы[b], камни сурьмы[c], пёстрые камни[d], всякие драгоценные камни и камни из мрамора во множестве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное определение некоторых камней в этом стихе остаётся неясным. Переводы «оникс» для שֹׁהַם и «мрамор» для שַׁיִשׁ следуют распространённой традиции; предлагались и другие варианты.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «гнёзда», «вставки». Значение מִלּוּאִים в данном перечне точно не установлено.'
    reason: lexical_alternative
  - marker: c
    text: Выражение אַבְנֵי פוּךְ трудно для истолкования. Оно может обозначать камни, связанные с сурьмой или тёмным пигментом, декоративные вставки либо иной отделочный материал.
    reason: lexical_alternative
  - marker: d
    text: Слово רִקְמָה здесь передано как «пёстрые камни» с учётом перечня камней и строительных материалов; в других контекстах оно может обозначать узорчатую или вышитую работу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל כֹּחִי
  choice: И всеми силами
  rationale: Оборот выражает полноту приложенных Давидом сил и возможностей. Русское «всеми силами» естественно передаёт личную напряжённость высказывания, не сводя его только к финансовым средствам.
- source_word: הֲכִינוֹתִי
  choice: я приготовил
  rationale: 'Перфект обозначает уже совершённую подготовку, значимую в момент речи. «Приготовил» сохраняет широкий смысл: Давид заранее собрал и назначил материалы для строительства.'
- source_word: לְבֵית אֱלֹהַי
  choice: для дома моего Бога
  rationale: Сохранено буквальное и личностно окрашенное еврейское выражение; слово «храм» было бы допустимым контекстуальным истолкованием, но менее точно воспроизводило бы форму оригинала.
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: золото для золотых изделий ... дерево для деревянных
  rationale: Повтор материала с предлогом ל указывает на предназначение каждого материала для соответствующих изделий. Слово «изделий» названо один раз и далее естественно подразумевается, что сохраняет параллелизм без тяжеловесного повторения.
- source_word: נְחֹשֶׁת
  choice: бронза
  rationale: Слово может обозначать медь или бронзу. В контексте храмовых принадлежностей традиционное «бронза» хорошо передаёт вероятный обрабатываемый металлический материал, при сохранении общей предметной категории.
- source_word: אַבְנֵי שֹׁהַם
  choice: камни оникса
  rationale: «Оникс» — распространённое традиционное соответствие, однако точный вид минерала не установлен; неопределённость отмечена в сноске.
- source_word: וּמִלּוּאִים
  choice: оправы
  rationale: Существительное связано с заполнением или вставлением и в ювелирно-декоративном контексте может обозначать оправы, гнёзда либо вставки. «Оправы» даёт понятный основной смысл, а варианты сохранены в сноске.
- source_word: אַבְנֵי פוּךְ
  choice: камни сурьмы
  rationale: פּוּךְ обычно обозначает сурьму или тёмный косметический пигмент. Близкий к форме оригинала перевод не конкретизирует неясный способ декоративного применения; трудность отражена в сноске.
- source_word: וְרִקְמָה
  choice: пёстрые камни
  rationale: רִקְמָה может относиться к пёстрой, узорчатой или вышитой работе. Среди камней и строительных материалов вероятен смысл разноцветного декоративного камня; добавление «камни» делает перечень понятным, а неоднозначность отмечена в сноске.
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: и множество мраморных камней
  rationale: «Мрамор» следует распространённому традиционному пониманию שַׁיִשׁ, а לָרֹב передано естественным русским оборотом «множество».
