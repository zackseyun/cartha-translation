  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: ru
  text: И теперь, Боже наш, мы благодарим тебя и восхваляем твоё славное имя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «имя твоей славы».'
    reason: Более буквальная передача сочетания לְשֵׁם תִּפְאַרְתֶּךָ, в котором «слава» выражена существительным, а не прилагательным.
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный וְ и временно-дискурсивное значение עַתָּה, естественно продолжая молитву.
- source_word: אֱלֹהֵינוּ
  choice: Боже наш
  rationale: Передаёт прямое обращение в молитве естественной для современного литературного русского языка формой звательного употребления, без добавления междометия «о».
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: мы благодарим тебя
  rationale: В данном богослужебном контексте Hiphil от ידה с дополнением לָךְ означает выражение благодарности; явное «мы» отражает אֲנַחְנוּ и его смысловое выделение.
- source_word: וּמְהַלְלִים
  choice: и восхваляем
  rationale: Причастие Piel от הלל обозначает хвалу, возвеличивание; «восхваляем» сохраняет высокий молитвенный регистр и отличается от «благодарим».
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: твоё славное имя
  rationale: Естественно передаёт еврейское сочетание «имя твоей славы», сохраняя значимое библейское понятие имени; более буквальная структура приведена в сноске.
theological_decisions:
- issue: Передача обращения к Богу без добавления литургического междометия
  choice: Боже наш
  alternative: О Боже наш
  rationale: Еврейский текст содержит прямое обращение, но не требует добавлять «о»; выбранная форма современна, торжественна и не вводит отсутствующий элемент.
- issue: Передача богословски значимого выражения об имени и славе
  choice: восхваляем твоё славное имя
  alternative: восхваляем имя твоей славы
  rationale: Слово «имя» сохранено как важный объект библейской хвалы. Основной текст звучит естественно по-русски, а сноска сохраняет более формальное строение исходного выражения, не сводя его к пересказу вроде «восхваляем тебя за твою славу».
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная орфографическая практика; смысл почтительного обращения при этом сохраняется.
