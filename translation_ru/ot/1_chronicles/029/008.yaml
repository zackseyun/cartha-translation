  source_fidelity: Смысл передачи храмовых ценностей в ведение Иехиила передан верно. Однако הַגֵּרְשֻׁנִּי — родовое обозначение («гершонит», то есть человек из рода Гершона), а не утверждение о личном происхождении в смысле «потомок». Добавление «драгоценные» контекстуально вероятно, но еврейское אֲבָנִים само по себе означает просто «камни»; для сохранения исходной формулировки это следует отразить в основном тексте.
  naturalness: «А у кого были ... те» естественно для повествовательного русского. «Под надзор Иехиила» возможно, но «на попечение Иехиила» точнее выражает передачу ценностей ответственному хранителю и звучит естественнее. «Из рода Гершона» современно и не создаёт ложного впечатления о прямом родстве.
