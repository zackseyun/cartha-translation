  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: ru
  text: А у кого были камни, те отдали их в сокровищницу дома Яхве, на попечение Иехиила, из рода Гершона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при руке Иехиила, гершонита». Это выражение означает передачу в его ведение или на его попечение. В данном контексте «камни» могут подразумевать драгоценные камни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: А у кого были
  rationale: Нифальный причастный оборот с אִתּוֹ идиоматически указывает на наличие чего-либо у человека; русское «у кого были» естественно передаёт распределительный смысл.
- source_word: אֲבָנִים
  choice: драгоценные камни
  rationale: Хотя буквально сказано «камни», контекст пожертвований для храма указывает на ценные камни; перевод передаёт контекстуальный смысл, не уточняя их вид.
- source_word: נָתְנוּ
  choice: отдали
  rationale: Глагол נתן означает передачу или дарение; «отдали» естественно описывает внесение добровольного пожертвования.
- source_word: לְאוֹצַר בֵּית יְהוָה
  choice: в сокровищницу дома Яхве
  rationale: אוֹצָר в контексте храмовых ценностей обозначает сокровищницу, а בֵּית сохраняется как «дом»; личное имя יהוה передано транслитерацией «Яхве».
- source_word: עַל יַד
  choice: под надзор
  rationale: Буквально «при руке»; здесь идиома выражает поручение ценностей ответственному лицу или их передачу под его попечение.
- source_word: יְחִיאֵל
  choice: Иехиила
  rationale: Имя передано принятой русской библейской формой и поставлено в родительный падеж после «под надзор».
- source_word: הַגֵּרְשֻׁנִּי
  choice: потомка Гершона
  rationale: Родовое обозначение указывает на принадлежность Иехиила к клану Гершона; такой перевод понятнее современному русскому читателю, чем субстантивированное «гершонит».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя-тетраграмматон; «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Значение אֲבָנִים в контексте пожертвований
  choice: драгоценные камни
  alternative: камни
  rationale: Само существительное означает «камни», однако контекст храмовой сокровищницы делает значение ценных камней наиболее вероятным. Возможная формальная передача отражена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка выровнен для естественности; сохранено выражение «дом Яхве». Родовое обозначение передано пояснительно как «потомок Гершона».
