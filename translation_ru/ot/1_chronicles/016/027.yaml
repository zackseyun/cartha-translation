source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: ru
  text: Великолепие и величие — пред Ним; сила и радость — в месте Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Его обители»; или: «в Его святилище». Буквально в еврейском: «в Его месте» — это выражение шире, чем параллельная формулировка в Псалме 95:6.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  choice: великолепие
  rationale: Передаёт торжественный блеск и достоинство; в паре с הָדָר не сливается с ним по значению.
- source_word: הָדָר
  choice: величие
  rationale: Сохраняет возвышенный, царственный оттенок и естественно сочетается с «великолепием».
- source_word: לְפָנָיו
  choice: пред Ним
  rationale: Точно передаёт пространственно-личностный образ «перед Ним» и соответствует возвышенному поэтическому регистру.
- source_word: עֹז
  choice: сила
  rationale: Прямое и понятное соответствие слову, обозначающему силу или могущество.
- source_word: חֶדְוָה
  choice: радость
  rationale: Естественно и кратко передаёт значение радости и сохраняет поэтическое равновесие со словом «сила».
- source_word: בִּמְקֹמוֹ
  choice: в месте Его
  rationale: Сохраняет широкое значение еврейского «в Его месте», не подменяя его более узким понятием святилища; инверсия поддерживает поэтический регистр.
theological_decisions:
- issue: Следует ли понимать מְקוֹמוֹ именно как святилище или храм
  choice: Сохранено широкое выражение «в месте Его»
  alternative: «в Его обители» или «в Его святилище»
  rationale: Хотя богослужебный контекст и параллель в Псалме 95:6 допускают более конкретное понимание, в 1 Паралипоменон употреблено общее слово מָקוֹם, поэтому основной текст не гармонизирован с параллельным местом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Парные существительные и тире сохраняют ритм стиха; местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
