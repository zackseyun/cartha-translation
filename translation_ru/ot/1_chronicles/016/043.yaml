lexical_decisions:
- source_word: וַיֵּלְכוּ כָל־הָעָם
  choice: весь народ разошёлся
  rationale: Глагол הלך обозначает следующее действие в повествовании; в сочетании с распределительным «каждый к себе домой» русское «разошёлся» естественно передаёт уход собравшихся людей.
- source_word: אִישׁ לְבֵיתוֹ
  choice: каждый к себе домой
  rationale: 'אִישׁ употреблено распределительно: каждый из народа направился в своё жилище. Русское «к себе домой» точно и естественно передаёт смысл, не создавая ненужного акцента на поле участников.'
- source_word: וַיִּסֹּב
  choice: повернул
  rationale: Форма от סבב указывает на поворот или перемену направления. «Повернул» сохраняет прямой смысл глагола; перевод «вернулся» был бы более интерпретирующим.
- source_word: לְבָרֵךְ
  choice: чтобы благословить
  rationale: Инфинитив с לְ выражает цель действия, а ברך прямо означает «благословлять».
- source_word: אֶת־בֵּיתוֹ
  choice: своих домашних
  rationale: בַּיִת может обозначать не только здание, но и домочадцев, семью или всё домашнее сообщество. В данном контексте благословение направлено, вероятнее всего, на людей дома Давида; буквальная образность отмечена в сноске.
