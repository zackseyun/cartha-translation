  source_fidelity: 'Первая часть в целом верно передаёт последовательность действий и распределительное אִישׁ («каждый»). «Разошёлся» допустимо для собравшегося народа, хотя несколько сильнее подразумевает рассеяние, чем простой глагол «пошли/ушли». Основная проблема — «Давид повернул»: без дополнения это неестественно по-русски и не передаёт внятно контекстуальное значение וַיִּסֹּב, то есть возвращение/обращение Давида к своему дому. «Вернулся» здесь является естественным контекстуальным переводом, известным и по параллельному повествовательному контексту, без изменения смысла.'
  naturalness: '«И весь народ разошёлся — каждый к себе домой» звучит современно и ясно. Сочетание «Давид повернул, чтобы благословить…» неудачно: русский глагол «повернул» обычно требует указания направления либо воспринимается как физический поворот, а не как переход к домашнему кругу. «Давид вернулся, чтобы благословить своих домашних» естественно и сохраняет повествовательный регистр.'
