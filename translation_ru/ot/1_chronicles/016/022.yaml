  text: אַֽל תִּגְּעוּ֙ בִּ/מְשִׁיחָ֔/י וּ/בִ/נְבִיאַ֖/י אַל תָּרֵֽעוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: ru
  text: «Не прикасайтесь к Моим помазанникам[a] и не причиняйте зла Моим пророкам».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Моих помазанников». Еврейское слово родственно слову «Мессия», но здесь употреблено во множественном числе и обозначает помазанных Богом людей, а не конкретно Мессию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: прикасайтесь
  rationale: Глагол נגע обычно означает «касаться, прикасаться». В запрете и в параллели с «не причиняйте зла» подразумевается враждебное посягательство, однако прямое значение сохранено.
- source_word: בִּמְשִׁיחָי
  choice: к Моим помазанникам
  rationale: 'מָשִׁיחַ означает «помазанник»; форма с суффиксом первого лица имеет множественное число: «Мои помазанники». Предлог ב при глаголе נגע естественно передан русским управлением «прикасаться к».'
- source_word: וּבִנְבִיאַי
  choice: Моим пророкам
  rationale: 'נָבִיא — «пророк»; здесь употреблена форма множественного числа с суффиксом первого лица: «Мои пророки». Дательный падеж обусловлен русским управлением оборота «причинять зло кому».'
- source_word: תָּרֵעוּ
  choice: причиняйте зла
  rationale: В породе хифиль корень רעע означает «делать зло, причинять вред». «Не причиняйте зла» сохраняет лексическую связь со злом и звучит естественно и достойно.
- source_word: אַל
  choice: не
  rationale: Частица אַל с имперфектом выражает прямой запрет и естественно передаётся русской отрицательной частицей «не».
theological_decisions:
- issue: Значение מְשִׁיחָי во множественном числе вне прямого мессианского титула
  choice: Моим помазанникам
  alternative: Моим мессиям; Моему Помазаннику
  rationale: Еврейская форма грамматически множественна и в данном контексте обозначает людей, помазанных Богом, а не единственного эсхатологического Мессию. Перевод сохраняет множественное число и не привносит отсутствующую в стихе христологическую конкретизацию.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. Заглавная буква в местоимении «Моим» указывает на Бога как говорящего и соответствует принятому русскому религиозному регистру. Сохранён параллелизм двух запретов.
