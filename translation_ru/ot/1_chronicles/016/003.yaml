base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: ru
  text: Он раздал каждому израильтянину, мужчине или женщине, по буханке хлеба, по порции мяса[a] и по изюмной лепёшке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по порции»; возможно, имеется в виду другой пищевой продукт. Еврейское слово אֶשְׁפָּר встречается редко, и его точное значение неизвестно. Многие понимают его здесь как порцию мяса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Он раздал
  rationale: Порода пиэль глагола חלק здесь означает распределение отдельных даров среди множества людей. «Раздал» естественно и точно передаёт действие.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: каждому израильтянину
  rationale: אִישׁ употреблено дистрибутивно; следующий оборот прямо показывает, что речь идёт и о мужчинах, и о женщинах. Русское «каждому израильтянину» сохраняет индивидуальное распределение и не требует неестественного «каждому человеку Израиля».
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: от мужчины до женщины
  rationale: Близкий перевод меризма, подчёркивающего охват всех получателей обоих полов; тире сохраняют его пояснительную функцию.
- source_word: לְאִישׁ
  choice: по
  rationale: Повторное אִישׁ имеет дистрибутивный смысл. Русская конструкция «по…» естественно показывает, что каждый получил по одному из перечисленных даров, без тяжеловесного повторения «каждому».
- source_word: כִּכַּר לֶחֶם
  choice: по караваю хлеба
  rationale: כִּכָּר обозначает округлую буханку или хлебную лепёшку. «Каравай хлеба» передаёт отдельное цельное хлебное изделие и звучит понятно в современном русском.
- source_word: אֶשְׁפָּר
  choice: по порции мяса[a]
  rationale: Редкое слово с неустановленным точным значением. В праздничном контексте распространено понимание как порции мяса, однако неопределённость сохранена в сноске.
- source_word: אֲשִׁישָׁה
  choice: по лепёшке с изюмом
  rationale: Слово обозначает прессованное сладкое изделие, обычно понимаемое как изюмная лепёшка. Выбранная формулировка ясна современному читателю и не перегружена техническими деталями.
