  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: ru
  text: А Беная и Яхазиил, священники, постоянно были с трубами перед ковчегом завета Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постоянно трубили перед ковчегом завета Бога». В еврейском тексте глагол не выражен, хотя, вероятно, подразумевается именно это действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ
  choice: А Беная
  rationale: Имя передано принятой русской библейской транслитерацией; союз ו связывает стих с предыдущим перечислением и естественно передаётся как «А».
- source_word: וְ/יַחֲזִיאֵל
  choice: и Яхазиил
  rationale: Личное имя транслитерировано с еврейского; начальный союз передан как «и».
- source_word: הַ/כֹּהֲנִים
  choice: священники
  rationale: Определённое существительное во множественном числе обозначает служение Бенаи и Яхазиила; по-русски определённость ясна из контекста.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: с трубами
  rationale: חֲצֹצְרוֹת — именно трубы, а не общий термин для рогов. Предлог ב передан в сопроводительно-инструментальном значении; действие «трубили» в основном тексте не добавлено, поскольку глагол отсутствует.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Наречие указывает на непрерывное или регулярно совершаемое служение, не уточняя его расписания.
- source_word: לִ/פְנֵי
  choice: перед
  rationale: Сохраняет пространственный и богослужебный оттенки еврейского выражения.
- source_word: אֲרוֹן בְּרִית
  choice: ковчегом завета
  rationale: Сопряжённая конструкция естественно и традиционно передаётся по-русски как «ковчег завета».
- source_word: הָ/אֱלֹהִים
  choice: Бога
  rationale: Определённая форма אֱלֹהִים здесь относится к Богу Израиля; форма «Бога» естественно завершает сочетание «ковчег завета Бога».
theological_decisions:
- issue: Следует ли прямо говорить, что священники трубили в трубы
  choice: В основном тексте сохранено «стояли с трубами», а вероятное действие указано в сноске.
  alternative: «постоянно трубили в трубы»
  rationale: 'В еврейском тексте нет выраженного глагола: названы священники, трубы, постоянство служения и положение перед ковчегом. По контексту трубление весьма вероятно, но включение его в основной текст устранило бы подлинную синтаксическую недосказанность источника.'
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Глагол «стояли» добавлен как минимально необходимое русское синтаксическое восполнение; смысловая неопределённость относительно трубления сохранена в сноске.
