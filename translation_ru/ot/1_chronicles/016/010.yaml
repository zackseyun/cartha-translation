base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: ru
  text: Хвалитесь Его святым именем; пусть радуется сердце ищущих Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH — тетраграмматон, божественное имя; здесь передано «Яхве». Традиционно передаётся «Господь».'
    reason: Поясняет передачу еврейского божественного имени и традиционную альтернативу; якорь поставлен непосредственно после «Яхве».
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Хвалитесь
  rationale: Форма хитпаэль, повелительное наклонение множественного числа, здесь означает «хвалиться, торжествовать чем-либо». «Хвалитесь» сохраняет повелительную силу и естественно сочетается с предложной конструкцией.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: Его святым именем
  rationale: Предлог בְּ обозначает предмет или основание хвалы; русское творительное управление при «хвалиться» естественно передаёт эту связь. Определение «святым» точно передаёт קָדְשׁוֹ.
- source_word: יִשְׂמַח
  choice: пусть радуется
  rationale: Имперфект третьего лица единственного числа в увещевательно-поэтическом контексте имеет юссивный оттенок, естественно передаваемый частицей «пусть».
- source_word: לֵב
  choice: сердце
  rationale: Существительное стоит в единственном числе и коллективно обозначает внутреннего человека у множества ищущих; русский язык допускает такое обобщённое единственное число.
- source_word: מְבַקְשֵׁי
  choice: ищущих
  rationale: Причастная форма обозначает людей, для которых поиск Яхве является продолжающимся, характерным действием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом; традиционный вариант отмечен в сноске.
- issue: Число существительного לֵב при множественном מְבַקְשֵׁי
  choice: сердце ищущих
  alternative: сердца ищущих
  rationale: Сохранено единственное число оригинала и его коллективный смысл. Такой оборот передаёт единство внутренней направленности группы, не отрицая множественности людей.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм и увещевательный характер стиха сохранены; местоимение «Его» написано с прописной буквы по принятой русской религиозно-литературной норме.
