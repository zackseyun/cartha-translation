  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: ru
  text: Он поставил некоторых левитов служить перед ковчегом Яхве, чтобы совершать воспоминание[a], благодарить и восхвалять Яхве, Бога Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поминать», «упоминать». Еврейский глагол может обозначать приведение на память или памятное провозглашение в богослужении.'
    reason: Сохранение смысловой широты каузативной формы глагола זכר и её возможного литургического оттенка.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Он поставил
  rationale: В контексте назначения левитов на служение буквальное «дал» имеет идиоматическое значение «поставил, назначил»; «поставил» сохраняет образ исходного глагола и естественно звучит по-русски.
- source_word: מִן הַלְוִיִּם
  choice: некоторых левитов
  rationale: 'Предлог מִן имеет здесь партитивное значение: были выделены не все левиты, а часть из них.'
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: перед ковчегом Яхве
  rationale: «Перед» передаёт пространственное и культовое значение לִפְנֵי, а конструкция «ковчег Яхве» прямо сохраняет отношение принадлежности.
- source_word: מְשָׁרְתִים
  choice: служить
  rationale: Причастие обозначает порученное культовое служение; русский инфинитив естественно связывается с глаголом «поставил».
- source_word: וּלְהַזְכִּיר
  choice: чтобы напоминать
  rationale: Каузативная форма от זכר связана с приведением на память или литургическим воспоминанием. «Напоминать» сохраняет неопределённость объекта и не сводит действие к одному конкретному обряду.
- source_word: וּלְהוֹדוֹת
  choice: благодарить
  rationale: В богослужебном контексте ידה означает благодарение, а не исповедание.
- source_word: וּלְהַלֵּל
  choice: восхвалять
  rationale: Глагол הלל в породе piel означает хвалить; «восхвалять» соответствует торжественному богослужебному контексту без добавления отсутствующего указания на пение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прямая и ясная передача еврейской сопряжённой конструкции.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет его как имя и следует наиболее распространённой научной реконструкции произношения.
- issue: Смысл להזכיר в богослужебном контексте
  choice: напоминать
  alternative: совершать воспоминание; поминать; возвещать
  rationale: Еврейский глагол допускает значения приведения на память, памятного провозглашения и упоминания. Основной текст не уточняет ни объект, ни точную форму действия, поэтому эта открытость сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным и естественным; три однородных богослужебных действия сохранены. Неопределённость глагола להזכיר не устранена добавлением отсутствующего в оригинале объекта.
