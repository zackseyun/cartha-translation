base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/017.yaml
  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: ru
  text: И утвердил это для Иакова как установление[a], для Израиля — как вечный завет[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постановление». Еврейское слово обозначает твёрдо установленное предписание или правило.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «завет навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: И утвердил это
  rationale: Каузативная форма глагола עמד означает «сделал твёрдым, установил, утвердил». Местоимение «это» сохраняет отсылку женского суффикса к завету, слову или клятве из ближайшего контекста, не сужая её неоправданно.
- source_word: לְיַעֲקֹב
  choice: для Иакова
  rationale: Предлог לְ здесь обозначает адресата или того, для кого утверждено установление; по-русски «для Иакова» естественно передаёт это значение.
- source_word: לְחֹק
  choice: как установление
  rationale: חֹק обозначает твёрдо установленное предписание или постановление. «Установление» сохраняет юридико-заветный оттенок и созвучно смыслу утверждения, не сводя выражение только к законодательному акту.
- source_word: לְיִשְׂרָאֵל
  choice: для Израиля
  rationale: Сохранён параллелизм с «для Иакова» и различение двух употреблённых в еврейском тексте имён.
- source_word: בְּרִית עוֹלָם
  choice: как вечный завет
  rationale: «Завет» передаёт ключевой термин בְּרִית, а «вечный» естественно выражает длительную, непреходящую силу עוֹלָם в заветном контексте.
theological_decisions:
- issue: Референт местоименного суффикса в וַיַּעֲמִידֶהָ
  choice: Передать нейтральным «это», сохранив отсылку к предшествующему заветному обещанию или клятве.
  alternative: 'Уточнить: «его» (завет) или «её» (клятву).'
  rationale: В стихах 16–17 рядом упомянуты завет, слово и клятва. Нейтральное субстантивированное «это» не вынуждает выбирать один антецедент и сохраняет смысловую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического и заветного контекста. Начальное «И» отражает союз וַ; тире во второй половине делает параллелизм естественным по-русски. Строчная буква в «утвердил» сохраняет зависимость стиха от предыдущей строки.
