id: 1CH.16.31
reference: 1 Chronicles 16:31
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: ru
  text: 'Да радуются небеса,

    и да ликует земля!

    Пусть говорят среди народов:

    «Яхве царствует!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве воцарился!»'
    reason: Еврейская форма מָלָךְ может обозначать как царствование в настоящем, так и вступление на царство.
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Да радуются
  rationale: Имперфект qal в поэтической последовательности имеет побудительно-пожелательное значение; конструкция «да радуются» сохраняет торжественный призыв.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Форма множественного числа и космический параллелизм с землёй указывают на «небеса», а не только на видимое небо.
- source_word: וְתָגֵל
  choice: и да ликует
  rationale: Глагол גיל выражает бурную радость и ликование; выбор передаёт поэтический параллелизм, не повторяя «радуются».
- source_word: הָאָרֶץ
  choice: земля
  rationale: В паре с небесами слово обозначает землю как часть всего творения, а не отдельную страну.
- source_word: וְיֹאמְרוּ
  choice: Пусть говорят
  rationale: Имперфект продолжает побудительно-пожелательную последовательность. Неопределённо-личная русская конструкция сохраняет невыраженный в еврейском тексте субъект множественного числа.
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь означает народы мира; «среди народов» естественно передаёт публичное провозглашение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: מָלָךְ
  choice: царствует
  rationale: Формула провозглашает действительную царскую власть Яхве. Настоящее время естественно по-русски, тогда как значение совершенного вида допускает также «воцарился».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» непосредственно передаёт имя и не подменяет его титулом.
- issue: Временной оттенок מָלָךְ
  choice: царствует
  alternative: воцарился; стал царём
  rationale: В хвалебной формуле глагол может провозглашать нынешнюю реальность Божьего царствования; примечание сохраняет возможный оттенок вступления на царство, не навязывая представления о начале Божьей власти.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим ритмом. Параллелизм строк и последовательность призывов сохранены; субъект «говорят» намеренно не уточнён.
