  text: בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִן הָ/עוֹלָ֖ם וְ/עַ֣ד הָ/עֹלָ֑ם וַ/יֹּאמְר֤וּ כָל הָ/עָם֙ אָמֵ֔ן וְ/הַלֵּ֖ל לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: ru
  text: 'Благословен Яхве, Бог Израиля, от века и до века![a] И весь народ сказал: «Аминь!» — и восхвалил Яхве.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «от вечности до вечности» или «во веки веков».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение кратко и может быть понято также как «Аминь, и хвала Яхве» или «Аминь! Хвалите Яхве!»; по смыслу народ ответил согласием и хвалой.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие входит в торжественную формулу благословения; краткая форма «благословен» естественна для русской славословной речи и не требует добавления пожелательного «да будет».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул; форма «Яхве» общепонятна в современном русском библейском контексте.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача сопряжённой конструкции; приложение после имени звучит по-русски естественно.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: от века и до века
  rationale: Сохраняет повтор ключевого слова עוֹלָם и возвышенный характер славословия, выражая неограниченную длительность без излишней философской конкретизации.
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: И весь народ сказал
  rationale: Последовательность повествования передана союзом «и»; собирательное «народ» естественно сочетается в русском языке с глаголом в единственном числе.
- source_word: אָמֵן
  choice: Аминь!
  rationale: Сохранена традиционная и узнаваемая литургическая формула согласия и подтверждения.
- source_word: וְהַלֵּל לַיהוָה
  choice: и восхвалил Яхве
  rationale: По контексту компактное выражение описывает ответ народа хвалой; глагольная передача даёт ясный русский текст, а неоднозначность еврейской формы отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יהוה. Транслитерация сохраняет его отличие от титула и не привносит конфессиональной замены.
- issue: Временной охват выражения מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: от века и до века
  alternative: от вечности до вечности; во веки веков
  rationale: Выбранная формула передаёт безграничный временной размах славословия, сохраняя образность и не навязывая более узкого философского понимания «вечности».
- issue: Синтаксическая сила וְהַלֵּל לַיהוָה
  choice: повествовательное описание хвалы народа
  alternative: повелительный возглас «Хвалите Яхве!»; формула «хвала Яхве»
  rationale: Контекст после «весь народ сказал» допускает понимание выражения как продолжения описания ответа народа. Поскольку еврейская формулировка предельно сжата и допускает иные разборы, они сохранены в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным славословным звучанием. Сохранены традиционное «Аминь» и ритмическая формула «от века и до века»; неоднозначность заключительной еврейской конструкции вынесена в сноску.
