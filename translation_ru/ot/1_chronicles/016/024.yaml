base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: ru
  text: Возвещайте среди народов славу Его, среди всех народов — дивные дела Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Возвещайте
  rationale: Форма повелительного наклонения множественного числа призывает к открытому, публичному провозглашению; «возвещайте» передаёт эту торжественную окраску естественным литературным русским языком.
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: Существительное גּוֹיִם здесь обозначает народы вообще, в контексте — народы вне Израиля; предлог ב передан словом «среди».
- source_word: כְּבוֹדוֹ
  choice: славу Его
  rationale: כָּבוֹד в данном контексте охватывает честь, величие и явленное великолепие Бога; «слава» является точным и устойчивым русским соответствием.
- source_word: בְּכָל־הָעַמִּים
  choice: среди всех племён
  rationale: «Племён» позволяет сохранить лексическое различие между גּוֹיִם и עַמִּים и поэтический параллелизм. Здесь слово обозначает этнические и человеческие общности, а не только родоплеменные группы.
- source_word: נִפְלְאֹתָיו
  choice: дивные дела Его
  rationale: Слово обозначает необычайные деяния, вызывающие изумление; «дивные дела» выражает и их чудесный характер, и деятельный смысл.
theological_decisions:
- issue: К кому относятся местоименные суффиксы «Его»
  choice: Сохранена местоименная отсылка к Богу Израиля, явная из ближайшего контекста.
  alternative: Явно повторить имя «Господь» вместо местоимений.
  rationale: В еврейском тексте стоят местоименные суффиксы; их сохранение точно передаёт форму стиха и не добавляет отсутствующего в нём имени, тогда как контекст однозначно указывает на Господа.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Инверсия «славу Его» и «дела Его» сохраняет ритм и достоинство библейской поэзии, оставаясь понятной современному читателю.
