  text: יִרְעַ֤ם הַ/יָּם֙ וּ/מְלוֹא֔/וֹ יַעֲלֹ֥ץ הַ/שָּׂדֶ֖ה וְ/כָל אֲשֶׁר בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: ru
  text: Да гремит море[a] и всё, что наполняет его[b]; да ликует поле и всё, что на нём!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да рокочет море». Еврейский глагол может обозначать громкий грохот или рёв.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и полнота его», то есть всё, чем наполнено море.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: да гремит
  rationale: Глагол רעם обозначает громкий грохочущий или рокочущий звук. «Гремит» сохраняет образ грома и естественно сочетается в русском поэтическом тексте с морем.
- source_word: הַיָּם
  choice: море
  rationale: Прямое и обычное соответствие еврейскому יָם; в данном поэтическом параллелизме нет оснований сужать или расширять значение до конкретного океана.
- source_word: וּמְלוֹאוֹ
  choice: и всё, что наполняет его
  rationale: מְלוֹא буквально указывает на «полноту», то есть на всё, чем наполнено море. Выбранная формулировка передаёт этот смысл ясно и естественно для современного русского читателя.
- source_word: יַעֲלֹץ
  choice: да ликует
  rationale: Глагол עלץ выражает бурную, торжествующую радость. «Ликует» сохраняет возвышенную поэтическую силу исходного слова.
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Прямое соответствие שָׂדֶה, обозначающему поле или открытую местность. «Поле» поддерживает краткий образный параллелизм с морем.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: и всё, что на нём
  rationale: Местоимение относится к полю. Русское «на нём» здесь идиоматичнее буквального «в нём» и не меняет всеохватного смысла конструкции.
