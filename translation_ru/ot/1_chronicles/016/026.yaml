source:
  edition: WLC
  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: ru
  text: Ведь все боги народов — идолы, а Яхве сотворил небеса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для окружающего призыва к поклонению; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: все боги народов
  rationale: Сохраняется всеохватность כָּל, прямое значение אֱלֹהֵי и обычное неполитическое значение עַמִּים — «народы».
- source_word: אֱלִילִים
  choice: идолы
  rationale: Слово обозначает идолов и несёт уничижительный оттенок ничтожности; «идолы» ясно передаёт основной смысл без усилительной парафразы.
- source_word: וַיהוָה
  choice: а Яхве
  rationale: Союз ו формально соединительный, но здесь выражает резкое противопоставление; русское «а» сохраняет и связь, и контраст. Имя יהוה передано как «Яхве».
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Русское множественное «небеса» естественно соответствует еврейской форме и контексту творения.
- source_word: עָשָׂה
  choice: сотворил
  rationale: В контексте создания небес «сотворил» естественно передаёт עשה; оно несколько возвышеннее нейтрального «сделал», но не заменяет глагол специальным термином «создал».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному решению.
- issue: Смысл союза ו перед יהוה
  choice: 'противительный оттенок: «а Яхве»'
  alternative: 'простое соединение: «и Яхве»; усиленное противопоставление: «но Яхве»'
  rationale: Сопоставление идолов с Творцом явно контрастно. «А» по-русски естественно выражает этот контраст, не устраняя формальной соединительной природы союза.
- issue: Статус «богов народов»
  choice: сохранено выражение «боги народов», затем они названы идолами
  alternative: парафраз «ложные боги» или «ничтожества»
  rationale: Перевод сохраняет риторическую и богословскую напряжённость исходного текста, не уточняя сверх него природу названных богов.
translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным библейским ритмом. Тире естественно оформляет именную часть сказуемого; лексика понятна широкому читателю. Сноски не требуются: допустимые оттенки союза и слова עַמִּים переданы без потери существенной неоднозначности.'
