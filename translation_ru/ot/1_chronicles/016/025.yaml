base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: ru
  text: Ибо велик Яхве и весьма достоин хвалы; Его следует страшиться[a] превыше всех богов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он внушает благоговейный трепет». Еврейское слово выражает страх, соединённый с благоговением и трепетом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для окружающего призыва к поклонению; «ибо» естественно сохраняет пояснительно-причинную связь.
- source_word: גָדוֹל
  choice: велик
  rationale: Прилагательное выражает величие, высокий статус и величественность; «велик» прямо и естественно передаёт этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: מְהֻלָּל מְאֹד
  choice: весьма достоин хвалы
  rationale: Пассивное причастие с усилительным наречием указывает, что Яхве в высшей степени подобает восхвалять; формулировка естественна по-русски и сохраняет предикативный смысл.
- source_word: נוֹרָא
  choice: Его следует страшиться
  rationale: Слово от корня ירא обозначает того, кто внушает страх и благоговейный трепет. Эта формулировка сохраняет требовательную силу выражения, не сводя его ни к простому восхищению, ни к одному лишь ужасу.
- source_word: עַל כָּל אֱלֹהִים
  choice: превыше всех богов
  rationale: Предлог עַל здесь выражает превосходство или возвышение над всеми прочими богами; «превыше» кратко и ясно передаёт сравнительный смысл.
- source_word: אֱלֹהִים
  choice: богов
  rationale: Форма множественного числа в контексте относится к богам народов; прямой перевод сохраняет полемическое сопоставление следующего стиха.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Смысл נוֹרָא применительно к Богу
  choice: Его следует страшиться
  alternative: Он грозен; Он внушает трепет
  rationale: Еврейское слово соединяет страх, благоговение и трепет. Выбранный вариант сохраняет богословскую напряжённость и нормативную силу выражения, а примечание поясняет диапазон смысла.
- issue: Статус «всех богов»
  choice: сохранено без поясняющего определения
  alternative: всех ложных богов; всех божественных существ
  rationale: Текст говорит «всех богов» и сам не уточняет их онтологический статус. Добавление «ложных» или замена на «божественных существ» разрешили бы сохраняемую исходным текстом неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Ибо» и «превыше» поддерживают достоинство поэтической хвалы, оставаясь понятными современному читателю.
