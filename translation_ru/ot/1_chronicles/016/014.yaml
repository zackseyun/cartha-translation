  text: ה֚וּא יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָל הָ/אָ֖רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: ru
  text: Он — Яхве, наш Бог[b]; Его суды — по всей земле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всей стране», если אֶרֶץ понимать в более узком, местном смысле. Здесь выбран вариант «по всей земле», поскольку контекст подчёркивает всемирное владычество Яхве.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит Божье имя יהוה (ЙХВХ), традиционно передаваемое как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: Он —
  rationale: Самостоятельное местоимение имеет эмфатический характер; тире естественно передаёт именное предложение без связки в настоящем времени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста; традиционный вариант «Господь» отмечен в сноске.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Несмотря на морфологически множественную форму אֱלֹהִים, здесь слово с суффиксом обозначает единого Бога Израиля.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: Сочетание естественно обозначает всемирный охват; русское «по всей земле» также хорошо сочетается с последующим множественным числом «суды».
- source_word: מִשְׁפָּטָיו
  choice: Его суды
  rationale: '«Суды» сохраняет широту значения: судебные решения, проявления правосудия и акты суда, не сводя выражение лишь к законам или отвлечённой справедливости.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. «Яхве» передаёт его транслитерацией, а традиционное замещение титулом указано в сноске без навязывания конфессионального решения.
- issue: Объём значения הָאָרֶץ
  choice: земля в универсальном смысле
  alternative: страна, вся эта земля
  rationale: Контекст гимна подчёркивает широкое владычество Бога; при этом возможное локальное значение честно сохранено в сноске.
- issue: Значение מִשְׁפָּטָיו
  choice: Его суды
  alternative: Его правосудие; Его установления
  rationale: Буквально более широкое «суды» сохраняет богословское напряжение между Божьими решениями, правосудием и совершаемыми Им актами суда.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Параллельные тире слегка подчёркивают поэтическую структуру и эмфазу еврейского текста; прописная буква в «Его» употреблена как уважительная издательская норма.
