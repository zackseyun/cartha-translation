  terminology: «Народ» для גּוֹי и עַם, а также «царство» для מַמְלָכָה — корректные и нейтральные соответствия. Добавленное «одного» в сочетании «из одного царства» — допустимое русское раскрытие распределительной конструкции и не меняет смысла.
