  yaml_path: translation/ot/1_chronicles/016/020.yaml
  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: ru
  text: И переходили они от народа к народу, из одного царства — к другому народу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: И переходили они
  rationale: Форма хитпаэль глагола הלך в сочетании с конструкциями «от… к…» обозначает неоднократное перемещение с места на место. «Переходили» естественно передаёт этот продолжительный и повторяющийся характер движения, не добавляя оттенка бесцельного блуждания.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: от народа к народу
  rationale: Устойчивая русская конструкция сохраняет повтор גּוֹי и распределительное значение еврейского выражения.
- source_word: וּמִמַּמְלָכָה
  choice: из одного царства
  rationale: מַמְלָכָה означает «царство». Слово «одного», хотя прямо не выражено числительным, естественно раскрывает по-русски распределительный параллелизм.
- source_word: אֶל עַם אַחֵר
  choice: к другому народу
  rationale: 'עַם здесь обозначает народ, а אַחֵר — другой. Формулировка сохраняет асимметрию оригинала: переход совершается из царства к другому народу.'
