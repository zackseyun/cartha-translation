  source_fidelity: «И переходили они» адекватно передаёт итеративное значение хитпаэля וַיִּתְהַלְּכוּ в данном контексте. Обороты «от народа к народу» и «из одного царства — к другому народу» точно отражают обе параллельные конструкции еврейского текста, включая различение между גּוֹי, מַמְלָכָה и עַם.
