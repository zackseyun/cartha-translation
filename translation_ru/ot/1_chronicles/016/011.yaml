  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: ru
  text: Ищите Яхве и Его силу; постоянно ищите Его лица.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его присутствия» (буквально: «Его лица»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Ищите
  rationale: Императив глагола דרש здесь призывает деятельно обращаться к Богу и стремиться к Нему; «ищите» естественно передаёт этот смысл и побудительную силу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: וְעֻזּוֹ
  choice: и Его силы
  rationale: עֹז прежде всего означает силу или могущество. Родительный оборот после «ищите» звучит по-русски естественно и сохраняет параллелизм стиха.
- source_word: בַּקְּשׁוּ
  choice: ищите
  rationale: בקש обозначает настойчивый поиск. Повтор «ищите» сохраняет поэтический параллелизм, не навязывая чрезмерного различия между близкими еврейскими глаголами.
- source_word: פָנָיו
  choice: Его лица
  rationale: Буквальное значение — «Его лицо»; в данном обороте оно также обозначает личное присутствие Бога. Образ сохранён в основном тексте, а смысловая альтернатива дана в сноске.
- source_word: תָּמִיד
  choice: всегда
  rationale: תמיד выражает постоянство и непрерывную направленность действия; «всегда» ясно и естественно передаёт это в современном русском языке.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет его, тогда как «Господь» является заменяющим титулом.
- issue: Значение выражения «искать Его лица»
  choice: Сохранить образ «Его лица» в основном тексте
  alternative: искать Его присутствия
  rationale: Буквальный образ понятен по-русски и сохраняет богословскую и поэтическую насыщенность оригинала; значение присутствия отмечено в сноске без устранения исходной образности.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Синтаксис прямой и понятный; библейский образ «искать лица» сохранён без архаической инверсии.
