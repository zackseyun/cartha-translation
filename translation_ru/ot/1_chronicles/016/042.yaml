  text: וְ/עִמָּ/הֶם֩ הֵימָ֨ן וִֽ/ידוּת֜וּן חֲצֹצְר֤וֹת וּ/מְצִלְתַּ֨יִם֙ לְ/מַשְׁמִיעִ֔ים וּ/כְלֵ֖י שִׁ֣יר הָ/אֱלֹהִ֑ים וּ/בְנֵ֥י יְדוּת֖וּן לַ/שָּֽׁעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: ru
  text: Вместе с ними были Еман и Идифун с трубами и кимвалами, чтобы они звучали, и с музыкальными инструментами для песнопений Богу; сыновья Идифуна были у ворот[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были поставлены служить у ворот»; буквально: «к/для ворот». Возможно, речь идёт о назначении привратниками.'
    reason: Лаконичное еврейское выражение может обозначать не только местонахождение, но и порученное служение у ворот.
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Вместе с ними были
  rationale: Предлог с местоименным суффиксом вводит сопровождающих служителей; глагол «были» естественно восполняет эллиптическую еврейскую конструкцию.
- source_word: הֵימָן וִידוּתוּן
  choice: Еман и Идифун
  rationale: Использованы укоренившиеся в русской библейской традиции формы личных имён.
- source_word: חֲצֹצְרוֹת וּמְצִלְתַּיִם
  choice: трубы и кимвалы
  rationale: Это обычные русские наименования металлических церемониальных труб и ударных музыкальных инструментов храмового служения.
- source_word: לְמַשְׁמִיעִים
  choice: для громкого звучания
  rationale: Каузативная форма от שמע означает «давать услышать, производить слышимый звук». Передано назначение труб и кимвалов без неоправданного уточнения мелодии или способа игры.
- source_word: וּכְלֵי שִׁיר הָאֱלֹהִים
  choice: и с музыкальными орудиями для песнопений Богу
  rationale: «Музыкальные орудия» естественно передаёт буквальное «орудия песни», а «для песнопений Богу» сохраняет связь музыки с Богом и культовым служением, не сводя выражение лишь к общему обозначению музыки.
- source_word: וּבְנֵי יְדוּתוּן
  choice: сыновья же Идифуна
  rationale: Сохраняется прямое родственное обозначение и при помощи частицы «же» ясно отмечается переход к отдельному назначению сыновей Идифуна.
- source_word: לַשָּׁעַר
  choice: были у ворот
  rationale: Буквальное направление или отнесённость «к/для ворот» в контексте, вероятно, означает назначение на службу у ворот. Основной текст сохраняет сжатость и пространственную формулировку оригинала, а служебное понимание указано в сноске.
