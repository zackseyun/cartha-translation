base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: ru
  text: Асаф был главным[a], а вторым после него — Захария; Иеиел, Шемирамоф, Иехиил, Маттифия, Елиав, Ванея, Овед-Эдом и Иеиел играли на арфах и лирах[b], а Асаф ударял в кимвалы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Асаф был главой, а Захария — вторым после него». Еврейское выражение указывает на положение Захарии, следующее за Асафом.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте названы два разных вида струнных инструментов: невалы и кинноры; здесь они переданы как «арфы» и «лиры».'
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: главным
  rationale: В перечне служителей слово обозначает старшинство или руководящее положение, а не буквальную «голову».
- source_word: וּמִשְׁנֵהוּ
  choice: а вторым после него — Захария
  rationale: Форма с местоименным суффиксом указывает на второй ранг по отношению к Асафу; русский оборот ясно и естественно передаёт эту связь.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: Иеиел
  rationale: Одинаковая форма имени в обоих случаях передана последовательно; вероятно, речь идёт о двух одноимённых людях.
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: с арфами и лирами
  rationale: Сохранено различие между двумя видами струнных инструментов; родовое כְּלֵי не требует отдельного слова «инструменты» в естественном русском выражении.
- source_word: בַּמְצִלְתַּיִם
  choice: на кимвалах
  rationale: «Кимвалы» — принятое и узнаваемое русское название древних ударных тарелок; предложное управление соответствует русскому обозначению игры на инструменте.
- source_word: מַשְׁמִיעַ
  choice: играл
  rationale: Причастие породы hифиль буквально означает «дающий звучать»; в контексте музыкального служения естественный русский эквивалент — «играл», без избыточного уточнения громкости.
