base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: ru
  text: И Овед-Эдом и их братья[a] — шестьдесят восемь; Овед-Эдом, сын Идифуна, и Хоса были привратниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их братья». В некоторых переводах: «его братья», чтобы прояснить связь, однако основной текст сохраняет множественное число местоименного суффикса принятого еврейского текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: И Овед-Эдом
  rationale: Союз сохраняет характер продолжения перечня; имя передано в принятой русской библейской форме.
- source_word: וַ/אֲחֵי/הֶם
  choice: и их братья
  rationale: Сохранён суффикс 3-го лица множественного числа в масоретском тексте, хотя его соотнесённость в сжатом перечне не вполне ясна.
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: шестьдесят восемь
  rationale: Числительное передано естественно для современного русского языка.
- source_word: וְ/עֹבֵד אֱדֹם
  choice: Овед-Эдом
  rationale: Повтор имени сохранён в соответствии со структурой еврейского текста; второй союз естественно опущен после точки с запятой, чтобы избежать тяжеловесности.
- source_word: בֶּן יְדִיתוּן
  choice: сын Идифуна
  rationale: Формальное указание на происхождение сохранено; имя передано в принятой русской библейской форме.
- source_word: וְ/חֹסָה
  choice: и Хоса
  rationale: Имя транслитерировано; союз связывает Хосу с Овед-Эдом общей обязанностью.
- source_word: לְ/שֹׁעֲרִים
  choice: были привратниками
  rationale: Предлог ל обозначает назначение или функцию; связка «были» добавлена для ясного и естественного русского сказуемого.
