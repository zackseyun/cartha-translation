  text: זִכְר֤וּ לְ/עוֹלָם֙ בְּרִית֔/וֹ דָּבָ֥ר צִוָּ֖ה לְ/אֶ֥לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: ru
  text: Вечно помните Его завет — слово, которое Он заповедал на тысячу поколений.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обещание, которое Он заповедал на тысячу поколений».'
    reason: Лексема דָּבָר может в заветном контексте обозначать не только «слово», но и «обещание».
lexical_decisions:
- source_word: זִכְרוּ
  choice: Помните
  rationale: Форма Qal, повелительное наклонение, мужской род, множественное число; обращение ко всему сообществу. «Помните» естественно и прямо передаёт призыв.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Передаёт значение постоянства и непрекращающейся длительности; в сочетании «помните вечно» звучит естественно в современном литературном русском.
- source_word: בְּרִיתוֹ
  choice: Его завет
  rationale: «Завет» — точный и общепонятный эквивалент בְּרִית в контексте Божьих обязательств. Прописная буква в местоимении указывает на Бога согласно принятой русской библейской письменной норме.
- source_word: דָּבָר
  choice: слово
  rationale: Сохраняет широкое значение еврейской лексемы, не сужая его до «обещания». Тире показывает пояснительное соотношение с «заветом», не устраняя возможной смысловой напряжённости.
- source_word: צִוָּה
  choice: Он заповедал
  rationale: Глагол צוה обычно означает «повелевать, заповедовать». «Заповедал» сохраняет силу Божьего установления и лучше сочетается со «словом», чем разговорное «приказал».
- source_word: לְאֶלֶף דּוֹר
  choice: на тысячу поколений
  rationale: Предлог «на» естественно передаёт протяжённость действия во времени и не решает, следует ли понимать число строго буквально или как выражение необозримой длительности.
theological_decisions:
- issue: Передача דָּבָר в параллели с «заветом»
  choice: слово
  alternative: обещание
  rationale: «Слово» ближе к лексической широте оригинала. Контекст допускает смысл «обещание», но принятие его в основном тексте сузило бы подлинную неоднозначность.
- issue: Передача צִוָּה применительно к заветному слову
  choice: заповедал
  alternative: установил
  rationale: «Заповедал» сохраняет обычное значение глагола и напряжение между словом как обещанием и словом как властным установлением; «установил» было бы контекстуальным сглаживанием.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским регистром. Синтаксис краток и сохраняет поэтический параллелизм; местоимение, относящееся к Богу, написано с прописной буквы.
