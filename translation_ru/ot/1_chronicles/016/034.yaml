base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: ru
  text: Благодарите Яхве[a], ибо Он благ, ибо Его неизменная любовь — навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — передача еврейского имени יהוה (YHWH), которое во многих переводах традиционно заменяется словом «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «Его милость — навеки»; еврейское חֶסֶד означает любовь, соединённую с неизменной верностью, в том числе верностью завету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Благодарите
  rationale: Форма повелительного наклонения множественного числа от ידה в породе hифиль здесь призывает воздавать благодарность; этот вариант естественно передаёт смысл литургической формулы.
- source_word: לַ/יהוָה֙
  choice: Яхве
  rationale: Передаёт личное имя יְהוָה, сохраняя его отличие от титула «Господь».
- source_word: כִּי ... כִּי
  choice: потому что ... потому что
  rationale: Оба вхождения כִּי вводят основания для благодарения. Повтор сохраняет параллелизм и ход еврейской фразы.
- source_word: טוֹב
  choice: благ
  rationale: Краткое и естественное для возвышенной речи обозначение Божьей благости, включающей нравственную доброту и благодеяние.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Передаёт неограниченную длительность и сохраняет краткость литургического рефрена.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד соединяет любовь, милость, постоянство и верность отношениям; «верная любовь» сохраняет эту смысловую широту лучше, чем одно слово «милость».
- source_word: לְעוֹלָם חַסְדּוֹ
  choice: Его верная любовь — навеки
  rationale: В еврейском это безглагольное предложение. Тире позволяет не вводить отсутствующий в оригинале глагол «пребывает», сохраняя при этом естественность русского выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет его прямое употребление, а примечание сообщает традиционную замену титулом.
- issue: Передача חֶסֶד в формуле хвалы
  choice: верная любовь
  alternative: милость; заветная верность
  rationale: Выбранный вариант не сводит חֶסֶד только к состраданию или только к юридической верности, а сохраняет сочетание любви и неизменной преданности.
- issue: Безглагольный характер заключительной части
  choice: Его верная любовь — навеки
  alternative: Его верная любовь пребывает вовеки
  rationale: В еврейском глагола нет. Русское именное предложение сохраняет лаконичность и не делает подразумеваемое продолжение действия более явным, чем в оригинале.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным литургическим ритмом. Повтор «потому что» отражает два כִּי оригинала; местоимение «Он» и притяжательное «Его» написаны с прописной буквы как уместная в библейском русском почтительная норма.
