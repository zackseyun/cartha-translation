  text: זִכְר֗וּ נִפְלְאֹתָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה מֹפְתָ֖י/ו וּ/מִשְׁפְּטֵי פִֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: ru
  text: Помните его дивные дела[a], которые он совершил, его знамения[b] и суды его уст[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его чудеса».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его чудесные знаки»; возможно также: «его предзнаменования».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «установления» или «постановления его уст».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Помните
  rationale: Форма повелительного наклонения во множественном числе от זכר призывает слушателей деятельно хранить в памяти и вспоминать; «помните» естественно и точно передаёт этот призыв.
- source_word: נִפְלְאֹתָיו
  choice: его дивные дела
  rationale: Слово обозначает необычайные деяния, вызывающие изумление. «Дивные дела» передаёт и чудесный характер, и то, что речь идёт о совершённых Богом действиях.
- source_word: אֲשֶׁר עָשָׂה
  choice: которые он совершил
  rationale: Относительное придаточное уточняет «дивные дела»; прошедшее время передаёт завершённость названных деяний и естественно звучит по-русски.
- source_word: מֹפְתָיו
  choice: его знамения
  rationale: מופת обозначает знак или знамение, являющее Божью силу. «Знамения» сохраняет эту смысловую направленность и не сужает значение до одного лишь понятия чуда.
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: и суды его уст
  rationale: משפטים может означать суды, судебные решения, установления или постановления. Буквально сохранённый образ «его уст» указывает на изречённые Богом решения и не устраняет смысловую многозначность.
theological_decisions:
- issue: Передача двух обозначений Божьих деяний в поэтическом параллелизме
  choice: Различать נִפְלְאֹתָיו и מֹפְתָיו как «дивные дела» и «знамения».
  alternative: «чудеса» и «предзнаменования» либо передача обоих слов сходными обозначениями чудес.
  rationale: В еврейском тексте употреблены два близких, но не тождественных слова. Различная передача сохраняет поэтическую фактуру и смысловые оттенки, не сводя оба понятия к одному.
- issue: Значение מִשְׁפְּטֵי в сочетании с «его уст»
  choice: «суды его уст»
  alternative: «установления его уст» или «решения, изречённые им»
  rationale: Выбранный вариант сохраняет судебный и постановляющий оттенки слова, а также яркий образ исходящей из Божьих уст речи, не определяя чрезмерно узко характер этих изречений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Синтаксис остаётся ясным, а выражение «суды его уст» намеренно сохраняет образность и смысловую широту еврейского текста. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная редакционная норма.
