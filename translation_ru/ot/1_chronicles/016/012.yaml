  source_fidelity: Перевод точно передаёт повелительное множественное число זִכְרוּ («Помните»), два различимых ряда Божьих деяний — נִפְלְאֹתָיו («дивные дела») и מֹפְתָיו («знамения»), относительное придаточное אֲשֶׁר עָשָׂה и образное וּמִשְׁפְּטֵי פִיהוּ («и суды его уст»). Смысловая широта מִשְׁפָּטִים сохранена и не догматически сужена.
