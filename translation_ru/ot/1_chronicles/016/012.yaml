  terminology: «Дивные дела» и «знамения» удачно различают פלאות и מופתים, как и английский контрольный текст. «Суды» корректно сохраняет основной судебно-декретный диапазон משפטים; сноска надлежащим образом указывает допустимые варианты «установления» и «постановления». Маркеры сносок стоят при соответствующих выражениях.
