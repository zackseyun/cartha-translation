  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: ru
  text: Пойте Ему, пойте Ему хвалу, рассказывайте[a] обо всех Его дивных делах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорите обо всех Его чудесах»; возможно также: «размышляйте обо всех Его дивных делах». Еврейский глагол может обозначать как речь, так и размышление, однако здесь публичный призыв скорее предполагает рассказ вслух.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Пойте
  rationale: Форма повелительного наклонения множественного числа от שׁיר прямо призывает петь; русский глагол естественно передаёт этот призыв и сохраняет поэтический параллелизм.
- source_word: לֹו
  choice: Ему
  rationale: Предлог ל с местоименным суффиксом указывает на адресата пения. Дательный падеж естественен в современном русском языке.
- source_word: זַמְּרוּ לֹו
  choice: воспевайте Его
  rationale: Глагол זמר в породе пиэль означает петь хвалу или музицировать. «Воспевайте» сохраняет хвалебный смысл, отличает второй призыв от общего «пойте» и звучит достойно, но не архаично.
- source_word: שִׂיחוּ
  choice: рассказывайте
  rationale: שׂיח может обозначать речь, повествование или размышление. Контекст публичного призыва благоприятствует внешнему словесному действию; «рассказывайте» ясно и естественно выражает этот смысл.
- source_word: בְּכָל
  choice: обо всех
  rationale: При русском глаголе «рассказывать» предлог «о» естественно передаёт предмет речи, а «всех» сохраняет полноту כָּל.
- source_word: נִפְלְאֹתָיו
  choice: Его дивных делах
  rationale: Существительное от פלא обозначает необычайные, вызывающие изумление деяния, особенно Божьи могущественные действия. «Дивные дела» передаёт и чудесный характер, и конкретность поступков.
theological_decisions:
- issue: Неоднозначность глагола שׂיחוּ
  choice: 'Основной текст передаёт публичную речь: «рассказывайте».'
  alternative: «размышляйте» или «говорите»
  rationale: В ряду обращённых к общине повелений «пойте» и «воспевайте» контекст поддерживает открытое возвещение, однако возможный оттенок размышления сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным богослужебным звучанием. Заглавное написание местоимений, относящихся к Богу, принято как редакционная норма. Поэтический трёхчастный параллелизм сохранён.
