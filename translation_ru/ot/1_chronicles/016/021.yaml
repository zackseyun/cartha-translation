  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: ru
  text: 'Он никому не позволил притеснять их и ради них[a] обличил царей:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за них»; возможен также смысл «в их защиту».'
    reason: 'Лексико-синтаксическая неоднозначность עֲלֵיהֶם: выражение может обозначать основание действия, отношение к ним либо действие ради их блага.'
lexical_decisions:
- source_word: הִנִּיחַ
  choice: позволял
  rationale: В породе хифиль с отрицанием и инфинитивом глагол означает «позволять, допускать». Несовершенный вид естественно передаёт повторяющееся защитное действие в повествовательном контексте.
- source_word: אִישׁ
  choice: никому
  rationale: Сочетание לֹא ... לְאִישׁ имеет обобщённый смысл «никому»; это естественный современный русский эквивалент без неоправданного ограничения только мужчинами.
- source_word: לְעָשְׁקָם
  choice: притеснять их
  rationale: עשׁק обозначает угнетение, притеснение или неправомерную эксплуатацию. «Притеснять» сохраняет широту значения и уместно в историческом резюме.
- source_word: וַיּוֹכַח
  choice: обличал
  rationale: יכח здесь выражает порицание или властное предостережение. «Обличал» — ясное и достойное соответствие, подходящее при дополнении «царей».
- source_word: עֲלֵיהֶם
  choice: ради них
  rationale: Предлог עַל с местоименным суффиксом указывает, что действие совершалось в связи с ними или в их защиту. «Ради них» естественно выражает этот смысл, а возможная причинная трактовка отмечена в сноске.
- source_word: מְלָכִים
  choice: царей
  rationale: Существительное прямо означает «цари»; контекст не требует более общего «правители».
theological_decisions:
- issue: Неявное подлежащее глаголов
  choice: Местоимение «Он» относится к Богу, названному в окружающем контексте.
  alternative: Оставить действующее лицо неопределённым.
  rationale: Русское предложение требует явного или легко восстанавливаемого подлежащего; контекст однозначно продолжает описание Божьих защитных действий. Заглавная буква помогает обозначить референта, не добавляя нового утверждения.
- issue: Характер Божьего вмешательства по отношению к царям
  choice: «обличал» сохраняет смысл властного порицания без уточнения его формы.
  alternative: «наказывал» или «предостерегал».
  rationale: Еврейский יכח не требует здесь понимать действие именно как наказание и может включать упрёк либо предостережение; более широкое «обличал» сохраняет напряжение исходного выражения.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Параллелизм двух полустиший сохранён; двоеточие в конце указывает на продолжение прямой речи в следующем стихе. Маркер [a] помещён непосредственно после неоднозначного выражения.
