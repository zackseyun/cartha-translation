base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: ru
  text: а священника Садока и его братьев, священников, — перед скинией Яхве, на высоте, которая была в Гаваоне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: а [показатель прямого дополнения передан синтаксически]
  rationale: Союз продолжает конструкцию предыдущего стиха, где подразумевается действие «оставил»; отдельного русского соответствия показателю прямого дополнения אֵת нет.
- source_word: צָדוֹק הַכֹּהֵן
  choice: священника Садока
  rationale: Падежная форма отражает зависимость от подразумеваемого глагола предыдущего стиха; имя передано в принятой русской библейской форме.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: и его братьев-священников
  rationale: Сохраняется буквальный образ «его братья» и одновременно поясняется, что речь идёт о собратьях по священническому служению, без утверждения о кровном родстве.
- source_word: לִפְנֵי
  choice: перед
  rationale: Передаёт пространственное положение перед святилищем и сохраняет обычное значение еврейского предлога.
- source_word: מִשְׁכַּן יְהוָה
  choice: скинией Яхве
  rationale: «Скиния» — устоявшееся и точное русское обозначение переносного святилища; личное имя יהוה передано как «Яхве».
- source_word: בַּבָּמָה
  choice: на высоте
  rationale: במה обозначает культовое возвышенное место; «высота» сохраняет традиционный библейский термин и не вносит отрицательной оценки, не выраженной в данном контексте.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: в Гаваоне
  rationale: Относительная конструкция естественно сжата по-русски; местоположение высоты остаётся однозначным.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; транслитерация сохраняет личное заветное имя и следует предоставленному консультационному решению.
- issue: Значение אֶחָיו в кругу священников
  choice: братьев-священников
  alternative: других священников; его братьев, священников
  rationale: Так сохраняется родственное обозначение исходного текста, но естественное русское сложение показывает возможный профессионально-общинный смысл, не настаивая на кровном родстве.
- issue: Характер высоты в Гаваоне
  choice: нейтральное «на высоте»
  alternative: в святилище на возвышенности
  rationale: Текст не осуждает это место; нейтральный традиционный термин сохраняет историко-богословское напряжение, не приписывая месту ни незаконности, ни отдельного одобрения.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и традиционных библейских реалий. Фрагментарное начало с «а» намеренно продолжает синтаксис предыдущего стиха; тире отмечает эллипсис подразумеваемого сказуемого. Маркеры сносок не требуются.
