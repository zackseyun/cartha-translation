source:
  edition: WLC
  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: ru
  text: 'И скажите: «Спаси нас, Боже спасения нашего! Собери нас и избавь нас из среды народов, чтобы мы воздавали благодарение святому имени Твоему и торжествовали в хвале Твоей[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «хвалились Твоей хвалой» или «ликовали в хвале Твоей».'
    reason: Лексическое значение לְהִשְׁתַּבֵּחַ допускает оттенок «хвалиться» или «ликовать»; предлог בְּ в בִּתְהִלָּתֶךָ может быть передан как «в».
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: И скажите
  rationale: Сохранены соединительный союз и повелительное наклонение во множественном числе, вводящие общий богослужебный ответ.
- source_word: הוֹשִׁיעֵנוּ
  choice: Спаси нас
  rationale: Естественно передаёт каузативную форму от ישׁע и сохраняет отличие от последующего נצל — «избавь».
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Боже спасения нашего
  rationale: Сохраняет конструкцию «Бог нашего спасения» и звучит естественно как возвышенное прямое обращение.
- source_word: וְקַבְּצֵנוּ
  choice: Собери нас
  rationale: Передаёт значение собирания рассеянных, не сводя его лишь к созыву собрания.
- source_word: וְהַצִּילֵנוּ
  choice: и избавь нас
  rationale: Передаёт спасение от опасности и лексически отличается от стоящего ранее «спаси нас».
- source_word: מִן־הַגּוֹיִם
  choice: из среды народов
  rationale: По контексту речь идёт о народах, среди которых рассеян Израиль; «народы» не вносит более позднее специальное противопоставление иудеев и язычников.
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: чтобы мы благодарили святое имя Твоё
  rationale: Инфинитив с ל передан целевой конструкцией; выражение сохраняет направленность благодарения к святому имени Бога.
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: и торжествовали, воздавая Тебе хвалу
  rationale: Передаёт положительное ликование и прославление Бога, избегая современного отрицательного оттенка глагола «хвалиться»; менее явные буквальные варианты сохранены в примечании.
theological_decisions:
- issue: Передача הַגּוֹיִם как «народы» или «язычники»
  choice: из среды народов
  alternative: из среды язычников
  rationale: В данном ветхозаветном контексте имеются в виду народы, среди которых может быть рассеян Израиль; перевод «народы» не привносит более позднюю богословскую терминологию.
- issue: Смысл заключительного выражения о хвальбе и хвале
  choice: торжествовали, воздавая Тебе хвалу
  alternative: хвалились Твоей хвалой; ликовали в хвале Твоей
  rationale: Еврейский текст выражает радостную причастность к прославлению Бога. Основной перевод естественен по-русски, а примечание сохраняет возможный оттенок «хвалиться» или «ликовать».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-богослужебным звучанием. Формы «Боже» и порядок слов «спасения нашего» поддерживают достоинство обращения, не создавая излишней архаичности. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
