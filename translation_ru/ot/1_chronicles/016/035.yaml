  source_fidelity: 'Основная передача точна: сохранены повеления во множественном числе, различие между «спаси» (ישע) и «избавь» (נצל), а גוים корректно передано как «народы». Однако «торжествовали, воздавая Тебе хвалу» несколько переформулирует заключительное לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ: исходный текст говорит о торжестве/хвальбе именно «в Твоей хвале», а не просто о действии воздания хвалы.'
  naturalness: «Благодарили святое имя Твоё» понятно в библейском регистре, но в современном литературном русском более естественно и точно управление «воздавать благодарение святому имени Твоему». «Торжествовать в хвале Твоей» сохраняет возвышенный, но не архаизирующий тон.
  terminology: «Боже спасения нашего», «Собери нас», «избавь нас», «народы» и «святое имя Твоё» удачны. Прописные буквы в обращении к Богу соответствуют принятому русскому библейскому употреблению.
