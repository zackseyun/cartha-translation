source:
  edition: WLC
  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: ru
  text: Воздайте Яхве, племена народов[a], воздайте Яхве славу и силу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «роды народов»; или: «семьи народов».'
    reason: Лексема מִשְׁפְּחוֹת может обозначать семьи, роды, кланы или племена; примечание сохраняет диапазон возможных значений.
lexical_decisions:
- source_word: הָבוּ
  choice: Воздайте
  rationale: Форма повелительного наклонения во множественном числе в богослужебном контексте призывает признать и провозгласить принадлежащее Богу, а не буквально что-либо передать Ему. «Воздайте» естественно передаёт этот смысл и сохраняет повтор глагола.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому следует воздать славу и силу; тетраграмматон передан как личное имя «Яхве».
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: племена народов
  rationale: מִשְׁפְּחוֹת обозначает родственные объединения, роды или кланы, а עַמִּים — множество народов. «Племена народов» звучит естественно и сохраняет обращение ко всем этническим группам.
- source_word: כָּבוֹד
  choice: славу
  rationale: В контексте хвалы слово обозначает славу и честь, признаваемые за Богом; «слава» — точный и привычный русский эквивалент.
- source_word: וָעֹז
  choice: и силу
  rationale: עֹז означает силу или могущество. «Силу» кратко и ясно передаёт смысл и естественно сочетается со «славой».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл повеления הָבוּ применительно к Богу
  choice: Воздайте
  alternative: Дайте; признайте за Яхве
  rationale: Речь не о передаче Богу того, чего у Него нет, а о признании и прославлении присущих Ему славы и силы. «Воздайте» сохраняет образ исходного выражения без лишнего богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным богослужебным звучанием. Сохранены параллелизм, повтор повеления и порядок основных смысловых элементов еврейского текста.
