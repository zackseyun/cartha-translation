translation:
  language: ru
  text: 'говоря: «Тебе Я дам землю Ханаана — вашу наследственную долю[b]».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте «тебе» стоит в единственном числе, а «вашу» — во множественном; вероятно, речь переходит от патриарха, которому дано обещание, к его потомкам как наследникам завета.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надел». Еврейское слово буквально означает верёвку или мерную линию, а затем — отмеренную долю земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитивная конструкция от אמר вводит содержание заветного обещания, начатого в предыдущем стихе; «говоря» сохраняет связь с контекстом и привычно звучит в повествовании.
- source_word: לְךָ
  choice: тебе
  rationale: Местоименный суффикс второго лица мужского рода единственного числа обозначает получателя обещанного дара и сохраняет обращение к патриарху.
- source_word: אֶתֵּן
  choice: Я дам
  rationale: Имперфект qal первого лица единственного числа в контексте обещания естественно передаётся будущим временем.
- source_word: אֶרֶץ כְּנָעַן
  choice: землю Ханаана
  rationale: Передаёт конкретную обещанную территорию и непосредственно отражает сочетание существительных в еврейском тексте.
- source_word: חֶבֶל
  choice: удел
  rationale: В контексте распределения земли слово обозначает отмеренную долю или земельный надел; «удел» естественно сохраняет образ выделенной части владения.
- source_word: נַחֲלַתְכֶם
  choice: вашего наследия
  rationale: Слово נַחֲלָה обозначает наследственное владение, особенно землю завета. Форма «вашего» сохраняет множественное число еврейского суффикса и не сглаживает переход от единственного числа.
theological_decisions:
- issue: Переход от адресата в единственном числе к притяжательной форме во множественном числе
  choice: 'Сохранить оба числа: «Тебе… вашего наследия»'
  alternative: Согласовать всё в единственном числе («твоего наследия») или пояснительно перевести «тебе и твоим потомкам»
  rationale: В еврейском тексте рядом стоят единственное לְךָ и множественное נַחֲלַתְכֶם. Сохранение этого перехода передаёт напряжение между обещанием патриарху и наследованием земли его потомками, не превращая толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Тире ясно оформляет приложение «удел вашего наследия», не добавляя сравнительного или причинного значения. Заглавное «Я» указывает на говорящего Бога в соответствии с устойчивой русской библейской типографической практикой.
