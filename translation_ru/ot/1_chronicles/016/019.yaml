lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: когда вас было
  rationale: Предлог ב с инфинитивом конструктивного состояния глагола היה и суффиксом 2-го лица множественного числа образует временное придаточное; этот вариант естественно передаёт его по-русски.
- source_word: מְתֵי מִסְפָּר
  choice: вас было мало
  rationale: Еврейская идиома обозначает немногочисленную, легко исчислимую группу; выбранная формулировка ясна и естественна в современном русском языке.
- source_word: כִּמְעַט
  choice: совсем мало
  rationale: В данном контексте выражение усиливает мысль о крайней малочисленности. Повтор с усилительным наречием сохраняет эмфазу оригинала.
- source_word: וְגָרִים
  choice: и вы были ... пришельцами
  rationale: Форма от גור обозначает людей, живущих не на своей земле без положения коренных жителей. «Пришельцы» сохраняет социальный и повествовательный оттенок лучше, чем общее «чужеземцы».
- source_word: בָּהּ
  choice: в ней
  rationale: Суффикс женского рода указывает на упомянутую в контексте землю; русское местоимение женского рода сохраняет эту отсылку.
