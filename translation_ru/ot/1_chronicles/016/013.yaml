  source_fidelity: 'Текст точно передаёт еврейский параллелизм: זֶרַע — «потомки», Израиль назван «рабом Его», а בני יעקב — «сыны Иакова», «избранные Им». Грамматически «раба Его» относится к Израилю, как и в оригинале; «избранные Им» во второй строке относится к сынам Иакова. Обращение «О» уместно в поэтическом призыве и не меняет смысла.'
