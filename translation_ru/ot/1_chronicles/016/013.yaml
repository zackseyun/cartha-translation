source:
  edition: WLC
  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: ru
  text: 'О потомки Израиля, раба Его,[a]

    сыны Иакова, избранные Им![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя Израиля»; еврейское слово употреблено собирательно и означает его потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Его избранники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: потомки
  rationale: Коллективное существительное обозначает потомство Израиля. «Потомки» естественно и ясно передаёт смысл по-русски; буквальное «семя» возможно, но в современной речи может быть понято неверно.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Традиционная русская форма личного и заветного имени; родительный падеж обусловлен сочетанием «потомки Израиля».
- source_word: עַבְדּוֹ
  choice: раба Его
  rationale: В контексте это почётное заветное обозначение Израиля как служителя Бога, а не указание на социальное рабство. Постпозиция и прописная буква у местоимения делают отнесение суффикса к Богу ясным.
- source_word: בְּנֵי
  choice: сыны
  rationale: Сохраняет буквальный мужской множественный образ еврейского выражения и соответствует возвышенному поэтическому регистру; более разговорный вариант — «сыновья».
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Традиционная русская библейская форма имени; родительный падеж соответствует конструкции «сыны Иакова».
- source_word: בְּחִירָיו
  choice: избранные Им
  rationale: Передаёт множественное число и значение избрания Богом, избегая субстантивированного «избранники», которое может звучать как закреплённый статус или особая группа.
theological_decisions:
- issue: К кому относятся суффиксы 3-го лица мужского рода в עַבְדּוֹ и בְּחִירָיו
  choice: 'Они относятся к Богу: Израиль — Его раб, а потомки Иакова избраны Им.'
  alternative: Формально местоименная отсылка может оставаться невыраженной по имени и определяться контекстом.
  rationale: Контекст призыва помнить дела Господа естественно указывает на Бога как обладателя раба и избирающего. Перевод сохраняет эту связь, не добавляя имени Бога в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством поэтического обращения. Параллелизм двух строк сохранён. «Сыны» выбрано как понятное, но возвышенное соответствие буквальному «сыновья/сыны»; местоимения о Боге оформлены по традиционной русской библейской норме.
