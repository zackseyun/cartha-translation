  terminology: Имена «Израиль» и «Иаков» переданы в принятой русской библейской форме. «Раб Его» корректно передаёт заветное обозначение עבדו без неоправданного смягчения или конфессионального истолкования. «Избранные Им» точно передаёт בחיריו и сохраняет множественное число. Сноска к «потомки» адекватно отмечает буквальное «семя» и собирательность.
