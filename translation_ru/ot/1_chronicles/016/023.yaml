source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ כָּל הָ/אָ֔רֶץ בַּשְּׂר֥וּ מִ/יּֽוֹם אֶל י֖וֹם יְשׁוּעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: ru
  text: Пойте Яхве[a], вся земля; день за днём возвещайте[b] о Его спасении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господу». В еврейском тексте стоит Божье имя יהוה (Яхве).'
    reason: alternative_reading
  - marker: b
    text: 'Глагол может означать: «приносите добрую весть», «благовествуйте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Пойте
  rationale: Форма повелительного наклонения множественного числа от שׁיר прямо призывает петь; перевод не добавляет отсутствующего в тексте уточнения «хвалу».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог לְ перед личным именем передан русским дательным падежом, а тетраграмматон יְהוָה — формой «Яхве», сохраняющей личное Божье имя.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: В гимническом призыве выражение имеет универсальный смысл; «вся земля» естественно сохраняет образ и объём древнееврейского текста.
- source_word: בַּשְּׂרוּ
  choice: возвещайте
  rationale: Порода пиэль глагола בשׂר обозначает принесение или публичное объявление доброй вести. «Возвещайте» подходит к высокому поэтическому регистру, а положительная природа вести раскрывается её содержанием — спасением.
- source_word: מִיּוֹם אֶל יוֹם
  choice: день за днём
  rationale: Русское выражение естественно передаёт непрерывность и ежедневное повторение, заключённые в древнееврейском обороте.
- source_word: יְשׁוּעָתוֹ
  choice: о Его спасении
  rationale: יְשׁוּעָה может обозначать спасение, избавление или победу. «Спасение» сохраняет широкий смысл; предлог «о» требуется русским управлением глагола «возвещать» в данной формулировке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, а не титул. «Яхве» сохраняет это различие; традиционный вариант «Господь» указан в примечании.
- issue: Смысл יְשׁוּעָתוֹ
  choice: Его спасение
  alternative: Его избавление
  rationale: Контекст не требует сужать значение до конкретного исторического избавления или победы, поэтому сохранено более широкое «спасение».
translation_notes:
  register: Современный литературный русский язык с достоинством гимнического призыва. Обращение «вся земля» сохранено без перестройки, а оборот «день за днём» выбран как естественный русский эквивалент повторяющегося действия.
