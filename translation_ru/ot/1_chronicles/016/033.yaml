base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: ru
  text: Тогда возликуют деревья леса перед Яхве, ибо Он идёт[a] судить землю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он приходит судить землю». Еврейская форма в поэтическом контексте может изображать грядущее действие как живое и несомненное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страну». Здесь общий контекст ликования творения говорит в пользу значения «земля».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Естественно передаёт временное наречие, вводящее следующую картину или результат.
- source_word: יְרַנְּנוּ
  choice: возликуют
  rationale: Пиэль глагола רנן обозначает громкое радостное ликование; русский глагол сохраняет и поэтичность, и неоднозначность между пением и возгласами.
- source_word: עֲצֵי הַיָּעַר
  choice: деревья леса
  rationale: Прямо передаёт сочетание существительных и сохраняет поэтическое олицетворение.
- source_word: מִלִּפְנֵי
  choice: пред
  rationale: В возвышенном поэтическом регистре естественно означает пребывание перед лицом, в присутствии Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание для ликования творения и соответствует достоинству гимнической речи.
- source_word: בָא
  choice: Он идёт
  rationale: В данном поэтическом контексте форма изображает приход как живое, несомненное действие; настоящее время русского глагола сохраняет эту выразительность.
- source_word: לִשְׁפּוֹט
  choice: судить
  rationale: Прямо передаёт судебное действие, не исключая связанного с ним осуществления Божьего правления.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте всеобщего ликования творения обозначает всю землю, хотя еврейское слово допускает и более локальное значение «страна».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Временная окраска בָא
  choice: Он идёт
  alternative: Он приходит / Он пришёл
  rationale: Поэтическая форма представляет приход как живой и несомненный; перевод не сводит её однозначно к обычному прошедшему времени.
- issue: Объём значения הָאָרֶץ
  choice: землю
  alternative: страну
  rationale: Космический контекст хвалы творения поддерживает универсальное значение, но лексическая возможность локального прочтения отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной гимнической окраской. «Возликуют» естественно охватывает радостное пение или возгласы, поэтому отдельная сноска к этому слову не требуется; «пред» сохраняет достоинство поэзии, не делая синтаксис архаичным.
