  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: ru
  text: Когда Давид закончил приносить всесожжение и мирные жертвы[a], он благословил народ именем Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения»; или: «жертвы благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Когда ... закончил
  rationale: Форма продвигает повествование и обозначает завершение действия; придаточное с «когда» естественно передаёт временную связь со следующим действием.
- source_word: מֵהַעֲלוֹת
  choice: приносить
  rationale: Сочетание מִן с инфинитивом после כלה означает завершение принесения; по-русски «закончил приносить» звучит естественно, а жертвенный смысл ясен из дополнений.
- source_word: הָעֹלָה
  choice: всесожжение
  rationale: Устоявшееся и точное русское обозначение жертвы, целиком сжигаемой на жертвеннике.
- source_word: וְהַשְּׁלָמִים
  choice: и мирные жертвы
  rationale: Традиционное русское название данного класса жертв; возможные оттенки общения и благополучия сохранены в сноске.
- source_word: וַיְבָרֶךְ
  choice: он благословил
  rationale: Прямо и естественно передаёт значение глагола ברך в данном контексте.
- source_word: אֶת־הָעָם
  choice: народ
  rationale: В еврейском тексте сказано «народ» без явно выраженного значения «весь».
- source_word: בְּשֵׁם יְהוָה
  choice: именем Яхве
  rationale: Русская конструкция «благословить именем» естественно передаёт בְּשֵׁם и сохраняет личное Божье имя.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
theological_decisions:
- issue: Передача жертвенного термина שְׁלָמִים
  choice: мирные жертвы
  alternative: жертвы общения; жертвы благополучия
  rationale: Еврейский термин допускает оттенки мира, благополучия и общения. Основной текст сохраняет узнаваемое название жертвенной категории, а сноска — подлинную широту значения.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис ясен обычному читателю; культовые термины переданы последовательно и без конфессиональных добавлений.
