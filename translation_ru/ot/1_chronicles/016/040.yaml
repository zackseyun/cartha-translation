source:
  edition: WLC
  text: לְֽ/הַעֲלוֹת֩ עֹל֨וֹת לַ/יהוָ֜ה עַל מִזְבַּ֧ח הָ/עֹלָ֛ה תָּמִ֖יד לַ/בֹּ֣קֶר וְ/לָ/עָ֑רֶב וּ/לְ/כָל הַ/כָּתוּב֙ בְּ/תוֹרַ֣ת יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: ru
  text: чтобы постоянно приносить всесожжения Яхве на жертвеннике всесожжения — утром и вечером — согласно всему, что написано в Законе Яхве[a], который Он заповедал Израилю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в наставлении Яхве». Еврейское слово тора может означать как «закон», так и «наставление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: приносить всесожжения
  rationale: В жертвенном контексте каузатив глагола עלה означает совершать приношение, а עֹלָה — жертву, сжигаемую целиком. «Приносить всесожжения» — точная и естественная русская культовая формула.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Тетраграмматон передан личным именем «Яхве», а предлог ל выражен дательным падежом: жертвы приносятся Яхве.'
- source_word: מִזְבַּח הָעֹלָה
  choice: жертвенник всесожжения
  rationale: Сочетание обозначает особый жертвенник, предназначенный для всесожжений; традиционная русская формулировка ясна и точна.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Слово указывает на непрерывную регулярность установленного служения; дальнейшие слова «утром и вечером» уточняют его ежедневный ритм.
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: утром и вечером
  rationale: Естественная русская передача двух ежедневных сроков принесения жертвы.
- source_word: וּלְכָל הַכָּתוּב
  choice: согласно всему, что написано
  rationale: Предлог ל здесь выражает соответствие письменным предписаниям. Такая формулировка передаёт смысл без неестественного буквализма.
- source_word: בְּתוֹרַת יְהוָה
  choice: в Законе Яхве
  rationale: В данном контексте תּוֹרָה обозначает записанные предписания завета. «Закон» понятно широкому читателю, а возможное значение «наставление» сохранено в сноске.
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: который Он заповедал Израилю
  rationale: Оборот с צוה и עַל описывает повеление, возложенное на Израиль. Русская формулировка сохраняет обязательный характер предписания и его адресата.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога — тетраграмматон. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение תּוֹרָה
  choice: Закон
  alternative: наставление
  rationale: Культово-правовой контекст делает «Закон» наиболее ясным основным вариантом, но более широкое лексическое значение «наставление» отмечено в сноске, чтобы не устранять смысловой диапазон слова.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Начальное «чтобы» и строчная буква сохраняют синтаксическую зависимость стиха от предыдущего контекста. Тире выделяют уточняющий ежедневный ритм постоянного служения.
