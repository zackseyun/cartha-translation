base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: ru
  text: Воздайте Яхве славу, подобающую Его имени; принесите приношение и предстаньте перед Ним. Поклонитесь Яхве в святом великолепии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в великолепии святости»; возможно: «в священном облачении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Воздайте
  rationale: В богослужебном призыве глагол означает признать и воздать подобающую славу, а не буквально передать её.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога יהוה, прямо употреблённое в еврейском тексте.
- source_word: כְּבוֹד שְׁמוֹ
  choice: славу, подобающую Его имени
  rationale: Естественно передаёт славу, связанную с именем Яхве и должную ему, не сводя конструкцию лишь к принадлежности.
- source_word: שְׂאוּ מִנְחָה
  choice: принесите дар
  rationale: В сочетании с מִנְחָה глагол שְׂאוּ имеет идиоматический смысл принесения; «дар» сохраняет широкий диапазон жертвенного или почётного приношения.
- source_word: וּבֹאוּ לְפָנָיו
  choice: и предстаньте перед Ним
  rationale: Передаёт приближение к Богу и появление в Его присутствии в контексте поклонения.
- source_word: הִשְׁתַּחֲווּ
  choice: Поклонитесь
  rationale: Русское «поклонитесь» сохраняет одновременно телесный жест преклонения и его богослужебный смысл.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: в святом великолепии
  rationale: Сохраняет поэтическую краткость и допускает понимание как великолепия святости, не исключая возможной связи со священным облачением.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Значение בְּהַדְרַת קֹדֶשׁ
  choice: в святом великолепии
  alternative: в великолепии святости; в священном облачении
  rationale: Компактное поэтическое выражение допускает качественное, абстрактное и, возможно, культово-одежное прочтение; основной текст не должен неоправданно сужать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным богослужебным звучанием. Параллельные повелительные формы и поэтическая компактность исходного текста сохранены.
