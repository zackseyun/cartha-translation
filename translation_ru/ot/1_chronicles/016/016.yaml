  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: ru
  text: 'который Он заключил с Авраамом,

    и клятву, которую Он дал Исааку, —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение вводит придаточное и относится к «завету» из предыдущего стиха.
- source_word: כָּרַת
  choice: заключил
  rationale: Буквально глагол означает «резать», но в сочетании с подразумеваемым «заветом» это устойчивое древнееврейское выражение со значением «заключить завет».
- source_word: אֶת אַבְרָהָם
  choice: с Авраамом
  rationale: В рамках выражения о заключении завета показатель прямого дополнения естественно передаётся по-русски предлогом «с».
- source_word: וּשְׁבוּעָתוֹ
  choice: и клятву Свою
  rationale: Существительное передано как «клятва», а местоименный суффикс 3-го лица мужского рода сохранён посредством «Свою»; инверсия поддерживает поэтический параллелизм.
- source_word: לְיִצְחָק
  choice: Исааку
  rationale: Предлог ל обозначает адресата клятвы; русский дательный падеж естественно передаёт значение «Исааку» без добавочного предлога.
theological_decisions:
- issue: Заветная идиома כרת ברית, где слово «завет» подразумевается из предыдущего стиха
  choice: который Он заключил с Авраамом
  alternative: который Он отсёк с Авраамом
  rationale: Передано значение древнееврейской идиомы, а не её неестественная для русского языка буквальная форма. Связь с заветом сохраняется благодаря antecedенту в предыдущем стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Заглавные формы «Он» и «Свою» обозначают Бога согласно принятой русской библейской традиции. Конечное тире показывает, что синтаксическая и поэтическая мысль продолжается в следующем стихе.
