  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: ru
  text: И оставил он там перед ковчегом завета Яхве Асафа и его братьев, чтобы они постоянно служили перед ковчегом, исполняя каждый день положенное на этот день.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по делу дня в его день».'
    reason: Сноска сохраняет необычную форму еврейского оборота, который в основном тексте естественно передан как исполнение обязанности, положенной для соответствующего дня.
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: оставил
  rationale: Основное значение עזב — «оставить». В данном контексте слово указывает, что Асаф и его братья были оставлены там для постоянного служения; перевод «назначил» был бы более толковательным.
- source_word: שָׁם
  choice: там
  rationale: Сохранено простое обстоятельство места.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: перед ковчегом завета Яхве
  rationale: לִפְנֵי передаёт пространственное и богослужебное значение «перед»; вся сопряжённая конструкция сохранена, а личное имя יְהוָה передано как «Яхве».
- source_word: לְאָסָף וּלְאֶחָיו
  choice: Асафа и его братьев
  rationale: Буквальное «братья» сохраняет общинный смысл; в контексте это могут быть также собратья по левитскому служению.
- source_word: לְשָׁרֵת
  choice: служили
  rationale: שרת обозначает служение, особенно при святилище. Русское «служили» естественно передаёт культовый контекст без излишней церковно-административной окраски.
- source_word: תָּמִיד
  choice: постоянно
  rationale: Передаёт непрерывную регулярность установленного богослужения.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: исполняя изо дня в день положенное на каждый день
  rationale: Фраза выражает ежедневное исполнение соответствующей данному дню обязанности. Перевод сохраняет повтор дня, но звучит естественно по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом; форма «Иегова» менее точно отражает древнее произношение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов слегка приподнят, но остаётся ясным. Местоимение «он» сохраняет зависимость стиха от предшествующего контекста; повтор «перед ковчегом» оставлен вслед за еврейским текстом.
