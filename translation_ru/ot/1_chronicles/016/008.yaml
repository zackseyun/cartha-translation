  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: ru
  text: Благодарите Яхве; призывайте имя Его; возвещайте среди народов о Его деяниях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Благодарите
  rationale: Форма повелительного наклонения множественного числа от ידה в контексте хвалы естественно передаётся как призыв благодарить Бога.
- source_word: לַֽיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя יהוה, а не заменяет его титулом.
- source_word: קִרְא֣וּ בִשְׁמ֔וֹ
  choice: призывайте Его имя
  rationale: Сочетание קרא с בְּשֵׁם здесь обозначает обращение к Богу, призывание Его по имени; русский оборот сохраняет смысл и образ исходного текста.
- source_word: הוֹדִ֥יעוּ
  choice: возвещайте
  rationale: Hiphil от ידע имеет каузативный смысл «делать известным»; «возвещайте» естественно выражает публичное провозглашение.
- source_word: בָעַמִּ֖ים
  choice: среди народов
  rationale: עַמִּים обозначает многие народы или этнические общности; «народы» не сужает значение до современных государств.
- source_word: עֲלִילֹתָֽיו
  choice: Его деяниях
  rationale: עֲלִילוֹת обозначает совершённые действия или дела; «деяния» сохраняет возвышенный контекст хвалы без добавления отсутствующего определения «могучие».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит тетраграмматон как личное имя Бога. «Яхве» сохраняет различие между именем и титулом и соответствует принятой научной реконструкции произношения.
- issue: Значение קִרְאוּ בִשְׁמוֹ
  choice: призывайте Его имя
  alternative: провозглашайте Его имя
  rationale: Конструкция допускает оттенок провозглашения, однако в богослужебном ряду повелений прежде всего указывает на обращение к Богу. Формулировка не уточняет характер обращения сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным богослужебным звучанием. Сохранены три параллельных повеления еврейского текста; местоимение при божественном референте написано с прописной буквы по устойчивой русской библейской традиции.
