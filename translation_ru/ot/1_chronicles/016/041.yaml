  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: ru
  text: А с ними — Еман, Идифун и остальные избранные, названные по именам[a], чтобы благодарить Яхве, ибо милость Его вовек[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «определённые по именам»; буквально: «названные по именам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ибо вовек милость Его» — повторяющийся богослужебный рефрен.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: А с ними —
  rationale: Предложная конструкция продолжает перечень предыдущего контекста; тире естественно передаёт подразумеваемую связку в русском языке.
- source_word: הֵימָן וִידוּתוּן
  choice: Еман, Идифун
  rationale: Традиционные и узнаваемые русские формы библейских личных имён.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: и остальные избранные
  rationale: שְׁאָר означает «остаток, остальные», а пассивное причастие בְּרוּרִים — людей, которых выбрали; существительное «люди» добавлять не требуется.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: поимённо назначенные
  rationale: Оборот указывает, что избранные были особо определены или названы по именам; краткая русская формулировка сохраняет обе смысловые стороны.
- source_word: לְהֹדוֹת
  choice: благодарить
  rationale: В богослужебном контексте Hiphil от ידה означает благодарить или воздавать хвалу; следующий рефрен поддерживает значение благодарения.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя יהוה, прямо стоящее в еврейском тексте.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: «Ведь милость Его — навеки!»
  rationale: Формула передаёт содержание благодарения и узнаваемый литургический рефрен. «Милость» выражает חֶסֶד без чрезмерного сужения его богатого значения, а именная конструкция сохраняет буквальную форму «навеки Его милость».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст употребляет тетраграмматон как личное имя; транслитерация отличает его от титула אֲדֹנָי.
- issue: Значение חֶסֶד
  choice: милость
  alternative: неизменная любовь
  rationale: «Милость» — естественный и литургически уместный русский эквивалент, сохраняющий широту понятия; более развёрнутый вариант мог бы чрезмерно конкретизировать его как исключительно эмоциональную любовь.
- issue: Связь частицы כִּי с благодарением
  choice: содержание благодарения, оформленное как прямая литургическая формула
  alternative: 'причина: «потому что Его милость навеки»'
  rationale: כִּי допускает как причинное, так и изъяснительное прочтение. Двоеточие и цитатное оформление естественно передают рефрен, не исключая причинного оттенка.
translation_notes:
  register: Современный литературный русский с достоинством богослужебного повествования. Традиционные русские формы имён сочетаются с передачей тетраграмматона как «Яхве». Прямая речь выделяет устойчивый храмовый рефрен.
