  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: ru
  text: Трепещите перед Ним, вся земля! Воистину, мир утверждён — он не поколеблется.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пошатнётся»; возможен также перевод «не сдвинется». Еврейский образ подчёркивает прочную устойчивость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: Трепещи
  rationale: Повелительная форма глагола חול здесь передаёт дрожь перед Божьим присутствием. «Трепещи» естественно звучит в возвышенном призыве и сохраняет как физический образ, так и благоговейный оттенок.
- source_word: מִלְּפָנָיו
  choice: перед Ним
  rationale: Буквально выражение связано с нахождением «перед Его лицом/присутствием»; русский оборот «перед Ним» кратко и естественно передаёт этот смысл.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: В контексте вселенской хвалы אֶרֶץ означает всю землю, а не отдельную страну.
- source_word: אַף
  choice: воистину
  rationale: Частица усиливает последующее утверждение; «воистину» передаёт эмфатический характер и соответствует торжественному поэтическому регистру.
- source_word: תִּכּוֹן
  choice: утверждён
  rationale: Нифаль глагола כון выражает прочную установленность и устойчивость. Краткая форма «утверждён» сохраняет результирующее состояние и подразумеваемое устроение.
- source_word: תֵּבֵל
  choice: мир
  rationale: תֵּבֵל обозначает мир как обитаемое, устроенное целое; в данном стихе «мир» — наиболее естественный и ёмкий русский эквивалент.
- source_word: בַּל
  choice: не
  rationale: Поэтическое отрицание прямо передаётся русским «не».
- source_word: תִּמּוֹט
  choice: не поколеблется
  rationale: Форма от מוט означает пошатнуться, поколебаться или утратить устойчивость. «Не поколеблется» сохраняет образ твёрдости, не превращая поэтическое утверждение в научное заявление об отсутствии движения.
theological_decisions:
- issue: Образ устойчивости мира
  choice: 'Стих утверждает, что мир прочно устроен под Божьей властью: «не поколеблется».'
  alternative: Можно перевести более буквально через «не пошатнётся» либо традиционно через «не сдвинется».
  rationale: Еврейская поэтическая речь подчёркивает устойчивость и надёжность сотворённого порядка. «Не поколеблется» сохраняет этот богословский смысл, не внося в текст более поздних космологических споров.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. Единственное число «Трепещи» согласовано с собирательным обращением «вся земля». Местоимение «Ним» написано с прописной буквы как допустимая русская библейская издательская конвенция.
