base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: ru
  text: И внесли ковчег Божий и поставили его посреди шатра[a], который Давид раскинул для него, и принесли пред Богом всесожжения и мирные жертвы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутри шатра». Еврейское выражение может обозначать нахождение внутри, буквально — «посреди шатра».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жертвы общения» или «жертвы благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: внесли
  rationale: Каузативная форма בוא означает «принести/внести»; в контексте ковчег вносят в приготовленный шатёр.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: ковчег Божий
  rationale: Передаёт именно краткое еврейское выражение, не добавляя отсутствующего здесь слова «завета».
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: поставили его
  rationale: В данной конструкции יצג означает установить или поместить предмет на предназначенное место.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: посреди шатра
  rationale: Сохраняет конкретное пространственное значение בְּתוֹךְ — «в середине/посреди», не исключая более общего смысла «внутри».
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: который Давид раскинул для него
  rationale: נטה в сочетании с шатром означает «раскинуть, поставить шатёр»; לוֹ естественно относится к ковчегу.
- source_word: וַיַּקְרִיבוּ
  choice: принесли
  rationale: В жертвенном контексте Hiphil קרב обозначает принесение жертвы.
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Точный и общепринятый русский термин для жертв, целиком сжигаемых на жертвеннике.
- source_word: שְׁלָמִים
  choice: мирные жертвы
  rationale: Традиционный и понятный термин, сохраняющий связь слова с благополучием и миром; возможны также передачи через общение или благополучие.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: пред Богом
  rationale: Кратко и буквально передаёт значение «перед лицом/в присутствии Бога».
theological_decisions:
- issue: Передача видов жертв
  choice: всесожжения и мирные жертвы
  alternative: жертвы всесожжения и жертвы общения; жертвы
  rationale: Сохранены два различных культовых термина, чтобы не сводить их к неопределённому общему названию.
- issue: Определение сооружения для ковчега
  choice: шатёр
  alternative: скиния
  rationale: В еврейском тексте употреблено обычное слово «шатёр», который поставил Давид; «скиния» могла бы необоснованно отождествить его с Моисеевой скинией.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность повествования оригинала; специальная жертвенная лексика оставлена без конфессионального уточнения.
