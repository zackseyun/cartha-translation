- source_word: לַיהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте.
- source_word: בְּיַד אָסָף וְאֶחָיו
  choice: Асафу и его братьям
  rationale: Буквально «рукою Асафа и его братьев»; оборот בְּיַד обозначает посредничество или исполнителей, что по-русски естественно включается в конструкцию с глаголом «поручил».
