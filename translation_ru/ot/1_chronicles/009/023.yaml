base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: ru
  text: Они и их сыновья отвечали за ворота дома Яхве, то есть дома шатра[a], и несли стражу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дома скинии». Буквально: «дома шатра».'
    reason: Лексический вариант поясняет необычное древнееврейское выражение, сохраняя возможность традиционного понимания как скинии.
lexical_decisions:
- source_word: וְהֵם
  choice: Они
  rationale: Союз с местоимением возобновляет подлежащее; в современном русском начальное «и» здесь необязательно.
- source_word: וּבְנֵיהֶם
  choice: и их сыновья
  rationale: В контексте наследственного служения привратников בנים обозначает сыновей, то есть мужских потомков.
- source_word: עַל הַשְּׁעָרִים
  choice: были поставлены над воротами
  rationale: Предлог עַל в данном служебно-административном контексте выражает ответственность и надзор, а не только местонахождение.
- source_word: לְבֵית יְהוָה
  choice: воротами дома Яхве
  rationale: Оборот указывает на принадлежность ворот святилищу; личное имя יהוה передано как «Яхве».
- source_word: לְבֵית הָאֹהֶל
  choice: дома шатра
  rationale: Передаёт буквальную и намеренно необычную формулировку древнееврейского текста, не сводя её без пояснения к термину «скиния».
- source_word: לְמִשְׁמָרוֹת
  choice: и несли стражу
  rationale: Существительное обозначает караульную обязанность; глагольная формулировка естественна по-русски и ясно выражает функцию привратников.
theological_decisions:
- issue: Соотношение выражений «дом Яхве» и «дом шатра»
  choice: 'Второе выражение передано как поясняющее приложение: «то есть дома шатра».'
  alternative: Понимать «дом шатра» как отдельное место либо заменить оба выражения единым словом «скиния».
  rationale: Такая передача сохраняет оба обозначения и связь храмового служения с более ранним шатровым святилищем, не устраняя необычность и смысловое напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формулировка «были поставлены над воротами» передаёт ответственность без архаичного канцеляризма; «несли стражу» естественно обозначает караульное служение.
