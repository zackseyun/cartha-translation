base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/032.yaml
  text: And some of the sons of the Kohathites[a], from among their brothers, were in charge of the bread of the arrangement, to prepare it Sabbath by Sabbath.
translation:
  language: ru
  text: А некоторые из каафитян, из числа своих собратьев, отвечали за хлеб, разложенный рядами,[a] и готовили его каждую субботу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «хлеб предложения» или «хлеб присутствия». Буквально еврейское выражение означает хлеб, разложенный в определённом порядке, вероятно рядами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי הַקְּהָתִי מִן אֲחֵיהֶם
  choice: А некоторым из сыновей Каафа, их братьям
  rationale: Два оборота с מִן передают выделение части каафитов из числа их собратьев-левитов. «Сыновья Каафа» сохраняет родовое обозначение оригинала, а «их братья» — прямой смысл אֲחֵיהֶם.
- source_word: עַל
  choice: было поручено
  rationale: В административном контексте предлог указывает на возложенную ответственность; безличная конструкция естественна по-русски.
- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: хлеб, разложенный рядами
  rationale: מַעֲרֶכֶת обозначает упорядоченное расположение или ряд. Выбор передаёт предметный смысл выражения и избегает малопонятного традиционного термина без пояснения.
- source_word: לְהָכִין
  choice: готовить
  rationale: Инфинитив обозначает назначение поручения; контекст позволяет не повторять дополнение «его».
- source_word: שַׁבַּת שַׁבָּת
  choice: из субботы в субботу
  rationale: Повтор существительного имеет распределительное значение. Русский оборот сохраняет повторяемость и ритм оригинала.
