  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: ru
  text: Первыми жителями, жившими в своих владениях, в своих городах, были израильтяне, священники, левиты и храмовые служители[a].
