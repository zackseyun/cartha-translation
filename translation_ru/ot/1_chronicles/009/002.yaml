lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים הָרִאשֹׁנִים
  choice: первыми жителями
  rationale: Причастие от ישׁב обозначает живущих или обитающих людей, а הָרִאשֹׁנִים — первых; русская конструкция с творительным падежом естественно передаёт именную часть сказуемого.
- source_word: אֲשֶׁר בַּאֲחֻזָּתָם בְּעָרֵיהֶם
  choice: поселившимися в своих владениях, в своих городах
  rationale: אֲחֻזָּה означает земельное владение, нередко наследственное. «Поселившимися» естественно выражает проживание в названных местах и соответствует контексту возвращения, не добавляя отдельного временного наречия. Повтор «в своих» сохраняет параллельные предложные сочетания еврейского текста.
- source_word: יִשְׂרָאֵל
  choice: израильтяне
  rationale: Собирательное «Израиль» здесь входит в перечень групп населения; по-русски обозначение людей словом «израильтяне» яснее и естественнее, чем «Израиль».
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное и контекстуально точное обозначение священнической группы.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Стандартное обозначение левитов как отдельной группы наряду со священниками.
- source_word: וְהַנְּתִינִים
  choice: и храмовые служители[a]
  rationale: נְתִינִים — особая группа людей, назначенных для служения при храме. Функциональный перевод понятен современному читателю, а традиционное название вынесено в сноску.
