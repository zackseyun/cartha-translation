translation_notes:
  register: Современный литературный русский язык с умеренно официальным, летописным звучанием. Сохранён перечень четырёх групп; вводное «и» в начале стиха отдельно не передано, поскольку в русском оно без контекста звучало бы тяжеловесно. Маркер сноски помещён после выражения «храмовые служители», к которому относится пояснение.
