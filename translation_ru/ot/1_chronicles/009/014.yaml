  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַֽעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה מִן בְּנֵ֥י מְרָרִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: ru
  text: 'А из левитов: Шемая, сын Хашшува, сына Азрикама, сына Хашавьи, из сыновей Мерари.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из потомков Мерари». Древнееврейское выражение «сыновья» может обозначать более широкий род, а не только непосредственных сыновей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: А из
  rationale: Союз וְ продолжает предшествующий перечень, а מִן обозначает принадлежность к группе; «А из» естественно передаёт присоединительный характер записи.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Обычное современное русское обозначение представителей колена Левия; определённость выражена контекстом после предлога.
- source_word: שְׁמַעְיָה
  choice: Шемая
  rationale: Имя передано транслитерацией с древнееврейского; конечный теофорный элемент -יָה отражён привычной русской формой «-я».
- source_word: בֶן
  choice: сын / сына
  rationale: В генеалогической цепи слово естественнее всего обозначает сыновство; падежные формы согласованы с русским синтаксисом без устранения возможной широты родословного употребления.
- source_word: חַשּׁוּב
  choice: Хашшув
  rationale: Транслитерация учитывает удвоение согласного שׁ, отмеченное дагешем, и конечный согласный ב как «в» согласно принятой русской библейской передаче.
- source_word: עַזְרִיקָם
  choice: Азрикам
  rationale: Прямая транслитерация древнееврейского личного имени в естественной русской форме.
- source_word: חֲשַׁבְיָה
  choice: Хашавья
  rationale: Транслитерация сохраняет звучание основы и конечный элемент -יָה; форма соответствует современному русскому написанию с разделительным мягким знаком.
- source_word: מִן בְּנֵי מְרָרִי
  choice: из сыновей Мерари
  rationale: Формально прозрачная передача выражения родовой принадлежности; «сыновья» здесь может означать более широкий круг потомков, что отмечено в сноске.
