  text: זְכַרְיָה֙ בֶּ֣ן מְשֶֽׁלֶמְיָ֔ה שֹׁעֵ֥ר פֶּ֖תַח לְ/אֹ֥הֶל מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/021.yaml
  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: ru
  text: Захария, сын Мешелемии, был привратником у входа в шатёр встречи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стражем у дверного проёма шатра встречи».'
    reason: 'Лексическая альтернатива: שֹׁעֵר может означать охранника двери или входа, а פֶּתַח — вход, дверной проём или отверстие.'
lexical_decisions:
- source_word: זְכַרְיָה
  choice: Захария
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בֶּן
  choice: сын
  rationale: Ближайший генеалогический контекст указывает на прямое сыновство, а не на более широкое значение «потомок».
- source_word: מְשֶׁלֶמְיָה
  choice: Мешелемия
  rationale: Личное имя транслитерировано с учётом принятой русской библейской традиции.
- source_word: שֹׁעֵר
  choice: привратник
  rationale: Слово обозначает человека, охраняющего вход; «привратник» естественно и точно передаёт эту служебную роль.
- source_word: פֶּתַח
  choice: вход
  rationale: Существительное обозначает вход, проём или дверной проход; здесь «вход» наиболее естественно сочетается с ролью привратника.
- source_word: לְאֹהֶל
  choice: в шатёр
  rationale: 'Предлог ל при פתח выражает направительное отношение: «вход в шатёр».'
- source_word: מוֹעֵד
  choice: встречи
  rationale: В устойчивом выражении אֹהֶל מוֹעֵד слово указывает на назначенную встречу; этот перевод сохраняет смысл места встречи Бога с людьми.
- source_word: אֹהֶל מוֹעֵד
  choice: шатёр встречи
  rationale: Передаёт составное еврейское обозначение святилища непосредственно и понятно, не заменяя его более интерпретирующим термином «скиния».
