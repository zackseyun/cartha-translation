  yaml_path: translation/ot/1_chronicles/009/025.yaml
  text: And their brothers in their villages were to come in every seven days[a], from time to time[b], with these.
translation:
  language: ru
  text: А их братья из своих селений должны были время от времени приходить к ним[b] каждые семь дней[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приходить на семь дней»; еврейское выражение, вероятно, указывает на семидневную очередность служения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с этими», то есть с уже находившимися там служителями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: А их братья
  rationale: «Братья» прямо передаёт אֲחֵיהֶם; в данном контексте слово может обозначать также соплеменников или других левитов, но уточнять это в основном тексте не требуется.
- source_word: בְּחַצְרֵיהֶם
  choice: жившие в своих селениях
  rationale: חָצֵר здесь обозначает селение или поселение, а не храмовый двор; причастная конструкция делает локативное выражение естественным по-русски.
- source_word: לָבוֹא
  choice: должны были ... приходить
  rationale: Инфинитив с ל в административном контексте передаёт установленную обязанность или порядок служения, а не просто единичный приход.
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: каждые семь дней
  rationale: В контексте очередности выражение, вероятнее всего, указывает на семидневный цикл; возможное значение продолжительности «на семь дней» сохранено в сноске.
- source_word: מֵעֵת אֶל עֵת
  choice: время от времени
  rationale: Устойчиво и естественно передаёт повторяемость наступавших сроков, не вводя отсутствующего в тексте точного расписания.
- source_word: עִם אֵלֶּה
  choice: быть вместе с ними
  rationale: Буквально выражение означает «с этими» и отсылает к ранее названным служителям; личное местоимение естественнее в русском повествовании.
