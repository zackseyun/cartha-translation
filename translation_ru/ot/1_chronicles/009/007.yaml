source:
  edition: WLC
  text: וּ/מִן בְּנֵ֖י בִּנְיָמִ֑ן סַלּוּא֙ בֶּן מְשֻׁלָּ֔ם בֶּן הוֹדַוְיָ֖ה בֶּן הַ/סְּנֻאָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: ru
  text: 'А из сыновей Вениамина: Саллу, сын Мешуллама, сына Годавии, сына Гассенуи.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «сын» в библейских родословиях может обозначать не только непосредственного сына, но и потомка. В других родословных имя Годавии встречается в иной форме.
    reason: cultural_note; textual_variant
lexical_decisions:
- source_word: וּ/מִן
  choice: А из
  rationale: Союз וּ связывает стих с предшествующим перечнем, а מִן вводит представителя данной группы; сочетание «А из» естественно сохраняет обе функции.
- source_word: בְּנֵי בִּנְיָמִן
  choice: сыновей Вениамина
  rationale: Сохранена буквальная генеалогическая формула, которая в данном перечне означает представителей или потомков колена Вениамина.
- source_word: סַלּוּא
  choice: Саллу
  rationale: Передача еврейского личного имени в форме, соответствующей его масоретскому звучанию и русской библейской традиции.
- source_word: בֶּן
  choice: сын / сына
  rationale: Повторяющаяся формула בֶּן передана явно на каждой ступени родословной; в библейских родословиях она может указывать как на непосредственного сына, так и на более отдалённого потомка.
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Транслитерация личного имени по масоретскому тексту.
- source_word: הוֹדַוְיָה
  choice: Годавия
  rationale: Перевод следует форме имени в WLC; начальная еврейская ה передана традиционным для русской библейской ономастики «Г».
- source_word: הַ/סְּנֻאָה
  choice: Гассенуя
  rationale: Форма понята как имя собственное; удвоенное ס после артикля отражено двойным «с», а начальная ה — традиционным «Г».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичной формы родословного перечня. Повтор слова «сын» сохранён ради структуры еврейского текста; имена переданы в русской библейской транслитерационной традиции.
