base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/018.yaml
  text: Until then they were at the king’s gate on the east[b][a]; they were the gatekeepers for the camps of the sons of Levi.
translation:
  language: ru
  text: До сих пор они находятся у царских ворот на восточной стороне[a]; они — привратники станов сынов Левия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «До того времени» или «До этого места». Еврейский оборот обозначает продолжение вплоть до времени повествователя или до указанного момента.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отрядов сынов Левия». Еврейское слово может означать как станы, так и организованные подразделения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד הֵנָּה
  choice: До того времени
  rationale: Оборот обозначает продолжение до указанного момента; в данном ретроспективном контексте это естественнее буквального «доныне», при сохранении временного смысла.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: у царских ворот
  rationale: Предлог בְּ имеет локативное значение, а «у ворот» естественно передаёт место несения службы.
- source_word: מִזְרָחָה
  choice: с восточной стороны
  rationale: Направительная форма здесь указывает на восточное расположение ворот; выбранная формулировка ясна на современном русском.
- source_word: הֵמָּה
  choice: они были
  rationale: Самостоятельное местоимение подчёркивает отождествление упомянутых лиц с привратниками; в русском требуется связка.
- source_word: הַשֹּׁעֲרִים
  choice: привратниками
  rationale: Слово обозначает людей, которым поручена охрана ворот; «привратники» — точный и традиционно понятный термин.
- source_word: לְמַחֲנוֹת
  choice: станов
  rationale: Основное значение מַחֲנֶה — «стан, лагерь»; оно сохранено в тексте, а возможный организационный смысл отмечен в сноске.
- source_word: בְּנֵי לֵוִי
  choice: сынов Левия
  rationale: Сохраняет формальную генеалогическую формулу еврейского текста, не заменяя её толкующим «левитов».
