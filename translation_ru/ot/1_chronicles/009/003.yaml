base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: ru
  text: В Иерусалиме жили некоторые из потомков[a] Иуды, некоторые из потомков Вениамина и некоторые из потомков Ефрема и Манассии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из сыновей Иуды… из сыновей Вениамина… из сыновей Ефрема и Манассии».'
    reason: Сноска сохраняет буквальную племенно-генеалогическую формулу еврейского текста, переданную в основном тексте естественным русским словом «потомки».
lexical_decisions:
- source_word: וּבִירוּשָׁלִַם
  choice: В Иерусалиме
  rationale: Начальный союз связывает стих с контекстом, но в современном русском отдельное «и» перед вынесенным обстоятельством звучало бы тяжеловесно; смысловая связь сохраняется последовательностью повествования.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: Глагол ישׁב здесь обозначает постоянное проживание; «жили» естественно и точно передаёт этот смысл без добавления отсутствующего в еврейском тексте наречия «там».
- source_word: מִן
  choice: некоторые из
  rationale: Повторяющийся предлог указывает на представителей, происходивших из названных племенных групп, а не на все племена целиком. Слово «некоторые» делает подразумеваемое частичное значение ясным по-русски.
- source_word: בְּנֵי
  choice: потомков
  rationale: В племенном и родословном контексте «потомки» естественнее современного буквального «сыновья» и сохраняет генеалогический смысл формулы.
- source_word: וּמְנַשֶּׁה
  choice: и Манассии
  rationale: При имени Манассии еврейский текст не повторяет ни מִן, ни בְּנֵי; по-русски значение «из потомков» естественно распространяется на оба имени в сочетании «Ефрема и Манассии».
