lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: и Овадия
  rationale: Союз וְ продолжает начатое ранее перечисление; личное имя передано транслитерацией, близкой к еврейской форме.
- source_word: בֶּן
  choice: сын / сына
  rationale: В родословной формуле слово означает «сын»; падежные формы «сын» и «сына» обеспечивают естественную русскую цепочку происхождения, не устраняя возможной для древних родословий обобщённости связи.
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Личное имя передано принятой русской библейской транслитерацией; в тексте употреблена требуемая падежная форма «Шемаии».
- source_word: גָּלָל
  choice: Галал
  rationale: Личное имя транслитерировано; в тексте употреблена родительная форма «Галала».
- source_word: יְדוּתוּן
  choice: Идифун
  rationale: Выбрана узнаваемая русская библейская форма имени; в тексте употреблена родительная форма «Идифуна».
- source_word: וּ/בֶרֶכְיָה
  choice: и Берехия
  rationale: Союз продолжает перечень вторым именем; имя передано близко к еврейской форме.
- source_word: אָסָא
  choice: Аса
  rationale: Личное имя передано традиционной русской формой; контекст не отождествляет этого человека с одноимённым царём.
- source_word: אֶלְקָנָה
  choice: Елкана
  rationale: Личное имя передано традиционной русской библейской формой; в тексте употреблена родительная форма «Елканы».
- source_word: הַ/יּוֹשֵׁב
  choice: живший
  rationale: Определённое причастие характеризует Берехию как проживавшего в указанном месте; русское причастие сохраняет связь именно с ближайшим названным лицом.
- source_word: בְּ/חַצְרֵי
  choice: в селениях
  rationale: חָצֵר здесь обозначает небольшие сельские поселения, а не буквальные дворы; «селения» естественно передаёт географический смысл.
- source_word: נְטוֹפָתִי
  choice: нетофатян
  rationale: Этникон обозначает жителей, связанных с Нетофой. Форма «нетофатян» сохраняет указание на группу людей; альтернативная передача через название места отмечена в сноске.
