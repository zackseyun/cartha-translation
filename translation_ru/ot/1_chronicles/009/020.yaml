  text: וּ/פִֽינְחָ֣ס בֶּן אֶלְעָזָ֗ר נָגִ֨יד הָיָ֧ה עֲלֵי/הֶ֛ם לְ/פָנִ֖ים יְהוָ֥ה עִמּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/020.yaml
  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: ru
  text: А Финеес, сын Елеазара, прежде был их начальником[a]; Яхве был с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «А Финеес, сын Елеазара, был их начальником в прежние времена». Порядок слов в еврейском тексте позволяет теснее связывать слово «прежде» либо со сказуемым «был начальником», либо со всем предложением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: А Финеес
  rationale: Союз ו передаёт связь с предшествующим повествованием; «А» естественно вводит уточнение о Финеесе. Имя дано в принятой русской библейской форме.
- source_word: בֶּן אֶלְעָזָר
  choice: сын Елеазара
  rationale: Прямо и естественно передаёт еврейскую генеалогическую конструкцию.
- source_word: נָגִיד
  choice: начальником
  rationale: Обозначает человека, поставленного во главе других; «начальник» подходит к контексту служения и не привносит царских оттенков.
- source_word: הָיָה עֲלֵיהֶם
  choice: был их начальником
  rationale: Идиоматический русский оборот естественно выражает положение власти или надзора над упомянутыми ранее служителями.
- source_word: לְפָנִים
  choice: прежде
  rationale: Передаёт отнесённость к более раннему времени и сохраняет краткость оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: עִמּוֹ
  choice: был с ним
  rationale: Сохраняет ёмкое выражение Божьего присутствия и благоволения без пояснительного расширения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смысл выражения יְהוָה עִמּוֹ
  choice: Яхве был с ним
  alternative: Яхве поддерживал его
  rationale: Буквальная формулировка сохраняет возможную полноту смысла — присутствие, поддержку и благоволение Бога — не сводя её лишь к одному аспекту.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Синтаксис краткий и dignified; временная неоднозначность לְפָנִים сохранена в сноске.
