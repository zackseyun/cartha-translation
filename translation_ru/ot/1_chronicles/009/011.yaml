  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: ru
  text: и Азария, сын Хелкии, сына Мешуллама, сына Садока, сына Мераиофа, сына Ахитува, — начальник[a] Божьего дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «руководитель» либо «правитель».'
    reason: Лексическое значение נְגִיד включает несколько близких обозначений лица, поставленного во главе.
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: и Азария
  rationale: Союз ו передаёт продолжение перечня из предыдущего стиха; имя дано в принятой русской библейской форме.
- source_word: בֶן
  choice: сын
  rationale: Повторяющееся генеалогическое обозначение передано единообразно. Хотя родословные могут пропускать поколения, форма исходного текста буквально означает «сын».
- source_word: חִלְקִיָּה
  choice: Хелкия
  rationale: Принятая русская библейская форма личного имени.
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Передача личного имени, близкая к еврейской форме и сложившемуся русскому употреблению.
- source_word: צָדוֹק
  choice: Садок
  rationale: Принятая русская библейская форма личного имени.
- source_word: מְרָיוֹת
  choice: Мераиоф
  rationale: Принятая русская библейская форма личного имени; падежная форма «Мераиофа» обусловлена синтаксисом.
- source_word: אֲחִיטוּב
  choice: Ахитув
  rationale: Принятая русская библейская форма личного имени; падежная форма «Ахитува» обусловлена синтаксисом.
- source_word: נְגִיד
  choice: начальник
  rationale: Слово обозначает поставленного над другими руководителя или правителя. «Начальник» естественно передаёт служебное руководство в храмовом контексте, не привнося значения царского титула.
- source_word: בֵּית הָאֱלֹהִים
  choice: Божий дом
  rationale: Сохраняется образное и культовое выражение исходного текста; в данном контексте речь идёт о храме Бога Израиля.
theological_decisions:
- issue: Значение אֱלֹהִים в обозначении святилища
  choice: Бог
  alternative: боги
  rationale: В контексте святилища Израиля слово однозначно обозначает Бога Израиля; форма «Божий дом» точно передаёт это значение.
- issue: Характер должности, обозначенной נְגִיד
  choice: начальник
  alternative: правитель
  rationale: Исходное слово допускает широкий диапазон значений руководства. В храмовом контексте «начальник» сохраняет административный смысл и не превращает должность в политическое правление.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Тире отделяет длинную родословную цепочку от обозначения должности и облегчает чтение. Выражение «Божий дом» сохраняет метафору оригинала, оставаясь понятным как обозначение храма.
