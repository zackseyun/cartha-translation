    issue: «Лучшую муку»
    rationale: Сֹלֶת характеризует тонкость/просеянность муки, а не сравнительное превосходство над иной мукой.
  - severity: medium
    issue: «Благовония»
    rationale: Бְשָׂמִים обозначает ароматические вещества или пряности; «благовония» может восприниматься как повтор уже названного ладана.
  - severity: low
