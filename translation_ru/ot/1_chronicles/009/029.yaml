  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: ru
  text: Некоторые из них были назначены отвечать за утварь, за все священные сосуды[a], а также за муку тонкого помола, вино, масло, ладан и ароматические вещества.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все предметы святилища».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Некоторые из них
  rationale: Передаёт партитивное значение מן с местоименным суффиксом естественным современным русским выражением.
- source_word: מְמֻנִּים עַל
  choice: были назначены отвечать за
  rationale: Страдательное причастие указывает на порученную обязанность, а עַל — на сферу ответственности; сочетание ясно и естественно по-русски.
- source_word: הַכֵּלִים
  choice: утварь
  rationale: Широкое обозначение предметов и принадлежностей; перевод отличает их от следующих далее священных сосудов и подходит к храмовому контексту.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: все священные сосуды
  rationale: Сохраняет конструкцию со значением святости, не сужая её до локативного значения «сосуды святилища».
- source_word: הַסֹּלֶת
  choice: лучшую муку
  rationale: Сֹלֶת означает муку высокого качества, предназначавшуюся, в частности, для приношений; «лучшая мука» понятнее современному читателю, чем специальное «тонкая мука».
- source_word: הַיַּיִן
  choice: вино
  rationale: Прямое соответствие исходному слову без добавления невыраженной информации о назначении.
- source_word: הַשֶּׁמֶן
  choice: масло
  rationale: Исходный текст не уточняет здесь, что масло оливковое, поэтому родовое обозначение сохранено.
- source_word: הַלְּבוֹנָה
  choice: ладан
  rationale: Точное русское наименование ароматической смолы, обозначенной словом לְבוֹנָה.
- source_word: הַבְּשָׂמִים
  choice: благовония
  rationale: Передаёт ароматические вещества сакрального назначения естественнее, чем бытовое «пряности» или косметическое «духи».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повтор עַל частично сохранён через «за», а перед последующим перечнем передан оборотом «а также», чтобы избежать тяжеловесности без утраты структуры обязанностей.
