  text: וְ/יִבְנְיָה֙ בֶּן יְרֹחָ֔ם וְ/אֵלָ֥ה בֶן עֻזִּ֖י בֶּן מִכְרִ֑י וּ/מְשֻׁלָּם֙ בֶּן שְׁפַטְיָ֔ה בֶּן רְעוּאֵ֖ל בֶּן יִבְנִיָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/008.yaml
  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: ru
  text: и Ивнея, сын Иерохама[a], и Эла, сын Уззи, сына Михри, и Мешуллам, сын Шефатии, сына Реуэла, сына Ивнии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейские личные имена переданы транслитерацией; в других русских переводах возможны иные написания этих имён.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: и
  rationale: Повторяющийся союз связывает имена с предшествующим перечнем и сохраняет последовательность еврейского текста.
- source_word: יִבְנְיָה
  choice: Ивнея
  rationale: Личное имя передано транслитерацией с учётом принятого в русском библейском стиле оформления.
- source_word: בֶּן
  choice: сын
  rationale: В данной родословной формуле слово естественно обозначает сыновство; более широкое «потомок» контекстом не требуется.
- source_word: יְרֹחָם
  choice: Иерохама
  rationale: Личное имя транслитерировано и поставлено в родительный падеж после слова «сын».
- source_word: אֵלָה
  choice: Эла
  rationale: Личное имя передано близкой к масоретскому произношению русской транслитерацией.
- source_word: עֻזִּי
  choice: Уззия
  rationale: Транслитерация сохраняет удвоенный согласный и оформлена в родительном падеже.
- source_word: מִכְרִי
  choice: Михри
  rationale: Имя транслитерировано; буква כ без дагеша передана как «х».
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Имя передано транслитерацией с сохранением удвоенного согласного.
- source_word: שְׁפַטְיָה
  choice: Шефатии
  rationale: Имя транслитерировано в форме, естественной для русской библейской традиции, и поставлено в родительный падеж.
- source_word: רְעוּאֵל
  choice: Реуэла
  rationale: Передача следует масоретской форме имени, не заменяя её традиционным вариантом из иных линий передачи.
- source_word: יִבְנִיָּה
  choice: Ивнии
  rationale: Имя транслитерировано отдельно от сходного יִבְנְיָה и грамматически оформлено в родительном падеже.
