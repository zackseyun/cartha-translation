  text: וּ/סְבִיב֥וֹת בֵּית הָ/אֱלֹהִ֖ים יָלִ֑ינוּ כִּֽי עֲלֵי/הֶ֣ם מִשְׁמֶ֔רֶת וְ/הֵ֥ם עַל הַ/מַּפְתֵּ֖חַ וְ/לַ/בֹּ֥קֶר לַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: ru
  text: Они ночевали вокруг дома Божьего, потому что на них была возложена обязанность нести стражу; они ведали ключом[a] и каждое утро открывали дом Божий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они были над ключом»; это может означать как хранение ключа, так и ответственность за открывание дома Божьего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּסְבִיבוֹת בֵּית הָאֱלֹהִים
  choice: вокруг дома Божьего
  rationale: Сохраняет пространственное значение סְבִיבוֹת и буквальное библейское выражение «дом Божий», не подменяя его более конкретным словом «храм».
- source_word: יָלִינוּ
  choice: ночевали
  rationale: Естественно и кратко передаёт пребывание на месте в течение ночи; в контексте не обязательно означает сон.
- source_word: עֲלֵיהֶם מִשְׁמֶרֶת
  choice: на них лежала стража
  rationale: Сохраняет образную конструкцию с עַל («на них») и многозначность מִשְׁמֶרֶת как стражи, караула или обязанности охранять.
- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: они отвечали за ключ
  rationale: Близко передаёт идиому «они были над ключом» естественным русским языком и не устраняет возможность как хранения ключа, так и ответственности за открывание.
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: чтобы открывать каждое утро
  rationale: Повтор בֹּקֶר выражает регулярность. Инфинитив «открывать» проясняет подразумеваемую функцию ключа в русской фразе, а не заменяет само слово «ключ».
