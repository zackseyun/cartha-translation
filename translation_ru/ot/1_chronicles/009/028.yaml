  text: Some of them were in charge of the vessels of service[a], for they brought them in by count and took them out by count.
translation:
  language: ru
  text: Некоторые из них отвечали за предметы, используемые при служении[a], ибо вносили их по счёту и выносили по счёту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за сосуды, используемые при служении», «за утварь, употреблявшуюся при служении». Еврейское слово может обозначать сосуды, утварь, орудия или другие предметы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם
  choice: Некоторые из них
  rationale: 'Предлог מִן с местоименным суффиксом имеет партитивное значение: речь идёт о части ранее упомянутой группы.'
- source_word: עַל
  choice: отвечали за
  rationale: В сочетании с порученной обязанностью עַל указывает на надзор и ответственность; современное русское «отвечали за» естественно передаёт этот смысл.
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: принадлежности для служения
  rationale: כְּלִי — широкое обозначение сосудов, утвари, орудий или предметов; в храмовом контексте это предметы, используемые при служении. «Принадлежности» сохраняет широту термина, не ограничивая его только сосудами.
- source_word: כִּי
  choice: ':'
  rationale: כִּי вводит пояснение того, как осуществлялась ответственность. В русском языке двоеточие естественно выражает эту пояснительно-причинную связь без утяжеления фразы союзом.
- source_word: בְמִסְפָּר
  choice: по счёту
  rationale: Повторённое выражение подчёркивает точный количественный учёт предметов при выдаче и возврате.
- source_word: יְבִיאוּם
  choice: вносили их
  rationale: Hiphil от בוא с объектным суффиксом означает «вносить/приносить внутрь»; имперфект в данном повествовательном описании передаёт обычную, повторяющуюся практику.
- source_word: יוֹצִיאוּם
  choice: выносили
  rationale: Hiphil от יצא означает «выносить/выводить наружу»; «выносили» симметрично сочетается с «вносили» и сохраняет пространственную направленность глагола.
