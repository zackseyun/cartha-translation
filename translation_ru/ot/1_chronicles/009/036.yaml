  text: וּ/בְנ֥/וֹ הַ/בְּכ֖וֹר עַבְדּ֑וֹן וְ/צ֣וּר וְ/קִ֔ישׁ וּ/בַ֥עַל וְ/נֵ֖ר וְ/נָדָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/036.yaml
  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: ru
  text: Его первенцем был Авдон[a], а затем Цур, Кис, Ваал, Нер и Надав.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «И его сын, первенец: Авдон, и Цур, и Кис, и Ваал, и Нер, и Надав». Повторяющийся союз перед именами передан естественным русским перечислением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ הַבְּכוֹר
  choice: Его первенцем был
  rationale: Именная конструкция продолжает родословный перечень. По-русски естественно передать её предложением «Его первенцем был…»; союз ו здесь не требует отдельного «и» в начале стиха.
- source_word: עַבְדּוֹן
  choice: Авдон
  rationale: Традиционная русская передача личного имени, соответствующая еврейской форме.
- source_word: וְצוּר
  choice: а затем Цур
  rationale: Повторяющийся союз ו вводит продолжение перечня. «А затем» естественно отделяет остальных сыновей от первенца, не утверждая иной последовательности, кроме порядка перечисления.
- source_word: וְקִישׁ
  choice: Кис
  rationale: Личное имя передано принятой русской библейской формой; союз выражен структурой списка.
- source_word: וּבַעַל
  choice: Ваал
  rationale: В данном родословном контексте בַּעַל является личным именем; оно передано прямо, без эвфемистической замены.
- source_word: וְנֵר
  choice: Нер
  rationale: Личное имя транслитерировано; союз включён в оформление русского перечня.
- source_word: וְנָדָב
  choice: Надав
  rationale: Личное имя передано близко к еврейскому звучанию; последний союз естественно выражен русским «и» перед завершающим элементом списка.
theological_decisions:
- issue: Передача имени בַּעַל в израильской родословной
  choice: Ваал как личное имя
  alternative: Эвфемистическая замена или согласование с иными вариантами имён, содержащих элемент «ваал»
  rationale: Еврейский текст прямо называет человека בַּעַל. Перевод сохраняет форму источника и не устраняет её из-за связи этого слова с именем или титулом хананейского божества.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным родословным регистром. Имена переданы в привычных русских библейских формах там, где они устойчивы; синтаксис сделан естественным без устранения различия между первенцем и остальными перечисленными сыновьями.
