  text: 'И из сыновей Зераха: Иеуил и их братья[a] — шестьсот девяносто.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Иеуил и его братья — шестьсот девяносто», если Иеуил назван представителем рода. В еврейском тексте при слове «братья» стоит суффикс множественного числа: буквально «их братья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: И из
  rationale: Союз ו связывает стих с предшествующим перечнем, а מִן обозначает принадлежность к группе; «И из» сохраняет добавочный характер записи.
- source_word: בְּנֵי זֶרַח
  choice: сыновей Зераха
  rationale: В родословном списке בְּנֵי может обозначать как непосредственных сыновей, так и потомков или членов рода. Буквальное «сыновей» сохраняет эту принятую библейскую формулу.
- source_word: יְעוּאֵל
  choice: Иеуэл
  rationale: Имя передано транслитерацией, близкой к еврейской форме и привычной русской библейской традиции.
- source_word: וַ/אֲחֵי/הֶם
  choice: и их братья
  rationale: Местоименный суффикс в еврейском тексте имеет форму третьего лица множественного числа, поэтому число сохранено, несмотря на неясность его соотнесения с названным перед ним Иеуэлом.
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: шестьсот девяносто человек
  rationale: Число передано словами; «человек» естественно поясняет подразумеваемое исчисление людей, не меняя содержания.
