  text: And some of the sons of the priests were compounders of the ointment of spices[a].
translation:
  language: ru
  text: А некоторые из сыновей священников готовили благовонный состав[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «готовили состав для ароматических веществ». Связь, выраженная предлогом לְ־, может пониматься по-разному.'
    reason: Предлог לְ־ не означает «из»; сноска сохраняет возможную буквальную передачу и отмечает синтаксико-семантическую неоднозначность.
lexical_decisions:
- source_word: וּמִן
  choice: А некоторые из
  rationale: 'Сочетание союза и предлога имеет партитивный смысл: речь идёт о некоторых представителях названной группы. Такой перевод естественен по-русски и сохраняет связь с перечнем.'
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: сыновей священников
  rationale: Сохранён родственный оборот еврейского текста, уместный для генеалогического стиля Паралипоменон; в контексте он может обозначать членов священнических родов.
- source_word: רֹקְחֵי
  choice: готовили
  rationale: Причастие обозначает тех, кто искусно составляет или приготовляет сложную ароматическую смесь. Глагольная форма даёт естественное русское предложение, не вводя специального названия профессии.
- source_word: הַמִּרְקַחַת
  choice: смесь
  rationale: Существительное обозначает составной препарат — смесь, мазь или благовонный состав. Нейтральное «смесь» сохраняет широту значения и не уточняет без достаточных оснований её консистенцию.
- source_word: לַבְּשָׂמִים
  choice: из благовоний
  rationale: בְּשָׂמִים — ароматические вещества, благовония. В данном сочетании предлог ל допускает разные отношения между смесью и благовониями; основной текст передаёт наиболее естественное понимание, а альтернатива отмечена в сноске.
