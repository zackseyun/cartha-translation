base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/005.yaml
  text: 'And from the Shilonites: Asaiah the firstborn and his sons[a].'
translation:
  language: ru
  text: 'И из шилонитян: Асаия, первенец, и его сыновья[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «шелонитян» — согласно другому традиционному отождествлению этого родового имени.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: И из
  rationale: Союз ו связывает этот пункт с предшествующим перечнем, а предлог מִן обозначает принадлежность к названной группе.
- source_word: הַשִּׁילוֹנִי
  choice: шилонитян
  rationale: Хотя форма морфологически единственного числа, в данном родословном перечне она имеет собирательное значение. Передача «шилонитян» естественна по-русски и непосредственно отражает огласовку масоретского текста; возможное отождествление с шелонитянами отмечено в сноске.
- source_word: עֲשָׂיָה
  choice: Асаия
  rationale: Личное имя передано традиционной русской библейской формой, соответствующей еврейскому имени.
- source_word: הַבְּכוֹר
  choice: первенец
  rationale: Слово обозначает перворождённого сына, а не просто старшего по возрасту.
- source_word: וּבָנָיו
  choice: и его сыновья
  rationale: בנים здесь означает именно сыновей; притяжательный суффикс передан местоимением «его», а союз сохраняет структуру перечня.
