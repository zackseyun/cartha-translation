  text: וּ/בַקְבַּקַּ֥ר חֶ֖רֶשׁ וְ/גָלָ֑ל וּ/מַתַּנְיָה֙ בֶּן מִיכָ֔א בֶּן זִכְרִ֖י בֶּן אָסָֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/015.yaml
  text: and Bakbakkar[a], Heresh, and Galal, and Mattaniah son of Mica, son of Zichri[b], son of Asaph.
translation:
  language: ru
  text: и Бакбаккар, Хереш и Галал, и Маттания, сын[a] Михи[b], сына Зихри, сына Асафа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «сын», может также обозначать более отдалённого потомка; здесь сохранено его буквальное значение в родословной цепочке.
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь стоит форма имени Миха, отличная от более привычного имени Михей.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַקְבַּקַּר
  choice: и Бакбаккар
  rationale: Начальный союз продолжает перечень из предыдущего контекста; личное имя передано транслитерацией, сохраняющей удвоенный согласный.
- source_word: חֶרֶשׁ
  choice: Хереш
  rationale: Личное имя передано близко к еврейской согласной форме.
- source_word: וְ/גָלָל
  choice: и Галал
  rationale: Союз сохранён как часть последовательного перечисления; имя транслитерировано.
- source_word: וּ/מַתַּנְיָה
  choice: и Маттания
  rationale: Союз сохранён, а имя передано современной русской транслитерацией еврейской формы.
- source_word: בֶּן
  choice: сын / сына
  rationale: В родословной цепочке слово естественно означает «сын»; падежные формы согласованы с русским синтаксисом.
- source_word: מִיכָא
  choice: 'Миха (в тексте: Михи)'
  rationale: Передана именно засвидетельствованная здесь форма имени מיכא, без отождествления с более привычной формой Михей.
- source_word: זִכְרִי
  choice: Зихри
  rationale: Имя транслитерировано с сохранением формы источника и оставлено несклоняемым.
- source_word: אָסָף
  choice: Асаф
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions: []
