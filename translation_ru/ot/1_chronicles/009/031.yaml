base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: ru
  text: А Маттифия, один из левитов, первенец корахитянина Шаллума, был поставлен отвечать за[a] приготовление лепёшек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верно отвечал за приготовление лепёшек». Еврейское выражение может указывать как на доверенную Маттифии обязанность, так и на верность, с которой он её исполнял. Лепёшки — особый вид выпечки, возможно приготовлявшийся на сковороде.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: А Маттифия
  rationale: Союз ו продолжает перечень служителей; русское «А» естественно вводит следующего названного человека. Имя передано в принятой библейской форме.
- source_word: מִן הַלְוִיִּם
  choice: один из левитов
  rationale: Предлог מן здесь обозначает принадлежность к группе; такая передача ясна и естественна по-русски.
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: первенец Шаллума
  rationale: בכור буквально означает «первенец»; сохранено семейное обозначение без замены на более толковательное «старший сын».
- source_word: הַקָּרְחִי
  choice: корахитянина
  rationale: Семейно-родовое обозначение передано традиционным русским наименованием потомка Кораха и грамматически отнесено к Шаллуму.
- source_word: בֶּאֱמוּנָה עַל
  choice: был поставлен отвечать за
  rationale: В административном контексте сочетание выражает доверенную и ответственную обязанность. Русская конструкция естественно передаёт поручение, не исключая оттенка надёжности.
- source_word: מַעֲשֵׂה הַחֲבִתִּים
  choice: приготовление лепёшек
  rationale: מעשה в данном кулинарном контексте обозначает изготовление или приготовление, а חֲבִתִּים — разновидность лепёшек, вероятно приготовлявшихся на сковороде или жаровне.
theological_decisions:
- issue: Значение בֶּאֱמוּנָה
  choice: был поставлен отвечать за
  alternative: верно исполнял обязанность
  rationale: Грамматика допускает как доверенное поручение, так и указание на верность исполнения. Основной текст следует административному смыслу контекста, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но родовые обозначения и неоднозначность выражения בֶּאֱמוּנָה сохранены.
