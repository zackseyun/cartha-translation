  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: ru
  text: Сыном Иегонафана был Мериб-Баал[a], а Мериб-Баал стал отцом Михи.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельной родословной, в 1 Царств 14:49, сын Саула назван Ионафаном, тогда как здесь в еврейском тексте Летописей стоит форма «Иегонафан».
    reason: cross_reference
  - marker: b
    text: 'В этом стихе еврейский текст приводит имя отца в двух немного различающихся формах: «Мериб-Баал» и сокращённой «Мери-Баал». В переводе для ясности в обоих случаях употреблена одна форма.'
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בֶן
  choice: Сыном … был
  rationale: בֶן означает «сын»; начальный ו связывает стих с предшествующей родословной. В русском эта связь естественно передаётся продолжением генеалогической формулы без обязательного отдельного «и».
- source_word: יְהוֹנָתָן
  choice: Иегонафан
  rationale: Сохранена особая форма имени, стоящая в тексте Летописей, а не проведена унификация с более привычным «Ионафан» из параллельной родословной.
- source_word: מְרִיב בָּעַל
  choice: Мерив-Баал
  rationale: Двухчастное личное имя передано транслитерацией с дефисом; компонент בָּעַל не переводится, поскольку является частью имени.
- source_word: וּ/מְרִי בַעַל
  choice: а Мерив-Баал
  rationale: Второе написание имени в еврейском тексте немного короче; в основном тексте оно унифицировано с первым для ясности, а различие отмечено в сноске.
- source_word: הוֹלִיד
  choice: родил
  rationale: В генеалогическом употреблении породы hифиль глагол ילד обозначает отцовство, то есть «стал отцом, произвёл на свет». Краткое «родил» соответствует традиционной и понятной русской генеалогической формуле.
- source_word: אֶת מִיכָה
  choice: Миху
  rationale: אֶת — непереводимый показатель прямого дополнения; имя מִיכָה передано принятой русской библейской формой «Миха» в винительном падеже.
