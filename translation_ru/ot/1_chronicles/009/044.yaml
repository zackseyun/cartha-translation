    text: 'Буквально: «И у Ацела — шесть сыновей». Перевод передаёт обычную еврейскую родословную формулу естественным русским выражением.'
    reason: lexical_alternative
  - marker: b
    text: В масоретском еврейском тексте сказано о шести сыновьях, однако далее названы только пятеро.
    reason: textual_note
