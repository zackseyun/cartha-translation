  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: ru
  text: 'У Ацела было шесть сыновей[a]. Вот их имена: Азрикам, первенец Ацела, Измаил, Шеария, Овадия и Ханан[b]. Это сыновья Ацела.'
