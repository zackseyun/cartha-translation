- source_word: וּלְאָצֵל
  choice: У Ацела было
  rationale: Предлог לְ в родословной формуле выражает принадлежность или родство. Русская конструкция «у Ацела было» естественно передаёт этот смысл.
- source_word: שִׁשָּׁה בָנִים
  choice: шесть сыновей
  rationale: בָנִים здесь обозначает именно сыновей, а не детей вообще.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: Вот их имена
  rationale: Естественная русская родословная формула; местоимение во множественном числе относится к упомянутым сыновьям.
- source_word: עַזְרִיקָם
  choice: Азрикам
  rationale: Передача еврейского личного имени средствами принятой русской библейской транслитерации.
- source_word: בֹּכְרוֹ
  choice: его первенец
  rationale: Форма с местоименным суффиксом означает «его первенец» и указывает на первородство Азрикама среди сыновей Ацела.
- source_word: יִשְׁמָעֵאל
  choice: Измаил
  rationale: Традиционная русская форма библейского имени.
- source_word: שְׁעַרְיָה
  choice: Шеария
  rationale: Транслитерация личного имени, сохраняющая основные согласные и гласные еврейской формы.
- source_word: עֹבַדְיָה
  choice: Овадия
  rationale: Русская передача личного имени, близкая к еврейской форме.
- source_word: חָנָן
  choice: Ханан
  rationale: Прямая русская транслитерация еврейского личного имени.
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: Это сыновья Ацела
  rationale: Заключительная родословная формула передана кратко и ясно, с сохранением повторения имени.
