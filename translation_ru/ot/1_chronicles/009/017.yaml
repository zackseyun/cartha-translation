base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/017.yaml
  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: ru
  text: Привратниками были Шаллум, Аккув, Талмон, Ахиман и их братья[a]; главным был Шаллум.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «сородичи». Буквально: «братья»; в подобных перечнях это слово может означать как родных братьев, так и членов одного рода или служебной группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: привратниками
  rationale: Слово обозначает людей, которым поручена охрана ворот. «Привратники» — ясное и традиционно уместное обозначение этой храмовой должности в современном русском языке.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Личное имя передано транслитерацией, близкой к еврейской форме.
- source_word: עַקּוּב
  choice: Аккув
  rationale: Личное имя передано транслитерацией с учётом еврейского произношения.
- source_word: טַלְמֹן
  choice: Талмон
  rationale: Личное имя передано транслитерацией.
- source_word: אֲחִימָן
  choice: Ахиман
  rationale: Личное имя передано транслитерацией.
- source_word: אֲחִיהֶם
  choice: их братья
  rationale: Это прямое значение еврейского выражения; при этом в родовых и служебных перечнях «братья» может обозначать также сородичей или членов той же группы, что отмечено в сноске.
- source_word: הָרֹאשׁ
  choice: главным
  rationale: В данном контексте слово указывает на первенство или руководящее положение. «Главным» естественно согласуется с подразумеваемой группой привратников.
- source_word: וְ...וְ...וַ...וַ
  choice: перечисление с союзом «и» перед заключительным элементом
  rationale: Повторяющиеся еврейские союзы оформлены как естественный русский перечень без утраты их соединительной функции.
