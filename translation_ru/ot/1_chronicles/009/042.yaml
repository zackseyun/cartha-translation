  text: וְ/אָחָז֙ הוֹלִ֣יד אֶת יַעְרָ֔ה וְ/יַעְרָ֗ה הוֹלִ֛יד אֶת עָלֶ֥מֶת וְ/אֶת עַזְמָ֖וֶת וְ/אֶת זִמְרִ֑י וְ/זִמְרִ֖י הוֹלִ֥יד אֶת מוֹצָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: ru
  text: Ахаз стал отцом Яры[a], Яра стал отцом Алемета, Азмавета и Зимри, а Зимри стал отцом Моцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельной родословной (1 Пар. 8:36) здесь стоит имя «Иегоадда», а не «Яра». В рукописях Паралипоменона в данном стихе читается «Яра»; это чтение сохранено в основном тексте.
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В родословной породная форма глагола ילד обозначает рождение потомка от названного мужчины. «Стал отцом» естественно звучит по-русски и сохраняет мужскую генеалогическую связь.
- source_word: יַעְרָה
  choice: Яра
  rationale: Личное имя передано транслитерацией еврейской формы данного стиха без гармонизации с параллельной родословной.
- source_word: עָלֶמֶת
  choice: Алемет
  rationale: Личное имя транслитерировано с учётом еврейского звучания; конечная ת передана как «т».
- source_word: עַזְמָוֶת
  choice: Азмавет
  rationale: Личное имя передано прямой транслитерацией; ת передана как «т», без англоязычной формы на -th.
- source_word: זִמְרִי
  choice: Зимри
  rationale: Личное имя передано принятой русской транслитерацией.
- source_word: מוֹצָא
  choice: Моца
  rationale: Личное имя передано непосредственно с еврейского; согласная צ отражена русской «ц».
- source_word: וְ
  choice: и / а
  rationale: Союз выражает последовательное присоединение звеньев родословной; в последней части «а» естественно обозначает переход к следующему поколению, не меняя смысла.
- source_word: אֶת
  choice: не передано отдельным словом
  rationale: Показатель прямого дополнения не имеет отдельного соответствия в русском языке; его синтаксическая функция выражена формой предложения.
theological_decisions: []
