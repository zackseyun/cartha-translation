  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: ru
  text: Вот певцы, главы левитских родов; они находились в комнатах и были освобождены от других обязанностей[a], потому что день и ночь несли эту службу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были свободны»; редкое еврейское слово, вероятно, означает, что они были освобождены от прочих обязанностей из-за непрерывного служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Причастная форма от שׁיר обозначает тех, кто поёт; «певцы» точнее, чем более широкое «музыканты».
- source_word: רָאשֵׁי אָבוֹת לַלְוִיִּם
  choice: главы левитских родов
  rationale: Передаёт родовую структуру выражения естественным для современного русского языка способом.
- source_word: בַּלְּשָׁכֹת
  choice: в комнатах
  rationale: לשכה означает комнату или помещение, нередко при храмовом комплексе; добавление слова «храмовых» не требуется самим словом.
- source_word: פטירים
  choice: освобождены от других обязанностей
  rationale: Редкая форма, вероятнее всего, указывает на освобождение от прочих обязанностей ввиду непрерывной службы.
- source_word: יוֹמָם וָלַיְלָה
  choice: день и ночь
  rationale: Прямо сохраняет временную пару и идею постоянной ответственности.
- source_word: עֲלֵיהֶם בַּמְּלָאכָה
  choice: несли эту службу
  rationale: Буквально работа была «на них»; русский оборот передаёт возложенную на них обязанность, а «служба» соответствует культовому контексту.
