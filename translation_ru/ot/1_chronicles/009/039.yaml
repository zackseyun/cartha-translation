  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: ru
  text: Нер стал отцом Киша, Киш — Саула, а Саул — Ионафана, Малки-Шуа, Авинадава и Эшбаала[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В 2 Цар 2:8 и ряде других мест Эшбаал назван Иш-Бошетом.
    reason: Альтернативная форма имени в параллельной библейской традиции.
lexical_decisions:
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В генеалогии форма Hiphil глагола ילד означает «породил, стал отцом». Выражение «стал отцом» естественно для современного русского языка и сохраняет прямую родословную связь.
- source_word: נֵר
  choice: Нер
  rationale: Передача личного имени непосредственно по еврейской форме.
- source_word: קִישׁ
  choice: Киш
  rationale: Передача личного имени непосредственно по еврейской форме с сохранением конечного שׁ.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: יְהוֹנָתָן
  choice: Ионафан
  rationale: Устоявшаяся и узнаваемая русская форма имени.
- source_word: מַלְכִּי שׁוּעַ
  choice: Малки-Шуа
  rationale: Составное личное имя передано через дефис в соответствии с его двумя компонентами в еврейском тексте.
- source_word: אֲבִינָדָב
  choice: Авинадав
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: אֶשְׁבָּעַל
  choice: Эшбаал
  rationale: Перевод следует форме имени в тексте Паралипоменон и не заменяет её формой из книг Царств.
- source_word: וְ
  choice: и; а
  rationale: Повторяющийся союз передан естественными русскими средствами координации; «а» перед последним звеном родословной облегчает чтение, не меняя связи.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет отдельного соответствия в русском языке; его функция выражена синтаксисом.
theological_decisions:
- issue: Соотношение имён אֶשְׁבָּעַל и אִישׁ־בֹּשֶׁת
  choice: В основном тексте сохранено имя «Эшбаал».
  alternative: Заменить его именем «Иш-Бошет» по 2 Цар 2:8 и параллельным местам.
  rationale: Масоретский текст 1 Пар 9:39 прямо содержит אֶשְׁבָּעַל; гармонизация устранила бы значимое различие между текстами. Другая форма имени отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; лаконичная генеалогическая конструкция без архаичного «родил». Тире устраняет тяжеловесное повторение сказуемого, сохраняя последовательность поколений. Имена преимущественно переданы близко к еврейскому тексту, при сохранении прочно установившихся русских форм.
