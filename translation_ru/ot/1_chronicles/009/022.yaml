    issue: Неоднозначная начальная конструкция
    rationale: «Всех избранных привратниками» не вполне ясно показывает, что избраны именно люди для исполнения обязанностей привратников. Перестройка устраняет двусмысленность, не меняя смысла.
  - severity: low
    issue: Выбор титула «прозорливец»
    rationale: Слово сохраняет традиционный оттенок, но для целевого современного литературного русского «провидец» понятнее и лучше соответствует титулу רֹאֶה без подмены его «пророком».
  revised_text: Число всех отобранных для службы привратниками у порогов составляло двести двенадцать. Они были внесены в родословные списки по своим селениям. Давид и Самуил, провидец, утвердили их в порученном им служении[a].
