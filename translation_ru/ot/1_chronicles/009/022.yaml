  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: ru
  text: Число всех отобранных для службы привратниками у порогов составляло двести двенадцать. Они были внесены в родословные списки по своим селениям. Давид и Самуил, провидец, утвердили их в порученном им служении[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утвердили их за их верность»; возможно также: «утвердили их в их верности».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: избранных
  rationale: Страдательное причастие обозначает людей, отобранных для определённой обязанности; «избранных» точно и естественно передаёт этот смысл.
- source_word: לְשֹׁעֲרִים
  choice: привратниками
  rationale: Слово обозначает служителей, охраняющих ворота или входы; «привратники» — традиционное и понятное обозначение в храмовом контексте.
- source_word: בַּסִּפִּים
  choice: у порогов
  rationale: סַף буквально означает порог; перевод сохраняет конкретный образ охраняемых входов.
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: двести двенадцать
  rationale: Прямая передача количественного числительного.
- source_word: בְחַצְרֵיהֶם
  choice: по своим селениям
  rationale: В данном генеалогическом контексте חָצֵר означает поселения или селения, а не храмовые дворы; предлог «по» естественно связывает регистрацию с местами проживания.
- source_word: הִתְיַחְשָׂם
  choice: были внесены в родословные списки
  rationale: Форма глагола יחס указывает на официальную генеалогическую регистрацию; развёрнутая формулировка ясна современному читателю.
- source_word: יִסַּד
  choice: утвердили
  rationale: Глагол означает основать или установить. В отношении уже названных служителей «утвердили» естественно передаёт установление порядка и закрепление обязанности.
- source_word: הָרֹאֶה
  choice: прозорливец
  rationale: Сохранён особый древний титул Самуила, отличающийся от обычного слова «пророк».
- source_word: בֶּאֱמוּנָתָם
  choice: в порученном им служении
  rationale: В административном контексте אֱמוּנָה может обозначать доверенную обязанность или ответственное поручение. Формулировка передаёт институциональный смысл, а возможный акцент на верности сохранён в примечании.
theological_decisions:
- issue: Смысл בֶּאֱמוּנָתָם в конце стиха
  choice: Давид и Самуил утвердили их в порученном им служении
  alternative: Давид и Самуил утвердили их за их верность; либо утвердили их в их верности
  rationale: Сжатая еврейская конструкция допускает как административный смысл доверенной обязанности, так и нравственный смысл верности. Контекст храмовой службы и официальной регистрации поддерживает основной перевод, а примечание сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Термины «привратники», «родословные списки» и «прозорливец» сохраняют историко-храмовый колорит, оставаясь понятными обычному читателю.
