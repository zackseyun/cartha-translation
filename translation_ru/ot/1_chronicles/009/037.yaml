lexical_decisions:
- source_word: וּ/גְד֣וֹר
  choice: и Гедор
  rationale: Личное имя с присоединённым союзом ו; передано принятой русской библейской транслитерацией.
- source_word: וְ/אַחְי֔וֹ
  choice: Ахио
  rationale: Личное имя передано традиционной русской библейской формой; еврейский союз ו в перечислении естественно не повторяется перед каждым именем по нормам современного русского языка.
- source_word: וּ/זְכַרְיָ֖ה
  choice: Захария
  rationale: Использована устоявшаяся русская библейская форма имени זְכַרְיָה, а не буквальная фонетическая транслитерация.
- source_word: וּ/מִקְלֽוֹת
  choice: и Миклот
  rationale: Личное имя транслитерировано как «Миклот»; союз перед последним элементом сохраняет естественную структуру русского перечисления.
