  text: עוּתַ֨י בֶּן עַמִּיה֤וּד בֶּן עָמְרִי֙ בֶּן אִמְרִ֣י בֶן בני/מן בְּנֵי פֶ֖רֶץ בֶּן יְהוּדָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: ru
  text: Утай, сын Аммихуда, сына Омри, сына Имри, сына Бани[a], из потомков Переца, сына Иуды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская текстовая традиция в этом месте неоднозначна: вместо имени «Бани» возможно чтение «из». Тогда фраза будет звучать: «сына Имри, из потомков Переца, сына Иуды». В основном тексте принято чтение как личного имени, поскольку оно лучше соответствует последовательности имён в родословии.'
    reason: textual_variant
lexical_decisions:
- source_word: עוּתַי
  choice: Утай
  rationale: Личное имя передано транслитерацией, близкой к еврейскому произношению.
- source_word: בֶּן
  choice: сын / сына
  rationale: В родословной конструкции слово буквально означает «сын»; падежные формы согласованы с русским синтаксисом. Возможное сокращение поколений в родословии не устраняется переводом.
- source_word: עַמִּיהוּד
  choice: Аммихуд
  rationale: Личное имя транслитерировано с передачей начального придыхательного согласного во втором компоненте имени.
- source_word: עָמְרִי
  choice: Омри
  rationale: Личное имя передано современной транслитерацией.
- source_word: אִמְרִי
  choice: Имри
  rationale: Личное имя передано современной транслитерацией.
- source_word: בני/מן
  choice: Бани
  rationale: Основной текст принимает чтение как личное имя, поскольку оно естественно продолжает последовательность имён; текстовая неоднозначность отмечена в сноске.
- source_word: בְּנֵי
  choice: потомков
  rationale: В обозначении рода выражение «сыны Переца» означает его потомков; естественное русское «из потомков» точно передаёт родовую принадлежность.
- source_word: פֶרֶץ
  choice: Перец
  rationale: Личное имя транслитерировано непосредственно с еврейского.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Использована устоявшаяся русская форма библейского имени.
