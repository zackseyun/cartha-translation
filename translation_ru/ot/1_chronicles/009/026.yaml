  text: כִּ֣י בֶ/אֱמוּנָ֞ה הֵ֗מָּה אַרְבַּ֨עַת֙ גִּבֹּרֵ֣י הַ/שֹּׁעֲרִ֔ים הֵ֖ם הַ/לְוִיִּ֑ם וְ/הָיוּ֙ עַל הַ/לְּשָׁכ֔וֹת וְ/עַ֥ל הָ/אֹצְר֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/026.yaml
  text: For these four mighty gatekeepers[a], who were Levites[b], were entrusted with the chambers and with the storehouses of the house of God.
translation:
  language: ru
  text: Ибо этим четырём выдающимся привратникам — левитам — было поручено[a] заведовать храмовыми помещениями и хранилищами[b] дома Божьего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в верности», «верно»; еврейское выражение может также указывать на доверенный, надёжно исполняемый характер их служения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сокровищницами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит пояснение к предшествующему распределению обязанностей; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: בֶאֱמוּנָה
  choice: занимали ответственную должность
  rationale: Существительное указывает на верность, надёжность и доверие. В данном административном контексте выражение означает доверенное служение; перевод передаёт этот смысл, а буквальная образность отмечена в сноске.
- source_word: גִּבֹּרֵי הַשֹּׁעֲרִים
  choice: главных привратников
  rationale: גִּבּוֹרֵי буквально характеризует их как сильных или выдающихся; при описании храмовой службы оно, вероятно, указывает на их высокое положение и особую ответственность. «Главных» звучит естественно по-русски и соответствует контексту.
- source_word: הֵם הַלְוִיִּם
  choice: левиты
  rationale: Обособленное приложение кратко и ясно сохраняет отождествление этих четырёх привратников с левитами.
- source_word: וְהָיוּ עַל
  choice: они ведали
  rationale: Сочетание היה с עַל обозначает надзор и ответственность за вверенные помещения; «ведали» точно и естественно выражает административную функцию.
- source_word: הַלְּשָׁכוֹת
  choice: комнатами
  rationale: Речь идёт о помещениях при храме. Современное «комнаты» понятнее обычному читателю, чем архаичное «палаты».
- source_word: הָאֹצְרוֹת
  choice: хранилищами
  rationale: אֹצָר может обозначать как складские помещения, так и сокровищницы. «Хранилища» сохраняет широкий смысл, а более узкая возможность указана в сноске.
- source_word: בֵּית הָאֱלֹהִים
  choice: дома Божьего
  rationale: Формально прозрачный перевод сохраняет ветхозаветное обозначение храма как Божьего дома.
