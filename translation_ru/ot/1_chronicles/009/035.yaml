lexical_decisions:
- source_word: וּבְגִבְעוֹן
  choice: В Гаваоне
  rationale: Начальный союз ו в таком повествовательно-генеалогическом переходе не обязательно передавать отдельно; предложная форма точно выражает место жительства.
- source_word: יָשְׁבוּ
  choice: жил
  rationale: Глагол ישב здесь означает постоянное проживание. Хотя в еврейском стоит форма множественного числа «жили», формула вводит Иеиела и продолжающийся далее перечень его семьи; в рамках данного стиха русское единственное число естественно согласуется с названным лицом.
- source_word: יעואל
  choice: Иеиел
  rationale: Выбрана традиционная русская передача имени с учётом формы чтения и параллельного места в 1 Пар. 8:29; иной способ передачи согласных отражён в примечании.
- source_word: אֲבִי גִבְעוֹן
  choice: отец Гаваона
  rationale: 'Сохранено буквальное и намеренно неоднозначное выражение: оно может обозначать родоначальника, основателя или главу жителей города.'
- source_word: וְשֵׁם אִשְׁתּוֹ
  choice: Его жену звали
  rationale: Естественная современная русская передача именного оборота «и имя его жены —», без изменения смысла.
- source_word: מַעֲכָה
  choice: Мааха
  rationale: Традиционная русская передача древнееврейского личного имени.
