  yaml_path: translation/ot/1_chronicles/009/024.yaml
  text: 'The gatekeepers were at the four directions: east[a], west, north, and south.'
translation:
  language: ru
  text: 'Привратники находились по четырём сторонам света[a]: на востоке, западе, севере и юге.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к четырём ветрам»; здесь имеются в виду четыре стороны света.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבַּע רוּחוֹת
  choice: по четырём сторонам света
  rationale: Буквально «к четырём ветрам»; в данном пространственном контексте выражение обозначает четыре стороны света. Предлог ל передаёт распределение привратников по направлениям.
- source_word: יִהְיוּ
  choice: находились
  rationale: Форма глагола היה буквально сообщает местонахождение («были»). «Находились» естественно передаёт смысл, не добавляя явно отсутствующего в еврейском тексте значения «были поставлены».
- source_word: הַשֹּׁעֲרִים
  choice: привратники
  rationale: Существительное обозначает людей, отвечавших за ворота; «привратники» — точный и уместный в храмовом контексте русский эквивалент.
- source_word: מִזְרָח יָמָּה צָפוֹנָה וָנֶגְבָּה
  choice: на востоке, западе, севере и юге
  rationale: Направительные формы перечисляют четыре стороны света. יָמָּה этимологически значит «к морю», а נֶגְבָּה — «к Негеву/югу», но в данном перечне они функционируют как обозначения запада и юга.
