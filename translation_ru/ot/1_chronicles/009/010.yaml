  language: ru
  text: 'А из священников: Иедаия, Иоиарив и Иахин.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: А из
  rationale: Сочетание союза ו с предлогом מִן вводит следующую группу в перечне; «А из» естественно передаёт переход и сохраняет связь с предшествующим контекстом.
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Стандартная передача существительного כֹּהֲנִים с определённым артиклем; после предлога «из» употреблён родительный падеж.
- source_word: יְדַעְיָה
  choice: Иедаия
  rationale: Традиционная русская библейская форма личного имени, соответствующая еврейскому יְדַעְיָה.
- source_word: וִיהוֹיָרִיב
  choice: Иоиарив
  rationale: Традиционная русская библейская форма имени; присоединённый союз передан структурой русского перечисления.
- source_word: וְיָכִין
  choice: и Иахин
  rationale: Традиционная русская библейская форма имени; союз ו перед последним элементом списка передан русским «и».
