  text: Вот главы левитских родов по их поколениям — главы. Они жили в Иерусалиме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главы родов
  rationale: В контексте Паралипоменон выражение обозначает руководителей родовых, то есть предковых, семейных объединений. «Главы родов» естественно передаёт этот общественно-родословный смысл по-русски.
- source_word: לַלְוִיִּם
  choice: левитских
  rationale: Префикс ל обозначает принадлежность или соотнесённость; русское прилагательное ясно указывает, что речь идёт о родах левитов.
- source_word: לְתֹלְדוֹתָם
  choice: по их поколениям
  rationale: תּוֹלְדוֹת здесь относится к поколениям и линиям происхождения; буквальное и понятное выражение не вводит отсутствующего в тексте указания на письменные списки.
- source_word: רָאשִׁים
  choice: главы
  rationale: Повтор слова с тем же корнем сохранён как смысловое усиление и приложение, несмотря на некоторую необычность русской фразы.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: В данном контексте глагол обозначает постоянное проживание; «жили» — современное и нейтральное соответствие.
- source_word: בִירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Стандартная передача названия места с локативным предлогом.
