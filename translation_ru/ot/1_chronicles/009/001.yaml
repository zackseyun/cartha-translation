base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: ru
  text: Все израильтяне были внесены в родословные списки[a]; и вот, они записаны в Книге царей Израиля; а Иуда был переселён в Вавилон за свою неверность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были учтены по родословиям»; «были зарегистрированы по родословным».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за своё вероломство»; «за нарушение верности». Еврейское слово может обозначать неверность как нарушение обязательств, в том числе заветных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: были внесены в родословные списки
  rationale: Глагол в породе хитпаэль обозначает установление и документальную регистрацию происхождения, а не простой подсчёт. Формулировка естественна для современного русского языка и сохраняет административно-генеалогический смысл.
- source_word: וְהִנָּם
  choice: и вот, они
  rationale: «Вот» передаёт указательно-эмфатическую функцию еврейского маркера и не опускает его, хотя сохраняет несколько торжественный регистр.
- source_word: כְּתוּבִים
  choice: записаны
  rationale: Страдательное причастие имеет результативно-стативное значение. «Записаны» в русском звучит естественнее буквального «написаны» в контексте официального документа.
- source_word: עַל סֵפֶר
  choice: в Книге
  rationale: При глаголе записи русская идиома требует предлога «в». Существительное סֵפֶר здесь обозначает письменный источник или официальный свод.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: царей Израиля
  rationale: Фраза передана как название конкретного письменного источника — «Книга царей Израиля», без отождествления с какой-либо иной канонической книгой.
- source_word: וִיהוּדָה
  choice: А Иуда
  rationale: Союз вводит новый субъект и противопоставленно-переходную часть стиха. «Иуда» понимается собирательно как народ или царство.
- source_word: הָגְלוּ
  choice: был переселён
  rationale: 'Хофал выражает каузативно-страдательное действие: Иуда подвергся насильственному переселению, а не ушёл добровольно. Единственное число согласуется с собирательным названием «Иуда».'
- source_word: לְבָבֶל
  choice: в Вавилон
  rationale: Естественное русское обозначение направления переселения.
- source_word: בְּמַעֲלָם
  choice: за свою неверность
  rationale: מַעַל обозначает вероломство, нарушение верности и нередко заветное отступничество. «Неверность» сохраняет этот смысл, не вводя в основной текст пояснительного богословского расширения.
theological_decisions:
- issue: Характер проступка в בְּמַעֲלָם
  choice: неверность
  alternative: преступление; вероломство; нарушение верности
  rationale: Выбранное слово передаёт не только общее нарушение, но и заложенную в מַעַל идею нарушения обязательств и верности, при этом не уточняет сверх текста, кому именно была проявлена неверность.
- issue: Залоговая семантика הָגְלוּ
  choice: страдательное переселение — «был переселён»
  alternative: «ушёл в изгнание»; «оказался в изгнании»
  rationale: Форма хофал показывает, что Иуда подвергся переселению. Это сохраняет подразумеваемую принудительность и контекст суда.
- issue: Собирательные обозначения Израиля и Иуды
  choice: «все израильтяне» в первой части и собирательное «Иуда» во второй
  alternative: буквальное «весь Израиль» в обеих синтаксических связях
  rationale: Множественное «все израильтяне» естественно согласуется с последующим еврейским множественным числом «они записаны», тогда как «Иуда» сохраняет форму и собирательность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Частица «вот» сохранена ради эмфатической функции исходного текста. Синтаксис разделён на два предложения для ясности; переходный союз «А» отмечает смену темы от всеобщей родословной регистрации Израиля к изгнанию Иуды.
