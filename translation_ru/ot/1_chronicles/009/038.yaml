  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ם וְ/אַף הֵ֗ם נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירֽוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/038.yaml
  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: ru
  text: Миклот стал отцом Шимеама[a]. Они также жили напротив своих братьев в Иерусалиме[b], вместе со своими братьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Шимеам»; в некоторых переводах — «Шимеа», вероятно, в результате согласования с параллельными генеалогическими формами.
    reason: alternative_reading
  - marker: b
    text: 'Или: «перед своими братьями»; возможно также: «рядом со своими братьями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Миклот
  rationale: Собственное имя передано транслитерацией; начальный союз не выделен отдельно, поскольку стих продолжает генеалогическое повествование.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В породной форме глагол в генеалогическом контексте означает «произвёл на свет, стал отцом»; выбран естественный современный русский оборот без архаизма «родил» в отношении мужчины.
- source_word: אֶת שִׁמְאָם
  choice: Шимеама
  rationale: Имя передано по согласному тексту данного стиха как «Шимеам», а показатель прямого дополнения отдельно не переводится.
- source_word: וְאַף הֵם
  choice: Они также
  rationale: Передаёт добавочное значение וְאַף и сохраняет неопределённость местоименного отнесения, присутствующую в еврейском тексте.
- source_word: נֶגֶד
  choice: напротив
  rationale: Сохраняет основное пространственное значение слова, не заменяя его более толковательным «рядом».
- source_word: אֲחֵיהֶם
  choice: своих братьев
  rationale: Буквально передаёт родственное обозначение; в генеалогическом контексте оно может охватывать более широкую родственную группу, но текст этого прямо не уточняет.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: В данном контексте глагол обозначает постоянное проживание; современное «жили» естественнее архаичного «обитали» и не предполагает обязательно первоначального заселения.
- source_word: בִירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Стандартная русская форма топонима с сохранением предлога.
- source_word: עִם אֲחֵיהֶם
  choice: вместе со своими братьями
  rationale: Передаёт значение совместности и сохраняет намеренный повтор слова «братья» в еврейском тексте.
theological_decisions: []
