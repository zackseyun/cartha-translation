  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: ru
  text: и Адая, сын Иерохама, сына Пашхура, сына Малхии, и Маасай, сын Адиэла, сына Яхзеры, сына Мешуллама, сына Мешиллемифа[a], сына Иммера.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит форма имени «Мешиллемиф»; в других местах встречается родственная форма «Мешиллемоф».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: и Адая
  rationale: Союз ו продолжает перечень из предыдущего стиха; личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶּן
  choice: сын
  rationale: В этой родословной цепочке בֶּן естественно передать словом «сын», сохранив структуру еврейского текста; возможность более широкого значения «потомок» контекстом не исключается, но здесь не уточняется.
- source_word: יְרֹחָם
  choice: Иерохам
  rationale: Имя передано в привычной русской библейской форме.
- source_word: פַּשְׁחוּר
  choice: Пашхур
  rationale: Транслитерация отражает еврейскую форму имени и привычное русское написание.
- source_word: מַלְכִּיָּה
  choice: Малхия
  rationale: Использована традиционная русская библейская форма имени.
- source_word: וּ/מַעְשַׂי
  choice: и Маасай
  rationale: Союз ו передан как «и»; имя транслитерировано по данной масоретской форме и не отождествлено с более длинной формой Маасея.
- source_word: עֲדִיאֵל
  choice: Адиэл
  rationale: Имя передано близко к еврейскому звучанию в современной русской графике.
- source_word: יַחְזֵרָה
  choice: Яхзера
  rationale: Транслитерация следует масоретской огласовке и передаёт начальный י как «Я».
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Имя транслитерировано непосредственно с еврейского текста.
- source_word: מְשִׁלֵּמִית
  choice: Мешиллемиф
  rationale: Выбор следует форме מְשִׁלֵּמִית в данном стихе; конечное ת передано по традиционной русской библейской модели как «ф».
- source_word: אִמֵּר
  choice: Иммер
  rationale: Имя транслитерировано непосредственно с еврейского с сохранением удвоенной согласной.
theological_decisions: []
