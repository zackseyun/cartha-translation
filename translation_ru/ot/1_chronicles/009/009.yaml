    issue: Заключительное «в своих отчих домах» недостаточно ясно передаёт генеалогическую принадлежность, выраженную לְבֵית אֲבֹתֵיהֶם.
    rationale: «Отчий дом» в современном употреблении легко понимается как родной дом или жилище, а предлог «в» усиливает локативное чтение. «Отцовские дома» вместе со сноской яснее передаёт родовые дома по отцовской линии.
