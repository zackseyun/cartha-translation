review_pass:
  verdict: revise
  source_fidelity: 'Первая часть точно передаёт счётную конструкцию: «их братьев/родичей, по их родословиям, было 956». «Братья» обоснованно сохраняет термин אָח, не устраняя его возможное родовое значение. Число передано верно. Однако «в своих отчих домах» делает заключительное לְבֵית אֲבֹתֵיהֶם преимущественно пространственным («внутри домов»). В данном генеалогическом титуле речь идёт о принадлежности и статусе по отношению к отцовским домам/родовым объединениям. Формулировка «в своих отцовских домах» лучше сохраняет технический родословный смысл и множественное число источника.'
  naturalness: Текст в целом естественен для современного литературного русского с сдержанно возвышенным летописно-родословным регистром. «Мужи» здесь допустимо и стилистически уместно. «Их братьев ... было» — нормальная русская количественная конструкция. Замена «отчих» на «отцовские» делает выражение чуть менее поэтичным, но более прозрачным в качестве названия патрилинейного дома.
  terminology: «Родословия», «братья», «мужи» и «главы родов» пригодны. «Главы родов» передаёт רָאשֵׁי אָבוֹת как техническое обозначение; сноска поясняет, что «отцовский дом» — не просто жилище, а родовое объединение. Сноска привязана к соответствующему термину и не навязывает интерпретации.
  issues:
