base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: ru
  text: А их братьев, по их родословиям, было девятьсот пятьдесят шесть. Все эти мужи были главами родов в своих отцовских домах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Отцовский дом» — родовая группа, объединённая происхождением по отцовской линии.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: А их братьев
  rationale: Сохраняет основное значение אָח; в данном родословном контексте слово может обозначать также соплеменников или родичей.
- source_word: לְתֹלְדוֹתָם
  choice: по их родословиям
  rationale: В генеалогическом контексте תּוֹלְדוֹת указывает на линии происхождения или родословные записи; этот вариант естественнее для современного русского, чем буквальное «по их поколениям».
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: девятьсот пятьдесят шесть
  rationale: Прямая передача количественного числительного.
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: Все эти мужи
  rationale: אֲנָשִׁים здесь относится к мужчинам, перечисленным в родословии; «мужи» поддерживает достойный историко-родословный регистр.
- source_word: רָאשֵׁי אָבוֹת
  choice: главами родов
  rationale: Это социально-генеалогическое обозначение руководителей отцовских родовых объединений; буквальное «главы отцов» по-русски не передаёт смысла.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: в своих отчих домах
  rationale: Передаёт принадлежность к патрилинейным семейно-родовым объединениям и сохраняет образ «дома».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно торжественным родословным регистром. Формулировка избегает неестественного буквального повторения «главы отцов… в домах их отцов», но сохраняет различие между «родами» и «отчими домами».
