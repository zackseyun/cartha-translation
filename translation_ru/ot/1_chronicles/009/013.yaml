  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: ru
  text: Их братья[a], главы своих родовых домов, — 1760 доблестных мужей[b], выполнявших работу по служению в доме Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «родственники». Еврейское слово «братья» может обозначать более широкий круг членов рода, а не только родных братьев.
    reason: lexical_alternative
  - marker: b
    text: Или «доблестные и способные люди». Еврейское выражение указывает на силу, доблесть или доказанную способность; в данном контексте оно не обязательно связано с военными подвигами.
    reason: lexical_alternative
  - marker: c
    text: То есть в храме.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Их братья
  rationale: Сохраняет прямое значение אָח и семейно-родовой характер выражения; в данном контексте слово может обозначать не только родных братьев.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: главы своих родовых домов
  rationale: Передаёт генеалогический и административный смысл устойчивого выражения; «родовые дома» звучит понятнее современному русскому читателю, чем буквальное «дома отцов».
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '1760'
  rationale: Еврейская последовательность числительных однозначно даёт итог 1760; использована стандартная цифровая запись.
- source_word: גִּבּוֹרֵי חֵיל
  choice: доблестных мужей
  rationale: Сохраняет почётный оттенок силы, достоинства и испытанной способности, не превращая выражение в однозначно военный термин, что особенно важно в контексте храмового служения.
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: исполнявших служебные обязанности
  rationale: Естественно по-русски передаёт сочетание понятий работы и службы, сохраняя оба смысловых компонента без тяжеловесной кальки «работа служения».
- source_word: בֵּית הָאֱלֹהִים
  choice: в доме Бога
  rationale: Сохраняет буквальный образ еврейского выражения и его богословское звучание; по контексту речь идёт о храме.
theological_decisions:
- issue: Передача родственного термина во множественном числе мужского рода
  choice: братья
  alternative: родственники; соплеменники
  rationale: Мужской род и семейная образность исходного текста сохранены; более широкое клановое значение отмечено в сноске, а не подставлено в основной текст.
- issue: Обозначение храма
  choice: дом Бога
  alternative: храм Бога
  rationale: Выбрана формулировка самого еврейского текста, не устраняющая образ «дома»; контекстуальное значение «храм» пояснено в сноске.
- issue: Характеристика גִּבּוֹרֵי חֵיל в невоенном контексте
  choice: доблестные мужи
  alternative: храбрые воины; способные люди
  rationale: Перевод сохраняет почётную и сильную характеристику, но не сводит её исключительно к воинской доблести и не ослабляет до одной лишь профессиональной пригодности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Родовые дома» сохраняет древнюю общественную реалию в понятной форме; «мужи» поддерживает достоинство почётного выражения, а причастный оборот естественно связывает характеристику людей с храмовыми обязанностями.
