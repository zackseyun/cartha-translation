source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: ru
  text: И Шаллум, сын Коре, сына Эвиасафа, сына Кораха, и его братья из дома его отца, корахиты, были поставлены над работой служения, стражами порогов шатра[a]; а их отцы были поставлены над станом Яхве[b], стражами входа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стражи ворот шатра». Буквально: «стражи порогов шатра».'
    reason: Передаёт контекстуально возможное значение הַסִּפִּים, сохраняя в основном тексте буквальное «пороги».
  - marker: b
    text: «Яхве» передаёт личное имя Бога, обозначаемое в еврейском тексте четырьмя согласными ЙХВХ; традиционно его заменяют словом «Господь».
    reason: Поясняет передачу тетраграмматона.
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: И Шаллум
  rationale: Союз וְ связывает стих с предшествующим перечнем; простое «и» сохраняет последовательность изложения.
- source_word: בֶּן קוֹרֵא בֶּן אֶבְיָסָף בֶּן קֹרַח
  choice: сын Коре, сына Эвиасафа, сына Кораха
  rationale: Повторяющаяся генеалогическая формула передана буквально; русские падежные формы ясно выражают родословную цепь.
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: и его братья из его отцовского дома
  rationale: Сохранено буквальное «братья» и родовое значение выражения «дом отца», без сужения до родных братьев.
- source_word: הַקָּרְחִים
  choice: корахеи
  rationale: Форма обозначает членов рода Кораха; «корахеи» — ясное русское родовое наименование.
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: отвечали за служебные работы
  rationale: עַל выражает ответственность или надзор. Эта формулировка естественна по-русски и не привносит позднейшего церковного смысла слова «служение».
- source_word: שֹׁמְרֵי הַסִּפִּים
  choice: охраняя пороги
  rationale: Причастие выражает постоянную обязанность охранять, а «пороги» сохраняет конкретный образ еврейского הַסִּפִּים.
- source_word: לָאֹהֶל
  choice: Шатра
  rationale: В источнике стоит обычное слово «шатёр». Заглавная буква указывает на конкретный священный Шатёр, не подменяя исходную лексику более техническим термином «скиния».
- source_word: וַאֲבֹתֵיהֶם
  choice: а их отцы
  rationale: Сохранено семейно-родовое обозначение; контекст и вид глагола передают отсылку к прежним поколениям.
- source_word: עַל מַחֲנֵה יְהוָה שֹׁמְרֵי הַמָּבוֹא
  choice: охраняли вход в стан Яхве
  rationale: Перестройка делает русскую фразу естественной, сохраняя функцию предков при стане и повтор мотива охраны.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо содержит тетраграмматон. «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Термин для священного шатра
  choice: Шатёр
  alternative: скиния
  rationale: В еврейском тексте употреблено אֹהֶל, «шатёр». Перевод сохраняет исходное слово и оставляет историческую отсылку имплицитной.
- issue: Синтаксическая связь последней части стиха
  choice: их отцы охраняли вход в стан Яхве
  alternative: их отцы начальствовали над станом Яхве как стражи входа
  rationale: Передача отражает роль предков как стражей доступа, не превращая עַל автоматически в формальный начальственный чин.
translation_notes:
  register: Современный литературный русский с достоинством летописно-родословного контекста. Синтаксис упрощён ровно настолько, чтобы стих был понятен обычному читателю; конкретные образы «пороги», «Шатёр» и «стан» сохранены.
