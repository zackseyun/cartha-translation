  text: Naarah bore to him Ahuzzam[a], Hepher, Temeni, and Haahashtari[b]. These were the sons of Naarah.
translation:
  language: ru
  text: Наара родила ему Ахуззама, Хефера, Темени[a] и Хаахаштария[b]. Это сыновья Наары.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Форму «Темени» можно также понять как обозначение с прилагательным значением — например, «теменитянин» или «южанин»; здесь, в родословии, она передана как личное имя.
    reason: lexical_alternative
  - marker: b
    text: Имя «Хаахаштарий» можно также передать как «Ахаштарий». В еврейском тексте перед ним стоит определённый артикль, который мог закрепиться как часть имени.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Форма глагола ילד вводит генеалогическое сообщение о рождении; русский глагол «родила» краток, естественен и сохраняет Наару как подлежащее.
- source_word: לוֹ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом указывает здесь на отца в генеалогической формуле, не уточняя отношения сверх сказанного в контексте.
- source_word: נַעֲרָה
  choice: Наара
  rationale: Личное имя передано русской транслитерацией и одинаково воспроизведено в обеих частях стиха.
- source_word: אֲחֻזָּם
  choice: Ахуззам
  rationale: Имя транслитерировано с передачей удвоенного согласного, обозначенного в еврейском тексте дагешем.
- source_word: חֵפֶר
  choice: Хефер
  rationale: Личное имя передано принятой для библейского иврита русской транслитерацией.
- source_word: תֵּימְנִי
  choice: Темени
  rationale: Хотя форма может иметь прилагательное значение, в данном генеалогическом перечне она, вероятнее всего, служит личным именем; транслитерация сохраняет эту функцию и исходную неоднозначность.
- source_word: הָאֲחַשְׁתָּרִי
  choice: Гаахаштарий
  rationale: Начальный определённый артикль הָ сохранён в составе транслитерированного имени как «Га-», поскольку в еврейской форме он мог закрепиться как часть имени.
- source_word: אֵלֶּה בְּנֵי נַעֲרָה
  choice: Это сыновья Наары
  rationale: Краткая естественная формула точно передаёт указательное אֵלֶּה и генеалогическое значение בְּנֵי как «сыновья».
