base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/032.yaml
  text: And their settlements were Etam[a], Ain, Rimmon, Tochen, and Ashan—five cities.
translation:
  language: ru
  text: 'Их поселения[a]: Этам, Аин, Риммон, Тохен и Ашан — пять городов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «селения»; еврейское слово может обозначать небольшие поселения или ограждённые места проживания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: их поселения
  rationale: Слово חָצֵר может обозначать селение, небольшое поселение или ограждённое место. В данном географическом перечне «поселения» естественно звучит по-русски и сохраняет широту значения.
- source_word: עֵיטָם
  choice: Этам
  rationale: Географическое название передано транслитерацией.
- source_word: עַיִן
  choice: Аин
  rationale: В перечне населённых пунктов это географическое название, хотя как нарицательное слово оно может означать «глаз» или «источник».
- source_word: רִמּוֹן
  choice: Риммон
  rationale: Здесь это географическое название; нарицательное значение «гранат» в перевод не вносится.
- source_word: תֹכֶן
  choice: Тохен
  rationale: Географическое название передано близко к огласованной еврейской форме.
- source_word: עָשָׁן
  choice: Ашан
  rationale: Географическое название передано транслитерацией.
- source_word: עָרִים חָמֵשׁ
  choice: пять городов
  rationale: עִיר обычно означает «город» или «населённый пункт»; традиционное и контекстуально уместное «города» сохраняет прямое значение итогового подсчёта.
