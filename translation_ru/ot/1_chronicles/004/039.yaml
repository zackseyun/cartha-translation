base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: ru
  text: Они пошли ко входу в Гедор[a], до восточной стороны долины[b], в поисках пастбища для своих стад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к подступам к Гедору»; еврейское слово может означать вход, подступ или место входа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к востоку от долины» либо «в направлении к востоку от долины»; еврейское выражение представляет собой краткое топографическое указание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Они пошли
  rationale: Последовательная повествовательная форма глагола הלך обозначает следующее действие; «пошли» естественно передаёт движение.
- source_word: לִמְבוֹא
  choice: ко входу в
  rationale: מָבוֹא может обозначать вход, подступ или место входа; «ко входу в» кратко сохраняет пространственный смысл.
- source_word: גְדֹר
  choice: Гедор
  rationale: Название местности передано транслитерацией.
- source_word: עַד לְמִזְרַח הַגָּיְא
  choice: до восточной стороны долины
  rationale: עַד указывает пространственный предел, а компактное топографическое выражение допускает понимание восточной стороны долины либо направления к востоку от неё; основная формулировка естественна по-русски, неоднозначность отмечена в сноске.
- source_word: לְבַקֵּשׁ
  choice: чтобы найти
  rationale: Инфинитив выражает цель. В данном контексте русское «чтобы найти» естественно передаёт целенаправленный поиск подходящего пастбища.
- source_word: מִרְעֶה
  choice: пастбище
  rationale: Слово обозначает место для выпаса скота; «пастбище» точно и идиоматично.
- source_word: לְצֹאנָם
  choice: для своих стад
  rationale: צֹאן охватывает мелкий скот, в том числе овец и коз; «стада» не сужает значение до одного вида животных.
