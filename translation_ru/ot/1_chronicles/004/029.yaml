lexical_decisions:
- source_word: וּ/בְ/בִלְהָה
  choice: и в Билхе
  rationale: 'Сочетание וּבְ передаёт присоединение к перечню и местонахождение: «и в». בִלְהָה здесь является названием поселения и транслитерируется как «Билха»; после предлога употреблена нормативная форма «Билхе».'
- source_word: וּ/בְ/עֶצֶם
  choice: и в Эцеме
  rationale: Повторяющаяся конструкция וּבְ последовательно передана как «и в». עֶצֶם в данном перечне — топоним, переданный транслитерацией «Эцем».
- source_word: וּ/בְ/תוֹלָד
  choice: и в Толаде
  rationale: Конструкция וּבְ сохраняет присоединительный и местный смысл. תוֹלָד — название поселения, транслитерированное как «Толад».
