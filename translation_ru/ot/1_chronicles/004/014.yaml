base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: ru
  text: Меонофай стал отцом Офры, а Сераия — Иоава, отца Ге-Харашима[a], ибо они были ремесленниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Ге-Харашим» означает «Долина ремесленников». «Отец» здесь может означать основателя или родоначальника жителей этого места.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: Меонофай
  rationale: Личное имя передано транслитерацией в форме, естественной для русской библейской традиции.
- source_word: הוֹלִיד
  choice: породил
  rationale: В родословии каузативная форма глагола ילד обозначает рождение потомка; «породил» сохраняет генеалогическую формулу и остаётся понятным современному читателю.
- source_word: עָפְרָה
  choice: Офру
  rationale: Имя собственное передано транслитерацией; винительный падеж отражён русским окончанием.
- source_word: שְׂרָיָה
  choice: Сераия
  rationale: Имя собственное передано принятой русской библейской формой.
- source_word: יוֹאָב
  choice: Иоава
  rationale: Имя собственное передано принятой русской библейской формой и поставлено в винительный падеж.
- source_word: אֲבִי
  choice: отца
  rationale: Буквально сохраняет еврейское обозначение родственной или основательской связи, не устраняя его смысловую широту.
- source_word: גֵּיא חֲרָשִׁים
  choice: Ге-Харашим
  rationale: Сочетание сохранено как географическое название; его значение и возможная связь с ремесленниками поясняются сноской.
- source_word: כִּי
  choice: потому что
  rationale: Передаёт причинно-пояснительную связь с названием места.
- source_word: חֲרָשִׁים
  choice: ремесленниками
  rationale: Широкое значение слова охватывает искусных работников разных ремёсел и не сужает его до кузнецов.
- source_word: הָיוּ
  choice: они были
  rationale: Сохраняет множественное число и неоднозначную отсылку местоименного субъекта в еврейском тексте.
theological_decisions:
- issue: Значение выражения «отец Ге-Харашима»
  choice: Сохранено буквальное «отца Ге-Харашим».
  alternative: «основателя Ге-Харашима» или «родоначальника жителей Ге-Харашима».
  rationale: Слово אָב в родословных может обозначать как отца или предка, так и основателя либо главу поселения; основной текст не должен преждевременно устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с сохранением лаконичной родословной формулы. Имена переданы в узнаваемых русских библейских формах; топоним транслитерирован, а его прозрачное еврейское значение вынесено в сноску.
