  text: בְּנֵ֖י שִׁמְע֑וֹן נְמוּאֵ֣ל וְ/יָמִ֔ין יָרִ֖יב זֶ֥רַח שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/024.yaml
  text: 'The sons of Simeon: Nemuel[a], Jamin, Jarib, Zerah[c][b], and Shaul.'
translation:
  language: ru
  text: 'Сыновья Симеона: Немуил[a], Иамин, Иарив, Зерах[b] и Саул[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельной родословной в Быт. 46:10 это имя имеет форму Иемуил; здесь в еврейском тексте — Немуил.
    reason: alternative_reading
  - marker: b
    text: В параллельных родословных в Быт. 46:10 и Исх. 6:15 ему соответствует имя Цохар.
    reason: textual_variant
  - marker: c
    text: Саул — традиционная русская форма еврейского имени Шаул.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от «сын» вводит перечень непосредственно названных сыновей; это точнее, чем более широкое «потомки».
- source_word: שִׁמְעוֹן
  choice: Симеона
  rationale: Традиционная русская форма библейского имени; родительный падеж обусловлен конструкцией «сыновья Симеона».
- source_word: נְמוּאֵל
  choice: Немуил
  rationale: Передаёт еврейскую форму имени в данном стихе; в параллельной родословной употреблена иная форма.
- source_word: וְיָמִין
  choice: Иамин
  rationale: Имя передано в принятой русской библейской форме; союз ו в русском перечислении естественно выражен перед последним однородным членом, а не обязательно при первом имени после двоеточия.
- source_word: יָרִיב
  choice: Иарив
  rationale: Транслитерация собственного имени без перевода его возможного лексического значения.
- source_word: זֶרַח
  choice: Зерах
  rationale: Передаёт именно форму זֶרַח масоретского текста; отличная форма в параллельных родословных отмечена в сноске.
- source_word: שָׁאוּל
  choice: Саул
  rationale: Устоявшаяся русская библейская форма еврейского имени שָׁאוּל, понятная современному читателю.
theological_decisions: []
