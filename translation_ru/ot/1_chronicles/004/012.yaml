base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: ru
  text: Ештон стал отцом Бет-Рафа, Пасеаха и Техинны, отца Ир-Нахаша[a]. Это были люди Рехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «основателя Ир-Нахаша». В родословиях слово «отец» может обозначать не только непосредственного родителя, но и предка или основателя рода либо поселения. Название «Ир-Нахаш» может означать «город Нахаша» и, вероятно, является названием места.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: был отцом
  rationale: В родословном контексте порода hифиль от ילד обозначает рождение потомства; современное русское «был отцом» звучит естественно и не вносит архаизма «родил».
- source_word: בֵּית רָפָא
  choice: Бет-Рафа́
  rationale: В ряду личных имён сочетание передано как имя собственное, а не переведено буквально как «дом Рафа».
- source_word: פָּסֵחַ
  choice: Пасе́ах
  rationale: Имя собственное передано транслитерацией с учётом еврейского конечного гортанного согласного.
- source_word: תְּחִנָּה
  choice: Техи́нна
  rationale: Имя транслитерировано, а не переведено по нарицательному значению «мольба».
- source_word: אֲבִי עִיר נָחָשׁ
  choice: отца Ир-Наха́ша
  rationale: 'Сохранена многозначность אבי: это может быть отец, предок или основатель. עיר נחש в ономастическом контексте передано как название Ир-Нахаш.'
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: Это жители Рехи́
  rationale: Буквальное «мужи Рехи» в современном русском неестественно; «жители» ясно передаёт принадлежность людей к названной местности или общине.
