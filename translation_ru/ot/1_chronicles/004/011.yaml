  text: Chelub[a], the brother of Shuhah, fathered Mehir; he was the father of Eshton.
translation:
  language: ru
  text: А Келув, брат Шухи, стал отцом Мехира; тот был отцом Эштона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был предком (родоначальником) Эштона»; если Эштон — название поселения, возможно: «был его основателем». В родословиях выражение «отец кого-либо» иногда обозначает родоначальника рода или основателя поселения, а не только непосредственного отца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְלוּב
  choice: А Хелув
  rationale: Союз ו передан естественным для продолжающегося родословного перечня союзом «а»; имя транслитерировано в форме «Хелув».
- source_word: אֲחִי שׁוּחָה
  choice: брат Шухи
  rationale: Сопряжённая конструкция прямо обозначает родство; краткая русская форма естественна и ясна.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: В родословном контексте каузативная форма ילד означает рождение потомка; выражение современно и сохраняет генеалогический смысл без архаичного «родил».
- source_word: מְחִיר
  choice: Мехира
  rationale: Собственное имя передано транслитерацией и поставлено в требуемый русским синтаксисом родительный падеж.
- source_word: הוּא
  choice: тот
  rationale: Самостоятельное местоимение возвращает повествование к Мехиру. «Тот» яснее русского «он» устраняет возможную синтаксическую неясность, не меняя референта.
- source_word: אֲבִי
  choice: был отцом
  rationale: Сохранено основное значение слова אָב; возможный более широкий смысл родоначальника или основателя вынесен в примечание.
- source_word: אֶשְׁתּוֹן
  choice: Эштона
  rationale: Собственное имя транслитерировано и склонено по нормам современного русского языка.
theological_decisions:
- issue: Широта генеалогического выражения אֲבִי
  choice: В основном тексте — «был отцом»
  alternative: «был предком / родоначальником / основателем»
  rationale: Еврейское אָב допускает как непосредственное отцовство, так и более широкую родовую либо основательную связь. Буквальное основное значение сохранено, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным родословным стилем. Имена переданы непосредственно с древнееврейского; сохранено деление на две последовательные генеалогические связи.
