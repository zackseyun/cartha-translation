  rationale: Собственное название передано транслитерацией.
- source_word: עֵזֶר
  choice: Эзер
  rationale: Личное имя передано транслитерацией.
- source_word: חוּשָׁה
  choice: Хуша
  rationale: Собственное название передано транслитерацией; после родительного управления употреблена форма «Хуши».
- source_word: אֵלֶּה
  choice: они были
  rationale: В безглагольном еврейском предложении связка подразумевается; прошедшее время естественно для русского генеалогического повествования.
- source_word: בְנֵי
  choice: сыновьями
  rationale: Сохранено основное значение «сыновья» без расширительного толкования «потомки».
- source_word: חוּר
  choice: Хур
  rationale: Личное имя передано традиционной русской транслитерацией.
- source_word: בְּכֹר
  choice: первенца
  rationale: Передаёт статус Хура по отношению к Эфрате, не добавляя отсутствующее в оригинале слово «сын».
- source_word: אֶפְרָתָה
  choice: Эфрата
  rationale: Имя передано традиционной русской библейской формой; в родительном падеже — «Эфраты».
- source_word: בֵּית לָחֶם
  choice: Вифлеем
  rationale: Использована устоявшаяся русская форма названия места, а не буквальный перевод его компонентов.
theological_decisions:
- issue: К кому относится выражение «отец Вифлеема»
  choice: 'Сохранено непосредственное присоединение к Эфрате, как в синтаксисе еврейского текста: «Эфраты, отца Вифлеема».'
  alternative: 'Согласовать по смыслу с женским именем: «Эфраты, матери Вифлеема», либо отнести выражение к Хуру.'
  rationale: Масоретский текст содержит мужскую конструктивную форму אֲבִי («отец»), несмотря на возможное понимание Эфраты как женского имени. Перевод сохраняет грамматическое напряжение оригинала и не исправляет его молча.
translation_notes:
  register: Современный литературный русский с сохранением лаконичной генеалогической структуры. Начальный союз «и» оставлен, поскольку стих продолжает синтаксический ряд предыдущего контекста. Необычное сочетание «Эфраты, отца Вифлеема» намеренно сохранено как отражение грамматики масоретского текста.
