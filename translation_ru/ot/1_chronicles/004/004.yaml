  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: ru
  text: И Пенуэл[b], отец[a] Гедора, и Эзер, отец[a] Хуши. Это были сыновья Хура, первенца Эфраты, отца Вифлеема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В генеалогиях слово «отец» может означать также основателя или родоначальника, особенно когда речь идёт о городе или роде.
    reason: lexical_alternative
  - marker: b
    text: В других местах это имя имеет также форму «Пениэл».
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנוּאֵל
  choice: Пенуэл
  rationale: Личное имя передано транслитерацией в соответствии с данной огласованной формой; вариант «Пениэл» встречается в других местах.
- source_word: אֲבִי
  choice: отец
  rationale: Сохранена формальная генеалогическая идиома; применительно к месту или роду слово может обозначать также основателя либо родоначальника.
- source_word: גְדֹר
