  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: ru
  text: И Иоким, и мужи Козевы, и Иоас, и Сараф, которые господствовали в Моаве[a], и Иашуви-Лехем[b]. И это — древние сведения[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «владели Моавом», «стали господами в Моаве»; возможно также: «породнились с Моавом через брак». Еврейское выражение кратко и не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст неясен. Возможно, это не имя «Иашуви-Лехем», а выражение «и вернулись в Лехем»; Лехем иногда связывают с Вифлеемом.
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «и эти дела древние» или «и эти слова — из древних времён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: Иоким
  rationale: Личное имя передано принятой русской библейской формой, близкой к еврейскому звучанию.
- source_word: אַנְשֵׁי כֹזֵבָא
  choice: жители Козевы
  rationale: Буквально «мужи Козевы»; в современном русском перечислении родов и населённых мест естественнее «жители Козевы». כֹזֵבָא понято как географическое название.
- source_word: יוֹאָשׁ
  choice: Иоас
  rationale: Использована устоявшаяся русская библейская форма личного имени.
- source_word: שָׂרָף
  choice: Сараф
  rationale: В генеалогическом контексте слово понято как личное имя, а не переведено как нарицательное.
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: которые владели Моавом
  rationale: Глагол בעל здесь может обозначать владение, господство или положение хозяина. Основной текст передаёт наиболее прямой смысл, а реальная неопределённость выражения сохранена в сноске.
- source_word: יָשֻׁבִי לָחֶם
  choice: Иашуви-Лехем
  rationale: Неясное сочетание сохранено как составное имя, что не требует вводить в текст неподтверждённое действие «вернулись». Возможный разбор как глагольной фразы приведён в сноске.
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: Эти сведения относятся к древним временам
  rationale: דברים может означать слова, дела, обстоятельства или сведения. В генеалогической заметке «сведения» звучит естественно, а עַתִּיקִים передано как указание на их древность без излишне конкретного утверждения о письменных документах.
theological_decisions:
- issue: Значение בעל в сообщении о Моаве
  choice: владели Моавом
  alternative: господствовали в Моаве; стали господами в Моаве; породнились с Моавом через брак
  rationale: Краткая еврейская формулировка допускает несколько смыслов. Перевод не связывает её с определённой исторической или богословской реконструкцией, а альтернативы открыто отмечает.
translation_notes:
  register: 'Современный литературный русский язык с достоинством генеалогической хроники. Повтор союза «и» сохранён, чтобы передать структуру еврейского перечисления. Неясные места не сглажены: основное чтение остаётся удобочитаемым, а существенные альтернативы вынесены в сноски.'
