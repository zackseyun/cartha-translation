  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: ru
  text: 'Сыновья Шимона: Амнон, Ринна, Бен-Ханан[a] и Тилон. А сыновья Иши: Зохет и Бен-Зохет[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын Ханана». Однако в этом генеалогическом перечне сочетание, вероятно, является личным именем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сын Зохета». Однако в этом генеалогическом перечне сочетание, вероятно, является личным именем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: Сыновья Шимона
  rationale: Формула родословия передана прямо и естественно по-русски; начальный союз не выражен отдельно, поскольку стих продолжает перечень, а двоеточие ясно вводит имена.
- source_word: אַמְנוֹן וְרִנָּה
  choice: Амнон, Ринна
  rationale: Имена транслитерированы с древнееврейского; союз перед вторым именем естественно распределён в русском перечислении.
- source_word: בֶּן חָנָן
  choice: Бен-Ханан
  rationale: В последовательности личных имён сочетание, вероятнее всего, само служит именем. Дефис сохраняет его составную форму, не исключая буквального понимания «сын Ханана», отмеченного в сноске.
- source_word: וְתולון
  choice: и Тилон
  rationale: Личное имя передано транслитерацией согласно огласовке и принятому чтению источника.
- source_word: וּבְנֵי יִשְׁעִי
  choice: А сыновья Ишъи
  rationale: Повторная генеалогическая формула сохранена; союз передан как «А», естественно продолжающее русский перечень. Написание «Ишъи» отражает согласную ע и отличает это имя от иных сходных библейских имён.
- source_word: זוֹחֵת
  choice: Зохет
  rationale: Имя транслитерировано с древнееврейского без традиционного англоязычного сочетания th.
- source_word: וּבֶן זוֹחֵת
  choice: и Бен-Зохет
  rationale: По контексту перечня сочетание вероятнее понимать как составное личное имя; буквальная синтаксическая возможность «сын Зохета» сохранена в сноске.
