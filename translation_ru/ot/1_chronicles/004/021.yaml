base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: ru
  text: 'Сыновья Шелы, сына Иуды: Ер, отец Лехи, и Лаада, отец Мареши, а также роды дома изготовителей тонкого льна, из дома Ашбеи.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза в конце стиха очень сжата; возможен перевод: «и роды дома тех, кто изготовлял тонкий лён, дома Ашбеи». Слово «отец» ранее в стихе может также означать «предок» или «основатель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי שֵׁלָה בֶן יְהוּדָה
  choice: Сыновья Шелы, сына Иуды
  rationale: Сохранены буквальная родственная формула и генеалогическая связь; имена переданы в формах, естественных для русской библейской традиции.
- source_word: אֲבִי
  choice: отец
  rationale: Основное значение сохранено ради прозрачности текста, хотя в таком перечне слово может обозначать также предка или основателя рода либо поселения.
- source_word: לֵכָה
  choice: Лехи
  rationale: Имя или топоним транслитерирован с еврейского; его точная референция остаётся неясной.
- source_word: מִשְׁפְּחוֹת
  choice: роды
  rationale: В племенном и генеалогическом контексте слово обозначает расширенные родственные группы, а не только семьи в современном узком смысле.
- source_word: בֵּית עֲבֹדַת הַבֻּץ
  choice: дом изготовителей тонкого льна
  rationale: Сжатая конструкция передана как обозначение родовой или профессиональной общины; הַבֻּץ относится к тонкому льну или льняной ткани.
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: при доме Ашбеи
  rationale: Предлог לְ выражает не вполне определённую связь с домом Ашбеи; «при» сохраняет ассоциацию, не сводя её уверенно ни к месту, ни к принадлежности.
