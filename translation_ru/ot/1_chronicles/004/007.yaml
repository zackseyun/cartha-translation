  text: 'И сыновья[a] Хелы: Церет, Ицхар и Этнан.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В родословиях выражение «сыновья» может обозначать как непосредственных сыновей, так и более отдалённых потомков или представителей семейной линии.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: И сыновья
  rationale: Союз ו передан простым «и», связывающим стих с предшествующим родословием; בְנֵי сохранено как обычная родословная формула «сыновья».
- source_word: חֶלְאָה
  choice: Хела
  rationale: Личное имя передано транслитерацией с учетом русского библейского именословия и еврейской формы.
- source_word: צֶרֶת
  choice: Церет
  rationale: Имя транслитерировано; начальная צ передана через «ц», конечная ת — через «т».
- source_word: יצחר
  choice: Ицхар
  rationale: Кетив WLC יצחר передан непосредственно как «Ицхар», без молчаливого исправления к иной форме имени.
- source_word: וְ/אֶתְנָן
  choice: и Этнан
  rationale: Префиксальный союз передан как «и», а имя — транслитерацией.
