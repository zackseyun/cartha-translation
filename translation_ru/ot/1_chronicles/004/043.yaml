base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: ru
  text: И они поразили остаток уцелевших амаликитян[a] и жили там до сего дня.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «уцелевший остаток амаликитян». В еврейском тексте соединены два близких по смыслу обозначения тех, кто остался после разгрома.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и поселились там». Глагол может означать как проживание, так и поселение в определённом месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: поразили
  rationale: Глагол נכה в военном контексте означает нанесение поражения, обычно со смертельным исходом; «поразили» сохраняет этот смысл, не усиливая его до однозначного «перебили».
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: остаток уцелевших
  rationale: Переданы оба близких по значению существительных, подчёркивающих, что речь идёт о людях, оставшихся после прежнего разгрома.
- source_word: לַעֲמָלֵק
  choice: амаликитян
  rationale: Имя Амалик здесь обозначает народ; русское название народа естественнее буквального «Амалика» и не меняет смысла.
- source_word: וַיֵּשְׁבוּ
  choice: жили
  rationale: ישב может означать «жить, обитать» или «селиться». «Жили» естественно сочетается с продолжительным выражением «до сего дня», а вариант «поселились» сохранён в примечании.
- source_word: שָׁם
  choice: там
  rationale: Прямо передаёт наречие места, отсылающее к местности, названной в предыдущем стихе.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивое и понятное русское соответствие формуле, обозначающей продолжение положения вещей до времени повествователя.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулой «до сего дня». Синтаксис краток и сохраняет последовательность еврейского повествования; смысловая избыточность выражения שְׁאֵרִית הַפְּלֵטָה намеренно не устранена.
