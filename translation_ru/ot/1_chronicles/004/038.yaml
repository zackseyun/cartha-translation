  text: Эти люди[a], названные поимённо, были главами своих родов, а их отчий дом[b] чрезвычайно разросся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Эти, пришедшие по именам». Еврейское причастие буквально означает «приходящие», но в данном родословном контексте, вероятно, относится к людям, внесённым поимённо в запись.'
