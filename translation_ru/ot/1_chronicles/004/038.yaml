    text: 'Буквально: «дом их отцов». Это выражение обозначает родовую линию или объединение потомков общего предка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Эти люди
  rationale: Указательное местоимение вводит группу мужчин из предшествующего родословного перечня; добавление «люди» делает русскую фразу естественной, не меняя смысла.
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: названные поимённо
  rationale: Причастие от בוא буквально означает «приходящие», однако в сочетании с «по именам» в контексте родословия, вероятно, указывает на людей, внесённых в перечень или обозначенных по имени. Перевод передаёт контекстуальный смысл, а буквальная возможность отмечена в сноске.
- source_word: נְשִׂיאִים
  choice: главами
  rationale: Слово обозначает признанных руководителей родовых объединений. «Главы» естественно сочетается с «родами» и не вносит монархического оттенка слова «князья».
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: своих родов
  rationale: В родословном контексте מִשְׁפָּחָה означает более широкую родственную группу, а не только современную малую семью.
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: дома их предков
  rationale: Выражение обозначает родовые линии или большие патрилинейные объединения. Такой перевод сохраняет образ «дома» и остаётся понятным современному читателю.
- source_word: פָּרְצוּ לָרֹב
  choice: чрезвычайно разрослись
  rationale: Глагол передаёт образ бурного распространения или роста, а לָרֹב указывает на большую численность. «Чрезвычайно разрослись» сохраняет динамику и смысл значительного умножения.
