base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: ru
  text: 'Иавис пользовался большим почётом, чем его братья, и мать назвала его Иависом[a], сказав: «Ведь я родила его в муках[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском произношении имя Иавис созвучно слову, обозначающему боль или скорбь.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я родила его в скорби». Еврейское слово עֹצֶב может означать боль, скорбь или тяготу.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: был / пользовался
  rationale: Глагольная форма вводит повествовательное сообщение; отдельный временной маркер вроде «теперь» в русском не требуется.
- source_word: יַעְבֵּץ
  choice: Иавис
  rationale: Использована укоренившаяся в русской библейской традиции форма имени; примечание поясняет слышимую в еврейском оригинале игру слов.
- source_word: נִכְבָּד מֵאֶחָיו
  choice: пользовался большим почётом, чем его братья
  rationale: נִכְבָּד передаёт значение почитаемого, уважаемого или выдающегося человека, а מִן выражает сравнение. Такая формулировка естественна по-русски и не сводит смысл только к нравственному качеству «почтеннее».
- source_word: וְאִמּוֹ קָרְאָה שְׁמוֹ
  choice: Мать назвала его
  rationale: Еврейская формула буквально означает «его мать назвала его имя»; современная русская формула именования передаёт тот же смысл без неестественной кальки.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Деепричастие естественно вводит слова матери, объясняющие имя.
- source_word: כִּי
  choice: Я родила
  rationale: Причинное значение כִּי ясно из самой реплики и связи с именованием; в русском отдельное «потому что» внутри самостоятельной цитаты звучало бы обрывочно, поэтому причинная связь сохранена контекстом.
- source_word: יָלַדְתִּי
  choice: Я родила его
  rationale: Прямо передаёт рождение ребёнка; местоимение «его» явно выражает подразумеваемый объект.
- source_word: בְּעֹצֶב
  choice: в муках
  rationale: В контексте родов выражение естественно указывает на боль; множественное «в муках» идиоматично по-русски, при этом более широкий оттенок скорби отмечен в сноске.
