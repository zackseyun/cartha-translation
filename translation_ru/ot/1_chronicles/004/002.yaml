  yaml_path: translation/ot/1_chronicles/004/002.yaml
  text: Reaiah son of Shobal fathered Jahath[a], and Jahath fathered Ahumai and Lahad. These were the clans of the Zorathites.
translation:
  language: ru
  text: Реая, сын Шовала, стал отцом Яхата, а Яхат стал отцом Ахумая и Лахада. Это роды[a] жителей Цоры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семейства». Еврейское слово обозначает расширенные родственные группы, а не только отдельные семьи в современном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאָיָה
  choice: Реая
  rationale: Личное имя передано транслитерацией с еврейского, без опоры на традиционные формы, восходящие к языкам-посредникам.
- source_word: בֶן שׁוֹבָל
  choice: сын Шовала
  rationale: Сохранена обычная формула родословия; בֶן может иметь более широкое значение потомка, но здесь нет достаточных оснований заменять прямое «сын».
- source_word: הוֹלִיד / הֹלִיד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד в родословиях обозначает рождение потомка со стороны отца. Эта формулировка естественна в современном русском и не столь архаична, как «родил» применительно к мужчине.
- source_word: יַחַת
  choice: Иахат
  rationale: Имя транслитерировано непосредственно с еврейского текста.
- source_word: אֲחוּמַי
  choice: Ахумай
  rationale: Имя транслитерировано непосредственно с еврейского текста.
- source_word: לָהַד
  choice: Лахад
  rationale: Имя транслитерировано непосредственно с еврейского текста с сохранением согласных ח и ד.
- source_word: אֵלֶּה מִשְׁפְּחֹות
  choice: От них произошли роды
  rationale: Буквальное «это роды» по-русски не вполне ясно связывает названных лиц с последующими родственными группами; выбранная формулировка естественно выражает подразумеваемую генеалогическую связь.
- source_word: הַצָּרְעָתִי
  choice: цорян
  rationale: Еврейское обозначение принадлежности связано с Цорой и здесь имеет собирательное значение — люди или родовые группы Цоры.
