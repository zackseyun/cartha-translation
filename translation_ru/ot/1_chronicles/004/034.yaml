  yaml_path: translation/ot/1_chronicles/004/034.yaml
  text: and Meshobab[a], and Jamlech, and Joshah son of Amaziah.
translation:
  language: ru
  text: и Мешовав, и Ямлех, и Йоша, сын Амасии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: Мешовав
  rationale: Личное имя передано транслитерацией с древнееврейского; конечная буква bet здесь имеет фрикативное произношение «в».
- source_word: יַמְלֵךְ
  choice: Ямлех
  rationale: Личное имя передано непосредственно с древнееврейского; начальный йод отражён русским «Я», а конечный каф — «х».
- source_word: יוֹשָׁה
  choice: Йоша
  rationale: Личное имя передано непосредственно с древнееврейского; начальный йод сохранён как «Й», без английской посредующей формы с J.
- source_word: בֶּן
  choice: сын
  rationale: Обычное обозначение родства в родословных и перечнях; форма «сын Амасии» естественна для современного русского языка.
- source_word: אֲמַצְיָה
  choice: Амасии
  rationale: Имя Амасия дано в родительном падеже после слова «сын», согласно нормам русского языка.
- source_word: וְ
  choice: и
  rationale: Повторяющийся древнееврейский союз сохранён перед каждым именем, чтобы передать структуру перечня.
