  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: ru
  text: Они были горшечниками и жителями Нетаима и Гедеры[a]; там они жили при царе, на его службе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Они были горшечниками и жили среди насаждений и оград». Еврейские слова, переданные как Нетаим и Гедера, можно понимать либо как названия мест, либо как нарицательные существительные.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Они были
  rationale: Местоимение отсылает к названным ранее людям; в русском языке для естественной именной конструкции добавлена связка прошедшего времени.
- source_word: הַיּוֹצְרִים
  choice: горшечниками
  rationale: В данном контексте причастие от יצר наиболее естественно обозначает ремесленников, формующих глину, то есть горшечников.
- source_word: וְיֹשְׁבֵי
  choice: и жителями
  rationale: Субстантивированное причастие в сопряжённой форме обозначает постоянных жителей названных далее мест.
- source_word: נְטָעִים
  choice: Нетаима
  rationale: В генеалогическо-географическом контексте слово, вероятнее всего, является названием места, хотя возможно и нарицательное значение «насаждения».
- source_word: וּגְדֵרָה
  choice: и Гедеры
  rationale: Параллельно Нетаиму слово, вероятнее всего, передаёт название места; возможность нарицательного значения «ограда» сохранена в примечании.
- source_word: עִם הַמֶּלֶךְ
  choice: при царе
  rationale: Оборот выражает нахождение вместе с царём и в данном контексте подразумевает связь с царской службой; «при царе» естественно передаёт оба оттенка, не делая служебное значение чрезмерно явным.
- source_word: בִּמְלַאכְתּוֹ
  choice: выполняя его работу
  rationale: מְלָאכָה означает работу, занятие или службу; местоименный суффикс относится к царю. Такая передача ясно связывает этих людей с царским трудом или поручением.
- source_word: יָשְׁבוּ שָׁם
  choice: они жили там
  rationale: Форма ישב со словом שָׁם указывает на проживание в том месте; выбран современный и понятный русский оборот.
