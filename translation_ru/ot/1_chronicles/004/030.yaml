- source_word: וּ/בְ/חָרְמָה
  choice: и в Хорме
  rationale: Повторяющаяся конструкция וּ + ב сохранена как «и в». Топоним חָרְמָה передан традиционной русской формой «Хорма» в предложном падеже.
- source_word: וּ/בְ/צִיקְלָג
  choice: и в Циклаге
  rationale: Формула перечня передана последовательно как «и в». Название צִיקְלָג транслитерировано в принятой русской форме «Циклаг» и поставлено в предложный падеж.
