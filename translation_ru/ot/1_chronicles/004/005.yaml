lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: У Ашхура
  rationale: Предлог לְ в сочетании с הָיוּ выражает обладание; по-русски это естественно передаётся конструкцией «у … было». Начальный союз служит связью внутри родословия и не требует отдельного «и» в русском тексте.
- source_word: אֲבִי תְקוֹעַ
  choice: отца Текоа
  rationale: Буквально «отец Текоа». В родословиях אָב может обозначать не только непосредственного отца, но также предка, основателя рода или поселения; буквальная формулировка сохраняет эту широту, пояснённую в сноске.
- source_word: הָיוּ שְׁתֵּי נָשִׁים
  choice: было две жены
  rationale: Еврейская конструкция буквально говорит, что у Ашхура «были две жены»; выбран естественный современный русский порядок слов. По контексту נָשִׁים означает именно жён, а не просто женщин.
- source_word: חֶלְאָה
  choice: Хела
  rationale: Имя передано близко к масоретскому произношению с учётом норм русской библейской транслитерации.
- source_word: וְנַעֲרָה
  choice: и Наара
  rationale: Союз сохранён при перечислении; удвоенная гласная в имени отражает раздельное звучание, обусловленное гортанной ע.
