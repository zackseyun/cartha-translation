base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/033.yaml
  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: ru
  text: 'Все их селения[a], расположенные вокруг этих городов, вплоть до Баала: таковы были места их поселения, и велись их родословные записи[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посёлки»; еврейское слово может также обозначать дворы или огороженные поселения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и они записались по родословиям»; еврейское выражение обозначает регистрацию по происхождению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: их селения
  rationale: חָצֵר может означать двор или огороженное место, а также небольшое зависимое поселение. В перечне населённых мест естественнее всего русское «селения».
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: расположенные вокруг этих городов
  rationale: Передаёт пространственное отношение ясно и естественно для современного русского языка.
- source_word: עַד בָּעַל
  choice: вплоть до Баала
  rationale: עַד обозначает предел распространения территории, а בַּעַל здесь является названием места.
- source_word: זֹאת מוֹשְׁבֹתָם
  choice: вот их места жительства
  rationale: Формально единственное указательное זֹאת имеет итоговую, резюмирующую функцию; «вот» сохраняет её без искусственного согласования по числу. מוֹשָׁב передано как «места жительства» во избежание повтора слова «селения».
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: и они были внесены в родословные списки
  rationale: Форма Hitpael от יחס обозначает причисление или регистрацию по родословию. Пассивная русская конструкция естественно передаёт факт генеалогической записи, не уточняя не выраженного в тексте деятеля.
