  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: ru
  text: У Шимея было шестнадцать сыновей и шесть дочерей, но у его братьев было немного сыновей, и все их роды не достигли численности потомков Иуды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не умножились до численности потомков Иуды».'
    reason: Еврейское עַד выражает достигнутый предел или меру; глагол הִרְבּוּ может быть передан как «умножились», «увеличились числом» или выражением «достигли численности».
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: У Шимея было
  rationale: Предлог לְ при имени в родословной вводит конструкцию обладания; по-русски естественно передать её как «у Шимея было».
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: шестнадцать сыновей и шесть дочерей
  rationale: Числительные поставлены перед существительными согласно нормам современного русского языка; числа и соотношение сохранены точно.
- source_word: וּלְאֶחָיו
  choice: Но у его братьев
  rationale: Формально וְ означает «и», однако здесь союз вводит контраст между многочисленными детьми Шимея и малым числом сыновей у его братьев; «но» ясно передаёт эту связь.
- source_word: אֵין בָּנִים רַבִּים
  choice: было немного сыновей
  rationale: Отрицательная бытийная конструкция означает отсутствие большого числа сыновей. Формулировка «было немного» естественна по-русски и не усиливает смысл до полного отсутствия.
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: и все их роды
  rationale: В родословном контексте מִשְׁפָּחָה обозначает родовую группу или клан, а не только отдельную семью; «роды» соответствует этому значению и регистру.
- source_word: לֹא הִרְבּוּ
  choice: не умножились
  rationale: Глагол רבה в данной форме указывает на увеличение численности. «Не умножились» сохраняет родословно-демографический смысл и библейскую образность.
- source_word: עַד בְּנֵי יְהוּדָה
  choice: настолько, как потомки Иуды
  rationale: עַד выражает достигнутую меру или предел сравнения. בְּנֵי יְהוּדָה здесь обозначает более широкую родовую общность, поэтому «потомки Иуды» точнее по контексту, чем потенциально двусмысленное «сыновья Иуды».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Роды» и «умножились» сохраняют генеалогический характер отрывка, оставаясь понятными обычному читателю.
