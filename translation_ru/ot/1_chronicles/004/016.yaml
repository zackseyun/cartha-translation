base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/016.yaml
  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: ru
  text: 'И сыновья Иегаллелела: Зиф, Зифа, Тирия и Асарел.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Асарел» также может передаваться как «Асареил».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сочетание представляет перечисление потомков; союз וּ передан как «и», чтобы сохранить связь с предшествующей родословной.
- source_word: יְהַלֶּלְאֵל
  choice: Иегаллелела
  rationale: Личное имя передано принятой для русской библейской традиции транслитерацией; окончание родительного падежа добавлено по нормам русского языка после слова «сыновья».
- source_word: זִיף
  choice: Зиф
  rationale: Личное имя транслитерировано с масоретской формы.
- source_word: וְזִיפָה
  choice: Зифа
  rationale: Личное имя транслитерировано; отдельный еврейский союз естественно учтён в русском перечислении.
- source_word: תִּירְיָא
  choice: Тирия
  rationale: Личное имя передано близкой русской транслитерацией масоретского чтения.
- source_word: וַאֲשַׂרְאֵל
  choice: и Асарел
  rationale: Личное имя транслитерировано с масоретской формы; союз передан перед последним членом перечисления.
