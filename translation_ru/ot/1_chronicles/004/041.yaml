source:
  edition: WLC
  text: וַ/יָּבֹ֡אוּ אֵלֶּה֩ הַ/כְּתוּבִ֨ים בְּ/שֵׁמ֜וֹת בִּ/ימֵ֣י יְחִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה וַ/יַּכּ֨וּ אֶת אָהֳלֵי/הֶ֜ם וְ/אֶת ה/מעינים אֲשֶׁ֤ר נִמְצְאוּ שָׁ֨מָּ/ה֙ וַ/יַּחֲרִימֻ/ם֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יֵּשְׁב֖וּ תַּחְתֵּי/הֶ֑ם כִּֽי מִרְעֶ֥ה לְ/צֹאנָ֖/ם שָֽׁם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: ru
  text: Эти люди, записанные поимённо, пришли во дни Езекии, царя Иудеи, разгромили их шатры и меунитян[a], которых нашли там, и предали их заклятию на уничтожение до сего дня. Затем они поселились на их месте, потому что там были пастбища для их стад.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское הַמְּעִינִים — трудная форма. Традиционно её понимают как название народа: «меунитяне»; возможен также смысл «жилища» или «селения».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: записанные поимённо
  rationale: Причастие с בְּשֵׁמוֹת указывает на людей, внесённых по именам в родословный или иной список; русское выражение сохраняет административно-реестровый смысл.
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Обычное повествовательное значение בוא; нейтрально передаёт прибытие названных людей.
- source_word: וַיַּכּוּ
  choice: разгромили
  rationale: В военном контексте נכה обозначает сокрушительное нападение и поражение; выбор передаёт силу действия, не утверждая отдельно, что были убиты поголовно все.
- source_word: אָהֳלֵיהֶם
  choice: их шатры
  rationale: Прямое значение существительного אֹהֶל; «шатры» естественно для полукочевого контекста.
- source_word: המעינים
  choice: меунитян
  rationale: Трудную форму можно понимать как название народа; это традиционное контекстуально уместное прочтение, а предметное толкование сохранено в сноске.
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: которых нашли там
  rationale: При принятом личном понимании «меунитяне» относительное предложение естественно относится к людям.
- source_word: וַיַּחֲרִימֻם
  choice: предали их заклятию на уничтожение
  rationale: Формулировка сохраняет технический смысл חרם — посвящение заклятию, предполагающему уничтожение, — и не сводит его к нейтральному «уничтожили».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: так что их нет до сего дня
  rationale: В данном синтаксическом контексте временная формула поясняет продолжающийся результат уничтожения; добавление «их нет» делает русскую связь ясной, не меняя референции местоимения.
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: поселились на их месте
  rationale: 'תַּחְתֵּי с лицами здесь имеет заместительное значение: занять место прежних жителей.'
- source_word: מִרְעֶה לְצֹאנָם
  choice: пастбища для их стад
  rationale: מִרְעֶה обозначает пастбище или землю для выпаса, а צֹאן охватывает мелкий скот, поэтому «стада» не сужает смысл до одних овец.
theological_decisions:
- issue: Значение וַיַּחֲרִימֻם и חרם
  choice: предали их заклятию на уничтожение
  alternative: полностью уничтожили их; наложили на них заклятие
  rationale: Перевод сохраняет одновременно культово-юридическую идею заклятия и его разрушительный итог, не смягчая насилие и не навязывая конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Во дни» и «до сего дня» поддерживают библейский регистр без чрезмерной архаизации; синтаксис остаётся понятным современному читателю.
