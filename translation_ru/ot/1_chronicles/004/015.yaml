  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: ru
  text: 'И сыновья[a] Халева, сына Иефоннии: Иру, Эла и Наам; сыновья Элы: Кеназ.'
  philosophy: optimal-equivalence
  footnotes:
