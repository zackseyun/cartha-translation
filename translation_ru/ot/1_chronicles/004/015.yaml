    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: В данном родословном перечне בְּנֵי естественнее всего означает непосредственных сыновей; начальный союз ו передан без отдельного «и», поскольку по-русски стих естественно продолжает родословие без него.
- source_word: כָּלֵב
  choice: Халев
  rationale: Традиционная русская библейская передача личного имени.
- source_word: בֶּן יְפֻנֶּה
  choice: сына Иефоннии
  rationale: Родословное уточнение сохранено в приложении; форма «Иефонния» соответствует укоренившейся русской библейской традиции, а родительный падеж требуется синтаксисом.
- source_word: עִירוּ
  choice: Иру
  rationale: Передача личного имени по масоретской огласовке.
- source_word: אֵלָה
  choice: Эла
  rationale: В контексте это личное имя; выбрана ясная современная русская транслитерация, различающая начальное אֵ как «Э».
- source_word: וָנָעַם
  choice: и Наам
  rationale: Масоретская форма указывает на мужское личное имя Наам, а не на Нааму; союз сохранён.
- source_word: וּבְנֵי אֵלָה
  choice: сыновья Элы
  rationale: Сохранено введение следующей ветви родословия; союз ו не воспроизведён отдельно после точки с запятой ради естественного русского синтаксиса.
- source_word: וּקְנַז
  choice: Кеназ
  rationale: Традиционная русская библейская передача личного имени; начальный ו здесь не требует отдельного «и», поскольку назван только один сын.
