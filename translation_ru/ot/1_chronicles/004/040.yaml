  text: וַֽ/יִּמְצְא֤וּ מִרְעֶה֙ שָׁמֵ֣ן וָ/ט֔וֹב וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם וְ/שֹׁקֶ֖טֶת וּ/שְׁלֵוָ֑ה כִּ֣י מִן חָ֔ם הַ/יֹּשְׁבִ֥ים שָׁ֖ם לְ/פָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: ru
  text: Они нашли тучное, хорошее пастбище, а земля была просторной, тихой и спокойной, потому что прежде там жили потомки Хама[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потому что жившие там прежде были от Хама».'
    reason: Сноска сохраняет более буквальное устройство неоднозначной и сжатой еврейской конструкции, тогда как основной текст передаёт её естественным русским выражением происхождения.
lexical_decisions:
- source_word: מִרְעֶה
  choice: пастбище
  rationale: Существительное обозначает место для выпаса; единственное число сохраняет собирательную форму еврейского текста и естественно звучит по-русски.
- source_word: שָׁמֵן
  choice: тучное
  rationale: Буквально «жирное»; применительно к пастбищу означает обильное, плодородное. «Тучное» сохраняет образ и соответствует литературному русскому употреблению.
- source_word: טוֹב
  choice: хорошее
  rationale: Передаёт простое положительное значение прилагательного без смыслового расширения.
- source_word: רַחֲבַת יָדַיִם
  choice: просторной
  rationale: Еврейская идиома, буквально связанная с широтой «рук/сторон», описывает обширную, свободную местность; «просторной» естественно передаёт её смысл.
- source_word: שֹׁקֶטֶת
  choice: тихой
  rationale: Причастие характеризует землю как не тревожимую и пребывающую в покое.
- source_word: שְׁלֵוָה
  choice: спокойной
  rationale: Слово может обозначать покой, безмятежность или безопасность. «Спокойной» сохраняет общий смысл, не добавляя явно ни процветания, ни военной защищённости.
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: потому что прежде там жили потомки Хама
  rationale: Именная конструкция буквально указывает, что прежние жители были «от Хама». Русская формулировка ясно и естественно выражает происхождение, а наречие «прежде» передаёт לְפָנִים.
- source_word: חָם
  choice: Хам
  rationale: Традиционная русская форма библейского личного имени.
theological_decisions:
- issue: Обозначение прежних жителей как происходивших от Хама
  choice: потомки Хама
  alternative: люди из рода Хама; бывшие там жители происходили от Хама
  rationale: Еврейское מִן חָם буквально означает «от Хама» и указывает на происхождение. Слово «потомки» подразумевается, но не выражено отдельной лексемой, поэтому буквальная форма отмечена в сноске без внесения дополнительных этнических или богословских выводов.
translation_notes:
  register: Современный литературный русский язык с ясным, но достоинственным повествовательным строем. Сохранены близкие по смыслу определения «тихой и спокойной», поскольку еврейский текст также ставит рядом два слова о покое земли.
