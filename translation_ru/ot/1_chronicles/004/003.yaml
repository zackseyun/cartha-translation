base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: ru
  text: 'Вот [сыновья] отца Етама[a]: Изреель, Ишма и Идбаш; их сестру звали Гацлелпони.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вот отец Етама: Изреель, Ишма и Идбаш». В еврейском тексте слово «сыновья» не выражено; оно восполнено для связности. В родословиях «отец» может также означать предка, родоначальника или основателя поселения либо рода.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Вводит новую генеалогическую запись естественным для современного русского языка способом; союз ו здесь не обязательно передавать отдельным «и».
- source_word: אֲבִי עֵיטָם
  choice: отца Етама
  rationale: Сохраняет прямое значение еврейского сочетания и не сводит его безоговорочно к «основателю» или «родоначальнику»; более широкий генеалогический смысл отмечен в сноске.
- source_word: יִזְרְעֶאל
  choice: Изреель
  rationale: Традиционная и узнаваемая русская передача еврейского личного имени.
- source_word: וְיִשְׁמָא
  choice: Ишма
  rationale: Прямая русская транслитерация личного имени.
- source_word: וְיִדְבָּשׁ
  choice: и Идбаш
  rationale: Имя транслитерировано, а союз сохранён в завершении перечисления.
- source_word: וְשֵׁם אֲחוֹתָם
  choice: их сестру звали
  rationale: Естественная русская передача буквального оборота «и имя их сестры»; множественное местоимение относится к перечисленным мужчинам.
- source_word: הַצְלֶלְפּוֹנִי
  choice: Гацлелпони
  rationale: Русская транслитерация еврейского женского имени с передачей начального הַ как «Га-».
theological_decisions:
- issue: Не выраженная явно связь перечисленных имён с «отцом Етама»
  choice: «потомки отца Етама»
  alternative: «сыновья отца Етама»
  rationale: В еврейском тексте слово «сыновья» отсутствует. «Потомки» позволяет получить связную русскую фразу, не утверждая более узкое непосредственное отцовство; эллипсис и смысловой диапазон слова «отец» раскрыты в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественно-нейтральной генеалогической формулировкой. Имена переданы в привычной русской библейской форме, где она устоялась; неоднозначность эллиптического еврейского оборота не устранена без пояснения.
