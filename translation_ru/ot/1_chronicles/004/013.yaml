base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/013.yaml
  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: ru
  text: 'Сыновья Кеназа: Отниил и Сераия. Сыновья Отниила: Хатат.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: Сыновья Кеназа
  rationale: Форма множественного числа בֵּן в сопряжённом состоянии передаёт родословную формулу. Начальный союз естественно не выражать по-русски в начале новой родословной строки.
- source_word: עָתְנִיאֵל
  choice: Отниил
  rationale: Традиционная русская передача еврейского личного имени.
- source_word: וּשְׂרָיָה
  choice: и Сераия
  rationale: Личное имя с присоединительным союзом; выбрана традиционная русская библейская форма, соответствующая еврейскому שְׂרָיָה.
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: Сын Отниила
  rationale: Хотя בְנֵי грамматически имеет форму множественного числа, далее назван только Хатат; в естественном русском родословном изложении единственное число избегает ложного ожидания нескольких перечисленных сыновей. Формальная особенность отмечена в сноске.
- source_word: חֲתַת
  choice: Хатат
  rationale: Прямая и традиционно узнаваемая русская транслитерация личного имени.
