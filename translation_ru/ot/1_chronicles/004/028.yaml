  text: Они жили в Беэр-Шеве, Моладе и Хацар-Шуале.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Они жили
  rationale: Форма wayyiqtol множественного числа от ישׁב обозначает проживание в названных местах. «Жили» естественно для современного русского языка и, в отличие от «поселились», не подчёркивает начало заселения.
- source_word: בִּבְאֵר שֶׁבַע
  choice: в Беэр-Шеве
  rationale: Географическое название передано транслитерацией; предложный падеж после «в» оформлен по нормам русского языка.
- source_word: וּמוֹלָדָה
  choice: Моладе
  rationale: Собственное название מוֹלָדָה передано транслитерацией и поставлено в предложный падеж как однородный член при «жили в».
- source_word: וַחֲצַר שׁוּעָל
  choice: Хацар-Шуале
  rationale: Составной топоним передан транслитерацией, сохраняющей согласный состав еврейского названия; дефис делает его структуру ясной русскому читателю.
