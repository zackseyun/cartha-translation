base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: ru
  text: 'Сыновья жены Ходии, сестры Нахама: отец[a] Кеилы, гармитянина, и Эштемоа, маахатянина.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В родословиях слово «отец» может означать не только непосредственного отца, но и предка, родоначальника, основателя поселения или главу рода.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза предельно сжата: после множественного «сыновья» стоит единственное «отец». Поэтому точные связи между названными лицами или родами не вполне ясны; возможно, здесь кратко перечислены родовые отношения.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּבְנֵי
  choice: Сыновья
  rationale: Основное значение — «сыновья»; возможное более широкое значение «потомки» не вводится в основной текст без необходимости.
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: жены Ходии
  rationale: Сопряжённая конструкция прямо обозначает жену Ходии; форма имени передаётся транслитерацией с естественным русским склонением.
- source_word: אֲחוֹת נַחַם
  choice: сестры Нахама
  rationale: Сохраняется прозрачная родственная характеристика жены Ходии.
- source_word: אֲבִי
  choice: отец
  rationale: 'Буквально передаёт еврейское слово и не устраняет намеренно его более широкий генеалогический смысл: родоначальник, основатель или глава рода.'
- source_word: קְעִילָה
  choice: Кеилы
  rationale: Имя передано транслитерацией; текст сам по себе не позволяет уверенно решить, обозначает ли оно человека, род или связанную с ними местность.
- source_word: הַגַּרְמִי
  choice: гармитянин
  rationale: Прилагательное принадлежности передано как родовое или этническое обозначение без уточняющего толкования.
- source_word: וְאֶשְׁתְּמֹעַ
  choice: и Эштемоа
  rationale: Союз и имя сохранены; транслитерация следует еврейской форме.
- source_word: הַמַּעֲכָתִי
  choice: маахатянин
  rationale: Сохранено родовое или этническое обозначение, не сведённое искусственно к непосредственному происхождению от конкретного лица.
theological_decisions:
- issue: Согласование множественного «сыновья» с единственным «отец»
  choice: Сохранить сжатую и неровную конструкцию в основном тексте и пояснить её в сноске.
  alternative: Переформулировать как «среди их сыновей были родоначальник Кеилы… и Эштемоа…» либо связать «отец Кеилы» непосредственно с Нахамом.
  rationale: Еврейский текст синтаксически сжат и допускает несколько способов восстановления подразумеваемых связей. Развёрнутая формулировка выбрала бы одно толкование и скрыла подлинную неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством родословного повествования. Сохранены краткость оригинала, имена собственные и его синтаксическая неоднозначность; пояснения вынесены в сноски.
