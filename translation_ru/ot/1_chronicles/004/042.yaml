  text: וּ/מֵ/הֶ֣ם מִן בְּנֵ֣י שִׁמְע֗וֹן הָלְכוּ֙ לְ/הַ֣ר שֵׂעִ֔יר אֲנָשִׁ֖ים חֲמֵ֣שׁ מֵא֑וֹת וּ/פְלַטְיָ֡ה וּ֠/נְעַרְיָה וּ/רְפָיָ֧ה וְ/עֻזִּיאֵ֛ל בְּנֵ֥י יִשְׁעִ֖י בְּ/רֹאשָֽׁ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: ru
  text: И пятьсот человек из них, из сыновей Симеона, отправились к горе Сеир. Во главе их стояли Пелатия, Неария, Рефаия и Уззиил, сыновья Ишия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у них во главе»; речь идёт о том, что названные сыновья Ишия возглавляли эту группу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: И пятьсот человек из них, из сыновей Симеона
  rationale: Сохраняется частичное значение «из них» и характерное для Летописей родословное обозначение «сыновья Симеона». Числительное перенесено вперёд ради естественного русского порядка слов.
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: отправились к горе Сеир
  rationale: Глагол передан нейтрально, без добавления прямо не выраженного военного оттенка; לְ перед названием горы естественно передаётся как направление «к горе».
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: пятьсот человек
  rationale: Прямая передача численности группы без добавления значения «отряд» или «войско».
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: Пелатия, Неария, Рефаия и Уззиил
  rationale: Имена переданы последовательной русской транслитерацией еврейских форм.
- source_word: בְּנֵי יִשְׁעִי
  choice: сыновья Ишия
  rationale: Сохранено родословное определение четырёх названных мужчин.
- source_word: בְּרֹאשָׁם
  choice: Во главе их стояли
  rationale: Естественная русская передача еврейской идиомы «у их головы / во главе их», обозначающей руководство группой.
