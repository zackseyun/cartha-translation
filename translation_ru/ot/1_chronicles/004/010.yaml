source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: ru
  text: 'И воззвал Иавис к Богу Израиля: «О, если бы Ты поистине благословил меня, расширил мои пределы, и рука Твоя была со мной, и Ты уберёг меня от беды[a], чтобы я не испытывал боли![b]» И Бог исполнил то, о чём он просил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от зла». Еврейское רָעָה может означать как нравственное зло, так и бедствие или несчастье; здесь связь с последующей просьбой не испытывать боли говорит в пользу значения «беда».'
    reason: lexical_alternative
  - marker: b
    text: Слова «чтобы я не испытывал боли» перекликаются с объяснением имени Иависа в предыдущем стихе (4:9).
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: воззвал
  rationale: В контексте молитвы глагол означает обращение к Богу с призывом или просьбой; «воззвал» точно и естественно передаёт этот смысл в библейском повествовательном регистре.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: к Богу Израиля
  rationale: Прямая передача еврейской сопряжённой конструкции, обозначающей Бога, Которому принадлежит и поклоняется Израиль.
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: О, если бы Ты поистине благословил меня
  rationale: Частица אִם вводит эмоционально напряжённое пожелание, а сочетание абсолютного инфинитива с личной формой глагола усиливает просьбу. «Поистине» сохраняет усиление без тяжеловесной буквальности.
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: расширил мои пределы
  rationale: גְּבוּל обозначает границу, предел или ограниченную ими территорию. «Расширил мои пределы» сохраняет пространственный смысл и не превращает просьбу в современную метафору влияния.
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: и рука Твоя была со мной
  rationale: Сохранён еврейский образ руки Бога как Его действенной силы и помощи; в составе пожелания русская форма «была» естественно выражает просительное значение.
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: и Ты уберёг меня от беды
  rationale: Еврейское выражение сжато и синтаксически трудно. По связи с последующей просьбой не испытывать боли речь, вероятнее всего, идёт о защите от бедствия или вреда; добавленное «меня» ясно выражает подразумеваемый объект.
- source_word: לְבִלְתִּי עָצְבִּי
  choice: чтобы я не испытывал боли
  rationale: Фраза выражает цель — избежать боли или страдания — и перекликается с объяснением имени Иависа в предыдущем стихе. Перевод сохраняет эту связь и наиболее естественно понимает суффикс первого лица.
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: И Бог исполнил то, о чём он просил
  rationale: Конструкция с בוא в каузативном смысле означает, что Бог осуществил просимое. «Исполнил» передаёт идиому естественным современным русским языком.
theological_decisions:
- issue: Характер просьбы о расширении גְּבוּל
  choice: 'Сохранён обычный территориально-пространственный смысл: «расширил мои пределы».'
  alternative: «Расширил сферу моего влияния».
  rationale: Еврейское слово прежде всего означает границу или территорию. Выбранный перевод не навязывает тексту ни отвлечённой метафоры, ни современных представлений о гарантированном материальном процветании.
- issue: Значение רָעָה в молитве
  choice: В основном тексте переведено как «беда».
  alternative: «Зло».
  rationale: В сочетании с просьбой не испытывать боли слово, вероятнее всего, обозначает бедствие, несчастье или вред. Возможное нравственное значение «зло» сохранено в примечании.
- issue: Форма просьбы с אִם без явно выраженного следствия
  choice: 'Передана как горячее пожелание: «О, если бы…»'
  alternative: Условное «Если Ты…» с подразумеваемым, но не выраженным следствием.
  rationale: Еврейская конструкция остаётся формально незавершённой и эмоционально выразительной. Русское «О, если бы» естественно передаёт молитвенное пожелание, не добавляя отсутствующего в тексте обещания или условия сделки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Традиционная форма имени «Иавис» сохранена. Местоимения, обращённые к Богу, написаны с прописной буквы согласно принятой русской библейской традиции; синтаксис остаётся ясным для современного читателя.
