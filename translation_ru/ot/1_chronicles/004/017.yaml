base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: ru
  text: 'Сыновья Эзры: Иефер, Меред, Ефер и Иалон[a]. Она зачала Мариам, Шаммая и Ишбаха[b], отца Ештемоа[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «И сын Эзры». Поскольку далее следует несколько имён, выражение обычно понимают собирательно: «сыновья Эзры».'
    reason: textual_variant
  - marker: b
    text: 'В еврейском тексте сказано лишь: «она зачала»; кто именно эта женщина, в данном предложении не указано.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «основателя Ештемоа», если Ештемоа — название рода или поселения, а не имя человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Сыновья
  rationale: В еврейском тексте стоит форма единственного числа «сын», однако далее перечислены несколько имён. Коллективное понимание как заголовка родословного перечня лучше соответствует ближайшему контексту; буквальная форма отмечена в сноске.
- source_word: עֶזְרָה
  choice: Эзры
  rationale: Личное имя передано принятой русской библейской формой в родительном падеже.
- source_word: יֶתֶר
  choice: Иефер
  rationale: Личное имя транслитерировано в соответствии с русской библейской традицией.
- source_word: וּמֶרֶד
  choice: Меред
  rationale: Личное имя транслитерировано.
- source_word: וְעֵפֶר
  choice: Ефер
  rationale: Личное имя транслитерировано с сохранением отличия от Иефера.
- source_word: וְיָלוֹן
  choice: Иалон
  rationale: Личное имя транслитерировано в форме, естественной для русской библейской ономастики.
- source_word: וַתַּהַר
  choice: Она зачала
  rationale: Глагол הרה означает «зачать, забеременеть». Прямой перевод сохраняет женский субъект, не названный в данном предложении, и не подменяет зачатие рождением.
- source_word: מִרְיָם
  choice: Мариам
  rationale: Имя воспроизведено как написано в родословном перечне, без вывода о поле носителя.
- source_word: שַׁמַּי
  choice: Шаммая
  rationale: Личное имя транслитерировано и поставлено в винительный падеж.
- source_word: יִשְׁבָּח
  choice: Ишбаха
  rationale: Личное имя транслитерировано и поставлено в винительный падеж.
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: отца Ештемоа
  rationale: Формальное значение אָב — «отец». В родословиях слово может также обозначать родоначальника или основателя рода либо поселения; эта возможность сохранена в сноске.
theological_decisions: []
