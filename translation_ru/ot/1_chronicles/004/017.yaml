  source_fidelity: Русский текст точно передаёт генеалогический перечень. Коллективное «Сыновья Эзры» обоснованно при множественном списке имён, а примечание корректно сохраняет примечательную форму единственного числа в еврейском тексте. «Она зачала» верно передаёт женский субъект и значение וַתַּהַר, не называя женщину вопреки источнику. «Отца Ештемоа» формально соответствует אֲבִי אֶשְׁתְּמֹעַ; альтернативное понимание как основателя приведено без чрезмерной интерпретации.
