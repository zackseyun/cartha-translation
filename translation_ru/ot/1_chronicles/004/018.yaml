base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: ru
  text: А его жена, иудеянка[a], родила Иереда, отца Гедора[b], Хевера, отца Сохо, и Иекутиэля, отца Заноаха. Это сыновья Бифьи, дочери фараона[c], которую Меред взял в жёны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иудейка»; возможно также: «женщина из Иудеи».'
    reason: lexical_alternative
  - marker: b
    text: Слово «отец» в книгах Паралипоменон может также означать основателя, предка или главу рода, связанного с данным местом. То же относится к последующим выражениям «отец Сохо» и «отец Заноаха».
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст здесь труден: неясно, является ли названная в начале жена-иудеянка Бифьей, дочерью фараона, или речь идёт о разных жёнах Мереда.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: жена-иудеянка
  rationale: Женская форма этнонима указывает на иудеянку; сочетание с «его жена» естественно передаёт конструкцию и сохраняет этническое обозначение.
- source_word: יָלְדָה
  choice: родила
  rationale: Обычная и ясная русская формула для родословия.
- source_word: אֲבִי
  choice: отец
  rationale: Формально сохраняет еврейскую идиому, которая здесь может также обозначать основателя, предка или главу рода, связанного с местностью.
- source_word: שׂוֹכוֹ
  choice: Сохо
  rationale: Передача еврейского топонима שׂוֹכוֹ в принятой русской библейской форме.
- source_word: יְקוּתִיאֵל
  choice: Иекутиэль
  rationale: Транслитерация личного имени в соответствии с русской библейской традицией.
- source_word: זָנוֹחַ
  choice: Заноах
  rationale: Близкая к еврейской форме передача топонима.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Еврейский текст прямо употребляет слово «сыновья»; более широкое «потомки» без необходимости не вводится.
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: Бифьи, дочери фараона
  rationale: Прямо и естественно передаёт приложение и родственную связь.
- source_word: לָקַח
  choice: взял в жёны
  rationale: В брачном контексте לקח означает взять женщину в жёны; русский оборот ясен и близок источнику.
- source_word: וְאֵלֶּה
  choice: Это
  rationale: Естественное русское введение итогового отождествления; начальный союз не обязателен для передачи смысла.
theological_decisions:
- issue: Соотношение «его жены-иудеянки» и Бифьи, дочери фараона
  choice: Сохранить последовательность и неоднозначность еврейского текста, не отождествляя и не разделяя женщин прямо в переводе.
  alternative: Явно представить Бифью либо той же самой женщиной, либо другой женой Мереда.
  rationale: Синтаксис стиха труден и допускает разные понимания. Перевод не должен устранять генеалогическое напряжение, которого не разрешает сам еврейский текст.
translation_notes:
  register: Современный литературный русский язык с достоинством родословного повествования. Имена переданы в узнаваемых русских библейских формах или близкой транслитерации; синтаксическая неоднозначность источника сохранена.
