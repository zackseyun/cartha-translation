  yaml_path: translation/ot/1_chronicles/004/001.yaml
  text: 'The sons of Judah: Perez[a], Hezron, Carmi, Hur, and Shobal.'
translation:
  language: ru
  text: 'Сыновья Иуды[a]: Перец, Хецрон, Карми, Хур и Шовал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «сыновья» в родословиях может обозначать как непосредственных сыновей, так и потомков вообще.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Прямое соответствие форме множественного числа в сопряжённом состоянии от בֵּן. В родословиях слово может обозначать не только непосредственных сыновей, но и более дальних потомков; это отмечено в сноске.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Устоявшаяся русская библейская форма имени патриарха и названия колена.
- source_word: פֶּרֶץ
  choice: Перец
  rationale: Передача еврейского имени в современной русской библейской форме, близкой к исходному звучанию.
- source_word: חֶצְרוֹן
  choice: Хецрон
  rationale: Транслитерация еврейского собственного имени с сохранением начального ח как «х».
- source_word: כַרְמִי
  choice: Карми
  rationale: Прямая транслитерация еврейского собственного имени.
- source_word: חוּר
  choice: Хур
  rationale: Прямая транслитерация еврейского собственного имени.
- source_word: שׁוֹבָל
  choice: Шовал
  rationale: Транслитерация еврейского имени с передачей שׁ как «ш» и ב как «в» в данной позиции.
- source_word: וְ
  choice: запятые и заключительное «и»
  rationale: 'Повторяющийся еврейский союз оформлен как естественный для русского языка перечень: запятые между именами и «и» перед последним.'
theological_decisions:
- issue: Степень родства перечисленных лиц с Иудой
  choice: Сохранить буквальное «сыновья», пояснив его широкий родословный смысл в сноске
  alternative: «Потомки Иуды»
  rationale: Исходный текст употребляет בְּנֵי, однако перечисление охватывает родословные линии, а не обязательно только непосредственных сыновей. Сноска сохраняет и форму текста, и его генеалогическую гибкость.
translation_notes:
  register: Краткий родословный перечень передан современным литературным русским языком. Сохранены традиционные русские формы «Иуда» и «Хур»; остальные имена переданы близко к еврейскому тексту. Маркер сноски поставлен после первого имени, как в консультационном слое, хотя пояснение относится ко всему заголовочному слову «сыновья».
