  naturalness: Фраза краткая, понятная и соответствует современному литературному русскому в контексте родословия. «Был отцом» избегает архаичного «родил» и не делает сильнее, чем требуется, характер генеалогической связи.
  terminology: '«Роды» удачно передаёт מִשְׁפָּחוֹת как коллективные семейно-родовые группы. Имена последовательно транслитерированы: Коц, Анув, Хаццовева/Хаццовевы, Ахархел, Харум. Альтернатива в сноске и её привязка к имени сохранены.'
