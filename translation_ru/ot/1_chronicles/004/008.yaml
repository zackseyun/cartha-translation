  text: וְ/ק֣וֹץ הוֹלִ֔יד אֶת עָנ֖וּב וְ/אֶת הַ/צֹּבֵבָ֑ה וּ/מִשְׁפְּח֥וֹת אֲחַרְחֵ֖ל בֶּן הָרֽוּם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/008.yaml
  text: Koz fathered Anub[a], Hazzobebah[b], and the families of Aharhel son of Harum.
translation:
  language: ru
  text: Коц был отцом Анува, Хаццовевы[a] и родов[b] Ахархела, сына Харума.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Цовевы», если начальный артикль не передавать как часть имени.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «семейств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹץ
  choice: Коц
  rationale: Имя передано непосредственно по еврейской согласной форме; определённого артикля, который дал бы форму «Хаккоц», здесь нет.
- source_word: הוֹלִ֔יד
  choice: был отцом
  rationale: В родословном контексте порода hифиль глагола ילד обозначает отцовство или происхождение. Формулировка естественна для современного русского языка и не обязательно сужает связь до непосредственного рождения.
- source_word: עָנ֖וּב
  choice: Анув
  rationale: Транслитерация собственного имени с учётом масоретского произношения конечной буквы ב без дагеша.
- source_word: הַ/צֹּבֵבָ֑ה
  choice: Хаццовева
  rationale: Передача собственного имени вместе с присоединённым еврейским артиклем הַ и удвоением צ; спирантное ב передано как «в».
- source_word: וּ/מִשְׁפְּח֥וֹת
  choice: и родов
  rationale: В родословии מִשְׁפָּחוֹת означает семейно-родовые объединения; «роды» звучит естественно и сохраняет коллективный смысл.
- source_word: אֲחַרְחֵ֖ל
  choice: Ахарел
  rationale: Собственное имя передано по масоретской форме; сочетание ח передано через «х» без искусственного удвоения.
- source_word: בֶּן
  choice: сына
  rationale: Обычное обозначение родственной связи; падеж согласован с конструкцией «родов Ахархела».
- source_word: הָרֽוּם
  choice: Харум
  rationale: Транслитерация соответствует масоретской огласовке; вариант «Харам» ей не соответствует.
theological_decisions: []
