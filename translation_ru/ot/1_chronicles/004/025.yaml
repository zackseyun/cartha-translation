  text: Shallum his son, Mibsam his son, Mishma his son.
translation:
  language: ru
  text: Шаллум, его сын; Мивсам, его сын; Мишма, его сын.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלֻּם
  choice: Шаллум
  rationale: Личное имя передано транслитерацией в форме, соответствующей современной русской библейской традиции и удвоению согласного в еврейском тексте.
- source_word: בְּנוֹ
  choice: его сын
  rationale: Существительное בֵּן с суффиксом 3-го лица мужского рода единственного числа буквально означает «его сын»; повтор формулы передаёт последовательность родства в родословии.
- source_word: מִבְשָׂם
  choice: Мивсам
  rationale: Личное имя транслитерировано; еврейская буква ב без дагеша передана как «в» согласно принятой русской библейской традиции.
- source_word: מִשְׁמָע
  choice: Мишма
  rationale: Личное имя передано транслитерацией; конечная ע отдельно не отражена, что соответствует естественной русской передаче имени.
