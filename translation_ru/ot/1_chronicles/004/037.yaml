  text: וְ/זִיזָ֨א בֶן שִׁפְעִ֧י בֶן אַלּ֛וֹן בֶּן יְדָיָ֥ה בֶן שִׁמְרִ֖י בֶּן שְׁמַֽעְיָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/037.yaml
  text: and Ziza son of Shiphi[a], son of Allon, son of Jedaiah, son of Shimri, son of Shemaiah.
translation:
  language: ru
  text: и Зиза, сын Шифея, сына Аллона, сына Иедаии, сына Шимрия, сына Шемаии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזִיזָא
  choice: и Зиза
  rationale: Союз וְ передан словом «и», поскольку он продолжает перечень. Личное имя זִיזָא транслитерировано как «Зиза»; конечная א не требует отдельного обозначения в русском написании.
- source_word: בֶן
  choice: сын / сына
  rationale: 'Генеалогическая формула передана словом «сын». В последующих звеньях использован родительный падеж «сына», чтобы по-русски ясно показать последовательную цепочку предков: Зиза — сын Шифия, Шифий — сын Аллона и далее.'
- source_word: שִׁפְעִי
  choice: Шифий / Шифия
  rationale: Личное имя транслитерировано в форме «Шифий»; в стихе оно закономерно стоит в родительном падеже «Шифия».
- source_word: אַלּוֹן
  choice: Аллон / Аллона
  rationale: В данном контексте это личное имя, поэтому оно транслитерировано, а не переведено как название дерева. Удвоение ל отражено удвоенной «л».
- source_word: יְדָיָה
  choice: Иедаия / Иедаии
  rationale: Имя передано принятой русской библейской формой «Иедаия»; в генеалогической конструкции употреблён родительный падеж «Иедаии».
- source_word: שִׁמְרִי
  choice: Шимрий / Шимрия
  rationale: Начальная שׁ передана сочетанием «ш»; русская именная форма «Шимрий» в стихе склоняется как «Шимрия».
- source_word: שְׁמַעְיָה
  choice: Шемаия / Шемаии
  rationale: Имя транслитерировано в узнаваемой русской библейской форме «Шемаия» и поставлено в требуемый родительный падеж «Шемаии».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением краткой генеалогической структуры оригинала. Повторение «сына» удерживает все звенья родословной и устраняет возможное впечатление, будто все перечисленные лица являются непосредственными сыновьями одного человека.
