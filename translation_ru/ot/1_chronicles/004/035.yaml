  rationale: Соединительный союз связывает имена с предшествующим перечнем и сохраняет последовательную структуру родословия.
- source_word: יוֹאֵל
  choice: Иоиль
  rationale: Личное имя передано в традиционной русской библейской форме, близкой к еврейскому звучанию.
- source_word: יֵהוּא
  choice: Ииуй
  rationale: Личное имя передано в принятой русской библейской форме; она обеспечивает узнаваемость и соответствует современному литературному употреблению библейских имён.
- source_word: בֶּן
  choice: сын / сына
  rationale: Еврейское обозначение родства передано буквально; падежные формы «сын» и «сына» естественно выражают вложенную генеалогическую цепочку по-русски.
- source_word: יֹשִׁבְיָה
  choice: Иошивия
  rationale: Личное имя транслитерировано с сохранением основных согласных и естественным для русского языка окончанием; в тексте употреблена родительная форма «Иошивии».
- source_word: שְׂרָיָה
  choice: Сераия
  rationale: Личное имя передано в узнаваемой русской библейской форме; в тексте употреблена родительная форма «Сераии».
- source_word: עֲשִׂיאֵל
  choice: Асиэл
  rationale: Личное имя транслитерировано близко к еврейской форме; в тексте употреблена родительная форма «Асиэла».
