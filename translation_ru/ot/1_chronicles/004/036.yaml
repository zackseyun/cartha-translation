lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: Елиоэнай
  rationale: Личное имя передано русской библейской формой, близкой к еврейскому звучанию.
- source_word: יַעֲקֹבָה
  choice: Иаакова
  rationale: Личное имя транслитерировано с сохранением конечного -а; форма соответствует русской библейской традиции.
- source_word: יְשׁוֹחָיָה
  choice: Ишохаия
  rationale: Редкое личное имя передано непосредственно с еврейского, сохраняя начальный йод и элемент -ия.
- source_word: עֲשָׂיָה
  choice: Асаия
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: עֲדִיאֵל
  choice: Адиил
  rationale: Личное имя передано принятой русской библейской формой с отражением теофорного элемента -эл.
- source_word: יְשִׂימִיאֵל
  choice: Иесимиил
  rationale: Редкое личное имя передано традиционной русской библейской формой.
- source_word: בְּנָיָה
  choice: Ванея
  rationale: Выбрана широко узнаваемая традиционная русская библейская форма этого имени.
- source_word: וְ / וַ / וִ / וּ
  choice: и
  rationale: Повтор союза перед каждым именем сохраняет многосоюзие и ритм еврейского перечня.
