  source_fidelity: 'Текст точно передаёт וּבְנֵי как «И сыновья», сохраняет генеалогическую конструкцию и повторяющееся בְּנוֹ («его сын») как последовательность прямого происхождения. Имена переданы близко к масоретской форме: Мишма, Хаммуил, Заккур, Шимей. Английский audit trail также поддерживает эту структуру и данные соответствия.'
