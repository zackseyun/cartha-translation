  text: וּ/בְנֵ֖י מִשְׁמָ֑ע חַמּוּאֵ֥ל בְּנ֛/וֹ זַכּ֥וּר בְּנ֖/וֹ שִׁמְעִ֥י בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: ru
  text: 'И сыновья Мишмы: Хаммуил, его сын; Заккур, его сын; Шимей, его сын.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: И сыновья
  rationale: Сохраняется соединительный союз וּ и обычное генеалогическое значение конструктивной формы множественного числа בְּנֵי — «сыновья».
- source_word: מִשְׁמָע
  choice: Мишма
  rationale: Личное имя передано транслитерацией с учетом еврейской формы и сложившейся русской библейской традиции.
- source_word: חַמּוּאֵל
  choice: Хаммуил
  rationale: Транслитерация личного имени; удвоение согласного отражено, а элемент אֵל передан привычным для русского библейского именослова окончанием «-ил».
- source_word: בְּנוֹ
  choice: его сын
  rationale: Буквально передает существительное «сын» с местоименным суффиксом 3-го лица мужского рода; повтор сохраняет структуру родословной и прямую последовательность поколений.
- source_word: זַכּוּר
  choice: Заккур
  rationale: Транслитерация личного имени с отражением удвоенного каф.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Использована естественная русская передача еврейского личного имени, соответствующая его масоретской огласовке.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного, перечислительного строя древнееврейской родословной. Точки с запятой ясно показывают последовательность поколений и не превращают имена после Мишмы в перечень его непосредственных сыновей.
