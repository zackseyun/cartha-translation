  text: and in Beth-marcaboth[a], and in Hazar-susim, and in Beth-biri, and in Shaaraim[d][c][b]. These were their cities until David reigned.
translation:
  language: ru
  text: и в Бет-Маркавоте[a], в Хацар-Сусиме[b], в Бет-Бири[c] и в Шаараиме[d]. Это были их города до воцарения Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Бет-Маркавот» буквально означает «Дом колесниц».
    reason: lexical_alternative
  - marker: b
    text: Название «Хацар-Сусим» можно буквально передать как «Двор коней» или «Селение коней».
    reason: lexical_alternative
  - marker: c
    text: Название «Бет-Бири» также может передаваться как «Бет-Биреи».
    reason: alternative_reading
  - marker: d
    text: Название «Шаараим», возможно, этимологически означает «Двое ворот».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/בֵית מַרְכָּבוֹת
  choice: и в Бет-Маркавофе
  rationale: В перечне поселений выражение выступает как географическое название, поэтому оно передано транслитерацией, а не переводом составляющих.
- source_word: וּ/בַ/חֲצַר סוּסִים
  choice: в Хацар-Сусиме
  rationale: Контекст указывает на топоним; форма передана русской библейской транслитерацией, а буквальное значение отмечено в сноске.
- source_word: וּ/בְ/בֵית בִּרְאִי
  choice: в Бет-Бири
  rationale: Название передано как топоним; масоретская огласовка поддерживает форму «Бири».
- source_word: וּֽ/בְ/שַׁעֲרָיִם
  choice: в Шаараиме
  rationale: Это название поселения; возможное этимологическое значение не подменяет топоним в основном тексте.
- source_word: עָרֵי/הֶם
  choice: Это были их города
  rationale: עִיר допускает значения «город» и «поселение»; «города» прямо передаёт слово и соответствует стилю территориального перечня.
- source_word: עַד מְלֹךְ דָּוִיד
  choice: до воцарения Давида
  rationale: Конструкция с עַד и инфинитивом задаёт временной предел. «До воцарения Давида» естественно по-русски и сохраняет связь с началом его царствования.
