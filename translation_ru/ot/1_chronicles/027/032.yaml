base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: ru
  text: Ионафан, дядя Давида, был советником, разумным человеком и писцом; а Иехиил, сын Хахмони, был с сыновьями царя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «был с сыновьями царя». Возможно, имеется в виду служение при них или надзор за ними, но их отношения в еврейском тексте не уточняются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: дядя
  rationale: В данном придворно-родословном контексте слово естественнее всего обозначает родственную связь; «дядя» — его обычное контекстуальное значение.
- source_word: יוֹעֵץ
  choice: советник
  rationale: Причастная форма обозначает человека, дающего советы, вероятно в официальной придворной роли.
- source_word: אִישׁ מֵבִין
  choice: человек проницательный
  rationale: Передаёт способность понимать и верно судить, сохраняя похвальную характеристику Ионафана и звуча естественно по-русски.
- source_word: סוֹפֵר
  choice: писец
  rationale: Слово может обозначать грамотного придворного служащего или секретаря; «писец» сохраняет широту значения и не уточняет должность сверх текста.
- source_word: עִם
  choice: был с
  rationale: Буквальное значение предлога — «с». Текст не называет прямо ни надзора, ни иной служебной функции Иехиила.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: сыновья царя
  rationale: Так прямо сказано в еврейском тексте; перевод не заменяет сыновей более широким обозначением «царевичи».
- source_word: חַכְמוֹנִי
  choice: Хахмони
  rationale: Имя передано русской транслитерацией с сохранением начального ח как «х».
theological_decisions:
- issue: Роль Иехиила при сыновьях царя
  choice: был с сыновьями царя
  alternative: ведал воспитанием царских сыновей / состоял при царевичах
  rationale: Еврейский текст выражает лишь совместное пребывание через עִם и не уточняет, был ли Иехиил наставником, надзирателем или спутником; неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохраняет перечисление придворных качеств и должностей, а формулировка о роли Иехиила намеренно не конкретизирована.
