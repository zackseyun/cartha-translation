  yaml_path: translation/ot/1_chronicles/027/022.yaml
  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: ru
  text: От Дана — Азарел, сын Иерохама. Это вожди[a] племён Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главы» или «начальники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/דָן
  choice: У Дана
  rationale: Предлог ל в перечне вводит название племени, представитель которого назван далее; «У Дана» естественно продолжает структуру административного списка и не добавляет отсутствующее в оригинале слово «племя».
- source_word: עֲזַרְאֵל
  choice: Азарел
  rationale: Имя передано близко к еврейской форме и в соответствии с принятой русской библейской традицией.
- source_word: בֶּן
  choice: сын
  rationale: Конструкция прямо указывает на происхождение по отцу.
- source_word: יְרֹחָם
  choice: Иерохам
  rationale: Традиционная русская библейская передача личного имени, соответствующая еврейскому יְרֹחָם.
- source_word: אֵלֶּה
  choice: Это
  rationale: Указательное местоимение вводит итоговое пояснение к предшествующему перечню; русское «Это» естественно согласуется со сказуемым во множественном числе.
- source_word: שָׂרֵי
  choice: вожди
  rationale: Слово обозначает глав, начальников или руководителей. В контексте племён «вожди» ясно передаёт руководящее положение, не сужая значение до бюрократической должности и не используя исторически нагруженное «князья».
- source_word: שִׁבְטֵי
  choice: племён
  rationale: 'Форма множественного числа в сопряжённом состоянии непосредственно выражает принадлежность: «племён Израиля».'
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Общепринятая русская форма имени; родительный падеж обусловлен синтаксисом выражения «племён Израиля».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичной структурой административного перечня. Тире восполняет отсутствующую в древнееврейском именную связку, не добавляя нового содержания. Термин «вожди» сохраняет широкий смысл שָׂרֵי; альтернативы вынесены в примечание.
