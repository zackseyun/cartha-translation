base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: ru
  text: Начальником третьего отряда на третий месяц был Ванея, сын Иодая, священника, который был главой[a]; в его отряде было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ванея, сын Иодая, главного священника». Буквально: «Ванея, сын Иодая, священника, глава». Не вполне ясно, относится ли слово «глава» к Иодаю, характеризуя его как видного священника, или к Ванее.'
    reason: лексическая и синтаксическая неоднозначность
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: начальником отряда
  rationale: שַׂר обозначает начальника или военачальника; в контексте главы речь идёт о руководителе ежемесячного воинского подразделения. Слово «отряд» естественно восполняет подразумеваемое существительное при порядковом числительном.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: третьего отряда на третий месяц
  rationale: Первое «третий» указывает на порядковый номер подразделения, второе — на месяц. Такое восполнение эллипсиса ясно передаёт повторяющуюся структуру главы.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Ванея, сын Иодая
  rationale: Использованы традиционные русские библейские формы имён, понятные русскоязычному читателю.
- source_word: הַכֹּהֵן רֹאשׁ
  choice: священника, — глава
  rationale: 'Сохранена грамматическая неоднозначность: הַכֹּהֵן естественно связывается с Иодаем, тогда как רֹאשׁ может характеризовать либо Ванею как главу, либо Иодая как видного священника. Основной текст следует наиболее непосредственному членению, не превращая выражение безоговорочно в титул «первосвященник».'
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: в его отряде было
  rationale: מַחֲלֻקָה здесь означает воинское подразделение; формула сообщает его численность. Русская конструкция передаёт функцию фразы естественно.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Число передано буквально; слово «человек» добавлено для естественности и явно выражает подразумеваемый состав воинского отряда.
theological_decisions:
- issue: 'К кому относится רֹאשׁ («глава»): к Ванее или к Иодаю-священнику'
  choice: В основном тексте «глава» отнесено к Ванее, но неоднозначность отмечена сноской.
  alternative: '«Ванея, сын Иодая, главного священника» или более буквально: «Ванея, сын Иодая, священника, глава».'
  rationale: 'Порядок слов допускает разные синтаксические членения. Нельзя безоговорочно вводить титул «первосвященник»: исходный текст содержит הַכֹּהֵן רֹאשׁ, а не обычное выражение для этого титула. Сноска сохраняет реальную неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Традиционные формы имён сохранены; громоздкий буквальный порядок слов сглажен, а существенная неоднозначность вынесена в сноску.
