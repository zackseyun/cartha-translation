base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: ru
  text: После Ахитофела — Иодай, сын Ванеи, и Авиафар[a]; а военачальником у царя был Иоав.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «После Ахитофела — Иодай, сын Ванеи, и Авиафар». В еврейском тексте глагол не выражен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי אֲחִיתֹפֶל
  choice: После Ахитофела
  rationale: Предлог אַחֲרֵי передаёт значение «после». Тире сохраняет бессоюзно-именную структуру еврейской фразы и не уточняет сверх текста характер преемства.
- source_word: יְהוֹיָדָע
  choice: Иодай
  rationale: Традиционная русская форма библейского личного имени.
- source_word: בֶּן בְּנָיָהוּ
  choice: сын Ванеи
  rationale: Обычная передача еврейской патронимической конструкции; имя дано в традиционной русской форме.
- source_word: וְ/אֶבְיָתָר
  choice: и Авиафар
  rationale: Союз связывает Авиафара с Иодаем; имя передано в традиционной русской форме.
- source_word: וְ/שַׂר צָבָא
  choice: а военачальником ... был
  rationale: שַׂר צָבָא обозначает главу или командующего войском. В русском языке связка «был» естественно завершает именную фразу.
- source_word: לַ/מֶּלֶךְ
  choice: у царя
  rationale: Предлог ל выражает отношение службы царю; русское «у царя» естественно обозначает должность при царе, не превращая её в принадлежность.
- source_word: יוֹאָב
  choice: Иоав
  rationale: Традиционная русская форма библейского личного имени.
