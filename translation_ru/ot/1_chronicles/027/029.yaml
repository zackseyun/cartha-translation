base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: ru
  text: За стадами[a], пасшимися в Шароне, отвечал Шитрай из Шарона[b], а за стадами в долинах — Шафат, сын Адлая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крупным рогатым скотом» вместо «стадами».'
    reason: lexical_alternative
  - marker: b
    text: Шарон — приморская равнина в земле Израиля; выражение «из Шарона» указывает, что Шитрай был родом оттуда.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: над … был поставлен
  rationale: В административном перечне עַל обозначает ответственность и надзор. Добавление «был поставлен» естественно передаёт подразумеваемую в еврейской именной конструкции должностную функцию.
- source_word: הַבָּקָר
  choice: стада
  rationale: בקר обозначает крупный рогатый скот, рассматриваемый собирательно. «Стада» естественно в данном хозяйственно-административном контексте; более буквальная альтернатива указана в сноске.
- source_word: הָרֹעִים
  choice: пасшимися
  rationale: Причастие от רעה описывает скот, пасущийся на пастбище. Русское причастие сохраняет определительную связь с «стадами».
- source_word: בַּשָּׁרוֹן
  choice: в Шароне
  rationale: Передано как географическое название области без поясняющего расширения в основном тексте.
- source_word: שטרי
  choice: Шитрай
  rationale: Личное имя транслитерировано с учётом масоретской огласовки.
- source_word: הַשָּׁרוֹנִי
  choice: из Шарона
  rationale: Еврейский нисбе указывает на происхождение или принадлежность к области. В современном русском описательная форма яснее и естественнее искусственного «шаронитянин».
- source_word: בָּעֲמָקִים
  choice: в долинах
  rationale: Прямое соответствие множественному числу עֲמָקִים; сохраняется обобщённое указание на местность.
- source_word: שָׁפָט
  choice: Шафат
  rationale: Личное имя передано транслитерацией с масоретской огласовки.
- source_word: בֶּן עַדְלָי
  choice: сын Адлая
  rationale: Стандартная и прозрачная передача еврейской патронимической конструкции.
