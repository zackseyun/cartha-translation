translation_notes:
  register: Современный литературный русский язык с достоинством административно-летописного повествования. Эллиптическая еврейская конструкция раскрыта оборотом «был поставлен», чтобы ясно выразить управление хозяйством. Маркеры сносок сохранены в основном тексте; их порядок следует месту поясняемых выражений.
