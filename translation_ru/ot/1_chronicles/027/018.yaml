  yaml_path: translation/ot/1_chronicles/027/018.yaml
  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: ru
  text: Над Иудой — Елигу[a], один из братьев Давида; над Иссахаром — Омри, сын Михаила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «Елигу». В некоторых древних переводах и у ряда толкователей — «Елиав»; вероятно, это согласование с именем брата Давида, упомянутого в других местах.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: Над Иудой
  rationale: Префикс ל вводит название колена, за которое отвечал названный далее руководитель. В контексте перечня начальников русское «над Иудой» естественно передаёт административное отношение и сохраняет краткую структуру списка.
- source_word: אֱלִיהוּ
  choice: Елигу
  rationale: Масоретский текст прямо читает אֱלִיהוּ (Елигу). Вариант «Елиав» в ряде древних свидетельств, вероятно, возник как согласование с именем известного брата Давида.
- source_word: מֵאֲחֵי דָוִיד
  choice: один из братьев Давида
  rationale: 'Предлог מִן с формой множественного числа имеет партитивное значение: Елигу был одним из числа братьев Давида.'
- source_word: לְיִשָּׂשכָר
  choice: над Иссахаром
  rationale: Как и в первой части стиха, ל вводит колено, возглавляемое названным представителем.
- source_word: עָמְרִי
  choice: Омри
  rationale: Передача личного имени в принятой русской библейской форме.
- source_word: בֶּן מִיכָאֵל
  choice: сын Михаила
  rationale: Обычная древнееврейская патронимическая конструкция, естественно передаваемая по-русски без дополнительных слов.
