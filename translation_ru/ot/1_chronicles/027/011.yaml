    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: Восьмой
  rationale: Порядковое числительное употреблено эллиптически во главе пункта военного списка; краткость оригинала сохранена без добавления слов «начальник» или «отряд».
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: на восьмой месяц
  rationale: Предлог ל в контексте помесячной службы указывает на назначение на соответствующий месяц; эта формулировка естественна для современного русского языка.
- source_word: סִבְּכַי
  choice: Сивхай
  rationale: Имя передано русской библейской транслитерацией, отражающей еврейскую форму.
- source_word: הַחֻשָׁתִי
  choice: Хушатянин
  rationale: Форма обозначает происхождение или связь с местом либо родом Хуша; передана как этнонимическое определение.
- source_word: לַזַּרְחִי
  choice: из потомков Зераха
  rationale: В данном перечне ל выражает принадлежность; формулировка ясно передаёт родовую связь, вероятно подразумеваемую единичной формой gentilicum.
- source_word: מַחֲלֻקְתּוֹ
  choice: подразделении
  rationale: В военно-административном контексте слово обозначает организованную служебную часть; «подразделение» понятно современному читателю и не задаёт неоправданно точного размера.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: в его подразделении было
  rationale: Буквально конструкция означает «и над его подразделением», после чего названо число; русская идиоматическая формулировка передаёт численность находившейся под его началом части.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Число передано обычной русской формой; «человек» добавлено по смыслу военного списка для естественности и ясности.
