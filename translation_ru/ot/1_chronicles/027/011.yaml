  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: ru
  text: Восьмой, на восьмой месяц, — Сивхай Хушатянин, из потомков Зераха[a]; в его подразделении было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
