  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: ru
  text: над половиной колена Манассии в Галааде — Иддо, сын Захарии; над Вениамином — Иасиил, сын Авенира.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַחֲצִי הַמְנַשֶּׁה
  choice: над половиной колена Манассии
  rationale: 'В контексте перечня племенных начальников предлог לְ обозначает сферу ответственности. Слово «колена» добавлено для естественности и ясности: имеется в виду половина колена Манассии.'
- source_word: גִּלְעָדָה
  choice: в Галааде
  rationale: Форма с направительным окончанием здесь обозначает заиорданскую область, к которой относилась эта половина колена; по-русски контекстуально естественно «в Галааде».
- source_word: יִדּוֹ
  choice: Иддо
  rationale: Передача собственного имени в соответствии с масоретским текстом и принятой русской библейской формой.
- source_word: בֶּן זְכַרְיָהוּ
  choice: сын Захарии
  rationale: Обычная русская передача генеалогической формулы; имя дано в традиционной русской библейской форме.
- source_word: לְבִנְיָמִן
  choice: над Вениамином
  rationale: Предлог לְ в административном перечне указывает на группу, которой руководил названный человек; «над» ясно передаёт подразумеваемое управление.
- source_word: יַעֲשִׂיאֵל
  choice: Иасиил
  rationale: Русская транслитерация имени по масоретской огласовке; оснований для варианта, предложенного в английской сноске, в данном еврейском тексте нет.
- source_word: בֶּן אַבְנֵר
  choice: сын Авенира
  rationale: Стандартная генеалогическая формула и традиционная русская форма имени.
theological_decisions: []
translation_notes:
  register: Краткий, современный и литературный русский язык с сохранением эллиптической структуры административного перечня. Предлог «над» восстанавливает подразумеваемое по контексту руководство и звучит естественнее буквального «для».
