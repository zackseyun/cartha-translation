  text: וְ/עַל הַ/צֹּ֖אן יָזִ֣יז הַֽ/הַגְרִ֑י כָּל אֵ֨לֶּה֙ שָׂרֵ֣י הָ/רְכ֔וּשׁ אֲשֶׁ֖ר לַ/מֶּ֥לֶךְ דָּוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/031.yaml
  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: ru
  text: А над стадами — Язиз, агарянин. Все они были распорядителями имущества царя Давида.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל הַצֹּאן
  choice: А над стадами
  rationale: В административном перечне עַל обозначает ответственность за вверенную область; צֹאן может включать овец и коз, поэтому обобщённое «стада» не сужает значение до одних овец.
- source_word: יָזִיז
  choice: Язиз
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: הַהַגְרִי
  choice: агарянин
  rationale: Этноним передан традиционным и понятным русским соответствием, обозначающим принадлежность к агарянам.
- source_word: כָּל אֵלֶּה
  choice: Все они
  rationale: Естественное русское подведение итога перечислению должностных лиц.
- source_word: שָׂרֵי
  choice: распорядителями
  rationale: В контексте управления царскими ресурсами слово обозначает ответственных должностных лиц; «распорядители» точнее передаёт их хозяйственно-административную функцию, чем «князья».
- source_word: הָרְכוּשׁ
  choice: имущества
  rationale: רְכוּשׁ обозначает имущество, владения или материальные ценности; «имущество» естественно охватывает перечисленные царские ресурсы.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: царя Давида
  rationale: Русская родительная конструкция кратко и ясно передаёт принадлежность имущества царю Давиду.
