  text: לִ/זְבוּלֻ֕ן יִֽשְׁמַֽעְיָ֖הוּ בֶּן עֹבַדְיָ֑הוּ לְ/נַ֨פְתָּלִ֔י יְרִימ֖וֹת בֶּן עַזְרִיאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/019.yaml
  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: ru
  text: у Завулона — Ишмаия, сын Овадии; у Неффалима — Иеримоф, сын Азриила.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִזְבוּלֻן
  choice: у Завулона
  rationale: Предлог ל в контексте перечня племенных начальников обозначает принадлежность или назначение представителя. Конструкция «у Завулона» естественно звучит по-русски и сохраняет краткую форму списка.
- source_word: יִשְׁמַעְיָהוּ
  choice: Ишмаия
  rationale: Имя передано транслитерацией с древнееврейского; форма «Ишмаия» сохраняет элемент -יהו и не смешивает этого человека с носителями иных форм имени.
- source_word: בֶּן
  choice: сын
  rationale: В именной формуле בֶּן прямо указывает на сыновство; по-русски определение естественно оформляется приложением после тире.
- source_word: עֹבַדְיָהוּ
  choice: Овадии
  rationale: Имя передано в принятой русской библейской форме «Овадия», здесь в родительном падеже после слова «сын».
- source_word: לְנַפְתָּלִי
  choice: у Неффалима
  rationale: Предлог ל имеет ту же административно-представительную функцию, что и в первой части стиха; «у Неффалима» сохраняет параллелизм.
- source_word: יְרִימוֹת
  choice: Иеримоф
  rationale: Транслитерация учитывает традиционную русскую библейскую передачу начального יְ как «Ие-» и конечного ת как «ф» в именах, пришедших через греческую традицию.
- source_word: עַזְרִיאֵל
  choice: Азриила
  rationale: Имя передано в традиционной русской форме «Азриил», здесь в родительном падеже.
