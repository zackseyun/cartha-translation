  source_fidelity: 'В целом переданы все основные элементы еврейского текста: בני ישראל, родовые главы, начальники тысяч и сотен, их подчинённые должностные лица, служение царю, помесячная смена подразделений и численность каждого подразделения. Однако «распорядители» заметно сужает וְשֹׁטְרֵיהֶם до организаторов/ведущих распорядок; в данном административно-военном контексте нейтральнее и точнее «должностные лица».'
