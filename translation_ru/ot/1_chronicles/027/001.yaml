  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: ru
  text: 'Сыны Израиля[a], по их числу: главы родовых домов[b], начальники тысяч и сотен и их должностные лица служили царю во всех делах отрядов, которые поочерёдно заступали на службу и уходили с неё[c] из месяца в месяц на протяжении всего года. В каждом отряде было двадцать четыре тысячи человек.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне»; буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «главы домов отцов» — обозначение родовых объединений и их руководителей.'
    reason: cultural_note
  - marker: c
    text: То есть отряды ежемесячно сменяли друг друга на царской службе.
    reason: clarification
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Сыны Израиля
  rationale: Сохранено формальное библейское выражение «сыны Израиля»; в данном военно-административном перечне оно звучит уместно и не сводит родовое обозначение к нейтральному этнониму.
- source_word: לְמִסְפָּרָם
  choice: по их числу
  rationale: Передаёт значение учёта и распределения согласно численности.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главы родовых домов
  rationale: «Родовые дома» естественно передают древнеизраильскую родственно-административную единицу, не превращая её просто в современную семью.
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: начальники тысяч и сотен
  rationale: Сохраняется военно-административная иерархия исходного текста и конкретные числовые обозначения подразделений.
- source_word: וְשֹׁטְרֵיהֶם
  choice: их распорядители
  rationale: Термин обозначает должностных лиц с административными функциями; «распорядители» здесь точнее общего «служащие» и не сужает значение до писцов.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: служившие царю
  rationale: Естественно передаёт продолжающееся официальное служение царю.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: во всех делах отрядов
  rationale: דבר здесь имеет значение дела или служебной обязанности, а מחלקות — организованных подразделений.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: которые поочерёдно заступали на службу и уходили с неё
  rationale: Передаёт конкретную пару «входить — выходить» в её контекстуальном смысле регулярной смены отрядов, не оставляя современному читателю неясный буквализм.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: из месяца в месяц на протяжении всего года
  rationale: Естественная русская передача помесячного распределения в течение полного годового цикла.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: в каждом отряде
  rationale: 'Определённая форма с «один» употреблена распределительно: численность относится к каждому отдельному отряду.'
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Число передано прямо; «человек» добавлено по-русски для ясного обозначения численности личного состава.
