  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: ru
  text: Пятым военачальником на пятый месяц был Шамхут, израхит[a]; в его подразделении было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
