lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Пятым
  rationale: Порядковое числительное употреблено субстантивированно и обозначает пятого начальника или пятое подразделение в последовательности; русский творительный падеж естественно сочетается со сказуемым «был».
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: на пятый месяц
  rationale: Предлог ל указывает на назначение подразделения для службы в соответствующем месяце; формулировка сохраняет административный смысл контекста.
- source_word: הַשַּׂר
  choice: военачальник
  rationale: שַׂר обозначает начальника или предводителя; в военном перечне «военачальник» ясно передаёт роль и не звучит архаично.
- source_word: שַׁמְהוּת
  choice: Шамхут
  rationale: Передача личного имени следует масоретской огласовке и нормам русской транслитерации библейских имён.
- source_word: הַיִּזְרָח
  choice: израхит
  rationale: Этноним передан непосредственно по масоретскому чтению יִזְרָח; возможное традиционное понимание «зерахит» сохранено в сноске.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: в его подразделении было
  rationale: מַחֲלֻקָה здесь означает воинское подразделение или смену. Русская конструкция естественно выражает численность подчинённого ему состава, не утяжеляя фразу буквальным «над».
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Числительное передано обычной русской формой; слово «человек» эксплицирует подразумеваемый личный состав военного подразделения.
