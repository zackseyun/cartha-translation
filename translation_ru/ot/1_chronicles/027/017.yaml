lexical_decisions:
- source_word: לְ/לֵוִי
  choice: над Левием
  rationale: В административном перечне предлог לְ обозначает племя или род, за который отвечает названное лицо. «Над Левием» естественно передаёт эту функцию и сохраняет имя предка в единственном числе.
- source_word: חֲשַׁבְיָה
  choice: Хашавия
  rationale: Личное имя передано транслитерацией с еврейского.
- source_word: בֶן
  choice: сын
  rationale: Обычное соответствие древнееврейской генеалогической конструкции.
- source_word: קְמוּאֵל
  choice: Кемуэл
  rationale: Личное имя передано транслитерацией с еврейского.
- source_word: לְ/אַהֲרֹן
  choice: над Аароном
  rationale: Параллельно первой части стиха предлог לְ указывает на группу, представленную именем предка; буквальная форма сохраняет метонимию исходного текста.
- source_word: צָדוֹק
  choice: Цадок
  rationale: Личное имя передано транслитерацией с еврейского.
theological_decisions:
- issue: Следует ли прямо указать, что «Аарон» означает священнический дом Аарона
  choice: Сохранить в основном тексте имя «Аарон» и пояснить его метонимическое значение в сноске
  alternative: «над домом Аарона» или «над потомками Аарона»
  rationale: Еврейский текст называет самого Аарона, хотя в данном перечне, вероятно, подразумевается его священнический род. Сохранение формы оригинала не устраняет этой смысловой особенности.
translation_notes:
  register: Современный литературный русский язык; краткая структура административного перечня сохранена. Оборот «над Левием / над Аароном» выбран для ясного обозначения руководства, при этом имена родоначальников не заменены названиями групп.
