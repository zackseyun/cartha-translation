  text: מִן בְּנֵי פֶ֗רֶץ הָ/רֹ֛אשׁ לְ/כָל שָׂרֵ֥י הַ/צְּבָא֖וֹת לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/003.yaml
  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: ru
  text: Из сыновей Фареса[a] — глава всех военачальников подразделений[b] на первый месяц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из потомков Фареса». Буквально: «из сыновей Фареса»; в генеалогическом употреблении так может называться более широкая линия потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всех военачальников войск». Еврейское слово часто означает «войска» или «воинства», но в этой главе речь идёт об организованных воинских подразделениях, которые несли службу по месяцам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: из
  rationale: 'Предлог указывает на происхождение: глава происходил из рода Фареса.'
- source_word: בְּנֵי פֶרֶץ
  choice: сыновей Фареса
  rationale: Сохранено буквальное генеалогическое выражение; в данном контексте оно может обозначать более широкий круг потомков.
- source_word: הָרֹאשׁ
  choice: глава
  rationale: Слово обозначает лицо, стоящее во главе; «глава» естественно передаёт титул и сохраняет краткость еврейского текста.
- source_word: לְכָל
  choice: всех
  rationale: В сочетании с «глава» родительный оборот естественно выражает охват его руководства.
- source_word: שָׂרֵי הַצְּבָאוֹת
  choice: военачальников подразделений
  rationale: שָׂרֵי передано как «военачальники», а צְבָאוֹת — с учётом контекста ежемесячно сменявшихся воинских подразделений; буквальная альтернатива отмечена в сноске.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: на первый месяц
  rationale: Оборот обозначает срок первой месячной череды; «на первый месяц» естественно звучит по-русски в административно-военном контексте.
