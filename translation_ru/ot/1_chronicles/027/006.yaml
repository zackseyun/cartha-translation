lexical_decisions:
- source_word: הוּא
  choice: Это был
  rationale: Указательно-возобновительное местоимение связывает стих с Ванеей, названным ранее; такой перевод естественно передаёт эту связь по-русски.
- source_word: גִּבּוֹר
  choice: доблестный воин
  rationale: В данном военном контексте слово обозначает прославленного, отважного бойца; сочетание передаёт и воинский, и героический оттенок.
- source_word: הַשְּׁלֹשִׁים
  choice: Тридцать
  rationale: Речь идёт об известной группе избранных воинов Давида, а не просто о числе; прописная буква обозначает название группы.
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: и начальник над Тридцатью
  rationale: Предлог עַל здесь указывает на положение власти над группой. Слово «начальник» добавлено для естественного русского выражения подразумеваемой должности.
- source_word: מַחֲלֻקְתּוֹ
  choice: его отряд
  rationale: В контексте 1 Пар 27 слово обозначает один из военных отрядов, служивших по очереди; «отряд» ясно и естественно в современном русском.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: его сын Аммизавад
  rationale: Русский порядок слов естественно выражает родство и имя, не меняя смысла еврейского приложения.
