base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: ru
  text: За верблюдами отвечал Овил, исмаильтянин, а за ослицами — Иехдия, меронофянин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: за … отвечал
  rationale: В административном перечне предлог עַל обозначает порученную ответственность или надзор. Русское «за … отвечал» естественно передаёт эту функцию и сохраняет лаконичность стиха.
- source_word: הַגְּמַלִּים
  choice: верблюдами
  rationale: Определённая форма множественного числа существительного «верблюд»; после конструкции «отвечал за» в русском требуется творительный падеж с предлогом «за» в соответствующем порядке фразы.
- source_word: אוֹבִיל
  choice: Овил
  rationale: Личное имя передано традиционной русской библейской формой, близкой к древнееврейскому звучанию.
- source_word: הַיִּשְׁמְעֵלִי
  choice: исмаильтянин
  rationale: Этническое или родовое обозначение связи Овила с Измаилом; «исмаильтянин» — краткий и понятный русский эквивалент.
- source_word: הָאֲתֹנוֹת
  choice: ослицами
  rationale: Существительное אָתוֹן обозначает именно самку осла. «Ослицы» точно и естественно сохраняет эту лексическую конкретность без пояснительной сноски.
- source_word: יֶחְדְּיָהוּ
  choice: Иехдия
  rationale: Личное имя передано принятой русской библейской формой.
- source_word: הַמֵּרֹנֹתִי
  choice: меронофитянин
  rationale: Определение, вероятно образованное от названия места Мероноф; форма «меронофитянин» сохраняет грамматическую неопределённость между территориальной и родовой принадлежностью лучше, чем однозначное «из Меронофа».
