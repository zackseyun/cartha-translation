  text: יוֹאָ֨ב בֶּן צְרוּיָ֜ה הֵחֵ֤ל לִ/מְנוֹת֙ וְ/לֹ֣א כִלָּ֔ה וַ/יְהִ֥י בָ/זֹ֛את קֶ֖צֶף עַל יִשְׂרָאֵ֑ל וְ/לֹ֤א עָלָה֙ הַ/מִּסְפָּ֔ר בְּ/מִסְפַּ֥ר דִּבְרֵֽי הַ/יָּמִ֖ים לַ/מֶּ֥לֶךְ דָּוִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: ru
  text: Иоав, сын Церуи, начал подсчёт, но не завершил его; поэтому гнев обрушился на Израиль. И это число не было внесено[a] в летопись[b] царя Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не было включено» либо «не было записано». Буквально в еврейском тексте: «не взошло»; здесь это оборот о внесении сведений в официальный свод.'
    reason: lexical_alternative
  - marker: b
    text: Под «летописью» подразумеваются царские анналы — официальный свод записей царя Давида.
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: начал считать
  rationale: Сочетание החל с מנה означает «начать считать, исчислять». Такой перевод близок к еврейскому тексту и не добавляет отсутствующее в этой фразе слово «народ».
- source_word: וְלֹא כִלָּה
  choice: но не закончил
  rationale: Глагол כלה здесь означает довести действие до конца. Противительный союз по-русски естественно передаёт смысловое соотношение частей фразы.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: за это гнев обрушился на Израиль
  rationale: Выражение בָזֹאת указывает на причину, а קֶצֶף обозначает гнев, проявившийся как кара. Глагол «обрушился» естественно передаёт наступление гнева, не называя прямо его источник.
- source_word: הַמִּסְפָּר
  choice: это число
  rationale: Существительное обозначает полученный итог подсчёта. Указательное «это» связывает его с только что упомянутым исчислением.
- source_word: וְלֹא עָלָה
  choice: не было внесено
  rationale: 'Буквально עלה означает «подняться, взойти», но здесь употреблено в административном смысле: попасть в официальный письменный реестр.'
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: в летопись
  rationale: דברי הימים — устойчивое обозначение анналов или летописи; краткий русский эквивалент естественно передаёт официальный письменный свод, тогда как буквальное повторение слова מספר было бы неясным.
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: царя Давида
  rationale: Предлог ל выражает здесь принадлежность или отношение; родительный оборот естественен при слове «летопись».
theological_decisions:
- issue: Назван ли прямо источник гнева
  choice: 'Сохранить безличное выражение: «гнев обрушился на Израиль»'
  alternative: «Гнев Господа обрушился на Израиль»
  rationale: Контекст подразумевает Божий гнев, однако в данной еврейской фразе Бог или Господь прямо не назван. Перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Синтаксис остаётся близким к еврейскому оригиналу, но административный оборот передан понятно и естественно; источник гнева намеренно не уточняется.
