base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: ru
  text: На одиннадцатый месяц начальником подразделения был Ванея из Пирафона, из сынов Ефрема[a]. В его подразделении было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из сынов Ефрема»; речь идёт о принадлежности к колену Ефрема.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: Двенадцатым — на двенадцатый месяц — был
  rationale: Сохранены и порядковый номер подразделения в перечне, и указание назначенного ему месяца; тире делает повтор естественным для современного русского языка.
- source_word: בְּנָיָה
  choice: Ванея
  rationale: Использована закрепившаяся в русской библейской традиции форма личного имени.
- source_word: הַפִּרְעָתוֹנִי
  choice: из Пирафона
  rationale: Еврейское обозначение происхождения естественно и понятно передано как указание на место, откуда происходил Ванея.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: из потомков Ефрема[a]
  rationale: Выражение указывает на принадлежность к колену Ефрема, а не обязательно на непосредственное сыновство; буквальная форма отражена в сноске.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: В его подразделении было
  rationale: В контексте главы מַחֲלֻקָה обозначает военное подразделение, служившее по установленной очереди. Русская конструкция ясно передаёт численность под началом названного военачальника.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Число передано прямо; слово «человек» добавлено по смыслу для естественности и ясности русского текста.
