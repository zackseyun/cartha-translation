- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: кому было двадцать лет и меньше
  rationale: Возрастная формула включает двадцатилетних и всех младше них; русская формулировка ясна и естественна.
- source_word: כִּי
  choice: потому что
  rationale: Частица вводит основание, по которому Давид не считал эту возрастную группу.
- source_word: אָמַר יְהוָה לְהַרְבּוֹת
  choice: Яхве обещал умножить
  rationale: Глагол «сказал» с инфинитивом указывает на ранее данное Божье слово; «обещал» естественно выражает его содержание в контексте обетования, не меняя референта.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Кратко сохраняет форму и коллективное значение еврейского названия.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: как звёзды небесные
  rationale: Сохраняет образ и возвышенное звучание формулы обетования, оставаясь понятным современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передача «Яхве» сохраняет личное заветное имя, прямо стоящее в еврейском тексте.
- issue: Характер Божьего высказывания אָמַר ... לְהַרְבּוֹת
  choice: обещал умножить
  alternative: сказал, что умножит
  rationale: Контекст и формула о звёздах указывают на Божье обетование; выбранный вариант естественен по-русски, а более буквальный вариант остаётся возможным.
