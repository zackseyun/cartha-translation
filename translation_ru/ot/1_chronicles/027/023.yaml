  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: ru
  text: Но Давид не пересчитал тех, кому было двадцать лет и меньше[a], потому что Яхве сказал, что умножит Израиль, как небесные звёзды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не поднял их число»; это еврейское выражение означает «не пересчитал» или «не провёл среди них перепись».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как звёзды неба». Эти слова перекликаются с обещанием Яхве сделать Израиль чрезвычайно многочисленным.'
    reason: cross_reference
lexical_decisions:
