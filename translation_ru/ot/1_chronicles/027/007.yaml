  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: ru
  text: Четвёртым — на четвёртый месяц — был Асаил, брат Иоава, а после него[a] — его сын Завадия. В его подразделении было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «а его сын Завадия сменил его». Буквально: «после него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Четвёртым
  rationale: Порядковое числительное употреблено самостоятельно и обозначает четвёртого начальника в последовательности месячных подразделений. Творительный падеж естественно передаёт эту эллиптическую именную конструкцию по-русски.
- source_word: לַחֹדֶשׁ הָרְבִיעִי
  choice: на четвёртый месяц
  rationale: Предлог לְ указывает, к какому месяцу годовой ротации относится назначение; такая формулировка естественна для современного русского языка.
- source_word: עֲשָׂהאֵל
  choice: Асаил
  rationale: Традиционная русская библейская передача имени.
- source_word: אֲחִי יוֹאָב
  choice: брат Иоава
  rationale: Прямо передаёт сопряжённую конструкцию и сохраняет способ идентификации Асаила.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: а после него — его сын Зевадия
  rationale: Сохраняет буквальное «после него», которое в контексте списка указывает на преемство, не превращая подразумеваемое значение в явное утверждение основного текста.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: В его подразделении было
  rationale: מַחֲלֻקָה здесь означает воинское подразделение или череду службы. Русская конструкция естественно выражает численность состава, тогда как буквальное «над его подразделением» звучало бы неясно.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Число передано современной русской формой; слово «человек» добавлено по смыслу, поскольку речь идёт о численности воинского подразделения.
