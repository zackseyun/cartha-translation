  register: Современный литературный русский язык с достоинством административного перечня. Союз «а» ясно разграничивает две сферы надзора; тире во второй части устраняет тяжеловесный повтор сказуемого. Маркеры [a] и [b] помещены непосредственно при соответствующих словам.
