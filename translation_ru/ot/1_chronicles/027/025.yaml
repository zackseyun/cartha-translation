base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: ru
  text: Над царскими сокровищницами был Азмавет, сын Адиэла, а над сокровищницами в сельской местности[a], в городах, селениях и башнях — Ионафан[b], сын Уззии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в поле»; единственное число здесь, вероятно, имеет собирательный смысл и обозначает сельскую местность в отличие от городов, селений и башен.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь употреблена полная форма имени — «Иехонатан»; по-русски это имя традиционно передаётся как «Ионафан».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Над ... был
  rationale: Предлог עַל в перечне должностных обязанностей обозначает надзор и ответственность; эта конструкция сохраняет административный и перечислительный характер текста.
- source_word: אֹצְרוֹת הַמֶּלֶךְ
  choice: царскими сокровищницами
  rationale: 'В отношении царя אֹצָר естественно передать как «сокровищница»: речь может идти как о помещениях, так и о находящихся в них ценностях и запасах.'
- source_word: הָאֹצָרוֹת
  choice: хранилищами
  rationale: В перечне сельских мест хранения «хранилища» звучит естественнее и отражает широкий смысл אֹצָר — место хранения запасов или ценностей. Различие с «сокровищницами» обусловлено контекстом, а не различием еврейских слов.
- source_word: בַּשָּׂדֶה
  choice: в сельской местности
  rationale: Буквально форма стоит в единственном числе («в поле»), но в противопоставлении городам, селениям и башням, вероятно, имеет собирательный смысл и обозначает местность вне поселений.
- source_word: בֶּעָרִים וּבַכְּפָרִים וּבַמִּגְדָּלוֹת
  choice: в городах, селениях и башнях
  rationale: Переданы простые локативные значения без уточнения назначения башен, которого нет в еврейском тексте.
- source_word: עַזְמָוֶת בֶּן עֲדִיאֵל
  choice: Азмавет, сын Адиэла
  rationale: Имена транслитерированы в формах, естественных для русской библейской традиции, а בֶּן передано как «сын».
- source_word: יְהוֹנָתָן בֶּן עֻזִּיָּהוּ
  choice: Ионафан, сын Уззии
  rationale: Выбраны узнаваемые русские библейские формы имён; полная еврейская форма יְהוֹנָתָן отмечена в сноске.
