base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: ru
  text: Десятым начальником на десятый месяц был Махрай из Нетофы, из рода Зераха; под его началом было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: Десятый
  rationale: Порядковое числительное употреблено самостоятельно в контексте перечня начальников и месячных подразделений; подразумеваемое существительное не добавляется.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: на десятый месяц
  rationale: Предлог לְ в контексте главы обозначает назначение подразделения на соответствующий месяц службы.
- source_word: מַהְרַי
  choice: Махрай
  rationale: Имя передано транслитерацией еврейской формы с учётом норм русского библейского именослова.
- source_word: הַנְּטוֹפָתִי
  choice: из Нетофы
  rationale: Нисба указывает на происхождение или связь с местностью Нетофа; описательная форма естественнее для современного русского читателя.
- source_word: לַזַּרְחִי
  choice: из рода Зераха
  rationale: Нисба выражает принадлежность к роду Зераха; такой перевод ясно передаёт родовую связь.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: в его подразделении было
  rationale: מַחֲלֻקָה в данной главе обозначает военно-служебное подразделение; русская конструкция естественно передаёт численность под его начальством.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Числительное передано нормативно; слово «человек» добавлено по смыслу, поскольку речь идёт о составе военного подразделения.
