base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: ru
  text: Седьмым, на седьмой месяц, был назначен Хелец, пелонит[a], из сыновей Ефрема; под его началом было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «палтит» — согласно иному традиционному отождествлению рода Хелеца.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: Седьмой
  rationale: Порядковое числительное употреблено эллиптически в контексте перечня начальников ежемесячных воинских подразделений; краткая форма сохраняет структуру списка без добавления отсутствующего в тексте существительного.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: на седьмой месяц
  rationale: Предлог לְ в контексте главы указывает на назначение служить в определённый месяц; данная формулировка естественно передаёт административное распределение.
- source_word: חֶלֶץ
  choice: Хелец
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: הַפְּלוֹנִי
  choice: пелонит
  rationale: Передаёт согласный текст масоретской формы как обозначение происхождения или рода; иной традиционный вариант отмечен в сноске.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: из сыновей Ефрема
  rationale: Сохранена понятная по-русски древнееврейская родоплеменная формула, не сводящая выражение просто к этнониму.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: в его подразделении было
  rationale: מַחֲלֻקָה здесь обозначает воинское подразделение. Более буквальное «над его подразделением» с последующим числом неестественно по-русски; выбранная конструкция ясно передаёт численность части под его началом.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Число передано словами; «человек» добавлено по смыслу для естественности и ясности русского текста, поскольку речь идёт о численности воинского подразделения.
