base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: ru
  text: Над отрядом второго месяца стоял Додай, ахохитянин, а начальником его отряда был Миклот[a]. В его отряде было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Додай, ахохитянин, и его отряд, и Миклот, начальник». Еврейская фраза построена сжато, поэтому неясно, назван ли Миклот начальником в отряде Додая или тем, кто стоял во главе этого отряда.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת
  choice: отряд
  rationale: В контексте ежемесячной военной службы слово обозначает организованное подразделение. «Отряд» естественно звучит по-русски и передаёт военный характер группы.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: второго месяца
  rationale: Обычное порядковое обозначение месяца в системе ежемесячной ротации.
- source_word: דּוֹדַי
  choice: Додай
  rationale: Передана форма имени, засвидетельствованная непосредственно в данном стихе, без замены родственной формой «Додо».
- source_word: הָאֲחוֹחִי
  choice: ахохитянин
  rationale: Родовое или клановое обозначение передано привычным для русского библейского повествования существительным.
- source_word: וּמַחֲלֻקְתּוֹ
  choice: его отряда
  rationale: Суффикс третьего лица мужского рода сохранён, а ключевой организационный термин переведён последовательно.
- source_word: וּמִקְלוֹת
  choice: Миклот
  rationale: Транслитерация личного имени.
- source_word: הַנָּגִיד
  choice: начальник
  rationale: В данном военно-административном контексте слово обозначает руководителя, но не позволяет точно установить формальный ранг; «начальник» сохраняет нужную широту.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: в его отряде
  rationale: Русская конструкция увязывает указание численности с соответствующим отрядом. Буквальное повторение «над его отрядом» здесь было бы синтаксически неестественным; неоднозначность предшествующей сжатой конструкции отмечена в сноске.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Числительное передано словами; «человек» добавлено как подразумеваемое обозначение численности воинского подразделения.
