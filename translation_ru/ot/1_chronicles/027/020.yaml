  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
translation:
  language: ru
  text: Над сынами Ефрема — Осия, сын Азазии; над половиной колена Манассии — Иоиль, сын Федаии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי אֶפְרַיִם
  choice: у сынов Ефрема
  rationale: Предлог ל в контексте перечня поставленных над племенами лиц обозначает сферу ответственности; русское «у» естественно передаёт эту связь. «Сыны Ефрема» сохранено как традиционное племенное обозначение.
- source_word: הוֹשֵׁעַ
  choice: Осия
  rationale: Устоявшаяся русская библейская передача данного еврейского личного имени.
- source_word: בֶּן
  choice: сын
  rationale: Прямое и обычное обозначение родства в генеалогических и административных перечнях.
- source_word: עֲזַזְיָהוּ
  choice: Азазия
  rationale: Форма имени передана в соответствии с принятой русской библейской традицией и еврейским звучанием.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: у половины колена Манассии
  rationale: Сохранено буквальное указание на половину племени; שֵׁבֶט передано традиционным русским библейским термином «колено».
- source_word: יוֹאֵל
  choice: Иоиль
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: פְּדָיָהוּ
  choice: Федаия
  rationale: Устоявшаяся русская библейская передача еврейского имени.
