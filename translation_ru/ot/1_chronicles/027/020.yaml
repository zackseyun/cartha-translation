  source_fidelity: Предлог ל в обоих членах административного перечня обозначает назначение/ведение соответствующей группы, а не простую принадлежность. Формулировка «у сынов ... —» может быть понята как «среди сынов ...» или как отношение принадлежности и недостаточно ясно передаёт эту функцию.
  naturalness: Имена и синтаксическая лаконичность в целом естественны для современного литературного русского в библейском административном перечне. Явное «над» делает конструкцию одновременно идиоматичной и однозначной.
