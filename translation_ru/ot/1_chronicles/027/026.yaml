base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: ru
  text: А над теми, кто выполнял полевые работы по обработке земли, был поставлен Езрий, сын Хелува.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: А над
  rationale: 'Сохраняет соединительную функцию וְ и передаёт административное значение עַל: лицо поставлено над определённой областью работ.'
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: теми, кто выполнял полевые работы
  rationale: Причастное выражение обозначает людей, занятых трудом; «полевые работы» естественно передаёт сельскохозяйственный смысл сочетания מְלֶאכֶת הַשָּׂדֶה.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: и обрабатывал землю
  rationale: В данном земледельческом контексте עֲבֹדָה означает обработку, а אֲדָמָה — почву или возделываемую землю. Союз «и» естественно связывает пояснение с «полевыми работами».
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: Езрий, сын Хелува
  rationale: Имена переданы традиционной русской библейской транслитерацией; בֶּן переведено обычной формулой родства «сын».
