  text: וְ/עַל הַ/זֵּיתִ֤ים וְ/הַ/שִּׁקְמִים֙ אֲשֶׁ֣ר בַּ/שְּׁפֵלָ֔ה בַּ֥עַל חָנָ֖ן הַ/גְּדֵרִ֑י וְ/עַל אֹצְר֥וֹת הַ/שֶּׁ֖מֶן יוֹעָֽשׁ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: ru
  text: За оливковыми деревьями и сикоморами[b], росшими в Шефеле[a], надзирал Баал-Ханан из Гедера, а хранилищами масла ведал Иоас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в низменности». Шефела — область предгорий Иудеи.'
    reason: cultural_note
  - marker: b
    text: Сикоморы — также «смоковницы-сикоморы».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: надзирал / ведал
  rationale: В административном перечне предлог עַל обозначает сферу ответственности должностного лица. Русские глаголы передают эту функцию естественно и без излишне буквальной конструкции.
- source_word: הַזֵּיתִים
  choice: маслинами
  rationale: В контексте управления царскими угодьями множественное число обозначает масличные деревья; «маслины» — точное и традиционное русское название деревьев.
- source_word: וְהַשִּׁקְמִים
  choice: сикоморами
  rationale: שִׁקְמִים обозначает сикоморы, то есть смоковницы-сикоморы. Краткий ботанический термин сохранён в тексте, а пояснение дано в сноске.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: росшими в Шефеле
  rationale: Относительное אֲשֶׁר явно связывает местоположение с деревьями. Шефела передана как географическое название, а не истолкована исключительно как нарицательное «низменность».
- source_word: בַּעַל חָנָן
  choice: Баал-Ханан
  rationale: Имя транслитерировано в форме, достаточно близкой к древнееврейскому звучанию и понятной русскому читателю.
- source_word: הַגְּדֵרִי
  choice: из Гедера
  rationale: Этникон передан естественным русским оборотом происхождения; это избегает неясного искусственного демонима.
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: запасами масла
  rationale: Сочетание может обозначать как хранилища, так и хранимые запасы. «Запасы масла» естественно для русского языка и сохраняет предмет административного надзора, не уточняя архитектуру.
- source_word: יוֹעָשׁ
  choice: Иоас
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions: []
