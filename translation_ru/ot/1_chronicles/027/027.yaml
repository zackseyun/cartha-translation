  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: ru
  text: Над виноградниками был поставлен Шимей, родом из Рамы; а над урожаем виноградников для хранилищ вина[a] — Завдий Шифмиянин.
