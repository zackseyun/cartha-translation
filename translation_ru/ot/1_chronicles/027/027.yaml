    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: над … был поставлен
  rationale: В перечне царских служителей предлог עַל обозначает ответственность и управление; по-русски это естественно передаётся конструкцией «над … был поставлен».
- source_word: הַכְּרָמִים
  choice: виноградниками
  rationale: Обычное значение כֶּרֶם — «виноградник»; множественное число обозначает виноградники, находившиеся под царским управлением.
- source_word: שִׁמְעִי
  choice: Шимей
  rationale: Традиционная русская передача еврейского личного имени.
- source_word: הָרָמָתִי
  choice: из Рамы
  rationale: Еврейское относительное наименование указывает на происхождение из Рамы; развёрнутая русская форма понятнее искусственного этнонима.
- source_word: שֶׁבַּכְּרָמִים
  choice: тем, что собирали в виноградниках
  rationale: Буквально «тем, что было в виноградниках»; в данном хозяйственном контексте имеются в виду собранные плоды виноградников, предназначенные для производства и хранения вина. Формулировка сохраняет некоторую неопределённость исходного выражения.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: для винных хранилищ
  rationale: אֹצָר означает хранилище или кладовую; в сочетании с «вином» речь идёт о местах его хранения. «Винные хранилища» не предполагает, что они обязательно находились под землёй.
- source_word: זַבְדִּי
  choice: Завдий
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: הַשִּׁפְמִי
  choice: из Шефама
  rationale: Относительная форма, вероятно, указывает на происхождение из Шефама; такая передача ясна по-русски и не требует искусственного демонима.
