base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: ru
  text: Двенадцатым, на двенадцатый месяц, был Хелдай[a], нетофатянин из дома Гофониила[b]. Его подразделение насчитывало двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых параллельных традициях имя передано как «Хелед».
    reason: cross_reference
  - marker: b
    text: 'Буквально: «к Гофониилу». Это может обозначать принадлежность к дому или роду Гофониила, а также происхождение от него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: Двенадцатым
  rationale: В контексте перечисления воинских подразделений это порядковое числительное; подразумевается двенадцатый начальник или отряд.
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: на двенадцатый месяц
  rationale: Предлог ל обозначает назначение на соответствующий месяц ежегодной службы; формулировка сохраняет административную структуру оригинала и естественна по-русски.
- source_word: חֶלְדַּי
  choice: Хелдай
  rationale: Имя передано транслитерацией данной еврейской формы; в параллельной традиции встречается вариант «Хелед».
- source_word: הַנְּטוֹפָתִי
  choice: нетофатянин
  rationale: Этникон указывает на происхождение из Нетофы; традиционная русская форма кратка и точна.
- source_word: לְעָתְנִיאֵל
  choice: из рода Гофониила
  rationale: Конструкция с ל, вероятнее всего, указывает на семейную или родовую принадлежность, а не на непосредственное подчинение давно умершему Гофониилу.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: В его подразделении было
  rationale: מַחֲלֻקָה в этой главе означает воинское подразделение или череду несущих службу; русская конструкция естественно вводит его численность.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Число передано словами в повествовательном тексте; «человек» добавлено для ясности подразумеваемого состава подразделения.
