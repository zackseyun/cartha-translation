  text: וְ/עַל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לָ/רֽאוּבֵנִ֣י נָגִ֔יד אֱלִיעֶ֖זֶר בֶּן זִכְרִ֑י לַ/שִּׁ֨מְעוֹנִ֔י שְׁפַטְיָ֖הוּ בֶּֽן מַעֲכָֽה־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: ru
  text: 'А над коленами Израиля: у рубенитян начальником[a] был Елиезер, сын Зихри; у симеонитян — Шефатия, сын Маахи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вождём», «князем» или «правителем»; евр. נָגִיד.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: А над
  rationale: Союз с предлогом связывает стих с предыдущим перечнем и вводит список тех, кто поставлен над коленами.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: коленами Израиля
  rationale: Традиционное и понятное в библейском контексте обозначение племенных подразделений Израиля.
- source_word: לָרְאוּבֵנִי
  choice: у рубенитян
  rationale: Форма обозначает представителей колена Рувима, а не самого патриарха; конструкция «у рубенитян» естественно вводит их должностное лицо.
- source_word: נָגִיד
  choice: начальником
  rationale: Слово обозначает человека, поставленного во главе; «начальник» ясно передаёт административную власть, не придавая слову обязательного царского оттенка.
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: Елиезер, сын Зихри
  rationale: Имена переданы принятой русской библейской транслитерацией, а патронимическая конструкция — буквально.
- source_word: לַשִּׁמְעוֹנִי
  choice: у симеонитян
  rationale: Форма обозначает племенную группу и сохраняет параллель с «у рубенитян».
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: Шефатия, сын Маахи
  rationale: Имена транслитерированы; конструкция указывает на родительство, не уточняя пол Маахи, поскольку сам текст этого не делает.
