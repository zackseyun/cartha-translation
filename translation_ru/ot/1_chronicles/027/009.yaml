base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: ru
  text: Шестым, на шестой месяц, был Ира, сын Иккеша, из Текоа; под его началом было двадцать четыре тысячи человек.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: Шестой
  rationale: Порядковое числительное употреблено эллиптически в формуле списка и указывает на шестого начальника по порядку; краткость еврейского текста сохранена без добавления слова «начальник» или «подразделение».
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: на шестой месяц
  rationale: Предлог ל в административном контексте обозначает назначение на соответствующий месяц службы; по-русски это естественно передаётся сочетанием «на шестой месяц».
- source_word: עִירָא
  choice: Ира
  rationale: Личное имя передано традиционной русской библейской транслитерацией.
- source_word: בֶן עִקֵּשׁ
  choice: сын Иккеша
  rationale: Прямое и естественное соответствие стандартной древнееврейской конструкции происхождения.
- source_word: הַתְּקוֹעִי
  choice: из Текоа
  rationale: Прилагательное принадлежности обозначает уроженца или жителя Текоа; описательная передача звучит естественнее в современном русском языке, чем «текоянин».
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: в его подразделении было
  rationale: מַחֲלֻקָה в контексте главы означает военное подразделение, служившее по очереди; оборот с עַל и числом указывает на численность людей под его началом. Русская формулировка ясно передаёт смысл без тяжёлого калькирования.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: двадцать четыре тысячи человек
  rationale: Число передано по нормам современного русского языка; слово «человек» добавлено для ясности подразумеваемого счёта воинов.
