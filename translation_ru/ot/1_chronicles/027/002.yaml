base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: ru
  text: Во главе первого отряда, назначенного на первый месяц, стоял Иашовам, сын Завдиила; в его отряде было двадцать четыре тысячи человек.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и над его отрядом — двадцать четыре тысячи». Еврейская фраза эллиптична; слова «было… человек» добавлены по смыслу, чтобы обозначить численность отряда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: во главе… отряда
  rationale: В административно-военном перечне עַל указывает на руководство подразделением, а מַחֲלֹקֶת — на организованный отряд. Такое выражение естественно передаёт оба элемента по-русски.
- source_word: הָרִאשׁוֹנָה לַחֹדֶשׁ הָרִאשׁוֹן
  choice: первого отряда, назначенного на первый месяц
  rationale: Оба порядковых числительных сохранены; причастие «назначенного» ясно передаёт распределение отрядов по месяцам, подразумеваемое предлогом לְ и контекстом годовой очередности.
- source_word: יָשָׁבְעָם בֶּן זַבְדִּיאֵל
  choice: Иашовам, сын Завдиила
  rationale: Использованы закрепившиеся в русской библейской традиции формы имён; בֶּן передано в своём обычном родословном значении.
- source_word: וְעַל מַחֲלֻקְתּוֹ עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: в его отряде было двадцать четыре тысячи человек
  rationale: 'Еврейская фраза эллиптична: после слов «и над его отрядом» непосредственно следует численность. Русская конструкция восполняет подразумеваемую связку и естественно сообщает размер подразделения.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Отряд» понятнее обычному читателю, чем специальное или архаичное «череда»; синтаксис проясняет ежемесячную организацию войска, не меняя содержания.
