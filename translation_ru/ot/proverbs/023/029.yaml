  yaml_path: translation/ot/proverbs/023/029.yaml
  text: Who has woe? Who has sorrow? Who has strife? Who has complaining? Who has wounds for nothing? Who has redness of eyes?[a][b][c]
translation:
  language: ru
  text: У кого горе? У кого печаль?[a] У кого ссоры? У кого жалобы? У кого раны без причины?[b] У кого покрасневшие глаза?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скорбь»; еврейское слово имеет оттенок горестного возгласа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни за что».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «налитые кровью глаза»; еврейское выражение описывает изменившийся цвет или вид глаз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: горе
  rationale: Кратко передаёт возглас и состояние бедствия, сохраняя резкую силу первого риторического вопроса.
- source_word: אֲבוֹי
  choice: печаль
  rationale: Отличает второе выражение скорби от первого и естественно передаёт плачевную интонацию еврейского слова.
- source_word: מדונים
  choice: ссоры
  rationale: Множественное число указывает на повторяющиеся распри; «ссоры» естественно и понятно звучит в современном русском.
- source_word: שִׂיחַ
  choice: жалобы
  rationale: Слово допускает значения речи, жалобы или тягостного размышления; в перечне последствий пьянства «жалобы» сохраняет смысл, не сводя его к невнятной болтовне.
- source_word: פְּצָעִים
  choice: раны
  rationale: Конкретное и выразительное обозначение телесных повреждений.
- source_word: חִנָּם
  choice: ни за что
  rationale: Передаёт бессмысленность или беспричинность полученных ран и звучит идиоматично по-русски.
- source_word: חַכְלִלוּת עֵינָיִם
  choice: покрасневшие глаза
  rationale: Передаёт изменённый, красный вид глаз, связанный в контексте с опьянением, не усиливая образ до более конкретного «налитые кровью».
- source_word: לְמִי
  choice: у кого
  rationale: Естественный русский эквивалент повторяющегося буквального вопроса «кому/для кого?», сохраняющий анафору.
