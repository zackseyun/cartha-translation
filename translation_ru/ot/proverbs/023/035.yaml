  text: הִכּ֥וּ/נִי בַל חָלִיתִי֮ הֲלָמ֗וּ/נִי בַּל יָ֫דָ֥עְתִּי מָתַ֥י אָקִ֑יץ א֝וֹסִ֗יף אֲבַקְשֶׁ֥/נּוּ עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/035.yaml
  text: “They struck me[a], but I was not hurt; they beat me, but I did not know it[b]. When shall I awake? I will seek it again.”
translation:
  language: ru
  text: «Били меня, а мне не было больно[a]; колотили меня, а я и не знал. Когда я проснусь? Снова буду искать его[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Били меня, а я не почувствовал боли». Еврейский глагол может передавать оттенки боли, недомогания, слабости или ранения.'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «его», вероятнее всего, относится к вину или хмельному напитку, о которых говорится в ближайшем контексте.
    reason: cross_reference
lexical_decisions:
- source_word: הִכּוּנִי
  choice: Били меня
  rationale: Глагол נכה обозначает нанесение ударов. «Били» естественно передаёт физическое насилие и сохраняет отличие от следующего глагола.
- source_word: בַל חָלִיתִי
  choice: а мне не было больно
  rationale: חלה может обозначать болезнь, слабость, страдание или причинённую боль. В контексте ударов и опьянения речь естественнее всего понять как нечувствительность к боли, однако возможные оттенки отмечены в сноске.
- source_word: הֲלָמוּנִי
  choice: колотили меня
  rationale: הלם означает сильно ударять. «Колотили» сохраняет параллелизм, не стирая лексическое различие с נכה.
- source_word: בַּל יָדָעְתִּי
  choice: а я и не знал
  rationale: Буквальное значение ידע — «знать». Формулировка сохраняет исходную лаконичность и в контексте ясно указывает на отсутствие осознания из-за опьянения.
- source_word: מָתַי אָקִיץ
  choice: Когда я проснусь?
  rationale: קיץ в данной форме означает пробудиться. Буквальный образ сна сохранён без истолковывающего расширения «приду в себя».
- source_word: אוֹסִיף אֲבַקְשֶׁנּוּ עוֹד
  choice: Снова буду искать его
  rationale: Сочетание יסף и עוד выражает повторение действия, а בקש — поиски или стремление обрести. Мужской суффикс единственного числа передан местоимением «его», референция которого пояснена в сноске.
