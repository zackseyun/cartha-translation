  text: פִּֽתְּ/ךָ אָכַ֥לְתָּ תְקִיאֶ֑/נָּה וְ֝/שִׁחַ֗תָּ דְּבָרֶ֥י/ךָ הַ/נְּעִימִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/008.yaml
  text: You will vomit up the morsel you have eaten[a], and you will waste your pleasant words.
translation:
  language: ru
  text: Ты извергнешь съеденный кусок и потратишь впустую свои приятные слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любезные слова»; возможно также: «ласковые слова».'
    reason: Лексема נעים допускает оттенки приятной, располагающей или любезной речи.
lexical_decisions:
- source_word: פִּתְּךָ
  choice: съеденный кусок
  rationale: פַּת обозначает кусок или ломоть пищи. «Кусок» сохраняет краткий и конкретный образ, не уточняя без необходимости, что речь именно о хлебе; притяжательный суффикс естественно передан вместе с последующим глаголом как «съеденный» адресатом кусок.
- source_word: אָכַלְתָּ
  choice: съеденный
  rationale: Перфект Qal, 2-е лицо мужского рода единственного числа, указывает на уже совершённое действие. В русском причастная конструкция «съеденный кусок» естественно передаёт смысл «кусок, который ты съел».
- source_word: תְקִיאֶנָּה
  choice: ты извергнешь
  rationale: Форма Hiphil от קיא с местоименным суффиксом означает исторгнуть съеденное, вырвать его. «Извергнешь» сохраняет резкость образа и подходит для достойного литературного регистра; объект понятен из слов «съеденный кусок».
- source_word: וְשִׁחַתָּ
  choice: и впустую растратишь
  rationale: 'שׁחת здесь описывает напрасную потерю или порчу сказанного: любезная речь не принесёт пользы. «Впустую растратишь» естественно сочетается со «словами» и передаёт как действие адресата, так и безрезультатность.'
- source_word: דְּבָרֶיךָ
  choice: свои слова
  rationale: Прямо передаёт множественное число דְּבָרִים с суффиксом 2-го лица; возвратное «свои» естественно для русского синтаксиса.
- source_word: הַנְּעִימִים
  choice: приятные
  rationale: נעים означает приятный, милый, располагающий или любезный. «Приятные» сохраняет широкое значение исходного слова, не сводя его исключительно к лести или учтивости.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением краткости и резкости древнееврейской пословицы. «Извергнешь» выбрано как ясное, но более достойное по регистру соответствие буквальному образу рвоты; «впустую растратишь» делает естественной связь глагола שׁחת со словами.
