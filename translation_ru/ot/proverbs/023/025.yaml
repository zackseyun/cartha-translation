  text: יִֽשְׂמַח אָבִ֥י/ךָ וְ/אִמֶּ֑/ךָ וְ֝/תָגֵ֗ל יֽוֹלַדְתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/025.yaml
  text: Let your father and your mother be glad[a], and let her who gave birth to you rejoice.
translation:
  language: ru
  text: Пусть радуются твои отец и мать, и пусть ликует родившая тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמַח
  choice: пусть радуются
  rationale: Форма выражает пожелание или побуждение. В еврейском глагол стоит в единственном числе перед составным подлежащим «твой отец и твоя мать»; по нормам современного русского языка естественно множественное число.
- source_word: אָבִיךָ וְאִמֶּךָ
  choice: твои отец и мать
  rationale: Точно передаёт оба существительных с обращённым к сыну местоименным суффиксом мужского рода; общий определитель «твои» звучит естественно и ясно.
- source_word: וְתָגֵל
  choice: и пусть ликует
  rationale: Глагол גיל обозначает яркую, торжествующую радость; «ликует» сохраняет его усиленный оттенок и отличает от שׂמח — «радуются».
- source_word: יוֹלַדְתֶּךָ
  choice: родившая тебя
  rationale: Причастная форма женского рода прямо указывает на мать как женщину, родившую адресата; буквальный и естественный русский эквивалент.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической мудрости. Синтаксический параллелизм и различие между двумя глаголами радости сохранены; адресат мужского рода подразумевается формами исходного текста, но в русском переводе отдельно не маркируется.
