  text: שְׁמַע אַתָּ֣ה בְנִ֣/י וַ/חֲכָ֑ם וְ/אַשֵּׁ֖ר בַּ/דֶּ֣רֶךְ לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/019.yaml
  text: Listen[a], my son, and be wise, and direct your heart in the way.
translation:
  language: ru
  text: Слушай, сын мой, и будь мудр; направь своё сердце на путь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: Слушай
  rationale: Повелительная форма выражает не просто слуховое восприятие, а внимательное и послушное отношение; «слушай» естественно передаёт это в современном русском языке.
- source_word: בְנִי
  choice: сын мой
  rationale: Обращение с суффиксом первого лица единственного числа прямо обозначает сына; порядок слов сохраняет достойный тон наставления.
- source_word: וַחֲכָם
  choice: и будь мудр
  rationale: Повелительная форма кратко призывает к мудрости. «Будь мудр» естественнее и менее процессуально, чем «стань мудрым».
- source_word: וְאַשֵּׁר
  choice: направляй
  rationale: Пиэль от אשר здесь означает направлять, вести прямо. «Направляй» естественно сочетается с сердцем и образом пути.
- source_word: בַּדֶּרֶךְ
  choice: по верному пути
  rationale: דרך обозначает путь, в том числе образ жизни. Прилагательное «верному» делает подразумеваемую нормативную направленность ясной по-русски, не устраняя метафору пути.
- source_word: לִבֶּךָ
  choice: своё сердце
  rationale: «Сердце» сохраняет конкретную и богословски значимую древнееврейскую метафору, охватывающую мысли, волю и желания; возвратное «своё» естественно при повелительном глаголе второго лица.
theological_decisions:
- issue: Гендерно маркированное обращение в наставлении мудрости
  choice: сын мой
  alternative: дитя моё
  rationale: Древнееврейская форма грамматически имеет мужской род и единственное число; её не следует нейтрализовать, хотя в книге Притчей наставление может иметь более широкое применение.
- issue: Нормативный смысл образа пути
  choice: по верному пути
  alternative: по пути
  rationale: Контекст наставления призывает направить внутреннего человека должным образом. «Верному» передаёт подразумеваемую положительную оценку, однако буквальный текст допускает более сжатое «по пути», что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным наставительным звучанием. Синтаксис остаётся близким к параллельной структуре еврейского стиха; точка с запятой облегчает восприятие двух связанных увещаний.
