source:
  edition: WLC
  text: כִּ֤י כְּמוֹ שָׁעַ֥ר בְּ/נַפְשׁ֗/וֹ כֶּ֫ן ה֥וּא אֱכֹ֣ל וּ֭/שְׁתֵה יֹ֣אמַר לָ֑/ךְ וְ֝/לִבּ֗/וֹ בַּל עִמָּֽ/ךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/007.yaml
  text: 'For as he calculates within himself[a], so he is: “Eat and drink,” he says to you, but his heart is not with you.'
translation:
  language: ru
  text: Ведь как он про себя считает, таков он и есть. «Ешь и пей», — говорит он тебе, но сердце его не с тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит объяснение предшествующего предостережения; «ведь» естественно передаёт эту пояснительную связь в русском.
- source_word: כְּמוֹ...כֶּן
  choice: каков... таков
  rationale: Русская соотносительная конструкция сохраняет краткость и афористичность еврейского сопоставления «как... так».
- source_word: שָׁעַר
  choice: расчёт
  rationale: Редкий глагол связан с исчислением, оцениванием или расчётом. В контексте скупого хозяина речь идёт о внутреннем подсчёте цены, а не просто о мысли.
- source_word: בְּנַפְשׁוֹ
  choice: про себя
  rationale: נֶפֶשׁ обозначает здесь внутреннее «я» человека. «Про себя» естественно выражает скрытый внутренний расчёт без привнесения технического смысла слова «душа».
- source_word: כֶּן הוּא
  choice: таков и он
  rationale: 'Формулировка сохраняет лаконичный вывод: внутренний расчёт обнаруживает, каков человек на самом деле.'
- source_word: אֱכֹל וּשְׁתֵה
  choice: Ешь и пей
  rationale: Прямые повеления передают внешне радушное приглашение хозяина и сохраняют контраст с его внутренним отношением.
- source_word: יֹאמַר לָךְ
  choice: говорит он тебе
  rationale: Настоящее время уместно для обобщённой ситуации в изречении; порядок слов поддерживает естественный русский ритм после прямой речи.
- source_word: וְלִבּוֹ
  choice: но сердце его
  rationale: Союз передан противительным «но», поскольку слова хозяина резко противопоставлены его подлинному расположению.
- source_word: בַּל
  choice: не
  rationale: Отрицательная частица естественно передаётся простым русским отрицанием.
- source_word: עִמָּךְ
  choice: с тобой
  rationale: Сохраняется еврейский образ отсутствия сердечного участия и искренней расположенности к гостю.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткого, афористичного строя притчи. «Расчёт про себя» намеренно удерживает оттенок внутреннего подсчёта; более гладкое «думает про себя» дано в сноске как допустимая лексическая альтернатива.
