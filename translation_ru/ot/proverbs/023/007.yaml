- from: Ведь каков его расчёт про себя[a], таков и он. «Ешь и пей», — говорит он тебе, но сердце его не с тобой.
  to: Ведь как он про себя считает, таков он и есть. «Ешь и пей», — говорит он тебе, но сердце его не с тобой.
  rationale: 'Исправлена только русская идиоматика и устранена нежелательная двусмысленность: внутреннее счисление теперь выражено глагольным оборотом «про себя считает». Смысл, афористический регистр, контраст прямой речи с сердечным расположением и сноска о лексической альтернативе сохранены.'
