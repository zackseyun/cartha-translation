id: PRO.23.34
reference: Proverbs 23:34
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ֭/הָיִיתָ כְּ/שֹׁכֵ֣ב בְּ/לֶב יָ֑ם וּ֝/כְ/שֹׁכֵ֗ב בְּ/רֹ֣אשׁ חִבֵּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/034.yaml
  text: And you will be like one lying down in the heart of the sea[a], like one lying down on the top of the mast.
translation:
  language: ru
  text: И будешь ты словно лежащий посреди моря, словно лежащий на верхушке мачты[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово חִבֵּל может обозначать корабельные снасти, канаты или связанное с ними судовое оснащение; перевод «мачта» следует традиционному контекстуальному пониманию.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: И будешь ты
  rationale: Форма глагола היה с союзом в контексте предостережения имеет результативно-будущее значение; сохранено прямое обращение во втором лице.
- source_word: כְּשֹׁכֵב / וּכְשֹׁכֵב
  choice: словно лежащий / словно лежащий
  rationale: Причастие שׁכב обозначает пребывание в лежачем положении. Повтор сохраняет поэтический параллелизм и не добавляет отсутствующего в тексте значения сна.
- source_word: בְּלֶב יָם
  choice: посреди моря
  rationale: Буквально לֵב означает «сердце», но в таком сочетании естественно обозначает внутреннюю часть или середину; «посреди моря» ясно и образно передаёт смысл по-русски.
- source_word: בְּרֹאשׁ
  choice: на верхушке
  rationale: רֹאשׁ здесь указывает на верхнюю, наиболее высокую часть предмета и подчёркивает опасность положения.
- source_word: חִבֵּל
  choice: мачты
  rationale: В морском контексте традиционное понимание как «мачта» создаёт ясный и естественный образ, однако редкое еврейское слово допускает связь с канатами или корабельными снастями; неопределённость отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и морского образа. Оборот «словно лежащий» слегка возвышен, но понятен и близок к форме еврейского причастия.
