  text: כִּֽי שׁוּחָ֣ה עֲמֻקָּ֣ה זוֹנָ֑ה וּ/בְאֵ֥ר צָ֝רָ֗ה נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/027.yaml
  text: For a prostitute is a deep pit[a], and a foreign woman is a narrow well.
translation:
  language: ru
  text: Ибо проститутка — глубокая яма, и чужая женщина[a] — узкий колодец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземка»; по смыслу также возможно: «прелюбодейка».'
    reason: 'Сохраняется диапазон значений נָכְרִיָּה: от чужой или иноземной женщины до контекстуально подразумеваемой участницы недозволенной связи.'
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующего предостережения; «ибо» ясно передаёт пояснительную связь и соответствует возвышенному, но понятному регистру притчи.
- source_word: שׁוּחָה
  choice: яма
  rationale: Передаёт глубокое углубление или яму, сохраняя конкретный образ опасности без добавочного истолкования как ловушки.
- source_word: עֲמֻקָּה
  choice: глубокая
  rationale: Прямо и естественно передаёт определение к слову «яма».
- source_word: זוֹנָה
  choice: проститутка
  rationale: Современное и точное обозначение женщины, занимающейся проституцией; оно избегает как архаичности слова «блудница», так и чрезмерно грубой лексики.
- source_word: וּבְאֵר
  choice: а … колодец
  rationale: בְּאֵר обычно означает «колодец». Союз «а» естественно оформляет поэтический параллелизм и не меняет смысл еврейского соединительного союза.
- source_word: צָרָה
  choice: тесный
  rationale: Передаёт узость и стеснённость колодца, сохраняя конкретный образ западни, из которой трудно выбраться.
- source_word: נָכְרִיָּה
  choice: чужая женщина
  rationale: Выражение естественно по-русски передаёт женщину, которая является посторонней или не принадлежащей к дозволенному кругу отношений, при этом не сводя значение исключительно к этнической чужеземности или прелюбодеянию.
theological_decisions:
- issue: Значение נָכְרִיָּה в предостережениях литературы мудрости
  choice: чужая женщина
  alternative: чужеземка; прелюбодейка
  rationale: Еврейское слово буквально указывает на чужую, постороннюю или иноземную женщину, но в Притчах приобретает нравственный оттенок сексуально недозволенной связи. Основной текст сохраняет эту многозначность, а примечание приводит более буквальный и более истолковательный варианты.
translation_notes:
  register: Современный литературный русский язык с кратким, образным синтаксисом притчи. Слова «яма» и «колодец» сохраняют параллельные конкретные образы оригинала; «проститутка» выбрано как точное современное слово без архаизации.
