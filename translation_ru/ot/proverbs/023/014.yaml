base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/014.yaml
  text: You shall strike him with the rod[b][a], and you will deliver his life from Sheol.
translation:
  language: ru
  text: Ты ударишь его розгой и спасёшь его жизнь[a] от шеола[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его душу». Еврейское слово нефеш в зависимости от контекста может означать жизнь, самого человека или душу.'
    reason: lexical_alternative
  - marker: b
    text: 'Шеол — древнееврейское обозначение мира мёртвых; возможный перевод: «могила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשֵּׁבֶט
  choice: розгой
  rationale: В контексте родительского наставления שֵׁבֶט обозначает прут или розгу как конкретное орудие наказания. «Розга» естественно передаёт этот смысл по-русски, не заменяя физический образ более общим словом «наказание».
- source_word: תַּכֶּנּוּ
  choice: ударишь его
  rationale: Форма от נכה прямо обозначает нанесение удара. «Ударишь» сохраняет конкретное действие еврейского текста и звучит менее чрезмерно, чем «изобьёшь».
- source_word: נַפְשׁוֹ
  choice: его жизнь
  rationale: נֶפֶשׁ может означать жизнь, самого человека или душу. В сочетании с избавлением от шеола «его жизнь» ясно передаёт контекстуальный смысл, не навязывая узкое антропологическое толкование.
- source_word: מִשְּׁאוֹל
  choice: от шеола
  rationale: Транслитерация сохраняет особое древнееврейское обозначение мира мёртвых и не сводит его значение исключительно к отдельной могиле. Значение поясняется в сноске.
- source_word: תַּצִּיל
  choice: спасёшь
  rationale: Каузативная форма от נצל означает избавить или спасти от опасности. «Спасёшь» естественно сочетается в русском языке со словом «жизнь» и передаёт избавление от смерти.
theological_decisions:
- issue: Значение נֶפֶשׁ в связи с шеолом
  choice: его жизнь
  alternative: его душу
  rationale: Притча говорит о сохранении ребёнка от пути, ведущего к смерти или погибели. Перевод «жизнь» передаёт вероятный идиоматический смысл, а вариант «душу» сохраняется в сноске, чтобы не устранять присущую слову смысловую широту.
translation_notes:
  register: Современный литературный русский язык с кратким, назидательным строем притчи. Конкретный образ розги сохранён без смягчающего пересказа; термин «шеол» оставлен ради смысловой точности и пояснён в сноске.
