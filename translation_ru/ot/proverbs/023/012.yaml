  text: הָבִ֣יאָ/ה לַ/מּוּסָ֣ר לִבֶּ֑/ךָ וְ֝/אָזְנֶ֗/ךָ לְ/אִמְרֵי דָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/012.yaml
  text: Apply your heart to instruction[a], and your ear to words of knowledge.
translation:
  language: ru
  text: Обрати сердце своё к наставлению[a], и ухо своё — к словам знания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приведи сердце своё к дисциплине, и ухо своё — к изречениям знания».'
    reason: Лексика הָבִיאָה буквально означает «приведи», а מוּסָר может означать не только наставление, но и дисциплину или исправление.
lexical_decisions:
- source_word: הָבִיאָה
  choice: Обрати
  rationale: Каузативный императив буквально означает «принеси», но в сочетании с «сердцем» выражает намеренное направление внутреннего человека к чему-либо. «Обрати» естественно передаёт этот смысл и сохраняет повелительную форму.
- source_word: לַמּוּסָר
  choice: к наставлению
  rationale: מוּסָר охватывает наставление, дисциплину и исправление. Параллель со «словами знания» выдвигает на первый план обучающий смысл, тогда как примечание сохраняет дисциплинарный оттенок.
- source_word: לִבֶּךָ
  choice: сердце своё
  rationale: В древнееврейском «сердце» обозначает внутреннего человека, включая разум и волю; буквальный образ понятен и уместен по-русски.
- source_word: וְאָזְנֶךָ
  choice: и ухо своё
  rationale: Сохранено единственное число исходного текста и поэтический параллелизм с «сердцем».
- source_word: לְאִמְרֵי
  choice: к словам
  rationale: «Слова» естественно передаёт форму множественного числа אִמְרֵי; возможное «изречения» было бы более книжным.
- source_word: דָעַת
  choice: знания
  rationale: Прямой эквивалент דַּעַת, соответствующий контексту мудрого наставления.
