lexical_decisions:
- source_word: כִּי אִם
  choice: Ведь… непременно
  rationale: Сочетание выражает уверенное заверение и одновременно сохраняет связь с предыдущим стихом; такой порядок слов естественен для современного русского языка.
- source_word: יֵשׁ
  choice: есть
  rationale: Естественная русская передача бытийной частицы.
- source_word: אַחֲרִית
  choice: будущее
  rationale: Слово может обозначать конец, исход или будущее; в контексте надежды значение «будущее» наиболее естественно передаёт положительную перспективу, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: וְתִקְוָתְךָ
  choice: и надежда твоя
  rationale: «Надежда» точно и естественно передаёт תִּקְוָה в контексте положительного ожидания; постпозиция местоимения поддерживает достойный библейский регистр без архаизации.
- source_word: לֹא תִכָּרֵת
  choice: не будет отсечена
  rationale: Сохранён конкретный образ глагола כרת «отсекать» и страдательное значение нифаля; выражение понятно по-русски и не заменяет метафору толкованием.
