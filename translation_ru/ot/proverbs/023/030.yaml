base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/030.yaml
  text: For those who linger over wine[a], for those who come to search out mixed wine.
translation:
  language: ru
  text: У тех, кто подолгу сидит за вином, кто приходит искать смешанного вина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вина с пряностями» или «винной смеси». Еврейское слово обозначает вино, смешанное с другими составляющими, возможно для изменения его вкуса или крепости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֲרִים עַל הַיָּיִן
  choice: подолгу сидит за вином
  rationale: Причастие от אחר обозначает задержку или долгое пребывание; русское выражение естественно передаёт продолжительное сидение за вином, не добавляя прямо идеи опьянения.
- source_word: בָּאִים
  choice: приходит
  rationale: Сохранено прямое значение глагола «приходить», в соответствии с еврейским текстом, вместо контекстуально возможного «идёт».
- source_word: לַחְקֹר
  choice: искать
  rationale: Глагол выражает целенаправленный поиск или исследование; «искать» здесь звучит естественно и сохраняет активное стремление найти такой напиток.
- source_word: מִמְסָךְ
  choice: смешанное вино
  rationale: Существительное обозначает приготовленную винную смесь; точный состав смеси в тексте не указан, поэтому перевод не уточняет, были ли это пряности или иные добавки.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык. Начальное «У тех» сохраняет связь с серией вопросов в предыдущем стихе, на которые эта строка отвечает. Формулировка остаётся ясной и достойной, без архаизмов.
