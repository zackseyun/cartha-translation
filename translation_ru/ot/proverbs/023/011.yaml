  text: כִּֽי גֹאֲלָ֥/ם חָזָ֑ק הֽוּא יָרִ֖יב אֶת רִיבָ֣/ם אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/011.yaml
  text: for their Redeemer is strong[a]; he will plead their case against you.
translation:
  language: ru
  text: ибо их заступник[a] силён; он будет вести их тяжбу против тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их родственник-искупитель» или «защитник их прав». Еврейское גֹאֵל обозначает того, кто выкупает, защищает или восстанавливает права члена своей семьи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предшествующего запрета; «потому что» ясно передаёт причинную связь.
- source_word: גֹאֲלָם
  choice: их Искупитель
  rationale: גאל обозначает того, кто как ближайший родственник выкупает, защищает права и добивается справедливости. «Искупитель» сохраняет ёмкость и богословско-правовой вес слова; возможные оттенки пояснены в сноске.
- source_word: חָזָק
  choice: силён
  rationale: Прилагательное подчёркивает силу и способность защитника действенно выступить за уязвимых.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение выделяет действующего субъекта; явное «он» естественно сохраняет это ударение.
- source_word: יָרִיב אֶת רִיבָם
  choice: вступится за них в тяжбе
  rationale: Однокоренная конструкция буквально означает «будет вести их тяжбу» и несёт судебно-состязательный смысл. Выбранная формулировка передаёт как защиту, так и юридический образ без неестественного повтора.
- source_word: אִתָּךְ
  choice: с тобой
  rationale: При ריב предлог обозначает противную сторону спора. В сочетании «в тяжбе с тобой» противостояние однозначно, при этом сохраняется форма еврейского выражения.
theological_decisions:
- issue: Передача גֹאֵל в контексте литературы мудрости
  choice: Искупитель
  alternative: родственник-заступник; защитник прав
  rationale: «Искупитель» сохраняет традиционный и богословский резонанс термина, но не сводит его к одному действию. Сноска раскрывает семейно-правовой смысл, не утверждая сверх текста, является ли здесь גֹאֵל непосредственно Богом или иной, установленной им защитной фигурой.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясным судебным образом. «Тяжба» несколько возвышенно, но общеупотребительно и точно передаёт юридическую окраску ריב; строчная форма начала сохранена, поскольку стих продолжает мысль предыдущего наставления.
