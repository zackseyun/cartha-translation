lexical_decisions:
- source_word: תְּנָה
  choice: отдай
  rationale: Императив от נתן выражает прямой призыв. «Отдай» естественно сочетается в русском с образом сердца и передаёт направленность дара говорящему.
- source_word: בְנִי
  choice: Сын мой
  rationale: Сохраняет мужское единственное обращение и притяжательный суффикс оригинала; это естественная для русского наставительного регистра форма.
- source_word: לִבְּךָ
  choice: своё сердце
  rationale: «Сердце» сохраняет древнееврейский образ внутреннего человека, включая волю, разум и расположение. Возвратное «своё» нормативно при обращении ко второму лицу.
- source_word: לִי
  choice: мне
  rationale: 'Дательный падеж естественно передаёт адресата действия: «отдай мне».'
- source_word: וְעֵינֶיךָ
  choice: и пусть глаза твои
  rationale: Конструкция с «пусть» передаёт волевой оттенок формы и сохраняет образ глаз; постпозиция «твои» поддерживает dignified, но современно понятный библейский регистр.
- source_word: דְּרָכַי
  choice: мои пути
  rationale: דרך в литературе мудрости обозначает как путь, так и образ жизни. «Мои пути» сохраняет метафору и её нравственную ёмкость.
- source_word: תרצנה (תִּרְצֶנָה)
  choice: благосклонно смотрят
  rationale: Форма от רצה допускает смысл благоволения, одобрения или удовольствия, а в данной конструкции также связывается со внимательным наблюдением. Выражение сохраняет зрительный образ и передаёт положительное расположение, не сводя смысл только к эмоциональному восторгу.
