  text: אַל תַּ֭סֵּג גְּב֣וּל עוֹלָ֑ם וּ/בִ/שְׂדֵ֥י יְ֝תוֹמִ֗ים אַל תָּבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/010.yaml
  text: Do not move an ancient boundary marker[a], and do not enter the fields of orphans,
translation:
  language: ru
  text: Не передвигай древней межи[a] и не входи на поля сирот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не отодвигай издавна установленную границу».'
    reason: 'Лексическое уточнение: גְּבוּל может обозначать как межу или межевой знак, так и саму границу участка; תַּסֵּג допускает оттенок отодвигания границы.'
lexical_decisions:
- source_word: תַּסֵּג
  choice: передвигай
  rationale: Глагол נסג в данном контексте означает смещение установленной границы ради захвата части чужой земли. «Передвигай» естественно передаёт конкретное действие, не добавляя мотива прямо в текст.
- source_word: גְּבוּל
  choice: межи
  rationale: Здесь существительное обозначает установленную границу земельного участка, вероятно отмеченную межевым знаком. Русское «межа» кратко и естественно передаёт этот земельно-правовой смысл.
- source_word: עוֹלָם
  choice: древней
  rationale: В сочетании с границей участка слово указывает на её давнее, издавна установленное происхождение, а не на метафизическую вечность.
- source_word: וּבִשְׂדֵי
  choice: и ... на поля
  rationale: Предлог ב при глаголе движения выражает вхождение на территорию; по-русски естественно сказать «входить на поля».
- source_word: יְתוֹמִים
  choice: сирот
  rationale: Слово обозначает детей, лишённых отца и потому особенно уязвимых в имущественном отношении. Современное «сироты» понятно и не требует уточнения пола умершего родителя в основном тексте.
- source_word: תָּבֹא
  choice: входи
  rationale: Глагол בוא с предлогом ב буквально выражает вход или приход на поля; «не входи» сохраняет форму запрета и не делает подразумеваемое посягательство явным сверх исходного текста.
