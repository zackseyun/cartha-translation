lexical_decisions:
- source_word: תִּלְחַם
  choice: ешь
  rationale: В сочетании с לֶחֶם глагол означает принятие пищи, а не «сражаться»; русское «есть хлеб» естественно передаёт смысл и сохраняет образ.
- source_word: לֶחֶם
  choice: хлеба
  rationale: Сохраняет буквальный образ еврейского текста; здесь «хлеб» также обозначает пищу или угощение в целом.
- source_word: רַע עָיִן
  choice: человека с недобрым глазом
  rationale: Формулировка сохраняет еврейский образ и при этом звучит понятнее по-русски, чем буквальное «злого глазом»; значение идиомы поясняется в сноске.
- source_word: תתאו
  choice: не желай
  rationale: Форма выражает сильное желание; «не желай» естественно и достойно звучит в русском тексте, не добавляя чрезмерной эмоциональной окраски.
- source_word: לְמַטְעַמֹּתָיו
  choice: его лакомств
  rationale: «Лакомства» передают смысл привлекательных, вкусных блюд и сохраняют краткость поэтической строки.
