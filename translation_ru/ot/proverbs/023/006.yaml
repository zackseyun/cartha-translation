  text: Не ешь хлеба у скупого и не желай его лакомств.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб человека с дурным глазом». Еврейское выражение «дурной глаз» — идиома, обозначающая скупого, неохотно угощающего человека.'
