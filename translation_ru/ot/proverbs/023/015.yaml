  text: My son[a], if your heart is wise, my heart also will rejoice.
translation:
  language: ru
  text: Сын мой, если сердце твоё мудро, будет радоваться и моё сердце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет радоваться моё сердце — да, я сам»; так полнее передаётся усилительное значение еврейского выражения, которое можно понять как «и я» или «даже я».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Буквальное обращение в мужском роде сохранено; оно естественно для наставлений книги Притч.
- source_word: אִם
  choice: если
  rationale: Частица вводит прямое условие, не требуя более определённого временного значения «когда».
- source_word: חָכַם
  choice: мудро
  rationale: Перфект стативного глагола в условной конструкции передаёт состояние сердца; по-русски естественно «сердце мудро».
- source_word: לִבֶּךָ
  choice: сердце твоё
  rationale: Сохранён образ сердца как средоточия мысли, воли и внутренней жизни, а также параллелизм с «моё сердце».
- source_word: יִשְׂמַח
  choice: будет радоваться
  rationale: Имперфект после условия естественно выражает последующее или ожидаемое состояние радости.
- source_word: לִבִּי
  choice: моё сердце
  rationale: Сохранено явно названное в еврейском тексте сердце, а не заменено местоимением «я», чтобы передать поэтический параллелизм.
- source_word: גַם אָנִי
  choice: и моё сердце
  rationale: Частица גַם передана добавочным «и»; сочетание с אָנִי подчёркивает личную радость говорящего. Более буквальный эмфатический вариант вынесен в примечание.
