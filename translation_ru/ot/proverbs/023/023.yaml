translation:
  language: ru
  text: Купи истину[a] и не продавай мудрость, наставление[b] и понимание[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приобретай истину». Еврейский глагол может означать «купить» или, шире, «приобрести», однако образ купли, вероятно, намеренно сохранён: далее сказано «не продавай».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дисциплину», «исправление».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «проницательность», «разумение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: истину
  rationale: В контексте наставления мудрости אֱמֶת естественно передаётся словом «истина», сохраняющим познавательный и нравственный оттенки.
- source_word: קְנֵה
  choice: купи
  rationale: Императив может означать «купи» или шире «приобрети», однако «купи» сохраняет намеренный торговый образ, поддержанный следующим «не продавай».
- source_word: וְאַל תִּמְכֹּר
  choice: и не продавай её
  rationale: Отрицательный императив передан прямо; местоимение «её» естественно связывает глагол с «истиной» и делает русскую фразу ясной.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычный и точный эквивалент в Книге Притч, обозначающий практическое и нравственное искусство верной жизни.
- source_word: מוּסָר
  choice: наставление
  rationale: Слово охватывает наставление, дисциплину и исправление. «Наставление» наиболее естественно в данном перечне и не сужает смысл до наказания.
- source_word: בִינָה
  choice: понимание
  rationale: Широкий и естественный русский эквивалент, сохраняющий значение способности понимать и различать.
