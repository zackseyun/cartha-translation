translation:
  language: ru
  text: И приставь нож к своему горлу, если ты падок на еду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если ты неумерен в еде»; возможно: «если ты обжора». Еврейское выражение буквально означает «обладатель души (желания, аппетита)» и здесь описывает человека, которым владеет сильный аппетит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  choice: и приставь
  rationale: Вав с формой перфекта 2-го лица продолжает наставление предыдущего стиха; по-русски естественно передать это побудительной формой. «Приставь» хорошо сочетается с ножом и горлом.
- source_word: שַׂכִּין
  choice: нож
  rationale: Прямое современное соответствие существительному со значением «нож»; сохраняет резкий гиперболический образ.
- source_word: בְּ/לֹעֶךָ
  choice: к своему горлу
  rationale: לֹעַ означает «горло, глотка». После глагола «приставить» предлог «к» естественно передаёт пространственное отношение, не создавая буквального смысла помещения ножа внутрь горла.
- source_word: אִם
  choice: если
  rationale: Сохраняет условное значение еврейской частицы.
- source_word: בַּעַל נֶפֶשׁ
  choice: падок до еды
  rationale: Буквально выражение означает «обладатель/господин души (желания, аппетита)» и в контексте трапезы описывает человека, которым владеет сильный аппетит. Русская идиома передаёт эту характеристику естественно, не сужая её до однозначного обвинения в обжорстве.
- source_word: אָתָּה
  choice: ты
  rationale: Самостоятельное местоимение подчёркивает субъект условной конструкции; в русском оно выражено явно.
