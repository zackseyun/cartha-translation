lexical_decisions:
- source_word: אַחֲרִיתוֹ
  choice: А под конец
  rationale: Существительное с местоименным суффиксом буквально означает «его конец», то есть конечный исход вина из ближайшего контекста. Наречное «под конец» естественно передаёт этот смысл по-русски.
- source_word: כְּנָחָשׁ
  choice: как змея
  rationale: נָחָשׁ — обычное обозначение змеи; нейтральное современное «змея» не привносит лишних ассоциаций.
- source_word: יִשָּׁךְ
  choice: укусит
  rationale: Глагол נשׁך означает «кусать». Будущее совершенного вида естественно выражает последующий пагубный результат, обозначенный словами «под конец».
- source_word: וּכְצִפְעֹנִי
  choice: и … как гадюка
  rationale: צִפְעֹנִי обозначает ядовитую змею. «Гадюка» — понятное современному русскому читателю видовое название ядовитой змеи.
- source_word: יַפְרִשׁ
  choice: ужалит
  rationale: Значение редкого глагола в данном месте спорно. Традиционное «ужалит» сохраняет параллелизм с «укусит», а иные предлагаемые значения отмечены в сноске.
