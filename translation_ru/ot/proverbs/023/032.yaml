  text: In the end it bites like a snake[c][b][a], and it stings like a viper.
translation:
  language: ru
  text: В конце концов оно кусает, как змея, и жалит, как гадюка.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение последнего еврейского глагола не вполне ясно; возможны также переводы: «нападёт» или «распространит яд».'
