  text: אַל תְּהִ֥י בְ/סֹֽבְאֵי יָ֑יִן בְּ/זֹלֲלֵ֖י בָשָׂ֣ר לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/020.yaml
  text: Do not be among heavy drinkers of wine[a], among gluttonous eaters of meat,
translation:
  language: ru
  text: Не будь среди тех, кто упивается вином, среди тех, кто объедается мясом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «среди тех, кто объедается мясом себе в угоду». Конечное еврейское слово לָמוֹ синтаксически неясно и может служить лишь усилением, не добавляя отдельной мысли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Не будь
  rationale: Отрицательная частица אַל с формой имперфекта/юссива выражает запрет; «не будь» естественно передаёт и форму, и смысл предостережения против такого сообщества.
- source_word: בְסֹבְאֵי יָיִן
  choice: среди тех, кто упивается вином
  rationale: Предлог בְּ указывает на пребывание среди кого-либо, а סבא — на чрезмерное, привычное употребление вина. «Упивается» передаёт излишество, не сводя выражение только к состоянию опьянения.
- source_word: בְזֹלֲלֵי בָשָׂר
  choice: среди тех, кто объедается мясом
  rationale: Причастная форма זֹלֲלֵי обозначает тех, кто ест без меры; בָשָׂר здесь означает мясо как пищу. Развёрнутая формулировка сохраняет деятельный и привычный характер выражения.
- source_word: לָמוֹ
  choice: отдельно в основном тексте не передано
  rationale: Конечное לָמוֹ синтаксически затруднительно и, вероятно, усиливает предшествующее выражение, не добавляя самостоятельной мысли. Возможное буквальное значение отражено в сноске.
theological_decisions: []
