  text: שְׁמַ֣ע לְ֭/אָבִי/ךָ זֶ֣ה יְלָדֶ֑/ךָ וְ/אַל תָּ֝ב֗וּז כִּֽי זָקְנָ֥ה אִמֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/022.yaml
  text: Listen to your father[a], who fathered you[b], and do not despise your mother when she is old.
translation:
  language: ru
  text: Слушай своего отца, который породил тебя, и не презирай твою мать, когда она состарится.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда она состарилась»; еврейская форма может подчёркивать уже наступившее состояние старости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע לְאָבִיךָ
  choice: Слушай отца твоего
  rationale: Императив שׁמע с ל обозначает не просто слышание, а внимательное послушание. «Слушай» естественно передаёт силу наставления, а форма «отца твоего» поддерживает достоинство поэтической речи.
- source_word: זֶה יְלָדֶךָ
  choice: который породил тебя
  rationale: Указательное זֶה после слова «отец» выполняет пояснительно-относительную функцию; по-русски она естественно передаётся словом «который». Глагол ילד при отце как субъекте означает «породил», то есть стал твоим родителем.
- source_word: וְאַל תָּבוּז
  choice: и не презирай
  rationale: בוז означает относиться с презрением, считать недостойным уважения. «Не презирай» точно и кратко сохраняет силу запрета.
- source_word: כִּי זָקְנָה אִמֶּךָ
  choice: когда она состарится
  rationale: כִּי здесь естественно понимать как вводящее обстоятельство времени. Перфект זָקְנָה описывает наступившую старость; русское будущее совершенного вида уместно в общем наставлении.
