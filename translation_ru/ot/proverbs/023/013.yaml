  text: אַל תִּמְנַ֣ע מִ/נַּ֣עַר מוּסָ֑ר כִּֽי תַכֶּ֥/נּוּ בַ֝/שֵּׁ֗בֶט לֹ֣א יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/013.yaml
  text: Do not withhold discipline from a boy[a], for if you strike him with the rod[b], he will not die.
translation:
  language: ru
  text: 'Не оставляй мальчика[a] без наказания: ибо, если ударишь его розгой[b], он не умрёт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ребёнка» или «юношу». Еврейское слово может обозначать мальчика или молодого человека; в основном тексте сохранены мужской род и единственное число притчи.'
    reason: lexical_alternative
  - marker: b
    text: Притча утверждает, что такое исправление само по себе не смертельно; её не следует понимать как безоговорочное одобрение жестокого обращения или как абсолютную гарантию для любого случая.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Не лишай
  rationale: Запрет с глаголом מןע передан естественной русской формой; сочетание «лишать наставления» сохраняет смысл удерживания или недоставления необходимого исправления.
- source_word: מִנַּעַר
  choice: отрока
  rationale: נַעַר обозначает мальчика, ребёнка мужского пола или юношу. «Отрок» сохраняет мужской род и возрастную широту слова, оставаясь понятным в возвышенном регистре Притч.
- source_word: מוּסָר
  choice: наставления
  rationale: В Притчах מוּסָר охватывает воспитание, исправление и дисциплину. «Наставление» здесь естественно по-русски и не сводит значение лишь к наказанию, тогда как следующая строка конкретизирует телесную меру исправления.
- source_word: כִּי
  choice: если
  rationale: 'В сочетании с последующим утверждением כִּי допускает условно-обосновывающую передачу: запрет удерживать наставление поясняется тем, что удар розгой не приведёт к смерти. Русское «если» ясно выражает синтаксическую связь.'
- source_word: תַכֶּנּוּ
  choice: ударишь его
  rationale: Глагол נכה прямо обозначает нанесение удара. Выбор сохраняет конкретный образ, не усиливая его до «изобьёшь» и не заменяя толкованием «накажешь».
- source_word: בַשֵּׁבֶט
  choice: розгой
  rationale: שֵׁבֶט может значить жезл, посох или прут. В контексте домашнего телесного исправления «розга» — точный и привычный русский эквивалент инструментального оборота.
- source_word: לֹא יָמוּת
  choice: он не умрёт
  rationale: Сохранено прямое отрицательное утверждение еврейского текста без добавления причинного уточнения или смягчения.
theological_decisions:
- issue: Возраст и пол обозначенного словом נַעַר
  choice: В основном тексте употреблено мужское «отрок»
  alternative: ребёнок; мальчик; юноша
  rationale: Еврейское существительное и последующие местоименные формы стоят в мужском единственном числе, но возрастной диапазон слова широк. Основной текст сохраняет эту форму, а примечание отмечает возможные переводы.
- issue: Характер утверждения о телесном исправлении
  choice: Прямо переведено «он не умрёт»
  alternative: «он от этого не умрёт»; «это его не убьёт»
  rationale: Текст формулирует краткое пословичное заверение. Интерпретирующее ограничение не внесено в основной текст; примечание предупреждает, что стих нельзя превращать в одобрение жестокости или безусловную гарантию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром книги Притч. «Отрок» и «розга» сохраняют краткость, мужскую форму и древний бытовой образ, не делая синтаксис архаичным.
