lexical_decisions:
- source_word: גול יגול
  choice: безмерно радуется
  rationale: Сочетание инфинитива абсолютного с личной формой того же глагола усиливает значение. По-русски это естественно передаётся наречием «безмерно», тогда как буквальный повтор звучал бы неестественно.
- source_word: אֲבִי צַדִּיק
  choice: отец праведного
  rationale: Сопряжённая конструкция означает отца конкретного праведного человека; мужской род и единственное число сохранены без лишнего добавления слова «сын».
- source_word: צַדִּיק
  choice: праведного
  rationale: «Праведный» сохраняет нравственно-религиозную категорию исходного слова и соответствует его форме мужского рода единственного числа.
- source_word: יולד
  choice: родивший
  rationale: Причастие мужского рода от ילד здесь обозначает того, кто породил ребёнка. «Родивший» достаточно естественно в поэтической речи и не добавляет отсутствующего в еврейском тексте существительного.
- source_word: חָכָם
  choice: мудрого
  rationale: В еврейском тексте стоит субстантивированное прилагательное «мудрый» без явно выраженного слова «сын». Русская форма «мудрого» сохраняет эту сжатость и контекстуально понятную сыновнюю связь.
- source_word: וישמח בו
  choice: радуется ему
  rationale: Так переданы значение שמח и местоименный суффикс с предлогом ב; выражение указывает на мудрого как на предмет и источник радости.
