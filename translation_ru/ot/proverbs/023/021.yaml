  text: כִּי סֹבֵ֣א וְ֭/זוֹלֵל יִוָּרֵ֑שׁ וּ֝/קְרָעִ֗ים תַּלְבִּ֥ישׁ נוּמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/021.yaml
  text: For the drunkard and the glutton will come to poverty[a], and drowsiness will clothe one with rags.
translation:
  language: ru
  text: 'Потому что пьяница и обжора обеднеют,

    а сонливость оденет человека в лохмотья.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹבֵא
  choice: пьяница
  rationale: Существительное обозначает человека, привычно предающегося пьянству, а не просто того, кто в данный момент пьян. «Пьяница» кратко и естественно передаёт нравственную характеристику.
- source_word: זוֹלֵל
  choice: обжора
  rationale: В данном сочетании с «пьяницей» слово обозначает невоздержанного, прожорливого человека. «Обжора» сохраняет конкретный образ чрезмерного употребления пищи.
- source_word: יִוָּרֵשׁ
  choice: обеднеют
  rationale: Форма нифаль от ירש здесь выражает наступление бедности. Русское «обеднеют» естественно передаёт результат поведения; единственное число еврейского сказуемого при паре обозначений допускает обобщённое согласование, тогда как по-русски требуется множественное число.
- source_word: קְרָעִים
  choice: лохмотья
  rationale: Слово обозначает разорванную, ветхую одежду. «Лохмотья» ярко и естественно передаёт образ крайней бедности.
- source_word: תַּלְבִּישׁ
  choice: оденет
  rationale: Глагол в породе хифиль буквально означает «одевать, облекать». «Оденет» сохраняет прямую метафору еврейского текста.
- source_word: נוּמָה
  choice: сонливость
  rationale: Существительное может обозначать сонливость или дремоту. «Сонливость» в современном русском языке передаёт состояние вялой склонности ко сну, которое в контексте ведёт к нужде.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; афористичная причинно-следственная форма и параллелизм сохранены. Добавлен обобщённый объект «человека», поскольку русский переходный глагол «оденет» требует явного дополнения, тогда как в еврейской поэтической строке оно подразумевается. Лексическая неоднозначность נוּמָה отражена основным естественным эквивалентом «сонливость» без необходимости в сноске.
