source:
  edition: WLC
  text: אַל תִּ֭תְאָו לְ/מַטְעַמּוֹתָ֑י/ו וְ֝/ה֗וּא לֶ֣חֶם כְּזָבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/003.yaml
  text: Do not crave his delicacies[a], for they are deceptive food.
translation:
  language: ru
  text: Не желай его лакомств, ведь это пища обмана[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб лжи» или «хлеб обманов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְאָו
  choice: Не желай
  rationale: Отрицательная частица с формой глагола выражает запрет; глагол אוה обозначает сильное желание. «Не желай» звучит естественно и не добавляет отсутствующего в тексте сексуального оттенка.
- source_word: לְמַטְעַמּוֹתָיו
  choice: его лакомств
  rationale: Существительное обозначает вкусные, изысканные кушанья; «лакомства» кратко и естественно передаёт их привлекательность.
- source_word: וְהוּא
  choice: ведь это
  rationale: Местоимение стоит в мужском роде единственного числа и отсылает к пище как к целому; союз по смыслу вводит основание для предостережения.
- source_word: לֶחֶם כְּזָבִים
  choice: пища обмана
  rationale: לֶחֶם может означать не только хлеб, но и пищу вообще, а сочетание с כְּזָבִים буквально выражает связь с ложью или обманом. Формулировка сохраняет ёмкую метафору и не уточняет сверх текста, обманчива ли сама пища или обман скрывается за угощением.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая форма сохраняет афористичность притчи. «Пища обмана» оставляет открытым образный смысл еврейского сочетания и не сводит его только к характеристике еды.
