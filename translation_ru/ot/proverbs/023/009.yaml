  source_fidelity: 'Основной смысл передан верно: запрет говорить так, чтобы глупец слышал, и причина — его презрение к смысловой содержательности сказанного. Однако «в присутствии» шире еврейской идиомы «в уши / в пределах слышимости» и может включать ситуацию, где человек не слышит. «Услышит» естественно и точнее передаёт прагматический смысл выражения.'
  naturalness: «Не говори так, чтобы глупец тебя услышал» — естественная современная литературная формулировка и сохраняет краткий наставительный характер. «Он презрит здравый смысл твоих слов» понятно, но «смысл твоих слов» звучит более естественно и точнее отражает שֵׂכֶל как разумность/проницательность высказывания.
