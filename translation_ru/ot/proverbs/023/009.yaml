  text: בְּ/אָזְנֵ֣י כְ֭סִיל אַל תְּדַבֵּ֑ר כִּֽי יָ֝ב֗וּז לְ/שֵׂ֣כֶל מִלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/009.yaml
  text: Do not speak in the hearing of a fool[b][a], for he will despise the wisdom of your words.
translation:
  language: ru
  text: Не говори так, чтобы глупец тебя услышал[a], потому что он презрит смысл твоих слов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в уши глупца».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «здравый смысл твоих слов»; возможно: «разумность твоих слов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  choice: в присутствии
  rationale: Буквально выражение означает «в уши»; здесь это идиома речи в пределах слышимости человека. «В присутствии» естественно передаёт смысл по-русски, а исходный образ сохранён в сноске.
- source_word: כְסִיל
  choice: глупца
  rationale: В литературе мудрости это не просто человек с невысоким интеллектом, а нравственно и рассудочно упрямый человек. «Глупец» — традиционный и точный русский эквивалент.
- source_word: אַל תְּדַבֵּר
  choice: не говори
  rationale: Прямой запрет, выраженный отрицательной частицей с глаголом; краткая форма соответствует афористическому стилю притчи.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание запрета. «Потому что» ясно и естественно выражает причинную связь.
- source_word: יָב֗וּז
  choice: он презрит
  rationale: Глагол обозначает презрительное отношение или отвержение. «Презрит» сохраняет силу и лаконичность еврейского текста.
- source_word: לְ/שֵׂכֶל
  choice: здравый смысл
  rationale: שֵׂכֶל может означать разумность, рассудительность, здравый смысл или проницательность. В сочетании со «словами» выражение «здравый смысл» звучит естественно и не расширяет значение до всей полноты мудрости.
- source_word: מִלֶּֽי/ךָ
  choice: твоих слов
  rationale: Сохраняется конкретное значение множественного существительного «слова, высказывания» и его связь со שֵׂכֶל.
