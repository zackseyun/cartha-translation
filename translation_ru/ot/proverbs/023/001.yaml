  text: When you sit down to dine with a ruler[a], carefully consider what is before you.
translation:
  language: ru
  text: Когда сядешь за трапезу с правителем, тщательно обдумай то, что перед тобой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что поставлено перед тобой». Еврейское выражение может указывать непосредственно на пищу на столе, но может подразумевать и всю ситуацию, в которой оказался гость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном наставлении вводит типичную жизненную ситуацию, а не причинное объяснение; «когда» естественно передаёт условно-временной оттенок.
- source_word: תֵשֵׁב
  choice: сядешь
  rationale: Форма от ישׁב буквально обозначает сидение; в сочетании с упоминанием еды по-русски естественно «сядешь за трапезу».
- source_word: לִלְחוֹם
  choice: за трапезу
  rationale: Инфинитив от לחם здесь означает принятие пищи. Выражение передаёт официальный контекст еды у правителя, не сводя смысл к простому «есть».
- source_word: אֶת מוֹשֵׁל
  choice: с правителем
  rationale: מוֹשֵׁל — человек, наделённый властью; при глаголе принятия пищи конструкция по смыслу указывает на совместную трапезу.
- source_word: בִּין תָּבִין
  choice: внимательно присмотрись
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает призыв к осмотрительности и пониманию; выбранная формулировка звучит естественно и сохраняет эмфатический оттенок.
- source_word: אֶת אֲשֶׁר לְפָנֶיךָ
  choice: к тому, что перед тобой
  rationale: Фраза допускает как буквальное указание на поставленную пищу, так и более широкий намёк на всю ситуацию; общий оборот сохраняет эту неоднозначность.
