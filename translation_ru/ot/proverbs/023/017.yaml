source:
  edition: WLC
  text: אַל יְקַנֵּ֣א לִ֭בְּ/ךָ בַּֽ/חַטָּאִ֑ים כִּ֥י אִם בְּ/יִרְאַת יְ֝הוָ֗ה כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/017.yaml
  text: Do not let your heart envy sinners[a], but be in the fear of Yahweh all day long.
translation:
  language: ru
  text: 'Пусть твоё сердце не завидует грешникам,

    но весь день пребывает в страхе перед Яхве.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יְקַנֵּא
  choice: пусть не завидует
  rationale: Запрет с אַל передан естественной русской конструкцией «пусть не»; קנא в данном контексте означает зависть к грешникам и их кажущемуся благополучию.
- source_word: לִבְּךָ
  choice: твоё сердце
  rationale: Сохранён образ сердца как средоточия внутренних желаний и настроя; он естественен и понятен по-русски.
- source_word: בַּחַטָּאִים
  choice: грешникам
  rationale: Существительное обозначает людей, для которых характерен грех; прямое соответствие «грешники» сохраняет нравственную категорию исходного текста.
- source_word: כִּי אִם
  choice: но
  rationale: 'Сочетание вводит противопоставление: не зависть к грешникам, а страх перед Яхве.'
- source_word: בְּיִרְאַת יְהוָה
  choice: в страхе перед Яхве
  rationale: Сохранено ключевое библейское выражение «страх перед Яхве», без сведения его смысла только к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Выражение указывает на продолжительность на протяжении всего дня; «весь день» звучит естественно в современном русском языке.
theological_decisions:
- issue: Как передать безглагольную вторую часть стиха
  choice: «но весь день пребывает в страхе перед Яхве» — подразумеваемым субъектом остаётся «твоё сердце»
  alternative: «но будь весь день в страхе перед Яхве»
  rationale: В еврейском тексте после כִּי אִם нет выраженного глагола и нового субъекта. Продолжение конструкции с «сердцем» требует минимального восполнения «пребывает» и сохраняет противопоставление двух внутренних состояний. Вариант с «будь» также возможен, но явнее меняет грамматический субъект.
translation_notes:
  register: Современный литературный русский язык; поэтический параллелизм сохранён. Формулировка dignified и доступна обычному читателю; ключевой образ «сердца» и богословски значимое выражение «страх перед Яхве» не сглажены.
