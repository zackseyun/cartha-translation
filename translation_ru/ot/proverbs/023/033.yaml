  text: Your eyes will see strange things[b][a], and your heart will speak perverse things.
translation:
  language: ru
  text: Твои глаза увидят странное[a], и сердце твоё будет говорить превратное[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужих женщин». Древнееврейское слово может обозначать чужих или запретных женщин; здесь оно также может пониматься более широко — как нечто странное, видимое при опьянении.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «искажённое» или «кривое». Древнееврейское слово обозначает то, что искривлено или превратно; здесь оно относится к речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: твои глаза
  rationale: Двойственное число с суффиксом 2-го лица мужского рода единственного числа естественно передаётся по-русски множественным числом.
- source_word: יִרְאוּ
  choice: увидят
  rationale: Имперфект qal в контексте предупреждения передаёт последствие опьянения; будущее время сохраняет параллелизм со второй половиной стиха.
- source_word: זָרוֹת
  choice: странное
  rationale: Субстантивированная форма женского рода множественного числа допускает значения «странные вещи» и «чужие женщины». Нейтральное собирательное «странное» естественно описывает необычные или искажённые видения при опьянении, не устраняя иной возможный смысл.
- source_word: וְלִבְּךָ
  choice: и сердце твоё
  rationale: «Сердце» сохраняет древнееврейский образ внутреннего человека — его мысли, волю и речь; порядок слов придаёт строке естественное литературное звучание.
- source_word: יְדַבֵּר
  choice: заговорит
  rationale: Имперфект piel обозначает наступающее следствие и согласуется с «увидят»; приставочный вид глагола по-русски естественно передаёт начало и проявление речи.
- source_word: תַּהְפֻּכוֹת
  choice: превратное
  rationale: Слово обозначает извращённое, искажённое или противное правильному. Субстантивированное «превратное» сохраняет нравственный и речевой оттенок, не добавляя отсутствующего в оригинале существительного.
theological_decisions:
- issue: 'К чему относится זָרוֹת: к странным видениям или к чужим/запретным женщинам'
  choice: В основном тексте передано как «странное» в связи с непосредственным контекстом опьянения.
  alternative: «чужих женщин»
  rationale: Грамматически и лексически возможны оба понимания; сноска сохраняет подлинную неоднозначность, не превращая один вариант в единственно допустимый.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и древнееврейского образа сердца. Формулировка краткая и выразительная; неоднозначность זָרוֹת вынесена в сноску.
