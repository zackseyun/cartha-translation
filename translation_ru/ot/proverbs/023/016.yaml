    rationale: Еврейское כִּלְיוֹתַי буквально означает «мои почки» и служит образом глубинного внутреннего существа. При смысловом переводе требуется культурная сноска, как и в английском аудиторском следе.
  - severity: low
    issue: «Всё моё нутро» имеет нежелательный разговорно-телесный оттенок
    rationale: Выражение понятно, но для современного литературного библейского текста может звучать грубовато; «всё во мне» передаёт смысл идиомы более плавно.
  - severity: low
    issue: Временная форма в придаточном
    rationale: «Когда твои уста говорят» возможно как обобщённое настоящее, но «будут говорить» лучше согласуется с будущим «возликует» и с ожидаемым событием в контексте.
