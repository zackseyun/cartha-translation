  text: and my inmost being will rejoice when your lips speak what is upright[a][b].
translation:
  language: ru
  text: И всё во мне[a] возликует, когда твои уста будут говорить правду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мои почки» — древнееврейский образ глубинного внутреннего существа и чувств.'
    reason: cultural_note
  - marker: b
    text: 'Или: «будут говорить то, что справедливо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַעְלֹזְנָה
  choice: и возликует
  rationale: Глагол עלז выражает сильную, ликующую радость. «Возликует» сохраняет эту интенсивность и естественно звучит в поэтической речи.
- source_word: כִלְיוֹתָי
  choice: всё моё нутро
  rationale: Буквально «мои почки» — древнееврейский образ глубин внутреннего мира и чувств. «Всё моё нутро» передаёт телесную метафору и значение внутреннего существа, не сводя его только к сердцу.
- source_word: בְּדַבֵּר
  choice: когда ... говорят
  rationale: 'Предлог בְּ с инфинитивом здесь естественно передаёт временное отношение: «когда говорят».'
- source_word: שְׂפָתֶיךָ
  choice: твои уста
  rationale: Сохранён конкретный поэтический образ губ; «уста» соответствует достоинству библейской поэзии и согласуется во множественном числе со сказуемым.
- source_word: מֵישָׁרִים
  choice: правду
  rationale: Множественное существительное выражает то, что прямо, честно и правильно. В сочетании с глаголом речи русское «говорят правду» естественно передаёт этический смысл, хотя возможно и более буквальное «говорят то, что право».
