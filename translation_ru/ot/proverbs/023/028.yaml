  text: אַף הִ֭יא כְּ/חֶ֣תֶף תֶּֽאֱרֹ֑ב וּ֝/בוֹגְדִ֗ים בְּ/אָדָ֥ם תּוֹסִֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/028.yaml
  text: Indeed[a], she lies in wait like a robber[b], and she increases the treacherous among men.
translation:
  language: ru
  text: Да и она подстерегает, словно разбойник[a], и умножает число вероломных среди людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово חֶתֶף редкое и трудное для толкования. Возможно также: «словно грабитель»; некоторые понимают его более отвлечённо — как внезапное нападение или насильственный захват.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Да и
  rationale: Частица одновременно связывает стих с предыдущей мыслью и придаёт утверждению усилительный оттенок; «да и» естественно передаёт обе функции.
- source_word: הִיא
  choice: она
  rationale: Женское местоимение сохраняет отсылку к названной в ближайшем контексте чужой женщине.
- source_word: כְּחֶתֶף
  choice: словно разбойник
  rationale: Редкое и трудное слово в сочетании с глаголом «подстерегает» вероятнее всего обозначает того, кто внезапно нападает или силой захватывает добычу. Неуверенность отражена в сноске.
- source_word: תֶּאֱרֹב
  choice: подстерегает
  rationale: Глагол ארב означает ожидание в засаде с намерением напасть; «подстерегает» естественно передаёт хищнический образ.
- source_word: וּבוֹגְדִים
  choice: вероломных
  rationale: בוגדים обозначает людей, поступающих предательски или нарушающих верность. «Вероломных» сохраняет широкую нравственную категорию, не сводя её только к супружеской неверности или политическому предательству.
- source_word: בְּאָדָם
  choice: среди людей
  rationale: אָדָם употреблено собирательно и обозначает человечество; по-русски этот смысл естественно передаётся выражением «среди людей».
- source_word: תּוֹסִף
  choice: умножает число
  rationale: Каузативная форма יסף указывает, что из-за неё вероломных становится больше; добавление слова «число» делает это значение ясным и естественным по-русски.
