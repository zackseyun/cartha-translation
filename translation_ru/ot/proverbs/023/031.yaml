base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/031.yaml
  text: Do not look at wine when it is red[a], when it sparkles in the cup[b], when it goes down smoothly.
translation:
  language: ru
  text: 'Не смотри на вино, как оно краснеет,

    как блестит в чаше[a]

    и легко скользит[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даёт свой глаз в чаше» — образ привлекательного вида вина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «идёт ровно»; вероятно, имеется в виду, что вино пьётся легко и плавно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֵּרֶא
  choice: Не смотри
  rationale: Сочетание אַל с формой имперфекта выражает запрет; «не смотри» естественно передаёт также намеренное сосредоточение взгляда.
- source_word: יַיִן
  choice: вино
  rationale: Обычное и точное соответствие общеупотребительному еврейскому слову.
- source_word: כִּי יִתְאַדָּם
  choice: как оно краснеет
  rationale: Форма глагола описывает, как вино обнаруживает свой красный цвет; «как» естественно вводит ряд привлекательных признаков, на которые запрещено засматриваться.
- source_word: כִּי יִתֵּן בַּכּוֹס עֵינוֹ
  choice: как блестит в чаше
  rationale: Буквально «как даёт свой глаз в чаше»; образ относится к привлекательному виду вина. «Блестит» передаёт идиоматический смысл без неясной буквальности.
- source_word: יִתְהַלֵּךְ בְּמֵישָׁרִים
  choice: легко скользит
  rationale: Буквально выражение связано с движением «по прямоте/ровно»; в данном контексте оно изображает плавное, лёгкое движение вина, вероятно при питье, но направление прямо не названо.
