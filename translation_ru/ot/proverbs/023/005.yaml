lexical_decisions:
- source_word: הֲתָעוּף עֵינֶיךָ
  choice: Устремишь на него глаза
  rationale: Сохраняет риторический вопрос и образ направленного движения глаз, передавая каузативную форму עוף естественным для современного русского выражением. Буквальное «заставишь глаза полететь» было бы неясным и неестественным.
- source_word: בּוֹ
  choice: на него
  rationale: Местоимение отсылает к богатству из предыдущего стиха; сочетание «устремить глаза на» соответствует русской норме.
- source_word: וְאֵינֶנּוּ
  choice: а его уже нет
  rationale: Передаёт внезапное исчезновение богатства и сохраняет лаконичность еврейского выражения.
- source_word: כִּי
  choice: потому что
  rationale: Вводит объяснение того, почему богатство внезапно исчезает.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: непременно сделает
  rationale: Наречие «непременно» передаёт усиление, создаваемое сочетанием абсолютного инфинитива с личной формой глагола.
- source_word: לּוֹ כְנָפַיִם
  choice: сделает себе крылья
  rationale: Сохраняет олицетворение богатства и возвратный оттенок местоимения לּוֹ.
- source_word: כְנֶשֶׁר
  choice: словно орёл
  rationale: «Орёл» — традиционное и узнаваемое обозначение крупной хищной птицы в данном поэтическом образе; возможная более широкая зоологическая идентификация отмечена в сноске.
- source_word: וְעָף הַשָּׁמָיִם
  choice: улетит в небеса
  rationale: «Улетит» естественно выражает удаление, подразумеваемое контекстом, а «в небеса» сохраняет возвышенный поэтический регистр еврейского множественного числа.
