  text: Will you let your eyes fly to it[a], and it is gone? For it surely makes wings for itself; like an eagle, it flies to the heavens.
translation:
  language: ru
  text: Устремишь ли ты взгляд на богатство — а его уже нет? Ведь оно непременно сделает себе крылья и, словно орёл[a], улетит в небеса.
