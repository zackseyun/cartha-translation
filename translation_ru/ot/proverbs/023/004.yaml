source:
  edition: WLC
  text: אַל תִּיגַ֥ע לְֽ/הַעֲשִׁ֑יר מִֽ/בִּינָתְ/ךָ֥ חֲדָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/004.yaml
  text: Do not wear yourself out to get rich[a]; stop relying on your own understanding.
translation:
  language: ru
  text: Не изнуряй себя, стремясь разбогатеть; перестань полагаться на собственное разумение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «оставь собственное разумение» или «откажись от своей мудрости». Еврейское выражение сжато.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּיגַע
  choice: Не изнуряй себя
  rationale: Запрет с глаголом יגע обозначает утомительный, изнуряющий труд; возвратная конструкция естественно передаёт направленное на себя истощение сил.
- source_word: לְהַעֲשִׁיר
  choice: стремясь разбогатеть
  rationale: Инфинитив породы hифиль от עשר указывает здесь на цель изнурительных усилий — стать богатым; деепричастная конструкция ясно выражает эту целевую связь по-русски.
- source_word: מִבִּינָתְךָ
  choice: на собственное разумение
  rationale: בינה означает понимание, разумение, проницательность. В сочетании с חדל и предлогом מן выражение указывает на то, от чего следует отказаться; добавление «полагаться» делает сжатую еврейскую конструкцию естественной по-русски, не представляя разумение само по себе злом.
- source_word: חֲדָל
  choice: перестань полагаться
  rationale: Императив חדל означает «перестань, прекрати, оставь». В данном сочетании «перестань полагаться» передаёт практический смысл повеления, тогда как буквальное «перестань от своего разумения» по-русски неясно и неестественно.
theological_decisions:
- issue: Смысл второго полустишия
  choice: Предостережение не полагаться на собственное разумение в стремлении к богатству.
  alternative: 'Более буквально и обобщённо: «оставь собственное разумение»; возможно также понимание «откажись от своей мудрости».'
  rationale: Еврейский текст сжат и допускает более буквальную передачу. Основной вариант не отвергает разумение как таковое — высоко ценимое в Притчах, — а связывает запрет с самоуверенным стремлением разбогатеть. Сноска сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; тон краткий, наставительный и достойный. «Изнуряй себя» сохраняет образ истощающего труда, а «разумение» соответствует книжно-мудрому регистру Притч, оставаясь понятным современному читателю.
