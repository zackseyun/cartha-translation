  text: כִּ֣י לָ֭חֲמוּ לֶ֣חֶם רֶ֑שַׁע וְ/יֵ֖ין חֲמָסִ֣ים יִשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
translation:
  language: ru
  text: Потому что они едят хлеб нечестия и пьют вино насилия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вино насилий». Множественное число, вероятно, усиливает значение или объединяет множество насильственных поступков в одно собирательное понятие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит объяснение предшествующего предостережения; «потому что» ясно передаёт причинно-пояснительную связь.
- source_word: לָחֲמוּ
  choice: едят
  rationale: Глагол לחם II означает «есть, поглощать»; в параллели с «пьют» прямое «едят» естественно и сохраняет образ.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохраняется конкретный образ хлеба, образующий поэтическую пару с вином.
- source_word: רֶשַׁע
  choice: нечестия
  rationale: В контексте литературы мудрости слово обозначает нравственное зло и беззаконное поведение; «нечестие» сохраняет возвышенный, но понятный регистр.
- source_word: וְיֵין
  choice: и пьют вино
  rationale: Союз связывает параллельные части стиха; глагол «пьют» в русском естественно ставится перед дополнением согласно еврейскому יִשְׁתּוּ.
- source_word: חֲמָסִים
  choice: насилия
  rationale: Формально множественное число может иметь усилительное или собирательное значение; русское единственное число естественно передаёт абстрактно-собирательный смысл.
- source_word: יִשְׁתּוּ
  choice: пьют
  rationale: Прямо передаёт значение глагола и поддерживает параллелизм «едят… пьют».
