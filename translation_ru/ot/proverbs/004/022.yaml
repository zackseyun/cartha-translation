  text: כִּֽי חַיִּ֣ים הֵ֭ם לְ/מֹצְאֵי/הֶ֑ם וּֽ/לְ/כָל בְּשָׂר֥/וֹ מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/022.yaml
  text: For they are life to those who find them[a], and healing to all their flesh.
translation:
  language: ru
  text: Ибо они — жизнь для тех, кто находит их, и исцеление для всего его тела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «здоровье для всего его тела». Буквально: «исцеление для всей его плоти».'
    reason: 'Лексическая альтернатива: מַרְפֵּא может означать «исцеление» или «здоровье»; בָּשָׂר буквально «плоть», но в этом контексте обозначает всё тело человека.'
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего наставления; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: חַיִּים
  choice: жизнь
  rationale: Хотя существительное имеет форму множественного числа, здесь оно идиоматически обозначает жизнь как единое понятие.
- source_word: הֵם
  choice: они
  rationale: Местоимение отсылает к словам и наставлениям, упомянутым в ближайшем контексте.
- source_word: לְמֹצְאֵיהֶם
  choice: для каждого, кто их находит
  rationale: Передаёт людей, находящих и принимающих эти слова; единственное число «каждого» также позволяет естественно сохранить последующее древнееврейское местоимение единственного числа.
- source_word: בְּשָׂרוֹ
  choice: всей его плоти
  rationale: Сохраняет прямое значение בָּשָׂר («плоть») и единственное число местоименного суффикса; в контексте имеется в виду физическое естество человека.
- source_word: מַרְפֵּא
  choice: исцеление
  rationale: Существительное обозначает исцеление или восстановление здоровья; «исцеление» не привносит образ конкретного лекарства.
theological_decisions:
- issue: Мужской род единственного числа в обобщающем изречении
  choice: «для каждого, кто… всей его плоти»
  alternative: «для тех, кто… для всего их тела»
  rationale: Формулировка сохраняет обобщающий смысл и грамматическое единственное число древнееврейского текста, не ограничивая утверждение одним конкретным человеком.
- issue: Буквальная или смысловая передача בָּשָׂר
  choice: «плоть»
  alternative: «тело»
  rationale: «Плоть» лексически прозрачна и сохраняет телесный образ оригинала; более обычный смысловой вариант «тело» указан в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Тире выделяет именную часть сказуемого; лексема «плоть» сохраняет достоинство и образность библейской речи, оставаясь понятной в контексте.
