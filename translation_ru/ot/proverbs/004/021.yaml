lexical_decisions:
- source_word: אַל יַלִּיזוּ מֵעֵינֶיךָ
  choice: Пусть они не уходят у тебя из виду
  rationale: Запрет передан естественной русской конструкцией. Глагол לוז сохраняет образ удаления или уклонения, а сочетание מֵעֵינֶיךָ идиоматически означает исчезновение из поля зрения и внимания.
- source_word: שָׁמְרֵם
  choice: храни их
  rationale: Императив שמר включает удержание, сбережение и бережное сохранение; «храни» естественно сочетается с образом сердца.
- source_word: בְּתוֹךְ לְבָבֶךָ
  choice: в глубине своего сердца
  rationale: בְּתוֹךְ обозначает внутренность или середину, а לְבָב — внутреннего человека. Формулировка сохраняет пространственный образ и звучит естественно по-русски.
