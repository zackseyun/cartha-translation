  language: ru
  text: Пусть они не уходят у тебя из виду[a]; храни их в своём сердце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть они не удаляются от твоих глаз».'
