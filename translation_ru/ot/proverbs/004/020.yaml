base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/020.yaml
  text: My son[a], pay attention to my words[b]; incline your ear to my sayings.
translation:
  language: ru
  text: Сын мой, внимай моим словам, приклони ухо к моим речам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Сохраняет мужское единственное число и обращение отца или наставника к сыну в непосредственном литературном контексте.
- source_word: לִדְבָרַי
  choice: моим словам
  rationale: דברים здесь обозначает слова наставления; это естественный современный русский эквивалент.
- source_word: הַקְשִׁיבָה
  choice: внимай
  rationale: Императив выражает активное и сосредоточенное слушание. «Внимай» естественно сочетается с «словам» и соответствует достоинству поэтической речи.
- source_word: לַאֲמָרַי
  choice: к моим речам
  rationale: Передаёт אמרים отдельно от דברים, сохраняя лексическое варьирование в поэтическом параллелизме.
- source_word: הַט
  choice: приклони
  rationale: Сохраняет образное значение императива נטה в устойчивом библейско-литературном сочетании с ухом, не сводя его прямо к толкованию «слушай внимательно».
- source_word: אָזְנֶךָ
  choice: ухо
  rationale: Сохраняет единственное число еврейского текста и естественное русское выражение «приклони ухо».
