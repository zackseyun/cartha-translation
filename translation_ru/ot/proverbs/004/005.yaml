  text: קְנֵ֣ה חָ֭כְמָה קְנֵ֣ה בִינָ֑ה אַל תִּשְׁכַּ֥ח וְ/אַל תֵּ֝֗ט מֵֽ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/005.yaml
  text: Acquire wisdom[a]; acquire understanding. Do not forget[b], and do not turn away from the words of my mouth.
translation:
  language: ru
  text: Приобретай мудрость[a], приобретай понимание; не забывай и не уклоняйся[b] от слов моих уст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Обрети мудрость, обрети понимание». Еврейский глагол может означать «обрести», «приобрести» или «купить» — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не отступай» или «не сворачивай» от слов моих уст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְנֵה
  choice: приобретай
  rationale: Повторённое повеление передаёт целенаправленное обретение чего-либо ценного. «Приобретай» сохраняет возможный оттенок получения или покупки, но в данном контексте не ограничивает смысл торговой сделкой.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное и контекстуально точное обозначение практической и нравственной мудрости в книге Притчей.
- source_word: בִינָה
  choice: понимание
  rationale: Слово обозначает способность понимать и различать. «Понимание» естественно в современном русском языке и не сливается полностью с «мудростью».
- source_word: אַל תִּשְׁכַּח
  choice: не забывай
  rationale: Сохранено прямое значение глагола שכח; возможный смысл небрежения не вынесен в основной текст.
- source_word: וְאַל תֵּט
  choice: и не уклоняйся
  rationale: Глагол נטה здесь выражает отклонение от данного наставления. Русское «уклоняться от» естественно сочетается со словами наставника.
- source_word: מֵאִמְרֵי פִי
  choice: от слов моих уст
  rationale: Формулировка сохраняет образ устной речи и близко передаёт еврейскую конструкцию, оставаясь понятной в литературном русском языке.
