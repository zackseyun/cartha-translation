  text: Let your eyes look straight ahead[a], and your eyelids be directed before you.
translation:
  language: ru
  text: Пусть твои глаза смотрят прямо перед собой, и пусть твои веки будут направлены прямо перед тобой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть твои веки будут прямо перед тобой». Еврейский глагол может более буквально выражать прямую направленность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: твои глаза
  rationale: Форма множественного числа с суффиксом 2-го лица мужского рода единственного числа; в русском естественно передаётся множественным числом.
- source_word: לְנֹכַח
  choice: прямо
  rationale: Предлог указывает на то, что находится непосредственно впереди; «прямо» естественно передаёт как пространственную направленность, так и контекст сосредоточенного движения по верному пути.
- source_word: יַבִּיטוּ
  choice: смотрят
  rationale: Глагол נבט означает «смотреть, обращать взор»; нейтральное «смотрят» не добавляет отсутствующей в оригинале интенсивности.
- source_word: וְעַפְעַפֶּיךָ
  choice: и веки твои
  rationale: Сохранён конкретный поэтический образ век, образующий параллель к глазам; замена на «взгляд» была бы понятнее, но сгладила бы образность оригинала.
- source_word: יַיְשִׁרוּ
  choice: будут устремлены
  rationale: Форма от ישר выражает прямоту или направление прямо. В сочетании с «веки» буквальная передача звучала бы по-русски неестественно, поэтому выбрано выражение, передающее направленность взгляда и сохраняющее метафорическую напряжённость.
- source_word: נֶגְדֶּךָ
  choice: вперёд
  rationale: Слово означает «перед тобой, напротив тебя»; в данном параллелизме «вперёд» кратко и естественно обозначает направление перед человеком.
