id: PRO.4.18
reference: Proverbs 4:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אֹ֣רַח צַ֭דִּיקִים כְּ/א֣וֹר נֹ֑גַהּ הוֹלֵ֥ךְ וָ֝/א֗וֹר עַד נְכ֥וֹן הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/018.yaml
  text: But the path of the righteous is like the light of dawn[b][a], going on and shining until the day is fully established.
translation:
  language: ru
  text: 'А путь праведных — как сияние зари[a]: оно светит всё ярче[b], пока не наступит полный день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как яркий свет».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «идёт и светит, пока день не утвердится».'
    reason: literal_rendering
lexical_decisions:
- source_word: וְ/אֹרַח
  choice: А путь
  rationale: אֹרַח означает «путь»; союз וְ передаёт переход и подразумеваемое противопоставление предыдущему стиху. Русское «а» естественно выражает эту связь без чрезмерного усиления.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное множественное число обозначает людей, поступающих праведно; традиционное русское слово сохраняет нравственно-богословскую категорию Притч.
- source_word: כְּ/אוֹר נֹגַהּ
  choice: как сияние зари
  rationale: כְּ вводит сравнение, אוֹר означает «свет», а נֹגַהּ — «сияние, яркость». В контексте движения к полному дню выражение «сияние зари» естественно передаёт образ утреннего света, сохраняя оттенок яркости.
- source_word: הוֹלֵךְ וָ/אוֹר
  choice: оно светит всё ярче
  rationale: Буквально сочетание означает «идёт и светит», но это еврейская конструкция постепенного усиления. Русское «светит всё ярче» ясно и естественно передаёт нарастание света; более буквальная форма отмечена в сноске.
- source_word: עַד נְכוֹן הַ/יּוֹם
  choice: пока не наступит полный день
  rationale: עַד обозначает предел процесса, נְכוֹן — состояние установившегося, упрочившегося, достигшего полноты, а הַיּוֹם — «день». «Пока не наступит полный день» естественно выражает достижение дневным светом полной силы.
theological_decisions:
- issue: Нравственная категория צַדִּיקִים
  choice: праведных
  alternative: людей, поступающих праведно
  rationale: «Праведные» сохраняет устойчивую нравственную категорию книги Притч и противопоставление нечестивым, не уточняя её посредством позднейших конфессиональных систем.
- issue: Образ постепенного усиления света
  choice: светит всё ярче
  alternative: идёт и светит
  rationale: Стих уподобляет путь праведных возрастающему утреннему свету. Перевод передаёт развитие самого образа, не превращая его в отдельное доктринальное утверждение о неизбежном духовном прогрессе каждого человека.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Двоеточие делает явным продолжение образа, а местоимение «оно» относится к «сиянию». Формулировка избегает архаичного оборота «до полного дня», но сохраняет краткость и параллелизм притчи.
