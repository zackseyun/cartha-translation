lexical_decisions:
- source_word: פַּלֵּס
  choice: Выровняй
  rationale: Императив породы пиэль от פלס может обозначать выравнивание или подготовку пути, а также взвешивание и обдумывание. В основном тексте сохранён конкретный образ выравнивания тропы; смысл обдумывания отмечен в сноске.
- source_word: מַעְגַּל
  choice: тропу
  rationale: Слово обозначает колею, тропу или путь. «Тропа» естественно сочетается с образом ног и допускает переносный смысл жизненного направления.
- source_word: רַגְלֶךָ
  choice: для ног своих
  rationale: Форма буквально относится к «твоей ноге», но в русском языке множественное число звучит естественнее в устойчивом образе ходьбы; предлог «для» передаёт направленность подготовки тропы.
- source_word: וְכָל
  choice: и все
  rationale: Прямо передаёт соединительный союз и значение всеохватности без добавления более сильного следственного «тогда».
- source_word: דְּרָכֶיךָ
  choice: пути твои
  rationale: «Пути» сохраняют распространённую в литературе мудрости метафору образа жизни и не смешиваются с выбранной для מַעְגַּל «тропой».
- source_word: יִכֹּנוּ
  choice: утвердятся
  rationale: Нифаль от כון выражает состояние прочности, устойчивости или установленности. «Утвердятся» кратко и достойно передаёт результат, сохраняя возможность как нравственной устойчивости, так и устроенности жизненного пути.
