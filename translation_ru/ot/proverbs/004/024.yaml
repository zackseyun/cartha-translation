lexical_decisions:
- source_word: הָסֵר
  choice: Удали
  rationale: Побудительная форма выражает намеренное устранение; «удали» прямо и естественно передаёт активное действие.
- source_word: מִמְּךָ
  choice: от себя
  rationale: Предлог с суффиксом второго лица обозначает удаление от самого адресата и подчёркивает его личную ответственность.
- source_word: עִקְּשׁוּת פֶּה
  choice: лживые речи
  rationale: Буквально сочетание говорит об «искривлённости уст»; в данном контексте уста метонимически обозначают речь, а прилагательное передаёт нравственную испорченность и искажение без неестественного для современного русского оборота.
- source_word: וּלְזוּת שְׂפָתַיִם
  choice: коварные слова
  rationale: Существительное обозначает отклонение, искажённость или лукавство, а «губы» — речь. «Коварные слова» естественно передаёт намеренно нечестную, уклончивую речь и сохраняет смысловой параллелизм.
- source_word: הַרְחֵק
  choice: держи вдали
  rationale: Каузативное повеление означает «сделай далёким, удали»; «держи вдали» сохраняет усиление по сравнению с первым повелением.
- source_word: מִמֶּךָ
  choice: от себя
  rationale: Повторно обозначает отделение порочной речи от адресата; повтор сохранён ради поэтического ударения.
