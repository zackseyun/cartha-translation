  text: Put away crookedness of mouth from you[a], and put devious lips far from you.
translation:
  language: ru
  text: Удали от себя порочную речь и держи подальше от себя лукавство губ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «искривлённость уст» и «лукавство губ». Эти выражения образно говорят о нравственно искажённой речи.'
