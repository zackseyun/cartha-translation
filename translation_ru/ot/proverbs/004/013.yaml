lexical_decisions:
- source_word: הַחֲזֵק
  choice: Крепко держись
  rationale: Императив от חזק выражает решительное, крепкое удерживание; перевод сохраняет метафору хватки и силу призыва.
- source_word: בַּמּוּסָר
  choice: наставления
  rationale: מוּסָר в Притчах обозначает формирующее наставление, включающее воспитание, дисциплину и исправление; «наставление» естественно в данном контексте, а более строгие оттенки отмечены в сноске.
- source_word: אַל תֶּרֶף
  choice: не отпускай
  rationale: Форма от רפה здесь означает не ослаблять хватку, не выпускать; выражение продолжает образ крепкого удерживания.
- source_word: נִצְּרֶהָ
  choice: береги его
  rationale: נצר означает хранить, оберегать. Местоимение согласовано с русским существительным среднего рода «наставление»; буквальный женский род еврейского суффикса в русском не создаёт устойчивой персонификации.
- source_word: כִּי הִיא
  choice: потому что оно
  rationale: Женское местоимение согласовано в еврейском с מוּסָר в данном контексте, тогда как русский перевод требует согласования с «наставление»; причинная связь передана явно.
- source_word: חַיֶּיךָ
  choice: твоя жизнь
  rationale: Формально множественное חַיִּים идиоматически означает «жизнь»; единственное число естественно передаёт всеобъемлющую ценность наставления для адресата.
