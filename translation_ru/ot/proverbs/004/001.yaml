  text: Hear[a], sons, a father's instruction, and pay attention to know understanding.
translation:
  language: ru
  text: Слушайте, сыновья[a], наставление отца и внимайте, чтобы обрести понимание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети». В еврейском тексте буквально «сыновья» — обращение, характерное для наставлений отца в книге Притчей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе призывает не просто услышать, а воспринять сказанное со вниманием; «слушайте» естественно передаёт этот смысл по-русски.
- source_word: בָנִים
  choice: сыновья
  rationale: Еврейское существительное имеет форму мужского рода множественного числа и сохраняет характерное для Притчей обращение отца к сыновьям.
- source_word: מוּסַר
  choice: наставление
  rationale: В литературе мудрости слово обозначает формирующее наставление, включающее обучение, исправление и дисциплину; в данном дидактическом контексте «наставление» передаёт его наиболее естественно.
- source_word: אָב
  choice: отца
  rationale: Сочетание מוּסַר אָב буквально означает «наставление отца». Еврейский текст не даёт основания добавлять притяжательное «моего».
- source_word: וְהַקְשִׁיבוּ
  choice: и внимайте
  rationale: Второй императив выражает сосредоточенное внимание и по смыслу сильнее простого слушания; «внимайте» сохраняет различие между двумя глаголами и соответствует достоинству поэтической речи.
- source_word: לָדַעַת
  choice: чтобы обрести
  rationale: Инфинитив с предлогом ל выражает цель. В сочетании с בִּינָה русское «чтобы обрести» естественно передаёт достижение знания или понимания, не воспроизводя неидиоматичное «познать понимание».
- source_word: בִּינָה
  choice: понимание
  rationale: Ключевой термин литературы мудрости означает понимание, проницательность и способность различать; «понимание» сохраняет его широкий смысл.
theological_decisions:
- issue: Гендерно маркированное обращение в наставлении мудрости
  choice: сыновья
  alternative: дети
  rationale: В еврейском тексте прямо употреблено существительное мужского рода «сыновья», соответствующее рамке отцовского наставления. Эта форма сохранена без суждения о том, ограничивается ли применение наставления только мужской аудиторией.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и слегка возвышенным оттенком речи мудрости. «Внимайте» выбрано для различения двух параллельных повелений, а «обрести понимание» — как естественная русская передача целевого оборота לָדַעַת בִּינָה.
