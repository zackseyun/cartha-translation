id: PRO.4.10
reference: Proverbs 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י וְ/קַ֣ח אֲמָרָ֑/י וְ/יִרְבּ֥וּ לְ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/010.yaml
  text: Hear[a], my son, and receive my words[c][b], and the years of your life will be many.
translation:
  language: ru
  text: Слушай, сын мой, и прими мои слова — и умножатся годы твоей жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и прибавятся тебе годы жизни».'
    reason: Лְךָ можно передать как «тебе», а וְיִרְבּוּ — как «прибавятся»; этот вариант ближе воспроизводит синтаксис еврейского текста.
lexical_decisions:
- source_word: שְׁמַע
  choice: Слушай
  rationale: Повелительная форма допускает значения «услышь» и «слушай». В наставительном контексте «слушай» естественно передаёт внимательное восприятие, не сводя смысл к одному лишь физическому слуху.
- source_word: בְּנִי
  choice: сын мой
  rationale: Обращение стоит в мужском роде единственного числа с суффиксом первого лица. Формулировка сохраняет образ отцовского наставления сыну.
- source_word: וְקַח
  choice: и прими
  rationale: Буквально глагол означает «возьми», но применительно к словам наставления современное русское «прими» звучит естественно и сохраняет идею сознательного усвоения.
- source_word: אֲמָרָי
  choice: мои слова
  rationale: Прямой и естественный перевод множественного существительного с притяжательным суффиксом; вариант «мои изречения» был бы более книжным и интерпретирующим.
- source_word: וְיִרְבּוּ
  choice: и умножатся
  rationale: Глагол רבה передаёт увеличение или умножение. «Умножатся» сохраняет образность еврейского выражения и хорошо сочетается с годами жизни.
- source_word: לְךָ שְׁנוֹת חַיִּים
  choice: годы твоей жизни
  rationale: Буквально возможно «умножатся тебе годы жизни». Притяжательная конструкция естественнее по-русски и передаёт отношение, выраженное לְךָ в данном контексте.
theological_decisions:
- issue: Гендерно маркированное обращение в наставлении мудрости
  choice: сын мой
  alternative: дитя моё
  rationale: Еврейская форма грамматически мужского рода и соответствует литературной рамке наставления отца сыну. Нейтрализация обращения устранила бы значимую черту исходного текста.
- issue: Характер связи между принятием наставления и долголетием
  choice: сохранена последовательность двух частей через «и»
  alternative: «тогда» или «чтобы»
  rationale: Еврейский союз ו допускает смысл следствия, однако не выражает его столь однозначно, как русское «тогда», и не обозначает цель столь явно, как «чтобы». Перевод не превращает мудрое наставление в более жёсткую причинную формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью, подходящими для поэтического наставления. Инверсия «сын мой» сохраняет библейскую торжественность, оставаясь понятной; тире обозначает смысловой переход к ожидаемому результату, не усиливая причинность союзом «тогда».
