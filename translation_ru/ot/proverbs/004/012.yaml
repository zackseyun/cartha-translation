  text: When you walk[a], your step will not be hindered; and if you run, you will not stumble.
translation:
  language: ru
  text: Когда пойдёшь, твоему шагу ничто не помешает[a]; и если побежишь, не споткнёшься.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твой шаг не будет стеснён (сужен)». Еврейский глагол передаёт образ тесноты или ограничения движения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ
  choice: Когда пойдёшь
  rationale: Инфинитивная конструкция с предлогом בְּ и суффиксом 2-го лица имеет временное значение. Эта формулировка естественно передаёт смысл «когда/as you go».
- source_word: יֵצַר
  choice: ничто не помешает
  rationale: Глагол выражает идею тесноты, сужения или стеснения движения. В сочетании со словом «шаг» смысл естественно передаётся как отсутствие препятствий; буквальный образ сохранён в сноске.
- source_word: צַעֲדֶךָ
  choice: твоему шагу
  rationale: Сохранено единственное число еврейского существительного и образ движения по пути.
- source_word: וְאִם
  choice: и если
  rationale: Сохранены как соединительный союз, так и условное значение частицы, без превращения условия во временное утверждение.
- source_word: תָּרוּץ
  choice: побежишь
  rationale: Прямое и естественное соответствие глаголу רוץ «бежать».
- source_word: תִכָּשֵׁל
  choice: не споткнёшься
  rationale: Передаёт основное значение כשל и сохраняет возможность как буквального, так и переносного понимания в образе жизненного пути.
