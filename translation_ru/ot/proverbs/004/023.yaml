lexical_decisions:
- source_word: מִכָּל מִשְׁמָר
  choice: превыше всего
  rationale: 'Сочетание выражает высшую степень приоритета: сердце следует охранять более всего. Основной текст передаёт этот смысл естественно по-русски, а образ охраны и возможная более буквальная передача отмечены в сноске.'
- source_word: נְצֹר
  choice: храни
  rationale: Повелительная форма означает деятельно оберегать и внимательно сохранять. «Храни» кратко и естественно сочетается с «сердцем».
- source_word: לִבֶּךָ
  choice: своё сердце
  rationale: '«Сердце» сохранено как ключевое понятие древнееврейской антропологии: средоточие мыслей, воли и чувств. Возвратное «своё» естественно при русском повелительном наклонении.'
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание данного наставления. «Ведь» ясно и естественно выражает причинно-пояснительную связь.
- source_word: מִמֶּנּוּ
  choice: из него
  rationale: Местоименный суффикс отсылает к сердцу; буквальная связь сохранена без поясняющего расширения.
- source_word: תּוֹצְאוֹת
  choice: истоки
  rationale: Слово может обозначать выходы, исходы или источники. «Истоки» естественно передают образ того, откуда берёт начало жизнь, не исключая более буквальных оттенков, указанных в сноске.
- source_word: חַיִּים
  choice: жизни
  rationale: Хотя форма грамматически множественная, существительное обычно обозначает жизнь как единое понятие; русский язык требует здесь единственного числа.
theological_decisions:
- issue: Антропологический смысл слова «сердце»
  choice: Сохранить слово «сердце» без сведения его значения только к чувствам.
  alternative: разум; внутренний человек
  rationale: В древнееврейском контексте сердце охватывает мышление, волю и чувства. Буквальная передача сохраняет широту исходного понятия.
- issue: Связь сердца с жизнью
  choice: Сохранить образ сердца как места, из которого берут начало истоки жизни.
  alternative: Истолковать фразу как утверждение, что от мыслей и решений зависит вся жизнь.
  rationale: Образный язык текста шире любого одного психологического или нравственного толкования, поэтому перевод не конкретизирует его сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным и достойным звучанием. «Превыше всего» сохраняет торжественную выразительность, оставаясь понятным; тире во второй части подчёркивает образное отождествление без добавления отсутствующего в еврейском тексте глагола.
