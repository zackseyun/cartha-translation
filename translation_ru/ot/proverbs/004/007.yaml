  text: רֵאשִׁ֣ית חָ֭כְמָה קְנֵ֣ה חָכְמָ֑ה וּ/בְ/כָל קִ֝נְיָנְ/ךָ֗ קְנֵ֣ה בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/007.yaml
  text: 'The beginning of wisdom is this: acquire wisdom[a], and with all you acquire[b], acquire understanding.'
translation:
  language: ru
  text: 'Начало мудрости: приобретай мудрость[a]; и всем, что приобретаешь[b], приобретай разумение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мудрость — самое главное; приобретай мудрость». Еврейское слово רֵאשִׁית может означать не только «начало», но и «главное», «первостепенное».'
    reason: alternative_reading
  - marker: b
    text: 'Букв.: «и всем твоим приобретением»; возможно также: «и всем своим имуществом». В еврейском тексте здесь обыгрываются однокоренные слова «приобретать» и «приобретение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: начало
  rationale: Сохраняет основное значение «начало, первое» и краткую форму еврейского изречения, не исключая оттенка первостепенной важности, отмеченного в сноске.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычный и точный эквивалент в Книге Притчей; обозначает практическую и нравственную мудрость. Повтор сохранён ради смыслового и риторического акцента.
- source_word: קְנֵה
  choice: приобретай
  rationale: Передаёт повелительную форму и намеренное обретение, не сводя смысл исключительно к покупке. Повтор глагола сохранён.
- source_word: וּבְכָל קִנְיָנְךָ
  choice: и ценой всего, что приобретаешь
  rationale: Естественно передаёт мысль о полной цене или затрате и сохраняет словесную связь существительного קִנְיָן с повторяющимся глаголом קנה. В сноске указаны более буквальные варианты.
- source_word: בִינָה
  choice: разумение
  rationale: Достоинственный и понятный эквивалент для способности понимать и различать; хорошо соответствует контексту литературы мудрости.
theological_decisions:
- issue: 'Значение רֵאשִׁית: начало или первостепенная вещь'
  choice: «Начало мудрости» в основном тексте
  alternative: «Мудрость — самое главное»
  rationale: Еврейское слово допускает оба оттенка. Основной текст сохраняет наиболее прямое значение и формальную неоднозначность, а альтернативное понимание приводится в сноске без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным и достойным звучанием. «Разумение» выбрано как общеупотребительное в библейско-мудростном контексте слово без излишней архаичности; повтор «приобретай» сохраняет риторику оригинала.
