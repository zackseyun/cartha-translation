  text: דֶּ֣רֶךְ רְ֭שָׁעִים כָּֽ/אֲפֵלָ֑ה לֹ֥א יָ֝דְע֗וּ בַּ/מֶּ֥ה יִכָּשֵֽׁלוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/019.yaml
  text: The way of the wicked is like deep darkness[b][a]; they do not know what makes them stumble.
translation:
  language: ru
  text: Путь нечестивых — словно густая тьма[a]; они не знают, из-за чего спотыкаются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно непроглядный мрак». Еврейское слово обозначает особенно плотную тьму или мглу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обо что спотыкаются». Еврейское выражение может указывать как на причину спотыкания, так и на то, обо что спотыкаются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Сохраняет характерную для литературы мудрости метафору образа жизни и поведения; это естественное и ёмкое русское соответствие.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Передаёт субстантивированное обозначение нравственно виновных людей и соответствует возвышенному, но понятному регистру книги Притчей.
- source_word: כָּאֲפֵלָה
  choice: словно густая тьма
  rationale: כְּ выражает сравнение, а אֲפֵלָה обозначает особенно плотную тьму или мрак. «Густая тьма» сохраняет усиленный образ и естественно звучит по-русски.
- source_word: לֹא יָדְעוּ
  choice: они не знают
  rationale: Прямо передаёт отсутствие знания или осознания, не сужая смысл до одного лишь непонимания.
- source_word: בַּמֶּה יִכָּשֵׁלוּ
  choice: из-за чего спотыкаются
  rationale: Передаёт возможный причинный или инструментальный смысл сочетания, сохраняя образ нравственного спотыкания. Предметное прочтение «обо что» приведено в примечании.
