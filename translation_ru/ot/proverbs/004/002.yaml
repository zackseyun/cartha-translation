base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/002.yaml
  text: For I have given you good instruction[a]; do not forsake my teaching.
translation:
  language: ru
  text: Ведь я дал вам доброе наставление; не оставляйте моего учения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моего наставления»; традиционно: «моего закона». Еврейское слово тора может означать наставление в широком смысле, а не только закон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит обоснование предшествующего призыва; «ведь» естественно передаёт эту пояснительно-причинную связь по-русски.
- source_word: לֶקַח טוֹב
  choice: доброе наставление
  rationale: לֶקַח здесь обозначает преподаваемое наставление, а טוֹב характеризует его как доброе и ценное. Такой перевод естественен для литературы мудрости.
- source_word: נָתַתִּי לָכֶם
  choice: я дал вам
  rationale: Перфект выражает уже совершённую передачу наставления. Русское прошедшее совершенного вида точно и естественно передаёт эту форму.
- source_word: תּוֹרָתִי
  choice: моего учения
  rationale: В отцовском наставлении книги Притчей תּוֹרָה обозначает авторитетное учение в широком смысле, а не обязательно установленный законом свод предписаний.
- source_word: אַל תַּעֲזֹבוּ
  choice: не оставляйте
  rationale: Запрет требует не отступать от данного учения. «Не оставляйте» сохраняет смысл длительной верности и звучит естественно в современном литературном русском языке.
theological_decisions:
- issue: Значение תּוֹרָתִי в контексте литературы мудрости
  choice: моего учения
  alternative: моего наставления; моего закона
  rationale: Контекст речи отца к детям указывает на авторитетное наставление. «Учение» сохраняет широкое значение תּוֹרָה и не отождествляет слова говорящего с Моисеевым законом, хотя традиционная передача «закон» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранено различие между לֶקַח («наставление») и תּוֹרָה («учение»); архаичное «не оставляйте закона моего» не используется.
