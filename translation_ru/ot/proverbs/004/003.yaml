  yaml_path: translation/ot/proverbs/004/003.yaml
  text: For I was a son to my father[b][a], tender and an only child before my mother.
translation:
  language: ru
  text: Ведь я был сыном своего отца, нежным и единственным у своей матери.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё юным и единственным перед лицом своей матери». Слово, переведённое как «единственным», может также означать «единственным сыном», «единственным ребёнком», «уникальным», а в некоторых контекстах — «любимым».'
    reason: Сноска отмечает возможный возрастной оттенок רַךְ, буквальный образ לִפְנֵי и лексическую широту יָחִיד, не изменяя основного текста.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение к отцовскому наставлению в окружающем контексте; «ведь» естественно передаёт эту обосновывающую связь.
- source_word: בֵן הָיִיתִי לְאָבִי
  choice: и я был сыном у своего отца
  rationale: 'Сохранены конкретное «сын» и значение состояния в прошлом. Частица «и» уместно выражает подразумеваемое контекстом сопоставление: наставник сам некогда был сыном, которого учил отец.'
- source_word: רַךְ
  choice: ещё юным
  rationale: Прилагательное может означать мягкость, нежность, хрупкость или юный возраст. В воспоминании о детстве «ещё юным» ясно и естественно передаёт контекстуальный смысл, не приписывая матери особого отношения к сыну.
- source_word: וְיָחִיד
  choice: и единственным
  rationale: יָחִיד обозначает единственного или уникального; форма «единственным у своей матери» сохраняет возможность понимать его как единственного сына или ребёнка, не уточняя того, чего прямо не уточняет еврейский текст.
- source_word: לִפְנֵי אִמִּי
  choice: у своей матери
  rationale: Буквально «перед лицом моей матери», но здесь оборот выражает положение сына по отношению к матери. Русское «у своей матери» передаёт эту связь естественно и без пространственного оттенка.
theological_decisions:
- issue: Значение יָחִיד в отношении матери
  choice: единственным у своей матери
  alternative: единственным сыном / любимым у своей матери
  rationale: Основное значение слова — «единственный, уникальный». Перевод не уточняет «сын» или «ребёнок» и не превращает возможный оттенок «любимый» в однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным звучанием. Формулировка сохраняет семейную перспективу отца и сына и не воспроизводит неестественно буквальное «сыном моему отцу».
