  text: Then he taught me and said to me[a], “Let your heart hold fast my words[b]; keep my commandments and live.”
translation:
  language: ru
  text: 'Он учил меня и сказал мне: «Пусть твоё сердце крепко держится моих слов[a]; храни мои заповеди — и живи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть твоё сердце хранит мои слова». В библейском иврите «сердце» включает не только чувства, но также мышление, волю и понимание.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֹּרֵנִי
  choice: Он наставлял меня
  rationale: Глагол ירה в породе hифиль означает «учить, наставлять». Несовершенный вид «наставлял» естественно передаёт воспоминание об отцовском наставлении в контексте стихов 3–4.
- source_word: וַיֹּאמֶר לִי
  choice: и говорил мне
  rationale: Формула вводит прямую речь. «Говорил мне» согласуется с повествованием о повторявшемся наставлении и звучит естественно по-русски.
- source_word: יִתְמָךְ
  choice: крепко держится
  rationale: תמך имеет значения «держать, поддерживать». При подлежащем «сердце» выражение передаёт твёрдое внутреннее удержание слов, не сводя смысл только к памяти.
- source_word: דְּבָרַי
  choice: моих слов
  rationale: Прямой и широкий эквивалент, сохраняющий множественное число и притяжательный суффикс.
- source_word: לִבֶּךָ
  choice: сердце твоё
  rationale: Сохраняется библейский образ сердца как внутреннего центра мышления, воли и понимания; перестановка придаёт речи dignified, но понятное звучание.
- source_word: שְׁמֹר
  choice: храни
  rationale: «Храни» передаёт активное соблюдение и бережное удержание заповедей; это естественное русское сочетание с «заповеди».
- source_word: מִצְוֺתַי
  choice: мои заповеди
  rationale: «Заповеди» сохраняет авторитетный характер מִצְוֹת и соответствует контексту мудрого отцовского наставления.
- source_word: וֶחְיֵה
  choice: и живи
  rationale: Сохраняет форму повелительного наклонения и компактную еврейскую связь между соблюдением заповедей и жизнью, не уточняя её как цель или обещанный результат.
theological_decisions:
- issue: Связь между соблюдением заповедей и жизнью
  choice: «храни мои заповеди — и живи»
  alternative: «храни мои заповеди, чтобы жить» / «и будешь жить»
  rationale: Еврейский текст содержит соединённые союзом императивы. Перевод не превращает второй императив однозначно ни в условное обещание, ни в указание цели, сохраняя напряжённую краткость оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; тире подчёркивает сжатую связь двух повелений. Маркер сноски помещён непосредственно после выражения, которое она поясняет.
