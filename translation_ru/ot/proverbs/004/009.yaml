  text: תִּתֵּ֣ן לְ֭/רֹאשְׁ/ךָ לִוְיַת חֵ֑ן עֲטֶ֖רֶת תִּפְאֶ֣רֶת תְּמַגְּנֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/009.yaml
  text: She will place on your head a graceful wreath[b][a]; she will bestow on you a crown of beauty.
translation:
  language: ru
  text: Она возложит на твою голову венок изящества[a], дарует тебе венец великолепия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «венок благодати».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «венец красоты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן
  choice: возложит
  rationale: Форма qal, имперфект 3-го лица женского рода единственного числа; подразумеваемое подлежащее — Мудрость. В сочетании с «на твою голову» глагол «возложит» естественно передаёт действие и сохраняет конкретный образ.
- source_word: לְרֹאשְׁךָ
  choice: на твою голову
  rationale: Предлог לְ в контексте головного украшения естественно передаётся по-русски предлогом «на».
- source_word: לִוְיַת
  choice: венок
  rationale: Существительное обозначает венок или гирлянду как головное украшение. «Венок» ясно и естественно сохраняет этот образ.
- source_word: חֵן
  choice: изящества
  rationale: Слово может обозначать прелесть, привлекательность, благодать или благоволение. В сочетании с головным украшением «изящество» передаёт эстетический оттенок, не исключая более широкого смысла, отмеченного в сноске.
- source_word: עֲטֶרֶת
  choice: венец
  rationale: «Венец» точно передаёт образ почётного головного украшения и соответствует возвышенному поэтическому регистру.
- source_word: תִּפְאֶרֶת
  choice: великолепия
  rationale: Слово охватывает значения красоты, великолепия, славы и чести. «Великолепие» сохраняет возвышенный и зрительный характер образа.
- source_word: תְּמַגְּנֶךָּ
  choice: дарует тебе
  rationale: Форма piel, имперфект 3-го лица женского рода единственного числа с суффиксом 2-го лица мужского рода; здесь глагол означает вручить, передать или даровать, а не защищать щитом. «Дарует тебе» естественно сочетается с венцом и передаёт поэтический регистр.
