  text: אַל תַּעַזְבֶ֥/הָ וְ/תִשְׁמְרֶ֑/ךָּ אֱהָבֶ֥/הָ וְ/תִצְּרֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/006.yaml
  text: Do not forsake her[a], and she will keep you; love her, and she will guard you.
translation:
  language: ru
  text: Не оставляй её[a] — и она будет хранить тебя; люби её — и она будет оберегать тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть мудрость, которая в этом отрывке представлена в образе женщины.
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: не
  rationale: В сочетании с формой имперфекта выражает запрет; русское «не оставляй» естественно передаёт его без добавочного усиления.
- source_word: תַּעַזְבֶהָ
  choice: оставляй её
  rationale: עזב означает «оставлять, покидать». Здесь речь идёт о мудрости, представленной как женщина; местоимение женского рода сохраняет образ оригинала.
- source_word: וְתִשְׁמְרֶךָּ
  choice: и она сохранит тебя
  rationale: שׁמר может означать «хранить, охранять, оберегать». «Сохранит» лаконично передаёт защитное действие и позволяет отличить этот глагол от נצר во второй строке.
- source_word: אֱהָבֶהָ
  choice: люби её
  rationale: אהב прямо означает «любить»; простой и сильный глагол оригинала сохранён.
- source_word: וְתִצְּרֶךָּ
  choice: и она будет оберегать тебя
  rationale: נצר выражает внимательное хранение и защиту. «Будет оберегать» естественно по-русски и слегка оттеняет его от предыдущего «сохранит».
theological_decisions:
- issue: Олицетворение мудрости в женском образе
  choice: Сохранить местоимение женского рода «её/она»
  alternative: Передать мудрость как безличное отвлечённое понятие либо повторить слово «мудрость»
  rationale: Еврейский текст использует формы женского рода и в контексте олицетворяет мудрость как женщину. Местоимения сохраняют этот литературный образ, не отождествляя его с какой-либо отдельной богословской фигурой.
translation_notes:
  register: Современный литературный русский язык с кратким наставительным ритмом. Тире подчёркивает связь между повелением и обещанным следствием; пара «сохранит / будет оберегать» передаёт близкие, но не полностью тождественные глаголы שׁמר и נצר.
