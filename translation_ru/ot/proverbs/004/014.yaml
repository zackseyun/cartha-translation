lexical_decisions:
- source_word: אֹרַח
  choice: тропа
  rationale: Слово обозначает тропу или образ жизни. «Тропа» сохраняет конкретный образ и позволяет отличить его от דֶּרֶךְ во второй строке.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное обозначает людей, виновных в нравственном зле; «нечестивые» естественно передаёт собирательный смысл.
- source_word: אַל תָּבֹא
  choice: не вступай
  rationale: В сочетании с образом тропы глагол בוא означает вступление на определённый путь; «не вступай» естественно выражает начало движения и нравственного выбора.
- source_word: תְּאַשֵּׁר
  choice: не продвигайся
  rationale: Пиэль от אשר здесь может означать идти прямо, двигаться дальше или продвигаться. Выбранный вариант сохраняет идею продолжения движения, не сводя её просто к «ходить».
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Обычное обозначение дороги, а метафорически — образа жизни; «путь» естественен в русском и поддерживает нравственную метафору.
- source_word: רָעִים
  choice: злые люди
  rationale: Мужская форма множественного числа употреблена субстантивно и обозначает людей, творящих зло. «Злые люди» сохраняет личностную и грамматически мужскую отнесённость исходного выражения.
theological_decisions:
- issue: Передача мужского множественного числа רָעִים
  choice: злые люди
  alternative: злодеи; творящие зло
  rationale: Исходная форма — мужское множественное число, употреблённое в отношении людей. Формулировка «злые люди» отражает это без добавления конфессионального или узкодоктринального смысла.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и метафоры нравственного пути. «Тропа» и «путь» передают два близких, но разных еврейских существительных; синтаксис остаётся ясным и назидательным.
