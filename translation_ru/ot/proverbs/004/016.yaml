id: PRO.4.16
reference: Proverbs 4:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י לֹ֣א יִֽ֭שְׁנוּ אִם לֹ֣א יָרֵ֑עוּ וְֽ/נִגְזְלָ֥ה שְׁ֝נָתָ֗/ם אִם לֹ֥א יכשולו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/016.yaml
  text: For they do not sleep unless they have done evil[a], and their sleep is taken away unless they make someone stumble.
translation:
  language: ru
  text: Ведь они не уснут, пока не совершат зла, и лишаются сна, пока не заставят кого-нибудь споткнуться[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока сами не споткнутся». Краткую еврейскую форму можно понять как указание либо на то, что они заставляют другого споткнуться, либо на то, что спотыкаются сами; контекст скорее говорит о вреде, причинённом другим.'
    reason: Альтернативное прочтение краткой еврейской формы.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующего предостережения; «ведь» естественно передаёт причинно-пояснительную связь в современном русском языке.
- source_word: יִשְׁנוּ
  choice: они не уснут
  rationale: Форма от ישׁן обозначает обычный сон. Будущий совершенный вид в конструкции с «пока не» естественно выражает, что злодеи не ложатся спать до совершения зла.
- source_word: יָרֵעוּ
  choice: не совершат зла
  rationale: Hiphil от רעע может означать совершение зла или причинение вреда. Поскольку объект не назван, перевод сохраняет общее нравственное значение и не уточняет жертву.
- source_word: וְנִגְזְלָה
  choice: лишаются
  rationale: Niphal от גזל передаёт отнятие или утрату. «Лишаются сна» сохраняет смысл пассивного лишения и звучит естественно по-русски.
- source_word: שְׁנָתָם
  choice: сна
  rationale: Существительное означает сам сон; общеупотребительное «сон» точнее и понятнее, чем стилистически приподнятое «дремота».
- source_word: יכשולו
  choice: не заставят кого-нибудь споткнуться
  rationale: В контексте параллелизм указывает на причинение падения другому человеку. Перевод сохраняет образ спотыкания, не сводя его исключительно к буквальному физическому действию; краткость еврейской формы и возможность непереходного понимания отмечены в сноске.
theological_decisions:
- issue: Неназванный объект при יָרֵעוּ
  choice: Общее совершение зла
  alternative: Причинение вреда другим
  rationale: В еврейском тексте объект отсутствует, поэтому основной текст не сужает смысл до вреда конкретной жертве.
- issue: Значение יכשולו
  choice: Заставить другого споткнуться или пасть
  alternative: Споткнуться самим
  rationale: Параллелизм с совершением зла и логика изречения поддерживают причинное понимание, однако краткая еврейская форма допускает и непереходное прочтение, которое сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным библейской мудрости. Конструкция «не уснут, пока не…» передаёт привычную одержимость злом естественно и без лишнего толкования; метафора спотыкания сохранена.
