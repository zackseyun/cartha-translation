  text: אַֽל תֵּט יָמִ֥ין וּ/שְׂמֹ֑אול הָסֵ֖ר רַגְלְ/ךָ֣ מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/027.yaml
  text: Do not turn to the right or to the left[b][a]; remove your foot from evil.
translation:
  language: ru
  text: Не сворачивай ни вправо, ни влево; отведи ногу от зла.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּט
  choice: не сворачивай
  rationale: Форма с אַל выражает запрет. «Не сворачивай» естественно сочетается с направлениями «вправо» и «влево» и передаёт образ отклонения от прямого пути.
- source_word: יָמִין וּשְׂמֹאול
  choice: ни вправо, ни влево
  rationale: Парные обозначения направлений переданы привычной русской конструкцией, сохраняющей параллелизм и смысл отклонения в любую сторону.
- source_word: הָסֵר
  choice: отведи
  rationale: Повелительная форма каузативного глагола передаёт требование удалить или направить прочь. «Отведи» естественно звучит с дополнением «ногу» и сохраняет телесный образ.
- source_word: רַגְלְךָ
  choice: ногу
  rationale: Сохранено единственное число оригинала и метафора ноги как направленности поступков и жизненного пути; притяжательное значение ясно из обращения к собеседнику.
- source_word: מֵרָע
  choice: от зла
  rationale: В контексте наставления о праведном пути רַע обозначает зло в широком нравственном смысле. Перевод не сужает значение до вреда или конкретного злого поступка.
theological_decisions:
- issue: 'Значение רַע: нравственное зло или беда/вред'
  choice: зло
  alternative: вред, беда
  rationale: Контекст Притч 4 противопоставляет прямой путь пути нечестивых, поэтому нравственный смысл наиболее вероятен; широкое слово «зло» при этом не уточняет его сверх текста.
translation_notes:
  register: Современный литературный русский язык с кратким наставительным ритмом. Сохранены параллелизм направлений и конкретная метафора ноги; избегнуты как архаичное «удали ногу свою», так и более истолковывающее «держись подальше от зла».
