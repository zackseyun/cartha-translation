  text: פְּרָעֵ֥/הוּ אַל תַּעֲבָר בּ֑/וֹ שְׂטֵ֖ה מֵ/עָלָ֣י/ו וַ/עֲבֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/015.yaml
  text: Avoid it[a]; do not pass through it[b]. Turn away from it and pass on.
translation:
  language: ru
  text: Избегай его[a], не иди по нему; уклонись от него и иди дальше[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Держись от него подальше». Еврейский глагол редок и означает, что этого пути следует сторониться.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уклонись от него и пройди мимо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָעֵהוּ
  choice: Избегай его
  rationale: Редкий глагол в данном контексте выражает повеление держаться подальше от пути нечестивых. «Избегай» ясно и естественно передаёт намеренное уклонение от него.
- source_word: אַל תַּעֲבָר בּוֹ
  choice: не иди по нему
  rationale: Отрицательная частица אַל выражает запрет, а сочетание עבר с ב здесь описывает движение по пути или через него. В контексте пути русское «не иди по нему» естественно сохраняет пространственный образ.
- source_word: שְׂטֵה מֵעָלָיו
  choice: уклонись от него
  rationale: Императив שְׂטֵה означает «сверни, отклонись», а מֵעָלָיו указывает на удаление от упомянутого пути. Выбранная формулировка передаёт сознательное изменение направления, не создавая впечатления, будто человек уже вступил на этот путь.
- source_word: וַעֲבוֹר
  choice: и иди дальше
  rationale: Заключительный императив от עבר призывает продолжить движение, миновав опасный путь. «Иди дальше» естественно завершает последовательность кратких наставлений.
theological_decisions: []
translation_notes:
  register: Краткая цепь повелений сохранена. Использован современный литературный русский язык с ясным пространственным образом пути; местоимение мужского рода отсылает к «пути» из ближайшего контекста.
