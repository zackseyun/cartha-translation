  text: I have instructed you in the way of wisdom[a]; I have led you in paths of uprightness.
translation:
  language: ru
  text: 'Я наставил тебя на путь мудрости,

    повёл тебя по стезям правоты[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по прямым стезям». Еврейское слово может означать как буквальную прямизну, так и нравственную правоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֶרֶךְ חָכְמָה
  choice: на путь мудрости
  rationale: Сохраняется образ жизненного пути, характерный для Притчей. Русская конструкция «наставить на путь» естественно передаёт как обучение, так и направление к определённому образу жизни.
- source_word: הֹרֵתִיךָ
  choice: Я наставил тебя
  rationale: Каузативная форма глагола ירה означает «учить, наставлять, направлять». «Наставил» уместно для речи учителя мудрости и поддерживает образ пути.
- source_word: הִדְרַכְתִּיךָ
  choice: повёл тебя
  rationale: Каузативная форма דרך передаёт ведение по дороге или направлению. «Повёл» сохраняет образ движения и естественно сочетается со «стезями».
- source_word: בְּמַעְגְּלֵי
  choice: по стезям
  rationale: מַעְגָּל обозначает колею, тропу или путь. «Стези» сохраняют множественное число и поэтический параллелизм с «путём», оставаясь понятными в библейском литературном регистре.
- source_word: יֹשֶׁר
  choice: правоты
  rationale: Слово совмещает пространственный смысл прямизны и нравственный смысл правоты. В основном тексте «правота» естественно выражает этическую направленность, а примечание сохраняет буквальный образ прямых путей.
