  text: Prize her highly[a], and she will exalt you[b]; she will honor you when you embrace her.
translation:
  language: ru
  text: Дорожи ею[a] — и она возвысит тебя; она почтит тебя, когда ты обнимешь её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Высоко цени её»; возможно также: «Превозноси её». Начальный глагол встречается редко и может означать высоко ценить, лелеять или превозносить мудрость.'
    reason: lexical_alternative
  - marker: b
    text: 'Союз может иметь и причинное значение: «потому что ты обнимаешь её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלְסְלֶהָ
  choice: Дорожи ею
  rationale: Редкий глагол סלסל допускает значения высокой оценки, бережного отношения или превознесения. «Дорожи ею» естественно передаёт призыв высоко ценить олицетворённую мудрость и не создаёт повтора со следующим «возвысит».
- source_word: וּתְרוֹמְמֶךָ
  choice: и она возвысит тебя
  rationale: Форма от רומם означает «поднимать, возвышать»; подлежащее женского рода — олицетворённая мудрость. «Возвысит» сохраняет почётный и образный смысл.
- source_word: תְּכַבֵּדְךָ
  choice: она почтит тебя
  rationale: Порода пиэль глагола כבד здесь означает оказать или даровать честь. «Почтит» точно и естественно передаёт этот смысл, не усиливая его до «прославит».
- source_word: כִּי
  choice: когда
  rationale: 'В данном контексте כִּי можно понять как указание на обстоятельство: мудрость почтит человека, когда тот обнимет её. Возможное причинное прочтение сохранено в примечании.'
- source_word: תְחַבְּקֶנָּה
  choice: ты обнимешь её
  rationale: Глагол חבק буквально означает «обнимать». Перевод сохраняет женскую персонификацию мудрости и образ близкой привязанности к ней.
