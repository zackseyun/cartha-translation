base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/028.yaml
  text: A man who has no restraint over his spirit is like a city broken into[a], without a wall.
translation:
  language: ru
  text: Как город с проломом, без стены, так и человек, не владеющий своим духом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сдерживающий свой нрав»; или: «не умеющий владеть собой». Буквально: «нет удержания над его духом». Еврейское слово «дух» может обозначать внутренний настрой или вспыльчивость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: город
  rationale: Основное значение — укреплённое или обнесённое стеной поселение; «город» естественно передаёт образ притчи.
- source_word: פְּרוּצָה
  choice: с проломом
  rationale: Причастие от פרץ указывает на пробитую брешь в обороне. «С проломом» сохраняет конкретный образ города, чья защита нарушена.
- source_word: אֵין חוֹמָה
  choice: без стены
  rationale: Кратко и буквально передаёт отсутствие городской стены и подчёркивает беззащитность.
- source_word: אִישׁ
  choice: человек
  rationale: Хотя существительное грамматически мужского рода, здесь оно имеет обобщённое значение. Русское «человек» сохраняет форму мужского рода и естественно выражает общеобязательный характер изречения.
- source_word: מַעְצָר
  choice: не владеет
  rationale: Существительное означает удержание или власть над чем-либо. Русская конструкция «владеть своим духом» естественно передаёт способность сдерживать внутренние побуждения.
- source_word: לְרוּחוֹ
  choice: своим духом
  rationale: רוּחַ может означать дух, внутренний настрой или вспыльчивость. «Дух» сохраняет широту и образность еврейского выражения, не сводя его только к гневу.
theological_decisions:
- issue: Обобщённое мужское обозначение в изречении мудрости
  choice: человек
  alternative: мужчина
  rationale: אִישׁ здесь обозначает любого человека, к которому применима притча. «Человек» точно передаёт этот обобщённый смысл, не внося утверждения, будто речь относится только к мужчинам.
- issue: Значение «духа» как внутренней способности к самообладанию
  choice: не владеет своим духом
  alternative: не сдерживает свой нрав / не умеет владеть собой
  rationale: Основной текст сохраняет רוּחַ как «дух» и оставляет открытым диапазон от внутреннего настроя до вспыльчивости; толковательные варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного параллелизма притчи. Начальная конструкция «Что …, то …» естественно оформляет именное сравнение еврейского текста; образ пролома и отсутствующей стены сохранён без пояснительного расширения.
