  text: The north wind brings forth rain[a], and an angry face[b], a slanderous tongue.
translation:
  language: ru
  text: Северный ветер приносит дождь[a], а злословящий язык[b] — сердитое лицо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Северный ветер прогоняет дождь, а злословящий язык вызывает сердитое лицо». Еврейский глагол допускает разные толкования: северный ветер может либо приносить дождь, либо разгонять его.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «язык тайны» или «скрытый язык», то есть скрытая речь за спиной, например злословие или клевета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ צָ֭פוֹן
  choice: северный ветер
  rationale: Естественно передаёт сочетание со значением ветра, дующего с севера.
- source_word: תְּח֣וֹלֵֽל
  choice: приносит
  rationale: Глагол допускает смысл порождения или причинения; «приносит» естественно звучит по-русски и сохраняет причинную параллель между двумя частями стиха.
- source_word: גָּ֑שֶׁם
  choice: дождь
  rationale: Обычное и точное соответствие еврейскому слову, обозначающему дождь или ливень.
- source_word: וּ/פָנִ֥ים נִ֝זְעָמִ֗ים
  choice: разгневанное лицо
  rationale: Хотя פָנִים формально имеет форму множественного числа, оно обычно обозначает лицо; причастие передаёт гнев или негодование.
- source_word: לְשׁ֣וֹן סָֽתֶר
  choice: тайный язык
  rationale: Буквально это «язык тайны/скрытого». Сохранён образ оригинала и его намеренная сжатость; пояснение указывает на скрытую речь за спиной.
