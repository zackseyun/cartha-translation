  text: אָ֘כֹ֤ל דְּבַ֣שׁ הַרְבּ֣וֹת לֹא ט֑וֹב וְ/חֵ֖קֶר כְּבֹדָ֣/ם כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/027.yaml
  text: To eat much honey is not good[a], and to search out their glory is glory.
translation:
  language: ru
  text: Есть много мёда — нехорошо; и исследовать их славу — слава.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст второй строки труден: буквально — «и исследование их славы — слава». Возможно, смысл в том, что искать славы для себя — не почётно, или в том, что исследовать важные дела — почётно. Здесь близко передан Масоретский текст.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֹל
  choice: есть
  rationale: Инфинитив употреблён как обобщённое обозначение действия; русский инфинитив сохраняет афористическую форму.
- source_word: דְּבַשׁ
  choice: мёда
  rationale: Прямое значение слова и конкретный образ исходного текста сохранены.
- source_word: הַרְבּוֹת
  choice: много
  rationale: Передаёт чрезмерность количества, не добавляя более узкого толкования о последствиях.
- source_word: לֹא טוֹב
  choice: нехорошо
  rationale: Краткая оценочная формула естественно звучит по-русски и не сводит смысл только к вреду для здоровья.
- source_word: וְחֵקֶר
  choice: и исследовать
  rationale: Еврейское существительное со значением исследования передано инфинитивом для параллелизма с первой строкой и естественности русского синтаксиса.
- source_word: כְּבֹדָם
  choice: их славу
  rationale: Сохранён суффикс третьего лица множественного числа Масоретского текста без замены на толковательное «собственную славу».
- source_word: כָּבוֹד
  choice: слава
  rationale: Именное сказуемое и повтор корня כבד сохранены насколько возможно буквально, несмотря на трудность строки.
theological_decisions:
- issue: Смысл второй строки
  choice: 'Сохранить трудное чтение Масоретского текста: «исследовать их славу — слава»'
  alternative: «искать собственной славы — не слава» или «исследовать важные дела — почётно»
  rationale: Еврейский текст допускает разные объяснения, однако ни одно из них не следует молча вводить в основной перевод; буквальная передача сохраняет подлинную неоднозначность и словесную игру.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма. Необычность второй строки намеренно сохранена и пояснена сноской.
