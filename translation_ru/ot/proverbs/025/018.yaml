  yaml_path: translation/ot/proverbs/025/018.yaml
  text: A club[a], a sword, and a sharp arrow is a man who bears false witness against his neighbor.
translation:
  language: ru
  text: Дубина[a], меч и острая стрела — таков человек, дающий ложное свидетельство против своего ближнего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «боевой молот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵפִיץ
  choice: дубина
  rationale: Слово обозначает тяжёлое ударное, сокрушающее оружие. «Дубина» ясно и естественно передаёт образ; возможен более специальный вариант «боевой молот».
- source_word: חֶרֶב
  choice: меч
  rationale: Обычное и точное соответствие распространённому еврейскому названию меча.
- source_word: חֵץ שָׁנוּן
  choice: острая стрела
  rationale: Прилагательное означает «заострённый, острый»; перевод сохраняет конкретный образ оружия и трёхчастное перечисление.
- source_word: אִישׁ
  choice: человек
  rationale: Мужской род единственного числа употреблён здесь как обозначение типичного человека; русское «человек» естественно и не устраняет грамматическую форму последующего причастия.
- source_word: עֹנֶה
  choice: лжесвидетельствующий
  rationale: Буквально причастие означает «отвечающий», но в сочетании с עֵד שָׁקֶר речь идёт о даче ложного свидетельства. Сжатая русская формулировка точно передаёт судебно-этический смысл.
- source_word: בְרֵעֵהוּ
  choice: против своего ближнего
  rationale: В контексте свидетельства предлог имеет направленное против другого лица значение; «ближний» сохраняет обычный библейский и этический смысл רֵעַ.
- source_word: עֵד שָׁקֶר
  choice: лжесвидетельствующий
  rationale: Сочетание буквально означает «ложный свидетель» или «свидетельство лжи». Оно передано вместе с עֹנֶה глагольно-причастной формой, естественной для современного русского языка.
