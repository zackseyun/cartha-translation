translation:
  language: ru
  text: иначе тот, кто услышит, опозорит тебя[a], и дурная молва о тебе не утихнет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пристыдит тебя» или «укорит тебя». Употреблённый здесь еврейский глагол редок, и его значение в этом контексте не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и дурная молва о тебе не вернётся». Возможны два смысла: дурной слух о тебе продолжит ходить либо причинённый позор уже нельзя будет обратить вспять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: иначе
  rationale: Частица вводит нежелательное последствие предупреждения; «иначе» естественно связывает стих с предыдущим контекстом и сохраняет краткость изречения.
- source_word: יְחַסֶּדְךָ
  choice: опозорит тебя
  rationale: Редкая и трудная форма Piel от חסד здесь, по контексту, имеет отрицательный смысл публичного посрамления или укора. «Опозорит» передаёт общественный характер последствий, не скрывая лексической неуверенности, отмеченной в сноске.
- source_word: שֹׁמֵעַ
  choice: услышавший
  rationale: Субстантивированное причастие обозначает неопределённого человека, который услышит разглашённое; русское «услышавший» лаконично и естественно.
- source_word: דִבָּתְךָ
  choice: дурная молва о тебе
  rationale: דִּבָּה обозначает дурной слух, недобрую молву или порочащий рассказ. Формулировка сохраняет идею распространяющегося сообщения и не создаёт впечатления, будто адресат сам клевещет.
- source_word: לֹא תָשׁוּב
  choice: уже не утихнет
  rationale: Буквально выражение означает «не вернётся / не обратится». В сочетании с «молвой» естественное русское «не утихнет» передаёт необратимость и продолжающееся распространение, тогда как буквальная возможность дана в сноске.
