source:
  edition: WLC
  text: כְּ/צִנַּת שֶׁ֨לֶג בְּ/י֬וֹם קָצִ֗יר צִ֣יר נֶ֭אֱמָן לְ/שֹׁלְחָ֑י/ו וְ/נֶ֖פֶשׁ אֲדֹנָ֣י/ו יָשִֽׁיב־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/013.yaml
  text: Like the coolness of snow on a harvest day is a faithful messenger to those who send him[b][a], for he refreshes the life of his masters.
translation:
  language: ru
  text: 'Как прохлада от снега в день жатвы[a], так верный посланник — для тех, кто его послал: он освежает душу своих господ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как холод снега во время жатвы». Вероятно, имеется в виду освежающая прохлада, связанная со снегом, а не снегопад, губительный для урожая.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он возвращает силы своим господам»; букв. «возвращает душу своих господ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִנַּת שֶׁלֶג
  choice: как прохлада от снега
  rationale: צִנָּה обозначает холод или прохладу; в положительном сравнении уместнее «прохлада». Предлог «от» естественно передаёт прохладу, связанную со снегом, не подразумевая снегопада во время жатвы.
- source_word: בְּיוֹם קָצִיר
  choice: в день жатвы
  rationale: Сохраняет конкретный временной образ еврейского текста и звучит естественно по-русски.
- source_word: צִיר נֶאֱמָן
  choice: верный посланник
  rationale: «Посланник» ясно обозначает человека, отправленного с поручением или вестью; «верный» сохраняет нравственный оттенок надёжности.
- source_word: לְשֹׁלְחָיו
  choice: для тех, кто его послал
  rationale: Передаёт множественное число причастия с местоименным суффиксом и избегает неестественного буквального выражения «для его посылающих».
- source_word: וְנֶפֶשׁ אֲדֹנָיו יָשִׁיב
  choice: он освежает душу своих господ
  rationale: Нефеш здесь обозначает внутреннюю жизнь, жизненные силы или самого человека, а Hiphil от שוב — их восстановление. «Освежает душу» естественно продолжает образ прохлады и сохраняет широту еврейского выражения; множественное «господ» отражает форму אֲדֹנָיו.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой формой мудрого изречения. Соотносительная конструкция «как… так…» делает сравнение ясным, не устраняя образность и смысловую широту еврейского текста.
