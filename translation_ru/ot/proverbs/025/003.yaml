base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/003.yaml
  text: The heavens for height[a], and the earth for depth, and the heart of kings—there is no searching out.
translation:
  language: ru
  text: Как небеса недосягаемы в высоте и земля — в глубине, так сердце царей неисследимо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для сердца царей нет исследования (постижения)». Возможный перевод: «сердце царей невозможно постичь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Форма множественного числа обозначает небеса или небо; «небеса» сохраняет возвышенный, но понятный библейский регистр и космический параллелизм с землёй.
- source_word: לָרוּם
  choice: по высоте
  rationale: 'Предлог ל здесь указывает на отношение или аспект: небеса рассматриваются по их высоте. Русское «по высоте» естественно передаёт эту конструкцию.'
- source_word: וָאָרֶץ
  choice: земля
  rationale: В параллели с небесами אֶרֶץ означает землю как часть космоса, а не отдельную страну или сушу.
- source_word: לָעֹמֶק
  choice: по глубине
  rationale: Передаёт тот же аспектуальный оборот, что и «по высоте», сохраняя краткий параллелизм еврейского текста.
- source_word: לֵב
  choice: сердце
  rationale: «Сердце» сохраняет исходный образ и в данном контексте охватывает мысли, намерения и внутренние побуждения царей.
- source_word: מְלָכִים
  choice: царей
  rationale: Существительное прямо означает царей; более общее «правителей» неоправданно расширило бы значение.
- source_word: אֵין חֵקֶר
  choice: неисследимо
  rationale: 'Кратко и естественно выражает буквальную мысль «нет исследования/постижения»: внутренние замыслы царей невозможно до конца исследовать. В сноске сохранена более буквальная формулировка и смысловая альтернатива.'
theological_decisions:
- issue: Область действия выражения אֵין חֵקֶר
  choice: Грамматически отнести «неисследимо» прежде всего к сердцу царей, сохранив образную связь с высотой небес и глубиной земли.
  alternative: Распространить единое утверждение о неисследимости непосредственно на все три элемента.
  rationale: В еврейском тексте отрицательная именная конструкция непосредственно завершает третью часть, тогда как первые две части служат эллиптическим сравнительным фоном. Перевод не устраняет риторическое сопоставление.
translation_notes:
  register: Современный литературный русский с лаконичным пословичным ритмом. Тире восполняют эллипсис еврейских именных конструкций; союз «а» естественно вводит вершину трёхчастного сравнения. Маркер сноски поставлен после утверждения, которое она поясняет.
