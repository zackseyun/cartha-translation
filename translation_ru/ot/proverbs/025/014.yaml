  text: נְשִׂיאִ֣ים וְ֭/רוּחַ וְ/גֶ֣שֶׁם אָ֑יִן אִ֥ישׁ מִ֝תְהַלֵּ֗ל בְּ/מַתַּת שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/014.yaml
  text: Like clouds and wind without rain is a man who boasts of a false gift[a].
translation:
  language: ru
  text: Тучи и ветер, а дождя нет — таков человек, который хвалится мнимым подарком.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тучи и ветер, а дождя нет — таков человек, который хвалится подарком, но не дарит его».'
    reason: Еврейское выражение может обозначать подарок, оказавшийся ложным или пустым, в том числе обещанный, но не вручённый.
lexical_decisions:
- source_word: נְשִׂיאִים
  choice: тучи
  rationale: В контексте дождя слово обозначает облачные образования; «тучи» естественно передаёт ожидание дождя и сохраняет выразительность сравнения.
- source_word: רוּחַ
  choice: ветер
  rationale: В сочетании с тучами и дождём несомненно имеется в виду ветер как погодное явление.
- source_word: גֶשֶׁם
  choice: дождь
  rationale: Обычное и контекстуально точное значение.
- source_word: אָיִן
  choice: а дождя нет
  rationale: Такая конструкция естественно и выразительно передаёт еврейское «и дождя нет», подчёркивая обманутое ожидание.
- source_word: אִישׁ
  choice: человек
  rationale: Русское «человек» естественно передаёт обобщённое значение существительного мужского рода, не сужая смысл до конкретного мужчины.
- source_word: מִתְהַלֵּל
  choice: хвалится
  rationale: Возвратная форма естественно передаёт самовосхваление; слово соответствует достоинству и краткости языка притчи.
- source_word: בְּמַתַּת
  choice: подарком
  rationale: Творительный падеж после «хвалится» идиоматично передаёт содержание похвальбы.
- source_word: שָׁקֶר
  choice: которого не было
  rationale: В данном сочетании שׁקר характеризует подарок как мнимый, ложный или фактически не данный. Развёрнутая формулировка ясна современному читателю, но сохраняет смысловую неоднозначность относительно обещанного или ложно заявленного дара.
