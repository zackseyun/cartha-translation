source:
  edition: WLC
  text: תַּפּוּחֵ֣י זָ֭הָב בְּ/מַשְׂכִּיּ֥וֹת כָּ֑סֶף דָּ֝בָ֗ר דָּבֻ֥ר עַל אָפְנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/011.yaml
  text: Like apples of gold in settings of silver is a word spoken at the right time[a][b][c].
translation:
  language: ru
  text: Что золотые яблоки[a] в серебряной оправе[b], то слово, сказанное к месту[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точный вид плода, обозначенного еврейским словом, неизвестен; возможно, он не вполне соответствовал современному яблоку.
    reason: cultural_note
  - marker: b
    text: 'Или: «в серебряной резьбе»; возможно также понимание: «в серебряной филиграни».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сказанное вовремя» или «сказанное уместно»; буквально: «сказанное на своих колёсах» — трудное выражение, указывающее на речь, подходящую к обстоятельствам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחֵי
  choice: яблоки
  rationale: Традиционное и узнаваемое соответствие еврейскому תַּפּוּחַ; точный вид древнего плода остаётся неясным, что отмечено в сноске.
- source_word: זָהָב
  choice: золотые
  rationale: Прилагательное естественно передаёт материал образных плодов по-русски.
- source_word: בְּמַשְׂכִּיּוֹת כָּסֶף
  choice: в серебряной оправе
  rationale: Передаёт образ золотых плодов, помещённых в искусно выполненное серебряное обрамление; точный вид художественной работы неясен.
- source_word: דָּבָר דָּבֻר
  choice: слово, сказанное
  rationale: Сохраняет повтор корня דבר и краткий характер еврейского изречения.
- source_word: עַל אָפְנָיו
  choice: к месту
  rationale: Естественно выражает уместность речи, не сужая смысл исключительно до своевременности; буквальный образ «на своих колёсах» пояснён в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, запоминающейся пословичной конструкцией «Что…, то…». Образный порядок еврейского текста сохранён; неясность названия плода, типа серебряной работы и идиомы עַל אָפְנָיו вынесена в сноски.
