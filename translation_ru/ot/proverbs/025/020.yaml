base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/020.yaml
  text: Like one who takes off a garment on a cold day[a], and like vinegar on soda[b], is one who sings songs to a troubled heart.
translation:
  language: ru
  text: Как тот, кто снимает одежду в холодный день, как уксус на натре[a], — так и тот, кто поёт песни скорбящему сердцу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Натр — природная минеральная щёлочь. Уксус при соприкосновении с ней вступает в реакцию.
    reason: historical_realia
  - marker: b
    text: 'Буквально: «на (или над) злым/несчастным, тяжёлым сердцем». Здесь, вероятно, имеется в виду сердце скорбящее, подавленное, а не обязательно злое в нравственном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲדֶה
  choice: тот, кто снимает
  rationale: Форма понята от עדה в значении снятия одежды. Русское «снимает» естественно передаёт действие, не уточняя сверх текста, снимает ли человек одежду с себя или с другого.
- source_word: בֶּגֶד
  choice: одежду
  rationale: Общее обозначение предмета одежды; более узкое «плащ» или «верхняя одежда» не требуется исходным текстом.
- source_word: בְּיוֹם קָרָה
  choice: в холодный день
  rationale: Прямой и естественный временной оборот, сохраняющий образ лишения необходимого тепла.
- source_word: חֹמֶץ
  choice: уксус
  rationale: Обычное и однозначное соответствие древнееврейскому слову.
- source_word: נָתֶר
  choice: натр
  rationale: Речь идёт о природной минеральной щёлочи, а не обязательно о современной пищевой соде. «Натр» точнее сохраняет древнюю реалию; пояснение дано в сноске.
- source_word: וְשָׁר בַּשִּׁרִים
  choice: поющий песни
  rationale: Сохранены причастная конструкция и множественное число существительного, при этом выражение звучит по-русски кратко и по-пословичному.
- source_word: עַל לֶב רָע
  choice: опечаленному сердцу
  rationale: Буквально говорится о «плохом/тяжёлом сердце», но в данном контексте это внутреннее состояние горя или подавленности, а не непременно нравственная испорченность.
theological_decisions:
- issue: Значение רָע в выражении לֶב רָע
  choice: 'Эмоциональная подавленность: «опечаленное сердце»'
  alternative: Нравственно злое сердце
  rationale: Сопоставление с неуместными и причиняющими неудобство действиями указывает на песни, обращённые к скорбящему человеку. Перевод не привносит утверждения о его нравственной порочности, однако буквальное выражение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, уравновешенным строем притчи. Повтор «как… и как… — таков…» сохраняет цепь сопоставлений исходного текста. «Натр» выбран ради исторической точности и разъяснён в сноске.
