  text: אַל תִּתְהַדַּ֥ר לִ/פְנֵי מֶ֑לֶךְ וּ/בִ/מְק֥וֹם גְּ֝דֹלִ֗ים אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/006.yaml
  text: Do not exalt yourself before a king[a], and do not stand in the place of great men.
translation:
  language: ru
  text: Не превозноси себя перед царём и не занимай места среди великих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на месте великих»; «среди знатных»; «среди влиятельных людей».'
    reason: 'Лексическая альтернатива для בִּמְקוֹם גְּדֹלִים: выражение может обозначать место, занимаемое людьми высокого положения, или пребывание среди них.'
lexical_decisions:
- source_word: תִּתְהַדַּר
  choice: превозноси себя
  rationale: Возвратная форма передаёт самовозвышение и стремление представить себя достойным особого почёта. «Превозноси себя» естественно выражает предостережение против самовыдвижения при царе.
- source_word: לִפְנֵי מֶלֶךְ
  choice: перед царём
  rationale: Краткий и естественный эквивалент со значением «в присутствии царя», сохраняющий придворный контекст.
- source_word: בִּמְקוֹם גְּדֹלִים
  choice: на место великих
  rationale: Сохраняет буквальные образы «места» и людей высокого положения, не уточняя без необходимости, идёт ли речь о вельможах, знатных или вообще влиятельных людях.
- source_word: תַּעֲמֹד
  choice: становись
  rationale: Передаёт основное значение глагола «стоять, становиться» и в данном контексте указывает на попытку занять почётное положение.
theological_decisions:
- issue: Передача גְּדֹלִים — грамматически мужского множественного числа
  choice: великих
  alternative: знатных; влиятельных людей
  rationale: 'Субстантивированное «великих» сохраняет грамматическую форму и неоднозначность еврейского выражения: имеются в виду люди высокого общественного положения, но конкретный титул не назван. В русском языке форма может употребляться обобщённо, поэтому искусственно вводить слово «мужчины» не требуется.'
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным пословичным звучанием. Синтаксический параллелизм двух запретов сохранён.
