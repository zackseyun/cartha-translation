  source_fidelity: В черновике верно переданы спор с ближним и запрет раскрывать доверительное. Однако «тайны другого» во множественном числе не соответствует единственному числу סוֹד («тайна/доверенное дело»). «Напрямую» не выражено в еврейском тексте и является интерпретирующей экспликацией, которую безопаснее не включать в основной текст.
  naturalness: «Веди свою тяжбу» литературно возможно, но «тяжба» в современном русском преимущественно ассоциируется с судебным разбирательством. «Веди свой спор с ближним» естественнее и сохраняет как межличностный, так и потенциально правовой диапазон רִיב.
  terminology: «Ближний» уместно для רֵעֶךָ в библейско-мудростном регистре. «Разглашай тайну другого» точно и естественно передаёт גלה и סוֹד אַחֵר; единственное число необходимо сохранить.
