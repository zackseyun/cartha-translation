  text: Argue your case with your neighbor himself[b][a], and do not reveal another person's secret.
translation:
  language: ru
  text: Веди свой спор с ближним и не разглашай тайну другого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רִיבְךָ
  choice: свою тяжбу
  rationale: Существительное רִיב обозначает спор, распрю, жалобу или судебное дело. «Тяжба» сохраняет предмет спора и возможный правовой оттенок, не ограничивая смысл формальным судом.
- source_word: רִיב
  choice: веди
  rationale: Повелительная форма רִיב призывает разбирать или вести спор. В сочетании «веди свою тяжбу» русский текст естественно передаёт однокоренной оборот оригинала.
- source_word: אֶת רֵעֶךָ
  choice: с ближним
  rationale: רֵעַ может означать ближнего, товарища или друга. «Ближний» здесь достаточно широко обозначает человека, с которым возник спор; «с» естественно передаёт сторону спора.
- source_word: וְסוֹד
  choice: и ... тайны
  rationale: סוֹד может означать тайну, конфиденциальный разговор или доверенный совет. В контексте запрета разглашения наиболее ясно слово «тайна».
- source_word: אַחֵר
  choice: другого
  rationale: Форма указывает на другого человека. Родительный оборот «тайны другого» кратко сохраняет структуру и некоторую ёмкость еврейского выражения.
- source_word: אַל תְּגָל
  choice: не выдавай
  rationale: Глагол גלה здесь означает раскрывать или разглашать. «Не выдавай тайны» — естественное современное сочетание, ясно выражающее запрет нарушать доверительность.
- source_word: implicit subject relation in רִיב ... אֶת רֵעֶךָ
  choice: напрямую
  rationale: В еврейском тексте нет отдельного слова «напрямую», однако противопоставление разглашению чужой тайны подразумевает непосредственное выяснение спора с самим ближним. Добавление вынесено в примечание как смысловая экспликация.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрости. Однокоренное еврейское сочетание רִיבְךָ רִיב передано устойчивым оборотом «веди свою тяжбу»; слово «тяжба» сохраняет как межличностный, так и возможный правовой оттенок. Экспликация «напрямую» отмечена сноской, чтобы не скрывать её отсутствие в явном виде в оригинале.
