lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: Предикативное прилагательное вводит характерное для изречений сравнительное суждение; краткое русское «лучше» естественно передаёт эту конструкцию.
- source_word: שֶׁבֶת
  choice: жить
  rationale: Хотя основное значение связано с сидением, при указании места глагольная форма означает пребывание или проживание; «жить» ясно передаёт смысл в современном русском языке.
- source_word: עַל פִּנַּת גָּג
  choice: в углу на крыше
  rationale: Сохранён конкретный образ тесного, открытого места на плоской крыше. Такая формулировка естественнее по-русски, чем буквальное «на углу крыши».
- source_word: מֵאֵשֶׁת
  choice: чем со ... женой
  rationale: Предлог מ־ после сравнительного «лучше» выражает второй член сравнения; по-русски конструкция естественно перестроена с «чем со».
- source_word: מדונים
  choice: сварливой
  rationale: Слово обозначает распри и ссоры и здесь характеризует жену как постоянно склонную к ним. «Сварливая» — современное и точное определение без лишнего усиления.
- source_word: וּבֵית חָבֶר
  choice: в общем доме
  rationale: Краткое еврейское выражение связано с совместностью, общностью или сожительством. «В общем доме» сохраняет практический смысл совместного домашнего пространства, не устраняя неоднозначность полностью.
