  text: By patience a ruler may be persuaded[b][a], and a gentle tongue breaks a bone.
translation:
  language: ru
  text: Терпением можно склонить правителя[a], а мягкая речь ломает кость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Долготерпением можно склонить правителя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мягкий язык ломает кость» — образ силы мягкой речи, преодолевающей твёрдость и сопротивление.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹרֶךְ אַפַּיִם
  choice: Терпением
  rationale: Еврейская идиома буквально говорит о «долготе ноздрей», то есть о медленности на гнев, выдержке и долготерпении. «Терпением» естественно и кратко передаёт смысл настойчивой сдержанности.
- source_word: יְפֻתֶּה
  choice: можно убедить
  rationale: Форма Pual от פתה обозначает, что кого-либо склоняют или убеждают. Модальная формулировка по-русски естественно выражает общую возможность, утверждаемую пословицей, не привнося оттенка обмана.
- source_word: קָצִין
  choice: правителя
  rationale: Слово обозначает наделённого властью человека — правителя, начальника или сановника. «Правитель» сохраняет общий характер изречения.
- source_word: לָשׁוֹן רַכָּה
  choice: кроткий язык
  rationale: Буквально «мягкий язык»; это образ кроткой, незлобивой речи. Выбор сохраняет телесный образ языка и звучит достойно в контексте библейской мудрости.
- source_word: תִּשְׁבָּר גָּרֶם
  choice: ломает кость
  rationale: Буквальный и намеренно парадоксальный образ передаёт силу мягкой речи, способной преодолеть твёрдое сопротивление.
