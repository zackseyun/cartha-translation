  text: Remove the wicked from before the king[b][a], and his throne will be established in righteousness.
translation:
  language: ru
  text: Удали нечестивого от царя[a], и престол его утвердится в праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Убери нечестивого из окружения царя». Вероятно, речь идёт об устранении дурного и развращающего влияния при царском дворе.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «в справедливости» или «праведностью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: Удали
  rationale: Повелительная форма передаёт требование устранить или отвести; «удали» кратко сохраняет побудительную силу и не уточняет способ устранения.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное в единственном числе обозначает нечестивого человека; русская форма естественно сохраняет и единственное число, и нравственную характеристику.
- source_word: לִפְנֵי מֶלֶךְ
  choice: от царя
  rationale: Сочетание указывает на удаление из присутствия царя. Такой перевод естественнее буквального «от лица царя» и не сужает смысл исключительно до придворной должности.
- source_word: וְיִכּוֹן
  choice: утвердится
  rationale: Нифаль глагола כון выражает становление прочным и устойчивым; «утвердится» передаёт результативный оттенок и соответствует контексту царского престола.
- source_word: בַּצֶּדֶק
  choice: в праведности
  rationale: Предлог ב допускает понимание сферы или средства, а צֶדֶק объединяет нравственную правоту и справедливость. «В праведности» сохраняет широту и некоторую неоднозначность еврейского выражения.
- source_word: כִּסְאוֹ
  choice: престол его
  rationale: Местоименный суффикс третьего лица мужского рода естественно относится к царю; порядок слов придаёт строке достойное, пословичное звучание.
