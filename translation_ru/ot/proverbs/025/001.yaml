  text: These also are proverbs of Solomon[b][a], which the men of Hezekiah king of Judah copied.
translation:
  language: ru
  text: Вот ещё притчи Соломона, которые переписали[a] люди Езекии[b], царя Иудеи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переписали» или «собрали». Еврейский глагол, вероятно, указывает на переписывание этих притч с включением их в собрание.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «люди Езекии», вероятно, относится к придворным служителям или писцам царя Езекии.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: Это также
  rationale: Сочетание указывает, что далее следует ещё одно собрание притч; формулировка сохраняет связь с предыдущими разделами и естественна по-русски.
- source_word: מִשְׁלֵי
  choice: притчи
  rationale: Традиционное и жанрово точное обозначение кратких мудрых изречений в книге Притчей.
- source_word: שְׁלֹמֹה
  choice: Соломона
  rationale: Общепринятая русская форма личного имени; родительный падеж передаёт еврейскую конструкцию принадлежности.
- source_word: הֶעְתִּיקוּ
  choice: переписали
  rationale: В данном контексте каузативная форма глагола עתק, вероятнее всего, обозначает перенос изречений посредством переписывания; выбранный вариант ясен и не уточняет без достаточных оснований характер редакционной работы.
- source_word: אַנְשֵׁי חִזְקִיָּה
  choice: люди Езекии
  rationale: Формально передаёт мужское множественное число и принадлежность этих людей к царю, не подменяя общее обозначение более узким «писцы» или «чиновники».
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Естественно передаёт титул Езекии и еврейскую сопряжённую конструкцию.
theological_decisions:
- issue: Кем были «люди Езекии» (אַנְשֵׁי חִזְקִיָּה)
  choice: люди Езекии
  alternative: служители, придворные или писцы Езекии
  rationale: Исходный текст прямо не определяет их должности. Основной текст сохраняет широкое мужское обозначение, а примечание сообщает вероятный придворно-писцовый контекст, не превращая его в утверждение.
- issue: Характер работы, выраженной глаголом הֶעְתִּיקוּ
  choice: переписали
  alternative: перенесли; записали; собрали
  rationale: Контекст заголовка к собранию допускает участие в составлении корпуса, однако наиболее вероятен смысл переписывания или переноса из одного письменного собрания в другое. Перевод не утверждает более сложного редакционного процесса.
translation_notes:
  register: Современный литературный русский язык с краткой заголовочной формой. Сохранены традиционные библейские имена и прямое «люди Езекии»; менее очевидные историко-лексические сведения вынесены в примечания.
