  text: Remove the dross from the silver[a], and a vessel comes out for the refiner.
translation:
  language: ru
  text: Удали примеси из серебра — и у мастера, очищающего серебро,[a] получится изделие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у серебряных дел мастера». Еврейское слово может обозначать очистителя металла или мастера по металлу; в данном контексте речь идёт об очистке серебра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: Удали
  rationale: Повелительное значение передано естественным русским глаголом; он сохраняет наставительный тон и идею удаления.
- source_word: סִיגִים
  choice: примеси
  rationale: В контексте очистки серебра слово обозначает отделяемые нежелательные вещества. «Примеси» понятно современному читателю и точнее по смыслу, чем узкотехническое или устаревающее «шлак».
- source_word: מִכָּסֶף
  choice: из серебра
  rationale: Предлог מִן выражает отделение; русское «из» естественно передаёт удаление примесей из металла.
- source_word: וַיֵּצֵא
  choice: получится
  rationale: Форма описывает результат последовательного действия в общеистинном изречении. «Получится» естественно передаёт итог обработки, не превращая его в повествование о прошлом.
- source_word: לַצֹּרֵף
  choice: у плавильщика
  rationale: צֹרֵף — мастер, очищающий или выплавляющий металл. «Плавильщик» удерживает непосредственный образ очистки серебра, а конструкция «у плавильщика» естественно передаёт результат труда мастера.
- source_word: כֶּלִי
  choice: сосуд
  rationale: Слово широко обозначает изделие, утварь или сосуд. «Сосуд» сохраняет традиционный конкретный образ, не уточняя его назначение сверх еврейского текста.
