  text: דְּבַ֣שׁ מָ֭צָאתָ אֱכֹ֣ל דַּיֶּ֑/ךָּ פֶּן תִּ֝שְׂבָּעֶ֗/נּוּ וַ/הֲקֵֽאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/016.yaml
  text: If you find honey[a], eat only enough for you, lest you become full of it and vomit it.
translation:
  language: ru
  text: Нашёл мёд — ешь лишь столько, сколько тебе достаточно[a], иначе пресытишься им, и тебя вырвет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «ешь достаточное тебе»; также возможно: «ешь столько, сколько тебе довольно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַשׁ
  choice: мёд
  rationale: Существительное прямо обозначает мёд; оснований заменять конкретный образ метафорой нет.
- source_word: מָצָאתָ
  choice: нашёл
  rationale: 'Форма перфекта 2-го лица мужского рода передана естественной для русского изречения условно-обобщающей конструкцией: «Нашёл мёд — …».'
- source_word: אֱכֹל
  choice: ешь
  rationale: Императив 2-го лица единственного числа; объект понятен из слова «мёд» и, как в еврейском тексте, отдельно не выражен.
- source_word: דַּיֶּךָ
  choice: лишь столько, сколько тебе достаточно
  rationale: Передаёт значение достаточной меры и предостерегающую мысль о самоограничении, не добавляя идеи строгой необходимости.
- source_word: פֶּן
  choice: иначе
  rationale: Союз вводит нежелательное последствие, которого следует избежать; «иначе» звучит естественно в современном русском наставлении.
- source_word: תִּשְׂבָּעֶנּוּ
  choice: пресытишься им
  rationale: Глагол означает насытиться или пресытиться; в контексте чрезмерного употребления «пресытишься» ясно выражает избыток, а местоимение сохраняет отсылку к мёду.
- source_word: וַהֲקֵאתוֹ
  choice: и тебя вырвет
  rationale: Исходный глагол означает извергнуть съеденное, вырвать. Русская безличная конструкция передаёт это прямо и естественно, без смягчения резкого телесного образа.
