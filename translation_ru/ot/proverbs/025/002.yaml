  text: כְּבֹ֣ד אֱ֭לֹהִים הַסְתֵּ֣ר דָּבָ֑ר וּ/כְבֹ֥ד מְ֝לָכִ֗ים חֲקֹ֣ר דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/002.yaml
  text: It is the glory of God to conceal a matter[b][a], and the glory of kings to search out a matter.
translation:
  language: ru
  text: 'Слава Бога — скрывать дело,

    и слава царей — исследовать дело.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрывать вопрос» и «исследовать вопрос». Слово «слава» в обеих строках можно также передать как «честь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹד
  choice: слава
  rationale: Слово обозначает весомое достоинство, честь или величие; «слава» сохраняет возвышенность и точный параллелизм обеих строк.
- source_word: אֱלֹהִים
  choice: Божья
  rationale: В контексте израильской литературы мудрости речь идёт о едином Боге; притяжательная форма естественно передаёт еврейскую конструкцию.
- source_word: הַסְתֵּר
  choice: скрывать
  rationale: Инфинитив называет действие, в котором проявляется Божья слава; «скрывать» передаёт намеренное сокрытие, не добавляя объяснения его цели.
- source_word: דָּבָר
  choice: дело
  rationale: Здесь слово может означать дело, вопрос или предмет рассмотрения. «Дело» подходит обеим строкам и сохраняет их словесный повтор.
- source_word: וּ/כְבֹד
  choice: и слава
  rationale: Союз передан нейтральным «и», чтобы не навязывать противопоставление там, где еврейский текст допускает простое сопоставление.
- source_word: מְלָכִים
  choice: царей
  rationale: Еврейский текст прямо называет царей, поэтому более широкое «правителей» не требуется.
- source_word: חֲקֹר
  choice: исследовать
  rationale: Глагол означает тщательно разыскивать, выяснять или исследовать; выбранный вариант естественен по-русски и передаёт вдумчивое разбирательство.
theological_decisions:
- issue: Соотношение Божьего сокрытия и царского исследования
  choice: Обе строки переданы как параллельные утверждения о славе Бога и царей без дополнительного богословского объяснения.
  alternative: Истолковать их как нравственное противопоставление божественной тайны человеческому управлению либо как указание, что цари раскрывают именно то, что скрыл Бог.
  rationale: Еврейская пословица сохраняет напряжение между сокрытием и исследованием, но прямо не определяет их взаимоотношение; перевод не должен разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным строем пословицы. Повтор «слава» и «дело» сохраняет формальный параллелизм оригинала; тире делает именную конструкцию ясной и естественной.
