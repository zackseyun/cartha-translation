  text: אַל תֵּצֵ֥א לָ/רִ֗ב מַ֫הֵ֥ר פֶּ֣ן מַה תַּ֭עֲשֶׂה בְּ/אַחֲרִיתָ֑/הּ בְּ/הַכְלִ֖ים אֹתְ/ךָ֣ רֵעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/008.yaml
  text: Do not go out hastily to a dispute[a], lest in the end, when your neighbor puts you to shame[b], you not know what to do.
translation:
  language: ru
  text: Не спеши вступать в спор[a], иначе что ты будешь делать в конце спора, когда твой ближний посрамит тебя?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в тяжбу». Еврейское слово может обозначать как спор или ссору, так и судебную тяжбу.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза имеет форму риторического вопроса. Возможный смысл: «иначе в конце спора, когда твой ближний посрамит тебя, ты не будешь знать, что делать».'
    reason: ambiguity
lexical_decisions:
- source_word: תֵּצֵא לָרִיב
  choice: вступай … в тяжбу
  rationale: Сочетание буквально описывает выход для ведения спора; по-русски «вступать в тяжбу» естественно передаёт начало как личного спора, так и разбирательства с возможным судебным оттенком.
- source_word: מַהֵר
  choice: поспешно
  rationale: Наречие выражает не только быстроту, но и необдуманность поступка, что соответствует предостерегающему тону изречения.
- source_word: בְּאַחֲרִיתָהּ
  choice: в конце её
  rationale: Форма с суффиксом женского рода, вероятнее всего, указывает на тяжбу и означает её исход или заключительную стадию.
- source_word: בְּהַכְלִים אֹתְךָ
  choice: когда … посрамит тебя
  rationale: Инфинитив с предлогом ב передаёт временное обстоятельство, а כלם означает причинить стыд или унижение; «посрамит» сохраняет тему чести и стыда и соответствует достоинству поэтической речи.
- source_word: רֵעֶךָ
  choice: ближний твой
  rationale: רֵעַ обозначает человека из ближайшего социального круга, не обязательно близкого друга; «ближний» сохраняет эту широту.
- source_word: מַה תַּעֲשֶׂה
  choice: что будешь делать
  rationale: Сохранён прямой риторический вопрос древнееврейского текста, без внесения подразумеваемого пояснения «не будешь знать».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным, наставительным ритмом притчи. Слово «тяжба» сохраняет возможный юридический оттенок, а сноска указывает на более широкое значение. Инверсия «ближний твой» придаёт строке достоинство, не делая её архаичной.
