  yaml_path: translation/ot/proverbs/025/017.yaml
  text: Let your foot be seldom in your neighbor’s house[b][a], lest he have his fill of you and hate you.
translation:
  language: ru
  text: Не ходи слишком часто в дом ближнего своего[a][b], чтобы он не пресытился тобой и не возненавидел тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. буквально: «Сделай редкой свою ногу у дома ближнего своего»; то есть не приходи туда слишком часто.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «друга твоего»; еврейское слово может означать «ближний», «друг» или «товарищ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֹקַר
  choice: пусть ... нечасто ступает
  rationale: Побудительная форма буквально требует «сделать редкой» ногу; по смыслу это призыв приходить не слишком часто. Формулировка сохраняет повелительную силу и образ ноги.
- source_word: רַגְלְךָ
  choice: нога твоя
  rationale: Сохранены единственное число и конкретный образ еврейского текста, где нога обозначает посещения человека.
- source_word: מִבֵּית
  choice: в дом
  rationale: Хотя предлог буквально имеет значение «из/от», в сочетании «сделать ногу редкой от дома» речь идёт о редком появлении в доме; по-русски это естественно выражается направлением «в дом».
- source_word: רֵעֶךָ
  choice: ближнего твоего
  rationale: Слово может обозначать ближнего, друга или товарища. «Ближний» сохраняет широкий социальный смысл, не предполагая непременно тесной дружбы.
- source_word: פֶּן
  choice: чтобы ... не
  rationale: Естественная русская конструкция предупреждения о нежелательном последствии, соответствующая значению «как бы не, чтобы не».
- source_word: יִשְׂבָּעֲךָ
  choice: пресытился тобой
  rationale: Глагол буквально связан с насыщением и сытостью. «Пресытился тобой» сохраняет метафору чрезмерного насыщения присутствием человека.
- source_word: וּשְׂנֵאֶךָ
  choice: и не возненавидел тебя
  rationale: Передан прямой смысл глагола «ненавидеть» без смягчения; совершенный вид естественно выражает возможный итог.
