  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י ט֥וֹב אֲמָר לְ/ךָ֗ עֲֽלֵ֫ה הֵ֥נָּה מֵֽ֭/הַשְׁפִּ֣ילְ/ךָ לִ/פְנֵ֣י נָדִ֑יב אֲשֶׁ֖ר רָא֣וּ עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/007.yaml
  text: For it is better that it be said to you[b][a], “Come up here,” than that you be humbled before a nobleman whom your eyes have seen.
translation:
  language: ru
  text: 'Ведь лучше, если тебе скажут: «Поднимись сюда», чем если тебя унизят[a] перед знатным человеком, которого ты видел своими глазами[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чем быть поставленным ниже». Еврейский глагол может указывать на понижение места или положения; в данной обстановке оно также означает публичное унижение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которого видели твои глаза». Это выразительный еврейский оборот со значением «которого ты видел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего наставления; «ведь» естественно передаёт пояснительную связь.
- source_word: טוֹב ... מִן
  choice: лучше ... чем
  rationale: Конструкция имеет сравнительное значение.
- source_word: אֲמָר לְךָ
  choice: если тебе скажут
  rationale: Неопределённый говорящий в еврейском тексте естественно передаётся русской неопределённо-личной конструкцией.
- source_word: עֲלֵה הֵנָּה
  choice: Поднимись сюда
  rationale: Сохраняется как пространственное движение вверх, так и подразумеваемое повышение места или положения.
- source_word: מֵהַשְׁפִּילְךָ
  choice: чем если тебя унизят
  rationale: Каузативная форма глагола שׁפל означает, что человека ставят ниже; в данном общественном контексте это влечёт публичное унижение.
- source_word: לִפְנֵי נָדִיב
  choice: перед знатным человеком
  rationale: נָדִיב здесь обозначает высокопоставленного или знатного человека, не обязательно правителя либо князя.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: которого ты видел своими глазами
  rationale: Русское выражение сохраняет наглядность еврейского оборота и звучит естественно.
