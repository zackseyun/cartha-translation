id: PRO.25.21
reference: Proverbs 25:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם רָעֵ֣ב שֹׂ֭נַאֲ/ךָ הַאֲכִלֵ֣/הוּ לָ֑חֶם וְ/אִם צָ֝מֵ֗א הַשְׁקֵ֥/הוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/021.yaml
  text: If your enemy is hungry[a], feed him bread, and if he is thirsty, give him water to drink.
translation:
  language: ru
  text: Если твой враг[a] голоден, накорми его хлебом; и если он жаждет, напои его водой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тот, кто ненавидит тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Еврейская условная частица прямо вводит условие; «если» сохраняет его, не превращая в ожидаемое событие посредством «когда».
- source_word: רָעֵב
  choice: голоден
  rationale: Предикативное прилагательное передаёт обычное состояние голода без неоправданного усиления вроде «изголодался».
- source_word: שֹׂנַאֲךָ
  choice: твой враг
  rationale: Причастная форма буквально означает «тот, кто ненавидит тебя». В русском «твой враг» естественно передаёт враждебное отношение, а буквальный вариант сохранён в сноске.
- source_word: הַאֲכִלֵהוּ
  choice: накорми его
  rationale: Каузативный императив означает «дай ему есть, накорми его»; выбран естественный и точный русский эквивалент.
- source_word: לָחֶם
  choice: хлебом
  rationale: Сохранён конкретный образ хлеба, хотя слово в некоторых контекстах может обозначать пищу вообще.
- source_word: וְאִם
  choice: и если
  rationale: Сохраняет сочинительную связь и параллельное построение второй условной части.
- source_word: צָמֵא
  choice: он жаждет
  rationale: Передаёт состояние жажды и естественно звучит в современном литературном русском; местоимение восполняется по нормам русского синтаксиса.
- source_word: הַשְׁקֵהוּ
  choice: напои его
  rationale: Каузативный императив от глагола «пить» естественно передаётся русским «напои».
- source_word: מָיִם
  choice: водой
  rationale: Сохранено прямое и конкретное значение «вода»; творительный падеж обусловлен управлением русского глагола «напоить».
theological_decisions:
- issue: Мужской род единственного числа в изречении с обобщающим смыслом
  choice: 'Сохранены формы единственного числа мужского рода: «враг… его… он… его».'
  alternative: Использовать множественное число или гендерно-нейтральную перестройку.
  rationale: В еврейском тексте стоят формы мужского рода единственного числа, имеющие представительный, обобщающий смысл. Русские формы сохраняют грамматику источника и личную направленность наставления, не ограничивая применимость изречения только мужчинами.
translation_notes:
  register: Современный литературный русский с краткой, афористичной структурой. Конкретные образы «хлеб» и «вода» сохранены; точка с запятой подчёркивает параллелизм двух условных частей.
