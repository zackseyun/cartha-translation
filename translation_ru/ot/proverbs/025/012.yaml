  text: Like a gold ring and an ornament of fine gold is a wise reprover to a listening ear[a].
translation:
  language: ru
  text: Что золотое кольцо и украшение из чистого золота, то мудрый обличитель для внимательного уха[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что золотое кольцо и украшение из чистого золота, то мудрый обличитель для слушающего уха». Еврейские названия украшений имеют довольно общее значение, а заключительные слова подчёркивают готовность воспринять услышанное. «Обличитель» здесь — тот, кто мудро исправляет наставлением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶזֶם
  choice: кольцо
  rationale: Еврейское слово обозначает кольцевидное украшение, которое могли носить в носу или в ухе; общее «кольцо» не уточняет того, чего не уточняет контекст.
- source_word: זָהָב
  choice: золотое
  rationale: Прямо передаёт материал украшения и естественно согласуется со словом «кольцо».
- source_word: וַחֲלִי
  choice: и украшение
  rationale: Слово имеет общее значение драгоценного украшения; такой перевод сохраняет параллелизм, не сводя образ к конкретному виду изделия.
- source_word: כָתֶם
  choice: из чистого золота
  rationale: Обозначает высококачественное, очищенное золото; «чистое золото» естественно передаёт ценность второго украшения.
- source_word: מוֹכִיחַ
  choice: обличитель
  rationale: Причастие обозначает человека, который указывает на проступок и исправляет; существительное сохраняет сжатую форму притчи и конструктивный смысл обличения.
- source_word: חָכָם
  choice: мудрый
  rationale: Стандартное для Притчей обозначение нравственной и практической мудрости; определяет обличителя.
- source_word: עַל
  choice: для
  rationale: В данном сравнении предлог выражает отношение обличителя к воспринимающему наставление человеку; «для внимательного уха» естественно по-русски.
- source_word: אֹזֶן שֹׁמָעַת
  choice: внимательное ухо
  rationale: Буквально «ухо, которое слышит»; образ подразумевает не физический слух, а готовность внимательно и восприимчиво принять исправление.
