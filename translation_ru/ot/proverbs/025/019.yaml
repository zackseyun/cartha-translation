  yaml_path: translation/ot/proverbs/025/019.yaml
  text: Confidence in a treacherous man in a day of trouble is like a bad tooth and a slipping foot[a][b].
translation:
  language: ru
  text: Доверие к вероломному человеку в день беды — как больной зуб и нога, теряющая опору.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверие к неверному человеку». Выражение «нога, теряющая опору» может также обозначать неустойчивую, шатающуюся или скользящую ногу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁן רֹעָה
  choice: больной зуб
  rationale: Сочетание буквально обозначает «плохой, негодный зуб». В современном русском «больной зуб» естественно передаёт конкретный образ ненадёжного и причиняющего боль зуба, не сводя его к абстрактной зубной боли.
- source_word: רֶגֶל מוּעָדֶת
  choice: подкашивающаяся нога
  rationale: Причастие указывает на ногу, которая подводит, слабеет или теряет устойчивость. «Подкашивающаяся» сохраняет телесный образ и естественно звучит по-русски; возможный оттенок скольжения отмечен в сноске.
- source_word: מִבְטָח
  choice: надежда
  rationale: Существительное означает доверие, упование или то, на что полагаются. «Надежда на» образует естественную русскую конструкцию и передаёт практическую опору на человека.
- source_word: בּוֹגֵד
  choice: вероломного человека
  rationale: Причастие мужского рода обозначает того, кто поступает предательски или нарушает верность. «Вероломный человек» сохраняет представительный мужской единственный род и выражает устойчивое качество без чрезмерно узкого значения слова «предатель».
- source_word: בְּיוֹם צָרָה
  choice: в день беды
  rationale: Прямой и естественный русский эквивалент временного выражения; сохраняет краткость и возвышенно-пословичный строй оригинала.
theological_decisions:
- issue: Представительный мужской род в בּוֹגֵד
  choice: «вероломного человека»
  alternative: «ненадёжного человека» или «того, кто неверен»
  rationale: Форма оригинала — причастие мужского рода единственного числа с обобщающим значением. Перевод сохраняет эту форму, не ограничивая смысл конкретным историческим лицом и не придавая тексту конфессионального толкования.
translation_notes:
  register: Современный литературный русский с кратким пословичным параллелизмом. Конструкция «Что..., то...» делает подразумеваемое в еврейском сопоставление ясным, сохраняя оба конкретных образа и не устраняя диапазон значения מוּעָדֶת.
