base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/026.yaml
  text: Like a muddied spring and a polluted fountain is a righteous man who gives way before the wicked[a].
translation:
  language: ru
  text: Праведник, уступающий нечестивому[a], подобен замутнённому роднику и испорченному источнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Праведник, колеблющийся перед нечестивым, подобен замутнённому роднику и испорченному источнику».'
    reason: 'Лексическая неоднозначность глагола מָט: он может передавать как уступку или отступление, так и шатание, колебание.'
lexical_decisions:
- source_word: מַעְיָן
  choice: родник
  rationale: Обозначает естественный выход воды; «родник» ясно и естественно передаёт образ и позволяет отличить его от параллельного מָקוֹר.
- source_word: נִרְפָּשׂ
  choice: замутнённый
  rationale: Страдательное причастие описывает воду, ставшую мутной, вероятно, от взбалтывания или вытаптывания; «замутнённый» сохраняет видимый образ без излишнего уточнения причины.
- source_word: מָקוֹר
  choice: источник
  rationale: Водный источник, стоящий в поэтическом параллелизме с מַעְיָן; русское «источник» естественно и не создаёт образ искусственного фонтана.
- source_word: מָשְׁחָת
  choice: испорченный
  rationale: Слово выражает порчу или повреждение. В сочетании с источником «испорченный» передаёт непригодность воды, не конкретизируя вид загрязнения сверх еврейского текста.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированная форма мужского рода, употреблённая в единственном числе; «праведник» точно и привычно передаёт её в русском библейском регистре.
- source_word: מָט
  choice: уступающий
  rationale: Глагол может обозначать шатание, уклонение или податливость. В данном контексте «уступающий» естественно выражает капитуляцию праведника перед нечестивым, а буквальный образ пошатывания сохранён в сноске.
- source_word: לִפְנֵי
  choice: перед
  rationale: Обычное значение предлога — «перед», «в присутствии»; здесь он указывает, перед кем праведник отступает или колеблется.
- source_word: רָשָׁע
  choice: нечестивому
  rationale: Субстантивированное прилагательное мужского рода в единственном числе; дательный падеж обусловлен русским управлением глагола «уступать».
theological_decisions:
- issue: Передача грамматического рода צַדִּיק
  choice: праведник
  alternative: праведный человек
  rationale: Еврейская форма имеет мужской род и единственное число, а русское «праведник» сохраняет это и при этом естественно выполняет обобщающую функцию пословицы.
- issue: Смысл מָט в отношении праведника и нечестивого
  choice: уступающий нечестивому
  alternative: пошатнувшийся перед нечестивым
  rationale: Контекст допускает как образ шатания, так и смысл уступки. Основной текст передаёт вероятный нравственно-социальный смысл, а сноска сохраняет более буквальное и неоднозначное прочтение.
translation_notes:
  register: Современный литературный русский с краткой пословичной конструкцией и достоинством библейской поэзии. Параллельные образы переданы словами «родник» и «источник»; тире сохраняет сжатое именное сопоставление оригинала.
