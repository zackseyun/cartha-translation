lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание наставления предыдущего стиха и естественно передаёт причинную связь.
- source_word: גֶחָלִים
  choice: горящие угли
  rationale: Речь идёт о раскалённых, живых углях; определение сохраняет действенность образа.
- source_word: חֹתֶה
  choice: соберёшь
  rationale: Глагол означает сгребать или собирать угли. Выбор сохраняет конкретное действие и не истолковывает метафору вместо читателя.
- source_word: עַל רֹאשׁוֹ
  choice: ему на голову
  rationale: Прямо и естественно по-русски передаёт еврейский образ, не снимая его неоднозначности.
- source_word: וַיהוָה
  choice: и Яхве
  rationale: Передаёт личное имя Бога, представленное в еврейском тексте тетраграмматоном יהוה.
- source_word: יְשַׁלֶּם לָךְ
  choice: воздаст тебе
  rationale: Глагол обозначает отплату или возмещение; в данном контексте подразумевается благоприятное воздаяние, но широкое слово «воздаст» не делает это истолкование излишне явным.
theological_decisions:
- issue: Смысл образа горящих углей на голове
  choice: Сохранить метафору в основном тексте, не определяя однозначно её смысл.
  alternative: Истолковать её как стыд, ведущий врага к раскаянию, либо как усиление его суда.
  rationale: Еврейский текст не объясняет действие образа, поэтому перевод сохраняет присущую ему богословскую и смысловую напряжённость.
