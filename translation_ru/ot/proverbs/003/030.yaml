  text: אַל תרוב עִם אָדָ֣ם חִנָּ֑ם אִם לֹ֖א גְמָלְ/ךָ֣ רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/030.yaml
  text: Do not contend with a man without cause[b][a], if he has done you no harm.
translation:
  language: ru
  text: Не вступай в спор с человеком без причины[a], если он не причинил тебе зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не ссорься с человеком без причины, если он не причинил тебе зла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Не
  rationale: Частица אַל с данной глагольной формой выражает запрет; простой русский императив не добавляет отсутствующего в тексте усиления.
- source_word: תרוב
  choice: затевай ссоры
  rationale: ריב охватывает спор, ссору и тяжбу. В этом наставлении выражение «затевай ссоры» естественно по-русски и не сужает смысл исключительно до судебного разбирательства.
- source_word: עִם
  choice: с
  rationale: Предлог עִם обычно означает «с» и естественно сочетается с выбранным выражением.
- source_word: אָדָם
  choice: человеком
  rationale: אָדָם здесь обозначает отдельного человека в обобщённом наставлении; русское «человеком» точно передаёт родовое значение без ненужного указания на пол.
- source_word: חִנָּם
  choice: без причины
  rationale: חִנָּם означает «без причины, незаслуженно, напрасно»; «без причины» ясно передаёт необоснованность конфликта.
- source_word: אִם לֹא
  choice: если ... не
  rationale: Сохранена явная условно-отрицательная конструкция оригинала, не превращённая в более истолковывающее «если только».
- source_word: גְמָלְךָ
  choice: причинил тебе
  rationale: В сочетании с רָעָה глагол גמל обозначает действие или воздаяние по отношению к адресату; по-русски естественно «причинил тебе зло».
- source_word: רָעָה
  choice: зла
  rationale: רָעָה может означать зло, вред или обиду. «Зло» сохраняет более широкий нравственный и практический диапазон еврейского слова.
theological_decisions:
- issue: Условие допустимости спора
  choice: Сохранено буквальное «если он не причинил тебе зла» без вывода, будто причинённое зло автоматически предписывает или оправдывает ссору.
  alternative: «Когда он не сделал тебе ничего плохого» либо формулировка, явно разрешающая спор при причинённом вреде.
  rationale: Еврейский текст формулирует запрет при отсутствии причинённого зла, но не раскрывает, как следует поступать при его наличии; эту напряжённость не следует разрешать добавлением.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Затевай ссоры» передаёт наставительный характер изречения и широкий смысл ריב; альтернативный оттенок «вступать в спор» отмечен в сноске.
