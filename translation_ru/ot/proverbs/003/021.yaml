  text: בְּ֭נִ/י אַל יָלֻ֣זוּ מֵ/עֵינֶ֑י/ךָ נְצֹ֥ר תֻּ֝שִׁיָּ֗ה וּ/מְזִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/021.yaml
  text: My son[a], do not let them depart from your eyes[b]; guard sound wisdom and discretion.
translation:
  language: ru
  text: Сын мой, не упускай их из виду[a]; храни здравомыслие[b] и рассудительность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть они не удалятся от твоих глаз». Множественное «их» отсылает к наставлениям или качествам, названным в окружающем контексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «здравое суждение», «находчивость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Еврейское обращение стоит в мужском роде и единственном числе; формулировка сохраняет образ наставления отца или учителя сыну.
- source_word: אַל יָלֻזוּ מֵעֵינֶיךָ
  choice: не упускай их из виду
  rationale: Естественная русская передача запрета и образного выражения «пусть они не удалятся от твоих глаз». Местоимение «их» сохраняет множественное число и отсылает к наставлениям или качествам из ближайшего контекста.
- source_word: נְצֹר
  choice: храни
  rationale: Повелительная форма призывает бережно и бдительно сохранять названные качества.
- source_word: תֻּשִׁיָּה
  choice: здравую мудрость
  rationale: В литературе мудрости слово обозначает основательную, действенную мудрость или здравое суждение; перевод сохраняет как интеллектуальный, так и практический оттенок.
- source_word: וּמְזִמָּה
  choice: и рассудительность
  rationale: В данном положительном контексте слово означает обдуманность, благоразумие и способность рассуждать, а не злой умысел.
theological_decisions:
- issue: Род обращения к наставляемому
  choice: Сын мой
  alternative: Дитя моё
  rationale: В еврейском тексте употреблена явно мужская форма единственного числа, соответствующая рамке отцовского наставления в книге Притч; обобщение по роду не требуется.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной речи. Идиома «не упускай из виду» звучит естественно, а ключевые понятия мудрости переданы без конфессионально обусловленной терминологии.
