    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: и они будут
  rationale: Форма Qal imperfect 3-го лица множественного числа с союзом указывает на результат сказанного в предыдущем стихе и соотносится с упомянутыми там здравомыслием и рассудительностью.
- source_word: חַיִּים
  choice: жизнью
  rationale: Хотя в еврейском это слово имеет форму множественного числа, оно обычно употребляется как отвлечённое существительное со значением «жизнь».
- source_word: לְנַפְשֶׁךָ
  choice: для твоей души
  rationale: נֶפֶשׁ может означать душу, жизнь, самого человека или его внутреннее существо; «душа» сохраняет широту и образность исходного выражения.
- source_word: וְחֵן
  choice: и украшением
  rationale: חֵן означает благосклонность, привлекательность, прелесть или изящество. В сочетании с шеей слово обозначает то, что придаёт человеку привлекательность, поэтому «украшение» естественно передаёт образ в русском языке, не сводя его к физическому предмету.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: для твоей шеи
  rationale: Слово обозначает горло или шею; здесь, как и в других местах Притч, эта область тела связана с образом носимого украшения.
theological_decisions:
- issue: Смысл נֶפֶשׁ
  choice: душа
  alternative: жизнь; ты сам; внутреннее существо
  rationale: Выбор сохраняет антропологическую широту и традиционную образность слова, а сноска не позволяет понимать его исключительно как нематериальную часть человека.
- issue: Смысл חֵן в образе шеи
  choice: украшение
  alternative: благоволение; привлекательность; прелесть
  rationale: Контекст шеи вызывает образ украшения, однако исходное слово также выражает привлекательность и благоволение; эта смысловая напряжённость сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого поэтического параллелизма. «Украшение» делает метафору естественной для русского читателя, а сноска сохраняет лексическую многозначность חֵן. Все сносочные маркеры помещены непосредственно после соответствующих выражений.
