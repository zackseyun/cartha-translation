source:
  edition: WLC
  text: מוּסַ֣ר יְ֭הוָה בְּנִ֣/י אַל תִּמְאָ֑ס וְ/אַל תָּ֝קֹ֗ץ בְּ/תוֹכַחְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/011.yaml
  text: My son[a], do not despise Yahweh’s discipline, and do not loathe his reproof.
translation:
  language: ru
  text: Сын мой, не пренебрегай наставлением Яхве и не тяготись Его обличением.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не испытывай отвращения к Его обличению». Еврейский глагол может выражать отвращение, досаду, нетерпение или усталость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: наставление
  rationale: В литературе мудрости слово обозначает формирующее и исправляющее наставление. Русское «наставление» естественно передаёт воспитательный смысл; контекст обличения сохраняет его корректирующий оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: בְּנִי
  choice: Сын мой
  rationale: Сохраняет обращение в единственном числе мужского рода и отцовский тон наставления мудреца.
- source_word: אַל תִּמְאָס
  choice: не пренебрегай
  rationale: מָאַס выражает презрительное неприятие или отвержение. «Не пренебрегай» звучит естественно по-русски и сохраняет как отношение, так и практическое отвержение.
- source_word: תָּקֹץ
  choice: не тяготись
  rationale: קוּץ допускает значения отвращения, досады, нетерпения и усталости. «Не тяготись» передаёт внутреннее неприятие и сохраняет существенную многозначность без чрезмерного усиления.
- source_word: בְּתוֹכַחְתּוֹ
  choice: Его обличением
  rationale: תּוֹכַחַת обозначает словесное исправление, укор или обличение. «Обличение» отличает его от более широкого מוּסַר и соответствует возвышенному, но понятному регистру.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В стихе употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер действия מוּסַר
  choice: наставление
  alternative: наказание; взыскание
  rationale: Слово включает исправляющее воспитание, но стих не требует сводить его к карательному действию. «Наставление» сохраняет формирующий смысл и не устраняет корректирующего оттенка.
translation_notes:
  register: Современный литературный русский язык с лаконичным наставительным ритмом. Сохранены прямое обращение «Сын мой», личное имя Яхве и параллелизм двух запретов.
