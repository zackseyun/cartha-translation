  yaml_path: translation/ot/proverbs/003/027.yaml
  text: Do not withhold good from those to whom it is due when it is in your power to do it[a][b].
translation:
  language: ru
  text: Не удерживай добра от тех, кому оно причитается, если это в твоих силах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «когда в силе твоей руки сделать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Не отказывай
  rationale: Естественная русская форма запрета, передающая значение «не удерживай, не лишай» без излишней буквальности.
- source_word: טוֹב
  choice: в добре
  rationale: 'Сохраняет широкий смысл еврейского слова: благо, помощь или доброе дело; не сужает его до милостыни либо доброты.'
- source_word: מִבְּעָלָיו
  choice: тем, кому оно причитается
  rationale: בעליו буквально указывает на «его владельцев/обладателей», но в данном сочетании обозначает тех, кто имеет законное или нравственное право на это добро.
- source_word: בִּהְיוֹת
  choice: если
  rationale: В контексте обстоятельственный оборот выражает условие наличия возможности; русское «если» естественно передаёт эту связь.
- source_word: לְאֵל יָדֶךָ
  choice: в твоих силах
  rationale: Передаёт смысл еврейской идиомы о власти или способности руки, сохраняя современное и ясное звучание.
- source_word: לַעֲשׂוֹת
  choice: его сделать
  rationale: Обычное значение עשה — «делать»; местоимение соотносится с упомянутым добром.
theological_decisions:
- issue: Круг тех, кому нельзя отказывать в добре
  choice: тем, кому оно причитается
  alternative: у его владельцев
  rationale: Формулировка сохраняет идею обоснованного притязания, не ограничивая стих конкретной богословской категорией и не вводя частного учения.
translation_notes:
  register: Современный литературный русский язык; краткая наставительная форма книги Притч. Широкое значение слова «добро» и образ способности действовать переданы без конфессионального уточнения.
