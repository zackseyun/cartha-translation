review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: запрет удерживать благо от тех, кто имеет на него право, при наличии возможности действовать. Однако «его сделать» неудачно соотносит «его» с отвлечённым словом «добро» и создаёт смысловую шероховатость; לַעֲשׂוֹת естественнее передать как «поступить так» или «сделать это».'
  naturalness: «Не отказывай в добре» возможно, но менее естественно и несколько меняет образ «удерживать благо». «Не удерживай добра от тех...» сохраняет широту טוֹב и звучит литературно. Условная конструкция «если это в твоих силах» ясна и современна.
  terminology: «Тем, кому оно причитается» удачно передаёт идиоматический смысл מִבְּעָלָיו, не навязывая узкого юридического или конфессионального толкования. «Добро» сохраняет широкий этический смысл исходного слова.
  issues:
  - severity: medium
    issue: Неестественное «его сделать»
    rationale: Русское «сделать добро» возможно лишь в значении совершить доброе дело, тогда как «добро» здесь имеет более широкий смысл блага/пользы. Местоимение «его» также двусмысленно и стилистически тяжеловесно.
  - severity: low
    issue: Смысловой оттенок «отказывать в добре»
    rationale: Фраза понятна, но «отказывать» может предполагать запрос или просьбу, отсутствующие в еврейском тексте. «Не удерживай добра» ближе к מנע и сохраняет исходную широту.
  - severity: low
    issue: Неточное буквальное примечание
    rationale: В еврейском обороте сказано «когда в силе твоей руки сделать», а не «когда рука твоя в силах сделать»; кроме того, примечание лучше пояснить как буквальный вариант, не выдавая негладкую русскую кальку за нормальную фразу.
  revised_text: Не удерживай добра от тех, кому оно причитается, если это в твоих силах.[a]
