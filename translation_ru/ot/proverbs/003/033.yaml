  text: מְאֵרַ֣ת יְ֭הוָה בְּ/בֵ֣ית רָשָׁ֑ע וּ/נְוֵ֖ה צַדִּיקִ֣ים יְבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
translation:
  language: ru
  text: На доме[a] нечестивого — проклятие Яхве, а жилище[b] праведных Он благословляет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в доме нечестивого»; еврейский предлог допускает более буквальную пространственную передачу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обитель» или «дом» праведных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  choice: проклятие
  rationale: Существительное обозначает проклятие или состояние под проклятием; прямой русский эквивалент сохраняет силу образа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּבֵית
  choice: на доме
  rationale: В сочетании с «проклятием» естественно передаёт мысль о проклятии, лежащем на доме; более буквальное пространственное значение отмечено в сноске.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Единственное число имеет обобщающий характер и обозначает типичного нечестивого человека без добавления отсутствующего в тексте существительного.
- source_word: וּנְוֵה
  choice: а жилище
  rationale: נָוֶה означает жилище, обитель или место проживания; союз в параллелизме выражает противопоставление.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное множественное число обозначает праведных людей как нравственную категорию.
- source_word: יְבָרֵךְ
  choice: Он благословляет
  rationale: Имперфект выражает постоянную, общеобязательную истину, поэтому передан настоящим временем; местоимение ясно возвращает к Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация сохраняет личное Божье имя и не подменяет его титулом.
- issue: Обобщающее единственное число רָשָׁע
  choice: нечестивого
  alternative: нечестивых; нечестивого человека
  rationale: Единственное число сохранено как типичное для изречения обобщение, без ненужного уточнения пола и без перехода к множественному числу.
- issue: Видо-временное значение יְבָרֵךְ
  choice: благословляет
  alternative: благословит
  rationale: В контексте пословицы форма выражает общую закономерность, а не обязательно отдельное будущее действие.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем пословицы. Синтаксический параллелизм и противопоставление двух домов сохранены; прописное «Он» помогает однозначно связать субъект второго полустишия с Яхве.
