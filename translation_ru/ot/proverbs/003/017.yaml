  text: דְּרָכֶ֥י/הָ דַרְכֵי נֹ֑עַם וְֽ/כָל נְתִ֖יבוֹתֶ֣י/הָ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/017.yaml
  text: Her ways are ways of pleasantness[a], and all her paths are peace.
translation:
  language: ru
  text: 'Её пути — пути приятные,

    и все её стези — мир[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благополучие», «целостность». Еврейское слово шалом имеет более широкий смысл, чем только отсутствие вражды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיהָ
  choice: её пути
  rationale: Сохраняет образ дороги и переносное значение образа жизни; женский суффикс отсылает к мудрости в ближайшем контексте.
- source_word: דַרְכֵי
  choice: пути
  rationale: 'Повтор существительного передаёт подчёркнутую еврейскую конструкцию: буквально «её пути — пути…».'
- source_word: נֹעַם
  choice: приятные
  rationale: Естественно передаёт идею приятности и благотворности; в русском именная конструкция «пути приятности» звучит неестественно, поэтому абстрактное существительное передано прилагательным.
- source_word: וְכָל
  choice: и все
  rationale: Передаёт соединение строк и полный, всеохватывающий смысл כָּל.
- source_word: נְתִיבוֹתֶיהָ
  choice: её стези
  rationale: Поэтическое «стези» сохраняет параллельный дорожный образ и позволяет отличить נְתִיבוֹת от דְּרָכִים.
- source_word: שָׁלוֹם
  choice: мир
  rationale: 'Традиционное и ёмкое соответствие, сохраняющее возможность широкого смысла: благополучие, целостность и покой.'
theological_decisions: []
