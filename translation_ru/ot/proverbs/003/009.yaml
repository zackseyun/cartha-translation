source:
  edition: WLC
  text: כַּבֵּ֣ד אֶת יְ֭הוָה מֵ/הוֹנֶ֑/ךָ וּ֝/מֵ/רֵאשִׁ֗ית כָּל תְּבוּאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/009.yaml
  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
translation:
  language: ru
  text: Чти Яхве своим достатком[a] и первыми плодами всего своего урожая[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из своего достатка»; еврейский предлог после слова «чти» допускает передачу как средства («своим достатком») или источника («из своего достатка»).'
    reason: lexical_alternative
  - marker: b
    text: «Первые плоды» — первая и лучшая часть урожая, которую отдавали в знак почитания Бога.
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: Чти
  rationale: Повелительная форма породы пиэль от כבד означает «почитать, оказывать честь». «Чти» кратко, естественно для нравственного наставления и сохраняет смысл признания высокого достоинства адресата.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: מֵהוֹנֶךָ
  choice: своим достатком
  rationale: הוֹן обозначает материальное достояние, богатство или имущество. «Достаток» звучит естественно и охватывает материальные средства в целом; творительный падеж передаёт инструментальное значение предлога מִן после глагола «чтить».
- source_word: וּמֵרֵאשִׁית
  choice: и первыми плодами
  rationale: רֵאשִׁית буквально означает начало или первую часть; в сочетании с урожаем речь идёт о первых плодах, посвящаемых Богу. Творительный падеж сохраняет связь с повелением «чти».
- source_word: כָּל
  choice: всего
  rationale: כָּל здесь относится к урожаю в целом и естественно передаётся родительным сочетанием «всего своего урожая».
- source_word: תְּבוּאָתֶךָ
  choice: своего урожая
  rationale: תְּבוּאָה означает урожай, произведение земли или полученный сбор. «Урожай» ясно сохраняет сельскохозяйственный смысл контекста.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Характер почитания Бога материальными благами
  choice: своим достатком и первыми плодами
  alternative: из своего достатка и из первых плодов
  rationale: Формулировка сохраняет практический, материальный характер наставления, но не уточняет сверх текста ни обрядовую процедуру, ни обязательный размер приношения.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и легко понятным наставительным звучанием. Сохранён параллелизм двух обстоятельств при повелении «чти»; культурно обусловленное выражение пояснено в сноске.
