  text: אַל תַּחֲרֹ֣שׁ עַל רֵעֲ/ךָ֣ רָעָ֑ה וְ/הֽוּא יוֹשֵׁ֖ב לָ/בֶ֣טַח אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/029.yaml
  text: Do not devise harm against your neighbor while he dwells securely with you[a].
translation:
  language: ru
  text: Не замышляй зла против ближнего, когда он без опаски живёт рядом с тобой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не замышляй вреда ближнему, пока он живёт с тобой в безопасности».'
    reason: Лексические варианты רָעָה («зло», «вред»), לָבֶטַח («без опаски», «в безопасности») и אִתָּךְ («рядом с тобой», «с тобой»).
lexical_decisions:
- source_word: תַּחֲרֹשׁ
  choice: замышляй
  rationale: В сочетании с רָעָה глагол означает намеренно обдумывать, замышлять зло, а не буквально «пахать».
- source_word: עַל
  choice: против
  rationale: Предлог обозначает направленность злого умысла против другого человека.
- source_word: רֵעֲךָ
  choice: ближнего
  rationale: רֵעַ может означать ближнего, товарища или соседа; «ближний» естественно передаёт широкий нравственный и общественный смысл наставления.
- source_word: רָעָה
  choice: зла
  rationale: Речь идёт как о причинении вреда, так и о злом умысле; «зло» сохраняет широту еврейского слова и устойчиво сочетается с «замышлять».
- source_word: יוֹשֵׁב
  choice: живёт
  rationale: Причастие от ישׁב здесь указывает на продолжающееся проживание или пребывание; «живёт» звучит естественно в современном русском языке.
- source_word: לָבֶטַח
  choice: без опаски
  rationale: Выражение передаёт состояние безопасности и спокойной уверенности, подчёркивая неостороживую доверчивость ближнего, не добавляя прямого утверждения, что он доверяет адресату.
- source_word: אִתָּךְ
  choice: рядом с тобой
  rationale: Предлог обозначает совместное пребывание или близость; «рядом с тобой» естественно передаёт пространственную и социальную близость.
