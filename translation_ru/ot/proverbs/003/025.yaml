  text: אַל תִּ֭ירָא מִ/פַּ֣חַד פִּתְאֹ֑ם וּ/מִ/שֹּׁאַ֥ת רְ֝שָׁעִ֗ים כִּ֣י תָבֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/025.yaml
  text: Do not fear sudden terror[a], or the ruin of the wicked when it comes[b],
translation:
  language: ru
  text: Не бойся внезапного ужаса и бедствия[a] нечестивых[b], когда оно придёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разорения», «опустошения» или «гибели» (евр. שֹׁאָה).'
    reason: lexical_alternative
  - marker: b
    text: Выражение «бедствие нечестивых» может означать как бедствие, постигающее нечестивых, так и бедствие, связанное с нечестивыми или исходящее от них; еврейский текст не уточняет эту связь.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Отрицательная частица אַל с формой глагола ירא выражает запрет; «не бойся» естественно и точно передаёт его в современном русском языке.
- source_word: מִפַּחַד פִּתְאֹם
  choice: внезапного ужаса
  rationale: Пְחד обозначает страх или ужас, а פִּתְאֹם указывает на внезапность. После русского «бояться» родительный падеж естественно передаёт объект страха.
- source_word: וּמִשֹּׁאַת
  choice: и бедствия
  rationale: שׁוֹאָה обозначает разрушительное бедствие, опустошение или гибель. «Бедствие» сохраняет широту значения и хорошо сочетается с последующим «когда оно придёт».
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное множественное число רָשָׁע означает нечестивых людей. Родительный падеж сохраняет краткую и неоднозначную связь с «бедствием».
- source_word: כִּי תָבֹא
  choice: когда оно придёт
  rationale: כִּי здесь естественно понимать темпорально. Форма женского рода תָבֹא согласуется в еврейском с שׁוֹאָה; русское местоимение «оно» согласовано с выбранным словом «бедствие».
theological_decisions:
- issue: Отношение между שֹׁאַת и רְשָׁעִים
  choice: Сохранена формулировка «бедствие нечестивых», не уточняющая, постигает ли бедствие нечестивых или связано с ними как с его источником.
  alternative: «бедствие, которое постигнет нечестивых» или «бедствие от нечестивых»
  rationale: Еврейская конструкция компактна и сама по себе не определяет это отношение; контекст стиха не требует устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткий, назидательный тон притчи сохранён. Синтаксис остаётся естественным, а неоднозначность еврейской именной конструкции поясняется в сноске.
