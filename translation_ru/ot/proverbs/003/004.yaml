  yaml_path: translation/ot/proverbs/003/004.yaml
  text: Then you will find favor and good sense in the eyes of God and man[a].
translation:
  language: ru
  text: Так обретёшь благоволение и здравый смысл[a] в глазах Бога и людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доброе разумение», «благоразумие». Еврейское выражение שֵׂכֶל טוֹב может также пониматься в оценочном смысле как доброе мнение или добрая репутация.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское אָדָם — «человек»; здесь оно обозначает людей вообще в противопоставлении Богу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְצָא
  choice: Так обретёшь
  rationale: Форма буквально допускает побудительное «и найди», однако в связи с наставлениями предыдущего стиха выражает ожидаемый результат их исполнения. «Так обретёшь» естественно передаёт эту связь, не превращая её в безусловное обещание.
- source_word: חֵן
  choice: благоволение
  rationale: חֵן обозначает благосклонность, расположение или принятие. «Благоволение» сохраняет достоинство стиля и естественно сочетается с оборотом «в глазах».
- source_word: וְשֵׂכֶל טוֹב
  choice: доброе признание
  rationale: 'Значение сочетания спорно: оно может указывать на здравое разумение, благоразумие, успех или добрую оценку. В конструкции «в глазах Бога и людей» наиболее естественно значение доброго признания, при этом альтернативы отмечены в сноске.'
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранён естественный и в русском языке образный оборот, обозначающий оценку или отношение.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном контексте существительное обозначает единого Бога.
- source_word: וְאָדָם
  choice: и людей
  rationale: אָדָם противопоставляет человеческую сторону Богу и здесь имеет собирательное, а не мужское значение. Русское «людей» точно и естественно передаёт этот общий смысл.
theological_decisions:
- issue: Собирательное значение אָדָם в противопоставлении Богу
  choice: людей
  alternative: человека / рода человеческого
  rationale: Речь идёт об оценке со стороны Бога и со стороны людей вообще, а не одного мужчины. Выбор сохраняет универсальный смысл еврейского אָדָם без конфессионального истолкования.
- issue: Характер утверждения во второй части наставления
  choice: Так обретёшь
  alternative: и найди
  rationale: Контекст допускает понимание как продолжения побуждения и как результата предыдущего наставления. Русская формулировка передаёт результирующий оттенок, но не усиливает его до механической гарантии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной мудростной интонацией. Сохранён еврейский образ «в глазах», а трудное сочетание שֵׂכֶל טוֹב передано контекстуально и снабжено сноской, чтобы не скрывать его многозначность.
