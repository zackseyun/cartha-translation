  text: then your barns will be filled with abundance[a], and your vats will burst with new wine.
translation:
  language: ru
  text: 'тогда твои житницы наполнятся изобилием,

    а винные чаны будут переливаться через край молодым вином[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол буквально означает «прорываться, вырываться наружу» и передаёт образ вина, переливающегося через край от изобилия.
    reason: Лексическая альтернатива и пояснение образа глагола פרץ.
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: наполнятся
  rationale: Нифаль имперфекта от מלא выражает наступивший результат наполнения; возвратная форма естественно передаёт это по-русски.
- source_word: אֲסָמֶיךָ
  choice: твои житницы
  rationale: Слово обозначает помещения для хранения урожая. «Житницы» точно сохраняет сельскохозяйственный образ и уместно в литературном русском языке.
- source_word: שָׂבָע
  choice: до избытка
  rationale: Существительное передаёт полноту, достаток и насыщение. Оборот «наполнятся до избытка» звучит естественно и выражает обильную наполненность без добавления в текст конкретного вида урожая.
- source_word: תִירוֹשׁ
  choice: молодым вином
  rationale: תירוש обычно обозначает новое, свежее вино; «молодое вино» сохраняет отличие от общего обозначения вина и сельскохозяйственный образ.
- source_word: יְקָבֶיךָ
  choice: винные чаны
  rationale: יקב может обозначать давильню или чан, связанный с выжиманием винограда и сбором сока. «Винные чаны» понятно современному читателю и соответствует образу ёмкостей, переполненных вином.
- source_word: יִפְרֹצוּ
  choice: будут переполняться
  rationale: פרץ буквально передаёт прорыв или вырывание наружу. В данном контексте речь идёт об изобилии содержимого; «будут переполняться» естественно выражает этот смысл, а более сильный буквальный образ отмечен в сноске.
theological_decisions:
- issue: Характер обещанного благополучия
  choice: 'Сохранить конкретный образ сельскохозяйственного изобилия: житницы и винные чаны.'
  alternative: Передать стих только как обобщённое или духовное благословение.
  rationale: Еврейский текст рисует материально осязаемую картину достатка. Перевод не должен заранее решать, является ли обещание универсальным, механическим или исключительно символическим.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Житницы» и «винные чаны» сохраняют конкретный земледельческий колорит, оставаясь понятными обычному читателю.
