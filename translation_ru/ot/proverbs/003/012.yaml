  yaml_path: translation/ot/proverbs/003/012.yaml
  text: For Yahweh reproves the one he loves[b][a], as a father the son in whom he delights.
translation:
  language: ru
  text: Ведь Яхве обличает[a] того, кого любит, и, как отец, — сына, которому благоволит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исправляет», «наставляет». Еврейский глагол прежде всего указывает на обличение, ведущее к исправлению; в контексте он входит в более широкую тему воспитания Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «и благоволит ему, как отец — сыну». Краткая еврейская конструкция допускает и такое синтаксическое понимание; в обоих случаях глагол означает благоволение, а не просто любовь.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего наставления; «ведь» естественно передаёт пояснительно-причинную связь в русском тексте.
- source_word: אֶת אֲשֶׁר יֶאֱהַב
  choice: того, кого любит
  rationale: Сохраняет личную относительную конструкцию в единственном числе и прямое значение глагола אהב.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: יוֹכִיחַ
  choice: обличает
  rationale: Глагол в породе хифиль обозначает обличение или исправляющее наставление; «обличает» сохраняет его непосредственное значение, тогда как более широкая тема наказания и воспитания задаётся контекстом.
- source_word: וּכְאָב
  choice: как отец
  rationale: Сравнительная конструкция естественно передаётся по-русски без отдельного выражения соединительного союза.
- source_word: בֵּן
  choice: сына
  rationale: Сохраняет явно мужской образ отца и сына; притяжательное местоимение в еврейском тексте отсутствует.
- source_word: יִרְצֶה
  choice: к которому благоволит
  rationale: Передаёт значение расположения, одобрения и благосклонности, не сводя его ни только к эмоциональному удовольствию, ни к формальному принятию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Мужской родительский образ
  choice: как отец — сына
  alternative: как родитель — ребёнка
  rationale: Еврейский текст прямо называет отца и сына; перевод сохраняет этот конкретный образ и не делает его гендерно нейтральным.
- issue: Характер Божьего воздействия
  choice: обличает
  alternative: исправляет; наказывает; воспитывает
  rationale: Непосредственное значение יוֹכִיחַ связано с обличением и исправлением. Более широкое понятие дисциплины присутствует в контексте, но не должно вытеснять лексическую точность данного глагола.
- issue: Синтаксическая неоднозначность второй строки
  choice: как отец — сына, к которому благоволит
  alternative: и, как отец, — сына, которого любит
  rationale: Краткая еврейская конструкция допускает несколько способов связать сравнение и глагол רצה. Основной вариант сохраняет параллель между любовью Яхве и благоволением отца, а сноска отмечает альтернативную формулировку.
translation_notes:
  register: Современный литературный русский язык с лаконичным строем изречения. Тире подчёркивает подразумеваемый глагол во второй части сравнения; лексика dignified, но понятна широкому читателю.
