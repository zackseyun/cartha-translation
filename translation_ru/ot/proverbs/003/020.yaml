  text: בְּ֭/דַעְתּ/וֹ תְּהוֹמ֣וֹת נִבְקָ֑עוּ וּ֝/שְׁחָקִ֗ים יִרְעֲפוּ טָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/020.yaml
  text: By his knowledge the depths were split open[b][a], and the clouds drip dew.
translation:
  language: ru
  text: Его знанием разверзлись бездны[a], и облака источают росу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глубины»; возможно также: «глубокие воды».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «небеса источают росу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַעְתּוֹ
  choice: Его знанием
  rationale: Предлог בְּ передаёт средство, а דַּעַת — знание. Творительный оборот сохраняет инструментальный смысл и связь с Божьим знанием в контексте.
- source_word: תְּהוֹמוֹת
  choice: бездны
  rationale: Слово обозначает глубины или глубокие воды и здесь участвует в космическом образе. «Бездны» естественно и ёмко передаёт этот образ; водный оттенок отмечен в сноске.
- source_word: נִבְקָעוּ
  choice: разверзлись
  rationale: Нифаль передаёт раскрытие или рассечение. «Разверзлись» сохраняет непереходную форму и яркость поэтического образа.
- source_word: וּשְׁחָקִים
  choice: и облака
  rationale: שְׁחָקִים может означать облака или небеса. Упоминание росы делает «облака» наиболее естественным выбором, а альтернатива сохранена в сноске.
- source_word: יִרְעֲפוּ
  choice: источают
  rationale: Глагол описывает падение или выделение влаги каплями. «Источают» звучит естественно в возвышенной поэзии и не придаёт образу силы ливня.
- source_word: טָל
  choice: росу
  rationale: Обычное и однозначное соответствие еврейскому טָל в данном контексте.
theological_decisions:
- issue: Образ творения и Божьего промысла
  choice: Сохранён поэтический образ Божьего знания как средства, посредством которого устроены бездны и облака дают росу.
  alternative: Понимать стих исключительно как описание продолжающегося Божьего управления погодой либо исключительно как рассказ о первоначальном творении.
  rationale: Контекст Притч 3:19–20 связывает Божью мудрость и знание с устройством мира, но формы стиха допускают также образ продолжающегося промысла. Перевод не ограничивает смысл одной из этих сторон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. «Разверзлись» и «источают» сохраняют образность параллельных строк, оставаясь понятными современному читателю.
