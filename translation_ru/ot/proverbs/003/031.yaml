  text: Не завидуй человеку, склонному к насилию[a], и не выбирай ни одного из его путей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не испытывай ревности к человеку, склонному к насилию». Еврейский глагол в данном контексте может выражать зависть или ревность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Не завидуй
  rationale: Сочетание אַל с формой префиксального спряжения выражает запрет, а קנא здесь естественно передаётся как зависть к другому человеку.
- source_word: בְּאִישׁ חָמָס
  choice: жестокому человеку
  rationale: Буквально — «человеку насилия». Прилагательное «жестокий» естественно обозначает человека, склонного к насилию и беззаконному притеснению, не сужая выражение до единичного насильственного поступка.
- source_word: וְאַל תִּבְחַר
  choice: и не избирай
  rationale: Вторая запретительная конструкция параллельна первой; «избирать» сохраняет осознанный нравственный выбор и возвышенный, но понятный регистр.
- source_word: בְּכָל דְּרָכָיו
  choice: ни одного из его путей
  rationale: 'При отрицании эта формулировка естественно передаёт полный охват: нельзя перенимать ни один из его образов действий. «Пути» сохраняют характерную для литературы мудрости метафору поведения и образа жизни.'
