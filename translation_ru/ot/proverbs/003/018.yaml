base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/018.yaml
  text: She is a tree of life to those who take hold of her[b][a], and those who hold her fast are blessed.
translation:
  language: ru
  text: Она — дерево жизни для тех, кто держится за неё[a], а те, кто крепко держится за неё[b], блаженны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимения женского рода относятся к олицетворённой мудрости в ближайшем контексте.
    reason: cultural_note
  - marker: b
    text: 'Или: «те, кто поддерживает её». Еврейский глагол может означать «поддерживать», «подпирать» или «крепко держать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵץ חַיִּים
  choice: дерево жизни
  rationale: Сохраняет образ еврейского сочетания «дерево жизни», не отождествляя его явно с единственным райским деревом; отсутствие артикля в русском не требует выбора между «одно» и «то самое».
- source_word: הִיא
  choice: Она
  rationale: Местоимение женского рода относится к олицетворённой мудрости в ближайшем контексте; женский род сохраняет этот литературный образ.
- source_word: לַמַּחֲזִיקִים בָּהּ
  choice: для тех, кто держится за неё
  rationale: Передаёт конкретный образ прочного обладания или приверженности без более резкого оттенка глагола «схватить».
- source_word: וְתֹמְכֶיהָ
  choice: и те, кто крепко держит её
  rationale: В параллелизме с предыдущей строкой выражение естественно передаёт стойкую приверженность мудрости, сохраняя при этом возможность значения «поддерживать», отмеченную в сноске.
- source_word: מְאֻשָּׁר
  choice: блаженны
  rationale: Передаёт состояние благополучия и достойную зависти участь в языке библейской мудрости; «счастливы» могло бы звучать слишком субъективно, а «удачливы» связывало бы смысл со случаем.
theological_decisions:
- issue: Олицетворение мудрости
  choice: 'Сохранить личное местоимение женского рода: «Она… неё… её»'
  alternative: Передать мудрость безлично или заменить местоимения повтором слова «мудрость»
  rationale: Еврейский текст последовательно использует формы женского рода и продолжает контекстуальное олицетворение мудрости, не требуя дополнительных богословских отождествлений.
translation_notes:
  register: Современный литературный русский язык с традиционным для библейской мудрости словом «блаженны». Синтаксис сохраняет поэтический параллелизм и женское олицетворение мудрости; формулировка остаётся понятной без архаизации.
