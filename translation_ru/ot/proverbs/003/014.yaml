lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующего прославления мудрости и естественно связывает стих с контекстом.
- source_word: טוֹב
  choice: лучше
  rationale: При конструкции с מִן прилагательное «хороший» имеет сравнительное значение.
- source_word: סַחְרָהּ
  choice: прибыль от неё
  rationale: Передаёт торгово-экономический образ и указывает на пользу, которую приносит олицетворённая мудрость.
- source_word: מִסְּחַר כָּסֶף
  choice: прибыли от серебра
  rationale: Сохраняет повтор коммерческого понятия סחר и параллелизм исходного текста.
- source_word: כָּסֶף
  choice: серебро
  rationale: Обычное обозначение драгоценного металла в сравнении ценностей.
- source_word: וּמֵחָרוּץ
  choice: чистого золота
  rationale: חָרוּץ обозначает золото и может подразумевать особенно ценное или очищенное золото; «чистое золото» естественно передаёт этот оттенок.
- source_word: תְּבוּאָתָהּ
  choice: доход от неё
  rationale: В контексте коммерческого сравнения естественно обозначает получаемый результат или выручку, сохраняя отличие от первой строки.
