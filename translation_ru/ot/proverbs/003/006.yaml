  text: In all your ways acknowledge him[a], and he will make your paths straight.
translation:
  language: ru
  text: На всех твоих путях признавай Его[a], и Он сделает твои тропы прямыми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знай Его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «направит твои тропы». Еврейский текст буквально говорит: «сделает твои тропы прямыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל
  choice: на всех
  rationale: 'Сочетание предлога בְּ с כָּל обозначает всеохватную сферу: Бога следует признавать на всех путях жизни.'
- source_word: דְּרָכֶיךָ
  choice: своих путях
  rationale: דֶּרֶךְ может обозначать как дорогу, так и образ действий или жизненный путь. «Пути» сохраняет образность и отличается от «стезей» во второй строке.
- source_word: דָעֵהוּ
  choice: признавай Его
  rationale: Императив от יָדַע с местоименным суффиксом выражает не только умственное знание, но деятельное признание Бога и внимание к Нему во всём поведении. Буквальное «знай Его» сохранено в примечании.
- source_word: וְהוּא
  choice: и Он
  rationale: Союз и самостоятельное местоимение явно выделяют Бога как совершающего обещанное действие; дополнительное усиление «Сам» возможно, но не обязательно.
- source_word: יְיַשֵּׁר
  choice: выпрямит
  rationale: Пиэль глагола יָשַׁר означает «делать прямым, ровным». «Выпрямит» сохраняет исходный дорожный образ и не сводит обещание лишь к указанию направления.
- source_word: אֹרְחֹתֶיךָ
  choice: твои стези
  rationale: אֹרַח — путь, тропа, стезя в буквальном или переносном смысле. «Стези» сохраняет метафору и лексически отличает это слово от דְּרָכֶיךָ.
theological_decisions:
- issue: Характер Божьего водительства в обещании
  choice: Он выпрямит твои стези
  alternative: Он направит твои стези
  rationale: Еврейский глагол прежде всего рисует Бога делающим путь прямым или ровным, а не только сообщающим направление. Альтернативный перевод «направит» отражает допустимое осмысление образа, но несколько сужает его.
- issue: Смысл повеления דָעֵהוּ
  choice: признавай Его
  alternative: знай Его
  rationale: Основной перевод передаёт деятельное, жизненное признание Бога, тогда как буквальное «знай Его» в современном русском может быть понято как одно лишь обладание сведениями. Примечание сохраняет прямую лексическую связь с יָדַע.
translation_notes:
  register: Современный литературный русский с сохранением поэтической метафоры двух близких слов — «пути» и «стези». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым благоговейным библейским регистром; синтаксис краток и афористичен.
