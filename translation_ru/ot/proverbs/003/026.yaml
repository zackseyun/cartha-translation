  yaml_path: translation/ot/proverbs/003/026.yaml
  text: For Yahweh will be your confidence[a], and he will keep your foot from being caught.
translation:
  language: ru
  text: Ибо Яхве будет твоей опорой[a] и не даст твоей ноге попасть в ловушку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве будет у твоего бока». Еврейское выражение допускает более буквальное пространственное понимание, хотя здесь, вероятно, образно говорит об опоре и безопасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего наставления и обещания; «ибо» ясно сохраняет причинно-пояснительную связь и соответствует достойному литературному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: יִהְיֶה בְכִסְלֶךָ
  choice: будет твоей опорой
  rationale: Слово כֶּסֶל буквально может обозначать бок или поясницу, а переносно — уверенность или безопасность. «Опора» естественно звучит по-русски, передаёт основание уверенности и согласуется с последующим образом защиты.
- source_word: וְשָׁמַר
  choice: и не даст
  rationale: В сочетании с последующей конструкцией передаёт охранительное действие Яхве естественной русской фразой.
- source_word: רַגְלְךָ
  choice: твоей ноге
  rationale: Сохранено единственное число исходного текста и образ шагающего человека.
- source_word: מִלָּכֶד
  choice: попасть в ловушку
  rationale: Форма от לכד выражает захват или попадание в западню. Такой перевод ясно и естественно передаёт образ ноги, которую могли поймать, хотя слово «ловушка» в еврейском прямо не названо.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл בְכִסְלֶךָ
  choice: твоей опорой
  alternative: рядом с тобой
  rationale: Контекст обещанной защиты поддерживает переносный смысл уверенности или безопасности, однако буквальный пространственный оттенок остаётся возможным и отмечен в сноске.
translation_notes:
  register: 'Современный литературный русский язык с кратким, достойным звучанием. «Опора» выбрана вместо менее естественного «уверенность», а громоздкая конструкция «убережёт ногу от того, чтобы быть пойманной» передана идиоматически: «не даст твоей ноге попасть в ловушку».'
