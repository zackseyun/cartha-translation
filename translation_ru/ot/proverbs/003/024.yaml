  text: אִם תִּשְׁכַּ֥ב לֹֽא תִפְחָ֑ד וְ֝/שָׁכַבְתָּ֗ וְֽ/עָרְבָ֥ה שְׁנָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/024.yaml
  text: If you lie down[a], you will not be afraid; when you lie down, your sleep will be pleasant.
translation:
  language: ru
  text: Если ляжешь, не будешь бояться; ляжешь — и сон твой будет сладок.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет основное условное или ситуативное значение частицы; контекст при этом допускает смысл обычной жизненной ситуации.
- source_word: תִּשְׁכַּב
  choice: ляжешь
  rationale: Естественно передаёт שׁכב в контексте отхода ко сну и сохраняет лаконизм еврейской строки.
- source_word: לֹא תִפְחָד
  choice: не будешь бояться
  rationale: Передаёт отрицание и заверение в будущем результате, не превращая высказывание в повеление.
- source_word: וְשָׁכַבְתָּ
  choice: ляжешь — и
  rationale: Сохраняет повтор глагола и последовательность мысли; тире делает русскую фразу естественной и выразительной.
- source_word: וְעָרְבָה
  choice: будет сладок
  rationale: В сочетании со сном русское «сладок» естественно передаёт значение приятности, заключённое в ערב, и сохраняет образность оригинала.
- source_word: שְׁנָתֶךָ
  choice: сон твой
  rationale: Точно и ясно передаёт существительное «сон»; порядок слов поддерживает поэтический, но современный регистр.
theological_decisions: []
