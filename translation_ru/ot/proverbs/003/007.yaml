  text: אַל תְּהִ֣י חָכָ֣ם בְּ/עֵינֶ֑י/ךָ יְרָ֥א אֶת יְ֝הוָ֗ה וְ/ס֣וּר מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/007.yaml
  text: Do not be wise in your own eyes[c][b][a]; fear Yahweh and turn away from evil.
translation:
  language: ru
  text: Не будь мудрым в собственных глазах[a]; бойся Яхве[b] и сторонись зла[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не становись мудрым в собственных глазах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благоговей перед Яхве». Еврейский глагол может обозначать благоговейный страх и трепет перед Богом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отступай от зла»; «отворачивайся от зла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: не будь
  rationale: Отрицательная частица אַל с формой היה выражает запрет. «Не будь» естественно передаёт его по-русски, сохраняя возможность оттенка «не становись» в примечании.
- source_word: חָכָם בְּעֵינֶיךָ
  choice: мудрым в собственных глазах
  rationale: Сохранён прозрачный еврейский образ самооценки; слово «собственных» естественно выражает подразумеваемый возвратный смысл.
- source_word: יְרָא
  choice: бойся
  rationale: Императив ירא обозначает страх перед Богом, включающий благоговение. «Бойся» сохраняет полноту и богословскую весомость исходного выражения, не сводя его только к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וְסוּר
  choice: и удаляйся
  rationale: Императив סור призывает сознательно отступать, сторониться или отворачиваться. «Удаляйся» кратко и естественно передаёт нравственное требование.
- source_word: מֵרָע
  choice: от зла
  rationale: רָע в данном контексте обозначает зло в нравственном смысле; общий характер слова сохранён без неоправданного сужения до отдельных проступков.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе употреблено собственное имя יְהוָה. Форма «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Смысл глагола ירא по отношению к Богу
  choice: бойся
  alternative: благоговей перед
  rationale: Исходный глагол может охватывать и страх, и благоговейное почтение. Основной текст сохраняет прямое значение «бойся», а примечание указывает допустимый оттенок благоговения.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем, соответствующим жанру Притч. Еврейский образ «в собственных глазах» сохранён как понятный и значимый; повелительные формы переданы прямо и без конфессионального истолкования.
