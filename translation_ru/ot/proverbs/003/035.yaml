  text: כָּ֭בוֹד חֲכָמִ֣ים יִנְחָ֑לוּ וּ֝/כְסִילִ֗ים מֵרִ֥ים קָלֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/035.yaml
  text: The wise will inherit honor, but fools lift up disgrace.
translation:
  language: ru
  text: 'Мудрые унаследуют честь,

    а глупцы вознесут бесчестье.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּבוֹד
  choice: честь
  rationale: Передаёт здесь общественное достоинство и почёт; в данном противопоставлении естественнее русского «слава».
- source_word: חֲכָמִים
  choice: мудрые
  rationale: Обычный термин Притч для людей, живущих с мудростью.
- source_word: יִנְחָלוּ
  choice: унаследуют
  rationale: Сохраняет образ получения чего-либо как наследственного удела.
- source_word: כְסִילִים
  choice: глупцы
  rationale: Передаёт нравственно отрицательный тип человека в литературе мудрости, не сводя слово к недостатку знаний.
- source_word: מֵרִים
  choice: вознесут
  rationale: Буквально сохраняет активный образ «поднимать, возносить» и не устраняет необычность еврейского выражения.
- source_word: קָלוֹן
  choice: бесчестье
  rationale: Создаёт точную смысловую антитезу слову «честь» и передаёт позор, унижение.
theological_decisions:
- issue: Необычная формулировка «глупцы вознесут бесчестье»
  choice: Сохранить активный образ масоретского текста
  alternative: «глупцы пожнут бесчестье» или «глупцы будут покрыты позором»
  rationale: Еврейское מֵרִים формально означает «поднимающий/возносящий». Более гладкие варианты разрешают смысловую трудность и вводят отсутствующие в тексте образы; буквальный образ согласуется с предоставленным английским консультационным слоем.
translation_notes:
  register: Краткий, афористичный параллелизм сохранён. «Вознесут бесчестье» намеренно звучит несколько парадоксально, отражая напряжение и необычность исходной формулировки.
