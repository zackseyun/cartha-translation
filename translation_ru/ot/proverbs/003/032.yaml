  source_fidelity: Первая часть передана по смыслу, однако «развращённый» в современном русском обычно означает нравственно распущенного человека и сужает נָלוֹז, обозначающее уклоняющегося от прямого пути, кривого/лукавого. Во второй части «Его доверительное общение» не вполне ясно синтаксически и может восприниматься как общение, принадлежащее прямодушным. Явное «Он в близком общении» естественно передаёт один из основных смыслов סוֹד; примечание сохраняет значение доверительного совета.
