  text: כִּ֤י תוֹעֲבַ֣ת יְהוָ֣ה נָל֑וֹז וְֽ/אֶת יְשָׁרִ֥ים סוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/032.yaml
  text: For the crooked person is an abomination to Yahweh[a], but his counsel is with the upright.
translation:
  language: ru
  text: Ибо человек, идущий кривыми путями, — мерзость для Господа, а с прямодушными Он в близком общении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он посвящает прямодушных в Свой сокровенный совет»; еврейское слово может означать доверительный совет, тайну или близкое общение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего наставления; «ибо» естественно для возвышенной, но современной речи мудрости.
- source_word: תוֹעֲבַת יְהוָה
  choice: отвратителен Господу
  rationale: Предикативная конструкция передаёт сильную нравственную оценку תוֹעֵבָה естественнее по-русски, чем буквальное «мерзость Господа»; имя יהוה по устойчивой русской библейской традиции передано как «Господь».
- source_word: נָלוֹז
  choice: развращённый
  rationale: Слово обозначает человека, уклонившегося от прямого нравственного пути; субстантивированное прилагательное сохраняет противопоставление прямодушным.
- source_word: וְאֶת
  choice: а с
  rationale: В контексте антитетического параллелизма ו передано противительным «а»; אֶת при эллиптически подразумеваемом отношении естественно отражено предлогом «с».
- source_word: יְשָׁרִים
  choice: прямодушными
  rationale: Передаёт нравственную прямоту и поддерживает образный контраст с уклонившимся, развращённым человеком.
- source_word: סוֹדוֹ
  choice: Его доверительное общение
  rationale: סוֹד охватывает значения доверительного совета, тайны и близкого круга общения. Основной вариант сохраняет личностную близость и конфиденциальность, а примечание указывает другие возможные оттенки.
theological_decisions:
- issue: Смысл סוֹד применительно к прямодушным
  choice: У Господа с прямодушными доверительное общение
  alternative: «Его тайный совет — с прямодушными» или «Его тайна — у прямодушных»
  rationale: Еврейское слово допускает одновременно представления о близком круге, доверительном совете и сообщаемой тайне. Перевод не сводит смысл только к информации или только к общению, а примечание сохраняет многозначность.
translation_notes:
  register: Современный литературный русский с достоинством, свойственным книге Притч. Синтаксис краток и сохраняет антитетический параллелизм. «Прямодушные» выбрано как понятное обозначение нравственно прямых людей; тире подчёркивает эллипсис второй половины.
