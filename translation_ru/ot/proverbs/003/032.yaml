  terminology: «Господь» последовательно передаёт יהוה в принятой русской библейской традиции. «Прямодушные» приемлемо передаёт יְשָׁרִים. Формулировка основного текста и примечания не сводит סוֹד исключительно к тайной информации либо к общению.
