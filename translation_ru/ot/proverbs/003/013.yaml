base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/013.yaml
  text: Blessed is the man who finds wisdom[a], and the man who obtains understanding.
translation:
  language: ru
  text: 'Блажен человек, который обрёл мудрость,

    и человек, который обретает разумение.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское «обретает» имеет форму, которая может передавать как обобщённое действие, так и достижение результата; возможен также перевод: «и человек, который извлекает разумение».'
    reason: 'Лексико-грамматическая неоднозначность יָפִיק: глагол может означать «извлекать», «производить», «обретать» или «достигать»; его форма отличается от формы глагола в первом полустишии.'
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Идиоматическая форма провозглашает достойное зависти благополучие человека; «блажен» сохраняет возвышенный тон изречения и традиционную форму блаженства.
- source_word: אָדָם
  choice: человек
  rationale: В обоих полустишиях существительное употреблено в единственном числе и имеет обобщающий смысл. Русское «человек» точно сохраняет форму и естественно включает всякого человека независимо от пола.
- source_word: מָצָא
  choice: обрёл
  rationale: Перфект в контексте общего изречения описывает достигнутый результат. «Обрёл» естественно сочетается с мудростью и передаёт больше, чем случайное обнаружение.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Основное соответствие центральному термину литературы мудрости.
- source_word: יָפִיק
  choice: приобрёл
  rationale: В параллели с «обрёл мудрость» глагол означает успешное достижение или получение. «Приобрёл» сохраняет результативность, не ограничивая смысл буквальным «извлёк».
- source_word: תְּבוּנָה
  choice: разумение
  rationale: Передаёт способность понимать и различать, сохраняет возвышенный литературный регистр и хорошо образует традиционную пару с «мудростью».
theological_decisions:
- issue: Обобщающее значение אָדָם в изречении о блаженстве
  choice: человек
  alternative: муж; всякий, кто
  rationale: Еврейское אָדָם обозначает здесь представителя человеческого рода, а не исключительно мужчину. Русское «человек» формально соответствует существительному мужского рода и без смысловой нейтрализации передаёт его общий охват.
- issue: Соотношение нахождения мудрости и человеческого усилия
  choice: обрёл / приобрёл
  alternative: нашёл / извлекает
  rationale: Параллелизм говорит о достижении мудрости и разумения, но не уточняет, получены ли они исключительно усилием, дарованы или обнаружены. Выбранные слова сохраняют эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном, уместным для изречения о блаженстве. Поэтический параллелизм и повтор слова «человек» сохранены; архаическое «муж» не используется, поскольку здесь אָדָם имеет общечеловеческое значение.
