  text: אִם לַ/לֵּצִ֥ים הֽוּא יָלִ֑יץ ו/ל/עניים יִתֶּן חֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/034.yaml
  text: Surely he scoffs at scoffers[a], but gives favor[b] to the humble[c].
translation:
  language: ru
  text: Поистине, над насмешниками он насмехается[a], а смиренным[c] дарует благоволение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над глумливыми он глумится». В еврейском тексте существительное и глагол образованы от одного корня.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «милость», «благодать».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «бедным», «угнетённым». Это слово может обозначать людей, занимающих низкое положение или стеснённых тяжёлыми обстоятельствами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Поистине
  rationale: 'Здесь אִם имеет усилительно-утвердительное, а не обычное условное значение: условное следствие отсутствует, и изречение утверждает характерный образ действия Бога.'
- source_word: לַלֵּצִים ... יָלִיץ
  choice: над насмешниками он насмехается
  rationale: Повтор однокоренных русских слов передаёт намеренную игру одного еврейского корня и симметрию воздаяния.
- source_word: הוּא
  choice: он
  rationale: Сохранено явное местоимение исходного текста; его референт — Бог — определяется контекстом и не подставляется непосредственно в стих.
- source_word: וְלַעֲנִיִּים
  choice: а смиренным
  rationale: В антитезе насмешникам речь прежде всего о смиренном положении и настрое, однако возможные значения бедности и угнетённости сохранены в примечании.
- source_word: יִתֶּן
  choice: дарует
  rationale: Настоящее время передаёт общеистинный, характерный смысл несовершенного вида в изречении; «дарует» естественно сочетается с «благоволением».
- source_word: חֵן
  choice: благоволение
  rationale: Слово обозначает благосклонность, расположение или милость. «Благоволение» передаёт смысл в контексте литературы мудрости, не сужая его до позднейшего богословского термина.
theological_decisions:
- issue: Референт местоимения הוּא
  choice: Оставлено «он», а Бог понимается из контекста.
  alternative: Прямо написать «Господь» или «Бог».
  rationale: В еврейском тексте стоит местоимение, а не имя Бога. Такой перевод не добавляет отсутствующего в стихе обозначения и сохраняет контекстуальную связь.
- issue: Значение עניים
  choice: смиренным
  alternative: бедным; угнетённым; униженным
  rationale: Антитеза «насмешники — смиренные» указывает на нравственную установку и положение человека, но слово также может обозначать людей, приниженных социальными обстоятельствами; эта многозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой изречения. Строчная буква в местоимении «он» соответствует обычной современной орфографии и не добавляет толковательного выделения. Корневой повтор «насмешниками — насмехается» намеренно сохранён.
