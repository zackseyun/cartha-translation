  text: She is more precious than jewels[a], and none of your delights can compare with her.
translation:
  language: ru
  text: Она дороже драгоценных камней[a], и ничто из того, что тебе желанно, не сравнится с ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рубинов», «жемчуга» или «кораллов»; точное значение еврейского слова неизвестно, но оно обозначает драгоценные камни или иные ценности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקָרָה
  choice: дороже
  rationale: Прилагательное выражает высокую ценность, а предлог מִן задаёт сравнение; по-русски это естественно передаётся сравнительной степенью «дороже».
- source_word: הִיא
  choice: она
  rationale: Местоимение женского рода отсылает к мудрости и сохраняет её олицетворение.
- source_word: מִפְּנִינִים
  choice: драгоценных камней
  rationale: Точный вид ценностей, обозначаемых פְּנִינִים, не установлен; обобщённый перевод сохраняет смысл и лексическую неопределённость.
- source_word: וְכָל חֲפָצֶיךָ
  choice: и ничто из желанного тобой
  rationale: В сочетании с отрицанием буквальное «всё желанное тобой не равно» естественно выражается по-русски отрицательно-распределительной конструкцией; חֲפָצֶיךָ обозначает желанные вещи, а не только субъективные желания.
- source_word: לֹא יִשְׁווּ בָהּ
  choice: не сравнится с ней
  rationale: Глагол שוה означает быть равным или сопоставимым; русская конструкция естественно передаёт невозможность сравняться с мудростью.
theological_decisions: []
