  text: בְּ֭נִ/י תּוֹרָתִ֣/י אַל תִּשְׁכָּ֑ח וּ֝/מִצְוֺתַ֗/י יִצֹּ֥ר לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/001.yaml
  text: My son[a], do not forget my instruction[b], and let your heart keep my commandments.
translation:
  language: ru
  text: Сын мой, не забывай моего наставления[a], и пусть сердце твоё хранит[b] мои заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учения». Здесь еврейское слово тора означает наставление или поучение, не обязательно закон в узком юридическом смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бережёт». Еврейский глагол передаёт мысль о внимательном хранении и соблюдении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Форма мужского рода единственного числа с притяжательным суффиксом передаёт прямое обращение отца к сыну, характерное для наставлений в книге Притч.
- source_word: תּוֹרָתִי
  choice: моего наставления
  rationale: В данном контексте תּוֹרָה означает родительское наставление или поучение мудрости, а не обязательно закон в узком юридическом смысле.
- source_word: אַל תִּשְׁכָּח
  choice: не забывай
  rationale: Естественно передаёт еврейскую запретительную конструкцию, сохраняя её прямую побудительную силу.
- source_word: וּמִצְוֺתַי
  choice: мои заповеди
  rationale: Слово обозначает авторитетные повеления; «заповеди» сохраняет их вес и хорошо сочетается с библейским контекстом, не отождествляя их непременно с Моисеевым законом.
- source_word: יִצֹּר
  choice: пусть … хранит
  rationale: Глагол נצר выражает заботливое хранение и соблюдение. «Хранит» сохраняет этот образ сильнее, чем нейтральное «соблюдает», а конструкция с «пусть» передаёт побудительную форму.
- source_word: לִבֶּךָ
  choice: сердце твоё
  rationale: «Сердце» сохранено как библейское обозначение внутреннего центра мысли, воли и желания; перевод «ум» неоправданно сузил бы значение.
theological_decisions:
- issue: Гендерно маркированное обращение в наставлении мудрости
  choice: Сохранить обращение мужского рода «Сын мой»
  alternative: «Дитя моё» или «Ребёнок мой»
  rationale: Еврейский текст прямо употребляет форму мужского рода единственного числа и отражает литературную ситуацию отцовского наставления сыну; нейтрализация устранила бы особенность исходного текста.
- issue: Значение תּוֹרָה в данном контексте
  choice: «наставление»
  alternative: «закон» или «учение»
  rationale: Контекст книги Притч указывает на наставление мудрости, поэтому перевод не должен без достаточного основания представлять эти слова как прямую ссылку исключительно на Моисеев закон.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства афористического наставления. Порядок слов «Сын мой» и «сердце твоё» слегка возвышен, но естественен для русской библейской речи; лексика остаётся понятной современному читателю.
