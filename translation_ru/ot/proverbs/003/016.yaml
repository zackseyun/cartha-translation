  text: אֹ֣רֶךְ יָ֭מִים בִּֽ/ימִינָ֑/הּ בִּ֝/שְׂמֹאולָ֗/הּ עֹ֣שֶׁר וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/016.yaml
  text: Length of days is in her right hand[a]; in her left hand are riches and honor.
translation:
  language: ru
  text: Долголетие — в правой руке её[a], а в левой руке её — богатство и почёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «длина дней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: долголетие
  rationale: Передаёт еврейское выражение «длина дней» естественным современным русским словом, сохраняя значение долгой жизни.
- source_word: בִּימִינָהּ
  choice: в правой руке её
  rationale: Предлог ב здесь естественно указывает на то, что олицетворённая мудрость держит дар в руке; постпозиция местоимения поддерживает поэтический, но понятный строй.
- source_word: בִּשְׂמֹאולָהּ
  choice: в левой руке её
  rationale: Сохраняет синтаксический и образный параллелизм с правой рукой, а женский суффикс относится к олицетворённой мудрости.
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Обычное и точное русское соответствие в контексте благ, связанных с мудростью.
- source_word: כָבוֹד
  choice: почёт
  rationale: В данном контексте обозначает общественное уважение и высокое положение; «почёт» точнее контекстуального смысла, чем более широкое «слава».
theological_decisions:
- issue: К кому относятся суффиксы женского рода
  choice: К олицетворённой мудрости из ближайшего контекста
  alternative: Понимать женский образ как указание на отдельное божественное существо
  rationale: Стих продолжает литературное олицетворение мудрости как женщины, держащей дары в обеих руках; грамматика не требует самостоятельного богословского отождествления этого образа.
translation_notes:
  register: Современный литературный русский язык с кратким, уравновешенным поэтическим строем. Тире передаёт безглагольные еврейские предложения; повтор «руке её» сохраняет параллелизм оригинала.
