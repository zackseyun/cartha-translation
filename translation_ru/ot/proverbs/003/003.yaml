  text: Let steadfast love and faithfulness not forsake you[a]; bind them around your neck; write them on the tablet of your heart.
translation:
  language: ru
  text: Пусть неизменная любовь и верность не оставляют тебя[a]; повяжи их себе на шею, напиши их на табличке своего сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милость и истина». Еврейское сочетание часто обозначает преданную доброту и надёжность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: милость
  rationale: Передаёт деятельную, неизменную доброту и преданность в отношениях; в сочетании с אֱמֶת традиционно и естественно звучит по-русски, хотя смысл шире одного лишь сострадания.
- source_word: אֱמֶת
  choice: верность
  rationale: В паре с חֶסֶד слово обозначает надёжность и постоянство, а не только отвлечённую истину; «верность» лучше соответствует нравственному наставлению.
- source_word: אַל יַעַזְבֻךָ
  choice: пусть ... не оставляют тебя
  rationale: Сохраняет увещевательную силу конструкции אַל с имперфектом и олицетворение милости и верности как грамматического субъекта.
- source_word: קָשְׁרֵם
  choice: обвяжи ими
  rationale: Конкретный образ намеренного закрепления сохранён; творительная конструкция естественна в русском и учитывает суффикс объекта «их/ими».
- source_word: גַּרְגְּרוֹתֶיךָ
  choice: шею
  rationale: Слово обозначает область горла или шеи; при глаголе «обвязать» русский винительный падеж естественно передаёт образ ношения на шее.
- source_word: כָּתְבֵם
  choice: напиши их
  rationale: Прямо сохраняет повеление и метафору сознательного внутреннего усвоения.
- source_word: לוּחַ לִבֶּךָ
  choice: скрижали своего сердца
  rationale: «Скрижаль» сохраняет конкретный образ таблички для письма и обладает достойным библейским регистром; единственное число соответствует еврейскому тексту.
theological_decisions:
- issue: Передача сочетания חֶסֶד וֶאֱמֶת
  choice: милость и верность
  alternative: неизменная любовь и верность; милость и истина
  rationale: Выбор сохраняет relationalный смысл деятельной преданности и надёжности, не сводя אֱמֶת к отвлечённой истинности и не добавляя узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Синтаксический параллелизм и олицетворение исходного текста сохранены; «скрижаль сердца» оставлена как прозрачная конкретная метафора.
