base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/028.yaml
  text: Do not say to your neighbor[a], “Go, and come back[b], and tomorrow I will give,” when you have it with you.
translation:
  language: ru
  text: 'Не говори ближнему: «Иди, приходи снова — завтра дам», — когда у тебя это есть.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда это есть при тебе». То есть у человека уже есть то, что он мог бы дать, и ему не следует откладывать помощь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעַ
  choice: ближний
  rationale: В контексте Притч слово обозначает человека из ближайшего социального круга, не обязательно близкого друга; «ближний» сохраняет широту нравственного обязательства.
- source_word: לֵךְ
  choice: уйди
  rationale: Прямое повеление отослать просителя; в русском диалоге «уйди» естественно передаёт движение от говорящего.
- source_word: שׁוּב
  choice: приходи снова
  rationale: В обращении к собеседнику это естественно передаёт требование вернуться; возможное «возвращайся» звучит несколько книжнее.
- source_word: מָחָר
  choice: завтра
  rationale: Прямой и обычный эквивалент временного наречия.
- source_word: אֶתֵּן
  choice: дам
  rationale: Сохраняет подразумеваемый, но не названный объект еврейского глагола.
- source_word: יֵשׁ אִתָּךְ
  choice: если у тебя есть, что дать
  rationale: Передаёт наличие у человека необходимых средств уже сейчас и естественно звучит по-русски, не ограничивая смысл конкретным предметом в руке.
- source_word: אַל
  choice: не говори
  rationale: Обычная форма отрицательного запрета без добавочного усиления.
theological_decisions:
- issue: Смысл заключительной оговорки
  choice: У человека уже есть возможность дать требуемое
  alternative: Предмет буквально находится при нём
  rationale: Оборот יֵשׁ אִתָּךְ допускает буквальное понимание «есть при тебе», но в контексте нравственный акцент падает на неоправданную отсрочку при наличии средств; перевод сохраняет этот смысл без уточнения вида помощи.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной синтаксической формой. Прямая речь сохранена; «ближний» выбрано как достоинственное и привычное для библейской этической речи слово.
