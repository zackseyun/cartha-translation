  text: בְּטַ֣ח אֶל יְ֭הוָה בְּ/כָל לִבֶּ֑/ךָ וְ/אֶל בִּֽ֝ינָתְ/ךָ֗ אַל תִּשָּׁעֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/005.yaml
  text: Trust in Yahweh with all your heart[a], and do not lean on your own understanding.
translation:
  language: ru
  text: Доверяй Яхве всем сердцем и не опирайся[a] на собственное разумение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не полагайся на собственное разумение». Еврейский глагол буквально означает «опираться» или «поддерживать себя, опираясь на что-либо».'
    reason: Лексический вариант поясняет сохранённую в основном тексте метафору.
lexical_decisions:
- source_word: בְּטַח
  choice: Надейся
  rationale: Повелительная форма 2-го лица единственного числа выражает прямой призыв довериться и положиться на Бога. «Надейся» естественно звучит по-русски и передаёт доверительную опору, а не только ожидание будущего.
- source_word: אֶל יְהוָה
  choice: на Яхве
  rationale: При глаголе בטח предлог אֶל указывает, на кого направлено доверие. Русское сочетание «надеяться на» идиоматично передаёт эту связь. Имя יהוה передано транслитерацией «Яхве», а не заменено титулом.
- source_word: בְּכָל לִבֶּךָ
  choice: всем сердцем
  rationale: Оборот выражает полноту внутреннего доверия. «Сердце» сохраняет широкое древнееврейское представление о внутреннем человеке, включая мысли, волю и чувства.
- source_word: בִּינָתְךָ
  choice: собственное разумение
  rationale: בִּינָה обозначает понимание, способность рассуждать и различать. «Разумение» уместно в литературном тексте мудрости, а «собственное» ясно передаёт притяжательный суффикс и противопоставление доверию Яхве.
- source_word: אַל תִּשָּׁעֵן
  choice: не опирайся
  rationale: אַל с данной глагольной формой выражает запрет. Нифаль глагола שׁען передаёт образ человека, который опирается на что-либо ради поддержки; русский глагол «опираться» сохраняет эту метафору.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя, не подменяя титулом и не вводя менее вероятную традиционную огласовку.
- issue: Соотношение доверия Богу и человеческого разумения
  choice: Сохранён прямой контраст без поясняющего расширения
  alternative: Не полагайся исключительно на собственный разум
  rationale: Слово «исключительно» отсутствует в исходном тексте и могло бы смягчить абсолютную форму наставления. Перевод сохраняет напряжение самого изречения, не превращая его в отрицание всякого разумного суждения и не добавляя такого толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык с краткой, запоминающейся формой наставления. Синтаксический параллелизм еврейского стиха сохранён; архаизмы и конфессионально окрашенные добавления не использованы.
