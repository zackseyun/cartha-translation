  text: רִ֭פְאוּת תְּהִ֣י לְ/שָׁרֶּ֑/ךָ וְ֝/שִׁקּ֗וּי לְ/עַצְמוֹתֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/008.yaml
  text: It will be healing to your body and refreshment to your bones[a][b].
translation:
  language: ru
  text: Это будет исцелением для твоего тела[a] и подкреплением для твоих костей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоему пупу». Еврейское слово может обозначать именно пуп, хотя здесь оно, вероятно, шире указывает на физическое благополучие всего тела.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «увлажнением» или «питанием» для твоих костей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִפְאוּת
  choice: исцеление
  rationale: Существительное обозначает исцеление или восстановление здоровья; «исцеление» сохраняет направленный на результат смысл и телесную образность.
- source_word: תְּהִי
  choice: это принесёт
  rationale: Форма 3-го лица женского рода согласуется с רִפְאוּת и в контексте выражает следствие предшествующего наставления. Конструкция «это принесёт» естественно передаёт такой результат по-русски.
- source_word: לְשָׁרֶּךָ
  choice: твоему телу
  rationale: Редкое слово שֹׁר традиционно понимают как «пуп», но в данном параллелизме оно, вероятно, обозначает телесное благополучие в более широком смысле. Основной текст передаёт этот смысл, а буквальная анатомическая возможность сохранена в сноске.
- source_word: וְשִׁקּוּי
  choice: и подкрепление
  rationale: Слово связано с поением, увлажнением и насыщением влагой. «Подкрепление» естественно выражает восстановительный эффект, не устраняя конкретные варианты образа, приведённые в сноске.
- source_word: לְעַצְמוֹתֶיךָ
  choice: твоим костям
  rationale: Прямой перевод сохраняет конкретный еврейский образ костей как внутреннего телесного остова и носителя жизненной силы.
theological_decisions:
- issue: Характер обещанного телесного блага
  choice: Сохранена формулировка результата без уточнения механизма или безусловности обещания.
  alternative: Истолковать строку как гарантию немедленного физического исцеления либо только как метафору духовного благополучия.
  rationale: Сам стих использует конкретную телесную образность в жанре мудрого наставления; перевод не должен ни превращать её в медицинскую гарантию, ни лишать телесного смысла.
translation_notes:
  register: Современный литературный русский язык с краткой, образной структурой изречения. Выбрано «подкрепление» как понятное и достойное соответствие редкому образу напоения или увлажнения костей; буквальные альтернативы сохранены в сносках.
