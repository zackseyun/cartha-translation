  text: Then you will walk securely on your way[a], and your foot will not stumble.
translation:
  language: ru
  text: Тогда ты будешь идти своим путём[a] в безопасности, и нога твоя не споткнётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безопасно». Еврейское выражение указывает на безопасность и защищённость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временно-следственную связь с предшествующим наставлением кратко и естественно.
- source_word: תֵּלֵךְ
  choice: ты будешь идти
  rationale: Глагол הלך означает «идти, ходить»; выбранное выражение сохраняет образ жизненного пути и естественно сочетается со словом «путём».
- source_word: לָבֶטַח
  choice: безопасно
  rationale: Передаёт объективную безопасность и защищённость, не смещая смысл к субъективной уверенности.
- source_word: דַּרְכֶּךָ
  choice: своим путём
  rationale: דֶּרֶךְ может обозначать дорогу или образ жизни; «своим путём» сохраняет буквальный и переносный планы.
- source_word: וְרַגְלְךָ
  choice: и нога твоя
  rationale: Сохранено единственное число исходного текста; порядок слов придаёт фразе достоинство, оставаясь понятным современному читателю.
- source_word: לֹא תִגּוֹף
  choice: не споткнётся
  rationale: В контексте безопасной ходьбы форма от נגף описывает удар ногой о препятствие и вследствие этого — спотыкание; выбран естественный русский эквивалент.
