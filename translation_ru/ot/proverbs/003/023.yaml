    issue: «своим путём» вместо «твоим путём»
    rationale: Еврейский суффикс 2-го лица означает «твой». Русское «своим» не является ошибкой, но может добавлять неуместный оттенок «по собственному выбору»; «твоим путём» точнее.
  - severity: low
    issue: Не вполне естественное «будешь безопасно идти»
    rationale: Наречие «безопасно» здесь менее плавно для современного литературного русского, чем предложное выражение «в безопасности». Это также близко к לָבֶטַח.
