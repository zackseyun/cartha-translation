  text: יְֽהוָ֗ה בְּ/חָכְמָ֥ה יָֽסַד אָ֑רֶץ כּוֹנֵ֥ן שָׁ֝מַ֗יִם בִּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/019.yaml
  text: Yahweh founded the earth by wisdom[a]; he established the heavens by understanding.
translation:
  language: ru
  text: 'Яхве мудростью[a] основал землю,

    разумением утвердил небеса.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с мудростью»… «с разумением». Еврейский предлог может обозначать как средство, так и сопутствующее обстоятельство; здесь творительный падеж лучше передаёт инструментальный смысл в контексте сотворения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּחָכְמָה
  choice: мудростью
  rationale: Предлог ב здесь естественно понимать как указание на средство; творительный падеж кратко и поэтично передаёт этот смысл.
- source_word: יָסַד
  choice: основал
  rationale: Глагол обозначает основание или закладку основания и сохраняет строительный образ сотворения.
- source_word: אָרֶץ
  choice: землю
  rationale: В космологическом параллелизме с небесами речь идёт о земле, а не об отдельной стране.
- source_word: כּוֹנֵן
  choice: утвердил
  rationale: Слово передаёт установление чего-либо прочно и сохраняет смысловое отличие от «основал».
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Форма множественного числа соответствует возвышенной космологической паре «земля — небеса».
- source_word: בִּתְבוּנָה
  choice: разумением
  rationale: Творительный падеж передаёт средство действия и сохраняет параллелизм с «мудростью»; «разумение» уместно для словаря книги Притчей.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Роль мудрости и разумения в сотворении
  choice: 'Инструментальное значение: «мудростью… разумением»'
  alternative: 'Сопутствующее значение: «с мудростью… с разумением»'
  rationale: Предлог ב допускает оба оттенка, однако в данном параллелизме наиболее естественно указывает на средство; альтернативу сохраняет сноска.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Параллелизм двух строк и различие глаголов יָסַד / כּוֹנֵן сохранены.
