translation:
  language: ru
  text: Склони ухо и слушай слова мудрых, и направь сердце к моему знанию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к моему наставлению». Буквально в еврейском тексте: «к моему знанию»; речь может идти как о знании, которым обладает говорящий, так и, в расширительном смысле, о передаваемом им наставлении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַט אָזְנְךָ
  choice: Склони ухо
  rationale: Сохраняет образ еврейского выражения и побуждение сознательно обратить внимание; единственное число «ухо» соответствует форме оригинала.
- source_word: וּשְׁמַע
  choice: и слушай
  rationale: Передаёт продолжительное внимательное восприятие и при этом не сливает этот призыв с предшествующим образом склонённого уха.
- source_word: דִּבְרֵי חֲכָמִים
  choice: слова мудрых
  rationale: Естественно передаёт сочетание «слова/речения мудрых», не добавляя указания на пол, которого контекст не требует.
- source_word: וְלִבְּךָ תָּשִׁית
  choice: направь сердце
  rationale: Глагол имеет значение «положить, установить, направить»; выбранная формулировка естественна по-русски и сохраняет сердце как средоточие мысли и воли.
- source_word: לְדַעְתִּי
  choice: к моему знанию
  rationale: Сохраняет притяжательный суффикс первого лица и существительное «знание», не сводя неоднозначное выражение сразу к более истолковательному «наставлению».
