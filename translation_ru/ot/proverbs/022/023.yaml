  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. Юридическая лексика первой строки сохранена. Повтор корня קבע нельзя полностью воспроизвести по-русски без неестественного оборота; сочетание «отнимет жизнь» / «обирает» всё же сохраняет мотив ответного отнятия. Сноска корректно предлагает более свободный, но семантически допустимый вариант и имеет верный якорь.
