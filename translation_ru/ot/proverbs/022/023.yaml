id: PRO.22.23
reference: Proverbs 22:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי יְ֭הוָה יָרִ֣יב רִיבָ֑/ם וְ/קָבַ֖ע אֶת קֹבְעֵי/הֶ֣ם נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/023.yaml
  text: For Yahweh will plead their case and rob of life those who rob them[a].
translation:
  language: ru
  text: Ведь Яхве будет вести их тяжбу и отнимет жизнь у тех, кто их обирает[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь Яхве вступится за них и лишит жизни тех, кто их грабит».'
    reason: 'Лексическая альтернатива: более свободная формулировка яснее выражает заступничество и воздаяние, но слабее сохраняет судебный образ и игру однокоренных слов.'
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для предшествующего предостережения; «ведь» естественно передаёт причинно-пояснительную связь в русском изречении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: יָרִיב רִיבָם
  choice: будет вести их тяжбу
  rationale: Глагол и однокоренное существительное относятся к спору или судебному разбирательству. Формулировка сохраняет юридический образ и внутреннее повторение еврейского выражения настолько, насколько это естественно по-русски.
- source_word: וְקָבַע
  choice: и отнимет жизнь
  rationale: В данном сочетании глагол קבע означает лишение или отнятие, а נָפֶשׁ обозначает жизнь. «Отнимет жизнь» ясно передаёт смертельное воздаяние.
- source_word: קֹבְעֵיהֶם
  choice: у тех, кто их обирает
  rationale: Причастие образовано от того же корня קבע. Глагол «обирать» передаёт значение грабежа и частично сохраняет связь с ответным отнятием жизни.
- source_word: נָפֶשׁ
  choice: жизнь
  rationale: Здесь слово обозначает жизнь человека, а не отдельно мыслимую нематериальную душу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога, присутствующее в еврейском тексте, не подменяя его титулом.
- issue: Характер действия Яхве в первой строке
  choice: будет вести их тяжбу
  alternative: вступится за них
  rationale: Основной вариант сохраняет судебный образ корня ריב и не сводит его к более общему заступничеству.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка в стиле изречения. «Тяжба» выбрана как понятное, хотя и слегка возвышенное юридическое слово; «обирает» поддерживает мотив неправедного отнятия и ответного воздаяния.
