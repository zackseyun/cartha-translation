  source_fidelity: 'Текст точно передаёт обе части еврейского стиха: כִּי выражено причинно-пояснительным «Ведь»; Яхве назван субъектом; יָרִיב רִיבָם адекватно передано юридическим оборотом «будет вести их тяжбу»; заключительная строка передаёт смертельное воздаяние тем, кто обирает угнетённых. «Отнимет жизнь» обоснованно передаёт נָפֶשׁ в данном контексте и не навязывает представление о нематериальной душе.'
