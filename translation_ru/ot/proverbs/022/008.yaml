base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/008.yaml
  text: Whoever sows injustice will reap trouble[b][a], and the rod of his fury will come to an end.
translation:
  language: ru
  text: Кто сеет несправедливость, пожнёт беду[a], и жезл его ярости придёт к концу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастье», «горе». Еврейское слово может обозначать пагубное последствие или страдание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и жезл его гнева придёт к концу». Фраза может указывать на конец яростной силы или власти того, кто творит несправедливость.'
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹרֵעַ
  choice: Кто сеет
  rationale: Причастие мужского рода употреблено обобщённо; эта конструкция естественно передаёт характер сентенции и сохраняет земледельческий образ.
- source_word: עַוְלָה
  choice: несправедливость
  rationale: Существительное обозначает неправду и несправедливое деяние; выбранное слово понятно современному читателю и сохраняет нравственный вес выражения.
- source_word: יקצור
  choice: пожнёт
  rationale: Имперфект выражает закономерное будущее следствие; сохранена метафорическая пара «сеет — пожнёт».
- source_word: אָוֶן
  choice: беду
  rationale: В данном контексте слово обозначает пагубный итог, несчастье или горе, которое становится «урожаем» несправедливости.
- source_word: וְשֵׁבֶט
  choice: и жезл
  rationale: שֵׁבֶט может означать жезл, посох или орудие наказания. «Жезл» сохраняет образ власти и силы, не сводя его лишь к бытовой палке.
- source_word: עֶבְרָתוֹ
  choice: его ярости
  rationale: Форма естественно понимается как «его ярость/гнев»; «ярость» передаёт интенсивность и хорошо сочетается с образом насильственной силы.
- source_word: יִכְלֶה
  choice: исчезнет
  rationale: Глагол означает закончиться, иссякнуть, быть уничтоженным. «Исчезнет» естественно передаёт прекращение действия жезла, не уточняя сверх текста, каким именно образом это произойдёт.
theological_decisions:
- issue: Значение заключительной фразы וְשֵׁבֶט עֶבְרָתוֹ יִכְלֶה
  choice: «и жезл его ярости исчезнет» — прекратится орудие или проявление яростной силы творящего несправедливость.
  alternative: «и жезл его гнева иссякнет»; возможно также понимание жезла как направленного против его ярости.
  rationale: Масоретская огласовка наиболее прямо даёт «жезл его ярости», однако связь родительного оборота допускает некоторую смысловую неоднозначность. Перевод сохраняет образ и утверждает конец насильственной силы, не вводя более узкого доктринального объяснения.
translation_notes:
  register: Современный литературный русский язык; краткая форма мудрого изречения сохранена. Метафора сеяния и жатвы передана буквально, а редкий образ жезла оставлен ради смысловой и поэтической связи с древнееврейским текстом.
