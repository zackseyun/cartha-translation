  source_fidelity: 'Первая часть в целом передана верно: אֹהֵב טהור־לֵב — обобщённое «кто любит чистоту сердца». Заключение «тому царь — друг» точно отражает краткое именное предложение רֵעֵהוּ מֶלֶךְ и не навязывает будущего времени. Однако «речь исполнена доброты» несколько сужает חֵן («приятность, благосклонность, изящество») до нравственной доброты; более близко и естественно передать качество слов как «приятны».'
