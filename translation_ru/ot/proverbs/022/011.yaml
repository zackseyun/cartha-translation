base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/011.yaml
  text: He who loves purity of heart[b][a], and whose speech is gracious—the king is his friend.
translation:
  language: ru
  text: Кто любит чистоту сердца и чьи слова приятны[a], тому царь — друг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приятность (благодать) его уст».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово «царь» стоит без определённого артикля и может означать как конкретного царя, так и царя вообще.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֵב
  choice: Кто любит
  rationale: Причастие породы qal употреблено субстантивно и выражает обобщённого участника; русская конструкция «кто любит» естественно передаёт смысл притчи.
- source_word: טהור לֵב
  choice: чистоту сердца
  rationale: Сочетание обозначает внутреннюю нравственную чистоту. Отвлечённое существительное позволяет естественно связать его с глаголом «любит».
- source_word: חֵן שְׂפָתָיו
  choice: чья речь исполнена доброты
  rationale: Буквально говорится о «благодати/приятности его уст». Передача через «речь» раскрывает метонимию уст, а «доброта» выражает благожелательное, располагающее качество слов без узко богословского оттенка слова «благодать».
- source_word: רֵעֵהוּ
  choice: тому … друг
  rationale: Суффикс указывает на человека, описанного в первой части; русское «тому» ясно сохраняет эту связь, а «друг» естественно передаёт רֵעַ.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Существительное без артикля допускает как обобщённое «царь», так и контекстуально определённое «этот царь». В основном тексте сохранена лаконичная форма без добавления определённости.
theological_decisions:
- issue: Характер связи между добродетелью человека и дружбой царя
  choice: Сохранено краткое утверждение притчи без добавления обещания или причинной формулы
  alternative: «будет другом царю» / «царь станет ему другом»
  rationale: В еврейском тексте заключительная часть — именное предложение без выраженного глагола будущего времени; перевод не превращает наблюдение мудрости в безусловное временное обещание.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Речь» употреблено вместо буквального «уста» ради естественности, а буквальный образ сохранён в сноске. Тире перед «друг» передаёт именную конструкцию оригинала.
