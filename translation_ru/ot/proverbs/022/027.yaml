  text: If you have nothing with which to pay[a], why should he take your bed from under you?
translation:
  language: ru
  text: Если тебе нечем заплатить, почему он должен забрать у тебя постель[a] из-под тебя?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ложе» или «место для сна». В еврейском тексте назван конкретный предмет, который забирают, а не просто «залог».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Союз вводит реальное условие в предостережении.
- source_word: אֵין לְךָ
  choice: тебе нечем
  rationale: 'Идиоматически передаёт еврейскую конструкцию отсутствия обладаемого средства: «у тебя нет того, чем…».'
- source_word: לְשַׁלֵּם
  choice: заплатить
  rationale: Инфинитив породы пиэль от שׁלם в данном контексте означает выплатить или погасить долг; дополнение подразумевается.
- source_word: לָמָּה
  choice: зачем же
  rationale: Передаёт риторический вопрос и увещевательную силу контекста; частица «же» естественно подчёркивает следствие необдуманного поручительства.
- source_word: יִקַּח
  choice: ему забирать
  rationale: Сохраняет мужской субъект третьего лица, вероятно кредитора из контекста, не называя его прямо; конструкция с «зачем» естественна в современном русском.
- source_word: מִשְׁכָּבְךָ
  choice: твою постель
  rationale: Существительное обозначает место, где лежат или спят; здесь речь о конкретной постели должника, а не об абстрактном залоге.
- source_word: מִתַּחְתֶּיךָ
  choice: прямо из-под тебя
  rationale: Сохраняет яркий конкретный образ лишения последней постели; «прямо» естественно подчёркивает присущую еврейскому выражению наглядность, не меняя смысла.
