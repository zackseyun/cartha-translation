  text: 'Ленивец говорит: «На улице лев! На площадях[a] меня убьют!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на улицах»; еврейское слово может обозначать широкие улицы, площади или другие открытые общественные места.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  choice: ленивец
  rationale: В Притчах это существительное обозначает человека, для которого лень стала устойчивой чертой; «ленивец» естественно и ёмко передаёт типический образ.
- source_word: אֲרִי
  choice: лев
  rationale: Прямое лексическое значение; в ближайшем контексте нет основания понимать слово метафорически.
- source_word: בַחוּץ
  choice: на улице
  rationale: Слово указывает на пространство вне дома. В этой реплике «на улице» звучит естественнее русского «снаружи» и сохраняет противопоставление дому.
- source_word: בְּתוֹךְ רְחֹבוֹת
  choice: среди площадей
  rationale: בְּתוֹךְ передаёт нахождение внутри или среди чего-либо, а רְחֹבוֹת может обозначать широкие городские пространства, площади или улицы. Формулировка сохраняет образ публичных открытых мест и не сводит значение только к улицам.
- source_word: אֵרָצֵחַ
  choice: меня убьют
  rationale: Нифаль имперфекта רצח выражает насильственное лишение жизни в пассивном значении. Русское «меня убьют» естественно передаёт эту мысль, не добавляя юридического оттенка слова «убьют как жертву убийства» или архаичности.
