base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/012.yaml
  text: The eyes of Yahweh preserve knowledge[c][b][a], but he overturns the words of the treacherous.
translation:
  language: ru
  text: Глаза Яхве хранят знание[a], но слова вероломного Он сводит на нет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оберегают знание». Еврейский глагол может означать «стеречь», «хранить» или «сохранять».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ниспровергает» или «искажает». Еврейский глагол буквально может означать «делать кривым» и по контексту — подрывать или сводить на нет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יְהוָה
  choice: Глаза Яхве
  rationale: Сохраняется антропоморфный образ Божьего бдительного взора, а тетраграмматон передаётся личным именем «Яхве».
- source_word: נָצְרוּ
  choice: хранят
  rationale: Глагол נצר означает «стеречь, хранить, оберегать»; «хранят» естественно сочетается со «знанием» и сохраняет смысл защиты и сохранения.
- source_word: דָעַת
  choice: знание
  rationale: В литературе мудрости דַּעַת обычно обозначает знание; буквальный эквивалент не сужает значение до одного лишь понимания.
- source_word: וַיְסַלֵּף
  choice: обращает вспять
  rationale: Сלף может означать искривление, ниспровержение или расстройство. В сочетании со «словами» выражение передаёт то, что Яхве лишает силы и расстраивает речь вероломного, не представляя Бога искажающим её содержание.
- source_word: דִּבְרֵי
  choice: слова
  rationale: Хотя דָּבָר может также означать «дело», здесь «слова» — прямое и контекстуально уместное соответствие.
- source_word: בֹגֵד
  choice: вероломного
  rationale: Причастие בֹּגֵד обозначает того, кто поступает предательски или неверно; субстантивированное «вероломного» передаёт это без уточнения вида неверности.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует предоставленному редакционному решению.
- issue: Характер Божьего действия в וַיְסַלֵּף
  choice: Он обращает вспять слова вероломного
  alternative: Он искажает слова вероломного; Он ниспровергает слова вероломного
  rationale: Формулировка сохраняет активное Божье противодействие вероломной речи, но не создаёт нежелательного впечатления, будто Бог фальсифицирует чьи-либо слова.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Сохранён образ «глаз Яхве» и противопоставление двух полустиший. Местоимение «Он» написано с прописной буквы по принятой русской библейской издательской традиции.
