source:
  edition: WLC
  text: עָשִׁ֣יר וָ/רָ֣שׁ נִפְגָּ֑שׁוּ עֹשֵׂ֖ה כֻלָּ֣/ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/002.yaml
  text: The rich and the poor meet together[a]; Yahweh is the maker of them all.
translation:
  language: ru
  text: Богатый и бедный встречаются[a]; Яхве — Создатель их обоих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явной передачей подразумеваемого смысла: «У богатого и бедного есть общее: Яхве — Создатель их обоих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: богатый
  rationale: Субстантивированное прилагательное обозначает богатого человека как представителя соответствующей общественной группы; единственное число сохраняет форму и лаконизм еврейского текста.
- source_word: וָרָשׁ
  choice: и бедный
  rationale: Парная социальная противоположность слову «богатый»; «бедный» естественно передаёт нуждающегося человека без усиления смысла.
- source_word: נִפְגָּשׁוּ
  choice: встречаются
  rationale: Нифаль глагола פגשׁ имеет взаимное значение «встречаться»; этот вариант сохраняет прямой образ исходного текста и не заменяет его толкованием.
- source_word: עֹשֵׂה
  choice: Создатель
  rationale: Субстантивированное причастие Qal буквально означает «тот, кто делает/создаёт»; именная конструкция сохраняет причастную силу и естественно звучит по-русски.
- source_word: כֻלָּם
  choice: их обоих
  rationale: Местоименная форма охватывает упомянутых богатого и бедного; «обоих» ясно выражает совокупность двух названных сторон.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
theological_decisions:
- issue: Смысл первой строки притчи
  choice: Сохранён конкретный образ встречи богатого и бедного, который в контексте второй строки указывает на их общее положение перед единым Создателем, не уточняя место или социальную программу.
  alternative: '«У богатого и бедного есть общее: Яхве создал их обоих».'
  rationale: Глагол прежде всего означает «встречаться», но в афористическом контексте может подразумевать общность. Основной текст сохраняет образ и неоднозначность, а более истолковывающий вариант вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная форма притчи. Слово «Создатель» написано с прописной буквы как обозначение Бога в данном контексте.
