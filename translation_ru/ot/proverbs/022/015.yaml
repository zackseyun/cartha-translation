  text: אִ֭וֶּלֶת קְשׁוּרָ֣ה בְ/לֶב נָ֑עַר שֵׁ֥בֶט מ֝וּסָ֗ר יַרְחִיקֶ֥/נָּה מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/015.yaml
  text: Folly is bound up in the heart of a boy[a]; the rod of discipline will drive it far from him.
translation:
  language: ru
  text: Глупость привязана в сердце мальчика[a]; розга исправления прогонит её далеко от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юноши».'
    reason: Еврейское נָעַר может обозначать как мальчика, так и юношу.
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: В литературе мудрости слово обозначает не просто недостаток ума, а нравственное безрассудство. «Глупость» сохраняет краткость и привычную для Притчей формулировку.
- source_word: קְשׁוּרָה
  choice: привязана
  rationale: Страдательное причастие передаёт представление о чём-то тесно связанном, прочно прикреплённом. «Привязана» естественно сочетается с образом сердца и не усиливает текст сверх оригинала.
- source_word: בְלֶב
  choice: к сердцу
  rationale: Еврейское «сердце» охватывает мысли, волю и желания. Сохранение исходного образа предпочтительнее пояснительных замен вроде «в сознании».
- source_word: נָעַר
  choice: мальчика
  rationale: Слово может обозначать ребёнка, подростка или юношу; форма мужского рода и контекст воспитательного воздействия позволяют естественно перевести его как «мальчик», сохранив в сноске более широкую возможность «юноша».
- source_word: שֵׁבֶט
  choice: розга
  rationale: Здесь назван конкретный предмет исправительного воздействия. «Розга» в современном русском ясно передаёт этот смысл и не смягчает образ до отвлечённого «воспитания».
- source_word: מוּסָר
  choice: наставления
  rationale: Слово включает обучение, воспитание и исправительное воздействие. «Наставление» сохраняет формирующую цель, не сводя значение только к наказанию.
- source_word: יַרְחִיקֶנָּה
  choice: прогонит её далеко
  rationale: Каузативная форма означает «сделает далёкой, удалит». «Прогонит далеко» сохраняет силу действия и яркость образа.
- source_word: מִמֶּנּוּ
  choice: от него
  rationale: Предлог с местоименным суффиксом обозначает удаление глупости от мальчика; русский оборот прямо передаёт это отношение.
theological_decisions:
- issue: Следует ли смягчить образ телесного исправления
  choice: Сохранить конкретное выражение «розга наставления».
  alternative: Передать отвлечённо как «воспитание» или «исправление», не упоминая розгу.
  rationale: В еврейском тексте прямо стоит שֵׁבֶט — «розга, жезл». Перевод сохраняет неудобную для современного читателя конкретность, не превращая отдельную притчу в более широкое нормативное утверждение.
- issue: Передача мужского существительного נָעַר
  choice: Перевести как «мальчик».
  alternative: «Ребёнок» или «юноша».
  rationale: Мужской род и вероятный референт сохранены в основном тексте; лексическая широта слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский с краткой, афористичной структурой. Сохранены метафоры сердца и розги, а также конкретный мужской референт. Союз «но» естественно выражает смысловое противопоставление двух половин притчи.
