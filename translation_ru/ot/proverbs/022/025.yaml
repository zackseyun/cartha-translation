  text: פֶּן תֶּאֱלַ֥ף ארחת/ו וְ/לָקַחְתָּ֖ מוֹקֵ֣שׁ לְ/נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/025.yaml
  text: lest you learn his ways and take a snare for yourself[a][b].
translation:
  language: ru
  text: чтобы тебе не перенять его повадки[a] и не попасть в западню[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его путь» или «его образ жизни». Еврейское слово стоит в единственном числе и может обозначать привычное поведение человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и не взять западню для своей жизни (души)». Еврейское нэфэш здесь, вероятно, обозначает самого человека или его жизнь, а не содержит специального утверждения о природе души.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: чтобы… не
  rationale: Частица вводит предостережение о нежелательном результате. В связи с предыдущим стихом русская конструкция «чтобы… не» естественно передаёт эту зависимость и предостерегающую силу.
- source_word: תֶּאֱלַף
  choice: перенять
  rationale: Глагол означает «научиться, приучиться». В данном контексте речь о том, что тесное общение приводит к усвоению чужого поведения; «перенять» ясно выражает эту мысль.
- source_word: אָרְחֹתוֹ
  choice: его повадки
  rationale: Буквально — «его путь», то есть привычный образ поведения. «Повадки» естественно звучит применительно к поведению вспыльчивого человека из предыдущего стиха, а буквальный образ сохранён в примечании.
- source_word: וְלָקַחְתָּ
  choice: и не попасть
  rationale: Буквальное «взять западню себе» по-русски неестественно. В сочетании с «западней» глагол «попасть» ясно передаёт смысл навлечённой на себя опасности, сохраняя сам образ ловушки.
- source_word: מוֹקֵשׁ
  choice: западню
  rationale: Слово обозначает ловушку или западню и часто метафорически указывает на гибельную опасность. «Западня» сохраняет яркий образ еврейского текста.
- source_word: לְנַפְשֶׁךָ
  choice: попасть в западню
  rationale: Здесь נֶפֶשׁ, вероятнее всего, обозначает самого человека или его жизнь, а не «душу» как специальное богословское понятие. Русская возвратная по смыслу конструкция передаёт личную угрозу без искусственной буквальности; варианты отмечены в сноске.
