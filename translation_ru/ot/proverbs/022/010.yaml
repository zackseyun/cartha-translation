  text: גָּ֣רֵֽשׁ לֵ֭ץ וְ/יֵצֵ֣א מָד֑וֹן וְ֝/יִשְׁבֹּ֗ת דִּ֣ין וְ/קָלֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/010.yaml
  text: Drive out a scoffer[a], and strife will go out[b]; judgment and disgrace will cease.
translation:
  language: ru
  text: Прогони насмешника[a] — и уйдёт раздор; прекратятся спор[b] и позор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глумливца». Еврейское לֵץ — характерное для литературы мудрости обозначение человека, который надменно высмеивает наставление и мудрость.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское דִּין здесь может означать спор или тяжбу; в других контекстах оно также означает суд или судебное решение.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: Прогони
  rationale: Повелительная форма от גרשׁ означает принудительно удалить, изгнать. «Прогони» естественно звучит по-русски и сохраняет решительный характер действия.
- source_word: לֵץ
  choice: насмешника
  rationale: В литературе мудрости это человек, который надменно высмеивает наставление и отвергает мудрость. «Насмешник» — ясное современное соответствие; особый нравственный оттенок пояснён в сноске.
- source_word: מָדוֹן
  choice: раздор
  rationale: Слово обозначает распрю, вражду или препирательство. «Раздор» кратко передаёт вызванный насмешником разлад и хорошо сочетается с глаголом «уйдёт».
- source_word: וְיֵצֵא
  choice: и уйдёт
  rationale: Имперфект после повеления выражает ожидаемое следствие. Будущее время по-русски естественно передаёт эту связь.
- source_word: וְיִשְׁבֹּת
  choice: прекратятся
  rationale: Глагол שׁבת означает прекращение или завершение. Форма множественного числа согласована с однородными подлежащими «спор и позор».
- source_word: דִּין
  choice: спор
  rationale: В данном параллелизме слово, способное также означать суд, судебное решение или тяжбу, вероятнее всего относится к препирательству либо тяжбе. «Спор» сохраняет конфликтный смысл, а более широкий диапазон отмечен в сноске.
- source_word: קָלוֹן
  choice: позор
  rationale: Слово обозначает бесчестье, унижение или позор. «Позор» — краткое и естественное соответствие в контексте общественных последствий раздора.
theological_decisions:
- issue: Значение דִּין в параллели с מָדוֹן
  choice: спор
  alternative: суд / судебная тяжба
  rationale: Контекст изгнания насмешника и прекращения раздора поддерживает значение межличностного или правового спора, но юридический оттенок еврейского слова не исключён и потому сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Тире подчёркивает причинно-следственную связь, а параллелизм двух полустиший сохранён без архаизации.
