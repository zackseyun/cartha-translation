  text: עֹ֣שֵֽׁק דָּ֭ל לְ/הַרְבּ֣וֹת ל֑/וֹ נֹתֵ֥ן לְ֝/עָשִׁ֗יר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/016.yaml
  text: One who oppresses the poor to increase his own wealth[a], or gives to the rich[b], will come only to poverty.
translation:
  language: ru
  text: Кто притесняет бедного, чтобы умножить своё богатство[a], или даёт богатому, тот в итоге окажется в нужде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Кто притесняет бедного, чтобы обогатиться, и даёт богатому, в итоге окажется в нужде». Древнееврейский текст допускает понимание как двух сопоставимых поступков или как единого образа поведения.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «к недостатку», «к бедности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׁק
  choice: кто притесняет
  rationale: Субстантивированное причастие породы qal обозначает человека, который притесняет или эксплуатирует другого; конструкция «кто притесняет» естественно передаёт обобщённый характер изречения.
- source_word: דָּל
  choice: бедного
  rationale: В данном экономическом контексте דָּל прежде всего означает бедного, малоимущего человека, хотя слово может также указывать на слабого или незнатного.
- source_word: לְהַרְבּוֹת לוֹ
  choice: чтобы умножить своё богатство
  rationale: Инфинитив רבה с предлогом ל выражает цель, а местоименный суффикс — выгоду для самого действующего лица; подразумеваемый объект уточнён из экономического контекста.
- source_word: נֹתֵן לְעָשִׁיר
  choice: или даёт богатому
  rationale: Второе причастие образует сжатую параллель первому. Союз «или» представляет два сопоставимых саморазрушительных поступка, не скрывая возможности совокупного прочтения, указанного в сноске.
- source_word: אַךְ
  choice: лишь
  rationale: 'Частица выражает ограничение и подчёркивает итог: результатом будет не что иное, как нужда.'
- source_word: מַחְסוֹר
  choice: нужда
  rationale: Слово означает недостаток, нужду, лишение или бедность. «Нужда» сохраняет лексическую широту и естественно звучит как итог в русском изречении.
theological_decisions:
- issue: Синтаксическая связь двух причастий
  choice: 'Два сопоставимых поступка: притеснение бедного ради собственной выгоды или дар богатому; оба ведут к нужде.'
  alternative: Один человек и притесняет бедного ради обогащения, и даёт богатому — к одной лишь нужде.
  rationale: Древнееврейская фраза предельно сжата и не содержит явного союза, поэтому допускает как перечислительное, так и совокупное понимание. В основном тексте выбран естественный для русского языка вариант с «или», а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная конструкция сохранена. Лексика понятна широкому читателю и остаётся стилистически достойной. Неоднозначная связь частей не разрешена безоговорочно, а вынесена в сноску.
