source:
  edition: WLC
  text: עָר֤וּם רָאָ֣ה רָעָ֣ה ו/יסתר וּ֝/פְתָיִ֗ים עָבְר֥וּ וְֽ/נֶעֱנָֽשׁוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/003.yaml
  text: A prudent man sees danger and hides himself[b][a], but the simple pass on and suffer for it.
translation:
  language: ru
  text: Благоразумный видит опасность[a] и укрывается, а неопытные идут дальше и расплачиваются за это[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беду», «зло» или «несчастье». Еврейское слово может обозначать как нравственное зло, так и бедствие; здесь речь идёт об угрозе, которую распознаёт благоразумный.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бывают наказаны». Еврейское слово может подчёркивать наказание, но также допускает смысл претерпевания последствий избранного пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: благоразумный
  rationale: В контексте Притч слово обозначает положительное качество — осмотрительность и здравую проницательность, а не коварство. Субстантивированное прилагательное естественно звучит по-русски и сохраняет обобщённый характер изречения.
- source_word: רָאָה
  choice: видит
  rationale: Форма совершенного вида в общеистинном изречении передаёт типичное действие; настоящее время естественно для русской пословичной речи и сохраняет образ распознавания того, что впереди.
- source_word: רָעָה
  choice: опасность
  rationale: Существительное может означать зло, беду или несчастье; здесь оно обозначает угрожающую ситуацию, которую благоразумный замечает и избегает. Альтернативы отмечены в сноске.
- source_word: ו/יסתר
  choice: укрывается
  rationale: Нифаль передаёт уход в укрытие ради защиты. «Укрывается» естественно и точно выражает этот образ без лишнего уточнения.
- source_word: פְתָיִם
  choice: неопытные
  rationale: Это характерное для литературы мудрости обозначение людей наивных, неискушённых и лишённых рассудительности. «Неопытные» понятно современному читателю и не создаёт ложной ассоциации с умственной неполноценностью.
- source_word: עָבְרוּ
  choice: идут дальше
  rationale: Глагол описывает продолжение пути без попытки избежать замеченной угрозы. Выбор сохраняет пространственный образ и ясно передаёт контраст с укрывающимся благоразумным.
- source_word: וְנֶעֱנָשׁוּ
  choice: расплачиваются за это
  rationale: Нифаль от ענש допускает значение наказания или претерпевания последствий. Эта формулировка сохраняет обе смысловые стороны и не решает без основания, идёт ли речь о судебной каре или о естественном результате неразумия.
theological_decisions:
- issue: Характер последствий, выраженных וְנֶעֱנָשׁוּ
  choice: расплачиваются за это
  alternative: бывают наказаны
  rationale: Исходная форма допускает как наказание, так и более общее несение ущерба или последствий. Основной текст сохраняет эту напряжённость, а сноска сообщает более узкую альтернативу.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Лексика понятна широкому читателю; сохранены противопоставление единственного и множественного числа и образ движения навстречу опасности.
