id: PRO.22.6
reference: Proverbs 22:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: חֲנֹ֣ךְ לַ֭/נַּעַר עַל פִּ֣י דַרְכּ֑/וֹ גַּ֥ם כִּֽי יַ֝זְקִ֗ין לֹֽא יָס֥וּר מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/006.yaml
  text: Train up a boy according to his way[b][a]; even when he grows old he will not turn from it.
translation:
  language: ru
  text: Наставляй юношу сообразно его пути[a][b]; даже когда он состарится, он не сойдёт с него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сообразно его пути». Возможно и более истолковывающее понимание: «по пути, по которому ему следует идти».'
    reason: alternative_reading
  - marker: b
    text: «Юноша» передаёт еврейское слово мужского рода, употреблённое здесь обобщённо о молодом человеке. Пословица выражает общее правило мудрости, а не обещание, не допускающее исключений.
    reason: cultural_note
lexical_decisions:
- source_word: חֲנֹךְ
  choice: Наставляй
  rationale: Глагол חנך может означать посвящение или введение во что-либо, но в контексте воспитательной мудрости естественно передаёт целенаправленное формирование и обучение юного человека. «Наставляй» сохраняет педагогический смысл и звучит естественно в современном литературном русском.
- source_word: לַנַּעַר
  choice: юношу
  rationale: נַעַר обозначает мальчика, отрока или молодого человека. «Юношу» сохраняет мужской род и обобщённое единственное число еврейского текста, не сужая значение до маленького ребёнка.
- source_word: עַל פִּי
  choice: сообразно
  rationale: Идиома עַל־פִּי означает «согласно», «в соответствии с». «Сообразно» позволяет естественно связать её с выражением «его пути», не воспроизводя непонятную буквальность «по устам».
- source_word: דַרְכּוֹ
  choice: его пути
  rationale: Еврейский текст буквально говорит «его путь». Перевод сохраняет эту формулировку и не добавляет отсутствующего в тексте определения «должный», оставляя открытыми возможные оттенки смысла.
- source_word: גַּם כִּי
  choice: даже когда
  rationale: Сочетание имеет уступительно-временной смысл. «Даже когда» естественно показывает, что речь идёт о сохранении пути и в старости.
- source_word: יַזְקִין
  choice: он состарится
  rationale: Форма от זקן обозначает достижение старости. «Состарится» кратко и точно передаёт этот процесс.
- source_word: לֹא יָסוּר
  choice: он не сойдёт
  rationale: סור означает сворачивать, отходить или уклоняться. В сочетании с образом пути «не сойдёт» ясно и естественно сохраняет метафору оригинала.
- source_word: מִמֶּנָּה
  choice: с него
  rationale: Местоименный суффикс отсылает к слову דֶּרֶךְ («путь»). Русское «с него» согласуется с мужским родом слова «путь» и завершает метафору.
theological_decisions:
- issue: Толкование выражения «его путь»
  choice: В основном тексте сохранено буквальное «его путь».
  alternative: «путь, по которому ему следует идти» или путь, соответствующий его особенностям и возрасту
  rationale: Фраза עַל־פִּי דַרְכּוֹ допускает несколько толкований. Добавление «по которому ему следует идти» сделало бы явным смысл, которого нет в формулировке оригинала; поэтому неоднозначность сохранена, а распространённое толкование указано в сноске.
- issue: Характер утверждения о результате воспитания
  choice: Сохранена категоричная форма мудрого изречения, но в сноске пояснён его жанровый характер.
  alternative: 'Переформулировать как вероятностное утверждение: «скорее всего, не сойдёт».'
  rationale: Пословица формулирует общее правило мудрости в категоричной форме. Вносить в основной текст слова вероятности означало бы ослабить его грамматику, однако читателю полезно пояснить, что это не безусловное обещание для каждого отдельного случая.
translation_notes:
  register: Современный литературный русский с достоинством афористической речи. Формулировка сохраняет метафору пути и смысловую открытость еврейского текста; повтор подлежащего «он» во второй части обеспечивает ясность.
