  text: Уста чужих женщин[a] — глубокая яма; тот, на кого разгневан Яхве, упадёт туда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иноземных женщин», «чужих женщин» или «прелюбодейных женщин». В книге Притчей это еврейское слово часто относится к женщинам, связь с которыми считается недозволенной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּחָה עֲמֻקָּה
  choice: глубокая яма
  rationale: Сохраняет конкретный образ глубокой ямы как места опасности и западни; «яма» естественнее в современном русском, чем «ров».
- source_word: פִּי
  choice: уста
  rationale: Передаёт буквальный образ «рта», подразумевающий соблазняющую речь, не заменяя сам образ его толкованием. «Уста» уместны в поэтическом регистре притчи.
- source_word: זָרוֹת
  choice: запретных женщин
  rationale: В контексте Притчей слово обычно указывает на женщин, сексуальная связь с которыми недозволенна, а не просто на иноземок. Множественное число оригинала сохранено.
- source_word: זְעוּם יְהוָה
  choice: тот, на кого разгневан Яхве
  rationale: Пассивное причастие обозначает человека как объект негодования Яхве. Русская конструкция естественно передаёт это состояние, не усиливая смысл до прямого «проклят».
- source_word: יפול שָׁם
  choice: упадёт туда
  rationale: Сохраняет образ падения и указательное наречие, отсылающее к глубокой яме.
theological_decisions:
- issue: Значение זָרוֹת в литературе мудрости
  choice: запретных женщин
  alternative: чужих, посторонних, иноземных или прелюбодейных женщин
  rationale: Выбранный вариант передаёт широкую категорию недозволенной половой связи, не сводя значение исключительно к этнической принадлежности или только к прелюбодеянию.
- issue: Смысл выражения זְעוּם יְהוָה
  choice: тот, на кого разгневан Яхве
  alternative: проклятый Яхве; ненавистный Яхве; осуждённый Яхве
  rationale: Так сохраняется смысл пребывания под Божьим негодованием без неоправданного уточнения характера приговора. Тетраграмматон передан личным именем «Яхве».
translation_notes:
  register: Современный литературный русский с кратким, образным синтаксисом притчи. Слово «уста» сохраняет поэтический библейский образ, а остальная лексика остаётся понятной обычному современному читателю.
