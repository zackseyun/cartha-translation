  yaml_path: translation/ot/proverbs/022/004.yaml
  text: The reward of humility and the fear of Yahweh is wealth and honor and life[a].
translation:
  language: ru
  text: Награда за смирение и страх перед Яхве — богатство, честь и жизнь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, что менее вероятно: «Награда за смирение — страх перед Яхве, богатство, честь и жизнь».'
    reason: Альтернативное понимание синтаксической связи между «смирением» и «страхом перед Яхве».
lexical_decisions:
- source_word: עֵקֶב
  choice: награда за
  rationale: Слово обозначает следствие, результат или воздаяние. В краткой форме пословицы «награда за» естественно передаёт и результативный, и воздающий оттенок.
- source_word: עֲנָוָה
  choice: смирение
  rationale: Современный и понятный эквивалент со значением скромности и отсутствия высокомерия; не вносит оттенка пассивности, возможного у слова «кротость».
- source_word: יִרְאַת יְהוָה
  choice: страх перед Яхве
  rationale: Сохраняет устойчивое богословски значимое выражение литературы мудрости, не сводя его лишь к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Прямой и естественный современный эквивалент материального достатка.
- source_word: כָבוֹד
  choice: честь
  rationale: В данном контексте речь идёт о почёте и общественном уважении, а не о божественной славе.
- source_word: חַיִּים
  choice: жизнь
  rationale: Форма множественного числа обычно выражает абстрактное понятие жизни; уточнение «долгая» отсутствует в еврейском тексте.
theological_decisions:
- issue: Синтаксическая связь между «смирением» и «страхом перед Яхве»
  choice: Оба понятия понимаются как связанные качества, наградой за которые служат богатство, честь и жизнь.
  alternative: «Награда за смирение — страх перед Яхве, богатство, честь и жизнь».
  rationale: Сжатый еврейский синтаксис допускает оба прочтения. Основной вариант лучше соответствует естественному построению изречения и заключительной триаде благ, а менее вероятный аппозитивный вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная форма, соответствующая жанру Притч. Личное имя יְהוָה передано как «Яхве».
