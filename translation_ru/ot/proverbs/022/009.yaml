  text: Щедрый человек[a] будет благословлён, ибо он даёт бедному от своего хлеба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имеющий добрый глаз»; древнееврейская идиома, обозначающая щедрого человека.'
