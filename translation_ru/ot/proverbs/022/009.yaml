lexical_decisions:
- source_word: טוֹב עַיִן
  choice: у кого добрый глаз
  rationale: Сохранена древнееврейская метафора «добрый глаз», обозначающая щедрого человека; её идиоматический смысл разъяснён в сноске.
- source_word: יְבֹרָךְ
  choice: будет благословлён
  rationale: Страдательная форма передана прямо; будущее время естественно выражает закономерный итог в изречении.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предыдущего утверждения.
- source_word: נָתַן
  choice: делится
  rationale: Хотя в древнееврейском употреблена перфектная форма, в контексте притчи она описывает характерное действие. Настоящее время передаёт обычное поведение, а «делится» естественно выражает передачу части своего пропитания.
- source_word: מִלַּחְמוֹ
  choice: своим хлебом
  rationale: Сохранён конкретный образ хлеба; в сочетании с глаголом «делится» естественно передана частичная отдача из собственного запаса.
- source_word: לַדָּל
  choice: с бедным
  rationale: Слово обозначает бедного, нуждающегося или материально слабого человека; «бедный» здесь наиболее прямой русский эквивалент.
