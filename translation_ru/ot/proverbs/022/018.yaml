  text: כִּֽי נָ֭עִים כִּֽי תִשְׁמְרֵ֣/ם בְּ/בִטְנֶ֑/ךָ יִכֹּ֥נוּ יַ֝חְדָּ֗ו עַל שְׂפָתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/018.yaml
  text: For it is pleasant if you keep them within you[b][a], if they are established together on your lips.
translation:
  language: ru
  text: Ибо приятно, если ты хранишь их в себе[a], если все они вместе будут у тебя на устах, готовые к произнесению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твоём чреве» — еврейское обозначение внутреннего человека.'
    reason: cultural_note
  - marker: b
    text: 'Или: «если все они вместе прочно утвердятся на твоих устах». Глагол может подчёркивать как твёрдую установленность, так и готовность к произнесению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי נָעִים
  choice: Ведь приятно
  rationale: Первое כִּי вводит обоснование предшествующего наставления, а נָעִים обозначает нечто приятное, доставляющее радость.
- source_word: כִּי
  choice: если
  rationale: Второе כִּי естественно понять как вводящее условие; это сохраняет синтаксическую связь с утверждением «приятно».
- source_word: תִשְׁמְרֵם
  choice: ты сохранишь их
  rationale: Глагол שׁמר здесь говорит об удержании и бережном хранении наставлений внутри себя; «сохранишь» передаёт это естественно по-русски.
- source_word: בְּבִטְנֶךָ
  choice: в себе
  rationale: Буквально «в твоём чреве»; в данном контексте речь о внутреннем человеке. «В себе» понятно современному читателю и не подменяет образ понятием «сердце».
- source_word: יִכֹּנוּ
  choice: будут готовы
  rationale: Нифаль от כון может обозначать как утверждённость, так и готовность. В сочетании «на устах» значение готовности к произнесению звучит естественно, при этом альтернативное понимание отмечено в сноске.
- source_word: יַחְדָּו
  choice: все они
  rationale: Буквально «вместе»; в русском обороте «все они будут готовы» передаётся совокупность наставлений без неестественного «готовы вместе».
- source_word: עַל שְׂפָתֶיךָ
  choice: у тебя на устах
  rationale: Русский устойчивый оборот «быть на устах» сохраняет образ еврейского текста и указывает на готовность произнести усвоенные слова.
theological_decisions:
- issue: Связь двух глагольных частей с נָעִים
  choice: 'Обе части переданы как условия того, что приятно: «если… если…»'
  alternative: 'Вторая часть могла бы быть передана как следствие: «и они будут…»'
  rationale: Повтор כִּי допускает условительное прочтение и подчёркивает обе стороны усвоения мудрых слов — внутреннее хранение и устное выражение; при этом стих не превращён в категорическое обещание.
- issue: Значение יִכֹּנוּ
  choice: будут готовы
  alternative: утвердятся / будут прочно утверждены
  rationale: Контекст «на устах» поддерживает готовность к произнесению, но корень כון сохраняет оттенок твёрдой установленности; эта неоднозначность явно отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным библейской книге мудрости. Сохранены параллелизм и образ уст; буквальное «чрево» вынесено в сноску как культурно-языковое пояснение.
