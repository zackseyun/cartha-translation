base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/029.yaml
  text: Do you see a man skillful in his work? He will stand before kings[b][a]; he will not stand before obscure men.
translation:
  language: ru
  text: Видел ли ты человека, искусного в своём деле?[a] Он будет стоять перед царями, не будет стоять перед людьми безвестными.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расторопного в своём деле». Еврейское слово может подчёркивать быстроту и готовность, а в данном контексте — также умелость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед тёмными (то есть безвестными)». Здесь имеются в виду люди без известности или общественного веса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: Видел ли ты
  rationale: Форма qal перфекта 2-го лица ед. числа вводит риторическое наблюдение. Русское «Видел ли ты» естественно сохраняет как форму перфекта, так и вопросительный характер изречения.
- source_word: אִישׁ
  choice: человека
  rationale: Передаёт единичного представителя рода человеческого без ненужного сужения смысла до обозначения пола; согласование остаётся в мужском роде.
- source_word: מָהִיר
  choice: искусного
  rationale: В сочетании с מְלָאכָה прилагательное указывает на расторопность, умелость и профессиональную пригодность, а не только на скорость. Возможная смысловая грань «расторопного» отмечена в сноске.
- source_word: בִּמְלַאכְתּוֹ
  choice: в своём деле
  rationale: Широкое выражение охватывает ремесло, занятие и труд, не ограничивая изречение физической работой.
- source_word: לִפְנֵי מְלָכִים
  choice: перед царями
  rationale: Сохраняет древнееврейский образ предстояния при дворе или на службе у правителей.
- source_word: יִתְיַצָּב
  choice: будет стоять
  rationale: Hitpael от יצב означает занять место или предстать; буквальный образ естественно звучит по-русски и сохраняется в обеих параллельных строках.
- source_word: בַּל
  choice: не будет
  rationale: Поэтическое отрицание передано в соответствии с будущей формой параллельного глагола.
- source_word: חֲשֻׁכִּים
  choice: людьми незнатными
  rationale: Редкое слово буквально связано с темнотой или неизвестностью, но здесь обозначает людей, лишённых общественной известности и высокого положения. «Незнатными» ясно передаёт социальный контраст с царями, не приписывая им нравственной порочности.
