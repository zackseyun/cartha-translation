  text: Разве не написал я для тебя тридцать изречений о советах и знании?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве не написал я тебе прежде о советах и знании?» Еврейское слово, традиционно переводимое как «прежде», здесь трудно для истолкования; многие понимают его как «тридцать», возможно, имея в виду собрание из тридцати изречений.'
    reason: alternative_reading
  - marker: b
    text: В некоторых традиционных переводах вместо «тридцать изречений» стоит «превосходные наставления». Такой перевод отражает иное понимание трудного еврейского выражения.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: כָתַבְתִּי
  choice: написал я
  rationale: Форма qal, перфект, 1-е лицо единственного числа; русский совершенный вид передаёт завершённое действие.
- source_word: לְךָ
  choice: для тебя
  rationale: Предлог לְ здесь естественно понимать как указание на адресата и его пользу в контексте наставления.
- source_word: שלשום
  choice: тридцать изречений
  rationale: Еврейское выражение текстуально и лексически затруднительно. Многие связывают его с числом «тридцать» и видят здесь указание на собрание из тридцати изречений; существительное «изречений» уточняется по литературному контексту. Традиционное понимание «прежде» сохранено в сноске.
- source_word: בְּמוֹעֵצוֹת
  choice: содержащих советы
  rationale: Передаёт значение עֵצָה — «совет, наставление, замысел» — и непростой предлог בְּ естественным русским оборотом без традиционного, но лексически менее прямого значения «превосходные вещи».
- source_word: וָדָעַת
  choice: и знание
  rationale: דַּעַת обычно означает «знание»; перевод сохраняет его сочинительную связь с «советами» и лексику литературы мудрости.
