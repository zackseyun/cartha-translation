  text: Do not befriend a man given to anger[b][a], and do not go with a man of wrath.
translation:
  language: ru
  text: Не дружи со вспыльчивым человеком[a] и не водись с гневливым человеком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сближайся с человеком, склонным к гневу».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не приходи с человеком гневов»; по смыслу — не присоединяйся к нему и не держись его общества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְרַע
  choice: дружи
  rationale: Глагол רעה в хитпаэле обозначает близкое общение или вступление в дружеские отношения; «дружи» естественно передаёт эту силу в отрицательном повелении.
- source_word: בַּעַל אָף
  choice: со вспыльчивым человеком
  rationale: Сочетание בעל с существительным описывает человека, которому свойственно названное качество; אף здесь означает гнев. «Вспыльчивый человек» ясно и естественно передаёт характеристику.
- source_word: אִישׁ חֵמוֹת
  choice: с человеком гневливым
  rationale: Выражение описывает человека, отмеченного сильным или частым гневом. Постпозиция прилагательного сохраняет достоинство и поэтический параллелизм, не делая русский текст архаичным.
- source_word: תָבֽוֹא
  choice: водись
  rationale: Хотя בוא буквально значит «приходить/входить», в данном параллельном контексте речь идёт о присоединении к человеку и постоянном общении с ним; русское «водиться с кем-либо» передаёт этот смысл идиоматично.
- source_word: אַל ... לֹא
  choice: Не ... и не
  rationale: Две параллельные отрицательные формы переданы двумя явными запретами, как в еврейском тексте.
- source_word: אִישׁ
  choice: человеком
  rationale: В контексте общей житейской максимы «человек» естественно обозначает любого представителя соответствующего типа, не изменяя предмет предостережения.
