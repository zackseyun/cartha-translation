id: PRO.22.5
reference: Proverbs 22:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: צִנִּ֣ים פַּ֭חִים בְּ/דֶ֣רֶךְ עִקֵּ֑שׁ שׁוֹמֵ֥ר נַ֝פְשׁ֗/וֹ יִרְחַ֥ק מֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/005.yaml
  text: Thorns and snares are in the way of the crooked[c][b][a]; he who guards his life keeps far from them.
translation:
  language: ru
  text: На пути коварного — колючки и западни[a]; кто бережёт свою жизнь[b], тот держится от них подальше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ловушки» или «силки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свою душу»; здесь имеется в виду сохранение собственной жизни, самого себя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנִּים
  choice: колючки
  rationale: Слово обозначает острые колючие препятствия; «колючки» естественно передаёт конкретный образ опасностей на пути.
- source_word: פַּחִים
  choice: западни
  rationale: Существительное означает ловушки или силки. «Западни» сохраняет образ скрытой опасности и хорошо сочетается с «колючками».
- source_word: בְּדֶרֶךְ
  choice: на пути
  rationale: דֶּרֶךְ обозначает дорогу, путь или образ жизни. «На пути» сохраняет пространственный образ и допускает нравственный переносный смысл.
- source_word: עִקֵּשׁ
  choice: коварного
  rationale: Прилагательное описывает нравственно искривлённого, превратного или лукавого человека. «Коварный» звучит естественно в современном русском и передаёт его порочную, ненадёжную направленность.
- source_word: שׁוֹמֵר נַפְשׁוֹ
  choice: кто бережёт свою жизнь
  rationale: Причастная конструкция выражает общее правило. נֶפֶשׁ здесь указывает на жизнь или самого человека в контексте сохранения от опасности; «бережёт свою жизнь» ясно передаёт этот смысл.
- source_word: יִרְחַק
  choice: держится подальше
  rationale: Имперфект выражает обычный результат осмотрительного поведения; эта русская формулировка передаёт сознательное удаление и звучит как общее изречение.
- source_word: מֵהֶם
  choice: от них
  rationale: Местоимение во множественном числе естественно относится к колючкам и западням.
theological_decisions:
- issue: Родовое значение формы мужского рода в литературе мудрости
  choice: кто бережёт свою жизнь
  alternative: тот, кто бережёт свою жизнь / берегущий свою жизнь
  rationale: Еврейское причастие мужского рода выражает представительного человека вообще. Русское «кто» естественно сохраняет универсальность пословицы без ограничения смысла мужчинами.
- issue: Значение נֶפֶשׁ в контексте самосохранения
  choice: жизнь
  alternative: душу / себя
  rationale: Контекст физических и нравственных опасностей поддерживает значение «жизнь» или «сам человек». Перевод «жизнь» не вводит искусственного разделения души и тела и сохраняет практическую направленность изречения.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранён образ пути и пара скрытых опасностей; синтаксис сделан естественным для русской пословичной речи.
