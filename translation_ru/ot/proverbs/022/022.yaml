revisions:
- from: Не грабь бедного за то, что он беден,[a] и не сокрушай угнетённого у ворот.[b]
  to: Не грабь бедняка из-за его бедности[a] и не притесняй нуждающегося у ворот.[b]
  rationale: Правка улучшает естественность современного литературного русского и точнее передаёт социальный характер второго запрета. Причинный характер כִּי сохранён, а возможное более буквальное «ибо он беден» отмечено в сноске. Буквальное «у ворот» оставлено вместе с необходимым историческим пояснением.
  reviewer_model: gpt-5.6-terra
