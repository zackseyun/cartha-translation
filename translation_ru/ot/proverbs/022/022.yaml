review_pass:
  verdict: revise
  source_fidelity: Первая строка в целом передаёт גזל и причинное כִּי, но «за то, что он беден» в русском языке может звучать как основание для наказания и менее естественно для мотива эксплуатации. «Сокрушай угнетённого» чрезмерно буквальное и стилистически тяжеловесное; עָנִי не обязательно означает уже «угнетённого».
  naturalness: «Не грабь бедняка из-за его бедности» — ясная современная афористичная формулировка. «Не притесняй нуждающегося у ворот» естественно передаёт социально-правовой смысл второго запрета без неестественной сочетаемости «сокрушать угнетённого».
  terminology: «Бедняк» адекватно передаёт דַּל; «нуждающийся» — допустимый контекстуальный эквивалент עָנִי, сохраняющий некоторое лексическое различие. «Притесняй» передаёт социальное применение интенсивного דכא; образ «у ворот» сохранён, а судебный контекст объяснён в сноске.
