  text: אַֽל תִּגְזָל דָּ֭ל כִּ֣י דַל ה֑וּא וְ/אַל תְּדַכֵּ֖א עָנִ֣י בַ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/022.yaml
  text: Do not rob the poor because he is poor[b][a], and do not crush the afflicted at the gate.
translation:
  language: ru
  text: Не грабь бедняка из-за его бедности[a] и не притесняй нуждающегося у ворот.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не грабь бедняка, ибо он беден». Глагол может означать несправедливо или насильственно отнимать.'
    reason: Передаёт причинную конструкцию כִּי и уточняет смысл גזל, не навязывая единственное истолкование связи между частями.
  - marker: b
    text: 'То есть у городских ворот, где обычно разбирали судебные дела и выносили публичные решения; по смыслу: «в суде».'
    reason: Поясняет культурно-историческую судебную функцию ворот, сохраняя буквальный образ в основном тексте.
lexical_decisions:
- source_word: תִּגְזָל
  choice: грабь
  rationale: Глагол גזל обозначает насильственное или несправедливое отнятие; «грабь» естественно передаёт злоупотребление беззащитностью бедного.
- source_word: דָּל
  choice: бедного / беден
  rationale: דָּל указывает на человека низкого, слабого или бедного положения. Повтор «бедного… беден» сохраняет риторику еврейского текста.
- source_word: כִּי דַל הוּא
  choice: за то, что он беден
  rationale: כִּי здесь имеет причинное значение, причём бедность представлена как повод для несправедливости; русский оборот ясно сохраняет эту мысль.
- source_word: תְּדַכֵּא
  choice: сокрушай
  rationale: Форма породы пиэль от דכא выражает сильное действие — сокрушать, подавлять. «Сокрушай» сохраняет образность и нравственную остроту исходного текста.
- source_word: עָנִי
  choice: угнетённого
  rationale: עָנִי может обозначать бедного, страждущего, униженного или угнетённого. «Угнетённого» сохраняет отличие от דָּל и соответствует судебно-социальному контексту.
- source_word: בַשָּׁעַר
  choice: у ворот
  rationale: Буквально речь идёт о воротах, служивших местом общественных разбирательств и суда; культурный смысл разъяснён в сноске.
theological_decisions:
- issue: Связь бедности с запретом грабежа
  choice: 'Передать כִּי как причину: «за то, что он беден»'
  alternative: «ведь он беден»
  rationale: Контекст предостерегает от использования бедности человека как повода и возможности для притеснения; при этом причинная неоднозначность отмечена в сноске.
- issue: Судебный оттенок выражения בַשָּׁעַר
  choice: Сохранить буквальное «у ворот»
  alternative: «в суде»
  rationale: Так сохраняется исторический образ исходного текста без сведения его только к абстрактному судебному учреждению; функция ворот объясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой притчи. Сохранены параллелизм, повтор корня «бедный» и сильная метафора «сокрушай»; исторический образ ворот оставлен в основном тексте и пояснён сноской.
