  text: אַל תַּ֭סֵּג גְּב֣וּל עוֹלָ֑ם אֲשֶׁ֖ר עָשׂ֣וּ אֲבוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/028.yaml
  text: Do not move an ancient boundary marker that your fathers made[a][b].
translation:
  language: ru
  text: Не передвигай древний межевой знак, установленный твоими отцами[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не сдвигай древнюю межу, которую установили твои отцы».'
    reason: lexical_alternative
  - marker: b
    text: 'Слово «отцы» может здесь иметь более широкое значение: «предки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: не
  rationale: Сочетание אַל с формой имперфекта выражает запрет; русская конструкция «не передвигай» естественно передаёт его силу.
- source_word: תַּסֵּג
  choice: передвигай
  rationale: В контексте межи глагол נסג означает сдвигать установленную границу или её обозначение. «Передвигай» ясно указывает на незаконное изменение положения, не обязательно на полное удаление.
- source_word: גְּבוּל
  choice: межевой знак
  rationale: Буквально слово обозначает границу или предел, но в сочетании с глаголом «передвигать» подразумевается знак, обозначающий границу земельного участка. Такой перевод естественен по-русски и сохраняет конкретный образ.
- source_word: עוֹלָם
  choice: древний
  rationale: Здесь עוֹלָם указывает на давнее, издавна установленное происхождение межи, а не на вечность в метафизическом смысле.
- source_word: אֲשֶׁר
  choice: установленный
  rationale: Относительное предложение естественно передано по-русски причастным оборотом без изменения связи между межевым знаком и действием отцов.
- source_word: עָשׂוּ
  choice: установленный
  rationale: Обычный глагол «делать» в данном контексте означает устройство или установление межевого знака; «установленный» точнее и естественнее буквального «сделанный».
- source_word: אֲבוֹתֶיךָ
  choice: твоими отцами
  rationale: Мужской род и множественное число исходного выражения сохранены. В контексте слово также может обозначать предков шире, что отмечено в сноске.
