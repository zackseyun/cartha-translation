  text: чтобы открыть тебе достоверность слов истины[a], чтобы ты мог отвечать словами истины[b] тем, кто послал тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истинность слов истины»; קֹשְׁט может также означать «истина», «правильность» или «надёжность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы ты мог передавать слова истины тем, кто послал тебя»; буквально глагол может означать «возвращать».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹדִיעֲךָ
  choice: чтобы дать тебе узнать
  rationale: Инфинитив породы хифиль от ידע с суффиксом 2-го лица мужского рода единственного числа выражает каузативное значение. Формулировка сохраняет его, не сводя смысл просто к «научить тебя».
- source_word: קֹשְׁט
  choice: достоверность
  rationale: Существительное обозначает истинность, правильность или надёжность. «Достоверность» естественно передаёт надёжную истинность наставлений и позволяет отличить это слово от дважды употреблённого אֱמֶת.
- source_word: אִמְרֵי אֱמֶת
  choice: слов истины
  rationale: Буквальная конструкция означает «слова/изречения истины». Русское «слова истины» сохраняет форму еврейского словосочетания и его торжественный оттенок.
- source_word: לְהָשִׁיב
  choice: чтобы ты мог отвечать
  rationale: Хифиль от שוב может означать «возвращать», а в речевом контексте — «давать ответ». По-русски «отвечать» естественно выражает подразумеваемое возвращение слов пославшим.
- source_word: אֲמָרִים אֱמֶת
  choice: правдивыми словами
  rationale: Необычное сочетание существительного во множественном числе с אֱמֶת передаёт слова, соответствующие истине. Творительный падеж естественно сочетается с глаголом «отвечать».
- source_word: לְשֹׁלְחֶיךָ
  choice: тем, кто послал тебя
  rationale: Причастие множественного числа с суффиксом 2-го лица обозначает пославших адресата. Русское относительное придаточное естественно и не вводит дополнительных уточнений.
