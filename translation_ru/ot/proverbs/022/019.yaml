  source_fidelity: 'Смысл передан в целом верно: לְהְיוֹת вводит цель, בַּיהוָה обозначает того, на кого направлено доверие, а הוֹדַעְתִּיךָ — причинное «дал знать / сделал известным». Однако конструкция «чтобы твоё упование было на Яхве» является тяжёлой калькой и менее естественна, чем глагольное выражение. «Именно тебе» может иметь ограничительное значение, которого emphатическое אַף אָתָּה не требует; «тебе самому» передаёт акцент без этого оттенка.'
