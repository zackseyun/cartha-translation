  text: לִ/הְי֣וֹת בַּ֭/יהוָה מִבְטַחֶ֑/ךָ הוֹדַעְתִּ֖י/ךָ הַ/יּ֣וֹם אַף אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/019.yaml
  text: So that your trust may be in Yahweh[a], I have made known to you today, even to you.
translation:
  language: ru
  text: Чтобы ты уповал на Яхве, я сегодня поведал тебе это — тебе самому.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Чтобы ... было
  rationale: 'Инфинитив с לְ выражает цель: наставление даётся для того, чтобы упование адресата было обращено к Яхве.'
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: Предлог בְּ указывает на того, на кого возлагают упование; по-русски естественно сочетание «упование на».
- source_word: מִבְטַחֶךָ
  choice: твоё упование
  rationale: Существительное обозначает доверие, уверенность или опору; «упование» сохраняет религиозный контекст и личный суффикс второго лица.
- source_word: הוֹדַעְתִּיךָ
  choice: я ... открыл это тебе
  rationale: Порода hифиль глагола ידע означает «дать знать, сделать известным». Местоимение «это» добавлено как подразумеваемое дополнение, относящееся к окружающим наставлениям.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямое и естественное соответствие временному наречию.
- source_word: אַף אָתָּה
  choice: именно тебе
  rationale: Частица אַף и самостоятельное местоимение усиливают выделение адресата; повтор «тебе» естественно передаёт этот акцент по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным словом «упование». Повтор «тебе — именно тебе» сохранён ради выраженного в еврейском тексте emphатического акцента; синтаксис сделан естественным для русского языка.
