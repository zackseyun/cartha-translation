  text: עָ֭שִׁיר בְּ/רָשִׁ֣ים יִמְשׁ֑וֹל וְ/עֶ֥בֶד לֹ֝וֶ֗ה לְ/אִ֣ישׁ מַלְוֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/007.yaml
  text: The rich rules over the poor[a], and the borrower is a servant to the lender.
translation:
  language: ru
  text: Богатый господствует над бедными, а берущий взаймы — раб заимодавца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а берущий взаймы — раб человеку, дающему взаймы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: богатый
  rationale: Субстантивированное прилагательное обозначает богатого человека как типичного представителя социальной группы; форма единственного числа сохраняет структуру еврейской пословицы.
- source_word: בְּרָשִׁים
  choice: над бедными
  rationale: При глаголе משל предлог בְּ указывает на тех, над кем осуществляется власть; «над бедными» естественно передаёт социальную иерархию.
- source_word: יִמְשׁוֹל
  choice: господствует
  rationale: Имперфект в пословичном высказывании выражает общую закономерность, поэтому передан настоящим временем. «Господствует» сохраняет смысл властвования без излишне административного оттенка.
- source_word: וְעֶבֶד
  choice: а … — раб
  rationale: עֶבֶד может означать раба или слугу; здесь образ подчёркивает жёсткую зависимость заёмщика, поэтому выбрано более сильное «раб». Связка в настоящем времени по-русски опущена.
- source_word: לֹוֶה
  choice: берущий взаймы
  rationale: Субстантивированное причастие буквально обозначает того, кто берёт взаймы. Эта формулировка сохраняет глагольный оттенок оригинала и не сужает значение до юридического статуса должника.
- source_word: לְאִישׁ מַלְוֶה
  choice: заимодавца
  rationale: Выражение буквально означает «человека, дающего взаймы». «Заимодавец» — точный и достаточно понятный литературный эквивалент, сохраняющий связь с займом.
