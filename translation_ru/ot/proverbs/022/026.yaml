  text: אַל תְּהִ֥י בְ/תֹֽקְעֵי כָ֑ף בַּ֝/עֹרְבִ֗ים מַשָּׁאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/026.yaml
  text: Do not be among those who strike hands[a], among those who become surety for debts.
translation:
  language: ru
  text: Не будь среди тех, кто бьёт по рукам[a], среди тех, кто выступает поручителем по долгам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не будь среди тех, кто скрепляет обязательство ударом по рукам, среди поручителей по долгам». Выражение «бить по рукам» обозначает жест, которым подтверждали соглашение или обязательство.'
    reason: Поясняет древний образ и даёт более явный вариант перевода, сохраняя связь жеста с обязательством без неоправданного сужения смысла.
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Не будь
  rationale: Отрицательная частица с формой глагола היה выражает прямое наставление-запрет; краткое русское «не будь» точно передаёт эту конструкцию.
- source_word: בְ/תֹקְעֵי כָף
  choice: среди тех, кто ударяет по рукам
  rationale: Предлог ב обозначает принадлежность к кругу людей, а сочетание תקע כף буквально описывает удар ладонями, которым скрепляли обязательство. Русское выражение сохраняет исходный образ; его правовой смысл пояснён в сноске.
- source_word: בַּ/עֹרְבִים
  choice: среди тех, кто ручается
  rationale: Причастие от ערב здесь означает выступать поручителем, принимая ответственность по финансовому обязательству. Глагол «ручаться» естественен в современном русском языке и сохраняет юридико-финансовый смысл.
- source_word: מַשָּׁאוֹת
  choice: за долги
  rationale: Слово обозначает финансовые обязательства или долговое бремя. «Долги» ясно и естественно передаёт смысл в контексте предостережения о поручительстве, не сужая его исключительно до одного вида займа.
