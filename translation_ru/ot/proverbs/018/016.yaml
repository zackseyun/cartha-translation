  text: מַתָּ֣ן אָ֭דָם יַרְחִ֣יב ל֑/וֹ וְ/לִ/פְנֵ֖י גְדֹלִ֣ים יַנְחֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/016.yaml
  text: A man's gift makes room for him[b][a], and brings him before great men.
translation:
  language: ru
  text: Подарок человека открывает ему дорогу и приводит его к влиятельным людям.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַתָּן
  choice: подарок
  rationale: Существительное обозначает дар или подношение; «подарок» естественно передаёт общий смысл изречения и не уточняет без основания, идёт ли речь о взятке.
- source_word: אָדָם
  choice: человека
  rationale: Единственное число употреблено здесь в обобщающем значении. Русское «человека» сохраняет форму оригинала и естественно относится к любому человеку.
- source_word: יַרְחִיב לוֹ
  choice: открывает ему дорогу
  rationale: Буквально каузативная форма означает «расширяет для него». Русская идиома «открывает дорогу» передаёт образ устранения препятствий и получения доступа.
- source_word: וְלִפְנֵי גְדֹלִים
  choice: к великим людям
  rationale: Выражение означает пребывание перед лицом влиятельных или знатных людей. «К великим людям» сохраняет лаконичность и социальный оттенок оригинала.
- source_word: יַנְחֶנּוּ
  choice: приводит его
  rationale: Каузатив глагола נחה значит «вести, направлять». В сочетании с указанием на присутствие перед великими людьми «приводит» естественно выражает достигнутый результат.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой формой, соответствующей афористическому стилю Притч. Местоимение «его» может грамматически относиться как к человеку, так и к подарку; по смыслу русского предложения наиболее естественно относится к человеку, как и в основном понимании еврейского текста.
