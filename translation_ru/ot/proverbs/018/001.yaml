  text: Whoever isolates himself seeks his own desire[b][a]; he breaks out against all sound judgment.
translation:
  language: ru
  text: Кто обособляется, тот добивается исполнения собственного желания[a]; он противится всякому здравому суждению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Обособившийся ищет желания». Еврейская фраза кратка; принадлежность желания самому этому человеку подразумевается, но прямо не выражена.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «со всякой здравой мудростью он спорит». Еврейский глагол в этой строке редок, и его точное значение неясно; возможны значения резкого выступления, ссоры или противодействия.'
    reason: textual_difficulty
lexical_decisions:
- source_word: לְתַאֲוָה
  choice: исполнения собственного желания
  rationale: Существительное תַּאֲוָה означает желание, влечение или страстное стремление, а לְ указывает здесь на цель или побуждение. Добавление «исполнения» делает сочетание с глаголом «ищет» естественным по-русски; «собственного» передаёт подразумеваемую направленность обособившегося человека на своё желание, не усиливая её словом «эгоистическое».
- source_word: יְבַקֵּשׁ
  choice: ищет
  rationale: Пиэль глагола בקש обычно означает «искать», «добиваться». «Ищет» сохраняет прямое значение и лаконизм изречения.
- source_word: נִפְרָד
  choice: кто обособляется
  rationale: Причастие нифаля от פרד обозначает отделившегося или отделяющего себя человека. Обобщающая конструкция «кто обособляется» естественно передаёт форму наставительного изречения и не сводит смысл к физическому одиночеству.
- source_word: בְּכָל
  choice: против всякого
  rationale: Предлог בְ в этой сжатой и трудной строке допускает разные отношения. При выбранном понимании редкого глагола он передан как «против», выражая столкновение со здравым суждением.
- source_word: תּוּשִׁיָּה
  choice: здравомыслия
  rationale: В литературе мудрости תּוּשִׁיָּה может обозначать здравую мудрость, рассудительность или практическую способность верно действовать. «Здравомыслие» естественно в русском контексте и сохраняет практический оттенок.
- source_word: יִתְגַּלָּע
  choice: восстаёт
  rationale: Редкая форма хитпаэля имеет не вполне ясное значение; в контексте её обычно понимают как резкое враждебное выступление или вступление в спор. «Восстаёт» передаёт противительное действие, не закрепляя сомнительный конкретный образ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, краткий и афористичный синтаксис. «Обособляется» сохраняет социальный смысл отделения от других и их совета; «здравомыслие» понятно широкому читателю. Трудность второй строки и возможная неоднозначность первой вынесены в примечания.
