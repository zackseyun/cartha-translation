  source_fidelity: 'Перевод точно передаёт обе строки еврейского параллелизма: פִּי כְסִיל — «уста глупца», מְחִתָּה לוֹ — «погибель для него», וּשְׂפָתָיו — «и губы его», מוֹקֵשׁ נַפְשׁוֹ — «западня для его жизни». «Для него» корректно отражает לּוֹ, не вынуждая более узкое толкование. «Для его жизни» оправданно передаёт נַפְשׁוֹ в данном контексте, где речь о гибельных последствиях слов для самого человека.'
