  text: פִּֽי כְ֭סִיל מְחִתָּה ל֑/וֹ וּ֝/שְׂפָתָ֗י/ו מוֹקֵ֥שׁ נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/007.yaml
  text: A fool’s mouth is his ruin[b][a], and his lips are a snare to his life.
translation:
  language: ru
  text: 'Уста глупца — погибель для него,

    и губы его — западня для его жизни.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «для его души»; еврейское слово здесь может означать жизнь человека или его самого.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: уста
  rationale: Сохраняет конкретный образ рта как источника речи и соответствует возвышенному, но понятному регистру изречения.
- source_word: כְסִיל
  choice: глупец
  rationale: 'Передаёт устойчивый термин литературы мудрости: речь идёт не только о недостатке ума, но и о нравственно неблагоразумном человеке.'
- source_word: מְחִתָּה
  choice: погибель
  rationale: В данном параллелизме слово обозначает разрушительный итог, который речь глупца навлекает на него самого; «погибель» естественно сочетается с образом западни.
- source_word: לוֹ
  choice: для него
  rationale: 'Прямо передаёт еврейскую предложную конструкцию и сохраняет возможный смысл: уста становятся погибелью именно для самого глупца.'
- source_word: וּשְׂפָתָיו
  choice: и губы его
  rationale: Сохраняет телесный образ и синонимический параллелизм с «устами».
- source_word: מוֹקֵשׁ
  choice: западня
  rationale: Передаёт образ ловушки; слово понятно современному читателю и уместно в поэтическом регистре.
- source_word: נַפְשׁוֹ
  choice: для его жизни
  rationale: נֶפֶשׁ здесь вероятнее обозначает жизнь или самого человека, а не «душу» как отдельную нематериальную часть; буквенная сноска сохраняет подлинную смысловую широту.
theological_decisions:
- issue: Значение נַפְשׁוֹ
  choice: для его жизни
  alternative: для его души; для него самого
  rationale: Контекст описывает опасность, которую необузданная речь создаёт для самого говорящего. Перевод «жизнь» не привносит позднейшее антропологическое разделение тела и души, а сноска сохраняет буквальный образ и возможный смысл «самого себя».
translation_notes:
  register: Современный литературный русский с лаконичным поэтическим параллелизмом. «Уста» и «губы» сохраняют образность оригинала; порядок слов «губы его» поддерживает библейский ритм, оставаясь понятным обычному читателю.
