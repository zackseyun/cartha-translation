  yaml_path: translation/ot/proverbs/018/019.yaml
  text: A brother offended is harder to win than a fortified city[b][a], and quarrels are like the bars of a citadel.
translation:
  language: ru
  text: 'Обиженный брат неприступнее укреплённого города[a],

    а ссоры — словно засов крепости[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Брат, с которым поступили несправедливо, неприступнее укреплённого города». Еврейская форма может описывать обиженного или пострадавшего от чужого проступка человека. Слово «неприступнее» подразумевается сравнительной конструкцией, но прямо в еврейском тексте не выражено.'
    reason: lexical_and_elliptical_alternative
  - marker: b
    text: 'Или: «а распри — словно засов дворца». Последнее еврейское слово может означать как укреплённую резиденцию, так и дворец; образ засова в данном контексте поддерживает перевод «крепость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: брат
  rationale: Сохраняет прямой образ еврейского текста; в пословице это может быть как родной брат, так и человек, связанный близкими отношениями.
- source_word: נִפְשָׁע
  choice: обиженный
  rationale: Форма от פשע здесь, вероятно, обозначает человека, против которого провинились и который вследствие этого отчуждён. «Обиженный» естественно передаёт нарушение отношений, не сводя его непременно к юридически доказанной несправедливости.
- source_word: מִקִּרְיַת עֹז
  choice: неприступнее укреплённого города
  rationale: Предлог מִן выражает сравнение, а קִרְיַת עֹז буквально означает «город силы», то есть укреплённый город. Слово «неприступнее» восполняет подразумеваемый сравнительный признак из образа защищённого города.
- source_word: וּמְדֹנִים
  choice: а ссоры
  rationale: Множественное число обозначает распри или раздоры; «ссоры» ясно и естественно звучит в современной русской пословичной речи.
- source_word: כִּבְרִיחַ
  choice: словно засов
  rationale: בְּרִיחַ — поперечный брус или засов, которым запирали ворота. Единственное число оригинала сохранено.
- source_word: אַרְמוֹן
  choice: крепости
  rationale: Слово может обозначать дворец или укреплённую резиденцию. В сочетании с засовом и укреплённым городом контекст поддерживает значение «крепость».
