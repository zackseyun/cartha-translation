  text: מִ֭דְיָנִים יַשְׁבִּ֣ית הַ/גּוֹרָ֑ל וּ/בֵ֖ין עֲצוּמִ֣ים יַפְרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/018.yaml
  text: The lot puts an end to disputes[a], and separates between the mighty.
translation:
  language: ru
  text: Жребий прекращает споры[a] и разнимает сильных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Жребий улаживает споры и выносит решение между могущественными».'
    reason: 'Лексико-контекстуальная альтернатива: в контексте разбирательства глаголы «прекращает» и «разнимает» могут подразумевать урегулирование спора и решение между сильными сторонами.'
lexical_decisions:
- source_word: מִדְיָנִים
  choice: споры
  rationale: Существительное во множественном числе обозначает распри, тяжбы или спорные разбирательства. «Споры» — естественное современное слово, сохраняющее как межличностный, так и судебный оттенок.
- source_word: יַשְׁבִּית
  choice: прекращает
  rationale: Каузативная форма породы hифиль от שבת означает «заставляет прекратиться». «Прекращает» кратко и прямо передаёт этот смысл.
- source_word: הַגּוֹרָל
  choice: жребий
  rationale: גורל обозначает жребий как средство принятия решения. «Жребий» — традиционный, понятный и лаконичный русский эквивалент.
- source_word: וּבֵין
  choice: и … [сильных]
  rationale: Предлог בין указывает на стороны, между которыми производится разделение. В русском языке отношение естественно выражается прямым дополнением при глаголе «разделяет», без буквального «между».
- source_word: עֲצוּמִים
  choice: сильных
  rationale: Субстантивированное прилагательное обозначает сильных или могущественных людей. «Сильных» сохраняет основное значение и не добавляет отсутствующего в еврейском тексте существительного.
- source_word: יַפְרִיד
  choice: разделяет
  rationale: Порода hифиль от פרד имеет конкретный смысл «разделять, разъединять». Выбор сохраняет образ еврейского текста, не заменяя его более толковательным «решает спор».
