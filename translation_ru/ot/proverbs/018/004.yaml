  yaml_path: translation/ot/proverbs/018/004.yaml
  text: The words of a man's mouth are deep waters[b][a]; the fountain of wisdom is a flowing brook.
translation:
  language: ru
  text: Глубокие воды — слова из уст человека[b]; источник мудрости — струящийся поток.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слова из уст человека — глубокие воды, струящийся поток, источник мудрости». Еврейский текст допускает понимание, при котором все водные образы описывают сами слова, а вторая часть не является отдельным высказыванием об источнике мудрости.'
    reason: alternative_reading
  - marker: b
    text: Еврейское אִישׁ — существительное мужского рода в единственном числе; здесь оно употреблено в обобщённом стиле притчи об отдельном говорящем.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: глубокие воды
  rationale: Сохраняет конкретный водный образ и не заменяет метафору толкованием «глубокомысленные».
- source_word: דִּבְרֵי פִי אִישׁ
  choice: слова из уст человека
  rationale: Передаёт конструкцию естественно по-русски; «из уст» ясно выражает происхождение речи, а «человека» подходит для обобщённого лица в изречении.
- source_word: נַחַל נֹבֵעַ
  choice: струящийся поток
  rationale: נַחַל обозначает поток или русло, а причастие נֹבֵעַ — бьющую, истекающую или текущую воду. Формулировка сохраняет образ движения без излишнего усиления.
- source_word: מְקוֹר חָכְמָה
  choice: источник мудрости
  rationale: «Источник» естественно передаёт как водный образ, так и переносное значение מְקוֹר, сохраняя параллель с глубокими водами и потоком.
theological_decisions:
- issue: Синтаксическая связь второй строки
  choice: 'Вторая строка оформлена как отдельное именное высказывание: «источник мудрости — струящийся поток»'
  alternative: 'Все водные образы могут относиться к словам человека: «слова из уст человека — глубокие воды, струящийся поток, источник мудрости»'
  rationale: В еврейском тексте отсутствуют связки и явные синтаксические показатели, поэтому возможны оба членения. Основной текст следует традиционному параллельному членению, а альтернативу сохраняет сноска.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой изречения. Тире передают подразумеваемые именные связки. Водная образность оригинала сохранена без поясняющего перефразирования.
