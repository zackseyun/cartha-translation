  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/008.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: ru
  text: 'Слова сплетника — словно лакомые кусочки[a]: они проникают в самые глубины человека[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно изысканные кусочки»; редкое еврейское слово допускает также понимание «словно раны» или «словно то, что жадно проглатывают».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «опускаются во внутренние покои чрева» — древнееврейский образ сокровенных глубин человека.'
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Слова
  rationale: Форма сопряжённого множественного числа от דָּבָר; «слова» естественно передаёт предмет высказывания и сохраняет связь с речью.
- source_word: נִרְגָּן
  choice: сплетника
  rationale: Существительное обозначает человека, который скрытно распространяет разобщающие толки. Современное русское «сплетник» понятно широкому читателю и передаёт этот смысл без архаичного оттенка слова «наушник».
- source_word: כְּמִתְלַהֲמִים
  choice: словно лакомые кусочки
  rationale: Редкое и спорное слово, повторяющееся в Притчах 26:22. Значение чего-то вкусного и жадно проглатываемого хорошо согласуется с образом последующего проникновения внутрь; иные возможные значения вынесены в сноску.
- source_word: וְהֵם
  choice: они
  rationale: Самостоятельное местоимение возобновляет подлежащее «слова». Двоеточие естественно выражает смысловую связь в русском, не меняя референцию местоимения.
- source_word: יָרְדוּ
  choice: проникают
  rationale: Перфект в изречении выражает постоянную закономерность, поэтому употреблено настоящее время. «Проникают» естественно передаёт движение вглубь человека, тогда как буквальное «опускаются» в данном русском обороте звучало бы неясно.
- source_word: חַדְרֵי בָטֶן
  choice: в самые глубины человека
  rationale: Буквально «во внутренние покои чрева»; это древнееврейская идиома, обозначающая сокровенную внутреннюю область человека. Основной текст передаёт идиоматический смысл, а буквальный образ сохранён в сноске.
theological_decisions:
- issue: Воздействие сплетни на внутреннего человека
  choice: Сохранён образ глубокого внутреннего проникновения без уточнения, идёт ли речь преимущественно о чувствах, разуме или нравственном состоянии.
  alternative: Конкретизировать как проникновение «в сердце» или «в душу».
  rationale: Еврейская идиома охватывает внутреннее существо человека и не ограничивает смысл одной отдельной способностью.
translation_notes:
  register: Современный литературный русский язык с краткой формой афоризма. «Сплетник» выбран ради ясности; буквальный телесно-пространственный образ пояснён в сноске, чтобы основной текст оставался естественным и понятным.
