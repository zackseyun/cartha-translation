  source_fidelity: Первая половина точно передаёт משפטную идиому שְׂאֵת פְּנֵי רָשָׁע как проявление пристрастия к нечестивому. Во второй половине לְהַטּוֹת צַדִּיק בַּמִּשְׁפָּט означает неправомерно склонить судебное решение против праведного/правого. «Лишать ... справедливости» передаёт итог, но по-русски менее естественно и несколько абстрактно; «отказывать ... в правосудии» точнее выражает судебный смысл.
  naturalness: «Нехорошо быть пристрастным к нечестивому» естественно и сохраняет сжатую оценку оригинала. «Отказывать праведному в правосудии» — более устойчивое современное литературное сочетание, чем «лишать праведного справедливости на суде». «На суде» из основного текста не требуется, поскольку «в правосудии» уже передаёт בַּמִּשְׁפָּט без ненужного уточнения учреждения.
