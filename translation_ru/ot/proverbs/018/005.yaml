  text: שְׂאֵ֣ת פְּנֵי רָשָׁ֣ע לֹא ט֑וֹב לְ/הַטּ֥וֹת צַ֝דִּ֗יק בַּ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/005.yaml
  text: To show partiality to the wicked is not good[b][a], nor to deprive the righteous of justice.
translation:
  language: ru
  text: Нехорошо быть пристрастным к нечестивому[a] и отказывать праведному в правосудии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимать лицо нечестивого» — еврейская идиома со значением «проявлять пристрастие, оказывать предпочтение».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отклонять праведного в суде»; то есть выносить решение не в его пользу.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאֵת פְּנֵי
  choice: быть пристрастным к
  rationale: Еврейская идиома буквально означает «поднимать лицо» и здесь выражает благосклонное, предвзятое отношение; современное «быть пристрастным к» ясно передаёт судебный смысл.
- source_word: רָשָׁע
  choice: нечестивому
  rationale: Субстантивированное прилагательное обозначает нравственно порочного человека; «нечестивый» сохраняет морально-правовой диапазон и не сужает значение до формально виновного.
- source_word: לֹא טוֹב
  choice: нехорошо
  rationale: Прямая и естественная передача краткой еврейской нравственной оценки без усиления до более категоричного «несправедливо».
- source_word: לְהַטּוֹת
  choice: лишать
  rationale: Глагол буквально значит «отклонять, отводить в сторону»; в сочетании с судебным контекстом эта передача выражает результат действия против праведного, не вводя идеи, отсутствующие в тексте.
- source_word: צַדִּיק
  choice: праведного
  rationale: Слово может обозначать как нравственно праведного, так и правого в тяжбе; традиционное «праведный» сохраняет эту многозначность.
- source_word: בַּמִּשְׁפָּט
  choice: справедливости на суде
  rationale: מִשְׁפָּט охватывает суд, судебное решение и правосудие. Формулировка передаёт и судебную обстановку, и смысл отказа в справедливом решении.
theological_decisions:
- issue: Значение צַדִּיק в судебном контексте
  choice: праведного
  alternative: невиновного / правого
  rationale: «Праведного» не ограничивает речь только юридической невиновностью и сохраняет присущее книге Притчей напряжение между нравственным и судебным значением.
translation_notes:
  register: Современный литературный русский язык; афористичная краткость и параллелизм сохранены. «На суде» понимается как судебное разбирательство, а не обязательно отдельное здание или учреждение.
