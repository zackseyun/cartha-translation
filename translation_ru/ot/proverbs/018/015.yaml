  text: 'Разумное сердце приобретает знание,

    и ухо мудрых ищет знания.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет еврейский образ внутреннего средоточия мышления, различения и воли; в русском языке сочетание «разумное сердце» понятно в контексте литературы мудрости.
- source_word: נָבוֹן
  choice: разумное
  rationale: Передаёт способность понимать и различать; естественно согласуется с существительным «сердце».
- source_word: יִקְנֶה
  choice: приобретает
  rationale: קנה здесь обозначает обретение знания, а не обязательно покупку; «приобретает» сохраняет оттенок целенаправленного получения.
- source_word: דָּעַת
  choice: знание
  rationale: Прямое соответствие в контексте Притчей; повтор слова в обеих строках сохранён как элемент поэтического параллелизма.
- source_word: אֹזֶן
  choice: ухо
  rationale: Сохраняет конкретный еврейский образ восприимчивости к наставлению и параллель с «сердцем».
- source_word: חֲכָמִים
  choice: мудрых
  rationale: Передаёт обобщённое обозначение мудрых людей без неоправданного сужения по полу.
- source_word: תְּבַקֶּשׁ
  choice: ищет
  rationale: Кратко и прямо передаёт активный поиск, сохраняя параллелизм с «приобретает».
