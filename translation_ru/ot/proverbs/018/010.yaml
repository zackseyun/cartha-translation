  source_fidelity: 'Перевод точно передаёт структуру и ключевые образы еврейского текста: «имя Яхве» названо «крепкой башней», праведник бежит внутрь неё, а заключительный нифаль נִשְׂגָּב передан как достижение недосягаемой, защищённой позиции. Русское «в неё» обоснованно соотносит местоимение с образом башни и сохраняет метафору оригинала.'
