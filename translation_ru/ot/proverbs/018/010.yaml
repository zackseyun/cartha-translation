source:
  edition: WLC
  text: מִגְדַּל עֹ֭ז שֵׁ֣ם יְהוָ֑ה בּֽ/וֹ יָר֖וּץ צַדִּ֣יק וְ/נִשְׂגָּֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/010.yaml
  text: The name of Yahweh is a strong tower[c][b][a]; the righteous runs into it and is set securely on high.
translation:
  language: ru
  text: Имя Яхве[a] — крепкая башня; праведник[b] бежит в неё и оказывается недосягаемым[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ), традиционно переводится «Господь»; здесь передано как «Яхве».
    reason: alternative_reading
  - marker: b
    text: Еврейское слово стоит в единственном числе мужского рода, но употреблено в обобщающем смысле.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «оказывается в безопасности». Еврейский глагол передаёт образ человека, находящегося высоко, в недоступном месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: крепкая башня
  rationale: Сочетание буквально означает «башня силы»; русское «крепкая башня» естественно передаёт образ высокого оборонительного сооружения и его защитную мощь.
- source_word: שֵׁם
  choice: имя
  rationale: 'Прямое соответствие сохраняет многозначность: имя может подразумевать явленный характер и славу, но перевод не сводит его к одному толкованию.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: בּוֹ
  choice: в неё
  rationale: Местоименный суффикс естественнее всего относится к метафорической башне; в русском согласование определяется женским родом слова «башня».
- source_word: יָרוּץ
  choice: бежит
  rationale: Сохраняет конкретный образ быстрого движения к убежищу, не добавляя прямо не выраженного значения «спасается бегством».
- source_word: צַדִּיק
  choice: праведник
  rationale: Русское существительное точно и естественно передаёт субстантивированную форму мужского рода в единственном числе и её обобщающий характер в притче.
- source_word: וְנִשְׂגָּב
  choice: и оказывается недосягаемым
  rationale: Форма породы нифаль указывает на пребывание в высоком, недоступном и потому безопасном месте. «Недосягаемым» сохраняет защитный смысл образа без сведения его просто к общему «в безопасности».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет это различие, а традиционный вариант указан в примечании.
- issue: Обобщающий смысл צַדִּיק
  choice: праведник
  alternative: праведный человек
  rationale: «Праведник» сохраняет грамматическое единственное число и мужской род оригинала, оставаясь в русском языке обычным обобщающим обозначением любого праведного человека.
- issue: Значение נִשְׂגָּב
  choice: оказывается недосягаемым
  alternative: оказывается в безопасности / возносится
  rationale: Выбранный вариант удерживает одновременно идею защищённости и недоступной высоты, не истолковывая глагол как духовное возвышение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем притчи. Тире естественно оформляет именную конструкцию, а точка с запятой сохраняет две соотнесённые части стиха. Образ башни и движения внутрь неё сохранён без конфессионально обусловленных пояснений.
