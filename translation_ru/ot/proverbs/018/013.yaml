  text: מֵשִׁ֣יב דָּ֭בָר בְּ/טֶ֣רֶם יִשְׁמָ֑ע אִוֶּ֥לֶת הִיא ל֝֗/וֹ וּ/כְלִמָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/013.yaml
  text: He who answers a matter before he hears it[a], it is folly and shame to him.
translation:
  language: ru
  text: Кто отвечает, не выслушав дела[a], тому это — глупость и позор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто отвечает на слово, прежде чем услышит его». Еврейское דָּבָר может означать «слово», «дело» или «случай, спорный вопрос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: отвечает
  rationale: Причастие породы хифиль от שׁוב здесь идиоматически означает «отвечать, давать ответ». Настоящее время естественно передаёт обобщённый характер притчи.
- source_word: דָּבָר
  choice: дела
  rationale: Слово דָּבָר может означать «слово», «дело» или «случай, спорный вопрос». В сочетании с призывом сначала выслушать речь идёт о предмете обсуждения; «дело» сохраняет широту применения к разговору, спору и разбирательству.
- source_word: בְּטֶרֶם יִשְׁמָע
  choice: не выслушав
  rationale: Оборот означает ответ до того, как человек услышал. Русское деепричастие лаконично выражает эту временную последовательность, а «выслушать» подчёркивает необходимость услышать сообщение или дело прежде, чем отвечать.
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Обычное русское соответствие термину литературы мудрости, обозначающему нравственно и рассудочно неразумное поведение.
- source_word: לוֹ
  choice: тому
  rationale: Дательный «тому» естественно соотносит итог — глупость и позор — с человеком, который поспешил ответить.
- source_word: וּכְלִמָּה
  choice: и позор
  rationale: כְּלִמָּה обозначает стыд, бесчестье или позор. «Позор» сохраняет внешнюю сторону постыдного результата и образует ёмкую пару с «глупостью».
