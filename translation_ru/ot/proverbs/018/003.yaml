  verdict: revise
  source_fidelity: Первое слово רָשָׁע — субстантивированное прилагательное мужского рода в единственном числе; «нечестивый» точно передаёт личное, собирательно-пословичное значение. Повтор «приходит» верно отражает בוא … בָּא, а «презрение» соответствует בּוּז. Во второй части «позор» допустим для קָלוֹן, но חֶרְפָּה в первую очередь означает поношение, упрёк или оскорбительное бесчестящее слово; «бесчестье» чрезмерно сближает его с «позором».
  naturalness: Фраза кратка, литературна и сохраняет афористическую симметрию оригинала. Оборот «а с позором — поношение» естественен для пословичного регистра и передаёт неполное второе предложение оригинала без искусственного повтора глагола.
  terminology: «Нечестивый» уместен для רָשָׁע и не подменяет личное обозначение абстрактным «нечестием». «Презрение», «позор» и «поношение» различают близкие, но не тождественные בּוּז, קָלוֹן и חֶרְפָּה. Английская основная строка с «wickedness» расходится и с еврейской грамматикой, и с собственным английским лексическим решением, однако русский проект верно следует источнику.
