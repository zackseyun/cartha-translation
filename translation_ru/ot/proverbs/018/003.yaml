  text: בְּֽ/בוֹא רָ֭שָׁע בָּ֣א גַם בּ֑וּז וְֽ/עִם קָל֥וֹן חֶרְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/003.yaml
  text: When wickedness comes[a], contempt also comes, and with dishonor comes reproach.
translation:
  language: ru
  text: Когда приходит нечестивый, приходит и презрение, а с позором — поношение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבוֹא
  choice: когда приходит
  rationale: Предлог ב с инфинитивом בוא вводит временное придаточное; русский оборот «когда приходит» естественно передаёт эту функцию.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: В масоретском тексте это субстантивированное прилагательное мужского рода в единственном числе, обозначающее нечестивого человека, а не абстрактное «нечестие».
- source_word: בָּא
  choice: приходит
  rationale: Повтор глагола «приходит» сохраняет повтор корня בוא и выразительный параллелизм первой строки.
- source_word: גַם
  choice: и
  rationale: В конструкции «приходит и презрение» частица передана естественным русским присоединительным «и» в значении «также».
- source_word: בּוּז
  choice: презрение
  rationale: Существительное обозначает презрение или пренебрежение; «презрение» сохраняет абстрактность и краткость оригинала.
- source_word: וְעִם
  choice: а вместе с
  rationale: Оборот сохраняет значение сопровождения, а союз «а» естественно обозначает переход ко второй параллельной части.
- source_word: קָלוֹן
  choice: позор
  rationale: Слово обозначает публичный стыд, бесславие или позор; «позор» ясно и ёмко передаёт этот смысл.
- source_word: חֶרְפָּה
  choice: бесчестье
  rationale: Слово охватывает поношение, поругание и бесчестье. Выбор отличает его от קָלוֹן и сохраняет ряд близких, но не тождественных понятий.
theological_decisions:
- issue: Личное или абстрактное прочтение רָשָׁע
  choice: нечестивый
  alternative: нечестие
  rationale: Грамматическая форма обозначает нечестивого человека; абстрактное «нечестие» возможно как смысловая интерпретация, но не является прямым соответствием формы исходного текста.
translation_notes:
  register: Краткая двучленная пословица передана современным литературным русским языком. Сохранены повтор «приходит» и цепочка абстрактных существительных; тон достоинственный и афористичный.
