base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/012.yaml
  text: Before destruction a man's heart is haughty[a], and before honor comes humility.
translation:
  language: ru
  text: Перед гибелью сердце человека возносится, а перед честью — смирение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог употреблён во временном значении и в обоих полустишиях обозначает то, что предшествует названному событию; повтор сохраняет параллелизм.
- source_word: שֶׁבֶר
  choice: гибель
  rationale: Здесь слово обозначает не буквальный перелом, а сокрушительный крах или разрушение; «гибель» естественно передаёт предостережение притчи.
- source_word: יִגְבַּהּ לֵב
  choice: возносится сердце
  rationale: Буквальный образ «сердце становится высоким» выражает гордость. «Возносится сердце» сохраняет образ и ясно передаёт его переносный смысл.
- source_word: אִישׁ
  choice: человека
  rationale: В притче существительное мужского рода употреблено в обобщающем смысле. Русское «человек» естественно сохраняет единственное число и универсальный характер изречения.
- source_word: כָבוֹד
  choice: честь
  rationale: В данном контексте речь идёт о почёте и достойном положении, а не специально о божественной славе.
- source_word: עֲנָוָה
  choice: смирение
  rationale: Слово обозначает смиренность или кроткую непритязательность и составляет этический контраст возносящемуся сердцу.
theological_decisions:
- issue: Обобщающее значение אִישׁ
  choice: сердце человека
  alternative: сердце мужчины
  rationale: Контекст представляет общую мудростную максиму. «Человек» в современном русском языке точно передаёт родовую функцию еврейской формы, не ограничивая смысл только мужчинами.
- issue: Связь смирения с честью во втором полустишии
  choice: перед честью — смирение
  alternative: смирение приводит к чести
  rationale: В еврейском тексте второе полустишие именное и прямо говорит лишь о предшествовании. Перевод не добавляет явно выраженной причинности и сохраняет лаконичность и богословскую напряжённость притчи.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой. Повтор «перед» и тире во втором полустишии сохраняют параллелизм оригинала; «возносится сердце» звучит dignified and remains understandable while retaining the Hebrew metaphor.
