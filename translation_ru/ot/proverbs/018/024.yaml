  yaml_path: translation/ot/proverbs/018/024.yaml
  text: A man of many companions may come to ruin[a], but there is a friend who sticks closer than a brother.
translation:
  language: ru
  text: У кого много приятелей, тот может дойти до беды[a], но бывает друг, который ближе брата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Человеку, у которого много приятелей, следует быть дружелюбным». Еврейское слово לְהִתְרֹעֵעַ трудно для понимания и толкуется по-разному.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: У кого
  rationale: Контекстуальная русская конструкция естественно передаёт неопределённого человека, выраженного еврейским существительным мужского рода, не утяжеляя афоризм словом «человек».
- source_word: רֵעִים
  choice: много приятелей
  rationale: «Приятели» сохраняет отличие множества менее надёжных связей от единственного «друга» во второй части стиха.
- source_word: לְהִתְרֹעֵעַ
  choice: может дойти до беды
  rationale: Трудная форма допускает связь со значением сокрушения или гибели. Эта передача выражает неблагоприятный исход, но не делает его неизбежным; традиционное альтернативное понимание отмечено в сноске.
- source_word: וְיֵשׁ
  choice: но бывает
  rationale: «Но» ясно передаёт контраст между множеством приятелей и одним верным другом; «бывает» естественно выражает экзистенциальное יֵשׁ в русском афоризме.
- source_word: אֹהֵב
  choice: друг
  rationale: Причастие со значением «любящий» в данном контексте обозначает преданного друга и противопоставлено приятелям.
- source_word: דָּבֵק
  choice: ближе
  rationale: Краткая идиоматичная передача образа тесной и стойкой привязанности, выраженного причастием от דבק.
- source_word: מֵאָח
  choice: брата
  rationale: 'Предлог מִן здесь сравнительный: такой друг оказывается ближе, чем брат.'
