lexical_decisions:
- source_word: שִׂפְתֵי
  choice: губы
  rationale: Сохранён буквальный и яркий метонимический образ речи, а также параллелизм с «ртом» во второй строке.
- source_word: כְסִיל
  choice: глупец
  rationale: Традиционный и понятный термин литературы мудрости, обозначающий не только недостаток ума, но и нравственно неблагоразумное поведение.
- source_word: יָבֹאוּ בְרִיב
  choice: вступают в ссору
  rationale: Передаёт вовлечение в спор или конфликт и естественно звучит по-русски, сохраняя образ движения в ссору.
- source_word: פִיו
  choice: рот его
  rationale: Буквальный образ сохранён ради поэтического параллелизма с «губами».
- source_word: לְמַהֲלֻמוֹת
  choice: побои
  rationale: Слово обозначает удары или избиение; «побои» ясно передаёт угрожающие говорящему физические последствия.
- source_word: יִקְרָא
  choice: накликает
  rationale: Глагол сохраняет смысл призывания и одновременно естественно выражает то, что речь глупца навлекает на него побои.
