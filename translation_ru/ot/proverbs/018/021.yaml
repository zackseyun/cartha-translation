  yaml_path: translation/ot/proverbs/018/021.yaml
  text: Death and life are in the power of the tongue[b][a], and those who love it will eat its fruit.
translation:
  language: ru
  text: Смерть и жизнь — во власти языка[a], и кто любит его, тот вкусит его плод[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руке языка».'
    reason: lexical_alternative
  - marker: b
    text: 'Вероятно, речь о тех, кто любит пользоваться языком: они испытают последствия своих слов — несущих смерть или жизнь.'
    reason: cultural_note
lexical_decisions:
- source_word: מָוֶת וְחַיִּים
  choice: Смерть и жизнь
  rationale: Сохранена антитетическая пара абстрактных понятий; морфологически множественное חַיִּים обычно означает «жизнь».
- source_word: בְּיַד
  choice: во власти
  rationale: Буквально «в руке»; здесь это устойчивое обозначение власти или способности распоряжаться. Русское «во власти» естественно передаёт смысл идиомы.
- source_word: לָשׁוֹן
  choice: языка
  rationale: Сохранён конкретный образ органа речи, метонимически обозначающего слова и речь.
- source_word: אֹהֲבֶיהָ
  choice: кто любит его
  rationale: Местоименная отсылка к «языку» сохранена без уточнения, идёт ли речь о любви к говорению, частом употреблении языка или увлечении его силой.
- source_word: יֹאכַל פִּרְיָהּ
  choice: тот вкусит его плоды
  rationale: Сохранена метафора вкушения плода как переживания последствий. Множественное «плоды» естественно по-русски и допускает как смертоносные, так и животворные последствия слов.
theological_decisions:
- issue: К чему относится «любить язык» и каковы его плоды
  choice: Сохранить краткую и неоднозначную формулировку в основном тексте, пояснив вероятный смысл в сноске.
  alternative: 'Перевести истолковательно: «кто любит говорить, испытает последствия своих слов».'
  rationale: Еврейский текст не уточняет характер этой любви и не ограничивает плод только добрым или только злым результатом; пословица удерживает напряжение между смертью и жизнью.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичности, параллелизма и образности еврейской пословицы. «Вкусит» выбрано как понятное и достойное по регистру слово, поддерживающее метафору плода.
