  yaml_path: translation/ot/proverbs/018/023.yaml
  text: The poor man speaks with pleas[a], but the rich man answers harshly.
translation:
  language: ru
  text: Бедняк говорит с мольбой[a], а богач отвечает грубо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бедняк говорит с мольбами, а богач отвечает жёсткими словами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחֲנוּנִים
  choice: с мольбой
  rationale: Форма множественного числа обозначает настойчивые просьбы о благосклонности или милости. Русское «с мольбой» естественно передаёт манеру речи и сохраняет оттенок смиренной просьбы.
- source_word: יְדַבֶּר
  choice: говорит
  rationale: Порода пиэль глагола דבר обычно означает «говорить»; настоящее время уместно для обобщающего изречения.
- source_word: רָשׁ
  choice: бедняк
  rationale: Субстантивированное прилагательное обозначает бедного человека. «Бедняк» сохраняет единственное число и представительный характер образа.
- source_word: וְעָשִׁיר
  choice: а богач
  rationale: Союз ו формально значит «и», однако здесь вводит противопоставление. Русское «а» естественно выражает контраст, не усиливая его сверх текста.
- source_word: יַעֲנֶה
  choice: отвечает
  rationale: Глагол ענה в породе каль прямо означает «отвечать» и соответствует диалогическому строению изречения.
- source_word: עַזּוֹת
  choice: грубо
  rationale: Форма употреблена наречно и описывает ответ как жёсткий, резкий или дерзкий. «Грубо» естественно передаёт отрицательный оттенок в данном социальном контрасте.
