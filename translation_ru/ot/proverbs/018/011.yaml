base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/011.yaml
  text: A rich man's wealth is his strong city[a], and like a high wall in his imagination.
translation:
  language: ru
  text: Богатство богача — его крепкий город; в его представлении оно словно высокая стена.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в его мыслях», «в его восприятии». Еврейское слово обозначает образ или способ мысленно представлять что-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: богатство
  rationale: Обозначает материальное состояние или имущество; «богатство» естественно и точно передаёт обобщённый смысл.
- source_word: עָשִׁיר
  choice: богача
  rationale: Субстантивированное прилагательное означает богатого человека; форма мужского рода и единственного числа сохранена.
- source_word: קִרְיַת עֻזּוֹ
  choice: его крепкий город
  rationale: Буквально «город его силы»; «крепкий город» сохраняет образ защищённого укреплённого города и звучит естественно по-русски.
- source_word: וּכְחוֹמָה נִשְׂגָּבָה
  choice: словно высокая стена
  rationale: Сохраняет сравнение и основной пространственный смысл высокой, а потому труднодоступной стены, не усиливая его до «неприступной».
- source_word: בְּמַשְׂכִּיתוֹ
  choice: в его представлении
  rationale: Слово может обозначать образ, изображение или мысленное представление; здесь оно указывает на субъективное восприятие богатства как защиты, не обязательно приписывая богачу тщеславие.
theological_decisions:
- issue: Объективна ли защищённость, которую даёт богатство
  choice: Субъективность передана словами «в его представлении»
  alternative: Понять высокую стену как объективное описание силы богатства
  rationale: Заключительное בְּמַשְׂכִּיתוֹ связывает образ стены с восприятием богача; перевод сохраняет напряжение между кажущейся и действительной безопасностью, не превращая намёк в прямое осуждение.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура и параллелизм сохранены. «Богач» здесь нейтрально обозначает богатого человека, а не выражает само по себе порицание.
