  text: מָצָ֣א אִ֭שָּׁה מָ֣צָא ט֑וֹב וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/022.yaml
  text: He who finds a wife finds a good thing and obtains favor from Yahweh[a].
translation:
  language: ru
  text: Кто нашёл жену, тот нашёл благо и обрёл благоволение у Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто находит жену, тот находит добро и получает благоволение от Яхве». Еврейский текст использует форму мужского рода единственного числа в обобщённом, пословичном смысле.'
    reason: 'Лексическая и грамматическая альтернатива: настоящее время яснее показывает общую истину, а «добро» и «от Яхве» ближе воспроизводят форму еврейского текста.'
lexical_decisions:
- source_word: מָצָא
  choice: нашёл
  rationale: Перфект в форме мудрого изречения выражает общую истину; русский прошедший вид в конструкции «кто нашёл…, тот нашёл…» естественно передаёт афористический характер и сохраняет повтор.
- source_word: אִשָּׁה
  choice: жену
  rationale: В данном контексте слово обозначает супругу, а не женщину вообще.
- source_word: טוֹב
  choice: благо
  rationale: 'Субстантивированное прилагательное передано существительным «благо»: это кратко, естественно для русского изречения и сохраняет обобщённый смысл.'
- source_word: וַיָּפֶק
  choice: обрёл
  rationale: Здесь глагол означает получить или обрести; «обрёл» соответствует возвышенному, но современному регистру и хорошо сочетается с «благоволение».
- source_word: רָצוֹן
  choice: благоволение
  rationale: В отношении Яхве слово означает благосклонность, благоволение; выбранный вариант точно передаёт смысл и сохраняет достоинство стиля.
- source_word: מֵיְהוָה
  choice: у Яхве
  rationale: Предлог מִן указывает на источник полученного благоволения; русская конструкция «обрёл благоволение у» естественнее буквального «от». Имя יהוה передано как «Яхве».
- source_word: implicit subject of מָצָא
  choice: кто … тот
  rationale: Мужской род виден в слове «жену», тогда как русская пословичная конструкция «кто…, тот…» естественно передаёт невыраженное подлежащее и обобщённый характер высказывания.
theological_decisions:
- issue: Передача обобщённого подлежащего мужского рода
  choice: Кто нашёл жену, тот…
  alternative: Муж, нашедший жену…
  rationale: Еврейская форма имеет мужское единственное число и выступает как типичное мудрое изречение. Русская конструкция сохраняет мужскую ситуацию через «жену», не добавляя отсутствующего в оригинале существительного «мужчина».
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Характер благоволения
  choice: обрёл благоволение у Яхве
  alternative: получил от Яхве благодать
  rationale: «Благоволение» передаёт רָצוֹן без привнесения более специального богословского содержания слова «благодать».
translation_notes:
  register: Современный литературный русский с кратким афористическим ритмом. Повтор «нашёл» сохранён как заметная черта еврейского параллелизма; лексика dignified, но понятна обычному читателю.
