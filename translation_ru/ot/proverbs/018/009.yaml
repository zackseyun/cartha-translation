  text: Even one who is slack in his work is brother to a master of destruction[a].
translation:
  language: ru
  text: Даже тот, кто нерадив в своей работе, — брат разрушителю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брат человеку, связанному с разрушением». Еврейское выражение может обозначать человека, для которого разрушение или губительство характерно, или, более конкретно, того, кто разрушает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: тот
  rationale: В данном русском построении добавочно-усилительное значение частицы передаётся всей конструкцией «Кто… тот…»; отдельное «даже» звучало бы менее естественно и могло бы требовать явно названного объекта сопоставления.
- source_word: מִתְרַפֶּה
  choice: нерадив
  rationale: Причастная форма описывает человека, который допускает небрежность и слабость в исполнении дела. «Нерадив» кратко и естественно передаёт устойчивую характеристику, не сводя её только к лени.
- source_word: בִמְלַאכְתּוֹ
  choice: в своей работе
  rationale: Передаёт сферу проявления нерадивости; возвратное «своей» естественно соотносит работу с субъектом.
- source_word: אָח הוּא
  choice: тот брат
  rationale: Сохранена конкретная метафора родства, выражающая близость по характеру и последствиям поступков.
- source_word: לְבַעַל מַשְׁחִית
  choice: разрушителю
  rationale: Контекстуально естественное русское обозначение человека, несущего разрушение. Оно сохраняет личный референт и избегает неестественного буквального выражения «владельцу разрушения».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма и метафора братства сохранены. «Нерадив» выбрано как понятное, dignified обозначение виновной небрежности, а не простой неспособности.
