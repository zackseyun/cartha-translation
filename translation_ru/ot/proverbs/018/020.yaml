  text: מִ/פְּרִ֣י פִי אִ֭ישׁ תִּשְׂבַּ֣ע בִּטְנ֑/וֹ תְּבוּאַ֖ת שְׂפָתָ֣י/ו יִשְׂבָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/020.yaml
  text: From the fruit of a man's mouth his stomach is satisfied[a]; he is satisfied by the produce of his lips.
translation:
  language: ru
  text: От плода уст человека насыщается его живот; урожаем своих губ он насыщается.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּרִי
  choice: плодами
  rationale: Предлог מִן здесь допускает значение источника или средства. Творительный падеж естественно передаёт средство («плодами») и сохраняет образ плода.
- source_word: פִי
  choice: уст
  rationale: Слово פֶּה означает «рот, уста» и метонимически — речь. «Уста» сохраняет телесный образ, поэтический параллелизм с «губами» и достойный библейский регистр.
- source_word: אִישׁ
  choice: человека
  rationale: אִישׁ — существительное мужского рода в единственном числе, употреблённое здесь в обобщённом смысле. Русское «человека» естественно передаёт универсальную сентенцию без сужения смысла до одного пола.
- source_word: תִּשְׂבַּע / יִשְׂבָּע
  choice: насыщается / он насыщается
  rationale: שׂבע значит «насыщаться, быть сытым». Настоящее время соответствует характеру пословичного утверждения, а повтор корня сохранён в обоих полустишиях.
- source_word: בִּטְנוֹ
  choice: его чрево
  rationale: בֶּטֶן буквально обозначает живот или внутренность. «Чрево» сохраняет телесную метафору и допускает более широкий оттенок внутреннего существа, не сводя образ только к органу пищеварения.
- source_word: תְּבוּאַת
  choice: урожаем
  rationale: תְּבוּאָה означает урожай, плод, произведение земли. «Урожаем» ясно сохраняет земледельческую метафору и параллель с «плодами».
- source_word: שְׂפָתָיו
  choice: своих губ
  rationale: שָׂפָה буквально значит «губа» и метонимически указывает на речь. Возвратное «своих» естественно соотносит губы с подлежащим «он» и сохраняет буквальный образ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой («уста», «чрево»). Сохранены сельскохозяйственная и телесная метафоры, параллелизм «уста — губы» и повтор глагола שׂבע. Подразумеваемая мысль о последствиях речи не вынесена в перевод явно.
