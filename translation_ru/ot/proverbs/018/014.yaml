id: PRO.18.14
reference: Proverbs 18:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רֽוּחַ אִ֭ישׁ יְכַלְכֵּ֣ל מַחֲלֵ֑/הוּ וְ/ר֥וּחַ נְ֝כֵאָ֗ה מִ֣י יִשָּׂאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/014.yaml
  text: A man's spirit can sustain him in sickness[b][a], but a crushed spirit—who can bear it?
translation:
  language: ru
  text: Дух человека поддержит его в болезни[a], но сокрушённый дух — кто сможет вынести его?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поддержит его болезнь»; по смыслу также возможно: «поможет ему перенести болезнь».'
    reason: textual_clarification
  - marker: b
    text: 'Или: «но сломленный дух — кто сможет нести его?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: дух
  rationale: В обоих полустишиях речь идёт о внутренней жизненной силе и состоянии человека, а не о буквальном ветре или дыхании. Повтор слова «дух» сохраняет параллелизм.
- source_word: אִישׁ
  choice: человека
  rationale: Хотя еврейское אִישׁ имеет форму мужского рода, в данном изречении оно употреблено в обобщающем смысле. Русское «человек» естественно передаёт и форму, и представительный характер высказывания.
- source_word: יְכַלְכֵּל
  choice: поддержит
  rationale: Форма глагола от כלכל выражает способность поддерживать, обеспечивать стойкость. Русское будущее совершенного вида естественно для обобщающего изречения и не исключает оттенка способности.
- source_word: מַחֲלֵהוּ
  choice: его в болезни
  rationale: Буквальная конструкция допускает передачу «его болезнь», однако по смыслу дух поддерживает самого человека, когда тот болен. Формулировка «поддержит его в болезни» ясно и естественно передаёт эту связь.
- source_word: נְכֵאָה
  choice: сокрушённый
  rationale: Прилагательное обозначает дух поражённый, сломленный или подавленный. «Сокрушённый» сохраняет сильный образ и достоинство библейского стиля без излишней разговорности.
- source_word: מִי
  choice: кто сможет
  rationale: Вопросительное מִי вводит риторический вопрос; слово «сможет» естественно делает явным подразумеваемый оттенок способности.
- source_word: יִשָּׂאֶנָּה
  choice: вынести его
  rationale: נשא означает нести, поднимать или переносить. В контексте тяжёлого внутреннего состояния «вынести» передаёт смысл терпеливого несения, а местоимение относится к «духу».
theological_decisions:
- issue: Характер «духа» в стихе
  choice: Передать как внутреннюю жизненную силу и состояние человека, не уточняя, является ли это отдельной духовной сущностью.
  alternative: Истолковать «дух» строго как богословский термин о нематериальной части человека.
  rationale: Контекст мудрого изречения говорит прежде всего о внутренней стойкости и подавленности; еврейское רוּחַ допускает широкий смысл, который перевод не должен догматически сужать.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Повтор слова «дух» сохраняет еврейский параллелизм; риторическое тире подчёркивает резкий контраст между телесной болезнью и внутренней сокрушённостью.
