  source_fidelity: Перевод верно передаёт параллелизм и смысл еврейского текста. «Дух человека» адекватно передаёт רוּחַ אִישׁ в обобщающем смысле; «поддержит его в болезни» естественно раскрывает трудную конструкцию יְכַלְכֵּל מַחֲלֵהוּ, не выдавая её буквальный синтаксис за единственно возможное толкование. «Сокрушённый дух» хорошо соответствует רוּחַ נְכֵאָה, а «кто сможет вынести его?» сохраняет риторический вопрос и отсылку к духу.
