  terminology: «Дух» здесь удачно оставлен широким обозначением внутренней жизненной силы и состояния человека, без конфессионального сужения. «Сокрушённый» — точный и стилистически уместный выбор для נְכֵאָה. Передача אִישׁ словом «человека» корректна для русской обобщающей пословичной речи.
