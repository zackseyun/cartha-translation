  source_fidelity: 'Основная мысль передана верно: первый участник спора первоначально выглядит правым, пока появление и проверка со стороны другого не ставят это впечатление под вопрос. Однако «расспросит его» сужает חקר до устного опроса; глагол означает более широкое тщательное исследование или проверку. В сноске «тяжба» допустима, но несколько уже, чем רִיב, а «но» менее точно передаёт последовательность, выраженную второй строкой.'
