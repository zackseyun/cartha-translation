  yaml_path: translation/ot/proverbs/018/017.yaml
  text: The first to present his case seems right[a], until his neighbor comes and examines him.
translation:
  language: ru
  text: Первый, кто излагает свою сторону в споре, кажется правым[a], пока не придёт другой участник и тщательно не проверит его доводы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Первый в своём споре прав; потом приходит его ближний и исследует его».'
    reason: Более буквальная передача сохраняет прямое значение צַדִּיק («прав») и широкие значения רֵעֵהוּ («его ближний») и חֲקָרוֹ («исследует его, подвергает проверке»).
lexical_decisions:
- source_word: צַדִּיק
  choice: кажется правым
  rationale: Прилагательное буквально означает «праведен, справедлив, прав». В контексте разбирательства оно указывает на убедительность позиции первого говорящего до того, как её проверит другая сторона. Слово «кажется» передаёт подразумеваемую, но не выраженную отдельным словом предварительность такой оценки.
- source_word: הָרִאשׁוֹן
  choice: первый
  rationale: Обозначает того участника спора, который выступает первым; краткая передача сохраняет сопоставление с последующим приходом другого.
- source_word: בְּרִיבוֹ
  choice: кто излагает свою сторону в споре
  rationale: רִיב может означать спор, тяжбу или судебное дело. Такая формулировка естественно передаёт ситуацию, в которой первым выслушивают доводы одного участника, не ограничивая смысл формальным судом.
- source_word: יבא
  choice: придёт
  rationale: 'Сохранено обычное значение глагола «приходить»: после первого участника появляется другой, чтобы проверить сказанное.'
- source_word: רֵעֵהוּ
  choice: другой
  rationale: רֵעַ обычно значит «ближний, товарищ, другой человек». Здесь речь идёт о другой стороне спора; «другой» естественно передаёт контраст и не создаёт неуместного впечатления дружбы.
- source_word: וַחֲקָרוֹ
  choice: расспросит его
  rationale: חקר означает тщательно исследовать, проверять, допытываться. «Расспросит» передаёт проверку слов первого участника и допускает оттенок перекрёстного опроса, не вводя излишне специальной судебной терминологии.
theological_decisions:
- issue: Утверждает ли стих правоту первого участника или лишь описывает первоначальное впечатление?
  choice: «кажется правым» в основном тексте
  alternative: «прав»
  rationale: В еврейском тексте буквально стоит «праведен/прав», однако вторая строка показывает, что вывод ещё предстоит проверить. Основной перевод делает прагматический смысл ясным, а буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной логикой житейского изречения. «Излагает свою сторону» передаёт состязательный контекст без узкой юридической терминологии; «расспросит» звучит естественно и сохраняет идею тщательной проверки.
