  language: ru
  text: 'Глупец не находит удовольствия в разумении,

    а лишь в том, чтобы раскрывать своё сердце.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а лишь в том, чтобы обнаружить то, что у него на сердце». В библейском языке «сердце» означает внутренний мир человека — его мысли, намерения и склонности, а не только чувства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: не находит удовольствия
  rationale: Глагол חפץ выражает желание, благоволение или удовольствие; эта передача сохраняет волевой оттенок и естественно звучит в контексте изречения.
- source_word: כְּסִיל
  choice: глупец
  rationale: В Притчах это устойчивое обозначение человека нравственно и умственно неразумного и упрямого, а не просто малообразованного.
- source_word: תְבוּנָה
  choice: разумение
  rationale: Слово обозначает понимание, проницательность и способность здраво рассуждать; «разумение» сохраняет смысл и придаёт строке уместное достоинство.
- source_word: כִּי אִם
  choice: а лишь
  rationale: 'Оборот вводит резкое противопоставление с оттенком исключительности: удовольствие глупца не в разумении, а только в самовыражении.'
- source_word: בְּהִתְגַּלּוֹת
  choice: в том, чтобы высказать
  rationale: Инфинитив породы hitpael от גלה буквально связан с раскрытием или обнаружением. В данном контексте речь естественно передаётся как стремление высказать или выставить наружу внутреннее содержание.
- source_word: לִבּוֹ
  choice: то, что у него на сердце
  rationale: «Сердце» в древнееврейском охватывает мысли, намерения и склонности внутреннего человека, а не одни эмоции; развёрнутая конструкция естественна по-русски и не сводит смысл к чувствам.
