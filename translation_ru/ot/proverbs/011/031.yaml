  text: הֵ֣ן צַ֭דִּיק בָּ/אָ֣רֶץ יְשֻׁלָּ֑ם אַ֝֗ף כִּֽי רָשָׁ֥ע וְ/חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/031.yaml
  text: Look[a], if the righteous is repaid on earth, how much more the wicked and the sinner.
translation:
  language: ru
  text: Вот[a], праведнику воздаётся на земле — тем более нечестивому и грешнику.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поистине, праведнику будет воздано на земле». Еврейское הֵן может быть передано как «вот» или «поистине», а форма יְשֻׁלָּם допускает также будущее время.'
    reason: 'Лексическая и грамматическая альтернатива: הֵן вводит эмфатическое утверждение, а יְשֻׁלָּם может передаваться настоящим обобщённым или будущим временем.'
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт эмфатическое привлечение внимания и звучит естественно в современном литературном русском; значение «поистине» также возможно и отражено в сноске.
- source_word: צַדִּיק
  choice: праведнику
  rationale: Субстантивированное прилагательное в единственном числе передано обобщённо; дательный падеж обусловлен естественной русской конструкцией «кому воздаётся».
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Сохраняет более широкое значение אָרֶץ и общий характер нравственного наблюдения; вариант «в стране» возможен, но здесь менее вероятен.
- source_word: יְשֻׁלָּם
  choice: воздаётся
  rationale: Форма Pual от שלם обозначает получение должного воздаяния. Русское «воздаётся» не сужает смысл ни до награды, ни до наказания.
- source_word: אַף כִּי
  choice: тем более
  rationale: Ясно и естественно передаёт усилительный вывод a fortiori.
- source_word: רָשָׁע
  choice: нечестивому
  rationale: Обычное соответствие для субстантивированного רָשָׁע в литературе мудрости; сохраняет нравственно-религиозную окраску.
- source_word: וְחוֹטֵא
  choice: и грешнику
  rationale: Передаёт субстантивированное причастие как человека, для которого характерен грех, и сохраняет парную конструкцию с «нечестивому».
theological_decisions:
- issue: Характер воздаяния праведнику
  choice: Нейтральное «воздаётся», без уточнения, идёт ли речь о награде, наказании или более широком получении должного.
  alternative: «получает награду» или «несёт наказание»
  rationale: Еврейский глагол допускает широкое понятие воздаяния. Конкретизация сняла бы намеренную смысловую напряжённость и сузила пословицу.
- issue: Логическая связь между двумя частями
  choice: 'Сохранён вывод «тем более»: если воздаяние достигает праведника, тем несомненнее оно достигает нечестивого и грешника.'
  alternative: Понимать אַף כִּי лишь как простое добавление «а также».
  rationale: Сочетание אַף כִּי здесь естественно выражает усиление и аргумент от меньшего к большему.
translation_notes:
  register: Современный литературный русский с достоинством, присущим библейской мудрости. «Вот» сохраняет живую эмфазу без архаичного «се»; «воздаётся» удерживает смысловую широту исходного глагола.
