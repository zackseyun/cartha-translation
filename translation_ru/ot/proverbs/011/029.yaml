  yaml_path: translation/ot/proverbs/011/029.yaml
  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
translation:
  language: ru
  text: Кто навлекает беду на свой дом[a], тот унаследует ветер[b], а глупец будет слугой у мудрого сердцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «домом» здесь может подразумеваться не только жилище, но и семья или все домочадцы.
    reason: lexical_alternative
  - marker: b
    text: 'То есть останется ни с чем, получит лишь пустоту: в еврейском тексте «ветер» служит образом чего-то неуловимого и бесполезного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  choice: навлекает беду
  rationale: Причастие обозначает того, кто причиняет бедствие или вносит разлад. Выражение естественно по-русски и сохраняет активный, причинный смысл, не сужая его до полного разорения.
- source_word: בֵּיתוֹ
  choice: свой дом
  rationale: Еврейское слово может обозначать как дом, так и семью или домочадцев. «Свой дом» сохраняет конкретный образ оригинала и допускает более широкий семейный смысл.
- source_word: יִנְחַל
  choice: унаследует
  rationale: 'Глагол обычно означает получение наследства или владения. «Унаследует» сохраняет иронию: итогом разрушительного поведения оказывается ветер.'
- source_word: רוּחַ
  choice: ветер
  rationale: В данном контексте ветер служит образом чего-то неуловимого, пустого и бесполезного. Буквальный образ выразительнее толковательного «ничего».
- source_word: וְעֶבֶד
  choice: станет слугой
  rationale: В безглагольной части подразумевается итоговое положение глупца. «Станет слугой» естественно передаёт результат и не усиливает значение до юридического рабства.
- source_word: אֱוִיל
  choice: глупец
  rationale: Это обычное слово литературы мудрости для нравственно и практически неразумного человека; русское «глупец» соответствует стилю афоризма.
- source_word: לַחֲכַם־לֵב
  choice: мудрого сердцем
  rationale: Формулировка сохраняет еврейский образ сердца как средоточия внутреннего разумения и остаётся понятной в современном литературном русском языке.
