base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/028.yaml
  text: Whoever trusts in his wealth will fall[a], but the righteous will flourish like leaves.
translation:
  language: ru
  text: Кто полагается на своё богатство, тот падёт, а праведники будут процветать, подобно листве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как лист».'
    reason: 'лексическая альтернатива: עָלֶה стоит в единственном числе; «листва» — естественная русская собирательная передача растительного образа.'
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: надеется
  rationale: Причастие от בטח обозначает упование и уверенность, возлагаемые на что-либо; «надеется» естественно передаёт нравственный смысл предостережения.
- source_word: בְּעָשְׁרוֹ
  choice: на своё богатство
  rationale: עֹשֶׁר означает богатство или состояние; возвратное «своё» естественно передаёт притяжательный суффикс третьего лица.
- source_word: הוּא
  choice: тот
  rationale: Самостоятельное местоимение придаёт подлежащему выразительность; русская конструкция «кто… тот…» сохраняет этот акцент и обобщающий характер изречения.
- source_word: יִפֹּל
  choice: падёт
  rationale: Имперфект выражает закономерное следствие в мудром изречении; «падёт» сохраняет образ и не уточняет вид погибели сверх текста.
- source_word: וְכֶעָלֶה
  choice: а … как лист
  rationale: עָלֶה стоит в единственном числе и буквально означает «лист». В русском языке такой собирательно-представительный образ понятен, хотя возможна более свободная передача «словно листва».
- source_word: צַדִּיקִים
  choice: праведники
  rationale: Субстантивированное прилагательное во множественном числе прямо и естественно передаётся словом «праведники».
- source_word: יִפְרָחוּ
  choice: будут зеленеть
  rationale: פרח обозначает рост, распускание и цветение. В сочетании с образом листа «будут зеленеть» естественно выражает жизненность и процветание, сохраняя растительную метафору.
theological_decisions:
- issue: Обобщающий характер начального причастия мужского рода
  choice: Кто надеется на своё богатство, тот падёт
  alternative: Надеющийся на своё богатство падёт
  rationale: Еврейская форма грамматически мужского рода, но в жанре притчи имеет общий смысл. Конструкция «кто… тот…» естественно охватывает всякого человека и не вносит дополнительного учения.
- issue: Число и смысл растительного сравнения
  choice: как лист
  alternative: словно листва
  rationale: Сохраняется грамматическое единственное число עָלֶה и напряжение между множественным «праведники» и единичным образом. Более собирательная передача указана в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строением. «Падёт» придаёт изречению достойное библейское звучание без архаической тяжеловесности; растительная метафора сохранена.
