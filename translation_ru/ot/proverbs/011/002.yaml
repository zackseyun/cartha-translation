  text: בָּֽא זָ֭דוֹן וַ/יָּבֹ֣א קָל֑וֹן וְֽ/אֶת צְנוּעִ֥ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/002.yaml
  text: When arrogance comes[a], disgrace comes also, but with the humble is wisdom.
translation:
  language: ru
  text: Приходит высокомерие — приходит и позор, а со скромными — мудрость.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приходит гордость — тогда приходит стыд, а со смиренными — мудрость».'
    reason: Лексические варианты для זָדוֹן, קָלוֹן и צְנוּעִים; «тогда» явно передаёт последовательную связь второй глагольной формы.
lexical_decisions:
- source_word: בָּא
  choice: приходит
  rationale: Перфект глагола בוא в обобщающем изречении естественно передаётся настоящим временем; «приходит» сохраняет образ наступления.
- source_word: זָדוֹן
  choice: высокомерие
  rationale: Слово обозначает гордую самонадеянность и дерзкую надменность; «высокомерие» ясно выражает отрицательную нравственную оценку.
- source_word: וַיָּבֹא
  choice: приходит и
  rationale: 'Форма продолжает параллельную причинно-следственную связь: вслед за высокомерием приходит позор. Повтор глагола сохраняет лаконизм и ритм еврейской пословицы.'
- source_word: קָלוֹן
  choice: позор
  rationale: Слово указывает на бесчестье и публичный стыд; «позор» краток и естественен в современном русском языке.
- source_word: וְאֶת
  choice: а со
  rationale: В данной конструкции את выражает сопричастность или пребывание «с» кем-либо; союз «а» естественно обозначает контраст между двумя половинами стиха.
- source_word: צְנוּעִים
  choice: смиренными
  rationale: Форма называет скромных, сдержанных, не заносчивых людей. «Смиренные» прямо противопоставлены высокомерию, при этом возможный оттенок скромности отмечен в сноске.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное значение существительного; именная конструкция сохранена как «со смиренными — мудрость».
