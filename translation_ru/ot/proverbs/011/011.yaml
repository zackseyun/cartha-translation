  text: בְּ/בִרְכַּ֣ת יְ֭שָׁרִים תָּר֣וּם קָ֑רֶת וּ/בְ/פִ֥י רְ֝שָׁעִ֗ים תֵּהָרֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/011.yaml
  text: By the blessing of the upright a city is exalted[b][a], but by the mouth of the wicked it is torn down.
translation:
  language: ru
  text: Благословением праведных город возвышается[a], а устами нечестивых разрушается[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благодаря благословению праведных город поднимается».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «устами нечестивых»; этот образ указывает на разрушительную силу их речи.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּבִרְכַּת
  choice: Благословением
  rationale: Предлог בְּ передаёт средство или причину действия, а בְּרָכָה — «благословение». Творительный падеж сохраняет краткость параллельной конструкции и допускает как произнесённое благословение, так и благотворное влияние праведных.
- source_word: יְשָׁרִים
  choice: праведных
  rationale: יָשָׁר обозначает нравственно прямых, честных людей. «Праведных» естественно для русской литературы мудрости и сохраняет этическую силу слова, не сужая его до одной лишь честности в речи.
- source_word: תָּרוּם
  choice: возвышается
  rationale: Форма Qal от רוּם буквально выражает подъём или возвышение; применительно к городу может подразумевать укрепление, процветание и почёт. «Возвышается» сохраняет образ и смысловую широту.
- source_word: קָרֶת
  choice: город
  rationale: קֶרֶת означает город или поселение; «город» — точный и естественный русский эквивалент в общественном контексте пословицы.
- source_word: וּבְפִי
  choice: а устами
  rationale: Союз передаёт противопоставление, а בְּ указывает на средство. Буквальный образ «устами» сохраняет параллелизм с «благословением» и подчёркивает разрушительную силу речи.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: רָשָׁע в литературе мудрости обозначает нравственно порочных людей. «Нечестивых» — точный, ёмкий и традиционно понятный русский эквивалент.
- source_word: תֵּהָרֵס
  choice: разрушается
  rationale: Niphal от הרס выражает пассивное разрушение или ниспровержение. Возвратная форма «разрушается» естественно передаёт это значение и образует ясную антитезу слову «возвышается».
