source:
  edition: WLC
  text: תֻּמַּ֣ת יְשָׁרִ֣ים תַּנְחֵ֑/ם וְ/סֶ֖לֶף בּוֹגְדִ֣ים ו/שד/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/003.yaml
  text: The integrity of the upright guides them[b][a], but the crookedness of the treacherous destroys them.
translation:
  language: ru
  text: Цельность прямодушных ведёт их, а извращённость[a] вероломных губит их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «криводушие», «испорченность». Еврейское слово рисует нравственное искривление, противопоставленное прямоте.'
    reason: lexical_alternative
  - marker: b
    text: 'Последние слова можно передать также: «разоряет их» или «становится их погибелью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֻּמַּת
  choice: цельность
  rationale: Слово обозначает полноту и нравственную цельность характера. «Цельность» передаёт этический смысл, не создавая впечатления абсолютной безгрешности, возможного при переводе «непорочность».
- source_word: יְשָׁרִים
  choice: прямодушных
  rationale: Прилагательное обозначает нравственно прямых людей. «Прямодушные» сохраняет образ прямоты и естественно противопоставляется нравственной извращённости.
- source_word: תַּנְחֵם
  choice: ведёт их
  rationale: Каузативная форма глагола נחה означает «вести, направлять». Краткое «ведёт их» естественно звучит в афористическом параллелизме.
- source_word: סֶלֶף
  choice: извращённость
  rationale: Существительное передаёт идею искривления, искажения, нравственной испорченности. «Извращённость» сохраняет противопоставление прямодушию, не ограничивая смысл одним видом обмана.
- source_word: בּוֹגְדִים
  choice: вероломных
  rationale: Причастие характеризует тех, кто систематически поступает предательски и нарушает доверие. «Вероломные» подходит для общего наставления мудрости лучше, чем более узкое «предатели».
- source_word: ו/שד/ם
  choice: губит их
  rationale: Форма выражает разорение или уничтожение. «Губит их» ясно передаёт итоговую гибель и сохраняет лаконичность параллельной строки.
theological_decisions:
- issue: Причинная роль нравственного характера
  choice: Сохранено прямое утверждение, что цельность направляет прямодушных, а собственная извращённость губит вероломных.
  alternative: 'Ослабить причинность: «может направлять» или «ведёт к гибели».'
  rationale: Еврейский афоризм формулирует нравственную причинность категорически; добавление модальности ослабило бы его смысл.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным афористическим ритмом. Сохранены параллелизм и образное противопоставление нравственной прямоты и искривлённости; избегнуто слово «непорочность», которое здесь могло бы ошибочно подразумевать безгрешность.
