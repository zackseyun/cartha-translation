id: PRO.11.12
reference: Proverbs 11:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּז לְ/רֵעֵ֥/הוּ חֲסַר לֵ֑ב וְ/אִ֖ישׁ תְּבוּנ֣וֹת יַחֲרִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/012.yaml
  text: Whoever despises his neighbor lacks sense[c][b][a], but a man of understanding keeps silent.
translation:
  language: ru
  text: Кто презирает своего ближнего[a], тот лишён здравого смысла[b], а разумный человек[c] хранит молчание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «друга»; или: «товарища».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лишён сердца»; в древнееврейском это образное выражение означает недостаток здравого смысла или понимания.'
    reason: lexical_alternative
  - marker: c
    text: В древнееврейском употреблено существительное мужского рода в единственном числе, имеющее здесь обобщающий смысл.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: презирает
  rationale: Причастная форма обозначает того, кто относится к другому с презрением. «Презирает» кратко и точно передаёт нравственный смысл противопоставления.
- source_word: לְרֵעֵהוּ
  choice: своего ближнего
  rationale: רֵעַ может означать ближнего, друга или товарища. «Ближний» сохраняет широкий общественно-нравственный смысл, не ограничивая речь близкой дружбой.
- source_word: חֲסַר לֵב
  choice: лишён здравого смысла
  rationale: Буквально выражение означает «лишён сердца», но в древнееврейской антропологии сердце здесь является средоточием рассудительности и здравого суждения. Русский идиоматический перевод передаёт этот смысл без ложного акцента на чувствах.
- source_word: וְאִישׁ תְּבוּנוֹת
  choice: а разумный человек
  rationale: אִישׁ — существительное мужского рода в единственном числе, употреблённое в обобщающем смысле; формально множественное תְּבוּנוֹת выражает качество разумения или проницательности. «Разумный человек» естественно передаёт сочетание по-русски.
- source_word: יַחֲרִישׁ
  choice: хранит молчание
  rationale: Глагол означает молчать, не говорить. «Хранит молчание» подчёркивает намеренную сдержанность, составляющую контраст с презрительным отношением.
theological_decisions:
- issue: Обобщающее мужское единственное число в וְאִישׁ
  choice: разумный человек
  alternative: тот, кто разумен
  rationale: 'Перевод сохраняет выраженное существительным мужского рода обобщённое обозначение человека, но не сужает смысл до взрослых мужчин: пословица относится к любому разумному человеку.'
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным пословичным звучанием. Синтаксис сохраняет параллельное противопоставление двух типов поведения; архаизмы и конфессионально окрашенная терминология не используются.
