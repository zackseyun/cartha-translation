base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/013.yaml
  text: A gossip reveals a secret[b][a], but one who is faithful in spirit conceals a matter.
translation:
  language: ru
  text: 'Сплетник[a] разглашает тайну,

    а надёжный человек[b] хранит доверенное.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ходящий как разносчик слухов»; возможно: «клеветник».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «верный духом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  choice: сплетник
  rationale: 'Еврейское выражение буквально изображает того, кто «ходит» и разносит слухи или порочащие рассказы. В данном параллелизме речь шире, чем о заведомой клевете: человек разглашает доверенное ему. «Сплетник» естественно и кратко передаёт привычный характер такого поведения.'
- source_word: מְגַלֶּה
  choice: разглашает
  rationale: Причастие означает открывать, делать известным. При существительном «тайна» русский глагол «разглашает» точно передаёт сообщение посторонним конфиденциальных сведений.
- source_word: סּוֹד
  choice: тайну
  rationale: Хотя слово может обозначать доверительный совет или круг приближённых, противопоставление сокрытию дела указывает здесь на тайную, доверенную информацию.
- source_word: נֶאֱמַן רוּחַ
  choice: верный духом
  rationale: Сохранена выразительная антропологическая формулировка оригинала — буквально «верный духом». Она указывает на внутреннюю надёжность и сдержанность человека, не сводя выражение только к практической осторожности.
- source_word: מְכַסֶּה
  choice: скрывает
  rationale: Глагол буквально означает «покрывает», а здесь — не предаёт огласке и сохраняет в тайне. «Скрывает» сохраняет образное соответствие и остаётся понятным по-русски.
- source_word: דָבָר
  choice: дело
  rationale: Широкое слово может означать слово, вещь, обстоятельство или дело. В данном контексте «дело» сохраняет обобщённость оригинала и соотносится с доверительной информацией в первой строке.
