  source_fidelity: Первая строка точно передаёт הוֹלֵךְ רָכִיל и מְגַלֶּה סוֹד. Во второй строке «верный духом» формально близко к נֶאֱמַן רוּחַ, однако в современном русском это скорее характеризует душевную стойкость или убеждённость, чем надёжность и умение хранить доверенное. «Скрывает дело» также звучит как сокрытие какого-либо дела, в том числе неблаговидного, а не как проявление сдержанности. Предлагаемая формулировка передаёт смысл параллелизма без добавления доктринального толкования.
  naturalness: «Сплетник разглашает тайну» естественно и афористично. «Надёжный человек хранит доверенное» — современная литературная формулировка, естественно выражающая противопоставление разглашению тайны.
