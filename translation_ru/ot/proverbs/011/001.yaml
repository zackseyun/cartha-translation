  yaml_path: translation/ot/proverbs/011/001.yaml
  text: Dishonest scales are an abomination to Yahweh[a], but a full weight is his delight.
translation:
  language: ru
  text: 'Неверные весы — мерзость для Яхве,

    а полновесная гиря угодна ему.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «целый (или полный) камень» — каменная гиря полного, неискажённого веса, которой пользовались в торговле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹאזְנֵי מִרְמָה
  choice: неверные весы
  rationale: Сочетание буквально обозначает «весы обмана», то есть весы, которыми обманывают при торговле. «Неверные весы» естественно передаёт и предмет, и его мошенническое использование.
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Сильное нравственно-религиозное обозначение того, что отвратительно Богу; «мерзость» сохраняет резкость исходного слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אֶבֶן שְׁלֵמָה
  choice: точная гиря
  rationale: Буквально «полный/целый камень»; в торговом контексте это каменная гиря установленного, неискажённого веса. «Точная гиря» ясно передаёт функцию и нравственный контраст.
- source_word: רְצוֹנוֹ
  choice: Ему угодна
  rationale: Слово выражает благоволение, удовольствие или одобрение. Предикативная формулировка естественна по-русски и сохраняет противопоставление Божьей мерзости и Божьего одобрения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет это различие и не заменяет имя титулом.
- issue: Смысл רְצוֹנוֹ
  choice: Ему угодна
  alternative: Его радость; Его благоволение
  rationale: Контекст допускает оттенки удовольствия и благоволения. «Ему угодна» не превращает выражение ни исключительно в эмоцию, ни исключительно в даруемую милость, сохраняя общий смысл Божьего одобрения.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. Сохранены резкое слово «мерзость», торговый образ весов и гири, а также поэтическое противопоставление двух строк.
