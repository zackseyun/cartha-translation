id: PRO.11.23
reference: Proverbs 11:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: תַּאֲוַ֣ת צַדִּיקִ֣ים אַךְ ט֑וֹב תִּקְוַ֖ת רְשָׁעִ֣ים עֶבְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/023.yaml
  text: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
translation:
  language: ru
  text: Желание праведных — лишь добро, а надежда[a] нечестивых — гнев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ожидание».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ярость». В еврейском тексте не уточняется, чей именно гнев имеется в виду: это может быть яростное ожидание самих нечестивых или гнев, который постигнет их.'
    reason: alternative_reading
lexical_decisions:
- source_word: תַּאֲוַת
  choice: желание
  rationale: Существительное обозначает желание или стремление. «Желание» естественно по-русски и сохраняет именную форму и лаконизм еврейского текста.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе передано обычным для русского библейского языка обозначением нравственной категории.
- source_word: אַךְ
  choice: лишь
  rationale: Частица здесь имеет ограничительное значение. «Лишь» ясно выражает исключительность и соответствует краткости стиха.
- source_word: טוֹב
  choice: добро
  rationale: Субстантивированное «добро» естественно завершает именную конструкцию «желание… — лишь добро» и не добавляет отсутствующего в оригинале пояснения.
- source_word: תִּקְוַת
  choice: надежда
  rationale: Слово может означать надежду или ожидание. «Надежда» является естественным основным соответствием; вариант «ожидание» отмечен в сноске.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное передано традиционным и понятным нравственным обозначением, параллельным слову «праведных».
- source_word: עֶבְרָה
  choice: гнев
  rationale: Существительное обозначает сильный гнев, ярость. «Гнев» сохраняет весомость и краткость оригинала, не уточняя, чей именно это гнев.
theological_decisions:
- issue: Смысл заключительной части стиха
  choice: «надежда нечестивых — гнев» без указания носителя гнева
  alternative: «надежда нечестивых кончится Божьим гневом» или «надежда нечестивых — ярость»
  rationale: В еврейском тексте буквально сопоставлены «надежда нечестивых» и «гнев», но не сказано, чей это гнев и обозначает ли он содержание надежды или её итог. Именная конструкция сохраняет эту подлинную неоднозначность и не вводит прямо не названного субъекта.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконизмом, соответствующими жанру притчи. Параллельная именная структура обеих частей сохранена; богословская неоднозначность заключительного слова не устранена.
