  text: נֶ֣זֶם זָ֭הָב בְּ/אַ֣ף חֲזִ֑יר אִשָּׁ֥ה יָ֝פָ֗ה וְ/סָ֣רַת טָֽעַם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/022.yaml
  text: Like a gold ring in a pig’s snout is a beautiful woman who lacks discretion[a].
translation:
  language: ru
  text: Что золотое кольцо в носу у свиньи, то красивая женщина, лишённая рассудительности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что золотое носовое кольцо в носу у свиньи, то красивая женщина, отвернувшаяся от рассудительности».'
    reason: 'Сохраняет более явное значение носового украшения у נֶזֶם и передаёт динамический оттенок еврейского оборота וְסָרַת טָעַם: отступление от разумного суждения.'
lexical_decisions:
- source_word: נֶזֶם
  choice: кольцо
  rationale: Слово обозначает кольцо, в том числе носовое украшение; последующее «в рыле» ясно указывает на место, поэтому естественного русского «кольцо» достаточно.
- source_word: זָהָב
  choice: золотое
  rationale: Передаёт материал украшения и сохраняет резкий контраст между драгоценным предметом и свиньёй.
- source_word: בְּאַף חֲזִיר
  choice: в рыле свиньи
  rationale: אַף здесь означает нос; применительно к свинье современное русское «рыло» конкретно и выразительно.
- source_word: אִשָּׁה יָפָה
  choice: красивая женщина
  rationale: Брачный контекст отсутствует, поэтому אִשָּׁה передано как «женщина», а יָפָה — современным и прямым «красивая».
- source_word: וְסָרַת טָעַם
  choice: лишённая здравомыслия
  rationale: Оборот буквально описывает женщину, отступившую от טַעַם; в контексте литературы мудрости слово указывает на рассудительность, здравое суждение и разум, а не только на эстетический вкус.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением краткой, резкой формы сравнительной притчи. Конструкция «что… то…» естественно передаёт подразумеваемое еврейское сопоставление; «здравомыслие» звучит ясно и достойно, не сводя טַעַם к внешнему вкусу или манерам.
