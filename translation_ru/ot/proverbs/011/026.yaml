  text: מֹ֣נֵֽעַ בָּ֭ר יִקְּבֻ֣/הוּ לְא֑וֹם וּ֝/בְרָכָ֗ה לְ/רֹ֣אשׁ מַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/026.yaml
  text: The one who withholds grain—the people curse him[b][a], but blessing is on the head of the one who sells it.
translation:
  language: ru
  text: Кто удерживает зерно, того проклинает народ[a], а на голове у того, кто продаёт зерно[b], — благословение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «население»; еврейское לְאֹם может обозначать народ как общность или широкую публику.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «того, кто снабжает зерном». Еврейское причастие может подчёркивать обеспечение зерном, но в этом контексте обычно подразумевает его продажу в противоположность удержанию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹנֵעַ
  choice: кто придерживает
  rationale: Субстантивированное причастие описывает типичное, продолжающееся поведение; «придерживает» естественно передаёт намеренное удержание товара от продажи.
- source_word: בָּר
  choice: зерно
  rationale: Слово обозначает зерновые в общем, без неоправданного сужения до пшеницы.
- source_word: יִקְּבֻהוּ
  choice: того проклинает
  rationale: Форма от נקב здесь имеет значение произнесения проклятия; прямой русский эквивалент сохраняет силу выражения.
- source_word: לְאֹם
  choice: народ
  rationale: В контексте общественной реакции слово может обозначать народ или население как коллектив; «народ» кратко и естественно для афористического стиля.
- source_word: וּבְרָכָה
  choice: а ... благословение
  rationale: Союз ו формально соединительный, но антитетический параллелизм по-русски естественно выражается союзом «а».
- source_word: לְרֹאשׁ
  choice: на голове
  rationale: Сохранён конкретный древнееврейский образ благословения, пребывающего на голове человека.
- source_word: מַשְׁבִּיר
  choice: продающего
  rationale: Причастие породы hiphil от שׁבר в данном торговом контексте означает того, кто снабжает зерном посредством продажи; перевод не подменяет продажу благотворительной раздачей.
