  text: A kind man benefits himself[a], but a cruel man troubles his own flesh.
translation:
  language: ru
  text: 'Добрый человек приносит пользу самому себе,

    а жестокий причиняет вред собственной плоти[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собственному телу»; возможно также: «своим родным», если שְׁאֵרוֹ понимать как обозначение кровных родственников, а не плоти или тела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּמֵל
  choice: делает добро
  rationale: Причастие от גמל здесь обозначает благотворное действие. «Делает добро» естественно передаёт смысл и сохраняет словесную связь с нравственным качеством человека.
- source_word: נַפְשׁוֹ
  choice: самому себе
  rationale: נפש может означать душу, жизнь или самого человека. В данном параллелизме речь, вероятнее всего, о пользе для собственной личности, поэтому выбрано естественное возвратное выражение без искусственного антропологического уточнения.
- source_word: אִישׁ חָסֶד
  choice: милосердный человек
  rationale: Здесь חסד характеризует человека как доброго, благожелательного и милосердного, а не служит специальным обозначением заветной верности. «Милосердный человек» звучит естественно и достойно.
- source_word: עֹכֵר
  choice: причиняет вред
  rationale: עכר означает навлекать беду, тревожить или вредить. В этом контексте «причиняет вред» ясно выражает пагубное воздействие и образует точную антитезу первой строке.
- source_word: שְׁאֵרוֹ
  choice: собственной плоти
  rationale: שְׁאֵר может обозначать плоть, тело или кровного родственника. В параллели с נַפְשׁוֹ наиболее вероятно значение собственной плоти или тела; буквальный образ сохранён, а лексическая неоднозначность отмечена в сноске.
- source_word: אַכְזָרִי
  choice: жестокий
  rationale: Прилагательное употреблено субстантивно и обозначает жестокого человека. В русском языке эллиптическое «жестокий» естественно в параллельной конструкции и не требует повторения слова «человек».
