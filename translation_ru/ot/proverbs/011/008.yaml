  yaml_path: translation/ot/proverbs/011/008.yaml
  text: The righteous is rescued from trouble[a], and the wicked comes in his place.
translation:
  language: ru
  text: Праведник избавляется от беды, а нечестивый оказывается на его месте.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместо него»; еврейское выражение может обозначать замещение, подразумевая, что нечестивый попадает в беду вместо праведника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе обозначает праведного человека; «праведник» естественно сохраняет представительный единственный образ.
- source_word: מִצָּרָה
  choice: от беды
  rationale: Предлог מִן выражает удаление или избавление, а צָרָה — беду, несчастье или тяжёлое положение; «от беды» кратко и естественно для русской притчи.
- source_word: נֶחֱלָץ
  choice: избавлен
  rationale: Форма нифаль передаёт пассивное избавление. «Избавлен» сохраняет это значение, не приписывая праведнику самостоятельного бегства.
- source_word: וַיָּבֹא
  choice: попадает
  rationale: Буквально глагол означает «приходит», но вместе с תַּחְתָּיו в русском естественно передаётся как «попадает на его место», подразумевая вступление нечестивого в положение праведника.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное образует традиционную и ясную смысловую пару с «праведником».
- source_word: תַּחְתָּיו
  choice: на его место
  rationale: 'תַּחַת с местоименным суффиксом здесь выражает замещение: нечестивый оказывается на месте праведника. Формулировка сохраняет краткость и некоторую недосказанность оригинала.'
theological_decisions:
- issue: Характер перемены участи праведника и нечестивого
  choice: 'Передать общий принцип перемены: праведник избавляется, а нечестивый занимает его место.'
  alternative: Уточнить, что нечестивый попадает именно в ту самую беду, из которой был избавлен праведник.
  rationale: Еврейское תַּחְתָּיו допускает конкретное замещение, однако стих не объясняет механизм и время этой перемены. Основной текст сохраняет лаконичность и напряжение, а сноска раскрывает возможный более конкретный смысл.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены представительные единственные образы и противопоставление «праведник — нечестивый».
