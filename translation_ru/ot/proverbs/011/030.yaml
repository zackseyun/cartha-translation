  yaml_path: translation/ot/proverbs/011/030.yaml
  text: The fruit of the righteous is a tree of life[a], and he who wins souls is wise.
translation:
  language: ru
  text: Плод праведника — дерево жизни, и тот, кто привлекает людей, мудр.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а берущий души мудр». Еврейское слово, переданное как «души», может означать также людей или жизни; буквально употреблён глагол «берёт». В данном контексте выражение может означать приобретать расположение людей или оказывать на них влияние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי
  choice: плод
  rationale: Сохраняет исходную метафору и допускает как буквальный, так и переносный смысл результата жизни и дел праведника.
- source_word: צַדִּיק
  choice: праведника
  rationale: Субстантивированное прилагательное передано родительным падежом в естественной русской конструкции; единственное число сохраняет обобщающий характер еврейского выражения.
- source_word: עֵץ חַיִּים
  choice: дерево жизни
  rationale: Сохраняет устойчивый библейский образ и его связи с другими местами Притч и Бытия, не сводя его к пояснительному выражению «животворное дерево».
- source_word: וְלֹקֵחַ
  choice: а кто привлекает к себе
  rationale: Причастие от לקח буквально означает «берущий», но в сочетании с обозначением людей буквальный русский перевод звучал бы как присвоение или насилие. Выбранная формулировка передаёт вероятный смысл приобретения расположения и влияния на людей; союз «а» естественно связывает две части афоризма без навязывания резкого противопоставления.
- source_word: נְפָשׂוֹת
  choice: людей
  rationale: נפשׁ во множественном числе может обозначать людей, личности или жизни, а не только нематериальные «души». «Людей» ясно передаёт референт и не вносит более поздний узкий смысл обращения душ.
- source_word: חָכָם
  choice: тот мудр
  rationale: Передаёт предикативное значение прилагательного и сохраняет оценочный вывод второй половины стиха в естественной русской форме.
theological_decisions:
- issue: Смысл выражения «берущий души» в контексте литературы мудрости
  choice: Передано как «кто привлекает к себе людей», то есть приобретает их расположение или оказывает на них влияние.
  alternative: «кто приобретает души»; «кто берёт жизни»; «кто завоёвывает души»
  rationale: Еврейское выражение само по себе не указывает специально на евангелизацию или религиозное обращение. Основной текст передаёт вероятный положительный смысл мудрого влияния, а сноска сохраняет буквальный образ и реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной синтаксической формой. Сохранён высокий библейский образ «дерево жизни», но выражение о נפשות передано без конфессионально окрашенного оборота «завоёвывать души». Буквальная неоднозначность отмечена в сноске.
