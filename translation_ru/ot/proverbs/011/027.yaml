  text: שֹׁ֣חֵֽר ט֭וֹב יְבַקֵּ֣שׁ רָצ֑וֹן וְ/דֹרֵ֖שׁ רָעָ֣ה תְבוֹאֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/027.yaml
  text: Whoever diligently seeks good seeks favor[c][b][a], but evil comes to the one who searches for it.
translation:
  language: ru
  text: Кто усердно ищет добра[a], тот ищет благоволения[b], а кто стремится ко злу — того оно и постигнет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто с раннего утра ищет добра»; еврейский глагол может подразумевать ревностный, усердный или ранний поиск.'
    reason: lexical_alternative
  - marker: b
    text: «Благоволение» может означать одобрение, принятие или доброе расположение — Бога, людей либо и Бога, и людей.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «зло придёт к нему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחֵר
  choice: усердно ищет
  rationale: Причастие передаёт настойчивый, ревностный поиск; «усердно ищет» естественно выражает эту интенсивность по-русски, не сводя значение к буквальному «ищет рано».
- source_word: טוֹב
  choice: добра
  rationale: Прилагательное употреблено субстантивированно и обозначает добро или то, что хорошо; форма «добра» кратка и сохраняет широкий нравственно-практический смысл.
- source_word: יְבַקֵּשׁ
  choice: ищет
  rationale: Обычный глагол поиска; повтор «ищет» поддерживает словесную связь внутри первой половины стиха.
- source_word: רָצוֹן
  choice: благоволения
  rationale: Слово может обозначать расположение, одобрение или принятие, не называя их источник. «Благоволение» сохраняет эту широту и достойный регистр.
- source_word: וְדֹרֵשׁ
  choice: а кто стремится
  rationale: Союз вводит антитезу, поэтому передан как «а». Глагол означает искать, добиваться или настойчиво стремиться к чему-либо; «стремится» естественно отличает его от повторяющегося в первой строке корня בקש.
- source_word: רָעָה
  choice: ко злу
  rationale: Существительное охватывает как нравственное зло, так и причиняемую им беду. «Зло» сохраняет намеренную смысловую широту.
- source_word: תְבוֹאֶנּוּ
  choice: на того оно и придёт
  rationale: Форма означает «оно придёт к нему/настигнет его»; местоимение «оно» отсылает к злу, а частица «и» подчёркивает закономерное возвращение искомого к ищущему.
theological_decisions:
- issue: Источник благоволения в רָצוֹן
  choice: 'Источник не уточнён: «благоволения».'
  alternative: Божьего благоволения; расположения людей; одобрения.
  rationale: Еврейский текст не называет носителя благоволения, поэтому перевод сохраняет возможность как божественного, так и человеческого расположения.
- issue: Смысл רָעָה во второй половине
  choice: Сохранено широкое «зло», которое может означать и нравственное зло, и постигшее человека бедствие.
  alternative: беда; несчастье; вред
  rationale: Антитеза добру поддерживает нравственный смысл, тогда как глагол «придёт» допускает также зло как последствие или бедствие; перевод не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Синтаксический параллелизм и противопоставление сохранены; формулировка понятна обычному читателю, но остаётся достаточно возвышенной для библейской книги мудрости.
