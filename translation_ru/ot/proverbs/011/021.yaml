  text: יָ֣ד לְ֭/יָד לֹא יִנָּ֣קֶה רָּ֑ע וְ/זֶ֖רַע צַדִּיקִ֣ים נִמְלָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/021.yaml
  text: Hand to hand[a], the evil will not go unpunished, but the offspring of the righteous will escape.
translation:
  language: ru
  text: Рука к руке[a] — злой не останется без наказания, а потомство праведных спасётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Рука к руке». Вероятно, это выражение означает «несомненно» и подчёркивает твёрдую уверенность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד לְיָד
  choice: Рука к руке
  rationale: Сохранён буквальный и несколько загадочный образ еврейского выражения; вероятный смысл уверенности пояснён в сноске.
- source_word: יִנָּקֶה
  choice: не останется без наказания
  rationale: Nifal глагола נקה здесь означает избежать наказания или остаться ненаказанным; русская формулировка естественно передаёт нравственно-судебный смысл.
- source_word: רָע
  choice: злой
  rationale: Мужская форма единственного числа употреблена субстантивированно и обозначает злого человека; краткое «злой» сохраняет форму оригинала без добавления отсутствующего существительного.
- source_word: וְזֶרַע
  choice: а потомство
  rationale: זֶרַע в данном контексте означает потомство; союз передан противительным «а», поскольку две части пословицы противопоставлены.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе естественно передаётся родительным «праведных».
- source_word: נִמְלָט
  choice: спасётся
  rationale: Глагол допускает значения избавления и бегства от опасности; «спасётся» кратко и естественно, не уточняя, от какого именно бедствия будет избавлено потомство.
theological_decisions:
- issue: Значение идиомы יָד לְיָד
  choice: Сохранить буквальный образ «Рука к руке» в основном тексте
  alternative: «Несомненно» или «будь уверен»
  rationale: Идиома не вполне прозрачна. Буквальная передача сохраняет образ и неоднозначность оригинала, а вероятный усилительный смысл указывается в сноске.
- issue: Субстантивированное רָע мужского рода
  choice: «злой»
  alternative: «злой человек» или «нечестивый»
  rationale: «Злой» отражает грамматически мужское единственное число и не добавляет слова «человек»; при этом речь ясно идёт о представителе определённого нравственного типа.
- issue: Характер избавления в נִמְלָט
  choice: Не уточнять источник и вид избавления
  alternative: «будет избавлено от суда»
  rationale: Оригинал не называет прямо ни бедствие, ни суд; перевод сохраняет эту содержательную открытость.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Синтаксическое противопоставление двух частей и образность еврейской идиомы сохранены.
