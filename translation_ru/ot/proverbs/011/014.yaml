  text: בְּ/אֵ֣ין תַּ֭חְבֻּלוֹת יִפָּל עָ֑ם וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/014.yaml
  text: Without guidance a people falls[a], but in an abundance of counselors there is deliverance.
translation:
  language: ru
  text: Без руководства народ падёт, а при множестве советников — спасение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Где нет руководства, народ падает, а при множестве советников — безопасность (или победа)».'
    reason: תַּחְבֻּלוֹת может означать руководство, направление или стратегию; נפל — падать, а в контексте также терпеть крах; תְּשׁוּעָה — спасение, избавление, безопасность или победу.
lexical_decisions:
- source_word: בְּאֵין
  choice: Без
  rationale: Сочетание ב с אֵין выражает отсутствие условия или средства; «без» кратко и естественно передаёт этот смысл.
- source_word: תַּחְבֻּלוֹת
  choice: мудрого руководства
  rationale: Слово обозначает умелое руководство, продуманное направление или стратегические советы. «Мудрое руководство» естественно в контексте Притч и сохраняет отличие от «советников» во второй строке.
- source_word: יִפָּל
  choice: падёт
  rationale: Сохранён прямой образ еврейского נפל «падать», который в данном контексте также подразумевает крах или поражение.
- source_word: עָם
  choice: народ
  rationale: עָם означает «народ» или «нация»; неопределённый обобщающий смысл в русском естественно передаётся существительным без артикля.
- source_word: וּתְשׁוּעָה
  choice: а … спасение
  rationale: תְּשׁוּעָה охватывает спасение, избавление, безопасность или победу. «Спасение» сохраняет широту слова, а тире отражает безглагольную конструкцию.
- source_word: בְּרֹב
  choice: при множестве
  rationale: 'Оборот выражает обстоятельство: избавление обретается там, где советников много. «При множестве» звучит естественно и сохраняет акцент на многочисленности.'
- source_word: יוֹעֵץ
  choice: советников
  rationale: Хотя форма морфологически единственного числа, сочетание с רֹב имеет собирательный смысл и по-русски требует множественного числа.
