  text: בְּ/מ֤וֹת אָדָ֣ם רָ֭שָׁע תֹּאבַ֣ד תִּקְוָ֑ה וְ/תוֹחֶ֖לֶת אוֹנִ֣ים אָבָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/007.yaml
  text: When a wicked man dies[a], his hope perishes, and the expectation of wealth comes to nothing.
translation:
  language: ru
  text: Когда умирает нечестивец, гибнет его надежда, и ожидание богатства исчезает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово «оним» трудно для однозначного понимания. Возможны также переводы: «ожидание силы» или «ожидание сильных».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת
  choice: когда умирает
  rationale: Предлог ב с инфинитивом מות образует придаточное времени; такая передача естественна по-русски и точно выражает временное отношение.
- source_word: אָדָם רָשָׁע
  choice: нечестивый
  rationale: В контексте притчи сочетание обозначает отдельного нечестивого человека. Субстантивированное «нечестивый» естественно для русского библейского стиля и не требует избыточного слова «человек».
- source_word: תֹּאבַד
  choice: гибнет
  rationale: Форма от אבד означает утрату, исчезновение или гибель; «гибнет» сохраняет серьёзность и афористичность высказывания.
- source_word: תִּקְוָה
  choice: надежда
  rationale: Основное значение слова — «надежда». Притяжательное «его» ясно из контекста и делает русскую фразу естественной.
- source_word: וְתוֹחֶלֶת
  choice: и ожидание
  rationale: «Ожидание» сохраняет отличие תוחלת от близкого по смыслу תקוה и передаёт синонимический параллелизм без полного повторения.
- source_word: אוֹנִים
  choice: возлагаемое на силу
  rationale: Трудная форма, вероятнее всего связанная с און в значении силы или мощи. Оборот передаёт ожидание, основанное на силе, но не скрывает неоднозначность, отмеченную в сноске.
- source_word: אָבָדָה
  choice: исчезает
  rationale: Повторный глагол от אבד передан близким синонимом, чтобы сохранить общий смысл обоих полустиший без тяжёлого русского повтора.
theological_decisions:
- issue: Чья надежда гибнет
  choice: его надежда
  alternative: надежда без указания обладателя
  rationale: Хотя местоимение в еврейском тексте отсутствует, параллелизм естественно связывает надежду с умирающим нечестивым. Добавление «его» проясняет синтаксис, не вводя отдельного богословского утверждения.
- issue: Толкование אוֹנִים
  choice: сила, на которую возлагают ожидание
  alternative: ожидание сильных; богатство или ресурсы
  rationale: Еврейское слово допускает связь с силой/мощью, а также понимание как обозначения сильных; в некоторых контекстах сила может подразумевать материальные ресурсы. Основной текст сохраняет наиболее прямую лексическую связь с силой, а реальные альтернативы вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и афористичной формой, подходящей для книги Притч. Синонимический параллелизм сохранён посредством слов «надежда» и «ожидание», а лексическая неоднозначность אוֹנִים не устранена молча.
