  text: צִדְקַ֣ת יְ֭שָׁרִים תַּצִּילֵ֑/ם וּ֝/בְ/הַוַּ֗ת בֹּגְדִ֥ים יִלָּכֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/006.yaml
  text: The righteousness of the upright rescues them[a], but the treacherous are caught by their own desire.
translation:
  language: ru
  text: Праведность прямодушных спасает их, а вероломные попадутся из-за собственной пагубной страсти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а вероломные попадутся в своём бедствии»; возможно также: «из-за собственной гибели». Еврейское существительное может обозначать как пагубную страсть или желание, так и бедствие или гибель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: праведность
  rationale: Форма сопряжённого состояния от צְדָקָה обозначает нравственную правоту и соответствующий образ жизни; «праведность» естественно сохраняет этический термин Книги Притч.
- source_word: יְשָׁרִים
  choice: прямодушных
  rationale: Слово обозначает нравственно прямых, честных людей. Субстантивированное «прямодушные» сохраняет образ внутренней прямоты и здесь звучит естественнее, чем буквальное «прямые».
- source_word: תַּצִּילֵם
  choice: спасает их
  rationale: Hiphil от נצל означает избавлять или вырывать из опасности. «Спасает» кратко и ясно передаёт действие, не требуя здесь специального богословского смысла.
- source_word: וּבְהַוַּת
  choice: из-за собственной пагубной страсти
  rationale: הַוָּה допускает значения разрушительного желания и бедствия или гибели. Основной текст передаёт первое значение, а «пагубной» сохраняет присущий слову разрушительный оттенок; ב понято как указание на причину или средство.
- source_word: בֹּגְדִים
  choice: вероломные
  rationale: Причастие от בגד характеризует людей, поступающих предательски и неверно. «Вероломные» передаёт устойчивый тип поведения, не сужая смысл до политической измены.
- source_word: יִלָּכֵדוּ
  choice: попадутся
  rationale: Niphal от לכד означает быть пойманным или угодить в западню. «Попадутся» естественно сочетается с причиной, названной далее, и сохраняет образ самоуловления.
theological_decisions:
- issue: Двусмысленность הַוָּה
  choice: В основном тексте — разрушительная внутренняя страсть, которая становится причиной западни.
  alternative: «В своём бедствии» или «из-за собственной гибели».
  rationale: Контекст с יִלָּכֵדוּ хорошо поддерживает образ желания, заманивающего человека в ловушку, однако лексическая возможность значения «бедствие/гибель» подлинна и потому сохранена в примечании, без догматического разрешения двусмысленности.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. «Прямодушные» и «вероломные» сохраняют противопоставление нравственных типов; примечание удерживает смысловую неоднозначность редкого существительного הַוָּה.
