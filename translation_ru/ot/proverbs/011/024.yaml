source:
  edition: WLC
  text: יֵ֣שׁ מְ֭פַזֵּר וְ/נוֹסָ֥ף ע֑וֹד וְ/חוֹשֵׂ֥ךְ מִ֝/יֹּ֗שֶׁר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/024.yaml
  text: There is one who scatters[a], yet gains still more; and one who withholds more than is right, but only to poverty.
translation:
  language: ru
  text: Иной щедро раздаёт — и у него всё прибавляется; другой удерживает сверх должного[a] — и приходит лишь к нужде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение допускает разные толкования: «удерживает больше, чем следует» или «удерживает то, что по справедливости следовало бы отдать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: иной
  rationale: Конструкция вводит обобщённый тип человека, а не конкретное лицо; «иной» естественно передаёт это в русском афористическом стиле.
- source_word: מְפַזֵּר
  choice: щедро раздаёт
  rationale: Причастие буквально означает «рассыпает, рассеивает», а в данном противопоставлении описывает щедрую раздачу. Перевод сохраняет образ открытой руки без неестественной буквальности.
- source_word: וְנוֹסָף עוֹד
  choice: и у него всё прибавляется
  rationale: 'Форма от יסף выражает дальнейшее прибавление. Такая формулировка сохраняет парадокс: раздающий не оскудевает, а получает ещё больше, не уточняя механизма прибавления.'
- source_word: וְחוֹשֵׂךְ
  choice: другой удерживает
  rationale: Глагол означает «удерживать, не отдавать» и образует прямое противопоставление щедрой раздаче.
- source_word: מִיֹּשֶׁר
  choice: сверх должного
  rationale: Трудное выражение связано с прямотой, правильностью или тем, что уместно. В контексте оно, вероятнее всего, обозначает удерживание больше допустимого; неоднозначность отмечена в сноске.
- source_word: אַךְ לְמַחְסוֹר
  choice: и приходит лишь к нужде
  rationale: אַךְ ограничивает итог словом «лишь», а מַחְסוֹר обозначает недостаток, нужду. Перевод ясно передаёт иронический результат чрезмерной скупости.
theological_decisions:
- issue: Характер обещанного прибавления
  choice: Не уточнять, является ли прибавление непосредственной материальной наградой или общим жизненным итогом щедрости.
  alternative: Передать как безусловное обещание материального обогащения.
  rationale: Еврейский текст говорит о прибавлении, но не называет его источник, способ или исключительно материальный характер; перевод сохраняет широту мудрого изречения.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Параллелизм двух типов поведения сохранён; тире подчёркивает парадоксальные последствия. Буквальное «рассыпает» заменено естественным «щедро раздаёт», тогда как смысловая неоднозначность מִיֹּשֶׁר вынесена в сноску.
