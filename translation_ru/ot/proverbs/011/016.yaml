lexical_decisions:
- source_word: אֵשֶׁת חֵן
  choice: благодатная женщина
  rationale: Сочетание буквально означает «женщина благодати/благоволения». «Благодатная» сохраняет нравственно положительный смысл חֵן и не сводит его к внешнему обаянию.
- source_word: תִּתְמֹךְ
  choice: обретает
  rationale: Основное значение תמך — «держать, поддерживать, удерживать», но в данном параллелизме глагол, вероятно, описывает овладение или обеспечение чего-либо. «Обретает» естественно передаёт этот смысл, не исключая оттенка удержания, отмеченного в сноске.
- source_word: כָּבוֹד
  choice: почёт
  rationale: Здесь כָּבוֹד обозначает общественное уважение и высокое положение, а не зримую славу. «Почёт» ясно выражает этот смысл и образует контраст с материальным богатством.
- source_word: עָרִיצִים
  choice: безжалостные люди
  rationale: Слово обозначает жестоких, насильственных или притесняющих людей. «Безжалостные люди» передаёт нравственную характеристику, не сужая значение до политических тиранов и не добавляя в еврейский текст указания исключительно на мужчин.
- source_word: יִתְמְכוּ
  choice: обретают
  rationale: Повтор того же глагола תמך передан тем же русским глаголом, чтобы сохранить формальный параллелизм двух частей стиха.
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Обычное обозначение материального достатка; современное и ясное соответствие, хорошо сопоставимое с «почётом».
