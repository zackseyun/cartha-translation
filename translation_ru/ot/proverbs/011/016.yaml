translation:
  language: ru
  text: Приветливая женщина удерживает почёт, а жестокие люди удерживают богатство.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приветливая женщина крепко держится за почёт, а жестокие люди — за богатство». Еврейский глагол в обеих частях буквально означает «держать, поддерживать»; в данном контексте он может также подразумевать приобретение или обеспечение обладания.'
