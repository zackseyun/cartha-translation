  terminology: «Праведность» — уместная передача צְדָקָה; примечание корректно отмечает допустимые смысловые оттенки «справедливость» и «праведное поведение», не навязывая толкования. «День гнева» сохраняет образ и богословскую открытость оригинала. Имена и специальные наименования отсутствуют.
