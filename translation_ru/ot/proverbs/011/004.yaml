id: PRO.11.4
reference: Proverbs 11:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹא יוֹעִ֣יל ה֭וֹן בְּ/י֣וֹם עֶבְרָ֑ה וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/004.yaml
  text: Wealth is of no use on the day of wrath[c][b][a], but righteousness delivers from death.
translation:
  language: ru
  text: Богатство[c] не поможет в день гнева[a], а праведность[b] избавит от смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «День гнева» может означать в широком смысле время суда или бедствия; изречение не уточняет, о каком именно дне идёт речь.
    reason: alternative_reading
  - marker: b
    text: 'Или: «справедливость», «праведное поведение».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Богатства не принесут пользы в день гнева».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: богатство
  rationale: Слово обозначает материальное состояние, имущество или богатства. Единственное число «богатство» естественно в современном русском языке и сохраняет собирательный смысл еврейского слова.
- source_word: יוֹעִיל
  choice: не поможет
  rationale: Hiphil глагола יעל означает «приносить пользу, помогать, быть полезным». «Не поможет» кратко и естественно передаёт бессилие богатства в названный момент.
- source_word: בְּיוֹם עֶבְרָה
  choice: в день гнева
  rationale: Предлог בְּ обозначает время, а עֶבְרָה — гнев или ярость. Формулировка сохраняет выразительный образ решающего времени суда, не уточняя, идёт ли речь об эсхатологическом суде или о бедствии.
- source_word: צְדָקָה
  choice: праведность
  rationale: צְדָקָה может обозначать праведность, справедливость и праведное поведение. «Праведность» сохраняет ключевой термин и хорошо соответствует нравственно-богословскому языку Притч.
- source_word: תַּצִּיל
  choice: избавит
  rationale: Hiphil корня נצל означает спасать, избавлять или вырывать из опасности. «Избавит» точно сочетается с выражением «от смерти» и сохраняет параллелизм изречения.
- source_word: מִמָּוֶת
  choice: от смерти
  rationale: Это прямое соответствие еврейскому выражению; перевод не сужает его до одной лишь смертельной опасности и не расширяет до позднейшей сотериологической системы.
theological_decisions:
- issue: Смысл выражения «день гнева»
  choice: Решающее время суда или бедствия без дальнейшего уточнения
  alternative: Эсхатологический день Божьего суда; либо обычное время человеческой ярости и бедствия
  rationale: Контекст допускает связь с судом, однако само изречение не определяет ни действующего субъекта гнева, ни точной временной перспективы. Перевод сохраняет эту открытость.
- issue: Смысл утверждения «праведность избавит от смерти»
  choice: Прямое утверждение мудростной традиции о спасительной силе праведности
  alternative: Практическая добропорядочность оберегает от гибельных последствий; либо заветная праведность ведёт к Божьему избавлению
  rationale: Текст не объясняет механизм избавления и не формулирует техническое учение об оправдании. Поэтому перевод воспроизводит утверждение без привнесения позднейших богословских разграничений.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура и противопоставление двух полустиший сохранены. Лексика понятна широкому кругу читателей и при этом остаётся достаточно возвышенной для библейского текста.
