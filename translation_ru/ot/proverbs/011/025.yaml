  text: A generous person will be enriched[b][a], and whoever refreshes others will himself be refreshed.
translation:
  language: ru
  text: Щедрый человек будет жить в достатке,[a] и кто напояет других, тот и сам будет напоён.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа благословения будет утучнена» — образ изобилия, благополучия и процветания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, передавая переносный смысл: «кто освежает других, тот и сам будет освежён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ בְּרָכָה
  choice: щедрый человек
  rationale: נֶפֶשׁ здесь обозначает человека в целом, а בְּרָכָה характеризует его как несущего другим благословение и благо. «Щедрый человек» естественно передаёт смысл выражения по-русски.
- source_word: תְדֻשָּׁן
  choice: будет жить в достатке
  rationale: Форма породы пуаль от דשׁן буквально рисует человека «утучнённым», то есть окружённым изобилием и благополучием. Выражение передаёт образ процветания без неуместной для современного русского речи ассоциации с телесной полнотой.
- source_word: וּמַרְוֶה
  choice: кто напояет других
  rationale: Причастие породы хифиль от רוה означает того, кто даёт пить или насыщает влагой. «Напояет других» сохраняет конкретный образ воды, при этом подразумеваемое дополнение выражено для ясности.
- source_word: גַּם הוּא יוֹרֶא
  choice: тот и сам будет напоён
  rationale: 'Фраза подчёркивает взаимность: дающий воду другим сам её получит. Страдательная форма «будет напоён» сохраняет параллелизм и водный образ еврейского текста.'
