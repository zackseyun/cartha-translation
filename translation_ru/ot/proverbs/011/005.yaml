base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/005.yaml
  text: The righteousness of the blameless makes his way straight[b][a], but the wicked falls by his wickedness.
translation:
  language: ru
  text: Праведность непорочного выпрямляет его путь[a], а нечестивый падает из-за собственного нечестия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «направляет его путь»; «делает его путь ровным». Еврейский глагол рисует образ выпрямления или выравнивания пути.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «падает в своём нечестии». Еврейское выражение может указывать как на причину падения, так и на нравственную среду, в которой оно происходит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: праведность
  rationale: Форма сопряжённого состояния от צְדָקָה обозначает здесь нравственную правоту и праведное поведение; «праведность» прямо и естественно передаёт это понятие в контексте литературы мудрости.
- source_word: תָּמִים
  choice: непорочного
  rationale: В Притчах слово указывает на нравственную цельность и безупречность, а не обязательно на абсолютную безгрешность; «непорочный» сохраняет этический смысл.
- source_word: תְּיַשֵּׁר
  choice: выпрямляет
  rationale: Порода пиэль глагола ישר означает «делать прямым, ровным». Выбор сохраняет образ пути, становящегося прямым, не заменяя метафору толкованием.
- source_word: דַּרְכּוֹ
  choice: его путь
  rationale: «Путь» естественно передаёт характерную для литературы мудрости метафору образа и хода жизни и сочетается с глаголом «выпрямляет».
- source_word: וּבְרִשְׁעָתוֹ
  choice: из-за собственного нечестия
  rationale: 'Предлог ב допускает указание как на средство или причину, так и на сферу действия. В основном тексте выражена причинно-инструментальная связь: нечестие самого человека приводит его к падению; «собственного» ясно передаёт местоименный суффикс.'
- source_word: יִפֹּל
  choice: падёт
  rationale: Имперфект в изречении выражает общую закономерность. Русское совершенное будущее естественно передаёт неизбежный итог, не превращая стих исключительно в единичное предсказание.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное в единственном числе обозначает тип человека; «нечестивый» кратко и традиционно, но понятно передаёт нравственную категорию.
theological_decisions:
- issue: Род и число обобщающих форм
  choice: 'Сохранено мужское единственное число: «непорочного», «его», «нечестивый».'
  alternative: Передать обобщённо во множественном числе или словами «человек», «люди».
  rationale: В еврейском тексте употреблены формы мужского рода единственного числа как типические фигуры мудрого изречения. Русский также допускает такое обобщающее употребление без изменения числа и структуры противопоставления.
- issue: Характер связи между нечестием и падением
  choice: «из-за собственного нечестия» — нечестие представлено причиной или средством падения.
  alternative: «в своём нечестии» — нечестие представлено сферой, в которой человек падает.
  rationale: Предлог ב допускает оба оттенка. Основной текст передаёт наиболее вероятную нравственную причинность изречения, а подлинная неоднозначность сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного параллелизма и образности изречения. Лексика «праведность», «непорочный», «нечестивый» dignified и привычна для библейской мудрости, но остаётся понятной современному читателю.
