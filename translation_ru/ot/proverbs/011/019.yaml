  text: So righteousness leads to life[a], but he who pursues evil, to his own death.
translation:
  language: ru
  text: Так праведность ведёт к жизни[a], а кто гонится за злом — к собственной смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воистину, праведность ведёт к жизни». Буквально: «Так праведность — к жизни»; в первой части еврейского текста нет глагола, поэтому связь между словами передана по смыслу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: ведёт
  rationale: Наречие כֵּן допускает значения «так», «тем самым», «воистину». В русском тексте его смысл передан всей результативной конструкцией без отдельного слова, чтобы первая строка звучала естественно; неоднозначность безглагольной фразы отмечена в сноске.
- source_word: צְדָקָה
  choice: праведность
  rationale: В контексте литературы мудрости слово обозначает нравственную правоту и достойный образ жизни; это соответствует противопоставлению злу и не сужает смысл до одной лишь общественной справедливости.
- source_word: לְחַיִּים
  choice: ведёт к жизни
  rationale: Предлог לְ выражает направленность или результат. Поскольку первая часть в еврейском тексте безглагольная, для естественного русского предложения восполнено «ведёт».
- source_word: וּמְרַדֵּף
  choice: а кто гонится
  rationale: Причастие употреблено как обозначение человека, постоянно или привычно преследующего нечто. Союз передаёт антитезу; русское «а» сохраняет её без излишнего усиления.
- source_word: רָעָה
  choice: за злом
  rationale: В антитезе праведности слово имеет прежде всего нравственное значение «зло», хотя в иных контекстах может означать беду или вред.
- source_word: לְמוֹתוֹ
  choice: к собственной смерти
  rationale: 'Буквально: «к его смерти». «Собственной» естественно передаёт местоименный суффикс и подчёркивает, что такой путь оборачивается смертью самого преследующего зло.'
theological_decisions:
- issue: Значение צְדָקָה в контексте мудрости
  choice: праведность как нравственная прямота, ведущая к жизни
  alternative: справедливость как общественно справедливое поведение
  rationale: Антитетический параллелизм противопоставляет праведную направленность жизни погоне за злом. Более широкое «праведность» сохраняет этический диапазон слова и не вводит узкого конфессионального толкования.
- issue: Характер связи между праведностью и жизнью
  choice: 'результативно-направительная связь: «ведёт к жизни»'
  alternative: 'статическое утверждение: «праведность — к жизни» или эмфатическое «воистину, праведность ведёт к жизни»'
  rationale: Безглагольность первой части и многозначность כֵּן не позволяют с полной уверенностью определить оттенок. Основной текст избирает естественное результативное прочтение, а варианты сохраняются в сноске.
translation_notes:
  register: Современный литературный русский, краткий и афористичный. Сохранены антитеза и параллельное движение «к жизни — к смерти»; тире во второй части восполняет сказуемое «ведёт», не утяжеляя пословицу.
