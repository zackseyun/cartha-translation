id: PRO.11.10
reference: Proverbs 11:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/ט֣וּב צַ֭דִּיקִים תַּעֲלֹ֣ץ קִרְיָ֑ה וּ/בַ/אֲבֹ֖ד רְשָׁעִ֣ים רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/010.yaml
  text: In the prosperity of the righteous a city rejoices[b][a], and in the perishing of the wicked there is shouting.
translation:
  language: ru
  text: Когда праведные благоденствуют[a], город ликует, а когда гибнут нечестивые, раздаётся радостный крик[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при благе (или благополучии) праведных».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «раздаётся ликование». Еврейское слово может обозначать звонкий, торжествующий возглас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוּב
  choice: когда … благоденствуют
  rationale: 'Сочетание предлога ב с טוּב обозначает обстоятельство или повод: благо, благополучие праведных. Временная конструкция естественно передаёт смысл в русском языке, хотя «благоденствуют» может звучать несколько уже исходного понятия общего благополучия; поэтому дана сноска.'
- source_word: צַדִּיקִים
  choice: праведные
  rationale: Форма множественного числа употреблена субстантивированно и обозначает нравственную категорию, противопоставленную нечестивым.
- source_word: תַּעֲלֹץ
  choice: ликует
  rationale: Глагол עלץ выражает бурную, торжествующую радость; «ликует» сохраняет эту силу и естественно сочетается с олицетворённым городом.
- source_word: קִרְיָה
  choice: город
  rationale: Существительное обозначает город или поселение. В русском языке безартиклевое обобщающее единственное число естественно передаётся словом «город» без уточняющего местоимения.
- source_word: וּבַאֲבֹד
  choice: а когда гибнут
  rationale: Предлог с инфинитивом конструктивным אבד вводит параллельное обстоятельство времени. Союз «а» ясно выражает противопоставление двух частей изречения.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное обозначает людей, нравственно противопоставленных праведным; «нечестивые» сохраняет традиционную и понятную лексику Книги Притчей.
- source_word: רִנָּה
  choice: радостный крик
  rationale: Слово обозначает звонкий возглас, часто радостный или торжествующий. Контекст гибели нечестивых указывает на публичное ликование, но сноска сохраняет возможные оттенки.
theological_decisions:
- issue: Радость города при гибели нечестивых
  choice: Передана прямо, без нравственного смягчения или дополнительного одобрения.
  alternative: Истолковать строку как радость исключительно по поводу восстановления справедливости.
  rationale: Текст сообщает о реакции общества, но не разъясняет её мотив и не формулирует отдельного богословского учения о радости из-за чужой гибели.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранены олицетворение города, нравственный контраст и параллелизм двух частей.
