  text: רָשָׁ֗ע עֹשֶׂ֥ה פְעֻלַּת שָׁ֑קֶר וְ/זֹרֵ֥עַ צְ֝דָקָ֗ה שֶׂ֣כֶר אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
translation:
  language: ru
  text: Нечестивый получает обманчивую плату[a], а сеющий праведность — надёжную награду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делает дело лжи»; еврейское выражение может обозначать как нечестное дело, так и плату или выгоду, которая оказывается обманчивой, пустой либо ненадёжной.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «награда истины»; то есть награда подлинная и надёжная.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного представителя; традиционное и понятное русское соответствие сохраняет нравственный смысл.
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  choice: делает дело обманное
  rationale: Формулировка близко передаёт сочетание «делать» и «дело/труд обмана», не устраняя неоднозначность между нечестным действием и трудом, итог которого окажется обманчивым.
- source_word: וְזֹרֵעַ
  choice: а сеющий
  rationale: Союз передан как противопоставительный в соответствии с антитетическим параллелизмом; образ сеяния сохранён.
- source_word: צְדָקָה
  choice: праведность
  rationale: Сохраняет широкий нравственно-богословский смысл слова, включающий правоту и справедливое поведение.
- source_word: שֶׂכֶר אֱמֶת
  choice: верную награду
  rationale: Буквально «награда/плата истины»; «верная» естественно выражает подлинность и надёжность награды, противопоставленной обманному делу.
theological_decisions:
- issue: Передача צְדָקָה
  choice: праведность
  alternative: справедливость; то, что правильно
  rationale: Контекст не сужает значение исключительно до общественной справедливости; «праведность» сохраняет полный нравственный объём и метафору сеяния.
- issue: Характер воздаяния в שֶׂכֶר אֱמֶת
  choice: верная награда
  alternative: истинная награда; надёжная плата
  rationale: Перевод не уточняет источник или время воздаяния, которых текст прямо не называет, и сохраняет утверждение о его подлинности и надёжности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксический параллелизм и противопоставление сохранены; неоднозначность первой половины вынесена в сноску.
