base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/020.yaml
  text: The crooked in heart are an abomination to Yahweh[b][a], but those blameless in their way are his delight.
translation:
  language: ru
  text: Криводушные[a] — мерзость для Яхве, а непорочные в своём пути[b] — Его радость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди с искривлённым сердцем»; речь идёт о внутренней нравственной испорченности.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение: «непорочные пути»; то есть цельные и безупречные в своём образе жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Существительное выражает сильное нравственное отвращение. «Мерзость» сохраняет резкость и лаконичность еврейской формулировки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом; «Яхве» — принятая современная русская транслитерация.
- source_word: עִקְּשֵׁי לֵב
  choice: люди с извращённым сердцем
  rationale: Выражение описывает внутреннюю нравственную искривлённость. «Сердце» сохранено как обозначение внутреннего человека — его мысли, воли и нравственной направленности.
- source_word: וּרְצוֹנוֹ
  choice: угодны Ему
  rationale: רָצוֹן может означать благоволение, расположение или удовольствие. В данном противопоставлении естественное русское «угодны Ему» передаёт, что такие люди пользуются благоволением Яхве.
- source_word: תְּמִימֵי דָרֶךְ
  choice: те, чей путь непорочен
  rationale: תָּמִים указывает на цельность и непорочность, а דֶּרֶךְ в литературе мудрости — на образ жизни. Формулировка сохраняет образ пути и остаётся естественной по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон. Передача личным именем сохраняет отличие имени от титула и не добавляет конфессионального толкования.
- issue: Антропологический смысл слова «сердце»
  choice: сохранить образ сердца
  alternative: внутренний мир; разум
  rationale: В еврейской литературе мудрости сердце включает мышление, волю и нравственную направленность. Буквенный образ сохраняет эту смысловую широту.
- issue: Смысл תְּמִימֵי в отношении человеческого поведения
  choice: непорочен
  alternative: совершенен; безгрешен; честен
  rationale: Здесь речь идёт о цельности и безупречности жизненного пути, а не обязательно о метафизическом совершенстве или абсолютной безгрешности.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного противопоставления, сильного слова «мерзость» и библейских образов сердца и пути. Местоимение «Ему» написано с прописной буквы как уважительное указание на Бога.
