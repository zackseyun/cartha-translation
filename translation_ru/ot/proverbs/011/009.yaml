id: PRO.11.9
reference: Proverbs 11:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/פֶ֗ה חָ֭נֵף יַשְׁחִ֣ת רֵעֵ֑/הוּ וּ֝/בְ/דַ֗עַת צַדִּיקִ֥ים יֵחָלֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/009.yaml
  text: With his mouth the godless man destroys his neighbor[b][a], but by knowledge the righteous are delivered.
translation:
  language: ru
  text: Устами безбожник губит ближнего[a], но знанием праведные спасаются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицемер губит ближнего своими устами». Еврейское слово может обозначать безбожного, нечестивого или лицемерного человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но благодаря знанию праведные избегают опасности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶה
  choice: устами
  rationale: Предлог בְּ обозначает средство действия; «устами» сохраняет конкретный образ разрушительной речи и звучит достойно и естественно в поэтическом изречении.
- source_word: חָנֵף
  choice: безбожник
  rationale: Слово обозначает нравственно и религиозно испорченного, нечестивого человека и может также включать оттенок лицемерия. «Безбожник» передаёт широкую этико-религиозную характеристику, не сводя смысл только к неискренности.
- source_word: יַשְׁחִת
  choice: губит
  rationale: Порода hифиль глагола שׁחת выражает причинение гибели или разорения. «Губит» кратко и сильно передаёт разрушительное воздействие речи.
- source_word: רֵעֵהוּ
  choice: ближнего
  rationale: רֵעַ может означать ближнего, товарища или друга. «Ближний» достаточно широко передаёт общественно-нравственный смысл, не предполагая непременно близкой дружбы.
- source_word: וּבְדַעַת
  choice: но знанием
  rationale: Союз выражает противопоставление, а בְּ — средство. «Знание» сохраняет ключевую для Притч мудростную лексику; творительный падеж естественно передаёт инструментальное значение.
- source_word: צַדִּיקִים
  choice: праведные
  rationale: Прилагательное во множественном числе употреблено как существительное и обозначает нравственную категорию людей.
- source_word: יֵחָלֵצוּ
  choice: спасаются
  rationale: 'Нифаль глагола חלץ здесь означает избавление или выход из опасности. «Спасаются» сохраняет медиально-пассивную открытость: текст не уточняет деятеля избавления и может описывать как избавление, так и успешное избежание опасности.'
theological_decisions:
- issue: Значение חָנֵף в контексте литературы мудрости
  choice: «безбожник»
  alternative: «лицемер» или «нечестивец»
  rationale: В противопоставлении праведным слово указывает на широкую нравственно-религиозную испорченность. Возможный оттенок лицемерия сохранён в примечании, чтобы не сужать значение основного текста.
- issue: Синтаксическая роль צַדִּיקִים во второй строке
  choice: «праведные спасаются» — праведные являются подлежащим
  alternative: «знание праведных спасает [других]»
  rationale: Еврейский порядок и согласование естественнее всего указывают на צַדִּיקִים как подлежащее глагола во множественном числе. Менее вероятное понимание не вводится в основной текст.
- issue: Характер избавления в יֵחָלֵצוּ
  choice: «спасаются»
  alternative: «избавлены» или «избегают опасности»
  rationale: Форма нифаль допускает оттенки пассивного избавления и выхода из опасности. Выбранная формулировка не определяет явно ни избавителя, ни точный вид угрозы.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Параллелизм двух строк и противопоставление сохранены; «устами» придаёт изречению умеренно возвышенный, но понятный оттенок.
