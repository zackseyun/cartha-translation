id: PRO.11.15
reference: Proverbs 11:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רַע יֵ֭רוֹעַ כִּי עָ֣רַב זָ֑ר וְ/שֹׂנֵ֖א תֹקְעִ֣ים בּוֹטֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/015.yaml
  text: He will surely suffer harm who becomes surety for a stranger[b][a], but whoever hates striking hands is secure.
translation:
  language: ru
  text: 'Кто поручается за чужого, непременно пострадает,

    а кто ненавидит ударять по рукам[a][b], тот в безопасности.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально — «ударять по рукам»: такой жест скреплял обещание, сделку или поручительство.'
    reason: cultural_note
  - marker: b
    text: 'Или: «а кто ненавидит давать поручительства, тот в безопасности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע יֵרוֹעַ
  choice: непременно пострадает
  rationale: Сочетание предикативного רַע с формой Niphal יֵרוֹעַ усиливает предупреждение о тяжёлом неблагоприятном последствии; речь здесь не о нравственном зле.
- source_word: כִּי עָרַב
  choice: кто поручается
  rationale: כִּי вводит обстоятельство, при котором человек терпит вред, а עָרַב обозначает принятие на себя ответственности по чужому обязательству. Русская относительная конструкция естественно передаёт обобщённый характер пословицы.
- source_word: זָר
  choice: за чужого
  rationale: В данном контексте это посторонний, не связанный с поручителем человек, а не обязательно иноземец.
- source_word: שֹׂנֵא
  choice: ненавидит
  rationale: Сохранена намеренно сильная формулировка еврейского текста, выражающая решительное неприятие.
- source_word: תֹקְעִים
  choice: ударять по рукам
  rationale: Сохранён конкретный образ жеста, которым скрепляли договорённость или поручительство; русское выражение также понятно как заключение сделки.
- source_word: בּוֹטֵחַ
  choice: в безопасности
  rationale: В контексте противопоставления слово указывает на защищённость от описанного финансового риска.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Юридико-финансовое «поручается» сохраняет смысл древнего обычая, а образ «ударять по рукам» оставлен в основном тексте и пояснён в сноске.
