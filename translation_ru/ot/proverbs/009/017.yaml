translation:
  language: ru
  text: Краденая вода сладка, и тайный хлеб[a] приятен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб тайных мест» или «хлеб тайны». Еврейское выражение сжато; оно может подразумевать хлеб, который едят скрытно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: вода
  rationale: Хотя еврейское существительное имеет форму множественного числа, оно обычно употребляется как собирательное и по-русски естественно передаётся словом «вода».
- source_word: גְּנוּבִים
  choice: краденая
  rationale: Причастие от גנב прямо указывает на воду, добытую кражей; «краденая» сохраняет краткость и образность поговорки.
- source_word: יִמְתָּקוּ
  choice: сладка
  rationale: Форма от מתק выражает качество «быть сладким»; краткое прилагательное естественно передаёт это значение и афористический строй строки.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Конкретное значение сохраняет параллелизм с водой; более широкое «пища» здесь не требуется.
- source_word: סְתָרִים
  choice: съеденный тайком
  rationale: Буквально сжатое выражение означает «хлеб тайных мест/тайны». В сочетании с хлебом оно, вероятнее всего, описывает скрытое употребление; русский оборот передаёт этот смысл естественно, а буквальная неоднозначность отмечена в сноске.
- source_word: יִנְעָם
  choice: приятен
  rationale: Глагол נעם означает «быть приятным, доставлять удовольствие»; «приятен» сохраняет оценочный смысл и параллель со словом «сладка».
theological_decisions:
- issue: Нравственная оценка слов женщины-глупости
  choice: Сохранить высказывание как её заманчивое утверждение без добавленного авторского осуждения внутри стиха.
  alternative: Явно обозначить, что такая сладость обманчива или греховна.
  rationale: Контекст раскрывает говорящего и нравственную опасность, но сам стих передаёт приманку в форме афоризма; пояснение внутри текста преждевременно сняло бы литературное напряжение.
translation_notes:
  register: Современный литературный русский язык; краткие формы «сладка» и «приятен» сохраняют достоинство, параллелизм и афористичность древнееврейской строки.
