  text: כִּי בִ֭/י יִרְבּ֣וּ יָמֶ֑י/ךָ וְ/יוֹסִ֥יפוּ לְּ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/011.yaml
  text: For by me your days will be multiplied[a], and years of life will be added to you.
translation:
  language: ru
  text: Ведь благодаря мне умножатся дни твои[a], и прибавятся тебе годы жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во мне» или «через меня». Древнееврейский предлог здесь допускает несколько близких значений, хотя контекст скорее указывает на средство: Мудрость — то, благодаря чему продлевается жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для предшествующего наставления; «ведь» естественно передаёт пояснительно-причинную связь в русском тексте притчи.
- source_word: בִי
  choice: благодаря мне
  rationale: 'Предлог בְּ с местоименным суффиксом здесь вероятнее всего обозначает средство или основание: персонифицированная Мудрость представляет себя тем, благодаря чему продлевается жизнь. Формулировка сохраняет и личную речь, и смысловую неоднозначность, отмеченную в сноске.'
- source_word: יִרְבּוּ
  choice: умножатся
  rationale: Глагол רבה означает «стать многочисленными, увеличиться». «Умножатся дни» сохраняет образ исходного текста и звучит уместно в возвышенной афористической речи.
- source_word: יָמֶיךָ
  choice: дни твои
  rationale: Буквально сохранён древнееврейский образ дней как продолжительности человеческой жизни; постпозиция местоимения поддерживает достоинство и поэтический параллелизм.
- source_word: וְיוֹסִיפוּ
  choice: и прибавятся
  rationale: Форма глагола יסף в данном сочетании выражает увеличение того, что достаётся адресату. Русская возвратная конструкция естественно передаёт результирующий смысл без введения неопределённого действующего лица.
- source_word: לְךָ
  choice: тебе
  rationale: Предлог לְ обозначает лицо, которому достаются дополнительные годы; дательный падеж является прямым и естественным русским соответствием.
- source_word: שְׁנוֹת חַיִּים
  choice: годы жизни
  rationale: Сочетание буквально и идиоматично передаёт сопряжённую конструкцию со значением лет человеческой жизни.
