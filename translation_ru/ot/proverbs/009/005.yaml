source:
  edition: WLC
  text: לְ֭כוּ לַחֲמ֣וּ בְֽ/לַחֲמִ֑/י וּ֝/שְׁת֗וּ בְּ/יַ֣יִן מָסָֽכְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/005.yaml
  text: Come[a], eat of my bread[b], and drink of the wine I have mixed.
translation:
  language: ru
  text: «Приходите[a], ешьте мой хлеб и пейте вино, которое я смешала[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Идите». В данном приглашении еврейский глагол по смыслу означает призыв прийти к Премудрости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которое я приготовила». Еврейский глагол точнее обозначает смешивание вина, возможно с водой или пряностями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Приходите
  rationale: Буквально глагол означает «идите», но здесь, в устах Премудрости, он служит приглашением к приготовленной ею трапезе. Русское «приходите» естественно передаёт направленный к говорящей призыв, не меняя его силы.
- source_word: לַחֲמוּ
  choice: ешьте
  rationale: В данном контексте глагол от לחם II означает «есть», что подтверждается параллелью с «пейте» и дополнением «мой хлеб».
- source_word: בְלַחֲמִי
  choice: мой хлеб
  rationale: Предлог ב при глаголе еды имеет здесь объектно-партитивное значение. В современном русском естественнее сказать «ешьте мой хлеб», чем буквально «ешьте от моего хлеба».
- source_word: וּשְׁתוּ
  choice: и пейте
  rationale: Сочинённое повеление сохраняет параллелизм двух частей приглашения.
- source_word: בְּיַיִן
  choice: вино
  rationale: Предлог ב при глаголе питья естественно передаётся в русском прямым дополнением; форма «пейте вино» ясна и сохраняет конкретность образа.
- source_word: מָסָכְתִּי
  choice: которое я смешала
  rationale: Глагол обозначает приготовление вина смешиванием, вероятно с водой или пряностями. Женская форма «смешала» согласуется с персонифицированной Премудростью, говорящей в первом лице.
theological_decisions:
- issue: Характер образа приглашения Премудрости
  choice: Сохранить конкретный образ хлеба и смешанного вина без его истолкования внутри перевода.
  alternative: Передать хлеб и вино как прямое указание на таинство либо обобщить трапезу до метафоры наставления.
  rationale: Еврейский текст изображает Премудрость, приглашающую к приготовленной трапезе. Возможные богословские ассоциации не следует вводить в сам перевод, поскольку стих прямо их не формулирует.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и торжественная форма приглашения. Синтаксический параллелизм повелений сохранён, а женский род сказуемого отражает речь персонифицированной Премудрости.
