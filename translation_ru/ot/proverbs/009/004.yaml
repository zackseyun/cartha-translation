lexical_decisions:
- source_word: מִי פֶתִי
  choice: Кто неопытен
  rationale: מִי вводит неопределённого адресата, а פֶתִי в Притчах обозначает неопытного, легко поддающегося влиянию человека, а не обязательно человека с низкими умственными способностями. Русское «неопытен» ясно и без излишне уничижительного оттенка.
- source_word: יָסֻר הֵנָּה
  choice: пусть свернёт сюда
  rationale: Юссив передаёт приглашение или призыв; «свернёт сюда» сохраняет направительное значение глагола סור и указательное значение הֵנָּה.
- source_word: חֲסַר לֵב
  choice: кому недостаёт разумения
  rationale: Буквально выражение означает «лишённый сердца», но в древнееврейской антропологии «сердце» здесь связано с пониманием и рассудительностью. «Недостаёт разумения» естественно передаёт смысл, не устраняя образ полностью, поскольку буквальная форма отмечена в сноске.
- source_word: אָמְרָה לּוֹ
  choice: она говорит
  rationale: Форма qatal вводит прямую речь в данном контексте; настоящее время по-русски сохраняет живость призыва. Местоименное дополнение передано конструкцией «тому… она говорит», соответствующей еврейскому порядку и связи с адресатом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической краткости и параллелизма. «Неопытен» предпочтено словам «прост» и «наивен», чтобы избежать соответственно двусмысленного положительного оттенка и чрезмерно отрицательной оценки. Двоеточие в конце сохраняет переход к продолжающейся в следующем стихе прямой речи.
