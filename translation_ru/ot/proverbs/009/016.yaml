  yaml_path: translation/ot/proverbs/009/016.yaml
  text: Whoever is simple[a], let him turn in here! And to him who lacks sense she says,
translation:
  language: ru
  text: '«Кто наивен, пусть свернёт сюда!» А тому, кому не хватает здравого смысла, она говорит:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי פֶתִי
  choice: Кто простодушен
  rationale: 'מִי с последующим определением вводит общее приглашение: «кто [таков]». פֶתִי в Притчах обозначает неопытного, доверчивого и ещё не сформировавшегося в нравственном отношении человека; «простодушен» передаёт это лучше, чем обозначения умственной неспособности.'
- source_word: יָסֻר הֵנָּה
  choice: пусть свернёт сюда
  rationale: Форма יָסֻר выражает приглашение или призыв, а הֵנָּה указывает на место говорящей. «Свернёт сюда» сохраняет направительный образ и естественно звучит по-русски.
- source_word: וַחֲסַר לֵב
  choice: А тому, кому недостаёт разумения
  rationale: Буквально сочетание означает «лишённому сердца», однако לֵב в языке Притчей часто означает способность понимать, рассуждать и здраво судить. Выбранная передача ясна современному читателю и не сводит выражение к недостатку интеллекта.
- source_word: וְאָמְרָה לּוֹ
  choice: она говорит
  rationale: Женский субъект определяется контекстом — это женщина Безумие. Настоящее время естественно вводит следующую прямую речь в афористическом повествовании; адресат уже выражен оборотом «тому, кому…».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь краткая и призывная. Сохранён параллелизм между «простодушен» и «недостаёт разумения», а также незавершённость стиха перед последующей прямой речью.
