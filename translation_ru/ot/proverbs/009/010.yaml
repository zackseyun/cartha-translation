source:
  edition: WLC
  text: תְּחִלַּ֣ת חָ֭כְמָה יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/010.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and the knowledge of the Holy One is understanding.
translation:
  language: ru
  text: Начало мудрости — страх перед Яхве, и познание Святого[a] — разумение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «святых». Еврейское слово стоит во множественном числе, но здесь его часто понимают как обозначение Бога — «Святого».'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַּת
  choice: начало
  rationale: Конструктная форма естественно обозначает начало или исходное основание; перевод сохраняет краткость и образность еврейского текста.
- source_word: חָכְמָה
  choice: мудрости
  rationale: Обычное для книги Притч обозначение нравственной и практической мудрости.
- source_word: יִרְאַת
  choice: страх перед
  rationale: Слово «страх» сохраняет присущее выражению напряжение между благоговением, трепетом и сознанием Божьего суда; более мягкое «почтение» сузило бы смысл. Предлог «перед» обеспечивает естественное современное русское выражение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: וְדַעַת
  choice: и познание
  rationale: Сохраняет соединение двух параллельных частей стиха; «познание» естественно обозначает знание, направленное на личный объект.
- source_word: קְדֹשִׁים
  choice: Святого[a]
  rationale: Хотя форма грамматически множественного числа, параллелизм со словом «Яхве» убедительно указывает на Бога как единственного референта. Прописная буква отражает это понимание, а буквальная форма сохранена в сноске.
- source_word: בִּינָה
  choice: разумение
  rationale: Передаёт способность понимать и различать и поддерживает торжественный афористичный строй стиха.
theological_decisions:
- issue: Референт קְדֹשִׁים
  choice: 'Единственный божественный референт: «Святого»'
  alternative: 'Буквальное множественное число: «святых»'
  rationale: Синонимический параллелизм сопоставляет «страх перед Яхве» с «познанием Святого», что поддерживает отнесение слова к Богу. Однако морфологическое множественное число не устранено молча, а отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным и достойным регистром. Синтаксический параллелизм оригинала сохранён; тире ясно выражают две именные связи.
