id: PRO.9.18
reference: Proverbs 9:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְֽ/לֹא יָ֭דַע כִּֽי רְפָאִ֣ים שָׁ֑ם בְּ/עִמְקֵ֖י שְׁא֣וֹל קְרֻאֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/018.yaml
  text: But he does not know that the dead are there[a], that her guests are in the depths of Sheol.
translation:
  language: ru
  text: Но он не знает, что там мёртвые[a], что её гости — в глубинах Шеола.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тени умерших». Еврейское слово רְפָאִים здесь означает умерших, пребывающих в Шеоле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Но он не
  rationale: Союз в контексте выражает резкое противопоставление обольстительной видимости предыдущего стиха скрытой действительности; «но» естественно передаёт этот оттенок по-русски.
- source_word: יָדַע
  choice: не знает
  rationale: Форма глагола здесь описывает нынешнее состояние неведения; настоящее время звучит естественно и точно.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, чего человек не знает.
- source_word: רְפָאִים
  choice: мёртвые
  rationale: В данном контексте слово обозначает умерших, пребывающих в Шеоле, а не древний народ рефаимов. «Мёртвые» понятно современному читателю; образный вариант отмечен в сноске.
- source_word: שָׁם
  choice: там
  rationale: Краткое наречие сохраняет указание на дом женщины и его скрытую связь с миром мёртвых.
- source_word: בְּעִמְקֵי
  choice: в глубинах
  rationale: Передаёт образ глубоких областей и нисхождения, оставаясь естественным для современного русского языка.
- source_word: שְׁאוֹל
  choice: Шеола
  rationale: Транслитерация сохраняет значимый древнееврейский термин и не подменяет его более узкими понятиями «могила» или «ад».
- source_word: קְרֻאֶיהָ
  choice: её гости
  rationale: Буквально это «приглашённые ею»; в контексте званого пира слово «гости» лаконично передаёт смысл и связь с приглашением.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых; преисподняя; ад
  rationale: Еврейское слово обозначает область пребывания умерших. Сохранение термина «Шеол» позволяет избежать привнесения более поздней и узкой догматической конкретизации.
- issue: Понимание רְפָאִים
  choice: мёртвые
  alternative: тени умерших; рефаимы
  rationale: В поэтическом контексте Притч речь идёт об умерших в Шеоле, а не об этнической группе или исполинах. Сноска сохраняет образную лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с кратким, весомым синтаксисом. Тире перед обстоятельством подчёркивает итоговое раскрытие участи гостей, не добавляя нового смыслового содержания.
