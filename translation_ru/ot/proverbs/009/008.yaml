base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/008.yaml
  text: Do not rebuke a scoffer[a], lest he hate you; rebuke a wise man[b], and he will love you.
translation:
  language: ru
  text: Не обличай насмешника[a] — иначе он возненавидит тебя; обличай мудрого[b], и он полюбит тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глумца». Еврейское слово לֵץ обозначает человека, которому свойственны высокомерие и презрительная насмешка.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мудрого» — мужской род и единственное число здесь представляют общий тип человека, как это обычно бывает в книге Притчей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: не
  rationale: Сочетание אַל с формой имперфекта выражает запрет; русская отрицательная форма повелительного наклонения естественно передаёт его без дополнительного усиления.
- source_word: תּוֹכַח / הוֹכַח (יכח)
  choice: обличай
  rationale: Глагол обозначает словесное указание на неправоту с целью исправления. «Обличать» сохраняет необходимую резкость и одинаково естественно звучит в обеих параллельных частях.
- source_word: לֵץ
  choice: насмешник
  rationale: В Притчах это не просто тот, кто шутит, а человек, которому свойственны высокомерие и презрительная насмешка. Это значение пояснено в сноске.
- source_word: פֶּן
  choice: иначе
  rationale: Частица вводит нежелательное возможное последствие; «иначе» ясно и естественно передаёт эту предупредительную связь.
- source_word: יִשְׂנָאֶךָּ
  choice: он возненавидит тебя
  rationale: Имперфект после פֶּן указывает на возможный последующий результат; будущее время естественно передаёт его по-русски.
- source_word: לְחָכָם
  choice: мудрого
  rationale: Сохранены мужской род и единственное число еврейского текста; в жанре Притчей это типичный представитель определённого склада людей.
- source_word: וְיֶאֱהָבֶךָּ
  choice: и он полюбит тебя
  rationale: Имперфект выражает ожидаемый результат обличения; совершенный вид в будущем времени передаёт наступление этой реакции.
theological_decisions:
- issue: Мужской род и единственное число в наставлении мудрости
  choice: мудрого
  alternative: мудрого человека; мудрых
  rationale: Форма источника — мужской род, единственное число, употреблённое как представитель типа. Перевод сохраняет форму, а сноска поясняет её обобщающий характер, не ограничивая смысл только мужчинами.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Параллелизм сохранён повтором «обличай»; тире перед «иначе» подчёркивает связь запрета с нежелательным последствием.
