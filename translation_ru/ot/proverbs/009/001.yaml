  text: חָ֭כְמוֹת בָּנְתָ֣ה בֵיתָ֑/הּ חָצְבָ֖ה עַמּוּדֶ֣י/הָ שִׁבְעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/001.yaml
  text: Wisdom has built her house[a]; she has hewn out her seven pillars.
translation:
  language: ru
  text: Мудрость[a] построила свой дом, вытесала семь его столбов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חָכְמוֹת имеет форму множественного числа, но здесь сочетается с глаголами женского рода единственного числа и обозначает персонифицированную Мудрость.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמוֹת
  choice: Мудрость
  rationale: Существительное имеет форму множественного числа, но здесь сочетается с глаголами женского рода единственного числа и выступает как персонифицированное единственное понятие.
- source_word: בָּנְתָה
  choice: построила
  rationale: Перфект обозначает завершённое действие; русское прошедшее совершенного вида естественно и точно передаёт этот смысл.
- source_word: בֵיתָהּ
  choice: свой дом
  rationale: Основное значение — физический дом, что поддерживается последующим образом столбов. Возвратное «свой» естественно указывает на принадлежность подлежащему.
- source_word: חָצְבָה
  choice: вытесала
  rationale: Глагол обозначает высекание или обработку камня; «вытесала» сохраняет конкретный архитектурный образ и хорошо сочетается со столбами.
- source_word: עַמּוּדֶיהָ
  choice: его столбов
  rationale: Речь идёт о столбах дома; местоимение «его» естественно связывает их с домом и избегает двусмысленного в русском сочетания «своих столбов».
- source_word: שִׁבְעָה
  choice: семь
  rationale: Числительное передано прямо, без внесения в основной текст возможной символики полноты.
theological_decisions:
- issue: Персонификация мудрости
  choice: Передать חָכְמוֹת как персонифицированное единственное «Мудрость».
  alternative: «Госпожа Мудрость» или «Женщина-Мудрость».
  rationale: Женский род и единственное число глаголов представляют мудрость как женский персонаж, однако добавление слов «госпожа» или «женщина» было бы излишне истолковывающим.
translation_notes:
  register: Современный литературный русский язык с краткой, возвышенной поэтической формой. Архитектурная образность сохранена без добавочного богословского толкования.
