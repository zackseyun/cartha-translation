  text: אִם חָ֭כַמְתָּ חָכַ֣מְתָּ לָּ֑/ךְ וְ֝/לַ֗צְתָּ לְֽ/בַדְּ/ךָ֥ תִשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/012.yaml
  text: If you are wise[a], you are wise for yourself; if you scoff, you alone will bear it.
translation:
  language: ru
  text: Если ты мудр, ты мудр для себя; если же ты насмехаешься, сам и понесёшь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сам понесёшь последствия». В еврейском тексте сказано только «понесёшь»; что именно придётся нести, не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет условную силу еврейского оборота, не превращая утверждение в указание на неизбежность.
- source_word: חָכַמְתָּ ... חָכַמְתָּ לָּךְ
  choice: ты мудр, то мудр для себя
  rationale: Сохраняет выразительный повтор корня חכם и передаёт לָךְ как указание на личную пользу.
- source_word: וְלַצְתָּ
  choice: если же ты насмехаешься
  rationale: Передаёт глагольную форму и характерное для книги Притч надменное, презрительное осмеяние; «же» естественно подчёркивает противопоставление.
- source_word: לְבַדְּךָ
  choice: один
  rationale: В сочетании «один и понесёшь» естественно и выразительно передаёт исключительную личную ответственность.
- source_word: תִשָּׂא
  choice: понесёшь
  rationale: Сохраняет метафору несения бремени и, как в еврейском тексте, не называет подразумеваемый объект.
