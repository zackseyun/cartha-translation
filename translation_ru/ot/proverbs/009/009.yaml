  text: תֵּ֣ן לְ֭/חָכָם וְ/יֶחְכַּם ע֑וֹד הוֹדַ֥ע לְ֝/צַדִּ֗יק וְ/י֣וֹסֶף לֶֽקַח־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/009.yaml
  text: Give to a wise man[a], and he will become wiser still; teach a righteous man[b], and he will add learning.
translation:
  language: ru
  text: Дай мудрому[a] — и он станет ещё мудрее; научи праведного[b] — и он умножит познания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с явным дополнением: «Дай мудрому наставление». В еврейском тексте не сказано, что именно следует дать.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском употреблена форма мужского рода в единственном числе; в Притчах такой образ отдельного человека обычно имеет обобщающий смысл.
    reason: cultural_note
lexical_decisions:
- source_word: תֵּן
  choice: Дай
  rationale: Императив נתן имеет широкое значение «дать». В еврейском тексте дополнение не названо; краткое «дай» сохраняет намеренную эллиптичность изречения.
- source_word: לְחָכָם
  choice: мудрому
  rationale: חָכָם обозначает мудрого человека. Субстантивированное прилагательное естественно по-русски и сохраняет мужской род и единственное число оригинала.
- source_word: וְיֶחְכַּם עוֹד
  choice: и он станет ещё мудрее
  rationale: Глагол חכם с עוֹד выражает дальнейший рост в мудрости; сравнительная конструкция передаёт это ясно и естественно.
- source_word: הוֹדַע
  choice: научи
  rationale: Каузативная форма ידע буквально означает «дай узнать, сделай известным»; в контексте наставления естественный русский эквивалент — «научи».
- source_word: לְצַדִּיק
  choice: праведного
  rationale: צַדִּיק означает нравственно праведного, справедливого человека и образует параллель слову «мудрому».
- source_word: וְיוֹסֶף לֶקַח
  choice: и он умножит познания
  rationale: יסף означает «прибавлять, увеличивать», а לֶקַח в литературе мудрости — усвоенное наставление, знание. Формулировка сохраняет образ увеличения и звучит достойно по-русски.
