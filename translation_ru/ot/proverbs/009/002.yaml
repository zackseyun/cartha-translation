  yaml_path: translation/ot/proverbs/009/002.yaml
  text: She has slaughtered her meat[a]; she has mixed her wine[b]; she has also set her table.
translation:
  language: ru
  text: Она заколола свой скот[a], смешала своё вино[b] и накрыла свой стол.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приготовила мясо для пира»; еврейское существительное может обозначать заколотых животных или мясо, приготовленное для трапезы.'
    reason: lexical_alternative
  - marker: b
    text: То есть приготовила вино, смешав его; в древности вино нередко смешивали перед праздничной трапезой.
    reason: cultural_note
lexical_decisions:
- source_word: טָבְחָה טִבְחָהּ
  choice: заколола скот
  rationale: Сочетание однокоренных глагола и существительного обозначает заклание животных и заготовленное для пира мясо. Формулировка сохраняет конкретное действие, не сводя его к общему «приготовила».
- source_word: מָסְכָה יֵינָהּ
  choice: смешала своё вино
  rationale: Глагол מסך означает смешивание вина при его приготовлении к трапезе; «смешала» сохраняет образ исходного текста, а примечание поясняет древний обычай.
- source_word: אַף
  choice: и
  rationale: В данном перечислении частица добавляет ещё одно завершённое действие. Русский союз «и» естественно передаёт нарастающую последовательность; отдельное «также» здесь стилистически избыточно.
- source_word: עָרְכָה שֻׁלְחָנָהּ
  choice: накрыла свой стол
  rationale: Глагол ערך означает «расставлять, приводить в порядок». В сочетании со столом естественный русский эквивалент «накрыла стол» передаёт подготовку стола к трапезе и сохраняет конкретный образ.
theological_decisions:
- issue: Женский субъект в олицетворении Мудрости
  choice: Передать местоимением «Она», не добавляя в стихе поясняющего имени и не выделяя местоимение особым написанием.
  alternative: «Мудрость заколола скот…»
  rationale: Формы еврейских глаголов стоят в женском роде единственного числа, а субъект установлен ближайшим контекстом. Местоимение сохраняет поэтическое олицетворение и не вносит в стих отсутствующее в нём повторение имени.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным перечислением трёх действий. Конкретные образы заклания, смешивания вина и накрытого стола сохранены; несколько непривычное для современного читателя смешивание вина пояснено в сноске.
