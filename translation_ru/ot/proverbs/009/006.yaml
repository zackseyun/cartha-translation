  text: עִזְב֣וּ פְתָאיִ֣ם וִֽ/חְי֑וּ וְ֝/אִשְׁר֗וּ בְּ/דֶ֣רֶךְ בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/006.yaml
  text: Leave the simple[a], and live; and walk in the way of understanding.
translation:
  language: ru
  text: Оставьте простоту[a] и живите; идите путём разумения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставьте простодушных (неопытных)». Еврейское слово буквально обозначает простых, неопытных людей; в контексте оно может также подразумевать отказ от простоты или наивности, свойственной им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ
  choice: оставьте
  rationale: Форма повелительного наклонения множественного числа от עזב выражает решительный отказ. «Оставьте» звучит естественно и сохраняет прямоту призыва.
- source_word: פְתָאיִם
  choice: неразумие
  rationale: Форма буквально обозначает «простодушных, неопытных людей», но в данном обращении Премудрости естественно указывает на свойственное им состояние или образ жизни. «Неразумие» передаёт контекстуальный смысл, не создавая ложного впечатления, будто слушателям велено бросить других людей; буквальная форма отмечена в сноске.
- source_word: וִחְיוּ
  choice: и живите
  rationale: Повелительное наклонение множественного числа от חיה сохранено непосредственно, без превращения в явно целевую конструкцию «чтобы вы жили».
- source_word: וְאִשְׁרוּ
  choice: ступайте
  rationale: Глагол אשר здесь означает идти вперёд или прямо. «Ступайте» естественно сочетается с образом пути и передаёт побуждение следовать определённым жизненным курсом.
- source_word: בְּדֶרֶךְ
  choice: путём
  rationale: Сохраняется характерная для литературы мудрости метафора пути как образа поведения и образа жизни.
- source_word: בִּינָה
  choice: разумения
  rationale: בינה обозначает способность понимать и различать. «Разумение» сохраняет смысл и достойный поэтический регистр книги Притч.
theological_decisions:
- issue: Что именно следует оставить
  choice: «неразумие» в основном тексте с буквальным вариантом в сноске
  alternative: «простодушных» или «простаков»
  rationale: Еврейская форма грамматически является множественным обозначением простодушных или неопытных людей, однако контекст допускает смысл отказа от их состояния, поведения либо сообщества. Перевод не превращает стих в призыв непременно отвергнуть людей и одновременно открыто сообщает буквальную форму.
translation_notes:
  register: Современный литературный русский язык с кратким, повелительным и поэтическим строем. Тире подчёркивает переход от отказа от неразумия к жизни; точка с запятой сохраняет параллелизм двух призывов.
