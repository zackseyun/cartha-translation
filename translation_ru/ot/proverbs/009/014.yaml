- source_word: וְיָשְׁבָה
  choice: и сидит
  rationale: Форма Qal perfect 3-го лица женского рода в этом поэтическом описании передаёт наглядное, продолжающееся состояние; настоящее время естественно согласуется с контекстом.
- source_word: לְפֶתַח
  choice: у входа
  rationale: פֶּתַח обозначает вход или проём; «у входа» ясно и естественно передаёт местоположение.
- source_word: בֵּיתָהּ
  choice: в свой дом
  rationale: Суффикс женского рода указывает на принадлежащий ей дом; русское «свой» естественно выражает эту соотнесённость при подлежащем женского рода.
- source_word: כִּסֵּא
  choice: сиденье
  rationale: כִּסֵּא может означать сиденье, кресло или престол. Нейтральное «сиденье» сохраняет предметный образ, не вводя обязательной царской символики.
- source_word: מְרֹמֵי
  choice: на высотах
  rationale: Форма множественного числа в сопряжённом состоянии буквально указывает на высоты или возвышенные места; образ общественно заметного возвышения сохранён.
- source_word: קָרֶת
  choice: города
  rationale: Кָרֶת означает город; родительный падеж естественно передаёт сопряжённую конструкцию.
