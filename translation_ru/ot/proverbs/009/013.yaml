lexical_decisions:
- source_word: אֵשֶׁת כְּסִילוּת
  choice: Женщина Безрассудство
  rationale: Сопряжённое сочетание буквально означает «женщина безрассудства». В контексте Притч 9 безрассудство персонифицировано как женщина и противопоставлено Мудрости; форма с именем «Безрассудство» сохраняет эту персонификацию без добавления отсутствующего в еврейском почётного титула.
- source_word: הֹמִיָּה
  choice: шумлива
  rationale: Слово описывает шумное, беспокойное, крикливое поведение. «Шумлива» естественно и ёмко передаёт характеристику, не усиливая её до более узкого «криклива».
- source_word: פְּתַיּוּת
  choice: наивна
  rationale: Формально это существительное со значением простоты или наивности, употреблённое как характеристика. Русское прилагательное «наивна» естественно передаёт предикативный смысл и избегает возможного положительного оттенка слова «проста».
- source_word: וּבַל
  choice: и … не
  rationale: Сочетание союза с отрицательной частицей вводит добавочное отрицательное сказуемое; «и» сохраняет простую соединительную структуру еврейского текста.
- source_word: יָדְעָה מָּה
  choice: ничего не знает
  rationale: Буквально выражение звучит «не знает что» и подчёркивает полное неведение. «Ничего не знает» передаёт этот смысл естественным современным русским языком; буквальная форма отмечена в сноске.
