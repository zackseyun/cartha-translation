  yaml_path: translation/ot/proverbs/009/007.yaml
  text: Whoever corrects a scoffer gets dishonor for himself[c][b][a], and whoever rebukes a wicked man gets a blemish for himself.
translation:
  language: ru
  text: Кто наставляет насмешника, навлекает на себя позор, а кто обличает нечестивого, навлекает на себя пятно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его пятно». Еврейское выражение неоднозначно: оно может означать пятно или бесчестье, которое обличающий навлекает на себя, либо быть связано с нечестивым — с его пороком или поношением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  choice: Кто наставляет
  rationale: Причастие выражает общее правило; יסר здесь обозначает наставление посредством исправления. «Наставляет» естественно для русской литературы мудрости и не усиливает значение до наказания.
- source_word: לֵץ
  choice: насмешника
  rationale: В Притчах לֵץ — надменный человек, презрительно отвергающий мудрость. «Насмешник» передаёт насмешливый оттенок без архаичности слова «кощунник» или книжности слова «ругатель».
- source_word: לֹקֵחַ לוֹ קָלוֹן
  choice: навлекает на себя позор
  rationale: Сочетание לקח לוֹ указывает на получение последствий для себя, а קָלוֹן — на бесчестье или публичный позор. Русское «навлекает на себя» идиоматично выражает этот смысл.
- source_word: וּמוֹכִיחַ
  choice: а кто обличает
  rationale: Причастие Hiphil от יכח означает упрекать или обличать. «Обличает» сохраняет более резкую параллель к «наставляет».
- source_word: לְרָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное мужского рода употреблено обобщённо. Русское «нечестивого» точно и естественно передаёт нравственную характеристику, не добавляя существительного «человек».
- source_word: מוּמוֹ
  choice: пятно на себя
  rationale: מוּם буквально означает изъян, порок или пятно; суффикс допускает трудную и сжатую конструкцию. В основном тексте сохранён конкретный образ «пятна» и рефлексивное понимание по параллелизму, а неоднозначность суффикса отмечена в сноске.
theological_decisions:
- issue: К кому относится местоименный суффикс в מוּמוֹ и что означает выражение
  choice: Основной текст понимает выражение как пятно, которое обличающий навлекает на себя, по смысловому параллелизму с «на себя позор».
  alternative: 'Буквально: «его пятно»; суффикс может относиться к ближайшему «нечестивому», то есть речь может идти о его пороке, оскорблении или позорящем ответе.'
  rationale: Еврейская фраза кратка и неоднозначна. Перевод должен быть понятен по-русски, но альтернативное отнесение суффикса нельзя скрывать, поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Параллелизм двух частей сохранён; тире во второй части помогает избежать тяжеловесного повторения глагола. Единственный маркер [a] поставлен непосредственно после неоднозначного выражения.
