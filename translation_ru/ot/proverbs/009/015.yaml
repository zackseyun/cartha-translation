  text: 'чтобы окликать проходящих по дороге — тех, кто прямо идёт своим путём[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто выпрямляет свои пути». Еврейское причастие может указывать как на движение прямо, так и на то, что человек делает свои пути прямыми или сохраняет их прямыми.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: чтобы окликать
  rationale: Инфинитив выражает цель в составе более широкого предложения. «Окликать» естественно передаёт обращённый к прохожим громкий зов, не придавая ему оттенка официального призыва.
- source_word: לְעֹבְרֵי דָרֶךְ
  choice: проходящих по дороге
  rationale: Причастная форма сохраняет образ людей, которые в этот момент проходят по дороге.
- source_word: דָרֶךְ
  choice: дороге
  rationale: Здесь слово обозначает конкретную дорогу; такой перевод также позволяет отличить его от следующего אֹרְחוֹת — «путь».
- source_word: הַמְיַשְּׁרִים
  choice: тех, кто прямо идёт
  rationale: Форма от ישר допускает как значение прямого движения, так и значение выпрямления или сохранения прямоты пути. Основной текст естественно передаёт движение прямо, а альтернативный оттенок сохранён в сноске.
- source_word: אֹרְחוֹתָם
  choice: своим путём
  rationale: 'Русское единственное число имеет естественное распределительное значение: каждый идёт своим путём. Слово сохраняет и дорожный образ, и возможный нравственный подтекст литературы мудрости.'
theological_decisions:
- issue: Буквальный или нравственный смысл прямого пути
  choice: Не уточнять, является ли прямота только направлением движения или также нравственной характеристикой.
  alternative: 'Передать явно нравственно: «живущих праведно».'
  rationale: Дорожная метафора в контексте допускает нравственный подтекст, но еврейский текст не выражает его однозначно; явное «праведно» чрезмерно сузило бы смысл.
translation_notes:
  register: Современный литературный русский язык с сохранением синтаксической связи с предыдущим стихом; двоеточие показывает, что далее следует содержание зова. Формулировка образная, но понятная широкому кругу читателей.
