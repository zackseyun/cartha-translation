base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/003.yaml
  text: 'She has sent out her young women[b][a]; she calls from the heights of the city:'
translation:
  language: ru
  text: 'Она разослала своих девушек[a] и зовёт с самых высоких мест города[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих служанок». Еврейское слово обозначает девушек или молодых женщин; в данном контексте оно может относиться к служанкам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на высотах города».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלְחָה
  choice: разослала
  rationale: Форма qal, перфект, 3-е лицо женского рода; подлежащее — олицетворённая Мудрость. «Разослала» естественно передаёт завершённое действие и направление посланниц к людям.
- source_word: נַעֲרֹתֶיהָ
  choice: своих девушек
  rationale: Существительное обозначает девушек или молодых женщин; контекст допускает служанок либо помощниц, но сам термин не требует указания на их социальное положение.
- source_word: תִקְרָא
  choice: зовёт
  rationale: Форма qal, имперфект, 3-е лицо женского рода, описывает публичный призыв. «Зовёт» сохраняет прямой смысл, не усиливая его до «кричит» или «возглашает».
- source_word: עַל
  choice: с
  rationale: Буквально «на», однако при глаголе призыва русское «с» естественно обозначает место, откуда раздаётся голос.
- source_word: גַּפֵּי מְרֹמֵי
  choice: с вершин городских высот
  rationale: Сочетание двух слов, связанных с вершиной и возвышенностью, подчёркивает высокое и заметное место. Перевод сохраняет этот усиленный пространственный образ.
- source_word: קָרֶת
  choice: городских
  rationale: Поэтическое обозначение города передано современным общеупотребительным словом в составе естественной русской конструкции.
theological_decisions:
- issue: Кто зовёт во второй части стиха
  choice: Подлежащим остаётся олицетворённая Мудрость («она»).
  alternative: Зовут разосланные девушки.
  rationale: Глагол תִקְרָא стоит в единственном числе женского рода и грамматически продолжает действие Мудрости; множественное נַעֲרֹתֶיהָ не согласуется с ним как подлежащее.
translation_notes:
  register: Современный литературный русский язык с поэтической приподнятостью, уместной для книги Притч. Сочетание прошедшего времени «разослала» и настоящего «зовёт» отражает аспектуально-временной переход еврейского текста и делает продолжающийся призыв живым и непосредственным.
