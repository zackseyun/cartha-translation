base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/011.yaml
  text: Rescue those being taken away to death[a], and those staggering to the slaughter, hold them back.
translation:
  language: ru
  text: Спасай тех, кого уводят на смерть[a], и удержи тех, кто, шатаясь, идёт на заклание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «а тех, кто шатается к закланию, — если ты удерживаешься…» Последние слова синтаксически трудны: их можно связывать со следующим стихом; возможна также передача «не воздерживайся». В основном тексте передан наиболее вероятный по контексту призыв вмешаться.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצֵּל
  choice: Спасай
  rationale: Повелительная форма נצל выражает настоятельный призыв вмешаться и избавить людей от непосредственной опасности. «Спасай» естественно по-русски и сохраняет конкретную силу еврейского глагола.
- source_word: לְקֻחִים
  choice: тех, кого уводят
  rationale: Страдательное причастие от לקח обозначает людей, которых берут или уводят. Настоящее время передаёт продолжающееся действие; «уводят» соответствует образу движения к смерти и не сужает смысл до пленников.
- source_word: לַמָּוֶת
  choice: на смерть
  rationale: Предлог ל указывает здесь на направление или исход. Русское выражение «уводят на смерть» естественно и точно передаёт смертельную цель происходящего.
- source_word: וּמָטִים
  choice: кто, шатаясь, идёт
  rationale: Причастие передаёт неустойчивость, пошатывание или близость к падению. Оборот «шатаясь, идёт» сохраняет зримый образ людей, находящихся в крайней опасности.
- source_word: לַהֶרֶג
  choice: на заклание
  rationale: הרג означает насильственное умерщвление. «На заклание» — понятное и выразительное русское соответствие, сохраняющее тяжесть образа организованного убийства.
- source_word: אִם תַּחְשׂוֹךְ
  choice: и удержи
  rationale: 'Масоретская формулировка буквально трудна: «если удержишь/воздержишься». В контексте параллельного увещания смысл, вероятнее всего, состоит в призыве не дать погибающим дойти до смерти. «И удержи» ясно выражает эту побудительную силу, а буквальная неоднозначность отмечена в сноске.'
theological_decisions:
- issue: Синтаксическая функция אִם תַּחְשׂוֹךְ в конце стиха
  choice: 'Понято как продолжение увещания: «и удержи» идущих на заклание.'
  alternative: Сохранить буквальное и обрывочное «если удержишься» либо «если станешь удерживать», возможно связывая эти слова со следующим стихом; возможна также передача «не удерживайся».
  rationale: Это прежде всего синтаксическая, а не вероучительная трудность. Поскольку стих дан отдельно, параллельный призыв наиболее ясно передаёт нравственное требование текста, тогда как подлинная неоднозначность еврейской конструкции сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, настойчивая форма мудрого наставления. «Заклание» слегка возвышенно, но общеупотребительно в данном устойчивом образе и сохраняет достоинство и силу оригинала.
