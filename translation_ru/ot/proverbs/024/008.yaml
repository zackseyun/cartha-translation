  text: מְחַשֵּׁ֥ב לְ/הָרֵ֑עַ ל֝֗/וֹ בַּֽעַל מְזִמּ֥וֹת יִקְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/008.yaml
  text: Whoever plans to do evil—to him they will call, “master of schemes.”
translation:
  language: ru
  text: Кто замышляет причинить зло, того назовут мастером козней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְחַשֵּׁב לְהָרֵעַ
  choice: кто замышляет зло
  rationale: Причастная конструкция обозначает человека, обдумывающего или замышляющего причинить зло; русский оборот естественно передаёт намеренность.
- source_word: בַּעַל מְזִמּוֹת
  choice: мастер козней
  rationale: Буквально «обладатель/господин замыслов»; в данном отрицательном контексте выражение характеризует искусного интригана. «Мастер козней» сохраняет образность и неодобрительный смысл.
- source_word: יִקְרָאוּ־לוֹ
  choice: того назовут
  rationale: Неопределённо-личное «назовут» передаёт еврейскую форму множественного числа без названного деятеля, а «того» естественно соотносится с начальным «кто».
theological_decisions:
- issue: Нравственная характеристика מְזִמּוֹת
  choice: козней
  alternative: замыслов
  rationale: Само слово может обозначать планы или замыслы, но сочетание с намерением творить зло придаёт ему здесь явно отрицательную окраску; перевод не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма сохранена. Формулировка dignified и понятна широкому читателю.
