id: PRO.24.24
reference: Proverbs 24:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֹ֤מֵ֨ר לְ/רָשָׁע֮ צַדִּ֪יק אָ֥תָּה יִקְּבֻ֥/הוּ עַמִּ֑ים יִזְעָמ֥וּ/הוּ לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/024.yaml
  text: Whoever says to the wicked[a], “You are righteous,” peoples will curse him; nations will denounce him.
translation:
  language: ru
  text: 'Кто говорит нечестивому: «Ты праведен»[a], того проклянут народы, на того будут негодовать племена.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты прав».'
    reason: Лексема צַדִּיק может указывать как на нравственную праведность, так и на признание человека правым или невиновным.
lexical_decisions:
- source_word: אֹמֵר
  choice: Кто говорит
  rationale: Причастие мужского рода единственного числа имеет обобщённое значение; конструкция «кто говорит» естественно передаёт неопределённого участника в изречении.
- source_word: לְרָשָׁע
  choice: нечестивому
  rationale: רָשָׁע здесь обозначает нравственно порочного человека; субстантивированное «нечестивому» сохраняет этическое противопоставление слову צַדִּיק.
- source_word: צַדִּיק
  choice: праведен
  rationale: «Праведен» сохраняет основное этическое значение צַדִּיק и прямой контраст с «нечестивым», не исключая возможного оттенка признания человека правым.
- source_word: אָתָּה
  choice: ты
  rationale: Явно выраженное местоимение естественно сохраняется в прямой речи без добавочного усиления.
- source_word: יִקְּבֻהוּ
  choice: того проклянут
  rationale: Глагол נקב в данном употреблении означает произнесение проклятия; «проклянут» сохраняет силу исходного выражения.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число передаёт совокупности людей и сохраняет параллелизм со следующим обозначением общностей.
- source_word: יִזְעָמוּהוּ
  choice: на того будут негодовать
  rationale: זעם выражает сильное возмущение и гнев; «будут негодовать» передаёт это значение, не сливая его с проклятием в первой строке.
- source_word: לְאֻמִּים
  choice: племена
  rationale: «Племена» сохраняет отличие от עַמִּים («народы») и подходит для поэтического параллелизма, обозначая человеческие общности.
theological_decisions:
- issue: Этический или судебно-правовой оттенок צַדִּיק
  choice: Ты праведен
  alternative: Ты прав
  rationale: Основной текст сохраняет характерное для литературы мудрости нравственное противопоставление нечестивого и праведного, а сноска отмечает допустимое судебно-оценочное прочтение.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Синтаксический параллелизм и различие между двумя обозначениями общностей и двумя видами враждебной реакции сохранены.
