  yaml_path: translation/ot/proverbs/024/013.yaml
  text: Eat honey[a], my son, for it is good[b], and honey from the comb is sweet to your taste.
translation:
  language: ru
  text: Ешь, сын мой, мёд, потому что он хорош, и мёд из сот[a] сладок твоему нёбу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «медовые капли»; еврейское слово может означать сотовый мёд или мёд, стекающий из сот.'
