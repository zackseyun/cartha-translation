id: PRO.24.12
reference: Proverbs 24:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי תֹאמַ֗ר הֵן֮ לֹא יָדַ֪עְנ֫וּ זֶ֥ה הֲֽ/לֹא תֹ֘כֵ֤ן לִבּ֨וֹת הֽוּא יָבִ֗ין וְ/נֹצֵ֣ר נַ֭פְשְׁ/ךָ ה֣וּא יֵדָ֑ע וְ/הֵשִׁ֖יב לְ/אָדָ֣ם כְּ/פָעֳלֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/012.yaml
  text: If you say[a], “Look, we did not know this,” does not he who weighs hearts understand, and he who keeps your soul know[e][d][c][b], and will he not repay a man according to his work?
translation:
  language: ru
  text: 'Если ты скажешь: «Вот, мы этого не знали»[a], — разве Тот, кто взвешивает сердца[b], не поймёт? Разве Тот, кто хранит твою жизнь[c], не знает? И разве Он не воздаст человеку[d] по его делу[e]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы ничего об этом не знали».'
    reason: lexical_alternative
  - marker: b
    text: Образ взвешивания сердец означает исследование Богом внутренних побуждений.
    reason: cultural_note
  - marker: c
    text: 'Или: «твою душу»; «тебя самого». Еврейское слово может означать душу, жизнь или самого человека.'
    reason: lexical_alternative
  - marker: d
    text: Слово «человек» здесь употреблено в обобщающем смысле.
    reason: lexical_alternative
  - marker: e
    text: 'Или: «по тому, что он сделал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: Если ты скажешь
  rationale: כִּי вводит условный случай, а форма второго лица единственного числа сохранена прямым обращением «ты».
- source_word: הֵן לֹא יָדַעְנוּ זֶה
  choice: Вот, мы этого не знали
  rationale: «Вот» передаёт вводное הֵן, а формулировка сохраняет первое лицо множественного числа и ссылку на конкретное «это».
- source_word: תֹכֵן לִבּוֹת
  choice: Тот, кто взвешивает сердца
  rationale: Сохранён образ взвешивания, обозначающий исследование и нравственную оценку внутренних побуждений.
- source_word: יָבִין
  choice: не поймёт
  rationale: Глагол בין передаёт понимание и проницательное распознавание; в риторическом вопросе отрицание подразумевает утвердительный ответ.
- source_word: וְנֹצֵר נַפְשְׁךָ
  choice: Тот, кто хранит твою душу
  rationale: נצר означает хранить или оберегать, а «душа» сохраняет широту נֶפֶשׁ, хотя по контексту возможно и значение «жизнь».
- source_word: וְהֵשִׁיב
  choice: И разве Он не воздаст
  rationale: Порода hифиль глагола שוב здесь выражает ответное воздаяние; риторическая форма передаёт ожидаемый утвердительный смысл.
- source_word: לְאָדָם כְּפָעֳלוֹ
  choice: человеку по его делу
  rationale: Сохранены обобщающий единственный אָדָם и единственное число פֹּעַל; «дело» обозначает совершённый поступок или деятельность, за которую следует воздаяние.
theological_decisions:
- issue: Значение נֶפֶשׁ
  choice: твою душу
  alternative: твою жизнь
  rationale: «Душа» сохраняет традиционный и более широкий антропологический образ, не сводя слово только к физической жизни; допустимое контекстное значение «жизнь» отмечено в сноске.
- issue: Божественное знание и воздаяние
  choice: Сохранены риторические вопросы без поясняющего утверждения
  alternative: Он непременно понимает, знает и воздаст
  rationale: Еврейская форма ожидает ответа «да», но выражает мысль вопросами; перевод не устраняет эту риторическую напряжённость.
- issue: Обобщающее אָדָם
  choice: человеку
  alternative: каждому
  rationale: «Человеку» формально сохраняет существительное в единственном числе и при этом естественно имеет обобщающий смысл в русском языке.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрости. Синтаксис разделён на три риторических вопроса ради ясности, при этом последовательность мысли и повтор местоимения הוּא сохранены. Прописное «Он» указывает на Бога, подразумеваемого описаниями, не добавляя имени, отсутствующего в стихе.
