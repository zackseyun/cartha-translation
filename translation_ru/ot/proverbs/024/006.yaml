  text: כִּ֣י בְ֭/תַחְבֻּלוֹת תַּעֲשֶׂה לְּ/ךָ֣ מִלְחָמָ֑ה וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/006.yaml
  text: For by wise guidance you will wage war[b][a], and victory is in an abundance of counselors.
translation:
  language: ru
  text: Ведь благодаря продуманной стратегии[a] ты будешь вести войну, а победа[b] — при множестве советников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с помощью умелого руководства»; еврейское слово может обозначать мудрые советы, искусное руководство или тактическое планирование.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавление»; в контексте войны слово точнее указывает на победу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит обоснование предшествующего наставления; «ведь» естественно передаёт пояснительную связь в русском изречении.
- source_word: בְתַחְבֻּלוֹת
  choice: благодаря продуманной стратегии
  rationale: תַּחְבֻּלוֹת обозначает умелое руководство, тактическое планирование или стратегические замыслы; предлог בְּ передан как указание на средство.
- source_word: תַּעֲשֶׂה לְּךָ מִלְחָמָה
  choice: ты будешь вести войну
  rationale: Сочетание עשה מלחמה идиоматически означает «вести войну». Форма второго лица единственного числа сохранена; לְךָ не передано громоздким «для себя», поскольку в русском оно создало бы иной оттенок.
- source_word: וּתְשׁוּעָה
  choice: а победа
  rationale: В военном контексте תְּשׁוּעָה обозначает успешный исход — победу, хотя более широкое значение слова включает избавление и спасение.
- source_word: בְּרֹב
  choice: при множестве
  rationale: Оборот указывает на условие или средство достижения победы и сохраняет акцент на многочисленности советников.
- source_word: יוֹעֵץ
  choice: советников
  rationale: Хотя форма морфологически единственного числа, в сочетании с רֹב она имеет собирательный смысл, естественно передаваемый русским множественным числом.
