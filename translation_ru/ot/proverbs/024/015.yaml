  text: אַל תֶּאֱרֹ֣ב רָ֭שָׁע לִ/נְוֵ֣ה צַדִּ֑יק אַֽל תְּשַׁדֵּ֥ד רִבְצ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/015.yaml
  text: Do not lie in wait[a], O wicked man, against the dwelling of the righteous[b]; do not devastate his resting place.
translation:
  language: ru
  text: Не устраивай засады[a], нечестивец, у жилища праведника; не разоряй место его покоя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не подстерегай жилище праведника».'
    reason: Еврейский глагол означает скрытно ожидать с намерением напасть; конструкция допускает передачу как через «устраивать засаду», так и через «подстерегать».
  - marker: b
    text: 'Буквально: «место, где он ложится»; также возможно: «место его отдохновения».'
    reason: Еврейское רִבְצוֹ сохраняет конкретный образ места лежания или покоя.
lexical_decisions:
- source_word: אַל
  choice: не
  rationale: Отрицательная частица вводит прямой запрет; русская конструкция с глаголом несовершенного вида естественно передаёт запретительное значение.
- source_word: תֶּאֱרֹב
  choice: таись в засаде
  rationale: Глагол ארב обозначает скрытое ожидание с намерением напасть. «Таись в засаде» сохраняет образ хищного подстерегания, не сужая его до открытого нападения.
- source_word: רָשָׁע
  choice: нечестивец
  rationale: Субстантивированное прилагательное мужского рода относится к единственному адресату. «Нечестивец» естественно передаёт прямое обращение и нравственную оценку.
- source_word: לִנְוֵה
  choice: у жилища
  rationale: נָוֶה означает жилище, обитель. Предлог ל в контексте засады допускает локально-направительное понимание; «у жилища» звучит по-русски естественно и не добавляет объекта нападения, которого форма прямо не выражает.
- source_word: צַדִּיק
  choice: праведника
  rationale: Передаёт этическую характеристику צַדִּיק и сохраняет значение единственного числа.
- source_word: תְּשַׁדֵּד
  choice: разоряй
  rationale: Пиэль от שדד означает насильственно опустошать, разорять или грабить. «Разоряй» охватывает разрушение и лишение имущества, не сводя смысл только к краже.
- source_word: רִבְצוֹ
  choice: место его покоя
  rationale: Слово от רבץ буквально обозначает место, где ложатся или отдыхают. Выбор сохраняет образ безопасного места отдохновения без неуместно животного оттенка слова «логово».
