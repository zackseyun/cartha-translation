source:
  edition: WLC
  text: כִּי שֹׁ֭ד יֶהְגֶּ֣ה לִבָּ֑/ם וְ֝/עָמָ֗ל שִׂפְתֵי/הֶ֥ם תְּדַבֵּֽרְנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/002.yaml
  text: For their heart meditates on destruction[b][a], and their lips speak trouble.
translation:
  language: ru
  text: Потому что сердце их помышляет о насилии[a], и уста их говорят злое[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о разорении» либо «об опустошении». Еврейское слово שֹׁד может подчёркивать не только насилие, но и причиняемое им разрушение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «беду» либо «пагубу». Еврейское עָמָל здесь обозначает зло, причиняющее страдание и вред.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Передаёт причинно-пояснительную связь с запретом в предыдущем стихе.
- source_word: שֹׁד
  choice: насилие
  rationale: Слово обозначает насильственное разорение или разрушительное злодеяние; «насилие» естественно выражает нравственный характер замыслов нечестивых, не исключая оттенка причиняемого разорения.
- source_word: יֶהְגֶּה
  choice: помышляет
  rationale: При подлежащем «сердце» глагол указывает на внутреннее, продолжающееся обдумывание. «Помышляет» сохраняет эту образность и не усиливает значение до однозначного «замышляет».
- source_word: לִבָּם
  choice: сердце их
  rationale: Сохранён собирательный единственный образ еврейского текста, где сердце обозначает внутренний мир, мысли и волю.
- source_word: וְעָמָל
  choice: злое
  rationale: В данном параллелизме существительное означает причиняющее беду зло или пагубу. Субстантивированное «злое» позволяет по-русски естественно передать прямой объект речи, не превращая его в тему разговора.
- source_word: שִׂפְתֵיהֶם
  choice: уста их
  rationale: Сохранён поэтический образ и противопоставление внутреннего помышления сердца внешней речи уст.
- source_word: תְּדַבֵּרְנָה
  choice: говорят
  rationale: Настоящее время естественно передаёт общехарактерное утверждение притчи.
