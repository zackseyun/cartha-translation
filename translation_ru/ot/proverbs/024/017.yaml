  text: Do not rejoice when your enemy falls[a], and do not let your heart exult when he stumbles,
translation:
  language: ru
  text: Не радуйся, когда падает твой враг, и когда он спотыкается, пусть не ликует твоё сердце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְפֹל
  choice: когда падает
  rationale: 'Предлог ב с инфинитивом сопряжённой формы здесь выражает время: «когда падает». Такая передача естественна по-русски и сохраняет образ падения.'
- source_word: אֹיְבֶיךָ
  choice: твой враг
  rationale: Хотя форма допускает морфологическую неоднозначность, местоименный суффикс единственного числа в параллельной строке указывает здесь на одного врага или на обобщённого противника.
- source_word: אַל תִּשְׂמָח
  choice: не радуйся
  rationale: אַל с имперфектом выражает запрет; «не радуйся» — прямой, естественный и стилистически уместный эквивалент.
- source_word: וּבִכָּשְׁלוֹ
  choice: и когда он спотыкается
  rationale: ב с формой כשל имеет временное значение. «Спотыкается» сохраняет отличие כשל от נפל («падает») и образ начинающейся неудачи или утраты устойчивости.
- source_word: יָגֵל
  choice: пусть не ликует
  rationale: גיל обозначает выраженную, торжествующую радость; «ликовать» передаёт более сильный оттенок и сохраняет отличие от שמח («радоваться»).
- source_word: לִבֶּךָ
  choice: твоё сердце
  rationale: «Сердце» сохраняет характерный для еврейской литературы образ внутреннего мира человека и естественно звучит в русском библейском наставлении.
