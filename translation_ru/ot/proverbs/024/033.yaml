  text: Немного поспать, немного подремать, немного сложить руки, чтобы полежать[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы отдохнуть». Еврейский инфинитив может означать «лечь; лежать», а отдых или сон подразумевается контекстом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט
  choice: немного
  rationale: Троекратное «немного» сохраняет нарастающий риторический повтор и мысль о малых уступках лени.
- source_word: שֵׁנוֹת
  choice: поспать
  rationale: Формально это множественное число существительного «сон», однако русский инфинитив естественно сочетается с «немного» и передаёт действие в афористическом ритме.
- source_word: תְּנוּמוֹת
  choice: подремать
  rationale: Сохраняет поэтический параллелизм со «поспать», различая более лёгкую дремоту и сон.
- source_word: חִבֻּק יָדַיִם
  choice: сложить руки
  rationale: Буквально речь об обхватывании или складывании рук; русское «сложить руки» естественно передаёт позу бездействия, не добавляя отсутствующей в тексте оценки.
- source_word: לִשְׁכָּב
  choice: чтобы полежать
  rationale: Инфинитив обозначает цель или результат складывания рук. «Полежать» передаёт общее значение лежания и не сужает его до сна.
