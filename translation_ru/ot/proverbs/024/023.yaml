source:
  edition: WLC
  text: גַּם אֵ֥לֶּה לַֽ/חֲכָמִ֑ים הַֽכֵּר פָּנִ֖ים בְּ/מִשְׁפָּ֣ט בַּל טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/023.yaml
  text: 'These also are sayings of the wise: to show partiality in judgment is not good[a][b].'
translation:
  language: ru
  text: 'Вот ещё изречения мудрых:[a]

    проявлять лицеприятие[b] на суде — нехорошо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «И эти — мудрым (или: для мудрых)». Вероятно, это заголовок со смыслом: «Вот ещё изречения мудрых».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «узнавать лица» — еврейское выражение, означающее проявлять пристрастие или оказывать предпочтение одним людям перед другими.'
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: Вот ещё
  rationale: Передаёт добавочное значение גַּם и указательное אֵלֶּה, естественно вводя новый раздел изречений.
- source_word: לַחֲכָמִים
  choice: изречения мудрых
  rationale: Буквально выражение означает «мудрым / для мудрых», но здесь, вероятнее всего, служит кратким заголовком, указывающим на изречения, принадлежащие мудрецам или исходящие от них.
- source_word: הַכֵּר פָּנִים
  choice: проявлять лицеприятие
  rationale: Еврейская идиома буквально означает «узнавать лица» и в судебном контексте говорит о пристрастном отношении к людям.
- source_word: בְּמִשְׁפָּט
  choice: на суде
  rationale: מִשְׁפָּט здесь обозначает судебное разбирательство или вынесение решения; «на суде» ясно и естественно передаёт этот контекст.
- source_word: בַּל טוֹב
  choice: нехорошо
  rationale: Кратко сохраняет общее нравственное суждение еврейского текста, не сужая его до значения «незаконно» или «неподобающе».
theological_decisions:
- issue: Эллиптический смысл לַחֲכָמִים
  choice: 'Понимать как заголовок: «Вот ещё изречения мудрых»'
  alternative: «И это — для мудрых» или «И это принадлежит мудрым»
  rationale: Положение стиха в начале нового подраздела поддерживает заголовочное понимание, однако буквальная грамматическая форма сохранена в примечании как реальная неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма оригинала сохранена. «Лицеприятие» — устоявшееся и точное слово для судебной пристрастности, а примечание поясняет исходную идиому.
