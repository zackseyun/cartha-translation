id: PRO.24.18
reference: Proverbs 24:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: פֶּן יִרְאֶ֣ה יְ֭הוָה וְ/רַ֣ע בְּ/עֵינָ֑י/ו וְ/הֵשִׁ֖יב מֵ/עָלָ֣י/ו אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/018.yaml
  text: lest Yahweh see it[a], and it be evil in his eyes, and he turn his anger away from him.
translation:
  language: ru
  text: как бы Яхве не увидел этого и это не оказалось злом в Его глазах[a], и Он не отвратил от него Свой гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и это не стало неугодным Ему».'
    reason: 'Лексико-смысловой вариант: выражение רַע בְּעֵינָיו может описывать как зло в Божьей оценке, так и то, что Ему неугодно.'
lexical_decisions:
- source_word: פֶּן
  choice: как бы … не
  rationale: В данном предостерегающем контексте вводит нежелательное возможное последствие; эта русская конструкция передаёт его без архаизации.
- source_word: יִרְאֶה
  choice: увидел
  rationale: Форма имперфекта после פֶּן выражает возможное последствие и естественно передаётся русским прошедшим видом в конструкции «как бы … не».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: וְרַע בְּעֵינָיו
  choice: и это не оказалось злом в Его глазах
  rationale: Сохраняет оценочную лексику «зло» и еврейский образ «в глазах», при этом по-русски обозначает возможный результат.
- source_word: וְהֵשִׁיב
  choice: и Он не отвратил
  rationale: Hiphil от שׁוב означает побудить повернуться или отвести; «отвратил» естественно сочетается с гневом и сохраняет образ удаления.
- source_word: מֵעָלָיו
  choice: от него
  rationale: Передаёт удаление гнева, находящегося на противнике или направленного против него.
- source_word: אַפּוֹ
  choice: Свой гнев
  rationale: Хотя буквально слово связано с «носом», здесь это устойчивое обозначение гнева; возвратное местоимение ясно указывает на Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это отличие от титула.
- issue: Оценка человеческого злорадства Богом
  choice: «оказалось злом в Его глазах»
  alternative: «стало Ему неугодно»
  rationale: Основной текст сохраняет сильное и неоднозначное רַע — «зло» — не сводя его лишь к неудовольствию; смысловой вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «как бы … не» связывает стих с запретом в Притчах 24:17 и передаёт предостережение, не превращая возможное последствие в безусловное предсказание.
