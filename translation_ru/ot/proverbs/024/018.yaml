  source_fidelity: «Как бы … не» надлежащим образом передаёт פֶּן как предостережение о нежелательном последствии, сохраняя связь с предшествующим запретом. Все последующие глагольные формы естественно находятся в сфере этого предостережения. «Яхве» точно передаёт тетраграмматон. «Это не оказалось злом в Его глазах» сохраняет и оценочное רַע, и образ בְּעֵינָיו; «не отвратил от него Свой гнев» верно передаёт וְהֵשִׁיב מֵעָלָיו אַפּוֹ.
