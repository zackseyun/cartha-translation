  yaml_path: translation/ot/proverbs/024/031.yaml
  text: and behold[a], it was all overgrown with thorns; nettles covered its surface[c][b], and its stone wall was broken down.
translation:
  language: ru
  text: 'И вот: весь он зарос колючками[a], сорняки[b] покрыли его поверхность[c], а его каменная ограда была разрушена.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чертополохом»; точный вид растения неизвестен, но речь идёт о вредной колючей поросли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крапивой», «зарослями»; точное значение названия растения неясно.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «его лицо»; здесь имеется в виду поверхность участка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт указательно-восклицательную силу оборота и живость непосредственного наблюдения, оставаясь естественным для современного русского повествования.
- source_word: עָלָה כֻלּוֹ
  choice: весь он зарос
  rationale: В земледельческом контексте глагол описывает растительность, беспрепятственно разросшуюся по всему участку; русский результативный глагол «зарос» передаёт это естественно.
- source_word: קִמְּשֹׂנִים
  choice: колючками
  rationale: Точный вид растения неизвестен; слово обозначает вредную колючую растительность. Обобщённое «колючки» сохраняет смысл без необоснованной ботанической конкретизации.
- source_word: כָּסּוּ
  choice: покрыли
  rationale: Прямо и естественно передаёт действие глагола в описании состояния заброшенного участка.
- source_word: פָנָיו
  choice: его поверхность
  rationale: Буквально «его лицо»; применительно к полю или винограднику это идиома со значением видимой поверхности.
- source_word: חֲרֻלִּים
  choice: сорняки
  rationale: Слово обозначает нежелательную дикую растительность, но точная ботаническая идентификация неясна. «Сорняки» отличается от «колючек» и не создаёт ложной точности.
- source_word: וְגֶדֶר אֲבָנָיו
  choice: а каменная ограда его
  rationale: Речь идёт о сложенной из камней границе участка. «Ограда» уместнее для сельскохозяйственного владения, чем более монументальное «стена»; союз «а» естественно вводит последний признак запустения.
- source_word: נֶהֱרָסָה
  choice: развалилась
  rationale: Передаёт разрушенное состояние ограды как следствие запустения и звучит естественно по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «и вот». Местоимения мужского рода соотносятся с виноградником из ближайшего контекста. Ботаническая неопределённость обоих еврейских терминов сохранена в примечаниях; основной текст избегает чрезмерной конкретизации.
