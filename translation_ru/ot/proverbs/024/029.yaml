id: PRO.24.29
reference: Proverbs 24:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַל תֹּאמַ֗ר כַּ/אֲשֶׁ֣ר עָֽשָׂה לִ֭/י כֵּ֤ן אֶֽעֱשֶׂה לּ֑/וֹ אָשִׁ֖יב לָ/אִ֣ישׁ כְּ/פָעֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/029.yaml
  text: Do not say[a], “As he has done to me, so I will do to him; I will repay the man according to his deed.”
translation:
  language: ru
  text: 'Не говори: «Как он поступил со мной, так и я поступлю с ним; я воздам этому человеку по его поступку[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я отплачу этому человеку за то, что он сделал».'
    reason: 'Лексико-синтаксический вариант: אָשִׁיב и כְּפָעֳלוֹ можно естественно передать более развёрнутой конструкцией «отплачу… за то, что он сделал».'
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Отрицательная частица אַל с имперфектом выражает запрет; «не говори» прямо и естественно передаёт эту форму в современном русском языке.
- source_word: כַּאֲשֶׁר עָשָׂה לִי
  choice: Как он поступил со мной
  rationale: כַּאֲשֶׁר вводит сравнение, а עָשָׂה לִי обозначает совершённое по отношению к говорящему действие. «Поступил со мной» по-русски естественнее буквального «сделал мне» и сохраняет широкое значение глагола.
- source_word: כֵּן אֶעֱשֶׂה לּוֹ
  choice: так и я поступлю с ним
  rationale: Соотносительная конструкция כַּאֲשֶׁר…כֵּן передаёт намерение ответить тем же. Русская конструкция «как… так и…» сохраняет эту симметрию.
- source_word: אָשִׁיב
  choice: я воздам
  rationale: Hiphil глагола שוב буквально связан с возвращением, а в данном контексте означает ответное воздаяние. «Воздам» кратко и точно передаёт смысл намеренной расплаты.
- source_word: לָאִישׁ
  choice: этому человеку
  rationale: אִישׁ здесь указывает на уже упомянутого обидчика. Указательное «этому» естественно передаёт определённость, а «человеку» сохраняет референцию без ненужного усиления половой маркированности в русском контексте.
- source_word: כְּפָעֳלוֹ
  choice: по его поступку
  rationale: פֹּעַל обозначает дело, действие или поступок. Единственное число сохранено; «по его поступку» выражает меру ответного воздаяния и звучит естественнее, чем «по его работе».
theological_decisions:
- issue: Нравственная направленность запрета
  choice: Сохранён прямой запрет на намерение лично отплатить обидчику тем же.
  alternative: Истолковать стих как запрет любого воздаяния вообще либо лишь как предостережение от неосторожных слов.
  rationale: Текст запрещает говорить о зеркальном ответе и воздаянии за поступок. Перевод сохраняет личный, мстительный характер намерения, не расширяя стих до общего учения о всяком правосудии.
- issue: Смысл ответного действия
  choice: «Воздам» сохраняет идею соразмерной расплаты, не уточняя ни форму, ни законность такого действия.
  alternative: «Отомщу» прямо обозначило бы месть, но сузило бы более широкий смысл אָשִׁיב.
  rationale: Исходный глагол допускает значение «вернуть, отплатить, воздать». Более широкое «воздам» сохраняет смысловую напряжённость и не добавляет отсутствующего в тексте термина «месть».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, уместным для Писания глаголом «воздам». Параллелизм и личная речь оригинала сохранены; синтаксис остаётся ясным для обычного читателя.
