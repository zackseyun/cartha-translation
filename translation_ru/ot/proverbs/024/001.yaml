  text: אַל תְּ֭קַנֵּא בְּ/אַנְשֵׁ֣י רָעָ֑ה וְ/אַל תתאו לִ/הְי֥וֹת אִתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/001.yaml
  text: Do not envy evil men[b][a], and do not desire to be with them.
translation:
  language: ru
  text: Не завидуй злым людям и не желай быть с ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Не завидуй
  rationale: Отрицательная частица אַל с глагольной формой выражает запрет; קנא здесь означает зависть к злым людям, а не ревность или усердие.
- source_word: בְּאַנְשֵׁי רָעָה
  choice: злым людям
  rationale: Сочетание буквально означает «людям зла», то есть людям, которых характеризует зло. «Злым людям» естественно и точно передаёт смысл на современном русском языке.
- source_word: וְאַל תתאו
  choice: и не желай
  rationale: Союз сохраняет параллелизм двух запретов, а אוה выражает желание или стремление без обязательного оттенка сильной страсти.
- source_word: לִהְיוֹת אִתָּם
  choice: быть с ними
  rationale: Буквальная и естественная передача оборота с היה и предлогом אֵת; формулировка сохраняет возможные оттенки как пребывания в их обществе, так и приобщения к ним.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, наставительная форма и параллелизм еврейского текста сохранены. Мужской род исходного אַנְשֵׁי в русском множественном числе естественно передан общим выражением «людям», без искусственного сужения адресата только до мужчин.
