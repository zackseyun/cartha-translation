  yaml_path: translation/ot/proverbs/024/027.yaml
  text: Prepare your work outside[a]; make it ready for yourself in the field; afterward[b], build your house.
translation:
  language: ru
  text: Подготовь свою работу вне дома, приведи её в готовность в поле для себя, а затем строй свой дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Слово «дом» может также подразумевать семью или домашнее хозяйство, однако противопоставление внешнему пространству и полю поддерживает здесь конкретный смысл.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכֵן
  choice: Приготовь
  rationale: Императив от כון означает привести в готовность или надлежащий порядок; «приготовь» естественно передаёт начало последовательности действий.
- source_word: בַּחוּץ
  choice: снаружи
  rationale: Слово обозначает внешнее, открытое пространство и сохраняет пространственное противопоставление последующему «дому».
- source_word: מְלַאכְתֶּךָ
  choice: свою работу
  rationale: מְלָאכָה широко обозначает работу, труд или занятие; «работу» не сужает смысл до отдельного поручения.
- source_word: וְעַתְּדָהּ
  choice: устрой её
  rationale: Пиэль глагола עתד означает подготовить, устроить, привести в готовность; местоименный суффикс женского рода относится к «работе».
- source_word: בַּשָּׂדֶה לָךְ
  choice: для себя в поле
  rationale: «В поле» сохраняет конкретное место производительного труда, а «для себя» передаёт дательный личной заинтересованности.
- source_word: אַחַר
  choice: а после
  rationale: Наречие задаёт временную последовательность и подчёркивает приоритет подготовки труда перед строительством.
- source_word: וּבָנִיתָ בֵיתֶךָ
  choice: построй свой дом
  rationale: Буквальный и контекстуально наиболее вероятный смысл — строительство дома; возможное расширение до семьи или хозяйства не вносится в основной текст.
theological_decisions:
- issue: Смысл выражения «построй свой дом»
  choice: Сохранён конкретный смысл строительства жилища с указанием возможного более широкого значения в сноске.
  alternative: Передать как «устрой свою семью» или «создай домашнее хозяйство».
  rationale: Непосредственное противопоставление внешнего пространства и поля дому поддерживает конкретный смысл, однако в литературе мудрости «дом» способен обозначать также семью или хозяйство.
translation_notes:
  register: Современный литературный русский язык с лаконичным, наставительным звучанием. Сохранены повелительные формы и последовательность действий; формулировки не вводят конфессионального толкования.
