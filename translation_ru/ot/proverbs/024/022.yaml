  text: כִּֽי פִ֭תְאֹם יָק֣וּם אֵידָ֑/ם וּ/פִ֥יד שְׁ֝נֵי/הֶ֗ם מִ֣י יוֹדֵֽעַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/022.yaml
  text: For their disaster will rise suddenly[b][a], and who knows the ruin of them both?
translation:
  language: ru
  text: Ведь их беда внезапно разразится[a], и кто знает, какую погибель принесут они оба?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их бедствие внезапно восстанет (возникнет)».'
    reason: lexical_alternative
  - marker: b
    text: «Они оба», вероятнее всего, — Господь и царь, названные в предыдущем стихе; возможны и другие понимания того, о каких двух сторонах идёт речь.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для предостережения в предыдущем стихе; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: פִתְאֹם
  choice: внезапно
  rationale: Передаёт неожиданность и стремительность бедствия, сохраняя предостерегающий тон.
- source_word: יָקוּם
  choice: постигнет
  rationale: Буквально глагол означает «встанет, возникнет», однако в сочетании с «бедой» по-русски естественнее сказать «беда постигнет»; буквальный образ отмечен в сноске.
- source_word: אֵידָם
  choice: беда постигнет их
  rationale: אֵיד обозначает бедствие или несчастье, а местоименный суффикс соотносит его с людьми, которых оно настигнет. Формулировка звучит естественно на современном русском.
- source_word: וּפִיד
  choice: и… погибель
  rationale: פִיד — гибельное бедствие, разорение; «погибель» сохраняет весомость слова и поэтический параллелизм, не повторяя «беду».
- source_word: שְׁנֵיהֶם
  choice: они оба
  rationale: Форма буквально указывает на двоих. Русская формулировка не называет их прямо, сохраняя неоднозначность референта.
- source_word: מִי יוֹדֵעַ
  choice: кто знает
  rationale: Краткий риторический вопрос, выражающий невозможность предвидеть или оценить грядущую погибель.
theological_decisions:
- issue: К кому относится «они оба» (שְׁנֵיהֶם)
  choice: Не уточнять референт в основном тексте; вероятнее всего, имеются в виду Господь и царь, названные в предыдущем стихе.
  alternative: Под «обоими» могут подразумеваться иные две стороны, выводимые из контекста, например царь и мятежники.
  rationale: 'Непосредственно перед этим названы Господь и царь, поэтому такое понимание наиболее связно: невозможно предугадать погибель, которую они навлекут на непокорных. Однако еврейская формулировка не называет референтов прямо, и перевод не должен устранять эту неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с кратким, весомым предостерегающим тоном. Синтаксис сделан естественным для русского, а буквальная образность и неоднозначность еврейского текста отражены в сносках.
