source:
  edition: WLC
  text: אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בָּ/רְשָׁעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/019.yaml
  text: Do not be agitated because of evildoers[a]; do not envy the wicked.
translation:
  language: ru
  text: Не раздражайся из-за тех, кто делает зло,[a] и не завидуй нечестивым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не досадуй на тех, кто делает зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְחַר
  choice: не раздражайся
  rationale: Хитпаэль глагола חרה обозначает внутреннее возбуждение, досаду или разгоревшийся гнев. «Не раздражайся» естественно передаёт эмоциональную взвинченность, не сводя значение только к открытому гневу.
- source_word: בַּמְּרֵעִים
  choice: из-за тех, кто делает зло
  rationale: 'Предлог ב при этом глаголе имеет причинно-объектное значение: речь об эмоциональной реакции на делающих зло. Развёрнутая формулировка сохраняет причастный характер מְרֵעִים.'
- source_word: תְּקַנֵּא
  choice: не завидуй
  rationale: В литературе мудрости קנא с ב обычно выражает зависть к другому человеку; «завидовать» здесь ясно и идиоматично.
- source_word: בָּרְשָׁעִים
  choice: нечестивым
  rationale: רְשָׁעִים — обычное для Притч обозначение нравственно порочных и виновных людей. «Нечестивые» сохраняет краткость и возвышенный характер изречения.
- source_word: אַל
  choice: не
  rationale: אַל с формой имперфекта выражает прямой запрет; русская отрицательная повелительная конструкция передаёт его естественно.
theological_decisions: []
