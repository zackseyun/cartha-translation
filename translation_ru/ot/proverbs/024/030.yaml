source:
  edition: WLC
  text: עַל שְׂדֵ֣ה אִישׁ עָצֵ֣ל עָבַ֑רְתִּי וְ/עַל כֶּ֝֗רֶם אָדָ֥ם חֲסַר לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/030.yaml
  text: I passed by the field of a sluggard[a], and by the vineyard of a man lacking sense.
translation:
  language: ru
  text: Я проходил мимо поля ленивца и мимо виноградника человека, лишённого разума[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лишённого сердца»; то есть не имеющего понимания или здравого смысла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל ... עָבַרְתִּי
  choice: проходил мимо
  rationale: В сочетании с глаголом עבר предлог עַל обозначает движение мимо места; по-русски это естественно передаётся сочетанием «проходил мимо».
- source_word: שְׂדֵה אִישׁ עָצֵל
  choice: поля ленивца
  rationale: שׂדה здесь означает возделываемое поле, а אישׁ עָצֵל — его владельца, характеризуемого как ленивый. «Ленивец» сохраняет краткость и характерный для Притч нравственный тип.
- source_word: כֶּרֶם
  choice: виноградника
  rationale: Обычное значение слова — возделываемый виноградник; оно образует параллель к полю в первой строке.
- source_word: אָדָם
  choice: человека
  rationale: Слово обозначает отдельного человека и параллельно אישׁ; русский родительный оборот естественно передаёт принадлежность виноградника.
- source_word: חֲסַר לֵב
  choice: лишённого разума
  rationale: Буквально «лишённого сердца», но в языке Притч «сердце» включает способность понимать и здраво судить. «Лишённого разума» передаёт идиоматический смысл, а буквальный образ сохраняется в сноске.
theological_decisions:
- issue: Антропологический смысл выражения חֲסַר לֵב
  choice: лишённого разума
  alternative: лишённого сердца; не имеющего понимания
  rationale: Речь не об отсутствии чувств или физического сердца, а о недостатке рассудительности и нравственного понимания. Перевод не сужает выражение до одной конфессиональной трактовки; буквальная форма указана в сноске.
- issue: Передача אָדָם в мужском параллелизме
  choice: человека
  alternative: мужчины; того, кто
  rationale: «Человека» точно и естественно соответствует אָדָם, не усиливая мужскую семантику сверх исходного текста и сохраняя параллель с אישׁ.
translation_notes:
  register: Современный литературный русский с достоинством афористической речи. Синтаксический параллелизм двух строк сохранён; «ленивец» употреблено как традиционный, но понятный термин мудростной литературы.
