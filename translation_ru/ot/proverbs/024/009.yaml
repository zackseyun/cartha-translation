base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/009.yaml
  text: The scheme of folly is sin[b][a], and a scoffer is an abomination to mankind.
translation:
  language: ru
  text: Замысел глупости — грех, а насмешник[a] — мерзость для людей.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глумящийся».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для человека»; еврейское слово здесь обозначает людей вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמַּת
  choice: задумывать
  rationale: Существительное обозначает замысел или обдуманное намерение. В сочетании с אִוֶּלֶת оно естественно передаётся по-русски инфинитивной конструкцией «задумывать глупость», которая сохраняет смысл намеренного замышления.
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Абстрактное существительное означает глупость или безумие в нравственно отрицательном смысле, характерном для книги Притч.
- source_word: חַטָּאת
  choice: грех
  rationale: Слово выступает как именная часть сказуемого и прямо называет такой замысел грехом; перевод не смягчает утверждение до «проступка» или «греховного дела».
- source_word: לֵץ
  choice: насмешник
  rationale: В Притчах это человек, который надменно насмехается и отвергает наставление. «Насмешник» понятно современному читателю и сохраняет как речевое действие, так и устойчивую нравственную позицию.
- source_word: תוֹעֲבַת
  choice: отвратителен
  rationale: Предикативное прилагательное естественно передаёт по-русски сильное отвращение, выраженное существительным תוֹעֵבָה, без тяжеловесного оборота «является мерзостью».
- source_word: לְאָדָם
  choice: людям
  rationale: אָדָם употреблено родовым образом — о людях вообще. Русское множественное число ясно и естественно передаёт этот общий смысл.
theological_decisions:
- issue: Родовое значение אָדָם
  choice: людям
  alternative: человеку; человечеству
  rationale: Здесь речь не об одном мужчине, а о людях вообще. «Людям» естественно выражает родовое значение и не сужает область высказывания.
- issue: Характер первой строки
  choice: Задумывать глупость — грех
  alternative: Замысел глупости — грех; глупый замысел — грех
  rationale: Инфинитивная конструкция сохраняет значение обдуманного намерения и одновременно избегает неестественного русского сочетания «замысел глупости». Она не уточняет, идёт ли речь о конкретном плане или о самом процессе замышления, сверх того, что допускает еврейское выражение.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим ритмом. Союз «а» естественно связывает две параллельные оценки. Формулировки понятны без специальной богословской лексики, при этом сохранены нравственная сила слов «грех» и «отвратителен».
