lexical_decisions:
- source_word: וּבָא
  choice: и придёт
  rationale: Форма совершенного вида с союзом выражает последствие, описанное как неизбежно наступающее; в русском уместно будущее время.
- source_word: מִתְהַלֵּךְ
  choice: крадучись
  rationale: Причастие породы hitpael от הלך обозначает движение туда-сюда; в контексте приближающейся бедности передаёт постепенное и угрожающее приближение.
- source_word: רֵישֶׁךָ
  choice: твоя бедность
  rationale: Существительное означает бедность, нищету; «бедность» — ясный и естественный современный эквивалент.
- source_word: וּמַחְסֹרֶיךָ
  choice: а нужда твоя
  rationale: מחסור обозначает недостаток, нужду. Русское собирательное единственное число естественно передаёт форму, имеющую здесь обобщённый смысл.
- source_word: כְּאִישׁ מָגֵן
  choice: как вооружённый человек
  rationale: Сочетание буквально означает «как человек со щитом» и рисует того, кто снаряжён для столкновения; основной текст передаёт смысл образа, а буквальная форма сохранена в примечании.
