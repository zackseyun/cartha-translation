  text: יְרָֽא אֶת יְהוָ֣ה בְּנִ֣/י וָ/מֶ֑לֶךְ עִם שׁ֝וֹנִ֗ים אַל תִּתְעָרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/021.yaml
  text: Fear Yahweh[a], my son, and the king; do not associate with those who are given to change.
translation:
  language: ru
  text: Бойся Яхве, сын мой, и царя; не общайся с теми, кто склонен к переменам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не водись с мятежниками». Еврейское слово буквально обозначает «тех, кто изменяет»; в данном контексте, вероятно, имеются в виду люди, склонные к переворотам или неверности.'
    reason: Лексическая неоднозначность שׁוֹנִים и контекстуальный смысл выражения אַל תִּתְעָרָב עִם.
lexical_decisions:
- source_word: יְרָא
  choice: бойся
  rationale: Повелительная форма глагола ירא в литературе мудрости обозначает благоговейный страх, проявляющийся в верности и послушании. «Бойся» сохраняет силу и богословскую многозначность исходного слова лучше, чем более мягкое «почитай».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: בְּנִי
  choice: сын мой
  rationale: Еврейское выражение имеет явно мужской род и единственное число; такое отеческое обращение является характерной литературной чертой книги Притч.
- source_word: וָמֶלֶךְ
  choice: и царя
  rationale: Союз присоединяет «царя» как второй объект того же повеления «бойся». В русском языке винительный падеж естественно передаёт эту синтаксическую связь.
- source_word: שׁוֹנִים
  choice: те, кто стремится к переменам
  rationale: Причастие от корня со значением «менять, изменяться» указывает на людей, склонных к переменам, переворотам или измене установленному порядку. Формулировка основного текста сохраняет лексическую идею изменения, не сужая её безусловно до открытого мятежа.
- source_word: עִם ... אַל תִּתְעָרָב
  choice: с ... не связывайся
  rationale: Возвратная порода глагола ערב в сочетании с עִם означает смешиваться с кем-либо, входить в их круг или иметь с ними дело. «Не связывайся» — естественное современное русское предостережение, сохраняющее смысл вовлечения.
theological_decisions:
- issue: Отношение между страхом перед Яхве и страхом перед царём
  choice: Оба дополнения сохранены при одном сказуемом «бойся», без указания на равенство их статуса.
  alternative: Передать вторую часть как «почитай царя» или заменить оба значения словом «почитай».
  rationale: Еврейский синтаксис ставит Яхве и царя в зависимость от одного повеления. Перевод сохраняет это напряжение и не вводит в сам стих отсутствующее там пояснение о соотношении божественной и царской власти.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой, соответствующей жанру Притч. Обращение «сын мой» и глагол «бойся» сохраняют достоинство и традиционную библейскую выразительность, а «не связывайся» делает предостережение понятным современному читателю.
