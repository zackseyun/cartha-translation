  terminology: «Яхве» последовательно передаёт тетраграмматон. «Сын мой» сохраняет мужское единственное число и жанровое отеческое обращение. «Бойся» оправданно сохраняет общий глагол для Яхве и царя, не истолковывая заранее характер этого страха. Сноска должна представлять «мятежников» как контекстуальную интерпретацию, а не как однозначный смысл.
