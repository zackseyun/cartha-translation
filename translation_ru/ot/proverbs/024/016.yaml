base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/016.yaml
  text: For the righteous falls seven times and rises again[c][b][a], but the wicked stumble in calamity.
translation:
  language: ru
  text: Ведь праведник семь раз упадёт и встанет[a], а нечестивые споткнутся в беде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Семь раз» здесь, вероятно, означает многократность или полноту: праведник может падать снова и снова, но встаёт.'
    reason: cultural_note
  - marker: b
    text: 'Или: «потерпят крушение из-за бедствия». Еврейское слово здесь может означать беду, несчастье или бедствие, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для предшествующего наставления; «ведь» естественно передаёт эту пояснительно-причинную связь.
- source_word: שֶׁבַע
  choice: семь раз
  rationale: Сохраняет еврейский образ числа семь, которое в пословичном контексте указывает на многократность или полноту.
- source_word: יִפּוֹל צַדִּיק
  choice: праведник упадёт
  rationale: Мужской род единственного числа передан прямо и естественно; форма обозначает типичного представителя, а не конкретного человека.
- source_word: וָקָם
  choice: и встанет
  rationale: Глагол означает «встать, подняться»; русский вид и контекст естественно выражают восстановление после падения без добавления отсутствующего в тексте наречия «снова».
- source_word: וּרְשָׁעִים
  choice: а нечестивые
  rationale: Союз в данном контрасте естественно передаётся противительным «а»; множественное число сохранено.
- source_word: יִכָּשְׁלוּ
  choice: споткнутся
  rationale: Сохраняет образ утраты устойчивости и смысловой контраст с праведником, который после падения встаёт.
- source_word: בְרָעָה
  choice: в беде
  rationale: В контексте רָעָה обозначает бедствие или несчастье, а не обязательно нравственное зло; «в беде» звучит естественно и сохраняет неоднозначность обстоятельства.
theological_decisions:
- issue: Характер падения праведника
  choice: Не уточнять, является ли падение нравственным проступком, поражением или несчастьем.
  alternative: Передать как многократный грех с последующим покаянием.
  rationale: Еврейский глагол сам по себе не ограничивает падение нравственной сферой, а параллель с бедствием у нечестивых скорее указывает на жизненную невзгоду; конкретизация внесла бы в текст частное богословское толкование.
- issue: Представительное мужское единственное число צַדִּיק
  choice: праведник
  alternative: праведный человек / праведные
  rationale: «Праведник» точно сохраняет число и грамматический род источника и при этом естественно воспринимается в русской пословице как обобщённый образ.
- issue: Смысл числа семь
  choice: Сохранить буквальный образ «семь раз» и пояснить его вероятную идиоматичность в примечании.
  alternative: много раз / сколько бы раз ни упал
  rationale: Так сохраняются и образ оригинала, и его вероятное значение многократности или полноты без чрезмерного истолкования в основном тексте.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Праведник» и «нечестивые» сохраняют традиционную библейскую лексику, оставаясь понятными современному читателю. Порядок примечаний соответствует месту маркеров в русском тексте.
