  text: כִּ֤י לֹֽא תִהְיֶ֣ה אַחֲרִ֣ית לָ/רָ֑ע נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/020.yaml
  text: For there will be no future for the evil[b][a]; the lamp of the wicked will be put out.
translation:
  language: ru
  text: Ибо у злого не будет будущего[a]; светильник нечестивых угаснет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет доброго исхода»; еврейское слово может обозначать будущее, конечный исход или дальнейшую участь.'
    reason: lexical_alternative
  - marker: b
    text: 'Также можно перевести: «светильник нечестивых погаснет». Образ может указывать на прекращение жизни, благополучия или устойчивого положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предшествующего наставления; «ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному, но понятному регистру книги Притчей.
- source_word: לֹא תִהְיֶה
  choice: не будет
  rationale: Передаёт отрицательную форму будущего времени; конструкция «у злого не будет» естественна для современного русского языка.
- source_word: אַחֲרִית
  choice: будущего
  rationale: В литературе мудрости слово может обозначать будущее, конечный исход или дальнейшую участь. «Будущего» хорошо соотносится с образом угасающего светильника, не сужая смысл до потомства.
- source_word: לָרָע
  choice: у злого
  rationale: Определённое прилагательное употреблено субстантивно и в единственном числе, обозначая злого человека. Русское «у злого» сохраняет эту форму, не добавляя слова «мужчина» и не превращая выражение в отвлечённое «зло».
- source_word: נֵר
  choice: светильник
  rationale: Сохраняется конкретный библейский образ светильника, связанный с жизнью, благополучием и продолжением рода или положения.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Передаёт множественное число и нравственно-религиозную характеристику людей без ненужного уточнения.
- source_word: יִדְעָךְ
  choice: угаснет
  rationale: Глагол обозначает угасание или прекращение горения светильника. «Угаснет» естественно сохраняет метафору и не уточняет внешнего деятеля.
theological_decisions:
- issue: Переход от единственного רָע к множественному רְשָׁעִים
  choice: 'Сохранить различие: «у злого» и «нечестивых».'
  alternative: Сгладить обе части до общего множественного «у нечестивых».
  rationale: Числовой переход присутствует в еврейском тексте и является частью его поэтической фактуры. «Злой» здесь обозначает человека и не истолковывается как особый сверхъестественный «лукавый».
- issue: Значение אַחֲרִית
  choice: «будущего»
  alternative: «конца», «исхода» или «потомства»
  rationale: Контекст говорит об отсутствии долговечной перспективы у злого. «Будущее» сохраняет широту значения, тогда как «потомство» неоправданно ограничило бы его потомками, а «конец» мог бы означать лишь прекращение существования.
- issue: Образ угасающего светильника
  choice: Сохранить метафору без пояснения в основном тексте.
  alternative: 'Передать её толкованием: «жизнь/благополучие нечестивых прекратится».'
  rationale: 'Еврейский текст оставляет образ многозначным: он может указывать на жизнь, благополучие, продолжение или устойчивое положение. Перевод не должен выбирать только одно из этих толкований.'
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем Притчей. «Ибо» поддерживает достоинство и причинную связь; «светильник» сохраняет конкретный древнебиблейский образ. Маркеры сносок размещены непосредственно после соответствующих выражений.
