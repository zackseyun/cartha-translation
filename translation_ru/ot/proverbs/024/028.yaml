  yaml_path: translation/ot/proverbs/024/028.yaml
  text: Do not be a witness against your neighbor without cause[b][a], and do not deceive with your lips.
translation:
  language: ru
  text: Не будь свидетелем против ближнего без причины[a] — и разве будешь ты обманывать своими устами?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Без причины» можно также перевести как «напрасно» или «ни за что».
    reason: lexical_alternative
  - marker: b
    text: 'Во второй части еврейского текста стоит вопросительная частица. Риторический вопрос может быть передан как запрет: «и не обманывай своими устами».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אַל תְּהִי
  choice: Не будь
  rationale: Отрицательная частица אַל с формой היה выражает прямой запрет; «не будь» точно и естественно передаёт его по-русски.
- source_word: עֵד
  choice: свидетелем
  rationale: Существительное обозначает свидетеля, прежде всего в судебном или близком к судебному контексте.
- source_word: חִנָּם
  choice: без причины
  rationale: Наречие указывает на необоснованность или безосновательность свидетельства; вариант сохраняет этико-правовой оттенок.
- source_word: בְּרֵעֶךָ
  choice: против своего ближнего
  rationale: При слове «свидетель» предлог ב естественно передаётся как «против»; רֵעַ означает человека из близкого общественного круга — ближнего.
- source_word: וַהֲפִתִּיתָ
  choice: и неужели ты станешь обманывать
  rationale: Масоретская огласовка указывает на вопросительную частицу הֲ после союза; риторический вопрос сохранён, а פתה в данном речевом контексте передано как «обманывать».
- source_word: בִּשְׂפָתֶיךָ
  choice: своими устами
  rationale: Сохранён конкретный древнееврейский образ речи через «уста»; в современном литературном русском он понятен и достоин по регистру.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским образом «устами». Риторический вопрос исходного текста сохранён; тире помогает ясно связать его с первым запретом.
