  text: וּ֭/בְ/דַעַת חֲדָרִ֣ים יִמָּלְא֑וּ כָּל ה֖וֹן יָקָ֣ר וְ/נָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/004.yaml
  text: and by knowledge rooms are filled with all precious and pleasant wealth[a][b][c].
translation:
  language: ru
  text: и знанием комнаты[a] наполняются[b] всяким драгоценным и приятным имуществом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покои».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наполнятся»; еврейская форма допускает будущее время, хотя здесь она понята как выражение общей истины.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «всем имуществом, драгоценным и приятным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַעַת
  choice: и знанием
  rationale: 'Переданы и союз וּ, и инструментальное значение предлога בְּ: знание представлено как средство, благодаря которому обустраивается дом.'
- source_word: חֲדָרִים
  choice: комнаты
  rationale: Современное и естественное обозначение отдельных помещений дома; возможное более литературное «покои» вынесено в примечание.
- source_word: יִמָּלְאוּ
  choice: наполняются
  rationale: Нифаль имперфекта передан настоящим временем как общеистинное утверждение, характерное для притчи; возможное будущее значение сохранено в примечании.
- source_word: כָּל
  choice: всяким
  rationale: При собирательном существительном форма «всяким» естественно выражает полноту и разнообразие содержимого.
- source_word: הוֹן
  choice: имуществом
  rationale: Слово обозначает достаток, состояние или материальные ценности. «Имущество» хорошо сочетается с образом комнат, которые им наполняются, не сужая смысл до денег.
- source_word: יָקָר
  choice: драгоценным
  rationale: Сохраняет значение высокой ценности и возвышенный тон изречения.
- source_word: וְנָעִים
  choice: и приятным
  rationale: Передаёт значение приятности и желательности, не сводя его только к материальной стоимости.
