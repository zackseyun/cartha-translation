  yaml_path: translation/ot/proverbs/024/025.yaml
  text: But for those who rebuke[a], it will be pleasant[b], and a good blessing will come upon them.
translation:
  language: ru
  text: А тем, кто обличает[a], будет благо, и на них придёт благословение во благо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «порицает»; «исправляет». Еврейское причастие обозначает людей, которые обличают или исправляют.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «благословение добра», то есть благословение, несущее благо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַמּוֹכִיחִים
  choice: А тем, кто обличает
  rationale: Причастие от יכח обозначает тех, кто указывает на неправду, порицает или исправляет. «Обличает» кратко передаёт нравственно-судебный оттенок; союз וְ в контексте противопоставления предыдущему стиху передан как «А».
- source_word: יִנְעָם
  choice: будет благо
  rationale: Глагол от נעם выражает приятность, благоприятность или отрадность. Безличное «будет благо» сохраняет неопределённость субъекта и лаконичность еврейского текста, не уточняя сверх источника, в чём именно состоит благоприятный исход.
- source_word: וַעֲלֵיהֶם
  choice: и на них
  rationale: Предложное сочетание указывает на получателей благословения и сохраняет образ того, что благословение приходит на людей.
- source_word: תָּבוֹא
  choice: придёт
  rationale: Прямая и естественная передача формы глагола בוא в данном пророчески-обобщающем высказывании.
- source_word: בִרְכַּת טוֹב
  choice: доброе благословение
  rationale: Сопряжённое сочетание буквально означает «благословение добра». «Доброе благословение» сохраняет компактность и смысл благотворного, благоприятного благословения, не конкретизируя его содержание.
