base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/005.yaml
  text: A wise man is strong[b][a], and a man of knowledge strengthens his might.
translation:
  language: ru
  text: Мудрый человек силён[a], и знающий укрепляет силу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Мудрый сильный человек» или «Мудрый человек — в силе». Еврейское выражение кратко и допускает как определительное, так и предикативное понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «умножает силу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: муж
  rationale: Сохраняет мужской род и краткий, афористичный строй еврейской пословицы; в современном литературном русском «муж» здесь звучит возвышенно, но понятно.
- source_word: חָכָם
  choice: мудрый
  rationale: В Книге Притчей слово обозначает прежде всего нравственно-практическую мудрость; «мудрый» является прямым и естественным соответствием.
- source_word: בַּעֹז
  choice: силён
  rationale: Компактное сочетание предлога ב с существительным «сила» передано предикативно, чтобы по-русски ясно выразить утверждение о силе мудрого, не устраняя иных возможных разборов.
- source_word: אִישׁ
  choice: человек
  rationale: Передаёт обобщённый характер изречения и не создаёт тяжеловесного повтора «муж… муж»; грамматически мужская форма сохраняется в определении «знающий».
- source_word: דַּעַת
  choice: знающий
  rationale: Сочетание אִישׁ דַּעַת буквально означает «человек знания»; естественный русский эквивалент «человек знающий» сохраняет связь со знанием и афористический параллелизм.
- source_word: מְאַמֶּץ
  choice: укрепляет
  rationale: Причастная форма породы пиэль от אמץ выражает придание крепости или усиление; настоящее время соответствует обобщённому характеру пословицы.
- source_word: כֹּחַ
  choice: силу
  rationale: Прямо передаёт физическую или действенную способность. В еврейском тексте нет выраженного притяжательного местоимения, поэтому оно не добавлено в основной текст.
theological_decisions:
- issue: Связь мудрости и силы
  choice: Передать прямое утверждение «мудрый муж силён»
  alternative: Истолковать стих как утверждение, что мудрость превосходит физическую силу
  rationale: Сам стих утверждает связь мудрости и силы, но не содержит явного сравнительного оборота; богословское или нравоучительное сравнение не следует вносить в перевод.
- issue: Чья сила укрепляется во второй строке
  choice: 'Оставить объект без притяжательного уточнения: «укрепляет силу»'
  alternative: «Укрепляет свою силу» или «умножает силы»
  rationale: Еврейское כֹּחַ не снабжено местоименным суффиксом. Такой перевод сохраняет присущую исходному тексту недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм двух строк сохранён; повтор корня «сил-» отражает смысловую связь עֹז и כֹּחַ, тогда как «укрепляет силу» передаёт словесную плотность оригинала.
