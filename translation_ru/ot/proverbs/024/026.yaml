base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/026.yaml
  text: He kisses the lips who gives upright words[a][b].
translation:
  language: ru
  text: Целует в губы тот, кто отвечает верными словами.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Целует в губы тот, кто отвечает верными словами». Хотя еврейский глагол имеет активную форму, изречение может идиоматически означать, что уместный и честный ответ подобен поцелую в губы.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «правильными», «прямыми», «честными» или «уместными словами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפָתַיִם
  choice: в губы
  rationale: Двойственное число от שָׂפָה обозначает губы. Конкретный образ сохранён; с русским глаголом «целовать» естественно употребляется конструкция «целовать в губы».
- source_word: יִשָּׁק
  choice: словно целует
  rationale: 'Форма Qal imperfect 3 м. ед. ч. от נשׁק грамматически активна: «целует». Частица «словно» передаёт вероятную образную функцию изречения, не превращая активную форму в пассивную.'
- source_word: מֵשִׁיב
  choice: кто отвечает
  rationale: Причастие Hiphil от שוב в сочетании со словами означает того, кто отвечает или даёт ответ. «Кто отвечает» сохраняет ответный характер действия и естественно звучит по-русски.
- source_word: דְּבָרִים
  choice: отвечает
  rationale: Существительное во множественном числе буквально означает «слова», однако в русском выражение «отвечает прямые слова» неестественно. Содержание сочетания מֵשִׁיב דְּבָרִים передано глаголом «отвечает», а буквальная структура отмечена в сноске.
- source_word: נְכֹחִים
  choice: прямо
  rationale: Прилагательное обозначает прямое, правильное, справедливое или честное. Наречие «прямо» здесь естественно передаёт как откровенность, так и правильность ответа, не сужая смысл исключительно до честности.
