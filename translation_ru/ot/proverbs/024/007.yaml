  text: רָאמ֣וֹת לֶֽ/אֱוִ֣יל חָכְמ֑וֹת בַּ֝/שַּׁ֗עַר לֹ֣א יִפְתַּח פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/007.yaml
  text: Wisdom is too high for a fool[b][a]; in the gate he does not open his mouth.
translation:
  language: ru
  text: Мудрость недосягаема для глупца[a]; у городских ворот[b] он не открывает рта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мудрости слишком высоки для глупца». В еврейском тексте слово «мудрость» стоит во множественном числе, вероятно выражая абстрактное или усиленное понятие.'
    reason: lexical_alternative
  - marker: b
    text: Городские ворота служили местом общественных совещаний, судебных решений и управления городом.
    reason: cultural_note
lexical_decisions:
- source_word: רָאמוֹת
  choice: недосягаема
  rationale: Форма от корня רום («быть высоким, возвышенным») здесь предикативно описывает мудрость как находящуюся вне досягаемости глупца. «Недосягаема» естественно передаёт метафору высоты и её контекстуальный смысл.
- source_word: לֶאֱוִיל
  choice: для глупца
  rationale: 'Предлог ל обозначает отношение: мудрость недоступна «для» глупца. «Глупец» соответствует устойчивому значению אֱוִיל в книге Притч.'
- source_word: חָכְמוֹת
  choice: мудрость
  rationale: Хотя еврейское слово имеет форму множественного числа, здесь оно, вероятнее всего, выражает абстрактное или усиленное понятие; русское единственное число звучит естественно и сохраняет смысл.
- source_word: בַּשַּׁעַר
  choice: у городских ворот
  rationale: В древнеизраильском городе ворота были местом суда, совещаний и общественных выступлений. Уточнение «городских» ясно передаёт культурную реалию, не превращая основной текст в пояснение.
- source_word: לֹא יִפְתַּח פִּיהוּ
  choice: он не открывает рта
  rationale: 'Близкая к форме оригинала русская идиома сохраняет намеренную неопределённость: текст не уточняет, молчит ли глупец из-за неспособности, стыда или отсутствия авторитета.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. «Недосягаема» сохраняет образ высоты без неестественного оборота «слишком высока». Выражение «не открывает рта» намеренно оставлено без истолкования причины молчания.
