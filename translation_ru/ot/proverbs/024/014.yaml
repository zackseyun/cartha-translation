  text: כֵּ֤ן דְּעֶ֥/ה חָכְמָ֗ה לְ/נַ֫פְשֶׁ֥/ךָ אִם מָ֭צָאתָ וְ/יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/014.yaml
  text: 'Know that wisdom is thus for your soul: if you find it[a], then there is a future[b], and your hope will not be cut off.'
translation:
  language: ru
  text: 'Знай: мудрость так же хороша для твоей души[a]. Если ты обретёшь её, у тебя будет будущее[b], и твоя надежда не будет отсечена.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «для твоей души»; еврейское נֶפֶשׁ в зависимости от контекста может также означать «самого тебя» или «твою жизнь».
    reason: lexical_alternative
  - marker: b
    text: Или «у тебя будет исход» или «конец»; еврейское אַחֲרִית может обозначать конец, итог или будущую перспективу.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: так; то же
  rationale: 'Сохраняет аналогию с мёдом в предыдущем стихе: как мёд благотворен, так и мудрость благотворна для человека.'
- source_word: דְּעֶה
  choice: знай
  rationale: Прямо передаёт повелительную форму единственного числа и естественно звучит по-русски.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычный и контекстуально точный перевод ключевого для Притчей понятия.
- source_word: לְנַפְשֶׁךָ
  choice: для твоей души
  rationale: Сохраняет образность и личностную глубину נֶפֶשׁ, не сводя выражение к более плоскому «для тебя».
- source_word: אִם מָצָאתָ
  choice: если ты обретёшь её
  rationale: Сохраняет условность אִם; «обрести мудрость» естественнее по-русски, чем буквально «найти мудрость», и подходит к результативному оттенку перфекта.
- source_word: וְיֵשׁ אַחֲרִית
  choice: у тебя будет будущее
  rationale: Передаёт אַחֲרִית как будущую перспективу или благой исход и образует естественную параллель с последующим упоминанием надежды.
- source_word: וְתִקְוָתְךָ
  choice: и надежда твоя
  rationale: «Надежда» — обычное значение תִּקְוָה; порядок слов придаёт фразе достоинство без архаизации.
- source_word: לֹא תִכָּרֵת
  choice: не будет отсечена
  rationale: Сохраняет сильную еврейскую метафору глагола כרת в нифале, оставаясь понятным в контексте надежды.
