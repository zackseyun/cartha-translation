source:
  edition: WLC
  text: הִ֭תְרַפִּיתָ בְּ/י֥וֹם צָרָ֗ה צַ֣ר כֹּחֶֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/010.yaml
  text: If you falter in a day of distress[a], your strength is small.
translation:
  language: ru
  text: Если ты ослабел[a] в день беды, мала твоя сила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если ты проявил слабость в день беды, невелика твоя сила».'
    reason: Лексема רפה может описывать как ослабление или потерю решимости, так и проявленную слабость либо бездействие.
lexical_decisions:
- source_word: הִתְרַפִּיתָ
  choice: ты ослабел
  rationale: Форма породы хитпаэль от רפה передаёт утрату твёрдости, решимости или способности действовать. «Ослабел» кратко и естественно сохраняет оценочный смысл, не уточняя без необходимости, идёт ли речь прежде всего об унынии, бездействии или недостатке стойкости.
- source_word: בְּיוֹם
  choice: в день
  rationale: Предлог ב с существительным «день» имеет временное значение. Русское «в день» сохраняет лаконичную форму притчи.
- source_word: צָרָה
  choice: беды
  rationale: Слово обозначает беду, тесные обстоятельства, несчастье или тяжёлое положение. «Беда» понятно современному читателю и соответствует сжатому стилю стиха.
- source_word: צַר
  choice: мала
  rationale: Прилагательное буквально означает «узкий, тесный», а здесь указывает на недостаточность или ограниченность силы. «Мала» естественно сочетается со словом «сила» и сохраняет резкость заключительной оценки.
- source_word: כֹּחֶךָ
  choice: твоя сила
  rationale: כֹּחַ означает силу, мощь или способность. «Твоя сила» — прямой и естественный эквивалент, не сводящий смысл только к физической выносливости.
theological_decisions: []
translation_notes:
  register: Краткая, афористичная фраза в современном литературном русском языке. Инверсия «мала твоя сила» сохраняет торжественную выразительность мудростного изречения, не делая язык архаичным.
