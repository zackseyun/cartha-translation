lexical_decisions:
- source_word: בְּחָכְמָה
  choice: Мудростью
  rationale: Предлог בְּ обозначает средство; творительный падеж естественно передаёт эту функцию и сохраняет краткость изречения.
- source_word: יִבָּנֶה
  choice: строится
  rationale: Нифаль имперфекта в общеистинном изречении передан возвратной формой настоящего времени, выражающей общую закономерность.
- source_word: בָּיִת
  choice: дом
  rationale: Слово может обозначать как здание, так и семью или домочадцев; «дом» сохраняет буквальный образ и допускает переносный смысл.
- source_word: וּבִתְבוּנָה
  choice: и разумением
  rationale: «Разумение» естественно сочетается с «мудростью» в поэтическом параллелизме и передаёт способность понимать и рассуждать.
- source_word: יִתְכּוֹנָן
  choice: он утверждается
  rationale: Форма от כון выражает становление прочным, устойчивым или надёжно устроенным; «утверждается» сохраняет результативный смысл и параллелизм со «строится».
