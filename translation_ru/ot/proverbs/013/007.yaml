  text: יֵ֣שׁ מִ֭תְעַשֵּׁר וְ/אֵ֣ין כֹּ֑ל מִ֝תְרוֹשֵׁ֗שׁ וְ/ה֣וֹן רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/007.yaml
  text: There is one who pretends to be rich[a], yet has nothing; another pretends to be poor, yet has great wealth.
translation:
  language: ru
  text: Иной выдаёт себя за богача, но ничего не имеет; другой выдаёт себя за бедняка, но обладает большим состоянием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ
  choice: Иной
  rationale: Экзистенциальная частица вводит обобщённое наблюдение; «иной» естественно передаёт русскую форму афористического противопоставления.
- source_word: מִתְעַשֵּׁר
  choice: изображает из себя богача
  rationale: Форма хитпаэль может обозначать как самопредставление в качестве богатого, так и обогащение себя. Контраст с полным отсутствием имущества поддерживает в основном тексте значение показной видимости.
- source_word: וְאֵין כֹּל
  choice: а у него ничего нет
  rationale: Сочетание אֵין с כֹּל выражает полное отсутствие; союз «а» ясно передаёт контраст.
- source_word: מִתְרוֹשֵׁשׁ
  choice: изображает из себя бедняка
  rationale: Возвратная форма допускает значения самопредставления бедным и доведения себя до бедности. Параллелизм с מִתְעַשֵּׁר и контраст с большим состоянием поддерживают значение внешнего представления.
- source_word: וְהוֹן רָב
  choice: а у него большое состояние
  rationale: הוֹן означает богатство или имущество, а רָב — большое, обильное. «Большое состояние» звучит естественно и сохраняет материальный смысл выражения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная афористическая конструкция. Повтор «изображает из себя» намеренно сохраняет параллелизм оригинала, а сноска отмечает реальную лексическую неоднозначность возвратных форм.
