source:
  edition: WLC
  text: אוֹר צַדִּיקִ֥ים יִשְׂמָ֑ח וְ/נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/009.yaml
  text: The light of the righteous rejoices[a], but the lamp of the wicked goes out.
translation:
  language: ru
  text: Свет праведных радуется[a], а светильник нечестивых угасает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «веселится». Некоторые понимают это выражение по смыслу как «ярко сияет», поскольку подлежащее здесь — «свет»; однако еврейский глагол обычно означает «радоваться» или «веселиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: свет
  rationale: Обычное значение — «свет» или «сияние». «Свет» естественно звучит по-русски и сохраняет поэтическое противопоставление светильнику во второй строке.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: 'Субстантивированное прилагательное во множественном числе. Родительный падеж передаёт принадлежность: «свет праведных».'
- source_word: יִשְׂמָח
  choice: радуется
  rationale: Глагол שׂמח обычно означает «радоваться, веселиться». Такой перевод сохраняет олицетворение света и не подменяет лексическое значение контекстуальным толкованием «ярко сияет».
- source_word: נֵר
  choice: светильник
  rationale: נֵר обозначает обычно масляный светильник, а не свечу. «Светильник» точно передаёт предметный образ и поддерживает различие между «светом» и его преходящим источником.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе. «Нечестивые» — уместное для литературы мудрости нравственное обозначение и естественная пара к «праведным».
- source_word: יִדְעָךְ
  choice: угасает
  rationale: Глагол означает «гаснуть, быть погашенным», особенно о светильнике. «Угасает» естественно передаёт образ, не уточняя действующее лицо.
- source_word: וְ
  choice: а
  rationale: Хотя союз формально соответствует «и», здесь он соединяет противопоставленные части параллелизма; русское «а» естественно выражает это противопоставление.
