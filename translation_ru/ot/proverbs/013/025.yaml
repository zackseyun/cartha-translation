base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/025.yaml
  text: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
translation:
  language: ru
  text: Праведник ест досыта[a], а чрево нечестивых терпит нужду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до насыщения своей души». Еврейское слово נֶפֶשׁ (не́феш) в зависимости от контекста может означать «душа», «жизнь», «сам человек» или «аппетит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе обозначает представительного праведного человека; «праведник» естественно и традиционно для русской литературы мудрости.
- source_word: אֹכֵל
  choice: ест
  rationale: Причастие выражает постоянную, общеистинную закономерность; настоящее время передаёт афористический характер изречения.
- source_word: לְשֹׂבַע נַפְשׁוֹ
  choice: досыта[a]
  rationale: Выражение означает достижение достаточного насыщения. «Досыта» естественно передаёт смысл в контексте еды, а многозначность נֶפֶשׁ и более буквальная формулировка сохранены в сноске.
- source_word: וּבֶטֶן
  choice: а чрево
  rationale: «Чрево» сохраняет телесный образ исходного текста и подходит возвышенно-афористическому регистру; союз по контексту передан как противительный.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Множественное число обозначает нечестивых людей как класс; родительный падеж обусловлен конструкцией «чрево нечестивых».
- source_word: תֶּחְסָר
  choice: терпит нужду
  rationale: Глагол означает испытывать недостаток, нуждаться. Выражение сохраняет одушевлённый образ чрева и подчёркивает противопоставление достатку праведника.
theological_decisions:
- issue: Связь праведности с насыщением и нечестия с нуждой
  choice: Сохранить изречение как общую мудрую закономерность без добавочных оговорок.
  alternative: Ослабить утверждение словами «обычно» или истолковать его исключительно духовно.
  rationale: Еврейский текст формулирует краткую общеистинную максиму и не уточняет механизм или исключения; перевод не должен ни абсолютизировать её дополнительными пояснениями, ни сужать до одной богословской трактовки.
translation_notes:
  register: Современный литературный русский с кратким афористическим ритмом. Слово «чрево» несколько возвышенно, но сохраняет яркий телесный образ и уместно в библейской книге мудрости; остальная лексика общепонятна.
