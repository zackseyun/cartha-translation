  text: A righteous man hates a lying word[b][a], but a wicked man acts shamefully and disgracefully.
translation:
  language: ru
  text: Праведник ненавидит лживое слово, а нечестивец вызывает отвращение и навлекает позор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а нечестивец становится отвратительным и оказывается посрамлён». Значение двух последних еврейских глаголов допускает как описание постыдного поведения нечестивца, так и постигшего его позора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  choice: лживое слово
  rationale: Конкретное сочетание «слово лжи» передано естественно по-русски, с сохранением единственного числа и предметности выражения.
- source_word: יִשְׂנָא
  choice: ненавидит
  rationale: Прямой и общеупотребительный эквивалент, выражающий нравственное отвращение.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное существительное мужского рода естественно передаёт единичный типический образ в русской пословице.
- source_word: רָשָׁע
  choice: нечестивец
  rationale: Сохраняет антитезу с «праведником» и обозначает типического нравственно порочного человека.
- source_word: יַבְאִישׁ
  choice: поступает мерзко
  rationale: Передаёт переносный смысл глагола, связанного со зловонием и омерзительностью, без неестественного буквального «смердит».
- source_word: וְיַחְפִּיר
  choice: и навлекает позор
  rationale: Активное прочтение каузативной формы естественно сочетается с первой частью сказуемого; возможное значение наступившего для самого нечестивца стыда отмечено в сноске.
theological_decisions:
- issue: Направленность двух последних глаголов
  choice: Нечестивец действует мерзко и навлекает позор
  alternative: Нечестивец становится отвратительным и оказывается посрамлён
  rationale: Еврейские формы допускают оттенки как постыдного поведения и причинения позора, так и состояния омерзительности и посрамления. Основной текст выбран как естественное русское описание поведения, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная пословичная форма. Выражение «лживое слово» сохраняет конкретность еврейского текста, а сноска отражает подлинную неоднозначность заключительных глаголов.
