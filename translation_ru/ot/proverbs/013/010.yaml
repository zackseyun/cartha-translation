  text: רַק בְּ֭/זָדוֹן יִתֵּ֣ן מַצָּ֑ה וְ/אֶת נ֖וֹעָצִ֣ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/010.yaml
  text: Only by arrogance comes strife[a], but wisdom is with those who take counsel.
translation:
  language: ru
  text: Только от высокомерия возникает раздор[a], а у тех, кто советуется, — мудрость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Только из самонадеянности рождается распря, а у принимающих совет — мудрость».'
    reason: Лексические варианты для זָדוֹן, מַצָּה и допустимое пассивное понимание נוֹעָצִים.
lexical_decisions:
- source_word: רַק
  choice: Только
  rationale: Сохраняет ограничительное и подчёркнутое значение еврейского наречия.
- source_word: בְּזָדוֹן
  choice: от высокомерия
  rationale: זָדוֹן обозначает надменную самоуверенность, дерзость или самонадеянность; предлог ב передан естественной русской конструкцией причины.
- source_word: יִתֵּן
  choice: возникает
  rationale: Буквально глагол означает «даёт», но здесь описывает появление раздора; «возникает» естественно передаёт смысл без неуместной буквальности.
- source_word: מַצָּה
  choice: раздор
  rationale: Слово обозначает ссору, распрю или столкновение; «раздор» краток, ёмок и соответствует афористическому стилю Притч.
- source_word: וְאֶת
  choice: а у
  rationale: Передаёт контраст между двумя частями изречения и еврейскую конструкцию «с ... мудрость» естественным русским оборотом.
- source_word: נוֹעָצִים
  choice: тех, кто советуется
  rationale: Причастие породы нифаль допускает значение людей, которые советуются или принимают совет. Основной текст сохраняет естественный рефлексивно-взаимный оттенок, а пассивное прочтение отмечено в сноске.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Это основное понятие литературы мудрости и стандартный эквивалент חָכְמָה в книге Притч.
