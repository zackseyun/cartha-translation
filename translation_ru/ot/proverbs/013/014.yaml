  source_fidelity: «Наставление мудрого» точно передаёт תּוֹרַת חָכָם в его наставническом, а не узко-правовом смысле. «Источник жизни» соответствует מְקוֹר חַיִּים и сохраняет образ животворного источника. Оборот «помогающий уклоняться от ловушек смерти» естественно выражает функционально-целевую связь инфинитива לָסוּר с предшествующей строкой, не превращая наставление в механически действующую силу. «Ловушки смерти» точно передаёт מִמֹּקְשֵׁי מָוֶת.
