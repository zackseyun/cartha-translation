source:
  edition: WLC
  text: תּוֹרַ֣ת חָ֭כָם מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/014.yaml
  text: The instruction of a wise man is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: ru
  text: Наставление мудрого[a] — источник жизни, помогающий уклоняться от ловушек смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте буквально «мудрого»; в Притчах мужское единственное число нередко обозначает типичный образ человека.
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹרַת
  choice: наставление
  rationale: В литературе мудрости תּוֹרָה обозначает не свод законов, а обучение и руководство; «наставление» естественно передаёт педагогический смысл.
- source_word: חָכָם
  choice: мудрого
  rationale: Сохранены мужской род и единственное число еврейского текста; здесь это типичный образ мудрого человека.
- source_word: מְקוֹר חַיִּים
  choice: источник жизни
  rationale: מְקוֹר — источник или родник; устойчивое и поэтичное русское выражение «источник жизни» сохраняет образ животворной воды.
- source_word: לָסוּר
  choice: помогающий уклоняться
  rationale: Инфинитив выражает назначение или результат наставления. Формулировка показывает его действие, не утверждая причинительной силы, которой глагольная форма прямо не обозначает.
- source_word: מִמֹּקְשֵׁי מָוֶת
  choice: от ловушек смерти
  rationale: מוֹקֵשׁ означает ловушку или силок; «ловушки смерти» сохраняет метафору и родительную конструкцию.
theological_decisions:
- issue: К кому относится мужское единственное число חָכָם
  choice: мудрого с пояснением о типовом употреблении
  alternative: мудрого человека / мудрых
  rationale: Форма оригинала сохранена без ограничения смысла только мужчинами и без перехода к множественному числу.
- issue: Связь לָסוּר с первой строкой
  choice: помогающий уклоняться
  alternative: чтобы уклоняться / отводящий
  rationale: Так передаётся цель или результат наставления и сохраняется возможность человеческого отклика; вариант «отводящий» мог бы неоправданно сделать наставление непосредственным действующим субъектом.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого параллелизма и поэтического образа. «Наставление» звучит доступно и достойно; «ловушки смерти» ясно сохраняет метафору оригинала.
