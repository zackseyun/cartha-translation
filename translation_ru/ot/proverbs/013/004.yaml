  source_fidelity: 'Первая часть передаёт общий смысл, однако «ничего не получает» добавляет действие получения, которого в еврейском тексте нет: там сказано «но нет ничего». Во второй части метонимическое «усердные» допустимо, но опускает повторённое נֶפֶשׁ («желание, аппетит»), важное для параллелизма. Исправленный вариант сохраняет это слово и образное значение пуаля.'
  naturalness: «Ленивый жаждет, но ничего не имеет» — естественная краткая пословичная формула. «Желание усердных будет удовлетворено сполна» литературно и ясно; она не создаёт неуместного в современном русском богословского оттенка слова «душа».
  terminology: «Ленивый» и «усердные» точно передают характерологические обозначения עָצֵל и חָרוּצִים. «Желание» последовательно передаёт נֶפֶשׁ в данном контексте как желание/аппетит, а не как технический термин «душа». Сноска корректно раскрывает образ תְּדֻשָּׁן.
  issues:
