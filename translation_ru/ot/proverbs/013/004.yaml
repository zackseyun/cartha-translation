  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
translation:
  language: ru
  text: Ленивый жаждет, но ничего не имеет; желание усердных будет удовлетворено сполна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будет сделано тучным» — еврейский образ изобилия и полного удовлетворения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְאַוָּה
  choice: жаждет
  rationale: Форма породы хитпаэль выражает сильное, продолжающееся желание. «Жаждет» естественно передаёт его напряжённость и сохраняет афористичность.
- source_word: וָאַיִן
  choice: но ничего не получает
  rationale: 'Буквально: «и нет [ничего]». В русском контексте добавление «не получает» ясно передаёт безрезультатность желания, не уточняя, чего именно не хватает.'
- source_word: נַפְשׁוֹ
  choice: ленивый
  rationale: נֶפֶשׁ здесь обозначает самого человека в аспекте его желания или аппетита, а не «душу» как богословский термин. Русская личная конструкция звучит естественнее буквального «душа ленивого».
- source_word: עָצֵל
  choice: ленивый
  rationale: Обозначает человека, для которого лень стала устойчивой чертой; это ясный и обычный русский эквивалент в контексте Притч.
- source_word: וְנֶפֶשׁ חָרֻצִים
  choice: а усердные
  rationale: 'Буквально: «а душа/аппетит усердных». Метонимия передана обозначением самих людей; множественное число исходного текста сохранено.'
- source_word: תְּדֻשָּׁן
  choice: насыщаются вдоволь
  rationale: Пуаль глагола דשׁן буквально рисует образ того, кого «делают тучным»; в данном контексте это образ обилия и полного удовлетворения.
