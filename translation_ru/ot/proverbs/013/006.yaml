  text: צְ֭דָקָה תִּצֹּ֣ר תָּם דָּ֑רֶךְ וְ֝/רִשְׁעָ֗ה תְּסַלֵּ֥ף חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/006.yaml
  text: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
translation:
  language: ru
  text: 'Праведность хранит того, чей путь непорочен,

    а нечестие губит грешника.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а нечестие губит грех». Еврейское слово חַטָּאת может здесь обозначать как грех, так и грешного человека.'
    reason: Альтернативное прочтение неоднозначного еврейского существительного.
lexical_decisions:
- source_word: צְדָקָה
  choice: праведность
  rationale: Здесь слово обозначает нравственную правоту как оберегающую силу; «праведность» естественно для литературы мудрости и точнее по контексту, чем более узкое «справедливость».
- source_word: תִּצֹּר
  choice: хранит
  rationale: Глагол נצר означает «хранить, оберегать, охранять». «Хранит» кратко и естественно передаёт защитный смысл.
- source_word: תָּם דָּרֶךְ
  choice: того, чей путь непорочен
  rationale: Сжатое еврейское сочетание описывает человека цельного и безупречного в своём жизненном пути. Относительная конструкция делает смысл ясным по-русски, не приписывая человеку абсолютной безгрешности.
- source_word: וְרִשְׁעָה
  choice: а нечестие
  rationale: Союз передан как противопоставление двух строк. «Нечестие» обозначает нравственную испорченность и сохраняет параллель с «праведностью».
- source_word: תְּסַלֵּף
  choice: губит
  rationale: Порода пиэль глагола סלף выражает искажение, ниспровержение или доведение до гибели. При личном понимании дополнения «губит» звучит естественно и передаёт разрушительный результат.
- source_word: חַטָּאת
  choice: грешника
  rationale: Хотя обычное значение существительного — «грех», здесь антитетический параллелизм с человеком, чей путь непорочен, поддерживает засвидетельствованное контекстуальное понимание «грешник». Лексическая неоднозначность сохранена в сноске.
theological_decisions:
- issue: Значение חַטָּאת во второй строке
  choice: 'В основном тексте — «грешника»: «нечестие губит грешника».'
  alternative: '«Нечестие губит грех» или формально ближе: «нечестие ниспровергает грех».'
  rationale: Еврейское слово обычно означает «грех», но в данном сжатом изречении может обозначать человека, повинного в грехе. Параллелизм между человеком с непорочным путём и противоположной ему фигурой делает личное значение наиболее связным и естественным в русском основном тексте; предметная неоднозначность прямо отмечена в сноске, а не устранена молча.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Сохранены олицетворение праведности и нечестия и образ жизненного пути. Перенос строки отражает двучленную структуру пословицы.
