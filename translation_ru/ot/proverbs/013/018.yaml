  text: רֵ֣ישׁ וְ֭/קָלוֹן פּוֹרֵ֣עַ מוּסָ֑ר וְ/שׁוֹמֵ֖ר תּוֹכַ֣חַת יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/018.yaml
  text: Poverty and disgrace come to one who ignores discipline[b][a], but whoever heeds reproof will be honored.
translation:
  language: ru
  text: Бедность и позор — тому, кто отвергает наставление, а кто внимает обличению, тот будет в почёте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵישׁ
  choice: бедность
  rationale: Существительное обозначает бедность, нужду или недостаток; «бедность» ясно и естественно передаёт смысл в данном изречении.
- source_word: קָלוֹן
  choice: позор
  rationale: Слово указывает на бесчестье и публичный стыд; «позор» сохраняет социальный оттенок последствия.
- source_word: פּוֹרֵעַ
  choice: кто отвергает
  rationale: Причастие от פרע здесь означает пренебрегать, отбрасывать или не принимать сдерживающее наставление. «Отвергает» передаёт намеренное непринятие и сохраняет лаконизм еврейской строки.
- source_word: מוּסָר
  choice: наставление
  rationale: В Притчах слово охватывает воспитание, исправление и дисциплину. «Наставление» звучит естественно по-русски и в данном сочетании допускает корректирующий смысл, не сводя его лишь к наказанию.
- source_word: שׁוֹמֵר
  choice: кто внимает
  rationale: Буквально «хранит, соблюдает»; в параллелизме речь идёт о внимательном принятии и удержании обличения. «Внимает» естественно выражает эту реакцию.
- source_word: תּוֹכַחַת
  choice: обличению
  rationale: Существительное обозначает словесное исправление, укор или обличение. «Обличение» сохраняет отличие от более широкого מוּסָר и соответствует возвышенному, но понятному регистру.
- source_word: יְכֻבָּד
  choice: будет в почёте
  rationale: Форма Pual от כבד выражает получение чести и уважения. «Будет в почёте» естественно передаёт общественное признание и сохраняет пассивно-результативный смысл.
