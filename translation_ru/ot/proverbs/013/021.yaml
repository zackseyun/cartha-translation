  text: חַ֭טָּאִים תְּרַדֵּ֣ף רָעָ֑ה וְ/אֶת צַ֝דִּיקִ֗ים יְשַׁלֶּם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/021.yaml
  text: Disaster pursues sinners, but good repays the righteous.
translation:
  language: ru
  text: Беда преследует грешников, а добро воздаёт праведникам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: зло
  rationale: Слово может обозначать как зло, так и бедствие. Здесь оно персонифицировано как преследователь; «зло» сохраняет широту значения и параллель с «добром».
- source_word: תְּרַדֵּף
  choice: преследует
  rationale: Передаёт интенсивную форму глагола רדף и образ неотступной погони.
- source_word: יְשַׁלֶּם
  choice: воздаёт
  rationale: Глагол от שלם выражает отплату или возмещение. «Воздаёт» естественно сочетается с дательным «праведникам» и сохраняет смысл соответствующего ответа на их праведность.
- source_word: טוֹב
  choice: добро
  rationale: Форма допускает понимание «добра» как персонифицированного подлежащего; это создаёт точную антитезу со «злом» в первой строке.
theological_decisions:
- issue: Кто воздаёт праведникам
  choice: 'Сохранить «добро» как грамматическое подлежащее: «добро воздаёт»'
  alternative: «Праведникам воздастся добром» или подразумеваемое «Бог воздаёт праведникам добром»
  rationale: Мужской глагол יְשַׁלֶּם согласуется с טוֹב, поэтому наиболее прямое чтение персонифицирует добро. Введение Бога как явного деятеля разрешило бы неоднозначность, не выраженную в тексте.
translation_notes:
  register: Краткая, афористичная формулировка в современном литературном русском. Зеркальная пара «зло — добро» сохраняет поэтический параллелизм и нравственное напряжение оригинала.
