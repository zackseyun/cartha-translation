  text: Every prudent man acts with knowledge[a], but a fool displays folly.
translation:
  language: ru
  text: Всякий благоразумный поступает, опираясь на знание, а глупец выставляет напоказ[a] свою глупость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раскрывает» / «разворачивает». Еврейский глагол означает разворачивать, раскрывать или делать нечто видимым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: всякий
  rationale: 'Передаёт дистрибутивный смысл в обобщающем изречении: так характеризуется каждый представитель данного типа людей.'
- source_word: עָרוּם
  choice: благоразумный
  rationale: В контексте Притч слово обозначает положительную практическую рассудительность и предусмотрительность, а не отрицательную хитрость.
- source_word: יַעֲשֶׂה בְדָעַת
  choice: поступает, опираясь на знание
  rationale: Сохраняет широкий смысл глагола «делать, поступать» и передаёт ב как основание действия; по-русски звучит естественнее буквального «поступает со знанием».
- source_word: וּכְסִיל
  choice: а глупец
  rationale: Союз ו формально означает «и», но здесь вводит явное противопоставление двух частей изречения, естественно передаваемое русским «а».
- source_word: יִפְרֹשׂ
  choice: выставляет напоказ
  rationale: Глагол буквально связан с разворачиванием, расстиланием или открыванием чего-либо; в контексте речь о том, что глупец делает свою глупость явной.
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Прямой и общеупотребительный русский эквивалент абстрактного термина языка мудрости.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма сохранена. «Свою» добавлено для естественности и ясности по-русски, не меняя подразумеваемой связи глупца с его глупостью.
