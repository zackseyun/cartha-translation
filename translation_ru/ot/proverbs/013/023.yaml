  text: רָב אֹ֭כֶל נִ֣יר רָאשִׁ֑ים וְ/יֵ֥שׁ נִ֝סְפֶּ֗ה בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
translation:
  language: ru
  text: На вспаханном поле бедных — обильная пища[b], но иной гибнет без правосудия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но бывает гибель без правосудия». Еврейское второе полустишие предельно кратко и допускает более безличное понимание.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «на залежной пашне»; еврейское слово может обозначать поле, подготовленное вспашкой к посеву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אֹכֶל
  choice: обильная пища
  rationale: Сохраняет широкое значение «много пищи, пропитания» и не сужает образ до конкретного урожая.
- source_word: נִיר
  choice: вспаханное поле
  rationale: Передаёт обрабатываемую, недавно распаханную или залежную пашню; это естественнее по-русски, чем буквальное «пар».
- source_word: רָאשִׁים
  choice: бедных
  rationale: Необычная форма традиционно понимается как обозначение бедных, неимущих людей.
- source_word: נִסְפֶּה
  choice: губит
  rationale: Еврейская форма допускает значение гибели или уничтожения; в контексте эллиптического второго полустишия русский активный оборот естественно выражает утрату подразумеваемой пищи или урожая.
- source_word: בְּלֹא מִשְׁפָּט
  choice: несправедливость
  rationale: Передаёт отсутствие правосудия или справедливого порядка и сохраняет социально-нравственный смысл изречения.
theological_decisions:
- issue: Подразумеваемый субъект или объект во втором полустишии
  choice: «бывает, что её губит несправедливость» — подразумевается пища или урожай первого полустишия
  alternative: «но бывает, что человек гибнет там, где нет правосудия»
  rationale: Краткий еврейский оборот וְיֵשׁ נִסְפֶּה допускает как безличное продолжение об утрате произведённого, так и личное понимание «есть погибающий». Основной текст связывает оба полустишия предметно, а сноска сохраняет личное прочтение.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма притчи. «Правосудие» оставлено в сноске как более судебно-правовой вариант, тогда как основной текст использует более широкое «несправедливость».
