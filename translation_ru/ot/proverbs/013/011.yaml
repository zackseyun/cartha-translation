  text: Wealth from vanity dwindles[b][a], but whoever gathers little by little increases it.
translation:
  language: ru
  text: 'Богатство от суеты[a] убывает,

    а кто собирает понемногу[b], тот умножает его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от пара (дыхания), пустоты»; речь может идти о богатстве непрочном, мимолётном или приобретённом ненадёжным путём.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой»; вероятный смысл — постепенно, малыми долями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: богатство
  rationale: Слово обозначает материальное состояние или имущество; «богатство» естественно и достаточно широко передаёт его смысл.
- source_word: מֵהֶבֶל
  choice: от суеты
  rationale: Сохранён образ הֶבֶל — «дыхание, пар; пустота, суета» — без сведения его к одной из возможных трактовок, например поспешной или нечестной наживе.
- source_word: יִמְעָט
  choice: убывает
  rationale: Глагол означает «становиться меньшим, уменьшаться»; «убывает» звучит естественно в кратком изречении о богатстве.
- source_word: וְקֹבֵץ
  choice: а кто собирает
  rationale: Субстантивированное причастие выражает обобщённое лицо; такая конструкция естественна для русского афоризма.
- source_word: עַל יָד
  choice: понемногу
  rationale: Буквально выражение связано с «рукой», но здесь, вероятнее всего, обозначает постепенное накопление малыми долями.
- source_word: יַרְבֶּה
  choice: умножает его
  rationale: Порода хифиль передаёт причинное значение «делать многочисленным, увеличивать»; местоимение ясно соотносит действие с богатством.
