  text: מַלְאָ֣ךְ רָ֭שָׁע יִפֹּ֣ל בְּ/רָ֑ע וְ/צִ֖יר אֱמוּנִ֣ים מַרְפֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/017.yaml
  text: A wicked messenger falls into trouble[b][a], but a faithful envoy brings healing.
translation:
  language: ru
  text: Злой гонец попадает в беду[a], а верный посланник[b] приносит исцеление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «впадает во зло (несчастье)». Еврейское выражение может указывать как на зло или вред, так и на бедствие, постигающее гонца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посол». В первой и второй частях стиха для гонца или посланника употреблены разные еврейские слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  choice: гонец
  rationale: В данном контексте речь идёт о человеке, передающем поручение, а не о небесном существе. «Гонец» естественно передаёт это значение и позволяет отличить слово от צִיר во второй части стиха.
- source_word: רָשָׁע
  choice: злой
  rationale: Прилагательное характеризует нравственные качества гонца. «Злой» сохраняет этическую силу оригинала и звучит естественно в сочетании «злой гонец».
- source_word: יִפֹּל
  choice: попадает
  rationale: Форма выражает обычный, закономерный результат в изречении. Настоящее время соответствует русскому стилю пословиц, а «попадает» естественно сочетается с «в беду».
- source_word: בְּרָע
  choice: в беду
  rationale: רָע здесь может обозначать зло, вред или бедствие. В контексте наиболее вероятно указание на пагубное последствие для злого гонца; неоднозначность отмечена в сноске.
- source_word: צִיר
  choice: посланник
  rationale: Слово обозначает уполномоченного посланца, иногда посла. «Посланник» сохраняет официальный оттенок и отличает этот термин от מַלְאָךְ, переведённого как «гонец».
- source_word: אֱמוּנִים
  choice: верный
  rationale: Форма передаёт надёжность и верность поручению. «Верный» кратко и естественно выражает обе стороны значения.
- source_word: מַרְפֵּא
  choice: исцеление
  rationale: Существительное обозначает исцеление, восстановление или целительное средство. «Исцеление» сохраняет образ и допускает как буквальное, так и переносное понимание.
