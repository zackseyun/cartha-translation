  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יֹ֣אכַל ט֑וֹב וְ/נֶ֖פֶשׁ בֹּגְדִ֣ים חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/002.yaml
  text: From the fruit of a man's mouth he eats good[b][a], but the soul of the treacherous feeds on violence.
translation:
  language: ru
  text: От плода своих уст человек вкушает добро, а желание вероломных — насилие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово, переданное как «желание», буквально означает «душа» и может также обозначать внутреннее стремление или аппетит. Во второй строке нет выраженного глагола; возможно также: «душа вероломных питается насилием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: От плода уст своих человек
  rationale: Сохраняется конкретный еврейский образ «плода уст», то есть результата речи. אִישׁ в этой общей сентенции естественно передано словом «человек».
- source_word: יֹאכַל טוֹב
  choice: вкушает добро
  rationale: Имперфект имеет гномическое, обычное значение. «Вкушает» сохраняет связь с образом плода, а «добро» передаёт широкое и намеренно неуточнённое טוֹב.
- source_word: וְנֶפֶשׁ בֹּגְדִים
  choice: а душа вероломных
  rationale: נֶפֶשׁ буквально обозначает душу, жизнь, внутреннее существо, а иногда желание или аппетит. «Душа» сохраняет лексическую широту и краткость оригинала; «а» естественно выражает контраст.
- source_word: בֹּגְדִים
  choice: вероломных
  rationale: Причастие от בגד характеризует тех, кто поступает коварно или изменнически; «вероломные» передаёт устойчивое качество без излишнего сужения до политического предательства.
- source_word: חָמָס
  choice: насилие
  rationale: Основное значение — насилие, жестокость, насильственное злодеяние. Краткое «насилие» сохраняет открытый смысл оригинала.
theological_decisions:
- issue: Эллипсис во второй строке
  choice: 'Сохранить именную конструкцию: «душа вероломных — насилие»'
  alternative: «душа вероломных питается насилием» или «желание вероломных — насилие»
  rationale: В масоретском тексте во второй строке нет выраженного глагола. Сохранение эллипсиса не навязывает конкретную связь — потребление, стремление или участь — и удерживает напряжённую краткость еврейской формулировки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Уста» и «вкушает» сохраняют поэтическую связь плода и еды, оставаясь понятными; тире передаёт резкий эллипсис второй строки.
