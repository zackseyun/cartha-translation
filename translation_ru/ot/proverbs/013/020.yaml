  text: Whoever walks with the wise will become wise[a], but a companion of fools will suffer harm.
translation:
  language: ru
  text: Кто ходит с мудрыми, станет мудрым, а кто водится с глупцами, пострадает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понесёт ущерб», «плохо кончит» или «погибнет». Еврейский глагол может означать претерпеть вред или неблагоприятный исход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ אֶת חֲכָמִים
  choice: Кто ходит с мудрыми
  rationale: Инфинитив абсолют употреблён как обозначение человека, чьё постоянное поведение описывается. «Ходит с» сохраняет образ пути и естественно передаёт общение и близкое окружение.
- source_word: וַחֲכָם
  choice: станет мудрым
  rationale: Форма выражает результат общения с мудрыми; «станет» яснее передаёт приобретение мудрости, чем статичное «будет мудрым».
- source_word: וְרֹעֶה כְסִילִים
  choice: а кто водится с глупцами
  rationale: В данном контексте רעה означает поддерживать общение, быть в компании; «водится с» естественно передаёт устойчивую связь и сохраняет параллель с первой строкой. Союз передан как «а», поскольку между частями есть смысловое противопоставление.
- source_word: יֵרוֹעַ
  choice: потерпит вред
  rationale: Нифаль глагола רעע обозначает причинённый ущерб или неблагоприятный исход. Этот перевод не сужает значение до полного разорения или гибели.
