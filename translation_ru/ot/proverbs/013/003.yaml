  text: Whoever guards his mouth preserves his life[b][a]; whoever opens wide his lips comes to ruin.
translation:
  language: ru
  text: Кто хранит свои уста, тот бережёт свою жизнь[a]; кто широко раскрывает свои губы — тому погибель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «его нефеш»; это слово может также означать «душу» или самого человека, но здесь естественнее всего понимать его как «жизнь».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «навлекает на себя погибель»; «приходит к погибели». Еврейское выражение предельно кратко и допускает несколько близких по смыслу передач.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: хранит
  rationale: Причастие обозначает бдительную охрану и сдержанность; «хранит» естественно сочетается с «устами» и сохраняет образ оригинала.
- source_word: פִּיו
  choice: свои уста
  rationale: Конкретный образ «рта» сохранён в традиционно-поэтическом, но понятном русском слове «уста», которое также поддерживает параллелизм с «губами».
- source_word: שֹׁמֵר
  choice: бережёт
  rationale: Глагол буквально означает «хранит, оберегает»; в сочетании с жизнью «бережёт» естественно передаёт и действие, и его охранительный результат, не превращая параллелизм в явную причинную конструкцию.
- source_word: נַפְשׁוֹ
  choice: свою жизнь
  rationale: Здесь נֶפֶשׁ наиболее естественно означает жизнь человека, а не отдельно мыслимую нематериальную душу.
- source_word: פֹּשֵׂק
  choice: широко раскрывает
  rationale: Сохранён конкретный образ широко раскрытых губ, обозначающий несдержанную речь, без замены метафоры толкованием вроде «говорит опрометчиво».
- source_word: שְׂפָתָיו
  choice: свои губы
  rationale: Буквальный образ сохраняет параллелизм между «устами» и «губами».
- source_word: מְחִתָּה לוֹ
  choice: тому погибель
  rationale: Краткая именная конструкция воспроизводит сжатость и эллиптичность еврейского выражения; מְחִתָּה может обозначать гибель, крушение или бедствие.
theological_decisions:
- issue: Значение נֶפֶשׁ
  choice: жизнь
  alternative: душа; сам человек
  rationale: Контекст житейской мудрости говорит о сохранении собственной жизни или благополучия; «душа» могла бы внести более узкий позднейший антропологический смысл.
- issue: Характер последствия во второй строке
  choice: тому погибель
  alternative: навлекает на себя погибель; приходит к погибели
  rationale: 'Еврейский текст не уточняет грамматически развёрнутую причинную связь, поэтому перевод сохраняет афористическую неопределённость: погибель становится его уделом или обрушивается на него.'
translation_notes:
  register: Современный литературный русский с умеренно поэтической библейской образностью. «Уста» выбрано ради достоинства афоризма и параллелизма с «губами»; синтаксис краткий и легко понятный.
