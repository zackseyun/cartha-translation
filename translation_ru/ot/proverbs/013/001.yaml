source:
  edition: WLC
  text: בֵּ֣ן חָ֭כָם מ֣וּסַר אָ֑ב וְ֝/לֵ֗ץ לֹא שָׁמַ֥ע גְּעָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/001.yaml
  text: A wise son accepts a father's discipline[b][a], but a scoffer does not listen to rebuke.
translation:
  language: ru
  text: Мудрый сын принимает наставление отца[a], а насмешник не слушает обличения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мудрый сын слушает наставление отца». Еврейский текст первого полустишия краток: глагол «слушать» подразумевается по второму полустишию и может означать слушание с принятием и послушанием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выговора».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: сын
  rationale: Существительное стоит в единственном числе мужского рода; в форме притчи «сын» служит конкретным типичным образом, поэтому не заменяется нейтральным словом «ребёнок».
- source_word: חָכָם
  choice: мудрый
  rationale: В литературе мудрости слово обозначает практическую мудрость и нравственную рассудительность; «мудрый» — точный и естественный русский эквивалент.
- source_word: מוּסַר
  choice: наставление
  rationale: В Притчах слово охватывает обучение, воспитание и исправление. «Наставление» естественно сочетается с глаголом «принимает» и не сужает значение только до наказания.
- source_word: אָב
  choice: отца
  rationale: Конструкция מוּסַר אָב не содержит притяжательного суффикса, поэтому «отца» сохраняет неопределённость, не добавляя «своего».
- source_word: לֵץ
  choice: насмешник
  rationale: В Притчах это устойчивый образ человека, который надменно отвергает исправление; «насмешник» ясно и естественно передаёт эту нравственную установку.
- source_word: שָׁמַע
  choice: принимает / не слушает
  rationale: Глагол может означать слышать, слушать и внимать с готовностью повиноваться. В первом полустишии подразумеваемое действие передано как «принимает», во втором явный глагол — как «не слушает»; примечание сохраняет более буквальную возможность.
- source_word: גְּעָרָה
  choice: обличение
  rationale: Слово обозначает словесный укор или выговор; «обличение» уместно в литературе мудрости и сохраняет связь с нравственным исправлением.
