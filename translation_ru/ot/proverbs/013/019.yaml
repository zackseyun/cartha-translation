  text: תַּאֲוָ֣ה נִ֭הְיָה תֶּעֱרַ֣ב לְ/נָ֑פֶשׁ וְ/תוֹעֲבַ֥ת כְּ֝סִילִ֗ים ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/019.yaml
  text: A desire fulfilled is sweet to the soul[a], but to turn away from evil is an abomination to fools.
translation:
  language: ru
  text: Исполнившееся желание сладостно душе[a], но удаляться от зла — мерзость для глупцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Желание, ставшее явью, приятно душе».'
    reason: 'Лексическая альтернатива для נִהְיָה и תֶּעֱרַב: возможна менее образная передача «ставшее явью» и «приятно».'
lexical_decisions:
- source_word: תַּאֲוָה
  choice: желание
  rationale: Широкое и естественное соответствие существительному со значением желания или стремления; не усиливает его до «страсти» или «жажды».
- source_word: נִהְיָה
  choice: исполнившееся
  rationale: Причастная форма от היה описывает желание как осуществившееся, ставшее действительностью; сочетание «исполнившееся желание» естественно по-русски.
- source_word: תֶּעֱרַב
  choice: сладостно
  rationale: Сохраняет образ сладости, заложенный в глаголе со значением «быть приятным, сладким», и соответствует возвышенному афористическому регистру.
- source_word: לְנָפֶשׁ
  choice: душе
  rationale: נפש здесь обозначает внутреннее существо человека; «душе» сохраняет антропологическую и эмоциональную насыщенность выражения.
- source_word: וְתוֹעֲבַת
  choice: но … мерзость
  rationale: Союз передаёт смысловое противопоставление двух частей, а «мерзость» сохраняет сильную отрицательную оценку תועבה.
- source_word: כְּסִילִים
  choice: глупцов
  rationale: В Притчах слово обозначает нравственно и умственно закоснелых людей; «глупцы» — традиционное и понятное обозначение этого типа.
- source_word: סוּר
  choice: удаляться
  rationale: Инфинитив называет действие отступления или уклонения от зла. «Удаляться» естественно сочетается с «от зла» и сохраняет нравственно-волевой смысл.
- source_word: מֵרָע
  choice: от зла
  rationale: В контексте мудростной литературы רע имеет прежде всего нравственное значение, которое прямо передаётся словом «зло».
theological_decisions:
- issue: Связь между двумя частями изречения
  choice: Сохранено резкое сопоставление приятности исполненного желания и отвращения глупцов к отказу от зла.
  alternative: Истолковать первую часть как характеристику желания именно глупцов или явно указать причинную связь между частями.
  rationale: Еврейский текст не выражает такого уточнения явно; перевод сохраняет афористическую напряжённость и не добавляет скрытого субъекта или причинного отношения.
translation_notes:
  register: Современный литературный русский с достоинством библейской мудростной речи. Формулировка краткая и афористичная; «сладостно душе» сохраняет образность оригинала, а тире делает вторую часть естественной по-русски.
