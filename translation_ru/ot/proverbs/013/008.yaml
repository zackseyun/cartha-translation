  text: כֹּ֣פֶר נֶֽפֶשׁ אִ֣ישׁ עָשְׁר֑/וֹ וְ֝/רָ֗שׁ לֹא שָׁמַ֥ע גְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/008.yaml
  text: A man's wealth is the ransom of his life[a], but a poor man does not hear a rebuke.
translation:
  language: ru
  text: 'Богатство человека — выкуп за его жизнь,

    а бедняк не слышит упрёка.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грозного окрика»; возможно, «угрозы». Вероятно, смысл в том, что бедняк не становится объектом требования выкупа или вымогательства, поскольку ему нечем платить.'
    reason: Слово גְּעָרָה обычно означает «упрёк, порицание», но может обозначать и резкий, угрожающий окрик; социальный смысл связи двух строк остаётся вероятным толкованием, а не утверждением основного текста.
lexical_decisions:
- source_word: כֹּפֶר
  choice: выкуп
  rationale: Слово обозначает выкуп или возмещение, которым предотвращают утрату либо наказание. «Выкуп» сохраняет конкретный правовой и экономический образ.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: Здесь נֶפֶשׁ означает жизнь человека, а не «душу» как отдельную нематериальную сущность; контекст говорит об избавлении от опасности посредством выкупа.
- source_word: אִישׁ
  choice: человека
  rationale: Еврейское существительное стоит в мужском роде и имеет обобщающее значение. Русское «человека» естественно передаёт общую сентенцию, не меняя смысла.
- source_word: עָשְׁרוֹ
  choice: богатство
  rationale: Прямое и естественное обозначение материального достатка; оно поддерживает противопоставление бедняку во второй строке.
- source_word: רָשׁ
  choice: бедняк
  rationale: Краткое существительное мужского рода точно передаёт бедного или нуждающегося человека и сохраняет афористичность.
- source_word: לֹא שָׁמַע
  choice: не слышит
  rationale: Буквальная формулировка сохраняет еврейский образ и не решает однозначно, идёт ли речь о полученном порицании, угрозе или вымогательском требовании.
- source_word: גְּעָרָה
  choice: угроз
  rationale: Хотя обычное значение — «упрёк, порицание», в данном противопоставлении слово, вероятно, обозначает суровый окрик или угрозу, связанную с требованием выкупа. Множественное «угроз» звучит по-русски естественно в общей сентенции; более буквальный вариант указан в сноске.
theological_decisions:
- issue: Характер связи между богатством, выкупом и положением бедняка
  choice: Сохранено парадоксальное противопоставление без утверждения, что богатство само по себе спасает жизнь.
  alternative: Развернуть смысл как похищение ради выкупа или вымогательство.
  rationale: Контекст допускает такое объяснение, но еврейский текст выражает его косвенно; конкретный сценарий не следует вносить в основной текст как несомненный.
translation_notes:
  register: Современный литературный русский язык; сохранены краткость, параллелизм и афористичность еврейской пословицы. Тире подчёркивает именную конструкцию первой строки.
