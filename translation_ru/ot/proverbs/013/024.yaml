  yaml_path: translation/ot/proverbs/013/024.yaml
  text: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
translation:
  language: ru
  text: Кто удерживает свою розгу, тот ненавидит своего сына, а кто любит его, тот с усердием ищет для него наставления.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ищет его наставления с раннего времени». Глагол, связанный с ранним поиском, здесь выражает усердие или настойчивость; «наставление» включает также исправление и дисциплину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: удерживает
  rationale: Причастие от חשׂך означает удерживать, не пускать в ход. «Удерживает» передаёт сознательное воздержание и не придаёт ему положительного оттенка жалости.
- source_word: שִׁבְטוֹ
  choice: свою розгу
  rationale: שֵׁבֶט обозначает прут, жезл или посох; в контексте семейного наказания русское «розга» естественно сохраняет конкретный образ орудия исправления.
- source_word: שׂוֹנֵא
  choice: ненавидит
  rationale: Прямое значение глагола сохранено без смягчения, чтобы передать резкую антитезу изречения.
- source_word: בְנוֹ
  choice: своего сына
  rationale: Перевод сохраняет мужской род и притяжательное отношение, прямо выраженные в еврейском тексте.
- source_word: וְאֹהֲבוֹ
  choice: а кто любит его
  rationale: Противительный союз и местоименное дополнение переданы естественной русской конструкцией; «его» относится к сыну.
- source_word: שִׁחֲרוֹ
  choice: усердно … наставляет его
  rationale: Порода пиэль глагола שׁחר, буквально связанного с ранним поиском, идиоматически выражает ревностное, старательное действие. Местоименный суффикс передан словом «его».
- source_word: מוּסָר
  choice: наставляет
  rationale: מוּסָר в Притчах охватывает воспитание, исправление и дисциплину. Глагольное «наставляет» естественно по-русски передаёт эту широкую исправительно-воспитательную деятельность и не сводит её только к телесному наказанию.
theological_decisions:
- issue: Следует ли смягчать образ телесного наказания
  choice: Сохранить конкретный образ розги, не сводя при этом מוּסָר исключительно к физическому наказанию.
  alternative: Заменить «розгу» общими словами «исправление» или «воспитание».
  rationale: В еврейском тексте прямо названа שֵׁבֶט — розга или прут. Этот образ и резкая связь отказа от исправления с ненавистью составляют риторическую силу изречения. Вместе с тем מוּסָר шире телесного наказания и включает нравственное наставление и исправление.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и резкой антитезы еврейского изречения. «Розга» употреблена как понятный традиционный предметный образ; «усердно наставляет» звучит естественно и охватывает как исправление, так и воспитание.
