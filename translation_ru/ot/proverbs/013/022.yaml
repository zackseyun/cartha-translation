  text: ט֗וֹב יַנְחִ֥יל בְּנֵֽי בָנִ֑ים וְ/צָפ֥וּן לַ֝/צַּדִּ֗יק חֵ֣יל חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/022.yaml
  text: A good man leaves an inheritance to his grandchildren[b][a], but the wealth of a sinner is stored up for the righteous.
translation:
  language: ru
  text: Добрый человек оставляет наследство внукам[a], а богатство грешника сберегается для праведника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «детям детей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прибережено»; возможен также смысл «спрятано для праведника».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: добрый человек
  rationale: Прилагательное мужского рода употреблено субстантивированно и обозначает доброго человека как типичного представителя; добавление «человек» делает смысл естественным и ясным по-русски.
- source_word: יַנְחִיל
  choice: оставляет наследство
  rationale: Каузативная форма глагола נחל означает «даёт в наследство, делает наследником»; в контексте семейной преемственности естественный русский эквивалент — «оставляет наследство».
- source_word: בְּנֵי בָנִים
  choice: внукам
  rationale: Буквально «детям детей»; слово «внукам» точно и естественно передаёт указанное поколение.
- source_word: וְצָפוּן
  choice: а ... сберегается
  rationale: Форма от צפן может означать «спрятано», «припасено» или «сохранено». «Сберегается» передаёт состояние накопленного богатства и не уточняет, кем именно оно сохраняется; союз «а» естественно выражает антитезу параллельных строк.
- source_word: לַצַּדִּיק
  choice: для праведника
  rationale: Предлог ל обозначает того, кому в итоге предназначено или достанется богатство; единственное число сохраняет собирательно-типический характер еврейского выражения.
- source_word: חֵיל
  choice: богатство
  rationale: В данном контексте חֵיל обозначает имущество или материальные средства; «богатство» ясно связывает вторую часть с темой наследства.
- source_word: חוֹטֵא
  choice: грешника
  rationale: Субстантивированное причастие обозначает человека, который грешит, как типичного представителя; «грешник» кратко и точно передаёт это значение.
theological_decisions:
- issue: Мужской род субстантивированных обозначений в изречении
  choice: «добрый человек», «праведник», «грешник»
  alternative: «добрый», «праведный человек», «тот, кто грешит»
  rationale: Еврейский текст использует формы мужского рода в единственном числе как типические обозначения. Русский перевод сохраняет эту грамматическую и изреченческую форму, не ограничивая смысл исключительно мужчинами.
- issue: Характер передачи перехода богатства грешника к праведнику
  choice: «сберегается для праведника»
  alternative: «спрятано для праведника» / «прибережено для праведника»
  rationale: Текст утверждает направленность или конечное предназначение богатства, но не объясняет механизм и не называет действующее лицо. Пассивная формулировка сохраняет эту недосказанность и не вводит дополнительного богословского объяснения.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма изречения. Лексика понятна широкому читателю, при этом сохранены параллелизм, контраст и пассивная неопределённость еврейского текста.
