  text: בָּ֣ז לְ֭/דָבָר יֵחָ֣בֶל ל֑/וֹ וִ/ירֵ֥א מִ֝צְוָ֗ה ה֣וּא יְשֻׁלָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/013.yaml
  text: Whoever despises a word will be ruined by it[c][b][a], but he who fears the commandment will be rewarded.
translation:
  language: ru
  text: Кто презирает слово[a], тот погибнет[b], а кто боится заповеди, тот получит воздаяние[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дело» или «нечто». Еврейское דָבָר может означать «слово», «дело» или «нечто».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тот потерпит ущерб» или «навлечёт на себя погибель». Еврейское выражение допускает оттенки ущерба и гибели.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будет вознаграждён». Буквально: «ему будет воздано».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: презирает
  rationale: Причастная форма обозначает того, кто относится к чему-либо с презрением. Настоящее время естественно для русского обобщающего изречения.
- source_word: לְדָבָר
  choice: слово
  rationale: דָבָר может означать «слово», «дело» или «обстоятельство». «Слово» сохраняет лексическую форму и открытость еврейского изречения, вероятно подразумевающего наставление или совет.
- source_word: יֵחָבֶל לוֹ
  choice: навлекает на себя погибель
  rationale: Форма Niphal глагола חבל здесь передаёт гибель или тяжкий ущерб, постигающий человека. Русская формулировка естественно выражает, что презрение к слову оборачивается гибелью для самого презирающего, не уточняя её характер.
- source_word: וִירֵא
  choice: кто боится
  rationale: Сохраняется прямое значение корня ירא — страх, включающий благоговение и почтительное отношение, важное для языка литературы мудрости.
- source_word: מִצְוָה
  choice: заповеди
  rationale: מִצְוָה непосредственно означает «заповедь» или «повеление». «Заповедь» сохраняет нравственный и заветный вес слова, не уточняя, идёт ли речь о конкретном предписании.
- source_word: הוּא יְשֻׁלָּם
  choice: тот получит воздаяние
  rationale: Конструкция «кто… тот» естественно передаёт подчёркнутое הוּא, а «получит воздаяние» сохраняет широкое значение Pual от שלם — получить соответствующую отплату; в данном противопоставлении она положительна.
theological_decisions:
- issue: Родовая функция мужского единственного числа в изречении мудрости
  choice: Передать обе части симметричной русской конструкцией «кто… тот», применимой к любому человеку.
  alternative: 'Сохранить грамматический мужской род: «презирающий… он».'
  rationale: Еврейские формы мужского единственного числа имеют здесь обобщающий характер. Русское «кто… тот» естественно сохраняет этот смысл, а указательное «тот» также передаёт усиление явным местоимением הוּא.
- issue: Характер воздаяния в יְשֻׁלָּם
  choice: «получит воздаяние»
  alternative: «будет вознаграждён» или «ему воздастся»
  rationale: Контраст указывает на благоприятное воздаяние, однако сам глагол означает отплату или возмещение шире, чем только награду. Выбранный вариант сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная конструкция «кто… тот» соответствует форме притчи. «Боится» намеренно не смягчено до «уважает», а «воздаяние» сохраняет достоинство и смысловую широту исходного выражения.
