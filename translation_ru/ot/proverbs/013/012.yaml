  text: תּוֹחֶ֣לֶת מְ֭מֻשָּׁכָה מַחֲלָה לֵ֑ב וְ/עֵ֥ץ חַ֝יִּ֗ים תַּאֲוָ֥ה בָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/012.yaml
  text: Hope deferred makes the heart sick[a], but a desire fulfilled is a tree of life.
translation:
  language: ru
  text: Надежда, долго не сбывающаяся, томит сердце, а исполнившееся желание — дерево жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Затянувшаяся надежда — болезнь сердца, а пришедшее желание — дерево жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: надежда
  rationale: Существительное обозначает исполненное надежды ожидание; «надежда» естественно передаёт смысл и поддерживает противопоставление исполнившемуся желанию.
- source_word: מְמֻשָּׁכָה
  choice: которая долго не сбывается
  rationale: Форма буквально означает «затянутая, продлённая». В связи с надеждой русское выражение передаёт длительную отсрочку ожидаемого события, не создавая впечатления, будто кто-то намеренно его отложил.
- source_word: מַחֲלָה לֵב
  choice: делает сердце больным
  rationale: В еврейском тексте это безглагольное сочетание «болезнь сердца». Предикативная русская конструкция естественна и сохраняет телесно-эмоциональную метафору.
- source_word: וְעֵץ חַיִּים
  choice: а … — дерево жизни
  rationale: Хотя ו формально означает «и», параллелизм здесь противопоставительный, поэтому «а» ясно передаёт связь между двумя частями. Библейский образ «дерева жизни» сохранён.
- source_word: תַּאֲוָה
  choice: желание
  rationale: Слово может означать желание или сильное стремление. Нейтральное «желание» соответствует контексту и не привносит отрицательной оценки.
- source_word: בָאָה
  choice: исполнившееся
  rationale: Буквально форма означает «пришедшее». В данном контексте речь идёт о желании, осуществление которого наступило; «исполнившееся» естественно выражает это по-русски.
theological_decisions:
- issue: Значение союза ו перед עֵץ חַיִּים
  choice: а
  alternative: и
  rationale: Простой соединительный союз в еврейской поэзии может связывать противопоставленные строки. Русское «а» передаёт антитетический параллелизм, не усиливая его до резкого «но».
translation_notes:
  register: Современный литературный русский язык; формулировка доступна широкому читателю и сохраняет афористичность, метафору больного сердца и библейский образ дерева жизни.
