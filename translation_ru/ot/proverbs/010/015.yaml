  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ מְחִתַּ֖ת דַּלִּ֣ים רֵישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/015.yaml
  text: A rich man's wealth is his fortified city[b][a]; the ruin of the poor is their poverty.
translation:
  language: ru
  text: Богатство богача — его укреплённый город[a]; разорение[b] бедных — их бедность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «город его силы»; возможно также: «его крепкий город».'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «разорение», может также означать «гибель», «ужас» или «смятение».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: богатство
  rationale: Прямо обозначает материальное состояние и естественно противопоставляется бедности во второй строке.
- source_word: עָשִׁיר
  choice: богача
  rationale: Субстантивированное прилагательное стоит в единственном числе; родительный падеж естественно передаёт принадлежность богатства.
- source_word: קִרְיַת עֻזּוֹ
  choice: его укреплённый город
  rationale: Буквально «город его силы»; выражение рисует город как место защищённости, поэтому «укреплённый город» ясно и естественно передаёт метафору.
- source_word: מְחִתַּת
  choice: разорение
  rationale: В данном параллелизме слово указывает на гибельное, разрушительное последствие; «разорение» также уместно в экономическом контексте, хотя возможны и более общие значения.
- source_word: דַּלִּים
  choice: бедных
  rationale: Обозначает бедных или неимущих людей; форма множественного числа сохранена.
- source_word: רֵישָׁם
  choice: их бедность
  rationale: Прямая передача существительного «бедность, нужда» с местоименным суффиксом множественного числа.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены лаконичный параллелизм и контраст между защищённостью богатого и уязвимостью бедных. Формулировка описывает наблюдаемую социальную реальность, не добавляя нравственной оценки, которой нет в стихе.
