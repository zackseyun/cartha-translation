  yaml_path: translation/ot/proverbs/010/001.yaml
  text: 'The proverbs of Solomon: a wise son makes a father glad[a], but a foolish son is the grief of his mother.'
translation:
  language: ru
  text: 'Притчи Соломона.


    Мудрый сын радует отца,

    а глупый сын — горе своей матери.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: Притчи
  rationale: Форма сопряжённого множественного числа от מָשָׁל служит заголовком собрания; «притчи» — естественный и устоявшийся русский эквивалент в данном контексте.
- source_word: שְׁלֹמֹה
  choice: Соломона
  rationale: Личное имя передано в традиционной русской форме и поставлено в родительный падеж в соответствии с еврейской сопряжённой конструкцией.
- source_word: בֵּן
  choice: сын
  rationale: В еврейском тексте употреблено существительное мужского рода в единственном числе; его не следует нейтрализовать словом «ребёнок».
- source_word: חָכָם
  choice: мудрый
  rationale: В Притчах слово обозначает мудрость в нравственной и практической жизни и противопоставлено כְּסִיל.
- source_word: יְשַׂמַּח
  choice: радует
  rationale: Каузативная форма глагола שׂמח означает «вызывает радость»; русский переходный глагол «радует» кратко и естественно передаёт этот смысл.
- source_word: אָב
  choice: отца
  rationale: У существительного нет местоименного суффикса. Форма «отца» без добавления «своего» сохраняет обобщённость изречения и естественна по-русски.
- source_word: וּבֵן
  choice: а ... сын
  rationale: Хотя ו формально может означать «и», в антитетическом параллелизме союз «а» естественно выражает противопоставление.
- source_word: כְּסִיל
  choice: глупый
  rationale: Слово обозначает нравственно и практически неразумного человека, а не только человека с низкими умственными способностями; «глупый» сохраняет традиционный контраст с «мудрым».
- source_word: תּוּגַת
  choice: горе для
  rationale: Существительное означает скорбь или горе. Именная конструкция «сын — горе для матери» сохраняет краткость афоризма и ясно передаёт, что сын причиняет ей горе.
- source_word: אִמּוֹ
  choice: своей матери
  rationale: Местоименный суффикс третьего лица мужского рода относится к сыну; возвратное «своей» естественно выражает эту принадлежность в русском предложении.
