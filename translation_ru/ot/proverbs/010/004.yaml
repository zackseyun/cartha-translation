lexical_decisions:
- source_word: רָאשׁ
  choice: к бедности
  rationale: Слово обозначает состояние бедности как результат нерадивого труда; оборот «ведёт к бедности» естественно передаёт причинно-результативный смысл первой строки и сохраняет противопоставление обогащению.
- source_word: עֹשֶׂה
  choice: ведёт к
  rationale: Причастие עשה здесь выражает достижение или причинение результата. Русское «ведёт к» ясно и естественно связывает леность с бедностью, не создавая двусмысленного оборота «делает бедным» без названного объекта.
- source_word: כַף
  choice: рука
  rationale: Хотя כַף буквально может означать ладонь, здесь это рука как орудие труда; «рука» сохраняет конкретный образ и звучит естественно по-русски.
- source_word: רְמִיָּה
  choice: ленивая
  rationale: В сочетании с образом работающей руки и в противопоставлении усердным слово указывает прежде всего на нерадивость или леность. Возможное значение «лживая/обманчивая» сохранено в сноске.
- source_word: יָד
  choice: рука
  rationale: Повтор образа руки сохраняет антитетический параллелизм еврейского стиха.
- source_word: חָרוּצִים
  choice: усердных
  rationale: Форма во множественном числе обозначает усердных, прилежных людей. Родительный оборот «рука усердных» сохраняет грамматическое число и коллективный образ оригинала.
- source_word: תַּעֲשִׁיר
  choice: обогащает
  rationale: Порода hифиль глагола עשר имеет каузативное значение «делать богатым, обогащать». «Обогащает» кратко передаёт этот смысл и уравновешивает первую половину пословицы.
