source:
  edition: WLC
  text: בִּרְכַּ֣ת יְ֭הוָה הִ֣יא תַעֲשִׁ֑יר וְ/לֹֽא יוֹסִ֖ף עֶ֣צֶב עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/022.yaml
  text: The blessing of the LORD makes rich, and he adds no sorrow with it.
translation:
  language: ru
  text: Благословение ГОСПОДА обогащает, и Он не прибавляет к нему печали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и тяжкий труд ничего к нему не прибавит». Еврейский текст допускает разные способы связать слова во второй строке.'
    reason: 'Фраза וְלֹא יוֹסִף עֶצֶב עִמָּהּ синтаксически неоднозначна: עֶצֶב может означать «печаль, тяготу» как дополнение либо «тяжкий труд» как субъект.'
lexical_decisions:
- source_word: בִּרְכַּת יְהוָה
  choice: Благословение ГОСПОДА
  rationale: Конструкция означает «благословение Яхве»; передача имени как «ГОСПОДЬ» соответствует принятой русской библейской традиции и консультационному тексту.
- source_word: הִיא תַעֲשִׁיר
  choice: обогащает
  rationale: Глагол в каузативной породе означает «делает богатым, обогащает»; отдельное местоимение указывает, что именно благословение является причиной достатка.
- source_word: וְלֹא יוֹסִף עֶצֶב עִמָּהּ
  choice: и Он не прибавляет к нему печали
  rationale: Сохраняется наиболее естественное понимание невыраженного субъекта как ГОСПОДА; עֶצֶב передано широким словом «печаль», включающим тяготу и скорбь, а עִמָּהּ — как «к нему», то есть к благословению.
theological_decisions:
- issue: Кто является субъектом יוֹסִף («прибавляет»)?
  choice: Он, то есть ГОСПОДЬ
  alternative: «оно не приносит с собой печали» либо «тяжкий труд ничего к нему не прибавит»
  rationale: В еврейском тексте субъект прямо не назван. Мужской род глагола позволяет отнести действие к ГОСПОДУ, тогда как женское «благословение» потребовало бы согласования по женскому роду; при этом альтернативное синтаксическое прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским обозначением имени Бога прописными буквами. Формулировка краткая и афористичная, в соответствии с жанром притчи; подлинная неоднозначность второй строки сохранена в сноске.
