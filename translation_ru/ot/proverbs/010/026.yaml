  text: Like vinegar to the teeth and smoke to the eyes[a], so is the sluggard to those who send him.
translation:
  language: ru
  text: Как уксус для зубов и дым для глаз, так и ленивый для тех, кто его посылает.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹמֶץ
  choice: уксус
  rationale: Слово обозначает кислую жидкость, обычно уксус; этот естественный русский эквивалент сохраняет образ резкого и неприятного воздействия на зубы.
- source_word: לַשִּׁנַּיִם
  choice: для зубов
  rationale: Предлог ל выражает отношение и воздействие; в русской сравнительной конструкции сочетание «для зубов» звучит естественно и сохраняет параллелизм.
- source_word: עָשָׁן
  choice: дым
  rationale: Прямой лексический эквивалент, сохраняющий образ раздражающего воздействия дыма.
- source_word: לָעֵינַיִם
  choice: для глаз
  rationale: Передаёт отношение и вредное воздействие, а также образует точную синтаксическую параллель с «для зубов».
- source_word: כֵּן
  choice: то
  rationale: В русской конструкции «что …, то …» естественно вводит применение двойного сравнения и передаёт значение еврейской сравнительной частицы.
- source_word: הֶעָצֵל
  choice: ленивый
  rationale: Субстантивированное прилагательное обозначает человека, для которого лень стала устойчивой чертой; «ленивый» — ясное и привычное обозначение такого типа человека в русской литературной речи.
- source_word: לְשֹׁלְחָיו
  choice: для посылающих его
  rationale: Причастная форма во множественном числе с местоименным суффиксом мужского рода единственного числа буквально указывает на тех, кто его посылает; формулировка сохраняет число и отношения участников.
