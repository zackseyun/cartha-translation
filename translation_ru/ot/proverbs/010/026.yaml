translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой. Парная конструкция «что …, то …» сохраняет параллелизм еврейской пословицы; редкое в повседневной речи, но прозрачное выражение «посылающих его» точно передаёт людей, поручающих ленивому дело.
