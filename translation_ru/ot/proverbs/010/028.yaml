source:
  edition: WLC
  text: תּוֹחֶ֣לֶת צַדִּיקִ֣ים שִׂמְחָ֑ה וְ/תִקְוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/028.yaml
  text: The expectation of the righteous is joy[a], but the hope of the wicked will perish.
translation:
  language: ru
  text: 'Ожидание[a] праведных — радость,

    а надежда нечестивых погибнет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надежда». В первой строке употреблено другое еврейское существительное, чем во второй, хотя их значения близки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: ожидание
  rationale: Существительное обозначает ожидание, часто исполненное надежды. «Ожидание» сохраняет лексическое отличие от תִקְוָה во второй строке, не устраняя смыслового сближения между ними.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе обозначает праведных людей. Родительный падеж естественно передаёт принадлежность их ожидания и сохраняет краткость пословицы.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Краткий и естественный эквивалент со значением радости, веселья; хорошо сохраняет именную конструкцию первого полустишия.
- source_word: תִקְוַת
  choice: надежда
  rationale: Обычное значение существительного — «надежда». Этот выбор естественен по-русски и сохраняет смысловой параллелизм с «ожиданием», а также лексическое разнообразие еврейского текста.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное обозначает людей, поступающих нечестиво. «Нечестивые» — понятный и уместный для библейской литературы мудрости классовый антоним «праведных».
- source_word: תֹּאבֵד
  choice: погибнет
  rationale: Форма глагола אבד означает «погибнуть, исчезнуть, пропасть». Женский род единственного числа согласуется с «надеждой»; будущее время прямо передаёт форму и смысл контекста.
theological_decisions:
- issue: Что именно погибнет во втором полустишии
  choice: Прямо говорится, что погибнет надежда нечестивых.
  alternative: Строку можно понимать шире — как подразумевающую крушение самих нечестивых вместе с их надеждами.
  rationale: Глагол женского рода единственного числа грамматически согласуется с תִקְוַת («надежда»). Поэтому перевод не превращает подразумеваемый более широкий вывод в прямое утверждение текста.
- issue: Связь ожидания праведных с радостью
  choice: Сохранена сжатая именная формула «Ожидание праведных — радость».
  alternative: 'Можно истолковать её развернуто: «ожидание праведных принесёт радость» или «праведные ожидают радости».'
  rationale: В еврейском тексте связка отсутствует, и краткая русская именная конструкция сохраняет возможную смысловую широту, не уточняя без необходимости, является ли радость содержанием, результатом или исполнением ожидания.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным ритмом. Сохранены антитетический параллелизм, традиционные и понятные термины «праведные» и «нечестивые», а также различие между двумя близкими еврейскими существительными.
