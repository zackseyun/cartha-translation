id: PRO.10.3
reference: Proverbs 10:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽא יַרְעִ֣יב יְ֭הוָה נֶ֣פֶשׁ צַדִּ֑יק וְ/הַוַּ֖ת רְשָׁעִ֣ים יֶהְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/003.yaml
  text: Yahweh will not let the righteous person go hungry[a], but he drives away the craving of the wicked.
translation:
  language: ru
  text: Яхве не даст праведнику голодать, но оттолкнёт желание нечестивых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но отведёт бедствие нечестивых». Еврейское существительное может означать как «желание, влечение», так и «бедствие, погибель».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַרְעִיב
  choice: не даст … голодать
  rationale: Передаёт отрицание и каузативную форму глагола רעב естественным современным русским выражением, не усиливая смысл до «уморит голодом».
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняет личное имя Бога, непосредственно представленное тетраграмматоном, а не заменяет его титулом.
- source_word: נֶפֶשׁ צַדִּיק
  choice: праведнику
  rationale: В данном контексте נֶפֶשׁ обозначает самого человека как живое существо; русский дательный «праведнику» естественно выражает цель воздействия и не навязывает узкого значения «душа».
- source_word: הַוַּת
  choice: желание
  rationale: В параллелизме с голодом вероятнее всего обозначает желание или влечение нечестивых. Возможное значение «бедствие, погибель» сохранено в примечании.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Обычное для русской библейской речи, но понятное современному читателю обозначение людей, поступающих вопреки правде и добру.
- source_word: יֶהְדֹּף
  choice: оттолкнёт
  rationale: Сохраняет конкретный образ глагола — толкнуть прочь, отвести, — не сводя его без пояснения к более отвлечённому «расстроит».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет это различие, не подменяя имя титулом.
- issue: Значение נֶפֶשׁ применительно к праведнику
  choice: смысл целого человека выражен формой «праведнику»
  alternative: «душу праведника»
  rationale: Здесь речь идёт о голоде живого человека, а не обязательно об отдельной нематериальной части; поэтому буквальное «душу» могло бы внести чуждое контексту антропологическое уточнение.
- issue: Значение הַוַּת רְשָׁעִים
  choice: «желание нечестивых»
  alternative: «бедствие (или погибель) нечестивых»
  rationale: Контраст с голодом поддерживает значение желания или влечения, однако лексическая неоднозначность подлинна и потому явно отмечена, а не устранена.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для книги Притч. Синтаксис краток и афористичен; «нечестивые» сохраняет привычную нравственную категорию, а «оттолкнёт» — образность еврейского глагола.
