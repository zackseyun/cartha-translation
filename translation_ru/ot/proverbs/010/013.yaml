  yaml_path: translation/ot/proverbs/010/013.yaml
  text: On the lips of a discerning man wisdom is found[a], but a rod is for the back of one who lacks sense.
translation:
  language: ru
  text: 'На устах разумного — мудрость,

    а розга — для спины того, кому недостаёт здравого смысла[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лишённого сердца»; в еврейском языке «сердце» здесь означает способность понимать и здраво судить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שִׂפְתֵי
  choice: На устах
  rationale: Предлог בְּ с существительным «уста» обозначает место проявления мудрости в речи; выражение сохраняет еврейский образ и естественно звучит по-русски.
- source_word: נָבוֹן
  choice: разумного
  rationale: Слово обозначает человека, обладающего пониманием и проницательностью. Субстантивированное прилагательное передаёт мужской род единственного числа и лаконичный стиль притчи.
- source_word: תִּמָּצֵא
  choice: обретается
  rationale: Нифаль имперфекта выражает здесь постоянную, общеизвестную закономерность. Настоящее время передаёт гномический смысл, а «обретается» сохраняет значение «находится» без неестественной тяжеловесности.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Основное и устойчивое соответствие в книге Притчей.
- source_word: וְ/שֵׁבֶט
  choice: а розга
  rationale: Союз вводит противопоставление. «Розга» обозначает орудие телесного наказания и в данном контексте естественнее современного русского «жезл».
- source_word: לְ/גֵו
  choice: для спины
  rationale: גֵו может означать тело или спину; упоминание розги уточняет, что речь идёт о спине как месте удара. Связка подразумевается в безглагольной еврейской части.
- source_word: חֲסַר לֵב
  choice: тому, кому недостаёт разума
  rationale: Буквально выражение означает «лишённый сердца», но в древнееврейской антропологии сердце здесь связано с пониманием и здравым суждением. Перевод передаёт смысл идиомы и сохраняет формулировку недостатка.
