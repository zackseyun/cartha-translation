  text: חֲכַם לֵ֭ב יִקַּ֣ח מִצְוֺ֑ת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/008.yaml
  text: A wise-hearted man accepts commands[a], but a foolish man of lips will come to ruin.
translation:
  language: ru
  text: 'Мудрый сердцем принимает заповеди,

    а болтливый глупец потерпит крах[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально вторую строку можно передать: «а глупец уст будет повержен». Последний глагол встречается редко и может означать низвержение или гибель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: мудрый сердцем
  rationale: 'Сохраняет еврейский образ: сердце здесь обозначает средоточие мысли и воли. Выражение естественно звучит по-русски и не сводит смысл просто к слову «мудрый».'
- source_word: יִקַּח
  choice: принимает
  rationale: Буквально глагол означает «берёт», но при слове «заповеди» передаёт осознанное принятие авторитетных наставлений.
- source_word: מִצְוֺת
  choice: заповеди
  rationale: Существительное обозначает обязательные повеления. «Заповеди» сохраняет их авторитетный характер и соответствует библейскому регистру современного русского языка.
- source_word: אֱוִיל שְׂפָתַיִם
  choice: болтливый глупец
  rationale: Буквально — «глупец уст», то есть глупец, обнаруживающий себя необузданной речью. «Болтливый глупец» естественно передаёт смысл еврейского оборота, не превращая его в неясную русскую кальку.
- source_word: יִלָּבֵט
  choice: потерпит крах
  rationale: Редкий глагол в форме нифаль выражает низвержение или гибель. «Потерпит крах» ясно передаёт итоговое крушение, а буквальный вариант и лексическая неопределённость отмечены в сноске.
