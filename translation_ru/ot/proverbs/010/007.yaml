lexical_decisions:
- source_word: זֵכֶר
  choice: память
  rationale: Существительное обозначает память или воспоминание; «память» естественно по-русски и сохраняет смысловой параллелизм с «именем».
- source_word: צַדִּיק
  choice: праведник
  rationale: Прилагательное употреблено субстантивированно и обозначает праведного человека как обобщённый тип.
- source_word: לִבְרָכָה
  choice: к благословению
  rationale: Оборот с לְ буквально выражает направленность или результат — «для/к благословению»; выбранная формулировка сохраняет лаконичность и допускает оттенки как благой памяти, так и производимого ею благословения.
- source_word: שֵׁם
  choice: имя
  rationale: Прямой эквивалент сохраняет древнееврейский образ, охватывающий также репутацию и посмертную славу.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе обозначает обобщённую нравственную категорию; родительный падеж обусловлен сочетанием «имя нечестивых».
- source_word: יִרְקָב
  choice: сгниёт
  rationale: Глагол буквально означает гнить, разлагаться; «сгниёт» сохраняет конкретный и резкий образ оригинала.
