  text: Whoever winks the eye causes grief[a], and a fool of lips will come to ruin.
translation:
  language: ru
  text: Кто подмигивает, причиняет огорчение,[a] а болтливый глупец погибнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто подмигивает глазом, причиняет печаль, а болтливый глупец погибнет». Второе полустишие трудно для понимания; буквально по-еврейски: «глупец губ погибнет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ עַיִן
  choice: Кто подмигивает глазом
  rationale: Причастие употреблено как обозначение человека вообще, а עַיִן служит его дополнением. Формулировка сохраняет еврейский образ и естественно передаёт обобщённый смысл.
- source_word: יִתֵּן
  choice: причиняет
  rationale: 'Хотя основное значение נתן — «давать», в сочетании с עַצָּבֶת глагол имеет каузативный смысл: «причинять, приносить» скорбь.'
- source_word: עַצָּבֶת
  choice: скорбь
  rationale: Слово обозначает боль, печаль или огорчение. «Скорбь» передаёт эмоциональный и межличностный вред, не ограничивая смысл физической болью.
- source_word: וֶאֱוִיל שְׂפָתַיִם
  choice: а глупец устами
  rationale: Сохранён необычный еврейский оборот «глупец уст», то есть глупец, проявляющий себя в речи. Русская конструкция «глупец устами» остаётся понятной и не устраняет образность оригинала.
- source_word: יִלָּבֵט
  choice: придёт к погибели
  rationale: Редкая и трудная форма Niphal глагола לבט в данном контексте указывает на падение или гибель. Выбранная формулировка передаёт итоговый смысл, не уточняя спорный образ сверх текста.
