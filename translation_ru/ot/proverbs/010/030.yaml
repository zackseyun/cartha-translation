  text: צַדִּ֣יק לְ/עוֹלָ֣ם בַּל יִמּ֑וֹט וּ֝/רְשָׁעִ֗ים לֹ֣א יִשְׁכְּנוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/030.yaml
  text: The righteous will never be shaken[a], but the wicked will not dwell in the land.
translation:
  language: ru
  text: Праведник вовек не поколеблется, а нечестивые не будут обитать на земле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать как определённую землю или страну, так и всю землю, мир.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного представителя всего класса; «праведник» естественно передаёт эту обобщённую силу.
- source_word: לְעוֹלָם ... בַּל
  choice: вовек не
  rationale: Сочетание временного выражения с поэтическим отрицанием передаёт постоянную невозможность; «вовек не» сохраняет краткость и возвышенную форму притчи.
- source_word: יִמּוֹט
  choice: поколеблется
  rationale: Глагол в нифале выражает утрату устойчивости — быть поколебленным или сдвинутым. «Не поколеблется» сохраняет метафору устойчивости, не усиливая её до «не будет низвержен».
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, чьё поведение нравственно порочно; традиционное русское слово уместно в литературном библейском регистре и понятно современному читателю.
- source_word: יִשְׁכְּנוּ
  choice: не будут жить
  rationale: Глагол שכן означает жить, обитать, иметь постоянное место пребывания. «Не будут жить» звучит естественно и передаёт устойчивое проживание без излишней архаичности.
- source_word: אָרֶץ
  choice: земле
  rationale: Слово может обозначать как определённую землю или страну, так и землю в более широком смысле. Русское «земля» естественно сохраняет эту смысловую открытость.
theological_decisions:
- issue: Масштаб значения אָרֶץ
  choice: земле — без искусственного сужения значения
  alternative: определённая земля или страна; вся земля как обитаемый мир
  rationale: Контекст допускает и связь с устойчивым проживанием в конкретной земле, и более общее утверждение о месте нечестивых в мире. Перевод не закрепляет исключительно заветно-территориальное или универсальное прочтение.
translation_notes:
  register: Краткая антитетическая форма оригинальной притчи сохранена. «Вовек» поддерживает достойный поэтический регистр, оставаясь понятным; вторая строка передана современным выражением «не будут жить», а не более архаичным «не будут обитать».
