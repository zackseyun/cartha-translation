  text: מְגוֹרַ֣ת רָ֭שָׁע הִ֣יא תְבוֹאֶ֑/נּוּ וְ/תַאֲוַ֖ת צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/024.yaml
  text: What the wicked dreads will come upon him[b][a], but the desire of the righteous will be granted.
translation:
  language: ru
  text: Чего страшится нечестивый, то его и постигнет[a], а желание праведных будет исполнено[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «То, чего страшится нечестивый, придёт к нему». Еврейское слово может означать как сам страх, так и то, чего человек страшится.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он даст». Кто именно даст, в еврейском тексте не указано.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְגוֹרַת
  choice: чего страшится
  rationale: Существительное может обозначать страх, ужас или то, чего боятся. В сочетании с רָשָׁע здесь естественно передать предмет страха придаточной конструкцией, сохранив смысл и ясность по-русски.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное в единственном числе имеет обобщающий, пословичный смысл. «Нечестивый» сохраняет нравственно-религиозную окраску и не добавляет указания на пол.
- source_word: הִיא תְבוֹאֶנּוּ
  choice: то его и постигнет
  rationale: Местоимение женского рода отсылает к מְגוֹרַת, а בוא с местоименным суффиксом означает, что страшившее придёт к человеку. «Постигнет» естественно выражает наступление опасавшего его исхода; частица «и» подчёркивает соответствие между страхом и результатом.
- source_word: וְתַאֲוַת
  choice: а желание
  rationale: תאוה означает желание или стремление. Союз וְ передан как «а», поскольку две половины стиха образуют антитезу.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе обозначает праведных людей как группу; родительный падеж сохраняет еврейскую конструкцию «желание праведных».
- source_word: יִתֵּן
  choice: будет исполнено
  rationale: В еврейском стоит активная форма «он даст», но субъект не назван. Русская страдательная конструкция ясно передаёт осуществление желания, не уточняя дарующего и не добавляя к тексту прямого упоминания Бога.
theological_decisions:
- issue: Неуказанный субъект יִתֵּן
  choice: 'Оставить дарующего неуказанным: «будет исполнено».'
  alternative: «Он даст» либо «Бог исполнит», если считать подразумеваемым субъектом Бога.
  rationale: Еврейский текст не называет субъекта. Хотя в литературе мудрости может подразумеваться Божье действие, его прямое обозначение устранило бы сохранённую оригиналом неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Параллелизм и противопоставление двух частей сохранены; формулировка понятна обычному читателю и не устраняет неопределённость субъекта во второй строке.
