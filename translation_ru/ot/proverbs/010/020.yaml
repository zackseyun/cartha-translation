  text: The tongue of the righteous is choice silver[a]; the heart of the wicked is of little worth.
translation:
  language: ru
  text: Язык праведника — отборное серебро, а сердце нечестивых немногого стоит[a].
  philosophy: optimal-equivalence
  footnotes:
