    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: серебро
  rationale: Конкретный образ драгоценного металла передаёт метафору ценности точнее, чем более отвлечённые «деньги».
- source_word: נִבְחָר
  choice: отборное
  rationale: В данном сочетании слово обозначает превосходное, особо ценное качество; «отборное серебро» естественно по-русски и не требует уточнять, идёт ли речь именно об очищении металла.
- source_word: לְשׁוֹן
  choice: язык
  rationale: Сохранён телесный образ оригинала, метонимически обозначающий речь; по-русски он понятен и поддерживает конкретность афоризма.
- source_word: צַדִּיק
  choice: праведника
  rationale: Субстантивированное прилагательное в единственном числе передано родительным падежом после «язык»; оно обозначает праведного человека как тип, не вводя отсутствующего в оригинале указания на пол.
- source_word: לֵב
  choice: сердце
  rationale: Сохранён традиционный и понятный образ внутреннего мира, включающий мысли, намерения и нравственный характер.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Множественное субстантивированное прилагательное передано как собирательное обозначение людей, нравственно противопоставленных праведнику.
- source_word: כִּמְעָט
  choice: немногого стоит
  rationale: Краткое еврейское выражение указывает на малую ценность или почти полную ничтожность. Русская идиома естественно продолжает заданное серебром сопоставление ценности, а неоднозначность отмечена в сноске.
