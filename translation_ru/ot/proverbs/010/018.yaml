source:
  edition: WLC
  text: מְכַסֶּ֣ה שִׂ֭נְאָה שִׂפְתֵי שָׁ֑קֶר וּ/מוֹצִ֥א דִ֝בָּ֗ה ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/018.yaml
  text: Lying lips conceal hatred[b][a], and whoever spreads slander is a fool.
translation:
  language: ru
  text: Кто скрывает ненависть, у того лживые уста[a], а кто распространяет клевету[b], тот глупец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Лживые уста скрывают ненависть». Еврейскую конструкцию можно понять и так, что «уста лжи» выступают подлежащим.'
    reason: syntactic_alternative
  - marker: b
    text: 'Или: «распускает дурную молву». Еврейское выражение может обозначать распространение порочащего сообщения в более широком смысле, не только собственно клевету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: скрывает
  rationale: Причастие от כסה означает «покрывать, скрывать». В данном контексте речь идёт о сокрытии внутренней ненависти за лживой речью.
- source_word: שִׂנְאָה
  choice: ненависть
  rationale: Существительное обозначает ненависть или вражду; «ненависть» естественно и точно передаёт абстрактное понятие.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: лживые уста
  rationale: Буквально «уста лжи». Формулировка сохраняет телесный образ речи и соответствует возвышенному, но понятному регистру книги Притчей.
- source_word: וּ/מוֹצִא
  choice: а кто распространяет
  rationale: Hiphil-причастие от יצא буквально означает «выносить, выводить наружу»; в сочетании с דבה речь идёт о предании вредного сообщения огласке и его распространении.
- source_word: דִבָּה
  choice: клевету
  rationale: Слово обозначает дурную, порочащую молву или сообщение. «Клевета» ёмко передаёт вредоносный характер речи, а более широкое значение отмечено в сноске.
- source_word: הוּא כְסִיל
  choice: тот глупец
  rationale: כְּסִיל — устойчивое понятие литературы мудрости для нравственно неразумного человека. Именная формула «тот глупец» сохраняет категоричность еврейской пословицы.
theological_decisions:
- issue: Синтаксис первой половины стиха
  choice: «Кто скрывает ненависть, у того лживые уста»
  alternative: «Лживые уста скрывают ненависть»
  rationale: Единственное число мужского рода причастия מְכַסֶּה естественнее понимать как отдельного человеческого субъекта («кто скрывает»), а שִׂפְתֵי שָׁקֶר — как именную характеристику без выраженной связки. Альтернативное понимание возможно и сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного для библейской поэзии слова «уста». Параллелизм передан симметричными конструкциями «кто… у того… / а кто… тот…»; формулировка краткая, афористичная и доступная.
