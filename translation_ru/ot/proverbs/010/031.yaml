lexical_decisions:
- source_word: פִּי
  choice: уста
  rationale: Сохраняется конкретный образ органа речи и возвышенный, но понятный параллелизм с «языком».
- source_word: צַדִּיק
  choice: праведника
  rationale: Единственное число передаёт типичного представителя нравственной категории, как в еврейском тексте.
- source_word: יָנוּב
  choice: приносят плод
  rationale: Глагол вызывает образ произрастания и плодоношения; этот органический образ сохранён естественным русским выражением.
- source_word: חָכְמָה
  choice: мудрости
  rationale: Передан непосредственно абстрактный объект «мудрость», без пояснительного расширения до «мудрых речей».
- source_word: לְשׁוֹן
  choice: язык
  rationale: Сохраняется обычная метонимия речи и антитеза с «устами».
- source_word: תַּהְפֻּכוֹת
  choice: извращённой речи
  rationale: Еврейское множественное число обозначает кривое, превратное содержание или повторяющиеся проявления речи; по-русски это естественно передано определением к подразумеваемой речи.
- source_word: תִּכָּרֵת
  choice: будет отсечён
  rationale: Сохранены пассивная форма и суровый образ глагола כרת без уточнения, означает ли это заглушение, удаление или гибель.
