source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים פִּ֣י צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/011.yaml
  text: The mouth of the righteous is a fountain of life[a], but the mouth of the wicked conceals violence.
translation:
  language: ru
  text: Уста праведника — источник жизни, а уста нечестивых скрывают насилие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрывают насилие». Еврейский глагол может означать как буквальное «покрывать», так и переносное «скрывать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר חַיִּים
  choice: источник жизни
  rationale: מְקוֹר обозначает родник или источник текущей воды; сочетание «источник жизни» естественно по-русски и сохраняет образ животворной речи. Форма חַיִּים здесь имеет обычное собирательно-абстрактное значение «жизнь».
- source_word: פִּי צַדִּיק
  choice: уста праведника
  rationale: 'Буквально: «уста праведного». «Уста» сохраняют конкретный поэтический образ речи, а «праведника» передаёт единичную форму с обобщающим значением без указания пола.'
- source_word: וּפִי רְשָׁעִים
  choice: а уста нечестивых
  rationale: Союз ו формально означает «и», но параллелизм выражает противопоставление, поэтому выбрано «а». רְשָׁעִים стоит во множественном числе; русский оборот «уста нечестивых» естественно сохраняет эту форму.
- source_word: יְכַסֶּה
  choice: скрывают
  rationale: Глагол может означать «покрывать» либо в переносном смысле «скрывать». По смыслу данного противопоставления «скрывают» ясно передаёт вероятное значение, тогда как буквальная возможность отмечена в сноске. В русском числе сказуемое согласовано с грамматически множественным словом «уста».
- source_word: חָמָס
  choice: насилие
  rationale: Слово обозначает насилие, жестокость или насильственное беззаконие. «Насилие» — точный и лаконичный русский эквивалент.
theological_decisions:
- issue: Характер связи между устами нечестивых и насилием
  choice: Уста нечестивых скрывают насилие
  alternative: Уста нечестивых покрывают насилие
  rationale: Перевод не уточняет, скрывают ли нечестивые собственные насильственные намерения, оправдывают ли чужое насилие или иным образом маскируют его. Тем самым сохраняется смысловая ёмкость еврейского выражения без внесения дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем притчи. «Уста» выбраны как понятное возвышенно-поэтическое слово, сохраняющее образ оригинала; остальная лексика нейтральна и общедоступна.
