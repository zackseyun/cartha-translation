source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה תּוֹסִ֣יף יָמִ֑ים וּ/שְׁנ֖וֹת רְשָׁעִ֣ים תִּקְצֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/027.yaml
  text: The fear of Yahweh adds days[a], but the years of the wicked will be cut short.
translation:
  language: ru
  text: Страх перед Яхве прибавляет дни[a], а годы нечестивых сократятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продлевает дни». Еврейский глагол буквально означает «прибавляет», а его дополнение — «дни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: страх перед
  rationale: Сохраняет сильную и привычную для библейской мудрости формулировку, обозначающую благоговейный страх перед Богом, не сводя её лишь к уважению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: תּוֹסִיף
  choice: прибавляет
  rationale: Буквально передаёт каузативную форму глагола יסף — «добавлять, прибавлять» — при прямом дополнении «дни».
- source_word: יָמִים
  choice: дни
  rationale: Сохраняет конкретный образ оригинала и поэтический параллелизм со словом «годы» во второй строке.
- source_word: וּ/שְׁנוֹת
  choice: а годы
  rationale: Союз «а» естественно выражает контраст между двумя частями изречения, не усиливая его сверх необходимого.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Традиционное и понятное обозначение нравственно порочных людей в литературе мудрости; родительный падеж естественно зависит от слова «годы».
- source_word: תִּקְצֹרְנָה
  choice: сократятся
  rationale: 'Форма согласуется с «годами» и выражает результат: годы станут короче. Русское «сократятся» естественно и не требует внесения явно названного деятеля.'
theological_decisions:
- issue: Характер утверждения о долголетии
  choice: Сохранить прямую форму общего принципа мудрости, не добавляя оговорок в основной текст.
  alternative: Передать как безусловную гарантию долгой жизни каждому боящемуся Бога и ранней смерти каждому нечестивому.
  rationale: Пословица формулирует общий нравственный порядок предельно кратко. Перевод сохраняет её категоричную поэтическую форму, но не вносит толкование о механическом и не допускающем исключений обещании.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. «Страх перед Яхве» сохраняет богословскую весомость древнееврейского выражения; «прибавляет дни» удерживает конкретную образность оригинала, хотя по-русски менее обычно, чем истолковывающее «продлевает жизнь».
