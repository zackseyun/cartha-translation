  text: בְּ֭רָכוֹת לְ/רֹ֣אשׁ צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/006.yaml
  text: Blessings are on the head of the righteous, but the mouth of the wicked covers violence.
translation:
  language: ru
  text: 'Благословения — на голове праведника,

    а уста нечестивых прикрывают насилие.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а насилие покрывает уста нечестивых». Еврейский текст допускает оба разбора.'
    reason: Сохраняет подлинную синтаксическую неоднозначность выражения וּפִי רְשָׁעִים יְכַסֶּה חָמָס.
lexical_decisions:
- source_word: בְּרָכוֹת
  choice: Благословения
  rationale: Множественное число оригинала сохранено; слово обозначает благие дары или благосклонность, нисходящие на праведника.
- source_word: לְרֹאשׁ
  choice: на голове
  rationale: Буквальный образ оригинала естественен по-русски и может подразумевать благословение, возлагаемое на человека.
- source_word: צַדִּיק
  choice: праведника
  rationale: Передаёт нравственно-религиозное значение צַדִּיק без добавления конфессиональной трактовки.
- source_word: וּפִי רְשָׁעִים
  choice: а уста нечестивых
  rationale: «Уста» сохраняют возвышенный поэтический регистр; רְשָׁעִים передано множественным числом «нечестивых».
- source_word: יְכַסֶּה חָמָס
  choice: прикрывают насилие
  rationale: «Прикрывают» сохраняет образ покрытия и в данном контексте допускает смысл сокрытия; חָמָס означает насилие, жестокость или причиняемое зло.
theological_decisions:
- issue: Синтаксическая неоднозначность второй строки
  choice: «уста нечестивых прикрывают насилие»
  alternative: «насилие покрывает уста нечестивых»
  rationale: Еврейская форма допускает понимание «уста» как подлежащего, согласованное с предоставленным консультационным текстом, однако из-за обычного порядка слов возможен и разбор, при котором «насилие» является подлежащим. Альтернатива сохранена в примечании, а не устранена.
translation_notes:
  register: Современный литературный русский с кратким, афористичным построением и сохранением поэтического слова «уста». Тире передаёт безглагольную конструкцию первой строки; строкоделение отражает параллелизм еврейской пословицы.
