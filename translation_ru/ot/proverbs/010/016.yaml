  edition: WLC
  text: פְּעֻלַּ֣ת צַדִּ֣יק לְ/חַיִּ֑ים תְּבוּאַ֖ת רָשָׁ֣ע לְ/חַטָּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/016.yaml
  text: The labor of the righteous leads to life[c][b][a]; the produce of the wicked leads to sin.
translation:
  language: ru
  text: Труд праведного ведёт к жизни[a], а доход нечестивого — ко греху[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предназначен для жизни»; еврейский предлог может указывать как на цель, так и на результат.'
    reason: lexical_alternative
  - marker: b
    text: 'Также можно перевести: «урожай» или «плод» нечестивого; речь о том, что приносит его деятельность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעֻלַּת
  choice: труд
  rationale: Слово может обозначать работу, действие или плод и вознаграждение труда. «Труд» сохраняет широту значения и естественно противопоставляется тому, что получает нечестивый.
- source_word: צַדִּיק
  choice: праведного
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного представителя; русский родительный падеж естественно передаёт конструкцию принадлежности.
- source_word: לְחַיִּים
  choice: ведёт к жизни
  rationale: Предлог לְ допускает значение цели или результата. Формулировка «ведёт к жизни» ясно передаёт направленность, не устраняя полностью смысловую связь цели и следствия.
- source_word: תְּבוּאַת
  choice: доход
  rationale: תְּבוּאָה означает урожай, произведённый продукт или поступление. В данном не обязательно земледельческом контексте «доход» естественно обозначает то, что нечестивый получает от своей деятельности.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное в единственном числе образует прямую антитезу слову «праведного» и сохраняет характерную для Притч нравственную категорию.
- source_word: לְחַטָּאת
  choice: ко греху
  rationale: В контексте изречения חַטָּאת обозначает грех, а предлог לְ — направленность или результат. Эллиптическая конструкция во второй части естественно подразумевает повтор глагола «ведёт».
theological_decisions:
- issue: Значение חַטָּאת
  choice: грех
  alternative: жертва за грех
  rationale: Хотя в культовых контекстах חַטָּאת может означать жертву за грех, здесь нравственная антитеза жизни и греха и отсутствие жертвенного контекста требуют значения «грех».
translation_notes:
  register: Современный литературный русский язык, краткий и афористичный строй. Сохранены параллелизм и антитеза исходного текста; во второй части опущенный глагол естественно восстанавливается из первой.
