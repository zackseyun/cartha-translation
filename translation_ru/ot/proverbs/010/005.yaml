  text: אֹגֵ֣ר בַּ֭/קַּיִץ בֵּ֣ן מַשְׂכִּ֑יל נִרְדָּ֥ם בַּ֝/קָּצִ֗יר בֵּ֣ן מֵבִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/005.yaml
  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
translation:
  language: ru
  text: Кто собирает летом, тот благоразумный сын[a], а кто спит во время жатвы, тот сын, приносящий стыд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрый сын».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹגֵר
  choice: собирающий
  rationale: Причастие обозначает сбор урожая или припасов; «собирающий» прямо передаёт действие и сохраняет сельскохозяйственный параллелизм.
- source_word: בַּקַּיִץ
  choice: летом
  rationale: Кратко и естественно обозначает надлежащий сезон для сбора; контекст не требует уточнять, что именно собирают.
- source_word: בֵּן
  choice: сын
  rationale: Еврейское слово стоит в мужском роде и единственном числе; перевод сохраняет характерную для Притч форму наставления отца сыну.
- source_word: מַשְׂכִּיל
  choice: благоразумный
  rationale: Слово выражает практическую рассудительность, проявляющуюся в своевременном поступке; «благоразумный» точнее здесь, чем более широкое «мудрый».
- source_word: נִרְדָּם
  choice: спящий
  rationale: Причастная форма описывает человека, который спит тогда, когда нужно трудиться; причастие также сохраняет симметрию двух половин стиха.
- source_word: בַּקָּצִיר
  choice: во время жатвы
  rationale: Ясно обозначает решающий период сельскохозяйственных работ и естественно звучит по-русски.
- source_word: מֵבִישׁ
  choice: приносящий стыд
  rationale: 'Причастие породы хифиль имеет причинительный оттенок: такой сын навлекает стыд, а не только сам является постыдным.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткой антитетической структуры еврейской пословицы. Повтор слова «сын» оставлен ради формального параллелизма и отцовско-сыновней рамки книги. Мужской род не нейтрализован. Тире перед именными характеристиками подчёркивает афористический ритм.
