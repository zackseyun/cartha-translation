  text: שִׂ֭נְאָה תְּעוֹרֵ֣ר מְדָנִ֑ים וְ/עַ֥ל כָּל פְּ֝שָׁעִ֗ים תְּכַסֶּ֥ה אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/012.yaml
  text: Hatred stirs up conflicts[b][a], but love covers all transgressions.
translation:
  language: ru
  text: Ненависть разжигает распри[a], а любовь покрывает все проступки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздоры».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «покрывает все проступки». Образ указывает на то, что любовь не выставляет обиды напоказ и не даёт им порождать новые распри; это не означает, что следует скрывать несправедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂנְאָה
  choice: ненависть
  rationale: Абстрактное существительное в роли подлежащего; прямой и естественный эквивалент, сохраняющий противопоставление любви.
- source_word: תְּעוֹרֵר
  choice: разжигает
  rationale: Форма Polel передаёт побуждение или усиление действия. «Разжигает» естественно сочетается с «распрями» и выражает активное возбуждение раздоров.
- source_word: מְדָנִים
  choice: распри
  rationale: Слово обозначает споры, раздоры и столкновения. «Распри» кратко, литературно и уместно для афористической поэзии.
- source_word: וְ/עַל
  choice: а
  rationale: Буквально сочетание включает союз и предлог «и/над», однако параллелизм здесь противопоставительный. Союз «а» естественно передаёт этот контраст, не усиливая его до более резкого «но».
- source_word: כָּל
  choice: все
  rationale: Прямой эквивалент квантификатора при существительном во множественном числе.
- source_word: פְּשָׁעִים
  choice: проступки
  rationale: פשׁע может обозначать нарушения, мятежные действия или нанесённые обиды. «Проступки» сохраняет нравственный вес и подходит к межличностному контексту, не сужая смысл до юридических преступлений.
- source_word: תְּכַסֶּה
  choice: покрывает
  rationale: Сохраняется буквальный образ глагола כסה. Более истолковывающие варианты вроде «прощает» или «не замечает» преждевременно разрешили бы смысловую напряжённость.
- source_word: אַהֲבָה
  choice: любовь
  rationale: Прямой современный эквивалент абстрактного существительного, сохраняющий центральное этическое противопоставление стиха.
theological_decisions:
- issue: Смысл выражения «любовь покрывает все проступки»
  choice: 'Сохранён образ покрытия: любовь не раздувает, не выставляет напоказ и не увековечивает нанесённые обиды.'
  alternative: Передать как «любовь прощает все грехи» или как безусловное сокрытие любого злодеяния.
  rationale: В еврейском тексте употреблён глагол «покрывать», а не прямое обозначение прощения. Сохранение метафоры не превращает пословицу ни в узкое догматическое утверждение об искуплении, ни в призыв скрывать несправедливость.
translation_notes:
  register: Современный литературный русский язык; краткий афористический строй и параллелизм исходной пословицы сохранены. «Распри» придаёт строке достоинство, оставаясь понятным современному читателю.
