  yaml_path: translation/ot/proverbs/010/019.yaml
  text: When words are many[a], transgression does not cease[b], but whoever restrains his lips is prudent.
translation:
  language: ru
  text: При множестве слов не избежать греха[a], а кто сдерживает уста, тот благоразумен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «При множестве слов проступок не прекращается»; еврейское слово может означать также «нарушение» или «преступление».'
    reason: Передаёт более буквальный синтаксический вариант и диапазон слова פָּשַׁע, не меняя основного афористичного перевода.
lexical_decisions:
- source_word: בְּרֹב דְּבָרִים
  choice: при многословии
  rationale: Сочетание предлога בְּ, существительного רֹב («множество, обилие») и דְּבָרִים («слова») описывает обстоятельство обильной речи. «При многословии» кратко и естественно передаёт эту мысль по-русски.
- source_word: לֹא יֶחְדַּל
  choice: не иссякает
  rationale: Глагол חדל означает «прекращаться, переставать»; с отрицанием говорится, что грех не прекращается или не бывает в недостатке. «Не иссякает» сохраняет образ непрерывности и афористичность.
- source_word: פָּשַׁע
  choice: грех
  rationale: פֶּשַׁע обозначает проступок, преступление или мятежное нарушение. В данном предостережении о речи «грех» ясно передаёт нравственный смысл, не придавая фразе исключительно юридического оттенка.
- source_word: וְחֹשֵׂךְ
  choice: а кто сдерживает
  rationale: Причастие от חשׂך означает «удерживать, сдерживать». Союз וְ передан противительным «а», поскольку вторая строка противопоставлена первой.
- source_word: שְׂפָתָיו
  choice: свои уста
  rationale: Сохранён еврейский образ уст как органа речи. Возвратное «свои» естественно соотносится по-русски с неопределённо-личным «кто».
- source_word: מַשְׂכִּיל
  choice: благоразумен
  rationale: Причастие породы Hiphil от שׂכל выражает разумное, осмотрительное поведение. «Благоразумен» подходит к этическому и поэтическому регистру притчи.
