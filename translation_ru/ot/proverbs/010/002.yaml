id: PRO.10.2
reference: Proverbs 10:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹא י֭וֹעִילוּ אוֹצְר֣וֹת רֶ֑שַׁע וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/002.yaml
  text: Treasures of wickedness do not profit[b][a], but righteousness delivers from death.
translation:
  language: ru
  text: Сокровища, нажитые неправедно,[a] не приносят пользы, а праведность[b] избавляет от смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «сокровища нечестия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹצְרוֹת רֶשַׁע
  choice: сокровища, нажитые неправедно
  rationale: Сочетание буквально означает «сокровища нечестия». Выбранный вариант естественно передаёт наиболее вероятный смысл — богатство, приобретённое неправедным путём, а буквальная конструкция сохранена в примечании.
- source_word: יועילו
  choice: не приносят пользы
  rationale: Порода hifil глагола יעל выражает полезность или выгоду. Русское сочетание ясно и естественно передаёт отрицание практической пользы.
- source_word: וּצְדָקָה
  choice: а праведность
  rationale: Союз ו в антитетическом параллелизме передан противительным «а». «Праведность» сохраняет широкий нравственный смысл צְדָקָה; возможное значение «справедливость» отмечено в сноске.
- source_word: תציל
  choice: избавляет
  rationale: Hifil от נצל означает вырывать из опасности, спасать, избавлять. «Избавляет» звучит достойно и не сужает смысл до одной конкретной формы спасения.
- source_word: ממות
  choice: от смерти
  rationale: Прямой перевод сохраняет как буквальный смысл смерти, так и более широкую применимость изречения к смертельной опасности.
theological_decisions:
- issue: Значение צְדָקָה
  choice: праведность
  alternative: справедливость
  rationale: В контексте литературы мудрости слово прежде всего обозначает нравственно верную жизнь, противопоставленную неправедно приобретённому богатству. При этом судебно-социальный оттенок «справедливости» остаётся возможным и вынесен в примечание.
- issue: Характер избавления «от смерти»
  choice: сохранена широкая формулировка без уточнения механизма или вида избавления
  alternative: избавляет от смертельной опасности
  rationale: Еврейский текст говорит просто «от смерти» и допускает как непосредственный жизненный, так и более широкий богословский смысл; перевод не разрешает эту напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык; краткая, уравновешенная форма сохраняет антитетический параллелизм еврейской пословицы. Лексика понятна широкому кругу читателей и не привносит конфессиональных уточнений.
