  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
translation:
  language: ru
  text: Уста праведного знают, что приемлемо[a], а рот нечестивых говорит превратное[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что приятно», «что угодно» или «благоволение». Еврейское слово может означать благоволение, добрую волю или то, что приятно, приемлемо и уместно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а рот нечестивых — превратности» или «превратное»; глагол «говорит» добавлен в русском переводе для ясности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי צַדִּיק
  choice: уста праведного
  rationale: Сохраняет конкретный поэтический образ и родительный оборот; единственное число в еврейском тексте имеет обобщающий смысл.
- source_word: יֵדְעוּן
  choice: знают
  rationale: Передаёт обычное значение глагола ידע и сохраняет подразумеваемую, но не разъяснённую в тексте способность различать подобающую речь.
- source_word: רָצוֹן
  choice: что угодно
  rationale: В данном речевом контексте обозначает то, что приятно, приемлемо или уместно; формулировка сохраняет широту значения и не ограничивает его исключительно Божьим благоволением.
- source_word: וּפִי רְשָׁעִים
  choice: а уста нечестивых
  rationale: Союз передан как противопоставление; «уста» создаёт естественный русский параллелизм с первой строкой, хотя в оригинале употреблено другое слово — «рот».
- source_word: תַּהְפֻּכוֹת
  choice: извращённое
  rationale: Субстантивированное прилагательное передаёт речь, которая искажена и нравственно превратна, не добавляя отсутствующего в еврейском тексте глагола.
