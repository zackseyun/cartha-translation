  text: הוֹלֵ֣ךְ בַּ֭/תֹּם יֵ֣לֶךְ בֶּ֑טַח וּ/מְעַקֵּ֥שׁ דְּ֝רָכָ֗י/ו יִוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/009.yaml
  text: Whoever walks in integrity walks securely[a], but he who makes his ways crooked will be found out.
translation:
  language: ru
  text: Кто живёт честно, тот живёт в безопасности, а кто делает свои пути кривыми, будет разоблачён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станет известен» или «будет узнан». Еврейское слово может означать как то, что человека распознают таким, каков он есть, так и то, что его поступки будут раскрыты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ ... יֵלֶךְ
  choice: живёт ... живёт
  rationale: Двойное «живёт» естественно передаёт в современном русском языке еврейскую метафору хождения как образа жизни и сохраняет повтор глагола.
- source_word: בַּתֹּם
  choice: в непорочности
  rationale: Слово תֹּם обозначает нравственную цельность, честность и безупречность; «в непорочности» сохраняет отвлечённое существительное и возвышенный, но понятный регистр.
- source_word: בֶּטַח
  choice: в безопасности
  rationale: Передаёт прежде всего объективную защищённость, не сводя значение к субъективной уверенности или отсутствию тревоги.
- source_word: וּמְעַקֵּשׁ
  choice: а кто искривляет
  rationale: Причастие от עקשׁ обозначает того, кто делает кривым или извращает; глагольная конструкция сохраняет явный объект действия — «свои пути».
- source_word: דְּרָכָיו
  choice: свои пути
  rationale: Множественное число и образ путей сохранены как метафора поведения и жизненного уклада.
- source_word: יִוָּדֵעַ
  choice: будет разоблачён
  rationale: Нифаль от ידע может означать «станет известен», «будет узнан» или в данном противопоставлении «будет разоблачён». Основной вариант ясно выражает мысль о том, что кривизна путей не останется скрытой, а неоднозначность отмечена в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией притчи. Выражение «живёт в непорочности» понятно без конфессионально-специальной терминологии; повтор «живёт» передаёт параллелизм оригинала. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая неоднозначность.
