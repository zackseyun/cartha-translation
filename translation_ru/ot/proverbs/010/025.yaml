  text: כַּ/עֲב֣וֹר ס֭וּפָה וְ/אֵ֣ין רָשָׁ֑ע וְ֝/צַדִּ֗יק יְס֣וֹד עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/025.yaml
  text: When the storm passes[a], the wicked are no more[b], but the righteous are an everlasting foundation.
translation:
  language: ru
  text: Когда пронесётся буря[a], нечестивого не станет[b], а праведник — вечное основание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда пронесётся вихрь»; возможен также смысл: «При прохождении бури».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и нет нечестивого». По смыслу он исчезает или погибает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעֲבוֹר
  choice: Когда пронесётся
  rationale: Предлог כ с инфинитивом עבר здесь естественно передаёт временное значение. Русская конструкция «когда пронесётся» сохраняет динамичный образ и хорошо сочетается с бурей.
- source_word: סוּפָה
  choice: буря
  rationale: Слово обозначает сильную бурю, вихрь или ураган. «Буря» — ясный современный эквивалент, сохраняющий образ разрушительной стихии без чрезмерного уточнения.
- source_word: וְאֵין
  choice: не станет
  rationale: Буквальная конструкция «и нет» в данном контексте указывает на исчезновение нечестивого после бури. «Не станет» естественно выражает этот результат, не уточняя сверх текста, идёт ли речь о гибели или исчезновении.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Единственное число имеет обобщающий, типичный для притч смысл. Русское единственное число сохраняет форму оригинала и обозначает всякого нечестивого как нравственный тип.
- source_word: וְצַדִּיק
  choice: а праведник
  rationale: Союз ו в параллельной антитезе уместно передан противительным «а». Обобщающее единственное число оригинала сохранено.
- source_word: יְסוֹד
  choice: основание
  rationale: Прямое значение — основание или фундамент. Перевод не добавляет определения «твёрдое», поскольку долговечность уже выражена следующим словом.
- source_word: עוֹלָם
  choice: вечное
  rationale: В сочетании с «основанием» слово выражает длительность и незыблемость. «Вечное основание» естественно по-русски и сохраняет сильное значение продолжительности.
theological_decisions:
- issue: Обобщающее мужское единственное число в литературе мудрости
  choice: Сохранить формы единственного числа «нечестивого» и «праведник» как обозначения нравственных типов.
  alternative: 'Передать во множественном числе или собирательно: «нечестивые… праведные».'
  rationale: В еврейском тексте оба слова стоят в единственном числе и имеют общеобобщающий смысл, не ограниченный одним конкретным мужчиной. Русский язык позволяет сохранить эту форму без сужения смысла.
- issue: Праведник как основание
  choice: 'Сохранить прямое утверждение: «праведник — вечное основание».'
  alternative: Истолковать как «у праведника вечное основание» или «праведник стоит на вечном основании».
  rationale: Грамматика текста прямо отождествляет праведника с основанием. Изменение отношения на обладание основанием внесло бы отсутствующее в оригинале богословское истолкование.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранены образ бури, резкая антитеза и именная метафора заключительной строки.
