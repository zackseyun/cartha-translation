  text: חֲכָמִ֥ים יִצְפְּנוּ דָ֑עַת וּ/פִֽי אֱ֝וִיל מְחִתָּ֥ה קְרֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/014.yaml
  text: Wise men store up knowledge[c][b][a], but the mouth of a fool is near ruin.
translation:
  language: ru
  text: Мудрые хранят знание[a], а уста глупца — близкая гибель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бережно хранят знание», «запасают знание».'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «гибель», может также означать «разрушение», «бедствие» или «ужас».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכָמִים
  choice: Мудрые
  rationale: Субстантивированное прилагательное во множественном числе обозначает мудрых людей вообще; форма «мудрые» естественна для русского изречения и не сужает общий смысл до одних мужчин.
- source_word: יִצְפְּנוּ
  choice: копят
  rationale: Глагол צפן может означать «прятать, хранить, запасать». В данном контексте речь идёт о бережном накоплении знания; «копят» кратко и естественно передаёт эту метафору.
- source_word: דָעַת
  choice: знание
  rationale: Обычное значение существительного דעת в Книге Притчей; сохраняет прямой контраст между накопленным знанием и пагубной речью глупца.
- source_word: וּפִי
  choice: а уста
  rationale: Союз ו формально может значить «и», но параллелизм противопоставляет мудрых глупцу, поэтому русское «а» естественно выражает контраст, не усиливая его сверх исходного текста.
- source_word: אֱוִיל
  choice: глупца
  rationale: Обозначает нравственно и рассудочно несмышлёного, упрямого человека; традиционное и понятное «глупец» соответствует стилю литературы мудрости.
- source_word: מְחִתָּה
  choice: погибель
  rationale: Слово допускает значения «разрушение, бедствие, ужас». В сочетании с «близкая» здесь вероятнее грозящее губительное бедствие; «погибель» сохраняет краткость и образность.
- source_word: קְרֹבָה
  choice: близкая
  rationale: Женская форма предикативного прилагательного согласуется с מְחִתָּה и буквально передаёт близость или неотвратимую угрозу, не уточняя времени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Уста» выбраны вместо разговорного «рот», поскольку обозначают орган речи и поддерживают достоинство библейской поэзии. Именная конструкция второго полустишия сохраняет лаконичность и неоднозначность еврейского текста.
