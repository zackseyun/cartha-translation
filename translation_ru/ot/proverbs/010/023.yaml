  text: כִּ/שְׂח֣וֹק לִ֭/כְסִיל עֲשׂ֣וֹת זִמָּ֑ה וְ֝/חָכְמָ֗ה לְ/אִ֣ישׁ תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/023.yaml
  text: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
translation:
  language: ru
  text: Творить зло для глупца — словно забава[a], а мудрость — для человека разумного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Замышлять злое для глупца — развлечение». Еврейское слово, переведённое как «зло», может также указывать на злой умысел либо на бесстыдный, возмутительный поступок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂחוֹק
  choice: словно забава
  rationale: Предлог כְּ выражает сравнение, а שְׂחוֹק может означать смех, забаву или развлечение. «Словно забава» естественно передаёт мысль о том, что глупец относится ко злу как к занятной игре.
- source_word: לִכְסִיל
  choice: для глупца
  rationale: 'Предлог לְ здесь указывает на отношение или точку зрения: именно глупцу такое поведение кажется забавой.'
- source_word: עֲשׂוֹת
  choice: творить
  rationale: Инфинитив выступает как смысловой субъект первой части стиха. «Творить» сохраняет сжатость и возвышенную, но понятную форму мудрого изречения.
- source_word: זִמָּה
  choice: зло
  rationale: Слово может обозначать злой умысел, бесстыдный или возмутительный поступок и в некоторых контекстах разврат. Здесь общее «зло» сохраняет нравственную тяжесть слова, не сужая его значения.
- source_word: וְחָכְמָה
  choice: а мудрость
  rationale: Хотя וְ буквально означает «и», параллелизм противопоставляет глупца разумному человеку, поэтому по-русски естественно противительное «а».
- source_word: לְאִישׁ תְּבוּנָה
  choice: для человека разумного
  rationale: 'Буквально: «для человека разумения». Вторая часть не имеет выраженного сказуемого; формулировка «для человека разумного» сохраняет эту лаконичность и не уточняет без достаточного основания, является ли мудрость его достоянием, занятием или радостью.'
theological_decisions:
- issue: Представительное мужское обозначение אִישׁ
  choice: человека разумного
  alternative: разумного человека; того, кто разумен
  rationale: Существительное אִישׁ имеет мужскую форму и в изречении представляет человека вообще. Русское «человек» грамматически мужского рода, соответствует форме источника и при этом естественно передаёт общее применение пословицы.
- issue: Неявная связь между «мудростью» и «человеком разумным»
  choice: сохранить именную конструкцию без добавленного сказуемого
  alternative: мудрость радует человека разумного; мудрость принадлежит человеку разумному
  rationale: В еврейском тексте сказуемое во второй части опущено. Добавление «радует» усилило бы симметрию с первой частью, но сняло бы подлинную смысловую открытость текста.
translation_notes:
  register: Современный литературный русский язык с лаконичным ритмом изречения. «Творить зло» звучит достойно и понятно, а тире сохраняют сжатую структуру параллелизма. Подлинная эллиптичность второй части не устранена толковательным добавлением.
