  text: מָע֣וֹז לַ֭/תֹּם דֶּ֣רֶךְ יְהוָ֑ה וּ֝/מְחִתָּ֗ה לְ/פֹ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/029.yaml
  text: The way of Yahweh is a stronghold for the blameless[b][a], but destruction for those who do evil.
translation:
  language: ru
  text: Путь Яхве[a] — крепость для непорочного, но гибель[b] для творящих зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «путь, указанный Яхве». Еврейское выражение может обозначать как образ действий самого Яхве, так и путь, который Он открывает людям.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разрушение» или «ужас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: крепость
  rationale: Сохраняет конкретный образ защищённого места и источника безопасности; по-русски естественно сочетается с указанием на тех, для кого она служит защитой.
- source_word: לַתֹּם
  choice: для непорочных
  rationale: תֹּם обозначает цельность, нравственную непорочность. Личное множественное число ясно противопоставляет эту группу «творящим зло», не сводя значение к абстрактному качеству.
- source_word: דֶּרֶךְ יְהוָה
  choice: Путь Яхве
  rationale: Близкая к форме оригинала передача сохраняет возможность понимать выражение и как образ действий Яхве, и как путь, который Он указывает людям.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: וּמְחִתָּה
  choice: но гибель
  rationale: מְחִתָּה может означать гибель, разрушение или ужас. «Гибель» естественно выражает резкую антитезу крепости; союз ו передан противительным «но».
- source_word: לְפֹעֲלֵי אָוֶן
  choice: для творящих зло
  rationale: Передаёт деятельный смысл причастия פֹעֲלֵי и нравственное значение אָוֶן современным, но возвышенным русским языком.
theological_decisions:
- issue: Смысловой объём выражения «Путь Яхве»
  choice: Сохранить широкую формулировку, не уточняя, идёт ли речь об образе действий Яхве или о предписанном Им людям пути.
  alternative: «то, как действует Яхве»; «путь, указанный Яхве»
  rationale: Еврейское сочетание допускает обе смысловые стороны; их явное разграничение сузило бы намеренную ёмкость изречения.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Слова «крепость», «непорочные» и «творящие зло» сохраняют достоинство поэтической речи, оставаясь понятными широкому читателю.
