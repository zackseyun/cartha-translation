  yaml_path: translation/ot/proverbs/010/021.yaml
  text: The lips of the righteous feed many[b][a], but fools die for lack of sense.
translation:
  language: ru
  text: Уста праведника питают многих[a], а глупцы умирают от недостатка разумения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кормят многих»; еврейский глагол может также означать «пасти» или «выводить на пастбище».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-за недостатка сердца»; в древнееврейском языке сердце нередко обозначает также понимание и способность здраво судить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי צַדִּיק
  choice: уста праведника
  rationale: Сочетание буквально означает «уста праведника». «Уста» сохраняет еврейский образ речи и уместно в возвышенном, но понятном русском регистре; единственное число «праведника» передаёт собирательный характер исходного выражения.
- source_word: יִרְעוּ
  choice: питают
  rationale: Глагол רעה означает «пасти, кормить, давать пищу». При подлежащем «уста» речь метафорически представлена как пища для других; «питают» естественно сохраняет этот образ, не сводя его только к наставлению.
- source_word: רַבִּים
  choice: многих
  rationale: Передаёт субстантивированное «многие» без ненужного добавления слова «люди».
- source_word: אֱוִילִים
  choice: глупцы
  rationale: Обычный термин литературы мудрости для нравственно и рассудочно несостоятельных, упрямых людей; «глупцы» сохраняет его прямоту.
- source_word: בַּחֲסַר לֵב
  choice: от недостатка разумения
  rationale: Буквально «при/из-за недостатка сердца». В древнееврейском «сердце» включает способность понимать и здраво судить. «Недостаток разумения» ясно передаёт идиоматический смысл, а буквальный образ отмечен в сноске.
- source_word: יָמוּתוּ
  choice: умирают
  rationale: Сохранено прямое значение «умирать». Настоящее время естественно выражает общее правило в русской пословичной речи и не заменяет смерть более расплывчатым «гибнут» или «терпят крах».
