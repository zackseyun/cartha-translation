  text: אֹ֣רַח לְ֭/חַיִּים שׁוֹמֵ֣ר מוּסָ֑ר וְ/עוֹזֵ֖ב תּוֹכַ֣חַת מַתְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/017.yaml
  text: Whoever keeps discipline is on the path to life[a], but whoever forsakes reproof leads others astray.
translation:
  language: ru
  text: Кто следует наставлению, тот на пути к жизни[a], а кто отвергает обличение, тот сбивает других с пути.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто следует наставлению, тот — путь к жизни»; краткая еврейская конструкция допускает и такое, более буквальное предикативное прочтение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: путь
  rationale: Слово обозначает дорогу, путь или образ жизни; «путь» естественно сохраняет нравственную метафору Книги Притчей.
- source_word: לְחַיִּים
  choice: к жизни
  rationale: Предлог לְ здесь естественно передаёт направление или результат; выражение «путь к жизни» ясно и близко к еврейскому тексту.
- source_word: שׁוֹמֵר
  choice: следует
  rationale: Причастие выражает постоянное соблюдение или хранение. В сочетании с «наставлением» глагол «следует» звучит естественно и передаёт устойчивую приверженность ему.
- source_word: מוּסָר
  choice: наставление
  rationale: В Притчах слово охватывает обучение, воспитание и исправляющее наставление. Русское «наставление» сохраняет этот широкий смысл и не сводит его только к наказанию.
- source_word: וְעוֹזֵב
  choice: а кто отвергает
  rationale: Союз выражает противопоставление. Глагол עזב означает оставлять или отказываться; «отвергает» передаёт осознанный отказ и нравственную серьёзность контраста.
- source_word: תּוֹכַחַת
  choice: обличение
  rationale: Слово обозначает словесное исправление, укор или обличение. «Обличение» точно передаёт исправляющий характер речи и уместно в литературном библейском регистре.
- source_word: מַתְעֶה
  choice: сбивает других с пути
  rationale: 'Причастие в породе хифиль имеет каузативное значение: такой человек заставляет блуждать, а не просто заблуждается сам. «Других» делает подразумеваемый объект явным по-русски.'
theological_decisions:
- issue: Синтаксическая связь выражения «путь к жизни» с тем, кто следует наставлению
  choice: «тот на пути к жизни»
  alternative: «тот — путь к жизни»
  rationale: В краткой еврейской именной конструкции возможны оба прочтения. Основной текст передаёт человека как находящегося на пути к жизни, а сноска сохраняет более буквальное предикативное прочтение, при котором он сам назван путём к жизни.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены параллелизм, противопоставление и метафора пути; формулировки понятны без конфессионально специфической терминологии.
