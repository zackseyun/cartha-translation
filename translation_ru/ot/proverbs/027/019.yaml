- from: Как в воде лицо отражает лицо,[a] так сердце человека — человека.[b]
  to: Как в воде отражается лицо,[a] так сердце человека отражает самого человека.[b]
  rationale: Правка необходима для грамматической связности русского текста. Она минимально восполняет подразумеваемый в обеих частях глагол отражения, сохраняет сравнение «как… так…», родовое «человек» и отмечает в примечаниях буквальную эллиптическую форму еврейского текста. Формулировка «самого человека» выражает наиболее непосредственную связь «сердца человека» с «человеком», не добавляя отдельного богословского или психологического тезиса.
