  text: As in water face reflects face[b][a], so the heart of man reflects man.
translation:
  language: ru
  text: Как в воде отражается лицо,[a] так сердце человека отражает самого человека.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Как вода — лицо к лицу». Глагол «отражается» восполнен по смыслу сравнения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «так сердце человека — к человеку». Глагол «отражает» восполнен по смыслу параллели с первой частью.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּמַּיִם
  choice: Как в воде
  rationale: Префикс כ вводит сравнение. Русское «как в воде» естественно передаёт образ отражения, не делая воду действующим субъектом.
- source_word: הַפָּנִים לַפָּנִים
  choice: лицо отражает лицо
  rationale: 'Буквально: «лицо — к лицу». Глагол «отражает» восполняет эллипсис по очевидному образу водного отражения.'
- source_word: כֵּן
  choice: так
  rationale: Сохраняет соотносительную конструкцию «как… так…».
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет традиционный и прозрачный образ внутреннего человека — его мыслей, склонностей и расположения.
- source_word: הָאָדָם ... לָאָדָם
  choice: человека — человека
  rationale: «Человек» естественно передаёт родовое значение אָדָם. Именное построение с тире сохраняет эллиптичность и не навязывает спорное толкование отношения между сердцем и человеком.
theological_decisions:
- issue: 'Смысл второй половины: что именно сердце человека делает по отношению к человеку'
  choice: 'Сохранён эллипсис: «сердце человека — человека»'
  alternative: «сердце человека отражает самого человека»; «сердце человека отражается в другом человеке»
  rationale: В еврейском тексте нет выраженного глагола, а לָאָדָם допускает разные способы понимания. Основной текст сохраняет напряжение и параллелизм, а возможные истолкования вынесены в примечание.
- issue: Родовое значение אָדָם
  choice: человек
  alternative: мужчина; люди; человечество
  rationale: В контексте афоризма אָדָם имеет обобщённое значение; русское «человек» точно и естественно передаёт его без ненужного гендерного сужения.
translation_notes:
  register: Современный литературный русский язык с лаконичной, афористичной структурой. В первой строке смысловой эллипсис раскрыт минимально; во второй намеренно сохранён, чтобы не устранять неоднозначность еврейского текста.
