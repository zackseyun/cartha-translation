  - severity: low
    issue: Неестественная формулировка первой части
    rationale: '«Как в воде лицо отражает лицо» приписывает лицу действие отражения и звучит искусственно. Образ естественно выражается страдательно-возвратной конструкцией: «в воде отражается лицо».'
  - severity: low
