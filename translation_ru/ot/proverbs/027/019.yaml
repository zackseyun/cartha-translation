    rationale: Вариант об отклике сердца одного человека сердцу другого не следует непосредственно из буквальной формулировки и может создать впечатление альтернативы, равной по текстуальной опоре. Примечание лучше ограничить буквальным порядком слов и указанием на восполненное сказуемое.
