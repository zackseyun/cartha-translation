  yaml_path: translation/ot/proverbs/027/027.yaml
  text: And there will be enough goats' milk for your food[a], for the food of your household[b], and sustenance for your servant girls.
translation:
  language: ru
  text: И хватит тебе козьего молока на пищу[a], для пищи твоих домашних и для пропитания твоих служанок[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на хлеб твой»; еврейское слово «хлеб» здесь, вероятно, означает пищу или пропитание вообще. То же слово повторяется далее.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и жизнь — твоим молодым женщинам». Слово «жизнь» здесь означает то, что поддерживает жизнь, а слово, переведённое как «служанки», может также означать «девушки» или «молодые женщины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֵי
  choice: И хватит
  rationale: דַּי выражает достаточность. Конструкция «хватит» естественно передаёт этот смысл по-русски, не добавляя избыточной определённости.
- source_word: חֲלֵב עִזִּים
  choice: козьего молока
  rationale: Естественное современное обозначение молока коз; родительный падеж обусловлен безличной конструкцией «хватит».
- source_word: לְלַחְמְךָ
  choice: тебе на пищу
  rationale: לֶחֶם буквально означает «хлеб», но часто обозначает пищу вообще. В контексте молока как средства пропитания широкое значение предпочтительнее.
- source_word: לְלֶחֶם בֵּיתֶךָ
  choice: на пищу твоим домашним
  rationale: בַּיִת здесь обозначает не здание, а дом как совокупность живущих в нём людей; «домашним» передаёт бытовой и хозяйственный контекст.
- source_word: וְחַיִּים
  choice: и на пропитание
  rationale: חַיִּים буквально означает «жизнь», но здесь указывает на средства поддержания жизни. «Пропитание» естественно передаёт контекстуальный смысл, а буквальный образ отмечен в сноске.
- source_word: לְנַעֲרוֹתֶיךָ
  choice: твоим служанкам
  rationale: נַעֲרָה может означать девушку, молодую женщину или служанку. В перечне обеспечения домашнего хозяйства наиболее вероятно значение «служанки», при этом лексическая неоднозначность сохранена в сноске.
