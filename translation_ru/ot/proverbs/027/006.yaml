lexical_decisions:
- source_word: נֶאֱמָנִים
  choice: верны
  rationale: Прилагательное обозначает надёжность, верность и заслуживающий доверия характер. В данном контексте оно говорит о благом и искреннем намерении друга, причиняющего боль; краткое «верны» сохраняет афористичность еврейского текста.
- source_word: פִּצְעֵי
  choice: раны
  rationale: Существительное прямо означает раны или повреждения и одновременно допускает метафорическое понимание болезненного обличения.
- source_word: אוֹהֵב
  choice: друг
  rationale: Причастие буквально означает «любящий», но в контексте противопоставления ненавидящему обозначает близкого, расположенного к человеку. «Друг» естественно передаёт эту связь по-русски, не придавая ей романтического оттенка.
- source_word: וְנַעְתָּרוֹת
  choice: чрезмерны
  rationale: Трудная форма допускает понимание «обильны, многочисленны»; в контексте речь, вероятно, идёт об избыточных проявлениях расположения. «Чрезмерны» передаёт идею избытка, не вводя в основной текст толкование «лживы».
- source_word: נְשִׁיקוֹת
  choice: поцелуи
  rationale: Прямой эквивалент; здесь поцелуи могут обозначать внешние проявления расположения.
- source_word: שׂוֹנֵא
  choice: враг
  rationale: Причастие буквально означает «ненавидящий». В афористическом противопоставлении слову «друг» естественным русским соответствием служит «враг».
