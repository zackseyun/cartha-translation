id: PRO.27.1
reference: Proverbs 27:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַֽל תִּ֭תְהַלֵּל בְּ/י֣וֹם מָחָ֑ר כִּ֤י לֹא תֵ֝דַ֗ע מַה יֵּ֥לֶד יֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/001.yaml
  text: Do not boast about tomorrow[a], for you do not know what a day may bring.
translation:
  language: ru
  text: Не хвались завтрашним днём, ведь ты не знаешь, что породит день.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть что этот день принесёт или произведёт.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלֵּל
  choice: хвались
  rationale: Возвратная форма глагола הלל здесь выражает самовосхваление; «хвалиться» естественно передаёт предостережение против самоуверенности.
- source_word: בְּיוֹם מָחָר
  choice: завтрашним днём
  rationale: Еврейское выражение буквально означает «днём завтра»; творительный падеж после «хвалиться» естественно обозначает предмет похвальбы и сохраняет упоминание дня.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание запрета; «ведь» кратко и естественно связывает обе части изречения.
- source_word: תֵדַע
  choice: ты не знаешь
  rationale: Глагол ידע утверждает отсутствие знания, а не отвлечённую невозможность знать.
- source_word: מַה יֵּלֶד יוֹם
  choice: что породит день
  rationale: 'Сохранён образ рождения, выраженный глаголом ילד, при этом русская фраза остаётся ясной: речь о том, какие события принесёт день.'
