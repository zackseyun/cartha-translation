  source_fidelity: 'Текст точно передаёт еврейский запрет на самовосхваление в отношении завтрашнего дня и его основание: человеку неизвестно, что произведёт (буквально «родит») день. «Хвались» адекватно отражает возвратный оттенок Hitpael, а «что породит день» сохраняет образ оригинала без смыслового добавления.'
