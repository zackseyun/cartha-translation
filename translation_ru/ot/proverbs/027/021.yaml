base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/021.yaml
  text: The crucible is for silver[a], and the furnace for gold, and a man is tested by his praise.
translation:
  language: ru
  text: Тигель для серебра, горнило для золота, а человека испытывает похвала.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза неоднозначна. Возможно также: «а человека испытывает то, что он хвалит»; или: «а человека испытывает похвала, которую он получает».'
    reason: Альтернативные прочтения неоднозначной еврейской фразы לְפִי מַהֲלָלוֹ.
lexical_decisions:
- source_word: מַצְרֵף
  choice: плавильный тигель
  rationale: Слово обозначает сосуд для очищения металла; «плавильный тигель» точно и понятно сохраняет металлургический образ.
- source_word: לַכֶּסֶף
  choice: серебро испытывают
  rationale: Предлог указывает на назначение тигля. Глагольная конструкция естественна по-русски и делает явной общую для трех частей мысль об испытании.
- source_word: כּוּר
  choice: печь
  rationale: Обозначает печь для плавки или очищения металла; краткое «печь» естественно в параллельной строке.
- source_word: לַזָּהָב
  choice: золото — в печи
  rationale: Передает назначение печи и сохраняет параллелизм с испытанием серебра.
- source_word: אִישׁ
  choice: человека
  rationale: В пословице грамматически мужское существительное обозначает отдельного человека в общем смысле; русское «человек» сохраняет это без ненужного сужения до взрослого мужчины.
- source_word: לְפִי
  choice: по тому, как
  rationale: Буквально «по устам; согласно»; выбранная конструкция естественно связывает оценку человека с неоднозначным מַהֲלָלוֹ.
- source_word: מַהֲלָלוֹ
  choice: его хвалят
  rationale: 'Основной текст передает вероятное значение похвалы, обращенной к человеку, а примечание сохраняет существенную альтернативу: то, что хвалит он сам.'
theological_decisions:
- issue: Неоднозначность заключительной части לְפִי מַהֲלָלוֹ
  choice: человека — по тому, как его хвалят
  alternative: человека узнают по тому, что хвалит он сам
  rationale: Еврейская конструкция допускает понимание как похвалы, получаемой человеком, так и предмета его собственной похвалы. Буквальное русское «по его похвале» не сохраняет неоднозначность естественно, а звучит неясно, поэтому основной текст выбирает одно вероятное прочтение, а другое прямо фиксируется в примечании.
translation_notes:
  register: Современный литературный русский язык с лаконичным пословичным ритмом. Эллипсис во второй и третьей частях сохраняет параллелизм; слово «испытывают» раскрывает общий образ проверки качества металлов и человека.
