    issue: Заключительная часть в основном тексте чрезмерно разрешает неоднозначность.
    rationale: «По тому, как его хвалят» однозначно понимает מַהֲלָלוֹ как похвалу, получаемую человеком, тогда как еврейская фраза допускает и связь с тем, что хвалит сам человек. Примечание отмечает альтернативу, но основной текст можно сделать менее интерпретативным.
  - severity: low
