revisions:
- from: Серебро испытывают в плавильном тигле, золото — в печи, а человека — по тому, как его хвалят.[a]
  to: Тигель для серебра, горнило для золота, а человека испытывает похвала.[a]
  rationale: Исправление восстанавливает краткий трёхчленный параллелизм оригинала, уточняет металлургический термин и в основной строке избегает преждевременного выбора между спорными толкованиями заключительной фразы. Примечание прозрачно фиксирует оба главных способа её понимания.
