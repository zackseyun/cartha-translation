  text: רֵֽעֲ/ךָ֨ ו/רעה אָבִ֡י/ךָ אַֽל תַּעֲזֹ֗ב וּ/בֵ֥ית אָחִ֗י/ךָ אַל תָּ֭בוֹא בְּ/י֣וֹם אֵידֶ֑/ךָ ט֥וֹב שָׁכֵ֥ן קָ֝ר֗וֹב מֵ/אָ֥ח רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/010.yaml
  text: Do not forsake your friend or your father’s friend[a], and do not go to your brother’s house in the day of your calamity[b]; a nearby neighbor is better than a distant brother.
translation:
  language: ru
  text: 'Не оставляй своего друга и друга своего отца; не приходи в дом своего брата[a] в день своего бедствия: сосед, живущий рядом, лучше далёкого брата.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «брат» может здесь также обозначать родственника.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעֲךָ וְרֵעַ אָבִיךָ
  choice: своего друга и друга своего отца
  rationale: רֵעַ обозначает друга, товарища или близкого знакомого. Русское «друг» естественно передаёт личную и устойчивую связь; союз «и» непосредственно отражает еврейский ו и в русском без затруднения объединяет оба дополнения при одном запрете.
- source_word: אַל תַּעֲזֹב
  choice: не оставляй
  rationale: עזב здесь означает покинуть, оставить без поддержки, отказаться от отношений. «Не оставляй» звучит современно и сохраняет нравственную весомость наставления, не добавляя отсутствующего в тексте пояснения.
- source_word: וּבֵית אָחִיךָ אַל תָּבוֹא
  choice: не приходи в дом своего брата
  rationale: בוא может означать приходить, идти или входить. В контексте обращения за помощью во время бедствия «приходить в дом» естественно по-русски и близко к образу исходного текста.
- source_word: בְּיוֹם אֵידֶךָ
  choice: в день своего бедствия
  rationale: אֵיד означает тяжёлое несчастье, бедствие или гибель. «Бедствие» сохраняет серьёзность выражения, не уточняя характер несчастья.
- source_word: שָׁכֵן קָרוֹב
  choice: близкий сосед
  rationale: שָׁכֵן — «сосед», а קָרוֹב — «близкий, находящийся рядом». «Близкий сосед» сохраняет возможное сочетание пространственной близости и доступности, не сводя смысл исключительно к месту жительства.
- source_word: מֵאָח רָחוֹק
  choice: лучше далёкого брата
  rationale: Предлог מִן образует сравнение, поэтому טוֹב естественно передано как «лучше». «Далёкий брат» сохраняет противопоставление близкого и далёкого, включая возможную пространственную и жизненную удалённость.
theological_decisions:
- issue: Объём значения родственного термина אָח
  choice: В основном тексте сохранено «брат».
  alternative: «родственник» или «сородич»
  rationale: אָח может обозначать как родного брата, так и более широкого родственника. «Брат» сохраняет конкретный образ и напряжение между ожидаемой поддержкой семьи и практической помощью того, кто рядом; более широкое значение отмечено в сноске.
- issue: Характер близости и удалённости в заключительном сравнении
  choice: Использованы допускающие смысловую широту слова «близкий» и «далёкий».
  alternative: Уточнить как «сосед, живущий рядом» и «брат, живущий далеко».
  rationale: קָרוֹב и רָחוֹק прежде всего образуют пространственное противопоставление, но в пословице оно может также подразумевать доступность и фактическую близость отношений. Перевод не должен без необходимости устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным пословичным ритмом. Синтаксис следует еврейскому параллелизму, но избегает архаических форм и неестественной инверсии.
