source:
  edition: WLC
  text: דֶּ֣לֶף ט֭וֹרֵד בְּ/י֣וֹם סַגְרִ֑יר וְ/אֵ֥שֶׁת מדונים נִשְׁתָּוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/015.yaml
  text: A constant dripping on a day of heavy rain[a], and a quarrelsome wife, are alike.
translation:
  language: ru
  text: Непрестанная капель в день проливного дождя и сварливая жена — одно и то же.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Непрерывно капающая вода в ненастный день подобна сварливой жене».'
    reason: Лексика допускает передачу дождливой погоды как «ненастного дня», а глагола — как прямого уподобления.
lexical_decisions:
- source_word: דֶּלֶף טוֹרֵד
  choice: непрестанная капель
  rationale: Сочетание обозначает непрерывно капающую воду, вероятно через крышу. «Непрестанная капель» естественно передаёт повторяемость и длительность действия.
- source_word: בְּיוֹם סַגְרִיר
  choice: в день проливного дождя
  rationale: Сохраняет конкретную временную обстановку и передаёт סַגְרִיר как затяжной сильный дождь; значение слова допускает также более общее «ненастный день».
- source_word: אֵשֶׁת מִדְיָנִים
  choice: сварливая жена
  rationale: 'Идиоматично передаёт буквальное «жена ссор»: женщина, постоянно склонная затевать ссоры, без смягчения характеристики.'
- source_word: נִשְׁתָּוָה
  choice: одно и то же
  rationale: Глагол выражает уподобление или равенство. Эта формулировка естественно воспроизводит резкое proverbial equation и сохраняет единственное число еврейского сказуемого.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной формой пословицы. Слово «сварливая» общеупотребительно и передаёт устойчивую склонность к ссорам; образ протекающей крыши сохранён без поясняющего добавления.
