  yaml_path: translation/ot/proverbs/027/007.yaml
  text: A satisfied person despises honey[b][a], but to a hungry person every bitter thing is sweet.
translation:
  language: ru
  text: Сытый человек[a] пренебрегает мёдом[b], а для голодного всё горькое сладко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Сытая душа попирает мёд, а голодной душе всё горькое сладко». Еврейское слово «душа» здесь обозначает человека с точки зрения его аппетита или желания.'
    reason: lexical_alternative
  - marker: b
