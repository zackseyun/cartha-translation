lexical_decisions:
- source_word: נֶפֶשׁ
  choice: человек
  rationale: Буквально «душа», но здесь слово обозначает человека с точки зрения его аппетита и желания. «Человек» естественно передаёт этот идиоматический смысл по-русски.
- source_word: שְׂבֵעָה
  choice: сытый
  rationale: Прилагательное означает наполненность, насыщенность пищей; «сытый» прямо и естественно противопоставляется «голодному».
- source_word: תָּבוּס
  choice: пренебрегает
  rationale: Глагол буквально связан с попиранием ногами, а в данном контексте выражает презрительное отвержение пищи. «Пренебрегает» сохраняет эту силу без неестественной конкретизации образа.
- source_word: נֹפֶת
  choice: мёд
  rationale: Слово обозначает мёд, возможно текущий или находящийся в сотах. Общее «мёд» ясно передаёт смысл; более узкое значение отмечено в сноске.
- source_word: רְעֵבָה
  choice: голодный
  rationale: Прилагательное прямо означает испытывающего голод; перевод не усиливает значение до «изголодавшегося» или «умирающего от голода».
- source_word: כָּל
  choice: всё
  rationale: 'В сочетании «всё горькое» слово выражает обобщение: для голодного сладко любое горькое.'
- source_word: מַר
  choice: горькое
  rationale: Прилагательное употреблено субстантивированно и означает всё то, что горько.
- source_word: מָתוֹק
  choice: сладко
  rationale: Прямо передаёт предикативное значение прилагательного, не добавляя толкований «кажется» или «на вкус».
