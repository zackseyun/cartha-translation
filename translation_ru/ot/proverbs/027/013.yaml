  source_fidelity: 'Первая строка в целом передана верно: קַח בִּגְדוֹ — «возьми у него одежду», а עָרַב זָר — «он поручился за постороннего». Однако «удержи её как залог» во второй строке неоправданно делает суффикс в חַבְלֵהוּ отсылкой к одежде. В еврейском тексте суффикс мужского рода, и обычное понимание глагола в данном залоговом контексте — взять залог с самого поручителя / взять его в залог. Русское «возьми с него залог» естественно передаёт эту конструкцию, не приписывая тексту женское местоимение.'
