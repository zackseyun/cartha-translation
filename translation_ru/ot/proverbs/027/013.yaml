base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/013.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold it in pledge for a foreign woman.
translation:
  language: ru
  text: Возьми у него одежду, ибо он поручился за постороннего; возьми с него залог за чужеземку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст второй части стиха предельно краток. Буквально глагол может означать «возьми его в залог»; поэтому возможен также перевод: «удержи его как залог за чужеземку». Слово «чужеземка» может означать как иноземную женщину, так и, в контексте Притчей, женщину, связь с которой считается недозволенной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: Возьми
  rationale: Повелительная форма 2-го лица единственного числа от לקח; прямое и естественное повеление, сохраняющее краткость изречения.
- source_word: בִּגְדוֹ
  choice: у него одежду
  rationale: בגד обозначает одежду, в том числе верхнюю; местоименный суффикс передан сочетанием «у него», естественным в контексте взыскания залога.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание повеления и сохраняет лаконичную причинную связь.
- source_word: עָרַב
  choice: поручился
  rationale: Глагол означает выступить поручителем по чужому обязательству; «поручился» ясно передаёт финансово-правовой смысл.
- source_word: זָר
  choice: за чужого
  rationale: Слово указывает на постороннего, не принадлежащего к близкому кругу человека; субстантивированное «чужой» естественно по-русски.
- source_word: וּבְעַד
  choice: и ... за
  rationale: Предлог выражает отношение к лицу, ради которого или за которого дано поручительство; параллелизм со первой строкой передан кратко.
- source_word: נָכְרִיָּה
  choice: чужеземку
  rationale: Женская форма נכרי буквально обозначает чужую или иноземную женщину; «чужеземка» сохраняет основной смысл, не сужая его до «прелюбодейки».
- source_word: חַבְלֵהוּ
  choice: удержи её как залог
  rationale: В контексте залоговых отношений חבל означает взять или удерживать залог. Женское местоимение «её» отсылает к одежде и делает сжатую еврейскую конструкцию понятной.
