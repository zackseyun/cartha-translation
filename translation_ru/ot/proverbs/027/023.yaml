  text: Know well the condition of your flock[b][a]; set your heart on the herds.
translation:
  language: ru
  text: Хорошо знай, в каком состоянии твой мелкий скот[a]; уделяй внимание стадам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Хорошо знай лицо своего мелкого скота»; «лицо» здесь означает его видимое состояние.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отарам». Еврейское слово может обозначать различные группы домашнего скота — стада или отары.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: Хорошо знай
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает повеление. «Хорошо знай» естественно передаёт настойчивость и полноту знания.
- source_word: פְּנֵי
  choice: в каком состоянии
  rationale: Буквально «лицо», но здесь слово обозначает видимое состояние или положение скота. Выбранная формулировка ясно передаёт идиоматический смысл.
- source_word: צֹאנְךָ
  choice: твой мелкий скот
  rationale: צֹאן обозначает главным образом овец и коз как мелкий домашний скот. Такой перевод сохраняет широту еврейского слова и не ограничивает его только овцами.
- source_word: שִׁית לִבְּךָ
  choice: внимательно следи
  rationale: Буквально выражение означает «направь/положи своё сердце». В данном наставлении оно призывает сосредоточить внимание и проявлять постоянную заботу; буквальная русская калька была бы неестественной.
- source_word: לַעֲדָרִים
  choice: за стадами
  rationale: עֲדָרִים обозначает группы пасущихся или содержащихся вместе животных. «Стада» естественно передаёт более общее обозначение сгруппированного скота и отличает его от צֹאן.
