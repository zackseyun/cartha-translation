lexical_decisions:
- source_word: טוֹבָה
  choice: лучше
  rationale: В сравнительной конструкции с מִן прилагательное имеет значение «лучше», а не просто «хорош».
- source_word: תּוֹכַחַת
  choice: упрёк
  rationale: Слово обозначает словесное обличение или порицание; «упрёк» естественно и достаточно ёмко передаёт его силу в кратком изречении.
- source_word: מְגֻלָּה
  choice: открытый
  rationale: Причастие буквально означает «открытый, явленный»; здесь оно характеризует упрёк, высказанный явно, не скрываемый. Перевод «публичный» был бы чрезмерно конкретным.
- source_word: מִן
  choice: чем
  rationale: Предлог вводит второй член сравнения после טוֹבָה.
- source_word: אַהֲבָה
  choice: любовь
  rationale: Прямой и естественный эквивалент, сохраняющий полноту значения исходного существительного.
- source_word: מְסֻתָּרֶת
  choice: скрытая
  rationale: 'Сохраняет неоднозначность: любовь может быть утаённой или просто не выраженной явно.'
