  text: Лучше открытое обличение, чем скрытая любовь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утаённая любовь». Еврейское выражение может означать любовь, которая остаётся невыраженной, а не отсутствие любви.'
