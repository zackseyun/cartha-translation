  text: כִּ֤י לֹ֣א לְ/עוֹלָ֣ם חֹ֑סֶן וְ/אִם נֵ֝֗זֶר לְ/ד֣וֹר דור־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/024.yaml
  text: For wealth does not last forever[b][a], nor a crown from generation to generation.
translation:
  language: ru
  text: Ведь богатство[a] не вечно, и венец[b] не остаётся из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достаток»; еврейское слово может также означать материальные средства, изобилие или силу, но здесь контекст указывает на имущество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «диадема»; еврейское слово может также обозначать посвящение, однако здесь, вероятнее всего, имеется в виду венец как знак власти или положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит обоснование наставления в окружающем контексте; «ведь» естественно передаёт эту пояснительную связь.
- source_word: חֹסֶן
  choice: богатство
  rationale: В контексте заботы о стадах и материальном обеспечении слово обозначает прежде всего материальные средства, а не отвлечённую силу.
- source_word: לְעוֹלָם
  choice: не вечно
  rationale: Сочетание с отрицанием выражает непостоянство; краткая русская формулировка сохраняет категоричность афоризма.
- source_word: וְאִם
  choice: и … не
  rationale: После первого отрицания конструкция вводит второе параллельное отрицание. По-русски это естественно передаётся повтором «не», без условного «если».
- source_word: נֵזֶר
  choice: венец
  rationale: Слово может обозначать венец, диадему или знак посвящения. Здесь параллелизм с богатством и упоминание поколений указывают на венец как образ высокого положения или власти.
- source_word: לְדוֹר דּוֹר
  choice: из поколения в поколение
  rationale: Повтор существительного выражает последовательность поколений; устойчивый русский оборот точно передаёт этот смысл.
theological_decisions:
- issue: Значение נֵזֶר в параллелизме притчи
  choice: венец как образ власти или высокого положения
  alternative: диадема; посвящение
  rationale: 'Контекст говорит о непрочности того, что кажется надёжным: имущества и общественного либо династического положения. «Венец» сохраняет конкретный образ и не сужает его до культового посвящения.'
- issue: Эллипсис во второй строке
  choice: добавлено «не сохраняется»
  alternative: буквальное именное построение без выраженного сказуемого
  rationale: В еврейском тексте сказуемое подразумевается из параллелизма. Его явное выражение необходимо для ясного и естественного русского предложения и не устраняет смысловой напряжённости текста.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная структура сохранена. «Венец» выбран как достоинственное и понятное слово, поддерживающее образность оригинала.
