lexical_decisions:
- source_word: חֲכַם
  choice: Будь мудр
  rationale: Повелительная форма мужского рода единственного числа от חכם. «Будь мудр» кратко и естественно передаёт призыв, не сводя его только к отдельным мудрым поступкам и не устраняя возможный оттенок становления мудрым.
- source_word: בְּנִי
  choice: сын мой
  rationale: Существительное בן с суффиксом первого лица единственного числа буквально означает «мой сын». Сохранены мужской род и характерное для литературы мудрости обращение.
- source_word: וְשַׂמַּח לִבִּי
  choice: и обрадуй моё сердце
  rationale: Каузативное повеление со словом «сердце» передано естественным русским выражением, которое сохраняет конкретный образ еврейского текста.
- source_word: וְאָשִׁיבָה ... דָבָר
  choice: чтобы я мог ответить
  rationale: Когортатив первого лица в сочетании с דָבָר образует идиому, буквально означающую «возвратить слово», то есть «дать ответ». Союз «чтобы» передаёт целевую связь с предшествующим призывом.
- source_word: חֹרְפִי
  choice: тому, кто поносит меня
  rationale: Причастие от חרף с суффиксом первого лица обозначает человека, который поносит или укоряет говорящего. Выбранная формулировка естественна по-русски и сохраняет продолжающийся личный характер действия.
