  text: יְהַלֶּלְ/ךָ֣ זָ֣ר וְ/לֹא פִ֑י/ךָ נָ֝כְרִ֗י וְ/אַל שְׂפָתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/002.yaml
  text: Let another praise you[a], and not your own mouth; a stranger[b], and not your own lips.
translation:
  language: ru
  text: Пусть тебя хвалит другой[a], а не твои уста; чужой[b], а не твои губы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посторонний». Еврейское זָר здесь подчёркивает, что похвала должна исходить не от самого человека, а от кого-то другого.'
    reason: lexical_alternative
  - marker: b
    text: Во второй строке употреблено другое еврейское слово — נָכְרִי («чужой», «посторонний»). Перевод сохраняет это различие в поэтическом параллелизме.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלֶּלְךָ
  choice: Пусть тебя хвалит
  rationale: Форма выражает побуждение; такая передача прямо и естественно сохраняет значение הלל и наставительный характер изречения.
- source_word: זָר
  choice: другой
  rationale: В противопоставлении собственным устам слово указывает прежде всего на другого человека, не на самого адресата. «Другой» естественно передаёт смысл, не усиливая без необходимости оттенок этнической чуждости.
- source_word: פִיךָ
  choice: твои уста
  rationale: Буквально «твой рот». «Уста» звучит dignified и образует естественную поэтическую пару с «губами»; принадлежность уже выражена местоимением.
- source_word: נָכְרִי
  choice: чужой
  rationale: Слово обозначает чужого или постороннего человека и отличается от זָר. «Чужой» сохраняет лексическое варьирование и параллелизм, не сводя значение непременно к иностранцу.
- source_word: שְׂפָתֶיךָ
  choice: твои губы
  rationale: Прямая современная передача, сохраняющая телесный образ и параллель «уста — губы».
- source_word: וְלֹא ... וְאַל
  choice: а не ... а не
  rationale: Обе отрицательные конструкции запрещают самовосхваление в параллельных строках. Повтор «а не» ясно передаёт контраст и сохраняет ритмическую симметрию.
