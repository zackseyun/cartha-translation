  text: Even if you grind a fool in a mortar with a pestle among crushed grain[a], his foolishness will not depart from him.
translation:
  language: ru
  text: Даже если истолчёшь глупца пестом в ступе среди толчёного зерна[a], глупость его не оставит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дроблёного зерна»; точное значение еврейского רִיפוֹת не вполне определённо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְתּוֹשׁ
  choice: истолчёшь
  rationale: Глагол обозначает сильное толчение или дробление в ступе; «истолчёшь» естественно сочетается со ступой и пестом и сохраняет силу образа.
- source_word: אֱוִיל
  choice: глупец
  rationale: В литературе мудрости это нравственно и рассудочно закоснелый человек, а не просто человек с низким интеллектом; «глупец» сохраняет традиционный жанровый оттенок.
- source_word: מַּכְתֵּשׁ
  choice: ступа
  rationale: Точное и общеупотребительное русское название сосуда, в котором толкут зерно или иные вещества.
- source_word: רִיפוֹת
  choice: толчёное зерно
  rationale: Слово обозначает зерно или зерновой продукт, раздробленный толчением; перевод сохраняет конкретный бытовой образ, не уточняя спорный вид продукта.
- source_word: עֱלִי
  choice: пест
  rationale: Точное русское название орудия, которым толкут в ступе.
- source_word: תָסוּר מֵעָלָיו
  choice: не отстанет от него
  rationale: Выражение передаёт неустранимую привязанность глупости к человеку; по-русски «не отстанет от него» естественно и сохраняет пространственную образность מֵעָלָיו.
- source_word: אִוַּלְתּוֹ
  choice: глупость его
  rationale: Абстрактное существительное называет укоренившуюся глупость глупца; такой перевод прозрачен современному читателю.
- source_word: אִם
  choice: даже если
  rationale: 'В данном контексте частица вводит уступительное гипотетическое условие: даже крайняя мера не приводит к перемене.'
