  source_fidelity: 'Русский текст точно передаёт двучленный параллелизм еврейского оригинала: заботливый уход за смоковницей ведёт к вкушению её плодов, а верная забота о господине — к чести. «Ухаживает за смоковницей» идиоматично раскрывает נֹצֵר в сельскохозяйственном контексте. «Заботится о своём господине» допустимо передаёт שֹׁמֵר, не сводя его ни к одной лишь физической охране, ни к отвлечённому служению. «Будет почитаем» корректно отражает пассивный пуаль יְכֻבָּד.'
