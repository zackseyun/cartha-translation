  text: נֹצֵ֣ר תְּ֭אֵנָה יֹאכַ֣ל פִּרְיָ֑/הּ וְ/שֹׁמֵ֖ר אֲדֹנָ֣י/ו יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/018.yaml
  text: Whoever tends a fig tree will eat its fruit[b][a], and he who watches over his master will be honored.
translation:
  language: ru
  text: Кто ухаживает за смоковницей[a], тот будет есть её плоды; и кто заботится о своём господине[b], тот будет почитаем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хранит» или «оберегает смоковницу»; имеется в виду постоянный и верный уход за ней.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «стережёт (оберегает) своего господина». Речь прежде всего о внимательной и верной заботе о вышестоящем, а не только о его физической защите.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: ухаживает
  rationale: Глагол означает «хранить, оберегать, соблюдать»; применительно к смоковнице естественное русское «ухаживает» передаёт постоянную заботу, необходимую для получения плодов.
- source_word: תְּאֵנָה
  choice: смоковница
  rationale: Существительное обозначает именно фиговое дерево; «смоковница» сохраняет конкретный земледельческий образ.
- source_word: יֹאכַל
  choice: будет есть
  rationale: Имперфект выражает закономерное, ожидаемое следствие в форме общего изречения.
- source_word: פִּרְיָהּ
  choice: её плоды
  rationale: Суффикс женского рода относится к смоковнице. Русское множественное «плоды» естественно для собирательного древнееврейского פְּרִי и данного земледельческого образа.
- source_word: שֹׁמֵר
  choice: заботится о
  rationale: Основное значение — «хранить, стеречь, внимательно следить». В отношении господина выражение указывает на верную, внимательную заботу, а не только на физическую охрану.
- source_word: אֲדֹנָיו
  choice: о своём господине
  rationale: В контексте житейской мудрости слово обозначает человеческого господина или начальствующего; возвратное «своём» ясно передаёт принадлежность без божественной конкретизации.
- source_word: יְכֻבָּד
  choice: будет почитаем
  rationale: Пуаль от כבד означает получение чести. «Будет почитаем» прямо передаёт пассивное значение и сохраняет достойный регистр.
theological_decisions:
- issue: Кого обозначает «его господин»
  choice: Человеческого господина в житейском сравнении о верной службе
  alternative: Господа Бога как возможное более широкое применение
  rationale: В אֲדֹנָיו нет признаков, требующих отнести слово к Богу, а параллель с уходом за смоковницей поддерживает обычные общественные отношения. Возможное богословское применение не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Сохранены параллелизм двух полустиший, земледельческий образ и связь между верной заботой и её закономерным итогом.
