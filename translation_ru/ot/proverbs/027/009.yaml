  text: שֶׁ֣מֶן וּ֭/קְטֹרֶת יְשַׂמַּֽח לֵ֑ב וּ/מֶ֥תֶק רֵ֝עֵ֗/הוּ מֵֽ/עֲצַת נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/009.yaml
  text: Oil and incense make the heart glad[a], and the sweetness of a friend comes from the counsel of the soul.
translation:
  language: ru
  text: Масло и благовоние радуют сердце, а сладость друга — от душевного совета.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сладость друга лучше собственного совета». Древнееврейский текст второй строки очень сжат и допускает разные толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶן
  choice: масло
  rationale: Прямое значение существительного; здесь, вероятно, имеется в виду ароматическое масло, но общий образ лучше не сужать.
- source_word: קְטֹרֶת
  choice: благовоние
  rationale: Слово обозначает ароматическое курение или смесь; «благовоние» естественно передаёт приятный запах, не добавляя культового смысла.
- source_word: יְשַׂמַּח לֵב
  choice: радуют сердце
  rationale: Сохраняет причинное значение глагола и древнееврейский образ сердца как средоточия внутренних чувств.
- source_word: מֶתֶק
  choice: сладость
  rationale: Сохраняет чувственную метафору и её связь с приятными ароматами первой строки.
- source_word: רֵעֵהוּ
  choice: друга
  rationale: Передаёт существительное «друг, ближний» с местоименным суффиксом в обобщённой форме, подходящей для русской пословицы.
- source_word: מֵעֲצַת נָפֶשׁ
  choice: от душевного совета
  rationale: Предлог מִן понят как указание на источник, а נָפֶשׁ — как внутреннее, искреннее расположение человека; формулировка остаётся краткой и естественной по-русски.
theological_decisions:
- issue: Неоднозначный синтаксис второй строки
  choice: Сладость, исходящая от друга, связывается с искренним советом.
  alternative: «Сладость друга лучше собственного совета», если מִן понимать сравнительно, а נָפֶשׁ — как «сам, собственная душа».
  rationale: Основной вариант следует наиболее прямому пониманию מִן как указания на источник, но компактный древнееврейский текст допускает сравнительное прочтение, поэтому оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким пословичным строем. Сохранены конкретные образы масла, благовония, сердца и сладости; необычная метафора «сладость друга» не сглажена.
