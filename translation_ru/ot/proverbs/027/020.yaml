base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/020.yaml
  text: Sheol and Abaddon are never satisfied[b][a], and the eyes of man are never satisfied.
translation:
  language: ru
  text: Шеол[a] и Аваддон[b] никогда не насыщаются, и глаза человека[c] никогда не насыщаются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — древнееврейское обозначение мира мёртвых.
    reason: lexical_explanation
  - marker: b
    text: 'Или: «гибель», «уничтожение». «Аваддон» — древнееврейский термин, который может обозначать гибель или область погибели.'
    reason: lexical_alternative
  - marker: c
    text: «Человек» здесь имеет обобщающий смысл и относится ко всем людям.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет древнееврейское обозначение мира мёртвых и не сужает его значение до могилы или ада.
- source_word: אֲבַדָּה
  choice: Погибель
  rationale: В данном тексте стоит существительное со значением гибели или уничтожения, а не форма имени «Аваддон». Заглавная буква передаёт олицетворённый, почти пространственный характер слова в параллели с Шеолом.
- source_word: לֹא תִשְׂבַּעְנָה
  choice: никогда не насыщаются
  rationale: Глагол означает достижение сытости или полного удовлетворения; в обобщающем изречении «никогда» естественно выражает постоянную ненасытность. Одинаковый перевод обоих повторов сохраняет параллелизм.
- source_word: עֵינֵי הָאָדָם
  choice: глаза человека
  rationale: Буквальный образ глаз сохраняет связь со зрением как средством и образом человеческого желания; «человек» здесь употреблено в родовом смысле.
theological_decisions:
- issue: Значение הָאָדָם в обобщающей притче
  choice: человека
  alternative: людей / человечества
  rationale: Единственное число исходного текста сохранено, но русское «человек» здесь естественно обозначает любого человека и человечество вообще, а не только мужчину.
- issue: Различение אֲבַדָּה и אֲבַדּוֹן
  choice: Погибель
  alternative: Аваддон
  rationale: Предоставленный еврейский текст содержит אֲבַדָּה («гибель, уничтожение»), поэтому транслитерация «Аваддон» не соответствует данной словоформе. Перевод сохраняет смысл и параллель с Шеолом без привнесения поздней персонификации.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой притчи. Повтор «никогда не насыщаются» намеренно сохранён. «Погибель» написана с заглавной буквы, чтобы передать её олицетворение и параллельность Шеолу.
