  text: כְּ֭/צִפּוֹר נוֹדֶ֣דֶת מִן קִנָּ֑/הּ כֵּֽן אִ֝֗ישׁ נוֹדֵ֥ד מִ/מְּקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/008.yaml
  text: Like a bird that wanders from its nest[a], so is a man who wanders from his place.
translation:
  language: ru
  text: 'Как птица, скитающаяся вдали от своего гнезда,

    так и человек, скитающийся вдали от своего места.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Своё место» может означать не только дом, но и привычное или надлежащее человеку место.
    reason: Поясняет широкое значение еврейского מָקוֹם, не сужая его до жилища.
lexical_decisions:
- source_word: כְּצִפּוֹר
  choice: Как птица
  rationale: צִפּוֹר — общее обозначение птицы, особенно небольшой; перевод не уточняет вид без основания в еврейском тексте.
- source_word: נוֹדֶדֶת / נוֹדֵד
  choice: покинувшая / покинувший
  rationale: Оба причастия происходят от נוד и образуют намеренный параллелизм. В данном контексте речь идёт об удалении от гнезда или своего места; одинаковая конструкция с «покинувший» естественно передаёт этот параллелизм по-русски, хотя оттенок странствия раскрыт в сноске.
- source_word: מִן קִנָּהּ
  choice: покинувшая своё гнездо
  rationale: קֵן означает «гнездо»; местоимение «своё» естественно передаёт суффикс 3-го лица женского рода, согласованный в еврейском с צִפּוֹר.
- source_word: כֵּן
  choice: так
  rationale: כֵּן вводит вторую часть сравнения; русская конструкция «Как…, так…» сохраняет форму еврейской сентенции.
- source_word: אִישׁ
  choice: человек
  rationale: Хотя אִישׁ имеет форму мужского рода и может означать «мужчина», здесь это отдельный представитель человеческого рода в общем сравнении. Русское «человек» сохраняет грамматический мужской род и звучит естественнее в универсальной пословице.
- source_word: מִמְּקוֹמוֹ
  choice: своё место
  rationale: מָקוֹם имеет широкое значение «место». Этот вариант не сужает смысл до дома и сохраняет возможную отсылку к привычному, надлежащему месту или положению человека.
theological_decisions:
- issue: Обобщающее значение אִישׁ
  choice: человек
  alternative: мужчина
  rationale: В стихе нет специального противопоставления полов; אִישׁ обозначает типичного отдельного человека. Выбор не устраняет мужскую грамматическую форму, но естественно передаёт обобщающий смысл по-русски.
- issue: Смысл «своего места»
  choice: сохранить широкое выражение «своё место»
  alternative: свой дом
  rationale: Еврейское מָקוֹם шире понятия дома и может подразумевать привычное место, среду или надлежащее положение. Перевод не должен без достаточных оснований сводить образ только к жилищу.
translation_notes:
  register: Современный литературный русский язык; краткая двухчастная форма сохраняет параллелизм пословицы. Лексика проста и достойна, без архаизмов. Маркер сноски поставлен после выражения, к которому относится пояснение.
