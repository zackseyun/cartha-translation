translation:
  language: ru
  text: Ярость жестока, и гнев — бурный поток, но кто устоит перед ревностью[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завистью». Еврейское слово קִנְאָה в зависимости от контекста может означать ревность или зависть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזְרִיּוּת
  choice: жестока
  rationale: Существительное обозначает жестокость или суровость; в русском безглагольное сочетание естественно передаётся сказуемым «жестока», сохраняя смысл и параллелизм.
- source_word: חֵמָה
  choice: ярость
  rationale: Слово выражает сильный, пылающий гнев. «Ярость» передаёт интенсивность и позволяет отличить его от אָף в следующей части строки.
- source_word: שֶׁטֶף
  choice: бурный поток
  rationale: Существительное обозначает разлив, наводнение или стремительный поток. «Бурный поток» сохраняет образ неудержимой, сметающей силы и звучит естественно по-русски.
- source_word: אָף
  choice: гнев
  rationale: Хотя исходное значение связано с «носом», здесь это устойчивое обозначение гнева. Выбор также сохраняет различие с חֵמָה, переданным как «ярость».
- source_word: וּמִי
  choice: но кто
  rationale: Союз с вопросительным местоимением вводит кульминационное противопоставление; «но кто» естественно передаёт этот риторический переход.
- source_word: יַעֲמֹד
  choice: устоит
  rationale: Глагол буквально значит «стоять» и в данном контексте подразумевает способность выдержать натиск. «Устоит» сохраняет конкретный образ и риторическую силу вопроса.
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог буквально означает «перед, пред лицом». Русское «перед» сохраняет пространственный образ и естественно сочетается с «устоит».
- source_word: קִנְאָה
  choice: ревностью
  rationale: Слово может означать ревность, зависть или рвение. В контексте разрушительных страстей «ревность» хорошо передаёт чувство, представляющее особенно грозную силу; возможное значение «зависть» отмечено в сноске.
theological_decisions:
- issue: Многозначность קִנְאָה
  choice: ревность
  alternative: зависть
  rationale: Контекст не позволяет полностью исключить ни ревность, ни зависть. Основной текст использует «ревность», а подлинная лексическая неоднозначность сохранена в сноске без навязывания богословского толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и образная формулировка. Тире и сравнение «словно бурный поток» делают метафорическую связь ясной, не ослабляя поэтического параллелизма.
