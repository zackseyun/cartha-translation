  text: A stone is heavy[a], and sand is weighty, but a fool’s anger is heavier than both of them.
translation:
  language: ru
  text: Тяжёл камень, тяжёл груз песка, но гнев глупца[a] тяжелее их обоих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «досада глупца». Еврейское слово может означать гнев или досаду; в стихе сохраняется образ тяжести.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּבֶד אֶבֶן
  choice: Тяжёл камень
  rationale: Еврейское именное выражение буквально передаёт тяжесть камня; краткое русское сказуемое сохраняет афористичность и корневую перекличку с כָּבֵד в конце стиха.
- source_word: נֵטֶל הַחוֹל
  choice: весом песок
  rationale: נֵטֶל обозначает груз, ношу или вес. Формулировка «весом песок» естественно передаёт ощутимую тяжесть массы песка и поддерживает параллелизм.
- source_word: כַעַס
  choice: досада
  rationale: Слово может обозначать раздражение, досаду, гнев, а также причиняемое огорчение. «Досада» позволяет сохранить неоднозначность между состоянием глупца и тяготой, которую он причиняет.
- source_word: אֱוִיל
  choice: от глупца
  rationale: Предлог «от» естественно допускает понимание как исходящей от глупца досады, так и досады, причиняемой глупцом, не вынуждая выбрать только одно толкование связи.
- source_word: כָּבֵד מִשְּׁנֵיהֶם
  choice: тяжелее их обоих
  rationale: Сравнительная степень прямо выражает значение конструкции с מִן; местоимение относится вместе к камню и песку.
