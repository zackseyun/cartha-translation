  text: Iron sharpens iron[a], and a man sharpens the face of his friend.
translation:
  language: ru
  text: 'Железо оттачивает железо,

    и человек оттачивает своего друга.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и человек оттачивает лицо своего друга». Значение этого образа не вполне ясно; он может указывать на то, что один человек способствует совершенствованию другого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל בְּבַרְזֶל
  choice: железо железом
  rationale: Существительное означает «железо», а предлог בְּ указывает на средство. Русский творительный падеж естественно передаёт значение «железом» и сохраняет сжатый параллелизм пословицы.
- source_word: יָחַד / יַחַד
  choice: оттачивается / оттачивает
  rationale: В данной породе и контексте глагол означает «делать острым, точить». «Оттачивать» подходит и для железа, и для переносного совершенствования человека; возвратная форма в первой строке естественно выражает действие одного железа на другое.
- source_word: וְאִישׁ
  choice: и человек
  rationale: אִישׁ — существительное мужского рода со значением «мужчина, человек». В русском «человек» сохраняет единственное число и обобщающий характер мудрого изречения без ненужного сужения смысла до взрослого мужчины.
- source_word: פְּנֵי רֵעֵהוּ
  choice: друга своего
  rationale: 'Буквально: «лицо своего ближнего/друга». В сочетании с «оттачивать» слово «лицо» по-русски создаёт неясный или ошибочный образ; метонимически выражение относится к самому другу. Буквальная форма сохранена в сноске.'
theological_decisions:
- issue: Обобщающее мужское единственное число в литературе мудрости
  choice: человек
  alternative: мужчина / муж
  rationale: Русское «человек» точно передаёт обобщающее אִישׁ и применимость изречения к людям вообще, не вводя конфессионального или доктринального толкования.
- issue: Смысл выражения «оттачивает лицо друга»
  choice: оттачивает друга своего
  alternative: оттачивает лицо друга своего
  rationale: Перевод передаёт вероятный метонимический смысл, но не уточняет, что именно улучшается — ум, характер или поведение. Поэтому присущая образу смысловая открытость сохраняется, а буквальное чтение указано в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Повтор «оттачивается / оттачивает» сохраняет связь двух строк, а слегка возвышенное «друга своего» поддерживает достоинство библейской пословицы без архаизации.
