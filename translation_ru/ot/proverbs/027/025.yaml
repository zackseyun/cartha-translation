  text: גָּלָ֣ה חָ֭צִיר וְ/נִרְאָה דֶ֑שֶׁא וְ֝/נֶאֶסְפ֗וּ עִשְּׂב֥וֹת הָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/025.yaml
  text: The hay is removed[a], and the new growth appears[c][b], and the grasses of the mountains are gathered.
translation:
  language: ru
  text: Трава убрана[a], и появляется свежая зелень[b], и собирают горные травы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «трава исчезает» или «трава обнажается». Еврейский глагол означает, что нечто открывается или убирается; здесь, вероятно, имеется в виду удаление травы, возможно при сенокосе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «молодая трава», «свежая трава».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלָה
  choice: скошена
  rationale: Глагол буквально означает «открыться, быть убранным». В сельскохозяйственном контексте с חָצִיר передаёт исчезновение травы вследствие сенокоса; «скошена» ясно выражает подразумеваемое действие, не превращая его в завершенную заготовку сена.
- source_word: חָצִיר
  choice: трава
  rationale: Слово может обозначать траву или травяной корм. Русское «трава» естественно сочетается со «скошена» и не создаёт нелогичного образа повторного удаления уже высушенного сена.
- source_word: נִרְאָה
  choice: появляется
  rationale: Нифаль означает «становится видимым, показывается»; «появляется» естественно описывает новую растительность.
- source_word: דֶשֶׁא
  choice: свежая зелень
  rationale: Существительное обозначает молодую зелёную растительность. «Свежая зелень» сохраняет образ нового роста и избегает неестественного повтора слова «трава».
- source_word: נֶאֶסְפוּ
  choice: собирают
  rationale: Форма допускает пассивное «собраны/собираются», однако русский неопределённо-личный оборот естественно передаёт действие без названного деятеля и сохраняет сельскохозяйственный смысл.
- source_word: עִשְּׂבוֹת
  choice: травы
  rationale: Слово широко обозначает травянистую растительность. «Травы» уместнее в пастбищно-кормовом контексте, чем способные вызвать кулинарные ассоциации «пряные травы» или слишком общее «растения».
- source_word: הָרִים
  choice: горные
  rationale: Множественное число הָרִים прямо означает «горы»; прилагательное «горные» естественно передаёт конструкцию принадлежности «травы гор».
