source:
  edition: WLC
  text: כְּבָשִׂ֥ים לִ/לְבוּשֶׁ֑/ךָ וּ/מְחִ֥יר שָׂ֝דֶ֗ה עַתּוּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/026.yaml
  text: Lambs are for your clothing[a], and goats are the price of a field.
translation:
  language: ru
  text: Ягнята[a] — тебе на одежду, а козлы — плата за поле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овцы». Еврейское слово может обозначать молодых овец, ягнят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבָשִׂים
  choice: ягнята
  rationale: Существительное обозначает молодых овец, ягнят; этот прямой эквивалент сохраняет конкретность еврейского текста. Возможное более широкое понимание «овцы» отмечено в сноске.
- source_word: לִלְבוּשֶׁךָ
  choice: тебе на одежду
  rationale: Предлог לְ выражает назначение, а суффикс второго лица — принадлежность адресату. Такая формулировка естественно передаёт мысль о том, что стадо обеспечивает материал или средства для одежды.
- source_word: וּמְחִיר
  choice: а … плата
  rationale: מְחִיר означает «цена, плата, покупная стоимость». Связка в еврейском опущена; русское именное предложение с тире сохраняет краткость пословицы.
- source_word: שָׂדֶה
  choice: за поле
  rationale: שָׂדֶה обычно означает возделываемое поле или земельный участок. Предлог «за» естественно передаёт отношение цены к приобретаемому полю.
- source_word: עַתּוּדִים
  choice: козлы
  rationale: Еврейское слово конкретно обозначает козлов, то есть самцов коз. Русское «козлы» передаёт эту точность без необходимости обобщать до «козы».
theological_decisions: []
translation_notes:
  register: Краткая, ритмичная формулировка в современном литературном русском сохраняет параллелизм и хозяйственную образность оригинала. Тире восполняют подразумеваемую связку, не утяжеляя пословицу.
