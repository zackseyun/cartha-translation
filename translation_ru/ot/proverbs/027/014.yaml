  yaml_path: translation/ot/proverbs/027/014.yaml
  text: Whoever blesses his neighbor with a loud voice[a], rising early in the morning[c][b], it will be counted to him as a curse.
translation:
  language: ru
  text: Кто рано утром громким голосом благословляет своего ближнего[a], тому это будет засчитано как проклятие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего друга»; или: «своего товарища».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет сочтено ему проклятием». Возможный смысл: для ближнего такое показное и неуместно громкое благословение, произнесённое рано утром, звучит как проклятие.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מְבָרֵךְ
  choice: благословляет
  rationale: Причастная форма Piel от ברך обозначает произнесение благословения; буквальный смысл сохранён, а ирония раскрывается контекстом.
- source_word: רֵעֵהוּ
  choice: своего ближнего
  rationale: רֵעַ может означать ближнего, друга или товарища. «Ближний» сохраняет широкий межличностный смысл, не предполагая непременно близкой дружбы.
- source_word: בְּקוֹל גָּדוֹל
  choice: громким голосом
  rationale: Конкретное еврейское выражение передаёт не просто громкость, но навязчивую манеру обращения.
- source_word: בַּבֹּקֶר הַשְׁכֵּים
  choice: с раннего утра
  rationale: הַשְׁכֵּים подчёркивает раннее время и намеренную поспешность. Естественное русское выражение передаёт этот акцент без тяжеловесного «встав рано утром».
- source_word: קְלָלָה
  choice: проклятие
  rationale: Существительное прямо означает «проклятие» и создаёт ироническое противопоставление благословению.
- source_word: תֵּחָשֶׁב לוֹ
  choice: тому это зачтётся за
  rationale: 'Нифаль от חשב передаёт пассивное «быть сочтённым, признанным, зачтённым». Формулировка сохраняет неоднозначность: проклятием может считаться поступок благословляющего либо благословение может восприниматься так адресатом.'
theological_decisions:
- issue: К кому относится לוֹ в заключительной части
  choice: «тому это зачтётся за проклятие» — с отнесением к благословляющему
  alternative: «это будет воспринято им как проклятие» — с отнесением к ближнему
  rationale: Ближайший грамматический субъект всего изречения — благословляющий, поэтому основной текст естественно связывает לוֹ с ним. Однако еврейская конструкция допускает понимание адресата как того, для кого благословение звучит проклятием; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой афористичной структурой. Сохранены ключевые образы «благословение — проклятие» и «громкий голос»; громоздкая буквальная конструкция о раннем вставании передана естественным «с раннего утра».
