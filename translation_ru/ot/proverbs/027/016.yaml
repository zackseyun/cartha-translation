  text: Whoever restrains her restrains the wind[a], and his right hand grasps oil.
translation:
  language: ru
  text: Кто удерживает её, тот удерживает ветер, а масло на его правой руке выдаёт себя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и масло его правой руки взывает». Смысл этой трудной еврейской фразы не вполне ясен; «выдаёт себя» передаёт вероятный смысл: масло обнаруживает своё присутствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפְנֶיהָ
  choice: кто удерживает её
  rationale: Причастная форма с суффиксом 3-го лица женского рода отсылает к сварливой жене из предыдущего стиха. В данном сравнении צפן означает попытку сдержать или удержать, а не просто скрыть.
- source_word: צָפַן
  choice: удерживает
  rationale: Повтор того же русского глагола сохраняет словесный повтор еврейского текста и подчёркивает невозможность удержать ветер.
- source_word: רוּחַ
  choice: ветер
  rationale: Конкретный образ чего-то неуловимого и неподвластного человеку указывает здесь на ветер, а не на дух.
- source_word: וְשֶׁמֶן
  choice: масло
  rationale: Общее слово «масло» точно передаёт еврейское существительное; уточнение «оливковое» в тексте отсутствует.
- source_word: יְמִינוֹ
  choice: правой рукой
  rationale: Сохраняется явное указание на правую руку и телесный образ попытки удержать скользкое масло.
- source_word: יִקְרָא
  choice: пытается схватить
  rationale: Обычное значение глагола — «зовёт», но в данном трудном контексте буквальное прочтение не даёт ясного смысла. Передача «пытается схватить» выражает параллельный образ тщетной попытки удержать неуловимое; буквальная возможность отмечена в сноске.
