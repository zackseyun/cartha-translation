  text: עָר֤וּם רָאָ֣ה רָעָ֣ה נִסְתָּ֑ר פְּ֝תָאיִ֗ם עָבְר֥וּ נֶעֱנָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/012.yaml
  text: A prudent man sees danger and hides himself[a], but the simple pass on and suffer for it.
translation:
  language: ru
  text: Благоразумный видит беду и укрывается, а неопытные идут дальше и бывают наказаны[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «терпят последствия». Еврейское слово может означать как наказание, так и претерпевание последствий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: благоразумный
  rationale: В Книге Притчей слово обычно обозначает положительное качество — предусмотрительность и здравую рассудительность. Субстантивированное прилагательное естественно передаёт еврейскую форму без добавления отсутствующего в оригинале существительного.
- source_word: רָאָה
  choice: видит
  rationale: Форма совершенного вида употреблена в обобщённом, пословичном значении; настоящее время естественно для русской сентенции.
- source_word: רָעָה
  choice: беду
  rationale: Существительное может означать зло, бедствие или грозящий вред. «Беда» сохраняет широту значения и подходит к опасности, которую можно заранее заметить.
- source_word: נִסְתָּר
  choice: укрывается
  rationale: Нифаль выражает действие по сокрытию или уходу в укрытие перед лицом беды. «Укрывается» естественно и передаёт защитный смысл.
- source_word: פְּתָאיִם
  choice: неопытные
  rationale: Это характерное для литературы мудрости обозначение людей простодушных, неискушённых и лишённых рассудительности. «Неопытные» понятно современному читателю и не звучит как бытовое оскорбление.
- source_word: עָבְרוּ
  choice: идут дальше
  rationale: 'Глагол противопоставляет их поведение предусмотрительности благоразумного: они продолжают путь, не принимая мер предосторожности.'
- source_word: נֶעֱנָשׁוּ
  choice: бывают наказаны
  rationale: Нифаль от ענשׁ прямо допускает значение наказания или взыскания. Обобщённая форма «бывают наказаны» соответствует пословичному характеру стиха, а более широкое понимание последствий отмечено в сноске.
theological_decisions:
- issue: Характер наказания в נֶעֱנָשׁוּ
  choice: Не уточнять, кто именно наказывает и является ли наказание судебным или непосредственным последствием неосторожности.
  alternative: Представить бедствие как прямое Божье наказание либо только как естественное последствие.
  rationale: Еврейский текст не называет действующее лицо и допускает как наказание, так и несение неблагоприятных последствий; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены противопоставление единственного и множественного числа и характерная для притчи параллельность; избегаются архаизмы «простой» и «подвергаются взысканию».
