base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/014.yaml
  text: Blessed is the man who is always fearful[b][a], but whoever hardens his heart will fall into calamity.
translation:
  language: ru
  text: Блажен человек, который всегда боится[a], а кто ожесточает своё сердце, тот попадёт в беду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который непрестанно страшится». В еврейском тексте не сказано прямо, чего именно он боится.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «падёт во зло», «падёт в несчастье» или «падёт в бедствие». Еврейское слово רָעָה может обозначать зло, вред, беду или бедствие; здесь, вероятно, имеется в виду губительное несчастье.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Форма блаженства выражает завидное, благополучное состояние и сохраняет возвышенный регистр литературы мудрости.
- source_word: אָדָם
  choice: человек
  rationale: В данном изречении слово обозначает отдельного человека в обобщённом смысле; русское «человек» естественно передаёт это значение.
- source_word: מְפַחֵד תָּמִיד
  choice: который всегда боится
  rationale: Глагольная форма от פחד обозначает страх или боязнь, а תָּמִיד — постоянство. Перевод сохраняет прямое значение и не добавляет отсутствующий в еврейском тексте объект страха.
- source_word: וּמַקְשֶׁה לִבּוֹ
  choice: а кто ожесточает своё сердце
  rationale: Порода hифиль от קשה означает «делать твёрдым, ожесточать»; устойчивое русское выражение сохраняет нравственно-волевой смысл упрямства.
- source_word: יִפּוֹל בְּרָעָה
  choice: тот попадёт в беду
  rationale: Буквальный образ «упадёт в бедствие» по-русски звучит менее естественно. «Попадёт в беду» ясно передаёт следствие, тогда как רָעָה здесь допускает значения беды, зла, несчастья или бедствия.
theological_decisions:
- issue: Объект похвального страха в первой половине стиха
  choice: 'Не указывать объект: «всегда боится»'
  alternative: «Всегда боится Господа» или «всегда осторожен»
  rationale: В еврейском тексте объект глагола не назван. Добавление «Господа» разрешило бы сохранённую текстом неоднозначность, а «осторожен» ослабило бы прямое значение פחד.
- issue: Смысл רָעָה как последствия ожесточения сердца
  choice: «беда»
  alternative: «зло», «несчастье» или «бедствие»
  rationale: Контекст указывает прежде всего на гибельное несчастье как последствие, однако примечание сохраняет более широкий смысловой диапазон еврейского слова.
translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified пословичным строем. «Блажен» сохраняет традиционный регистр формулы мудрости, а «попадёт в беду» обеспечивает естественность без устранения отмеченной в сноске многозначности.
