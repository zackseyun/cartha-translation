  text: בְּ/ק֣וּם רְ֭שָׁעִים יִסָּתֵ֣ר אָדָ֑ם וּ֝/בְ/אָבְדָ֗/ם יִרְבּ֥וּ צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/028.yaml
  text: When the wicked rise[a], a man hides himself, but when they perish[b], the righteous increase.
translation:
  language: ru
  text: Когда возвышаются нечестивые, человек скрывается[a], а когда они погибают, праведников становится больше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек оказывается скрыт»; форма еврейского глагола допускает как возвратное значение («скрывается»), так и страдательное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקוּם
  choice: когда возвышаются
  rationale: Предлог ב с инфинитивом קום образует временную конструкцию. «Возвышаются» сохраняет образ подъёма и вероятный общественный смысл, не уточняя прямо, что речь непременно о приходе к власти.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, для которых характерно нечестие; это традиционное и понятное обозначение нравственной категории.
- source_word: יִסָּתֵר
  choice: скрывается
  rationale: Порода нифаль допускает возвратное/среднее и страдательное понимание. В основном тексте выбрано естественное по-русски возвратное значение, а неоднозначность отражена в сноске.
- source_word: אָדָם
  choice: человек
  rationale: Единственное число употреблено обобщённо и обозначает любого человека; русское «человек» сохраняет форму и афористичность без ненужного указания на пол.
- source_word: וּבְאָבְדָם
  choice: а когда они погибают
  rationale: Союз и временная конструкция с местоименным суффиксом переданы придаточным времени. «А» естественно выражает противопоставление двух половин изречения.
- source_word: יִרְבּוּ
  choice: становится больше
  rationale: Глагол רבה означает увеличение числа или заметного присутствия. Такая формулировка звучит естественно и не сводит смысл к буквальному размножению.
- source_word: צַדִּיקִים
  choice: праведников
  rationale: Субстантивированное множественное число обозначает людей, отличающихся праведностью; родительный падеж требуется русской конструкцией «становится больше».
