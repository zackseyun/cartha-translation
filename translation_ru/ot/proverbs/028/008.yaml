  yaml_path: translation/ot/proverbs/028/008.yaml
  text: Whoever increases his wealth by interest and profit gathers it for one who is gracious to the poor[a][b].
translation:
  language: ru
  text: Кто умножает своё богатство процентами и прибылью, тот собирает его для того, кто проявляет милость к бедным[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лихвой и приростом». Оба еврейских слова обозначают доход от ссуды, часто с оттенком эксплуатации должника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для того, кто щедр к бедным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבֶּה
  choice: умножает
  rationale: Причастие породы хифиль от רבה означает «делать многочисленным, увеличивать»; «умножает» естественно сочетается с богатством и сохраняет лаконичность притчи.
- source_word: הוֹנוֹ
  choice: своё богатство
  rationale: הוֹן обозначает богатство, достаток или имущество; «богатство» ясно передаёт смысл, а возвратное «своё» естественно выражает принадлежность субъекту.
- source_word: בְּנֶשֶׁךְ
  choice: ростовщичеством
  rationale: נֶשֶׁךְ обозначает процент, взимаемый по займу, нередко с оттенком эксплуатации; «ростовщичество» передаёт этот отрицательный оттенок в современном русском языке.
- source_word: וּבְתַרְבִּית
  choice: и наживой
  rationale: תַּרְבִּית означает прирост или прибыль, особенно надбавку при ссуде. «Нажива» отличает второй термин от первого и сохраняет неодобрительный оттенок контекста, хотя точный финансовый смысл пояснён в сноске.
- source_word: לְחוֹנֵן
  choice: для того, кто милует
  rationale: חנן значит проявлять милость или благоволение. Формулировка «тот, кто милует» сохраняет смысл милосердного отношения, не сводя его только к материальной щедрости.
- source_word: דַּלִּים
  choice: бедных
  rationale: דַּל может обозначать бедного, слабого или неимущего; финансовый контекст делает «бедных» наиболее прямым соответствием.
- source_word: יִקְבְּצֶנּוּ
  choice: собирает его
  rationale: 'קבץ означает собирать или накапливать; местоименный суффикс отсылает к богатству. Буквальное «собирает его» сохраняет иронию: накопитель фактически готовит богатство для другого.'
theological_decisions:
- issue: Кому в итоге достаётся неправедно накопленное богатство
  choice: для того, кто милует бедных
  alternative: для щедрого к бедным
  rationale: Текст не называет конкретного лица и не объясняет механизм передачи богатства. Перевод сохраняет обобщённость и не вводит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Ростовщичество» и «нажива» понятны широкому читателю и передают отрицательную оценку способа обогащения; более буквальная финансовая формулировка сохранена в сноске. Оба маркера сносок стоят в основном тексте.
