  source_fidelity: 'В целом структура и референты переданы верно: מַרְבֶּה הוֹנוֹ — «умножает своё богатство», а יִקְבְּצֶנּוּ — «собирает/накапливает его». Однако «нажива» не является достаточно точным соответствием תַרְבִּית, которое в данном сочетании обозначает прирост/добавочный доход по займу. В основном тексте лучше сохранить финансовый смысл обоих терминов без чрезмерной интерпретации.'
