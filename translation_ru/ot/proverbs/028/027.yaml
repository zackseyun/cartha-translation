  text: נוֹתֵ֣ן לָ֭/רָשׁ אֵ֣ין מַחְס֑וֹר וּ/מַעְלִ֥ים עֵ֝ינָ֗י/ו רַב מְאֵרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/027.yaml
  text: Whoever gives to the poor will have no lack[a], but he who hides his eyes will have many curses.
translation:
  language: ru
  text: Кто даёт бедному, тот не будет нуждаться, а у того, кто закрывает глаза[a], будет много проклятий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отводит взгляд» — то есть намеренно не замечает нуждающегося.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן לָרָשׁ
  choice: Кто даёт бедному
  rationale: Причастие נוֹתֵן имеет обобщённо-пословичный смысл, а רָשׁ обозначает бедного, неимущего человека. Эта формулировка естественно передаёт повторяющееся нравственное действие.
- source_word: אֵין מַחְסוֹר
  choice: тот не будет нуждаться
  rationale: Конструкция буквально выражает отсутствие недостатка или нужды; русский вариант ясно передаёт обещанный результат, не уточняя его природу.
- source_word: וּמַעְלִים עֵינָיו
  choice: а кто закрывает глаза[a]
  rationale: Образное выражение означает намеренно не замечать бедного или отворачиваться от его нужды. Сохранён телесный образ, естественный и в современном русском языке.
- source_word: רַב מְאֵרוֹת
  choice: на того падёт много проклятий
  rationale: 'В еврейском тексте это безглагольная конструкция: буквально «много проклятий». Добавленный глагол естественно выражает подразумеваемое последствие, не определяя, от кого именно исходят проклятия.'
theological_decisions:
- issue: Характер обещания об отсутствии нужды
  choice: не будет нуждаться
  alternative: ни в чём не будет недостатка
  rationale: Перевод сохраняет обобщённое пословичное обещание и не превращает его в подробную гарантию материального благополучия.
- issue: Источник и действие проклятий
  choice: на того падёт много проклятий
  alternative: у того будет много проклятий
  rationale: Исходный текст не называет источник проклятий и не содержит явного глагола; формулировка сохраняет эту неопределённость и передаёт их как последствие.
translation_notes:
  register: Современный литературный русский язык; краткий, уравновешенный пословичный строй. Образ «закрывает глаза» сохранён, а его идиоматический смысл пояснён в сноске.
