  source_fidelity: 'Основной смысл передан верно: נָגִיד — «правитель», חֲסַר תְּבוּנוֹת — недостаток рассудительности, а שׂנֵא בֶצַע — человек, отвергающий корыстную/нечестную выгоду. Однако «множит притеснения» может означать именно увеличение уже существующих притеснений, тогда как וְרַב מַעֲשַׁקּוֹת характеризует правителя как совершающего многочисленные притеснения. Сноска a также неточно называет буквальным выражение «велик притеснениями»: конструкция буквально ближе к «и мног в притеснениях».'
