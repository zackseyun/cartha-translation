  text: נָגִ֗יד חֲסַ֣ר תְּ֭בוּנוֹת וְ/רַ֥ב מַעֲשַׁקּ֑וֹת שנאי בֶ֝֗צַע יַאֲרִ֥יךְ יָמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/016.yaml
  text: A ruler lacking understanding is great in acts of oppression[b][a], but one who hates unjust gain will prolong his days.
translation:
  language: ru
  text: Правитель, лишённый разумения, совершает множество притеснений[a], а тот, кто ненавидит неправедную наживу[b], продлит свои дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершает множество вымогательств». Буквально: «и мног в притеснениях».'
    reason: lexical_alternative
  - marker: b
    text: «Неправедную наживу» можно также перевести как «корыстную выгоду» или «нечестно добытое богатство».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָגִיד
  choice: правитель
  rationale: Слово обозначает человека, наделённого властью; «правитель» естественно звучит по-русски и не сужает смысл до монарха или князя.
- source_word: חֲסַר תְּבוּנוֹת
  choice: лишённый разумения
  rationale: Оборот указывает на недостаток рассудительности и способности принимать здравые решения. «Разумение» сохраняет связь с лексикой учительной литературы и остаётся понятным современному читателю.
- source_word: וְרַב מַעֲשַׁקּוֹת
  choice: множит притеснения
  rationale: Буквальное «велик/мног в притеснениях» по-русски неестественно. Глагольная передача выражает многочисленные или повторяющиеся действия угнетателя, не сводя значение только к вымогательству.
- source_word: שׂנֵא בֶצַע
  choice: тот, кто ненавидит неправедную наживу
  rationale: בֶצַע обозначает корыстную, часто добытую нечестным путём выгоду. «Неправедная нажива» передаёт отрицательную нравственную оценку, тогда как нейтральная «прибыль» её утратила бы.
- source_word: יַאֲרִיךְ יָמִים
  choice: продлит свои дни
  rationale: Сохранён обычный древнееврейский образ долгой жизни; по-русски выражение понятно и соответствует форме исходного текста.
theological_decisions:
- issue: Характер противопоставления между угнетающим правителем и ненавидящим неправедную наживу
  choice: Сохранить обобщённое противопоставление через «а тот, кто»
  alternative: 'Отнести обе характеристики непосредственно к одному правителю: «но если он ненавидит неправедную наживу…»'
  rationale: Вторая часть в еврейском тексте выражена самостоятельным причастным оборотом и естественно читается как общее противопоставление двух типов людей; при этом перевод не добавляет обещания, специально ограниченного правителем.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией учительной книги. «Разумение» и «продлит свои дни» сохраняют библейскую образность, а «множит притеснения» устраняет неестественный буквальный синтаксис.
