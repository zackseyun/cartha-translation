lexical_decisions:
- source_word: מֵסִיר
  choice: отворачивает
  rationale: Причастие породы хифиль описывает характерное, сознательное действие. «Отворачивает» передаёт волевой отказ и сохраняет образ исходного текста.
- source_word: אָזְנוֹ
  choice: ухо
  rationale: Сохранён буквальный телесный образ отказа слушать; по-русски он понятен без замены на отвлечённое «слух».
- source_word: מִשְּׁמֹעַ
  choice: чтобы не слушать
  rationale: Так естественно по-русски выражен отказ от слушания, обозначенный сочетанием предлога מִן с инфинитивом; формулировка не сводит действие к простой физической неспособности слышать.
- source_word: תּוֹרָה
  choice: закон
  rationale: «Закон» сохраняет авторитетный и заветный оттенок תּוֹרָה. Более широкие значения — «наставление» и «учение» — указаны в сноске.
- source_word: גַּם
  choice: даже
  rationale: '«Даже» передаёт усилительную силу גַּם: отвергающий Божье наставление делает отвратительной даже собственную молитву.'
- source_word: תְּפִלָּתוֹ
  choice: его молитва
  rationale: Прямое и контекстуально точное соответствие обычному значению существительного תְּפִלָּה.
- source_word: תּוֹעֵבָה
  choice: мерзость
  rationale: «Мерзость» сохраняет резкую нравственно-религиозную оценку еврейского слова и его устойчивое библейское звучание, не смягчая утверждение.
theological_decisions:
- issue: Объём значения תּוֹרָה в контексте литературы мудрости
  choice: «закон» в смысле авторитетного Божьего наставления
  alternative: «наставление» или «учение»
  rationale: Основной вариант сохраняет властный и заветный оттенок слова, не ограничивая его одними юридическими предписаниями; допустимая более широкая семантика отмечена в сноске.
- issue: Связь между отказом слушать и оценкой молитвы
  choice: 'Сохранено прямое утверждение: «даже его молитва — мерзость»'
  alternative: Смягчённые варианты вроде «его молитва неугодна»
  rationale: Исходный текст употребляет сильное слово תּוֹעֵבָה и не объясняет механизм этой связи; перевод сохраняет напряжённость высказывания, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением образа уха и краткого, резкого параллелизма притчи. Тире подчёркивает усилительный переход ко второй половине стиха; связка «есть» естественно опущена.
