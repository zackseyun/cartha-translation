  text: נִֽבֳהָ֥ל לַ/ה֗וֹן אִ֭ישׁ רַ֣ע עָ֑יִן וְ/לֹֽא יֵ֝דַע כִּי חֶ֥סֶר יְבֹאֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/022.yaml
  text: A man with an evil eye hastens after wealth[a], and does not know that poverty will come upon him.
translation:
  language: ru
  text: Алчный человек[a] спешит разбогатеть и не знает, что его постигнет нужда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек с дурным глазом» — еврейское выражение о скупом, завистливом или алчном человеке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֳהָל לַהוֹן
  choice: спешит разбогатеть
  rationale: Причастие Niphal от בהל передаёт поспешность и торопливость, а לַהוֹן указывает на богатство как цель. Русское сочетание естественно выражает поспешную погоню за богатством.
- source_word: אִישׁ רַע עָיִן
  choice: алчный человек
  rationale: Буквально выражение означает «человек с дурным глазом» и описывает эгоистичную, завистливую, скупую или алчную установку. В современном русском буквальная калька прежде всего ассоциируется со сглазом, поэтому в тексте выбран понятный по контексту вариант, а широта идиомы сохранена в сноске.
- source_word: וְלֹא יֵדַע
  choice: и не знает
  rationale: Прямая передача еврейского сочинения и формы глагола без добавления причинного или уступительного оттенка.
- source_word: חֶסֶר
  choice: нужда
  rationale: Слово обозначает недостаток, нехватку, нужду. «Нужда» сохраняет более широкий смысл, чем исключительно финансовая «бедность», и естественно звучит в предупреждении.
- source_word: יְבֹאֶנּוּ
  choice: его постигнет
  rationale: Буквально нужда «придёт к нему». «Постигнет» естественно передаёт наступление нежелательного последствия и сохраняет предостерегающий тон.
