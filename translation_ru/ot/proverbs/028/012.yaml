source:
  edition: WLC
  text: בַּ/עֲלֹ֣ץ צַ֭דִּיקִים רַבָּ֣ה תִפְאָ֑רֶת וּ/בְ/ק֥וּם רְ֝שָׁעִ֗ים יְחֻפַּ֥שׂ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/012.yaml
  text: When the righteous rejoice[a], there is great glory, but when the wicked rise, people hide themselves.
translation:
  language: ru
  text: Когда праведники торжествуют, велика слава, а когда возвышаются нечестивые, человек скрывается.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «люди прячутся». Еврейский текст употребляет обобщающее единственное число: «человек скрывается» (буквально: «человек бывает скрыт»).'
    reason: Уточнение обобщающего значения אָדָם и пассивной формы יְחֻפַּשׂ.
lexical_decisions:
- source_word: בַּעֲלֹץ
  choice: когда … торжествуют
  rationale: Предлог ב с инфинитивом образует временную конструкцию. «Торжествуют» передаёт радостное ликование и сохраняет возвышенный, но понятный регистр.
- source_word: צַדִּיקִים
  choice: праведники
  rationale: Субстантивированное множественное число обозначает людей, поступающих праведно; традиционное русское соответствие естественно для литературы мудрости.
- source_word: רַבָּה תִפְאָרֶת
  choice: велика слава
  rationale: Предикативное רַבָּה выражает величину или изобилие, а תִפְאָרֶת — славу, честь и общественное великолепие. Краткая конструкция сохраняет поэтический параллелизм.
- source_word: וּבְקוּם
  choice: а когда возвышаются
  rationale: ו вводит контраст, а ב с инфинитивом קום имеет временное значение. «Возвышаются» естественно указывает на усиление влияния или приход к власти, не сводя смысл только к политической должности.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Стандартное обозначение нравственно порочных людей в библейской литературе мудрости.
- source_word: יְחֻפַּשׂ
  choice: скрывается
  rationale: В данном контексте форма передаёт исчезновение человека из общественного пространства при возвышении нечестивых. Русская возвратная форма естественнее буквального пассивного выражения «бывает скрыт».
- source_word: אָדָם
  choice: человек
  rationale: 'Единственное число имеет обобщающее значение: речь идёт о человеке как представителе обычных людей. Русское «человек» сохраняет и число, и родовое употребление исходного слова.'
theological_decisions:
- issue: Обобщающее единственное число אָדָם
  choice: человек
  alternative: люди
  rationale: Перевод сохраняет грамматическое единственное число и одновременно допускает собирательный смысл; примечание поясняет, что высказывание относится к людям вообще.
- issue: Образ возвышения нечестивых
  choice: возвышаются
  alternative: восстают
  rationale: Контекст противопоставляет общественное процветание при праведных и уход людей из виду при усилении нечестивых. «Возвышаются» сохраняет этот смысл, не добавляя прямого утверждения о конкретной форме власти.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Лексика возвышенная, но общепонятная; сохранены противопоставление двух строк и обобщающее единственное число.
