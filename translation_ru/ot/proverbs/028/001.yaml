  text: The wicked flee when no one is pursuing[a], but the righteous are confident like a young lion.
translation:
  language: ru
  text: Нечестивый бежит, хотя никто не гонится за ним[a], а праведники уверены, как молодой лев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нечестивый бежит, когда никто не гонится за ним… а праведники уверены, как молодой лев». Еврейский текст допускает несколько смысловых оттенков в обеих частях стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוּ
  choice: бежит
  rationale: Форма буквально имеет значение «бежали», но в контексте изречения выражает общую закономерность; настоящее время естественно для русского афористического стиля.
- source_word: וְאֵין רֹדֵף
  choice: хотя никто не гонится за ним
  rationale: 'אֵין с причастием указывает на отсутствие преследующего. Союз «хотя» естественно передаёт парадокс: бегство происходит без реальной погони.'
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Единственное число употреблено как обобщённый нравственный тип; русское субстантивированное прилагательное сохраняет эту форму и контраст.
- source_word: וְצַדִּיקִים
  choice: а праведники
  rationale: Субстантивированное прилагательное во множественном числе обозначает нравственную категорию; «а» ясно вводит противопоставление.
- source_word: כִּכְפִיר
  choice: как молодой лев
  rationale: כְּפִיר обозначает молодого льва; перевод сохраняет более конкретный смысл, не ослабляя образ.
- source_word: יִבְטָח
  choice: бесстрашны
  rationale: Глагол בטח может означать доверие, уверенность или чувство безопасности. В противопоставлении бегству и в сравнении со львом контекстуально уместно состояние смелой, спокойной уверенности; «бесстрашны» естественно выражает его по-русски, не добавляя объекта доверия.
theological_decisions:
- issue: Обобщённые нравственные типы в единственном и множественном числе
  choice: Сохранить «нечестивый» в единственном числе и «праведники» во множественном.
  alternative: 'Передать обе стороны собирательно: «нечестивые… праведные».'
  rationale: Необычная асимметрия присутствует в еврейском тексте и не мешает естественному русскому звучанию; её не следует без необходимости сглаживать.
- issue: Смысл יִבְטָח в образе льва
  choice: «бесстрашны»
  alternative: «уверены», «чувствуют себя в безопасности», «уповают»
  rationale: Текст не называет объект упования. Выбор передаёт контраст между беспричинным страхом нечестивого и спокойной смелостью праведников, не превращая стих в более узкое утверждение о содержании веры.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим ритмом. Слово «нечестивый» сохраняет достоинство библейской мудрой речи и остаётся понятным; «молодой лев» точно передаёт специфику еврейского существительного.
