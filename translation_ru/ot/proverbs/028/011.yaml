  language: ru
  text: 'Богатый человек мудр в собственных глазах,

    но бедняк, обладающий разумением, исследует его[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распознаёт его», «разберётся в нём». Еврейский глагол может означать тщательно исследовать, распознавать или проникать в истинную сущность человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם בְּעֵינָיו
  choice: мудр в собственных глазах
  rationale: Сохранён еврейский идиом со значением субъективной самооценки; выражение само передаёт мысль о мнимой мудрости, поэтому пояснение «считает себя мудрым» в основной текст не добавлено.
- source_word: אִישׁ עָשִׁיר
  choice: богатый человек
  rationale: Прямо передаёт сочетание существительного и прилагательного; слово «человек» сохраняет личностный и обобщающий характер изречения.
- source_word: וְדַל
  choice: но бедняк
  rationale: Союз ו формально может означать «и», однако здесь вводит явное противопоставление двух частей пословицы, естественно передаваемое русским «но».
- source_word: מֵבִין
  choice: обладающий разумением
  rationale: Причастие от בין обозначает человека, способного понимать и различать. «Разумение» сохраняет связь с библейской лексикой мудрости, оставаясь понятным в современном литературном русском.
- source_word: יַחְקְרֶנּוּ
  choice: распознаёт его
  rationale: Глагол חקר означает тщательно исследовать, разыскивать, постигать; в данном контексте речь идёт о способности бедняка проникнуть за самоуверенную внешность богатого. «Распознаёт» звучит естественно и не фиксирует окончательно, идёт ли речь о разоблачении характера или об исследовании притязаний.
