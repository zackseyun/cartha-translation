translation_notes:
  register: Современный литературный русский с умеренно возвышенной лексикой мудрости. Сохранены параллелизм, мужской единственный образ обоих участников и напряжение между богатством, самоуверенностью и подлинным разумением. Маркер сноски поставлен после глагола, к которому относится лексическая неоднозначность.
