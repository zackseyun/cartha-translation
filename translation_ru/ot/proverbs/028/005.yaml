  text: אַנְשֵׁי רָ֭ע לֹא יָבִ֣ינוּ מִשְׁפָּ֑ט וּ/מְבַקְשֵׁ֥י יְ֝הוָ֗ה יָבִ֥ינוּ כֹֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/005.yaml
  text: Evil men do not understand justice[a], but those who seek Yahweh understand all things.
translation:
  language: ru
  text: Злые люди не понимают справедливости, а те, кто ищет Яхве, понимают всё[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть обладают широким нравственным пониманием, особенно в вопросах справедливости; речь не идёт о безграничном знании всего.
    reason: Поясняет контекстуальный объём абсолютного כֹל, не сужая формулировку основного текста.
lexical_decisions:
- source_word: אַנְשֵׁי רָע
  choice: злые люди
  rationale: Естественно передаёт еврейское сочетание «люди зла» и сохраняет его нравственную характеристику без стилистической тяжеловесности буквального варианта.
- source_word: יָבִינוּ
  choice: понимают
  rationale: Глагол בין охватывает понимание и способность различать; повтор одного русского глагола сохраняет параллелизм двух частей стиха.
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: В контексте литературы мудрости слово обозначает справедливый нравственный порядок, а не только судебное решение.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: те, кто ищет Яхве
  rationale: Передаёт причастную форму как постоянную характеристику людей и звучит естественно на современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כֹל
  choice: всё
  rationale: Прямо сохраняет абсолютное «всё» в еврейском тексте; контекстуальный объём выражения пояснён в сноске, а не сужен в основном тексте.
theological_decisions:
- issue: Объём выражения «понимают всё»
  choice: Сохранить широкую, неуточнённую формулировку еврейского текста, понимая её в контексте как мудростное обобщение о нравственном различении.
  alternative: Передать как «понимают, что справедливо» или истолковать как буквальное всеведение.
  rationale: Противопоставление относится прежде всего к справедливости и нравственному разумению, однако слово כֹל намеренно имеет широкий смысл. Основной текст сохраняет эту силу, а сноска предохраняет от прочтения как безграничного всеведения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и сохраняет антитетический параллелизм еврейской пословицы.
