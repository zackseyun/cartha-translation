base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/025.yaml
  text: A greedy person stirs up strife[b][a], but the one who trusts in Yahweh will be enriched.
translation:
  language: ru
  text: Алчный[a] разжигает раздоры, а полагающийся на Яхве будет благоденствовать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «широкий душой» — образ человека с неумеренными, ненасытными желаниями; возможно также значение «надменный».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет утучнён» — еврейский образ достатка, процветания и благополучия.'
    reason: metaphor
lexical_decisions:
- source_word: רְחַב נֶפֶשׁ
  choice: ненасытный
  rationale: Буквально «широкий душой»; здесь это идиома неумеренного, алчного желания. «Ненасытный» естественно передаёт образ человека, которому всегда мало, не сужая смысл исключительно до денежной жадности.
- source_word: יְגָרֶה
  choice: разжигает
  rationale: Каузативная форма означает «возбуждает, провоцирует». Глагол «разжигает» естественно сочетается с конфликтом и сохраняет энергичность еврейского выражения.
- source_word: מָדוֹן
  choice: раздоры
  rationale: Слово обозначает распрю, тяжбу или межличностный конфликт. Множественное «раздоры» звучит по-русски естественно и передаёт обобщённый характер пословицы.
- source_word: וּבֹטֵחַ
  choice: а полагающийся
  rationale: Причастие характеризует человека по устойчивому образу действий. Союз передан как противительный из-за антитетического параллелизма.
- source_word: עַל יְהוָה
  choice: на Яхве
  rationale: Предлог עַל буквально выражает опору «на» кого-либо; русское «полагаться на» одновременно естественно и близко к исходной конструкции. Тетраграмматон передан личным именем «Яхве».
- source_word: יְדֻשָּׁן
  choice: будет благоденствовать
  rationale: Буквально пассивная форма означает «будет утучнён» и образно указывает на достаток, процветание и благополучие. «Будет благоденствовать» сохраняет широкий смысл, не сводя обещание только к денежному обогащению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон, поэтому сохранено личное имя Бога без замены титулом.
- issue: Характер обещанного благополучия
  choice: будет благоденствовать
  alternative: будет обогащён; будет утучнён
  rationale: Еврейский образ допускает достаток, процветание и общее благополучие. Выбранная формулировка не превращает изречение в однозначное обещание денежного богатства, а буквальный образ отмечен в сноске.
- issue: Родовая форма субъекта пословицы
  choice: ненасытный … полагающийся
  alternative: ненасытный человек … тот, кто полагается
  rationale: Мужской род исходных форм сохранён как обычный обобщающий способ выражения в пословице; добавление слова «человек» не требуется для ясности.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Ненасытный» сохраняет ёмкость и нравственную напряжённость первой строки; «благоденствовать» придаёт второй строке достоинство без излишней архаичности.
