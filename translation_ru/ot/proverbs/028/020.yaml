  source_fidelity: 'Русский текст точно передаёт обе части еврейского афоризма: אִישׁ אֱמוּנוֹת — «верный человек», רַב בְּרָכוֹת — «будет богат благословениями», וְאָץ לְהַעֲשִׁיר — «тот, кто спешит разбогатеть», а лֹא יִנָּקֶה — «не останется без наказания». Будущее время уместно выражает обобщённую закономерность притчи. Сноска корректно сохраняет судебно-декларативный оттенок «не будет признан невиновным / не будет оправдан».'
