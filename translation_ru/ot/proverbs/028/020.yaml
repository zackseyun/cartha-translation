id: PRO.28.20
reference: Proverbs 28:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִ֣ישׁ אֱ֭מוּנוֹת רַב בְּרָכ֑וֹת וְ/אָ֥ץ לְ֝/הַעֲשִׁ֗יר לֹ֣א יִנָּקֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/020.yaml
  text: A faithful man will abound with blessings[a], but one who hastens to become rich will not go unpunished.
translation:
  language: ru
  text: Верный человек будет богат благословениями, а тот, кто спешит разбогатеть, не останется без наказания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет признан невиновным»; «не будет оправдан».'
    reason: Лексема נקה допускает как смысл неизбежного наказания, так и более буквальный судебный оттенок невиновности или оправдания.
lexical_decisions:
- source_word: אִישׁ
  choice: человек
  rationale: Родовое обозначение отдельного человека; современное русское «человек» естественно передаёт обобщённый смысл грамматически мужской формы, не сужая его до мужчин.
- source_word: אֱמוּנוֹת
  choice: верный
  rationale: Абстрактное существительное во множественном числе при אִישׁ характеризует человека как надёжного, верного и заслуживающего доверия. Прилагательное «верный» естественно в русском контексте мудрости.
- source_word: רַב בְּרָכוֹת
  choice: будет богат благословениями
  rationale: В безглагольном предложении רַב выражает изобилие. Оборот сохраняет множественное число «благословений» и передаёт общий принцип притчи в форме будущего времени.
- source_word: וְאָץ
  choice: а тот, кто спешит
  rationale: אָץ обозначает поспешность или нетерпеливое стремление. Конструкция с «тот, кто» естественно передаёт противопоставление двух типов людей.
- source_word: לְהַעֲשִׁיר
  choice: разбогатеть
  rationale: Инфинитив породы hифиль здесь означает стать богатым или приобрести богатство. «Разбогатеть» кратко и современно передаёт эту цель.
- source_word: לֹא יִנָּקֶה
  choice: не останется без наказания
  rationale: Нифаль от נקה может означать не быть признанным невиновным или не избежать наказания. Основной вариант ясно выражает последствие на естественном русском языке, а юридический оттенок отмечен в сноске.
theological_decisions:
- issue: Объект порицания во второй строке
  choice: Порицается поспешное стремление разбогатеть.
  alternative: Порицается само богатство или всякое стремление к нему.
  rationale: Еврейское אָץ прямо указывает на поспешность; текст не утверждает, что богатство само по себе виновно.
- issue: Источник благословений
  choice: Не называть действующее лицо прямо.
  alternative: Добавить, что человека благословляет Бог.
  rationale: В богословском контексте благословение может подразумевать Бога как источник, но в еврейском тексте субъект не назван; перевод не должен устранять эту неявность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным параллелизмом. «Верный человек» понятно передаёт надёжность и цельность характера; «богат благословениями» сохраняет образ изобилия и создаёт уместную смысловую перекличку с последующим «разбогатеть».
