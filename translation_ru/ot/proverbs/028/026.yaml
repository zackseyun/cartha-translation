base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/026.yaml
  text: Whoever trusts in his own heart is a fool[b][a], but he who walks in wisdom will escape.
translation:
  language: ru
  text: Кто полагается на собственное сердце[a], тот глупец; а кто поступает мудро, тот спасётся[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В древнееврейском языке «сердце» обозначает внутреннего человека, включая мысли, суждения и волю, а не только чувства.
    reason: cultural_note
  - marker: b
    text: 'Или: «будет избавлен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: полагается
  rationale: Причастие от בטח означает доверие или опору на кого-либо либо что-либо. «Полагается» естественно передаёт здесь предостережение против самоуверенности.
- source_word: בְּלִבּוֹ
  choice: на собственное сердце
  rationale: לֵב обозначает внутреннего человека, включая разумение, суждение и волю. «Собственное» ясно выражает местоименный суффикс и смысл опоры на самого себя, сохраняя образ сердца.
- source_word: כְסִיל
  choice: глупец
  rationale: Это устойчивый термин литературы мудрости для человека, которому недостаёт не только рассудительности, но и нравственной восприимчивости.
- source_word: וְהוֹלֵךְ
  choice: кто поступает
  rationale: הלך в литературе мудрости часто описывает образ жизни и поведения. Русское «поступает» передаёт этот смысл естественнее буквального «ходит».
- source_word: בְּחָכְמָה
  choice: мудро
  rationale: Наречная формулировка естественна по-русски и точно передаёт жизнь и действия, направляемые мудростью.
- source_word: יִמָּלֵט
  choice: избежит беды
  rationale: Нифаль глагола מלט означает «спастись, ускользнуть, быть избавленным». Добавление «беды» делает подразумеваемую опасность ясной по-русски, не уточняя её характер.
- source_word: הוּא ... הוּא
  choice: тот ... тот
  rationale: Повтор указательного соотносительного слова естественно воспроизводит подчёркнутое противопоставление двух типов людей.
theological_decisions:
- issue: Антропологический смысл слова «сердце»
  choice: Сохранить «сердце» и пояснить его широкий древнееврейский смысл в сноске.
  alternative: Перевести «на самого себя» или «на собственный разум».
  rationale: Исходный образ охватывает мышление, суждение и волю, а не только чувства. Его сохранение не сужает библейскую антропологию до одной современной категории.
- issue: Характер спасения в יִמָּלֵט
  choice: Передать как «избежит беды» с указанием пассивной альтернативы в сноске.
  alternative: «Будет избавлен».
  rationale: Форма допускает оттенки как успешного избавления от опасности, так и пассивного избавления. Основной текст сохраняет краткий житейский тон притчи, а сноска отмечает реальную неоднозначность.
- issue: Родовая форма высказывания
  choice: Использовать грамматически мужское существительное «глупец», сохранив обобщающий смысл.
  alternative: Перестроить всё изречение в отвлечённой или множественной форме.
  rationale: Древнееврейский текст использует мужской род единственного числа как обобщение. Русская конструкция «кто... тот» также естественно имеет универсальное значение.
translation_notes:
  register: Современный литературный русский язык; краткий, афористичный строй притчи. Сохранён библейский образ сердца, тогда как метафорическое «ходить» передано естественным русским «поступать». Обе сноски отмечены в основном тексте.
