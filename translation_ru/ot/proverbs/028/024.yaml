  source_fidelity: '«Обирает отца и мать» хорошо передаёт גּוֹזֵל и сохраняет отдельно названных родителей. «Это не преступление» допустимо для אֵין פָּשַׁע, хотя русское слово несколько сильнее тяготеет к юридической сфере, чем еврейское обозначение проступка/нарушения. Основная проблема — «сообщник»: оно обычно означает соучастника конкретного преступления и поэтому сужает חָבֵר, то есть человека, связанного с кем-либо, до прямого криминального пособничества.'
  naturalness: Фраза в целом лаконична и литературна. Оборот «заодно с губителем» естественен в современном русском и передаёт отрицательно окрашенную связь без ненужного утверждения о формальном соучастии.
  terminology: «Губитель» удачно сохраняет деятельный смысл מַשְׁחִית («тот, кто губит/разрушает»). «Заодно с» точнее, чем «сообщник», воспроизводит отношение, выраженное חָבֵר ... לְ.
