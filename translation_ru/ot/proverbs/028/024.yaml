source:
  edition: WLC
  text: גּוֹזֵ֤ל אָ֘בִ֤י/ו וְ/אִמּ֗/וֹ וְ/אֹמֵ֥ר אֵֽין פָּ֑שַׁע חָבֵ֥ר ה֝֗וּא לְ/אִ֣ישׁ מַשְׁחִֽית׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/024.yaml
  text: Whoever robs his father and his mother and says[a], “It is no transgression,” is a companion of a destructive man.
translation:
  language: ru
  text: 'Кто обирает отца и мать и говорит: «Это не преступление», тот заодно с губителем.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גּוֹזֵל
  choice: обирает
  rationale: Причастие от גזל обозначает насильственное или неправомерное отнятие чужого. «Обирает» естественно по-русски передаёт систематическое либо бесстыдное присвоение имущества близких и сохраняет серьёзность поступка.
- source_word: אָבִיו וְאִמּוֹ
  choice: отца и мать
  rationale: Оба родителя названы отдельно, поэтому эта форма сохранена, а не сведена к общему слову «родителей»; притяжательность в русской конструкции ясно определяется субъектом.
- source_word: וְאֹמֵר
  choice: и говорит
  rationale: Простое сочинение непосредственно отражает еврейскую конструкцию с союзом и причастием.
- source_word: אֵין פָּשַׁע
  choice: Это не преступление
  rationale: פֶּשַׁע может обозначать преступление, проступок или нарушение. «Преступление» сохраняет нравственно-правовую тяжесть выражения, не ограничивая его только религиозным понятием греха.
- source_word: חָבֵר
  choice: сообщник
  rationale: Слово обозначает человека, связанного или объединившегося с другим. В данном отрицательном нравственном контексте «сообщник» по-русски естественнее, чем нейтральный «товарищ», и выражает общность дела или характера.
- source_word: לְאִישׁ מַשְׁחִית
  choice: губителя
  rationale: Причастие מַשְׁחִית обозначает того, кто губит, разрушает или причиняет разорение; לְ после חָבֵר указывает на связь с таким человеком. «Сообщник губителя» кратко и точно передаёт эту связь, а «губитель» сохраняет деятельное значение причастия.
- source_word: הוּא
  choice: тот
  rationale: Местоимение выполняет связующую и возобновляющую функцию. Русская коррелятивная конструкция «кто... тот...» ясно и естественно воспроизводит построение изречения.
theological_decisions:
- issue: Сфера значения אֵין פָּשַׁע
  choice: «Это не преступление»
  alternative: «В этом нет греха» / «Это не проступок»
  rationale: Текст не уточняет, идёт ли речь исключительно о юридическом преступлении или о нравственном нарушении. «Преступление» сохраняет тяжесть отрицания, не вводя более узкую конфессиональную формулировку.
translation_notes:
  register: Современный литературный русский язык с лаконичной формой пословицы. «Обирает» и «губитель» имеют достойный, слегка возвышенный оттенок, но остаются понятными обычному читателю. Корреляция «кто... тот...» обеспечивает естественный русский синтаксис.
