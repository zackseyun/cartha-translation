  yaml_path: translation/ot/proverbs/028/019.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues worthless things will have his fill of poverty.
translation:
  language: ru
  text: 'Кто возделывает свою землю, насытится хлебом,

    а кто гонится за пустым[a], насытится бедностью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «за пустыми»; это может относиться к пустым, бесполезным вещам или к никчёмным людям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: возделывает
  rationale: В сочетании с «землёй» причастие обозначает постоянный земледельческий труд. «Возделывает» естественно и точнее передаёт сельскохозяйственный контекст, чем общее «работает».
- source_word: אַדְמָתוֹ
  choice: свою землю
  rationale: אַדָמָה здесь означает землю как почву или земельный участок. Возвратное «свою» — естественный русский эквивалент притяжательного суффикса при общем субъекте.
- source_word: יִשְׂבַּע לָחֶם
  choice: насытится хлебом
  rationale: Сохраняются конкретный образ хлеба и прямое значение שׂבע — «насыщаться». Эта формулировка также позволяет воспроизвести намеренный повтор во второй строке.
- source_word: וּמְרַדֵּף
  choice: а кто гонится
  rationale: Союз «а» естественно выражает контраст параллельных частей. «Гонится» передаёт усиленное причастие со значением настойчивого преследования.
- source_word: רֵקִים
  choice: за пустым
  rationale: Субстантивированное «пустым» сохраняет образ пустоты и не устраняет неоднозначность еврейской формы, которая может относиться к бесполезным занятиям, вещам или никчёмным людям.
- source_word: יִשְׂבַּע רִישׁ
  choice: насытится бедностью
  rationale: Буквальная, но понятная ироническая формулировка сохраняет повтор שׂבע и резкий контраст между хлебом и бедностью.
theological_decisions: []
