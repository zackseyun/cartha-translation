  yaml_path: translation/ot/proverbs/028/006.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his ways[a], though he is rich.
translation:
  language: ru
  text: Лучше бедный, живущий честно, чем тот, кто идёт кривыми путями, хотя он и богат[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально заключительные слова: «и он богат»; местоимение относится к человеку, который идёт кривыми путями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: В начале сравнительной пословицы слово имеет значение «лучше… чем…»; краткая форма сохраняет афористичность.
- source_word: רָשׁ
  choice: бедный
  rationale: Обозначает бедного, неимущего человека; мужской род соответствует форме и образу представительного лица в еврейском тексте.
- source_word: הוֹלֵךְ
  choice: живущий
  rationale: Буквально «идущий, ходящий», но в литературе мудрости это обычная метафора образа жизни. «Живущий» естественно передаёт нравственный смысл в современном русском.
- source_word: בְּתֻמּוֹ
  choice: непорочно
  rationale: תֹּם выражает цельность, честность и нравственную безупречность, не обязательно абсолютную безгрешность. Наречие естественно сочетается с «живущий».
- source_word: מֵעִקֵּשׁ
  choice: чем тот, чьи… кривы
  rationale: Сравнительный предлог מִן вводит второй член сопоставления, а עִקֵּשׁ обозначает искривлённость или превратность. Формулировка сохраняет образ кривизны.
- source_word: דְּרָכַיִם
  choice: пути
  rationale: Формально это двойственное/множественное «пути»; в контексте речь идёт о поведении и образе жизни. Русский образ путей сохраняет метафору оригинала.
- source_word: וְהוּא עָשִׁיר
  choice: хотя он богат
  rationale: Буквально «и он богат»; местоимение относится к человеку с кривыми путями. Уступительное «хотя» ясно выражает подразумеваемое противопоставление, не меняя референта.
theological_decisions:
- issue: Соотношение бедности, богатства и нравственности
  choice: Сохранено конкретное сравнение бедного непорочного человека с богатым человеком кривых путей.
  alternative: Обобщить стих как осуждение богатства или как обещание бедным.
  rationale: Еврейский текст утверждает превосходство непорочности над богатством, приобретённым или сопровождаемым кривизной, но не объявляет всякое богатство порочным и не формулирует обещания изменения материального положения.
translation_notes:
  register: Современный литературный русский с краткой пословичной структурой. Этический смысл метафоры הלך передан естественным «живущий», а образ кривых путей сохранён. Слово «непорочно» выбрано как dignified и понятное, без утверждения абсолютной безгрешности.
