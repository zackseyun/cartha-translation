  yaml_path: translation/ot/proverbs/028/002.yaml
  text: Because of a land's transgression[a], its rulers are many, but by a man of understanding and knowledge[b], stability endures.
translation:
  language: ru
  text: Из-за беззакония страны у неё много правителей, но благодаря понимающему и знающему человеку устойчивость сохраняется надолго.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское адам — обобщающее слово в единственном числе: «человек»; оно не обязательно подразумевает мужчину. В данном контексте речь, вероятно, идёт о мудром руководителе или советнике.'
    reason: lexical_alternative
  - marker: b
    text: 'Вторая строка в еврейском тексте трудна и допускает разные толкования. Буквально переданы слова: «но благодаря человеку понимающему и знающему — так продлит/продлится»; при глаголе прямо не названы его субъект и объект. Основной текст выражает вероятный смысл: разумное руководство способствует длительной устойчивости страны.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶשַׁע אֶרֶץ
  choice: из-за мятежа страны
  rationale: Предлог בְּ понят причинно. «Мятеж» передаёт присущие פֶּשַׁע значения сознательного нарушения установленного порядка и бунта; родительный оборот сохраняет обобщённый характер изречения.
- source_word: רַבִּים שָׂרֶיהָ
  choice: у неё много правителей
  rationale: שָׂר обозначает князя, начальника или правителя. Нейтральное современное «правители» соответствует политическому контексту, не добавляя прямо не выраженной мысли об их частой смене.
- source_word: וּבְאָדָם
  choice: но при человеке
  rationale: 'Союз передан как «но», чтобы отразить противопоставление двух строк. Предлог בְּ здесь естественно передаётся русским «при»: благодаря присутствию или деятельности такого человека.'
- source_word: מֵבִין יֹדֵעַ
  choice: разумном и знающем
  rationale: 'Сохранены оба причастных определения: первое указывает на способность понимать и различать, второе — на обладание знанием.'
- source_word: כֵּן יַאֲרִיךְ
  choice: установленный порядок сохраняется надолго
  rationale: Трудный оборот истолкован как указание на устойчивое, надлежащее состояние страны. יַאֲרִיךְ выражает продолжительность; «сохраняется надолго» естественно передаёт этот смысл по-русски.
theological_decisions:
- issue: К чему относится выражение כֵּן יַאֲרִיךְ во второй строке
  choice: «установленный порядок сохраняется надолго»
  alternative: «она существует долго» или более буквально «так продлится»
  rationale: В еврейском тексте объект или подлежащее продления прямо не названо, а כֵּן допускает понимание «так» либо «установленное, правильное состояние». Основной текст выражает вероятный смысл политической устойчивости, а примечание сохраняет грамматическую и смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Мятеж» сохраняет сильную нравственно-политическую окраску исходного слова; «установленный порядок» делает понятным вероятный смысл трудной второй строки, а сноска отмечает её подлинную неоднозначность.
