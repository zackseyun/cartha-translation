lexical_decisions:
- source_word: מַשְׁגֶּה
  choice: Кто сбивает ... на путь
  rationale: Причастие породы hифиль от שׁגה означает «заставлять заблуждаться, сбивать с пути». Конструкция с «кто» естественно передаёт обобщённого деятеля.
- source_word: יְשָׁרִים
  choice: честных людей
  rationale: Слово обозначает нравственно прямых, порядочных людей. «Честных людей» понятно современному читателю и сохраняет этический смысл; буквальное «прямых» по-русски здесь неестественно.
- source_word: בְּדֶרֶךְ רָע
  choice: на злой путь
  rationale: דֶּרֶךְ сохраняет образ пути как образ поведения. Русское «сбивает ... на злой путь» естественно выражает каузативный смысл всей конструкции, хотя предлог ב сам по себе не требует значения движения внутрь.
- source_word: בִּשְׁחוּתוֹ
  choice: в свою яму
  rationale: Существительное допускает значения «яма» и «гибель, разрушение». «Яма» сохраняет конкретный образ ловушки и воздаяния; местоименный суффикс передан словом «свою».
- source_word: הוּא יִפּוֹל
  choice: тот сам упадёт
  rationale: Явное местоимение הוּא подчёркивает, что падение постигнет самого совратителя. Корреляция «кто ... тот сам» естественно передаёт это ударение по-русски.
- source_word: וּתְמִימִים
  choice: а непорочные
  rationale: תָּמִים в литературе мудрости указывает на нравственную цельность и безупречность. «Непорочные» сохраняет этическую возвышенность; союз «а» передаёт противопоставление между двумя частями стиха.
- source_word: יִנְחֲלוּ
  choice: унаследуют
  rationale: Глагол נחל означает получать в наследие или владение. «Унаследуют» сохраняет более насыщенный смысл, чем общее «получат».
- source_word: טוֹב
  choice: добро
  rationale: Еврейское слово намеренно широко и может охватывать благо, благополучие и всё хорошее. «Добро» сохраняет эту неопределённость и не сводит смысл к материальному достатку.
theological_decisions:
- issue: Образ нравственного воздаяния в בִּשְׁחוּתוֹ
  choice: В основном тексте сохранён конкретный образ «в свою яму».
  alternative: «погибнет из-за собственного злодейства» или «окажется в собственной погибели»
  rationale: 'Образ ямы выражает поэтическую справедливость: пытающийся совратить других сам оказывается жертвой ловушки. Такая передача не уточняет сверх текста способ суда и сохраняет метафорическую напряжённость изречения.'
translation_notes:
  register: Современный литературный русский с достоинством, свойственным изречению мудрости. Парная конструкция «кто ... тот» передаёт обобщённый характер первой половины; «а» ясно отмечает контраст. Образы пути, ямы и наследования сохранены.
