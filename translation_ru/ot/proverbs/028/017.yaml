  text: אָ֭דָם עָשֻׁ֣ק בְּ/דַם נָפֶשׁ עַד בּ֥וֹר יָ֝נ֗וּס אַל יִתְמְכוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/017.yaml
  text: A man burdened with the blood of a life will flee as far as the pit[b][a]; let no one support him.
translation:
  language: ru
  text: Человек, обременённый виной за пролитую кровь[a], будет бежать до ямы[b]; пусть никто не поддерживает его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек, угнетённый или обременённый кровью жизни (или человека)»; выражение означает вину за лишение жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «могилы». Еврейское слово «яма» может указывать на смертельный конец.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Человек
  rationale: Существительное в единственном числе обозначает здесь отдельного человека; русское «человек» естественно и не превращает высказывание в обобщение о человечестве.
- source_word: עָשֻׁק
  choice: отягчённый
  rationale: Причастие буквально может означать «угнетённый, притеснённый», но в сочетании с кровью передаёт тяжесть и ответственность за кровопролитие. «Отягчённый» сохраняет образ давящего бремени.
- source_word: בְּדַם נָפֶשׁ
  choice: виной за пролитую кровь
  rationale: Буквально — «кровью жизни/души». В данном контексте оборот означает вину за лишение жизни; русский вариант ясно передаёт эту идиому, а буквальный образ отмечен в сноске.
- source_word: עַד בּוֹר
  choice: до самой ямы
  rationale: בּוֹר может обозначать яму, колодец, темницу или, образно, могилу. «До самой ямы» сохраняет исходный образ и его намеренную многозначность.
- source_word: יָנוּס
  choice: будет бежать
  rationale: Форма глагола выражает продолжающееся или предстоящее бегство; выбран естественный русский эквивалент без уточнения причины или длительности.
- source_word: אַל יִתְמְכוּ בוֹ
  choice: пусть никто его не поддерживает
  rationale: Отрицательная форма с глаголом во множественном числе обращена к неопределённому кругу людей. «Пусть никто» естественно передаёт запрет, а «поддерживает» сохраняет значение оказания помощи или опоры.
theological_decisions:
- issue: Смысл выражения בְּדַם נָפֶשׁ
  choice: Передать в основном тексте как вину за пролитую кровь
  alternative: 'Сохранить буквально: «кровью жизни»'
  rationale: Контекст указывает на ответственность за лишение жизни, однако буквальная образность и возможный диапазон слова נֶפֶשׁ сохранены в сноске, чтобы не скрывать форму еврейского выражения.
- issue: Значение בּוֹר
  choice: Сохранить образ ямы
  alternative: Перевести как «могила»
  rationale: «Могила» вероятна как подразумеваемый смертельный исход, но еврейское слово шире. Основной текст не устраняет эту многозначность, а возможное значение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой притчи. Сохранены конкретный образ ямы и напряжённая заключительная заповедь; идиома о кровной вине раскрыта ровно настолько, чтобы стих был понятен обычному читателю.
