    rationale: В еврейском тексте стоит וְעַל («и/а за, по причине»), без отдельной частицы со значением «и/даже» в русском обороте «но и». Нейтральное «а за» сохраняет связь строк и звучит естественно.
  - severity: medium
    issue: «Пойдёт на преступление» чрезмерно юридизирует глагол יִפְשַׁע.
    rationale: פשע обозначает согрешить, нарушить, совершить проступок; контекст не требует утверждать уголовное преступление.
