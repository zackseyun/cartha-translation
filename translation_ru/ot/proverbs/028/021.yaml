  yaml_path: translation/ot/proverbs/028/021.yaml
  text: To show partiality is not good[c][b][a], yet for a piece of bread a man will transgress.
translation:
  language: ru
  text: Лицеприятие — нехорошо[a], а за кусок хлеба человек совершит проступок[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «узнавать лица» — еврейская идиома, означающая проявлять пристрастие или фаворитизм.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за краюшку хлеба». Смысл в том, что человек способен совершить проступок ради совсем ничтожной выгоды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּר פָּנִים
  choice: лицеприятие
  rationale: Еврейская идиома буквально означает «узнавать лица» и обозначает пристрастное отношение. «Лицеприятие» точно и ёмко передаёт её нравственный смысл в литературном русском языке.
- source_word: לֹא טוֹב
  choice: не добро
  rationale: Сохраняет широкую нравственную оценку оригинала и афористическую краткость, не сужая смысл до юридического «неправильно».
- source_word: וְעַל
  choice: но и за
  rationale: 'Союз передан как противопоставительный: вторая часть показывает, насколько ничтожная выгода способна склонить человека к проступку. Частица «и» усиливает значение «даже за».'
- source_word: פַּת לֶחֶם
  choice: кусок хлеба
  rationale: Естественно передаёт небольшую порцию хлеба и подчёркивает ничтожность выгоды.
- source_word: יִפְשַׁע
  choice: пойдёт на преступление
  rationale: Глагол פשע обозначает нарушение, проступок или мятеж. В этом контексте выражение сохраняет серьёзный нравственно-правовой оттенок и звучит естественнее буквального «преступит».
- source_word: גָּבֶר
  choice: человек
  rationale: Хотя существительное имеет мужской род и может значить «мужчина», здесь оно употреблено как обобщённый субъект притчи. Русское «человек» естественно сохраняет универсальный характер изречения.
theological_decisions:
- issue: Обобщённое употребление существительного мужского рода גָּבֶר
  choice: человек
  alternative: мужчина
  rationale: Контекст формулирует общее наблюдение о человеческом поведении, а не противопоставляет мужчин женщинам. «Человек» сохраняет референциальный смысл без добавления гендерного ограничения.
translation_notes:
  register: Краткий афористический строй соответствует жанру притчи. Лексика современная и литературная; «лицеприятие» несколько возвышенно, но понятно в библейско-нравственном контексте. Все сноски отмечены в основном тексте.
