  text: מְכַסֶּ֣ה פְ֭שָׁעָי/ו לֹ֣א יַצְלִ֑יחַ וּ/מוֹדֶ֖ה וְ/עֹזֵ֣ב יְרֻחָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/013.yaml
  text: Whoever covers his transgressions will not prosper[b][a], but he who confesses and forsakes them will be shown mercy.
translation:
  language: ru
  text: Кто скрывает[a] свои преступления, тот не преуспеет; а кто признаётся в них и оставляет их, тот будет помилован[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «покрывает»; также возможно: «утаивает».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обретёт милость». Еврейский текст использует страдательную форму и не называет того, кто проявляет милость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: скрывает
  rationale: Причастие от כסה буквально передаёт идею покрытия и в данном контексте означает сокрытие проступков. «Скрывает» естественно звучит по-русски и не создаёт возможной двусмысленности слова «покрывает».
- source_word: פְשָׁעָיו
  choice: свои преступления
  rationale: פשע обозначает преступление, нарушение или мятежный проступок и сильнее общего понятия греха. «Преступления» сохраняет этот нравственный вес.
- source_word: יַצְלִיחַ
  choice: не преуспеет
  rationale: Hiphil от צלח означает добиться успеха, преуспеть. «Не преуспеет» соответствует афористическому стилю книги Притчей и не ограничивает смысл материальным благополучием.
- source_word: וּמוֹדֶה
  choice: признаётся в них
  rationale: В этом контексте ידה означает признать или исповедать проступки. «Признаётся в них» понятно современному читателю и естественно сочетается с последующим отказом от них.
- source_word: וְעֹזֵב
  choice: оставляет их
  rationale: עזב означает оставить, покинуть, отказаться от чего-либо. Формулировка сохраняет нравственный смысл прекращения прежнего поведения без дополнительного толкования.
- source_word: יְרֻחָם
  choice: будет помилован
  rationale: Страдательная форма от רחם выражает проявление милости или сострадания к человеку. «Будет помилован» сохраняет пассивную конструкцию и не называет подразумеваемого деятеля.
- source_word: implicit object after וּמוֹדֶה וְעֹזֵב
  choice: в них … их
  rationale: В еврейском объект подразумевается из первой части стиха. В русском его необходимо выразить явно; местоимения относятся к «преступлениям» и избегают тяжеловесного повтора.
- source_word: masculine singular participles/pronouns
  choice: кто … тот
  rationale: Еврейские формы мужского рода единственного числа имеют обобщающее значение. Русская парная конструкция «кто … тот» естественно передаёт общее правило без ненужного изменения числа.
theological_decisions:
- issue: Действующее лицо, проявляющее милость, не названо
  choice: Сохранить страдательную конструкцию «будет помилован», не называя Бога прямо
  alternative: Бог помилует его; тот обретёт милость
  rationale: Контекст мудрости допускает понимание милости как Божьей, однако еврейский текст прямо не называет действующее лицо. Пассивная формулировка сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Точка с запятой подчёркивает противопоставление двух путей. Лексика нравственно серьёзная, но понятная широкому кругу читателей.
