  text: Like a roaring lion and a charging bear is a wicked ruler over a poor people[a].
translation:
  language: ru
  text: Что рычащий лев и нападающий медведь, то нечестивый правитель над бедным народом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «алчный медведь» или «медведь, несущийся в атаку»; еврейское причастие передаёт агрессивную угрозу и может подчёркивать либо стремительный натиск зверя, либо его хищную ненасытность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרִי נֹהֵם
  choice: рычащий лев
  rationale: Причастие обозначает грозный голос льва; «рычащий» естественно и образно передаёт непрерывную угрозу, не сужая значение до конкретного оттенка звука.
- source_word: דֹב שׁוֹקֵק
  choice: бросающийся медведь
  rationale: Редкое причастие передаёт агрессивный натиск или стремительное движение; «бросающийся» сохраняет кинетический и угрожающий характер образа.
- source_word: מֹשֵׁל רָשָׁע
  choice: нечестивый правитель
  rationale: Субстантивированное причастие означает человека, осуществляющего власть, а прилагательное даёт ему нравственную оценку, обычную для литературы мудрости.
- source_word: עַל עַם דָּל
  choice: над бедным народом
  rationale: Предлог выражает власть над народом; דָּל прежде всего указывает на бедность, одновременно подразумевая социальную слабость и беззащитность.
