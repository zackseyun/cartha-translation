lexical_decisions:
- source_word: גֶּבֶר
  choice: бедняк
  rationale: Существительное גֶּבֶר обозначает мужчину, однако в сочетании с רָשׁ по-русски естественно передаётся единым словом «бедняк»; мужской род и образ конкретного человека сохраняются.
- source_word: רָשׁ
  choice: бедняк
  rationale: Слово указывает на человека, лишённого достатка. «Бедняк» — прямой и естественный эквивалент в данном афористическом контексте.
- source_word: עֹשֵׁק
  choice: притесняющий
  rationale: Причастие от עשק выражает продолжающееся угнетение, эксплуатацию или обирание. «Притесняющий» сохраняет широкое значение и причастную форму.
- source_word: דַּלִּים
  choice: слабых
  rationale: דַּלִּים может обозначать бедных, слабых и людей низкого положения. «Слабых» сохраняет отличие от רָשׁ и подчёркивает уязвимость притесняемых.
- source_word: מָטָר
  choice: ливень
  rationale: Основное значение — «дождь»; в сочетании с סֹחֵף слово «ливень» естественно передаёт сильный, разрушительный дождь.
- source_word: סֹחֵף
  choice: смывающий всё
  rationale: Причастие означает «сметающий, уносящий, смывающий». Добавление «всё» естественно выражает разрушительный размах образа, не уточняя того, что именно унесено.
- source_word: וְאֵין לָחֶם
  choice: так что не остаётся хлеба
  rationale: Сохранено буквальное «хлеб», которое может означать как хлеб непосредственно, так и пищу или пропитание вообще; причинно-следственная связь естественно выражена оборотом «так что».
