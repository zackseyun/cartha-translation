  text: מ֘וֹכִ֤יחַ אָדָ֣ם אַ֭חֲרַי חֵ֣ן יִמְצָ֑א מִֽ/מַּחֲלִ֥יק לָשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/023.yaml
  text: Whoever rebukes a man will afterward find favor[a], more than one who flatters with the tongue.
translation:
  language: ru
  text: Кто обличает человека, тот впоследствии обретёт больше благосклонности, чем тот, кто льстит языком.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто обличает человека, тот впоследствии обретёт благосклонность — больше, чем тот, кто льстит языком».'
    reason: Еврейский сравнительный оборот может быть осмыслен как сравнение меры обретаемой благосклонности либо как сопоставление обличающего с льстецом; основной текст передаёт первый, наиболее естественный для современного русского вариант.
lexical_decisions:
- source_word: מוֹכִיחַ
  choice: обличает
  rationale: Причастие породы hифиль от יכח обозначает словесное обличение или исправляющее порицание. «Обличает» сохраняет прямоту действия и естественно противопоставляется лести.
- source_word: אָדָם
  choice: человека
  rationale: Здесь слово обозначает отдельного человека как объект обличения. Русское «человека» естественно передаёт родовое значение без ненужного уточнения пола.
- source_word: אַחֲרַי
  choice: впоследствии
  rationale: 'В контексте наиболее вероятно наречное значение «потом, впоследствии»: благосклонность приходит не сразу. Возможность иной синтаксической привязки отражена в сноске.'
- source_word: חֵן
  choice: благосклонность
  rationale: חֵן здесь означает расположение или благоволение со стороны людей. «Благосклонность» передаёт смысл без привнесения специального богословского значения слова «благодать».
- source_word: יִמְצָא
  choice: обретёт
  rationale: Имперфект выражает обычный ожидаемый результат в форме будущего времени. «Обретёт благосклонность» звучит естественно и сохраняет образ нахождения/обретения.
- source_word: מִמַּחֲלִיק לָשׁוֹן
  choice: больше, чем льстящий языком
  rationale: Сравнительное מִן перед причастием указывает на превосходство над льстецом. מחליק буквально связано с «делать гладким» и в данном сочетании означает льстить; слово «язык» сохранено как образ оригинала.
theological_decisions: []
