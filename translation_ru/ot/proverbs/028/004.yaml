  text: עֹזְבֵ֣י ת֭וֹרָה יְהַֽלְל֣וּ רָשָׁ֑ע וְ/שֹׁמְרֵ֥י ת֝וֹרָ֗ה יִתְגָּ֥רוּ בָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/004.yaml
  text: Those who forsake the law praise the wicked[b][a], but those who keep the law contend with them.
translation:
  language: ru
  text: Оставляющие наставление хвалят нечестивого, а хранящие наставление противостоят им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступают с ними в борьбу»; еврейский глагол выражает активное противоборство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹזְבֵי
  choice: оставляющие
  rationale: Причастие породы qal во множественном числе обозначает людей, для которых характерно оставление или отвержение; «оставляющие» сохраняет параллелизм с «хранящие» и звучит естественно.
- source_word: תּוֹרָה
  choice: наставление
  rationale: В контексте Притчей תּוֹרָה часто означает авторитетное нравственное учение или наставление. «Наставление» сохраняет мудростный контекст и не сужает значение исключительно до законодательного свода.
- source_word: יְהַלְלוּ
  choice: хвалят
  rationale: Порода piel от הלל прямо выражает похвалу или одобрение; «хвалят» передаёт иронию одобрения нечестивого.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Единственное число употреблено субстантивированно и имеет обобщённо-представительное значение; русский винительный падеж единственного числа сохраняет форму и компактность оригинала.
- source_word: שֹׁמְרֵי
  choice: хранящие
  rationale: Причастие qal от שמר может означать хранить, соблюдать или беречь. «Хранящие наставление» передаёт деятельную верность и образно противопоставляется «оставляющим».
- source_word: יִתְגָּרוּ
  choice: противостоят
  rationale: Форма hitpael от גרה обозначает вступление в борьбу или противоборство. «Противостоят» естественно по-русски и передаёт направленную враждебность без добавления идеи физического насилия.
- source_word: בָם
  choice: им
  rationale: Предлог ב при данном глаголе указывает на тех, против кого направлено противоборство. «Противостоят им» идиоматично и сохраняет неопределённость относительно точного круга лиц.
theological_decisions:
- issue: Значение תּוֹרָה в мудростном контексте
  choice: наставление
  alternative: закон; учение
  rationale: «Наставление» охватывает авторитетное нравственное учение, не исключая связи с Божьим законом, и не навязывает исключительно юридическое прочтение.
- issue: Референт местоимения «им» во второй строке
  choice: Местоимение оставлено без уточнения и может указывать на нечестивых либо шире на оставляющих наставление.
  alternative: 'Явно уточнить: «нечестивым» или «оставляющим наставление»'
  rationale: Еврейское местоимение стоит во множественном числе после обобщённого единственного רָשָׁע; буквальная компактность сохраняет переход от представительного единственного числа к классу лиц и не устраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Пара «оставляющие — хранящие» воспроизводит формальный параллелизм оригинала; «наставление» выбрано как естественный мудростный эквивалент תּוֹרָה.
