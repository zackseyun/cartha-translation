  yaml_path: translation/ot/proverbs/028/007.yaml
  text: Whoever keeps the law is a discerning son[b][a], but he who associates with gluttons shames his father.
translation:
  language: ru
  text: Кто соблюдает наставление, тот разумный сын; а кто водится с обжорами[a][b], тот позорит своего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пасущий обжор». Здесь пастушеский образ, вероятно, означает, что человек держится их общества или водится с ними.'
    reason: lexical_alternative
  - marker: b
    text: Слово «обжоры» может обозначать шире людей невоздержанных, распущенных и расточительных.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹצֵר
  choice: соблюдает
  rationale: Причастие означает хранить, беречь или соблюдать. В сочетании с наставлением «соблюдает» естественно передаёт верность услышанному предписанию.
- source_word: תּוֹרָה
  choice: наставление
  rationale: В литературе мудрости תּוֹרָה нередко обозначает авторитетное наставление, а не исключительно Моисеев закон. Контекст отца и сына поддерживает это широкое значение; вариант «закон» остаётся возможным.
- source_word: בֵּן
  choice: сын
  rationale: Сохранено явно выраженное мужское единственное число.
- source_word: מֵבִין
  choice: разумный
  rationale: Слово характеризует человека, обладающего пониманием и рассудительностью; «разумный» естественно сочетается со словом «сын».
- source_word: וְרֹעֶה
  choice: а кто водится с
  rationale: Буквально глагол связан с пастьбой, но здесь идиоматически означает постоянное общение или компанию. Русское «водится с» естественно передаёт неодобряемое близкое общение.
- source_word: זֹלְלִים
  choice: обжорами
  rationale: Прямое значение связано с неумеренными едоками. Более широкий оттенок распущенности и расточительности сохранён в сноске.
- source_word: יַכְלִים
  choice: позорит
  rationale: Порода Hiphil выражает причинение стыда или позора. «Позорит» кратко и прямо передаёт действие по отношению к отцу.
- source_word: אָבִיו
  choice: своего отца
  rationale: Возвратное притяжательное местоимение естественно для русского придаточного с субъектом «кто» и точно передаёт принадлежность.
theological_decisions:
- issue: Значение תּוֹרָה в контексте Притчей
  choice: наставление
  alternative: закон
  rationale: Еврейское слово допускает оба значения. Выбор «наставление» сохраняет обычный для Притчей контекст мудрого и отцовского поучения, не исключая авторитетности сказанного и не сужая смысл до конкретного свода закона.
translation_notes:
  register: Современный литературный русский язык с кратким параллелизмом, характерным для притчи. Конструкция «тот… а кто… тот…» делает противопоставление ясным; «водится с» имеет естественный неодобрительный оттенок без разговорной грубости.
