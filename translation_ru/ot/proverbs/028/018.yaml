  source_fidelity: 'Основной смысл передан точно: הוֹלֵךְ תָּמִים — «кто ходит непорочно», יִוָּשֵׁעַ — «будет избавлен», а библейские образы хождения, путей и падения сохранены. «Сразу» является оправданной передачей בְּאֶחָת в данном контексте. Однако предложенная в сноске конкретизация «на одном из своих путей» не имеет достаточной опоры в еврейском тексте и создаёт ложную интерпретацию спорного выражения.'
