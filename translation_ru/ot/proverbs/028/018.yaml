  terminology: «Непорочно» и «будет избавлен» уместны для мудростного, афористичного регистра. «Будет избавлен» не навязывает узкобогословского смысла слову יִוָּשֵׁעַ. Никаких конфессионально обусловленных изменений не требуется.
