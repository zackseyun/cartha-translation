  text: הוֹלֵ֣ךְ תָּ֭מִים יִוָּשֵׁ֑עַ וְ/נֶעְקַ֥שׁ דְּ֝רָכַ֗יִם יִפּ֥וֹל בְּ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/018.yaml
  text: Whoever walks in integrity will be delivered[b][a], but one crooked in his ways will fall at once.
translation:
  language: ru
  text: Кто ходит непорочно, будет избавлен[a], а тот, чьи пути кривы, сразу падёт[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет спасён»; или: «будет сохранён в безопасности».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в одном». Значение выражения не вполне ясно; вероятно: «сразу» или «внезапно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: ходит
  rationale: Сохраняет характерный для литературы мудрости образ хождения как образа жизни и естественно звучит по-русски.
- source_word: תָּמִים
  choice: непорочно
  rationale: Передаёт нравственную цельность и честность поведения, не утверждая безгрешного совершенства.
- source_word: יִוָּשֵׁעַ
  choice: будет избавлен
  rationale: Сохраняет страдательное значение формы и указывает на избавление от беды, не сужая смысл до специального богословского понятия спасения.
- source_word: נֶעְקַשׁ דְּרָכַיִם
  choice: человек с кривыми путями
  rationale: Сохраняет метафору нравственно искривлённых путей; существительное «человек» естественно выражает подразумеваемого носителя признака.
- source_word: יִפּוֹל
  choice: падёт
  rationale: Сохраняет конкретный образ падения, который в контексте также подразумевает крах.
- source_word: בְּאֶחָת
  choice: сразу
  rationale: Кратко и естественно передаёт вероятное наречное значение «разом, внезапно», тогда как буквальная форма остаётся неоднозначной и отмечена в сноске.
theological_decisions:
- issue: Смысл יִוָּשֵׁעַ в изречении мудрости
  choice: будет избавлен
  alternative: будет спасён; будет сохранён в безопасности
  rationale: Контекст говорит прежде всего о практическом избавлении или сохранности. Выбор не исключает более широкого богословского звучания, но и не навязывает его.
- issue: Неоднозначность בְּאֶחָת
  choice: сразу
  alternative: на одном из них
  rationale: Наречное понимание хорошо соответствует антитетической краткости пословицы, однако буквально выражение означает «в одном» и может относиться к одному из кривых путей; эта возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского афоризма. Параллельные образы хождения, путей и падения сохранены; синтаксис краток и понятен обычному читателю.
