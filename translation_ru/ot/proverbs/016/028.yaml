  text: אִ֣ישׁ תַּ֭הְפֻּכוֹת יְשַׁלַּ֣ח מָד֑וֹן וְ֝/נִרְגָּ֗ מַפְרִ֥יד אַלּֽוּף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/028.yaml
  text: A perverse man stirs up strife[c][b][a], and a whisperer separates close friends.
translation:
  language: ru
  text: Коварный человек разжигает ссору[a], а сплетник[b] разлучает близких друзей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «выпускает раздор»; возможный перевод: «сеет распрю».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «клеветник», «тот, кто нашёптывает». Еврейское слово обозначает человека, чьи скрытые речи разрушают отношения.'
    reason: lexical_alternative
  - marker: c
    text: Евр. «близкого друга» или «доверенного спутника»; множественное число передаёт общий смысл изречения.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ תַּהְפֻּכוֹת
  choice: коварный человек
  rationale: Сочетание буквально описывает «человека извращённости/кривды», то есть того, чьи намерения и поступки превратны. «Коварный человек» естественно передаёт эту нравственную характеристику по-русски, не сужая её до сексуального смысла слова «извращённый».
- source_word: יְשַׁלַּח
  choice: разжигает
  rationale: Глагол буквально значит «посылает, выпускает»; в сочетании со словом «ссора, раздор» он обозначает приведение конфликта в действие. «Разжигает» ясно и естественно выражает этот смысл.
- source_word: מָדוֹן
  choice: ссору
  rationale: Слово обозначает распрю, тяжбу или межличностный конфликт. «Ссора» доступна современному читателю и сохраняет конкретность единственного числа.
- source_word: נִרְגָּן
  choice: сплетник
  rationale: Существительное обозначает человека, который исподтишка распространяет вредящие отношениям речи. «Сплетник» естественно передаёт эту характеристику, тогда как буквальный «шептун» в современном русском менее ясен.
- source_word: מַפְרִיד
  choice: разлучает
  rationale: Причастие выражает привычное действие — разделять или отчуждать людей. «Разлучает» хорошо передаёт разрушение близких отношений.
- source_word: אַלּוּף
  choice: близких друзей
  rationale: Здесь слово означает близкого, доверенного друга или спутника. Русское множественное число передаёт обобщающий характер пословицы, хотя еврейская форма стоит в единственном числе.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая форма пословицы и параллелизм сохранены. Выражение «извращённый человек» отвергнуто из-за нежелательных современных ассоциаций, а «человек превратностей» — как неестественное и архаизирующее.
