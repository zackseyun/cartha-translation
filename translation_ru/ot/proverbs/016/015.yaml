  text: בְּ/אוֹר פְּנֵי מֶ֥לֶךְ חַיִּ֑ים וּ֝/רְצוֹנ֗/וֹ כְּ/עָ֣ב מַלְקֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/015.yaml
  text: In the light of a king’s face there is life[b][a], and his favor is like a cloud of spring rain.
translation:
  language: ru
  text: В свете лица царя — жизнь[a], и его благоволение — как облако весеннего дождя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имеется в виду благосклонное выражение лица царя: его расположение приносит жизнь и благополучие.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «позднего дождя» — весеннего дождя, необходимого для созревания урожая.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אוֹר
  choice: В свете
  rationale: Сохраняет образ еврейского текста и естественно передаёт сочетание предлога בְּ с существительным אוֹר.
- source_word: פְּנֵי
  choice: лица
  rationale: Буквальное и понятное соответствие; здесь лицо царя служит видимым выражением его расположения.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Прямое соответствие слову מֶלֶךְ с учётом русского падежного управления.
- source_word: חַיִּים
  choice: жизнь
  rationale: Еврейская форма множественного числа идиоматически обозначает жизнь; именная конструкция с тире естественна по-русски.
- source_word: וּ/רְצוֹנ/וֹ
  choice: и его благоволение
  rationale: רָצוֹן обозначает расположение, благосклонность, одобрение; «благоволение» уместно в царском контексте и сохраняет достоинство регистра.
- source_word: כְּ/עָב
  choice: как облако
  rationale: Прямо передаёт сравнительную конструкцию с כְּ и конкретный образ עָב.
- source_word: מַלְקוֹשׁ
  choice: весеннего дождя
  rationale: Обозначает поздний сезонный дождь, выпадающий весной и важный для созревания урожая; такой перевод понятен современному читателю.
