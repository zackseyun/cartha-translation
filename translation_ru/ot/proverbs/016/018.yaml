  text: לִ/פְנֵי שֶׁ֥בֶר גָּא֑וֹן וְ/לִ/פְנֵ֥י כִ֝שָּׁל֗וֹן גֹּ֣בַהּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/018.yaml
  text: Pride comes before destruction[a], and a haughty spirit before a fall.
translation:
  language: ru
  text: 'Перед гибелью — гордость[a],

    а перед падением — надменный дух.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Перед сокрушением — гордость, и перед преткновением — высота духа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: перед
  rationale: Предлог употреблён во временном значении и указывает на то, что предшествует последующему исходу.
- source_word: שֶׁבֶר
  choice: гибель
  rationale: Здесь слово означает не буквальное разбивание, а крушение или погибель; «гибель» естественно выражает итог в русском афористическом стиле.
- source_word: גָּאוֹן
  choice: гордость
  rationale: Хотя в иных контекстах слово может означать величие, параллелизм с гибелью придаёт ему здесь отрицательный нравственный смысл.
- source_word: וְלִפְנֵי
  choice: а перед
  rationale: Повтор предлога сохраняет уравновешенный параллелизм; союз «а» естественно связывает две соответствующие строки без смыслового противопоставления.
- source_word: כִּשָּׁלוֹן
  choice: падение
  rationale: Существительное обозначает преткновение или падение; «падение» понятно современному читателю и соответствует образу бедственного исхода.
- source_word: גֹּבַהּ רוּחַ
  choice: надменный дух
  rationale: Буквальный образ «высоты духа» в данном отрицательном контексте означает внутреннюю надменность. Выбор сохраняет слово «дух» и ясно передаёт нравственную окраску.
theological_decisions:
- issue: Нравственная окраска גָּאוֹן и גֹּבַהּ רוּחַ
  choice: 'Оба выражения переданы отрицательно: «гордость» и «надменный дух».'
  alternative: «Величие» и «возвышенность духа».
  rationale: Параллельная связь этих качеств с гибелью и падением определяет их отрицательное значение в данном контексте; это контекстуально-лексическое, а не конфессиональное решение.
- issue: Отсутствие выраженного глагола в еврейском тексте
  choice: Сохранена именная, эллиптическая конструкция с тире.
  alternative: «Гордость предшествует гибели, а надменный дух — падению».
  rationale: Эллиптическая форма сохраняет краткость, афористичность и некоторую открытость связи между качеством и последствием, не добавляя отсутствующего в оригинале глагола.
translation_notes:
  register: Современный литературный русский язык; краткая именная конструкция сохраняет достоинство, ритмический параллелизм и афористичность еврейской пословицы. Лексика понятна широкому кругу читателей, а буквальные образы отражены в сноске.
