  text: מַשְׂכִּ֣יל עַל דָּ֭בָר יִמְצָא ט֑וֹב וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה אַשְׁרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/020.yaml
  text: Whoever gives careful attention to a matter will find good[b][a], and blessed is he who trusts in Yahweh.
translation:
  language: ru
  text: Кто разумно относится к делу[a], тот найдёт благо, и блажен тот, кто полагается на Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто поступает благоразумно в деле»; «Кто рассудителен в каком-либо вопросе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל עַל־דָּבָר
  choice: разумно подходит к делу
  rationale: Причастие породы хифиль от שׂכל выражает практическое благоразумие, внимательное и разумное обращение с чем-либо. Сочетание с עַל־דָּבָר естественно передаётся по-русски как «разумно подходит к делу», без сужения смысла до одного лишь размышления.
- source_word: יִמְצָא טוֹב
  choice: найдёт благо
  rationale: Сохраняется образ «нахождения», а широкое טוֹב передано словом «благо», которое может обозначать добрый результат, пользу или благополучие и не сводит смысл к материальному успеху.
- source_word: וּבוֹטֵחַ בַּיהוָה
  choice: и ... тот, кто полагается на Яхве
  rationale: Причастие имеет обобщающий смысл. «Полагается на» естественно выражает устойчивое доверие, а личное имя יהוה передано как «Яхве».
- source_word: אַשְׁרָיו
  choice: блажен тот
  rationale: «Блажен» сохраняет формулу провозглашения благополучного, благословенного состояния и означает больше, чем субъективное чувство счастья. Конструкция «тот, кто» ясно передаёт обобщающий смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Характер обещанного «блага»
  choice: Сохранено широкое «найдёт благо»
  alternative: «добьётся успеха» или «обретёт благополучие»
  rationale: טוֹב допускает пользу, добрый исход и благополучие. Более узкий перевод мог бы необоснованно превратить изречение в обещание материального успеха.
translation_notes:
  register: Современный литературный русский с кратким ритмом притчи. «Блажен» сохранено как понятное возвышенное слово, соответствующее формуле אַשְׁרֵי; фраза «разумно подходит к делу» звучит естественно и передаёт практический оттенок еврейского выражения.
