  text: בְּ/חֶ֣סֶד וֶ֭/אֱמֶת יְכֻפַּ֣ר עָוֺ֑ן וּ/בְ/יִרְאַ֥ת יְ֝הוָ֗ה ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/006.yaml
  text: By steadfast love and faithfulness iniquity is atoned for[b][a], and by the fear of Yahweh one turns away from evil.
translation:
  language: ru
  text: Милостью и верностью искупается беззаконие[a], и благодаря страху перед Яхве человек уклоняется от зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Милостью и истиной искупается беззаконие». Еврейское слово אֱמֶת может означать как верность, так и истину. Пассивная форма «искупается» не указывает, кто совершает это действие.'
    reason: Лексическая альтернатива и сохранение неуказанного деятеля пассивной конструкции.
lexical_decisions:
- source_word: בְּחֶסֶד
  choice: милостью
  rationale: חֶסֶד охватывает милость, неизменную любовь и преданность. В сочетании с אֱמֶת русское «милостью и верностью» естественно и сохраняет нравственно-реляционный смысл; предлог ב передан инструментально.
- source_word: וֶאֱמֶת
  choice: и верностью
  rationale: אֱמֶת может означать как истину, так и верность или надёжность. В устойчивой паре חֶסֶד וֶאֱמֶת здесь предпочтительна «верность», однако возможность перевода «истина» отмечена в сноске.
- source_word: יְכֻפַּר
  choice: искупается
  rationale: Пуаль глагола כפר выражает пассивное совершение искупления или очищения. Безлично-пассивная форма сохраняет неуказанного в еврейском тексте деятеля.
- source_word: עָוֺן
  choice: беззаконие
  rationale: עָוֺן обозначает нравственную порочность, вину либо её последствия. «Беззаконие» сохраняет широкий нравственный смысл и не сужает его только до субъективного чувства вины.
- source_word: וּבְיִרְאַת יְהוָה
  choice: и страхом Яхве
  rationale: יִרְאַת יְהוָה в литературе мудрости означает благоговейный страх перед Богом. Инструментальная конструкция с ב передана творительным падежом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой научной транслитерацией, а не заменено титулом.
- source_word: סוּר מֵרָע
  choice: человек уклоняется от зла
  rationale: Глагольная форма имеет обобщённый характер, типичный для пословицы. Добавлен родовой субъект «человек» для естественного русского синтаксиса; מֵרָע передано как нравственное «от зла».
theological_decisions:
- issue: Указывает ли первая половина стиха, кем и на каком основании искупается беззаконие
  choice: Сохранена пассивная конструкция «искупается», не называющая деятеля.
  alternative: «Бог искупает беззаконие по Своей милости и верности» либо «милость и верность человека обеспечивают ему прощение».
  rationale: Еврейский пассив יְכֻפַּר не называет деятеля и допускает различное соотнесение милости и верности с искуплением. Перевод не превращает эту неоднозначность ни в утверждение о человеческой заслуге, ни в явно выраженное указание исключительно на действие Бога.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены параллелизм двух частей и богословская неоднозначность еврейского пассива; архаизмы сведены к традиционно понятному слову «беззаконие».
