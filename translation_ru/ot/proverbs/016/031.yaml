  text: עֲטֶ֣רֶת תִּפְאֶ֣רֶת שֵׂיבָ֑ה בְּ/דֶ֥רֶךְ צְ֝דָקָ֗ה תִּמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/031.yaml
  text: Gray hair is a crown of glory[b][a]; it is found in the way of righteousness.
translation:
  language: ru
  text: Седина — венец славы[b]; на пути праведности она находится[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на стезе праведности». Еврейский образ пути означает образ жизни, отмеченный праведностью.'
    reason: lexical_alternative
  - marker: b
    text: То есть седина почётна, когда она сопутствует праведной жизни. Пословица выражает общий принцип мудрости, а не безусловное обещание, что каждый праведник непременно доживёт до старости.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: венец
  rationale: Слово обозначает венец или окружающее голову украшение. «Венец» естественно передаёт метафору почёта и сохраняет возвышенный, но понятный регистр.
- source_word: תִּפְאֶרֶת
  choice: слава
  rationale: Слово может означать красоту, великолепие, славу или почёт. В сочетании с «венцом» слово «слава» передаёт возвышенный смысл общественного достоинства.
- source_word: שֵׂיבָה
  choice: седина
  rationale: Еврейское существительное прямо называет седые волосы и метонимически — старость. «Седина» сохраняет конкретный образ и естественно звучит по-русски.
- source_word: בְּדֶרֶךְ
  choice: на пути
  rationale: Буквальный образ пути в древнееврейском языке также обозначает образ жизни и нравственное поведение. Русское выражение «на пути» сохраняет обе стороны образа.
- source_word: צְדָקָה
  choice: праведность
  rationale: В данном контексте слово указывает на нравственно правильную, угодную Богу жизнь. «Праведность» сохраняет этическую и богословскую ёмкость исходного слова, не сводя его только к правосудию.
- source_word: תִּמָּצֵא
  choice: обретается
  rationale: Форма нифаля допускает значение «находится», а по смыслу также оттенок «обретается». Выбранный русский глагол естественен в афористической речи и сохраняет некоторую неоднозначность между обнаружением и достижением.
theological_decisions:
- issue: Смысловая сила второй строки
  choice: Пословица связывает почётность седины с жизнью на пути праведности и выражает общий принцип мудрости.
  alternative: Считать всякую старость безусловно почётной либо понимать стих как абсолютное обещание долголетия каждому праведнику.
  rationale: Краткая еврейская формулировка не уточняет логическую связь механистически. Перевод сохраняет связь седины с праведным жизненным путём, но не превращает мудрое обобщение в безусловную гарантию.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным афористическим звучанием. Сохранены параллелизм, метафора венца и образ жизненного пути; архаизмы и конфессионально маркированные уточнения не вводились.
