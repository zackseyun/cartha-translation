source:
  edition: WLC
  text: לְ/אָדָ֥ם מַֽעַרְכֵי לֵ֑ב וּ֝/מֵ/יְהוָ֗ה מַעֲנֵ֥ה לָשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/001.yaml
  text: The plans of the heart belong to man[b][a], but the answer of the tongue is from Yahweh.
translation:
  language: ru
  text: Человеку принадлежат замыслы сердца[a], но ответ языка — от Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Человеку — приготовления сердца, но ответ языка — от Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: человеку принадлежат
  rationale: Предлог לְ выражает принадлежность или отношение. Такая формулировка естественно передаёт безглагольную первую часть и сохраняет противопоставление выражению «от Яхве».
- source_word: מַעַרְכֵי
  choice: замыслы
  rationale: Существительное от ערך обозначает упорядочивание или приготовления; в сочетании с «сердцем» речь идёт о внутренних намерениях и планах. «Замыслы» сохраняют как идею обдуманного планирования, так и поэтическую краткость.
- source_word: לֵב
  choice: сердца
  rationale: Слово לֵב обозначает внутреннего человека, включая мышление и намерения. «Сердце» сохраняет еврейский образ, обычный для литературы мудрости.
- source_word: וּמֵיְהוָה
  choice: но ... от Яхве
  rationale: Хотя וְ буквально может означать «и», параллелизм здесь выражает противопоставление человеческих замыслов и источника произнесённого ответа; «но» естественно передаёт этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: מַעֲנֵה
  choice: ответ
  rationale: Прямое значение — «ответ, отклик»; слово соответствует краткому афористическому стилю стиха.
- source_word: לָשׁוֹן
  choice: языка
  rationale: Буквальная метонимия речи сохраняет конкретный поэтический образ оригинала; «ответ языка» означает произнесённый ответ.
theological_decisions:
- issue: Соотношение человеческого намерения и Божьего владычества
  choice: 'Сохранено противопоставление: внутренние замыслы относятся к человеку, а произнесённый ответ исходит от Яхве.'
  alternative: Понять вторую строку шире — как утверждение о Божьем управлении всеми результатами; либо конкретнее — как утверждение, что Бог управляет даже речью самого человека.
  rationale: Еврейский текст непосредственно сопоставляет «замыслы сердца» человека с «ответом языка» от Яхве. Перевод сохраняет эту богословскую напряжённость, не превращая афоризм ни в исчерпывающую детерминистскую формулу, ни в общее утверждение о провидении.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем пословицы. Родительный оборот «замыслы сердца» сохраняет образ оригинала; представительному единственному אָדָם соответствует нейтрально-обобщающее «человеку».
