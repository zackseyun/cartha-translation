source:
  edition: WLC
  text: לֵ֣ב אָ֭דָם יְחַשֵּׁ֣ב דַּרְכּ֑/וֹ וַֽ֝/יהוָ֗ה יָכִ֥ין צַעֲדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/009.yaml
  text: A man's heart plans his way[a], but Yahweh establishes his steps.
translation:
  language: ru
  text: Сердце человека намечает свой путь, но Яхве утверждает его шаги.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «направляет его шаги». Древнееврейский глагол может означать «делать твёрдым», «утверждать», а в данном контексте — «направлять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: В древнееврейском представлении לֵב обозначает внутреннего человека как средоточие мысли и намерения, а не только чувств. «Сердце» сохраняет исходный образ и естественно звучит в русской пословичной речи.
- source_word: אָדָם
  choice: человек
  rationale: Единственное число употреблено обобщённо и обозначает отдельного представителя человеческого рода. Русское «человек» точно передаёт этот смысл без ненужного указания на пол.
- source_word: יְחַשֵּׁב
  choice: намечает
  rationale: Пиэль глагола חשׁב здесь выражает обдуманное намерение и составление замысла. «Намечает» передаёт целенаправленное планирование и естественно сочетается с образом пути.
- source_word: דַּרְכּוֹ
  choice: свой путь
  rationale: דֶּרֶךְ может обозначать как дорогу, так и образ жизни или намеченный ход дел. «Свой путь» сохраняет эту образную многозначность и образует параллель со «шагами».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является принятой современной русской транслитерацией тетраграмматона.
- source_word: יָכִין
  choice: утверждает
  rationale: Хифиль глагола כון означает делать твёрдым, устанавливать, обеспечивать устойчивость. «Утверждает» сохраняет причинный оттенок и не сужает смысл исключительно до руководства направлением.
- source_word: צַעֲדוֹ
  choice: его шаги
  rationale: Хотя форма существительного единственного числа, в данном употреблении она имеет собирательный смысл. Множественное «шаги» естественно по-русски и сохраняет конкретный образ движения по жизненному пути.
theological_decisions:
- issue: Божественное владычество и человеческое планирование
  choice: Сохранено сопоставление подлинного человеческого замысла («намечает свой путь») с решающим действием Яхве («утверждает его шаги»).
  alternative: «Яхве направляет его шаги» или «Яхве определяет его шаги».
  rationale: Древнееврейский текст ставит рядом человеческое намерение и Божье установление результата, не объясняя их соотношение. «Утверждает» сохраняет это напряжение, тогда как «направляет» подчёркивало бы преимущественно руководство, а «определяет» могло бы придать высказыванию более жёсткий детерминистский оттенок.
translation_notes:
  register: Краткий, современный литературный русский с сохранением пословичного параллелизма и исходных образов сердца, пути и шагов. Формулировка понятна широкому читателю, но сохраняет достоинство и смысловую плотность древнееврейского текста.
