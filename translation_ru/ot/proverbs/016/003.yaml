base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/003.yaml
  text: Commit your works to Yahweh[b][a], and your plans will be established.
translation:
  language: ru
  text: Вверь Яхве свои дела[a], и твои замыслы[b] утвердятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Перекати свои дела на Яхве»; этот образ означает доверить их ему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мысли»; «намерения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Вверь
  rationale: Повелительная форма буквально означает «перекати», но в сочетании с направлением к Яхве выражает передачу своих дел под его попечение. «Вверь» естественно передаёт эту идиому, а буквальный образ сохранён в сноске.
- source_word: אֶל
  choice: Яхве (дательный объект при «вверь»)
  rationale: Предлог указывает направление — «к Яхве». В русском идиоматичное «вверить Яхве» передаёт эту синтаксическую связь без неестественной кальки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой современной транслитерацией, а не заменено титулом «Господь».
- source_word: מַעֲשֶׂיךָ
  choice: свои дела
  rationale: Слово охватывает поступки, деятельность и начинания. «Дела» сохраняет широту значения и естественно звучит в русском изречении.
- source_word: וְיִכֹּנוּ
  choice: утвердятся
  rationale: Нифаль глагола כון обозначает состояние прочности, устойчивости или установленности. «Утвердятся» кратко сохраняет результативно-пассивный оттенок.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: твои замыслы
  rationale: Существительное может обозначать мысли, намерения или планы. «Замыслы» уместно связано с предшествующими «делами», не устраняя полностью внутренний, мыслительный оттенок слова; варианты отмечены в сноске.
theological_decisions:
- issue: Соотношение человеческих действий и Божьего утверждения
  choice: Изречение призывает вверить свои дела Яхве и обещает, что вследствие этого замыслы обретут устойчивость.
  alternative: Понимать стих либо как утверждение, что Бог односторонне предопределяет любые человеческие планы, либо как гарантию земного успеха каждого начинания.
  rationale: Еврейский текст формулирует мудрое наставление и его результат, но не излагает исчерпывающего учения о провидении и не обещает успеха любому желанию. Перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным строем притчи. Метафорическая буквальность первого глагола вынесена в сноску, чтобы основной текст оставался понятным и естественным.
