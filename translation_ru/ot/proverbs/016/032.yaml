base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
translation:
  language: ru
  text: Лучше тот, кто не спешит гневаться,[a] чем сильный человек; и тот, кто владеет своим духом,[b] — чем тот, кто захватывает город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «терпелив». Буквально: «долгий ноздрями» — еврейское выражение о том, кто медленно приходит в гнев.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своим нравом»; по смыслу также возможно: «собой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше тот… чем…
  rationale: В этой сравнительной мудрой сентенции טוֹב вместе с מִן вводит конструкцию «лучше… чем…»; такой порядок естественен для русского афористического стиля.
- source_word: אֶרֶךְ אַפַּיִם
  choice: кто не спешит гневаться
  rationale: Еврейская идиома буквально означает «долгий ноздрями» и описывает человека, который медленно приходит в гнев. Формулировка передаёт смысл ясно и без расширения до терпения вообще.
- source_word: מִגִּבּוֹר
  choice: чем могучий воин
  rationale: גִּבּוֹר может обозначать сильного, доблестного человека и нередко имеет военный оттенок. «Могучий воин» естественно подготавливает параллель с захватом города.
- source_word: וּמֹשֵׁל
  choice: и владеющий
  rationale: Причастие обозначает устойчивое свойство человека. «Владеющий» сохраняет идею господства и образует ёмкую параллель первой строке.
- source_word: בְּרוּחוֹ
  choice: своим духом
  rationale: רוּחַ здесь относится к внутреннему расположению и побуждениям человека. «Своим духом» сохраняет широту исходного слова, а возвратное местоимение естественно по-русски указывает на дух самого действующего лица.
- source_word: מִלֹּכֵד עִיר
  choice: чем захвативший город
  rationale: לכד означает захватить или взять, особенно в военном контексте. Причастная конструкция сохраняет краткость и завершает противопоставление внутреннего самообладания внешнему завоеванию.
theological_decisions:
- issue: Антропологический смысл רוּחַ в контексте литературы мудрости
  choice: «своим духом» — внутренними побуждениями и расположением человека
  alternative: «собой» как более широкая передача; «своим нравом» или «гневом» как более узкое истолкование
  rationale: Изречение сопоставляет власть над внутренней жизнью с военным завоеванием. «Духом» сохраняет многозначность еврейского слова и не сводит его только к вспыльчивости или ко всей личности без различения.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным афористическим строем. Военная образность сохранена, как и параллелизм между сдерживанием гнева, властью над внутренним духом и захватом города.
