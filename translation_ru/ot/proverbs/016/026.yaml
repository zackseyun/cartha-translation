source:
  edition: WLC
  text: נֶ֣פֶשׁ עָ֭מֵל עָ֣מְלָה לּ֑/וֹ כִּֽי אָכַ֖ף עָלָ֣י/ו פִּֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/026.yaml
  text: The appetite of a laborer labors for him[c][b][a], for his mouth presses him on.
translation:
  language: ru
  text: Аппетит труженика трудится для него[a][b], потому что его рот понуждает его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Душа (или желание) труженика трудится для него». Еврейское слово может означать «душа», «жизнь», «желание» или «аппетит»; упоминание рта в продолжении говорит в пользу значения «аппетит».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «трудится для себя». Буквально в еврейском тексте: «для него», но это выражение можно понимать в возвратном смысле.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «подгоняет его», «торопит его», «заставляет его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: аппетит
  rationale: Слово может обозначать душу, жизнь, желание или аппетит. Упоминание рта во второй строке указывает здесь прежде всего на телесную потребность в пище; «аппетит» сохраняет и образ, и смысл.
- source_word: עָמֵל
  choice: труженик
  rationale: Слово обозначает того, кто трудится. «Труженик» позволяет естественно сохранить однокоренную связь со следующим глаголом.
- source_word: עָמְלָה
  choice: трудится
  rationale: 'Перевод сохраняет еврейскую игру однокоренных слов עָמֵל и עָמְלָה: «труженик трудится».'
- source_word: לּוֹ
  choice: для него
  rationale: Это прямое соответствие еврейской форме третьего лица единственного числа. Возможный возвратный смысл не вносится в основной текст.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой потребность человека заставляет его трудиться.
- source_word: אָכַף
  choice: понуждает
  rationale: Глагол выражает давление или принуждение. «Понуждает» передаёт эту силу, не превращая её непременно в абсолютное принуждение.
- source_word: עָלָיו
  choice: его
  rationale: При глаголе אָכַף предлог с местоименным суффиксом обозначает человека, на которого оказывается давление; по-русски это естественно выражается прямым дополнением.
- source_word: פִּיהוּ
  choice: его рот
  rationale: Буквальный образ рта сохранён, поскольку в пословице он олицетворяет голод или телесную нужду, побуждающую к труду.
