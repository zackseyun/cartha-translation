  source_fidelity: 'Основной текст точно передаёт синтаксический образ еврейского оригинала: נֶפֶשׁ понимается как «аппетит», עָמֵל / עָמְלָה отражены однокоренным сочетанием «труженик трудится», а «его рот» сохранён как олицетворённая побуждающая сила. «Для него» обоснованно сохраняет формально невозвратное לּוֹ, не устраняя возможный рефлексивный оттенок.'
  naturalness: Фраза намеренно афористична и несколько парадоксальна вслед за оригиналом. «Аппетит труженика трудится для него» не является нейтральной разговорной формулировкой, но в современном литературном русском понятна и удачно сохраняет персонификацию и словесную связь исходного текста. «Понуждает» уместно в кратком книжно-пословичном регистре.
  terminology: «Аппетит», «труженик», «рот» и «понуждает» подобраны последовательно и не привносят богословской интерпретации. Примечание к נֶפֶשׁ корректно указывает возможные значения, а примечание к «для него» сохраняет спорный рефлексивный способ понимания без его навязывания.
