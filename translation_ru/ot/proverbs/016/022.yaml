  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים שֵׂ֣כֶל בְּעָלָ֑י/ו וּ/מוּסַ֖ר אֱוִלִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/022.yaml
  text: Understanding is a fountain of life to its possessor[b][a], but the discipline of fools is folly.
translation:
  language: ru
  text: Разум — источник жизни для того, кто им обладает,[a] а вразумление глупцов — глупость.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разум — родник жизни для того, у кого он есть».'
    reason: lexical_alternative
  - marker: b
    text: «Вразумление» можно также перевести как «наставление», «исправление» или «дисциплина». Возможно, смысл в том, что даже служащее глупцам исправлением остаётся для них лишь глупостью.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר
  choice: источник
  rationale: Слово обозначает источник или родник. «Источник» сохраняет конкретный образ и одновременно естественно сочетается в русском языке с «жизнью».
- source_word: חַיִּים
  choice: жизнь
  rationale: Хотя форма морфологически множественного числа, здесь это обычное древнееврейское обозначение жизни как целого; в русском естественно единственное число.
- source_word: שֵׂכֶל
  choice: разум
  rationale: В Притчах слово обозначает здравое, практически проявляющееся понимание. «Разум» краток, понятен и хорошо противопоставлен глупости.
- source_word: בְּעָלָיו
  choice: для того, кто им обладает
  rationale: Буквально — «для его обладателя». Описательная конструкция естественнее по-русски, сохраняет единственное число и ясно относит местоимение к разуму.
- source_word: מוּסַר
  choice: вразумление
  rationale: Слово охватывает наставление, исправление и дисциплинарное воздействие. «Вразумление» передаёт направленность на исправление, не сводя смысл только к наказанию.
- source_word: אֱוִלִים
  choice: глупцов
  rationale: Устойчивое обозначение в Притчах нравственно и умственно неразумных людей; родительный падеж сохраняет неоднозначность отношения к «вразумлению».
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Прямое и современное обозначение свойства глупцов; повтор корня в древнееврейском передаётся созвучием «глупцов — глупость».
theological_decisions:
- issue: Отношение «вразумления» к глупцам во второй строке
  choice: Сохранена неоднозначная конструкция «вразумление глупцов»
  alternative: «То, чем исправляют глупцов» или «наставление, исходящее от глупцов»
  rationale: Древнееврейская конструкция допускает понимание как исправления, предназначенного глупцам, так и связанного с ними наставления; контекст не требует устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; афористическая двухчастная форма сохранена. Конкретная метафора источника и резкое заключительное противопоставление переданы без конфессионального истолкования.
