  text: לֵ֣ב חָ֭כָם יַשְׂכִּ֣יל פִּ֑י/הוּ וְ/עַל שְׂ֝פָתָ֗י/ו יֹסִ֥יף לֶֽקַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/023.yaml
  text: The heart of a wise man gives insight to his mouth[b][a], and adds learning to his lips.
translation:
  language: ru
  text: Сердце мудрого вразумляет его речь и умножает наставление в его словах.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делает его речь разумной» или «наделяет его уста благоразумием». Древнееврейский глагол может обозначать, что сердце делает речь разумной или благоразумной.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «умножает убедительность его слов». Древнееврейское слово לֶקַח означает «наставление», «поучение», «учение»; в данном контексте оно также может обозначать поучительную или убедительную речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет древнееврейский образ внутреннего средоточия мысли, воли и рассуждения; перевод «ум» был бы уже по смыслу, но устранял бы исходную метафору.
- source_word: חָכָם
  choice: мудрого
  rationale: Субстантивированное прилагательное мужского рода передано естественной русской конструкцией «сердце мудрого», сохраняющей грамматическую форму и обобщающий смысл.
- source_word: יַשְׂכִּיל
  choice: делает … разумными
  rationale: Каузативная форма глагола שׂכל указывает на наделение разумением или благоразумием. Такой перевод сохраняет причинный смысл, не сводя его лишь к обучению.
- source_word: פִּיהוּ
  choice: его уста
  rationale: Конкретный поэтический образ сохранён; «уста» уместны в литературном регистре притчи и обозначают речь человека.
- source_word: וְעַל
  choice: и
  rationale: 'Предлог עַל в русском не требует отдельного буквального соответствия: его пространственное значение естественно выражено всей конструкцией о словах, исходящих из уст.'
- source_word: שְׂפָתָיו
  choice: его словам
  rationale: Буквально — «его губам». В русском сочетание «придаёт губам убедительность» звучит неестественно, поэтому метонимия раскрыта как «слова», при сохранении параллели с «устами» в первой строке.
- source_word: יֹסִיף
  choice: придаёт
  rationale: В данном сочетании естественно передаёт идею добавления или увеличения качества речи.
- source_word: לֶקַח
  choice: убедительность
  rationale: Слово может означать наставление, усвоенное знание или поучительность; в контексте речи мудрого оно допускает производный смысл убедительной, способной быть принятой речи. Более прямой вариант отмечен в сноске.
theological_decisions:
- issue: Связь внутренней мудрости и речи
  choice: 'Сохранена причинная связь: сердце мудрого формирует разумную и убедительную речь.'
  alternative: Понимать строку как утверждение, что мудрец сознательно обучает свои уста.
  rationale: Каузативная форма допускает оттенок обучения, но прежде всего изображает внутреннюю мудрость источником качества речи; перевод не вводит дополнительного учения о природе сердца.
translation_notes:
  register: Современный литературный русский язык с кратким афористичным строем. Слово «уста» сохраняет поэтический образ оригинала, тогда как «его словам» во второй части избегает неестественного сочетания «придаёт губам убедительность». Все смысловые альтернативы, существенные для неоднозначных глагола יַשְׂכִּיל и существительного לֶקַח, вынесены в сноски.
