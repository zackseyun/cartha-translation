  text: מְסִלַּ֣ת יְ֭שָׁרִים ס֣וּר מֵ/רָ֑ע שֹׁמֵ֥ר נַ֝פְשׁ֗/וֹ נֹצֵ֥ר דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/017.yaml
  text: The highway of the upright turns away from evil[b][a]; he who guards his life watches over his way.
translation:
  language: ru
  text: Путь праведных — уклонение от зла[a]; кто бережёт свою жизнь[b], тот хранит свой путь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Путь праведных — удаление от зла». Еврейское выражение допускает более формальную именную передачу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свою душу»; здесь еврейское נֶפֶשׁ, вероятно, означает жизнь человека или его самого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְסִלַּת
  choice: дорога
  rationale: Слово обозначает проложенную, часто возвышенную дорогу. «Дорога» естественно передаёт образ определённого жизненного пути; более буквальное «большая дорога» по-русски звучит неестественно.
- source_word: יְשָׁרִים
  choice: честных
  rationale: Прилагательное характеризует нравственно прямых людей. «Честных» передаёт этический смысл и не отождествляет слово с иными еврейскими терминами, обычно переводимыми как «праведные».
- source_word: סוּר מֵרָע
  choice: уклоняться от зла
  rationale: Инфинитивное выражение описывает, в чём состоит дорога честных. Глагольный оборот сохраняет деятельный смысл удаления от нравственного зла.
- source_word: רָע
  choice: зло
  rationale: В данном контексте слово имеет прежде всего нравственный смысл, а не просто обозначает вред или беду.
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: кто бережёт свою жизнь
  rationale: נֶפֶשׁ здесь означает жизнь или самого человека, а не «душу» как специальный антропологический термин. «Бережёт» естественно выражает заботу о сохранении жизни.
- source_word: נֹצֵר דַּרְכּוֹ
  choice: тот следит за своим путём
  rationale: נצר означает внимательное хранение и наблюдение. «Следит за своим путём» сохраняет метафору поведения и позволяет отличить этот глагол от שׁמר в первой половине параллели.
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте литературы мудрости
  choice: жизнь человека
  alternative: душа
  rationale: Пословица связывает нравственную осмотрительность с самосохранением. Перевод «жизнь» не привносит в текст не требуемого здесь противопоставления души и тела.
- issue: Характер выражения סוּר מֵרָע
  choice: сохранить деятельное значение «уклоняться от зла»
  alternative: именное выражение «удаление от зла»
  rationale: Еврейская конструкция допускает более именное прочтение, однако инфинитив по-русски лучше сохраняет призыв к действию, не устраняя исходной предикативной неоднозначности; формальная альтернатива дана в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким афористичным синтаксисом. Сохранён образ дороги и параллелизм двух частей; избегаются как излишняя архаика («стезя»), так и техническое богословское понимание слова «душа».
