base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
translation:
  language: ru
  text: Правдивые уста — радость для царей[a], и царь любит того, кто говорит правду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Правдивые уста пользуются благоволением царей». Еврейское слово רְצוֹן может означать благоволение, удовольствие или радость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорит то, что справедливо». Еврейское слово יְשָׁרִים — субстантивированная форма мужского рода множественного числа; по смыслу: «то, что прямо и правильно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: отрада
  rationale: Существительное обозначает благоволение, удовольствие или то, что приятно. «Отрада» естественно передаёт здесь то, чему цари радуются, сохраняя именную форму еврейского предложения.
- source_word: מְלָכִים
  choice: царям
  rationale: Прямой перевод множественного числа «цари»; дательный падеж обусловлен русской конструкцией «отрада царям».
- source_word: שִׂפְתֵי צֶדֶק
  choice: правдивые уста
  rationale: Буквально «уста праведности/справедливости». Сочетание метонимически обозначает нравственно верную и честную речь; «правдивые уста» звучит по-русски естественнее, чем буквальное «уста праведности».
- source_word: וְדֹבֵר
  choice: и ... того, кто говорит
  rationale: Причастие употреблено субстантивно и обозначает человека, который говорит; русская придаточная конструкция сохраняет обобщённый смысл.
- source_word: יְשָׁרִים
  choice: правду
  rationale: 'Форма множественного числа употреблена субстантивно: буквально «прямое, правильное». В контексте речи естественный русский эквивалент — «правду»; возможный оттенок справедливости отмечен в сноске.'
- source_word: יֶאֱהָב
  choice: царь любит
  rationale: Глагол стоит в 3-м лице единственного числа и выражает обычное, характерное действие. Родовое «царь» делает эту форму ясной по-русски, не заменяя её множественным числом.
