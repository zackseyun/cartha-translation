  text: עֹצֶ֣ה עֵ֭ינָי/ו לַ/חְשֹׁ֣ב תַּהְפֻּכ֑וֹת קֹרֵ֥ץ שְׂ֝פָתָ֗י/ו כִּלָּ֥ה רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/030.yaml
  text: He who shuts his eyes to devise perverse things[a], who purses his lips[b], has completed evil.
translation:
  language: ru
  text: 'Кто закрывает глаза, замышляя превратное,

    и сжимает губы, тот довёл зло до конца.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот совершил зло»; еврейский глагол подчёркивает доведение зла до завершения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹצֶה עֵינָיו
  choice: прищуривает глаза
  rationale: Оборот описывает намеренное смыкание или сужение глаз; «прищуривает» естественно передаёт выразительный жест человека, замышляющего зло.
- source_word: לַחְשֹׁב
  choice: замышляя
  rationale: В сочетании с нравственно отрицательным дополнением глагол выражает намеренное обдумывание и составление злого замысла.
- source_word: תַּהְפֻּכוֹת
  choice: превратное
  rationale: Собирательная форма сохраняет идею извращённого, кривого и нравственно порочного, не сводя её только к конкретным «планам» или «поступкам».
- source_word: קֹרֵץ שְׂפָתָיו
  choice: поджимает губы
  rationale: Прямое дополнение — «губы», поэтому здесь קרץ обозначает их сжатие как выразительный жест, а не подмигивание.
- source_word: כִּלָּה רָעָה
  choice: доводит зло до конца
  rationale: Пиэль глагола כלה подчёркивает завершение или полное осуществление зла; русский оборот передаёт результативность естественнее, чем буквальное «завершает зло».
