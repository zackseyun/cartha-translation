  text: A violent man entices his neighbor and leads him in a way that is not good[a][b].
translation:
  language: ru
  text: Жестокий человек заманивает своего ближнего[a] и ведёт его по дурному пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего друга» или «своего товарища».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «по пути, который не добр».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָמָס
  choice: человек, склонный к насилию
  rationale: Сочетание обозначает человека, для которого характерно насилие. Такой перевод естественен по-русски и сохраняет нравственную силу исходного выражения, не сужая его до отдельного насильственного поступка.
- source_word: יְפַתֶּה
  choice: заманивает
  rationale: Порода пиэль глагола פתה здесь передаёт вовлечение другого человека в дурной образ действий. «Заманивает» сохраняет оттенок соблазнения или приманивания, не утверждая прямо, что речь непременно идёт об обмане.
- source_word: רֵעֵהוּ
  choice: своего ближнего
  rationale: רֵעַ может обозначать ближнего, друга или товарища. «Ближний» сохраняет широкий межличностный смысл и не предполагает непременно тесной дружбы.
- source_word: וְהוֹלִיכוֹ
  choice: и ведёт его
  rationale: Каузативная форма глагола הלך означает «заставляет идти» или «ведёт». Русское «ведёт его» естественно передаёт эту каузативность.
- source_word: בְּדֶרֶךְ לֹא טוֹב
  choice: по недоброму пути
  rationale: Сохраняется метафора пути как образа поведения или жизненного направления. «Недоброму» передаёт намеренно сдержанное לֹא טוֹב («не добрый»), не усиливая его до однозначного «злого».
