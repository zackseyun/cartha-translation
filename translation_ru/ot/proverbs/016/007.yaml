source:
  edition: WLC
  text: בִּ/רְצ֣וֹת יְ֭הוָה דַּרְכֵי אִ֑ישׁ גַּם א֝וֹיְבָ֗י/ו יַשְׁלִ֥ם אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/007.yaml
  text: When a man's ways please Yahweh[a], he makes even his enemies be at peace with him.
translation:
  language: ru
  text: Когда пути человека угодны Господу[a], Он даже врагов его примиряет с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит имя Бога — Яхве.
    reason: Уточнение формы божественного имени в исходном тексте.
lexical_decisions:
- source_word: בִּרְצוֹת
  choice: когда ... угодны
  rationale: Предлог ב с инфинитивом רצה образует обстоятельственно-временную конструкцию. Русское «когда пути… угодны» естественно передаёт смысл благоволения и сохраняет структуру высказывания.
- source_word: יְהוָה
  choice: Господу
  rationale: Божественное имя передано традиционным русским библейским соответствием «Господь», уместным для литературного русского текста; примечание указывает форму исходного текста.
- source_word: דַּרְכֵי אִישׁ
  choice: пути человека
  rationale: «Пути» обозначают поведение и образ жизни, а אִישׁ здесь имеет обобщающее значение. «Человека» естественно и точно передаёт эту родовую силу без ограничения только мужчинами.
- source_word: גַּם
  choice: даже
  rationale: 'Частица усиливает неожиданную широту результата: воздействие распространяется даже на врагов.'
- source_word: אֹיְבָיו
  choice: врагов его
  rationale: Прямое соответствие существительному во множественном числе с местоименным суффиксом; порядок слов поддерживает достойный библейский регистр.
- source_word: יַשְׁלִם
  choice: примиряет
  rationale: Каузативная форма корня שלם в сочетании с אִתּוֹ выражает приведение к миру. «Примиряет с ним» естественно передаёт причинительное значение, не утверждая непременно взаимной внутренней дружбы.
- source_word: אִתּוֹ
  choice: с ним
  rationale: Предлог обозначает отношение совместности и естественно сочетается по-русски с «примиряет».
theological_decisions:
- issue: Обобщающее значение אִישׁ
  choice: человека
  alternative: мужчины / мужа
  rationale: В контексте изречения мужской род имеет представительное, общечеловеческое значение. Русское «человека» сохраняет единственное число и не сужает применение стиха.
- issue: Передача имени יהוה
  choice: Господь с примечанием о форме «Яхве»
  alternative: Яхве
  rationale: Основной текст сохраняет естественный и укоренившийся русский библейский регистр, а примечание прозрачно сообщает, что в еврейском стоит личное имя Бога.
- issue: Степень обещания о врагах
  choice: Он даже врагов его примиряет с ним
  alternative: Он делает так, что даже враги живут с ним в мире
  rationale: Каузативная форма приписывает результат действию Господа. Формулировка сохраняет силу общего мудрого наблюдения и не добавляет абсолютного обещания отсутствия всякого конфликта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и афористичен; местоимение «Он» написано с прописной буквы как ясная отсылка к Господу.
