  rationale: Обозначает имущество, захваченное как военная или иная добыча; это ясный современный русский эквивалент.
- source_word: אֶת גֵּאִים
  choice: с гордецами
  rationale: אֶת вновь указывает на совместность, а גֵּאִים обозначает гордых или высокомерных людей. «Гордецы» образует выразительный контраст со «смиренным духом».
