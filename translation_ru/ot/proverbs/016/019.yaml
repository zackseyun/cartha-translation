  rationale: Передаёт сравнительную оценку и сохраняет краткую форму изречения.
- source_word: שְׁפַל רוּחַ
  choice: быть смиренным духом
  rationale: Передаёт внутреннюю кротость и отсутствие гордости; выражение звучит естественно и сохраняет упоминание духа.
- source_word: אֶת עניים
  choice: с бедными
