  text: אִ֣ישׁ בְּ֭לִיַּעַל כֹּרֶ֣ה רָעָ֑ה וְ/עַל שפתי/ו כְּ/אֵ֣שׁ צָרָֽבֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/027.yaml
  text: A worthless man digs up evil[b][a], and on his lips is a scorching fire.
translation:
  language: ru
  text: Негодный человек выкапывает зло[a], и на устах у него — словно опаляющий огонь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкапывает беду»; еврейское слово может обозначать как нравственное зло, так и причиняемый вред или бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и на его устах — как опаляющий огонь».'
    reason: literal_rendering
lexical_decisions:
- source_word: אִישׁ
  choice: человек
  rationale: В русском «человек» естественно передаёт единичный мужской образ без ненужного акцента на поле; это типичный персонаж притчи.
- source_word: בְּלִיַּעַל
  choice: негодный
  rationale: Здесь слово характеризует нравственно порочного, низкого человека и не является именем собственным. «Негодный» сохраняет оценочную силу и достоинство регистра.
- source_word: כֹּרֶה
  choice: выкапывает
  rationale: Причастие от כרה буквально передаёт действие копания; метафора изображает человека, который извлекает или замышляет зло.
- source_word: רָעָה
  choice: зло
  rationale: Слово может обозначать как нравственное зло, так и причиняемую беду; «зло» сохраняет наиболее широкий смысл, а примечание отмечает альтернативу.
- source_word: שפתיו
  choice: на устах у него
  rationale: Сохранён буквальный поэтический образ губ/уст; «на устах у него» звучит естественно и возвышенно, но понятно современному читателю.
- source_word: כְאֵשׁ צָרָבֶת
  choice: словно опаляющий огонь
  rationale: כְ выражает сравнение, а редкое צָרָבֶת указывает на жгучее, опаляющее действие. Перевод сохраняет и сравнение, и разрушительную интенсивность речи.
