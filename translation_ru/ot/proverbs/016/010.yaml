  text: קֶ֤סֶם עַֽל שִׂפְתֵי מֶ֑לֶךְ בְּ֝/מִשְׁפָּ֗ט לֹ֣א יִמְעַל פִּֽי/ו׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/010.yaml
  text: A divine verdict is on the lips of a king[b][a]; his mouth does not betray justice.
translation:
  language: ru
  text: Божественное решение[a] — на устах царя; при суде[b] его речь не изменяет правосудию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское ке́сем обычно означает «гадание» или «прорицание»; здесь, в контексте царского суда, возможны также: «изречение свыше» или «оракул».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в суде» или «при вынесении решения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶסֶם
  choice: божественный приговор
  rationale: Слово обычно обозначает гадание или прорицание, но здесь параллельная строка говорит о справедливом царском суде. Выбранный вариант передаёт возвышенный, оракульный характер царского решения, не создавая впечатления, будто пословица одобряет оккультную практику; неоднозначность отмечена в сноске.
- source_word: עַל שִׂפְתֵי מֶלֶךְ
  choice: на устах царя
  rationale: 'Сохранён образ безглагольного еврейского предложения и обобщающий смысл: речь идёт о царе как носителе судебной власти, а не обязательно об одном определённом царе.'
- source_word: בְּמִשְׁפָּט
  choice: в суде
  rationale: Предлог с существительным может указывать на сферу или обстоятельства вынесения решения. Краткий русский оборот сохраняет юридический смысл и исходную синтаксическую неоднозначность.
- source_word: לֹא יִמְעַל
  choice: не изменяют
  rationale: Глагол מעל выражает неверность, вероломство или нарушение доверия. Сочетание «не изменяют справедливости» естественно передаёт мысль о судебной речи, которая не оказывается неверной правосудию.
- source_word: פִּיו
  choice: его уста
  rationale: Сохранён конкретный образ органа речи и связь со словом «уста» в первой строке; множественная грамматическая форма русского слова требует сказуемого «не изменяют».
theological_decisions:
- issue: Следует ли понимать קֶסֶם в обычном отрицательном смысле гадания или положительно в контексте царского суда
  choice: Положительное контекстуальное значение «божественный приговор»
  alternative: «гадание» или «прорицание» на устах царя
  rationale: Параллельная строка описывает верность справедливости при суде, поэтому стих, вероятнее всего, рисует идеал авторитетного царского решения, а не одобряет запрещённое гадание. Вместе с тем обычный смысл слова не скрыт и приведён в сноске.
- issue: Описывает ли вторая строка неизменный факт или нормативный идеал царской власти
  choice: Сохранено формально утвердительное «не изменяют», без добавления модального «не должны»
  alternative: «не должны изменять справедливости»
  rationale: Еврейский текст формулирует утверждение без явного модального показателя. Пословичный контекст может подразумевать идеал царского поведения, но перевод не делает этот нормативный оттенок эксплицитным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Уста» сохранены ради поэтического параллелизма и образа судебной речи; синтаксис остаётся кратким и афористичным.
