  text: קְֽנֹה חָכְמָ֗ה מַה טּ֥וֹב מֵ/חָר֑וּץ וּ/קְנ֥וֹת בִּ֝ינָ֗ה נִבְחָ֥ר מִ/כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/016.yaml
  text: To acquire wisdom—how much better than gold! And to acquire understanding is to be chosen over silver.
translation:
  language: ru
  text: Приобретай мудрость — ведь она намного лучше золота! Приобретать разумение предпочтительнее серебра.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְנֹה / וּקְנוֹת
  choice: приобрести
  rationale: Оба инфинитива от קנה переданы одинаково, с сохранением параллелизма и смысла обретения ценного достояния.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Прямой и устойчивый русский эквивалент для библейской практической и нравственной мудрости.
- source_word: חָרוּץ
  choice: золото
  rationale: В данном контексте слово обозначает драгоценный металл, вероятно золото высокой пробы; общее «золото» звучит естественно и не вносит излишней конкретизации.
- source_word: בִּינָה
  choice: разумение
  rationale: Передаёт способность различать и постигать, а также сохраняет отличие от «мудрости» в первой строке.
- source_word: נִבְחָר
  choice: предпочтительнее
  rationale: Пассивная форма выражает то, что следует выбирать или предпочитать; сравнительная конструкция по-русски естественно передаёт этот смысл.
- source_word: כָּסֶף
  choice: серебро
  rationale: Прямой эквивалент в параллели с золотом.
theological_decisions:
- issue: Ценность мудрости и разумения по сравнению с богатством
  choice: Сохранено прямое превосходство мудрости над золотом и разумения над серебром.
  alternative: Ослабить сравнение до утверждения, что мудрость просто хороша или полезна.
  rationale: Еврейские сравнительные конструкции מֵחָרוּץ и מִכָּסֶף подчёркивают превосходство, а не только положительную ценность.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической речи. Восклицание в первой строке передаёт эмоциональное מַה־טּוֹב; синтаксический параллелизм обеих полов сохранён без искусственной архаизации.
