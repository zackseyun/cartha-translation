  text: The wise of heart is called discerning[a], and sweetness of lips increases learning.
translation:
  language: ru
  text: Мудрый сердцем слывёт рассудительным, а приятная речь умножает знание.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление» или «поучение». В данном контексте возможно и понимание: приятная речь делает наставление более убедительным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲכַם לֵב
  choice: Мудрый сердцем
  rationale: Сохраняет еврейский образ внутренней мудрости и при этом естественно звучит в русском изречении.
- source_word: יִקָּרֵא
  choice: слывёт
  rationale: Нифаль передаёт значение «называется, считается». Настоящее время соответствует характеру пословицы, а «слывёт» выражает признание со стороны других.
- source_word: נָבוֹן
  choice: рассудительным
  rationale: Передаёт способность понимать, различать и здраво судить; хорошо сочетается с характеристикой человека.
- source_word: וּמֶתֶק שְׂפָתַיִם
  choice: приятная речь
  rationale: Буквально «сладость уст»; в данном контексте уста метонимически означают речь. Естественный русский оборот сохраняет смысл привлекательной, благожелательной манеры говорить.
- source_word: יֹסִיף
  choice: прибавляет
  rationale: Хифиль от יסף означает «добавлять, увеличивать»; форма настоящего времени подходит для общего наблюдения.
- source_word: לֶקַח
  choice: убедительности
  rationale: В контексте приятной речи слово может обозначать действенность наставления или способность речи убеждать. Этот вариант лучше всего передаёт связь между манерой говорить и воздействием сказанного, при сохранении других значений в сноске.
