  text: טוֹב מְ֭עַט בִּ/צְדָקָ֑ה מֵ/רֹ֥ב תְּ֝בוּא֗וֹת בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/008.yaml
  text: Better a little with righteousness than great income without justice.
translation:
  language: ru
  text: Лучше малое с праведностью, чем большие доходы без справедливости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Лучше малое
  rationale: Сохраняет краткую сравнительную форму еврейской мудрости и естественно звучит по-русски.
- source_word: בִּצְדָקָה
  choice: с праведностью
  rationale: צְדָקָה обозначает праведность, то есть нравственно верное состояние и поведение; предлог ב передан как сопутствующее «с».
- source_word: מֵרֹב תְּבוּאוֹת
  choice: чем большие доходы
  rationale: תְּבוּאוֹת буквально связано с поступлениями, урожаем или прибылью; во множественном числе здесь естественно передаётся широким «доходы», не сужая смысл до земледелия.
- source_word: בְּלֹא מִשְׁפָּט
  choice: без справедливости
  rationale: מִשְׁפָּט в данном нравственном противопоставлении означает справедливость, правосудие или правый порядок; «справедливость» ясно передаёт общий смысл.
theological_decisions:
- issue: Соотношение צְדָקָה и מִשְׁפָּט
  choice: Передать как «праведность» и «справедливость»
  alternative: «правда» и «правосудие»
  rationale: Выбранные слова сохраняют различие между нравственной праведностью и справедливым порядком, не сводя стих только к судебной сфере и не добавляя конфессионального толкования.
translation_notes:
  register: Краткая, афористичная формулировка в современном литературном русском; сохранены параллелизм и нравственный контраст оригинала.
