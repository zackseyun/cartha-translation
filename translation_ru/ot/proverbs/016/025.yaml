  yaml_path: translation/ot/proverbs/016/025.yaml
  text: There is a way that seems right before a man, but its end is the ways of death.
translation:
  language: ru
  text: Есть путь, который кажется человеку прямым, но конец его — пути смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשָׁר לִפְנֵי אִישׁ
  choice: кажется человеку прямым
  rationale: Буквально «прям перед человеком»; в данном контексте выражение передаёт человеческую оценку пути. «Прямым» сохраняет образ нравственно верного и правильного пути.
- source_word: אַחֲרִיתָהּ
  choice: конец его
  rationale: Женский суффикс относится к слову דֶּרֶךְ, которое в этом стихе употреблено как существительное женского рода; речь идёт об исходе или конечном результате пути.
- source_word: דַּרְכֵי מָוֶת
  choice: пути смерти
  rationale: 'Сохранено необычное множественное число оригинала: один путь, кажущийся прямым, в итоге раскрывается как ведущие к смерти пути.'
theological_decisions:
- issue: Характер человеческой оценки пути
  choice: кажется человеку прямым
  alternative: прям перед человеком
  rationale: Выбран естественный русский оборот, явно передающий противопоставление субъективной человеческой оценки и смертельного исхода, без добавления конфессионального толкования.
- issue: Число в выражении «пути смерти»
  choice: сохранено множественное число
  alternative: путь смерти
  rationale: Множественное число соответствует масоретскому тексту и сохраняет его смысловое напряжение, не сглаживая формулировку.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура и контраст оригинала сохранены. Формулировка звучит достойно и понятно, без архаического «пред человеком».
