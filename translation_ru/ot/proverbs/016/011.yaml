  text: A just balance and scales belong to Yahweh[a]; all the weights in the bag are his work.
translation:
  language: ru
  text: Верные весы и весовые чаши принадлежат Яхве; все гири в мешочке — Его дело.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все камни в мешочке». Имеются в виду каменные гири, которыми пользовались при взвешивании.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּלֶס
  choice: весы
  rationale: Слово обозначает весовой прибор; «весы» естественно передаёт предмет торгового взвешивания.
- source_word: וּמֹאזְנֵי מִשְׁפָּט
  choice: и справедливые чаши
  rationale: מֹאזְנַיִם обозначает весы, часто двухчашечные, а מִשְׁפָּט характеризует их как соответствующие справедливости. «Чаши» сохраняет параллелизм без неестественного повтора слова «весы».
- source_word: לַיהוָה
  choice: от Яхве
  rationale: Предлог לְ допускает отнесённость, принадлежность или происхождение. В русском «от Яхве» выражает, что справедливые меры установлены Им, не сводя фразу лишь к физическому владению.
- source_word: מַעֲשֵׂהוּ
  choice: Его дело
  rationale: Буквально «Его дело/творение»; формулировка сохраняет широкий смысл Божьего установления и действия.
- source_word: כָּל אַבְנֵי כִיס
  choice: все гири в суме
  rationale: Буквально «все камни сумы»; в торговом контексте это каменные гири, хранившиеся в мешочке. «Сума» передаёт כִיס как небольшой мешок для гирь.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Смысл принадлежности мер Богу
  choice: Справедливые стандарты взвешивания исходят от Яхве и соответствуют Его установлению
  alternative: Бог лишь создал физические гири; любые фактически употребляемые гири автоматически одобрены Богом
  rationale: Сочетание מֹאזְנֵי с מִשְׁפָּט задаёт нравственный контекст справедливой торговли, а מַעֲשֵׂהוּ связывает верные гири с Божьим установлением.
translation_notes:
  register: Современный литературный русский с краткой, афористичной структурой. Сохранены торговая образность, параллелизм двух весовых терминов и смысловая широта выражения «Его дело».
