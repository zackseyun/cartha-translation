base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
translation:
  language: ru
  text: Яхве всему определил назначение[a], даже нечестивому — день бедствия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Себя». Еврейское выражение также может означать: «Яхве всё сделал для Себя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «день несчастья»; буквально возможно «день зла». Здесь «зло» означает бедствие или гибель, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: всё
  rationale: Передаёт всеохватность еврейского כֹּל естественно и кратко в современном русском языке.
- source_word: פָּעַל
  choice: совершил
  rationale: Глагол может означать «делать, создавать, совершать». «Совершил» сохраняет более широкое значение целенаправленного Божьего действия и не сводит фразу исключительно к акту творения.
- source_word: יְהוָה
  choice: Господь
  rationale: В современном русском библейском регистре традиционная передача тетраграмматона словом «Господь» наиболее узнаваема и естественна; заглавная буква указывает на имя Бога в исходном тексте.
- source_word: לַמַּעֲנֵהוּ
  choice: для своей цели
  rationale: Трудная форма буквально связана с «ответом» и допускает понимание «для его/своего назначения». Контекст указывает на соответствующую каждому делу цель; местоимение намеренно оставлено несколько неоднозначным, а альтернативное «для Себя» вынесено в сноску.
- source_word: וְגַם
  choice: даже
  rationale: 'Передаёт усилительное присоединение: общее утверждение распространяется даже на нечестивого.'
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного нечестивого человека; винительный падеж естественно связан с глаголом «совершил».
- source_word: לְיוֹם רָעָה
  choice: для дня бедствия
  rationale: Здесь רָעָה обозначает бедствие, несчастье или гибель, а не нравственное зло. Формулировка сохраняет идею назначенного дня суда или катастрофы.
theological_decisions:
- issue: Учит ли стих, что Бог целенаправленно устроил всё, включая участь нечестивого, не называя Бога источником нравственного зла?
  choice: Господь целенаправленно совершает всё, и нечестивого ожидает соответствующий ему день бедствия.
  alternative: Господь создал всё для Себя, включая нечестивого для дня зла.
  rationale: Еврейский текст утверждает Божью власть и целевую упорядоченность, но не требует вывода, будто Бог создаёт нравственное зло. «Бедствие» передаёт судебную участь, а сноска сохраняет неоднозначность לַמַּעֲנֵהוּ.
translation_notes:
  register: Современный литературный русский с достоинством, свойственным книге Притч. Лаконичная двучленная структура и тире сохраняют афористичность. Подлинная неоднозначность первой строки отмечена сноской.
