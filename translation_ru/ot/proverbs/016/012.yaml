base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/012.yaml
  text: It is an abomination for kings to do wickedness[a], for a throne is established by righteousness.
translation:
  language: ru
  text: Творить зло — мерзость для царей, ибо престол утверждается праведностью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «престол утверждается справедливостью».'
