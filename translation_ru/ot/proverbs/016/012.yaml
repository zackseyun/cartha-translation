lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: мерзко
  rationale: Передаёт сильную нравственную оценку — нечто отвратительное и недопустимое, — а безличная конструкция естественно сочетается с инфинитивом.
- source_word: מְלָכִים
  choice: царям
  rationale: Дательный падеж естественно передаёт конструкцию со значением «мерзость для царей»; множественное число сохраняет обобщённый характер изречения.
- source_word: עֲשׂוֹת
  choice: творить
  rationale: Инфинитив передан прямо; «творить» сохраняет краткость и придаёт изречению уместный возвышенный оттенок без архаизации.
- source_word: רֶשַׁע
  choice: беззаконие
  rationale: Слово обозначает нравственно порочное и неправое деяние. «Беззаконие» сохраняет как моральную, так и общественно-правовую сторону царского проступка.
- source_word: כִּי
  choice: потому что
  rationale: Ясно выражает обоснование первой части изречения и звучит естественно в современном русском языке.
- source_word: בִצְדָקָה
  choice: праведностью
  rationale: Передаёт широкое нравственное значение צדקה; в контексте царской власти включает и справедливое правление. Вариант «справедливостью» сохранён в сноске.
- source_word: יִכּוֹן
  choice: утверждается
  rationale: Передаёт значение упрочения, установления и обретения устойчивости, сохраняя традиционный и понятный образ.
- source_word: כִּסֵּא
  choice: престол
  rationale: Существительное употреблено обобщённо как образ царской власти; русский язык не требует неопределённого артикля.
theological_decisions:
- issue: Передача צדקה в контексте царской власти
  choice: праведностью
  alternative: справедливостью
  rationale: «Праведность» сохраняет более широкий нравственный смысл основания законной власти, тогда как «справедливость» точнее подчёркивает судебное и управленческое измерение. Контекст допускает оба оттенка, поэтому альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным строем изречения. Лексика понятна широкому читателю; «престол» и «творить» поддерживают возвышенный библейский регистр без чрезмерной архаичности.
