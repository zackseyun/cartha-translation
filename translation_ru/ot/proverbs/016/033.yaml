base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/033.yaml
  text: The lot is cast into the lap[a], but its every decision is from Yahweh.
translation:
  language: ru
  text: Жребий бросают в складку одежды, но всякое решение жребия[a] — от Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий его приговор»; или: «всякое его судебное решение». Еврейское слово может иметь судебный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֵיק
  choice: в складку одежды
  rationale: חֵיק обозначает грудь, лоно или образованную одеждой складку, куда могли бросать жребии. Этот вариант сохраняет конкретный древний образ и понятен современному читателю.
- source_word: יוּטַל
  choice: бросают
  rationale: Форма Hophal передаёт пассивное значение «быть брошенным». Русская неопределённо-личная конструкция звучит естественно и сохраняет смысл действия над жребием.
- source_word: הַגּוֹרָל
  choice: жребий
  rationale: גוֹרָל — предмет, применявшийся для принятия решения или распределения. «Жребий» является прямым и исторически уместным соответствием.
- source_word: וּמֵיְהוָה
  choice: но … от Яхве
  rationale: Союз ו формально может означать «и», однако здесь он сопоставляет человеческое действие с источником результата; «но» естественно выражает этот контраст, не усиливая его сверх текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте и соответствует консультационному слою.
- source_word: כָּל
  choice: всякое
  rationale: 'При существительном в единственном числе כָּל имеет распределительное значение: имеется в виду каждое отдельное решение жребия.'
- source_word: מִשְׁפָּטוֹ
  choice: его решение
  rationale: מִשְׁפָּט может означать решение, приговор или судебное постановление. В контексте жребия «решение» естественно обозначает определённый им исход, сохраняя возможность юридического оттенка в сноске.
theological_decisions:
- issue: Божественная власть над исходом события, внешне зависящего от случая
  choice: 'Сохранено прямое утверждение: люди бросают жребий, но каждое его решение исходит от Яхве.'
  alternative: Ограничить смысл только священным применением жребия либо развернуть стих в общее учение обо всех случайных событиях.
  rationale: Еврейский текст противопоставляет акт бросания жребия источнику его решения, но сам не уточняет границы этого утверждения. Перевод не сужает и не расширяет богословский смысл.
translation_notes:
  register: Современный литературный русский язык с краткой афористичной структурой. «Складка одежды» поясняет древний образ без его устранения; тире подчёркивает вторую половину параллелизма.
