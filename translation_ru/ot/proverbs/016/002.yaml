  text: כָּֽל דַּרְכֵי אִ֭ישׁ זַ֣ךְ בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן רוּח֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/002.yaml
  text: All a man's ways are pure in his own eyes[b][a], but Yahweh weighs the spirits.
translation:
  language: ru
  text: Все пути человека чисты в его собственных глазах, но Яхве взвешивает дух каждого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но Яхве исследует внутренние побуждения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דַּרְכֵי אִישׁ
  choice: Все пути человека
  rationale: «Пути» в литературе мудрости обозначают образ жизни и поступки. Единственное אִישׁ имеет обобщающее значение; русское «человека» естественно сохраняет форму единственного числа и универсальность изречения.
- source_word: זַךְ
  choice: чисты
  rationale: Передаёт нравственную чистоту в самооценке человека; «невинны» придало бы выражению более узкий юридический смысл.
- source_word: בְּעֵינָיו
  choice: в его собственных глазах
  rationale: Сохраняет еврейский образ и явно передаёт субъективность самооценки.
- source_word: וְתֹכֵן
  choice: но … взвешивает
  rationale: Союз передан как противопоставительный по смыслу. «Взвешивает» сохраняет метафору точной оценки, заложенную в תכן.
- source_word: רוּחוֹת
  choice: духи
  rationale: Буквально сохраняет множественное число и широкое значение внутренних духовных состояний людей, не сужая его до одних мотивов.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Значение רוּחוֹת
  choice: внутренние духи людей, которые оценивает Яхве
  alternative: побуждения; внутренние настроения
  rationale: Контраст с человеческой самооценкой указывает на внутреннюю сторону личности. Буквальное «духи» сохраняет антропологическую широту и не сводит смысл только к мотивам.
- issue: Обобщающее אִישׁ
  choice: человека
  alternative: мужчины; людей
  rationale: В данном изречении грамматически мужское единственное число имеет обобщающий смысл. «Человека» сохраняет число и естественно выражает универсальное применение.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической речи. Сохранены параллелизм, образ «путей», идиома «в собственных глазах» и метафора взвешивания; неоднозначное רוּחוֹת оставлено как «духи», а более истолковывающий вариант вынесен в примечание.
