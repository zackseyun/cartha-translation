source:
  edition: WLC
  text: חֲמַת מֶ֥לֶךְ מַלְאֲכֵי מָ֑וֶת וְ/אִ֖ישׁ חָכָ֣ם יְכַפְּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/014.yaml
  text: The wrath of a king is messengers of death[b][a], but a wise man will appease it.
translation:
  language: ru
  text: Гнев царя — посланники смерти[a], но мудрый человек отвратит его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посланники смерти». Еврейское слово, переведённое как «посланники», может также означать «ангелы», но здесь, вероятнее всего, имеются в виду люди, исполняющие волю царя.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол происходит от того же корня, который часто передаётся словами «искупать» или «совершать умилостивление». Здесь он означает унять или отвести царский гнев.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: гнев
  rationale: Существительное обозначает пылающий, яростный гнев. Русское «гнев» сохраняет возвышенную весомость изречения и естественно сочетается с образом царя.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Прямое значение — монарх, царь. Конкретный образ царской власти сохранён без обобщения до «правителя».
- source_word: מַלְאֲכֵי
  choice: посланники
  rationale: Слово может обозначать как человеческих посланников, так и ангелов. В придворном контексте вероятнее царские исполнители или вестники; «посланники» сохраняет образ и не привносит сверхъестественного смысла.
- source_word: מָוֶת
  choice: смерти
  rationale: Сохранено прямое значение и образное сочетание «посланники смерти».
- source_word: וְאִישׁ חָכָם
  choice: но мудрый человек
  rationale: Союз передан противительным «но», поскольку вторая половина противопоставляет мудрый ответ смертельной опасности. «Человек» естественно передаёт обобщённое значение мужского единственного числа.
- source_word: יְכַפְּרֶנָּה
  choice: отвратит его
  rationale: В данном не культовом контексте глагол означает устранить, умиротворить или отвести гнев. «Отвратит его» естественно относится именно к царскому гневу и передаёт прекращение его действия; местоимение «его» воспроизводит отсылку суффикса к слову «гнев».
theological_decisions:
- issue: Следует ли передавать כפר культовым выражением об искуплении или некультовым обозначением отведения гнева
  choice: 'Некультовое: «отвратит его»'
  alternative: «совершит за него искупление»; «умилостивит его»; «утихомирит его»
  rationale: Контекст говорит о царском гневе, а не о жертвоприношении или храмовом обряде. Поэтому культовая формулировка внесла бы отсутствующую в изречении богословскую конкретизацию. Связь с корнем, часто употребляемым в языке искупления, отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным строем пословицы. Именная метафора «гнев царя — посланники смерти» сохранена, несмотря на намеренное смысловое напряжение между единственным и множественным числом.
