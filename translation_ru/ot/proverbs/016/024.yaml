  text: צוּף דְּ֭בַשׁ אִמְרֵי נֹ֑עַם מָת֥וֹק לַ֝/נֶּפֶשׁ וּ/מַרְפֵּ֥א לָ/עָֽצֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/024.yaml
  text: Pleasant words are a honeycomb[b][a], sweet to the soul and healing to the bones.
translation:
  language: ru
  text: 'Приятные слова — сотовый мёд[a]: сладость для души[b] и исцеление для костей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мёд из сот»; еврейское выражение буквально обозначает сотовый мёд.'
    reason: lexical_alternative
  - marker: b
    text: Слово «душа» здесь может также означать жизнь, самого человека или его внутреннее существо.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּף דְּבַשׁ
  choice: сотовый мёд
  rationale: Сочетание обозначает мёд из сот, или сотовый мёд. Этот вариант естественен по-русски и сохраняет конкретный образ, не сводя его просто к сотам.
- source_word: אִמְרֵי נֹעַם
  choice: приятные слова
  rationale: אִמְרֵי означает слова или изречения, а נֹעַם — приятность, отраду. «Приятные слова» ясно и без лишней нравственной конкретизации передаёт сочетание.
- source_word: מָתוֹק
  choice: сладость
  rationale: Еврейское прилагательное означает «сладкий». Именная конструкция «сладость для души» звучит в русском поэтически и сохраняет вкусовой образ и параллелизм.
- source_word: לַנֶּפֶשׁ
  choice: для души
  rationale: נֶפֶשׁ может обозначать душу, жизнь, самого человека или внутреннее существо. «Душа» сохраняет антропологический образ и параллель с костями.
- source_word: וּמַרְפֵּא
  choice: и исцеление
  rationale: מַרְפֵּא означает исцеление, здоровье или целебное средство. «Исцеление» естественно сочетается с образом воздействия слов и не сужает значение до лекарства.
- source_word: לָעָצֶם
  choice: для костей
  rationale: Форма единственного числа имеет собирательное значение. Русское множественное «кости» сохраняет телесный образ и естественно звучит в этом выражении.
