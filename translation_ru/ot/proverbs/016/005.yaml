  text: תּוֹעֲבַ֣ת יְ֭הוָה כָּל גְּבַהּ לֵ֑ב יָ֥ד לְ֝/יָ֗ד לֹ֣א יִנָּקֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/005.yaml
  text: Everyone who is proud in heart is an abomination to Yahweh; hand to hand[a], he will certainly not go unpunished.
translation:
  language: ru
  text: Всякий надменный сердцем — мерзость для Яхве; рука к руке[a] — он не останется безнаказанным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рука к руке». Этот еврейский оборот может означать «несомненно, будьте уверены» или, возможно, «даже если они соединят руки», то есть вступят в союз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Существительное обозначает нечто крайне отвратительное и сохраняет сильную нравственно-религиозную оценку еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: כָּל גְּבַהּ לֵב
  choice: всякий надменный сердцем
  rationale: Сохраняет распределительное значение כָּל и образ внутренней возвышенности, то есть укоренённой в сердце гордыни.
- source_word: יָד לְיָד
  choice: рука к руке
  rationale: Формально сохраняет трудный и неоднозначный еврейский оборот; его основные возможные толкования вынесены в сноску.
- source_word: לֹא יִנָּקֶה
  choice: не останется безнаказанным
  rationale: В данном контексте форма глагола נקה означает, что виновный не избежит наказания; русский оборот ясно передаёт этот судебный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Толкование יָד לְיָד
  choice: Сохранить оборот «рука к руке» в основном тексте
  alternative: «несомненно / будьте уверены»; «даже если они соединят руки»
  rationale: Еврейский оборот допускает несколько объяснений. Буквальная передача со сноской сохраняет подлинную неоднозначность, не навязывая одно толкование.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой притчи. Сильное слово «мерзость» сохраняет нравственную резкость оригинала, а непривычный оборот «рука к руке» намеренно оставлен и пояснён в сноске.
