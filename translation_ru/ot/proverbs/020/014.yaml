  yaml_path: translation/ot/proverbs/020/014.yaml
  text: “Bad[a], bad,” says the buyer; but when he goes away, then he boasts.
translation:
  language: ru
  text: «Плох товар, плох!»[a] — говорит покупатель, а уйдя, хвалится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никуда не годится, никуда не годится»; или: «Дрянь, дрянь». В еврейском тексте слово «плох» повторено для усиления; подразумеваемый товар назван в переводе ради естественности русской речи. Повтор передаёт попытку покупателя сбить цену товара.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע רַע
  choice: «Плохой, плохой»
  rationale: Дословно сохраняет повтор и краткую, выразительную речь покупателя, который при торге намеренно принижает ценность товара.
- source_word: יֹאמַר
  choice: говорит
  rationale: Имперфект выражает обычное, повторяющееся действие; настоящее время естественно для русской пословицы.
- source_word: הַקּוֹנֶה
  choice: покупатель
  rationale: Причастная форма от קנה в торговом контексте прямо обозначает того, кто покупает.
- source_word: וְאֹזֵל לוֹ
  choice: а отойдя
  rationale: 'Передаёт смену сцены и подразумеваемое противопоставление: при покупке он порочит товар, а после ухода радуется удачной сделке. Местоименный элемент לוֹ здесь идиоматичен и отдельно не акцентируется.'
- source_word: אָז
  choice: '[передано последовательностью действий]'
  rationale: Русский деепричастный оборот «отойдя» вместе с последующим сказуемым естественно передаёт значение «тогда», не утяжеляя афористичную строку.
- source_word: יִתְהַלָּל
  choice: хвалится
  rationale: Hitpael от הלל обозначает самодовольную похвальбу; «хвалится» звучит естественно и сохраняет моральную направленность изречения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий афористичный строй и реплика торгующегося покупателя сохранены. «А отойдя» звучит естественнее буквального «но когда он уходит» и ясно передаёт контраст.
