  text: גַּ֣ם בְּ֭/מַעֲלָלָי/ו יִתְנַכֶּר נָ֑עַר אִם זַ֖ךְ וְ/אִם יָשָׁ֣ר פָּעֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/011.yaml
  text: Even a youth makes himself known by his deeds[a], whether his work is pure and upright.
translation:
  language: ru
  text: 'Даже юношу узнают по его поступкам: чисты ли и честны его дела.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Даже юноша проявляет себя своими поступками — чисты ли и честны его дела».'
    reason: 'Лексическая альтернатива: יִתְנַכֶּר может передавать возвратный смысл «проявляет себя» либо по контексту — «становится узнаваемым, распознаётся».'
lexical_decisions:
- source_word: גַּם
  choice: даже
  rationale: 'Передаёт усилительно-распространительный смысл: характер виден по делам даже у юноши.'
- source_word: בְּמַעֲלָלָיו
  choice: в поступках
  rationale: מַעֲלָל обозначает поступки с нравственной оценкой; предлог ב здесь указывает на сферу, в которой человек проявляет себя.
- source_word: יִתְנַכֶּר
  choice: проявляет себя
  rationale: 'Передаёт возвратный оттенок хитпаэля: человек обнаруживает, каким он является, через своё поведение. Возможное пассивное понимание сохранено в сноске.'
- source_word: נָעַר
  choice: юноша
  rationale: Обобщённо обозначает молодого человека, не сужая значение до маленького ребёнка.
- source_word: זַךְ
  choice: чисто
  rationale: Сохраняет нравственный образ чистоты; наречная форма естественно сочетается с русским оборотом «то, что он делает».
- source_word: יָשָׁר
  choice: правильно
  rationale: Передаёт нравственную прямоту и соответствие должному без архаичного или чрезмерно конфессионального оттенка.
- source_word: פָּעֳלוֹ
  choice: то, что он делает
  rationale: Естественно передаёт собирательный смысл единственного числа «его дело/деятельность» и связывает прилагательные с поведением юноши.
