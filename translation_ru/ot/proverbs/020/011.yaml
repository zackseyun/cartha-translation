  source_fidelity: 'Основной смысл передан верно: даже о молодом человеке судят по его поведению, а чистота и нравственная прямота его дел выявляют его характер. Однако «правильно» несколько обобщает יָשָׁר и ослабляет этический оттенок «прямой, честный, справедливый».'
  naturalness: Оборот «проявляет себя в поступках» понятен, но «узнаётся по своим поступкам» естественнее по-русски и непосредственно передаёт связь между поведением и распознаванием человека. Формулировка «чисто ли и правильно то, что он делает» звучит несколько тяжеловесно; именная конструкция более афористична.
  terminology: «Юноша» допустимо для נַעַר в обобщённом контексте. «Чисты и честны его дела» сохраняет различие между זַךְ («чистый») и יָשָׁר («прямой», в нравственном смысле «честный»), не внося конфессиональной окраски.
