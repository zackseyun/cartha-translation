  yaml_path: translation/ot/proverbs/020/020.yaml
  text: Whoever curses his father or his mother—his lamp will be put out in deepest darkness[a][b].
translation:
  language: ru
  text: Кто проклинает своего отца и мать, у того светильник погаснет в непроглядной тьме[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в зрачке тьмы» — древнееврейский образ непроглядной, глубочайшей тьмы.'
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «его светильник угаснет в глубокой тьме». Светильник здесь может символизировать жизнь, благополучие или будущее человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַלֵּל
  choice: Кто проклинает
  rationale: Причастие употреблено субстантивно и выражает общее правило. «Кто проклинает» естественно передаёт эту обобщённость и сохраняет значение произнесения проклятия, а не только оскорбления.
- source_word: אָבִיו וְאִמּוֹ
  choice: своего отца или мать
  rationale: Буквально существительные соединены союзом «и», однако в обобщённой формуле речь идёт о проклятии любого из родителей. Русское «или» естественно передаёт распределительный смысл и не создаёт ложного впечатления, будто наказание относится лишь к тому, кто проклинает обоих.
- source_word: יִדְעַךְ
  choice: погаснет
  rationale: Глагол обозначает угасание или прекращение горения светильника. Непереходное «погаснет» точно сохраняет отсутствие названного действующего лица.
- source_word: נֵרוֹ
  choice: у того светильник
  rationale: Сохранён конкретный образ светильника, который в литературе мудрости может обозначать жизнь, благополучие или будущее человека. Конструкция «у того» ясно соотносит притяжательное местоимение с проклинающим.
- source_word: בְאִישׁוֹן חֹשֶׁךְ
  choice: в непроглядной тьме
  rationale: Буквально выражение говорит о «зрачке тьмы»; это образное обозначение самой густой, полной тьмы. «Непроглядная тьма» естественна в современном русском и сохраняет выразительность идиомы.
theological_decisions:
- issue: Значение угасшего светильника
  choice: Сохранить метафору без уточнения её единственного смысла
  alternative: Истолковать светильник прямо как жизнь, благополучие, потомство или будущее
  rationale: Контекст допускает несколько взаимосвязанных оттенков. Перевод не должен устранять эту содержательную многозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, запоминающейся структурой притчи. «Непроглядная тьма» звучит естественно и выразительно, не воспроизводя буквально неясную для русского читателя исходную идиому.
