source:
  edition: WLC
  text: עָרֵ֣ב לָ֭/אִישׁ לֶ֣חֶם שָׁ֑קֶר וְ֝/אַחַ֗ר יִמָּֽלֵא פִ֥י/הוּ חָצָֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/017.yaml
  text: Bread of deceit is sweet to a man[b][a], but afterward his mouth is filled with gravel.
translation:
  language: ru
  text: Хлеб обмана[a] сладок человеку, но потом рот его наполнится гравием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб лжи»; возможно, имеется в виду хлеб, добытый обманом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵב
  choice: сладок
  rationale: Слово означает «приятный, желанный, сладкий». В контексте пищи «сладок» естественно сохраняет вкусовой образ и подчёркивает контраст с гравием.
- source_word: לָאִישׁ
  choice: человеку
  rationale: Еврейское существительное стоит в мужском роде и единственном числе, но здесь обозначает отдельного человека как типичного представителя; русское «человеку» точно и естественно передаёт обобщённый смысл.
- source_word: לֶחֶם שָׁקֶר
  choice: хлеб обмана
  rationale: 'Буквально — «хлеб лжи/ложности». «Хлеб обмана» сохраняет тесную связь двух существительных и не устраняет возможную двусмысленность: это может быть хлеб, добытый обманом, либо образ лживой выгоды.'
- source_word: וְאַחַר
  choice: но потом
  rationale: Буквально выражена последовательность («и после»), однако противопоставление сладкого начала мучительному итогу естественно передаётся союзом «но».
- source_word: יִמָּלֵא
  choice: наполнится
  rationale: Нифаль в имперфекте имеет результативно-будущее значение; совершенный вид будущего времени передаёт неизбежное последствие.
- source_word: פִיהוּ
  choice: рот его
  rationale: Сохранён конкретный образ рта; порядок слов придаёт фразе сдержанно-пословичный, литературный характер.
- source_word: חָצָץ
  choice: гравием
  rationale: Существительное обозначает мелкие камни, щебень или гравий. «Гравием» сохраняет вещественный образ и звучит естественнее в сочетании «рот наполнится».
theological_decisions:
- issue: Характер «хлеба обмана»
  choice: Сохранена неоднозначная конструкция «хлеб обмана».
  alternative: «Хлеб, добытый обманом» или «лживый хлеб».
  rationale: Еврейская конструкция сама по себе не уточняет однозначно, добыт ли хлеб обманом или образно связан с ложью; конкретизирующий перевод сузил бы смысл без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Конкретные образы хлеба, рта и гравия сохранены; формулировка понятна без специальной библейской терминологии.
