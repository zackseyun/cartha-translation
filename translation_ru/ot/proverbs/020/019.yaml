  terminology: Терминологических или богословских проблем нет. Сноска a корректно отмечает более сильный оттенок רָכִיל («разносчик злых слухов»), а сноска b надлежащим образом объясняет буквальный образ «открывает свои губы», не выдавая толкование за единственно возможное значение.
