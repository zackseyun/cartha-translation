source:
  edition: WLC
  text: גּֽוֹלֶה סּ֭וֹד הוֹלֵ֣ךְ רָכִ֑יל וּ/לְ/פֹתֶ֥ה שְׂ֝פָתָ֗י/ו לֹ֣א תִתְעָרָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/019.yaml
  text: One who reveals secrets goes about as a gossip[b][a]; do not associate with one who opens his lips wide.
translation:
  language: ru
  text: Кто разглашает тайны, тот ходит, разнося сплетни[a]; не водись с тем, кто распускает язык[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ходит как разносчик злых слухов». Еврейское слово רָכִיל может обозначать человека, который распространяет сплетни или порочащие сообщения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с тем, кто открывает свои губы». Речь о человеке, который говорит слишком много или слишком свободно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹלֶה סוֹד
  choice: разглашает тайны
  rationale: Причастие גּוֹלֶה обозначает раскрытие или предание огласке, а סוֹד здесь — доверенную тайну. «Разглашает тайны» естественно передаёт нарушение конфиденциальности.
- source_word: הוֹלֵךְ רָכִיל
  choice: ходит, разнося сплетни
  rationale: Сохраняется образ хождения из הוֹלֵךְ и передаётся значение רָכִיל как распространения вредящих другим слухов или сообщений. Формулировка не утверждает непременно ложность сведений, как могло бы слово «клевета».
- source_word: וּלְפֹתֶה שְׂפָתָיו
  choice: с тем, кто распускает язык
  rationale: Еврейское выражение буквально связано с открыванием губ и в данном контексте описывает человека, который говорит слишком свободно и не умеет хранить сказанное. Русский оборот передаёт эту прагматическую силу.
- source_word: לֹא תִתְעָרָב
  choice: не водись
  rationale: Возвратная форма глагола означает не смешиваться, не вступать в общение или близкую связь. «Не водись» ясно, естественно и уместно для краткого наставления.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Не водись» сохраняет прямоту житейского наставления; «распускает язык» — общеупотребительный, но не сниженный оборот.
