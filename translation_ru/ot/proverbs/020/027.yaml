source:
  edition: WLC
  text: נֵ֣ר יְ֭הוָה נִשְׁמַ֣ת אָדָ֑ם חֹ֝פֵ֗שׂ כָּל חַדְרֵי בָֽטֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/027.yaml
  text: The spirit of man is the lamp of Yahweh[b][a], searching all the innermost chambers of the belly.
translation:
  language: ru
  text: Дух[a] человека — светильник Яхве, исследующий все тайники его нутра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дыхание человека».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все покои живота (чрева)» — образ самых глубоких, сокровенных областей внутреннего мира человека.'
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  choice: светильник
  rationale: Конкретное значение слова — светильник, а не отвлечённый «свет»; так сохраняется образ, при котором скрытое становится видимым.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет отличие имени от титула «Господь».
- source_word: נִשְׁמַת
  choice: дух
  rationale: נשמה может означать дыхание, жизненное дыхание или дух. В данном образном контексте «дух» естественно обозначает внутреннее жизненное начало человека, не сужая смысл до совести.
- source_word: אָדָם
  choice: человека
  rationale: Слово употреблено обобщённо и в единственном числе; русский родительный «человека» сохраняет эту форму и относится к человеку вообще.
- source_word: חֹפֵשׂ
  choice: исследующий
  rationale: Причастие передаёт продолжающееся тщательное обследование. Форма мужского рода естественно соотносится со «светильником» и сохраняет синтаксическую неоднозначность образа.
- source_word: כָּל
  choice: все
  rationale: Передаёт полноту охвата.
- source_word: חַדְרֵי
  choice: тайники
  rationale: Буквально «комнаты, покои»; в сочетании с «нутром» речь идёт о скрытых внутренних местах. «Тайники» сохраняет пространственный образ и звучит естественно по-русски.
- source_word: בָטֶן
  choice: нутра
  rationale: Слово буквально обозначает живот или чрево и образно — внутренность человека. «Нутро» сохраняет телесно-пространственную метафору без излишней архаичности.
theological_decisions:
- issue: Антропологический смысл נִשְׁמַת אָדָם
  choice: «Дух человека» как внутреннее жизненное начало, служащее светильником Яхве
  alternative: «Дыхание человека» как признак данной Богом жизни; либо толкование как совести
  rationale: Еврейское נשמה допускает значения «дыхание» и «дух», но прямо не называет совесть. Основной текст сохраняет широкий антропологический смысл, а буквальная лексическая возможность «дыхание» отмечена в сноске.
- issue: Отнесение причастия חֹפֵשׂ
  choice: Грамматически связать «исследующий» со «светильником», не уточняя отдельно действующего субъекта
  alternative: Перевести так, будто непосредственно исследует человеческий дух или сам Яхве
  rationale: Мужская форма причастия естественно согласуется с נֵר «светильник». Такая формулировка сохраняет образ и не разрешает сверх текста вопрос о том, как именно соотносятся Божье действие и человеческий дух.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Светильник», «тайники» и «нутро» сохраняют конкретную пространственную метафорику древнееврейского текста, оставаясь понятными современному читателю.
