  text: נַ֣הַם כַּ֭/כְּפִיר אֵ֣ימַת מֶ֑לֶךְ מִ֝תְעַבְּר֗/וֹ חוֹטֵ֥א נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/002.yaml
  text: The terror of a king is like the growling of a young lion[c][b][a]; whoever provokes him to anger sins against his own life.
translation:
  language: ru
  text: Ужас, который внушает царь, — словно рык молодого льва[a]; кто вызывает его гнев, тот грешит против своей жизни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно рычание молодого льва».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «грешит против самого себя» или «против своей души»; еврейское слово נֶפֶשׁ может означать «жизнь», «самого человека» или «душу» в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: рык
  rationale: Существительное обозначает угрожающий звук, издаваемый львом. «Рык» естественно передаёт этот образ по-русски, не уточняя излишне, был ли это рёв или рычание.
- source_word: כְּפִיר
  choice: молодой лев
  rationale: Слово обычно обозначает молодого льва и подчёркивает его силу и опасность; перевод сохраняет эту конкретность.
- source_word: אֵימַת מֶלֶךְ
  choice: гроза царя
  rationale: Конструкция выражает ужас, внушаемый царём. «Гроза царя» в сжатой форме сохраняет интенсивность и допускает как внушаемый страх, так и грозность царя.
- source_word: מִתְעַבְּרוֹ
  choice: кто вызывает его гнев
  rationale: Форма допускает трудность в определении направленности гнева, но в контексте предупреждения наиболее естественно означает того, кто навлекает на себя царский гнев. Формулировка ясна и не разговорна.
- source_word: חוֹטֵא
  choice: грешит
  rationale: Сохраняется нравственная лексика корня חטא, а не только прагматический смысл саморазрушительного поступка.
- source_word: נַפְשׁוֹ
  choice: против собственной жизни
  rationale: נפש здесь может означать жизнь, самого человека или душу. Контекст царской угрозы прежде всего указывает на опасность для жизни, а «собственной» передаёт возвратный смысл.
