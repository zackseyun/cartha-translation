  text: אֹ֣זֶן שֹׁ֭מַעַת וְ/עַ֣יִן רֹאָ֑ה יְ֝הוָ֗ה עָשָׂ֥ה גַם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/012.yaml
  text: The hearing ear and the seeing eye—Yahweh made both of them[a].
translation:
  language: ru
  text: Ухо, которое слышит, и глаз, который видит, — и то и другое создал Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слышащее ухо и видящий глаз — и то и другое создал Яхве».'
    reason: Лексико-синтаксический вариант передачи еврейских причастий שֹׁמַעַת и רֹאָה.
lexical_decisions:
- source_word: אֹזֶן שֹׁמַעַת
  choice: слышащее ухо
  rationale: Причастие שֹׁמַעַת употреблено как определение к אֹזֶן. Русское причастное сочетание кратко передаёт эту форму и сохраняет параллелизм изречения.
- source_word: עַיִן רֹאָה
  choice: видящий глаз
  rationale: Причастное сочетание соответствует параллельному выражению «слышащее ухо» и сохраняет конкретное значение существительного עַיִן.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: עָשָׂה
  choice: создал
  rationale: В данном контексте глагол указывает на Бога как Творца органов восприятия. «Создал» естественно выражает эту мысль по-русски, хотя более широкое «сделал» также возможно.
- source_word: גַם שְׁנֵיהֶם
  choice: и то и другое
  rationale: 'Оборот передаёт совокупное значение «оба», а также подходит для русских существительных разного грамматического рода: «ухо» и «глаз».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл Божьего действия עָשָׂה
  choice: создал
  alternative: сделал
  rationale: «Создал» ясно передаёт контекст творения, но не добавляет представления о способе создания; вариант «сделал» остаётся более буквальным и широким.
translation_notes:
  register: Современный литературный русский язык с лаконичным, уравновешенным строением пословицы. Причастные обороты сохраняют поэтический параллелизм оригинала; тире выделяет заключительное утверждение.
