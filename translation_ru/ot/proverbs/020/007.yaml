  text: מִתְהַלֵּ֣ךְ בְּ/תֻמּ֣/וֹ צַדִּ֑יק אַשְׁרֵ֖י בָנָ֣י/ו אַחֲרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/007.yaml
  text: A righteous man walks in his integrity[b][a]; blessed are his children after him.
translation:
  language: ru
  text: Праведник живёт в своей непорочности; блаженны его дети после него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «счастливы его дети после него».'
    reason: Слово אַשְׁרֵי может передавать не только благословенность, но и счастье, благополучие или завидное положение.
lexical_decisions:
- source_word: מִתְהַלֵּךְ
  choice: живёт
  rationale: Причастие породы хитпаэль от הלך здесь описывает постоянный образ жизни и поведение. «Живёт» естественно передаёт смысл еврейской метафоры в современном русском языке.
- source_word: בְּתֻמּוֹ
  choice: в своей непорочности
  rationale: תֹּם обозначает цельность, нравственную чистоту и безупречность. Формулировка сохраняет предлог בְּ и возвратное притяжательное значение суффикса.
- source_word: צַדִּיק
  choice: праведник
  rationale: Существительное мужского рода в единственном числе обозначает праведного человека; «праведник» сохраняет краткость и представительный мужской образ притчи.
- source_word: אַשְׁרֵי
  choice: блаженны
  rationale: Форма выражает состояние благополучия, достойное восхищения, а не только эмоциональное счастье. «Блаженны» соответствует возвышенному регистру литературы мудрости.
- source_word: בָנָיו
  choice: его дети
  rationale: Хотя בנים формально может означать «сыновья», слово также употребляется об offspring вообще; «дети» естественно передаёт здесь родовое значение.
- source_word: אַחֲרָיו
  choice: после него
  rationale: Буквальное и компактное выражение указывает на детей, идущих вслед за ним или остающихся после него, не устраняя возможного временного и преемственного оттенка.
theological_decisions:
- issue: Представительный мужской образ в изречении мудрости
  choice: праведник
  alternative: праведный человек
  rationale: Еврейский текст использует мужской род единственного числа как типичный образ. Русское «праведник» сохраняет форму и лаконизм, не ограничивая применимость принципа только мужчинами.
- issue: Характер благополучия детей
  choice: блаженны
  alternative: счастливы
  rationale: אַשְׁרֵי может обозначать счастье, благополучие или завидное положение. «Блаженны» сохраняет богословскую и поэтическую глубину, не превращая утверждение лишь в описание чувства.
translation_notes:
  register: Краткое, афористичное изречение в современном литературном русском языке. Тире передаёт смысловой поворот между характером праведника и благополучием его потомков; сохранён возвышенный термин «блаженны».
