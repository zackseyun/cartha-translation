  text: מוֹקֵ֣שׁ אָ֭דָם יָ֣לַע קֹ֑דֶשׁ וְ/אַחַ֖ר נְדָרִ֣ים לְ/בַקֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/025.yaml
  text: It is a snare for a man to rashly dedicate something as holy, and only afterward to consider his vows.
translation:
  language: ru
  text: Ловушка для человека — опрометчиво объявить что-либо святыней и лишь после этого обдумывать свои обеты.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза кратка и трудна. Редкий глагол может означать «поспешно сказать»; поэтому возможно также: «Ловушка для человека — поспешно сказать: „Святыня!“, а после обетов раздумывать».'
    reason: Сохраняет неоднозначность редкого ילע и возможность понимать קֹדֶשׁ как возглас или формулу объявления, не выдавая один спорный разбор за несомненный.
lexical_decisions:
- source_word: מוֹקֵשׁ
  choice: ловушка
  rationale: Передаёт образ западни и губительных последствий необдуманного поступка.
- source_word: יָלַע
  choice: необдуманно посвятить
  rationale: Редкое и трудное слово; по контексту обозначает поспешное, опрометчивое действие в отношении святыни. Наречие «необдуманно» естественно выражает эту идею по-русски.
- source_word: קֹדֶשׁ
  choice: посвятить что-либо как святыню
  rationale: В контексте обетов речь идёт о признании или посвящении чего-либо святыней; добавленное «что-либо» раскрывает подразумеваемый объект без его конкретизации.
- source_word: נְדָרִים
  choice: данного обета
  rationale: Собирательное единственное число в русском естественно передаёт множественное число еврейского текста в общем нравоучительном высказывании.
- source_word: לְבַקֵּר
  choice: всё взвешивать
  rationale: Здесь глагол означает исследовать, обдумывать или проверять уже после принесения обета; выражение сохраняет укор позднему размышлению.
theological_decisions:
- issue: Характер посвящения святыни
  choice: посвятить что-либо как святыню
  alternative: 'сказать: «Это святыня»'
  rationale: Фраза передаёт религиозно-правовой акт посвящения, а не сводит его к одной лишь формуле произнесения.
- issue: Объект предостережения
  choice: необдуманное посвящение и запоздалое размышление
  alternative: запрет давать обеты вообще
  rationale: Стих порицает поспешность и размышление лишь постфактум, но не утверждает, что всякий обет недопустим.
translation_notes:
  register: Современный литературный русский, сжатая форма изречения. «Святыня» сохраняет культовый оттенок, а «всё взвешивать» звучит естественно и ясно показывает запоздалость обдумывания.
