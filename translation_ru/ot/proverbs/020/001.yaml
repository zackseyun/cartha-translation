  text: Wine is a mocker[a], strong drink a brawler, and whoever is led astray by it is not wise.
translation:
  language: ru
  text: Вино — насмешник[a], хмельной напиток — буян; и всякий, кто сбивается из-за него с пути, не мудр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вино — глумливый насмешник, хмельной напиток шумен и буен». В еврейском тексте опьяняющие напитки олицетворены; человек, который из-за них сбивается с пути, поступает немудро.'
