lexical_decisions:
- source_word: לֵץ
  choice: насмешник
  rationale: Существительное обозначает насмешника или глумливого человека. Именная форма сохраняет олицетворение вина и параллелизм со словом «буян».
- source_word: הַיַּיִן
  choice: вино
  rationale: Обычное соответствие еврейскому יין; артикль в обобщающей русской пословичной формулировке отдельно не передаётся.
- source_word: הֹמֶה
  choice: буян
  rationale: Причастие от המה передаёт шум, смятение и буйное возбуждение. В данном параллелизме личное обозначение «буян» естественно сохраняет олицетворение и разрушительное действие напитка.
- source_word: שֵׁכָר
  choice: хмельной напиток
  rationale: Широкое обозначение опьяняющего напитка, отличного от вина; выбор не сужает значение до конкретного современного вида напитка и звучит естественно по-русски.
- source_word: שֹׁגֶה
  choice: сбивается с пути
  rationale: Глагол означает заблуждаться, уклоняться или сбиваться. Образ пути сохраняет нравственно-практический смысл, не сводя его лишь к физическому пошатыванию.
- source_word: בּוֹ
  choice: из-за него
  rationale: Единственное число местоименного суффикса сохранено; причинная формулировка естественно передаёт то, что опьяняющий напиток вводит человека в заблуждение.
- source_word: לֹא יֶחְכָּם
  choice: не мудр
  rationale: Имперфект выражает общее пословичное утверждение. Краткая формулировка «не мудр» передаёт этот смысл без ненужного оттенка будущего времени.
