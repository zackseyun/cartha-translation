  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מֵ/יהוָ֥ה מִצְעֲדֵי גָ֑בֶר וְ֝/אָדָ֗ם מַה יָּבִ֥ין דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/024.yaml
  text: A man's steps are from Yahweh[b][a]; how then can a man understand his way?
translation:
  language: ru
  text: От Яхве — шаги человека[a]; как же человеку понять свой путь?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В первой строке стоит еврейское слово גֶּבֶר, буквально «мужчина», а во второй — אָדָם, «человек»; здесь оба употреблены в обобщающем смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/יהוָה
  choice: от Яхве
  rationale: 'Предлог מִן обозначает источник: шаги человека исходят от Яхве, то есть ход его жизни находится в Божьем распоряжении. Личное имя יהוה передано как «Яхве».'
- source_word: מִצְעֲדֵי
  choice: шаги
  rationale: Существительное обозначает шаги или движения и сохраняет образ жизненного пути.
- source_word: גָבֶר
  choice: человека
  rationale: גֶּבֶר буквально указывает на мужчину, но в данной пословице имеет обобщающее значение; русское «человек» естественно передаёт универсальный смысл без утраты единственного числа.
- source_word: וְ/אָדָם
  choice: как же человеку
  rationale: אָדָם обозначает человека вообще. Союз וְ в риторическом переходе естественно передан частицей «же», выражающей вывод из первой строки.
- source_word: מַה יָּבִין
  choice: как же ... понять
  rationale: Сочетание вопросительного מַה с בין выражает ограниченность человеческого понимания; по-русски это естественный риторический вопрос.
- source_word: דַּרְכּוֹ
  choice: свой путь
  rationale: דֶּרֶךְ означает путь как буквально, так и метафорически. Возвратное «свой» ясно соотносит путь с подлежащим «человеку».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его функцию как личного имени.
- issue: Соотношение Божьего водительства и человеческого понимания
  choice: «От Яхве — шаги человека»
  alternative: «Яхве определяет шаги человека»
  rationale: Именная конструкция с מִן прямо указывает на источник, но не уточняет способ Божьего участия. Более буквальная формулировка сохраняет богословскую ёмкость и не сводит её явно к предопределению.
- issue: Обобщающее значение גבר и אדם
  choice: человек ... человек
  alternative: мужчина ... человек
  rationale: Оба слова здесь относятся к человеку как представителю человечества. Русское «человек» естественно сохраняет обобщающий смысл; примечание отмечает различие еврейских слов.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Инверсия и тире сохраняют ударение на источнике человеческих шагов; риторический вопрос передаёт ограниченность человеческого понимания.
