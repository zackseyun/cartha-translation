  text: Steadfast love and faithfulness preserve a king[c][b][a], and by steadfast love his throne is upheld.
translation:
  language: ru
  text: Верная любовь и верность хранят царя[a], и верной любовью он поддерживает свой престол.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «охраняют царя»; еврейский глагол может означать «беречь», «охранять» или «сохранять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Сочетание передаёт и благожелательную любовь, и устойчивую верность обязательствам; повтор в обеих частях еврейского текста сохранён.
- source_word: אֱמֶת
  choice: преданность
  rationale: В паре с חֶסֶד слово обозначает прежде всего надёжность и верность, а не отвлечённую истину.
- source_word: יִצְּרוּ
  choice: хранят
  rationale: Глагол נצר означает беречь, охранять, сохранять; «хранят» естественно выражает защиту и сохранение царя.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Форма без артикля имеет обобщённый смысл, обычный для изречения мудрости; русский язык естественно передаёт его без отдельного показателя неопределённости.
- source_word: וְסָעַד
  choice: утверждается
  rationale: Глагол выражает поддержку и укрепление. Возвратная конструкция естественно передаёт, что престол получает опору благодаря верной любви.
- source_word: בַּחֶסֶד
  choice: верной любовью
  rationale: 'Творительный падеж передаёт инструментальное значение предлога ב: верная любовь служит средством укрепления престола.'
- source_word: כִּסְאוֹ
  choice: его престол
  rationale: Сохранён конкретный образ престола с местоименным суффиксом; он также подразумевает царскую власть.
