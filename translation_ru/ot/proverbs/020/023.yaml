  yaml_path: translation/ot/proverbs/020/023.yaml
  text: Unequal weights are an abomination to Yahweh[a], and deceitful scales are not good.
translation:
  language: ru
  text: Неодинаковые гири[a] — мерзость для Яхве, и обманные весы нехороши.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «камень и камень» — выражение о разных гирях, которые нечестно использовали в торговле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: 'Передаёт сильную нравственную оценку: нечто отвратительное и неприемлемое перед Богом; сохраняет привычную библейскую выразительность.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶבֶן וָאָבֶן
  choice: неодинаковые гири
  rationale: Буквально «камень и камень»; это идиома о разных гирях, которые торговец нечестно использовал при взвешивании. Выбранная формулировка ясно передаёт торговый контекст, не добавляя лишних подробностей в основной текст.
- source_word: וּמֹאזְנֵי מִרְמָה
  choice: и лживые весы
  rationale: Сочетание буквально обозначает «весы обмана». Прилагательное «лживые» естественно и ёмко передаёт использование весов для мошенничества.
- source_word: לֹא טוֹב
  choice: не добро
  rationale: Сохраняет дословную отрицательную формулу и её сдержанность, не усиливая её до «зло» или «мерзость»; именная конструкция поддерживает афористический строй пословицы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон. Передача «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным и афористичным построением. Сильное слово «мерзость» и сдержанное «не добро» сохраняют намеренный смысловой контраст оригинала.
