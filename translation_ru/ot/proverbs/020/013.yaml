source:
  edition: WLC
  text: אַל תֶּֽאֱהַ֣ב שֵׁ֭נָה פֶּן תִּוָּרֵ֑שׁ פְּקַ֖ח עֵינֶ֣י/ךָ שְֽׂבַֽע לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/013.yaml
  text: Do not love sleep[a], lest you become poor; open your eyes[b], and you will have your fill of bread.
translation:
  language: ru
  text: Не люби сна, чтобы тебе не обеднеть[a]; открой глаза — и насытишься хлебом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не оказаться в нищете» либо «чтобы не лишиться достатка». Еврейский глагол может обозначать обнищание или утрату имущества; здесь речь идёт о бедности, к которой ведёт праздность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «открой глаза; насыться хлебом». Последнее повеление по смыслу передано как результат бодрствования и прилежания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֶּאֱהַב
  choice: не люби
  rationale: Запрет передан прямо и естественно; глагол אָהַב сохраняет сильную формулировку оригинала, а не смягчается до «не увлекайся».
- source_word: שֵׁנָה
  choice: 'сон (в тексте: «сна»)'
  rationale: Обычное современное обозначение сна, сохраняющее конкретный образ еврейского текста.
- source_word: פֶּן תִּוָּרֵשׁ
  choice: чтобы тебе не обеднеть
  rationale: פֶּן вводит нежелательное последствие, а нифаль תִּוָּרֵשׁ в данном контексте означает оказаться в бедности. Инфинитивная конструкция звучит естественно по-русски.
- source_word: פְּקַח עֵינֶיךָ
  choice: открой глаза
  rationale: Сохранён буквальный образ пробуждения и бодрствования, который в контексте также подразумевает деятельную прилежность, но не сводится к её толкованию.
- source_word: שְׂבַע לָחֶם
  choice: и насытишься хлебом
  rationale: Форма שְׂבַע буквально является повелительной («насыться»), однако вслед за первым повелением может выражать его результат. Будущее время естественно передаёт смысл пословицы, а «хлеб» сохраняет исходный образ обеспечения пищей.
theological_decisions:
- issue: Связь между повелением «открой глаза» и заключительной фразой
  choice: 'Передать заключение как ожидаемый результат: «и насытишься хлебом»'
  alternative: 'Буквально передать второе повеление: «открой глаза, насыщайся хлебом»'
  rationale: Контекст противопоставляет ведущую к бедности любовь ко сну и бодрствование, связанное с достатком. При этом сноска сохраняет грамматическую форму оригинала и не превращает пословицу в безусловное богословское обещание благосостояния.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены параллелизм, конкретные образы сна, открытых глаз и хлеба; архаизмы и избыточное истолкование избегаются.
