  - severity: low
    issue: Формулировка альтернативы «удерживай его как залог» несколько менее точно описывает действие глагола חבל.
    rationale: В данном контексте естественнее говорить «возьми с него залог» или «возьми его в залог»; последнее сохраняет спорную возможность понимания суффикса, не утверждая, что человека непременно физически удерживают.
  revised_text: Возьми у него одежду — ведь он поручился[b] за чужого; возьми с него залог за чужеземцев.[a]
