  text: לְֽקַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נכרים חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/016.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold him in pledge for foreigners.
translation:
  language: ru
  text: Возьми у него одежду — ведь он поручился[b] за чужого; возьми с него залог за чужеземцев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст заключительной части стиха предельно краток. Возможен также перевод: «возьми его в залог за чужеземцев»; суффикс может пониматься по-разному, в том числе в связи с одеждой как обеспечением.'
    reason: alternative_reading
  - marker: b
    text: «Поручился» — то есть взял на себя ответственность за долг или обязательство другого человека.
    reason: cultural_note
lexical_decisions:
- source_word: לְקַח
  choice: возьми
  rationale: Повелительная форма единственного числа от לקח; нейтральное «возьми» передаёт прямое предписание, не усиливая его до «отбери».
- source_word: בִּגְדוֹ
  choice: у него одежду
  rationale: בגד обозначает предмет одежды вообще. Сочетание «возьми у него одежду» естественно по-русски и передаёт одежду должника как обеспечение.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание предписания; «ведь» сохраняет причинно-пояснительную связь и звучит естественно в русском изречении.
- source_word: עָרַב
  choice: поручился
  rationale: В данном юридико-экономическом контексте ערב означает выступить поручителем, приняв ответственность по чужому обязательству.
- source_word: זָר
  choice: за чужого
  rationale: זָר здесь указывает на постороннего, человека вне близкого круга. Субстантивированное «чужой» кратко и естественно сохраняет эту социальную дистанцию.
- source_word: וּבְעַד
  choice: за
  rationale: Передаёт ответственность или действие в связи с другими лицами и сохраняет параллель с первым полустишием.
- source_word: נכרים
  choice: чужеземцев
  rationale: Кетив נכרים — множественное число, обычно «чужеземцы, посторонние». «Чужеземцы» отличает это слово от זָר, не устраняя их смысловой близости.
- source_word: חַבְלֵהוּ
  choice: возьми с него залог
  rationale: Глагол חבל в залоговом контексте означает брать обеспечение. Суффикс мужского рода допускает отнесение к человеку; русское «с него» передаёт это без неестественного представления о самом человеке как удерживаемом залоге.
