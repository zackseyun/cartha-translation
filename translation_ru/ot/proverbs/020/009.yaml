  text: 'Кто может сказать[a]: «Я очистил своё сердце, я чист от своего греха»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто скажет: „Я очистил своё сердце, я очистился от своего греха“?» Еврейские глаголы можно передать более буквально, подчеркнув самоочищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יֹאמַר
  choice: Кто может сказать
  rationale: מִי буквально означает «кто», а יֹאמַר — «скажет/может сказать» по контексту. Добавление «может» естественно передаёт риторическую силу вопроса, не меняя его смысла.
- source_word: זִכִּיתִי
  choice: я очистил
  rationale: Пиэль глагола זכה здесь выражает очищение; сочетание «очистил своё сердце» сохраняет активный язык самоочищения и звучит естественно по-русски.
- source_word: לִבִּי
  choice: своё сердце
  rationale: «Сердце» сохраняет библейское обозначение внутреннего нравственного центра человека. Возвратное «своё» естественно при субъекте первого лица.
- source_word: טָהַרְתִּי
  choice: я чист
  rationale: Глагол טהר допускает значение состояния или достижения чистоты. «Я чист» передаёт результирующее состояние и сохраняет параллелизм без навязывания рефлексивного значения.
- source_word: מֵחַטָּאתִי
  choice: от своего греха
  rationale: חטאת здесь означает «грех», а מִן выражает отделение или свободу от него. «От своего греха» точно и естественно передаёт конструкцию.
theological_decisions:
- issue: Утверждение о внутренней чистоте и свободе от греха
  choice: Передать стих как риторический вопрос, предполагающий, что никто не может обоснованно заявить о такой чистоте.
  alternative: Понять его как нейтральный вопрос о том, кто заявляет о нравственной чистоте.
  rationale: Параллельные абсолютные утверждения об очищенном сердце и чистоте от собственного греха придают вопросу отрицательную риторическую силу. Перевод сохраняет её, не добавляя богословского вывода сверх текста.
- issue: Самоочищение во второй строке
  choice: «я чист от своего греха»
  alternative: «я очистил себя от своего греха»
  rationale: Форма טָהַרְתִּי может описывать чистоту или достижение чистоты, но явно выраженного возвратного дополнения нет. Основной текст сохраняет состояние, а сноска отмечает более формальный вариант с акцентом на самоочищении.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная форма. Сохранены образ «сердца», параллелизм двух частей и риторическая неоднозначность вопроса.
