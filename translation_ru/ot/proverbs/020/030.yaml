  text: חַבֻּר֣וֹת פֶּ֭צַע תמריק בְּ/רָ֑ע וּ֝/מַכּ֗וֹת חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/030.yaml
  text: The bruises of a wound cleanse away evil[b][a], and blows cleanse the innermost parts of the belly.
translation:
  language: ru
  text: Раны от ударов очищают от зла[a], и удары очищают самые глубины нутра[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вычищают зло»; еврейский глагол может означать очищение, оттирание или вычищение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «покои чрева» — еврейский образ сокровенных глубин человеческого существа.'
    reason: cultural_note
lexical_decisions:
- source_word: חַבֻּרוֹת פֶּצַע
  choice: кровоподтёки от ран
  rationale: חַבֻּרוֹת обозначает следы от ударов — кровоподтёки или рубцы, а פֶּצַע добавляет образ ранения. Формулировка сохраняет оба элемента краткого еврейского сочетания и естественно звучит по-русски.
- source_word: תמריק
  choice: очищают
  rationale: Форма от מרק передаёт очищение, оттирание или вычищение. «Очищают» сохраняет нравственную метафору и допускает подразумеваемое повторение глагола во второй половине стиха.
- source_word: בְּרָע
  choice: от зла
  rationale: Сочетание с предлогом ב передаёт зло как то, от чего очищают. Русское «очищают от зла» ясно и естественно выражает этот смысл.
- source_word: וּמַכּוֹת
  choice: и удары
  rationale: מַכּוֹת — нанесённые удары; нейтральное «удары» сохраняет конкретный образ, не усиливая его до более узкого «избиение».
- source_word: חַדְרֵי בָטֶן
  choice: самые глубины нутра
  rationale: Буквально выражение означает «покои чрева» и обозначает глубочайшую внутреннюю область человека. «Глубины нутра» сохраняет телесную метафору, оставаясь понятным современному читателю.
theological_decisions:
- issue: Смысл образов телесного наказания
  choice: Стих говорит, что болезненное воздействие может очищать человека от нравственного зла и затрагивать его внутреннюю глубину.
  alternative: Стих можно понимать шире — как утверждение об очищающем действии страдания вообще, а не только исправительного наказания.
  rationale: Параллельные образы ран и ударов естественно вызывают представление об исправительном воздействии, но перевод не добавляет слов «наказание» или «воспитание» и тем самым сохраняет широту и напряжение исходного образа.
- issue: Опущенный глагол во второй строке
  choice: Повторить «очищают», подразумеваемое параллелизмом.
  alternative: Передать вторую строку без глагола либо добавить «достигают».
  rationale: Еврейский параллелизм позволяет распространить глагол תמריק на вторую половину стиха. Повторение по-русски делает фразу полной, не вводя нового значения, которого нет в источнике.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Конкретные образы ран, ударов и нутра сохранены; архаическое «чрево» вынесено в буквальное пояснение, а не в основной текст.
