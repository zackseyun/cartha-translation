  text: אֶ֣בֶן וָ֭/אֶבֶן אֵיפָ֣ה וְ/אֵיפָ֑ה תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/010.yaml
  text: A differing weight and a differing measure—both of them are an abomination to Yahweh[a].
translation:
  language: ru
  text: Неодинаковые гири и неодинаковые меры — и то и другое мерзость для Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «камень и камень, ефа и ефа», то есть неодинаковые гири и меры, используемые для обмана в торговле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן וָאֶבֶן
  choice: неодинаковые гири
  rationale: Буквально «камень и камень». В торговом контексте אֶבֶן обозначает каменную гирю, а повторение указывает на два несовпадающих весовых стандарта. Перевод передаёт подразумеваемое нечестное различие, не создавая впечатления, будто речь идёт просто о камнях.
- source_word: אֵיפָה וְאֵיפָה
  choice: неодинаковые меры
  rationale: Ефа была мерой объёма сыпучих веществ; повторение обозначает использование несовпадающих мер. Обобщённое «меры» понятно современному читателю и сохраняет торговый контекст.
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Сильное нравственно-религиозное обозначение того, что вызывает у Бога отвращение. «Мерзость» сохраняет силу еврейского существительного и достоинство библейского стиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: גַּם שְׁנֵיהֶם
  choice: и то и другое
  rationale: Естественно по-русски подчёркивает, что обе названные нечестные практики одинаково осуждаются.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Степень явности подразумеваемого обмана
  choice: Сохранить образ неодинаковых гирь и мер, пояснив нечестное применение в сноске
  alternative: Внести слово «нечестные» непосредственно в основной текст
  rationale: Еврейская формула подразумевает обман в торговле, но прямо не употребляет слово «нечестный». Основной текст сохраняет образ и его лаконичность, а сноска делает подразумеваемый смысл доступным.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранены параллелизм еврейской строки, сильное слово «мерзость» и личное имя «Яхве»; подразумеваемая торговая нечестность раскрыта в сноске, а не добавлена в текст.
