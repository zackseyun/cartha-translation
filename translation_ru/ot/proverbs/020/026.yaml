  text: A wise king winnows the wicked and drives the wheel over them.
translation:
  language: ru
  text: Мудрый царь отсеивает нечестивых и прокатывает по ним молотильное колесо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «колесо»; вероятно, имеется в виду молотильное колесо, продолжающее образ обработки зерна.'
    reason: Поясняет контекстуальное уточнение «молотильное», одновременно сохраняя для читателя буквальное значение еврейского слова.
lexical_decisions:
- source_word: מְזָרֶה
  choice: отсеивает
  rationale: Причастная форма от זרה описывает веяние или просеивание зерна; в переносном смысле мудрый царь выявляет и удаляет нечестивых. «Отсеивает» естественно передаёт и земледельческий образ, и судебное различение.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: רָשָׁע в литературе мудрости обозначает виновных и нравственно порочных людей; традиционное «нечестивые» сохраняет нравственно-судебный оттенок.
- source_word: וַיָּשֶׁב
  choice: прокатывает
  rationale: В сочетании с עֲלֵיהֶם אוֹפָן глагол передаёт наведение или проведение колеса по ним. «Прокатывает» звучит естественно по-русски и сохраняет суровый образ наказания.
- source_word: אוֹפָן
  choice: молотильное колесо
  rationale: Буквально слово означает «колесо»; в контексте веяния подразумевается молотильное орудие или колесо. Уточнение делает единый земледельческий образ понятным современному читателю.
theological_decisions:
- issue: Характер царского суда
  choice: Сохранён образ решительного отделения и наказания нечестивых
  alternative: Смягчить образ до общего выражения «наказывает их»
  rationale: Еврейский текст намеренно использует суровые образы веяния и колеса; нейтральный пересказ устранил бы образность и напряжение текста.
- issue: Буквальность образа колеса
  choice: Образ сохранён как метафора царского суда без пояснения, что речь непременно идёт о казни
  alternative: Истолковать колесо как конкретный способ физической казни
  rationale: Контекст указывает на молотьбу, однако текст не требует превращать поэтический образ в описание определённой казни.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем притчи. Земледельческая метафора сохранена, а редкий для современного читателя образ колеса кратко пояснён в сноске.
