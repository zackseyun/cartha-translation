  text: Plans are established by counsel[a]; wage war with strategy.
translation:
  language: ru
  text: Замыслы утверждаются советом; войну веди, пользуясь продуманной стратегией[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при умелом руководстве» или «с продуманной тактикой». Еврейское слово может обозначать искусное руководство и стратегический расчёт; первоначально оно связано с образом управления движением, подобно управлению судном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲשָׁבוֹת
  choice: замыслы
  rationale: В данном практическом контексте слово обозначает намеченные намерения и планы действий, а не просто мысли; «замыслы» сохраняет также возможный оттенок целеполагания.
- source_word: בְּעֵצָה
  choice: советом
  rationale: 'Предлог בְּ употреблён инструментально: замыслы обретают прочность посредством совета. Краткая форма «советом» соответствует афористическому строю.'
- source_word: תִכּוֹן
  choice: утверждаются
  rationale: Нифаль от כון передаёт значение прочного установления или закрепления. Русское множественное число естественно согласуется с «замыслы».
- source_word: וּבְתַחְבֻּלוֹת
  choice: руководствуясь стратегией
  rationale: В военном контексте слово указывает на умелое руководство, продуманное управление и стратегический расчёт; перевод сохраняет военную конкретность, не сводя смысл к обманной хитрости.
- source_word: עֲשֵׂה
  choice: веди
  rationale: Сочетание עשה с מִלְחָמָה идиоматически означает вести войну; буквальное «делай войну» по-русски неестественно.
- source_word: מִלְחָמָה
  choice: войну
  rationale: Прямое значение существительного — война или военные действия; «войну» естественно сочетается с глаголом «вести».
theological_decisions: []
translation_notes:
  register: Краткий, афористичный синтаксис соответствует книге Притч. «Замыслы» и «утверждаются» сохраняют достоинство мудростной речи, а «руководствуясь стратегией» звучит понятно в современном литературном русском. Сноска поставлена при слове, которое переводит תַּחְבֻּלוֹת.
