translation:
  language: ru
  text: Замысел в сердце человека — глубокие воды, но разумный человек извлекает его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: глубокие воды
  rationale: Сохраняет буквальное множественное число и образ скрытой глубины; по-русски выражение звучит естественно в поэтическом параллелизме.
- source_word: עֵצָה
  choice: совет
  rationale: Передаёт смысл внутреннего замысла, намерения или рассуждения, не сводя его лишь к совету, данному другому; возможная широта отмечена сноской.
- source_word: בְלֶב אִישׁ
  choice: в сердце человека
  rationale: «Сердце» сохраняет библейское обозначение внутреннего мира, включая ум и волю; אִישׁ здесь употреблено обобщённо, поэтому естественное русское «человек» точно передаёт смысл.
- source_word: וְאִישׁ תְּבוּנָה
  choice: но человек разумный
  rationale: תְּבוּנָה означает разумение и проницательность; прилагательная конструкция естественна по-русски. Союз передан как «но», поскольку вторая строка противопоставляет скрытую глубину способности извлечь сокрытое.
- source_word: יִדְלֶנָּה
  choice: вычерпывает его
  rationale: Глагол דלה обозначает черпание воды из глубины. «Вычерпывает» сохраняет метафору и одновременно передаёт выявление скрытого совета; местоимение соотнесено с русским словом «совет».
