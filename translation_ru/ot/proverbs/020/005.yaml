review_pass:
  verdict: revise
  source_fidelity: 'Основной образ и параллелизм переданы верно: עֵצָה находится «в сердце человека» и человек, обладающий разумением, извлекает её. Однако «совет в сердце» в современном русском легко воспринимается как полученный человеком совет, тогда как здесь речь скорее о скрытом замысле, намерении или внутреннем рассуждении. Кроме того, «вычерпывает его» создаёт неестественное буквальное соотнесение местоимения «его» со словом «совет»; еврейский глагол сохраняет образ черпания, но по-русски естественнее передать результат как «извлекает его».'
  naturalness: Предлагаемая редакция сохраняет сжатый афористический строй, метафору глубоких вод и естественный современный синтаксис. «Замысел в сердце человека» яснее и идиоматичнее, чем «совет в сердце человека».
  terminology: עֵצָה в данном контексте лучше передать как «замысел», не ограничивая значение внешним советом. תְּבוּנָה естественно передано словом «разумный»; «человек» корректно сохраняет обобщённое употребление אִישׁ.
