- from: Совет в сердце человека — глубокие воды[a], но человек разумный вычерпывает его.
  to: Замысел в сердце человека — глубокие воды, но разумный человек извлекает его.
  rationale: 'Заменены два неудачных русских соответствия: «совет» уточнён до «замысел», а буквальное, но неестественное «вычерпывает его» — до «извлекает его». Образ глубоких вод, обобщённый характер «человека» и противопоставительный параллелизм сохранены. Необязательная структурная сноска удалена.'
  reviewer_model: gpt-5.6-terra
