  text: אַל תֹּאמַ֥ר אֲשַׁלְּמָה רָ֑ע קַוֵּ֥ה לַֽ֝/יהוָ֗ה וְ/יֹ֣שַֽׁע לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/022.yaml
  text: Do not say[a], “I will repay evil”; wait for Yahweh[c][b], and he will save you.
translation:
  language: ru
  text: 'Не говори: «Я отплачу за зло»[a]. Жди Яхве с надеждой[b] — и Он спасёт тебя[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я воздам за зло»; «Я отплачу за обиду».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол также передаёт ожидание с надеждой и упование на Яхве.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «избавит тебя»; в данном контексте возможно также значение восстановления справедливости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Сочетание אַל с имперфектом выражает запрет; «не говори» естественно и точно вводит прямую речь.
- source_word: אֲשַׁלְּמָה רָע
  choice: Я отплачу за зло
  rationale: Пиэль глагола שׁלם здесь обозначает ответное воздаяние, а רָע сохраняет нравственное значение «зло». Формулировка не уточняет, кому именно или каким способом человек намерен отплатить.
- source_word: קַוֵּה לַיהוָה
  choice: Надейся на Яхве
  rationale: קוה выражает не только ожидание, но и устремлённую, доверительную надежду. В современном русском «надейся на» естественнее передаёт это значение, чем буквальное «жди Яхве».
- source_word: וְיֹשַׁע לָךְ
  choice: и Он спасёт тебя
  rationale: Каузативная форма ישׁע означает спасти или избавить; конструкция с לָךְ идиоматично передаётся по-русски прямым дополнением «тебя».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон; «Яхве» передаёт личное имя и согласуется с указанным в материале обновлённым решением, не подменяя его титулом.
- issue: Объём значения וְיֹשַׁע לָךְ
  choice: Он спасёт тебя
  alternative: Он избавит тебя; Он защитит твою правоту
  rationale: «Спасёт» сохраняет широкое значение корня ישׁע и не сводит обещание только к физическому избавлению или оправданию.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем пословицы. Заглавное «Он» применено как традиционная русская форма почтительного обозначения Бога; тире подчёркивает противопоставление личной мести и надежды на Божье действие.
