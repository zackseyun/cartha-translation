  text: תִּפְאֶ֣רֶת בַּחוּרִ֣ים כֹּחָ֑/ם וַ/הֲדַ֖ר זְקֵנִ֣ים שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/029.yaml
  text: The glory of young men is their strength[a], and the splendor of old men is gray hair.
translation:
  language: ru
  text: Слава юношей — их сила, а великолепие стариков — седина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Красота юношей — их сила, а честь стариков — седина».'
    reason: Лексические значения תִּפְאֶרֶת и הֲדַר допускают соответственно оттенки красоты и чести.
lexical_decisions:
- source_word: תִּפְאֶרֶת
  choice: слава
  rationale: Слово обозначает красоту, украшение или почётное отличие; «слава» сохраняет возвышенный регистр и указывает на то, чем молодые люди могут по праву выделяться.
- source_word: בַּחוּרִים
  choice: юношей
  rationale: Еврейское существительное относится к молодым мужчинам; «юноши» передаёт мужской род и естественно звучит в кратком поэтическом изречении.
- source_word: כֹּחָם
  choice: их сила
  rationale: Прямо передаёт физическую силу и жизненную крепость, характерные для молодости; местоимение отражает суффикс третьего лица множественного числа.
- source_word: הֲדַר
  choice: великолепие
  rationale: Слово охватывает значения великолепия, достоинства, красоты и почёта. «Великолепие» создаёт поэтический параллелизм со «славой», не сводя смысл только к общественному уважению.
- source_word: זְקֵנִים
  choice: стариков
  rationale: В данном возрастном противопоставлении речь идёт о пожилых мужчинах, а не о носителях должности старейшины.
- source_word: שֵׂיבָה
  choice: седина
  rationale: «Седина» естественно и ёмко передаёт седые волосы как видимый знак преклонного возраста и достоинства.
theological_decisions: []
