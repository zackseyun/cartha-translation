    reason: lexical_alternative
lexical_decisions:
- source_word: כָּבוֹד
  choice: делает честь
  rationale: В контексте литературы мудрости слово обозначает честь и общественное уважение; русская конструкция «человеку делает честь» естественно передаёт смысл еврейского именного оборота.
- source_word: לָאִישׁ
  choice: человеку
  rationale: אִישׁ стоит в единственном числе и в пословице имеет обобщающий смысл. «Человеку» сохраняет этот смысл без ненужного сужения до исключительно мужского пола.
- source_word: שֶׁבֶת
  choice: держаться в стороне
  rationale: В сочетании с מִן форма выражает прекращение участия или воздержание от него. Перевод охватывает как отказ продолжать ссору, так и нежелание в неё вступать, не делая выбор уже, чем позволяет контекст.
- source_word: מֵרִיב
  choice: от ссоры
  rationale: רִיב может означать спор, распрю или тяжбу. «Ссора» здесь звучит естественно и сохраняет общий нравственный характер изречения.
- source_word: אֱוִיל
  choice: глупец
  rationale: Это устойчивый термин литературы мудрости, обозначающий не только недостаток ума, но и нравственно порочный образ действий.
- source_word: יִתְגַּלָּע
  choice: ввязывается в неё
  rationale: Редкая и не вполне ясная форма в данном противопоставлении, вероятно, описывает вступление в ссору или несдержанное проявление себя в ней. Основной вариант передаёт наиболее вероятный контекстуальный смысл, а неопределённость отмечена в сноске.
