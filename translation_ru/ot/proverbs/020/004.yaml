  text: מֵ֭/חֹרֶף עָצֵ֣ל לֹא יַחֲרֹ֑שׁ ישאל בַּ/קָּצִ֣יר וָ/אָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/004.yaml
  text: Because of winter[a], the lazy man does not plow; at harvest he seeks[b], and there is nothing.
translation:
  language: ru
  text: Из-за зимы[a] ленивый не пашет; во время жатвы он ищет[b] — и ничего нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Зимой ленивый не пашет». Еврейский предлог можно понимать как указание либо на причину («из-за зимы»), либо на время («зимой»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во время жатвы он просит». Еврейский глагол может означать «спрашивать, просить», а в данном контексте — искать или просить то, что должно было быть собрано во время жатвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחֹרֶף
  choice: Из-за зимы
  rationale: 'Предлог מִן при חֹרֶף может выражать причину: зима служит ленивому помехой или оправданием. Временное понимание также возможно и отмечено в сноске.'
- source_word: עָצֵל
  choice: ленивый
  rationale: Это устойчивое в литературе мудрости обозначение человека, которому свойственна лень. Субстантивированное прилагательное естественно звучит по-русски и сохраняет мужской род единственного числа.
- source_word: לֹא יַחֲרֹשׁ
  choice: не пашет
  rationale: Глагол обозначает пахоту; настоящее время передаёт общеистинный, пословичный характер высказывания.
- source_word: ישאל
  choice: он ищет
  rationale: Основное значение שׁאל — «спрашивать, просить», но при отсутствии дополнения и перед словами «ничего нет» контекст допускает значение поиска или ожидания урожая. Неопределённость отмечена в сноске.
- source_word: בַּקָּצִיר
  choice: во время жатвы
  rationale: Выражение указывает на пору жатвы, когда обнаруживаются последствия прежней лени.
- source_word: וָאָיִן
  choice: и ничего нет
  rationale: Экзистенциальное отрицание передано кратко, без добавления подразумеваемого объекта, как и в еврейском тексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий пословичный синтаксис сохранён. «Ленивый» естественнее архаичного «ленивец», а тире подчёркивает итог без усиления союза до «но».
