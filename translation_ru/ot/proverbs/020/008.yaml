source:
  edition: WLC
  text: מֶ֗לֶךְ יוֹשֵׁ֥ב עַל כִּסֵּא דִ֑ין מְזָרֶ֖ה בְ/עֵינָ֣י/ו כָּל רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/008.yaml
  text: A king sitting on a throne of judgment winnows all evil with his eyes[a][b].
translation:
  language: ru
  text: Царь, сидящий на престоле суда, своим взором отсеивает всякое зло[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «развеивает»; еврейский глагол вызывает образ веяния — отделения негодного от доброго.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всех злодеев». Еврейское выражение может обозначать как зло вообще, так и, по смыслу, людей, творящих зло и представших перед судом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: Царь
  rationale: Неопределённая форма в русском языке естественно выражается существительным без артикля; здесь имеется в виду царь вообще, а не конкретный правитель.
- source_word: יוֹשֵׁב
  choice: сидящий
  rationale: Причастие передаёт постоянную или характерную позу царя и сохраняет живой образ исходного текста.
- source_word: עַל כִּסֵּא דִין
  choice: на престоле суда
  rationale: «Престол» сохраняет царский контекст כִּסֵּא, а «суда» передаёт דִין как судебное разбирательство и решение.
- source_word: מְזָרֶה
  choice: отсеивает
  rationale: Глагол זרה вызывает образ веяния и отделения зерна от мякины. «Отсеивает» естественно передаёт эту метафору по-русски, не сводя её лишь к рассеиванию.
- source_word: בְעֵינָיו
  choice: своим взором
  rationale: Предлог בְּ имеет здесь орудийный оттенок; выражение указывает на проницательный взгляд царя. «Своим взором» звучит естественно и достойно в русском контексте.
- source_word: כָּל רָע
  choice: всякое зло
  rationale: רָע может обозначать зло вообще либо, по контексту, злых людей. Основной текст сохраняет широкое, не конкретизированное значение.
theological_decisions: []
