  text: נַ֭חֲלָה מבחלת בָּ/רִאשֹׁנָ֑ה וְ֝/אַחֲרִיתָ֗/הּ לֹ֣א תְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/021.yaml
  text: An inheritance gained hastily at first will not be blessed in the end[a].
translation:
  language: ru
  text: Наследство, поспешно приобретённое вначале,[a] не будет благословенно в конце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наследство, быстро полученное с самого начала». Еврейское слово может подчёркивать быстроту, преждевременность или алчную поспешность приобретения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: наследство
  rationale: Существительное обозначает наследуемое имущество или владение; «наследство» — естественный и точный русский эквивалент.
- source_word: מבחלת
  choice: поспешно приобретённое
  rationale: Редкая форма, вероятно, указывает на быстрое, преждевременное или алчно-поспешное получение. Выбранная формулировка передаёт скорость и возможную неблаговидность, не делая последнюю однозначной.
- source_word: בָּרִאשֹׁנָה
  choice: вначале
  rationale: Временное выражение обозначает начальный этап и образует контраст с последующим «в конце».
- source_word: וְאַחֲרִיתָהּ
  choice: в конце
  rationale: Буквально речь идёт о «её конце», то есть об окончательном исходе наследства; русская формулировка естественно сохраняет временной контраст.
- source_word: לֹא תְבֹרָךְ
  choice: не будет благословенно
  rationale: Пассивная форма от ברך говорит об отсутствии благословения. Перевод не сужает смысл до одного лишь материального успеха.
theological_decisions:
- issue: Характер предостережения
  choice: Поспешно приобретённое наследство в конечном итоге не будет благословенно, причём механизм этого исхода не уточняется.
  alternative: Считать стих прямым указанием исключительно на Божий суд над алчностью либо только на естественные последствия нетерпения.
  rationale: Формулировка сохраняет присущую литературе мудрости связь нравственного порядка, благословения и конечного исхода, не устраняя богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура и параллель «вначале — в конце» сохранены. Лексика понятна широкому читателю и сохраняет торжественность библейской мудрости.
