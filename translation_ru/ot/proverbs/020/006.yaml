  text: Many a man proclaims his own loyalty[b][a], but who can find a faithful man?
translation:
  language: ru
  text: Многие заявляют о собственной преданности[a], но кто найдёт верного человека[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о собственной неизменной любви» или «о собственной доброте»; еврейское חֶסֶד может означать преданность, неизменную любовь, доброту или милость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надёжного человека»; еврейское אֱמוּנִים означает верность, надёжность или достойность доверия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אָדָם
  choice: Многие
  rationale: 'Сочетание רָב с אָדָם имеет обобщённо-распределительный смысл: речь идёт о многих людях. Краткое «многие» естественно для русской пословичной речи и не сужает אָדָם до обозначения только мужчин.'
- source_word: יִקְרָא
  choice: заявляют
  rationale: Хотя קרא обычно значит «звать» или «возглашать», здесь глагол описывает публичное утверждение человеком собственного достоинства. «Заявляют» передаёт смысл самохарактеристики без чрезмерного усиления.
- source_word: אִישׁ חַסְדּוֹ
  choice: о собственной преданности
  rationale: Суффикс 3-го лица в חַסְדּוֹ указывает на качество, которое человек приписывает себе. В данном противопоставлении חֶסֶד лучше всего передаётся как «преданность», хотя слово также охватывает верную любовь, доброту и милость.
- source_word: וְאִישׁ אֱמוּנִים
  choice: но ... верного человека
  rationale: אֱמוּנִים обозначает верность, надёжность и заслуживающую доверия стойкость. «Верный человек» сохраняет нравственный контраст между заявленной преданностью и действительной верностью.
- source_word: מִי יִמְצָא
  choice: кто найдёт
  rationale: Риторический вопрос выражает редкость такого человека. Будущая форма «найдёт» естественно передаёт еврейский имперфект и пословичную постановку вопроса.
