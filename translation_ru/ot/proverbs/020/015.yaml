  language: ru
  text: Есть золото и множество жемчужин[a], но уста, исполненные знания, — драгоценный сосуд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кораллов», «рубинов»; возможно, в более общем смысле — «драгоценных камней». Точный вид драгоценности, обозначаемой еврейским словом פְּנִינִים, не вполне установлен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Есть
  rationale: Экзистенциальная частица вводит наблюдение; русское «есть» естественно передаёт наличие перечисляемых ценностей.
- source_word: זָהָב
  choice: золото
  rationale: Прямое обозначение драгоценного металла, не требующее расширения или перифраза.
- source_word: וְרָב
  choice: и множество
  rationale: Передаёт идею большого количества и естественно сочетается с последующим существительным.
- source_word: פְּנִינִים
  choice: жемчужин
  rationale: Традиционно и лексически допустимое соответствие; поскольку точный вид драгоценности неясен, неопределённость отмечена в сноске.
- source_word: וּכְלִי יְקָר
  choice: но драгоценный сосуд
  rationale: כְּלִי может обозначать сосуд, предмет или орудие. «Драгоценный сосуд» сохраняет конкретную метафору; противительное «но» естественно выражает подразумеваемое сопоставление ценностей.
- source_word: שִׂפְתֵי דָעַת
  choice: уста знания
  rationale: Сохранена конструкция «уста знания», обозначающая речь, исполненную знания, и поэтическая сжатость оригинала.
