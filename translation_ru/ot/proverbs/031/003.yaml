  text: Do not give your strength to women[b][a], or your ways to that which destroys kings.
translation:
  language: ru
  text: 'Не отдавай женщинам своей силы[a]

    и не направляй своих путей к тому, что губит царей[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сила» здесь может включать жизненную энергию, способности, влияние и имущество, а не только физическую мощь.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейскую фразу можно также понять более отвлечённо: «и свои пути — на погибель царям» или «и свои пути — к уничтожению царей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: не отдавай
  rationale: Запрет с אַל и глаголом נתן естественно передаётся современным русским повелительным оборотом «не отдавай»; он сохраняет образ передачи чего-либо другому и не усиливает его до полного самоотречения.
- source_word: לַנָּשִׁים
  choice: женщинам
  rationale: Форма множественного числа прямо означает «женщинам»; перевод не сужает её до «жён» и не превращает нравственно-практическое предостережение в общее осуждение женщин.
- source_word: חֵילֶךָ
  choice: свою силу
  rationale: חַיִל охватывает силу, жизненную энергию, способность и средства. «Сила» сохраняет широкий основной смысл, не сводя выражение только к физической мощи, богатству или половой силе.
- source_word: וּדְרָכֶיךָ
  choice: и свои пути
  rationale: דֶּרֶךְ может обозначать путь, образ действий или жизненное направление. Буквальное множественное число «пути» сохраняет образность и смысловую широту еврейского выражения.
- source_word: לַמְחוֹת
  choice: тому, что губит
  rationale: Форма от מחה связана с уничтожением, стиранием или погублением. Неличный оборот «тому, что губит» естественен по-русски и не вводит в текст конкретных лиц, которых еврейский текст прямо не называет.
- source_word: מְלָכִין
  choice: царей
  rationale: Это форма множественного числа «цари»; «царей» сохраняет царский контекст наставления и прямой смысл слова.
theological_decisions:
- issue: Смысл предостережения о женщинах
  choice: Общее по форме предостережение правителю не растрачивать силу в связях с женщинами
  alternative: Предостережение исключительно против чужеземных жён, многожёнства или женщин как таковых
  rationale: Текст прямо говорит «женщинам», но не уточняет их происхождение или семейное положение. Перевод сохраняет формулировку стиха, не превращая практическое наставление царю в учение о природе всех женщин.
- issue: Объём значения חֵילֶךָ
  choice: Сила в широком смысле, включая жизненную энергию, способности и ресурсы
  alternative: Только богатство либо исключительно половая сила
  rationale: Широкое русское слово «сила» лучше всего удерживает многозначность еврейского חַיִל и не навязывает одно из более узких толкований.
- issue: Синтаксис заключительной строки
  choice: «тому, что губит царей»
  alternative: «на погибель царям» или «на пути, уничтожающие царей»
  rationale: Еврейская конструкция кратка и допускает более отвлечённое понимание через уничтожение или погибель. Основной перевод сохраняет разрушительное действие и его направленность на царей, не конкретизируя губителя.
translation_notes:
  register: Современный литературный русский язык с лаконичным, наставительным и достойным тоном. Параллелизм двух строк сохранён; тире во второй строке обозначает естественно восстанавливаемый глагол «не отдавай». Все примечания отмечены в основном тексте.
