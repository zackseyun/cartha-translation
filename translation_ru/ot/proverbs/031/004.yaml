base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/004.yaml
  text: It is not for kings[a], O Lemuel, it is not for kings to drink wine, nor for rulers to desire strong drink,
translation:
  language: ru
  text: Не царям, Лемуил, не царям пить вино, и не правителям — искать хмельного напитка[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «и правителям: “Где хмельной напиток?”» Еврейское выражение кратко и, возможно, изображает правителей, разыскивающих опьяняющее питьё.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל לַמְלָכִים
  choice: Не царям
  rationale: Повторяющаяся конструкция выражает запрет через указание на то, что такое поведение царям не подобает. Краткое «Не царям» сохраняет поэтический параллелизм и естественно звучит по-русски.
- source_word: לְמוֹאֵל
  choice: Лемуил
  rationale: Имя употреблено как прямое обращение; в русском звательная функция понятна из позиции имени и запятых.
- source_word: שְׁתוֹ יָיִן
  choice: пить вино
  rationale: Передаёт действие, названное после формулы «не царям», и сохраняет обычное значение יַיִן — «вино».
- source_word: וּלְרוֹזְנִים
  choice: и не правителям
  rationale: רוֹזְנִים обозначает высокопоставленных властителей или сановников. «Правителям» ясно и поддерживает параллель с царями; отрицание естественно восполнено из предыдущей строки.
- source_word: או שֵׁכָר
  choice: искать хмельного напитка
  rationale: Еврейское выражение предельно кратко и допускает понимание как поиска или желания опьяняющего напитка. «Хмельной напиток» не создаёт ошибочной ассоциации исключительно с современным крепким дистиллированным алкоголем.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой наставления. Повтор «не царям» сохранён; тире перед «искать» помогает прочитать параллельную конструкцию. Неоднозначность заключительной еврейской фразы отмечена в сноске.
