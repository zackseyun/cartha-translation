  verdict: revise
  source_fidelity: 'Первая часть верно передаёт פְּתַח פִּיךָ. Однако לְאִלֵּם прежде всего означает «немого / не способного говорить»; «безгласный» допустим как контекстуальное расширение, но не должен заменять основной, более прямой смысл без оговорки. Во второй части добавленный второй императив «защищай» не обязателен и несколько перестраивает синтаксис: в еврейском тексте один призыв «открой уста» с двумя обстоятельствами цели/заступничества. «Обречённых» представляет один вероятный смысл בְּנֵי חֲלוֹף, но слишком определённо; сохранение вариантов в сноске необходимо.'
  naturalness: '«Защищай дело» не является естественным современным русским сочетанием: обычно защищают права, интересы, человека или позицию. Оборот «в защиту дела» естественнее и позволяет сохранить один исходный императив. «Открывай уста» уместно в высоком наставительном, библейском регистре.'
  terminology: «Немой» точно соответствует אִלֵּם; «безгласный» следует оставить как вариант, поскольку он передаёт применимость призыва к тем, кто не может постоять за себя. «Дело» сохраняет судебно-правовой оттенок דִּין. Неоднозначное חֲלוֹף не следует догматически отождествлять ни только с обездоленными, ни только с умирающими.
