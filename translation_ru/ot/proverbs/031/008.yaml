  text: פְּתַח פִּ֥י/ךָ לְ/אִלֵּ֑ם אֶל דִּ֝֗ין כָּל בְּנֵ֥י חֲלֽוֹף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/008.yaml
  text: Open your mouth for the mute[a], for the cause of all the passing away.
translation:
  language: ru
  text: Открывай уста за немого, в защиту дела всех обречённых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за безгласного». Последнюю часть стиха можно также перевести: «в защиту прав всех погибающих», «в защиту дела всех обездоленных» или, более буквально, «ради дела всех сынов бренности». Еврейское выражение трудно для понимания, особенно редкое слово חֲלוֹף.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: Открывай уста
  rationale: Конкретный древнееврейский образ сохранён; форма несовершенного вида естественно передаёт наставление как постоянную обязанность.
- source_word: לְאִלֵּם
  choice: за безгласного
  rationale: «Безгласный» обозначает человека, который не может говорить сам за себя, и в данном судебно-защитительном контексте звучит естественнее буквального «немого».
- source_word: אֶל־דִּין
  choice: защищай дело
  rationale: דִּין имеет судебно-правовой оттенок; добавление глагола, подразумеваемого параллельным призывом, делает русскую фразу ясной, не сводя смысл только к абстрактным «правам».
- source_word: כָּל בְּנֵי חֲלוֹף
  choice: всех обречённых
  rationale: Идиома «сыны…» обозначает класс людей, а редкое חֲלוֹף связано с уходом, исчезновением или гибелью. «Обречённые» кратко передаёт людей, находящихся на пути к гибели, при сохранении неопределённости в сноске.
theological_decisions:
- issue: Кого обозначает בְּנֵי חֲלוֹף
  choice: всех обречённых
  alternative: всех погибающих; всех обездоленных; всех сынов бренности
  rationale: Редкое חֲלוֹף не позволяет уверенно сузить группу до материально нуждающихся либо исключительно умирающих; основной текст передаёт уязвимость и близость гибели, а сноска сохраняет важные варианты.
translation_notes:
  register: Современный литературный русский с сохранением библейского образа «открывать уста». «Безгласный» dignified and contextually broader than a merely physiological description; «защищай дело» ясно передаёт судебное заступничество.
