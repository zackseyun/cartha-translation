  text: 'Her children rise up and call her blessed[a]; her husband also[b], and he praises her:'
translation:
  language: ru
  text: 'Её дети[a] встают и называют её счастливой[b]; муж тоже хвалит её:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её сыновья». Еврейское בָנֶיהָ может означать как сыновей, так и детей вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «называют её благословенной». Еврейский глагол וַיְאַשְּׁרוּהָ означает объявлять или признавать кого-либо счастливым, благополучным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָמוּ
  choice: встают
  rationale: Еврейская форма буквально означает «встали/поднялись». В поэтическом обобщении русский настоящий вид «встают» естественно передаёт повторяемую сцену и сохраняет конкретный образ почтительного признания.
- source_word: בָנֶיהָ
  choice: её дети
  rationale: בנים может обозначать как сыновей, так и детей в целом. В семейном контексте «дети» сохраняет вероятный собирательный смысл; более узкая возможность отмечена в сноске.
- source_word: וַיְאַשְּׁרוּהָ
  choice: называют её счастливой
  rationale: Пиэль глагола אשר означает признавать или объявлять кого-либо счастливым, благополучным. Этот перевод прямо передаёт оценочное высказывание, не смешивая его с действием благословения.
- source_word: בַּעְלָהּ
  choice: муж
  rationale: Хотя בעל может иметь значения «владелец» или «господин», здесь семейный контекст однозначно указывает на мужа.
- source_word: וַיְהַלְלָהּ
  choice: хвалит её
  rationale: Глагол הלל означает «хвалить, восхвалять»; «хвалит» — прямой и естественный русский эквивалент.
- source_word: ו
  choice: и … и
  rationale: 'Союз перед упоминанием мужа имеет присоединительное значение: к похвале детей добавляется похвала мужа. Русская конструкция «и муж — и хвалит» сохраняет этот переход без избыточного разъяснения.'
theological_decisions:
- issue: Значение וַיְאַשְּׁרוּהָ
  choice: называют её счастливой
  alternative: называют её благословенной
  rationale: Исходный глагол описывает признание человека счастливым или благополучным, а не обязательно наделение его благословением. Выбор сохраняет смысловую границу и не усиливает религиозную терминологию сверх текста.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью. Двоеточие сохранено как переход к прямому содержанию похвалы в следующем стихе. Вставка «встаёт» при муже синтаксически восполняет эллипсис оригинала и делает параллелизм ясным по-русски.
