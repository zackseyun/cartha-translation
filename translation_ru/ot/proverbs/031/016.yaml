  text: זָמְמָ֣ה שָׂ֭דֶה וַ/תִּקָּחֵ֑/הוּ מִ/פְּרִ֥י כַ֝פֶּ֗י/הָ נטע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/016.yaml
  text: She considers a field and acquires it[b][a]; from the fruit of her hands she plants a vineyard.
translation:
  language: ru
  text: Она присматривает поле и приобретает его[a]; на доход от труда своих рук[b] она насаждает виноградник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод: «замышляет о поле и берёт его». Еврейские глаголы подчёркивают обдуманное, целенаправленное хозяйственное решение; слово «приобретает» не уточняет, было ли поле именно куплено.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от плода своих рук», то есть на результат или доход от собственного труда.'
    reason: cultural_note
lexical_decisions:
- source_word: זָמְמָה
  choice: присматривает
  rationale: Глагол выражает целенаправленное обдумывание или замысел. «Присматривает» естественно передаёт осмотрительное намерение приобрести поле, не сводя действие ни к простому желанию, ни к уже окончательно принятому плану.
- source_word: שָׂדֶה
  choice: поле
  rationale: Прямое и естественное соответствие для обозначения поля или обрабатываемого участка земли.
- source_word: וַתִּקָּחֵהוּ
  choice: приобретает его
  rationale: לקח имеет широкое значение «брать, приобретать». В хозяйственном контексте «приобретает» звучит естественно и не уточняет способ приобретения так узко, как «покупает».
- source_word: מִפְּרִי כַפֶּיהָ
  choice: на доход от труда своих рук
  rationale: Буквально выражение говорит о «плоде её рук» и обозначает результат или выручку от собственного труда. Русская формулировка сохраняет источник средств и ясно передаёт экономический смысл.
- source_word: נטע
  choice: она насаждает
  rationale: Контекст продолжает описание действий женщины; русское подлежащее выражено явно. «Насаждает» уместно для закладки виноградника и сохраняет значение глагола «сажать».
- source_word: כָּרֶם
  choice: виноградник
  rationale: Стандартное и точное русское соответствие.
