    rationale: 'В английской строке [b] стоит после “it”, хотя примечание b относится к «fruit of her hands», а [a] добавлен после него. Для русского текста это не создаёт ошибки: его маркеры стоят верно. Нормативный масоретский текст Притч 31:16 имеет נָטְעָה («она насадила/посадила»), то есть форму 3 ж. р.; указание на 3 м. р. в audit trail следует исправить.'
