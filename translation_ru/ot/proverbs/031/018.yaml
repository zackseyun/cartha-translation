lexical_decisions:
- source_word: טָעֲמָה
  choice: убеждается
  rationale: Глагол буквально означает «вкушает», но здесь передаёт основанное на опыте распознавание и оценку; «убеждается» естественно выражает этот смысл по-русски.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, в чём она убеждается.
- source_word: טוֹב
  choice: приносит добро
  rationale: Сохраняет широкое значение добра и пользы, не сужая его исключительно до денежной прибыли.
- source_word: סַחְרָהּ
  choice: её торговля
  rationale: Слово может обозначать торговлю, товар или получаемую выгоду; «торговля» естественно связано с хозяйственной деятельностью женщины в контексте.
- source_word: לֹא יִכְבֶּה
  choice: не гаснет
  rationale: Обычное и точное русское выражение применительно к светильнику.
- source_word: בַלַּיְלָה
  choice: и ночью
  rationale: Частица «и» идиоматично подчёркивает продолжение деятельности в ночное время, не изменяя временного значения выражения.
- source_word: נֵרָהּ
  choice: её светильник
  rationale: Передаёт конкретный предмет, а не отвлечённый свет, сохраняя бытовой образ еврейского текста.
