  text: She opens her palm to the poor[b][a], and extends her hands to the needy.
translation:
  language: ru
  text: Она раскрывает[a] свою ладонь бедному и протягивает[b] руки нуждающемуся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простирает свою ладонь к бедному».'
    reason: lexical_alternative
  - marker: b
