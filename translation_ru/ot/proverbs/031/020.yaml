    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפָּהּ
  choice: ладонь свою
  rationale: כַּף обозначает ладонь или внутреннюю сторону кисти. «Ладонь» сохраняет конкретный образ открытой руки и естественно сочетается с глаголом «раскрывает».
- source_word: פָּרְשָׂה
  choice: раскрывает
  rationale: פרשׂ значит «расстилать, распростирать, протягивать». В сочетании с ладонью «раскрывает» естественно передаёт жест щедрости, не устраняя возможность более буквального понимания, отмеченного в сноске.
- source_word: לֶעָנִי
  choice: бедному
  rationale: עָנִי может обозначать бедного, угнетённого или страдающего человека. В контексте деятельной помощи наиболее вероятен социально-экономический смысл «бедному».
- source_word: יָדֶיהָ
  choice: руки
  rationale: Форма указывает на обе руки; русское множественное число естественно передаёт этот образ.
- source_word: שִׁלְּחָה
  choice: протягивает
  rationale: Пиэль глагола שלח здесь передаёт движение рук к тому, кому оказывается помощь. «Протягивает» точно и естественно выражает этот жест.
- source_word: לָאֶבְיוֹן
  choice: нуждающемуся
  rationale: אֶבְיוֹן — человек, испытывающий нужду. «Нуждающемуся» сохраняет смысловое отличие от עָנִי («бедному») и параллелизм двух строк.
