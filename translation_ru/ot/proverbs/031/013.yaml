  source_fidelity: '«Она ищет шерсть и лён» точно передаёт דָּרְשָׁה צֶמֶר וּפִשְׁתִּים, не сужая значение «ищет» до покупки или заготовки. «Охотно трудится своими руками» естественно отражает וַתַּעַשׂ בְּחֵפֶץ כַּפֶּיהָ: труд как ручная работа и положительная, добровольная направленность действия сохранены.'
  naturalness: Фраза звучит кратко, ясно и литературно на современном русском языке. Порядок слов и сочетание «трудится своими руками» идиоматичны и соответствуют достоинственному стилю поучительной поэзии.
  terminology: «Шерсть» и «лён» верно передают названия материалов. «Руками» — уместный русский идиоматический эквивалент כַּפֶּיהָ («её ладони/руки»). «Охотно» передаёт חֵפֶץ без неоправданного усиления до эмоционального «с удовольствием».
