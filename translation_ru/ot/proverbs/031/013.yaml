  text: דָּ֭רְשָׁה צֶ֣מֶר וּ/פִשְׁתִּ֑ים וַ֝/תַּ֗עַשׂ בְּ/חֵ֣פֶץ כַּפֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/013.yaml
  text: She seeks wool and flax[a], and works with willing hands.
translation:
  language: ru
  text: Она ищет шерсть и лён и охотно трудится своими руками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «и трудится, находя удовольствие в работе своих рук» или «и усердно трудится своими руками».'
    reason: 'Еврейское выражение допускает разные смысловые связи: оно может указывать на её охотное, радостное или усердное отношение к ручному труду.'
lexical_decisions:
- source_word: דָּרְשָׁה
  choice: ищет
  rationale: Глагол означает «искать, разыскивать, стремиться получить». «Ищет» сохраняет активность героини, не уточняя без достаточных оснований, разыскивает ли она материалы, выбирает их или приобретает.
- source_word: צֶמֶר
  choice: шерсть
  rationale: Прямое обозначение шерсти как материала для изготовления ткани.
- source_word: וּפִשְׁתִּים
  choice: и лён
  rationale: Еврейское слово обозначает лён как растение или сырьё; «льняная ткань» излишне переносило бы смысл на уже обработанный продукт.
- source_word: וַתַּעַשׂ
  choice: трудится
  rationale: Широкий глагол «делать, производить» в контексте ручной обработки текстильного сырья естественно передаётся как «трудится».
- source_word: בְּחֵפֶץ
  choice: охотно
  rationale: Слово выражает желание, расположение, удовольствие или готовность. «Охотно» естественно описывает положительное отношение к труду, не усиливая эмоциональный оттенок.
- source_word: כַּפֶּיהָ
  choice: своими руками
  rationale: Хотя כף буквально может означать «ладонь», здесь речь идёт о руках как орудии труда; возвратное местоимение естественно передаёт принадлежность рук действующей женщине.
