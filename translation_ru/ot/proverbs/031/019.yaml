  text: She stretches out her hands to the distaff[a], and her palms hold the spindle.
translation:
  language: ru
  text: Она протягивает руки к прялке[a], а её ладони держат веретено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Она берётся руками за прялку, а её ладони охватывают веретено».'
    reason: 'Еврейские глаголы и предлог допускают более контактное описание действия: руки не только протягиваются к орудиям, но берутся за них и удерживают их.'
lexical_decisions:
- source_word: יָדֶיהָ
  choice: руки
  rationale: Форма с суффиксом 3-го лица женского рода обозначает руки женщины; русское множественное число естественно передаёт парный образ.
- source_word: שִׁלְּחָה
  choice: протягивает
  rationale: Глагол שׁלח здесь описывает целенаправленное движение рук к орудию труда. «Протягивает» сохраняет конкретный образ и звучит естественно по-русски.
- source_word: בַכִּישׁוֹר
  choice: к прялке
  rationale: כִּישׁוֹר обозначает орудие для прядения, обычно прялку или кудельную часть прядильного приспособления. Предлог ב в данном сочетании передан направительным «к», поскольку речь идёт о движении рук к орудию.
- source_word: וְכַפֶּיהָ
  choice: а ладонями
  rationale: כַּף конкретно означает ладонь или внутреннюю часть кисти. «Ладонями» сохраняет телесную образность и поэтический параллелизм; союз «а» естественно соединяет два сопоставленных действия без выраженного противопоставления.
- source_word: תָּמְכוּ
  choice: держит
  rationale: תמך может означать «поддерживать», «держать», «охватывать». В сцене прядения нейтральное «держит» ясно передаёт обращение с орудием, не уточняя движение сверх сказанного.
- source_word: פָלֶךְ
  choice: веретено
  rationale: פֶּלֶךְ обозначает прядильное орудие, обычно веретено. Такой перевод отличает его от כִּישׁוֹר в первой строке и сохраняет ремесленный образ.
