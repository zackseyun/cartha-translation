  text: Her husband is known in the gates[b][a], when he sits among the elders of the land.
translation:
  language: ru
  text: Муж её известен у городских ворот[a], когда он сидит среди старейшин земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У городских ворот находилось общественное место, где разбирали правовые и общинные дела.
    reason: cultural_note
lexical_decisions:
- source_word: נוֹדָע
  choice: известен
  rationale: Нифаль от ידע передаёт состояние «быть известным, признанным». «Известен» сохраняет буквальный смысл и не сводит его к почёту, хотя уважение может подразумеваться контекстом.
- source_word: בַּשְּׁעָרִים
  choice: у городских ворот
  rationale: Буквально — «в воротах». В древнем городе у ворот решались общественные и судебные дела; по-русски «у городских ворот» естественно сохраняет образ и обозначает это общественное место.
- source_word: בַּעְלָהּ
  choice: муж её
  rationale: В данном описании женщины בַּעְלָהּ по контексту означает её мужа; более иерархическое «господин» здесь не требуется.
- source_word: בְּשִׁבְתּוֹ
  choice: он сидит
  rationale: Сочетание предлога ב с инфинитивом и местоименным суффиксом описывает обстоятельство, при котором муж известен. Двоеточие естественно передаёт эту связь и не делает её строго временной или причинной.
- source_word: עִם
  choice: среди
  rationale: Хотя עִם обычно значит «с», здесь «среди» естественно обозначает его участие в собрании старейшин.
- source_word: זִקְנֵי אָרֶץ
  choice: старейшин земли
  rationale: Сохранено буквальное «земли», без контекстуального сужения до «города»; речь идёт о признанных общественных руководителях.
