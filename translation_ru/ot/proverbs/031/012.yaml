  text: גְּמָלַ֣תְ/הוּ ט֣וֹב וְ/לֹא רָ֑ע כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/012.yaml
  text: She does him good[a], and not harm, all the days of her life.
translation:
  language: ru
  text: Она делает ему добро, а не зло, во все дни своей жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּמָלַתְהוּ
  choice: воздаёт ему
  rationale: Глагол גמל может означать «обходиться с кем-либо», «воздавать» или «отплачивать». «Воздаёт ему добром» естественно передаёт еврейскую конструкцию и сохраняет возможный оттенок ответного действия, не утверждая прямо, что речь идёт о награде.
- source_word: טוֹב
  choice: добром
  rationale: טוֹב употреблено субстантивно; творительный «добром» естественно сочетается в русском с глаголом «воздаёт».
- source_word: וְלֹא רָע
  choice: а не злом
  rationale: רָע может обозначать зло, беду или вред. В параллельной паре с טוֹב русское «добром, а не злом» точно сохраняет краткий поэтический контраст и допускает как нравственный, так и практический смысл.
- source_word: כֹּל יְמֵי
  choice: во все дни
  rationale: Формулировка близко передаёт еврейское временно́е выражение и сохраняет поэтическую размеренность.
- source_word: חַיֶּיהָ
  choice: своей жизни
  rationale: Формально множественное חַיִּים обычно обозначает жизнь как целое. Возвратное «своей» однозначно связывает жизнь с женщиной — подлежащим предложения — и естественно звучит по-русски.
