- source_word: בָּנוֹת
  choice: дочери
  rationale: Сохраняет буквальный образ еврейского текста; в данном поэтическом контексте слово может обозначать женщин вообще, что отмечено в сноске.
- source_word: עָשׂוּ חָיִל
