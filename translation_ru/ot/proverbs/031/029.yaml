  choice: но ты
  rationale: 'Союз в контексте выражает противопоставление: многие достойны похвалы, однако обращённая женщина поставлена выше всех.'
- source_word: עָלִית עַל כֻּלָּנָה
  choice: превзошла их всех
  rationale: Естественно передаёт идиоматический смысл буквального «поднялась выше всех их» и сохраняет завершённую форму еврейского глагола.
