id: PRO.31.6
reference: Proverbs 31:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: תְּנוּ שֵׁכָ֣ר לְ/אוֹבֵ֑ד וְ֝/יַיִן לְ/מָ֣רֵי נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/006.yaml
  text: Give strong drink to one who is perishing[b][a], and wine to those bitter in soul.
translation:
  language: ru
  text: Дайте хмельной напиток погибающему[a], и вино — тем, у кого горько на душе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умирающему». Еврейское причастие может обозначать погибающего, обречённого или близкого к смерти человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «горьким душой» — образное выражение глубокой внутренней скорби или мучения.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ
  choice: Дайте
  rationale: Форма повелительного наклонения во множественном числе от נתן. «Дайте» прямо и естественно передаёт обращённое к нескольким лицам повеление.
- source_word: שֵׁכָר
  choice: хмельной напиток
  rationale: Слово обозначает алкогольный напиток, отличный от вина, без обязательного указания на конкретный вид. «Хмельной напиток» сохраняет общее значение и звучит естественно по-русски.
- source_word: לְאוֹבֵד
  choice: погибающему
  rationale: Причастие от אבד может обозначать того, кто погибает, близок к смерти или оказывается в гибельном состоянии. «Погибающему» сохраняет широту и незавершённость значения.
- source_word: וְיַיִן
  choice: и вино
  rationale: Обычное еврейское слово со значением «вино»; союз передан непосредственно.
- source_word: לְמָרֵי נָפֶשׁ
  choice: тем, у кого горько на душе
  rationale: Буквально «горьким душой». Русское идиоматическое выражение сохраняет метафору внутренней горечи и ясно передаёт глубокую душевную муку; множественное число отражено словом «тем».
- source_word: נָפֶשׁ
  choice: душе
  rationale: В данном обороте слово обозначает внутреннего человека, переживающего скорбь. Выражение «горько на душе» естественно для современного русского языка и сохраняет образ исходного текста.
theological_decisions:
- issue: Следует ли смягчить повеление, чтобы стих не звучал как безусловное одобрение опьянения
  choice: Сохранить прямое повелительное наклонение еврейского текста без пояснительного смягчения.
  alternative: Передать как ограниченное лечебное употребление алкоголя либо как иронию или сарказм.
  rationale: В самом стихе стоят прямые повелительные формы, и он не вводит таких ограничений. Этическое и контекстуальное истолкование не следует вносить в перевод основной строки.
translation_notes:
  register: Современный литературный русский язык с достойным, ясно воспринимаемым регистром. Синтаксический параллелизм сохранён; тире во второй части естественно восполняет глагол «дайте». Маркеры сносок размещены непосредственно после соответствующих выражений.
