id: PRO.31.30
reference: Proverbs 31:30
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שֶׁ֣קֶר הַ֭/חֵן וְ/הֶ֣בֶל הַ/יֹּ֑פִי אִשָּׁ֥ה יִרְאַת יְ֝הוָ֗ה הִ֣יא תִתְהַלָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/030.yaml
  text: Charm is deceitful[a], and beauty is fleeting[c][b], but a woman who fears Yahweh shall be praised.
translation:
  language: ru
  text: Обаяние обманчиво, и красота мимолётна[a], а женщина[b], боящаяся Яхве, будет восхвалена[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «красота — дуновение (пар)»; еврейский образ может указывать и на быстротечность, и на пустоту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жена»; еврейское אִשָּׁה в зависимости от контекста может означать и женщину, и жену.'
    reason: alternative_reading
  - marker: c
    text: 'Возможное прочтение: «будет хвалиться» или «пусть хвалится»; однако контекст сильнее поддерживает смысл «будет восхвалена».'
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁקֶר הַחֵן
  choice: Обаяние обманчиво
  rationale: שֶׁקֶר обозначает ложь или обманчивость, а חֵן здесь — внешнюю привлекательность и обаяние. Именное сказуемое передано естественной для современного русского языка конструкцией.
- source_word: הֶבֶל הַיֹּפִי
  choice: красота мимолётна
  rationale: הֶבֶל буквально вызывает образ дыхания, пара или дуновения и может выражать как пустоту, так и быстротечность. В сочетании с красотой контекстуально уместно значение преходящести; буквальный образ сохранён в примечании.
- source_word: אִשָּׁה
  choice: женщина
  rationale: Слово может означать как женщину, так и жену. Здесь заключительная сентенция допускает обобщённое значение «женщина», при этом вариант «жена» отмечен в сноске.
- source_word: יִרְאַת יְהוָה
  choice: боящаяся Яхве
  rationale: Конструктивное сочетание «страх Яхве» характеризует женщину. Причастный оборот естественно передаёт эту характеристику и сохраняет библейское понятие благоговейного страха перед Богом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом, что непосредственно отражает Тетраграмматон в еврейском тексте.
- source_word: הִיא תִתְהַלָּל
  choice: будет восхвалена
  rationale: Самостоятельное местоимение выделяет именно такую женщину как достойную похвалы. Форма Hitpael допускает рефлексивное прочтение, однако в контексте завершения похвалы добродетельной женщине вероятнее пассивно-медиальное значение; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение תִתְהַלָּל
  choice: будет восхвалена
  alternative: будет хвалиться / пусть хвалится
  rationale: Hitpael может быть рефлексивным, но контекст всей поэмы, завершающейся публичной похвалой этой женщине, сильнее поддерживает пассивно-медиальное прочтение. Альтернатива сохранена в примечании, чтобы не скрывать языковую неоднозначность.
- issue: Смысл страха перед Яхве
  choice: боящаяся Яхве
  alternative: благоговеющая перед Яхве
  rationale: Прямая формулировка сохраняет традиционное библейское выражение и его смысловую напряжённость, не сводя «страх» только к почтению или только к испугу.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным ритмом. Синтаксис сохраняет трёхчастное противопоставление стиха; термин «страх» оставлен без богословского сглаживания, а редкое, но понятное «восхвалена» точно выражает направленную на женщину похвалу.
