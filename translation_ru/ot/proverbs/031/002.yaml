lexical_decisions:
- source_word: מַה
  choice: Что
  rationale: Троекратное вопросительное слово передаёт краткое, взволнованное риторическое обращение; эллиптичность оригинала сохранена.
- source_word: בְּרִי
  choice: сын мой
  rationale: Поэтическая форма со значением «мой сын»; естественный русский порядок слов поддерживает возвышенный регистр.
- source_word: בַּר
  choice: сын
  rationale: Последовательный перевод мужского обозначения сохраняет трёхчастный параллелизм и гендерную точность оригинала.
- source_word: בִּטְנִי
  choice: чрева моего
  rationale: В материнском обращении слово обозначает утробу; «чрево» точно передаёт образ и подходит для литературно-поэтического регистра.
- source_word: נְדָרָי
  choice: обетов моих
  rationale: Передано буквально, без уточнения содержания и обстоятельств этих обетов, которых текст не раскрывает.
theological_decisions:
- issue: Смысл троекратного риторического обращения
  choice: 'Сохранены три кратких эллиптических вопроса: «Что…? Что…? Что…?»'
  alternative: «Что сказать мне, сын мой?..»
  rationale: Еврейский текст эмоционально напряжён и не содержит глагола; буквальная эллиптичность сохраняет неоднозначность и поэтический напор.
- issue: Гендерное обозначение сына
  choice: «сын мой» / «сын чрева моего» / «сын обетов моих»
  alternative: «дитя моё» / «дитя чрева моего» / «дитя обетов моих»
  rationale: Источник трижды употребляет мужское существительное «сын», поэтому перевод не нейтрализует его.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Инверсия «сын мой» и сочетания «чрева моего», «обетов моих» передают параллелизм и достоинство оригинала; союз перед вторым и третьим обращением опущен как необязательный в русском риторическом повторе.
