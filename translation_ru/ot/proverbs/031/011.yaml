  yaml_path: translation/ot/proverbs/031/011.yaml
  text: The heart of her husband trusts in her, and he will lack no gain.
translation:
  language: ru
  text: Сердце её мужа доверяет ей, и он не останется без выгоды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַח ... לֵב
  choice: сердце ... доверяет
  rationale: Сохранён еврейский образ сердца как центра внутренней уверенности и доверия; русская формулировка остаётся ясной и поэтичной.
- source_word: שָׁלָל
  choice: прибыль
  rationale: Обычно слово означает добычу или трофеи, но в данном контексте описывает материальную выгоду и достаток, которые приносит надёжная хозяйка; «прибыль» передаёт контекстуальный смысл без оттенка грабежа.
- source_word: לֹא יֶחְסָר
  choice: не будет недостатка
  rationale: Передаёт прямое значение глагола «недоставать, испытывать недостаток» и сохраняет связь с вынесенным вперёд существительным «прибыль».
theological_decisions: []
