base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/001.yaml
  text: 'The words of King Lemuel[b][a], an oracle that his mother taught him:'
translation:
  language: ru
  text: 'Слова царя Лемуила — пророческое изречение[a], которому учила его мать[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слова Лемуила, царя Массы, которым учила его мать». Еврейское מַשָּׂא может означать «пророческое изречение» или быть названием Масса.'
    reason: alternative_reading
  - marker: b
    text: Глагол может также означать «наставляла», «вразумляла» или «приучала к дисциплине».
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Слова
  rationale: Форма множественного числа в сопряжённом состоянии вводит заголовок собрания. «Слова» непосредственно передаёт еврейскую формулу и естественно звучит по-русски.
- source_word: לְמוּאֵל
  choice: Лемуила
  rationale: Личное имя передано принятой русской транслитерацией.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Титул при имени Лемуила; в основном тексте передан естественным русским сочетанием «царя Лемуила».
- source_word: מַשָּׂא
  choice: пророчество
  rationale: При масоретской огласовке слово обозначает возвещаемое свыше изречение, пророческое слово. Географическое прочтение «Масса» сохранено в сноске.
- source_word: אֲשֶׁר
  choice: которому
  rationale: Относительное местоимение связывает пророчество с последующим сообщением о материнском наставлении; форма обусловлена русским управлением глагола «научить».
- source_word: יִסְּרַתּוּ
  choice: его научила
  rationale: Глагол יסר охватывает обучение, наставление и дисциплинирование. В контексте передачи мудрого наставления «научила» наиболее естественно, а местоимение «его» сохраняет выраженный в еврейском тексте объект.
- source_word: אִמּוֹ
  choice: мать
  rationale: Существительное с суффиксом третьего лица передано в конструкции «его научила мать», где принадлежность матери Лемуилу ясно выражена объектным местоимением и контекстом; повтор «его … его мать» по-русски был бы тяжеловесен.
theological_decisions:
- issue: Характер מַשָּׂא
  choice: В основном тексте — «пророчество».
  alternative: «Масса» как название местности или народа.
  rationale: Масоретская огласовка и распространённое употребление слова поддерживают значение пророческого возвещения, но согласный текст допускает географическое прочтение; оно не устранено, а дано в сноске.
translation_notes:
  register: Современный литературный русский язык; заголовочная конструкция краткая и торжественная без архаизации. Двоеточие показывает, что далее следует содержание материнского наставления.
