  yaml_path: translation/ot/proverbs/031/026.yaml
  text: She opens her mouth with wisdom[b][a], and the instruction of kindness is on her tongue.
translation:
  language: ru
  text: Она открывает уста с мудростью, и наставление[a], проникнутое добротой[b], — у неё на языке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон». Еврейское תּוֹרָה может означать «закон», но здесь, вероятно, имеет более широкое значение: учение или наставление.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское חֶסֶד можно также перевести как «милость», «верная любовь» или «неизменная любовь». Еврейское выражение может также означать «наставление о доброте» или «закон доброты».
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיהָ
  choice: уста
  rationale: Сохраняет конкретный образ еврейского текста; в возвышенной поэтической речи современного русского языка «уста» звучит естественнее, чем буквальное «рот».
- source_word: פָּתְחָה
  choice: открывает
  rationale: Перфект в описании добродетельной женщины передаёт её характерное действие, поэтому настоящее время уместно; сам образ открытия уст сохранён.
- source_word: בְחָכְמָה
  choice: с мудростью
  rationale: Передаёт инструментально-качественный смысл предлога ב и сохраняет существительное «мудрость», не сводя выражение к наречию «мудро».
- source_word: וְתוֹרַת
  choice: и наставление
  rationale: В контексте литературы мудрости תּוֹרָה означает не только закон, но и обучение, наставление; «наставление» естественно передаёт этот более широкий смысл.
- source_word: חֶסֶד
  choice: доброте
  rationale: Здесь חֶסֶד описывает благожелательность и милосердный характер речи. «Доброта» понятно и естественно в данном межличностном контексте, хотя возможны «милость» и «верная любовь».
- source_word: תּוֹרַת חֶסֶד
  choice: наставление о доброте
  rationale: Русская конструкция естественно выражает связь двух существительных, не превращая её без пояснения в прилагательное. При этом допускается как наставление доброте, так и наставление, проникнутое добротой.
- source_word: עַל לְשׁוֹנָהּ
  choice: на её языке
  rationale: Сохраняет еврейский образ речи, постоянно готовой прозвучать, и остаётся понятным русским выражением.
theological_decisions:
- issue: Характер связи между תּוֹרָה и חֶסֶד
  choice: наставление о доброте
  alternative: доброе наставление; закон милости
  rationale: Еврейская именная конструкция допускает оттенки наставления, посвящённого доброте, и наставления, отличающегося добротой. Основной текст сохраняет смысловую открытость, а примечания отмечают лексические альтернативы.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим библейским звучанием. «Уста» и «на её языке» сохраняют параллельные телесные образы оригинала; синтаксис остаётся ясным для обычного читателя.
