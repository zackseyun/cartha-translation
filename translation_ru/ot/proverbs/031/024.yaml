  text: She makes linen garments and sells them[c][b][a], and supplies belts to the merchant.
translation:
  language: ru
  text: Она делает льняные изделия[a] и продаёт их, а торговцу[c] поставляет пояса[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «льняную одежду»; возможно также: «льняное полотно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кушаки».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ханаанею»; здесь это слово, вероятно, означает торговца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָדִין
  choice: льняные изделия
  rationale: Слово обозначает предмет из льняной ткани, возможно одежду или полотно. В торговом контексте нейтральное «изделия» сохраняет неопределённость относительно точного вида товара.
- source_word: עָשְׂתָה
  choice: делает
  rationale: Хотя в еврейском употреблена перфектная форма, в акростихе описываются обычные, характерные занятия женщины, поэтому естественно настоящее время.
- source_word: וַתִּמְכֹּר
  choice: и продаёт их
  rationale: Настоящее время передаёт обычное действие; местоимение «их» естественно указывает на ранее названные изделия.
- source_word: חֲגוֹר
  choice: пояса
  rationale: Существительное обозначает предмет, которым опоясываются; «пояса» — ясный современный эквивалент, при этом возможны и кушаки.
- source_word: נָתְנָה
  choice: поставляет
  rationale: Буквально «даёт», но торговый контекст указывает на передачу товара торговцу; «поставляет» естественно выражает эту деловую функцию.
- source_word: לַכְּנַעֲנִי
  choice: торговцу
  rationale: Буквально «ханаанею», однако в данном торговом контексте этноним, вероятно, употреблён в значении «торговец».
