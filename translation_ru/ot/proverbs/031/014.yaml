  text: הָ֭יְתָה כָּ/אֳנִיּ֣וֹת סוֹחֵ֑ר מִ֝/מֶּרְחָ֗ק תָּבִ֥יא לַחְמָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/014.yaml
  text: She is like merchant ships[a]; from far away she brings her food.
translation:
  language: ru
  text: 'Она — как торговые корабли: издалека привозит себе пищу.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свой хлеб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: Она —
  rationale: Перфект 3-го лица женского рода от היה в контексте назидательной поэзии описывает постоянное, характерное свойство; по-русски это естественно передаётся настоящим временем с нулевой связкой.
- source_word: כָּאֳנִיּוֹת סוֹחֵר
  choice: как торговые корабли
  rationale: כְּ вводит сравнение, אֳנִיּוֹת означает «корабли», а סוֹחֵר указывает на торговлю; сочетание естественно передаётся как «торговые корабли».
- source_word: מִמֶּרְחָק
  choice: издалека
  rationale: Сочетание מִן с מֶרְחָק обозначает происхождение или доставку из далёкого места; «издалека» кратко и естественно сохраняет этот смысл.
- source_word: תָּבִיא
  choice: привозит
  rationale: Hiphil от בוא означает «приносить, доставлять». Рядом с образом кораблей «привозит» звучит естественно и передаёт доставку припасов.
- source_word: לַחְמָהּ
  choice: себе пищу
  rationale: לֶחֶם буквально означает «хлеб», но также употребляется шире в значении пищи или пропитания. Возвратное «себе» естественно передаёт женский притяжательный суффикс в данном контексте.
