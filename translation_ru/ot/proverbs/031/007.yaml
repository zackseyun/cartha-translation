translation:
  language: ru
  text: Пусть он выпьет, забудет свою бедность и больше не вспомнит о своих невзгодах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о своём труде»; еврейское слово может означать тяжёлый труд, тяготы, бедствие или страдание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁתֶּה
  choice: Пусть он выпьет
  rationale: Форма имперфекта в контексте продолжает побудительно-разрешительное высказывание предыдущего стиха; конструкция «пусть он выпьет» естественно передаёт этот оттенок.
- source_word: וְיִשְׁכַּח
  choice: и забудет
  rationale: Союз с имперфектом продолжает последовательность со значением ожидаемого результата или цели, не делая значение цели более явным, чем в еврейском тексте.
- source_word: רִישׁוֹ
  choice: свою бедность
  rationale: רִישׁ обозначает бедность, нужду, обнищание; «бедность» — прямой и понятный русский эквивалент.
- source_word: וַעֲמָלוֹ
  choice: о своём горе
  rationale: עָמָל охватывает труд, тяготы, бедствие и страдание. В контексте забвения тяжёлого положения слово «горе» естественно передаёт широкий переживаемый смысл, не ограничивая его физическим трудом.
- source_word: לֹא יִזְכָּר עוֹד
  choice: больше не вспоминает
  rationale: 'Отрицание с עוֹד выражает прекращение действия: «уже не, больше не». Настоящая форма в русском естественно зависит от «пусть» и сохраняет параллелизм побудительной конструкции.'
