  text: Give her of the fruit of her hands[b][a], and let her works praise her in the gates.
translation:
  language: ru
  text: Дайте ей от плодов её рук, и пусть дела её[b] прославляют её у городских ворот[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в воротах». Городские ворота в древнем Израиле были местом суда, общественных собраний и публичного признания.'
    reason: cultural_note
  - marker: b
    text: 'Или: «деяния её»; в еврейском тексте её дела олицетворены и сами свидетельствуют о её достоинстве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ לָהּ מִפְּרִי יָדֶיהָ
  choice: Дайте ей от плодов её рук
  rationale: Императив תְּנוּ передан прямым повелением «дайте». Предлог מִן сохраняет оттенок доли или источника — ей следует дать от того, что произвёл её труд. Образ «рук» сохранён, поскольку он конкретен и понятен по-русски.
- source_word: וִיהַלְלוּהָ
  choice: и пусть … прославляют её
  rationale: Форма имеет волитивный оттенок и продолжает начальное побуждение; конструкция «пусть … прославляют» естественно передаёт это значение.
- source_word: מַעֲשֶׂיהָ
  choice: дела её
  rationale: 'Слово обозначает дела, труды и свершения. «Дела» сохраняет лаконичность и олицетворение: сделанное ею само свидетельствует о её достоинстве.'
- source_word: בַשְּׁעָרִים
  choice: у городских ворот
  rationale: Буквально — «в воротах». В древнем городе ворота были местом общественной жизни, суда и публичного признания; уточнение «городских» делает исторический образ понятным современному читателю, не заменяя его абстрактным выражением.
