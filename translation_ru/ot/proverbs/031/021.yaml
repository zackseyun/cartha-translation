  text: She does not fear snow for her household[a], for all her household are clothed in scarlet.
translation:
  language: ru
  text: 'Она не боится снега за своих домашних,

    ведь все её домашние одеты в алое[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь у всех её домашних двойные одежды». Некоторые понимают еврейское שָׁנִים здесь не как алую ткань, а в значении двойной, многослойной одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: не боится
  rationale: Форма qal imperfect 3-го лица женского рода передаёт устойчивое отсутствие страха или тревоги; настоящее время естественно в данном описании её образа жизни.
- source_word: לְבֵיתָהּ
  choice: за своих домашних
  rationale: בַּיִת может обозначать как дом, так и домочадцев. Здесь речь идёт о людях, о которых она заботится; выражение «за своих домашних» естественно передаёт направленность её беспокойства.
- source_word: מִשָּׁלֶג
  choice: снега
  rationale: Предлог מִן указывает на обстоятельство, вызывающее возможный страх. Русская конструкция «бояться снега за кого-либо» кратко и естественно передаёт смысл.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание, по которому она не боится; «ведь» сохраняет пояснительную связь и хорошо звучит в поэтической строке.
- source_word: לָבֻשׁ
  choice: одеты
  rationale: Формально единственное число согласуется с собирательным «весь её дом», однако по-русски при обозначении всех домочадцев естественно множественное число.
- source_word: שָׁנִים
  choice: в алое
  rationale: Наиболее прямое лексическое понимание — «алая ткань, багряница». Формулировка «одеты в алое» сохраняет образ и не добавляет в основной текст явно не названный вид одежды; возможное понимание как «двойные одежды» вынесено в сноску.
