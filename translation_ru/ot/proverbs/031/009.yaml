  source_fidelity: 'Текст точно передаёт три повеления еврейского оригинала: פְּתַח פִּיךָ — «Открой уста свои», שְׁפָט צֶדֶק — «суди справедливо», וְדִין עָנִי וְאֶבְיוֹן — «защищай дело бедного и нуждающегося». Судебно-правовой оттенок דין сохранён, как и парное обозначение социально уязвимых людей.'
  naturalness: Перевод лаконичен, понятен и соответствует современному литературному русскому с уместным возвышенным библейским оттенком. «Уста свои» — несколько более традиционный порядок слов, но он естественен в афористическом регистре и оправдан сохранением исходного образа. «Защищай дело» допустимо и ясно в юридическом контексте.
  terminology: «Суди справедливо» хорошо передаёт משפט/צדק в данном контексте. «Бедный и нуждающийся» удачно сохраняет различение עני и אביון, не создавая искусственной смысловой дистанции. «Защищай дело» согласуется с правовым значением דין и с английским аудиторским вариантом «plead the cause».
