  text: פְּתַח פִּ֥י/ךָ שְׁפָט צֶ֑דֶק וְ֝/דִ֗ין עָנִ֥י וְ/אֶבְיֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/009.yaml
  text: Open your mouth[a], judge righteously, and plead the cause of the poor and needy.
translation:
  language: ru
  text: Открой уста свои[a], суди справедливо и защищай дело бедного и нуждающегося.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Выступи, суди справедливо и защищай дело бедного и нуждающегося».'
    reason: 'Лексическая альтернатива: буквальное «открой уста» является идиомой, означающей решительно заговорить.'
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: Открой уста свои
  rationale: Сохраняет буквальный образ еврейского выражения и его идиоматический смысл — решительно заговорить в защиту других.
- source_word: שְׁפָט
  choice: суди
  rationale: Кратко и прямо передаёт повелительную форму глагола со значением судебного разбирательства или вынесения решения.
- source_word: צֶדֶק
  choice: справедливо
  rationale: Передаёт наречную функцию существительного «праведность, справедливость» при глаголе «суди» и естественно звучит по-русски.
- source_word: וְדִין
  choice: защищай дело
  rationale: В данном судебном контексте דין обозначает ведение или отстаивание дела; перевод сохраняет правовой смысл и призыв действовать в пользу уязвимых.
- source_word: עָנִי
  choice: бедного
  rationale: В контексте мудрости и правосудия слово обозначает бедного либо угнетённого человека; «бедного» является ясным и прямым соответствием.
- source_word: אֶבְיוֹן
  choice: нуждающегося
  rationale: Передаёт особый оттенок нужды и позволяет сохранить различие между двумя близкими обозначениями социально уязвимых людей.
