source:
  edition: WLC
  text: אֵֽשֶׁת חַ֭יִל מִ֣י יִמְצָ֑א וְ/רָחֹ֖ק מִ/פְּנִינִ֣ים מִכְרָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/010.yaml
  text: A wife of noble character—who can find? Her value is far beyond jewels[a][b][c].
translation:
  language: ru
  text: Добродетельную жену — кто найдёт? Её ценность намного выше драгоценностей[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Добродетельную женщину»; еврейское слово может обозначать женщину вообще, хотя семейный контекст говорит в пользу перевода «жену».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское פְּנִינִים можно также перевести как «жемчуг»; традиционно переводится и как «рубины», но точный вид драгоценности неизвестен.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Она стоит намного больше драгоценностей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת
  choice: жену
  rationale: Конструктивная форма אִשָּׁה допускает значение «женщина», но семейно-бытовой контекст следующего описания поддерживает значение «жена».
- source_word: חַיִל
  choice: добродетельную
  rationale: חַיִל объединяет оттенки силы, достоинства, способности и нравственной состоятельности. «Добродетельную» естественно и ёмко передаёт характеристику образцовой жены, хотя не исчерпывает оттенка деятельной силы.
- source_word: מִי יִמְצָא
  choice: кто найдёт?
  rationale: Имперфект в риторическом вопросе подчёркивает редкость такой жены, а не просто будущее действие.
- source_word: וְרָחֹק
  choice: намного выше
  rationale: Буквально речь идёт о том, что цена или ценность «далека от» драгоценностей; по-русски сравнительное превосходство естественно выражается словами «намного выше».
- source_word: פְּנִינִים
  choice: драгоценностей
  rationale: Точный вид ценного камня или материала остаётся неясным; обобщённое «драгоценности» не создаёт ложной определённости.
- source_word: מִכְרָהּ
  choice: её ценность
  rationale: Существительное обозначает цену или оценочную стоимость. «Ценность» сохраняет сравнение и не придаёт высказыванию излишне торгового оттенка.
