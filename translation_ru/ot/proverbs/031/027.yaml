  text: צ֭וֹפִיָּה הֲלִיכ֣וֹת בֵּיתָ֑/הּ וְ/לֶ֥חֶם עַ֝צְל֗וּת לֹ֣א תֹאכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/027.yaml
  text: She watches over the ways of her household[b][a], and does not eat the bread of idleness.
translation:
  language: ru
  text: Она наблюдает за делами своего дома[a] и не ест хлеба праздности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за хождениями (или путями) своего дома»; то есть за ходом домашней жизни и домашними делами.'
    reason: lexical_alternative
  - marker: b
    text: «Есть хлеб праздности» — образное выражение, означающее жить в лености и бездеятельности.
    reason: cultural_note
lexical_decisions:
- source_word: צ֭וֹפִיָּה
  choice: следит
  rationale: Причастие породы qal женского рода выражает постоянное внимательное наблюдение; «следит» естественно передаёт привычное и деятельное попечение.
- source_word: הֲלִיכוֹת
  choice: укладом
  rationale: Буквально существительное обозначает «хождения, пути»; применительно к дому речь идёт о ходе и порядке домашней жизни. «Уклад» сохраняет образ общего образа жизни без неестественного буквального выражения.
- source_word: בֵּיתָהּ
  choice: своего дома
  rationale: בַּיִת может обозначать как дом, так и домочадцев. В сочетании с «укладом» русское «своего дома» охватывает домашнюю жизнь и хозяйство, не исключая людей.
- source_word: לֶחֶם
  choice: хлеба
  rationale: Сохранён буквальный образ хлеба как того, чем человек питается и живёт.
- source_word: עַצְלוּת
  choice: праздности
  rationale: Слово обозначает леность, бездеятельность. «Праздность» образует в русском dignified и понятное метафорическое сочетание «хлеб праздности».
- source_word: לֹא תֹאכֵל
  choice: не ест
  rationale: Имперфект в контексте описывает характерное, постоянное поведение, поэтому настоящее время точнее простого будущего.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и образа «хлеба праздности». Формулировка понятна широкому читателю и не привносит конфессионального толкования.
