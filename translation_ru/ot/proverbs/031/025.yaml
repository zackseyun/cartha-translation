base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/025.yaml
  text: Strength and dignity are her clothing[a], and she laughs at the days to come.
translation:
  language: ru
  text: Сила и достоинство — её одежда, и она смеётся, глядя в будущее.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она смеётся над будущим»; буквально: «она смеётся в связи с последующим (или последним) днём».'
    reason: Сноска отмечает контекстуальный смысл будущего и сохраняет возможные буквальные значения слова אַחֲרוֹן («последующий», «последний»), не навязывая эсхатологическое толкование.
lexical_decisions:
- source_word: עֹז
  choice: сила
  rationale: Существительное обозначает силу или мощь; «сила» здесь естественно описывает внутреннюю стойкость женщины.
- source_word: הָדָר
  choice: достоинство
  rationale: Слово может означать великолепие, величие, честь или достойный облик. В данном описании «достоинство» передаёт благородство без неуместного оттенка царской пышности.
- source_word: לְבוּשָׁהּ
  choice: её одежда
  rationale: 'Сохранена метафора одежды: сила и достоинство представлены как то, во что женщина облачена.'
- source_word: וַתִּשְׂחַק
  choice: она смеётся
  rationale: Глагол буквально и образно означает «смеяться». Такое прочтение сохраняет яркий образ бесстрашия и уверенности, не смягчая его до «улыбается».
- source_word: לְיוֹם אַחֲרוֹן
  choice: над грядущим днём
  rationale: Буквально выражение указывает на последующий, позднейший или последний день. «Грядущий день» сохраняет единственное число и естественно передаёт направленность в будущее, не навязывая эсхатологического смысла.
theological_decisions:
- issue: Возможный эсхатологический смысл слова אַחֲרוֹן
  choice: «грядущий день» как образ будущего в контексте житейской мудрости
  alternative: «последний день» в эсхатологическом смысле
  rationale: Ближайший контекст говорит о предусмотрительности и уверенности женщины перед будущим. Однако значение «последний» лексически возможно, поэтому оно не исключено молча, а отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, достоинственной формулировкой. Тире подчёркивает именную метафору; буквальный глагол «смеётся» сохранён ради выразительности еврейского текста.
