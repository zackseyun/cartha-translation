lexical_decisions:
- source_word: חָגְרָה
  choice: препоясывает
  rationale: Глагол буквально обозначает опоясывание или подпоясывание и сохраняет конкретный образ готовности к деятельному труду; настоящее время соответствует характеру изречения.
- source_word: בְעֹז
  choice: силой
  rationale: Существительное обозначает силу или мощь, а предлог выражает средство или то, чем она словно опоясывается.
- source_word: מָתְנֶיהָ
  choice: свой стан
  rationale: Еврейское слово указывает на область поясницы и талии. «Стан» сохраняет телесный образ и звучит достойно в русском поэтическом контексте, хотя несколько возвышенно.
- source_word: וַתְּאַמֵּץ
  choice: укрепляет
  rationale: Форма породы пиэль передаёт придание силы, укрепление; русский глагол естественно выражает это значение.
- source_word: זְרֹעוֹתֶיהָ
  choice: свои руки
  rationale: Слово обозначает руки как орудие силы и труда; «руки» здесь естественнее более узкого «предплечья».
