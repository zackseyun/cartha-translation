    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Она встаёт
  rationale: Форма wayyiqtol в поэтическом описании передана настоящим временем, естественным для характеристики её постоянных действий.
- source_word: בְּעוֹד לַיְלָה
  choice: ещё ночью
  rationale: 'Сохраняет буквальный смысл: она встаёт, когда всё ещё ночь, не уточняя время как «до рассвета».'
- source_word: וַתִּתֵּן
  choice: раздаёт
  rationale: נתן буквально означает «давать»; в сочетании с пищей и долей русское «раздаёт» естественно выражает распределение среди домашних и служанок.
- source_word: טֶרֶף
  choice: пищу
  rationale: Хотя слово может означать «добычу», здесь домашний контекст указывает на пищу или провизию.
- source_word: לְבֵיתָהּ
  choice: своим домашним
  rationale: בַּיִת обозначает здесь не здание, а людей, составляющих её дом; «домашним» ясно передаёт этот смысл.
- source_word: וְחֹק
  choice: положенную долю
  rationale: חֹק может обозначать установленную, назначенную долю. Это сохраняет идею предписанного удела и соответствует параллелизму с пищей.
- source_word: לְנַעֲרֹתֶיהָ
  choice: служанкам
  rationale: В данном домашнем контексте נַעֲרוֹת — молодые женщины, находящиеся у неё в услужении; «служанки» звучит ясно и литературно.
