  text: מַרְבַדִּ֥ים עָֽשְׂתָה לָּ֑/הּ שֵׁ֖שׁ וְ/אַרְגָּמָ֣ן לְבוּשָֽׁ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/022.yaml
  text: She makes coverings for herself[a]; fine linen and purple are her clothing.
translation:
  language: ru
  text: Она делает себе покрывала[a]; тонкий лён и пурпур — её одежда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постельные покрывала»; возможно также: «ковры». Еврейское слово имеет широкое значение и обозначает расстилаемые тканые изделия, вероятно дорогие предметы домашнего убранства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: покрывала
  rationale: Существительное во множественном числе обозначает расстилаемые текстильные изделия, вероятно дорогие домашние или постельные покрытия. «Покрывала» естественно по-русски и не связывает слово непременно с настенными тканями.
- source_word: עָשְׂתָה
  choice: делает
  rationale: Перфект в поэтическом описании выражает характерное, обычное действие женщины; настоящее время естественно передаёт этот смысл.
- source_word: לָּהּ
  choice: себе
  rationale: Предлог с местоименным суффиксом указывает на предназначение или пользу; «себе» передаёт изготовление для собственного употребления.
- source_word: שֵׁשׁ
  choice: тонкий лён
  rationale: Слово обозначает высококачественную льняную ткань; «тонкий лён» сохраняет оттенок ценности и изысканности.
- source_word: אַרְגָּמָן
  choice: пурпур
  rationale: Слово обозначает пурпурную ткань или пурпурную окраску, связанную с достатком и достоинством; в параллели с одеждой краткое «пурпур» звучит естественно.
- source_word: לְבוּשָׁהּ
  choice: её одежда
  rationale: Собирательное существительное обозначает её одеяние в целом, а не обязательно один предмет одежды.
