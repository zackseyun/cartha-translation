lexical_decisions:
- source_word: פֶּן
  choice: иначе
  rationale: Передаёт предупреждение о нежелательном результате и естественно связывает стих с предшествующим запретом.
- source_word: יִשְׁתֶּה
  choice: выпив
  rationale: Деепричастие естественно выражает действие, вследствие которого правитель может забыть установленное и исказить правосудие.
- source_word: וְיִשְׁכַּח
  choice: забудет
  rationale: Прямо передаёт обычное значение глагола שׁכח и сохраняет предупредительный характер высказывания.
- source_word: מְחֻקָּק
  choice: установленное
  rationale: Субстантивированное прилагательное сохраняет значение предписанного или установленного, не сужая его до одного лишь писаного закона.
- source_word: וִישַׁנֶּה
  choice: исказит
  rationale: В судебном контексте порода Piel глагола שנה обозначает неправомерное изменение; «исказит» передаёт эту отрицательную правовую оценку.
- source_word: דִּין
  choice: правосудие
  rationale: В контексте обязанностей правителя слово относится к справедливому судебному разбирательству и защите законных прав.
- source_word: כָּל
  choice: всех
  rationale: Сохраняет всеохватный смысл еврейского квантификатора.
- source_word: בְּנֵי עֹנִי
  choice: угнетённых
  rationale: Еврейская идиома буквально означает «сыны страдания» и обозначает людей, терпящих бедствие, нужду или притеснение; «угнетённых» естественно звучит по-русски и подходит к судебному контексту.
