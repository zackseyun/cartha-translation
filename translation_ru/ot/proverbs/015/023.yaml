  yaml_path: translation/ot/proverbs/015/023.yaml
  text: A man has joy in the answer of his mouth[b][a], and a word in its time—how good it is!
translation:
  language: ru
  text: 'Радость человеку от ответа из его уст,[a]

    и слово, сказанное в своё время, — как хорошо![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Радость человеку — в ответе из его уст». Возможен также перевод: «Человеку радостен ответ из его уст».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и слово в своё время — как хорошо!»; выражение может обозначать слово, произнесённое в подходящий момент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה לָאִישׁ
  choice: Радость человеку
  rationale: 'Именная конструкция с ל передаёт принадлежность или пользу: ответ приносит человеку радость. Формулировка сохраняет лаконичность и порядок еврейского изречения.'
- source_word: בְּמַעֲנֵה פִיו
  choice: ответ его уст
  rationale: מַעֲנֶה означает «ответ, отклик», а פִיו буквально — «его рта». Русское «уст» естественно для возвышенной поэтической речи и сохраняет телесный образ оригинала без тяжеловесного «ответ его рта».
- source_word: וְדָבָר
  choice: и слово
  rationale: В параллелизме с «ответом» דָבָר обозначает произнесённое слово или высказывание, а не дело или обстоятельство.
- source_word: בְּעִתּוֹ
  choice: сказанное вовремя
  rationale: Буквально выражение значит «в своё время»; в контексте речи оно указывает на своевременное слово. Добавленное «сказанное» делает связь естественной по-русски, не устраняя возможного оттенка уместности.
- source_word: מַה־טּוֹב
  choice: как хорошо!
  rationale: Экспрессивная конструкция передаёт восхищённую оценку; русское восклицание близко воспроизводит её силу.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением краткого поэтического параллелизма. «Уст» придаёт строке достоинство и естественно звучит в библейской поэзии; синтаксис первой половины намеренно несколько афористичен, чтобы не разрешать однозначно компактную еврейскую конструкцию.
