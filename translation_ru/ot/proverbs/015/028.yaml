  text: The heart of the righteous considers how to answer[a], but the mouth of the wicked pours out evil things.
translation:
  language: ru
  text: Сердце праведного обдумывает, как ответить[a], а уста нечестивых извергают зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «размышляет, прежде чем ответить». Еврейский глагол может означать раздумье или вдумчивое размышление; более буквально: «обдумывает, чтобы ответить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: В древнееврейской литературе мудрости «сердце» обозначает внутреннего человека, включая мышление и рассуждение; перевод сохраняет исходный образ и естественен по-русски.
- source_word: צַדִּיק
  choice: праведного
  rationale: Субстантивированное прилагательное обозначает типичного праведного человека; родительный падеж обусловлен конструкцией «сердце праведного».
- source_word: יֶהְגֶּה
  choice: обдумывает
  rationale: Глагол может означать размышление, раздумье или тихое проговаривание; в сочетании с инфинитивом «ответить» здесь уместен смысл осмотрительного размышления перед ответом.
- source_word: לַעֲנוֹת
  choice: как ответить
  rationale: Инфинитив с ל выражает направленность размышления на предстоящий ответ. «Как ответить» естественно передаёт это по-русски, не уточняя содержание ответа.
- source_word: וּפִי
  choice: а уста
  rationale: Союз ו в антитетическом параллелизме передаёт противопоставление; русское «а» сохраняет контраст без излишнего усиления.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе обозначает класс нечестивых людей и согласуется с «уста» в конструкции принадлежности.
- source_word: יַבִּיעַ
  choice: извергают
  rationale: Глагол выражает образ бурного истечения или выбрасывания наружу; «извергают» передаёт резкость и неконтролируемость злой речи.
- source_word: רָעוֹת
  choice: зло
  rationale: Форма множественного числа может обозначать злые или пагубные вещи и высказывания. Собирательное русское «зло» звучит естественно и сохраняет широту значения.
