  text: Whoever ignores discipline despises himself, but he who listens to reproof gains understanding.
translation:
  language: ru
  text: Кто отвергает наставление, тот презирает самого себя, а кто слушает обличение, тот обретает разум.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приобретает сердце»; то есть становится разумным, обретает понимание.'
    reason: Поясняет древнееврейскую метафору קֹנֶה לֵּב, которая при буквальном переводе была бы неясна современному русскому читателю.
lexical_decisions:
- source_word: פּוֹרֵעַ מוּסָר
  choice: отвергает наставление
  rationale: פּוֹרֵעַ здесь означает пренебрегать или отвергать, а מוּסָר — воспитывающее наставление, исправление или дисциплину. Сочетание «отвергает наставление» естественно по-русски и передаёт волевой характер отказа.
- source_word: מוֹאֵס נַפְשׁוֹ
  choice: презирает самого себя
  rationale: נֶפֶשׁ в данном контексте обозначает самого человека, его собственную жизнь или личность; буквальное «свою душу» могло бы неоправданно сузить смысл до нематериальной части человека.
- source_word: שׁוֹמֵעַ תּוֹכַחַת
  choice: слушает обличение
  rationale: שׁמע подразумевает не только слышание, но и внимательное принятие, а תּוֹכַחַת — исправляющее обличение или укор.
- source_word: קֹנֶה לֵּב
  choice: обретает разум
  rationale: Буквально выражение означает «приобретает сердце»; в древнееврейской антропологии сердце здесь является средоточием разумения и рассудительности. «Обретает разум» передаёт идиоматический смысл, сохраняя идею приобретения.
theological_decisions:
- issue: Значение נַפְשׁוֹ
  choice: самого себя
  alternative: свою душу / свою жизнь
  rationale: Контекст говорит о вреде, который человек причиняет себе, отвергая исправление; перевод не вводит позднейшее противопоставление души и тела.
- issue: Метафора «приобретает сердце»
  choice: обретает разум с пояснением в сноске
  alternative: приобретает сердце
  rationale: В русском буквальная форма не выражает ясно древнееврейскую мысль. Смысл передан в тексте, а исходная метафора сохранена в примечании без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная конструкция сохраняет афористичность притчи. «Наставление» и «обличение» передают два близких, но не полностью тождественных вида исправления.
