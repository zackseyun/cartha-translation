  text: מְֽאוֹר עֵ֭ינַיִם יְשַׂמַּֽח לֵ֑ב שְׁמוּעָ֥ה ט֝וֹבָ֗ה תְּדַשֶּׁן עָֽצֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/030.yaml
  text: The light of the eyes gladdens the heart[b][a]; good news fattens the bones.
translation:
  language: ru
  text: Свет в глазах[a] радует сердце, а добрая весть укрепляет кости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сияющий взгляд». Древнееврейское выражение буквально означает «свет глаз» и может указывать на светлый, радостный вид человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «утучняет кость»; это образ глубокого телесного укрепления, жизненной силы и освежения.'
    reason: cultural_note
lexical_decisions:
- source_word: מְאוֹר עֵינַיִם
  choice: свет в глазах
  rationale: Сохраняет конкретный образ света и глаз, оставаясь естественным для современного русского языка. Выражение может обозначать сияющий, радостный взгляд, но перевод не сводит его только к этому толкованию.
- source_word: יְשַׂמַּח לֵב
  choice: радует сердце
  rationale: 'Передаёт каузативное значение формы глагола: свет в глазах вызывает радость. «Сердце» сохраняет древнееврейский образ внутреннего человека.'
- source_word: שְׁמוּעָה טוֹבָה
  choice: добрая весть
  rationale: Естественное и точное русское соответствие для благоприятного сообщения или хорошей новости; достоинство пословицы сохраняется без архаизации.
- source_word: תְּדַשֶּׁן עָצֶם
  choice: укрепляет кости
  rationale: Передаёт идиоматический смысл глубокой телесной бодрости и восстановления. Буквальный образ «утучняет кость» в современном русском звучит неясно, поэтому он сохранён в примечании.
theological_decisions: []
