  text: בְּֽ/כָל מָ֭קוֹם עֵינֵ֣י יְהוָ֑ה צֹ֝פ֗וֹת רָעִ֥ים ו/טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/003.yaml
  text: In every place the eyes of Yahweh watch over the evil and the good[a].
translation:
  language: ru
  text: Повсюду глаза Яхве наблюдают за злыми и добрыми[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское имя: «Яхве» (YHWH); традиционный перевод — «Господь».'
    reason: Указывает традиционный вариант передачи тетраграмматона.
lexical_decisions:
- source_word: בְּכָל מָקוֹם
  choice: На всяком месте
  rationale: Сохраняет распределительное значение еврейского выражения и его лаконичную форму; оборот естественен для литературного русского языка.
- source_word: עֵינֵי יְהוָה
  choice: глаза Яхве
  rationale: Передаёт конструкцию принадлежности и сохраняет антропоморфный образ оригинала; «глаза» понятнее современному читателю, чем архаичное «очи».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, непосредственно представленное тетраграмматоном, а не заменяет его титулом.
- source_word: צֹפוֹת
  choice: наблюдают за
  rationale: Причастная форма выражает продолжающееся наблюдение. Русское «наблюдают за» естественно передаёт этот смысл, не добавляя оттенка охраны или покровительства.
- source_word: רָעִים וְטוֹבִים
  choice: злыми и добрыми
  rationale: Прилагательные употреблены субстантивно и обозначают людей. Краткая симметричная пара сохраняет ёмкость еврейской пословицы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация сохраняет это имя, тогда как «Господь» представляет традиционную замену титулом.
- issue: Характер действия צֹפוֹת
  choice: наблюдают за
  alternative: хранят / присматривают за
  rationale: Контекст говорит о всеохватывающем видении как злых, так и добрых; перевод не должен необоснованно придавать глаголу исключительно благожелательный смысл охраны.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Сохранён образ глаз, но избегнуто архаичное «очи».
