source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה מַחְשְׁב֣וֹת רָ֑ע וּ֝/טְהֹרִ֗ים אִמְרֵי נֹֽעַם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/026.yaml
  text: Evil plans are an abomination to Yahweh[b][a], but pleasant words are pure.
translation:
  language: ru
  text: Злые замыслы[a] — мерзость для Яхве, а приятные слова чисты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злые мысли», «дурные намерения» или «злые планы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально порядок слов: «а чисты приятные слова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Сохраняет сильную нравственную оценку еврейского слова и естественно сочетается с оборотом «для Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מַחְשְׁבוֹת רָע
  choice: злые замыслы
  rationale: מַחְשְׁבוֹת может обозначать мысли, намерения, планы или замыслы; в данном контексте «замыслы» естественно выражает целенаправленное внутреннее намерение, не сужая его до уже совершённого поступка.
- source_word: וּטְהֹרִים
  choice: а … чисты
  rationale: Союз передан противительным «а», чтобы отразить антитетический параллелизм; сказуемое согласовано с множественным «слова».
- source_word: אִמְרֵי נֹעַם
  choice: приятные слова
  rationale: Передаёт сочетание буквально и естественно; נֹעַם означает приятность, благозвучие или привлекательность, без обязательного специального богословского оттенка.
- source_word: טְהֹרִים
  choice: чисты
  rationale: Сохраняет образ чистоты и возможный нравственный оттенок, не подменяя его более узким толкованием вроде «правдивы».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; «Яхве» сохраняет его как имя и соответствует современной научной передаче.
- issue: Характер чистоты приятных слов
  choice: чисты
  alternative: чисты нравственно; безупречны
  rationale: Еврейское טְהֹרִים допускает общее значение чистоты и не уточняет здесь, идёт ли речь исключительно о нравственной чистоте; перевод сохраняет эту смысловую ёмкость.
translation_notes:
  register: Краткий, афористичный строй пословицы сохранён. Тире подчёркивает именную конструкцию первого полустишия; лексика современная, литературная и без архаизации.
