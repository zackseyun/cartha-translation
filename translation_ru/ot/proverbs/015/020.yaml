  text: בֵּ֣ן חָ֭כָם יְשַׂמַּח אָ֑ב וּ/כְסִ֥יל אָ֝דָ֗ם בּוֹזֶ֥ה אִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/020.yaml
  text: A wise son brings joy to his father[a], but a foolish man despises his mother.
translation:
  language: ru
  text: 'Мудрый сын радует отца,

    а глупый человек презирает свою мать.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּן חָכָם
  choice: мудрый сын
  rationale: Сохраняется единственное число и мужской род еврейского выражения; «мудрый» передаёт практическую и нравственную мудрость в контексте Притч.
- source_word: יְשַׂמַּח
  choice: радует
  rationale: Порода пиэль выражает причинение радости; русский переходный глагол «радует» передаёт это кратко и естественно.
- source_word: אָב
  choice: отца
  rationale: В русском языке при обозначении родства притяжательное местоимение здесь не обязательно; связь с сыном ясна из контекста.
- source_word: כְסִיל אָדָם
  choice: глупый человек
  rationale: כְסִיל обозначает нравственно несмысленного, упрямого глупца, а אָדָם — отдельного человека. Формулировка сохраняет атрибутивную конструкцию оригинала, не превращая её в отвлечённое обозначение человечества.
- source_word: בּוֹזֶה
  choice: презирает
  rationale: Причастие описывает характерное поведение; настоящее время русского глагола естественно выражает эту обобщённую характеристику.
- source_word: אִמּוֹ
  choice: свою мать
  rationale: Суффикс третьего лица передан возвратным притяжательным местоимением «свою», нормативным при совпадении обладателя с подлежащим.
theological_decisions: []
translation_notes:
  register: 'Краткий, афористичный параллелизм сохранён. Лексика современная и литературная; «презирает» удерживает нравственную силу еврейского בּוֹזֶה. Вторая строка передаёт אָדָם как «человек»: в русском это естественное обозначение отдельного лица и не устраняет мужской референт, уже заданный параллелью с сыном.'
