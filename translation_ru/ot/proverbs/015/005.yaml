  text: אֱוִ֗יל יִ֭נְאַץ מוּסַ֣ר אָבִ֑י/ו וְ/שֹׁמֵ֖ר תּוֹכַ֣חַת יַעְרִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/005.yaml
  text: A fool despises his father's discipline[a], but whoever heeds reproof is prudent.
translation:
  language: ru
  text: Глупец презирает наставление отца, а кто принимает обличение, тот становится благоразумным.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а кто хранит обличение, тот поступает рассудительно». Еврейский глагол, переведённый как «принимает», буквально означает «хранит» или «соблюдает»; последний глагол может означать «становится благоразумным» или «проявляет проницательность».'
    reason: Лексические варианты глаголов וְשֹׁמֵר и יַעְרִם сохраняют подлинную смысловую неоднозначность еврейского текста.
lexical_decisions:
- source_word: אֱוִיל
  choice: глупец
  rationale: В литературе мудрости это нравственно и практически неразумный человек, а не просто человек с недостатком ума; «глупец» сохраняет ёмкость и категоричность противопоставления.
- source_word: יִנְאַץ
  choice: презирает
  rationale: Глагол выражает презрительное отвержение, а не простое несогласие; «презирает» передаёт как внутреннее пренебрежение, так и практическое неприятие.
- source_word: מוּסַר
  choice: наставление
  rationale: Слово охватывает воспитание, обучение и исправительную дисциплину. В сочетании с отцом «наставление» звучит естественно по-русски и не сужает смысл до наказания.
- source_word: אָבִיו
  choice: отца
  rationale: Еврейский текст прямо называет отца, поэтому родовое обозначение сохранено без нейтрализации.
- source_word: וְשֹׁמֵר
  choice: а кто принимает
  rationale: Буквально причастие означает «хранящий, соблюдающий». В отношении обличения оно подразумевает внимательное принятие и следование ему; «принимает» естественно передаёт эту деятельную отзывчивость.
- source_word: תּוֹכַחַת
  choice: обличение
  rationale: Существительное обозначает словесное указание на проступок, укор или исправление; «обличение» соответствует возвышенному, но понятному регистру Притч.
- source_word: יַעְרִם
  choice: становится благоразумным
  rationale: Глагол может означать приобретение или проявление рассудительности, проницательности. Формулировка «становится благоразумным» сохраняет результативный оттенок формы и не придаёт отрицательного смысла хитрости.
theological_decisions:
- issue: Гендерно маркированное обозначение родителя
  choice: наставление отца
  alternative: наставление родителя
  rationale: В еврейском тексте прямо назван отец; перевод сохраняет эту конкретность и не заменяет её гендерно нейтральным обозначением.
- issue: Характер благоразумия во второй строке
  choice: становится благоразумным
  alternative: поступает рассудительно / проявляет проницательность
  rationale: Еврейский глагол допускает оттенки приобретения и проявления благоразумия. Основной текст передаёт возможный результат принятия обличения, а примечание сохраняет смысловую широту.
translation_notes:
  register: Современный литературный русский с краткой, афористичной структурой. Слова «глупец», «обличение» и «благоразумный» поддерживают достоинство жанра мудрости, оставаясь понятными обычному читателю. Союз «а» естественно выражает контраст двух строк.
