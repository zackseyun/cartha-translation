lexical_decisions:
- source_word: טוֹב מְעַט
  choice: Лучше малое
  rationale: В сравнительной пословице טוֹב имеет значение «лучше»; субстантивированное «малое» кратко и естественно противопоставлено большому богатству.
- source_word: בְּיִרְאַת יְהוָה
  choice: при страхе перед Яхве
  rationale: Предлог ב выражает сопутствующее обстоятельство. Формулировка «страх перед Яхве» сохраняет ключевое для литературы мудрости выражение, не сводя его только к ужасу или только к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией тетраграмматона, а не заменяет его титулом.
- source_word: מֵאוֹצָר רָב
  choice: чем большое сокровище
  rationale: מִן образует сравнение, אוֹצָר обозначает сокровище или накопленное богатство, а רָב — его значительность или изобилие.
- source_word: וּמְהוּמָה בוֹ
  choice: а при нём — смятение
  rationale: Союз вводит сопутствующую отрицательную сторону богатства; מְהוּמָה допускает значения смятения, беспорядка и тревоги, а בוֹ естественно соотносится с сокровищем.
theological_decisions:
- issue: Значение выражения «страх перед Яхве» в литературе мудрости
  choice: Сохранено буквальное богословски значимое выражение «страх перед Яхве»
  alternative: «благоговение перед Яхве»
  rationale: Исходное выражение включает благоговение и верность Богу, но его замена одним истолковывающим словом сузила бы смысл и ослабила межтекстовые связи в Притчах.
translation_notes:
  register: Краткая, ритмичная форма современной литературной русской пословицы. Сохранены противопоставление «малое — большое сокровище», личное имя Яхве и многозначность заключительного существительного.
