  source_fidelity: «Суровое наказание — тому, кто оставляет путь; кто ненавидит обличение, умрёт» точно передаёт двучленную структуру еврейского изречения. מוּסָר передано в его исправительно-карательном контексте как «наказание», רָע — как «суровое», а יָמוּת сохранено прямым «умрёт» без интерпретирующего уточнения характера смерти. Формула «тому, кто оставляет путь» адекватно выражает לְעֹזֵב אֹרַח и не превращает образ пути в толкование.
  naturalness: Текст звучит естественно в современном литературном русском и сохраняет лаконичный афористический регистр Притч. Тире в первой строке уместно для именной конструкции; параллельное «кто…» во второй строке ясно и ритмически убедительно.
