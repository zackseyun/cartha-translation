id: PRO.15.10
reference: Proverbs 15:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מוּסָ֣ר רָ֭ע לְ/עֹזֵ֣ב אֹ֑רַח שׂוֹנֵ֖א תוֹכַ֣חַת יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
translation:
  language: ru
  text: Суровое[a] наказание — тому, кто оставляет путь[b]; кто ненавидит обличение, умрёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тяжёлое». Еврейское слово может также означать «плохое» или «злое», но здесь, вероятнее всего, указывает на болезненную строгость наказания.'
    reason: lexical_alternative
  - marker: b
    text: То есть нравственный путь, жизненное направление человека.
    reason: metaphor_clarification
lexical_decisions:
- source_word: מוּסָר
  choice: наказание
  rationale: Слово обозначает наставление через исправление, дисциплинарное воздействие или наказание. В сочетании с רָע и в параллели с отвержением обличения здесь особенно заметен болезненный исправительный смысл; «наказание» ясно и естественно передаёт его по-русски, хотя не исчерпывает всего диапазона слова.
- source_word: רָע
  choice: суровое
  rationale: Основные значения прилагательного — «плохой», «злой», «бедственный». Здесь оно, вероятнее всего, характеризует наказание как тяжёлое и болезненное, а не как нравственно злое; «суровое» естественно выражает эту силу контекста.
- source_word: לְעֹזֵב
  choice: тому, кто оставляет
  rationale: Предлог לְ указывает, кому предназначено или к кому относится наказание, а причастие עֹזֵב описывает человека по характерному действию. Формулировка сохраняет обобщённый характер изречения.
- source_word: אֹרַח
  choice: путь
  rationale: В литературе мудрости это обычная метафора нравственного направления и образа жизни. «Путь» сохраняет метафору и звучит естественно в современном русском языке.
- source_word: שׂוֹנֵא
  choice: кто ненавидит
  rationale: Причастие употреблено обобщённо и обозначает всякого, кому свойственно ненавидеть обличение.
- source_word: תוֹכַחַת
  choice: обличение
  rationale: Слово означает словесное указание на ошибку, укор или исправляющее порицание. «Обличение» сохраняет отличие от более широкого מוּסָר и соответствует возвышенному, но понятному регистру притчи.
- source_word: יָמוּת
  choice: умрёт
  rationale: Глагол מות прямо означает смерть; форма выражает закономерный будущий результат в изречении общего характера. Перевод не уточняет вид или смысл смерти сверх сказанного в еврейском тексте.
theological_decisions:
- issue: Характер обещанного наказания
  choice: Сохранено общее «наказание» без уточнения, является ли оно непосредственной карой, исправительной мерой или жизненным последствием.
  alternative: «вразумление», «кара» или развёрнутое толкование характера наказания
  rationale: מוּסָר включает как исправительное наставление, так и дисциплинарное наказание. Контекст усиливает суровый аспект, но не позволяет полностью устранить исправительный оттенок.
- issue: Смысл смерти во второй строке
  choice: 'Передано прямо: «умрёт».'
  alternative: «погибнет», «придёт к гибели» или уточнение физической, духовной либо окончательной смерти
  rationale: מות не уточняет здесь природу смерти. Прямой перевод сохраняет богословскую и смысловую напряжённость, не сводя предупреждение к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Тире передаёт именную конструкцию первой строки без добавления отсутствующего в источнике глагола. Лексика сохраняет достоинство библейской мудрости, оставаясь понятной обычному читателю.
