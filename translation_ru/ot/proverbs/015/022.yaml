  text: הָפֵ֣ר מַ֭חֲשָׁבוֹת בְּ/אֵ֣ין ס֑וֹד וּ/בְ/רֹ֖ב יוֹעֲצִ֣ים תָּקֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/022.yaml
  text: Plans fail for lack of counsel[a], but with many advisers they stand.
translation:
  language: ru
  text: 'Без совета замыслы рушатся,

    а при множестве советников утверждаются.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Без обсуждения замыслы расстраиваются, а при множестве советников утверждаются».'
    reason: 'Лексические значения הָפֵר и סוֹד допускают более формальную передачу: «расстраиваются» и «обсуждение».'
lexical_decisions:
- source_word: הָפֵר
  choice: рушатся
  rationale: Форма от פרר передаёт срыв или разрушение замыслов. «Рушатся» естественно по-русски выражает итоговый смысл, не уточняя внешнего деятеля.
- source_word: מַחֲשָׁבוֹת
  choice: замыслы
  rationale: В контексте совета речь идёт не просто о мыслях, а о намерениях и обдуманных планах; «замыслы» сохраняет широту значения и звучит по-пословичному.
- source_word: בְּאֵין
  choice: без
  rationale: Краткое «без» точно передаёт отсутствие и позволяет читателю воспринимать как обстоятельственный, так и причинный оттенок.
- source_word: סוֹד
  choice: совета
  rationale: סוֹד может обозначать доверительное обсуждение, совещание или совет. Контраст с множеством советников указывает здесь на совместное обсуждение и совет, а не на тайну.
- source_word: וּבְרֹב
  choice: а при множестве
  rationale: Союз выражает противопоставление между двумя строками, а רֹב — многочисленность; формулировка сохраняет афористический параллелизм.
- source_word: יוֹעֲצִים
  choice: советников
  rationale: Причастие от יעץ обозначает тех, кто даёт совет; «советники» — точный и понятный современный эквивалент.
- source_word: תָּקוּם
  choice: осуществляются
  rationale: קום здесь означает, что замысел утверждается, устоит или состоится. «Осуществляются» естественно сочетается с «замыслами» и передаёт их успешное воплощение, тогда как буквальное «встают» по-русски неясно.
