  text: A gentle answer turns away wrath[a], but a painful word stirs up anger.
translation:
  language: ru
  text: Кроткий ответ отвращает ярость, а обидное слово[a] возбуждает гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово, причиняющее боль»; возможно также: «резкое слово». Еврейское выражение буквально означает «слово боли (или огорчения)» и может описывать речь, которая ранит и тем самым вызывает гнев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲנֶה
  choice: ответ
  rationale: Существительное обозначает ответ или отклик на сказанное; «ответ» естественно и кратко передаёт смысл словесного обмена.
- source_word: רַךְ
  choice: кроткий
  rationale: Прилагательное означает «мягкий, кроткий». В данном контексте «кроткий» ясно характеризует спокойную, незлобивую манеру ответа и сохраняет достоинство афористического стиля.
- source_word: יָשִׁיב
  choice: отвращает
  rationale: Каузативная форма глагола שוב означает «поворачивает назад, отводит». «Отвращает» естественно сочетается с «яростью» и передаёт прекращение или отведение гнева.
- source_word: חֵמָה
  choice: ярость
  rationale: Слово обозначает сильный, словно пылающий гнев; «ярость» сохраняет его интенсивность и отличает от более общего אָף во второй строке.
- source_word: דְבַר
  choice: слово
  rationale: В сочетании с עֶצֶב речь идёт о произнесённом слове или высказывании; «слово» кратко и уместно для пословичного параллелизма.
- source_word: עֶצֶב
  choice: обидное
  rationale: Существительное связано с болью и огорчением и здесь описывает слово, причиняющее душевную боль. «Обидное» естественно по-русски передаёт причиняемую речью боль, не сводя смысл исключительно к резкому тону.
- source_word: יַעֲלֶה
  choice: возбуждает
  rationale: Каузативная форма עלה буквально означает «заставляет подняться»; применительно к гневу «возбуждает» передаёт пробуждение и усиление чувства.
- source_word: אָף
  choice: гнев
  rationale: Хотя исходное значение связано с носом, слово устойчиво употребляется в значении гнева; «гнев» прямо и естественно передаёт идиому.
