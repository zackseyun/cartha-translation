source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֲבַ֣ת יְהוָ֑ה וּ/תְפִלַּ֖ת יְשָׁרִ֣ים רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/008.yaml
  text: The sacrifice of the wicked is an abomination to Yahweh[a], but the prayer of the upright is his delight.
translation:
  language: ru
  text: Жертва нечестивых — мерзость для Яхве, а молитва праведных угодна Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радует Его»; или: «принимается Им с благоволением». Еврейское слово может выражать удовольствие, благоволение или принятие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: жертва
  rationale: Передаёт жертвенное приношение в широком смысле и естественно противопоставляется молитве.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Кратко и естественно обозначает людей, виновных в нравственном зле, сохраняя обобщённый характер притчи.
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Сохраняет сильную нравственно-религиозную оценку еврейского слова и резкий контраст со второй частью стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: תְפִלַּת
  choice: молитва
  rationale: Сохраняет единственное число с обобщающим значением, характерным для притчи.
- source_word: יְשָׁרִים
  choice: праведных
  rationale: В данном нравственном контексте естественно обозначает людей, идущих прямым путём; буквальное «прямых» по-русски было бы неясным.
- source_word: רְצוֹנוֹ
  choice: угодна Ему
  rationale: Естественно передаёт возможные значения благоволения, удовольствия и принятия, не сужая их до одного эмоционального оттенка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблено личное имя Бога; транслитерация сохраняет это различие.
- issue: Смысл רְצוֹנוֹ во второй части
  choice: угодна Ему
  alternative: Его отрада; вызывает Его благоволение
  rationale: Еврейское именное предложение допускает оттенки удовольствия, благоволения и принятия. Основной текст сохраняет эту смысловую широту, а примечание отмечает варианты.
translation_notes:
  register: Современный литературный русский язык с краткостью и параллелизмом, свойственными притче. Тире подчёркивает две подразумеваемые связки еврейского именного предложения; во второй части связка передана глагольной конструкцией ради естественности.
