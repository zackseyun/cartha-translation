source:
  edition: WLC
  text: ט֤וֹב אֲרֻחַ֣ת יָ֭רָק וְ/אַהֲבָה שָׁ֑ם מִ/שּׁ֥וֹר אָ֝ב֗וּס וְ/שִׂנְאָה בֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/017.yaml
  text: Better is a meal of vegetables where there is love than a fattened ox with hatred[a][b].
translation:
  language: ru
  text: Лучше овощная трапеза там, где любовь, чем откормленный бык[a] там, где ненависть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бык из стойла»; еврейское выражение может подчёркивать либо стойловое кормление, либо его результат — упитанность животного.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и ненависть в нём». Вероятно, речь идёт о трапезе или доме, где царит ненависть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: В сравнительной конструкции с מִן слово означает «лучше… чем…»; краткая форма естественна для русской пословицы.
- source_word: אֲרֻחַת יָרָק
  choice: овощная трапеза
  rationale: אֲרֻחָה обозначает трапезу или приём пищи, а יָרָק — съедобную зелень либо овощи. Выражение передаёт скромную домашнюю еду и сохраняет возвышенно-простой регистр.
- source_word: וְאַהֲבָה שָׁם
  choice: там, где любовь
  rationale: 'Буквально: «и любовь там». Русская конструкция естественно передаёт местное значение שָׁם и характеризует обстановку трапезы.'
- source_word: שׁוֹר אָבוּס
  choice: откормленный бык
  rationale: שׁוֹר — «бык, вол», а אָבוּס указывает на стойловое содержание или достигнутую благодаря ему упитанность. Основной текст выражает результат — богатое мясное угощение; формальная альтернатива вынесена в примечание.
- source_word: וְשִׂנְאָה בוֹ
  choice: там, где ненависть
  rationale: Естественная русская формулировка сохраняет параллелизм с первой половиной стиха. Буквальное «и ненависть в нём» и неоднозначность референта местоимения отмечены в примечании.
theological_decisions:
- issue: К чему относится местоимение в выражении וְשִׂנְאָה בוֹ
  choice: 'В основном тексте передать обстановку трапезы: «там, где ненависть»'
  alternative: «и ненависть в нём» или «и при нём ненависть»
  rationale: Еврейский мужской суффикс допускает грамматическую связь с быком, но по смыслу ненависть характеризует трапезу или дом. Перевод не превращает ненависть в свойство животного, а примечание сохраняет буквальную форму и её неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким пословичным строем. «Трапеза» выбрана как понятное и достойное по регистру обозначение совместного приёма пищи; симметрия «там, где любовь… там, где ненависть» делает противопоставление ясным, не устраняя исходную неоднозначность, отмеченную в сноске.
