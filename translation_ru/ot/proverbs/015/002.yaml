  text: לְשׁ֣וֹן חֲ֭כָמִים תֵּיטִ֣יב דָּ֑עַת וּ/פִ֥י כְ֝סִילִ֗ים יַבִּ֥יעַ אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/002.yaml
  text: The tongue of the wise makes knowledge good[b][a], but the mouth of fools pours out folly.
translation:
  language: ru
  text: Язык мудрых умело преподносит знание[a], а уста глупцов изливают глупость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хорошо распоряжается знанием», «украшает знание» или «делает знание привлекательным». Еврейский глагол буквально выражает значение «делать хорошим» и может указывать как на полезное применение знания, так и на умелое его изложение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «извергают» либо «выплёскивают». Еврейский глагол рисует образ чего-то обильно льющегося или бьющего ключом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן
  choice: язык
  rationale: Сохраняется конкретный образ органа речи и параллелизм с «устами» во второй части стиха.
- source_word: חֲכָמִים
  choice: мудрых
  rationale: Субстантивированное прилагательное во множественном числе обозначает целую категорию людей без ненужного уточнения пола.
- source_word: תֵּיטִיב דָּעַת
  choice: умело преподносит знание
  rationale: 'Так передаётся каузативное значение глагола יטב («делать хорошим») в естественной русской форме: мудрая речь хорошо и с пользой представляет знание. Возможная широта смысла сохранена в примечании.'
- source_word: דָּעַת
  choice: знание
  rationale: Обычное значение слова в литературе мудрости; оно сохраняет смысловой контраст с глупостью.
- source_word: וּפִי
  choice: а уста
  rationale: Союз передан как противительный ввиду резкого контраста между двумя строками; «уста» сохраняют телесный образ и соответствуют возвышенному, но понятному регистру притчи.
- source_word: כְסִילִים
  choice: глупцов
  rationale: Передаёт устойчивую нравственно-интеллектуальную категорию книги Притч без внесения дополнительных оттенков.
- source_word: יַבִּיעַ
  choice: изливают
  rationale: Глагол изображает обильное истечение или бурное вырывание наружу; «изливают» естественно сохраняет этот образ в сочетании с «устами».
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Естественный современный русский эквивалент абстрактного обозначения безрассудства, характерного для глупца.
theological_decisions: []
