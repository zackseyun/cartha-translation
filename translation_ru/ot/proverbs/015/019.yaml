  choice: путь
  rationale: Сохраняет обычную для Притч метафору образа жизни и поведения, не сводя её к буквальной дороге.
- source_word: עָצֵל
  choice: ленивого
  rationale: Передаёт человека, для которого лень стала устойчивой чертой; форма родительного падежа естественно сочетается со словом «путь».
- source_word: כִּמְשֻׂכַת חָדֶק
  choice: словно терновая изгородь
  rationale: Сохраняет выраженное частицей כִּ сравнение и конкретный образ преграды из колючего кустарника.
- source_word: אֹרַח
  choice: дорога
  rationale: Сохраняет дорожную метафору и даёт естественную вариативность по отношению к דֶּרֶךְ.
- source_word: יְשָׁרִים
  choice: честных
  rationale: Передаёт нравственную прямоту людей современным и понятным русским словом, не усиливая значение до более специального богословского термина «праведные».
- source_word: סְלֻלָה
  choice: проложенный путь
  rationale: 'Передаёт результат подготовки дороги: она устроена и свободна для движения. В сноске сохранены возможные оттенки насыпанной, ровной или гладкой дороги.'
