source:
  edition: WLC
  text: לֵ֣ב שָׂ֭מֵחַ יֵיטִ֣ב פָּנִ֑ים וּ/בְ/עַצְּבַת לֵ֝ב ר֣וּחַ נְכֵאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/013.yaml
  text: A joyful heart makes the face cheerful[b][a], but by the sorrow of the heart the spirit is crushed.
translation:
  language: ru
  text: Радостное сердце озаряет лицо[a], а от сердечной скорби дух сокрушён[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делает лицо хорошим»; то есть радость изменяет выражение лица, делает его светлее.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дух надломлен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: В книге Притчей слово обозначает внутреннего человека, включая чувства и расположение; «сердце» естественно сохраняет образ и параллель с «духом».
- source_word: שָׂמֵחַ
  choice: радостное
  rationale: Передаёт устойчивое состояние радости ясным современным словом, подходящим для общего изречения мудрости.
- source_word: יֵיטִב פָּנִים
  choice: озаряет лицо
  rationale: Буквально оборот означает «делает лицо хорошим»; русский идиоматический перевод передаёт, как внутренняя радость проявляется во внешнем облике.
- source_word: וּבְעַצְּבַת לֵב
  choice: а от сердечной скорби
  rationale: Союз выражает противопоставление, а предлог בְּ допускает причинное значение. «Сердечная скорбь» естественно передаёт скорбь, переживаемую внутри человека.
- source_word: רוּחַ
  choice: дух
  rationale: Здесь имеется в виду внутренняя жизненная сила и расположение человека, а не буквальное дыхание или ветер.
- source_word: נְכֵאָה
  choice: сокрушён
  rationale: Слово описывает подавленное, надломленное состояние; «сокрушён» сохраняет сильный образ и форму именного сказуемого еврейского текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткостью и параллелизмом, свойственными притче. «Озаряет лицо» звучит естественно и передаёт еврейскую идиому, а «дух сокрушён» сохраняет сильный поэтический образ без конфессионального уточнения.
