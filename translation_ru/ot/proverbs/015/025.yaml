source:
  edition: WLC
  text: בֵּ֣ית גֵּ֭אִים יִסַּ֥ח יְהוָ֑ה וְ֝/יַצֵּ֗ב גְּב֣וּל אַלְמָנָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/025.yaml
  text: Yahweh tears down the house of the proud[b][a], but he sets firm the boundary of the widow.
translation:
  language: ru
  text: Дом гордых Яхве разрушит[a], а межу вдовы утвердит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искоренит дом гордых». Еврейский глагол может означать не только разрушение, но и удаление, вырывание с корнем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утвердит границу владения вдовы». Образ указывает на защиту её земельных и имущественных прав.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: дом
  rationale: Сохраняет конкретный образ и одновременно допускает более широкий смысл дома как семьи и владения.
- source_word: גֵּאִים
  choice: гордых
  rationale: Передаёт нравственно отрицательный смысл надменности и естественно звучит в языке литературы мудрости.
- source_word: יִסַּח
  choice: разрушит
  rationale: В сочетании с «домом» естественно передаёт действие удаления или отрывания; возможный оттенок искоренения отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְיַצֵּב
  choice: а … утвердит
  rationale: Глагол означает сделать прочным или устойчивым; союз «а» выражает антитетический параллелизм без чрезмерного усиления противопоставления.
- source_word: גְּבוּל
  choice: межу
  rationale: В данном контексте речь идёт о границе земельного владения; «межа» конкретно и естественно передаёт этот правовой образ.
- source_word: אַלְמָנָה
  choice: вдовы
  rationale: Сохраняет единственное число с типичным, собирательно-представительным значением уязвимой социальной группы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Значение союза ו перед יַצֵּב
  choice: а
  alternative: и; но
  rationale: Формально союз может означать «и», однако параллелизм противопоставляет суд над гордыми защите вдовы. Русское «а» естественно сохраняет это противопоставление, не делая его резче оригинала.
translation_notes:
  register: Современный литературный русский язык с краткой афористичностью притчи. Инверсия сохраняет параллельную структуру и выделяет контраст между домом гордых и межой вдовы.
