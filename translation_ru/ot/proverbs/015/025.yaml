  source_fidelity: 'Текст точно передаёт еврейскую конструкцию и антитетический параллелизм: «дом гордых» соответствует בֵּית גֵּאִים, «Яхве» корректно передаёт יהוה, «разрушит» адекватно передаёт יִסַּח в сочетании с «домом», а «межу вдовы утвердит» передаёт וְיַצֵּב גְּבוּל אַלְמָנָה. Союз «а» естественно выражает контраст, не навязывая более сильное противопоставление, чем допускает וְ.'
