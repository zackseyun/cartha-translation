  text: בֵּ֣ית צַ֭דִּיק חֹ֣סֶן רָ֑ב וּ/בִ/תְבוּאַ֖ת רָשָׁ֣ע נֶעְכָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/006.yaml
  text: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
translation:
  language: ru
  text: В доме праведника — большое богатство, а доход[a] нечестивого оборачивается бедой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «урожай», «плоды» или «выручка».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «терпит ущерб», «приходит в расстройство» или «гибнет»; еврейский глагол может обозначать беду, смятение или разорение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית צַדִּיק
  choice: в доме праведника
  rationale: Сохраняет конкретный образ дома и родительный конструктивный оборот; «дом» здесь может включать хозяйство и имущество праведного человека.
- source_word: חֹסֶן רָב
  choice: большое богатство
  rationale: חֹסֶן обозначает богатство, сокровище или материальные ресурсы, а רָב указывает на их обилие. Выражение естественно по-русски и соответствует экономическому контрасту второй строки.
- source_word: וּבִתְבוּאַת
  choice: а доход
  rationale: Союз передаёт противопоставление. תְבוּאָה буквально может означать урожай или произведённый продукт, а шире — прибыль, выручку, доход; в современном русском «доход» ясно выражает экономический смысл, не исключая буквальных вариантов, отмеченных в сноске.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Передаёт субстантивированное прилагательное в родительном падеже и сохраняет традиционный нравственный контраст с «праведником».
- source_word: נֶעְכָּרֶת
  choice: оборачивается бедой
  rationale: Форма от עכר выражает причинение или переживание беды, смятения, ущерба либо разорения. Такая передача звучит естественно и сохраняет отрицательный итог дохода нечестивого, тогда как возможный более пассивный оттенок указан в сноске.
theological_decisions:
- issue: Характер связи между нечестием и материальным результатом
  choice: Не уточнять, является ли беда нравственным последствием, внутренней тревогой или материальным разорением.
  alternative: Передать однозначно как «не приносит пользы», «разоряется» или «приносит Божье наказание».
  rationale: Еврейский глагол допускает бедствие, смятение и разрушение, но сам стих не определяет точный механизм и не называет непосредственного деятеля.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Тире в первой половине естественно передаёт отсутствующую в еврейском связку. Формулировка сохраняет образ дома, экономический контраст и смысловую широту заключительного глагола.
