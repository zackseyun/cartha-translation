  text: The path of life leads upward for the prudent, so that he may turn away from Sheol below.
translation:
  language: ru
  text: Путь жизни ведёт разумного вверх, чтобы он отвернулся от Шеола[a] внизу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — древнееврейское обозначение мира мёртвых.
    reason: Поясняет термин שְׁאוֹל, не отождествляя его с позднейшими представлениями об аде.
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: путь жизни
  rationale: Прямо передаёт устойчивый образ жизненного пути, ведущего к жизни.
- source_word: לְמַשְׂכִּיל
  choice: мудрого
  rationale: Причастие обозначает человека рассудительного, поступающего с пониманием; «мудрого» естественно в русском контексте книги Притч.
- source_word: שְׁאוֹל
  choice: преисподняя
  rationale: Сохраняет обозначение мира мёртвых и пространственную противоположность «вверх — внизу», не сужая смысл до позднейшего представления об аде.
- source_word: סוּר
  choice: удалялся
  rationale: Передаёт уклонение и отход прочь; несовершенный вид естественно выражает направленность жизненного пути.
theological_decisions:
- issue: Целевая или результативная связь לְמַעַן
  choice: чтобы
  alternative: так что
  rationale: לְמַעַן обычно вводит цель; перевод сохраняет целевую направленность, не утверждая механической неизбежности результата.
- issue: Пространственное противопоставление жизни и шеола
  choice: вверх / внизу
  alternative: к высотам / в глубине
  rationale: Сохранена намеренная вертикальная антитеза еврейского текста без дополнительного истолкования как прямого указания на небеса и ад.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма и параллель «вверх — внизу» сохранены. «Преисподняя» употреблена в библейском смысле мира мёртвых.
