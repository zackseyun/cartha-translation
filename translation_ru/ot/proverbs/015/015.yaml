source:
  edition: WLC
  text: כָּל יְמֵ֣י עָנִ֣י רָעִ֑ים וְ/טֽוֹב לֵ֝֗ב מִשְׁתֶּ֥ה תָמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/015.yaml
  text: All the days of the afflicted are bad[b][a], but a cheerful heart is a continual feast.
translation:
  language: ru
  text: Все дни страдальца тяжки[a], а у кого сердце весело — у того всегда пир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедняка»; еврейское слово может обозначать бедного, несчастного или угнетённого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: Все дни
  rationale: Сохраняет еврейский образ множества дней и естественно передаёт охват всей жизни, не заменяя его пояснительным словом «жизнь».
- source_word: עָנִי
  choice: страдальца
  rationale: Передаёт широкое значение человека, терпящего бедствие или нужду, не ограничивая смысл только материальной бедностью или угнетением.
- source_word: רָעִים
  choice: тяжки
  rationale: В данном контексте описывает тягостное качество дней; русское «злы» звучало бы преимущественно нравственно, а буквальное «плохи» менее достойно по регистру.
- source_word: וְטוֹב לֵב
  choice: а у кого сердце весело
  rationale: Передаёт идиому о внутреннем радостном расположении и сохраняет образ сердца. Конструкция с «а» естественно выражает противопоставление.
- source_word: מִשְׁתֶּה תָמִיד
  choice: у того всегда пир
  rationale: Сохраняет метафору постоянного пира и естественно выражает в русском предикативную связь, подразумеваемую еврейским именным предложением.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с кратким, афористичным ритмом. Сохранено противопоставление внешней тяготы и внутреннего расположения; добавленная по нормам русского языка конструкция «у кого… у того…» не устраняет смысловой напряжённости оригинала.
