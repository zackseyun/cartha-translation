  text: לֵ֣ב נָ֭בוֹן יְבַקֶּשׁ דָּ֑עַת ו/פני כְ֝סִילִ֗ים יִרְעֶ֥ה אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/014.yaml
  text: The heart of the discerning seeks knowledge[a], but the face of fools feeds on folly.
translation:
  language: ru
  text: 'Сердце разумного ищет знания,

    а уста глупцов питаются глупостью.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «а лицо глупцов питается глупостью». «Уста» передают вероятный смысл образа в связи с глаголом «питаться».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет еврейский образ внутреннего человека, включающий разум, волю и желания.
- source_word: נָבוֹן
  choice: разумного
  rationale: Передаёт способность понимать и различать; естественно звучит в современной русской речи и в контексте литературы мудрости.
- source_word: יְבַקֶּשׁ
  choice: ищет
  rationale: Кратко и точно выражает целенаправленное стремление.
- source_word: דָּעַת
  choice: знания
  rationale: Обычное значение слова в контексте Притч; родительный падеж естественно следует за глаголом «ищет».
- source_word: וּפְנֵי
  choice: уста
  rationale: Масоретский текст буквально говорит «лицо (лица)», однако «уста» передают вероятную метонимию и делают образ питания понятным; буквальная форма отмечена в сноске.
- source_word: כְסִילִים
  choice: глупцов
  rationale: Сохраняет характерную для Притч нравственно-интеллектуальную категорию, а не просто бытовое оскорбление.
- source_word: יִרְעֶה
  choice: питаются
  rationale: Передаёт образ кормления или выпаса и согласуется во множественном числе с «устами» как грамматическим подлежащим в русском.
- source_word: אִוֶּלֶת
  choice: глупостью
  rationale: Стандартно передаёт противоположность мудрости и сохраняет повтор корня «глуп-» с обозначением глупцов.
