  text: אִ֣ישׁ חֵ֭מָה יְגָרֶ֣ה מָד֑וֹן וְ/אֶ֥רֶך אַ֝פַּ֗יִם יַשְׁקִ֥יט רִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/018.yaml
  text: A hot-tempered man stirs up strife[c][b][a], but one who is slow to anger quiets a dispute.
translation:
  language: ru
  text: Вспыльчивый человек разжигает раздор, а тот, кто не спешит гневаться[a], унимает ссору.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «долгий ноздрями»; еврейская идиома о человеке, который медленно приходит в гнев.'
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ חֵמָה
  choice: вспыльчивый человек
  rationale: Буквально сочетание означает «человек гнева» и характеризует устойчивый тип поведения. «Вспыльчивый человек» естественно передаёт этот смысл по-русски, сохраняя указание на человека в мужском роде как в еврейском тексте.
- source_word: יְגָרֶה
  choice: разжигает
  rationale: Порода пиэль глагола גרה означает возбуждать, подстрекать, раздувать. «Разжигает» образно и естественно сочетается с конфликтом.
- source_word: מָדוֹן
  choice: распрю
  rationale: Слово обозначает раздор, распрю или препирательство. «Распря» сохраняет обобщённый характер изречения и не привносит судебного оттенка.
- source_word: אֶרֶך אַפַּיִם
  choice: тот, кто не спешит гневаться
  rationale: Еврейская идиома буквально описывает человека как «долгого ноздрями» и означает медленную, сдержанную реакцию гнева. Выбранная формулировка ясно и естественно передаёт её смысл.
- source_word: יַשְׁקִיט
  choice: унимает
  rationale: Каузативная форма глагола שקט означает заставить утихнуть, успокоить. «Унимает» сохраняет активную роль сдержанного человека и хорошо сочетается со словом «ссора».
- source_word: רִיב
  choice: ссору
  rationale: Существительное может означать спор, ссору, тяжбу или конфликт. В данном общем житейском контексте «ссора» передаёт межличностный смысл, не сужая его до судебного разбирательства.
