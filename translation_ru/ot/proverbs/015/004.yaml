  text: מַרְפֵּ֣א לָ֭שׁוֹן עֵ֣ץ חַיִּ֑ים וְ/סֶ֥לֶף בָּ֝֗/הּ שֶׁ֣בֶר בְּ/רֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/004.yaml
  text: A healing tongue is a tree of life[b][a], but perverseness in it is a breaking of the spirit.
translation:
  language: ru
  text: Язык, приносящий исцеление, — дерево жизни[a], а кривизна в нём — надлом духа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Целительный язык — дерево жизни»; מַרְפֵּא может означать исцеление, здоровье или целительное действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «а извращённость в нём — сокрушение духа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְפֵּא
  choice: приносящий исцеление
  rationale: Существительное обозначает исцеление, здоровье или целительное действие. Описательный оборот естественен по-русски и сохраняет конкретный восстановительный смысл, не сводя его только к мягкости речи.
- source_word: לָשׁוֹן
  choice: язык
  rationale: Сохраняется буквальный образ языка как обозначения речи, ясный и привычный для русского читателя.
- source_word: עֵץ חַיִּים
  choice: дерево жизни
  rationale: Формулировка сохраняет устойчивый образ литературы мудрости и его библейские переклички, не отождествляя его принудительно с единственным деревом в Эдеме.
- source_word: סֶלֶף
  choice: извращённость
  rationale: Слово выражает искривление, искажение или порочность речи; «извращённость» передаёт как образ отклонения от прямоты, так и нравственную окраску.
- source_word: בָּהּ
  choice: в нём
  rationale: Местоименный суффикс естественно отнесён к слову «язык»; русский мужской род требует формы «в нём».
- source_word: שֶׁבֶר
  choice: надлом
  rationale: Слово означает перелом, разрушение или крушение. «Надлом» сохраняет предметную метафору и естественно описывает внутреннее повреждение человека.
- source_word: בְּרוּחַ
  choice: духа
  rationale: В данном контексте רוּחַ обозначает внутренний дух человека. Родительный оборот «надлом духа» краток и идиоматичен.
theological_decisions:
- issue: К чему относится רוּחַ
  choice: человеческий дух, внутренняя жизнь человека
  alternative: Божественный Дух
  rationale: Противопоставление целительной и извращённой речи описывает их воздействие на человека; контекст не указывает на Святого Духа.
- issue: Характер связи во второй половине стиха
  choice: 'Сохранена именная метафора: «извращённость… — надлом духа»'
  alternative: 'Глагольное следствие: «извращённость… надламывает дух»'
  rationale: Именная конструкция ближе к сжатой форме еврейской пословицы и не уточняет сверх текста, является ли «надлом» действием, результатом или характеристикой.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого параллелизма пословицы и образов «языка», «дерева жизни» и внутреннего «надлома». Оборот «приносящий исцеление» выбран вместо менее естественного «целительный язык» и смыслово более узкого «кроткий язык».
