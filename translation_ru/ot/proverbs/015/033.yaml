  text: יִרְאַ֣ת יְ֭הוָה מוּסַ֣ר חָכְמָ֑ה וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/033.yaml
  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
translation:
  language: ru
  text: Страх перед Яхве — наставление в мудрости[a], и смирение предшествует чести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «наставление», может также означать исправляющее наставление или дисциплину.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: страх перед Яхве
  rationale: Сохранено сильное и многозначное слово «страх», которое в литературе мудрости включает благоговение и трепет, но не сводится к более мягкому «почитанию». Имя יְהוָה передано как «Яхве».
- source_word: מוּסַר
  choice: наставление
  rationale: В Притчах слово обозначает формирующее наставление, которое может включать воспитание, исправление и дисциплину. «Наставление» естественно звучит по-русски, а более строгий оттенок отмечен в сноске.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычный и контекстуально точный эквивалент ключевого понятия книги Притчей.
- source_word: וְלִפְנֵי
  choice: и … предшествует
  rationale: Предлог выражает временное или логическое предшествование; глагольная формулировка естественно передаёт по-русски безглагольную еврейскую строку.
- source_word: כָבוֹד
  choice: честь
  rationale: В данном контексте речь идёт о почёте и высоком положении, поэтому «честь» точнее русского «слава».
- source_word: עֲנָוָה
  choice: смирение
  rationale: Передаёт качество кроткой непритязательности или приниженности; причинная связь с последующей честью не добавляется, поскольку в еврейском тексте прямо выражено лишь предшествование.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно употреблено собственное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Характер страха перед Яхве
  choice: страх перед Яхве
  alternative: благоговение перед Яхве
  rationale: Более буквальное «страх» сохраняет присущие выражению трепет, благоговение и осознание Божьей власти, не сужая смысл до одного лишь почтения.
translation_notes:
  register: Современный литературный русский язык с краткой афористичной структурой. Параллелизм двух частей сохранён; добавлена только необходимая для естественного русского синтаксиса связка-тире, а во второй части безглагольная конструкция передана глаголом «предшествует».
