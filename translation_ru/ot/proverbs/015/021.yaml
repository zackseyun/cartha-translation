  yaml_path: translation/ot/proverbs/015/021.yaml
  text: Folly is joy to one lacking sense[a], but a man of understanding makes his path straight.
translation:
  language: ru
  text: Глупость — радость для неразумного[a], а разумный человек направляет свой путь прямо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лишённого сердца». В Притчах «сердце» нередко означает разум и способность здраво судить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: Глупость
  rationale: Отвлечённое существительное обозначает глупость как качество и образ действий; краткий русский эквивалент сохраняет афористичность.
- source_word: שִׂמְחָה
  choice: радость
  rationale: 'Именная конструкция передана без добавочного глагола, чтобы сохранить краткость и прямое отождествление: глупость служит такому человеку радостью.'
- source_word: לַחֲסַר לֵב
  choice: для неразумного
  rationale: Буквально «для лишённого сердца»; в языке Притч сердце связано с разумом и способностью здраво судить, поэтому идиома передана естественным русским словом.
- source_word: אִישׁ תְּבוּנָה
  choice: разумный человек
  rationale: Конструкция буквально означает «человек понимания/разумения». Такой перевод естественен по-русски и сохраняет противопоставление неразумному.
- source_word: יְיַשֶׁר
  choice: выпрямляет
  rationale: Порода пиэль от ישר имеет каузативно-интенсивный смысл «делать прямым, выравнивать»; образ сохранён, а не сведён к общему «идёт» или «направляет».
- source_word: לָכֶת
  choice: свой путь
  rationale: Инфинитив «идти, ходить» здесь образно относится к направлению жизни и поведения. Русское «свой путь» естественно выражает этот образ, хотя само слово «путь» в еврейском тексте не названо.
theological_decisions:
- issue: Обобщающее мужское единственное число
  choice: неразумного ... разумный человек
  alternative: неразумного человека ... человека, обладающего пониманием
  rationale: Еврейские формы стоят в мужском единственном числе и имеют обобщающий характер, обычный для литературы мудрости. Русские существительные и прилагательные мужского рода естественно сохраняют эту форму без ограничения смысла только мужчинами.
- issue: Образ выпрямления жизненного пути
  choice: выпрямляет свой путь
  alternative: идёт прямым путём
  rationale: Выбранный вариант сохраняет каузативную силу יְיַשֶׁר и ответственность разумного человека за направление своей жизни, не уточняя богословски, какими средствами это происходит.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Тире передаёт еврейскую именную конструкцию; лексика общеупотребительна и сохраняет образ прямого пути.
