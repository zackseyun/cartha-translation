  text: שִׂפְתֵ֣י חֲ֭כָמִים יְזָ֣רוּ דָ֑עַת וְ/לֵ֖ב כְּסִילִ֣ים לֹא כֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/007.yaml
  text: The lips of the wise spread knowledge[b][a], but the heart of fools is not so.
translation:
  language: ru
  text: Уста мудрых распространяют знание[a], а сердце глупых — не таково[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассеивают знание». Еврейский глагол передаёт образ разбрасывания или рассеивания.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте мысль выражена кратко, буквально: «а сердце глупых — не так». Вероятный смысл состоит в том, что глупые не распространяют знание подобно мудрым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: уста
  rationale: Сохраняет конкретный образ губ как органа речи; «уста» уместно в современной литературной библейской речи и не сводит образ к абстрактным «словам».
- source_word: חֲכָמִים
  choice: мудрых
  rationale: Субстантивированное множественное число обозначает мудрых людей как класс, без необходимости уточнять пол.
- source_word: יְזָרוּ
  choice: распространяют
  rationale: Глагол буквально связан с разбрасыванием или рассеиванием. В сочетании со «знанием» слово «распространяют» естественно передаёт смысл, а исходный образ отмечен в сноске.
- source_word: דָעַת
  choice: знание
  rationale: Прямое и устойчивое соответствие еврейскому термину в литературе мудрости.
- source_word: לֵב
  choice: сердце
  rationale: Сохранён ключевой для литературы мудрости образ внутреннего человека — его мышления, воли и расположения — без сужения до одного лишь «ума».
- source_word: כְּסִילִים
  choice: глупых
  rationale: Передаёт типичное для Притч обозначение нравственно и умственно неразумных людей; форма родительного множественного числа естественно зависит от слова «сердце».
- source_word: לֹא כֵן
  choice: не таково
  rationale: Сохраняет краткость и эллиптичность еврейского выражения, не добавляя прямо не названного действия или качества.
theological_decisions:
- issue: Эллиптическое противопоставление сердца глупых устам мудрых
  choice: Сохранить формулировку «сердце глупых — не таково»
  alternative: «глупые знания не распространяют»
  rationale: 'Альтернатива ясно выражает вероятный смысл, но устраняет намеренную краткость и неоднозначность текста: отрицание может относиться шире к внутреннему состоянию глупых, а не только к их речи.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским словом «уста». Синтаксическая сжатость второй половины сохранена; тире естественно обозначает пропущенную связку.
