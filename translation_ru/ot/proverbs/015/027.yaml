  text: עֹכֵ֣ר בֵּ֭ית/וֹ בּוֹצֵ֣עַ בָּ֑צַע וְ/שׂוֹנֵ֖א מַתָּנֹ֣ת יִחְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/027.yaml
  text: Whoever is greedy for gain troubles his own house[a], but he who hates bribes will live.
translation:
  language: ru
  text: Кто жаден до наживы, навлекает беду на свой дом, а кто ненавидит взятки[a], будет жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дары»; в данном контексте, вероятно, имеются в виду взятки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹכֵר
  choice: навлекает беду
  rationale: Причастие от עכר обозначает причинение беды или несчастья. Выражение «навлекает беду» естественно передаёт причинно-следственный смысл, не усиливая его до полного разорения.
- source_word: בֵּיתוֹ
  choice: на свой дом
  rationale: בַּיִת может означать дом, семью или домочадцев. Русское «свой дом» сохраняет образ оригинала и допускает более широкий смысл — всё домашнее и семейное окружение человека.
- source_word: בּוֹצֵעַ בָּצַע
  choice: жаден до наживы
  rationale: Однокоренная конструкция глагола и существительного подчёркивает корыстное стремление к прибыли, нередко с оттенком неправедного приобретения. «Жаден до наживы» передаёт и алчность, и отрицательную нравственную окраску, не добавляя отдельного определения «нечестной».
- source_word: וְשׂוֹנֵא
  choice: а кто ненавидит
  rationale: Союз וְ может означать «и», но здесь вводит противопоставление между двумя половинами изречения; русское «а» естественно выражает эту антитезу.
- source_word: מַתָּנֹת
  choice: взятки
  rationale: Существительное буквально означает «дары», однако в данном нравственно-правовом контексте речь, вероятнее всего, о подношениях, которыми склоняют человека к неправде, то есть о взятках. Буквальное значение отмечено в сноске.
- source_word: יִחְיֶה
  choice: будет жить
  rationale: Форма от חיה может подразумевать сохранение жизни и благополучие. Буквально-сжатое «будет жить» сохраняет многозначность и афористичность еврейского текста.
