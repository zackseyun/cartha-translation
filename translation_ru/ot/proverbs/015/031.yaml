source:
  edition: WLC
  text: אֹ֗זֶן שֹׁ֭מַעַת תּוֹכַ֣חַת חַיִּ֑ים בְּ/קֶ֖רֶב חֲכָמִ֣ים תָּלִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/031.yaml
  text: An ear that listens to life-giving rebuke will remain among the wise[a][b].
translation:
  language: ru
  text: Ухо, внимающее обличению, ведущему к жизни, пребудет среди мудрых.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально глагол означает «переночует» или «остановится на ночлег»; здесь он, вероятно, образно говорит об устойчивом пребывании среди мудрых.
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение можно также передать как «обличение жизни» или «обличение для жизни». Речь идёт об исправлении, которое ведёт к жизни или сохраняет её.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹזֶן
  choice: ухо
  rationale: 'Сохраняет еврейскую метонимию: восприимчивое ухо представляет человека, готового слушать.'
- source_word: שֹׁמַעַת
  choice: внимающее
  rationale: Причастие выражает не простое восприятие звука, а постоянную готовность прислушиваться и принимать наставление.
- source_word: תּוֹכַחַת
  choice: обличению
  rationale: «Обличение» естественно передаёт нравственное исправление и укор в контексте литературы мудрости.
- source_word: חַיִּים
  choice: ведущему к жизни
  rationale: Формулировка ясно передаёт вероятный смысл сочетания תּוֹכַחַת חַיִּים — исправление, которое ведёт к жизни, не скрывая возможной неоднозначности, отмеченной в сноске.
- source_word: בְּקֶרֶב
  choice: среди
  rationale: Кратко и естественно обозначает пребывание внутри сообщества мудрых.
- source_word: חֲכָמִים
  choice: мудрых
  rationale: Субстантивированное множественное число передано без ненужного указания пола.
- source_word: תָּלִין
  choice: пребудет
  rationale: Глагол буквально означает «переночует, остановится на ночлег», но здесь образно указывает на устойчивое пребывание; «пребудет» сохраняет достоинство и образную ёмкость изречения.
theological_decisions:
- issue: Связь родительного חַיִּים с «обличением»
  choice: обличение, ведущее к жизни
  alternative: обличение жизни / обличение для жизни
  rationale: Еврейское сочетание допускает несколько смысловых отношений. В основном тексте выбран наиболее понятный целевой смысл, а формальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской притчи. Метафора «уха» сохранена; «внимающее» подчёркивает восприимчивость, а не простое слышание. Слово «пребудет» слегка возвышенное, но понятное и уместное в поэтическом афоризме.
