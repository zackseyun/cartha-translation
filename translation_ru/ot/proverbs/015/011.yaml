id: PRO.15.11
reference: Proverbs 15:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שְׁא֣וֹל וַ֭/אֲבַדּוֹן נֶ֣גֶד יְהוָ֑ה אַ֝֗ף כִּֽי לִבּ֥וֹת בְּֽנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/011.yaml
  text: Sheol and Abaddon lie open before Yahweh[b][a]; how much more the hearts of the sons of man.
translation:
  language: ru
  text: Шеол и Аваддон открыты пред Яхве[a]; тем более — сердца сынов человеческих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Погибель». «Аваддон» может означать гибель либо область погибели.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыны человека»; древнееврейское выражение, обозначающее людей вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет особое древнееврейское обозначение мира мёртвых и не сужает его значение до могилы.
- source_word: אֲבַדּוֹן
  choice: Аваддон
  rationale: Транслитерация сохраняет параллель с «Шеолом» и возможную силу названия области погибели; значение «гибель» отмечено в сноске.
- source_word: נֶגֶד
  choice: открыты пред
  rationale: В контексте подразумевается не только нахождение перед Яхве, но и полная доступность Его взору; выражение естественно передаёт этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в древнееврейском тексте.
- source_word: אַף כִּי
  choice: тем более
  rationale: 'Сочетание выражает умозаключение от большего к меньшему: если открыты сокровенные области смерти, то тем более человеческие сердца.'
- source_word: לִבּוֹת
  choice: сердца
  rationale: Сохранён исходный образ сердца как внутреннего мира человека — его мыслей, воли и намерений.
- source_word: בְּנֵי אָדָם
  choice: сыны человеческие
  rationale: Формально передаёт древнееврейский оборот и его собирательное значение; современное пояснение дано в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; его передача сохраняет прямую референцию древнееврейского текста.
- issue: Передача שְׁאוֹל и אֲבַדּוֹן
  choice: Шеол и Аваддон
  alternative: мир мёртвых и погибель
  rationale: Транслитерация не навязывает более узкую доктрину о посмертном состоянии и сохраняет образную пару исходного текста.
- issue: Обобщающий смысл בְּנֵי אָדָם
  choice: сыны человеческие
  alternative: люди
  rationale: Сохранена грамматическая и образная форма оригинала, тогда как её отнесённость ко всем людям разъясняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Форма «пред» поддерживает краткость и достоинство параллелизма; тире делает явным эллиптический переход «тем более [открыты]».
