  text: לֹ֣א יֶאֱהַב לֵ֭ץ הוֹכֵ֣חַֽ ל֑/וֹ אֶל חֲ֝כָמִ֗ים לֹ֣א יֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/012.yaml
  text: A mocker does not love one who corrects him[a]; he will not go to the wise.
translation:
  language: ru
  text: Насмешник не любит того, кто его обличает; к мудрым он не пойдёт.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: насмешник
  rationale: Слово обозначает человека, который презрительно высмеивает и отвергает наставление. «Насмешник» ясно и естественно передаёт этот активный смысл в современном русском языке; «кощунник» было бы уже по значению и могло бы неоправданно придавать слову исключительно религиозный оттенок.
- source_word: יֶאֱהַב
  choice: не любит
  rationale: Сохранено прямое значение обычного глагола «любить» без усиления до «ненавидит» и без ослабления до «не нравится».
- source_word: הוֹכֵחַ לוֹ
  choice: того, кто его обличает
  rationale: Причастие от יכח обозначает человека, указывающего на проступок с целью исправления. «Обличает» сохраняет серьёзность корректирующего воздействия и звучит уместно в литературном русском языке.
- source_word: אֶל חֲכָמִים
  choice: к мудрым
  rationale: Предлог אֶל выражает направленность или приближение, а חֲכָמִים называет мудрых людей как категорию. Субстантивированное «к мудрым» естественно передаёт обобщающий смысл и не ограничивает его только мужчинами.
- source_word: לֹא יֵלֵךְ
  choice: он не пойдёт
  rationale: В данном контексте הלך означает «идти, обращаться к кому-либо». Будущее «не пойдёт» передаёт не только привычное действие, но и намеренный отказ насмешника искать общества или совета мудрых.
theological_decisions:
- issue: Родовое значение חֲכָמִים
  choice: к мудрым
  alternative: к мудрым мужчинам / к мудрецам
  rationale: Хотя еврейская форма грамматически мужского рода и множественного числа, в литературе мудрости она обозначает мудрых людей вообще. Русское «к мудрым» сохраняет категориальный и обобщающий смысл, не вводя отсутствующего в контексте ограничения по полу.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Обличает» сохраняет достоинство и нравственную серьёзность текста, а перестановка местоимения во второй части делает связь с подлежащим ясной и естественной.
