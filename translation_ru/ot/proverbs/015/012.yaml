  source_fidelity: 'Текст точно передаёт обе части еврейского двустишия: לֵץ как «насмешник», отрицание יֶאֱהַב как «не любит», הוֹכֵחַ לוֹ как человека, обличающего его, и отказ идти к мудрым. Будущее «не пойдёт» допустимо для волитивно-привычного оттенка yiqtol в пословице.'
