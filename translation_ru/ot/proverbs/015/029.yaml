source:
  edition: WLC
  text: רָח֣וֹק יְ֭הוָה מֵ/רְשָׁעִ֑ים וּ/תְפִלַּ֖ת צַדִּיקִ֣ים יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/029.yaml
  text: Yahweh is far from the wicked[a], but he hears the prayer of the righteous.
translation:
  language: ru
  text: 'Далёк Яхве от нечестивых,

    но молитву праведных Он слышит.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוֹק
  choice: далёк от
  rationale: Предикативное прилагательное передаёт прежде всего нравственно-реляционную дистанцию, а не пространственную удалённость; русское «далёк от» сохраняет образ и противопоставление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, стоящее в еврейском тексте, транслитерацией, не заменяя его титулом.
- source_word: מֵרְשָׁעִים
  choice: от нечестивых
  rationale: Обозначает людей, отличающихся нравственной порочностью; «нечестивые» — краткое и узнаваемое обозначение этой группы в литературе мудрости.
- source_word: וּתְפִלַּת
  choice: но молитву
  rationale: Простой союз waw в параллелизме выражает смысловое противопоставление; «но» естественно передаёт его по-русски. Винительный «молитву» обусловлен русским управлением глагола «слышит».
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Передаёт людей, характеризуемых праведностью, и сохраняет традиционную для литературы мудрости парную оппозицию «нечестивые — праведные».
- source_word: יִשְׁמָע
  choice: Он слышит
  rationale: Сохраняет прямое значение глагола שמע — «слышать, внимать», не усиливая его до обязательного «отвечает»; местоимение добавлено для естественного русского синтаксиса.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя; «Яхве» прямо его передаёт и не подменяет титулом.
- issue: Смысл удалённости Яхве от нечестивых
  choice: Нравственно-реляционная удалённость, противопоставленная благосклонному вниманию к молитве праведных
  alternative: Пространственное отсутствие Бога или полная неспособность слышать нечестивых
  rationale: Контраст двух строк касается отношения Бога к двум нравственным группам. Перевод сохраняет образ «далёк», не превращая его в метафизическое утверждение об отсутствии или неведении Бога.
- issue: Значение «слышит» применительно к молитве
  choice: Слышит и благосклонно внимает, без явного утверждения об автоматическом исполнении просьбы
  alternative: Всегда отвечает исполнением просимого
  rationale: В контексте молитвы שמע допускает оттенок благосклонного внимания, однако буквальное «слышит» сохраняет смысловую ёмкость еврейского глагола и не устраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью афористического параллелизма. Инверсия «Далёк Яхве» сохраняет ударение исходной строки; прописное «Он» употреблено как уважительное обозначение Бога. Стих не требует сносок, поэтому маркеры в основном тексте отсутствуют.
