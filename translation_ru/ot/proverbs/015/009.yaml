  text: תּוֹעֲבַ֣ת יְ֭הוָה דֶּ֣רֶךְ רָשָׁ֑ע וּ/מְרַדֵּ֖ף צְדָקָ֣ה יֶאֱהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/009.yaml
  text: The way of the wicked is an abomination to Yahweh[b][a], but he loves the one who pursues righteousness.
translation:
  language: ru
  text: Путь нечестивого — мерзость для Яхве[a], но Он любит того, кто стремится к праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога; традиционно переводится как «Господь».
    reason: translation_clarity
  - marker: b
    text: 'Или: «к справедливости»; еврейское слово может обозначать как праведность, так и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Существительное обозначает нечто крайне отвратительное и неприемлемое; «мерзость» сохраняет силу нравственной оценки и привычно для библейского стиля.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Слово сохраняет характерный для литературы мудрости образ жизненного пути, то есть образа поведения.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Форма единственного числа имеет обобщённое значение и описывает человека, чей образ жизни порочен; русский субстантивированный оборот естественно сохраняет это значение.
- source_word: מְרַדֵּף
  choice: того, кто стремится
  rationale: Причастие передаёт устойчивую, деятельную направленность человека. «Стремится» естественно выражает постоянное следование за нравственной целью.
- source_word: צְדָקָה
  choice: праведности
  rationale: В данном контексте слово обозначает нравственную правильность и жизнь согласно должному порядку; «справедливость» также возможно, но несколько сужает смысл.
- source_word: יֶאֱהָב
  choice: Он любит
  rationale: Имперфект выражает общеистинное, характерное действие, поэтому в русской пословичной формулировке уместно настоящее время.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Обобщающее значение форм мужского рода
  choice: нечестивого / того, кто стремится к праведности
  alternative: нечестивого мужчину / мужчину, стремящегося к праведности
  rationale: Грамматически мужской род в афоризме обозначает любого человека соответствующего склада, а не ограничивает высказывание мужчинами.
- issue: Смысл צְדָקָה
  choice: праведность
  alternative: справедливость
  rationale: 'Контекст допускает обе смысловые стороны: нравственную правоту и справедливость. В основном тексте выбрано более широкое «праведность», а возможное прочтение отражено в примечании.'
translation_notes:
  register: Современный литературный русский язык с лаконичным, достоинственным строем притчи. Именная конструкция «мерзость для Яхве» сохраняет силу и синтаксический акцент оригинала; местоимение «Он» делает подразумеваемого во второй строке субъекта ясным без изменения смысла.
