  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וּ/בֹחֵ֖ן לִבּ֣וֹת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/003.yaml
  text: The crucible is for silver[a], and the furnace for gold[b], but Yahweh tests hearts.
translation:
  language: ru
  text: Тигель — для серебра, плавильная печь — для золота, а сердца испытывает Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצְרֵף
  choice: плавильный тигель
  rationale: Слово обозначает сосуд или приспособление для очищения металла. «Плавильный тигель» ясно и естественно передаёт металлургический образ.
- source_word: לַכֶּסֶף
  choice: для серебра
  rationale: Предлог ל указывает на назначение; в обобщённом изречении определённость по-русски не требуется.
- source_word: כּוּר
  choice: печь
  rationale: Имеется в виду печь для плавки или очищения металла. Краткое «печь» сохраняет параллелизм и понятно современному читателю.
- source_word: לַזָּהָב
  choice: для золота
  rationale: Предлог ל выражает назначение, а форма без определённости соответствует обобщённому характеру пословицы.
- source_word: וּבֹחֵן
  choice: а … испытывает
  rationale: Причастие от בחן означает проверять или исследовать, выявляя подлинное качество. «Испытывает» сохраняет связь с образом очищения металлов; союз передан как «а», чтобы естественно выразить сопоставление, не превращая его в жёсткое противопоставление.
- source_word: לִבּוֹת
  choice: сердца
  rationale: В библейском еврейском «сердце» обозначает внутреннего человека, включая мысли, намерения и волю. Буквальный образ сохранён.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон. Форма «Яхве» прямо передаёт божественное имя и не заменяет его титулом.
- issue: Смысл בחן применительно к внутреннему человеку
  choice: сердца испытывает
  alternative: сердца исследует; сердца проверяет
  rationale: «Испытывает» сохраняет метафорическую связь с проверкой и очищением металлов, не сужая смысл до одного лишь психологического исследования или судебной оценки.
- issue: Связь между двумя частями изречения
  choice: а
  alternative: и
  rationale: 'Еврейский ו допускает простое соединение, но контекст создаёт аналогическое сопоставление: металлы проверяются соответствующими средствами, сердца — Яхве. Русское «а» естественно передаёт это сопоставление без усиления до «но».'
translation_notes:
  register: Современный литературный русский язык; лаконичная пословичная структура и параллелизм оригинала сохранены. Инверсия «сердца испытывает Яхве» выделяет объект и завершает строку божественным именем, следуя порядку и риторическому акценту еврейского текста.
