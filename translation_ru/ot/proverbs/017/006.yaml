  variant: modern literary Russian
source:
  edition: WLC
  text: עֲטֶ֣רֶת זְ֭קֵנִים בְּנֵ֣י בָנִ֑ים וְ/תִפְאֶ֖רֶת בָּנִ֣ים אֲבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/006.yaml
  text: Grandchildren are the crown of the aged[b][a], and the glory of children is their fathers.
translation:
  language: ru
  text: Венец стариков — внуки[a], а слава детей — их отцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дети детей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: венец
  rationale: Существительное обозначает венец или корону как образ чести и достоинства. «Венец» естественно звучит в русском изречении и сохраняет метафору.
- source_word: זְקֵנִים
  choice: стариков
  rationale: Здесь речь о пожилых людях, а не о носителях должности старейшин. «Стариков» точно и естественно передаёт это значение в данном контексте.
- source_word: בְּנֵי בָנִים
  choice: внуки
  rationale: Буквально «дети детей»; в контексте это обычное обозначение внуков. Идиоматический перевод делает смысл ясным без утраты содержания.
- source_word: תִפְאֶרֶת
  choice: слава
  rationale: Слово может означать славу, великолепие, красу или честь. «Слава» сохраняет возвышенный стиль и смысловой параллелизм с «венцом».
- source_word: בָּנִים
  choice: детей
  rationale: Хотя форма грамматически мужского рода и может означать «сыновья», в изречении она допускает обобщённое семейное значение «дети».
- source_word: אֲבוֹתָם
  choice: их отцы
  rationale: Еврейский текст прямо говорит об «отцах», а не о родителях вообще; мужской семейный термин сохранён.
theological_decisions:
- issue: Гендерно маркированные семейные термины в общем изречении
  choice: Передать בָּנִים как «дети», но אֲבוֹתָם как «их отцы».
  alternative: Передать оба термина более буквально как «сыновья» и «их отцы» либо обобщить вторую часть до «дети» и «их родители».
  rationale: Изречение в целом описывает честь семьи между поколениями. בָּנִים может иметь обобщённое значение, тогда как אֲבוֹתָם прямо обозначает отцов; выбранный вариант сохраняет эту смысловую асимметрию, не сглаживая её.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным строем пословицы. Синтаксический параллелизм оригинала сохранён; «стариков» не следует понимать как должностное обозначение старейшин.
