  text: יֹלֵ֣ד כְּ֭סִיל לְ/ת֣וּגָה ל֑/וֹ וְ/לֹֽא יִ֝שְׂמַ֗ח אֲבִ֣י נָבָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/021.yaml
  text: He who fathers a fool does so to his own grief[b][a], and the father of a fool has no joy.
translation:
  language: ru
  text: Кто породил глупца — тому горе; и не радуется отец негодяя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «негодяй», обозначает нравственно низкого, постыдного человека, а не просто человека, которому недостаёт ума.
    reason: cultural_note
lexical_decisions:
- source_word: יֹלֵד
  choice: Кто породил
  rationale: Субстантивированное причастие Qal означает «тот, кто рождает/порождает». Параллель с «отцом» во второй строке указывает на отцовство; «породил» сохраняет краткость и афористичность.
- source_word: כְּסִיל
  choice: глупца
  rationale: Обычный термин литературы мудрости для человека, упорно неразумного как в нравственном, так и в умственном отношении; «глупец» является естественным и устойчивым русским соответствием.
- source_word: לְתוּגָה לוֹ
  choice: тому горе
  rationale: 'Компактно передаёт результат: рождение такого сына оборачивается горем для породившего его. Указательное «тому» соотнесено с первой частью «кто».'
- source_word: וְלֹא יִשְׂמַח
  choice: и не радуется
  rationale: Имперфект имеет общеистинный, пословичный смысл. Настоящее время естественно выражает эту общую закономерность.
- source_word: אֲבִי
  choice: отец
  rationale: 'Конструктивная форма связывает слово со следующим существительным: «отец негодяя».'
- source_word: נָבָל
  choice: негодяя
  rationale: נבל обозначает нравственно низкого, постыдного человека, а не только интеллектуально ограниченного. «Негодяй» сохраняет этическую окраску и отличие от כסיל.
theological_decisions: []
