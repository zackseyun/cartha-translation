  text: בְּ/כָל עֵ֭ת אֹהֵ֣ב הָ/רֵ֑עַ וְ/אָ֥ח לְ֝/צָרָ֗ה יִוָּלֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/017.yaml
  text: A friend loves at all times[a], and a brother is born for adversity.
translation:
  language: ru
  text: Друг любит во всякое время, а брат рождается для беды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכָל עֵת
  choice: во всякое время
  rationale: Сочетание предлога בְּ с כָּל и עֵת выражает всеохватность времени. Формулировка сохраняет краткость и возвышенно-пословичный строй оригинала, не ослабляя утверждение до общего «обычно».
- source_word: אֹהֵב
  choice: любит
  rationale: Причастие породы qal обозначает характерное, постоянное действие; простое настоящее время естественно передаёт этот обобщённый смысл.
- source_word: הָרֵעַ
  choice: друг
  rationale: Хотя существительное снабжено артиклем, в пословице оно обозначает тип лица. «Друг» здесь естественнее, чем пространственно-социальное «ближний», и передаёт близкие личные отношения.
- source_word: וְאָח
  choice: и брат
  rationale: אָח прежде всего означает родного брата, но может подразумевать и более широкую родственную солидарность. Буквальный выбор сохраняет параллелизм и образ оригинала.
- source_word: לְצָרָה
  choice: для беды
  rationale: צָרָה обозначает беду, нужду, тесноту или тяжёлые обстоятельства. «Для беды» сохраняет намеренно сжатую и допускающую разные прочтения конструкцию с לְ.
- source_word: יִוָּלֵד
  choice: рождается
  rationale: Нифаль глагола ילד буквально означает «рождается». Такой перевод сохраняет метафорическую силу и не подменяет её истолкованием вроде «оказывается братом».
theological_decisions:
- issue: Связь выражения «для беды» с глаголом «рождается» и возможная граница между двумя строками
  choice: Сохранить буквальное «брат рождается для беды» в основном тексте.
  alternative: «Друг любит во всякое время — и как брат рождается во время беды».
  rationale: Масоретская акцентуация разделяет две части после הָרֵעַ и поддерживает обычное прочтение о брате, рождённом для бедствия, то есть предназначенном проявить братство в нём. Однако синтаксическая сжатость допускает понимание беды как времени, когда друг становится подобен брату; это отмечено в сноске без устранения напряжения оригинала.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного, ритмичного и слегка возвышенного пословичного строя. Выражение «во всякое время» выбрано вместо более разговорного «всегда», а буквальный образ рождения сохранён.
