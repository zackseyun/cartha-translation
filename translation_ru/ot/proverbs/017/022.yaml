  text: לֵ֣ב שָׂ֭מֵחַ יֵיטִ֣ב גֵּהָ֑ה וְ/ר֥וּחַ נְ֝כֵאָ֗ה תְּיַבֶּשׁ גָּֽרֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/022.yaml
  text: A joyful heart promotes healing[a], but a crushed spirit dries up the bones.
translation:
  language: ru
  text: Радостное сердце способствует исцелению[a], а удручённый дух иссушает кости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «действует благотворно, как лекарство». Еврейское существительное גֵּהָה может означать исцеление, выздоровление или лечебное средство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב שָׂמֵחַ
  choice: радостное сердце
  rationale: Сохраняет древнееврейский образ внутреннего человека и естественно передаёт состояние радости на современном русском языке.
- source_word: יֵיטִב
  choice: способствует
  rationale: Передаёт каузативное значение формы от יטב («делать добро, улучшать») в сочетании с существительным «исцеление», не превращая образ в прямое медицинское обещание.
- source_word: גֵּהָה
  choice: исцелению
  rationale: Редкое существительное допускает значения исцеления, выздоровления или лечебного средства; «исцеление» сохраняет широкий смысл и поддерживает телесный образ второй части стиха.
- source_word: רוּחַ נְכֵאָה
  choice: удручённый дух
  rationale: «Дух» сохраняет антропологический параллелизм с «сердцем», а «удручённый» естественно обозначает внутренне сломленное, подавленное состояние без излишне буквального оттенка физического сокрушения.
- source_word: תְּיַבֶּשׁ
  choice: иссушает
  rationale: Передаёт интенсивное действие Piel и сохраняет конкретную метафору высыхания в краткой, возвышенной форме.
- source_word: גָּרֶם
  choice: кости
  rationale: Единственное число имеет собирательное значение; русский множественный вариант естественен в образном выражении о телесных силах.
theological_decisions:
- issue: Характер связи между радостью и исцелением
  choice: «способствует исцелению» выражает благотворное действие, не формулируя безусловной гарантии физического выздоровления
  alternative: «исцеляет» или «служит лекарством»
  rationale: Каузатив יֵיטִב и неоднозначное גֵּהָה позволяют говорить о пользе для исцеления; более категоричная формулировка могла бы снять присущую пословице образность и напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным ритмом пословицы. Сохранены параллелизм «сердце — дух» и телесная метафора «иссушает кости».
