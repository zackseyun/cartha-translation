    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוָה
  choice: не к лицу
  rationale: Естественный современный русский оборот, точно передающий значение уместности и подобающего поведения.
- source_word: נָבָל
  choice: глупец
  rationale: В литературе мудрости это не просто человек с низким интеллектом, а нравственно и рассудочно несостоятельный человек; «глупец» сохраняет краткость и жанровую традицию.
- source_word: שְׂפַת יֶתֶר
  choice: возвышенная речь
  rationale: Буквально выражение связано с «устами» и тем, что превосходит, избыточествует или возвышается. «Возвышенная речь» естественно передаёт высокий, изысканный характер речи, не устраняя оттенок претенциозности, отмеченный в сноске.
- source_word: אַף כִּי
  choice: тем более
  rationale: 'В контексте отрицания этот русский оборот естественно передаёт усиленное сопоставление: если первое неуместно, то второе — тем более.'
- source_word: נָדִיב
  choice: благородный человек
  rationale: «Благородный» допускает как указание на высокое положение, так и на достойный характер, сохраняя смысловую широту еврейского слова.
- source_word: שְׂפַת שָׁקֶר
  choice: лживые уста
  rationale: Сохраняет конкретный образ еврейского выражения «уста лжи» и звучит естественно в русском поэтическом изречении.
