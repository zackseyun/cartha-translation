  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
translation:
  language: ru
  text: Не к лицу глупцу возвышенная речь[a]; тем более не к лицу благородному человеку лживые уста[b].
  philosophy: optimal-equivalence
