  text: מַצְדִּ֣יק רָ֭שָׁע וּ/מַרְשִׁ֣יעַ צַדִּ֑יק תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/015.yaml
  text: The one who acquits the wicked and the one who condemns the righteous—both alike are an abomination to Yahweh[a].
translation:
  language: ru
  text: Кто признаёт невиновным нечестивого и кто объявляет виновным праведного — оба они мерзость для Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто оправдывает нечестивого и кто осуждает праведного».'
    reason: 'Лексическая альтернатива для двух судебных глаголов: более краткая формулировка точна, но русское «оправдывает» может также пониматься как попытка найти извинение, а «осуждает» — не только как судебный приговор.'
lexical_decisions:
- source_word: מַצְדִּיק
  choice: признаёт невиновным
  rationale: Причастие породы хифиль от צדק в параллели с מַרְשִׁיעַ имеет судебный смысл. «Признаёт невиновным» ясно передаёт оправдательный приговор и не привносит позднейших богословских оттенков слова «оправдывает».
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Слово обозначает нравственно виновного, порочного человека. «Нечестивый» сохраняет нравственную широту еврейского слова, тогда как «виновный» чрезмерно сужает его до судебного статуса.
- source_word: וּמַרְשִׁיעַ
  choice: и кто объявляет виновным
  rationale: Причастие породы хифиль от רשע в данном судебном противопоставлении означает вынесение обвинительного решения. Формулировка образует ясную антитезу выражению «признаёт невиновным».
- source_word: צַדִּיק
  choice: праведного
  rationale: Слово совмещает нравственное значение праведности и судебное значение правоты. «Праведный» сохраняет оба оттенка; «невиновный» было бы уже по смыслу.
- source_word: תּוֹעֲבַת
  choice: мерзость
  rationale: Сильное нравственно-религиозное обозначение того, что отвратительно Богу. «Мерзость» сохраняет силу и узнаваемый библейский регистр исходного слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: גַּם שְׁנֵיהֶם
  choice: оба они
  rationale: Фраза подчёркивает, что оба названных человека в равной мере являются мерзостью для Яхве; русское «оба они» передаёт этот охват естественно и кратко.
theological_decisions:
- issue: Судебный или преобразующий смысл глаголов צדק и רשע
  choice: 'Судебная формулировка: «признаёт невиновным» и «объявляет виновным»'
  alternative: 'Более общее нравственное понимание: «считает праведным» и «считает нечестивым»'
  rationale: Парные причастия хифиля образуют судебную антитезу. Такой перевод передаёт осуждение извращённого правосудия и не привносит в стих специальные доктринальные значения термина «оправдание».
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой, уместной для изречения. Судебная антитеза выражена ясно; нравственные обозначения «нечестивый» и «праведный» сохранены без сужения до чисто процессуальных категорий.
