lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: Сохраняет краткую сравнительную формулу еврейской пословицы.
- source_word: פַּת חֲרֵבָה
  choice: сухой кусок хлеба
  rationale: Передаёт скудную простую пищу без неуместного оттенка испорченности, который может иметь слово «чёрствый».
- source_word: וְשַׁלְוָה בָהּ
  choice: и покой с ним
  rationale: «Покой» естественно выражает тишину и благополучие, противопоставленные раздору; «с ним» сохраняет местоименный элемент, относя его к скромной трапезе.
- source_word: מִבַּיִת מָלֵא
  choice: чем дом, полный
  rationale: Сохраняет конкретный образ дома и сравнительное значение предлога מִן.
- source_word: זִבְחֵי
  choice: жертвенных пиров
  rationale: Передаёт как связь с жертвоприношениями, так и подразумеваемую обильную совместную трапезу.
- source_word: רִיב
  choice: раздор
  rationale: Краткое литературное обозначение межличностной вражды, хорошо противопоставленное покою.
