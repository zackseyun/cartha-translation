  text: Better is a dry crust with peace than a house full of sacrificial feasts with strife[a].
translation:
  language: ru
  text: Лучше сухой кусок хлеба и покой с ним, чем дом, полный жертвенных пиров и раздора.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
