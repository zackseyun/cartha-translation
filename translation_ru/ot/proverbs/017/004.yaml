  text: מֵ֭רַע מַקְשִׁ֣יב עַל שְׂפַת אָ֑וֶן שֶׁ֥קֶר מֵ֝זִין עַל לְשׁ֥וֹן הַוֺּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/004.yaml
  text: An evildoer listens to wicked lips[a]; a liar gives ear to a destructive tongue.
translation:
  language: ru
  text: Злодей прислушивается к нечестивым устам[a], лжец внимает пагубному языку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Творящий зло прислушивается к устам нечестия; ложь внимает языку погибели». Еврейский текст допускает более буквальный перевод, в котором «ложь» понимается отвлечённо, а не как «лжец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרַע
  choice: злодей
  rationale: Субстантивированная форма обозначает человека, делающего зло. «Злодей» кратко и естественно сохраняет нравственную характеристику, не сводя её к единичному проступку.
- source_word: מַקְשִׁיב עַל
  choice: прислушивается к
  rationale: Глагол קשׁב выражает внимательное слушание, а עַל указывает на объект внимания. «Прислушивается к» передаёт не просто слышание, а сознательную восприимчивость.
- source_word: שְׂפַת אָוֶן
  choice: нечестивым устам
  rationale: «Уста» сохраняют еврейскую метонимию речи; אָוֶן здесь имеет нравственный оттенок нечестия и зла.
- source_word: שֶׁקֶר
  choice: лжец
  rationale: Буквально «ложь, обман»; в параллели со словом מֵרַע естественно понимать его как обозначение человека, для которого характерна ложь. Формальная абстрактная возможность сохранена в сноске.
- source_word: מֵזִין
  choice: внимает
  rationale: Каузативная форма от אזן означает «давать ухо, внимательно слушать». «Внимает» сохраняет поэтическую параллель, не повторяя дословно первый глагол.
- source_word: לְשׁוֹן הַוֺּת
  choice: пагубному языку
  rationale: «Язык» метонимически означает речь, а הַוּוֹת — бедствия, гибель или разрушительное действие. «Пагубный» ясно передаёт причиняемый такой речью вред.
theological_decisions:
- issue: Личное или абстрактное значение שֶׁקֶר
  choice: лжец
  alternative: ложь
  rationale: Личное понимание создаёт естественный синтаксический и поэтический параллелизм со «злодеем», однако еврейская форма сама по себе абстрактна; поэтому буквальная возможность отмечена в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский с краткой афористичностью притчи. Параллель «злодей / лжец» и метонимии «уста / язык» сохранены; слова «прислушивается / внимает» передают два близких еврейских глагола и поддерживают поэтическое варьирование.
