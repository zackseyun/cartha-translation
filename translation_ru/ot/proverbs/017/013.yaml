  language: ru
  text: Кто воздаёт злом за добро, от его дома не отступит зло[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беда не отступит от его дома». Второе слово «зло» (רָעָה) может означать также беду или бедствие; основной текст сохраняет повтор еврейского слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: воздаёт
  rationale: Причастие породы хифиль от שוב здесь выражает ответное действие, возмещение. «Воздаёт» естественно передаёт смысл отплаты и сочетается с оборотом «злом за добро».
- source_word: רָעָה (первое употребление)
  choice: злом
  rationale: В первом употреблении слово обозначает нравственно дурной поступок или причиняемое зло; творительный падеж естественен в русском обороте «воздавать злом за добро».
- source_word: תַּחַת
  choice: за
  rationale: Предлог выражает обмен или ответное воздаяние; в сочетании с «воздаёт» русский предлог «за» точно и идиоматично передаёт этот смысл.
- source_word: טוֹבָה
  choice: добро
  rationale: Широкое значение добра, блага или благодеяния сохранено без неоправданного сужения до отдельной услуги или доброго поступка.
- source_word: לֹא תמיש
  choice: не отступит
  rationale: Форма от מוש выражает неустранение или непрекращающееся присутствие. «Не отступит» звучит естественно и сохраняет образ зла, остающегося при доме.
- source_word: רָעָה (второе употребление)
  choice: зло
  rationale: Повтор слова «зло» сохраняет резкую лексическую симметрию еврейского текста; возможный смысл бедствия указан в сноске.
- source_word: מִבֵּיתוֹ
  choice: от дома
  rationale: בַּיִת буквально означает дом и может охватывать также домашних и семью. Прямое «от дома» сохраняет ёмкость древнееврейского образа.
- source_word: неявное подлежащее причастия
  choice: кто
  rationale: Субстантивированное причастие имеет обобщённый смысл; конструкция «Кто… у того…» ясна и естественна в современном русском языке.
theological_decisions:
- issue: Характер второго רָעָה
  choice: В основном тексте сохранено «зло» как повтор первого употребления.
  alternative: «Беда» или «бедствие» как пагубное последствие поступка.
  rationale: Еврейское слово допускает как нравственный, так и бедственный смысл. Повтор сохраняет намеренную словесную связь, а сноска не позволяет скрыть возможное значение последствия или бедствия.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма пословицы. Оборот «воздаёт злом за добро» общеупотребителен и достоин по тону. Конструкция «у того» ясно соотносит притяжательное значение суффикса «его» с обобщённым «кто», не вводя гендерно маркированного местоимения.
