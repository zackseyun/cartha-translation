  text: Even a fool who keeps silent is considered wise; one who closes his lips[a], discerning.
translation:
  language: ru
  text: Даже глупец, когда молчит, считается мудрым, а тот, кто держит губы сомкнутыми, — рассудительным.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «понимающим». Во второй части подразумевается глагол «считается»: молчание может создать впечатление мудрости и рассудительности даже у глупца.'
    reason: лексическая альтернатива и пояснение эллипсиса
lexical_decisions:
- source_word: גַּם
  choice: даже
  rationale: 'Передаёт уступительно-усилительный смысл: мудрым могут счесть даже глупца, если он молчит.'
- source_word: אֱוִיל
  choice: глупец
  rationale: Традиционный и точный термин литературы мудрости для человека, которому недостаёт как разумения, так и нравственного благоразумия.
- source_word: מַחֲרִישׁ
  choice: когда молчит
  rationale: Естественно передаёт причастную форму со значением пребывания в молчании и ясно выражает условно-временную связь.
- source_word: חָכָם יֵחָשֵׁב
  choice: считается мудрым
  rationale: 'Сохраняет пассивное значение: окружающие принимают такого человека за мудрого, независимо от того, мудр ли он на самом деле.'
- source_word: אֹטֵם שְׂפָתָיו
  choice: тот, кто держит уста сомкнутыми
  rationale: Сохраняет конкретный образ закрытых губ и одновременно естественно выражает намеренное воздержание от речи.
- source_word: נָבוֹן
  choice: рассудительным
  rationale: Передаёт способность понимать и здраво судить, не дублируя слово «мудрым».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением афористичности, параллелизма и конкретного образа сомкнутых уст. Союз «а» обозначает поэтическое соответствие двух частей, не вводя резкого противопоставления.
