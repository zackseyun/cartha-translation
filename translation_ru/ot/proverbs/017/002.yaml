  text: עֶֽבֶד מַשְׂכִּ֗יל יִ֭מְשֹׁל בְּ/בֵ֣ן מֵבִ֑ישׁ וּ/בְ/ת֥וֹךְ אַ֝חִ֗ים יַחֲלֹ֥ק נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/002.yaml
  text: A prudent servant will rule over a son who brings shame[b][a], and among brothers he will share the inheritance.
translation:
  language: ru
  text: Благоразумный раб[a] будет господствовать над сыном, приносящим позор, и среди братьев[b] получит долю наследства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга». Еврейское עֶבֶד может обозначать и раба, и слугу; здесь слово «раб» подчёркивает необычность его возвышения над сыном.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально говорит: «среди братьев»; речь идёт о круге семейных наследников.'
    reason: lexical_clarification
lexical_decisions:
- source_word: עֶבֶד
  choice: раб
  rationale: 'Слово обозначает зависимого человека и может переводиться также как «слуга». Здесь «раб» сохраняет резкость общественного переворота: благоразумный раб возвышается над недостойным сыном и входит в число наследников.'
- source_word: מַשְׂכִּיל
  choice: благоразумный
  rationale: Причастие от שכל указывает на способность действовать разумно, осмотрительно и успешно; «благоразумный» естественно передаёт практическую мудрость в контексте Притчей.
- source_word: יִמְשֹׁל בְּבֵן
  choice: будет господствовать над сыном
  rationale: Глагол משל с предлогом ב выражает власть над кем-либо. Формулировка сохраняет прямоту еврейского текста и подчёркивает перемену обычных социальных ролей.
- source_word: מֵבִישׁ
  choice: приносящим позор
  rationale: 'Причастие имеет деятельное значение: сын не просто постыден сам, а причиняет стыд или позор.'
- source_word: וּבְתוֹךְ אַחִים
  choice: и среди братьев
  rationale: Передаёт включение раба в круг семейных наследников и сохраняет мужскую форму родственного термина в еврейском тексте.
- source_word: יַחֲלֹק נַחֲלָה
  choice: получит долю наследства
  rationale: Буквально выражение связано с разделом наследственного владения; в данном контексте оно означает участие в разделе и получение своей доли. Русская формулировка ясно передаёт этот смысл без излишней конкретизации механизма раздела.
theological_decisions:
- issue: Статус עֶבֶד
  choice: раб
  alternative: слуга
  rationale: Контекст строится на резком возвышении зависимого человека над родным сыном. «Раб» точнее сохраняет социальную напряжённость изречения, не утверждая сверх того конкретной правовой формы рабства.
- issue: Родственное обозначение אַחִים
  choice: братья
  alternative: братья и сёстры; родственники-наследники
  rationale: Еврейский текст прямо употребляет мужское множественное «братья». Возможный более широкий охват семьи не следует молча вводить в основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Благоразумный» сохраняет достоинство регистра мудростной литературы, а «получит долю наследства» естественно выражает подразумеваемое участие в разделе имущества.
