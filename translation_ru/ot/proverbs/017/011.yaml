id: PRO.17.11
reference: Proverbs 17:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַךְ מְרִ֥י יְבַקֶּשׁ רָ֑ע וּ/מַלְאָ֥ךְ אַ֝כְזָרִ֗י יְשֻׁלַּח בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
translation:
  language: ru
  text: Мятежный человек ищет только зла, и против него будет послан жестокий вестник.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и против него будет послан жестокий ангел». Еврейское слово может означать как «вестника», так и «ангела».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: только
  rationale: 'Передаёт ограничительно-усилительное значение частицы: устремление мятежного человека направлено исключительно ко злу.'
- source_word: מְרִי
  choice: мятежный человек
  rationale: Хотя существительное может обозначать «мятеж» или «непокорность», здесь оно употреблено лично; мужской род последующих форм поддерживает значение человека, упорствующего в неповиновении.
- source_word: יְבַקֶּשׁ
  choice: ищет
  rationale: Естественно и точно передаёт значение породы пиэль глагола בקש — «искать, добиваться».
- source_word: רָע
  choice: зла
  rationale: Сохраняет нравственный смысл слова и не сужает его до одного лишь вреда, беды или несчастья.
- source_word: מַלְאָךְ
  choice: вестник
  rationale: Слово может обозначать как человеческого посланца, так и ангела; «вестник» не уточняет природу исполнителя наказания сверх сказанного в тексте.
- source_word: אַכְזָרִי
  choice: жестокий
  rationale: Прямо передаёт суровый, безжалостный характер посланного исполнителя.
- source_word: יְשֻׁלַּח
  choice: будет послан
  rationale: Передаёт пассивную форму пуаль и естественно выражает ожидаемое следствие в изречении.
- source_word: בּוֹ
  choice: против него
  rationale: В контексте враждебного и карательного действия предлог естественно передаётся по-русски как «против».
theological_decisions:
- issue: Следует ли понимать מַלְאָךְ как сверхъестественного ангела или как вестника в более общем смысле
  choice: вестник
  alternative: ангел
  rationale: Еврейский текст не определяет природу посланного исполнителя. Основной перевод сохраняет эту неопределённость, а возможное сверхъестественное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой афористичностью, подобающей книге Притч. «Мятежный человек» передаёт личное употребление абстрактного еврейского существительного, а «вестник» сохраняет смысловую и богословскую неоднозначность.
