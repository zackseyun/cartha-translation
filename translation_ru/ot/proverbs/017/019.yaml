- from: Кто любит преступление, тот любит ссоры; кто делает свой вход высоким[a], тот ищет погибели.
  to: Кто любит преступление, тот любит ссоры; кто делает высоким свой дверной проём[a], тот ищет разрушения.
  rationale: Уточнён физический смысл פִּתְחוֹ через «дверной проём», при этом в примечании сохранён допустимый вариант «ворота». «Разрушения» заменяет «погибели», чтобы не ограничивать שָׁבֶר значением смерти или гибели. Параллельное, афористичное построение стиха сохранено.
