  text: אֹ֣הֵֽב פֶּ֭שַׁע אֹהֵ֣ב מַצָּ֑ה מַגְבִּ֥יהַּ פִּ֝תְח֗/וֹ מְבַקֶּשׁ שָֽׁבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/019.yaml
  text: Whoever loves transgression loves strife[a]; he who makes his door high seeks destruction.
translation:
  language: ru
  text: Кто любит преступление, тот любит ссоры; кто делает высоким свой дверной проём[a], тот ищет разрушения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто высоко поднимает свой дверной проём (или ворота)». Этот образ может указывать на горделивое самовозвышение, показную роскошь или на действия, навлекающие беду.'
    reason: Сочетание מַגְבִּיהַּ פִּתְחוֹ сохраняет конкретный, но не вполне однозначный образ; примечание отмечает варианты понимания, не объявляя ни один из них единственно верным.
lexical_decisions:
- source_word: אֹהֵב
  choice: любит
  rationale: Причастие породы qal означает «любит, находит удовольствие». Повтор глагола сохранён ради параллелизма и нравственной остроты изречения.
- source_word: פֶּשַׁע
  choice: преступление
  rationale: Слово обозначает сознательное нарушение, проступок или мятеж. «Преступление» передаёт намеренный и серьёзный характер действия, не сводя его к случайной ошибке.
- source_word: מַצָּה
  choice: ссоры
  rationale: В данном контексте существительное обозначает распрю, раздор, конфликт. Множественное «ссоры» естественно звучит по-русски и выражает склонность к постоянным распрям.
- source_word: מַגְבִּיהַּ
  choice: делает ... высоким
  rationale: Причастие породы hифиль от גבה буквально означает «делает высоким, возвышает». Перевод сохраняет конкретный пространственный образ, не заменяя его одной из возможных интерпретаций.
- source_word: פִּתְחוֹ
  choice: свой вход
  rationale: פֶּתַח означает проём, вход или дверной проём. «Вход» естественнее сочетать с «делает высоким» и не сужает образ до двери как створки или до ворот.
- source_word: מְבַקֶּשׁ
  choice: ищет
  rationale: Буквальное значение — «ищет, добивается». В контексте подразумевается, что человек сам навлекает результат, но формулировка оригинала и её ирония сохранены.
- source_word: שָׁבֶר
  choice: погибели
  rationale: Слово может означать сокрушение, крах, бедствие или гибель. «Погибель» передаёт тяжесть результата и естественно сочетается с выражением «ищет погибели».
