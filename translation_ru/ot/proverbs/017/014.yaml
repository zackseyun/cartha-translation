  text: The beginning of strife is like letting out water[b][a]; so abandon the quarrel before it breaks out.
translation:
  language: ru
  text: Начать раздор — всё равно что выпустить воду[a]; оставь спор, прежде чем он разгорится[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Выпускающий воду — начало раздора». Образ, возможно, подразумевает отверстие в плотине или канале: начавшийся поток трудно остановить.'
    reason: lexical_alternative
  - marker: b
    text: 'Значение еврейского глагола не вполне ясно; возможны переводы: «прорвётся», «выйдет наружу» или «обострится». Смысл в том, чтобы прекратить спор, пока он не стал открытым и неуправляемым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹטֵר מַיִם
  choice: как выпущенная вода
  rationale: Оборот буквально изображает высвобождение воды, вероятно через открытое отверстие или прорыв. Русская формулировка сохраняет конкретную метафору и подразумеваемую неудержимость потока.
- source_word: רֵאשִׁית מָדוֹן
  choice: начало раздора
  rationale: רֵאשִׁית обозначает начало или первую стадию, а מָדוֹן — распрю, раздор, тяжбу. «Начало раздора» естественно и уместно для краткого изречения.
- source_word: נְטוֹשׁ
  choice: оставь
  rationale: Императив требует прекратить участие в споре. «Оставь» сохраняет силу повеления, звучит естественно и не добавляет оттенка окончательного отречения, возможного у «откажись».
- source_word: הָרִיב
  choice: спор
  rationale: רִיב здесь обозначает ссору или тяжбу. «Спор» хорошо передаёт межличностный конфликт и позволяет избежать буквального повтора слова «раздор».
- source_word: הִתְגַּלַּע
  choice: разгорится
  rationale: Редкая и трудная форма может указывать на прорыв, обнажение или открытую эскалацию конфликта. «Разгорится» идиоматично передаёт переход спора в явную, трудноуправляемую стадию, а примечание сохраняет лексическую неопределённость.
