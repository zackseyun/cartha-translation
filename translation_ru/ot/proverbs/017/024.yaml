  text: אֶת פְּנֵ֣י מֵבִ֣ין חָכְמָ֑ה וְ/עֵינֵ֥י כְ֝סִ֗יל בִּ/קְצֵה אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
translation:
  language: ru
  text: У разумного перед глазами мудрость[a], а глаза глупца — на краю земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мудрость перед лицом разумного». Или: «Мудрость рядом с тем, кто понимает».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на краю страны». Еврейское אֶרֶץ может означать как землю вообще, так и страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת־פְּנֵי
  choice: перед лицом
  rationale: 'Сочетание понято как указание на непосредственную близость: мудрость находится прямо перед разумным человеком. Перевод сохраняет конкретный еврейский образ и противопоставляет близкую мудрость устремлённому вдаль взгляду глупца.'
- source_word: מֵבִין
  choice: человека разумного
  rationale: Причастие обозначает человека, обладающего пониманием и рассудительностью. Мужской род единственного числа сохранён как типичная для притчи обобщённая фигура.
- source_word: חָכְמָה
  choice: Мудрость
  rationale: Абстрактное существительное передано без обязательной персонификации; прописная буква обусловлена началом предложения, а не богословским отождествлением.
- source_word: וְעֵינֵי
  choice: а глаза
  rationale: Союз передан противительно-сопоставительным «а», поскольку две части изречения явно противопоставлены.
- source_word: כְסִיל
  choice: глупца
  rationale: В Притчах слово обозначает не только недостаток ума, но и нравственно неразумного человека; «глупец» — ясный и устойчивый русский эквивалент.
- source_word: בִּקְצֵה אָרֶץ
  choice: на краю земли
  rationale: Единственное число קְצֵה буквально указывает на край или предел. Русское выражение сохраняет гиперболический образ далёкого места, куда блуждает взгляд глупца.
theological_decisions:
- issue: Обобщённый субъект мужского рода
  choice: человека разумного
  alternative: того, кто понимает; разумного человека
  rationale: Еврейская форма имеет мужской род единственного числа и употреблена как обобщённый тип. Перевод сохраняет грамматический образ, не ограничивая смысл только мужчинами.
- issue: Возможная персонификация мудрости
  choice: абстрактное «Мудрость» без усиления персонификации
  alternative: персонифицированная Премудрость
  rationale: Сам стих не требует понимать חָכְמָה как отдельную личность. Поэтому перевод не вводит богословски нагруженное «Премудрость» и сохраняет открытость образа.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Конкретный образ «перед лицом» сохранён, поскольку он понятен по-русски и поддерживает пространственный контраст со второй строкой.
