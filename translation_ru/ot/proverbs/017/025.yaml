  yaml_path: translation/ot/proverbs/017/025.yaml
  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
translation:
  language: ru
  text: Глупый сын — горе для отца[a] и горечь для родившей его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «досада для отца». Еврейское слово может означать гнев, досаду или огорчение; здесь, вероятно, имеется в виду душевная боль, которую сын причиняет отцу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для той, которая родила его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעַס
  choice: горе
  rationale: Существительное может обозначать гнев, досаду или огорчение. В этом параллелизме оно передаёт тяжёлое переживание отца, вызванное глупым сыном; «горе» естественно сочетается с «горечью» второй строки.
- source_word: לְאָבִיו
  choice: для отца
  rationale: 'Предлог לְ здесь обозначает отношение и воздействие: сын становится горем для своего отца. Русская конструкция сохраняет краткость именного высказывания.'
- source_word: בֵּן כְּסִיל
  choice: глупый сын
  rationale: כְּסִיל — устойчивое понятие литературы мудрости, обозначающее нравственно и житейски неразумного человека, а не только человека с низкими умственными способностями.
- source_word: וּמֶמֶר
  choice: и горечь
  rationale: Редкое существительное, вероятнее всего, означает горечь или мучительное огорчение. Такое значение соответствует параллелизму с כַּעַס и описывает переживание матери.
- source_word: לְיוֹלַדְתּוֹ
  choice: для родившей его
  rationale: Причастная форма буквально указывает на ту, которая его родила. «Для родившей его» сохраняет образность еврейского текста и остаётся естественным в современном литературном русском языке.
