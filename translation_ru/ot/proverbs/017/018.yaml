id: PRO.17.18
reference: Proverbs 17:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אָדָ֣ם חֲסַר לֵ֭ב תּוֹקֵ֣עַ כָּ֑ף עֹרֵ֥ב עֲ֝רֻבָּ֗ה לִ/פְנֵ֥י רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/018.yaml
  text: A man lacking sense shakes hands[c][b][a], pledging security before his neighbor.
translation:
  language: ru
  text: Человек, лишённый рассудка[a], ударяет по рукам[b], беря на себя поручительство перед своим ближним[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лишённый сердца»; здесь «сердце» означает разумение и здравое суждение.'
    reason: lexical_alternative
  - marker: b
    text: Удар ладонями служил жестом, которым скрепляли обязательство или договорённость.
    reason: cultural_note
  - marker: c
    text: 'Или: «в присутствии своего ближнего». Кем именно выступает ближний — должником, кредитором или свидетелем, — в тексте не уточняется.'
    reason: ambiguity_note
lexical_decisions:
- source_word: אָדָם
  choice: человек
  rationale: Единственное число представляет отдельного человека как типичный пример в изречении мудрости; русское «человек» естественно и не сужает смысл до обозначения пола.
- source_word: חֲסַר לֵב
  choice: лишённый рассудка
  rationale: Буквально выражение означает «лишённый сердца», однако в древнееврейской литературе мудрости сердце обозначает также разумение, здравое суждение и нравственную рассудительность.
- source_word: תּוֹקֵעַ כָּף
  choice: ударяет по рукам
  rationale: Русское выражение передаёт как образ удара ладонями, так и обычай скреплять договорённость таким жестом; оно ближе к древнееврейскому образу, чем нейтральное «пожимает руку».
- source_word: עֹרֵב עֲרֻבָּה
  choice: беря на себя поручительство
  rationale: Однокоренные глагол и существительное обозначают принятие обязательства поручителя. Русская формулировка ясно передаёт финансово-правовой смысл без искусственного воспроизведения однокоренного повтора.
- source_word: לִפְנֵי רֵעֵהוּ
  choice: перед своим ближним
  rationale: Сохранено прямое пространственно-личное значение предлога «перед, в присутствии», без решения вопроса о том, является ли ближний должником, кредитором или свидетелем.
theological_decisions:
- issue: Характер порицания поручительства
  choice: 'Сохранить форму наблюдения: неразумный человек принимает поручительство.'
  alternative: Передать стих как прямой всеобщий запрет любого поручительства.
  rationale: Текст характеризует поступок как признак недостатка рассудительности, но грамматически не формулирует прямой запрет и не уточняет обстоятельства обязательства.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Выражение «ударяет по рукам» сохраняет конкретный образ и остаётся понятным современному читателю; «поручительство» точно передаёт юридико-финансовый характер действия. Слово «ближний» поддерживает достоинство библейского регистра, не вводя конфессионального толкования.
