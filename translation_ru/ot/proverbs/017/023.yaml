  text: A wicked man takes a bribe from the bosom to pervert the paths of justice[a][b].
translation:
  language: ru
  text: Нечестивый берёт взятку из-за пазухи[a], чтобы извратить пути правосудия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из лона»; вероятно, имеется в виду из складок одежды, где взятка скрыта.'
