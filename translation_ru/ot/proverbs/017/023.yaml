    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: взятку
  rationale: Существительное обозначает незаконное вознаграждение, призванное повлиять на решение или поступок; «взятка» — ясный и точный современный эквивалент.
- source_word: מֵחֵיק
  choice: из-за пазухи
  rationale: חֵיק означает грудь, лоно или образованный одеждой внутренний сгиб. Русское «из-за пазухи» сохраняет конкретный образ скрытой передачи, не заменяя его толкованием «тайно».
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное обозначает порочного, неправедного человека. «Нечестивый» сохраняет нравственную оценку и естественно звучит в форме изречения.
- source_word: יִקָּח
  choice: берёт
  rationale: Глагол לקח имеет основное значение «брать»; в данном контексте подразумевается принятие взятки, но буквальное «берёт» остаётся понятным и сохраняет краткость еврейского текста.
- source_word: לְהַטּוֹת
  choice: чтобы извратить
  rationale: נטה выражает отклонение от правильного направления. В судебном контексте «извратить» естественно передаёт намеренное нарушение справедливости.
- source_word: אָרְחוֹת
  choice: пути
  rationale: Множественное число сохраняет метафору дорог или путей, характерную для книги Притч.
- source_word: מִשְׁפָּט
  choice: правосудия
  rationale: В контексте взяточничества слово относится к справедливому судебному порядку; «правосудие» точнее передаёт этот смысл, чем более узкое «судебное решение».
- source_word: אָרְחוֹת מִשְׁפָּט
  choice: пути правосудия
  rationale: Выражение сохраняет множественный метафорический образ оригинала. Более идиоматичное «ход правосудия» возможно, но сглаживает образ путей.
