  text: A rebuke goes deeper into a man of understanding than a hundred blows into a fool[a].
translation:
  language: ru
  text: Укор сильнее действует на разумного, чем сто ударов — на глупца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Укор глубже проникает в разумного, чем ударить глупца сто раз».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּחַת
  choice: сильнее действует
  rationale: Форма от נחת передаёт нисхождение или проникновение; в контексте притчи речь о глубоком воздействии укоризны. Сравнительная конструкция с מ естественно передаётся по-русски словами «сильнее действует».
- source_word: גְּעָרָה
  choice: укор
  rationale: Существительное обозначает словесное порицание или резкое исправление. «Укор» краток, достоин по стилю и уместен в литературе мудрости.
- source_word: בְמֵבִין
  choice: на разумного
  rationale: Причастие мужского рода единственного числа означает понимающего, рассудительного человека. Субстантивированное «разумный» сохраняет типичный для Притч антитетический образ и звучит естественно по-русски.
- source_word: מֵהַכּוֹת
  choice: чем ... сто ударов
  rationale: Префикс מ выражает сравнение, а инфинитив נכה — нанесение ударов. Такая формулировка сохраняет сравнительную структуру и яркость образа без неестественного русского оборота.
- source_word: כְּסִיל
  choice: глупца
  rationale: В Притчах это устойчивое обозначение нравственно и умственно упрямого глупца, а не просто человека с низкими способностями. «Глупец» является точным традиционным эквивалентом.
- source_word: מֵאָה
  choice: сто
  rationale: Числительное гиперболически усиливает противопоставление; «сто» буквально и естественно передаёт его.
