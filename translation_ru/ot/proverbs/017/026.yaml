source:
  edition: WLC
  text: גַּ֤ם עֲנ֣וֹשׁ לַ/צַּדִּ֣יק לֹא ט֑וֹב לְ/הַכּ֖וֹת נְדִיבִ֣ים עַל יֹֽשֶׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/026.yaml
  text: Also[a], to punish a righteous man is not good[b], nor to strike nobles for their uprightness.
translation:
  language: ru
  text: Также нехорошо наказывать праведного и бить знатных[a] за правоту.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вельмож», «правителей». Еврейское слово может обозначать людей высокого положения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вопреки справедливости». Еврейское выражение עַל יֹשֶׁר допускает понимание как «за правоту», так и «против того, что справедливо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Также
  rationale: Сохраняет добавочное значение частицы и естественно связывает изречение с предшествующим контекстом.
- source_word: עֲנוֹשׁ
  choice: наказывать
  rationale: Передаёт общее значение наложения наказания, не сужая его до денежного штрафа.
- source_word: לַצַּדִּיק
  choice: праведного
  rationale: Сохраняет единственное число и обозначение нравственно или юридически правого человека, характерное для литературы мудрости.
- source_word: לֹא טוֹב
  choice: нехорошо
  rationale: Близко передаёт краткую еврейскую оценочную формулу и естественно звучит по-русски.
- source_word: לְהַכּוֹת
  choice: бить
  rationale: Передаёт широкое значение глагола, не уточняя без достаточных оснований вид или степень телесного наказания.
- source_word: נְדִיבִים
  choice: знатных
  rationale: В данном общественно-судебном контексте слово, вероятнее всего, обозначает людей высокого положения; возможные значения указаны в сноске.
- source_word: עַל יֹשֶׁר
  choice: за правоту
  rationale: Сохраняет наиболее прямое понимание оборота как указания на основание, по которому их бьют, и не устраняет возможное иное синтаксическое прочтение.
theological_decisions:
- issue: Связь выражения עַל יֹשֶׁר с действием «бить»
  choice: за правоту
  alternative: вопреки справедливости
  rationale: Основной текст сохраняет прямое причинное понимание предлога עַל, тогда как сноска отмечает идиоматическое прочтение, при котором осуждается несправедливый способ наказания. Неоднозначность исходного текста не разрешается догматически.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма сохранена. Союз «и» перед вторым инфинитивом добавлен ради естественной русской координации, не изменяя смыслового параллелизма.
