  text: A bribe is a charm-stone in the eyes of its owner[a]; wherever he turns[b], he prospers.
translation:
  language: ru
  text: 'Взятка в глазах её владельца — как камень-талисман[a]: куда бы он ни обратился, он преуспевает[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «камень благосклонности». Возможно также: «драгоценный камень», «волшебный камень» или «счастливый талисман».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «добивается успеха». Древнееврейский глагол может обозначать успешное или умелое действие, а также преуспевание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  choice: камень, приносящий благосклонность
  rationale: Буквально — «камень благосклонности/милости». Перевод сохраняет образ камня и передаёт представление владельца о взятке как о средстве, которое обеспечивает расположение и успех, не усиливая текст до прямого указания на магию.
- source_word: הַשֹּׁחַד
  choice: взятка
  rationale: Существительное обычно обозначает именно взятку, а не нейтральный подарок; здесь оно описывает действенность неправедного средства, не обязательно одобряя его.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохранён прозрачный древнееврейский оборот, обозначающий оценку или точку зрения.
- source_word: בְעָלָיו
  choice: того, кто ею владеет
  rationale: Форма указывает на обладателя взятки. Развёрнутый перевод естественнее русского «её владельца» и сохраняет неопределённость относительно того, является ли он дающим или располагающим ею лицом.
- source_word: אֶל כָּל אֲשֶׁר יִפְנֶה
  choice: куда бы он ни обратился
  rationale: Естественно передаёт широкое значение направления действий или начинаний, сохраняя образ обращения в разные стороны.
- source_word: יַשְׂכִּיל
  choice: везде добивается успеха
  rationale: В данной форме глагол может обозначать успешное, умелое действие или достижение успеха. Контекст подчёркивает практический результат взятки; «добивается успеха» передаёт это без нравственного значения слова «мудро».
theological_decisions:
- issue: Описывает ли пословица взятку одобрительно
  choice: Сохранить наблюдательную формулировку без добавленного нравственного комментария
  alternative: Явно назвать успех мнимым или неправедным
  rationale: Сам стих говорит о восприятии и опыте владельца взятки, но не формулирует прямой нравственной оценки. Контекстуальную библейскую оценку взяточничества не следует вставлять в перевод этого стиха.
translation_notes:
  register: Современный литературный русский язык с сохранением образности и афористичности. Формулировка «в глазах» удерживает перспективу владельца, а не представляет действенность взятки как безусловное авторское одобрение.
