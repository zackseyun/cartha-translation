  text: חוֹשֵׂ֣ךְ אֲ֭מָרָי/ו יוֹדֵ֣עַ דָּ֑עַת ו/קר ר֝֗וּחַ אִ֣ישׁ תְּבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/027.yaml
  text: Whoever restrains his words has knowledge[b][a], and a man of understanding is cool in spirit.
translation:
  language: ru
  text: 'Кто сдерживает свои слова, тот обладает знанием,

    а разумный человек[b] спокоен духом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «холоден (или прохладен) духом»; температурный образ указывает на спокойствие и самообладание.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение буквально имеет форму «муж разумения»; в пословице мужской род употреблён как обобщающая форма для человека, отличающегося рассудительностью.
    reason: cultural_note
lexical_decisions:
- source_word: חוֹשֵׂךְ אֲמָרָיו
  choice: сдерживает свои слова
  rationale: Причастие חוֹשֵׂךְ здесь обозначает сознательное удерживание речи. «Сдерживает свои слова» естественно передаёт мысль о самообладании, не превращая её лишь в молчание.
- source_word: יוֹדֵעַ דָּעַת
  choice: обладает знанием
  rationale: Буквальное «знает знание» неестественно по-русски. Выбранная формулировка передаёт характеристику человека как знающего и сохраняет существительное «знание».
- source_word: וְקַר רוּחַ
  choice: спокоен духом
  rationale: קַר буквально означает «холоден, прохладен», а רוּחַ здесь относится к внутреннему настрою. В данном параллелизме выражение описывает невозмутимость; естественный русский оборот дан в тексте, а температурный образ сохранён в примечании.
- source_word: אִישׁ תְּבוּנָה
  choice: разумный человек
  rationale: Сочетание обозначает человека, которому свойственны разумение и рассудительность. «Разумный человек» звучит естественно и сохраняет личностную форму оригинала.
theological_decisions:
- issue: Мужской род в обобщающем изречении мудрости
  choice: разумный человек
  alternative: муж разумения
  rationale: אִישׁ имеет форму мужского рода, однако в пословице выражает общее наблюдение о человеке с разумением. Русское «человек» грамматически мужского рода и позволяет сохранить форму изречения без архаичного или искусственно ограничивающего смысла.
- issue: Температурная метафора самообладания
  choice: спокоен духом
  alternative: холоден духом
  rationale: Буквальная формулировка по-русски может ошибочно означать душевную чёрствость. Основной текст передаёт подразумеваемое самообладание, а примечание сохраняет конкретный образ еврейского текста.
translation_notes:
  register: Современный литературный русский язык с краткой, параллельной структурой изречения. Синтаксис естественный и ясный; конкретная еврейская метафора пояснена в примечании, чтобы не создавать в основном тексте ложного оттенка душевной холодности.
