  text: Why is there a price in the hand of a fool to buy wisdom when he has no heart for it?[a]
translation:
  language: ru
  text: Зачем глупцу деньги, чтобы купить мудрость, если у него нет разума?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а сердца нет». В древнееврейском языке «сердце» может означать внутреннюю способность понимать, рассуждать и принимать решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: К чему
  rationale: Риторический вопрос о бесполезности имеющихся у глупца средств; «к чему» естественно передаёт смысл вопроса, не сводя его к простому выяснению причины.
- source_word: מְחִיר
  choice: плата
  rationale: Слово обозначает цену или средство уплаты при покупке. «Плата» сохраняет торговый образ и, в отличие от буквального «цена», естественнее сочетается с выражением «в руке».
- source_word: בְּיַד
  choice: в руке
  rationale: Сохранён конкретный древнееврейский образ обладания и распоряжения чем-либо.
- source_word: כְּסִיל
  choice: глупец
  rationale: Устойчивое обозначение в литературе мудрости человека, упорно отвергающего разумное и нравственное наставление.
- source_word: לִקְנוֹת
  choice: покупать
  rationale: Коммерческое значение глагола здесь поддерживается существительным מְחִיר; перевод сохраняет метафору приобретения мудрости за плату.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Основное значение слова в Притчах — нравственная и практическая мудрость.
- source_word: וְלֶב אָיִן
  choice: если у него нет разума
  rationale: 'Буквально: «а сердца нет». В древнееврейском представлении сердце включает способность понимать, рассуждать и принимать решения; «нет разума» ясно передаёт смысл в современном русском, а буквальный образ отмечен в сноске.'
theological_decisions:
- issue: Причина бесполезности платы у глупца
  choice: «если у него нет разума»
  alternative: «если у него нет желания» / «если он не расположен к ней сердцем»
  rationale: Текст допускает оттенки неспособности к пониманию и отсутствия внутренней готовности. Основной перевод передаёт познавательный аспект, но не утверждает, что речь исключительно о врождённой неспособности; сноска сохраняет более широкий древнееврейский образ сердца.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и резкого риторического строя притчи. Торговый образ и выражение «в руке» сохранены; непрозрачная для современного читателя метафора отсутствующего сердца разъяснена в сноске.
