  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: ru
  text: Лучше встретить медведицу, потерявшую медвежат, чем глупца в его глупости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּגוֹשׁ
  choice: встретить
  rationale: Инфинитив передаёт значение столкновения или встречи; в сравнительной конструкции по-русски естественно добавить «лучше».
- source_word: דֹּב שַׁכּוּל
  choice: медведицу, лишившуюся медвежат
  rationale: Форма «лишившаяся детёнышей» в данном образе естественно относится к медведице; множественное שַׁכּוּל указывает на потерю детёнышей.
- source_word: כְּסִיל
  choice: глупца
  rationale: Обычный для Притч нравственно окрашенный термин обозначает человека, упорно отвергающего мудрость.
- source_word: בְּאִוַּלְתּוֹ
  choice: поглощённого своей глупостью
  rationale: Предлог ב допускает состояние пребывания «в своей глупости»; выбранная формулировка естественно передаёт человека во власти собственной глупости, не сводя выражение лишь к отдельному поступку.
theological_decisions:
- issue: Сравнение опасности медведицы и глупца
  choice: Сохранено прямое парадоксальное сравнение без поясняющей морализации.
  alternative: «Опаснее встретить глупца…»
  rationale: Исходный текст выражает мысль через сопоставление встреч, а не через отвлечённое утверждение об опасности.
translation_notes:
  register: Современный литературный русский язык; краткая афористичность и резкий образ оригинала сохранены.
