  text: מְֽכַסֶּה פֶּ֭שַׁע מְבַקֵּ֣שׁ אַהֲבָ֑ה וְ/שֹׁנֶ֥ה בְ֝/דָבָ֗ר מַפְרִ֥יד אַלּֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/009.yaml
  text: Whoever covers over an offense seeks love[c][b][a], but he who repeats a matter separates close friends.
translation:
  language: ru
  text: Кто покрывает проступок, тот ищет любви[a], а кто снова заводит речь о нём — разлучает близких друзей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрывает проступок». Еврейский текст сохраняет образ покрытия и прямо не называет это прощением.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «разлучает близкого друга»; единственное число в еврейском имеет обобщённый смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: покрывает
  rationale: 'Сохраняет конкретную еврейскую метафору: человек не выставляет чужую вину напоказ и не продолжает на ней настаивать; перевод «прощает» был бы допустимым толкованием, но сделал бы смысл более однозначным, чем оригинал.'
- source_word: פֶּשַׁע
  choice: проступок
  rationale: В данном контексте слово обозначает вину в межличностных отношениях. «Проступок» понятно современному читателю и не усиливает значение до открытого мятежа.
- source_word: מְבַקֵּשׁ
  choice: ищет
  rationale: Прямо передаёт значение причастия и сохраняет краткую причинно-нравственную логику изречения.
- source_word: אַהֲבָה
  choice: любви
  rationale: Прямой и широкий эквивалент, не сужающий смысл до одной лишь дружбы или привязанности.
- source_word: שֹׁנֶה
  choice: снова заводит речь
  rationale: В сочетании с בְדָבָר речь, вероятнее всего, идёт о возвращении к уже случившемуся проступку. Формулировка естественна по-русски и сохраняет идею повторного поднятия темы.
- source_word: בְדָבָר
  choice: о нём
  rationale: Местоимение естественно связывает «дело» с ранее названным проступком. Предлог ב допускает понимание действия в отношении данного дела или слова.
- source_word: מַפְרִיד
  choice: разлучает
  rationale: 'Передаёт каузативный смысл: повторное обсуждение проступка приводит к разрыву близких отношений.'
- source_word: אַלּוּף
  choice: близких друзей
  rationale: Слово обозначает близкого, доверенного человека. Множественное число естественно выражает по-русски обобщённый смысл пословицы, хотя в еврейском стоит единственное число.
