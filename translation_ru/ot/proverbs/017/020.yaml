  text: עִקֶּשׁ לֵ֭ב לֹ֣א יִמְצָא ט֑וֹב וְ/נֶהְפָּ֥ךְ בִּ֝/לְשׁוֹנ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/020.yaml
  text: A crooked heart does not find good, and one who is twisted in his tongue falls into trouble.
translation:
  language: ru
  text: У кого сердце лукавое, тот не найдёт добра, а кто говорит превратно, тот попадёт в беду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִקֶּשׁ לֵב
  choice: у кого сердце лукаво
  rationale: Сочетание обозначает внутреннюю нравственную кривизну, упрямую нечестность. «Лукаво» естественно по-русски и сохраняет этический смысл образа, не сводя его к интеллектуальной ошибке.
- source_word: לֹא יִמְצָא טוֹב
  choice: не найдёт добра
  rationale: 'Сохранена широкая семантика טוֹב: это может быть и благо, и благополучный исход. Русское «добра» удерживает эту намеренную широту.'
- source_word: וְנֶהְפָּךְ בִּלְשׁוֹנוֹ
  choice: а кто извращает свою речь
  rationale: Буквально оборот описывает человека, «извращённого/перевёрнутого своим языком». Выбранная формулировка ясно передаёт порочную, искажённую речь и естественно звучит по-русски, не уточняя без основания, идёт ли речь только о лжи, клевете или двусмысленности.
- source_word: יִפּוֹל בְּרָעָה
  choice: попадёт в беду
  rationale: Идиома буквально говорит о падении в зло/бедствие. «Попадёт в беду» передаёт здесь результат — несчастье или бедствие, — не создавая впечатления, будто субъект сам начинает творить зло.
theological_decisions:
- issue: Связь нравственного характера с последствиями
  choice: Сохранена форма общего мудростного изречения без превращения её в безусловное обещание немедленного воздаяния.
  alternative: Передать как категорическую гарантию земного благополучия для всякого праведного человека.
  rationale: Жанр Притч выражает устойчивую нравственную закономерность; текст не задаёт сроков и не формулирует исчерпывающей доктрины воздаяния.
translation_notes:
  register: Современный литературный русский язык; параллелизм двух частей сохранён. Формулировка краткая и афористичная, без архаизмов и конфессиональной терминологии.
