  text: לֹעֵ֣ג לָ֭/רָשׁ חֵרֵ֣ף עֹשֵׂ֑/הוּ שָׂמֵ֥חַ לְ֝/אֵ֗יד לֹ֣א יִנָּקֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/005.yaml
  text: Whoever mocks the poor insults his Maker[c][b][a]; he who rejoices at calamity will not go unpunished.
translation:
  language: ru
  text: Кто насмехается над бедным, тот оскорбляет его Создателя; кто радуется несчастью, тот не останется без наказания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот не будет признан невиновным»; также возможно: «тот не будет оправдан».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹעֵג
  choice: насмехается
  rationale: Причастие обозначает насмешку и презрительное отношение; русский глагол естественно и точно передаёт продолжающееся или характерное действие в афористической формулировке.
- source_word: לָרָשׁ
  choice: над бедным
  rationale: רָשׁ обозначает бедного, неимущего человека. Единственное число сохраняет форму и личную направленность еврейского текста.
- source_word: חֵרֵף
  choice: оскорбляет
  rationale: Глагол выражает поношение и презрительное обращение. «Оскорбляет» ясно передаёт межличностную и богословскую силу высказывания, не сужая её до культового богохульства.
- source_word: עֹשֵׂהוּ
  choice: его Создателя
  rationale: Буквально — «сделавшего его»; суффикс естественно относится к бедному. «Его Создателя» сохраняет личную связь и богословское основание достоинства человека.
- source_word: שָׂמֵחַ
  choice: кто радуется
  rationale: Форма выражает состояние или устойчивую нравственную позицию; конструкция «кто радуется» естественна для русского изречения.
- source_word: לְאֵיד
  choice: чужой беде
  rationale: אֵיד означает бедствие, несчастье или гибель. Добавление «чужой» не меняет референта, подразумеваемого глаголом злорадства, и делает русский текст естественным и недвусмысленным.
- source_word: לֹא יִנָּקֶה
  choice: не останется без наказания
  rationale: 'Нифаль глагола נקה здесь допускает судебно-нравственный смысл: не быть признанным невиновным либо не избежать наказания. Основной текст передаёт наиболее естественный в контексте смысл, а сноска сохраняет юридическую альтернативу.'
theological_decisions:
- issue: К кому относится «его Создателя»
  choice: Создатель бедного — Бог; насмешка над бедным тем самым оскорбляет Бога.
  alternative: 'Передать обобщённо: «оскорбляет Создателя», без притяжательного отношения.'
  rationale: Местоименный суффикс в עֹשֵׂהוּ естественно отсылает к бедному. Перевод сохраняет эту грамматическую связь, не добавляя прямого имени Бога, которого нет в тексте.
- issue: Смысл לֹא יִנָּקֶה
  choice: Не избежит наказания.
  alternative: Не будет признан невиновным; не будет оправдан.
  rationale: Форма сохраняет как карательный, так и судебный оттенок. В основном тексте выбран естественный русский эквивалент для нравственного последствия, а альтернативный судебный смысл отмечен в сноске.
- issue: Обобщающий мужской род
  choice: Сохранить грамматически мужское единственное число в парной конструкции «кто... тот».
  alternative: Использовать множественное число или обезличенную конструкцию.
  rationale: Русская конструкция «кто... тот» является естественно обобщающей и не ограничивает смысл только мужчинами, одновременно сохраняя единственное число еврейского изречения.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным строением пословицы. «Создатель» написано с прописной буквы как обозначение Бога. Повтор «кто... тот» передаёт параллелизм исходного текста; слово «чужой» делает идиоматичным выражение радости по поводу постигшего другого бедствия.
