  text: מְֽשַׁדֶּד אָ֭ב יַבְרִ֣יחַ אֵ֑ם בֵּ֝֗ן מֵבִ֥ישׁ וּ/מַחְפִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/026.yaml
  text: He who devastates his father and drives away his mother is a son who brings shame and reproach[a].
translation:
  language: ru
  text: Кто разоряет отца и прогоняет мать, тот сын, приносящий стыд и позор[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто грабит отца и выгоняет мать, тот сын, навлекающий стыд и бесчестье».'
    reason: Лексические альтернативы отражают диапазон значений מְשַׁדֶּד, יַבְרִיחַ и двух заключительных причастий.
lexical_decisions:
- source_word: מְשַׁדֶּד
  choice: разоряет
  rationale: Причастие от שׁדד обозначает разорение, ограбление или губительное притеснение. «Разоряет» сохраняет сильный разрушительный смысл и не сводит поступок исключительно к краже.
- source_word: אָב
  choice: отца
  rationale: Естественная передача существительного в контексте семейных отношений; принадлежность понятна из последующего слова «сын» и параллели с матерью.
- source_word: יַבְרִיחַ
  choice: прогоняет
  rationale: Порода хифиль от ברח выражает понуждение бежать или удалиться. «Прогоняет» ясно сохраняет каузативный смысл.
- source_word: אֵם
  choice: мать
  rationale: Прямая и естественная передача существительного в параллели с «отца».
- source_word: בֵּן
  choice: тот сын
  rationale: Существительное предикативно характеризует описанного человека. Конструкция «тот сын» естественно связывает обе половины русского предложения, не устраняя общеобобщающий характер изречения.
- source_word: מֵבִישׁ
  choice: приносящий стыд
  rationale: 'Причастие хифиля от בוש имеет каузативное значение: такой сын причиняет или навлекает стыд.'
- source_word: וּמַחְפִּיר
  choice: и позор
  rationale: Второе причастие усиливает первое и связано с причинением бесчестья. В русском сочетание «приносящий стыд и позор» лаконично передаёт параллелизм, хотя формально второе причастие сжато до однородного существительного.
