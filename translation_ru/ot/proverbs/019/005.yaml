    issue: «Извергает ложь» усиливает образ речи.
    rationale: Русский глагол обычно подразумевает грубое, яростное или отталкивающее выплёвывание; еврейский глагол передаёт испускание дыхания и в переносном употреблении произнесение слов.
  - severity: medium
    issue: «Не спасётся» двусмысленно в современном религиозном русском.
    rationale: В данном параллелизме речь о невозможности уйти от наказания, а не о спасении в широком или богословском смысле.
