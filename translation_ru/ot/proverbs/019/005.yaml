  text: עֵ֣ד שְׁ֭קָרִים לֹ֣א יִנָּקֶ֑ה וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים לֹ֣א יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/005.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will not escape.
translation:
  language: ru
  text: Лжесвидетель не останется без наказания[a], и тот, кто изрекает ложь[b], не избежит наказания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет оправдан»; «не будет признан невиновным».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выдыхает ложь»; также возможно: «произносит ложь». Образ может подразумевать, что ложь исходит из человека свободно или постоянно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: лжесвидетель
  rationale: Ёмкое и естественное русское обозначение свидетеля, дающего ложные показания; сохраняет судебный оттенок еврейского выражения.
- source_word: יִנָּקֶה
  choice: не останется без наказания
  rationale: Nifal от נקה здесь допускает значения невиновности и освобождения от кары; выбранная формулировка естественно передаёт морально-судебный смысл, не сужая его до формального оправдания.
- source_word: וְיָפִיחַ כְּזָבִים
  choice: и тот, кто извергает ложь
  rationale: Глагол פוח буквально связан с выдыханием или выпусканием наружу. «Извергает ложь» сохраняет яркий образ свободно и непрестанно исходящей речи и звучит по-русски естественнее буквального «выдыхает ложь».
- source_word: כְּזָבִים
  choice: ложь
  rationale: Русское собирательное существительное естественно передаёт множественное число ложных высказываний и поддерживает параллелизм.
- source_word: יִמָּלֵט
  choice: не спасётся
  rationale: Nifal от מלט означает избежать опасности, ускользнуть или спастись. «Не спасётся» кратко и естественно выражает неизбежность воздаяния, сохраняя некоторую неопределённость относительно того, от чего именно невозможно уйти.
theological_decisions:
- issue: Характер неизбежного последствия для лжесвидетеля
  choice: не останется без наказания
  alternative: не будет признан невиновным
  rationale: Еврейский глагол допускает как судебное оправдание, так и освобождение от наказания. Основной текст передаёт более широкий смысл, а судебная альтернатива отмечена в сноске без догматического уточнения источника или формы кары.
translation_notes:
  register: Современный литературный русский язык с афористической краткостью. «Лжесвидетель» сохраняет юридический контекст, а «извергает ложь» — образность оригинала без чрезмерной буквальности.
