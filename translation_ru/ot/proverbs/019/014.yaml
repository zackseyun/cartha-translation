  yaml_path: translation/ot/proverbs/019/014.yaml
  text: A house and wealth are an inheritance from fathers[a], but a prudent wife is from Yahweh.
translation:
  language: ru
  text: Дом и богатство — наследство от отцов, а благоразумная жена[a] — от Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоразумная женщина». Древнееврейское אִשָּׁה может означать и «женщина», и «жена»; в данном контексте «жена» лучше соответствует противопоставлению наследуемому имуществу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: дом
  rationale: Сохраняет конкретное значение дома как наследуемого имущества и естественно сочетается с «богатством».
- source_word: הוֹן
  choice: богатство
  rationale: Передаёт материальное состояние или имущество в контексте наследования.
- source_word: נַחֲלַת
  choice: наследство
  rationale: Точно передаёт именное значение конструктивного сочетания «наследство отцов»; тире естественно восполняет бессвязочную конструкцию.
- source_word: אָבוֹת
  choice: от отцов
  rationale: Сохраняет явно мужской род и множественное число древнееврейского слова, не расширяя его до «родителей» или «предков».
- source_word: מֵיְהוָה
  choice: от Яхве
  rationale: Предлог מִן обозначает источник, а тетраграмматон передан личным именем «Яхве».
- source_word: אִשָּׁה
  choice: жена
  rationale: Хотя слово может означать также «женщина», супружеский смысл лучше соответствует противопоставлению наследуемому имуществу.
- source_word: מַשְׂכָּלֶת
  choice: благоразумная
  rationale: Передаёт практическую рассудительность, проницательность и умение поступать разумно, характерные для лексики Притчей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон; личное имя сохраняет указание на конкретного Бога как источник дара.
- issue: Смысл противопоставления
  choice: Материальное имущество получают от отцов, тогда как благоразумная жена представлена как дар, происходящий от Яхве.
  alternative: Благоразумная женщина — от Яхве.
  rationale: Контекст наследуемого дома и богатства указывает на супружеский смысл אִשָּׁה, но не устраняет его более широкую лексическую возможность.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная структура и именные предложения сохраняют афористичность оригинала. «Благоразумная» звучит достойно и передаёт практическую мудрость без конфессиональной конкретизации.
