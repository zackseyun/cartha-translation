source:
  edition: WLC
  text: יִרְאַ֣ת יְהוָ֣ה לְ/חַיִּ֑ים וְ/שָׂבֵ֥עַ יָ֝לִ֗ין בַּל יִפָּ֥קֶד רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/023.yaml
  text: The fear of Yahweh leads to life[a], and whoever has it will rest satisfied[c][b]; he will not be visited by harm.
translation:
  language: ru
  text: Страх перед Яхве ведёт к жизни[a]; боящийся Его будет ночевать довольным[b], и беда его не постигнет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «служит жизни» или «к жизни»; еврейское выражение очень кратко.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет проводить ночь довольным»; глагол буквально указывает на ночлег или пребывание ночью.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не будет посещён бедой». Здесь «беда» означает несчастье или вред, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: страх перед Яхве
  rationale: «Страх» сохраняет силу еврейского יִרְאָה, включающего благоговейный трепет и почитание, а личное имя יהוה передано как «Яхве».
- source_word: לְחַיִּים
  choice: ведёт к жизни
  rationale: Предельно краткое еврейское выражение допускает значение направленности или результата; этот вариант естественен по-русски и сохраняет широкое понятие жизни и благополучия.
- source_word: וְשָׂבֵעַ
  choice: довольным
  rationale: Слово означает состояние насыщенности и удовлетворённости; «довольным» не ограничивает смысл только физической сытостью.
- source_word: יָלִין
  choice: будет ночевать
  rationale: Глагол буквально обозначает пребывание или ночлег в течение ночи; перевод сохраняет конкретный образ безопасного покоя.
- source_word: בַּל יִפָּקֶד רָע
  choice: беда его не постигнет
  rationale: Естественная русская передача идиомы неблагоприятного «посещения»; רָע здесь означает беду или вред, а не нравственное зло.
theological_decisions:
- issue: Широта значения «жизни»
  choice: Сохранить общее слово «жизнь», не сужая его до долголетия, материального благополучия или вечной жизни.
  alternative: Передать как «служит жизни» либо истолковать преимущественно как обещание долгой жизни.
  rationale: В литературе мудрости «жизнь» охватывает жизнь, благополучие и процветание в установленном Богом порядке; контекст не требует более узкого толкования.
- issue: Характер обещания об избавлении от беды
  choice: 'Передать изречение как общую истину мудрости: «беда его не постигнет».'
  alternative: Истолковать как безусловную гарантию полного отсутствия любых страданий или как избавление от нравственного зла.
  rationale: Краткая форма притчи выражает общее правило, не отменяя библейского свидетельства о страданиях праведных; רָע в данном сочетании обозначает бедствие.
- issue: Неявный субъект второй строки
  choice: Передать подразумеваемого носителя страха словами «боящийся Его».
  alternative: 'Оставить эллипсис: «и довольным будет ночевать».'
  rationale: В еврейском субъект не назван явно, но продолжение естественно относится к человеку, живущему в страхе перед Яхве. Русское уточнение делает связь понятной, не добавляя отдельного богословского тезиса.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным строем притчи. Сохранены личное имя «Яхве», образ ночлега и обобщённый характер мудрого изречения; неестественная для русского пассивная идиома последней строки передана естественным выражением «беда его не постигнет».
