  text: קֹֽנֶה לֵּ֭ב אֹהֵ֣ב נַפְשׁ֑/וֹ שֹׁמֵ֥ר תְּ֝בוּנָ֗ה לִ/מְצֹא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/008.yaml
  text: Whoever gains sense loves his own life[b][a]; whoever keeps understanding will find good.
translation:
  language: ru
  text: Кто приобретает разум[a], тот любит свою жизнь[b]; кто хранит рассудительность, тот найдёт благо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приобретает сердце». В древнееврейской литературе мудрости «сердце» нередко означает разум и способность здраво судить.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «любит самого себя»; возможен также буквальный перевод «любит свою душу». Древнееврейское слово может обозначать самого человека или его жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹנֶה לֵב
  choice: приобретает разум
  rationale: Буквально сочетание означает «приобретает сердце», однако в древнееврейской литературе мудрости לֵב часто обозначает способность мыслить, здраво судить и различать. «Приобретает разум» естественно передаёт этот смысл по-русски.
- source_word: אֹהֵב נַפְשׁוֹ
  choice: любит свою жизнь
  rationale: נֶפֶשׁ здесь может означать самого человека или его жизнь, а не только «душу» в узком смысле. Выражение «любит свою жизнь» сохраняет связь с заботой о собственном благе.
- source_word: שֹׁמֵר
  choice: хранит
  rationale: Причастие выражает постоянное бережное удержание и соблюдение; «хранит» кратко и достойно передаёт этот оттенок.
- source_word: תְּבוּנָה
  choice: рассудительность
  rationale: Слово обозначает понимание, проницательность и способность различать. «Рассудительность» подходит контексту практической мудрости и отличает этот термин от לֵב в первой строке.
- source_word: לִמְצֹא טוֹב
  choice: найдёт благо
  rationale: 'Конструкция указывает на итог или следствие сохранения рассудительности. «Найдёт благо» сохраняет широкое значение טוֹב: добро, благополучие или то, что хорошо.'
