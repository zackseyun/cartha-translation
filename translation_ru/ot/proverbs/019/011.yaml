  text: שֵׂ֣כֶל אָ֭דָם הֶאֱרִ֣יךְ אַפּ֑/וֹ וְ֝/תִפאַרְתּ֗/וֹ עֲבֹ֣ר עַל פָּֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/011.yaml
  text: A man's insight makes him slow to anger[b][a], and it is his glory to overlook an offense.
translation:
  language: ru
  text: Благоразумие человека не даёт ему быстро гневаться[a], и ему делает честь не замечать проступка[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «удлиняет его нос» — еврейская идиома, означающая долготерпение, то есть медленность на гнев.'
    reason: idiom_explanation
  - marker: b
    text: 'Или: «проходить мимо проступка»; также возможно: «не обращать внимания на обиду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל
  choice: благоразумие
  rationale: Слово обозначает практическую рассудительность, здравое понимание и умение поступать разумно; «благоразумие» естественно связывает это качество со сдержанностью.
- source_word: אָדָם
  choice: человека
  rationale: Здесь имеется в виду отдельный человек в обобщённом смысле; русское «человека» точно и естественно передаёт это значение.
- source_word: הֶאֱרִיךְ אַפּוֹ
  choice: делает человека медленным на гнев
  rationale: Буквально еврейская идиома говорит об «удлинении носа» и означает терпеливую задержку гнева. Выбранная формулировка сохраняет образное библейское выражение «медленный на гнев» и причинную связь с благоразумием.
- source_word: וְתִפאַרְתּוֹ
  choice: и слава его
  rationale: תִפְאֶרֶת может означать славу, честь или красоту. «Слава» сохраняет широту слова и обозначает то, что служит человеку честью.
- source_word: עֲבֹר עַל
  choice: не замечать
  rationale: Оборот буквально означает «проходить мимо, поверх» и в данном контексте говорит о сознательном отказе сосредоточиваться на причинённом зле или отвечать на него. «Не замечать» передаёт это без усиления до явно выраженного прощения.
- source_word: פָּשַׁע
  choice: проступка
  rationale: В межличностном контексте слово обозначает совершённое против человека нарушение или обиду. «Проступок» сохраняет нравственную серьёзность, не вводя излишне специальной богословской терминологии.
