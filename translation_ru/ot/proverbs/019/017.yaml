  terminology: «Яхве», «милостив», «бедный», «даёт взаймы» и «воздаст» согласованы с исходным текстом и уместны по регистру. Сноска корректно показывает более буквальную, намеренно тяжеловесную конструкцию с существительным גְמֻלוֹ и глаголом «воздаст».
