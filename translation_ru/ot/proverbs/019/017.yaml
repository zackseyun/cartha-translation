- from: Кто милостив к бедному, тот даёт взаймы Яхве, и Он воздаст ему за его доброе дело.[a]
  to: Кто милостив к бедному, тот даёт взаймы Яхве, и Он воздаст ему за то, что он сделал.[a]
  rationale: Убрано лишь невыраженное в оригинале оценочное слово «доброе». Формулировка «за то, что он сделал» передаёт связь воздаяния с поступком милостивого человека, не предрешая более узкое лексическое значение גְּמוּל; буквальная возможность «его воздаяние» сохранена в сноске.
