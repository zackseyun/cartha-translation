  text: מַלְוֵ֣ה יְ֭הוָה ח֣וֹנֵֽן דָּ֑ל וּ֝/גְמֻל֗/וֹ יְשַׁלֶּם לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/017.yaml
  text: Whoever is gracious to the poor lends to Yahweh[a], and he will repay him for his deed.
translation:
  language: ru
  text: Кто милостив к бедному, тот даёт взаймы Яхве, и Он воздаст ему за то, что он сделал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и его воздаяние Он воздаст ему».'
    reason: Буквальная альтернатива сохраняет вынесенное вперёд וּגְמֻלוֹ и однокоренную по смыслу конструкцию воздаяния, которая по-русски звучит тяжеловесно.
lexical_decisions:
- source_word: מַלְוֵה
  choice: даёт взаймы
  rationale: Порода hифиль глагола לוה означает «давать взаймы». Сохраняется яркая метафора займа, а не заменяется общим «помогает» или «даёт».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: חֹנֵן
  choice: милостив к
  rationale: Причастие от חנן обозначает проявление милости или благоволения. Оборот «милостив к» естественен по-русски и сохраняет связь с понятием милости.
- source_word: דָּל
  choice: бедному
  rationale: В данном контексте דָּל прежде всего указывает на бедного, малоимущего человека; дательный падеж обусловлен русским управлением.
- source_word: וּגְמֻלוֹ
  choice: за его доброе дело
  rationale: גְּמוּל может обозначать поступок, оказанное добро или воздаяние. В сочетании с «воздаст» этот перевод естественно выражает ответ Яхве на милосердный поступок, а более буквальная конструкция вынесена в сноску.
- source_word: יְשַׁלֶּם
  choice: воздаст
  rationale: Порода пиэль глагола שלם здесь означает отплатить или возместить. «Воздаст» сохраняет смысл ответного возмещения и подходит возвышенному, но понятному регистру притчи.
- source_word: לוֹ
  choice: ему
  rationale: Местоимение естественнее всего относится к человеку, проявившему милость к бедному; русская форма «ему» также отражает исходную предложную конструкцию.
theological_decisions:
- issue: Метафорическая связь помощи бедному с отношением к Богу
  choice: Проявление милости к бедному прямо представлено как заём, данный Яхве, Который Сам воздаст благотворителю.
  alternative: 'Передать общий смысл парафразом: Бог замечает и награждает щедрость.'
  rationale: Исходный текст явно использует метафору займа и называет Яхве его получателем. Её сохранение передаёт тесное отождествление Божьего отношения к помощи бедному, не добавляя дальнейших догматических выводов.
- issue: Референт подлежащего в заключительной части
  choice: «Он» относится к Яхве.
  alternative: Оставить подлежащее невыраженным и полагаться только на контекст.
  rationale: В еврейском глаголе подлежащее выражено грамматически и по контексту относится к Яхве. Заглавная буква помогает русскому читателю без изменения смысла.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. Конструкция «кто…, тот…» естественно передаёт обобщённое значение двух еврейских причастных форм; имя «Яхве» и метафора займа сохранены.
