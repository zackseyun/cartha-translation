  text: Luxury is not fitting for a fool[c][b][a], much less for a servant to rule over princes.
translation:
  language: ru
  text: Глупцу не подобает роскошь[a], а тем более рабу[b] властвовать над князьями[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удовольствие», «наслаждение». Еврейское слово может обозначать удовольствие вообще, но здесь, вероятно, имеется в виду жизнь в достатке и неге.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слуге». Еврейское עֶבֶד охватывает разные виды зависимого положения; перевод «раб» подчёркивает резкость описанной социальной перемены.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «знатными людьми», «сановниками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֶה
  choice: подобает
  rationale: Передаёт оценку уместности и соответствия; краткая формула естественна для русского изречения и сохраняет возвышенно-назидательный тон.
- source_word: כְסִיל
  choice: глупец
  rationale: В Притчах это прежде всего нравственно-духовный тип, а не просто человек с низким интеллектом; «глупец» сохраняет традиционный смысл языка мудрости.
- source_word: תַּעֲנוּג
  choice: роскошь
  rationale: Слово может обозначать удовольствие или наслаждение, но в данном социальном противопоставлении, вероятно, подразумевает обеспеченную, изнеженную жизнь; «роскошь» ёмко выражает этот оттенок.
- source_word: אַף כִּי
  choice: тем более
  rationale: Оборот вводит более резкий и предосудительный случай в рассуждении от меньшего к большему; русское «тем более» естественно передаёт усиление.
- source_word: עֶבֶד
  choice: раб
  rationale: В контексте важен низкий, несвободный статус и резкая социальная перемена; «раб» сохраняет силу противопоставления лучше, чем более широкое «слуга».
- source_word: מְשֹׁל
  choice: властвовать
  rationale: Инфинитив обозначает осуществление власти. «Властвовать над» кратко и точно передаёт иерархический характер действия.
- source_word: שָׂרִים
  choice: князья
  rationale: Слово обозначает высокопоставленных вождей, сановников или знатных лиц. «Князья» сохраняет высокий общественный ранг и остроту контраста.
