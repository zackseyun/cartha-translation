base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/027.yaml
  text: Cease[a], my son, to hear instruction and to stray from the words of knowledge.
translation:
  language: ru
  text: Сын мой, перестань слушать наставление[a], уводящее от слов знания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза сжата и допускает другое членение: «Сын мой, перестань слушать наставление — и уклонишься от слов знания» или «Сын мой, перестань слушать наставление и уклоняться от слов знания».'
    reason: alternative_reading
lexical_decisions:
- source_word: חַדַל
  choice: Перестань
  rationale: Повелительная форма мужского рода единственного числа прямо призывает прекратить действие; «перестань» естественно звучит в современном русском наставлении.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохранены мужской род, единственное число и характерное для литературы мудрости обращение; порядок слов поддерживает dignified proverbial register.
- source_word: לִשְׁמֹעַ
  choice: слушать
  rationale: В данном контексте שמע означает не просто физически слышать, а воспринимать наставление; русский глагол «слушать» передаёт осознанное внимание.
- source_word: מוּסָר
  choice: наставление
  rationale: מוּסָר охватывает обучение, исправление и дисциплину. «Наставление» естественно сочетается со «слушать» и подходит контексту мудрости, не сужая смысл до наказания.
- source_word: לִשְׁגוֹת
  choice: и собьёшься
  rationale: Инфинитив выражает уклонение или заблуждение. Из-за сжатого синтаксиса он истолкован как следствие прекращения слушания; личная форма делает эту связь ясной по-русски, но альтернативная синтаксическая трактовка сохранена в сноске.
- source_word: מֵאִמְרֵי
  choice: со слов
  rationale: Предлог מן указывает на удаление или отклонение от чего-либо, а אמרים — на высказывания или слова. «Сбиться со слов» сохраняет образ отделения, хотя оборот намеренно несколько необычен, как и исходная строка.
- source_word: דָעַת
  choice: знания
  rationale: דעת в Притчах обозначает знание в сфере мудрости; прямой эквивалент «знание» сохраняет ключевую лексику книги.
theological_decisions:
- issue: Синтаксическая связь לִשְׁגוֹת с повелением חַדַל
  choice: 'Основной текст понимает уклонение как следствие прекращения слушания наставления: «перестань… и собьёшься».'
  alternative: 'Возможно понимать оба инфинитива как зависимые от «перестань»: «перестань слушать наставление и уклоняться от слов знания»; возможно также видеть здесь предостережение не слушать наставление, которое уводит от знания.'
  rationale: Еврейский синтаксис предельно сжат и допускает разные способы членения. Основной вариант отражает распространённое и контекстуально связное предупреждение, а сноска не устраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с кратким, назидательным строем притчи. Обращение «сын мой» сохраняет традиционный тон литературы мудрости. Тире обозначает предполагаемую связь результата, не скрывая отмеченной в сноске синтаксической неоднозначности.
