translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены резкость глагола «ненавидят» и трудная неоднозначность заключительной фразы; инверсия «друзья его» придаёт строке умеренно возвышенное, но понятное звучание.
