  text: כָּ֥ל אֲחֵי רָ֨שׁ שְֽׂנֵאֻ֗/הוּ אַ֤ף כִּ֣י מְ֭רֵעֵ/הוּ רָחֲק֣וּ מִמֶּ֑/נּוּ מְרַדֵּ֖ף אֲמָרִ֣ים לא הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/007.yaml
  text: All the brothers of a poor man hate him[a]; how much more do his friends keep far from him! He pursues words[b], but they are not there.
translation:
  language: ru
  text: Все братья бедняка ненавидят его[a]; тем более сторонятся его друзья! Он гонится за словами — но их нет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «братья» имеет форму мужского рода; в социальном контексте этой притчи оно может относиться к членам семьи бедняка.
    reason: cultural_note
  - marker: b
    text: 'Последняя часть стиха в еврейском тексте синтаксически и текстуально трудна. Возможны понимания: «Он гонится за словами, которых нет»; возможно, имеются в виду обещания, которые не исполняются.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשׁ
  choice: бедняк
  rationale: Единственное число мужского рода обозначает обедневшего или неимущего человека; «бедняк» естественно и кратко передаёт это значение.
- source_word: אֲחֵי
  choice: братья
  rationale: Сохраняет прямое семейное значение конструктивной формы; в данном социальном контексте речь идёт о братьях бедняка.
- source_word: שְׂנֵאֻהוּ
  choice: ненавидят его
  rationale: Передаёт обычное и сильное значение корня שׂנא без неоправданного смягчения.
- source_word: אַף כִּי
  choice: тем более
  rationale: 'Ясно передаёт усилительную логику a fortiori: если даже братья ненавидят, то друзья тем более удаляются.'
- source_word: מְרֵעֵהוּ
  choice: друзья его
  rationale: В противопоставлении братьям существительное естественно обозначает друзей или близких товарищей.
- source_word: רָחֲקוּ מִמֶּנּוּ
  choice: сторонятся
  rationale: Естественно по-русски передаёт не только пространственную удалённость, но и намеренное социальное дистанцирование.
- source_word: מְרַדֵּף
  choice: Он гонится
  rationale: Причастная форма синтаксически трудна; личная глагольная конструкция естественно продолжает описание бедняка и сохраняет образ настойчивого преследования.
- source_word: אֲמָרִים
  choice: за словами
  rationale: Основное значение — «слова, высказывания»; более контекстуальные варианты вроде «обещания» оставлены для примечания.
- source_word: לֹא הֵמָּה
  choice: но их нет
  rationale: Сохраняет краткость и неоднозначность трудного заключения, соотнося местоимение со «словами», но не уточняя сверх текста, отсутствуют ли слова, обещания или сами говорящие.
