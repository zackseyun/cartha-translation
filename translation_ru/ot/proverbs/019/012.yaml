base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/012.yaml
  text: A king’s wrath is like the growling of a young lion[b][a], but his favor is like dew on the grass.
translation:
  language: ru
  text: Гнев царя — словно рык молодого льва, а его благоволение — словно роса на траве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַהַם
  choice: рык
  rationale: Существительное обозначает рычание или рёв льва. «Рык» естественно звучит по-русски и сохраняет краткость еврейского образа.
- source_word: כְּפִיר
  choice: молодой лев
  rationale: Слово обычно обозначает молодого, уже сильного и опасного льва; перевод «молодой лев» точен и понятен.
- source_word: זַעַף
  choice: гнев
  rationale: Слово выражает сильный гнев или ярость. «Гнев» сохраняет возвышенный тон и хорошо сочетается с образом царской власти.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Прямой и стилистически уместный перевод в контексте библейской литературы мудрости.
- source_word: וּכְטַל
  choice: а ... словно роса
  rationale: Союз ו формально соединяет две части, но их смысловое противопоставление естественно передаётся русским «а». Образ росы сохранён буквально.
- source_word: עַל
  choice: на
  rationale: Естественный русский эквивалент пространственного предлога в сочетании «роса на траве».
- source_word: עֵשֶׂב
  choice: трава
  rationale: В данном поэтическом образе «трава» — наиболее естественный и наглядный русский эквивалент.
- source_word: רְצוֹנוֹ
  choice: его благоволение
  rationale: Слово может означать благоволение, расположение, одобрение или удовольствие. В противопоставлении царскому гневу «благоволение» точно передаёт благосклонное отношение правителя и сохраняет достойный регистр.
