id: PRO.19.22
reference: Proverbs 19:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: תַּאֲוַ֣ת אָדָ֣ם חַסְדּ֑/וֹ וְ/טֽוֹב רָ֝שׁ מֵ/אִ֥ישׁ כָּזָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/022.yaml
  text: What is desired in a man is his steadfast love[b][a], and a poor man is better than a liar.
translation:
  language: ru
  text: Желанна в человеке его верная любовь[a][b], и бедняк лучше лжеца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Желание человека — его верная любовь». Первая строка на еврейском кратка и может говорить либо о желанном качестве человека, либо отождествлять его желание с его любовью, добротой или верностью.'
    reason: alternative_reading
  - marker: b
    text: «Верная любовь» передаёт еврейское חֶסֶד, которое в зависимости от контекста может также означать доброту, преданность или неизменную любовь.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: Желанна
  rationale: Существительное может обозначать как «желание», так и «то, что желательно». Предикативная передача естественна по-русски и сохраняет вероятный смысл первой строки.
- source_word: אָדָם
  choice: в человеке
  rationale: Здесь слово обозначает отдельного человека в общем мудром изречении; «человек» передаёт родовое значение без ненужного сужения к мужскому полу.
- source_word: חַסְדּוֹ
  choice: его верная любовь
  rationale: חֶסֶד сочетает значения любви, доброты и верности. «Верная любовь» сохраняет нравственную и relationalную устойчивость понятия, не вводя специально заветной терминологии.
- source_word: וְטוֹב
  choice: и ... лучше
  rationale: Союз и прилагательное вводят сравнительную вторую строку; связка подразумевается и естественно восполняется по-русски.
- source_word: רָשׁ
  choice: бедняк
  rationale: Субстантивированное слово обозначает бедного человека; «бедняк» кратко и естественно соответствует форме афоризма.
- source_word: מֵאִישׁ
  choice: лучше ... лжеца
  rationale: Предлог מִן выражает сравнение; איש с последующим כָּזָב характеризует человека, с которым сравнивается бедняк.
- source_word: כָּזָב
  choice: лжеца
  rationale: В сочетании אִישׁ כָּזָב слово характеризует ложного, лживого человека. «Лжец» — краткий и идиоматичный русский эквивалент.
theological_decisions:
- issue: Неоднозначный синтаксис первой строки
  choice: «Желанна в человеке его верная любовь» — качество человека названо желанным
  alternative: «Желание человека — его верная любовь»
  rationale: Краткая еврейская конструкция допускает оба прочтения; основной текст передаёт вероятный предикативный смысл, а примечание сохраняет альтернативу без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная формулировка. Сохранены сравнительная структура и подлинная неоднозначность первой строки.
