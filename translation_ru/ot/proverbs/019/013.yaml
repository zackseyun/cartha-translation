  text: הַוֺּ֣ת לְ֭/אָבִי/ו בֵּ֣ן כְּסִ֑יל וְ/דֶ֥לֶף טֹ֝רֵ֗ד מִדְיְנֵ֥י אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/013.yaml
  text: A foolish son is ruin to his father[a], and a wife’s quarrels are a continual dripping.
translation:
  language: ru
  text: Глупый сын — бедствие для своего отца, а ссоры жены — непрестанная капель.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Глупый сын — погибель для своего отца, а распри жены — беспрерывная течь».'
    reason: Лексические варианты для הַוּוֹת, מִדְיְנֵי и образного דֶּלֶף טֹרֵד.
lexical_decisions:
- source_word: הַוּוֹת
  choice: бедствие
  rationale: Форма множественного числа имеет усилительное или отвлечённое значение и обозначает губительное бедствие; этот вариант естественно передаёт силу выражения, не вводя идею буквального разорения.
- source_word: לְאָבִיו
  choice: для своего отца
  rationale: 'Предлог לְ обозначает отношение и воздействие: глупый сын становится бедствием для собственного отца.'
- source_word: בֵּן כְּסִיל
  choice: глупый сын
  rationale: В Притчах כְּסִיל обозначает не просто недостаток ума, а нравственно неразумного человека; традиционное и понятное выражение «глупый сын» сохраняет этот смысл в контексте книги.
- source_word: דֶּלֶף טֹרֵד
  choice: непрестанная капель
  rationale: Сочетание рисует образ постоянно капающей из-за протечки воды. «Непрестанная капель» кратко и образно передаёт длительное, изнуряющее раздражение.
- source_word: מִדְיְנֵי
  choice: ссоры
  rationale: Множественное число обозначает повторяющиеся распри или пререкания; «ссоры» — естественный современный русский эквивалент.
- source_word: אִשָּׁה
  choice: жены
  rationale: Хотя слово может означать женщину вообще, домашний контекст и параллель с отцом указывают здесь на жену.
