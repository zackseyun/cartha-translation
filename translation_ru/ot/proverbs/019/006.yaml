id: PRO.19.6
reference: Proverbs 19:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רַ֭בִּים יְחַלּ֣וּ פְנֵֽי נָדִ֑יב וְ/כָל הָ֝/רֵ֗עַ לְ/אִ֣ישׁ מַתָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/006.yaml
  text: Many seek the favor of a noble man[b][a], and everyone is a friend to a man who gives gifts.
translation:
  language: ru
  text: Многие ищут благосклонности щедрого человека[a], и всякий — друг тому, кто дарит подарки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знатного человека». Еврейское נָדִיב может означать знатного, благородного или щедрого человека; связь со второй половиной стиха поддерживает значение «щедрый».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и всякий — друг человеку даров».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Многие
  rationale: Кратко и естественно передаёт количественное значение и сохраняет афористический строй.
- source_word: יְחַלּוּ פְנֵי
  choice: ищут благосклонности
  rationale: Идиома буквально связана с «лицом», но означает стремление снискать расположение или обращение с просьбой; выбранный вариант естественен по-русски и сохраняет оба смысловых оттенка.
- source_word: נָדִיב
  choice: щедрого человека
  rationale: Слово может обозначать знатного, благородного или щедрого человека. Параллель с человеком, который дарит подарки, делает значение «щедрый» наиболее вероятным, при этом альтернатива отмечена в сноске.
- source_word: וְכָל הָרֵעַ
  choice: и всякий — друг
  rationale: Передаёт всеобщность כָל и именное значение רֵעַ «друг, товарищ» без ослабления до простой дружелюбности.
- source_word: לְאִישׁ מַתָּן
  choice: тому, кто дарит подарки
  rationale: Буквально конструкция означает «человеку даров»; функциональное русское выражение ясно передаёт человека, располагающего к себе подарками.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким афористическим синтаксисом. Тире обозначает отсутствующую в еврейском именную связку; неоднозначность נָדִיב сохранена в сноске.
