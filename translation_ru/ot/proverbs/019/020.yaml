  text: Listen to counsel and accept discipline[a], so that you may become wise in the end.
translation:
  language: ru
  text: Слушай совет и принимай наставление, чтобы в будущем стать мудрым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «впоследствии», «под конец жизни» или «в конечном итоге». Еврейское слово אַחֲרִית может обозначать будущее, поздний период жизни или конечный исход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: слушай
  rationale: Повелительная форма означает не просто услышать звук, а внимательно выслушать и принять к сведению; «слушай» естественно передаёт это в контексте наставления мудрости.
- source_word: עֵצָה
  choice: совет
  rationale: Слово обозначает обдуманное руководство или совет; русский эквивалент сохраняет вес высказывания и звучит естественно.
- source_word: וְקַבֵּל
  choice: и принимай
  rationale: Повелительная форма выражает сознательное, добровольное принятие; несовершенный вид уместен рядом с «слушай» как общее жизненное наставление.
- source_word: מוּסָר
  choice: наставление
  rationale: В Притчах слово охватывает обучение, воспитание и исправление. «Наставление» понятно современному читателю и не сужает смысл до наказания, хотя оттенок исправления остаётся в контексте принятия наставления.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно передаёт целевое значение еврейской частицы.
- source_word: תֶּחְכַּם
  choice: стать мудрым
  rationale: Форма глагола в данном контексте указывает на достижение или обретение мудрости как результат принятого совета, а не только на статичное состояние.
- source_word: בְּאַחֲרִיתֶךָ
  choice: в будущем
  rationale: אַחֲרִית может обозначать последующее время, итог или поздний период жизни. «В будущем» даёт ясный и естественный основной текст, а сноска сохраняет более широкий диапазон исходного выражения.
theological_decisions:
- issue: Временной или итоговый смысл בְּאַחֲרִיתֶךָ
  choice: Сохранить в основном тексте общее временное значение «в будущем» и отметить многозначность в сноске.
  alternative: «под конец жизни» или «в конечном итоге»
  rationale: Контекст не требует однозначно ограничивать выражение старостью либо окончательным жизненным итогом; сноска сохраняет подлинную смысловую открытость.
translation_notes:
  register: Современный литературный русский язык; краткая форма афоризма и параллелизм двух повелений сохранены. Лексика понятна широкому кругу читателей и сохраняет назидательный, достойный тон.
