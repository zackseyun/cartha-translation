  yaml_path: translation/ot/proverbs/019/001.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his speech and is a fool[a][b].
translation:
  language: ru
  text: Лучше бедняк, живущий честно, чем тот, кто говорит криво и глуп[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чем глупец, который говорит криво». Еврейский синтаксис позволяет понимать заключительные слова «и он глупец» как более краткое обозначение того, с кем сравнивается бедняк.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «идущий в своей цельности». В еврейском языке «ходить» может означать вести определённый образ жизни; «цельность» здесь включает честность и нравственную прямоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: 'Сравнительная формула пословицы: одно состояние предпочтительнее другого.'
- source_word: רָשׁ
  choice: бедняк
  rationale: Мужская форма единственного числа обозначает бедного человека; краткое существительное естественно в русской пословице.
- source_word: הוֹלֵךְ
  choice: живущий
  rationale: Передаёт еврейскую метафору хождения как образа жизни естественным современным русским языком; буквальный образ отмечен в сноске.
- source_word: בְּתֻמּוֹ
  choice: непорочно
  rationale: תֹּם/תֻּם указывает на цельность и нравственную прямоту; «непорочно» передаёт качество поведения, не обязательно утверждая абсолютную безгрешность.
- source_word: מֵעִקֵּשׁ שְׂפָתָיו
  choice: чем тот, чьи уста лживы
  rationale: עִקֵּשׁ буквально выражает искривлённость или извращённость, а «уста» метонимически означают речь. «Лживы» естественно передаёт нравственно испорченную речь, сохраняя образ уст.
- source_word: וְהוּא כְסִיל
  choice: и кто глуп
  rationale: Сохраняет простое присоединение последней характеристики и относит её к противопоставленному человеку, не устраняя синтаксическую сжатость оригинала.
theological_decisions:
- issue: К кому относится וְהוּא כְסִיל («и он глупец»)
  choice: 'К человеку с порочными устами: «чем тот, чьи уста лживы и кто глуп»'
  alternative: «чем глупец с лживыми устами»
  rationale: Оба варианта дают в основном одинаковое отнесение, но еврейский синтаксис допускает более самостоятельное присоединение заключительной фразы. Основной текст сохраняет координацию, а компактный вариант дан в сноске.
translation_notes:
  register: Современный литературный русский с кратким, афористичным строем. Сохранён библейский образ «уста», тогда как метафора «ходить» ради естественности раскрыта как «жить» и отмечена в сноске.
