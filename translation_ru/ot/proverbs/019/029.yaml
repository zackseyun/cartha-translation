  text: נָכ֣וֹנוּ לַ/לֵּצִ֣ים שְׁפָטִ֑ים וּ֝/מַהֲלֻמ֗וֹת לְ/גֵ֣ו כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/029.yaml
  text: Judgments are prepared for scoffers[a], and beatings for the back of fools.
translation:
  language: ru
  text: Для насмешников готовы наказания[a], а удары — по спинам глупцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Для насмешников уготованы суды».'
    reason: Еврейские נָכוֹנוּ и שְׁפָטִים допускают более формальную передачу «уготованы суды», тогда как основной текст явно выражает подразумеваемый карательный смысл.
lexical_decisions:
- source_word: נָכוֹנוּ
  choice: готовы
  rationale: Нифаль перфекта от כון выражает состояние приготовленности или установленности; «готовы» естественно передаёт мысль о наказаниях, уже ожидающих своих адресатов.
- source_word: לַלֵּצִים
  choice: для насмешников
  rationale: לץ обозначает людей, которые надменно и презрительно глумятся; «насмешники» сохраняет нравственную окраску термина в литературе мудрости.
- source_word: שְׁפָטִים
  choice: наказания
  rationale: Слово может означать «суды», «судебные решения» или «приговоры», но параллелизм с ударами подчёркивает здесь карательный смысл; «наказания» ясно передаёт его в современном русском.
- source_word: מַהֲלֻמוֹת
  choice: удары
  rationale: Существительное во множественном числе обозначает удары; выбран прямой и естественный русский эквивалент без уточнения способа наказания.
- source_word: לְגֵו
  choice: для спины
  rationale: גֵּו может обозначать спину или туловище; при упоминании ударов наиболее конкретно и естественно «спина». Единственное число сохранено как собирательное в соответствии с еврейским текстом.
- source_word: כְּסִילִים
  choice: глупцов
  rationale: כסיל — устойчивое обозначение нравственно упрямого глупца в Притчах, а не просто человека с низкими умственными способностями; традиционное «глупцы» сохраняет этот смысловой тип.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с кратким афористическим строем. Союз «а» передаёт параллельное сопоставление двух частей. Формулировка не смягчает образ телесного наказания и сохраняет собирательное единственное число «спины».
