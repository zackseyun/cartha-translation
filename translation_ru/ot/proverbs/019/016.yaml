  text: שֹׁמֵ֣ר מִ֭צְוָה שֹׁמֵ֣ר נַפְשׁ֑/וֹ בּוֹזֵ֖ה דְרָכָ֣י/ו יומת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/016.yaml
  text: Whoever keeps the commandment keeps his life[b][a]; he who despises his ways will die.
translation:
  language: ru
  text: Кто соблюдает заповедь, тот хранит свою жизнь[b]; кто презирает свои пути[a], тот будет предан смерти[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто пренебрегает своим поведением». Возможно также понимание: «кто презирает Божьи пути».'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово не́феш в зависимости от контекста может означать «жизнь», «сам человек» или «душа».
    reason: lexical_alternative
  - marker: c
    text: 'Еврейская форма пассивная; также возможно: «умрёт».'
    reason: grammatical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: соблюдает / хранит
  rationale: 'Повтор причастия передан двумя естественными русскими соответствиями: заповедь «соблюдают», а жизнь «хранят». Оба выражают постоянное, бережное следование и сохраняют словесную связь между частями первой строки.'
- source_word: מִצְוָה
  choice: заповедь
  rationale: Единственное число сохранено; в пословичном контексте слово имеет обобщённый смысл — то, что заповедано.
- source_word: נַפְשׁוֹ
  choice: свою жизнь
  rationale: В данном контексте נֶפֶשׁ означает прежде всего жизнь или самого человека, а не «душу» как специальный антропологический термин. Противопоставление смерти поддерживает перевод «жизнь».
- source_word: בּוֹזֵה
  choice: презирает
  rationale: Передаёт выраженное в еврейском причастии устойчивое пренебрежительное отношение.
- source_word: דְרָכָיו
  choice: свои пути
  rationale: 'Местоименный суффикс третьего лица естественно отнесён к субъекту: речь идёт о его собственных путях, то есть поведении. Образ «путей» сохранён.'
- source_word: יומת
  choice: умрёт
  rationale: Хотя масоретская форма допускает пассивное «будет предан смерти», в пословичном контексте «умрёт» естественно выражает смертельный исход и не вводит не названного в тексте исполнителя.
theological_decisions:
- issue: К кому относятся «его пути»
  choice: 'К путям самого человека: «свои пути»'
  alternative: К Божьим путям либо в общем смысле к пути заповеди
  rationale: Суффикс грамматически естественно соотносится с субъектом второй части. Поскольку Бог прямо не назван, этот референт не добавлен в основной текст; неоднозначность отмечена в сноске.
- issue: Значение נֶפֶשׁ
  choice: жизнь
  alternative: душа; сам человек
  rationale: Параллель со смертью указывает на жизнь человека и не требует более позднего технического понимания «души».
- issue: Залог и смысл יומת
  choice: умрёт
  alternative: будет предан смерти; будет умерщвлён
  rationale: Форма в масоретском тексте формально пассивна, однако контекст допускает выражение неизбежного смертельного результата без указания действующего лица. Альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены параллелизм, единственное число «заповедь» и образ «путей». Маркеры сносок поставлены непосредственно после соответствующих выражений.
