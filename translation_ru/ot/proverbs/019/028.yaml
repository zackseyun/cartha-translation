source:
  edition: WLC
  text: עֵ֣ד בְּ֭לִיַּעַל יָלִ֣יץ מִשְׁפָּ֑ט וּ/פִ֥י רְ֝שָׁעִ֗ים יְבַלַּע אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/028.yaml
  text: A worthless witness mocks justice[c][b][a], and the mouth of the wicked swallows iniquity.
translation:
  language: ru
  text: Негодный свидетель насмехается над правосудием[a], а уста нечестивых поглощают зло[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глумится над справедливым судом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жадно глотают нечестие»; еврейское слово может также означать беду или обман.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד בְּלִיַּעַל
  choice: негодный свидетель
  rationale: Сочетание обозначает свидетеля, нравственно негодного и порочного. Такой перевод естественен по-русски и не превращает בְּלִיַּעַל в позднейшее имя собственное.
- source_word: יָלִיץ
  choice: насмехается над
  rationale: В данном контексте форма глагола выражает презрительное, глумливое отношение; «насмехается над» ясно передаёт направленность действия.
- source_word: מִשְׁפָּט
  choice: правосудием
  rationale: В сочетании со свидетелем слово имеет судебно-нравственный смысл и может означать правосудие, справедливый суд или судебное решение. «Правосудие» сохраняет юридический контекст.
- source_word: וּפִי רְשָׁעִים
  choice: а уста нечестивых
  rationale: Сохранена телесная метафора «уста» и множественное число רְשָׁעִים; высокий, но понятный регистр соответствует стилю притчи.
- source_word: יְבַלַּע
  choice: поглощают
  rationale: Глагол буквально означает «глотать, поглощать». Выбор сохраняет яркую метафору, связанную с устами, не уточняя сверх текста, идёт ли речь о жадном вкушении или уничтожении.
- source_word: אָוֶן
  choice: зло
  rationale: Слово допускает значения «зло, нечестие, беда, обман». «Зло» естественно и ёмко передаёт нравственный смысл, не сужая его до одного вида проступка.
theological_decisions:
- issue: Статус בְּלִיַּעַל
  choice: 'Нарицательная нравственная характеристика: «негодный»'
  alternative: 'Имя собственное: «Велиар»'
  rationale: В древнееврейском контексте Притч слово описывает порочность или негодность; прочтение как имени персонифицированного злого существа отражает более позднее употребление и здесь не требуется.
translation_notes:
  register: Современный литературный русский с достоинством библейской притчи. «Уста» выбраны вместо разговорного «рот» ради параллелизма и регистра; синтаксис остаётся кратким и афористичным.
