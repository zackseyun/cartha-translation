  text: Strike a scoffer[a], and the simple will become shrewd; rebuke one who has understanding[c][b], and he will gain knowledge.
translation:
  language: ru
  text: Ударь насмешника[a] — и неопытный станет осмотрительным[b]; обличи проницательного[c] — и он приобретёт знание.
  philosophy: optimal-equivalence
