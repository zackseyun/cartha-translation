lexical_decisions:
- source_word: לֵץ
  choice: насмешник
  rationale: В Притчах это человек, который презрительно высмеивает наставление и мудрость. «Насмешник» передаёт нравственную окраску слова, не ограничивая его значением шутника.
- source_word: תַּכֶּה
  choice: ударь
  rationale: Форма от נכה обозначает нанесение удара как наказание. Прямой глагол «ударь» сохраняет конкретность еврейского текста и не смягчает её до общего «накажи».
- source_word: פֶתִי
  choice: неопытный
  rationale: Это характерное для литературы мудрости обозначение неискушённого, легковерного человека. «Неопытный» звучит естественно и не приписывает ему умственной неспособности.
- source_word: יַעְרִם
  choice: станет осмотрительным
  rationale: Глагол от ערם здесь означает приобрести практическую рассудительность, осторожность или проницательность. «Станет осмотрительным» естественно передаёт непереходный смысл формы.
- source_word: וְהוֹכִיחַ
  choice: обличи
  rationale: Глагол יכח здесь означает указать человеку на ошибку с целью исправления. «Обличи» сохраняет краткость и серьёзный тон наставления.
- source_word: לְנָבוֹן
  choice: проницательного
  rationale: נָבוֹן обозначает человека, способного понимать и различать. Субстантивированное «проницательного» сохраняет личный и единственный референт, не добавляя слова «мужчина».
- source_word: יָבִין דָּעַת
  choice: приобретёт знание
  rationale: Буквально сочетание связано с пониманием или постижением знания; в данном контексте оно описывает результат принятого обличения. «Приобретёт знание» естественно передаёт этот результат, сохраняя различие между проницательностью человека и новым знанием.
