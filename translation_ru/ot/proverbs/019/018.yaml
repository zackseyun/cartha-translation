  text: יַסֵּ֣ר בִּ֭נְ/ךָ כִּי יֵ֣שׁ תִּקְוָ֑ה וְ/אֶל הֲ֝מִית֗/וֹ אַל תִּשָּׂ֥א נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/018.yaml
  text: Discipline your son[a], for there is hope[b]; do not set your heart on putting him to death.
translation:
  language: ru
  text: Наставляй сына своего, ведь есть надежда[a]; не стремись умертвить его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока есть надежда». Еврейскую фразу можно понять и как указание на причину («ведь есть надежда»), и как указание на время («пока есть надежда»).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не поднимай души своей к умерщвлению его» — то есть не направляй своего желания или решимости к его смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: Наставляй
  rationale: Пиэль императива יסר означает исправляющее воспитание или дисциплинарное наставление. «Наставляй» естественно и достойно звучит по-русски, передавая цель исправления, хотя оттенок наказания выражает менее резко, чем «наказывай».
- source_word: בִּנְךָ
  choice: сына своего
  rationale: Еврейский текст прямо говорит о сыне; родовая конкретность сохранена. Постпозиция «своего» поддерживает краткий афористический регистр.
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: пока есть надежда
  rationale: Частица כִּי допускает здесь как причинное, так и временное понимание. В основном тексте выбрано естественное в контексте родительского наставления временное прочтение; причинное сохранено в сноске.
- source_word: הֲמִיתוֹ
  choice: погубить его
  rationale: Каузативный инфинитив от מות буквально означает «умертвить его, причинить ему смерть». «Погубить его» передаёт смертельный исход и в русском афористическом контексте звучит естественнее, чем канцелярское «предать его смерти».
- source_word: אַל תִּשָּׂא נַפְשֶׁךָ
  choice: не стремись
  rationale: Буквально «не поднимай своей души»; идиома обозначает направленность желания или решимости. «Не стремись» кратко выражает волевую направленность, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Смысл предостережения во второй половине стиха
  choice: 'Запрещена разрушительная, смертельно опасная суровость: исправление должно быть направлено на надежду, а не на гибель сына.'
  alternative: Не отказывайся от наказания, иначе сын погибнет; либо не доводи себя до возбуждения, способного причинить ему смерть.
  rationale: Синтаксис естественнее всего понимается как запрет направлять желание или решимость к тому, чтобы умертвить сына. Перевод сохраняет противопоставление исправительного наставления и смертельного исхода, не вводя идею, будто именно отсутствие наказания непосредственно причинит смерть.
- issue: Значение כִּי в первой половине стиха
  choice: 'В основном тексте — временное: «пока есть надежда».'
  alternative: 'Причинное: «ведь есть надежда» или «потому что есть надежда».'
  rationale: Оба значения грамматически возможны. Временное прочтение хорошо передаёт срочность воспитательного действия, но причинное остаётся подлинной неоднозначностью и потому вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным афористическим строем. «Наставляй» избегает архаичного «вразумляй» и не сводит исправление исключительно к телесному наказанию. Союз «но» естественно передаёт смысловой контраст двух полустиший.
