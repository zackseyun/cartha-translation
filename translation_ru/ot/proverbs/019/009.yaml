lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: лжесвидетель
  rationale: Сочетание буквально означает «свидетель лжи» и обозначает ложного свидетеля; слитное русское слово естественно и сохраняет судебный оттенок.
- source_word: לֹא יִנָּקֶה
  choice: не останется без наказания
  rationale: Nifal глагола נקה может означать «быть признанным невиновным, остаться чистым/свободным». В данном предостережении естественный русский оборот передаёт неизбежность возмездия, не устраняя юридическую смысловую грань, отмеченную в сноске.
- source_word: וְיָפִיחַ
  choice: и тот, кто извергает
  rationale: Причастная форма от פוח изображает ложь как нечто выдыхаемое или испускаемое. «Извергает» сохраняет яркий образ непрерывно исходящей из уст лжи и звучит естественно в русском изречении.
- source_word: כְּזָבִים
  choice: ложь
  rationale: Множественное число в еврейском обозначает ложные высказывания; собирательное русское «ложь» здесь наиболее естественно.
- source_word: יֹאבֵד
  choice: погибнет
  rationale: Qal глагола אבד обычно означает «погибнуть, пропасть». «Погибнет» кратко и прямо сохраняет силу параллельного предостережения.
