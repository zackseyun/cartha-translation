id: PRO.19.3
reference: Proverbs 19:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִוֶּ֣לֶת אָ֭דָם תְּסַלֵּ֣ף דַּרְכּ֑/וֹ וְ/עַל יְ֝הוָ֗ה יִזְעַ֥ף לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/003.yaml
  text: A man's folly ruins his way[b][a], and his heart rages against Yahweh.
translation:
  language: ru
  text: Глупость человека[a] губит его путь[b], а сердце его негодует на Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «человек» употреблено здесь в обобщённом смысле — о любом человеке.
    reason: cultural_note
  - marker: b
    text: 'Или: «искажает его путь»; буквальный образ — делает путь кривым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Передаёт качество и состояние неразумия и сохраняет характерное для литературы мудрости противопоставление глупости и мудрости.
- source_word: אָדָם
  choice: человека
  rationale: 'Единственное число употреблено обобщённо: речь идёт о любом человеке. Русское «человек» естественно выражает это значение.'
- source_word: תְּסַלֵּף
  choice: губит
  rationale: Форма породы пиэль означает «искривлять, искажать, расстраивать». В контексте жизненного пути «губит» естественно передаёт пагубный результат собственной глупости; более буквальные варианты приведены в примечании.
- source_word: דַּרְכּוֹ
  choice: его путь
  rationale: Сохраняет устойчивую для Притч метафору образа и хода жизни.
- source_word: וְעַל
  choice: а ... на
  rationale: 'Противительное «а» естественно выражает смысловой контраст: человек сам губит свой путь, но направляет негодование на Бога. Предлог «на» соответствует русскому управлению глагола «негодовать».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: יִזְעַף
  choice: негодует
  rationale: Передаёт сильный гнев и возмущение, направленные против Яхве, без добавления внешней бурной реакции, которой глагол сам по себе не обязательно требует.
- source_word: לִבּוֹ
  choice: сердце его
  rationale: Сохраняет древнееврейский антропологический образ сердца как средоточия внутренних мыслей, чувств и воли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Обобщённое единственное число אָדָם
  choice: человека
  alternative: мужчины; людей
  rationale: Здесь אָדָם обозначает отдельного представителя человеческого рода и не ограничивает смысл мужчинами; форма единственного числа сохраняет лаконичный характер притчи.
- issue: Причина испорченного жизненного пути и негодование на Бога
  choice: 'Сохранена последовательность исходного текста: собственная глупость губит путь человека, а его сердце негодует на Яхве'
  alternative: Явно добавить, что человек обвиняет Бога
  rationale: Мысль об обвинении Бога подразумевается, но прямо не высказана; перевод не делает скрытый вывод частью основного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Выражение «сердце его» намеренно сохраняет библейский образ и слегка возвышенный регистр, оставаясь понятным современному читателю.
