  text: A hot-tempered man bears the penalty[a], for if you rescue him, you will only have to do it again.
translation:
  language: ru
  text: 'Человек, охваченный сильным гневом, несёт наказание[a]: если избавишь его, тебе придётся делать это снова.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному смыслу: «человек великого гнева»; еврейское выражение кратко характеризует человека сильным гневом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גרל חֵמָה
  choice: Вспыльчивый
  rationale: Компактное сочетание буквально характеризует человека как отмеченного яростью или сильным гневом. Субстантивированное «вспыльчивый» естественно передаёт личное значение и сохраняет образ горячего нрава без тяжеловесного «обладатель ярости».
- source_word: נֹשֵׂא
  choice: несёт
  rationale: Причастие נשׂא означает «нести» и здесь выражает общее, закономерное положение; настоящее время подходит для афористического высказывания.
- source_word: עֹנֶשׁ
  choice: наказание
  rationale: Слово обозначает наказание, взыскание или кару. «Наказание» не уточняет его форму и сохраняет широкое значение оригинала.
- source_word: כִּי אִם
  choice: если
  rationale: В данном кратком построении сочетание вводит условное обоснование первой части. Русское бессоюзное присоединение после двоеточия естественно выражает эту связь.
- source_word: תַּצִּיל
  choice: избавишь его
  rationale: Hiphil от נצל означает «избавить, спасти». Местоимение «его» восполняет подразумеваемый объект — вспыльчивого человека.
- source_word: וְעוֹד תּוֹסִף
  choice: придётся делать это снова
  rationale: Буквально выражение значит «и ещё добавишь / продолжишь». Контекст подразумевает повторное избавление; русский вариант ясно передаёт эллипсис, не уточняя способ вмешательства.
