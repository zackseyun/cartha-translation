- source_word: חוֹטֵא
  choice: сбивается с пути
  rationale: Передаёт возможный здесь практический смысл корня חטא — промахиваться, поступать ошибочно, — сохраняя связь с образом поспешного движения; вариант «грешит» также возможен.
