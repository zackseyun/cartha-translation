  text: Wealth adds many friends[a], but a poor man is separated from his friend.
translation:
  language: ru
  text: Богатство умножает число друзей, а бедняк оказывается отделён от своего друга.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедняка оставляет его друг». Еврейский глагол обозначает отделение, но не уточняет, удаляется ли сам бедняк или его оставляет друг; контекст скорее подразумевает, что от бедняка отворачиваются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: богатство
  rationale: Слово обозначает материальное состояние или имущество; «богатство» сохраняет широту значения и естественно звучит по-русски.
- source_word: יֹסִיף
  choice: прибавляет
  rationale: Порода хифиль глагола יסף означает «добавлять, увеличивать»; здесь богатство увеличивает число друзей.
- source_word: רֵעִים רַבִּים
  choice: много друзей
  rationale: רֵעִים может обозначать друзей, товарищей или близких; в контексте социальных связей уместно «друзей», а רַבִּים передаёт их многочисленность.
- source_word: דָל
  choice: бедняк
  rationale: Слово обозначает бедного, слабого или человека низкого положения; «бедняк» кратко сохраняет единственное число и афористический стиль.
- source_word: מֵרֵעֵהוּ
  choice: со своим другом
  rationale: Предлог מִן указывает на удаление или отделение от друга; русская конструкция «разлучён со своим другом» естественно передаёт это отношение и сохраняет единственное число.
- source_word: יִפָּרֵד
  choice: разлучён
  rationale: Нифаль от פרד может выражать состояние отделения, не уточняя, кто его вызвал. «Разлучён» сохраняет эту неопределённость лучше, чем явное «друг его бросает».
