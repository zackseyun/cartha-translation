  text: Laziness brings on deep sleep[b][a], and a slack person will go hungry.
translation:
  language: ru
  text: 'Лень погружает в глубокий сон,

    а нерадивый человек будет голодать.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нерадивая душа будет голодать». Еврейское נֶפֶשׁ («душа») здесь может означать самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְלָה
  choice: лень
  rationale: Существительное обозначает лень, праздность; «лень» — ясное и естественное соответствие в современном русском языке.
- source_word: תַּפִּיל
  choice: погружает
  rationale: Каузативная форма глагола נפל буквально выражает действие «заставляет впасть». В сочетании с глубоким сном русское «погружает» естественно передаёт этот образ и причинное значение.
- source_word: תַּרְדֵּמָה
  choice: глубокий сон
  rationale: Слово означает тяжёлый, глубокий сон, а не просто сонливость; выбранное соответствие сохраняет интенсивность.
- source_word: נֶפֶשׁ
  choice: человек
  rationale: נֶפֶשׁ здесь обозначает самого человека, его личность, а не отдельную нематериальную часть; «человек» ясно передаёт контекстуальный смысл.
- source_word: רְמִיָּה
  choice: нерадивый
  rationale: В данном контексте слово указывает на небрежность, вялость или уклонение от труда. «Нерадивый» сохраняет нравственную оценку и не повторяет буквально «ленивый» из первой строки.
- source_word: תִרְעָב
  choice: будет голодать
  rationale: Форма означает «быть голодным, терпеть голод». «Будет голодать» естественно передаёт следствие нерадивости, не усиливая его до значения «умрёт с голоду».
