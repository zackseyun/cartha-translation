source:
  edition: WLC
  text: רַבּ֣וֹת מַחֲשָׁב֣וֹת בְּ/לֶב אִ֑ישׁ וַ/עֲצַ֥ת יְ֝הוָ֗ה הִ֣יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/021.yaml
  text: Many are the plans in a man's heart[a], but the counsel of Yahweh will stand.
translation:
  language: ru
  text: Много замыслов в сердце человека[a], но совет Господа устоит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мыслей»; или: «намерений»; или: «планов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Много
  rationale: Предикативное слово вынесено в начало, как в еврейском тексте; это сохраняет акцент и естественно звучит по-русски.
- source_word: מַחֲשָׁבוֹת
  choice: замыслов
  rationale: Слово обозначает мысли, намерения или планы; «замыслы» передаёт целенаправленное внутреннее обдумывание и хорошо сочетается с последующим «советом».
- source_word: בְּלֶב אִישׁ
  choice: в сердце человека
  rationale: «Сердце» сохраняет древнееврейское представление о внутреннем центре мышления и воли; איש здесь имеет обобщающее значение, естественно передаваемое словом «человек».
- source_word: וַעֲצַת
  choice: но совет
  rationale: Союз ו в антитетическом параллелизме передаёт противопоставление, поэтому выбран русский союз «но». «Совет» сохраняет широкий смысл решения, намерения или установленного замысла.
- source_word: יְהוָה
  choice: Господа
  rationale: Традиционная и узнаваемая русская библейская передача тетраграмматона; она не добавляет конфессионально специфического толкования.
- source_word: הִיא
  choice: не выражено отдельным местоимением
  rationale: В русском отдельное «он» здесь возможно, но без него фраза звучит естественнее; смысловой акцент сохраняется порядком слов и противопоставлением.
- source_word: תָקוּם
  choice: устоит
  rationale: Глагол קום здесь означает сохраниться в силе, осуществиться или оказаться незыблемым. «Устоит» сохраняет образ стойкости и лаконичность изречения.
theological_decisions:
- issue: Человеческие замыслы и Божье намерение
  choice: Стих противопоставляет множество человеческих замыслов совету Господа, который устоит.
  alternative: 'Детерминистский пересказ: «осуществляется только Божий план».'
  rationale: Еврейский текст утверждает устойчивость и действенность совета Господа, но не раскрывает здесь исчерпывающим образом причинную связь между ним и каждым человеческим решением.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным пословичным ритмом. Сохранены образ «сердца» и контраст между человеческими замыслами и советом Господа.
