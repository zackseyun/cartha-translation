  text: The sluggard buries his hand in the dish[b][a]; he will not even bring it back to his mouth.
translation:
  language: ru
  text: Ленивец зарывает руку в блюдо[a] — даже ко рту её не поднесёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прячет руку в блюде»; еврейский глагол может означать «прятать», «скрывать» или «зарывать». Возможны также: «миска», «чаша».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: погружает
  rationale: Глагол означает «прятать, скрывать, зарывать». В сочетании с рукой и блюдом русское «погружает» естественно передаёт яркую гиперболическую картину, не сводя действие к нейтральному «кладёт».
- source_word: עָצֵל
  choice: ленивец
  rationale: Устойчивое обозначение человека, которому свойственна лень; краткая форма соответствует афористическому языку книги Притч и понятна современному читателю.
- source_word: יָדוֹ
  choice: руку
  rationale: Сохранены единственное число и принадлежность руки ленивцу; в русском притяжательное отношение ясно из конструкции.
- source_word: בַּצַּלָּחַת
  choice: в блюдо
  rationale: Существительное обозначает блюдо, миску или чашу для пищи. «Блюдо» не уточняет без необходимости форму сосуда и хорошо подходит к контексту еды.
- source_word: גַּם
  choice: даже
  rationale: 'Частица усиливает нелепость описываемой лени: человек не совершает даже следующего, самого малого движения.'
- source_word: אֶל־פִּיהוּ
  choice: ко рту
  rationale: Буквально сохранён конкретный образ рта в ситуации еды.
- source_word: לֹא יְשִׁיבֶנָּה
  choice: не поднесёт её
  rationale: Каузативная форма שוב буквально выражает возвращение руки; в русском контексте еды «поднести её ко рту» естественно передаёт завершение движения. Женское местоимение «её» однозначно относится к руке.
