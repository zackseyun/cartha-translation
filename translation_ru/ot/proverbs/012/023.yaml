  yaml_path: translation/ot/proverbs/012/023.yaml
  text: A prudent man conceals knowledge[b][a], but the heart of fools proclaims folly.
translation:
  language: ru
  text: Благоразумный человек скрывает знание[a], а сердце глупцов возвещает глупость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Проницательный человек покрывает знание». Древнееврейское прилагательное может также иметь оттенок «хитрый», а глагол буквально означает «покрывает».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сердце глупцов выкрикивает глупость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: человек
  rationale: В изречении имеется в виду отдельный человек; русское «человек» естественно передаёт родовое значение формы мужского рода.
- source_word: עָרוּם
  choice: благоразумный
  rationale: В контексте Притч слово обозначает положительную рассудительность и осмотрительность, хотя может также означать «проницательный» или «хитрый».
- source_word: כֹּסֶה
  choice: скрывает
  rationale: Причастие буквально означает «покрывает» и в данном контексте передаёт сознательное удерживание знания от необдуманного разглашения.
- source_word: דָּעַת
  choice: знания
  rationale: Основное значение — «знание»; форма множественного числа естественнее по-русски в сочетании «скрывает свои знания» и не меняет смысла.
- source_word: לֵב
  choice: сердце
  rationale: Сохранён древнееврейский образ внутреннего человека — его мышления, воли и расположения.
- source_word: כְּסִילִים
  choice: глупцов
  rationale: Это устойчивая нравственно-интеллектуальная категория в литературе мудрости; «глупцы» передаёт её без разговорного снижения.
- source_word: יִקְרָא
  choice: возвещает
  rationale: Глагол буквально значит «зовёт», «взывает»; здесь он описывает открытое, заметное выражение глупости.
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Прямой и естественный русский эквивалент ключевого термина Притч, обозначающего нравственную и умственную неразумность.
