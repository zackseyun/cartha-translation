  terminology: «Благоразумный», «сердце», «глупцы/глупцов» и «глупость» удачно передают лексику литературы мудрости. Альтернативное «проницательный» допустимо для עָרוּם; «хитрый» следует сохранять как более контекстно удалённую, но возможную лексическую окраску. Сноска b корректно отражает буквальное «выкрикивает/взывает», хотя «провозглашает» ближе к основному переводу.
