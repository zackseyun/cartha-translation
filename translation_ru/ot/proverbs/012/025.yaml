source:
  edition: WLC
  text: דְּאָגָ֣ה בְ/לֶב אִ֣ישׁ יַשְׁחֶ֑/נָּה וְ/דָבָ֖ר ט֣וֹב יְשַׂמְּחֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/025.yaml
  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
translation:
  language: ru
  text: Тревога в сердце человека гнетёт его[a], а доброе слово радует его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставляет его поникнуть». Еврейский глагол рисует образ того, кого пригнули или склонили вниз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּאָגָה
  choice: тревога
  rationale: Существительное обозначает тревожную заботу, беспокойство. «Тревога» естественно передаёт внутреннее тягостное состояние, не добавляя значения простой заботы.
- source_word: בְלֶב אִישׁ
  choice: в сердце человека
  rationale: 'Буквально: «в сердце человека/мужчины». Здесь אִישׁ употреблено как обобщающее обозначение человека, а «сердце» в еврейской антропологии охватывает внутренний мир личности.'
- source_word: יַשְׁחֶנָּה
  choice: гнетёт его
  rationale: Каузативная форма глагола שׁחח/שׁחה передаёт образ того, что заставляют поникнуть, склоняют или придавливают. «Гнетёт» сохраняет образ тяжести и звучит естественно по-русски.
- source_word: וְדָבָר טוֹב
  choice: а доброе слово
  rationale: דָבָר может означать слово, речь, дело или весть. «Доброе слово» сохраняет широту выражения, а союз «а» ясно передаёт противопоставление строк.
- source_word: יְשַׂמְּחֶנָּה
  choice: радует его
  rationale: Пиэль от שׂמח имеет каузативное значение «делать радостным». «Радует» кратко и естественно передаёт этот смысл.
theological_decisions:
- issue: Референт местоименных суффиксов женского рода в יַשְׁחֶנָּה и יְשַׂמְּחֶנָּה
  choice: Передать мужским местоимением «его», соотнося действие с человеком как носителем сердца.
  alternative: Передать «его [сердце]» либо «её», соотнося суффикс с тревогой.
  rationale: Синтаксис допускает обсуждение референта суффиксов, однако параллелизм описывает противоположное воздействие тревоги и доброго слова на внутреннего человека. Русское «его» естественно соотносится с ближайшим «человека» и не требует искусственного олицетворения тревоги.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная форма сохранена. «Гнетёт» выбрано как понятное и dignified выражение, удерживающее телесную метафору подавленности. Обобщающее «человек» естественно включает любого человека.
