  yaml_path: translation/ot/proverbs/012/026.yaml
  text: The righteous person is a guide to his neighbor[b][a], but the way of the wicked leads them astray.
translation:
  language: ru
  text: 'Праведник тщательно выбирает себе друзей[a][b],

    а путь нечестивых вводит их в заблуждение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переданное здесь словом «друзей», может также означать «ближний», «друг» или «товарищ».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Праведник превосходит своего ближнего». Еврейская форма יָתֵר здесь трудна для истолкования, поэтому такое традиционное понимание также возможно.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָתֵר
  choice: служит проводником
  rationale: Значение этой формы спорно. В контексте противопоставления пути нечестивых, который уводит в заблуждение, активное значение наставления или направления наиболее естественно передаёт поэтическую антитезу, не превращая её в развёрнутое толкование.
- source_word: מֵרֵעֵהוּ
  choice: своему ближнему
  rationale: רֵעַ обозначает ближнего, друга или товарища. «Ближний» сохраняет широкий общественный смысл слова; предлог מִן понимается в связи с трудной конструкцией первой строки, а не передаётся буквально как «от» или «чем».
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное естественно и кратко передаётся традиционным русским обозначением праведного человека.
- source_word: וְדֶרֶךְ
  choice: а путь
  rationale: Союз ו передан противительным «а», поскольку две строки образуют антитетический параллелизм.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Обычное для литературы мудрости обозначение людей, чьи поступки и образ жизни противостоят праведности.
- source_word: תַּתְעֵם
  choice: вводит их в заблуждение
  rationale: Порода Hiphil глагола תעה выражает причинение блуждания или уклонения с суффиксом третьего лица множественного числа. Русское выражение сохраняет и каузативность, и переносный смысл.
theological_decisions:
- issue: Кто подразумевается местоимением «их» во второй строке
  choice: Сохранено множественное «их» без уточнения референта
  alternative: «уводит самих нечестивых» или «уводит других»
  rationale: Еврейский суффикс множественного числа не требует однозначно уточнять, кого именно вводит в заблуждение путь нечестивых; перевод сохраняет эту неоднозначность.
- issue: Смысл спорной формы יָתֵר
  choice: Образ праведника как проводника ближнему
  alternative: Праведник превосходит своего ближнего
  rationale: Основной вариант следует контрасту со второй строкой, однако традиционное сравнительное понимание остаётся филологически возможным и вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем пословицы. «Служит проводником» звучит естественно и достойно, поддерживая смысловой контраст с путём, который вводит в заблуждение. Подлинная лексическая неопределённость первой строки сохранена в примечании.
