  text: A truthful lip is established forever[b][a], but a lying tongue lasts only a moment.
translation:
  language: ru
  text: Правдивые уста останутся навеки, а лживый язык — лишь на мгновение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение во второй строке трудно для истолкования; вероятный смысл — лживая речь существует лишь недолго, в противоположность непреходящей истине.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפַת אֱמֶת
  choice: правдивые уста
  rationale: Буквально «уста истины». Русское «правдивые уста» естественно передаёт нравственное качество речи и сохраняет конкретный поэтический образ; множественное число соответствует русскому употреблению слова «уста».
- source_word: תִּכּוֹן
  choice: пребудут
  rationale: Нифаль глагола כון обозначает утверждённость, прочность и устойчивое существование. «Пребудут» в сочетании «вовек» кратко и достойно передаёт постоянство, противопоставленное мгновенности лжи.
- source_word: לָעַד
  choice: вовек
  rationale: Передаёт неограниченную длительность и сохраняет лаконичный, возвышенный регистр изречения.
- source_word: לְשׁוֹן שָׁקֶר
  choice: лживый язык
  rationale: Сохраняет телесный образ языка как органа речи; «лживый» естественно передаёт определительное сочетание со словом שָׁקֶר.
- source_word: וְעַד אַרְגִּיעָה
  choice: а … лишь на мгновение
  rationale: Трудное еврейское выражение в антитетическом контексте указывает на кратковременность ложной речи. Союз «а» ясно передаёт противопоставление, а «лишь на мгновение» — наиболее вероятный смысл без попытки скрыть текстовую трудность, отмеченную в сноске.
