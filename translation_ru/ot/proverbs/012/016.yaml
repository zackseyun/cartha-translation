  yaml_path: translation/ot/proverbs/012/016.yaml
  text: A fool’s anger is known at once[b][a], but a prudent man covers shame.
translation:
  language: ru
  text: Гнев глупца обнаруживается сразу[a], а благоразумный скрывает позор[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в тот день» или «в день»; возможно: «в тот же день».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «скрывает оскорбление»; еврейское слово может также означать «бесчестье» или «унижение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: глупец
  rationale: В литературе мудрости это нравственно и практически неразумный человек, а не просто человек с недостатком интеллекта; «глупец» кратко и точно передаёт противопоставленный тип характера.
- source_word: בַּיּוֹם
  choice: сразу
  rationale: Буквально «в тот день / в день»; в данном изречении выражение, вероятнее всего, указывает на немедленность проявления гнева. Буквальная возможность сохранена в примечании.
- source_word: יִוָּדַע
  choice: обнаруживается
  rationale: Нифаль от ידע передаёт значение «становится известным, явным». «Обнаруживается» естественно по-русски выражает эту непереходную пассивно-результативную идею.
- source_word: כַּעְסוֹ
  choice: гнев
  rationale: Слово обозначает гнев, досаду или раздражение; «гнев» ясно и ёмко передаёт смысл в контексте открытой реакции глупца.
- source_word: וְכֹסֶה
  choice: а ... скрывает
  rationale: Причастие от כסה значит «покрывать, скрывать». «Скрывает» естественно сочетается с выбранным уточнённым объектом, а союз «а» передаёт контраст между двумя типами поведения.
- source_word: קָלוֹן
  choice: нанесённое бесчестье
  rationale: קָלוֹן может означать позор, бесчестье, унижение или оскорбление. В контексте реакции на провокацию сочетание «нанесённое бесчестье» сохраняет связь с позором и допускает смысл пережитого оскорбления.
- source_word: עָרוּם
  choice: благоразумный
  rationale: В Притчах слово обычно положительно характеризует осмотрительного, рассудительного человека. Субстантивированное «благоразумный» звучит естественно и сохраняет обобщённость еврейского мужского единственного числа.
theological_decisions:
- issue: Смысл сокрытия קָלוֹן
  choice: Благоразумный не выставляет напоказ нанесённое ему бесчестье и сдерживает ответную реакцию.
  alternative: Благоразумный скрывает собственный позор или вообще постыдное дело.
  rationale: Контраст с немедленно обнаруживающимся гневом глупца поддерживает понимание קָלוֹן как пережитого унижения или оскорбления, однако лексическая неоднозначность не устраняется и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. Сохранён контраст между несдержанностью глупца и сдержанностью благоразумного; неоднозначные обстоятельство времени и объект глагола вынесены в примечания.
