  text: בְּ/אֹֽרַח צְדָקָ֥ה חַיִּ֑ים וְ/דֶ֖רֶךְ נְתִיבָ֣ה אַל מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/028.yaml
  text: In the path of righteousness is life[a], and in its pathway there is no death.
translation:
  language: ru
  text: На пути праведности — жизнь[a], и на её стезе нет смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а её стезя — бессмертие». Так можно понять трудную еврейскую формулировку второй строки.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹרַח
  choice: На пути
  rationale: אֹרַח обозначает путь или образ жизни; предлог ב передан как «на», что естественно по-русски и сохраняет метафору нравственного пути.
- source_word: צְדָקָה
  choice: праведности
  rationale: В данном контексте мудрости слово указывает на нравственную правоту и праведный образ жизни; «праведность» сохраняет этический и богословский объём понятия.
- source_word: חַיִּים
  choice: жизнь
  rationale: Форма морфологически множественного числа в еврейском идиоматически обозначает жизнь; по-русски естественно единственное число.
- source_word: וְדֶרֶךְ נְתִיבָה
  choice: и на её стезе
  rationale: Сжатое и трудное поэтическое выражение передано как параллель к первой строке. Местоимение «её» отсылает к праведности, а «стезя» сохраняет различие между близкими обозначениями пути и соответствует достойному поэтическому регистру.
- source_word: אַל־מָוֶת
  choice: нет смерти
  rationale: אַל понято как отрицание, а מָוֶת — как «смерть». Такая передача сохраняет прямое противопоставление жизни и смерти, не внося исправления в основной текст.
theological_decisions:
- issue: Толкование трудной второй строки ודרך נתיבה אל־מות
  choice: «и на её стезе нет смерти» — путь праведности не связан со смертью и не ведёт к ней.
  alternative: «и её стезя — бессмертие»; возможно также понимание направления «к смерти», хотя оно хуже согласуется с контекстом.
  rationale: Масоретский текст предельно сжат и допускает разные способы синтаксического анализа. Основной перевод сохраняет естественную антитезу между праведностью, жизнью и смертью, а традиционное понимание со значением «бессмертие» вынесено в примечание, чтобы не скрывать неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Слово «стезя» слегка возвышенно, но понятно и уместно для параллелизма книги Притч; тире перед «жизнь» передаёт именную структуру и афористическую выразительность.
