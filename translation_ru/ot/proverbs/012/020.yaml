base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/020.yaml
  text: Deceit is in the heart of those who devise evil[b][a], but joy belongs to those who counsel peace.
translation:
  language: ru
  text: 'В сердце тех, кто замышляет зло, — обман,

    а у тех, кто советует мир[a], — радость.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское слово שָׁלוֹם может означать не только мир, но и благополучие, целостность и добрые отношения.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִרְמָה
  choice: обман
  rationale: Существительное обозначает обман, коварный умысел или ложь. «Обман» кратко и естественно передаёт внутреннюю нравственную установку, противопоставленную радости.
- source_word: בְּלֶב
  choice: в сердце тех
  rationale: В библейском употреблении «сердце» — средоточие мыслей, намерений и решений. Русское выражение сохраняет этот образ без сведения его только к чувствам.
- source_word: חֹרְשֵׁי רָע
  choice: тех, кто замышляет зло
  rationale: Причастие от חרשׁ здесь указывает на обдумывание или подготовку злого замысла. «Замышляет зло» передаёт намеренность действия точнее, чем общее «делает зло».
- source_word: וּלְיֹעֲצֵי שָׁלוֹם
  choice: а у тех, кто стремится советом к миру
  rationale: לְ обозначает тех, кому присуща радость, а причастие от יעץ описывает советующих или составляющих благие замыслы. Формулировка сохраняет смысл совета, направленного к миру, и избегает неестественного русского сочетания «советовать мир».
- source_word: שָׁלוֹם
  choice: миру
  rationale: «Мир» — основное и наиболее узнаваемое соответствие, подходящее для противопоставления злым замыслам; более широкий смысл благополучия и целостности отмечен в сноске.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Сохранена именная форма древнееврейского текста. Безглагольная конструкция естественно передана по-русски оборотом «у тех… — радость».
