  text: לֹא יְאֻנֶּ֣ה לַ/צַּדִּ֣יק כָּל אָ֑וֶן וּ֝/רְשָׁעִ֗ים מָ֣לְאוּ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/021.yaml
  text: No harm will happen to the righteous, but the wicked are filled with trouble.
translation:
  language: ru
  text: 'Не постигнет праведника никакая беда,

    а нечестивые полны зла.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать также «бедствие» или «несчастье».
    reason: Сохраняет лексическую неоднозначность רָע во второй строке, не вводя иной синтаксис или толковательное уточнение.
lexical_decisions:
- source_word: יְאֻנֶּה
  choice: постигнет
  rationale: Глагол в данной конструкции означает «случится с кем-либо, постигнет»; форма с отрицанием естественно передаётся как «не постигнет».
- source_word: כָּל־אָוֶן
  choice: никакая беда
  rationale: После отрицания כָּל естественно передаётся словом «никакая». אָוֶן имеет широкий диапазон значений — зло, бедствие, несчастье; в первой строке контекстуально уместно «беда».
- source_word: מָלְאוּ רָע
  choice: будут полны зла
  rationale: Сохранён образ наполненности и широкое значение רָע («зло; беда»). Прошедшая форма в афористическом параллелизме выражает устойчивую действительность и по-русски естественно звучит в будущем времени.
theological_decisions:
- issue: Абсолютная формулировка о праведнике и беде
  choice: Сохранить без поясняющего ограничения
  alternative: Не постигнет праведника окончательное зло / незаслуженная беда
  rationale: Еврейский текст не содержит слов «окончательное» или «незаслуженная». Напряжение между этим изречением и опытом страдания праведных не следует устранять добавлением толкования.
- issue: Значение רָע во второй строке
  choice: зло
  alternative: беда / несчастье
  rationale: רָע допускает как нравственное, так и бедственное значение. «Зло» сохраняет лексическую широту и контраст с праведником, но неоднозначность отмечена в сноске.
translation_notes:
  register: Краткий афористический параллелизм сохранён. Лексика современная, литературная и понятная; синтаксис торжественный, но не архаичный.
