  text: דֶּ֣רֶךְ אֱ֭וִיל יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/שֹׁמֵ֖עַ לְ/עֵצָ֣ה חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/015.yaml
  text: The way of a fool is right in his own eyes[b][a], but he who listens to counsel is wise.
translation:
  language: ru
  text: Путь глупца кажется ему правильным[a], а тот, кто прислушивается к совету, мудр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «правилен в его глазах» — еврейское выражение, обозначающее собственное суждение или самооценку человека.'
    reason: Пояснение еврейской идиомы и сохранение буквального образа оригинала.
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Сохраняет характерную для литературы мудрости метафору образа жизни и поведения, не сужая её до отдельного поступка.
- source_word: אֱוִיל
  choice: глупец
  rationale: В Притчах обозначает человека, лишённого мудрости как в рассуждении, так и в нравственном поведении; «глупец» — естественный и традиционный русский эквивалент.
- source_word: יָשָׁר
  choice: правилен
  rationale: 'В сочетании «в его глазах» слово выражает субъективную оценку: путь представляется верным. «Правилен» сохраняет оценочное значение, не приписывая пути объективной праведности.'
- source_word: בְּעֵינָיו
  choice: в его собственных глазах
  rationale: Сохраняет еврейский образ и передаёт идиоматический смысл личного суждения или самооценки; «собственных» подчёркивает контраст с принятием совета.
- source_word: וְשֹׁמֵעַ
  choice: а кто слушает
  rationale: Причастие описывает всякого человека, которому свойственно слушать; союз передан как «а», чтобы естественно выразить противопоставление.
- source_word: לְעֵצָה
  choice: совета
  rationale: Русское сочетание «слушать совета» соответствует языку мудрости и передаёт принятие обдуманного наставления.
- source_word: חָכָם
  choice: тот мудр
  rationale: Предикативная конструкция естественно передаёт мысль, что готовность слушать совет характеризует человека как мудрого.
theological_decisions:
- issue: Родовые формы единственного числа в обобщающей притче
  choice: 'Сохранить мужской род: «глупца», «его», «мудр»'
  alternative: «Глупому свой путь кажется правильным, а тот, кто слушает совет, мудр» или гендерно-нейтральная перестройка во множественном числе
  rationale: Еврейский текст использует грамматически мужские формы единственного числа как обобщающий образ. Русский мужской род естественно сохраняет форму источника и не ограничивает смысл только мужчинами.
- issue: Объективная правильность или субъективная оценка пути глупца
  choice: Сохранить буквальный образ «правилен в его собственных глазах»
  alternative: «кажется ему правильным»
  rationale: Так сохраняются и идиома источника, и напряжение между уверенностью глупца и действительной мудростью того, кто принимает совет; сноска поясняет более явно субъективное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью, свойственными афоризму. Сохранён параллелизм двух частей и образ «пути». Оборот «в его собственных глазах» слегка приподнят, но понятен современному читателю и намеренно удерживает образ оригинала.
