  yaml_path: translation/ot/proverbs/012/005.yaml
  text: The thoughts of the righteous are justice[b][a]; the counsels of the wicked are deceit.
translation:
  language: ru
  text: Мысли праведных — справедливость[a], а замыслы нечестивых — обман.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правосудие»; еврейское слово также может означать «суд», «право» или «то, что справедливо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: помыслы
  rationale: Слово охватывает мысли, намерения и планы. «Помыслы» естественно передаёт внутреннюю направленность и допускает оттенок намерений.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное обозначение праведных людей; родительный падеж естественно зависит от «помыслы».
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: Сохранена именная форма еврейского текста и параллель с «обман»; здесь слово характеризует помыслы как согласные со справедливостью.
- source_word: תַּחְבֻּלוֹת
  choice: замыслы
  rationale: Слово может обозначать советы, продуманные планы или стратегии. «Замыслы» сохраняет идею намеренного планирования, не добавляя само по себе чрезмерно зловещего оттенка.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Традиционное и понятное обозначение нравственно порочных людей, противопоставленных праведным.
- source_word: מִרְמָה
  choice: обман
  rationale: Прямо передаёт значение лжи, обмана или коварства и естественно звучит как именная часть сказуемого.
