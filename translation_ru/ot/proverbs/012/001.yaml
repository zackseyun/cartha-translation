lexical_decisions:
- source_word: אֹהֵב
  choice: Кто любит
  rationale: Причастие имеет обобщённое, характерное для пословицы значение. Такая конструкция естественна в современном русском языке и не ограничивает смысл лицом мужского пола.
- source_word: מוּסָר
  choice: наставление
  rationale: В Притчах слово обозначает формирующее наставление, включающее обучение, исправление и дисциплину. «Наставление» естественно по-русски и сохраняет эту широту лучше, чем более узкое «наказание».
- source_word: דָּעַת
  choice: знание
  rationale: Прямое и устойчивое соответствие, сохраняющее ключевую для литературы мудрости тему знания.
- source_word: וְשֹׂנֵא
  choice: а кто ненавидит
  rationale: Союз передан как противопоставительный «а», что естественно оформляет антитетический параллелизм пословицы.
- source_word: תוֹכַחַת
  choice: обличение
  rationale: Слово означает словесное указание на ошибку с целью исправления. «Обличение» сохраняет резкость исходного выражения и подходит возвышенно-назидательному регистру.
- source_word: בָּעַר
  choice: неразумен
  rationale: Еврейское слово характеризует человека как тупого, лишённого разумения, даже подобного животному. В основном тексте «неразумен» звучит естественно и достойно; более резкая образная окраска отмечена в сноске.
