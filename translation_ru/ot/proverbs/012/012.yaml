source:
  edition: WLC
  text: חָמַ֣ד רָ֭שָׁע מְצ֣וֹד רָעִ֑ים וְ/שֹׁ֖רֶשׁ צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/012.yaml
  text: A wicked man desires the prey of evil men[b][a], but the root of the righteous yields fruit.
translation:
  language: ru
  text: Нечестивый жаждет добычи злодеев[a], а корень праведных приносит плод[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нечестивый жаждет сети злодеев». Значение еврейского слова מְצוֹד неясно: оно может обозначать добычу, улов, сеть или западню.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «корень праведных даёт». Вероятно, подразумевается, что он даёт плод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמַד
  choice: жаждет
  rationale: Глагол обозначает сильное желание. «Жаждет» естественно передаёт его напряжённость, не уточняя без необходимости, идёт ли речь именно о завистливом присвоении.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного человека; традиционное и понятное русское «нечестивый» сохраняет нравственную характеристику.
- source_word: מְצוֹד
  choice: добычи
  rationale: 'Значение редкого существительного спорно: оно может обозначать добычу, улов, сеть или западню. «Добыча» сохраняет возможную связь как с пойманным, так и с захваченным и естественно выступает объектом желания.'
- source_word: רָעִים
  choice: злодеев
  rationale: Субстантивированное прилагательное во множественном числе означает злых людей. «Злодеев» кратко и естественно передаёт эту характеристику и образует ясное сочетание «добыча злодеев».
- source_word: שֹׁרֶשׁ
  choice: корень
  rationale: Сохранён прямой растительный образ, на котором строится противопоставление второй строки.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе естественно передаётся родительным падежом «праведных» при слове «корень».
- source_word: יִתֵּן
  choice: приносит плод
  rationale: Буквально глагол означает «даёт». При подлежащем «корень» дополнение не выражено, но, вероятно, подразумевается плод; русский оборот делает растительный образ завершённым, не заменяя его отвлечённым объяснением.
