translation:
  language: ru
  text: Лучше быть в пренебрежении и иметь слугу, чем важничать и не иметь хлеба.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чем возвеличивать себя и не иметь хлеба». Еврейское слово, переведённое как «важничать», может означать, что человек старается казаться почтенным или значительным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: В сравнительной пословице слово употреблено идиоматически; русское «лучше» естественно передаёт сравнительную конструкцию без связки в еврейском тексте.
- source_word: נִקְלֶה
  choice: быть малозначительным
  rationale: Причастие нифаля описывает человека, которого считают незначительным или невысоким по общественному положению; вариант не усиливает смысл до «презираемого».
- source_word: וְעֶבֶד לוֹ
  choice: но иметь слугу
  rationale: 'Буквально: «и слуга у него». Противительное «но» естественно выражает подразумеваемый контраст между невысоким статусом и реальным достатком; עֶבֶד здесь передано как «слуга» с учётом бытового контекста.'
- source_word: מִמְּתַכַּבֵּד
  choice: возвеличивать себя
  rationale: Возвратная форма глагола כבד указывает на придание самому себе веса, чести или значительности. Формулировка сохраняет возможность как самовозвышения, так и показной важности.
- source_word: וַחֲסַר לָחֶם
  choice: и не иметь хлеба
  rationale: Сохранён конкретный еврейский образ хлеба как обозначения необходимого пропитания; выражение звучит естественно по-русски.
