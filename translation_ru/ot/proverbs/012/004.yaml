  text: A wife of noble character is her husband's crown[b][a], but one who brings shame is like rot in his bones.
translation:
  language: ru
  text: Достойная жена — венец своего мужа[a], а та, что навлекает позор, — словно гниль в его костях[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «доблестная жена», «способная жена» или «превосходная жена». Еврейское חַיִל охватывает значения силы, достоинства, умения и превосходства.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «словно гниль в его костях». Этот образ передаёт глубокое внутреннее разрушение и разъедающий позор.'
    reason: cultural_note
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: достойная жена
  rationale: Сочетание обозначает жену, отличающуюся силой, достоинством, способностями и добродетелью. «Достойная жена» естественно звучит по-русски и не сужает смысл до воинской доблести или материального достатка.
- source_word: עֲטֶרֶת
  choice: венец
  rationale: Слово обозначает венец или почётное украшение. «Венец» сохраняет краткую метафору чести и достоинства.
- source_word: בַּעְלָהּ
  choice: своего мужа
  rationale: Контекст ясно указывает на супруга; возвратное местоимение естественно связывает мужа с подлежащим «жена».
- source_word: מְבִישָׁה
  choice: та, что навлекает позор
  rationale: Причастие породы hифиль выражает причинение стыда или позора. Глагольная конструкция сохраняет активный смысл, не уточняя без основания, кого именно она позорит.
- source_word: וּכְרָקָב בְּעַצְמוֹתָיו
  choice: а … словно гниль в его костях
  rationale: Противительный союз передаёт контраст двух половин изречения; буквальный образ гнили в костях сохранён как обозначение глубокого внутреннего разрушения.
