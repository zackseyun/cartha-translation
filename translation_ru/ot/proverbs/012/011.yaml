  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֖ף רֵיקִ֣ים חֲסַר לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/011.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues empty things lacks sense.
translation:
  language: ru
  text: Кто возделывает свою землю, тот досыта ест хлеб, а кто гонится за пустым[a], тому недостаёт разума.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за пустыми людьми»; древнееврейское выражение «пустые» можно понимать как относящееся к людям или к пустым, бесполезным занятиям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: возделывает
  rationale: Причастие от עבד в сочетании с землёй обозначает сельскохозяйственный труд; «возделывает» естественно и точно передаёт этот смысл.
- source_word: אַדְמָתוֹ
  choice: свою землю
  rationale: אַדָמָה означает землю или почву; возвратное «свою» по-русски естественно передаёт принадлежность субъекту.
- source_word: יִשְׂבַּע לָחֶם
  choice: досыта ест хлеб
  rationale: Буквально — «насытится хлебом». Выбранная формулировка сохраняет конкретный образ хлеба и выражает достаточное пропитание как плод труда.
- source_word: וּמְרַדֵּף
  choice: а кто гонится
  rationale: Союз передан как «а», чтобы выразить противопоставление двух типов поведения; «гонится» естественно описывает настойчивое стремление к чему-либо.
- source_word: רֵיקִים
  choice: за пустым
  rationale: Форма буквально означает «пустые [вещи/люди]» и допускает безличное либо личное понимание. Субстантивированное «пустым» сохраняет некоторую неопределённость, а альтернативное личное прочтение отмечено в сноске.
- source_word: חֲסַר לֵב
  choice: тому недостаёт разума
  rationale: Буквально — «лишён сердца», но в древнееврейской антропологии «сердце» здесь связано с рассудительностью и здравым суждением; современное русское выражение передаёт смысл идиомы.
