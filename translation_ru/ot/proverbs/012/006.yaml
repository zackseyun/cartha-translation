source:
  edition: WLC
  text: דִּבְרֵ֣י רְשָׁעִ֣ים אֱרָב דָּ֑ם וּ/פִ֥י יְ֝שָׁרִ֗ים יַצִּילֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/006.yaml
  text: The words of the wicked are an ambush for blood[b][a], but the mouth of the upright delivers them.
translation:
  language: ru
  text: Слова нечестивых — засада для пролития крови[a], а уста праведных спасают их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подстерегают, чтобы пролить кровь». Еврейское выражение рисует слова нечестивых как смертоносную засаду.'
    reason: lexical_alternative
  - marker: b
    text: '«Их» может относиться в общем к тем, кому угрожает насилие. Возможно и более рефлексивное понимание: «уста праведных спасают их самих» или просто «спасают».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: слова
  rationale: Форма сопряжённого множественного числа от דָּבָר обозначает здесь произносимые слова или речь. «Слова» естественно звучит по-русски и сохраняет краткость изречения.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное обозначает нравственно злых людей. «Нечестивые» сохраняет этический смысл и традиционный для литературы мудрости контраст с праведными.
- source_word: אֱרָב
  choice: засада
  rationale: Еврейское выражение передаёт образ подстерегания или засады. Именное «засада» сохраняет этот образ, тогда как пояснение «для пролития» делает фразу естественной на современном русском.
- source_word: דָּם
  choice: пролитие крови
  rationale: Буквально — «кровь», метонимически насильственная смерть или кровопролитие. Русское сочетание «для пролития крови» сохраняет ключевой образ крови и ясно передаёт смертоносную цель засады.
- source_word: וּפִי
  choice: а уста
  rationale: Союз выражает противопоставление, поэтому выбран русский «а». «Уста» сохраняют телесный образ и поэтический параллелизм со «словами», оставаясь понятными в возвышенном литературном регистре.
- source_word: יְשָׁרִים
  choice: праведных
  rationale: Субстантивированное прилагательное характеризует нравственно прямых, честных людей. «Праведные» естественно передаёт этическую противоположность нечестивым в контексте Притчей.
- source_word: יַצִּילֵם
  choice: спасают их
  rationale: Порода hifil глагола נצל означает «избавлять, спасать», а суффикс 3-го лица множественного числа сохраняется как «их». Точный референт местоимения в стихе не назван, поэтому он не уточняется в основном тексте.
theological_decisions:
- issue: К кому относится местоименный суффикс в יַצִּילֵם
  choice: Сохранить неопределённое «их»
  alternative: 'Передать рефлексивно: «спасают самих себя», либо опустить объект: «спасают»'
  rationale: Морфологически выражен объект 3-го лица множественного числа, но его референт не назван. Вероятнее всего, речь об оказавшихся под угрозой людях; вместе с тем возможное рефлексивное понимание не следует исключать или незаметно закреплять в переводе.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным регистром книги Притчей. Сохранены образ засады, упоминание крови и параллелизм «слова — уста»; неуточнённый референт местоимения оставлен неоднозначным.
