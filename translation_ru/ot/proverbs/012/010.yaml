id: PRO.12.10
reference: Proverbs 12:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יוֹדֵ֣עַ צַ֭דִּיק נֶ֣פֶשׁ בְּהֶמְתּ֑/וֹ וְֽ/רַחֲמֵ֥י רְ֝שָׁעִ֗ים אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/010.yaml
  text: A righteous man knows the life of his animal[a], but the compassion of the wicked is cruel.
translation:
  language: ru
  text: Праведник знает, что нужно его животному[a], а милосердие нечестивых жестоко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «знает жизнь (или душу) своего животного», то есть внимательно относится к его состоянию и потребностям.'
    reason: 'Лексическая альтернатива: נֶפֶשׁ имеет значения «душа, жизнь, живое существо» и здесь охватывает благополучие и нужды животного.'
lexical_decisions:
- source_word: יוֹדֵעַ
  choice: знает
  rationale: Сохраняет основное значение причастия от ידע — «знать, понимать»; в контексте подразумевает внимательное отношение, не превращая его в явную парафразу «заботится».
- source_word: צַדִּיק
  choice: праведник
  rationale: Естественное для русской библейской мудрости обозначение праведного человека; передаёт грамматически мужской род и обобщённый характер изречения.
- source_word: נֶפֶשׁ
  choice: что нужно
  rationale: В сочетании с животным נֶפֶשׁ указывает на его живое состояние, благополучие и потребности. Буквальное «душу» по-русски могло бы создать неуместный метафизический оттенок, а «жизнь» звучало бы неясно после глагола «знает».
- source_word: בְּהֶמְתּוֹ
  choice: его животному
  rationale: בְּהֵמָה обозначает животное, особенно домашнее или скотину; «животное» сохраняет широту значения и естественно в современном русском.
- source_word: רַחֲמֵי
  choice: милосердие
  rationale: Передаёт чувства или проявления сострадания и сохраняет резкий парадокс второй половины стиха.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Устойчивый и уместный в литературном русском эквивалент субстантивированного множественного רְשָׁעִים в книге Притчей.
- source_word: אַכְזָרִי
  choice: жестоко
  rationale: Прямо передаёт значение «жестокий, безжалостный»; форма среднего рода согласуется с «милосердие».
theological_decisions:
- issue: Мужской род единственного числа у субъекта притчи
  choice: праведник
  alternative: праведный человек; праведные
  rationale: Еврейский текст употребляет мужской род единственного числа как обобщённый образ. «Праведник» сохраняет эту форму и остаётся естественным обозначением типа человека в русской мудрой литературе.
- issue: Парадокс милосердия нечестивых
  choice: милосердие нечестивых жестоко
  alternative: даже жалость нечестивых — жестокость
  rationale: Сохранена напряжённая формулировка оригинала, где то, что названо милосердием нечестивых, характеризуется как жестокое; добавление «даже» или связки усиливало бы толкование.
translation_notes:
  register: Современный литературный русский с достоинством, свойственным библейской мудрости. «Праведник» и «нечестивые» поддерживают традиционный библейский регистр, тогда как синтаксис остаётся ясным для обычного читателя.
