  text: תּוֹעֲבַ֣ת יְ֭הוָה שִׂפְתֵי שָׁ֑קֶר וְ/עֹשֵׂ֖י אֱמוּנָ֣ה רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/022.yaml
  text: Lying lips are an abomination to Yahweh[a], but those who act faithfully are his delight.
translation:
  language: ru
  text: 'Лживые уста — мерзость для Яхве,

    а поступающие верно[a] угодны Ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступающие правдиво», «хранящие верность» или «те, на кого можно положиться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: отвратительны
  rationale: Передаёт сильную нравственную оценку — нечто мерзкое и неприемлемое для Бога — и естественно сочетается по-русски с подлежащим во множественном числе «уста».
- source_word: יְהוָה
  choice: Яхве
  rationale: Прямая передача личного имени, представленного тетраграмматоном, без замены его титулом.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: лживые уста
  rationale: Сохраняет образ уст и естественно выражает значение конструктивного сочетания «уста лжи» в современном литературном русском языке.
- source_word: וְעֹשֵׂי
  choice: а поступающие
  rationale: Причастная форма сохраняет обобщённое обозначение людей по их постоянному поведению; союз «а» ясно передаёт антитезу двух частей изречения.
- source_word: אֱמוּנָה
  choice: верно
  rationale: В сочетании с עֹשֵׂי слово указывает на поведение, отмеченное верностью, правдивостью и надёжностью; наречие даёт естественную русскую конструкцию, не устраняя широту значения.
- source_word: רְצוֹנוֹ
  choice: угодны Ему
  rationale: Передаёт значение благоволения, удовольствия и одобрения; служит ясным смысловым противовесом выражению «отвратительны Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл אֱמוּנָה в выражении עֹשֵׂי אֱמוּנָה
  choice: поступающие верно
  alternative: поступающие правдиво; хранящие верность; надёжные люди
  rationale: Выбранная формулировка сохраняет связь с практическим поведением и допускает оттенки верности, правдивости и надёжности, не сводя слово только к одному из них.
translation_notes:
  register: Краткий поэтический параллелизм сохранён. Язык современный и достоинственный; «уста» оставлены как общепонятный библейско-поэтический образ. Заглавная буква в «Ему» служит русской традиционной формой почтительного указания на Бога.
