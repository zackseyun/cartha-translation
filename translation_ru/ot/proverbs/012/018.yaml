  text: There is one who speaks rashly like the thrusts of a sword[b][a], but the tongue of the wise brings healing.
translation:
  language: ru
  text: Иной говорит необдуманно — его слова словно удары меча, а язык мудрых исцеляет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а язык мудрых — исцеление (или лекарство)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ בּוֹטֶה
  choice: Кто говорит необдуманно
  rationale: Сочетание יֵשׁ с причастием представляет определённый тип человека; современная русская конструкция с «кто» естественно передаёт этот обобщённый смысл. «Говорит необдуманно» выражает безрассудную, несдержанную речь.
- source_word: כְּמַדְקְרוֹת חָרֶב
  choice: ранит, словно ударами меча
  rationale: Буквально образ указывает на колющие удары меча во множественном числе. Добавленное по смыслу «ранит» делает сравнение естественным по-русски и ясно передаёт разрушительное действие опрометчивых слов.
- source_word: וּלְשׁוֹן
  choice: а язык
  rationale: Сохранена еврейская метонимия «язык» в значении речи; союз передаёт резкое противопоставление двух половин изречения.
- source_word: חֲכָמִים
  choice: мудрых
  rationale: Форма множественного числа обозначает мудрых людей вообще; субстантивированное прилагательное естественно и не сужает смысл по признаку пола.
- source_word: מַרְפֵּא
  choice: исцеляет
  rationale: Еврейское существительное означает «исцеление, лекарство». Глагольная передача звучит естественно в русском изречении и сохраняет восстановительное действие мудрой речи; буквальная именная конструкция отмечена в сноске.
