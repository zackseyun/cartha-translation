  text: יָפִ֣יחַ אֱ֭מוּנָה יַגִּ֣יד צֶ֑דֶק וְ/עֵ֖ד שְׁקָרִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/017.yaml
  text: He who breathes out truth declares righteousness[a], but a false witness[b], deceit.
translation:
  language: ru
  text: Кто изрекает правду[a], говорит то, что справедливо, а лжесвидетель — обман[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность», «достоверность». Буквально глагол означает: «выдыхает, выпускает из уст».'
    reason: Лексема אֱמוּנָה может обозначать правдивость, достоверность или верность; глагол יָפִיחַ сохраняет образ произнесения как выдыхания.
  - marker: b
    text: То есть говорит обман.
    reason: Во второй половине еврейского текста сказуемое подразумевается, но не повторяется.
lexical_decisions:
- source_word: יָפִיחַ
  choice: изрекает
  rationale: Форма глагола נפח буквально означает «выдыхает, выпускает из уст», а здесь образно описывает произнесение слов. «Изрекает» сохраняет выразительность и при этом естественно звучит в русском изречении.
- source_word: אֱמוּנָה
  choice: правду
  rationale: В противопоставлении лжесвидетелю слово обозначает достоверную, правдивую речь. Возможное значение «верность» сохранено в сноске.
- source_word: יַגִּיד
  choice: говорит
  rationale: Глагол נגד в породе hифиль означает «сообщает, объявляет». В русском параллелизме «говорит» ясно и естественно передаёт действие свидетеля.
- source_word: צֶדֶק
  choice: то, что справедливо
  rationale: В судебно-нравственном контексте слово охватывает правоту и справедливость; описательная передача не сужает смысл до одного отвлечённого понятия.
- source_word: עֵד שְׁקָרִים
  choice: лжесвидетель
  rationale: Устойчивое и точное русское обозначение свидетеля, дающего ложные показания.
- source_word: מִרְמָה
  choice: обман
  rationale: Еврейская строка завершается кратким безглагольным существительным. Русское тире сохраняет эту эллиптичность и резкий антитетический параллелизм.
