source:
  edition: WLC
  text: הָפ֣וֹךְ רְשָׁעִ֣ים וְ/אֵינָ֑/ם וּ/בֵ֖ית צַדִּיקִ֣ים יַעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/007.yaml
  text: The wicked are overthrown and are no more[b][a], but the house of the righteous will stand.
translation:
  language: ru
  text: Низвергнуты нечестивые — и нет их,[a] а дом праведных устоит.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и их нет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «семья праведных устоит». Слово «дом» может обозначать семью, род или всё домашнее хозяйство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפוֹךְ
  choice: низвергнуты
  rationale: Эллиптическая результативная форма передаёт ниспровержение нечестивых. Краткое «низвергнуты» сохраняет резкость и лаконизм еврейской пословицы.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, поступающих вопреки нравственной правде; традиционное русское слово остаётся понятным и уместным в литературном регистре.
- source_word: וְאֵינָם
  choice: и нет их
  rationale: Почти буквально воспроизводит еврейское выражение и сохраняет его сжатость, не уточняя сверх текста, идёт ли речь об исчезновении, гибели или прекращении их влияния.
- source_word: וּבֵית
  choice: а дом
  rationale: 'Союз «а» ясно выражает контраст. «Дом» сохраняет смысловую широту: это может быть и жилище, и семья, род или хозяйство.'
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное множественное число обозначает нравственную категорию и естественно передаётся общепринятым словом «праведные».
- source_word: יַעֲמֹד
  choice: устоит
  rationale: Глагол буквально связан со стоянием, а в контексте означает сохранение и прочность. «Устоит» естественно передаёт обе стороны образа и противопоставлено низвержению.
