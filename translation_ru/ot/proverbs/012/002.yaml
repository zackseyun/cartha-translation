base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/002.yaml
  text: A good man obtains favor from Yahweh[b][a], but a man of schemes he condemns.
translation:
  language: ru
  text: Добрый человек обретает благоволение Яхве, а человека с коварными замыслами[a] Он осуждает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека замыслов». Слово может означать «замыслы» или «планы»; здесь по контексту оно, вероятно, имеет отрицательный смысл: коварные или злые замыслы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: добрый человек
  rationale: Субстантивированное прилагательное обозначает человека доброго нравственного склада; добавление «человек» естественно для русского языка.
- source_word: יָפִיק
  choice: обретает
  rationale: В сочетании с רָצוֹן глагол передаёт достижение или получение благоволения; «обретает» звучит естественно и сохраняет лаконизм изречения.
- source_word: רָצוֹן
  choice: благоволение
  rationale: В данном контексте слово означает одобрение и благосклонность Бога; «благоволение» точно передаёт религиозно-нравственный оттенок.
- source_word: מֵיְהוָה
  choice: Яхве
  rationale: Предлог מִן указывает на источник благоволения, а тетраграмматон передан как личное имя «Яхве».
- source_word: אִישׁ מְזִמּוֹת
  choice: человека, замышляющего зло
  rationale: מְזִמּוֹת само по себе может обозначать замыслы разного рода, но противопоставление доброму человеку и глагол осуждения указывают здесь на дурные замыслы. Причастная конструкция естественнее буквального «человек замыслов».
- source_word: יַרְשִׁיעַ
  choice: Он осуждает
  rationale: 'Hiphil от רשע означает признать виновным или осудить. Подлежащее не выражено, но естественно переносится из первой строки: это Яхве.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; передача «Яхве» сохраняет личное имя Бога и соответствует предоставленному консультационному решению.
- issue: Подлежащее при יַרְשִׁיעַ
  choice: «Он осуждает», где «Он» относится к Яхве
  alternative: «человек, замышляющий зло, будет осуждён» или «Яхве осуждает»
  rationale: Еврейский текст не повторяет подлежащее во второй части. Местоимение сохраняет лаконизм и естественно отсылает к Яхве, не превращая активную форму в пассивную.
- issue: Нравственная окраска מְזִמּוֹת
  choice: «замышляющего зло» с примечанием об альтернативе
  alternative: «человека замыслов» или «человека коварных замыслов»
  rationale: Слово допускает более широкое значение «замыслы», однако антитеза и осуждение придают ему отрицательный смысл. Примечание сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Добрый» сохраняет широкий нравственный смысл טוֹב, а прописное «Он» ясно связывает подлежащее второй части с Яхве.
