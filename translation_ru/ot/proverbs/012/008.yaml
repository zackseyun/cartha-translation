  yaml_path: translation/ot/proverbs/012/008.yaml
  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
translation:
  language: ru
  text: Человека хвалят сообразно его благоразумию[a], а человек с извращённым сердцем[b] будет презираем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Человека хвалят по мере его рассудительности».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «извращённый сердцем» — еврейский образ нравственно искривлённого внутреннего склада человека.'
    reason: cultural_note
lexical_decisions:
- source_word: לְפִי
  choice: сообразно
  rationale: Оборот буквально связан с «устами», но здесь выражает соответствие или меру. «Сообразно» естественно передаёт смысл «в соответствии с, по мере».
- source_word: שִׂכְלוֹ
  choice: его благоразумию
  rationale: שֵׂכֶל сочетает значения понимания, здравого смысла и практической рассудительности. «Благоразумие» сохраняет интеллектуально-нравственный оттенок, характерный для литературы мудрости.
- source_word: יְהֻלַּל
  choice: хвалят
  rationale: Пуаль выражает пассивное значение «быть хвалимым». Неопределённо-личная русская конструкция естественно передаёт общее правило, выраженное пословицей.
- source_word: אִישׁ
  choice: человека
  rationale: Мужской род в еврейском здесь имеет обобщающее значение. Русское «человека» передаёт это без ненужного ограничения только взрослыми мужчинами.
- source_word: נַעֲוֵה
  choice: извращённый
  rationale: Слово обозначает искривлённость, испорченность или отклонение от прямого пути; в сочетании с «сердцем» речь идёт о нравственно искажённом внутреннем складе.
- source_word: לֵב
  choice: сердцем
  rationale: Сохранён библейский образ сердца как средоточия мыслей, воли и нравственных устремлений; перевод «ум» неоправданно сузил бы значение.
- source_word: יִהְיֶה לָבוּז
  choice: будет презираем
  rationale: Конструкция буквально означает «будет предметом презрения». Пассивная форма кратко и точно передаёт результативный смысл и сохраняет параллелизм.
