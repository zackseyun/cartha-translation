  source_fidelity: 'Первая строка точно передаёт לְפִי שִׂכְלוֹ יְהֻלַּל אִישׁ: похвала соответствует разумности человека. Во второй строке сохранены нравственная метафора «сердца» и смысл יִהְיֶה לָבוּז — стать предметом презрения. Однако исходное «извращённый сердцем» в русском без опорного существительного синтаксически и семантически неудачно: его можно понять как «извращённый посредством сердца».'
