  text: בְּ/פֶ֣שַׁע שְׂ֭פָתַיִם מוֹקֵ֣שׁ רָ֑ע וַ/יֵּצֵ֖א מִ/צָּרָ֣ה צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/013.yaml
  text: In the transgression of the lips there is a snare for an evil man[b][a], but the righteous comes out of trouble.
translation:
  language: ru
  text: В грехе уст — западня для злого[a][b], но праведник выходит из беды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из-за греха уст злой попадает в западню». Еврейская фраза сжата: грех уст можно понимать как сферу, в которой находится западня, либо как её причину или средство, которым человек оказывается пойман.'
    reason: alternative_reading
  - marker: b
    text: «Уста» — буквальный образ, обозначающий здесь речь или произнесённые слова.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: В грехе
  rationale: Предлог בְּ допускает значение сферы («в») либо средства/причины («из-за», «посредством»). Основной текст сохраняет сжатость и неоднозначность еврейской конструкции.
- source_word: שְׂפָתַיִם
  choice: уст
  rationale: Буквально «губ»; в данном контексте это метонимия речи. «Уста» сохраняют образ оригинала и уместны в достойном литературном регистре.
- source_word: מוֹקֵשׁ
  choice: западня
  rationale: Передаёт конкретный образ ловушки, характерный для литературы мудрости.
- source_word: רָע
  choice: злого
  rationale: Субстантивированное прилагательное обозначает злого человека; русский мужской род и единственное число сохраняют грамматическую форму и представительный характер типа.
- source_word: וַיֵּצֵא
  choice: выходит
  rationale: Передаёт основное пространственное значение глагола «выйти», не усиливая его до истолковывающего «избавляется».
- source_word: מִצָּרָה
  choice: из беды
  rationale: צָרָה означает беду, несчастье или тяжёлое положение; сочетание «выходит из беды» естественно по-русски.
- source_word: צַדִּיק
  choice: праведник
  rationale: Естественное русское существительное для субстантивированного צַדִּיק; сохраняет единственное число и ясный контраст со злым.
theological_decisions:
- issue: Причинная связь между греховной речью и западнёй
  choice: В грехе уст — западня для злого
  alternative: Из-за греха уст злой попадает в западню
  rationale: Еврейская фраза допускает понимание בְּ как указания на сферу либо как на средство/причину. Основной вариант не устраняет эту напряжённость, а альтернативное понимание отмечено в сноске.
- issue: Мужской род единственного числа как представительный тип
  choice: злого ... праведник
  alternative: злого человека ... праведного человека
  rationale: Оригинал противопоставляет два типа людей посредством форм мужского рода единственного числа. Русские субстантивированные формы передают это естественно и без добавления отсутствующих слов.
translation_notes:
  register: Современный литературный русский с лаконичным, афористичным синтаксисом. Слово «уста» слегка возвышенно, но широко понятно и сохраняет телесный образ оригинала; тире естественно передаёт бессвязочную именную конструкцию.
