source:
  edition: WLC
  text: לֹא יִכּ֣וֹן אָדָ֣ם בְּ/רֶ֑שַׁע וְ/שֹׁ֥רֶשׁ צַ֝דִּיקִ֗ים בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/003.yaml
  text: A man is not established by wickedness[b][a], but the root of the righteous will not be moved.
translation:
  language: ru
  text: 'Не утвердится человек нечестием,

    а корень праведных не поколеблется.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִכּוֹן
  choice: утвердится
  rationale: Нифаль глагола כון выражает состояние прочности, устойчивости, утверждённости. Русский совершенный вид в форме будущего естественно передаёт обобщённый итог в изречении.
- source_word: אָדָם
  choice: человек
  rationale: В данном изречении слово обозначает отдельного представителя человеческого рода; русское «человек» сохраняет единственное число и естественно имеет обобщающее значение.
- source_word: בְּרֶשַׁע
  choice: нечестием
  rationale: 'Предлог ב здесь вероятнее всего указывает на средство: нечестие не может дать человеку прочного положения. Творительный падеж передаёт это кратко и естественно.'
- source_word: שֹׁרֶשׁ
  choice: корень
  rationale: Сохранён конкретный образ корня, несущий значения укоренённости, жизненности и устойчивости.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе передано обычным библейским и современным русским обозначением людей, поступающих праведно.
- source_word: בַּל
  choice: не
  rationale: Поэтическое отрицание передано без усиления, которое отсутствует явно в исходном тексте.
- source_word: יִמּוֹט
  choice: поколеблется
  rationale: Глагол מוט обозначает движение с места, шатание или потерю устойчивости. «Не поколеблется» сохраняет образ прочности и звучит естественно в русском изречении.
theological_decisions:
- issue: Обобщающее обозначение человека в речи мудрости
  choice: «человек» как единичный представитель человечества
  alternative: «мужчина» или множественное «люди»
  rationale: אָדָם здесь не противопоставляет мужчину женщине, а говорит о любом человеке. Русское «человек» точно сохраняет грамматическое единственное число и универсальный смысл.
- issue: Характер утверждения о праведных
  choice: Сохранить образ корня праведных без поясняющего истолкования
  alternative: Передать как устойчивость самих праведных или их рода
  rationale: Генитивная конструкция допускает образ корня, принадлежащего праведным или характеризующего их укоренённость. Буквальный образ сохраняет эту смысловую ёмкость и не вводит лишнего богословского уточнения.
translation_notes:
  register: Краткое, параллельное по строению изречение в современном литературном русском. Сохранены противопоставление «нечестие — праведные» и метафора устойчивого корня; архаизмы и поясняющие добавления не использованы.
