  source_fidelity: 'Русский текст точно передаёт оба параллельных высказывания еврейского оригинала: נִפְעַל יִכּוֹן передан как «не утвердится», בְּרֶשַׁע — инструментальным «нечестием», а образ «корня праведных», который не будет поколеблен, сохранён без истолковательных добавлений. Будущее совершенного вида естественно выражает обобщённую уверенность изречения.'
  naturalness: Формулировка краткая, ясная и хорошо звучит как современное литературное изречение мудрости. «Не утвердится человек нечестием» несколько возвышенно по тону, но не архаично и уместно для жанра. Параллелизм и контраст между нечестием и праведными сохранены.
  terminology: «Нечестие», «праведные» и «корень» являются точными и общеупотребительными для библейско-литературного регистра. «Не поколеблется» адекватно передаёт מוט и сохраняет образ устойчивости, не сужая его до одного физического или психологического значения.
