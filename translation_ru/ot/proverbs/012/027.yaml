  yaml_path: translation/ot/proverbs/012/027.yaml
  text: A lazy man does not roast his game[b][a], but diligence is a man’s precious wealth.
translation:
  language: ru
  text: Ленивый не зажарит свою дичь[a], а усердие — драгоценное достояние человека[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ленивый не поймает добычи», если глагол понимать шире — как добывание или приготовление дичи, а не именно жарение.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен иной синтаксический разбор: «достояние усердного человека драгоценно».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: יַחֲרֹךְ
  choice: зажарит
  rationale: Глагол חרך прежде всего передаёт действие огня — обжигать или жарить. В сочетании с дичью конкретный смысл «зажарить» создаёт образ человека, который по лености не пользуется даже уже имеющейся добычей; более широкое понимание отмечено в сноске.
- source_word: רְמִיָּה
  choice: ленивый
  rationale: В литературе мудрости רְמִיָּה может обозначать не только обман, но и нерадивость, леность. Здесь противопоставление חָרוּץ указывает именно на ленивого человека.
- source_word: צֵידוֹ
  choice: свою дичь
  rationale: צֵיד означает добычу охотника, особенно дичь. Возвратное притяжательное «свою» естественно передаёт суффикс третьего лица в русском предложении.
- source_word: הוֹן
  choice: богатство
  rationale: הוֹן обычно означает имущество, состояние или богатство; «богатство» ясно выражает ценностный образ второй половины стиха.
- source_word: אָדָם
  choice: человека
  rationale: אָדָם здесь имеет обобщённое значение. Русское «человек» естественно сохраняет единственное число и универсальный смысл без ненужного уточнения пола.
- source_word: יָקָר
  choice: драгоценное
  rationale: יָקָר обозначает нечто ценное, дорогое или драгоценное. Выбор поддерживает афористическое утверждение о ценности усердия.
- source_word: חָרוּץ
  choice: усердие
  rationale: חָרוּץ может обозначать усердного человека или, в сжатой конструкции, качество усердия. Абстрактное существительное создаёт прямое противопоставление лености и соответствует одному из естественных разборов трудной второй строки.
theological_decisions:
- issue: Синтаксис второй половины стиха
  choice: «усердие — драгоценное богатство человека»
  alternative: «достояние усердного человека драгоценно»
  rationale: Еврейская строка предельно сжата и допускает различное распределение слов по синтаксическим ролям. Основной текст понимает חָרוּץ как усердие и הוֹן как богатство; сноска сохраняет важный альтернативный разбор, при котором חָרוּץ обозначает усердного человека.
- issue: Обобщённое значение אָדָם
  choice: «человека»
  alternative: «мужчины»
  rationale: В данном изречении אָדָם относится к человеку вообще, а не специально к мужчине; перевод сохраняет универсальное содержание и не вводит богословских уточнений.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма пословицы. Конкретный образ жарения сохранён, а сжатость и неоднозначность второй еврейской строки отражены сноской.
