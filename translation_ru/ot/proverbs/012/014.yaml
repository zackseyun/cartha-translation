  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יִשְׂבַּע ט֑וֹב וּ/גְמ֥וּל יְדֵי אָ֝דָ֗ם ישוב לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/014.yaml
  text: From the fruit of a man's mouth he is satisfied with good[b][a], and the recompense of a man's hands returns to him.
translation:
  language: ru
  text: От плода своих уст человек насыщается благом, и воздаяние за дела его рук возвращается к нему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно также понять как «и то, что сделано руками человека, возвращается к нему»; слово גְמוּל может обозначать как воздаяние, так и результат содеянного.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: От плода своих уст человек
  rationale: Сохраняется образ плода речи. Возвратное «своих» естественно передаёт принадлежность уст тому же человеку, который является подлежащим глагола.
- source_word: יִשְׂבַּע טוֹב
  choice: насыщается благом
  rationale: Глагол שׂבע означает насыщение или удовлетворение, а широкое טוֹב допускает как нравственное благо, так и добрый результат; «благом» сохраняет эту ёмкость.
- source_word: וּגְמוּל יְדֵי אָדָם
  choice: и воздаяние за дела его рук
  rationale: גְמוּל обозначает воздаяние, отдачу или результат содеянного. Формулировка сохраняет причинно-следственную мысль и естественно связывает её с делами рук.
- source_word: יָשׁוּב לוֹ
  choice: возвращается к нему
  rationale: Буквально передаёт значение שׁוב «возвращаться»; настоящее время естественно выражает общую истину притчи.
theological_decisions:
- issue: Обобщающие существительные мужского рода אִישׁ и אָדָם
  choice: человек / его
  alternative: мужчина / его
  rationale: В данном изречении формы употреблены родово и относятся к человеку вообще. Русское «человек» точно сохраняет единственное число и не сужает смысл до взрослых мужчин.
- issue: Характер воздаяния за человеческие поступки
  choice: Сохранена нейтральная причинно-следственная формулировка
  alternative: Явно представить воздаяние как непосредственную награду Бога
  rationale: Стих утверждает, что сделанное возвращается к человеку, но не называет непосредственного деятеля и не уточняет механизма воздаяния.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного параллелизма и образности еврейской притчи. «Благо» выбрано как ёмкое и возвышенное, но понятное слово; синтаксис остаётся естественным для современного читателя.
