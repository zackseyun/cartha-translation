    reason: cultural_note
  revision_rationale: Исправление устраняет неестественное и добавочное «нерадивая рука», сохраняя образ первой строки и смысловой контраст оригинала. «Нести трудовую повинность» передаёт состояние подчинения, выраженное לָמַס, без добавления конкретного механизма принуждения или современного уголовно-правового оттенка.
