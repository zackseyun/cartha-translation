  text: יַד חָרוּצִ֥ים תִּמְשׁ֑וֹל ו֝/רְמִיָּ֗ה תִּהְיֶ֥ה לָ/מַֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/024.yaml
  text: The hand of the diligent will rule[b][a], but the slack will be put to forced labor.
translation:
  language: ru
  text: Рука прилежных будет властвовать, а нерадивые будут нести трудовую повинность.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово מַס означает обязательную трудовую повинность — подневольный труд (корве).
    reason: cultural_note
lexical_decisions:
- source_word: יַד
  choice: рука
  rationale: Сохранён конкретный образ руки как обозначения деятельности и способности человека; во второй половине слово «рука» повторено для естественной по-русски персонификации רְמִיָּה и ясного параллелизма.
- source_word: חָרוּצִים
  choice: усердных
  rationale: Передаёт людей, отличающихся прилежанием и трудолюбием, и естественно противопоставляется нерадивости.
- source_word: תִּמְשׁוֹל
  choice: будет властвовать
  rationale: Сохраняет основное значение глагола משל — осуществлять власть, господствовать — без сведения смысла лишь к успеху или руководящей должности.
- source_word: רְמִיָּה
  choice: нерадивая рука
  rationale: В данном противопоставлении слово означает нерадивость, леность или недостаток усердия, а не обман. Конкретизация через повтор «рука» делает субъект личным и сохраняет образ первой строки.
- source_word: תִּהְיֶה
  choice: будет
  rationale: Простая связка сохранена; русский оборот «будет на принудительных работах» ясно выражает состояние подчинения без добавления отсутствующего в еврейском глагола принуждения.
- source_word: לָמַס
  choice: на принудительных работах
  rationale: מַס обозначает обязательную трудовую повинность (корве), а не только денежную дань. Такой перевод понятен современному читателю.
theological_decisions:
- issue: Характер изречения о результате усердия и нерадивости
  choice: Сохранена прямая формулировка мудростного обобщения
  alternative: Ослабить до «может властвовать» и «может попасть»
  rationale: Формы еврейского текста выражают уверенный типичный итог; перевод не превращает пословицу ни в безусловное обещание каждому человеку, ни в простую вероятность.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного параллелизма и образа руки. «Нерадивая» употреблено в понятном, несколько возвышенном регистре, подходящем для библейской книги мудрости; термин «корве» вынесен из основного текста как малопонятный широкому читателю.
