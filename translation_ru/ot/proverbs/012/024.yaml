review_pass:
  verdict: revise
  source_fidelity: Первая строка верно передаёт образ «руки» как обозначения деятельной силы и глагол משל («властвовать»). Во второй строке רְמִיָּה в данном контексте относится к нерадивости/лени, а לָמַס — к обязательной трудовой повинности, а не к денежному налогу. Перевод «нерадивая рука будет на принудительных работах» сохраняет общий смысл, но искусственно повторяет отсутствующее во второй строке слово «рука» и создаёт неестественный образ. Личный перевод второго члена естественно передаёт контраст с прилежными.
  naturalness: «Рука прилежных будет властвовать» сохраняет лаконичный библейский образ и звучит по-русски идиоматичнее, чем «рука усердных». Оборот «нести трудовую повинность» точнее и литературнее, чем «быть на принудительных работах»; он не вызывает нежелательной современной ассоциации с уголовным наказанием.
  terminology: «Трудовая повинность» точно обозначает מַס как подневольную обязательную работу. Примечание сохраняет пояснение о корве, не утверждая без необходимости, что работа всегда совершалась именно в пользу правителя или государства.
  issues:
  - severity: medium
    issue: «Нерадивая рука» добавляет во вторую строку существительное «рука» и звучит неестественно в сочетании с «будет на принудительных работах».
    rationale: В еврейском тексте во второй строке стоит רְמִיָּה («нерадивость», в контексте — нерадивые), без повторения יַד. Русский личный субъект лучше передаёт антитезу и не создаёт образа руки, буквально находящейся на работах.
  - severity: low
    issue: «Усердных» может восприниматься как характеристика рвения вообще, а не трудолюбия.
    rationale: «Прилежных» яснее выражает значение חָרוּצִים в контексте труда и соответствует регистру книги Притчей.
  - severity: low
    issue: Сноска излишне конкретизирует адресата повинности как правителя или государство.
    rationale: Значение מַס — обязательная трудовая повинность; уточнение о конкретном получателе труда не требуется текстом стиха.
  revised_text: Рука прилежных будет властвовать, а нерадивые будут нести трудовую повинность.[a]
  revised_footnotes:
