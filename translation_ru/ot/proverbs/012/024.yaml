revisions:
- from: Рука усердных будет властвовать, а нерадивая рука будет на принудительных работах.[a]
  to: Рука прилежных будет властвовать, а нерадивые будут нести трудовую повинность.[a]
  rationale: Исправление устраняет неестественное и добавочное «нерадивая рука», сохраняя образ первой строки и смысловой контраст оригинала. «Нести трудовую повинность» передаёт состояние подчинения, выраженное לָמַס, без добавления конкретного механизма принуждения или современного уголовно-правового оттенка.
