  terminology: «Драгоценное сокровище», «масло», «мудрый», «глупый человек» адекватны еврейской лексике. «Масло» не добавляет отсутствующее в оригинале уточнение «оливковое». Формы мужского рода сохраняют репрезентативную грамматику исходного текста без сужения общего смысла.
