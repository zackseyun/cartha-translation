  source_fidelity: Перевод точно передаёт оба блага — «драгоценное сокровище и масло», их нахождение в жилище мудрого и противопоставленное действие глупого человека. Подразумеваемое в еврейском глагольное значение «хранятся/имеются» естественно восполнено по-русски. «Всё это» удачно передаёт, что объект глагола охватывает названные запасы как целое, не вынуждая выбирать между двумя существительными при формально единственном суффиксе יְבַלְּעֶנּוּ.
