  text: אוֹצָ֤ר נֶחְמָ֣ד וָ֭/שֶׁמֶן בִּ/נְוֵ֣ה חָכָ֑ם וּ/כְסִ֖יל אָדָ֣ם יְבַלְּעֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/020.yaml
  text: Precious treasure and oil are in the dwelling of a wise man[a], but a foolish man swallows them up.
translation:
  language: ru
  text: Драгоценное сокровище и масло хранятся в жилище мудрого, а глупый человек всё это проглатывает[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «проглатывает». То есть безрассудно расходует или растрачивает накопленное.'
    reason: Поясняется яркая метафора еврейского глагола и её значение в контексте.
lexical_decisions:
- source_word: אוֹצָר נֶחְמָד
  choice: драгоценное сокровище
  rationale: Сочетание обозначает ценные, желанные запасы; перевод сохраняет образ накопленного богатства и его высокую ценность.
- source_word: שֶׁמֶן
  choice: масло
  rationale: В древнеизраильском контексте обычно подразумевается оливковое масло, однако исходный текст не уточняет его вид.
- source_word: בִּנְוֵה
  choice: в жилище
  rationale: Слово означает место обитания, дом; «жилище» точно передаёт образ, не конкретизируя устройство дома.
- source_word: חָכָם
  choice: мудрого
  rationale: Субстантивированное прилагательное мужского рода передано естественной для русского языка формой, имеющей обобщённый смысл.
- source_word: כְסִיל אָדָם
  choice: глупый человек
  rationale: כְּסִיל — устойчивое обозначение глупца в литературе мудрости, а אָדָם прямо называет человека; перевод сохраняет оба элемента.
- source_word: יְבַלְּעֶנּוּ
  choice: всё это проглатывает
  rationale: Глагол буквально означает «проглатывать» и здесь образно описывает безрассудное расходование запасов. «Всё это» естественно соотносит единственное местоименное окончание с совокупностью упомянутых благ.
theological_decisions:
- issue: Обобщающие мужские формы חָכָם ... כְסִיל אָדָם
  choice: «мудрого… глупый человек»
  alternative: «мудрого человека… глупца» или гендерно нейтральная перестройка
  rationale: Еврейский текст использует мужское единственное число как типичного представителя; русские мужские формы сохраняют грамматику и общеобязательный смысл пословицы без добавления ограничений.
- issue: Единственное местоименное окончание в יְבַלְּעֶנּוּ при двух названных благах
  choice: «всё это проглатывает»
  alternative: «его проглатывает» или «их поглощает»
  rationale: Форма в еврейском тексте единственного числа, вероятно, охватывает запас как единое целое. Перевод не ограничивает отсылку только сокровищем и сохраняет собирательный смысл.
translation_notes:
  register: Современный литературный русский язык с краткой пословичной структурой. Добавлен подразумеваемый глагол «хранятся», необходимый для естественного русского предложения; образ «проглатывает» сохранён буквально и разъяснён в сноске.
