  text: עֲ֭שֹׂה צְדָקָ֣ה וּ/מִשְׁפָּ֑ט נִבְחָ֖ר לַ/יהוָ֣ה מִ/זָּֽבַח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/003.yaml
  text: To do righteousness and justice is more acceptable to Yahweh than sacrifice[a].
translation:
  language: ru
  text: Творить праведность и справедливость угоднее Яхве, чем жертва.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предпочтительнее для Яхве»; еврейское слово буквально означает «выбрано» и здесь выражает предпочтение или благоволение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֹׂה
  choice: творить
  rationale: Инфинитив употреблён субстантивно и обозначает оцениваемое действие. «Творить» естественно сочетается с «праведностью и справедливостью» и сохраняет возвышенный, но современный регистр.
- source_word: צְדָקָה
  choice: праведность
  rationale: Слово обозначает праведность и правильное поведение; этот перевод сохраняет его отличие от следующего מִשְׁפָּט.
- source_word: וּמִשְׁפָּט
  choice: и справедливость
  rationale: В данном этическом контексте речь идёт о справедливом суде и справедливом образе действий; «справедливость» ясно передаёт общий смысл.
- source_word: נִבְחָר
  choice: угоднее
  rationale: Форма от בחר буквально указывает на то, что нечто выбрано или предпочтено. В сравнительной конструкции краткое «угоднее» естественно передаёт предпочтительность для Бога, не устраняя буквальную возможность «предпочтительнее».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому это угодно или кем предпочитается; по-русски отношение естественно выражается дательным падежом. Тетраграмматон передан личным именем «Яхве».
- source_word: מִזָּבַח
  choice: чем жертва
  rationale: Предлог מִן имеет сравнительное значение «чем», а единственное число זֶבַח употреблено обобщённо и потому передано без неопределённого артикля, которого в русском нет.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. «Яхве» сохраняет личное заветное имя и соответствует принятому в исходных данных решению.
- issue: Соотношение нравственного поступка и жертвы
  choice: 'Сравнительное предпочтение: праведность и справедливость угоднее жертвы'
  alternative: Полное отрицание или отмена жертвоприношений
  rationale: Конструкция с מִן выражает сравнение и божественное предпочтение; сам стих не утверждает, что всякая жертва безусловно отвергнута или отменена.
translation_notes:
  register: Современный литературный русский язык с краткой афористичностью, свойственной притче. Пара «праведность и справедливость» сохранена, а «творить» поддерживает достоинство и ритм высказывания.
