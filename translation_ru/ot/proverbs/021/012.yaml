  terminology: «Праведник» и «нечестивый/нечестивые» уместны в современном литературном библейском регистре. «Бедствие» хорошо передаёт לָרָע как гибельный исход, не навязывая значение нравственного зла. В сноске слово «Праведный» с прописной буквы обоснованно отмечает именно альтернативное богословское прочтение, а не характеристику основного текста.
