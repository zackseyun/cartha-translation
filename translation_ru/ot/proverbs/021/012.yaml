translation:
  language: ru
  text: Праведник наблюдает за домом нечестивого[a]; он низвергает нечестивых в бедствие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Праведный наблюдает за домом нечестивого; Он низвергает нечестивых в бедствие», если «Праведный» понимается как Бог, а не как праведный человек.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: вникает
  rationale: Причастие хифиля от שכל выражает вдумчивое, проницательное рассмотрение. «Вникает» естественно передаёт направленное внимание и не сводит значение ни просто к знанию, ни к отвлечённой мудрости.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода в единственном числе; «праведник» сохраняет единственное число и характерный для Притч типический образ.
- source_word: לְבֵית רָשָׁע
  choice: в дом нечестивого
  rationale: בַּיִת может обозначать дом, семейство или всё устроение жизни человека. Прямое «дом» сохраняет образ и допускает эту смысловую широту; רָשָׁע здесь стоит в единственном числе.
- source_word: מְסַלֵּף
  choice: повергая
  rationale: Причастие от סלף передаёт опрокидывание, ниспровержение или доведение до гибельного состояния. Деепричастная форма сохраняет компактную связь со второй частью без добавления отсутствующего местоимения.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе передано обычным русским библейским обозначением людей, поступающих нечестиво.
- source_word: לָרָע
  choice: в бедствие
  rationale: רַע здесь с предлогом направления естественно обозначает губительный исход — беду, бедствие или гибель, а не обязательно нравственное зло. «В бедствие» сохраняет результативно-направительное значение конструкции.
theological_decisions:
- issue: Кто является субъектом сжатого изречения
  choice: Человеческий праведник остаётся субъектом обеих частей стиха.
  alternative: '«Праведный» как обозначение Бога: «Праведный вникает в дом нечестивого и повергает нечестивых в бедствие».'
  rationale: В еврейском тексте нет явного имени Бога, а צַדִּיק наиболее непосредственно читается как типический праведный человек. Однако синтаксическая сжатость допускает традиционное понимание субъекта как Бога, поэтому оно отмечено в сноске, а не исключено переводом.
translation_notes:
  register: Современный литературный русский язык с краткостью и достоинством, подходящими для афористической речи Притч. Сохранены образ «дома», смена единственного числа на множественное и неоднозначность относительно субъекта; сноска явно привязана маркером [a] в основном тексте.
