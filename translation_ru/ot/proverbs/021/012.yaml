  source_fidelity: 'Первая часть передана неточно по-русски: «вникать в дом» обычно означает углубляться в устройство/подробности дома и может создавать образ физического проникновения. מַשְׂכִּיל לְבֵית естественнее передать как внимательное, проницательное наблюдение или рассмотрение дома/хозяйства нечестивого. Во второй части «повергая» необоснованно превращает самостоятельное причастное сказуемое в деепричастие, обозначающее сопутствующее действие того же субъекта. Две части лучше передать самостоятельными предложениями. Альтернативное понимание צַדִּיק как обозначения Бога следует оставить в сноске, не делая его обязательным в основном тексте.'
