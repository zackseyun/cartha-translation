  register: Современный литературный русский с сохранением краткой афористичности притчи. Тире отражают именную характеристику, а формула «имя тому» удерживает образ еврейского текста. Основной перевод сохраняет различия между тремя близкими обозначениями гордости и дерзости; сноска предлагает более гладкое чтение синтаксически неоднозначной первой половины и конечного словосочетания.
