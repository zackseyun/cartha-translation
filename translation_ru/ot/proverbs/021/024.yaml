  text: זֵ֣ד יָ֭הִיר לֵ֣ץ שְׁמ֑/וֹ ע֝וֹשֶׂ֗ה בְּ/עֶבְרַ֥ת זָדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/024.yaml
  text: “Proud[a], arrogant, a scoffer” is his name—one who acts in the fury of presumption.
translation:
  language: ru
  text: «Дерзкий, надменный, насмешник» — имя тому, кто действует в пылу самонадеянности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дерзкий, надменный насмешник — вот его имя; он действует с яростной надменностью».'
    reason: Возможна другая синтаксическая группировка первых трёх слов; сочетание בְּעֶבְרַת זָדוֹן допускает более идиоматическую передачу как действия с яростной надменностью.
lexical_decisions:
- source_word: זֵד
  choice: дерзкий
  rationale: Слово обозначает человека, чья гордость проявляется как самонадеянная дерзость; такой перевод отличает его от следующего יָהִיר и сохраняет связь с זָדוֹן.
- source_word: יָהִיר
  choice: надменный
  rationale: Прилагательное выражает высокомерное самовозвышение; «надменный» естественно и достаточно ясно передаёт этот оттенок, не дублируя «дерзкий».
- source_word: לֵץ
  choice: насмешник
  rationale: В Притчах это устойчивый тип человека, который презрительно осмеивает наставление и мудрость; «насмешник» звучит естественнее современного русского «кощунник» или книжного «ругатель».
- source_word: שְׁמוֹ
  choice: имя тому
  rationale: Сохранена еврейская формула характеристики через «имя», при этом русский порядок слов делает её понятной как обозначение сущности или репутации человека.
- source_word: עֹשֶׂה
  choice: кто действует
  rationale: Причастие выражает характерное, привычное поведение; относительная конструкция естественно передаёт это обобщённое значение по-русски.
- source_word: בְּעֶבְרַת
  choice: в ярости
  rationale: עֶבְרָה обозначает сильный, переливающийся через край гнев или ярость; предложная конструкция передаёт образ действия.
- source_word: זָדוֹן
  choice: самомнения
  rationale: Слово выражает самонадеянную гордость и дерзкое высокомерие. «Самомнение» сохраняет отличие от יָהִיר и смысловую связь с זֵד, хотя сочетание намеренно остаётся напряжённым.
