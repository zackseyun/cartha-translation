  source_fidelity: 'Основная характеристика передана близко к еврейскому тексту: זֵד — «дерзкий», יָהִיר — «надменный», לֵץ — «насмешник». Однако в первой части следует ясно сохранить три параллельных именования как состав формулы «имя тому», а не интонационно противопоставлять «дерзкий, надменный» слову «насмешник». Конечное בְּעֶבְרַת זָדוֹן обозначает действие в пылу/ярости самонадеянной дерзости; «в ярости самомнения» понятно, но сочетание менее естественно по-русски.'
  naturalness: «Имя тому» — уместная литературная формула, но запятая между всеми тремя определениями делает синтаксис прозрачнее. «В пылу самонадеянности» звучит естественнее, чем «в ярости самомнения», и сохраняет интенсивность עֶבְרָה без неоправданного сглаживания.
  terminology: «Дерзкий», «надменный» и «насмешник» образуют удачный ряд для терминов оригинала. «Самонадеянность» хорошо передаёт זָדוֹן и сохраняет связь с «дерзкий», не повторяя «надменный».
