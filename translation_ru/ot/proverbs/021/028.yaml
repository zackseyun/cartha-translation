  text: עֵד כְּזָבִ֥ים יֹאבֵ֑ד וְ/אִ֥ישׁ שׁ֝וֹמֵ֗עַ לָ/נֶ֥צַח יְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/028.yaml
  text: A false witness will perish[a], but a man who listens will speak forever.
translation:
  language: ru
  text: 'Лживый свидетель погибнет,

    а человек, который слушает, будет говорить всегда.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет говорить вовек»; возможно также: «его свидетельство сохранит силу». Еврейское выражение может подчёркивать длительность речи либо непреходящую достоверность сказанного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד כְּזָבִים
  choice: лживый свидетель
  rationale: Сочетание буквально означает «свидетель лжи/лжей» и имеет судебный оттенок; «лживый свидетель» естественно передаёт его по-русски.
- source_word: יֹאבֵד
  choice: погибнет
  rationale: Глагол אבד означает гибель, исчезновение или уничтожение; «погибнет» сохраняет краткость и намеренно не уточняет вид кары.
- source_word: וְאִישׁ שׁוֹמֵעַ
  choice: а человек, который слушает
  rationale: וְ выражает контраст, אִישׁ обозначает человека/мужчину, а причастие שׁוֹמֵעַ здесь уместно понимать как внимательное слушание перед свидетельством, не сужая значение до послушания.
- source_word: לָנֶצַח
  choice: непрестанно
  rationale: В данном контексте נֶצַח может указывать не на метафизическую вечность, а на продолжительность и непреходящую силу речи; «непрестанно» естественно сочетается с «будет говорить», при этом альтернативный смысл отмечен в сноске.
- source_word: יְדַבֵּר
  choice: будет говорить
  rationale: Форма глагола דבר прямо передаётся будущим временем и сохраняет контраст с участью лживого свидетеля.
theological_decisions:
- issue: Характер обещания во второй строке
  choice: Не уточнять, означает ли выражение продолжительное право говорить или непреходящую силу свидетельства.
  alternative: «Его слова останутся навсегда» или «будет говорить убедительно».
  rationale: Еврейский текст допускает более одного смыслового оттенка; конкретизация устранила бы подлинную неоднозначность и добавила отсутствующий объект «слова».
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Судебный оттенок слова «свидетель» сохранён; синтаксис второй строки оставлен несколько открытым ради смысловой неоднозначности оригинала.
