  text: כֹּ֣פֶר לַ/צַּדִּ֣יק רָשָׁ֑ע וְ/תַ֖חַת יְשָׁרִ֣ים בּוֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/018.yaml
  text: The wicked is a ransom for the righteous[a], and the treacherous one in place of the upright.
translation:
  language: ru
  text: Нечестивец — выкуп за праведника[a], а вероломный — вместо честных людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нечестивец служит заменой праведнику, а вероломный — честным людям».'
    reason: 'Лексическая альтернатива: כֹּפֶר может подчёркивать не саму выкупную плату, а заместительную роль.'
lexical_decisions:
- source_word: כֹּפֶר
  choice: выкуп
  rationale: Слово обозначает выкупную плату или возмещение, отдаваемое за другого; «выкуп» сохраняет краткую метафору и заместительный смысл.
- source_word: לַצַּדִּיק
  choice: за праведника
  rationale: 'Предлог ל здесь передаёт отношение замещения: нечестивец оказывается выкупом «за» праведника. Единственное число сохранено как обобщающее, характерное для притчи.'
- source_word: רָשָׁע
  choice: нечестивец
  rationale: Существительное в единственном числе обозначает нравственно порочного человека как тип; «нечестивец» естественно противопоставляется праведнику.
- source_word: וְתַחַת
  choice: а ... вместо
  rationale: תַּחַת выражает замещение, а не пространственное положение. Союз «а» естественно передаёт параллельное сопоставление двух частей.
- source_word: יְשָׁרִים
  choice: честных людей
  rationale: Множественное число обозначает нравственно прямых, порядочных людей. Такой перевод понятен современному читателю и сохраняет этический смысл.
- source_word: בּוֹגֵד
  choice: вероломный
  rationale: Причастная форма называет человека, поступающего коварно и нарушающего верность; субстантивированное «вероломный» сохраняет широту значения, не сужая его до политического предательства.
theological_decisions:
- issue: Характер утверждения о замещении нечестивого праведником
  choice: Сохранена сжатая метафора «выкуп за праведника» без пояснения механизма воздаяния.
  alternative: 'Передать толковательно: «нечестивец служит заменой праведнику».'
  rationale: Еврейский текст утверждает заместительное соответствие, но не объясняет, каким образом оно осуществляется; перевод не должен превращать притчу в развёрнутое учение об искуплении или воздаянии.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Именное сказуемое отмечено тире; параллелизм исходного текста сохранён. «Честных людей» выбрано вместо буквального «прямых» ради ясного нравственного смысла.
