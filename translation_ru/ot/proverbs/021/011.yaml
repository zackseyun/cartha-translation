source:
  edition: WLC
  text: בַּ/עְנָשׁ לֵ֭ץ יֶחְכַּם פֶּ֑תִי וּ/בְ/הַשְׂכִּ֥יל לְ֝/חָכָ֗ם יִקַּח דָּֽעַת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/011.yaml
  text: When a scoffer is punished[a], the simple become wise; and when a wise man is instructed[b], he gains knowledge.
translation:
  language: ru
  text: Когда наказывают насмешника[a], наивный становится мудрым; когда же наставляют мудрого[b], он приобретает знание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при наказании насмешника».'
    reason: Сохраняет возможную более формальную передачу конструкции ב с инфинитивом.
  - marker: b
    text: 'Или: «дают разумение мудрому».'
    reason: 'Отражает значение еврейского глагола: мудрому дают понимание или помогают поступать разумно.'
lexical_decisions:
- source_word: בַּעְנָשׁ
  choice: Когда наказывают
  rationale: 'Предлог ב с инфинитивом выражает обстоятельство или время действия: буквально «при наказании». Безличная конструкция естественна для современного русского языка и не вводит не названного в еврейском тексте деятеля.'
- source_word: לֵץ
  choice: насмешника
  rationale: Слово обозначает человека, который надменно насмехается и отвергает исправление. «Насмешник» сохраняет нравственный и речевой оттенок, не сужая значение до религиозного кощунства.
- source_word: יֶחְכַּם
  choice: становится мудрее
  rationale: Глагол указывает на обретение или возрастание мудрости. Сравнительная форма по-русски естественно передаёт постепенный результат назидательного примера.
- source_word: פֶּתִי
  choice: простодушный
  rationale: В Притчах это неопытный, доверчивый и ещё не сформировавшийся человек, а не просто глупец. «Простодушный» сохраняет открытость этой категории как мудрости, так и заблуждению.
- source_word: וּבְהַשְׂכִּיל
  choice: когда же вразумляют
  rationale: Hiphil от שׂכל здесь означает «давать разумение, делать рассудительным». Безличное «вразумляют» передаёт причинное значение и соответствует параллельной конструкции первой строки.
- source_word: לְחָכָם
  choice: мудрого
  rationale: Мужской род единственного числа сохранён как обычный для притчи типовой образ человека; русский перевод не устраняет грамматическую форму исходного текста.
- source_word: יִקַּח דָּעַת
  choice: он приобретает знание
  rationale: Буквально «берёт знание»; в данном сочетании לקח означает получать или усваивать. «Приобретает знание» сохраняет образ обретения и лексическое отличие знания от мудрости.
theological_decisions:
- issue: Типовой субъект мужского рода
  choice: мудрого — он
  alternative: мудрого человека; мудрые
  rationale: Еврейский текст употребляет мужской род единственного числа как типовой образ в притче. Перевод сохраняет эту форму, не утверждая, что смысл относится только к мужчинам.
- issue: Способ обретения мудрости простодушным
  choice: простодушный становится мудрее, наблюдая наказание насмешника
  alternative: простодушный сам подвергается наказанию
  rationale: Синтаксис называет насмешника объектом наказания, а простодушного — тем, кто вследствие этого становится мудрее. Такое противопоставление сохранено без дополнительного богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с кратким, симметричным строением притчи. Слова «простодушный», «мудрый» и «знание» поддерживают устойчивую лексику литературы мудрости; безличные формы сохраняют неназванного деятеля обеих ситуаций.
