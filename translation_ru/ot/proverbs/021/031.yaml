  yaml_path: translation/ot/proverbs/021/031.yaml
  text: A horse is prepared for the day of battle[a], but victory belongs to Yahweh.
translation:
  language: ru
  text: Конь приготовлен ко дню битвы, но победа — от Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасение» или «избавление — от Яхве». Еврейское слово имеет широкий смысл и может обозначать спасение или избавление; здесь «победа» соответствует контексту битвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּס
  choice: конь
  rationale: Еврейское существительное обозначает коня вообще; военное назначение ясно из последующей фразы, поэтому добавление «боевой» не требуется.
- source_word: מוּכָן
  choice: готовят
  rationale: Пассивное причастие передаёт подготовленность. Русская неопределённо-личная конструкция естественно сохраняет смысл совершаемой человеком подготовки.
- source_word: לְיוֹם מִלְחָמָה
  choice: ко дню битвы
  rationale: Предлог указывает на подготовку к предстоящему событию; «день битвы» сохраняет краткость и конкретный военный контекст оригинала.
- source_word: וְלַיהוָה
  choice: но ... от Яхве
  rationale: Союз в контексте выражает противопоставление человеческой подготовки и источника окончательного исхода. Оборот «от Яхве» естественно передаёт еврейскую конструкцию принадлежности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: הַתְּשׁוּעָה
  choice: победа
  rationale: Слово может обозначать спасение, избавление или победу; в контексте битвы «победа» наиболее непосредственно передаёт смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо употребляет Тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Значение תְּשׁוּעָה в военной пословице
  choice: победа
  alternative: спасение; избавление
  rationale: Военный контекст поддерживает конкретный смысл «победа», тогда как примечание сохраняет более широкий диапазон еврейского слова.
translation_notes:
  register: Краткая, афористичная формулировка в современном литературном русском языке. Противопоставление человеческой подготовки и решающего действия Бога сохранено без усиления причинности или отрицания ценности подготовки.
