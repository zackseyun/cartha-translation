  text: Better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: ru
  text: Лучше жить на углу крыши, чем со сварливой женой в доме, который приходится делить с другими[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в доме, где живут вместе»; еврейское выражение буквально: «и дом товарищества».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: В формуле мудростного сравнения прилагательное имеет сравнительное значение; краткое «лучше» естественно для русской пословицы.
- source_word: לָשֶׁבֶת
  choice: жить
  rationale: Хотя основное значение глагола — «сидеть», в контексте места обитания ישב означает «жить, обитать».
- source_word: עַל פִּנַּת גָּג
  choice: на углу крыши
  rationale: Передаёт образ небольшого, открытого пространства на плоской крыше; сохраняет конкретность еврейского выражения.
- source_word: מֵאֵשֶׁת מִדְיָנִים
  choice: чем со сварливой женой
  rationale: Предлог מִן выражает сравнение после טוֹב, а множественное מִדְיָנִים («ссоры, раздоры») характеризует жену как склонную к ссорам. «Сварливая» — естественное и ёмкое русское соответствие.
- source_word: וּבֵית חָבֶר
  choice: в общем доме
  rationale: Трудное выражение буквально связывает «дом» с «сообществом, совместностью, товариществом». «В общем доме» сохраняет идею совместного проживания, не устраняя лексическую неоднозначность, отмеченную в сноске.
