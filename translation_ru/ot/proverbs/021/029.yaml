  yaml_path: translation/ot/proverbs/021/029.yaml
  text: A wicked man puts on a bold face[a], but an upright man makes his way sure.
translation:
  language: ru
  text: 'Нечестивый человек держится дерзко[a], а честный утверждает свои пути.


    [a] Или: «Нечестивый человек придаёт своему лицу дерзкое выражение, а честный утверждает свои пути».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нечестивый человек придаёт своему лицу дерзкое выражение, а честный утверждает свои пути».'
    reason: Сохраняет образ «лица» в הֵעֵז ... בְּפָנָיו и более явно выражает оттенок дерзости; «свои пути» передаёт формальное множественное число דרכיו.
lexical_decisions:
- source_word: הֵעֵז ... בְּפָנָיו
  choice: держится дерзко
  rationale: Сочетание каузативной формы הֵעֵז с выражением «лицом своим» описывает дерзкую, вызывающую манеру держаться. Русское «держится дерзко» естественно передаёт идиому; более буквальный вариант сохранён в сноске.
- source_word: אִישׁ רָשָׁע
  choice: нечестивый человек
  rationale: «Нечестивый» передаёт обычную для литературы мудрости нравственную категорию רָשָׁע, а «человек» сохраняет значение אִישׁ без ненужного стилистического утяжеления.
- source_word: וְיָשָׁר הוּא
  choice: а честный
  rationale: יָשָׁר означает нравственно прямого, честного человека и противопоставлен нечестивому. Союз «а» естественно выражает контраст; местоимение הוּא передано самой конструкцией противопоставления.
- source_word: יכין
  choice: твёрдо устраивает
  rationale: Каузатив от כון имеет значение «утверждать, делать прочным, надёжно устраивать». Наречие «твёрдо» сохраняет идею устойчивости, а «устраивает» — активного упорядочивания своего жизненного пути.
- source_word: דרכיו
  choice: свой путь
  rationale: Буквально форма множественного числа означает «свои пути», но в контексте это совокупный образ образа жизни. Единственное число естественнее в русском основном тексте; морфологический плюрал сохранён в более буквальном варианте сноски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой формой притчи. «Держится дерзко» понятно обычному читателю и не звучит архаично; «твёрдо устраивает свой путь» сохраняет образ намеренного утверждения жизненного курса.
