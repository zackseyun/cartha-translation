  - severity: medium
    issue: Сноска передаёт лицевую идиому как «делает своё лицо непреклонным».
    rationale: «Непреклонным» может описывать решимость, но не передаёт основной оттенок дерзости или бесстыдной самоуверенности в הֵעֵז ... בְּפָנָיו.
