  text: רוּם עֵ֭ינַיִם וּ/רְחַב לֵ֑ב נִ֖ר רְשָׁעִ֣ים חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/004.yaml
  text: Haughty eyes and a proud heart— the lamp of the wicked— are sin[a].
translation:
  language: ru
  text: Надменный взгляд, гордое сердце и светильник нечестивых — грех[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пахота нечестивых — грех»; возможно также: «возделывание» или «невспаханное поле нечестивых». Еврейское слово, переведённое как «светильник», допускает и сельскохозяйственное понимание.'
    reason: Альтернативное чтение неоднозначной еврейской формы נִר.
lexical_decisions:
- source_word: רוּם עֵינַיִם
  choice: надменный взгляд
  rationale: Буквально сочетание говорит о «высоте глаз» и идиоматически выражает высокомерие. Единственное число «взгляд» естественно по-русски передаёт образ и собирательное значение еврейского двойственного «глаза».
- source_word: וּרְחַב לֵב
  choice: гордое сердце
  rationale: Буквально «широкое сердце»; в данном контексте это не великодушие, а самомнение и гордыня. Выбор сохраняет образ сердца и ясно передаёт нравственный смысл.
- source_word: נִר
  choice: светильник
  rationale: 'Форму можно понимать как «светильник», но возможно и сельскохозяйственное толкование: «пахота/возделывание». В основном тексте выбрано традиционно засвидетельствованное чтение «светильник», а подлинная неоднозначность сохранена в сноске.'
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Обычное обозначение нравственно виновных людей в литературе мудрости. «Нечестивые» сохраняет устойчивый библейский регистр, оставаясь понятным современному читателю.
- source_word: חַטָּאת
  choice: грех
  rationale: Существительное прямо означает «грех». Именная формулировка сохраняет категоричность еврейского текста и не ослабляет её прилагательным «греховны».
theological_decisions:
- issue: Толкование נִר רְשָׁעִים
  choice: «светильник нечестивых»
  alternative: «пахота (или возделывание) нечестивых»
  rationale: Оба понимания опираются на возможные значения еврейской формы и существенно меняют оттенок смысла. Основной текст следует чтению «светильник», связывающему внешнее и внутреннее высокомерие с тем, что направляет жизнь нечестивых; сельскохозяйственное чтение не отвергается и приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой притчи. Тире сохраняют напряжённое соположение трёх именных элементов исходного текста, не устраняя его синтаксическую неоднозначность.
