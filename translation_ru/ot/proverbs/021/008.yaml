  text: The way of a guilty man is crooked and strange[a], but the conduct of the pure is upright.
translation:
  language: ru
  text: Путь виновного человека извилист, а дело чистого человека — прямо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово, переданное как «виновного», имеет неясное значение. Его также понимают как «чужой», «странный» или «отчуждённый»; возможен перевод: «Путь человека извилист и странен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲפַכְפַּךְ
  choice: извилист
  rationale: Слово обозначает искривлённость, изворотливость. «Извилист» сохраняет образ пути и ясно противопоставляется слову «прямы» во второй части стиха.
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Обычный для литературы мудрости образ жизненного поведения человека; русское «путь» естественно сохраняет эту метафору.
- source_word: אִישׁ
  choice: человека
  rationale: Хотя еврейское существительное стоит в мужском роде и единственном числе, здесь оно имеет обобщающий, пословичный смысл; «человек» естественно передаёт его по-русски.
- source_word: וָזָר
  choice: отягощённого виной
  rationale: Форма и значение слова трудны. В данном противопоставлении с «чистым» вероятен смысл виновности; развёрнутый перевод передаёт этот смысл без искусственного русского прилагательного. Иное понимание отмечено в сноске.
- source_word: זַךְ
  choice: чистого
  rationale: В контексте притчи слово указывает на нравственную чистоту или невиновность. «Чистый» сохраняет лаконичность и традиционную этическую образность.
- source_word: יָשָׁר
  choice: прямы
  rationale: Буквальный пространственный образ одновременно выражает нравственную правоту и образует точный контраст с извилистым путём.
- source_word: פָּעֳלוֹ
  choice: дела
  rationale: Существительное означает дело, действие или труд. Множественное «дела» по-русски естественно обозначает совокупность поступков человека и хорошо соотносится с его «путём».
