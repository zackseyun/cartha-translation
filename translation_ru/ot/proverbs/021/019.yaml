  text: It is better to live in a desert land than with a quarrelsome and angry wife[a].
translation:
  language: ru
  text: Лучше жить в пустынной земле, чем со сварливой и гневливой женой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чем с женой, которая сеет раздоры и досаждает». Последнее слово может указывать как на её собственную гневливость, так и на то, что она раздражает и досаждает другим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: Предикативное прилагательное вводит сравнительное изречение; краткая русская форма естественно передаёт его структуру.
- source_word: שֶׁבֶת
  choice: жить
  rationale: Инфинитив от ישׁב здесь обозначает постоянное пребывание; «жить» звучит естественнее, чем более книжное «обитать».
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: в пустынной земле
  rationale: 'Переданы оба элемента выражения: אֶרֶץ — «земля» и מִדְבָּר — необитаемая, пустынная местность.'
- source_word: מֵאֵשֶׁת
  choice: чем с ... женой
  rationale: Предлог מִן после טוֹב выражает сравнение; в русском сочетание «жить ... с женой» требует предлога «с».
- source_word: מדונים
  choice: сварливой
  rationale: Множественное абстрактное существительное מדון («раздор, ссора») характеризует жену как склонную к постоянным ссорам; «сварливая» естественно передаёт это значение.
- source_word: וָכָעַס
  choice: и гневливой
  rationale: כעס может обозначать гнев, раздражение или причиняемую досаду. Основной текст передаёт значение свойства характера, а альтернативный оттенок отмечен в сноске.
