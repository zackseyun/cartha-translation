  text: תַּאֲוַ֣ת עָצֵ֣ל תְּמִיתֶ֑/נּוּ כִּֽי מֵאֲנ֖וּ יָדָ֣י/ו לַ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/025.yaml
  text: The craving of a lazy man puts him to death, because his hands refuse to work.
translation:
  language: ru
  text: Желание ленивца умерщвляет его, потому что его руки отказываются работать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּאֲוַת
  choice: Жажда
  rationale: Передаёт сильное, неудовлетворённое желание, а не нейтральное «желание»; в контексте оно губит ленивого, который не желает трудиться.
- source_word: עָצֵל
  choice: ленивого
  rationale: Обычное и естественное русское обозначение ленивого человека, соответствующее характерному для Притч типу.
- source_word: תְּמִיתֶנּוּ
  choice: ведёт его к смерти
  rationale: Естественно передаёт каузативный смысл «умерщвляет его», не создавая впечатления мгновенного физического действия.
- source_word: מֵאֲנוּ
  choice: отказываются
  rationale: Сохраняет олицетворение рук и выражает волевой отказ, заложенный в еврейском глаголе.
- source_word: לַעֲשׂוֹת
  choice: работать
  rationale: В данном контексте общий глагол «делать» означает трудиться; «работать» ясно и естественно выражает смысл.
theological_decisions:
- issue: Характер смерти, к которой приводит жажда ленивого
  choice: «ведёт его к смерти» без уточнения вида смерти
  alternative: «убивает его»
  rationale: Источник утверждает смертельный итог, но не уточняет, идёт ли речь о прямой физической гибели, постепенном разорении или более широком гибельном последствии; перевод не должен сужать эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма и параллелизм сохранены. Формулировка понятна широкой аудитории и не добавляет конфессиональных толкований.
