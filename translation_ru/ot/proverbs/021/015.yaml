  text: שִׂמְחָ֣ה לַ֭/צַּדִּיק עֲשׂ֣וֹת מִשְׁפָּ֑ט וּ֝/מְחִתָּ֗ה לְ/פֹ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/015.yaml
  text: Doing justice is a joy to the righteous[a], but destruction to evildoers.
translation:
  language: ru
  text: Поступать по справедливости — радость для праведника, но гибель[a] для тех, кто творит зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ужас». Еврейское слово может означать ужас, смятение, гибель или разорение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: радость
  rationale: Существительное означает радость или веселье; «радость» естественно передаёт именную форму и сохраняет краткость изречения.
- source_word: לַצַּדִּיק
  choice: для праведника
  rationale: Предлог ל обозначает отношение, а единственное число צַדִּיק имеет обобщающий смысл. «Для праведника» естественно звучит по-русски и сохраняет этот смысл.
- source_word: עֲשׂוֹת
  choice: поступать
  rationale: Инфинитив выражает действие как общий принцип, а не единичный поступок. В сочетании «поступать по справедливости» это передано ясно и современно.
- source_word: מִשְׁפָּט
  choice: по справедливости
  rationale: В контексте литературы мудрости слово обозначает справедливость и правый порядок. Такая передача не сужает значение до судебного разбирательства.
- source_word: וּמְחִתָּה
  choice: но гибель
  rationale: Существительное может обозначать ужас, смятение либо гибель и разорение. «Гибель» хорошо передаёт губительный исход для творящих зло, а союз «но» явно выражает антитезу, подразумеваемую еврейским ו.
- source_word: לְפֹעֲלֵי אָוֶן
  choice: для тех, кто творит зло
  rationale: Фраза буквально говорит о «делающих/творящих нечестие». Развёрнутая русская передача естественна и сохраняет акцент на постоянном совершении зла.
- source_word: אָוֶן
  choice: зло
  rationale: В сочетании с «творящими» слово обозначает нравственное зло или нечестие, а не просто беду.
