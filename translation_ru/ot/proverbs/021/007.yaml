  text: שֹׁד רְשָׁעִ֥ים יְגוֹרֵ֑/ם כִּ֥י מֵ֝אֲנ֗וּ לַ/עֲשׂ֥וֹת מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/007.yaml
  text: The violence of the wicked will drag them away[a], because they refuse to do justice.
translation:
  language: ru
  text: Насилие нечестивых сметёт их[a], потому что они отказываются поступать справедливо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Грабёж нечестивых сметёт их». Еврейский глагол здесь труден для истолкования; его понимают как «сметёт», «увлечёт (унесёт)» или, по другому толкованию, «устрашит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁד
  choice: насилие
  rationale: Слово обозначает насильственное разорение, опустошение или грабёж. В сочетании с отказом поступать справедливо «насилие» естественно передаёт широкий смысл разрушительного зла, не сужая его до кражи.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Традиционное и понятное в жанре притчи обозначение нравственно виновных людей; родительный падеж передаёт принадлежность их собственного насилия.
- source_word: יְגוֹרֵם
  choice: увлечёт их самих
  rationale: Трудная глагольная форма с местоименным суффиксом допускает понимание как насильственного унесения или сметания. «Увлечёт» сохраняет образ того, как собственное зло уносит совершающих его, а «их самих» ясно передаёт объектный суффикс и возвратное следствие.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание предшествующего утверждения и ясно звучит в современном русском языке.
- source_word: מֵאֲנוּ
  choice: они отказываются
  rationale: Передаёт сознательный отказ; настоящее время соответствует обобщающему характеру притчи.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: поступать справедливо
  rationale: Идиоматично передаёт этическое значение выражения — творить правосудие и делать то, что справедливо, а не просто выносить судебное решение.
theological_decisions:
- issue: Воздаяние через собственное зло нечестивых
  choice: Сохранено грамматическое представление, что их собственное насилие увлекает их самих.
  alternative: Передать неопределённого внешнего деятеля, который унесёт нечестивых.
  rationale: В еврейском тексте подлежащим естественно выступает שֹׁד רְשָׁעִים, а суффикс в יְגוֹרֵם указывает на самих нечестивых; перевод не уточняет сверх текста механизм воздаяния.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Нечестивые» сохраняет достоинство библейской притчи, а «поступать справедливо» звучит естественнее буквального «делать правосудие».
