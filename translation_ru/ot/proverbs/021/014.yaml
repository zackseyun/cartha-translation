base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/014.yaml
  text: A gift in secret subdues anger[a], and a bribe in the bosom, fierce wrath.
translation:
  language: ru
  text: 'Подарок, данный тайно, укрощает гнев,

    а взятка, спрятанная за пазухой, укрощает лютую ярость.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в лоне» или «в складке одежды»; речь о взятке, скрытой в одежде, что подчёркивает тайный характер передачи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: подарок
  rationale: Обозначает подарок или подношение; нейтральное «подарок» не привносит заранее отрицательного смысла «взятка», поскольку во второй строке употреблено отдельное слово שֹׁחַד.
- source_word: בַּסֵּתֶר
  choice: тайный
  rationale: Передаёт значение скрытого, совершаемого втайне действия и позволяет сохранить краткость и параллелизм притчи.
- source_word: יִכְפֶּה
  choice: укрощает
  rationale: В данном контексте выражает подавление или усмирение гнева; «укрощает» естественно по-русски и не утверждает, что гнев полностью исчезает.
- source_word: אָף
  choice: гнев
  rationale: Буквально слово связано с «носом», но здесь это устойчивое древнееврейское обозначение гнева.
- source_word: שֹׁחַד
  choice: взятка
  rationale: Слово обычно обозначает подкуп или взятку; такой перевод сохраняет отличие от нейтрального מַתָּן в первой строке.
- source_word: בַּחֵק
  choice: за пазухой
  rationale: Образ указывает на предмет, скрытый у груди в складке одежды. «За пазухой» естественно передаёт по-русски как место, так и скрытность передачи.
- source_word: חֵמָה עַזָּה
  choice: лютую ярость
  rationale: Сочетание обозначает сильную, неистовую ярость и усиливает вторую строку по сравнению с обычным «гневом» в первой.
theological_decisions:
- issue: Описывает ли притча взятку одобрительно
  choice: Сохранено наблюдение о действенности тайного дара и взятки без добавления нравственной оценки.
  alternative: Явно осудить взятку или представить изречение как совет давать её.
  rationale: Сам стих формулирует житейское наблюдение, а не выражает явного одобрения или повеления; перевод не должен разрешать эту нравственную напряжённость за текст.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. «За пазухой» сохраняет древний телесно-одежный образ без неестественного для русского «в лоне»; тире во второй строке передаёт эллипсис древнееврейского параллелизма.
