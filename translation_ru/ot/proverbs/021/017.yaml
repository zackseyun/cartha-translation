  text: אִ֣ישׁ מַ֭חְסוֹר אֹהֵ֣ב שִׂמְחָ֑ה אֹהֵ֥ב יַֽיִן וָ֝/שֶׁ֗מֶן לֹ֣א יַעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/017.yaml
  text: A man who loves pleasure will become poor[b][a]; whoever loves wine and oil will not become rich.
translation:
  language: ru
  text: Кто любит веселье[a], тот обеднеет; кто любит вино и масло[b], тот не разбогатеет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радость» либо «празднества». Еврейское слово может обозначать радость или праздничное веселье; здесь, вероятно, имеется в виду жизнь, сосредоточенная на развлечениях.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, речь идёт об оливковом масле. Оно могло служить не только пищей, но и средством для умащения; в данном сочетании может иметь оттенок достатка или роскоши.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ מַחְסוֹר
  choice: тот обеднеет
  rationale: 'Буквально сочетание означает «человек нужды (недостатка)». В контексте притчи оно естественно передаёт итог такого образа жизни: человек окажется в бедности. Будущее «обеднеет» сохраняет назидательную причинно-следственную силу высказывания.'
- source_word: אֹהֵב שִׂמְחָה
  choice: кто любит веселье
  rationale: שִׂמְחָה обозначает радость, веселье или праздничное ликование. Здесь параллель с любовью к вину и маслу указывает на пристрастие к увеселениям, однако перевод «веселье» сохраняет более широкий смысл исходного слова, не объявляя всякую радость предосудительной.
- source_word: אֹהֵב יַיִן וָשֶׁמֶן
  choice: кто любит вино и масло
  rationale: Прямой перевод сохраняет конкретные образы еврейского текста. Масло, обычно оливковое, могло быть не только пищей, но и дорогим средством ухода или умащения, поэтому в данной паре оно может подразумевать роскошный образ жизни.
- source_word: לֹא יַעֲשִׁיר
  choice: тот не разбогатеет
  rationale: Порода hифиль глагола עשר без выраженного объекта имеет здесь непереходное результативное значение — «стать богатым, разбогатеть». Перевод не расширяет смысл до общего «не преуспеет».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; параллельная конструкция «кто любит… тот…» передаёт афористичность и синтаксический параллелизм древнееврейской притчи. Формулировка понятна широкому читателю и сохраняет различие между «обеднеет» и «не разбогатеет».
