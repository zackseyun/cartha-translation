  text: פַּלְגֵי מַ֣יִם לֶב מֶ֭לֶךְ בְּ/יַד יְהוָ֑ה עַֽל כָּל אֲשֶׁ֖ר יַחְפֹּ֣ץ יַטֶּֽ/נּוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/001.yaml
  text: A king’s heart is like channels of water in the hand of Yahweh[b][a]; he turns it wherever he desires.
translation:
  language: ru
  text: 'Сердце царя в руке Яхве — как водные русла[a]: куда пожелает[b], туда Он его направляет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «водные потоки» или «водные каналы». Еврейский образ — разделённые водные русла, течение которых можно направлять.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «куда Ему угодно». Еврейский глагол может означать «желать», «хотеть» или «находить удовольствие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: водные потоки
  rationale: Сочетание обозначает разделённые потоки, русла или оросительные каналы, течение которых можно направлять. «Водные потоки» естественно звучит по-русски и сохраняет образ управляемой воды; более технический оттенок вынесен в сноску.
- source_word: לֶב מֶלֶךְ
  choice: сердце царя
  rationale: Конструктивное сочетание выражает общую истину о любом царе. В русском языке отсутствие артикля позволяет сохранить эту обобщённость без добавления «одного» или «всякого».
- source_word: בְּיַד יְהוָה
  choice: в руке Яхве
  rationale: Сохранён древнееврейский образ нахождения во власти и под управлением Бога, без ослабляющего разъяснительного пересказа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: עַל כָּל אֲשֶׁר
  choice: куда
  rationale: В сочетании с глаголом направления оборот естественно обозначает направление к любой избранной цели; «куда» ясно и идиоматично передаёт это значение.
- source_word: יַחְפֹּץ
  choice: пожелает
  rationale: Глагол חפץ может означать желать, хотеть или находить удовольствие. «Пожелает» сохраняет волевой смысл, не придавая ему лишней философской определённости.
- source_word: יַטֶּנּוּ
  choice: Он направляет его
  rationale: Каузативная форма נָטָה означает поворачивать, склонять или направлять. «Направляет» хорошо согласуется с образом водных потоков, а местоимение «его» явно относится к сердцу царя.
theological_decisions:
- issue: Божественная власть над правителями
  choice: Текст утверждает действительную власть Яхве направлять внутренние устремления царя, сохраняя образ потоков в Его руке.
  alternative: Можно было бы истолковать стих либо сильнее — как утверждение исчерпывающего детерминизма, либо слабее — как простое влияние или совет.
  rationale: Формулировка «в руке Яхве» и глагол «направляет» сохраняют силу утверждения, но не решают не поставленный самим стихом позднейший спор о соотношении Божьего владычества и человеческой свободы.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем притчи. Двоеточие делает связь образа и действия прозрачной; прописное «Он» однозначно указывает на Яхве. Все маркеры сносок присутствуют в основном тексте.
