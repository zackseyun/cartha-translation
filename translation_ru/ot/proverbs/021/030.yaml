  text: אֵ֣ין חָ֭כְמָה וְ/אֵ֣ין תְּבוּנָ֑ה וְ/אֵ֥ין עֵ֝צָ֗ה לְ/נֶ֣גֶד יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/030.yaml
  text: There is no wisdom[a], no understanding, and no counsel against Yahweh.
translation:
  language: ru
  text: Нет ни мудрости, ни разумения, ни совета против Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Яхве» или «в присутствии Яхве». Еврейское выражение может обозначать нахождение перед кем-либо, но здесь, вероятно, имеет смысл противостояния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: нет ни… ни… ни…
  rationale: Троекратное אֵין передано повторяющейся русской отрицательной конструкцией, которая сохраняет эмфазу и естественно объединяет однородные члены.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное значение слова в книге Притч; обозначает практическую, умелую мудрость.
- source_word: תְּבוּנָה
  choice: разумение
  rationale: Сохраняет отличие от «мудрости» и в возвышенном, но понятном русском языке передаёт способность понимать и различать.
- source_word: עֵצָה
  choice: совет
  rationale: Передаёт совещательное решение, замысел или стратегию и сохраняет традиционную триаду понятий.
- source_word: לְנֶגֶד
  choice: против
  rationale: 'В данном контексте выражение, вероятнее всего, обозначает противостояние: никакая мудрость или стратегия не может успешно выступить против Яхве. Пространственное значение сохранено в сноске.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон; форма «Яхве» передаёт личное имя и не подменяет его титулом.
- issue: Смысл выражения לְנֶגֶד יְהוָה
  choice: против Яхве
  alternative: перед Яхве; в присутствии Яхве
  rationale: Контекст афоризма, вероятнее всего, говорит о невозможности мудрости, разумения или совета устоять в противодействии Яхве. Однако сама еврейская конструкция допускает пространственный смысл, поэтому он отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким афористичным синтаксисом. Повтор «ни» сохраняет ритм и усиленное отрицание оригинала; «разумение» поддерживает достоинство поэтического регистра, оставаясь понятным.
