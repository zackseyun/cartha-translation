  text: עִ֣יר גִּ֭בֹּרִים עָלָ֣ה חָכָ֑ם וַ֝/יֹּ֗רֶד עֹ֣ז מִבְטֶחָֽ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/022.yaml
  text: A wise man goes up against the city of mighty men and brings down the stronghold in which they trust[a].
translation:
  language: ru
  text: Мудрый идёт на город могучих и низвергает оплот, на который они надеются[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мудрый идёт на город воинов и низвергает силу его уверенности». Еврейское слово, переданное как «оплот», может означать «силу» или «мощь». Женский суффикс в еврейском тексте, вероятно, относится к «городу»; основной перевод передаёт его доверие как доверие живущих в нём могучих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: город
  rationale: Основное значение — город, в данном военном контексте, вероятно, укреплённый; «город» естественно сохраняет широту еврейского слова.
- source_word: גִּבֹּרִים
  choice: могучих
  rationale: Субстантивированное «могучие» передаёт силу и возможный воинский оттенок, не сужая значение до одних лишь воинов.
- source_word: עָלָה
  choice: поднимается против
  rationale: Глагол буквально означает «подниматься», а в контексте похода на город — выступать против него; формулировка сохраняет исходный образ и делает противостояние ясным.
- source_word: חָכָם
  choice: мудрый
  rationale: Единственное число мужского рода употреблено субстантивно и выражает типичного героя притчи; краткое «мудрый» звучит естественно по-русски.
- source_word: וַיֹּרֶד
  choice: и низвергает
  rationale: Каузативная форма означает «заставляет спуститься, низводит»; «низвергает» уместно для сокрушения укреплённой мощи и сохраняет образ движения вниз.
- source_word: עֹז
  choice: твердыню
  rationale: Обычно слово означает «сила, мощь», но военный контекст допускает конкретизацию как укреплённой опоры. Альтернативное буквальное понимание сохранено в сноске.
- source_word: מִבְטֶחָה
  choice: на которую они надеются
  rationale: Существительное выражает доверие или уверенность; местоименный суффикс женского рода соотносится с городом. Относительная конструкция естественно передаёт объект их упования.
theological_decisions:
- issue: Соотношение мудрости и военной мощи
  choice: Сохранено прямое противопоставление одного мудрого городу могучих без пояснения природы его мудрости.
  alternative: Истолковать мудрость явно как дар Бога или как военную хитрость.
  rationale: Сам стих не уточняет источник или разновидность мудрости; конкретизация устранила бы намеренную ёмкость притчи.
translation_notes:
  register: Современный литературный русский язык с краткой, образной формой притчи. «Низвергает» и «твердыня» придают фразе достоинство, оставаясь понятными; неоднозначность עֹז и референция женского суффикса отмечены в сноске.
