    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: душа
  rationale: В данном контексте слово обозначает внутреннее существо человека как средоточие желаний. «Душа» сохраняет ёмкость и образность еврейского выражения, не сводя его значение только к аппетиту или хотению.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Прилагательное употреблено как существительное и обозначает типичного нравственно порочного человека. Представительное единственное число сохранено.
- source_word: אִוְּתָה
  choice: жаждет
  rationale: Глагол выражает сильное желание. «Жаждет» естественно передаёт его интенсивность и хорошо сочетается в русском языке с нравственным объектом «зло».
- source_word: רָע
  choice: зло
  rationale: В контексте притчи слово имеет прежде всего нравственный смысл, хотя может включать и причиняемый другим вред. «Зло» сохраняет эту смысловую широту.
- source_word: יֻחַן
  choice: не проявляет милости
  rationale: Пассивная форма глагола חנן означает «быть удостоенным милости, благоволения». Ради естественного русского синтаксиса высказывание передано активной конструкцией с тем же действующим лицом; буквальная форма отмечена в сноске.
- source_word: בְּעֵינָיו
  choice: в основном тексте передано смыслом; буквально «в его глазах»
  rationale: Еврейский оборот обозначает отношение или оценку человека. Его буквальная образность сохранена в сноске, тогда как основной текст звучит естественно по-русски.
- source_word: רֵעֵהוּ
  choice: своему ближнему
  rationale: רֵעַ может означать ближнего, товарища, друга или другого человека из ближайшего круга. «Ближний» лучше всего сохраняет широкий общественно-нравственный смысл.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: Сохранено слово «душа» как обозначение внутреннего существа и желаний человека.
  alternative: «Сам нечестивый» или «желание нечестивого»
  rationale: Перевод не превращает стих в специальное утверждение о составе человеческой природы, но и не устраняет значимый библейский образ внутреннего человека.
- issue: Характер отношения к ближнему в יֻחַן
  choice: «Не проявляет милости»
  alternative: «Не щадит» или «не одобряет»
  rationale: Формулировка сохраняет смысл отсутствия милости или благоволения, не усиливая его до прямого насилия и не сужая до одной лишь внутренней оценки.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Первое полустишие сохраняет антропологический образ оригинала, а второе передаёт еврейский идиоматический оборот естественной русской конструкцией; буквальная форма дана в сноске.
