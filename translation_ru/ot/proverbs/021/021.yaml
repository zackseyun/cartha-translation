source:
  edition: WLC
  text: רֹ֭דֵף צְדָקָ֣ה וָ/חָ֑סֶד יִמְצָ֥א חַ֝יִּ֗ים צְדָקָ֥ה וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/021.yaml
  text: Whoever pursues righteousness and steadfast love will find life[a], righteousness[c][b], and honor.
translation:
  language: ru
  text: Кто стремится к праведности[a] и верной любви[b], тот обретёт жизнь, праведность[c] и честь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости». Еврейское слово может обозначать как личную праведность, так и справедливые поступки.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское хесед означает любовь, проявляющуюся в верности; возможны также переводы «доброта», «милость» или «преданная любовь».
    reason: lexical_alternative
  - marker: c
    text: Во втором случае «праведность» может также иметь смысл «оправдание» или «признание правоты».
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹדֵף
  choice: стремится к
  rationale: Причастие передаёт постоянное, деятельное устремление. Русское «стремится к» естественно звучит в общем изречении и не создаёт неуместного оттенка погони.
- source_word: צְדָקָה
  choice: праведность
  rationale: Слово охватывает как нравственную правоту, так и справедливое поведение. «Праведность» сохраняет широту понятия и повтор ключевого слова в обеих частях стиха.
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Сочетание передаёт любовь, проявляющуюся в верности, преданности и милости, не сводя חֶסֶד только к доброте или состраданию.
- source_word: יִמְצָא
  choice: обретёт
  rationale: Имперфект выражает обычный результат описанного пути. «Обретёт» естественно сочетается с жизнью, праведностью и честью и передаёт больше, чем случайную находку.
- source_word: חַיִּים
  choice: жизнь
  rationale: Формально множественное существительное здесь имеет обычное собирательное значение «жизнь».
- source_word: צְדָקָה
  choice: праведность
  rationale: Повтор сохранён, поскольку он значим для строения изречения; контекст вместе с тем допускает оттенок оправдания или признания правоты.
- source_word: כָבוֹד
  choice: честь
  rationale: В данном ряду слово естественно обозначает почёт и общественное достоинство; «честь» не привносит обязательного значения материального благополучия.
theological_decisions:
- issue: Значение повторённого צְדָקָה в контексте литературы мудрости
  choice: «праведность» в обоих случаях
  alternative: «справедливость» в одном или обоих случаях; «оправдание» или «признание правоты» во втором случае
  rationale: Одинаковый перевод сохраняет еврейский повтор и нравственно-богословскую симметрию изречения, тогда как примечания позволяют не скрывать смысловую широту слова и особый возможный оттенок второго употребления.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным пословичным строем. Синтаксическая конструкция «кто… тот…» ясно выражает обобщённый характер высказывания. Лексический повтор «праведность» намеренно сохранён.
