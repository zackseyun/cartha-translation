  text: מַחְשְׁב֣וֹת חָ֭רוּץ אַךְ לְ/מוֹתָ֑ר וְ/כָל אָ֝֗ץ אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/005.yaml
  text: The plans of the diligent surely lead to abundance[c][b][a], but everyone who is hasty surely comes to want.
translation:
  language: ru
  text: Замыслы усердного непременно ведут к достатку[a], а всякий торопливый — непременно к нужде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к прибыли»; еврейское слово может означать избыток, выгоду или преимущество.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к бедности»; еврейское слово может обозначать недостаток, нужду или обнищание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: замыслы
  rationale: В контексте Притчей слово обозначает обдуманные намерения и планы, а не просто мысли; «замыслы» естественно сочетается с родительным «усердного».
- source_word: חָרוּץ
  choice: усердного
  rationale: Субстантивированное прилагательное передаёт человека деятельного, старательного и трудолюбивого; «усердный» звучит современно и достойно.
- source_word: אַךְ
  choice: непременно
  rationale: В обеих половинах стиха частица подчёркивает закономерность результата; повтор сохранён для передачи параллелизма и категоричности изречения.
- source_word: לְמוֹתָר
  choice: ведут к достатку
  rationale: מוֹתָר может означать избыток, выгоду или преимущество. В противопоставлении нужде «достаток» ясно передаёт положительный материальный результат, а «ведут к» естественно выражает подразумеваемую связь.
- source_word: וְכָל
  choice: а всякий
  rationale: Союз передан как «а», поскольку он вводит антитетическую вторую строку, не усиливая противопоставление сверх еврейского текста; «всякий» сохраняет распределительное значение כָל.
- source_word: אָץ
  choice: торопливый
  rationale: Причастие обозначает того, кто спешит или действует поспешно; субстантивированное «торопливый» сохраняет характеристику человека, а не единичного поступка.
- source_word: לְמַחְסוֹר
  choice: к нужде
  rationale: מַחְסוֹר охватывает недостаток, нужду и бедность. «Нужда» сохраняет широту значения и образует ясную антитезу достатку.
