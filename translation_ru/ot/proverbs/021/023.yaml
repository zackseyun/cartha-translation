lexical_decisions:
- source_word: שֹׁמֵר
  choice: хранит
  rationale: Причастие породы qal означает «стеречь, хранить, оберегать». Повторение «хранит» в обеих частях передаёт повтор еврейского глагола и причинно-следственную форму изречения.
- source_word: פִּיו
  choice: свои уста
  rationale: Буквально передаёт образ речи; «уста» естественно сочетаются с глаголом «хранить» и сохраняют достоинство поэтического регистра.
- source_word: וּלְשׁוֹנוֹ
  choice: и свой язык
  rationale: Сохранён исходный образ, где язык метонимически обозначает речь.
- source_word: מִצָּרוֹת
  choice: от бед
  rationale: Множественное число обозначает беды, тяготы или тяжёлые обстоятельства. «Беды» — ясный и ёмкий русский эквивалент без излишнего усиления.
- source_word: נַפְשׁוֹ
  choice: себя
  rationale: Здесь נֶפֶשׁ естественно обозначает самого человека, его жизнь или личность, а не обязательно нематериальную «душу» в специальном богословском смысле.
theological_decisions:
- issue: Передача נַפְשׁוֹ
  choice: себя
  alternative: свою жизнь; свою душу
  rationale: В контексте практической мудрости речь идёт о том, что сдержанность в речи оберегает самого человека от бед. «Себя» передаёт идиоматический смысл и не навязывает тексту определённую антропологическую схему; буквальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим библейским оттенком. Пара «уста — язык» сохраняет образность и параллелизм оригинала; повтор «хранит» воспроизводит ключевой стилистический приём еврейского текста.
