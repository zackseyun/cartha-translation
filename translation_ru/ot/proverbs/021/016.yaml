source:
  edition: WLC
  text: אָדָ֗ם תּ֭וֹעֶה מִ/דֶּ֣רֶךְ הַשְׂכֵּ֑ל בִּ/קְהַ֖ל רְפָאִ֣ים יָנֽוּחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/016.yaml
  text: A man who wanders from the way of understanding will come to rest in the assembly of the dead[a].
translation:
  language: ru
  text: Человек, сбившийся с пути разумения, упокоится в собрании мёртвых[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теней умерших». Еврейское слово «рефаим» в литературе мудрости обозначает умерших.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: Человек
  rationale: Единственное число представляет типичного человека в изречении; русское «человек» естественно передаёт обобщённый смысл без ненужного указания на пол.
- source_word: תּוֹעֶה
  choice: сбившийся
  rationale: Причастие описывает того, кто блуждает или уклоняется от пути. «Сбившийся с пути» естественно сохраняет метафору и подразумевает уже совершающееся отклонение.
- source_word: מִדֶּרֶךְ
  choice: с пути
  rationale: «Путь» — устойчивый образ образа жизни и поведения в литературе мудрости.
- source_word: הַשְׂכֵּל
  choice: разумения
  rationale: Слово обозначает разумное понимание, проницательность и благоразумие. «Разумение» сохраняет ёмкость и возвышенный, но понятный регистр изречения.
- source_word: בִּקְהַל
  choice: в собрании
  rationale: קהל обозначает собравшееся сообщество; «собрание» сохраняет групповой образ и не вносит узкоцерковного оттенка.
- source_word: רְפָאִים
  choice: мёртвых
  rationale: В литературе мудрости здесь подразумеваются умершие, пребывающие в мире мёртвых, а не древний народ рефаимов. Более буквальный образный вариант указан в сноске.
- source_word: יָנוּחַ
  choice: упокоится
  rationale: Глагол означает покоиться, обрести место покоя. В данном контексте «упокоится» лаконично передаёт конечный исход среди умерших, не добавляя явного утверждения о мире или блаженстве.
theological_decisions:
- issue: Значение רְפָאִים в литературе мудрости
  choice: мёртвых
  alternative: теней умерших; рефаимов
  rationale: Контекст говорит об участи человека в сообществе умерших. Транслитерация «рефаимы» для большинства читателей затемнила бы смысл, а «тени» точнее сохраняет древний образ, но менее непосредственно понятно; поэтому этот оттенок вынесен в сноску.
- issue: Оттенок יָנוּחַ в контексте смерти
  choice: упокоится
  alternative: будет покоиться; найдёт покой
  rationale: Форма указывает на итог отклонения от пути разумения. Перевод сохраняет намеренную мрачную связь покоя со смертью, не превращая её ни в обещание блаженства, ни в подробное учение о посмертной участи.
translation_notes:
  register: Современный литературный русский язык с лаконичным афористическим ритмом. Сочетание «путь разумения» сохраняет лексику мудрости, а «упокоится» поддерживает игру между покоем и смертью; архаизация ограничена и остаётся понятной обычному читателю.
