  yaml_path: translation/ot/proverbs/021/006.yaml
  text: The getting of treasures by a lying tongue is a fleeting vapor[c][b][a], a snare of those who seek death.
translation:
  language: ru
  text: Приобретение сокровищ лживым языком[a] — развеивающийся пар[b], удел ищущих смерти.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с помощью лживой речи»; буквально: «языком лжи».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «гонимый прочь пар» — образ чего-то непрочного и быстро исчезающего.'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительные еврейские слова буквально означают «ищущие смерти», но их связь с остальной частью стиха не вполне ясна. Возможно также: «те, кто наживает такое богатство, ищут смерти»; в некоторых переводах, опирающихся на древние версии, — «смертельная западня».'
    reason: alternative_reading
lexical_decisions:
- source_word: פֹּעַל אֹצָרוֹת
  choice: приобретение богатства
  rationale: פֹּעַל обозначает действие, труд или результат действия, а אֹצָרוֹת — сокровища, накопленные ценности. В данном контексте сочетание естественно передаёт процесс наживания богатства, не сводя смысл к буквальному созданию сокровищ.
- source_word: בִּלְשׁוֹן שָׁקֶר
  choice: лживым языком
  rationale: 'Сохраняется образное выражение «язык лжи» и инструментальное значение предлога: богатство приобретают посредством лжи.'
- source_word: הֶבֶל נִדָּף
  choice: развеивающийся пар
  rationale: הֶבֶל — дыхание, пар, нечто непрочное и мимолётное; נִדָּף означает «гонимый, развеиваемый». Формулировка сохраняет конкретный образ быстрого исчезновения.
- source_word: מְבַקְשֵׁי מָוֶת
  choice: добывающие его ищут смерти
  rationale: 'Масоретский текст буквально содержит «ищущие смерти», но синтаксическая связь с предыдущей строкой сжата и не вполне ясна. Основной текст выражает вероятный смысл: наживающие такое богатство тем самым ищут собственной гибели.'
theological_decisions:
- issue: Синтаксическая и смысловая связь выражения מְבַקְשֵׁי מָוֶת с первой частью стиха
  choice: «добывающие его ищут смерти»
  alternative: «для ищущих смерти»; по некоторым древним версиям и основанным на них переводам — «смертельная западня»
  rationale: Выбранное прочтение следует согласному тексту MT и связывает «ищущих смерти» с людьми, которые наживают богатство ложью. Поскольку еврейская конструкция допускает более одного понимания, альтернативы вынесены в примечание, а не устранены молча.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и афористичная, с сохранением поэтического образа пара и мрачной неоднозначности заключительной фразы.
