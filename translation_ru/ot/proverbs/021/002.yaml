  text: כָּֽל דֶּרֶךְ אִ֭ישׁ יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן לִבּ֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/002.yaml
  text: Every man's way is right in his own eyes[a], but Yahweh weighs hearts.
translation:
  language: ru
  text: Каждому человеку его путь кажется правильным, но Яхве взвешивает сердца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: всякий
  rationale: 'Передаёт дистрибутивный смысл: речь идёт о каждом человеческом пути.'
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Сохраняет характерную для литературы мудрости метафору образа жизни и поведения.
- source_word: אִישׁ
  choice: человека
  rationale: Естественно передаёт родовое значение древнееврейского существительного в современной русской пословичной формулировке.
- source_word: יָשָׁר
  choice: правилен
  rationale: В данном контексте слово обозначает то, что человек считает верным или надлежащим; форма согласована с существительным «путь».
- source_word: בְּעֵינָיו
  choice: в его собственных глазах
  rationale: Сохраняет древнееврейскую идиому и ясно выражает субъективную самооценку.
- source_word: וְתֹכֵן
  choice: но ... взвешивает
  rationale: Союз передан противопоставлением, очевидным по смыслу изречения, а глагол сохраняет образ взвешивания и оценки.
- source_word: לִבּוֹת
  choice: сердца
  rationale: Сохраняет библейский антропологический образ внутреннего человека, включая мысли, намерения и побуждения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Объект Божьей оценки
  choice: сердца
  alternative: побуждения
  rationale: Более конкретное толкование как «побуждения» возможно по контексту, однако «сердца» сохраняет широту исходного образа и его богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранены метафоры пути, глаз и взвешивания сердец; синтаксис остаётся ясным для обычного читателя.
