source:
  edition: WLC
  text: כָּל הַ֭/יּוֹם הִתְאַוָּ֣ה תַאֲוָ֑ה וְ/צַדִּ֥יק יִ֝תֵּ֗ן וְ/לֹ֣א יַחְשֹֽׂךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/026.yaml
  text: All day long he craves greedily[b][a], but the righteous gives and does not hold back.
translation:
  language: ru
  text: Весь день он жаждет и жаждет[a], а праведник[b] даёт и не скупится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «желает желанием». В еврейском тексте глагол усилен однокоренным существительным.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте — форма мужского рода в единственном числе, употреблённая как обозначение праведного человека вообще.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Весь день
  rationale: Естественное русское выражение, передающее непрерывность действия на протяжении дня.
- source_word: הִתְאַוָּה תַאֲוָה
  choice: жаждет и жаждет
  rationale: Глагол с однокоренным существительным усиливает действие. Русское повторение естественно передаёт настойчивое, непрекращающееся желание, не уточняя его предмет и не добавляя прямо не выраженной оценки «алчно».
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода в единственном числе; «праведник» сохраняет форму типичного представителя и хорошо звучит в русской сентенции.
- source_word: יִתֵּן
  choice: даёт
  rationale: Простая форма настоящего времени передаёт обычное, характерное действие в пословичном высказывании.
- source_word: לֹא יַחְשֹׂךְ
  choice: не скупится
  rationale: В данном противопоставлении естественно выражает готовность давать, ничего не придерживая; это более идиоматично по-русски, чем непереходное «не удерживает».
theological_decisions:
- issue: Неявный субъект первой части
  choice: Сохранено местоимение «он» без прямого отождествления в самом стихе.
  alternative: «Ленивец» или «алчный человек»
  rationale: В еврейском тексте субъект выражен только формой глагола и может определяться из предыдущего стиха; явное наименование здесь сузило бы текст.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Повтор «жаждет и жаждет» сохраняет выразительное усиление оригинала, а «не скупится» естественно передаёт контраст между неутолимым желанием и щедростью.
