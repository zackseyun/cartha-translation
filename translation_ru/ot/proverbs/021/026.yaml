  terminology: «Праведник» — устоявшееся и естественное соответствие צַדִּיק в данном жанре; оно сохраняет единственное число и типизирующую функцию. Сноски корректно поясняют еврейское усиление и репрезентативную форму мужского рода, не вводя доктринальных утверждений.
