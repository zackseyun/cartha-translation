  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֵבָ֑ה אַ֝֗ף כִּֽי בְ/זִמָּ֥ה יְבִיאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/027.yaml
  text: The sacrifice of the wicked is an abomination[a]; how much more when he brings it with evil intent.
translation:
  language: ru
  text: Жертва нечестивых — мерзость; тем более, когда нечестивый приносит её со злым умыслом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем более, когда он приносит её с коварным замыслом». Еврейское слово может означать порочное намерение или злонамеренный замысел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: жертва
  rationale: Слово обозначает жертвенное приношение, в особенности закланную жертву; «жертва» естественно и точно передаёт смысл в контексте Притчей.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе обозначает нравственно виновных людей как общую категорию; родительный падеж естественно зависит от слова «жертва».
- source_word: תּוֹעֵבָה
  choice: мерзость
  rationale: Сильное слово, обозначающее нечто отвратительное и неприемлемое перед Богом; традиционное русское «мерзость» сохраняет нравственно-богословскую силу и остаётся понятным.
- source_word: אַף כִּי
  choice: тем более
  rationale: 'Сочетание усиливает первую часть высказывания: если жертва нечестивых уже мерзость, то при указанном далее условии — тем более.'
- source_word: בְּזִמָּה
  choice: со злым умыслом
  rationale: זִמָּה может обозначать порочный замысел, злое намерение или развращённость. Здесь выражение указывает на нравственно испорченную цель принесения жертвы, не обязательно на сексуальный смысл.
- source_word: יְבִיאֶנּוּ
  choice: её приносят
  rationale: Каузативная форма בוא значит «приносить/доставлять», а местоименный суффикс естественнее всего относится к жертве. Безлично-обобщённая русская конструкция сохраняет связь с множественным «нечестивых» и звучит естественно.
theological_decisions:
- issue: Нравственная оценка жертвы нечестивых
  choice: Обрядовая жертва отвратительна, когда её приносят нечестивые, и особенно — когда за ней стоит злой умысел.
  alternative: 'Вторая часть может пониматься шире: «тем более, когда её приносят в нечестии», без подчёркивания продуманного замысла.'
  rationale: Стих осуждает не жертвоприношение само по себе, а поклонение, соединённое с нечестием и порочной целью. Перевод не привносит общего отрицания жертвенной практики.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Мерзость» сохраняет достоинство и силу библейской нравственной оценки; «со злым умыслом» естественно выражает неоднозначное בְּזִמָּה, а сноска сохраняет оттенок злонамеренного плана.
