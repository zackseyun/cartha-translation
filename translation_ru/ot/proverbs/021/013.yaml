  text: אֹטֵ֣ם אָ֭זְנ/וֹ מִ/זַּעֲקַת דָּ֑ל גַּֽם ה֥וּא יִ֝קְרָ֗א וְ/לֹ֣א יֵעָנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/013.yaml
  text: Whoever shuts his ear to the cry of the poor will also call out and not be answered[a].
translation:
  language: ru
  text: Кто затыкает ухо, чтобы не слышать крика бедняка[a], тот и сам будет звать — и не получит ответа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слабого»; или: «нуждающегося». Еврейское слово דָּל может обозначать бедного, слабого или социально уязвимого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹטֵם
  choice: затыкает
  rationale: 'Причастие породы qal обозначает намеренное действие: человек закрывает слух для чужого призыва. «Затыкает ухо» сохраняет конкретный образ и выражает сознательный отказ слышать.'
- source_word: אָזְנוֹ
  choice: ухо
  rationale: В еврейском тексте стоит единственное число с суффиксом 3-го лица мужского рода; русское единственное число естественно сохраняет этот образ.
- source_word: מִזַּעֲקַת
  choice: чтобы не слышать крика
  rationale: Предлог מִ при сочетании с אטם אזן указывает на то, от чего человек закрывает ухо. В русском цель и смысл отказа естественно передаются оборотом «чтобы не слышать», без изменения причинно-нравственной связи.
- source_word: דָּל
  choice: бедняка
  rationale: דָּל может обозначать бедного, слабого или нуждающегося, то есть социально уязвимого человека. «Бедняк» ясно передаёт основное значение, а более широкий смысл отмечен в сноске.
- source_word: גַּם הוּא
  choice: тот и сам
  rationale: 'Оборот сохраняет усиленную взаимность: отказавшийся услышать чужой крик сам окажется зовущим.'
- source_word: יִקְרָא
  choice: будет звать
  rationale: Глагол означает «звать, взывать». «Будет звать» естественно по-русски и не уточняет, к кому именно обращён зов.
- source_word: וְלֹא יֵעָנֶה
  choice: и не получит ответа
  rationale: Нифаль передаёт пассивное значение «не будет отвечен». Русский оборот «не получит ответа» идиоматичен, сохраняет смысл и не называет того, кто не ответит.
theological_decisions:
- issue: К кому обращён оставшийся без ответа зов
  choice: Не указывать адресата в основном тексте.
  alternative: Назвать Бога или других людей теми, кто не отвечает.
  rationale: Еврейский текст не называет действующее лицо. Контекст может подразумевать воздаяние Божьей справедливости, однако перевод не должен устранять оставленную источником неоднозначность.
- issue: Обобщающее мужское единственное число
  choice: 'Передать через мужское единственное число: «кто… тот и сам».'
  alternative: Использовать безличную или явно гендерно-нейтральную конструкцию.
  rationale: Еврейские формы стоят в мужском единственном числе и имеют обобщающий характер; русская конструкция естественно передаёт и грамматическую форму, и универсальность высказывания.
translation_notes:
  register: Современный литературный русский язык с краткой афористической формой. Тире подчёркивает ответное воздаяние, а формулировка не уточняет не названного в оригинале отвечающего.
