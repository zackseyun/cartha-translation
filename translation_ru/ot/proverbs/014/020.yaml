source:
  edition: WLC
  text: גַּם לְ֭/רֵעֵ/הוּ יִשָּׂ֣נֵא רָ֑שׁ וְ/אֹהֲבֵ֖י עָשִׁ֣יר רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/020.yaml
  text: A poor person is hated even by his neighbor[a], but those who love the rich are many.
translation:
  language: ru
  text: Бедняка ненавидит даже его ближний[a], а любящих богача — много.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «даже его друг»; еврейское слово может означать ближнего, товарища или друга.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: даже
  rationale: 'Частица усиливает горькую мысль: бедняк встречает неприязнь даже со стороны близкого ему человека.'
- source_word: לְרֵעֵהוּ
  choice: его ближний
  rationale: Предлог при пассивном глаголе обозначает действующее лицо. «Ближний» передаёт широкое значение слова, тогда как «друг» остаётся возможным вариантом.
- source_word: יִשָּׂנֵא
  choice: ненавидит (в конструкции «бедняка ненавидит…»)
  rationale: 'Еврейская форма пассивна: бедняк является объектом ненависти. Русский порядок слов сохраняет этот смысл и одновременно звучит естественнее, чем формальное «бедняк ненавидим».'
- source_word: רָשׁ
  choice: бедняка
  rationale: Существительное обозначает неимущего человека; единственное число сохраняет форму и обобщающий характер притчи.
- source_word: וְאֹהֲבֵי
  choice: а любящих
  rationale: Причастие передано отглагольно, чтобы сохранить прямое противопоставление между ненавистью к бедняку и любовью к богачу.
- source_word: עָשִׁיר
  choice: богача
  rationale: Единственное число соответствует еврейскому тексту и естественно выражает обобщённый образ состоятельного человека.
- source_word: רַבִּים
  choice: много
  rationale: Краткая безличная конструкция естественна для русского афористического стиля и точно передаёт многочисленность.
theological_decisions: []
