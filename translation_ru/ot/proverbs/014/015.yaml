id: PRO.14.15
reference: Proverbs 14:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: פֶּ֭תִי יַאֲמִ֣ין לְ/כָל דָּבָ֑ר וְ֝/עָר֗וּם יָבִ֥ין לַ/אֲשֻׁרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/015.yaml
  text: A simple man believes every word[a], but a prudent man considers his steps.
translation:
  language: ru
  text: Простодушный верит всякому слову[a], а благоразумный обдумывает свои шаги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верит всему»; возможно также: «верит всякому делу».'
    reason: Еврейское דָּבָר может означать «слово», «дело», «обстоятельство» или «нечто» вообще.
lexical_decisions:
- source_word: פֶּתִי
  choice: простодушный
  rationale: В Притчах это неопытный и легко поддающийся влиянию человек, а не просто человек с низкими умственными способностями. «Простодушный» естественно передаёт уязвимую доверчивость и сохраняет традиционную категорию литературы мудрости.
- source_word: יַאֲמִין
  choice: верит
  rationale: Форма породы хифиль от אמן здесь означает принимать нечто за истинное или заслуживающее доверия. Русское «верит» прямо и естественно выражает этот смысл.
- source_word: לְכָל דָּבָר
  choice: всякому слову
  rationale: דָּבָר может означать «слово», «дело» или более широко «нечто». В основном тексте сохранён конкретный образ без разбора принимать всякое услышанное утверждение; более широкое значение отмечено в сноске.
- source_word: עָרוּם
  choice: благоразумный
  rationale: В данном контексте Притчей עָרוּם имеет положительный смысл практической рассудительности, а не отрицательный смысл хитрости. «Благоразумный» ясно создаёт похвальный контраст с простодушным.
- source_word: יָבִין
  choice: обдумывает
  rationale: בין обозначает понимание и различение. В сочетании с образом шагов речь идёт о внимательном практическом размышлении, что естественно передаёт глагол «обдумывает».
- source_word: לַאֲשֻׁרוֹ
  choice: свои шаги
  rationale: Существительное обозначает шаг или ход движения и метафорически — образ действий, жизненный путь. Множественное «шаги» сохраняет еврейский образ и звучит естественно по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены параллелизм, контраст и конкретный образ шагов; формулировка понятна без специальной богословской терминологии.
