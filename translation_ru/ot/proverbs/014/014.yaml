  text: מִ/דְּרָכָ֣י/ו יִ֭שְׂבַּע ס֣וּג לֵ֑ב וּ֝/מֵ/עָלָ֗י/ו אִ֣ישׁ טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/014.yaml
  text: The one who turns away in heart will be filled with his own ways[b][a], and a good man with what comes from himself.
translation:
  language: ru
  text: Тот, кто внутренне отступил, насытится плодами своих путей[a], а добрый человек — тем, что исходит от него самого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «насытится от своих путей»; то есть получит вдоволь того, к чему ведёт его образ жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение во второй строке трудно и эллиптично; буквально его можно передать как «а добрый человек — от него самого». Вероятный смысл: добрый человек получает удовлетворение от того, что проистекает из его поведения или характера.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִדְּרָכָיו
  choice: плодами своих путей
  rationale: 'Предлог מִן указывает на источник насыщения: человек пожинает то, что производит его образ жизни. Слово «плодами» делает этот смысл естественным по-русски, хотя оно подразумевается, а не выражено в еврейском тексте прямо.'
- source_word: יִשְׂבַּע
  choice: насытится
  rationale: Глагол означает «насытиться, получить вдоволь»; выбор сохраняет конкретный образ и допускает как благоприятный, так и неблагоприятный результат.
- source_word: סוּג לֵב
  choice: кто сердцем отступает
  rationale: סוּג обозначает отступление или уклонение назад, а לֵב указывает на внутреннюю нравственную направленность. Формулировка прозрачна и не привносит специальной конфессиональной терминологии.
- source_word: וּמֵעָלָיו
  choice: а добрый человек — тем, что исходит от него самого
  rationale: Трудное эллиптическое выражение буквально связано с «от/над ним». В параллели с первой строкой оно, вероятнее всего, указывает на то, что исходит от самого доброго человека — из его поведения или характера; перевод сохраняет эту вероятную мысль, а примечание отмечает неясность.
- source_word: אִישׁ טוֹב
  choice: добрый человек
  rationale: Передаёт мужскую форму как обобщённое обозначение человека и естественно звучит в современном русском литературном языке.
theological_decisions:
- issue: Нравственное воздаяние как следствие собственного пути
  choice: Сохранён образ насыщения тем, что производят собственные пути и внутренний характер человека.
  alternative: Истолковать стих как прямое указание исключительно на Божье воздаяние.
  rationale: Текст подчёркивает связь результата с самим человеком и его путями, но не уточняет механизм воздаяния; перевод не должен разрешать эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. «Сердцем отступает» сохраняет внутреннюю нравственную направленность оригинала; «насытится» удерживает единый образ обеих строк. Добавленное для ясности слово «плодами» раскрыто в примечании как смысловая экспликация.
