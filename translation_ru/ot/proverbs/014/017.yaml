  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
translation:
  language: ru
  text: Вспыльчивый совершает глупость, а человек коварных замыслов ненавистен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «человек замыслов»; еврейское слово может означать как замыслы или планы вообще, так и злые, коварные замыслы.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  choice: вспыльчивый
  rationale: Еврейская идиома буквально означает «короткий гневом» и описывает того, кто быстро приходит в ярость. «Вспыльчивый» естественно и точно передаёт этот смысл в современном русском языке.
- source_word: יַעֲשֶׂה אִוֶּלֶת
  choice: совершает глупость
  rationale: Сочетание обычного глагола «делать, совершать» с существительным «глупость, безрассудство» передано близко к форме оригинала и ясно выражает неразумный поступок.
- source_word: אִישׁ מְזִמּוֹת
  choice: человек коварных замыслов
  rationale: Существительное מְזִמּוֹת может обозначать замыслы или планы, но в данном контексте, особенно рядом с утверждением «ненавистен», вероятен отрицательный оттенок. Слово «коварных» делает этот вероятный оттенок понятным, а сноска сохраняет более широкую лексическую возможность.
- source_word: יִשָּׂנֵא
  choice: ненавистен
  rationale: Нифаль передаёт пассивное значение «его ненавидят». Краткая форма «ненавистен» естественна для русского афористического стиля и сохраняет обобщённое настоящее время притчи.
