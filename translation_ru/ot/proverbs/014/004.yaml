base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/004.yaml
  text: Where there are no oxen[a], the manger is clean[b], but abundant crops come by the strength of an ox.
translation:
  language: ru
  text: Где нет волов, кормовое корыто[a] чисто[b], но силой вола получают обильный урожай[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ясли» или «корыто для корма».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусто».'
