  text: רְֽצוֹן מֶ֭לֶךְ לְ/עֶ֣בֶד מַשְׂכִּ֑יל וְ֝/עֶבְרָת֗/וֹ תִּהְיֶ֥ה מֵבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/035.yaml
  text: A king’s favor is toward a servant who acts wisely[b][a], but his wrath is against one who brings shame.
translation:
  language: ru
  text: Царь благоволит слуге, поступающему мудро[a], но гневается на того, кто навлекает позор[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоразумному слуге»; или: «умелому слуге».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а его гнев будет тому, кто навлекает позор»; отношение гнева к этому человеку подразумевается.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: благоволение
  rationale: Передаёт благосклонное расположение царя и сохраняет возвышенный, но понятный регистр книги Притчей.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Прямой и естественный русский эквивалент обозначения монарха.
- source_word: לְעֶבֶד
  choice: к рабу
  rationale: Предлог ל обозначает направленность благоволения; עֶבֶד прямо означает раба или слугу. «Раб» сохраняет социальный статус, не исключая придворной службы.
- source_word: מַשְׂכִּיל
  choice: поступающему мудро
  rationale: Причастие породы хифиль от שׂכל обозначает разумное, благоразумное и умелое действие; формулировка сохраняет его деятельный смысл.
- source_word: וְעֶבְרָתוֹ
  choice: а его гнев
  rationale: עֶבְרָה обозначает сильный гнев. Союз передан как «а», ясно выражающее противопоставление без излишнего усиления.
- source_word: תִּהְיֶה
  choice: — против
  rationale: Связка «будет» в русском афористическом высказывании естественно опускается; отношение, подразумеваемое еврейским текстом, выражено словом «против».
- source_word: מֵבִישׁ
  choice: того, кто навлекает позор
  rationale: 'Причастие хифиль от בוש имеет каузативный смысл: тот, кто причиняет стыд или позор. «Навлекает позор» естественно передаёт этот смысл, оставляя открытым, кого именно он позорит.'
