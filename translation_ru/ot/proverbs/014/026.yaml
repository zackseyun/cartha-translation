  text: בְּ/יִרְאַ֣ת יְ֭הוָה מִבְטַח עֹ֑ז וּ֝/לְ/בָנָ֗י/ו יִהְיֶ֥ה מַחְסֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/026.yaml
  text: In the fear of Yahweh there is strong confidence[a], and for his children there will be a refuge.
translation:
  language: ru
  text: В страхе перед Яхве — твёрдая уверенность, и для детей того, кто боится Его,[a] будет убежище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, что менее вероятно: «и для Его детей будет убежище», если «Его» относится к Яхве, а не к тому, кто боится Его.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיִרְאַת
  choice: В страхе перед
  rationale: Предлог ב с существительным יִרְאָה выражает сферу жизни в благоговейном страхе; по-русски естественно «в страхе перед», без сведения смысла лишь к средству.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: מִבְטַח עֹז
  choice: крепкая уверенность
  rationale: מִבְטַח обозначает уверенность или безопасность, а עֹז усиливает это значение; сочетание передано естественной русской конструкцией.
- source_word: וּלְבָנָיו
  choice: и для детей боящегося Его
  rationale: ל сохранено как «для», а בָּנִים передано родовым «дети». Уточнение «боящегося Его» делает основной референт местоименного суффикса понятным по-русски, не смешивая его с ближайшим упоминанием Яхве; возможный иной референт сохранён в сноске.
- source_word: יִהְיֶה
  choice: будет
  rationale: Глагол бытия естественно связывает получателей с последующим образом убежища.
- source_word: מַחְסֶה
  choice: убежище
  rationale: Сохраняет защитный образ еврейского слова и звучит ясно и достойно в современном русском языке.
theological_decisions:
- issue: Референт местоименного суффикса в בָנָיו («его дети»)
  choice: В основном тексте суффикс отнесён к человеку, боящемуся Яхве.
  alternative: 'Суффикс можно отнести к Яхве: «для Его детей будет убежище».'
  rationale: Ход пословицы естественно связывает крепкую уверенность богобоязненного человека с защитой его детей. Однако грамматически возможный иной референт не устранён, а отмечен в сноске.
translation_notes:
  register: Современный литературный русский, сжатый афористический строй. Тире передаёт безглагольную первую еврейскую клаузу. Формулировка избегает неясного русского «его дети», при этом сохраняет исходную неоднозначность в сноске.
