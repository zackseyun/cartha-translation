source:
  edition: WLC
  text: עֵ֣ד אֱ֭מוּנִים לֹ֣א יְכַזֵּ֑ב וְ/יָפִ֥יחַ כְּ֝זָבִ֗ים עֵ֣ד שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/005.yaml
  text: A faithful witness does not lie[a], but a false witness breathes out lies.
translation:
  language: ru
  text: Верный свидетель не лжёт, а ложный свидетель выдыхает ложь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изрекает неправду». Еврейский глагол изображает ложные показания как нечто выдыхаемое или изливаемое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: свидетель
  rationale: Естественный русский юридический и нравственный термин для того, кто даёт свидетельство; сохраняется в обеих частях стиха.
- source_word: אֱמוּנִים
  choice: верный
  rationale: Передаёт надёжность и нравственную верность свидетеля; кратко и естественно сочетается со словом «свидетель».
- source_word: לֹא יְכַזֵּב
  choice: не лжёт
  rationale: В контексте свидетельства форма глагола указывает на ложную речь; это наиболее ясная и естественная передача.
- source_word: וְיָפִיחַ
  choice: а ... выдыхает
  rationale: Союз передан противительным «а» по смысловому контрасту между частями. «Выдыхает» сохраняет яркий образ исходящей из уст речи.
- source_word: כְּזָבִים
  choice: ложь
  rationale: Русское собирательное существительное естественно звучит с «выдыхает» и передаёт повторяющиеся ложные утверждения, выраженные еврейским множественным числом.
- source_word: עֵד שָׁקֶר
  choice: ложный свидетель
  rationale: Устойчивое библейское и юридическое выражение для свидетеля, дающего ложные показания.
theological_decisions: []
