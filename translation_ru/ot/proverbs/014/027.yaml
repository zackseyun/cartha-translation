  text: יִרְאַ֣ת יְ֭הוָה מְק֣וֹר חַיִּ֑ים לָ֝/ס֗וּר מִ/מֹּ֥קְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/027.yaml
  text: The fear of Yahweh is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: ru
  text: Страх перед Яхве — источник жизни[a], уводящий от ловушек смерти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родник жизни».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы уклоняться от ловушек смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: страх перед
  rationale: Сохраняет ключевое для литературы мудрости понятие страха перед Богом, включающее благоговение, трепет и послушание, не сводя его лишь к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מְקוֹר
  choice: источник
  rationale: Естественно и образно передаёт родник или ключ как место, откуда исходит животворная вода.
- source_word: חַיִּים
  choice: жизни
  rationale: Формально множественное еврейское существительное здесь обозначает жизнь как единое понятие.
- source_word: לָסוּר
  choice: он уводит
  rationale: Передаёт целевое или результативное значение инфинитива естественной русской конструкцией; местоимение соотносится со «страхом перед Яхве».
- source_word: מִמֹּקְשֵׁי
  choice: от ловушек
  rationale: Сохраняет образ скрытых западней, несущих гибель.
- source_word: מָוֶת
  choice: смерти
  rationale: Буквально сохраняет широту образа, который может охватывать как физическую смерть, так и гибель в более широком смысле.
theological_decisions:
- issue: Значение выражения «страх Яхве» в литературе мудрости
  choice: «страх перед Яхве»
  alternative: «благоговение перед Яхве»
  rationale: Слово «страх» сохраняет богословское напряжение исходного выражения и не сужает его до одного лишь почтения.
- issue: Смысл инфинитива לָסוּר
  choice: 'Результативное прочтение: «он уводит от ловушек смерти»'
  alternative: 'Целевое прочтение: «чтобы уклоняться от ловушек смерти»'
  rationale: Еврейская конструкция допускает оттенки цели и результата. Основной текст передаёт действие страха перед Яхве естественно по-русски, а примечание сохраняет более формальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Двоеточие ясно связывает вторую часть с первой, не перегружая стих пояснениями; образ источника и ловушек сохранён.
