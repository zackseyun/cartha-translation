  source_fidelity: 'Текст точно передаёт два колона еврейского стиха: конструкция חַכְמוֹת נָשִׁים обоснованно отражена как «Мудрейшая из женщин» с сохранением возможного родового прочтения в сноске; глаголы переданы настоящим временем, уместным для пословичного обобщения. «Строит» и «разрушает» сохраняют образный и лексический контраст בנה / הרס. «Свой дом» верно передаёт בֵּיתָהּ, а «своими руками» — инструментальное בְּיָדֶיהָ. Местоимение «его» однозначно и правильно отсылает к дому.'
