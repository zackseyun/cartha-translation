source:
  edition: WLC
  text: חַכְמ֣וֹת נָ֭שִׁים בָּנְתָ֣ה בֵיתָ֑/הּ וְ֝/אִוֶּ֗לֶת בְּ/יָדֶ֥י/הָ תֶהֶרְסֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/001.yaml
  text: The wisest of women builds her house[b][a], but a foolish woman tears it down with her own hands.
translation:
  language: ru
  text: Мудрейшая из женщин[a] строит свой дом[b], а глупая женщина своими руками разрушает его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Каждая мудрая женщина». Начальные еврейские слова можно понимать как общее утверждение обо всех мудрых женщинах, а не как превосходную степень.'
    reason: lexical_alternative
  - marker: b
    text: Слово «дом» может означать не только жилище, но также семью, домашних или весь домашний уклад.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  choice: мудрейшая из женщин
  rationale: Передаёт вероятный идиоматический превосходный смысл сочетания и согласуется с глаголом в единственном числе. Возможное родовое понимание сохранено в сноске.
- source_word: בָּנְתָה
  choice: строит
  rationale: Хотя форма морфологически перфектная, в пословице она выражает общую, постоянно верную закономерность; русское настоящее время естественно передаёт этот смысл.
- source_word: בֵיתָהּ
  choice: свой дом
  rationale: Сохраняет конкретный образ строительства и одновременно допускает более широкий смысл дома как семьи или домашнего уклада.
- source_word: אִוֶּלֶת
  choice: глупая женщина
  rationale: Личное обозначение естественно противопоставлено мудрой женщине в первой части и соответствует женскому роду сказуемого; абстрактное «глупость» здесь было бы менее естественно из-за упоминания рук.
- source_word: בְּיָדֶיהָ
  choice: своими руками
  rationale: Передаёт орудийное значение и подчёркивает личную ответственность женщины без неуместного усиления.
- source_word: תֶהֶרְסֶנּוּ
  choice: разрушает его
  rationale: Глагол означает разрушать или сносить; выбор сохраняет прямой контраст со «строит», а местоимение явно отсылает к дому.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма пословицы. Конкретная метафора строительства и разрушения сохранена, а неоднозначность слова «дом» и начальной конструкции отражена в сносках.
