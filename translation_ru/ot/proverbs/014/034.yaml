  yaml_path: translation/ot/proverbs/014/034.yaml
  text: Righteousness exalts a nation[a], but sin is a disgrace to peoples.
translation:
  language: ru
  text: Праведность возвышает народ, а грех — позор для народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст второй строки труден. Здесь он передан в традиционном смысле: грех навлекает на народы позор. Слово, переведённое как «позор», обычно означает «милость», «верность» или «преданность», но может иметь редкое значение «бесчестье»; поэтому предлагались и другие толкования всей строки.'
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: праведность
  rationale: Слово обозначает нравственную и общественную правоту, справедливое поведение. «Праведность» сохраняет широту значения и естественно звучит в контексте литературы мудрости.
- source_word: תְרוֹמֵם
  choice: возвышает
  rationale: Форма от רום передаёт поднятие ввысь и, переносно, обретение чести и высокого положения; «возвышает» сохраняет оба оттенка.
- source_word: גּוֹי
  choice: народ
  rationale: Здесь речь идёт о народе как общественно-политическом целом, без специального значения «языческий народ».
- source_word: חֶסֶד
  choice: позор
  rationale: Хотя обычно חֶסֶד означает милость, верность или преданность, в данном трудном контексте слово понимается в редком отрицательном смысле «позор, бесчестье», как и в Лев 20:17. В именной конструкции оно передаёт то, чем грех становится для народов.
- source_word: לְאֻמִּים
  choice: для народов
  rationale: Множественное число сохранено, а предлог לְ передан естественной русской конструкцией «для народов».
- source_word: חַטָּאת
  choice: грех
  rationale: 'Основное значение существительного — «грех»; в конце еврейской именной конструкции оно может выступать подлежащим: грех является позором для народов.'
theological_decisions:
- issue: Толкование второй строки וְחֶסֶד לְאֻמִּים חַטָּאת
  choice: «а грех — позор для народов»
  alternative: Буквально при обычном значении חֶסֶד возможно понять слова как «а милость/верность народам — грех»; предлагались также перестановка синтаксических ролей и иные толкования חֶסֶד.
  rationale: Антитетический параллелизм требует отрицательного соответствия первой строке. Редкое значение חֶסֶד «позор, бесчестье» засвидетельствовано в древнееврейском и позволяет сохранить масоретский текст без исправления. Поскольку место действительно неоднозначно, альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая именная конструкция с тире сохраняет афористичность и антитезу оригинала. «Народ» и «народы» передают намеренную смену числа в параллельных строках.
