  text: לֵ֗ב י֭וֹדֵעַ מָרַּ֣ת נַפְשׁ֑/וֹ וּ֝/בְ/שִׂמְחָת֗/וֹ לֹא יִתְעָ֥רַב זָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/010.yaml
  text: The heart knows the bitterness of its soul[b][a], and no stranger shares in its joy.
translation:
  language: ru
  text: Сердце знает горечь своей души[a], и радости его не разделит посторонний[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «горечь своей души». Здесь «душа» означает внутреннее «я» или жизнь человека и не обязательно является специальным утверждением о составе человеческой природы.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «и к радости его не примешается посторонний» или «не примет участия в его радости». Еврейский глагол может означать вовлечение во что-либо или участие в нём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет еврейский образ внутреннего центра мысли и чувства и естественно звучит в русском тексте Притч.
- source_word: יֹדֵעַ
  choice: знает
  rationale: Передаёт непосредственное, личное знание собственного внутреннего переживания без добавочного толкования.
- source_word: מָרַת
  choice: горечь
  rationale: Сохраняет метафору исходного текста; более конкретные варианты «скорбь» или «печаль» сужали бы значение.
- source_word: נַפְשׁוֹ
  choice: своей души
  rationale: Форма возвратного местоимения ясно связывает душу с сердцем — грамматическим субъектом; «душа» сохраняет образ оригинала, не требуя здесь специального учения о составе человека.
- source_word: וּבְשִׂמְחָתוֹ
  choice: и радости его
  rationale: «Радость» естественно передаёт שִׂמְחָה, а значение предлога ב выражено русской конструкцией «разделить радость».
- source_word: יִתְעָרַב
  choice: не разделит
  rationale: В данном контексте глагол обозначает участие или вовлечённость; такой перевод ясно передаёт невозможность постороннему вполне участвовать во внутренней радости другого.
- source_word: זָר
  choice: посторонний
  rationale: Речь не обязательно об иноземце, а о том, кто остаётся вне личного внутреннего опыта; «посторонний» точно и естественно выражает этот смысл.
