  text: בָּז לְ/רֵעֵ֥/הוּ חוֹטֵ֑א וּ/מְחוֹנֵ֖ן עניים אַשְׁרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/021.yaml
  text: Whoever despises his neighbor sins[a], but blessed is he who is gracious to the poor.
translation:
  language: ru
  text: Кто презирает ближнего, тот грешит, а кто милостив к бедным — блажен[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «счастлив». Еврейское слово означает состояние благополучия и благословенности, а не просто чувство радости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: презирает
  rationale: Причастие обозначает отношение или обращение с презрением; настоящее время естественно передаёт обобщённую характеристику человека.
- source_word: לְרֵעֵהוּ
  choice: ближнего
  rationale: רֵעַ обозначает другого человека из социального окружения; «ближний» естественно и узнаваемо в нравоучительном библейском контексте.
- source_word: חוֹטֵא
  choice: грешит
  rationale: Предикативное причастие прямо называет поступок грехом; перевод не ослабляет нравственно-богословскую оценку до общего «поступает плохо».
- source_word: וּמְחוֹנֵן
  choice: милостив к
  rationale: Форма от חנן означает проявлять благосклонность, милость и практическое великодушие. Русское «милостив к» сохраняет этот оттенок лучше, чем более узкое «жалеет».
- source_word: עניים
  choice: бедным
  rationale: В данном этическом противопоставлении слово прежде всего указывает на материально и социально уязвимых людей; множественное число сохранено.
- source_word: אַשְׁרָיו
  choice: блажен
  rationale: Формула мудрости выражает объективное состояние благополучия и благословенности, а не только субъективную радость. Мужской род соответствует форме еврейского текста и имеет обобщающее значение.
theological_decisions:
- issue: Передача формулы мудрости אַשְׁרָיו
  choice: блажен
  alternative: счастлив
  rationale: «Блажен» сохраняет смысл благословенного, благополучного состояния и традиционный высокий регистр, не сводя выражение к эмоции.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой, соответствующей жанру притчи. Параллелизм и нравственно-богословская прямота оригинала сохранены.
