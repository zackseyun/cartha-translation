  source_fidelity: 'Перевод точно передаёт оба члена еврейского параллелизма: בָּז לְרֵעֵהוּ — «кто презирает ближнего», חוֹטֵא — «грешит», וּמְחוֹנֵן עֲנָוִים/עֲנִיִּים — «кто милостив к бедным», אַשְׁרָיו — «блажен». Обобщающее «кто… тот» естественно выражает субъектные причастия оригинала. «Ближний» уместно передаёт רֵעֵהוּ без неоправданного сужения значения. «Милостив к» адекватно передаёт חנן как благосклонное, благодетельное отношение и не сводит его к одному лишь чувству жалости.'
