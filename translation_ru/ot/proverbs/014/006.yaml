source:
  edition: WLC
  text: בִּקֶּשׁ לֵ֣ץ חָכְמָ֣ה וָ/אָ֑יִן וְ/דַ֖עַת לְ/נָב֣וֹן נָקָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/006.yaml
  text: A scoffer seeks wisdom and there is none[b][a], but knowledge comes easily to one who has understanding.
translation:
  language: ru
  text: Насмешник ищет мудрости — и нет её[a], а разумному[b] знание даётся легко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и нет». Возможный перевод: «но он её не находит».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово стоит в мужском роде и единственном числе, но в этой притче обобщённо обозначает человека, обладающего разумением.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקֶּשׁ
  choice: ищет
  rationale: Форма qatal в афористическом контексте выражает общую закономерность; настоящее время естественно для русской пословичной речи.
- source_word: לֵץ
  choice: насмешник
  rationale: Слово обозначает человека, который надменно глумится и отвергает мудрость и наставление; «насмешник» понятно современному читателю и сохраняет нравственную окраску.
- source_word: חָכְמָה
  choice: мудрости
  rationale: Обычное соответствие в книге Притч; речь идёт о жизненной и нравственной мудрости, а не только об уме.
- source_word: וָאָיִן
  choice: и нет её
  rationale: Сохранена экзистенциальная конструкция еврейского текста «и нет»; местоимение «её» добавлено ради ясности русского синтаксиса и относится к мудрости.
- source_word: וְדַעַת
  choice: знание
  rationale: Передаёт דַּעַת как усвоенное знание и понимание, сохраняя его отличие от «мудрости» в первой строке.
- source_word: לְנָבוֹן
  choice: разумному
  rationale: Субстантивированное прилагательное естественно передаёт человека, обладающего разумением и проницательностью, сохраняя грамматически мужскую форму оригинала.
- source_word: נָקָל
  choice: даётся легко
  rationale: Естественная русская конструкция передаёт значение лёгкости и доступности знания для разумного, а также подчёркивает контраст с бесплодными поисками насмешника.
theological_decisions:
- issue: Обобщающее мужское единственное число в литературе мудрости
  choice: разумному
  alternative: проницательному человеку; тому, кто обладает разумением
  rationale: Еврейская форма имеет мужской род и единственное число, но употреблена как обобщающая характеристика. Русское «разумному» сохраняет форму источника, не ограничивая смысл только мужчинами.
- issue: Причина безуспешного поиска насмешника
  choice: и нет её
  alternative: но он её не находит
  rationale: Основной текст не уточняет, почему мудрость недоступна насмешнику, и сохраняет краткую экзистенциальную формулировку оригинала вместо более истолковывающего «не находит».
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным ритмом. Тире передаёт резкий итог первой части; лексика понятна широкому кругу читателей и сохраняет достоинство речи мудрости.
