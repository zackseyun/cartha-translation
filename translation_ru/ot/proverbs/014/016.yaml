  terminology: «Мудрый», «зло» и «глупец» соответствуют устойчивому словарю русской передачи литературы мудрости, не навязывая богословского истолкования. «Самоуверен» оправдано отрицательным контекстом и естественно сочетается с «не знает удержу».
