  text: A wise man fears and turns away from evil[a], but a fool is reckless and confident.
translation:
  language: ru
  text: Мудрый боится и удаляется от зла, а глупец не знает удержу[a] и самоуверен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «впадает в ярость»; возможно также: «переходит границы». Значение еврейского глагола здесь не вполне ясно; вероятно, речь идёт о необузданном, опрометчивом поведении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: мудрый
  rationale: Субстантивированное прилагательное в мужском роде; в пословице обозначает типичного мудрого человека.
- source_word: יָרֵא
  choice: боится
  rationale: Сохраняет прямое значение глагола и передаёт разумную боязнь перед злом, не добавляя отсутствующего в тексте объекта благоговения.
- source_word: וְסָר
  choice: и удаляется
  rationale: Естественно передаёт סור — отступать, уклоняться, держаться в стороне — в сочетании со злом.
- source_word: מֵרָע
  choice: от зла
  rationale: Сохраняет нравственный смысл רַע, не исключая сопутствующего значения пагубного и вредного.
- source_word: כְסִיל
  choice: глупец
  rationale: Устойчивое обозначение нравственно и рассудочно неразумного человека в литературе мудрости.
- source_word: מִתְעַבֵּר
  choice: не знает удержу
  rationale: Контекстуально передаёт необузданное переступание границ и опрометчивость; редкая и трудная форма допускает также связь с яростью, что отмечено в сноске.
- source_word: וּבוֹטֵחַ
  choice: и самоуверен
  rationale: בטח означает быть уверенным или чувствовать себя в безопасности; отрицательный контекст указывает на беспечную уверенность без достаточных оснований.
