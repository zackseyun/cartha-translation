  text: Спокойное сердце — жизнь телу[a], а зависть — гниль в костях[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исцеляющее (здоровое) сердце — жизнь для плоти». Еврейское слово, переведённое как «спокойное», буквально связано с исцелением и здоровьем.'
    reason: lexical_alternative
  - marker: b
