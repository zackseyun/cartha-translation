lexical_decisions:
- source_word: חַיֵּי
  choice: жизнь
  rationale: Форма сопряжённого состояния от חַיִּים употреблена идиоматически; в безглагольной фразе естественно передаётся именной частью сказуемого «жизнь».
- source_word: בְשָׂרִים
  choice: для тела
  rationale: Буквально слово связано с «плотью», но здесь обозначает физическое тело в целом. «Тело» естественно для современного русского и не привносит отсутствующих в контексте богословских ассоциаций слова «плоть».
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет древнееврейский образ внутреннего состояния и эмоционального центра человека и остаётся понятным современному читателю.
- source_word: מַרְפֵּא
  choice: спокойное
  rationale: Существительное означает исцеление, здоровье или целительное средство. В сочетании с «сердцем» контекст допускает понимание здорового, умиротворённого внутреннего состояния; «спокойное» естественно выражает этот смысл, а более буквальный вариант отмечен в сноске.
- source_word: וּרְקַב
  choice: а ... гниль
  rationale: Союз передан как противопоставление между двумя половинами изречения. Конкретный и выразительный образ разложения сохранён словом «гниль».
- source_word: עֲצָמוֹת
  choice: для костей
  rationale: Сохранён буквальный телесный образ, обозначающий глубинную физическую основу и жизненную силу человека.
- source_word: קִנְאָה
  choice: зависть
  rationale: Слово может означать зависть, ревность или рвение. Отрицательный образ разрушения костей и противопоставление спокойному сердцу лучше всего поддерживают значение «зависть»; «ревность» сохранена как возможная альтернатива в сноске.
