lexical_decisions:
- source_word: מַצִּיל
  choice: спасает
  rationale: Причастие породы хифиль от נצל означает избавление или спасение от опасности. «Спасает» естественно по-русски и в данном контексте описывает практический результат правдивого свидетельства.
- source_word: נְפָשׁוֹת
  choice: жизни
  rationale: Множественное число נֶפֶשׁ здесь указывает на человеческие жизни или самих людей, а не специально на нематериальные души; «жизни» хорошо сочетается с глаголом спасения.
- source_word: עֵד אֱמֶת
  choice: правдивый свидетель
  rationale: Сочетание характеризует свидетеля как говорящего правду и заслуживающего доверия. «Правдивый свидетель» ясно и естественно передаёт эту нравственную характеристику.
- source_word: וְיָפִחַ
  choice: а извергающий
  rationale: Глагол פוח создаёт яркий образ выдыхания или исторжения речи. «Извергающий» сохраняет образ настойчивого выпускания лжи и остаётся понятным в современном русском.
- source_word: כְּזָבִים
  choice: ложь
  rationale: Хотя в еврейском стоит множественное число, русское собирательное «ложь» наиболее естественно обозначает лживые высказывания.
- source_word: מִרְמָה
  choice: обман
  rationale: Именное сказуемое передано столь же кратко, без превращения существительного в прилагательное. Это сохраняет напряжённую эллиптичность еврейской строки и допускает характеристику как человека, так и его речи.
theological_decisions:
- issue: Значение נְפָשׁוֹת
  choice: жизни
  alternative: души; людей
  rationale: Контекст судебного или общественного свидетельства говорит о сохранении людей от вреда или смерти; перевод «души» мог бы неоправданно сузить значение до нематериальной части человека.
- issue: Синтаксическая связь מִרְמָה
  choice: «извергающий ложь — обман»
  alternative: «извергающий ложь обманывает»; «извергающий ложь — обманщик»
  rationale: Еврейский текст заканчивается существительным «обман» и допускает понимание его как именного сказуемого либо обстоятельственной характеристики речи. Краткая именная конструкция сохраняет эту неоднозначность и не добавляет отсутствующее в тексте слово «обманщик».
translation_notes:
  register: Современный литературный русский с лаконичным, афористичным строем. Сохранены параллелизм и яркий образ исторжения лжи; тире передаёт эллиптическое именное сказуемое оригинала.
