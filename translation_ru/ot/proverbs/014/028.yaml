  yaml_path: translation/ot/proverbs/014/028.yaml
  text: In a multitude of people is a king’s splendor[a], but without people, a ruler’s ruin.
translation:
  language: ru
  text: 'При многочисленном народе — величие царя,

    а при отсутствии народа — гибель правителя.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ужас» или «смятение» вместо «гибель»; еврейское слово может обозначать как страх, так и гибельное падение. В основном тексте избрано слово «гибель», поскольку в этом изречении оно ясно противопоставлено величию царя, связанному с многочисленным народом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב עָם
  choice: Во множестве народа
  rationale: Предлог ב с רָב передаёт обстоятельство многочисленности; сочетание сохраняет краткость и параллелизм еврейской строки. «Народ» передаёт עָם без сужения до подданных.
- source_word: הַדְרַת מֶלֶךְ
  choice: великолепие царя
  rationale: הֲדָרָה обозначает великолепие, величие или почёт; «великолепие» естественно выражает зримое царское величие, создаваемое многочисленным народом. Конструкция передана родительным падежом.
- source_word: וּבְאֶפֶס לְאֹם
  choice: а при отсутствии народа
  rationale: אֶפֶס здесь означает отсутствие или нехватку. לְאֹם — народ, людское сообщество; повтор «народа» яснее раскрывает прямой контраст и не привносит современного понятия государства-нации.
- source_word: מְחִתַּת
  choice: крах
  rationale: Слово допускает значения ужаса, смятения и гибельного падения. В противопоставлении царскому великолепию «крах» кратко и естественно передаёт разрушительный исход, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: רָזוֹן
  choice: правителя
  rationale: Редкое слово обозначает властителя, князя или правителя. «Правитель» сохраняет широкий смысл и не навязывает строгого различия с царём из первой половины стиха.
