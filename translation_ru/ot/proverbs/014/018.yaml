  text: The simple inherit folly[a], but the prudent are crowned with knowledge.
translation:
  language: ru
  text: Неопытные наследуют глупость, а благоразумные увенчаны знанием[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «а благоразумные увенчивают себя знанием». Еврейский глагол допускает активное понимание («увенчивают») и описание состояния — быть украшенными или увенчанными знанием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחֲלוּ
  choice: наследуют
  rationale: Глагол נחל обозначает получение наследства или владения. «Наследуют» сохраняет образ глупости как удела, который в итоге получают неопытные; настоящее время естественно передаёт общее наблюдение пословицы.
- source_word: פְתָאיִם
  choice: неопытные
  rationale: В Притчах פתי — человек неискушённый, открытый влиянию и потому легко сбиваемый с пути. «Неопытные» передаёт эту категорию без положительного оттенка слова «простодушные» и без сужения смысла до одной лишь легковерности.
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Это один из основных терминов литературы мудрости для нравственной и практической неразумности. «Глупость» ясно и естественно передаёт его в современном русском языке.
- source_word: עֲרוּמִים
  choice: благоразумные
  rationale: В данном противопоставлении слово имеет положительный смысл осмотрительности, рассудительности и умения различать. «Благоразумные» сохраняет нравственно-практический оттенок и не придаёт слову отрицательной окраски хитрости.
- source_word: יַכְתִּרוּ
  choice: увенчиваются
  rationale: Форма от כתר может выражать окружение или увенчание. Возвратно-пассивная конструкция естественно описывает благоразумных как увенчанных знанием, не устраняя возможного активного понимания глагола.
- source_word: דָעַת
  choice: знанием
  rationale: דעת — центральное для Притч понятие знания, связанного с распознаванием и мудрым суждением. Прямое соответствие «знание» сохраняет терминологическую ясность.
