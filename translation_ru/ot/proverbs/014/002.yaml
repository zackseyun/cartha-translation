base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/002.yaml
  text: Whoever walks in uprightness fears Yahweh[b][a], but the one whose ways are crooked despises him.
translation:
  language: ru
  text: Кто идёт прямым путём, тот боится Яхве; а тот, чьи пути кривы[a], презирает его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а кто извращён в своих путях»; еврейское слово описывает человека, чьё поведение искривлено или порочно.'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «его», вероятнее всего, относится к Яхве; возможно и более обобщённое понимание.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ בְּיָשְׁרוֹ
  choice: идёт прямым путём
  rationale: Сохраняет еврейский образ хождения как образа жизни и прямоты как нравственной цельности, но звучит естественно по-русски.
- source_word: יְרֵא יְהוָה
  choice: боится Яхве
  rationale: Передаёт устойчивое для литературы мудрости выражение о страхе перед Богом, не ослабляя его до одного лишь почтения; личное имя יהוה передано транслитерацией «Яхве».
- source_word: וּנְלוֹז דְּרָכָיו
  choice: а тот, чьи пути кривы
  rationale: נלוז обозначает искривлённость, извращённость поведения, а множественное דְּרָכָיו — жизненные пути и поступки. Формулировка сохраняет конкретный образ оригинала.
- source_word: בּוֹזֵהוּ
  choice: презирает Его
  rationale: Глагол בזה означает «презирать, относиться с пренебрежением». Мужской местоименный суффикс естественнее всего относится к ближайшему упомянутому Яхве.
theological_decisions:
- issue: К кому относится местоименный суффикс в בּוֹזֵהוּ
  choice: 'К Яхве: «презирает Его»'
  alternative: Суффикс можно понимать более обобщённо либо относить к праведному человеку.
  rationale: Антитеза наиболее естественно противопоставляет страх перед Яхве презрению к Нему. Поскольку грамматика допускает менее вероятные толкования, неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа двух путей. Синтаксис сделан ясным и афористичным; прописная буква в «Его» помогает обозначить выбранный референт, а альтернативное понимание сохранено в сноске.
