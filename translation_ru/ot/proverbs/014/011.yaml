  terminology: «Нечестивые» и «честные» образуют ясное нравственное противопоставление. «Честные» несколько уже, чем «прямые/непорочные», но в данном контексте является допустимым современным соответствием יְשָׁרִים и не вносит богословской интерпретации. «Шатёр» верно сохраняет отличие אֹהֶל от «дома».
