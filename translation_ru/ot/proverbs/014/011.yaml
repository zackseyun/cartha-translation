  source_fidelity: 'Перевод точно передаёт еврейский параллелизм и основные образы: «дом нечестивых» (בֵּית רְשָׁעִים), его грядущее разрушение (יִשָּׁמֵד), а также противопоставленный ему «шатёр честных» (אֹהֶל יְשָׁרִים), который «расцветёт» (יַפְרִיחַ). Будущее значение обеих форм сохранено. «Расцветёт» удачно передаёт как метафору процветания, так и растительную образность глагола פרח.'
