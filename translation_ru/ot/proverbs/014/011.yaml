source:
  edition: WLC
  text: בֵּ֣ית רְ֭שָׁעִים יִשָּׁמֵ֑ד וְ/אֹ֖הֶל יְשָׁרִ֣ים יַפְרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/011.yaml
  text: The house of the wicked will be destroyed[a], but the tent of the upright will flourish.
translation:
  language: ru
  text: 'Дом нечестивых будет разрушен,

    а шатёр честных расцветёт[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даст побеги»; еврейский глагол создаёт образ распускающегося растения и цветения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: дом
  rationale: Сопряжённая форма обозначает «дом нечестивых». Конкретный образ жилища сохранён; вместе с тем слово может подразумевать и весь дом, то есть семью и хозяйство.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное обозначает людей, поступающих зло. «Нечестивых» кратко и естественно передаёт нравственное противопоставление второй строке.
- source_word: יִשָּׁמֵד
  choice: будет разрушен
  rationale: Форма нифаля от שׁמד выражает уничтожение или разорение. В сочетании со словом «дом» перевод «будет разрушен» сохраняет силу предупреждения, не усиливая её до обязательного полного истребления.
- source_word: אֹהֶל
  choice: шатёр
  rationale: 'Сохранён буквальный образ шатра, чтобы не сглаживать намеренный контраст: прочный на вид дом нечестивых гибнет, тогда как скромный шатёр честных процветает.'
- source_word: יְשָׁרִים
  choice: честных
  rationale: Слово обозначает нравственно прямых, порядочных людей. «Честных» понятно современному читателю и сохраняет отличие от обычного еврейского термина, переводимого как «праведные».
- source_word: יַפְרִיחַ
  choice: расцветёт
  rationale: Глагол от פרח вызывает образ распускания, цветения и роста. «Расцветёт» сохраняет растительную метафору и одновременно естественно выражает благополучие.
