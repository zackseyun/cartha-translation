  text: עֲטֶ֣רֶת חֲכָמִ֣ים עָשְׁרָ֑/ם אִוֶּ֖לֶת כְּסִילִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/024.yaml
  text: The crown of the wise is their wealth[a], but the folly of fools is folly.
translation:
  language: ru
  text: 'Венец мудрых — их богатство,

    а глупость глупцов — глупость.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые древние переводы и толкователи передают: «а богатство глупцов — глупость». Масоретский текст буквально гласит: «а глупость глупцов — глупость».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: венец
  rationale: Существительное обозначает венец или корону как знак чести и отличия. «Венец» естественно звучит в русском изречении и сохраняет образ.
- source_word: חֲכָמִים
  choice: мудрые
  rationale: Субстантивированное прилагательное во множественном числе обозначает мудрых людей вообще; «мудрые» передаёт это без ненужного указания на пол.
- source_word: עָשְׁרָם
  choice: их богатство
  rationale: Форма означает «их богатство» или «их богатства». Единственное число «богатство» точно соответствует еврейской форме и естественно по-русски.
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: Слово обозначает глупость как устойчивое нравственное и умственное качество. «Глупость» ясно и уместно для языка Притч.
- source_word: כְּסִילִים
  choice: глупцы
  rationale: В литературе мудрости это люди, отличающиеся нравственной и умственной глухотой. «Глупцы» — краткий и традиционно понятный русский эквивалент.
- source_word: אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  choice: глупость глупцов — глупость
  rationale: Масоретский текст намеренно повторяет אִוֶּלֶת. Формально напряжённая тавтология сохранена как выразительная черта изречения, а не сглажена.
