  yaml_path: translation/ot/proverbs/014/032.yaml
  text: By his evil the wicked is driven away[c][b][a], but the righteous finds refuge in his death.
translation:
  language: ru
  text: 'За своё зло нечестивый бывает повержен[a],

    а праведник находит прибежище в смерти[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В своём бедствии нечестивый бывает повержен». Еврейское слово רָעָה может означать как нравственное зло, так и бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ищет прибежища». Еврейская форма может передавать действие обращения за защитой; основной перевод передаёт его результативно.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в его смерти»; возможно также: «при смерти» или «когда умирает». Перевод «при смерти сохраняет надежду» передаёт возможный смысл, но слово «надежда» в еврейском тексте прямо не выражено.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרָעָתוֹ
  choice: За своё зло
  rationale: 'רָעָה может обозначать как нравственное зло, так и бедствие. Сочетание с предлогом בְּ допускает причинно-инструментальный смысл: нечестивый терпит крушение из-за собственного зла. Контекст противопоставления нечестивого праведнику поддерживает нравственное значение, а значение «бедствие» сохранено в сноске.'
- source_word: יִדָּחֶה
  choice: бывает повержен
  rationale: 'Нифаль передаёт пассивное действие: быть оттеснённым, низвергнутым или поверженным. «Бывает повержен» естественно звучит как обобщение в притче и не уточняет способ падения.'
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное мужского рода единственного числа обозначает типичного представителя; русское «нечестивый» сохраняет и форму, и нравственный контраст.
- source_word: וְחֹסֶה
  choice: находит прибежище
  rationale: Причастие от חסה может выражать поиск или обретение убежища. «Находит прибежище» передаёт защищённость праведника, не добавляя отсутствующего в еврейском тексте прямого упоминания надежды.
- source_word: בְמוֹתוֹ
  choice: и в смерти
  rationale: 'Буквально: «в своей/его смерти». Частица «и» по-русски подчёркивает предельность обстоятельства, не превращая его в отдельное богословское утверждение. Возможные временные передачи «при смерти» и «когда умирает» отмечены в сноске.'
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное обозначает праведного человека как общеизвестный тип; «праведник» — естественный и точный русский эквивалент.
theological_decisions:
- issue: Говорит ли стих о надежде после смерти или лишь о защищённости в момент смерти
  choice: «и в смерти находит прибежище» — формулировка сохраняет неопределённость природы и продолжительности прибежища.
  alternative: «при смерти сохраняет надежду» или «защищён, когда умирает»
  rationale: В еврейском тексте нет существительного «надежда» и не раскрыто, что именно является прибежищем. Поэтому перевод не должен ни исключать посмертный смысл, ни утверждать его более явно, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. «Нечестивый» и «праведник» сохраняют традиционную библейскую лексику, оставаясь понятными. Необычное выражение «в смерти» намеренно удерживает смысловую напряжённость оригинала.
