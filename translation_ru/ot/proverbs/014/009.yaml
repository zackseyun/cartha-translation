  text: אֱ֭וִלִים יָלִ֣יץ אָשָׁ֑ם וּ/בֵ֖ין יְשָׁרִ֣ים רָצֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/009.yaml
  text: Fools mock guilt[b][a], but among the upright there is favor.
translation:
  language: ru
  text: 'Глупцы смеются над виной[a],

    а среди праведных — благоволение[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над жертвой за вину». Еврейское אָשָׁם может означать как вину, так и, в контексте жертвоприношений, жертву за вину.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «принятие» или «расположение». Еврейский текст не уточняет, чьё именно благоволение имеется в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: глупцы
  rationale: В книге Притчей это устойчивое обозначение людей, чья глупость имеет не только умственный, но и нравственный характер.
- source_word: יָלִיץ
  choice: смеются над
  rationale: Форма от לוץ выражает насмешку, глумление или пренебрежительное отношение. «Смеются над» естественно передаёт этот смысл по-русски.
- source_word: אָשָׁם
  choice: вина
  rationale: В данном контексте слово естественно понимать как вину или виновность; возможное культовое значение «жертва за вину» сохранено в примечании.
- source_word: וּבֵין
  choice: а среди
  rationale: Союз с предлогом вводит противопоставленную вторую строку; русское «а среди» ясно передаёт антитетический параллелизм.
- source_word: יְשָׁרִים
  choice: праведных
  rationale: Слово обозначает нравственно прямых, честных людей. «Праведные» сохраняет характерную для литературы мудрости нравственную категорию.
- source_word: רָצוֹן
  choice: благоволение
  rationale: Слово может означать благоволение, расположение или принятие. «Благоволение» сохраняет широту значения и не уточняет, о Божьем или человеческом расположении идёт речь.
theological_decisions:
- issue: Значение אָשָׁם вне явно культового контекста
  choice: абстрактное значение «вина»
  alternative: «жертва за вину»
  rationale: Этическое противопоставление глупцов и праведных поддерживает значение «вина». Однако культовое прочтение лексически возможно и потому вынесено в примечание.
- issue: Источник или носитель רָצוֹן
  choice: оставлено неопределённым как «благоволение»
  alternative: «Божье благоволение», «расположение людей» или «принятие»
  rationale: Еврейский текст не называет того, кто проявляет благоволение. Перевод не сужает эту богословскую и смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Тире во второй строке естественно восполняет отсутствующую в еврейском именную связку. Сохранены смысловая неопределённость слова רָצוֹן и возможное альтернативное значение אָשָׁם.
