  yaml_path: translation/ot/proverbs/014/029.yaml
  text: One who is slow to anger has great understanding[a], but one who is quick-tempered exalts folly.
translation:
  language: ru
  text: Кто не спешит гневаться, тот весьма разумен, а вспыльчивый[a] возносит глупость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «короткий духом», то есть нетерпеливый или скорый на гнев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶךְ אַפַּיִם
  choice: кто не спешит гневаться
  rationale: Еврейская идиома буквально означает «долгий ноздрями» и обозначает человека, который медленно приходит в гнев. Выбран естественный современный русский эквивалент, сохраняющий образ замедленного гнева.
- source_word: רַב תְּבוּנָה
  choice: обладает большим разумением
  rationale: רַב выражает здесь изобилие или значительную меру, а תְּבוּנָה — разумение, проницательность. Формулировка передаёт предикативный смысл и подходит возвышенному языку литературы мудрости.
- source_word: קְצַר רוּחַ
  choice: вспыльчивый
  rationale: Буквально «короткий духом»; в противопоставлении медленному на гнев речь идёт о нетерпеливом, скором на гнев человеке. Идиоматическое значение передано в основном тексте, а буквальный образ отмечен в сноске.
- source_word: מֵרִים
  choice: возносит
  rationale: Причастие породы Hiphil от רום означает «поднимать, возвышать». «Возносит» сохраняет метафору и не устраняет возможный оттенок того, что вспыльчивый делает глупость заметной или придаёт ей возвышенное положение.
- source_word: אִוֶּלֶת
  choice: глупость
  rationale: В Притчах слово обозначает нравственно-интеллектуальную глупость как образ поведения; «глупость» — ясный и естественный русский эквивалент.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для литературы мудрости. Параллелизм сохранён; редкое, но понятное «разумение» передаёт оттенок мудрой проницательности. Маркер сноски поставлен при выражении קְצַר רוּחַ, которое она поясняет.
