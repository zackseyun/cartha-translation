  text: חָכְמַ֣ת עָ֭רוּם הָבִ֣ין דַּרְכּ֑/וֹ וְ/אִוֶּ֖לֶת כְּסִילִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/008.yaml
  text: The wisdom of the prudent is to understand his way[b][a], but the folly of fools is deceit.
translation:
  language: ru
  text: Мудрость благоразумного — в том, чтобы понимать свой путь[a], а глупость глупцов — обман[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мудрость рассудительного — различать свой путь».'
    reason: lexical_alternative
  - marker: b
    text: «Обман» может означать как обман других, так и самообман, которым отмечена глупость глупцов.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת
  choice: мудрость
  rationale: Конструктивная форма образует сочетание «мудрость благоразумного»; такая передача точно выражает принадлежность качества и естественно звучит по-русски.
- source_word: עָרוּם
  choice: благоразумного
  rationale: В контексте Притч слово имеет положительный смысл осмотрительности и практической рассудительности. «Благоразумный» сохраняет этическое противопоставление глупцам, не придавая слову отрицательного оттенка хитрости.
- source_word: הָבִין
  choice: в том, чтобы понимать
  rationale: Инфинитив раскрывает, в чём состоит мудрость благоразумного. Определительная конструкция передаёт это точнее и естественнее, чем простое личное сказуемое.
- source_word: דַּרְכּוֹ
  choice: свой путь
  rationale: דֶּרֶךְ обозначает как путь, так и образ действий или жизненное направление. Возвратное «свой» естественно передаёт суффикс третьего лица мужского рода и связь с «благоразумным».
- source_word: וְאִוֶּלֶת
  choice: а глупость
  rationale: Союз вводит антитезу между двумя частями изречения; русское «а» передаёт её кратко и естественно.
- source_word: כְּסִילִים
  choice: глупцов
  rationale: Существительное во множественном числе сохраняет характерное для литературы мудрости обозначение нравственно неразумных людей и конструкцию «глупость глупцов».
- source_word: מִרְמָה
  choice: обман
  rationale: Слово может обозначать как обман других, так и обманчивость или самообман. Краткое «обман» сохраняет ёмкость и неоднозначность еврейского изречения.
theological_decisions:
- issue: Род и число в דַּרְכּוֹ
  choice: «благоразумного… свой путь»
  alternative: «благоразумных… их пути» или «собственный путь»
  rationale: Еврейский текст использует единственное число мужского рода как типичный образ отдельного благоразумного человека. Русская формулировка сохраняет эту грамматическую форму, не ограничивая смысл только мужчинами.
- issue: Нравственный оттенок עָרוּם
  choice: «благоразумного»
  alternative: «хитрого» или «лукавого»
  rationale: Противопоставление мудрости и глупости указывает здесь на положительную осмотрительность. Отрицательная передача нарушила бы нравственную направленность стиха.
- issue: Смысл מִרְמָה
  choice: Сохранено общее «обман»
  alternative: Уточнить как «обман других» либо «самообман»
  rationale: Контекст не позволяет однозначно решить, идёт ли речь об обманном поведении глупцов, их самообмане или об обманчивой природе их глупости; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной синтаксической формой. Повтор «глупость глупцов» намеренно сохранён как выразительная конструкция оригинала; тире ясно показывает определительный характер обеих частей.
