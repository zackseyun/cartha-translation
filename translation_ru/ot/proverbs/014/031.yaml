source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל חֵרֵ֣ף עֹשֵׂ֑/הוּ וּ֝/מְכַבְּד֗/וֹ חֹנֵ֥ן אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/031.yaml
  text: Whoever oppresses the poor insults his Maker[a], but whoever is gracious to the needy honors him.
translation:
  language: ru
  text: Кто угнетает бедного, тот оскорбляет его Создателя, а кто милостив к нуждающемуся, тот чтит Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а кто чтит бедного, тот милостив к нуждающемуся». Еврейское местоимение в выражении «чтит Его» может относиться либо к бедному, либо к его Создателю; основной текст относит его к Богу на основании параллелизма.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֵׁק
  choice: кто угнетает
  rationale: Субстантивированное причастие породы qal выражает человека, поступающего так постоянно или характерным образом; конструкция «кто…, тот…» естественно передаёт форму русского изречения. «Угнетает» охватывает несправедливое притеснение и эксплуатацию.
- source_word: דָּל
  choice: бедного
  rationale: Слово может обозначать бедного, слабого или социально беззащитного. В данном контексте «бедного» ясно и естественно передаёт основной смысл, не исключая уязвимости.
- source_word: חֵרֵף
  choice: оскорбляет
  rationale: Глагол означает поносить, бесчестить, относиться с презрением. «Оскорбляет» передаёт направленное против Создателя унижение без архаичности.
- source_word: עֹשֵׂהוּ
  choice: его Создателя
  rationale: 'Суффикс естественно относится к бедному: угнетающий бедного оскорбляет Того, кто его создал. «Создатель» в современном русском звучит яснее и естественнее, чем «Сотворивший его».'
- source_word: וּמְכַבְּדוֹ
  choice: тот чтит Его
  rationale: Местоименный суффикс допускает отнесение как к Создателю, так и к бедному. Основной текст относит его к Богу ввиду антитетического параллелизма; прописная буква делает выбранное прочтение прозрачным, а альтернативное отмечено в сноске.
- source_word: חֹנֵן
  choice: милостив к
  rationale: Причастие выражает проявление благосклонности, милости и щедрой помощи. «Милостив к» сохраняет смысл милости и достойный афористический регистр.
- source_word: אֶבְיוֹן
  choice: нуждающемуся
  rationale: Слово подчёркивает нужду и лишённость. Такой перевод сохраняет оттеночное различие с דָּל — «бедный» — в первой половине стиха.
theological_decisions:
- issue: К кому относится суффикс в וּמְכַבְּדוֹ
  choice: 'К Богу, названному в первой половине Создателем: милость к нуждающемуся означает почитание Бога.'
  alternative: 'К бедному: «а кто чтит его, тот милостив к нуждающемуся».'
  rationale: Антитетический параллелизм лучше поддерживает сопоставление оскорбления Создателя с почитанием Создателя через отношение к нуждающемуся. Однако грамматическая форма сама по себе не устраняет иной референции, поэтому неоднозначность документирована в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и легко запоминающимся строем пословицы. Парная конструкция «кто…, тот…» воспроизводит афористический характер еврейских причастий. Термины «бедный» и «нуждающийся» различены, чтобы сохранить лексическое варьирование оригинала.
