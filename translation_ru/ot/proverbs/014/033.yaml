source:
  edition: WLC
  text: בְּ/לֵ֣ב נָ֭בוֹן תָּנ֣וּחַ חָכְמָ֑ה וּ/בְ/קֶ֥רֶב כְּ֝סִילִ֗ים תִּוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/033.yaml
  text: Wisdom rests in the heart of a discerning man[a], but in the midst of fools it makes itself known.
translation:
  language: ru
  text: Мудрость покоится в сердце разумного человека, а среди глупцов она даёт о себе знать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она становится известной».'
    reason: 'Еврейская форма תִּוָּדֵעַ может передавать как становление известной, так и проявление: «даёт о себе знать».'
lexical_decisions:
- source_word: בְּלֵב
  choice: в сердце
  rationale: Сохраняет конкретный древнееврейский образ; здесь «сердце» обозначает внутренний мир человека, включая разум и волю.
- source_word: נָבוֹן
  choice: разумного человека
  rationale: Передаёт человека, обладающего пониманием и способностью различать; добавление «человека» естественно для современного русского языка и соответствует единственному числу исходного текста.
- source_word: תָּנוּחַ
  choice: покоится
  rationale: Глагол נוח выражает состояние покоя или пребывание на месте. «Покоится» сохраняет спокойный, ёмкий образ оригинала.
- source_word: חָכְמָה
  choice: Мудрость
  rationale: Это подлежащее первой части изречения. Прописная буква обусловлена началом предложения и не вводит дополнительной персонификации.
- source_word: וּבְקֶרֶב
  choice: а среди
  rationale: Союз в данном параллелизме выражает контраст, а קֶרֶב указывает на нахождение внутри круга людей; «а среди» звучит естественно и сохраняет этот смысл.
- source_word: כְּסִילִים
  choice: глупцов
  rationale: Стандартное для литературы мудрости обозначение нравственно и умственно неразумных людей; «глупцы» — точный и устойчивый русский эквивалент.
- source_word: תִּוָּדֵעַ
  choice: она даёт о себе знать
  rationale: 'Форма нифаля допускает пассивное или возвратно-инхоативное понимание: мудрость становится заметной, обнаруживается. Русское выражение передаёт её явное проявление и сохраняет контраст с тихим покоем в сердце разумного.'
theological_decisions:
- issue: Присутствие или проявление мудрости среди глупцов
  choice: 'Сохранить прямое утверждение масоретского текста: среди глупцов мудрость «даёт о себе знать».'
  alternative: Истолковать строку как утверждение, что в среде глупцов мудрости нет или что глупцы выставляют напоказ лишь своё неразумие.
  rationale: В еврейском тексте нет отрицания, а подлежащим естественно остаётся חָכְמָה («мудрость»). Перевод не устраняет напряжение и не подменяет его истолкованием.
translation_notes:
  register: Современный литературный русский язык с лаконичным ритмом притчи. Сохранены образ сердца, контраст между покоем и явным проявлением, а также неоднозначность второй части.
