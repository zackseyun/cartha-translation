id: PRO.14.19
reference: Proverbs 14:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שַׁח֣וּ רָ֭עִים לִ/פְנֵ֣י טוֹבִ֑ים וּ֝/רְשָׁעִ֗ים עַֽל שַׁעֲרֵ֥י צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/019.yaml
  text: The evil bow down before the good[b][a], and the wicked at the gates of the righteous.
translation:
  language: ru
  text: Злые склоняются перед добрыми[a], и нечестивые — у ворот праведника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простираются ниц перед добрыми». Еврейский глагол может обозначать более глубокий поклон.'
    reason: lexical_alternative
  - marker: b
    text: Образ нечестивых «у ворот праведника» может подразумевать зависимость, мольбу или признание положения праведника.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁחוּ (שׁחה)
  choice: склоняются
  rationale: Глагол обозначает низкий поклон, вплоть до простирания ниц. «Склоняются» естественно звучит по-русски, сохраняет образ унижения и не уточняет без достаточных оснований, добровольно это происходит или вынужденно.
- source_word: רָעִים
  choice: злые
  rationale: Субстантивированное прилагательное во множественном числе обозначает злых людей. Краткая форма сохраняет афористичность и параллелизм.
- source_word: לִפְנֵי
  choice: перед
  rationale: Передаёт пространственное и реляционное значение «перед, в присутствии» и естественно сочетается с глаголом поклонения.
- source_word: טוֹבִים
  choice: добрыми
  rationale: Субстантивированное прилагательное обозначает добрых людей и сохраняет прямое противопоставление злым.
- source_word: וּרְשָׁעִים
  choice: и нечестивые
  rationale: Обычное для литературы мудрости обозначение людей, отвергающих праведный путь; выбор сохраняет отличие от более общего רָעִים.
- source_word: עַל שַׁעֲרֵי
  choice: у ворот
  rationale: В данном сочетании עַל указывает на нахождение при воротах. Русское «у ворот» естественно передаёт эту сцену, а множественное число соответствует форме שַׁעֲרֵי.
- source_word: צַדִּיק
  choice: праведника
  rationale: Субстантивированное прилагательное в единственном числе представляет типичного праведного человека; родительный падеж обусловлен сочетанием «ворота праведника».
theological_decisions:
- issue: Характер подчинения злых добрым
  choice: Не уточнять, добровольны или вынужденны их поклон и появление у ворот
  alternative: Передать как явное добровольное прошение либо как насильственное покорение
  rationale: Еврейский текст изображает итоговое унижение злых перед добрыми, но не определяет ни мотив, ни механизм этого действия; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Параллелизм «злые — добрые / нечестивые — праведник» сохранён; во второй части использовано естественное для русской поэзии и пословичной речи неполное предложение с тире.
