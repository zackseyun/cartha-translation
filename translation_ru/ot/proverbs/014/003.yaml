source:
  edition: WLC
  text: בְּֽ/פִי אֱ֭וִיל חֹ֣טֶר גַּאֲוָ֑ה וְ/שִׂפְתֵ֥י חֲ֝כָמִ֗ים תִּשְׁמוּרֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/003.yaml
  text: In the mouth of a fool is a rod of pride[b][a], but the lips of the wise will guard them.
translation:
  language: ru
  text: В устах глупца — розга гордости[a], а уста мудрых оберегут их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «побег гордости». Еврейское слово может означать как розгу или прут, так и молодой побег; в данном контексте образ розги лучше соответствует предостережению о гордой речи.'
    reason: lexical_alternative
  - marker: b
    text: 'Местоимение «их», вероятнее всего, относится к мудрым: уста мудрых оберегают тех, кому принадлежат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפִי
  choice: В устах
  rationale: 'Предлог בְּ перед פֶּה передаёт местный образ: нечто находится в устах глупца или исходит из них. «В устах» естественно для русского изречения и сохраняет образ речи.'
- source_word: אֱוִיל
  choice: глупца
  rationale: Это характерный для литературы мудрости термин, обозначающий не просто человека с недостатком ума, но нравственно неразумного и упрямого. Единственное число сохраняет обобщённый характер образа.
- source_word: חֹטֶר
  choice: розга
  rationale: Слово может обозначать прут, розгу либо молодой побег. В данном противопоставлении «розга» естественно передаёт образ гордой речи как орудия, способного причинить вред или навлечь наказание, не раскрывая метафору пояснительным пересказом.
- source_word: גַּאֲוָה
  choice: гордости
  rationale: Слово обозначает гордость, высокомерие, надменность. «Гордость» прямо передаёт значение и сохраняет краткую конструкцию исходного текста.
- source_word: וְשִׂפְתֵי
  choice: а уста
  rationale: Союз וְ в параллельных строках имеет противопоставительный оттенок, поэтому передан как «а». «Уста» сохраняют телесный образ еврейского текста и параллель с первой строкой.
- source_word: חֲכָמִים
  choice: мудрых
  rationale: Прилагательное употреблено как существительное и обозначает мудрых людей как класс; русская субстантивированная форма передаёт это кратко и естественно.
- source_word: תִּשְׁמוּרֵם
  choice: оберегут их
  rationale: Глагол שׁמר означает хранить, стеречь, оберегать. Суффикс третьего лица множественного числа передан местоимением «их», чтобы не устранять сжатость и неоднозначность исходного текста; по смыслу вероятнее всего имеются в виду сами мудрые.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и образного параллелизма притчи. «Уста» выбрано как понятное возвышенно-поэтическое слово, позволяющее сохранить связь образов «уст» и речи; синтаксическая сжатость и неоднозначность местоимения намеренно не устранены.
