  text: הֲֽ/לוֹא יִ֭תְעוּ חֹ֣רְשֵׁי רָ֑ע וְ/חֶ֥סֶד וֶ֝/אֱמֶ֗ת חֹ֣רְשֵׁי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/022.yaml
  text: Will not those who devise evil go astray? But steadfast love and faithfulness belong to those who devise good[a].
translation:
  language: ru
  text: Разве не заблуждаются те, кто замышляет зло? А у тех, кто замышляет добро, — неизменная любовь и верность[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доброта и истина»; возможно также: «милость и верность». Еврейская пара слов часто обозначает неизменную любовь вместе с надёжностью или правдивостью.'
    reason: Лексическая широта слов חֶסֶד и אֱמֶת и их устойчивого сочетания.
lexical_decisions:
- source_word: הֲלוֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: יִתְעוּ
  choice: заблуждаются
  rationale: Глагол обозначает уклонение с верного пути или ошибку; выбранный вариант сохраняет нравственный смысл, не добавляя отсутствующего в тексте образа пути.
- source_word: חֹרְשֵׁי רָע
  choice: те, кто замышляет зло
  rationale: Причастие от חרשׁ здесь указывает на намеренное обдумывание или составление замысла; «замышляет» передаёт эту целенаправленность.
- source_word: רָע
  choice: зло
  rationale: Сохраняет нравственное противопоставление слову טוֹב — «добро».
- source_word: חֶסֶד
  choice: преданная любовь
  rationale: Передаёт устойчивую, деятельную и верную любовь, выражаемую словом חֶסֶד, не сводя его только к чувству или отдельному милосердному поступку.
- source_word: אֱמֶת
  choice: верность
  rationale: В устойчивой паре с חֶסֶד слово обозначает не только истину, но также надёжность и верность в отношениях.
- source_word: חֹרְשֵׁי טוֹב
  choice: те, кто замышляет добро
  rationale: Повтор глагола «замышляет» отражает повтор того же еврейского причастия и сохраняет чёткую симметрию между злом и добром.
- source_word: טוֹב
  choice: добро
  rationale: Кратко и точно передаёт субстантивированное прилагательное в нравственном противопоставлении слову «зло».
theological_decisions:
- issue: Смысл безглагольной части «חֶסֶד וֶאֱמֶת חֹרְשֵׁי טוֹב»
  choice: «преданная любовь и верность — у тех, кто замышляет добро»
  alternative: «преданная любовь и верность встретят тех, кто замышляет добро»; «те, кто замышляет добро, проявляют преданную любовь и верность»
  rationale: В еврейском тексте явная связка или сказуемое отсутствует. Оборот «у тех» сохраняет сжатость и не решает однозначно, являются ли любовь и верность качествами этих людей или благом, которое они обретают.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Риторический вопрос и параллелизм исходного текста сохранены; неопределённость безглагольной второй части не устранена.
