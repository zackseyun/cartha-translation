  text: בְּ/כָל עֶ֭צֶב יִהְיֶ֣ה מוֹתָ֑ר וּ/דְבַר שְׂ֝פָתַ֗יִם אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/023.yaml
  text: In all labor there is profit[a], but mere talk leads only to lack.
translation:
  language: ru
  text: Во всяком труде есть польза, а одни разговоры ведут лишь к нужде[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к бедности». Еврейское מַחְסוֹר может означать недостаток, нужду или бедность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל עֶצֶב
  choice: во всяком труде
  rationale: עֶצֶב здесь обозначает труд, сопряжённый с усилием и тяготой. «Труд» естественно звучит по-русски и сохраняет противопоставление деятельного усилия пустым разговорам.
- source_word: יִהְיֶה
  choice: есть
  rationale: Имперфект היה в изречении выражает общее, постоянно действующее правило; настоящее время естественно передаёт эту гномическую функцию.
- source_word: מוֹתָר
  choice: польза
  rationale: מוֹתָר может означать остаток, избыток, выгоду или прибыль. «Польза» передаёт положительный результат труда, не сужая смысл исключительно до денежной прибыли.
- source_word: וּ/דְבַר שְׂפָתַיִם
  choice: а одни разговоры
  rationale: Буквально «слово уст» — идиоматическое обозначение речи. «Одни разговоры» естественно передаёт речь, не подкреплённую делом, а союз «а» сохраняет антитезу.
- source_word: אַךְ לְ/מַחְסוֹר
  choice: лишь к нужде
  rationale: אַךְ ограничивает результат значением «лишь, только», а מַחְסוֹר обозначает недостаток, нужду или бедность. «Нужда» сохраняет широкий смысл и хорошо противопоставляется пользе.
