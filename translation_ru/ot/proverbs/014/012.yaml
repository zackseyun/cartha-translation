  text: There is a way that seems right to a man[a], but its end is the ways of death.
translation:
  language: ru
  text: Есть путь, который кажется человеку правильным[a], но конец его — пути смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прямым перед человеком»; это выражение означает путь, который в собственных глазах человека выглядит правильным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: Бывает
  rationale: Экзистенциальная частица вводит общее наблюдение; «бывает» естественно звучит в русском изречении и не ограничивает утверждение единичным случаем.
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Сохраняет буквальный образ и обычное для литературы мудрости переносное значение образа жизни или линии поведения.
- source_word: יָשָׁר
  choice: правильным
  rationale: В данном контексте слово выражает оценку пути самим человеком, а не только значение «прямой».
- source_word: לִפְנֵי אִישׁ
  choice: кажется человеку
  rationale: Буквально «перед человеком»; в контексте это идиома восприятия или личной оценки. Русское «кажется человеку» ясно и естественно передаёт смысл.
- source_word: וְאַחֲרִיתָהּ
  choice: но в конце его
  rationale: Союз передан противительным «но» по смыслу контраста; местоимение «его» относится к пути. Оборот сохраняет лаконичность и силу афоризма.
- source_word: דַּרְכֵי
  choice: пути
  rationale: Сохранено множественное число исходного текста, а также лексическая связь с «путь» в первой половине стиха.
- source_word: מָוֶת
  choice: смерти
  rationale: Прямой и семантически открытый перевод, не сводящий сказанное только к физической смерти или к общему краху.
theological_decisions:
- issue: Обобщающее אִישׁ мужского рода
  choice: человеку
  alternative: мужчине / кому-то
  rationale: Русское «человек» грамматически мужского рода и естественно имеет обобщающее значение, одновременно сохраняя форму единственного числа.
- issue: Характер «смерти» в контексте литературы мудрости
  choice: смерти
  alternative: гибели / погибели
  rationale: Исходный текст говорит именно о смерти и не уточняет, имеется ли в виду исключительно физическая смерть, духовная участь или всеобъемлющий губительный исход; перевод сохраняет эту смысловую широту.
- issue: Множественное число דַּרְכֵי после единственного דֶּרֶךְ
  choice: пути смерти
  alternative: путь к смерти
  rationale: Множественное число сохранено, чтобы не устранять необычное напряжение исходного текста и не превращать конструкцию в более привычное, но менее точное единственное число.
translation_notes:
  register: Современный литературный русский, лаконичный афористический строй. «Кажется человеку правильным» передаёт еврейскую идиому естественно, а формула «в конце его — пути смерти» сохраняет необычное множественное число и торжественную резкость заключения.
