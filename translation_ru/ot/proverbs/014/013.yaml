source:
  edition: WLC
  text: גַּם בִּ/שְׂח֥וֹק יִכְאַב לֵ֑ב וְ/אַחֲרִיתָ֖/הּ שִׂמְחָ֣ה תוּגָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/013.yaml
  text: Even in laughter the heart may ache[b][a], and the end of joy is grief.
translation:
  language: ru
  text: Даже когда человек смеётся, сердце может болеть[a], и конец радости — печаль[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Даже когда человек смеётся, сердце болит». Древнееврейский имперфект в изречении может выражать общее, обычно наблюдаемое положение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исход радости — печаль»; возможно также: «после радости приходит печаль».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Даже
  rationale: 'Передаёт уступительно-усилительный смысл: внутренняя боль возможна вопреки внешнему смеху.'
- source_word: בִּשְׂחוֹק
  choice: когда человек смеётся
  rationale: Естественно передаёт обстоятельственное בְּ со значением времени или сопутствующего состояния и сохраняет конкретный образ смеха.
- source_word: יִכְאַב
  choice: может болеть
  rationale: Модальная форма сохраняет допустимый потенциальный оттенок древнееврейского имперфекта в изречении общего характера; вариант с обычным настоящим временем отмечен в сноске.
- source_word: לֵב
  choice: сердце
  rationale: Традиционное и понятное обозначение внутреннего мира и области переживаний.
- source_word: וְאַחֲרִיתָהּ
  choice: и конец радости
  rationale: Суффикс женского рода соотнесён с שִׂמְחָה; «конец» сохраняет образ завершения, при этом возможный смысл результата указан в сноске.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Прямой и естественный современный эквивалент, ясно противопоставленный печали.
- source_word: תוּגָה
  choice: печаль
  rationale: Передаёт глубокую скорбь без излишнего сужения значения до траура по умершему.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная конструкция. Добавлен общий субъект «человек», естественный для русского придаточного оборота; он не вводит нового участника, а раскрывает подразумеваемого носителя смеха и сердечной боли.
