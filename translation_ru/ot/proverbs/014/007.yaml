  yaml_path: translation/ot/proverbs/014/007.yaml
  text: Go from the presence of a foolish man[a], for you do not perceive lips of knowledge.
translation:
  language: ru
  text: 'Уйди от глупца: ты не найдёшь у него разумных слов.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Уйди от глупца, ибо (или: и) ты не познал уст знания». Связь между повелением и второй частью еврейского текста понимается по-разному.'
    reason: Сохраняет буквальный образ «уст знания» и отмечает синтаксическую неоднозначность, не навязывая условное или прошедшее прочтение.
lexical_decisions:
- source_word: לֵךְ מִנֶּגֶד
  choice: Уйди от
  rationale: Императив לֵךְ вместе с מִנֶּגֶד призывает удалиться от находящегося перед тобой человека; по-русски это естественно и кратко передаётся как «уйди от».
- source_word: לְאִישׁ כְּסִיל
  choice: глупого человека
  rationale: 'Сохраняются оба элемента еврейского сочетания: אִישׁ — «человек, мужчина» и כְּסִיל — характерное для литературы мудрости обозначение глупца.'
- source_word: וּבַל יָדַעְתָּ
  choice: ты не услышишь от него
  rationale: Буквально конструкция допускает «и ты не узнаешь/не распознаешь»; в связи с «устами знания» она выражает отсутствие разумной речи у глупого. Перевод передаёт естественный для пословицы результат, не делая его способным дать такие слова.
- source_word: שִׂפְתֵי דָעַת
  choice: разумных слов
  rationale: Буквально «уста знания» — метонимия речи. В современном русском «разумные слова» ясно передаёт смысл, тогда как буквальное «уста знания» звучало бы неестественно.
