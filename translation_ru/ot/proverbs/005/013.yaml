  yaml_path: translation/ot/proverbs/005/013.yaml
  text: and I did not listen to the voice of my instructors[a], nor did I incline my ear to my teachers.
translation:
  language: ru
  text: и не слушал голоса наставников моих, и к учителям моим не приклонял уха своего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не повиновался наставникам моим». В данном контексте еврейский глагол может означать слушание, ведущее к послушанию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: слушал голоса
  rationale: Сочетание שׁמע בקול означает слушать или внимать, нередко с оттенком послушания. Формулировка сохраняет образ голоса и не сводит смысл только к исполнению.
- source_word: מוֹרָי
  choice: наставников моих
  rationale: Причастная форма от ירה обозначает тех, кто наставляет. «Наставники» естественно передаёт образовательный контекст и позволяет слегка отличить слово от следующего מְלַמְּדַי.
- source_word: מְלַמְּדַי
  choice: учителям моим
  rationale: Форма от למד буквально обозначает тех, кто учит; «учителя» — прямой и естественный русский эквивалент.
- source_word: הִטִּיתִי אָזְנִי
  choice: не приклонял уха своего
  rationale: Сохранена еврейская метафора намеренного внимательного слушания. «Приклонять ухо» — понятное и достойное библейское выражение, хотя несколько возвышенное.
- source_word: וְ...וְלֹא
  choice: и не... и... не
  rationale: Две отрицательные части скоординированы повторным «и», что близко к структуре еврейского текста и естественно в данном параллелизме.
theological_decisions:
- issue: Оттенок послушания в שׁמע בקול
  choice: «не слушал голоса» с примечанием
  alternative: «не повиновался» или «не внимал»
  rationale: Контекст мудрости подразумевает не только восприятие речи, но и следование наставлению. Основной текст сохраняет образ и смысловую широту, а примечание отмечает оттенок послушания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Инверсия «наставников моих» и выражение «приклонял уха своего» сохраняют поэтический параллелизм и звучат уместно в книге Притч.
