translation:
  language: ru
  text: Любящая лань, полная грации горная коза — пусть её груди всегда насыщают тебя; упивайся её любовью всегда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь всегда пленён её любовью». Еврейский глагол обычно означает «сбиваться с пути, блуждать», но здесь положительно описывает человека, целиком захваченного любовью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֶּלֶת אֲהָבִים
  choice: лань любви
  rationale: אַיֶּלֶת обозначает самку оленя, а אֲהָבִים связывает образ с любовью и нежностью. Поэтическое сочетание «лань любви» сохраняет метафору и образность еврейского текста.
- source_word: וְיַעֲלַת חֵן
  choice: серна грациозная
  rationale: יַעֲלָה — дикая горная коза, вероятно козерог; в русском библейско-поэтическом контексте «серна» понятно передаёт образ изящного горного животного, а חֵן — его грацию и прелесть.
- source_word: דַּדֶּיהָ
  choice: её груди
  rationale: Слово прямо обозначает груди. Открытый анатомический перевод соответствует супружеско-эротическому контексту и не смягчает исходный образ.
- source_word: יְרַוֻּךָ
  choice: пусть ... насыщают тебя
  rationale: Форма от רוה передаёт утоление жажды, насыщение и обильное удовлетворение. «Насыщают» сохраняет метафорическую связь с питьём и естественно звучит в данном контексте.
- source_word: בְכָל־עֵת
  choice: во всякое время
  rationale: Формально и ясно передаёт всеохватное временное значение выражения.
- source_word: בְאַהֲבָתָהּ
  choice: её любовью
  rationale: 'Творительный падеж естественно передаёт инструментальное значение предлога ב: любовь жены — то, чем муж упивается.'
- source_word: תִּשְׁגֶּה
  choice: упивайся
  rationale: Обычно корень שׁגה означает блуждать или сбиваться с пути, но здесь в намеренно положительном контексте выражает состояние захваченности любовью. «Упивайся» передаёт опьянение и увлечённость, не превращая образ в осуждение.
- source_word: תָמִיד
  choice: всегда
  rationale: Краткий естественный эквивалент наречия постоянной длительности.
theological_decisions:
- issue: Открытая супружеско-эротическая образность литературы мудрости
  choice: Сохранить прямое «её груди» и чувственный язык удовлетворения и упоения.
  alternative: Смягчить текст словами «лоно», «нежность» или «наслаждайся».
  rationale: В контексте главы стих одобряет близость с женой как противоположность прелюбодеянию. Исходный текст говорит прямо, поэтому эвфемизация внесла бы отсутствующую в нём сдержанность.
- issue: Положительное употребление שׁגה
  choice: Передать как «упивайся», сохранив образ захваченности любовью.
  alternative: Перевести буквально «блуждай» или истолковать нейтрально как «восхищайся».
  rationale: Обычное значение глагола создаёт намеренное смысловое напряжение, однако контекст явно положителен. «Упивайся» сохраняет и интенсивность, и необычный оттенок утраты трезвой меры.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Синтаксис слегка возвышенный, но понятный; сохранены параллелизм, животные метафоры и открытая супружеская чувственность оригинала.
