base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/005.yaml
  text: Her feet go down to death[a]; her steps hold fast to Sheol.
translation:
  language: ru
  text: 'Её ноги сходят к смерти,

    её шаги крепко держатся Шеола[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могилы» или «мира мёртвых». Еврейское слово — «Шеол».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֶיהָ
  choice: ноги её
  rationale: Форма множественного числа с суффиксом 3-го лица женского рода; конкретный образ ног сохранён, как и поэтическая инверсия.
- source_word: יֹרְדוֹת
  choice: нисходят
  rationale: Причастие породы qal от ירד передаёт направленное движение вниз. «Нисходят» естественно для возвышенной поэзии и сохраняет образ спуска к смерти.
- source_word: מָוֶת
  choice: смерти
  rationale: Сохранено прямое значение «смерть» без ослабления до «опасности» или «гибели» в переносном смысле.
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет особое древнееврейское понятие и не сводит его ни только к могиле, ни к более позднему представлению об аде.
- source_word: צְעָדֶיהָ
  choice: её шаги
  rationale: Конкретное множественное число сохраняет параллелизм с «ногами» в первой строке.
- source_word: יִתְמֹכוּ
  choice: держат путь
  rationale: Корень תמך выражает удерживание или крепкое следование. Русское сочетание «держат путь» естественно передаёт устойчивую направленность шагов к Шеолу, хотя конкретный образ хватания становится менее явным.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация сохраняет смысловую и богословскую широту древнееврейского термина, не отождествляя его безоговорочно ни с физической могилой, ни с адом.
- issue: Связь шагов с Шеолом в יִתְמֹכוּ
  choice: шаги держат путь в Шеол
  alternative: шаги крепко держатся Шеола
  rationale: Выбран естественный русский оборот, сохраняющий твёрдую направленность движения. Альтернатива формально ближе к образу удерживания, но звучит по-русски неясно и неестественно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Параллелизм двух полустиший и образы нисхождения, ног и шагов сохранены; инверсия «ноги её» поддерживает библейский поэтический ритм.
