base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/006.yaml
  text: Lest she should level the path of life[a], her tracks wander[b]; she does not know it.
translation:
  language: ru
  text: Чтобы она не выравнивала путь жизни[a], её стези блуждают[b], и она не знает этого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительные слова можно также понять как обращение к слушателю: «ты не знаешь этого», а не как продолжение описания женщины.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно и другое понимание: «Чтобы ты не обдумывал путь жизни; её пути блуждают». Еврейский текст этого стиха краток и допускает разные способы синтаксического членения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: путь жизни
  rationale: 'Сохраняет конкретный образ дороги: אֹרַח — «путь, тропа», חַיִּים — «жизнь».'
- source_word: פֶּן
  choice: чтобы не
  rationale: Передаёт отрицательно-предупредительное значение частицы и естественно звучит по-русски.
- source_word: תְּפַלֵּס
  choice: выровняла
  rationale: Пиэль от פלס может означать «выравнивать, прокладывать ровно», а также «взвешивать, обдумывать»; основной вариант сохраняет дорожную метафору.
- source_word: נָעוּ
  choice: блуждают
  rationale: Передаёт колебание и неустойчивость движения в рамках образа сбившихся путей.
- source_word: מַעְגְּלֹתֶיהָ
  choice: её стези
  rationale: Сохраняет образ дороги и позволяет лексически отличить מַעְגָּל от אֹרַח.
- source_word: לֹא תֵדָע
  choice: она не знает этого
  rationale: В контексте субъектом естественно остаётся женщина из стихов 3–6; добавленное «этого» выражает подразумеваемый объект.
theological_decisions:
- issue: Субъект заключительной части
  choice: она не знает этого
  alternative: ты не знаешь этого
  rationale: Контекст продолжает описание женщины в третьем лице женского рода, однако текстовая и синтаксическая форма допускает понимание как обращения к слушателю; альтернатива отмечена в сноске.
- issue: Синтаксическая связь פֶּן תְּפַלֵּס
  choice: Чтобы она не выровняла путь жизни
  alternative: Не обдумывай путь жизни; её пути блуждают
  rationale: Основной вариант понимает פֶּן как вводящую отрицательную целевую/предупредительную конструкцию и сохраняет дорожный смысл פלס. Компактный еврейский синтаксис допускает и другое членение, поэтому оно вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической мудрости. «Стези» слегка возвышенно, но понятно и помогает избежать однообразного повторения слова «путь». Необычная логическая напряжённость оригинала сохранена, а не сглажена.
