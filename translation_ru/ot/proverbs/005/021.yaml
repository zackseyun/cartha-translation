id: PRO.5.21
reference: Proverbs 5:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י נֹ֨כַח עֵינֵ֣י יְ֭הוָה דַּרְכֵי אִ֑ישׁ וְֽ/כָל מַעְגְּלֹתָ֥י/ו מְפַלֵּֽס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/021.yaml
  text: For a man's ways are before the eyes of Yahweh[a], and he watches all his paths.
translation:
  language: ru
  text: Ибо пути человека — перед глазами Яхве, и все его стези Он взвешивает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внимательно рассматривает все его пути». Еврейский глагол может обозначать измерение, взвешивание или оценку направления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит основание предшествующего предостережения и сохраняет краткую причинно-пояснительную связь.
- source_word: נֹכַח עֵינֵי יְהוָה
  choice: перед глазами Яхве
  rationale: Сохраняет пространственную метафору полной открытости человеческих путей Божьему взору и антропоморфный образ «глаз».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: דַּרְכֵי אִישׁ
  choice: пути человека
  rationale: אִישׁ употреблено обобщённо; «человека» естественно в современном русском и сохраняет собирательно-представительное значение единственного числа.
- source_word: מַעְגְּלֹתָיו
  choice: его стези
  rationale: «Стези» сохраняет поэтический параллелизм с «путями» и более конкретный образ проложенных направлений жизни.
- source_word: מְפַלֵּס
  choice: взвешивает
  rationale: Глагол выражает измерение и оценку пути. «Взвешивает» сохраняет образную силу еврейского слова, не сводя действие лишь к наблюдению.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя; транслитерация сохраняет прямую заветную референцию, не заменяя имя титулом.
- issue: Характер Божьего действия в מְפַלֵּס
  choice: взвешивает
  alternative: наблюдает за
  rationale: Выбрана оценочная метафора, наиболее непосредственно отражающая смысл измерения или испытания. В сноске сохранена возможность более общего понимания как внимательного рассмотрения.
- issue: Обобщённое אִישׁ
  choice: человека
  alternative: мужчины
  rationale: Здесь речь идёт не о конкретном мужчине, а о человеке как представителе людей вообще; русское «человека» точно передаёт эту обобщённость.
translation_notes:
  register: Современный литературный русский с достоинством афористической речи. Слово «стези» слегка возвышенно, но общеупотребительно в библейско-поэтическом контексте и позволяет сохранить параллелизм без монотонного повтора.
