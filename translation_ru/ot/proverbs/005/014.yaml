base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/014.yaml
  text: I was almost in every kind of evil in the midst of the assembly and congregation[a].
translation:
  language: ru
  text: Я едва не оказался во всяком зле посреди собрания и общины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я едва не оказался в полной гибели»; возможно также: «Я едва не оказался во всём зле». Еврейское выражение кратко и может подчёркивать либо нравственное зло, либо гибельное бедствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: едва не
  rationale: В сочетании с היה выражает не краткую длительность, а близость к некоторому состоянию; «едва не» естественно передаёт этот смысл по-русски.
- source_word: הָיִיתִי
  choice: я оказался
  rationale: Форма имеет простое прошедшее значение «я был», однако в данном сочетании русское «оказался» естественнее передаёт приближение говорящего к описанному состоянию.
- source_word: בְכָל רָע
  choice: во всяком зле
  rationale: Сохраняет компактность, предлог и широкий смысл еврейского выражения, не устраняя его возможную отнесённость как к нравственному злу, так и к гибельному бедствию.
- source_word: בְּתוֹךְ
  choice: посреди
  rationale: Передаёт пространственный и публичный оттенок выражения буквально и естественно.
- source_word: קָהָל
  choice: собрание
  rationale: Обычный русский эквивалент для обозначения собравшегося сообщества.
- source_word: וְעֵדָה
  choice: и общины
  rationale: Сохраняет два близких, но разных еврейских наименования сообщества и подчёркивает публичность происходящего.
theological_decisions:
- issue: Значение רָע в выражении בְכָל רָע
  choice: Основной текст оставляет нравственное значение «зло», подходящее контексту предостережения.
  alternative: «Полная гибель» или «всяческая беда», если речь прежде всего о катастрофических последствиях.
  rationale: Еврейская фраза кратка и допускает как нравственное, так и бедственное прочтение; примечание сохраняет эту напряжённость, не разрешая её однозначно.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Парные слова «собрание и община» сохранены, чтобы не сводить два еврейских термина к одному.
