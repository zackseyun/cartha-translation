  source_fidelity: 'Текст точно передаёт все элементы еврейского оригинала: переходное «и теперь», обращение בָנִים во множественном числе мужского рода, призыв слушать, запрет уклоняться и образ «слов уст моих». Добавлений или богословской интерпретации нет.'
