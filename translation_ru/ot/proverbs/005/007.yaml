source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ/אַל תָּ֝ס֗וּרוּ מֵ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/007.yaml
  text: And now[a], sons, listen to me, and do not turn aside from the words of my mouth.
translation:
  language: ru
  text: И теперь, сыновья[a], слушайте меня и не отступайте от слов уст моих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети». В еврейском тексте употреблено существительное мужского рода во множественном числе — «сыновья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и соединительную силу וְ, и переход к новому увещанию, обозначенный עַתָּה.
- source_word: בָנִים
  choice: сыновья
  rationale: Передаёт грамматически мужское множественное число без добавления отсутствующего в стихе притяжательного местоимения «мои».
- source_word: שִׁמְעוּ לִי
  choice: слушайте меня
  rationale: Естественно передаёт призыв внимательно слушать; возможный оттенок послушания не превращён в прямое «повинуйтесь».
- source_word: וְאַל תָּסוּרוּ
  choice: и не отступайте
  rationale: Передаёт сочинительную связь и образ уклонения или отхода от наставления.
- source_word: מֵאִמְרֵי פִי
  choice: от слов уст моих
  rationale: Сохраняет еврейский телесный образ и торжественную мудростную формулу, оставаясь понятным по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной мудростной интонацией. Порядок «уст моих» сохраняет достоинство и образность источника, не делая фразу непонятной.
