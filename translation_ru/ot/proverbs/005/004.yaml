  text: but in the end she is bitter like wormwood[a], sharp like a two-edged sword.
translation:
  language: ru
  text: но под конец она горька, как полынь, остра, как обоюдоострый меч.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחֲרִיתָהּ
  choice: но под конец она
  rationale: אַחֲרִית обозначает конец, последствие или конечный исход; суффикс 3-го лица женского рода указывает на женщину. «Под конец она» естественно передаёт контраст с предыдущим стихом, сохраняя женский референт.
- source_word: מָרָה
  choice: горька
  rationale: Предикативное прилагательное «горькая» описывает её конечный итог или проявление; краткая форма естественна в русском и сохраняет образ мучительной горечи.
- source_word: כַלַּעֲנָה
  choice: как полынь
  rationale: לַעֲנָה — полынь, растение, служащее устойчивым образом крайней горечи. Конкретный образ сохранён без замены абстрактным понятием.
- source_word: חַדָּה
  choice: остра
  rationale: Прилагательное означает «острая» и согласуется с женским референтом; сравнение с мечом раскрывает его смысл.
- source_word: כְּחֶרֶב פִּיּוֹת
  choice: как обоюдоострый меч
  rationale: Буквально «как меч устий/лезвий»; это древнееврейское выражение обозначает меч с режущими кромками с обеих сторон. «Обоюдоострый меч» — точная, понятная и устойчивая русская формулировка.
