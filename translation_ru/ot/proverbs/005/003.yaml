  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
translation:
  language: ru
  text: Ибо губы чужой женщины источают мёд, и нёбо её глаже масла.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иноземки» или «прелюбодейки». Еврейское слово в Притчах часто обозначает женщину, связь с которой находится вне границ дозволенных половых отношений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предостережения в ближайшем контексте; «ибо» ясно сохраняет логическую связь и соответствует литературному регистру.
- source_word: נֹפֶת
  choice: мёд
  rationale: Слово обозначает мёд, вероятно текучий с сот; идею истечения уже передаёт глагол תִּטֹּפְנָה.
- source_word: תִּטֹּפְנָה
  choice: источают
  rationale: Глагол означает «капать, источать». В сочетании с губами и мёдом «источают» естественно передаёт образ обольстительной речи.
- source_word: שִׂפְתֵי זָרָה
  choice: губы запретной женщины
  rationale: Конструкция буквально означает «губы чужой/посторонней женщины». В контексте Притч זָרָה указывает на женщину вне дозволенных половых отношений; «запретная» передаёт нравственный смысл, не сводя его непременно к этнической чуждости или замужнему статусу.
- source_word: וְחָלָק מִשֶּׁמֶן
  choice: и ... глаже масла
  rationale: 'Прилагательное חָלָק с сравнительным מִן выражает сравнение: «гладкое/глаже масла». Краткая сравнительная форма сохраняет поэтический параллелизм.'
- source_word: חִכָּהּ
  choice: нёбо её
  rationale: Буквальное значение — «её нёбо»; в данном контексте это метонимия речи или уст. Сохранение телесного образа позволяет не устранять исходную образность и неоднозначность.
theological_decisions:
- issue: Значение זָרָה в контексте мудрости Притч
  choice: запретная женщина
  alternative: чужая женщина; иноземка; прелюбодейка
  rationale: В Притчах термин обычно характеризует женщину, связь с которой недозволенна. Выбор передаёт нравственную направленность текста, но не утверждает без достаточного основания, что речь обязательно об иноземке либо о замужней прелюбодейке.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного поэтического параллелизма. «Нёбо» удерживает буквальный образ еврейского текста; инверсия «нёбо её» придаёт строке достоинство и не затрудняет понимание.
