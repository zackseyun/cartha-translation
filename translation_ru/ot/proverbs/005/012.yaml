translation:
  language: ru
  text: 'И ты скажешь[a]: «Как же я ненавидел наставление, и сердце моё презирало обличение![b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И ты говоришь». Еврейская форма прошедшего времени в этом предостережении может описывать будущее следствие либо живо представлять последующее признание как уже звучащее.'
    reason: lexical_alternative
  - marker: b
    text: «Обличение» можно также перевести как «порицание» или «исправление».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: И ты скажешь
  rationale: Форма qal perfect 2-го лица мужского рода единственного числа с союзом в контексте предостережения передаёт последующее, ожидаемое признание; русское будущее время естественно выражает эту связь.
- source_word: אֵיךְ
  choice: Как же
  rationale: Здесь слово вводит эмоциональное восклицание и горестное признание, а не вопрос; частица «же» естественно усиливает этот оттенок в современном русском языке.
- source_word: שָׂנֵאתִי
  choice: я ненавидел
  rationale: Форма qal perfect 1-го лица единственного числа выражает ретроспективное признание; прошедшее время сохраняет его прямоту.
- source_word: מוּסָר
  choice: наставление
  rationale: В Притчах слово обозначает формирующее наставление, включающее исправление и дисциплину. «Наставление» понятно современному читателю и не сужает смысл до наказания.
- source_word: וְתוֹכַחַת
  choice: и … обличение
  rationale: Существительное обозначает словесное указание на неправоту, порицание или исправление. «Обличение» сохраняет силу выражения и соответствует возвышенному, но современному регистру книги Притчей.
- source_word: נָאַץ
  choice: презирало
  rationale: Глагол передаёт презрительное отвержение; «презирало» сохраняет сильную отрицательную окраску и поэтический параллелизм с «ненавидел».
- source_word: לִבִּי
  choice: сердце моё
  rationale: Сохранён образ сердца как внутреннего центра воли, мысли и отношения человека; инверсия поддерживает поэтический и исповедальный тон.
