  language: ru
  text: И в конце своём[b] ты застонешь[a], когда истощатся твоя плоть и твоё тело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты будешь стонать»; еврейский глагол передаёт слышимый, глубокий стон от страдания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «под конец жизни»; еврейское выражение может указывать и на последний период жизни, и на конечный итог избранного пути.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהַמְתָּ
  choice: и ... ты застонешь
  rationale: Глагол נהם обозначает слышимый, глубокий звук страдания. «Застонешь» естественно передаёт мучительную скорбь и сожаление, не усиливая образ до «взревёшь».
- source_word: בְאַחֲרִיתֶךָ
  choice: в конце своём
  rationale: אַחֲרִית может обозначать как завершение жизни, так и конечный итог избранного пути. Краткое выражение «в конце своём» сохраняет эту смысловую широту.
- source_word: בִּכְלוֹת
  choice: когда истлеют
  rationale: Инфинитив от כלה выражает сопутствующее время или обстоятельство исчерпания. В сочетании с плотью и телом «истлеют» передаёт их полное физическое разрушение, хотя возможен и менее сильный образ изнеможения.
- source_word: בְּשָׂרְךָ
  choice: твоя плоть
  rationale: Буквальное «плоть» сохраняет конкретный телесный образ и не сливает этот термин с параллельным שְׁאֵר.
- source_word: וּשְׁאֵרֶךָ
  choice: и твоё тело
  rationale: В данном параллелизме שְׁאֵר указывает на телесную сущность человека. «Тело» понятно современному читателю и естественно сочетается с «плотью».
