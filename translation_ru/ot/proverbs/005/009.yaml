    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: чтобы… не
  rationale: Передаёт предостережение о нежелательном последствии и естественно продолжает синтаксис окружающего наставления.
- source_word: תִּתֵּן
  choice: ты не отдал
  rationale: Обычное значение נתן — «давать, отдавать»; в данном контексте «отдал» естественно выражает утрату того, что переходит к другим.
- source_word: לַאֲחֵרִים
  choice: другим
  rationale: 'Сохраняет множественное число и широкое значение: речь не обязательно идёт только о чужеземцах или незнакомцах.'
- source_word: הוֹדֶךָ
  choice: свою честь
  rationale: הוד может обозначать честь, великолепие, достоинство или силу. «Честь» естественно передаёт здесь утрату достоинства, не исключая более широких оттенков, отмеченных в сноске.
- source_word: וּשְׁנֹתֶיךָ
  choice: а свои годы
  rationale: Прямо передаёт еврейское выражение; союз «а» по-русски ясно оформляет параллельную вторую строку и её усиление.
- source_word: לְאַכְזָרִי
  choice: жестокому
  rationale: Прилагательное употреблено субстантивно в единственном числе. Субстантивированное русское «жестокому» сохраняет краткость и не уточняет без необходимости, кто именно имеется в виду.
