translation:
  language: ru
  text: чтобы ты не отдал другим свою честь[a] и свои годы — жестокому[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё достоинство», «своё великолепие» или «свою силу».'
