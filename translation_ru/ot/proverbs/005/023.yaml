  text: ה֗וּא יָ֭מוּת בְּ/אֵ֣ין מוּסָ֑ר וּ/בְ/רֹ֖ב אִוַּלְתּ֣/וֹ יִשְׁגֶּֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/023.yaml
  text: He dies for lack of discipline[a], and in the abundance of his folly he goes astray.
translation:
  language: ru
  text: Он умрёт из-за недостатка наставления[a] и, по великой глупости своей, собьётся с пути.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он умрёт без наставления и по великой глупости своей собьётся с пути».'
    reason: 'Лексико-синтаксическая альтернатива: בְּאֵין можно понимать как обозначение обстоятельства («без»), а не явно выраженной причины («из-за недостатка»).'
lexical_decisions:
- source_word: יָמוּת
  choice: умрёт
  rationale: Имперфект Qal, 3-е лицо, ед. число, выражает неизбежный итог; будущее время естественно передаёт это предостережение по-русски.
- source_word: בְּאֵין
  choice: из-за недостатка
  rationale: Сочетание ב с אֵין обозначает отсутствие как обстоятельство или причину; выбранная передача ясно выражает причинный смысл.
- source_word: מוּסָר
  choice: наставления
  rationale: В Притчах слово обозначает формирующее и исправляющее наставление, включая дисциплину; «наставление» звучит естественно и не сужает смысл до наказания.
- source_word: וּבְרֹב
  choice: по великой
  rationale: רֹב указывает на большую степень или изобилие; оборот «по великой глупости» естественно выражает как интенсивность, так и причинную связь.
- source_word: אִוַּלְתּוֹ
  choice: глупости своей
  rationale: Это нравственная, пагубная глупость — ключевое понятие литературы мудрости; «глупость» в современном русском сохраняет нужную силу.
- source_word: יִשְׁגֶּה
  choice: собьётся с пути
  rationale: Глагол שׁגה означает заблуждаться, блуждать или сходить с верного пути; идиома передаёт нравственное уклонение, не добавляя образа опьянения.
- source_word: הוּא
  choice: Он
  rationale: Явное местоимение сохраняет выделенный в еврейском тексте субъект без искусственного усиления.
