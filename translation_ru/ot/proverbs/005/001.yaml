lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Прямое обращение отца или наставника к сыну; сохранены мужской род, единственное число и естественный для русского языка порядок слов в обращении.
- source_word: לְחָכְמָתִי
  choice: моей мудрости
  rationale: Сохранено основное значение חָכְמָה и отвлечённая форма существительного без поясняющей подстановки «мудрое наставление».
- source_word: הַקְשִׁיבָה
  choice: внимай
  rationale: Императив передаёт не просто слушание, а сосредоточенное внимание. «Внимай» кратко, понятно и соответствует возвышенному наставительному регистру Притч.
- source_word: לִתְבוּנָתִי
  choice: к моему разумению
  rationale: תְּבוּנָה обозначает понимание, разумение, проницательность. «Разумение» сохраняет отвлечённое существительное и естественно образует параллель с «мудростью».
- source_word: הַט
  choice: склони
  rationale: Сохранена метафора направленного, внимательного слушания, выраженная повелительной формой נטה.
- source_word: אָזְנֶךָ
  choice: ухо
  rationale: Сохранено единственное число исходного текста и телесный образ внимательного слушания.
