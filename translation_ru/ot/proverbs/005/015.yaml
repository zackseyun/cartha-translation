  yaml_path: translation/ot/proverbs/005/015.yaml
  text: Drink water from your own cistern[a], and flowing water from your own well.
translation:
  language: ru
  text: Пей воду из собственной цистерны и струящуюся воду из глубины собственного колодца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и то, что струится из глубины собственного колодца». В еврейском тексте употреблено причастие «струящиеся» без повторения слова «вода».'
    reason: 'Лексическая альтернатива: причастие וְנֹזְלִים можно передать более буквально, не восполняя существительное «вода».'
lexical_decisions:
- source_word: שְׁתֵה
  choice: Пей
  rationale: Прямое повеление, Qal, 2-е лицо единственного числа мужского рода; простой императив сохраняет силу еврейской формы без добавочного оттенка.
- source_word: מַיִם
  choice: воду
  rationale: Обычное значение — «вода»; в русском языке здесь естественно употребить единственное число.
- source_word: מִבּוֹרֶךָ
  choice: из собственного водоёма
  rationale: בּוֹר обозначает яму или сооружение для сбора и хранения воды. «Водоём» понятно современному читателю и сохраняет конкретный образ; «собственного» передаёт притяжательный суффикс и подчёркнутую контекстом исключительность.
- source_word: וְנֹזְלִים
  choice: и текущую воду
  rationale: Причастная форма от נזל означает «течь, струиться». Существительное «воду» восполнено по параллельной строке, чтобы фраза звучала естественно по-русски, но возможность более буквального понимания отмечена в сноске.
- source_word: מִתּוֹךְ
  choice: из
  rationale: Буквально выражает движение «изнутри, из середины». В сочетании с колодцем простое русское «из» естественно передаёт источник воды без тяжеловесности.
- source_word: בְּאֵרֶךָ
  choice: собственного колодца
  rationale: בְּאֵר обычно означает «колодец». Перевод сохраняет предметный водный образ, не раскрывая метафору прямо в тексте.
theological_decisions:
- issue: Следует ли прямо раскрыть брачно-сексуальную метафору
  choice: Сохранить в основном тексте буквальный образ воды, водоёма и колодца
  alternative: 'Передать смысл пояснительно, например: «Будь доволен своей женой»'
  rationale: Еврейский текст намеренно выражает наставление посредством метафоры, значение которой раскрывается ближайшим контекстом. Прямое истолкование в основном тексте устранило бы литературную образность и вышло бы за пределы перевода.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, повелительная и образная. Сохранён параллелизм двух частей стиха и не раскрыта явно метафора супружеской верности.
