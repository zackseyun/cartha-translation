  text: עַֽווֹנוֹתָ֗י/ו יִלְכְּדֻ/נ֥וֹ אֶת הָ/רָשָׁ֑ע וּ/בְ/חַבְלֵ֥י חַ֝טָּאת֗/וֹ יִתָּמֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/022.yaml
  text: His iniquities will capture the wicked man[b][a], and he will be held fast in the cords of his sin.
translation:
  language: ru
  text: Беззакония нечестивого уловят его, и путами своего греха он будет удержан.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַוּוֹנוֹתָיו
  choice: беззакония нечестивого
  rationale: Множественное עָוֹן обозначает нравственные проступки и связанную с ними вину. Родительный оборот естественно передаёт местоименный суффикс и одновременно устраняет неясность русского «его» перед названным объектом.
- source_word: יִלְכְּדֻנוֹ
  choice: уловят его
  rationale: Глагол לָכַד означает схватить или поймать; «уловят» сохраняет образ западни и звучит уместно в литературном тексте мудрости.
- source_word: הָרָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное стоит в мужском роде и единственном числе. «Нечестивый» передаёт нравственную характеристику, не добавляя юридического оттенка слова «виновный».
- source_word: וּבְחַבְלֵי
  choice: и путами
  rationale: חֶבֶל может означать верёвку, шнур или узы. «Путы» естественно сочетаются с удержанием и сохраняют метафору связывания.
- source_word: חַטָּאתוֹ
  choice: своего греха
  rationale: Единственное число сохранено; возвратное «своего» ясно связывает грех с удерживаемым нечестивым.
- source_word: יִתָּמֵךְ
  choice: он будет удержан
  rationale: Нифаль глагола תמך здесь в контексте пут означает пассивное удерживание. Формулировка сохраняет пассивный залог, не усиливая образ до прямого «будет связан».
theological_decisions:
- issue: Нравственная причинность и образ пленения
  choice: Нечестивого улавливают его собственные беззакония, а его грех становится путами, которые его удерживают.
  alternative: Общее утверждение о последствиях дурных поступков без олицетворённого образа западни и пут.
  rationale: Подлежащее первой части — собственные беззакония нечестивого, а во второй грех представлен средством удержания. Перевод сохраняет эту образность и причинную связь, не уточняя механизм суда и не вводя дополнительных доктринальных выводов.
translation_notes:
  register: Современный литературный русский с достоинством, свойственным библейской мудрости. Синтаксический параллелизм оригинала сохранён; архаизирующее «уловят» оправдано точностью образа и остаётся понятным современному читателю.
