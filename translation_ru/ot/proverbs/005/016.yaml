base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/016.yaml
  text: Should your springs be scattered abroad[b][a], streams of water in the streets?
translation:
  language: ru
  text: Разве твои источники должны разливаться вовне[a], а потоки воды — течь по улицам?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Пусть твои источники разливаются вовне, а потоки воды текут по улицам». Еврейскую форму можно понять и так, однако общий контекст убедительно указывает на риторический вопрос.'
    reason: alternative_reading
  - marker: b
    text: В контексте супружеской верности образ воды метафорически относится к сексуальной силе мужчины и его потомству (см. Притч 5:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: יָפ֣וּצוּ
  choice: разве должны… растекаться
  rationale: Qal глагола פוץ передаёт рассеивание или растекание. В контексте наставления о супружеской верности риторический вопрос естественнее положительного пожелания и сохраняет образ воды.
- source_word: מַעְיְנֹתֶיךָ
  choice: твои источники
  rationale: מַעְיָן означает источник или родник. «Источники» звучит естественно по-русски и сохраняет метафорическую многозначность образа.
- source_word: חוּצָה
  choice: наружу
  rationale: Наречие указывает на движение вовне, за пределы своего места; «наружу» поддерживает противопоставление частного и общественного пространства.
- source_word: בָּרְחֹבוֹת
  choice: по улицам
  rationale: רְחֹבוֹת обозначает широкие общественные места, улицы или площади. «По улицам» естественно сочетается с глаголом движения и передаёт публичное пространство.
- source_word: פַּלְגֵי מָיִם
  choice: потоки воды
  rationale: פֶּלֶג может обозначать поток, русло или водный канал. «Потоки воды» ясно и поэтично сохраняет параллелизм с «источниками».
theological_decisions:
- issue: Высказывание, пожелание или риторический вопрос в наставлении о супружеской верности
  choice: 'Риторический вопрос: «Разве должны твои источники растекаться…?»'
  alternative: 'Формально возможное пожелание или побуждение: «Пусть твои источники растекаются…»; также возможна передача как утверждения.'
  rationale: В Притч 5:15–17 речь направлена к исключительной супружеской верности, а следующий стих требует, чтобы воды принадлежали человеку одному. Поэтому риторический вопрос лучше всего передаёт ход мысли, не устраняя формальную неоднозначность еврейской формы, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и водной метафоры. Риторическая частица «разве» ясно выражает подразумеваемый отрицательный ответ; порядок маркеров [a], [b] соответствует их месту в русском тексте.
