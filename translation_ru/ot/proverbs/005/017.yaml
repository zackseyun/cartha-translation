  text: Let them be for you alone[a], and not for strangers with you.
translation:
  language: ru
  text: Пусть они принадлежат тебе одному[a], а не чужим вместе с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть они будут только твоими, а не принадлежат чужим вместе с тобой». Стих продолжает образ источников и потоков из предыдущего контекста и подчёркивает исключительную супружескую верность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Пусть они принадлежат
  rationale: Имперфект Qal 3-го лица множественного числа в контексте наставления имеет волитивный оттенок; конструкция с «пусть» естественно передаёт побуждение.
- source_word: לְךָ
  choice: тебе
  rationale: Предлог ל с местоименным суффиксом выражает здесь принадлежность или предназначенность; вместе с «принадлежат» это передано естественным русским оборотом.
- source_word: לְבַדֶּךָ
  choice: одному
  rationale: Выражение означает «только тебе, тебе одному» и подчёркивает исключительность.
- source_word: וְאֵין
  choice: и пусть … не
  rationale: Отрицательная бытийная конструкция образует параллельный запрет; в русском волитивная форма сохраняет связь с первой половиной стиха.
- source_word: לְזָרִים
  choice: чужие
  rationale: В данном контексте זָרִים — посторонние, не имеющие права участвовать в супружеской близости, а не люди иной национальности.
- source_word: אִתָּךְ
  choice: с тобой
  rationale: Предлог выражает совместность; «с тобой» прямо передаёт еврейскую конструкцию.
theological_decisions:
- issue: Исключительность в метафоре источников и потоков
  choice: Сохранена отсылка местоимения «они» к образам предыдущего контекста, а исключительность выражена словами «тебе одному».
  alternative: Раскрыть метафору как прямое указание на супружескую верность.
  rationale: Сам стих продолжает образную речь и не называет супружеские отношения прямо; перевод не должен устранять эту образность или сужать референцию сверх текста.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная конструкция сохраняет наставительный тон и образную связь с предыдущими стихами.
