  yaml_path: translation/ot/proverbs/005/020.yaml
  text: Why[a], my son[b], should you go astray with a strange woman and embrace the bosom of a foreign woman?
translation:
  language: ru
  text: Зачем же тебе, сын мой, опьяняться[a] чужой женщиной[b] и обнимать грудь посторонней женщины[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сбиваться с пути из-за чужой женщины». Еврейский глагол может передавать и заблуждение, и опьянённое, безрассудное увлечение; здесь он повторяет слово из предыдущего стиха.'
    reason: lexical_alternative
  - marker: b
    text: То есть женщиной, с которой у сына нет надлежащих брачных отношений; выражение не указывает прежде всего на её этническое происхождение.
    reason: contextual_clarification
  - marker: c
    text: 'Еврейское слово может означать «грудь» или «лоно»; также возможно: «грудь чужеземки». В данном контексте речь идёт о женщине со стороны, не принадлежащей к допустимым брачным отношениям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Зачем же тебе
  rationale: Риторический вопрос выражает не просьбу назвать причину, а предостережение; «зачем же тебе» естественно передаёт увещевательную силу.
- source_word: תִשְׁגֶּה
  choice: опьяняться
  rationale: Глагол может означать как блуждание и заблуждение, так и упоение или безрассудное увлечение. В ближайшем контексте он повторяет формулировку Притч 5:19 об упоении любовью жены, поэтому «опьяняться» сохраняет намеренный контраст и образ.
- source_word: בְנִי
  choice: сын мой
  rationale: Сохраняет притяжательный суффикс первого лица и традиционную рамку отцовского наставления.
- source_word: זָרָה
  choice: чужая женщина
  rationale: В данном контексте речь идёт о женщине вне надлежащих брачных отношений. Русское «чужая женщина» ясно передаёт эту реляционную и нравственную чуждость, не сводя её к этническому происхождению.
- source_word: תְחַבֵּק
  choice: обнимать
  rationale: Прямой и естественный эквивалент, уместный для конкретного интимного образа.
- source_word: חֵק
  choice: грудь
  rationale: Слово обозначает грудь или лоно — область близкого объятия. «Грудь» сохраняет телесную конкретность образа без архаизации.
- source_word: נָכְרִיָּה
  choice: посторонняя
  rationale: Слово может обозначать чужеземку или женщину со стороны. Субстантивированное «посторонняя» сохраняет отличие от זָרָה и в этом контексте не создаёт ошибочного впечатления, будто предостережение направлено прежде всего против иной этнической принадлежности.
theological_decisions:
- issue: Как передать парные обозначения זָרָה и נָכְרִיָּה в предостережении о недозволенной связи
  choice: «чужая женщина» / «посторонняя»
  alternative: «чужеземка» / «иноплеменница» или одинаковое «чужая женщина» в обеих строках
  rationale: Выбранная пара сохраняет лексическое различие и поэтический параллелизм, но не превращает нравственно-брачное предостережение в запрет, основанный исключительно на этническом происхождении.
- issue: Значение תִשְׁגֶּה и связь с Притчами 5:19
  choice: «опьяняться»
  alternative: «сбиваться с пути»
  rationale: Оба значения лексически возможны, однако повтор того же глагола из предыдущего стиха создаёт контраст между упоением любовью жены и увлечением посторонней женщиной. Основной текст сохраняет этот образ, а примечание указывает на альтернативу.
translation_notes:
  register: Современный литературный русский с сохранением образной речи еврейской поэзии. Обращение «сын мой» оставлено в естественном для жанра наставления порядке. «Опьяняться» поддерживает словесную связь с предыдущим стихом; примечание сохраняет смысловую неоднозначность глагола.
