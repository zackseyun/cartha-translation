  text: הַרְחֵ֣ק מֵ/עָלֶ֣י/הָ דַרְכֶּ֑/ךָ וְ/אַל תִּ֝קְרַ֗ב אֶל פֶּ֥תַח בֵּיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/008.yaml
  text: Keep your way far from her[a], and do not go near the entrance of her house.
translation:
  language: ru
  text: Пусть твой путь будет в стороне от неё[a], и не приближайся ко входу в её дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Держись от неё подальше и не подходи к дверному проёму её дома».'
    reason: 'Лексико-синтаксическая альтернатива: הַרְחֵק допускает идиоматичную передачу «держись подальше», не воспроизводящую דַּרְכֶּךָ отдельным словом; פֶּתַח может означать «дверной проём».'
lexical_decisions:
- source_word: הַרְחֵק
  choice: Держи ... подальше
  rationale: Побудительная форма породы hифиль от רחק выражает требование сохранять расстояние; сочетание «держи свой путь подальше» передаёт и причинительный оттенок, и образ пути.
- source_word: מֵעָלֶיהָ
  choice: от неё
  rationale: Предложное сочетание обозначает удаление от её близости или сферы; направление удаления естественно передаётся словами «от неё».
- source_word: דַרְכֶּךָ
  choice: свой путь
  rationale: דֶּרֶךְ означает буквальный или переносный путь. «Свой путь» сохраняет характерный для литературы мудрости образ жизненного поведения.
- source_word: וְאַל תִּקְרַב
  choice: и не приближайся
  rationale: Отрицательная форма выражает запрет. «Не приближайся» точно и естественно передаёт движение к опасному месту.
- source_word: אֶל פֶּתַח
  choice: ко входу
  rationale: פֶּתַח обозначает отверстие, вход или дверной проём. «Вход» сохраняет пространственный смысл, не сужая его до самой двери.
- source_word: בֵּיתָהּ
  choice: в её дом
  rationale: בַּיִת конкретно обозначает дом; русское управление в сочетании «вход в дом» требует винительного падежа.
