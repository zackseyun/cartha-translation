source:
  edition: WLC
  text: יְהִֽי מְקוֹרְ/ךָ֥ בָר֑וּךְ וּ֝/שְׂמַ֗ח מֵ/אֵ֥שֶׁת נְעוּרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/018.yaml
  text: Let your fountain be blessed[a], and rejoice in the wife of your youth.
translation:
  language: ru
  text: Да будет благословен твой источник[a], и радуйся жене своей юности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твой родник». В еврейском тексте сохраняется водный образ, который может подразумевать как источник жизни, так и супружескую плодовитость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Да будет
  rationale: Юссив глагола היה выражает пожелание с оттенком побуждения; «да будет» точно передаёт эту силу и уместно звучит в возвышенной речи.
- source_word: מְקוֹרְךָ
  choice: твой источник
  rationale: מָקוֹר обозначает источник или родник. «Источник» сохраняет водный образ контекста и допускает подразумеваемую связь с жизнью и супружеской плодовитостью, не конкретизируя её сверх текста.
- source_word: בָרוּךְ
  choice: благословен
  rationale: Прямо передаёт пассивно-адъективное значение и сохраняет присущий мудростной литературе религиозный оттенок.
- source_word: וּשְׂמַח
  choice: и радуйся
  rationale: Императив продолжает побуждение; «радуйся» естественно и ёмко выражает положительный призыв к супружеской радости.
- source_word: מֵאֵשֶׁת
  choice: жене
  rationale: Предлог מן после שׂמח может указывать на источник или объект радости. Русское управление «радоваться кому» естественно передаёт направленность радости на жену, не сводя выражение только к причине или совместному действию.
- source_word: נְעוּרֶיךָ
  choice: своей юности
  rationale: Устойчивое еврейское выражение означает жену, с которой человек соединился в молодости; буквальная формулировка ясна по-русски и сохраняет образ оригинала.
theological_decisions:
- issue: Смысл образа «источника»
  choice: Сохранён метафорический «источник» без явного отождествления с женой, потомством или мужской плодовитостью.
  alternative: 'Передать образ толкованием: «пусть твой брак будет благословен» или прямо связать его с плодовитостью.'
  rationale: Еврейский текст в контексте супружеской любви допускает сексуальные и репродуктивные ассоциации, однако не раскрывает метафору однозначно; перевод сохраняет эту содержательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified формой наставления. Оборот «да будет» сохраняет юссивный оттенок пожелания и побуждения; «жене своей юности» воспроизводит библейский образ без архаизации остальной фразы.
