translation:
  language: ru
  text: чтобы ты сохранял рассудительность[a], а твои уста берегли знание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоразумие», «здравомыслие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: чтобы ты хранил
  rationale: Инфинитив с לְ в данном контексте выражает цель, продолжая наставление предыдущего стиха; «чтобы ты хранил» естественно передаёт и целевое отношение, и значение שמר.
- source_word: מְזִמּוֹת
  choice: рассудительность
  rationale: В положительном контексте литературы мудрости слово обозначает благоразумную способность обдумывать поступки, а не дурные замыслы. «Рассудительность» понятно современному читателю и не сужает смысл до конкретных планов.
- source_word: וְדַעַת
  choice: знание
  rationale: Прямой русский эквивалент сохраняет характерную для Притчей лексику нравственного и практического знания, не подменяя её более узким «пониманием».
- source_word: שְׂפָתֶיךָ
  choice: твои уста
  rationale: Сохранён конкретный образ губ как органа речи. «Уста» естественны в современном литературном русском библейского регистра и позволяют не заменять метонимию толкованием «твоя речь».
- source_word: יִנְצֹרוּ
  choice: оберегали
  rationale: 'Глагол передаёт защитное значение נצר и отличает его от ранее употреблённого שמר («хранил»). Форма согласована с целевой конструкцией: «чтобы… хранил и… оберегали».'
