lexical_decisions:
- source_word: פֶּן
  choice: чтобы… не
  rationale: Вводит предостережение о нежелательном последствии; эта конструкция естественна в современном русском и сохраняет предупредительную силу стиха.
- source_word: יִשְׂבְּעוּ
  choice: насытились
  rationale: Глагол обозначает насыщение или полное удовлетворение; «насытились» сохраняет образ того, как другие пользуются достоянием адресата.
- source_word: זָרִים
  choice: чужие
  rationale: Передаёт людей вне своего семейного и близкого круга и не сужает смысл до иностранцев в современном национальном понимании.
- source_word: כֹּחֶךָ
  choice: твоей силой
  rationale: Сохраняет прямое значение «сила, мощь, способность» и не сводит его без необходимости только к богатству, хотя контекст допускает значение ресурсов или достатка.
- source_word: וַעֲצָבֶיךָ
  choice: твои труды
  rationale: Слово может обозначать тягостный труд, усилия или добытое ими имущество. «Труды» сохраняет эту смысловую широту; возможное значение результата труда пояснено в сноске.
- source_word: בְּבֵית
  choice: не достались дому
  rationale: В еврейском втором полустишии глагол опущен; по контексту подразумевается, что плоды труда оказываются в чужом доме. «Достались дому» естественно выражает этот перенос по-русски.
- source_word: נָכְרִי
  choice: постороннего
  rationale: Обозначает чужого, не принадлежащего к своему кругу человека. «Постороннего» сохраняет отличие от собирательного «чужие» в первой строке и избегает неоправданно узкого этнического оттенка.
