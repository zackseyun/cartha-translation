  text: אִֽישׁ חָכָ֗ם נִ֭שְׁפָּט אֶת אִ֣ישׁ אֱוִ֑יל וְ/רָגַ֥ז וְ֝/שָׂחַ֗ק וְ/אֵ֣ין נָֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/009.yaml
  text: If a wise man has a dispute with a foolish man[a], whether he rages or laughs[b], there is no rest.
translation:
  language: ru
  text: Если мудрый человек вступает в спор с глупцом[a], будь то гнев или смех[b] — покоя нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если мудрый человек судится с глупцом». Еврейское выражение может обозначать как спор, так и судебную тяжбу.'
    reason: alternative_reading
  - marker: b
    text: Смех здесь может означать насмешку или издевательский хохот. В еврейском тексте прямо не сказано, кто именно гневается и смеётся — мудрый человек или глупец; многие толкователи считают, что речь идёт о глупце.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: אִישׁ חָכָם
  choice: мудрый человек
  rationale: Передаёт мужскую форму единственного числа, но звучит естественно по-русски и допускает обобщающий смысл, обычный для притчей.
- source_word: נִשְׁפָּט אֶת
  choice: вступает в спор с
  rationale: Форма нифаль здесь обозначает тяжбу или состязание сторон. Перевод сохраняет противостояние, не сужая смысл до судебного разбирательства.
- source_word: אִישׁ אֱוִיל
  choice: глупцом
  rationale: «Глупец» — естественное и устойчивое обозначение нравственно неразумного человека в литературе мудрости.
- source_word: וְרָגַז
  choice: гневается
  rationale: Глагол выражает сильное возбуждение и гнев; «гневается» передаёт основной смысл без излишнего усиления.
- source_word: וְשָׂחַק
  choice: смеётся
  rationale: Сохранено основное значение глагола. Возможный оттенок насмешки отмечен в сноске.
- source_word: וְאֵין נָחַת
  choice: покоя нет
  rationale: Кратко и естественно передаёт отсутствие спокойствия, передышки или благополучного разрешения спора.
theological_decisions:
- issue: Кто именно гневается или смеётся
  choice: Сохранена неоднозначность с помощью местоимения «он».
  alternative: 'Явно назвать глупца субъектом: «глупец то гневается, то смеётся».'
  rationale: В еврейском тексте субъект этих глаголов прямо не назван. Хотя контекст часто понимают как указание на глупца, перевод не должен устранять подлинную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и афористичная. Инверсия «покоя нет» сохраняет выразительное завершение стиха.
