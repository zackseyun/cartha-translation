  text: Do you see a man who is hasty in his words? There is more hope for a fool than for him[a].
translation:
  language: ru
  text: Видел ли ты человека, опрометчивого в словах? На глупца больше надежды, чем на него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Видел ты человека, опрометчивого в словах: на глупца больше надежды, чем на него». Начальный глагол в форме перфекта можно понимать либо как риторический вопрос, либо как утвердительное наблюдение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: Видел ли ты
  rationale: Qal perfect, 2-е лицо мужского рода единственного числа, допускает здесь риторический вопрос-наблюдение. Прошедшее время непосредственно передаёт форму еврейского глагола и естественно звучит в русском языке.
- source_word: אִישׁ
  choice: человека
  rationale: Передаёт существительное мужского рода в его обобщённо-представительном употреблении, не делая пол персонажа смысловым акцентом.
- source_word: אָץ
  choice: поспешного
  rationale: Причастие обозначает того, кто действует с чрезмерной поспешностью; в сочетании с «в своих словах» речь идёт о необдуманной речи.
- source_word: בִּדְבָרָיו
  choice: в своих словах
  rationale: Близко воспроизводит еврейскую конструкцию и по-русски ясно указывает на поспешность в речи.
- source_word: תִּקְוָה
  choice: надежды
  rationale: Обычное значение существительного; в данном контексте подразумевается надежда на исправление или благоприятный исход, без необходимости уточнять это в тексте.
- source_word: לִכְסִיל
  choice: на глупца
  rationale: «Глупец» — устойчивый термин литературы мудрости, обозначающий не только недостаток ума, но и нравственную невосприимчивость.
- source_word: מִמֶּנּוּ
  choice: чем на него
  rationale: Предлог מן выражает сравнение; русская конструкция «больше надежды, чем на него» естественно передаёт сравнительный смысл.
