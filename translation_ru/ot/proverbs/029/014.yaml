source:
  edition: WLC
  text: מֶ֤לֶךְ שׁוֹפֵ֣ט בֶּֽ/אֱמֶ֣ת דַּלִּ֑ים כִּ֝סְא֗/וֹ לָ/עַ֥ד יִכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/014.yaml
  text: A king who judges the poor with truth—his throne will be established forever[a].
translation:
  language: ru
  text: Царь, который по правде судит бедных, — его престол утвердится навеки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верно судит бедных»; или: «справедливо судит бедных». Еврейское выражение «по правде» может указывать на правдивость, верность или справедливость при вынесении суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: Царь
  rationale: Неопределённая форма в иврите выражает общее правило; русское «царь» без указательного слова естественно передаёт родовое значение и сохраняет конкретный образ монарха.
- source_word: שׁוֹפֵט
  choice: который… судит
  rationale: Причастие характеризует царя; придаточное с «который» естественно в современном русском и сохраняет судебный смысл глагола.
- source_word: בֶּאֱמֶת
  choice: по правде
  rationale: Выражение сохраняет связь с אֱמֶת — «истина, верность, надёжность» — и в контексте суда допускает оттенок справедливого и нелицеприятного разбирательства, не сводя значение только к юридической справедливости.
- source_word: דַּלִּים
  choice: бедных
  rationale: דַּל обозначает бедного, слабого или социально беспомощного; «бедных» наиболее прямо и естественно подходит к теме царского суда.
- source_word: כִּסְאוֹ
  choice: его престол
  rationale: Сохранён конкретный образ престола, который также метонимически обозначает царскую власть.
- source_word: לָעַד
  choice: навеки
  rationale: Передаёт продолжительность и устойчивость, выраженные לָעַד, в традиционно возвышенном, но понятном русском обороте.
- source_word: יִכּוֹן
  choice: утвердится
  rationale: Форма Niphal от כון означает «быть утверждённым, стать прочным»; русский возвратный глагол хорошо передаёт результирующую устойчивость престола.
theological_decisions:
- issue: Сила выражения לָעַד в литературе мудрости
  choice: «навеки» как формула долговечной и прочной царской власти
  alternative: «надолго» или «будет стоять прочно»
  rationale: Буквальное временное выражение следует сохранить, не превращая жанровое изречение в техническое метафизическое обещание абсолютной бесконечности.
- issue: Значение בֶּאֱמֶת применительно к суду
  choice: «по правде» с сохранением диапазона истины, верности и справедливости
  alternative: «справедливо» или «верно»
  rationale: Более узкое «справедливо» ясно выражает судебное следствие, но устраняет многозначность אֱמֶת; «по правде» сохраняет исходное напряжение и естественно звучит по-русски.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Синтаксис краток и афористичен; «престол» и «навеки» сохраняют достоинство и образность оригинала без архаизации всего стиха.
