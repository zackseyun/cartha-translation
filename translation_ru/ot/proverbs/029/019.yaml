source:
  edition: WLC
  text: בִּ֭/דְבָרִים לֹא יִוָּ֣סֶר עָ֑בֶד כִּֽי יָ֝בִ֗ין וְ/אֵ֣ין מַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/019.yaml
  text: A servant is not corrected by words alone[a], for though he understands[b], there is no response.
translation:
  language: ru
  text: 'Одними словами раба не исправить[a]: хотя он и понимает, ответа нет[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское עֶבֶד может означать как раба, так и слугу. Здесь слово «раб» сохраняет выраженное в контексте подчинённое положение.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он понимает, но не отвечает». Последние слова могут означать как отсутствие словесного ответа, так и отсутствие должного отклика в действиях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְבָרִים
  choice: одними словами
  rationale: 'Предлог בְּ передаёт средство воздействия. Слово «одними» явно выражает подразумеваемое противопоставление: словесного наставления самого по себе недостаточно.'
- source_word: יִוָּסֶר
  choice: не исправить
  rationale: Нифаль глагола יסר означает подвергаться наставлению, исправлению или дисциплинарному воздействию. Безличная конструкция «не исправить» естественна по-русски и сохраняет практический смысл изречения, не сводя его только к наказанию.
- source_word: עָבֶד
  choice: раба
  rationale: עֶבֶד может обозначать слугу или раба; здесь отношения подчинения и власти существенны, поэтому «раб» точнее сохраняет социальный статус, выраженный еврейским словом.
- source_word: כִּי יָבִין
  choice: хотя он и понимает
  rationale: כִּי вводит обоснование, а сочетание понимания с отсутствием ответа создаёт уступительный оттенок. Русская конструкция «хотя… и» естественно передаёт эту логику.
- source_word: וְאֵין מַעֲנֶה
  choice: ответа нет
  rationale: Именная конструкция буквально означает «и нет ответа». Такой перевод сохраняет открытым вопрос, идёт ли речь о словесном ответе или о должном отклике в поступках.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая афористичная форма соответствует жанру притчи. Двоеточие делает причинно-пояснительную связь ясной, а формулировка «ответа нет» сохраняет смысловую неоднозначность оригинала.
