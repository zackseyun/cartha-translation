- source_word: אִישׁ
  choice: Муж
  rationale: Существительное стоит в мужском роде и единственном числе, представляя типичного человека в форме краткого изречения; «муж» сохраняет форму оригинала и соответствует возвышенному, но понятному регистру Притч.
- source_word: אֹהֵב חָכְמָה
  choice: любящий мудрость
  rationale: Причастие обозначает устойчивую черту человека, а חָכְמָה прямо означает «мудрость», без необходимости сужать смысл до наставления.
- source_word: יְשַׂמַּח אָבִיו
  choice: радует своего отца
  rationale: 'Порода пиэль передаёт каузативный смысл: такой человек доставляет отцу радость. Возвратное «своего» естественно уточняет принадлежность в русском языке.'
- source_word: וְרֹעֶה זֹנוֹת
  choice: а тот, кто водится с блудницами
  rationale: Буквально רעה связано с выпасом или кормлением, но в данном сочетании выражает постоянное общение либо связь. «Водится с» естественно передаёт неодобрительный идиоматический смысл; «блудницы» — традиционное и понятное обозначение женщин, занимающихся проституцией.
- source_word: יְאַבֶּד הוֹן
  choice: расточает богатство
  rationale: Пиэль יְאַבֶּד означает губить или доводить до утраты; применительно к богатству русское «расточает» ясно передаёт его постепенную разорительную потерю, тогда как буквальное «уничтожает» звучит менее естественно.
