  text: מֹ֭שֵׁל מַקְשִׁ֣יב עַל דְּבַר שָׁ֑קֶר כָּֽל מְשָׁרְתָ֥י/ו רְשָׁעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/012.yaml
  text: If a ruler listens to a lying word, all his servants become wicked.
translation:
  language: ru
  text: Если правитель прислушивается к лживому слову, все его слуги нечестивы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹשֵׁל
  choice: правитель
  rationale: Передаёт общее обозначение властвующего лица без неоправданного сужения до царя.
- source_word: מַקְשִׁיב עַל דְּבַר שָׁקֶר
  choice: прислушивается ко лжи
  rationale: Естественно по-русски выражает внимательное, благосклонное слушание ложных речей; דְּבַר שָׁקֶר буквально означает «ложное слово/высказывание».
- source_word: מְשָׁרְתָיו
  choice: его слуги
  rationale: Сохраняет значение людей, состоящих при правителе и служащих ему; по контексту возможно понимание как придворных или чиновников.
- source_word: רְשָׁעִים
  choice: нечестивыми
  rationale: Передаёт нравственно-религиозную оценку еврейского слова сильнее, чем нейтральное «плохими».
theological_decisions:
- issue: Именная конструкция «все его слуги — нечестивые» допускает характеристику состояния или подразумеваемый результат влияния правителя.
  choice: становятся нечестивыми
  alternative: нечестивы
  rationale: В контексте причинно-следственной сентенции выражено развращающее воздействие правителя; «становятся» делает эту связь явной, не вводя конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма сохранена. «Прислушивается» передаёт не случайное слушание, а готовность принимать ложь.
