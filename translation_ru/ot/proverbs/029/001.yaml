  text: אִ֣ישׁ תּ֭וֹכָחוֹת מַקְשֶׁה עֹ֑רֶף פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/001.yaml
  text: A man often reproved[a], who stiffens his neck, will suddenly be broken beyond healing.
translation:
  language: ru
  text: Человек, которого часто обличают[a], но который остаётся непреклонным, внезапно будет сломлен, и исцеления не будет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Человек, которого много раз обличали, но который упорно противится, внезапно будет сломлен, и исцеления не будет». Буквально: «человек обличений, делающий свою шею жёсткой».'
    reason: Передаёт альтернативную, более близкую к еврейской именную конструкцию и поясняет телесный образ מַקְשֶׁה עֹרֶף без неестественной русской кальки.
lexical_decisions:
- source_word: אִישׁ
  choice: человек
  rationale: Существительное стоит в мужском роде и единственном числе, но в изречении обозначает любого человека; русский вариант «человек» точно передаёт эту обобщённость и остаётся естественным.
- source_word: תּוֹכָחוֹת
  choice: которого часто обличают
  rationale: Форма множественного числа указывает на неоднократные обличения. Такая передача естественно выражает смысл еврейской конструкции «человек обличений».
- source_word: מַקְשֶׁה עֹרֶף
  choice: но который остаётся непреклонным
  rationale: Буквально выражение описывает человека, «делающего шею жёсткой», то есть упорно сопротивляющегося исправлению. «Остаётся непреклонным» передаёт идиоматический смысл современным литературным русским; союз «но» выявляет подразумеваемое противопоставление многократным обличениям.
- source_word: פֶּתַע
  choice: внезапно
  rationale: Наречие обозначает неожиданность и стремительность наступающего перелома или бедствия.
- source_word: יִשָּׁבֵר
  choice: будет сломлен
  rationale: Страдательная форма глагола שׁבר буквально означает «будет сломан». «Будет сломлен» сохраняет образ и не уточняет без основания, идёт ли речь о физической, общественной или нравственной гибели.
- source_word: וְאֵין מַרְפֵּא
  choice: и исцеления не будет
  rationale: Передача близка к буквальному значению «и нет исцеления/средства исцелить» и сохраняет окончательность последствий.
