lexical_decisions:
- source_word: שֵׁבֶט
  choice: розга
  rationale: В контексте воспитания слово обозначает конкретное орудие телесного наказания; «розга» сохраняет образ и звучит естественно в русском тексте премудрости.
- source_word: וְתוֹכַחַת
  choice: и обличение
  rationale: Существительное обозначает словесное указание на проступок, порицание или исправляющий укор; «обличение» передаёт словесную сторону воспитания и образует ясную пару с «розгой».
- source_word: יִתֵּן חָכְמָה
  choice: дают мудрость
  rationale: Простая конструкция буквально означает «даёт мудрость». Русское множественное число согласует сказуемое с двумя соединёнными средствами воспитания.
- source_word: נַעַר
  choice: мальчик
  rationale: В данном семейно-воспитательном контексте слово указывает на сына, ещё находящегося под родительским попечением; мужской род оригинала сохранён.
- source_word: מְשֻׁלָּח
  choice: оставленный без присмотра
  rationale: Страдательное причастие от שלח буквально связано со значением «отпущенный, предоставленный самому себе». Выбранная формулировка естественна по-русски и не устраняет возможные оттенки отсутствия надзора и дисциплины.
- source_word: מֵבִישׁ
  choice: позорит
  rationale: Причастие породы хифиль выражает причинение стыда или позора. Краткий глагол сохраняет сжатость пословицы и причинный смысл.
- source_word: אִמּוֹ
  choice: свою мать
  rationale: Суффикс третьего лица мужского рода относится к мальчику; возвратное притяжательное местоимение «свою» естественно передаёт эту связь по-русски.
