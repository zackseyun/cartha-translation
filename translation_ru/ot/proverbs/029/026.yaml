  text: רַ֭בִּים מְבַקְשִׁ֣ים פְּנֵי מוֹשֵׁ֑ל וּ֝/מֵ/יְהוָ֗ה מִשְׁפַּט אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/026.yaml
  text: Many seek the face of a ruler, but from the LORD comes a man's justice.
translation:
  language: ru
  text: Многие ищут благосклонности правителя, но правосудие для человека — от ГОСПОДА.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקְשִׁים פְּנֵי מוֹשֵׁל
  choice: ищут благосклонности правителя
  rationale: Буквально «ищут лица правителя»; в данном контексте идиома означает добиваться приёма, расположения или благосклонности властителя. Естественный русский перевод передаёт смысл без неясного буквализма.
- source_word: מִשְׁפַּט אִישׁ
  choice: справедливый суд для человека
  rationale: מִשְׁפָּט может обозначать суд, судебное решение, правосудие или справедливость. Формулировка сохраняет судебный оттенок и мысль о справедливом решении дела отдельного человека.
- source_word: מֵיְהוָה
  choice: от ГОСПОДА
  rationale: Предлог מִן указывает на источник; тетраграмматон передан традиционным типографически выделенным «ГОСПОДЬ» в косвенном падеже.
theological_decisions:
- issue: Соотношение человеческой власти и Божьего правосудия
  choice: Стих противопоставляет поиски благосклонности земного правителя источнику справедливого суда — ГОСПОДУ.
  alternative: «Но решение о человеке — от ГОСПОДА», без явного указания на справедливость.
  rationale: Контекст пословицы подчёркивает, что окончательное и справедливое разрешение дела зависит не просто от влиятельного человека, а от Бога; при этом перевод не утверждает конкретного механизма Божьего действия.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура оригинала сохранена. «Благосклонность» естественно раскрывает древнееврейскую идиому, а «справедливый суд» удерживает смысловую широту מִשְׁפָּט между судебным решением и правосудием.
