base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/022.yaml
  text: An angry man stirs up strife[b][a], and a hot-tempered man abounds in transgression.
translation:
  language: ru
  text: Гневливый человек разжигает раздор, а вспыльчивый человек совершает множество грехов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «велик во грехе»; возможно также: «умножает грехи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אַף
  choice: гневливый человек
  rationale: Еврейское сочетание буквально означает «человек гнева» и характеризует человека, склонного к гневу; «гневливый человек» естественно и точно передаёт эту устойчивую черту.
- source_word: יְגָרֶה
  choice: разжигает
  rationale: Глагол означает «возбуждать, разжигать, провоцировать»; в сочетании с раздором «разжигает» звучит естественно и сохраняет образную силу.
- source_word: מָדוֹן
  choice: раздор
  rationale: Существительное обозначает распрю, ссору или раздор; «раздор» краток, понятен и уместен в изречении мудрости.
- source_word: בַעַל חֵמָה
  choice: вспыльчивый
  rationale: Буквально «обладатель ярости»; идиома описывает человека, которому свойствен горячий, необузданный гнев. Субстантивированное «вспыльчивый» естественно продолжает параллелизм.
- source_word: רַב
  choice: умножает
  rationale: В сочетании с פָּשַׁע допускает понимание как «имеет множество преступлений / изобилует преступлениями», так и «умножает преступления». Выбранный глагольный вариант естествен по-русски, а смысловая неоднозначность отмечена в сноске.
- source_word: פָּשַׁע
  choice: преступления
  rationale: Слово обозначает серьёзное нарушение, преступление или мятеж; «преступления» сохраняет нравственную тяжесть и не сужает значение до политического бунта.
theological_decisions:
- issue: Синтаксическое значение רַב פָּשַׁע
  choice: умножает преступления
  alternative: много преступает; изобилует преступлениями
  rationale: Краткая еврейская конструкция допускает оттенок как многочисленности проступков, так и их умножения. Основной текст передаёт деятельный оттенок, а сноска сохраняет альтернативное прочтение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Параллелизм двух полустиший сохранён; идиоматические определения передают устойчивую гневливость, не вводя конфессионально окрашенной терминологии.
