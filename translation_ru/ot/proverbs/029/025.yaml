  text: חֶרְדַּ֣ת אָ֭דָם יִתֵּ֣ן מוֹקֵ֑שׁ וּ/בוֹטֵ֖חַ בַּ/יהוָ֣ה יְשֻׂגָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/025.yaml
  text: The fear of man lays a snare[b][a], but whoever trusts in Yahweh will be set on high.
translation:
  language: ru
  text: Страх перед людьми ставит западню[a], а тот, кто полагается на Яхве, будет в безопасности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Страх перед человеком даёт западню». Смысл в том, что страх перед людьми сам становится ловушкой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет защищён». Буквально: «будет вознесён на недосягаемую высоту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְדַּת אָדָם
  choice: страх перед людьми
  rationale: Сочетание означает страх или трепет перед человеком, то есть перед другими людьми. Множественное число естественно передаёт по-русски обобщённое значение אָדָם и не сужает смысл до одного мужчины.
- source_word: יִתֵּן מוֹקֵשׁ
  choice: ставит западню
  rationale: Буквально — «даёт западню». Русское «ставит западню» сохраняет образ силка или ловушки и естественно выражает мысль о том, что страх перед людьми сам становится причиной порабощения.
- source_word: וּבוֹטֵחַ
  choice: а доверяющий
  rationale: Причастие употреблено как существительное и обозначает всякого, кто доверяет. Форма «доверяющий» сохраняет краткий параллелизм еврейской пословицы.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом «Господь».
- source_word: יְשֻׂגָּב
  choice: будет в безопасности
  rationale: Глагол буквально рисует человека поднятым на недоступную высоту и потому защищённым. В основном тексте передан подразумеваемый результат; исходный пространственный образ отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» прямо сохраняет его как имя и не превращает в титул.
- issue: Характер обещания в יְשֻׂגָּב
  choice: будет в безопасности
  alternative: будет поднят на высоту; будет защищён
  rationale: Контраст противопоставляет западню безопасности доверяющего Яхве. Перевод не уточняет способ или обстоятельства защиты сверх метафорического значения еврейского глагола; буквальный образ сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Западня» сохраняет выразительный образ מוֹקֵשׁ, а «доверяющий» поддерживает параллелизм без ненужного гендерного ограничения.
