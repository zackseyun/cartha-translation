  text: אַנְשֵׁ֣י לָ֭צוֹן יָפִ֣יחוּ קִרְיָ֑ה וַ֝/חֲכָמִ֗ים יָשִׁ֥יבוּ אָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/008.yaml
  text: Mockers inflame a city[b][a], but wise men turn away anger.
translation:
  language: ru
  text: 'Насмешники разжигают город[a],

    а мудрые[b] отвращают гнев.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспламеняют город»; еврейский глагол создаёт образ раздуваемого огня и может подразумевать возбуждение городской смуты.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово стоит во множественном числе мужского рода; возможно также: «мудрецы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לָצוֹן
  choice: насмешники
  rationale: Сочетание буквально означает «люди насмешки». Существительное «насмешники» естественно передаёт устойчивый тип человека в литературе мудрости и не добавляет оттенка кощунства.
- source_word: יָפִיחוּ
  choice: разжигают
  rationale: Каузативная форма פוח здесь метафорически описывает раздувание пламени или смуты. «Разжигают» сохраняет этот образ и в современном русском естественно указывает на возбуждение общественного конфликта.
- source_word: קִרְיָה
  choice: город
  rationale: Слово обозначает город или поселение; «город» соответствует масштабу общественных последствий в данном изречении.
- source_word: חֲכָמִים
  choice: мудрые
  rationale: Субстантивированное прилагательное во множественном числе естественно звучит по-русски и сохраняет параллель между двумя типами людей. Еврейская форма грамматически мужского рода, что отмечено в сноске.
- source_word: יָשִׁיבוּ
  choice: отвращают
  rationale: Каузатив שוב означает «поворачивать назад, отводить». «Отвращают» сохраняет идею удаления или предотвращения гнева, не уточняя сверх текста, чей именно это гнев.
- source_word: אָף
  choice: гнев
  rationale: Хотя исходное значение связано с «носом», в данном употреблении слово обычно обозначает гнев. «Гнев» ясно и достойно передаёт смысл без излишней архаичности.
theological_decisions:
- issue: Чей гнев отвращают мудрые
  choice: Не уточнять обладателя гнева
  alternative: «успокаивают гнев горожан» или «отвращают Божий гнев»
  rationale: В еврейском тексте объект אָף дан без притяжательного определения. Уточнение могло бы неоправданно разрешить сохранённую источником неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Сохранены образ разжигания и противопоставление насмешников мудрым; порядок строк следует синтаксическому параллелизму еврейского текста.
