base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/018.yaml
  text: Where there is no vision[a], a people cast off restraint[d][c][b]; but the one who keeps the law—happy is he.
translation:
  language: ru
  text: Когда нет откровения[a], народ распускается[b]; а кто соблюдает закон[c], тот счастлив[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пророческого видения». Имеется в виду откровение от Бога, а не просто человеческий замысел или цель.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «становится необузданным»; «выходит из повиновения».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «наставление».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «тот благословен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: Когда нет
  rationale: Сочетание ב с אֵין вводит общее условие или обстоятельство отсутствия; «когда нет» естественно передаёт условно-следственную форму притчи.
- source_word: חָזוֹן
  choice: откровения
  rationale: Слово обозначает пророческое видение, то есть данное Богом откровение, а не человеческий замысел или программу. «Откровение» предотвращает распространённое современное неверное понимание слова «видение».
- source_word: יִפָּרַע
  choice: распускается
  rationale: 'Нифаль глагола פרע здесь передаёт утрату сдерживающих начал: народ становится необузданным, выходит из повиновения. «Распускается» кратко и естественно выражает этот общественный смысл; значение «погибает» здесь не подтверждается.'
- source_word: עָם
  choice: народ
  rationale: Существительное имеет собирательное значение и в притче употреблено обобщённо.
- source_word: וְשֹׁמֵר
  choice: а кто соблюдает
  rationale: Причастие описывает человека по его постоянному поведению. Союз ו передан противительным «а», поскольку вторая половина противопоставлена первой.
- source_word: תּוֹרָה
  choice: наставление
  rationale: תּוֹרָה может обозначать как закон, так и авторитетное наставление. В контексте литературы мудрости «наставление» естественно сохраняет широту слова, не исключая Божьего Закона.
- source_word: אַשְׁרֵהוּ
  choice: тот счастлив
  rationale: Форма выражает мудростное провозглашение благополучия человека. Оборот «тот счастлив» сохраняет единственное число и мужскую грамматическую форму, оставаясь естественным по-русски.
theological_decisions:
- issue: Характер חָזוֹן
  choice: Божественное откровение
  alternative: Человеческое видение будущего, общественная программа или цель руководителя
  rationale: В библейском еврейском חָזוֹן обычно относится к пророческому откровению. Поэтому стих говорит не просто об отсутствии планирования или лидерской стратегии.
- issue: Объём значения תּוֹרָה
  choice: «Наставление» в основном тексте с указанием варианта «закон»
  alternative: Только Моисеев Закон либо лишь человеческое поучение
  rationale: Источник допускает более широкое значение авторитетного наставления, одновременно сохраняя связь с Божьим Законом. Перевод не должен без необходимости сужать эту смысловую напряжённость.
- issue: Значение אַשְׁרֵהוּ
  choice: «тот счастлив»
  alternative: «тот благословен»
  rationale: Формула אשר прежде всего провозглашает счастливое, достойное одобрения положение человека; «благословен» возможно, но может звучать как явное указание на отдельный акт благословения.
translation_notes:
  register: Современный литературный русский язык, краткий и афористичный строй. Точка с запятой сохраняет параллелизм и контраст двух частей. Лексика понятна широкому кругу читателей, а примечания сохраняют значимые варианты исходного текста.
