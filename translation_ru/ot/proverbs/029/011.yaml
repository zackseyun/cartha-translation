  text: כָּל ר֭וּח/וֹ יוֹצִ֣יא כְסִ֑יל וְ֝/חָכָ֗ם בְּ/אָח֥וֹר יְשַׁבְּחֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/011.yaml
  text: A fool lets out all his spirit[a], but a wise man holds it back.
translation:
  language: ru
  text: Глупец даёт выход всему своему духу[a], а мудрый удерживает его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Глупец даёт выход всему своему гневу, а мудрый унимает его и сдерживает». Еврейское слово может означать «дух», «нрав» или «гнев», а последний глагол — как сдерживание, так и успокоение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רוּחוֹ
  choice: всему своему духу
  rationale: Сохраняет общий охват כָּל и многозначный образ רוּחַ — «дух, внутреннее состояние, нрав, гнев», не сужая его в основном тексте только до вспыльчивости.
- source_word: יוֹצִיא
  choice: даёт выход
  rationale: Каузативная форма от יצא буквально передаёт выведение наружу; русское выражение естественно обозначает беспрепятственное проявление того, что внутри.
- source_word: כְסִיל
  choice: глупец
  rationale: Обычное обозначение нравственно и практически неразумного человека в литературе мудрости.
- source_word: חָכָם
  choice: мудрый
  rationale: Субстантивированное прилагательное мужского рода передано в обобщённом значении, как свойственно форме афоризма.
- source_word: בְּאָחוֹר יְשַׁבְּחֶנָּה
  choice: удерживает его
  rationale: 'Передаёт основной контраст с немедленным высвобождением духа: мудрый оставляет его позади, сдерживает. Трудный глагол может также обозначать успокоение или утишение, что отмечено в сноске.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким афористическим построением. Выражение «даёт выход» естественно передаёт образ выхода наружу, а слово «дух» сохраняет смысловую широту еврейского текста.
