  text: רָ֤שׁ וְ/אִ֣ישׁ תְּכָכִ֣ים נִפְגָּ֑שׁוּ מֵ֤אִיר עֵינֵ֖י שְׁנֵי/הֶ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/013.yaml
  text: A poor man and an oppressor meet together[b][a]; Yahweh gives light to the eyes of both of them.
translation:
  language: ru
  text: Бедняк и притеснитель[a] встречаются; Яхве даёт свет глазам обоих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек притеснений». Еврейское выражение может обозначать человека, который угнетает или корыстно эксплуатирует других; его также понимают как «лживый человек» или «ростовщик».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «даёт свет глазам» может означать, что Яхве даёт зрение или жизнь, поддерживает и просвещает.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: бедняк
  rationale: Существительное обозначает бедного, нуждающегося человека; форма единственного числа сохраняет лаконичность и парность еврейской пословицы.
- source_word: אִישׁ תְּכָכִים
  choice: притеснитель
  rationale: Трудное выражение, буквально близкое к «человеку притеснений», вероятнее всего обозначает того, кто угнетает или корыстно эксплуатирует других. «Притеснитель» естественно звучит по-русски, при этом альтернативы отмечены в сноске.
- source_word: נִפְגָּשׁוּ
  choice: встречаются друг с другом
  rationale: Нифаль глагола פגשׁ обычно означает встречу или столкновение. Перевод сохраняет конкретный образ встречи социальных противоположностей, не сводя его лишь к абстрактной общности.
- source_word: מֵאִיר
  choice: озаряет
  rationale: Порода hифиль от אור означает «давать свет, освещать». В сочетании с глазами это может подразумевать дарование зрения, жизни, бодрости или просвещения; «озаряет» сохраняет образ и его смысловую широту.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: глаза их обоих
  rationale: Передаёт конструкцию и подчёркивает, что оба человека одинаково зависят от действия Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Смысл выражения «озаряет глаза их обоих»
  choice: Сохранён образ того, что Яхве даёт обоим свет для глаз.
  alternative: Яхве даёт обоим зрение или жизнь; поддерживает их жизнь; просвещает их нравственно или духовно.
  rationale: Еврейская идиома допускает физический, жизненный и познавательный оттенки. Перевод не сужает её до одного толкования и сохраняет утверждение об одинаковой зависимости бедняка и притеснителя от Яхве.
translation_notes:
  register: Современный литературный русский язык, краткий и афористичный синтаксис. «Бедняк» и «притеснитель» образуют ясную социальную антитезу; метафора света сохранена без богословского уточнения.
