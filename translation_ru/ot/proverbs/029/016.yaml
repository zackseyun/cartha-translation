  text: בִּ/רְב֣וֹת רְ֭שָׁעִים יִרְבֶּה פָּ֑שַׁע וְ֝/צַדִּיקִ֗ים בְּֽ/מַפַּלְתָּ֥/ם יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/016.yaml
  text: When the wicked increase[a], transgression increases; but the righteous will look upon their downfall.
translation:
  language: ru
  text: Когда нечестивых становится больше, растёт беззаконие; но праведники увидят их падение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увидят их крах». Еврейское существительное может означать «падение» или «крах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת רְשָׁעִים
  choice: Когда нечестивых становится больше
  rationale: Предлог בְּ с инфинитивом רָבָה образует временно-обстоятельственный оборот. Такая формулировка естественно передаёт увеличение числа нечестивых.
- source_word: יִרְבֶּה פָּשַׁע
  choice: растёт беззаконие
  rationale: פֶּשַׁע обозначает преступление, нарушение и бунт против установленного порядка. «Беззаконие» сохраняет обобщённый смысл существительного в единственном числе, а «растёт» передаёт повтор глагола רָבָה без неестественного для русского оборота.
- source_word: וְצַדִּיקִים
  choice: но праведники
  rationale: Союз וְ в параллельной структуре имеет противительное значение, а субстантивированное צַדִּיקִים естественно передаётся словом «праведники».
- source_word: בְּמַפַּלְתָּם יִרְאוּ
  choice: увидят их падение
  rationale: Глагол רָאָה имеет основное значение «видеть», а מַפָּלָה означает падение или крах. Притяжательный суффикс передан местоимением «их».
theological_decisions:
- issue: К кому относится суффикс в слове בְּמַפַּלְתָּם («их падение»)
  choice: К нечестивым из первой части стиха
  alternative: К не названным прямо людям, которых постигнет падение
  rationale: Ближайший и наиболее связный антецедент — «нечестивые»; это чтение поддерживается противопоставлением двух частей изречения.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура книги Притч сохранена. Формулировка избегает архаичного «умножаются», оставаясь близкой к образу роста в обеих частях первой строки.
