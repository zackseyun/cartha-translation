  text: חוֹלֵ֣ק עִם גַּ֭נָּב שׂוֹנֵ֣א נַפְשׁ֑/וֹ אָלָ֥ה יִ֝שְׁמַ֗ע וְ/לֹ֣א יַגִּֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/024.yaml
  text: Whoever shares with a thief hates his own life[b][a]; he hears a curse and does not disclose it.
translation:
  language: ru
  text: 'Кто в доле с вором, тот ненавидит собственную жизнь[b]: он слышит заклятие[a], но не сообщает ничего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клятва с проклятием»; возможно, «призыв дать показания под клятвой». Еврейское слово может обозначать клятву, сопровождаемую призыванием проклятия; вероятно, речь идёт о ситуации, когда знающего обязывают сообщить правду.'
    reason: lexical_alternative
  - marker: b
    text: То есть соучастник вора действует себе во вред, поскольку не сообщает того, что ему известно.
    reason: cultural_note
lexical_decisions:
- source_word: חוֹלֵק עִם גַּנָּב
  choice: в доле с вором
  rationale: Причастие חוֹלֵק обозначает участие или совместную долю. Русское выражение «быть в доле с вором» естественно передаёт соучастие и возможное разделение краденого, не ограничивая смысл только одним конкретным действием.
- source_word: שׂוֹנֵא נַפְשׁוֹ
  choice: ненавидит собственную жизнь
  rationale: נֶפֶשׁ здесь означает жизнь или самого человека. Буквальная формулировка сохраняет резкость мудрого изречения и указывает на саморазрушительность такого поведения, не привнося представление о душе как отдельной сущности.
- source_word: אָלָה
  choice: проклятие
  rationale: Слово может обозначать проклятие, клятву с призыванием проклятия или заклятие, обязывающее свидетеля говорить. «Проклятие» сохраняет прямое лексическое значение и неоднозначность; вероятный юридический оттенок пояснён в сноске.
- source_word: יִשְׁמַע
  choice: слышит
  rationale: Перевод сохраняет простое значение глагола «слышать», не превращая возможный юридический контекст в явно выраженную в исходном тексте судебную процедуру.
- source_word: וְלֹא יַגִּיד
  choice: но ничего не сообщает
  rationale: Глагол в породе hifil означает «сообщить, объявить, рассказать». «Не сообщает» передаёт отказ раскрыть известное, не сужая значение до формального выступления в суде; «ничего» естественно восполняет подразумеваемый объект в русском языке.
theological_decisions:
- issue: Смысл выражения «ненавидит собственную жизнь»
  choice: Сохранена образная формулировка о ненависти к своей жизни.
  alternative: «Вредит самому себе» или «губит себя».
  rationale: Исходный текст говорит именно о ненависти к נֶפֶשׁ, метафорически характеризуя саморазрушительный выбор. Более объяснительный перевод устранил бы резкость и богословско-нравственное напряжение изречения.
- issue: Юридический или общий смысл אָלָה
  choice: В основном тексте сохранено «проклятие», а вероятный юридический смысл вынесен в сноску.
  alternative: «Призыв дать показания под клятвой».
  rationale: Контекст допускает судебное заклятие свидетеля, однако само слово шире. Перевод не должен делать вероятную обстановку несомненной.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Выражение «в доле с вором» понятно широкому читателю и передаёт соучастие без ненужной юридической терминологии. Двоеточие естественно связывает общее суждение с поясняющим поведением.
