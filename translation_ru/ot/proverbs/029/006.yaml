  text: בְּ/פֶ֤שַֽׁע אִ֣ישׁ רָ֣ע מוֹקֵ֑שׁ וְ֝/צַדִּ֗יק יָר֥וּן וְ/שָׂמֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/006.yaml
  text: In the transgression of an evil man there is a snare[b][a], but the righteous sings for joy and rejoices.
translation:
  language: ru
  text: В преступлении злого человека — западня[a], а праведник поёт от радости и радуется[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из-за преступления злого человека возникает западня». Еврейский предлог может указывать как на западню, заключённую в самом преступлении, так и на западню, которую это преступление навлекает.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «ликует и веселится».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: В преступлении
  rationale: Предлог ב допускает локативное и инструментально-причинное понимание. Основной текст сохраняет образ западни, заключённой в самом преступлении, а альтернативный смысл отмечен в сноске.
- source_word: אִישׁ רָע
  choice: злого человека
  rationale: Передаёт мужской род и нравственную оценку исходного выражения естественным современным русским языком.
- source_word: מוֹקֵשׁ
  choice: западня
  rationale: Сохраняет характерный для литературы мудрости образ ловушки и указывает на пагубные последствия зла.
- source_word: צַדִּיק
  choice: праведник
  rationale: Краткое субстантивированное обозначение человека, поступающего праведно; сохраняет прямое противопоставление злому человеку.
- source_word: יָרוּן
  choice: поёт от радости
  rationale: Передаёт громкое, слышимое выражение радости, не сводя глагол лишь к внутреннему чувству.
- source_word: וְשָׂמֵחַ
  choice: и радуется
  rationale: Естественно передаёт продолжающееся состояние радости и сохраняет парное построение еврейской строки.
theological_decisions:
- issue: Связь преступления злого человека с западнёй
  choice: Западня находится «в» его преступлении
  alternative: Западня возникает «из-за» его преступления
  rationale: Оба понимания возможны из-за диапазона значений предлога ב; основной перевод не определяет подробнее, является ли западня внутренним свойством греха или его следствием.
translation_notes:
  register: Современный литературный русский язык с краткостью и образностью, свойственными притче. Тире сохраняет сжатость еврейской именной конструкции; формулировки избегают архаизмов и конфессионально обусловленных толкований.
