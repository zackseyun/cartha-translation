  text: When the righteous increase[a], the people rejoice; but when a wicked man rules, the people groan.
translation:
  language: ru
  text: Когда праведных становится больше[a], народ радуется, а когда правит нечестивый, народ стонет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда праведных много, народ радуется». Еврейский оборот может подчёркивать как увеличение их числа, так и их многочисленность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: когда ... становится больше
  rationale: Сочетание предлога ב с инфинитивом конструктивным רבה имеет временное значение. Перевод передаёт идею возрастания, не исключая возможного смысла многочисленности, отмеченного в сноске.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе естественно передаётся по-русски словом «праведных» в составе оборота «праведных становится больше».
- source_word: יִשְׂמַח
  choice: радуется
  rationale: Глагол שמח обозначает радость; настоящее время соответствует обобщённому характеру притчи и образует ясную антитезу со словом «стонет».
- source_word: הָעָם / עָם
  choice: народ
  rationale: עם обозначает народ как совокупность людей. Повтор «народ» сохраняет параллелизм двух частей стиха.
- source_word: וּבִמְשֹׁל
  choice: а когда правит
  rationale: ב с инфинитивом конструктивным משל образует временной оборот; союз «а» естественно выражает противопоставление, заложенное в параллелизме.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное мужского рода единственного числа указывает на отдельного нечестивого правителя. Русская форма сохраняет число и род без добавления отсутствующего в еврейском тексте существительного.
- source_word: יֵאָנַח
  choice: стонет
  rationale: Нифаль глагола אנח выражает стон или тяжёлый вздох от бедствия; «стонет» хорошо передаёт общественное страдание под властью нечестивого.
