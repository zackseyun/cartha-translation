  text: Гордость человека унизит его, а смиренный духом обретёт почёт[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «удержит почёт» или «крепко будет держаться за почёт». Еврейский глагол может означать «держать», «удерживать» или «обретать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּאֲוַת
  choice: гордость
  rationale: Передаёт надменную самооценку и естественно образует противопоставление смирению.
- source_word: אָדָם
  choice: человека
  rationale: Единственное число обозначает отдельного человека как типичного представителя людей; русское «человека» сохраняет эту обобщённость.
- source_word: תַּשְׁפִּילֶנּוּ
  choice: унизит его
  rationale: Каузативная форма означает «сделает низким, повергнет, унизит»; выбранная формулировка кратка и сохраняет контраст с почётом.
- source_word: וּשְׁפַל רוּחַ
  choice: а смиренный духом
  rationale: Сохраняет образное указание на внутренний склад человека и звучит понятно и достойно в современном литературном русском.
- source_word: יִתְמֹךְ
  choice: обретёт
  rationale: В сочетании с «почётом» контекст допускает смысл достижения или получения, хотя основное значение глагола связано также с удерживанием и поддерживанием; неоднозначность отмечена в сноске.
- source_word: כָּבוֹד
  choice: почёт
  rationale: В контексте Притч речь прежде всего об уважении и высоком положении среди людей, а не о богословской «славе».
