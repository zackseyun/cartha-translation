  text: By justice a king establishes a land[b][a], but a man of bribes tears it down.
translation:
  language: ru
  text: Правосудием царь укрепляет страну, а тот, кто вымогает поборы[a], разоряет её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек приношений (или взносов)». Еврейское слово может означать приношения, дары или взносы; в этом контексте оно, вероятно, относится к поборам либо коррупционным платежам. Возможный перевод: «тот, кто берёт взятки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Форма без артикля имеет обобщённый смысл, обычный для притчи; русское «царь» естественно передаёт правителя-монарха.
- source_word: בְּמִשְׁפָּט
  choice: правосудием
  rationale: מִשְׁפָּט здесь обозначает справедливое судебное управление; творительный падеж передаёт средство, посредством которого царь придаёт стране устойчивость.
- source_word: יַעֲמִיד
  choice: укрепляет
  rationale: Каузативная форма от עמד буквально означает «ставит, делает устойчивым»; в контексте управления «укрепляет» естественно выражает обеспечение устойчивости страны.
- source_word: אָרֶץ
  choice: страну
  rationale: В контексте царского управления слово означает подвластную страну или государство, а не всю землю.
- source_word: אִישׁ תְּרוּמוֹת
  choice: любитель поборов
  rationale: Буквально сочетание значит «человек приношений/взносов». В противопоставлении справедливому царю оно, вероятно, обозначает правителя или должностное лицо, наживающееся на взимаемых дарах либо поборах; «любитель поборов» передаёт характеристику человека и сохраняет оттенок систематического злоупотребления.
- source_word: יֶהֶרְסֶנָּה
  choice: разоряет её
  rationale: הרס означает разрушать, сносить; применительно к стране «разоряет» звучит естественно и сохраняет резкий контраст с её укреплением. Местоимение «её» относится к стране.
