  text: גֶּ֭בֶר מַחֲלִ֣יק עַל רֵעֵ֑/הוּ רֶ֝֗שֶׁת פּוֹרֵ֥שׂ עַל פְּעָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/005.yaml
  text: A man who flatters his neighbor spreads a net for his steps[a][b].
translation:
  language: ru
  text: Кто льстит своему ближнему[a], тот расстилает сеть у него под ногами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своему другу» или «товарищу». Еврейское слово רֵעַ допускает эти значения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «расстилает сеть для его шагов»; имеется в виду западня на пути того, кому льстят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: Кто
  rationale: В форме мужского рода слово означает мужчину, однако в кратком русском изречении конструкция «кто… тот» естественно передаёт обобщённый смысл, не меняя предмет предостережения.
- source_word: מַחֲלִיק
  choice: льстит
  rationale: Причастие породы hифиль от חלק здесь описывает гладкую, льстивую речь; «льстит» кратко и естественно передаёт этот идиоматический смысл.
- source_word: עַל רֵעֵהוּ
  choice: своему ближнему
  rationale: רֵעַ может обозначать ближнего, друга, товарища или другого человека из близкого круга. «Ближний» сохраняет широту значения и соответствует нравоучительному контексту.
- source_word: רֶשֶׁת
  choice: сеть
  rationale: Слово обозначает сеть для ловли и сохраняет конкретный образ западни.
- source_word: פּוֹרֵשׂ
  choice: расстилает
  rationale: Причастие от פרש означает «распростирать, расстилать»; этот глагол естественно сочетается по-русски с сетью.
- source_word: עַל פְּעָמָיו
  choice: у него под ногами
  rationale: Буквально выражение связано с его шагами или стопами. Русская формулировка ясно сохраняет образ сети, помещённой там, куда ступает тот, кому льстят; местоименный суффикс отнесён к ближнему.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая симметричная конструкция «кто… тот» соответствует форме пословицы. Образ сети сохранён, а буквальное «для его шагов» передано естественным русским выражением и отмечено в сноске.
