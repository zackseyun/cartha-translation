base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/027.yaml
  text: An unjust man is an abomination to the righteous[b][a], and one whose way is upright is an abomination to the wicked.
translation:
  language: ru
  text: Для праведных отвратителен человек, поступающий несправедливо, а для нечестивого — тот, чей путь прям.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: отвратителен для
  rationale: Конструктивная форма существительного обозначает того, кто вызывает сильное нравственное отвращение. Предикативная конструкция естественна по-русски и сохраняет силу еврейского выражения.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе передаёт нравственную категорию и естественно звучит в современном русском библейском регистре.
- source_word: אִישׁ עָוֶל
  choice: неправедный человек
  rationale: Сочетание буквально описывает человека неправды или несправедливости. «Неправедный человек» сохраняет мужской род и широкий нравственный смысл עָוֶל.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное в единственном числе выражает обобщённый тип человека и сохраняет контраст с праведными.
- source_word: יְשַׁר דָּרֶךְ
  choice: тот, чей путь прям
  rationale: Перевод сохраняет образ жизненного пути и передаёт יָשָׁר как нравственную прямоту, не сводя выражение к пояснительному слову «поведение».
- source_word: דָּרֶךְ
  choice: путь
  rationale: В литературе мудрости «путь» служит устойчивым образом образа жизни и поведения; русский эквивалент сохраняет эту метафору.
theological_decisions:
- issue: Репрезентативный мужской род в אִישׁ עָוֶל и רָשָׁע
  choice: «неправедный человек» и «нечестивого»
  alternative: «неправедный» / «неправедный человек» и «нечестивые»
  rationale: 'Еврейский текст использует мужской род: אִישׁ — существительное мужского рода, а רָשָׁע — субстантивированное прилагательное мужского рода в единственном числе. Русский перевод сохраняет эту форму, при этом из афористического контекста ясно её обобщающее значение.'
- issue: Числовая асимметрия между צַדִּיקִים и רָשָׁע
  choice: Сохранены множественное «праведных» и единственное «нечестивого»
  alternative: 'Согласовать число: «праведных» и «нечестивых»'
  rationale: Асимметрия присутствует в масоретском тексте и не препятствует пониманию; её сохранение точнее передаёт форму оригинала.
translation_notes:
  register: Современный литературный русский с достоинством библейской литературы мудрости. Сохранены антитетический параллелизм, сильная лексика нравственного отвращения и метафора прямого пути; порядок частей следует еврейскому тексту.
