lexical_decisions:
- source_word: יֹדֵעַ
  choice: знает
  rationale: Причастие от ידע прямо обозначает знание или распознавание. «Знает» сохраняет основной смысл и не добавляет более толковательного оттенка «заботится».
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода в единственном числе естественно передаётся русским существительным «праведник».
- source_word: דִּין
  choice: дело
  rationale: В сочетании с דַּלִּים слово может обозначать судебное дело, тяжбу, права или справедливое притязание. «Дело» сохраняет конкретный и юридико-социальный оттенок, не сводя смысл только к абстрактной справедливости.
- source_word: דַּלִּים
  choice: бедных
  rationale: Множественное число обозначает бедных, слабых или социально уязвимых людей. «Бедных» — наиболее ясный и естественный русский эквивалент в данном контексте.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное в единственном числе образует традиционный и ясный для русской библейской речи контраст с «праведником».
- source_word: יָבִין
  choice: понимает
  rationale: Глагол בין означает понимать, постигать или различать. «Понимает» ясно передаёт противопоставление знанию праведника.
- source_word: דָּעַת
  choice: знания
  rationale: В еврейском тексте стоит абстрактное существительное «знание» без указательного уточнения. Буквальная конструкция намеренно сохранена, а её необычная краткость пояснена в сноске.
theological_decisions:
- issue: Связь «знания» во второй строке с делом бедных в первой
  choice: Не добавлять в основной текст слова «такого» или «об этом»
  alternative: «не имеет такого понимания» / «не понимает этого»
  rationale: Еврейский текст оставляет דָּעַת без явного указания на предыдущую строку. Добавление сделало бы подразумеваемую связь однозначной и устранило бы присущую оригиналу напряжённую, краткую формулировку.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным пословичным строем. Сохранены параллелизм, контраст единственных типовых фигур («праведник» — «нечестивый») и необычная краткость второй строки; неоднозначность ключевых слов вынесена в сноски.
