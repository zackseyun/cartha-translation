translation:
  language: ru
  text: Праведник знает дело бедных[a], а нечестивый не обладает пониманием[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знает права бедных»; еврейское דִּין может означать дело, тяжбу, право или справедливость.'
