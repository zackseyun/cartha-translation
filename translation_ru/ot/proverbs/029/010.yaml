  source_fidelity: 'Первая часть передана точно: אַנְשֵׁי דָמִים обозначает людей, склонных к кровопролитию, а תָּם — нравственно безупречного человека. Во второй части יְשָׁרִים лучше передавать как «праведные», а не «честные»: речь о нравственной прямоте/праведности, шире простой честности. Оборот יְבַקְשׁוּ נַפְשׁוֹ допускает спорное понимание; в современном русском «ищут его жизни» почти неизбежно означает покушение на жизнь и потому не сохраняет заявленной возможности благожелательного смысла.'
  naturalness: «Люди кровожадные» звучит менее естественно, чем «кровожадные люди». «Ищут его жизни» понятно, но в русском имеет почти исключительно враждебную окраску, тогда как сноска предлагает противоположное прочтение. Положительное чтение в основном тексте с явной сноской о буквальном и альтернативном смысле читается естественно и не скрывает текстологическую/семантическую трудность.
