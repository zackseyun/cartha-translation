  text: Men of blood hate the blameless[a], but the upright seek his life.
translation:
  language: ru
  text: Кровожадные люди ненавидят безупречного, а праведные заботятся о его жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ищут его жизни (души)». Этот оборот понимают по-разному: «заботятся о его жизни», «стараются защитить его»; возможно и враждебное понимание: «ищут его жизни».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי דָמִים
  choice: люди кровожадные
  rationale: Буквально — «люди крови (кровопролития)». Русское «кровожадные» естественно и ясно передаёт склонность к насилию и убийству, не ограничивая выражение одним совершённым преступлением.
- source_word: יִשְׂנְאוּ
  choice: ненавидят
  rationale: Прямое и обычное соответствие еврейскому глаголу «ненавидеть».
- source_word: תָם
  choice: непорочного
  rationale: Слово обозначает цельного, безупречного в поведении человека. «Непорочный» сохраняет характерную для литературы мудрости нравственную категорию и не смешивает её с יְשָׁרִים во второй строке.
- source_word: וִישָׁרִים
  choice: честные
  rationale: Еврейское слово обозначает нравственно прямых людей. «Честные» звучит естественно в современном русском и отличает эту группу от названного ранее «непорочного».
- source_word: יְבַקְשׁוּ
  choice: ищут
  rationale: 'Основное значение глагола — «искать». Буквальный выбор сохраняет неоднозначность оборота: искать чьей-либо жизни можно понять враждебно, тогда как в контексте возможен смысл заботы и защиты.'
- source_word: נַפְשׁוֹ
  choice: его жизни
  rationale: נֶפֶשׁ здесь может означать жизнь, самого человека или его личность. «Его жизни» близко к форме источника и сохраняет смысловое напряжение выражения.
theological_decisions:
- issue: 'Неоднозначность второй части: ищут ли честные жизни непорочного ради его блага или выражение имеет враждебный смысл.'
  choice: ищут его жизни
  alternative: заботятся о его жизни; стараются защитить его
  rationale: Формальная передача יְבַקְשׁוּ נַפְשׁוֹ не устраняет неоднозначность древнееврейского текста. Благожелательное понимание отмечено в сноске, а не внесено безоговорочно в основной текст.
translation_notes:
  register: 'Современный литературный русский с кратким, афористичным строем притчи. Выражение «ищут его жизни» намеренно слегка необычно: оно сохраняет формулировку и подлинную неоднозначность оригинала; пояснение дано в сноске.'
