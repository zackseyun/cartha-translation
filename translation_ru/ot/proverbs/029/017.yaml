lexical_decisions:
- source_word: יַסֵּר
  choice: Наставляй
  rationale: Порода пиэль глагола יסר выражает деятельное воспитание через исправление. «Наставляй» естественно для русского текста мудрости и охватывает как обучение, так и исправляющее воздействие, не сводя смысл только к наказанию.
- source_word: בִּנְךָ
  choice: сына своего
  rationale: Еврейский текст прямо говорит о сыне в единственном числе; родовая форма сохранена без обобщения до «ребёнка».
- source_word: וִינִיחֶךָ
  choice: он даст тебе покой
  rationale: Каузативная форма от נוח означает, что сын позволит родителю успокоиться, обрести отдых или облегчение. Выражение «даст тебе покой» сохраняет образ и причинный оттенок.
- source_word: וְיִתֵּן
  choice: принесёт
  rationale: Буквально נתן — «даст». В русском «принесёт отраду» звучит естественнее и сохраняет смысл дарования результата, избегая тяжеловесного повтора «даст».
- source_word: מַעֲדַנִּים
  choice: отраду
  rationale: Существительное обозначает приятное, усладу или наслаждение. «Отрада» передаёт внутреннюю радость и хорошо сочетается с לְנַפְשֶׁךָ, не придавая слову узкого значения «лакомства».
- source_word: לְנַפְשֶׁךָ
  choice: душе твоей
  rationale: נפש может обозначать душу, жизнь или самого человека. Буквальное и понятное «душе твоей» сохраняет антропологическую широту и поэтическую глубину выражения.
