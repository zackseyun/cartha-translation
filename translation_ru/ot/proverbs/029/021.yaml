lexical_decisions:
- source_word: מְפַנֵּק
  choice: балует
  rationale: Порода пиэль передаёт чрезмерно мягкое, потворствующее обращение; «балует» естественно выражает отрицательный оттенок предостережения.
- source_word: מִנֹּעַר
  choice: с юности
  rationale: Оборот обозначает обращение с рабом начиная с раннего возраста; русский вариант краток и близок к форме оригинала.
- source_word: עַבְדּוֹ
  choice: своего раба
  rationale: עבד может означать слугу или раба; здесь речь идёт о человеке, находящемся во власти хозяина, поэтому «раб» точнее передаёт социальное положение, не смягчая его.
- source_word: וְאַחֲרִיתוֹ
  choice: у того под конец
  rationale: Формулировка передаёт конечный итог описанного обращения. Конструкция «у того» помогает естественно связать итог с хозяином, не устраняя возможной соотнесённости местоименного суффикса с рабом.
- source_word: יִהְיֶה מָנוֹן
  choice: он станет как сын
  rationale: מָנוֹן — редкое и неясное слово. Основной текст следует пониманию, связывающему его с сыновним положением или поведением; «как сын» не утверждает буквального изменения родства и сохраняет оттенок присвоения статуса.
