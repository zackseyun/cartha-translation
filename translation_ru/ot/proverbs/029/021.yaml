  text: Whoever pampers his servant from youth[a], in the end he will become a son.
translation:
  language: ru
  text: Кто с юности балует своего раба, тому под конец тот станет сыном[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение еврейского слова מָנוֹן неясно. Его понимают как «сын» или «тот, кто ведёт себя как сын»: избалованный раб может начать притязать на положение сына. Возможны также значения «непокорность», «беда» или «горе».'
