    issue: Неясная соотнесённость местоимений в основном тексте
    rationale: В сочетании «у того под конец он станет» русский читатель должен заново устанавливать, что «он» — раб, а не хозяин. В еврейском референция также обсуждается, поэтому русский текст не должен создавать дополнительную, чисто синтаксическую неясность.
  - severity: low
    issue: «Как сын» чрезмерно сужает спорное מָנוֹן
    rationale: Сравнительная конструкция делает основным смыслом лишь поведение или притязание на статус. Возможное традиционное понимание «сын» лучше передать в тексте прямо, оставив альтернативы в сноске.
