base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/032.yaml
  text: And now[a], sons, listen to me; blessed are those who keep my ways.
translation:
  language: ru
  text: А теперь, сыновья[a], слушайте меня; блаженны те, кто следует моими путями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети». В еврейском тексте — «сыновья», обычное обращение к ученикам в наставлениях мудрости, хотя само наставление применимо шире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сочетание союза с наречием времени обозначает переход к прямому увещанию; «А теперь» естественно передаёт этот поворот в современном русском языке.
- source_word: בָנִים
  choice: сыновья
  rationale: В еврейском тексте стоит форма мужского рода множественного числа, обычная для обращения наставника к ученикам в литературе мудрости. Притяжательное «мои» в оригинале отсутствует.
- source_word: שִׁמְעוּ לִי
  choice: слушайте меня
  rationale: Конструкция выражает направленное, внимательное слушание. Перевод сохраняет повелительную силу, не сужая смысл до одного лишь физического слышания и не усиливая его до прямого «повинуйтесь».
- source_word: וְאַשְׁרֵי
  choice: блаженны
  rationale: Форма выражает провозглашение благополучного, достойного одобрения состояния. «Блаженны» сохраняет характерную для библейских изречений торжественность.
- source_word: דְּרָכַי
  choice: мои пути
  rationale: В литературе мудрости «пути» метафорически обозначают образ жизни и направление поведения; традиционное русское соответствие сохраняет эту метафору.
- source_word: יִשְׁמֹרוּ
  choice: хранящие
  rationale: 'Глагол может означать «хранить», «оберегать», «соблюдать». «Хранящие мои пути» сохраняет широту образа: внимательное отношение к наставлению и практическую верность ему.'
theological_decisions:
- issue: Гендерно маркированное обращение в наставлении мудрости
  choice: сыновья
  alternative: дети
  rationale: Основной текст отражает грамматически мужскую форму оригинала и условное обращение наставника к ученикам. В примечании указана более широкая по применению передача, поскольку наставление по смыслу не обязательно ограничено мужчинами.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм и метафора «путей» сохранены; неявное «мои» при обращении не добавлено.
