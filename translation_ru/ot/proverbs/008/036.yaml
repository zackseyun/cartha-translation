  text: But the one who sins against me wrongs his own soul[b][a]; all who hate me love death.
translation:
  language: ru
  text: Кто грешит против меня, тот вредит самому себе[a]; все, кто ненавидит меня, любят смерть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чинит насилие своей душе/жизни». Еврейское слово, переведённое «грешит», может также означать «промахивается мимо меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֹטְאִי
  choice: а кто грешит против меня
  rationale: Причастие от חטא с прямым объектом «меня» допускает значения «промахиваться мимо» и «грешить против». В данном противопоставлении обретению Мудрости естественное русское «грешит против меня» сохраняет нравственную силу глагола; его более буквальная образность отмечена в сноске.
- source_word: חֹמֵס
  choice: причиняет зло
  rationale: Глагольная форма от חמס выражает насилие, неправду или тяжкий вред. С נַפְשׁוֹ речь идёт о пагубном действии человека против собственной жизни; «причиняет зло» передаёт серьёзность выражения, не сводя его к физическому насилию.
- source_word: נַפְשׁוֹ
  choice: собственной жизни
  rationale: נפש здесь может означать жизнь, самого человека или душу. «Собственной жизни» естественно передаёт самопагубный смысл и не навязывает тексту жёсткого противопоставления души и тела.
- source_word: כָּל מְשַׂנְאַי
  choice: все ненавидящие меня
  rationale: Сохранены универсальность כָּל и причастная характеристика людей, ненавидящих говорящую Мудрость.
- source_word: אָהֲבוּ מָוֶת
  choice: любят смерть
  rationale: Хотя אָהֲבוּ имеет форму перфекта, в афористическом параллелизме оно выражает общую истину, поэтому уместно настоящее время.
theological_decisions:
- issue: Значение נֶפֶשׁ в выражении о вреде самому себе
  choice: собственной жизни
  alternative: собственной душе; самому себе
  rationale: Выбор сохраняет связь נֶפֶשׁ с жизнью и передаёт мысль о саморазрушительности отвержения Мудрости, не вводя не требуемой еврейским текстом антропологической схемы.
- issue: Смысл חטא по отношению к Мудрости
  choice: грешит против меня
  alternative: промахивается мимо меня; не находит меня
  rationale: Еврейский глагол допускает образ промаха, но конструкция с личным объектом естественно передаётся как проступок против говорящей. Сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткий афористический строй и параллелизм стиха сохранены. «Собственной жизни» выбрано вместо менее естественного здесь «своей душе», а серьёзность חמס передана без чрезмерно буквального образа физического насилия.
