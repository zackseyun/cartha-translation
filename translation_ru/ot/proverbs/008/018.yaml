id: PRO.8.18
reference: Proverbs 8:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עֹֽשֶׁר וְ/כָב֥וֹד אִתִּ֑/י ה֥וֹן עָ֝תֵ֗ק וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/018.yaml
  text: Riches and honor are with me[b][a], enduring wealth and righteousness.
translation:
  language: ru
  text: 'Со мной — богатство и почёт,

    непреходящее достояние[a] и праведность[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прочное достояние»; слово может указывать как на долговечность, так и на основательность богатства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Слово обозначает материальное изобилие, богатство; этот перевод естественен в паре с «почётом».
- source_word: כָבוֹד
  choice: почёт
  rationale: В контексте литературы мудрости речь прежде всего об общественном уважении и высоком положении, а не о божественной славе.
- source_word: אִתִּי
  choice: со мной
  rationale: Буквально передаёт пространственно-притяжательную конструкцию «со мною» и сохраняет образ благ, пребывающих у персонифицированной Мудрости.
- source_word: הוֹן
  choice: достояние
  rationale: Слово означает имущество или богатство. «Достояние» сохраняет смысл, но позволяет не повторять «богатство» из первой строки.
- source_word: עָתֵק
  choice: непреходящее
  rationale: В сочетании с имуществом прилагательное, вероятнее всего, указывает на его долговечность и устойчивость; «непреходящее» естественно выражает это в поэтической речи.
- source_word: צְדָקָה
  choice: праведность
  rationale: Слово охватывает нравственную правоту и справедливость. «Праведность» сохраняет широкий моральный смысл, не сужая его до судебной или общественно-правовой сферы.
theological_decisions:
- issue: Передача צְדָקָה в нравственно насыщенном контексте мудрости
  choice: праведность
  alternative: справедливость
  rationale: Контекст говорит о благах Мудрости в широком нравственном смысле, поэтому в основном тексте выбрана «праведность». Возможное значение «справедливость» сохранено в сноске, чтобы не устранять смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Инверсия «Со мной — …» подчёркивает принадлежность перечисленных благ Мудрости; лексическое различие между עֹשֶׁר и הוֹן передано словами «богатство» и «достояние».
