  text: כִּ֣י מֹ֭צְאִ/י מצאי חַיִּ֑ים וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/035.yaml
  text: For whoever finds me finds life and obtains favor from Yahweh.
translation:
  language: ru
  text: Ведь тот, кто находит меня, находит жизнь и получает благоволение от Яхве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего наставления; «ведь» естественно передаёт пояснительную связь в современном русском языке.
- source_word: מֹצְאִי
  choice: кто находит меня
  rationale: Форма обозначает того, кто находит олицетворённую Мудрость. Конструкция с «кто» сохраняет обобщённый смысл и не ограничивает высказывание мужским полом.
- source_word: מָצָא
  choice: тот находит
  rationale: Повтор глагола «находит» отражает словесный параллелизм оригинала; добавленное «тот» делает конструкцию «кто… тот…» естественной по-русски.
- source_word: חַיִּים
  choice: жизнь
  rationale: Формально множественное существительное обычно имеет здесь собирательное значение «жизнь».
- source_word: וַיָּפֶק
  choice: и обретает
  rationale: В данном сочетании глагол означает получение или достижение чего-либо; «обретает» звучит естественно и не преувеличивает человеческую роль.
- source_word: רָצוֹן
  choice: благоволение
  rationale: Здесь слово обозначает благосклонность и доброе расположение Бога; «благоволение» сохраняет религиозный и relationalный оттенок без конфессионального уточнения.
- source_word: מֵיְהוָה
  choice: Яхве
  rationale: Предлог מִן указывает на источник благоволения, а тетраграмматон передан личным именем «Яхве»; русская конструкция «обретает благоволение Яхве» естественно выражает принадлежность и источник.
theological_decisions:
- issue: Обобщённое единственное число при олицетворённой Мудрости
  choice: кто находит меня
  alternative: находящий меня
  rationale: Формулировка с «кто» передаёт всеобщий характер утверждения, не вводит ограничения по полу и ясно сохраняет речь Мудрости от первого лица.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо употребляет тетраграмматон; транслитерация сохраняет личное имя Бога и отличает его от титула.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Повтор «находит… находит» намеренно сохранён как важный элемент еврейского параллелизма. В предоставленной строке источника второе «מצאי», по-видимому, является техническим искажением стандартного чтения WLC מָצָא; перевод следует засвидетельствованному тексту стиха и его синтаксису.
