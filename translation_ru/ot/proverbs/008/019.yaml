    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: лучше
  rationale: Прилагательное טוֹב с сравнительным מִן выражает превосходство плода мудрости над названными драгоценностями.
- source_word: פִּרְיִי
  choice: мой плод
  rationale: «Плод» естественно передаёт сельскохозяйственный образ и обозначает результат, который даёт мудрость.
- source_word: מֵחָרוּץ
  choice: золота
  rationale: חָרוּץ в литературе мудрости обозначает золото; нейтральный эквивалент сохраняет отличие от следующего פָּז.
- source_word: וּמִפָּז
  choice: даже чистого золота
  rationale: פָּז обозначает золото особо высокого качества или чистоты; «даже» естественно передаёт усиление после общего упоминания золота.
- source_word: וּתְבוּאָתִי
  choice: и то, что я приношу
  rationale: תְּבוּאָה означает урожай, произведение или доход. Контекстуальная формулировка сохраняет идею результата и избегает ненатурального для русского повтора «мой урожай» в речи о мудрости.
- source_word: מִכֶּסֶף נִבְחָר
  choice: лучше отборного серебра
  rationale: נִבְחָר буквально связано с выбором и здесь указывает на высокое качество серебра; «отборное серебро» сохраняет этот оттенок.
