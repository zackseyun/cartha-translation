base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/017.yaml
  text: I love those who love me[a], and those who seek me diligently find me.
translation:
  language: ru
  text: Я люблю тех, кто любит меня, а те, кто усердно ищет меня[a], находят меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а те, кто ищет меня с раннего утра, находят меня». Еврейский глагол может означать «искать рано» и, в более широком смысле, «искать усердно, настойчиво».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Я
  rationale: Личное местоимение первого лица сохранено в начале высказывания для передачи смыслового акцента еврейского текста.
- source_word: אֹהֲבַי / אהבי/ה
  choice: тех, кто любит меня
  rationale: Субстантивированное причастие с суффиксом первого лица естественно передаётся по-русски придаточной конструкцией; «любящих меня» возможно, но звучит несколько книжнее.
- source_word: אֵהָב
  choice: люблю
  rationale: Имперфект в контексте изречения выражает общее, постоянно действующее положение; настоящее время естественно передаёт этот гномический смысл.
- source_word: מְשַׁחֲרַי
  choice: те, кто усердно ищет меня
  rationale: Порода piel глагола שׁחר может означать поиски с раннего утра и, шире, настойчивые, ревностные поиски. «Усердно ищет» естественно выражает идиоматический смысл, а буквальная временная окраска отмечена в сноске.
- source_word: יִמְצָאֻנְנִי
  choice: находят меня
  rationale: 'Имперфект во второй параллельной строке также прочитан как гномический: речь идёт об общем принципе, а не только о будущем событии.'
theological_decisions:
- issue: Взаимность любви персонифицированной Мудрости
  choice: Передать слова как общий принцип отношений Мудрости с теми, кто любит и ищет её, без добавления позднейших христологических или сотериологических категорий.
  alternative: Истолковать фразу непосредственно как утверждение об избрании, спасении или как прямое христологическое высказывание.
  rationale: В Притчах 8 говорит поэтически персонифицированная Мудрость. Перевод сохраняет литературный образ и богословское напряжение текста, не вводя утверждений, которых еврейская фраза прямо не содержит.
translation_notes:
  register: Современный литературный русский язык; ясная, достойная и естественная формулировка. Женский род местоимения «меня» грамматически не маркирован, но из контекста главы ясно, что говорит персонифицированная Мудрость. Маркер сноски поставлен после всего второго полустишия, к которому относится лексическая альтернатива.
