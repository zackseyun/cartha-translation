lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего призыва Мудрости; «ибо» сохраняет пояснительную связь и соответствует возвышенному, но понятному библейскому регистру.
- source_word: אֱמֶת
  choice: истину
  rationale: В контексте речи слово обозначает истинное, правдивое содержание высказывания; винительный падеж естественно сочетается с глаголом «произносит».
- source_word: יֶהְגֶּה
  choice: произносит
  rationale: Глагол может означать тихо говорить, бормотать или размышлять, однако при органе речи в роли подлежащего и «истине» как дополнении здесь речь идёт о словесном выражении. Настоящее время естественно передаёт характерное, неизменное действие Мудрости.
- source_word: חִכִּי
  choice: нёбо моё
  rationale: 'Сохранён буквальный образ еврейского текста: нёбо выступает как орган речи. Необычность выражения пояснена сноской.'
- source_word: וְתוֹעֲבַת
  choice: а ... отвратительно
  rationale: Противительный союз «а» ясно передаёт смысловой контраст между истиной и нечестием; предикативное «отвратительно» естественно выражает сильное нравственное отвращение существительного תּוֹעֵבָה.
- source_word: שְׂפָתַי
  choice: устам моим
  rationale: Сохранён телесный образ губ как органа речи; «уста» поддерживает достоинство поэтического регистра и согласуется с конструкцией «отвратительно кому».
- source_word: רֶשַׁע
  choice: нечестие
  rationale: Слово выражает нравственную порочность; «нечестие» хорошо противопоставляется истине и сохраняет библейскую этическую окраску без чрезмерного уточнения.
