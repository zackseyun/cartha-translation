source:
  edition: WLC
  text: הָבִ֣ינוּ פְתָאיִ֣ם עָרְמָ֑ה וּ֝/כְסִילִ֗ים הָבִ֥ינוּ לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/005.yaml
  text: Learn prudence[a], you simple ones; and learn understanding, you fools.
translation:
  language: ru
  text: Неопытные, научитесь благоразумию; глупцы, научитесь разумению[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сердцу». Здесь «сердце» означает внутреннюю способность понимать, рассуждать и выносить суждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִינוּ
  choice: научитесь
  rationale: Повторённый императив множественного числа от בין призывает обрести способность понимать и различать. «Научитесь» естественно звучит по-русски и сохраняет параллелизм обоих призывов.
- source_word: פְתָאיִם
  choice: неопытные
  rationale: В Притчах слово обозначает простодушных, неопытных и легко поддающихся влиянию людей, а не людей с ограниченными умственными способностями.
- source_word: עָרְמָה
  choice: благоразумие
  rationale: 'В данном контексте слово имеет положительный смысл: практическая рассудительность и осмотрительность, а не коварство.'
- source_word: וּכְסִילִים
  choice: глупцы
  rationale: Это устойчивое обозначение в литературе мудрости людей, упорно отвергающих разумное наставление; форма обращения сохранена.
- source_word: לֵב
  choice: разумение
  rationale: Буквально «сердце», но в древнееврейском представлении сердце является средоточием мысли, суждения и различения. Функциональный смысл передан в тексте, а буквальное соответствие отмечено в сноске.
