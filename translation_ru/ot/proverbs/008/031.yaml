    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֶקֶת
  choice: Я радовалась
  rationale: Причастие женского рода описывает продолжающуюся радостную деятельность олицетворённой Мудрости. «Радовалась» передаёт живую радость, не сводя образ к простой игре, и естественно звучит по-русски.
- source_word: בְּתֵבֵל אַרְצוֹ
  choice: на Его обитаемой земле
  rationale: תֵבֵל обозначает мир как обитаемую, устроенную землю, а אַרְצוֹ сохраняет принадлежность Богу. Перестройка словосочетания делает его естественным по-русски, сохраняя оба смысловых элемента.
- source_word: וְשַׁעֲשֻׁעַי
  choice: и отрада моя была
  rationale: Формально множественное существительное с суффиксом первого лица может иметь усилительное значение. Русское единственное число «отрада» естественно передаёт собирательный смысл, не превращая существительное в глагол.
- source_word: אֶת בְּנֵי אָדָם
  choice: с сынами человеческими
  rationale: אֶת здесь имеет комитативное значение «с», а традиционно-поэтическое «сыны человеческие» близко передаёт буквальный образ широкого обозначения человечества.
theological_decisions:
- issue: Олицетворённая Мудрость и возможное христологическое прочтение
  choice: Сохранён женский голос олицетворённой Мудрости без прямого отождествления с Христом
  alternative: Передать Мудрость как непосредственное указание на предвечного Сына
  rationale: Еврейский текст представляет Мудрость в женском грамматическом роде и не формулирует прямого христологического отождествления; возможное каноническое или типологическое прочтение не следует встраивать в сам перевод.
- issue: Характер радости Мудрости рядом с людьми
  choice: Сохранена конструкция «отрада моя была с сынами человеческими»
  alternative: Уточнить как «я находила отраду в человечестве»
  rationale: 'Предлог «с» сохраняет неоднозначность еврейского אֶת: речь может идти и о пребывании среди людей, и о радости, связанной с ними, без принудительного выбора одного оттенка.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Форма «сыны человеческие» намеренно сохраняет древнееврейский образ; смысл пояснён в сноске. Заглавная буква в «Его» соответствует уважительному указанию на Бога в данном контексте.
