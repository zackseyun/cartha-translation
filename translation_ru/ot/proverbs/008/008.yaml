  text: All the words of my mouth are righteous[a]; there is nothing twisted or crooked in them.
translation:
  language: ru
  text: Все слова моих уст праведны; нет в них ничего превратного или кривого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: праведны
  rationale: Предложное сочетание буквально означает «в праведности», но в данном предикативном контексте естественное русское «праведны» точно передаёт нравственную правильность речи.
- source_word: כָּל
  choice: Все
  rationale: Передаёт полный охват множества «слов» и естественно сочетается с формой множественного числа.
- source_word: אִמְרֵי פִי
  choice: слова моих уст
  rationale: Сохраняет образ еврейского выражения и его торжественное звучание, оставаясь понятным по-русски.
- source_word: אֵין בָּהֶם
  choice: нет в них ничего
  rationale: Естественно передаёт еврейскую конструкцию отрицания существования с местоименным дополнением.
- source_word: נִפְתָּל
  choice: коварного
  rationale: Слово обозначает искривлённое, превратное или лукавое; в отношении речи «коварное» естественно выражает неискренность и уклончивость.
- source_word: וְעִקֵּשׁ
  choice: или лживого
  rationale: 'Обозначает кривое, извращённое, превратное. В контексте слов «лживое» ясно передаёт нравственную метафору кривизны; союз переведён как «или» в сфере действия отрицания: нет ни того, ни другого.'
