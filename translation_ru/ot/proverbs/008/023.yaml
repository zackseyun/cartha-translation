  text: מֵ֭/עוֹלָם נִסַּ֥כְתִּי מֵ/רֹ֗אשׁ מִ/קַּדְמֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/023.yaml
  text: From everlasting I was established[a], from the beginning, from before the earth.
translation:
  language: ru
  text: От века я была утверждена[a], от начала, прежде земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была поставлена». Значение еврейского глагола спорно; его также понимают как «была установлена» или, что здесь менее вероятно, «была помазана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: От века
  rationale: Выражение передаёт неопределённо далёкую древность или вечность; в контексте, предшествующем творению, оно сохраняет возвышенный временной охват и естественно звучит по-русски.
- source_word: נִסַּכְתִּי
  choice: я была утверждена
  rationale: Значение формы нифаль здесь спорно. «Была утверждена» передаёт установление или назначение Премудрости, не внося не требуемого контекстом мессианского оттенка.
- source_word: מֵרֹאשׁ
  choice: от начала
  rationale: В данном временном выражении רֹאשׁ означает начало; краткая формулировка сохраняет параллелизм еврейской строки.
- source_word: מִקַּדְמֵי אָרֶץ
  choice: прежде земли
  rationale: В космическом контексте выражение указывает на предшествование существованию земли. Выбор «земли», а не «страны», соответствует контексту творения.
theological_decisions:
- issue: Возможное христологическое переосмысление олицетворённой Премудрости
  choice: Передать речь олицетворённой Премудрости и её установлении до творения без прямой мессианской или тринитарной терминологии.
  alternative: Перевести נִסַּכְתִּי как «я была помазана», что может подталкивать к мессианскому прочтению.
  rationale: Хотя христианская традиция может типологически соотносить Притчи 8 с Сыном, перевод должен прежде всего отражать непосредственный литературный смысл еврейского текста и не вносить доктринально нагруженных значений, которых стих прямо не требует.
translation_notes:
  register: Современный литературный русский язык с возвышенной библейской краткостью. Женский род обусловлен говорящей в контексте олицетворённой Премудростью. Сохранён трёхчастный временной параллелизм оригинала.
