  verdict: approve
  source_fidelity: «От века» адекватно передаёт מֵעוֹלָם в предтворческом контексте, не устраняя присущую слову עוֹלָם смысловую широту. «Я была утверждена» — допустимая передача спорного נִסַּכְתִּי; примечание надлежащим образом фиксирует основные альтернативы. «От начала, прежде земли» сохраняет трёхчленный временной параллелизм מֵרֹאשׁ / מִקַּדְמֵי אָרֶץ и космическое значение אֶרֶץ.
  naturalness: Фраза кратка, ритмична и соответствует современному литературному русскому с умеренно возвышенной библейской окраской. «Прежде земли» намеренно сжато и поэтично, но понятно в данном контексте; женский род согласован с олицетворённой Премудростью.
  terminology: «Утверждена» не вносит мессианского или конфессионально обусловленного смысла и приемлемо выражает установление/назначение. Сноска корректно отмечает «поставлена», «установлена» и менее вероятное «помазана», не выдавая спорное значение за несомненное.
