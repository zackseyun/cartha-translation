translation_notes:
  register: Современный литературный русский язык с ясным, dignified звучанием. Синтаксический параллелизм еврейской строки сохранён; буквальный образ прямизны передан в сноске, поскольку выражение «слова прямы для кого-либо» в основном тексте звучало бы по-русски неестественно.
