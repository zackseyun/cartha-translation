  text: All of them are straightforward to the one who understands[a], and upright to those who find knowledge.
translation:
  language: ru
  text: Все они ясны тому, кто понимает, и справедливы тем, кто обрёл знание[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прямы» или «правильны». Еврейские слова передают образ прямоты: слова мудрости не кривы и не обманчивы для человека, обладающего пониманием и знанием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Все они
  rationale: Форма охватывает все слова мудрости, о которых говорится в ближайшем контексте (ст. 6–8), и сохраняет полноту выражения.
- source_word: נְכֹחִים
  choice: ясны
  rationale: Слово описывает прямое, недвусмысленное и неискривлённое высказывание. В сочетании с речью мудрости русское «ясны» естественно передаёт то, что её слова открыты пониманию проницательного человека; буквальный пространственный образ отмечен в сноске.
- source_word: לַמֵּבִין
  choice: для того, кто понимает
  rationale: Предлог ל выражает отношение к человеку, а причастие от בין обозначает понимающего, способного различать и постигать. Формулировка современна и не добавляет отсутствующей в смысле гендерной ограниченности.
- source_word: וִישָׁרִים
  choice: и верны
  rationale: יָשָׁר может означать прямое, правильное, честное. «Верны» естественно характеризует слова как правильные и истинные, сохраняя параллелизм без неуклюжего повторения «прямы».
- source_word: לְמֹצְאֵי
  choice: для обретающих
  rationale: Причастная форма сохраняет активный смысл нахождения или приобретения и в русском естественно сочетается со словом «знание».
- source_word: דָעַת
  choice: знание
  rationale: Так сохраняется обычное значение דַּעַת и его лексическое отличие от בין — понимания и способности различать — в первой половине стиха.
