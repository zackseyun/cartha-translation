  text: לְ/הַנְחִ֖יל אֹהֲבַ֥/י יֵ֑שׁ וְ/אֹצְרֹ֖תֵי/הֶ֣ם אֲמַלֵּֽא׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/021.yaml
  text: to endow those who love me with wealth[a], and to fill their treasuries.
translation:
  language: ru
  text: чтобы дать любящим меня в наследие богатство[a] и наполнить их сокровищницы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достояние» или «имущество». Еврейское יֵשׁ здесь указывает на нечто реально имеющееся, на собственность или достаток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַנְחִיל
  choice: дать в наследие
  rationale: Порода hифиль глагола נחל означает «дать унаследовать, передать во владение». Формулировка сохраняет образ наследования и естественно звучит по-русски.
- source_word: אֹהֲבַי
  choice: любящим меня
  rationale: Причастие с суффиксом первого лица обозначает людей, для которых характерна любовь к олицетворённой Мудрости.
- source_word: יֵשׁ
  choice: богатство
  rationale: В данном контексте слово обозначает не просто существование, а реальное достояние или имущество; параллель с сокровищницами поддерживает конкретный образ богатства.
- source_word: וְאֹצְרֹתֵיהֶם
  choice: их сокровищницы
  rationale: Существительное אוֹצָר может обозначать хранилище ценностей или сокровищницу. Конкретный образ и множественное число сохранены.
- source_word: אֲמַלֵּא
  choice: наполнить
  rationale: 'Форма первого лица единственного числа буквально означает «я наполню», но по смыслу продолжает целевую конструкцию, начатую לְהַנְחִיל. Инфинитив обеспечивает естественную русскую координацию: «чтобы дать… и наполнить».'
theological_decisions:
- issue: Характер благ, обещанных олицетворённой Мудростью
  choice: Сохранить прямой образ материального богатства и наполненных сокровищниц, не превращая его в доктринальное обещание обязательного процветания.
  alternative: 'Передать абстрактно: «истинное богатство» или «непреходящее достояние».'
  rationale: Связь יֵשׁ с «сокровищницами» указывает на конкретный образ достатка, однако сам стих не даёт оснований добавлять оценочные определения или формулировать богословскую гарантию материального процветания.
translation_notes:
  register: Современный литературный русский язык; поэтическая фраза остаётся ясной и торжественной без архаизмов. Сохранены образ наследия, обращение олицетворённой Мудрости от первого лица и конкретный образ сокровищниц.
