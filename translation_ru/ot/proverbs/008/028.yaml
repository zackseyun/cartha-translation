  text: בְּ/אַמְּצ֣/וֹ שְׁחָקִ֣ים מִ/מָּ֑עַל בַּ֝/עֲז֗וֹז עִינ֥וֹת תְּהוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/028.yaml
  text: when he made the skies firm above[a], when the springs of the deep grew strong[b],
translation:
  language: ru
  text: 'когда Он укреплял небеса в вышине[a],

    когда набирали силу источники бездны[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облака»; еврейское слово может обозначать облака, небесную высь или небеса.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «когда Он укреплял источники бездны». Еврейский текст можно понимать либо как указание на то, что источники набирали силу, либо, по смысловой параллели, на то, что Бог укреплял их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַמְּצוֹ
  choice: когда Он укреплял
  rationale: Предлог ב при инфинитиве образует временную конструкцию, а суффикс указывает на Бога как действующее лицо. Глагол אמץ передаёт придание силы и устойчивости; «укреплял» сохраняет этот образ и естественно звучит по-русски.
- source_word: שְׁחָקִים
  choice: небеса
  rationale: В контексте творения слово обозначает верхнюю небесную область и может также пониматься как «облака». «Небеса» сохраняет широту образа и хорошо сочетается с «в вышине».
- source_word: מִמָּעַל
  choice: в вышине
  rationale: Выражение указывает на пространство наверху. «В вышине» естественно и поэтично передаёт пространственный смысл.
- source_word: בַּעֲזֹז
  choice: когда набирали силу
  rationale: Инфинитив от עזז образует параллельную временную конструкцию и грамматически допускает понимание источников как становящихся сильными. «Набирали силу» передаёт результативно-динамический оттенок без уточнения характера этой силы.
- source_word: עִינוֹת
  choice: источники
  rationale: Слово обозначает природные источники или ключи. «Источники» — ясный и современный русский эквивалент.
- source_word: תְּהוֹם
  choice: бездна
  rationale: В данном космогоническом контексте תְּהוֹם обозначает первозданную водную бездну. Традиционное «бездна» сохраняет ёмкость и космический оттенок образа.
theological_decisions:
- issue: Кто является субъектом действия во второй строке
  choice: источники бездны набирали силу
  alternative: Он укреплял источники бездны
  rationale: В первой строке на Бога как субъект указывает местоименный суффикс, тогда как во второй инфинитив от עזז естественно читается непереходно, а «источники бездны» — как его субъект. Альтернативное понимание возможно по смысловой параллели, поэтому оно отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм и незавершённость придаточных строк сохранены как часть более широкого контекста речи Премудрости.
