base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/011.yaml
  text: For wisdom is better than jewels[a], and all desirable things cannot compare with her.
translation:
  language: ru
  text: Ибо мудрость лучше драгоценностей[a], и ничто из желанного не сравнится с нею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жемчуга» или «рубинов»; точный вид драгоценностей, обозначенных еврейским словом, неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает стих с предшествующим призывом и вводит его обоснование; «ведь» естественно передаёт пояснительную силу союза.
- source_word: טוֹבָה חָכְמָה מִפְּנִינִים
  choice: мудрость лучше драгоценных камней
  rationale: Прилагательное с מִן имеет сравнительное значение. Обобщённое «драгоценные камни» не уточняет вид ценностей, не вполне определимый по еврейскому слову.
- source_word: וְכָל חֲפָצִים
  choice: и ничто желанное
  rationale: Еврейское выражение буквально говорит обо всём желанном; отрицательная русская конструкция с «ничто» передаёт всеохватность естественно и ясно.
- source_word: לֹא יִשְׁווּ בָהּ
  choice: не сравнится с ней
  rationale: Глагол שׁוה с ב выражает равенство или сопоставимость. Женское местоимение сохраняет олицетворение Мудрости в Притчах 8.
theological_decisions:
- issue: Олицетворение мудрости
  choice: сохранить личное местоимение женского рода «с ней»
  alternative: 'передать безлично: «с нею ничто не сравнится» при понимании мудрости лишь как абстрактного качества'
  rationale: Форма בָהּ имеет женский род, а вся глава представляет Мудрость как женщину. Перевод сохраняет литературный образ, не добавляя к нему догматического истолкования.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная форма соответствует стилю притчи. «Ведь» сохраняет связь с контекстом, а «ничто желанное» звучит естественно и передаёт обобщающий смысл оригинала.
