  text: בִּ֭/י מְלָכִ֣ים יִמְלֹ֑כוּ וְ֝/רוֹזְנִ֗ים יְחֹ֣קְקוּ צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/015.yaml
  text: By me kings reign[b][a], and rulers decree justice.
translation:
  language: ru
  text: Мною цари царствуют, и правители устанавливают справедливые законы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «и правители предписывают справедливость». В оригинале слово «справедливость» является непосредственным объектом глагола; в основном тексте законодательный смысл передан естественным для русского языка выражением «справедливые законы».'
    reason: Уточняет буквальную синтаксическую форму еврейского текста и объясняет естественное русское раскрытие подразумеваемого законодательного объекта.
lexical_decisions:
- source_word: בִּי
  choice: Мною
  rationale: 'Предлог ב с суффиксом первого лица выражает здесь посредство или орудие действия: цари царствуют благодаря Мудрости, посредством неё. «Мною» кратко и естественно передаёт эту мысль.'
- source_word: מְלָכִים
  choice: цари
  rationale: Прямой и общеупотребительный эквивалент названия монархов.
- source_word: יִמְלֹכוּ
  choice: царствуют
  rationale: Глагол מלך обозначает осуществление царской власти; сочетание «цари царствуют» сохраняет корневой повтор оригинала и звучит в русском языке торжественно, но понятно.
- source_word: וְרוֹזְנִים
  choice: правители
  rationale: Слово обозначает высокопоставленных властителей, сановников или князей. «Правители» ясно передаёт их управленческую роль и поддерживает параллелизм с царями.
- source_word: יְחֹקְקוּ
  choice: устанавливают … законы
  rationale: В контексте управления глагол חקק означает предписывать, постановлять или издавать установления. Русское сочетание передаёт законодательный оттенок, не привязывая его к современному парламентскому процессу.
- source_word: צֶדֶק
  choice: справедливые
  rationale: צֶדֶק означает справедливость, правоту, то, что справедливо. В сочетании с חקק естественный русский смысл — установление справедливых законов; добавленное существительное «законы» раскрывает подразумеваемый объект глагола.
theological_decisions:
- issue: Следует ли понимать стих как безусловное оправдание всякой политической власти
  choice: Стих говорит, что правильное царствование и справедливое законодательство осуществляются посредством Мудрости.
  alternative: Считать, что здесь всякая фактически существующая власть объявляется правомерной и справедливой.
  rationale: Контекст речи олицетворённой Мудрости подчёркивает её необходимую роль в должном управлении, но не утверждает, что каждый правитель всегда действует справедливо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Корневой повтор «цари царствуют» намеренно сохранён; архаичные «князья» и «вельможи» не выбраны.
