lexical_decisions:
- source_word: בְּ/רֹאשׁ מְרוֹמִים
  choice: на вершинах
  rationale: Сочетание буквально указывает на верхнюю, заметную часть возвышенностей. «На вершинах» естественно передаёт возвышенное и открытое место, сохраняя поэтический образ.
- source_word: עֲלֵי דָרֶךְ
  choice: у дороги
  rationale: Предлог обозначает положение рядом с дорогой. «У дороги» ясно и естественно передаёт общедоступное место.
- source_word: בֵּית נְתִיבוֹת
  choice: на перекрёстке путей
  rationale: Буквально «дом путей» — место их соединения или пересечения. «Перекрёсток путей» сохраняет образ нескольких сходящихся дорог и понятно современному читателю.
- source_word: נִצָּבָה
  choice: она занимает своё место
  rationale: Форма женского рода описывает намеренное, устойчивое положение олицетворённой Мудрости. Этот оборот передаёт целенаправленность лучше, чем простое «стоит», и не создаёт возможного впечатления, будто она лишь поднимается на ноги.
theological_decisions:
- issue: Олицетворение Мудрости в женском роде
  choice: Сохранить женское местоимение «она»
  alternative: Повторить слово «Мудрость» или перестроить фразу без указания рода
  rationale: Еврейский глагол стоит в форме женского рода единственного числа и согласуется с олицетворённой Мудростью в ближайшем контексте. Женский род сохраняет литературную форму текста, не добавляя к ней богословских отождествлений.
translation_notes:
  register: Современный литературный русский язык; поэтическая образность сохранена без архаизмов. Порядок обстоятельств отражает движение еврейской строки от возвышенного места к дороге и месту пересечения путей.
