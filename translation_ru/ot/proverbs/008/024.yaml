  text: בְּ/אֵין תְּהֹמ֥וֹת חוֹלָ֑לְתִּי בְּ/אֵ֥ין מַ֝עְיָנ֗וֹת נִכְבַּדֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/024.yaml
  text: When there were no depths[a], I was brought forth, when there were no springs abounding with water.
translation:
  language: ru
  text: Когда ещё не было бездн, я была рождена[a], когда не было источников, обильных водой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я родилась»; возможно также: «я была образована». Еврейский глагол может передавать образ рождения или появления на свет.'
    reason: Лексическая неоднозначность глагола חוֹלָלְתִּי.
lexical_decisions:
- source_word: בְּאֵין
  choice: когда ещё не было / когда не было
  rationale: Сочетание ב с אֵין в обоих полустишиях обозначает временное обстоятельство. Такая передача естественна по-русски и не усиливает исходный текст более толковательным «прежде чем появились».
- source_word: תְּהֹמוֹת
  choice: бездн
  rationale: Множественное число обозначает глубины первозданных вод. «Бездны» сохраняет поэтический образ и не добавляет отсутствующего в тексте определения «первозданные».
- source_word: חוֹלָלְתִּי
  choice: я была рождена
  rationale: Глагольная форма допускает образ рождения или произведения на свет. Пассивная конструкция сохраняет этот образ и не сводит его к более общему «я появилась» или к толковательному «я была сотворена».
- source_word: מַעְיָנוֹת
  choice: источников
  rationale: Слово обозначает природные источники воды; это наиболее ясный и современный русский эквивалент.
- source_word: נִכְבַּדֵּי מָיִם
  choice: обильных водой
  rationale: Буквально выражение связано с весомостью или тяжестью от воды, но дословное «тяжёлых водой» по-русски неестественно. «Обильных водой» ясно передаёт наполненность источников и сохраняет водный образ.
- source_word: מָיִם
  choice: водой
  rationale: Русское единственное число в творительном падеже естественно передаёт вещественное существительное в данном обороте.
theological_decisions:
- issue: Язык происхождения олицетворённой Мудрости
  choice: я была рождена
  alternative: я родилась; я была образована
  rationale: Передача сохраняет родовой образ и пассивность еврейского глагола, но не вводит слово «сотворена» и тем самым не решает за читателя позднейшие христологические споры. Женский род обусловлен русским словом «мудрость» в контексте главы.
translation_notes:
  register: Современный литературный русский язык с поэтической симметрией двух полустиший. «Когда ещё не было» в первой строке подчёркивает временной фон, а повтор «когда не было» сохраняет параллелизм без тяжеловесности.
