base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/034.yaml
  text: Blessed is the man who listens to me[a], watching at my doors day by day, keeping watch at the doorposts of my entrances.
translation:
  language: ru
  text: Блажен человек[a], который слушает меня, изо дня в день бодрствуя у моих дверей и ожидая у косяков моих входов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово «человек» употреблено здесь в единственном числе в обобщающем смысле: имеется в виду всякий, кто слушает Мудрость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Передаёт формулу провозглашения благополучия и полноты жизни, характерную для литературы мудрости; сохраняет более глубокий смысл, чем просто эмоциональное «счастлив».
- source_word: אָדָם
  choice: человек
  rationale: 'Сохраняет единственное число и обобщающий смысл еврейского слова: речь идёт о любом человеке, который слушает персонифицированную Мудрость.'
- source_word: שֹׁמֵעַ לִי
  choice: который слушает меня
  rationale: Передаёт продолжающееся внимательное слушание, не сужая смысл до одного лишь повиновения, хотя оно может подразумеваться.
- source_word: לִשְׁקֹד עַל דַּלְתֹתַי
  choice: бодрствуя у моих дверей
  rationale: Глагол выражает усердную бдительность и ожидание; «бодрствуя» естественно поддерживает образ человека, постоянно находящегося у дверей Мудрости.
- source_word: יוֹם יוֹם
  choice: изо дня в день
  rationale: Сохраняет усиленную повтором мысль о постоянстве и регулярности.
- source_word: לִשְׁמֹר
  choice: стоя на страже
  rationale: Передаёт значение наблюдения и бдительного ожидания, не предполагая обязательно защиту от нападения.
- source_word: מְזוּזוֹת פְּתָחָי
  choice: у косяков моих входов
  rationale: Сохраняет конкретный архитектурный образ дверных косяков и множественное число слова «входы», не смешивая его с предшествующим словом «двери».
theological_decisions:
- issue: Обобщающее значение существительного мужского рода в изречении мудрости
  choice: человек
  alternative: муж; всякий, кто
  rationale: Еврейское אָדָם здесь имеет единичную, но обобщающую силу и не ограничивает обещание мужчинами. Русское «человек» точно сохраняет и грамматическое единственное число, и включающий смысл.
- issue: Смысл слушания Мудрости
  choice: слушает меня
  alternative: повинуется мне
  rationale: Перевод сохраняет слуховой образ и не делает подразумеваемое послушание единственным явным значением глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для изречения мудрости. Синтаксический параллелизм и образ постоянного ожидания у дверей сохранены без архаизации.
