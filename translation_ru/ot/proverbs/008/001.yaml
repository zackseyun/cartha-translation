base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/001.yaml
  text: Does not wisdom call[b][a], and understanding raise her voice?
translation:
  language: ru
  text: Разве мудрость не взывает[a] и разум не возвышает свой голос[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не зовёт».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «даёт свой голос»; это выражение означает говорить громко или открыто.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет вопросительную форму еврейского текста.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Прямой и традиционный эквивалент; существительное женского рода естественно поддерживает олицетворение в контексте главы.
- source_word: תִקְרָא
  choice: взывает
  rationale: Глагол קרא здесь обозначает обращённый к людям призыв; «взывает» передаёт публичность и выразительность действия, не добавляя конкретного содержания провозглашения.
- source_word: וּתְבוּנָה
  choice: и разум
  rationale: תבונה обозначает способность понимать и рассуждать. «Разум» образует естественную поэтическую пару с «мудростью» и сохраняет олицетворение благодаря мужскому грамматическому роду в русском.
- source_word: תִּתֵּן קוֹלָהּ
  choice: возвышает свой голос
  rationale: Буквально «подаёт свой голос»; выбранная русская формулировка естественно передаёт идиому публичного, слышимого обращения и сохраняет образ голоса.
theological_decisions:
- issue: Олицетворение мудрости и разумения
  choice: Сохранить поэтическое олицетворение абстрактных качеств, не писать их с прописной буквы и не отождествлять с конкретным божественным лицом.
  alternative: Передать «Мудрость» как имя или титул либо устранить олицетворение.
  rationale: Еврейский текст грамматически и литературно олицетворяет мудрость и разумение, но сам этот стих не формулирует более определённого богословского отождествления. Русские грамматические формы следуют роду выбранных существительных, поэтому у «разума» — «свой», а не искусственно женская форма.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Параллелизм двух частей сохранён; порядок маркеров соответствует словам, к которым относятся примечания.
