base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/030.yaml
  text: Then I was beside him[a], like a master workman; and I was his delight day after day, rejoicing before him at all times[b],
translation:
  language: ru
  text: Тогда я была рядом с Ним, как искусный мастер[a], и была Его отрадой изо дня в день, радуясь перед Ним во всякое время[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как малое дитя»; возможно также: «как верная». Значение еврейского слова неясно.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «играя перед Ним во всякое время».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: я была
  rationale: Форма глагола היה в последовательном повествовании описывает состояние Премудрости в прошлом; женский род обусловлен русским словом «Премудрость».
- source_word: אֶצְלוֹ
  choice: рядом с Ним
  rationale: Передаёт значение близости и присутствия, не уточняя сверх текста характер отношений.
- source_word: אָמֹון
  choice: как искусный мастер
  rationale: Слово лексически спорно; в контексте творения значение мастера правдоподобно, однако другие возможные толкования сохранены в примечании.
- source_word: שַׁעֲשֻׁעִים
  choice: Его отрадой
  rationale: Существительное обозначает отраду или предмет наслаждения; притяжательное отношение ясно из контекста и естественно выражается по-русски.
- source_word: יוֹם יוֹם
  choice: изо дня в день
  rationale: Повтор существительного выражает регулярность и непрерывную повторяемость.
- source_word: מְשַׂחֶקֶת
  choice: радуясь
  rationale: Причастие от שׂחק может означать радостную игру, веселье или смех; «радуясь» соответствует возвышенному поэтическому контексту, а более буквальный образ игры дан в примечании.
- source_word: לְפָנָיו
  choice: пред Ним
  rationale: Кратко и точно передаёт пребывание в Его присутствии, сохраняя достоинство поэтического регистра.
- source_word: בְּכָל עֵת
  choice: во всякое время
  rationale: Передаёт всеохватность и постоянство действия.
theological_decisions:
- issue: Роль Премудрости при творении, подразумеваемая словом אָמוֹן
  choice: В основном тексте — «как искусный мастер», с указанием иных чтений в примечании.
  alternative: «как малое дитя» или «как верная воспитанница»
  rationale: Непосредственный контекст допускает образ мастера, однако редкое еврейское слово остаётся спорным. Примечание сохраняет подлинную неоднозначность и не превращает стих в однозначное метафизическое или христологическое утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Заглавные местоимения при обращении к Богу соответствуют принятому русскому библейскому оформлению. Женские формы согласованы с олицетворённой Премудростью из контекста главы.
