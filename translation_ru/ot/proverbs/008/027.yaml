base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/027.yaml
  text: When he established the heavens[a], I was there, when he inscribed a circle on the face of the deep.
translation:
  language: ru
  text: Когда Он утверждал небеса, я была там; когда Он очерчивал круг[a] по поверхности бездны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проводил круговую черту»; еврейский образ может подразумевать горизонт или круговую границу на поверхности вод.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֲכִינוֹ
  choice: когда Он утверждал
  rationale: Предлог בְּ с инфинитивом и местоименным суффиксом имеет здесь временное значение. «Утверждал» передаёт установление и приведение в прочный порядок, уместное в контексте творения.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Традиционное и естественное соответствие еврейской форме множественного числа в космологическом контексте; сохраняет возвышенный поэтический регистр.
- source_word: שָׁם אָ֑נִי
  choice: я была там
  rationale: שָׁם имеет пространственное значение «там». Связка восполнена по нормам русского языка, а женский род обусловлен речью персонифицированной Премудрости в контексте главы.
- source_word: בְּחֻקוֹ
  choice: когда Он очерчивал
  rationale: Форма обозначает действие проведения, начертания или установления границы. «Очерчивал» сохраняет конкретный зрительный образ и сочетается с объектом «круг».
- source_word: חוּג
  choice: круг
  rationale: Прямо передаёт геометрический образ еврейского слова, не сводя его однозначно к горизонту или небесному своду.
- source_word: עַל־פְּנֵי
  choice: над лицом
  rationale: Сохраняет пространственное отношение и поэтическую образность буквального выражения «над/на лице», оставаясь понятным по-русски.
- source_word: תְהוֹם
  choice: бездна
  rationale: В данном контексте означает первозданную водную глубину. «Бездна» — устойчивое русское библейское соответствие без обязательного привнесения позднейших представлений.
theological_decisions:
- issue: Космологический образ в речи Премудрости
  choice: Передать поэтическое описание присутствия Премудрости при творении, сохранив образ круга над первозданной бездной.
  alternative: Истолковать חוּג непосредственно как «горизонт» или «небесный свод» либо выразить в переводе конкретное позднейшее христологическое прочтение Премудрости.
  rationale: Сам стих не уточняет космологическую модель и не разрешает вопрос о дальнейшей богословской идентификации Премудрости; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Заглавное «Он» употреблено как почтительное обозначение Бога; женская форма «была» согласована с персонифицированной Премудростью.
