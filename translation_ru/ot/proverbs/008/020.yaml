lexical_decisions:
- source_word: בְּאֹרַח
  choice: путём
  rationale: Существительное אֹרַח обозначает путь или образ действий. Творительный оборот «путём» естественно передаёт движение по нравственному пути и сохраняет характерную для литературы мудрости метафору.
- source_word: צְדָקָה
  choice: праведности
  rationale: צְדָקָה охватывает значения праведности, справедливости и правоты. «Праведность» сохраняет нравственный оттенок и поэтическое отличие от מִשְׁפָּט во второй строке.
- source_word: אֲהַלֵּךְ
  choice: я хожу
  rationale: Форма глагола הלך описывает продолжающееся или обычное действие. «Я хожу» сохраняет метафору поведения как хождения по пути и речь персонифицированной Мудрости от первого лица.
- source_word: בְּתוֹךְ
  choice: среди
  rationale: בְּתוֹךְ буквально указывает на пребывание внутри или посреди чего-либо. «Среди» звучит естественно по-русски и сохраняет пространственный образ.
- source_word: נְתִיבוֹת
  choice: стезей
  rationale: נְתִיבוֹת означает тропы или пути. Литературное, но понятное слово «стези» поддерживает возвышенный поэтический регистр и отличает этот термин от אֹרַח.
- source_word: מִשְׁפָּט
  choice: правосудия
  rationale: מִשְׁפָּט может означать суд, судебное решение, право или справедливость. «Правосудие» передаёт судебно-общественный оттенок и сохраняет различие с צְדָקָה.
