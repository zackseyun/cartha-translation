lexical_decisions:
- source_word: לְיַד שְׁעָרִים
  choice: У ворот
  rationale: Идиома לְיַד выражает близость — «рядом с, у»; краткое «у ворот» естественно по-русски и сохраняет общественное место действия.
- source_word: לְפִי קָרֶת
  choice: у входа в город
  rationale: Буквально לְפִי — «у устья/рта», но применительно к городу это его вход; такой перевод ясно передаёт пространственный смысл, а буквальный образ отмечен в сноске.
- source_word: מְבוֹא פְתָחִים
  choice: при входе через проёмы
  rationale: מְבוֹא обозначает место или путь входа, а פְתָחִים — отверстия, проходы или дверные проёмы. Формулировка сохраняет оба элемента и не сводит выражение к простому повтору слова «вход».
- source_word: תָּרֹנָּה
  choice: она громко взывает
  rationale: Форма женского рода согласуется с персонифицированной Мудростью; глагол описывает звучный публичный призыв. «Громко взывает» передаёт интенсивность без навязывания эмоционального оттенка крика.
