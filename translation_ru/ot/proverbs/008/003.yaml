    issue: «при входе через проёмы»
    rationale: Предлог «через» описывает движение сквозь проёмы, тогда как מְבוֹא פְתָחִים обозначает вход/место входа у проёмов (ворот).
  - severity: low
    issue: «она громко взывает»
    rationale: В современном русском «взывать» обычно употребляется с адресатом («взывать к кому-либо») или содержанием просьбы; здесь более естествен глагол самостоятельного громкого возглашения.
  - severity: low
    issue: Нет сноски к «у входа в город», хотя в обосновании заявлен буквальный образ «устья/рта».
    rationale: Нужно согласовать сноску и её якорь с лексическим решением לְפִי.
