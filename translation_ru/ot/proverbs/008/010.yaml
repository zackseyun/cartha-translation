  text: Take my instruction instead of silver[b][a], and knowledge rather than choice gold.
translation:
  language: ru
  text: Примите моё наставление, а не серебро[a], и знание — вместо отборного золота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Примите моё наставление вместо серебра». Буквальная форма противопоставления — «а не серебро» — по смыслу призывает предпочесть наставление богатству.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избранного золота»; речь идёт о золоте особо высокого качества и ценности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Примите
  rationale: Повелительная форма множественного числа от לקח. «Примите» естественно передаёт призыв усвоить предлагаемое наставление, а не просто физически взять его.
- source_word: מוּסָרִי
  choice: моё наставление
  rationale: מוּסָר в литературе мудрости обозначает обучение, включающее исправление и дисциплину. В параллели со «знанием» основным здесь является педагогический смысл.
- source_word: וְאַל־כָּסֶף
  choice: а не серебро
  rationale: Формально конструкция выражает отрицательное противопоставление после повеления. Русское «а не серебро» сохраняет его прямую форму, тогда как подразумеваемое предпочтение пояснено в сноске.
- source_word: דַעַת
  choice: знание
  rationale: Обычное значение דַעַת в контексте литературы мудрости; слово естественно соответствует параллельному «наставлению».
- source_word: מֵחָרוּץ
  choice: вместо … золота
  rationale: חָרוּץ здесь означает золото, а предлог מִן выражает сравнение или предпочтение. «Вместо» ясно передаёт призыв предпочесть знание богатству.
- source_word: נִבְחָר
  choice: отборного
  rationale: Страдательное причастие от בחר означает «выбранный, отборный». В сочетании с золотом «отборного» естественно указывает на его особо высокое качество и ценность.
