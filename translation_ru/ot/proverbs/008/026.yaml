  source_fidelity: Временное значение עַד לֹא передано в целом верно, однако «когда Он ещё не создал» слабее выражает предшествование, чем «прежде чем Он создал». Еврейские союзы в перечислении — וְ («и»), поэтому тройное «ни … ни … ни» чрезмерно превращает ряд в отрицательное перечисление. «Частиц праха» неоправданно конкретизирует необычное עָפְרוֹת; безопаснее сохранить образ как «первоначальный прах» и пояснить его в сноске.
