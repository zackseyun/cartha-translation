  terminology: «Земля» и «мир» последовательно передают אֶרֶץ и תֵּבֵל. Для חוּצוֹת сохранён неурбанистический смысл; вариант «улицы» остаётся в сноске как лексическая возможность в иных контекстах. Формулировка о первоначальном прахе не утверждает конкретной космогонической теории.
