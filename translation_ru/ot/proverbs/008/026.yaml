lexical_decisions:
- source_word: עַד לֹא
  choice: когда … ещё не
  rationale: В сочетании с завершённым действием оборот выражает временное предшествование. Русское «когда … ещё не» естественно передаёт смысл «прежде чем» и хорошо связывает стих с предыдущим контекстом.
- source_word: עָשָׂה
  choice: создал
  rationale: Обычное значение глагола — «делать, создавать». В контексте происхождения мира «создал» звучит естественно и точно.
- source_word: אֶרֶץ
  choice: земли
  rationale: Параллель с תֵּבֵל и контекст сотворения указывают на землю в общем, а не на отдельную страну или территорию.
- source_word: חוּצוֹת
  choice: просторов
  rationale: Слово может обозначать внешние или открытые места, а в городской среде — улицы. Здесь «просторы» передаёт не городской, а пространственный смысл и сохраняет широту образа.
- source_word: רֹאשׁ
  choice: первых
  rationale: В сочетании с עָפְרוֹת слово указывает на начало, самую раннюю часть. Прилагательное «первых» естественно передаёт первичность вещества мира.
- source_word: עָפְרוֹת
  choice: частиц праха
  rationale: Форма множественного числа от עָפָר может обозначать скопления, комья или частицы сухой земли. «Частиц праха» сохраняет вещественный образ и делает необычное еврейское выражение понятным по-русски.
- source_word: תֵּבֵל
  choice: мира
  rationale: Слово обозначает мир как устроенную земную область. В данном поэтическом контексте краткое «мира» наиболее естественно.
