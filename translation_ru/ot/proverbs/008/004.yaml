  text: אֲלֵי/כֶ֣ם אִישִׁ֣ים אֶקְרָ֑א וְ֝/קוֹלִ֗/י אֶל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/004.yaml
  text: To you[a], O men, I call, and my voice is to the sons of mankind.
translation:
  language: ru
  text: 'К вам, мужчины, я взываю,

    и голос мой — к сынам человеческим[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть ко всем людям. Буквально: «к сынам человека»; это обычное древнееврейское обозначение человеческого рода.'
    reason: Лексическая альтернатива и пояснение древнееврейского оборота.
lexical_decisions:
- source_word: אֲלֵיכֶם
  choice: К вам
  rationale: Предлог אֶל с суффиксом 2-го лица множественного числа прямо обозначает тех, к кому обращается Мудрость; «к вам» естественно передаёт это обращение.
- source_word: אִישִׁים
  choice: мужчины
  rationale: Редкая множественная форма от אִישׁ здесь имеет мужскую референцию. Современное «мужчины» сохраняет её без архаизма «мужи».
- source_word: אֶקְרָא
  choice: я взываю
  rationale: Форма Qal, 1-е лицо единственного числа от קרא означает громко обращаться, звать. «Взываю» передаёт публичный, возвышенный характер призыва и сочетается с параллельным упоминанием голоса.
- source_word: וְקוֹלִי
  choice: и голос мой
  rationale: Сохранён именной оборот оригинала и его поэтический параллелизм; постпозиция местоимения придаёт строке достойное, но понятное звучание.
- source_word: אֶל
  choice: — к
  rationale: Тире естественно восполняет отсутствующую в еврейской строке связку, а «к» сохраняет направленность голоса к адресатам.
- source_word: בְּנֵי אָדָם
  choice: сынам человеческим
  rationale: Устойчивое библейское выражение сохраняет образ «сынов» и одновременно указывает на человеческий род. Более прямое современное значение пояснено в сноске.
theological_decisions:
- issue: Гендерно маркированный антропологический параллелизм
  choice: «мужчины» и «сыны человеческие»
  alternative: «люди» и «все люди»
  rationale: В первой половине стоит אִישִׁים, обозначающее мужчин, тогда как בְּנֵי אָדָם — обычное родовое обозначение людей. Перевод сохраняет различие и напряжение между конкретно мужским обращением и более широким вторым выражением, не сводя обе части к одному нейтральному слову.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. «Мужчины» выбрано вместо архаичного «мужи»; эллиптическая конструкция «голос мой — к...» сохраняет сжатость и параллелизм еврейского стиха.
