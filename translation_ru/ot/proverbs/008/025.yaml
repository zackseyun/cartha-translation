  text: בְּ/טֶ֣רֶם הָרִ֣ים הָטְבָּ֑עוּ לִ/פְנֵ֖י גְבָע֣וֹת חוֹלָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/025.yaml
  text: Before the mountains were settled[a], before the hills, I was brought forth.
translation:
  language: ru
  text: Прежде чем горы были утверждены, до появления холмов я была рождена.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «была произведена на свет» или «была порождена». Еврейское слово использует образ рождения или появления на свет применительно к олицетворённой Премудрости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Прежде чем
  rationale: Естественно передаёт временное предшествование и вводит придаточную конструкцию с глаголом.
- source_word: הָרִים
  choice: горы
  rationale: Обычный современный эквивалент; определённость в русском здесь не требует отдельного выражения.
- source_word: הָטְבָּעוּ
  choice: были утверждены
  rationale: Хофаль от טבע описывает горы как прочно помещённые или закреплённые; «утверждены» сохраняет созидательный образ и звучит поэтически естественно.
- source_word: לִפְנֵי
  choice: прежде
  rationale: Употреблено во временном значении и поддерживает параллелизм первой строки.
- source_word: גְבָעוֹת
  choice: холмов
  rationale: Прямой современный эквивалент, сохраняющий поэтическую пару «горы — холмы»; эллипсис глагола соответствует еврейскому тексту.
- source_word: חוֹלָלְתִּי
  choice: я была рождена
  rationale: Форма передаёт образ рождения или появления на свет. Женский род согласуется с персонифицированной Премудростью; формулировка сохраняет образ происхождения, не вводя более узкого догматического термина «рождена» в смысле «порождена Отцом».
theological_decisions:
- issue: Как передать язык происхождения персонифицированной Премудрости, не предрешая позднейшие христологические толкования
  choice: я была рождена
  alternative: я была произведена; я была порождена
  rationale: «Была рождена» прямо сохраняет родовой образ еврейского חוֹלָלְתִּי и остаётся естественным по-русски. «Порождена» может восприниматься как более догматически нагруженное, а «произведена» ослабляет образ рождения.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и достоинства речи. Эллиптическое «прежде холмов» воспроизводит сжатость еврейской строки; женский род относится к Премудрости.
