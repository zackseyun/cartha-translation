id: PRO.8.29
reference: Proverbs 8:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/שׂ֘וּמ֤/וֹ לַ/יָּ֨ם חֻקּ֗/וֹ וּ֭/מַיִם לֹ֣א יַֽעַבְרוּ פִ֑י/ו בְּ֝/חוּק֗/וֹ מ֣וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/029.yaml
  text: when he set a boundary for the sea[a], so that the waters would not transgress his command, when he marked out the foundations of the earth[b],
translation:
  language: ru
  text: когда Он установил морю предел[a], чтобы воды не преступали Его повеления[b], когда Он начертал основания земли,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «установление» или «предписание»; здесь оно обозначает назначенный морю неизменный предел.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Его уст», то есть повеления, произнесённого Его устами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמוֹ
  choice: когда Он установил
  rationale: Предлог בְּ при инфинитиве construct שׂוּם с местоименным суффиксом в данном контексте образует временную конструкцию. «Установил» естественно сочетается с назначением морю предела.
- source_word: לַיָּם
  choice: морю
  rationale: Предлог לְ обозначает адресата установленного ограничения; русский дательный падеж передаёт это кратко и естественно.
- source_word: חֻקּוֹ
  choice: предел
  rationale: חֹק может обозначать постановление, установленную норму или фиксированную границу. В контексте моря конкретное «предел» сохраняет образ упорядочения творения, тогда как примечание отмечает оттенок властного установления.
- source_word: וּמַיִם לֹא יַעַבְרוּ
  choice: чтобы воды не преступали
  rationale: Связка וּ с отрицательной глагольной формой здесь естественно передаётся целевой или результативной конструкцией. «Преступали» сочетается с «повелением» и одновременно сохраняет образ перехода за установленную черту.
- source_word: פִּיו
  choice: Его повеления
  rationale: Буквально «Его уст». Это метонимия сказанного устами — повеления. Такой перевод понятен по-русски и сохраняет идею властного слова; буквальный образ отмечен в сноске.
- source_word: בְּחוּקוֹ
  choice: когда Он начертал
  rationale: Предлог בְּ при инфинитиве construct חקק вновь имеет временное значение. Глагол חקק может означать вырезать, начертывать или устанавливать; «начертал» сохраняет поэтический образ определения устройства земли.
- source_word: מוֹסְדֵי אָרֶץ
  choice: основания земли
  rationale: Прямо передаёт конструкцию сопряжённого состояния и сохраняет древнееврейский космологический образ.
theological_decisions:
- issue: Образ творения в речи Премудрости
  choice: Передать стих как описание того, как Бог упорядочивает творение, сохранив конкретные образы моря и оснований земли.
  alternative: Истолковать всё лишь как отвлечённую метафору порядка либо внести в основной текст позднейшие христологические выводы.
  rationale: Еврейский текст поэтически изображает установление Богом порядка творения, но сам этот стих не формулирует более поздних богословских отождествлений.
- issue: Соотношение границы и повеления
  choice: 'Сохранить оба оттенка: морю назначен «предел», а воды не преступают Божьего «повеления».'
  alternative: Последовательно передать оба выражения только как пространственную границу или только как юридический указ.
  rationale: Слова חֹק и פֶּה создают напряжение между физической границей и властным словом; перевод не должен устранять ни один из этих смыслов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической лексикой. Заглавные местоимения «Он», «Его» ясно указывают на Бога и соответствуют принятому благоговейному регистру. Синтаксический параллелизм двух оборотов «когда Он…» сохранён; конечная запятая отражает продолжение предложения в следующем стихе.
