  yaml_path: translation/ot/proverbs/008/012.yaml
  text: I[a], wisdom, dwell with prudence, and I find knowledge and discretion.
translation:
  language: ru
  text: Я, мудрость, живу вместе с благоразумием[a] и нахожу знание и рассудительность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я, мудрость, поселилась рядом с благоразумием и нашла знание и рассудительность». Еврейская глагольная форма допускает перевод прошедшим временем. Слово מְזִמּוֹת может также означать «замыслы», «планы» или «рассудительность» — в зависимости от контекста.'
    reason: Лексическая и временная альтернативы.
lexical_decisions:
- source_word: חָכְמָה
  choice: мудрость
  rationale: Существительное означает «мудрость». Строчная буква сохраняет поэтическое олицетворение, не превращая его в собственное имя.
- source_word: שָׁכַנְתִּי
  choice: живу
  rationale: Глагол שׁכן означает «жить, обитать». Настоящее время естественно передаёт постоянную связь олицетворённой мудрости с благоразумием; допустимое перфектное прочтение отмечено в сноске.
- source_word: עָרְמָה
  choice: благоразумие
  rationale: В положительном контексте Притчей слово обозначает практическую осмотрительность и здравую проницательность, а не коварство.
- source_word: דַעַת
  choice: знание
  rationale: Обычное значение существительного; перевод сохраняет его отличие от мудрости.
- source_word: מְזִמּוֹת
  choice: рассудительность
  rationale: В литературе мудрости слово может обозначать рассудительность и способность обдумывать действия; возможные значения «замыслы» и «планы» отражены в сноске.
- source_word: אֶמְצָא
  choice: обретаю
  rationale: מצא буквально означает «находить», а в данном сочетании «обретаю» звучит естественно и сохраняет образ достижения или нахождения знания.
- source_word: וְ
  choice: и
  rationale: Союз прямо связывает две части изречения без добавочного смыслового оттенка.
theological_decisions:
- issue: Олицетворение мудрости
  choice: Передать мудрость как говорящую олицетворённую фигуру, сохранив строчную букву.
  alternative: Написать «Мудрость» с прописной буквы либо придать выражению прямой христологический смысл.
  rationale: В Притчах 8 мудрость поэтически олицетворена, однако сам стих не требует отождествлять её с конкретной божественной Личностью.
- issue: Связь слов דַעַת מְזִמּוֹת
  choice: Передать как «знание и рассудительность» в соответствии с возможным смысловым развёртыванием тесного еврейского сочетания.
  alternative: Перевести формально как «знание замыслов» или «знание планов».
  rationale: Сочетание допускает конструктивное прочтение, однако в положительном параллелизме контекста מְזִמּוֹת обозначает благоразумную способность обдумывать действия. Альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная формулировка сохраняет поэтическое олицетворение. «Благоразумие» выбрано вместо потенциально отрицательных «хитрость» или «лукавство».
