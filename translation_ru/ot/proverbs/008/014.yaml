source:
  edition: WLC
  text: לִֽ/י עֵ֭צָה וְ/תוּשִׁיָּ֑ה אֲנִ֥י בִ֝ינָ֗ה לִ֣/י גְבוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/014.yaml
  text: Counsel and sound wisdom are mine[a]; I am understanding; strength is mine.
translation:
  language: ru
  text: У меня совет и здравомыслие[a]; я — разум, у меня сила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «действенная мудрость».'
    reason: Еврейское слово תוּשִׁיָּה может подчёркивать не только здравость суждения, но и практическую действенность мудрости.
lexical_decisions:
- source_word: עֵצָה
  choice: совет
  rationale: В литературе мудрости слово обозначает обдуманный совет или разумное руководство; «совет» сохраняет возвышенную речь олицетворённой Мудрости.
- source_word: תוּשִׁיָּה
  choice: здравомыслие
  rationale: Слово может обозначать здравую, действенную мудрость, практическую рассудительность или способность добиваться результата. «Здравомыслие» естественно по-русски передаёт основную идею, не сводя её к материальному успеху.
- source_word: אֲנִי בִינָה
  choice: я — разум
  rationale: Бессвязочная именная конструкция отождествляет говорящую Мудрость с разумом, а не просто сообщает, что она им обладает. Тире ясно передаёт это отождествление по-русски.
- source_word: גְּבוּרָה
  choice: сила
  rationale: Широкое значение слова — сила или могущество. «Сила» здесь естественна и не вносит излишне воинского оттенка.
- source_word: לִי ... לִי
  choice: у меня ... у меня
  rationale: Повтор передаёт подчёркнутое обладание и сохраняет поэтический параллелизм еврейского текста.
theological_decisions:
- issue: Олицетворение Мудрости
  choice: Сохранена речь Мудрости от первого лица без дополнительного богословского отождествления.
  alternative: Передать стих как прямое высказывание Христа или иной определённой личности.
  rationale: В Притчах 8 Мудрость выступает как олицетворённая говорящая. Перевод сохраняет литературно-богословскую форму еврейского текста и не разрешает более широкий христологический спор внутри самого перевода.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим ритмом. Формула «я — разум» намеренно сохраняет сильное отождествление, а повтор «у меня» — структуру и акцент оригинала.
