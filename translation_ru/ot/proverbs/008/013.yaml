base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/013.yaml
  text: The fear of Yahweh is to hate evil[a]; pride and arrogance and the way of evil and a mouth of perversions I hate.
translation:
  language: ru
  text: Страх перед Яхве — ненавидеть зло; гордость, высокомерие, путь зла и уста, говорящие превратное, я ненавижу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. «уста превратностей»; также возможно: «извращённые уста» или «уста, говорящие кривое».'
    reason: Сноска отмечает буквальный образ и возможные способы передать תַהְפֻּכוֹת («превратности», «кривое», «искажённое») без сужения смысла до одной лишь лжи.
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: бояться Яхве
  rationale: Еврейское сочетание обозначает благоговейный страх перед Яхве. Глагольная формулировка естественна по-русски и хорошо сочетается с последующим инфинитивом; личное имя передано транслитерацией.
- source_word: שְׂנֹאת רָע
  choice: значит ненавидеть зло
  rationale: Инфинитивная конструкция раскрывает, в чём проявляется страх перед Яхве. Перевод сохраняет глагольную силу выражения и его нравственный смысл.
- source_word: גֵּאָה וְגָאוֹן
  choice: гордость, высокомерие
  rationale: Два близких по значению существительных сохранены как отдельные пороки; второе передано словом «высокомерие», чтобы отразить смысл надменного превозношения и избежать полного повтора.
- source_word: דֶרֶךְ רָע
  choice: злой путь
  rationale: Сохранена библейская метафора пути как образа образа жизни и поведения; прилагательное «злой» передаёт нравственную оценку.
- source_word: פִי תַהְפֻּכוֹת
  choice: извращённую речь
  rationale: Буквальный образ «уст превратностей» в современном русском звучит неестественно. Контекстуальный перевод передаёт речь, искажающую истину или нравственно превратную; буквальная форма отмечена в сноске.
- source_word: שָׂנֵאתִי
  choice: я ненавижу
  rationale: Форма перфекта первого лица в речи о постоянной позиции Мудрости естественно передаётся русским настоящим временем.
theological_decisions:
- issue: Кто говорит от первого лица в рассуждении о Мудрости
  choice: Сохранить «я ненавижу» без пояснения личности говорящего.
  alternative: Добавить «Мудрость говорит» или отождествить говорящего с Богом.
  rationale: Еврейский текст оставляет первое лицо внутри речи персонифицированной Мудрости. Явное отождествление разрешило бы литературно-богословскую напряжённость, которой сам стих не разрешает.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным пословичным ритмом. Тире делает раскрытие смысла первой фразы ясным, а порядок слов в заключении сохраняет выразительное ударение на «я ненавижу».
