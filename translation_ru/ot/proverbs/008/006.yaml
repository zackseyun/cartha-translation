lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе призывает не просто услышать, а внимательно слушать; это естественно выражается современным русским «слушайте».
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание призыва слушать. «Ведь» кратко и естественно передаёт пояснительно-причинную связь.
- source_word: נְגִידִים
  choice: о благородном
  rationale: В данном поэтическом контексте слово, связанное с княжеским достоинством и знатностью, обозначает возвышенное и достойное содержание речи, а не людей-правителей.
- source_word: אֲדַבֵּר
  choice: я буду говорить
  rationale: Имперфект первого лица указывает здесь на предстоящую речь Премудрости после призыва слушать.
- source_word: וּמִפְתַּח שְׂפָתַי
  choice: и, когда разомкнутся мои уста, прозвучит
  rationale: Еврейский образ буквально означает «открытие моих губ». Русская формулировка сохраняет телесно-поэтический образ, но избегает неестественного оборота «открытие моих уст».
- source_word: מֵישָׁרִים
  choice: правое
  rationale: Множественное абстрактное существительное обозначает прямоту и нравственную правильность. Субстантивированное «правое» естественно по-русски передаёт содержание речи и сохраняет нравственный смысл.
