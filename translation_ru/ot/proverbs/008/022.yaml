base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/022.yaml
  text: Yahweh possessed me at the beginning of his way[a], before his works of old.
translation:
  language: ru
  text: Яхве имел меня в начале Своего пути[a], прежде Своих древних дел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Яхве создал меня» или «Яхве приобрёл меня». Еврейский глагол имеет несколько значений. Этот стих занимал важное место в исторических спорах об олицетворённой Мудрости и её отношении к Сыну.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: קָנָנִי
  choice: обладал мною
  rationale: Глагол קנה допускает значения «приобретать», «обладать» и в некоторых контекстах «создавать». Основной вариант сохраняет смысл обладания, не превращая спорное значение «создал» в однозначное утверждение; другие возможности указаны в сноске.
- source_word: רֵאשִׁית
  choice: в начале
  rationale: В сочетании с последующим оборотом естественно выражает временное начало.
- source_word: דַּרְכּוֹ
  choice: Своего пути
  rationale: Сохраняет широкий образ «пути» как хода или порядка Божьей деятельности, не сужая его толкованием.
- source_word: קֶדֶם
  choice: прежде
  rationale: В данном контексте обозначает временное предшествование.
- source_word: מִפְעָלָיו
  choice: Своих деяний
  rationale: Передаёт дела или произведения Яхве; «деяния» уместно в возвышенной поэтической речи и не ограничивает смысл только материальным творением.
- source_word: מֵאָז
  choice: древних времён
  rationale: Выражает отдалённую древность и вместе с «прежде» указывает на изначальную, допредельную перспективу.
theological_decisions:
- issue: Перевод קָנָנִי в стихе, исторически связанном с христологическими спорами
  choice: обладал мною
  alternative: создал меня; приобрёл меня
  rationale: В Притчах говорит олицетворённая Мудрость, а сам стих прямо не отождествляет её с Сыном. Поэтому основной текст не должен заранее разрешать позднейший богословский спор. Выбран сильный лексический вариант, а существенные альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавная буква в возвратном местоимении «Своего» ясно указывает на Яхве. Формулировка сохраняет образность и богословскую неоднозначность еврейского текста.
