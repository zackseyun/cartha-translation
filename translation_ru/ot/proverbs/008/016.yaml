base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/016.yaml
  text: By me rulers rule[a], and nobles, all judges of righteousness.
translation:
  language: ru
  text: Мною правят правители и вельможи — все, кто вершит справедливый суд.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все судьи справедливости». Еврейское צֶדֶק может означать как судебную справедливость, так и нравственную правоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Мною
  rationale: 'Предлог ב с суффиксом первого лица здесь выражает средство или посредничество: правители осуществляют власть посредством Мудрости. Творительный падеж краток и естественен по-русски.'
- source_word: שָׂרִים
  choice: правители
  rationale: Слово обозначает князей или высокопоставленных должностных лиц. «Правители» передаёт функцию власти, не ограничивая значение царскими сыновьями.
- source_word: יָשֹׂרוּ
  choice: правят
  rationale: Глагол שׂרר означает «править, властвовать». «Правят» сохраняет лаконизм и словесное созвучие с «правители», соответствующее еврейской фразе.
- source_word: וּנְדִיבִים
  choice: знатные
  rationale: Существительное обозначает людей высокого положения, знатных и влиятельных. Субстантивированное «знатные» звучит современно и отличает эту группу от предшествующих правителей.
- source_word: כָּל
  choice: все
  rationale: Квантор явно сохранён и вводит итоговое либо пояснительное определение знатных.
- source_word: שֹׁפְטֵי צֶדֶק
  choice: судьи, творящие правду
  rationale: Еврейское сочетание буквально говорит о «судьях правды/справедливости». Русское «судьи правды» неестественно, а «праведные судьи» превращает существительное в прилагательное; причастная конструкция передаёт осуществление правого и справедливого суда.
- source_word: צֶדֶק
  choice: правду
  rationale: צֶדֶק охватывает нравственную правоту и судебную справедливость. «Правду» сохраняет более широкий этический оттенок, а судебное «справедливость» отмечено как возможный вариант.
theological_decisions:
- issue: Роль Мудрости в осуществлении политической и судебной власти
  choice: Стих утверждает, что правители и судьи осуществляют надлежащее управление посредством Мудрости.
  alternative: Понимать стих как безусловное утверждение, что Мудрость прямо одобряет всякую существующую власть.
  rationale: Конструкция בִּי представляет Мудрость как средство правильного правления, но сама по себе не утверждает нравственную законность каждого конкретного правителя.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Повтор «правят правители» намеренно сохраняет соответствующую словесную связь еврейских שָׂרִים и יָשֹׂרוּ. Тире помогает естественно прочитать заключительную фразу как пояснение к «знатным».
