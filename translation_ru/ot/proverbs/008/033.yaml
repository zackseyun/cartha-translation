  text: שִׁמְע֖וּ מוּסָ֥ר וַ/חֲכָ֗מוּ וְ/אַל תִּפְרָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/033.yaml
  text: Hear instruction and become wise[a], and do not neglect it.
translation:
  language: ru
  text: Слушайте наставление и становитесь мудрыми; не пренебрегайте им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отвергайте его»; или: «не оставляйте его». Еврейский глагол может означать отказ от наставления или пренебрежение им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Императив множественного числа передаёт внимательное восприятие, способное подразумевать послушание, но не сводит значение прямо к «повинуйтесь».
- source_word: מוּסָר
  choice: наставление
  rationale: В литературе мудрости слово обозначает формирующее обучение, в том числе исправление и дисциплину; «наставление» естественно и не придаёт выражению излишне карательного оттенка.
- source_word: וַחֲכָמוּ
  choice: и становитесь мудрыми
  rationale: Императив от חכם здесь выражает обретение мудрости, а не только уже имеющееся состояние.
- source_word: וְאַל תִּפְרָעוּ
  choice: не пренебрегайте им
  rationale: Глагол פרע может означать оставлять, отбрасывать или пренебрегать; местоимение «им» делает явным подразумеваемый объект — наставление.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Форма множественного числа сохраняет обращение еврейского текста; точка с запятой передаёт координацию двух повелений. Маркер сноски помещён после относящейся к ней заключительной части стиха.
