  text: נְצֹ֣ר בְּ֭נִ/י מִצְוַ֣ת אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/020.yaml
  text: Keep[a], my son, your father's commandment, and do not forsake your mother's instruction.
translation:
  language: ru
  text: Храни, сын мой, заповедь отца твоего и не оставляй наставления матери твоей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: Храни
  rationale: Повелительная форма глагола נצר означает бережно хранить, оберегать и соблюдать. «Храни» передаёт как идею сохранения, так и подразумеваемое послушание.
- source_word: בְּנִי
  choice: сын мой
  rationale: Еврейское выражение прямо обозначает сына в мужском роде и естественно звучит в русском наставительном обращении.
- source_word: מִצְוַת
  choice: заповедь
  rationale: מִצְוָה означает повеление или заповедь. «Заповедь» сохраняет вес и обязательность родительского предписания, не сводя его к общему совету.
- source_word: אָבִיךָ
  choice: отца твоего
  rationale: Форма с суффиксом второго лица единственного числа передана естественной для возвышенной русской речи конструкцией, поддерживающей параллелизм стиха.
- source_word: תִּטֹּשׁ
  choice: не оставляй
  rationale: Глагол נטש означает оставлять, бросать, покидать. «Не оставляй» точно передаёт запрет и звучит современнее, чем более книжное «не покидай» в сочетании с наставлением.
- source_word: תּוֹרַת
  choice: наставления
  rationale: В контексте родительской мудрости תּוֹרָה обозначает не свод законов, а формирующее учение или наставление. Русское «наставление» сохраняет этот смысл.
- source_word: אִמֶּךָ
  choice: матери твоей
  rationale: Передаёт принадлежность и сохраняет синтаксический и поэтический параллелизм с выражением «отца твоего».
theological_decisions:
- issue: Значение תּוֹרָה в родительском наставлении
  choice: наставление
  alternative: закон
  rationale: Контекст говорит об учении матери в семейной среде, поэтому «наставление» точнее «закона» и не вносит представление о формально кодифицированном законодательстве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, афористичным регистром книги Притч. Сохранены обращение «сын мой» и параллелизм между заповедью отца и наставлением матери.
