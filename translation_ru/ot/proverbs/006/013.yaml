  rationale: Редкий глагол допускает разные толкования точного движения, но параллелизм с жестами глаз и пальцев ясно указывает на невербальный сигнал. Обобщённый перевод сохраняет эту определённость, не уточняя сомнительную форму жеста.
- source_word: בְּרַגְלוֹ
  choice: ногой
  rationale: Сохранено морфологически выраженное единственное число еврейского текста.
- source_word: מֹרֶה
  choice: указывает
  rationale: Хотя глагол может означать «учить» или «направлять», сочетание с пальцами и ряд телесных жестов поддерживают физическое значение «указывать».
- source_word: בְּאֶצְבְּעֹתָיו
  choice: пальцами
  rationale: Множественное число и инструментальное значение переданы непосредственно.
