  text: וְ֭/נִמְצָא יְשַׁלֵּ֣ם שִׁבְעָתָ֑יִם אֶת כָּל ה֖וֹן בֵּית֣/וֹ יִתֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/031.yaml
  text: Yet if he is found[a], he must repay sevenfold; he must give all the wealth of his house.
translation:
  language: ru
  text: Но если его поймают, он возместит всемеро[a], отдаст всё достояние своего дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь раз». Еврейское выражение может обозначать семикратное возмещение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצָא
  choice: Но если его поймают
  rationale: 'Союз передаёт противопоставление предыдущему стиху, а нифаль глагола מצא — обнаружение или поимку вора. Условная формулировка естественна по-русски и сохраняет смысл: несмотря на снисхождение к голодному вору, после поимки он обязан возместить ущерб.'
- source_word: יְשַׁלֵּם
  choice: он возместит
  rationale: Пиэль глагола שלם здесь означает возмещение ущерба. Будущее время в контексте мудрого изречения передаёт закономерное следствие и обязательность, не добавляя отсутствующего в тексте модального глагола.
- source_word: שִׁבְעָתָיִם
  choice: всемеро
  rationale: Наречное числительное обозначает семикратное возмещение. «Всемеро» кратко, естественно и соответствует возвышенному стилю книги Притчей; возможная передача «семь раз» отмечена в сноске.
- source_word: אֶת כָּל הוֹן בֵּיתוֹ
  choice: всё достояние своего дома
  rationale: הוֹן означает богатство, имущество или состояние. «Достояние своего дома» сохраняет конструкцию оригинала и может охватывать всё имущество домохозяйства.
- source_word: יִתֵּן
  choice: отдаст
  rationale: נתן здесь обозначает передачу имущества в уплату. «Отдаст» естественно передаёт конкретное действие и сохраняет параллелизм с «возместит».
theological_decisions:
- issue: Соотношение семикратного возмещения и всего имущества дома
  choice: Сохранены как два последовательных утверждения без попытки юридически согласовать их.
  alternative: Истолковать вторую строку лишь как пояснение того, каким образом выплачивается семикратная сумма.
  rationale: Еврейский текст допускает напряжение между установленным размером возмещения и возможной утратой всего состояния; перевод не должен устранять его толкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным ритмом изречения. «Поймают» понятно обычному читателю, «достояние» сохраняет поэтическую возвышенность, не становясь архаизмом.
