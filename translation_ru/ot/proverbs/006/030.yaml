lexical_decisions:
- source_word: יָב֣וּזוּ
  choice: презирают
  rationale: Глагол בוז означает относиться с презрением; «презирать» естественно передаёт социально-нравственную оценку в этом изречении.
- source_word: לַגַּנָּב
  choice: вора
  rationale: Хотя существительное в еврейском тексте определённое, в пословичном контексте оно обозначает типичного представителя; русский винительный «вора» естественно сохраняет обобщённый смысл.
- source_word: כִּי יִגְנֹב
  choice: если он крадёт
  rationale: כִּי вводит обстоятельство, при котором справедливо утверждение; «если» ясно передаёт возможный условный оттенок.
- source_word: לְמַלֵּא נַפְשׁוֹ
  choice: чтобы насытиться
  rationale: Буквально выражение означает «наполнить свою нефеш»; в контексте голода оно идиоматически указывает на утоление телесной потребности.
- source_word: נַפְשׁוֹ
  choice: насытиться
  rationale: נֶפֶשׁ может обозначать самого человека, жизнь или аппетит; возвратная конструкция «насытиться» естественно выражает смысл в данном контексте, а буквальная образность сохранена в примечании.
- source_word: כִּי יִרְעָב
  choice: когда голоден
  rationale: Заключительная часть указывает на обстоятельство или причину кражи; «когда» естественно сохраняет ситуативное прочтение, а причинное отмечено в сноске.
