  yaml_path: translation/ot/proverbs/006/021.yaml
  text: Bind them on your heart continually[b][a]; tie them around your neck.
translation:
  language: ru
  text: Привяжи их к своему сердцу навсегда, надень их на свою шею.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повяжи их на шею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: храни их
  rationale: Буквально глагол означает «свяжи их». В сочетании с сердцем образно выражает необходимость постоянно удерживать наставления внутри себя; по-русски «храни» естественно передаёт этот смысл, не повторяя глагол второй строки.
- source_word: לִבְּךָ
  choice: в своём сердце
  rationale: Сохраняет древнееврейский образ сердца как средоточия мыслей, воли и внутренней жизни.
- source_word: תָמִיד
  choice: всегда
  rationale: Передаёт постоянство и непрерывную привычную верность наставлениям; это современный и ясный русский эквивалент.
- source_word: עָנְדֵם
  choice: повяжи их
  rationale: Глагол обозначает надевание или закрепление украшения. «Повяжи» сохраняет конкретный образ прикрепления к шее, тогда как «носи» было бы несколько более истолковывающим.
- source_word: גַּרְגְּרֹתֶךָ
  choice: себе на шею
  rationale: В данном образе речь идёт о шее как месте ношения подвески или украшения; «шея» естественнее русского «горло».
