  language: ru
  text: Может ли человек ходить по раскалённым углям и не обжечь себе ноги?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если человек ходит по раскалённым углям, разве он не обожжёт себе ноги?» Еврейский текст начинается словом אִם («если»), которое здесь, в параллели с предыдущим стихом, вводит риторический вопрос.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Может ли
  rationale: Хотя אִם обычно означает «если», в параллельной последовательности Притч 6:27–28 оно вводит риторический вопрос. «Может ли» естественно передаёт эту функцию по-русски; буквальная условная формулировка отмечена в сноске.
- source_word: יְהַלֵּךְ
  choice: ходить
  rationale: Форма глагола הלך обозначает хождение или передвижение; несовершенный вид «ходить» соответствует обобщённому образу в риторическом вопросе.
- source_word: אִישׁ
  choice: человек
  rationale: Здесь существительное мужского рода обозначает отдельного человека в общем нравоучительном примере. Русское «человек» точно и естественно передаёт это значение.
- source_word: עַל הַגֶּחָלִים
  choice: по раскалённым углям
  rationale: Предлог עַל при глаголе движения естественно передаётся как «по», а גֶּחָלִים означает горящие или тлеющие угли. «Раскалённым» ясно выражает подразумеваемый жар, вызывающий ожог.
- source_word: וְרַגְלָיו לֹא תִכָּוֶינָה
  choice: и не обжечь ног
  rationale: כוה в нифале означает «быть обожжённым». В русской конструкции с «может ли» естественный инфинитив «не обжечь» сохраняет риторический смысл; родительный множественного «ног» обусловлен отрицанием и соответствует еврейскому множественному числу.
