  yaml_path: translation/ot/proverbs/006/035.yaml
  text: He will accept no ransom[a] and will not be persuaded, no matter how large the bribe.
translation:
  language: ru
  text: Он не примет никакого выкупа[a] и не уступит, как бы ты ни увеличивал взятку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возмещения». Буквально в еврейском тексте: «не поднимет лица никакого выкупа» — идиома, означающая отказ принять плату или оказать благосклонность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשָּׂא פְּנֵי
  choice: не примет
  rationale: Буквально «не поднимет лица»; в сочетании с платежом идиома означает отказ принять его и оказать благосклонность.
- source_word: כָל כֹּפֶר
  choice: никакого выкупа
  rationale: כֹּפֶר обозначает плату, призванную освободить от последствий или возместить ущерб; «выкуп» сохраняет основную силу слова, а более широкое значение отмечено в сноске.
- source_word: לֹא יֹאבֶה
  choice: не уступит
  rationale: Глагол выражает отсутствие желания или согласия. В данном контексте «не уступит» естественно передаёт отказ изменить решение под воздействием денег, не смещая смысл к эмоциональному удовлетворению.
- source_word: כִּי תַרְבֶּה שֹׁחַד
  choice: сколько бы ты ни предлагал взяток
  rationale: Передаёт уступительный смысл оборота и идею увеличения предлагаемой взятки. Русское множественное число здесь идиоматично обозначает любые всё более крупные предложения подкупа.
