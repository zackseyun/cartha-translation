    reason: cultural_note
lexical_decisions:
- source_word: יָפִיחַ
  choice: извергающий
  rationale: Глагол буквально связан с выдыханием, а в данном контексте образно обозначает произнесение или исторжение слов. «Извергающий» сохраняет яркость образа и звучит естественнее, чем буквальное «выдыхающий».
- source_word: כְּזָבִים
  choice: ложь
  rationale: Форма множественного числа обозначает ложные утверждения; русское собирательное «ложь» естественно передаёт смысл и нравственную оценку.
- source_word: עֵד שָׁקֶר
  choice: лжесвидетель
  rationale: Устойчивое русское слово точно передаёт судебно-нравственный смысл сочетания «свидетель лжи».
- source_word: וּמְשַׁלֵּחַ
  choice: и тот, кто сеет
  rationale: Буквально причастие означает «посылающий, распространяющий». В сочетании с раздорами русское выражение «сеет раздоры» естественно передаёт активное разжигание и распространение вражды, хотя меняет исходную метафору.
- source_word: מְדָנִים
  choice: раздоры
  rationale: Слово обозначает распри, пререкания и конфликты; «раздоры» кратко, весомо и привычно для литературы мудрости.
- source_word: בֵּין אַחִים
  choice: между братьями
  rationale: Передаёт буквальную пространственно-реляционную конструкцию и сохраняет мужской род исходного существительного; более широкий общинный смысл пояснён в сноске.
theological_decisions:
- issue: Объём значения אַחִים и его грамматический род
  choice: братьями
  alternative: родными; близкими членами общины
  rationale: В еврейском тексте стоит существительное мужского рода множественного числа «братья». Оно может обозначать как родных братьев, так и более широкий круг близких членов сообщества; перевод сохраняет исходную форму, не сужая её пояснением в основном тексте.
translation_notes:
  register: Современный литературный русский язык с кратким и весомым звучанием перечня. Сохранена яркая речевая метафора первой половины; во второй использована естественная русская идиома «сеять раздоры». Все маркеры сносок размещены непосредственно при поясняемых выражениях.
