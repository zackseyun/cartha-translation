  language: ru
  text: лжесвидетель, изрекающий ложь[a], и тот, кто сеет раздоры между братьями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лживый свидетель, произносящий неправду».'
