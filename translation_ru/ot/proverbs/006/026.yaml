base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/026.yaml
  text: For because of a prostitute one is reduced to a loaf of bread[c][b][a], but a married woman hunts a precious life.
translation:
  language: ru
  text: Ибо из-за блудницы человек остаётся лишь с куском хлеба[a], а чужая жена ловит в сеть драгоценную жизнь[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ибо из-за блудницы — до куска хлеба». Еврейская фраза сжата; обычно её понимают в том смысле, что связь с блудницей доводит человека до нищеты.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жена мужчины», то есть в данном контексте жена другого мужчины.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «драгоценную душу» либо «самого человека». Еврейское слово может означать душу, самого человека или его жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит основание предшествующего предостережения; русское «ибо» естественно передаёт пояснительно-причинную связь без избыточного удвоения союза.
- source_word: בְעַד אִשָּׁה זוֹנָה
  choice: из-за блудницы
  rationale: Предлог передаёт причину или последствие, а זוֹנָה обозначает женщину, занимающуюся проституцией. «Блудница» здесь кратко, понятно и стилистически уместно для библейской поэзии.
- source_word: עַד כִּכַּר לָחֶם
  choice: человек остаётся лишь с куском хлеба
  rationale: Еврейская фраза предельно сжата и буквально означает движение «до хлебной лепёшки»; перевод выражает обычно предполагаемое обнищание, сохраняя образ хлеба. «Кусок хлеба» по-русски естественнее буквальной «круглой лепёшки хлеба».
- source_word: וְאֵשֶׁת אִישׁ
  choice: а чужая жена
  rationale: Буквально «жена мужчины». В контексте речь о жене другого мужчины; «чужая жена» ясно передаёт ситуацию прелюбодеяния, не называя саму женщину «прелюбодейкой» сверх формулировки оригинала.
- source_word: נֶפֶשׁ יְקָרָה
  choice: драгоценной жизнью
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека. В контексте смертельной опасности «жизнь» подходит лучше всего, а «драгоценная» сохраняет значение יְקָרָה.
- source_word: תָצוּד
  choice: охотится за
  rationale: Глагол создаёт яркий образ охоты или ловли добычи; русское сочетание «охотится за жизнью» сохраняет метафору и женский субъект.
theological_decisions:
- issue: Значение נֶפֶשׁ в предупреждении
  choice: жизнь
  alternative: душа; сам человек
  rationale: Контекст допускает более широкий смысл личности, однако угроза жизни лучше всего соответствует образу хищной охоты; неоднозначность отмечена в сноске.
- issue: Эллипсис первой строки
  choice: выразить подразумеваемое обнищание словами «человек остаётся лишь с куском хлеба»
  alternative: 'буквально: «из-за блудницы — до куска хлеба»'
  rationale: Оригинал не называет подлежащего и не формулирует результат полностью. Основной текст делает вероятный смысл понятным, а сноска сохраняет буквальную сжатость и возможность иной трактовки.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Сохранены параллелизм, контраст между блудницей и чужой женой и метафора охоты. Основной текст проясняет эллиптическую первую строку, а буквальная форма и семантическая широта נֶפֶשׁ вынесены в сноски.
