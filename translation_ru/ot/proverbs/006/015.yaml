lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод и следствие из предшествующего описания порочного человека.
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Прямо и естественно выражает неожиданность и стремительность наступления беды.
- source_word: יָבֹוא אֵידוֹ
  choice: придёт на него беда
  rationale: אֵיד означает бедствие, несчастье или гибель; конструкция «придёт на него беда» естественна по-русски и сохраняет образ наступающего бедствия.
- source_word: פֶּתַע
  choice: в одно мгновение
  rationale: Сохраняет поэтическое усиление второго обозначения внезапности, не повторяя наречие «внезапно».
- source_word: יִשָּׁבֵר
  choice: он будет сокрушён
  rationale: Передаёт страдательно-результативное значение нифаля от שׁבר и образ полного крушения, не уточняя его характер сверх текста.
- source_word: וְאֵין מַרְפֵּא
  choice: и исцеления не будет
  rationale: Сохраняет конкретную метафору исцеления и окончательность последствий; слово מַרְפֵּא допускает также значения «лекарство» и «средство исцеления».
