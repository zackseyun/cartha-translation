lexical_decisions:
- source_word: לֵךְ
  choice: Пойди
  rationale: Повелительная форма глагола הלך выражает прямое побуждение. «Пойди» естественно передаёт направленное действие к указанному примеру.
- source_word: אֶל־נְמָלָה
  choice: к муравью
  rationale: Предлог אֶל указывает направление, а נְמָלָה обозначает муравья как типичный пример для наблюдения. В русском родовое значение естественно передаётся единственным числом.
- source_word: עָצֵל
  choice: ленивец
  rationale: Существительное употреблено как обращение к ленивому человеку. «Ленивец» сохраняет краткость и обличительную силу оригинала.
- source_word: רְאֵה
  choice: посмотри
  rationale: Буквально «увидь/посмотри»; в данном контексте подразумевается внимательное наблюдение. «Посмотри» сохраняет образность и не делает подразумеваемое размышление явным сверх текста.
- source_word: דְרָכֶיהָ
  choice: на пути его
  rationale: «Пути» в литературе мудрости означают образ действий. Хотя נְמָלָה грамматически женского рода в еврейском, русское «муравей» — мужского рода, поэтому местоименное согласование естественно меняется на «его».
- source_word: וַחֲכָם
  choice: и стань мудрым
  rationale: Повелительная форма חכם здесь призывает обрести мудрость благодаря наблюдению; «стань мудрым» передаёт результативную направленность лучше, чем статичное «будь мудр».
