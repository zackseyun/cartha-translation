  source_fidelity: 'Текст точно передаёт обе риторические вопросы еврейского оригинала: עַד־מָתַי — «Доколе», עָצֵל — «ленивец», תִּשְׁכָּב — «ты будешь лежать», מָתַי — «Когда», תָּקוּם — «встанешь», מִשְּׁנָתֶךָ — «ото сна». Личные формы второго лица и укоризненный параллелизм сохранены. Добавлений или богословской интерпретации нет.'
  naturalness: «Доколе, ленивец, ты будешь лежать? Когда встанешь ото сна?» — естественная, ясная литературная русская фраза с уместным для Притч афористически-приподнятым регистром. «Доколе» несколько книжнее разговорного «как долго», но здесь оно хорошо соответствует жанру и остаётся понятным.
  terminology: «Ленивец» удачно передаёт устойчивый образ עָצֵל в книге Притч, не сводя его к случайной лени. Сноска с вариантом «лентяй» корректна; она помогает современному читателю, не навязывая более разговорный вариант основному тексту.
