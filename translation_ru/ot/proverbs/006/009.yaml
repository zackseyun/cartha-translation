  text: עַד מָתַ֖י עָצֵ֥ל תִּשְׁכָּ֑ב מָ֝תַ֗י תָּק֥וּם מִ/שְּׁנָתֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/009.yaml
  text: How long[a], sluggard, will you lie there? When will you rise from your sleep?
translation:
  language: ru
  text: Доколе, ленивец[a], ты будешь лежать? Когда встанешь ото сна?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лентяй».'
    reason: Лексическая альтернатива для עָצֵל; «лентяй» современнее и разговорнее, тогда как «ленивец» лучше сохраняет афористический регистр Притч.
lexical_decisions:
- source_word: עַד מָתַי
  choice: Доколе
  rationale: Устойчивое русское вопросительное слово со значением длительности; сохраняет краткость, укоризненный тон и возвышенно-пословичный регистр оригинала.
- source_word: עָצֵל
  choice: ленивец
  rationale: Точное и естественное обозначение человека, для которого лень стала привычной чертой; мужской род соответствует форме еврейского текста и может пониматься обобщённо.
- source_word: תִּשְׁכָּב
  choice: ты будешь лежать
  rationale: Передаёт значение «лежать» и в контексте подразумевает продолжающееся бездействие, не добавляя отсутствующего в оригинале указания на место.
- source_word: מָתַי
  choice: Когда
  rationale: Прямой и естественный эквивалент вопросительного наречия.
- source_word: תָּקוּם
  choice: встанешь
  rationale: Естественно передаёт вставание после сна и сохраняет лаконизм еврейского текста.
- source_word: מִשְּׁנָתֶךָ
  choice: ото сна
  rationale: Точно передаёт существительное «сон» с предлогом исходной точки и местоименным значением второго лица; форма «ото сна» естественна после глагола «встать» и поддерживает литературный регистр.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной пословичной краткостью. «Доколе» и «ото сна» звучат достойно, но остаются понятными широкому читателю; синтаксический параллелизм двух вопросов сохранён.
