lexical_decisions:
- source_word: נוֹקַשְׁתָּ
  choice: ты попался в ловушку
  rationale: Нифаль глагола יקש означает попасть в западню или силок. Выражение «попался в ловушку» естественно для современного русского языка и сохраняет конкретный образ западни.
- source_word: בְאִמְרֵי
  choice: из-за слов / словами
  rationale: Предлог ב указывает здесь на средство или основание, посредством которого человек оказывается в западне. В первой строке естественное «из-за слов» ясно передаёт причинно-инструментальный смысл, а во второй «словами» сохраняет более формальную инструментальность и избегает тяжёлого дословного повтора.
- source_word: פִיךָ
  choice: своих уст
  rationale: Буквальное обозначение «твоего рта» является метонимией речи. «Своих уст» сохраняет телесный образ оригинала, согласуется с русской библейской поэтической речью и при этом остаётся понятным.
- source_word: נִלְכַּדְתָּ
  choice: оказался пойман
  rationale: Нифаль глагола לכד означает быть схваченным или пойманным. «Оказался пойман» передаёт результирующее состояние перфекта и образно усиливает параллель к попаданию в ловушку.
