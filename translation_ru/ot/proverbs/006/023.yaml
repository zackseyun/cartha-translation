base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/023.yaml
  text: For the commandment is a lamp[a], and the instruction is light[b], and the reproofs of discipline are the way of life.
translation:
  language: ru
  text: Ведь заповедь — светильник, наставление[a] — свет, а обличения, наставляющие и исправляющие,[b] — путь жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «учение». Здесь תּוֹרָה, вероятно, означает авторитетное наставление, а не исключительно закон.
    reason: lexical_alternative
  - marker: b
    text: Или «обличения дисциплины» или «исправляющие упрёки». Еврейское выражение соединяет словесное обличение (תּוֹכְחוֹת) с формирующим наставлением и дисциплиной (מוּסָר).
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит обоснование предшествующего наставления; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: נֵר
  choice: светильник
  rationale: Сохраняет конкретный образ источника света и отличает его от אוֹר — «свет».
- source_word: מִצְוָה
  choice: заповедь
  rationale: Передаёт обязательный характер авторитетного повеления в контексте родительского наставления.
- source_word: תּוֹרָה
  choice: наставление
  rationale: В контексте книги Притч слово обозначает авторитетное учение или наставление и не обязательно относится исключительно к Моисееву Закону.
- source_word: אוֹר
  choice: свет
  rationale: Сохраняет параллельный образ освещения и руководства.
- source_word: דֶרֶךְ חַיִּים
  choice: путь жизни
  rationale: Передаёт выражение, которое может обозначать как ведущий к жизни путь, так и жизненный путь; неоднозначность не устраняется.
- source_word: תּוֹכְחוֹת מוּסָר
  choice: обличения, служащие воспитанию
  rationale: Передаёт сочетание словесного исправления с формирующим воспитанием, избегая неестественной для современного русского конструкции «обличения воспитания».
theological_decisions:
- issue: Значение תּוֹרָה в литературе мудрости
  choice: наставление
  alternative: закон; учение
  rationale: Контекст говорит об авторитетном родительском наставлении; перевод не сужает значение до Моисеева Закона, но сохраняет его нормативную силу.
- issue: Направленность выражения דֶרֶךְ חַיִּים
  choice: путь жизни
  alternative: путь к жизни
  rationale: Более буквальная формулировка сохраняет возможность понимать выражение и как путь, ведущий к жизни, и как образ правильного жизненного пути.
translation_notes:
  register: Современный литературный русский язык с лаконичным ритмом изречения. Конкретная метафора «светильник — свет» сохранена; синтаксис слегка адаптирован ради естественности, при этом параллелизм оригинала остаётся заметным.
