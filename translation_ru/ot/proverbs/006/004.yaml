  yaml_path: translation/ot/proverbs/006/004.yaml
  text: Do not give sleep to your eyes[a], nor slumber to your eyelids.
translation:
  language: ru
  text: 'Не давай сна своим глазам,

    ни дремоты — своим векам.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лёгкого сна — своим векам». Еврейское слово означает дремоту, неглубокий сон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: Не давай
  rationale: Отрицательная частица אַל с имперфектом выражает запрет. «Не давай» сохраняет конкретную еврейскую идиому и естественно звучит в контексте настойчивого предостережения.
- source_word: שֵׁנָה
  choice: сна
  rationale: Обычное значение слова — «сон»; форма родительного падежа обусловлена русской конструкцией «не давай сна».
- source_word: לְעֵינֶיךָ
  choice: своим глазам
  rationale: Предлог לְ обозначает косвенный объект. Возвратное притяжательное местоимение «своим» естественно передаёт обращённое к одному человеку «твоим» и сохраняет образ оригинала.
- source_word: וּתְנוּמָה
  choice: ни дремоты
  rationale: תְּנוּמָה обозначает дремоту, неглубокий сон. «Ни» естественно продолжает русский отрицательный параллелизм, а «дремота» отличает второй термин от שֵׁנָה.
- source_word: לְעַפְעַפֶּיךָ
  choice: своим векам
  rationale: עַפְעַף прямо обозначает веки. Перевод сохраняет телесный и поэтический параллелизм «глазам — векам».
