lexical_decisions:
- source_word: אֲשֶׁר
  choice: у которой
  rationale: Относительное местоимение вводит характеристику муравья из предыдущего стиха; форма женского рода согласуется с русским словом «муравьиха» или подразумеваемым названием муравья в контексте, а конструкция естественно сочетается с выражением обладания «нет».
- source_word: אֵין לָהּ
  choice: нет
  rationale: Еврейская конструкция существования с ל и местоименным суффиксом естественно передаётся по-русски конструкцией обладания «у которой нет».
- source_word: קָצִין
  choice: начальника
  rationale: Слово обозначает главу или предводителя. «Начальник» понятно современному читателю и не сливается по значению с последующим «правителем».
- source_word: שֹׁטֵר
  choice: надзирателя
  rationale: Слово обозначает должностное лицо, осуществляющее надзор и исполнение распоряжений. «Надзиратель» сохраняет функциональное отличие от начальника и правителя.
- source_word: וּמֹשֵׁל
  choice: ни правителя
  rationale: מֹשֵׁל — тот, кто правит или властвует. В отрицательном перечислении союз ו естественно передаётся повторяющимся русским «ни».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранено трёхчленное перечисление различных фигур власти. Повтор «ни» делает отрицательную конструкцию естественной и выразительной. Конечная запятая отражает продолжение предложения в следующем стихе.
