lexical_decisions:
- source_word: תַּהְפֻּכוֹת
  choice: извращённость
  rationale: Абстрактное существительное во множественном числе обозначает внутреннюю нравственную искривлённость, порочность и склонность всё извращать. Русское «извращённость» сохраняет абстрактный и этический смысл.
- source_word: בְּלִבּוֹ
  choice: в сердце у него
  rationale: Предложная группа образует безглагольное предложение и указывает на внутренний склад человека. Такой порядок слов естественен по-русски и сохраняет смысл исходного выражения.
- source_word: חֹרֵשׁ רָע
  choice: замышляет зло
  rationale: Причастие от חרש буквально связано с пахотой или вырезанием, но здесь употреблено в устойчивом переносном значении намеренного обдумывания и подготовки зла.
- source_word: בְּכָל־עֵת
  choice: во всякое время
  rationale: Выражение подчёркивает постоянный, привычный характер действия. Формулировка близка к еврейскому тексту и уместна в литературном русском.
- source_word: מְדָנִים
  choice: раздоры
  rationale: Существительное во множественном числе обозначает распри, ссоры и столкновения. «Раздоры» сохраняет множественное число и хорошо сочетается с контекстом.
- source_word: יְשַׁלֵּחַ
  choice: сеет
  rationale: Буквально форма означает «посылает, выпускает», но с объектом «раздоры» описывает их распространение и возникновение. Русское выражение «сеет раздоры» естественно передаёт действие, а буквальный образ отмечен в сноске.
