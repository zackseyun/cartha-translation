  yaml_path: translation/ot/proverbs/006/024.yaml
  text: to keep you from the evil woman[b][a], from the smooth tongue of the foreign woman.
translation:
  language: ru
  text: чтобы уберечь тебя от злой женщины, от льстивого[a] языка чужой[b] женщины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «гладкого языка».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «иноземной» или «посторонней» женщины; некоторые понимают это слово здесь более узко: «прелюбодейка».'
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: чтобы уберечь тебя
  rationale: Инфинитив с ל выражает цель по отношению к предыдущему стиху. «Уберечь» естественно передаёт защитный смысл глагола שׁמר.
- source_word: מֵאֵשֶׁת רָע
  choice: от порочной женщины
  rationale: אֵשֶׁת — сопряжённая форма слова «женщина/жена»; здесь «женщина» не сужает смысл до замужней. רָע указывает на нравственную порочность; «порочная» звучит естественно в данном контексте.
- source_word: מֵחֶלְקַת לָשׁוֹן
  choice: от льстивого языка
  rationale: Буквальный образ «гладкости языка» означает вкрадчивую, льстивую речь. Основной текст передаёт идиоматический смысл, а буквальный образ сохраняется в сноске.
- source_word: נָכְרִיָּה
  choice: чужой женщины
  rationale: Слово обозначает чужую, постороннюю или иноземную женщину. «Чужая женщина» сохраняет лексическую широту и в контексте Притч может подразумевать женщину, не принадлежащую мужчине, не сводя значение прямо к «прелюбодейке».
theological_decisions:
- issue: Толкование נָכְרִיָּה в литературе мудрости
  choice: Передать как «чужая женщина»
  alternative: «иноземная женщина»; «посторонняя женщина»; «прелюбодейка»
  rationale: Еврейское слово прежде всего выражает чуждость или принадлежность к другой среде. Контекст допускает нравственный и брачный подтекст, однако перевод «прелюбодейка» неоправданно устранил бы смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет связь цели с предыдущим стихом. Идиома передана понятно, а буквальный образ и неоднозначность נָכְרִיָּה отражены в сносках.
