  text: שֶׁשׁ הֵ֭נָּה שָׂנֵ֣א יְהוָ֑ה וְ֝/שֶׁ֗בַע תועבות נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/016.yaml
  text: 'There are six things that Yahweh hates[a], seven that are an abomination to him:'
translation:
  language: ru
  text: 'Вот шесть вещей, которые ненавидит Яхве, и семь, которые отвратительны ему[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семь — мерзости для его души», то есть семь вещей, глубоко отвратительных ему.'
    reason: Сохраняет буквальную образность תועבות נפשו, включая множественное число «мерзости», и поясняет идиоматическое значение נֶפֶשׁ.
lexical_decisions:
- source_word: שֶׁשׁ הֵנָּה
  choice: Вот шесть вещей
  rationale: Указательное הֵנָּה вводит последующий перечень; «вот шесть вещей» естественно передаёт еврейскую конструкцию и сохраняет числовую формулу.
- source_word: שָׂנֵא
  choice: ненавидит
  rationale: Прямо передаёт сильное неприятие, выраженное еврейским глаголом, без смягчения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְשֶׁבַע
  choice: и семь
  rationale: Сохраняет характерную для еврейской поэзии числовую формулу «шесть... и семь», где второе число подводит к полному перечню.
- source_word: תועבות
  choice: которые отвратительны
  rationale: Передаёт множественное число и сильную нравственно-религиозную оценку существительного תּוֹעֵבוֹת естественным русским выражением.
- source_word: נַפְשׁוֹ
  choice: ему
  rationale: נֶפֶשׁ здесь идиоматически обозначает самого человека; русское «ему» ясно передаёт смысл, а буквальная образность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Антропоморфное выражение תועבות נפשו
  choice: которые отвратительны ему
  alternative: мерзости для его души; которые ненавидит его душа
  rationale: נַפְשׁוֹ может буквально значить «его душе», но здесь обозначает самого Яхве. Основной текст передаёт идиоматический смысл, не навязывая особой антропологии; буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической речи. Сохранена ступенчатая числовая формула «шесть... и семь» и двоеточие, связывающее стих с последующим перечнем.
