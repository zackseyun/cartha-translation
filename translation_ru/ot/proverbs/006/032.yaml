  yaml_path: translation/ot/proverbs/006/032.yaml
  text: He who commits adultery with a woman lacks sense[a]; he who does it destroys himself.
translation:
  language: ru
  text: Кто прелюбодействует с женщиной, неразумен[a]; кто поступает так, губит себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лишён сердца», то есть лишён здравого суждения. Еврейское слово, переведённое «женщина», может также означать «жена»; «губит себя» может быть передано и как «губит свою жизнь».'
    reason: Передаёт смысл еврейской идиомы חֲסַר־לֵב и отмечает лексические варианты אִשָּׁה и נַפְשׁוֹ без неестественного или двусмысленного русского варианта.
lexical_decisions:
- source_word: נֹאֵף
  choice: прелюбодействует
  rationale: Причастие обозначает человека, совершающего прелюбодеяние. Русская глагольная форма естественно и кратко передаёт действие, сохраняя афористичность стиха.
- source_word: אִשָּׁה
  choice: с женщиной
  rationale: Слово может означать как «женщина», так и «жена». Основной текст сохраняет более широкое значение, тогда как сам глагол уже определяет связь как прелюбодейную; вариант «с женой» отмечен в сноске.
- source_word: חֲסַר לֵב
  choice: лишён разума
  rationale: Буквально «лишён сердца». В литературе мудрости «сердце» здесь связано со здравым суждением и пониманием, а не преимущественно с чувствами.
- source_word: מַשְׁחִית
  choice: губит
  rationale: Каузативная форма выражает причинение гибели или разорения. «Губит» сохраняет суровость высказывания и звучит естественно по-русски.
- source_word: נַפְשׁוֹ
  choice: самого себя
  rationale: נֶפֶשׁ здесь обозначает самого человека, его жизнь и личность, а не отдельно мыслимую нематериальную душу. Возвратное выражение передаёт смысл в данном контексте.
- source_word: הוּא יַעֲשֶׂנָּה
  choice: кто делает это
  rationale: Местоимение и глагол с суффиксом отсылают к названному поступку. Обобщающая конструкция ясно передаёт смысл и сохраняет параллелизм двух частей.
