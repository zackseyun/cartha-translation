  text: כִּֽי קִנְאָ֥ה חֲמַת גָּ֑בֶר וְ/לֹֽא יַ֝חְמ֗וֹל בְּ/י֣וֹם נָקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/034.yaml
  text: For jealousy is a man's fury, and he will show no mercy on the day of vengeance.
translation:
  language: ru
  text: Потому что ревность — ярость мужа, и в день мести он не пощадит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִנְאָה
  choice: ревность
  rationale: В контексте супружеской неверности обозначает ревность о нарушенной верности; русское «ревность» прямо и естественно передаёт смысл.
- source_word: חֲמַת
  choice: ярость
  rationale: Существительное обозначает сильный, пылающий гнев; «ярость» сохраняет интенсивность образа.
- source_word: גָּבֶר
  choice: мужа
  rationale: В ближайшем контексте речь идёт не просто о любом мужчине, а об оскорблённом супруге; «муж» естественно выражает эту связь без добавочного пояснения.
- source_word: יַחְמוֹל
  choice: не пощадит
  rationale: Глагол означает проявить жалость, сострадание или пощаду; отрицательная форма идиоматично передаётся как «не пощадит».
- source_word: בְּיוֹם נָקָם
  choice: в день мести
  rationale: Формально сохраняет временной оборот и мотив возмездия, не уточняя способ или конкретный срок.
theological_decisions:
- issue: Характер высказывания о мести
  choice: Сохранено как описание реакции оскорблённого мужа
  alternative: Истолковать как одобрение мести или как прямое предписание
  rationale: Контекст предупреждает о последствиях прелюбодеяния; еврейский текст описывает непреклонную ярость мужа, но сам по себе не формулирует нравственного предписания.
translation_notes:
  register: Краткая афористическая фраза в современном литературном русском. Сохранены параллельные понятия ревности, ярости и мести; порядок слов слегка адаптирован для естественного русского звучания.
