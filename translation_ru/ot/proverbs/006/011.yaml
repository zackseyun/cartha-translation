lexical_decisions:
- source_word: וּבָא
  choice: и придёт
  rationale: Перфект Qal в контексте предостережения передаёт ожидаемый результат; будущее время естественно выражает эту силу по-русски.
- source_word: כִמְהַלֵּךְ
  choice: словно бродяга
  rationale: Причастие от הלך буквально обозначает того, кто ходит или бродит. «Бродяга» сохраняет образ странствующего человека и звучит естественно, а буквальный вариант вынесен в сноску.
- source_word: רֵאשֶׁךָ
  choice: к тебе бедность
  rationale: Существительное обозначает бедность, нищету; местоименный суффикс естественно передан русской конструкцией «к тебе бедность».
- source_word: וּמַחְסֹרְךָ
  choice: и нужда
  rationale: מַחְסוֹר означает недостаток, нужду. «Нужда» сохраняет краткий синонимический параллелизм с «бедностью».
- source_word: כְּאִישׁ מָגֵן
  choice: словно вооружённый человек
  rationale: Выражение буквально рисует человека со щитом; функциональный перевод «вооружённый человек» ясно передаёт угрожающий образ, не уточняя нападение или защиту.
