  text: מְעַ֣ט שֵׁ֭נוֹת מְעַ֣ט תְּנוּמ֑וֹת מְעַ֓ט חִבֻּ֖ק יָדַ֣יִם לִ/שְׁכָּֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/010.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: ru
  text: Немного поспать, немного подремать, немного сложить руки, чтобы прилечь —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט
  choice: немного
  rationale: Троекратный повтор сохраняет краткий ритм и риторическое нарастание еврейской пословицы.
- source_word: שֵׁנוֹת
  choice: поспать
  rationale: Хотя еврейская форма множественного числа буквально обозначает «сны/периоды сна», русский инфинитив естественно передаёт реплику ленивца и согласуется с последующим рядом действий.
- source_word: תְּנוּמוֹת
  choice: подремать
  rationale: Передаёт более лёгкий или кратковременный сон и сохраняет параллелизм со словом «поспать».
- source_word: חִבֻּק יָדַיִם
  choice: сложить руки
  rationale: Буквально «объятие рук»; в данном контексте это образ рук, сложенных для бездействия или отдыха. Выбран естественный русский оборот.
- source_word: לִשְׁכָּב
  choice: чтобы полежать
  rationale: Инфинитив выражает цель сложенных рук и буквально относится к лежанию; «полежать» сохраняет отличие от уже названных сна и дремоты.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены троекратное «немного», параллелизм и незавершённость высказывания перед продолжением в следующем стихе. Формы «поспать», «подремать», «полежать» естественно воспроизводят самооправдывающую речь ленивца в контексте.
