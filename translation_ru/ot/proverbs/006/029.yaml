  text: כֵּ֗ן הַ֭/בָּא אֶל אֵ֣שֶׁת רֵעֵ֑/הוּ לֹ֥א יִ֝נָּקֶ֗ה כָּֽל הַ/נֹּגֵ֥עַ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/029.yaml
  text: So is the one who goes in to his neighbor’s wife[b][a]; everyone who touches her will not go unpunished.
translation:
  language: ru
  text: 'Так и тот, кто входит к жене ближнего своего: всякий, кто прикоснётся к ней[b], не останется без наказания[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будет оправдан»; «не будет признан невиновным».'
    reason: lexical_alternative
  - marker: b
    text: Здесь «прикоснётся к ней», вероятно, указывает на запрещённую половую близость, а не на случайное физическое прикосновение.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: Так бывает с тем
  rationale: Связывает стих с предшествующим сравнением и естественно вводит его применение в современном русском языке.
- source_word: הַבָּא
  choice: кто входит
  rationale: Субстантивированное причастие передано придаточным определительным. В сочетании с אֶל и в контексте прелюбодеяния глагол сохраняет намеренно сдержанный сексуальный смысл, не сводясь к простому пространственному движению.
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: к жене ближнего своего
  rationale: «Ближний» сохраняет широкий relationalный смысл רֵעַ — сосед, товарищ, другой человек — и соответствует достоинству библейского регистра.
- source_word: לֹא יִנָּקֶה
  choice: не останется без наказания
  rationale: Nifal от נקה допускает значения «не быть оправданным», «не остаться без вины/наказания». Основной текст передаёт естественный в данном контексте смысл неизбежности кары, а альтернативный судебно-нравственный оттенок сохранён в сноске.
- source_word: כָּל
  choice: никто … не
  rationale: Универсальное значение конструкции כָּל с отрицанием естественно передано по-русски оборотом «никто … не», без ослабления всеобщности утверждения.
- source_word: הַנֹּגֵעַ בָּהּ
  choice: кто прикоснётся к ней
  rationale: Сохранено буквальное и риторически сдержанное значение נגע «касаться»; вероятный эвфемистический смысл незаконной половой близости пояснён сноской.
