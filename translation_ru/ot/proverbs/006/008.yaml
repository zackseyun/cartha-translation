  text: it prepares its food in summer[b][a]; it gathers its provisions at harvest.
translation:
  language: ru
  text: летом готовит себе пищу[a], во время жатвы собирает себе пропитание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свой хлеб»; здесь, вероятно, имеется в виду пища или пропитание вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во время жатвы запасает себе пищу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: готовит
  rationale: Порода hифиль глагола כון здесь означает «подготавливать, делать готовым»; «готовит» естественно передаёт действие муравья и сохраняет параллелизм со «собирает».
- source_word: בַּקַּיִץ
  choice: летом
  rationale: Предлог ב с существительным обозначает время действия; наречная форма «летом» кратка и естественна по-русски.
- source_word: לַחְמָהּ
  choice: себе пищу
  rationale: לֶחֶם буквально часто значит «хлеб», но может обозначать пищу вообще. Для муравья «пища» передаёт смысл без неуместного человеческого образа хлеба; возвратное «себе» естественно выражает местоименный суффикс.
- source_word: אָגְרָה
  choice: собирает
  rationale: Глагол אגר означает собирать, в том числе в запас. «Собирает» прямо передаёт действие, не устраняя подразумеваемого оттенка запасания.
- source_word: בַקָּצִיר
  choice: во время жатвы
  rationale: Выражение указывает на пору жатвы. «Во время жатвы» ясно и естественно обозначает временные рамки действия.
- source_word: מַאֲכָלָהּ
  choice: себе пропитание
  rationale: מַאֲכָל означает то, что употребляют в пищу. «Пропитание» сохраняет небольшое лексическое различие между двумя параллельными строками и подходит для собранного запаса еды.
