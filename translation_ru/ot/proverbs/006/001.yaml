  text: בְּ֭נִ/י אִם עָרַ֣בְתָּ לְ/רֵעֶ֑/ךָ תָּקַ֖עְתָּ לַ/זָּ֣ר כַּפֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/001.yaml
  text: My son[a], if you have gone surety for your neighbor, if you have struck your hands in pledge to a stranger[b],
translation:
  language: ru
  text: Сын мой, если ты поручился за ближнего и ударил по рукам с чужим,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Естественное для современной русской речи обращение отца или наставника к сыну; сохраняет мужской род и единственное число.
- source_word: אִם
  choice: если
  rationale: Передаёт условный характер начальной придаточной конструкции.
- source_word: עָרַבְתָּ
  choice: поручился
  rationale: Глагол обозначает принятие на себя ответственности за чужой долг или обязательство. «Поручился» точно и естественно выражает этот юридически-финансовый смысл.
- source_word: לְרֵעֶךָ
  choice: за ближнего
  rationale: רֵעַ может означать ближнего, товарища или знакомого. «Ближний» сохраняет широкий смысл, не ограничивая его близкой дружбой.
- source_word: תָּקַעְתָּ ... כַּפֶּיךָ
  choice: ударил по рукам
  rationale: Русский устойчивый оборот естественно передаёт конкретный жест, которым скрепляли обязательство; культурный смысл пояснён в сноске.
- source_word: לַזָּר
  choice: с чужим
  rationale: זָר обозначает чужого или постороннего человека. Предлог «с» необходим в русском обороте «ударить по рукам с кем-либо», тогда как роль этого лица в сделке намеренно не уточняется.
