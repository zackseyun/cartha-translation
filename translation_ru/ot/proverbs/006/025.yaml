translation:
  language: ru
  text: Не пожелай в сердце своём её красоты[a], и да не пленит она тебя своими ресницами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не возжелай в сердце своём её красоты».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не дай ей взять тебя своими веками»; имеется в виду соблазняющая привлекательность её глаз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  choice: не пожелай
  rationale: Глагол חמד обозначает сильное внутреннее желание и может иметь оттенок вожделения. «Не пожелай» сохраняет широту значения и естественно сочетается с указанием на сердце.
- source_word: יָפְיָהּ
  choice: её красоты
  rationale: Прямой и естественный эквивалент существительного יֹפִי — «красота».
- source_word: בִּלְבָבֶךָ
  choice: в сердце своём
  rationale: Сохраняется древнееврейский образ сердца как средоточия желаний, намерений и внутренней жизни.
- source_word: תִּקָּחֲךָ
  choice: да не пленит она тебя
  rationale: Буквально глагол значит «возьмёт тебя», но в контексте речь о том, чтобы не оказаться захваченным обольщением. «Пленит» сохраняет образ овладения человеком и звучит естественно по-русски.
- source_word: בְּעַפְעַפֶּיהָ
  choice: своими ресницами
  rationale: עַפְעַף может обозначать веки или ресницы. В контексте соблазнения «ресницами» передаёт конкретный зрительный образ, не заменяя его толкованием «взглядами».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткой наставительной формы древнееврейской мудрости. Оборот «да не пленит» слегка возвышенный, но понятный и уместный для поэтического параллелизма.
