  source_fidelity: 'Основной смысл передан верно: בְּלִיַּעַל и אָוֶן характеризуют нравственно порочного человека, а הוֹלֵךְ обозначает его обычный образ действий. Однако «ходит с кривыми устами» в современном русском прежде всего вызывает образ физически искривлённых губ, а не порочной речи; это неудачно передаёт עִקְּשׁוּת פֶּה.'
