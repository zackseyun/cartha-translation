  terminology: «Негодный» уместно передаёт בְּלִיַּעַל без анахроничной персонификации «Велиар/Велиал». «Человек зла» достаточно буквально и сохраняет этическую широту אָוֶן. «Превратно» передаёт мотив искривлённой, извращённой речи, не сужая его до одной лишь лжи.
