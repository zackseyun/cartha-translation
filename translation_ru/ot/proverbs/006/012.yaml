  text: אָדָ֣ם בְּ֭לִיַּעַל אִ֣ישׁ אָ֑וֶן ה֝וֹלֵ֗ךְ עִקְּשׁ֥וּת פֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/012.yaml
  text: A worthless man[a], a man of wickedness, walks with a perverse mouth.
translation:
  language: ru
  text: Негодный человек, человек зла, ходит, говоря превратно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с кривизной уст»; то есть с извращённой или лукавой речью.'
    reason: Передаёт конкретный образ еврейского выражения עִקְּשׁוּת פֶּה и поясняет его речевой смысл, не сводя его к физической особенности.
lexical_decisions:
- source_word: אָדָם
  choice: человек
  rationale: В данном контексте обозначает отдельного человека как нравственный тип; это соответствует параллельному אִישׁ и естественно звучит по-русски.
- source_word: בְּלִיַּעַל
  choice: негодный
  rationale: Слово характеризует человека как нравственно испорченного и ни к чему доброму не годного. Транслитерация «Велиар» здесь ошибочно намекала бы на позднейшее личное имя.
- source_word: אִישׁ
  choice: человек
  rationale: Повтор сохраняет усилительный параллелизм исходного текста, не создавая в русском ненужного различия между אָדָם и אִישׁ.
- source_word: אָוֶן
  choice: зло
  rationale: В сочетании «человек зла» слово передаёт нравственную порочность, сохраняя при этом краткость и широкое значение еврейского существительного, которое может включать нечестие и пагубу.
- source_word: הוֹלֵךְ
  choice: ходит
  rationale: Сохранён образ хождения, который здесь описывает привычный образ поведения, а не одно конкретное перемещение.
- source_word: עִקְּשׁוּת
  choice: кривыми
  rationale: Передаёт буквальный образ искривлённости и его нравственный смысл — извращённость речи — без добавления более узкого значения вроде лжи.
- source_word: פֶּה
  choice: устами
  rationale: Сохранён конкретный образ «рта» как органа речи; «уста» естественно сочетаются с прилагательным «кривые» в возвышенном, но понятном библейском регистре.
