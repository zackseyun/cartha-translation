  text: He will find injury and disgrace[b][a], and his reproach will not be wiped away.
translation:
  language: ru
  text: Рану и бесчестье найдёт он, и позор его не изгладится.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶגַע
  choice: побои
  rationale: В данном контексте слово обозначает удар, телесное повреждение или причинённый вред. «Побои» конкретно передают вероятную физическую расплату, не привнося значения болезни.
- source_word: קָלוֹן
  choice: бесчестье
  rationale: Слово указывает на публичное унижение и утрату чести; «бесчестье» естественно сочетается с «побоями» и сохраняет социально-нравственный оттенок.
- source_word: יִמְצָא
  choice: найдёт он
  rationale: 'Сохранён буквальный образ глагола «найти»: виновный обретёт названные последствия. Инверсия придаёт строке естественное для поэзии звучание.'
- source_word: חֶרְפָּתוֹ
  choice: позор его
  rationale: «Позор» передаёт стойкое публичное поругание и позволяет не повторять «бесчестье» дословно, сохраняя близкий смысл параллельных понятий.
- source_word: לֹא תִמָּחֶה
  choice: не изгладится
  rationale: Глагол означает «быть стёртым, изглаженным». Русское «не изгладится» сохраняет образ стирания и естественно говорит о неизбывном позоре.
