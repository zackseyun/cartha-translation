  text: הִ֭נָּצֵל כִּ/צְבִ֣י מִ/יָּ֑ד וּ֝/כְ/צִפּ֗וֹר מִ/יַּ֥ד יָקֽוּשׁ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/005.yaml
  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
translation:
  language: ru
  text: Вырвись[a], как газель[b], из руки[c], и как птица — из руки птицелова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Спасись», «Освободись», «Ускользни». Еврейская повелительная форма выражает настойчивый призыв немедленно вырваться на свободу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лань»; традиционно также «серна». Еврейское слово, вероятнее всего, обозначает газель.'
    reason: lexical_alternative
  - marker: c
    text: 'Первая строка буквально говорит лишь «из руки», не называя того, кому она принадлежит. По смыслу можно понимать: «из руки ловца»; название птицелова появляется во второй строке.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הִנָּצֵל
  choice: Вырвись
  rationale: Форма нифаля, повелительное наклонение, 2-е лицо единственного числа, настойчиво призывает самому освободиться от опасности. «Вырвись» естественно передаёт срочность и образ избавления из чужой власти.
- source_word: כִּצְבִי
  choice: как газель
  rationale: צְבִי обычно обозначает газель; приставка כ выражает сравнение. «Газель» точнее широкого «олень» и понятно современному читателю.
- source_word: מִיָּד
  choice: из руки
  rationale: יָד буквально значит «рука», а переносно — власть или хватка. Буквальный образ сохранён ради параллелизма и наглядности охотничьей сцены.
- source_word: וּכְצִפּוֹר
  choice: и как птица
  rationale: צִפּוֹר — общее обозначение птицы, нередко небольшой; оснований сужать значение до «воробья» нет.
- source_word: מִיַּד יָקוּשׁ
  choice: из руки птицелова
  rationale: יָקוּשׁ обозначает того, кто ставит силки. В контексте птицы «птицелов» точно передаёт образ, а повтор «из руки» сохраняет еврейский параллелизм.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с энергичным повелительным глаголом. Сохранены конкретный образ «руки», параллелизм двух сравнений и намеренная незавершённость первой строки; тире во второй строке естественно обозначает пропуск повторяющегося сказуемого «вырвись».
