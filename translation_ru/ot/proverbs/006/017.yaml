lexical_decisions:
- source_word: עֵינַיִם רָמוֹת
  choice: надменные глаза
  rationale: 'Сохраняет буквальный образ глаз и передаёт нравственный смысл прилагательного от корня со значением высоты: высокомерие и гордыню.'
- source_word: לְשׁוֹן שָׁקֶר
  choice: лживый язык
  rationale: Сохраняет телесный образ и естественную для русского языка метонимию, где язык обозначает ложную речь.
- source_word: יָדַיִם
  choice: руки
  rationale: Буквальный перевод поддерживает последовательность частей тела и обозначает руки как орудие насилия.
- source_word: שֹׁפְכוֹת
  choice: проливающие
  rationale: Причастие передаёт еврейскую причастную форму и характеризующее действие, оставаясь естественным в поэтическом перечне.
- source_word: דָּם נָקִי
  choice: невинную кровь
  rationale: Устойчивое и точное русское соответствие выражению о крови человека, невиновного в том, за что его лишают жизни.
