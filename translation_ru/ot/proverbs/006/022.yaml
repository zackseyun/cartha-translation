source:
  edition: WLC
  text: בְּ/הִתְהַלֶּכְ/ךָ֨ תַּנְחֶ֬ה אֹתָ֗/ךְ בְּֽ֭/שָׁכְבְּ/ךָ תִּשְׁמֹ֣ר עָלֶ֑י/ךָ וַ֝/הֲקִיצ֗וֹתָ הִ֣יא תְשִׂיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/022.yaml
  text: When you walk[a], it will guide you; when you lie down, it will watch over you; and when you awake, it will speak with you.
translation:
  language: ru
  text: Когда ты идёшь, она направляет тебя; когда ложишься, охраняет тебя; когда просыпаешься, беседует с тобой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально употреблено женское местоимение «она»: в контексте речь идёт о заповеди или наставлении; возможно также характерное для книги Притчей олицетворение мудрости.'
    reason: Сохранение грамматической формы и смысловой неоднозначности женского образа.
lexical_decisions:
- source_word: בְּהִתְהַלֶּכְךָ
  choice: когда ты идёшь
  rationale: Предлог ב с инфинитивом породы хитпаэль выражает время действия. Формулировка сохраняет как буквальный образ пути, так и возможный более широкий смысл повседневной жизни.
- source_word: תַּנְחֶה אֹתָךְ
  choice: она направляет тебя
  rationale: Глагол נחה в породе хифиль означает «вести, направлять». «Направляет» естественно звучит применительно к заповеди или наставлению и сохраняет образ руководства в пути.
- source_word: בְּשָׁכְבְּךָ
  choice: когда ложишься
  rationale: Глагол שכב обозначает действие «лечь», а не только последующий сон; краткая форма соответствует параллельному построению стиха.
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: охраняет тебя
  rationale: Сочетание שׁמר с על передаёт защиту и заботливое оберегание. «Охраняет» ясно выражает защитный оттенок.
- source_word: וַהֲקִיצוֹתָ
  choice: когда просыпаешься
  rationale: Форма от יקץ означает пробуждение. Настоящее время в русском передаёт повторяющуюся последовательность повседневных действий естественнее, чем тяжеловесная цепочка форм будущего времени.
- source_word: הִיא
  choice: она
  rationale: Женское местоимение сохранено явно. В ближайшем контексте оно может относиться к заповеди или наставляющей мудрости и поддерживает характерное для Притчей олицетворение.
- source_word: תְשִׂיחֶךָ
  choice: беседует с тобой
  rationale: Глагол שׂיח допускает значения речи, размышления и беседы. «Беседует с тобой» сохраняет взаимный, личный оттенок, не сводя выражение к одностороннему наставлению.
theological_decisions:
- issue: Женское олицетворение заповеди или наставления
  choice: Сохранить в основном тексте местоимение «она»
  alternative: 'Передать безлично: «оно» или повторить «наставление»'
  rationale: В еврейском тексте женское הִיא выражено явно. Русский язык позволяет естественно соотнести «она» с заповедью и одновременно сохранить олицетворение, не определяя окончательно, относится ли образ только к непосредственной заповеди или шире к наставляющей мудрости.
- issue: Временной план трёх действий
  choice: Использовать русское настоящее время для повторяющихся действий
  alternative: 'Использовать будущее время: «будет направлять… будет охранять… будет беседовать»'
  rationale: Еврейские формы описывают действие наставления в типичных обстоятельствах жизни. Русское настоящее время естественно передаёт эту повторяемость и не меняет смысл обещания постоянного сопровождения.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным трёхчастным построением. Опущенные во второй и третьей частях местоимения и связки естественны для русского и подчёркивают параллелизм. Тон ясный и достойный, без архаизмов.
