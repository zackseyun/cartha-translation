lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет еврейский образ внутреннего человека, включающий мысли и намерения; «ум» неоправданно сузил бы значение.
- source_word: חֹרֵשׁ
  choice: замышляющее
  rationale: В переносном употреблении глагол означает «задумывать, замышлять»; причастная форма также сохраняет структуру перечня.
- source_word: מַחְשְׁבוֹת
  choice: намерения
  rationale: Слово может обозначать мысли, замыслы или планы; здесь контекст указывает на целенаправленно сформированные намерения.
- source_word: אָוֶן
  choice: злые
  rationale: Передаёт нравственную порочность намерений и допускаемый контекстом смысл зла/нечестия, не повторяя существительное «зло» во второй строке.
- source_word: רַגְלַיִם
  choice: ноги
  rationale: Сохраняет буквальный образ частей тела как орудий зла в данном перечне.
- source_word: מְמַהֲרוֹת
  choice: спешащие
  rationale: Причастие выражает поспешность и готовность устремиться к злу; форма согласуется с синтаксисом перечня.
- source_word: לָרוּץ
  choice: бежать
  rationale: Прямая передача инфинитива сохраняет усиленный образ стремительного движения.
- source_word: לָרָעָה
  choice: ко злу
  rationale: Буквально передаёт направление движения к злу, не добавляя отсутствующего в еврейском тексте глагола «делать».
