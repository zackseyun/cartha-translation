  text: Can a man carry fire in his bosom and his clothes not be burned?[a]
translation:
  language: ru
  text: Разве может человек набрать огня за пазуху, и одежда его не сгорит?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на грудь», «на колени»; еврейское слово обозначает область груди или коленей, включая складку одежды, в которой можно держать что-либо близко к телу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתֶּה
  choice: набрать
  rationale: Глагол חתה означает брать, выгребать или набирать, в том числе угли или огонь. «Набрать огня» естественно передаёт намеренное действие, после которого огонь оказывается у человека за пазухой.
- source_word: אִישׁ
  choice: человек
  rationale: В изречении мужское единственное число употреблено обобщённо. Русское «человек» сохраняет грамматическую форму и естественный универсальный смысл.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое и естественное соответствие.
- source_word: בְּחֵיקוֹ
  choice: за пазуху
  rationale: חֵיק обозначает грудь, лоно или пространство у груди, в том числе складку одежды, где можно что-либо держать. Русское «за пазуху» ясно передаёт конкретный образ огня, помещённого вплотную к телу под одежду.
- source_word: וּבְגָדָיו
  choice: и одежда его
  rationale: «Одежда» — современное собирательное соответствие множественному בְּגָדָיו; порядок слов поддерживает достойный библейский регистр без архаизации.
- source_word: לֹא תִשָּׂרַפְנָה
  choice: не сгорит
  rationale: Форма нифаля описывает одежду как подвергающуюся горению. По-русски «не сгорит» естественнее буквального пассивного «не будет сожжена» и сохраняет ожидаемый результат риторического вопроса.
