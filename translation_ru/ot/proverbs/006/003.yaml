base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/003.yaml
  text: 'Do this[a], then, my son, and deliver yourself, for you have come into the palm of your neighbor: go, humble yourself[c][b], and press your plea with your neighbors.'
translation:
  language: ru
  text: 'Сделай же вот что, сын мой, и высвободи себя, ведь ты попал в ладонь своего ближнего[a]: пойди, смирись[b] и настойчиво умоляй своих ближних[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в ладонь своего ближнего», то есть под его власть или контроль.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «пади ниц» или «униженно обратись».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте здесь стоит множественное число — «ближних», хотя по смыслу нередко понимают единственное: «ближнего» или «друга», как и ранее в этом стихе.'
    reason: textual_variant
lexical_decisions:
- source_word: עֲשֵׂה זֹאת אֵפוֹא
  choice: Сделай же вот что
  rationale: Императив с указательным выражением и частицей אֵפוֹא передан естественным русским оборотом, сохраняющим вывод и настойчивость увещания.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохранено обращение мужского рода, характерное для наставлений в литературе мудрости.
- source_word: וְהִנָּצֵל
  choice: и спасайся
  rationale: Форма нифаля выражает настоятельный призыв избежать опасного положения; возвратный русский глагол естественно передаёт направленность действия на самого адресата.
- source_word: כִּי בָאתָ
  choice: ведь ты попал
  rationale: כִּי вводит основание повеления, а перфект указывает на уже наступившее положение; «попал» естественно выражает этот результат.
- source_word: בְכַף רֵעֶךָ
  choice: в ладонь своего ближнего
  rationale: Сохранён конкретный образ כַּף, буквально «ладонь», подразумевающий, что человек оказался во власти другого.
- source_word: לֵךְ
  choice: пойди
  rationale: Прямое повеление сохранено без усилений, отсутствующих в еврейском тексте.
- source_word: הִתְרַפֵּס
  choice: унизь себя
  rationale: Редкий глагол, вероятно, означает намеренно смирить или унизить себя перед другим; перевод не уточняет, идёт ли речь о физическом падении ниц.
- source_word: וּרְהַב
  choice: и настойчиво умоляй
  rationale: В данном контексте редкий глагол выражает настойчивое, неотступное обращение; «умоляй» естественно передаёт подразумеваемую просьбу, не конкретизируя её содержание.
- source_word: רֵעֶיךָ
  choice: своих ближних
  rationale: В масоретском тексте стоит форма множественного числа; она сохранена в основном тексте, несмотря на предшествующее единственное число.
