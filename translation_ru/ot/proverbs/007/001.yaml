  text: My son[a], keep my words, and treasure up my commandments with you.
translation:
  language: ru
  text: Сын мой, храни мои слова и сберегай у себя мои заповеди.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храни у себя как сокровище мои заповеди». Еврейский глагол может означать, что нечто прячут или бережно сохраняют в надёжном месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Существительное стоит в единственном числе мужского рода с суффиксом первого лица; это прямое отцовское обращение, характерное для книги Притч.
- source_word: שְׁמֹר
  choice: храни
  rationale: Повелительная форма выражает как бережное сохранение наставления, так и верность ему; «храни» естественно удерживает обе стороны значения.
- source_word: אֲמָרָי
  choice: мои слова
  rationale: Речь идёт о наставлениях говорящего; «слова» — широкое и естественное соответствие, не сужающее смысл до отдельных изречений.
- source_word: וּמִצְוֺתַי
  choice: и мои заповеди
  rationale: «Заповеди» передаёт обязательную нравственную силу מִצְוָה и соответствует возвышенному, но понятному регистру литературы мудрости.
- source_word: תִּצְפֹּן
  choice: сберегай
  rationale: Глагол צפן обозначает укрывание или бережное сохранение чего-либо в запасе; «сберегай» естественно передаёт целенаправленное хранение без обязательного оттенка тайного сокрытия.
- source_word: אִתָּךְ
  choice: у себя
  rationale: Буквально выражение означает «с тобой»; в данном контексте русское «у себя» естественно передаёт хранение заповедей при себе, не усиливая смысл до «внутри себя».
