  yaml_path: translation/ot/proverbs/007/021.yaml
  text: She persuades him with her abundant persuasion[a]; with the smoothness of her lips she compels him.
translation:
  language: ru
  text: Многими уговорами она склоняет его на свою сторону; льстивыми устами увлекает его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своими многими убеждениями она сбивает его с пути; гладкостью своих уст гонит его».'
    reason: Лексические альтернативы для הִטַּתּוּ и תַּדִּיחֶנּוּ сохраняют соответственно образ отклонения от пути и сильное побуждение к движению, не добавляя направления «за собой».
lexical_decisions:
- source_word: הִטַּתּוּ
  choice: она склонила его
  rationale: Порода hифиль глагола נטה выражает побуждение повернуть или поддаться влиянию. «Склонила его» естественно передаёт причинный смысл, не добавляя прямо сексуальной семантики.
- source_word: בְּרֹב לִקְחָהּ
  choice: множеством уговоров
  rationale: רֹב обозначает множество или изобилие, а לֶקַח здесь — убеждающую речь. «Множеством уговоров» передаёт инструментальное בְּ и хорошо звучит по-русски.
- source_word: בְּחֵלֶק שְׂפָתֶיהָ
  choice: льстивыми устами
  rationale: חֵלֶק в сочетании с «устами» обозначает гладкость, то есть льстивость речи. Сохраняется конкретный образ уст, а переносный смысл выражен естественным русским определением.
- source_word: תַּדִּיחֶנּוּ
  choice: увлекла его за собой
  rationale: Hифиль от נדח означает заставить двигаться, погнать или увлечь в сторону. Контекст требует сильного воздействия, но «увлекла за собой» сохраняет образ направленного движения и не усиливает его до полного принуждения.
