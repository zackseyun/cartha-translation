  text: I have spread my couch with coverings[a], with colored linens of Egypt.
translation:
  language: ru
  text: Я устлала своё ложе покрывалами[a], узорчатыми тканями из египетского льна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «резными изделиями, египетским льном». Еврейские слова, обозначающие украшенные покрытия и египетский материал, редки; возможно, речь идёт о разноцветных или вышитых тканях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבַדִּים
  choice: покрывалами
  rationale: Множественное число обозначает постельные покрытия или декоративные ткани; «покрывала» естественно в данном контексте и не сужает значение до ковров.
- source_word: רָבַדְתִּי
  choice: Я устлала
  rationale: Глагол передаёт раскладывание или укладывание слоями; «устлала» кратко и естественно описывает уже приготовленное ложе.
- source_word: עַרְשִׂי
  choice: своё ложе
  rationale: Слово означает кровать или ложе; «ложе» сохраняет чувственный и приподнятый оттенок контекста, оставаясь понятным современному читателю.
- source_word: חֲטֻבוֹת
  choice: узорчатыми тканями
  rationale: Редкое слово, вероятно, обозначает обработанные, украшенные или разноцветные ткани. Перевод передаёт декоративный характер, не уточняя без достаточных оснований способ отделки.
- source_word: אֵטוּן
  choice: льна
  rationale: Редкий термин может обозначать льняную ткань, пряжу или нить. В сочетании с Египтом «египетский лён» является контекстуально убедительным, но неопределённость отмечена в сноске.
- source_word: מִצְרָיִם
  choice: египетского
  rationale: Прилагательное естественно передаёт происхождение материала из Египта в русском синтаксисе.
