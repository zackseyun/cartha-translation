  text: פַּ֤עַם בַּ/ח֗וּץ פַּ֥עַם בָּ/רְחֹב֑וֹת וְ/אֵ֖צֶל כָּל פִּנָּ֣ה תֶאֱרֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/012.yaml
  text: In the street[a], now in the squares[b], and beside every corner she lies in wait.
translation:
  language: ru
  text: То на улице, то на площадях — у каждого угла она подстерегает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она таится»; еврейский глагол означает скрытно ждать, как в засаде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעַם ... פַּעַם
  choice: то ... то
  rationale: Повтор передаёт чередование мест и её постоянное перемещение; русская конструкция «то ... то» естественно и выразительно сохраняет этот смысл.
- source_word: בַּחוּץ
  choice: на улице
  rationale: В городском контексте חוּץ обозначает внешнее общественное пространство; «на улице» звучит ясно и естественно.
- source_word: בָּרְחֹבוֹת
  choice: на площадях
  rationale: Форма множественного числа רְחֹבוֹת обозначает широкие открытые общественные места города; «площади» отличает их от улицы.
- source_word: וְאֵצֶל כָּל פִּנָּה
  choice: у каждого угла
  rationale: אֵצֶל выражает близость, а פִּנָּה — угол; сочетание передано кратко и идиоматично, без избыточного уточнения «уличного».
- source_word: תֶאֱרֹב
  choice: она подстерегает
  rationale: Глагол ארב обозначает скрытное ожидание добычи или устройство засады; «подстерегает» сохраняет хищный и угрожающий оттенок.
