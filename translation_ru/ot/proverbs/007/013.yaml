lexical_decisions:
- source_word: וְהֶחֱזִיקָה בּוֹ
  choice: Она схватила его
  rationale: Глагол החזיק с предлогом ב выражает решительное физическое действие — схватить или удержать; «схватила» естественно передаёт внезапность и напористость.
- source_word: וְנָשְׁקָה לּוֹ
  choice: и поцеловала
  rationale: Глагол נשק в породе qal обычно означает «целовать»; краткая формулировка сохраняет последовательность действий.
- source_word: הֵעֵזָה פָנֶיהָ
  choice: с бесстыдной дерзостью
  rationale: Еврейская идиома буквально говорит о том, что женщина «сделала своё лицо дерзким»; выбранное выражение естественно по-русски передаёт вызывающую, лишённую смущения напористость.
- source_word: וַתֹּאמַר לוֹ
  choice: сказала ему
  rationale: Сохранено явно выраженное в еврейском тексте дополнение «ему», подчёркивающее непосредственность обращения.
