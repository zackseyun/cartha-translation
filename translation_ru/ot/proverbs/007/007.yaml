lexical_decisions:
- source_word: וָאֵרֶא
  choice: И увидел я
  rationale: Форма глагола ראה с последовательным союзом передаёт очередное наблюдение рассказчика; порядок слов сохраняет возвышенный, но естественный повествовательный тон.
- source_word: בַפְּתָאיִם
  choice: среди неопытных
  rationale: פְּתָאיִם в Притчах обозначает неискушённых и легко поддающихся влиянию людей. «Неопытные» понятно современному читателю и не приписывает им умственной неспособности.
- source_word: אָבִינָה
  choice: приметил
  rationale: Глагол בין здесь означает осмысленно различить или распознать среди увиденных. «Приметил» естественно передаёт внимательное наблюдение и не повторяет «увидел».
- source_word: בַבָּנִים
  choice: среди молодых людей
  rationale: Буквально «среди сыновей», но по контексту речь идёт о группе молодых мужчин. Такой перевод передаёт смысл и позволяет отличить эту группу от отдельного נַעַר.
- source_word: נַעַר
  choice: юношу
  rationale: נַעַר может обозначать мальчика или молодого мужчину; контекст самостоятельного передвижения по улице лучше соответствует слову «юноша».
- source_word: חֲסַר לֵב
  choice: лишённого здравого смысла
  rationale: Буквально «лишённый сердца»; в древнееврейской мудростной речи לֵב связано также с разумением, рассудительностью и нравственным суждением. Выбранная формулировка ясно передаёт идиоматический смысл, а буквальный образ сохранён в сноске.
