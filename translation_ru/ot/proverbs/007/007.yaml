  text: and I saw among the simple[a]; I discerned among the young men a youth lacking sense.
translation:
  language: ru
  text: И увидел я среди наивных, распознал среди молодых людей юношу, лишённого здравого смысла[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
