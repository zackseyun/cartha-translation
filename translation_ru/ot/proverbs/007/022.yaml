    issue: Неудачная сочетаемость «оковы — на вразумление глупца».
    rationale: Русское «на вразумление» обычно обозначает цель действия лица, а не отношение оков к взысканию; формулировка создаёт ложную ясность и звучит неестественно. Нужна осторожная, но более связная передача спорной конструкции.
  - severity: low
    issue: Сноска слишком уверенно вводит развёрнутый вариант «как глупец в оковах идёт на наказание».
    rationale: Это интерпретационное разрешение трудного еврейского оборота, а не буквальное значение масоретской строки. Сноска должна прежде всего обозначать трудность и альтернативы, не выдавая один реконструированный вариант за прямое прочтение.
  revised_text: Он тотчас идёт за ней, словно бык, идущий на убой, и словно оковы — для наказания глупца.[a]
