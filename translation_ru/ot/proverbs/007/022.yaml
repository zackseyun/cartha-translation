  yaml_path: translation/ot/proverbs/007/022.yaml
  text: He goes after her at once[a], like an ox going to the slaughter, and like a fetter to the discipline of a fool.
translation:
  language: ru
  text: Он тотчас идёт за ней, словно бык, идущий на убой, и словно оковы — для наказания глупца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст последней строки труден. Буквально: «и как оковы — к наказанию (или исправительному взысканию) глупца». Слово, переданное как «оковы», понимают по-разному; возможны также переводы вроде «как оковы для исправления глупца». При ином прочтении еврейского текста предлагается: «как олень, попадающий в силок».'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ אַחֲרֶיהָ
  choice: идёт за ней
  rationale: Причастие הוֹלֵךְ в данном контексте живо изображает действие, а אַחֲרֶיהָ означает следование за женщиной; по-русски естественно «идёт за ней».
- source_word: פִּתְאֹם
  choice: тотчас
  rationale: Наречие передаёт внезапность и безрассудную немедленность поступка; «тотчас» подчёркивает, что юноша без раздумий следует за ней.
- source_word: כְּשׁוֹר אֶל טָבַח יָבֹא
  choice: как бык идёт на убой
  rationale: 'Буквально: «как бык приходит к убою». Русское «идёт на убой» естественно передаёт движение к гибели и сохраняет образ животного, не сознающего своей участи.'
- source_word: וּכְעֶכֶס
  choice: и как оковы
  rationale: עֶכֶס — редкое и спорное слово, которое может обозначать ножную цепь, оковы или украшение на ноге. Выбор «оковы» следует наиболее вероятному значению, но трудность оборота отмечена в сноске.
- source_word: אֶל מוּסַר אֱוִיל
  choice: на вразумление глупца
  rationale: מוּסָר в Притчах охватывает наставление, исправление и наказание. «Вразумление» сохраняет исправительную направленность слова; связь с предшествующим עֶכֶס остаётся намеренно не до конца прояснённой.
