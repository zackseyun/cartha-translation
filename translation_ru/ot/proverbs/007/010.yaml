  text: And look—a woman came to meet him[a], dressed like a prostitute and cunning of heart.
translation:
  language: ru
  text: И вот, навстречу ему идёт женщина, одетая как блудница, с затаёнными намерениями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с охраняемым (скрытым) сердцем». Еврейское выражение трудно для точного перевода; возможны также: «скрытная сердцем», «с хитрым сердцем» или «коварная сердцем». Вероятно, речь идёт о скрытых внутренних намерениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Передаёт внезапность и живую наглядность появления нового действующего лица без архаичного оттенка.
- source_word: אִשָּׁה
  choice: женщина
  rationale: В контексте речь идёт о пока не названной женщине; значение «жена» здесь не требуется.
- source_word: לִקְרָאתוֹ
  choice: навстречу ему
  rationale: Естественно передаёт направленное движение к встрече с юношей; глагольность движения ясна из сцены и русского оборота.
- source_word: שִׁית זוֹנָה
  choice: одетая как блудница
  rationale: Передаёт значение одежды или внешнего облика и не утверждает прямо, что женщина действительно была блудницей. «Блудница» соответствует возвышенному, но понятному библейскому регистру.
- source_word: וּנְצֻרַת לֵב
  choice: с затаёнными намерениями
  rationale: Буквальный образ «хранимого/скрытого сердца» в данном контексте указывает на скрытность внутреннего замысла. Формулировка сохраняет эту идею, не сводя её однозначно к хитрости или коварству.
