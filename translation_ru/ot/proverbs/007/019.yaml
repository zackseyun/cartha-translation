  yaml_path: translation/ot/proverbs/007/019.yaml
  text: For the man is not at his house[a]; he has gone on a journey far away.
translation:
  language: ru
  text: 'Ведь этого человека нет в его доме[a]: он отправился в дальний путь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моего мужа нет дома». Буквально по-еврейски: «этого человека нет в его доме»; это косвенное обозначение её мужа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание для уверений соблазнительницы; «ведь» естественно передаёт причинно-пояснительную связь с контекстом.
- source_word: אֵין
  choice: нет
  rationale: В сочетании с обозначением лица и места выражает отсутствие; русская конструкция «нет в его доме» сохраняет смысл оригинала.
- source_word: הָאִישׁ
  choice: этого человека
  rationale: Буквально речь идёт о «мужчине/человеке» с определённым артиклем. В контексте это муж женщины, однако косвенное обозначение сохранено в основном тексте; указательное «этого» делает определённость естественной по-русски.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: Сохраняет и локативное значение предлога, и притяжательный суффикс, не сводя выражение к более толковательному «дома».
- source_word: הָלַךְ
  choice: он отправился
  rationale: Завершённое отправление с сохраняющимся результатом естественно передаётся русским совершенным видом.
- source_word: בְּדֶרֶךְ
  choice: в путь
  rationale: Существительное «дорога/путь» в этой конструкции обозначает поездку; «отправился в путь» — естественная русская передача.
- source_word: מֵרָחוֹק
  choice: дальний
  rationale: Передаёт пространственную удалённость пункта или маршрута, не подменяя её длительностью; сочетание «дальний путь» идиоматично по-русски.
