lexical_decisions:
- source_word: נֶשֶׁף
  choice: в сумерках
  rationale: В данном контексте слово обозначает сумеречное время при наступлении ночи; перевод сохраняет переход от дня к темноте и естественно звучит по-русски.
- source_word: עֶרֶב יוֹם
  choice: под вечер дня
  rationale: Передаёт оба элемента еврейского выражения и сохраняет ступенчатое сгущение времени суток, не прибегая к неестественному «вечером дня».
- source_word: אִישׁוֹן לַיְלָה
  choice: во мраке ночи
  rationale: Буквальный образ «зрачка ночи» по-русски непрозрачен; «мрак ночи» передаёт идиоматическое значение самой тёмной поры ночи, не уточняя её как полночь.
- source_word: וַאֲפֵלָה
  choice: и темноте
  rationale: Сохраняет накопительный параллелизм и отдельное упоминание густой темноты после образа ночного мрака.
- source_word: בְּ ... בְּ ... בְּ
  choice: в ... под ... во ...
  rationale: Повторное временное значение предлога передано естественными русскими конструкциями при сохранении последовательного движения от сумерек к ночной тьме.
