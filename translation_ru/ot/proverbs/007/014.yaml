  text: זִבְחֵ֣י שְׁלָמִ֣ים עָלָ֑/י הַ֝/יּ֗וֹם שִׁלַּ֥מְתִּי נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/014.yaml
  text: Peace offerings were due from me[a]; today I have paid my vows.
translation:
  language: ru
  text: Я была обязана принести мирные жертвы[a]; сегодня я исполнила свои обеты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть жертвы мира и благополучия; мясо таких жертв употреблялось в трапезе жертвователя и его гостей после жертвоприношения.
    reason: Поясняет культовый термин и обусловленный им контекст угощения, не заменяя основного текста толкованием.
lexical_decisions:
- source_word: זִבְחֵי שְׁלָמִים
  choice: мирные жертвы
  rationale: Устойчивое русское обозначение жертв мира и благополучия; сохраняет культовый смысл еврейского выражения и не сводит его к обычной трапезе.
- source_word: עָלַי
  choice: на мне лежали
  rationale: Передаёт буквальный образ «на мне» и его контекстуальный смысл обязательства принести жертвы. Такая формулировка естественна по-русски и не утверждает прямо, что мясо уже находилось у женщины.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент временного наречия.
- source_word: שִׁלַּמְתִּי
  choice: я исполнила
  rationale: В сочетании с обетами порода пиэль глагола שׁלם означает исполнение принятого обязательства. Женский род определяется говорящей в контексте главы.
- source_word: נְדָרָי
  choice: свои обеты
  rationale: Точно передаёт существительное во множественном числе с суффиксом первого лица; возвратное местоимение естественно для русского языка.
theological_decisions:
- issue: Культовая лексика в речи соблазняющей женщины
  choice: Сохранить прямое упоминание мирных жертв и обетов без моральной оценки внутри стиха.
  alternative: Передать смысл описательно как сообщение о приготовленной пище или угощении.
  rationale: Текст намеренно вкладывает законную культовую лексику в речь женщины; перевод должен сохранять это напряжение, не смягчая и не истолковывая его за читателя.
- issue: Смысл עָלַי при мирных жертвах
  choice: «На мне лежали» — обязанность принести жертвы.
  alternative: «У меня есть» — указание на доступное после жертвоприношения мясо.
  rationale: Конструкция естественно выражает лежавшее на говорящей обязательство, а следующая часть сообщает, что обеты исполнены сегодня. При этом контекст мирных жертв подразумевает последующую трапезу, что пояснено в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционной, но понятной библейской культовой лексикой. Фраза «на мне лежали» сохраняет образ оригинала и ясно выражает обязательство; женский род глагола соответствует говорящей в контексте.
