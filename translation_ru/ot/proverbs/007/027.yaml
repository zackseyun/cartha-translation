  text: דַּרְכֵ֣י שְׁא֣וֹל בֵּיתָ֑/הּ יֹ֝רְד֗וֹת אֶל חַדְרֵי מָֽוֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/027.yaml
  text: Her house is the way to Sheol[b][a], going down to the chambers of death.
translation:
  language: ru
  text: Дом её — пути в шеол[a], нисходящие во внутренние покои смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Шеол — мир мёртвых; возможный перевод: «могила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי
  choice: пути
  rationale: Сохранено множественное число сопряжённой формы «пути», с которым согласуется причастие женского рода множественного числа יֹרְדוֹת.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское представление о мире мёртвых и не сужает значение до могилы и не отождествляет его с более поздним понятием ада.
- source_word: בֵּיתָהּ
  choice: дом её
  rationale: Буквальное значение соответствует контексту дома чужой жены; порядок слов сохраняет поэтический акцент сказуемого.
- source_word: יֹרְדוֹת
  choice: нисходящие
  rationale: Причастие передаёт длительное направленное движение вниз и грамматически согласуется с «пути».
- source_word: אֶל
  choice: во
  rationale: В сочетании с движением и образом внутренних покоев естественно передаёт направление внутрь.
- source_word: חַדְרֵי
  choice: внутренние покои
  rationale: Передаёт значение внутренних комнат и сохраняет возвышенный, зловещий образ оригинала.
- source_word: מָוֶת
  choice: смерти
  rationale: Оставлено нарицательным существительным без навязывания персонификации.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: «Шеол» сохраняет широту древнееврейского понятия мира умерших, не сводя его к месту погребения и не вводя позднейшее учение об аде.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и множественного числа оригинала. «Внутренние покои» передаёт образ сокрытых глубин смерти; «нисходящие» поддерживает торжественно-предостерегающий тон.
