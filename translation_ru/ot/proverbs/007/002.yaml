  text: שְׁמֹ֣ר מִצְוֺתַ֣/י וֶ/חְיֵ֑ה וְ֝/תוֹרָתִ֗/י כְּ/אִישׁ֥וֹן עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/002.yaml
  text: Keep my commandments and live[a], and my instruction as the pupil of your eye.
translation:
  language: ru
  text: Соблюдай мои заповеди — и живи; моё наставление береги как зеницу ока.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как зрачок твоих глаз». Это древнееврейское выражение говорит о том, что следует оберегать с величайшей заботой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר
  choice: соблюдай
  rationale: В сочетании с заповедями глагол שׁמר означает не только хранение, но и внимательное исполнение; «соблюдай» естественно передаёт этот смысл по-русски.
- source_word: מִצְוֺתַי
  choice: мои заповеди
  rationale: Существительное מִצְוָה обозначает повеление или заповедь; форма множественного числа и суффикс первого лица переданы прямо.
- source_word: וֶחְיֵה
  choice: и живи
  rationale: 'Сохранена краткая древнееврейская конструкция с повелительной формой. Она допускает как прямой призыв жить, так и оттенок следствия: соблюдай — и будешь жить.'
- source_word: וְתוֹרָתִי
  choice: моё наставление
  rationale: В контексте Притч תּוֹרָה означает прежде всего обучение и наставление мудрости, а не только законодательный свод.
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  choice: как зеницу ока
  rationale: Устойчивое русское выражение точно передаёт образ зрачка как того, что оберегают с величайшей заботой. Для естественности по-русски повторён подразумеваемый глагол «береги».
theological_decisions:
- issue: Значение תּוֹרָה в контексте литературы мудрости
  choice: наставление
  alternative: закон; учение
  rationale: Речь идёт о наставлении говорящего в мудрости; «наставление» сохраняет широту слова и не отождествляет его без достаточных оснований исключительно с Моисеевым законом.
- issue: Связь между соблюдением заповедей и жизнью
  choice: и живи
  alternative: и будешь жить; чтобы тебе жить
  rationale: Буквальная сочинительная конструкция сохраняет присущую еврейскому тексту краткость и не уточняет сверх текста, является ли жизнь вторым призывом, обещанным следствием или целью соблюдения.
translation_notes:
  register: Современный литературный русский с сохранением достоинства афористической речи. Традиционное выражение «как зеницу ока» понятно в контексте и пояснено сноской; строчная буква в местоимении «мои» отражает речь отца-наставника без преждевременного отождествления говорящего с Богом.
