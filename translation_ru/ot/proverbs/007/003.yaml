  verdict: approve
  source_fidelity: 'Текст точно передаёт оба еврейских повеления с суффиксом 3-го лица множественного числа: קָשְׁרֵם — «Привяжи их», כָּתְבֵם — «напиши их». «К своим пальцам» естественно выражает в русском присоединение, подразумеваемое образом «на твоих пальцах», не меняя метафоры. «На скрижали своего сердца» сохраняет единственное число לוּחַ и образ письма на сердце.'
  naturalness: Фраза звучит естественно в современном литературном русском при сохранении умеренно возвышенного библейского регистра. Точка с запятой удачно разделяет параллельные повеления. «Скрижаль сердца» — понятный и литературно уместный библейский образ.
  terminology: «Привяжи», «пальцы», «напиши», «скрижаль», «сердце» последовательно и точно передают конкретные образы оригинала. Терминология не навязывает богословского толкования и не сужает многозначность לֵב.
