  text: Tie them on your fingers[a]; write them on the tablet of your heart.
translation:
  language: ru
  text: Привяжи их к своим пальцам; напиши их на скрижали своего сердца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: Привяжи их
  rationale: Императив от קשר с местоименным суффиксом буквально означает «свяжи/привяжи их». «Привяжи» естественно передаёт конкретный образ прикрепления наставлений к себе.
- source_word: עַל אֶצְבְּעֹתֶיךָ
  choice: к своим пальцам
  rationale: עַל здесь описывает прикрепление к пальцам; русский предлог «к» естественно сочетается с глаголом «привязать», а множественное число сохраняет еврейский образ.
- source_word: כָּתְבֵם
  choice: напиши их
  rationale: Императив от כתב с местоименным суффиксом прямо передаёт действие письма и сохраняет параллелизм с первым полустишием.
- source_word: עַל לוּחַ
  choice: на скрижали
  rationale: לוּחַ означает доску или табличку для письма. «Скрижаль» сохраняет конкретный древний образ и привычное для русского библейского языка метафорическое сочетание, оставаясь понятным в контексте.
- source_word: לִבֶּךָ
  choice: своего сердца
  rationale: לֵב обозначает сердце как средоточие мысли, воли и чувства. «Сердце» сохраняет ёмкость исходного образа без его истолковывающего сужения.
theological_decisions:
- issue: Метафора усвоения наставления
  choice: Сохранены образы привязывания к пальцам и письма на скрижали сердца.
  alternative: Всегда помни их и глубоко усвой.
  rationale: Конкретные образы несут литературную и богословскую нагрузку и перекликаются с языком завета и мудрости; пересказ сделал бы скрытый смысл явным ценой утраты образности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Форма обращения — единственное число мужского рода, как в еврейском тексте. Точка с запятой сохраняет параллелизм двух повелений.
