  text: For at the window of my house[a], through my lattice, I looked out,
translation:
  language: ru
  text: Ведь я выглянул из окна своего дома сквозь решётку[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я смотрел наружу». Еврейский глагол описывает взгляд наружу, нередко сверху вниз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит повествовательное обоснование последующего наблюдения; «ведь» естественно передаёт пояснительную силу, не сводя её к строгой причинности.
- source_word: בְּחַלּוֹן בֵּיתִי
  choice: из окна своего дома
  rationale: חַלּוֹן означает «окно», а конструкция описывает место наблюдения. В сочетании с глаголом выглядывания русское «из окна» естественно передаёт позицию говорящего.
- source_word: בְּעַד
  choice: сквозь
  rationale: Предлог указывает, что взгляд направлен через преграду или отверстие; «сквозь» сохраняет пространственный образ.
- source_word: אֶשְׁנַבִּי
  choice: решётку
  rationale: Слово обозначает решётчатое оконное отверстие или оконную решётку. Выбор отличает этот образ от ранее названного окна и звучит естественно по-русски.
- source_word: נִשְׁקָפְתִּי
  choice: я выглянул
  rationale: Глагол обозначает взгляд наружу, часто с возвышенной точки. «Выглянул» ясно и без лишнего усиления передаёт направленное наружу наблюдение.
