  yaml_path: translation/ot/proverbs/007/024.yaml
  text: And now[a], sons, listen to me, and pay attention to the words of my mouth.
translation:
  language: ru
  text: И теперь, сыновья[a], слушайте меня и внимайте словам моих уст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети». В еврейском тексте буквально «сыновья» — форма мужского рода во множественном числе, обычная для наставлений в литературе мудрости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Союз с наречием времени обозначает переход к новому настойчивому призыву; «И теперь» сохраняет связность речи.
- source_word: בָנִים
  choice: сыновья
  rationale: В еврейском тексте употреблено существительное мужского рода во множественном числе, характерное для обращения наставника в литературе мудрости.
- source_word: שִׁמְעוּ לִי
  choice: слушайте меня
  rationale: Сочетание שׁמע с ל выражает направленное, внимательное слушание; этот перевод естественен в современном русском языке.
- source_word: וְהַקְשִׁיבוּ
  choice: и внимайте
  rationale: Форма глагола קשׁב усиливает призыв к сосредоточенному слушанию; «внимайте» передаёт это значение и поддерживает достоинство поэтического наставления.
- source_word: לְאִמְרֵי
  choice: словам
  rationale: Форма множественного числа в сопряжённом состоянии означает «словам/изречениям»; «словам» естественно сочетается с образом уст.
- source_word: פִי
  choice: моих уст
  rationale: Сохранён буквальный поэтический образ «слова моих уст», подчёркивающий непосредственное наставление говорящего.
theological_decisions:
- issue: Гендерно маркированное обращение в наставлении мудрости
  choice: сыновья
  alternative: дети
  rationale: Исходный текст имеет форму мужского рода во множественном числе. Основной перевод сохраняет её, не исключая возможной представительной широты обращения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Параллелизм двух повелений и образ «слов моих уст» сохранены.
