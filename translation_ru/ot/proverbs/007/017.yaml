  text: I have perfumed my bed with myrrh[a], aloes, and cinnamon.
translation:
  language: ru
  text: Я надушила своё ложе миррой, алойным деревом[a] и корицей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «алоэ»; речь идёт об ароматической древесине, употреблявшейся для благовоний, а не об алоэ в обычном современном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתִּי
  choice: Я умастила
  rationale: Форма породы пиэль обозначает нанесение благовонных веществ. «Умастила» естественно передаёт намеренное насыщение ложа ароматами и сохраняет возвышенный, но понятный регистр.
- source_word: מִשְׁכָּבִי
  choice: своё ложе
  rationale: מִשְׁכָּב — место, где лежат или спят. В контексте соблазнения «ложе» звучит естественно и несколько более литературно, чем «кровать».
- source_word: מֹר
  choice: миррой
  rationale: Устоявшееся русское название ароматической смолы, точно соответствующее еврейскому מֹר.
- source_word: אֲהָלִים
  choice: алойным деревом
  rationale: Здесь имеется в виду ароматическая древесина, а не обычное современное растение алоэ. Этот вариант точнее привычного, но потенциально вводящего в заблуждение слова «алоэ».
- source_word: וְקִנָּמוֹן
  choice: и корицей
  rationale: Прямой и естественный перевод названия пряности קִנָּמוֹן; союз сохраняет структуру перечня.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной лексикой. Женский род глагола следует контексту речи женщины в Притчах 7. Перечень благовоний сохранён без добавочного толкования.
