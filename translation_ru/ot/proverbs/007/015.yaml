  text: Поэтому я вышла тебе навстречу, чтобы искать встречи с тобой, — и нашла тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Естественно и точно передаёт причинно-следственную связь с предыдущими словами женщины.
- source_word: יָצָאתִי
  choice: я вышла
  rationale: Обычное русское соответствие глаголу «выходить»; форма женского рода определяется говорящей в контексте.
- source_word: לִקְרָאתֶךָ
  choice: тебе навстречу
  rationale: Идиоматично передаёт направленное движение с целью встречи и сохраняет местоимение второго лица.
- source_word: לְשַׁחֵר פָּנֶיךָ
  choice: чтобы усердно искать тебя
  rationale: Глагол обозначает настойчивые, а возможно и ранние поиски; сочетание буквально говорит об искании «твоего лица», но по-русски естественно означает поиск самого человека.
- source_word: וָאֶמְצָאֶךָּ
  choice: и нашла тебя
  rationale: Простое прошедшее время точно передаёт последовательность действий и непосредственный итог поисков.
