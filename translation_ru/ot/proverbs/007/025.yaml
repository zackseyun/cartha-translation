  text: אַל יֵ֣שְׂטְ אֶל דְּרָכֶ֣י/הָ לִבֶּ֑/ךָ אַל תֵּ֝תַע בִּ/נְתִיבוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/025.yaml
  text: Do not let your heart turn aside to her ways; do not wander into her paths.
translation:
  language: ru
  text: Пусть твоё сердце не сворачивает на её пути; не блуждай по её тропам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשְׂטְ
  choice: не сворачивает
  rationale: Передаёт образ отклонения от верного направления и сохраняет сердце как грамматический субъект.
- source_word: דְּרָכֶיהָ
  choice: на её пути
  rationale: Естественно передаёт направительное אֶל и образ путей, к которым обращается сердце.
- source_word: תֵּתַע
  choice: не блуждай
  rationale: Сохраняет значение бесцельного или ошибочного хождения, не сводя его лишь к однократному уклонению.
- source_word: בִּנְתִיבוֹתֶיהָ
  choice: по её тропам
  rationale: Предлог בְּ здесь естественно передаётся русским «по» при обозначении движения по тропам.
