  verdict: approve
  source_fidelity: «Пойдём» естественно передаёт пригласительное לְכָה. «Будем упиваться ласками» удачно сохраняет образ רוה («насыщаться/пить вдоволь») и эротически окрашенное דֹדִים, не делая выражение грубее оригинала. «До утра» точно передаёт עַד הַבֹּקֶר. «Наслаждаться любовью» передаёт נִתְעַלְּסָה בָּאֳהָבִים; в данном контексте «любовью» имеет требуемый чувственный смысл, но не навязывает более узкое толкование.
  naturalness: Фраза звучит естественно на современном литературном русском. Общая форма «будем упиваться ..., наслаждаться ...» нормативна и передаёт параллельные побудительные формы оригинала без ненужного повтора.
  terminology: Различение «ласками» для דֹדִים и «любовью» для אֳהָבִים оправданно сохраняет лексическое варьирование еврейского текста. Регистр соответствует соблазнительной речи в контексте и не содержит добавленной доктринальной либо чрезмерно эксплицитной окраски.
