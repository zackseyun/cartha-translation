  yaml_path: translation/ot/proverbs/007/018.yaml
  text: Come[a], let us drink our fill of love until morning[b]; let us delight ourselves with love.
translation:
  language: ru
  text: Пойдём, будем упиваться ласками до утра, наслаждаться любовью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: Пойдём
  rationale: Императив от הלך здесь служит идиоматическим призывом; «Пойдём» естественно передаёт приглашение в данном соблазняющем контексте.
- source_word: נִרְוֶה
  choice: будем упиваться
  rationale: Глагол רוה означает «насыщаться питьём, напиваться вдоволь». «Упиваться» сохраняет метафору насыщения и чувственный оттенок.
- source_word: דֹדִים
  choice: ласками
  rationale: Во множественном числе דֹדִים в эротическом контексте может обозначать проявления физической любви, ласки. Такой выбор естественно сочетается с глаголом «упиваться» и не ослабляет конкретный смысл.
- source_word: עַד הַבֹּקֶר
  choice: до утра
  rationale: Прямой и естественный современный эквивалент временного оборота.
- source_word: נִתְעַלְּסָה
  choice: наслаждаться
  rationale: Форма хитпаэль от עלס выражает упоение, наслаждение или веселье; русский глагол передаёт взаимно-рефлексивный оттенок без стилистической тяжеловесности.
- source_word: בָּאֳהָבִים
  choice: любовью
  rationale: Множественное существительное от אהב в контексте имеет эротический смысл. «Любовью» сохраняет образную широту оригинала, тогда как «любовными утехами» было бы более конкретным толкованием.
