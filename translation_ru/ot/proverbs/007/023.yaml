  source_fidelity: 'Основной образ передан верно: стрела пронзает печень, а поспешное движение в силок ведёт к гибели. Однако в проекте местоимения «её жизни» и толкование незнания как относящегося к птице необоснованно смещают референт. Мужские формы יָדַע и נַפְשׁוֹ естественно продолжают образ юноши из предшествующего контекста; сравнение с птицей описывает его безрассудное движение.'
