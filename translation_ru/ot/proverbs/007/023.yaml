    reason: лексическая неоднозначность
lexical_decisions:
- source_word: עַד
  choice: пока не
  rationale: Временной союз продолжает описание из предыдущего стиха и указывает на роковой итог движения юноши.
- source_word: יְפַלַּח
  choice: пронзит
  rationale: Порода пиэль глагола פלח выражает сильное проникновение; «пронзит» естественно сочетается со стрелой и сохраняет яркость образа.
- source_word: חֵץ
  choice: стрела
  rationale: Обычное значение слова; контекст не требует иной передачи.
- source_word: כְּבֵדוֹ
  choice: ему печень
  rationale: Сохранён конкретный орган, названный в еврейском тексте, без замены на «сердце» или обобщённые «внутренности».
- source_word: כְמַהֵר צִפּוֹר אֶל־פָּח
  choice: как птица спешит в силок
  rationale: Передаёт стремительное движение птицы навстречу ловушке; «силок» уместен именно для ловли птиц.
- source_word: וְלֹא יָדַע
  choice: не зная
  rationale: Деепричастная конструкция естественно связывает незнание с поспешным движением птицы и сохраняет смысл исходной клаузы.
- source_word: כִּי בְנַפְשׁוֹ הוּא
  choice: что речь идёт о её жизни
  rationale: Сохраняет эллиптичность и неоднозначность буквального выражения «это — за/против её жизни», не сводя его безоговорочно к одному истолкованию.
