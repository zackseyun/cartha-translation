  text: He took a bag of money in his hand[a]; he will come home at the full moon.
translation:
  language: ru
  text: Он взял с собой кошель с деньгами; домой вернётся в день полнолуния.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в назначенный день»; значение еврейского слова не вполне ясно. Его также понимают как «новолуние», однако здесь наиболее вероятно «полнолуние».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: кошель
  rationale: Существительное обозначает завязанный свёрток или мешочек; в сочетании с деньгами естественно передаётся как «кошель».
- source_word: הַכֶּסֶף
  choice: деньгами
  rationale: Хотя основное значение слова — «серебро», здесь оно метонимически означает деньги, взятые в дорогу.
- source_word: לָקַח בְיָדוֹ
  choice: взял с собой
  rationale: Буквально «взял в свою руку»; современное русское «взял с собой» естественно передаёт смысл еврейской идиомы в контексте отъезда.
- source_word: לְיוֹם
  choice: в день
  rationale: Предлог с существительным «день» указывает на срок возвращения; «в день» сохраняет временное значение и связь с последующим словом.
- source_word: הַכֵּסֶא
  choice: полнолуния
  rationale: Редкое и спорное слово, вероятнее всего, обозначает полнолуние как определённый срок лунного месяца; неоднозначность отражена в сноске.
- source_word: יָבֹא בֵיתוֹ
  choice: домой вернётся
  rationale: Буквально «придёт в свой дом»; «домой вернётся» ясно и естественно выражает возвращение отсутствующего хозяина.
theological_decisions: []
