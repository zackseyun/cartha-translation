  text: For she has cast down many wounded[a], and all her slain are mighty.
translation:
  language: ru
  text: 'Ибо она повергла многих раненых[a],

    и все убитые ею сильны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многих убитых она повергла». Еврейское слово может означать как раненых, так и убитых.'
