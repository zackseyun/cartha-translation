lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительное обоснование предшествующего предостережения и естественно звучит в русском контексте.
- source_word: רַבִּים
  choice: многих
  rationale: Сохраняет обычное количественное значение слова и согласуется с объектной конструкцией при глаголе.
- source_word: חֲלָלִים
  choice: раненых
  rationale: Слово может обозначать как поражённых или раненых, так и убитых. «Раненых» сохраняет возможное усиление по отношению к следующей строке, где прямо названы убитые.
- source_word: הִפִּילָה
  choice: она повергла
  rationale: Каузативная форма от נפל означает «заставила пасть, повергла»; выбранный глагол краток, выразителен и уместен в поэтической речи.
- source_word: וַעֲצֻמִים
  choice: и могучи
  rationale: Передаёт основное значение силы и сохраняет утверждение, что среди её жертв были даже сильные люди. Возможное значение «многочисленны» не подставлено в основной текст, чтобы не устранять лексическую неоднозначность.
- source_word: כָּל
  choice: все
  rationale: Прямо передаёт универсальное значение еврейского слова.
- source_word: הֲרֻגֶיהָ
  choice: убитые ею
  rationale: Естественно по-русски передаёт пассивное значение «те, кого она убила» и женский суффикс деятеля.
