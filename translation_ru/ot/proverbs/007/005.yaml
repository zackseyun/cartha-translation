  text: to keep you from the forbidden woman[a], from the foreign woman whose words are smooth.
translation:
  language: ru
  text: чтобы уберечь тебя от чужой женщины, от чужеземки, которая льстит своими речами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделала свои речи гладкими»; возможный перевод: «говорит вкрадчиво».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: чтобы уберечь тебя
  rationale: Инфинитив с ל выражает цель по отношению к предыдущему стиху. «Уберечь» естественно передаёт защитный смысл שמר.
- source_word: מֵאִשָּׁה זָרָה
  choice: от чужой женщины
  rationale: זָרָה буквально означает «чужая, посторонняя», а в контексте Притчей указывает на женщину вне дозволенных отношений. «Чужая женщина» сохраняет образ и не сужает значение исключительно до прелюбодейки.
- source_word: מִנָּכְרִיָּה
  choice: от чужеземки
  rationale: נָכְרִיָּה имеет более прямое значение «иноземная, чужеземная женщина». Такой перевод сохраняет лексическое различие между двумя параллельными обозначениями, не утверждая, что опасность связана исключительно с этническим происхождением.
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  choice: которая льстит своими речами
  rationale: Буквально сочетание означает «сделала гладкими свои речи». В данном контексте метафора гладкой речи обозначает лесть или обольщение; выбранная формулировка естественна по-русски, а буквальный образ сохранён в примечании.
theological_decisions:
- issue: Значение זָרָה и נָכְרִיָּה в нравственном контексте Притчей
  choice: 'Сохранены разные обозначения: «чужая женщина» и «чужеземка».'
  alternative: Передать оба слова как «запретная женщина» или «прелюбодейка».
  rationale: Контекст придаёт словам нравственный оттенок, однако исходный текст сохраняет образ чужой/иноземной женщины. Перевод не должен ни сводить оба слова к этнической категории, ни безоговорочно отождествлять женщину с замужней прелюбодейкой.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и назидательная. «Чужеземка» сохраняет параллелизм и лексическое различие еврейского текста, а примечание раскрывает образ «гладкой» речи.
