  yaml_path: translation/ot/proverbs/007/004.yaml
  text: Say to wisdom[a], “You are my sister,” and call understanding your kinswoman,
translation:
  language: ru
  text: 'Скажи мудрости: «Ты моя сестра», а разумение назови близким другом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственником», «знакомым» или «близким человеком». Еврейское מוֹדָע обозначает человека, которого хорошо знают; в зависимости от контекста это может быть знакомый, близкий друг или родственник.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לַחָכְמָה
  choice: Скажи мудрости
  rationale: Императив אֱמֹר передан прямым побуждением, а ל обозначает адресата речи. «Мудрость» сохраняет обычное для Притч олицетворение.
- source_word: אֲחֹתִי אָתְּ
  choice: Ты моя сестра
  rationale: Буквальный термин родства с местоименным суффиксом сохраняет семейный образ; женский род согласуется с олицетворённой мудростью.
- source_word: וּמֹדָע
  choice: близким другом
  rationale: מוֹדָע обозначает близко знакомого человека и в разных контекстах может указывать на друга, знакомого или родственника. Здесь выбран естественный русский эквивалент, выражающий близость, но неоднозначность отмечена в сноске.
- source_word: לַבִּינָה
  choice: разумение
  rationale: «Разумение» передаёт בִּינָה как способность понимать и различать и сохраняет возвышенный, но понятный поэтический регистр.
- source_word: תִקְרָא
  choice: назови
  rationale: Форма имеет побудительную силу параллельно начальному императиву. В сочетании с обозначением отношения «назови» по-русски естественнее буквального «призови».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и олицетворения мудрости и разумения. Мужской род слова «друг» создаёт грамматическое напряжение рядом с женским «разумение», однако отражает мужскую форму מוֹדָע; сноска сохраняет широту значения.
