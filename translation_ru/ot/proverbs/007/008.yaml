translation:
  language: ru
  text: проходя по улице возле её угла[a], он идёт дорогой к её дому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проходя по торговой улице возле её угла и идя дорогой к её дому».'
    reason: Лексема שׁוּק может обозначать как улицу вообще, так и торговую улицу; צעד допускает более нейтральное «идти».
lexical_decisions:
- source_word: עֹבֵר
  choice: проходя
  rationale: Деепричастие передаёт причастную, задающую сцену форму еврейского глагола и естественно сочетается с последующим личным глаголом.
- source_word: בַּשּׁוּק
  choice: по улице
  rationale: שׁוּק обозначает общественную улицу, нередко торговую; в данном городском контексте «по улице» звучит естественно, а возможный торговый оттенок отмечен в сноске.
- source_word: אֵצֶל פִּנָּהּ
  choice: возле её угла
  rationale: Сохраняется буквальное значение близости и принадлежности угла женщине без уточнения, отсутствующего в оригинале.
- source_word: וְדֶרֶךְ בֵּיתָהּ
  choice: по дороге к её дому
  rationale: Передаёт конкретный маршрут и направленность к дому, сохраняя существительное דֶּרֶךְ — «дорога, путь».
- source_word: יִצְעָד
  choice: он шагает
  rationale: Глагол צעד обозначает движение шагами; «шагает» сохраняет конкретный образ и переход от причастного описания к личной глагольной форме.
