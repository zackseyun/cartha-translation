  text: Как колючка, поднимающаяся в руке пьяного, так и притча в устах глупцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוֹחַ
  choice: колючка
  rationale: Слово может обозначать колючку, шип или колючее растение. «Колючка» естественно передаёт образ острого и опасного предмета, не превращая его непременно в целый куст.
- source_word: עָלָה
  choice: поднимается
  rationale: Основное значение глагола — «подниматься, восходить». Настоящее время сохраняет образ и его неоднозначность, не уточняя без достаточных оснований, занесена ли колючка рукой, поднята ли как оружие или вонзается в руку.
- source_word: בְיַד
  choice: в руке
  rationale: Прямой и естественный перевод сохраняет конкретный образ и параллель с выражением «в устах».
- source_word: שִׁכּוֹר
  choice: пьяный
  rationale: Субстантивированное прилагательное обозначает нетрезвого человека. «Пьяный» в русском языке звучит естественно и не добавляет значения укоренившейся привычки, которое может подразумевать слово «пьяница».
- source_word: מָשָׁל
  choice: притча
  rationale: В книге Притчей слово обозначает образное мудрое изречение, афоризм или притчу. «Притча» сохраняет традиционный жанровый оттенок и хорошо подходит к изречению, которое глупец произносит, но употребляет опасно или неуместно.
- source_word: בְפִי
  choice: в устах
  rationale: Передаёт буквальный телесный образ речи и образует стилистически уместную параллель с «в руке».
- source_word: כְסִילִים
  choice: глупцов
  rationale: Это обычное для литературы мудрости обозначение людей нравственно неразумных и упрямых, а не просто обладающих низкими умственными способностями.
