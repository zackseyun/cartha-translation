translation:
  language: ru
  text: Как снег летом и как дождь во время жатвы, так честь не подобает глупцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּשֶּׁלֶג
  choice: Как снег
  rationale: Префикс כ выражает сравнение; «как снег» естественно передаёт начало параллельного образа.
- source_word: בַּקַּיִץ
  choice: летом
  rationale: Обозначает жаркий сухой сезон; краткое русское «летом» идиоматично и сохраняет выразительность пословицы.
- source_word: וְכַמָּטָר
  choice: и как дождь
  rationale: Сохраняет вторую часть параллельного сравнения и союзную связь еврейского текста.
- source_word: בַּקָּצִיר
  choice: во время жатвы
  rationale: קָצִיר означает жатву или время сбора урожая; эта формулировка ясно передаёт сезонный контекст.
- source_word: כֵּן
  choice: так
  rationale: Вводит вывод из двух сравнительных образов и естественно звучит в русской пословичной конструкции «как…, так…».
- source_word: לֹא נָאוֶה
  choice: не подобает
  rationale: Передаёт значение неуместности и несоответствия; это современная литературная формулировка с подходящим для библейской мудрости достоинством.
- source_word: לִכְסִיל
  choice: глупцу
  rationale: ל передано дательным падежом при сказуемом «подобает»; «глупец» сохраняет устойчивый термин литературы мудрости.
- source_word: כָּבוֹד
  choice: честь
  rationale: В данном контексте слово обозначает общественный почёт или уважение, а не божественную славу; «честь» естественно сочетается с «подобает».
