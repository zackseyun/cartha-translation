review_pass:
  verdict: revise
  source_fidelity: Основной перевод в целом точно передаёт два параллельных образа и их закономерное последствие. Во второй строке אֵלָיו («к нему/на него») допускает как нейтральное возвращение камня к катящему, так и его пагубное обращение на самого человека; это следует сохранять без излишней конкретизации.
  naturalness: Фраза «к тому он вернётся» понятна, но несколько тяжеловесна для русской пословичной строки. «К нему он и вернётся» естественнее и сохраняет параллельную краткость.
  terminology: «Яма», «катит камень» и «вернётся» — точные, современные и стилистически уместные соответствия. Богословски нагруженных терминов нет.
  issues:
  - severity: low
    issue: Сноска вводит избыточно конкретный глагол «покатится» и объяснение «обрушивается на него».
    rationale: В еврейском тексте сказано, что камень «вернётся» к/на человека; способ движения и степень причиняемого вреда прямо не описаны. Сноска должна отмечать направленностный нюанс אֵלָיו, не разворачивая образ в более конкретную сцену.
  - severity: low
    issue: Оборот «к тому он вернётся» менее естественен, чем «к нему он и вернётся».
    rationale: Местоимение «нему» непосредственно отсылает к человеку из предыдущей части и поддерживает пословичный ритм; частица «и» удачно передаёт смысл неизбежного обратного последствия.
  revised_text: Кто роет яму, тот в неё упадёт, а кто катит камень, к нему он и вернётся.[a]
