  text: כֹּֽרֶה שַּׁ֭חַת בָּ֣/הּ יִפֹּ֑ל וְ/גֹ֥לֵ֥ל אֶ֝בֶן אֵלָ֥י/ו תָּשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/027.yaml
  text: Whoever digs a pit will fall into it[a], and he who rolls a stone, it will come back on him.
translation:
  language: ru
  text: Кто роет яму, тот в неё упадёт, а кто катит камень, к нему он и вернётся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на него он и вернётся».'
    reason: Предлог אֵלָיו может передавать направленность как «к нему», так и «на него», сохраняя образ того, что действие обращается против самого человека.
lexical_decisions:
- source_word: כֹּרֶה
  choice: кто роет
  rationale: Субстантивированное причастие qal обозначает любого человека; конструкция «кто… тот…» естественно передаёт обобщённый характер пословицы.
- source_word: שַּׁחַת
  choice: яму
  rationale: Слово обозначает яму, в том числе вырытую как ловушку; «яма» сохраняет традиционный и понятный образ без излишнего уточнения.
- source_word: בָּהּ
  choice: в неё
  rationale: Местоименный суффикс женского рода относится к «яме»; русское «упасть в неё» точно и естественно передаёт направление.
- source_word: יִפֹּל
  choice: упадёт
  rationale: Имперфект выражает закономерное последствие; будущее время естественно передаёт причинно-следственный смысл пословицы.
- source_word: וְגֹלֵל
  choice: а кто катит
  rationale: Второе субстантивированное причастие продолжает параллельную обобщённую конструкцию. Союз «а» яснее передаёт сопоставительный параллелизм по-русски.
- source_word: אֶבֶן
  choice: камень
  rationale: Обычное и достаточно широкое соответствие еврейскому אֶבֶן, сохраняющее конкретный образ.
- source_word: אֵלָיו
  choice: к тому
  rationale: Предлог с местоименным суффиксом выражает направленность обратно к человеку. Такой перевод сохраняет возможность как простого возвращения, так и пагубной отдачи.
- source_word: תָּשׁוּב
  choice: он вернётся
  rationale: Глагол женского рода согласован с «камнем» в еврейском; русское местоимение мужского рода согласовано с русским словом «камень». «Вернётся» точно передаёт שוב и сохраняет образ обратного движения.
