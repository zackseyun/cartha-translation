- from: Кто роет яму, тот в неё упадёт, а кто катит камень, к тому он вернётся.[a]
  to: Кто роет яму, тот в неё упадёт, а кто катит камень, к нему он и вернётся.[a]
  rationale: Исправление делает вторую строку более естественной по-русски и уточняет сноску как действительную переводческую альтернативу. При этом сохраняются образность, параллелизм и неоднозначность еврейского אֵלָיו, без добавления невыраженных деталей о падении или ударе камня.
