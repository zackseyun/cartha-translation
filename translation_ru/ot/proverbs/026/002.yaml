  yaml_path: translation/ot/proverbs/026/002.yaml
  text: Like a sparrow in its wandering[a], like a swallow in its flying[c][b], so an undeserved curse does not come to rest.
translation:
  language: ru
  text: 'Как воробей порхает, как ласточка летает,

    так незаслуженное проклятие не придёт[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не придёт». В образе летящих птиц может подразумеваться, что такое проклятие не опустится на адресата и не подействует.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּצִּפּוֹר
  choice: как воробей
  rationale: צִפּוֹר может обозначать птицу вообще, особенно небольшую; «воробей» естественно передаёт образ малой беспокойно движущейся птицы и сохраняет параллель с ласточкой.
- source_word: לָנוּד
  choice: порхает
  rationale: נוּד выражает блуждание, беспокойное перемещение или трепетание; «порхает» кратко и наглядно передаёт движение птицы в русском поэтическом параллелизме.
- source_word: כַּדְּרוֹר
  choice: как ласточка
  rationale: דְּרוֹר традиционно понимается как «ласточка», хотя точное определение вида птицы спорно; для русского читателя этот образ узнаваем и хорошо сочетается с полётом.
- source_word: לָעוּף
  choice: летает
  rationale: עוּף означает «летать»; форма настоящего времени естественно выражает характерное действие птицы и общий характер пословицы.
- source_word: קִלְלַת חִנָּם
  choice: незаслуженное проклятие
  rationale: Буквально сочетание означает «проклятие без причины, без основания». «Незаслуженное» ясно передаёт нравственный смысл חִנָּם, не предполагая реальной вины адресата.
- source_word: לֹא תָבֹא
  choice: не падёт
  rationale: Буквально בוא означает «приходить». В контексте образа летящих птиц русское «не падёт» естественно обозначает, что проклятие не достигнет адресата и не ляжет на него, сохраняя при этом образ движения и приземления.
theological_decisions:
- issue: Действенность незаслуженного проклятия
  choice: Фраза утверждает, что незаслуженное проклятие не падёт на адресата.
  alternative: Буквальное «не придёт» либо более толковательное «не сбудется».
  rationale: Перевод не приписывает проклятию автоматической или магической силы и не уточняет механизм его недейственности; он сохраняет категоричность еврейского לֹא תָבֹא и образный контекст.
translation_notes:
  register: Современный литературный русский с кратким пословичным ритмом. Две параллельные части передают движение птиц, а «не падёт» связывает вывод с образом полёта без тяжеловесного буквального оборота.
