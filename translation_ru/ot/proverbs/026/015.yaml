  yaml_path: translation/ot/proverbs/026/015.yaml
  text: A sluggard buries his hand in the dish[b][a]; he is too weary to bring it back to his mouth.
translation:
  language: ru
  text: Лентяй зарывает[a] руку в блюдо[b], но слишком устал, чтобы снова поднести её ко рту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прячет». Еврейский глагол может означать «прятать» или «зарывать»; вариант «зарывает» сохраняет преувеличенный образ изречения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в миску» или «в тарелку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: зарывает
  rationale: Глагол означает «прятать, скрывать, зарывать». «Зарывает» сохраняет нарочито преувеличенный и комический образ притчи; настоящее время естественно передаёт общехарактерное высказывание.
- source_word: עָצֵל
  choice: лентяй
  rationale: В Притчах это устойчивый тип человека. «Лентяй» кратко и естественно сохраняет характерологическую силу слова.
- source_word: יָדוֹ
  choice: руку
  rationale: Прямой перевод существительного в единственном числе с местоименным суффиксом 3-го лица мужского рода; принадлежность ясна из подлежащего.
- source_word: בַּצַּלָּחַת
  choice: в блюдо
  rationale: Существительное обозначает сосуд для еды — блюдо, миску или чашу. «Блюдо» не уточняет форму сосуда сверх исходного текста и естественно в данном контексте.
- source_word: נִלְאָה
  choice: слишком утомлён
  rationale: Форма нифаль выражает усталость или изнеможение. Конструкция со «слишком… чтобы» естественно передаёт контекстуальный результат, не заменяя образ усталости прямым утверждением о нежелании.
- source_word: לַהֲשִׁיבָהּ
  choice: чтобы вернуть её
  rationale: Каузативная форма שוב означает «возвратить, принести обратно»; местоименный суффикс женского рода относится к руке.
- source_word: אֶל פִּיו
  choice: ко рту
  rationale: Прямой и естественный перевод направления движения; принадлежность рта тому же лентяю ясна по-русски без повторного местоимения.
