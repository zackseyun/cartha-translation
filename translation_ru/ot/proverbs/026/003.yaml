  text: Бич — коню, узда — ослу, а розга — для спины глупцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹט
  choice: бич
  rationale: Обозначает орудие, которым понукают или наказывают животное; «бич» точно и лаконично передаёт образ, сохраняя возвышенную афористичность.
- source_word: לַסּוּס
  choice: коню
  rationale: Предлог ל указывает на предназначение; беспредложный дательный естественно выражает это по-русски. Единственное число имеет обобщённо-пословичный смысл.
- source_word: מֶתֶג
  choice: узда
  rationale: Слово обозначает средство управления животным и может пониматься уже как «удила»; «узда» сохраняет более широкое значение всего управляющего снаряжения.
- source_word: לַחֲמוֹר
  choice: ослу
  rationale: Современное нейтральное название животного; дательный падеж передаёт значение предназначения.
- source_word: וְשֵׁבֶט
  choice: а розга
  rationale: שֵׁבֶט здесь означает прут или жезл для телесного наказания. «Розга» ясно передаёт дисциплинарное применение и естественно сочетается со «спинам».
- source_word: לְגֵו
  choice: спинам
  rationale: גֵו обозначает спину или туловище, здесь — спину как место удара. Число согласовано с множественным «глупцов» ради естественного русского выражения.
- source_word: כְּסִילִים
  choice: глупцов
  rationale: В Книге Притчей это нравственно неразумные люди, а не люди с ограниченными умственными возможностями; «глупцы» сохраняет устойчивую терминологию литературы мудрости.
