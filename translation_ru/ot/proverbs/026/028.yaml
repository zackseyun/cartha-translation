  text: A lying tongue hates those it crushes[c][b][a], and a flattering mouth causes ruin.
translation:
  language: ru
  text: Лживый язык ненавидит тех, кого он сокрушает[a], а льстивые уста[b] приводят к падению[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих сокрушённых», «тех, кого ранил». Еврейское слово указывает на жертв, которых сокрушили или угнетали.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «гладкие уста» — то есть вкрадчивая, льстивая или обманчиво приятная речь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ведут к краху», «несут гибель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן שֶׁקֶר
  choice: лживый язык
  rationale: Передаёт буквально «язык лжи» естественным русским выражением и сохраняет олицетворение языка как действующего лица.
- source_word: יִשְׂנָא
  choice: ненавидит
  rationale: Форма yiqtol выражает общеизвестную, повторяющуюся истину; настоящее время соответствует характеру притчи.
- source_word: דַכָּיו
  choice: тех, кого сокрушил
  rationale: Форма обозначает сокрушённых или угнетённых жертв. Относительное придаточное естественно по-русски выражает подразумеваемую связь жертв с лживым языком и сохраняет сильный образ корня.
- source_word: וּפֶה חָלָק
  choice: а льстивые уста
  rationale: Буквально это «гладкие уста»; в данном речевом образе гладкость указывает на лесть или обманчивую вкрадчивость. «Льстивые уста» ясно передают смысл и сохраняют телесную метафору.
- source_word: יַעֲשֶׂה
  choice: приводят к
  rationale: Глагол «делать, производить» в сочетании с существительным результата естественно передаётся по-русски причинной конструкцией «приводят к».
- source_word: מִדְחֶה
  choice: падению
  rationale: Существительное может обозначать падение, крах или гибель. «Падение» сохраняет основной образ и не усиливает значение до полного уничтожения.
