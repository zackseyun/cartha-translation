id: PRO.26.5
reference: Proverbs 26:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עֲנֵ֣ה כְ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּן יִהְיֶ֖ה חָכָ֣ם בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/005.yaml
  text: Answer a fool according to his folly[b][a], lest he be wise in his own eyes.
translation:
  language: ru
  text: Отвечай глупцу по его глупости[a][b], чтобы он не был мудр в собственных глазах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отвечай глупцу так, как заслуживает его глупость». Еврейский текст говорит об ответе, соответствующем его глупости, а не о подражании ей.'
    reason: lexical_alternative
  - marker: b
    text: 'Это изречение намеренно стоит в напряжении с Притчами 26:4: мудрость различает, когда следует промолчать, а когда — возразить.'
    reason: cross_reference
lexical_decisions:
- source_word: עֲנֵה
  choice: Отвечай
  rationale: Императив глагола ענה требует дать ответ. «Отвечай» кратко и естественно передаёт форму наставления и сохраняет связь с предыдущим стихом.
- source_word: כְסִיל
  choice: глупцу
  rationale: כְסִיל — устойчивое понятие литературы мудрости, обозначающее человека, упорного в нравственной и рассудочной глупости. «Глупец» сохраняет эту категорию без лишнего толкования.
- source_word: כְאִוַּלְתּוֹ
  choice: по его глупости
  rationale: 'Предлог כְּ выражает соответствие: ответ должен соотноситься с глупостью этого человека. Формулировка сохраняет близость к еврейскому тексту и намеренное напряжение с Притчами 26:4, не утверждая, что отвечающий должен подражать глупости.'
- source_word: פֶּן
  choice: чтобы … не
  rationale: פֶּן вводит отрицательную цель или указывает на предотвращаемый результат. Русская конструкция «чтобы … не» точно и естественно передаёт эту связь.
- source_word: יִהְיֶה חָכָם
  choice: не был мудр
  rationale: Речь не о подлинной мудрости глупца, а о его мнении о себе, что определяется последующим оборотом «в собственных глазах». Перевод сохраняет еврейскую конструкцию.
- source_word: בְּעֵינָיו
  choice: в собственных глазах
  rationale: Еврейская идиома означает «по собственной оценке». Русское выражение «в собственных глазах» сохраняет образ и ясно передаёт смысл.
theological_decisions:
- issue: Намеренное напряжение с Притчами 26:4
  choice: Сохранить формулировку «по его глупости», не устраняя кажущееся противоречие в основном тексте.
  alternative: «так, как заслуживает его глупость» или «сообразно его глупости»
  rationale: 'Соседние изречения передают ситуативное напряжение мудрости: нельзя отвечать так, чтобы самому уподобиться глупцу (ст. 4), но порой необходимо ответить применительно к его глупости, чтобы разоблачить её (ст. 5). Перевод не должен сводить это напряжение к одному правилу.'
translation_notes:
  register: Современный литературный русский язык с краткой, достойной афористической формой. Оборот «в собственных глазах» сохраняет библейский образ и остаётся понятным современному читателю; «по его глупости» намеренно сохраняет смысловую неоднозначность оригинала.
