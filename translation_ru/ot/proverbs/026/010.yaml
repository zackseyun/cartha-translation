  text: Like an archer who wounds everyone is one who hires a fool or hires passersby[a][b].
translation:
  language: ru
  text: Как стрелок, ранящий всех, так и тот, кто нанимает глупца или нанимает прохожих[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст этого стиха чрезвычайно труден. Перевод «как стрелок, ранящий всех» следует давнему толкованию. Начало стиха можно понять и более буквально, например: «Великий производит всё», однако в данном контексте смысл такого чтения остаётся неясным.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «нанимает глупца и нанимает любого прохожего». Речь, по-видимому, идёт о неразборчивом найме, который причиняет вред.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב
  choice: стрелок
  rationale: Масоретский текст крайне труден. Выбор следует древнему и контекстуально связному пониманию слова как обозначения стрелка; обычные значения «великий», «знатный» или «множество» не дают ясной мысли в этой строке.
- source_word: מְחוֹלֵל
  choice: ранящий
  rationale: В сочетании с образом стрелка передаёт причинение телесного вреда; такой смысл согласуется с возможной связью формы с корнями, обозначающими пронзание или причинение боли.
- source_word: כֹּל
  choice: всех подряд
  rationale: Местоименное «всех» естественно относится к людям, а «подряд» передаёт неразборчивый характер действия, подразумеваемый сопоставлением.
- source_word: וְשֹׂכֵר
  choice: тот, кто нанимает
  rationale: Связка оформлена по-русски как вторая часть сравнения, чтобы ясно передать соотнесение без добавления нового тезиса.
- source_word: כְּסִיל
  choice: глупца
  rationale: «Глупец» — естественный и устойчивый русский эквивалент термина литературы мудрости, обозначающего не только недостаток ума, но и нравственное неразумие.
- source_word: וְשֹׂכֵר
  choice: или нанимает
  rationale: «Или» естественно представляет второй вариант неразборчивого найма; возможное буквальное соединение через «и» отмечено в сноске.
- source_word: עֹבְרִים
  choice: случайных прохожих
  rationale: Причастие от עבר обозначает проходящих мимо. «Случайных» эксплицирует контекстуальный смысл найма любых подвернувшихся людей, не превращая их в постоянную социальную группу.
