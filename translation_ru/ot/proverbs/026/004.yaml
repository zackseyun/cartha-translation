source:
  edition: WLC
  text: אַל תַּ֣עַן כְּ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּֽן תִּשְׁוֶה לּ֥/וֹ גַם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/004.yaml
  text: Do not answer a fool according to his folly[b][a], lest you also become like him.
translation:
  language: ru
  text: Не отвечай глупцу по его глупости[a], чтобы и тебе не стать подобным ему.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отвечай глупым образом». Еврейское выражение «по его глупости» может означать ответ, который воспроизводит глупость самого глупца.'
    reason: lexical_alternative
  - marker: b
    text: 'В Притчах 26:5 дано дополняющее наставление: «Отвечай глупцу по его глупости». Вместе эти изречения учат учитывать обстоятельства, а не устанавливают одно безусловное правило.'
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּעַן
  choice: Не отвечай
  rationale: Сочетание אַל с имперфектом выражает запрет; эта форма естественна в современном русском и сохраняет прямую связь со следующим стихом.
- source_word: כְּסִיל
  choice: глупцу
  rationale: Это обычный для литературы мудрости термин, обозначающий не просто недостаток ума, а нравственно и рассудочно упрямого человека; «глупец» — точный и устойчивый русский эквивалент.
- source_word: כְאִוַּלְתּוֹ
  choice: по его глупости
  rationale: 'Предлог כְּ выражает соответствие. Формулировка сохраняет неоднозначность: речь может идти об ответе, воспроизводящем глупую манеру, либо об ответе, сообразном самой глупости; это важно для напряжения со стихом 5.'
- source_word: פֶּן
  choice: чтобы… не
  rationale: פֶּן вводит нежелательное последствие. Конструкция «чтобы… не» точна и естественнее для современного русского, чем книжное «дабы не».
- source_word: תִּשְׁוֶה לּוֹ
  choice: стать подобным ему
  rationale: Глагол שׁוה с לְ здесь выражает уподобление или равенство. «Стать подобным ему» передаёт угрозу нравственного уподобления и динамический оттенок контекста.
- source_word: גַם אָתָּה
  choice: и тебе
  rationale: Частица גַּם подчёркивает, что адресат тоже может уподобиться глупцу. Русская конструкция «чтобы и тебе не стать» передаёт это выделение естественно.
theological_decisions:
- issue: Смысловое напряжение с Притчами 26:5
  choice: Сохранить выражение «по его глупости», не снимая его неоднозначности.
  alternative: «Не отвечай глупцу глупым образом» или «не отвечай глупцу так, как заслуживает его глупость».
  rationale: Соседние изречения намеренно дают внешне противоположные наставления, требующие мудрого учёта ситуации. Перевод не должен заранее сводить первое из них только к манере ответа или только к его уместности.
translation_notes:
  register: Современный литературный русский язык с краткой афористичной формой. Сохранён традиционный термин «глупец» и намеренная смысловая напряжённость с последующим стихом; архаические обороты не использованы.
