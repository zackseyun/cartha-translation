  text: Do you see a man wise in his own eyes? There is more hope for a fool than for him[a].
translation:
  language: ru
  text: Видел ли ты человека, мудрого в собственных глазах? На глупца больше надежды, чем на него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Видишь ли ты человека, мудрого в собственных глазах?» Еврейский перфект здесь допускает передачу как риторического наблюдения или вопроса о виденном, так и как вопроса в настоящем времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָ
  choice: Видел ли ты
  rationale: Перфект qal, 2-е лицо мужского рода единственного числа, здесь естественно передаётся риторическим вопросом. Прошедшее время сохраняет аспектуальную форму еврейского текста; возможен и вопрос в настоящем времени.
- source_word: אִישׁ
  choice: человека
  rationale: Обозначает отдельного человека как типичный пример; русское «человек» сохраняет единственное число и мужскую грамматическую форму без стилистической тяжеловесности.
- source_word: חָכָם בְּעֵינָיו
  choice: мудрого в собственных глазах
  rationale: Сохранён образный еврейский оборот о самоуверенной оценке собственной мудрости. «Собственных» ясно выражает возвратный смысл.
- source_word: תִּקְוָה
  choice: надежды
  rationale: Существительное означает надежду или благоприятную перспективу; «надежда» естественно передаёт смысл в русском сравнительном обороте.
- source_word: לִכְסִיל
  choice: на глупца
  rationale: כְּסִיל — устойчивое обозначение нравственно и умственно упрямого глупца в Притчах. Конструкция «на кого-либо есть надежда» требует в русском предлога «на».
- source_word: מִמֶּנּוּ
  choice: чем на него
  rationale: 'Предлог מן выражает сравнение: у глупца перспектив больше, чем у человека, считающего себя мудрым.'
