  text: Though hatred is covered with deceit[b][a], his evil will be exposed in the assembly.
translation:
  language: ru
  text: Ненависть скрывается обманом[a], но зло ненавистника откроется в собрании[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «коварством», «притворством» или «посредством обмана».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед собранием». Еврейское слово означает собравшуюся общину или собрание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכַּסֶּה
  choice: скрывается
  rationale: Нифаль, имперфект 3-го лица женского рода, согласован с שִׂנְאָה. Возвратно-пассивное «скрывается» естественно передаёт обобщённое утверждение притчи.
- source_word: שִׂנְאָה
  choice: ненависть
  rationale: Существительное обозначает ненависть или враждебность; «ненависть» точно и естественно в современном русском языке.
- source_word: בְּמַשָּׁאוֹן
  choice: под обманом
  rationale: Редкое слово обозначает обман, коварство или притворство. Предлог ב может указывать на средство или покров; выражение «скрывается под обманом» передаёт образ сокрытия и не сужает смысл до одного обманного поступка.
- source_word: תִּגָּלֶה
  choice: откроется
  rationale: 'Нифаль, имперфект 3-го лица женского рода, с רָעָתוֹ в роли подлежащего. Будущее значение подчёркивает итог: скрытое зло станет явным.'
- source_word: רָעָתוֹ
  choice: зло такого человека
  rationale: 'Суффикс мужского рода единственного числа буквально означает «его», однако явный мужской референт в этой строке отсутствует. «Зло такого человека» делает связь понятной по-русски, сохраняя общий характер притчи и широкий смысл רָעָה: зло, порочность или злой умысел.'
- source_word: בְקָהָל
  choice: перед собранием
  rationale: קָהָל — собравшаяся община или собрание. «Перед собранием» естественно выражает публичное обнаружение зла, не превращая конкретный образ сообщества в абстрактное «публично».
