  terminology: «Безумец» передаёт опасную иррациональность образа, не задавая медицинского диагноза. «Горящие головни» соответствует основному пониманию זִקִּים как огненных метательных предметов; примечание сохраняет допустимые альтернативы. «Стрелы и смерть» оставлены без объясняющего переосмысления.
  issues:
