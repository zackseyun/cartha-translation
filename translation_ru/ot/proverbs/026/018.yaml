  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: כְּ вводит сравнение, מִתְלַהְלֵהַּ обозначает человека, действующего безрассудно/неистово, יֹּרֶה — пускающего или мечущего, а «смерть» сохранена как намеренно резкий последний член ряда. Однако «горящие снаряды» звучит по-современному технически и слишком обобщённо для конкретного древнего образа זִקִּים.'
