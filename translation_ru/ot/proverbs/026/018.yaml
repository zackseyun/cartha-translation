base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/018.yaml
  text: Like a madman who shoots firebrands[a], arrows, and death[b],
translation:
  language: ru
  text: Как безумец, бросающий горящие головни[a], стрелы и смерть,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огненные стрелы»; возможно также: «зажигательные метательные снаряды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִתְלַהְלֵהַּ
  choice: Как обезумевший
  rationale: Префикс כְּ вводит сравнение, а причастная форма передаёт безумное, неистовое поведение. «Обезумевший» звучит естественно и передаёт опасную иррациональность образа, не утверждая медицинский диагноз.
- source_word: הַיֹּרֶה
  choice: который мечет
  rationale: Глагол ירה обозначает пускание или метание снарядов, в том числе стрельбу стрелами. «Мечет» позволяет естественно отнести действие и к горящим снарядам, и к стрелам.
- source_word: זִקִּים
  choice: горящие снаряды
  rationale: Слово обозначает огненные или зажигательные метательные средства. Этот вариант понятнее современному читателю, чем «головни», и сохраняет масштаб опасного нападения.
- source_word: חִצִּים
  choice: стрелы
  rationale: Прямое и обычное значение существительного; контекст не требует иного перевода.
- source_word: וָמָוֶת
  choice: и смерть
  rationale: 'Буквальное выражение сохраняет резкую кульминацию и намеренную неоднозначность: смерть может восприниматься как последний элемент ряда, результат нападения или поэтическое обобщение смертельного вреда.'
