lexical_decisions:
- source_word: פֶּחָם
  choice: уголь
  rationale: Слово обозначает древесный уголь — топливо, которое поддерживает жар. Краткое «уголь» естественно в русском афористическом параллелизме.
- source_word: גֶחָלִים
  choice: жар
  rationale: Множественное число обозначает раскалённые угли. «Жар» позволяет естественно передать картину тлеющих углей и избежать тяжеловесного повтора «уголь — угли».
- source_word: עֵצִים
  choice: дрова
  rationale: Собирательное обозначение древесины; в контексте топлива русское «дрова» точнее и естественнее общего «дерево».
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое и естественное соответствие.
- source_word: אִישׁ מדונים
  choice: сварливый человек
  rationale: Буквально «человек раздоров». Прилагательное «сварливый» естественно выражает устойчивую склонность затевать ссоры, не ограничивая смысл единичным случаем.
- source_word: חַרְחַר
  choice: разжигает
  rationale: Глагольная форма передаёт возбуждение или раздувание конфликта. «Разжигает» сохраняет сквозную метафору огня.
- source_word: רִיב
  choice: ссору
  rationale: Слово охватывает ссору, спор или распрю. «Ссора» понятно современному читателю и органично сочетается с глаголом «разжигает».
