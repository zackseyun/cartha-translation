lexical_decisions:
- source_word: מַחֲזִיק
  choice: схватить
  rationale: Причастие породы hифиль от חזק здесь передаёт крепкое удерживание; «схватить» естественно и выразительно передаёт опрометчивое действие.
- source_word: בְּאָזְנֵי
  choice: за уши
  rationale: Предлог בְּ при слове «уши» обозначает место захвата; русское «схватить за уши» точно и идиоматично.
- source_word: כָלֶב
  choice: пса
  rationale: Обычное значение — «собака, пёс»; винительный падеж обусловлен русским синтаксисом, а «пёс» сохраняет конкретность и краткость образа.
- source_word: עֹבֵר
  choice: прохожему
  rationale: Субстантивированное причастие обозначает человека, который проходит мимо; «прохожий» кратко и естественно.
- source_word: מִתְעַבֵּר
  choice: вмешаться
  rationale: Редкая форма допускает разные оттенки, включая самовольное вовлечение и возбуждение гнева; в сочетании со «ссорой, которая не его» наиболее вероятно значение вмешательства.
- source_word: עַל רִיב
  choice: в ссору
  rationale: Хотя עַל обычно значит «над, по поводу», при русском глаголе «вмешаться» естественно управление «в ссору».
- source_word: לֹא לוֹ
  choice: чужую
  rationale: Буквально «не ему / не его»; «чужую» компактно передаёт ссору, которая не касается прохожего.
