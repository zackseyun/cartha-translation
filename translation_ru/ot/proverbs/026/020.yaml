  yaml_path: translation/ot/proverbs/026/020.yaml
  text: For lack of wood[a], the fire goes out, and where there is no whisperer, strife grows quiet.
translation:
  language: ru
  text: Без дров огонь гаснет, и без сплетника[a] утихает раздор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, кто тайком распускает слухи». Еврейское слово обозначает человека, который распространяет вредящие другим речи, часто тайком или вполголоса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶפֶס
  choice: без
  rationale: Сочетание предлога ב с אֶפֶס выражает отсутствие или нехватку; «без» естественно и кратко передаёт условно-причинную связь в русской пословичной форме.
- source_word: עֵצִים
  choice: дров
  rationale: Во множественном числе слово обозначает здесь древесину как топливо для огня; «дрова» точнее контекста и естественнее общего «дерево».
- source_word: תִּכְבֶּה
  choice: гаснет
  rationale: 'Форма глагола כבה непереходная: огонь перестаёт гореть. «Гаснет» точно и естественно передаёт это значение.'
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое соответствие еврейскому слову; в русском обобщённо-пословичном высказывании артикль не требуется.
- source_word: וּבְאֵין
  choice: и без
  rationale: Конструкция выражает отсутствие и синтаксически параллельна первой строке; повтор «без» сохраняет лаконичный параллелизм оригинала.
- source_word: נִרְגָּן
  choice: сплетника
  rationale: Слово обозначает человека, который распространяет вредящие другим речи, нередко вполголоса или исподтишка. «Сплетник» понятно современному читателю и не сужает значение до юридически понимаемой клеветы.
- source_word: יִשְׁתֹּק
  choice: утихает
  rationale: Глагол שתק означает «молчать, становиться тихим». В отношении раздора «утихает» сохраняет образ затихания, не утверждая непременно его окончательного прекращения.
- source_word: מָדוֹן
  choice: раздор
  rationale: Слово обозначает распрю, вражду или тяжбу; «раздор» краток, литературен и уместен в афористическом контексте.
