  text: When he makes his voice gracious[a], do not trust him[b], for seven abominations are in his heart.
translation:
  language: ru
  text: Когда он говорит ласковым голосом[a], не доверяй ему, ибо в сердце его семь мерзостей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда он говорит ласково» или «Когда он делает свой голос ласковым». Букв.: «Когда он делает свой голос ласковым».'
    reason: lexical_alternative
  - marker: b
