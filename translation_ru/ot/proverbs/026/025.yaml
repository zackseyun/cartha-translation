lexical_decisions:
- source_word: יְחַנֵּן קוֹלוֹ
  choice: придаёт своему голосу ласковость
  rationale: Порода пиэль глагола חנן при קוֹלוֹ буквально описывает придание голосу приятного, располагающего звучания. Формулировка сохраняет еврейский образ и остаётся понятной по-русски.
- source_word: אַל תַּאֲמֶן בּוֹ
  choice: не доверяй ему
  rationale: Глагол אמן в породе гифиль с предлогом ב естественно передаёт доверие к человеку, а не только веру в истинность его отдельных слов.
- source_word: שֶׁבַע
  choice: семь
  rationale: Число сохранено буквально; в литературе мудрости оно может также указывать на полноту или завершённость.
- source_word: תּוֹעֵבוֹת
  choice: мерзостей
  rationale: Слово обозначает нечто глубоко отвратительное и нравственно предосудительное. «Мерзость» сохраняет силу выражения и привычно для библейского регистра.
- source_word: בְּלִבּוֹ
  choice: у него в сердце
  rationale: «Сердце» сохраняет библейский образ внутреннего мира человека — его мыслей, намерений и желаний.
