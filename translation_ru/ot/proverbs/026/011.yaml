translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Слово «рвота» сохраняет намеренно отталкивающий образ оригинала, не усиливая его просторечной лексикой. Параллелизм двух половин сохранён посредством конструкции «как… так…».
