  text: כְּ֭/כֶלֶב שָׁ֣ב עַל קֵא֑/וֹ כְּ֝סִ֗יל שׁוֹנֶ֥ה בְ/אִוַּלְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/011.yaml
  text: Like a dog returning to its vomit[a], so a fool repeats his folly.
translation:
  language: ru
  text: Как пёс возвращается к своей рвоте[a], так глупец повторяет свою глупость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее по форме: «Как пёс, возвращающийся к своей рвоте, — глупец, повторяющий свою глупость». В обеих частях еврейского текста стоят причастия, живо изображающие привычно повторяющееся действие.'
    reason: Передача причастной формы и синтаксического параллелизма оригинала.
lexical_decisions:
- source_word: כְּכֶלֶב
  choice: Как пёс
  rationale: Префикс כְּ выражает сравнение. «Как пёс» естественно вводит образ и сохраняет мужской род, соответствующий местоименному суффиксу далее.
- source_word: שָׁב
  choice: возвращается
  rationale: Причастная форма изображает характерное, повторяющееся действие. Русское настоящее время передаёт общеизвестную, привычную закономерность естественнее буквального причастного оборота.
- source_word: עַל קֵאוֹ
  choice: к своей рвоте
  rationale: Предлог עַל буквально может означать «на», однако при русском глаголе «возвращаться» направление естественно выражается предлогом «к». Кֵא — извергнутая масса, рвота; суффикс 3-го лица мужского рода относится к псу.
- source_word: כְּסִיל
  choice: глупец
  rationale: В Притчах это не просто человек с недостатком ума, а нравственно и интеллектуально упорный глупец. «Глупец» кратко и точно передаёт этот устойчивый тип.
- source_word: שׁוֹנֶה
  choice: повторяет
  rationale: В данном контексте глагол обозначает повторение, новое совершение того же самого. «Повторяет» передаёт смысл ясно, не подменяя его более узким «возвращается».
- source_word: בְאִוַּלְתּוֹ
  choice: свою глупость
  rationale: Существительное означает «глупость, безрассудство» и снабжено притяжательным суффиксом. При глаголе «повторяет» русская конструкция с прямым дополнением естественно передаёт смысл еврейского сочетания с בְּ.
