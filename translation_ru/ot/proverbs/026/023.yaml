lexical_decisions:
- source_word: כֶּסֶף סִיגִים
  choice: серебряные отбросы
  rationale: Сочетание обозначает не чистое серебро, а примеси или отходы серебра; выбор сохраняет контраст между блестящей поверхностью и её ничтожной ценностью.
- source_word: מְצֻפֶּה
  choice: нанесённые
  rationale: Страдательное причастие описывает покрытие поверхности; эта формулировка передаёт тонкий внешний слой, не создавая впечатления, будто сосуд сделан из серебра.
- source_word: עַל חָרֶשׂ
  choice: на глиняный сосуд
  rationale: חָרֶשׂ обозначает глиняное изделие или черепок; «глиняный сосуд» ясно и естественно передаёт образ дешёвой основы под блестящим покрытием.
- source_word: שְׂפָתַיִם
  choice: уста
  rationale: Сохранён буквальный образ губ как органа речи; «уста» уместны в поэтическом афоризме и понятны современному читателю.
- source_word: דֹּלְקִים
  choice: пылкие
  rationale: Причастие связано с горением и здесь характеризует внешне горячую, усердную или сердечную речь. «Пылкие» сохраняет образ жара и не сужает смысл до лести.
- source_word: וְלֶב רָע
  choice: и злое сердце
  rationale: Союз прямо связывает выразительную речь с внутренним злом. Формулировка сохраняет моральную силу רָע и напряжение между внешностью и сущностью.
