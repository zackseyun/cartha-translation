  text: דַּלְי֣וּ שֹׁ֭קַיִם מִ/פִּסֵּ֑חַ וּ֝/מָשָׁ֗ל בְּ/פִ֣י כְסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/007.yaml
  text: Like the legs that hang limp from a lame man[a], so is a proverb in the mouth of fools.
translation:
  language: ru
  text: Как безвольно свисают ноги у хромого[a], таково и изречение в устах глупцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ноги у хромого безвольно свисают; таково и изречение в устах глупцов».'
    reason: 'Лексическая и синтаксическая альтернатива: первую строку можно передать самостоятельным утверждением; דַּלְיוּ означает вяло, безвольно свисать.'
lexical_decisions:
- source_word: דַּלְיוּ
  choice: бессильно свисают
  rationale: Глагол рисует опущенные, вяло свисающие конечности, а не просто физическую слабость; сочетание передаёт и образ, и подразумеваемую бесполезность.
- source_word: שֹׁקַיִם
  choice: ноги
  rationale: Слово может точнее обозначать голени или нижнюю часть ног, но «ноги» естественно звучит по-русски и достаточно ясно передаёт образ.
- source_word: מִפִּסֵּחַ
  choice: у хромого
  rationale: 'Предлог выражает принадлежность или связь: речь идёт о ногах хромого человека. Русская конструкция «у хромого» передаёт это естественно.'
- source_word: וּמָשָׁל
  choice: такова и притча
  rationale: Союз вводит вторую часть образного сопоставления; «такова и» явно и естественно передаёт сравнительный параллелизм.
- source_word: מָשָׁל
  choice: притча
  rationale: В контексте книги слово обозначает краткое мудрое изречение или притчу. «Притча» сохраняет традиционный жанровый оттенок и уместна для изречения, заключённого в устах глупцов.
- source_word: בְּפִי
  choice: в устах
  rationale: Сохранён конкретный древнееврейский образ речи, при этом «в устах» имеет достойное и привычное для русского библейского текста звучание.
- source_word: כְסִילִים
  choice: глупцов
  rationale: Слово обозначает характерный для литературы мудрости нравственно и разумно несостоятельный тип человека; «глупцы» сохраняет эту категорию лучше нейтральных перифразов.
