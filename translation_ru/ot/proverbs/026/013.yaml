  text: 'Ленивец говорит: «Лев на дороге! Лев на городских площадях[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на улицах». Еврейское слово точнее обозначает широкие открытые общественные места или площади в городе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  choice: ленивец
  rationale: Обозначает человека, для которого лень стала устойчивой чертой; существительное сохраняет характерный для Притч типический образ.
- source_word: אָמַר
  choice: говорит
  rationale: Хотя в еврейском употреблена форма завершённого действия, в контексте изречения она выражает обычное, характерное поведение, поэтому уместно настоящее время.
- source_word: שַׁחַל
  choice: лев
  rationale: Слово обозначает льва, иногда с оттенком силы или свирепости; контекст не требует уточнения «молодой» или «свирепый».
- source_word: בַּדָּרֶךְ
  choice: на дороге
  rationale: Естественная русская передача местонахождения зверя на пути, по которому нужно идти.
- source_word: אֲרִי
  choice: лев
  rationale: Обычное обозначение льва; одинаковый перевод двух еврейских слов сохраняет риторическое повторение и преувеличенность отговорки.
- source_word: בֵּין הָרְחֹבוֹת
  choice: посреди городских площадей
  rationale: רְחֹבוֹת — широкие открытые общественные пространства города; «посреди» естественно передаёт нахождение среди них, а добавление «городских» проясняет среду без сведения значения к улицам вообще.
