  text: ב/שפת/ו יִנָּכֵ֣ר שׂוֹנֵ֑א וּ֝/בְ/קִרְבּ֗/וֹ יָשִׁ֥ית מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/024.yaml
  text: A hater disguises himself with his lips[b][a], but within himself he sets deceit.
translation:
  language: ru
  text: Кто ненавидит, тот притворяется на словах[a], а внутри себя[b] таит обман.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами делает себя неузнаваемым»; возможный перевод: «притворяется устами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в своей внутренности» или «внутри него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִשְׂפָתוֹ
  choice: на словах
  rationale: Передаёт инструментальное значение предлога и естественно выражает по-русски внешнюю, словесную сторону притворства; конкретный образ «устами» сохранён в сноске.
- source_word: יִנָּכֵר
  choice: притворяется
  rationale: Нифаль глагола נכר здесь означает представлять себя не тем, кто ты есть, или делать себя неузнаваемым. «Притворяется» ясно и естественно передаёт это значение, не уточняя, в чём именно состоит притворство.
- source_word: שֹׂנֵא
  choice: кто ненавидит
  rationale: Субстантивированное причастие обозначает человека, который ненавидит. Придаточная конструкция звучит в современном русском естественнее, чем существительное «ненавистник», и не подменяет значение словом «враг».
- source_word: וּבְקִרְבּוֹ
  choice: внутри себя
  rationale: Сохраняет противопоставление внешней речи внутреннему миру человека и не сужает значение קֶרֶב до «сердца», которого в еврейском тексте нет.
- source_word: יָשִׁית
  choice: таит
  rationale: Буквальное значение — «кладёт, помещает». В сочетании с обманом русское «таит» естественно выражает намеренное удерживание обмана внутри себя, сохраняя контраст между внешним и внутренним.
- source_word: מִרְמָה
  choice: обман
  rationale: Широкое и ясное соответствие слову מִרְמָה; не усиливает смысл до «вероломства» без необходимости.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Конструкция «кто ненавидит» понятна широкому читателю; выражение «на словах» естественно передаёт внешнее словесное притворство, а сноска сохраняет конкретный еврейский образ уст.
