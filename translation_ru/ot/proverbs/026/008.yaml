lexical_decisions:
- source_word: כִּצְרוֹר
  choice: Что привязать
  rationale: Форма естественно понимается от צרר — «связывать, привязывать». Конструкция «что A, что Б» передаёт сравнительное соотношение двух действий и звучит по-русски как афористическое изречение.
- source_word: אֶבֶן
  choice: камень
  rationale: Обычное и контекстуально нейтральное соответствие еврейскому אֶבֶן.
- source_word: בְּמַרְגֵּמָה
  choice: к праще
  rationale: Значение существительного не вполне ясно; понимание «праща» создаёт связный образ привязанного к праще камня. Русское «к праще» естественно сочетается с глаголом «привязать», не меняя самого образа. Альтернативное понимание сохранено в сноске.
- source_word: כֵּן
  choice: что …, что …
  rationale: Сравнительный показатель передан симметричной русской конструкцией, выражающей равенство двух нелепых действий.
- source_word: נוֹתֵן
  choice: воздать
  rationale: Причастие обозначает обобщённое действие. Инфинитив в параллельной конструкции естественно передаёт его общеобобщённый смысл.
- source_word: לִכְסִיל
  choice: глупцу
  rationale: כְּסִיל в Притчах — нравственно тупой и упрямый глупец; русский дательный без артикля сохраняет обобщённость.
- source_word: כָּבוֹד
  choice: почесть
  rationale: В данном контексте речь идёт об общественном уважении и признании. «Почесть» хорошо сочетается с «воздать» и не вносит возвышенного оттенка слова «слава».
