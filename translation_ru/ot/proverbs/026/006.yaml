lexical_decisions:
- source_word: מְקַצֶּה
  choice: отсекает
  rationale: Пиэль-причастие от קצה передаёт решительное отсечение; русский глагол сохраняет резкий и конкретный образ оригинала.
- source_word: רַגְלַיִם
  choice: себе ноги
  rationale: Двойственное число обозначает ноги. Возвратное «себе» естественно выражает подразумеваемое саморазрушение отправителя, не превращая образ в отвлечённую формулу.
- source_word: חָמָס
  choice: насилие
  rationale: חָמָס может означать насилие, неправду или причинённый вред. «Насилие» сохраняет силу и намеренную шероховатость метафоры.
- source_word: שֹׁתֶה
  choice: пьёт
  rationale: Буквальное значение שתה сохранено, чтобы не сглаживать метафору принятия пагубных последствий внутрь себя.
- source_word: שֹׁלֵחַ
  choice: кто поручает
  rationale: В сочетании с содержанием, передаваемым через посредника, «поручает» естественно выражает отправку с вверением глупцу, сохраняя обобщённый характер причастной конструкции.
- source_word: דְּבָרִים
  choice: слова
  rationale: Основное значение דְּבָרִים — «слова», хотя в контексте речь, вероятно, идёт о сообщении или поручении. Буквальный вариант сохраняет лексическую широту.
- source_word: בְּיַד
  choice: глупцу
  rationale: Идиома «в/через руку» обозначает посредничество или вверение. В современном русском дательный падеж после «поручает» передаёт эту функцию естественнее буквального «рукой».
- source_word: כְּסִיל
  choice: глупец
  rationale: Обычный термин литературы мудрости для нравственно и практически неразумного человека; «глупец» соответствует возвышенному, но понятному регистру Притч.
