  text: So is the man who deceives his neighbor and says[b][a], “Am I not only joking?”
translation:
  language: ru
  text: 'Таков человек, который обманывает своего ближнего[a] и говорит: «Разве я не шучу?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «друга», «товарища». Еврейское слово רֵעַ может обозначать ближнего, друга или человека из круга общения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Разве я не играю?» Возможны также варианты: «Разве я не забавляюсь?» или «Разве я не шучу?» Здесь говорящий пытается представить вред, причинённый обманом, как безобидную забаву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Таков и
  rationale: Сохраняет сравнительную связь с образом из предыдущего стиха и естественно звучит по-русски.
- source_word: אִישׁ
  choice: человек
  rationale: Передаёт обобщённого участника притчи на современном литературном русском без утраты единственного числа.
- source_word: רִמָּה
  choice: обманывает
  rationale: Точно выражает намеренное введение другого в заблуждение и сохраняет нравственную тяжесть поступка.
- source_word: רֵעֵהוּ
  choice: ближнего
  rationale: Широкое библейское обозначение другого человека из круга общения; возможны также значения «друга» и «товарища».
- source_word: וְאָמַר
  choice: а потом говорит
  rationale: Настоящее время соответствует характеру общего изречения; «а потом» естественно передаёт переход от обмана к оправданию, а союз «а» подчёркивает контраст.
- source_word: הֲלֹא מְשַׂחֵק אָנִי
  choice: Да я ведь только пошутил!
  rationale: Передаёт риторическое, самооправдательное и преуменьшающее звучание реплики. Прошедшее время естественно по-русски соотносит оправдание с уже совершённым обманом.
