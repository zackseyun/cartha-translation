  text: As a door turns on its hinge[a], so a sluggard on his bed.
translation:
  language: ru
  text: Как дверь вращается на своей петле[a], так и лентяй — на своей постели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Дверь вращается на своей петле, и лентяй — на своей постели». В еврейском тексте сравнительные слова не выражены; две части соединены союзом «и».'
    reason: Сохранение синтаксической неоднозначности между прямым параллелизмом и явно выраженным сравнением.
lexical_decisions:
- source_word: הַדֶּלֶת
  choice: дверь
  rationale: Существительное означает «дверь». В русском языке нулевой артикль естественно передаёт обобщённый характер притчи.
- source_word: תִּסּוֹב
  choice: поворачивается
  rationale: Форма от סבב описывает повторяющееся движение двери вокруг точки крепления; «поворачивается» ясно и близко к еврейскому образу.
- source_word: עַל
  choice: на
  rationale: Предлог естественно передаёт отношение двери к петле и лентяя к постели.
- source_word: צִירָהּ
  choice: на своей петле
  rationale: צִיר обозначает ось, шарнир или петлю двери. «Петля» — наиболее понятный современный русский эквивалент; притяжательный суффикс передан словом «своей».
- source_word: וְעָצֵל
  choice: так и лентяй
  rationale: עָצֵל — характерное для литературы мудрости обозначение человека, привычно предающегося лени. «Лентяй» сохраняет нравственную оценку и звучит естественно; союз ו передан в составе явно выраженного сравнительного оборота.
- source_word: מִטָּתוֹ
  choice: на своей постели
  rationale: מִטָּה обозначает постель или ложе. «Постель» уместна в литературной пословичной речи, а «своей» передаёт притяжательный суффикс.
