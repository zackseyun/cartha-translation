  source_fidelity: 'Основной смысл передан верно: עָצֵל — «ленивец», сравнительное חָכָם ... מִשִּׁבְעָה — «мудрее семерых», а «в собственных глазах» точно воспроизводит идиому субъективной самооценки. Однако מְשִׁיבֵי טָעַם обозначает людей, дающих разумный/рассудительный ответ, а не просто людей, которые «отвечают рассудительно».'
