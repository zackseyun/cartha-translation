  text: A sluggard is wiser in his own eyes than seven who answer with discernment[a].
translation:
  language: ru
  text: Ленивец в собственных глазах мудрее семерых, способных дать разумный ответ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семерых, отвечающих рассудительно».'
    reason: 'Лексико-синтаксический вариант: сочетание מְשִׁיבֵי טָעַם буквально характеризует тех, кто даёт ответ, исполненный здравого смысла; его можно передать также как характеристику самого отвечания.'
lexical_decisions:
- source_word: חָכָם
  choice: мудрее
  rationale: Прилагательное «мудрый» в сочетании со сравнительным מִן естественно передаётся сравнительной степенью.
- source_word: עָצֵל
  choice: ленивец
  rationale: Обозначает человека, которому свойственна постоянная лень; слово сохраняет краткость и обличительный тон притчи.
- source_word: בְּעֵינָיו
  choice: в собственных глазах
  rationale: Еврейская идиома выражает субъективную самооценку; «собственных» ясно передаёт возвратный оттенок.
- source_word: מִשִּׁבְעָה
  choice: семерых
  rationale: Предлог מִן вводит второй член сравнения; русская форма после «мудрее» естественно передаёт значение «чем семеро».
- source_word: מְשִׁיבֵי
  choice: отвечающих
  rationale: Причастие обозначает тех, кто даёт ответ; причастная конструкция сохраняет сжатость оригинала.
- source_word: טָעַם
  choice: рассудительно
  rationale: Здесь слово означает здравый смысл, рассудительность или разумное суждение, а не буквальный вкус; наречие естественно характеризует даваемый ответ.
