  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/022.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: ru
  text: 'Слова сплетника — словно лакомые кусочки[a]: они спускаются в самые глубины нутра[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно лакомства» / «словно кусочки, которые жадно глотают». Еврейское слово редкое, и его значение спорно; в древней традиции его также понимали как «раны».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во внутренние покои чрева» — еврейский образ самых сокровенных глубин человека.'
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Слова
  rationale: Форма сопряжённого множественного числа от דָּבָר; «слова» естественно и точно передаёт смысл.
- source_word: נִרְגָּן
  choice: сплетника
  rationale: В Притчах это слово обозначает человека, распространяющего негромкие, скрытые и сеющие раздоры речи. «Сплетник» понятно современному читателю и передаёт характер такой речи; более буквальное «шептун» по-русски менее ясно, а «клеветник» неоправданно сужает значение.
- source_word: כְּמִתְלַהֲמִים
  choice: словно лакомые кусочки
  rationale: Редкое и спорное слово, также встречающееся в Притчах 18:8. Толкование как привлекательной пищи хорошо согласуется с дальнейшим образом проглатывания и проникновения внутрь; неопределённость отражена в сноске.
- source_word: וְהֵם יָרְדוּ
  choice: они спускаются
  rationale: Сохранены выраженное местоимение и конкретный глагол ירד «спускаться». Настоящее время уместно для общего утверждения в пословице.
- source_word: חַדְרֵי בָטֶן
  choice: самые глубины нутра
  rationale: Буквально «покои/комнаты чрева». Выбранная формулировка сохраняет телесный образ и идею проникновения во внутреннюю область человека, но звучит естественнее в современном русском; буквальный образ указан в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, образным строем притчи. «Сплетник» выбран ради ясности, а сочетание «глубины нутра» сохраняет телесность древнееврейского образа без архаичного «чрева» в основном тексте.
