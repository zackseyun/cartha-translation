lexical_decisions:
- source_word: שְׁלֹשָׁה הֵמָּה
  choice: Три вещи
  rationale: В еврейской числовой формуле буквально стоит «три они»; существительное «вещи» естественно восполняет подразумеваемый предмет перечисления, а отдельное местоимение в русском излишне.
- source_word: נִפְלְאוּ מִמֶּנִּי
  choice: непостижимы для меня
  rationale: Сочетание глагола от פלא с מִמֶּנִּי обозначает нечто необычайное, превосходящее способность говорящего постичь его. «Непостижимы для меня» сохраняет одновременно оттенок изумления и недоступности пониманию.
- source_word: וְאַרְבַּע
  choice: и четырёх
  rationale: Сохранён союз «и» и ступенчатая формула x/x+1. Родительный падеж обусловлен русским управлением при отрицательном «не понимаю» и соотносится с подразумеваемым словом «вещей».
- source_word: לֹא יְדַעְתִּים
  choice: я не понимаю
  rationale: 'Формально: «я не знаю их», однако в контексте речь идёт о неспособности постичь перечисляемые явления. Русское «не понимаю» естественно передаёт этот смысл; объект выражен формой «четырёх».'
