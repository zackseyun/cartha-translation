  naturalness: 'Фраза «Четверо малы на земле» звучит неестественно и двусмысленно: «малы» воспринимается как сказуемое о людях, а «на земле» — как обстоятельство места. «Есть четыре малых существа на земле» сохраняет лаконичность и в современном литературном русском ясно выражает обобщённую референцию.'
