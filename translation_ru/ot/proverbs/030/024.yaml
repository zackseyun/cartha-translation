lexical_decisions:
- source_word: אַרְבָּעָה
  choice: Четверо
  rationale: Числительное открывает числовое изречение. Форма «четверо» естественно указывает на группу живых существ и сохраняет лаконичность еврейского текста.
- source_word: קְטַנֵּי אָרֶץ
  choice: малы на земле
  rationale: Конструктивное сочетание буквально означает «малые земли/на земле». Перевод сохраняет прилагательное и не добавляет отсутствующее в стихе существительное «существа».
- source_word: וְהֵמָּה
  choice: но они
  rationale: Союз и самостоятельное местоимение здесь подчёркивают контраст между малостью и мудростью; русское «но они» передаёт его естественно.
- source_word: חֲכָמִים מְחֻכָּמִים
  choice: необычайно мудры
  rationale: Сочетание однокоренных форм имеет усилительное значение. «Необычайно мудры» естественно передаёт эмфазу, не превращая форму Pual в отдельное действие.
