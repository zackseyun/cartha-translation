lexical_decisions:
- source_word: לַעֲלוּקָה
  choice: У пиявки
  rationale: Существительное עֲלוּקָה означает «пиявка», а начальное ל־ естественно передаётся русской конструкцией обладания «у пиявки», сохраняющей тематическое построение еврейского текста.
- source_word: שְׁתֵּי בָנוֹת
  choice: две дочери
  rationale: Буквальный образ дочерей сохранён; глагол обладания подразумевается конструкцией «у пиявки».
- source_word: הַב הַב
  choice: «Дай, дай!»
  rationale: Повторённое повелительное восклицание передаёт настойчивое требование и звуковую краткость оригинала без истолковывающей замены на «Ещё, ещё».
- source_word: שָׁלֹשׁ הֵנָּה לֹא תִשְׂבַּעְנָה
  choice: Три не насыщаются
  rationale: Сохранена краткая формула числового изречения; «насыщаются» непосредственно отражает שׂבע и не вводит отсутствующее в оригинале существительное «вещи».
- source_word: אַרְבַּע לֹא אָמְרוּ הוֹן
  choice: 'четыре не скажут: «Довольно!»'
  rationale: הוֹן в данном контексте понято как возглас достаточности. Будущее «не скажут» естественно передаёт несовершенный вид еврейского глагола и сохраняет параллелизм.
