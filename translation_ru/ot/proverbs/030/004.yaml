id: PRO.30.4
reference: Proverbs 30:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִ֤י עָלָֽה שָׁמַ֨יִם וַ/יֵּרַ֡ד מִ֤י אָֽסַף ר֨וּחַ בְּ/חָפְנָ֡י/ו מִ֤י צָֽרַר מַ֨יִם בַּ/שִּׂמְלָ֗ה מִ֭י הֵקִ֣ים כָּל אַפְסֵי אָ֑רֶץ מַה שְּׁמ֥/וֹ וּ/מַֽה שֶּׁם בְּ֝נ֗/וֹ כִּ֣י תֵדָֽע־׀־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/004.yaml
  text: Who has gone up to heaven and come down? Who has gathered the wind in his hands? Who has wrapped the waters in a garment? Who has established all the ends of the earth? What is his name[a], and what is his son's name[c][b], surely you know!
translation:
  language: ru
  text: Кто взошёл на небеса и сошёл? Кто собрал ветер в ладонях? Кто завернул воды в плащ? Кто утвердил все края земли? Как его имя[a] и как имя его сына[b] — если знаешь?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Каково имя его?»'
    reason: Сохраняется более буквальная форма еврейского вопроса об имени.
  - marker: b
    text: Еврейский текст не поясняет, кто этот сын. В христианской традиции в этих словах нередко усматривают указание на Христа.
    reason: Отмечает традиционное прочтение, не превращая его в прямое утверждение текста.
  - marker: c
    text: 'Возможно также: «ведь ты знаешь!» — как иронический вызов.'
    reason: Отмечает допустимое альтернативное понимание כִּי תֵדָע.
lexical_decisions:
- source_word: עָלָה ... וַיֵּרַד
  choice: восходил ... и нисходил
  rationale: Сохраняет завершённое восхождение и последующее нисхождение в риторическом вопросе, а также возвышенный, но понятный стиль.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Естественное русское соответствие формально множественному еврейскому слову; подходит и для неба, и для небесной сферы.
- source_word: אָסַף רוּחַ בְּחָפְנָיו
  choice: собрал ветер в пригоршни свои
  rationale: В космическом контексте רוּחַ означает «ветер», а חָפְנָיו обозначает сложенные, полые ладони или пригоршни; это точнее образа кулаков.
- source_word: צָרַר מַיִם בַּשִּׂמְלָה
  choice: завязал воды в одежду
  rationale: צָרַר передаёт связывание или завязывание в узел, а שִׂמְלָה — верхнюю одежду; перевод сохраняет конкретный и парадоксальный образ.
- source_word: הֵקִים כָּל אַפְסֵי אָרֶץ
  choice: утвердил все пределы земли
  rationale: «Утвердил» передаёт установление и закрепление, а «пределы земли» — её крайние рубежи.
- source_word: מַה שְּׁמוֹ וּמַה שֶּׁם בְּנוֹ
  choice: Как имя ему и как имя сыну его
  rationale: Прямо сохраняет вопрос об имени и явно названном сыне, не уточняя их тождества.
- source_word: כִּי תֵדָע
  choice: если знаешь?
  rationale: Передаёт условно-вызывающую силу заключительной фразы и сохраняет её как часть риторического вопроса; альтернативное понимание как иронического заверения отмечено в сноске.
theological_decisions:
- issue: Кого обозначает «сын его»
  choice: Оставить выражение без явного отождествления.
  alternative: Передать его как прямое мессианское или христологическое именование.
  rationale: Сам еврейский текст не называет ни отца, ни сына. Перевод сохраняет формулировку и её богословскую открытость, не устраняя возможного христианского прочтения и не внося его непосредственно в текст.
- issue: Сила заключительного כִּי תֵדָע
  choice: 'Основной текст: «если знаешь?»'
  alternative: «ведь ты знаешь!» или «конечно, ты знаешь!»
  rationale: Условное чтение естественно завершает череду вызывающих риторических вопросов; неоднозначность частицы כִּי сохранена в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Инверсия «Как имя ему» и постпозиция «свои» поддерживают афористический параллелизм, оставаясь понятными современному читателю.
