  source_fidelity: 'Смысловой ряд и риторическая структура переданы верно: восхождение и нисхождение, удержание ветра, связывание вод, установление краёв земли и вопрос об имени и сыне. Однако русские формы «восходил ... нисходил» слабее выражают завершённые действия еврейского текста, а «завязал воды в одежду» неестественно сочетается по-русски и размывает образ обёртывания/связывания вод одеждой.'
