lexical_decisions:
- source_word: תַּחַת
  choice: под
  rationale: В контексте стихов 21–23 слово вводит обстоятельства, под тяжестью которых содрогается земля; краткое «под» сохраняет еврейскую конструкцию и связь с предыдущим стихом.
- source_word: עֶבֶד
  choice: раб
  rationale: Слово обозначает зависимого слугу или раба; «раб» точнее передаёт резкий социальный переворот, на котором строится изречение.
- source_word: כִּי
  choice: когда
  rationale: Здесь союз вводит обстоятельство, при котором возникает описанная ситуация.
- source_word: יִמְלֹךְ
  choice: становится царём
  rationale: Глагол допускает значения «царствовать» и «стать царём»; выбранный вариант естественно и наглядно передаёт социальный переворот.
- source_word: נָבָל
  choice: глупец
  rationale: В литературе мудрости это не просто человек с низким интеллектом, а нравственно и общественно несостоятельный человек; традиционное «глупец» передаёт это ёмко.
- source_word: יִשְׂבַּע
  choice: досыта ест
  rationale: Глагол означает насыщаться, быть сытым. В сочетании с «хлебом» русская глагольная конструкция звучит естественно и сохраняет образ насыщения.
- source_word: לָחֶם
  choice: хлеб
  rationale: Сохранён буквальный образ исходного текста, хотя слово может обозначать пищу вообще.
