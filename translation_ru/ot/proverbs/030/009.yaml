base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/009.yaml
  text: lest I become full and deny you and say[b][a], “Who is Yahweh?” or lest I become poor and steal and profane the name of my God.
translation:
  language: ru
  text: 'чтобы, насытившись, я не отрёкся от Тебя и не сказал: «Кто такой Яхве?» — и чтобы, обеднев, я не стал красть и не обесчестил имя моего Бога.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не схватил (не ухватился за) имя моего Бога». Смысл редкого выражения не вполне ясен; возможно также: «не употребил неправомерно имя моего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: чтобы… не
  rationale: Естественная русская конструкция для выражения опасаемого последствия; повторена во второй параллельной части.
- source_word: אֶשְׂבַּע
  choice: насытившись
  rationale: Передаёт конкретный образ сытости и в контексте подразумеваемое изобилие, не заменяя его отвлечённым «разбогатев».
- source_word: כִחַשְׁתִּי
  choice: отрёкся от Тебя
  rationale: Глагол может означать отрицание или отречение; подразумеваемый объект — Бог, что подтверждается следующим риторическим вопросом.
- source_word: מִי יְהוָה
  choice: Кто такой Яхве?
  rationale: Сохраняет прямой риторический вопрос и передаёт пренебрежительное непризнание Бога; личное имя יְהוָה транслитерировано.
- source_word: אִוָּרֵשׁ
  choice: обеднев
  rationale: Естественно передаёт нифаль глагола в значении оказаться в бедности и сохраняет параллель с «насытившись».
- source_word: גָנַבְתִּי
  choice: не стал красть
  rationale: Прямой современный эквивалент; конструкция передаёт опасаемое действие как возможное следствие бедности.
- source_word: וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: и не обесчестил имя моего Бога
  rationale: Буквально выражение связано с «схватить/захватить имя» и остаётся трудным. По контексту речь, вероятно, о навлечении бесчестия на Божье имя поступком; сноска сохраняет буквальный образ и возможную альтернативу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» прозрачно отличает его от титула, не устраняя риторическую резкость вопроса.
- issue: Смысл выражения וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: обесчестил имя моего Бога
  alternative: неправомерно употребил имя моего Бога / ухватился за имя моего Бога
  rationale: Контекст связывает кражу с позором, навлекаемым на Божье имя. Однако редкий буквальный оборот не позволяет считать идиоматическое толкование бесспорным, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом. Местоимение «Тебя» написано с прописной буквы как уважительная русская конвенция; синтаксис остаётся ясным для широкого читателя.
