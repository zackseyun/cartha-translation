source:
  edition: WLC
  text: דּ֭וֹר טָה֣וֹר בְּ/עֵינָ֑י/ו וּ֝/מִ/צֹּאָת֗/וֹ לֹ֣א רֻחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/012.yaml
  text: There is a generation that is pure in its own eyes[b][a], yet is not washed from its filth.
translation:
  language: ru
  text: Есть род, чистый в собственных глазах[a], но не омытый от своих нечистот[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чистый в своих глазах», то есть считающий себя чистым.'
    reason: idiom_clarification
  - marker: b
    text: Еврейское слово может означать грязь, навоз или испражнения; образ намеренно резок.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: род
  rationale: В ряду Притч 30:11–14 слово обозначает определённый тип или разряд людей; «род» сохраняет собирательность и повторяющуюся риторическую форму, не ограничивая смысл одной возрастной группой.
- source_word: טָהוֹר
  choice: чистый
  rationale: Слово может обозначать как обрядовую, так и нравственную чистоту. «Чистый» естественно поддерживает образ омовения и не сужает его до одной сферы.
- source_word: בְּעֵינָיו
  choice: в собственных глазах
  rationale: Передаёт еврейскую идиому самооценки; «собственных» подчёркивает противопоставление между представлением этого рода о себе и его действительным состоянием.
- source_word: וּמִצֹּאָתוֹ
  choice: от своих нечистот
  rationale: צֹאָה буквально обозначает грязь, испражнения или экскременты. «Нечистоты» сохраняет резкий телесный образ и допускает нравственный оттенок, оставаясь уместным для современного литературного русского.
- source_word: לֹא רֻחָץ
  choice: не омытый
  rationale: 'Передаёт пассивную форму без указания деятеля и сохраняет результативное состояние: этот род считает себя чистым, хотя в действительности не очищен.'
theological_decisions:
- issue: Характер образа чистоты
  choice: Сохранить образ чистоты и омовения без сведения его исключительно к обрядовой или исключительно к нравственной нечистоте.
  alternative: Передать стих как прямое утверждение только о нравственной самоправедности либо только об обрядовой нечистоте.
  rationale: Контекст указывает на нравственное обличение, однако еврейская лексика намеренно соединяет физическую, обрядовую и нравственную чистоту. Перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с афористичной библейской сжатостью. «Род» поддерживает параллельную структуру стихов 11–14; «нечистоты» передаёт сильный исходный образ без ненужной натуралистичности.
