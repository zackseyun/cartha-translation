  text: 'Under three things the earth trembles[a], and under four it cannot bear up:'
translation:
  language: ru
  text: 'От трёх вещей содрогается земля, а от четырёх — не в силах вынести:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת
  choice: от
  rationale: В числовом изречении предлог указывает на обстоятельства или причины, вызывающие реакцию земли. Русское «от» естественно передаёт этот смысл, не создавая неясного образа пространственного положения.
- source_word: שָׁלוֹשׁ
  choice: трёх вещей
  rationale: В еврейском тексте буквально стоит «трёх», но существительное «вещей» добавлено для ясности стандартной числовой формулы и подразумевается последующим перечнем.
- source_word: רָגְזָה
  choice: содрогается
  rationale: Глагол выражает дрожь, трепет или сильное волнение. «Содрогается» сохраняет яркую персонификацию земли и не ограничивает смысл буквальным землетрясением.
- source_word: אֶרֶץ
  choice: земля
  rationale: Контекст обобщённого мудрого изречения предполагает землю в широком смысле, а не отдельную страну или территорию.
- source_word: וְתַחַת
  choice: а
  rationale: Противительно-присоединительное «а» естественно оформляет нарастание в формуле «три… четыре»; значение повторённого предлога передано синтаксической связью со сказуемым «вынести».
- source_word: אַרְבַּע
  choice: четырёх
  rationale: Форма завершает характерную числовую последовательность «три… четыре»; слово «вещей» ясно подразумевается из первой части.
- source_word: לֹא תוּכַל
  choice: не в силах
  rationale: Выражение передаёт невозможность или неспособность и согласуется с персонифицированной «землёй».
- source_word: שְׂאֵת
  choice: вынести
  rationale: Инфинитив от נָשָׂא может обозначать несение, перенесение или выдерживание. «Вынести» естественно сохраняет смысл непосильного бремени и допускает значение «выдержать».
