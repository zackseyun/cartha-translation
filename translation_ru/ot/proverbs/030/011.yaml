  text: There is a generation that curses its father and does not bless its mother[a][b].
translation:
  language: ru
  text: Есть поколение, которое проклинает своего отца и не благословляет свою мать[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его отца… его мать». В еврейском тексте стоят притяжательные суффиксы мужского рода единственного числа; русское «своего… свою» соотносит их с собирательным словом «поколение».'
    reason: lexical_alternative
  - marker: b
    text: «Не благословляет» в данном контексте может также означать «не говорит доброго о ней» или «не чтит её».
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: поколение
  rationale: Слово обозначает поколение или разряд людей, объединённых общим свойством. В Притчах 30:11–14 оно образует повторяющийся литературный зачин, поэтому «поколение» сохраняет и основное значение, и структуру отрывка.
- source_word: אָבִיו
  choice: своего отца
  rationale: Еврейский суффикс имеет форму 3-го лица мужского рода единственного числа («его отца»). Русское возвратное притяжательное местоимение «своего» естественно соотносит отца с собирательным подлежащим «поколение» и сохраняет единственное число.
- source_word: יְקַלֵּל
  choice: проклинает
  rationale: Порода пиэль глагола קלל здесь означает проклинать или поносить. «Проклинает» прямо передаёт силу выражения и поддерживает смысловой контраст с «благословляет».
- source_word: וְאֶת
  choice: и
  rationale: וְ передано союзом «и», а служебный показатель определённого прямого дополнения אֶת отдельно не переводится.
- source_word: אִמּוֹ
  choice: свою мать
  rationale: Как и при слове «отец», еврейский суффикс стоит в единственном числе. Форма «свою» естественно выражает принадлежность при собирательном подлежащем.
- source_word: לֹא יְבָרֵךְ
  choice: не благословляет
  rationale: Глагол ברך в пиэле обычно значит «благословлять». Настоящее время соответствует общехарактерному стилю притчи, а буквальный выбор сохраняет намеренный контраст с проклятием.
