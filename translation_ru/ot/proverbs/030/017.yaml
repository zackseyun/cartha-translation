base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/017.yaml
  text: The eye that mocks a father and despises obedience to a mother—the ravens of the valley will peck it out[c][b][a], and the young of the eagle will eat it.
translation:
  language: ru
  text: Глаз, который насмехается над отцом и презирает послушание матери[a], выклюют вороны из долины[b], а птенцы орла[c] съедят его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление (или повеление) матери». Редкое еврейское слово, вероятно, указывает на послушание или внимание, которое следует оказывать матери.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может обозначать также вади, русло потока или ущелье.
    reason: lexical_alternative
  - marker: c
    text: Еврейское נשר (не́шер) может обозначать орла или грифа; традиционный перевод — «орёл».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Глаз
  rationale: Единственное число и образ глаза сохранены как конкретное обозначение дерзкого, презрительного взгляда.
- source_word: תִּלְעַג
  choice: насмехается
  rationale: Глагол передаёт насмешку и презрительное отношение; это естественное современное русское соответствие.
- source_word: לְאָב
  choice: над отцом
  rationale: В еврейском тексте нет притяжательного суффикса, поэтому сохранён обобщённый смысл без добавления «своим».
- source_word: וְתָבוּז
  choice: и презирает
  rationale: Сохраняет сильное значение пренебрежения и презрения.
- source_word: לִיקֲּהַת אֵם
  choice: послушание матери
  rationale: Редкое и спорное существительное в данном контексте, вероятно, обозначает послушание или внимание, подобающее по отношению к матери; альтернативное понимание отмечено в сноске.
- source_word: יִקְּרוּהָ
  choice: выклюют
  rationale: Глагол описывает действие птиц, выклёвывающих глаз; русское «выклюют» кратко и наглядно передаёт образ.
- source_word: עֹרְבֵי נַחַל
  choice: вороны из долины
  rationale: נחל может обозначать долину, вади, русло или поток. Основной текст использует понятное «долина», а диапазон значения указан в сноске.
- source_word: וְיֹאכְלוּהָ
  choice: съедят его
  rationale: Передан обычный смысл глагола «есть» без ненужного усиления; местоимение относится к глазу.
- source_word: בְנֵי נָשֶׁר
  choice: птенцы орла
  rationale: Буквально «сыновья/детёныши не́шера». «Птенцы орла» естественно по-русски и сохраняет традиционное понимание, тогда как возможное значение «гриф» отмечено в сноске.
