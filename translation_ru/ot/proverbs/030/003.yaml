  text: וְ/לֹֽא לָמַ֥דְתִּי חָכְמָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים אֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/003.yaml
  text: And I have not learned wisdom[a], nor do I know the knowledge of the Holy One.
translation:
  language: ru
  text: Я не учился мудрости и не знаю познания Святого[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «познания святых». В еврейском тексте здесь стоит форма множественного числа, но в книге Притчей она может обозначать Бога как Святого.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמַדְתִּי
  choice: не учился
  rationale: Перфект первого лица выражает отсутствие приобретённого обучения; в русском контексте естественно передаётся прошедшим временем с сохраняющимся результатом.
- source_word: חָכְמָה
  choice: мудрости
  rationale: Обычное в Притчах обозначение практической и нравственной мудрости.
- source_word: דַעַת
  choice: знанием
  rationale: Существительное означает знание и образует смысловую связь с последующим глаголом ידע; творительный падеж требуется конструкцией «обладать».
- source_word: קְדֹשִׁים
  choice: Святого
  rationale: 'Хотя форма морфологически множественная, в литературе мудрости она может обозначать Бога; родительный падеж сохраняет неоднозначность отношения: знание о Святом или принадлежащее Ему.'
- source_word: אֵדָע
  choice: не обладаю
  rationale: Имперфект выражает нынешнее отсутствие знания. Формулировка «не обладаю знанием» естественно передаёт сочетание существительного דַעַת с глаголом ידע и не добавляет нового содержания.
theological_decisions:
- issue: Относится ли קְדֹשִׁים к Богу в единственном числе или к святым существам/лицам во множественном
  choice: 'единственное число, относящееся к Богу: «Святого»'
  alternative: 'множественное число: «святых»'
  rationale: Параллельная формулировка в Притчах 9:10 поддерживает отнесение к Богу, однако еврейская форма буквально является множественным числом, поэтому альтернативное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая исповедальная формулировка с сохранением параллелизма двух отрицательных утверждений и исходной богословской неоднозначности.
