  register: Современный литературный русский язык с сохранением краткости и резкости притчи. Выражение «нарушающей супружескую верность» понятно широкому читателю и точно обозначает прелюбодеяние; цепочка глаголов в прошедшем времени сохраняет последовательность еврейских перфектов и живость законченной сцены.
