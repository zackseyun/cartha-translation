  text: כֵּ֤ן דֶּ֥רֶךְ אִשָּׁ֗ה מְנָ֫אָ֥פֶת אָ֭כְלָה וּ/מָ֣חֲתָה פִ֑י/הָ וְ֝/אָמְרָ֗ה לֹֽא פָעַ֥לְתִּי אָֽוֶן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/020.yaml
  text: 'So is the way of an adulterous woman: she eats and wipes her mouth and says[b][a], “I have done no wrong.”'
translation:
  language: ru
  text: 'Таков путь женщины, совершающей прелюбодеяние: она ест, вытирает рот[b] и говорит: «Я не сделала ничего дурного».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Я не совершила зла».'
    reason: lexical_alternative
  - marker: b
    text: Образ еды и вытирания рта передаёт беспечное сокрытие поступка, словно после него не осталось никакого нравственного следа.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: Таков
  rationale: Указывает на сравнение с предшествующим образом и естественно вводит итоговую характеристику.
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Сохраняет характерную для литературы мудрости метафору образа действий, не сводя её к отвлечённому «поведению».
- source_word: אִשָּׁה מְנָאָפֶת
  choice: женщины, нарушающей супружескую верность
  rationale: Передаёт причастие как характеристику женщины, совершающей прелюбодеяние, ясным современным языком и без архаичного ярлыка.
- source_word: אָכְלָה
  choice: она поела
  rationale: Перфект передан завершённым действием внутри яркой типичной сцены; это также поддерживает последовательность действий перед последующим отрицанием.
- source_word: וּמָחֲתָה פִיהָ
  choice: вытерла рот
  rationale: Буквально и естественно передаёт образ устранения следов после еды.
- source_word: וְאָמְרָה
  choice: и сказала
  rationale: Согласовано с формой перфекта и повествовательной последовательностью образной сцены.
- source_word: לֹא פָעַלְתִּי אָוֶן
  choice: Я не сделала ничего дурного
  rationale: Естественно передаёт отрицание проступка и семантический диапазон אָוֶן — зло, нечестие, неправда; более буквальный вариант отмечен в сноске.
