lexical_decisions:
- source_word: לַיִשׁ
  choice: лев
  rationale: Поэтическое древнееврейское наименование льва. В русском языке форма без артикля естественно допускает родовое, символическое значение.
- source_word: גִּבּוֹר
  choice: могучий
  rationale: Передаёт силу и мощь, сохраняя возвышенный поэтический тон и не сужая значение до воинской доблести.
- source_word: בַּבְּהֵמָה
  choice: среди зверей
  rationale: Предлог ב здесь выражает положение в кругу животных; «среди зверей» естественно передаёт сравнительный смысл и поэтический регистр.
- source_word: וְלֹא יָשׁוּב
  choice: не отступающий
  rationale: В контексте перечисления конструкция естественно оформляется причастным оборотом. «Не отступающий» передаёт буквальный образ движения назад и подразумеваемое бесстрашие.
- source_word: מִפְּנֵי כֹל
  choice: ни перед кем
  rationale: Передаёт всеохватность כֹל и идиоматический смысл отказа отступить перед противником; контекст одушевлённых существ делает «кем» естественным по-русски.
