  text: under a hated woman when she is married[a], and a female servant when she inherits from her mistress.
translation:
  language: ru
  text: 'от женщины, которую ненавидят, когда она выходит замуж,

    и от рабыни, когда она занимает место своей госпожи[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овладевает тем, что принадлежало её госпоже». Еврейский глагол обычно означает «наследовать», «овладевать» или «вступать во владение»; здесь он, вероятно, указывает на то, что рабыня занимает положение своей госпожи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: от
  rationale: В контексте стихов 21–23 предлог указывает, из-за чего или под воздействием чего «содрогается земля». Русское «от» естественно связывает эту строку с управляющей фразой предыдущего стиха.
- source_word: שְׂנוּאָה
  choice: женщина, которую ненавидят
  rationale: Страдательное причастие обозначает женщину, являющуюся объектом ненависти или отвержения. Описательный перевод устраняет возможную двусмысленность русского «ненавистная», которое может означать и «вызывающая ненависть».
- source_word: כִּי
  choice: когда
  rationale: В обоих полустишиях союз вводит обстоятельство, при котором происходит тревожащая перемена общественного положения.
- source_word: תִבָּעֵל
  choice: выходит замуж
  rationale: Нифаль глагола בעל здесь означает стать замужней, обрести мужа. «Выходит замуж» естественно передаёт наступление нового состояния, не сохраняя неестественную для современного русского буквальную пассивную конструкцию.
- source_word: שִׁפְחָה
  choice: рабыня
  rationale: Слово обозначает зависимую служанку, находящуюся в рабском положении; «рабыня» ясно передаёт этот социальный статус.
- source_word: תִירַשׁ
  choice: занимает место
  rationale: Глагол ירש обычно означает получить в наследство, овладеть или вступить во владение. При прямом дополнении «свою госпожу» буквальная передача по-русски затруднительна; в данном социальном контексте речь, вероятно, о переходе рабыни в положение госпожи. Основной текст передаёт этот смысл, а сноска сохраняет лексическую неоднозначность.
- source_word: גְּבִרְתָּהּ
  choice: своей госпожи
  rationale: Существительное обозначает женщину, стоящую над рабыней и управляющую ею; «госпожа» является точным и естественным соответствием.
