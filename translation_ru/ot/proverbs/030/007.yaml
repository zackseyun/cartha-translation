  text: שְׁ֭תַּיִם שָׁאַ֣לְתִּי מֵ/אִתָּ֑/ךְ אַל תִּמְנַ֥ע מִ֝מֶּ֗/נִּי בְּ/טֶ֣רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/007.yaml
  text: 'Two things I have asked of you[a]; do not withhold them from me before I die:'
translation:
  language: ru
  text: 'Две вещи я попросил у Тебя[a]; не откажи мне в них, прежде чем я умру:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Две я попросил у Тебя». Существительное «вещи» в еврейском тексте подразумевается и восполнено по контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתַּיִם
  choice: две вещи
  rationale: 'Женская форма числительного «две» употреблена эллиптически: подразумевается существительное, которое раскрывается следующими просьбами. Добавление «вещи» делает фразу естественной по-русски.'
- source_word: שָׁאַלְתִּי
  choice: я попросил
  rationale: Перфект Qal, 1-е лицо единственного числа, передан формой совершенного вида, обозначающей уже высказанную просьбу, которая остаётся в силе.
- source_word: מֵאִתָּךְ
  choice: у Тебя
  rationale: Предлог указывает на того, к кому обращена просьба и от кого ожидается её исполнение; «попросил у Тебя» — естественная русская конструкция.
- source_word: אַל־תִּמְנַע מִמֶּנִּי
  choice: не откажи мне в них
  rationale: Сочетание отрицательной частицы с глаголом «удерживать, не давать» выражает прямую мольбу. Русское «не откажи мне в них» естественно передаёт просьбу не удерживать просимое.
- source_word: בְּטֶרֶם אָמוּת
  choice: прежде чем я умру
  rationale: 'Точно и естественно передаёт временной предел просьбы: её исполнение требуется до смерти говорящего.'
theological_decisions: []
