  text: כָּל אִמְרַ֣ת אֱל֣וֹהַּ צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לַֽ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/005.yaml
  text: Every word of God is proven; he is a shield to those who take refuge in him.
translation:
  language: ru
  text: Всякое слово Бога испытано; Он — щит для тех, кто ищет у Него убежища.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִמְרַת אֱלוֹהַּ
  choice: Всякое слово Бога
  rationale: «Всякое» естественно передаёт дистрибутивное כָּל, а «слово Бога» сохраняет смысл אִמְרַת אֱלוֹהַּ без расширения до понятия Писания в целом.
- source_word: צְרוּפָה
  choice: испытано
  rationale: Причастие от צרף обозначает проверку или очищение металла огнём; в данном контексте «испытано» передаёт подтверждённую надёжность Божьего слова и сохраняет образ проверки, не сводя значение только к нравственной чистоте.
- source_word: מָגֵן
  choice: щит
  rationale: Прямой и естественный эквивалент образа защиты.
- source_word: לַחֹסִים בּוֹ
  choice: для тех, кто ищет у Него убежища
  rationale: Глагол חסה выражает обращение к кому-либо за защитой; эта формулировка передаёт активное упование и естественно звучит по-русски.
theological_decisions:
- issue: Относится ли местоимение הוּא к Богу или к Божьему слову
  choice: Он — щит
  alternative: оно — щит
  rationale: Мужской род הוּא естественно соотносится с אֱלוֹהַּ («Бог»), тогда как אִמְרָה («слово, изречение») — женского рода; поэтому субъект второй части — Бог.
- issue: Передача метафоры очищения/испытания в צְרוּפָה
  choice: испытано
  alternative: чисто
  rationale: «Испытано» сохраняет идею прохождения проверки и согласуется с контекстом надёжности, не отрицая сопутствующего оттенка очищенности.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура и параллелизм оригинала сохранены. Заглавное «Он» употреблено как уважительное обозначение Бога.
