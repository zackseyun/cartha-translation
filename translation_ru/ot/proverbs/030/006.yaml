source:
  edition: WLC
  text: אַל תּ֥וֹסְףְּ עַל דְּבָרָ֑י/ו פֶּן יוֹכִ֖יחַ בְּ/ךָ֣ וְ/נִכְזָֽבְתָּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/006.yaml
  text: Do not add to his words[a], lest he rebuke you and you be proved a liar.
translation:
  language: ru
  text: Не прибавляй к Его словам, иначе Он обличит тебя и ты окажешься лжецом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תּוֹסְףְּ
  choice: Не прибавляй
  rationale: Отрицание אַל с имперфектом выражает запрет, а Hифиль יסף здесь означает «добавлять, прибавлять». Такая формулировка естественна и сохраняет прямую силу предостережения.
- source_word: עַל דְּבָרָיו
  choice: к Его словам
  rationale: Сочетание יסף с עַל передаётся по-русски как «прибавлять к». דְּבָרָיו буквально означает «его слова»; прописная буква указывает на Бога как ближайший контекстуальный референт, не заменяя местоимение существительным.
- source_word: פֶּן
  choice: иначе
  rationale: Частица вводит нежелательное последствие. «Иначе» ясно и естественно передаёт предупредительный смысл в современном русском языке.
- source_word: יוֹכִיחַ בְּךָ
  choice: Он обличит тебя
  rationale: Hифиль יכח может означать «обличать, укорять, доказывать неправоту». «Обличит» сохраняет как личное порицание, так и оттенок выявления неправоты.
- source_word: וְנִכְזָבְתָּ
  choice: и ты окажешься лжецом
  rationale: 'Нифаль כזב выражает результат: человек обнаруживается ложным или лжецом. «Окажешься лжецом» естественно передаёт результативный смысл и нравственную остроту выражения.'
theological_decisions:
- issue: К кому относится местоимение в выражении «Его словам»
  choice: К Богу, о слове Которого говорится в Притчах 30:5
  alternative: К некоему говорящему в общем наставлении мудрости
  rationale: Непосредственный контекст стиха 5 делает Бога наиболее естественным референтом. Перевод сохраняет местоименную форму еврейского текста, а не подставляет прямо «Божьим словам».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис краткий и афористичный; «обличит» несколько возвышенно, но общеупотребительно в религиозно-нравственном контексте.
