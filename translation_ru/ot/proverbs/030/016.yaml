base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/016.yaml
  text: Sheol[a], and a barren womb; earth, never satisfied with water; and fire, which never says[c][b], “Enough.”
translation:
  language: ru
  text: 'Шеол[a] и бесплодная утроба[b], земля, которая не насыщается водой, и огонь, который не говорит: «Довольно!»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могила», «мир мёртвых».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «удержание (или закрытие) утробы», то есть утроба, не рождающая детей.'
    reason: lexical_alternative
  - marker: c
    text: Последнее еврейское слово трудно для толкования. Многие понимают его как «Довольно!», но предлагались также значения, связанные с богатством или имуществом.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет значение еврейского понятия — мира мёртвых, не сводя его лишь к отдельной могиле.
- source_word: עֹצֶר רָחַם
  choice: бесплодная утроба
  rationale: Буквальный образ «удержания/закрытия утробы» идиоматически обозначает утробу, не рождающую детей; выбран естественный и сжатый русский эквивалент.
- source_word: אֶרֶץ
  choice: земля
  rationale: В перечне ненасытимых явлений слово имеет широкое, стихийное значение, а не обозначает конкретную страну или территорию.
- source_word: לֹא שָׂבְעָה מַּיִם
  choice: не насыщаемая водой
  rationale: Передаёт значение глагола «насыщаться, быть удовлетворённым» и сохраняет поэтический параллелизм.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямой и естественный лексический эквивалент.
- source_word: לֹא אָמְרָה הוֹן
  choice: 'не говорит: «Довольно!»'
  rationale: В контексте перечня ненасытимых вещей финальное слово наиболее естественно понимать как возглас «Довольно!», при этом текстовая трудность отмечена в сноске.
