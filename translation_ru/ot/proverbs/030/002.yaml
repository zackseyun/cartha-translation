  text: כִּ֤י בַ֣עַר אָנֹכִ֣י מֵ/אִ֑ישׁ וְ/לֹֽא בִינַ֖ת אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/002.yaml
  text: For I am more brutish than anyone[a], and I do not have human understanding.
translation:
  language: ru
  text: Ведь я глупее человека[a], и нет у меня человеческого разумения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я слишком глуп, чтобы быть человеком, и нет у меня разумения, свойственного человеку».'
    reason: 'Лексико-синтаксическая альтернатива: מֵאִישׁ можно понимать не как обычное сравнение, а как указание на неспособность соответствовать человеческому уровню разумения.'
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предыдущим высказыванием естественным для современного русского языка способом.
- source_word: בַעַר
  choice: глупее
  rationale: Слово обозначает тупость, неразумие, иногда с оттенком животной несмысленности. «Глупее» ясно передаёт сильное самоуничижение и естественно сочетается со сравнительной конструкцией.
- source_word: אָנֹכִי
  choice: я
  rationale: Сохраняет явно выраженное и несколько подчёркнутое местоимение первого лица.
- source_word: מֵאִישׁ
  choice: любого человека
  rationale: מִן допускает сравнительное понимание — «чем человек»; в данном контексте по-русски естественно передать обобщённое сравнение как «любого человека», не ограничивая смысл мужчинами.
- source_word: וְלֹא
  choice: и нет
  rationale: Передаёт соединение и отрицание, а вместе с לִי образует естественную русскую конструкцию обладания «нет у меня».
- source_word: בִינַת
  choice: разумения
  rationale: Сохраняет значение способности понимать и различать, а также возвышенный, но понятный регистр литературы мудрости.
- source_word: אָדָם
  choice: человеческого
  rationale: 'В сочетании בִינַת אָדָם слово имеет обобщённый антропологический смысл: разумение, свойственное человеку.'
- source_word: לִי
  choice: у меня
  rationale: Еврейская дательная конструкция обладания естественно передаётся по-русски оборотом «нет у меня».
theological_decisions:
- issue: Обобщённое антропологическое значение אָדָם
  choice: человеческого разумения
  alternative: разумения мужчины / разумения человека
  rationale: Здесь אָדָם относится к человеку как таковому, а не исключительно к лицам мужского пола; прилагательное «человеческого» точно сохраняет этот общий смысл.
- issue: Неоднозначность сочетания בַעַר אָנֹכִי מֵאִישׁ
  choice: я глупее любого человека
  alternative: я слишком глуп, чтобы быть человеком
  rationale: Основной текст следует обычному сравнительному пониманию מִן, а возможное лишительное или предельное понимание сохраняется в сноске, без устранения смысловой напряжённости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным оттенком, уместным для книги Притч. «Глупее» сохраняет резкость самооценки; «разумение» поддерживает лексику литературы мудрости и остаётся понятным современному читателю.
