base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/008.yaml
  text: Keep falsehood and lying words far from me[a]; give me neither poverty nor riches[b]; feed me with the bread allotted to me.
translation:
  language: ru
  text: Удали от меня ложь и лживые речи[a]; не давай мне ни бедности, ни богатства; питай меня хлебом, положенным мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слово лжи»; возможно также: «лживое слово».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «хлеб моей доли»; возможно также: «положенную мне долю хлеба» или «мой ежедневный хлеб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: ложь
  rationale: В параллели с דְבַר כָּזָב слово обозначает нравственную и речевую ложность, а не просто суетность или тщету.
- source_word: דְבַר כָּזָב
  choice: лживые речи
  rationale: Буквально «слово лжи». Русское множественное число естественно передаёт обобщённую категорию обманчивой речи; буквальная форма отмечена в сноске.
- source_word: הַרְחֵק מִמֶּנִּי
  choice: отдали от меня
  rationale: Каузативный императив выражает просьбу сделать ложь далёкой, удалить её; «отдали» точно и естественно передаёт образ исходного текста.
- source_word: רֵאשׁ
  choice: бедность
  rationale: Ясно обозначает нужду и образует естественную смысловую пару с богатством.
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Точно сохраняет экономический контраст с бедностью.
- source_word: אַל תִּתֶּן לִי
  choice: не давай мне ни… ни…
  rationale: Русская конструкция естественно передаёт единое отрицание, относящееся и к бедности, и к богатству.
- source_word: הַטְרִיפֵנִי
  choice: питай меня
  rationale: Глагол здесь означает снабжать пищей; выбранная формулировка сохраняет образ кормления и уместна в молитвенной просьбе.
- source_word: לֶחֶם חֻקִּי
  choice: хлебом, который мне назначен
  rationale: Передаёт хлеб как положенную, установленную человеку долю и не вносит более позднюю устойчивую формулу «хлеб насущный».
theological_decisions:
- issue: Смысл просьбы לֶחֶם חֻקִּי
  choice: просьба о назначенной человеку мере пропитания между бедностью и богатством
  alternative: «хлеб насущный» или «ежедневный хлеб»
  rationale: Контекст противопоставляет лишение и избыток. Перевод сохраняет тему достаточной, отмеренной доли и не отождествляет выражение без необходимости с позднейшей литургической формулой.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным молитвенным звучанием. Синтаксический параллелизм и три последовательные просьбы исходного текста сохранены; архаизмы и новозаветная формула «хлеб насущный» не использованы.
