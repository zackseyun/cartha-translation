  text: For churning milk produces butter[a], and pressing the nose produces blood[b], and pressing anger produces strife.
translation:
  language: ru
  text: Ведь от сбивания молока получается масло[a], от сдавливания носа идёт кровь, а от разжигания гнева[b] возникает ссора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «творог» или «сгустки молока»; еврейское слово может обозначать молочный продукт, полученный сбиванием или створаживанием.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте здесь игра слов: родственные формы могут означать «нос» и, в переносном употреблении, «гнев»; кроме того, во всех трёх частях повторяется слово со значением надавливания или выжимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим наставлением и естественно вводит основание для него.
- source_word: מִיץ
  choice: сбивание / сдавливание / разжигание
  rationale: Еврейское слово со значением надавливания или выжимания повторено трижды. По-русски один и тот же глагол не сочетается естественно со всеми тремя объектами, поэтому выбраны контекстуальные соответствия; повтор и игра слов отмечены в сноске.
- source_word: חָלָב
  choice: молоко
  rationale: Прямое и естественное соответствие исходному слову.
- source_word: יוֹצִיא
  choice: получается / идёт / возникает
  rationale: Каузативная форма выражает результат действия. Разные русские глаголы позволяют естественно назвать результат в каждом из трёх параллельных образов.
- source_word: חֶמְאָה
  choice: масло
  rationale: Традиционное и контекстуально уместное обозначение молочного продукта; более широкая лексическая возможность передана в сноске.
- source_word: אַף
  choice: нос
  rationale: Здесь требуется конкретное телесное значение, поскольку результатом сдавливания становится кровь.
- source_word: דָם
  choice: кровь
  rationale: Прямое соответствие исходному слову.
- source_word: אַפַּיִם
  choice: гнев
  rationale: Форма, буквально связанная с ноздрями, регулярно употребляется как идиома гнева; русский перевод передаёт смысл, а связь с предыдущим словом «нос» объясняется в сноске.
- source_word: רִיב
  choice: ссора
  rationale: Естественно передаёт спор, распрю или столкновение и хорошо подходит к афористическому стилю.
