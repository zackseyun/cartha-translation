  text: שְׂ֭מָמִית בְּ/יָדַ֣יִם תְּתַפֵּ֑שׂ וְ֝/הִ֗יא בְּ/הֵ֣יכְלֵי מֶֽלֶךְ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/028.yaml
  text: A lizard you can catch with your hands[a], yet it is in kings’ palaces.
translation:
  language: ru
  text: Ящерицу можно поймать руками[a], но она бывает в царских дворцах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «паука». Еврейское слово שְׂמָמִית встречается редко, и его значение неясно: многие традиционные переводы понимают его как «паук», другие — как разновидность ящерицы или геккона.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמָמִית
  choice: ящерица
  rationale: Редкое еврейское слово имеет не вполне ясное значение. По контексту вероятно небольшое пресмыкающееся, способное проникать во дворцы; «ящерица» сохраняет нужную обобщённость, тогда как «геккон» был бы более узким определением.
- source_word: בְּיָדַיִם
  choice: руками
  rationale: Предлог בְּ выражает орудие действия; краткая русская форма естественно передаёт образ.
- source_word: תְּתַפֵּשׂ
  choice: можно поймать
  rationale: Еврейская форма второго лица буквально означает «ты хватаешь/ловишь». Безличная конструкция по-русски естественно выражает обобщённое обращение и доступность этого действия.
- source_word: וְהִיא
  choice: но она бывает
  rationale: 'Союз в контексте имеет противительный оттенок: существо легко поймать, и всё же оно проникает в царские дворцы. «Бывает» передаёт обычное, повторяющееся присутствие, не утверждая нахождение лишь в данный момент.'
- source_word: בְּהֵיכְלֵי מֶלֶךְ
  choice: в царских дворцах
  rationale: Буквально — «во дворцах царя». Русское выражение «в царских дворцах» естественно сохраняет обобщающий смысл изречения.
