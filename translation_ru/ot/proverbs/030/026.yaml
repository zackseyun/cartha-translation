  text: שְׁ֭פַנִּים עַ֣ם לֹא עָצ֑וּם וַ/יָּשִׂ֖ימוּ בַ/סֶּ֣לַע בֵּיתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/026.yaml
  text: Rock badgers are a people not mighty[a], yet they make their home in the crag.
translation:
  language: ru
  text: 'даманы — народ[a] не сильный,

    но они устраивают свой дом в скале.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сообщество; еврейское слово буквально означает «народ».
    reason: figurative_expression
lexical_decisions:
- source_word: שְׁפַנִּים
  choice: даманы
  rationale: Еврейское название, вероятнее всего, обозначает даманов — небольших животных, обитающих среди скал. Современное русское зоологическое название точнее традиционных вариантов.
- source_word: עַם
  choice: народ
  rationale: Сохранён буквальный и выразительный образ еврейского текста, где группа животных названа «народом».
- source_word: לֹא עָצוּם
  choice: не сильный
  rationale: Передаёт отсутствие физической силы без усиления значения; краткая форма соответствует афористическому параллелизму.
- source_word: וַיָּשִׂימוּ
  choice: устраивают
  rationale: Буквально глагол означает «помещают, кладут», но в сочетании с «домом» естественное русское выражение — «устраивают свой дом». Настоящее время передаёт общеизвестную, постоянную истину изречения.
- source_word: בַסֶּלַע
  choice: в скале
  rationale: Сохраняет единственное число и обозначение скального убежища; это естественно по-русски и точно соответствует контексту.
- source_word: בֵּיתָם
  choice: свой дом
  rationale: Передаёт буквальный образ «их дома», а возвратное местоимение естественно связывает жилище с субъектом предложения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, образности и двухчастного строения еврейского изречения. Термин «даманы» точен, хотя может быть не всем знаком; контекст скалы помогает его понять.
