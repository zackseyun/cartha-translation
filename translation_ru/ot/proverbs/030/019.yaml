id: PRO.30.19
reference: Proverbs 30:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: דֶּ֤רֶךְ הַ/נֶּ֨שֶׁר בַּ/שָּׁמַיִם֮ דֶּ֥רֶךְ נָחָ֗שׁ עֲלֵ֫י צ֥וּר דֶּֽרֶךְ אֳנִיָּ֥ה בְ/לֶב יָ֑ם וְ/דֶ֖רֶךְ גֶּ֣בֶר בְּ/עַלְמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/019.yaml
  text: the way of an eagle in the sky[a], the way of a snake on a rock, the way of a ship in the heart of the sea[c][b], and the way of a man with a young woman.
translation:
  language: ru
  text: путь орла в небе[a], путь змеи по скале, путь корабля в сердце моря[b] и путь мужчины с девушкой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово נֶשֶׁר может обозначать не только орла, но и другую крупную хищную птицу, в том числе грифа.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в сердце моря», то есть посреди моря.'
    reason: cultural_note
  - marker: c
    text: Еврейское עַלְמָה означает молодую женщину брачного возраста; само по себе это слово не обязательно означает девственницу.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: путь
  rationale: 'Повторено четыре раза и задаёт структуру изречения. «Путь» сохраняет широкий смысл: траектория движения, образ действия или ход отношений.'
- source_word: הַנֶּשֶׁר
  choice: орёл
  rationale: Традиционный и естественный русский эквивалент; возможный более широкий объём значения отмечен в сноске.
- source_word: בַּשָּׁמַיִם
  choice: в небе
  rationale: В данном образе речь идёт о видимом небе, где летит птица; «в небесах» звучало бы более возвышенно и менее конкретно.
- source_word: נָחָשׁ
  choice: змея
  rationale: Современное нейтральное обозначение без лишних ассоциаций, которые могло бы вызвать более книжное «змей».
- source_word: עֲלֵי צוּר
  choice: по скале
  rationale: Передаёт движение змеи по каменной поверхности и естественно сочетается в русском языке со словом «путь».
- source_word: אֳנִיָּה
  choice: корабль
  rationale: Обозначает морское судно; «корабль» соответствует морскому контексту и масштабу образа.
- source_word: בְלֶב יָם
  choice: в сердце моря
  rationale: Сохраняет буквальный и выразительный образ еврейского текста; идиоматически означает нахождение среди моря.
- source_word: גֶּבֶר
  choice: мужчина
  rationale: Существительное конкретно обозначает взрослого человека мужского пола; «мужчина» ясно передаёт это значение.
- source_word: בְּעַלְמָה
  choice: с девушкой
  rationale: עַלְמָה обозначает молодую женщину брачного возраста, не утверждая само по себе её девственность. Предлог ב передан как «с», чтобы сохранить relationalный и намеренно недосказанный характер строки.
theological_decisions:
- issue: Смысл заключительной строки וְדֶרֶךְ גֶּבֶר בְּעַלְמָה
  choice: путь мужчины с девушкой
  alternative: путь мужчины с девственницей; путь мужчины в девушке
  rationale: Строка завершает перечень трудноуловимых «путей». Перевод «с девушкой» допускает смысл влечения, ухаживания или интимной близости, не сужая намеренно неоднозначную формулировку до одного толкования и не делая её более откровенной, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и четырёхкратного образа «пути». Строка оформлена как продолжение перечня предыдущего стиха, поэтому начинается со строчной буквы. Выражение «в сердце моря» намеренно сохраняет образность оригинала, а финальная формулировка остаётся сдержанной и неоднозначной.
