  verdict: revise
  source_fidelity: 'В основном смысл передан верно: אַרְבֶּה — собирательная «саранча», כֻּלּוֹ естественно передано как «вся она», а חֹצֵץ обоснованно понимается как движение разделёнными/упорядоченными группами. Однако простой союз וְ не требует противительного «но»; в отличие от английского аудита, древнееврейский текст не маркирует здесь уступки. «Выходит» точнее соответствует וַיֵּצֵא, не добавляя оттенка военного выступления.'
  naturalness: «У саранчи нет царя, и вся она выходит стройными рядами» — естественная, краткая и афористичная современная литературная русская фраза. Собирательное существительное в единственном числе и местоимение «вся она» звучат нормально.
  terminology: «Царь» — точное и уместное соответствие מֶלֶךְ. «Саранча» сохраняет собирательный характер исходного существительного. «Стройными рядами» является допустимой контекстуальной передачей редкого חֹצֵץ, если альтернативное значение сохранено в сноске.
  issues:
  - severity: medium
    issue: Противительный союз «но»
    rationale: В еврейском тексте стоит обычное וְ («и»), а не явно противительный или уступительный союз. «Но» привносит логическое противопоставление, которое может подразумеваться в пословице, но не выражено формально.
  - severity: low
    issue: «Выступает» несколько усиливает военный образ
    rationale: וַיֵּצֵא буквально означает «выходит/идёт». В сочетании со «стройными рядами» глагол «выступает» может чрезмерно милитаризовать образ; «выходит» сохраняет образ и ближе к исходному глаголу.
  revised_text: У саранчи нет царя, и вся она выходит стройными рядами.[a]
  revised_footnotes:
  - marker: a
    text: 'Или: «и вся она выходит, разделившись на группы».'
