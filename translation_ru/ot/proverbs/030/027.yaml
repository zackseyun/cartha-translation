  text: מֶ֭לֶךְ אֵ֣ין לָ/אַרְבֶּ֑ה וַ/יֵּצֵ֖א חֹצֵ֣ץ כֻּלּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/027.yaml
  text: The locusts have no king[a], yet all of them march out in ranks.
translation:
  language: ru
  text: У саранчи нет царя, и вся она выходит стройными рядами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и вся она выходит, разделившись на группы».'
    reason: Редкое слово חֹצֵץ может означать «разделившись, отдельными группами/частями»; точный оттенок значения спорен.
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Прямое соответствие существительному со значением монарха; в контексте сравнения подчёркивает отсутствие единого руководителя.
- source_word: אֵין לָאַרְבֶּה
  choice: у саранчи нет
  rationale: 'Естественно передаёт древнееврейскую конструкцию обладания: буквально «нет у саранчи».'
- source_word: אַרְבֶּה
  choice: саранча
  rationale: Существительное имеет собирательное значение; русское «саранча» естественно сохраняет собирательную форму единственного числа.
- source_word: וַיֵּצֵא
  choice: но … выступает
  rationale: '«Выступает» передаёт организованное движение наружу, а «но» выявляет подразумеваемое противопоставление: царя нет, однако порядок сохраняется.'
- source_word: חֹצֵץ
  choice: стройными рядами
  rationale: Передаёт редкое слово как указание на разделение и упорядоченность в группы; «стройными» делает образ естественным по-русски, не превращая его в строго военный термин.
- source_word: כֻּלּוֹ
  choice: вся она
  rationale: Согласуется с русским собирательным существительным «саранча» и выражает охват всей массы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Собирательное «саранча» сохраняет грамматическое число исходного текста, а образ организованного движения выражен естественно и достойно.
