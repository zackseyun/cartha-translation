  yaml_path: translation/ot/proverbs/030/025.yaml
  text: The ants are a people not strong[a], yet they prepare their food in the summer.
translation:
  language: ru
  text: Муравьи — народ не сильный, но летом они готовят себе пищу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свой хлеб»; здесь «хлеб» означает пищу или припасы вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּמָלִים
  choice: муравьи
  rationale: Определённое существительное во множественном числе обозначает муравьёв как целый класс; в русском языке это естественно передаётся без артикля.
- source_word: עַם
  choice: народ
  rationale: Сохраняет намеренную метафору еврейского текста, где обозначение человеческой общности применяется к муравьям; нейтральное «существа» сгладило бы образ.
- source_word: לֹא עָז
  choice: не сильный
  rationale: Буквально сохраняет отрицание прилагательного «сильный, могучий» и не усиливает оценку словом «слабый».
- source_word: וַיָּכִינוּ
  choice: готовят
  rationale: Форма породы хифиль от כון означает «делать готовым, приготавливать»; вариант «запасают» уместен по контексту, но более истолковывающий.
- source_word: בַקַּיִץ
  choice: летом
  rationale: Естественная современная русская передача обстоятельства времени «в летнюю пору».
- source_word: לַחְמָם
  choice: себе пищу
  rationale: לֶחֶם может обозначать не только хлеб, но и пищу вообще. Возвратное «себе» естественно передаёт местоименный суффикс третьего лица множественного числа.
