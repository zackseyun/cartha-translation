  text: דּ֭וֹר מָה רָמ֣וּ עֵינָ֑י/ו וְ֝/עַפְעַפָּ֗י/ו יִנָּשֵֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/013.yaml
  text: There is a generation—how lofty are its eyes[a], and its eyelids are raised high.
translation:
  language: ru
  text: Есть поколение — до чего надменны его глаза[a] и высоко подняты его веки!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «как высоки его глаза».'
    reason: Сноска сохраняет вертикальную метафору еврейского רָמוּ, тогда как основной текст передаёт подразумеваемую надменность естественным русским выражением.
lexical_decisions:
- source_word: דּוֹר
  choice: Есть поколение
  rationale: דּוֹר обозначает поколение или определённый род людей. В контексте повторяющихся описаний Притч 30:11–14 конструкция вводит очередной тип людей; «есть» естественно передаёт эту функцию по-русски, не превращая существительное в отвлечённое обозначение.
- source_word: מָה
  choice: до чего
  rationale: מָה употреблено в восклицательном, а не вопросительном значении и подчёркивает степень признака. Русское «до чего» естественно сохраняет восклицательную силу.
- source_word: רָמוּ עֵינָיו
  choice: надменны его глаза
  rationale: Буквально говорится, что глаза «высоки». В данном телесном образе высота выражает гордость; «надменны» делает смысл понятным по-русски, а существительное «глаза» сохраняет конкретную образность. Более буквальный вертикальный образ указан в сноске.
- source_word: וְעַפְעַפָּיו
  choice: и … его веки
  rationale: עַפְעַף буквально означает «веко». Сохранение названия части тела поддерживает параллелизм с глазами и яркость образа.
- source_word: יִנָּשֵׂאוּ
  choice: высоко подняты
  rationale: Нифаль от נשׂא передаёт состояние поднятости. «Высоко подняты» естественно звучит применительно к векам и сохраняет пространственный образ горделивой осанки.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением восклицательной поэтической формы и параллелизма. Единственное число «его» оставлено в согласовании с собирательным существительным «поколение», как в еврейском тексте.
