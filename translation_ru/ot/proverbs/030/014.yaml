base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/014.yaml
  text: a generation whose teeth are swords[a], and whose fangs are knives[b], to devour the poor from the earth and the needy from among mankind.
translation:
  language: ru
  text: Есть поколение, у которого зубы — мечи, а клыки — ножи, чтобы пожирать бедных с земли[a] и нуждающихся из среды людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из страны».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из человека»; здесь אָדָם обозначает людей, человечество в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: поколение
  rationale: Обычное значение — «поколение» или определённый разряд людей. Конструкция «есть поколение» естественно передаёт подразумеваемое бытийное утверждение в ряду изречений Притч 30:11–14.
- source_word: חֲרָבוֹת
  choice: мечи
  rationale: Основное значение множественного числа от חֶרֶב; сохраняет конкретный и жестокий образ.
- source_word: שִׁנָּיו
  choice: у которого зубы
  rationale: Суффикс 3-го лица единственного числа соотносится с собирательным דּוֹר; русская конструкция естественно выражает это согласование.
- source_word: מַאֲכָלוֹת
  choice: ножи
  rationale: В параллели с мечами слово обозначает режущие орудия; «ножи» сохраняет образ без излишнего уточнения.
- source_word: מְתַלְּעֹתָיו
  choice: клыки
  rationale: Слово обозначает челюстные зубы; «клыки» естественно усиливает хищнический образ, хотя возможна более анатомическая передача «коренные зубы».
- source_word: לֶאֱכֹל
  choice: пожирать
  rationale: Буквально «есть»; в метафоре насильственного угнетения «пожирать» передаёт хищническую силу образа.
- source_word: עֲנִיִּים
  choice: бедных
  rationale: В данном контексте на первом плане материальная и социальная уязвимость, хотя слово также может означать угнетённых или страждущих.
- source_word: מֵאֶרֶץ
  choice: с земли
  rationale: Сохраняет предлог «из/с» и широкое значение אֶרֶץ, соответствующее параллельному выражению «из среды людей».
- source_word: אֶבְיוֹנִים
  choice: нуждающихся
  rationale: Передаёт зависимость от помощи и сохраняет смысловое различие с עֲנִיִּים «бедных».
- source_word: מֵאָדָם
  choice: из среды людей
  rationale: אָדָם употреблено родово, о человечестве вообще; по-русски эта конструкция ясно исключает отсылку к одному конкретному мужчине и сохраняет значение удаления из человеческого общества.
theological_decisions:
- issue: Родовое значение אָדָם
  choice: людей
  alternative: человечества; человека
  rationale: Здесь אָדָם обозначает человеческий род вообще, а не отдельного мужчину. «Из среды людей» естественно передаёт родовое значение и параллелизм с «с земли».
translation_notes:
  register: Современный литературный русский язык с достоинством и выразительной хищнической метафорой оригинала. Начальное «есть» добавлено как естественное русское выражение подразумеваемой древнееврейской бытийной конструкции; параллелизм и намеренно резкое «с земли / из среды людей» сохранены.
