    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Слова
  rationale: Прямо передаёт форму сопряжённого множественного числа и естественно вводит собрание изречений.
- source_word: אָגוּר
  choice: Агур
  rationale: Личное имя передано транслитерацией.
- source_word: בִּן יָקֶה
  choice: сын Иакея
  rationale: Стандартное обозначение происхождения; имя יָקֶה передано транслитерацией с естественным русским склонением.
- source_word: הַמַּשָּׂא
  choice: пророчество
  rationale: מַשָּׂא может обозначать торжественное пророческое возвещение; «пророчество» понятно современному читателю и подходит к заголовку. Возможное понимание как названия Масса отмечено в сноске.
- source_word: נְאֻם
  choice: изречение
  rationale: Передаёт торжественное, формульное обозначение произнесённых слов без излишней архаичности.
- source_word: הַגֶּבֶר
  choice: этого человека
  rationale: Артикль указывает на уже названного Агура; указательное «этого» делает связь естественной по-русски, не усиливая возможный оттенок силы в גֶּבֶר.
- source_word: לְאִיתִיאֵל
  choice: обращённое к Итиэлу
  rationale: Предлог ל наиболее естественно указывает адресата; добавление «обращённое» проясняет русскую синтаксическую связь.
- source_word: לְאִיתִיאֵל וְאֻכָל
  choice: к Итиэлу и Укалу
  rationale: Повтор имени сохранён, а וְאֻכָל вслед за масоретской огласовкой прочитано как личное имя.
theological_decisions:
- issue: Значение הַמַּשָּׂא в надписании
  choice: Нарицательное существительное «пророчество»
  alternative: Собственное имя «Масса» или указание на принадлежность к Массе
  rationale: Артикль поддерживает нарицательное прочтение, а значение торжественного пророческого возвещения подходит контексту. Реальная неопределённость сохранена в сноске.
- issue: Прочтение заключительных слов לְאִיתִיאֵל וְאֻכָל
  choice: 'Имена адресатов: «к Итиэлу, к Итиэлу и Укалу»'
  alternative: 'Глагольная фраза: «Я изнемог, Боже; я изнемог, Боже, и иссяк»'
  rationale: Основной текст следует масоретской огласовке, где формы читаются как имена. Существенно отличающееся возможное прочтение согласного текста приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского надписания. Имена снабжены ударениями для ясного чтения; синтаксическая трудность оригинала не устранена путём замены спорных чтений, а отражена в сносках.
