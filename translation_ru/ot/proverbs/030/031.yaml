  text: a strutting rooster[a], a he-goat[b], and a king against whom there is no rising up.
translation:
  language: ru
  text: петух, гордо выступающий[a], и козёл, и царь, против которого не восстают[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое еврейское слово переведено предположительно; возможны также варианты: «борзая», «боевой конь» или «препоясанный в чреслах».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение неясно. Возможный перевод: «царь, которого сопровождает войско»; предлагались и другие толкования.'
