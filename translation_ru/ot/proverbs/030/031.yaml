lexical_decisions:
- source_word: זַרְזִיר מָתְנַיִם
  choice: петух, гордо выступающий
  rationale: Редкое זַרְזִיר точно не идентифицировано, а מָתְנַיִם буквально означает «бёдра, поясница». В контексте величавой поступи выражение естественно передано как описание гордо выступающего петуха; неопределённость названия животного сохранена в сноске.
- source_word: אוֹ
  choice: и
  rationale: Хотя обычное значение союза — «или», здесь он соединяет элементы числового перечня величаво ступающих существ; русское «и» ясно передаёт функцию перечисления.
- source_word: תָיִשׁ
  choice: козёл
  rationale: Слово обозначает именно самца козы; «козёл» сохраняет эту конкретность и звучит естественно по-русски.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Прямое соответствие обычному древнееврейскому обозначению правителя.
- source_word: אַלְקוּם עִמּוֹ
  choice: против которого никто не восстанет
  rationale: Трудное выражение понято как указание на царя, которому никто не осмеливается противостоять. Формулировка соответствует образу уверенной, величавой поступи, но грамматико-лексическая неоднозначность оговорена в сноске.
theological_decisions:
- issue: Значение трудного выражения אַלְקוּם עִמּוֹ
  choice: против которого никто не восстанет
  alternative: царь, с которым его войско
  rationale: Обе интерпретации имеют основания в трудном согласном тексте. Основной вариант сохраняет идею непреодолимого царя, не вводя прямого упоминания войска, которого в ясной форме в еврейском тексте нет; альтернативное понимание дано в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий ритмический перечень сохранён. «Гордо выступающий» передаёт величавую походку без разговорного оттенка, а две сноски открыто отмечают главные лексические неопределённости.
