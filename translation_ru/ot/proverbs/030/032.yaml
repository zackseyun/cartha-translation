  yaml_path: translation/ot/proverbs/030/032.yaml
  text: If you have acted foolishly by exalting yourself[a], or if you have plotted[b], put your hand over your mouth.
translation:
  language: ru
  text: Если ты поступил глупо, превознося себя, или если ты что-либо замыслил — положи руку на уста.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рука ко рту»; жест, означающий: замолчи и удержись от дальнейших слов.'
    reason: idiom_clarification
lexical_decisions:
- source_word: נָבַלְתָּ
  choice: поступил глупо
  rationale: Глагол נבל обозначает глупое, недостойное поведение, а не просто недостаток ума; выражение «поступил глупо» естественно передаёт нравственно-практический смысл.
- source_word: בְהִתְנַשֵּׂא
  choice: превознося себя
  rationale: Возвратная форма инфинитива от נשׂא указывает на самовозвышение; деепричастный оборот передаёт, в чём именно проявилась глупость.
- source_word: זַמּוֹתָ
  choice: замыслил что-то
  rationale: Глагол זמם означает «замышлять, задумывать, строить замысел» и нередко имеет отрицательную окраску. Поскольку объект в еврейском тексте не назван, «что-то» сохраняет недосказанность и не добавляет прямо отсутствующего слова «зло».
- source_word: יָד לְפֶה
  choice: прикрой рот рукой
  rationale: Буквально «рука ко рту»; конкретный жест служит призывом замолчать и удержаться от дальнейших слов. Русская формулировка сохраняет образ и ясно передаёт идиому.
- source_word: אִם ... וְאִם
  choice: если ... или если
  rationale: Парная условная конструкция называет два возможных случая; в современном русском их естественно связать союзом «или».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; тон краткий, наставительный и образный. Сохранены условная структура, нравственный оттенок глупости и недосказанность глагола זמם.
