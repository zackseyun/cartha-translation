  yaml_path: translation/ot/proverbs/002/022.yaml
  text: But the wicked will be cut off from the land[b][a], and the treacherous will be uprooted from it.
translation:
  language: ru
  text: Но нечестивые будут отсечены от земли[a], и вероломные будут вырваны из неё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от страны». Еврейское אֶרֶץ может означать землю вообще либо определённую землю, страну.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вырваны с корнем». Еврейский глагол обозначает насильственное удаление и допускает образ вырывания с корнем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, постоянно поступающих вопреки нравственной правде; «нечестивые» кратко и естественно передаёт собирательный смысл.
- source_word: מֵאֶרֶץ
  choice: от земли
  rationale: אֶרֶץ может означать как конкретную землю, страну, так и землю вообще. Ближайший контекст (ст. 21–22) противопоставляет пребывание праведных на земле удалению с неё нечестивых; основной перевод сохраняет значение обитаемой земли.
- source_word: יִכָּרֵתוּ
  choice: будут отсечены
  rationale: Нифаль глагола כרת выражает отсечение и тем самым насильственное устранение. «Будут отсечены» сохраняет образ и судебную силу выражения.
- source_word: בוֹגְדִים
  choice: вероломные
  rationale: Причастие от בגד характеризует людей, поступающих предательски и нарушающих верность. «Вероломные» передаёт устойчивую черту, выраженную причастием.
- source_word: יִסְּחוּ
  choice: будут вырваны
  rationale: Глагол נסח означает насильственно удалить, вырвать. Такой перевод сохраняет силу действия, не навязывая исключительно растительный образ.
- source_word: מִמֶּנָּה
  choice: из неё
  rationale: Местоименный суффикс женского рода отсылает к אֶרֶץ; по-русски «из неё» ясно указывает на землю.
- source_word: וְ
  choice: Но ... и ...
  rationale: Первый союз передаёт контраст с участью праведных в предыдущем стихе, а второй соединяет параллельные части изречения.
theological_decisions:
- issue: Значение אֶרֶץ в контексте изречения о мудрости
  choice: земля как место обитания
  alternative: вся земля, земной мир
  rationale: Стихи 21–22 противопоставляют тех, кто останется на земле, тем, кто будет от неё удалён. Перевод «земля» сохраняет эту смысловую связь и не превращает изречение без достаточных оснований в исключительно эсхатологическое утверждение.
- issue: Характер удаления нечестивых и вероломных
  choice: 'образное насильственное удаление: «отсечены» и «вырваны»'
  alternative: нейтральное «будут удалены» или растительное «будут искоренены»
  rationale: Два еврейских глагола передают резкое, принудительное устранение. Различные русские глаголы сохраняют параллелизм, не стирая лексического различия между כרת и נסח.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом. Слова «нечестивые» и «вероломные» понятны в библейско-нравственном контексте и не привносят конфессионально специфической терминологии.
