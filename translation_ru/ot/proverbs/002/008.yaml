  text: to guard the paths of justice[a], and he watches over the way of his faithful ones.
translation:
  language: ru
  text: чтобы оберегать пути справедливости; и путь верного Ему[a] он хранит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском согласном тексте: «его верного [человека]» (ед. ч.). Традиционное чтение: «его верных» (мн. ч.). Также возможно: «преданного Ему» или «благочестивого».'
    reason: textual_variant
lexical_decisions:
- source_word: לִנְצֹר
  choice: чтобы оберегать
  rationale: Инфинитив выражает цель или результат и синтаксически продолжает предыдущий стих. «Оберегать» естественно сочетается с путями и передаёт защитный оттенок נצר.
- source_word: אָרְחוֹת
  choice: пути
  rationale: Слово обозначает тропы или пути; «пути» звучит естественно и сохраняет образ жизненного движения.
- source_word: מִשְׁפָּט
  choice: справедливости
  rationale: В контексте Притч речь идёт о нравственно справедливом порядке и правом поведении, а не только о судебном решении.
- source_word: וְדֶרֶךְ
  choice: и путь
  rationale: Единственное число и лексическое отличие от предшествующего множественного אָרְחוֹת сохранены.
- source_word: חסידו
  choice: верного Ему
  rationale: Передаёт человека, отличающегося преданностью и благочестием, без архаического или конфессионально окрашенного термина. По представленному тексту форма единственного числа сохранена.
- source_word: יִשְׁמֹר
  choice: он хранит
  rationale: Конечный глагол оставлен личной формой, в отличие от предшествующего инфинитива; перестановка слов делает русскую фразу естественной и подчёркивает объект охраны.
theological_decisions:
- issue: Подразумеваемое подлежащее при יִשְׁמֹר
  choice: Местоимение «он» относится к Господу из контекста Притч 2:6–8, но имя Бога не добавлено.
  alternative: Явно перевести «Господь хранит».
  rationale: Контекст ясно указывает на Господа, однако в самом стихе подлежащее не названо; перевод сохраняет эту неявность.
- issue: Число и смысл חסידו
  choice: 'Единственное число: «верного Ему».'
  alternative: 'Коллективное множественное число: «верных Ему»; также возможно «благочестивого» или «преданного Ему».'
  rationale: Представленный еврейский текст имеет форму единственного числа с суффиксом третьего лица мужского рода. Перевод не подменяет её более привычным множественным чтением, а смысловую широту отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Строчная буква в местоимении «он» избегает внесения отсутствующей в еврейском тексте конфессиональной орфографической нормы. Начальное «чтобы» сохраняет связь стиха с предшествующим контекстом.
