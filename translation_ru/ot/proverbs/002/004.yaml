lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет условное значение частицы и продолжает условную конструкцию наставления.
- source_word: תְּבַקְשֶׁנָּה
  choice: будешь искать её
  rationale: Глагол בקשׁ означает «искать». Местоимение «её» сохраняет женский род древнееврейского суффикса и естественно отсылает к мудрости или рассудительности в предыдущих стихах.
- source_word: כַכָּסֶף
  choice: как серебро
  rationale: Передаёт сравнительную частицу כ и образ ценности, которую усердно ищут.
- source_word: וְכַמַּטְמוֹנִים
  choice: как скрытые сокровища
  rationale: מַטְמוֹנִים обозначает спрятанные ценности или сокровища; формулировка сохраняет как идею ценности, так и их сокрытость.
- source_word: תַּחְפְּשֶׂנָּה
  choice: разыскивать её
  rationale: Глагол חפשׂ выражает тщательный, целенаправленный поиск. «Разыскивать» естественно усиливает первое «искать», сохраняя поэтический параллелизм.
