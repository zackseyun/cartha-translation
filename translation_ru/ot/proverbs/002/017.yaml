translation:
  language: ru
  text: которая оставляет друга своей юности[a] и забывает завет своего Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужа своей юности». Еврейское слово может обозначать близкого друга или спутника; здесь, вероятнее всего, имеется в виду супруг.'
    reason: lexical_alternative
  - marker: b
    text: «Завет своего Бога», вероятно, означает брачный завет, заключённый перед Богом, Который был его свидетелем; вместе с тем это выражение может также отсылать к более широким заветным обязательствам перед Богом.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹזֶבֶת
  choice: которая оставляет
  rationale: Причастие qal женского рода характеризует упомянутую ранее чужую женщину. «Оставляет» естественно передаёт как уход, так и вероломное оставление.
- source_word: אַלּוּף
  choice: спутника
  rationale: Слово обозначает близкого товарища или доверенного спутника; в данном контексте, вероятнее всего, имеется в виду супруг, однако основной текст сохраняет широту еврейского слова.
- source_word: נְעוּרֶיהָ
  choice: своей юности
  rationale: Передаёт устойчивое обозначение близкой связи, возникшей в молодости.
- source_word: בְּרִית
  choice: завет
  rationale: Сохраняет договорный и богословский вес еврейского термина, не сводя его лишь к обещанию или соглашению.
- source_word: אֱלֹהֶיהָ
  choice: своего Бога
  rationale: Возвратное местоимение естественно по-русски соотносит Бога с подлежащим и передаёт суффикс третьего лица женского рода.
- source_word: שָׁכֵחָה
  choice: забывает
  rationale: Хотя в еврейском стоит перфект, в контексте общей характеристики женщины русский настоящий вид естественно передаёт пренебрежение обязательством, а не только случайную забывчивость.
theological_decisions:
- issue: Относится ли בְּרִית אֱלֹהֶיהָ именно к брачному завету или шире к заветным обязательствам перед Богом
  choice: «завет своего Бога» с вероятным указанием на брак, заключённый перед Богом
  alternative: «брачный завет перед Богом» либо более общее «завет с Богом»
  rationale: Параллель со «спутником своей юности» убедительно указывает на брак, но буквальная формулировка шире и допускает отзвук общих заветных обязательств женщины перед Богом.
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет достоинство поэтической речи и синтаксическую зависимость стиха от предшествующего контекста. Термин «завет» сохранён как смыслово и богословски значимый.
