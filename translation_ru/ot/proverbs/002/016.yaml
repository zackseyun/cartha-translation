translation:
  language: ru
  text: чтобы спасти тебя от чужой женщины[a], от чужеземки, чьи речи льстивы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посторонней женщины». В Притчах это выражение нередко относится к женщине, связь с которой находится вне надлежащих брачных или заветных отношений, а не просто к иностранке.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которая сделала свои речи гладкими»; то есть говорит льстиво и обольстительно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: чтобы спасти тебя
  rationale: Инфинитив породы hифиль от נצל с суффиксом 2-го лица мужского рода выражает цель или результат; «спасти» естественно передаёт избавление от опасности в данном контексте.
- source_word: מֵאִשָּׁה זָרָה
  choice: от чужой женщины
  rationale: זָרָה буквально обозначает чужую, постороннюю женщину; в Притчах выражение несёт также нравственный оттенок женщины вне надлежащих брачных отношений. Основной текст сохраняет исходный образ, не сужая его до «прелюбодейки».
- source_word: מִנָּכְרִיָּה
  choice: от незнакомки
  rationale: נָכְרִיָּה указывает на постороннюю, чужую женщину и поэтически параллельно זָרָה. «Незнакомка» сохраняет значение отчуждённости и не сводит его исключительно к этнической принадлежности.
- source_word: אֲמָרֶיהָ
  choice: чьи речи
  rationale: Форма означает «её слова/речения»; «чьи речи» естественно связывает характеристику с женщиной в русском поэтическом параллелизме.
- source_word: הֶחֱלִיקָה
  choice: льстивы
  rationale: Hифиль глагола חלק буквально связан с деланием гладким и метафорически описывает льстивую, обольстительную речь. «Льстивы» ясно передаёт функцию метафоры; буквальный образ отмечен в сноске.
theological_decisions:
- issue: Характер обозначения женщины
  choice: чужая женщина / незнакомка
  alternative: запретная женщина / прелюбодейка
  rationale: Еврейские слова допускают нравственно-реляционный смысл посторонней женщины, но сами по себе не требуют более узкой квалификации «прелюбодейка» и не обязательно указывают лишь на этническую иностранку.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. «Чужая женщина» и «незнакомка» воспринимаются как два параллельных описания одной фигуры; повтор предлога отражает структуру еврейского текста.
