  text: ו/צפן לַ֭/יְשָׁרִים תּוּשִׁיָּ֑ה מָ֝גֵ֗ן לְ/הֹ֣לְכֵי תֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/007.yaml
  text: He stores up sound wisdom for the upright[b][a]; he is a shield to those who walk in integrity.
translation:
  language: ru
  text: Он хранит для праведных здравую мудрость[a]; Он — щит для тех, кто ходит в непорочности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «здравомыслие», «верное суждение», «находчивость» или «успех»; еврейское слово может обозначать действенную мудрость, которая ведёт к благополучию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в честности», «в нравственной цельности» или «в безупречности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָפַן
  choice: хранит
  rationale: Глагол передаёт образ чего-то сбережённого или оставленного в запасе. «Хранит» естественно звучит по-русски и сохраняет этот образ.
- source_word: לַיְשָׁרִים
  choice: для прямодушных
  rationale: Субстантивированное прилагательное обозначает нравственно прямых людей. «Прямодушные» сохраняет образ прямоты и не ограничивает значение одной лишь честностью в речи.
- source_word: תּוּשִׁיָּה
  choice: здравую мудрость
  rationale: Слово может обозначать основательную, действенную мудрость, здравое суждение, находчивость или ведущий к благополучию успех. «Здравая мудрость» передаёт интеллектуальный и практический аспекты в контексте Притч.
- source_word: מָגֵן
  choice: щит
  rationale: Сохранена конкретная метафора защиты, выраженная в еврейском существительном.
- source_word: לְהֹלְכֵי
  choice: для тех, кто ходит
  rationale: Причастная форма описывает постоянный образ жизни; буквальный образ хождения естественен для библейской этической речи и понятен современному читателю.
- source_word: תֹם
  choice: непорочности
  rationale: Слово выражает цельность, нравственную безупречность и честность поведения. «Непорочность» сохраняет широту значения, хотя возможны и менее возвышенные варианты.
theological_decisions:
- issue: Связь двух частей стиха и подразумеваемое подлежащее
  choice: 'Во второй части Господь, названный в предыдущем стихе, также понимается как подлежащее: «Он — щит».'
  alternative: 'Вторую часть можно эллиптически понять так: «щит [сохранён] для тех, кто ходит в непорочности».'
  rationale: Контекст говорит о действиях Господа, а параллелизм естественно представляет Его и как хранящего мудрость, и как щит. При этом именная конструкция оригинала допускает эллиптическое прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Конкретные образы хранения, щита и хождения сохранены; лексическая многозначность ключевых слов отражена в сносках.
