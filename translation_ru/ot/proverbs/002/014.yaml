lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: которые радуются
  rationale: Причастие характеризует людей, упомянутых в предыдущем стихе; придаточная конструкция естественно передаёт эту функцию по-русски.
- source_word: לַעֲשׂוֹת
  choice: делая
  rationale: Инфинитив עשה прямо обозначает совершение действия. Деепричастная конструкция естественно связывает действие со словами «радуются» и не усиливает значение до привычки или преступления.
- source_word: רָע
  choice: зло
  rationale: В контексте Притч слово имеет прежде всего нравственное значение; «зло» сохраняет его яснее, чем более слабое «неправда» или ориентированное на последствия «вред».
- source_word: יָגִילוּ
  choice: ликуют
  rationale: Глагол выражает сильную, торжествующую радость. «Ликуют» передаёт усиление по отношению к שמח и сохраняет поэтический параллелизм.
- source_word: בְּתַהְפֻּכוֹת
  choice: от ... извращений
  rationale: Форма множественного числа обозначает извращённые, перевёрнутые проявления или поступки. «Извращения» сохраняет множественность и нравственную направленность образа, а предлог «от» естественно выражает причину ликования.
- source_word: רָע
  choice: злых
  rationale: Второе употребление רָע определяет нравственный характер «извращений». Согласованное прилагательное даёт компактное и естественное русское соответствие еврейскому сочетанию.
