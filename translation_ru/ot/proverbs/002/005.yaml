source:
  edition: WLC
  text: אָ֗ז תָּ֭בִין יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת אֱלֹהִ֣ים תִּמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/005.yaml
  text: Then you will understand the fear of Yahweh and find the knowledge of God[a].
translation:
  language: ru
  text: Тогда ты постигнешь страх перед Яхве[a] и обретёшь познание Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговение перед Яхве».'
    reason: Лексема יִרְאָה означает страх и в данном контексте включает благоговейное почитание; вариант помогает раскрыть оттенок, не заменяя им основное значение.
lexical_decisions:
- source_word: אָז
  choice: тогда
  rationale: Передаёт временное и логическое следствие условий, изложенных в предыдущих стихах.
- source_word: תָּבִין
  choice: ты поймёшь
  rationale: Естественно передаёт значение Qal imperfect 2-го лица ед. числа от בין — прийти к пониманию, уразуметь.
- source_word: יִרְאַת יְהוָה
  choice: что значит страх перед Яхве
  rationale: Сохраняет содержательное значение יִרְאָה как страха, включающего благоговение, а также прямо передаёт направленность этого отношения к Яхве. Оборот «что значит» делает сочетание с глаголом «поймёшь» естественным по-русски.
- source_word: וְדַעַת אֱלֹהִים
  choice: и … познание Бога
  rationale: «Познание» хорошо передаёт דַּעַת в контексте обретаемого личного знания и сохраняет конструкцию с родительным падежом, не устраняя полностью возможную смысловую широту еврейского сочетания.
- source_word: תִּמְצָא
  choice: обретёшь
  rationale: Передаёт результат настойчивого поиска из стихов 1–4 и звучит естественнее, чем буквальное «найдёшь познание», сохраняя образ достижения искомого.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передано личное имя, прямо стоящее в еврейском тексте, без замены титулом.
- issue: Значение יִרְאָה в выражении יִרְאַת יְהוָה
  choice: страх перед Яхве
  alternative: благоговение перед Яхве
  rationale: Основной текст сохраняет сильное и традиционное значение «страх», не сводя его лишь к почтению; сноска указывает на благоговейный оттенок в контексте литературы мудрости.
- issue: Характер выражения דַּעַת אֱלֹהִים
  choice: познание Бога
  alternative: знание от Бога
  rationale: Естественное чтение понимает Бога как объект познания, однако еврейская конструкция сама по себе допускает более широкое отношение между существительными; русский родительный падеж не вводит дополнительного догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для поэтической литературы мудрости. Обращение оставлено в единственном числе, как в еврейском тексте. Параллелизм двух результатов — понять страх перед Яхве и обрести познание Бога — сохранён.
