  text: For Yahweh gives wisdom[c][b][a]; from his mouth come knowledge and understanding.
translation:
  language: ru
  text: Ибо Яхве даёт мудрость; из его уст исходят знание и понимание.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из его уст — знание и понимание». В оригинале здесь именная конструкция; глагол «исходят» добавлен в русском переводе, чтобы передать образ источника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проницательность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание сказанного ранее. «Ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: יִתֵּן
  choice: даёт
  rationale: Имперфект выражает общую, постоянно действующую истину, характерную для притч, поэтому выбран гномический презенс.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Основное и устойчивое соответствие ключевому понятию книги Притчей.
- source_word: מִפִּיו
  choice: из Его уст исходят
  rationale: Сохранён образ уст как источника Божьей речи; глагол «исходят» добавлен по нормам русского синтаксиса и по смыслу именной еврейской конструкции.
- source_word: דַּעַת
  choice: знание
  rationale: Прямое и естественное соответствие еврейскому слову в контексте литературы мудрости.
- source_word: וּתְבוּנָה
  choice: и понимание
  rationale: «Понимание» доступно современному читателю и передаёт способность постигать и различать; возможный оттенок проницательности отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Источник знания и понимания
  choice: 'Сохранён образ: «из Его уст исходят»'
  alternative: «Он даёт знание и понимание»
  rationale: Более буквальный образ связывает знание и понимание с речью Яхве и не сводит обе части стиха к простому повтору.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ведь» сохраняет связь с предыдущим контекстом, а образ «из Его уст» передан без ослабляющего пересказа.
