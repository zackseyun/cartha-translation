base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/018.yaml
  text: For her house sinks down to death[a], and her paths to the dead.
translation:
  language: ru
  text: 'Ведь её дом склонился к смерти,

    и её пути — к мёртвым[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теням» — поэтическое обозначение умерших.'
    reason: Лексическая альтернатива для רְפָאִים, сохраняющая образный оттенок слова.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную причинную связь с предшествующим предостережением и естественно звучит в русском контексте.
- source_word: שָׁחָה
  choice: склоняется
  rationale: Сохраняет образ наклона и движения вниз, не добавляя отсутствующего в еврейском тексте глагола «ведёт».
- source_word: אֶל מָוֶת
  choice: к смерти
  rationale: Точно передаёт направительное значение предлога אֶל.
- source_word: בֵּיתָהּ
  choice: её дом
  rationale: Сохраняет конкретный образ дома и возможные более широкие ассоциации, не заменяя его толкованием.
- source_word: רְפָאִים
  choice: умершим
  rationale: В поэтическом контексте обозначает обитателей мира мёртвых, а не народ рефаимов; форма «к умершим» естественно сочетается с направительным предлогом.
- source_word: מַעְגְּלֹתֶיהָ
  choice: её пути
  rationale: Передаёт пути или колеи как образ привычного образа жизни и сохраняет параллелизм стиха.
theological_decisions:
- issue: Значение רְפָאִים в поэтической литературе мудрости
  choice: умершим
  alternative: теням умерших
  rationale: Основной текст ясно передаёт указание на умерших, не вводя этническое значение и не навязывая подробную картину загробного мира; более образное значение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Тире во второй строке передаёт эллипсис еврейского текста, где сказуемое подразумевается из первой части.
