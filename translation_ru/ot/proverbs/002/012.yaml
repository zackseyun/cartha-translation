  text: לְ֭/הַצִּ֣ילְ/ךָ מִ/דֶּ֣רֶךְ רָ֑ע מֵ֝/אִ֗ישׁ מְדַבֵּ֥ר תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/012.yaml
  text: to deliver you from the evil way[a], from the man who speaks perverse things,
translation:
  language: ru
  text: чтобы избавить тебя от злого пути, от человека, говорящего превратное[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорящего искажённое».'
    reason: Лексема תַּהְפֻּכוֹת обозначает превратное, искажённое или извращённое содержание речи; вариант сохраняет лексический оттенок без изменения смысла.
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: чтобы уберечь тебя
  rationale: Инфинитив породы hифиль от נצל с суффиксом 2-го лица мужского рода выражает цель в контексте. «Уберечь» естественно передаёт избавление от нравственной опасности, не привнося узкого богословского оттенка.
- source_word: מִדֶּרֶךְ רָע
  choice: от злого пути
  rationale: דֶּרֶךְ сохраняет характерный для Притч образ пути как образа образа жизни, а רָע определяет его как нравственно злой.
- source_word: מֵאִישׁ
  choice: от человека
  rationale: אִישׁ здесь обозначает отдельного мужчину как типичного носителя описываемого поведения. Русское «человек» грамматически мужского рода, естественно в данном обобщении и не меняет референта на множественный или явно бесполый.
- source_word: מְדַבֵּר תַּהְפֻּכוֹת
  choice: говорящего превратное
  rationale: Причастие מְדַבֵּר обозначает характерную речь, а множественное абстрактное תַּהְפֻּכוֹת — искажённое, извращённое содержание. Субстантивированное «превратное» сохраняет некоторую обобщённость и лаконичность еврейского выражения.
theological_decisions:
- issue: Передача мужского единственного אִישׁ
  choice: от человека
  alternative: от мужчины
  rationale: В современном русском «человек» в единственном числе и мужском грамматическом оформлении естественно обозначает представителя данного типа. «Мужчина» неоправданно выдвигало бы на первый план пол, тогда как контекст характеризует говорящего по его речи.
- issue: Нравственный образ пути
  choice: злой путь
  alternative: путь зла
  rationale: Оба варианта возможны, но конструкция допускает понимание רָע как определения к «пути». «Злой путь» сохраняет персонифицированно-нравственную напряжённость языка Притч и звучит естественно.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической мудрой речи. Начальное «чтобы» сохраняет синтаксическую зависимость стиха от предшествующего контекста; строчная буква и завершающая запятая отражают его положение внутри продолжающегося предложения.
