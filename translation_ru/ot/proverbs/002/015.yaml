lexical_decisions:
- source_word: אֲשֶׁר
  choice: тех, чьи
  rationale: Относительное слово продолжает характеристику людей из предыдущего стиха; по-русски оборот «тех, чьи» естественно вводит придаточную характеристику и передаёт притяжательное отношение.
- source_word: אָרְחֹתֵיהֶם
  choice: пути
  rationale: Сохраняет конкретный образ дороги и одновременно его нравственный смысл.
- source_word: עִקְּשִׁים
  choice: кривы
  rationale: Передаёт как буквальную искривлённость пути, так и нравственную порочность, не устраняя образную двусмысленность.
- source_word: וּנְלוֹזִים
  choice: уклоняется
  rationale: Причастие от корня со значением отклонения или отступления передано глаголом, естественным в современном русском и сохраняющим идею ухода с прямого пути.
- source_word: בְּמַעְגְּלוֹתָם
  choice: на своих стезях
  rationale: «Стези» сохраняют поэтический параллелизм с «путями» и обозначают образ жизни или направление движения; умеренно возвышенная лексема уместна для литературы мудрости.
