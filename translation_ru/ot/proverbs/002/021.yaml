  text: כִּֽי יְשָׁרִ֥ים יִשְׁכְּנוּ אָ֑רֶץ וּ֝/תְמִימִ֗ים יִוָּ֥תְרוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/021.yaml
  text: For the upright will dwell in the land[a], and the blameless will remain in it.
translation:
  language: ru
  text: Ведь честные будут жить на земле[a], и безупречные останутся на ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране». Еврейское слово может означать как землю вообще, так и определённую землю или страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит обоснование сказанного прежде; «ведь» естественно передаёт пояснительную логическую связь.
- source_word: יְשָׁרִים
  choice: прямодушные
  rationale: Слово обозначает нравственно прямых людей. «Прямодушные» сохраняет этот образ и не отождествляет термин с более узким обозначением «праведные».
- source_word: יִשְׁכְּנוּ
  choice: будут жить
  rationale: Глагол выражает устойчивое проживание или обитание; «будут жить» ясно и естественно звучит в современном русском языке.
- source_word: אָרֶץ
  choice: земле
  rationale: Еврейское слово может означать как конкретную землю, так и землю вообще. Русское «земля» сохраняет часть этой смысловой широты, тогда как контекст подчёркивает место проживания.
- source_word: וּתְמִימִים
  choice: и непорочные
  rationale: Прилагательное описывает людей цельных, безупречных в нравственном отношении; «непорочные» хорошо передаёт этический смысл и образует естественный параллелизм с «прямодушными».
- source_word: יִוָּתְרוּ
  choice: останутся
  rationale: Форма глагола יתר означает «быть оставленным, уцелеть, остаться». В данном контексте «останутся» естественно выражает продолжение пребывания на земле.
- source_word: בָהּ
  choice: на ней
  rationale: Местоименный суффикс отсылает к земле; сочетание «на ней» сохраняет эту связь и соответствует русскому управлению.
theological_decisions:
- issue: Объём значения אָרֶץ
  choice: земля как место проживания, без сужения до определённой территории
  alternative: страна; вся земля
  rationale: Контраст со следующим стихом, где нечестивые будут удалены оттуда, поддерживает конкретный смысл места проживания. При этом перевод «земля» не навязывает узкой территориальной трактовки и сохраняет возможный более широкий смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном, подходящим для литературы мудрости. Параллелизм двух строк сохранён; выражения понятны без специальной богословской подготовки.
