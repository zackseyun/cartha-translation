  text: הַ֭/עֹ֣זְבִים אָרְח֣וֹת יֹ֑שֶׁר לָ֝/לֶ֗כֶת בְּ/דַרְכֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/013.yaml
  text: who abandon the paths of uprightness to walk in the ways of darkness,[a]
translation:
  language: ru
  text: которые оставляют прямые пути, чтобы ходить путями тьмы,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹזְבִים
  choice: которые оставляют
  rationale: Субстантивированное причастие описывает людей, о которых говорится в предыдущем стихе; «оставляют» естественно передаёт сознательный отход, не усиливая значение до явно эмоционального «покидают» или «отрекаются».
- source_word: אָרְחוֹת
  choice: стези
  rationale: Сохраняет метафору жизненного пути и позволяет избежать полного лексического повтора с последующим דַרְכֵי; слово литературное, но понятное в библейском контексте.
- source_word: יֹשֶׁר
  choice: правоты
  rationale: Передаёт нравственную прямоту и правильность, одновременно поддерживая образ прямого пути. В данном сочетании звучит естественнее, чем абстрактная «прямота».
- source_word: לָלֶכֶת
  choice: чтобы ходить
  rationale: Сохраняет целевую конструкцию с לְ и библейскую метафору образа жизни; «ходить» указывает не на единичное движение, а на постоянное поведение.
- source_word: בְּדַרְכֵי
  choice: путями
  rationale: Русский творительный падеж естественно передаёт движение по определённым путям и сохраняет параллелизм двух дорожных образов.
- source_word: חֹשֶׁךְ
  choice: тьмы
  rationale: Сохраняет образ, допускающий одновременно нравственный и жизненный смысл, без истолковывающей замены на «зло» или «нечестие».
theological_decisions:
- issue: Нравственная метафора тьмы
  choice: Сохранено буквальное «тьмы» без пояснения в основном тексте.
  alternative: «зла» или «нечестия»
  rationale: В контексте Притч тьма имеет нравственный оттенок, однако еврейский текст выражает его метафорически. Прямая замена на «зло» устранила бы образ и сузила смысл.
- issue: Смысл יֹשֶׁר в образе пути
  choice: «правоты»
  alternative: «прямоты» или «того, что правильно»
  rationale: «Правота» сохраняет нравственное содержание и отзвук прямизны пути, не сводя выражение ни к геометрической прямоте, ни к пояснительному пересказу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Стези» выбрано ради ясного параллелизма и различения אָרְחוֹת и דַרְכֵי; остальные слова общеупотребительны. Строчная буква и конечная запятая отражают синтаксическую зависимость стиха от предыдущего контекста.
