lexical_decisions:
- source_word: כִּי אִם
  choice: да, если
  rationale: Сочетание продолжает условную конструкцию предыдущих стихов и одновременно усиливает призыв; «да, если» передаёт обе функции.
- source_word: בִּינָה
  choice: понимание
  rationale: Слово обозначает способность понимать и постигать; общеупотребительное «понимание» естественно звучит в современном русском языке.
- source_word: תִקְרָא
  choice: будешь взывать
  rationale: Здесь קרא означает настойчивое обращение вслух, а не называние; «взывать» сохраняет силу призыва и возвышенный характер поэзии.
- source_word: תְּבוּנָה
  choice: проницательность
  rationale: Этот близкий синоним בִּינָה связан со способностью различать и верно судить; «проницательность» сохраняет смысловое различие между параллельными терминами.
- source_word: תִּתֵּן קוֹלֶךָ
  choice: громко просить
  rationale: Буквально «дать свой голос» — еврейская идиома настойчивого обращения вслух. Русское «громко просить» естественно передаёт и голос, и направленность обращения, не создавая неясного оборота «подать голос проницательности».
