  text: making your ear attentive to wisdom[a], inclining your heart to understanding,
translation:
  language: ru
  text: обращая ухо к мудрости, склоняя сердце к разумению[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к проницательности».'
    reason: Лексема תְּבוּנָה допускает значения понимания, рассудительности и способности различать; вариант отмечает эту смысловую грань, не подменяя основной перевод.
lexical_decisions:
- source_word: לְהַקְשִׁיב
  choice: обращая ухо
  rationale: Инфинитив породы хифиль выражает намеренное приведение слуха во внимательное состояние. Оборот «обращая ухо» сохраняет образ еврейского текста и зависимость стиха от предыдущего условия, оставаясь понятным по-русски.
- source_word: לַחָכְמָה
  choice: к мудрости
  rationale: Предлог ל обозначает направленность внимания; «к мудрости» естественно передаёт объект, к которому обращён слух.
- source_word: אָזְנֶךָ
  choice: ухо
  rationale: Сохранено единственное число и конкретный образ слухового внимания; притяжательность по-русски ясна из контекста обращения и не требует повторения местоимения.
- source_word: תַּטֶּה
  choice: склоняя
  rationale: Глагол נטה означает «наклонять, направлять, обращать». «Склоняя» сохраняет образ намеренного внутреннего устремления и параллелизм двух частей.
- source_word: לִבְּךָ
  choice: сердце
  rationale: «Сердце» сохраняет широкое древнееврейское представление о внутреннем человеке, включая разум, волю и желания; перевод «ум» неоправданно сузил бы смысл.
- source_word: לַתְּבוּנָה
  choice: к разумению
  rationale: תְּבוּנָה обозначает понимание, рассудительность или проницательность. «Разумение» естественно сочетается здесь с «мудростью» и сохраняет традиционный, но понятный возвышенный регистр.
