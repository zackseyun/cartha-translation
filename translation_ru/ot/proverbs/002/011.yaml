  text: מְ֭זִמָּה תִּשְׁמֹ֥ר עָלֶ֗י/ךָ תְּבוּנָ֥ה תִנְצְרֶֽ/כָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/011.yaml
  text: Discretion will watch over you[a]; understanding will guard you.
translation:
  language: ru
  text: Рассудительность[a] будет оберегать тебя, разумение — хранить тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоразумие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזִמָּה
  choice: рассудительность
  rationale: В положительном контексте Притч слово обозначает способность обдумывать поступки и принимать благоразумные решения; «рассудительность» естественно передаёт этот смысл, не привнося отрицательного оттенка «замысла» или «козней».
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: будет оберегать тебя
  rationale: Сочетание שׁמר с עַל выражает направленную на человека защиту и присмотр. «Оберегать тебя» естественно передаёт этот смысл по-русски.
- source_word: תְּבוּנָה
  choice: разумение
  rationale: Это характерный для литературы мудрости термин, обозначающий способность понимать и верно различать; «разумение» сохраняет возвышенный, но понятный библейский регистр.
- source_word: תִנְצְרֶכָּה
  choice: хранить тебя
  rationale: Глагол נצר означает хранить, охранять или сберегать. «Хранить» сохраняет защитный смысл и поэтический параллелизм, не повторяя глагол первой строки.
theological_decisions: []
