source:
  edition: WLC
  text: לְמַ֗עַן תֵּ֭לֵךְ בְּ/דֶ֣רֶךְ טוֹבִ֑ים וְ/אָרְח֖וֹת צַדִּיקִ֣ים תִּשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/020.yaml
  text: so that you may walk in the way of the good and keep to the paths of the righteous[a][b].
translation:
  language: ru
  text: чтобы ты шёл путём добрых[a] и держался стезей праведников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «добрых людей». В еврейском тексте прилагательное мужского рода во множественном числе употреблено как существительное и обозначает группу людей.
    reason: lexical_alternative
  - marker: b
    text: Или «хранил стези праведников». Еврейский глагол может означать «хранить», «стеречь» или «соблюдать»; здесь, вероятно, имеется в виду не сходить с этих стезей и следовать им.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результативное значение оборота и естественно связывает стих с предшествующим наставлением.
- source_word: תֵּלֵךְ
  choice: ты шёл
  rationale: Имперфект 2-го лица мужского рода единственного числа после לְמַעַן выражает предполагаемый результат или цель; русское прошедшее несовершенного вида в конструкции с «чтобы» естественно передаёт это значение.
- source_word: בְּדֶרֶךְ
  choice: путём
  rationale: Сохраняет образ дороги как образа жизненного поведения и естественно сочетается с глаголом «идти».
- source_word: טוֹבִים
  choice: добрых
  rationale: Прилагательное мужского рода во множественном числе употреблено субстантивированно и обозначает добрых людей как нравственную группу; русское «добрых» сохраняет эту краткость.
- source_word: וְאָרְחוֹת
  choice: и ... стезей
  rationale: «Стези» сохраняют поэтический параллелизм с «путём» и обозначают жизненные пути, не сливая два разных еврейских слова в одно.
- source_word: צַדִּיקִים
  choice: праведников
  rationale: Передаёт субстантивированное множественное число и обычное для литературы мудрости обозначение нравственно правых людей.
- source_word: תִּשְׁמֹר
  choice: держался
  rationale: В сочетании со «стезями» глагол שׁמר здесь естественно понимается как следование им и неуклонное пребывание на них; «держался» передаёт это значение по-русски, сохраняя возможность буквального оттенка «хранить» в примечании.
