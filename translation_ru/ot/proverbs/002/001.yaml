id: PRO.2.1
reference: Proverbs 2:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ֭נִ/י אִם תִּקַּ֣ח אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/001.yaml
  text: My son[a], if you receive my words and store up my commandments with you[b],
translation:
  language: ru
  text: Сын мой[a], если ты примешь мои слова и сохранишь у себя[b] мои заповеди,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дитя моё». В еврейском тексте буквально «сын мой» — обычная форма отцовского наставления в книге Притчей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сбережёшь при себе», «будешь бережно хранить». Еврейский глагол выражает мысль о тщательном хранении чего-либо в безопасном месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Обращение в мужском роде, единственном числе, характерное для отцовского наставления в Притчах; сохраняет грамматическую и литературную форму еврейского текста.
- source_word: אִם
  choice: если
  rationale: Передаёт прямое условное значение частицы и сохраняет открытый характер условия.
- source_word: תִּקַּח
  choice: примешь
  rationale: В сочетании со «словами» глагол означает не просто физически «взять», а воспринять и принять наставление.
- source_word: אֲמָרָי
  choice: мои слова
  rationale: Естественно и достаточно широко передаёт слова или изречения наставника, не сужая жанровый оттенок.
- source_word: וּמִצְוֺתַי
  choice: мои заповеди
  rationale: Сохраняет нравственно-наставительный вес מִצְוָה и привычную библейскую лексику, не отождествляя эти наставления исключительно с законодательными предписаниями.
- source_word: תִּצְפֹּן
  choice: сохранишь
  rationale: Передаёт намеренное бережное удержание для дальнейшего пользования; более естественно по-русски в данной конструкции, чем буквальное «спрячешь».
- source_word: אִתָּךְ
  choice: у себя
  rationale: Естественный русский эквивалент образа хранения «с собой / при себе», то есть в собственной сохранности и распоряжении.
theological_decisions:
- issue: Гендерно маркированное обращение в литературе мудрости
  choice: Сын мой
  alternative: Дитя моё
  rationale: Еврейский текст использует мужской род и единственное число в форме отцовского наставления. Основной текст сохраняет эту форму, а более обобщённая возможность отмечена в сноске без устранения её литературной специфики.
translation_notes:
  register: Современный литературный русский язык с традиционно-библейским, но понятным обращением «Сын мой». Порядок дополнений слегка перестроен ради естественной русской фразы; условная конструкция и незавершённость стиха, продолжающегося далее, сохранены.
