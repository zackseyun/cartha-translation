source:
  edition: WLC
  text: כִּֽי תָב֣וֹא חָכְמָ֣ה בְ/לִבֶּ֑/ךָ וְ֝/דַ֗עַת לְֽ/נַפְשְׁ/ךָ֥ יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/010.yaml
  text: For wisdom will enter your heart[b][a], and knowledge will be pleasant to your soul.
translation:
  language: ru
  text: Ибо[a] мудрость войдёт в твоё сердце, и знание будет приятно твоей душе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда мудрость войдёт в твоё сердце…»'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может также означать самого человека, его внутреннее «я» или жизнь.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание или пояснение к предшествующему наставлению; «ибо» сохраняет эту логическую связь. Вместе с тем возможно временное значение «когда», отмеченное в сноске.
- source_word: תָבוֹא
  choice: войдёт
  rationale: Глагол בוא с בְּ и словом «сердце» естественно передаётся как «войти»; будущее время соответствует контексту обещания-наставления.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Устойчивый русский эквивалент ключевого для Притчей понятия, сохраняющий его нравственно-познавательный объём.
- source_word: בְלִבֶּךָ
  choice: в твоё сердце
  rationale: «Сердце» сохраняет еврейский образ внутреннего человека, включая мышление и волю, не сводя его только к разуму или чувствам.
- source_word: וְדַעַת
  choice: и знание
  rationale: «Знание» сохраняет отличие דַּעַת от других слов, обозначающих понимание и проницательность.
- source_word: לְנַפְשְׁךָ
  choice: твоей душе
  rationale: «Душе» сохраняет поэтическую параллель с «сердцем» и широкий антропологический образ נֶפֶשׁ; возможные контекстуальные значения пояснены в сноске.
- source_word: יִנְעָם
  choice: будет приятно
  rationale: Передаёт предикативное значение глагола נעם — быть приятным, отрадным или сладостным — без усиления до более толковательного «будет услаждать».
theological_decisions:
- issue: Антропологические образы לֵב и נֶפֶשׁ
  choice: Сохранить в основном тексте «сердце» и «душа».
  alternative: «разум» и «внутренний человек» либо «ум» и «жизнь»
  rationale: Еврейские слова обозначают внутреннего человека в широком смысле. Традиционные образы сохраняют поэтическую и богословскую многозначность текста, не навязывая позднейшего строгого разделения человеческой природы.
- issue: Значение כִּי
  choice: Перевести как пояснительное «ибо».
  alternative: Временное «когда».
  rationale: Контекст допускает как обоснование предшествующего высказывания, так и временно-условное прочтение. Основной текст отражает логическую связь, а сноска сохраняет реальную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формулировка сохраняет параллелизм «сердце — душа» и остаётся понятной без конфессионально обусловленной терминологии.
