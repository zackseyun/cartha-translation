  yaml_path: translation/ot/proverbs/002/019.yaml
  text: All who go in to her do not return, nor do they regain the paths of life.
translation:
  language: ru
  text: Все, кто входит к ней, не возвращаются и не достигают путей жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֶיהָ
  choice: кто входит к ней
  rationale: Сохраняет конкретный образ вхождения к женщине и его контекстуальный сексуальный оттенок, не делая перевод более явным, чем еврейский текст.
- source_word: לֹא יְשׁוּבוּן
  choice: не возвращаются
  rationale: Прямо передаёт глагол שׁוב и категоричность мудростного предостережения.
- source_word: לֹא יַשִּׂיגוּ
  choice: не обретают вновь
  rationale: В данном параллелизме глагол означает достижение или обретение путей жизни; «вновь» естественно выражает мысль о возвращении к ним, отражённую и в контексте первой строки.
- source_word: אָרְחוֹת חַיִּים
  choice: путей жизни
  rationale: Сохраняет устойчивую для литературы мудрости метафору образа жизни, ведущего к жизни.
theological_decisions:
- issue: Абсолютная форма предостережения о невозвращении
  choice: 'Сохранена без смягчения: «не возвращаются»'
  alternative: «редко возвращаются» или «могут не вернуться»
  rationale: Еврейский текст формулирует категорическое мудростное изречение; перевод не должен превращать его в статистическое или условное утверждение.
- issue: Значение יַשִּׂיגוּ во второй строке
  choice: «не обретают вновь»
  alternative: «не достигают»
  rationale: Форма допускает значение достижения, однако параллель с «не возвращаются» и контекст утраченных путей жизни поддерживают оттенок повторного обретения, не устраняя основной смысл достижения.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным звучанием мудростного изречения. Синтаксический параллелизм оригинала сохранён; неоправданная экспликация сексуального или сотериологического смысла не добавлена.
