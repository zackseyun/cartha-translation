lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временно-следственную связь с предшествующим условным наставлением.
- source_word: תָּבִין
  choice: ты поймёшь
  rationale: 'Естественно передаёт значение Qal imperfect глагола בין: прийти к пониманию, научиться различать.'
- source_word: צֶדֶק
  choice: праведность
  rationale: Сохраняет нравственный вес понятия и отличает его от следующего מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: Передаёт идею справедливого суда и должного порядка, не сливаясь с צֶדֶק.
- source_word: מֵישָׁרִים
  choice: справедливость
  rationale: Естественно выражает нравственную прямоту и беспристрастность; буквальный образ прямизны отмечен в сноске.
- source_word: כָּל מַעְגַּל טוֹב
  choice: всякий добрый путь
  rationale: Сохраняет распределительное значение כָּל, метафору жизненного пути и широкое значение טוֹב.
theological_decisions:
- issue: Связь заключительной фразы כָּל מַעְגַּל טוֹב с предшествующей триадой
  choice: 'Передать как поясняющее обобщение после тире: «— всякий добрый путь»'
  alternative: 'Считать дополнительным однородным дополнением: «и всякий добрый путь»'
  rationale: В еврейском тексте перед כָּל нет союза; пояснительное присоединение сохраняет синтаксическую неоднозначность и показывает, что заключительная фраза обобщает перечисленное, не превращая её явно в новый член ряда.
translation_notes:
  register: Современный литературный русский язык; обращение во втором лице единственного числа соответствует контексту наставления. Формула «что такое» делает ряд абстрактных существительных естественным по-русски, а тире ясно присоединяет итоговое обобщение.
