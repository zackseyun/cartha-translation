source:
  edition: WLC
  text: וְ/שֹׁמֵ֣עַֽ לִ֭/י יִשְׁכָּן בֶּ֑טַח וְ֝/שַׁאֲנַ֗ן מִ/פַּ֥חַד רָעָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/033.yaml
  text: But whoever listens to me will dwell securely and be at ease[a], without fear of disaster.
translation:
  language: ru
  text: Но кто слушает меня, тот будет жить в безопасности и покое, не страшась беды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но слушающий меня будет жить безопасно и безмятежно, не боясь бедствия».'
    reason: 'Лексические варианты: שַׁאֲנַן допускает передачу «безмятежно», а רָעָה — «бедствие».'
lexical_decisions:
- source_word: וְשֹׁמֵעַ לִי
  choice: Но кто слушает меня
  rationale: Причастие שֹׁמֵעַ выражает постоянное, деятельное внимание, а не просто слуховое восприятие; לִי обозначает того, к кому прислушиваются. Союз וְ передан как «но», поскольку стих противопоставляет участь слушающего Мудрость участи отвергающих её в предыдущем контексте.
- source_word: יִשְׁכָּן
  choice: будет жить
  rationale: Глагол означает «обитать, жить, поселяться». Современное русское «будет жить» естественно передаёт устойчивое пребывание, не внося архаического оттенка.
- source_word: בֶּטַח
  choice: в безопасности
  rationale: Слово обозначает безопасность, защищённость и уверенность. Оборот «жить в безопасности» естественен в современном русском языке.
- source_word: וְשַׁאֲנַן
  choice: и покое
  rationale: Форма от שׁאנ здесь выражает безмятежность и отсутствие тревоги. Сочетание «в безопасности и покое» передаёт положительный смысл, не привнося отрицательной идеи беспечности или самодовольства.
- source_word: מִפַּחַד
  choice: не страшась
  rationale: Предлог מִן указывает на свободу или удалённость от страха. Деепричастный оборот естественно выражает отсутствие боязни.
- source_word: רָעָה
  choice: беды
  rationale: В данном контексте רָעָה означает грозящее несчастье или бедствие, а не нравственное зло. «Беда» сохраняет широту и звучит естественно в поэтическом изречении.
theological_decisions:
- issue: Родовое значение причастного субъекта
  choice: кто слушает
  alternative: слушающий; тот, кто слушает
  rationale: Хотя еврейское причастие стоит в мужском роде единственного числа, оно имеет обобщающее значение. Русское «кто» ясно охватывает любого человека и не ограничивает обещание мужчинами.
- issue: Олицетворённая Мудрость как говорящая
  choice: 'сохранить речь от первого лица: «меня»'
  alternative: «Мудрость»; «меня, Мудрость»
  rationale: Стих продолжает прямую речь олицетворённой Мудрости. Поясняющее имя не добавлено, чтобы не расширять исходный текст толкованием.
- issue: Характер обещанной безопасности
  choice: передать как жизнь в безопасности и покое без страха перед бедой
  alternative: понимать как безусловную гарантию отсутствия всякого несчастья
  rationale: Текст обещает безопасность и свободу от ужаса, но не разъясняет пределы или механизм этого обещания. Перевод сохраняет афористическую напряжённость и не превращает изречение в развернутое доктринальное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксис простой и звучный; устранены ненужные архаизмы. Маркер сноски помещён в основном тексте.
