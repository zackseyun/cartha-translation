source:
  edition: WLC
  text: לָ/תֵ֣ת לִ/פְתָאיִ֣ם עָרְמָ֑ה לְ֝/נַ֗עַר דַּ֣עַת וּ/מְזִמָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/004.yaml
  text: to give prudence to the simple[a], knowledge and discretion to the young man.
translation:
  language: ru
  text: чтобы дать неопытным благоразумие, юноше[a] — знание и осмотрительность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодому человеку». Еврейское слово стоит в мужском роде и единственном числе («юноше»), но в наставлении мудрости может употребляться как обозначение молодого человека вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָתֵת
  choice: чтобы дать
  rationale: Инфинитив с ל продолжает указание цели из предыдущего стиха; конструкция «чтобы дать» естественно передаёт эту связь по-русски.
- source_word: לִפְתָאיִם
  choice: неопытным
  rationale: פְּתָאִים — люди неискушённые, доверчивые и легко поддающиеся влиянию, а не умственно ограниченные; «неопытным» ясно и без уничижительного оттенка передаёт смысл.
- source_word: עָרְמָה
  choice: благоразумие
  rationale: В данном контексте слово обозначает положительное практическое качество — разумную осторожность и умение не быть легковерным, хотя в иных контекстах может означать хитрость.
- source_word: לְנַעַר
  choice: юноше
  rationale: נַעַר стоит в мужском роде, единственном числе и обозначает мальчика, юношу или молодого мужчину; «юноше» сохраняет форму и соответствует жанру наставления.
- source_word: דַּעַת
  choice: знание
  rationale: דַּעַת прямо обозначает знание и сохраняет характерную для книги Притч лексику мудрости.
- source_word: וּמְזִמָּה
  choice: и осмотрительность
  rationale: מְזִמָּה здесь имеет положительный смысл обдуманности, способности строить разумные планы и судить о последствиях; «осмотрительность» естественно передаёт этот оттенок и не смешивается с עָרְמָה.
theological_decisions:
- issue: Мужской род и единственное число в наставлении мудрости
  choice: юноше
  alternative: молодому человеку; молодёжи
  rationale: Основной текст сохраняет мужской род и единственное число еврейского נַעַר, не исключая возможности его представительного употребления в наставлении мудрости.
translation_notes:
  register: Современный литературный русский язык; параллелизм подчёркнут тире во второй части. Устаревшее «простодушным» не использовано, поскольку оно может звучать как похвала невинности, тогда как речь идёт о неопытности и подверженности чужому влиянию.
