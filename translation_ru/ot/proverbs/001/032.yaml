id: PRO.1.32
reference: Proverbs 1:32
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י מְשׁוּבַ֣ת פְּתָיִ֣ם תַּֽהַרְגֵ֑/ם וְ/שַׁלְוַ֖ת כְּסִילִ֣ים תְּאַבְּדֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/032.yaml
  text: For the turning away of the simple will kill them[a], and the complacency of fools will destroy them.
translation:
  language: ru
  text: Ведь отступление неопытных убьёт их[a], и беспечность глупцов погубит их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потому что своенравие неопытных убьёт их, а спокойное благополучие глупцов погубит их».'
    reason: Еврейские слова מְשׁוּבָה и שַׁלְוָה допускают соответственно оттенки своенравного уклонения и спокойствия, безопасности или благополучия.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующим предостережением естественным для современного русского языка способом.
- source_word: מְשׁוּבַת
  choice: отступление
  rationale: Сохраняет смысл поворота прочь, уклонения от мудрости, не придавая слову узкоконфессионального оттенка.
- source_word: פְּתָיִם
  choice: неопытных
  rationale: В Притчах обозначает людей неискушённых, доверчивых и ещё не сформированных нравственно; вариант не сводит понятие к недостатку ума.
- source_word: תַּהַרְגֵם
  choice: убьёт их
  rationale: Прямо и выразительно передаёт сильный глагол הרג и сохраняет суровость последствия.
- source_word: וְשַׁלְוַת
  choice: и беспечность
  rationale: В данном контексте спокойствие и чувство безопасности имеют опасный оттенок самодовольной беззаботности; «беспечность» естественно выражает этот смысл по-русски.
- source_word: כְּסִילִים
  choice: глупцов
  rationale: Устоявшееся обозначение в литературе мудрости людей нравственно упрямых и невосприимчивых, а не просто интеллектуально слабых.
- source_word: תְּאַבְּדֵם
  choice: погубит их
  rationale: Передаёт каузативную силу формы от אבד и образует естественный русский параллелизм с «убьёт их».
theological_decisions:
- issue: Характер вины неопытных
  choice: «отступление» сохраняет образ отхода от призыва мудрости
  alternative: «своенравие» или «непослушание»
  rationale: Текст говорит об уклонении, но не уточняет здесь его как формальную религиозную апостасию; перевод не должен сужать смысл.
translation_notes:
  register: Современный литературный русский язык; краткий, афористичный строй и параллелизм оригинала сохранены. «Беспечность» выбрана как естественное контекстуальное выражение опасного спокойствия, а более буквальная смысловая возможность вынесена в примечание.
