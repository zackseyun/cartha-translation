base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/023.yaml
  text: Turn at my rebuke[a]; behold, I will pour out my spirit to you[b]; I will make my words known to you.
translation:
  language: ru
  text: Откликнитесь на моё обличение[a]. Вот, я изолью на вас мой дух[b], открою вам мои слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вернитесь к моему наставлению»; возможно также: «Обратитесь к моему обличению».'
    reason: lexical_alternative
  - marker: b
    text: «Мой дух» можно также понять как «моё внутреннее расположение» или «мои мысли». Некоторые усматривают здесь более широкое созвучие с темой Божьего Духа, однако непосредственно в этом стихе говорит персонифицированная Мудрость.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשׁוּבוּ
  choice: Обратитесь
  rationale: Форма от שוב призывает изменить направление в ответ на обличение. «Обратитесь» сохраняет образ поворота и нравственный призыв, не усиливая его до более узкого богословского термина «покайтесь».
- source_word: לְתוֹכַחְתִּי
  choice: к моему обличению
  rationale: 'תּוֹכַחַת означает обличение, укор или исправление; предлог ל при שוב допускает направительный смысл: обратиться к обличению, то есть принять его и откликнуться на него.'
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к следующему обещанию; «вот» естественно сохраняет эту функцию в современном литературном русском.
- source_word: אַבִּיעָה
  choice: я изолью
  rationale: Глагол נבע передаёт образ бурного истечения или излияния. В сочетании с רוּחִי «изолью» сохраняет метафору обильного раскрытия внутреннего содержания.
- source_word: רוּחִי
  choice: мой дух
  rationale: רוּחַ может обозначать дух, дыхание или внутреннее расположение. «Мой дух» сохраняет многозначность и образ речи персонифицированной Мудрости; строчная буква не отождествляет выражение прямо со Святым Духом.
- source_word: אוֹדִיעָה
  choice: возвещу
  rationale: Каузатив от ידע буквально означает «дам узнать, сделаю известным». «Возвещу» естественно передаёт открытое сообщение слов, не добавляя значения систематического обучения.
- source_word: דְבָרַי
  choice: мои слова
  rationale: דָּבָר здесь обозначает слова или изречения Мудрости; прямой эквивалент сохраняет словесный и наставительный характер речи.
- source_word: לָכֶם ... אֶתְכֶם
  choice: на вас ... вам
  rationale: 'Разные еврейские конструкции отражены естественными русскими сочетаниями: дух изливается «на вас», а слова возвещаются «вам».'
theological_decisions:
- issue: Значение выражения «мой дух» в речи Мудрости
  choice: «мой дух» со строчной буквы — дух, внутреннее расположение или мысль персонифицированной Мудрости
  alternative: Предвосхищение или образ Духа Божьего, Святого Духа
  rationale: В ближайшем литературном контексте говорит персонифицированная Мудрость, а еврейский текст прямо не называет Духа Божьего. Строчная буква сохраняет непосредственный смысл и одновременно не исключает более широких канонических созвучий.
translation_notes:
  register: Современный литературный русский с достоинством мудростной речи. «Вот» сохраняет усилительное указание без архаичного «се»; синтаксис краток и ритмичен. Местоимение «мой» перед «дух» сохранено для верности оригиналу и намеренно написано со строчной буквы.
