  text: וַ/תִּפְרְע֥וּ כָל עֲצָתִ֑/י וְ֝/תוֹכַחְתִּ֗/י לֹ֣א אֲבִיתֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/025.yaml
  text: but you ignored all my counsel[b][a], and you were unwilling to accept my reproof—
translation:
  language: ru
  text: 'но вы пренебрегли всеми моими советами[a]

    и не захотели принять моё обличение[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставили без внимания все мои советы»; или: «отвергли все мои советы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отказались от моего обличения». Буквально еврейский текст подчёркивает нежелание: «не пожелали моего обличения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְרְעוּ
  choice: вы пренебрегли
  rationale: Глагол פרע здесь передаёт сознательное оставление без внимания, а не насильственное действие. «Пренебрегли» выражает намеренное небрежение и естественно сочетается с «советами».
- source_word: כָל עֲצָתִי
  choice: всеми моими советами
  rationale: Еврейское выражение буквально имеет собирательное единственное число «весь мой совет», но в современном русском множественное число звучит естественнее и сохраняет смысл всей совокупности наставлений.
- source_word: וְתוֹכַחְתִּי
  choice: моё обличение
  rationale: תּוֹכַחַת обозначает исправляющее порицание. «Обличение» сохраняет характерный для литературы мудрости возвышенный, но понятный регистр и не ослабляет исправительного оттенка.
- source_word: לֹא אֲבִיתֶם
  choice: не захотели принять
  rationale: אָבָה с отрицанием подчёркивает отсутствие желания или согласия. Добавленное по смыслу «принять» делает связь с «обличением» естественной по-русски, сохраняя волевой оттенок исходного выражения.
