id: PRO.1.10
reference: Proverbs 1:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּנִ֡/י אִם יְפַתּ֥וּ/ךָ חַ֝טָּאִ֗ים אַל תֹּבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/010.yaml
  text: My son[a], if sinners entice you[b], do not consent.
translation:
  language: ru
  text: Сын мой[a], если грешники будут склонять тебя, не соглашайся[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сын мой» сохраняет мужской род и единственное число еврейского обращения; это отцовский призыв наставника мудрости.
    reason: cultural_note
  - marker: b
    text: 'Или: «не уступай» / «не изъявляй желания». Еврейский глагол означает «быть согласным, желать, соглашаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Сохраняет мужской род и единственное число еврейского обращения, а также естественное для русской библейской речи отцовское наставление.
- source_word: אִם
  choice: если
  rationale: Прямо передаёт условную частицу, вводящую предполагаемую ситуацию.
- source_word: יְפַתּוּךָ
  choice: будут склонять тебя
  rationale: Форма породы пиэль от פתה обозначает настойчивое побуждение или заманивание к определённому поступку. «Склонять» естественно передаёт нравственно отрицательное воздействие, не придавая глаголу излишне сексуального оттенка.
- source_word: חַטָּאִים
  choice: грешники
  rationale: 'Прямой и естественный субстантивированный перевод множественного числа: люди, характеризуемые грехом.'
- source_word: אַל־תֹּבֵא
  choice: не соглашайся
  rationale: אבה означает «быть согласным, желать, соглашаться»; сочетание с אַל выражает запрет. Перевод сохраняет акцент на отказе внутренне согласиться или уступить призыву.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичностью афористической речи. Порядок «Сын мой» естественен для жанра наставления; «будут склонять» передаёт манипулятивное побуждение без ненужного уточнения способа.
