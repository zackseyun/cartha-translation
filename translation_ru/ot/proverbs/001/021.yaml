  text: בְּ/רֹ֥אשׁ הֹמִיּ֗וֹת תִּ֫קְרָ֥א בְּ/פִתְחֵ֖י שְׁעָרִ֥ים בָּ/עִ֗יר אֲמָרֶ֥י/הָ תֹאמֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/021.yaml
  text: 'At the head of the noisy streets she cries out[c][b][a]; at the entrances of the gates in the city she speaks her words:'
translation:
  language: ru
  text: 'В самых заметных местах, среди шума и суеты, она взывает[a]; у входов в городские ворота[b] произносит свои слова[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на вершине шумных мест она взывает». Еврейское выражение может указывать либо на самое заметное место, либо на верхнюю или переднюю часть пространства, наполненного шумом и людской суетой.'
    reason: lexical_alternative
  - marker: b
    text: 'Городские ворота были главным местом общественных собраний: там торговали, разбирали судебные дела и решали городские вопросы.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «говорит свои слова»; это выражение обозначает публичную речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹאשׁ
  choice: Во главе
  rationale: Сохраняет пространственный образ רֹאשׁ — «голова, верх, передняя или видная часть» — и указывает на заметное место среди городской суеты, не сводя выражение к буквальной возвышенности.
- source_word: הֹמִיּוֹת
  choice: шумных улиц
  rationale: Форма связана с шумом, гулом и смятением; «шумные улицы» естественно передаёт городской общественный контекст, хотя само существительное буквально шире и может обозначать места людской суеты.
- source_word: תִּקְרָא
  choice: она взывает
  rationale: Глагол קרא означает «звать, возглашать»; «взывает» передаёт громкий публичный призыв Премудрости и сохраняет возвышенный, но современно понятный регистр.
- source_word: בְּפִתְחֵי
  choice: у входов в
  rationale: פֶּתַח обозначает отверстие или вход; форма множественного числа естественно передана как «у входов».
- source_word: שְׁעָרִים
  choice: городские ворота
  rationale: Речь идёт о воротах города как общественном пространстве. Добавление «городские» проясняет подразумеваемую реалию без изменения смысла.
- source_word: בָּעִיר
  choice: городские
  rationale: Еврейское «в городе» в русском естественно включено в сочетание «городские ворота»; это избегает тяжеловесного «у входов в ворота в городе».
- source_word: אֲמָרֶיהָ תֹאמֵר
  choice: произносит свои слова
  rationale: Буквальная конструкция — «говорит свои слова». «Произносит свои слова» сохраняет явный объект и звучит естественно по-русски.
theological_decisions:
- issue: Женская персонификация Премудрости
  choice: 'Сохранить форму женского рода: «она»'
  alternative: Передать безлично или местоимением среднего рода
  rationale: Еврейские глаголы и местоименный суффикс имеют форму женского рода и продолжают контекстуальную персонификацию Премудрости; перевод не делает из этого дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Двоеточие сохраняет переход к прямой речи в следующем стихе. Порядок сносок приведён в последовательность их появления в русском тексте.
