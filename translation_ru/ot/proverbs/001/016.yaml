source:
  edition: WLC
  text: כִּ֣י רַ֭גְלֵי/הֶם לָ/רַ֣ע יָר֑וּצוּ וִֽ֝/ימַהֲר֗וּ לִ/שְׁפָּךְ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/016.yaml
  text: For their feet run to evil[b][a], and they hurry to shed blood.
translation:
  language: ru
  text: Ибо ноги их бегут ко злу[a], и они спешат пролить кровь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бегут делать зло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит обоснование предшествующего предостережения; «ибо» ясно передаёт причинно-пояснительную связь и соответствует достоинству поэтической речи.
- source_word: רַגְלֵיהֶם
  choice: ноги их
  rationale: Сохранён телесный образ исходного текста, выражающий устремлённость и готовность к действию; постпозиция местоимения уместна в поэтическом библейском контексте.
- source_word: לָרַע
  choice: ко злу
  rationale: 'Буквальное направление движения сохраняет краткость и неоднозначность еврейского выражения: речь может идти как об устремлении к злу, так и о стремлении совершить зло.'
- source_word: יָרוּצוּ
  choice: бегут
  rationale: Передаёт основной смысл глагола и сохраняет яркую метафору поспешного движения.
- source_word: וִימַהֲרוּ
  choice: и они спешат
  rationale: Естественно передаёт усиление мысли во второй параллельной строке; явное местоимение помогает по-русски перейти от образа ног к самим людям.
- source_word: לִשְׁפָּךְ דָּם
  choice: пролить кровь
  rationale: Устойчивое русское соответствие еврейскому выражению о кровопролитии, без ненужного уточнения характера насилия.
