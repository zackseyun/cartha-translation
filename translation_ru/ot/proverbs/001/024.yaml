  text: יַ֣עַן קָ֭רָאתִי וַ/תְּמָאֵ֑נוּ נָטִ֥יתִי יָ֝דִ֗/י וְ/אֵ֣ין מַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/024.yaml
  text: Because I called and you refused[a], I stretched out my hand and no one paid attention,
translation:
  language: ru
  text: За то, что я звала, а вы отказались, я протянула руку — и никто не обращал внимания,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: За то, что
  rationale: Вводит основание последующего суда. В сочетании с продолжением мысли в следующем стихе эта формулировка естественно передаёт причинную связь.
- source_word: קָרָאתִי
  choice: я звала
  rationale: Глагол קרא обозначает призыв Премудрости; женский род согласуется с олицетворённой Премудростью в контексте.
- source_word: וַתְּמָאֵנוּ
  choice: а вы отказались слушать
  rationale: מאן означает «отказываться». Добавление «слушать» естественно по-русски обозначает содержание отказа, подразумеваемое призывом, не превращая его в более сильное «повиноваться».
- source_word: נָטִיתִי יָדִי
  choice: протягивала руку
  rationale: Сохраняет конкретный образ жеста обращения. Русский несовершенный вид хорошо передаёт развёрнутый параллельный призыв, не отрицая завершённости действия.
- source_word: וְאֵין מַקְשִׁיב
  choice: но никто не внимал
  rationale: Причастие от קשב выражает внимательное слушание. «Не внимал» сохраняет этот оттенок и достоинство поэтической речи; противительный союз естественно выражает контекстуальный контраст.
theological_decisions:
- issue: Говорящий в стихе
  choice: 'Женский род: «звала», «протягивала»'
  alternative: Не обозначать род говорящего там, где это возможно
  rationale: В непосредственном контексте говорит олицетворённая Премудрость, грамматически женского рода; перевод отражает это, не давая дополнительного богословского определения её личности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим оборотом «не внимал». Синтаксис оставлен незавершённым запятой, поскольку причинная конструкция получает главное предложение в следующем стихе.
