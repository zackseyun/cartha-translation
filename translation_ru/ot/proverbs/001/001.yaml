  text: 'The proverbs of Solomon[a], son of David, king of Israel:'
translation:
  language: ru
  text: 'Притчи[a] Соломона, сына Давида, царя Израиля:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изречения», «мудрые изречения». Еврейское מָשָׁל может означать притчу, краткое назидательное изречение или мудрое высказывание; здесь «Притчи» лучше всего соответствует заглавию книги и надписи к собранию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: Притчи
  rationale: Форма множественного числа в сопряжённом состоянии от מָשָׁל вводит собрание мудрых изречений. «Притчи» соответствует значению слова, функции заглавия и принятому русскому названию книги.
- source_word: שְׁלֹמֹה
  choice: Соломона
  rationale: Личное имя передано в традиционной русской библейской форме; родительный падеж выражает конструкцию принадлежности.
- source_word: בֶן
  choice: сына
  rationale: В этой царской надписи слово прямо указывает на сыновнее отношение; форма родительного приложения естественна по-русски.
- source_word: דָּוִד
  choice: Давида
  rationale: Личное имя передано в традиционной русской форме и поставлено в родительном падеже после слова «сына».
- source_word: מֶלֶךְ
  choice: царя
  rationale: В отношении правителя Израиля естественно русское «царь»; родительный падеж сохраняет приложение к имени Соломона.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Традиционная русская форма названия народа и царства; родительный падеж зависит от слова «царя».
