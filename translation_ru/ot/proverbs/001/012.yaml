  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
translation:
  language: ru
  text: поглотим их живыми, словно Шеол[a], и целыми[b], словно тех, кто сходит в яму;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
