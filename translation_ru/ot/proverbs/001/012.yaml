lexical_decisions:
- source_word: נִבְלָעֵם
  choice: проглотим их
  rationale: Когортатив 1-го лица множественного числа с местоименным суффиксом передаёт призыв сообщников; форма «проглотим» естественно сохраняет хищный образ.
- source_word: כִּשְׁאוֹל
  choice: как шеол
  rationale: Транслитерация сохраняет особое древнееврейское обозначение мира мёртвых и образ его всепоглощающей силы, не сужая смысл до отдельной могилы.
- source_word: חַיִּים
  choice: живыми
  rationale: Предикативное употребление указывает, что жертвы будут поглощены ещё живыми.
- source_word: וּתְמִימִים
  choice: и целыми
  rationale: В контексте насильственного поглощения תמים обозначает целость, невредимость, а не обязательно нравственную непорочность.
- source_word: כְּיֹרְדֵי בוֹר
  choice: как сходящих в могилу
  rationale: Причастный оборот передаёт движение вниз; «могила» здесь сохраняет конкретный образ ямы и одновременно понятную русскому читателю связь со смертью.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; царство мёртвых; смерть
  rationale: «Шеол» сохраняет древнееврейский образ мира мёртвых и не навязывает более узкого догматического толкования.
- issue: Смысл תְמִימִים в контексте
  choice: целыми
  alternative: невредимыми; непорочными
  rationale: Параллелизм описывает жертв, поглощаемых живьём и целиком; нравственная оценка здесь контекстуально менее вероятна, однако оттенок полноты сохраняется.
translation_notes:
  register: Современный литературный русский с сохранением резкой поэтической метафоры. Строчная буква в начале и точка с запятой отражают положение стиха внутри продолжающейся речи; «шеол» дан как нарицательное обозначение мира мёртвых.
