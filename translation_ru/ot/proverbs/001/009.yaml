lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Связывает стих с наставлением в предыдущем стихе и вводит основание призыва; «ведь» естественно передаёт пояснительно-причинный оттенок.
- source_word: לִוְיַת חֵן
  choice: прекрасный венок
  rationale: לִוְיַת обозначает нечто обвитое или сплетённое, а חֵן здесь характеризует его как привлекательное и красивое. Выражение передано естественно, без привнесения богословского значения слова «благодать».
- source_word: הֵם
  choice: они
  rationale: Местоимение отсылает к наставлению отца и поучению матери в Притчах 1:8; в русском именная конструкция с тире звучит естественно.
- source_word: לְרֹאשֶׁךָ
  choice: для твоей головы
  rationale: Предлог לְ выражает отношение украшения к голове; формулировка сохраняет структуру оригинала и остаётся естественной по-русски.
- source_word: וַעֲנָקִים
  choice: и ожерелья
  rationale: Сохранено множественное число еврейского существительного; «ожерелья» ясно передаёт образ украшений и параллелизм с венком.
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: для твоей шеи
  rationale: Буквально слово обозначает область горла/шеи; в контексте украшений «шея» — точный и естественный русский эквивалент.
