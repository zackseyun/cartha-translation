    rationale: В русском в образе украшений обычно говорят «на голове» и «на шее»; это точнее передаёт функцию образа без изменения смысла.
  - severity: low
    issue: «Прекрасный» несколько обобщает значение חֵן.
    rationale: «Изящный» лучше передаёт качество привлекательного, изысканного украшения и сохраняет современный литературный регистр.
