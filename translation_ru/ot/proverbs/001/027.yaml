base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/027.yaml
  text: when your dread comes like a storm[a], and your calamity arrives like a whirlwind, when distress and anguish come upon you.
translation:
  language: ru
  text: 'когда ваш страх нагрянет, словно буря[a],

    и бедствие ваше налетит, словно вихрь,

    когда обрушатся на вас беда и мука.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно опустошение». Еврейское слово может обозначать как разрушительное бедствие, так и сокрушительную силу бури.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹא
  choice: когда … нагрянет
  rationale: Предлог ב с инфинитивом בוא вводит временное придаточное. «Когда … нагрянет» естественно по-русски и передаёт внезапность описываемого бедствия.
- source_word: כְּשָׁאוָה
  choice: словно буря
  rationale: Слово שָׁאוָה может обозначать опустошение, гибель или сокрушительное бедствие. В параллели с סוּפָה образ бури естественно передаёт его разрушительную и внезапную силу; лексическая альтернатива сохранена в сноске.
- source_word: פַּחְדְּכֶם
  choice: ваш страх
  rationale: Пחד обозначает страх или ужас и может в контексте сближаться с тем, что внушает страх. «Ваш страх» сохраняет краткость и некоторую смысловую неоднозначность еврейского выражения.
- source_word: וְאֵידְכֶם
  choice: и бедствие ваше
  rationale: אֵיד означает гибельное несчастье или бедствие. «Бедствие» точно и понятно передаёт смысл, сохраняя возвышенный поэтический тон.
- source_word: כְּסוּפָה
  choice: словно вихрь
  rationale: סוּפָה — сильный вихрь или буря. «Вихрь» сохраняет конкретный образ и поэтический параллелизм с первой строкой.
- source_word: יֶאֱתֶה
  choice: налетит
  rationale: Глагол означает «придёт, наступит». В сочетании с образом вихря «налетит» естественно передаёт стремительное наступление, не меняя направленности образа.
- source_word: עֲלֵיכֶם
  choice: на вас
  rationale: Предлог עַל здесь выражает беду, постигающую людей. Сочетание «обрушатся на вас» идиоматично передаёт это отношение.
- source_word: צָרָה
  choice: беда
  rationale: צָרָה обозначает беду, притеснение или тяжёлое положение. «Беда» — современное, ёмкое и контекстуально уместное соответствие.
- source_word: וְצוּקָה
  choice: и мука
  rationale: צוּקָה передаёт стеснение, тяжкое давление и душевную муку. «Мука» отличает слово от צָרָה, сохраняя усилительный параллелизм пары.
