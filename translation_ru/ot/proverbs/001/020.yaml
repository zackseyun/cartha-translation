  text: Wisdom cries aloud in the street[a]; in the squares she raises her voice.
translation:
  language: ru
  text: Мудрость громко взывает на улице[a], на площадях возвышает свой голос.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мудрость зовёт на улице».'
    reason: 'Лексическая альтернатива: более нейтральная и разговорно естественная передача תָּרֹנָּה.'
lexical_decisions:
- source_word: חָכְמוֹת
  choice: Премудрость
  rationale: Хотя форма морфологически множественного числа, глаголы женского рода в единственном числе представляют мудрость как единичный олицетворённый образ. «Премудрость» естественно сохраняет эту поэтическую персонификацию в русском библейском регистре.
- source_word: בַּחוּץ
  choice: на улице
  rationale: Слово обозначает открытое общественное пространство вне дома; «на улице» естественно передаёт этот смысл и образует параллель с площадями.
- source_word: תָּרֹנָּה
  choice: громко взывает
  rationale: Глагол רנן здесь описывает звучный публичный призыв. «Громко взывает» сохраняет силу выражения, не придавая ему обязательно радостного оттенка пения.
- source_word: בָּרְחֹבוֹת
  choice: на площадях
  rationale: Существительное обозначает широкие открытые места города, то есть площади; множественное число оригинала сохранено.
- source_word: תִּתֵּן קוֹלָהּ
  choice: возвышает голос
  rationale: Буквально — «даёт свой голос». Русское «возвышает голос» естественно передаёт идиому и сохраняет смысл публичного провозглашения.
theological_decisions:
- issue: Олицетворение Премудрости
  choice: Сохранить Премудрость как образ женского рода, действующий как лицо.
  alternative: Передать слово как отвлечённое понятие «мудрость», ослабив олицетворение.
  rationale: Формы глаголов женского рода в единственном числе и местоименный суффикс явно поддерживают литературную персонификацию. Перевод не отождествляет этот образ с какой-либо позднейшей богословской фигурой.
translation_notes:
  register: Современный литературный русский язык с достойным поэтическим звучанием. «Премудрость» сохраняет традиционно узнаваемое олицетворение; синтаксический параллелизм еврейской строки передан двумя соотнесёнными частями.
