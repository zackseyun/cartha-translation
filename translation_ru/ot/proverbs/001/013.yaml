  text: We will find all precious wealth[b][a]; we will fill our houses with plunder.
translation:
  language: ru
  text: Всякое ценное имущество найдём, наполним наши дома добычей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «награбленным». Еврейское слово обозначает имущество, захваченное как добыча.'
