lexical_decisions:
- source_word: כָּל
  choice: всякое
  rationale: Передаёт полный охват и в сочетании с собирательным «богатство» естественно выражает хвастливое обещание найти всевозможные ценности.
- source_word: הוֹן יָקָר
  choice: драгоценное богатство
  rationale: Сохраняет сочетание существительного со значением имущества и определения со значением высокой ценности; современно и понятно по-русски.
- source_word: נִמְצָא
  choice: найдём
  rationale: Передаёт простое лексическое значение מצא и форму первого лица множественного числа; в контексте звучит как уверенное обещание сообщников.
- source_word: נְמַלֵּא
  choice: наполним
  rationale: Сохраняет первое лицо множественного числа и последовательность уверенных намерений, не усиливая отдельно возможный побудительный оттенок.
- source_word: בָתֵּינוּ
  choice: наши дома
  rationale: Буквально и естественно передаёт образ домов как мест, которые будут заполнены награбленным.
- source_word: שָׁלָל
  choice: добычей
  rationale: В данном контексте означает имущество, захваченное насилием или грабежом; «добыча» литературно и понятно передаёт этот смысл.
