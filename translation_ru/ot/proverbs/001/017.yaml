source:
  edition: WLC
  text: כִּֽי חִ֭נָּם מְזֹרָ֣ה הָ/רָ֑שֶׁת בְּ֝/עֵינֵ֗י כָל בַּ֥עַל כָּנָֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/017.yaml
  text: For the net is spread in vain in the sight of any bird[a].
translation:
  language: ru
  text: Ведь напрасно расставляют сеть на виду у всякой птицы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у всякого обладателя крыла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего предостережения; «ведь» естественно передаёт пояснительную связь в русском контексте.
- source_word: חִנָּם
  choice: напрасно
  rationale: Здесь слово выражает тщетность, бесполезность действия; «напрасно» ясно и естественно передаёт этот смысл.
- source_word: מְזֹרָה
  choice: расставляют
  rationale: Пассивное причастие от זרה описывает сеть как разложенную или раскинутую. В русском языке сеть обычно «расставляют»; неопределённо-личная конструкция естественно передаёт пассив без указания действующего лица.
- source_word: הָרָשֶׁת
  choice: сеть
  rationale: רֶשֶׁת обозначает ловчую сеть; обычное русское «сеть» точно сохраняет образ.
- source_word: בְּעֵינֵי
  choice: на виду у
  rationale: Буквально «в глазах»; выражение означает, что сеть расставляется открыто, так что птица её видит. «На виду у» передаёт это без оттенка оценки.
- source_word: כָל
  choice: всякой
  rationale: 'При единственном собирательном обозначении выражает обобщение: всякая птица как представитель класса.'
- source_word: בַּעַל כָּנָף
  choice: птицы
  rationale: Буквально «обладатель крыла»; это идиоматическое обозначение птицы или крылатого существа. В данном охотничьем образе «птица» — наиболее естественный эквивалент.
