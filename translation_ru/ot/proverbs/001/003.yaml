  text: לָ֭/קַחַת מוּסַ֣ר הַשְׂכֵּ֑ל צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט וּ/מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/003.yaml
  text: to receive instruction in wise dealing[a], righteousness, justice[c][b], and equity.
translation:
  language: ru
  text: чтобы принимать наставление в благоразумии[a], праведности, правосудии и справедливости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление, учащее поступать мудро». Еврейское выражение обозначает практическое благоразумие, умение разумно вести себя, а не только понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прямоте». Еврейское слово буквально связано с тем, что прямо и ровно, и в нравственном смысле означает честность и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַחַת
  choice: принимать
  rationale: Инфинитив выражает цель в ряду Притч 1:2–3. Хотя основное значение глагола — «брать», в сочетании с מוּסָר естественен смысл «принимать, усваивать» наставление.
- source_word: מוּסַר
  choice: наставление
  rationale: Слово охватывает обучение, воспитание и дисциплину. В программном вступлении «наставление» естественно передаёт широкий педагогический смысл, не сводя его к наказанию.
- source_word: הַשְׂכֵּל
  choice: благоразумие
  rationale: Здесь имеется в виду практическая рассудительность и умение поступать мудро, а не только интеллектуальное понимание.
- source_word: צֶדֶק
  choice: праведность
  rationale: Выбор сохраняет нравственный смысл и отличает этот термин от מִשְׁפָּט — «правосудия».
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В данном этическом перечне слово обозначает справедливый суд и правовой порядок; «правосудие» сохраняет юридико-общественный оттенок.
- source_word: מֵישָׁרִים
  choice: справедливость
  rationale: Множественное число от основы со значением прямоты передаёт этическую честность, ровность и беспристрастность. Современное «справедливость» естественно в этом перечне, хотя частично сближается с соседними понятиями.
