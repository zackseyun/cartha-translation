lexical_decisions:
- source_word: יִשְׁמַע
  choice: пусть ... слушает
  rationale: Еврейский имперфект 3-го лица единственного числа допускает описательное прочтение, но в наставительном контексте естественно передаёт побуждение. «Слушает» здесь означает внимательно воспринимает наставление.
- source_word: חָכָם
  choice: мудрый
  rationale: Субстантивированное прилагательное в мужском роде и единственном числе передано естественным русским «мудрый», сохраняющим обобщённый образ отдельного человека.
- source_word: וְיֹסֶף
  choice: и умножает
  rationale: Форма от יסף буквально выражает прибавление или увеличение; «умножает» естественно сочетается с «познания» и передаёт продолжающийся рост.
- source_word: לֶקַח
  choice: познания
  rationale: Слово обозначает воспринятое учение, наставление или знание. «Познания» хорошо выражает то, что мудрый приобретает и накапливает, не сводя смысл только к процессу преподавания.
- source_word: נָבוֹן
  choice: разумный
  rationale: Форма обозначает человека, обладающего пониманием и способностью различать. «Разумный» — краткий, литературный и привычный эквивалент в русской традиции мудростной речи.
- source_word: תַּחְבֻּלוֹת
  choice: искусство управления
  rationale: Множественное существительное связано с образом умелого направления, подобного управлению судном, и может означать руководство, продуманные советы или способы действия. «Искусство управления» сохраняет активный и умелый характер понятия.
- source_word: יִקְנֶה
  choice: приобретает
  rationale: קנה означает приобретать, получать во владение. Здесь речь идёт не о покупке, а об обретении ценного умения.
