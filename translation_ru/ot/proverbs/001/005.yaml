  text: Let the wise man hear and increase in learning[b][a], and the discerning man acquire guidance.
translation:
  language: ru
  text: Пусть мудрый слушает и умножает свои знания[a], а разумный приобретает мудрые советы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мудрый услышит и умножит свои знания»; еврейские глагольные формы допускают описательное прочтение, однако в наставительном контексте они переданы как побуждение.'
