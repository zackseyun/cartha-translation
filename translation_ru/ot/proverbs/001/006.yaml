  text: לְ/הָבִ֣ין מָ֭שָׁל וּ/מְלִיצָ֑ה דִּבְרֵ֥י חֲ֝כָמִ֗ים וְ/חִידֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/006.yaml
  text: to understand a proverb and a saying[b][a], the words of the wise and their riddles.
translation:
  language: ru
  text: чтобы понимать притчу и иносказание[a], слова мудрых и их загадки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притчу и изречение»; еврейское слово может означать выразительное или образное изречение, а в некоторых контекстах — истолкование.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их загадочные изречения». Еврейское слово обозначает загадки или неясные изречения, требующие размышления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִין
  choice: чтобы понимать
  rationale: Инфинитив с לְ выражает цель и продолжает целевые формулировки предыдущих стихов; «понимать» естественно передаёт значение בין.
- source_word: מָשָׁל
  choice: притчу
  rationale: מָשָׁל обозначает притчу, пословицу или мудрое изречение. «Притча» сохраняет широту жанрового значения и хорошо сочетается с последующим редким термином.
- source_word: מְלִיצָה
  choice: иносказание
  rationale: Редкое слово может обозначать выразительное, образное или требующее истолкования изречение. «Иносказание» передаёт образность и не сводит термин к техническому «толкованию».
- source_word: דִּבְרֵי
  choice: слова
  rationale: Прямо передаёт конструктивную форму множественного числа דָּבָר и сохраняет синтаксическую связь со словом «мудрых».
- source_word: חֲכָמִים
  choice: мудрых
  rationale: Субстантивированное прилагательное обозначает мудрых людей без обязательного указания пола; русское «мудрых» естественно сохраняет это значение.
- source_word: חִידֹתָם
  choice: их загадки
  rationale: חִידָה означает загадку или загадочное изречение; местоимение «их» сохраняет суффикс третьего лица множественного числа.
