  text: אִם יֹאמְרוּ֮ לְכָ֪/ה אִ֫תָּ֥/נוּ נֶאֶרְבָ֥ה לְ/דָ֑ם נִצְפְּנָ֖ה לְ/נָקִ֣י חִנָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/011.yaml
  text: If they say[a], “Come with us, let us lie in wait for blood[b]; let us ambush the innocent without cause,”
translation:
  language: ru
  text: 'Если они скажут тебе: «Иди с нами! Затаимся, чтобы пролить кровь[a], без всякой причины подстережём[b] невинного»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «затаимся ради крови». Это краткое еврейское выражение означает намерение совершить кровопролитие или убийство.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может буквально означать «спрячемся» или «укроемся», но здесь, в параллели с «затаимся», речь идёт о том, чтобы скрытно подстеречь жертву.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֹאמְרוּ לְכָה
  choice: 'Если они скажут тебе: «Идём»'
  rationale: Условное אִם передано словом «если», а форма приглашения לְכָה — естественным русским «идём», то есть призывом присоединиться к говорящим.
- source_word: אִתָּנוּ
  choice: с нами
  rationale: Сохраняет прямое приглашение участвовать вместе с группой.
- source_word: נֶאֶרְבָה לְדָם
  choice: Затаимся, чтобы пролить кровь
  rationale: Глагол передаёт намеренное укрытие в засаде, а краткое еврейское «ради крови» означает замысел кровопролития. Русская формулировка сохраняет образ скрытого нападения и ясно выражает его цель.
- source_word: נִצְפְּנָה
  choice: подстережём
  rationale: Корень может буквально обозначать укрытие, но в параллелизме с «затаимся» речь идёт о скрытом ожидании жертвы для нападения.
- source_word: לְנָקִי
  choice: невинного
  rationale: Прилагательное употреблено как существительное и нравственно характеризует намеченную жертву как не заслуживающую нападения.
- source_word: חִנָּם
  choice: без причины
  rationale: Передаёт отсутствие повода или оправдания для нападения и естественно звучит в современном русском языке.
theological_decisions:
- issue: Нравственная характеристика жертвы
  choice: невинного
  alternative: непорочного; ни в чём не повинного
  rationale: 'Перевод сохраняет прямую этическую оценку текста: насилие задумано против человека, не давшего для него повода, без добавления иных богословских утверждений.'
translation_notes:
  register: Современный литературный русский язык с краткой, угрожающей интонацией прямой речи. «Идём с нами» естественно передаёт приглашение присоединиться; «затаимся» и «подстережём» сохраняют параллельные образы заранее задуманной засады.
