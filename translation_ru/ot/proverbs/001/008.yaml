id: PRO.1.8
reference: Proverbs 1:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י מוּסַ֣ר אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/008.yaml
  text: Hear[a], my son, your father's instruction[b], and do not forsake your mother's teaching.
translation:
  language: ru
  text: Слушай, сын мой, наставление[a] своего отца и не оставляй учения[b] своей матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспитание». Еврейское слово включает не только наставление, но и исправляющее обучение, приучающее к верному пути.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «закон». Здесь имеется в виду авторитетное наставление матери, а не формальный свод законов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Слушай
  rationale: Императив означает внимательное слушание, предполагающее готовность последовать услышанному, но перевод «повинуйся» сделал бы этот оттенок слишком явным.
- source_word: בְּנִי
  choice: сын мой
  rationale: Сохранены мужской род, единственное число и личное обращение, выраженные в еврейском тексте.
- source_word: מוּסַר
  choice: наставление
  rationale: Слово охватывает обучение, воспитание и исправляющую дисциплину. «Наставление» естественно в данном контексте и не сужает смысл до наказания.
- source_word: אָבִיךָ
  choice: своего отца
  rationale: Возвратное притяжательное местоимение естественно по-русски при обращении ко второму лицу и точно передаёт еврейский суффикс.
- source_word: וְאַל
  choice: и не
  rationale: Передаёт простое соединение двух повелений и отрицательную частицу.
- source_word: תִּטֹּשׁ
  choice: не оставляй
  rationale: Глагол означает оставлять или покидать; выбранный вариант сохраняет прямой образ и нравственную серьёзность, не добавляя оттенка сознательного отвержения.
- source_word: תּוֹרַת
  choice: учения
  rationale: В семейном контексте слово обозначает авторитетное наставление матери, а не формальный свод законов.
- source_word: אִמֶּךָ
  choice: своей матери
  rationale: Возвратная форма естественна в современном русском языке и сохраняет параллелизм с «своего отца».
theological_decisions:
- issue: Гендерно маркированное обращение в литературе мудрости
  choice: сын мой
  alternative: дитя моё
  rationale: Еврейский текст прямо использует форму мужского рода единственного числа; её нейтрализация изменила бы литературную ситуацию обращения.
- issue: Значение תּוֹרָה вне контекста Моисеева Закона
  choice: учение
  alternative: закон
  rationale: Здесь речь идёт об авторитетном материнском наставлении. «Учение» сохраняет смысл, не создавая впечатления, будто имеется в виду формальный законодательный корпус.
translation_notes:
  register: Современный литературный русский с кратким, достоинственным ритмом изречения. Порядок «сын мой» сохраняет традиционный регистр мудрости, а формы «своего отца» и «своей матери» звучат естественно для современного читателя.
