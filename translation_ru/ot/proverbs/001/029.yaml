  text: תַּ֭חַת כִּי שָׂ֣נְאוּ דָ֑עַת וְ/יִרְאַ֥ת יְ֝הֹוָ֗ה לֹ֣א בָחָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/029.yaml
  text: Because they hated knowledge and did not choose the fear of Yahweh[b][a],
translation:
  language: ru
  text: за то, что они возненавидели знание и не избрали страха перед Яхве[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Страх перед Яхве» — одно из ключевых выражений в литературе мудрости; оно означает благоговейный трепет и почтение, а не только ужас. В еврейском тексте употреблено Божье имя יהוה (Яхве).
    reason: lexical_and_name_clarification
lexical_decisions:
- source_word: תַּחַת כִּי
  choice: за то, что
  rationale: Сочетание вводит основание суда, описанного в контексте. Русское «за то, что» естественно связывается с предшествующим наказанием и передаёт причинный смысл.
- source_word: שָׂנְאוּ
  choice: они возненавидели
  rationale: Глагол выражает сильное неприятие; «возненавидели» сохраняет силу еврейского שׂנא и хорошо согласуется с совершенным видом остальных действий.
- source_word: דָעַת
  choice: знание
  rationale: Прямой эквивалент, сохраняющий характерный для Притч язык мудрости и не сужающий значение до понимания или рассудительности.
- source_word: יִרְאַת יְהוָה
  choice: страха перед Яхве
  rationale: Передаёт устойчивое выражение литературы мудрости и сохраняет смысловое напряжение между благоговением, почтением и страхом, не сводя его лишь к «почитанию».
- source_word: יְהוָה
  choice: Яхве
  rationale: Транслитерация личного Божьего имени непосредственно передаёт тетраграмматон, присутствующий в еврейском тексте.
- source_word: לֹא בָחָרוּ
  choice: не избрали
  rationale: Сохраняет прямое значение בחר и подчёркивает сознательный выбор, не усиливая формулировку до «отказались».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя, а не титул; «Яхве» делает это явным, не подменяя имя традиционным заменителем.
- issue: Передача выражения יִרְאַת יְהוָה
  choice: страх перед Яхве
  alternative: благоговение перед Яхве
  rationale: '«Страх» сохраняет многозначность и богословское напряжение исходного выражения: оно включает благоговейный трепет и нравственную серьёзность, но не ограничивается мягким понятием почтения.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Возненавидели» и «избрали» слегка возвышенны, но ясны обычному читателю. Начальная строчная буква и конечная запятая сохраняют синтаксическую связь стиха с окружающим предложением.
