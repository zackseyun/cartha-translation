id: PRO.1.7
reference: Proverbs 1:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יִרְאַ֣ת יְ֭הוָה רֵאשִׁ֣ית דָּ֑עַת חָכְמָ֥ה וּ֝/מוּסָ֗ר אֱוִילִ֥ים בָּֽזוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/007.yaml
  text: The fear of Yahweh is the beginning of knowledge[b][a]; fools despise wisdom and discipline.
translation:
  language: ru
  text: Страх перед Яхве[a] — начало знания; мудрость и наставление[b] глупцы презирают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговение перед Яхве» или «трепет перед Яхве». Еврейское выражение включает почтение, благоговейный трепет и покорный страх перед Богом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вразумление» или «исправление». Еврейское слово обозначает формирующее обучение, которое может включать исправление и взыскание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: страх перед
  rationale: Сохраняет весомую и программную для литературы мудрости формулировку, не сводя её лишь к почтению или благоговению; конструктивная форма перед именем Бога естественно передана оборотом «страх перед».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» обычна в современной русской библеистике.
- source_word: רֵאשִׁית
  choice: начало
  rationale: Сохраняет возможные оттенки исходной точки и основополагающего начала, не сужая смысл до «главной части» или «первого принципа».
- source_word: דָּעַת
  choice: знание
  rationale: Прямой и устойчивый эквивалент существительного в контексте литературы мудрости.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Стандартная и естественная передача ключевого термина Притч, охватывающего умение жить правильно.
- source_word: מוּסָר
  choice: наставление
  rationale: В современном русском языке естественно обозначает формирующее обучение и может включать исправление; более узкое значение «наказание» неоправданно сужало бы термин.
- source_word: אֱוִילִים
  choice: глупцы
  rationale: Сохраняет нравственную, а не только интеллектуальную характеристику людей в языке Притч.
- source_word: בָּזוּ
  choice: презирают
  rationale: Точно передаёт сильное значение пренебрежения и сознательного отвержения.
theological_decisions:
- issue: Смысл выражения יִרְאַת יְהוָה в богословии мудрости
  choice: Сохранить в основном тексте буквальное выражение «страх перед Яхве».
  alternative: «благоговение перед Яхве» или «почтение к Яхве»
  rationale: Еврейское выражение соединяет страх, благоговение и покорность Богу. Более мягкие варианты передают лишь часть смысла и снимают присущее оригиналу напряжение.
- issue: Связь רֵאשִׁית со знанием
  choice: «начало знания»
  alternative: «основа знания» или «главная часть знания»
  rationale: '«Начало» сохраняет смысловую широту: речь может идти как об исходной точке, так и об основополагающем принципе.'
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Инверсия во второй части («мудрость и наставление глупцы презирают») сохранена как естественно торжественная и подчёркивает отвергаемые ценности. Маркеры сносок поставлены непосредственно после относящихся к ним выражений.
