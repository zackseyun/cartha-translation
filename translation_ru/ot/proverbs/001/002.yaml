lexical_decisions:
- source_word: לָדַעַת
  choice: чтобы познать
  rationale: Инфинитив с לְ выражает цель в программном вступлении (ст. 2–6); «чтобы познать» естественно передаёт эту целевую функцию.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное и точное соответствие חָכְמָה в Притчах, где имеется в виду практическая и нравственная мудрость.
- source_word: מוּסָר
  choice: наставление
  rationale: Слово охватывает обучение, воспитание и исправляющую дисциплину; «наставление» подходит для общего программного утверждения, а дисциплинарный оттенок отмечен в сноске.
- source_word: לְהָבִין
  choice: понять
  rationale: Параллельный инфинитив цели; «понять» естественно звучит по-русски и сохраняет смысл постижения и распознавания.
- source_word: אִמְרֵי
  choice: слова
  rationale: Форма сопряжённого множественного числа обозначает высказывания; «слова» сохраняет широкое значение оригинала.
- source_word: בִינָה
  choice: разумения
  rationale: «Разумение» передаёт способность глубоко понимать и различать и сохраняет именную конструкцию «слова разумения», не устраняя смысловую неоднозначность.
