  text: עַד מָתַ֣י פְּתָיִם֮ תְּֽאֵהֲב֫וּ פֶ֥תִי וְ/לֵצִ֗ים לָ֭צוֹן חָמְד֣וּ לָ/הֶ֑ם וּ֝/כְסִילִ֗ים יִשְׂנְאוּ דָֽעַת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/022.yaml
  text: How long[a], O simple ones[b], will you love simplicity? How long will scoffers delight in scoffing and fools hate knowledge?
translation:
  language: ru
  text: До каких пор, наивные, вы будете любить наивность[a], насмешники — наслаждаться насмешками, а глупцы — ненавидеть знание?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте игра однокоренных слов: «наивные» любят «наивность». Возможный перевод: «неопытные… неопытность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָיִם / פֶתִי
  choice: неопытные / неопытность
  rationale: Сохраняет однокоренную игру слов оригинала и передаёт людей доверчивых, ещё не сформированных нравственно, а не просто ограниченных умственно. «Простодушные / простодушие» в современном русском может звучать как положительная черта.
- source_word: תְּאֵהֲבוּ
  choice: будете любить
  rationale: Имперфект в вопросе с «до каких пор» обозначает продолжающуюся склонность, которой говорящий требует положить конец.
- source_word: לֵצִים / לָצוֹן
  choice: насмешники / насмешки
  rationale: Однокоренные русские слова воспроизводят лексическую связь и обозначают людей, высокомерно отвергающих мудрость и наставление.
- source_word: חָמְדוּ
  choice: наслаждаться
  rationale: В сочетании с насмешками глагол выражает сильное желание и удовольствие от такого поведения; этот выбор естественен по-русски и не вводит неуместного оттенка имущественной алчности.
- source_word: כְסִילִים
  choice: глупцы
  rationale: Сохраняет устойчивую нравственно-духовную категорию литературы мудрости, не сводя её к недостатку интеллекта.
- source_word: יִשְׂנְאוּ דָעַת
  choice: ненавидеть знание
  rationale: Прямо сохраняет силу глагола «ненавидеть» и обычное для Притч значение существительного «знание».
- source_word: לָהֶם
  choice: свою (при «неопытность») / не выражено отдельно во второй строке
  rationale: Местоименный оборот в масоретском тексте относится к насмешникам и буквально значит «для себя / себе», но по-русски его отдельная передача («для себя наслаждаться») была бы неестественной. Притяжательность выражена в первой части для ясности, без заявления о формальном соответствии этому местоимению.
theological_decisions:
- issue: Нравственные типы в книге Притчей
  choice: Сохранены различимые категории «неопытные», «насмешники» и «глупцы».
  alternative: 'Передать их обобщёнными психологическими описаниями: «наивные люди», «любители насмешек», «неразумные».'
  rationale: В Притчах это повторяющиеся нравственные типы. Их различение сохраняет структуру богословия мудрости и не превращает обличение в описание темперамента.
- issue: Объём вопроса «до каких пор»
  choice: Вопрос распространён на все три параллельные группы.
  alternative: Грамматически связать «до каких пор» только с первой группой, а остальные утверждения передать повествовательно.
  rationale: Параллельное построение стиха естественно подразумевает действие начальной вопросительной формулы во всех трёх частях; русское тире позволяет передать это без навязчивого повторения.
translation_notes:
  register: Современный литературный русский, с достоинством обличительной речи. Тире поддерживает трёхчастный параллелизм и позволяет не повторять «до каких пор вы будете». «Свою» добавлено для естественности и подчёркивает добровольную привязанность, не меняя предмет любви.
