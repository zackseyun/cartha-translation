  text: וְ֭/הֵם לְ/דָמָ֣/ם יֶאֱרֹ֑בוּ יִ֝צְפְּנ֗וּ לְ/נַפְשֹׁתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/018.yaml
  text: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
translation:
  language: ru
  text: Но они подстерегают собственную кровь[a], устраивают засаду против самих себя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свою кровь». Слово «кровь» сохранено как конкретный образ: замышляемое ими насилие обращается против них самих.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «таятся ради самих себя». Еврейский глагол буквально означает «прятать, скрывать»; в этом параллельном контексте он, вероятно, описывает устройство скрытой засады.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵם
  choice: Но они
  rationale: 'Самостоятельное местоимение вместе с союзом подчёркивает противопоставление предыдущему образу птицы: сеть видна ей, а эти люди сами готовят себе гибель.'
- source_word: לְדָמָם
  choice: собственную кровь
  rationale: 'Сохранён конкретный образ «крови», а принадлежность передана возвратным прилагательным, чтобы ясно выразить иронию: насилие обращается против них самих.'
- source_word: יֶאֱרֹבוּ
  choice: подстерегают
  rationale: Глагол обозначает ожидание жертвы в засаде; «подстерегают» естественно передаёт этот смысл и сохраняет отличие от следующего глагола.
- source_word: יִצְפְּנוּ
  choice: устраивают засаду
  rationale: Основное значение связано с сокрытием; в параллели с ארב речь, вероятнее всего, идёт о скрытой засаде. Формулировка передаёт подразумеваемое действие, не смешивая два глагола.
- source_word: לְנַפְשֹׁתָם
  choice: на собственную жизнь
  rationale: נֶפֶשׁ здесь означает жизнь человека, которой угрожает насильственная смерть; единственное число по-русски естественно употребляется распределительно при подлежащем во множественном числе.
