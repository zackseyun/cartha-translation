base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
translation:
  language: ru
  text: Тогда они будут звать меня, но я не отвечу; будут настойчиво искать меня[a], но не найдут меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут искать меня с раннего утра»; также возможно: «будут ревностно искать меня». Еврейский глагол может выражать раннее, усердное и настойчивое искание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Кратко и естественно передаёт временную последовательность и следствие предшествующего предостережения.
- source_word: יִקְרָאֻנְנִי
  choice: они будут звать меня
  rationale: Глагол קרא здесь означает обращённый к кому-либо зов в ожидании ответа или помощи; «звать меня» естественно звучит по-русски.
- source_word: וְלֹא אֶעֱנֶה
  choice: но я не отвечу
  rationale: Хотя וְ буквально является союзом «и», в данном контексте он выражает резкое противопоставление, естественно передаваемое союзом «но».
- source_word: יְשַׁחֲרֻנְנִי
  choice: будут настойчиво искать меня
  rationale: Порода пиэль глагола שׁחר может обозначать раннее, ревностное или усердное искание. В данном контексте «настойчиво искать» передаёт прежде всего напряжённость и усердие, не исключая временного оттенка, отмеченного в сноске.
- source_word: וְלֹא יִמְצָאֻנְנִי
  choice: но не найдут
  rationale: Глагол מצא прямо означает «найти»; местоименное дополнение «меня» естественно восстанавливается из предыдущей части фразы, а «но» передаёт контраст.
theological_decisions:
- issue: Кто говорит в контексте
  choice: 'Сохранена речь от первого лица: говорит олицетворённая Мудрость в литературном контексте Притчей.'
  alternative: Типологически отождествить говорящего с божественной Премудростью или истолковать христологически.
  rationale: Сам стих принадлежит речи Мудрости в Притчах 1. Перевод сохраняет непосредственный литературный смысл и не закрепляет в основном тексте более позднее богословское отождествление.
translation_notes:
  register: Современный литературный русский язык; фраза звучит ясно и торжественно без архаизмов. Параллелизм двух обращений и двух отказов сохранён.
