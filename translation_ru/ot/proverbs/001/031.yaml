  text: וְֽ֭/יֹאכְלוּ מִ/פְּרִ֣י דַרְכָּ֑/ם וּֽ/מִ/מֹּעֲצֹ֖תֵי/הֶ֣ם יִשְׂבָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/031.yaml
  text: So they will eat from the fruit of their way[b][a], and be filled with their own counsels.
translation:
  language: ru
  text: Поэтому они будут есть плоды своего пути и насытятся собственными замыслами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֹאכְלוּ
  choice: Поэтому они будут есть
  rationale: Союз связывает стих с предшествующим отказом слушать мудрость и здесь естественно передаёт следствие; будущее значение глагола сохранено.
- source_word: מִפְּרִי דַרְכָּם
  choice: плоды своего пути
  rationale: Образ плода передаёт последствия избранного образа жизни. Русское множественное «плоды» естественно в этой метафоре, а «путь» сохраняет ключевой для литературы мудрости образ.
- source_word: וּמִמֹּעֲצֹתֵיהֶם
  choice: собственными замыслами
  rationale: מֹעֵצוֹת допускает значения советов, замыслов и планов; в контексте самостоятельно избранного пагубного курса «замыслы» звучит естественно и не усиливает отрицательную оценку до «козней».
- source_word: יִשְׂבָּעוּ
  choice: насытятся
  rationale: Глагол означает насытиться, получить вдоволь; выбор сохраняет пищевую метафору и её иронический оттенок.
theological_decisions:
- issue: Образ нравственного воздаяния как результата собственного пути
  choice: 'Стих представлен как следствие ранее сделанного выбора: люди вкушают плоды собственного пути и насыщаются своими замыслами.'
  alternative: Передать начальный союз нейтральным «и», оставив причинно-следственную связь менее явной.
  rationale: Контекст поддерживает значение следствия, однако формулировка не вводит дополнительных доктринальных категорий и сохраняет образный язык еврейского текста.
translation_notes:
  register: Современный литературный русский язык; сдержанный и образный стиль литературы мудрости. Параллелизм двух строк и метафора еды сохранены без искусственно архаичной лексики.
