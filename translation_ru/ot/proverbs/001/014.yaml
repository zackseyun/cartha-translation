  text: Throw in your lot among us[b][a]; we will all have one purse.
translation:
  language: ru
  text: Войди в долю с нами[a] — у всех нас будет один общий кошелёк[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, букв.: «Брось свой жребий среди нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «один денежный мешок будет принадлежать нам всем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹרָלְךָ תַּפִּיל
  choice: Брось свой жребий
  rationale: Сочетание существительного גּוֹרָל («жребий, доля») с формой Hiphil глагола נפל буквально описывает бросание жребия. Русское выражение сохраняет образ и в контексте передаёт приглашение присоединиться к общей участи и добыче.
- source_word: בְּתוֹכֵנוּ
  choice: вместе с нами
  rationale: Буквально выражение означает «среди нас, посреди нас»; в данном приглашении естественное русское «вместе с нами» ясно передаёт вступление в компанию, не устраняя образ общего жребия.
- source_word: כִּיס
  choice: кошель
  rationale: Слово обозначает мешочек или сумку для денег. «Кошель» точно и лаконично передаёт общий денежный мешок; более современное «кошелёк» может звучать как личная карманная вещь.
- source_word: אֶחָד
  choice: один
  rationale: Сохранено прямое значение числительного и подчёркнута единая общая касса.
- source_word: יִהְיֶה לְכֻלָּנוּ
  choice: будет у всех нас
  rationale: Еврейская конструкция буквально означает «будет для всех нас» и выражает совместное владение. Русская конструкция «будет у всех нас» естественно сохраняет этот смысл.
