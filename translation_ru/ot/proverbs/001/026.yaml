  source_fidelity: 'Смысловой состав передан точно: добавочное «и/также я», бедствие, смех, насмешка и временная конструкция «когда придёт» сохранены. Однако основной текст «то, чего вы страшитесь» выбирает предметное значение פַחְדְּכֶם, тогда как еврейское слово допускает также значение самого страха/ужаса. Поскольку английская аудит-традиция намеренно сохраняет эту неоднозначность, её следует оставить и в русском основном тексте.'
