  text: גַּם אֲ֭נִי בְּ/אֵידְ/כֶ֣ם אֶשְׂחָ֑ק אֶ֝לְעַ֗ג בְּ/בֹ֣א פַחְדְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/026.yaml
  text: I also will laugh at your calamity[a]; I will mock when your dread comes,
translation:
  language: ru
  text: Я также буду смеяться над вашей бедой, буду насмехаться, когда придёт ваш ужас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда придёт то, чего вы страшитесь». Еврейское слово может обозначать как сам страх или ужас, так и бедствие, которого страшатся.'
    reason: 'Сохранение смыслового диапазона פַחְדְּכֶם: внутренний ужас либо вызывающее его событие.'
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: И я
  rationale: Сочетание сохраняет добавочное и ответное значение גַּם, а также подчёркнутое еврейское местоимение אֲנִי; по-русски это естественно передаёт смысл «тогда и я» без лишнего усиления.
- source_word: בְּאֵידְכֶם
  choice: над вашей бедой
  rationale: אֵיד означает бедствие, несчастье, гибельную беду. С глаголом «посмеюсь» русский предлог «над» идиоматично передаёт еврейское בְּ.
- source_word: אֶשְׂחָק
  choice: посмеюсь
  rationale: Форма Qal от שׂחק прямо обозначает смех. Совершенный вид естественно передаёт будущую реакцию в данном контексте и не смягчает резкости образа.
- source_word: אֶלְעַג
  choice: буду насмехаться
  rationale: לעג означает насмехаться, издеваться, глумиться. «Буду насмехаться» ясно и современно, сохраняет параллелизм со «посмеюсь», не добавляя чрезмерной экспрессии.
- source_word: בְּבֹא
  choice: когда придёт
  rationale: Инфинитивная конструкция с בְּ имеет временное значение — «при наступлении / когда придёт»; личная конструкция наиболее естественна по-русски.
- source_word: פַחְדְּכֶם
  choice: то, чего вы страшитесь
  rationale: פחד может обозначать как страх или ужас, так и вызывающее его событие. Описательный перевод хорошо сочетается с глаголом «придёт» и передаёт вероятный предметный смысл, а примечание сохраняет лексическую неоднозначность.
theological_decisions:
- issue: Тон ответа олицетворённой Мудрости отвергшим её людям
  choice: Прямо сохранить образы смеха и насмешки
  alternative: Смягчить до сожаления или передать как радость о бедствии
  rationale: Еврейские глаголы выражают смех и насмешку в контексте суда и последствий отказа от мудрости. Смягчение устранило бы напряжение текста, а «возрадуюсь» внесло бы смысл, которого сами глаголы не требуют.
translation_notes:
  register: Современный литературный русский язык с ясным, строгим и предостерегающим тоном. Параллелизм двух частей сохранён; архаизмы и конфессионально окрашенные уточнения не используются.
