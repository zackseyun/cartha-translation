  text: בְּנִ֗/י אַל תֵּלֵ֣ךְ בְּ/דֶ֣רֶךְ אִתָּ֑/ם מְנַ֥ע רַ֝גְלְ/ךָ֗ מִ/נְּתִיבָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/015.yaml
  text: My son[a], do not walk in the way with them; keep your foot from their path.
translation:
  language: ru
  text: Сын мой, не ходи с ними по пути[a]; удержи свою ногу от их тропы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ходи с ними по одной дороге». Еврейское слово может обозначать как буквальную дорогу, так и жизненный путь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Обращение «сын» с суффиксом первого лица единственного числа. Перестановка слов естественна для русского наставительного и поэтического регистра и сохраняет мужской род исходного текста.
- source_word: אַל תֵּלֵךְ
  choice: не иди
  rationale: Отрицательная частица с формой глагола הלך выражает запрет. «Не иди» естественно передаёт как буквальное движение, так и метафору избранного образа жизни.
- source_word: בְּדֶרֶךְ אִתָּם
  choice: с ними одним путём
  rationale: דרך может обозначать дорогу и жизненный путь. Русское выражение «идти с кем-либо одним путём» сохраняет обе возможности и ясно передаёт совместность, выраженную אִתָּם.
- source_word: מְנַע
  choice: удержи
  rationale: Императив глагола מנע требует сознательно воспрепятствовать движению. «Удержи» сохраняет активную силу повеления и сочетается с образом ноги.
- source_word: רַגְלְךָ
  choice: ногу
  rationale: Сохранено единственное число исходного текста. Притяжательное местоимение не выражено отдельно, поскольку в русском контексте принадлежность субъекту очевидна.
- source_word: מִנְּתִיבָתָם
  choice: от их тропы
  rationale: נתיבה означает тропу или путь; «тропа» сохраняет поэтический параллелизм с דרך, не смешивая два разных еврейских существительных. Предлог מן передан словом «от».
theological_decisions:
- issue: Буквальный или нравственно-метафорический смысл образов пути и тропы
  choice: Сохранить образную лексику без поясняющей интерпретации в основном тексте
  alternative: 'Передать прямо: «не следуй их образу жизни»'
  rationale: В контексте литературы мудрости путь означает направление жизни, но слова также допускают буквальный образ совместного движения. Перевод сохраняет эту намеренную многослойность.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим наставительным звучанием. Параллельные образы пути, ноги и тропы сохранены без архаизмов и конфессионально окрашенных уточнений.
