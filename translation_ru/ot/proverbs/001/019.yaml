source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל בֹּ֣צֵֽעַ בָּ֑צַע אֶת נֶ֖פֶשׁ בְּעָלָ֣י/ו יִקָּֽח־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/019.yaml
  text: Such are the paths of everyone who gains unjust profit[a]; it takes away the life of its possessors.
translation:
  language: ru
  text: 'Таковы пути всякого, кто наживается неправедно[a]: нажива отнимает жизнь у тех, кто ею владеет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Таковы пути всякого, кто жаден до наживы: она отнимает жизнь у тех, кто ею владеет».'
    reason: Лексическое сочетание בֹּצֵעַ בָּצַע может обозначать как неправедное приобретение, так и алчное стремление к наживе.
lexical_decisions:
- source_word: כֵּן
  choice: Таковы
  rationale: Передаёт итоговое сопоставление с предшествующим предостережением и сохраняет указательную силу еврейского слова.
- source_word: אָרְחוֹת
  choice: пути
  rationale: Сохраняет конкретную метафору пути, характерную для литературы мудрости.
- source_word: כָּל בֹּצֵעַ בָּצַע
  choice: всякого, кто наживается неправедно
  rationale: Причастие с однокоренным существительным выражает корыстное приобретение, в данном контексте связанное с насилием и потому нравственно порочное.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: Здесь слово обозначает жизнь человека, которую губит неправедная нажива, а не отдельно понимаемую нематериальную душу.
- source_word: בְּעָלָיו
  choice: у тех, кто ею владеет
  rationale: 'Суффикс естественно отнесён к наживе: она отнимает жизнь у своих обладателей. Формулировка ясна и естественна по-русски.'
- source_word: יִקָּח
  choice: отнимает
  rationale: Глагол передаёт губительное действие наживы в обобщающем изречении; настоящее время естественно выражает постоянную закономерность.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена метафора путей и афористическая краткость изречения. Повтор «наживается — нажива» отчасти отражает однокоренную фигуру оригинала, не делая фразу неестественной.
