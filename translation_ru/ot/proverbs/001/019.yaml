  source_fidelity: Текст точно передаёт итоговый характер כֵּן, образ «путей» (אָרְחוֹת), всеобщий охват כָּל и губительное следствие корыстной наживы. «Наживается неправедно» обоснованно выражает בֹּצֵעַ בָּצַע в непосредственном контексте насилия; «жизнь» точно передаёт נֶפֶשׁ. Во второй части сохранено допустимое синтаксическое понимание, при котором нажива является субъектом «отнимает», а её обладатели — теми, чья жизнь отнимается.
