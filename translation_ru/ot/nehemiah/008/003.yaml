id: NEH.8.3
reference: Nehemiah 8:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: ru
  text: Он читал из неё на площади перед Водяными воротами от рассвета[a] до полудня — перед мужчинами, женщинами и всеми, кто мог понимать[b]. Весь народ внимательно слушал книгу[c] Закона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от света».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обладавшими пониманием»; вероятно, имеются в виду все, кто был способен осмысленно воспринимать чтение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «свиток».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: Он читал из неё
  rationale: В контексте письменного свитка קרא означает публичное чтение, а בּוֹ естественно передаётся по-русски как «из неё», поскольку речь идёт о книге Закона.
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: на площади перед Водяными воротами
  rationale: רְחוֹב обозначает открытую городскую площадь. Русская формулировка естественно передаёт место публичного чтения и положение площади относительно ворот, не утяжеляя фразу буквальным повтором «перед».
- source_word: מִן הָאוֹר עַד מַחֲצִית הַיּוֹם
  choice: от рассвета до полудня
  rationale: Буквально מִן הָאוֹר — «от света», но это временное обозначение первых дневных лучей; מַחֲצִית הַיּוֹם означает середину дня.
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: перед мужчинами, женщинами и всеми, кто мог понимать
  rationale: נֶגֶד указывает на присутствующую перед чтецом аудиторию. Причастие הַמְּבִינִים обозначает способных осмысленно воспринимать чтение; «всеми» ясно показывает, что это группа, определяемая способностью понимать.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: Весь народ внимательно слушал
  rationale: Еврейская конструкция буквально говорит, что уши всего народа были обращены к книге. Русский глагольный оборот естественно и точно передаёт образ сосредоточенного слушания.
- source_word: סֵפֶר הַתּוֹרָה
  choice: книгу Закона
  rationale: סֵפֶר может обозначать книгу или свиток, а תּוֹרָה здесь — записанный авторитетный свод заветного Закона, публично читаемый народу.
theological_decisions:
- issue: Передача תּוֹרָה в контексте публичного чтения заветного текста
  choice: Закон
  alternative: наставление; Тора
  rationale: Хотя תּוֹרָה может означать «наставление», здесь речь идёт об авторитетном письменном корпусе Моисеева Закона. «Закон» прозрачен для широкого читателя и соответствует контексту, не исключая наставительного характера Торы.
- issue: Состав аудитории
  choice: мужчинами, женщинами и всеми, кто мог понимать
  alternative: мужчинами, женщинами и понимающими
  rationale: Перевод сохраняет явно названные группы мужчин и женщин и не определяет без достаточных оснований возраст третьей группы; выражение может включать детей, уже способных понимать чтение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным строем. Конкретная еврейская идиома об ушах передана естественным русским выражением «внимательно слушал»; различение мужчин, женщин и способных понимать сохранено.
