  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: ru
  text: 'И они обнаружили, что в Законе написано: Яхве через Моисея повелел, чтобы израильтяне[a] жили в шалашах во время праздника, в седьмом месяце.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля»; также: «дети Израиля».'
    reason: Еврейское בְנֵי יִשְׂרָאֵל буквально означает «сыны Израиля», но в данном контексте служит корпоративным обозначением израильского народа.
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: они обнаружили, что … написано
  rationale: Передаёт повествовательную форму וַיִּמְצְאוּ и предикативное כָּתוּב естественной современной русской конструкцией, не меняя смысла «нашли написанным».
- source_word: בַּתּוֹרָה
  choice: в Законе
  rationale: В данном контексте תּוֹרָה обозначает записанное Моисеево наставление и законодательный корпус; «Закон» — ясный и устойчивый русский эквивалент.
- source_word: צִוָּה יְהוָה
  choice: Яхве повелел
  rationale: Глагол צוה прямо выражает повеление, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Идиома «рукой Моисея» указывает на посредничество; «через Моисея» естественно передаёт это значение по-русски.
- source_word: יֵשְׁבוּ
  choice: жили
  rationale: В контексте праздника ישב означает временно обитать или проживать в сооружённых укрытиях; «жили» понятно современному читателю.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальный образ еврейского выражения и его корпоративное значение; в сноске приведены более общеупотребительные варианты.
- source_word: בַּסֻּכּוֹת
  choice: в шалашах
  rationale: סֻכּוֹת — временные укрытия из ветвей; «шалаши» конкретнее и современнее архаичных «кущ».
- source_word: בֶּחָג
  choice: во время праздника
  rationale: Предлог ב здесь имеет временное значение, а определённая форма указывает на известный из контекста праздник без необходимости добавлять его название.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: в седьмом месяце
  rationale: Прямо и без добавочных уточнений передаёт еврейское временное выражение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога — тетраграмматон יהוה; «Яхве» сохраняет его как имя и соответствует наиболее вероятной научной реконструкции произношения.
- issue: К кому относится предписание жить в шалашах
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Еврейское בְנֵי יִשְׂרָאֵל буквально означает «сыны Израиля» и здесь корпоративно обозначает народ; перевод сохраняет форму источника, не сужая адресатов до мужчин.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис «обнаружили, что … написано» выбран ради естественности; «шалаши» избегает архаизма «кущи». Маркер сноски поставлен непосредственно после выражения, к которому относится.
