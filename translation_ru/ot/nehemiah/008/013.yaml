translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Вникнуть» передаёт целенаправленное и вдумчивое постижение текста, а «главы родов» сохраняет историческую социальную реалию без неестественного буквализма.
