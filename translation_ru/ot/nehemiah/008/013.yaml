base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: ru
  text: На второй день главы родов всего народа[a], священники и левиты собрались к книжнику Ездре, чтобы вникнуть в слова Закона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главы семейств». Буквально по-еврейски: «главы отцов»; имеются в виду руководители родов или больших семей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: На второй день
  rationale: Союз ו продолжает повествование, но в русском отдельное «и» здесь было бы тяжеловесным; временная связь естественно передана порядком слов.
- source_word: נֶאֶסְפוּ
  choice: собрались
  rationale: Форма нифаля во множественном числе в данном контексте естественно обозначает совместное собрание.
- source_word: רָאשֵׁי הָאָבוֹת לְכָל הָעָם
  choice: главы родов всего народа
  rationale: Выражение обозначает руководителей родовых или расширенных семейных объединений, представлявших весь народ; перевод сохраняет древнюю общественную структуру и звучит естественно по-русски.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священники и левиты
  rationale: Сохранено прямое наименование двух групп, перечисленных наряду с главами родов.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: к книжнику Ездре
  rationale: Предлог אֶל выражает направленность к Ездре, а סֹפֵר здесь обозначает книжника — признанного знатока и толкователя Закона.
- source_word: וּלְהַשְׂכִּיל
  choice: чтобы вникнуть
  rationale: Инфинитив породы хифиль выражает цель и подразумевает вдумчивое постижение, а не только получение сведений.
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: в слова Закона
  rationale: В сочетании с «вникнуть» предлог אֶל передаёт направленность понимания на содержание и формулировки Торы; «Закон» уместен в данном заветном контексте.
