base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/008.yaml
  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: ru
  text: Они читали по книге, по Закону Бога, внятно[a], разъясняли смысл и делали читаемое понятным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ясно», «отчётливо». Еврейское слово может указывать на внятное чтение; в данном контексте оно также может подразумевать пояснение текста или, возможно, его перевод для слушателей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: они читали
  rationale: При прямом дополнении, обозначающем письменный текст, קרא естественно означает чтение, здесь публичное.
- source_word: בַּסֵּפֶר בְּתוֹרַת הָאֱלֹהִים
  choice: из книги — из Закона Бога
  rationale: Предлог ב при глаголе чтения указывает на источник; второе сочетание поясняет, что эта книга является Законом Бога. Тире естественно передаёт приложение.
- source_word: מְפֹרָשׁ
  choice: ясно
  rationale: Слово указывает на ясное, отчётливое или сделанное понятным изложение, не уточняя однозначно, достигалась ли ясность произношением, объяснением или переводом.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: разъясняли смысл
  rationale: Еврейский оборот буквально говорит о сообщении понимания; по-русски его пояснительная функцию естественно передаёт выражение «разъясняли смысл».
- source_word: וַיָּבִינוּ בַּמִּקְרָא
  choice: помогали понять прочитанное
  rationale: Каузативная форма בין передаёт содействие пониманию, а מִקְרָא здесь обозначает публично прочитанный текст или само чтение. Формулировка сохраняет деятельную роль читающих и объясняющих.
theological_decisions:
- issue: Соотношение чтения, объяснения и понимания
  choice: 'Три связанные стороны служения переданы последовательно: чтение, разъяснение смысла и содействие пониманию.'
  alternative: 'Перевести последнюю часть как результат: «так что они понимали чтение».'
  rationale: Каузативная форма וַיָּבִינוּ лучше поддерживает значение «давали понять», тогда как русский текст не должен превращать стих в утверждение о конкретном установленном способе толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранена конкретность выражения «Закон Бога» и отмечена лексическая неоднозначность מְפֹרָשׁ; конфессионально специфическая терминология не вводится.
