source:
  edition: WLC
  text: וַ֠/יִּקְרָא בְּ/סֵ֨פֶר תּוֹרַ֤ת הָ/אֱלֹהִים֙ י֣וֹם בְּ/י֔וֹם מִן הַ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן עַ֖ד הַ/יּ֣וֹם הָ/אַחֲר֑וֹן וַ/יַּֽעֲשׂוּ חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּ/בַ/יּ֧וֹם הַ/שְּׁמִינִ֛י עֲצֶ֖רֶת כַּ/מִּשְׁפָּֽט׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: ru
  text: И читал он из книги Закона Божьего каждый день[a], от первого дня до последнего. Праздник отмечали семь дней, а на восьмой день было торжественное собрание[b], как предписано[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «день за днём».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «заключительное собрание».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «согласно установлению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: читал он
  rationale: Форма единственного числа сохраняет отличие чтеца от празднующего народа; при сочетании с בְּסֵפֶר глагол означает чтение вслух по письменному тексту.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: из книги Закона Божьего
  rationale: Предлог בְּ при קרא естественно передаётся по-русски как «из»; «книга» не уточняет без необходимости материальную форму документа.
- source_word: יוֹם בְּיוֹם
  choice: каждый день
  rationale: Естественное современное выражение повторяющегося ежедневного действия.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: от первого дня до последнего
  rationale: Прямо и естественно передаёт весь указанный временной промежуток.
- source_word: וַיַּעֲשׂוּ חָג
  choice: Праздник отмечали
  rationale: Сочетание עשה + חג означает соблюдать или праздновать праздник; русский порядок слов позволяет сохранить смену с единственного субъекта на множественный без тяжеловесного местоимения.
- source_word: עֲצֶרֶת
  choice: торжественное собрание
  rationale: Передаёт особый священный характер заключительного собрания, не сводя его к обычной встрече.
- source_word: כַּמִּשְׁפָּט
  choice: как предписано
  rationale: Кратко и ясно выражает соответствие установленному законному порядку.
theological_decisions:
- issue: Единственное число субъекта чтения и множественное число участников праздника
  choice: Сохранить «читал он» и безлично-личное по форме «отмечали» с подразумеваемым народом
  alternative: Передать оба действия множественным числом
  rationale: Еврейские глагольные формы различают отдельного чтеца и общину; это повествовательное различие не следует сглаживать.
- issue: Культовый термин עֲצֶרֶת
  choice: торжественное собрание
  alternative: заключительное собрание
  rationale: Выбор сохраняет священно-праздничный вес термина, тогда как заключительный характер поясняется его совершением на восьмой день и не должен чрезмерно фиксироваться в переводе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «читал он» подчёркивает сохранённое единственное число и обеспечивает естественную связь с контекстом. Все примечания отмечены в основном тексте.
