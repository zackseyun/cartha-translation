base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: ru
  text: И весь народ разошёлся, чтобы есть и пить, рассылать угощения[a] и праздновать с великой радостью, потому что они поняли слова[b], которые им разъяснили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассылать доли» — то есть передавать другим доли праздничной пищи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «то, что им разъяснили».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: разошёлся
  rationale: В повествовательном контексте глагол обозначает уход народа с собрания к последующим действиям; русское «разошёлся» естественно передаёт это движение при собирательном подлежащем «народ».
- source_word: כָל הָעָם
  choice: весь народ
  rationale: Прямое и естественное собирательное выражение, сохраняющее полноту охвата.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: чтобы есть и пить
  rationale: Инфинитивы выражают цель ухода; союз «чтобы» ясно передаёт эту синтаксическую связь по-русски.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: посылать угощение
  rationale: מָנוֹת обозначает выделенные доли, в данном праздничном контексте — доли пищи. «Угощение» звучит естественно по-русски, а «посылать» сохраняет значение שלח и подразумевает передачу другим.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: устроить великое празднество
  rationale: Буквальное «сделать великую радость» неидиоматично по-русски. Выбранное выражение передаёт активное праздничное ликование и усиление גְדוֹלָה.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит прямо названную причину празднования — достигнутое понимание.
- source_word: הֵבִינוּ
  choice: поняли
  rationale: Совершенный вид естественно передаёт достигнутое понимание как основание последующей радости.
- source_word: בַּדְּבָרִים
  choice: слова
  rationale: דְּבָרִים допускает значения «слова» и «дела/то, о чём говорится». В контексте чтения и объяснения закона «слова» наиболее непосредственно передаёт содержание услышанного, а альтернатива сохранена в сноске.
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: которые им разъяснили
  rationale: Hiphil от ידע означает «дать знать, сделать известным». Неопределённо-личная конструкция не называет субъект сверх того, что дано в тексте, а «разъяснили» естественно соответствует контексту наставления.
theological_decisions:
- issue: Основание радостного отклика народа на закон
  choice: Радость народа прямо связана с тем, что люди поняли разъяснённые им слова.
  alternative: Уточнить отклик как покаяние, перешедшее в праздник, или как технически понимаемое обновление завета.
  rationale: Стих называет причиной празднования понимание сообщённых слов. Перевод сохраняет эту причинную связь, не добавляя богословских определений, которых нет в данном предложении.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Собирательное «весь народ разошёлся» естественно для русского языка; неопределённо-личное «им разъяснили» сохраняет неназванного деятеля исходного текста. Все сноски отмечены в основном тексте.
