source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: ru
  text: И всё собрание возвратившихся из плена сделало шалаши и жило в шалашах. Ибо со дней Иешуа, сына Навина[a], и до того дня сыны Израиля не делали этого. И была весьма великая радость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иешуа, сын Навина, — то есть Иисус Навин.
    reason: Поясняет, что форма имени יֵשׁוּעַ обозначает известного под традиционным русским именем Иисус Навин.
lexical_decisions:
- source_word: הַקָּהָל
  choice: собрание
  rationale: Передаёт собравшуюся общину как единое целое и не вносит излишне церковной окраски.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: возвратившихся из плена
  rationale: Близко передаёт причастие с предложным оборотом и сохраняет прямое указание на плен.
- source_word: סֻכּוֹת
  choice: шалаши
  rationale: Естественное русское обозначение временных укрытий, в которых жили во время праздника; не смешивается со святилищем.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: жило в шалашах
  rationale: В данном обрядовом контексте יָשַׁב означает проживание, а не просто сидение.
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: Ведь ... так не делали
  rationale: Сохраняет краткость и анафорическое значение כֵּן, отсылающее к только что описанному сооружению шалашей и проживанию в них, без утверждения, будто праздник вообще никогда не соблюдали.
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: со дней Иешуа, сына Навина
  rationale: «Иешуа» отражает засвидетельствованную здесь форму יֵשׁוּעַ; русское традиционное имя отца — Навин. Более привычное имя этого лица пояснено в сноске.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет мужскую форму и традиционное заветное наименование, оставаясь понятным в литературном русском языке.
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: И было весьма великое ликование
  rationale: «Ликование» выражает общую деятельную радость праздника, а «весьма великое» прямо передаёт усиление גְּדוֹלָה מְאֹד.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Грамматически мужская формула служит заветным этнонимом; основной текст сохраняет её, не нейтрализуя.
- issue: Идентификация יֵשׁוּעַ בִּן נוּן
  choice: Иешуа, сын Навина
  alternative: Иисус Навин
  rationale: Основной текст отражает конкретную еврейскую форму имени יֵשׁוּעַ в этом стихе, а привычная русскому читателю идентификация дана в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Собрание», «шалаши» и «жило» обеспечивают ясность; «сыны Израиля» и «весьма великое ликование» сохраняют достоинство и близость к структуре еврейского текста.
