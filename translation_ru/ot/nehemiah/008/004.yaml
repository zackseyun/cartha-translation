  text: וַֽ/יַּעֲמֹ֞ד עֶזְרָ֣א הַ/סֹּפֵ֗ר עַֽל מִגְדַּל עֵץ֮ אֲשֶׁ֣ר עָשׂ֣וּ לַ/דָּבָר֒ וַ/יַּֽעֲמֹ֣ד אֶצְל֡/וֹ מַתִּתְיָ֡ה וְ/שֶׁ֡מַע וַ֠/עֲנָיָה וְ/אוּרִיָּ֧ה וְ/חִלְקִיָּ֛ה וּ/מַעֲשֵׂיָ֖ה עַל יְמִינ֑/וֹ וּ/מִ/שְּׂמֹאל֗/וֹ פְּ֠דָיָה וּ/מִֽישָׁאֵ֧ל וּ/מַלְכִּיָּ֛ה וְ/חָשֻׁ֥ם וְ/חַשְׁבַּדָּ֖נָה זְכַרְיָ֥ה מְשֻׁלָּֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: ru
  text: Книжник Ездра стоял на деревянном возвышении[a], сооружённом для этого. Справа от него стояли Маттифия, Шема, Анаия, Урия, Хелкия и Маасея, а слева — Федаия, Мисаил, Малхия, Хашум, Хашбаддана, Захария и Мешуллам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на башне из дерева»; то есть на приподнятом деревянном сооружении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֵץ
  choice: деревянное возвышение
  rationale: Буквально сочетание означает «башня из дерева», но в контексте публичного чтения речь идёт о приподнятом деревянном сооружении, на котором стоял Ездра. «Возвышение» естественно передаёт его функцию и не добавляет современного технического оттенка.
- source_word: לַדָּבָר
  choice: для этого
  rationale: דָּבָר может означать «слово», «дело», «обстоятельство» или «предмет». Здесь оборот указывает на цель сооружения; «для этого» естественно связывает его с описанным собранием и чтением, не уточняя сверх текста.
- source_word: הַסֹּפֵר
  choice: книжник
  rationale: В данном контексте סֹפֵר обозначает человека, сведущего в священном тексте и законе. Традиционное русское «книжник» точно и узнаваемо передаёт этот статус.
- source_word: אֶצְלוֹ
  choice: справа от него … а слева
  rationale: Значение близости передано вместе с последующими пространственными уточнениями, чтобы по-русски избежать тяжёлого повторения «рядом с ним стояли … справа».
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: справа от него / слева
  rationale: Так естественно и точно передаётся расположение двух групп по правую и левую сторону Ездры.
- source_word: וַיַּעֲמֹד
  choice: стоял / стояли
  rationale: Форма повествует о положении Ездры и сопровождавших его людей; русский несовершенный вид естественно описывает сцену, сохраняя повтор глагола в обеих частях.
