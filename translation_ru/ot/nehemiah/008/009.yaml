  text: וַ/יֹּ֣אמֶר נְחֶמְיָ֣ה ה֣וּא הַ/תִּרְשָׁ֡תָא וְ/עֶזְרָ֣א הַ/כֹּהֵ֣ן הַ/סֹּפֵ֡ר וְ/הַ/לְוִיִּם֩ הַ/מְּבִינִ֨ים אֶת הָ/עָ֜ם לְ/כָל הָ/עָ֗ם הַ/יּ֤וֹם קָדֹֽשׁ הוּא֙ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֔ם אַל תִּֽתְאַבְּל֖וּ וְ/אַל תִּבְכּ֑וּ כִּ֤י בוֹכִים֙ כָּל הָ/עָ֔ם כְּ/שָׁמְעָ֖/ם אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: ru
  text: 'Тогда Неемия, наместник[a], Ездра — священник и книжник — и левиты, наставлявшие народ, сказали всему народу: «Этот день свят для Яхве, вашего Бога. Не скорбите и не плачьте». Ведь весь народ плакал, слушая слова Закона[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тиршафа» — административный титул персидского происхождения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слова Торы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: наместник
  rationale: Это административный титул персидского периода. «Наместник» ясно передаёт должность Неемии, тогда как транслитерация титула была бы непонятна большинству читателей.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: священник и книжник
  rationale: Оба существительных обозначают роли Ездры; перевод сохраняет оба титула, не сводя их к одному.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: левиты, наставлявшие народ
  rationale: Причастие породы хифиль от בין означает побуждать к пониманию, разъяснять или наставлять. Выбранная формулировка естественна по-русски и сохраняет просветительскую функцию левитов.
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: этот день свят
  rationale: Формулировка прямо передаёт именное сказуемое и сохраняет религиозный смысл святости.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל здесь выражает посвящённость дня Богу; «для Яхве» естественно передаёт этот смысл по-русски.
- source_word: תִּתְאַבְּלוּ
  choice: скорбите
  rationale: Глагол обозначает пребывание в трауре или выражение глубокой скорби. «Скорбите» сохраняет отличие от следующего «плачьте».
- source_word: תִּבְכּוּ / בוֹכִים
  choice: плачьте / плакал
  rationale: «Плакать» соответствует торжественно-эмоциональному контексту и естественно звучит в современном русском языке.
- source_word: כְּשָׁמְעָם
  choice: слушая
  rationale: 'Конструкция с כ обозначает одновременность: народ плакал в процессе слушания слов Закона.'
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: слова Закона
  rationale: В контексте публичного чтения заветного установления «Закон» понятно передаёт תּוֹרָה; альтернативное «Тора» сохранено в примечании.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное заветное имя יהוה. «Яхве» передаёт его как имя, не заменяя титулом и не навязывая конфессиональное толкование.
- issue: Значение תּוֹרָה в выражении דִּבְרֵי הַתּוֹרָה
  choice: Закон
  alternative: Тора; наставление
  rationale: Контекст публичного чтения текста завета поддерживает традиционное и общепонятное «Закон», однако еврейское слово шире по смыслу; поэтому вариант «Тора» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейским регистром. Единственное число еврейского וַיֹּאמֶר при составном подлежащем естественно передано русским множественным числом «сказали». Маркер [b] поставлен непосредственно после слова «Закона», к которому относится примечание.
