revisions:
- from: Тогда священник Ездра принёс Закон к собранию — к мужчинам и женщинам[a] и ко всем, кто мог понимать услышанное[b], — в первый день седьмого месяца.
  to: Тогда Ездра-священник вынес Закон перед собранием, состоявшим из мужчин, женщин и всех, кто был способен понимать услышанное[a], в первый день седьмого месяца.
  rationale: «Вынес Закон перед собранием» точно и естественно передаёт וַיָּבִיא ... לִפְנֵי הַקָּהָל. Состав собрания сформулирован по-русски плавно, без изменения охвата, заданного еврейской формулой «от мужчины до женщины» и добавлением тех, кто мог понимать при слушании. Сноски объединены под одним уместным якорем, поскольку обе поясняют состав собрания и сохраняют буквальные особенности исходного текста.
