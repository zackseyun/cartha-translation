  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: ru
  text: Тогда Ездра-священник вынес Закон перед собранием, состоявшим из мужчин, женщин и всех, кто был способен понимать услышанное[a], в первый день седьмого месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от мужчины до женщины и всех, понимающих слушать». Выражение «от мужчины до женщины» охватывает всё собрание; последняя часть указывает на тех, кто был способен осмысленно воспринимать чтение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: Тогда ... принёс
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Прямое обозначение служения Ездры, явно присутствующее в еврейском тексте.
- source_word: הַתּוֹרָה
  choice: Закон
  rationale: В контексте публичного чтения речь идёт о Моисеевом Законе; это ясно и привычно для современного русского читателя. Прописная буква указывает на конкретный священный корпус, не сужая его до отдельного предписания.
- source_word: לִפְנֵי הַקָּהָל
  choice: к собранию
  rationale: Передаёт внесение Закона в присутствие собравшихся естественным современным русским языком; «собрание» не привносит позднейших церковных оттенков слова «церковь».
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: к мужчинам и женщинам
  rationale: Естественно выражает охват обеих названных в еврейском тексте групп; буквальная конструкция сохранена в сноске.
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: и ко всем, кто мог понимать услышанное
  rationale: Фраза обозначает способность осмысленно воспринимать чтение, а не только физически слышать его.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: в первый день седьмого месяца
  rationale: Стандартная и естественная передача еврейской формулы даты.
theological_decisions:
- issue: Обозначение участников собрания по полу
  choice: к мужчинам и женщинам
  alternative: 'буквально: «от мужчины и до женщины»'
  rationale: Перевод сохраняет явно названные в исходном тексте группы, но передаёт идиому полного охвата естественно по-русски.
- issue: Передача תּוֹרָה
  choice: Закон
  alternative: Тора; наставление
  rationale: В данном контексте слово обозначает авторитетный Моисеев корпус, вынесенный для публичного чтения. «Закон» сохраняет его заветный вес и остаётся понятным широкому читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Тире отделяют разъяснение состава собрания, сохраняя ясность длинного предложения; архаизмы вроде «пред собранием» не используются.
