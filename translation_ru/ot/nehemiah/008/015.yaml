  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: ru
  text: 'и чтобы во всех их городах и в Иерусалиме возвестили и разнесли весть: «Идите в горы и принесите ветви[a] маслины, масличного дерева, мирта, пальм и других деревьев с густой листвой, чтобы сделать шалаши, как написано».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «листья маслины… листья мирта…». Здесь переведено «ветви», поскольку речь идёт о материале для постройки шалашей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: и чтобы
  rationale: Продолжает сообщение о содержании найденного в Законе предписания из предыдущего стиха; сочетание сохраняет связь с контекстом и естественно вводит требуемое действие.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: объявили и распространили весть
  rationale: Первый глагол означает «дать услышать, объявить», а идиома «провести голос» — широко распространить воззвание. Перевод сохраняет оба элемента без неестественной буквальности.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: во всех их городах и в Иерусалиме
  rationale: Точно передаёт географический охват провозглашения и отдельно называет Иерусалим.
- source_word: צְאוּ הָהָר
  choice: идите в горы
  rationale: הָהָר может обозначать гору либо гористую местность; в контексте сбора древесных ветвей естественно понимать окружающую горную местность.
- source_word: עֲלֵי
  choice: ветви
  rationale: Буквально форма означает «листья», однако перечисляются материалы для постройки шалашей; «ветви» естественно передаёт предмет, приносимый вместе с листвой. Буквальность отмечена в сноске.
- source_word: זַיִת
  choice: маслина
  rationale: Обычное современное литературное обозначение оливкового дерева, уместное в перечне пород.
- source_word: עֵץ שֶׁמֶן
  choice: масличное дерево
  rationale: Буквальное и осторожное обозначение растения; точная ботаническая идентификация спорна, поэтому возможные конкретизации не внесены в основной текст.
- source_word: הֲדַס
  choice: мирт
  rationale: Устоявшееся соответствие названию растения.
- source_word: תְמָרִים
  choice: пальма
  rationale: В сочетании с общим словом «ветви» обозначает пальмовые ветви; конкретизация «финиковая» в еврейском тексте здесь не выражена явно.
- source_word: עֵץ עָבֹת
  choice: другие густолиственные деревья
  rationale: עָבֹת указывает на густую, плотную листву. «Другие» показывает, что после названных пород следует более общая категория.
- source_word: לַעֲשֹׂת סֻכֹּת
  choice: чтобы сделать шалаши
  rationale: «Шалаши» понятно передаёт временные сооружения праздника и сохраняет связь с его предметным содержанием без архаизма «кущи».
- source_word: כַּכָּתוּב
  choice: как написано
  rationale: Прямая и традиционно понятная передача ссылки на письменное предписание Закона.
