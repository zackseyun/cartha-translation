base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: ru
  text: 'И сказал им: «Пойдите, ешьте сытные блюда, пейте сладкие напитки и посылайте угощения тем, для кого ничего не приготовлено, потому что этот день свят для нашего Господа. Не печальтесь, потому что радость Яхве[a] — ваша твердыня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение «радость Яхве» допускает различные понимания: «радость в Яхве», «радость, исходящая от Яхве» или «радость самого Яхве».'
    reason: Сохранение неоднозначности родительной конструкции חֶדְוַת יְהוָה без предпочтения одного толкования.
  - marker: b
    text: 'Или: «крепость», «защита»; еврейское слово обозначает укреплённое место, а также источник безопасности и силы.'
    reason: Пояснение образного значения מָעוֹז.
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: тучные яства
  rationale: Буквально речь идёт о жирной, обильной пище для праздничной трапезы. «Тучные яства» сохраняет образность и звучит достойно, хотя несколько возвышенно.
- source_word: מַמְתַקִּים
  choice: сладкие напитки
  rationale: Существительное обозначает сладкое; при глаголе «пейте» контекст требует напитков, но не позволяет сузить значение до вина.
- source_word: מָנוֹת
  choice: доли
  rationale: В контексте общей праздничной трапезы это выделенные части угощения, которые следует послать другим.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: тем, у кого ничего не приготовлено
  rationale: Естественно передаёт неопределённое единственное число и значение отсутствия заранее приготовленного праздничного угощения.
- source_word: קָדוֹשׁ
  choice: свят
  rationale: Стандартно передаёт посвящённость дня Богу и сохраняет богословскую значимость слова.
- source_word: לַאֲדֹנֵינוּ
  choice: для нашего Господа
  rationale: Здесь אֲדֹנֵינוּ — божественный титул «наш Господь»; предлог указывает, кому посвящён этот святой день.
- source_word: תֵּעָצֵבוּ
  choice: не печальтесь
  rationale: Передаёт эмоциональное значение глагола естественным современным русским выражением.
- source_word: חֶדְוַת יְהוָה
  choice: радость Яхве
  rationale: Формально сохраняет конструкцию еврейского текста и её смысловую неоднозначность, не решая молча, идёт ли речь о радости, исходящей от Яхве, принадлежащей Ему или переживаемой в Нём.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מָעֻזְּכֶם
  choice: ваша твердыня
  rationale: Сохраняет конкретную метафору укреплённого места, дающего защиту и силу; «сила» была бы более отвлечённой передачей.
theological_decisions:
- issue: Значение חֶדְוַת יְהוָה
  choice: радость Яхве
  alternative: радость в Яхве; радость, которую даёт Яхве; радость самого Яхве
  rationale: Родительная конструкция допускает несколько отношений. Основной текст сохраняет её краткость и богословское напряжение, а примечание перечисляет главные смысловые возможности.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и отличает его от титула אֲדֹנֵינוּ в том же стихе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Тучные яства» и «твердыня» сохраняют праздничную и метафорическую образность оригинала; синтаксис упрощён настолько, чтобы стих оставался понятным при чтении вслух.
