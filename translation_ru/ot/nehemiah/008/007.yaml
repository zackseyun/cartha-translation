base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: ru
  text: Иешуа, Бани, Шеревия, Иамин, Аккув, Шавтай, Годия, Маасея, Келита, Азария, Иозавад, Ханан, Пелая и левиты помогали народу понимать Закон[a], а народ оставался на своих местах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разъясняли народу Закон». Еврейский глагол имеет каузативное значение: левиты делали Закон понятным для народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а народ — на своём месте стояния»; возможно также: «а народ стоял на своём месте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁוּעַ ... פְּלָאיָה
  choice: Иешуа, Бани, Шеревия, Иамин, Аккув, Шавтай, Годия, Маасея, Келита, Азария, Иозавад, Ханан, Пелая
  rationale: Личные имена переданы транслитерацией в формах, привычных для русской библейской традиции, без перевода их значений.
- source_word: וְהַלְוִיִּם
  choice: и левиты
  rationale: Союз и существительное сохранены буквально. Такая передача не решает однозначно, являются ли перечисленные лица левитами или к ним присоединяется более широкая группа левитов.
- source_word: מְבִינִים אֶת־הָעָם לַתּוֹרָה
  choice: помогали народу понимать Закон
  rationale: Причастие породы hифиль от בין выражает причинение понимания. Русская конструкция естественно передаёт этот каузативный смысл, не сводя действие только к одному возможному способу — разъяснению.
- source_word: לַתּוֹרָה
  choice: Закон
  rationale: В контексте публичного чтения заветного наставления תּוֹרָה обозначает Закон, то есть Тору. Написание с прописной буквы указывает на конкретный священный корпус, оставаясь понятным современному читателю.
- source_word: וְהָעָם עַל עָמְדָם
  choice: а народ оставался на своих местах
  rationale: Еврейская идиома буквально говорит о народе «на своём месте стояния». Выбранная формулировка естественно передаёт, что слушатели не расходились и оставались там, где стояли.
