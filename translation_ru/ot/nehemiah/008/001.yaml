  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: ru
  text: И весь народ собрался как один человек[a] на площади перед Водяными воротами. Они сказали книжнику Ездре принести книгу Закона Моисея, который Яхве заповедал Израилю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как один человек»; то есть единодушно, как одно целое.'
    reason: Пояснение еврейского устойчивого выражения כְּאִישׁ אֶחָד.
lexical_decisions:
- source_word: וַיֵּאָסְפוּ כָל־הָעָם
  choice: И весь народ собрался
  rationale: Нифаль глагола אסף обозначает совместное собрание; русское единственное число согласуется с собирательным существительным «народ».
- source_word: כְּאִישׁ אֶחָד
  choice: как один человек
  rationale: Сохранён образ еврейского устойчивого выражения, подчёркивающего единство народа; по-русски оно звучит естественно и понятно.
- source_word: אֶל־הָרְחוֹב
  choice: на площади
  rationale: רְחוֹב здесь означает открытое общественное пространство, то есть городскую площадь; предлог אֶל в контексте движения передан естественной русской конструкцией.
- source_word: לִפְנֵי שַׁעַר הַמָּיִם
  choice: перед Водяными воротами
  rationale: Прямая пространственная передача; название ворот оформлено как имя собственное.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא ... לְהָבִיא
  choice: Они велели ... Ездре принести
  rationale: Буквально «сказали Ездре принести»; «велели» естественно передаёт конструкцию с инфинитивом, не добавляя оттенка просьбы.
- source_word: הַסֹּפֵר
  choice: книжнику
  rationale: Традиционное и контекстуально точное обозначение человека, сведущего в Писании и занимающего официальную должность.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: книгу закона Моисея
  rationale: סֵפֶר может обозначать книгу или свиток; «книга» сохраняет обобщённость источника, а תּוֹרָה в данном сочетании уместно передаётся словом «закон».
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־יִשְׂרָאֵל
  choice: который Яхве заповедал Израилю
  rationale: Относительное местоимение грамматически относится к «закону»; צוה с показателем прямого дополнения при «Израиле» буквально выражает то, что Яхве повелел Израилю. Русское «заповедал Израилю» сохраняет эту связь естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
theological_decisions:
- issue: Отнесение אֲשֶׁר к выражению «книга закона Моисея»
  choice: который Яхве заповедал Израилю
  alternative: которую Яхве повелел дать Израилю
  rationale: По смыслу заповедан именно закон, а не материальная книга. Мужской род относительного местоимения в русском языке делает это явным без добавления отсутствующего в еврейском тексте глагола «дать».
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Единство народа в כְּאִישׁ אֶחָד
  choice: как один человек
  alternative: единодушно
  rationale: Образное выражение оригинала сохранено, но его идиоматический смысл пояснён в сноске, чтобы не сужать смысл до буквального сравнения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис разделён на два предложения ради ясности. Термины «книжник», «закон Моисея» и «Водяные ворота» сохраняют историко-библейский колорит без архаизации.
