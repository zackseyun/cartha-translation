base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: ru
  text: 'И народ вышел, принёс ветви и сделал себе шалаши[a]: каждый — на крыше своего дома и во дворах своих домов, а также во дворах дома Божьего, на площади у Водяных ворот[b] и на площади у ворот Ефрема.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кущи», то есть временные укрытия из ветвей. Слово «шалаши» передаёт смысл еврейского סֻכּוֹת и связано с праздником Шалашей.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское רְחוֹב означает открытое общественное пространство, или площадь, обычно возле городских ворот.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: И народ вышел
  rationale: Передаёт последовательное повествование и коллективное значение הָעָם естественным современным русским языком.
- source_word: וַיָּבִיאוּ
  choice: принёс всё это
  rationale: Объект глагола подразумевается из предыдущего стиха — ветви и листва. «Всё это» делает связь ясной, не уточняя материал сверх контекста.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: сделал себе шалаши
  rationale: Согласование с собирательным «народ» естественно по-русски. «Шалаши» обозначает временные сооружения и сохраняет связь с праздником Шалашей.
- source_word: אִישׁ עַל גַּגּוֹ וּבְחַצְרֹתֵיהֶם
  choice: кто на своей крыше, кто в своём дворе
  rationale: Дистрибутивное אִישׁ передано идиоматической конструкцией «кто… кто…», объединяющей два места, относившиеся к частным жилищам. Плоская крыша подразумевается историческим контекстом, но не добавляется в текст.
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: во дворах дома Божьего
  rationale: Формально и естественно передаёт храмовые дворы и выражение בֵּית הָאֱלֹהִים без замены на более интерпретирующее «храм».
- source_word: וּבִרְחוֹב
  choice: на площади
  rationale: רְחוֹב здесь означает открытое общественное пространство, или площадь, возле ворот.
- source_word: שַׁעַר הַמַּיִם
  choice: Водяных ворот
  rationale: Естественное русское наименование городских ворот; заглавная буква отмечает собственное название.
- source_word: שַׁעַר אֶפְרָיִם
  choice: ворот Ефрема
  rationale: Прозрачно сохраняет еврейскую конструкцию принадлежности и собственное имя.
