base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: ru
  text: 'Левиты унимали[a] весь народ, говоря: «Умолкните, потому что этот день свят; не печальтесь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призывали весь народ к тишине».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не скорбите» или «не огорчайтесь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Левиты
  rationale: Устоявшееся русское название служителей из колена Левия; союз передан связью с предшествующим повествованием без излишне буквального начального «и».
- source_word: מַחְשִׁים
  choice: унимали
  rationale: 'Причастная форма описывает продолжавшееся действие: левиты побуждали плачущий народ успокоиться и соблюдать тишину. «Унимали» естественно передаёт и понудительный, и длительный оттенки.'
- source_word: לְכָל הָעָם
  choice: весь народ
  rationale: Естественная передача собирательного עָם с כָּל, относящегося ко всему собравшемуся народу.
- source_word: לֵאמֹר
  choice: говоря
  rationale: Стандартно вводит следующую прямую речь.
- source_word: הַסּוּ
  choice: Умолкните
  rationale: Повелительная форма требует прекратить шум или плач. «Умолкните» ясно выражает призыв к тишине и сохраняет торжественный, но современный регистр.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: потому что этот день свят
  rationale: כִּי вводит основание повеления; הַיּוֹם в данном контексте указывает на отмечаемый день. Краткая именная конструкция «день свят» сохраняет смысл и библейское достоинство без архаизации.
- source_word: וְאַל תֵּעָצֵבוּ
  choice: не печальтесь
  rationale: Форма выражает запрет пребывать в скорби или унынии. «Не печальтесь» сохраняет эмоциональный смысл, не сужая его до обрядового траура.
theological_decisions:
- issue: Передача קָדֹשׁ применительно к праздничному дню
  choice: свят
  alternative: священен / посвящён
  rationale: «Свят» сохраняет богословский смысл отделённости дня для Бога и соответствует устойчивой русской библейской лексике; более описательное «посвящён» излишне истолковывает термин.
- issue: Характер печали народа
  choice: не печальтесь
  alternative: не скорбите / не плачьте
  rationale: Еврейский глагол обозначает печаль или огорчение, но сам по себе не требует понимать их как обрядовый траур либо только как плач. Выбранный вариант сохраняет эту широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис прям и понятен; богословски значимое «свят» сохранено, а неоднозначность эмоционального глагола отмечена в сноске.
