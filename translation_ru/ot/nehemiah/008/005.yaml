base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: ru
  text: Ездра раскрыл книгу на виду у всего народа[a], потому что находился выше всего народа. Когда он раскрыл её, весь народ встал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свиток». Еврейское слово סֵפֶר может обозначать письменный документ в форме свитка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: раскрыл
  rationale: Обычное значение פתח — «открывать». «Раскрыл» естественно сочетается и с книгой, и со свитком, не вводя более конкретного «развернул».
- source_word: הַסֵּפֶר
  choice: книгу
  rationale: סֵפֶר обозначает письменный документ, книгу или свиток. Традиционное и понятное «книга» сохраняется в тексте, а вероятная форма свитка отмечена в сноске.
- source_word: לְעֵינֵי
  choice: перед глазами
  rationale: Буквальный зрительный образ выражения сохранён; оборот подчёркивает, что действие происходило на виду у всех.
- source_word: כָל הָעָם
  choice: всего народа / весь народ
  rationale: עָם здесь означает собравшийся народ. Повтор сохранён вслед за еврейским текстом.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: потому что стоял выше всего народа
  rationale: מֵעַל указывает на физическое положение Ездры выше собравшихся, а не на превосходство по статусу. «Стоял» делает пространственный смысл ясным по-русски.
- source_word: וּכְפִתְחוֹ
  choice: Когда он раскрыл её
  rationale: Префикс כְּ имеет временное значение «когда/как только». Местоимение «её» естественно отсылает к книге.
- source_word: עָמְדוּ
  choice: встал
  rationale: עמד значит «стоять, вставать». В данном контексте русское «встал» естественно передаёт переход народа в стоячее положение без дополнительного толкования.
