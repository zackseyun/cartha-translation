base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: ru
  text: 'Ездра благословил Яхве, великого Бога, а весь народ, подняв руки, ответил: «Аминь! Аминь!»[a] Затем они склонились и поклонились Яхве лицами до земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Аминь» — еврейское слово, выражающее подтверждение и согласие; повторение усиливает этот богослужебный ответ.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: благословил
  rationale: Порода пиэль глагола ברך при Боге как объекте означает обращённое к Богу благословение, включающее хвалу. «Благословил» сохраняет лексическую форму и привычный библейский оборот.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: великого Бога
  rationale: Естественно передаёт приложение, определяющее Яхве как великого Бога.
- source_word: וַיַּעֲנוּ
  choice: ответил
  rationale: Глагол обозначает словесный ответ народа; единственное число согласовано с собирательным существительным «народ».
- source_word: אָמֵן אָמֵן
  choice: Аминь! Аминь!
  rationale: Сохраняет традиционную литургическую транслитерацию и эмфатическое повторение.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: подняв руки
  rationale: Естественно выражает сопутствующий жест, буквально связанный с поднятием их рук.
- source_word: וַיִּקְּדוּ
  choice: склонились
  rationale: Передаёт отдельное действие — низкое склонение тела — не сливая его со следующим глаголом поклонения.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: поклонились
  rationale: В данном контексте глагол обозначает телесное поклонение как акт почитания; русский глагол сохраняет и физический, и богослужебный смысл.
- source_word: אַפַּיִם אָרְצָה
  choice: лицом до земли
  rationale: Передаёт идиому полной простёртости лицом к земле в естественной библейской русской формулировке.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон; «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Значение ברך при Боге как объекте
  choice: благословил
  alternative: восхвалил
  rationale: «Благословил» сохраняет исходную лексику и богословское напряжение библейского выражения, тогда как «восхвалил» уже истолковывает его.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; последовательность жестов и поклонения сохранена.
