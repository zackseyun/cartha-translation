  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: ru
  text: Но они — Твои слуги и Твой народ, которых Ты искупил[a] Своей великой силой и Своей крепкой рукой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкупил», «освободил» или «избавил»; еврейский глагол может означать освобождение через выкуп или избавляющее действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «могучей рукой»; буквально: «крепкой рукой» — устойчивый образ Божьего могущественного действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Но они
  rationale: 'Союз связывает стих с предшествующей молитвой и в контексте имеет лёгкий противительный оттенок: несмотря на грех и рассеяние, израильтяне остаются принадлежащими Богу.'
- source_word: עֲבָדֶיךָ
  choice: Твои слуги
  rationale: Слово עבד может означать раба или слугу, но здесь на первом плане отношения народа с Богом; «слуги» естественно передаёт этот смысл без акцента на социальном рабстве.
- source_word: וְעַמֶּךָ
  choice: и Твой народ
  rationale: Сохранено прямое обозначение народа как принадлежащего Богу; единственное число соответствует собирательному значению еврейского עם.
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение согласовано с ближайшим собирательным существительным «народ», при этом придаточное по смыслу относится к тем же людям, названным слугами и народом.
- source_word: פָּדִיתָ
  choice: Ты искупил
  rationale: Глагол פדה обозначает освобождение, достигаемое выкупом или избавительным действием. «Искупил» сохраняет заветное и исходное звучание, не уточняя сверх текста способ искупления.
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: Своей великой силой
  rationale: כח означает силу или мощь, а предлог ב выражает средство действия; русское «Своей великой силой» звучит естественно и точно.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: и Своей крепкой рукой
  rationale: 'Сохранён прозрачный антропоморфный образ еврейского текста: Божья «рука» обозначает Его действенную силу, а חֲזָקָה буквально характеризует её как крепкую или сильную.'
theological_decisions:
- issue: Искупительная лексика в молитве Неемии
  choice: искупил
  alternative: освободил; избавил; выкупил
  rationale: Фраза напоминает об исходе как о Божьем заветном избавлении. «Искупил» сохраняет богословскую насыщенность פדה, не привнося в стих более поздних доктринальных уточнений.
- issue: Образ Божьей руки
  choice: крепкой рукой
  alternative: могучей рукой; сильной рукой
  rationale: Перевод сохраняет образ исходного текста и не превращает его в отвлечённое указание на могущество; сноска отмечает естественную лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской торжественностью. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис прост и доступен; сохранены ключевые образы исходного текста.
