  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: ru
  text: Пусть же ухо Твоё будет внимательным, и глаза Твои будут открыты, чтобы услышать молитву раба Твоего, которую я ныне возношу перед Тобою день и ночь за сынов Израиля[a], рабов Твоих, исповедуя грехи сынов Израиля, которые мы совершили против Тебя. И я, и дом отца моего согрешили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ Израиля»; «израильтяне». Буквально: «сыны Израиля» — семейно-заветное обозначение народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי נָא
  choice: Пусть же ... будет
  rationale: Юссив с נָא выражает почтительную мольбу; частица «же» естественно передаёт просительный оттенок в возвышенной русской речи.
- source_word: אָזְנְךָ קַשֶּׁבֶת וְעֵינֶיךָ פְתֻחוֹת
  choice: ухо Твоё будет внимательно и глаза Твои открыты
  rationale: Сохранены единственное число «ухо», множественное «глаза» и антропоморфный параллелизм молитвенной формулы.
- source_word: לִשְׁמֹעַ אֶל תְּפִלַּת עַבְדְּךָ
  choice: чтобы услышать молитву раба Твоего
  rationale: Инфинитив передан целевым оборотом; «раб» соответствует почтительному самообозначению молящегося перед Богом.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ הַיּוֹם יוֹמָם וָלַיְלָה
  choice: с которой я ныне обращаюсь к Тебе день и ночь
  rationale: Причастная форма передаёт продолжающееся действие; «ныне» сохраняет временную силу הַיּוֹם, а «день и ночь» — непрестанность молитвы. «Обращаюсь к Тебе» естественно передаёт молитву перед Божьим лицом.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: о сынах Израиля, рабах Твоих
  rationale: עַל в данном контексте обозначает предмет и тех, за кого возносится молитва; буквальный семейно-заветный образ «сыны Израиля» сохранён.
- source_word: וּמִתְוַדֶּה
  choice: исповедуя
  rationale: Деепричастие передаёт действие, совершаемое одновременно с молитвой, без излишнего разрыва синтаксиса.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: которыми мы согрешили против Тебя
  rationale: Относительное местоимение согласовано с «грехами», а לָךְ в этическом контексте передано как «против Тебя».
- source_word: וַאֲנִי וּבֵית אָבִי חָטָאנוּ
  choice: И я, и дом отца моего согрешили
  rationale: Сохранены личное включение Неемии и библейский семейно-родовой оборот «дом отца моего»; союз не переистолкован как усилительное «даже».
theological_decisions:
- issue: Антропоморфные образы Божьего уха и глаз
  choice: Сохранить прямые телесные образы
  alternative: 'Передать обобщённо: «будь внимателен к молитве»'
  rationale: Исходный текст намеренно выражает Божью внимательность посредством параллельных антропоморфных образов; их устранение обеднило бы риторику молитвы.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: «сыны Израиля»
  alternative: «народ Израиля» или «израильтяне»
  rationale: Так сохраняется буквальная семейно-заветная формула, при этом сноска поясняет её обычный коллективный смысл.
- issue: Связь личного и коллективного исповедания
  choice: Сохранить «мы согрешили», а затем отдельно «И я, и дом отца моего согрешили»
  alternative: Слить обе формулы в одно обобщённое признание
  rationale: Повтор подчёркивает, что Неемия не отделяет себя и свой род от общей вины; текстовая напряжённость коллективного и личного признания сохранена.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как уместная русская издательская конвенция; архаическая грамматика и чрезмерно церковнославянская лексика избегаются.
