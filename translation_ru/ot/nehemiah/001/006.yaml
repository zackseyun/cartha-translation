  to: Пусть же ухо Твоё будет внимательным, и глаза Твои будут открыты, чтобы услышать молитву раба Твоего, которую я ныне возношу перед Тобою день и ночь за сынов Израиля[a], рабов Твоих, исповедуя грехи сынов Израиля, которые мы совершили против Тебя. И я, и дом отца моего согрешили.
