    rationale: Он описывает обращение к Богу посредством молитвы, тогда как оригинал характеризует саму молитву как совершаемую перед Богом. «Которую я ныне возношу перед Тобою» передаёт и молитвенное действие, и направленность/присутствие перед Богом.
