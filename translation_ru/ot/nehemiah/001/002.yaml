base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: ru
  text: И пришёл Ханани, один из моих братьев, с несколькими людьми из Иудеи. Я расспросил их об иудеях[a] — уцелевших[b], тех, кто остался после плена[c], — и об Иерусалиме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об иудеях (евреях)». Еврейское слово может обозначать как жителей и выходцев из Иудеи, так и еврейский народ в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «об оставшихся в живых» или «об остатке».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «после изгнания». Еврейское слово может означать плен или изгнание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Повествовательная форма от בוא обозначает завершённое прибытие; «пришёл» естественно передаёт движение к месту, где находился Неемия.
- source_word: חֲנָנִי
  choice: Ханани
  rationale: Личное имя передано транслитерацией в соответствии с еврейским звучанием.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: один из моих братьев
  rationale: Формулировка сохраняет прямое семейное значение אח; более широкое «родственников» текстом не требуется.
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: с несколькими людьми из Иудеи
  rationale: Русское «с» естественно выражает сопровождение Ханани; «несколькими» передаёт неопределённое множество, не задавая точного числа.
- source_word: וָאֶשְׁאָלֵם
  choice: я расспросил их
  rationale: В контексте выяснения положения людей и города «расспросил» звучит естественно и передаёт содержательный запрос, обозначенный שאל.
- source_word: הַיְּהוּדִים
  choice: об иудеях
  rationale: «Иудеи» сохраняет связь обозначения народа с Иудеей и уместно для персидского периода; возможное более широкое значение отмечено в сноске.
- source_word: הַפְּלֵיטָה אֲשֶׁר נִשְׁאֲרוּ
  choice: спасшихся и оставшихся
  rationale: 'Сочетание сохраняет оба элемента оригинала: группу избежавших бедствия и последующее указание на тех, кто остался.'
- source_word: מִן הַשֶּׁבִי
  choice: после плена
  rationale: В данном сочетании מן может обозначать исходную ситуацию, пережитую уцелевшими; «после плена» естественно по-русски, тогда как буквальное «из плена» могло бы создать впечатление индивидуального побега.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: и об Иерусалиме
  rationale: 'Сохраняется параллельность двух тем расспроса: люди и город.'
