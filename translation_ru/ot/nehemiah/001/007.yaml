base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: ru
  text: Мы тяжко согрешили против Тебя и не соблюдали заповедей, постановлений и судебных установлений[a], которые Ты заповедал Моисею, Твоему рабу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «законов», «судебных решений» или «правовых норм». Еврейское слово может обозначать судебные установления, решения по делам или нормы для конкретных случаев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: тяжко согрешили
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает признание виновности. В контексте покаянной молитвы «тяжко согрешили» естественно передаёт пагубность и крайнюю степень проступка, не воспроизводя неестественный для русского языка повтор.
- source_word: לָךְ
  choice: против Тебя
  rationale: Предлог обозначает направленность проступка по отношению к Богу; «против Тебя» ясно передаёт нарушение верности Ему.
- source_word: וְלֹא שָׁמַרְנוּ
  choice: и не соблюдали
  rationale: Глагол שׁמר применительно к заповедям означает соблюдать, исполнять; «соблюдали» естественно сочетается со всеми тремя последующими правовыми терминами.
- source_word: הַמִּצְוֺת
  choice: заповеди
  rationale: Термин обозначает предписанные Богом повеления и сохраняет библейский заветно-правовой оттенок.
- source_word: הַחֻקִּים
  choice: постановления
  rationale: Слово указывает на установленные предписания; «постановления» отличает его от заповедей и законов.
- source_word: הַמִּשְׁפָּטִים
  choice: законы
  rationale: Множественное מִשְׁפָּטִים может обозначать судебные нормы, правовые решения или установления. «Законы» понятно современному читателю и сохраняет правовой смысл; возможная судебная окраска отмечена в сноске.
- source_word: צִוִּיתָ
  choice: Ты дал
  rationale: Хотя глагол буквально означает «повелел», по-русски заповеди, постановления и законы естественно «дают». Такой выбор избегает тяжеловесного «которые Ты заповедал», сохраняя источник и обязательность предписаний.
- source_word: עַבְדֶּךָ
  choice: рабу Твоему
  rationale: В русской библейской речи «раб Твой» — понятный и достойный титул Моисея как принадлежащего Богу и служащего Ему; здесь он не сводится к описанию общественного статуса.
theological_decisions:
- issue: Различение трёх обозначений Торы
  choice: заповеди, постановления и законы
  alternative: повеления, уставы и судебные решения
  rationale: Еврейский текст намеренно употребляет три разных правовых термина. Перевод сохраняет трёхчленную структуру и смысловые различия, не закрепляя за каждым словом узкую конфессиональную категорию.
- issue: Характер признанного проступка
  choice: тяжко согрешили против Тебя
  alternative: поступили крайне пагубно по отношению к Тебе
  rationale: Контекст молитвы ясно представляет поступок как вину перед Богом. Формулировка передаёт нравственно-религиозную силу признания, не утверждая сверх того, означает ли корень прежде всего развращённость поведения или причинение ущерба отношениям завета.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как редакционная норма русского религиозного текста. Усилительная еврейская конструкция передана наречием «тяжко», а три правовых термина сохранены раздельно.
