base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: ru
  text: 'Они сказали мне: «Оставшиеся, которые уцелели из плена[a] и находятся там, в провинции, — в великой беде и позоре[b]. Стена Иерусалима проломлена, а его ворота сожжены огнём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из изгнания». Еврейское выражение может быть переведено как «из плена» или «из изгнания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в великом бедствии и поношении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ
  choice: Оставшиеся, которые уцелели
  rationale: Сочетание сохраняет коллективное значение «оставшихся» и повтор корня שׁאר, передавая второй глагол естественным русским словом «уцелели».
- source_word: מִן הַשְּׁבִי
  choice: после плена
  rationale: В контексте речь идёт о людях, оставшихся после катастрофы плена и переселения. Формулировка естественна по-русски, а возможное значение «изгнание» отмечено в сноске.
- source_word: בַּמְּדִינָה
  choice: в провинции
  rationale: В персидский период מְדִינָה обозначает административную провинцию; это прямой исторический эквивалент.
- source_word: בְּרָעָה גְדֹלָה
  choice: в великой беде
  rationale: רָעָה здесь означает тяжёлое бедствие, а не нравственное зло. «В великой беде» ясно и естественно передаёт состояние народа.
- source_word: וּבְחֶרְפָּה
  choice: и унижении
  rationale: חֶרְפָּה выражает публичный позор, поругание и утрату чести; «унижение» понятно современному читателю и сохраняет социальный оттенок.
- source_word: חוֹמַת יְרוּשָׁלִַם מְפֹרָצֶת
  choice: Стена Иерусалима проломлена
  rationale: Причастие от פרץ указывает на пробитую, имеющую проломы городскую стену. «Проломлена» точнее общего «разрушена».
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: а его ворота сожжены огнём
  rationale: Перевод сохраняет образ и явное упоминание огня; местоимение «его» относится к Иерусалиму, как и суффикс женского рода в еврейском.
- source_word: וַיֹּאמְרוּ לִי
  choice: Они сказали мне
  rationale: Простая повествовательная формула без добавления временного или причинного оттенка.
