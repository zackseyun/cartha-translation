  source_fidelity: 'Основной смысл передан верно: это почтительная просьба вспомнить сказанное, обращённая к Богу; сохранены Моисей как Божий слуга, условие неверности и угроза рассеяния среди народов. Однако «же» не вполне передаёт просительную частицу נָא, а «поступите неверно» ослабляет оттенок нарушения верности, присущий מעל.'
