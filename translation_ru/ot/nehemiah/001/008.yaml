  terminology: «Слово», «заповедал», «рассею» и «народы» уместны. «Нарушите верность» лучше выражает заветно-реляционный смысл מעל, не навязывая конкретного догматического истолкования. Сноски в русском проекте стоят у соответствующих слов и, в отличие от ошибочно смещённых якорей в английском аудиторском тексте, структурно корректны.
