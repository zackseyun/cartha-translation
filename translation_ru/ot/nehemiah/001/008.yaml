base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: ru
  text: 'Вспомни, прошу Тебя, слово, которое Ты заповедал Моисею, Твоему слуге, сказав: «Если вы нарушите верность[a], Я рассею вас среди народов[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступите неверно»; «окажетесь неверными».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди племён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Вспомни же
  rationale: Императив זְכָר означает «вспомни», а частица נָא выражает почтительную просьбу. В молитвенном контексте «же» передаёт настойчивое моление естественнее, чем разговорное «пожалуйста».
- source_word: הַדָּבָר
  choice: слово
  rationale: דָּבָר здесь обозначает конкретно сказанное Богом через Моисея; «слово» сохраняет форму и смысл исходного выражения.
- source_word: צִוִּיתָ
  choice: Ты заповедал
  rationale: צוה прямо означает повелевать, заповедовать. «Заповедал» уместно для данного контекста передачи Божьего повеления через Моисея.
- source_word: עַבְדְּךָ
  choice: рабу Твоему
  rationale: В библейском русском «раб Твой» естественно обозначает Моисея как преданного служителя Бога, не сводя выражение к социальному рабству.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Стандартно вводит содержание предшествующего повеления или высказывания.
- source_word: תִּמְעָלוּ
  choice: поступите неверно
  rationale: Глагол מעל обозначает неверность и нарушение доверия, особенно в отношениях завета. Этот перевод сохраняет деятельный характер глагола и не сужает его до общего понятия греха.
- source_word: אָפִיץ
  choice: Я рассею
  rationale: Форма Hiphil от פוץ означает «рассеять, разбросать»; «рассею» естественно передаёт угрозу суда.
- source_word: בָּעַמִּים
  choice: среди народов
  rationale: Множественное עַמִּים буквально означает «народы» и подчёркивает рассеяние среди разных этнических общностей.
theological_decisions:
- issue: Заветный оттенок מעל в условной части
  choice: Если вы поступите неверно
  alternative: Если вы окажетесь неверны; если вы нарушите верность
  rationale: Формулировка передаёт нарушение верности в отношениях завета, но не добавляет в основной текст более узкое толкование, чем позволяет еврейский глагол.
- issue: Условное значение бессоюзной начальной клаузы אַתֶּם תִּמְעָלוּ
  choice: Если вы поступите неверно
  alternative: Вы поступите неверно — и Я рассею вас
  rationale: Контекст воспоминания о Моисеевых предупреждениях поддерживает условное понимание; при этом перевод не уточняет вид или степень неверности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Сохранены «слово», «заповедал» и традиционное обращение «раб Твой», но синтаксис остаётся понятным современному читателю.
