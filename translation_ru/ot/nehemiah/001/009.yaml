review_pass:
  verdict: revise
  source_fidelity: 'Смысл условного обещания передан верно: возвращение, соблюдение и исполнение заповедей, собирание изгнанных с крайней дали и приведение к избранному месту. Однако «изгнанные из вас» неудачно передаёт суффикс второго лица: еврейский текст говорит о «ваших изгнанниках/изгнанных», а не о людях, изгнанных из числа адресатов. В заключительной формуле предпочтительно сохранить образ пребывания имени, не делая «имя» неестественным прямым объектом глагола «поселить».'
  naturalness: «Изгнанные из вас» в современном русском двусмысленно и может означать исключённых из общины. «Ваши изгнанники» ясно и естественно обозначает рассеянных или изгнанных людей народа. Формула «чтобы Моё имя пребывало там» литературна, понятна и сохраняет умеренно возвышенный библейский регистр.
  terminology: «Соблюдать ... заповеди и исполнять их», «соберу», «приведу», «избрал» удачны. «Ваши изгнанники» сохраняет пассивный смысл נִדַּחֲכֶם; альтернативы «рассеянные» и «изгнанные» следует отметить. Для לְשַׁכֵּן אֶת־שְׁמִי שָׁם сохранён образ пребывания Божьего имени в избранном месте без богословского уточнения.
