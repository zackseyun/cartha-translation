    rationale: В проекте не отмечена лексическая альтернатива к נִדַּחֲכֶם, а примечание о «краю небес» использует маркер a, тогда как примечание о формуле имени — b. Для прозрачности следует отдельно привязать примечания к «изгнанникам», «краю небес» и заключительной формуле.
