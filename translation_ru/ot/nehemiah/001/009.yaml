base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: ru
  text: Но если вы вернётесь ко Мне, будете соблюдать Мои заповеди и исполнять их, то, даже если ваши изгнанники[a] окажутся на краю небес[b], Я соберу их оттуда и приведу на место, которое Я избрал, чтобы Моё имя пребывало там[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши рассеянные»; буквально: «ваши изгнанные».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на краю небес» — образ предельно далёкого места.'
    reason: cultural_note
  - marker: c
    text: 'Или: «чтобы утвердить там Моё имя». В еврейском тексте сохранён образ имени Бога, пребывающего в избранном Им месте.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: но если вы вернётесь ко Мне
  rationale: Глагол שׁוּב с אֶל означает «вернуться, обратиться обратно к». Условное «если» восстанавливается из продолжающейся конструкции предыдущего стиха, а «но» передаёт контраст.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי וַעֲשִׂיתֶם אֹתָם
  choice: будете соблюдать Мои заповеди и исполнять их
  rationale: 'Сохранены оба элемента еврейского выражения: хранить/соблюдать заповеди и делать/исполнять их, без сведения их к одному действию.'
- source_word: נִדַּחֲכֶם
  choice: изгнанные из вас
  rationale: Форма от נדח обозначает людей, которых изгнали или рассеяли. Конструкция с местоименным суффиксом буквально относится к «вашим изгнанным»; по-русски «изгнанные из вас» естественно передаёт принадлежность к народу и пассивный смысл.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: на краю небес
  rationale: Близкий к форме оригинала перевод сохраняет пространственно-космический образ предельно далёкого места.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: Я соберу их оттуда
  rationale: קבץ — обычный глагол собирания рассеянного народа; порядок слов сделан естественным для современного русского.
- source_word: וַהֲבֹאתִים
  choice: и приведу
  rationale: Каузативная форма בוא естественно передаётся русским «приведу».
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: на место, которое избрал
  rationale: בחר обозначает Божий выбор места святилища. Подлежащее «Я» ясно из контекста и формы глагола, поэтому не повторяется ради естественности.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: чтобы поселить там Моё имя
  rationale: Сохранён каузативный смысл שכן и образ пребывающего в избранном месте Божьего имени; перевод не сводит формулу ни к памятному обозначению, ни к пространственному ограничению Бога.
theological_decisions:
- issue: Формула Божьего присутствия в святилище
  choice: чтобы поселить там Моё имя
  alternative: чтобы утвердить там Моё имя
  rationale: Оригинал использует формулу о пребывании имени Бога в избранном месте. «Поселить» сохраняет образ обитания и напряжение между особым присутствием Бога и Его непространственной природой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, даны с прописной буквы. Синтаксис условного периода сделан прозрачным, при этом повтор «соблюдать… и исполнять» и образ «поселить имя» сохранены.
