  variant: modern literary Russian
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: ru
  text: 'И сказал я: «Молю Тебя, Яхве, Боже небес, великий и внушающий трепет Бог[a], хранящий завет и неизменную любовь[b] к тем, кто любит Тебя и соблюдает Твои заповеди»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великий и грозный Бог».'
    reason: Лексема נורא может обозначать того, кто внушает страх или благоговейный трепет.
  - marker: b
    text: 'Или: «верность завету»; также возможно: «милость».'
    reason: Еврейское חֶסֶד включает оттенки преданной любви, верности и милости, особенно в контексте завета.
lexical_decisions:
- source_word: וָאֹמַר
  choice: И сказал я
  rationale: Форма wayyiqtol продолжает повествование и вводит молитву Неемии; такой порядок слов сохраняет повествовательную связь и звучит естественно в торжественной речи.
- source_word: אָנָּא
  choice: Молю Тебя
  rationale: Частица выражает почтительную и настойчивую просьбу. «Молю Тебя» естественно для русской молитвенной речи и не архаизирует текст чрезмерно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Боже небес
  rationale: В звательном обращении «Боже небес» точно и естественно передаёт конструкцию «Бог небес».
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: великий и внушающий трепет Бог
  rationale: Сохраняется отдельное наименование Бога и смысл נורא как Того, Кто вызывает благоговейный страх; «внушающий трепет» избегает как ослабленного, так и чрезмерно угрожающего оттенка.
- source_word: שֹׁמֵר הַבְּרִית
  choice: хранящий завет
  rationale: Причастная конструкция и устойчивая библейская категория завета переданы прямо.
- source_word: וָחֶסֶד
  choice: и неизменную любовь
  rationale: В сочетании с «заветом» חֶסֶד обозначает стойкую, верную любовь; «неизменная любовь» понятно передаёт её постоянство, не сводя значение лишь к милости.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: к тем, кто любит Тебя и соблюдает Твои заповеди
  rationale: Параллельные причастные обороты объединены в естественную русскую конструкцию без утраты их координации.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это отличие от титула.
- issue: Значение חֶסֶד в заветном контексте
  choice: неизменная любовь
  alternative: верность завету; милость; преданная любовь
  rationale: Сочетание с בְּרִית подчёркивает постоянную, верную любовь. Выбранный вариант сохраняет как личностный аспект любви, так и её стойкость, не отождествляя два стоящих рядом понятия.
- issue: Значение נורא применительно к Богу
  choice: внушающий трепет
  alternative: грозный; страшный
  rationale: Слово допускает оттенок страха, но в молитвенном славословии также выражает благоговение. Основной текст сохраняет эту широту, а более резкий вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Синтаксис сохраняет незавершённость обращения, поскольку молитвенная просьба продолжается в следующем стихе. Местоимения, относящиеся к Богу, написаны с прописной буквы как уместный элемент молитвенного регистра.
