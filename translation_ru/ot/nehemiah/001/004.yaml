base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: ru
  text: Когда я услышал эти слова[a], я сел, заплакал и несколько дней скорбел; я постился и молился перед Богом небес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обо всём этом». Еврейское слово דְּבָרִים может означать «слова», «дела» или «обстоятельства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: Когда я услышал
  rationale: Обычная повествовательно-временная конструкция естественно передаётся придаточным времени; отдельное «и случилось» по-русски было бы тяжеловесным.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: דְּבָרִים может обозначать слова, дела или обстоятельства; здесь речь идёт о содержании только что услышанного сообщения.
- source_word: יָשַׁבְתִּי וָאֶבְכֶּה
  choice: я сел, заплакал
  rationale: Передаёт последовательность непосредственных телесной и эмоциональной реакций; «заплакал» естественнее в современном русском повествовании, чем более книжное «возрыдал».
- source_word: וָאֶתְאַבְּלָה יָמִים
  choice: несколько дней был в скорби
  rationale: אבל обозначает продолжающийся траур или скорбь, а неопределённое יָמִים — некоторый период в несколько дней; формулировка сохраняет длительность без чрезмерно буквального «скорбел днями».
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: я постился и молился
  rationale: Связка היה с причастиями выражает длительное действие; русский несовершенный вид естественно передаёт эту продолжительность без громоздкого «был постящимся и молящимся».
- source_word: לִפְנֵי אֱלֹהֵי הַשָּׁמָיִם
  choice: перед Богом небес
  rationale: «Перед» сохраняет значение присутствия, а «Бог небес» — характерный для Ездры—Неемии божественный титул, не подменяя его именем Яхве.
theological_decisions:
- issue: Передача титула אֱלֹהֵי הַשָּׁמָיִם
  choice: Бог небес
  alternative: небесный Бог
  rationale: Конструкция является титулом «Бог небес». Вариант «небесный Бог» мог бы восприниматься как общее качественное описание и ослабить форму исходного титула.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Несовершенные виды «постился и молился» естественно выражают длительность еврейской конструкции. Точка с запятой разграничивает скорбь и последовавшие пост с молитвой, не разрывая единой реакции Неемии.
