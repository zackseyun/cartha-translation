  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: ru
  text: Слова Неемии, сына Ахалии[a]. И вот, в месяце кислеве, в двадцатый год[b], я находился в Сузах, в цитадели[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Рассказ Неемии, сына Ахалии». Еврейское заглавие «Слова…» может вводить повествовательную запись или воспоминания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в год двадцатый». В этом стихе прямо не сказано, чей год царствования имеется в виду; из дальнейшего контекста становится ясно, что речь идёт об Артаксерксе.'
    reason: cultural_note
  - marker: c
    text: 'Или: «в Сузах, в крепости». Еврейское слово обозначает укреплённый царский комплекс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Слова
  rationale: Сохраняет форму еврейского заглавия, которое может обозначать как слова, так и повествовательную запись; возможное значение пояснено в сноске.
- source_word: נְחֶמְיָה בֶּן חֲכַלְיָה
  choice: Неемии, сына Ахалии
  rationale: Использованы укоренившиеся в русской библейской традиции формы личных имён и естественная русская родословная конструкция.
- source_word: וַיְהִי
  choice: не передано отдельной формулой
  rationale: Еврейская повествовательная формула вводит обстоятельства рассказа; в современном русском её функцию естественно передаёт начало датировочной фразы без архаического «и было».
- source_word: בְחֹדֶשׁ כסלו
  choice: В месяце кислеве
  rationale: Название еврейского месяца транслитерировано; падежная форма делает датировку естественной по-русски.
- source_word: שְׁנַת עֶשְׂרִים
  choice: в двадцатый год
  rationale: 'Сохранена неполнота еврейской датировки: в самом стихе не назван правитель, от царствования которого ведётся отсчёт.'
- source_word: וַאֲנִי הָיִיתִי
  choice: я находился
  rationale: Естественно выражает местонахождение рассказчика в данный момент, не добавляя причинной или иной связи.
- source_word: בְשׁוּשַׁן הַבִּירָה
  choice: в крепости Сузы
  rationale: בִּירָה обозначает укреплённый царский комплекс; конструкция «крепость Сузы» передаёт место и его характер без трактовки слова как «столица».
