  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: ru
  text: Прошу, Господь, пусть ухо Твоё будет внимательным к молитве раба Твоего и к молитве рабов Твоих, которые желают бояться имени Твоего[a]. Даруй же сегодня успех рабу Твоему и сделай так, чтобы этот человек оказал ему милость[b][c]. А я был виночерпием при царе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые находят радость в том, чтобы благоговеть перед именем Твоим». Древнееврейское выражение может передавать как желание, так и удовольствие; «бояться» здесь включает благоговение перед Богом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и даруй ему благосклонность этого человека». Буквально древнееврейский оборот говорит о том, чтобы дать ему «милосердие» перед этим человеком.'
    reason: lexical_alternative
  - marker: c
    text: «Этот человек» — царь, при котором Неемия, как поясняется далее, служил виночерпием.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא
  choice: О
  rationale: Частица настойчивой мольбы. В сочетании с обращением «Господь» русское «О Господь» естественно передаёт эмоциональную настойчивость без архаического «молю».
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Божественный титул в прямом обращении; это не тетраграмматон.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: пусть ухо Твоё будет внимательным
  rationale: Сохранён древнееврейский образ уха и одновременно ясно выражена просьба благосклонно услышать молитву.
- source_word: תְּפִלַּת עַבְדְּךָ / עֲבָדֶיךָ
  choice: молитве раба Твоего / молитве рабов Твоих
  rationale: «Раб» сохраняет смиренное самообозначение молящегося перед Богом и последовательность единственного и множественного числа.
- source_word: הַחֲפֵצִים
  choice: которые желают
  rationale: Глагол допускает значения желания и удовольствия. «Желают» естественно сочетается с инфинитивом «бояться» и не снимает положительной направленности воли.
- source_word: לְיִרְאָה אֶת שְׁמֶךָ
  choice: бояться имени Твоего
  rationale: Сохранена богословски значимая библейская формулировка, включающая благоговение и страх.
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: Даруй же сегодня успех рабу Твоему
  rationale: Каузативная форма просит Бога обеспечить успех; «даруй успех» звучит естественно и достойно в русской молитве.
- source_word: וּתְנֵהוּ לְרַחֲמִים לִפְנֵי הָאִישׁ הַזֶּה
  choice: сделай так, чтобы этот человек отнёсся к нему с милосердием
  rationale: 'Раскрыт древнееврейский идиоматический оборот «дай его для милосердия перед этим человеком»: Неемия просит вызвать к нему милосердное отношение со стороны царя.'
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: А я был виночерпием у царя
  rationale: Краткое повествовательное пояснение передано традиционным и понятным обозначением придворной должности.
theological_decisions:
- issue: Значение עבד в молитвенном обращении
  choice: раб
  alternative: слуга
  rationale: В русском библейском и молитвенном регистре «раб Твой» естественно передаёт смиренное отношение к Богу, не вводя здесь специального акцента на юридическом рабстве.
- issue: Значение ירא применительно к имени Бога
  choice: бояться имени Твоего
  alternative: благоговеть перед именем Твоим
  rationale: Основной текст сохраняет напряжение между страхом и благоговением, не сводя древнееврейское слово только к почтению.
- issue: Смысл לְרַחֲמִים перед человеком
  choice: отнёсся к нему с милосердием
  alternative: оказал ему благосклонность
  rationale: Выбрано значение сострадания и милости, присутствующее в רחמים; более общее значение благосклонности отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Сохранены библейские образы «ухо Твоё» и «бояться имени Твоего»; синтаксис идиомы о милосердии слегка раскрыт ради ясности. Местоимения, относящиеся к Богу, написаны с прописной буквы как уместная стилистическая норма религиозного текста.
