- source_word: וּבְנֹתֶיהָ
  choice: с зависевшими от неё селениями
  rationale: Буквально «и её дочерями»; применительно к городу это устойчивое обозначение подчинённых ему небольших поселений. Формулировка раскрывает географический смысл и сохраняет женский референт суффикса — Беэр-Шеву.
