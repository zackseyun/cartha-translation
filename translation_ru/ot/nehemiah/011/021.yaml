  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: ru
  text: Храмовые служители[a] жили на Офеле, а Циха и Гишпа руководили храмовыми служителями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. נְתִינִים (нетини́м) — особое название группы людей, назначенных для служения при храме; буквально — «отданные».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Техническое послепленное обозначение особой группы людей, назначенных для служения при храме. Функциональный перевод понятен современному читателю и сохраняет институциональный смысл.
- source_word: יֹשְׁבִים
  choice: жили
  rationale: Причастие от ישב обозначает продолжающееся проживание; русское несовершенное «жили» естественно передаёт этот смысл.
- source_word: בָּעֹפֶל
  choice: на Офеле
  rationale: עֹפֶל — топоним и название возвышенного укреплённого участка Иерусалима; предлог ב с артиклем здесь естественно передаётся как «на».
- source_word: צִיחָא
  choice: Циха
  rationale: Собственное имя передано транслитерацией, соответствующей еврейской форме.
- source_word: גִשְׁפָּא
  choice: Гишпа
  rationale: Собственное имя передано транслитерацией, соответствующей еврейской форме.
- source_word: עַל
  choice: руководили
  rationale: В административном контексте עַל выражает власть или надзор. «Руководили» ясно и естественно передаёт подразумеваемую конструкцию «были над».
