translation_notes:
  register: Современный литературный русский язык с достоинством родословного перечня. Эллиптическое «Вот потомки…» естественно передаёт вводную формулу, а последовательное «сын… сына…» сохраняет структуру еврейской генеалогической цепочки. Маркеры сносок помещены непосредственно при тех выражениях, к которым относятся.
