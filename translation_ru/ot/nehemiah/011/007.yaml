base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: ru
  text: 'И вот потомки Вениамина[a]: Саллу, сын Мешуллама, сына Иоэда[b], сына Федаии, сына Колаии, сына Маасеи, сына Итиэля, сына Иешаи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Вениамина»; в данном контексте это выражение может также означать потомков Вениамина, то есть вениамитян.'
    reason: lexical_alternative
  - marker: b
    text: Здесь в масоретском тексте стоит имя «Иоэд»; в параллельной родословной, в 1 Пар. 9:7, — «Годавия».
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Так естественно вводится новый раздел перечня по-русски; союз ו передаёт связь с предшествующим контекстом, не требуя буквального «и».
- source_word: בְּנֵי בִנְיָמִן
  choice: потомки Вениамина
  rationale: В племенном и родословном перечне בָּנִים может обозначать не только непосредственных сыновей, но и потомков; этот смысл здесь естественнее, а буквальная форма отмечена в сноске.
- source_word: סַלֻּא
  choice: Саллу
  rationale: Русская передача еврейского личного имени.
- source_word: בֶּן
  choice: сын / сына
  rationale: В начале цепочки употреблено «сын», а далее родительный «сына» ясно показывает последовательность родословия и естественно звучит по-русски.
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Передача еврейского личного имени с сохранением удвоенного согласного.
- source_word: יוֹעֵד
  choice: Иоэд
  rationale: Передаёт огласованную форму масоретского текста; отличие параллельного места вынесено в сноску.
- source_word: פְּדָיָה
  choice: Федаия
  rationale: Узнаваемая русская библейская форма имени, соответствующая еврейскому פְּדָיָה.
- source_word: קוֹלָיָה
  choice: Колаия
  rationale: Русская передача еврейской огласованной формы имени.
- source_word: מַעֲשֵׂיָה
  choice: Маасея
  rationale: Устоявшаяся и естественная для русского библейского регистра форма имени.
- source_word: אִיתִיאֵל
  choice: Итиэль
  rationale: Форма близко передаёт еврейское имя и сохраняет различимость его конечного элемента אֵל.
- source_word: יְשַׁעְיָה
  choice: Иешая
  rationale: Передача данной еврейской формы без автоматического отождествления носителя имени с пророком Исаией.
