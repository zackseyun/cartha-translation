base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: ru
  text: В Цаноахе, Адулламе и их селениях, в Лахисе и на его полях, в Азеке и зависимых от неё поселениях[a]. Так они расположились от Вирсавии до долины Еннома[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её дочерях», то есть подчинённых ей малых городах или селениях.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «расположились станом»; в данном контексте возможно также: «поселились».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: Цаноах
  rationale: Устоявшаяся русская передача географического названия; падежная форма «в Цаноахе» обусловлена продолжением перечня мест проживания из контекста.
- source_word: עֲדֻלָּם
  choice: Адуллам
  rationale: Традиционная русская транслитерация топонима.
- source_word: חַצְרֵיהֶם
  choice: их селения
  rationale: В географических перечнях חָצֵר обозначает небольшие зависимые сельские поселения; «селения» естественно по-русски и не создаёт ложной ассоциации с дворами.
- source_word: לָכִישׁ
  choice: Лахис
  rationale: Устоявшаяся русская форма топонима.
- source_word: שְׂדֹתֶיהָ
  choice: на его полях
  rationale: Сохраняется конкретное значение «поля», то есть сельскохозяйственные земли, принадлежавшие городу.
- source_word: עֲזֵקָה
  choice: Азека
  rationale: Устоявшаяся русская передача географического названия.
- source_word: בְנֹתֶיהָ
  choice: зависимые от неё поселения
  rationale: Буквально «её дочери» — древнееврейская метафора подчинённых малых населённых пунктов; в основном тексте передан смысл, а образ сохранён в примечании.
- source_word: וַיַּחֲנוּ
  choice: они расселились
  rationale: Основное значение глагола — «становиться лагерем», но в контексте постоянного размещения жителей естественный русский эквивалент — «расселились»; буквальный оттенок указан в примечании.
- source_word: מִבְּאֵר שֶׁבַע
  choice: от Вирсавии
  rationale: Использована традиционная русская форма хорошо известного библейского топонима.
- source_word: עַד
  choice: до
  rationale: Кратко и естественно выражает предел географического распространения.
- source_word: גֵּיא הִנֹּם
  choice: долины Еннома
  rationale: Традиционная русская передача названия долины у Иерусалима.
theological_decisions:
- issue: Значение וַיַּחֲנוּ в контексте заселения территории
  choice: расселились
  alternative: расположились станом / стали лагерем
  rationale: Контекст главы говорит о местах проживания, поэтому контекстуальное значение передано в тексте, но буквальный смысл глагола не устранён и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских топонимов. Начальные предложные формы отражают синтаксическое продолжение перечня из предыдущего контекста. Формулировки сохраняют географический характер списка и не перегружены архаизмами.
