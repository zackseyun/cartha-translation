lexical_decisions:
- source_word: וּבְ
  choice: и в
  rationale: Повтор сочетания союза ו и предлога ב перед каждым названием передан повтором «и в», что сохраняет структуру перечня и значение местонахождения.
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Название поселения передано транслитерацией с еврейского; форма «Иешуа» естественна для современной русской библейской ономастики и не смешивается с обычной русской формой личного имени «Иисус».
- source_word: מוֹלָדָה
  choice: Молада
  rationale: Географическое название транслитерировано, а не переведено; конечная ה отражена формой «-а».
- source_word: בֵית פָּלֶט
  choice: Бет-Пелет
  rationale: Составное географическое название транслитерировано. Написание через дефис помогает увидеть его составной характер, не превращая имя места в толкование.
