base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: ru
  text: А их братьев, доблестных воинов, было сто двадцать восемь. Начальником над ними был Завдиил, сын Хаггедолима[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын великих»; возможно также: «сын знатных». Еврейское выражение может быть не именем собственным, а описанием происхождения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: А их братьев
  rationale: Буквальное значение — «их братья»; в данном перечне речь идёт о мужчинах, принадлежавших к той же группе. Русская конструкция с родительным падежом естественно сочетается с последующим указанием числа.
- source_word: גִּבּוֹרֵי חַיִל
  choice: доблестных воинов
  rationale: Устойчивое сочетание обозначает сильных, храбрых и способных к военному делу мужчин. «Доблестные воины» естественно передаёт его военный оттенок, не сводя значение только к физической силе.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: сто двадцать восемь
  rationale: Прямая передача количественного числительного 128.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: Начальником над ними был
  rationale: פָקִיד обозначает назначенного руководителя или надзирателя. «Начальник» соответствует административному контексту и не приписывает должности более узкого военного смысла.
- source_word: זַבְדִּיאֵל
  choice: Завдиил
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: בֶּן הַגְּדוֹלִים
  choice: сын Хаггедолима
  rationale: Основной текст понимает הַגְּדוֹלִים как имя или родовое обозначение и сохраняет определённый артикль в транслитерации. Возможное описательное понимание отражено в сноске.
