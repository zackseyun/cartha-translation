base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: ru
  text: 'И из левитов: Шемаия, сын Хашшува[a], сына Азрикама, сына Хашавьи, сына Бунни.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «сын» в родословных иногда означает более отдалённого потомка, а не обязательно непосредственного сына.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: И из
  rationale: Союз וְ связывает стих с предыдущим перечнем, а предлог מִן вводит представителей следующей группы.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Обычное русское обозначение членов колена Левия; форма родительного падежа обусловлена предлогом «из».
- source_word: שְׁמַעְיָה
  choice: Шемая
  rationale: Транслитерация еврейского личного имени, соответствующая его звучанию и принятой русской библейской форме.
- source_word: בֶן
  choice: сын / сына
  rationale: Сохраняет повторяющуюся структуру еврейской родословной; падежные формы согласованы по-русски. В родословиях слово может обозначать и более отдалённого потомка.
- source_word: חַשּׁוּב
  choice: Хашшув
  rationale: Передаёт согласные еврейского имени и удвоение שּׁ; конечная буква ב имеет звучание «в».
- source_word: עַזְרִיקָם
  choice: Азрикам
  rationale: Прямая транслитерация еврейского личного имени.
- source_word: חֲשַׁבְיָה
  choice: Хашавья
  rationale: Транслитерация сохраняет основу имени и конечный теофорный элемент -יה в естественной русской форме «-вья».
- source_word: בּוּנִּי
  choice: Бунни
  rationale: Транслитерация еврейского имени с передачей удвоенного נּ.
theological_decisions:
- issue: Степень родства в последовательности בֶן
  choice: В основном тексте употреблено «сын», а возможное более широкое значение отмечено в сноске.
  alternative: Передать как «потомок» во всех звеньях.
  rationale: «Сын» формально сохраняет структуру текста, но сноска не позволяет необоснованно ограничить בֶן непосредственным отношением отец—сын.
translation_notes:
  register: Современный литературный русский язык; краткая списочная конструкция и повтор родословных звеньев сохранены. Имена переданы близко к еврейскому тексту.
