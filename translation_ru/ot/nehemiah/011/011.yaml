  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: ru
  text: Сераия, сын Хелкии, сына Мешуллама, сына Садока, сына Мераиофа, сына Ахитува, начальник[a] дома Божьего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глава»; или: «поставленный над домом Божьим».'
    reason: lexical_alternative
  - marker: b
    text: То есть храма.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: Сераия
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בֶן
  choice: сын
  rationale: Повторяющаяся родословная формула буквально и естественно передаётся словом «сын»; хотя в родословиях возможны пропуски поколений, контекст не требует заменять его словом «потомок».
- source_word: נְגִיד
  choice: начальник
  rationale: Слово обозначает человека, поставленного во главе или наделённого руководящей ответственностью. «Начальник» подходит к храмовому управлению и не привносит царских коннотаций слова «правитель».
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Сохранён прозрачный образ исходного выражения «дом Бога»; в данном контексте имеется в виду храм, что пояснено в сноске.
- source_word: הָאֱלֹהִים
  choice: Божий
  rationale: В сочетании «дом Божий» אֱלֹהִים обозначает Бога Израиля; русская притяжательная форма естественна и сохраняет смысл конструкции.
