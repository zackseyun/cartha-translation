lexical_decisions:
- source_word: וּמִן
  choice: А некоторые … из
  rationale: Союз связывает заключительную заметку с предыдущим перечнем, а предлог указывает на выделение части из числа левитов; слово «некоторые» естественно передаёт подразумеваемую частичность, не обозначенную отдельным словом.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: Прямое обозначение левитов; родительный падеж обусловлен сочетанием «подразделения левитов».
- source_word: מַחְלְקוֹת
  choice: подразделения
  rationale: Слово обозначает организованные группы или разряды; «подразделения» подходит к административному контексту и звучит естественно по-русски.
- source_word: יְהוּדָה
  choice: из Иудеи
  rationale: В основном тексте краткая еврейская конструкция понята как указание на местонахождение или связь левитских подразделений с территорией Иудеи.
- source_word: לְבִנְיָמִין
  choice: были приписаны к Вениамину
  rationale: Предлог לְ выражает отношение или прикрепление; «приписаны к» ясно передаёт вероятный административный смысл, не утверждая передачу собственности.
