  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: ru
  text: А Пефахия, сын Мешезавеила, из потомков Зераха, сына Иуды, состоял при царе[a] во всех делах, касавшихся народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «был при руке царя»; возможно также: «находился при царе» или «был царским уполномоченным».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во всех делах для народа». Еврейское выражение может обозначать как дела, касавшиеся народа, так и дела, совершавшиеся для народа или в его интересах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: А Пефахия
  rationale: Союз ו передан как «А», чтобы сохранить связь с предшествующим перечнем; имя транслитерировано в принятой русской библейской форме.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: сын Мешезавела
  rationale: Формальная генеалогическая конструкция сохранена; имя передано традиционной русской транслитерацией.
- source_word: מִ/בְּנֵי זֶ֤רַח בֶּן יְהוּדָה֙
  choice: из потомков Зераха, сына Иуды
  rationale: בני в контексте родословия естественно означает потомков; запятая ясно показывает, что сыном Иуды назван Зерах.
- source_word: לְ/יַ֣ד הַ/מֶּ֔לֶךְ
  choice: был представителем царя
  rationale: Буквально «при руке царя»; в данном административном контексте оборот указывает на уполномоченного царского служащего. Более буквальный вариант сохранён в сноске.
- source_word: לְ/כָל דָּבָ֖ר
  choice: во всех делах
  rationale: דבר здесь обозначает дело или административный вопрос, а не только произнесённое слово.
- source_word: לָ/עָם
  choice: касавшихся народа
  rationale: Предлог ל допускает значение отношения к народу; формулировка не исключает альтернативного смысла действий в интересах народа.
