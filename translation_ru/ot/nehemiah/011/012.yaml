  - severity: medium
    issue: Винительный падеж и тире создают синтаксически неполную и малопонятную фразу в пределах данного стиха.
    rationale: Зависимость от предшествующего стиха возможна, но современный русский яснее передаёт числовое сообщение конструкцией «их братьев ... было ...»; Адая при этом должен стоять в именительном падеже.
