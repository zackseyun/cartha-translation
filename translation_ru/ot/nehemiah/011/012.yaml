review_pass:
  verdict: revise
  source_fidelity: В черновике точно переданы число, генеалогическая цепочка и традиционные формы имён. Однако «при храме» уже истолковывает לַבַּיִת («для дома»); хотя сноска это оговаривает, в основном тексте возможно сохранить образ и синтаксис оригинала точнее. Винительные формы «братьев» и «Адаю» зависят от подразумеваемой конструкции предыдущего стиха и в изолированном стихе звучат неестественно.
  naturalness: Конструкция «и их братьев ... — восемьсот двадцать два; и Адаю» тяжела для современного литературного русского, особенно вне непрерывного чтения предыдущего стиха. Явное сказуемое «было» и именительная форма имени делают фразу ясной, не меняя сообщаемых данных.
  terminology: '«Дом» оставлен в основном тексте как буквальное обозначение הַבַּיִת; сноска поясняет его контекстуальную отсылку к храму. «Братья» сохранено без привнесения слова «священники». Имена переданы в устойчивых русских библейских формах: Адая, Иерохам, Пелалия, Амци, Захария, Пашхур, Малхия.'
