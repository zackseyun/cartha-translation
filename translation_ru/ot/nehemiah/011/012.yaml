base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: ru
  text: Их братьев, выполнявших работу для дома[a], было восемьсот двадцать два; и Адая, сын Иерохама, сына Пелалии, сына Амци, сына Захарии, сына Пашхура, сына Малхии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «домом» здесь подразумевается храм.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: и их братьев
  rationale: Сохранён буквальный термин родства «братья»; в контексте речь идёт о других членах священнической группы, но уточнение «священники» отсутствует в самом еврейском тексте. Винительный падеж продолжает перечень, начатый в предыдущем стихе.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: выполнявших работы
  rationale: Причастная конструкция передана естественным современным русским оборотом, сохраняющим деятельный характер выражения.
- source_word: לַבַּיִת
  choice: при храме
  rationale: Слово בַּיִת буквально означает «дом», однако в данном контексте обозначает храм. Предлог לְ допускает значение направленности или отношения; «при храме» естественно передаёт служебную связь, не сужая её до работы исключительно внутри здания.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: восемьсот двадцать два
  rationale: Прямая передача количественного числительного по нормам современного русского языка.
- source_word: וַעֲדָיָה
  choice: и Адаю
  rationale: Союз продолжает перечень; форма имени поставлена в винительном падеже согласно синтаксису списка, начатого в предыдущем стихе.
- source_word: בֶּן
  choice: сына
  rationale: Стандартная генеалогическая формула сохранена последовательно. Возможные пропуски поколений не дают оснований заменять её более общим словом «потомок».
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: Иерохам / Пелалия / Амци / Захария / Пашхур / Малхия
  rationale: Имена переданы в формах, соответствующих принятой русской библейской традиции и еврейскому источнику.
