lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: А после него
  rationale: Буквально выражение означает «и после него». В контексте перечня оно, вероятнее всего, указывает на последовательность перечисления; союз «а» естественно связывает строку с предшествующим текстом.
- source_word: גַּבַּי
  choice: Габбай
  rationale: Собственное имя передано транслитерацией с сохранением удвоенного согласного, отражённого масоретской огласовкой.
- source_word: סַלָּי
  choice: Саллай
  rationale: Собственное имя передано транслитерацией с сохранением удвоенного согласного, отражённого масоретской огласовкой.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: девятьсот двадцать восемь
  rationale: Еврейское числительное однозначно складывается как 900 + 20 + 8. Число записано словами в соответствии с достоинством библейского повествования; отсутствующее в оригинале существительное «человек» не добавлено.
