base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: ru
  text: Иоиль, сын Зихри, был поставлен над ними, а Иуда, сын Гассенуа, занимал второе место в управлении городом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был заместителем в управлении городом»; букв. «был вторым над городом».'
    reason: Древнееврейское מִשְׁנֶה обозначает второе по рангу лицо или заместителя; точное наименование должности не указано.
lexical_decisions:
- source_word: פָּקִיד
  choice: был поставлен
  rationale: Слово обозначает назначенного руководителя или надзирателя. В сочетании с עֲלֵיהֶם русское «был поставлен над ними» естественно передаёт и назначение, и властные полномочия, не уточняя без основания характер должности.
- source_word: עֲלֵיהֶם
  choice: над ними
  rationale: Предлог עַל с местоименным суффиксом указывает здесь на руководство или надзор; буквальная конструкция естественна и понятна по-русски.
- source_word: מִשְׁנֶה
  choice: вторым начальником
  rationale: Существительное указывает на второе по рангу лицо или заместителя. Добавленное по смыслу «начальником» делает краткую древнееврейскую конструкцию грамматически ясной по-русски, тогда как примечание сохраняет возможные административные оттенки.
- source_word: עַל הָעִיר
  choice: города
  rationale: В административном контексте выражение обозначает полномочия в отношении города. Родительная конструкция с «начальником» звучит естественнее буквального «над городом».
- source_word: הַסְּנוּאָה
  choice: Гассенуа
  rationale: Личное или родовое имя передано транслитерацией с учётом начального элемента הַ־, присутствующего в масоретском тексте.
- source_word: וְ … וִ
  choice: И … а
  rationale: Первый союз сохраняет связь с предшествующим перечнем, а второй передан противительно-сопоставительным «а», естественно разделяющим две должности в русском предложении.
