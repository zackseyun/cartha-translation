  text: וּ/פְקִ֤יד הַ/לְוִיִּם֙ בִּ/יר֣וּשָׁלִַ֔ם עֻזִּ֤י בֶן בָּנִי֙ בֶּן חֲשַׁבְיָ֔ה בֶּן מַתַּנְיָ֖ה בֶּן מִיכָ֑א מִ/בְּנֵ֤י אָסָף֙ הַ/מְשֹׁ֣רְרִ֔ים לְ/נֶ֖גֶד מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: ru
  text: Начальником левитов в Иерусалиме был Уззи, сын Бани, сына Хашавьи, сына Маттаньи, сына Михи, из потомков Асафа, певцов; он ведал работой в доме Божьем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был поставлен над работой в доме Божьем». Еврейский оборот с לְנֶגֶד может обозначать надзор или ответственность по отношению к храмовой работе.'
    reason: Сохраняет лексическую неоднозначность לְנֶגֶד, при этом основная формулировка правильно относит ответственность к Уззи.
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: Начальником левитов
  rationale: פְקִיד обозначает назначенного руководителя или надзирающего. «Начальник» естественно передаёт официальную административную роль, а родительный «левитов» сохраняет конструкцию исходного текста без тяжеловесного «надзиратель над левитами».
- source_word: בִּירוּשָׁלִַם
  choice: в Иерусалиме
  rationale: Предлог בְּ употреблён в обычном локативном значении.
- source_word: עֻזִּי בֶן־בָּנִי בֶן־חֲשַׁבְיָה בֶּן־מַתַּנְיָה בֶן־מִיכָא
  choice: Уззи, сын Бани, сына Хашавьи, сына Маттаньи, сына Михи
  rationale: Имена переданы близко к масоретской огласовке; повторение «сын/сына» сохраняет явную генеалогическую цепочку еврейского текста.
- source_word: מִבְּנֵי אָסָף
  choice: из потомков Асафа
  rationale: Буквально «из сыновей Асафа»; в родословно-служебном контексте современное русское «из потомков» точнее передаёт принадлежность к роду и не создаёт впечатления непосредственного сыновства.
- source_word: הַמְשֹׁרְרִים
  choice: певцов
  rationale: Причастие называет храмовую функцию потомков Асафа; «певцы» точнее, чем более широкое «музыканты».
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: отвечавших за работы
  rationale: В административном контексте לְנֶגֶד указывает на ответственность или надзор по отношению к делу. Формулировка передаёт этот смысл, не подменяя широкое מְלָאכָה более узким понятием богослужения.
- source_word: בֵּית הָאֱלֹהִים
  choice: в доме Божьем
  rationale: Сохранён образ «дома Божьего», хотя по контексту речь идёт о храме.
theological_decisions:
- issue: Синтаксическая связь выражения לְנֶגֶד מְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: 'Связать его с ближайшим обозначением певцов: «певцов, отвечавших за работы в доме Божьем»'
  alternative: 'Отнести выражение лично к Уззи: «он отвечал за работы в доме Божьем»'
  rationale: Еврейская конструкция допускает некоторую неоднозначность сферы приложения ответственности. Связь с ближайшим множественным «певцы» синтаксически естественна, однако примечание сохраняет возможное административное прочтение применительно к Уззи.
translation_notes:
  register: Современный литературный русский язык с достоинством хроникально-родословного повествования. Генеалогическая цепочка сохранена явно; архаичные формы имён и канцелярская тяжеловесность избегаются.
