base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: ru
  text: Что касается селений среди их полей, то некоторые из сынов Иуды жили в Кириаф-Арбе[a] и окрестных селениях[b], в Дивоне и окрестных селениях[b], а также в Иекавцеиле[c] и его поселениях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кириаф-Арба — древнее название Хеврона; сравните Иисус Навин 14:15.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «её дочерях» — так назывались зависимые от города или расположенные вокруг него селения.'
    reason: lexical_alternative
  - marker: c
    text: В некоторых связанных текстах и традициях это название передаётся также как «Кавцеил».
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: Что касается селений среди их полей
  rationale: Оборот вводит новую географическую категорию в перечне. «Что касается» естественно передаёт тематический переход, а «селения среди их полей» сохраняет сельскохозяйственный смысл и пространственное отношение.
- source_word: מִבְּנֵי יְהוּדָה
  choice: некоторые из сынов Иуды
  rationale: «Некоторые из» явно передаёт частичное значение предлога מִן; «сыны Иуды» сохраняет родоплеменное обозначение исходного текста.
- source_word: יָשְׁבוּ
  choice: жили
  rationale: Современное нейтральное обозначение постоянного проживания без лишнего акцента на первоначальном заселении.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: в Кириаф-Арбе
  rationale: Передача топонима по принятой русской библейской традиции; отождествление с Хевроном вынесено в примечание, поскольку его нет в самом стихе.
- source_word: וּבְנֹתֶיהָ
  choice: и окрестных селениях
  rationale: Буквально «и её дочерях» — географическая идиома, обозначающая зависимые или окружающие главный город селения. Выбран естественный русский эквивалент; образ исходного текста отмечен в сноске.
- source_word: וּבְדִיבוֹן
  choice: в Дивоне
  rationale: Топоним передан в традиционной русской форме.
- source_word: וּבִיקַּבְצְאֵל
  choice: в Иекавцеиле
  rationale: Форма отражает данный масоретский текст и русскую библейскую традицию; родственная краткая форма «Кавцеил» отмечена в сноске.
- source_word: וַחֲצֵרֶיהָ
  choice: и его поселениях
  rationale: В данном географическом контексте חֲצֵרִים означает небольшие зависимые населённые пункты, а не буквальные дворы. «Поселения» также сохраняет лексическое отличие от предшествующего בְּנוֹתֶיהָ.
theological_decisions:
- issue: Родоплеменное обозначение מִבְּנֵי יְהוּדָה
  choice: некоторые из сынов Иуды
  alternative: некоторые из народа Иуды
  rationale: Сохранена гендерно маркированная формула оригинала как обычное родоплеменное обозначение; текст не перетолкован в утверждение исключительно о мужчинах.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Географический перечень сохранён без стилистического утяжеления; топонимы даны в привычных русских библейских формах. Все пояснения, отсутствующие в еврейском тексте, вынесены в сноски.
