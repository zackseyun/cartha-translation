  register: 'Современный литературный русский язык с достойным библейским звучанием. Сохранена краткая бессоюзно-эллиптическая концовка оригинала: глагол «жили» подразумевается и во второй части. Начальное וַ передано связностью русского повествования без добавления отдельного временного наречия.'
