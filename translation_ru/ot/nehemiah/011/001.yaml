  text: וַ/יֵּשְׁב֥וּ שָׂרֵֽי הָ/עָ֖ם בִּ/ירוּשָׁלִָ֑ם וּ/שְׁאָ֣ר הָ֠/עָם הִפִּ֨ילוּ גוֹרָל֜וֹת לְ/הָבִ֣יא אֶחָ֣ד מִן הָ/עֲשָׂרָ֗ה לָ/שֶׁ֨בֶת֙ בִּֽ/ירוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ וְ/תֵ֥שַׁע הַ/יָּד֖וֹת בֶּ/עָרִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: ru
  text: Руководители народа жили в Иерусалиме, а остальной народ бросил жребий, чтобы переселить одного из каждых десяти в Иерусалим, святой город; остальные девять частей[a] остались жить в городах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «девять рук в городах»; здесь «руки» означают доли, то есть остальные девять частей из десяти.'
    reason: Пояснение буквального значения древнееврейской идиомы.
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: руководители народа
  rationale: שָׂרִים обозначает правителей, начальников или должностных лиц. «Руководители» естественно для современного русского языка и не придаёт слову монархического оттенка, возможного у «князей».
- source_word: וַיֵּשְׁבוּ
  choice: жили
  rationale: Глагол ישׁב здесь обозначает постоянное проживание, а не положение сидя; «жили» ясно и естественно передаёт этот смысл.
- source_word: וּשְׁאָר הָעָם
  choice: а остальные из народа
  rationale: שְׁאָר означает остаток, остальных. Такая формулировка естественно отличает прочих людей от уже названных руководителей.
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: бросили жребий
  rationale: Устойчивое русское выражение, точно передающее способ отбора.
- source_word: לְהָבִיא
  choice: чтобы привести
  rationale: Каузативная форма בוא указывает на то, что отобранных людей должны были привести или побудить прийти в Иерусалим.
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: одного из десяти
  rationale: Сохраняет выраженное в древнееврейском тексте соотношение и не превращает его в отвлечённое «одну десятую».
- source_word: לָשֶׁבֶת
  choice: жить
  rationale: ישׁב здесь вновь употреблено в значении проживания; современное «жить» точнее по контексту, чем буквальное «сидеть».
- source_word: עִיר הַקֹּדֶשׁ
  choice: святой город
  rationale: Прямой и укоренившийся русский эквивалент данного сочетания.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: остальные же девять частей
  rationale: Буквально «девять рук», но יָדוֹת здесь означает доли или части. «Девять частей» сохраняет образ счёта из десяти, не заменяя его более отвлечённым «девять десятых».
- source_word: בֶּעָרִים
  choice: в других городах
  rationale: עָרִים означает города или городские поселения. «Других» естественно выражает подразумеваемое противопоставление Иерусалиму.
