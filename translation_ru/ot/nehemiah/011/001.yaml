  source_fidelity: 'Основной смысл передан верно: руководители уже жили в Иерусалиме, остальной народ определял жребием одного из десяти для проживания в святом городе, а девять долей оставались в городах. Однако заключительная русская эллиптическая конструкция «остальные же девять частей — в других городах» не образует естественного сказуемого и воспринимается как фрагмент. Каузативное לְהָבִיא естественно передать словом «переселить».'
