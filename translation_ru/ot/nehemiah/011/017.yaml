base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: ru
  text: Маттания, сын Михи, сына Завдия, сына Асафа, был главным, начинавшим благодарение в молитве[a]; Бакбукия был вторым среди своих братьев; и Авда, сын Шаммуа, сына Галала, сына Идифуна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно также понять как «возглавлял благодарение в молитве»; буквально оно содержит слова «глава», «начало» и «воздающий благодарение».
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: руководителем
  rationale: В перечне служителей слово обозначает ведущую роль; «руководитель» естественнее для современного русского языка, чем буквальное «глава».
- source_word: הַתְּחִלָּה יְהוֹדֶה
  choice: начинал благодарение
  rationale: Сочетание существительного «начало» с формой ידה указывает на того, кто начинал или возглавлял литургическое благодарение; перевод сохраняет это действие без излишнего уточнения его ритуальной формы.
- source_word: לַתְּפִלָּה
  choice: в молитве
  rationale: Предлог ל здесь естественно передаёт сферу или обстоятельство благодарения — во время молитвы или в составе молитвы.
- source_word: מִשְׁנֶה
  choice: вторым
  rationale: Слово обозначает второе место или положение; краткий перевод сохраняет неуточнённость конкретной должности.
- source_word: מֵאֶחָיו
  choice: среди своих братьев
  rationale: Сохранён буквальный образ родственной группы без поясняющего, но отсутствующего в тексте уточнения «левитов».
- source_word: יְדִיתוּן
  choice: Идифуна
  rationale: Использована укоренившаяся русская библейская форма имени; падеж согласован с родословной конструкцией.
theological_decisions:
- issue: Значение ידה в богослужебном контексте
  choice: благодарение
  alternative: хвала; исповедание
  rationale: Связь с молитвой и служением потомков Асафа делает значение благодарения или хвалы наиболее вероятным; «благодарение» сохраняет литургический оттенок, не вводя конфессионального толкования.
- issue: Связь רֹאשׁ הַתְּחִלָּה יְהוֹדֶה
  choice: руководителем и начинал благодарение
  alternative: главным при начале благодарения; возглавлял благодарение
  rationale: Еврейская конструкция сжата и допускает оттенки начала и руководства. Основной текст передаёт оба элемента, а примечание отмечает возможное более цельное понимание.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для библейского перечня. Родословные связи переданы последовательно; сжатость исходного административно-литургического описания сохранена.
