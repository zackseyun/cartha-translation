lexical_decisions:
- source_word: וּ/בְ/צִֽקְלַ֥ג
  choice: и в Циклаге
  rationale: Союз וּ и предлог בְּ естественно переданы как «и в»; название места צִקְלַג транслитерировано в принятой русской библейской форме «Циклаг» с падежным окончанием.
- source_word: וּ/בִ/מְכֹנָ֖ה
  choice: и в Мехоне
  rationale: Сочетание союза и предлога передано как «и в»; топоним מְכֹנָה транслитерирован как «Мехона» и поставлен в предложный падеж.
- source_word: וּ/בִ/בְנֹתֶֽי/הָ
  choice: и в зависимых от неё селениях
  rationale: Буквально «и в её дочерях»; здесь это древнееврейская идиома, обозначающая небольшие поселения, административно связанные с главным городом. Местоимение женского рода относится к Мехоне.
