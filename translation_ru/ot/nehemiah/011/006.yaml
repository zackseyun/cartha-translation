  terminology: Имя «Фарес» соответствует традиционной русской библейской передаче Perez. В сноске «мужественных воинов» неоправданно сужает אַנְשֵׁי חַיִל до военного значения, которого данный переписной контекст не требует; «мужей» также излишне архаично.
