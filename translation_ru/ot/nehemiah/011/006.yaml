  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: ru
  text: Всего потомков Фареса, живших в Иерусалиме, было четыреста шестьдесят восемь — доблестных мужчин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «людей, отличавшихся силой или способностями», «людей доблестных». Еврейское выражение может обозначать людей, отличавшихся силой, способностями или доблестью.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Всех … было
  rationale: Передаёт итоговый, охватывающий всю группу подсчёт и естественно вводит её общую численность по-русски.
- source_word: בְּנֵי פֶרֶץ
  choice: потомков Фареса
  rationale: Буквально «сыновья Фареса», но в родословно-переписном контексте речь идёт о членах рода, то есть потомках; такой перевод точнее передаёт смысл современному читателю.
- source_word: הַיֹּשְׁבִים
  choice: живших
  rationale: Причастие от ישׁב здесь обозначает постоянное проживание; «живших» естественно для современного русского языка.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Стандартная передача обстоятельства места.
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: четыреста шестьдесят восемь
  rationale: Число передано словами в соответствии с формой исходного текста и литературной нормой.
- source_word: אַנְשֵׁי חָיִל
  choice: доблестных мужей
  rationale: Сохраняет мужской род и похвальную характеристику; сочетание может указывать на силу, состоятельность, способность или воинскую доблесть, поэтому неоднозначность пояснена в сноске.
