lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: и в Эн-Риммоне
  rationale: Союз וּ и предлог בְ переданы как «и в». Географическое название עֵין רִמּוֹן транслитерировано в принятой для русской библейской традиции форме «Эн-Риммон» и поставлено в предложный падеж.
- source_word: וּ/בְ/צָרְעָה
  choice: и в Цоре
  rationale: Союз и предлог переданы явно; название צָרְעָה транслитерировано как «Цора» и поставлено в предложный падеж.
- source_word: וּ/בְ/יַרְמוּת
  choice: и в Ярмуте
  rationale: Название יַרְמוּת передано современной русской транслитерацией «Ярмут», а повторяющиеся союз и предлог сохранены.
