  text: וַֽ/יְבָרֲכ֖וּ הָ/עָ֑ם לְ/כֹל֙ הָֽ/אֲנָשִׁ֔ים הַ/מִּֽתְנַדְּבִ֔ים לָ/שֶׁ֖בֶת בִּ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/002.yaml
  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: ru
  text: И народ благословил всех мужчин, добровольно вызвавшихся жить в Иерусалиме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добровольно предложивших себя, чтобы жить в Иерусалиме».'
    reason: Лексическая альтернатива, более буквально передающая возвратный оттенок формы הַמִּתְנַדְּבִים.
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: благословил
  rationale: Порода пиэль глагола ברך обычно означает «благословлять». Здесь народ выражает благословение и одобрение людям; «благословил» сохраняет основное значение, не сводя его только к похвале.
- source_word: הָעָם
  choice: народ
  rationale: Стандартное собирательное обозначение народа; единственное число согласуется с русским словом «народ».
- source_word: לְכֹל הָאֲנָשִׁים
  choice: всех мужчин
  rationale: Существительное אֲנָשִׁים здесь имеет мужское значение; перевод сохраняет явно выраженную в исходном тексте гендерную отнесённость.
- source_word: הַמִּתְנַדְּבִים
  choice: добровольно вызвавшихся
  rationale: Хитпаэль от נדב передаёт добровольную готовность и личное самообязательство. Русское выражение естественно передаёт оба оттенка.
- source_word: לָשֶׁבֶת
  choice: жить
  rationale: В контексте заселения Иерусалима ישב означает постоянно проживать; «жить» — ясный и современный русский эквивалент.
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Обычная передача местного значения предлога ב и названия города.
theological_decisions:
- issue: Гендерная передача הָאֲנָשִׁים
  choice: всех мужчин
  alternative: всех людей
  rationale: Исходный текст употребляет существительное мужского рода אֲנָשִׁים, а контекст не требует обобщающей нейтральной передачи. Поэтому мужская отнесённость сохранена.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство повествования и при этом звучит естественно. Глагол «благословил» оставлен без рационализирующего ослабления до «похвалил».
