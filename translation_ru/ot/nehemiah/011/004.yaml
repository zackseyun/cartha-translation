source:
  edition: WLC
  text: וּ/בִֽ/ירוּשָׁלִַ֨ם֙ יָֽשְׁב֔וּ מִ/בְּנֵ֥י יְהוּדָ֖ה וּ/מִ/בְּנֵ֣י בִנְיָמִ֑ן מִ/בְּנֵ֣י יְ֠הוּדָה עֲתָיָ֨ה בֶן עֻזִּיָּ֜ה בֶּן זְכַרְיָ֧ה בֶן אֲמַרְיָ֛ה בֶּן שְׁפַטְיָ֥ה בֶן מַהֲלַלְאֵ֖ל מִ/בְּנֵי פָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: ru
  text: 'А в Иерусалиме жили некоторые из потомков Иуды и некоторые из потомков Вениамина[a]. Из потомков Иуды: Атая, сын Озии, сына Захарии, сына Амарии, сына Шефатии, сына Махалалела, из потомков Фареса.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из сыновей Иуды и из сыновей Вениамина»; здесь имеются в виду представители или потомки этих племенных линий.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: А в Иерусалиме
  rationale: Союз ו сохраняет связь с предыдущим контекстом, а предлог ב передаётся естественным русским оборотом «в Иерусалиме».
- source_word: יָשְׁבוּ
  choice: жили
  rationale: В данном перечне жителей ישב обозначает постоянное проживание; «жили» естественно и не вносит излишней архаичности.
- source_word: מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן
  choice: некоторые из потомков Иуды и некоторые из потомков Вениамина
  rationale: Частичный מן указывает на представителей более широких родовых групп; בני здесь означает не только непосредственных сыновей, но членов или потомков племенной линии.
- source_word: מִבְּנֵי יְהוּדָה
  choice: 'Из потомков Иуды:'
  rationale: Повторная формула вводит перечень представителей Иуды; двоеточие ясно передаёт её заголовочную функцию.
- source_word: עֲתָיָה
  choice: Атая
  rationale: Русская библейская форма имени, близкая еврейскому звучанию.
- source_word: בֶּן
  choice: сын
  rationale: Сохранена обычная генеалогическая формула; хотя родословия могут пропускать поколения, текст прямо использует בן.
- source_word: עֻזִּיָּה
  choice: Озия
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: זְכַרְיָה
  choice: Захария
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: אֲמַרְיָה
  choice: Амария
  rationale: Транслитерация личного имени в форме, естественной для русской библейской традиции.
- source_word: שְׁפַטְיָה
  choice: Шефатия
  rationale: Форма достаточно близка к еврейскому имени и понятна русскому читателю.
- source_word: מַהֲלַלְאֵל
  choice: Махалалел
  rationale: Передаёт еврейское личное имя без перевода его значения.
- source_word: פָרֶץ
  choice: Фарес
  rationale: Устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Значение родовой формулы בני
  choice: потомки
  alternative: сыновья
  rationale: В контексте племенного и генеалогического перечня речь идёт о членах родовых линий Иуды и Вениамина, а не только об их непосредственных сыновьях. Выбор не меняет богословского содержания, но делает смысл ясным.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства генеалогического перечня. Использованы традиционные русские формы общеизвестных библейских имён; синтаксис слегка упрощён ради ясности, без устранения родословной структуры.
