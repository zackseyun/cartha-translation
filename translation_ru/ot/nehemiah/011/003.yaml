base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: ru
  text: 'Вот главы области, которые жили в Иерусалиме. А в городах Иудеи каждый жил в своём владении, в своих городах: Израиль[a], священники, левиты, храмовые служители[b] и потомки слуг Соломона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». В еврейском тексте буквально: «Израиль» — вероятно, собирательное обозначение этой группы в перечне.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «нетиним» — особая группа людей, назначенных для служения при храме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: главы области
  rationale: «Главы» сохраняет образное обозначение руководителей, а «область» естественно передаёт административную единицу персидского периода, не создавая ассоциации с современным государством.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: которые жили в Иерусалиме
  rationale: Глагол יָשַׁב здесь обозначает постоянное проживание; «жили» звучит современно и точно.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: А в городах Иудеи жили
  rationale: Союз «а» естественно обозначает переход и противопоставление Иерусалима остальным городам Иудеи, не усиливая его до резкого «но».
- source_word: אִישׁ בַּאֲחֻזָּתוֹ
  choice: каждый в своём владении
  rationale: Дистрибутивное אִישׁ передано как «каждый», а אֲחֻזָּה — как принадлежащее человеку земельное владение. Такая формулировка точна и не предполагает исключительно наследственный способ получения земли.
- source_word: בְּעָרֵיהֶם
  choice: в своих городах
  rationale: Возвратное «своих» естественно соотносит города с перечисленными жителями и сохраняет повтор исходного текста.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено собирательное наименование без добавления отсутствующего в еврейском тексте слова; возможное значение «израильтяне» отмечено в сноске.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Стандартное и ясное соответствие.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Стандартное наименование этой группы.
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Функциональный перевод понятен современному читателю и передаёт принадлежность особой группы к храмовой службе; традиционное название дано в сноске.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: потомки слуг Соломона
  rationale: В перечне родовых групп בְּנֵי обозначает не только непосредственных сыновей, но и потомков.
