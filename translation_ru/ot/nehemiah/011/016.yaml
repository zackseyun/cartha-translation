  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: ru
  text: Шаббетай и Йозавад, из числа руководителей левитов, отвечали за внешние работы[a] для дома Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «работы вне дома Бога». Еврейское выражение может обозначать работы, выполнявшиеся за пределами собственно храмового здания, в отличие от обязанностей внутри него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: Шаббетай и Йозавад
  rationale: Личные имена переданы транслитерацией, близкой к еврейскому звучанию; союз соединяет двух названных левитов.
- source_word: עַל
  choice: отвечали за
  rationale: В административном контексте предлог обозначает руководство и возложенную ответственность; такой перевод естественен в современном русском языке.
- source_word: הַמְּלָאכָה הַחִיצֹנָה
  choice: внешние работы
  rationale: מְלָאכָה обозначает работу или порученное дело, а חִיצוֹנָה — то, что находится снаружи или относится к внешней сфере. Формулировка сохраняет широту значения и возможное противопоставление внутренним храмовым обязанностям.
- source_word: לְבֵית הָאֱלֹהִים
  choice: при доме Бога
  rationale: Предлог לְ связывает работы с храмом; «при доме Бога» передаёт их принадлежность к храмовому служению, не утверждая, что они выполнялись внутри здания.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: из числа глав левитов
  rationale: Формулировка естественно передаёт מִן как принадлежность к группе руководителей и сохраняет административное значение רָאשֵׁי.
