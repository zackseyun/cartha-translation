lexical_decisions:
- source_word: מִן הַכֹּהֲנִים
  choice: Из священников
  rationale: Предлог מִן обозначает принадлежность к названной группе; краткая конструкция сохраняет форму перечня.
- source_word: יְדַעְיָה
  choice: Иедая
  rationale: Традиционная русская библейская передача древнееврейского личного имени Yəda‘yā.
- source_word: בֶן יוֹיָרִיב
  choice: сын Иоиарива
  rationale: בֶן прямо означает «сын»; имя передано в традиционной русской библейской форме и поставлено в родительный падеж.
- source_word: יָכִין
  choice: Иахин
  rationale: Передача имени Yāḵîn в принятой русской библейской форме; в данном контексте это отдельное лицо в перечне.
