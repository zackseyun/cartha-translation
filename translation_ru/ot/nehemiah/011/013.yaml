  yaml_path: translation/ot/nehemiah/011/013.yaml
  text: and his brothers[a], heads of fathers’ houses, 242; and Amashsai son of Azarel, son of Ahzai, son of Meshillemoth[c][b], son of Immer.
translation:
  language: ru
  text: и его братья, главы родовых домов, — двести сорок два; и Амашсай, сын Азарела, сын Ахзая, сын Мешиллемота, сын Иммера.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶחָיו
  choice: и его братьев
  rationale: Буквально передаёт форму אָח с суффиксом 3-го лица единственного числа; в данном родовом и священническом контексте слово может обозначать также более широкий круг родственников.
- source_word: רָאשִׁים לְאָבוֹת
  choice: глав родовых домов
  rationale: Выражение обозначает руководителей патрилинейных родовых объединений. «Родовые дома» сохраняет социальную структуру оригинала и звучит понятнее, чем буквальное «дома отцов».
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: двести сорок два человека
  rationale: Число передано словами в соответствии с литературным повествовательным регистром; добавление «человека» по-русски ясно обозначает подсчёт лиц.
- source_word: וַעֲמַשְׁסַי
  choice: и Амашсая
  rationale: Имя передано по масоретской форме עֲמַשְׁסַי; винительный падеж обусловлен продолжающейся синтаксической конструкцией перечня.
- source_word: בֶּן
  choice: сына
  rationale: Повторяющаяся генеалогическая формула естественно и формально передаётся словом «сын»; возможность значения «потомок» не навязывается без контекстуальной необходимости.
- source_word: עֲזַרְאֵל
  choice: Азарела
  rationale: Транслитерация еврейского личного имени с русским падежным оформлением.
- source_word: אַחְזַי
  choice: Ахзая
  rationale: Транслитерация данной масоретской формы имени с русским падежным оформлением.
- source_word: מְשִׁלֵּמוֹת
  choice: Мешиллемота
  rationale: Передаёт масоретское чтение имени и оформляет его в родительном падеже.
- source_word: אִמֵּר
  choice: Иммера
  rationale: Прямая транслитерация личного имени, также известного как название священнического рода.
theological_decisions: []
