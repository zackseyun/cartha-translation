  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: ru
  text: Ибо на них распространялось царское повеление, а для певцов было установлено обеспечение[a] — на каждый день своё[b].
  philosophy: optimal-equivalence
  footnotes:
