lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение предыдущего утверждения; русское «потому что» ясно передаёт причинно-пояснительную связь.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: царское повеление
  rationale: Сочетание обозначает властное распоряжение царя; формулировка естественна для литературного русского языка и сохраняет административный оттенок.
- source_word: עֲלֵיהֶם
  choice: о них
  rationale: Предлог עַל здесь естественно понимать как указание на тех, кого касается царское распоряжение; буквальное «на них» по-русски могло бы ошибочно подразумевать бремя обязанности.
- source_word: וַאֲמָנָה
  choice: было установлено постоянное обеспечение
  rationale: Редкое существительное связано с идеей твёрдости и надёжности и в данном административном контексте, вероятно, обозначает закреплённое обеспечение либо установленный порядок.
- source_word: עַל הַמְשֹׁרְרִים
  choice: для певцов
  rationale: Контекст указывает, что установленное обеспечение предназначалось певцам; это наиболее естественная русская передача отношения, выраженного предлогом עַל.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: на каждый день положенное в тот день
  rationale: 'Передача сохраняет повтор и административный смысл еврейской идиомы: ежедневная доля или обязанность должна была предоставляться в соответствующий день.'
