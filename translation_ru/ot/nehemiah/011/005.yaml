  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: ru
  text: И Маасея, сын Варуха, сын Кол-Хозе, сын Хазаии, сын Адаии, сын Иоиарива, сын Захарии, сын шилонита[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шелонита». Еврейское обозначение принадлежности может указывать на связь с Силомом либо на принадлежность к роду, связываемому в генеалогической традиции с Шелой (Шилоном).'
    reason: Лексическая и генеалогическая неоднозначность еврейского обозначения принадлежности.
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: и Маасея
  rationale: Союз ו сохранён, поскольку стих продолжает перечень предыдущего стиха; личное имя передано транслитерацией.
- source_word: בֶן
  choice: сын
  rationale: Повторяющееся генеалогическое обозначение сохранено единообразно и передаёт структуру родословной цепи, не исключая более широкого значения происхождения в библейских родословиях.
- source_word: בָּרוּךְ
  choice: Варуха
  rationale: Личное имя передано в принятой русской библейской форме и поставлено в родительный падеж после слова «сын».
- source_word: כָּל חֹזֶה
  choice: Кол-Хозе
  rationale: Сочетание понято как составное личное имя и транслитерировано, а не переведено буквально.
- source_word: חֲזָיָה
  choice: Хазаии
  rationale: Личное имя транслитерировано и поставлено в родительный падеж.
- source_word: עֲדָיָה
  choice: Адаии
  rationale: Личное имя транслитерировано и поставлено в родительный падеж.
- source_word: יוֹיָרִיב
  choice: Иоиарива
  rationale: Форма передаёт непосредственно засвидетельствованное יוֹיָרִיב без развёртывания теофорного элемента; после «сын» употреблён родительный падеж.
- source_word: זְכַרְיָה
  choice: Захарии
  rationale: Использована укоренившаяся русская библейская форма имени.
- source_word: הַ/שִּׁלֹנִי
  choice: шилонита
  rationale: Субстантивированное обозначение принадлежности передано транслитерацией, чтобы не сводить неоднозначную форму исключительно к жителю Силома или к определённому роду.
