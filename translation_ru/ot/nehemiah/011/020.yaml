  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: ru
  text: Остальные израильтяне, священники и левиты, жили во всех городах Иудеи — каждый в своём уделе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человек в своём уделе». В еврейском тексте употреблено единственное число в распределительном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: Остальные из народа Израиля
  rationale: שְׁאָר обозначает оставшуюся часть. Формулировка «остальные из народа Израиля» естественна по-русски и передаёт противопоставление ранее перечисленным жителям Иерусалима.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Стандартное и точное обозначение священнического сословия.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Устоявшееся русское обозначение членов колена Левия, связанных с храмовым служением.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: во всех городах Иудеи
  rationale: Предлог בְּ здесь имеет местное значение; перевод прямо и естественно передаёт еврейскую конструкцию.
- source_word: אִישׁ
  choice: каждый
  rationale: Существительное в единственном числе употреблено распределительно. «Каждый» ясно передаёт эту функцию в современном русском языке.
- source_word: בְּנַחֲלָתוֹ
  choice: в своём наследственном владении
  rationale: נַחֲלָה обозначает полученное в наследие или по наделу земельное владение. Этот вариант сохраняет смысл наследственного удела и конкретного места проживания лучше, чем общее «собственность».
theological_decisions:
- issue: Передача распределительной формы мужского рода в единственном числе
  choice: каждый в своём наследственном владении
  alternative: каждый мужчина в своём наследственном владении
  rationale: Еврейское אִישׁ с местоименным суффиксом единственного числа имеет здесь распределительное значение. Русское «каждый в своём» сохраняет единственное число и распределительность, не навязывая более узкое указание исключительно на мужчин, которое в данном обороте не обязательно.
- issue: Восстановление подразумеваемого сказуемого
  choice: жили
  alternative: находились
  rationale: В еврейском именном предложении сказуемое не выражено, но из контекста расселения ясно подразумевается проживание. «Жили» естественно передаёт этот смысл, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; тире подчёркивает распределительное значение заключительной фразы.
