  language: ru
  text: Всего левитов в святом городе было двести восемьдесят четыре.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל
  choice: всего
  rationale: В данном перечне כָּל вводит итоговую численность группы; русское «всего» естественно передаёт суммарное значение.
- source_word: הַלְוִיִּם
  choice: левитов
  rationale: «Левиты» — общепринятое и точное обозначение данной группы; родительный падеж обусловлен русской конструкцией подсчёта «всего ... было».
- source_word: בְּעִיר
  choice: в ... городе
  rationale: Предлог בְּ обозначает местонахождение и прямо передаётся русским «в».
- source_word: הַקֹּדֶשׁ
  choice: святом
  rationale: Сочетание עִיר הַקֹּדֶשׁ буквально означает «город святости» и естественно передаётся традиционным выражением «святой город», сохраняющим сакральный смысл.
- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: двести восемьдесят четыре
  rationale: Еврейская последовательность числительных однозначно указывает число 284; число дано словами в соответствии с литературным стилем библейского текста. Связка «было» добавлена по нормам русского языка, поскольку в еврейском предложении глагол отсутствует.
