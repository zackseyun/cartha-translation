  text: וְ/הַ/שּֽׁוֹעֲרִים֙ עַקּ֣וּב טַלְמ֔וֹן וַ/אֲחֵי/הֶ֖ם הַ/שֹּׁמְרִ֣ים בַּ/שְּׁעָרִ֑ים מֵאָ֖ה שִׁבְעִ֥ים וּ/שְׁנָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/019.yaml
  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: ru
  text: 'И привратники: Аккув, Талмон и их братья[a], стоявшие на страже у ворот, — сто семьдесят два человека.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «их родственники»; еврейское слово «братья» может обозначать близких родственников либо членов той же группы.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: привратники
  rationale: Существительное обозначает людей, которым поручено охранять ворота и служить при них. «Привратники» — естественное и устойчивое русское обозначение этой должности.
- source_word: עַקּוּב
  choice: Аккув
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: טַלְמוֹן
  choice: Талмон
  rationale: Личное имя передано транслитерацией, естественной для русской библейской традиции.
- source_word: וַאֲחֵיהֶם
  choice: и их братья
  rationale: Сохранено основное значение слова אָח. В данном перечне оно может обозначать также близких родственников или членов той же служебной группы; эта неоднозначность отмечена в сноске.
- source_word: הַשֹּׁמְרִים
  choice: стоявшие на страже
  rationale: Причастие от שׁמר описывает постоянную обязанность охранять. Русское выражение естественно передаёт длительное несение караула.
- source_word: בַּשְּׁעָרִים
  choice: у ворот
  rationale: Предлог с существительным указывает на место несения службы. «У ворот» звучит естественно по-русски и соответствует контексту.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: сто семьдесят два человека
  rationale: Числительное передаёт общую численность; слово «человека» добавлено для естественности русского синтаксиса и не меняет смысла.
