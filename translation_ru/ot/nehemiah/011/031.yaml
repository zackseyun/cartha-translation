lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: А сыны Вениамина
  rationale: Буквальная форма «сыны Вениамина» сохраняет племенное обозначение и в данном перечне означает потомков, то есть членов колена Вениамина.
- source_word: מִגָּבַע
  choice: начиная от Гевы
  rationale: Предлог מִן обозначает исходную точку перечисления или области расселения. Формулировка «начиная от» передаёт это значение, не добавляя отсутствующего в еврейском тексте конечного пункта.
- source_word: מִכְמָשׂ
  choice: в Михмасе
  rationale: Использована традиционная русская передача топонима; падежная форма естественна после подразумеваемого и восстановленного по контексту глагола «жили».
- source_word: וְעַיָּה
  choice: Айе
  rationale: Топоним עַיָּה передан как «Айя» (в предложном падеже «Айе»), с сохранением отличия формы от более привычного названия «Гай»; возможное отождествление отмечено в сноске.
- source_word: וּבֵית אֵל
  choice: Вефиле
  rationale: Выбрана устоявшаяся в русской библейской традиции форма «Вефиль», поставленная в предложный падеж в соответствии с синтаксисом русского предложения.
- source_word: וּבְנֹתֶיהָ
  choice: и зависимых от него селениях
  rationale: Буквально «и его дочерях» — древнееврейская идиома, обозначающая подчинённые или прилегающие поселения. Перевод ясно выражает связь этих селений с Вефилем.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства историко-географического перечня. Глагол «жили» восстановлен из контекста раздела, поскольку в еврейском стихе он подразумевается. Пунктуация помогает показать, что «от Гевы» задаёт исходную точку, а последующие названия перечисляют места расселения.
