  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י עַל זֹ֑את וְ/אַל תֶּ֣מַח חֲסָדַ֗/י אֲשֶׁ֥ר עָשִׂ֛יתִי בְּ/בֵ֥ית אֱלֹהַ֖/י וּ/בְ/מִשְׁמָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: ru
  text: Помяни меня за это, Боже мой, и не изгладь моих верных дел[a], которые я совершил в доме Бога моего и в служении при нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моих дел верности», «моих милостей» или «моих дел заветной верности». Еврейское слово может обозначать доброту, милость, преданность или верность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и в исполнении его обязанностей» или «и в попечении о нём». Речь идёт о служении и порученных обязанностях, связанных с домом Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Помяни меня
  rationale: В контексте молитвенного обращения к Богу это естественная и вместе с тем возвышенная русская передача просьбы помнить говорящего.
- source_word: עַל זֹאת
  choice: за это
  rationale: Указывает на только что описанные действия Неемии и сохраняет возможный оттенок основания для просьбы.
- source_word: וְאַל תֶּמַח
  choice: и не изгладь
  rationale: Сохраняет метафору стирания из памяти или записи; «изгладь» уместно в современном литературном библейском регистре.
- source_word: חֲסָדַי
  choice: дел моей верности
  rationale: Множественная форма в сочетании с относительным предложением обозначает поступки, выражающие верность; формулировка сохраняет диапазон חסד, не сводя его лишь к добрым делам и не делая заветный оттенок более явным, чем в самом стихе.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: которые я совершил
  rationale: Прямая передача относительного предложения, относящегося к делам верности.
- source_word: בְּבֵית אֱלֹהַי
  choice: для дома моего Бога
  rationale: Хотя предлог может буквально означать «в», контекст описывает сделанное на благо и ради Божьего дома; «для» естественно выражает эту связь по-русски.
- source_word: וּבְמִשְׁמָרָיו
  choice: и для служения в нём
  rationale: מִשְׁמָר обозначает порученные обязанности, установленный порядок или служение, относящиеся к храму; местоименная связь с домом Бога передана оборотом «в нём».
theological_decisions:
- issue: Передача חֲסָדַי в молитве от первого лица
  choice: дел моей верности
  alternative: моих добрых дел; моих милостей; дел моей заветной верности
  rationale: Выражение описывает верные, преданные поступки Неемии по отношению к Божьему дому. Перевод сохраняет нравственно-религиозную весомость слова, но не вводит в основной текст более узкое толкование о заветной верности.
- issue: Возможный оттенок заслуги в просьбе Неемии
  choice: Сохранить прямую просьбу «Помяни меня… не изгладь»
  alternative: Смягчить самореферентную просьбу пересказом
  rationale: Еврейский текст прямо передаёт просьбу Неемии к Богу помнить его поступки; богословское напряжение не следует устранять переводом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. «Помяни» и «изгладь» сохраняют достоинство библейской речи, оставаясь понятными. Два примечания отмечены в основном тексте и сохраняют лексическую неоднозначность חסד и משמר.
