review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Неемия узнал о невыплате положенных левитам долей, вследствие чего левиты и певцы оставили служение и ушли на свои поля. Однако «разбежались каждый на своё поле» в русском языке излишне рисует беспорядочное, паническое рассеяние и звучит неестественно; исходный глагол ברח сохраняется точнее и идиоматичнее через «разошлись ... по своим полям» в данном контексте.'
  naturalness: «Положенные левитам доли» естественнее и яснее, чем «доли левитов», поскольку речь не о долях, принадлежащих левитам, а о причитавшемся им обеспечении. «Не были выданы» естественно передаёт пассивный перфект. Формулировка «разошлись каждый на своё поле» устранена как стилистически шероховатая.
  terminology: «Левиты» и «певцы» сохранены. «Положенные левитам доли» передаёт מְנָיוֹת без конфессионального расширения; в сноске дан допустимый вариант «содержание». «Работу» сохраняет широкое значение הַמְּלָאכָה.
  issues:
  - severity: medium
    issue: «Доли левитов» допускает неверное понимание как доли, принадлежащие левитам.
    rationale: Конструкция מְנָיוֹת הַלְוִיִּם обозначает обеспечение, назначенное левитам. Русское «положенные левитам доли» выражает это отношение яснее, не меняя смысла.
  - severity: medium
    issue: «Разбежались каждый на своё поле» неестественно и чрезмерно акцентирует хаотичное бегство.
    rationale: В контексте ухода с храмовой работы на собственные земли русское «разошлись каждый по своим полям» передаёт результат бегства/ухода без неуместного оттенка паники. Сноска сохраняет буквальную распределительную конструкцию.
  - severity: low
    issue: Сноска b содержит ненужное истолковательное пояснение «то есть каждый вернулся».
    rationale: В еврейском тексте не сказано «вернулся»; достаточно дать буквальное соответствие, не добавляя направление предыдущего движения.
