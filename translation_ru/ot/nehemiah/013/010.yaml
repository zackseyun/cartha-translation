base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: ru
  text: И я узнал, что положенные левитам доли[a] не были выданы; поэтому левиты и певцы, выполнявшие работу, разошлись каждый по своим полям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «положенное левитам содержание».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каждый — на своё поле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: И я узнал
  rationale: Форма глагола ידע здесь обозначает обнаружение Неемией сложившегося положения, а не просто обладание знанием.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: доли левитов
  rationale: מְנָיוֹת обозначает назначенные доли или содержание, полагавшееся левитам; краткая формулировка сохраняет конструкцию исходного текста.
- source_word: לֹא נִתָּנָה
  choice: не выдавались
  rationale: Передаёт пассивное значение נתן и по-русски естественно описывает регулярное предоставление положенного содержания; множественное согласование обусловлено словом «доли».
- source_word: וַיִּבְרְחוּ
  choice: разбежались
  rationale: Глагол ברח имеет сильное значение ухода или бегства; «разбежались» сохраняет его и одновременно естественно сочетается с распределительным «каждый».
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: каждый на своё поле
  rationale: 'Передаёт распределительную конструкцию буквально и понятно: каждый вернулся к собственному земельному участку.'
- source_word: וְהַמְשֹׁרְרִים
  choice: и певцы
  rationale: Точное обозначение храмовых певцов; храмовый контекст уже задан повествованием и не требует добавления определения.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: выполнявшие работу
  rationale: Сохраняет широкое значение причастной конструкции и не уточняет характер работы сверх еврейского текста.
