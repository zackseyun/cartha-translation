  yaml_path: translation/ot/nehemiah/013/008.yaml
  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: ru
  text: Мне это чрезвычайно не понравилось, и я выбросил из помещения[a] всё имущество Товии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт об одном из помещений храмового комплекса.
    reason: cultural_note
  - marker: b
    text: 'Или: «все вещи дома Товии». Еврейское выражение может обозначать предметы, утварь, принадлежности или имущество, связанное с домом либо хозяйством Товии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: Меня это крайне возмутило
  rationale: Еврейская безличная идиома буквально описывает нечто как весьма дурное для говорящего. Русское выражение естественно передаёт сильное неодобрение и эмоциональную реакцию Неемии, не сводя её только к печали.
- source_word: וָאַשְׁלִיכָה
  choice: я выбросил
  rationale: В данном сочетании с направлением наружу глагол שלך в породе хифиль означает решительное удаление посредством бросания; «выбросил» естественно и сохраняет силу действия.
- source_word: כָּל
  choice: все
  rationale: Передаёт полный охват предметов.
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: все вещи дома Товии
  rationale: 'כְּלִי имеет широкий диапазон значений: предметы, утварь, принадлежности, имущество. «Вещи» сохраняет эту широту, а «дома Товии» формально передаёт конструкцию בֵית טוֹבִיָּה и её возможную отнесённость к дому или хозяйству Товии.'
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: из помещения
  rationale: Направление наружу в русском уже выражено приставкой вы- в «выбросил». לִשְׁכָּה обозначает отдельное помещение в храмовом комплексе; нейтральное «помещение» понятно современному читателю и не уточняет без достаточного основания, была ли это кладовая.
