base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: ru
  text: Разве не так поступали ваши отцы, и наш Бог навёл за это на нас и на этот город всё это несчастье? А вы, оскверняя субботу, навлекаете на Израиль ещё больший гнев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא כֹה עָשׂוּ
  choice: Разве не так поступали
  rationale: Риторический вопрос ожидает утвердительного ответа; «так поступали» естественно передаёт сочетание כֹה с עשה.
- source_word: אֲבֹתֵיכֶם
  choice: ваши отцы
  rationale: Сохраняет прямое обозначение предшествующих поколений и библейскую семейно-историческую образность.
- source_word: וַיָּבֵא אֱלֹהֵינוּ
  choice: наш Бог навёл
  rationale: Каузативная форма בוא означает, что Бог навёл бедствие; субъект божественного суда сохранён без смягчения.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: всё это бедствие
  rationale: В контексте Божьего суда רָעָה обозначает постигшее народ несчастье или бедствие, а не моральное зло, совершённое Богом.
- source_word: וְאַתֶּם מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: А вы ещё усиливаете гнев на Израиль
  rationale: Причастие מוֹסִיפִים выражает продолжающееся усугубление; «ещё усиливаете» естественно передаёт добавочное действие, не уточняя сверх текста носителя гнева.
- source_word: לְחַלֵּל אֶת הַשַּׁבָּת
  choice: оскверняя субботу
  rationale: Инфинитив передаёт средство или обстоятельство, посредством которого усиливается гнев; деепричастие звучит естественно по-русски.
theological_decisions:
- issue: Значение רָעָה применительно к тому, что Бог навёл на народ и город
  choice: бедствие
  alternative: зло; несчастье
  rationale: Здесь слово обозначает карающее бедствие. Такой перевод сохраняет прямое утверждение о Божьем суде, не создавая ненужного впечатления, будто Бог совершает нравственное зло.
- issue: Субъект и характер חָרוֹן
  choice: гнев
  alternative: пылающий гнев; ярость
  rationale: Источник подразумевает гнев в контексте заветного суда, но в самой фразе обладатель гнева прямо не назван; перевод не добавляет «Божий» и сохраняет эту формальную недосказанность.
- issue: Связь прежнего греха с бедствием
  choice: не за это
  alternative: и наш Бог навёл
  rationale: Вопросительная конструкция охватывает последовательность поступка и суда; «за это» ясно передаёт причинную связь, подразумеваемую контекстом, не меняя содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; сохранены риторический вопрос, прямота Божьего суда и напряжённость предупреждения. «Суббота» написана со строчной буквы по современной русской норме.
