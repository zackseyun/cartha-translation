base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: ru
  text: И я сказал левитам, чтобы они очистились и пришли охранять ворота, чтобы освящать субботний день. Помяни и это мне во благо[a], Боже мой, и пощади меня по великой милости Твоей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помяни меня и за это, Боже мой». Еврейское выражение допускает смысловой акцент как на самом Неемии, так и на только что упомянутом деле, которое Бог должен учесть ему во благо.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское хесед означает милость, проявляющуюся в верной и неизменной любви.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: И я велел левитам
  rationale: אמר буквально означает «сказал», но в административном контексте речь идёт о распоряжении. «Велел» естественно передаёт силу высказывания, не усиливая её до формального приказа.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: очиститься
  rationale: Конструкция с היה и причастием выражает предписанное действие, а Hitpael указывает на очищение самих себя, вероятно обрядовое.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: и прийти стеречь ворота
  rationale: 'Сохраняется последовательность действий: левиты должны очиститься, прийти и нести охрану у ворот. «Стеречь» ясно выражает активную охрану.'
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: чтобы хранить святость субботнего дня
  rationale: קדשׁ означает освящать или сохранять отделённым как святое. Формулировка связывает охрану ворот с сохранением священного характера субботы и звучит естественно по-русски.
- source_word: גַּם זֹאת זָכְרָה לִּי
  choice: Помяни и это мне во благо
  rationale: Просительная форма זכר и дательный לִי выражают просьбу благосклонно учесть только что названное дело. «Помяни» сохраняет возвышенный молитвенный регистр, а «во благо» раскрывает бенефактивный смысл.
- source_word: וְחוּסָה עָלַי
  choice: и пощади меня
  rationale: חוס может означать пожалеть, проявить сострадание или пощадить. В молитвенной просьбе «пощади меня» кратко и точно сохраняет напряжение между упованием на совершённое дело и зависимостью от Божьей милости.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: по великой милости Твоей
  rationale: חסד обозначает верную, деятельную и милосердную любовь. Традиционное и понятное русское «милость» хорошо соответствует контексту просьбы о пощаде; определение «великая» передаёт רֹב.
theological_decisions:
- issue: Связь просьбы о поминовении с делом Неемии
  choice: Помяни и это мне во благо
  alternative: Помяни меня и за это
  rationale: Еврейское גַּם זֹאת זָכְרָה לִּי допускает смысловой акцент либо на деле («это»), либо на самом Неемии как получателе благоволения. Основной текст сохраняет указание на дело и явно передаёт бенефактивный оттенок, а примечание отмечает альтернативное членение смысла.
- issue: Передача חסד в молитве о пощаде
  choice: милость
  alternative: неизменная любовь; верная любовь
  rationale: В данном контексте просьбы глагол «пощади» естественно сочетается с «милостью». При этом примечание сохраняет более широкий смысл חסד как верной и неизменной любви Бога, не сводя слово лишь к снисхождению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Форма «помяни» сохранена как естественная для торжественной прямой речи к Богу; остальная фраза избегает архаической лексики. Заглавные буквы в местоимениях при обращении к Богу следуют принятой русской издательской норме.
