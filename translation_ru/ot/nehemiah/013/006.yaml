base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: ru
  text: Но всё это время меня не было в Иерусалиме, потому что в тридцать втором году правления Артаксеркса, царя Вавилона[a], я прибыл к царю, а спустя некоторое время[b] попросил у царя разрешения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «царь Вавилона». Этот титул сохранён без согласования с более широким контекстом Персидской империи.'
    reason: source_text_clarification
  - marker: b
    text: 'Буквально: «по окончании дней»; то есть по прошествии некоторого времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: Но всё это время
  rationale: Сочетание задаёт временные рамки описанных событий и одновременно противопоставляет им отсутствие Неемии; такой перевод естественно передаёт обе функции.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: меня не было в Иерусалиме
  rationale: Естественная для современного русского языка формулировка, точно выражающая отсутствие говорящего.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему Неемии не было в Иерусалиме.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם
  choice: в тридцать второй год
  rationale: Обычная русская передача датировки по году правления.
- source_word: לְאַרְתַּחְשַׁסְתְּא
  choice: Артаксеркса
  rationale: Традиционная русская форма имени персидского царя.
- source_word: מֶלֶךְ בָּבֶל
  choice: царя Вавилона
  rationale: Перевод следует написанному в еврейском тексте и не заменяет титул исторически ожидаемым выражением «царь Персии».
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: я прибыл к царю
  rationale: Глагол בוא допускает значения движения «приходить/прибывать»; «прибыл к царю» естественно передаёт прибытие Неемии ко двору, не уточняя направление сверх текста.
- source_word: וּלְקֵץ יָמִים
  choice: спустя некоторое время
  rationale: Буквальное «по окончании дней» здесь обозначает неопределённый промежуток времени; выбранный вариант передаёт идиоматический смысл.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: попросил у царя разрешения
  rationale: Форма глагола в данном контексте означает просьбу об отпуске или позволении; перевод не уточняет цель разрешения и не утверждает явно, что просьба была удовлетворена.
