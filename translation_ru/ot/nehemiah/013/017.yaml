base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: ru
  text: 'Тогда я укорил знатных людей Иудеи и сказал им: «Что это за злое дело вы творите, оскверняя день субботний[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нарушая» или «оскверняя». Еврейский глагол означает обращаться со святым как с обычным, тем самым оскверняя его.'
    reason: Лексическая альтернатива поясняет смысловое поле глагола חלל.
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: Тогда я укорил
  rationale: Глагол ריב здесь передаёт резкое обличение или вступление в спор. «Укорил» естественно звучит по-русски и сохраняет направленную против виновных обвинительную силу, не превращая сцену в формальное судебное разбирательство; «тогда» передаёт повествовательную последовательность.
- source_word: חֹרֵי יְהוּדָה
  choice: знатных людей Иудеи
  rationale: חֹרִים обозначает представителей знати, влиятельных людей общества. «Знатные люди» ясно и современно передаёт их общественное положение.
- source_word: וָאֹמְרָה לָהֶם
  choice: и сказал им
  rationale: Прямо передаёт продолжение повествования и адресованность речи.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Что это за зло вы делаете
  rationale: Краткая русская конструкция сохраняет вопросительное обличение и нравственную силу רָע; причастие עֹשִׂים передано формой настоящего времени как продолжающееся действие.
- source_word: וּמְחַלְּלִים
  choice: оскверняя
  rationale: В данном контексте חלל означает обращаться со святым как с обыденным, лишать его священного статуса. «Оскверняя» сохраняет религиозно-нравственный вес слова.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: день субботний
  rationale: Естественное для литературного русского языка сочетание, сохраняющее оба элемента еврейского выражения — «день» и «суббота».
theological_decisions:
- issue: Передача нарушения святости субботы
  choice: оскверняя день субботний
  alternative: нарушая день субботний; попирая святость субботнего дня
  rationale: Еврейский глагол подчёркивает не просто нарушение предписания, а обращение со святым как с обычным. «Оскверняя» сохраняет эту богословскую напряжённость, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для широкой аудитории; обвинительный тон и представление о святости субботы сохранены.
