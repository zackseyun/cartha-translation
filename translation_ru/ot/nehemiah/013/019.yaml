  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: ru
  text: Когда перед субботой ворота Иерусалима стали погружаться в сумрак[a], я велел запереть створки и приказал не открывать их до окончания субботы. Я поставил у ворот нескольких своих слуг[b], чтобы в субботний день никакой груз[c] не вносили в город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда на ворота Иерусалима стали ложиться вечерние тени».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нескольких своих приближённых». Слово может обозначать людей из личной свиты Неемии.'
    reason: lexical_alternative
  - marker: c
    text: Судя по контексту, речь может идти в том числе о товарах, которые вносили в город для торговли.
    reason: cultural_note
lexical_decisions:
- source_word: צָלֲלוּ
  choice: стало окутывать сумраком
  rationale: Глагол описывает наступление вечерней темноты перед началом субботы. Формулировка естественна по-русски и сохраняет образ затемняющихся ворот, не сводя его к однозначному толкованию.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: ворота Иерусалима
  rationale: Прямая и естественная передача еврейской сопряжённой конструкции.
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: перед субботой
  rationale: Фраза обозначает время непосредственно перед наступлением субботы.
- source_word: וָאֹמְרָה
  choice: я велел / приказал
  rationale: Хотя буквально глагол означает «сказал», в данном административном контексте речь идёт о распоряжениях Неемии.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: запереть створки
  rationale: У городских ворот имеются створки; «запереть» естественно передаёт требуемое закрытие, а инфинитив зависит от «велел».
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  choice: не открывать их
  rationale: Сохраняет прямое указание на створки и запрет, выраженный в исходном тексте.
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: до окончания субботы
  rationale: Естественная русская передача буквального «до времени после субботы».
- source_word: וּמִנְּעָרַי
  choice: нескольких своих слуг
  rationale: В окружении правителя נְעָרִים может обозначать личных слуг или сопровождающих, не обязательно молодых по возрасту.
- source_word: הֶעֱמַדְתִּי
  choice: поставил
  rationale: В контексте охраны ворот означает назначение людей на пост.
- source_word: עַל הַשְּׁעָרִים
  choice: у ворот
  rationale: Идиоматично передаёт размещение людей возле городских ворот для контроля входа.
- source_word: לֹא יָבֹא מַשָּׂא
  choice: чтобы никакой груз не вносили в город
  rationale: Передаёт цель распоряжения и движение груза через ворота; слова «в город» ясно выражают подразумеваемое направление.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: в субботний день
  rationale: Сохраняет явное упоминание дня в еврейском тексте.
theological_decisions:
- issue: Передача שַׁבָּת
  choice: суббота
  alternative: день покоя
  rationale: Здесь имеется в виду конкретная еженедельная суббота в жизни Израиля, а не день отдыха вообще; традиционный русский термин сохраняет историческую и богословскую определённость.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Административная сила повторённого глагола «сказать» передана словами «велел» и «приказал»; историческая реалия субботы сохранена без конфессиональных уточнений.
