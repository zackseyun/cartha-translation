  text: И вся Иудея принесла в хранилища десятину зерна, молодого вина и масла.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: И вся Иудея
  rationale: Сочетание כָּל с названием Иудеи имеет собирательный смысл и обозначает всё сообщество жителей; естественная русская формулировка сохраняет также буквальную форму топонима.
- source_word: הֵבִיאוּ
  choice: приносила
  rationale: Каузативная форма глагола בוא означает «приносить, доставлять». Несовершенный вид по-русски естественно передаёт происходившее тогда общее действие народа, а направление выражено оборотом «в хранилища».
- source_word: מַעְשַׂר
  choice: десятину
  rationale: Это обычное древнееврейское обозначение десятины. Единственное число сохранено как собирательное.
- source_word: הַ/דָּגָן
  choice: зерна
  rationale: דָּגָן обозначает зерновые продукты в широком смысле; «зерно» — ясный современный русский эквивалент.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: молодого вина
  rationale: תִּירוֹשׁ обозначает новое, свежее вино и отличается от более общего יַיִן; «молодое вино» естественно сохраняет это различие.
- source_word: וְ/הַ/יִּצְהָר
  choice: масла
  rationale: יִצְהָר в перечнях сельскохозяйственных продуктов обычно означает свежее масло, как правило оливковое. Краткое «масло» не добавляет уточнения, прямо не выраженного в стихе.
- source_word: לָ/אוֹצָרוֹת
  choice: в хранилища
  rationale: אוֹצָרוֹת может означать кладовые, хранилища или сокровищницы; контекст зерна, вина и масла указывает на помещения для хранения припасов.
