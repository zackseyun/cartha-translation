  register: Современный литературный русский язык; изложение краткое и торжественно-нейтральное. Согласование «вся Иудея приносила» сохраняет собирательную метонимию оригинала. Лексическая неоднозначность אוֹצָרוֹת разрешена контекстом без необходимости сноски.
