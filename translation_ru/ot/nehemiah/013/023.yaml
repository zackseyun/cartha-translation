base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: ru
  text: Также в те дни я увидел, что иудеи[a] брали себе в жёны[b] женщин из Ашдода, Аммона и Моава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евреи»; возможно также понимание: «жители Иудеи».'
