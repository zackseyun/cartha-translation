    text: 'Буквально: «поселили у себя женщин»; здесь это древнееврейское выражение означает, что они взяли этих женщин в жёны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Также
  rationale: Передаёт добавочное значение слова и естественно связывает это наблюдение с предыдущим рассказом о реформах Неемии.
- source_word: בַּיָּמִים הָהֵם
  choice: в те дни
  rationale: Сохраняет обычное древнееврейское обозначение обсуждаемого периода и соответствует литературной русской речи.
- source_word: רָאִיתִי
  choice: я увидел
  rationale: Сохраняет прямое значение глагола и характер личного свидетельства Неемии.
- source_word: אֶת הַיְּהוּדִים
  choice: иудеи
  rationale: Передаёт название послепленной общины, связанной с Иудеей; возможное более широкое этнорелигиозное понимание «евреи» отмечено в сноске.
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: женились на женщинах
  rationale: Буквально конструкция связана с поселением женщин, но в данном контексте это идиома вступления в брачный союз. Русская формулировка ясно передаёт смысл, не добавляя оценки.
- source_word: אשדודיות עמוניות מוֹאֲבִיּוֹת
  choice: женщинах из Ашдода, Аммона и Моава
  rationale: Естественно передаёт три женских этнико-географических обозначения и избегает тяжеловесных форм «ашдодитянки, аммонитянки и моавитянки».
theological_decisions:
- issue: Значение הַיְּהוּדִים
  choice: иудеи
  alternative: евреи; жители Иудеи
  rationale: Форма может обозначать как связанную с Иудеей общину, так и еврейский народ в этнорелигиозном смысле. Основной вариант сохраняет историко-географическую окраску, а сноска отмечает более широкое понимание.
- issue: Идиоматическое значение הֹשִׁיבוּ נָשִׁים
  choice: женились на женщинах
  alternative: поселили у себя женщин; взяли себе жён
  rationale: Контекст последующих стихов ясно указывает на браки. Перевод передаёт это контекстуальное значение, тогда как сноска сохраняет сведения о необычной буквальной форме выражения.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Формулировка сохраняет личный тон рассказа Неемии; этнографическая и идиоматическая неоднозначность вынесена в сноски.
