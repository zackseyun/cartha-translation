  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: ru
  text: Когда они услышали Закон, то отделили от Израиля всю смешанную группу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех людей смешанного происхождения»; возможно также: «всю смешанную общину». Еврейское עֵרֶב — собирательное название смешанной группы людей.'
    reason: Лексическая неоднозначность собирательного существительного עֵרֶב.
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Когда они услышали
  rationale: Конструкция с וַיְהִי и כְּ перед инфинитивом вводит следующее по времени событие. Русское «когда они услышали» естественно передаёт повествовательную последовательность без ненужного буквализма.
- source_word: הַתּוֹרָה
  choice: Закон
  rationale: В данном послепленном контексте речь идёт о публично прочитанном авторитетном Законе Моисея. Написание с прописной буквы показывает, что имеется в виду определённый свод священного наставления, а не закон вообще.
- source_word: וַיַּבְדִּילוּ
  choice: отделили
  rationale: Глагол בדל означает отделять или обособлять. Выбор сохраняет прямой смысл действия и не усиливает его более интерпретирующим словом «изгнали».
- source_word: כָל עֵרֶב
  choice: всё смешанное сообщество
  rationale: 'עֵרֶב — собирательное обозначение смешанной группы. Формулировка сохраняет собирательность и неоднозначность: сам стих не уточняет прямо, определяется ли группа происхождением, этнической принадлежностью или присоединением к общине.'
- source_word: מִיִּשְׂרָאֵל
  choice: от Израиля
  rationale: Предлог מן обозначает отделение, а имя יִשְׂרָאֵל сохранено как название заветного сообщества без поясняющего парафраза.
theological_decisions:
- issue: Значение имени «Израиль» в контексте послепленного очищения общины
  choice: Сохранить «Израиль» как обозначение сообщества
  alternative: «от израильтян» или «от общины Израиля»
  rationale: В еврейском тексте стоит собственное имя יִשְׂרָאֵל. Его сохранение удерживает корпоративный и заветный оттенок, не навязывая более узкого этнического или институционального толкования.
- issue: Кого обозначает עֵרֶב
  choice: 'Передать собирательно и сохранить неоднозначность: «смешанное сообщество»'
  alternative: «иноплеменников» или «людей смешанного происхождения»
  rationale: Контекст связывает действие с запретом относительно аммонитян и моавитян, однако само слово עֵרֶב обозначает смешанную группу и не формулирует точный критерий принадлежности. Поэтому основной текст не сводит значение исключительно к этничности или происхождению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис простой и ясный; ключевые заветные термины сохранены без конфессионального уточнения.
