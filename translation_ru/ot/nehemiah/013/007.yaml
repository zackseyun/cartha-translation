base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: ru
  text: Когда я пришёл в Иерусалим, то понял, какое зло совершил Эльяшив, устроив для Товии комнату[a] во дворах дома Божьего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помещение»; еврейское слово обозначает комнату или отдельное помещение в храмовом комплексе.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Божий» — то есть храм.
    reason: cultural_note
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: Когда я пришёл в Иерусалим
  rationale: Последовательная повествовательная форма с בוא в данном контексте естественно передаётся временной конструкцией; предлог ל обозначает направление.
- source_word: וָאָבִינָה
  choice: то понял
  rationale: Форма от בין выражает понимание или осознание; частица «то» естественно связывает его с придаточным времени.
- source_word: בָרָעָה
  choice: какое зло
  rationale: רָעָה даёт прямую нравственную оценку поступку. Конструкция «понял, какое зло» естественна по-русски и сохраняет эту силу.
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: сделал Эльяшив ради Товии
  rationale: Относительная конструкция указывает на совершённый поступок, а ל при имени Товии обозначает действие в его пользу. «Ради» ясно передаёт бенефактивный смысл, не утверждая передачи помещения в собственность.
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: он устроил для него комнату
  rationale: Инфинитив раскрывает содержание злого поступка. «Устроил» уместно для выделения или подготовки помещения, а «комната» — современный общий эквивалент נִשְׁכָּה без чрезмерно узкого значения «кладовая».
- source_word: בְּחַצְרֵי בֵּית הָאֱלֹהִים
  choice: во дворах дома Божьего
  rationale: Сохраняются множественное число חצרי и буквальный образ «дома Божьего», который в контексте обозначает храм.
theological_decisions:
- issue: Нравственная оценка поступка Эльяшива
  choice: «какое зло»
  alternative: «какой дурной поступок» / «какую несправедливость»
  rationale: Текст прямо называет действие רָעָה; перевод сохраняет нравственную весомость, не поясняя сверх исходного текста, в чём именно состояла вина.
- issue: Значение выражения «дом Божий»
  choice: Сохранить «дом Божий» в тексте и пояснить храм в сноске
  alternative: Перевести непосредственно «храм Божий»
  rationale: Буквальный образ исходного выражения понятен по-русски и богословски значим; сноска обеспечивает культурную ясность без замены образа.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Имена переданы как «Эльяшив» и «Товия» в форме, близкой к еврейскому звучанию. Маркеры сносок поставлены непосредственно после поясняемых выражений.
