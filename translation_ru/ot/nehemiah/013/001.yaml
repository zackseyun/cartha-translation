  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: ru
  text: 'В тот день народу читали из книги Моисея[a] и нашли, что в ней написано: ни аммонитянин, ни моавитянин не должен входить в собрание Божье[b] вовеки[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свитка Моисея». Еврейское слово может обозначать книгу или свиток.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «общину Бога».'
    reason: lexical_alternative
  - marker: c
    text: То есть «навсегда» или «во все времена».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Естественно и точно обозначает конкретный день, о котором говорит повествование.
- source_word: נִקְרָא בְּסֵפֶר מֹשֶׁה
  choice: народу читали из книги Моисея
  rationale: Безличная русская конструкция передаёт пассивно-безличный смысл נִקְרָא; предлог בְ при глаголе чтения естественно передан как «из», то есть читали содержание книги.
- source_word: בְּאָזְנֵי הָעָם
  choice: народу
  rationale: Еврейская идиома буквально означает «в уши народа»; дательный падеж естественно передаёт публичное чтение, предназначенное для слушания народом.
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: и нашли, что в ней написано
  rationale: Идиоматичная русская формулировка сохраняет смысл обнаружения письменного предписания в книге.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: аммонитянин и моавитянин
  rationale: Сохраняет соединительный союз исходного текста; под отрицанием запрет относится к представителю каждого из двух народов.
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: в собрание Божье
  rationale: «Собрание» прямо и нейтрально передаёт קָהָל, не привнося более позднюю церковную терминологию.
- source_word: עַד עוֹלָם
  choice: вовеки
  rationale: Кратко и торжественно передаёт постоянный характер запрета, сохраняя библейское достоинство речи и оставаясь понятным современному читателю.
theological_decisions:
- issue: Значение בִּקְהַל הָאֱלֹהִים
  choice: в собрание Божье
  alternative: в общину Бога
  rationale: Выбранный вариант сохраняет образ собранного Божьего сообщества и форму принадлежности Богу, не отождествляя его автоматически с более поздним понятием церкви.
- issue: Сила עַד עוֹלָם в формуле исключения
  choice: не должен входить ... вовеки
  alternative: никогда не должен входить
  rationale: «Вовеки» сохраняет формально неограниченную длительность исходной правовой формулы, не пытаясь согласовать или ограничить её богословски.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественной русской безличной конструкции, при этом сохранены юридическая сила запрета и лексическая неоднозначность ключевых выражений.
