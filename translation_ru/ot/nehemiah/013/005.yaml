  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: ru
  text: Он устроил для него большое помещение[a], где прежде обычно складывали[b] хлебное приношение, ладан, храмовую утварь и десятину зерна, молодого вина и масла — положенную долю левитов, певцов и привратников[c], — а также приношение для священников[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «большую кладовую». Еврейское слово может обозначать помещение при храме, использовавшееся для хранения.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская конструкция выражает обычное действие в прошлом: «там прежде имели обыкновение складывать».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «заповедь левитов, певцов и привратников»; по смыслу речь идёт о предписанной им доле.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «возношение для священников», то есть особо отделённое приношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: Он устроил для него
  rationale: Глагол עשה с ל может означать «сделал/приготовил для него». «Устроил» естественно передаёт подготовку помещения, не уточняя сверх текста способ переоборудования.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: большое помещение
  rationale: לשכה обозначает отдельное помещение при храмовом комплексе, нередко служившее кладовой. Нейтральное «помещение» сохраняет архитектурный смысл, а складское назначение раскрывается контекстом и сноской.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: где прежде обычно складывали
  rationale: Конструкция היה с причастием указывает на обычное действие в прошлом; לְפָנִים означает «прежде». «Складывали» естественно для перечисленных запасов и утвари.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В храмовом контексте מנחה обозначает приношение из зерновых продуктов. «Хлебное приношение» — понятный русский библейский термин, не сужающий его до необработанного зерна.
- source_word: הַלְּבוֹנָה
  choice: ладан
  rationale: לבונה в культовом контексте означает благовонный ладан.
- source_word: הַכֵּלִים
  choice: храмовая утварь
  rationale: כלים — сосуды, орудия и иные предметы храмового служения. «Храмовая утварь» естественно передаёт собирательное значение в данном контексте.
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: десятину зерна, молодого вина и масла
  rationale: מעשר — установленная десятая доля; דגן, תירוש и יצהר образуют обычную библейскую триаду. «Молодое вино» сохраняет специфику תירוש, тогда как для יצהר здесь достаточно «масло».
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: положенную долю левитов, певцов и привратников
  rationale: Буквальная конструкция с מצוה эллиптична и в перечне запасов указывает на предписанное содержание этих служителей. «Положенная доля» ясно передаёт смысл, а буквальная форма отмечена в сноске.
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: приношение для священников
  rationale: תרומה означает отделённое приношение или взнос. «Приношение» понятно современному читателю и сохраняет культовый оттенок; направление «для священников» соответствует конструктивной связи.
theological_decisions:
- issue: Связь слова מִצְוַת с десятиной и храмовыми служителями
  choice: положенную долю левитов, певцов и привратников
  alternative: заповедь о левитах, певцах и привратниках
  rationale: Контекст хранимой десятины поддерживает понимание как предписанной им доли, но необычная буквальная конструкция сохранена в сноске, чтобы не скрывать грамматическое напряжение.
- issue: Значение תְרוּמָה
  choice: приношение для священников
  alternative: возношение для священников
  rationale: Текст говорит об отделённом для священников приношении; более специальный ритуальный термин возможен, но не обязателен и отмечен в сноске без привнесения конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной храмовой лексикой. Синтаксис сохраняет последовательность еврейского перечня, но проясняет его связи тире; спорные эллиптические и культовые выражения не догматизируются и снабжены краткими сносками.
