base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: ru
  text: 'Я вступил с ними в спор, проклял их[a], ударил некоторых из них и вырвал у них волосы. Затем я заставил их поклясться Богом: «Не отдавайте своих дочерей за их сыновей[b] и не берите их дочерей ни за своих сыновей, ни за себя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подверг их проклятию».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если отдадите… и если возьмёте…»; в составе клятвы эта формула выражает запрет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיב
  choice: Я вступил с ними в спор
  rationale: Глагол ריב обозначает спор, противоборство или предъявление обвинения. Эта формулировка сохраняет конфронтационный оттенок и естественно звучит по-русски.
- source_word: וָאֲקַלְלֵם
  choice: проклял их
  rationale: Обычное значение קלל в данном контексте — произнести проклятие; перевод не смягчает действие до простого порицания или брани.
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: некоторых из них побил
  rationale: Конструкция с מן указывает на часть группы. «Побил» прямо передаёт физическое воздействие, не добавляя не обозначенной в тексте степени тяжести.
- source_word: וָאֶמְרְטֵם
  choice: вырвал у них волосы
  rationale: מרט означает вырывать или выщипывать волосы. Подразумеваемый объект естественно выражен в русском тексте явно.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: заставил их поклясться Богом
  rationale: Каузативная форма שבע означает заставить кого-либо поклясться, а предлог ב вводит того, кем клянутся.
- source_word: אִם תִּתְּנוּ
  choice: Не отдавайте
  rationale: В контексте клятвы אִם вводит запретительное содержание. Русский императив ясно передаёт запрет, тогда как буквальное «если» затемнило бы его функцию.
- source_word: בְּנֹתֵיכֶם לִבְנֵיהֶם
  choice: своих дочерей за их сыновей
  rationale: Русская брачная формула «отдавать дочь за кого-либо» точно и естественно передаёт направление брачного союза.
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: и не берите их дочерей
  rationale: נשא в брачном контексте означает брать в жёны. Дальнейшие дополнения делают брачный смысл в русском тексте однозначным.
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: ни за своих сыновей, ни за себя
  rationale: Фраза распространяет запрет и на браки сыновей, и на браки самих адресатов; парное «ни… ни…» естественно для русского запрета.
theological_decisions:
- issue: Передача суровых дисциплинарных действий Неемии без смягчения или усиления
  choice: Прямо сообщить о проклятии, побоях и вырывании волос
  alternative: Смягчить действия до словесного порицания либо усилить описание насилия
  rationale: Текст прямо повествует о суровых действиях Неемии. Перевод не должен ни оправдывать или скрывать их, ни приписывать им большую жестокость, чем выражено в еврейском тексте.
- issue: Значение клятвенной формулы с אִם
  choice: 'Передать содержание как прямой запрет: «Не отдавайте… и не берите…»'
  alternative: Сохранить буквальную условную конструкцию «если отдадите… и если возьмёте…»
  rationale: После сообщения о приведении к клятве אִם функционирует как часть запретительной клятвенной формулы. Прямой запрет естественно передаёт её смысл в современном русском языке.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; резкость описанных действий сохранена без стилистического нагнетания.
