  text: וּ/בְנֵי/הֶ֗ם חֲצִי֙ מְדַבֵּ֣ר אַשְׁדּוֹדִ֔ית וְ/אֵינָ֥/ם מַכִּירִ֖ים לְ/דַבֵּ֣ר יְהוּדִ֑ית וְ/כִ/לְשׁ֖וֹן עַ֥ם וָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: ru
  text: 'А дети их: половина говорила по-ашдодски[a]; они не умели говорить по-иудейски, а говорили на языках разных народов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорила на языке Ашдода».'
    reason: Название אַשְׁדּוֹדִית может быть передано как наречием «по-ашдодски», так и описательно — «на языке Ашдода».
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: их детей
  rationale: בנים может означать «сыновья», но здесь обозначает потомство смешанных семей в целом; «дети» естественно передаёт этот смысл без неоправданного ограничения только мужским полом.
- source_word: חֲצִי
  choice: половина
  rationale: Форма указывает на часть детей; согласование сказуемого в единственном числе соответствует еврейскому тексту и нормам русского языка.
- source_word: מְדַבֵּר
  choice: говорила
  rationale: Причастие описывает устойчивую речевую практику или способность; в русском повествовании это естественно передаётся прошедшим временем.
- source_word: אַשְׁדּוֹדִית
  choice: по-ашдодски
  rationale: Женская форма названия принадлежности обозначает язык или речь Ашдода; наречная форма ясна и не уточняет сверх текста, был ли это отдельный язык или местная разновидность речи.
- source_word: וְאֵינָם מַכִּירִים
  choice: и не умела
  rationale: В сочетании с инфинитивом מכיר выражает отсутствие знания или практического умения; «не умела» сохраняет связь со знанием языка и естественно звучит по-русски.
- source_word: לְדַבֵּר יְהוּדִית
  choice: говорить по-иудейски
  rationale: יְהוּדִית буквально обозначает речь Иудеи или иудеев. Перевод не отождествляет её прямо с древнееврейским языком, поскольку исходный текст этого не уточняет.
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: а говорила на языке того или иного народа
  rationale: Повтор עַם וָעָם имеет распределительное значение. Добавленное по смыслу «говорила» делает эллиптическую конструкцию понятной по-русски, а «того или иного народа» сохраняет указание на разные языки окружающих народов без добавления отсутствующего в тексте слова «только».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской интонацией. Названия языков переданы наречными формами «по-ашдодски» и «по-иудейски»; сохранена неопределённость исходного текста относительно точной языковой классификации.
