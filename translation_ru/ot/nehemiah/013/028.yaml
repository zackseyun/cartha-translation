reference: Nehemiah 13:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֨י יוֹיָדָ֤ע בֶּן אֶלְיָשִׁיב֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל חָתָ֖ן לְ/סַנְבַלַּ֣ט הַ/חֹרֹנִ֑י וָ/אַבְרִיחֵ֖/הוּ מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: ru
  text: И один из сыновей Иоиады, сына первосвященника Елиашива, был зятем Санаваллата хоронитянина[a], и я прогнал его от себя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «был связан брачным родством с Санаваллатом». Еврейское слово может обозначать брачного родственника вообще, но в данном контексте наиболее естественно понимать его как «зять».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «заставил его бежать» или «изгнал его». Еврейский глагол подчёркивает принудительное удаление, но не уточняет, какую именно административную форму оно приняло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: И один из сыновей
  rationale: 'Предлог מִן при множественном числе выражает здесь часть целого: речь идёт об одном из сыновей, а не о пространственном удалении.'
- source_word: יוֹיָדָע
  choice: Иоиада
  rationale: Традиционная и узнаваемая русская передача еврейского личного имени.
- source_word: בֶּן אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: сына первосвященника Елиашива
  rationale: Сохраняет родословную связь и естественно относит титул «первосвященник» к Елиашиву, как подсказывает синтаксис и контекст.
- source_word: חָתָן לְסַנְבַלַּט
  choice: был зятем Санаваллата
  rationale: В данном контексте חָתָן естественнее всего обозначает зятя, хотя само слово может шире указывать на брачное родство.
- source_word: הַחֹרֹנִי
  choice: хоронитянина
  rationale: Естественная русская форма обозначения человека по месту происхождения; она сохраняет географический эпитет.
- source_word: וָאַבְרִיחֵהוּ
  choice: и я прогнал его
  rationale: Порода хифиль глагола ברח означает заставить уйти или бежать; «прогнал» передаёт принудительный характер действия, не уточняя его административную форму.
- source_word: מֵעָלָי
  choice: от себя
  rationale: Идиоматическая передача удаления из присутствия или сферы влияния Неемии; значение удаления уже выражено глаголом «прогнал».
