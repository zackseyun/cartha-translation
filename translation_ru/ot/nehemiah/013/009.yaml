base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: ru
  text: Тогда я распорядился[a], чтобы помещения очистили[b], и вернул туда утварь дома Божьего, а также хлебное приношение и ладан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тогда я сказал»; или: «Тогда я повелел». В еврейском тексте буквально стоит «я сказал», но из контекста ясно, что речь идёт об исполненном распоряжении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совершили очищение помещений». Еврейский глагол может подразумевать не только физическую уборку, но и обрядовое очищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Тогда я распорядился
  rationale: Буквально глагол означает «я сказал», но в данном контексте слова Неемии представляют собой распоряжение, которое было исполнено. Перевод естественно передаёт контекстуальную силу высказывания, а «тогда» отражает повествовательную последовательность.
- source_word: וַיְטַהֲרוּ
  choice: чтобы помещения очистили
  rationale: Глагол טהר может обозначать как обрядовое очищение, так и удаление нечистоты. «Очистили» сохраняет обе возможности лучше, чем исключительно бытовое «убрали».
- source_word: הַלְּשָׁכוֹת
  choice: помещения
  rationale: לשכה обозначает комнаты или помещения при храме. «Помещения» понятно современному читателю и не сужает значение до кладовых.
- source_word: וָאָשִׁיבָה שָּׁם
  choice: и вернул туда
  rationale: Форма от שוב имеет каузативный смысл «возвратить, принести обратно». Русское «вернул туда» ясно передаёт возвращение ранее вынесенных предметов и наречие שׁם.
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: принадлежности дома Божьего
  rationale: כְּלִי — широкое обозначение предметов, утвари или сосудов. «Принадлежности» не ограничивает речь только сосудами и сохраняет выражение «дом Божий».
- source_word: אֶת הַמִּנְחָה
  choice: а также хлебное приношение
  rationale: В культовом контексте מִנְחָה обозначает приношение из продуктов земли, обычно зерна или муки. Традиционное русское «хлебное приношение» передаёт специальный культовый смысл; «а также» показывает, что оно было возвращено вместе с храмовыми принадлежностями.
- source_word: וְהַלְּבוֹנָה
  choice: и ладан
  rationale: לְבוֹנָה означает именно ладан, а не благовония вообще.
